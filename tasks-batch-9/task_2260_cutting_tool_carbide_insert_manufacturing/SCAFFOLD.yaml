    path: "/tooling/customers"
    description: "List customers, filterable by tier and account status."
    roles: [ProductionPlanner, ApplicationEngineer, QualityApprover]
    code: 200
    input: ["tier?", "account_status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/tooling/customers/{customerId}/credit-adjustments"
    description: "Post a signed adjustment to the customer's regrind credit balance; a negative resulting balance forces a credit hold and a positive one lifts it."
    roles: [ProductionPlanner]
    code: 200
    input: [delta_cents, reason]
    output: Customer
    side_effects: ["regrind_credit_cents adjusted by delta_cents", "CASCADE HOP 1->2: account_status becomes CREDIT_HOLD when the resulting balance is negative", "CASCADE HOP 2->3: every SUBMITTED or ENGINEERING_REVIEW ToolOrder of this customer moves to ON_HOLD with hold_reason=CREDIT_HOLD", "the reverse path: a balance restored to 0 or above returns the account to ACTIVE and returns its ON_HOLD orders to SUBMITTED", "version bumped"]

  - method: POST
    path: "/tooling/customers/{customerId}/close"
    description: "Close a customer account permanently."
    roles: [ProductionPlanner]
    code: 200
    input: [close_reason]
    output: Customer
    side_effects: ["account_status=CLOSED (terminal)", "every ToolOrder of this customer in DRAFT, SUBMITTED, ENGINEERING_REVIEW or ON_HOLD is CANCELLED", "version bumped"]

  # ---------------------------------------------------------------- ToolOrder
  - method: POST
    path: "/tooling/tool-orders"
    description: "Raise a draft order for a tool product; the caller must pin the product version it quoted against."
    roles: [Customer, ApplicationEngineer]
    code: 201
    input: [customer_id, product_id, order_code, quantity, "expedite_requested?", expected_product_version]
    output: ToolOrder
    side_effects: ["status=DRAFT", "order_class copied from the product", "requires_reconfirmation=false", "product.version bumped (the quoted product is now pinned by an order)"]

  - method: GET
    path: "/tooling/tool-orders/{orderId}"
    description: "Read one order with its pricing, promised lead time and hold reason."
    roles: [Customer, ApplicationEngineer, ProductionPlanner, QualityApprover]
    code: 200
    output: ToolOrder
    side_effects: []

  - method: GET
    path: "/tooling/tool-orders"
    description: "List orders, filterable by customer, product and status; the reverse-reachability channel for Customer -> ToolOrder and ToolProduct -> ToolOrder."
    roles: [Customer, ApplicationEngineer, ProductionPlanner, QualityApprover]
    code: 200
    input: ["customer_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ToolOrder[]
    side_effects: []

  - method: POST
    path: "/tooling/tool-orders/{orderId}/submit"
    description: "Submit a DRAFT order; prices it and routes SPECIAL orders straight into engineering review."
    roles: [Customer, ApplicationEngineer]
    code: 200
    output: ToolOrder
    side_effects: ["order_price computes per_unit_net_cents and total_price_cents", "promised_lead_time_days copied from the product's engineering_lead_time_days plus 5 review days for SPECIAL orders", "status=SUBMITTED for CATALOG orders and ENGINEERING_REVIEW for SPECIAL orders", "product.open_order_units increased by quantity", "version bumped"]

  - method: POST
    path: "/tooling/tool-orders/{orderId}/confirm"
    description: "Confirm a SUBMITTED or ENGINEERING_REVIEW order for production; re-checks that grade, geometry, coating and revision pins are all current."
    roles: [ApplicationEngineer, ProductionPlanner]
    code: 200
    output: ToolOrder
    side_effects: ["status=CONFIRMED", "requires_reconfirmation=false", "version bumped"]

  - method: POST
    path: "/tooling/tool-orders/{orderId}/ship"
    description: "Ship a CONFIRMED order."
    roles: [ProductionPlanner]
    code: 200
    output: ToolOrder
    side_effects: ["status=SHIPPED (terminal)", "shipped_at=current logical time", "product.open_order_units reduced by quantity", "version bumped"]

  - method: POST
    path: "/tooling/tool-orders/{orderId}/cancel"
    description: "Cancel an order that has not shipped."
    roles: [Customer, ApplicationEngineer, ProductionPlanner]
    code: 200
    input: [cancel_reason]
    output: ToolOrder
    side_effects: ["status=CANCELLED (terminal)", "product.open_order_units reduced by quantity when the order had already been submitted", "version bumped"]

  # ---------------------------------------------------------------- ReconditionJob
  - method: POST
    path: "/tooling/recondition-jobs"
    description: "Take in a batch of used solid-carbide tools for reconditioning; reserves the intake cost against the customer's regrind credit and pins the customer version."
    roles: [Customer, ProductionPlanner]
    code: 201
    input: [customer_id, product_id, job_code, units_received, "predecessor_job_id?", expected_customer_version]
    output: ReconditionJob
    side_effects: ["status=RECEIVED", "regrind_pass_no = predecessor chain length + 1", "reserved_credit_cents = units_received * 1850", "customer.regrind_credit_cents reduced by the reservation and customer.reserved_credit_cents increased by it", "customer.version bumped"]

  - method: GET
    path: "/tooling/recondition-jobs/{jobId}"
    description: "Read one reconditioning job with both life-extension variants, the rebate and the scrap recommendation."
    roles: [Customer, ProductionPlanner, QualityApprover, ApplicationEngineer]
    code: 200
    output: ReconditionJob
    side_effects: []

  - method: GET
    path: "/tooling/recondition-jobs"
    description: "List reconditioning jobs, filterable by customer, product, predecessor job, wheel and status; the reverse-reachability channel for Customer/ToolProduct/GrindingWheel -> ReconditionJob and for the self-referential predecessor_job_id."
    roles: [Customer, ProductionPlanner, QualityApprover, ApplicationEngineer]
    code: 200
    input: ["customer_id?", "product_id?", "predecessor_job_id?", "wheel_id?", "status?", "limit?", "offset?"]
    output: ReconditionJob[]
    side_effects: []

  - method: POST
    path: "/tooling/recondition-jobs/{jobId}/inspect"
    description: "Measure the incoming tools; computes both life-extension variants and the scrap recommendation."
    roles: [ProductionPlanner, QualityApprover]
    code: 200
    input: [units_inspected, measured_length_mm, measured_corner_wear_um]
    output: ReconditionJob
    side_effects: ["status=INSPECTED", "recondition_life_extension writes remaining_regrinds, life_extension_pct, warranted_life_extension_pct and scrap_recommended", "version bumped"]

  - method: POST
    path: "/tooling/recondition-jobs/{jobId}/refurbish"
    description: "Regrind (and optionally recoat) the inspected tools on a named wheel; charges the wheel's life."
    roles: [ProductionPlanner]
    code: 200
    input: [wheel_id, "recoat_applied?"]
    output: ReconditionJob
    side_effects: ["status=REFURBISHED", "wheel_id recorded", "wheel_life_consumption charges units_inspected * product.grind_units_per_tool to the wheel", "wheel drops to DRESSING when remaining_life_units falls below 150", "version bumped"]

  - method: POST
    path: "/tooling/recondition-jobs/{jobId}/return"
    description: "Return the refurbished tools and settle the life-extension rebate."
    roles: [ProductionPlanner]
    code: 200
    input: [units_returned]
    output: ReconditionJob
    side_effects: ["status=RETURNED (terminal)", "recondition_rebate credits customer.regrind_credit_cents", "the intake reservation is consumed: job.reserved_credit_cents=0 and customer.reserved_credit_cents reduced by it", "customer.version bumped", "version bumped"]

  - method: POST
    path: "/tooling/recondition-jobs/{jobId}/scrap"
    description: "Scrap an inspected batch that has no regrinds left; the intake reservation is refunded in full."
    roles: [ProductionPlanner, QualityApprover]
    code: 200
    input: [scrap_reason]
    output: ReconditionJob
    side_effects: ["status=SCRAPPED (terminal)", "the intake reservation is refunded: customer.regrind_credit_cents increased by job.reserved_credit_cents, customer.reserved_credit_cents reduced by it, job.reserved_credit_cents=0", "no rebate is paid", "customer.version bumped", "version bumped"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================

errors:

  # --- auth / authz -----------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's X-User-Role is not among the endpoint's allowed roles"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "A Customer-role caller reads or mutates a ToolOrder or ReconditionJob belonging to another customer, or supplies a foreign customer_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The dossier approver or rejector is the submitter or an operator of one of its trials"

  # --- schema -----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, unknown field, invalid enum value or out-of-domain numeric value"
  - id: ERR_INVALID_WEAR_CURVE
    http: 422
    condition: "wear_measurements has fewer than 2 points, non-monotonic minutes, decreasing vb_um, or an equal last pair of vb_um values"
  - id: ERR_INVALID_LAYER_STACK
    http: 422
    condition: "Coating layer stack is empty, longer than 5 layers, or repeats a material in adjacent layers"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start is not strictly before window_end"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "window_start is earlier than the current logical UTC time"
  - id: ERR_INVALID_PRODUCT_DERIVATION
    http: 422
    condition: "SPECIAL product without a CATALOG base_catalog_product_id, self-reference, a SPECIAL parent, or a CATALOG product supplying base_catalog_product_id"
  - id: ERR_BELOW_MIN_ORDER_QTY
    http: 422
    condition: "Order quantity is strictly below the product's min_order_qty"
  - id: ERR_UNIT_COUNT_MISMATCH
    http: 422
    condition: "sintered_units + scrap_units != pressed_units, produced_units + scrap_units != planned_units, units_returned > units_inspected, or units_inspected > units_received"

  # --- not found --------------------------------------------------------------
  - id: ERR_GRADE_NOT_FOUND
    http: 404
    condition: "No CarbideGrade with the given id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No PowderBlendBatch with the given id"
  - id: ERR_GEOMETRY_NOT_FOUND
    http: 404
    condition: "No InsertGeometry with the given id"
  - id: ERR_RECIPE_NOT_FOUND
    http: 404
    condition: "No CoatingRecipe with the given id"
  - id: ERR_COATING_RUN_NOT_FOUND
    http: 404
    condition: "No CoatingRun with the given id"
  - id: ERR_WHEEL_NOT_FOUND
    http: 404
    condition: "No GrindingWheel with the given id"
  - id: ERR_GRINDING_RUN_NOT_FOUND
    http: 404
    condition: "No GrindingRun with the given id"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "No ToolProduct with the given id"
  - id: ERR_DOSSIER_NOT_FOUND
    http: 404
    condition: "No QualificationDossier with the given id"
  - id: ERR_TRIAL_NOT_FOUND
    http: 404
    condition: "No MachiningTrial with the given id"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "No Customer with the given id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No ToolOrder with the given id"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "No ReconditionJob with the given id"

  # --- concurrency / uniqueness ----------------------------------------------
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the ToolProduct's current version (§1.2.1 order-create-stale-product)"
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version does not equal the Customer's current version (§1.2.1 job-create-stale-customer)"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A business code (grade_code, batch_code, geometry_code, recipe_code, wheel_code, sku, dossier_code, trial_code, customer_code, order_code, job_code) already exists"

  # --- state ------------------------------------------------------------------
  - id: ERR_INVALID_GRADE_STATE
    http: 409
    condition: "The CarbideGrade's status does not permit the requested transition"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The PowderBlendBatch's stage or qc_status does not permit the requested transition"
  - id: ERR_INVALID_GEOMETRY_STATE
    http: 409
    condition: "The InsertGeometry's status does not permit the requested transition"
  - id: ERR_INVALID_COATING_RUN_STATE
    http: 409
    condition: "The CoatingRun is not SCHEDULED when completion is requested"
  - id: ERR_INVALID_WHEEL_STATE
    http: 409
    condition: "The GrindingWheel's status does not permit the requested transition (e.g. dressing an AVAILABLE wheel)"
  - id: ERR_INVALID_GRINDING_RUN_STATE
    http: 409
    condition: "The GrindingRun's status does not permit the requested transition"
  - id: ERR_INVALID_PRODUCT_STATE
    http: 409
    condition: "The ToolProduct's release_status or supply_status does not permit the requested transition"
  - id: ERR_INVALID_DOSSIER_STATE
    http: 409
    condition: "The QualificationDossier's status does not permit the requested transition, or a trial is opened on a dossier that is not OPEN"
  - id: ERR_INVALID_TRIAL_STATE
    http: 409
    condition: "The MachiningTrial is not RUNNING when completion is requested, or is INVALIDATED"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "The ToolOrder's status does not permit the requested transition"
  - id: ERR_INVALID_JOB_STATE
    http: 409
    condition: "The ReconditionJob's status does not permit the requested transition"
  - id: ERR_INVALID_CUSTOMER_STATE
    http: 409
    condition: "The Customer's account_status does not permit the requested transition (e.g. adjusting credit on a CLOSED account)"

  # --- business: safety -------------------------------------------------------
  - id: ERR_WHEEL_EXPIRED
    http: 409
    condition: "The referenced GrindingWheel is EXPIRED and can no longer grind"
  - id: ERR_WHEEL_REQUIRES_DRESSING
    http: 409
    condition: "The referenced GrindingWheel is in DRESSING and must be dressed before further grinding"
  - id: ERR_BATCH_QC_NOT_PASSED
    http: 409
    condition: "The blend batch feeding a machining trial is not a sintered, QC-PASSED batch"
  - id: ERR_PRODUCT_NOT_ORDERABLE
    http: 409
    condition: "The product is RESTRICTED or WITHDRAWN, or its supply_status is UNAVAILABLE"

  # --- business: referential --------------------------------------------------
  - id: ERR_GRADE_NOT_QUALIFIED
    http: 409
    condition: "The product's carbide grade is not QUALIFIED at order confirmation"
  - id: ERR_GEOMETRY_NOT_RELEASED
    http: 409
    condition: "The product's insert geometry is not RELEASED at order confirmation"
  - id: ERR_COATING_NOT_VALIDATED
    http: 409
    condition: "The product's coating recipe has no completed run proving adhesion and thickness on the current revision"
  - id: ERR_PINNED_REVISION_STALE
    http: 409
    condition: "A pinned grade, geometry or coating revision differs from the referenced entity's current revision; the product must be repinned"
  - id: ERR_NO_PASSED_BATCH
    http: 409
    condition: "POST /tooling/carbide-grades/{gradeId}/start-pilot is called while no SINTERED, QC-PASSED blend batch exists on the grade's current revision"
  - id: ERR_PRODUCT_NOT_REGRINDABLE
    http: 409
    condition: "A recondition job is opened for an INSERT product or one whose min_regrind_length_mm is not below its nominal_length_mm"
  - id: ERR_INVALID_PREDECESSOR_CHAIN
    http: 409
    condition: "predecessor_job_id points at a job that is not RETURNED, belongs to another customer or product, or is already the predecessor of another job"
  - id: ERR_NO_APPROVED_DOSSIER
    http: 409
    condition: "A product is released with no APPROVED qualification dossier or a null tool_life_index"
  - id: ERR_OPEN_DEMAND_EXISTS
    http: 409
    condition: "A grade is retired while SUBMITTED, ENGINEERING_REVIEW or CONFIRMED orders reference products built on it"

  # --- business: temporal -----------------------------------------------------
  - id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate loaded_area_cm2 of coating runs sharing an instant of the requested chamber's half-open window would exceed 4000.00 cm2"
  - id: ERR_CELL_DOUBLE_BOOKED
    http: 409
    condition: "The requested grinding cell's closed window intersects an existing SCHEDULED or COMPLETED run's closed window"
  - id: ERR_CELL_BUFFER_CONFLICT
    http: 409
    condition: "The gap to a neighbouring run in the requested grinding cell is smaller than the 45-minute setup buffer"
  - id: ERR_WINDOW_NOT_ELAPSED
    http: 409
    condition: "A coating or grinding run is completed before its window_end has been reached on the logical clock"

  # --- business: constraint ---------------------------------------------------
  - id: ERR_EXPEDITE_NOT_ELIGIBLE
    http: 409
    condition: "Expedite is requested for a product whose expedite_eligible is false"
  - id: ERR_INSUFFICIENT_BATCH_UNITS
    http: 409
    condition: "units_consumed exceeds the blend batch's remaining_units"
  - id: ERR_INSUFFICIENT_TRIALS
    http: 409
    condition: "A dossier is submitted with fewer COMPLETED trials than required_trial_count"
  - id: ERR_COMPOSITE_SCORE_BELOW_MINIMUM
    http: 409
    condition: "A dossier is approved with a null composite_score or one below 1.00"
  - id: ERR_INSUFFICIENT_WORKPIECE_COVERAGE
    http: 409
    condition: "A dossier is approved with PASS trials covering fewer than 2 distinct workpiece groups"
  - id: ERR_NO_REGRINDS_REMAINING
    http: 409
    condition: "A refurbish is requested with remaining_regrinds equal to 0 or scrap_recommended true"

  # --- business: fiscal -------------------------------------------------------
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 402
    condition: "The customer's account_status is CREDIT_HOLD when an order is submitted or a recondition job is opened"
  - id: ERR_INSUFFICIENT_REGRIND_CREDIT
    http: 402
    condition: "units_received * 1850 exceeds the customer's regrind_credit_cents at intake"
  - id: ERR_CUSTOMER_CLOSED
    http: 409
    condition: "The customer's account_status is CLOSED when an order is submitted or a recondition job is opened"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================

roles:

  - name: MetallurgyEngineer
    description: "Owns carbide grade development and the powder blend / press / sinter route, including sintering QC verdicts."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/carbide-grades"
      - "POST /tooling/carbide-grades/{gradeId}/start-pilot"
      - "POST /tooling/carbide-grades/{gradeId}/revise"
      - "POST /tooling/carbide-grades/{gradeId}/retire"
      - "POST /tooling/powder-blend-batches/{batchId}/sinter"
    shared_operations:
      - "POST /tooling/powder-blend-batches"
      - "POST /tooling/powder-blend-batches/{batchId}/press"
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: GeometryEngineer
    description: "Owns insert and solid-carbide geometry, chip breaker development and the product definition that binds grade, geometry and coating."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/insert-geometries"
      - "POST /tooling/insert-geometries/{geometryId}/release"
      - "POST /tooling/insert-geometries/{geometryId}/revise"
    shared_operations:
      - "POST /tooling/tool-products"
      - "POST /tooling/tool-products/{productId}/enter-qualification"
      - "POST /tooling/tool-products/{productId}/repin"
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: CoatingEngineer
    description: "Owns coating recipes, deposition chamber scheduling and adhesion/thickness measurement."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/coating-recipes"
      - "POST /tooling/coating-recipes/{recipeId}/revise"
      - "POST /tooling/coating-runs"
      - "POST /tooling/coating-runs/{runId}/complete"
    shared_operations:
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: ApplicationEngineer
    description: "Owns qualification dossiers, machining trials, speeds-and-feeds advice and the commercial side of special-tool orders."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/qualification-dossiers"
      - "POST /tooling/qualification-dossiers/{dossierId}/submit"
      - "POST /tooling/machining-trials"
      - "POST /tooling/machining-trials/{trialId}/complete"
    shared_operations:
      - "POST /tooling/tool-products"
      - "POST /tooling/tool-products/{productId}/enter-qualification"
      - "POST /tooling/tool-products/{productId}/repin"
      - "POST /tooling/customers"
      - "POST /tooling/tool-orders"
      - "POST /tooling/tool-orders/{orderId}/submit"
      - "POST /tooling/tool-orders/{orderId}/confirm"
      - "POST /tooling/tool-orders/{orderId}/cancel"
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: QualityApprover
    description: "Independent quality authority: approves or rejects dossiers, releases and withdraws products, quarantines batches. Segregation of duties forbids approving work this user submitted or ran."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/qualification-dossiers/{dossierId}/approve"
      - "POST /tooling/qualification-dossiers/{dossierId}/reject"
      - "POST /tooling/tool-products/{productId}/release"
      - "POST /tooling/tool-products/{productId}/withdraw"
      - "POST /tooling/powder-blend-batches/{batchId}/quarantine"
    shared_operations:
      - "POST /tooling/grinding-runs/{runId}/void"
      - "POST /tooling/recondition-jobs/{jobId}/inspect"
      - "POST /tooling/recondition-jobs/{jobId}/scrap"
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: ProductionPlanner
    description: "Owns wheels, grinding cells, supply status, customer accounts and credit, order fulfilment and the reconditioning shop floor."
    identity: opaque
    exclusive_operations:
      - "POST /tooling/grinding-wheels"
      - "POST /tooling/grinding-wheels/{wheelId}/dress"
      - "POST /tooling/grinding-runs"
      - "POST /tooling/grinding-runs/{runId}/complete"
      - "POST /tooling/tool-products/{productId}/set-supply-status"
      - "POST /tooling/customers/{customerId}/credit-adjustments"
      - "POST /tooling/customers/{customerId}/close"
      - "POST /tooling/tool-orders/{orderId}/ship"
      - "POST /tooling/recondition-jobs/{jobId}/refurbish"
      - "POST /tooling/recondition-jobs/{jobId}/return"
    shared_operations:
      - "POST /tooling/powder-blend-batches"
      - "POST /tooling/powder-blend-batches/{batchId}/press"
      - "POST /tooling/grinding-runs/{runId}/void"
      - "POST /tooling/customers"
      - "POST /tooling/tool-orders/{orderId}/confirm"
      - "POST /tooling/tool-orders/{orderId}/cancel"
      - "POST /tooling/recondition-jobs"
      - "POST /tooling/recondition-jobs/{jobId}/inspect"
      - "POST /tooling/recondition-jobs/{jobId}/scrap"
      - "POST /tooling/_clock/set_current_utc"
      - "every GET"

  - name: Customer
    description: "The buying account. X-User-ID is the id of the Customer row; may only see and act on its own orders and reconditioning jobs."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /tooling/tool-orders"
      - "POST /tooling/tool-orders/{orderId}/submit"
      - "POST /tooling/tool-orders/{orderId}/cancel"
      - "POST /tooling/recondition-jobs"
      - "GET /tooling/tool-products"
      - "GET /tooling/tool-products/{productId}"
      - "GET /tooling/tool-products/{productId}/speeds-feeds"
      - "GET /tooling/customers/{customerId} (own row only)"
      - "GET /tooling/tool-orders and GET /tooling/tool-orders/{orderId} (own rows only)"
      - "GET /tooling/recondition-jobs and GET /tooling/recondition-jobs/{jobId} (own rows only)"
