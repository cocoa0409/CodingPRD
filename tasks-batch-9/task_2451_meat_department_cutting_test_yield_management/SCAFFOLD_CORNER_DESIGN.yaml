        distinguishing_aspect: "The class rule is conditional on the item being priced: a WHOLE_MUSCLE item may not take its provisional basis from a VAC_PACKED purchase (ERR_PRODUCT_CLASS_MISMATCH, 422) while a GROUND item may cite that very same purchase, and the GROUND item's activation is then refused with ERR_COST_BASIS_UNAVAILABLE (409) because its named GrindRun is still SCHEDULED."
