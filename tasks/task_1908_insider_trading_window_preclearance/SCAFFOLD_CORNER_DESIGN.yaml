        claim_type: correct_result
        grounds: [calculations.blackout_interval_merge, state_machines.BlackoutWindow.SCHEDULED_to_MERGED]
        distinguishing_aspect: "A new EVENT_DRIVEN window whose start equals the survivor's end (gap == 0) merges: the new record is MERGED with merged_into_id set, and the survivor's end_at extends to 2026-08-15T00:00:00Z."
        test_recipe:
