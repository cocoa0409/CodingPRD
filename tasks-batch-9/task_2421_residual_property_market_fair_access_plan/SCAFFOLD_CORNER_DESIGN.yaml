            - "RateFiling.${filing_id}.status == DISAPPROVED"
            - "RateFiling.${filing_id}.reviewed_by_user_id == reg-1"
            - "RateFiling.${filing_id}.review_note == indication not supported"
            - "RateFiling.${filing_id}.differential_pct == 0.1250"
            - "RateFiling.${filing_id}.filed_by_user_id == ra-1"

      - name: disapproved_filing_rejects_a_second_review
