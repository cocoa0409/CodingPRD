  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: a_sibling_appraisal_invalidates_the_editors_lease_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lease-patch-stale-version]
          - concurrency_rules[appraisal-create-stale-lease]
          - validations[10]
          - endpoints[PATCH /leases/{id}]
          - endpoints[POST /leases/{id}/appraisals]
        distinguishing_aspect: "Both writers guard the SAME counter, so filing an appraisal — a child create that touches no field the editor cares about — bumps Lease.version and makes the editor's pending PATCH stale. An implementation that bumps the version only on PATCH, or that keeps a per-endpoint counter, lets the second PATCH through."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one physician-owned tenant."
            - "One DRAFT lease created at 30.00 psf for 2026-11-01..2029-10-31, so its version is exactly 1."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { y1_b_id: $.data.id }
            - call: "POST /buildings/${y1_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { y1_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: true, npi: "1234568591" }
              as: PortfolioAdmin
              captures: { y1_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${y1_b_id}", suite_id: "${y1_s_id}", tenant_id: "${y1_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { y1_l_id: $.data.id, y1_v1: $.data.version }
          trigger:
            - call: "PATCH /leases/${y1_l_id}"
              payload: { expected_lease_version: "${y1_v1}", base_rent_psf_annual: 31.00 }
              as: LeasingAgent
              captures: { y1_v2: $.data.version }
            - call: "PATCH /leases/${y1_l_id}"
              payload: { expected_lease_version: "${y1_v1}", base_rent_psf_annual: 32.00 }
              as: LeasingAgent
            - call: "POST /leases/${y1_l_id}/appraisals"
              payload: { expected_lease_version: "${y1_v1}", appraiser_firm: "Whitfield Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 29.00, opinion_high_psf: 33.00, independence_attested: true }
              as: ComplianceOfficer
            - call: "POST /leases/${y1_l_id}/appraisals"
              payload: { expected_lease_version: "${y1_v2}", appraiser_firm: "Whitfield Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 29.00, opinion_high_psf: 33.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { y1_a_id: $.data.id }
            - call: "PATCH /leases/${y1_l_id}"
              payload: { expected_lease_version: "${y1_v2}", radius_restriction_miles: 2.0 }
              as: LeasingAgent
            - call: "GET /leases/${y1_l_id}"
              payload: {}
              as: LeasingAgent
              captures: { y1_v3: $.data.version }
            - call: "PATCH /leases/${y1_l_id}"
              payload: { expected_lease_version: "${y1_v3}", radius_restriction_miles: 2.0 }
              as: LeasingAgent
            - call: "GET /leases/${y1_l_id}/appraisals"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "The lease was created with version == 1, so ${y1_v1} == 1 and the first PATCH returns 200 with version == 2 and base_rent_psf_annual == 31.00"
            - "The second PATCH replays ${y1_v1} and returns 412 with data.error_id == 'ERR_STALE_LEASE_VERSION'; base_rent_psf_annual is still 31.00, NOT 32.00"
            - "The appraisal filed with ${y1_v1} returns 412 ERR_STALE_LEASE_VERSION and creates no Appraisal"
            - "The appraisal filed with ${y1_v2} returns 201 and bumps the lease to version 3 (${y1_v3} == 3), because a child create on the guarded parent is still a write to it"
            - "The PATCH carrying ${y1_v2} therefore returns 412 ERR_STALE_LEASE_VERSION even though the appraisal changed no field the PATCH touches"
            - "Re-reading and PATCHing with ${y1_v3} returns 200 with version == 4 and radius_restriction_miles == 2.0"
            - "GET /leases/${y1_l_id}/appraisals returns meta.total_count == 1 and Appraisal.${y1_a_id}.status == SUBMITTED"
            - "Lease.${y1_l_id}.status is DRAFT throughout; a 412 is never a state transition"

