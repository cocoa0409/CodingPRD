            - "DestinationCheck.${chk1_id}.result == MISMATCH and mismatch_detail == HOST_MISMATCH"
            - "After check 1: AdCreative.${cr_id}.destination_status == MISMATCH_FLAGGED while review_status is still PENDING_MANUAL_REVIEW"
            - "After check 1: AdCreative.${cr_id}.risk_score_final == 22.20 (7.20 + 15.00 mismatch penalty) and risk_score_provisional is unchanged at 7.20"
            - "After check 1: exactly 1 ReviewTask exists for the creative, still in status QUEUED with cycle_count 0 (no second task is minted because the review axis was already PENDING_MANUAL_REVIEW)"
            - "DestinationCheck.${chk2_id}.result == CLEARED and mismatch_detail == null"
            - "After check 2: AdCreative.${cr_id}.destination_status == DESTINATION_CLEARED, review_status still PENDING_MANUAL_REVIEW, risk_score_final back to 7.20"
            - "After the APPROVE: AdCreative.${cr_id}.review_status == AUTO_APPROVED and destination_status is still DESTINATION_CLEARED"
            - "After the APPROVE: AdCreative.${cr_id}.serving_eligible == true and blocking_reason_codes == []"
            - "ReviewTask.${task_id}.status == RESOLVED with resolution APPROVE; Reviewer.${rev_id}.claimed_task_count == 0"

      - name: review_task_claim_escalate_requeue_cycle_increments_counter_and_rescores
        grounds:
          - state_machines.ReviewTask.status.CLAIMED_to_ESCALATED
          - state_machines.ReviewTask.status.ESCALATED_to_QUEUED
          - calculations.review_task_priority_score
          - entities.ReviewTask.fields.cycle_count
          - entities.Reviewer.fields.claimed_task_count
        distinguishing_aspect: |
          ReviewTask is cyclic, not linear: QUEUED -> CLAIMED -> ESCALATED -> QUEUED ->
          CLAIMED. The loop is observable because the requeue increments cycle_count,
          re-scores priority_score against the advertiser state as it stands at requeue
          time (74.20 falls to 64.20 once the verification gap closes) and rebases
          sla_deadline_at on the current logical clock rather than on the original
          creation instant. Throughout the loop the creative's review_status never moves.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 8.00, requires_certification true, requires_disclaimer true, auto 0.85, manual 0.40, sla 72, default_queue REGULATED_CERT) with a US override ALLOWED_WITH_DISCLAIMER, severity_multiplier 1.20."
            - "One advertiser left entirely unverified at creation (identity_status and business_standing_status PENDING)."
            - "One reviewer with queue_specialties [REGULATED_CERT], country_authorizations [US], max_concurrent_claims 2."
            - "One creative declaring FIN_CREDIT and targeting US only, screened at confidence 0.50 so it routes to manual review."
            - "After the task exists, both verification axes are driven to VERIFIED so the requeue re-score has a different input than the original scoring."
            - "The logical clock is advanced to 2026-08-02T00:00:00Z before the claim so the requeue rebase is visible."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 8.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.85, confidence_manual_threshold: 0.40, review_sla_hours: 72, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
