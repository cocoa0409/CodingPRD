            - "BellRinger.${ringer_id}.scheduled_hours before the cancel == 16.0"
            - "Shift.${shift_a}.status == CANCELLED after the cancel"
            - "BellRinger.${ringer_id}.scheduled_hours after the cancel == 8.0"
            - "Shift.${shift_a}.status == SCHEDULED after the rebook"
            - "BellRinger.${ringer_id}.scheduled_hours after the rebook == 16.0"
            - "invariant: hours_after_rebook - hours_before_cancel == 0"
