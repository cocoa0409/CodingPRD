              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "First", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o1_id: $.data.id }
            - call: "POST /lab-orders/${o1_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt1: $.data.id }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Second", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${o2_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:30:00Z", window_end_utc: "2026-02-01T10:00:00Z", expected_route_day_version: "${rd_v2}" }
              as: Dispatcher
              captures: { appt2: $.data.id }
          assert:
            - "Appointment.${appt2}.status == SCHEDULED"
            - "LabOrder.${o2_id}.status == SCHEDULED"
            - "RouteDay.${rd_id}.booked_stop_count == 2"

      - name: route_day_shift_closed_interval_touch_conflict
        grounds:
          - validations[priority=12.5]
          - entities.RouteDay.fields.shift_start_utc
          - entities.RouteDay.fields.shift_end_utc
          - errors[ERR_ROUTE_DAY_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Closed-interval [start, end] semantics on a different resource (Phlebotomist, across its RouteDays):
          opening a second route day whose shift_start_utc EQUALS an existing OPEN route day's shift_end_utc
          (touching endpoints) IS a conflict ERR_ROUTE_DAY_SHIFT_OVERLAP — opposite adjacency rule from the
          half-open appointment windows.
        test_recipe:
          setup:
            - "Phlebotomist with one OPEN route day 08:00-12:00 on 2026-02-01"
          setup_api_calls:
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T12:00:00Z", stop_capacity: 5 }
              as: Dispatcher
              captures: { rd1: $.data.id }
          trigger:
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T12:00:00Z", shift_end_utc: "2026-02-01T16:00:00Z", stop_capacity: 5 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROUTE_DAY_SHIFT_OVERLAP"
            - "response HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: route_day_booked_stop_count_conserved_on_cancel
        grounds:
          - state_machines.LabOrder.ORDERED_to_SCHEDULED
          - state_machines.LabOrder.SCHEDULED_to_CANCELLED
          - entities.RouteDay.fields.booked_stop_count
          - calculations.route_day_booked_stop_count
        distinguishing_aspect: |
          Conserved quantity #1 — RouteDay.booked_stop_count: a booking (+1) paired with its compensating
          cancel (-1) returns booked_stop_count exactly to its pre-booking value (invariant: booked_stop_count
          == count of appointments on the route day in {SCHEDULED,DISPATCHED,ARRIVED,DRAW_COMPLETED}).
        test_recipe:
          setup:
            - "Route day rd at booked_stop_count 0; one order booked then cancelled"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${o_id}/cancel"
              payload: {}
              as: OrderingProvider
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { booked: $.data.booked_stop_count }
          assert:
            - "RouteDay.${rd_id}.booked_stop_count == 0"
            - "Appointment.${appt_id}.status == CANCELLED"

      - name: order_accessioned_count_conserved_after_qns
        grounds:
          - state_machines.Specimen.MANIFESTED_to_ACCESSIONED
          - state_machines.Specimen.MANIFESTED_to_QNS_REJECTED
          - entities.LabOrder.fields.specimens_accessioned_count
          - calculations.order_specimens_accessioned_count
        distinguishing_aspect: |
          Conserved quantity #2 (different from the route-day count) — LabOrder.specimens_accessioned_count
          always equals the count of the order's Specimens in ACCESSIONED status. Accessioning sp1 (+1) then
          QNS-rejecting sp2 (no change) leaves accessioned_count == 1, never drifting to include the rejected tube.
        test_recipe:
          setup:
            - "Two MANIFESTED specimens (sp1, sp2) on one IN_TRANSIT manifest of a 2-tube order"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CBC2", name: "CBC2", required_tube_count: 2, base_lab_fee_cents: 2000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CBC2"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CBC2", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "LOT1", tube_count: 2 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T1" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp1: $.data.id }
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T2" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp2: $.data.id }
            - call: "POST /appointments/${appt_id}/complete-draw"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests"
              payload: { lab_partner_id: "${partner_id}", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { man_id: $.data.id }
            - call: "POST /courier-manifests/${man_id}/add-specimen"
              payload: { specimen_id: "${sp1}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_id}/add-specimen"
              payload: { specimen_id: "${sp2}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_id}/pickup"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /specimens/${sp1}/accession"
              payload: {}
              as: LabOps
            - call: "POST /specimens/${sp2}/reject-qns"
              payload: {}
              as: LabOps
            - call: "GET /lab-orders/${o_id}"
              payload: {}
              as: LabOps
              captures: { acc: $.data.specimens_accessioned_count }
          assert:
            - "LabOrder.${o_id}.specimens_accessioned_count == 1"
            - "Specimen.${sp1}.status == ACCESSIONED"
            - "Specimen.${sp2}.status == QNS_REJECTED"
