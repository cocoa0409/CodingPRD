scaffold_corner_design:
- section: entities
  instances:
  - name: vessel_order_create_missing_required_gt_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.VesselOrder.fields.gt
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input gt is rejected 400 before any business rule runs.
    test_recipe:
      setup:
      - MAIN_TARIFF active
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      trigger:
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV NoGT
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST and HTTP 400
  - name: pilot_create_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Pilot.fields.status
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'Client-injected system fields (status, version) are ignored: server returns status ACTIVE and version 1.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot Sys
          license_number: LIC-S
          share_units: 2
          status: SUSPENDED
          version: 99
        as: AssociationAdmin
        captures:
          st: $.data.status
          ver: $.data.version
      assert:
      - st == ACTIVE (injected SUSPENDED ignored)
      - ver == 1 (injected 99 ignored)
      - data.id is a UUID with no type prefix
  - name: order_create_computed_provisional_fee_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.VesselOrder.fields.provisional_fee_cents
    - calculations.tariff_base_fee
    distinguishing_aspect: provisional_fee_cents is server-computed; a client-supplied value is discarded and the average-rate result 287500 is returned.
    test_recipe:
      setup:
      - MAIN_TARIFF active (three tiers)
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          - min_gt_exclusive: 5000
            max_gt_inclusive: 20000
            rate_cents_per_gt: 15
          - min_gt_exclusive: 20000
            max_gt_inclusive: null
            rate_cents_per_gt: 10
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      trigger:
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Comp
          gt: 25000
          draft_dm: 120
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
          provisional_fee_cents: 1
        as: VesselAgent
        as_user_id: agent-1
        captures:
          prov: $.data.provisional_fee_cents
      assert:
      - prov == 287500 (computed), not 1
  - name: pilot_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns ERR_NOT_FOUND 404 with the error envelope.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /pilotage/pilots/00000000-0000-0000-0000-000000000000
        payload: {}
        as: Dispatcher
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND and HTTP 404
      - error envelope carries meta.api_request_id and data.message
  - name: order_create_invalid_enum_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.VesselOrder.fields.order_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: order_type outside {ARRIVAL, DEPARTURE, SHIFT} is a 400 type/enum violation.
    test_recipe:
      setup:
      - MAIN_TARIFF active
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      trigger:
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Enum
          gt: 1000
          draft_dm: 50
          order_type: CIRCUMNAVIGATION
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: dispatch_with_unknown_apprentice_returns_404
    claim_type: parent_relationships
    grounds:
    - entities.Assignment.fields.apprentice_id
    - validations[priority=3]
    distinguishing_aspect: 'Flat-topology FK integrity: dispatch referencing a non-existent apprentice_id fails existence (404) before selector logic.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; O1 BOOKED
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      trigger:
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
          apprentice_id: 00000000-0000-0000-0000-000000000000
        as: Dispatcher
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
  - name: endorsement_same_class_supersede_transition
    claim_type: valid_transition
    grounds:
    - state_machines.LicenseEndorsement
    - entities.LicenseEndorsement.fields.status
    distinguishing_aspect: Creating a second CURRENT HARBOR endorsement (with fresh OCC version) flips the first to SUPERSEDED; exactly one CURRENT per class remains.
    test_recipe:
      setup:
      - P1 exists (version 1)
      setup_api_calls:
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: HARBOR
          tonnage_cap_gt: 5000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
        captures:
          e1_id: $.data.id
      - call: GET /pilotage/pilots/${p1_id}
        payload: {}
        as: AssociationAdmin
        captures:
          p1_v2: $.data.version
      trigger:
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: HARBOR
          tonnage_cap_gt: 7000
          expires_at: '2027-06-01T00:00:00Z'
          expected_pilot_version: ${p1_v2}
        as: AssociationAdmin
        captures:
          e2_id: $.data.id
      assert:
      - e2_id status == CURRENT with tonnage_cap_gt 7000
      - LicenseEndorsement(e1_id).status == SUPERSEDED
      - GET /pilotage/pilots/${p1_id}/endorsements shows exactly one CURRENT HARBOR row
- section: state_machines
  instances:
  - name: assignment_complete_from_assigned_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Assignment
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: complete requires ABOARD; from ASSIGNED it fails 409 ERR_INVALID_STATE with no side effects (no invoice minted).
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; O1 dispatched (A1 ASSIGNED to P1)
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
