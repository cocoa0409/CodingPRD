      - name: release_coverage_empty_set_is_vacuously_complete_at_wrap
        grounds:
          - calculations.release_coverage_completeness
          - entities.ShootBlock.fields.expected_crowd_headcount
          - entities.ShootBlock.fields.covered_head_count
          - state_machines.ShootBlock.ROLLING_to_WRAPPED
          - validations[priority=32]
          - errors[ERR_RELEASE_COVERAGE_INCOMPLETE]
        distinguishing_aspect: |
          A different metric on a different endpoint from the utilisation boundary: the
          zero-count / empty-collection edge of release coverage at the wrap endpoint. A
          block with expected_crowd_headcount 0 and no Release rows at all has
          covered_head_count 0, satisfies 0 >= 0 on an empty sum and wraps, while a block
          expecting 10 heads whose only release is REFUSED for 10 heads still has
          covered_head_count 0 and is rejected.
        test_recipe:
          setup:
            - "COMPETITION_HIGH_STRESS / CA production with an ACTIVE DUTY_OF_CARE_OFFICER protocol covering 2026-09-15..2026-12-15 (cost 1,000,000, welfare_committed_cents 1,060,000)."
