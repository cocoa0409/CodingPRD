# =============================================================================
# §1.8 — Scaffold Difficulty Design (Test Targeting Index)
# 2 instances per rule × 9 rules = 18 instances. Each instance grounds into
# SCAFFOLD.yaml §1.1–§1.7 and carries a directly executable test_recipe.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dossier_un_score_provisional_vs_final_diverge_on_null_boolean
        grounds:
          - calculations.un38_3_composite_score
          - state_machines.SafetyTestDossier.OPEN_to_TESTS_RECORDED
          - state_machines.SafetyTestDossier.TESTS_RECORDED_to_SUBMITTED
        distinguishing_aspect: |
          Entity domain = SafetyTestDossier. Two variants (provisional vs final)
          applied to identical T1..T8 inputs produce divergent scores because
          provisional treats NULL boolean as 0.5 while final treats NULL as 0.0
          AND zeroes the whole score on any FALSE boolean.
        test_recipe:
          setup:
            - "Program P open with storage_capacity_wh=100000"
            - "CellLot L accepted with measured_soc_percent=50.0, cell_count=100, rated_capacity_mah=3000"
            - "PackBOM B referencing L with cells_required=4, series=2, parallel=2, welding_profile=WELD_PROFILE_A; nominal_energy_wh=43.20"
            - "BMSFirmware F approved (binary_sha256 64-hex, supports_soc_hysteresis=false)"
            - "BatteryPack PK built from B (soc_band=SOC_MID, energy=43.20)"
            - "WeldingParameterRecord WR recorded (weld_count=8, current_amps=80.0, pulse_ms=15, electrode_force_n=30.0, profile A); certified by QE2"
            - "BMSFlashRecord BFR flashing F onto PK"
            - "SafetyTestDossier D opened for PK"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-A", storage_capacity_wh: 100000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-1", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 50.0 }
              as: QualityEngineer
              as_user_id: "qe-op-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-op-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 50.0, measured_voltage_v: 3.65, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-op-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-1", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-op-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-op-1"
              captures: { pack_id: $.data.id, pack_v0: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-op-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-op-2"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-op-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-op-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/approvals"
              payload: { decision: "APPROVE", rationale: "Initial release approved after bench test" }
              as: SafetyOfficer
              as_user_id: "so-op-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-op-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-op-2"
              captures: { doss_id: $.data.id }
          trigger:
            # PUT with all 8 fields populated except overcharge_ok left NULL would
            # be blocked by INCOMPLETE_TEST_MATRIX — instead, populate all 8 with
            # values that make provisional vs final diverge. Use ALL true except
            # forced_discharge_ok=true; then submit and observe delta via a SECOND
            # dossier whose forced_discharge_ok is set FALSE — final variant
            # zeroes the whole score, provisional would have given partial credit.
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
              payload:
                expected_pack_version: "${pack_v0} + 3"   # 3 mutations since create: weld record, certify, flash
                altitude_sim_kpa: 11.6
                thermal_cycles: 10
                vibration_minutes: 180
                shock_g_peak: 150.0
                external_short_circuit_ok: true
                impact_crush_ok: true
                overcharge_ok: true
                forced_discharge_ok: false
              as: QualityEngineer
              as_user_id: "qe-op-2"
              captures: { prov_score: $.data.provisional_un_score }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}/submit"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-op-1"
              captures: { final_score: $.data.final_un_score, outcome: $.data.outcome }
          assert:
            # provisional: T1=10*1=10, T2=15*1=15, T3=12*1=12, T4=13*1=13, T5=15*1=15, T6=15*1=15, T7=10*1=10, T8=10*0=0 → 90
            - "Dossier.${doss_id}.provisional_un_score == 90.0"
            # final variant: any FALSE boolean zeroes the whole score
            - "Dossier.${doss_id}.final_un_score == 0.0"
            - "Dossier.${doss_id}.outcome == FAIL"
            - "Dossier.${doss_id}.status == FAILED"
            - "BatteryPack.${pack_id}.assembly_status == TEST_QUEUED"   # pack does NOT advance

      - name: carrier_charge_provisional_vs_final_diverge_on_weight_patch
        grounds:
          - calculations.carrier_acceptance_charge
          - state_machines.TransportShipment.DRAFT_to_TENDERED
          - state_machines.TransportShipment.TENDERED_to_CARRIER_ACCEPTED
        distinguishing_aspect: |
          Entity domain = TransportShipment. Provisional (tender-time) charge is
          computed from the DRAFT declared_weight_kg; the final variant recomputes
          at carrier-accept and overrides when the carrier patches
          declared_weight_kg, producing a different cents value for the same
          attached pack set.
        test_recipe:
          setup:
            - "Program P open; one pack PK at READY_TO_STORE, soc_band=SOC_LOW (soc=20), energy=43.20, classification=UN3480"
            - "StorageLocation SL capacity 5000 accepts [SOC_LOW, SOC_MID]"
            - "PK is STAGED → STORED → PICKED"
            - "TransportShipment SH DRAFT with un_class_code=UN3480, declared_weight_kg=10.00"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-B", storage_capacity_wh: 100000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-B", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 20.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 20.0, measured_voltage_v: 3.20, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-B", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id, pack_v0: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "b1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/approvals"
              payload: { decision: "APPROVE", rationale: "Bench pass" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { doss_id: $.data.id }
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
              payload:
                expected_pack_version: "${pack_v0} + 3"
                altitude_sim_kpa: 11.6
                thermal_cycles: 10
                vibration_minutes: 180
                shock_g_peak: 150.0
                external_short_circuit_ok: true
                impact_crush_ok: true
                overcharge_ok: true
                forced_discharge_ok: true
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}/submit"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/storage-locations"
              payload: { location_code: "SL-1", fire_zone: "ZONE_B", capacity_wh: 5000, accepts_soc_band: ["SOC_LOW", "SOC_MID"] }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { loc_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/storage-placements"
              payload: { storage_location_id: "${loc_id}", battery_pack_id: "${pack_id}" }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { place_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/storage-placements/${place_id}/store"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/pick"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments"
              payload: { carrier_code: "DHL-DG", un_class_code: "UN3480", declared_weight_kg: 10.00 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/attach"
              payload: { battery_pack_id: "${pack_id}" }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/tender"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { provisional_charge: $.data.carrier_charge_cents }
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/carrier-accept"
              payload: { declared_weight_kg: 25.50 }
              as: CarrierAgent
              as_user_id: "ca-1"
              captures: { final_charge: $.data.carrier_charge_cents }
          assert:
            # wh=43.20 all in tier1 at $0.12 → $5.184
            # provisional: weight=10kg → $4.00; pre=9.184; *1.25 = $11.48 → 1148 cents
            - "TransportShipment.${ship_id}.carrier_charge_cents at tender == 1148"
            # final: weight=25.5kg → $10.20; pre=15.384; *1.25 = $19.23 → 1923 cents
            - "TransportShipment.${ship_id}.carrier_charge_cents after carrier-accept == 1923"
            - "TransportShipment.${ship_id}.declared_weight_kg == 25.50"
            - "TransportShipment.${ship_id}.status == CARRIER_ACCEPTED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: welding_heat_dose_four_input_nonlinear_mode_a
        grounds:
          - calculations.welding_heat_dose
          - state_machines.BatteryPack.BUILT_to_WELD_RECORDED
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. The four
          inputs (weld_count × current_amps × pulse_ms × base profile constant)
          are multiplied, then modulated by a CLAMPED force_factor that depends
          on electrode_force_n via a conditional branch (clamp at 0.7 / 1.4).
          Distinct from tiered/threshold modes.
        test_recipe:
          setup:
            - "Program, lot (SOC 50.0), BOM (profile B), pack PK at BUILT"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-C", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-C", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 50.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 50.0, measured_voltage_v: 3.65, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-C", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_B" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id }
          trigger:
            # weld_count=10, amps=100.0, pulse_ms=20, force=50.0
            # raw = 10 * 100 * (20/1000) * 18 = 10*100*0.02*18 = 360
            # force_factor = 1 + (50-30)/100 = 1.2 (within clamp)
            # heat = 360 * 1.2 = 432.00 J — under profile B ceiling (700)
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 10, current_amps: 100.0, pulse_ms: 20, electrode_force_n: 50.0, weld_profile_used: "WELD_PROFILE_B" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id, heat: $.data.heat_dose_j }
          assert:
            - "WeldingParameterRecord.${wr_id}.heat_dose_j == 432.00"
            - "WeldingParameterRecord.${wr_id}.is_certified == false"
            - "BatteryPack.${pack_id}.assembly_status == WELD_RECORDED"
            - "BatteryPack.${pack_id}.welding_heat_dose_j == 432.00"

      - name: carrier_charge_nested_rounding_order_mode_b
        grounds:
          - calculations.carrier_acceptance_charge
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The formula sums
          tiered Wh component + weight surcharge in dollars, then applies the
          DG multiplier, and only then rounds HALF_UP to integer cents.
          Rounding each tier's cents first would produce a different value.
        test_recipe:
          setup:
            - "Program; lot; BOM; pack PK energy=43.20 READY_TO_STORE"
            - "SL capacity 5000 accepts SOC_MID; PK STAGED/STORED/PICKED"
            - "Shipment SH with un_class_code=UN3481, declared_weight_kg=7.77"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-D", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-D", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-D", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id, pack_v0: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "c1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/approvals"
              payload: { decision: "APPROVE", rationale: "Bench pass" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { doss_id: $.data.id }
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
              payload:
                expected_pack_version: "${pack_v0} + 3"
                altitude_sim_kpa: 11.6
                thermal_cycles: 10
                vibration_minutes: 180
                shock_g_peak: 150.0
                external_short_circuit_ok: true
                impact_crush_ok: true
                overcharge_ok: true
                forced_discharge_ok: true
              as: QualityEngineer
              as_user_id: "qe-1"
