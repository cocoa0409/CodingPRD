# =============================================================================
# Task 1998: Relocation Benefit Administration — seed tables (v1)
# =============================================================================

scenario: |
  1998. Relocation Benefit Administration (corporate mobility program): policy
  tier by level & move type (domestic/homeowner/renter), household goods vendor
  management & survey/estimate, temporary housing & travel booking, home sale
  assistance/loss on sale program, expense reimbursement vs direct bill & tax
  gross-up calculation, repayment agreement on early departure, exception
  approval & cost tracking, vendor performance & employee satisfaction

domain_name: relocation-benefits
api_prefix: ""            # flat topology: all collections are top-level (/employees, /relocation-cases, ...)

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: approval_chain
  consistency_model: immediate
  difficulty_target: expert

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: job_level, type: enum, source: input, description: "ASSOCIATE | MANAGER | DIRECTOR | EXECUTIVE — policy tier key" }
      - { name: home_ownership, type: enum, source: input, description: "HOMEOWNER | RENTER — policy tier key" }
      - { name: employment_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED" }
      - { name: termination_date, type: datetime, source: system, description: "Logical-clock timestamp stamped by terminate; null while ACTIVE", constraints: "nullable" }

  - name: RelocationPolicy
    parent: null
    common_fields: true
    fields:
      - { name: job_level, type: enum, source: input, description: "ASSOCIATE | MANAGER | DIRECTOR | EXECUTIVE" }
      - { name: move_scope, type: enum, source: input, description: "DOMESTIC | INTERNATIONAL" }
      - { name: home_ownership, type: enum, source: input, description: "HOMEOWNER | RENTER" }
      - { name: hhg_cap_cents, type: integer, source: input, description: "Household-goods cap for this tier" }
      - { name: temp_housing_cap_cents, type: integer, source: input, description: "Temporary-housing cap for this tier" }
      - { name: temp_housing_max_nights, type: integer, source: input, description: "Maximum bookable temp-housing nights per case" }
      - { name: travel_cap_cents, type: integer, source: input, description: "Travel cap for this tier" }
      - { name: loss_on_sale_cap_cents, type: integer, source: input, description: "Loss-on-sale benefit cap (0 when not eligible)" }
      - { name: misc_cap_cents, type: integer, source: input, description: "Miscellaneous expense-claim cap for this tier" }
      - { name: home_sale_eligible, type: boolean, source: input, description: "Whether this tier may open a HomeSaleTransaction" }
      - { name: repayment_window_months, type: integer, source: input, description: "Required post-move service months; also the repayment installment count" }
      - { name: gross_up_method, type: enum, source: input, description: "FLAT_SUPPLEMENTAL | MARGINAL_AGGREGATE — selects tax gross-up variant" }
      - { name: flat_gross_up_rate, type: number, source: input, description: "Flat supplemental rate r used by FLAT_SUPPLEMENTAL (e.g. 0.22)" }
      - { name: marginal_bracket_threshold_cents, type: integer, source: input, description: "Cumulative taxable reimbursement threshold splitting low/high marginal rates" }
      - { name: marginal_rate_low, type: number, source: input, description: "Marginal rate applied to the portion at or below the bracket threshold" }
      - { name: marginal_rate_high, type: number, source: input, description: "Marginal rate applied to the portion above the bracket threshold" }
      - { name: loss_basis, type: enum, source: input, description: "APPRAISED | PURCHASE_PRICE — selects loss-on-sale variant" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Household-goods vendor name" }
      - { name: service_regions, type: array, source: input, description: "Array of region strings the vendor serves" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: rating_count, type: integer, source: computed, default: 0, description: "Count of rated MoveAssignments for this vendor" }
      - { name: rating_sum, type: integer, source: computed, default: 0, description: "Sum of all ratings ever recorded for this vendor" }
      - { name: avg_rating_lifetime, type: number, source: computed, description: "rating_sum / rating_count, 2 decimals round_half_up; null when rating_count = 0" }
      - { name: avg_rating_rolling_12m, type: number, source: computed, description: "Sum/count restricted to MoveAssignments rated within the 12 months preceding the logical clock; null when none in window" }
      - { name: completed_moves, type: integer, source: computed, default: 0, description: "MoveAssignments of this vendor that reached PAID" }

  - name: RelocationCase
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; relocating employee" }
      - { name: policy_id, type: string, source: system, description: "FK -> RelocationPolicy.id; resolved at creation by policy_resolution" }
      - { name: move_scope, type: enum, source: input, description: "DOMESTIC | INTERNATIONAL" }
      - { name: origin_city, type: string, source: input, description: "Origin city" }
      - { name: destination_city, type: string, source: input, description: "Destination city" }
      - { name: expected_move_date, type: datetime, source: input, description: "Planned move date (ISO 8601)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | AUTHORIZED | IN_PROGRESS | CLOSED | CLOSED_EARLY | CANCELLED" }
      - { name: authorized_at, type: datetime, source: system, description: "Logical-clock timestamp of AUTHORIZED transition; null until then", constraints: "nullable" }
      - { name: total_committed_cents, type: integer, source: computed, default: 0, description: "Funds promised by non-terminal approved/confirmed components (case_cost_ledger)" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Funds actually disbursed (case_cost_ledger)" }
      - { name: total_released_cents, type: integer, source: computed, default: 0, description: "Committed funds later released by cancellation (case_cost_ledger)" }
      - { name: cumulative_taxable_paid_cents, type: integer, source: computed, default: 0, description: "Running total of PAID taxable (REIMBURSEMENT) claim amounts; feeds MARGINAL_AGGREGATE gross-up bracketing" }

  - name: MoveAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> RelocationCase.id; owning relocation case" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; household-goods vendor" }
      - { name: survey_at, type: datetime, source: input, description: "Scheduled survey timestamp; set by schedule-survey, cleared by reject-estimate", constraints: "nullable" }
      - { name: estimated_cents, type: integer, source: input, description: "Vendor estimate; set by submit-estimate, cleared by reject-estimate", constraints: "nullable" }
      - { name: final_invoice_cents, type: integer, source: input, description: "Vendor final invoice; set by submit-invoice", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SURVEY_SCHEDULED | ESTIMATE_SUBMITTED | ESTIMATE_APPROVED | DELIVERED | INVOICED | PAID | CANCELLED" }
      - { name: rating, type: integer, source: input, description: "Employee satisfaction rating 1-5; set once by rate endpoint", constraints: "1..5, nullable" }
      - { name: rated_at, type: datetime, source: system, description: "Logical-clock timestamp of rating; null until rated", constraints: "nullable" }

  - name: ServiceBooking
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> RelocationCase.id; owning relocation case" }
      - { name: kind, type: enum, source: input, description: "TEMP_HOUSING | TRAVEL" }
      - { name: start_date, type: datetime, source: input, description: "Check-in date (TEMP_HOUSING) or travel date (TRAVEL), ISO 8601" }
      - { name: end_date, type: datetime, source: input, description: "Check-out date for TEMP_HOUSING; defaults to start_date for TRAVEL when omitted", constraints: "optional for TRAVEL" }
      - { name: amount_cents, type: integer, source: input, description: "Nightly rate (TEMP_HOUSING) or total ticket cost (TRAVEL)" }
      - { name: nights, type: integer, source: computed, description: "TEMP_HOUSING: whole days end_date - start_date; TRAVEL: 0" }
      - { name: total_cents, type: integer, source: computed, description: "TEMP_HOUSING: nights x amount_cents; TRAVEL: amount_cents" }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD | CONFIRMED | COMPLETED | CANCELLED" }

  - name: ExpenseClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> RelocationCase.id; owning relocation case" }
      - { name: category, type: enum, source: input, description: "MEALS | LODGING | TRANSPORT | MISC" }
      - { name: payment_method, type: enum, source: input, description: "REIMBURSEMENT | DIRECT_BILL" }
      - { name: lines, type: array, source: input, description: "Array of { description: string, amount_cents: integer }" }
      - { name: amount_cents, type: integer, source: computed, description: "Sum of lines[].amount_cents (integer cents; no rounding needed)" }
      - { name: taxable, type: boolean, source: computed, description: "true iff payment_method == REIMBURSEMENT" }
      - { name: gross_up_cents, type: integer, source: computed, default: 0, description: "Tax gross-up computed by tax_gross_up at pay time; 0 for DIRECT_BILL" }
      - { name: total_payment_cents, type: integer, source: computed, default: 0, description: "amount_cents + gross_up_cents; stamped at pay time" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | REJECTED | PAID" }
      - { name: reject_reason, type: string, source: input, description: "Reason recorded on reject", constraints: "nullable" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of PAID transition; orders the marginal gross-up bracket", constraints: "nullable" }

  - name: HomeSaleTransaction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> RelocationCase.id; unique per case (one home-sale program each)" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Independent appraisal of the home" }
      - { name: original_purchase_price_cents, type: integer, source: input, description: "Price the employee originally paid" }
      - { name: list_price_cents, type: integer, source: input, description: "Listing price" }
      - { name: sale_price_cents, type: integer, source: input, description: "Actual sale price; set by record-sale", constraints: "nullable" }
      - { name: loss_basis_used, type: enum, source: system, description: "APPRAISED | PURCHASE_PRICE — copied from the case policy at record-sale", constraints: "nullable" }
      - { name: gross_loss_cents, type: integer, source: computed, description: "loss_on_sale_benefit gross loss before cap; null until SOLD", constraints: "nullable" }
      - { name: capped_benefit_cents, type: integer, source: computed, description: "Benefit payable after effective loss_on_sale cap; null until SOLD", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | SOLD | SETTLED" }

  - name: RepaymentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> RelocationCase.id; created by the terminate-early cascade (unique per case)" }
      - { name: total_owed_cents, type: integer, source: computed, description: "Prorated benefits to repay (repayment_schedule)" }
      - { name: installments_count, type: integer, source: computed, description: "Equals the case policy's repayment_window_months" }
      - { name: installment_cents, type: integer, source: computed, description: "floor(total_owed_cents / installments_count)" }
      - { name: final_installment_cents, type: integer, source: computed, description: "total_owed_cents - (installments_count - 1) x installment_cents (absorbs remainder)" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of sign; null until ACTIVE", constraints: "nullable" }
      - { name: next_due_date, type: datetime, source: system, description: "signed_at + 1 calendar month; default-eligibility reference", constraints: "nullable" }
      - { name: paid_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of payments minus reversals" }
      - { name: balance_cents, type: integer, source: computed, description: "total_owed_cents - paid_to_date_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SETTLED | DEFAULTED" }

  - name: ExceptionRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> RelocationCase.id; owning relocation case" }
      - { name: component, type: enum, source: input, description: "HHG | TEMP_HOUSING | TRAVEL | MISC | LOSS_ON_SALE — which policy cap to raise" }
      - { name: requested_cap_increase_cents, type: integer, source: input, description: "Additive increase over the policy cap for this component" }
      - { name: justification, type: string, source: input, description: "Business justification" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | REJECTED" }
      - { name: decision_note, type: string, source: input, description: "Approver note on approve/reject", constraints: "nullable" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; max 1" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RelocationCase
    initial_state: DRAFT
    terminal_states: [CLOSED, CLOSED_EARLY, CANCELLED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /relocation-cases/{id}/authorize"
        actor: MobilityCoordinator
        preconditions: ["employee.employment_status == ACTIVE"]
        side_effects: ["authorized_at = logical clock", "increments RelocationCase.version by 1"]
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: "POST /relocation-cases/{id}/start"
        actor: MobilityCoordinator
        preconditions: []
        side_effects: ["increments RelocationCase.version by 1"]
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /relocation-cases/{id}/cancel"
        actor: MobilityCoordinator
        preconditions: []
        side_effects: ["increments RelocationCase.version by 1"]
        note: "No children can exist yet (child creation requires IN_PROGRESS), so no cascade fires."
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /relocation-cases/{id}/cancel"
        actor: MobilityCoordinator
        preconditions: []
        side_effects:
          - "every non-terminal MoveAssignment -> CANCELLED; every HELD/CONFIRMED ServiceBooking -> CANCELLED; every SUBMITTED/APPROVED/REJECTED ExpenseClaim stays unchanged (claims are not cancelled); every LISTED/SOLD HomeSaleTransaction stays unchanged"
          - "each MoveAssignment or ServiceBooking cancellation that was holding committed funds releases them: RelocationCase.total_committed_cents -= held amount, RelocationCase.total_released_cents += held amount (child mutation triggers parent ledger mutation)"
          - "recompute case_cost_ledger; increments RelocationCase.version by 1"
      - from: IN_PROGRESS
        to: CLOSED_EARLY
        trigger: "POST /relocation-cases/{id}/terminate-early"
        actor: MobilityCoordinator
        preconditions: ["employee.employment_status == TERMINATED"]
        side_effects:
          - "every non-terminal MoveAssignment -> CANCELLED; every HELD/CONFIRMED ServiceBooking -> CANCELLED"
          - "each such cancellation releases its held committed funds into RelocationCase.total_released_cents (parent ledger mutation caused by the child mutation)"
          - "case_cost_ledger finalizes total_paid_cents; if repayment_schedule months_remaining > 0, create RepaymentAgreement(status=DRAFT) for this case with total_owed_cents from repayment_schedule; otherwise no agreement is created"
          - "increments RelocationCase.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /relocation-cases/{id}/close"
        actor: MobilityCoordinator
        preconditions:
          - "no MoveAssignment of this case in a non-terminal state (REQUESTED|SURVEY_SCHEDULED|ESTIMATE_SUBMITTED|ESTIMATE_APPROVED|DELIVERED|INVOICED)"
          - "no ServiceBooking of this case in HELD or CONFIRMED"
          - "no ExpenseClaim of this case in SUBMITTED or APPROVED"
          - "no HomeSaleTransaction of this case in LISTED or SOLD"
          - "no RepaymentAgreement of this case with status != SETTLED"
        side_effects: ["increments RelocationCase.version by 1"]
      - from: CLOSED_EARLY
        to: CLOSED
        trigger: "POST /relocation-cases/{id}/close"
        actor: MobilityCoordinator
        preconditions:
          - "no RepaymentAgreement of this case with status != SETTLED (DRAFT/ACTIVE/DEFAULTED block closure)"
        side_effects: ["increments RelocationCase.version by 1"]
        note: "Final closure after early departure is gated on the repayment obligation being fully settled."

  - entity: MoveAssignment
    initial_state: REQUESTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SURVEY_SCHEDULED
        trigger: "POST /move-assignments/{id}/schedule-survey"
        actor: MobilityCoordinator
        preconditions:
          - "case.status == IN_PROGRESS"
          - "vendor.status == ACTIVE"
          - "no other MoveAssignment of the same vendor in SURVEY_SCHEDULED with |survey_at - new survey_at| < 2 hours (ERR_SURVEY_CONFLICT)"
        side_effects: ["survey_at = payload", "increments MoveAssignment.version by 1"]
      - from: SURVEY_SCHEDULED
        to: ESTIMATE_SUBMITTED
        trigger: "POST /move-assignments/{id}/submit-estimate"
        actor: Vendor
        preconditions: ["acting vendor id == MoveAssignment.vendor_id"]
        side_effects: ["estimated_cents = payload", "increments MoveAssignment.version by 1"]
      - from: ESTIMATE_SUBMITTED
        to: ESTIMATE_APPROVED
        trigger: "POST /move-assignments/{id}/approve-estimate"
        actor: MobilityCoordinator
        preconditions:
          - "expected_case_version == RelocationCase.version (OCC)"
          - "case.status == IN_PROGRESS"
          - "estimated_cents <= effective HHG cap remaining = policy.hhg_cap_cents + approved HHG exception increases - HHG committed/held (else ERR_CAP_EXCEEDED)"
        side_effects:
          - "RelocationCase.total_committed_cents += estimated_cents (case_cost_ledger)"
          - "increments RelocationCase.version by 1"
          - "increments MoveAssignment.version by 1"
      - from: ESTIMATE_SUBMITTED
        to: REQUESTED
        trigger: "POST /move-assignments/{id}/reject-estimate"
        actor: MobilityCoordinator
        preconditions: []
        side_effects: ["survey_at = null", "estimated_cents = null", "increments MoveAssignment.version by 1"]
        note: "Re-survey cycle: the assignment must be scheduled and estimated again."
      - from: ESTIMATE_APPROVED
        to: DELIVERED
        trigger: "POST /move-assignments/{id}/mark-delivered"
        actor: Vendor
        preconditions: ["acting vendor id == MoveAssignment.vendor_id"]
        side_effects: ["increments MoveAssignment.version by 1"]
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /move-assignments/{id}/submit-invoice"
        actor: Vendor
        preconditions: ["acting vendor id == MoveAssignment.vendor_id"]
        side_effects: ["final_invoice_cents = payload", "increments MoveAssignment.version by 1"]
      - from: INVOICED
        to: PAID
        trigger: "POST /move-assignments/{id}/mark-paid"
        actor: FinanceSpecialist
        preconditions: []
        side_effects:
          - "RelocationCase.total_committed_cents -= estimated_cents; RelocationCase.total_paid_cents += final_invoice_cents (case_cost_ledger)"
          - "Vendor.completed_moves += 1"
          - "increments RelocationCase.version by 1"
          - "increments MoveAssignment.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["increments MoveAssignment.version by 1"]
      - from: SURVEY_SCHEDULED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["increments MoveAssignment.version by 1"]
      - from: ESTIMATE_SUBMITTED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["increments MoveAssignment.version by 1"]
      - from: ESTIMATE_APPROVED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["RelocationCase.total_committed_cents -= estimated_cents; RelocationCase.total_released_cents += estimated_cents", "increments RelocationCase.version by 1", "increments MoveAssignment.version by 1"]
      - from: DELIVERED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["RelocationCase.total_committed_cents -= estimated_cents; RelocationCase.total_released_cents += estimated_cents", "increments RelocationCase.version by 1", "increments MoveAssignment.version by 1"]
      - from: INVOICED
        to: CANCELLED
        trigger: "case cancel / terminate-early cascade"
        actor: system
        preconditions: []
        side_effects: ["RelocationCase.total_committed_cents -= estimated_cents; RelocationCase.total_released_cents += estimated_cents", "increments RelocationCase.version by 1", "increments MoveAssignment.version by 1"]
        note: "Conditional cascade: only assignments that had an approved estimate release committed funds."

  - entity: ServiceBooking
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /service-bookings/{id}/confirm"
        actor: MobilityCoordinator
        preconditions: ["case.status == IN_PROGRESS"]
        side_effects:
          - "RelocationCase.total_committed_cents += total_cents (case_cost_ledger)"
          - "increments RelocationCase.version by 1"
          - "increments ServiceBooking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /service-bookings/{id}/cancel or case cascade"
        actor: "Employee (owner) | MobilityCoordinator | system"
        preconditions: []
        side_effects: ["increments ServiceBooking.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /service-bookings/{id}/cancel or case cascade"
        actor: "Employee (owner) | MobilityCoordinator | system"
        preconditions: []
        side_effects:
          - "RelocationCase.total_committed_cents -= total_cents; RelocationCase.total_released_cents += total_cents (compensation)"
          - "increments RelocationCase.version by 1"
          - "increments ServiceBooking.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /service-bookings/{id}/complete"
        actor: MobilityCoordinator
        preconditions: []
        side_effects:
          - "RelocationCase.total_committed_cents -= total_cents; RelocationCase.total_paid_cents += total_cents (case_cost_ledger)"
          - "increments RelocationCase.version by 1"
          - "increments ServiceBooking.version by 1"

  - entity: ExpenseClaim
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expense-claims/{id}/approve"
        actor: FinanceSpecialist
        preconditions:
          - "expected_case_version == RelocationCase.version (OCC)"
          - "case.status == IN_PROGRESS"
          - "amount_cents <= effective MISC cap remaining = policy.misc_cap_cents + approved MISC exception increases - committed/held MISC amounts (else ERR_CAP_EXCEEDED)"
        side_effects:
          - "RelocationCase.total_committed_cents += amount_cents (case_cost_ledger)"
          - "increments RelocationCase.version by 1"
          - "increments ExpenseClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expense-claims/{id}/reject"
        actor: FinanceSpecialist
        preconditions: []
        side_effects: ["reject_reason = payload", "increments ExpenseClaim.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /expense-claims/{id}/resubmit"
        actor: Employee
        preconditions: ["acting employee id == case.employee_id"]
        side_effects: ["if lines supplied, lines replaced and amount_cents recomputed", "reject_reason = null", "increments ExpenseClaim.version by 1"]
        note: "Resubmission cycle; a claim may bounce SUBMITTED -> REJECTED -> SUBMITTED repeatedly."
      - from: APPROVED
        to: PAID
        trigger: "POST /expense-claims/{id}/pay"
        actor: FinanceSpecialist
        preconditions: []
        side_effects:
          - "tax_gross_up computes gross_up_cents (0 when taxable == false) using policy.gross_up_method and the case's cumulative_taxable_paid_cents at this moment"
          - "total_payment_cents = amount_cents + gross_up_cents; paid_at = logical clock"
          - "RelocationCase.total_committed_cents -= amount_cents; RelocationCase.total_paid_cents += total_payment_cents"
          - "if taxable: RelocationCase.cumulative_taxable_paid_cents += amount_cents"
          - "increments RelocationCase.version by 1"
          - "increments ExpenseClaim.version by 1"

  - entity: HomeSaleTransaction
    initial_state: LISTED
    terminal_states: [SETTLED]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /home-sales/{id}/record-sale"
        actor: MobilityCoordinator
        preconditions: ["case.status == IN_PROGRESS"]
        side_effects:
          - "sale_price_cents = payload; loss_basis_used = policy.loss_basis"
          - "loss_on_sale_benefit computes gross_loss_cents and capped_benefit_cents (cap = policy.loss_on_sale_cap_cents + approved LOSS_ON_SALE exception increases)"
          - "increments HomeSaleTransaction.version by 1"
      - from: SOLD
        to: SETTLED
        trigger: "POST /home-sales/{id}/settle"
        actor: FinanceSpecialist
        preconditions: []
        side_effects:
          - "RelocationCase.total_paid_cents += capped_benefit_cents (case_cost_ledger)"
          - "increments RelocationCase.version by 1"
          - "increments HomeSaleTransaction.version by 1"

  - entity: RepaymentAgreement
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /repayment-agreements/{id}/sign"
        actor: Employee
        preconditions: ["acting employee id == case.employee_id"]
        side_effects: ["signed_at = logical clock", "next_due_date = signed_at + 1 calendar month", "increments RepaymentAgreement.version by 1"]
      - from: ACTIVE
        to: SETTLED
        trigger: "system (automatic when a payment brings balance_cents to 0)"
        actor: system
        preconditions: ["balance_cents == 0 after applying payment"]
        side_effects: ["increments RepaymentAgreement.version by 1"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /repayment-agreements/{id}/mark-default"
        actor: FinanceSpecialist
        preconditions:
          - "logical clock > next_due_date"
          - "paid_to_date_cents < min(months_elapsed, installments_count - 1) x installment_cents, where months_elapsed = whole calendar months from signed_at to the logical clock"
        side_effects: ["increments RepaymentAgreement.version by 1"]
      - from: DEFAULTED
        to: ACTIVE
        trigger: "system (automatic when a payment cures the arrears)"
        actor: system
        preconditions: ["paid_to_date_cents >= min(months_elapsed, installments_count - 1) x installment_cents after applying payment"]
        side_effects: ["increments RepaymentAgreement.version by 1"]
        note: "Default/cure cycle driven by the payments endpoint."
      - from: SETTLED
        to: ACTIVE
        trigger: "system (automatic when reverse-payment reopens a balance)"
        actor: system
        preconditions: ["balance_cents > 0 after applying reversal"]
        side_effects: ["increments RepaymentAgreement.version by 1"]

  - entity: ExceptionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /exception-requests/{id}/approve"
        actor: ProgramManager
        preconditions: ["expected_case_version == RelocationCase.version (OCC)", "case.status == IN_PROGRESS"]
        side_effects:
          - "effective cap for component rises by requested_cap_increase_cents (derived: policy cap + sum of APPROVED increases for this case+component)"
          - "increments RelocationCase.version by 1"
          - "increments ExceptionRequest.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /exception-requests/{id}/reject"
        actor: ProgramManager
        preconditions: []
        side_effects: ["decision_note = payload", "increments ExceptionRequest.version by 1"]
      - from: REJECTED
        to: PENDING
        trigger: "POST /exception-requests/{id}/appeal"
        actor: "Employee (owner) | MobilityCoordinator"
        preconditions: ["appeal_count < 1 (else ERR_APPEAL_LIMIT_REACHED)"]
        side_effects: ["appeal_count += 1", "decision_note = null", "increments ExceptionRequest.version by 1"]
        note: "Appeal cycle; at most one appeal per request."

  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend"
        actor: MobilityCoordinator
        preconditions: []
        side_effects: ["increments Vendor.version by 1"]
        note: "Suspension blocks new assignments and survey scheduling; in-flight assignments are unaffected."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-approve-stale-case
    parent_entity: RelocationCase
    write_endpoint: "POST /expense-claims/{id}/approve"
    occ_field: expected_case_version
    description: |
      Approving an ExpenseClaim against a RelocationCase whose version has
      advanced since the client last observed it is rejected. Approving a claim
      mutates the case ledger (total_committed_cents) and therefore the case
      version; a client holding an older version is acting on a stale view of
      the case's remaining cap.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: estimate-approve-stale-case
    parent_entity: RelocationCase
    write_endpoint: "POST /move-assignments/{id}/approve-estimate"
    occ_field: expected_case_version
    description: |
      Approving a MoveAssignment estimate against a RelocationCase whose version
      has advanced since the client last observed it is rejected. Estimate
      approval commits household-goods funds to the case ledger and bumps the
      case version; a stale expected version means the cap math the client
      approved against is no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: exception-approve-stale-case
    parent_entity: RelocationCase
    write_endpoint: "POST /exception-requests/{id}/approve"
    occ_field: expected_case_version
    description: |
      Approving an ExceptionRequest against a RelocationCase whose version has
      advanced since the client last observed it is rejected. Approval raises a
      component's effective cap and bumps the case version; a stale expected
      version means the client's cap snapshot is outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: policy_resolution
    trigger: "POST /relocation-cases (case creation)"
    algorithm: selector
    formula: |
      candidates = RelocationPolicy where job_level == employee.job_level
                   AND move_scope == payload.move_scope
                   AND home_ownership == employee.home_ownership
      if candidates is empty: reject with ERR_POLICY_NOT_FOUND
      else: policy = candidates ordered by created_at ASC, first element
      (the (job_level, move_scope, home_ownership) triple is unique per ERR_DUPLICATE_RESOURCE,
      so the tie-break is a determinism fallback only)
    input_set: "all RelocationPolicy rows; employee is the case's employee_id target"

  - name: case_cost_ledger
    trigger: "any transition that commits, pays, or releases component funds (approve-estimate, mark-paid, confirm/complete/cancel ServiceBooking, approve/pay ExpenseClaim, settle HomeSale, case cancel/terminate-early cascades)"
    algorithm: aggregation
    formula: |
      RelocationCase.total_committed_cents =
          sum(MoveAssignment.estimated_cents where case_id == case and status in {ESTIMATE_APPROVED, DELIVERED, INVOICED})
        + sum(ServiceBooking.total_cents where case_id == case and status == CONFIRMED)
        + sum(ExpenseClaim.amount_cents where case_id == case and status == APPROVED)
      RelocationCase.total_paid_cents =
          sum(MoveAssignment.final_invoice_cents where case_id == case and status == PAID)
        + sum(ServiceBooking.total_cents where case_id == case and status == COMPLETED)
        + sum(ExpenseClaim.total_payment_cents where case_id == case and status == PAID)
        + sum(HomeSaleTransaction.capped_benefit_cents where case_id == case and status == SETTLED)
      RelocationCase.total_released_cents =
          sum of all committed amounts released by CONFIRMED->CANCELLED ServiceBooking and
          ESTIMATE_APPROVED/DELIVERED/INVOICED->CANCELLED MoveAssignment transitions
      invariant: for any committed amount X, confirm/approve moves X into committed; complete/pay/settle
      moves X out of committed and (final amount) into paid; cancel moves X out of committed and into
      released. total_paid_cents + total_committed_cents + total_released_cents is conserved across a
      confirm-then-cancel pair on the same booking (paid unchanged, committed +X then -X, released +X
      only after the cancel; see compensating invariant in scaffold_difficulty_design).
    input_set: "per-case children filtered by the explicit status sets above; CANCELLED children contribute only via released amounts"
    precision: "integer cents; no rounding"

  - name: tax_gross_up
    trigger: "POST /expense-claims/{id}/pay (SUBMITTED->...->PAID transition), only when claim.taxable == true (payment_method == REIMBURSEMENT); DIRECT_BILL claims get gross_up_cents = 0"
    algorithm: chronological
    formula: |
      # Evaluation order is pinned (circular-looking dependency resolved algebraically):
      #   tax is levied on the GROSS payment, so gross = net + tax and tax = rate x gross.
      #   Step 1: split net into bracket portions. Step 2: gross-up each portion via
      #   portion_gross_up = round_half_up(portion_net x rate / (1 - rate)). Step 3: sum portions.
      #   Step 4: gross_up_cents = sum; total_payment_cents = amount_cents + gross_up_cents.
      net = ExpenseClaim.amount_cents
      C = RelocationCase.cumulative_taxable_paid_cents  # PAID taxable claims only, in paid_at order
      variant FLAT_SUPPLEMENTAL:
        gross_up_cents = round_half_up(net x flat_gross_up_rate / (1 - flat_gross_up_rate))
      variant MARGINAL_AGGREGATE:
        T = policy.marginal_bracket_threshold_cents
        below = max(0, min(net, T - C))         # portion of this claim still under the bracket
        above = net - below
        gross_up_cents = round_half_up(below x marginal_rate_low  / (1 - marginal_rate_low))
                       + round_half_up(above  x marginal_rate_high / (1 - marginal_rate_high))
      # then: RelocationCase.cumulative_taxable_paid_cents += net (only for taxable claims)
    input_set: "the paying claim; case cumulative taxable paid cents accumulated over PAID REIMBURSEMENT claims of this case in paid_at ascending order"
    constants:
      ROUNDING: "round_half_up per bracket portion, then sum"
    precision: "integer cents, round_half_up applied per portion before summation"
    variants:
      - name: flat_supplemental
        when: "policy.gross_up_method == FLAT_SUPPLEMENTAL"
        difference: "single flat rate; ignores the case's cumulative taxable history"
      - name: marginal_aggregate
        when: "policy.gross_up_method == MARGINAL_AGGREGATE"
        difference: "tiered by cumulative taxable reimbursements; identical claims pay different gross-ups depending on pay order"

  - name: loss_on_sale_benefit
    trigger: "POST /home-sales/{id}/record-sale (LISTED->SOLD)"
    algorithm: tiered_pricing
    formula: |
      # Multi-input non-linear (nested max/min + branch on policy.loss_basis + tier-dependent cap):
      if policy.loss_basis == APPRAISED:
        gross_loss_cents = max(0, appraised_value_cents - sale_price_cents)
      else:  # PURCHASE_PRICE
        gross_loss_cents = max(0, original_purchase_price_cents - sale_price_cents)
      effective_cap = policy.loss_on_sale_cap_cents
                    + sum(ExceptionRequest.requested_cap_increase_cents
                          where case_id == case and component == LOSS_ON_SALE and status == APPROVED)
      capped_benefit_cents = min(gross_loss_cents, effective_cap)
    input_set: "the HomeSaleTransaction row; the case policy; APPROVED ExceptionRequests of this case with component == LOSS_ON_SALE"
    precision: "integer cents; no rounding"
    variants:
      - name: appraised_basis
        when: "policy.loss_basis == APPRAISED"
        difference: "loss measured against the independent appraisal"
      - name: purchase_price_basis
        when: "policy.loss_basis == PURCHASE_PRICE"
        difference: "loss measured against the employee's original purchase price; identical sale data yields a different gross loss"

  - name: repayment_schedule
    trigger: "POST /relocation-cases/{id}/terminate-early cascade (RepaymentAgreement creation)"
    algorithm: threshold
    formula: |
      # Step 1 (proration): required_service_end = case.authorized_at + repayment_window_months months.
      months_remaining = whole calendar months between employee.termination_date and required_service_end:
        (end.year - start.year) * 12 + (end.month - start.month), minus 1 if end.day < start.day;
        clamped to >= 0.
      if months_remaining == 0: no RepaymentAgreement is created.
      total_owed_cents = round_half_up(case.total_paid_cents_at_closure x months_remaining / repayment_window_months)
      # Step 2 (installment rounding — order pinned): round each regular installment DOWN first,
      # let the LAST installment absorb the remainder.
      installments_count = repayment_window_months
      installment_cents = floor(total_owed_cents / installments_count)
      final_installment_cents = total_owed_cents - (installments_count - 1) x installment_cents
      # "sum then round" would give a different final installment; the pinned order is floor-then-remainder.
    input_set: "the closing case (total_paid_cents at closure), the terminated employee, the case policy"
    constants:
      ROUNDING: "floor for regular installments; remainder absorbed by the final installment"
    precision: "integer cents"

  - name: vendor_performance_score
    trigger: "POST /move-assignments/{id}/rate (and on every read of Vendor)"
    algorithm: weighted_scoring
    formula: |
      Vendor.rating_sum   = sum(MoveAssignment.rating where vendor_id == vendor and rating is not null)
      Vendor.rating_count = count(same set)
      avg_rating_lifetime  = round_half_up(rating_sum / rating_count, 2)   # null when rating_count == 0
      window_start = logical_clock - 12 months
      avg_rating_rolling_12m = round_half_up(
          sum(MoveAssignment.rating where vendor_id == vendor and rating is not null
              and rated_at >= window_start)
        / count(same set), 2)                                            # null when count == 0
    input_set: "MoveAssignments of the vendor with rating set; rolling variant filters rated_at >= clock - 12 months (inclusive boundary)"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: lifetime
        when: "avg_rating_lifetime field"
        difference: "all rated assignments ever"
      - name: rolling_12m
        when: "avg_rating_rolling_12m field"
        difference: "only assignments rated within the trailing 12 months; old ratings age out, so identical rating history yields different averages once a rating leaves the window"

  - name: temp_housing_charge
    trigger: "POST /service-bookings with kind == TEMP_HOUSING (creation) and case_cost_ledger"
    algorithm: threshold
    formula: |
      nights = whole days between start_date (inclusive) and end_date (exclusive)  # half-open stay
      total_cents = nights x amount_cents
      validity: nights >= 1 AND nights <= policy.temp_housing_max_nights
      # boundary: nights == temp_housing_max_nights is ALLOWED; nights == max + 1 -> ERR_NIGHTS_LIMIT_EXCEEDED
    input_set: "the new booking; case policy"
    precision: "integer cents; no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, enums in range, rating 1..5, amounts positive integers, lines non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids and body foreign keys (employee_id, case_id, vendor_id) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Ownership: Employee role may only act on entities whose case.employee_id == X-User-ID; Vendor role only on MoveAssignments with vendor_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "employee/vendor-scoped endpoints (create/resubmit claims, rate, sign, employee-initiated bookings/appeals; submit-estimate/submit-invoice/mark-delivered)"
  - priority: 6
    category: state
    check: "Target entity is in a valid source state for the transition; transitions from a terminal state"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_case_version == current RelocationCase.version on guarded write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /expense-claims/{id}/approve, POST /move-assignments/{id}/approve-estimate, POST /exception-requests/{id}/approve"
  - priority: 8
    category: business_referential
    check: "Referenced entities in compatible state: case.status == IN_PROGRESS for child creation/actions (ERR_CASE_NOT_OPEN); vendor.status == ACTIVE for assignment creation and survey scheduling (ERR_VENDOR_SUSPENDED); employee ACTIVE for case create/authorize (ERR_EMPLOYEE_NOT_ACTIVE); employee TERMINATED for terminate-early (ERR_EMPLOYEE_NOT_TERMINATED); policy resolvable (ERR_POLICY_NOT_FOUND); policy.home_sale_eligible for home-sale creation (ERR_HOME_SALE_NOT_ELIGIBLE)"
    error_id: "ERR_CASE_NOT_OPEN | ERR_VENDOR_SUSPENDED | ERR_EMPLOYEE_NOT_ACTIVE | ERR_EMPLOYEE_NOT_TERMINATED | ERR_POLICY_NOT_FOUND | ERR_HOME_SALE_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "child creation and state actions"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: end_date after start_date (ERR_INVALID_DATES); TEMP_HOUSING half-open interval [start_date, end_date) must not overlap another non-CANCELLED TEMP_HOUSING booking of the same case (ERR_HOUSING_OVERLAP; touching boundaries allowed); vendor survey buffer: no other SURVEY_SCHEDULED assignment of the same vendor within +/-2 hours (ERR_SURVEY_CONFLICT; exactly 2h apart allowed)"
    error_id: "ERR_INVALID_DATES | ERR_HOUSING_OVERLAP | ERR_SURVEY_CONFLICT"
    http_status: 409
    applies_to: "POST /service-bookings, POST /move-assignments/{id}/schedule-survey"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and count limits: one RelocationPolicy per (job_level, move_scope, home_ownership); one HomeSaleTransaction per case; one RepaymentAgreement per case; appeal_count < 1 (ERR_APPEAL_LIMIT_REACHED); payment amount <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE, http 422)"
    error_id: "ERR_DUPLICATE_RESOURCE | ERR_APPEAL_LIMIT_REACHED | ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 409
    applies_to: "creation endpoints, appeal, repayment payments"
  - priority: 11
    category: business_fiscal
    check: "Policy caps: estimate/claim creation or approval must not exceed the effective component cap (policy cap + APPROVED exception increases - amounts already held); TEMP_HOUSING nights <= temp_housing_max_nights (ERR_NIGHTS_LIMIT_EXCEEDED)"
    error_id: "ERR_CAP_EXCEEDED | ERR_NIGHTS_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /service-bookings, POST /expense-claims, POST /move-assignments/{id}/approve-estimate, POST /expense-claims/{id}/approve"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Employees ---
  - { method: POST, path: "/employees", description: "Create an employee", roles: [MobilityCoordinator], code: 201, input: [full_name, job_level, home_ownership], output: Employee, side_effects: ["employment_status=ACTIVE"] }
  - { method: GET, path: "/employees/{id}", description: "Get an employee", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/employees/{id}/terminate", description: "Terminate employment (early-departure trigger); stamps termination_date from the logical clock", roles: [MobilityCoordinator], code: 200, input: [], output: Employee, side_effects: ["employment_status=TERMINATED", "termination_date=logical clock", "increments Employee.version by 1"] }

  # --- Policies ---
  - { method: POST, path: "/policies", description: "Create a policy tier; unique per (job_level, move_scope, home_ownership)", roles: [MobilityCoordinator], code: 201, input: [job_level, move_scope, home_ownership, hhg_cap_cents, temp_housing_cap_cents, temp_housing_max_nights, travel_cap_cents, loss_on_sale_cap_cents, misc_cap_cents, home_sale_eligible, repayment_window_months, gross_up_method, flat_gross_up_rate, marginal_bracket_threshold_cents, marginal_rate_low, marginal_rate_high, loss_basis], output: RelocationPolicy, side_effects: [] }
  - { method: GET, path: "/policies/{id}", description: "Get a policy", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: RelocationPolicy, side_effects: [] }

  # --- Vendors ---
  - { method: POST, path: "/vendors", description: "Register a household-goods vendor", roles: [MobilityCoordinator], code: 201, input: [name, service_regions], output: Vendor, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/vendors/{id}", description: "Get a vendor including computed rating aggregates", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/vendors/{id}/suspend", description: "Suspend a vendor (blocks new assignments and survey scheduling)", roles: [MobilityCoordinator], code: 200, input: [], output: Vendor, side_effects: ["status=SUSPENDED", "increments Vendor.version by 1"] }

  # --- Relocation cases ---
  - { method: POST, path: "/relocation-cases", description: "Open a relocation case; policy auto-resolved via policy_resolution", roles: [MobilityCoordinator], code: 201, input: [employee_id, move_scope, origin_city, destination_city, expected_move_date], output: RelocationCase, side_effects: ["status=DRAFT", "policy_id resolved", "ledger totals initialized to 0"] }
  - { method: GET, path: "/relocation-cases/{id}", description: "Get a case including computed ledger totals", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: RelocationCase, side_effects: [] }
  - { method: GET, path: "/relocation-cases", description: "List cases; reverse-reachability for employee_id and policy_id", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["employee_id?", "policy_id?", "status?", "limit?", "offset?"], output: "RelocationCase[]", side_effects: [] }
  - { method: POST, path: "/relocation-cases/{id}/authorize", description: "DRAFT -> AUTHORIZED", roles: [MobilityCoordinator], code: 200, input: [], output: RelocationCase, side_effects: ["authorized_at=logical clock", "increments RelocationCase.version by 1"] }
  - { method: POST, path: "/relocation-cases/{id}/start", description: "AUTHORIZED -> IN_PROGRESS", roles: [MobilityCoordinator], code: 200, input: [], output: RelocationCase, side_effects: ["increments RelocationCase.version by 1"] }
  - { method: POST, path: "/relocation-cases/{id}/cancel", description: "AUTHORIZED|IN_PROGRESS -> CANCELLED; cascades child cancellations and committed-fund release", roles: [MobilityCoordinator], code: 200, input: [], output: RelocationCase, side_effects: ["children cancelled", "committed funds released to total_released_cents", "increments RelocationCase.version by 1"] }
  - { method: POST, path: "/relocation-cases/{id}/terminate-early", description: "IN_PROGRESS -> CLOSED_EARLY; cascade cancels children, releases committed funds, creates RepaymentAgreement when months_remaining > 0", roles: [MobilityCoordinator], code: 200, input: [], output: RelocationCase, side_effects: ["children cancelled", "committed funds released", "RepaymentAgreement created in DRAFT if owed > 0", "increments RelocationCase.version by 1"] }
  - { method: POST, path: "/relocation-cases/{id}/close", description: "IN_PROGRESS -> CLOSED (all children terminal) or CLOSED_EARLY -> CLOSED (repayment settled); gated by RepaymentAgreement state", roles: [MobilityCoordinator], code: 200, input: [], output: RelocationCase, side_effects: ["increments RelocationCase.version by 1"] }

  # --- Move assignments (household goods) ---
  - { method: POST, path: "/move-assignments", description: "Assign a household-goods vendor to a case", roles: [MobilityCoordinator], code: 201, input: [case_id, vendor_id], output: MoveAssignment, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/move-assignments/{id}", description: "Get a move assignment", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: MoveAssignment, side_effects: [] }
  - { method: GET, path: "/move-assignments", description: "List move assignments; reverse-reachability for case_id and vendor_id", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["case_id?", "vendor_id?", "status?", "limit?", "offset?"], output: "MoveAssignment[]", side_effects: [] }
  - { method: POST, path: "/move-assignments/{id}/schedule-survey", description: "REQUESTED -> SURVEY_SCHEDULED; vendor 2h survey buffer enforced", roles: [MobilityCoordinator], code: 200, input: [survey_at], output: MoveAssignment, side_effects: ["survey_at set", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/submit-estimate", description: "SURVEY_SCHEDULED -> ESTIMATE_SUBMITTED (owning vendor only)", roles: [Vendor], code: 200, input: [estimated_cents], output: MoveAssignment, side_effects: ["estimated_cents set", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/approve-estimate", description: "ESTIMATE_SUBMITTED -> ESTIMATE_APPROVED; commits estimated_cents to the case ledger; OCC on case version", roles: [MobilityCoordinator], code: 200, input: [expected_case_version], output: MoveAssignment, side_effects: ["RelocationCase.total_committed_cents += estimated_cents", "increments RelocationCase.version by 1", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/reject-estimate", description: "ESTIMATE_SUBMITTED -> REQUESTED (re-survey cycle); clears survey_at and estimated_cents", roles: [MobilityCoordinator], code: 200, input: [], output: MoveAssignment, side_effects: ["survey_at=null", "estimated_cents=null", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/mark-delivered", description: "ESTIMATE_APPROVED -> DELIVERED (owning vendor only)", roles: [Vendor], code: 200, input: [], output: MoveAssignment, side_effects: ["increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/submit-invoice", description: "DELIVERED -> INVOICED (owning vendor only)", roles: [Vendor], code: 200, input: [final_invoice_cents], output: MoveAssignment, side_effects: ["final_invoice_cents set", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/mark-paid", description: "INVOICED -> PAID; settles committed estimate into paid at the invoiced amount; bumps vendor.completed_moves", roles: [FinanceSpecialist], code: 200, input: [], output: MoveAssignment, side_effects: ["case ledger: committed -= estimated_cents, paid += final_invoice_cents", "Vendor.completed_moves += 1", "increments RelocationCase.version by 1", "increments MoveAssignment.version by 1"] }
  - { method: POST, path: "/move-assignments/{id}/rate", description: "Record employee satisfaction rating 1-5 for a PAID move (owning employee only); feeds vendor_performance_score", roles: [Employee], code: 200, input: [rating], output: MoveAssignment, side_effects: ["rating set (one-time)", "rated_at=logical clock", "Vendor rating_sum/rating_count recomputed", "increments MoveAssignment.version by 1"] }

  # --- Service bookings (temp housing + travel) ---
  - { method: POST, path: "/service-bookings", description: "Book temp housing (kind=TEMP_HOUSING: end_date required, half-open overlap + nights + cap checks) or travel (kind=TRAVEL: end_date defaults to start_date)", roles: [Employee, MobilityCoordinator], code: 201, input: [case_id, kind, start_date, "end_date?", amount_cents], output: ServiceBooking, side_effects: ["status=HELD", "nights and total_cents computed"] }
  - { method: GET, path: "/service-bookings/{id}", description: "Get a service booking", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: ServiceBooking, side_effects: [] }
  - { method: GET, path: "/relocation-cases/{id}/service-bookings", description: "List a case's service bookings (FK reverse-reachability)", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["kind?", "status?", "limit?", "offset?"], output: "ServiceBooking[]", side_effects: [] }
  - { method: POST, path: "/service-bookings/{id}/confirm", description: "HELD -> CONFIRMED; commits total_cents to the case ledger", roles: [MobilityCoordinator], code: 200, input: [], output: ServiceBooking, side_effects: ["RelocationCase.total_committed_cents += total_cents", "increments RelocationCase.version by 1", "increments ServiceBooking.version by 1"] }
  - { method: POST, path: "/service-bookings/{id}/cancel", description: "HELD|CONFIRMED -> CANCELLED; releases committed funds when CONFIRMED", roles: [Employee, MobilityCoordinator], code: 200, input: [], output: ServiceBooking, side_effects: ["if was CONFIRMED: committed -= total_cents, released += total_cents", "increments RelocationCase.version by 1 (when release fires)", "increments ServiceBooking.version by 1"] }
  - { method: POST, path: "/service-bookings/{id}/complete", description: "CONFIRMED -> COMPLETED; moves committed total into paid", roles: [MobilityCoordinator], code: 200, input: [], output: ServiceBooking, side_effects: ["committed -= total_cents, paid += total_cents", "increments RelocationCase.version by 1", "increments ServiceBooking.version by 1"] }

  # --- Expense claims ---
  - { method: POST, path: "/expense-claims", description: "Submit an expense claim (owning employee); amount_cents computed from lines", roles: [Employee], code: 201, input: [case_id, category, payment_method, lines], output: ExpenseClaim, side_effects: ["status=SUBMITTED", "amount_cents = sum(lines)", "taxable derived from payment_method"] }
  - { method: GET, path: "/expense-claims/{id}", description: "Get an expense claim including gross-up fields", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: ExpenseClaim, side_effects: [] }
  - { method: GET, path: "/relocation-cases/{id}/expense-claims", description: "List a case's expense claims (FK reverse-reachability)", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["status?", "limit?", "offset?"], output: "ExpenseClaim[]", side_effects: [] }
  - { method: POST, path: "/expense-claims/{id}/approve", description: "SUBMITTED -> APPROVED; commits amount to case ledger; OCC on case version", roles: [FinanceSpecialist], code: 200, input: [expected_case_version], output: ExpenseClaim, side_effects: ["RelocationCase.total_committed_cents += amount_cents", "increments RelocationCase.version by 1", "increments ExpenseClaim.version by 1"] }
  - { method: POST, path: "/expense-claims/{id}/reject", description: "SUBMITTED -> REJECTED with reason", roles: [FinanceSpecialist], code: 200, input: [reject_reason], output: ExpenseClaim, side_effects: ["reject_reason set", "increments ExpenseClaim.version by 1"] }
  - { method: POST, path: "/expense-claims/{id}/resubmit", description: "REJECTED -> SUBMITTED (owning employee); optional replacement lines recompute amount_cents", roles: [Employee], code: 200, input: ["lines?"], output: ExpenseClaim, side_effects: ["lines replaced when supplied; amount_cents recomputed", "reject_reason=null", "increments ExpenseClaim.version by 1"] }
  - { method: POST, path: "/expense-claims/{id}/pay", description: "APPROVED -> PAID; runs tax_gross_up (taxable claims only) and moves committed into paid", roles: [FinanceSpecialist], code: 200, input: [], output: ExpenseClaim, side_effects: ["gross_up_cents and total_payment_cents computed", "paid_at=logical clock", "case ledger: committed -= amount_cents, paid += total_payment_cents", "if taxable: cumulative_taxable_paid_cents += amount_cents", "increments RelocationCase.version by 1", "increments ExpenseClaim.version by 1"] }

  # --- Home sale / loss on sale ---
  - { method: POST, path: "/home-sales", description: "Open the home-sale assistance program for a case (one per case; policy must be home_sale_eligible)", roles: [MobilityCoordinator], code: 201, input: [case_id, appraised_value_cents, original_purchase_price_cents, list_price_cents], output: HomeSaleTransaction, side_effects: ["status=LISTED"] }
  - { method: GET, path: "/home-sales/{id}", description: "Get a home-sale transaction including computed loss/benefit", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: HomeSaleTransaction, side_effects: [] }
  - { method: GET, path: "/relocation-cases/{id}/home-sales", description: "List a case's home-sale transactions (0 or 1 element; FK reverse-reachability)", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["limit?", "offset?"], output: "HomeSaleTransaction[]", side_effects: [] }
  - { method: POST, path: "/home-sales/{id}/record-sale", description: "LISTED -> SOLD; runs loss_on_sale_benefit with the policy's loss_basis variant", roles: [MobilityCoordinator], code: 200, input: [sale_price_cents], output: HomeSaleTransaction, side_effects: ["sale_price_cents set", "loss_basis_used, gross_loss_cents, capped_benefit_cents computed", "increments HomeSaleTransaction.version by 1"] }
  - { method: POST, path: "/home-sales/{id}/settle", description: "SOLD -> SETTLED; pays capped_benefit_cents into the case ledger", roles: [FinanceSpecialist], code: 200, input: [], output: HomeSaleTransaction, side_effects: ["RelocationCase.total_paid_cents += capped_benefit_cents", "increments RelocationCase.version by 1", "increments HomeSaleTransaction.version by 1"] }

  # --- Repayment agreements ---
  - { method: GET, path: "/repayment-agreements/{id}", description: "Get a repayment agreement including schedule and balance", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: RepaymentAgreement, side_effects: [] }
  - { method: GET, path: "/relocation-cases/{id}/repayment-agreements", description: "List a case's repayment agreements (0 or 1 element; FK reverse-reachability)", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["limit?", "offset?"], output: "RepaymentAgreement[]", side_effects: [] }
  - { method: POST, path: "/repayment-agreements/{id}/sign", description: "DRAFT -> ACTIVE (owning employee); sets signed_at and next_due_date", roles: [Employee], code: 200, input: [], output: RepaymentAgreement, side_effects: ["signed_at=logical clock", "next_due_date=signed_at + 1 month", "increments RepaymentAgreement.version by 1"] }
  - { method: POST, path: "/repayment-agreements/{id}/payments", description: "Record a payment against an ACTIVE or DEFAULTED agreement; auto-SETTLED at balance 0; auto-cures DEFAULTED when arrears covered", roles: [FinanceSpecialist], code: 200, input: [amount_cents], output: RepaymentAgreement, side_effects: ["paid_to_date_cents += amount_cents", "balance_cents recomputed", "status auto-transitions SETTLED/ACTIVE per rules", "increments RepaymentAgreement.version by 1"] }
  - { method: POST, path: "/repayment-agreements/{id}/reverse-payment", description: "Reverse a previously recorded payment (compensation); may reopen a SETTLED agreement to ACTIVE", roles: [FinanceSpecialist], code: 200, input: [amount_cents], output: RepaymentAgreement, side_effects: ["paid_to_date_cents -= amount_cents (must stay >= 0)", "balance_cents recomputed", "SETTLED -> ACTIVE when balance reopens", "increments RepaymentAgreement.version by 1"] }
  - { method: POST, path: "/repayment-agreements/{id}/mark-default", description: "ACTIVE -> DEFAULTED when the logical clock is past next_due_date and installments are missed", roles: [FinanceSpecialist], code: 200, input: [], output: RepaymentAgreement, side_effects: ["increments RepaymentAgreement.version by 1"] }

  # --- Exception requests ---
  - { method: POST, path: "/exception-requests", description: "Request a cap exception for one benefit component", roles: [Employee, MobilityCoordinator], code: 201, input: [case_id, component, requested_cap_increase_cents, justification], output: ExceptionRequest, side_effects: ["status=PENDING", "appeal_count=0"] }
  - { method: GET, path: "/exception-requests/{id}", description: "Get an exception request", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: [], output: ExceptionRequest, side_effects: [] }
  - { method: GET, path: "/relocation-cases/{id}/exception-requests", description: "List a case's exception requests (FK reverse-reachability)", roles: [MobilityCoordinator, FinanceSpecialist, ProgramManager, Employee, Vendor], code: 200, input: ["status?", "limit?", "offset?"], output: "ExceptionRequest[]", side_effects: [] }
  - { method: POST, path: "/exception-requests/{id}/approve", description: "PENDING -> APPROVED; raises the component's effective cap; OCC on case version", roles: [ProgramManager], code: 200, input: [expected_case_version, "decision_note?"], output: ExceptionRequest, side_effects: ["effective component cap += requested_cap_increase_cents", "increments RelocationCase.version by 1", "increments ExceptionRequest.version by 1"] }
  - { method: POST, path: "/exception-requests/{id}/reject", description: "PENDING -> REJECTED with note", roles: [ProgramManager], code: 200, input: [decision_note], output: ExceptionRequest, side_effects: ["decision_note set", "increments ExceptionRequest.version by 1"] }
  - { method: POST, path: "/exception-requests/{id}/appeal", description: "REJECTED -> PENDING once (appeal_count < 1)", roles: [Employee, MobilityCoordinator], code: 200, input: [], output: ExceptionRequest, side_effects: ["appeal_count += 1", "decision_note=null", "increments ExceptionRequest.version by 1"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any call the logical clock reads that default and never falls back to wall-clock time.", roles: [MobilityCoordinator], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock := to_iso8601"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership check failed (employee/vendor mismatch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum out of range, rating outside 1..5, non-positive amount, empty lines" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid source state for the requested transition (e.g. approve a REJECTED claim, pay a SUBMITTED claim, close a case with open children)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state (CLOSED/CLOSED_EARLY/CANCELLED case, PAID/CANCELLED assignment, COMPLETED/CANCELLED booking, PAID claim, SETTLED home-sale or agreement, APPROVED exception)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the RelocationCase's current version (OCC)" }
  - { id: ERR_POLICY_NOT_FOUND, http: 422, condition: "No RelocationPolicy matches the case's (job_level, move_scope, home_ownership) triple at case creation" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Case creation or authorization attempted for a TERMINATED employee" }
  - { id: ERR_EMPLOYEE_NOT_TERMINATED, http: 409, condition: "terminate-early attempted while the employee is still ACTIVE" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "MoveAssignment creation or survey scheduling with a SUSPENDED vendor" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Child creation or child action attempted while the case is not IN_PROGRESS" }
  - { id: ERR_INVALID_DATES, http: 422, condition: "end_date not after start_date, or TEMP_HOUSING stay shorter than 1 night" }
  - { id: ERR_HOUSING_OVERLAP, http: 409, condition: "TEMP_HOUSING half-open interval [start_date, end_date) overlaps another non-CANCELLED TEMP_HOUSING booking of the same case" }
  - { id: ERR_SURVEY_CONFLICT, http: 409, condition: "Vendor already has a SURVEY_SCHEDULED assignment within +/-2 hours of the requested survey_at" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violated: policy triple, one HomeSaleTransaction per case, one RepaymentAgreement per case" }
  - { id: ERR_CAP_EXCEEDED, http: 409, condition: "Amount would exceed the effective component cap (policy cap + APPROVED exception increases - held amounts)" }
  - { id: ERR_NIGHTS_LIMIT_EXCEEDED, http: 409, condition: "TEMP_HOUSING nights > policy.temp_housing_max_nights (nights == max is allowed)" }
  - { id: ERR_HOME_SALE_NOT_ELIGIBLE, http: 409, condition: "Home-sale program opened for a case whose policy has home_sale_eligible == false" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Repayment payment amount_cents > balance_cents (amount == balance is allowed and settles)" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "Second appeal of an already-appealed ExceptionRequest" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Employee
    description: "The relocating employee; owns cases via case.employee_id == X-User-ID"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /expense-claims, POST /expense-claims/{id}/resubmit (own case)"
      - "POST /move-assignments/{id}/rate (own case)"
      - "POST /repayment-agreements/{id}/sign (own case)"
    shared_operations:
      - "POST /service-bookings, POST /service-bookings/{id}/cancel (own case; shared with MobilityCoordinator)"
      - "POST /exception-requests, POST /exception-requests/{id}/appeal (own case; shared with MobilityCoordinator)"
      - "GET endpoints"
  - name: MobilityCoordinator
    description: "Corporate mobility program administrator; manages employees, policies, vendors, cases, bookings, surveys, estimates, home sales"
    identity: "opaque"
    exclusive_operations:
      - "POST /employees, POST /employees/{id}/terminate"
      - "POST /policies"
      - "POST /vendors, POST /vendors/{id}/suspend"
      - "POST /relocation-cases and all case lifecycle actions (authorize/start/cancel/terminate-early/close)"
      - "POST /move-assignments, schedule-survey, approve-estimate, reject-estimate"
      - "POST /service-bookings/{id}/confirm, /complete"
      - "POST /home-sales, record-sale"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /service-bookings, /service-bookings/{id}/cancel (shared with Employee)"
      - "POST /exception-requests, /exception-requests/{id}/appeal (shared with Employee)"
      - "GET endpoints"
  - name: Vendor
    description: "Household-goods vendor user; acts on assignments where vendor_id == X-User-ID"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /move-assignments/{id}/submit-estimate"
      - "POST /move-assignments/{id}/mark-delivered"
      - "POST /move-assignments/{id}/submit-invoice"
    shared_operations: ["GET endpoints"]
  - name: FinanceSpecialist
    description: "Finance/payroll operator; approves and pays claims, settles invoices and home-sale benefits, administers repayment agreements"
    identity: "opaque"
    exclusive_operations:
      - "POST /expense-claims/{id}/approve, /reject, /pay"
      - "POST /move-assignments/{id}/mark-paid"
      - "POST /home-sales/{id}/settle"
      - "POST /repayment-agreements/{id}/payments, /reverse-payment, /mark-default"
    shared_operations: ["GET endpoints"]
  - name: ProgramManager
    description: "Senior mobility program manager; decides exception requests"
    identity: "opaque"
    exclusive_operations:
      - "POST /exception-requests/{id}/approve, /reject"
    shared_operations: ["GET endpoints"]
