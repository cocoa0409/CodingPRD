            - { call: "POST /athletes", payload: { full_name: "Athlete B", date_of_birth: "2009-06-01", grade: 12, sex: M, primary_sport: BASEBALL, team_level: VARSITY, guardian_name: "Guard B", guardian_user_id: "g-9706", guardian_email: "gb@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { b1: $.data.id } }
          trigger:
