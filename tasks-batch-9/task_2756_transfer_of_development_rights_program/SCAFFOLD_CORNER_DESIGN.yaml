              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 20000000, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1000000, equity_adjustment_bps: 0, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-TEN", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 10 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_a: $.data.id, cert_a_v: $.data.version }
            - call: "POST /tdr/certificates/${cert_a}/split"
              payload: { units: 5, expected_certificate_version: "${cert_a_v}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { cert_b: $.data.id }
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_a}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 5, conveyance_mode: "WHOLE", agreed_price_cents: 5000000 }
