              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
