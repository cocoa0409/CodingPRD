  # ===========================================================================
  - section: rbac
    instances:
      - name: feed_manager_cannot_ship_lot
        claim_type: role_denial
        grounds: ["roles[FeedManager]", "validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Exclusive operation denial: ship is FeedyardManager-only; a FeedManager gets ERR_FORBIDDEN_FOR_ROLE at priority 2 — before the lot's state is even examined."
        test_recipe:
          setup: ["Lot L-RB1 OPEN (5 head)"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-RB1", billing_email: "rb1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-RB1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-01", out_weight_total_lbs: 3700 }
              as: FeedManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (http 403; role check precedes the lot's MARKETED-state check)"

      - name: health_tech_cannot_create_ration
        claim_type: role_denial
        grounds: ["roles[CattleHealthTech]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Peer-role isolation: CattleHealthTech cannot formulate rations (FeedManager exclusive) -> ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-RB2", step_level: 1, cost_per_ton_cents: 20000 }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (http 403)"

      - name: sod_same_adjuster_cannot_pay_own_decision
        claim_type: role_denial
        grounds: ["roles[ClaimsAdjuster]", "validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: pay is open to both claims roles, but the user who DECIDED the claim cannot be the one who pays it — same X-User-ID fails with ERR_SEGREGATION_OF_DUTIES_VIOLATION; a different user succeeds."
        test_recipe:
          setup: ["Lot L-RB3 with insured loss (value 140000c); claim 100000c approved by adj-7"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-RB3", billing_email: "rb3@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-RB3", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-7"
          trigger:
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsAdjuster
              as_user_id: "adj-7"
              captures: { err: $.data.error_id }
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-9"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES_VIOLATION (http 403; adj-7 decided, so adj-7 cannot pay)"
            - "st == PAID (tre-9 != adj-7 satisfies the segregation rule)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: fk_reverse_reachability_lists_children
        claim_type: cross_reference_link
        grounds: ["endpoints[GET /feedlot/lots/{id}/death-losses]", "endpoints[GET /feedlot/death-losses/{id}/insurance-claims]", "endpoints[GET /feedlot/owners/{id}/lots]"]
        distinguishing_aspect: "Every FK is traversable from the parent: the lot's death losses list contains the recorded loss, the loss's claims list contains the filed claim, and the owner's lots list contains the lot — all as arrays."
        test_recipe:
          setup: ["Owner O-EP1 with lot L-EP1; one death loss; one claim on it"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-EP1", billing_email: "ep1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-EP1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /feedlot/owners/${o_id}/lots"
              as: Any
              captures: { lot_back: "$.data[0].id" }
            - call: "GET /feedlot/lots/${l_id}/death-losses"
              as: Any
              captures: { dl_back: "$.data[0].id" }
            - call: "GET /feedlot/death-losses/${d_id}/insurance-claims"
              as: Any
              captures: { cl_back: "$.data[0].id" }
          assert:
            - "lot_back == ${l_id}"
            - "dl_back == ${d_id}"
            - "cl_back == ${c_id}"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_closeout_create_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[closeout-create-stale-lot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: the close-out create observes the Lot's version; a version captured before the ship mutation (which bumped it) is stale -> 412 ERR_STALE_VERSION; the same call with the current version succeeds (create-with-supersede stays legal)."
        test_recipe:
          setup: ["Lot L-OCC1 (10 head, arrival 2026-08-01) marketed — version captured at the market response — then shipped (which advances the version); clock 2026-08-02"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-OCC1", billing_email: "occ1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-OCC1", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
              captures: { lot_v_m: $.data.version }
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-02", out_weight_total_lbs: 8000 }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v_m}" }
              as: RiskManager
              captures: { err: $.data.error_id }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { v_now: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 19000, expected_lot_version: "${v_now}" }
              as: RiskManager
              captures: { st: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION (http 412; ship advanced Lot.version past the client's captured version)"
            - "st == DRAFT with the freshly read version"

      - name: occ_stale_version_on_hedge_create_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[hedge-create-stale-lot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer on a different write endpoint: a death loss silently advances Lot.version, so a hedge created against the pre-death version is rejected with 412; with the fresh version the same hedge (2 contracts, 800 <= 1185 cwt after the death) succeeds."
        test_recipe:
          setup: ["Lot L-OCC2 (80 head, 80000 lbs, avg 1000 -> marketable 1200 cwt) created, version captured; then a death loss of 1 head on 2026-08-01 (default clock) advances the lot's version and shrinks marketable to 1185 cwt"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-OCC2", billing_email: "occ2@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-OCC2", sex_class: "STEER", head_count_in: 80, in_weight_total_lbs: 80000, purchase_cost_cents: 9600000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: false }
              as: CattleHealthTech
          trigger:
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", quantity_contracts: 2, entry_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v0}" }
              as: RiskManager
              captures: { err: $.data.error_id }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { v_now: $.data.version }
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", quantity_contracts: 2, entry_price_cents_per_cwt: 19000, expected_lot_version: "${v_now}" }
              as: RiskManager
              captures: { st: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION (http 412; the death-loss cascade bumped Lot.version)"
            - "st == OPEN (fresh version; 2 x 400 = 800 <= 1185 marketable after the death)"

      - name: derived_field_lot_feed_cost_reconciles
        claim_type: derived_field_reconciliation
        grounds: ["entities.Lot.fields.total_feed_cost_cents"]
        excluded_because:
          difficulty_instance: feed_call_bunk_score_branch_and_clamp
          rationale: "Lot.total_feed_cost_cents accumulation is asserted after each feed call in the named §1.8 instance (48800/29900)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a resource created by POST is fully visible in the very next GET, including computed fields (occupancy after an assignment)."
        test_recipe:
          setup: ["Owner, pen IM-01, and lot L-IM1 exist; assignment of 5 head created"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-IM1", billing_email: "im1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "IM-01", capacity_head: 50 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-IM1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { a_id: $.data.id }
            - call: "GET /feedlot/pens/${p_id}"
              as: Any
              captures: { occ: $.data.current_occupancy_head, st: $.data.status }
          assert:
            - "occ == 5 and st == OCCUPIED in the immediately following GET (no lag, no reconciliation window)"
