      - name: underwrite_marks_measure_ineligible_when_product_retired
        grounds:
          - validations[priority=8]
          - state_machines.ProjectMeasure.PROPOSED_to_INELIGIBLE
          - entities.EligibleProduct.fields.status
          - entities.Application.fields.requested_principal_cents
          - calculations.savings_to_investment_ratio
        distinguishing_aspect: |
          Entity pair = ProjectMeasure x EligibleProduct — a catalog dependency rather than the
          Disbursement/FinancingAgreement temporal one. The HVAC measure passes the per-measure SIR
          gate on its own numbers (11461 bps >= 10000) and is still ruled INELIGIBLE purely because
          its product was RETIRED between submit and underwrite, and the whole application is then
          re-priced on the surviving 3000000 of solar. The retirement is invisible on the measure
          row itself, so an implementation that only re-reads measures gets the wrong principal.
        test_recipe:
          setup:
            - "Clock 2026-08-12. Products SOLAR_PV (25y, cap 300000) and HVAC (18y, cap 120000), both ACTIVE at submit time."
            - "Fixture A parcel: assessed 40000000, senior lien 25000000; measures solar 3000000/220000 (pv 3830892, sir 12770) and hvac 1200000/100000 (pv 1375351, sir 11461); at submit requested_principal_cents 4200000, portfolio SIR 12396, weighted useful life 23, term 20."
            - "Between submit and underwrite the HVAC product is RETIRED with PATCH /pace/products/{id}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "HVAC_HEATPUMP", category: "HVAC", useful_life_years: 18, max_annual_savings_cents: 120000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_hvac: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000, preferred_language: "EN" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1_v1: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_hvac}", installed_cost_cents: 1200000, estimated_annual_savings_cents: 100000, expected_application_version: "${a1_v1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_hvac: $.data.id }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
          trigger:
            - call: "PATCH /pace/products/${prod_hvac}"
              payload: { status: "RETIRED" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /pace/applications/${a1}/eligibility-report"
              payload: {}
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
