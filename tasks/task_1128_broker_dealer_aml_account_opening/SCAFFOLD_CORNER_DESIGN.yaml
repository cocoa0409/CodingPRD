            - { call: "POST /aml/customers/${cust_b}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-P02b", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_b: "$.data.id" } }
