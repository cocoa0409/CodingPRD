            - "A payment of 92462 instead of 92461 is rejected 422 ERR_PAYMENT_EXCEEDS_OUTSTANDING with paid_cents unchanged at 60000"
            - "sum(recoverable_alloc) == 21176 + 32000 + 29900 + 69385 == 152461: LABOR absorbs the whole 38115 subsidy shortfall against its 107500 cap"

