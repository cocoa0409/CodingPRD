            - *c_clock_m
            - *c_complete_m
            - *c_get4
          trigger:
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v4}" }
              as: ImmigrationJudge
              as_user_id: "${judge2}"
              captures: { err1: $.data.error_id }
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v4}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "the unassigned judge's attempt fails 403 ERR_NOT_ASSIGNED_JUDGE (ownership, priority 4, precedes the readiness check)"
            - "the assigned judge's attempt fails 409 ERR_NO_COMPLETED_MERITS_HEARING (case MERITS but no COMPLETED INDIVIDUAL_MERITS hearing)"
            - "GET /eoir/decisions?case_id=${case_id} returns 0 rows"

      - name: detained_hearing_requires_remote
