          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; an ACTIVE plan for the patient."
            - "A LOANABLE_SERIALIZED item with initial_qty 3, replacement_cost 300.00, useful_life_months 24 and in_service_date 2025-06-01, so exactly 12 whole months are elapsed."
