# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1139: Contingent Labor Rate Card & SOW Management
# Sections follow references/claim-extraction-guide.md. Stubs marked
# excluded_because: are covered by §1.8 difficulty instances (by name).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: rate_card_creation_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.RateCard", "endpoints.POST /v1/rate-cards"]
        distinguishing_aspect: "Created rate card starts DRAFT with version 1, server-minted id, supersedes_id null; client-supplied status/version in the body are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-05-01", effective_to: "2026-08-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id", rc_status: "$.data.status", rc_v: "$.data.version" }
          trigger:
            - call: "GET /v1/rate-cards/${rc_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "status == DRAFT (initial_state), version == 1, supersedes_id is null"
            - "id is a server-minted UUID; created_at/updated_at are ISO8601 UTC with 3 fractional digits"

      - name: supplier_missing_required_tier_returns_400
        claim_type: required_fields
        grounds: ["entities.Supplier", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/suppliers without required field tier yields ERR_VALIDATION (400), and no supplier is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/suppliers"
              payload: { name: "No Tier Co", supplier_code: "SUP-NT" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"
            - "GET /v1/suppliers afterwards returns total_count == 0"

      - name: worker_carryover_and_tenure_defaults
        claim_type: defaults
        grounds: ["entities.Worker.fields.tenure_carryover_days", "entities.Worker.fields.cumulative_tenure_days"]
        distinguishing_aspect: "Omitting tenure_carryover_days applies default 0; cumulative_tenure_days computes to 0 with no assignments."
        test_recipe:
          setup: ["supplier S1 exists"]
          setup_api_calls:
            - call: "POST /v1/suppliers"
              payload: { name: "Defaults Co", supplier_code: "SUP-DF", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "No Carry", email: "nc@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w_id: "$.data.id", w_carry: "$.data.tenure_carryover_days", w_cum: "$.data.cumulative_tenure_days", w_status: "$.data.status" }
          trigger: []
          assert:
            - "Worker.${w_id}.tenure_carryover_days == 0 (default applied)"
            - "Worker.${w_id}.cumulative_tenure_days == 0"
            - "Worker.${w_id}.status == ONBOARDING (initial state) and conversion_status == NONE"

      - name: engagement_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Engagement.fields.committed_spend_cents", "validations[priority=3]"]
        distinguishing_aspect: "Passing committed_spend_cents (a computed field) in the create body is ignored, not persisted: the created engagement reports 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /v1/engagements"
              payload: { title: "Sneaky", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000, committed_spend_cents: 999999 }
              as: HiringManager
              captures: { e_id: "$.data.id", e_committed: "$.data.committed_spend_cents" }
          trigger: []
          assert:
            - "Engagement.${e_id}.committed_spend_cents == 0 — client-supplied computed field ignored"
            - "Engagement.${e_id}.prorata_conversion == false (default) and misclassification_risk is null before first review"

      - name: missing_engagement_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/engagements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: invalid_enum_tier_rejected
        claim_type: type_constraints
        grounds: ["entities.Supplier.fields.tier", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "tier: GOLD is outside the declared enum {PREFERRED, APPROVED, PROBATION} -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/suppliers"
              payload: { name: "Gold Co", supplier_code: "SUP-GOLD", tier: "GOLD" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: ledger_entry_immutable_no_version
        claim_type: immutability
        grounds: ["entities.SpendLedgerEntry"]
        distinguishing_aspect: "SpendLedgerEntry has common_fields false: its read representation exposes id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "staffed REQUISITION engagement with one APPROVED timesheet (10h x 9000 = 90000), producing exactly one ledger entry"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Ledger Co", supplier_code: "SUP-LG", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Ledger", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9000, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 10.0 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t1_id: "$.data.id" }
            - { call: "POST /v1/timesheets/${t1_id}/submit", payload: {}, as: Worker, as_user_id: "${w1_id}" }
            - { call: "POST /v1/timesheets/${t1_id}/approve", payload: {}, as: HiringManager }
          trigger:
            - call: "GET /v1/spend-ledger-entries"
              payload: { timesheet_id: "${t1_id}" }
              as: FinanceAnalyst
              captures: { le_id: "$.data[0].id", le_delta: "$.data[0].delta_cents", le_type: "$.data[0].entry_type" }
            - call: "GET /v1/spend-ledger-entries/${le_id}"
              payload: {}
              as: FinanceAnalyst
          assert:
            - "ledger entry ${le_id}: entry_type == TIMESHEET_APPROVED, delta_cents == 90000, running_balance_cents == 90000"
            - "response contains id and created_at but no version and no updated_at (common_fields: false, append-only)"

  - section: state_machines
    instances:
      - name: timesheet_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.Timesheet"]
        distinguishing_aspect: "A freshly created timesheet is DRAFT with provisional_amount_cents still null (provisional is computed only at submit)."
        test_recipe:
          setup: ["staffed pipeline through an ACTIVE assignment A1 (standard staffing chain)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Init Co", supplier_code: "SUP-IN", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Init", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 8.0 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t_id: "$.data.id", t_status: "$.data.status", t_prov: "$.data.provisional_amount_cents" }
          assert:
            - "Timesheet.${t_id}.status == DRAFT and provisional_amount_cents is null at creation"

      - name: approve_draft_timesheet_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Timesheet.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve is declared only from SUBMITTED; calling it on a DRAFT timesheet yields ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["staffed pipeline; timesheet T1 created but never submitted (DRAFT)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Draft Co", supplier_code: "SUP-DR", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Draft gate", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 8.0 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t1_id: "$.data.id" }
          trigger:
            - call: "POST /v1/timesheets/${t1_id}/approve"
              payload: {}
              as: HiringManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Timesheet.${t1_id} remains DRAFT; no ledger entry, no invoice line, committed_spend_cents == 0"

      - name: double_approve_rejected
        claim_type: idempotency
        grounds: ["state_machines.Timesheet.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "Approving an already-APPROVED timesheet fails with ERR_INVALID_STATE — the approval side effects (ledger, invoice line) fire exactly once."
        test_recipe:
          setup: ["staffed pipeline; timesheet T1 SUBMITTED then APPROVED (10h x 9000 = 90000)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Idem Co", supplier_code: "SUP-ID", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Idem", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9000, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 10.0 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t1_id: "$.data.id" }
            - { call: "POST /v1/timesheets/${t1_id}/submit", payload: {}, as: Worker, as_user_id: "${w1_id}" }
            - { call: "POST /v1/timesheets/${t1_id}/approve", payload: {}, as: HiringManager }
          trigger:
            - call: "POST /v1/timesheets/${t1_id}/approve"
              payload: {}
              as: HiringManager
              captures: { err: "$.data.error_id" }
            - call: "GET /v1/spend-ledger-entries"
              payload: { timesheet_id: "${t1_id}" }
              as: FinanceAnalyst
          assert:
            - "second approve rejected with ERR_INVALID_STATE (409)"
            - "still exactly one ledger entry for ${t1_id} (total_count == 1); supplier spend_ytd_cents == 90000 (no double-count)"

      - name: withdraw_declined_offer_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DistributionOffer.OFFERED_to_WITHDRAWN"]
        distinguishing_aspect: "withdraw is declared only from OFFERED; a DECLINED offer cannot be withdrawn (terminal state lockdown)."
        test_recipe:
          setup: ["supplier S1; engagement OPEN then FILLING with offer O1; S1 DECLINEs O1"]
          setup_api_calls:
            - call: "POST /v1/suppliers"
              payload: { name: "Decline Co", supplier_code: "SUP-DC", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Decline", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "DECLINE" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
          trigger:
            - call: "POST /v1/distribution-offers/${o1_id}/withdraw"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409); offer remains DECLINED"

      - name: first_offer_accept_bubbles_engagement_active
        claim_type: bubble_up
        grounds: ["state_machines.Engagement.FILLING_to_ACTIVE", "state_machines.DistributionOffer.OFFERED_to_ACCEPTED"]
        distinguishing_aspect: "The first ACCEPTED offer moves the engagement FILLING -> ACTIVE and pins awarded_supplier_id; a second supplier's ACCEPT does not change awarded_supplier_id."
        test_recipe:
          setup: ["suppliers S1 PREFERRED and S2 APPROVED; engagement FILLING with offers O1 (S1) and O2 (S2)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "First Co", supplier_code: "SUP-F1", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/suppliers"
              payload: { name: "Second Co", supplier_code: "SUP-F2", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s2_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Bubble", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
