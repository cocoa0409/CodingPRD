      - name: move_job_cancel_from_dispatched_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MoveJob.status.SCHEDULED_to_CANCELLED
          - validations[priority=23]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is only reachable from DRAFT or SCHEDULED; a DISPATCHED move job rejects the cancel with ERR_INVALID_STATE and keeps status DISPATCHED."
        test_recipe:
          setup: ["One client with two ZONE_A locations, one UPRIGHT instrument and a move job driven to DISPATCHED."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Move Client", email: "mv@example.com", phone: "555-0318", home_zone_code: "ZONE_A" }
