              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-01", medication_class: "PRESCRIPTION", dose_units: 1, administered_at: "2026-08-01T09:00:00.000Z", administered_by_role: "RN" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { rx_record_id: "$.data.id" }
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-01", medication_class: "PRESCRIPTION", dose_units: 1, administered_at: "2026-08-01T13:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
