scenario: "desgin task harder than expert level.!!!!2132. Grief & Bereavement Support Program (hospice bereavement program): referral intake (hospice/funeral home/self) & needs assessment, group cohort formation by loss type & schedule, individual counseling referral & waitlist, remembrance event planning & family invitations, anniversary outreach & follow-up cadence, volunteer companion training & matching, program funding & grant reporting, participant outcome measurement"
domain_name: "grief-bereavement-support"
api_prefix: "/bereavement"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Sixteen entities form a graph, not a tree: Participant is reachable from Referral,
    and fans out into Enrollment (many-to-many with Cohort), CounselingReferral
    (many-to-many with Counselor), CompanionMatch (many-to-many with VolunteerCompanion),
    Invitation (many-to-many with RemembranceEvent) and AnniversaryOutreach. MeetingSpace
    is a shared resource contended by two structurally different occupation shapes
    (a Cohort's recurring weekly block vs a RemembranceEvent's one-off block).
    FundingAllocation is polymorphic across Cohort and RemembranceEvent subjects and
    is the ledger edge into GrantAward. Five of the twelve state machines are non-linear
    (Cohort, Participant, CounselingReferral, VolunteerCompanion, GrantReport carry
    cycles; Participant additionally carries two independent state dimensions).

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: source_type
        type: enum
        source: input
        description: "Who submitted the intake record."
        constraints: "one of {HOSPICE, FUNERAL_HOME, SELF}"
      - name: source_org_name
        type: string
        source: input
        description: "Name of the referring organisation; required when source_type != SELF, must be omitted or null when source_type == SELF."
        default: null
      - name: decedent_name
        type: string
        source: input
        description: "Name of the person who died."
      - name: date_of_death
        type: string
        source: input
        description: "Date of death, YYYY-MM-DD. Must not be later than the logical clock date."
      - name: relationship_to_deceased
        type: enum
        source: input
        description: "Relationship of the bereaved contact to the decedent."
        constraints: "one of {SPOUSE, CHILD, PARENT, SIBLING, OTHER_FAMILY, FRIEND, CAREGIVER}"
      - name: loss_type
        type: enum
        source: input
        description: "Clinical loss category driving cohort matching and companion endorsement."
        constraints: "one of {ANTICIPATED_ILLNESS, SUDDEN_DEATH, PERINATAL, SUICIDE, OVERDOSE, PEDIATRIC}"
      - name: contact_name
        type: string
        source: input
        description: "Name of the bereaved contact who will become the Participant."
      - name: contact_email
        type: string
        source: input
        description: "Contact email for the bereaved contact."
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle state."
        default: RECEIVED
        constraints: "one of {RECEIVED, SCREENED, ACCEPTED, DECLINED}"
      - name: screening_band
        type: enum
        source: computed
        description: "Set by the screen transition from days_since_death; null until SCREENED."
        default: null
        constraints: "one of {URGENT, PRIORITY, ROUTINE}"
      - name: days_since_death
        type: integer
        source: computed
        description: "Whole days between date_of_death and the logical clock date at screening time; null until SCREENED."
        default: null
      - name: eligibility_note
        type: string
        source: input
        description: "Free-text screening note supplied by the IntakeCoordinator at screening."
        default: null
      - name: decline_reason
        type: enum
        source: input
        description: "Reason recorded by the decline transition; null unless status == DECLINED."
        default: null
        constraints: "one of {OUT_OF_AREA, DUPLICATE, DECLINED_SERVICES, INELIGIBLE_TIMING}"
      - name: participant_id
        type: string
        source: system
        description: "FK -> Participant.id; the Participant minted by the accept transition. Null until status == ACCEPTED."
        default: null

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: system
        description: "FK -> Referral.id; the accepted intake record this Participant was minted from."
      - name: display_name
        type: string
        source: system
        description: "Copied verbatim from Referral.contact_name at accept time."
      - name: loss_type
        type: enum
        source: system
        description: "Copied verbatim from Referral.loss_type at accept time."
        constraints: "one of {ANTICIPATED_ILLNESS, SUDDEN_DEATH, PERINATAL, SUICIDE, OVERDOSE, PEDIATRIC}"
      - name: relationship_to_deceased
        type: enum
        source: system
        description: "Copied verbatim from Referral.relationship_to_deceased at accept time."
      - name: date_of_death
        type: string
        source: system
        description: "Copied verbatim from Referral.date_of_death at accept time."
      - name: anniversary_month_day
        type: string
        source: computed
        description: "MM-DD slice of date_of_death, used by the outreach cadence plan."
      - name: service_status
        type: enum
        source: system
        description: "Service dimension of the Participant's parallel state machine."
        default: INTAKE
        constraints: "one of {INTAKE, ASSESSED, ACTIVE, MAINTENANCE, DISCHARGED, WITHDRAWN}"
      - name: outreach_status
        type: enum
        source: system
        description: "Outreach dimension of the Participant's parallel state machine; evolves independently of service_status."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ON_HOLD, LAPSED, CLOSED}"
      - name: risk_tier
        type: enum
        source: computed
        description: "Derived from composite_need_index thresholds; may additionally be escalated one level by the counseling re-entry cascade."
        default: LOW
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: composite_need_index
        type: number
        source: computed
        description: "Weighted needs score in 0.00..100.00 from the most recent NEEDS Assessment."
        default: 0
      - name: waitlist_reentry_count
        type: integer
        source: system
        description: "Number of times one of this Participant's CounselingReferrals fell back from ASSIGNED to WAITLISTED."
        default: 0
      - name: sessions_attended_total
        type: integer
        source: system
        description: "Sum of sessions_attended over this Participant's Enrollments at the moment each Enrollment reached COMPLETED."
        default: 0
      - name: outreach_cadence_days
        type: integer
        source: computed
        description: "Follow-up cadence derived from risk_tier: LOW 90, MODERATE 60, HIGH 30."
        default: 90
      - name: baseline_score
        type: number
        source: computed
        description: "normalized_score of the earliest BASELINE Assessment; null until one exists."
        default: null
      - name: latest_score
        type: number
        source: computed
        description: "normalized_score of the latest MIDPOINT-or-EXIT Assessment; null until one exists."
        default: null
      - name: has_active_companion
        type: boolean
        source: computed
        description: "True when at least one CompanionMatch for this Participant is in status ACTIVE."
        default: false

  - name: Assessment
    parent: Participant
    common_fields: false
    fields:
      - name: participant_id
        type: string
        source: system
        description: "FK -> Participant.id; the assessed Participant, taken from the path."
      - name: kind
        type: enum
        source: input
        description: "Assessment purpose. NEEDS drives risk tiering; BASELINE/MIDPOINT/EXIT drive outcome measurement."
        constraints: "one of {NEEDS, BASELINE, MIDPOINT, EXIT}"
      - name: instrument
        type: enum
        source: input
        description: "Instrument used to collect the sub-scores."
        constraints: "one of {ICG_SF, PG13}"
      - name: grief_severity
        type: integer
        source: input
        description: "Grief severity sub-score."
        constraints: "integer 0..40 inclusive"
      - name: isolation_index
        type: integer
        source: input
        description: "Social isolation sub-score."
        constraints: "integer 0..20 inclusive"
      - name: functional_impairment
        type: integer
        source: input
        description: "Functional impairment sub-score."
        constraints: "integer 0..20 inclusive"
      - name: suicidality_flag
        type: boolean
        source: input
        description: "True when the instrument flagged suicidal ideation."
        default: false
      - name: raw_total
        type: integer
        source: computed
        description: "grief_severity + isolation_index + functional_impairment."
      - name: normalized_score
        type: number
        source: computed
        description: "raw_total / 80 * 100, 2 decimal places, round_half_up."
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical clock value at the moment the Assessment was recorded."
      - name: sequence_index
        type: integer
        source: system
        description: "1-based counter of Assessments for this Participant across all kinds, in creation order."

  - name: MeetingSpace
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable room name."
      - name: capacity
        type: integer
        source: input
        description: "Maximum seated occupancy."
        constraints: "integer >= 1"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minutes of cleaning/turnover that must separate two occupations of this space."
        default: 30
        constraints: "integer >= 0"
      - name: accessibility_features
        type: array
        source: input
        description: "Free-form accessibility tags."
        default: []
      - name: status
        type: enum
        source: system
        description: "Space availability."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OUT_OF_SERVICE}"

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Cohort label."
      - name: loss_type
        type: enum
        source: input
        description: "Loss category this cohort serves; Enrollment requires an exact match with Participant.loss_type."
        constraints: "one of {ANTICIPATED_ILLNESS, SUDDEN_DEATH, PERINATAL, SUICIDE, OVERDOSE, PEDIATRIC}"
      - name: meeting_space_id
        type: string
        source: input
        description: "FK -> MeetingSpace.id; the space occupied by every session of this cohort's weekly series."
      - name: seats_total
        type: integer
        source: input
        description: "Conserved seat pool: seats_total == seats_open + seats_held + seats_filled at all times."
        constraints: "integer >= 1; must be <= MeetingSpace.capacity"
      - name: min_viable_enrollment
        type: integer
        source: input
        description: "Confirmed-seat floor that decides RUNNING vs UNDERSUBSCRIBED at launch."
        constraints: "integer >= 1 and <= seats_total"
      - name: seats_held
        type: integer
        source: computed
        description: "Count of Enrollments in status HELD."
        default: 0
      - name: seats_filled
        type: integer
        source: computed
        description: "Count of Enrollments in status CONFIRMED or ATTENDING."
        default: 0
      - name: seats_open
        type: integer
        source: computed
        description: "seats_total - seats_held - seats_filled."
        default: 0
      - name: weekday
        type: enum
        source: input
        description: "Weekday on which every session of the series occurs."
        constraints: "one of {MON, TUE, WED, THU, FRI, SAT, SUN}"
      - name: start_minute_utc
        type: integer
        source: input
        description: "Session start, minutes after 00:00 UTC."
        constraints: "integer 0..1439"
      - name: duration_minutes
        type: integer
        source: input
        description: "Session length in minutes."
        constraints: "integer >= 1; start_minute_utc + duration_minutes <= 1440"
      - name: series_start_date
        type: string
        source: input
        description: "Date of the first session, YYYY-MM-DD; its weekday must equal the weekday field."
      - name: sessions_total
        type: integer
        source: input
        description: "Number of weekly sessions in the series."
        constraints: "integer >= 1"
      - name: series_end_date
        type: string
        source: computed
        description: "series_start_date + 7 * (sessions_total - 1) days."
      - name: status
        type: enum
        source: system
        description: "Cohort lifecycle state."
        default: FORMING
        constraints: "one of {FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, RUNNING, SUSPENDED, COMPLETED, CANCELLED}"
      - name: direct_cost_cents
        type: integer
        source: input
        description: "Planned direct programme cost of the whole series, in cents."
        constraints: "integer >= 0"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Indirect fee derived from direct_cost_cents by the pinned single-pass tier rule."
      - name: program_cost_total_cents
        type: integer
        source: computed
        description: "direct_cost_cents + admin_fee_cents."

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the enrolled Participant."
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the cohort whose seat pool this Enrollment draws from."
      - name: status
        type: enum
        source: system
        description: "Seat lifecycle state."
        default: HELD
        constraints: "one of {HELD, CONFIRMED, ATTENDING, COMPLETED, WITHDRAWN, EXPIRED}"
      - name: held_until
        type: datetime
        source: computed
        description: "created_at + 72 hours; the ops run expires HELD Enrollments past this instant."
      - name: sessions_attended
        type: integer
        source: system
        description: "Sessions this Enrollment has been marked present for."
        default: 0
      - name: attendance_ratio
        type: number
        source: computed
        description: "sessions_attended / Cohort.sessions_total, 4 decimal places, round_half_up."
        default: 0
      - name: withdraw_reason
        type: enum
        source: input
        description: "Reason recorded when the Enrollment leaves for WITHDRAWN; null otherwise."
        default: null
        constraints: "one of {PARTICIPANT_REQUEST, NO_SHOW, TRANSFERRED, PROGRAM_CANCELLED}"

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Counselor name."
      - name: license_type
        type: enum
        source: input
        description: "Professional licence held."
        constraints: "one of {LCSW, LPC, PSYCHOLOGIST, CHAPLAIN}"
      - name: specialties
        type: array
        source: input
        description: "Loss types this counselor is credentialed for; each element is a loss_type enum member."
      - name: caseload_cap
        type: integer
        source: input
        description: "Maximum count of CounselingReferrals this Counselor may hold in status ASSIGNED."
        constraints: "integer >= 1"
      - name: weekly_capacity_minutes
        type: integer
        source: input
        description: "Aggregate counselling minutes available per rolling week."
        constraints: "integer >= 0"
      - name: active_caseload
        type: integer
        source: computed
        description: "Count of CounselingReferrals in status ASSIGNED pointing at this Counselor."
        default: 0
      - name: committed_minutes
        type: integer
        source: computed
        description: "Sum of requested_minutes_per_week over this Counselor's ASSIGNED CounselingReferrals."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Counselor availability."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: CounselingReferral
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the Participant awaiting individual counselling."
      - name: counselor_id
        type: string
        source: system
        description: "FK -> Counselor.id; set on ASSIGNED, cleared back to null whenever the referral returns to WAITLISTED."
        default: null
      - name: requested_minutes_per_week
        type: integer
        source: input
        description: "Weekly counselling minutes this referral will consume from the assigned Counselor's capacity."
        constraints: "integer >= 1"
      - name: urgency
        type: enum
        source: input
        description: "Clinical urgency band feeding queue_priority."
        constraints: "one of {ROUTINE, PRIORITY, URGENT}"
      - name: required_specialty
        type: enum
        source: input
        description: "Loss type the assigned Counselor must list in specialties."
        constraints: "one of {ANTICIPATED_ILLNESS, SUDDEN_DEATH, PERINATAL, SUICIDE, OVERDOSE, PEDIATRIC}"
      - name: status
        type: enum
        source: system
        description: "Waitlist lifecycle state."
        default: WAITLISTED
        constraints: "one of {WAITLISTED, ASSIGNED, CLOSED, CANCELLED}"
      - name: queue_priority
        type: number
        source: computed
        description: "Waitlist ranking score, 2 decimal places, round_half_up."
        default: 0
      - name: waitlisted_at
        type: datetime
        source: system
        description: "Logical clock value at the moment this referral (re-)entered WAITLISTED."
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical clock value of the most recent ASSIGNED transition; null while WAITLISTED."
        default: null
      - name: close_reason
        type: enum
        source: input
        description: "Reason recorded by the close transition; null unless status == CLOSED."
        default: null
        constraints: "one of {COMPLETED, PARTICIPANT_WITHDRAWN, COUNSELOR_UNAVAILABLE, DECLINED}"

  - name: VolunteerCompanion
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer name."
      - name: endorsed_loss_types
        type: array
        source: input
        description: "Loss types this volunteer may accompany; each element is a loss_type enum member."
        default: []
      - name: max_concurrent_matches
        type: integer
        source: input
        description: "Maximum count of CompanionMatches this volunteer may hold in status ACTIVE."
        default: 3
        constraints: "integer >= 1"
      - name: training_hours
        type: number
        source: computed
        description: "Sum of hours over all recorded training records, 2 decimal places."
        default: 0
      - name: modules_completed
        type: array
        source: computed
        description: "module_code values recorded so far, in the order recorded."
        default: []
      - name: certified_on
        type: string
        source: computed
        description: "Logical clock date of the transition into CERTIFIED; null before certification."
        default: null
      - name: certification_expires_on
        type: string
        source: computed
        description: "certified_on + 365 days; the ops run lapses the volunteer once the clock date passes it."
        default: null
      - name: active_match_count
        type: integer
        source: computed
        description: "Count of CompanionMatches for this volunteer in status ACTIVE."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Volunteer training/eligibility state."
        default: APPLIED
        constraints: "one of {APPLIED, IN_TRAINING, CERTIFIED, LAPSED, SUSPENDED}"

  - name: CompanionMatch
    parent: null
    common_fields: true
    fields:
      - name: companion_id
        type: string
        source: input
        description: "FK -> VolunteerCompanion.id; the proposed volunteer."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the Participant to be accompanied."
      - name: status
        type: enum
        source: system
        description: "Match lifecycle state."
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, DECLINED, ENDED}"
      - name: match_score
        type: number
        source: computed
        description: "Fit score in 0.00..100.00 computed at proposal time and never recomputed afterwards."
      - name: started_on
        type: string
        source: system
        description: "Logical clock date of the transition into ACTIVE; null otherwise."
        default: null
      - name: ended_on
        type: string
        source: system
        description: "Logical clock date of the transition into ENDED; null otherwise."
        default: null
      - name: end_reason
        type: enum
        source: input
        description: "Reason recorded by the end transition; null unless status == ENDED."
        default: null
        constraints: "one of {COMPLETED, COMPANION_LAPSED, PARTICIPANT_WITHDRAWN, MISMATCH}"

  - name: RemembranceEvent
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Event title."
      - name: meeting_space_id
        type: string
        source: input
        description: "FK -> MeetingSpace.id; the space occupied by this one-off event."
      - name: event_date
        type: string
        source: input
        description: "Date of the event, YYYY-MM-DD; must not be earlier than the logical clock date."
      - name: start_minute_utc
        type: integer
        source: input
        description: "Event start, minutes after 00:00 UTC."
        constraints: "integer 0..1439"
      - name: duration_minutes
        type: integer
        source: input
        description: "Event length in minutes."
        constraints: "integer >= 1; start_minute_utc + duration_minutes <= 1440"
      - name: expected_attendance
        type: integer
        source: input
        description: "Planned headcount; must not exceed MeetingSpace.capacity."
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state."
        default: PLANNED
        constraints: "one of {PLANNED, CONFIRMED, HELD, CANCELLED}"
      - name: invitations_sent
        type: integer
        source: computed
        description: "Count of Invitations for this event in status SENT, ACCEPTED, DECLINED or EXPIRED."
        default: 0
      - name: invitations_accepted
        type: integer
        source: computed
        description: "Count of Invitations for this event in status ACCEPTED."
        default: 0
      - name: confirmed_headcount
        type: integer
        source: computed
        description: "Sum over ACCEPTED Invitations of (1 + guest_count)."
        default: 0
      - name: direct_cost_cents
        type: integer
        source: input
        description: "Planned direct cost of the event, in cents."
        constraints: "integer >= 0"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Indirect fee derived from direct_cost_cents by the pinned single-pass tier rule."
      - name: program_cost_total_cents
        type: integer
        source: computed
        description: "direct_cost_cents + admin_fee_cents."

  - name: Invitation
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> RemembranceEvent.id; the event being invited to."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the invited Participant."
      - name: guest_count
        type: integer
        source: input
        description: "Additional family guests accompanying the Participant."
        default: 0
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "Invitation lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED, VOID}"
      - name: rsvp_deadline
        type: string
        source: computed
        description: "RemembranceEvent.event_date minus 3 days, YYYY-MM-DD."
      - name: sent_at
        type: datetime
        source: system
        description: "Logical clock value of the send transition; null while DRAFT."
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: "Logical clock value of the respond transition; null until answered."
        default: null

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - name: funder_name
        type: string
        source: input
        description: "Funder name."
      - name: award_reference
        type: string
        source: input
        description: "Funder's award reference; unique across all GrantAwards."
      - name: awarded_cents
        type: integer
        source: input
        description: "Conserved money pool: awarded_cents == available_cents + committed_cents + spent_cents at all times."
        constraints: "integer >= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of provisional_cents over this award's FundingAllocations in status COMMITTED."
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: "Sum of settled_cents over this award's FundingAllocations in status SETTLED."
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "awarded_cents - committed_cents - spent_cents."
        default: 0
      - name: allowed_categories
        type: array
        source: input
        description: "Allocation categories this award may fund; each element is one of {GROUP_PROGRAM, REMEMBRANCE_EVENT, COUNSELING, VOLUNTEER_TRAINING}."
      - name: period_start
        type: string
        source: input
        description: "First date of the award period, YYYY-MM-DD, inclusive."
      - name: period_end
        type: string
        source: input
        description: "Last date of the award period, YYYY-MM-DD, inclusive."
      - name: indirect_rate_bps
        type: integer
        source: input
        description: "Funder's indirect-cost rate in basis points, applied per grant-report line."
        default: 1200
        constraints: "integer 0..10000"
      - name: status
        type: enum
        source: system
        description: "Award state."
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - name: grant_award_id
        type: string
        source: input
        description: "FK -> GrantAward.id; the award the money is drawn from."
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the funded cohort. Non-null exactly when category == GROUP_PROGRAM."
        default: null
      - name: event_id
        type: string
        source: input
        description: "FK -> RemembranceEvent.id; the funded event. Non-null exactly when category == REMEMBRANCE_EVENT."
        default: null
      - name: category
        type: enum
        source: input
        description: "Cost category; must be a member of GrantAward.allowed_categories."
        constraints: "one of {GROUP_PROGRAM, REMEMBRANCE_EVENT, COUNSELING, VOLUNTEER_TRAINING}"
      - name: provisional_cents
        type: integer
        source: computed
        description: "Forward-looking commitment computed at creation; never recomputed afterwards."
      - name: settled_cents
        type: integer
        source: computed
        description: "Chronological actual computed at settlement; null while COMMITTED or RELEASED."
        default: null
      - name: basis
        type: enum
        source: computed
        description: "Which input set produced the currently authoritative amount."
        default: PROJECTED_ENROLLMENT
        constraints: "one of {PROJECTED_ENROLLMENT, EVENT_PLAN, ACTUAL_ATTENDANCE, CONFIRMED_HEADCOUNT}"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle state."
        default: COMMITTED
        constraints: "one of {COMMITTED, SETTLED, RELEASED}"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical clock value of the settle transition; null otherwise."
        default: null

  - name: GrantReport
    parent: null
    common_fields: true
    fields:
      - name: grant_award_id
        type: string
        source: input
        description: "FK -> GrantAward.id; the award being reported on."
      - name: period_start
        type: string
        source: input
        description: "First date of the reporting window, YYYY-MM-DD, inclusive."
      - name: period_end
        type: string
        source: input
        description: "Last date of the reporting window, YYYY-MM-DD, inclusive."
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED, ACCEPTED}"
      - name: line_count
        type: integer
        source: computed
        description: "Number of FundingAllocation lines that entered the totals."
        default: 0
      - name: direct_total_cents
        type: integer
        source: computed
        description: "Sum of per-line reportable amounts."
        default: 0
      - name: indirect_total_cents
        type: integer
        source: computed
        description: "Sum of per-line indirect amounts, each rounded before summation."
        default: 0
      - name: reported_total_cents
        type: integer
        source: computed
        description: "direct_total_cents + indirect_total_cents."
        default: 0
      - name: participants_served
        type: integer
        source: computed
        description: "Distinct Participants with a CONFIRMED, ATTENDING or COMPLETED Enrollment on a cohort funded by an included line."
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramDirector who last submitted the report; null while never submitted."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock value of the last submit transition; null while never submitted."
        default: null
      - name: return_reason
        type: string
        source: input
        description: "Free text supplied by the GrantOfficer on return; null unless the report has been returned."
        default: null
      - name: revision_index
        type: integer
        source: system
        description: "Number of times this report has been returned."
        default: 0

  - name: AnniversaryOutreach
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: system
        description: "FK -> Participant.id; the Participant this touchpoint belongs to."
      - name: occasion
        type: enum
        source: system
        description: "Which milestone this touchpoint marks."
        constraints: "one of {ONE_MONTH, THREE_MONTH, SIX_MONTH, FIRST_ANNIVERSARY}"
      - name: due_on
        type: string
        source: computed
        description: "Participant.date_of_death plus the occasion's day offset, YYYY-MM-DD."
      - name: status
        type: enum
        source: system
        description: "Touchpoint lifecycle state."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DUE, SENT, ACKNOWLEDGED, NO_RESPONSE, CANCELLED}"
      - name: channel
        type: enum
        source: computed
        description: "Contact channel derived from the Participant's risk_tier at the last cadence recompute: HIGH -> PHONE, otherwise EMAIL."
        default: EMAIL
        constraints: "one of {EMAIL, PHONE}"
      - name: escalated
        type: boolean
        source: computed
        description: "True once a risk_tier escalation has re-channelled this touchpoint to PHONE."
        default: false
      - name: sent_at
        type: datetime
        source: system
        description: "Logical clock value of the send transition; null before."
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical clock value of the acknowledge transition; null before."
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DECLINED]
    shape: branching
    transitions:
      - from: RECEIVED
        to: SCREENED
        trigger: "POST /bereavement/referrals/{id}/screen"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
          - "Referral.date_of_death <= logical clock date"
        side_effects:
          - "Sets Referral.days_since_death to the whole-day difference between date_of_death and the logical clock date"
          - "Sets Referral.screening_band per calculations.referral_screening_band"
          - "Stores the supplied eligibility_note on the Referral"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /bereavement/referrals/{id}/decline"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status IN {RECEIVED, SCREENED}"
        side_effects:
          - "Sets Referral.decline_reason to the supplied value"
      - from: SCREENED
        to: DECLINED
        trigger: "POST /bereavement/referrals/{id}/decline"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status IN {RECEIVED, SCREENED}"
        side_effects:
          - "Sets Referral.decline_reason to the supplied value"
      - from: SCREENED
        to: ACCEPTED
        trigger: "POST /bereavement/referrals/{id}/accept"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == SCREENED"
        side_effects:
          - "Creates a Participant with service_status INTAKE and outreach_status SCHEDULED, copying contact_name, loss_type, relationship_to_deceased and date_of_death from the Referral"
          - "Sets Participant.anniversary_month_day to the MM-DD slice of date_of_death"
          - "Sets Participant.outreach_cadence_days to 90 (risk_tier LOW)"
          - "Creates exactly four AnniversaryOutreach rows per calculations.outreach_cadence_plan, each SCHEDULED with channel EMAIL"
          - "Sets Referral.participant_id to the new Participant.id"

  - entity: Participant
    initial_state: INTAKE
    terminal_states: [WITHDRAWN]
    shape: parallel
    note: |
      Two independent dimensions on one row. `service_status` is the clinical
      dimension; `outreach_status` is the follow-up dimension. They advance under
      different triggers and neither one gates the other, except that the WITHDRAWN
      terminal on service_status forces outreach_status to CLOSED.
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /bereavement/participants/{id}/assessments with kind == NEEDS"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status == INTAKE"
        side_effects:
          - "Recomputes Participant.composite_need_index and Participant.risk_tier per calculations.composite_need_index"
          - "Recomputes Participant.outreach_cadence_days from the new risk_tier (LOW 90, MODERATE 60, HIGH 30)"
          - "When the new risk_tier == HIGH, sets channel PHONE and escalated true on every AnniversaryOutreach for this Participant in status SCHEDULED or DUE"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /bereavement/participants/{id}/assessments with kind == NEEDS"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status IN {ASSESSED, ACTIVE, MAINTENANCE}"
        side_effects:
          - "Recomputes Participant.composite_need_index, risk_tier and outreach_cadence_days"
          - "When the new risk_tier == HIGH, sets channel PHONE and escalated true on every AnniversaryOutreach for this Participant in status SCHEDULED or DUE"
        note: "Self-loop: repeat NEEDS assessments re-tier the Participant without moving service_status."
      - from: ASSESSED
        to: ACTIVE
        trigger: "POST /bereavement/enrollments (first Enrollment reaching HELD) or POST /bereavement/counseling-referrals"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status == ASSESSED"
        side_effects:
          - "No further field changes on the Participant beyond service_status and updated_at"
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "system: an Enrollment for this Participant reaches COMPLETED via POST /bereavement/cohorts/{id}/complete"
        actor: system
        preconditions:
          - "Participant.service_status == ACTIVE"
        side_effects:
          - "Adds the completed Enrollment.sessions_attended to Participant.sessions_attended_total"
      - from: MAINTENANCE
        to: DISCHARGED
        trigger: "POST /bereavement/participants/{id}/assessments with kind == EXIT"
        actor: Counselor
        preconditions:
          - "Participant.service_status == MAINTENANCE"
        side_effects:
          - "Sets Participant.latest_score to the EXIT Assessment.normalized_score"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /bereavement/participants/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status NOT IN {WITHDRAWN, DISCHARGED}"
        side_effects:
          - "Sets Participant.outreach_status to CLOSED"
          - "CASCADE step 1 -> 2: every Enrollment for this Participant in status HELD, CONFIRMED or ATTENDING moves to WITHDRAWN with withdraw_reason PARTICIPANT_REQUEST"
          - "Cancels every CounselingReferral for this Participant in status WAITLISTED or ASSIGNED with close_reason PARTICIPANT_WITHDRAWN, releasing the assigned Counselor's active_caseload and committed_minutes"
          - "Ends every CompanionMatch for this Participant in status PROPOSED or ACTIVE (PROPOSED -> DECLINED, ACTIVE -> ENDED with end_reason PARTICIPANT_WITHDRAWN)"
          - "Cancels every AnniversaryOutreach for this Participant in status SCHEDULED, DUE or SENT"
      - from: ASSESSED
        to: WITHDRAWN
        trigger: "POST /bereavement/participants/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status NOT IN {WITHDRAWN, DISCHARGED}"
        side_effects:
          - "Same side-effect set as the INTAKE -> WITHDRAWN transition"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /bereavement/participants/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status NOT IN {WITHDRAWN, DISCHARGED}"
        side_effects:
          - "Same side-effect set as the INTAKE -> WITHDRAWN transition; this is the entry point of cascade participant_withdraw_chain"
      - from: MAINTENANCE
        to: WITHDRAWN
        trigger: "POST /bereavement/participants/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.service_status NOT IN {WITHDRAWN, DISCHARGED}"
        side_effects:
          - "Same side-effect set as the INTAKE -> WITHDRAWN transition"
      - from: "outreach_status: SCHEDULED"
        to: "outreach_status: ON_HOLD"
        trigger: "POST /bereavement/participants/{id}/outreach-hold with hold == true"
        actor: Participant
        preconditions:
          - "Participant.outreach_status == SCHEDULED"
          - "Participant.service_status != WITHDRAWN"
        side_effects:
          - "Every AnniversaryOutreach for this Participant in status SCHEDULED or DUE is left untouched but the ops run skips them while outreach_status == ON_HOLD"
      - from: "outreach_status: ON_HOLD"
        to: "outreach_status: SCHEDULED"
        trigger: "POST /bereavement/participants/{id}/outreach-hold with hold == false"
        actor: Participant
        preconditions:
          - "Participant.outreach_status == ON_HOLD"
        side_effects:
          - "Ops runs resume advancing this Participant's AnniversaryOutreach rows"
      - from: "outreach_status: SCHEDULED"
        to: "outreach_status: LAPSED"
        trigger: "system: POST /bereavement/_ops/cadence-run marks one of this Participant's SENT touchpoints NO_RESPONSE"
        actor: system
        preconditions:
          - "Participant.outreach_status == SCHEDULED"
        side_effects:
          - "The touchpoint's status becomes NO_RESPONSE"
      - from: "outreach_status: LAPSED"
        to: "outreach_status: SCHEDULED"
        trigger: "POST /bereavement/anniversary-outreaches/{id}/acknowledge"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.outreach_status == LAPSED"
        side_effects:
          - "The acknowledged touchpoint's status becomes ACKNOWLEDGED"
        note: "Closes the outreach cycle SCHEDULED -> LAPSED -> SCHEDULED."

  - entity: Cohort
    initial_state: FORMING
    terminal_states: [COMPLETED, CANCELLED]
    shape: cyclic
    transitions:
      - from: FORMING
        to: OPEN_ENROLLMENT
        trigger: "POST /bereavement/cohorts/{id}/open-enrollment"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, UNDERSUBSCRIBED}"
          - "MeetingSpace.status == AVAILABLE for Cohort.meeting_space_id"
        side_effects:
          - "Increments Cohort.version by 1"
      - from: UNDERSUBSCRIBED
        to: OPEN_ENROLLMENT
        trigger: "POST /bereavement/cohorts/{id}/open-enrollment"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, UNDERSUBSCRIBED}"
          - "MeetingSpace.status == AVAILABLE for Cohort.meeting_space_id"
        side_effects:
          - "Increments Cohort.version by 1"
        note: "Cycle: a cohort that failed to reach min_viable_enrollment returns to enrolment."
      - from: OPEN_ENROLLMENT
        to: RUNNING
        trigger: "POST /bereavement/cohorts/{id}/launch"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status == OPEN_ENROLLMENT"
          - "Cohort.seats_filled >= Cohort.min_viable_enrollment"
        side_effects:
          - "Every Enrollment on this Cohort in status CONFIRMED moves to ATTENDING"
          - "Every Enrollment on this Cohort in status HELD moves to EXPIRED, returning its seat to seats_open"
          - "Increments Cohort.version by 1"
      - from: OPEN_ENROLLMENT
        to: UNDERSUBSCRIBED
        trigger: "POST /bereavement/cohorts/{id}/launch"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status == OPEN_ENROLLMENT"
          - "Cohort.seats_filled < Cohort.min_viable_enrollment"
        side_effects:
          - "Enrollments are left in their current statuses"
          - "Increments Cohort.version by 1"
        note: "Branch: launch forks on the seats_filled >= min_viable_enrollment boundary and the two branches carry different side-effect sets."
      - from: UNDERSUBSCRIBED
        to: CANCELLED
        trigger: "POST /bereavement/cohorts/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, SUSPENDED}"
        side_effects:
          - "Every Enrollment on this Cohort in status HELD, CONFIRMED or ATTENDING moves to WITHDRAWN with withdraw_reason PROGRAM_CANCELLED, returning its seat to seats_open"
          - "Every FundingAllocation with cohort_id == this Cohort in status COMMITTED moves to RELEASED"
          - "Increments Cohort.version by 1"
      - from: FORMING
        to: CANCELLED
        trigger: "POST /bereavement/cohorts/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, SUSPENDED}"
        side_effects:
          - "Same side-effect set as the UNDERSUBSCRIBED -> CANCELLED transition"
      - from: OPEN_ENROLLMENT
        to: CANCELLED
        trigger: "POST /bereavement/cohorts/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, SUSPENDED}"
        side_effects:
          - "Same side-effect set as the UNDERSUBSCRIBED -> CANCELLED transition"
      - from: RUNNING
        to: SUSPENDED
        trigger: "POST /bereavement/cohorts/{id}/suspend, or system when a withdrawal drops seats_filled below min_viable_enrollment"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status == RUNNING"
        side_effects:
          - "CASCADE step 3 -> 4: every FundingAllocation with cohort_id == this Cohort in status COMMITTED moves to RELEASED"
          - "Increments Cohort.version by 1"
      - from: SUSPENDED
        to: RUNNING
        trigger: "POST /bereavement/cohorts/{id}/resume"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status == SUSPENDED"
          - "Cohort.seats_filled >= Cohort.min_viable_enrollment"
        side_effects:
          - "Increments Cohort.version by 1"
        note: "Cycle: RUNNING -> SUSPENDED -> RUNNING."
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /bereavement/cohorts/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status IN {FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, SUSPENDED}"
        side_effects:
          - "Same side-effect set as the UNDERSUBSCRIBED -> CANCELLED transition"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /bereavement/cohorts/{id}/complete"
        actor: ProgramDirector
        preconditions:
          - "Cohort.status == RUNNING"
        side_effects:
          - "CASCADE step 1 -> 2: every Enrollment on this Cohort in status CONFIRMED or ATTENDING moves to COMPLETED and its attendance_ratio is recomputed"
          - "CASCADE step 2 -> 3: each Enrollment reaching COMPLETED adds its sessions_attended to Participant.sessions_attended_total and moves that Participant's service_status ACTIVE -> MAINTENANCE"
          - "Every FundingAllocation with cohort_id == this Cohort in status COMMITTED moves to SETTLED with settled_cents from calculations.funding_allocation_amount variant settled_actual"
          - "Increments Cohort.version by 1"

  - entity: Enrollment
    initial_state: HELD
    terminal_states: [COMPLETED, WITHDRAWN, EXPIRED]
    shape: branching
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bereavement/enrollments/{id}/confirm"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment.status == HELD"
          - "Cohort.status == OPEN_ENROLLMENT for Enrollment.cohort_id"
          - "logical clock <= Enrollment.held_until"
        side_effects:
          - "Cohort.seats_held decreases by 1 and Cohort.seats_filled increases by 1; seats_open is unchanged"
          - "Increments Cohort.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "system: POST /bereavement/_ops/cadence-run when logical clock > Enrollment.held_until"
        actor: system
        preconditions:
          - "Enrollment.status == HELD"
          - "logical clock > Enrollment.held_until"
        side_effects:
          - "Cohort.seats_held decreases by 1 and Cohort.seats_open increases by 1"
          - "Increments Cohort.version by 1"
      - from: HELD
        to: WITHDRAWN
        trigger: "POST /bereavement/enrollments/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment.status IN {HELD, CONFIRMED, ATTENDING}"
        side_effects:
          - "Cohort.seats_held decreases by 1 and Cohort.seats_open increases by 1"
          - "Increments Cohort.version by 1"
      - from: CONFIRMED
        to: ATTENDING
        trigger: "system: POST /bereavement/cohorts/{id}/launch on the RUNNING branch"
        actor: system
        preconditions:
          - "Enrollment.status == CONFIRMED"
          - "Cohort.status transitions OPEN_ENROLLMENT -> RUNNING"
        side_effects:
          - "No seat movement: a CONFIRMED and an ATTENDING seat both count toward Cohort.seats_filled"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /bereavement/enrollments/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment.status IN {HELD, CONFIRMED, ATTENDING}"
        side_effects:
          - "Cohort.seats_filled decreases by 1 and Cohort.seats_open increases by 1"
          - "When Cohort.status == RUNNING and the new seats_filled < Cohort.min_viable_enrollment, the Cohort moves RUNNING -> SUSPENDED"
          - "Increments Cohort.version by 1"
      - from: ATTENDING
        to: WITHDRAWN
        trigger: "POST /bereavement/enrollments/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment.status IN {HELD, CONFIRMED, ATTENDING}"
        side_effects:
          - "CASCADE step 2 -> 3: Cohort.seats_filled decreases by 1 and Cohort.seats_open increases by 1; when Cohort.status == RUNNING and the new seats_filled < Cohort.min_viable_enrollment the Cohort moves RUNNING -> SUSPENDED"
          - "Increments Cohort.version by 1"
      - from: ATTENDING
        to: COMPLETED
        trigger: "system: POST /bereavement/cohorts/{id}/complete"
        actor: system
        preconditions:
          - "Enrollment.status IN {CONFIRMED, ATTENDING}"
          - "Cohort.status transitions RUNNING -> COMPLETED"
        side_effects:
          - "Recomputes Enrollment.attendance_ratio"
          - "Adds Enrollment.sessions_attended to Participant.sessions_attended_total and moves Participant.service_status ACTIVE -> MAINTENANCE"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: POST /bereavement/cohorts/{id}/complete"
        actor: system
        preconditions:
          - "Enrollment.status IN {CONFIRMED, ATTENDING}"
          - "Cohort.status transitions RUNNING -> COMPLETED"
        side_effects:
          - "Same side-effect set as the ATTENDING -> COMPLETED transition"

  - entity: Counselor
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    shape: branching_with_revert
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /bereavement/counselors/{id}/deactivate"
        actor: ProgramDirector
        preconditions:
          - "Counselor.status == ACTIVE"
        side_effects:
          - "Sets Counselor.active_caseload to 0 and Counselor.committed_minutes to 0"
          - "CASCADE step 1 -> 2: every CounselingReferral with counselor_id == this Counselor in status ASSIGNED returns to WAITLISTED with counselor_id cleared and waitlisted_at reset to the logical clock"
          - "Increments Counselor.version by 1"

  - entity: CounselingReferral
    initial_state: WAITLISTED
    terminal_states: [CLOSED, CANCELLED]
    shape: cyclic
    transitions:
      - from: WAITLISTED
        to: ASSIGNED
        trigger: "POST /bereavement/counseling-referrals/{id}/assign"
        actor: IntakeCoordinator
        preconditions:
          - "CounselingReferral.status == WAITLISTED"
          - "Counselor.status == ACTIVE for the supplied counselor_id"
          - "CounselingReferral.required_specialty IN Counselor.specialties"
          - "Counselor.active_caseload + 1 <= Counselor.caseload_cap"
          - "Counselor.committed_minutes + CounselingReferral.requested_minutes_per_week <= Counselor.weekly_capacity_minutes"
        side_effects:
          - "Sets counselor_id and assigned_at"
          - "Increments Counselor.active_caseload by 1 and Counselor.committed_minutes by requested_minutes_per_week"
          - "Increments Counselor.version by 1"
      - from: ASSIGNED
        to: WAITLISTED
        trigger: "system: POST /bereavement/counselors/{id}/deactivate"
        actor: system
        preconditions:
          - "CounselingReferral.status == ASSIGNED"
          - "The assigned Counselor transitions to INACTIVE"
        side_effects:
          - "Clears counselor_id and assigned_at; resets waitlisted_at to the logical clock"
          - "CASCADE step 2 -> 3: increments Participant.waitlist_reentry_count by 1 and recomputes CounselingReferral.queue_priority"
          - "CASCADE step 3 -> 4: when the new Participant.waitlist_reentry_count >= 2, the Participant's risk_tier is escalated exactly one level (LOW -> MODERATE, MODERATE -> HIGH, HIGH unchanged)"
          - "CASCADE step 4 -> 5: the escalated risk_tier recomputes Participant.outreach_cadence_days (LOW 90, MODERATE 60, HIGH 30) and, when the new tier is HIGH, sets channel PHONE and escalated true on every AnniversaryOutreach for that Participant in status SCHEDULED or DUE"
        note: "Cycle: WAITLISTED -> ASSIGNED -> WAITLISTED. This is the head of cascade counselor_deactivation_chain."
      - from: ASSIGNED
        to: CLOSED
        trigger: "POST /bereavement/counseling-referrals/{id}/close"
        actor: Counselor
        preconditions:
          - "CounselingReferral.status == ASSIGNED"
        side_effects:
          - "Sets close_reason"
          - "Decrements Counselor.active_caseload by 1 and Counselor.committed_minutes by requested_minutes_per_week"
          - "Increments Counselor.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system: POST /bereavement/participants/{id}/withdraw"
        actor: system
        preconditions:
          - "CounselingReferral.status == WAITLISTED"
          - "The Participant transitions to service_status WITHDRAWN"
        side_effects:
          - "Sets close_reason to PARTICIPANT_WITHDRAWN"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system: POST /bereavement/participants/{id}/withdraw"
        actor: system
        preconditions:
          - "CounselingReferral.status == ASSIGNED"
          - "The Participant transitions to service_status WITHDRAWN"
        side_effects:
          - "Sets close_reason to PARTICIPANT_WITHDRAWN"
          - "Decrements the assigned Counselor's active_caseload by 1 and committed_minutes by requested_minutes_per_week"
          - "Increments Counselor.version by 1"

  - entity: VolunteerCompanion
    initial_state: APPLIED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: APPLIED
        to: IN_TRAINING
        trigger: "POST /bereavement/volunteer-companions/{id}/training-records"
        actor: VolunteerCompanion
        preconditions:
          - "VolunteerCompanion.status IN {APPLIED, IN_TRAINING, LAPSED}"
        side_effects:
          - "Adds hours to training_hours and appends module_code to modules_completed"
      - from: IN_TRAINING
        to: IN_TRAINING
        trigger: "POST /bereavement/volunteer-companions/{id}/training-records"
        actor: VolunteerCompanion
        preconditions:
          - "VolunteerCompanion.status IN {APPLIED, IN_TRAINING, LAPSED}"
          - "training_hours + hours < 16 OR modules_completed does not yet contain both CORE_LISTENING and CORE_SAFETY"
        side_effects:
          - "Adds hours to training_hours and appends module_code to modules_completed"
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "POST /bereavement/volunteer-companions/{id}/training-records"
        actor: VolunteerCompanion
        preconditions:
          - "VolunteerCompanion.status IN {APPLIED, IN_TRAINING, LAPSED}"
          - "training_hours after adding hours >= 16"
          - "modules_completed after appending module_code contains both CORE_LISTENING and CORE_SAFETY"
        side_effects:
          - "Sets certified_on to the logical clock date and certification_expires_on to certified_on + 365 days"
      - from: CERTIFIED
        to: LAPSED
        trigger: "system: POST /bereavement/_ops/cadence-run when the logical clock date > certification_expires_on"
        actor: system
        preconditions:
          - "VolunteerCompanion.status == CERTIFIED"
          - "logical clock date > certification_expires_on"
        side_effects:
          - "CASCADE step 1 -> 2: every CompanionMatch for this volunteer in status ACTIVE moves to ENDED with end_reason COMPANION_LAPSED"
      - from: LAPSED
        to: IN_TRAINING
        trigger: "POST /bereavement/volunteer-companions/{id}/training-records"
        actor: VolunteerCompanion
        preconditions:
          - "VolunteerCompanion.status IN {APPLIED, IN_TRAINING, LAPSED}"
        side_effects:
          - "Adds hours to training_hours and appends module_code to modules_completed"
        note: "Cycle: CERTIFIED -> LAPSED -> IN_TRAINING -> CERTIFIED (re-certification loop)."
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /bereavement/volunteer-companions/{id}/training-records"
        actor: VolunteerCompanion
        preconditions:
          - "VolunteerCompanion.status == LAPSED"
          - "training_hours after adding hours >= 16"
          - "modules_completed after appending module_code contains both CORE_LISTENING and CORE_SAFETY"
        side_effects:
          - "Sets certified_on to the logical clock date and certification_expires_on to certified_on + 365 days"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /bereavement/volunteer-companions/{id}/suspend"
        actor: ProgramDirector
        preconditions:
          - "VolunteerCompanion.status == CERTIFIED"
        side_effects:
          - "Every CompanionMatch for this volunteer in status PROPOSED moves to DECLINED"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /bereavement/volunteer-companions/{id}/reinstate"
        actor: ProgramDirector
        preconditions:
          - "VolunteerCompanion.status == SUSPENDED"
          - "logical clock date <= certification_expires_on"
        side_effects:
          - "No further field changes beyond status and updated_at"

  - entity: CompanionMatch
    initial_state: PROPOSED
    terminal_states: [DECLINED, ENDED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /bereavement/companion-matches/{id}/respond with decision == ACCEPT"
        actor: VolunteerCompanion
        preconditions:
          - "CompanionMatch.status == PROPOSED"
          - "VolunteerCompanion.status == CERTIFIED"
          - "VolunteerCompanion.active_match_count + 1 <= VolunteerCompanion.max_concurrent_matches"
        side_effects:
          - "Sets started_on to the logical clock date"
          - "Increments VolunteerCompanion.active_match_count by 1"
          - "Sets Participant.has_active_companion to true"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /bereavement/companion-matches/{id}/respond with decision == DECLINE"
        actor: VolunteerCompanion
        preconditions:
          - "CompanionMatch.status == PROPOSED"
        side_effects:
          - "No counter changes"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /bereavement/companion-matches/{id}/end, or system on volunteer lapse / participant withdrawal"
        actor: VolunteerCompanion
        preconditions:
          - "CompanionMatch.status == ACTIVE"
        side_effects:
          - "Sets ended_on to the logical clock date and end_reason"
          - "CASCADE step 2 -> 3: decrements VolunteerCompanion.active_match_count by 1 and recomputes Participant.has_active_companion"

  - entity: RemembranceEvent
    initial_state: PLANNED
    terminal_states: [HELD, CANCELLED]
    shape: branching
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /bereavement/remembrance-events/{id}/confirm"
        actor: ProgramDirector
        preconditions:
          - "RemembranceEvent.status == PLANNED"
          - "MeetingSpace.status == AVAILABLE for RemembranceEvent.meeting_space_id"
        side_effects:
          - "Increments RemembranceEvent.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /bereavement/remembrance-events/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "RemembranceEvent.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "Every Invitation for this event in status DRAFT or SENT moves to VOID"
          - "Every FundingAllocation with event_id == this event in status COMMITTED moves to RELEASED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bereavement/remembrance-events/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "RemembranceEvent.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "Same side-effect set as the PLANNED -> CANCELLED transition"
      - from: CONFIRMED
        to: HELD
        trigger: "POST /bereavement/remembrance-events/{id}/mark-held"
        actor: ProgramDirector
        preconditions:
          - "RemembranceEvent.status == CONFIRMED"
          - "logical clock date >= RemembranceEvent.event_date"
        side_effects:
          - "Every Invitation for this event in status DRAFT or SENT moves to EXPIRED"
          - "Every FundingAllocation with event_id == this event in status COMMITTED moves to SETTLED with settled_cents from calculations.funding_allocation_amount variant settled_actual"

  - entity: Invitation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, VOID]
    shape: branching
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /bereavement/invitations/{id}/send"
        actor: IntakeCoordinator
        preconditions:
          - "Invitation.status == DRAFT"
          - "RemembranceEvent.status == CONFIRMED for Invitation.event_id"
          - "logical clock date <= Invitation.rsvp_deadline"
        side_effects:
          - "Sets sent_at and increments RemembranceEvent.invitations_sent by 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /bereavement/invitations/{id}/respond with response == ACCEPT"
        actor: Participant
        preconditions:
          - "Invitation.status == SENT"
          - "logical clock date <= Invitation.rsvp_deadline"
        side_effects:
          - "Sets responded_at, increments RemembranceEvent.invitations_accepted by 1 and adds (1 + guest_count) to RemembranceEvent.confirmed_headcount"
      - from: SENT
        to: DECLINED
        trigger: "POST /bereavement/invitations/{id}/respond with response == DECLINE"
        actor: Participant
        preconditions:
          - "Invitation.status == SENT"
          - "logical clock date <= Invitation.rsvp_deadline"
        side_effects:
          - "Sets responded_at"
      - from: SENT
        to: EXPIRED
        trigger: "system: POST /bereavement/_ops/cadence-run when the logical clock date > Invitation.rsvp_deadline"
        actor: system
        preconditions:
          - "Invitation.status == SENT"
          - "logical clock date > Invitation.rsvp_deadline"
        side_effects:
          - "No headcount change"
      - from: DRAFT
        to: VOID
        trigger: "system: POST /bereavement/remembrance-events/{id}/cancel"
        actor: system
        preconditions:
          - "Invitation.status IN {DRAFT, SENT}"
          - "The parent RemembranceEvent transitions to CANCELLED"
        side_effects:
          - "No headcount change"
      - from: SENT
        to: VOID
        trigger: "system: POST /bereavement/remembrance-events/{id}/cancel"
        actor: system
        preconditions:
          - "Invitation.status IN {DRAFT, SENT}"
          - "The parent RemembranceEvent transitions to CANCELLED"
        side_effects:
          - "No headcount change"

  - entity: FundingAllocation
    initial_state: COMMITTED
    terminal_states: [SETTLED, RELEASED]
    shape: branching
    transitions:
      - from: COMMITTED
        to: SETTLED
        trigger: "system: POST /bereavement/cohorts/{id}/complete or POST /bereavement/remembrance-events/{id}/mark-held"
        actor: system
        preconditions:
          - "FundingAllocation.status == COMMITTED"
          - "The funded subject reaches COMPLETED (Cohort) or HELD (RemembranceEvent)"
        side_effects:
          - "Sets settled_cents per calculations.funding_allocation_amount variant settled_actual, settled_at, and basis to ACTUAL_ATTENDANCE (Cohort) or CONFIRMED_HEADCOUNT (RemembranceEvent)"
          - "Decrements GrantAward.committed_cents by provisional_cents and increments GrantAward.spent_cents by settled_cents; recomputes GrantAward.available_cents"
          - "Increments GrantAward.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /bereavement/funding-allocations/{id}/release, or system on cohort suspend/cancel or event cancel"
        actor: ProgramDirector
        preconditions:
          - "FundingAllocation.status == COMMITTED"
        side_effects:
          - "CASCADE step 4 -> 5: decrements GrantAward.committed_cents by provisional_cents and recomputes GrantAward.available_cents; settled_cents stays null"
          - "Increments GrantAward.version by 1"

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bereavement/grant-reports/{id}/submit"
        actor: ProgramDirector
        preconditions:
          - "GrantReport.status == DRAFT"
          - "GrantAward.status == ACTIVE for GrantReport.grant_award_id"
        side_effects:
          - "Recomputes line_count, direct_total_cents, indirect_total_cents, reported_total_cents and participants_served per calculations.grant_report_totals"
          - "Sets submitted_by_user_id to the acting X-User-ID and submitted_at to the logical clock"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /bereavement/grant-reports/{id}/return"
        actor: GrantOfficer
        preconditions:
          - "GrantReport.status == SUBMITTED"
        side_effects:
          - "Sets return_reason and increments revision_index by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /bereavement/grant-reports/{id}/revise"
        actor: ProgramDirector
        preconditions:
          - "GrantReport.status == RETURNED"
        side_effects:
          - "Clears submitted_by_user_id and submitted_at; recomputes all totals per calculations.grant_report_totals"
        note: "Cycle: DRAFT -> SUBMITTED -> RETURNED -> DRAFT (revision rounds)."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /bereavement/grant-reports/{id}/accept"
        actor: GrantOfficer
        preconditions:
          - "GrantReport.status == SUBMITTED"
          - "The acting X-User-ID differs from GrantReport.submitted_by_user_id"
        side_effects:
          - "No further field changes beyond status and updated_at"

  - entity: MeetingSpace
    initial_state: AVAILABLE
    terminal_states: []
    shape: branching_with_revert
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /bereavement/meeting-spaces/{id}/status with status == OUT_OF_SERVICE"
        actor: ProgramDirector
        preconditions:
          - "MeetingSpace.status == AVAILABLE"
        side_effects:
          - "Existing Cohorts and RemembranceEvents keep their occupation, but no Cohort may be opened for enrolment and no RemembranceEvent may be confirmed in this space until it is restored"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /bereavement/meeting-spaces/{id}/status with status == AVAILABLE"
        actor: ProgramDirector
        preconditions:
          - "MeetingSpace.status == OUT_OF_SERVICE"
        side_effects:
          - "No further field changes beyond status and updated_at"

  - entity: GrantAward
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /bereavement/grant-awards/{id}/close"
        actor: ProgramDirector
        preconditions:
          - "GrantAward.status == ACTIVE"
          - "GrantAward.committed_cents == 0"
        side_effects:
          - "Further FundingAllocations and GrantReports against this award are refused with ERR_GRANT_CLOSED"

  - entity: AnniversaryOutreach
    initial_state: SCHEDULED
    terminal_states: [ACKNOWLEDGED, NO_RESPONSE, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system: POST /bereavement/_ops/cadence-run when the logical clock date >= due_on"
        actor: system
        preconditions:
          - "AnniversaryOutreach.status == SCHEDULED"
          - "Participant.outreach_status == SCHEDULED"
          - "logical clock date >= AnniversaryOutreach.due_on"
        side_effects:
          - "No participant-level change"
      - from: DUE
        to: SENT
        trigger: "POST /bereavement/anniversary-outreaches/{id}/send"
        actor: IntakeCoordinator
        preconditions:
          - "AnniversaryOutreach.status == DUE"
          - "Participant.service_status != WITHDRAWN"
        side_effects:
          - "Sets sent_at to the logical clock"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /bereavement/anniversary-outreaches/{id}/acknowledge"
        actor: IntakeCoordinator
        preconditions:
          - "AnniversaryOutreach.status IN {SENT, NO_RESPONSE}"
        side_effects:
          - "Sets acknowledged_at and moves Participant.outreach_status LAPSED -> SCHEDULED when it was LAPSED"
      - from: NO_RESPONSE
        to: ACKNOWLEDGED
        trigger: "POST /bereavement/anniversary-outreaches/{id}/acknowledge"
        actor: IntakeCoordinator
        preconditions:
          - "AnniversaryOutreach.status IN {SENT, NO_RESPONSE}"
        side_effects:
          - "Sets acknowledged_at and moves Participant.outreach_status LAPSED -> SCHEDULED when it was LAPSED"
      - from: SENT
        to: NO_RESPONSE
        trigger: "system: POST /bereavement/_ops/cadence-run when the logical clock >= sent_at + 21 days"
        actor: system
        preconditions:
          - "AnniversaryOutreach.status == SENT"
          - "logical clock >= sent_at + 21 days"
        side_effects:
          - "Moves Participant.outreach_status SCHEDULED -> LAPSED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: POST /bereavement/participants/{id}/withdraw"
        actor: system
        preconditions:
          - "AnniversaryOutreach.status IN {SCHEDULED, DUE, SENT}"
          - "The Participant transitions to service_status WITHDRAWN"
        side_effects:
          - "No further changes"
      - from: DUE
        to: CANCELLED
        trigger: "system: POST /bereavement/participants/{id}/withdraw"
        actor: system
        preconditions:
          - "AnniversaryOutreach.status IN {SCHEDULED, DUE, SENT}"
          - "The Participant transitions to service_status WITHDRAWN"
        side_effects:
          - "No further changes"
      - from: SENT
        to: CANCELLED
        trigger: "system: POST /bereavement/participants/{id}/withdraw"
        actor: system
        preconditions:
          - "AnniversaryOutreach.status IN {SCHEDULED, DUE, SENT}"
          - "The Participant transitions to service_status WITHDRAWN"
        side_effects:
          - "No further changes"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-cohort
    parent_entity: Cohort
    write_endpoint: "POST /bereavement/enrollments"
    occ_field: "expected_cohort_version"
    description: |
      Creating an Enrollment against a Cohort whose version has advanced since the
      client last read it is rejected. The seat pool the client based its decision
      on (seats_open, seats_held, seats_filled) is stale, so the hold is refused
      rather than silently drawn from a pool the client never saw.
    error_id: ERR_STALE_COHORT_VERSION
    http_status: 412

  - rule_id: counseling-assign-stale-counselor
    parent_entity: Counselor
    write_endpoint: "POST /bereavement/counseling-referrals/{id}/assign"
    occ_field: "expected_counselor_version"
    description: |
      Assigning a CounselingReferral to a Counselor whose version has advanced since
      the client last read it is rejected. The caseload and weekly-minute figures the
      client used to pick this counselor are stale.
    error_id: ERR_STALE_COUNSELOR_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-grant
    parent_entity: GrantAward
    write_endpoint: "POST /bereavement/funding-allocations"
    occ_field: "expected_grant_award_version"
    description: |
      Creating a FundingAllocation against a GrantAward whose version has advanced
      since the client last read it is rejected. The available_cents figure the client
      based the commitment on is stale.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: referral_screening_band
    trigger: "POST /bereavement/referrals/{id}/screen (Referral RECEIVED -> SCREENED)"
    algorithm: threshold
    formula: |
      days_since_death = (logical_clock_date - date_of_death).days      # whole days, >= 0
      if days_since_death <= URGENT_MAX_DAYS:        screening_band = URGENT
      elif days_since_death <= PRIORITY_MAX_DAYS:    screening_band = PRIORITY
      else:                                          screening_band = ROUTINE
    input_set: "The Referral being screened. date_of_death is compared against the logical clock date, never the wall clock."
    constants:
      URGENT_MAX_DAYS: 30
      PRIORITY_MAX_DAYS: 180
    precision: "integer days; both thresholds are inclusive (<=)"

  - name: composite_need_index
    trigger: "POST /bereavement/participants/{id}/assessments with kind == NEEDS; writes Participant.composite_need_index and Participant.risk_tier"
    algorithm: weighted_scoring
    formula: |
      # step 1 - per-assessment normalisation (also stored on the Assessment row)
      raw_total        = grief_severity + isolation_index + functional_impairment
      normalized_score = round_half_up(raw_total / MAX_RAW * 100, 2)

      # step 2 - weighted composite over the SAME assessment
      weighted = W_GRIEF     * (grief_severity        / GRIEF_MAX)
               + W_ISOLATION * (isolation_index       / ISOLATION_MAX)
               + W_FUNCTION  * (functional_impairment / FUNCTION_MAX)
      composite = round_half_up(100 * weighted, 2)

      # step 3 - safety floor, applied AFTER rounding, never before
      if suicidality_flag is true:
          composite = max(composite, SUICIDALITY_FLOOR)

      participant.composite_need_index = composite

      # step 4 - tiering on inclusive lower bounds
      if composite >= RISK_HIGH_MIN:       risk_tier = HIGH
      elif composite >= RISK_MODERATE_MIN: risk_tier = MODERATE
      else:                                risk_tier = LOW

      # step 5 - cadence follows the tier
      outreach_cadence_days = {LOW: 90, MODERATE: 60, HIGH: 30}[risk_tier]
    input_set: |
      Exactly one Assessment: the NEEDS Assessment just created. Earlier NEEDS
      Assessments are NOT averaged in - the newest NEEDS row wins outright.
      BASELINE / MIDPOINT / EXIT rows never contribute to composite_need_index.
    constants:
      MAX_RAW: 80
      GRIEF_MAX: 40
      ISOLATION_MAX: 20
      FUNCTION_MAX: 20
      W_GRIEF: 0.5
      W_ISOLATION: 0.2
      W_FUNCTION: 0.3
      SUICIDALITY_FLOOR: 85.00
      RISK_HIGH_MIN: 70.00
      RISK_MODERATE_MIN: 40.00
    precision: "2 decimal places, round_half_up; the tier comparisons use >= (a composite of exactly 70.00 is HIGH)"

  - name: counseling_queue_priority
    trigger: "POST /bereavement/counseling-referrals (creation) and every ASSIGNED -> WAITLISTED re-entry; writes CounselingReferral.queue_priority"
    algorithm: weighted_scoring
    formula: |
      urgency_weight = URGENCY_WEIGHT[urgency]                                  # input 1
      need_component = min(NEED_CAP, participant.composite_need_index * NEED_FACTOR)   # input 2, capped
      wait_days      = floor((logical_clock - waitlisted_at).total_seconds() / 86400)
      wait_component = min(WAIT_CAP, wait_days * WAIT_POINTS_PER_DAY)           # input 3, capped
      reentry_bonus  = min(REENTRY_CAP, REENTRY_POINTS * participant.waitlist_reentry_count)  # input 4, capped
      queue_priority = round_half_up(urgency_weight + need_component
                                     + wait_component + reentry_bonus, 2)
    input_set: |
      The CounselingReferral itself plus its Participant's current
      composite_need_index and waitlist_reentry_count. Waitlist ordering, when the
      program lists the queue, is queue_priority DESC, then waitlisted_at ASC, then
      created_at ASC. Never id.
    constants:
      URGENCY_WEIGHT: { ROUTINE: 10, PRIORITY: 25, URGENT: 45 }
      NEED_FACTOR: 0.35
      NEED_CAP: 35.0
      WAIT_POINTS_PER_DAY: 0.5
      WAIT_CAP: 20.0
      REENTRY_POINTS: 5
      REENTRY_CAP: 10
    precision: "2 decimal places, round_half_up; rounding happens once, on the final sum"

  - name: program_cost_total
    trigger: "POST /bereavement/cohorts and POST /bereavement/remembrance-events; writes admin_fee_cents and program_cost_total_cents on the created row"
    algorithm: constraint_propagation
    formula: |
      # This formula LOOKS circular: the indirect tier is described in the funder's
      # handbook as a band on "total programme cost", but total programme cost
      # already contains the indirect fee. The scaffold PINS a single-pass
      # evaluation order so the value is well defined; no fixed-point iteration.
      #
      # step 1 - the tier is selected from direct_cost_cents ALONE.
      #          It is NOT selected from program_cost_total_cents.
      if   direct_cost_cents <  TIER1_MAX_CENTS: tier_rate_bps = TIER1_BPS
      elif direct_cost_cents <  TIER2_MAX_CENTS: tier_rate_bps = TIER2_BPS
      else:                                      tier_rate_bps = TIER3_BPS
      # step 2 - fee from the tier selected in step 1
      admin_fee_cents = round_half_up(direct_cost_cents * tier_rate_bps / 10000, 0)
      # step 3 - total from the fee computed in step 2
      program_cost_total_cents = direct_cost_cents + admin_fee_cents
    input_set: "Only the direct_cost_cents supplied on the create request. GrantAward.indirect_rate_bps plays no part here; it is used solely by grant_report_totals."
    constants:
      TIER1_MAX_CENTS: 250000
      TIER2_MAX_CENTS: 750000
      TIER1_BPS: 1200
      TIER2_BPS: 1000
      TIER3_BPS: 800
    precision: "integer cents, round_half_up at step 2 only; tier boundaries are exclusive upper / inclusive lower (direct_cost_cents == 250000 selects TIER2_BPS)"
    note: |
      Divergence the pinned order removes: direct_cost_cents = 240000 gives
      admin_fee_cents = 28800 and program_cost_total_cents = 268800 under the pinned
      order. Keying the tier off the total instead would land 268800 in the second
      band (1000 bps) and produce 26880 / 266880 - a different, wrong answer.

  - name: funding_allocation_amount
    trigger: "POST /bereavement/funding-allocations (provisional) and the COMMITTED -> SETTLED transition (settled)"
    algorithm: forward_looking
    formula: |
      # ---- variant provisional_projected (runs at allocation creation) ----
      if category == GROUP_PROGRAM:
          projected_participants = min(cohort.seats_total,
                                       cohort.seats_filled + cohort.seats_held)
          provisional_cents = round_half_up(
              cohort.program_cost_total_cents * projected_participants
              / cohort.seats_total, 0)
          basis = PROJECTED_ENROLLMENT
      elif category == REMEMBRANCE_EVENT:
          provisional_cents = event.program_cost_total_cents
          basis = EVENT_PLAN
      # ---- variant settled_actual (runs at settlement) ----
      if category == GROUP_PROGRAM:
          attended_units = sum(enrollment.sessions_attended
                               for enrollment in cohort's enrollments
                               where enrollment.status IN {COMPLETED, WITHDRAWN})
          settled_cents = round_half_up(
              cohort.program_cost_total_cents * attended_units
              / (cohort.seats_total * cohort.sessions_total), 0)
          basis = ACTUAL_ATTENDANCE
      elif category == REMEMBRANCE_EVENT:
          # expected_attendance is guaranteed >= 1 by the create-event validation,
          # so this ratio is always well defined.
          settled_cents = round_half_up(
              event.program_cost_total_cents
              * min(1, event.confirmed_headcount / event.expected_attendance), 0)
          basis = CONFIRMED_HEADCOUNT
    input_set: |
      provisional_projected reads the cohort seat counters AT ALLOCATION CREATION
      TIME (Enrollments in HELD, CONFIRMED and ATTENDING all count; EXPIRED and
      WITHDRAWN do not) and is frozen on the row forever.
      settled_actual reads Enrollments in status COMPLETED or WITHDRAWN ONLY, at
      settlement time; HELD, CONFIRMED, ATTENDING and EXPIRED rows contribute zero.
      The two input sets are disjoint in status, which is exactly why identical
      cohort data yields different money.
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_projected
        when: "FundingAllocation creation, while the cohort is still enrolling or running"
        difference: "Forward-looking: money is committed for every seat that is held or filled right now, whether or not anybody ever attends."
      - name: settled_actual
        when: "Cohort RUNNING -> COMPLETED or RemembranceEvent CONFIRMED -> HELD"
        difference: "Chronological: money is spent per session actually attended by enrollments that reached a terminal state, so a cohort that filled but attended sparsely settles far below its commitment."

  - name: participant_outcome_delta
    trigger: "GET /bereavement/participants/{id}/outcome-summary"
    algorithm: weighted_scoring
    formula: |
      baseline = the Assessment for this Participant with kind == BASELINE,
                 ordered recorded_at ASC then created_at ASC, first row
      latest   = the Assessment for this Participant with kind IN {MIDPOINT, EXIT},
                 ordered recorded_at DESC then created_at DESC, first row
      if baseline is missing -> ERR_NO_BASELINE_ASSESSMENT (422)
      if latest   is missing -> latest_score, raw_delta, rtm_correction and
                                attendance_adjusted_delta are all null and
                                attendance_ratio_capped is still returned

      # ---- variant raw_delta ----
      raw_delta = round_half_up(latest.normalized_score - baseline.normalized_score, 2)

      # ---- variant attendance_adjusted_delta ----
      # PINNED ORDER: (1) raw delta, (2) regression-to-the-mean correction,
      # (3) attendance weighting. Applying the weighting before the correction
      # yields a different number and is wrong.
      rtm_correction          = round_half_up(RTM_FACTOR * (baseline.normalized_score - PROGRAM_MEAN), 2)
      attendance_ratio_capped = min(1, participant.sessions_attended_total / EXPECTED_SESSIONS)
      attendance_adjusted_delta = round_half_up(
          (raw_delta - rtm_correction) * (ATT_BASE + ATT_SLOPE * attendance_ratio_capped), 2)
    input_set: |
      Assessments of this Participant only. BASELINE rows define the floor;
      MIDPOINT and EXIT rows compete for `latest`; NEEDS rows are excluded from both
      selections. Participant.sessions_attended_total supplies the attendance weight.
    constants:
      RTM_FACTOR: 0.15
      PROGRAM_MEAN: 50.0
      EXPECTED_SESSIONS: 8
      ATT_BASE: 0.6
      ATT_SLOPE: 0.4
    precision: "2 decimal places, round_half_up at each of the three pinned steps"
    variants:
      - name: raw_delta
        when: "Always returned; the figure clinicians quote to families"
        difference: "Pure difference of two normalized scores; no correction, no weighting."
      - name: attendance_adjusted_delta
        when: "Always returned; the figure that goes into grant outcome reporting"
        difference: "Subtracts the regression-to-the-mean correction first, then scales by the attendance weight, so a participant who attended half the series shows a materially smaller improvement than the raw figure claims."

  - name: grant_report_totals
    trigger: "POST /bereavement/grant-reports (creation), the DRAFT -> SUBMITTED transition, and the RETURNED -> DRAFT revise transition"
    algorithm: aggregation
    formula: |
      # ---- line selection ----
      lines = FundingAllocation rows where
                grant_award_id == report.grant_award_id
                AND status IN {COMMITTED, SETTLED}          # RELEASED rows never report
                AND report.period_start <= effective_date <= report.period_end
      where effective_date = date(settled_at) when status == SETTLED
                             else date(created_at)
      ordering (fixed, so the per-line remainder sequence is deterministic):
                effective_date ASC, then created_at ASC. Never id.

      # ---- per-line amounts ----
      for each line in that order:
          amount_cents        = line.settled_cents if line.status == SETTLED
                                else line.provisional_cents
          line_indirect_cents = round_half_up(
                                    amount_cents * grant.indirect_rate_bps / 10000, 0)

      # ---- PINNED ROUNDING ORDER: round per line, THEN sum ----
      line_count           = count(lines)
      direct_total_cents   = sum(amount_cents        over lines)
      indirect_total_cents = sum(line_indirect_cents over lines)
      reported_total_cents = direct_total_cents + indirect_total_cents

      # ---- served count ----
      funded_cohort_ids   = { line.cohort_id for line in lines if line.cohort_id is not null }
      participants_served = count(distinct enrollment.participant_id
                                  for enrollment where enrollment.cohort_id IN funded_cohort_ids
                                  AND enrollment.status IN {CONFIRMED, ATTENDING, COMPLETED})
    input_set: |
      FundingAllocation rows of one GrantAward whose effective_date falls inside the
      report's inclusive window. RELEASED allocations are excluded outright, so a
      released commitment leaves no trace in any report.
    constants: {}
    precision: |
      Integer cents, round_half_up. The rounding order is PINNED as
      "round each line's indirect amount to whole cents, then sum the rounded
      per-line amounts". The alternative reading - sum the raw amounts first and
      round the aggregate indirect once - is explicitly NOT what this system does
      and produces a different reported_total_cents whenever the per-line
      fractional remainders do not cancel.
    note: |
      Worked divergence: three lines each with amount_cents = 11446 at 1200 bps.
      Pinned order: round_half_up(1373.52) = 1374 per line, summed = 4122.
      Rejected order: round_half_up(34338 * 0.12) = round_half_up(4120.56) = 4121.
      reported_total_cents is therefore 38460, not 38459.

  - name: companion_match_score
    trigger: "POST /bereavement/companion-matches; writes CompanionMatch.match_score once and never recomputes it"
    algorithm: weighted_scoring
    formula: |
      endorsement_component = ENDORSEMENT_WEIGHT * (1 if participant.loss_type
                                                    in companion.endorsed_loss_types else 0)
      training_component    = TRAINING_WEIGHT * min(1, companion.training_hours
                                                       / REQUIRED_TRAINING_HOURS)
      headroom_component    = HEADROOM_WEIGHT * (1 - companion.active_match_count
                                                     / companion.max_concurrent_matches)
      match_score = round_half_up(endorsement_component + training_component
                                  + headroom_component, 2)
    input_set: "The proposed VolunteerCompanion's counters at proposal time and the Participant's loss_type."
    constants:
      ENDORSEMENT_WEIGHT: 40
      TRAINING_WEIGHT: 30
      HEADROOM_WEIGHT: 30
      REQUIRED_TRAINING_HOURS: 16
    precision: "2 decimal places, round_half_up"

  - name: outreach_cadence_plan
    trigger: "The Referral SCREENED -> ACCEPTED transition; creates the Participant's AnniversaryOutreach rows"
    algorithm: projection
    formula: |
      for occasion, offset_days in OCCASION_OFFSETS (in the fixed order
              ONE_MONTH, THREE_MONTH, SIX_MONTH, FIRST_ANNIVERSARY):
          create AnniversaryOutreach(
              participant_id = participant.id,
              occasion       = occasion,
              due_on         = participant.date_of_death + offset_days days,
              status         = SCHEDULED,
              channel        = PHONE if participant.risk_tier == HIGH else EMAIL,
              escalated      = false)
      # At accept time risk_tier is always LOW, so all four rows start as EMAIL.
      # A later NEEDS assessment (or a re-entry escalation) that lands risk_tier
      # == HIGH re-channels every SCHEDULED or DUE row to PHONE and sets
      # escalated = true. Rows already SENT, ACKNOWLEDGED, NO_RESPONSE or
      # CANCELLED are left alone.
    input_set: "The newly created Participant. Exactly four rows are created, always, regardless of how far in the past date_of_death lies."
    constants:
      OCCASION_OFFSETS: { ONE_MONTH: 30, THREE_MONTH: 90, SIX_MONTH: 180, FIRST_ANNIVERSARY: 365 }
      ACK_WINDOW_DAYS: 21
    precision: "whole days on the date axis"

  - name: meeting_space_occupation_conflict
    trigger: "POST /bereavement/cohorts and POST /bereavement/remembrance-events"
    algorithm: interval_merge
    formula: |
      buffer = space.turnover_buffer_minutes

      # A cohort occupies its space on the same weekday, every week, from
      # series_start_date through series_end_date inclusive.
      # An event occupies its space on exactly one date.
      # Two occupations of the SAME space collide when their date sets intersect
      # AND their minute intervals collide under CLOSED-interval arithmetic with
      # the buffer applied to the incoming occupation on both sides:
      #
      #   a_start, a_end = new.start_minute_utc, new.start_minute_utc + new.duration_minutes
      #   b_start, b_end = existing.start_minute_utc, existing.start_minute_utc + existing.duration_minutes
      #   collides = (a_start - buffer <= b_end) AND (b_start - buffer <= a_end)
      #
      # Because the comparison is <= (closed), a gap of EXACTLY `buffer` minutes
      # still collides; the gap must be strictly greater than buffer to be legal.
      date_sets_intersect =
          cohort-vs-event:  cohort.series_start_date <= event.event_date <= cohort.series_end_date
                            AND weekday(event.event_date) == cohort.weekday
          cohort-vs-cohort: weekday equal AND the two [series_start_date, series_end_date]
                            windows overlap inclusively
          event-vs-event:   event_date equal
      if date_sets_intersect AND collides -> ERR_SPACE_TIME_CONFLICT (409)
    input_set: |
      Every Cohort in status FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, RUNNING or
      SUSPENDED and every RemembranceEvent in status PLANNED or CONFIRMED that names
      the same meeting_space_id. Cohorts in COMPLETED or CANCELLED and events in HELD
      or CANCELLED release their occupation and are excluded.
    constants: {}
    precision: "whole minutes; comparisons are non-strict (<=) on both sides"
    note: |
      Worked boundary with buffer = 30, existing cohort block [600, 690]:
      a new event at start_minute_utc 720 has a_start - buffer = 690 <= b_end = 690
      -> COLLIDES. The same event at 721 has 691 > 690 -> legal.

  - name: counselor_weekly_capacity
    trigger: "POST /bereavement/counseling-referrals/{id}/assign"
    algorithm: aggregation
    formula: |
      # Aggregate-capacity semantics, NOT geometric adjacency. The counselor's week
      # is the half-open window [week_start, week_start + 7 days); every ASSIGNED
      # referral occupies requested_minutes_per_week of it for as long as it stays
      # ASSIGNED, with no notion of which minutes.
      committed_minutes = sum(r.requested_minutes_per_week
                              for r in counselor's CounselingReferrals
                              where r.status == ASSIGNED)
      if committed_minutes + candidate.requested_minutes_per_week
             > counselor.weekly_capacity_minutes:
          -> ERR_COUNSELOR_CAPACITY_EXCEEDED (409)
      # Strictly greater-than: landing exactly on weekly_capacity_minutes is legal.
      if counselor.active_caseload + 1 > counselor.caseload_cap:
          -> ERR_COUNSELOR_CASELOAD_EXCEEDED (409)
    input_set: "CounselingReferrals in status ASSIGNED for this Counselor. WAITLISTED, CLOSED and CANCELLED rows contribute zero minutes."
    constants: {}
    precision: "whole minutes; the capacity comparison is strict (>) so equality passes"

# =====================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty, and X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: |
      For entity_backed roles acting on a resource they must own, X-User-ID matches
      the owning id: Participant -> the Participant in the path, or the
      participant_id of the Enrollment / Invitation / AnniversaryOutreach in the
      path; Counselor -> CounselingReferral.counselor_id; VolunteerCompanion ->
      VolunteerCompanion.id in the path, or CompanionMatch.companion_id, or (for
      anniversary-outreach send) the companion_id of an ACTIVE CompanionMatch whose
      participant_id equals the touchpoint's participant_id.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list contains an entity_backed role"

  - priority: 4
    category: auth
    check: "On grant-report acceptance, the acting GrantOfficer's X-User-ID differs from GrantReport.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bereavement/grant-reports/{id}/accept"

  - priority: 5
    category: existence
    check: "Every resource named by a path segment exists, validated left to right."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: business_constraint
    check: |
      Request body conforms to the endpoint's declared input: every required field
      present, every enum value a declared member, every integer inside its declared
      range, arrays are arrays. Also covers the conditional shape rules:
      source_org_name required when source_type != SELF; FundingAllocation.cohort_id
      non-null exactly when category == GROUP_PROGRAM and event_id non-null exactly
      when category == REMEMBRANCE_EVENT; Cohort.series_start_date weekday equals
      Cohort.weekday; Cohort.min_viable_enrollment <= seats_total.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 7
    category: existence
    check: "Every entity id named in the request body exists."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /bereavement/enrollments, POST /bereavement/counseling-referrals, POST /bereavement/counseling-referrals/{id}/assign, POST /bereavement/companion-matches, POST /bereavement/cohorts, POST /bereavement/remembrance-events, POST /bereavement/invitations, POST /bereavement/funding-allocations, POST /bereavement/grant-reports"

  - priority: 8
    category: state
    check: "The expected_<parent>_version supplied on an OCC-guarded write equals the parent's current version."
    error_id: "ERR_STALE_COHORT_VERSION | ERR_STALE_COUNSELOR_VERSION | ERR_STALE_GRANT_VERSION"
    http_status: 412
    applies_to: "POST /bereavement/enrollments, POST /bereavement/counseling-referrals/{id}/assign, POST /bereavement/funding-allocations"

  - priority: 9
    category: state
    check: |
      The target resource is in a state from which the requested transition is
      declared in §1.2. Covers the generic ERR_INVALID_STATE and the named
      state errors: ERR_REFERRAL_NOT_SCREENED (accept on a non-SCREENED Referral),
      ERR_COHORT_NOT_ENROLLING (enrol / confirm against a Cohort not in
      OPEN_ENROLLMENT), ERR_COUNSELOR_NOT_ACTIVE (assign to a Counselor not ACTIVE),
      ERR_COMPANION_NOT_CERTIFIED (propose or accept a match for a volunteer not
      CERTIFIED), ERR_EVENT_NOT_CONFIRMED (send an Invitation whose event is not
      CONFIRMED), ERR_GRANT_CLOSED (allocate or report against a CLOSED award),
      ERR_COHORT_NOT_FUNDABLE (allocate to a Cohort not in OPEN_ENROLLMENT, RUNNING
      or SUSPENDED), ERR_EVENT_NOT_FUNDABLE (allocate to a RemembranceEvent not in
      PLANNED or CONFIRMED), ERR_PARTICIPANT_WITHDRAWN (any participant-scoped write once
      service_status == WITHDRAWN), ERR_OUTREACH_NOT_DUE (send a touchpoint that is
      not DUE), ERR_ALREADY_TERMINAL (any transition out of a declared terminal state).
    error_id: "ERR_INVALID_STATE and the named state errors above"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: business_safety
    check: |
      Clinical safety gates, evaluated before any referential, temporal, capacity or
      fiscal rule:
      (a) Enrollment creation requires at least one NEEDS Assessment on the
          Participant -> ERR_ASSESSMENT_REQUIRED.
      (b) When the Participant's most recent NEEDS Assessment carries
          suicidality_flag == true, Enrollment creation additionally requires an open
          CounselingReferral for that Participant in status WAITLISTED or ASSIGNED ->
          ERR_SUICIDALITY_REQUIRES_COUNSELING.
      (c) CompanionMatch creation for a Participant whose risk_tier == HIGH requires
          the volunteer's training_hours >= 24 ->
          ERR_COMPANION_TRAINING_INSUFFICIENT.
    error_id: "ERR_ASSESSMENT_REQUIRED | ERR_SUICIDALITY_REQUIRES_COUNSELING | ERR_COMPANION_TRAINING_INSUFFICIENT"
    http_status: 422
    applies_to: "POST /bereavement/enrollments, POST /bereavement/companion-matches"

  - priority: 11
    category: business_referential
    check: |
      Cross-entity attribute agreement:
      (a) Cohort.loss_type == Participant.loss_type -> ERR_LOSS_TYPE_MISMATCH.
      (b) CounselingReferral.required_specialty IN Counselor.specialties ->
          ERR_SPECIALTY_MISMATCH.
      (c) Participant.loss_type IN VolunteerCompanion.endorsed_loss_types ->
          ERR_LOSS_TYPE_NOT_ENDORSED.
      (d) FundingAllocation.category IN GrantAward.allowed_categories ->
          ERR_CATEGORY_NOT_ALLOWED.
      (e) The funded subject matches the category: cohort_id set for GROUP_PROGRAM,
          event_id set for REMEMBRANCE_EVENT -> ERR_ALLOCATION_SUBJECT_MISMATCH.
    error_id: "ERR_LOSS_TYPE_MISMATCH | ERR_SPECIALTY_MISMATCH | ERR_LOSS_TYPE_NOT_ENDORSED | ERR_CATEGORY_NOT_ALLOWED | ERR_ALLOCATION_SUBJECT_MISMATCH"
    http_status: 422
    applies_to: "POST /bereavement/enrollments, POST /bereavement/counseling-referrals/{id}/assign, POST /bereavement/companion-matches, POST /bereavement/funding-allocations"

  - priority: 12
    category: business_temporal
    check: |
      Time-geometry rules:
      (a) A new Cohort series or RemembranceEvent must not collide with an existing
          occupation of the same MeetingSpace under
          calculations.meeting_space_occupation_conflict -> ERR_SPACE_TIME_CONFLICT.
      (b) RemembranceEvent.event_date >= logical clock date ->
          ERR_EVENT_DATE_IN_PAST.
      (c) Referral.date_of_death <= logical clock date ->
          ERR_DECEASED_DATE_IN_FUTURE.
      (d) The allocation's effective date (the logical clock date at creation) lies
          inside [GrantAward.period_start, GrantAward.period_end] inclusive ->
          ERR_OUTSIDE_GRANT_PERIOD.
      (e) Invitation send and respond require the logical clock date <=
          Invitation.rsvp_deadline -> ERR_RSVP_WINDOW_CLOSED.
    error_id: "ERR_SPACE_TIME_CONFLICT | ERR_EVENT_DATE_IN_PAST | ERR_DECEASED_DATE_IN_FUTURE | ERR_OUTSIDE_GRANT_PERIOD | ERR_RSVP_WINDOW_CLOSED"
    http_status: "409 for ERR_SPACE_TIME_CONFLICT and ERR_RSVP_WINDOW_CLOSED; 422 for the other three"
    applies_to: "POST /bereavement/cohorts, POST /bereavement/remembrance-events, POST /bereavement/referrals, POST /bereavement/funding-allocations, POST /bereavement/invitations/{id}/send, POST /bereavement/invitations/{id}/respond"

  - priority: 13
    category: business_constraint
    check: |
      Capacity and uniqueness constraints:
      (a) Cohort.seats_open >= 1 at Enrollment creation -> ERR_COHORT_FULL.
      (b) No existing Enrollment for the same (participant_id, cohort_id) in status
          HELD, CONFIRMED, ATTENDING or COMPLETED -> ERR_DUPLICATE_ENROLLMENT.
      (c) Counselor.active_caseload + 1 <= Counselor.caseload_cap ->
          ERR_COUNSELOR_CASELOAD_EXCEEDED.
      (d) Counselor.committed_minutes + requested_minutes_per_week <=
          Counselor.weekly_capacity_minutes -> ERR_COUNSELOR_CAPACITY_EXCEEDED.
      (e) VolunteerCompanion.active_match_count + 1 <= max_concurrent_matches ->
          ERR_MATCH_LIMIT_REACHED.
      (f) No existing CompanionMatch for the same (companion_id, participant_id) in
          status PROPOSED or ACTIVE -> ERR_DUPLICATE_MATCH.
      (g) Cohort.seats_total <= MeetingSpace.capacity and
          RemembranceEvent.expected_attendance <= MeetingSpace.capacity ->
          ERR_SPACE_CAPACITY_EXCEEDED.
      (h) GrantAward.award_reference is unique -> ERR_DUPLICATE_AWARD_REFERENCE.
      (i) No existing GrantReport for the same grant_award_id in status DRAFT,
          SUBMITTED or RETURNED whose window overlaps the requested window ->
          ERR_REPORT_PERIOD_OVERLAP.
      (j) Cohort.seats_filled >= Cohort.min_viable_enrollment on resume ->
          ERR_MIN_VIABLE_NOT_MET.
      (k) No existing Referral in status RECEIVED, SCREENED or ACCEPTED with the same
          contact_email and date_of_death -> ERR_DUPLICATE_REFERRAL.
      (l) An Assessment of kind MIDPOINT or EXIT requires an existing BASELINE
          Assessment for that Participant -> ERR_ASSESSMENT_SEQUENCE_INVALID.
    error_id: "the named constraint errors above"
    http_status: "409, except ERR_SPACE_CAPACITY_EXCEEDED and ERR_ASSESSMENT_SEQUENCE_INVALID which are 422"
    applies_to: "POST /bereavement/enrollments, POST /bereavement/counseling-referrals/{id}/assign, POST /bereavement/companion-matches, POST /bereavement/cohorts, POST /bereavement/remembrance-events, POST /bereavement/grant-awards, POST /bereavement/grant-reports, POST /bereavement/cohorts/{id}/resume, POST /bereavement/referrals, POST /bereavement/participants/{id}/assessments"

  - priority: 14
    category: business_fiscal
    check: "GrantAward.available_cents >= the provisional_cents about to be committed. Equality passes; the comparison is >=."
    error_id: ERR_GRANT_FUNDS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /bereavement/funding-allocations"

  - priority: 15
    category: business_constraint
    check: "GET /bereavement/participants/{id}/outcome-summary requires at least one BASELINE Assessment for the Participant."
    error_id: ERR_NO_BASELINE_ASSESSMENT
    http_status: 422
    applies_to: "GET /bereavement/participants/{id}/outcome-summary"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---- logical clock & ops run -------------------------------------
  - method: POST
    path: "/bereavement/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before this endpoint is ever called the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every deadline, expiry, cadence and window rule in this system reads the logical clock only."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Repositions the logical clock; no entity is mutated and no sweep runs"]

  - method: POST
    path: "/bereavement/_ops/cadence-run"
    description: "Ops-run checkpoint. Advances every clock-driven transition in one pass, in the fixed order (1) HELD Enrollments past held_until -> EXPIRED, (2) SENT Invitations past rsvp_deadline -> EXPIRED, (3) CERTIFIED VolunteerCompanions past certification_expires_on -> LAPSED with their ACTIVE matches ended, (4) SCHEDULED AnniversaryOutreach rows whose due_on has arrived -> DUE, (5) SENT AnniversaryOutreach rows 21 or more days old -> NO_RESPONSE."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: { enrollments_expired: integer, invitations_expired: integer, companions_lapsed: integer, matches_ended: integer, outreaches_due: integer, outreaches_no_response: integer }
    side_effects:
      - "Enrollment HELD -> EXPIRED with the seat returned to Cohort.seats_open and Cohort.version incremented"
      - "Invitation SENT -> EXPIRED"
      - "VolunteerCompanion CERTIFIED -> LAPSED, cascading its ACTIVE CompanionMatches to ENDED and recomputing active_match_count and Participant.has_active_companion"
      - "AnniversaryOutreach SCHEDULED -> DUE (skipped while Participant.outreach_status == ON_HOLD)"
      - "AnniversaryOutreach SENT -> NO_RESPONSE, moving Participant.outreach_status SCHEDULED -> LAPSED"

  # ---- referral intake ---------------------------------------------
  - method: POST
    path: "/bereavement/referrals"
    description: "Files an intake referral from a hospice, a funeral home, or the bereaved person themselves."
    roles: [ReferralSource, IntakeCoordinator]
    code: 201
    input: [source_type, decedent_name, date_of_death, relationship_to_deceased, loss_type, contact_name, contact_email, "source_org_name?"]
    output: Referral
    side_effects: ["Referral created in status RECEIVED with screening_band and days_since_death null"]

  - method: GET
    path: "/bereavement/referrals/{id}"
    description: "Reads one referral."
    roles: [IntakeCoordinator, ProgramDirector]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/bereavement/referrals"
    description: "Lists referrals, optionally filtered by status, source_type or the Participant they produced."
    roles: [IntakeCoordinator, ProgramDirector]
    code: 200
    input: ["status?", "source_type?", "participant_id?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/bereavement/referrals/{id}/screen"
    description: "Screens a received referral and bands it by time since death."
    roles: [IntakeCoordinator]
    code: 200
    input: ["eligibility_note?"]
    output: Referral
    side_effects: ["RECEIVED -> SCREENED", "Computes days_since_death and screening_band per calculations.referral_screening_band"]

  - method: POST
    path: "/bereavement/referrals/{id}/accept"
    description: "Accepts a screened referral and mints the Participant plus their outreach cadence plan."
    roles: [IntakeCoordinator]
    code: 201
    input: []
    output: Participant
    side_effects:
      - "Referral SCREENED -> ACCEPTED and Referral.participant_id set"
      - "Participant created with service_status INTAKE, outreach_status SCHEDULED, risk_tier LOW, outreach_cadence_days 90"
      - "Four AnniversaryOutreach rows created per calculations.outreach_cadence_plan"

  - method: POST
    path: "/bereavement/referrals/{id}/decline"
    description: "Declines a referral with a recorded reason."
    roles: [IntakeCoordinator]
    code: 200
    input: [decline_reason]
    output: Referral
    side_effects: ["{RECEIVED, SCREENED} -> DECLINED"]

  # ---- participants & assessments ----------------------------------
  - method: GET
    path: "/bereavement/participants/{id}"
    description: "Reads one participant with all derived counters."
    roles: [IntakeCoordinator, ProgramDirector, Counselor, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/bereavement/participants"
    description: "Lists participants, optionally filtered by originating referral, service status, risk tier or loss type."
    roles: [IntakeCoordinator, ProgramDirector]
    code: 200
    input: ["referral_id?", "service_status?", "risk_tier?", "loss_type?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: POST
    path: "/bereavement/participants/{id}/assessments"
    description: "Records an assessment. NEEDS re-tiers the participant; BASELINE / MIDPOINT / EXIT feed outcome measurement."
    roles: [IntakeCoordinator, Counselor]
    code: 201
    input: [kind, instrument, grief_severity, isolation_index, functional_impairment, "suicidality_flag?"]
    output: Assessment
    side_effects:
      - "Computes raw_total and normalized_score per calculations.composite_need_index step 1"
      - "kind NEEDS: recomputes Participant.composite_need_index, risk_tier and outreach_cadence_days, moves service_status INTAKE -> ASSESSED, and re-channels SCHEDULED/DUE outreach rows to PHONE when the new tier is HIGH"
      - "kind BASELINE: sets Participant.baseline_score"
      - "kind MIDPOINT or EXIT: sets Participant.latest_score; kind EXIT additionally moves service_status MAINTENANCE -> DISCHARGED"

  - method: GET
    path: "/bereavement/participants/{id}/assessments"
    description: "Lists a participant's assessments in creation order."
    roles: [IntakeCoordinator, ProgramDirector, Counselor]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: GET
    path: "/bereavement/participants/{id}/outcome-summary"
    description: "Computed read returning both outcome variants side by side."
    roles: [IntakeCoordinator, ProgramDirector, Counselor]
    code: 200
    input: []
    output: { participant_id: string, baseline_score: number, latest_score: number, raw_delta: number, rtm_correction: number, attendance_ratio_capped: number, attendance_adjusted_delta: number, sessions_attended_total: integer }
    side_effects: []

  - method: POST
    path: "/bereavement/participants/{id}/withdraw"
    description: "Withdraws a participant from the whole programme, unwinding every downstream commitment."
    roles: [IntakeCoordinator, Participant]
    code: 200
    input: []
    output: Participant
    side_effects:
      - "service_status -> WITHDRAWN and outreach_status -> CLOSED"
      - "Enrollments in HELD/CONFIRMED/ATTENDING -> WITHDRAWN (PARTICIPANT_REQUEST), returning seats and possibly suspending a RUNNING cohort, whose COMMITTED allocations are then RELEASED and the GrantAward totals restored"
      - "CounselingReferrals in WAITLISTED/ASSIGNED -> CANCELLED, releasing counselor caseload and minutes"
      - "CompanionMatches PROPOSED -> DECLINED and ACTIVE -> ENDED"
      - "AnniversaryOutreach rows in SCHEDULED/DUE/SENT -> CANCELLED"

  - method: POST
    path: "/bereavement/participants/{id}/outreach-hold"
    description: "Places the participant's outreach dimension on hold, or lifts the hold. Does not touch service_status."
    roles: [IntakeCoordinator, Participant]
    code: 200
    input: [hold]
    output: Participant
    side_effects: ["outreach_status SCHEDULED <-> ON_HOLD; ops runs skip this participant's touchpoints while ON_HOLD"]

  - method: GET
    path: "/bereavement/participants/{id}/anniversary-outreaches"
    description: "Lists a participant's cadence touchpoints in occasion order."
    roles: [IntakeCoordinator, ProgramDirector, VolunteerCompanion]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AnniversaryOutreach[]
    side_effects: []

  - method: POST
    path: "/bereavement/anniversary-outreaches/{id}/send"
    description: "Sends a due touchpoint."
    roles: [IntakeCoordinator, VolunteerCompanion]
    code: 200
    input: []
    output: AnniversaryOutreach
    side_effects: ["DUE -> SENT with sent_at stamped from the logical clock"]

  - method: POST
    path: "/bereavement/anniversary-outreaches/{id}/acknowledge"
    description: "Records that the family responded to a touchpoint."
    roles: [IntakeCoordinator, VolunteerCompanion]
    code: 200
    input: []
    output: AnniversaryOutreach
    side_effects: ["{SENT, NO_RESPONSE} -> ACKNOWLEDGED", "Participant.outreach_status LAPSED -> SCHEDULED"]

  # ---- meeting spaces ----------------------------------------------
  - method: POST
    path: "/bereavement/meeting-spaces"
    description: "Registers a room usable by cohorts and remembrance events."
    roles: [ProgramDirector]
    code: 201
    input: [name, capacity, "turnover_buffer_minutes?", "accessibility_features?"]
    output: MeetingSpace
    side_effects: ["MeetingSpace created in status AVAILABLE"]

  - method: GET
    path: "/bereavement/meeting-spaces/{id}"
    description: "Reads one meeting space."
    roles: [ProgramDirector, IntakeCoordinator]
    code: 200
    input: []
    output: MeetingSpace
    side_effects: []

  # ---- cohorts ------------------------------------------------------
  - method: POST
    path: "/bereavement/meeting-spaces/{id}/status"
    description: "Takes a meeting space out of service, or restores it to service."
    roles: [ProgramDirector]
    code: 200
    input: [status]
    output: MeetingSpace
    side_effects: ["AVAILABLE <-> OUT_OF_SERVICE"]

  - method: POST
    path: "/bereavement/cohorts"
    description: "Forms a support-group cohort for one loss type on a fixed weekly slot, occupying a meeting space for the whole series."
    roles: [ProgramDirector]
    code: 201
    input: [name, loss_type, meeting_space_id, seats_total, min_viable_enrollment, weekday, start_minute_utc, duration_minutes, series_start_date, sessions_total, direct_cost_cents]
    output: Cohort
    side_effects:
      - "Computes series_end_date, admin_fee_cents and program_cost_total_cents per calculations.program_cost_total"
      - "Sets seats_open to seats_total, seats_held and seats_filled to 0"
      - "Rejects the create when the series collides with an existing occupation of the same space per calculations.meeting_space_occupation_conflict"

  - method: GET
    path: "/bereavement/cohorts/{id}"
    description: "Reads one cohort with its live seat counters."
    roles: [ProgramDirector, IntakeCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  - method: GET
    path: "/bereavement/cohorts"
    description: "Lists cohorts, optionally filtered by space, status or loss type."
    roles: [ProgramDirector, IntakeCoordinator]
    code: 200
    input: ["meeting_space_id?", "status?", "loss_type?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []

  - method: POST
    path: "/bereavement/cohorts/{id}/open-enrollment"
    description: "Opens (or re-opens, from UNDERSUBSCRIBED) enrolment on a cohort."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects: ["{FORMING, UNDERSUBSCRIBED} -> OPEN_ENROLLMENT", "Increments Cohort.version by 1"]

  - method: POST
    path: "/bereavement/cohorts/{id}/launch"
    description: "Closes enrolment and branches on the min_viable_enrollment boundary."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects:
      - "seats_filled >= min_viable_enrollment: OPEN_ENROLLMENT -> RUNNING, CONFIRMED enrollments -> ATTENDING, HELD enrollments -> EXPIRED with their seats returned"
      - "seats_filled < min_viable_enrollment: OPEN_ENROLLMENT -> UNDERSUBSCRIBED with enrollments untouched"
      - "Increments Cohort.version by 1"

  - method: POST
    path: "/bereavement/cohorts/{id}/suspend"
    description: "Suspends a running cohort and releases its committed grant money."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects: ["RUNNING -> SUSPENDED", "COMMITTED FundingAllocations on this cohort -> RELEASED, restoring GrantAward.available_cents", "Increments Cohort.version by 1"]

  - method: POST
    path: "/bereavement/cohorts/{id}/resume"
    description: "Returns a suspended cohort to RUNNING, provided it still meets the viability floor."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects: ["SUSPENDED -> RUNNING", "Increments Cohort.version by 1"]

  - method: POST
    path: "/bereavement/cohorts/{id}/complete"
    description: "Completes a running cohort, closing out enrollments, participants and grant money."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects:
      - "RUNNING -> COMPLETED"
      - "CONFIRMED/ATTENDING enrollments -> COMPLETED with attendance_ratio recomputed"
      - "Each completed enrollment adds sessions_attended to Participant.sessions_attended_total and moves that Participant ACTIVE -> MAINTENANCE"
      - "COMMITTED FundingAllocations on this cohort -> SETTLED using calculations.funding_allocation_amount variant settled_actual, moving money from GrantAward.committed_cents to GrantAward.spent_cents"
      - "Increments Cohort.version by 1"

  - method: POST
    path: "/bereavement/cohorts/{id}/cancel"
    description: "Cancels a cohort that has not started or has been suspended."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Cohort
    side_effects: ["{FORMING, OPEN_ENROLLMENT, UNDERSUBSCRIBED, SUSPENDED} -> CANCELLED", "Live enrollments -> WITHDRAWN (PROGRAM_CANCELLED)", "COMMITTED FundingAllocations -> RELEASED", "Increments Cohort.version by 1"]

  # ---- enrollments --------------------------------------------------
  - method: POST
    path: "/bereavement/enrollments"
    description: "Holds a seat for a participant in an enrolling cohort. OCC-guarded on the cohort's version."
    roles: [IntakeCoordinator]
    code: 201
    input: [participant_id, cohort_id, expected_cohort_version]
    output: Enrollment
    side_effects:
      - "Enrollment created in HELD with held_until = created_at + 72 hours"
      - "Cohort.seats_held increases by 1 and Cohort.seats_open decreases by 1"
      - "Increments Cohort.version by 1"
      - "Participant.service_status ASSESSED -> ACTIVE on the participant's first live enrollment"

  - method: GET
    path: "/bereavement/enrollments/{id}"
    description: "Reads one enrollment."
    roles: [IntakeCoordinator, ProgramDirector, Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/bereavement/enrollments"
    description: "Lists enrollments, optionally filtered by participant, cohort or status."
    roles: [IntakeCoordinator, ProgramDirector]
    code: 200
    input: ["participant_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/bereavement/enrollments/{id}/confirm"
    description: "Converts a held seat into a confirmed seat."
    roles: [IntakeCoordinator, Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["HELD -> CONFIRMED", "Cohort.seats_held decreases by 1 and Cohort.seats_filled increases by 1", "Increments Cohort.version by 1"]

  - method: POST
    path: "/bereavement/enrollments/{id}/withdraw"
    description: "Withdraws a single enrollment, returning its seat to the pool."
    roles: [IntakeCoordinator, Participant]
    code: 200
    input: [withdraw_reason]
    output: Enrollment
    side_effects: ["{HELD, CONFIRMED, ATTENDING} -> WITHDRAWN", "The seat returns to Cohort.seats_open", "A RUNNING cohort that drops below min_viable_enrollment moves to SUSPENDED, releasing its COMMITTED allocations", "Increments Cohort.version by 1"]

  - method: POST
    path: "/bereavement/enrollments/{id}/attendance"
    description: "Logs session attendance against an enrollment."
    roles: [IntakeCoordinator]
    code: 200
    input: [sessions_delta]
    output: Enrollment
    side_effects: ["Adds sessions_delta to Enrollment.sessions_attended (never above Cohort.sessions_total, never below 0) and recomputes attendance_ratio"]

  # ---- counseling ---------------------------------------------------
  - method: POST
    path: "/bereavement/counselors"
    description: "Registers an individual-counselling provider with a caseload cap and a weekly minute budget."
    roles: [ProgramDirector]
    code: 201
    input: [full_name, license_type, specialties, caseload_cap, weekly_capacity_minutes]
    output: Counselor
    side_effects: ["Counselor created in status ACTIVE with active_caseload 0 and committed_minutes 0"]

  - method: GET
    path: "/bereavement/counselors/{id}"
    description: "Reads one counselor with live caseload and minute counters."
    roles: [ProgramDirector, IntakeCoordinator, Counselor]
    code: 200
    input: []
    output: Counselor
    side_effects: []

  - method: POST
    path: "/bereavement/counselors/{id}/deactivate"
    description: "Takes a counselor off the roster and returns their whole caseload to the waitlist."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Counselor
    side_effects:
      - "ACTIVE -> INACTIVE with active_caseload and committed_minutes zeroed"
      - "Every ASSIGNED CounselingReferral returns to WAITLISTED with counselor_id cleared and waitlisted_at reset"
      - "Each re-entry increments that Participant.waitlist_reentry_count, and a count of 2 or more escalates the Participant's risk_tier one level, which in turn recomputes outreach_cadence_days and re-channels SCHEDULED/DUE outreach to PHONE when the new tier is HIGH"
      - "Increments Counselor.version by 1"

  - method: POST
    path: "/bereavement/counseling-referrals"
    description: "Places a participant on the individual-counselling waitlist."
    roles: [IntakeCoordinator, Counselor]
    code: 201
    input: [participant_id, requested_minutes_per_week, urgency, required_specialty]
    output: CounselingReferral
    side_effects: ["Created in WAITLISTED with waitlisted_at stamped from the logical clock and queue_priority from calculations.counseling_queue_priority", "Participant.service_status ASSESSED -> ACTIVE"]

  - method: GET
    path: "/bereavement/counseling-referrals/{id}"
    description: "Reads one counselling referral."
    roles: [IntakeCoordinator, ProgramDirector, Counselor]
    code: 200
    input: []
    output: CounselingReferral
    side_effects: []

  - method: GET
    path: "/bereavement/counseling-referrals"
    description: "Lists counselling referrals, optionally filtered by participant, counselor or status."
    roles: [IntakeCoordinator, ProgramDirector, Counselor]
    code: 200
    input: ["participant_id?", "counselor_id?", "status?", "limit?", "offset?"]
    output: CounselingReferral[]
    side_effects: []

  - method: POST
    path: "/bereavement/counseling-referrals/{id}/assign"
    description: "Assigns a waitlisted referral to an active counselor. OCC-guarded on the counselor's version."
    roles: [IntakeCoordinator]
    code: 200
    input: [counselor_id, expected_counselor_version]
    output: CounselingReferral
    side_effects: ["WAITLISTED -> ASSIGNED with counselor_id and assigned_at set", "Counselor.active_caseload +1 and Counselor.committed_minutes += requested_minutes_per_week", "Increments Counselor.version by 1"]

  - method: POST
    path: "/bereavement/counseling-referrals/{id}/close"
    description: "Closes an assigned referral and returns the counselor's capacity."
    roles: [IntakeCoordinator, Counselor]
    code: 200
    input: [close_reason]
    output: CounselingReferral
    side_effects: ["ASSIGNED -> CLOSED", "Counselor.active_caseload -1 and Counselor.committed_minutes -= requested_minutes_per_week", "Increments Counselor.version by 1"]

  # ---- volunteer companions -----------------------------------------
  - method: POST
    path: "/bereavement/volunteer-companions"
    description: "Registers a volunteer companion applicant."
    roles: [ProgramDirector]
    code: 201
    input: [full_name, endorsed_loss_types, "max_concurrent_matches?"]
    output: VolunteerCompanion
    side_effects: ["Created in status APPLIED with training_hours 0 and no modules"]

  - method: GET
    path: "/bereavement/volunteer-companions/{id}"
    description: "Reads one volunteer companion."
    roles: [ProgramDirector, IntakeCoordinator, VolunteerCompanion]
    code: 200
    input: []
    output: VolunteerCompanion
    side_effects: []

  - method: POST
    path: "/bereavement/volunteer-companions/{id}/training-records"
    description: "Records completion of one training module, certifying the volunteer once 16 hours and both core modules are on file."
    roles: [ProgramDirector, VolunteerCompanion]
    code: 200
    input: [module_code, hours]
    output: VolunteerCompanion
    side_effects: ["{APPLIED, LAPSED} -> IN_TRAINING on the first record", "training_hours and modules_completed updated", "IN_TRAINING -> CERTIFIED once training_hours >= 16 and both CORE_LISTENING and CORE_SAFETY are recorded, stamping certified_on and certification_expires_on = certified_on + 365 days"]

  - method: POST
    path: "/bereavement/volunteer-companions/{id}/suspend"
    description: "Suspends a certified volunteer pending review."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: VolunteerCompanion
    side_effects: ["CERTIFIED -> SUSPENDED", "PROPOSED CompanionMatches for this volunteer -> DECLINED"]

  - method: POST
    path: "/bereavement/volunteer-companions/{id}/reinstate"
    description: "Returns a suspended volunteer to CERTIFIED when their certification has not expired."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: VolunteerCompanion
    side_effects: ["SUSPENDED -> CERTIFIED"]

  - method: POST
    path: "/bereavement/companion-matches"
    description: "Proposes a volunteer companion to a participant."
    roles: [IntakeCoordinator]
    code: 201
    input: [companion_id, participant_id]
    output: CompanionMatch
    side_effects: ["Created in PROPOSED with match_score from calculations.companion_match_score, frozen for the life of the row"]

  - method: GET
    path: "/bereavement/companion-matches/{id}"
    description: "Reads one companion match."
    roles: [IntakeCoordinator, ProgramDirector, VolunteerCompanion]
    code: 200
    input: []
    output: CompanionMatch
    side_effects: []

  - method: GET
    path: "/bereavement/companion-matches"
    description: "Lists companion matches, optionally filtered by participant, companion or status."
    roles: [IntakeCoordinator, ProgramDirector, VolunteerCompanion]
    code: 200
    input: ["participant_id?", "companion_id?", "status?", "limit?", "offset?"]
    output: CompanionMatch[]
    side_effects: []

  - method: POST
    path: "/bereavement/companion-matches/{id}/respond"
    description: "The proposed volunteer accepts or declines the match."
    roles: [VolunteerCompanion]
    code: 200
    input: [decision]
    output: CompanionMatch
    side_effects: ["ACCEPT: PROPOSED -> ACTIVE, started_on stamped, VolunteerCompanion.active_match_count +1, Participant.has_active_companion true", "DECLINE: PROPOSED -> DECLINED with no counter change"]

  - method: POST
    path: "/bereavement/companion-matches/{id}/end"
    description: "Ends an active companion relationship."
    roles: [IntakeCoordinator, VolunteerCompanion]
    code: 200
    input: [end_reason]
    output: CompanionMatch
    side_effects: ["ACTIVE -> ENDED with ended_on stamped", "VolunteerCompanion.active_match_count -1 and Participant.has_active_companion recomputed"]

  # ---- remembrance events & invitations ------------------------------
  - method: POST
    path: "/bereavement/remembrance-events"
    description: "Plans a one-off remembrance event in a meeting space."
    roles: [ProgramDirector]
    code: 201
    input: [title, meeting_space_id, event_date, start_minute_utc, duration_minutes, expected_attendance, direct_cost_cents]
    output: RemembranceEvent
    side_effects:
      - "Created in PLANNED with admin_fee_cents and program_cost_total_cents from calculations.program_cost_total"
      - "Rejects the create when the slot collides with an existing occupation of the same space per calculations.meeting_space_occupation_conflict"

  - method: GET
    path: "/bereavement/remembrance-events/{id}"
    description: "Reads one remembrance event with live invitation counters."
    roles: [ProgramDirector, IntakeCoordinator]
    code: 200
    input: []
    output: RemembranceEvent
    side_effects: []

  - method: GET
    path: "/bereavement/remembrance-events"
    description: "Lists remembrance events, optionally filtered by space or status."
    roles: [ProgramDirector, IntakeCoordinator]
    code: 200
    input: ["meeting_space_id?", "status?", "limit?", "offset?"]
    output: RemembranceEvent[]
    side_effects: []

  - method: POST
    path: "/bereavement/remembrance-events/{id}/confirm"
    description: "Confirms a planned event so invitations may go out."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RemembranceEvent
    side_effects: ["PLANNED -> CONFIRMED", "Increments RemembranceEvent.version by 1"]

  - method: POST
    path: "/bereavement/remembrance-events/{id}/cancel"
    description: "Cancels an event, voiding its invitations and releasing its grant money."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RemembranceEvent
    side_effects: ["{PLANNED, CONFIRMED} -> CANCELLED", "DRAFT and SENT invitations -> VOID", "COMMITTED FundingAllocations on this event -> RELEASED, restoring GrantAward.available_cents"]

  - method: POST
    path: "/bereavement/remembrance-events/{id}/mark-held"
    description: "Records that a confirmed event took place and settles its funding on confirmed headcount."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RemembranceEvent
    side_effects: ["CONFIRMED -> HELD", "DRAFT and SENT invitations -> EXPIRED", "COMMITTED FundingAllocations on this event -> SETTLED using calculations.funding_allocation_amount variant settled_actual"]

  - method: POST
    path: "/bereavement/invitations"
    description: "Drafts a family invitation to a remembrance event."
    roles: [IntakeCoordinator]
    code: 201
    input: [event_id, participant_id, "guest_count?"]
    output: Invitation
    side_effects: ["Created in DRAFT with rsvp_deadline = event_date minus 3 days"]

  - method: GET
    path: "/bereavement/invitations/{id}"
    description: "Reads one invitation."
    roles: [IntakeCoordinator, ProgramDirector, Participant]
    code: 200
    input: []
    output: Invitation
    side_effects: []

  - method: GET
    path: "/bereavement/invitations"
    description: "Lists invitations, optionally filtered by event, participant or status."
    roles: [IntakeCoordinator, ProgramDirector]
    code: 200
    input: ["event_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: Invitation[]
    side_effects: []

  - method: POST
    path: "/bereavement/invitations/{id}/send"
    description: "Sends a drafted invitation; only allowed once the event is CONFIRMED."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Invitation
    side_effects: ["DRAFT -> SENT with sent_at stamped", "RemembranceEvent.invitations_sent +1"]

  - method: POST
    path: "/bereavement/invitations/{id}/respond"
    description: "The invited participant RSVPs."
    roles: [Participant, IntakeCoordinator]
    code: 200
    input: [response]
    output: Invitation
    side_effects: ["SENT -> ACCEPTED or DECLINED with responded_at stamped", "On ACCEPT, RemembranceEvent.invitations_accepted +1 and confirmed_headcount += 1 + guest_count"]

  # ---- funding & grant reporting --------------------------------------
  - method: POST
    path: "/bereavement/grant-awards"
    description: "Records a grant award with its conserved money pool and allowed cost categories."
    roles: [ProgramDirector]
    code: 201
    input: [funder_name, award_reference, awarded_cents, allowed_categories, period_start, period_end, "indirect_rate_bps?"]
    output: GrantAward
    side_effects: ["Created ACTIVE with committed_cents 0, spent_cents 0 and available_cents = awarded_cents"]

  - method: GET
    path: "/bereavement/grant-awards/{id}"
    description: "Reads one grant award with its live money split."
    roles: [ProgramDirector, GrantOfficer]
    code: 200
    input: []
    output: GrantAward
    side_effects: []

  - method: POST
    path: "/bereavement/grant-awards/{id}/close"
    description: "Closes an award once nothing is still committed against it."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["ACTIVE -> CLOSED"]

  - method: POST
    path: "/bereavement/funding-allocations"
    description: "Commits grant money to a cohort or a remembrance event. OCC-guarded on the award's version."
    roles: [ProgramDirector]
    code: 201
    input: [grant_award_id, category, expected_grant_award_version, "cohort_id?", "event_id?"]
    output: FundingAllocation
    side_effects:
      - "Created COMMITTED with provisional_cents from calculations.funding_allocation_amount variant provisional_projected and basis PROJECTED_ENROLLMENT or EVENT_PLAN"
      - "GrantAward.committed_cents += provisional_cents and available_cents recomputed"
      - "Increments GrantAward.version by 1"

  - method: GET
    path: "/bereavement/funding-allocations/{id}"
    description: "Reads one funding allocation."
    roles: [ProgramDirector, GrantOfficer]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []

  - method: GET
    path: "/bereavement/funding-allocations"
    description: "Lists funding allocations, optionally filtered by award, funded cohort, funded event or status."
    roles: [ProgramDirector, GrantOfficer]
    code: 200
    input: ["grant_award_id?", "cohort_id?", "event_id?", "status?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []

  - method: POST
    path: "/bereavement/funding-allocations/{id}/release"
    description: "Releases a committed allocation back to the award."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: ["COMMITTED -> RELEASED with settled_cents left null", "GrantAward.committed_cents -= provisional_cents and available_cents recomputed", "Increments GrantAward.version by 1"]

  - method: POST
    path: "/bereavement/grant-reports"
    description: "Opens a reporting window over one award and computes its totals."
    roles: [ProgramDirector]
    code: 201
    input: [grant_award_id, period_start, period_end]
    output: GrantReport
    side_effects: ["Created DRAFT with line_count, direct_total_cents, indirect_total_cents, reported_total_cents and participants_served from calculations.grant_report_totals"]

  - method: GET
    path: "/bereavement/grant-reports/{id}"
    description: "Reads one grant report."
    roles: [ProgramDirector, GrantOfficer]
    code: 200
    input: []
    output: GrantReport
    side_effects: []

  - method: GET
    path: "/bereavement/grant-reports"
    description: "Lists grant reports, optionally filtered by award or status."
    roles: [ProgramDirector, GrantOfficer]
    code: 200
    input: ["grant_award_id?", "status?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []

  - method: POST
    path: "/bereavement/grant-reports/{id}/submit"
    description: "Submits a draft report to the funder, recomputing all totals and stamping the submitting operator."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: GrantReport
    side_effects: ["DRAFT -> SUBMITTED", "Recomputes all totals per calculations.grant_report_totals", "Sets submitted_by_user_id to the acting X-User-ID and submitted_at to the logical clock"]

  - method: POST
    path: "/bereavement/grant-reports/{id}/return"
    description: "The funder returns a submitted report for revision."
    roles: [GrantOfficer]
    code: 200
    input: [return_reason]
    output: GrantReport
    side_effects: ["SUBMITTED -> RETURNED with revision_index +1"]

  - method: POST
    path: "/bereavement/grant-reports/{id}/revise"
    description: "Reopens a returned report for editing."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: GrantReport
    side_effects: ["RETURNED -> DRAFT", "Clears submitted_by_user_id and submitted_at", "Recomputes all totals"]

  - method: POST
    path: "/bereavement/grant-reports/{id}/accept"
    description: "The funder accepts a submitted report. Segregation of duties: the accepting operator must not be the operator who submitted it."
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantReport
    side_effects: ["SUBMITTED -> ACCEPTED"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  # --- auth / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acted on a resource whose owning id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A GrantOfficer tried to accept a report whose submitted_by_user_id equals their own X-User-ID."

  # --- existence ---
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No Referral with the given id."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant with the given id, in the path or in a request body."
  - id: ERR_SPACE_NOT_FOUND
    http: 404
    condition: "No MeetingSpace with the given id."
  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "No Cohort with the given id, in the path or in a request body."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No Enrollment with the given id."
  - id: ERR_COUNSELOR_NOT_FOUND
    http: 404
    condition: "No Counselor with the given id, in the path or in a request body."
  - id: ERR_COUNSELING_REFERRAL_NOT_FOUND
    http: 404
    condition: "No CounselingReferral with the given id."
  - id: ERR_COMPANION_NOT_FOUND
    http: 404
    condition: "No VolunteerCompanion with the given id, in the path or in a request body."
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "No CompanionMatch with the given id."
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No RemembranceEvent with the given id, in the path or in a request body."
  - id: ERR_INVITATION_NOT_FOUND
    http: 404
    condition: "No Invitation with the given id."
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "No GrantAward with the given id, in the path or in a request body."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No FundingAllocation with the given id."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No GrantReport with the given id."
  - id: ERR_OUTREACH_NOT_FOUND
    http: 404
    condition: "No AnniversaryOutreach with the given id."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum member, out-of-range integer, wrong type, or a violated conditional shape rule (source_org_name vs source_type, allocation subject vs category, cohort weekday vs series_start_date, min_viable_enrollment vs seats_total)."

  # --- optimistic concurrency ---
  - id: ERR_STALE_COHORT_VERSION
    http: 412
    condition: "expected_cohort_version on POST /bereavement/enrollments does not equal the Cohort's current version."
  - id: ERR_STALE_COUNSELOR_VERSION
    http: 412
    condition: "expected_counselor_version on the assign endpoint does not equal the Counselor's current version."
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_grant_award_version on POST /bereavement/funding-allocations does not equal the GrantAward's current version."

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state and no more specific state error applies."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "A transition was requested out of a state listed in that entity's terminal_states."
  - id: ERR_REFERRAL_NOT_SCREENED
    http: 409
    condition: "Accept was called on a Referral whose status is not SCREENED."
  - id: ERR_COHORT_NOT_ENROLLING
    http: 409
    condition: "An enrollment create or confirm targeted a Cohort not in OPEN_ENROLLMENT."
  - id: ERR_COUNSELOR_NOT_ACTIVE
    http: 409
    condition: "Assign named a Counselor whose status is not ACTIVE."
  - id: ERR_COMPANION_NOT_CERTIFIED
    http: 409
    condition: "A companion match was proposed for, or accepted by, a VolunteerCompanion whose status is not CERTIFIED."
  - id: ERR_EVENT_NOT_CONFIRMED
    http: 409
    condition: "An invitation send targeted an Invitation whose RemembranceEvent is not CONFIRMED."
  - id: ERR_GRANT_CLOSED
    http: 409
    condition: "A funding allocation or grant report write targeted a GrantAward whose status is CLOSED."
  - id: ERR_COHORT_NOT_FUNDABLE
    http: 409
    condition: "A GROUP_PROGRAM allocation targeted a Cohort whose status is not OPEN_ENROLLMENT, RUNNING or SUSPENDED."
  - id: ERR_EVENT_NOT_FUNDABLE
    http: 409
    condition: "A REMEMBRANCE_EVENT allocation targeted a RemembranceEvent whose status is not PLANNED or CONFIRMED."
  - id: ERR_PARTICIPANT_WITHDRAWN
    http: 409
    condition: "A participant-scoped write was attempted after the Participant's service_status became WITHDRAWN."
  - id: ERR_OUTREACH_NOT_DUE
    http: 409
    condition: "Send was called on an AnniversaryOutreach whose status is not DUE."

  # --- business safety ---
  - id: ERR_ASSESSMENT_REQUIRED
    http: 422
    condition: "Enrollment creation for a Participant with no NEEDS Assessment on file."
  - id: ERR_SUICIDALITY_REQUIRES_COUNSELING
    http: 422
    condition: "Enrollment creation for a Participant whose most recent NEEDS Assessment has suicidality_flag true and who has no CounselingReferral in WAITLISTED or ASSIGNED."
  - id: ERR_COMPANION_TRAINING_INSUFFICIENT
    http: 422
    condition: "A companion match was proposed for a Participant with risk_tier HIGH to a volunteer whose training_hours is below 24."

  # --- business referential ---
  - id: ERR_LOSS_TYPE_MISMATCH
    http: 422
    condition: "Enrollment creation where Cohort.loss_type differs from Participant.loss_type."
  - id: ERR_SPECIALTY_MISMATCH
    http: 422
    condition: "Assign where CounselingReferral.required_specialty is not in Counselor.specialties."
  - id: ERR_LOSS_TYPE_NOT_ENDORSED
    http: 422
    condition: "Companion match creation where Participant.loss_type is not in VolunteerCompanion.endorsed_loss_types."
  - id: ERR_CATEGORY_NOT_ALLOWED
    http: 422
    condition: "Allocation category is not a member of GrantAward.allowed_categories."
  - id: ERR_ALLOCATION_SUBJECT_MISMATCH
    http: 422
    condition: "Allocation category GROUP_PROGRAM without cohort_id, REMEMBRANCE_EVENT without event_id, or a subject id supplied that does not match the category."

  # --- business temporal ---
  - id: ERR_SPACE_TIME_CONFLICT
    http: 409
    condition: "The proposed cohort series or event slot collides with an existing occupation of the same MeetingSpace under closed-interval arithmetic expanded by turnover_buffer_minutes."
  - id: ERR_EVENT_DATE_IN_PAST
    http: 422
    condition: "RemembranceEvent.event_date is earlier than the logical clock date."
  - id: ERR_DECEASED_DATE_IN_FUTURE
    http: 422
    condition: "Referral.date_of_death is later than the logical clock date."
  - id: ERR_OUTSIDE_GRANT_PERIOD
    http: 422
    condition: "The allocation's effective date falls outside the award's inclusive [period_start, period_end] window."
  - id: ERR_RSVP_WINDOW_CLOSED
    http: 409
    condition: "An invitation send or respond happened after Invitation.rsvp_deadline."

  # --- business constraint ---
  - id: ERR_COHORT_FULL
    http: 409
    condition: "Enrollment creation when Cohort.seats_open is 0."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "A live or completed Enrollment already exists for the same participant and cohort."
  - id: ERR_COUNSELOR_CASELOAD_EXCEEDED
    http: 409
    condition: "Assign would push Counselor.active_caseload above caseload_cap."
  - id: ERR_COUNSELOR_CAPACITY_EXCEEDED
    http: 409
    condition: "Assign would push Counselor.committed_minutes strictly above weekly_capacity_minutes."
  - id: ERR_MATCH_LIMIT_REACHED
    http: 409
    condition: "Accepting a match would push VolunteerCompanion.active_match_count above max_concurrent_matches."
  - id: ERR_DUPLICATE_MATCH
    http: 409
    condition: "A CompanionMatch in PROPOSED or ACTIVE already exists for the same companion and participant."
  - id: ERR_SPACE_CAPACITY_EXCEEDED
    http: 422
    condition: "Cohort.seats_total or RemembranceEvent.expected_attendance exceeds MeetingSpace.capacity."
  - id: ERR_DUPLICATE_AWARD_REFERENCE
    http: 409
    condition: "award_reference already exists on another GrantAward."
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "A GrantReport in DRAFT, SUBMITTED or RETURNED already covers an overlapping window on the same award."
  - id: ERR_MIN_VIABLE_NOT_MET
    http: 409
    condition: "Resume was called on a SUSPENDED cohort whose seats_filled is below min_viable_enrollment."
  - id: ERR_DUPLICATE_REFERRAL
    http: 409
    condition: "A Referral in RECEIVED, SCREENED or ACCEPTED already exists with the same contact_email and date_of_death."
  - id: ERR_ASSESSMENT_SEQUENCE_INVALID
    http: 422
    condition: "A MIDPOINT or EXIT Assessment was recorded before any BASELINE Assessment exists for that Participant."
  - id: ERR_NO_BASELINE_ASSESSMENT
    http: 422
    condition: "The outcome summary was requested for a Participant with no BASELINE Assessment."

  # --- business fiscal ---
  - id: ERR_GRANT_FUNDS_INSUFFICIENT
    http: 409
    condition: "GrantAward.available_cents is strictly less than the provisional_cents about to be committed."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ProgramDirector
    description: "Runs the bereavement programme: spaces, cohorts, counselors, volunteers, events, grant money and the ops run."
    identity: "opaque"
    exclusive_operations:
      - "POST /bereavement/_clock/set_current_utc"
      - "POST /bereavement/_ops/cadence-run"
      - "POST /bereavement/meeting-spaces"
      - "POST /bereavement/cohorts"
      - "POST /bereavement/cohorts/{id}/open-enrollment"
      - "POST /bereavement/cohorts/{id}/launch"
      - "POST /bereavement/cohorts/{id}/suspend"
      - "POST /bereavement/cohorts/{id}/resume"
      - "POST /bereavement/cohorts/{id}/complete"
      - "POST /bereavement/cohorts/{id}/cancel"
      - "POST /bereavement/counselors"
      - "POST /bereavement/counselors/{id}/deactivate"
      - "POST /bereavement/volunteer-companions"
      - "POST /bereavement/volunteer-companions/{id}/suspend"
      - "POST /bereavement/volunteer-companions/{id}/reinstate"
      - "POST /bereavement/remembrance-events"
      - "POST /bereavement/remembrance-events/{id}/confirm"
      - "POST /bereavement/remembrance-events/{id}/cancel"
      - "POST /bereavement/remembrance-events/{id}/mark-held"
      - "POST /bereavement/grant-awards"
      - "POST /bereavement/grant-awards/{id}/close"
      - "POST /bereavement/meeting-spaces/{id}/status"
      - "POST /bereavement/funding-allocations"
      - "POST /bereavement/funding-allocations/{id}/release"
      - "POST /bereavement/grant-reports"
      - "POST /bereavement/grant-reports/{id}/submit"
      - "POST /bereavement/grant-reports/{id}/revise"
    shared_operations:
      - "GET /bereavement/referrals, GET /bereavement/referrals/{id}"
      - "GET /bereavement/participants, GET /bereavement/participants/{id}, GET /bereavement/participants/{id}/assessments, GET /bereavement/participants/{id}/outcome-summary, GET /bereavement/participants/{id}/anniversary-outreaches"
      - "GET /bereavement/meeting-spaces/{id}, GET /bereavement/cohorts, GET /bereavement/cohorts/{id}"
      - "GET /bereavement/enrollments, GET /bereavement/enrollments/{id}"
      - "GET /bereavement/counselors/{id}, GET /bereavement/counseling-referrals, GET /bereavement/counseling-referrals/{id}"
      - "GET /bereavement/volunteer-companions/{id}, GET /bereavement/companion-matches, GET /bereavement/companion-matches/{id}"
      - "GET /bereavement/remembrance-events, GET /bereavement/remembrance-events/{id}, GET /bereavement/invitations, GET /bereavement/invitations/{id}"
      - "GET /bereavement/grant-awards/{id}, GET /bereavement/funding-allocations, GET /bereavement/funding-allocations/{id}, GET /bereavement/grant-reports, GET /bereavement/grant-reports/{id}"
      - "POST /bereavement/volunteer-companions/{id}/training-records"

  - name: IntakeCoordinator
    description: "Front door of the programme: screens and accepts referrals, records assessments, works the group and counselling queues, drafts invitations and drives outreach."
    identity: "opaque"
    exclusive_operations:
      - "POST /bereavement/referrals/{id}/screen"
      - "POST /bereavement/referrals/{id}/accept"
      - "POST /bereavement/referrals/{id}/decline"
      - "POST /bereavement/enrollments"
      - "POST /bereavement/enrollments/{id}/attendance"
      - "POST /bereavement/counseling-referrals/{id}/assign"
      - "POST /bereavement/companion-matches"
      - "POST /bereavement/invitations"
      - "POST /bereavement/invitations/{id}/send"
    shared_operations:
      - "POST /bereavement/referrals"
      - "POST /bereavement/participants/{id}/assessments"
      - "POST /bereavement/participants/{id}/withdraw"
      - "POST /bereavement/participants/{id}/outreach-hold"
      - "POST /bereavement/anniversary-outreaches/{id}/send"
      - "POST /bereavement/anniversary-outreaches/{id}/acknowledge"
      - "POST /bereavement/enrollments/{id}/confirm"
      - "POST /bereavement/enrollments/{id}/withdraw"
      - "POST /bereavement/counseling-referrals"
      - "POST /bereavement/counseling-referrals/{id}/close"
      - "POST /bereavement/companion-matches/{id}/end"
      - "POST /bereavement/invitations/{id}/respond"
      - "All GET endpoints except the grant-money reads (grant-awards, funding-allocations, grant-reports)"

  - name: ReferralSource
    description: "Hospice team, funeral home partner, or a self-referring bereaved person filing an intake record."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /bereavement/referrals"

  - name: Counselor
    description: "Licensed individual-counselling provider. Acts only on their own assigned referrals and on the clinical assessment record."
    identity: "entity_backed:Counselor"
    exclusive_operations: []
    shared_operations:
      - "POST /bereavement/participants/{id}/assessments"
      - "POST /bereavement/counseling-referrals"
      - "POST /bereavement/counseling-referrals/{id}/close (only when CounselingReferral.counselor_id == X-User-ID)"
      - "GET /bereavement/participants/{id}, GET /bereavement/participants/{id}/assessments, GET /bereavement/participants/{id}/outcome-summary"
      - "GET /bereavement/counselors/{id}, GET /bereavement/counseling-referrals, GET /bereavement/counseling-referrals/{id}"

  - name: VolunteerCompanion
    description: "Trained lay companion. Records their own training, answers and ends their own matches, and carries out outreach for participants they accompany."
    identity: "entity_backed:VolunteerCompanion"
    exclusive_operations:
      - "POST /bereavement/companion-matches/{id}/respond (only when CompanionMatch.companion_id == X-User-ID)"
    shared_operations:
      - "POST /bereavement/volunteer-companions/{id}/training-records (only when the path id == X-User-ID)"
      - "POST /bereavement/companion-matches/{id}/end (only when CompanionMatch.companion_id == X-User-ID)"
      - "POST /bereavement/anniversary-outreaches/{id}/send, POST /bereavement/anniversary-outreaches/{id}/acknowledge (only for participants they have an ACTIVE CompanionMatch with)"
      - "GET /bereavement/volunteer-companions/{id}, GET /bereavement/companion-matches, GET /bereavement/companion-matches/{id}, GET /bereavement/participants/{id}/anniversary-outreaches"

  - name: Participant
    description: "The bereaved person receiving services. Acts only on their own enrollments, invitations and outreach preferences."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /bereavement/participants/{id}/withdraw (only when the path id == X-User-ID)"
      - "POST /bereavement/participants/{id}/outreach-hold (only when the path id == X-User-ID)"
      - "POST /bereavement/enrollments/{id}/confirm, POST /bereavement/enrollments/{id}/withdraw (only when Enrollment.participant_id == X-User-ID)"
      - "POST /bereavement/invitations/{id}/respond (only when Invitation.participant_id == X-User-ID)"
      - "GET /bereavement/participants/{id}, GET /bereavement/enrollments/{id}, GET /bereavement/invitations/{id} (own rows only)"

  - name: GrantOfficer
    description: "Funder-side reviewer. Reads the money surface and rules on submitted reports, but never writes programme data."
    identity: "opaque"
    exclusive_operations:
      - "POST /bereavement/grant-reports/{id}/return"
      - "POST /bereavement/grant-reports/{id}/accept"
