              payload: {}
              as: BoardTreasurer
          assert:
            - "P3's frontage_share_units is 10: 40 feet * 0.25 for UNDEVELOPED, and the roll's total_share_units is 540"
            - "the certified roll reads total_levied_cents 210000 and unallocated_residual_cents negative-10000, a negative residual the schema explicitly allows"
            - "the three PENDING charges are 80000 for P1 (capped down from 107407.41), 80000 for P2 (capped down from 88888.89) and 50000 for P3 (floored up from 3703.70)"
            - "no charge is 107407, 88889 or 3704: every parcel is clamped, so no raw share survives"
            - "no charge is below 50000 and none is above 80000, and the three amounts sum to 210000 which exceeds the 200000 budget_requirement_cents"
            - "the levy leaves reserve_contribution_cents 30000 == round_half_up(200000 * 0.15), computed from budget_requirement_cents and not from the over-collected total_levied_cents"
            - "the association reads reserve_balance_cents 30000 with reserve_posture UNDERFUNDED (30000*100 < 1000000*60)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: connection_approval_depends_on_parent_member_and_roll_states
        grounds:
          - "state_machines.ConnectionRequest.SUBMITTED_to_APPROVED"
          - "entities.Member.fields.standing_status"
          - "entities.AssessmentRoll.fields.status"
          - "calculations.connection_fee"
          - "endpoints[POST /connection-requests/{request_id}/decide]"
        distinguishing_aspect: >
          Approving a ConnectionRequest is gated on the states of two entities the
          request never references: the Member sitting on the SUBDIVIDED parent
          parcel must have left PENDING_DEED_VERIFICATION, and the association
          must own at least one AssessmentRoll in status LEVIED. Nothing about
          the request or the lot changes between the two rejections and the
          success — only a deed verification on a different entity and a levy on
          a third — so an implementation that validates only the request and its
          parcel approves on the first call. The success path then proves the
          dependency is a real read and not a mere existence check: the fee's
          reserve component is computed from the *levied* reserve balance
          (deficit 850000) and the resulting charge is billed to the parent's
          member on that specific roll.
        test_recipe:
          setup: |
            Create an association with reserve_target 1000000 on one segment.
            Add P1 (290 ft RESIDENTIAL_YEAR_ROUND) with member m1 whose deed is
            NOT yet verified, and P2 (400 ft SEASONAL, 240 units) with member m2
            verified so a roll can later be certified. Subdivide P1 into two
            145-foot lots while it is still charge-free and no roll is CERTIFIED;
            each lot starts PENDING_CONNECTION, UNDEVELOPED, 0 trips. File a
            connection request for lot A asking for RESIDENTIAL_YEAR_ROUND and 4
            trips per day with the easement recorded. At this point m1 is
            PENDING_DEED_VERIFICATION and the association has no roll at all.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Birch Landing Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Birch Landing Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB150-P01", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB150-P02", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB150-P01", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Bo Nakamura", deed_book_page: "DB150-P02", deed_recorded_date: "2020-06-03" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members/${m2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P02" }
              as: AssociationSecretary
            - call: "POST /parcels/${p1_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB150-P01A", frontage_feet: 145 }, { deed_book_page: "DB150-P01B", frontage_feet: 145 } ] }
              as: AssociationSecretary
              captures: { lot_a_id: "$.data.children[0].id" }
            - call: "POST /connection-requests"
              payload: { parcel_id: "${lot_a_id}", requested_usage_class: "RESIDENTIAL_YEAR_ROUND", requested_trips_per_day: 4, easement_grant_recorded: true }
              as: AssociationSecretary
              captures: { req_id: "$.data.id" }
          trigger:
            - call: "POST /connection-requests/${req_id}/decide"
              payload: { outcome: "APPROVED" }
              as: AssociationSecretary
              captures: { member_state_error: "$.data.error_id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB150-P01" }
              as: AssociationSecretary
            - call: "POST /connection-requests/${req_id}/decide"
              payload: { outcome: "APPROVED" }
              as: AssociationSecretary
              captures: { roll_state_error: "$.data.error_id" }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 1000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "POST /connection-requests/${req_id}/decide"
              payload: { outcome: "APPROVED" }
              as: AssociationSecretary
            - call: "GET /assessment-charges?parcel_id=${lot_a_id}"
              payload: {}
              as: AssessmentClerk
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: BoardTreasurer
          assert:
            - "the first decide returns HTTP 409 with error_id ERR_PARENT_MEMBER_NOT_FOUND while m1 is still PENDING_DEED_VERIFICATION, and the request stays SUBMITTED with connection_fee_cents 0"
            - "the second decide, after m1 becomes GOOD_STANDING with nothing else changed, returns HTTP 409 with error_id ERR_ROLL_NOT_FOUND: the missing LEVIED roll is a state of a third entity"
            - "the certified roll assesses only P2: total_share_units 240, total_levied_cents 400000 (the 400000 cap on a 1000000 budget) and unallocated_residual_cents 600000, and the levy credits 150000 to the reserve"
            - "the third decide succeeds (HTTP 200) with status APPROVED and decided_at 2026-10-01T00:00:00Z"
            - "connection_fee_cents is 868547 == 250000 base + 271875 frontage (145 * 1875) + 166932 trips (4 * 41733) + 179740 reserve buy-in"
            - "reserve_buyin_cents is 179740 == round_half_up(0.35 * 850000 * 145 / 240), so the deficit came from the post-levy balance of 150000 and U_now is 240 (the SUBDIVIDED parent and the connecting lot are both excluded)"
            - "lot A is now ACTIVE with covenant_recorded true, usage_class RESIDENTIAL_YEAR_ROUND, trips_per_day 4 and frontage_share_units 145"
            - "exactly one charge exists on lot A: charge_type CONNECTION_FEE, amount_cents 868547, member_id m1 (the parent parcel's member, not m2), roll_id the FY2027 roll, status OPEN, due_date 2026-11-15"
            - "the association reads reserve_balance_cents 329740 (150000 + 179740) with reserve_posture UNDERFUNDED"

      - name: subdivision_gate_tracks_every_blocking_charge_state
        grounds:
          - "validations[priority=52]"
          - "state_machines.AssessmentCharge.OPEN_to_DELINQUENT"
          - "state_machines.AssessmentCharge.DELINQUENT_to_LIEN_ENCUMBERED"
          - "state_machines.Parcel.ACTIVE_to_SUBDIVIDED"
        distinguishing_aspect: >
          Whether a Parcel may subdivide is decided entirely by the status of a
          different entity — its AssessmentCharge — and the gate names three
          blocking states, not one. The same subdivide request is rejected while
          the charge is OPEN, again after a NOTICE drives it to DELINQUENT, and
          again after a LIEN_FILING drives it to LIEN_ENCUMBERED, then succeeds
          the moment a full payment moves it to PAID. An implementation that
          checks only for OPEN charges (the common reading of "no outstanding
          charges") passes the first rejection and wrongly permits subdivision
          in the DELINQUENT and LIEN_ENCUMBERED states, which is exactly when the
          association most needs the parcel intact.
        test_recipe:
          setup: |
            Build SINGLE_4M: one 290 ft RESIDENTIAL_YEAR_ROUND parcel whose
            member is verified, and an FY2027 FRONTAGE_WEIGHTED roll for 4000000
            certified and levied, producing a single OPEN charge of 1600000 (the
            cap) with due_date 2026-11-15. The roll is LEVIED, not CERTIFIED, so
            priority 14's certified-roll lock is not what blocks anything here.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_id: "$.data[0].id" }
          trigger:
            - call: "POST /parcels/${p1_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB120-P41A", frontage_feet: 145 }, { deed_book_page: "DB120-P41B", frontage_feet: 145 } ] }
              as: AssociationSecretary
              captures: { open_error: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "NOTICE" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { notice_id: "$.data.id" }
            - call: "POST /parcels/${p1_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB120-P41A", frontage_feet: 145 }, { deed_book_page: "DB120-P41B", frontage_feet: 145 } ] }
              as: AssociationSecretary
              captures: { delinquent_error: "$.data.error_id" }
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "LIEN_FILING" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { lien_id: "$.data.id" }
            - call: "POST /delinquency-actions/${lien_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "POST /parcels/${p1_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB120-P41A", frontage_feet: 145 }, { deed_book_page: "DB120-P41B", frontage_feet: 145 } ] }
              as: AssociationSecretary
              captures: { encumbered_error: "$.data.error_id" }
            - call: "POST /assessment-charges/${charge_id}/payments"
              payload: { amount_cents: 1600000 }
              as: AssessmentClerk
            - call: "POST /parcels/${p1_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB120-P41A", frontage_feet: 145 }, { deed_book_page: "DB120-P41B", frontage_feet: 145 } ] }
              as: AssociationSecretary
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: AssociationSecretary
          assert:
            - "attempt 1, charge OPEN: HTTP 409 with error_id ERR_PARCEL_HAS_OPEN_CHARGES"
            - "attempt 2, charge DELINQUENT after the NOTICE initiation: HTTP 409 with error_id ERR_PARCEL_HAS_OPEN_CHARGES, not a success"
            - "attempt 3, charge LIEN_ENCUMBERED after the LIEN_FILING effectuation: HTTP 409 with error_id ERR_PARCEL_HAS_OPEN_CHARGES"
            - "no child parcel exists after the three rejections and P1's status is still ACTIVE with its version unchanged from the levy"
            - "the 1600000 payment moves the charge to PAID with balance_cents 0 and releases both delinquency actions to RELEASED"
            - "attempt 4 succeeds (HTTP 200) and returns parent_parcel status SUBDIVIDED plus exactly 2 children in request order: DB120-P41A then DB120-P41B, each 145 feet, status PENDING_CONNECTION, covenant_recorded false, usage_class UNDEVELOPED, trips_per_day 0"
            - "the re-read parent reads status SUBDIVIDED with version exactly 1 greater than its value before attempt 4"
            - "the member is back to standing_status GOOD_STANDING with encumbered_principal_cents 0, which is what let the gate open"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: work_windows_touch_legally_overlap_illegally_and_respect_the_paving_cure_buffer
        grounds:
          - "validations[priority=44]"
          - "validations[priority=45]"
          - "endpoints[POST /maintenance-projects]"
          - "entities.MaintenanceProject.fields.window_start_date"
        distinguishing_aspect: >
          The road segment is the contended resource and its windows are
          half-open, so [11-01,11-10) and [11-10,11-15) may both hold while
          [11-09,11-12) may not, and a window starting exactly on a predecessor's
          exclusive end date is legal. Two further twists are layered on: a
          CANCELLED project stops reserving its window (a window identical to a
          cancelled one is accepted), and a completed PAVING project keeps
          reserving three extra cure days measured from its exclusive end, so a
          start on 11-22 is rejected while 11-23 is accepted even though the
          paving project itself is COMPLETE and therefore invisible to the
          intersection rule. Inclusive/exclusive or "still active" mistakes each
          flip exactly one of the six outcomes.
        test_recipe:
          setup: |
            Build SINGLE_4M with a COMPLIANT segment and a levied FY2027 roll, so
            the reserve holds 600000 and a PAVING award is affordable. The clock
            starts at 2026-10-01. All projects are opened by rc-user-1 so a
            different RoadCommissioner user (rc-user-2) can award.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
          trigger:
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-11-01", window_end_date: "2026-11-10" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_a: "$.data.id" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "SNOW", window_start_date: "2026-11-10", window_end_date: "2026-11-15" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_b: "$.data.id" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "DUST", window_start_date: "2026-11-09", window_end_date: "2026-11-12" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "DUST", window_start_date: "2026-11-15", window_end_date: "2026-11-16" }
              as: RoadCommissioner
              as_user_id: "rc-user-1"
              captures: { proj_d: "$.data.id" }
            - call: "POST /maintenance-projects/${proj_a}/cancel"
