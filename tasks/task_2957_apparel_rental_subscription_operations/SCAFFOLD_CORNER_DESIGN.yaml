            - "T-INSP-1 files a re-inspection from PROCESSING with soil_level NONE, damage_severity MODERATE and condition_grade_after B, which clears repair_completed_at, sets cleaning_required false and repair_required true, leaves repair_attempts at 2 and returns the job to PROCESSING"
