  - section: cross_cutting_complexity_layers
    instances:
      - name: estoppel_issuance_with_a_stale_lease_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.estoppel-create-stale-lease
          - endpoints.POST_/portfolio/estoppel-certificates
          - errors.ERR_STALE_LEASE_VERSION
        distinguishing_aspect: |
          The second declared concurrency rule, and the harder of the two, because issuance is legitimately
          repeatable: nothing in the certificate state machine stops a second issuance for the same lease
          and mortgage - the earlier certificate merely becomes SUPERSEDED - so the ONLY thing standing
          between a mortgagee and a certificate that attests superseded rent and arrears is the version
          guard. The instance also closes the loop the guide asks for: because issuance itself increments
          Lease.version, the very version that just succeeded is stale one call later, so a client that
          replays its request body is refused rather than served a duplicate.
        test_recipe:
          setup:
            - "A lease, a recorded financing, and two intervening writes (an endorsement and a rent charge) so the version the client first saw is genuinely behind."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-126", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 20, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id, stale_version: $.data.version }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Leasehold Capital LLC", notice_email: "servicing@keystone.example", original_principal_cents: 30000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { mortgage_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/insurance-endorsements"
              payload: { property_all_risk_limit_cents: 80000000, builders_risk_limit_cents: 3000000, lessor_additional_insured: true, expires_at: "2027-08-01T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 3000000, memo: "Q3 2026 base rent" }
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { fresh_version: $.data.version }
          trigger:
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${mortgage_id}", expected_lease_version: "${stale_version}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${mortgage_id}", expected_lease_version: "${fresh_version}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${mortgage_id}", expected_lease_version: "${fresh_version}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
          assert:
            - "the recorded mortgage did not touch the lease, but the endorsement and the rent charge each incremented it, so ${stale_version} is 1 and ${fresh_version} is 3"
            - "trigger[0] returns ERR_STALE_LEASE_VERSION (412) - the certificate would have attested arrears of 0 against a lease now 3000000 in arrears"
            - "after trigger[0] GET /portfolio/estoppel-certificates?lease_id=${lease_id} reports total_count 0 - a refused OCC write leaves nothing behind"
            - "trigger[1] returns 201 with certified_annual_base_rent_cents 10000000, certified_arrears_cents 3000000, certified_rent_status BASE_ONLY and certified_lease_version 3"
            - "after trigger[1] GET /portfolio/leases/${lease_id} reports version 4 - issuance is itself a write on the lease"
            - "trigger[2], an exact replay of the request body that just succeeded, returns ERR_STALE_LEASE_VERSION (412), and GET /portfolio/estoppel-certificates?lease_id=${lease_id} still reports total_count 1 with that one certificate still ISSUED (not SUPERSEDED by a phantom successor)"

      - name: scheduled_insurance_lapse_skips_the_renewed_and_the_never_insured_lease
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers.scheduled_deferred_actions
          - endpoints.POST_/portfolio/administration-runs
          - calculations.cure_window_deadlines
        distinguishing_aspect: |
          The scheduled action here is not a stored row that can be cancelled - it is a standing condition
          re-evaluated at every sweep - so "cancellable before execution" means renewing the endorsement
          before the clock reaches the old expiry, and the interesting failure is the pair of leases the
          sweep must NOT touch: the renewed one (expiry moved out) and the never-insured one, whose
          insurance_expires_at is null and whose insurance_status has been LAPSED since creation. Phase 1
          keys on a non-null expiry at or before now, not on the status flag, so an implementation that
          scans for insurance_status == LAPSED serves a spurious notice on the never-insured lease. The
          tail then pins the cure-window comparison the other way: at exactly the deadline nothing lapses,
          one second later it does, and the already-defaulted lease is not served a second notice.
        test_recipe:
          setup:
            - "Three leases with a 20-year revaluation interval so phase 3 stays quiet: P and Q insured to 2026-09-01, R never insured."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
