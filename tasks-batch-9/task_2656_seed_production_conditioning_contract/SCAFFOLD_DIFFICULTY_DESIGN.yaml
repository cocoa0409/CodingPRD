  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: off_type_rate_exactly_at_tolerance_passes
        grounds:
          - calculations.inspection_outcome_determination
          - entities.Variety.fields.max_off_type_per_10000
          - entities.FieldInspection.fields.off_type_rate_per_10000
        distinguishing_aspect: |
          METRIC: off_type_rate_per_10000 measured against Variety.max_off_type_per_10000 == 10.0, on the
          endpoint POST /seed-ops/field-inspections. The comparison is strictly greater-than, so a rate that
          lands exactly on the tolerance PASSES; the smallest representable step above it (one extra off-type
          plant in 20000, which moves the rate by 0.05) flips the outcome. Two contracts are inspected in the
          same request pair so the only difference is the single plant.
        test_recipe:
          setup:
            - "Two signed 2026 CERTIFIED contracts for the same grower and variety on fields F-A and F-B"
            - "Variety tolerances: off-type 10.0 per 10000, restricted weed 5.0 per 10000, disease 2.0 pct"
            - "Logical clock at 2026-08-20T09:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
