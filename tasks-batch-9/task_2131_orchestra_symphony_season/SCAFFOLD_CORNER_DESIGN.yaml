              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 1, expected_concert_version: "${c1_v_old}" }
              as: BoxOfficeAgent
              captures: { o1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/ticket-orders"
              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 1, expected_concert_version: "${c1_v_old}" }
              as: BoxOfficeAgent
              captures: { err: "$.data.error_id" }
            - call: "GET /orchestra/concerts/${c1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { c1_v_new: "$.data.version" }
            - call: "POST /orchestra/ticket-orders"
              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 1, expected_concert_version: "${c1_v_new}" }
              as: BoxOfficeAgent
              captures: { o2: "$.data.id" }
          assert:
            - "${err} == ERR_STALE_CONCERT_VERSION"
            - "HTTP status of the stale hold == 412"
            - "${c1_v_new} == ${c1_v_old} + 1"
            - "TicketOrder.${o2}.status == HELD"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].held_count == 2  (only the two accepted holds)"
            - "GET /orchestra/ticket-orders?concert_id=${c1} returns total_count == 2"

      - name: occ_stale_package_version_on_second_renew_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-renew-stale-package]", "errors[ERR_STALE_PACKAGE_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "The first renewal advances the prior package's version, so a second renewal still carrying the pre-renewal version is rejected with ERR_STALE_PACKAGE_VERSION (412) and no duplicate seat claim is minted for season 2028."
        test_recipe:
          setup:
            - "Season 2027 in RENEWAL_WINDOW with an ACTIVE 1-seat BALCONY package"
            - "Season 2028 in RENEWAL_WINDOW with one PROGRAMMED concert at the same hall"
            - "The client has read the prior package once and holds that version"
