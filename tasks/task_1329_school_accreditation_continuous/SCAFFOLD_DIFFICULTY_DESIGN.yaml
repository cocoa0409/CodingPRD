  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: survey_threshold_exact_equality_passes
        grounds:
          - calculations.survey_participation_rate
          - state_machines.SurveyWindow.OPEN_to_CLOSED
        distinguishing_aspect: |
          Boundary on the participation metric: response_count*100 ==
          min_participation_pct*eligible_count exactly (2 responses of 4 at
          50%) MUST pass (>= semantics) and close as CLOSED, via the manual
          close endpoint.
        test_recipe:
          setup:
            - "Term SELF_STUDY; window eligible_count 4, min_participation_pct 50, exactly 2 responses"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Boundary County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "North", enrollment: 500 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-instruments"
              payload: { stakeholder_group: "STUDENTS", title: "Student Survey", min_participation_pct: 50 }
              as: AccreditationOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/survey-windows"
              payload: { campus_id: "${campus_id}", instrument_id: "${inst_id}", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-11-01T00:00:00Z", eligible_count: 4 }
              as: AccreditationOfficer
              captures: { w_id: $.data.id }
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-windows/${w_id}/responses"
              payload: { respondent_token: "tok-eq-01" }
              as: Anonymous
            - call: "POST /accreditation/survey-windows/${w_id}/responses"
              payload: { respondent_token: "tok-eq-02" }
              as: Anonymous
          trigger:
            - call: "POST /accreditation/survey-windows/${w_id}/close"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Window.${w_id}.status == CLOSED (200 >= 200; equality passes)"
            - "Window.${w_id}.response_count == 2"

      - name: evidence_quorum_zero_min_items_allows_finalize
        grounds:
          - state_machines.SelfStudyRating.SUBMITTED_to_FINALIZE
          - entities.Standard.fields.evidence_min_items
        distinguishing_aspect: |
          Boundary on the evidence-quorum metric: a standard with
          evidence_min_items == 0 (zero-quantity edge) allows finalize with zero
          APPROVED evidence items, via the finalize endpoint — different metric
          and endpoint from the survey threshold.
        test_recipe:
          setup:
            - "Standard L1 with evidence_min_items = 0"
