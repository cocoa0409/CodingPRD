            - { call: "GET /festival/editions/${ed}", payload: {}, as: TRAVEL_COORDINATOR, captures: { edv1: $.data.version } }
          trigger:
            - { call: "POST /festival/travel-packages/${pkg}/approve", payload: { expected_edition_version: "${edv1}" }, as: TRAVEL_COORDINATOR, captures: { alloc1: $.data.hotel_nights_allocated } }
            - { call: "GET /festival/editions/${ed}", payload: {}, as: TRAVEL_COORDINATOR, captures: { alloc_sum1: $.data.hotel_nights_allocated, rem1: $.data.hotel_nights_remaining } }
            - { call: "POST /festival/travel-packages/${pkg}/cancel", payload: {}, as: TRAVEL_COORDINATOR }
            - { call: "GET /festival/editions/${ed}", payload: {}, as: TRAVEL_COORDINATOR, captures: { alloc_sum2: $.data.hotel_nights_allocated, rem2: $.data.hotel_nights_remaining } }
          assert:
            - "after approve: hotel_nights_allocated == 6 and hotel_nights_remaining == 4 (6 + 4 == 10 == pool)"
            - "after compensating cancel: hotel_nights_allocated == 0 and hotel_nights_remaining == 10 (0 + 10 == 10 == pool)"
            - "TravelPackage.${pkg}.status == CANCELLED with hotel_nights_allocated reset to 0 — INV-HOTEL holds with zero drift"

      - name: travel_budget_conservation_with_penalty_sink
        grounds:
          - calculations.edition_aggregate_ledger
          - calculations.travel_stipend
          - state_machines.TravelPackage.BOOKED_to_CANCELLED  # via from-list [APPROVED, BOOKED] -> CANCELLED
          - entities.FestivalEdition.fields.travel_budget_remaining
        distinguishing_aspect: |
          Conserved quantity: budget cents (different quantity than hotel
          room-nights). INV-TRAVEL pins travel_budget_remaining +
          travel_committed_cents + travel_penalty_sink_cents ==
          travel_budget_cents; approve(50000) + mark-booked then cancel(BOOKED)
