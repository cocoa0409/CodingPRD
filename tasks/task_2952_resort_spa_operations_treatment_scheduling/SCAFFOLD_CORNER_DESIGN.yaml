        captures: { in1: $.data.id }
      - call: POST /intake-forms/${in1}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/submit
        payload: {}
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-3"
      trigger:
      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED", review_note: "self review attempt" }
        as: ComplianceOfficer
        as_user_id: "co-1"
        captures: { err_self_review: $.data.error_id }
      - call: GET /therapist-licenses/${lic}
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED", review_note: "independent review" }
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /intake-forms/${in1}/override
        payload: { override_reason: "screener overriding own decision" }
        as: SpaDirector
