# =============================================================================
# Task 1272 — Farm Commodity Hedging & Marketing Advisory (scaffold seed tables)
# =============================================================================

scenario: |
  1272. Farm Commodity Hedging & Marketing Advisory (commodity marketing advisor): production/expected-bushel baseline & risk profile, marketing plan with price targets & increments, futures/options position recommendation & margin planning, contract execution recording across buyers, crop-insurance interaction with sales, performance benchmarking vs market average, advisory fee & compliance disclosure, cash-flow & storage decision support

domain_name: farm-hedging-advisory
api_prefix: /advisory

# Difficulty target: beyond Expert band (user-requested). Difficulty is carried by
# dense cross-entity coupling (every action touches 2+ entities), two OCC-guarded
# write races, three dual-variant calculations, and pinned evaluation orders —
# not by surface volume.
complexity_profile:
  primary_archetype: quota_allocation        # finite expected-bushel pool competed for by contracts, hedges, insurance guarantee, storage
  secondary_archetype: compliance_audit      # disclosure acknowledgment gating, version-pinned approvals, segregation of duties
  complexity_layers:
    - optimistic_concurrency                 # OCC on MarketingPlan.version and GrowerOperation.version
    - dual_variant_calculation               # expected bushels (APH vs TREND), benchmark (YEAR vs HARVEST), fee (PER_BUSHEL vs FLAT)
    - cascading_side_effects                 # tick -> target -> recommendation -> plan; ticket confirm -> contract -> plan -> auto-close
    - rate_threshold_triggers                # coverage caps, margin maintenance thresholds, over-sold tripwire
  entity_topology: flat                      # all resources top-level under /advisory, joined by FK references in request bodies
  state_machine_shape: cyclic                # MarketingPlan ACTIVE<->SUSPENDED; MarginAccount FUNDED<->CALL_OUTSTANDING; SalesContract carries two independent state dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # SalesContract references GrowerOperation, MarketingPlan, Buyer; BrokeragePosition spans Recommendation + MarginAccount
  role_model: segregation_of_duties          # submitting advisor may not certify own agreement's compliance
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: GrowerOperation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Farm operation legal name" }
      - { name: primary_commodity, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT — single commodity per operation" }
      - { name: crop_year, type: integer, source: input, description: "Marketing crop year, e.g. 2026" }
      - { name: risk_profile, type: enum, source: input, description: "CONSERVATIVE | BALANCED | AGGRESSIVE — drives coverage cap and trend factor" }
      - { name: yield_method, type: enum, source: input, default: APH, description: "APH | TREND — selects which expected-bushels variant is operative" }
      - { name: over_sold_flag, type: boolean, source: computed, default: false, description: "True while undelivered committed contract bushels exceed effective marketable bushels after a settled insurance claim; blocks new sales contracts" }

  - name: ProductionBaseline
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; owning operation" }
      - { name: planted_acres, type: integer, source: input, description: "Planted acres for the operation crop year" }
      - { name: aph_yield_bushels, type: number, source: input, description: "Actual Production History yield per acre (2dp)" }
      - { name: trend_yield_bushels, type: number, source: input, description: "County trend yield per acre (2dp)" }
      - { name: expected_bushels_aph, type: integer, source: computed, description: "= floor(planted_acres * aph_yield_bushels)" }
      - { name: expected_bushels_trend, type: integer, source: computed, description: "= floor(planted_acres * trend_yield_bushels * RISK_TREND_FACTOR[risk_profile])" }
      - { name: expected_bushels, type: integer, source: computed, description: "Operative variant per GrowerOperation.yield_method: APH -> expected_bushels_aph, TREND -> expected_bushels_trend" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | CERTIFIED | SUPERSEDED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; insured operation" }
      - { name: baseline_id, type: string, source: input, description: "FK -> ProductionBaseline.id; must be CERTIFIED at bind time" }
      - { name: coverage_level_pct, type: number, source: input, description: "0.50..0.85 in 0.05 steps" }
      - { name: projected_price, type: number, source: input, description: "Projected price election (2dp)" }
      - { name: guarantee_bushels, type: integer, source: computed, description: "= floor(baseline.expected_bushels * coverage_level_pct) at bind time" }
      - { name: actual_harvested_bushels, type: integer, source: input, description: "Set on file-claim" }
      - { name: harvest_price, type: number, source: input, description: "Harvest price observed at claim (2dp); set on file-claim" }
      - { name: indemnity_dollars, type: number, source: computed, description: "= max(0, guarantee_bushels - actual_harvested_bushels) * max(projected_price, harvest_price), 2dp half-up" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOUND | CLAIM_SETTLED" }

  - name: MarketingPlan
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; owning operation" }
      - { name: baseline_id, type: string, source: input, description: "FK -> ProductionBaseline.id; must be CERTIFIED to activate" }
      - { name: max_priced_pct, type: number, source: input, description: "Plan-level coverage ceiling 0.05..1.00 (2dp); combined with risk-profile cap via min()" }
      - { name: expected_bushels_snapshot, type: integer, source: computed, description: "Frozen from baseline.expected_bushels at activation; later baseline supersedes do NOT mutate an ACTIVE plan" }
      - { name: committed_contract_bushels, type: integer, source: computed, description: "Sum of bushels over SalesContract with fulfillment_status in {OPEN, PARTIALLY_DELIVERED, DELIVERED} for this plan; CANCELLED and DEFAULTED release their (undelivered) commitment" }
      - { name: uncommitted_bushels, type: integer, source: computed, description: "= expected_bushels_snapshot - committed_contract_bushels" }
      - { name: hedged_bushels, type: integer, source: computed, description: "Sum of bushels over OPEN BrokeragePosition for this plan + ACCEPTED (not yet EXECUTED) HedgeRecommendation bushels" }
      - { name: priced_contract_bushels, type: integer, source: computed, description: "Sum of bushels over plan SalesContract with pricing_status = PRICED and fulfillment_status in {OPEN, PARTIALLY_DELIVERED, DELIVERED}" }
      - { name: coverage_cap_bushels, type: integer, source: computed, description: "= floor(expected_bushels_snapshot * min(max_priced_pct, RISK_COVERAGE_CAP[risk_profile]))" }
      - { name: pending_recommendation_count, type: integer, source: computed, description: "Count of HedgeRecommendation with status PROPOSED for this plan" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: PriceTarget
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> MarketingPlan.id; owning plan" }
      - { name: contract_month, type: string, source: input, description: "Futures month code YYYY-MM, e.g. 2026-12" }
      - { name: target_price, type: number, source: input, description: "Trigger price (2dp); fires when tick price >= target_price" }
      - { name: increment_bushels, type: integer, source: input, description: "Bushels to price when the target fires" }
      - { name: status, type: enum, source: system, description: "PENDING | TRIGGERED | FILLED | LAPSED | CANCELLED" }
      - { name: recommendation_id, type: string, source: system, description: "FK -> HedgeRecommendation.id; recommendation minted when this target triggered (null until triggered)" }

  - name: HedgeRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> MarketingPlan.id; plan advised" }
      - { name: price_target_id, type: string, source: system, description: "FK -> PriceTarget.id; originating target when auto-created by a trigger, null for advisor-authored recommendations" }
      - { name: instrument, type: enum, source: input, description: "FUTURES_SHORT | LONG_PUT" }
      - { name: contract_month, type: string, source: input, description: "Futures month code YYYY-MM" }
      - { name: bushels, type: integer, source: input, description: "Bushels to hedge (auto-created: min(target.increment_bushels, coverage headroom))" }
      - { name: strike_price, type: number, source: input, description: "Required iff instrument = LONG_PUT (2dp)" }
      - { name: premium_per_bushel, type: number, source: input, description: "Required iff instrument = LONG_PUT (2dp); debited from margin cash at execution" }
      - { name: rationale, type: string, source: input, description: "Free-text advisory rationale" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating advisor (segregation-of-duties reference)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | EXECUTED | EXPIRED" }

  - name: BrokeragePosition
    parent: null
    common_fields: true
    fields:
      - { name: recommendation_id, type: string, source: system, description: "FK -> HedgeRecommendation.id; position opened by executing this recommendation" }
      - { name: operation_id, type: string, source: system, description: "FK -> GrowerOperation.id; copied from plan at execution" }
      - { name: margin_account_id, type: string, source: system, description: "FK -> MarginAccount.id; the operation account charged at execution" }
      - { name: instrument, type: enum, source: system, description: "FUTURES_SHORT | LONG_PUT (copied from recommendation)" }
      - { name: contract_month, type: string, source: system, description: "Copied from recommendation" }
      - { name: bushels, type: integer, source: system, description: "Copied from recommendation" }
      - { name: entry_price, type: number, source: system, description: "Latest SETTLEMENT MarketTick price for (commodity, contract_month) at execution" }
      - { name: exit_price, type: number, source: system, description: "Latest SETTLEMENT tick price at offset/liquidation" }
      - { name: initial_margin_dollars, type: number, source: computed, description: "= bushels * IM_RATE[instrument]; LONG_PUT IM = bushels * (premium_per_bushel + 0.05)" }
      - { name: maintenance_margin_dollars, type: number, source: computed, description: "= bushels * MM_RATE[instrument]; LONG_PUT MM = initial_margin_dollars" }
      - { name: unrealized_pnl, type: number, source: computed, description: "FUTURES_SHORT: (entry - latest_settlement) * bushels; LONG_PUT: (max(0, strike - latest_settlement) - premium_per_bushel) * bushels; 2dp" }
      - { name: realized_pnl, type: number, source: computed, description: "Set at close: FUTURES_SHORT (entry - exit) * bushels; LONG_PUT (max(0, strike - exit) - premium_per_bushel) * bushels; 2dp" }
      - { name: status, type: enum, source: system, description: "OPEN | OFFSET | LIQUIDATED" }

  - name: MarginAccount
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; one account per operation (unique)" }
      - { name: cash_balance, type: number, source: computed, description: "Cumulative funding plus realized pnl minus option premiums; 2dp" }
      - { name: initial_margin_required, type: number, source: computed, description: "Sum of initial_margin_dollars over OPEN positions" }
      - { name: maintenance_margin_required, type: number, source: computed, description: "Sum of maintenance_margin_dollars over OPEN positions" }
      - { name: margin_equity, type: number, source: computed, description: "= cash_balance + sum(unrealized_pnl over OPEN positions); 2dp" }
      - { name: margin_call_amount, type: number, source: computed, description: "When status = CALL_OUTSTANDING: initial_margin_required - margin_equity at call issuance; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "FUNDED | CALL_OUTSTANDING | RESTRICTED" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer legal name" }
      - { name: buyer_type, type: enum, source: input, description: "ELEVATOR | PROCESSOR | EXPORTER | ETHANOL" }
      - { name: credit_rating, type: enum, source: input, description: "A | B | C" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | APPROVED | SUSPENDED" }

  - name: SalesContract
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; selling operation" }
      - { name: plan_id, type: string, source: input, description: "FK -> MarketingPlan.id; must be ACTIVE" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; must be APPROVED" }
      - { name: contract_type, type: enum, source: input, description: "FLAT_PRICE | HTA | BASIS — FLAT_PRICE is PRICED at creation; HTA and BASIS start UNPRICED" }
      - { name: bushels, type: integer, source: input, description: "Contracted bushels" }
      - { name: fixed_price, type: number, source: input, description: "Required iff contract_type = FLAT_PRICE (2dp); forbidden otherwise" }
      - { name: basis_level, type: number, source: input, description: "Required iff contract_type = BASIS (2dp, may be negative)" }
      - { name: contract_month, type: string, source: input, description: "Required iff contract_type = HTA — futures month the fixation references" }
      - { name: delivery_window_start, type: string, source: input, description: "ISO date; half-open window [start, end)" }
      - { name: delivery_window_end, type: string, source: input, description: "ISO date; exclusive end" }
      - { name: fixation_price, type: number, source: system, description: "Set by fix-price for HTA/BASIS (2dp)" }
      - { name: effective_price, type: number, source: computed, description: "FLAT_PRICE: fixed_price; HTA priced: fixation_price; BASIS priced: fixation_price + basis_level; null while UNPRICED" }
      - { name: delivered_bushels, type: integer, source: computed, description: "Sum of net_bushels over CONFIRMED (non-voided) DeliveryTicket" }
      - { name: settled_value_dollars, type: number, source: computed, description: "Sum over CONFIRMED tickets of round(net_bushels * effective_price, 2) — per-ticket rounding THEN sum (pinned order); 2dp" }
      - { name: default_penalty_dollars, type: number, source: computed, description: "On default of a PRICED contract: (bushels - delivered_bushels) * max(0, latest_settlement - effective_price), where latest_settlement is the SETTLEMENT MarketTick for the operation primary_commodity with greatest price_date (tie-break created_at ASC); 2dp" }
      - { name: pricing_status, type: enum, source: system, description: "UNPRICED | PRICED — independent of fulfillment_status" }
      - { name: fulfillment_status, type: enum, source: system, description: "OPEN | PARTIALLY_DELIVERED | DELIVERED | CANCELLED | DEFAULTED — independent of pricing_status" }

  - name: DeliveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SalesContract.id; contract delivered against" }
      - { name: delivery_date, type: string, source: input, description: "ISO date; must fall inside the contract delivery window [start, end) — boundary: delivery on start allowed, on end rejected" }
      - { name: gross_bushels, type: integer, source: input, description: "Scale-ticket gross bushels" }
      - { name: moisture_pct, type: number, source: input, description: "Grain moisture percent (1dp); shrink applies above 15.0" }
      - { name: shrink_pct, type: number, source: computed, description: "= max(0, moisture_pct - 15.0) * 0.012" }
      - { name: net_bushels, type: number, source: computed, description: "= round(gross_bushels * (1 - shrink_pct), 3)" }
      - { name: ticket_value_dollars, type: number, source: computed, description: "Set at confirm: round(net_bushels * contract.effective_price, 2)" }
      - { name: status, type: enum, source: system, description: "RECORDED | CONFIRMED | VOIDED" }

  - name: StorageLot
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; owning operation" }
      - { name: bin_id, type: string, source: input, description: "Storage bin identifier (elevator bin code)" }
      - { name: bushels, type: integer, source: input, description: "Bushels placed in storage" }
      - { name: start_date, type: string, source: input, description: "ISO date storage begins (inclusive)" }
      - { name: planned_end_date, type: string, source: input, description: "ISO date storage ends (inclusive)" }
      - { name: cost_per_bushel_month, type: number, source: input, description: "Storage charge per bushel per month (2dp)" }
      - { name: annual_interest_rate, type: number, source: input, description: "Opportunity-cost interest rate, e.g. 0.06" }
      - { name: actual_end_date, type: string, source: system, description: "Set at withdrawal" }
      - { name: status, type: enum, source: system, description: "STORED | WITHDRAWN" }

  - name: AdvisoryAgreement
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> GrowerOperation.id; client operation" }
      - { name: fee_type, type: enum, source: input, description: "PER_BUSHEL | FLAT_ANNUAL" }
      - { name: rate_per_bushel, type: number, source: input, description: "Required iff fee_type = PER_BUSHEL (2dp)" }
      - { name: flat_annual_fee, type: number, source: input, description: "Required iff fee_type = FLAT_ANNUAL (2dp)" }
      - { name: annual_cap_dollars, type: number, source: input, description: "Optional hard cap on a single fee statement total" }
      - { name: billable_bushels_accrued, type: integer, source: computed, description: "Cumulative net bushels on CONFIRMED (non-voided) tickets for this operation since agreement activation" }
      - { name: disclosure_status, type: enum, source: system, description: "NONE | REQUIRED | DELIVERED | ACKNOWLEDGED | STALE" }
      - { name: acknowledged_agreement_version, type: integer, source: system, description: "Agreement version pinned at acknowledgment; sign requires it to equal current version. Version discipline: only submit and PUT amendment increment version; deliver-disclosure, acknowledge-disclosure, sign, and certify-compliance do NOT increment version" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of advisor who submitted (segregation-of-duties reference)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of ComplianceOfficer who certified" }
      - { name: compliance_certified, type: boolean, source: system, default: false, description: "True after certify-compliance" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_SIGNATURE | ACTIVE | TERMINATED" }

  - name: MarketTick
    parent: null
    common_fields: false
    fields:
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT" }
      - { name: contract_month, type: string, source: input, description: "Futures month code YYYY-MM" }
      - { name: price, type: number, source: input, description: "Quoted/settled price per bushel (4dp)" }
      - { name: kind, type: enum, source: input, description: "QUOTE | SETTLEMENT — only SETTLEMENT marks positions and fixes entry/exit prices" }
      - { name: price_date, type: string, source: input, description: "ISO date the price is effective for" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionBaseline
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /advisory/production-baselines/{baselineId}/certify"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals baseline.operation_id"
          - "No other CERTIFIED baseline exists for the same operation (a prior CERTIFIED baseline must already be SUPERSEDED)"
        side_effects:
          - "Increments ProductionBaseline.version by 1"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system — when POST /advisory/production-baselines succeeds for the same operation"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded baseline excluded from all coverage, guarantee, and plan-activation calculations"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system — when POST /advisory/production-baselines succeeds for the same operation"
        actor: system
        preconditions: []
        side_effects:
          - "Plans already ACTIVE keep their expected_bushels_snapshot (frozen); DRAFT plans referencing this baseline can no longer activate"

  - entity: InsurancePolicy
    initial_state: QUOTED
    terminal_states: [CLAIM_SETTLED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /advisory/insurance-policies/{policyId}/bind"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals policy.operation_id"
          - "policy.baseline_id refers to a CERTIFIED ProductionBaseline (ERR_BASELINE_NOT_CERTIFIED)"
        side_effects:
          - "guarantee_bushels = floor(baseline.expected_bushels * coverage_level_pct) frozen at bind"
      - from: BOUND
        to: CLAIM_SETTLED
        trigger: "POST /advisory/insurance-policies/{policyId}/file-claim"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals policy.operation_id"
          - "actual_harvested_bushels >= 0; harvest_price > 0"
        side_effects:
          - "indemnity_dollars computed and frozen"
          - "If sum(bushels - delivered_bushels) over OPEN/PARTIALLY_DELIVERED SalesContract of the operation > actual_harvested_bushels: GrowerOperation.over_sold_flag = true"

  - entity: MarketingPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /advisory/marketing-plans/{planId}/activate"
        actor: CommodityAdvisor
        preconditions:
          - "plan.baseline_id is CERTIFIED (ERR_BASELINE_NOT_CERTIFIED)"
          - "An AdvisoryAgreement for plan.operation_id is ACTIVE (none active -> ERR_AGREEMENT_NOT_ACTIVE) with disclosure_status = ACKNOWLEDGED and acknowledged_agreement_version == that agreement's current version (ERR_DISCLOSURE_NOT_ACKNOWLEDGED / ERR_DISCLOSURE_STALE)"
        side_effects:
          - "expected_bushels_snapshot = baseline.expected_bushels (frozen)"
          - "coverage_cap_bushels computed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /advisory/marketing-plans/{planId}/suspend"
        actor: CommodityAdvisor | ComplianceOfficer
        preconditions: []
        side_effects:
          - "While SUSPENDED: price-target triggers are skipped, and sales-contract creation / recommendation acceptance are rejected with ERR_INVALID_STATE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /advisory/marketing-plans/{planId}/resume"
        actor: CommodityAdvisor
        preconditions:
          - "The governing AdvisoryAgreement is still ACTIVE with a current ACKNOWLEDGED disclosure (ERR_DISCLOSURE_STALE)"
        side_effects: []
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE is allowed without limit"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /advisory/marketing-plans/{planId}/close"
        actor: CommodityAdvisor
        preconditions:
          - "No OPEN/PARTIALLY_DELIVERED SalesContract and no OPEN BrokeragePosition for the plan"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /advisory/marketing-plans/{planId}/close"
        actor: CommodityAdvisor
        preconditions:
          - "No OPEN/PARTIALLY_DELIVERED SalesContract and no OPEN BrokeragePosition for the plan"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system — automatic when a DeliveryTicket confirmation leaves the plan with uncommitted_bushels == 0 AND every SalesContract DELIVERED"
        actor: system
        preconditions: []
        side_effects:
          - "All remaining PENDING PriceTarget for the plan -> CANCELLED"

  - entity: PriceTarget
    initial_state: PENDING
    terminal_states: [FILLED, LAPSED, CANCELLED]
    transitions:
      - from: PENDING
        to: TRIGGERED
        trigger: "system — POST /advisory/market-ticks processing: tick.kind in {QUOTE, SETTLEMENT}, tick.commodity == operation.primary_commodity, tick.contract_month == target.contract_month, tick.price >= target.target_price, plan ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "Eligible targets fire in order: target_price ASC, tie-break created_at ASC"
          - "Each fired target mints a HedgeRecommendation (PROPOSED) with bushels = min(increment_bushels, headroom), floored at 0; if headroom <= 0 the target goes LAPSED instead of TRIGGERED. headroom = coverage_cap_bushels - hedged_bushels - priced_contract_bushels - sum(bushels over PROPOSED HedgeRecommendations of the plan) — pending advice reserves capacity so one tick cannot mint past the cap"
          - "Sets recommendation_id on the target"
        note: "Cascade hop 1 of the tick chain (tick -> target -> recommendation -> plan counters)"
      - from: TRIGGERED
        to: FILLED
        trigger: "system — when the linked HedgeRecommendation reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRIGGERED
        to: LAPSED
        trigger: "system — when the linked HedgeRecommendation reaches REJECTED or EXPIRED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /advisory/price-targets/{targetId}/cancel"
        actor: CommodityAdvisor
        preconditions: []
        side_effects: []

  - entity: HedgeRecommendation
    initial_state: PROPOSED
    terminal_states: [REJECTED, EXECUTED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /advisory/hedge-recommendations/{recommendationId}/accept"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals the plan's operation_id"
          - "Plan status == ACTIVE (ERR_INVALID_STATE)"
          - "hedged_bushels + this.bushels + priced_contract_bushels <= coverage_cap_bushels (ERR_COVERAGE_CAP_EXCEEDED) — equality allowed"
          - "Operation over_sold_flag == false (ERR_OVER_SOLD_POSITION)"
        side_effects:
          - "Plan pending_recommendation_count -= 1; hedged_bushels recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /advisory/hedge-recommendations/{recommendationId}/reject"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals the plan's operation_id"
        side_effects:
          - "Plan pending_recommendation_count -= 1"
          - "If price_target_id set: that PriceTarget -> LAPSED"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /advisory/hedge-recommendations/{recommendationId}/execute"
        actor: CommodityAdvisor
        preconditions:
          - "MarginAccount for the operation exists and status == FUNDED (ERR_MARGIN_CALL_OUTSTANDING / ERR_MARGIN_ACCOUNT_RESTRICTED)"
          - "A SETTLEMENT MarketTick exists for (operation.primary_commodity, recommendation.contract_month) (ERR_NO_SETTLEMENT_PRICE)"
          - "After opening: cash_balance >= total initial_margin_required AND margin_equity >= total maintenance_margin_required (ERR_INSUFFICIENT_MARGIN_EQUITY)"
        side_effects:
          - "Mint BrokeragePosition OPEN with entry_price = latest SETTLEMENT tick (by price_date, tie-break created_at ASC)"
          - "LONG_PUT: cash_balance -= bushels * premium_per_bushel"
          - "MarginAccount aggregates recomputed"
          - "Plan hedged_bushels recomputed"
          - "If price_target_id set: that PriceTarget -> FILLED"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system — during market-tick processing, PROPOSED recommendations whose created_at is more than 5 days before the current logical clock"
        actor: system
        preconditions: []
        side_effects:
          - "Plan pending_recommendation_count -= 1"
          - "If price_target_id set: that PriceTarget -> LAPSED"

  - entity: BrokeragePosition
    initial_state: OPEN
    terminal_states: [OFFSET, LIQUIDATED]
    transitions:
      - from: OPEN
        to: OFFSET
        trigger: "POST /advisory/brokerage-positions/{positionId}/offset"
        actor: CommodityAdvisor
        preconditions:
          - "A SETTLEMENT MarketTick exists for (commodity, contract_month) (ERR_NO_SETTLEMENT_PRICE)"
        side_effects:
          - "exit_price = latest SETTLEMENT tick; realized_pnl computed"
          - "MarginAccount.cash_balance += realized_pnl; margin aggregates recomputed; call status re-evaluated (equity >= initial -> FUNDED)"
          - "Plan hedged_bushels recomputed"
      - from: OPEN
        to: LIQUIDATED
        trigger: "system — POST /advisory/margin-accounts/{accountId}/liquidate selects this position"
        actor: system
        preconditions: []
        side_effects:
          - "exit_price = latest SETTLEMENT tick; realized_pnl computed and applied to cash_balance"
          - "Plan hedged_bushels recomputed"

  - entity: MarginAccount
    initial_state: FUNDED
    terminal_states: []
    transitions:
      - from: FUNDED
        to: CALL_OUTSTANDING
        trigger: "system — during market-tick processing (SETTLEMENT ticks only), when margin_equity < maintenance_margin_required"
        actor: system
        preconditions: []
        side_effects:
          - "margin_call_amount = initial_margin_required - margin_equity at issuance"
      - from: CALL_OUTSTANDING
        to: FUNDED
        trigger: "POST /advisory/margin-accounts/{accountId}/fund"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals account.operation_id"
          - "Post-funding margin_equity >= initial_margin_required (otherwise remains CALL_OUTSTANDING with reduced margin_call_amount)"
        side_effects:
          - "cash_balance += amount; margin_call_amount cleared to 0 on cure"
      - from: CALL_OUTSTANDING
        to: RESTRICTED
        trigger: "system — liquidation ends with no OPEN positions and margin_equity < 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTRICTED
        to: FUNDED
        trigger: "POST /advisory/margin-accounts/{accountId}/fund"
        actor: Grower
        preconditions:
          - "Post-funding cash_balance >= 0"
        side_effects:
          - "cash_balance += amount"
        note: "Cycle FUNDED -> CALL_OUTSTANDING -> FUNDED and RESTRICTED -> FUNDED permitted without limit"

  - entity: Buyer
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: APPROVED
        trigger: "POST /advisory/buyers/{buyerId}/approve"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /advisory/buyers/{buyerId}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Existing contracts unaffected; new SalesContract creation with this buyer rejected (ERR_BUYER_NOT_APPROVED)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /advisory/buyers/{buyerId}/approve"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
        note: "APPROVED <-> SUSPENDED cycle permitted"

  - entity: SalesContract
    initial_state: "pricing_status: UNPRICED or PRICED (FLAT_PRICE) ; fulfillment_status: OPEN"
    terminal_states: [CANCELLED, DEFAULTED, DELIVERED]
    transitions:
      - from: UNPRICED
        to: PRICED
        trigger: "POST /advisory/sales-contracts/{contractId}/fix-price (HTA/BASIS only; ERR_PRICING_NOT_ALLOWED on FLAT_PRICE)"
        actor: CommodityAdvisor
        preconditions:
          - "fulfillment_status in {OPEN, PARTIALLY_DELIVERED}"
        side_effects:
          - "fixation_price set; effective_price computed; plan priced_contract_bushels recomputed"
        note: "pricing_status evolves independently of fulfillment_status — two state dimensions on one entity"
      - from: OPEN
        to: PARTIALLY_DELIVERED
        trigger: "system — DeliveryTicket confirm leaves 0 < delivered_bushels < bushels"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DELIVERED
        trigger: "system — DeliveryTicket confirm leaves delivered_bushels >= bushels (within tolerance)"
        actor: system
        preconditions: []
        side_effects:
          - "Plan committed_contract_bushels retained (DELIVERED stays committed); uncommitted_bushels recomputed"
          - "If plan uncommitted_bushels == 0 AND all plan contracts DELIVERED: plan auto -> CLOSED and its PENDING targets -> CANCELLED"
      - from: PARTIALLY_DELIVERED
        to: DELIVERED
        trigger: "system — DeliveryTicket confirm leaves delivered_bushels >= bushels (within tolerance)"
        actor: system
        preconditions: []
        side_effects:
          - "Same plan recompute + auto-close cascade as OPEN -> DELIVERED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /advisory/sales-contracts/{contractId}/cancel"
        actor: CommodityAdvisor | Grower
        preconditions:
          - "delivered_bushels == 0"
        side_effects:
          - "Committed bushels released: plan.uncommitted_bushels += contract.bushels; priced_contract_bushels recomputed"
          - "GrowerOperation.over_sold_flag re-evaluated (cleared when undelivered committed <= marketable)"
      - from: OPEN
        to: DEFAULTED
        trigger: "POST /advisory/sales-contracts/{contractId}/default"
        actor: CommodityAdvisor
        preconditions:
          - "Current logical clock date > delivery_window_end"
          - "delivered_bushels < bushels"
        side_effects:
          - "default_penalty_dollars computed if pricing_status == PRICED"
          - "Undelivered balance released to plan.uncommitted_bushels; over_sold_flag re-evaluated"
      - from: PARTIALLY_DELIVERED
        to: DEFAULTED
        trigger: "POST /advisory/sales-contracts/{contractId}/default"
        actor: CommodityAdvisor
        preconditions:
          - "Current logical clock date > delivery_window_end"
          - "delivered_bushels < bushels"
        side_effects:
          - "default_penalty_dollars computed if pricing_status == PRICED"
          - "Undelivered balance released to plan.uncommitted_bushels; over_sold_flag re-evaluated"

  - entity: DeliveryTicket
    initial_state: RECORDED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /advisory/delivery-tickets/{ticketId}/confirm"
        actor: CommodityAdvisor
        preconditions:
          - "Contract fulfillment_status in {OPEN, PARTIALLY_DELIVERED} (ERR_CONTRACT_FULLY_DELIVERED / ERR_INVALID_STATE)"
          - "Contract pricing_status == PRICED (ERR_CONTRACT_NOT_PRICED)"
          - "delivered_bushels + net_bushels <= floor(contract.bushels * 1.02) — 2 percent over-delivery tolerance, equality allowed (ERR_OVER_DELIVERY_EXCEEDED)"
        side_effects:
          - "ticket_value_dollars = round(net_bushels * effective_price, 2); contract.settled_value_dollars += ticket_value_dollars"
          - "contract.delivered_bushels += net_bushels; fulfillment auto-transition evaluated"
          - "AdvisoryAgreement.billable_bushels_accrued += net_bushels (most recent ACTIVE agreement for the operation)"
          - "Plan cascade + possible auto-CLOSED"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /advisory/delivery-tickets/{ticketId}/void"
        actor: CommodityAdvisor
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /advisory/delivery-tickets/{ticketId}/void"
        actor: CommodityAdvisor
        preconditions: []
        side_effects:
          - "Compensation: delivered_bushels -= net_bushels; settled_value_dollars -= ticket_value_dollars; billable_bushels_accrued -= net_bushels; fulfillment reverts DELIVERED -> PARTIALLY_DELIVERED / PARTIALLY_DELIVERED -> OPEN as quantities dictate; plan recomputed (a CLOSED plan stays CLOSED)"

  - entity: StorageLot
    initial_state: STORED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: STORED
        to: WITHDRAWN
        trigger: "POST /advisory/storage-lots/{lotId}/withdraw"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals lot.operation_id"
        side_effects:
          - "actual_end_date = current logical clock date"

  - entity: AdvisoryAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /advisory/advisory-agreements/{agreementId}/submit"
        actor: CommodityAdvisor
        preconditions: []
        side_effects:
          - "disclosure_status = REQUIRED; submitted_by_user_id = calling advisor X-User-ID"
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /advisory/advisory-agreements/{agreementId}/sign"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals agreement.operation_id"
          - "disclosure_status == ACKNOWLEDGED (ERR_DISCLOSURE_NOT_ACKNOWLEDGED)"
          - "acknowledged_agreement_version == agreement.version (ERR_DISCLOSURE_STALE)"
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "PUT /advisory/advisory-agreements/{agreementId} — amendment self-loop"
        actor: CommodityAdvisor
        preconditions: []
        side_effects:
          - "version incremented; if disclosure_status == ACKNOWLEDGED: disclosure_status -> STALE (version-pinning on approval)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "PUT /advisory/advisory-agreements/{agreementId} with status_change=TERMINATE"
        actor: CommodityAdvisor
        preconditions:
          - "No ACTIVE MarketingPlan references this operation (ERR_INVALID_STATE)"
        side_effects: []
      - from: NONE
        to: REQUIRED
        trigger: "system — on submit (disclosure sub-status machine)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUIRED
        to: DELIVERED
        trigger: "POST /advisory/advisory-agreements/{agreementId}/deliver-disclosure"
        actor: CommodityAdvisor
        preconditions: []
        side_effects: []
      - from: STALE
        to: DELIVERED
        trigger: "POST /advisory/advisory-agreements/{agreementId}/deliver-disclosure"
        actor: CommodityAdvisor
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /advisory/advisory-agreements/{agreementId}/acknowledge-disclosure"
        actor: Grower
        preconditions:
          - "Acting Grower's X-User-ID equals agreement.operation_id"
        side_effects:
          - "acknowledged_agreement_version = current agreement.version (pinned)"
      - from: ACKNOWLEDGED
        to: STALE
        trigger: "system — on agreement amendment (PUT)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: plan-amend-stale-version
    parent_entity: MarketingPlan
    write_endpoint: "PUT /advisory/marketing-plans/{planId}"
    occ_field: expected_marketing_plan_version
    description: |
      Amending a MarketingPlan whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION. A client holding version N
      who writes after another amendment moved the plan to version N+1 would
      otherwise silently overwrite the intervening change (e.g. a lowered
      max_priced_pct that the stale write would restore).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: baseline-create-stale-operation
    parent_entity: GrowerOperation
    write_endpoint: "POST /advisory/production-baselines"
    occ_field: expected_operation_version
    description: |
      Creating a ProductionBaseline legitimately supersedes the operation's
      existing non-SUPERSEDED baseline, so a create carrying an operation version
      that has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION: the client's premise (which baseline it would supersede)
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: expected_bushels
    trigger: "ProductionBaseline creation"
    algorithm: aggregation
    formula: |
      expected_bushels_aph   = floor(planted_acres * aph_yield_bushels)
      expected_bushels_trend = floor(planted_acres * trend_yield_bushels * RISK_TREND_FACTOR[operation.risk_profile])
      expected_bushels       = expected_bushels_aph if operation.yield_method == APH else expected_bushels_trend
    input_set: "The owning GrowerOperation (risk_profile, yield_method) and the baseline's input fields"
    constants:
      RISK_TREND_FACTOR: { CONSERVATIVE: 0.98, BALANCED: 1.00, AGGRESSIVE: 1.02 }
    precision: "bushels are integers (floor); yields 2dp"
    variants:
      - name: APH
        when: "operation.yield_method == APH"
        difference: "Uses aph_yield_bushels; ignores trend yield and risk factor"
      - name: TREND
        when: "operation.yield_method == TREND"
        difference: "Uses trend_yield_bushels scaled by RISK_TREND_FACTOR; identical inputs produce a different expected_bushels than APH"

  - name: insurance_guarantee_and_indemnity
    trigger: "guarantee frozen at policy bind; indemnity computed at file-claim"
    algorithm: threshold
    formula: |
      guarantee_bushels  = floor(baseline.expected_bushels * coverage_level_pct)          # at bind
      indemnity_dollars  = max(0, guarantee_bushels - actual_harvested_bushels)
                           * max(projected_price, harvest_price)                           # at claim
    input_set: "The CERTIFIED ProductionBaseline referenced by baseline_id; claim inputs actual_harvested_bushels and harvest_price"
    constants: {}
    precision: "guarantee integer floor; indemnity 2dp round_half_up"
    variants: []

  - name: hedge_coverage_cap
    trigger: "HedgeRecommendation acceptance; PriceTarget trigger (headroom for minted recommendation bushels)"
    algorithm: threshold
    formula: |
      cap       = floor(plan.expected_bushels_snapshot * min(plan.max_priced_pct, RISK_COVERAGE_CAP[operation.risk_profile]))
      committed = plan.hedged_bushels + plan.priced_contract_bushels
      headroom  = cap - committed
      accept allowed  iff committed + recommendation.bushels <= cap      # equality allowed; committed excludes PROPOSED recommendations (the accepting one converts itself)
      trigger mints bushels = min(target.increment_bushels, headroom_pending); if headroom_pending <= 0 target goes LAPSED without minting
      headroom_pending = cap - committed - sum(bushels over PROPOSED recommendations of the plan)   # pending advice reserves capacity during one tick sweep
    input_set: "OPEN BrokeragePosition + ACCEPTED HedgeRecommendation (hedged_bushels); PRICED SalesContract in {OPEN, PARTIALLY_DELIVERED, DELIVERED} (priced_contract_bushels)"
    constants:
      RISK_COVERAGE_CAP: { CONSERVATIVE: 0.60, BALANCED: 0.80, AGGRESSIVE: 1.00 }
    precision: "integer bushels, floor"
    variants: []

  - name: margin_accounting
    trigger: "position execution, offset, liquidation, and every SETTLEMENT MarketTick (marks all OPEN positions of the matching commodity+contract_month)"
    algorithm: aggregation
    formula: |
      initial_margin_dollars      = bushels * IM_RATE[instrument]                     # LONG_PUT: bushels * (premium_per_bushel + 0.05)
      maintenance_margin_dollars  = bushels * MM_RATE[instrument]                     # LONG_PUT: equals initial_margin_dollars
      unrealized_pnl (FUTURES_SHORT) = (entry_price - latest_settlement) * bushels
      unrealized_pnl (LONG_PUT)      = (max(0, strike_price - latest_settlement) - premium_per_bushel) * bushels
      margin_equity = cash_balance + sum(unrealized_pnl over OPEN positions)
      latest_settlement = SETTLEMENT tick for (commodity, contract_month) with greatest price_date; tie-break created_at ASC
      call issued when margin_equity < maintenance_margin_required (strict <); call_amount = initial_margin_required - margin_equity
      cure when post-funding margin_equity >= initial_margin_required (>=, equality cures)
    input_set: "OPEN BrokeragePosition rows of the account; SETTLEMENT MarketTick rows for their (commodity, contract_month)"
    constants:
      IM_RATE: { FUTURES_SHORT: 0.30, LONG_PUT: "premium + 0.05" }
      MM_RATE: { FUTURES_SHORT: 0.22, LONG_PUT: "premium + 0.05" }
      RECOMMENDATION_TTL_DAYS: 5
    precision: "2dp round_half_up on all dollar fields"
    variants: []

  - name: forced_liquidation
    trigger: "POST /advisory/margin-accounts/{accountId}/liquidate while status == CALL_OUTSTANDING"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        (1) mark every OPEN position at its latest SETTLEMENT tick (prices frozen for the whole run);
        (2) deficit_test() = margin_equity < maintenance_margin_required;
        (3) candidate order: initial_margin_dollars DESC, tie-break created_at ASC;
        (4) while deficit_test() and candidates remain: liquidate the head candidate
            (realize pnl into cash_balance, remove from candidate set, recompute aggregates);
        (5) stop as soon as deficit_test() is false.
      Post-state: positions remain and equity >= maintenance -> FUNDED;
                  no positions remain and equity >= 0 -> FUNDED;
                  no positions remain and equity < 0 -> RESTRICTED.
      The pinned order is observable: liquidating largest-margin-contributor first can
      spare smaller positions that a smallest-first order would have closed.
    input_set: "OPEN BrokeragePosition rows of the account at invocation"
    constants: {}
    precision: "2dp round_half_up"
    variants: []

  - name: contract_settlement_value
    trigger: "DeliveryTicket confirm and void (void subtracts the ticket's stored value)"
    algorithm: aggregation
    formula: |
      shrink_pct   = max(0, moisture_pct - 15.0) * 0.012
      net_bushels  = round(gross_bushels * (1 - shrink_pct), 3)
      PINNED ROUNDING ORDER (per-line then sum):
        ticket_value_dollars     = round(net_bushels * contract.effective_price, 2)   # per ticket
        settled_value_dollars    = sum(ticket_value_dollars over CONFIRMED non-voided tickets)
      The alternative "sum net bushels then round once" produces different cents and is NOT used.
    input_set: "CONFIRMED, non-VOIDED DeliveryTicket rows of the contract"
    constants:
      MOISTURE_BASE_PCT: 15.0
      SHRINK_PER_POINT: 0.012
      OVER_DELIVERY_TOLERANCE: 1.02
    precision: "net bushels 3dp round_half_up; dollars 2dp round_half_up per line"
    variants: []

  - name: performance_benchmark
    trigger: "GET /advisory/operations/{operationId}/performance-report"
    algorithm: weighted_scoring
    formula: |
      priced components = SalesContract of the operation with pricing_status == PRICED
        and fulfillment_status in {OPEN, PARTIALLY_DELIVERED, DELIVERED, DEFAULTED}
      weighted_avg_sale_price = sum(bushels * effective_price) / sum(bushels)   # 4dp half-up; null when the priced set is empty
      benchmark window (MARKETING_YEAR_AVG):  [crop_year-06-01, crop_year+1-05-31] inclusive
      benchmark window (HARVEST_WINDOW_AVG):  [crop_year-10-01, crop_year-10-31] inclusive
      benchmark_price = mean of SETTLEMENT MarketTick.price for the operation commodity whose
        price_date falls inside the selected window (4dp half-up); null when no such tick exists
      outperformance_bps = round((weighted_avg_sale_price - benchmark_price) / benchmark_price * 10000, 0)
        null when either input is null
    input_set: "PRICED SalesContract rows; SETTLEMENT MarketTick rows of the operation commodity"
    constants: {}
    precision: "prices 4dp round_half_up; outperformance integer bps round_half_up"
    variants:
      - name: MARKETING_YEAR_AVG
        when: "benchmark_method == MARKETING_YEAR_AVG (default)"
        difference: "Averages every SETTLEMENT tick in the 12-month marketing year"
      - name: HARVEST_WINDOW_AVG
        when: "benchmark_method == HARVEST_WINDOW_AVG"
        difference: "Averages only ticks inside the October harvest window; identical trades benchmark against a different number"

  - name: advisory_fee_statement
    trigger: "GET /advisory/advisory-agreements/{agreementId}/fee-statement"
    algorithm: tiered_pricing
    formula: |
      billable_bushels = sum(net_bushels) over CONFIRMED non-voided DeliveryTicket whose
        delivery_date falls in [period_start, period_end] inclusive and whose contract
        belongs to the agreement operation
      PER_BUSHEL: fee = round(billable_bushels * rate_per_bushel, 2)
      FLAT_ANNUAL: fee = flat_annual_fee (charged once per statement period regardless of bushels)
      If annual_cap_dollars present: fee = min(fee, annual_cap_dollars) and capped = true.
      The two variants are compared across agreements: identical delivery history under a
      PER_BUSHEL agreement and a FLAT_ANNUAL agreement yields different fee_dollars.
    input_set: "CONFIRMED non-VOIDED DeliveryTicket rows joined through SalesContract to the operation"
    constants: {}
    precision: "2dp round_half_up"
    variants:
      - name: PER_BUSHEL
        when: "agreement.fee_type == PER_BUSHEL"
        difference: "Scales with delivered bushels"
      - name: FLAT_ANNUAL
        when: "agreement.fee_type == FLAT_ANNUAL"
        difference: "Fixed fee; identical delivery history produces a different total than PER_BUSHEL"

  - name: storage_breakeven
    trigger: "GET /advisory/storage-lots/{lotId}/breakeven"
    algorithm: forward_looking
    formula: |
      end_ref   = actual_end_date if WITHDRAWN else planned_end_date
      days      = end_ref - start_date (calendar days)
      months    = ceil(days / 30)                                    # any part-month counts as a full month
      carry     = round(bushels * cost_per_bushel_month * months, 2)
      interest  = round(bushels * harvest_value_per_bushel * annual_interest_rate * months / 12, 2)
      breakeven_sale_price = round((bushels * harvest_value_per_bushel + carry + interest) / bushels, 2)
      harvest_value_per_bushel = latest SETTLEMENT tick price for the operation commodity (ERR_NO_SETTLEMENT_PRICE if none)
    input_set: "The StorageLot; latest SETTLEMENT MarketTick for the operation's primary_commodity"
    constants: {}
    precision: "2dp round_half_up"
    variants: []

  - name: cash_flow_projection
    trigger: "GET /advisory/operations/{operationId}/cash-flow-projection"
    algorithm: chronological
    formula: |
      Buckets keyed by calendar month, ascending, from earliest contributing event through through_date:
        inflow  += ticket_value_dollars of CONFIRMED non-voided tickets whose delivery_date falls in the month
        outflow += bushels * cost_per_bushel_month for each StorageLot occupying that month
                   (month m occupied when lot.start_date <= last day of m and end_ref >= first day of m)
        outflow += premium cost of LONG_PUT positions in their execution month (bushels * premium_per_bushel)
      net_cash_flow = inflow - outflow per bucket; cumulative_cash_flow runs in month order (order-sensitive:
      buckets are reported ascending; equal-month events aggregate before netting)
    input_set: "CONFIRMED non-voided DeliveryTicket (via SalesContract), StorageLot rows, OPEN/OFFSET/LIQUIDATED LONG_PUT positions of the operation"
    constants: {}
    precision: "2dp round_half_up"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed on the endpoint; for entity_backed Grower calls the X-User-ID must equal the operation id that owns the target resource"
    error_id: ERR_FORBIDDEN_ROLE / ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Field-level schema: required fields present, enums valid, ranges honored (coverage_level_pct 0.50..0.85 step 0.05; bushels > 0; window_start < window_end; conditional fields by contract_type / fee_type / instrument)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /advisory/marketing-plans/{planId}; POST /advisory/production-baselines"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition (plan ACTIVE for contracts/accepts, recommendation PROPOSED/ACCEPTED, contract not terminal, ticket RECORDED/CONFIRMED for void, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: disclosure ACKNOWLEDGED and not STALE before plan activation / resume / sign / sales-contract creation; certifier differs from submitting advisor. The governing agreement is the operation's most recently activated ACTIVE AdvisoryAgreement (tie-break: greatest created_at)"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED / ERR_DISCLOSURE_STALE / ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "plan activate/resume, agreement sign/certify-compliance, sales-contract create"
  - priority: 8
    category: business_referential
    check: "Referenced entities in required states: Buyer APPROVED, baseline CERTIFIED, agreement ACTIVE"
    error_id: ERR_BUYER_NOT_APPROVED / ERR_BASELINE_NOT_CERTIFIED / ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "contract create, policy bind, plan activate"
  - priority: 9
    category: business_temporal
    check: "Interval rules: (i) buyer delivery windows are half-open [start, end) — overlap iff new.start < existing.end AND existing.start < new.end over OPEN/PARTIALLY_DELIVERED contracts of the same buyer; (ii) storage bin buffer — a new lot in the same bin conflicts with a STORED lot unless new.start_date >= existing.planned_end_date + 7 days OR new.planned_end_date <= existing.start_date - 7 days (adjacency inside the buffer rejected); (iii) delivery_date inside [start, end) — end date itself rejected"
    error_id: ERR_DELIVERY_WINDOW_OVERLAP / ERR_STORAGE_BIN_OVERLAP / ERR_DELIVERY_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "contract create, storage-lot create, delivery-ticket create"
  - priority: 10
    category: business_constraint
    check: "Capacity/consistency gates: coverage cap (recommendation accept; sales-contract create for FLAT_PRICE; fix-price when an UNPRICED contract becomes PRICED), uncommitted bushels, over-sold flag, margin account status gates, over-delivery tolerance, contract priced before confirm, settlement tick present"
    error_id: ERR_COVERAGE_CAP_EXCEEDED / ERR_INSUFFICIENT_UNCOMMITTED_BUSHELS / ERR_OVER_SOLD_POSITION / ERR_MARGIN_CALL_OUTSTANDING / ERR_MARGIN_ACCOUNT_RESTRICTED / ERR_OVER_DELIVERY_EXCEEDED / ERR_CONTRACT_NOT_PRICED / ERR_CONTRACT_FULLY_DELIVERED / ERR_NO_SETTLEMENT_PRICE / ERR_PRICING_NOT_ALLOWED / ERR_LIQUIDATION_NOT_REQUIRED
    http_status: 409
    applies_to: "recommendation accept/execute, contract create, ticket confirm, position offset, margin liquidate, fix-price"
  - priority: 11
    category: business_fiscal
    check: "Post-trade solvency: after opening a position, cash_balance >= total initial margin and margin_equity >= total maintenance margin; funding amount > 0"
    error_id: ERR_INSUFFICIENT_MARGIN_EQUITY
    http_status: 409
    applies_to: "recommendation execute, margin fund"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
