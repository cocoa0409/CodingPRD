            - "The regrade with sample_id ${smp} -> 201 and GET /grain-inspection/appeals/${ap} -> status UNDER_REVIEW"
            - "A grading result naming an appeal_id that belongs to a certificate of a different request -> 422 ERR_APPEAL_REGRADE_BINDING_INVALID"

