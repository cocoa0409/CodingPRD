            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Center", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 100000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-test-reports"
