      - name: occ_stale_project_version_on_change_order_apply
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-apply-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        excluded_because:
          difficulty_instance: compensating_invariant / change_order_apply_conserves_accepted_quote_singleton
          rationale: "The §1.8 compensating-invariant instance applies a change order with a correct ${proj_v}; an OCC negative test reuses that chain with expected_project_version: ${proj_v} - 1. Covered as the stale-version sibling of that instance."

      - name: occ_stale_quote_version_on_deposit_capture
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deposit-capture-stale-quote]", "errors[ERR_STALE_QUOTE_VERSION]"]
        distinguishing_aspect: "Capturing a deposit with expected_quote_version one less than current quote.version -> ERR_STALE_QUOTE_VERSION 412 (version dynamic, not literal)."
        test_recipe:
          setup: ["Project GARAGE, Quote ACCEPTED, a PENDING deposit; quote.version captured then artificially stale via -1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "OCC", zip_code: "50000" }
