# =============================================================================
# 1.9 Scaffold Corner Design - Public Records & Data Journalism Desk (task 2976)
# =============================================================================
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's SS1.1-SS1.7 surface and emits one instance per
# applicable claim-type row. Rows already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# .yaml carry an `excluded_because:` stub naming that instance; rows that this
# domain does not exhibit are skipped without ceremony.
#
# Every chain below starts from an empty database, sets the logical clock
# explicitly (the server's default is 2026-08-01T00:00:00Z), and composes only
# endpoints declared in SS1.5. Pinned user ids: "coord-001" (RecordsCoordinator),
# "rep-001" (DataReporter), "peer-001" / "peer-002" (PeerReviewer),
# "editor-001" (ManagingEditor), "legal-001" (LegalCounsel); an ExpertReviewer
# caller always presents the ExpertReviewer row's own id.
# The unresolvable-id literal used by every not-found probe is
# "00000000-0000-4000-8000-000000000000".
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: desk_creation_initializes_the_ledger_the_counters_and_the_envelope
        claim_type: creation
        grounds:
          - entities.Desk
          - endpoints[POST /records-desk/desks]
          - calculations.desk_fee_budget_ledger
          - response_envelope.success
        distinguishing_aspect: |
          A freshly created Desk must open its three-way ledger as
          (available == total, committed == 0, spent == 0), start every exposure counter at 0, sit at
          security_posture OPEN and carry version 1 - and the create response itself must already
          expose them inside the SS1.0 success envelope (meta.api_request_id, response_type "object",
          data). Any implementation that leaves available at 0 until the first commit, or that starts
          version at 0, fails here before any business rule is reached.
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
          trigger:
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 250000, retention_policy_days: 400 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
          assert:
            - "HTTP 201 and the body is the SS1.0 success envelope: meta.api_request_id is a non-empty string, meta.api_request_timestamp is an ISO-8601 instant, response_type == \"object\""
            - "data.id is a non-empty string; data.name == \"Metro Investigations Desk\"; data.retention_policy_days == 400"
            - "data.fee_budget_total_cents == 250000, data.fee_budget_available_cents == 250000, data.fee_budget_committed_cents == 0, data.fee_budget_spent_cents == 0"
            - "total == available + committed + spent (250000 == 250000 + 0 + 0)"
            - "data.open_request_count == 0, data.open_appeal_count == 0, data.litigation_exposure_count == 0, data.source_exposure_incident_count == 0"
            - "data.security_posture == \"OPEN\""
            - "data.version == 1, data.created_at and data.updated_at are ISO-8601 instants"

      - name: records_request_retrieval_returns_the_stored_row_and_then_the_stamped_deadlines
        claim_type: retrieval
        grounds:
          - endpoints[GET /records-desk/records-requests/{id}]
          - entities.RecordsRequest
          - state_machines.RecordsRequest.DRAFT_to_AWAITING_AGENCY_RESPONSE
        distinguishing_aspect: |
          GET by id must return exactly what was persisted - every input field echoed, every deferred
          computed field still null (submitted_at, due_at_strict, due_at_tolled, net_fee_cents) - and
          must reflect the submit transition on the next read rather than caching the create response.
          This separates a real read path from an implementation that recomputes or re-defaults on read.
        test_recipe:
          setup:
            - "One Desk and one BUSINESS_DAYS Agency (initial_response_days 10, holiday_dates [\"2026-09-07\"]); logical clock 2026-08-03T09:00:00Z (a Monday)."
            - "One RecordsRequest created but not yet submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Inspection narratives 2025", requested_format: "CSV", estimated_page_count: 240, waiver_requested: true, public_interest_score: 72, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              as_user_id: "coord-001"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /records-desk/records-requests/${req_id}"
              as: DataReporter
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
              as_user_id: "coord-001"
            - call: "GET /records-desk/records-requests/${req_id}"
              as: LegalCounsel
          assert:
            - "trigger call 1: HTTP 200; data.id == \"${req_id}\", desk_id == \"${desk_id}\", agency_id == \"${agency_id}\""
            - "trigger call 1: subject_summary == \"Inspection narratives 2025\", requested_format == \"CSV\", estimated_page_count == 240, waiver_requested == true, public_interest_score == 72"
            - "trigger call 1: status == \"DRAFT\", submitted_at == null, due_at_strict == null, due_at_tolled == null, tolled_days_total == 0, clarification_round_count == 0"
            - "trigger call 1: search_hours == null, billed_page_count == null, gross_fee_cents == null, net_fee_cents == null, fee_committed_cents == 0, fee_determined_at == null, denial_reason_code == null, supersedes_request_id == null"
            - "trigger call 1: version == 1"
            - "trigger call 3: status == \"AWAITING_AGENCY_RESPONSE\", submitted_at == \"2026-08-03T09:00:00Z\", due_at_strict == \"2026-08-17T23:59:59.000Z\", due_at_tolled == \"2026-08-17T23:59:59.000Z\", version == 2"
            - "trigger call 3 is a fresh read by a different role and returns the post-submit row, not the cached create response"

      - name: records_request_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /records-desk/records-requests]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint must apply the status filter BEFORE counting, so total_count reports the
          filtered population (2 DRAFT of 3 rows) rather than the table size, and has_more must be
          driven by limit+offset against that filtered count - true at offset 0 with limit 1, false at
          offset 1. An implementation that paginates first and filters the page afterwards returns the
          same rows but the wrong total_count and has_more.
        test_recipe:
          setup:
            - "One Desk, one Agency, three RecordsRequests on that desk; the first is submitted, so exactly two remain DRAFT."
            - "Each create re-reads the Desk first because every records-request create bumps Desk.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v1: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Request one", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v1}" }
              as: RecordsCoordinator
              captures: { req1_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v2: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Request two", requested_format: "CSV", estimated_page_count: 20, waiver_requested: false, public_interest_score: 20, expected_desk_version: "${desk_v2}" }
              as: RecordsCoordinator
              captures: { req2_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v3: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Request three", requested_format: "CSV", estimated_page_count: 30, waiver_requested: false, public_interest_score: 30, expected_desk_version: "${desk_v3}" }
              as: RecordsCoordinator
              captures: { req3_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req1_id}/submit"
              payload: {}
              as: RecordsCoordinator
          trigger:
            - call: "GET /records-desk/records-requests"
              payload: { desk_id: "${desk_id}" }
              as: ManagingEditor
            - call: "GET /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", status: "DRAFT", limit: 1, offset: 0 }
              as: ManagingEditor
            - call: "GET /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", status: "DRAFT", limit: 1, offset: 1 }
              as: ManagingEditor
            - call: "GET /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", status: "AWAITING_AGENCY_RESPONSE" }
              as: ManagingEditor
          assert:
            - "trigger call 1: HTTP 200, response_type == \"array\", total_count == 3, has_more == false, and len(data) == 3 (3 <= the default limit of 10)"
            - "trigger call 2: total_count == 2, has_more == true, len(data) == 1, and every returned row has status == \"DRAFT\""
            - "trigger call 3: total_count == 2, has_more == false, len(data) == 1, and the row differs from the one returned at offset 0"
            - "trigger calls 2 and 3 together return exactly {\"${req2_id}\", \"${req3_id}\"} and never \"${req1_id}\""
            - "trigger call 4: total_count == 1, has_more == false, data[0].id == \"${req1_id}\""

      - name: every_path_addressed_entity_reports_its_own_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_DESK_NOT_FOUND]
          - errors[ERR_AGENCY_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_DATASET_NOT_FOUND]
          - errors[ERR_INVESTIGATION_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_FINDING_NOT_FOUND]
          - errors[ERR_REVIEWER_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SUBJECT_REQUEST_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
        distinguishing_aspect: |
          Priority 40 demands a PER-ENTITY 404 code, not a generic one: the same unresolvable uuid must
          produce twelve different error_id values depending on which collection was addressed. An
          implementation with one shared ERR_NOT_FOUND, or one that returns 200 with a null body, fails
          every row. The probe runs against an empty database so nothing can accidentally resolve.
        test_recipe:
          setup:
            - "Empty database except the logical clock; no entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
          trigger:
            - call: "GET /records-desk/desks/00000000-0000-4000-8000-000000000000"
              as: ManagingEditor
              captures: { e1: $.data.error_id }
            - call: "GET /records-desk/agencies/00000000-0000-4000-8000-000000000000"
              as: RecordsCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /records-desk/records-requests/00000000-0000-4000-8000-000000000000"
              as: RecordsCoordinator
              captures: { e3: $.data.error_id }
            - call: "GET /records-desk/appeals/00000000-0000-4000-8000-000000000000"
              as: LegalCounsel
              captures: { e4: $.data.error_id }
            - call: "GET /records-desk/datasets/00000000-0000-4000-8000-000000000000"
              as: DataReporter
              captures: { e5: $.data.error_id }
            - call: "GET /records-desk/investigations/00000000-0000-4000-8000-000000000000"
              as: ManagingEditor
              captures: { e6: $.data.error_id }
            - call: "GET /records-desk/analysis-runs/00000000-0000-4000-8000-000000000000"
              as: PeerReviewer
              captures: { e7: $.data.error_id }
            - call: "GET /records-desk/findings/00000000-0000-4000-8000-000000000000"
              as: DataReporter
              captures: { e8: $.data.error_id }
            - call: "GET /records-desk/expert-reviewers/00000000-0000-4000-8000-000000000000"
              as: ManagingEditor
              captures: { e9: $.data.error_id }
            - call: "GET /records-desk/review-assignments/00000000-0000-4000-8000-000000000000"
              as: ManagingEditor
              captures: { e10: $.data.error_id }
            - call: "GET /records-desk/subject-response-requests/00000000-0000-4000-8000-000000000000"
              as: RecordsCoordinator
              captures: { e11: $.data.error_id }
            - call: "GET /records-desk/enclave-sessions/00000000-0000-4000-8000-000000000000"
              as: LegalCounsel
              captures: { e12: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with response_type == \"error\" and a non-empty data.message"
            - "call 1 error_id == \"ERR_DESK_NOT_FOUND\"; call 2 == \"ERR_AGENCY_NOT_FOUND\"; call 3 == \"ERR_REQUEST_NOT_FOUND\"; call 4 == \"ERR_APPEAL_NOT_FOUND\""
            - "call 5 error_id == \"ERR_DATASET_NOT_FOUND\"; call 6 == \"ERR_INVESTIGATION_NOT_FOUND\"; call 7 == \"ERR_RUN_NOT_FOUND\"; call 8 == \"ERR_FINDING_NOT_FOUND\""
            - "call 9 error_id == \"ERR_REVIEWER_NOT_FOUND\"; call 10 == \"ERR_ASSIGNMENT_NOT_FOUND\"; call 11 == \"ERR_SUBJECT_REQUEST_NOT_FOUND\"; call 12 == \"ERR_SESSION_NOT_FOUND\""
            - "the twelve error_id values are pairwise distinct"

      - name: records_request_creation_rejects_a_missing_required_field
        claim_type: required_fields
        grounds:
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /records-desk/records-requests]
        distinguishing_aspect: |
          Every field in the endpoint's `input:` that is not marked optional is required, including the
          OCC token expected_desk_version: omitting it is a priority-50 schema rejection (400), NOT a
          412 stale-version error, because the schema gate runs before the concurrency gate at priority
          90. No RecordsRequest row and no Desk.version bump may result from any rejected call.
        test_recipe:
          setup:
            - "One Desk and one Agency; the desk's current version has been read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
          trigger:
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "No waiver flag supplied", requested_format: "CSV", estimated_page_count: 10, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "No OCC token supplied", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10 }
              as: RecordsCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "   ", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { e3: $.data.error_id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
          assert:
            - "trigger call 1: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" (waiver_requested is required and has no default)"
            - "trigger call 2: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\", NOT 412 - the priority-50 schema gate precedes the priority-90 OCC gate"
            - "trigger call 3: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" (subject_summary must be non-blank, and a whitespace-only string is blank)"
            - "trigger call 4: Desk.version == ${desk_v} and open_request_count == 0 - no rejected call created a row or bumped the parent version"

      - name: optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ExpertReviewer.fields.max_concurrent_assignments
          - entities.ExpertReviewer.fields.conflict_of_interest_agency_ids
          - entities.SecureEnclave.fields.sanitization_buffer_minutes
          - entities.Agency.fields.holiday_dates
          - entities.FieldDefinition.fields.known_issue_codes
        distinguishing_aspect: |
          The four optional inputs in SS1.5 must materialise their SS1.1 defaults when omitted - 2 for
          max_concurrent_assignments, 30 for sanitization_buffer_minutes, [] for
          conflict_of_interest_agency_ids, holiday_dates and known_issue_codes - and an omitted array
          default must be an empty array, never null, because downstream membership tests
          (conflict-of-interest, holiday skipping) read them unconditionally. known_issue_codes also
          feeds Dataset.known_issue_count, which must therefore stay 0.
        test_recipe:
          setup:
            - "One Desk, one Agency created WITHOUT holiday_dates, one Investigation and one RAW Dataset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Defaults probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Defaults probe", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "defaults-probe", negotiated_format: "CSV", expected_field_count: 2, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { ds_id: $.data.id }
          trigger:
            - call: "POST /records-desk/expert-reviewers"
              payload: { name: "Dr. Ana Reyes", affiliation: "State University Housing Lab", expertise_code: "HOUSING" }
              as: ManagingEditor
              captures: { rev_id: $.data.id }
            - call: "POST /records-desk/secure-enclaves"
              payload: { name: "Reading Room A", max_documents: 20 }
              as: LegalCounsel
              captures: { enclave_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "closure_reason", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 2, is_source_identifying: false }
              as: DataReporter
              captures: { fd_id: $.data.id }
            - call: "GET /records-desk/agencies/${agency_id}"
              as: RecordsCoordinator
            - call: "GET /records-desk/datasets/${ds_id}"
              as: DataReporter
          assert:
            - "trigger call 1: ExpertReviewer.max_concurrent_assignments == 2, conflict_of_interest_agency_ids == [] (an empty array, not null), active_assignment_count == 0"
            - "trigger call 2: SecureEnclave.sanitization_buffer_minutes == 30, max_documents == 20, booked_session_count == 0"
            - "trigger call 3: FieldDefinition.known_issue_codes == [], suppression_applied == false, suppression_method == null"
            - "trigger call 4: Agency.holiday_dates == [] (an empty array, not null)"
            - "trigger call 5: Dataset.known_issue_count == 0, field_definition_count == 1, documentation_status == \"INCOMPLETE\" (1 < expected_field_count 2)"

      - name: analysis_run_computed_fields_and_run_sequence_are_server_derived
        claim_type: computed_fields
        grounds:
          - entities.AnalysisRun.fields.labor_cost_cents
          - entities.AnalysisRun.fields.total_cost_cents
          - entities.AnalysisRun.fields.run_sequence
          - calculations.analysis_cost_allocation
        distinguishing_aspect: |
          labor_cost_cents, total_cost_cents and run_sequence are `source: computed` and are NOT accepted
          as inputs anywhere in SS1.5, so the only way they can be right is derivation:
          round_half_up(2.5 * 6500) == 16250, total == 5000 + 16250 == 21250, and run_sequence == 1 + the
          count of existing runs on the investigation. The second run must land on sequence 2 while the
          investigation stays in ANALYSIS, which distinguishes "current run" bookkeeping from a
          per-investigation run counter that resets.
        test_recipe:
          setup:
            - "One Desk and one Investigation in DRAFTING; the investigation's version has been read for the OCC token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
