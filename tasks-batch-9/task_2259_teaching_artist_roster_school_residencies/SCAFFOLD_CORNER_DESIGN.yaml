          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_VOUCHER_NOT_FOUND]
          - errors[ERR_FUNDER_REPORT_NOT_FOUND]
        distinguishing_aspect: "Each addressable collection returns its OWN 404 code rather than one generic not-found: seven reads of well-formed but absent ids yield seven distinct error_id values."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call; every id below is a syntactically valid uuid that was never persisted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /school-partners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramDirector
              captures: { e_school: $.data.error_id }
            - call: "GET /teaching-artists/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: RosterCoordinator
              captures: { e_artist: $.data.error_id }
            - call: "GET /residencies/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramDirector
              captures: { e_residency: $.data.error_id }
            - call: "GET /lesson-plans/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: CurriculumSpecialist
              captures: { e_plan: $.data.error_id }
            - call: "GET /sessions/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: RosterCoordinator
              captures: { e_session: $.data.error_id }
            - call: "GET /payment-vouchers/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: FiscalOfficer
              captures: { e_voucher: $.data.error_id }
            - call: "GET /funder-reports/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramDirector
