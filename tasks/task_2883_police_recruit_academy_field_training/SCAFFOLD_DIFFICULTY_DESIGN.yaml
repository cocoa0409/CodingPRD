      - name: screening_terminal_state_outranks_same_actor_guard
        grounds:
          - validations[priority 40 category state ERR_SCREENING_ALREADY_ADJUDICATED]
          - validations[priority 56 category business_safety ERR_SAME_ACTOR_ADJUDICATION]
          - endpoints[POST /screening-records/{screeningRecordId}/adjudicate]
          - errors.ERR_SCREENING_ALREADY_ADJUDICATED
          - errors.ERR_SAME_ACTOR_ADJUDICATION
        distinguishing_aspect: |
          The re-adjudication request violates a priority-40 state rule (the ScreeningRecord is
          already in the terminal CLEARED state) and a priority-56 business_safety rule (the acting
          X-User-ID is the same investigator who recorded the findings). The 409 terminal-state error
          must be returned, not the 422 segregation-of-duties error, and the paired control - a
          DIFFERENT screening of the same recruit that is still in FINDINGS_RECORDED, adjudicated by
          its own findings recorder - returns ERR_SAME_ACTOR_ADJUDICATION. Both rules guard the same
          endpoint and the same request field, so an implementation that checks the actor before the
          state (the cheaper comparison) returns the wrong id.
