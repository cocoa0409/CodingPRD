          assert:
            - "close: HTTP 200."
            - "data.commission_cents == 160000 (round_half_up(2000000 * 0.08); the 0.10 tier stops at 1500000 and the raw amount is far above the 50000 floor)."
            - "data.holdback_cents == 200000 -- the 15% share would be 300000, so the absolute cap binds."
            - "data.escrow_target_amount_cents == 2200000 (2000000 down + 200000 holdback)."
            - "data.clawback_cap_cents == 400000 (20% of 2000000)."
            - "GET escrow: disbursed_to_broker_cents == 160000, disbursed_to_seller_cents == 1840000 (2200000 funded - 200000 holdback - 160000 commission), holdback_balance_cents == 200000, undisbursed_balance_cents == 0, status == \"PARTIALLY_RELEASED\"."
            - "160000 + 1840000 + 200000 == 2200000 == the funded amount: no cent is created or destroyed by the waterfall."
            - "data.financing_type == \"CASH\" and data.down_payment_cents == 2000000, so ERR_DOWN_PAYMENT_INSUFFICIENT never fired even though MIN_DOWN_PCT[CASH] is 1.0."

      - name: verification_averages_each_month_at_its_own_collection_rate
        claim_type: precision
        grounds:
          - "calculations.account_billing_verification"
          - "entities.BillingHistoryRecord.fields.collection_rate"
          - "entities.ServiceAccount.fields.verified_recurring_mrr_cents"
        distinguishing_aspect: "The claim is that verification rounds each month's collection-rate-weighted recurring figure to whole cents BEFORE averaging the months, so rounding the mean of the rates instead of the mean of the rounded months yields a different verified_recurring_mrr_cents."
        excluded_because:
          difficulty_instance: "verification_rounds_each_month_before_averaging"
          rationale: "That \u00a71.8 instance is built exactly on this order of operations: three months at deliberately unequal collection rates whose per-month rounded values average to a figure one cent away from the naive rate-first computation, asserted on both the BillingHistoryRecord rows and the resulting verified_recurring_mrr_cents. Any \u00a71.9 recipe would restate the same arithmetic on the same endpoint pair."

