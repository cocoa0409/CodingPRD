  - { id: ERR_DISEASE_STAGE_MISMATCH, http: 422, condition: "Referral disease_stage does not equal the protocol's required_stage" }
  - { id: ERR_PROTOCOL_CAPACITY_EXCEEDED, http: 409, condition: "enrolled_count is not strictly below capacity" }
  - { id: ERR_PROTOCOL_BUDGET_EXCEEDS_COMMITMENT_SHARE, http: 402, condition: "protocol_budget_cents exceeds the fund's commitment share of net fundraising" }
  - { id: ERR_PROTOCOL_BUDGET_EXHAUSTED, http: 402, condition: "available_cents would not remain strictly positive after the reservation" }
  - { id: ERR_NO_HOUSING_AVAILABLE, http: 409, condition: "The housing selector finds no facility for the required tier that clears capacity, buffers and immunosuppression gating" }
  - { id: ERR_HOUSING_CAPACITY_EXCEEDED, http: 409, condition: "Committed plus scheduled nights plus the facility buffer exceed total_beds at a window endpoint" }
  - { id: ERR_HOUSING_IMMUNOSUPPRESSION_INCOMPATIBLE, http: 422, condition: "An immunosuppressed patient is targeted at a facility whose tier is not immunosuppression_capable" }
  - { id: ERR_HOUSING_FACILITY_UNAVAILABLE, http: 409, condition: "HousingFacility is not in OPEN status" }
  - { id: ERR_STEP_DOWN_NOT_PERMITTED, http: 422, condition: "Housing step-down attempted before immunosuppression has cleared" }
  - { id: ERR_INVALID_VACATE_REASON, http: 422, condition: "vacated_reason is not one of TREATMENT_COMPLETE, TRANSFERRED_AFFILIATE or RELOCATED" }
  - { id: ERR_HOUSING_OCCUPANCY_ACTIVE, http: 409, condition: "A housing assignment for this enrollment is still ACTIVE" }
  - { id: ERR_NO_ACTIVE_HOUSING, http: 409, condition: "The enrollment has no ACTIVE housing assignment" }
  - { id: ERR_OCCUPANCY_NOT_STARTED, http: 409, condition: "start_at is later than the logical clock" }
  - { id: ERR_HOUSING_ASSIGNMENT_NOT_SCHEDULED, http: 409, condition: "HousingAssignment is not in SCHEDULED status" }
  - { id: ERR_HOUSING_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "HousingAssignment is not in ACTIVE status" }
  - { id: ERR_ENROLLMENT_NOT_PENDING_CONSENT, http: 409, condition: "Enrollment is not in PENDING_CONSENT status" }
  - { id: ERR_ENROLLMENT_NOT_ENROLLED, http: 409, condition: "Enrollment is not in ENROLLED status" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE_TREATMENT, http: 409, condition: "Enrollment is not in ACTIVE_TREATMENT status" }
  - { id: ERR_ENROLLMENT_NOT_ON_HIATUS, http: 409, condition: "Enrollment is not in ON_HIATUS status" }
  - { id: ERR_ENROLLMENT_NOT_IN_SURVIVORSHIP, http: 409, condition: "Enrollment is not in SURVIVORSHIP status" }
  - { id: ERR_ENROLLMENT_ACTIVE, http: 409, condition: "The referral's enrollment is already active in treatment or survivorship" }
  - { id: ERR_INVALID_CONSENT_SIGNER, http: 422, condition: "consent_signer does not match the signer required for the child's age" }
  - { id: ERR_BILLING_NOT_PERMITTED, http: 409, condition: "A billable family amount was raised outside the single permitted excess-over-coverage line" }
  - { id: ERR_ONE_TO_ONE_CARE_NOT_ELIGIBLE, http: 422, condition: "A traveling GUARDIAN coverage holder was not cleared for one-to-one care" }
  - { id: ERR_ASSENT_NOT_OBTAINED, http: 409, condition: "Child assent is still PENDING at enrollment completion" }
  - { id: ERR_SUPPORT_BUDGET_EXCEEDED, http: 402, condition: "The final family charge exceeds patient_support_budget_cents plus insurance_coverage_cents" }
  - { id: ERR_PLEDGE_SETTLE_NOT_ACTIVE, http: 409, condition: "FamilySupportPledge is not in ACTIVE status" }
  - { id: ERR_PLEDGE_SETTLE_ENROLLMENT_ACTIVE, http: 409, condition: "The pledge's enrollment is still in a live treatment state" }
  - { id: ERR_TRAVEL_NOT_REQUESTED, http: 409, condition: "TravelArrangement is not in REQUESTED status" }
  - { id: ERR_TRAVEL_NOT_CONFIRMED, http: 409, condition: "TravelArrangement is not in CONFIRMED status" }
  - { id: ERR_TRAVEL_NOT_CANCELLABLE, http: 409, condition: "TravelArrangement is not in REQUESTED or CONFIRMED status" }
  - { id: ERR_TRAVELER_COUNT_RANGE, http: 422, condition: "traveler_count is outside 2..6" }
  - { id: ERR_TRAVEL_ELIGIBILITY_NOT_CONFIRMED, http: 409, condition: "The target enrollment's protocol is not OPEN, so travel eligibility cannot be stamped" }
  - { id: ERR_TRAVEL_COVERAGE_EXPIRED, http: 409, condition: "More than 30 days have elapsed on the logical clock since eligibility_confirmed_at" }
  - { id: ERR_TRAVEL_LEG_OVERLAP, http: 409, condition: "A confirmed or disbursed leg for the same enrollment and mode overlaps the proposed window by a day or more" }
  - { id: ERR_MILESTONE_NOT_DUE, http: 409, condition: "ProtocolMilestone is not in DUE status" }
  - { id: ERR_PRIOR_MILESTONE_NOT_EXECUTED, http: 409, condition: "The immediately preceding milestone of this enrollment has not been executed" }
  - { id: ERR_MILESTONE_REQUIRES_MAIN_CAMPUS, http: 422, condition: "requires_main_campus is true, so the milestone cannot be deferred" }
  - { id: ERR_NO_ACTIVE_AFFILIATION_AGREEMENT, http: 409, condition: "No ACTIVE AffiliationAgreement covers this protocol at the requested affiliate" }
  - { id: ERR_AFFILIATE_NOT_ADJACENT, http: 422, condition: "The affiliate's state is not within one state of the family's household_state_code" }
  - { id: ERR_VISIT_WINDOW_TOO_DISTANT, http: 409, condition: "The milestone instant is more than 14 days after the logical clock" }
  - { id: ERR_MILESTONES_OUTSTANDING, http: 409, condition: "The enrollment still carries a milestone in PENDING, DUE or MISSED status" }
  - { id: ERR_NO_ACTIVE_SURVIVORSHIP_STUDY, http: 409, condition: "No ACTIVE survivorship study exists on the enrollment's protocol" }
  - { id: ERR_SURVIVORSHIP_NOT_GRADUATED, http: 409, condition: "A survivorship enrollment on this patient has not graduated" }
  - { id: ERR_SURVIVORSHIP_NOT_ON_STUDY, http: 409, condition: "SurvivorshipEnrollment is not in ON_STUDY status" }
  - { id: ERR_STUDY_NOT_ACTIVE, http: 409, condition: "SurvivorshipStudy is not in ACTIVE status" }
  - { id: ERR_FOLLOW_UP_WINDOW_VIOLATION, http: 409, condition: "A follow-up visit is logged out of interval order or before the previous visit" }
  - { id: ERR_SIBLING_SERVICE_NOT_ACTIVE, http: 409, condition: "SiblingSupportService is not in ACTIVE status" }
  - { id: ERR_SIBLING_SESSION_LIMIT_REACHED, http: 409, condition: "The sibling service window session limit has already been reached" }
  - { id: ERR_STALE_LEDGER_EPOCH, http: 409, condition: "The supplied ledger_epoch does not match the ledger's current epoch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Donor-funding and platform operator; owns funds, donations, and the test-driving clock and checkpoint endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /research-funds"
      - "POST /research-funds/{fundId}/donations"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-checkpoint"
    shared_operations:
      - "GET /research-funds"
      - "GET /research-funds/{fundId}"
  - name: ProtocolCoordinator
    description: "Protocol owner; drafts, opens, closes and releases protocol holds, and registers milestones"
    identity: opaque
    exclusive_operations:
      - "POST /clinical-protocols"
      - "POST /clinical-protocols/{protocolId}/open"
      - "POST /clinical-protocols/{protocolId}/close"
      - "POST /clinical-protocols/{protocolId}/release-hold"
      - "POST /protocol-holds/{holdId}/release"
      - "POST /enrollments/{enrollmentId}/milestones"
    shared_operations:
      - "GET /clinical-protocols"
      - "GET /clinical-protocols/{protocolId}"
      - "GET /protocol-holds"
  - name: IRBReviewer
    description: "Institutional review officer; raises holds, escalates IRB holds into clinical review locks, and records a child's own assent"
    identity: opaque
    exclusive_operations:
      - "POST /clinical-protocols/{protocolId}/holds"
      - "POST /protocol-holds/{holdId}/escalate"
      - "POST /enrollments/{enrollmentId}/record-arm-assent"
    shared_operations:
      - "GET /protocol-holds"
  - name: IntakeCoordinator
    description: "Referral intake officer; owns the referral funnel, enrollment consent and the treatment lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /referrals"
      - "POST /referrals/{referralId}/screen"
      - "POST /referrals/{referralId}/arrive"
      - "POST /referrals/{referralId}/withdraw"
      - "POST /enrollments/{enrollmentId}/sign-consent"
      - "POST /enrollments/{enrollmentId}/start-treatment"
      - "POST /enrollments/{enrollmentId}/hiatus"
      - "POST /enrollments/{enrollmentId}/resume"
      - "POST /enrollments/{enrollmentId}/complete-treatment"
      - "POST /enrollments/{enrollmentId}/complete-follow-up"
    shared_operations:
      - "GET /referrals"
      - "GET /referrals/{referralId}"
      - "GET /enrollments"
      - "GET /enrollments/{enrollmentId}"
  - name: HousingCoordinator
    description: "Housing officer; owns facilities, assignments and the on-campus to partner step-down path"
    identity: opaque
    exclusive_operations:
      - "POST /housing-facilities"
      - "POST /housing-assignments"
      - "PUT /housing-assignments/{assignmentId}"
      - "POST /housing-assignments/{assignmentId}/activate"
      - "POST /housing-assignments/{assignmentId}/vacate"
      - "POST /housing-assignments/{assignmentId}/cancel"
    shared_operations:
      - "GET /housing-facilities"
      - "GET /housing-facilities/{facilityId}"
      - "GET /housing-assignments"
      - "GET /housing-assignments/{assignmentId}"
  - name: PatientSupportOfficer
    description: "Family-support officer; owns pledges, travel legs, family service allowances and sibling services"
    identity: opaque
    exclusive_operations:
      - "POST /family-support-pledges"
      - "POST /family-support-pledges/{pledgeId}/accrue"
      - "POST /family-support-pledges/{pledgeId}/settle"
      - "POST /family-support-pledges/{pledgeId}/void"
      - "POST /enrollments/{enrollmentId}/travel-arrangements"
      - "POST /travel-arrangements/{travelId}/confirm"
      - "POST /travel-arrangements/{travelId}/disburse"
      - "POST /travel-arrangements/{travelId}/cancel"
      - "POST /family-support-services"
      - "POST /family-support-services/{serviceId}/allowances"
      - "POST /family-service-ledgers/{ledgerId}/freeze"
      - "POST /enrollments/{enrollmentId}/sibling-services"
      - "POST /sibling-support-services/{serviceId}/sessions"
      - "POST /sibling-support-services/{serviceId}/cancel"
    shared_operations:
      - "GET /family-support-pledges"
      - "GET /family-support-pledges/{pledgeId}"
      - "GET /travel-arrangements"
      - "GET /travel-arrangements/{travelId}"
      - "GET /family-support-services"
