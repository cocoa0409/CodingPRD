  # --- Complaints ---
  - method: POST
    path: "/complaint-office/complaints"
    description: "Intake a complaint; auto-creates RegulatoryReferral when channel.is_regulator_portal"
    roles: [IntakeSpecialist, CaseHandler]
    code: 201
    input: [complainant_ref, channel_code, product_code, category_code, narrative, "claimed_loss_cents?", "portal_ref?"]
    output: Complaint
    side_effects:
      - "status=INTAKE; owner_user_id = acting X-User-ID; received_at = logical clock; increments Complaint.version starts at 1"
      - "Product.open_complaint_count incremented by 1; Product.posture recomputed"
      - "If Channel.is_regulator_portal: RegulatoryReferral created (OPEN) with received_via_portal_at = received_at and response_due_at per response_due_at calculation; Append IntakeEvent(REFERRAL_FILED)"
      - "Append IntakeEvent(CREATED)"
      - "ERR_PRODUCT_FROZEN when product posture == FROZEN; ERR_CATEGORY_RETIRED when category retired"

  - method: GET
    path: "/complaint-office/complaints/{complaintId}"
    description: "Get a Complaint (computed ages evaluated at read time)"
    roles: [ComplaintManager, CaseHandler, IntakeSpecialist, QAReviewer, RemediationApprover, ExecutiveReviewer, Auditor]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaint-office/complaints"
    description: "List Complaints (reverse reachability for Complaint.channel_code, Complaint.product_code, Complaint.category_code)"
    roles: [ComplaintManager, CaseHandler, IntakeSpecialist, QAReviewer, RemediationApprover, ExecutiveReviewer, Auditor]
    code: 200
    input: ["status?", "product_code?", "channel_code?", "category_code?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/complaint-office/complaints/{id}/events"
    description: "Audit trail: append-only IntakeEvents of a complaint, ordered by event_at ASC then created_at ASC"
    roles: [ComplaintManager, CaseHandler, QAReviewer, RemediationApprover, ExecutiveReviewer, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "IntakeEvent[]"
    side_effects: []

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/triage"
    description: "INTAKE -> TRIAGED"
    roles: [CaseHandler]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> TRIAGED", "increments Complaint.version by 1", "Append IntakeEvent(STATUS_CHANGED)"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/start_investigation"
    description: "TRIAGED|REOPENED -> INVESTIGATING"
    roles: [CaseHandler]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> INVESTIGATING", "increments Complaint.version by 1", "Append IntakeEvent(STATUS_CHANGED)"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/taxonomy_recodes"
    description: "Recode the complaint's taxonomy category (OCC-guarded)"
    roles: [CaseHandler]
    code: 200
    input: [new_category_code, expected_complaint_version]
    output: Complaint
    side_effects:
      - "category_code updated; increments Complaint.version by 1"
      - "Append IntakeEvent(TAXONOMY_RECODED with old/new codes)"
      - "ERR_STALE_VERSION on version mismatch; ERR_CATEGORY_RETIRED when target retired"

  - method: POST
    path: "/complaint-office/complaints/{id}/rcas"
    description: "Create a RootCauseAnalysis (DRAFT); supersedes any prior DRAFT RCA of the same complaint"
    roles: [CaseHandler]
    code: 201
    input: [verdict, linked_product_code, process_step]
    output: RootCauseAnalysis
    side_effects: ["status=DRAFT", "prior DRAFT RCA of same complaint -> SUPERSEDED"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/draft_response"
    description: "INVESTIGATING -> RESPONSE_DRAFTED"
    roles: [CaseHandler]
    code: 200
    input: [response_text, "response_template_key?"]
    output: Complaint
    side_effects: ["status -> RESPONSE_DRAFTED", "increments Complaint.version by 1", "Append IntakeEvent(RESPONSE_DRAFTED)", "ERR_RCA_REQUIRED without a COMPLETED RCA"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/submit_for_qa"
    description: "RESPONSE_DRAFTED -> RESPONSE_QA"
    roles: [CaseHandler]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> RESPONSE_QA", "increments Complaint.version by 1", "Append IntakeEvent(STATUS_CHANGED)"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/qa_fail"
    description: "RESPONSE_QA -> INVESTIGATING; completes the acting reviewer's OPEN review with FAIL in the same call"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> INVESTIGATING", "increments Complaint.version by 1", "QualityReview -> COMPLETED/FAIL", "Append IntakeEvent(QA_FAILED)", "ERR_SOD_SELF_REVIEW when acting user == owner_user_id"]

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/resolve"
    description: "RESPONSE_QA -> RESOLVED"
    roles: [CaseHandler]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "status -> RESOLVED; resolved_at = clock; retention_purge_at set per retention_purge_at calculation"
      - "Product.open_complaint_count decremented by 1; Product.posture recomputed"
      - "increments Complaint.version by 1"
      - "Append IntakeEvent(STATUS_CHANGED)"

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/reopen"
    description: "RESOLVED -> REOPENED (cyclic loop)"
    roles: [CaseHandler, ComplaintManager]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "status -> REOPENED; resolved_at = null; retention_purge_at = null"
      - "Product.open_complaint_count incremented by 1; Product.posture recomputed"
      - "increments Complaint.version by 1"
      - "Append IntakeEvent(REOPENED)"

  - method: POST
    path: "/complaint-office/complaints/{complaintId}/withdraw"
    description: "Any non-terminal status -> WITHDRAWN"
    roles: [CaseHandler, ComplaintManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> WITHDRAWN", "resolved_at = clock; retention_purge_at set", "Product.open_complaint_count decremented by 1; posture recomputed", "increments Complaint.version by 1", "ERR_REFERRAL_OPEN when a referral is OPEN or REOPENED_BY_REGULATOR"]

  # --- Regulatory Referrals ---
  - method: GET
    path: "/complaint-office/complaints/{id}/referrals"
    description: "List referrals of a complaint (reverse reachability for RegulatoryReferral.complaint_id)"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "RegulatoryReferral[]"
    side_effects: []

  - method: GET
    path: "/complaint-office/referrals/{referralId}"
    description: "Get a RegulatoryReferral"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: []
    output: RegulatoryReferral
    side_effects: []

  - method: POST
    path: "/complaint-office/referrals/{referralId}/submit_response"
    description: "OPEN|REOPENED_BY_REGULATOR -> RESPONSE_SUBMITTED; timeliness derived against response_due_at"
    roles: [CaseHandler]
    code: 200
    input: [response_text]
    output: RegulatoryReferral
    side_effects:
      - "status -> RESPONSE_SUBMITTED; submitted_at = clock; timeliness ON_TIME iff submitted_at <= response_due_at"
      - "Recompute Complaint.timeliness_score"
      - "increments RegulatoryReferral.version by 1"
      - "Append IntakeEvent(REFERRAL_RESPONDED) on parent complaint"

  - method: POST
    path: "/complaint-office/referrals/{referralId}/close"
    description: "RESPONSE_SUBMITTED -> CLOSED_BY_REGULATOR"
    roles: [ComplaintManager]
    code: 200
    input: []
    output: RegulatoryReferral
    side_effects: ["status -> CLOSED_BY_REGULATOR", "increments RegulatoryReferral.version by 1"]

  - method: POST
    path: "/complaint-office/referrals/{referralId}/regulator_reopen"
    description: "RESPONSE_SUBMITTED -> REOPENED_BY_REGULATOR; cascades parent complaint RESOLVED -> REOPENED"
    roles: [ComplaintManager]
    code: 200
    input: []
    output: RegulatoryReferral
    side_effects:
      - "status -> REOPENED_BY_REGULATOR"
      - "Cascade hop 2: parent Complaint if RESOLVED -> REOPENED (resolved_at = null, retention_purge_at = null, increments Complaint.version by 1)"
      - "Cascade hop 3: when hop 2 fired, Product.open_complaint_count incremented by 1 and Product.posture recomputed"
      - "increments RegulatoryReferral.version by 1"

  # --- RCAs ---
  - method: GET
    path: "/complaint-office/complaints/{id}/rcas"
