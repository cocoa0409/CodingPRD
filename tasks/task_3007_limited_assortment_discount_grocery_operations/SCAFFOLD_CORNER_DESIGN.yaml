scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: category_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Category.fields.sku_cap, entities.Category.fields.active_sku_count, entities.Category.fields.status]
        distinguishing_aspect: "Omitting sku_cap yields default 2, active_sku_count 0, status OPEN; system fields id/created_at/version present with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/categories"
              payload: { code: "DAIRY", name: "Dairy" }
              as: CategoryManager
              captures: { cap: $.data.sku_cap, cnt: $.data.active_sku_count, st: $.data.status, ver: $.data.version }
          assert:
            - "sku_cap == 2 (default applied)"
            - "active_sku_count == 0"
            - "status == OPEN (initial state)"
            - "version == 1 and id is a prefix-free UUID"
      - name: entity_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Store]
        distinguishing_aspect: "GET /v1/stores/{id} echoes stored fields plus computed ledger fields initialized to zero."
        test_recipe:
          setup: ["store created"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "GET /v1/stores/${store}"
              as: OperationsAdmin
              captures: { name: $.data.name, liab: $.data.coin_liability_cents, pct: $.data.finds_sell_through_pct }
          assert:
            - "name == 'Store One'"
            - "coin_liability_cents == 0, refund_liability_cents == 0, finds_sell_through_pct == 0.0"
      - name: list_pagination_envelope_fields
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /v1/categories?limit=1&offset=0 returns meta/response_type/data array plus pagination fields total_count/has_more consistent with limit/offset."
        test_recipe:
          setup: ["two categories exist"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
            - call: "POST /v1/categories"
              payload: { code: "C2", name: "Cat Two", sku_cap: 3 }
              as: CategoryManager
          trigger:
            - call: "GET /v1/categories"
              payload: { limit: 1, offset: 0 }
              as: CategoryManager
              captures: { n: $.meta }
          assert:
            - "data is an array of length 1"
            - "total_count == 2 and has_more == true"
            - "response_type == 'array' and meta contains api_request_id and api_request_timestamp"
      - name: get_missing_category_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/categories/00000000-0000-4000-8000-000000000000"
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404, response_type == 'error'"
      - name: product_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Product, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/products without sku_code yields 400 ERR_VALIDATION before any existence or business check."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", name: "No SKU", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400"
      - name: product_invalid_kind_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.kind, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "kind 'MEGA' is not in {CORE, FINDS} -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-9", name: "Bad Enum", kind: "MEGA", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400"
      - name: cart_coin_event_immutable_no_version
        claim_type: immutability
        grounds: [entities.CartCoinEvent]
        distinguishing_aspect: "common_fields: false — CartCoinEvent carries id and created_at only: no version, no updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup: ["store exists"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "INSERT", coin_count: 3 }
              as: StoreManager
              as_user_id: ${store}
              captures: { ev: $.data.id }
          assert:
            - "event has id and created_at"
            - "event has no version or updated_at field"
            - "no PATCH/DELETE endpoint exists for /v1/stores/{id}/cart-coin-events"
      - name: product_computed_supplier_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.Product.fields.primary_supplier_id, entities.Product.fields.status]
        distinguishing_aspect: "Computed/system fields on Product are server-owned: creation always yields status PROPOSED with null primary_supplier_id/secondary_supplier_id regardless of context; only the tender award system transition populates them."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { p_status: $.data.status, p_prim: $.data.primary_supplier_id, p_sec: $.data.secondary_supplier_id }
          assert:
            - "status == PROPOSED (system-owned initial state)"
            - "primary_supplier_id is null and secondary_supplier_id is null at creation (computed fields)"
      - name: employee_requires_existing_store_parent
        claim_type: parent_relationships
        grounds: [entities.Employee.fields.store_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /v1/stores/{id}/employees with a random store id yields 404 ERR_NOT_FOUND (existence validated on path left-to-right)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/stores/00000000-0000-4000-8000-000000000000/employees"
              payload: { name: "Ghost", role: "CASHIER" }
              as: StoreManager
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: tender_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.SupplierTender]
        distinguishing_aspect: "Newly created tender has status DRAFT and version 1."
        test_recipe:
          setup: ["category and product exist"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { st: $.data.status, ver: $.data.version }
          assert:
            - "status == DRAFT and version == 1"
      - name: claim_terminal_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.QualityClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Every action on a PAID claim (review/approve/dispute/reject/pay/rescind) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim fully PAID"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 1, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "OTHER" }
              as: CustomerServiceAgent
              captures: { cl: $.data.id }
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl}/approve"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl}/pay"
              as: CustomerServiceAgent
          trigger:
            - call: "POST /v1/claims/${cl}/dispute"
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 (PAID is terminal)"
      - name: double_scan_second_shift_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RegisterShift, "errors[ERR_SHIFT_NOT_OPEN]"]
        distinguishing_aspect: "Scan against a CLOSED shift is rejected with ERR_SHIFT_NOT_OPEN; items_scanned unchanged."
        test_recipe:
          setup: ["closed shift with items_scanned 10"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/stores/${store}/employees"
              payload: { name: "Cash One", role: "CASHIER" }
              as: StoreManager
              as_user_id: ${store}
              captures: { emp: $.data.id }
            - call: "POST /v1/stores/${store}/register-shifts"
              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store}
              captures: { shift: $.data.id }
            - call: "POST /v1/register-shifts/${shift}/scan"
              payload: { items_count: 10 }
              as: Cashier
              as_user_id: ${emp}
            - call: "POST /v1/register-shifts/${shift}/close"
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/register-shifts/${shift}/scan"
              payload: { items_count: 5 }
              as: Cashier
              as_user_id: ${emp}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_NOT_OPEN, HTTP 409"
            - "RegisterShift.${shift}.items_scanned remains 10"
      - name: discontinue_nonactive_product_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Product.ACTIVE_to_DISCONTINUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Discontinuing a PROPOSED product violates the ACTIVE precondition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["PROPOSED product exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /v1/products/${prod}/discontinue"
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
      - name: sell_side_effects_applied
        claim_type: side_effect_execution
        grounds: [state_machines.FindsAllocation, endpoints]
        distinguishing_aspect: "A partial sell increments sold_quantity, decrements remaining_quantity, bumps allocation version, and decrements FindsBuy.remaining_quantity while both stay ON_SALE."
        test_recipe:
          setup: ["ACTIVE FINDS product, one store, buy of 5 allocated and ON_SALE, clock inside window"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 5 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
            - call: "POST /v1/finds-buys/${buy}/activate"
              as: CategoryManager
            - call: "GET /v1/finds-buys/${buy}/allocations"
              as: CategoryManager
              captures: { alloc: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /v1/allocations/${alloc}/sell"
              payload: { quantity: 2 }
              as: StoreManager
              as_user_id: ${store}
              captures: { sold: $.data.sold_quantity, rem: $.data.remaining_quantity, st: $.data.status, ver: $.data.version }
            - call: "GET /v1/finds-buys/${buy}"
              as: CategoryManager
              captures: { buy_rem: $.data.remaining_quantity, buy_st: $.data.status }
          assert:
            - "FindsAllocation sold_quantity == 2, remaining_quantity == 3, status == ON_SALE, version incremented"
            - "FindsBuy.remaining_quantity == 3, status == ON_SALE"
      - name: retender_requires_insufficient_eligible_sources
        claim_type: precondition_enforcement
        grounds: [state_machines.SupplierTender.EVALUATING_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retender with 2 ELIGIBLE bids from distinct suppliers violates the insufficient-sources precondition -> ERR_INVALID_STATE (no cycle when dual-source satisfied)."
        test_recipe:
          setup: ["tender EVALUATING with two ELIGIBLE bids from distinct suppliers"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/tenders/${tend}/retender"
              as: ProcurementLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 (dual-source satisfied, retender forbidden)"
      - name: claim_review_idempotent_second_attempt_rejected
        claim_type: idempotency
        grounds: [state_machines.QualityClaim.FILED_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating review on an already UNDER_REVIEW claim (same trigger twice) is rejected with ERR_INVALID_STATE; no duplicate transition."
        test_recipe:
          setup: ["claim FILED"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 1, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "OTHER" }
              as: CustomerServiceAgent
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "first review -> UNDER_REVIEW; second review -> ERR_INVALID_STATE, HTTP 409"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: labor_window_cost_constants_applied
        claim_type: constants_applied
        grounds: [calculations.labor_window_cost]
        distinguishing_aspect: "2-hour STOCKER window costs 2.00 * 1800 = 3600 cents; CASHIER would be 3400 and SHIFT_LEAD 4800 for the same span."
        test_recipe:
          setup: ["store exists"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { cost: $.data.cost_cents }
          assert:
            - "cost_cents == 3600 (2.00 hours * 1800 cents/hour STOCKER rate)"
      - name: cart_reconciliation_input_set_all_events
        claim_type: input_set_filtering
        grounds: [calculations.cart_coin_reconciliation]
        distinguishing_aspect: "Reconciliation includes every event type: INSERT 10, RETURN 4, CORRAL_COLLECT 3, AUDIT_ADJUST -1 -> outstanding 2, liability 50; computed read matches per-type aggregates."
        test_recipe:
          setup: ["store exists"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "INSERT", coin_count: 10 }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "RETURN", coin_count: 4 }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "CORRAL_COLLECT", coin_count: 3 }
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/stores/${store}/cart-coin-events"
              payload: { event_type: "AUDIT_ADJUST", coin_count: -1 }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "GET /v1/stores/${store}/cart-reconciliation"
              as: StoreManager
              as_user_id: ${store}
              captures: { ins: $.data.coins_inserted, ret: $.data.coins_returned, col: $.data.coins_collected, adj: $.data.coins_adjusted, out: $.data.coins_outstanding, liab: $.data.coin_liability_cents }
          assert:
            - "coins_inserted == 10, coins_returned == 4, coins_collected == 3, coins_adjusted == -1"
            - "coins_outstanding == 2 (10 - 4 - 3 - 1)"
            - "coin_liability_cents == 50 (2 * 25)"
      - name: scan_rate_precision_two_decimals
        claim_type: precision
        grounds: [calculations.scan_rate]
        distinguishing_aspect: "500 items over 1799 seconds: 500*3600/1799 = 1000.555... -> round_half_up to 1000.56 at exactly 2 decimal places."
        test_recipe:
          setup: ["shift opened 08:00:00, 500 items scanned, clock at 08:29:59"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/stores/${store}/employees"
              payload: { name: "Cash One", role: "CASHIER" }
              as: StoreManager
              as_user_id: ${store}
              captures: { emp: $.data.id }
            - call: "POST /v1/stores/${store}/register-shifts"
              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store}
              captures: { shift: $.data.id }
            - call: "POST /v1/register-shifts/${shift}/scan"
              payload: { items_count: 500 }
              as: Cashier
              as_user_id: ${emp}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:29:59Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /v1/register-shifts/${shift}/close"
              as: StoreManager
              as_user_id: ${store}
              captures: { rate: $.data.final_scan_rate, comp: $.data.compliance }
          assert:
            - "final_scan_rate == 1000.56 (round_half_up 2dp over 1799s)"
            - "compliance == COMPLIANT"
      - name: double_refund_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.double_refund]
        excluded_because:
          difficulty_instance: double_refund_standard_vs_guarantee_diverge
          rationale: "Variant divergence asserted with literal values in the named 1.8 instance."
      - name: scan_rate_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.scan_rate]
        excluded_because:
