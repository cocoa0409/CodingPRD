          setup:
            - 'catalog holds MAT-316L, TECH-FILT-A (FILTRATION) and TECH-DIS-A (DISINFECTION)'
            - 'one Project with an ACCEPTED profile at design_flow_mgd 4.000, peak_factor 1.500'
