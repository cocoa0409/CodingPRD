            - "Clock advanced to 2026-07-01: month diff 13 > 12 lapses all four -> staffing NONE -> effective NONE, notification created (cause STAFFING)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2025-06-10", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2025-06-10", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2025-06-10", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2025-06-10", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AirportManager }
            - { call: "GET /arff/index-downgrade-notifications", as: ArffChief, captures: { n_id: "$.data[0].id", n_cause: "$.data[0].cause", n_down: "$.data[0].downgraded_index" } }
          trigger:
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-06-20", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-06-20", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-06-20", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/airport-profile", as: ArffChief, captures: { p_staff: $.data.supported_index_by_staffing, p_eff: $.data.effective_index, p_comp: $.data.index_compliance_status } }
            - { call: "GET /arff/index-downgrade-notifications/${n_id}", as: ArffChief, captures: { n_status: $.data.status } }
          assert:
            - "Setup link verified: ${n_cause} == \"STAFFING\" and ${n_down} == \"NONE\""
            - "Firefighter.${ff1}.is_training_current == true  # link 1"
            - "AirportOpsProfile.supported_index_by_staffing == \"C\"  # link 2: 3 ready >= 3 but < 4"
