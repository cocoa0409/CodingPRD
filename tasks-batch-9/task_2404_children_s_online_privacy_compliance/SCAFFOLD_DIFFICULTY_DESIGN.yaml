              payload: { name: "Near Miss Network", operator_organization: "Near Miss Media", service_category: "VIDEO_PLATFORM", subject_matter_code: "TEEN_LIFESTYLE" }
              as: ComplianceOfficer
              captures: { svc_f: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_f}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_f}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 4000, users_under_13: 1599, sample_verified: true }
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services/${svc_e}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { err_no_evidence: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_e}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 4000, users_under_13: 1600, sample_verified: false }
              as: ComplianceOfficer
              captures: { unverified_row: $.data.id }
            - call: "GET /online-services/${svc_e}"
              payload: {}
              as: ComplianceOfficer
              captures: { share_after_unverified: $.data.audience_child_share, score_after_unverified: $.data.design_score }
            - call: "POST /online-services/${svc_e}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { err_still_no_evidence: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_e}", evidence_kind: "DESIGN_FACTOR", factor_code: "VISUAL_CONTENT", rating: "ABSENT", evidence_note: "no child-oriented visual language at all" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_e}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_e: $.data.determination_status, score_e: $.data.design_score, variant_e: $.data.determination_variant_applied }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_e}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", total_users: 4000, users_under_13: 1600, sample_verified: true }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_e}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_e2: $.data.determination_status, share_e2: $.data.audience_child_share, variant_e2: $.data.determination_variant_applied }
            - call: "POST /online-services/${svc_f}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_f: $.data.determination_status, share_f: $.data.audience_child_share }
          assert:
            - "${err_no_evidence} == ERR_INSUFFICIENT_EVIDENCE with HTTP 422"
            - "DeterminationEvidence.${unverified_row}.sample_verified == false and DeterminationEvidence.${unverified_row}.evidence_sequence == 1 (the row IS stored)"
            - "${share_after_unverified} == null and ${score_after_unverified} == 0.00"
            - "${err_still_no_evidence} == ERR_INSUFFICIENT_EVIDENCE with HTTP 422 (an unverified PANEL sample is not evidence)"
            - "${score_e} == 0.00 (VISUAL_CONTENT ABSENT contributes 0.00 while still supplying present_points)"
            - "${variant_e} == DESIGN_FIRST and ${det_e} == GENERAL_AUDIENCE (a zero score is a determination, not an error)"
            - "${share_e2} == 0.4000 (1600/4000 over verified PANEL rows only; the unverified row is excluded from the aggregate)"
            - "${variant_e2} == AUDIENCE_FIRST and ${det_e2} == CHILD_DIRECTED_PRIMARY (0.4000 >= PRIMARY_SHARE_THRESHOLD 0.4000, inclusive)"
            - "${share_f} == 0.3998 and ${det_f} == MIXED_AUDIENCE (0.3998 < 0.4000 but >= MIXED_SHARE_THRESHOLD 0.2000)"
            - "One under-13 user out of 4000 separates CHILD_DIRECTED_PRIMARY from MIXED_AUDIENCE"
            - "OnlineService.${svc_f}.design_score == 0.60 yet the share, not the design, decides under AUDIENCE_FIRST"

      - name: exposure_points_exact_forty_restricts_and_zero_point_cdn_does_not
