              payload: { name: "Page Signs", contact_email: "pg@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "MONUMENT", requested_area_sqft: 50, requested_height_ft: 22, requested_setback_ft: 12, requested_illumination: "EXTERNAL" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /applications?parcel_id=${parcel_id}&limit=1&offset=0"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "response data length == 1"

      - name: list_billboard_leases_by_billboard_fk
        claim_type: Cross-reference link
        grounds: ["endpoints.GET_/billboard-leases", "entities.BillboardLease.fields.billboard_id"]
        distinguishing_aspect: "GET /billboard-leases?billboard_id= returns the leases for that billboard (FK reverse-reachability)."
        test_recipe:
          setup: ["A registered billboard with one ACTIVE lease."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 60, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
