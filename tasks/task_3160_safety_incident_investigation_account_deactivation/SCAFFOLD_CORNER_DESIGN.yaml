# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3160_safety_incident_investigation_account_deactivation
#
# Breadth probe. Every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Sections and claim_type values come from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: account_create_stamps_posture_and_policy_generation
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints.POST_/safety/accounts
          - entities.Account.fields.policy_generation_index
        distinguishing_aspect: "An account created with only the four input fields comes back 201 with every derived field at its initialization value, and policy_generation_index is stamped from the region's published policy rather than defaulting to zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published with knob_generation_index 3. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3", knob_generation_index: 3 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Ana Ruiz", contact_email: "ana.ruiz@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_created: $.data.created_at, acct_v: $.data.version, acct_posture: $.data.safety_posture, acct_tier: $.data.risk_tier, acct_policy_gen: $.data.policy_generation_index, acct_drift: $.data.three_year_drift_last_run_index, acct_standing: $.data.standing_enforcement_count }
          assert:
            - "the response status is 201 and response_type is object"
            - "Account.${acct_id}.status == \"ACTIVE\" and Account.${acct_id}.safety_posture == \"OPEN\""
            - "Account.${acct_id}.risk_score == 0 and Account.${acct_id}.risk_tier == \"TIER_LOW\""
            - "Account.${acct_id}.standing_enforcement_count == 0 and Account.${acct_id}.deactivation_count == 0 and Account.${acct_id}.prior_reinstatement_count == 0"
            - "Account.${acct_id}.version == 1 and Account.${acct_id}.policy_generation_index == 3"
            - "Account.${acct_id}.three_year_drift_last_run_index == Account.${acct_id}.policy_generation_index == 3"
            - "the response carries a non-null UUID id with no type prefix, plus created_at and updated_at"

      - name: driver_account_create_synthesizes_continuous_monitor_check
        claim_type: Parent Relationships
        grounds:
          - entities.BackgroundCheck
          - endpoints.GET_/safety/accounts/{id}/background-checks
          - state_machines.BackgroundCheck
        distinguishing_aspect: "Only a DRIVER account has a CONTINUOUS_MONITOR background check synthesized at creation, and the synthesized row is discoverable through the account's reverse-reachability GET rather than only through the create response."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Bill Osei", contact_email: "bill.osei@example.com" }
              as: PlatformAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Cara Vega", contact_email: "cara.vega@example.com" }
              as: PlatformAdmin
              captures: { rid_id: $.data.id }
          trigger:
            - call: "GET /safety/accounts/${drv_id}/background-checks"
              payload: { check_kind: "CONTINUOUS_MONITOR" }
              as: BackgroundReviewer
              captures: { dc_check_id: "$.data[0].id", dc_kind: "$.data[0].check_kind", dc_status: "$.data[0].check_status", dc_adj: "$.data[0].adjudication", dc_gen: "$.data[0].monitor_generation" }
            - call: "GET /safety/accounts/${rid_id}/background-checks"
              payload: {}
              as: BackgroundReviewer
              captures: { rider_check_count: "$.data" }
          assert:
            - "the DRIVER account has exactly one synthesized BackgroundCheck with check_kind == \"CONTINUOUS_MONITOR\" and check_status == \"SCHEDULED\""
            - "the synthesized row has adjudication == \"PENDING\" and monitor_generation == 0, and its scheduled_due_at is not null"
            - "the RIDER account has zero BackgroundCheck rows, so synthesis is DRIVER-only"
            - "the synthesized row is reachable through both GET /safety/accounts/${drv_id}/background-checks and GET /safety/background-checks?account_id=${drv_id}"

      - name: explicit_hostile_risk_score_input_is_ignored_on_cluster_create
        claim_type: Computed Fields
        grounds:
          - entities.DeviceCluster.fields.aggregate_cluster_risk
          - endpoints.POST_/safety/device-clusters
        distinguishing_aspect: "A client-supplied aggregate_cluster_risk is accepted by the input schema and then unconditionally overwritten to 0, so the computed field cannot be seeded from the outside."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-hostile", region_code: "R1", aggregate_cluster_risk: 99999 }
              as: PlatformAdmin
              captures: { clust_id: $.data.id, clust_risk: $.data.aggregate_cluster_risk, clust_count: $.data.clustered_actor_incident_count, clust_status: $.data.status, clust_v: $.data.version }
          assert:
            - "the response status is 201"
            - "DeviceCluster.${clust_id}.aggregate_cluster_risk == 0, not 99999"
            - "DeviceCluster.${clust_id}.clustered_actor_incident_count == 0 and DeviceCluster.${clust_id}.status == \"OPEN\""
            - "DeviceCluster.${clust_id}.version == 1 and DeviceCluster.${clust_id}.cluster_risk_generation_index == 1"

      - name: incident_severity_is_derived_and_supplied_input_is_ignored
        claim_type: Computed Fields
        grounds:
          - entities.SafetyIncident.fields.severity
          - calculations.incident_severity_classification
          - endpoints.POST_/safety/incidents
        distinguishing_aspect: "The intake input schema declares no severity field at all, so a S1-category incident remains S1 while a S4-category incident is S4 on the same endpoint — the client has no lever on the band except aggravator_codes."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. One ACTIVE rider account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Dana Ille", contact_email: "dana.ille@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "PROPERTY_DAMAGE" }
              as: SafetyInvestigator
              captures: { s1_inc: $.data.id, s1_sev: $.data.severity, s1_flag: $.data.derivative_severity_flagged }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { s4_inc: $.data.id, s4_sev: $.data.severity, s4_flag: $.data.derivative_severity_flagged, s4_count: $.data.prior_incident_count_at_intake }
          assert:
            - "SafetyIncident.${s1_inc}.severity == \"S1\" and SafetyIncident.${s1_inc}.derivative_severity_flagged == false"
            - "SafetyIncident.${s4_inc}.severity == \"S4\" and SafetyIncident.${s4_inc}.derivative_severity_flagged == false, because no aggravator saturated the band"
            - "SafetyIncident.${s4_inc}.prior_incident_count_at_intake == 1, counting only the incident created strictly before it"
            - "both incidents start at incident_status == \"OPEN\" and decision_category == \"PENDING\""

      - name: evidence_item_get_with_an_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/safety/account-device-links/{id}
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on a path segment produces ERR_RESOURCE_NOT_FOUND with HTTP 404 rather than a 400, on an entity whose collection GET is filtered rather than nested."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. No account-device link has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
          trigger:
            - call: "GET /safety/account-device-links/7f3a91c4-0b2e-4d55-9a10-6c8e2f4b1d30"
              payload: {}
              as: SafetyOperationsLead
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response status is 404 and response_type is error"
            - "the response carries error_id == \"ERR_RESOURCE_NOT_FOUND\""
            - "the error body carries a non-null message string and the meta block still carries api_request_id and api_request_timestamp"

      - name: incidents_list_paginates_filtered_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/safety/incidents
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With four incidents across two severities, limit=2&offset=0 returns 2 rows with total_count 4 and has_more true while a severity filter narrows total_count to the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. One ACTIVE rider account with four incidents: two S4 and two S1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Elias Nord", contact_email: "elias.nord@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SEXUAL_MISCONDUCT" }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PROPERTY_DAMAGE" }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PROPERTY_DAMAGE" }
              as: SafetyInvestigator
          trigger:
            - call: "GET /safety/incidents"
              payload: { account_id: "${acct_id}", limit: 2, offset: 0 }
              as: SafetyInvestigator
              captures: { page_ids: "$.data[0].id", page_status: "$.data[0].incident_status" }
            - call: "GET /safety/incidents"
              payload: { account_id: "${acct_id}", severity: "S4" }
              as: SafetyInvestigator
              captures: { s4_first: "$.data[0].severity", s4_ref: "$.data[0].account_id" }
          assert:
            - "the unpaginated read returns exactly 4 rows with total_count == 4 and has_more == false"
            - "limit=2&offset=0 returns exactly 2 rows with total_count == 4 and has_more == true"
            - "the severity=S4 filter returns exactly 2 rows and total_count == 2, so total_count counts the filtered set rather than the whole table"
            - "every returned row carries incident_status == \"OPEN\" and account_id == ${acct_id}"
            - "the default page size applies when limit is omitted, i.e. the request with no query parameters returns all 4 rows because 4 < the default limit of 10"

      - name: incident_report_from_third_party_requires_null_reporter_account
        claim_type: Required Fields
        grounds:
          - validations[priority=19]
          - errors[ERR_REPORTER_ACCOUNT_MISMATCH]
          - entities.SafetyIncident.fields.reporter_account_id
        distinguishing_aspect: "The reporter_account_id field is optional in the input schema but conditionally required by reporter_type, so the same omission is legal for THIRD_PARTY and illegal for RIDER."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. One ACTIVE rider account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Fada Onyeka", contact_email: "fada.onyeka@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION" }
              as: SafetyInvestigator
              captures: { tp_inc: $.data.id, tp_reporter: $.data.reporter_account_id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", incident_category: "SAFETY_VIOLATION" }
              as: SafetyInvestigator
              captures: { mismatch_err: $.data.error_id }
          assert:
            - "the THIRD_PARTY report is accepted with 201 and SafetyIncident.${tp_inc}.reporter_account_id is null"
            - "the RIDER report with reporter_account_id omitted is refused with error_id == \"ERR_REPORTER_ACCOUNT_MISMATCH\" with HTTP 422"
            - "the refusal is a conditional-field failure, not a missing-required-field failure, because reporter_account_id is declared optional in the endpoint input schema"
            - "the refused RIDER report created no SafetyIncident row, so GET /safety/incidents?account_id=${acct_id} still returns exactly 1 row"

      - name: trip_lifecycle_requires_the_acting_driver_to_own_the_trip
        claim_type: Type Constraints
        grounds:
          - entities.Trip.fields.status
          - state_machines.Trip.transitions.REQUESTED_to_COMPLETED_PENDING
          - validations[priority=2]
        distinguishing_aspect: "Trip completion is gated on the acting Driver's account id matching the trip's driver_account_id, so the same trip completes for its own driver and is refused for a different driver account."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. Two ACTIVE driver accounts and one ACTIVE rider account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Gita Rao", contact_email: "gita.rao@example.com" }
              as: PlatformAdmin
              captures: { drv1: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Hugo Marsh", contact_email: "hugo.marsh@example.com" }
              as: PlatformAdmin
              captures: { drv2: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Iris Bell", contact_email: "iris.bell@example.com" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /safety/trips"
              payload: { rider_account_id: "${rid}", driver_account_id: "${drv1}", region_code: "R1", requested_at: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { trip_id: $.data.id, trip_status: $.data.status, trip_completed: $.data.completed_at }
          trigger:
            - call: "POST /safety/trips/${trip_id}/complete-start"
              payload: {}
              as: Driver
              as_user_id: "${drv2}"
              captures: { foreign_err: $.data.error_id }
          assert:
            - "the trip is created at Trip.${trip_id}.status == \"REQUESTED\" with completed_at null"
            - "the completion-start attempted by a driver account that is not the trip's driver is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "Trip.${trip_id}.status is still \"REQUESTED\" after the refusal"
            - "GET /safety/trips?driver_account_id=${drv1} returns exactly 1 row and GET /safety/trips?driver_account_id=${drv2} returns 0 rows"

      - name: platform_policy_defaults_are_applied_for_every_omitted_threshold
        claim_type: Defaults
        grounds:
          - entities.PlatformPolicy
          - endpoints.POST_/safety/platform-policies
        distinguishing_aspect: "A policy created with only region_code and sd_floor_severity carries the declared default for all thirteen optional knobs, and both generation counters start at 1 rather than 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R2", sd_floor_severity: "S2" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id, d_sd_enabled: $.data.sd_floor_enabled, d_window: $.data.rollup_window_days, d_thresh: $.data.rollup_threshold, d_watch: $.data.cluster_watchlist_threshold, d_purge: $.data.cluster_purge_threshold, d_esc: $.data.escalation_enabled, d_baseline: $.data.expedite_appeal_baseline_count, d_exp: $.data.expedite_review_days, d_std: $.data.standard_review_days, d_appeal: $.data.appeal_window_days, d_rescreen: $.data.rescreen_refresh_days, d_ack: $.data.continuous_monitor_ack_deadline_days, d_rev_gen: $.data.review_generation_index, d_knob_gen: $.data.knob_generation_index }
          assert:
            - "PlatformPolicy.${pol_id}.sd_floor_enabled == true and PlatformPolicy.${pol_id}.escalation_enabled == true"
            - "PlatformPolicy.${pol_id}.rollup_window_days == 30 and PlatformPolicy.${pol_id}.rollup_threshold == 3"
            - "PlatformPolicy.${pol_id}.cluster_watchlist_threshold == 2 and PlatformPolicy.${pol_id}.cluster_purge_threshold == 2400"
            - "PlatformPolicy.${pol_id}.expedite_appeal_baseline_count == 5, expedite_review_days == 14 and standard_review_days == 30"
            - "PlatformPolicy.${pol_id}.appeal_window_days == 30, rescreen_refresh_days == 548 and continuous_monitor_ack_deadline_days == 7"
            - "PlatformPolicy.${pol_id}.review_generation_index == 1 and PlatformPolicy.${pol_id}.knob_generation_index == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: incident_decision_from_open_state_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SafetyIncident
          - state_machines.SafetyIncident.transitions.PENDING_DECISION_to_DECIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An incident still at OPEN has no declared edge to DECIDED, so a decision attempted without the investigation round trip is refused and the account status is left untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S3. One ACTIVE driver account with one OPEN S4 incident that was never held."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Jonas Weiss", contact_email: "jonas.weiss@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
          trigger:
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "DEACTIVATED", decision_basis: "Attempted straight from intake without any investigation round trip at all.", expected_incident_version: "${inc_v}" }
              as: SafetyInvestigator
              captures: { err_id: $.data.error_id }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { after_status: $.data.status, after_standing: $.data.standing_enforcement_count }
          assert:
            - "the decision is refused with error_id == \"ERR_INVALID_STATE\" with HTTP 409"
            - "SafetyIncident.${inc_id}.incident_status is still \"OPEN\""
            - "Account.${acct_id}.status is still \"ACTIVE\" and Account.${acct_id}.standing_enforcement_count == 0, so no EnforcementAction was created"
            - "the superseded hold path is still available: POST /safety/incidents/${inc_id}/hold from the same state is accepted"

      - name: incident_hold_is_idempotent_on_a_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.SafetyIncident.transitions.OPEN_to_INVESTIGATING
          - state_machines.Account.transitions.ACTIVE_to_UNDER_HOLD
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Repeating the hold trigger after the first one succeeded is refused because INVESTIGATING has no self-edge on the hold endpoint, and the account is not double-suppressed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S3. One ACTIVE driver account with one OPEN S4 incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Kira Sandoval", contact_email: "kira.sandoval@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
