# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2520_cosmetics_facility_registration_product_listing
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only; deleting this file changes no declared behavior.
#
# Conventions used by every chain below:
#   * the logical clock starts at 2026-08-01T00:00:00Z (see the description of
#     POST /cosmetics/_clock/set_current_utc); a facility approved before any
#     clock move therefore owns the INITIAL period 2026-08-01 .. 2028-07-31 with
#     renewal_window_open_date 2028-05-02 and grace_end_date 2028-09-29.
#   * FacilityRegistrant calls carry as_user_id = the Facility.id; a
#     ResponsiblePersonAgent carries as_user_id = the ResponsiblePerson.id
#     (validations[priority=13]); opaque roles carry pinned audit ids
#     (RVW-1/RVW-2 reviewers, OFF-1/OFF-2 officers, OPS-1 operator) so the two
#     segregation-of-duties rules in §1.7 are observable.
#   * every numeric assert below was computed by executing the relevant
#     calculations[].formula with Decimal/ROUND_HALF_UP before being written.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: substantiation_full_deficient_then_screening_adequate_on_one_dossier
        grounds:
          - calculations.substantiation_adequacy_score
          - state_machines.SafetySubstantiation.SUBMITTED_to_DEFICIENT
          - state_machines.SafetySubstantiation.DEFICIENT_to_SUBMITTED
          - state_machines.SafetySubstantiation.SUBMITTED_to_ADEQUATE
          - state_machines.ProductListing.UNDER_SUBSTANTIATION_to_SUBSTANTIATION_FAILED
          - entities.SafetySubstantiation.fields.adequacy_score
          - entities.ToxicologicalReviewItem.fields.full_contribution
        distinguishing_aspect: |
          The dual variant lives on SafetySubstantiation (toxicological evidence scoring): the SAME
          four review items score 45.00 under review_mode FULL (read-across items halved to 10.00
          each, grouped and capped) and 75.00 under review_mode SCREENING (raw weight x credential
          factor, no discount, no cap), so one identical evidence set is DEFICIENT under one variant
          and ADEQUATE under the other, with a pinned delta of exactly 30.00.
        test_recipe:
          setup:
            - "logical clock untouched at 2026-08-01T00:00:00Z"
            - "one REGISTERED facility with compliance_posture OPEN"
            - "one ResponsiblePerson and one DRAFT consumer listing (category 07A, LEAVE_ON) with a single non-allergen, non-data-gap ingredient, so SafetySubstantiation.data_gap_present is false and a SCREENING decision is admissible under validations[priority=36]"
            - "one SUBMITTED SafetySubstantiation carrying exactly four ToxicologicalReviewItem rows: READ_ACROSS_ANALOG/BOARD_CERTIFIED_TOXICOLOGIST x3 and IN_VITRO_TOXICOLOGY/QUALIFIED_SAFETY_ASSESSOR x1"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "GLYCERIN", function_code: "OTHER", concentration_pct: 3.5, is_fragrance_allergen: false, label_disclosed: false, is_data_gap_flag: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr R Okafor", assessment_basis: "PRODUCT_SPECIFIC" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id, gap_flag: $.data.data_gap_present }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "READ_ACROSS_ANALOG", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "Analog dossier A-1" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { item_ra1_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "READ_ACROSS_ANALOG", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "Analog dossier A-2" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { item_ra2_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "READ_ACROSS_ANALOG", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "Analog dossier A-3" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { item_ra3_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "QUALIFIED_SAFETY_ASSESSOR", citation: "OECD 439 report" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { item_iv_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { full_score: $.data.adequacy_score }
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "SCREENING" }
              as: RegulatoryReviewer
              as_user_id: "RVW-2"
              captures: { screening_score: $.data.adequacy_score }
          assert:
            - "SafetySubstantiation.${sub_id}.data_gap_present == false"
            - "after trigger[0]: SafetySubstantiation.${sub_id}.adequacy_score == 45.00"
            - "after trigger[0]: SafetySubstantiation.${sub_id}.status == DEFICIENT and review_mode == FULL and full_reviewer_user_id == 'RVW-1'"
            - "after trigger[0]: ProductListing.${lst_id}.safety_status == SUBSTANTIATION_FAILED and ProductListing.${lst_id}.marketable == false"
            - "after trigger[0]: ToxicologicalReviewItem.${item_ra1_id}.full_contribution == 10.00 and ToxicologicalReviewItem.${item_ra1_id}.screening_contribution == 20.00"
            - "after trigger[0]: ToxicologicalReviewItem.${item_iv_id}.full_contribution == 15.00 and ToxicologicalReviewItem.${item_iv_id}.screening_contribution == 15.00"
            - "after trigger[1]: SafetySubstantiation.${sub_id}.status == SUBMITTED and revision_round == 2 and ProductListing.${lst_id}.safety_status == UNDER_SUBSTANTIATION"
            - "after trigger[2]: SafetySubstantiation.${sub_id}.adequacy_score == 75.00 and status == ADEQUATE and review_mode == SCREENING and screening_reviewer_user_id == 'RVW-2'"
            - "after trigger[2]: ProductListing.${lst_id}.safety_status == SUBSTANTIATED"
            - "${screening_score} - ${full_score} == 30.00"

      - name: withdrawal_reported_basis_versus_verified_basis_recovery_divergence
        grounds:
          - calculations.withdrawal_recovery_rate
          - calculations.distribution_unit_conservation
          - state_machines.MarketWithdrawal.RECORDS_PRODUCED_to_INTERIM_REVIEWED
          - state_machines.MarketWithdrawal.INTERIM_REVIEWED_to_EXTENDED_INEFFECTIVE
          - state_machines.RecallAction.EXECUTING_to_EXTENDED
          - entities.MarketWithdrawal.fields.provisional_verified_rate
          - entities.MarketWithdrawal.fields.adjusted_denominator_units
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — MarketWithdrawal recovery
          measurement, not evidence scoring: the SAME three linked distribution records yield
          reported_recovery_rate 55.33 (830 asserted-or-in-transit units over the raw 1500-unit
          denominator, verdict INTERIM, no state closure) and verified_recovery_rate 49.65 (700
          verified units over the unreachable-consignee-shrunk denominator 1410), and only the
          verified variant moves the withdrawal and its RecallAction out of execution.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one consumer listing with lot_authorized_units 2000"
            - "three DistributionRecord rows on distinct lots: 600, 500 and 400 units shipped (1500 total)"
            - "a VOLUNTARY_NOTICE / CLASS_II RecallAction whose plan was ACCEPTED by officer OFF-1, an EXECUTING recall and an OPEN withdrawal with all three records produced"
            - "reported buckets totalling 830 units (500 reported returns + 200 reported destructions + 130 in-transit) and verified buckets totalling 700 units (400 + 200 verified returns, 100 verified destruction)"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Basin Cosmetics Ltd", owner_operator_name: "Basin Group", facility_type: "BOTH", country_code: "US", state_or_province: "OH" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Basin Brands LLC", us_address_line: "8 Canal Rd, Columbus OH 43004", contact_phone: "+1-202-555-0111", contact_email: "rp@basin.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Basin Suntan Lotion", category_code: "12A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "DOMESTIC_ADDRESS", label_contact_value: "8 Canal Rd, Columbus OH 43004", lot_authorized_units: 2000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-A", consignee_name: "Midwest Wholesale", consignee_class: "WHOLESALE", ship_date: "2026-08-02T00:00:00Z", delivery_date: "2026-08-06T00:00:00Z", units_shipped: 600 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-B", consignee_name: "Lakeside Retail", consignee_class: "RETAIL", ship_date: "2026-08-02T00:00:00Z", delivery_date: "2026-08-06T00:00:00Z", units_shipped: 500 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr2_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-C", consignee_name: "Corner Drug", consignee_class: "CONSUMER", ship_date: "2026-08-02T00:00:00Z", delivery_date: "2026-08-06T00:00:00Z", units_shipped: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr3_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_II" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Retail-level retrieval of LOT-A/B/C", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_v_accepted: $.data.version }
            - call: "POST /cosmetics/recall-actions/${rec_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${rec_v_accepted}" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { wd_id: $.data.id }
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${dr1_id}", "${dr2_id}", "${dr3_id}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "REPORTED_RETURN", distribution_record_id: "${dr1_id}", units: 500 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "REPORTED_DESTRUCTION", distribution_record_id: "${dr2_id}", units: 200 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "IN_TRANSIT_RETURN", distribution_record_id: "${dr3_id}", units: 130 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${dr1_id}", units: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${dr2_id}", units: 200 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_DESTRUCTION", distribution_record_id: "${dr3_id}", units: 100 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/effectiveness-check"
              payload: { basis: "REPORTED_BASIS" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { rep_rate: $.data.reported_recovery_rate }
            - call: "POST /cosmetics/withdrawals/${wd_id}/effectiveness-check"
              payload: { basis: "VERIFIED_BASIS" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { ver_rate: $.data.verified_recovery_rate }
          assert:
            - "after trigger[0]: MarketWithdrawal.${wd_id}.shipped_units_total == 1500 and reported_recovered_units == 830"
            - "after trigger[0]: MarketWithdrawal.${wd_id}.reported_recovery_rate == 55.33 and effectiveness_verdict == INTERIM and status == INTERIM_REVIEWED"
            - "after trigger[0]: MarketWithdrawal.${wd_id}.verified_recovery_rate is still null and unreachable_credit_pct is still null (the reported basis never touches the verified fields) and RecallAction.${rec_id}.status == EXECUTING"
            - "after trigger[0]: MarketWithdrawal.${wd_id}.outstanding_units_total == 800 (the reported and in-transit buckets do not reduce outstanding units)"
            - "after trigger[1]: MarketWithdrawal.${wd_id}.verified_recovered_units == 700 and provisional_verified_rate == 46.67"
            - "after trigger[1]: MarketWithdrawal.${wd_id}.unreachable_credit_pct == 6 and adjusted_denominator_units == 1410"
            - "after trigger[1]: MarketWithdrawal.${wd_id}.verified_recovery_rate == 49.65 and effectiveness_verdict == NOT_EFFECTIVE and status == EXTENDED_INEFFECTIVE"
            - "after trigger[1]: RecallAction.${rec_id}.status == EXTENDED and effectiveness_rate_final == null"
            - "after trigger[1]: ProductListing.${lst_id}.open_recall_count == 1 (an ineffective round does not close the recall)"
            - "${rep_rate} != ${ver_rate}"

  - rule_id: combinatorial_formula
    instances:
      - name: facility_points_three_events_lateness_cap_and_professional_relief
        grounds:
          - calculations.facility_serious_event_points
          - calculations.serious_event_report_deadline
          - calculations.facility_compliance_posture
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORTED_LATE
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORTED_TIMELY
          - entities.AdverseEvent.fields.event_points
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear composition with a nested min() cap and a conditional
          branch. Each event's points are base(report_status) x min(2.0, 1 + 0.1 * lateness_days) x
          (0.5 when the listing is professional-use-only else 1.0), ROUNDED PER EVENT, and only then
          summed. One event is 2 days past the cap knee (lateness 12 -> uncapped factor 2.2, capped
          2.0), a second is the same lateness on a professional-use listing (half relief), a third is
          timely on the same facility: 10.00 + 5.00 + 2.00 = 17.00, which lands the facility in
          RESTRICTED. Ignoring the cap would give 11.00 + 5.50 and a different posture arithmetic.
        test_recipe:
          setup:
            - "one REGISTERED facility (period 2026-08-01 .. 2028-07-31) with no substantiated listing, so the posture escalation has nothing to revalidate and the points arithmetic is observed in isolation"
            - "one ResponsiblePerson holding two DRAFT listings: L1 consumer (07A, LEAVE_ON) and L2 professional-use-only (03B, LEAVE_ON, statement present)"
            - "logical clock advanced to 2026-08-06T00:00:00Z so two events received 2026-08-05T10:00:00Z can be recorded (validations[priority=39]); both therefore carry deadline_at 2026-08-20T23:59:59.999Z"
            - "logical clock then advanced to 2026-09-01T12:00:00Z, at which point a third event received 2026-08-30T09:00:00Z (deadline 2026-09-14T23:59:59.999Z) is recorded and still timely"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Cedar Works Plant 2", owner_operator_name: "Cedar Works Inc", facility_type: "PROCESSOR", country_code: "US", state_or_province: "PA" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Cedar Brands LLC", us_address_line: "44 Pine Ave, Erie PA 16501", contact_phone: "+1-202-555-0112", contact_email: "rp@cedar.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Cedar Cream Blush", category_code: "07A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@cedar.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_consumer_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Cedar Salon Eyeliner", category_code: "03B", product_form: "LEAVE_ON", professional_use_only: true, professional_use_statement_present: true, label_contact_type: "DOMESTIC_PHONE", label_contact_value: "+1-202-555-0112" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_pro_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/listings/${lst_consumer_id}/adverse-events"
              payload: { event_description: "Facial dermatitis after single use", received_at: "2026-08-05T10:00:00Z", seriousness: "SERIOUS", outcome_code: "MEDICAL_INTERVENTION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_consumer_late_id: $.data.id, ae_consumer_deadline: $.data.deadline_at }
            - call: "POST /cosmetics/listings/${lst_pro_id}/adverse-events"
              payload: { event_description: "Salon client eyelid swelling", received_at: "2026-08-05T10:00:00Z", seriousness: "SERIOUS", outcome_code: "MEDICAL_INTERVENTION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_pro_late_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/listings/${lst_consumer_id}/adverse-events"
              payload: { event_description: "Scalp irritation, resolved", received_at: "2026-08-30T09:00:00Z", seriousness: "SERIOUS", outcome_code: "OTHER_SERIOUS" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_timely_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/adverse-events/${ae_consumer_late_id}/report"
              payload: { report_narrative: "Consumer report filed after internal delay" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { pts_consumer: $.data.event_points }
            - call: "POST /cosmetics/adverse-events/${ae_pro_late_id}/report"
              payload: { report_narrative: "Professional-channel report filed after internal delay" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { pts_pro: $.data.event_points }
            - call: "POST /cosmetics/adverse-events/${ae_timely_id}/report"
              payload: { report_narrative: "Filed inside the 15-day window" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { pts_timely: $.data.event_points }
          assert:
            - "AdverseEvent.${ae_consumer_late_id}.deadline_at == 2026-08-20T23:59:59.999Z and AdverseEvent.${ae_timely_id}.deadline_at == 2026-09-14T23:59:59.999Z"
            - "after trigger[0]: AdverseEvent.${ae_consumer_late_id}.report_status == REPORTED_LATE, lateness_days == 12, event_points == 10.00 (base 5 x min(2.0, 2.2) x 1.0)"
            - "after trigger[0]: Facility.${fac_id}.serious_event_points == 10.00 and compliance_posture == RESTRICTED"
            - "after trigger[1]: AdverseEvent.${ae_pro_late_id}.report_status == REPORTED_LATE, lateness_days == 12, event_points == 5.00 (the same lateness halved by PROFESSIONAL_RELIEF_FACTOR)"
            - "after trigger[1]: Facility.${fac_id}.serious_event_points == 15.00"
            - "after trigger[2]: AdverseEvent.${ae_timely_id}.report_status == REPORTED_TIMELY, lateness_days == 0, event_points == 2.00"
            - "after trigger[2]: Facility.${fac_id}.serious_event_points == 17.00 and compliance_posture == RESTRICTED and open_serious_event_count == 0"
            - "${pts_consumer} + ${pts_pro} + ${pts_timely} == 17.00 (per-event rounding, then summation)"
            - "AdverseEvent.${ae_pro_late_id}.retention_until == 2032-08-05 (six years, serious) and AdverseEvent.${ae_timely_id}.retention_until == 2032-08-30"

      - name: gmp_readiness_rounded_weighted_terms_then_summed
        grounds:
          - calculations.gmp_readiness_score
          - state_machines.InspectionEngagement.SCHEDULED_to_OBSERVATIONS_ISSUED
          - state_machines.InspectionEngagement.OBSERVATIONS_ISSUED_to_RESPONSE_SUBMITTED
          - state_machines.InspectionEngagement.RESPONSE_SUBMITTED_to_CLOSED_VAI
          - entities.InspectionEngagement.fields.category_subscores
        distinguishing_aspect: |
          Mode (b): nested rounding where the ORDER of the rounding boundary changes the answer. Five
          observations (PREMISES 1 MINOR, RAW_MATERIALS 1 MINOR, RECORDKEEPING 3 x CRITICAL) give
          subscores 100.00 / 96.67 / 100.00 / 96.67 / 40.00; rounding each weighted term first gives
          15.00 + 19.33 + 15.00 + 19.33 + 12.00 = 80.66, while summing the unrounded products and
          rounding once at the end gives 80.67. Both land in the same NAI/VAI bands here, so the
          instance pins the exact score and the stored per-category subscores rather than the band.
        test_recipe:
          setup:
            - "one REGISTERED facility whose current registration period is 2026-08-01 .. 2028-07-31"
            - "one SCHEDULED GMP_ROUTINE inspection with window [2026-09-01, 2026-09-05), entirely inside that period (validations[priority=40])"
            - "logical clock advanced to 2026-09-05T10:00:00Z before the observations are issued, so response_due_at lands on 2026-09-20T23:59:59.999Z"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Halden Fill Line 4", owner_operator_name: "Halden Manufacturing Co", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "IL" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/facilities/${fac_id}/inspections"
              payload: { inspection_type: "GMP_ROUTINE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T10:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/inspections/${insp_id}/observations"
              payload: { observations: [{ category: "PREMISES", severity: "MINOR" }, { category: "RAW_MATERIALS", severity: "MINOR" }, { category: "RECORDKEEPING", severity: "CRITICAL" }, { category: "RECORDKEEPING", severity: "CRITICAL" }, { category: "RECORDKEEPING", severity: "CRITICAL" }] }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { readiness: $.data.readiness_score }
            - call: "POST /cosmetics/facilities/${fac_id}/inspections/${insp_id}/response"
              payload: { response_summary: "Records retention SOP revised; premises and raw-material findings closed" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { vai_count: $.data.closed_vai_count }
          assert:
            - "after trigger[0]: InspectionEngagement.${insp_id}.readiness_score == 80.66 (NOT 80.67) and observation_count == 5"
            - "after trigger[0]: InspectionEngagement.${insp_id}.category_subscores == { PERSONNEL: 100.00, PREMISES: 96.67, EQUIPMENT: 100.00, RAW_MATERIALS: 96.67, RECORDKEEPING: 40.00 }"
            - "after trigger[0]: InspectionEngagement.${insp_id}.status == OBSERVATIONS_ISSUED (80.66 < NAI_THRESHOLD 85.00) and response_due_at == 2026-09-20T23:59:59.999Z"
            - "after trigger[0]: Facility.${fac_id}.gmp_readiness_score == 80.66 and last_inspection_outcome is still null (no closure yet)"
            - "after trigger[1]: InspectionEngagement.${insp_id}.status == RESPONSE_SUBMITTED and response_submitted_at == 2026-09-05T10:00:00Z"
            - "after trigger[3]: InspectionEngagement.${insp_id}.status == CLOSED_VAI and outcome_class == VAI (80.66 >= VAI_THRESHOLD 70.00)"
            - "after trigger[3]: Facility.${fac_id}.last_inspection_outcome == VAI and compliance_posture == OPEN (only ESCALATED_OAI forces RESTRICTED)"
            - "${vai_count} == 1 and the same sweep reports escalated_oai_count == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: listing_register_dimension_holds_while_safety_dimension_resets
        grounds:
          - state_machines.ProductListing.SUBSTANTIATED_to_UNSUBSTANTIATED
          - state_machines.ProductListing.UNSUBSTANTIATED_to_UNDER_SUBSTANTIATION
          - state_machines.ProductListing.UNDER_SUBSTANTIATION_to_SUBSTANTIATED
          - state_machines.SafetySubstantiation.ADEQUATE_to_SUPERSEDED
          - entities.ProductListing.fields.marketable
        distinguishing_aspect: |
          Non-linear shape on ProductListing: two PARALLEL state dimensions on one entity. Filing a
          fresh dossier for a LISTED product drives the safety dimension backwards
          (SUBSTANTIATED -> UNSUBSTANTIATED -> UNDER_SUBSTANTIATION -> SUBSTANTIATED) and supersedes
          the previous ADEQUATE dossier, while the register dimension never leaves LISTED. The
          derived marketable flag, which reads BOTH dimensions, drops to false and returns to true
          without any listing_status transition ever firing.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson"
            - "one listing whose listing_status is LISTED and whose safety_status is SUBSTANTIATED via an ADEQUATE dossier scored 65.00 (CLINICAL_SAFETY_STUDY/BOARD_CERTIFIED_TOXICOLOGIST 40.00 + IN_VITRO_TOXICOLOGY/ERT 25.00, the canonical pass in calculations.substantiation_adequacy_score)"
            - "no allergen ingredients, so allergen_disclosure_complete stays true and marketable is driven purely by the two state dimensions"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Northline Compounding", owner_operator_name: "Northline Inc", facility_type: "BOTH", country_code: "US", state_or_province: "WI" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
