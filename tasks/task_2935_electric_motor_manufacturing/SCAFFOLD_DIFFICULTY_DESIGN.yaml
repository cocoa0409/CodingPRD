          - calculations.test_measured_efficiency
          - entities.PerformanceTest.fields.measured_efficiency_pct
          - entities.PerformanceTest.fields.test_method
          - state_machines.PerformanceTest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The two variants of test_measured_efficiency run on the PerformanceTest entity domain
          — a third distinct entity domain — and diverge on identical bench data: the
          IEC_60034_2_1_SUMMATION variant returns 93.42 % (it consumes ambient_temp_c 40.0 and
          the stray-load fraction) while the IEEE_112_B_DYNAMOMETER variant returns 93.52 %
          (output/input only, ignoring every loss field).
        test_recipe:
