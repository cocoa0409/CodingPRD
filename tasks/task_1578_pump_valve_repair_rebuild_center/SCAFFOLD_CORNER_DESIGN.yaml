            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "ok", recommended_action: "REPAIR", estimated_labor_hours: 1, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
          trigger:
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 1, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q1: $.data.id, q1_rev: $.data.revision } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { err: $.data.error_id } }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v2: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v2}" }, as: ServiceManager, captures: { q2: $.data.id, q2_rev: $.data.revision, q2_sup: $.data.supersedes_quote_id } }
          assert:
            - "first create succeeds (201), Quote.${q1}.revision == 1, and increments RepairOrder.version by 1"
            - "second create with stale ${ro_v} -> http 412, error_id == ERR_STALE_VERSION, no Quote created"
            - "after refetch, create succeeds: Quote.${q2}.revision == 2 and supersedes_quote_id == ${q1}"
            - "Quote.${q1}.status == SUPERSEDED"

      - name: cascading_side_effects_excluded_stub
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "transitive_cascade / quote_approval_capacity_posture_cascade"
          rationale: "3-level cascade verified end-to-end there; 2-level obsolescence cascade in part_obsolescence_forces_quote_revision_cascade."

      - name: dual_variant_layer_excluded_stub
