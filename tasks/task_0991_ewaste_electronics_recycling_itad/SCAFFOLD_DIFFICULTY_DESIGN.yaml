            - "after return: Settlement.${s}.gross_buyback_cents == 40000 (recomputed to catalog estimate) and status still QUOTE_OPEN"
            - "ResaleListing.${l1}.status == RETURNED and Item.${i1}.processing_status == FOR_RESALE"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: batch_add_item_state_error_beats_safety_error
        grounds:
          - validations[priority=8]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: adding a data-bearing,
          sanitization-UNVERIFIED item to an already IN_TRANSIT batch violates both
          ERR_BATCH_NOT_STAGING (priority 8, state) and ERR_DATA_SANITIZATION_UNVERIFIED
          (priority 13, business_safety); the state error must win.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; R2 policy ACTIVE; recycler accepts all categories, cert 2027-05-01, capacity 1000"
            - "Manifest (declared 2) RECEIVED; item1 (OTHER, 1.0 kg, non-data) triaged RECYCLE, batched, and the batch SHIPPED (IN_TRANSIT)"
            - "item2 (LAPTOP, data-bearing, sanitization never logged -> data_status PENDING) triaged RECYCLE"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Prio Co", contact_email: "p@prio.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["CRYPTO_ERASE", "NIST_CLEAR", "NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecP", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["OTHER", "LAPTOP"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { rec: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 2 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-P1", category: "OTHER", weight_kg: 1.0, data_bearing: false, hazmat_flag: false, declared_grade: "C" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-P2", category: "LAPTOP", weight_kg: 2.0, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i2: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i2}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /itad/recycle-batches/${b1}/items", payload: { item_id: "${i1}" }, as: LogisticsCoordinator }
            - { call: "POST /itad/recycle-batches/${b1}/ship", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /itad/recycle-batches/${b1}/items", payload: { item_id: "${i2}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BATCH_NOT_STAGING (state priority 8 fires before business_safety priority 13, though item2 also fails the data gate)"
            - "Item.${i2}.processing_status remains FOR_RECYCLE"

      - name: manifest_schedule_referential_error_beats_temporal_error
        grounds:
          - validations[priority=16]
          - validations[priority=21]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal: scheduling a
          manifest whose account is SUSPENDED and whose window already ended violates
          both ERR_ACCOUNT_SUSPENDED (priority 16, referential) and ERR_WINDOW_IN_PAST
          (priority 21, temporal); the referential error must win — a different
          category pair than state-vs-safety.
        test_recipe:
          setup:
            - "Clock initially 2026-05-01; manifest DRAFT with window 2026-05-10T09:00:00Z to 2026-05-10T11:00:00Z"
            - "Account then SUSPENDED and clock advanced to 2026-06-01 (window now in the past)"
