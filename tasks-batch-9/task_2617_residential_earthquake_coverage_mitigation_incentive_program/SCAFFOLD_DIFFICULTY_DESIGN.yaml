              as: ProgramAdmin
              captures: { dw_2: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "5 Levee Way", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_3: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "7 Levee Way", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_4: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_1}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_1: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_2}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_2: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_3}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_3: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_4}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_4: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_1}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers/${off_2}/respond"
              payload: { response: "DECLINE" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { d2_documented: $.data.decline_documented }
            - call: "POST /eqp/mandatory-offers/${off_3}/respond"
              payload: { response: "DECLINE" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers/${off_4}/respond"
              payload: { response: "DECLINE" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_1}", insurer_id: "${ins_id}", accepted_offer_id: "${off_1}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 2000000 }
              as: ParticipatingInsurer
