scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: melt_charge_cost_planned_vs_actual_rounding
        grounds:
          - calculations.melt_charge_cost
          - entities.MeltBatch.fields.planned_charge_cost_cents
          - entities.MeltBatch.fields.actual_charge_cost_cents
        distinguishing_aspect: |
          Same melt batch, two cost bases: the planned variant applies ONE rounding
          over the planned mix (2000 lbs at a 40/40/15/5 mix => 56300 cents) while
          the actual variant rounds each weighed component line then sums
          (810/790/320/90 lbs => 55230 cents). Entity domain: MeltBatch material cost.
        test_recipe:
          setup:
            - "Product P (import_landed_cost_cents 2000, wholesale 2400) exists"
            - "ProductionOrder O for P, planned_quantity 10, released (state MOLDING, version 2)"
            - "MeltBatch B for O on FURNACE_A, planned 2000 lbs at mix 40/40/15/5 (state CHARGING)"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 10, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
              captures: { o_v2: $.data.version }
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v2}" }
              as: MeltOperator
              as_user_id: op-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /foundry/melt-batches/${b_id}/charge"
              payload: { pig_iron_lbs: 810, scrap_steel_lbs: 790, returns_lbs: 320, alloy_lbs: 90 }
              as: MeltOperator
              as_user_id: op-1
          assert:
            - "MeltBatch.${b_id}.planned_charge_cost_cents == 56300"
            - "MeltBatch.${b_id}.actual_charge_cost_cents == 55230"
            - "MeltBatch.${b_id}.planned_charge_cost_cents != MeltBatch.${b_id}.actual_charge_cost_cents"
            - "MeltBatch.${b_id}.state == MELTING"
      - name: unit_cost_provisional_vs_final_at_completion
        grounds:
          - calculations.unit_cost
          - entities.ProductionOrder.fields.unit_cost_provisional_cents
          - entities.ProductionOrder.fields.unit_cost_final_cents
          - entities.ProductionOrder.fields.margin_flag
        distinguishing_aspect: |
          Same order, two algorithms: the provisional variant amortizes actual
          material over PLANNED quantity plus a flat standard conversion
          (55230/10 + 1450 = 6973 cents), while the final variant divides full
          actuals by GOOD units ((55230 + 128000 + 12600 + 1850)/10 = 19678
          cents). Entity domain: ProductionOrder cost accounting — distinct
          from the MeltBatch material-cost domain of the sibling instance.
        test_recipe:
          setup:
            - "Product P (wholesale 2400, msrp 4000) exists"
            - "Order O (planned 10) released; melt B charged at 55230 cents actual, chemistry certified, tapped 2010 lbs"
            - "Mold M prepared; 10 units poured at 128 oz each, shaken out, all 10 inspected PASS (FINISHED)"
            - "SeasoningBatch SB (SOYBEAN, 2 coats) holds the 10 units; bake started at 475F by SeasoningLead sl-1"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 10, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
              captures: { o_v2: $.data.version }
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v2}" }
              as: MeltOperator
              as_user_id: op-1
              captures: { b_id: $.data.id }
            - call: "POST /foundry/melt-batches/${b_id}/charge"
              payload: { pig_iron_lbs: 810, scrap_steel_lbs: 790, returns_lbs: 320, alloy_lbs: 90 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/chemistry-readings"
              payload: { carbon_pct: 3.30, silicon_pct: 2.99, manganese_pct: 0.65, sulfur_pct: 0.045, phosphorus_pct: 0.010, bath_temp_f: 2725 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/melt-batches/${b_id}/certify-chemistry"
              payload: { decision: CERTIFY }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/melt-batches/${b_id}/tap"
              payload: { tapped_temp_f: 2690, tapped_lbs: 2010 }
              as: MeltOperator
              as_user_id: op-1
            - call: "POST /foundry/molds"
              payload: { production_order_id: "${o_id}", new_sand_pct: 20.0, reclaimed_sand_pct: 80.0, moisture_pct: 3.8, clay_pct: 10.0, sand_weight_lbs: 500 }
              as: FoundryManager
              captures: { m_id: $.data.id }
            - call: "POST /foundry/melt-batches/${b_id}/pour"
              payload: { mold_id: "${m_id}", unit_count: 10, pour_weight_per_unit_oz: 128.0 }
              as: MeltOperator
              as_user_id: op-1
              captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id", u4: "$.data[3].id", u5: "$.data[4].id", u6: "$.data[5].id", u7: "$.data[6].id", u8: "$.data[7].id", u9: "$.data[8].id", u10: "$.data[9].id" }
            - call: "POST /foundry/molds/${m_id}/shakeout"
              payload: {}
              as: MeltOperator
