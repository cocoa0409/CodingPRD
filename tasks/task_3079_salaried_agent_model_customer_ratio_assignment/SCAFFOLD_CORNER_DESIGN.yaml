              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 4.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_floor: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Uma Seller", email: "uma@x.com", service_area_code: "98102", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_low: $.data.id }
            - call: "POST /clients/${seller_floor}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${seller_low}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { region_v: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_floor}", list_price_cents: 10000000, list_fee_rate_pct: 0.0125, service_tier: "MLS_ONLY", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { agreement_floor: $.data.id }
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_low}", list_price_cents: 9999999, list_fee_rate_pct: 0.0125, service_tier: "MLS_ONLY", expected_region_version: "${region_v}" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
