      - name: zoning_continuance_self_loop_then_approval_fork
        grounds:
          - state_machines.ZoningApplication.SUBMITTED_to_CONTINUED
          - state_machines.ZoningApplication.CONTINUED_to_CONTINUED
          - state_machines.ZoningApplication.CONTINUED_to_APPROVED_WITH_CONDITIONS
          - validations[priority=16]
        distinguishing_aspect: |
          A bounded self-loop plus a three-way fork on one trigger: CONTINUED -> CONTINUED is legal
          exactly twice (continuance_count 1 then 2) and the third continuance is refused with
          ERR_ZONING_CONTINUANCE_EXHAUSTED, after which the SAME decide endpoint takes the
          APPROVED_WITH_CONDITIONS branch from CONTINUED — unlike the negotiation instance, the
          loop is on a single state and is counter-bounded rather than party-alternating.
