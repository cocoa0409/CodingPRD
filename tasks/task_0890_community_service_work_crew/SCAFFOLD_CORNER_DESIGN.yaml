# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe. Same setup_api_calls / literal-lock / lint gates as §1.8.
# Bootstrap literals match §1.8 (clock 2026-06-01, insurance 2026-01-01..2027-01-01).
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: participant_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Participant.fields.full_name]
        distinguishing_aspect: "POST /participants with all required fields returns 201 and echoes full_name, plus system id/created_at/version."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pid: "$.data.id" } }
          assert:
            - "http status == 201"
            - "Participant.${pid}.full_name == Pat Doe"
            - "Participant.${pid}.version == 1"

      - name: participant_default_risk_level_low_when_omitted
        claim_type: Defaults
        grounds: [entities.Participant.fields.risk_level]
        distinguishing_aspect: "Omitting risk_level applies the declared default LOW."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "Dee Fault", date_of_birth: "1992-03-03T00:00:00Z", contact_email: "dee@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pid: "$.data.id" } }
          assert:
            - "Participant.${pid}.risk_level == LOW"

      - name: referral_default_indigency_none_and_system_status_active
        claim_type: System Fields
        grounds: [entities.Referral.fields.indigency_status, entities.Referral.fields.status]
        distinguishing_aspect: "Omitting indigency_status defaults NONE; status is system-set to ACTIVE and version to 1 regardless of input."
        test_recipe:
          setup: ["A participant exists."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /referrals", payload: { participant_id: "${pid}", court_case_number: "CR-D1", offense_class: "INFRACTION", hours_ordered: 8, deadline_date: "2026-12-31T00:00:00Z" }, as: CourtClerk, as_user_id: "clerk-1", captures: { rid: "$.data.id" } }
          assert:
            - "Referral.${rid}.indigency_status == NONE"
            - "Referral.${rid}.status == ACTIVE"
            - "Referral.${rid}.hours_outstanding == 8"

      - name: referral_missing_hours_ordered_returns_validation
        claim_type: Required Fields
        grounds: ['entities.Referral.fields.hours_ordered', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Missing required hours_ordered returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A participant exists."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /referrals", payload: { participant_id: "${pid}", court_case_number: "CR-D2", offense_class: "INFRACTION", deadline_date: "2026-12-31T00:00:00Z" }, as: CourtClerk, as_user_id: "clerk-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: referral_invalid_offense_class_enum_returns_validation
        claim_type: Type Constraints
        grounds: ['entities.Referral.fields.offense_class', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "offense_class outside {INFRACTION,MISDEMEANOR,FELONY} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A participant exists."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /referrals", payload: { participant_id: "${pid}", court_case_number: "CR-D3", offense_class: "PARKING", hours_ordered: 8, deadline_date: "2026-12-31T00:00:00Z" }, as: CourtClerk, as_user_id: "clerk-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: referral_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ['errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /referrals/{unknown} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /referrals/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

  # ---------------------------------------------------------- State Machines
  - section: state_machines
    instances:
      - name: verify_before_checkout_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkSession.COMPLETED_to_COMPLETED, entities.WorkSession.fields.attendance_status]
        distinguishing_aspect: "Verifying a session still SCHEDULED (attendance not COMPLETED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE placement with a SCHEDULED session (not checked in/out)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D4", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T11:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: double_checkin_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.WorkSession.SCHEDULED_to_CHECKED_IN]
        distinguishing_aspect: "A second check-in on an already CHECKED_IN session returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE placement with a session already CHECKED_IN."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D5", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T11:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-05T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-05T09:05:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: reinstate_active_referral_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Referral.NON_COMPLIANT_to_ACTIVE]
        distinguishing_aspect: "Reinstating a referral already ACTIVE (not NON_COMPLIANT) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE referral."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D6", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /referrals/${ref_id}/reinstate", payload: {}, as: CourtClerk, as_user_id: "clerk-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: pause_prospective_site_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Site.ACCEPTING_to_PAUSED]
        distinguishing_aspect: "Pausing a PROSPECTIVE site (only ACCEPTING may pause) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PROSPECTIVE (never activated) site."]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/pause", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: verify_expired_insurance_policy_rejected
        claim_type: Precondition Enforcement
        grounds: ['state_machines.InsurancePolicy.PENDING_to_VERIFIED', 'errors[ERR_INSURANCE_INVALID]']
        distinguishing_aspect: "Verifying a policy whose expiry_date is at/before the clock returns ERR_INSURANCE_INVALID."
        test_recipe:
          setup: ["Clock at 2026-06-01; a PENDING policy with expiry 2026-05-15 (already past)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-05-15T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
          trigger:
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSURANCE_INVALID"

  # ------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: placement_supervisor_from_other_site_mismatch
        claim_type: Cross-entity validation
        grounds: ['validations[priority=4]', 'errors[ERR_SUPERVISOR_SITE_MISMATCH]']
        distinguishing_aspect: "Creating a placement whose supervisor belongs to a different site returns ERR_SUPERVISOR_SITE_MISMATCH (422)."
        test_recipe:
          setup: ["Site A with supervisor SA; Site B; placement to Site B using SA."]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site A", agency_type: "NONPROFIT", address: "1 A St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_a: "$.data.id" } }
            - { call: "POST /sites", payload: { name: "Site B", agency_type: "GOVERNMENT", address: "2 B St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_b: "$.data.id" } }
            - { call: "POST /supervisors", payload: { site_id: "${site_a}", full_name: "Sup A", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_a: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D7", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_b}", supervisor_id: "${sup_a}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SUPERVISOR_SITE_MISMATCH"
            - "http status == 422"

      - name: verify_attested_hours_exceed_claimed_rejected
        claim_type: Violation to Error
        grounds: ['validations[priority=18]', 'errors[ERR_VERIFIED_HOURS_EXCEED_CLAIMED]']
        distinguishing_aspect: "attested_hours (4.00) greater than claimed_hours (3.00) on verify returns ERR_VERIFIED_HOURS_EXCEED_CLAIMED (422)."
        test_recipe:
          setup: ["A session checked out for 3.00h (09:00-12:00); verify supplies attested 4.00."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D8", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-05T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws_id}/check-out", payload: { check_out_at: "2026-06-05T12:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/verify", payload: { outcome: "VERIFIED", attested_hours: 4.00 }, as: SiteSupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VERIFIED_HOURS_EXCEED_CLAIMED"

      - name: checkout_before_checkin_rejected
        claim_type: Temporal validation
        grounds: ['validations[priority=19]', 'errors[ERR_CHECKOUT_BEFORE_CHECKIN]']
        distinguishing_aspect: "check_out_at at/before check_in_at returns ERR_CHECKOUT_BEFORE_CHECKIN (422)."
        test_recipe:
          setup: ["A CHECKED_IN session (in 10:00); check-out supplied at 09:00."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-D9", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
