              captures: { b1: $.data.id }
            - call: "POST /menu-boards/${b1}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "DRIVE_THRU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /menu-boards/${b1}/reprint"
              payload: {}
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { err_listed: $.data.error_id }
            - call: "POST /menu-boards/${b2}/reprint"
              payload: {}
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { err_empty: $.data.error_id }
          assert:
            - "MenuBoard.${b1}.listing_count == 1, stale_listing_count == 0 and calorie_compliance_status == CURRENT"
            - "trigger[0] response HTTP status == 409 and data.error_id == ERR_NO_STALE_LISTINGS"
            - "trigger[1] response HTTP status == 409 and data.error_id == ERR_NO_STALE_LISTINGS"
            - "MenuBoard.${b1}.reprint_count == 0 and MenuBoard.${b2}.reprint_count == 0 after both triggers"
            - "Brand.${brand}.open_reprint_obligation_count == 0 and compliance_posture == COMPLIANT"

      - name: board_publish_is_blocked_until_the_packet_is_published
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_NO_PUBLISHED_PACKET]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / board_publication_gated_on_disclosure_packet_status
          rationale: "That §1.8 instance already drives the identical publish call twice against the same board - once while the brand's only DisclosurePacket is DRAFT (expecting ERR_NO_PUBLISHED_PACKET) and once after the packet reaches PUBLISHED - which is exactly the valid/invalid pair this row asks for."

      - name: succinct_wording_error_wins_over_the_undeclared_item_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=28]
          - validations[priority=30]
          - errors[ERR_SUCCINCT_STATEMENT_MISMATCH]
          - errors[ERR_ITEM_CALORIES_UNDECLARED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / succinct_statement_mismatch_outranks_undeclared_item_calories
          rationale: "One publish call there violates priority 28 and priority 30 at once and asserts both that ERR_SUCCINCT_STATEMENT_MISMATCH is returned and that ERR_ITEM_CALORIES_UNDECLARED is not, covering the priority-conflict row and the two errors together."

      - name: draft_check_wins_over_the_window_conflict_on_republish
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=32]
          - errors[ERR_BOARD_NOT_DRAFT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / board_not_draft_outranks_window_conflict
          rationale: "The §1.8 instance republishes an already PUBLISHED board into a window that also collides with a sibling board, so both rules are live and the lower-priority state error is asserted to win."

      - name: overlapping_display_windows_are_rejected_per_establishment_and_board_type
        claim_type: temporal_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_BOARD_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / board_display_windows_half_open_per_establishment_and_board_type
          rationale: "That instance publishes four boards to build touching, strictly-inside, disjoint and open-ended window pairs across two board types, which subsumes the future-conflict detection this row asks for."

      - name: granted_variance_windows_respect_the_cooling_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_VARIANCE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / variance_windows_closed_with_seven_day_cooling_buffer_per_requirement
          rationale: "The §1.8 instance already exercises the closed-window plus VARIANCE_COOLING_DAYS arithmetic at the exact boundary day and one day past it, per requirement_code."

      - name: escalation_is_shielded_by_a_variance_for_the_cited_requirement
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=36]
          - errors[ERR_CITATION_SHIELDED_BY_VARIANCE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / escalation_gated_on_granted_variance_for_the_cited_requirement
          rationale: "That instance walks the citation-to-requirement map with a GRANTED variance in force, then expires it by moving the logical clock, giving both the invalid and the valid side of this cross-entity rule."

      - name: reprint_certification_is_blocked_by_an_outstanding_penalty
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors[ERR_OUTSTANDING_PENALTY]
        excluded_because:
          difficulty_instance: compensating_invariant / rescind_penalty_restores_both_money_ledgers_exactly
          rationale: "ERR_OUTSTANDING_PENALTY is the observable there: the REPRINT_COMPLETED response is refused while the penalty stands on Establishment.outstanding_penalty_cents and accepted after RESCIND_PENALTY clears both ledgers."

      - name: withdraw_certification_requires_an_approved_recipe
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_RECIPE_NOT_APPROVED]
        excluded_because:
          difficulty_instance: compensating_invariant / withdraw_certification_restores_the_reprint_obligation_ledger
          rationale: "The second withdraw-certification call in that instance returns ERR_RECIPE_NOT_APPROVED because the recipe is already WITHDRAWN, so the rule's violation side is covered there."

      - name: reprint_obligation_tolerance_band_is_inclusive
        claim_type: satisfaction_to_pass
        grounds:
          - calculations.reprint_obligation_and_deadline
          - state_machines.MenuBoard.calorie_compliance_status
        excluded_because:
          difficulty_instance: boundary_precision_check / reprint_tolerance_band_at_and_below_the_threshold
          rationale: "That instance certifies successive recipes whose declared_calorie_max deltas land exactly at the tolerance and one unit below it, asserting the no-obligation (pass) side and the obligation side from the same board."

      - name: zero_non_exempt_items_defeats_the_unit_threshold
        claim_type: priority_conflict
        grounds:
          - calculations.covered_establishment_determination
          - validations[priority=20]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_non_exempt_item_edge_outranks_unit_threshold
          rationale: "The §1.8 instance holds unit_count at 20 while every item is exempt, showing that the zero-item branch answers before the unit-count branch; adding a second copy here would duplicate that ordering claim."

  - section: endpoints
    instances:
      - name: registry_round_trip_and_list_pagination_bounds
        claim_type: standard_crud
        grounds:
          - endpoints[POST /brands]
          - endpoints[POST /jurisdictions]
          - endpoints[POST /establishments]
          - endpoints[GET /brands/{id}]
          - endpoints[GET /jurisdictions/{id}]
          - endpoints[GET /establishments]
          - validations[priority=6]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The plain registry surface: a Jurisdiction created with every optional field omitted comes back carrying all five defaults, a Brand comes back NOT_COVERED / NO_STANDARD_MENU_ITEMS / COMPLIANT, and GET /establishments walks three rows in created_at ASC with limit and offset whose bounds are enforced at 0, 101 and -1 while 1 and 100 are accepted."
        test_recipe:
          setup:
            - "One jurisdiction created with only code, name and preemption_mode."
            - "One brand with three OPERATING units created one at a time so their created_at order is known."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id, brand_v1: $.data.version }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { e1: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0002", unit_status: "OPERATING", operates_under_brand_name: true }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { e2: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0003", unit_status: "OPERATING", operates_under_brand_name: true }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${juris}"
              payload: {}
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "GET /brands/${brand}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 0 }
              as: PlatformAdmin
              captures: { err_zero: $.data.error_id }
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 101 }
              as: PlatformAdmin
              captures: { err_over: $.data.error_id }
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 10, offset: -1 }
              as: PlatformAdmin
              captures: { err_offset: $.data.error_id }
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 100 }
              as: PlatformAdmin
          assert:
            - "trigger[0] response data has extra_requirement == NONE, enforcement_tier == FEDERAL_ALIGNED, sodium_warning_threshold_mg == 2300, required_succinct_statement_variant == FEDERAL_DEFAULT and reprint_grace_days == 30 - every omitted optional field defaulted"
            - "trigger[1] response data has coverage_status == NOT_COVERED, coverage_reason == NO_STANDARD_MENU_ITEMS, counted_unit_count == 3, standard_item_count == 0 and compliance_posture == COMPLIANT"
            - "trigger[1] response data.id == ${brand} with system-generated created_at == 2026-08-01T00:00:00Z and version > ${brand_v1} - the three unit creations each bumped the brand"
            - "trigger[2] response data == [${e1}, ${e2}] with total_count == 3 and has_more == true"
            - "trigger[3] response data == [${e3}] with total_count == 3 and has_more == false"
            - "trigger[4] response HTTP status == 400 and data.error_id == ERR_INVALID_PAGINATION"
            - "trigger[5] response HTTP status == 400 and data.error_id == ERR_INVALID_PAGINATION"
            - "trigger[6] response HTTP status == 400 and data.error_id == ERR_INVALID_PAGINATION"
            - "trigger[7] response HTTP status == 200 with total_count == 3 and has_more == false - limit 100 is the inclusive maximum"

      - name: unit_batches_are_all_or_nothing_and_label_in_creation_order
        claim_type: bulk_action
        grounds:
          - endpoints[POST /brands/{id}/establishment-batches]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - errors[ERR_VALIDATION]
          - calculations.covered_establishment_determination
        distinguishing_aspect: "The batch is one transaction with one re-determination: 19 units land as OR-B-0001..OR-B-0019 in created_at ASC with a single coverage recomputation, while a batch naming an unknown jurisdiction and a batch with unit_count 0 create nothing at all rather than a partial estate."
