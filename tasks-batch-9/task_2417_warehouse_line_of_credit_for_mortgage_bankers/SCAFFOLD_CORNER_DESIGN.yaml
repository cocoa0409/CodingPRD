        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGED_SUBLIMIT_EXCEEDED
          - validations[priority=40]
          - calculations.dwell_and_aging_classification
        distinguishing_aspect: |
          The aged rule is the only fiscal check measured entirely on OTHER advances and
          with no matching stage-4 cap, so it can only be reached with an ACTIVE facility
          whose aged bucket is already over its sublimit. Getting there requires curing the
          aging-run's own margin call first — the cure lifts the RESTRICTED status while
          leaving the advance aged — which is exactly the state a naive implementation never
          reaches because it conflates "aged" with "in default".
