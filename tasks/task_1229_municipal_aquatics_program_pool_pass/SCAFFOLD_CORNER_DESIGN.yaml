            - "error_id == ERR_GUARD_NOT_CERTIFIED"

      - name: occ_stale_version_rental_approve_returns_412
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - concurrency_rules[rental-approve-stale-facility]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /rentals/{id}/approve with a stale expected_facility_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Facility F, PassHolder P, Rental R REQUESTED"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 0 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "P", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", party_size: 5, start_datetime: "2026-08-01T14:00:00Z", end_datetime: "2026-08-01T16:00:00Z" }
              as: PassHolder
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv: $.data.version }
            # Bump version by admitting someone (just call chemistry log to bump)
            - call: "POST /lifeguards"
              payload: { full_name: "LG", certification_id: "RC-1", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-07-01T01:00:00Z", free_chlorine_ppm: 2.0, ph: 7.5, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "POST /rentals/${r_id}/approve"
              payload: { expected_facility_version: "${fv} - 0" }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"

      - name: reopen_chemistry_not_cleared_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_REOPEN_CRITERIA_NOT_MET]
        distinguishing_aspect: "POST /facilities/{id}/reopen while latest chemistry is still OUT_OF_RANGE returns ERR_REOPEN_CRITERIA_NOT_MET."
        test_recipe:
          setup: ["Facility F CLOSED_CHEMISTRY (after OUT_OF_RANGE log); no IN_RANGE follow-up"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG", certification_id: "RC-1", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-06-15T10:00:00Z", free_chlorine_ppm: 0.5, ph: 7.5, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "POST /facilities/${fac_id}/reopen"
              payload: {}
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REOPEN_CRITERIA_NOT_MET"
            - "Facility.${fac_id}.operational_status == CLOSED_CHEMISTRY"

  # =========================================================================
  # Section: endpoints — response envelope, list behavior, side-effect traces
  # =========================================================================
  - section: endpoints
    instances:

      - name: list_facilities_pagination_defaults
        claim_type: standard_crud
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /facilities without limit/offset uses defaults (limit=10, offset=0); envelope includes total_count and has_more."
        test_recipe:
          setup: ["Three facilities exist"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F1", address: "1 A", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
            - call: "POST /facilities"
              payload: { name: "F2", address: "2 B", max_bather_capacity: 60, lap_lane_count: 3 }
              as: AquaticsManager
            - call: "POST /facilities"
              payload: { name: "F3", address: "3 C", max_bather_capacity: 70, lap_lane_count: 4 }
              as: AquaticsManager
          trigger:
            - call: "GET /facilities"
              payload: {}
              as: AquaticsManager
              captures: { tc: $.meta.total_count }
          assert:
            - "response.meta.total_count == 3"
            - "response.data is array of length 3"

      - name: list_seasons_filtered_by_facility
        claim_type: standard_crud
        grounds: [endpoints]
        distinguishing_aspect: "GET /seasons?facility_id=X returns only seasons for that facility."
        test_recipe:
          setup: ["Facilities F1 and F2; one season per facility"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F1", address: "1", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { f1: $.data.id }
            - call: "POST /facilities"
              payload: { name: "F2", address: "2", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { f2: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${f1}", season_name: "S1", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
