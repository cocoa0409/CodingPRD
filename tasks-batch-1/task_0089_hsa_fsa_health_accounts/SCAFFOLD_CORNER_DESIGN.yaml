  - section: calculations
    instances:
      - name: available_balance_correct_after_contribution
        claim_type: Correct Result
        grounds: [calculations.Available-Balance, entities.Account.fields.available_balance_cents]
        distinguishing_aspect: "After a single 250000 HSA contribution, available_balance_cents == contributed_cents - reimbursed_cents == 250000."
