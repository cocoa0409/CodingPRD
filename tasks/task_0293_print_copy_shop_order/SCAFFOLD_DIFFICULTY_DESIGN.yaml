              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "r.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopStaff
            - call: "POST /orders/${order_id}/pay"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v3: $.data.version }
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${ord_v3}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: ShopStaff
          assert:
            - "Order.${order_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.lifetime_paid_cents == 0 (pay +5000 then refund -5000 conserves the pre-pay value)"
