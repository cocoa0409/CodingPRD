          setup:
            - "Market ORD has prep_capacity_per_day 5, so the daily-count rule cannot mask the bay rule."
            - "Vehicle VP holds a PENDING PREPARATION task in bay B1 on 2026-01-07 from 08:00 to 10:00, buffered to [07:00, 11:00]."
            - "Vehicle VQ has REGISTRATION and LICENSING COMPLETED and no PREPARATION task yet, so it is free to attempt one."
