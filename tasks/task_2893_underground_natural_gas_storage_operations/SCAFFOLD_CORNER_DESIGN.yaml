              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-01T06:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 500 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w1}", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
          trigger:
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "casing patched, retest witnessed by third party" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "GET /wells/${w1}"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "the completion returns HTTP 200"
            - "RemediationProgram.${p1}.status == COMPLETED, triggering_mit_id == ${m1}, well_id == ${w1}"
            - "RemediationProgram.${p1}.opened_at == 2026-08-02T06:00:00Z and due_at == 2026-09-16T06:00:00Z"
            - "RemediationProgram.${p1}.completed_by_user_id == eng-b, completed_at == 2026-08-02T06:00:00Z, verification_notes == casing patched, retest witnessed by third party"
            - "Well.${w1}.integrity_state == REMEDIATED and shut_in_reason == null"
            - "Well.${w1}.operational_state == SHUT_IN and service_change_count == 0 (the MIT-driven shut-in never counted as an operator service change)"
            - "StorageField.${f1}.wells_in_service_count == 1, field_posture == OPEN (the MIT_FAILED clause no longer matches), rates 150000 / 150000"
            - "GET /mechanical-integrity-tests/${m1} shows status == FAILED with outcome == FAIL and recorded_by_user_id == eng-a"

      - name: well_return_to_service_is_refused_until_the_remediation_program_closes
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Well.transitions.SHUT_IN_to_IN_SERVICE
          - validations.priority_7_ERR_INVALID_WELL_STATE
          - errors.ERR_INVALID_WELL_STATE
          - endpoints[POST /wells/{id}/service-change]
        distinguishing_aspect: |
          Returning a well to service has two independent guards that both report
          ERR_INVALID_WELL_STATE: integrity_state != MIT_FAILED and no RemediationProgram on the
          well in OPEN or ESCALATED. Immediately after a MIT failure BOTH are violated; after the
          program is completed BOTH clear at once (integrity_state REMEDIATED, program COMPLETED) —
          and only then does the service-change land, incrementing service_change_count from 0 to 1
          while integrity_state stays REMEDIATED rather than snapping back to MIT_CURRENT.
        test_recipe:
          setup:
            - "Field F_MINI with wells MINI-1 and MINI-2; MINI-1 has just failed a PRESSURE_TEST recorded by eng-a at 2026-08-02T06:00:00Z, so it is SHUT_IN / MIT_FAILURE / MIT_FAILED with an OPEN RemediationProgram."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-01T06:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 500 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w1}", status: "OPEN", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
          trigger:
            - call: "POST /wells/${w1}/service-change"
              payload: { to_operational_state: "IN_SERVICE" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "sleeve installed and pressure held" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "POST /wells/${w1}/service-change"
              payload: { to_operational_state: "IN_SERVICE" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "${e1} == ERR_INVALID_WELL_STATE with HTTP 409 while the program is OPEN"
            - "Well.${w1}.operational_state is still SHUT_IN with shut_in_reason == MIT_FAILURE and service_change_count == 0 after the refusal"
            - "the third call returns HTTP 200: Well.${w1}.operational_state == IN_SERVICE, shut_in_reason == null, service_change_count == 1"
            - "Well.${w1}.integrity_state == REMEDIATED (it does not revert to MIT_CURRENT without a fresh passing test)"
            - "StorageField.${f1}.wells_in_service_count == 2, field_posture == OPEN, rates 150000 / 150000"
            - "GET /remediation-programs with well_id ${w1} and status OPEN and limit 100 returns total_count == 0"

      - name: well_service_change_edges_that_are_not_declared_are_all_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Well.transitions.IN_SERVICE_to_SHUT_IN
          - state_machines.Well.transitions.SHUT_IN_to_PLUGGED
          - validations.priority_7_ERR_INVALID_WELL_STATE
          - errors.ERR_INVALID_WELL_STATE
        distinguishing_aspect: |
          Every undeclared move on the operational dimension collapses to one code
          (ERR_INVALID_WELL_STATE, 409) even though the reasons differ: a PENDING GasMovementTicket
          blocks IN_SERVICE -> SHUT_IN, a SCHEDULED MechanicalIntegrityTest blocks SHUT_IN ->
          PLUGGED, and PLUGGED is terminal so neither IN_SERVICE nor a second PLUGGED is reachable
          from it. None of the refusals increments service_change_count.
