          Contended resource: the exclusive CIP 52.0201 teaching slot held by a Program.
          Interval semantics are HALF-OPEN [launch_window_start, launch_window_end), so
          MSIS-A's window ending 2026-10-01 and MSIS-B's window starting 2026-10-01 merely
