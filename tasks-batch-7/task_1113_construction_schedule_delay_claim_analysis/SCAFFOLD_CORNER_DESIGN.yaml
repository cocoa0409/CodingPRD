          trigger:
            - call: "GET /construction-projects/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { rt: $.response_type, eid: $.data.error_id }
          assert:
            - "response_type == 'error'"
            - "data.error_id == 'ERR_NOT_FOUND'"
            - "data.message is a non-empty string"

