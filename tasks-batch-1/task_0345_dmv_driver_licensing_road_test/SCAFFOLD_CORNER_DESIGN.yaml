          - endpoints
        distinguishing_aspect: "POST /licenses/renew with expected_driver_record_version matching the current DriverRecord.version succeeds (201), supersedes the prior license (-> RENEWED), and bumps version."
        test_recipe:
          setup: ["An ACTIVE class-D licensed record with its current version read; a RENEWAL fee of 4000 cents captured."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Ada Occ", date_of_birth: "1986-01-01", state_code: "CA" }
