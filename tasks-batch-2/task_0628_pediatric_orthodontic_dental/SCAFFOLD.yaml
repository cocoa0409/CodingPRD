# =============================================================================
# Scaffold: Pediatric & Orthodontic Dental Office (traditional braces)
# Difficulty: Expert
# =============================================================================

scenario: |
  Pediatric & Orthodontic Dental Office (traditional braces): new-patient & growth
  records (pano/ceph), treatment plan & phased fee (braces/Invisalign), monthly
  contract & auto-pay, recurring adjustment-visit schedule, insurance ortho
  lifetime-max & ortho-rider, retention phase & retainer, broken-bracket/emergency,
  sibling/family discount

domain_name: ortho-dental-office
api_prefix: /

# All monetary amounts are integer cents. All datetimes are ISO 8601 UTC with three
# fractional digits. A logical clock (POST /_clock/set_current_utc) backs every
# due-date / scheduling rule; default startup clock is 2026-01-01T00:00:00Z.

complexity_profile:
  primary_archetype: ledger_reconciliation         # forward-looking benefit estimate vs chronological lifetime-max drawdown
  secondary_archetype: temporal_windowing           # adjustment/emergency visit scheduling on chair + provider resources
  complexity_layers:
    - dual_variant_calculation        # estimated_insurance_benefit (Plan) vs actual_benefit drawdown (Policy/Claim)
    - cascading_side_effects          # missed payment -> contract delinquent -> plan suspended -> future appts cancelled
    - optimistic_concurrency          # Contract create supersede uses expected_plan_version (OCC on TreatmentPlan.version)
    - derived_field_reconciliation    # family discount, financed balance, remaining lifetime-max kept consistent

  entity_topology: flat               # peer entities linked by FK fields; no deep URL nesting
  state_machine_shape: parallel       # Contract has billing_status x lifecycle_status; TreatmentPlan is cyclic
  relationship_patterns:
    - one_to_many                     # FamilyAccount->Patient, TreatmentPlan->TreatmentPhase, Contract->Installment
    - cross_aggregate                 # Appointment references Patient + Provider + Chair across aggregates
  role_model: peer_roles              # FrontDesk, Orthodontist, BillingSpecialist, Guardian, ClinicAdmin own different surfaces
  consistency_model: immediate        # all cascades applied atomically within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FamilyAccount
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: family_name, type: string, source: input, description: "Family surname / account label" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: guardian_user_id, type: string, source: input, description: "X-User-ID of the Guardian who owns this account (opaque external id stamped at create; Guardian ownership checks compare X-User-ID to this field)" }
      - { name: discount_tier_pct, type: number, source: computed, description: "Family/sibling discount percent currently in force, derived from count of this family's plans in {ACTIVE, RETENTION}: 0 if <2, 0.05 if ==2, 0.10 if >=3" }
      - { name: active_plan_count, type: integer, source: computed, description: "Count of this family's TreatmentPlans whose status is in {ACTIVE, RETENTION}" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: family_account_id, type: string, source: input, description: "FK -> FamilyAccount.id" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Patient DOB (ISO 8601 UTC)" }
      - { name: is_minor, type: boolean, source: input, description: "True if patient is a pediatric (minor) patient" }
      - { name: records_complete, type: boolean, source: computed, description: "True once both a PANO and a CEPH GrowthRecord with status FINALIZED exist for this patient" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: provider_user_id, type: string, source: input, description: "X-User-ID of the Orthodontist this Provider row represents (Orthodontist ownership checks compare X-User-ID to this field)" }
      - { name: full_name, type: string, source: input, description: "Provider full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether provider currently accepts appointments" }

  - name: Chair
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Operatory / chair label" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 10, description: "Minutes of cleanup/turnover reserved AFTER each appointment in this chair before the chair is free again" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether chair is in service" }

  - name: GrowthRecord
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: record_type, type: enum, source: input, description: "PANO | CEPH (panoramic or cephalometric growth film)" }
      - { name: taken_at, type: datetime, source: input, description: "When the film was captured (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED -> SUPERSEDED; only FINALIZED records count toward records_complete" }

  - name: InsurancePolicy
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: ortho_rider, type: boolean, source: input, description: "Whether the policy carries an orthodontic rider; if false the policy pays 0 toward ortho" }
      - { name: ortho_coverage_pct, type: number, source: input, description: "Fraction of billed ortho charges the rider covers, e.g. 0.50; ignored when ortho_rider is false" }
      - { name: lifetime_max_cents, type: integer, source: input, description: "Ortho lifetime maximum benefit in cents (the conserved benefit pool)" }
      - { name: remaining_max_cents, type: integer, source: computed, description: "Lifetime max not yet consumed; = lifetime_max_cents - sum(benefit_cents of this policy's claims in {APPROVED, PAID}); reduced on claim approval, restored on claim void" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> TERMINATED; TERMINATED policies reject new claims" }

  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; the policy whose ortho benefit estimate applies to this plan (nullable when self-pay)" }
      - { name: modality, type: enum, source: input, description: "BRACES | INVISALIGN; INVISALIGN applies a 1.15 modality multiplier to summed phase fees, BRACES applies 1.00" }
      - { name: planned_visit_interval_weeks, type: integer, source: input, default: 6, description: "Nominal weeks between recurring adjustment visits" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "round(sum(TreatmentPhase.phase_fee_cents) * modality_multiplier); pinned at PROPOSED->ACTIVE" }
      - { name: discount_pct_applied, type: number, source: computed, description: "Family discount fraction locked in at activation from the family discount tier" }
      - { name: net_fee_cents, type: integer, source: computed, description: "gross_fee_cents - min(round(gross_fee_cents * discount_pct_applied), DISCOUNT_CAP_CENTS); pinned at activation" }
      - { name: estimated_insurance_benefit_cents, type: integer, source: computed, description: "Forward-looking benefit estimate pinned at activation (see calc estimated_insurance_benefit)" }
      - { name: estimated_patient_responsibility_cents, type: integer, source: computed, description: "= net_fee_cents - estimated_insurance_benefit_cents; pinned at activation" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> ACTIVE -> RETENTION -> COMPLETED; PROPOSED can revert to DRAFT (revision loop); ACTIVE <-> SUSPENDED (cycle); ACTIVE/PROPOSED/DRAFT can go to CANCELLED" }

  - name: TreatmentPhase
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: sequence_no, type: integer, source: input, description: "1-based ordering of this phase within the plan" }
      - { name: label, type: string, source: input, description: "Phase label, e.g. 'Phase I expansion'" }
      - { name: phase_fee_cents, type: integer, source: input, description: "Fee attributed to this phase in cents" }

  - name: Contract
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: expected_plan_version, type: integer, source: input, description: "OCC: the TreatmentPlan.version the client last observed; rejected with 412 if stale" }
      - { name: down_payment_cents, type: integer, source: input, description: "Up-front amount paid at contract signing" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments (>=1)" }
      - { name: autopay_enabled, type: boolean, source: input, default: true, description: "Whether monthly installments auto-charge on their due date" }
      - { name: financed_amount_cents, type: integer, source: computed, description: "= TreatmentPlan.estimated_patient_responsibility_cents - down_payment_cents (the conserved financed balance); must be >= 0" }
      - { name: balance_remaining_cents, type: integer, source: computed, description: "= financed_amount_cents - sum(amount_cents of this contract's payments with status POSTED); restored when a payment is reversed" }
      - { name: billing_status, type: enum, source: system, description: "Parallel axis 1: CURRENT <-> DELINQUENT (cyclic); set DELINQUENT when any installment is MISSED, back to CURRENT when no MISSED installment remains" }
      - { name: lifecycle_status, type: enum, source: system, description: "Parallel axis 2: ACTIVE -> CLOSED; CLOSED on plan COMPLETED or full payoff" }

  - name: Installment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: sequence_no, type: integer, source: input, description: "1-based installment index within the contract schedule" }
      - { name: due_at, type: datetime, source: system, description: "Due date for this installment (ISO 8601 UTC)" }
      - { name: amount_cents, type: integer, source: computed, description: "Scheduled amount; floor(financed/term) for sequence 1..term-1, remainder for the final installment" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PAID, or SCHEDULED -> MISSED -> PAID (late cure); MISSED set when charge fails on/after due_at" }

  - name: Payment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: installment_id, type: string, source: input, description: "FK -> Installment.id; the installment this payment satisfies (nullable for ad-hoc payoff)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: method, type: enum, source: input, description: "AUTOPAY | CARD | CASH | CHECK" }
      - { name: status, type: enum, source: system, description: "POSTED -> REVERSED; POSTED reduces balance_remaining, REVERSED restores it" }

  - name: InsuranceClaim
    parent: InsurancePolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the plan whose treatment this claim bills for" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Amount billed to the carrier for this claim" }
      - { name: benefit_cents, type: integer, source: computed, description: "Benefit awarded on approval = min(round(billed_amount_cents * policy.ortho_coverage_pct), policy.remaining_max_cents at approval time); 0 until APPROVED, 0 after VOID" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED -> PAID; SUBMITTED/APPROVED -> DENIED; APPROVED -> VOID (compensating reversal restores remaining_max)" }

  - name: Appointment
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: chair_id, type: string, source: input, description: "FK -> Chair.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the plan this visit advances (required for ADJUSTMENT/BONDING/DEBOND, nullable for EMERGENCY new-patient triage)" }
      - { name: visit_type, type: enum, source: input, description: "BONDING | ADJUSTMENT | EMERGENCY | DEBOND; ADJUSTMENT is the recurring schedule, EMERGENCY is broken-bracket/urgent" }
      - { name: starts_at, type: datetime, source: input, description: "Appointment start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Appointment end (ISO 8601 UTC); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CHECKED_IN -> COMPLETED; SCHEDULED -> CANCELLED; SCHEDULED/CHECKED_IN -> NO_SHOW" }

  - name: Retainer
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: retainer_type, type: enum, source: input, default: HAWLEY, description: "HAWLEY | CLEAR | FIXED" }
      - { name: issued_at, type: datetime, source: system, description: "When the retainer was issued (clock value at plan DEBOND/COMPLETED)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> REPLACED; a broken retainer is REPLACED by issuing a new one" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrowthRecord
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /growth-records/{id}/finalize"
        actor: Orthodontist
        preconditions:
          - "GrowthRecord.status == DRAFT"
        side_effects:
          - "If a FINALIZED GrowthRecord of the same record_type already exists for this patient, that prior record transitions to SUPERSEDED"
          - "Recompute Patient.records_complete: true iff the patient now has one FINALIZED PANO and one FINALIZED CEPH"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a newer GrowthRecord of the same record_type is FINALIZED"
        actor: system
        preconditions:
          - "A newer same-type GrowthRecord for the patient transitions to FINALIZED"
        side_effects:
          - "Recompute Patient.records_complete"

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /insurance-policies/{id}/terminate"
        actor: BillingSpecialist
        preconditions:
          - "InsurancePolicy.status == ACTIVE"
          - "No InsuranceClaim for this policy is in status APPROVED (an APPROVED-but-unpaid claim has drawn benefit and would be stranded) (ERR_POLICY_HAS_OPEN_CLAIMS)"
        side_effects:
          - "Policy rejects new claim SUBMISSION while TERMINATED; SUBMITTED claims left from before termination can no longer be APPROVED"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /treatment-plans/{id}/propose"
        actor: Orthodontist
        preconditions:
          - "TreatmentPlan.status == DRAFT"
          - "Plan has at least one TreatmentPhase (ERR_NO_PHASES)"
        side_effects:
          - "increments TreatmentPlan.version by 1"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /treatment-plans/{id}/revise"
        actor: Orthodontist
        note: "Revision loop — Guardian rejected the proposal; plan returns to DRAFT for edits (cyclic)."
        preconditions:
          - "TreatmentPlan.status == PROPOSED"
        side_effects:
          - "increments TreatmentPlan.version by 1"
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate"
        actor: Guardian
        preconditions:
          - "TreatmentPlan.status == PROPOSED"
          - "Patient.records_complete == true for this plan's patient (ERR_RECORDS_INCOMPLETE)"
        side_effects:
          - "Pin gross_fee_cents = round(sum(phase_fee_cents) * modality_multiplier)"
          - "Pin discount_pct_applied from the family discount tier computed INCLUDING this plan (see calc family_discount_tier)"
          - "Pin net_fee_cents = gross_fee_cents - min(round(gross_fee_cents * discount_pct_applied), DISCOUNT_CAP_CENTS)"
          - "Pin estimated_insurance_benefit_cents and estimated_patient_responsibility_cents (calc estimated_insurance_benefit)"
          - "Recompute FamilyAccount.active_plan_count and FamilyAccount.discount_tier_pct"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: owning Contract billing_status becomes DELINQUENT"
        actor: system
        note: "Cyclic — cleg 3 of the delinquency cascade."
        preconditions:
          - "TreatmentPlan.status == ACTIVE"
        side_effects:
          - "All future Appointments for this plan with status SCHEDULED and starts_at > clock-now transition to CANCELLED (cascade leg 4)"
          - "Recompute FamilyAccount.active_plan_count and FamilyAccount.discount_tier_pct"
          - "increments TreatmentPlan.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: owning Contract billing_status returns to CURRENT"
        actor: system
        note: "Cyclic — plan resumes once delinquency is cured."
        preconditions:
          - "TreatmentPlan.status == SUSPENDED"
        side_effects:
          - "Recompute FamilyAccount.active_plan_count and FamilyAccount.discount_tier_pct"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: RETENTION
        trigger: "POST /treatment-plans/{id}/debond"
        actor: Orthodontist
        preconditions:
          - "TreatmentPlan.status == ACTIVE"
          - "A completed DEBOND Appointment exists for this plan, OR the request supplies retainer_type to issue the retainer inline"
        side_effects:
          - "Create a Retainer for this plan in status ISSUED with issued_at = clock-now (cascade leg 2a)"
          - "Recompute FamilyAccount.active_plan_count and FamilyAccount.discount_tier_pct"
          - "increments TreatmentPlan.version by 1"
      - from: RETENTION
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/complete"
        actor: Orthodontist
        preconditions:
          - "TreatmentPlan.status == RETENTION"
        side_effects:
          - "Owning Contract lifecycle_status -> CLOSED (cascade leg 2b)"
          - "Recompute FamilyAccount.active_plan_count and FamilyAccount.discount_tier_pct"
          - "increments TreatmentPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: Orthodontist
        preconditions:
          - "TreatmentPlan.status == DRAFT"
        side_effects:
          - "increments TreatmentPlan.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: Orthodontist
        preconditions:
          - "TreatmentPlan.status == PROPOSED"
        side_effects:
          - "increments TreatmentPlan.version by 1"

  - entity: Contract
    initial_state: { billing_status: CURRENT, lifecycle_status: ACTIVE }
    terminal_states: [CLOSED]   # lifecycle_status terminal; billing_status remains cyclic until CLOSED
    transitions:
      - from: "billing_status=CURRENT"
        to: "billing_status=DELINQUENT"
        trigger: "system: an Installment for this contract transitions to MISSED"
        actor: system
        note: "Parallel axis 1, cascade leg 2."
        preconditions:
          - "Contract.lifecycle_status == ACTIVE"
          - "Contract.billing_status == CURRENT"
        side_effects:
          - "Owning TreatmentPlan transitions ACTIVE -> SUSPENDED (cascade leg 3)"
      - from: "billing_status=DELINQUENT"
        to: "billing_status=CURRENT"
        trigger: "system: the last MISSED Installment for this contract transitions to PAID"
        actor: system
        note: "Parallel axis 1 (cyclic) — cure."
        preconditions:
          - "Contract.lifecycle_status == ACTIVE"
          - "Contract.billing_status == DELINQUENT"
          - "No Installment for this contract remains in status MISSED"
        side_effects:
          - "Owning TreatmentPlan transitions SUSPENDED -> ACTIVE if currently SUSPENDED"
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=CLOSED"
        trigger: "system: owning TreatmentPlan reaches COMPLETED, OR balance_remaining_cents reaches 0"
        actor: system
        note: "Parallel axis 2."
        preconditions:
          - "Contract.lifecycle_status == ACTIVE"
        side_effects:
          - "Any remaining SCHEDULED Installments with amount owed remain on record but no further autopay fires once CLOSED"

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /payments (a POSTED Payment covers this installment) or POST /installments/{id}/charge succeeds"
        actor: BillingSpecialist
        preconditions:
          - "Installment.status in {SCHEDULED, MISSED}"
          - "Contract.lifecycle_status == ACTIVE"
        side_effects:
          - "balance_remaining_cents decreases by the posted payment amount"
          - "If this installment was MISSED and no MISSED installment remains, Contract billing_status -> CURRENT (cascade cure)"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /installments/{id}/charge with outcome FAILED while clock-now >= due_at"
        actor: BillingSpecialist
        note: "Cascade leg 1 origin of the delinquency cascade."
        preconditions:
          - "Installment.status == SCHEDULED"
          - "clock-now >= Installment.due_at (ERR_NOT_YET_DUE)"
        side_effects:
          - "Owning Contract billing_status -> DELINQUENT if currently CURRENT (cascade leg 2)"
      - from: MISSED
        to: PAID
        trigger: "POST /payments covering this installment (late cure)"
        actor: BillingSpecialist
        preconditions:
          - "Installment.status == MISSED"
        side_effects:
          - "balance_remaining_cents decreases by the posted payment amount"
          - "If no MISSED installment remains, Contract billing_status -> CURRENT, owning plan SUSPENDED -> ACTIVE"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "Payment.status == POSTED"
          - "Contract.lifecycle_status == ACTIVE (ERR_CONTRACT_CLOSED)"
        side_effects:
          - "balance_remaining_cents increases by amount_cents (conservation: financed_amount_cents == balance_remaining_cents + sum(POSTED payments))"
          - "If the covered Installment was PAID and clock-now >= its due_at, that Installment -> MISSED, possibly re-triggering the delinquency cascade"

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, VOID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /insurance-claims/{id}/approve"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
          - "InsurancePolicy.status == ACTIVE (ERR_POLICY_TERMINATED)"
          - "Policy ortho_rider == true (ERR_NO_ORTHO_RIDER)"
        side_effects:
          - "Compute benefit_cents = min(round(billed_amount_cents * ortho_coverage_pct), remaining_max_cents); claims consume the pool in created_at ASC order"
          - "InsurancePolicy.remaining_max_cents decreases by benefit_cents (conservation)"
      - from: APPROVED
        to: PAID
        trigger: "POST /insurance-claims/{id}/mark-paid"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == APPROVED"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /insurance-claims/{id}/deny"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: VOID
        trigger: "POST /insurance-claims/{id}/void"
        actor: BillingSpecialist
        note: "Compensating action — must leave lifetime_max_cents conserved."
        preconditions:
          - "InsuranceClaim.status == APPROVED"
        side_effects:
          - "InsurancePolicy.remaining_max_cents increases by benefit_cents (restores the pool)"
          - "benefit_cents reset to 0 (invariant: lifetime_max_cents == remaining_max_cents + sum(benefit_cents of {APPROVED, PAID} claims))"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "clock-now >= starts_at minus 60 minutes (ERR_TOO_EARLY_CHECKIN)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Orthodontist
        preconditions:
          - "Appointment.status == CHECKED_IN"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel (or system cascade from plan SUSPEND)"
        actor: FrontDesk
        preconditions:
          - "Appointment.status == SCHEDULED"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "clock-now >= starts_at (ERR_TOO_EARLY_NOSHOW)"
        side_effects: []
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment.status == CHECKED_IN"
        side_effects: []

  - entity: Retainer
    initial_state: ISSUED
    terminal_states: [REPLACED]
    transitions:
      - from: ISSUED
        to: REPLACED
        trigger: "POST /retainers/{id}/replace"
        actor: Orthodontist
        preconditions:
          - "Retainer.status == ISSUED"
        side_effects:
          - "A new Retainer is created for the same plan in status ISSUED with issued_at = clock-now"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: contract-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /contracts"
    occ_field: "expected_plan_version"
    description: |
      Creating a Contract against a TreatmentPlan whose version has advanced since
      the client last observed it is rejected. A Contract legitimately supersedes
      any prior contract for the same plan; if another writer has just created the
      first contract (which bumps the plan version via its derived-field
      reconciliation) or the plan was revised/activated again, the current writer's
      observed plan version is stale and the create is refused.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: family_discount_tier
    trigger: "TreatmentPlan PROPOSED->ACTIVE (and recomputed on any plan entering/leaving {ACTIVE, RETENTION})"
    algorithm: threshold
    formula: |
      # Counts the family's plans that are in-treatment, INCLUDING the plan being activated.
      n = count(TreatmentPlan p where p.patient.family_account_id == this.family
                and p.status in {ACTIVE, RETENTION})
      if n < 2:   discount_pct = 0.00
      elif n == 2: discount_pct = 0.05
      else:        discount_pct = 0.10   # n >= 3
      FamilyAccount.discount_tier_pct = discount_pct
      FamilyAccount.active_plan_count = n
    input_set: "TreatmentPlans of the family whose status is in {ACTIVE, RETENTION}; the activating plan is counted as ACTIVE for this evaluation."
    constants:
      TIER2_PCT: 0.05
      TIER3_PCT: 0.10
    precision: "discount_pct is an exact fraction; downstream cents rounded round_half_up"

  - name: net_plan_fee
    trigger: "TreatmentPlan PROPOSED->ACTIVE"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs (summed phase fees, modality, family discount tier) with
      # conditional branch on modality and a nested min() cap on the discount.
      sum_phase = sum(TreatmentPhase.phase_fee_cents for phases of this plan)
      modality_multiplier = 1.15 if modality == INVISALIGN else 1.00
      gross_fee_cents = round_half_up(sum_phase * modality_multiplier)
      discount_pct_applied = family_discount_tier.discount_pct   # locked at activation
      raw_discount = round_half_up(gross_fee_cents * discount_pct_applied)
      discount = min(raw_discount, DISCOUNT_CAP_CENTS)
      net_fee_cents = gross_fee_cents - discount
    input_set: "All TreatmentPhases of the plan; family discount tier evaluated at activation."
    constants:
      INVISALIGN_MULTIPLIER: 1.15
      BRACES_MULTIPLIER: 1.00
      DISCOUNT_CAP_CENTS: 75000
    precision: "2 decimal places implied via integer cents, round_half_up at each round() call. Evaluation order pinned: sum_phase -> gross -> discount -> net."

  - name: estimated_insurance_benefit
    trigger: "TreatmentPlan PROPOSED->ACTIVE"
    algorithm: forward_looking
    formula: |
      # Forward-looking: assumes the entire net fee is billable to the rider and that
      # the FULL remaining lifetime max is available to THIS plan at activation time.
      if plan.policy_id is null or policy.ortho_rider == false:
        estimated_insurance_benefit_cents = 0
      else:
        projected = round_half_up(net_fee_cents * policy.ortho_coverage_pct)
        estimated_insurance_benefit_cents = min(projected, policy.remaining_max_cents)  # snapshot at activation
      estimated_patient_responsibility_cents = net_fee_cents - estimated_insurance_benefit_cents
    input_set: "net_fee_cents (just pinned), policy.ortho_coverage_pct, policy.remaining_max_cents snapshot at activation."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: estimate
        when: "Pinned once at plan activation (forward-looking projection)."
        difference: "Uses remaining_max snapshot and assumes net_fee is fully rider-billable in one shot."

  - name: actual_benefit_drawdown
    trigger: "InsuranceClaim SUBMITTED->APPROVED"
    algorithm: chronological
    formula: |
      # Chronological: claims for a policy are processed in created_at ASC order
      # (tie-break created_at, which is unique to the millisecond); each approval
      # consumes the pool as it stands when THAT claim is approved.
      benefit_cents = min(round_half_up(claim.billed_amount_cents * policy.ortho_coverage_pct),
                          policy.remaining_max_cents)   # value at the moment of THIS approval
      policy.remaining_max_cents -= benefit_cents
    input_set: "claim.billed_amount_cents, policy.ortho_coverage_pct, policy.remaining_max_cents at approval time (already reduced by earlier-approved claims)."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: actual
        when: "Each claim approval, processed in chronological created_at ASC order."
        difference: "Pool may already be partly consumed by earlier (e.g. emergency) claims, so the sum of actual benefits across a plan's claims can be LESS than estimated_insurance_benefit_cents for that plan."

  - name: installment_schedule
    trigger: "POST /contracts (Contract creation)"
    algorithm: waterfall_allocation
    formula: |
      # Mode (b): rounding ORDER pinned. Interpretation chosen:
      #   per_month = floor(financed / term); installments 1..term-1 get per_month;
      #   the FINAL installment gets the remainder so sum(installments) == financed exactly.
      # (NOT round_half_up(financed/term) on every installment, which would drift from financed.)
      financed = TreatmentPlan.estimated_patient_responsibility_cents - down_payment_cents   # must be >= 0 else ERR_DOWN_PAYMENT_EXCEEDS
      per_month = floor(financed / term_months)
      for k in 1..term_months-1: installment[k].amount_cents = per_month
      installment[term_months].amount_cents = financed - per_month * (term_months - 1)
      installment[k].due_at = contract.created_at + k * 1 month (k-th month boundary at clock-now anchor)
      financed_amount_cents = financed
      balance_remaining_cents = financed
    input_set: "estimated_patient_responsibility_cents of the plan, down_payment_cents, term_months."
    constants:
      MONTH_STEP_DAYS: 30
    precision: "integer cents; floor division for 1..term-1, exact remainder on the final installment (no drift). due_at computed as created_at + k*30 days."

  - name: contract_balance
    trigger: "Payment POSTED, Payment REVERSED, Installment charge"
    algorithm: aggregation
    formula: |
      balance_remaining_cents = financed_amount_cents
                                - sum(p.amount_cents for Payment p of this contract where p.status == POSTED)
      # Conservation invariant: financed_amount_cents == balance_remaining_cents
      #                         + sum(POSTED payment amounts). A POSTED+REVERSED pair nets to 0.
    input_set: "Payments of the contract in status POSTED only; REVERSED payments excluded."
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix; entity_backed roles must own the targeted resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, ends_at > starts_at, term_months >= 1, amounts >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: Contract create — expected_plan_version must equal the current TreatmentPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /contracts"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity precondition references resolve and the referenced entity is in the required state (e.g. plan ACTIVE for an ADJUSTMENT appointment; policy ACTIVE for claim approval)"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /appointments, POST /insurance-claims/{id}/approve, POST /treatment-plans/{id}/activate"

  - priority: 8
    category: business_safety
    check: "Patient growth records complete (FINALIZED PANO + FINALIZED CEPH) before a plan may be activated"
    error_id: ERR_RECORDS_INCOMPLETE
    http_status: 409
    applies_to: "POST /treatment-plans/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "Chair temporal overlap: requested [starts_at, ends_at + chair.turnover_buffer_minutes) must not overlap any non-terminal appointment in the same chair (closed-with-buffer interval)"
    error_id: ERR_CHAIR_CONFLICT
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10
    category: business_temporal
    check: "Provider temporal overlap: requested [starts_at, ends_at) must not overlap any non-terminal appointment for the same provider (half-open, no buffer; adjacency ends_at==starts_at allowed)"
    error_id: ERR_PROVIDER_CONFLICT
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 11
    category: business_temporal
    check: "An installment may only be MISSED via charge-FAILED when clock-now >= due_at"
    error_id: ERR_NOT_YET_DUE
    http_status: 409
    applies_to: "POST /installments/{id}/charge"

  - priority: 12
    category: business_fiscal
    check: "Contract down_payment_cents must not exceed plan estimated_patient_responsibility_cents (financed must be >= 0)"
    error_id: ERR_DOWN_PAYMENT_EXCEEDS
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 13
    category: business_fiscal
    check: "A Payment amount must not exceed the contract's balance_remaining_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /payments"

