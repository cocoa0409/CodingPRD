      - name: charge_limit_safety_outranks_model_not_certified_on_line_add
        grounds:
          - validations.priority_11_ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED
          - validations.priority_15_ERR_MODEL_NOT_CERTIFIED
          - calculations.refrigerant_charge_basis
          - errors.ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          A different category pair — business_safety (priority 11) versus business_referential
          (priority 15) — on a different endpoint: the ordered model is both over the
          R-290 flammable-charge ceiling (3400 g installed against a 300 g limit) and not
          CERTIFIED, and the safety ceiling must win with 422 ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Refrigerant R-290 with gwp_100yr 3, safety_class A3 and max_charge_grams 300, allowed on REMOTE and SELF_CONTAINED."
            - "CaseModel MDL-MT-8P built on R-290 as REMOTE with charge_grams 280 and line_set_length_ft 120; after the airflow model its installed_charge_grams is 3400, far above the 300 g ceiling, and its status is MODELED (never certified)."
            - "StorePlan FreshMart/0412 in DRAFT with no lines."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-290", trade_name: "Propane", gwp_100yr: 3, safety_class: "A3", max_charge_grams: 300, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
