            - "Ejaculate.${ej_id}.total_doses_theoretical == 480"

      - name: settlement_rebate_tier_keyed_on_pre_rebate_subtotal
        grounds:
          - calculations.consignment_settlement
          - calculations.distributor_exposure
          - entities.ConsignmentTransfer.fields.rebate_cents
          - entities.ConsignmentTransfer.fields.settlement_total_cents
          - entities.ConsignmentTransfer.fields.tank_service_count_at_dispatch
        distinguishing_aspect: |
          Mode (c) - the dependency looks circular and the pinned evaluation order decides the cents: the
          rebate tier is keyed on the PRE-REBATE subtotal (gross 488000 + service fee 12000 = 500000, which
          reaches the 3% tier) while the rebate itself applies to gross only (14640), giving 485360. Keying
          the tier on gross alone (488000 < 500000) would return 0% and 500000; keying it on the post-rebate
          total would not terminate. Only the pinned order produces 485360.
        test_recipe:
          setup:
            - "Facility F-IA-03 (US, housing_capacity 2, bench_capacity 1) is APPROVED."
            - "Sire REG-B is RESIDENT and ELIGIBLE at F-IA-03 with all four required tests NEGATIVE until 2027-08-01."
            - "A CONVENTIONAL StrawLot of 200 straws at processing_cost_cents 250000 is RELEASED (unit_book_value_cents 1250)."
