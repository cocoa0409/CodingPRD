            - "SyndicationRecord.${sr1_id}.syndicated_at == null and rejection_reason == null and takedown_requested_at == null"
            - "the list filtered by retailer_id returns total_count == 1 with data[0].id == ${sr1_id}"
            - "Campaign.${camp_id}.syndicated_review_count == 0 (queueing publishes nothing)"

  # ===========================================================================
  # Table 6 breadth: the guide asks only that every catalogue code be
  # triggerable. The instances below close the gap left by the sections above;
  # the header map records which instance owns which code.
  - section: errors
    instances:

      - name: kit_line_receipt_on_unknown_line_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_KIT_LINE_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "The path-template id of a nested write is resolved before its body is applied: a receipt against a never-persisted kit-line id is a 404, not a 200 that silently creates stock."
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kit-lines/99999999-9999-4999-8999-999999999999/receipts"
              payload: { units: 5 }
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_KIT_LINE_NOT_FOUND"
            - "response_type == error"
            - "GET /kit-lines returns total_count == 0"

      - name: wave_create_on_unknown_center_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FULFILLMENT_CENTER_NOT_FOUND]
          - validations[priority=8]
        distinguishing_aspect: "A body FK on a create call, not a path id: the window is legal so priority 6 passes, and the only remaining objection is that fulfillment_center_id resolves to nothing."
        test_recipe:
          setup:
            - "Empty database; no fulfillment center has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "99999999-9999-4999-8999-999999999999", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_FULFILLMENT_CENTER_NOT_FOUND"
            - "GET /fulfillment-waves returns total_count == 0"

      - name: wave_lock_on_unknown_wave_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FULFILLMENT_WAVE_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "A transition endpoint on an absent row answers 404 from the existence layer (priority 7), never 409 from the state layer (priority 10) — there is no state to be wrong about."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fulfillment-waves/99999999-9999-4999-8999-999999999999/lock"
              payload: {}
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_FULFILLMENT_WAVE_NOT_FOUND"

      - name: enrollment_create_with_unknown_panelist_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PANELIST_NOT_FOUND]
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: "Two objections are live at once and the earlier one must win: the campaign is still DRAFT (priority 11 would say ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS) but panelist_id does not resolve, and existence at priority 8 outranks state at priority 11."
        test_recipe:
          setup:
            - "One campaign left in DRAFT; no panelist has ever been registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Draft Only", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "99999999-9999-4999-8999-999999999999", screening_answers: { household_size: 2, attests_no_resale: true } }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_PANELIST_NOT_FOUND"
            - "Campaign.${camp_id}.status == DRAFT"
            - "GET /enrollments?campaign_id=${camp_id} returns total_count == 0"

      - name: purchase_match_with_unknown_enrollment_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - validations[priority=8]
          - endpoints[POST /purchase-matches]
        distinguishing_aspect: "The purchase-data ingestion path is FK-checked exactly like the campaign paths: a match row for an enrollment that does not exist is refused before any window or confidence rule is consulted, so the out-of-window value in the payload is never reported."
        test_recipe:
          setup:
            - "Empty database; no enrollment exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /purchase-matches"
              payload: { enrollment_id: "99999999-9999-4999-8999-999999999999", retailer_channel_code: "RETAIL_WEB", purchase_amount_cents: 4999, purchased_at: "2026-08-05T00:00:00Z", match_confidence: 0.95 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_ENROLLMENT_NOT_FOUND"

      - name: syndication_record_with_unknown_review_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVIEW_NOT_FOUND]
          - validations[priority=8]
        distinguishing_aspect: "Left-to-right FK order on a two-FK body: review_submission_id is the first input field, so an unknown review is reported even though the retailer in the same payload is perfectly real."
        test_recipe:
          setup:
            - "One registered retailer; no review has ever been drafted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "BigBox", feed_status: "ACCEPTING", requires_disclosure_badge: false, min_star_rating_accepted: 1, max_reviews_per_panelist_per_month: 5 }
              as: PlatformAdmin
              captures: { rt1_id: $.data.id }
          trigger:
            - call: "POST /syndication-records"
              payload: { review_submission_id: "99999999-9999-4999-8999-999999999999", retailer_id: "${rt1_id}" }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_REVIEW_NOT_FOUND"
            - "GET /syndication-records?retailer_id=${rt1_id} returns total_count == 0"

      - name: campaign_create_with_unknown_syndication_retailer_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RETAILER_NOT_FOUND]
          - validations[priority=8]
          - entities.Campaign.fields.syndication_retailer_ids
        distinguishing_aspect: "The FK check reaches inside an array field and keeps going: the first element resolves, the second does not, and the campaign is not persisted at all — no partially registered retailer list survives."
        test_recipe:
          setup:
            - "One registered retailer whose id is the first element of the array; the second element is a never-persisted uuid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "ShelfMart", feed_status: "ACCEPTING", requires_disclosure_badge: false, min_star_rating_accepted: 1, max_reviews_per_panelist_per_month: 5 }
              as: PlatformAdmin
              captures: { rt1_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Bad Retailer List", objective_type: "AWARENESS", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: ["${rt1_id}", "99999999-9999-4999-8999-999999999999"], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_RETAILER_NOT_FOUND"
            - "GET /campaigns returns total_count == 0"

      - name: dispatch_on_unknown_syndication_record_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SYNDICATION_RECORD_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "Dispatch is the most heavily guarded action in the API (posture, feed status, panelist integrity, eligibility), yet none of those guards can speak first: an unresolvable record id is a plain 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /syndication-records/99999999-9999-4999-8999-999999999999/dispatch"
              payload: {}
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_SYNDICATION_RECORD_NOT_FOUND"

      - name: investigate_on_unknown_diversion_case_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DIVERSION_CASE_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "The compliance branch of the API is covered too: investigating a case id that was never opened is 404, and no panelist risk score is recomputed as a side effect of the failed call."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /diversion-cases/99999999-9999-4999-8999-999999999999/investigate"
              payload: {}
              as: ComplianceModerator
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_DIVERSION_CASE_NOT_FOUND"
            - "GET /diversion-cases returns total_count == 0"

      - name: get_unknown_lift_analysis_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LIFT_ANALYSIS_NOT_FOUND]
          - validations[priority=7]
          - endpoints[GET /lift-analyses/{lift_analysis_id}]
        distinguishing_aspect: "A read, not a write, and the last uncovered 404 in the catalogue: the analysis-retrieval path resolves its path id through the same existence layer as every mutating endpoint."
        test_recipe:
          setup:
            - "Empty database; no lift analysis has been computed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /lift-analyses/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_LIFT_ANALYSIS_NOT_FOUND"

      - name: get_unknown_purchase_match_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PURCHASE_MATCH_NOT_FOUND]
          - validations[priority=7]
          - endpoints[GET /purchase-matches/{purchase_match_id}]
        distinguishing_aspect: "The conversion-measurement read resolves its own path id: an unknown purchase-match id is a 404 on the PurchaseMatch collection, not a fall-through to the enrollment-scoped sub-resource read, which returns an empty list instead."
        test_recipe:
          setup:
            - "Empty database; no purchase match has been ingested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /purchase-matches/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_PURCHASE_MATCH_NOT_FOUND"
            - "GET /purchase-matches returns total_count == 0"

      - name: retire_an_already_retired_kit_line_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_KIT_LINE_STATE]
          - state_machines.KitLine[ACTIVE -> RETIRED]
        distinguishing_aspect: "RETIRED is terminal for KitLine, so the second retire is a state error rather than an idempotent no-op: the line's version must not move again."
        test_recipe:
          setup:
            - "One DRAFT campaign with one kit line that has already been retired once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Retire Twice", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id, kl1_v0: $.data.version }
            - call: "POST /kit-lines/${kl1_id}/retire"
              payload: {}
              as: CampaignManager
