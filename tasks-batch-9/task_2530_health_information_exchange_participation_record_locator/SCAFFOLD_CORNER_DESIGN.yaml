          - state_machines.IdentityCluster.ACTIVE_to_MERGED_AWAY
          - state_machines.MatchLink.PROPOSED_to_AUTO_LINKED
        distinguishing_aspect: |
          The very same directive payload is accepted or refused purely on the addressed cluster's
          status, which is a different entity from the one being created. After a DETERMINISTIC_FIRST
          auto-link merges the later cluster into the earlier one, the loser is MERGED_AWAY with
          member_record_count 0 and rejects the directive with ERR_CLUSTER_MERGED_AWAY (409), while the
          ACTIVE survivor - now holding both records - accepts it. Both requests carry a correct
          expected_cluster_version, so the 409 cannot be confused with the priority-9 OCC 412.
        test_recipe:
          setup:
            - "An ACTIVE ConsentPolicy exists (priority 15 must not fire)."
            - "A DETERMINISTIC_FIRST generation with auto_link_threshold 0.9200 is ACTIVE."
            - "Two participants at CONFORMANCE_TESTING contribute one record each; the pair agrees on ssn_last4 and birth_date, so the deterministic score is 1.0000 and the link auto-links, merging the second record's cluster into the first."
