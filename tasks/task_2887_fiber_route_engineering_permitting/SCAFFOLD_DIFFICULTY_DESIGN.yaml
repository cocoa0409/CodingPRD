            - "the Route is SCOPE_LOCKED"
            - "a MUNICIPAL_ROW PermitApplication on sequence_index 1 is APPROVED, so that segment is permit_status CLEARED"
            - "sequence_index 2 has NO PermitApplication at all, so it is still permit_status NOT_REQUIRED"
            - "one DesignPackage revision 1 with fiber_count_allocated 288 and express_fiber_count 48, holding two PLACED HANDHOLE SplicePoints on sequence_index 1 at stations 0 and 250 dropping 24 fibers each, status IN_REVIEW, submitted by eng-alice"
