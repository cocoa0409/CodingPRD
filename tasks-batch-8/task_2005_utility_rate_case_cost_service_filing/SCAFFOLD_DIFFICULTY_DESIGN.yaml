            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-order-pending", payload: {}, as: ALJ }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rc}/issue-order", payload: { approved_tariff_ids: ["${t_res}", "${t_com}"], approved_asset_ids: ["${ra1}"] }, as: ALJ }
          assert:
            - "RateCase.${rc}.status == DECIDED and authorized_revenue_requirement_cents == 1850000000 (adopted from the RECOMMENDED proposal)"
            - "Hop 1: TariffRate.${t_res}.status == APPROVED, TariffRate.${t_com}.status == APPROVED, TariffRate.${t_x}.status == REJECTED (unlisted PROPOSED)"
            - "Hop 2: CustomerClass.${cls_res}.approved_revenue_cents == 1212000000; CustomerClass.${cls_com}.approved_revenue_cents == 695088000"
            - "Hop 3: RateCase.${rc}.revenue_at_approved_rates_cents == 1907088000 (== 1212000000 + 695088000; the REJECTED 666,000,000 tariff contributes nothing)"
            - "RegulatoryAsset.${ra1}.status == APPROVED_FOR_AMORTIZATION with exactly 4 PENDING AmortizationEntry rows generated"
            - "SettlementProposal.${sp1}.status == ADOPTED"

      - name: signatory_unanimity_bubble_cascade
        grounds:
          - state_machines.SettlementSignatory.PENDING_to_SIGNED
          - state_machines.SettlementProposal.UNDER_NEGOTIATION_to_ASSENTED
          - entities.RateCase.fields.assented_proposal_count
        distinguishing_aspect: |
          Trigger = POST sign on the LAST PENDING signatory. Depth 3: hop 1 the
          signatory flips PENDING -> SIGNED; hop 2 the resulting signature
          recount on the parent proposal reaches unanimity (2 == 2) and bubbles
          the proposal UNDER_NEGOTIATION -> ASSENTED; hop 3 that bubble
          increments RateCase.assented_proposal_count to 1. Signing the FIRST
          signatory (already done in setup) performed hop 1 with NO hop 2 —
          the cascade is conditional on the aggregate reaching unanimity.
        test_recipe:
          setup:
            - "Canonical case in SETTLEMENT; SP1 circulated to I1 and I2; sig1 already SIGNED (proposal still UNDER_NEGOTIATION, count 1 of 2)"
