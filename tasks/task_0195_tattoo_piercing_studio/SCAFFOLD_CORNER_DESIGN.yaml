  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_appointments_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Appointment]
        distinguishing_aspect: "GET /studio/appointments returns response_type array with pagination meta (total_count, has_more) and respects limit."
        test_recipe:
          setup: ["Two HELD appointments for the same client."]
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "LP Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "LP Chair 1" }
              as: StudioManager
              captures: { ch1: $.data.id, ch1v: $.data.version }
            - call: "POST /studio/chairs"
              payload: { label: "LP Chair 2" }
              as: StudioManager
              captures: { ch2: $.data.id, ch2v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "LP Client", email: "lp@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${ch1}", expected_chair_version: "${ch1v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T11:00:00Z" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${ch2}", expected_chair_version: "${ch2v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "GET /studio/appointments"
              payload: { client_id: "${cid}", limit: 1, offset: 0 }
              as: Client
              as_user_id: "${cid}"
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"
            - "len(data) == 1"

      - name: payout_computed_read_excluded
        claim_type: Computed read
        grounds: [endpoints, calculations.artist_payout]
        excluded_because:
          difficulty_instance: combinatorial_formula / payout_three_input_nonlinear_floor
          rationale: "The payout computed-read endpoint is exercised by the named §1.8 instance."

