          - entities.Family.fields.wallet_credit_cents
          - entities.Invoice.fields.wallet_applied_cents
        distinguishing_aspect: |
          Conserved quantity = Family.wallet_credit_cents. Issuing applies 3000 wallet
          credit (wallet 3000 -> 0); voiding the ISSUED invoice refunds exactly 3000
          (wallet 0 -> 3000), leaving the family wallet unchanged versus pre-issue.
