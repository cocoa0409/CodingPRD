          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 20.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc1_id: $.data.id } }
          trigger:
            - call: "POST /api/room-cycles"
              payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 10.0, planned_start: "2026-06-16T00:00:00Z", planned_end: "2026-06-30T00:00:00Z", expected_room_version: "${r_v}" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412): expected ${r_v} (1) but room is at version 2 after rc1"
            - "No second cycle persisted (GET /api/room-cycles?room_id=${r_id} returns exactly 1 item)"
            - "SubstrateBatch.${b_id}.remaining_tonnage == 20.0 (stale write reserved nothing)"

      - name: occ_stale_commitment_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commitment-activate-stale-commitment]", "errors[ERR_STALE_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "OCC on BuyerCommitment.version is checked before state preconditions: re-activating with the pre-activation version yields 412 ERR_STALE_VERSION (not ERR_COMMITMENT_NOT_DRAFT)."
        test_recipe:
          setup: ["Buyer b1; commitment c1 DRAFT with one line (version 1); activated with expected_commitment_version 1 (now ACTIVE, version 2)"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/buyers", payload: { name: "Acme Grocery" }, as: SalesManager, captures: { buyer_id: $.data.id } }
            - { call: "POST /api/buyer-commitments", payload: { buyer_id: "${buyer_id}", reference: "PO-100" }, as: SalesManager, captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /api/buyer-commitments/${c_id}/lines", payload: { variety_id: "${v_id}", committed_kg: 500.0, week_start: "2026-05-04T00:00:00Z", week_end: "2026-05-10T00:00:00Z", min_grade: "B" }, as: SalesManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/buyer-commitments/${c_id}/activate", payload: { expected_commitment_version: "${c_v}" }, as: SalesManager }
          trigger:
            - call: "POST /api/buyer-commitments/${c_id}/activate"
              payload: { expected_commitment_version: "${c_v}" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412): the replayed activation carries the pre-activation version ${c_v} (1) while the commitment is at version 2"
            - "BuyerCommitment.${c_id}.status == ACTIVE (unchanged by the rejected write)"

      - name: contamination_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.ContaminationEvent.REPORTED_to_CONFIRMED]
        excluded_because:
          difficulty_instance: contamination_confirm_deep_cascade
          rationale: "The depth-4 confirm -> quarantine -> abort -> spent-lot/risk cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: auto_turnover_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.FlushHarvest.RECORDED_to_GRADED]
        excluded_because:
          difficulty_instance: final_flush_grade_auto_turnover_cascade
          rationale: "The grading -> auto end-cropping -> spent-lot creation cascade is asserted in the named §1.8 instance."

      - name: dual_variant_piece_pay_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.piece_pay]
        excluded_because:
          difficulty_instance: piece_pay_provisional_vs_final_divergence
          rationale: "Both variants and their 2000 vs 2040 divergence are asserted in the named §1.8 instance."

      - name: sweep_checkpoint_covered_by_difficulty
        claim_type: ops_run_checkpoint
        grounds: [calculations.shelf_life_expiry, "endpoints.POST /api/operations/run-daily-sweep"]
        excluded_because:
          difficulty_instance: sweep_expires_lot_at_exact_expiry
          rationale: "Sweep-driven expiry at the exact boundary instant is asserted in the named §1.8 instance; settlement behavior is asserted in commitment_shortfall_tiered_penalty and settlement_fulfilled_at_tolerance_boundary."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.GET /api/substrate-batches/{batchId}"]
        distinguishing_aspect: "Immediate consistency: a batch created and then read in the next request already shows status MIXED, remaining_tonnage == tonnage, and version 1 — no asynchronous lag."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any }
          assert:
            - "GET immediately after POST returns status == MIXED, remaining_tonnage == 40.0, spent_revenue_cents == 0, disposal_cost_cents == 0, version == 1"
            - "updated_at == created_at for a freshly created entity"
