      - name: duplicate_registration_year_rejected_but_other_year_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_38_ERR_DUPLICATE_REGISTRATION_YEAR
        distinguishing_aspect: |
          The uniqueness key of the registration docket, shown to be the pair
          (reporting entity, determination_year) and not the entity alone: a
          second 2026 registration for the same firm is refused while a 2027
          registration for that same firm is accepted in the very next call, and a
          2026 registration for a different firm is likewise accepted.
        test_recipe:
          setup:
            - "Alpha Packing already holds a 2026 registration; Bravo Beef holds none."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a26: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "PRIOR_YEAR_ACTUAL" }
              as: ProgramAdmin
              captures: { e_dup: $.data.error_id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2027, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a27: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_b}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_b26: $.data.id }
          assert:
            - "${e_dup} == ERR_DUPLICATE_REGISTRATION_YEAR with HTTP 409, and the basis_variant of Registration.${reg_a26} is still FIVE_YEAR_AVERAGE"
            - "Registration.${reg_a27} is created with status DRAFT and determination_year 2027"
            - "Registration.${reg_b26} is created with status DRAFT and determination_year 2026"
            - "GET /registrations-equivalent listing via GET /reporting-entities/${ent_a} shows the firm unaffected by the rejected call (version unchanged)"

      - name: class_and_wholesale_authorization_mismatches_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_33_ERR_SPECIES_CLASS_MISMATCH
          - validations.priority_34_ERR_LINE_ITEM_CLASS_MISMATCH
          - validations.priority_23_ERR_WHOLESALE_NOT_AUTHORIZED
        distinguishing_aspect: |
          The three referential guards that keep live-animal reporting and
          wholesale/boxed-beef reporting from bleeding into each other, at all
          four of their declared sites: species mismatch when filing (a SWINE
          plant into a CATTLE window), category mismatch when opening a report
          (BOXED_BEEF_CUTOUT against a LIVE_ANIMAL window), line-item class
          mismatch in both directions (a wholesale lot on a live-animal filing and
          a transaction on a boxed-beef filing), and the volume-gated wholesale
          authorization (a CATTLE plant with boxed_beef_volume_lbs_prior_year 0
          cannot file into a BOXED_BEEF window at all).
        test_recipe:
          setup:
            - "Alpha Packing has plant EST-101 (CATTLE, boxed 2500000 so wholesale-authorized) and plant EST-102 (CATTLE, boxed 0). Swine Co has plant EST-501 (SWINE). Two windows exist: win_lv (CATTLE / LIVE_ANIMAL) and win_bb (CATTLE / BOXED_BEEF) on non-overlapping periods."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-102", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
