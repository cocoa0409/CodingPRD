            - "booking 4 at 13:31 returns 409 ERR_RING_SLOT_OVERLAP: its window is 13:31-13:51 and the existing 14:00 start satisfies 14:00 < 13:51 + 10, proving the buffer is applied symmetrically on the earlier side too"
            - "booking 5 at 13:20 returns 201: its window ends 13:40 and 14:00 < 13:40 + 10 is false"
            - "Ring.${ring_a_id}.slot_count == 3 and Ring.${ring_a_id}.scheduled_minutes_total == 60 — the two rejected bookings contribute nothing"
            - "order_index is recomputed across the whole ring by start_utc: RingSlot.${slot5_id}.order_index == 1 (13:20), RingSlot.${slot1_id}.order_index == 2 (14:00), RingSlot.${slot3_id}.order_index == 3 (14:30)"
            - "ShowClass.${class2_id}.status and ShowClass.${class4_id}.status are still OPEN — a rejected booking leaves the class unscheduled"
            - "GET /ring-slots?ring_id=${ring_a_id}&status=SCHEDULED returns exactly 3 rows"

