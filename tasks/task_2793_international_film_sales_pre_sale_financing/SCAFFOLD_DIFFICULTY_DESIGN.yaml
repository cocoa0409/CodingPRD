            - "probe 6 cancels ${m1_id} → BuyerMeeting.${m1_id}.status == CANCELLED and Rhein's booked minutes fall to 150"
            - "probe 7 (Rhein 16:00-17:00, touching ${m5_id} on the same table 5) → 201 with BuyerMeeting.${m8_id}.duration_minutes == 60; booked minutes are 210"
            - "probe 8 marks ${m4_id} NO_SHOW → BuyerMeeting.${m4_id}.status == NO_SHOW and its 90 minutes stay counted, so booked minutes are still 210"
            - "probe 9 (Rhein 18:00-18:40, 40 minutes, which would make 250) → 422 with error_id ERR_MEETING_MINUTES_CAP_EXCEEDED — NO_SHOW releases neither the interval nor the minutes"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reverse_receipt_restores_cash_and_tiered_commission_with_zero_drift
        grounds:
          - state_machines.PaymentMilestone.RECEIVED_to_INVOICED
          - state_machines.PreSaleContract.PARTIALLY_PAID_to_UNPAID
          - calculations.sales_commission_accrual
          - entities.PaymentMilestone.fields.accrued_commission_usd
          - entities.CollectionAccount.fields.balance_usd
          - entities.CollectionAccount.fields.total_receipts_usd
          - entities.CollectionAccount.fields.total_distributed_usd
          - validations[priority=105]
        distinguishing_aspect: |
          The invariant is MONEY CONSERVATION — total_receipts_usd - total_distributed_usd -
          balance_usd == 0.00 must hold at all four observation points, including after a
          distribution has already moved 136250.00 out of the account. The compensating edge is
          reverse-receipt, which must subtract the stored accrued_commission_usd of 40000.00 rather
          than recompute a rate from the post-reversal total: recomputing would remove 32500.00 and
          leave commission_earned_usd at 97500.00 instead of 90000.00. Re-posting the identical
          receipt then restores commission_earned_usd to exactly 130000.00, so the round trip is
          drift-free at cent resolution.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; agreement EXECUTED with commission_pct 0.10; contract MG 2000000.00 EXECUTED with the four-line milestone schedule."
            - "OPEN collection account with tiers 1 COLLECTION_FEE 0.0125 cap 25000.00 and 2 SALES_COMMISSION 1.00 cap 0.01, created before any cash arrives so the receipts resync the commission cap."
            - "Two receipts booked: 900000.00 (accrues 90000.00) then 400000.00 (accrues 40000.00 at the tier-1 rate because the pre-receipt total is 900000.00)."
            - "One distribution of 500000.00 already executed, leaving total_distributed_usd 136250.00."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 3000000.00, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
