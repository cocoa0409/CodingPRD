          trigger:
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "GATE_CONTROLLED", reason: "Gate crew only." }
              as: RailroadAgent
              captures: { fac_v2: $.data.version }
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "EMBARGOED", reason: "Track washout." }
              as: RailroadAgent
              captures: { fac_v3: $.data.version }
            - call: "POST /demurrage/customers/${cust_id}/credit-hold"
              payload: { on_hold: true, reason: "Past due." }
              as: BillingAdmin
              captures: { cust_v2: $.data.version }
            - call: "GET /demurrage/rail-cars/${car_id}"
              payload: {}
              as: RailroadAgent
              captures: { car_v_after: $.data.version }
          assert:
            - "all three creates returned version 1"
            - "the two access-mode writes returned version 2 then 3: one increment each, no skips"
            - "the credit-hold write moved the CUSTOMER to version 2 and left the facility at 3"
            - "the rail car is still at version 1: no unrelated write touched its counter"

      - name: tier_ladder_crosses_at_the_third_day_and_resets_on_the_next_cycle
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.C4_charge_gross
          - entities.TariffRuleSet.tier1_day_count
        distinguishing_aspect: |
          The cumulative threshold is per PLACEMENT CYCLE, not per customer or
          per month: two billable days stay entirely on the tier-1 rate, the
          third day is the first to price at tier 2, and the very next cycle for
          the same customer starts back at tier 1 rather than continuing up the
          ladder.
        test_recipe:
          setup:
            - "two cars for one customer under the same published tariff (tier1_day_count 2 at 12550, tier2 at 22450)"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
