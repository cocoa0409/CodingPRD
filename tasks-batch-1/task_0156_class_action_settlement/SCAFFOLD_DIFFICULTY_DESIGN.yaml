  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_invalid_beats_claim_window_closed
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SETTLEMENT_POSTURE_INVALID]
          - errors[ERR_CLAIM_WINDOW_CLOSED]
        distinguishing_aspect: |
          Pair: state (priority 7, ERR_SETTLEMENT_POSTURE_INVALID) vs
          business_temporal (priority 8, ERR_CLAIM_WINDOW_CLOSED). A claim filed
          into a DRAFT settlement (posture invalid) AND after claim_filing_deadline
          (window closed) returns the posture error, because priority 7 < 8.
        test_recipe:
          setup:
            - "A DRAFT settlement (never opened) with claim_filing_deadline already in the past, one registered member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Conflict1", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_SETTLEMENT_POSTURE_INVALID (priority 7 wins over the temporal window error)"

      - name: segregation_beats_fund_exceeded_on_post
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_FUND_EXCEEDED]
        distinguishing_aspect: |
          Pair: business_safety (priority 15, ERR_SEGREGATION_OF_DUTIES) vs
          business_fiscal (priority 17, ERR_FUND_EXCEEDED). A post where the
          FundController is the same X-User-ID who validated the claim AND the
          batch over-allocates the fund returns the segregation error (15 < 17).
        test_recipe:
          setup:
            - "DISTRIBUTING settlement net=100. Single claim recognized so that planned_total=200 > net (fund would be exceeded). The same user id validated the claim and attempts the post."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Conflict2", gross_fund_cents: 100, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "TIERED", tier_a_amount_cents: 200, tier_b_amount_cents: 200, claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", claimant_tier: "TIER_A", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 999999 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 999999 }
              as: ClaimsReviewer
              as_user_id: "dual-hat-user"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver: $.data.version }
          trigger:
            - call: "POST /distribution-batches/${batch_id}/post"
              payload: { expected_settlement_version: "${s_ver}" }
