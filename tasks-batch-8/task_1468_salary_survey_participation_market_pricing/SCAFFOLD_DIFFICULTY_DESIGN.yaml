  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: strategy_window_overlap_interval_vs_interval
        grounds:
          - validations[priority=10]
          - errors[ERR_STRATEGY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: org's strategy timeline. Interval semantics: half-open
          [effective_from, effective_to) — two strategies whose windows share
          any calendar day are rejected. Adjacent windows (to1 == from2) do NOT
          overlap under half-open semantics and must be accepted.
        test_recipe:
          setup:
            - "Org with one ACTIVE strategy covering [2026-01-01, 2027-01-01)"
            - "Second DRAFT strategy covering [2026-06-01, 2027-06-01) (overlaps)"
            - "Third DRAFT strategy covering [2027-01-01, 2028-01-01) (adjacent, no overlap)"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "S1", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { s1: $.data.id } }
            - { call: "POST /strategies/${s1}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "S2", target_percentile: 65, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-06-01", effective_to: "2027-06-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { s2: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "S3", target_percentile: 75, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2027-01-01", effective_to: "2028-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { s3: $.data.id } }
          trigger:
            - { call: "POST /strategies/${s2}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { err_overlap: $.data.error_id } }
            - { call: "POST /strategies/${s3}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { status_s3: $.data.status } }
          assert:
            - "S2 activate returns error_id == ERR_STRATEGY_WINDOW_OVERLAP (windows overlap)"
            - "S3 activate succeeds — adjacent half-open windows [2026-01-01,2027-01-01) and [2027-01-01,2028-01-01) do NOT overlap"

      - name: cycle_effective_date_point_in_window
        grounds:
          - validations[priority=11]
          - errors[ERR_CYCLE_EFFECTIVE_OVERLAP]
        distinguishing_aspect: |
          Resource: org's adjustment-cycle calendar. Interval semantics:
          point-in-window — a new cycle's effective_date (a single point) must
          NOT fall inside [created_date, effective_date] (closed interval) of
          any existing OPEN or LOCKED cycle. This differs from strategy's
          interval-vs-interval half-open overlap.
        test_recipe:
          setup:
            - "Existing cycle C1 created on 2026-08-01 with effective_date=2026-12-31 (covers window [2026-08-01, 2026-12-31])"
            - "Attempt to create cycle C2 with effective_date=2026-10-15 (inside C1's window)"
            - "Attempt to create cycle C3 with effective_date=2027-03-01 (outside C1's window)"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "C1", effective_date: "2026-12-31", budget_cents: 1000000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "C2", effective_date: "2026-10-15", budget_cents: 500000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { err_overlap: $.data.error_id } }
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "C3", effective_date: "2027-03-01", budget_cents: 500000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { c3: $.data.id } }
          assert:
            - "C2 creation returns error_id == ERR_CYCLE_EFFECTIVE_OVERLAP"
            - "C3 creation succeeds (effective_date outside C1's window)"

  # ===========================================================================
