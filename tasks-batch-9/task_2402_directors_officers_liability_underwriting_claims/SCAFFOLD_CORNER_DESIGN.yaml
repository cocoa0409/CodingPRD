        excluded_because:
          difficulty_instance: compensating_invariant / denial_clawback_restores_limit_conservation
          rationale: "The reversal of every advancement side effect with no drift is the subject of the named §1.8 instance."
      - name: bind_guarded_by_insured_control_status
        claim_type: cross_entity
