            - "after trigger call 3: MoveRecord.${mv_id}.readiness_score == 62 (identity 100, utility 0, filing 60, consent 100)"

      - name: order_activation_blocked_by_deposit_due_handoff
        grounds:
          - state_machines.UtilityOrder.SCHEDULED_to_ACTIVE_SERVICE
          - state_machines.CreditCheckHandoff.SUBMITTED_to_RESPONDED
          - state_machines.UtilityOrder.DEPOSIT_DUE_to_DEPOSIT_PAID
          - "errors[ERR_CREDIT_NOT_CLEARED]"
        distinguishing_aspect: |
          A DIFFERENT entity pair, CreditCheckHandoff -> UtilityOrder, on the other of the order's two
          state dimensions: the order is legally SCHEDULED and the clock has reached its window, but
          activation is refused with ERR_CREDIT_NOT_CLEARED purely because the sibling handoff answered
          DEPOSIT_REQUIRED and left credit_status DEPOSIT_DUE. Paying the exact deposit moves the credit
          dimension to DEPOSIT_PAID and the identical activation call then succeeds, proving activation
          reads the credit dimension rather than the provision dimension.
