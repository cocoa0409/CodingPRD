  - rule_id: compensating_invariant
    instances:

      - name: budget_commitment_restored_after_cancel_and_replace
        grounds:
          - calculations.budget_commitment_conservation
          - state_machines.Booking.COUNTERSIGNED_or_earlier_to_CANCELLED
          - entities.BudgetTier.fields.committed_cents
          - endpoints["POST /festival-ops/bookings/{id}/cancel"]
        distinguishing_aspect: |
          Conserved quantity 1: currency. Three independent expressions — Festival.committed_budget_cents,
          the sum of BudgetTier.committed_cents, and the sum of (guarantee + production_fee) over
          non-CANCELLED bookings — must agree after every accept and every cancel. The commitment
          includes production_fee_cents, and the tier flips CLOSED -> OPEN -> CLOSED across the
          round trip, so an implementation that credits only the guarantee, or that forgets to
          reopen the tier, drifts visibly.
        test_recipe:
          setup:
            - "Harbor Lights fixture (allocatable 9500000) with a single HEADLINER tier at max_slots 1 and one flagship stage."
            - "One draw-72 ELECTRONIC act offered guarantee 1600000 plus production_fee 200000, which sums to exactly its ceiling of 1800000."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 1, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a1: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1600000, production_fee_cents: 200000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_o1: $.data.id }
            - call: "POST /festival-ops/offers/${offer_o1}/issue"
              payload: {}
              as: TalentBuyer
          trigger:
            - call: "POST /festival-ops/offers/${offer_o1}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a1}"
              captures: { booking_b1: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_b1}/cancel"
              payload: { cancelling_party: "PROMOTER", cancellation_reason: "Stage redesign dropped the slot" }
              as: TalentBuyer
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", replaces_booking_id: "${booking_b1}", guarantee_cents: 1600000, production_fee_cents: 200000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_replacement: $.data.id }
            - call: "POST /festival-ops/offers/${offer_replacement}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_replacement}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a1}"
              captures: { booking_replacement: $.data.id }
          assert:
            - "after the accept all three expressions read 1800000: Festival.${fest_id}.committed_budget_cents, BudgetTier.${tier_head_id}.committed_cents, and guarantee 1600000 + production_fee 200000 over non-CANCELLED bookings"
            - "the accept also sets slots_committed 1 == max_slots, so BudgetTier.${tier_head_id}.status == CLOSED and Festival.${fest_id}.headliner_anchor_count == 1"
            - "after the cancel all three expressions read 0 — the credit is the full 1800000 including production_fee_cents, not just the 1600000 guarantee"
            - "the cancel reopens the tier (status OPEN, slots_committed 0), drops headliner_anchor_count to 0, releases the clause and stamps contractual_recovery_cents 0, because a PROMOTER cancellation has party_pct 0.00 and liq_pct 0.00"
            - "after the replacement accept all three expressions read 1800000 again — exactly the pre-cancel figure with zero cents of drift, despite the tier having flipped CLOSED -> OPEN -> CLOSED"
            - "the replacement offer was only creatable because ${booking_b1} is CANCELLED: pointing replaces_booking_id at ${booking_replacement} instead would return ERR_REPLACEMENT_TARGET_NOT_CANCELLED (409)"

      - name: stage_minutes_restored_after_cancel_and_replace
        grounds:
          - calculations.stage_minutes_conservation
          - entities.Stage.fields.booked_minutes
          - state_machines.Booking.COUNTERSIGNED_or_earlier_to_CANCELLED
          - endpoints["POST /festival-ops/offers/{id}/accept"]
        distinguishing_aspect: |
          Conserved quantity 2: stage time in minutes, on a different entity and with a different
          ledger. The cancel-and-replace round trip returns Stage.booked_minutes to its original
          value while Stage.version has advanced three times, so a test that only compares the
          final number cannot tell a real compensation from a no-op. A sibling stage carrying its
          own booking proves the debit is per-stage rather than festival-wide.
        test_recipe:
          setup:
            - "Harbor Lights fixture with a HEADLINER tier at max_slots 2, the flagship stage Aurora Main and a second non-flagship stage Grove."
            - "Grove already carries an accepted 45-minute booking for a draw-20 COUNTRY act at billing_position 2 on 2026-12-05 14:00, which must never move."
            - "Aurora Main carries an accepted 90-minute booking for a draw-72 ELECTRONIC act at billing_position 1 on 2026-12-05 21:00."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 2, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Grove", capacity: 6000, daily_curfew_minute: 1200, daily_program_minutes_cap: 360, changeover_buffer_minutes: 30, is_flagship: false }
              as: ProductionManager
              captures: { stage_grove_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a1: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Hollow Pines LLC", performing_name: "Hollow Pines", primary_genre: "COUNTRY", agency: "Foghorn Agency", draw_score: 20, default_radius_miles: 75 }
              as: TalentBuyer
              captures: { artist_g1: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_g1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_grove_id}", guarantee_cents: 500000, production_fee_cents: 0, billing_position: 2, set_length_minutes: 45, slot_start_utc: "2026-12-05T14:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 75, window_start_date: "2026-11-04", window_end_date: "2026-12-14", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_grove: $.data.id }
            - call: "POST /festival-ops/offers/${offer_grove}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_grove}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_g1}"
              captures: { booking_grove: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1800000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_main: $.data.id }
            - call: "POST /festival-ops/offers/${offer_main}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_main}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a1}"
              captures: { booking_main: $.data.id }
            - call: "GET /festival-ops/stages/${stage_main_id}"
              payload: {}
              as: ProductionManager
              captures: { stage_v_after_accept: $.data.version }
          trigger:
            - call: "POST /festival-ops/bookings/${booking_main}/cancel"
              payload: { cancelling_party: "FORCE_MAJEURE", cancellation_reason: "Artist visa withdrawn" }
              as: BusinessAffairs
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", replaces_booking_id: "${booking_main}", guarantee_cents: 1800000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_main_replacement: $.data.id }
            - call: "POST /festival-ops/offers/${offer_main_replacement}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_main_replacement}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a1}"
              captures: { booking_main_replacement: $.data.id }
            - call: "GET /festival-ops/stages/${stage_main_id}"
              payload: {}
              as: ProductionManager
          assert:
            - "before the cancel Stage.${stage_main_id}.booked_minutes == 90 and Stage.${stage_grove_id}.booked_minutes == 45"
            - "the cancel debits exactly 90 minutes: Stage.${stage_main_id}.booked_minutes == 0 while Stage.${stage_grove_id}.booked_minutes is still 45"
            - "the replacement accept re-credits 90 minutes, so Stage.${stage_main_id}.booked_minutes == 90 again and equals sum(set_length_minutes over that stage's non-CANCELLED bookings) with no drift"
            - "the final Stage.${stage_main_id}.version is strictly greater than ${stage_v_after_accept} — the round trip performed two real writes rather than being optimised away"
            - "the replacement reuses the identical stage, slot, billing position and artist, which is only legal because CANCELLED bookings leave the occupant set of stage_interval_conflict and the billing-position and double-booking checks"
            - "the FORCE_MAJEURE cancellation stamps contractual_recovery_cents == round_half_up(0 * 0.50) + 0 == 0, so no clawback is pending and the minutes ledger is the only thing that moved"

      - name: installment_total_conserved_across_guarantee_amendment
        grounds:
          - calculations.payment_schedule_build
          - concurrency_rules[occ_field=expected_booking_version]
          - errors.ERR_STALE_BOOKING_VERSION
          - endpoints["PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
        distinguishing_aspect: |
          A third conserved quantity: the per-booking installment total, which must always equal
          Booking.guarantee_cents across the non-VOIDED rows. Here the compensation is asymmetric —
          the DEPOSIT is already PAID and untouchable, so the whole 200000 increase has to land on
          the rebuilt SCHEDULED row rather than being split by deposit_pct. The amendment is also
          the OCC write, so the stale-version rejection is checked on the same call.
        test_recipe:
          setup:
            - "Harbor Lights fixture with one accepted booking for a draw-95 ELECTRONIC act at guarantee 1800000, whose ceiling is therefore 2375000 and leaves room to amend upward."
            - "Accepted at clock 2026-08-01, so days_until_show is 125 and the pair is DEPOSIT 900000 due 2026-08-31 and BALANCE 900000 due 2026-12-05."
            - "The clock then moves to 2026-08-24 and the deposit is released and marked paid, so deposit_paid_cents is 900000 and the deposit row is PAID."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 1, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 95, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a1: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a1}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1800000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_o1: $.data.id }
            - call: "POST /festival-ops/offers/${offer_o1}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_o1}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a1}"
              captures: { booking_b1: $.data.id, booking_v_at_accept: $.data.version }
            - call: "GET /festival-ops/bookings/${booking_b1}/payment-installments"
              payload: {}
              as: FinanceController
              captures: { deposit_id: "$.data[0].id", balance_id: "$.data[1].id" }
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: FinanceController
            - call: "POST /festival-ops/payment-installments/${deposit_id}/release"
              payload: {}
              as: FinanceController
            - call: "POST /festival-ops/payment-installments/${deposit_id}/mark-paid"
              payload: { paid_amount_cents: 900000 }
              as: FinanceController
          trigger:
            - call: "PATCH /festival-ops/bookings/${booking_b1}/guarantee-amendment"
              payload: { guarantee_cents: 2000000, expected_booking_version: "${booking_v_at_accept}", amendment_reason: "Agency renegotiated after the deposit cleared" }
              as: TalentBuyer
            - call: "GET /festival-ops/bookings/${booking_b1}"
              payload: {}
              as: TalentBuyer
              captures: { booking_v_now: $.data.version }
            - call: "PATCH /festival-ops/bookings/${booking_b1}/guarantee-amendment"
              payload: { guarantee_cents: 2000000, expected_booking_version: "${booking_v_now}", amendment_reason: "Agency renegotiated after the deposit cleared" }
              as: TalentBuyer
            - call: "GET /festival-ops/bookings/${booking_b1}/payment-installments"
              payload: {}
              as: FinanceController
          assert:
            - "the first amendment is rejected with ERR_STALE_BOOKING_VERSION (412): marking the deposit paid already advanced Booking.version past ${booking_v_at_accept}"
            - "the rejected amendment changes nothing — guarantee_cents is still 1800000 and the installment rows are untouched"
            - "the second amendment succeeds and voids ${balance_id}, replacing it with a SCHEDULED row of 1100000 due 2026-12-05"
            - "PaymentInstallment.${deposit_id} is still PAID at 900000 — a PAID row is never rewritten, so the entire 200000 increase lands on the rebuilt row instead of being re-split at deposit_pct"
            - "sum(amount_cents over the booking's installments with status NOT IN {VOIDED}) == 900000 + 1100000 == 2000000 == Booking.guarantee_cents, so installment_total_conservation still holds"
            - "BudgetTier.${tier_head_id}.committed_cents and Festival.${fest_id}.committed_budget_cents both moved by the delta 200000 to 2000000, and settlement_total_cents is re-derived to 1100000 == 2000000 + round_half_up(0 * 0.75) + 0 - 900000"
