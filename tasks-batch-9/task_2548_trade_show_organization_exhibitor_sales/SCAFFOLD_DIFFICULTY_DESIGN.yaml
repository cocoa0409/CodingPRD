  # =========================================================================
  # RULE 7 — cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: show_creation_depends_on_the_venue_contract_being_executed
        grounds:
          - validations[priority=20]
          - errors[ERR_VENUE_CONTRACT_NOT_EXECUTED]
          - state_machines.VenueContract.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          Entity pair (Show, VenueContract): the child's creation is gated on the PARENT's status, and
          nothing about the child's own payload changes between the rejected and the accepted attempt —
          only VenueContract.status moves DRAFT -> EXECUTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "Exactly one VenueContract exists, MCC / HALL_A, still in status DRAFT (never executed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { err_parent_state: $.data.error_id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
          assert:
            - "The first attempt returns HTTP 409 with ${err_parent_state} == ERR_VENUE_CONTRACT_NOT_EXECUTED"
            - "The identical second attempt returns HTTP 201: Show.${show_id}.status == PLANNING"
            - "VenueContract.${vc_id}.status == EXECUTED and executed_at == 2026-08-15T00:00:00Z"
            - "VenueContract.${vc_id}.show_count == 1 (the rejected attempt created nothing)"
            - "GET /venue-contracts/${vc_id}/shows returns exactly 1 row"

      - name: service_order_depends_on_its_space_contract_being_signed
        grounds:
          - validations[priority=24]
          - errors[ERR_INVALID_CONTRACT_STATUS]
          - calculations.service_order_line_total
        distinguishing_aspect: |
          Entity pair (ServiceOrder, SpaceContract) — a different pair from (Show, VenueContract): the
          exhibitor may not order labor against an unsigned hold, and the SAME order body succeeds the
          moment the contract reaches SIGNED. The gate is the parent's status, not the show's and not the
          order's own window (validation 57 is satisfied throughout).
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED with labor_rate_cents_per_hour 9500 and advance_order_discount_pct 20."
            - "Show published (SPACE_SELECTION) with booths A100 (400 sqft) and C050 (200 sqft); advance_order_deadline == 2027-02-08."
            - "Exhibitor 'Nordic Furnishings' holds A100 through an OFFERED contract with min_deposit_cents 389070."
            - "Clock stays at 2026-08-15, comfortably inside both the advance-order window and the service-order window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { sv1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${sv1}", requested_sqft: 400, premium_placement_requested: true, booth_ids: ["${b_a}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
          trigger:
            - call: "POST /space-contracts/${sc1}/service-orders"
              payload: { service_type: "LABOR", quantity: 8, ordered_at: "2026-08-15T00:00:00Z" }
              as: Exhibitor
              as_user_id: "${ex1}"
              captures: { err_contract_state: $.data.error_id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { sv2: $.data.version }
            - call: "POST /space-contracts/${sc1}/sign"
              payload: { expected_show_version: "${sv2}", deposit_paid_cents: 389070 }
              as: Exhibitor
              as_user_id: "${ex1}"
            - call: "POST /space-contracts/${sc1}/service-orders"
              payload: { service_type: "LABOR", quantity: 8, ordered_at: "2026-08-15T00:00:00Z" }
              as: Exhibitor
              as_user_id: "${ex1}"
              captures: { so_id: $.data.id }
          assert:
            - "The first attempt returns HTTP 409 with ${err_contract_state} == ERR_INVALID_CONTRACT_STATUS while SpaceContract.${sc1}.status == OFFERED"
            - "GET /space-contracts/${sc1}/service-orders returns 0 rows immediately after the rejection"
            - "After the sign the identical body returns HTTP 201: ServiceOrder.${so_id}.status == SUBMITTED"
            - "ServiceOrder.${so_id}.rate_variant == ADVANCE, unit_rate_cents == 9500, billable_quantity == 8"
            - "ServiceOrder.${so_id}.line_total_cents == 60800"
            - "SpaceContract.${sc1}.status == SIGNED and Booth.${b_a}.status == ASSIGNED"

      - name: obligation_resolution_depends_on_its_deal_still_being_signed
        grounds:
          - validations[priority=26]
          - errors[ERR_INVALID_DEAL_STATUS]
          - state_machines.SponsorshipDeal.SIGNED_to_CANCELLED
          - state_machines.FulfillmentObligation.PENDING_to_DELIVERED
        distinguishing_aspect: |
          Entity pair (FulfillmentObligation, SponsorshipDeal) — a third distinct pair: the very same
          resolve endpoint on the very same deal accepts obligation 1 while the deal is SIGNED and
          rejects obligation 2 after the deal is CANCELLED, and the already-earned PARTIAL fulfillment
          value is NOT rewound by the commercial cancellation.
        test_recipe:
          setup:
            - "Show published (SPACE_SELECTION) with booths A100 and C050 so publish-floor-plan is legal."
            - "SponsorshipPackage 'GOLD_KEYNOTE' with list_price_cents 1000000, price_floor_cents 700000, inventory_total 2, obligation_codes [SOCIAL_MEDIA_POST, ONSITE_BANNER], priority_point_value 40."
            - "Exhibitor 'Nordic Furnishings' has a deal proposed by u_rep_1 at 850000 cents and signed by u_dir_1 (segregation of duties satisfied), so two PENDING obligations exist with due_date 2027-02-19."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "POST /shows/${show_id}/sponsorship-packages"
              payload: { package_code: "GOLD_KEYNOTE", list_price_cents: 1000000, price_floor_cents: 700000, inventory_total: 2, exclusivity_category: "NONE", obligation_codes: ["SOCIAL_MEDIA_POST", "ONSITE_BANNER"], priority_point_value: 40 }
              as: ShowDirector
              captures: { pkg_id: $.data.id }
            - call: "POST /sponsorship-packages/${pkg_id}/deals"
              payload: { exhibitor_id: "${ex1}", negotiated_price_cents: 850000 }
              as: SalesRep
              as_user_id: "u_rep_1"
              captures: { deal_id: $.data.id }
            - call: "POST /sponsorship-deals/${deal_id}/sign"
              payload: {}
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "GET /sponsorship-deals/${deal_id}/obligations"
              payload: {}
              as: ShowDirector
              captures: { ob1: "$.data[0].id", ob2: "$.data[1].id" }
          trigger:
            - call: "POST /sponsorship-deals/${deal_id}/obligations/${ob1}/resolve"
              payload: { disposition: "DELIVERED" }
              as: FloorManager
              as_user_id: "u_floor_1"
            - call: "POST /sponsorship-deals/${deal_id}/cancel"
              payload: { cancellation_reason: "Sponsor withdrew after the keynote slot was rescheduled" }
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "POST /sponsorship-deals/${deal_id}/obligations/${ob2}/resolve"
              payload: { disposition: "DELIVERED" }
              as: FloorManager
              as_user_id: "u_floor_1"
              captures: { err_deal_state: $.data.error_id }
          assert:
            - "The first resolve returns HTTP 200: FulfillmentObligation.${ob1}.status == DELIVERED with resolved_by_user_id u_floor_1"
            - "After the first resolve: SponsorshipDeal.${deal_id}.resolved_obligation_count == 1 and fulfillment_status == PARTIAL"
            - "After the cancel: SponsorshipDeal.${deal_id}.deal_status == CANCELLED and fulfillment_status is still PARTIAL"
            - "The second resolve returns HTTP 409 with ${err_deal_state} == ERR_INVALID_DEAL_STATUS"
            - "FulfillmentObligation.${ob2}.status == PENDING with resolved_by_user_id null"
            - "SponsorshipDeal.${deal_id}.resolved_obligation_count == 1 and fulfillment_credited == false"
            - "SponsorshipPackage.${pkg_id}.inventory_committed == 0 and inventory_available == 2"

  # =========================================================================
  # RULE 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: hall_occupancy_is_a_closed_date_interval_padded_by_dark_days
        grounds:
          - validations[priority=53]
          - errors[ERR_HALL_OCCUPANCY_CONFLICT]
          - constants.DARK_DAY_BUFFER_DAYS
        distinguishing_aspect: |
          Interval semantics: CLOSED date intervals, each padded by DARK_DAY_BUFFER_DAYS == 2 on BOTH
          ends, keyed on the physical resource (venue_code, hall_code). Two shows must therefore be more
          than four days apart: a move-in four days after the previous move-out conflicts (the padded
          intervals share the single date 2027-03-11), five days is accepted, and an exactly coincident
          window in a different hall is accepted because the resource key differs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "Two EXECUTED venue contracts at the same venue MCC: HALL_A and HALL_B."
            - "Show 'Spring Buyers Expo' occupies HALL_A from move_in_start 2027-03-01 to move_out_end 2027-03-09, so its padded window is the closed interval [2027-02-27, 2027-03-11]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_a: $.data.id }
            - call: "POST /venue-contracts/${vc_a}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /venue-contracts"
