scenario: |
  2994. VoIP Number Porting & E911 Address Registration (Ooma): port-out request validation against
  losing-carrier account data, port rejection reason codes and resubmission workflow, port scheduling
  with cutover window and temporary number bridging, registered E911 dispatchable location capture and
  update prompting, nomadic device relocation detection and address re-verification, 911 fee remittance
  by jurisdiction, number reservation, parking and reclamation after cancellation, toll-fraud detection
  and international calling controls

domain_name: voip-porting-e911
api_prefix: "/voip"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # PortRequest, CutoverSlot, TemporaryBridge, NumberReservation, PhoneNumber, Device and
  # E911Registration form a cyclic reference web (CutoverSlot.booked_port_request_id points back at
  # PortRequest while TemporaryBridge points at both PortRequest and NumberReservation); only
  # PhoneNumber-under-NumberBlock and CallAttempt-under-Device are expressed as nested URL paths.

  state_machine_shape: cyclic
  # PortRequest loops CSR_MISMATCH/REJECTED -> SUBMITTED via resubmission; PhoneNumber loops
  # AVAILABLE -> RESERVED -> ASSIGNED -> PARKED -> AVAILABLE via release + reclamation runs;
  # Device carries two independent state dimensions (registration_status x calling_status) and the
  # registration dimension itself cycles REGISTERED -> RELOCATION_DETECTED -> ADDRESS_UNVERIFIED ->
  # REGISTERED; Account.e911_compliance_posture is a compound state derived from its Devices.

  relationship_patterns:
    - one_to_many          # NumberBlock -> PhoneNumber, Device -> CallAttempt, PortRequest -> CarrierAccountSnapshot
    - cross_aggregate      # E911Registration links Device (customer aggregate) to Jurisdiction (regulatory aggregate)
    - polymorphic          # NumberReservation.purpose selects which consumer (Device or TemporaryBridge) may consume it
    # PortRequest <-> CutoverSlot is a mutual reference pair: PortRequest is discovered from
    # CutoverSlot.booked_port_request_id and the slot is discovered from the port request by the
    # same field, so neither side owns the other.

  role_model: segregation_of_duties
  # The specialist who files a PortRequest may not post the losing carrier's CSR snapshot or reject
  # it (CarrierLiaison), the BillingAdmin who assessed a fee may not void it (X-User-ID compared),
  # and only E911Validator may verify a dispatchable location captured by an AccountAdmin.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: "Ooma-side billing account number"
        constraints: "8-12 chars, [A-Z0-9] only, unique across Account"
      - name: billing_name
        type: string
        source: input
        description: "legal billing name used as one CSR comparison field"
        constraints: "1-80 chars"
      - name: service_state_code
        type: string
        source: input
        description: "two-letter USPS state code of the primary service address"
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: input
        description: "account lifecycle status; set at creation and never mutated afterwards"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: intl_calling_enabled
        type: boolean
        source: input
        description: "when false every non-US call attempt is refused"
        default: false
      - name: intl_daily_cap_cents
        type: integer
        source: input
        description: "per-UTC-day projected international spend ceiling in cents"
        default: 2000
        constraints: ">= 0"
      - name: e911_compliance_posture
        type: enum
        source: computed
        description: "compound posture derived from this account's Devices by calculations.account_e911_posture"
        default: COMPLIANT
        constraints: "one of {COMPLIANT, AT_RISK, BLOCKED}"
      - name: fee_liability_cents
        type: integer
        source: computed
        description: "sum of FeeAssessment.amount_cents for this account whose status IN {ASSESSED, REMITTED}"
        default: 0
      - name: ported_number_count
        type: integer
        source: computed
        description: "count of E.164 strings across all COMPLETED PortRequest.requested_numbers of this account"
        default: 0

  - name: Carrier
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "losing carrier display name"
        constraints: "1-80 chars"
      - name: ocn
        type: string
        source: input
        description: "operating company number identifying the losing carrier"
        constraints: "exactly 4 chars [A-Z0-9], unique across Carrier"
      - name: csr_match_policy
        type: enum
        source: input
        description: "which CSR match-point threshold this carrier applies"
        constraints: "one of {STRICT, RELAXED}"
      - name: porting_buffer_minutes
        type: integer
        source: input
        description: "minutes of quiet time this carrier requires on both sides of every cutover window"
        constraints: "0-240"
      - name: foc_business_days
        type: integer
        source: input
        description: "business days between CSR validation and the earliest firm-order-commitment cutover"
        constraints: "1-10"

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "two-letter USPS state code this 911 jurisdiction taxes"
        constraints: "exactly 2 uppercase letters"
      - name: county_fips
        type: string
        source: input
        description: "5-digit county FIPS code; (state_code, county_fips) is unique across Jurisdiction"
        constraints: "exactly 5 digits"
      - name: fee_type
        type: enum
        source: input
        description: "whether the monthly 911 fee is charged per billable line or per dispatchable location"
        constraints: "one of {PER_LINE, PER_LOCATION}"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "full-month 911 fee in cents per billable unit"
        constraints: "1-10000"
      - name: remit_day_of_month
        type: integer
        source: input
        description: "day of the month following a period on which that period's remittance may be filed"
        constraints: "1-28"
      - name: pending_fee_cents
        type: integer
        source: computed
        description: "sum of FeeAssessment.amount_cents for this jurisdiction whose status == ASSESSED"
        default: 0
      - name: remitted_fee_cents
        type: integer
        source: computed
        description: "sum of FeeAssessment.amount_cents for this jurisdiction whose status == REMITTED"
        default: 0
      - name: last_remitted_period
        type: string
        source: computed
        description: "period_month (YYYY-MM) of the most recent remittance run, null before the first run"
        default: null

  - name: NumberBlock
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the 911 jurisdiction every number in this block bills into"
      - name: npa_nxx
        type: string
        source: input
        description: "6-digit NPA-NXX prefix of the block"
        constraints: "exactly 6 digits, unique across NumberBlock"
      - name: total_capacity
        type: integer
        source: input
        description: "maximum number of PhoneNumber rows that may ever be minted into this block"
        constraints: "1-10000"
      - name: max_concurrent_reservations
        type: integer
        source: input
        description: "aggregate ceiling on HELD NumberReservation rows whose closed intervals intersect"
        constraints: ">= 1"
      - name: minted_count
        type: integer
        source: computed
        description: "count of PhoneNumber rows whose block_id is this block"
        default: 0
      - name: available_count
        type: integer
        source: computed
        description: "count of this block's PhoneNumber rows with status == AVAILABLE"
        default: 0
      - name: reserved_count
        type: integer
        source: computed
        description: "count of this block's PhoneNumber rows with status == RESERVED"
        default: 0
      - name: assigned_count
        type: integer
        source: computed
        description: "count of this block's PhoneNumber rows with status == ASSIGNED"
        default: 0
      - name: parked_count
        type: integer
        source: computed
        description: "count of this block's PhoneNumber rows with status == PARKED"
        default: 0

  - name: PhoneNumber
    parent: NumberBlock
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> NumberBlock.id; taken from the creation path segment"
      - name: line_number
        type: string
        source: input
        description: "4-digit line portion; unique within a block"
        constraints: "exactly 4 digits"
      - name: e164
        type: string
        source: computed
        description: "concatenation '+1' + NumberBlock.npa_nxx + line_number, derived across the block boundary"
      - name: status
        type: enum
        source: computed
        description: "inventory status driven by state_machines.PhoneNumber"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, ASSIGNED, PARKED}"
      - name: assigned_account_id
        type: string
        source: computed
        description: "FK -> Account.id; set when a Device takes this number, cleared when it is released"
        default: null
      - name: parked_until
        type: datetime
        source: computed
        description: "instant from which a PARKED number may be reclaimed; null unless status == PARKED"
        default: null
      - name: park_cycle_count
        type: integer
        source: computed
        description: "number of times this number has entered PARKED"
        default: 0

  - name: NumberReservation
    parent: null
    common_fields: true
    fields:
      - name: number_id
        type: string
        source: input
        description: "FK -> PhoneNumber.id; omitted on request means the server selects it per calculations.reservation_number_selector"
      - name: block_id
        type: string
        source: input
        description: "FK -> NumberBlock.id; the block the reservation draws from"
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account the held number is earmarked for"
      - name: purpose
        type: enum
        source: input
        description: "which consumer may consume this reservation"
        constraints: "one of {PORT_BRIDGE, NEW_LINE}"
      - name: reserved_from
        type: datetime
        source: input
        description: "inclusive start of the closed reservation interval"
      - name: reserved_until
        type: datetime
        source: input
        description: "inclusive end of the closed reservation interval"
      - name: status
        type: enum
        source: computed
        description: "reservation lifecycle per state_machines.NumberReservation"
        default: HELD
        constraints: "one of {HELD, CONSUMED, RELEASED, EXPIRED}"
      - name: released_reason
        type: enum
        source: computed
        description: "why a RELEASED reservation was released; null in every other status"
        default: null
        constraints: "one of {MANUAL, BRIDGE_ORPHANED, CUTOVER_COMPLETED}"

  - name: PortRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the Ooma account the numbers are porting into"
      - name: losing_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier the numbers are porting away from"
      - name: requested_numbers
        type: array
        source: input
        description: "E.164 strings being ported in; recorded as strings, never minted into inventory"
        constraints: "1-5 entries, each matching ^\\+1[0-9]{10}$, no duplicates within the array"
      - name: claimed_account_number
        type: string
        source: input
        description: "losing-carrier account number as claimed by the subscriber"
        constraints: "1-32 chars"
      - name: claimed_pin
        type: string
        source: input
        description: "losing-carrier account PIN as claimed by the subscriber"
        constraints: "1-16 chars"
      - name: claimed_billing_name
        type: string
        source: input
        description: "losing-carrier billing name as claimed by the subscriber"
        constraints: "1-80 chars"
      - name: claimed_address_line1
        type: string
        source: input
        description: "losing-carrier service address line 1 as claimed by the subscriber"
        constraints: "1-80 chars"
      - name: claimed_zip
        type: string
        source: input
        description: "losing-carrier service ZIP as claimed by the subscriber"
        constraints: "exactly 5 digits"
      - name: status
        type: enum
        source: computed
        description: "port lifecycle per state_machines.PortRequest"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, CSR_MISMATCH, VALIDATED, SCHEDULED, BRIDGED, COMPLETED, REJECTED, CANCELLED}"
      - name: resubmission_count
        type: integer
        source: computed
        description: "number of successful resubmit calls on this request"
        default: 0
      - name: last_rejection_code
        type: enum
        source: computed
        description: "reason code of the most recent carrier rejection; null before any rejection"
        default: null
        constraints: "one of {CSR_MISMATCH, PIN_INVALID, ACCOUNT_NOT_FOUND, PENDING_BALANCE, NUMBER_NOT_PORTABLE, DUPLICATE_REQUEST}"
      - name: last_match_points
        type: integer
        source: computed
        description: "match_points of the newest non-superseded CarrierAccountSnapshot; null before the first snapshot"
        default: null
      - name: last_mismatch_fields
        type: array
        source: computed
        description: "mismatch_fields of the newest non-superseded CarrierAccountSnapshot; empty array before the first snapshot"
        default: []
      - name: validated_at
        type: datetime
        source: computed
        description: "logical-clock instant at which the request most recently entered VALIDATED; null otherwise"
        default: null
      - name: earliest_cutover_at
        type: datetime
        source: computed
        description: "firm-order-commitment floor computed by calculations.earliest_cutover_floor; null until validated"
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID that filed the request; the segregation-of-duties comparand of validations priority 29, never overwritten by a resubmission"

  - name: CarrierAccountSnapshot
    parent: PortRequest
    common_fields: true
    fields:
      - name: port_request_id
        type: string
        source: input
        description: "FK -> PortRequest.id; taken from the creation path segment"
      - name: account_number_on_file
        type: string
        source: input
        description: "account number as held on the losing carrier's customer service record"
        constraints: "1-32 chars"
      - name: pin_on_file
        type: string
        source: input
        description: "account PIN as held on the losing carrier's customer service record"
        constraints: "1-16 chars"
      - name: billing_name_on_file
        type: string
        source: input
        description: "billing name as held on the losing carrier's customer service record"
        constraints: "1-80 chars"
      - name: address_line1_on_file
        type: string
        source: input
        description: "service address line 1 as held on the losing carrier's customer service record"
        constraints: "1-80 chars"
      - name: zip_on_file
        type: string
        source: input
        description: "service ZIP as held on the losing carrier's customer service record"
        constraints: "exactly 5 digits"
      - name: match_points
        type: integer
        source: computed
        description: "weighted match score produced by calculations.csr_match_evaluation"
      - name: threshold_applied
        type: integer
        source: computed
        description: "match-point threshold taken from the losing carrier's csr_match_policy"
      - name: match_status
        type: enum
        source: computed
        description: "MATCHED when match_points >= threshold_applied, else MISMATCHED"
        constraints: "one of {MATCHED, MISMATCHED}"
      - name: mismatch_fields
        type: array
        source: computed
        description: "names of the compared fields whose normalized values differ, sorted ascending by field name"
        default: []
      - name: superseded_at
        type: datetime
        source: computed
        description: "logical-clock instant at which a newer snapshot or a resubmit displaced this one; null while current"
        default: null

  - name: CutoverSlot
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier whose porting calendar this slot occupies"
      - name: window_start
        type: datetime
        source: input
        description: "inclusive start of the half-open cutover window"
      - name: window_end
        type: datetime
        source: input
        description: "exclusive end of the half-open cutover window"
      - name: status
        type: enum
        source: computed
        description: "slot lifecycle per state_machines.CutoverSlot"
        default: OPEN
        constraints: "one of {OPEN, BOOKED, CONSUMED, RELEASED}"
      - name: booked_port_request_id
        type: string
        source: computed
        description: "FK -> PortRequest.id; set when the slot is booked, retained after CONSUMED, cleared on RELEASED"
        default: null
      - name: booked_at
        type: datetime
        source: computed
        description: "logical-clock instant at which the slot was booked; null while OPEN"
        default: null

  - name: TemporaryBridge
    parent: null
    common_fields: true
    fields:
      - name: port_request_id
        type: string
        source: input
        description: "FK -> PortRequest.id; the port whose subscriber is bridged during the cutover window"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> NumberReservation.id; must be HELD with purpose == PORT_BRIDGE"
      - name: bridge_number_id
        type: string
        source: computed
        description: "FK -> PhoneNumber.id; copied from the consumed reservation's number_id"
      - name: status
        type: enum
        source: computed
        description: "bridge lifecycle per state_machines.TemporaryBridge"
        default: PROVISIONED
        constraints: "one of {PROVISIONED, ACTIVE, RELEASED, ORPHANED}"
      - name: activated_at
        type: datetime
        source: computed
        description: "logical-clock instant the bridge went ACTIVE; null while PROVISIONED"
        default: null
      - name: released_at
        type: datetime
        source: computed
        description: "logical-clock instant the bridge left ACTIVE or PROVISIONED; null while live"
        default: null

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account, and the X-User-ID an AccountAdmin must present"
      - name: mac_address
        type: string
        source: input
        description: "hardware address"
        constraints: "exactly 12 chars [0-9A-F], unique across Device"
      - name: device_type
        type: enum
        source: input
        description: "hardware class"
        constraints: "one of {BASE_STATION, HANDSET, SOFTPHONE}"
      - name: nomadic
        type: boolean
        source: input
        description: "true when the device may legitimately move between dispatchable locations"
        default: false
      - name: assigned_number_id
        type: string
        source: computed
        description: "FK -> PhoneNumber.id; set from the creation request's assigned_number_id, cleared on number release"
        default: null
      - name: registration_status
        type: enum
        source: computed
        description: "E911 registration dimension per state_machines.Device (dimension registration_status)"
        default: PENDING_REGISTRATION
        constraints: "one of {PENDING_REGISTRATION, ADDRESS_UNVERIFIED, REGISTERED, RELOCATION_DETECTED, SUSPENDED_911}"
      - name: calling_status
        type: enum
        source: computed
        description: "calling-restriction dimension per state_machines.Device (dimension calling_status); evolves independently of registration_status"
        default: UNRESTRICTED
        constraints: "one of {UNRESTRICTED, INTL_BLOCKED, FULL_BLOCKED}"
      - name: toll_fraud_score
        type: integer
        source: computed
        description: "REALTIME variant of calculations.toll_fraud_risk_score as of the newest CallAttempt"
        default: 0
      - name: fraud_block_count
        type: integer
        source: computed
        description: "count of CallAttempt rows on this device whose decision == BLOCKED_FRAUD"
        default: 0
      - name: last_network_report_at
        type: datetime
        source: computed
        description: "logical-clock instant of the newest network report; null before the first report"
        default: null
      - name: reported_state_code
        type: string
        source: computed
        description: "state code from the newest network report; null before the first report"
        default: null
      - name: reported_postal_code
        type: string
        source: computed
        description: "postal code from the newest network report; null before the first report"
        default: null
      - name: registration_prompt_deadline
        type: datetime
        source: computed
        description: "created_at + E911_PROMPT_GRACE_HOURS; the instant a missing registration stops being in grace"

  - name: E911Registration
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the device this dispatchable location is registered for"
      - name: account_id
        type: string
        source: computed
        description: "FK -> Account.id; copied from the device at creation"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the 911 jurisdiction billing this location"
      - name: address_line1
        type: string
        source: input
        description: "dispatchable street address line"
        constraints: "1-80 chars"
      - name: unit
        type: string
        source: input
        description: "dispatchable sub-address (floor/suite/apartment); empty string when absent"
        default: ""
        constraints: "0-20 chars"
      - name: city
        type: string
        source: input
        description: "dispatchable city"
        constraints: "1-40 chars"
      - name: state_code
        type: string
        source: input
        description: "two-letter state code; must equal the jurisdiction's state_code"
        constraints: "exactly 2 uppercase letters"
      - name: postal_code
        type: string
        source: input
        description: "5-digit dispatchable postal code"
        constraints: "exactly 5 digits"
      - name: normalized_location_key
        type: string
        source: computed
        description: "upper(address_line1) + '|' + upper(unit) + '|' + postal_code with every non-alphanumeric character removed from the first two parts; the PER_LOCATION grouping key"
      - name: verification_status
        type: enum
        source: computed
        description: "registration lifecycle per state_machines.E911Registration"
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, STALE, REJECTED, SUPERSEDED}"
      - name: effective_from
        type: datetime
        source: computed
        description: "logical-clock instant of creation; the proration anchor for PROVISIONAL fee assessments"
      - name: verified_at
        type: datetime
        source: computed
        description: "logical-clock instant of the VERIFIED outcome; null until verified"
        default: null
      - name: superseded_at
        type: datetime
        source: computed
        description: "logical-clock instant a newer registration for the same device displaced this one; null while current"
        default: null
      - name: rejection_note
        type: string
        source: computed
        description: "validator's note on a REJECTED outcome; null otherwise"
        default: null

  - name: CallAttempt
    parent: Device
    common_fields: false
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; taken from the creation path segment"
      - name: destination_e164
        type: string
        source: input
        description: "dialled destination in E.164 form"
        constraints: "^\\+[0-9]{7,15}$"
      - name: destination_country_code
        type: string
        source: input
        description: "country calling code of the destination, '1' for domestic"
        constraints: "1-3 digits, must be a prefix of destination_e164 after the '+'"
      - name: requested_duration_seconds
        type: integer
        source: input
        description: "requested call duration used to project spend"
        constraints: "1-36000"
      - name: billable_minutes
        type: integer
        source: computed
        description: "max(MIN_BILLABLE_MINUTES, ceil(requested_duration_seconds / 60))"
      - name: rate_cents_per_minute
        type: integer
        source: computed
        description: "per-minute rate selected from COUNTRY_RATE_CENTS_PER_MIN, else DEFAULT_RATE_CENTS_PER_MIN"
      - name: estimated_base_cents
        type: integer
        source: computed
        description: "rate_cents_per_minute * billable_minutes, surcharge excluded"
      - name: day_subtotal_cents
        type: integer
        source: computed
        description: "step 3 of calculations.international_spend_control; ALLOWED same-day base cents plus this attempt's base"
      - name: surcharge_pct_applied
        type: integer
        source: computed
        description: "surcharge percentage of the tier selected from day_subtotal_cents"
      - name: projected_day_total_cents
        type: integer
        source: computed
        description: "day_subtotal_cents plus the rounded surcharge; the value compared against the account cap"
      - name: realtime_risk_score
        type: integer
        source: computed
        description: "REALTIME variant of calculations.toll_fraud_risk_score evaluated with this attempt included"
      - name: decision
        type: enum
        source: computed
        description: "recorded outcome; a row is persisted even when the HTTP response is an error"
        constraints: "one of {ALLOWED, BLOCKED_DEVICE, BLOCKED_E911, BLOCKED_INTL, BLOCKED_FRAUD, BLOCKED_SPEND_CAP}"
      - name: decision_error_id
        type: string
        source: computed
        description: "error_id returned to the caller when decision != ALLOWED; null when ALLOWED"
        default: null

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the assessed account"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the assessing jurisdiction"
      - name: period_month
        type: string
        source: input
        description: "assessed calendar month"
        constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: variant
        type: enum
        source: computed
        description: "PROVISIONAL when created through the assessment endpoint, FINAL when created by a remittance run"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: unit_basis
        type: enum
        source: computed
        description: "copied from the jurisdiction's fee_type at assessment time"
        constraints: "one of {PER_LINE, PER_LOCATION}"
      - name: billable_units
        type: integer
        source: computed
        description: "count of billable units selected by calculations.e911_fee_assessment"
      - name: unit_fee_breakdown
        type: array
        source: computed
        description: "per-unit rounded cents in the pinned unit order; sums to amount_cents"
      - name: amount_cents
        type: integer
        source: computed
        description: "sum of unit_fee_breakdown"
      - name: status
        type: enum
        source: computed
        description: "assessment lifecycle per state_machines.FeeAssessment"
        default: ASSESSED
        constraints: "one of {ASSESSED, VOIDED, REMITTED}"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BillingAdmin that produced this row; 'system:remittance-run' for FINAL rows"
      - name: voided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the BillingAdmin that voided this row; 'system:remittance-run' when a run voided it; null otherwise"
        default: null
      - name: remitted_at
        type: datetime
        source: computed
        description: "logical-clock instant the row became REMITTED; null otherwise"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PortRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /voip/port-requests/{id}/csr-snapshots"
        actor: CarrierLiaison
        preconditions:
          - "port_request.status == SUBMITTED"
          - "expected_port_request_version == port_request.version"
          - "the new snapshot's match_status computed by calculations.csr_match_evaluation == MATCHED"
        side_effects:
          - "creates the CarrierAccountSnapshot and sets superseded_at = clock on the previously current snapshot of this port request, if any"
          - "recomputes port_request.last_match_points and port_request.last_mismatch_fields from the new snapshot"
          - "sets port_request.validated_at = clock"
          - "sets port_request.earliest_cutover_at per calculations.earliest_cutover_floor"
          - "increments PortRequest.version by 1"
      - from: SUBMITTED
        to: CSR_MISMATCH
        trigger: "POST /voip/port-requests/{id}/csr-snapshots"
        actor: CarrierLiaison
        preconditions:
          - "port_request.status == SUBMITTED"
          - "expected_port_request_version == port_request.version"
          - "the new snapshot's match_status == MISMATCHED"
        side_effects:
          - "creates the CarrierAccountSnapshot and supersedes the previously current snapshot, if any"
          - "recomputes port_request.last_match_points and port_request.last_mismatch_fields"
          - "leaves port_request.validated_at and port_request.earliest_cutover_at unchanged (null on a first-pass mismatch)"
          - "increments PortRequest.version by 1"
      - from: CSR_MISMATCH
        to: SUBMITTED
        trigger: "POST /voip/port-requests/{id}/resubmit"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status IN {CSR_MISMATCH, REJECTED}"
          - "port_request.resubmission_count < MAX_RESUBMISSIONS (2)"
        side_effects:
          - "overwrites the five claimed_* fields from the request body"
          - "increments port_request.resubmission_count by 1"
          - "sets superseded_at = clock on the currently non-superseded CarrierAccountSnapshot, if any"
          - "clears port_request.last_match_points to null and last_mismatch_fields to []"
          - "increments PortRequest.version by 1"
        note: "cycle back into SUBMITTED; this is the same transition row that REJECTED uses"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /voip/port-requests/{id}/resubmit"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status == REJECTED"
          - "port_request.last_rejection_code IN RESUBMITTABLE_REJECTION_CODES {CSR_MISMATCH, PIN_INVALID, ACCOUNT_NOT_FOUND, PENDING_BALANCE}"
          - "port_request.resubmission_count < MAX_RESUBMISSIONS (2)"
        side_effects:
          - "overwrites the five claimed_* fields, increments resubmission_count by 1, supersedes the current snapshot"
          - "clears port_request.last_rejection_code to null"
          - "increments PortRequest.version by 1"
      - from: VALIDATED
        to: SCHEDULED
        trigger: "POST /voip/port-requests/{id}/schedule"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status == VALIDATED"
          - "the referenced CutoverSlot.status == OPEN"
          - "slot.carrier_id == port_request.losing_carrier_id"
          - "slot.window_start >= port_request.earliest_cutover_at"
          - "account.e911_compliance_posture != BLOCKED"
        side_effects:
          - "sets the slot's status to BOOKED, booked_port_request_id = port_request.id, booked_at = clock, and increments CutoverSlot.version by 1"
          - "increments PortRequest.version by 1"
      - from: SCHEDULED
        to: BRIDGED
        trigger: "POST /voip/temporary-bridges/{id}/activate"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status == SCHEDULED"
          - "the bridge's status == PROVISIONED"
          - "clock is inside the booked slot's half-open window [window_start, window_end)"
        side_effects:
          - "sets bridge.status = ACTIVE and bridge.activated_at = clock"
          - "increments PortRequest.version by 1"
      - from: BRIDGED
        to: COMPLETED
        trigger: "POST /voip/port-requests/{id}/complete-cutover"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status == BRIDGED"
        side_effects:
          - "sets the booked slot's status to CONSUMED (booked_port_request_id retained) and increments CutoverSlot.version by 1"
          - "sets the ACTIVE TemporaryBridge of this port request to RELEASED with released_at = clock"
          - "that bridge release sets its NumberReservation to RELEASED with released_reason = CUTOVER_COMPLETED"
          - "that reservation release sets the bridge PhoneNumber from RESERVED to AVAILABLE and recomputes NumberBlock counters, incrementing NumberBlock.version by 1"
          - "recomputes account.ported_number_count"
          - "increments PortRequest.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /voip/port-requests/{id}/complete-cutover"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status == SCHEDULED"
          - "no TemporaryBridge exists for this port request with status IN {PROVISIONED, ACTIVE}"
        side_effects:
          - "sets the booked slot's status to CONSUMED and increments CutoverSlot.version by 1"
          - "recomputes account.ported_number_count"
          - "increments PortRequest.version by 1"
        note: "bridging is optional; a port with no live bridge completes straight from SCHEDULED"
      - from: SCHEDULED
        to: REJECTED
        trigger: "POST /voip/port-requests/{id}/reject"
        actor: CarrierLiaison
        preconditions:
          - "port_request.status IN {SUBMITTED, CSR_MISMATCH, VALIDATED, SCHEDULED, BRIDGED}"
        side_effects:
          - "sets port_request.last_rejection_code = reason_code"
          - "releases the booked CutoverSlot (BOOKED -> RELEASED, booked_port_request_id cleared to null, CutoverSlot.version + 1)"
          - "because that slot was released, every TemporaryBridge of this port request with status IN {PROVISIONED, ACTIVE} becomes ORPHANED with released_at = clock"
          - "because a bridge became ORPHANED, its NumberReservation goes HELD -> RELEASED with released_reason = BRIDGE_ORPHANED"
          - "because that reservation was released for an orphaned bridge, its PhoneNumber goes RESERVED -> PARKED with parked_until = clock + PARK_HOLD_DAYS and park_cycle_count + 1"
          - "because a number entered PARKED, NumberBlock counters are recomputed (reserved_count - 1, parked_count + 1) and NumberBlock.version + 1"
          - "increments PortRequest.version by 1"
        note: "the same reject row applies from SUBMITTED/CSR_MISMATCH/VALIDATED/BRIDGED; the slot and bridge hops only fire when those rows exist"
      - from: REJECTED
        to: CANCELLED
        trigger: "POST /voip/port-requests/{id}/cancel"
        actor: PortingSpecialist
        preconditions:
          - "port_request.status IN {SUBMITTED, CSR_MISMATCH, VALIDATED, SCHEDULED, BRIDGED, REJECTED}"
        side_effects:
          - "runs the identical slot -> bridge -> reservation -> number -> block cascade documented on the reject transition"
          - "increments PortRequest.version by 1"
        note: "cancel is reachable from every non-terminal status including REJECTED"

  - entity: PhoneNumber
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /voip/number-reservations"
        actor: NumberingAdmin
        preconditions:
          - "phone_number.status == AVAILABLE"
          - "expected_number_block_version == number_block.version"
        side_effects:
          - "creates the HELD NumberReservation"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: RESERVED
        to: ASSIGNED
        trigger: "POST /voip/devices"
        actor: AccountAdmin
        preconditions:
          - "phone_number.status == RESERVED"
          - "the HELD reservation on this number has account_id == the new device's account_id and purpose == NEW_LINE"
        side_effects:
          - "sets phone_number.assigned_account_id = device.account_id"
          - "sets that reservation's status to CONSUMED"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /voip/devices"
        actor: AccountAdmin
        preconditions:
          - "phone_number.status == AVAILABLE"
        side_effects:
          - "sets phone_number.assigned_account_id = device.account_id"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: ASSIGNED
        to: PARKED
        trigger: "POST /voip/phone-numbers/{id}/release"
        actor: NumberingAdmin
        preconditions:
          - "phone_number.status == ASSIGNED"
        side_effects:
          - "sets parked_until = clock + PARK_HOLD_DAYS, increments park_cycle_count by 1, clears assigned_account_id to null"
          - "clears assigned_number_id to null on the Device that held the number"
          - "because that device lost its number it leaves the posture population, so account.e911_compliance_posture is recomputed"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: RESERVED
        to: PARKED
        trigger: "system: bridge orphaned by a port-request reject or cancel"
        actor: system
        preconditions:
          - "the number's HELD reservation belongs to a TemporaryBridge that just became ORPHANED"
        side_effects:
          - "sets parked_until = clock + PARK_HOLD_DAYS and increments park_cycle_count by 1"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /voip/number-reservations/{id}/release or POST /voip/port-requests/{id}/complete-cutover"
        actor: NumberingAdmin
        preconditions:
          - "the reservation holding this number goes HELD -> RELEASED with released_reason IN {MANUAL, CUTOVER_COMPLETED}"
        side_effects:
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
      - from: PARKED
        to: AVAILABLE
        trigger: "POST /voip/number-blocks/{id}/reclamation-runs"
        actor: NumberingAdmin
        preconditions:
          - "phone_number.status == PARKED"
          - "phone_number.parked_until <= clock"
        side_effects:
          - "clears parked_until to null (park_cycle_count is retained as the reuse history)"
          - "recomputes NumberBlock counters and increments NumberBlock.version by 1"
        note: "a PARKED number whose parked_until is still in the future is left untouched by the run"

  - entity: NumberReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /voip/devices with assigned_number_id equal to this reservation's number_id"
        actor: AccountAdmin
        preconditions:
          - "reservation.status == HELD"
          - "reservation.purpose == NEW_LINE"
          - "reservation.account_id == the new device's account_id"
        side_effects:
          - "the reserved PhoneNumber goes RESERVED -> ASSIGNED"
      - from: HELD
        to: CONSUMED
        trigger: "POST /voip/temporary-bridges"
        actor: PortingSpecialist
        preconditions:
          - "reservation.status == HELD"
          - "reservation.purpose == PORT_BRIDGE"
          - "reservation.account_id == the port request's account_id"
        side_effects:
          - "the bridge copies reservation.number_id into bridge_number_id; the PhoneNumber stays RESERVED for the bridge's lifetime"
        note: "a PORT_BRIDGE reservation is CONSUMED by the bridge yet still governs the number until the bridge is released or orphaned"
      - from: CONSUMED
        to: RELEASED
        trigger: "system: TemporaryBridge released by cutover completion, or orphaned by reject/cancel"
        actor: system
        preconditions:
          - "the reservation's TemporaryBridge left status ACTIVE or PROVISIONED"
        side_effects:
          - "sets released_reason = CUTOVER_COMPLETED when the bridge was RELEASED, BRIDGE_ORPHANED when it was ORPHANED"
          - "drives the bridge PhoneNumber to AVAILABLE (CUTOVER_COMPLETED) or PARKED (BRIDGE_ORPHANED)"
      - from: HELD
        to: RELEASED
        trigger: "POST /voip/number-reservations/{id}/release"
        actor: NumberingAdmin
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "sets released_reason = MANUAL"
          - "the reserved PhoneNumber goes RESERVED -> AVAILABLE and NumberBlock counters are recomputed"
      - from: HELD
        to: EXPIRED
        trigger: "POST /voip/number-blocks/{id}/reclamation-runs"
        actor: NumberingAdmin
        preconditions:
          - "reservation.status == HELD"
          - "reservation.reserved_until < clock"
        side_effects:
          - "the reserved PhoneNumber goes RESERVED -> AVAILABLE and NumberBlock counters are recomputed"

  - entity: CutoverSlot
    initial_state: OPEN
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /voip/port-requests/{id}/schedule"
        actor: PortingSpecialist
        preconditions:
          - "slot.status == OPEN"
          - "slot.carrier_id == port_request.losing_carrier_id"
          - "slot.window_start >= port_request.earliest_cutover_at"
        side_effects:
          - "sets booked_port_request_id and booked_at = clock"
          - "drives port_request.status VALIDATED -> SCHEDULED"
          - "increments CutoverSlot.version by 1"
      - from: BOOKED
        to: CONSUMED
        trigger: "POST /voip/port-requests/{id}/complete-cutover"
        actor: PortingSpecialist
        preconditions:
          - "slot.status == BOOKED"
          - "slot.booked_port_request_id == the completing port request's id"
        side_effects:
          - "retains booked_port_request_id as the completion record"
          - "increments CutoverSlot.version by 1"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /voip/port-requests/{id}/reject or POST /voip/port-requests/{id}/cancel"
        actor: CarrierLiaison
        preconditions:
          - "slot.status == BOOKED"
          - "slot.booked_port_request_id == the rejected or cancelled port request's id"
        side_effects:
          - "clears booked_port_request_id to null and booked_at to null"
          - "because the slot was released, every PROVISIONED or ACTIVE TemporaryBridge of that port request becomes ORPHANED"
          - "increments CutoverSlot.version by 1"
        note: "a RELEASED slot is terminal - it no longer blocks new slots in calculations.cutover_slot_overlap and cannot be re-booked"

  - entity: TemporaryBridge
    initial_state: PROVISIONED
    terminal_states: [RELEASED, ORPHANED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /voip/temporary-bridges/{id}/activate"
        actor: PortingSpecialist
        preconditions:
          - "bridge.status == PROVISIONED"
          - "the port request's booked CutoverSlot has status == BOOKED"
          - "clock >= slot.window_start AND clock < slot.window_end"
        side_effects:
          - "sets activated_at = clock"
          - "drives port_request.status SCHEDULED -> BRIDGED"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /voip/port-requests/{id}/complete-cutover"
        actor: PortingSpecialist
        preconditions:
          - "bridge.status == ACTIVE"
          - "the bridge's port request is completing"
        side_effects:
          - "sets released_at = clock"
          - "because the bridge was released, its NumberReservation goes CONSUMED -> RELEASED with released_reason = CUTOVER_COMPLETED"
      - from: ACTIVE
        to: ORPHANED
        trigger: "system: the booked CutoverSlot was released by a port-request reject or cancel"
        actor: system
        preconditions:
          - "bridge.status IN {PROVISIONED, ACTIVE}"
          - "the slot booked by this bridge's port request just went BOOKED -> RELEASED"
        side_effects:
          - "sets released_at = clock"
          - "because the bridge was orphaned, its NumberReservation goes CONSUMED -> RELEASED with released_reason = BRIDGE_ORPHANED, which parks the bridge PhoneNumber"
      - from: PROVISIONED
        to: ORPHANED
        trigger: "system: the booked CutoverSlot was released by a port-request reject or cancel"
        actor: system
        preconditions:
          - "bridge.status == PROVISIONED"
        side_effects:
          - "identical to the ACTIVE -> ORPHANED row; a bridge that never activated still parks its number"

  - entity: Device
    dimension: registration_status
    initial_state: PENDING_REGISTRATION
    terminal_states: []
    transitions:
      - from: PENDING_REGISTRATION
        to: ADDRESS_UNVERIFIED
        trigger: "POST /voip/e911-registrations"
        actor: AccountAdmin
        preconditions:
          - "registration.state_code == jurisdiction.state_code"
        side_effects:
          - "creates the UNVERIFIED E911Registration with effective_from = clock"
          - "recomputes account.e911_compliance_posture"
      - from: ADDRESS_UNVERIFIED
        to: REGISTERED
        trigger: "POST /voip/e911-registrations/{id}/verify with outcome VERIFIED"
        actor: E911Validator
        preconditions:
          - "registration.verification_status IN {UNVERIFIED, STALE}"
        side_effects:
          - "sets registration.verification_status = VERIFIED and verified_at = clock"
          - "recomputes account.e911_compliance_posture, which may compensate earlier INTL_BLOCKED devices"
      - from: ADDRESS_UNVERIFIED
        to: SUSPENDED_911
        trigger: "POST /voip/e911-registrations/{id}/verify with outcome REJECTED"
        actor: E911Validator
        preconditions:
          - "registration.verification_status IN {UNVERIFIED, STALE}"
        side_effects:
          - "sets registration.verification_status = REJECTED and rejection_note"
          - "recomputes account.e911_compliance_posture, which becomes BLOCKED and full-blocks every device of the account"
      - from: REGISTERED
        to: RELOCATION_DETECTED
        trigger: "POST /voip/devices/{id}/network-reports with a CROSS_JURISDICTION drift class"
        actor: AccountAdmin
        preconditions:
          - "device.nomadic == true"
          - "the device has a current (superseded_at == null) E911Registration"
          - "reported_state_code != current_registration.state_code"
        side_effects:
          - "stores reported_state_code, reported_postal_code and last_network_report_at = clock on the device"
          - "because the report crossed a jurisdiction line, the current E911Registration goes VERIFIED -> STALE"
          - "because that registration became STALE, account.e911_compliance_posture recomputes COMPLIANT -> AT_RISK"
          - "because the posture became AT_RISK, every Device of the account with nomadic == true and calling_status == UNRESTRICTED goes to INTL_BLOCKED"
      - from: REGISTERED
        to: ADDRESS_UNVERIFIED
        trigger: "POST /voip/devices/{id}/network-reports with an INTRA_JURISDICTION drift class"
        actor: AccountAdmin
        preconditions:
          - "device.nomadic == true"
          - "reported_postal_code != current_registration.postal_code AND reported_state_code == current_registration.state_code"
        side_effects:
          - "stores the reported location and last_network_report_at = clock"
          - "the current E911Registration goes VERIFIED -> STALE"
          - "account.e911_compliance_posture recomputes to AT_RISK"
        note: "same-postal reports are SAME_LOCATION and change only last_network_report_at plus the reported_* fields"
      - from: RELOCATION_DETECTED
        to: ADDRESS_UNVERIFIED
        trigger: "POST /voip/e911-registrations (re-capture at the new location)"
        actor: AccountAdmin
        preconditions:
          - "the device already has a current registration, which is superseded by the new one"
        side_effects:
          - "sets superseded_at = clock and verification_status = SUPERSEDED on the previous registration"
          - "creates the replacement UNVERIFIED registration with effective_from = clock"
          - "recomputes account.e911_compliance_posture"
        note: "closes the registration cycle REGISTERED -> RELOCATION_DETECTED -> ADDRESS_UNVERIFIED -> REGISTERED"
      - from: SUSPENDED_911
        to: ADDRESS_UNVERIFIED
        trigger: "POST /voip/e911-registrations (re-capture after a rejected location)"
        actor: AccountAdmin
        preconditions:
          - "the device's current registration has verification_status == REJECTED"
        side_effects:
          - "supersedes the REJECTED registration and creates a replacement UNVERIFIED one"
          - "recomputes account.e911_compliance_posture"

  - entity: Device
    dimension: calling_status
    initial_state: UNRESTRICTED
    terminal_states: []
    transitions:
      - from: UNRESTRICTED
        to: INTL_BLOCKED
        trigger: "POST /voip/devices/{id}/call-attempts whose REALTIME risk score >= FRAUD_BLOCK_THRESHOLD"
        actor: AccountAdmin
        preconditions:
          - "calculations.toll_fraud_risk_score REALTIME variant >= 60 for the attempt under evaluation"
        side_effects:
          - "persists the CallAttempt with decision = BLOCKED_FRAUD and decision_error_id = ERR_TOLL_FRAUD_THRESHOLD_BREACHED"
          - "increments device.fraud_block_count by 1"
          - "registration_status is left untouched by this transition"
      - from: INTL_BLOCKED
        to: FULL_BLOCKED
        trigger: "POST /voip/devices/{id}/call-attempts that pushes fraud_block_count to FRAUD_FULL_BLOCK_COUNT (3)"
        actor: AccountAdmin
        preconditions:
          - "device.fraud_block_count reaches 3 after this attempt is recorded"
        side_effects:
          - "every subsequent call attempt on the device is refused with ERR_DEVICE_CALLING_BLOCKED"
      - from: UNRESTRICTED
        to: INTL_BLOCKED
        trigger: "system: account.e911_compliance_posture recomputed to AT_RISK"
        actor: system
        preconditions:
          - "device.nomadic == true"
          - "device.calling_status == UNRESTRICTED"
        side_effects:
          - "no CallAttempt row is written; this hop is the third link of the relocation cascade"
      - from: INTL_BLOCKED
        to: UNRESTRICTED
        trigger: "system: account.e911_compliance_posture recomputed to COMPLIANT"
        actor: system
        preconditions:
          - "device.calling_status == INTL_BLOCKED"
          - "device.fraud_block_count == 0"
        side_effects:
          - "compensates the posture-driven block; fraud-driven blocks are deliberately not lifted here"
      - from: INTL_BLOCKED
        to: UNRESTRICTED
        trigger: "POST /voip/devices/{id}/calling-restrictions with action REVIEW_UNBLOCK"
        actor: SecurityAnalyst
        preconditions:
          - "device.calling_status IN {INTL_BLOCKED, FULL_BLOCKED}"
          - "the device's current E911Registration has verification_status == VERIFIED"
          - "calculations.toll_fraud_risk_score DAILY_REVIEW variant < 60"
        side_effects:
          - "resets device.fraud_block_count to 0"
      - from: UNRESTRICTED
        to: FULL_BLOCKED
        trigger: "POST /voip/devices/{id}/calling-restrictions with action BLOCK_ALL, or system posture BLOCKED"
        actor: SecurityAnalyst
        preconditions:
          - "device.calling_status != FULL_BLOCKED"
        side_effects:
          - "when driven by posture BLOCKED, every Device of the account is full-blocked in one sweep"
      - from: UNRESTRICTED
        to: INTL_BLOCKED
        trigger: "POST /voip/devices/{id}/calling-restrictions with action BLOCK_INTL"
        actor: SecurityAnalyst
        preconditions:
          - "device.calling_status == UNRESTRICTED"
        side_effects:
          - "leaves registration_status untouched"

  - entity: E911Registration
    initial_state: UNVERIFIED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /voip/e911-registrations/{id}/verify with outcome VERIFIED"
        actor: E911Validator
        preconditions:
          - "verification_status IN {UNVERIFIED, STALE}"
        side_effects:
          - "sets verified_at = clock, drives the device to REGISTERED, recomputes the account posture"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /voip/e911-registrations/{id}/verify with outcome REJECTED"
        actor: E911Validator
        preconditions:
          - "verification_status IN {UNVERIFIED, STALE}"
        side_effects:
          - "sets rejection_note, drives the device to SUSPENDED_911, recomputes the account posture to BLOCKED"
      - from: VERIFIED
        to: STALE
        trigger: "POST /voip/devices/{id}/network-reports with drift class INTRA_JURISDICTION or CROSS_JURISDICTION"
        actor: system
        preconditions:
          - "verification_status == VERIFIED"
          - "the report's normalized location differs from this registration's"
        side_effects:
          - "the STALE status pushes account.e911_compliance_posture to AT_RISK"
      - from: STALE
        to: VERIFIED
        trigger: "POST /voip/e911-registrations/{id}/verify with outcome VERIFIED (re-verification in place)"
        actor: E911Validator
        preconditions:
          - "verification_status == STALE"
        side_effects:
          - "sets verified_at = clock and drives the device back to REGISTERED"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /voip/e911-registrations (a newer registration for the same device)"
        actor: AccountAdmin
        preconditions:
          - "this registration is the device's current one (superseded_at == null)"
        side_effects:
          - "sets superseded_at = clock; SUPERSEDED rows never re-enter the fee population for periods after superseded_at"
      - from: STALE
        to: SUPERSEDED
        trigger: "POST /voip/e911-registrations (re-capture after relocation)"
        actor: AccountAdmin
        preconditions:
          - "this registration is the device's current one"
        side_effects:
          - "sets superseded_at = clock"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /voip/e911-registrations (re-capture after rejection)"
        actor: AccountAdmin
        preconditions:
          - "this registration is the device's current one"
        side_effects:
          - "sets superseded_at = clock"

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [VOIDED, REMITTED]
    transitions:
      - from: ASSESSED
        to: VOIDED
        trigger: "POST /voip/fee-assessments/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "assessment.status == ASSESSED"
          - "X-User-ID != assessment.assessed_by_user_id"
        side_effects:
          - "sets voided_by_user_id = X-User-ID"
          - "recomputes jurisdiction.pending_fee_cents and account.fee_liability_cents so the pre-assessment values are restored exactly"
      - from: ASSESSED
        to: VOIDED
        trigger: "POST /voip/jurisdictions/{id}/remittance-runs"
        actor: BillingAdmin
        preconditions:
          - "assessment.status == ASSESSED AND assessment.variant == PROVISIONAL AND assessment.period_month == the run's period_month"
        side_effects:
          - "sets voided_by_user_id = 'system:remittance-run'"
      - from: ASSESSED
        to: REMITTED
        trigger: "POST /voip/jurisdictions/{id}/remittance-runs"
        actor: BillingAdmin
        preconditions:
          - "the row is the FINAL assessment the run just created"
        side_effects:
          - "sets remitted_at = clock and moves its amount from jurisdiction.pending_fee_cents into remitted_fee_cents"
        note: "FINAL rows are created directly in ASSESSED and driven to REMITTED inside the same run"

  - entity: Account
    dimension: e911_compliance_posture
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "system: recompute after device create, network report, registration create/verify, or number release"
        actor: system
        preconditions:
          - "calculations.account_e911_posture yields AT_RISK"
        side_effects:
          - "every Device of the account with nomadic == true and calling_status == UNRESTRICTED goes to INTL_BLOCKED"
      - from: AT_RISK
        to: COMPLIANT
        trigger: "system: recompute after a VERIFIED outcome or after the offending device loses its number"
        actor: system
        preconditions:
          - "calculations.account_e911_posture yields COMPLIANT"
        side_effects:
          - "every Device of the account with calling_status == INTL_BLOCKED and fraud_block_count == 0 returns to UNRESTRICTED"
      - from: AT_RISK
        to: BLOCKED
        trigger: "system: recompute after a REJECTED verification outcome or once a missing registration's grace expires"
        actor: system
        preconditions:
          - "calculations.account_e911_posture yields BLOCKED"
        side_effects:
          - "every Device of the account with calling_status != FULL_BLOCKED goes to FULL_BLOCKED"
          - "POST /voip/port-requests/{id}/schedule is refused for this account with ERR_ACCOUNT_E911_BLOCKED"
      - from: BLOCKED
        to: AT_RISK
        trigger: "system: recompute after the rejected registration is superseded by a fresh capture"
        actor: system
        preconditions:
          - "calculations.account_e911_posture yields AT_RISK"
        side_effects:
          - "FULL_BLOCKED devices are not automatically lifted; a SecurityAnalyst REVIEW_UNBLOCK is required"
      - from: COMPLIANT
        to: BLOCKED
        trigger: "system: recompute when a device with a number has no registration and clock >= registration_prompt_deadline"
        actor: system
        preconditions:
          - "calculations.account_e911_posture yields BLOCKED"
        side_effects:
          - "every Device of the account with calling_status != FULL_BLOCKED goes to FULL_BLOCKED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: csr-snapshot-create-stale-port-request
    parent_entity: PortRequest
    write_endpoint: "POST /voip/port-requests/{id}/csr-snapshots"
    occ_field: "expected_port_request_version"
    description: |
      Posting a CarrierAccountSnapshot against a PortRequest whose version has advanced since the
      liaison last observed it is refused. A snapshot legitimately supersedes the port request's
      previously current snapshot, so the write cannot be rejected by any state precondition when the
      caller's view is stale: the port request is still SUBMITTED and a second snapshot is a valid
      product operation. The stale-version check is the only thing that distinguishes a liaison acting
      on a fresh CSR pull from one acting on a view that a resubmit or an earlier snapshot has already
      invalidated.
    error_id: ERR_STALE_PORT_REQUEST_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-number-block
    parent_entity: NumberBlock
    write_endpoint: "POST /voip/number-reservations"
    occ_field: "expected_number_block_version"
    description: |
      Creating a NumberReservation against a NumberBlock whose version has advanced since the numbering
      admin last read the block is refused. Reservations draw down a shared aggregate (available_count
      and the max_concurrent_reservations ceiling), so a reservation written from a stale census view is
      not caught by any per-number state precondition: the block still has free numbers and the write
      would otherwise succeed. The version check pins the census the caller reasoned about.
    error_id: ERR_STALE_NUMBER_BLOCK_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: csr_match_evaluation
    trigger: "POST /voip/port-requests/{id}/csr-snapshots, evaluated before the snapshot row is persisted"
    algorithm: weighted_scoring
    formula: |
      normalize(s) = uppercase(s) with every character outside [A-Z0-9] removed
      compared_pairs = [
        ("account_number",     port_request.claimed_account_number, snapshot.account_number_on_file, 40),
        ("billing_name",       port_request.claimed_billing_name,   snapshot.billing_name_on_file,   15),
        ("pin",                port_request.claimed_pin,            snapshot.pin_on_file,            30),
        ("service_address_line1", port_request.claimed_address_line1, snapshot.address_line1_on_file, 10),
        ("service_zip",        port_request.claimed_zip,            snapshot.zip_on_file,             5) ]
      match_points   = sum of weight over pairs where normalize(claimed) == normalize(on_file)
      mismatch_fields = the field names of the remaining pairs, sorted ascending as plain strings
      threshold_applied = 100 when carrier.csr_match_policy == STRICT, 85 when RELAXED
      match_status   = MATCHED when match_points >= threshold_applied, else MISMATCHED
    input_set: "exactly the five claimed_* fields of the PortRequest against the five *_on_file fields of the snapshot being created; earlier superseded snapshots are never re-scored"
    constants:
      WEIGHT_ACCOUNT_NUMBER: 40
      WEIGHT_PIN: 30
      WEIGHT_BILLING_NAME: 15
      WEIGHT_ADDRESS_LINE1: 10
      WEIGHT_ZIP: 5
      THRESHOLD_STRICT: 100
      THRESHOLD_RELAXED: 85
      PORT_RESUBMISSION_LIMIT: 2
    precision: "integer points, no rounding; the comparison is >= (a RELAXED carrier accepts exactly 85)"

  - name: earliest_cutover_floor
    trigger: "the SUBMITTED -> VALIDATED transition of PortRequest sets earliest_cutover_at"
    algorithm: chronological
    formula: |
      d = the UTC calendar date of port_request.validated_at
      advance d forward one calendar day at a time, counting only days whose UTC weekday is
      Monday..Friday, until carrier.foc_business_days such days have been counted
      earliest_cutover_at = 00:00:00.000Z of the final counted day
      (weekend days are skipped and never counted; public holidays are ignored by design)
    input_set: "port_request.validated_at and the losing Carrier's foc_business_days; recomputed on every re-entry into VALIDATED"
    constants:
      BUSINESS_WEEKDAYS: "MON,TUE,WED,THU,FRI"
    precision: "whole days; the floor lands on midnight UTC of the counted business day"

  - name: cutover_slot_overlap
    trigger: "POST /voip/cutover-slots, before the slot row is persisted"
    algorithm: interval_merge
    formula: |
      candidate = [window_start, window_end)                       # half-open
      buffer    = carrier.porting_buffer_minutes
      blocking_slots = CutoverSlot rows with carrier_id == candidate.carrier_id
                       AND status IN {OPEN, BOOKED}                # CONSUMED and RELEASED slots never block
                       ordered by window_start ASC, then created_at ASC
      for S in blocking_slots:
          expanded_S = [S.window_start - buffer minutes, S.window_end + buffer minutes)   # half-open
          if candidate.window_start < expanded_S.end AND expanded_S.start < candidate.window_end:
              reject with ERR_CUTOVER_SLOT_OVERLAP naming S
      window_length_minutes = (window_end - window_start) in whole minutes
      reject with ERR_CUTOVER_WINDOW_LENGTH_INVALID when window_length_minutes < 60 or > 480
      (the length check is evaluated before the overlap scan)
    input_set: "every CutoverSlot of the same carrier whose status IS in {OPEN, BOOKED}; slots of other carriers are irrelevant"
    constants:
      MIN_WINDOW_MINUTES: 60
      MAX_WINDOW_MINUTES: 480
    precision: "minute granularity; adjacency is permitted because both the candidate and the expanded interval are half-open, so a candidate starting exactly at expanded_S.end does not collide"

  - name: reservation_interval_capacity
    trigger: "POST /voip/number-reservations; the window and block-capacity checks run before number selection, the same-number overlap check runs after it"
    algorithm: aggregation
    formula: |
      candidate = [reserved_from, reserved_until]                  # CLOSED at both ends
      intersects(A, B) = A.start <= B.end AND B.start <= A.end     # touching endpoints DO intersect
      reject with ERR_RESERVATION_WINDOW_INVALID when reserved_until <= reserved_from,
        or reserved_from < clock, or (reserved_until - reserved_from) > RESERVATION_MAX_DAYS
      block_concurrent = count of NumberReservation rows with block_id == candidate.block_id
                         AND status == HELD AND intersects(their closed interval, candidate)
      reject with ERR_BLOCK_RESERVATION_CAPACITY_EXCEEDED when
        block_concurrent + 1 > number_block.max_concurrent_reservations
      same_number_conflict = any NumberReservation with number_id == the selected number
                         AND status == HELD AND intersects(its closed interval, candidate)
      reject with ERR_NUMBER_RESERVATION_OVERLAP when same_number_conflict exists
      (evaluation order is pinned: window sanity, then block capacity, then number selection
       per reservation_number_selector, then same-number overlap)
    input_set: "HELD reservations only; CONSUMED, RELEASED and EXPIRED rows never occupy the interval"
    constants:
      RESERVATION_MAX_DAYS: 45
    precision: "millisecond instants compared inclusively on both ends, in deliberate contrast to the half-open buffered arithmetic of cutover_slot_overlap"

  - name: reservation_number_selector
    trigger: "POST /voip/number-reservations when the request body omits number_id"
    algorithm: aggregation
    formula: |
      candidates = PhoneNumber rows with block_id == request.block_id AND status == AVAILABLE
      ranking    = line_number ASC compared as a 4-character string
      tie_break  = created_at ASC (line_number is unique inside a block, so this fires only on
                   a same-line_number data anomaly); PhoneNumber.id is never consulted
      selected   = the first candidate under (ranking, tie_break)
      empty_pool = candidates is the empty set -> reject with ERR_NO_NUMBERS_AVAILABLE
      when number_id IS supplied, no selection runs; the named number must have status == AVAILABLE or
      RESERVED (a RESERVED number may take one further hold over a disjoint interval, which the
      same-number overlap check then adjudicates); ASSIGNED and PARKED numbers are rejected with
      ERR_PHONE_NUMBER_STATE_INVALID
    input_set: "only AVAILABLE numbers of the named block are auto-selectable; RESERVED, ASSIGNED and PARKED numbers are excluded from automatic selection even when their parked_until has elapsed"
    constants: {}
    precision: "exact string ordering on line_number; the empty-pool branch is evaluated after the block-capacity check of reservation_interval_capacity"

  - name: relocation_drift_class
    trigger: "POST /voip/devices/{id}/network-reports"
    algorithm: constraint_propagation
    formula: |
      current_reg = the E911Registration with device_id == this device AND superseded_at == null
                    (at most one such row exists by construction)
      if current_reg IS null:
          drift_class = NO_REGISTRATION
      elif reported_postal_code == current_reg.postal_code:
          drift_class = SAME_LOCATION
      elif reported_state_code == current_reg.state_code:
          drift_class = INTRA_JURISDICTION
      else:
          drift_class = CROSS_JURISDICTION
      effects:
        NO_REGISTRATION    -> device.registration_status = ADDRESS_UNVERIFIED; no registration mutated
        SAME_LOCATION      -> only reported_state_code, reported_postal_code, last_network_report_at change
        INTRA_JURISDICTION -> device.registration_status = ADDRESS_UNVERIFIED; current_reg VERIFIED -> STALE
        CROSS_JURISDICTION -> device.registration_status = RELOCATION_DETECTED; current_reg VERIFIED -> STALE
      device.nomadic == false AND drift_class IN {INTRA_JURISDICTION, CROSS_JURISDICTION}
        -> reject with ERR_NON_NOMADIC_DEVICE_RELOCATION and mutate nothing at all
      any transition of current_reg into STALE re-runs calculations.account_e911_posture
    input_set: "the device's single current registration; superseded and rejected history rows are ignored"
    constants: {}
    precision: "postal codes and state codes are compared as exact strings after uppercasing"

  - name: account_e911_posture
    trigger: "recomputed at the end of POST /voip/devices, POST /voip/e911-registrations, POST /voip/e911-registrations/{id}/verify, POST /voip/devices/{id}/network-reports and POST /voip/phone-numbers/{id}/release"
    algorithm: aggregation
    formula: |
      population = Device rows with account_id == this account AND assigned_number_id != null
      for each d in population:
          reg(d) = the E911Registration with device_id == d.id AND superseded_at == null
          class(d) =
            OK          when reg(d) != null AND reg(d).verification_status == VERIFIED
            STALE       when reg(d) != null AND reg(d).verification_status == STALE
            HARD_FAIL   when reg(d) != null AND reg(d).verification_status == REJECTED
            MISSING_OVERDUE when (reg(d) IS null OR reg(d).verification_status == UNVERIFIED)
                             AND clock >= d.registration_prompt_deadline
            MISSING_GRACE   when (reg(d) IS null OR reg(d).verification_status == UNVERIFIED)
                             AND clock < d.registration_prompt_deadline
      posture =
        BLOCKED   when any class(d) IN {HARD_FAIL, MISSING_OVERDUE}
        AT_RISK   when no BLOCKED trigger and any class(d) IN {STALE, MISSING_GRACE}
        COMPLIANT otherwise, including the vacuous case where population is empty
    input_set: "only devices of this account that currently hold a PhoneNumber; number-less devices are outside the population entirely"
    constants:
      E911_PROMPT_GRACE_HOURS: 72
    precision: "grace expiry compares clock >= device.created_at + 72h, so the instant of equality is already overdue"

  - name: e911_fee_assessment
    trigger: "POST /voip/fee-assessments produces the PROVISIONAL variant; POST /voip/jurisdictions/{id}/remittance-runs produces the FINAL variant"
    algorithm: tiered_pricing
    formula: |
      period_start = 00:00:00.000Z of day 1 of period_month
      period_end   = 23:59:59.999Z of the last day of period_month
      days_in_month = calendar day count of period_month
      eligible = E911Registration rows where
          jurisdiction_id == the assessing jurisdiction
          AND account_id == the assessed account
          AND verification_status IN {VERIFIED, STALE}          # as of the moment the run executes
          AND effective_from <= period_end
          AND (superseded_at IS null OR superseded_at > period_end)
          AND the registration's Device has assigned_number_id != null
      units =
          PER_LINE     -> one unit per eligible registration
          PER_LOCATION -> one unit per DISTINCT normalized_location_key over eligible; each unit's
                          anchor is MIN(effective_from) inside its key group
      unit_order = anchor effective_from ASC, then the anchor registration's created_at ASC
      PROVISIONAL:
          eligible is further narrowed to registrations with effective_from <= clock
          for each unit u in unit_order:
              anchor_day = day-of-month of MAX(u.anchor, period_start)
              active_days(u) = days_in_month - anchor_day + 1
              unit_fee_breakdown[u] = round_half_up(monthly_fee_cents * active_days(u) / days_in_month)
          amount_cents = sum(unit_fee_breakdown)
          # ROUNDING ORDER IS PINNED: round every unit to whole cents FIRST, then sum. The rejected
          # alternative (sum the exact fractions, round once at the end) is arithmetically different -
          # 175 cents over 31 days with active_days [31, 15, 15] yields 345 under the pinned order and
          # 344 under the rejected one.
      FINAL:
          for each unit u in unit_order:
              unit_fee_breakdown[u] = monthly_fee_cents      # no proration whatsoever
          amount_cents = monthly_fee_cents * count(units)
    input_set: "registrations in VERIFIED or STALE status only; UNVERIFIED, REJECTED and SUPERSEDED rows are excluded, and PROVISIONAL additionally excludes registrations whose effective_from is in the future relative to the clock"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents; per-unit rounding precedes summation"
    variants:
      - name: PROVISIONAL
        when: "a BillingAdmin assesses mid-period through POST /voip/fee-assessments"
        difference: "prorates each unit by the days remaining in the month from that unit's anchor, so a unit that came online on the 17th of a 31-day month pays 15/31 of the monthly fee"
      - name: FINAL
        when: "the month-end remittance run assesses the closed period"
        difference: "charges the full monthly fee per unit and ignores anchors entirely, so identical registrations yield 525 cents where PROVISIONAL yielded 345"

  - name: fee_ledger_reconciliation
    trigger: "recomputed at the end of POST /voip/fee-assessments, POST /voip/fee-assessments/{id}/void and POST /voip/jurisdictions/{id}/remittance-runs"
    algorithm: aggregation
    formula: |
      jurisdiction.pending_fee_cents  = sum(FeeAssessment.amount_cents where jurisdiction_id == J and status == ASSESSED)
      jurisdiction.remitted_fee_cents = sum(FeeAssessment.amount_cents where jurisdiction_id == J and status == REMITTED)
      account.fee_liability_cents     = sum(FeeAssessment.amount_cents where account_id == A and status IN {ASSESSED, REMITTED})
      CONSERVED QUANTITY (money): for every jurisdiction J,
        pending_fee_cents + remitted_fee_cents
          == sum(amount_cents of every FeeAssessment of J whose status != VOIDED)
      so an assessment followed by its void restores pending_fee_cents and fee_liability_cents to the
      exact cent values they held before the assessment; VOIDED rows are retained for audit but leave
      the ledger untouched.
    input_set: "all FeeAssessment rows of the jurisdiction (respectively account) regardless of period_month; VOIDED rows contribute zero"
    constants: {}
    precision: "whole cents, no rounding at reconciliation time"

  - name: number_inventory_census
    trigger: "recomputed at the end of every endpoint that mints, reserves, assigns, releases, parks or reclaims a PhoneNumber of the block"
    algorithm: aggregation
    formula: |
      minted_count    = count(PhoneNumber where block_id == B)
      available_count = count(... AND status == AVAILABLE)
      reserved_count  = count(... AND status == RESERVED)
      assigned_count  = count(... AND status == ASSIGNED)
      parked_count    = count(... AND status == PARKED)
      CONSERVED QUANTITY (inventory census, a count not an amount):
        available_count + reserved_count + assigned_count + parked_count == minted_count
      minting is refused with ERR_BLOCK_CAPACITY_EXHAUSTED once minted_count == total_capacity, so
      minted_count never exceeds total_capacity.
      A reservation followed by its release restores all four counters to their pre-reservation values;
      an orphaned bridge instead moves one number from reserved_count to parked_count, and the later
      reclamation run moves it from parked_count back to available_count, leaving the sum invariant at
      every intermediate step.
    input_set: "every PhoneNumber row of the block in every status; reclamation never deletes rows, so minted_count only grows"
    constants:
      NUMBER_PARK_HOURS: 168
    precision: "exact integer counts"

  - name: toll_fraud_risk_score
    trigger: "the REALTIME variant runs inside POST /voip/devices/{id}/call-attempts; the DAILY_REVIEW variant runs inside POST /voip/devices/{id}/calling-restrictions when action == REVIEW_UNBLOCK"
    algorithm: weighted_scoring
    formula: |
      country_risk(cc) = BASE_COUNTRY_RISK[cc] when present, else UNKNOWN_COUNTRY_RISK
      REALTIME (evaluated with the attempt under consideration already counted):
          window   = (clock - 60 minutes, clock]                      # half-open on the left
          rows     = CallAttempt of this device with created_at inside window AND decision != BLOCKED_E911,
                     plus the attempt under evaluation
          n        = count(rows)
          distinct = count of DISTINCT destination_country_code over rows
          velocity_points = min(40, 4 * n)
          geo_points      = max over rows of country_risk(destination_country_code)
          spread_points   = 6 * max(0, distinct - 1)
          nomadic_points  = 10 when device.nomadic == true AND device.registration_status != REGISTERED, else 0
          raw        = velocity_points + geo_points + spread_points + nomadic_points
          multiplier = 1.5 when (clock - device.created_at) < NEW_DEVICE_AGE_HOURS, else 1.0
          score      = min(SCORE_CEILING, round_half_up(raw * multiplier))
          score >= FRAUD_BLOCK_THRESHOLD -> the attempt is refused with
            ERR_TOLL_FRAUD_THRESHOLD_BREACHED and recorded with decision = BLOCKED_FRAUD
      DAILY_REVIEW:
          window   = [00:00:00.000Z of the clock's UTC date, clock]
          rows     = CallAttempt of this device inside window with decision NOT IN {BLOCKED_FRAUD, BLOCKED_E911}
          n, distinct as above over those rows
          velocity_points = min(40, 2 * n)
          geo_points      = max over rows of country_risk(...), or 0 when rows is empty
          spread_points   = 4 * max(0, distinct - 1)
          nomadic_points  = same rule as REALTIME
          score           = min(SCORE_CEILING, round_half_up(velocity_points + geo_points + spread_points + nomadic_points))
          score >= FRAUD_BLOCK_THRESHOLD -> the unblock is refused with ERR_UNBLOCK_REVIEW_SCORE_TOO_HIGH
    input_set: "CallAttempt rows of the single device only; rows of sibling devices on the same account never enter either window"
    constants:
      BASE_COUNTRY_RISK: { "1": 0, "44": 5, "53": 25, "234": 30, "252": 35 }
      UNKNOWN_COUNTRY_RISK: 20
      NEW_DEVICE_AGE_HOURS: 72
      NEW_DEVICE_MULTIPLIER: 1.5
      NOMADIC_UNSETTLED_POINTS: 10
      SPREAD_POINTS_REALTIME: 6
      SPREAD_POINTS_DAILY: 4
      SCORE_CEILING: 100
      FRAUD_BLOCK_THRESHOLD: 60
      FRAUD_FULL_BLOCK_COUNT: 3
    precision: "integer score after a single round_half_up on the multiplied raw value; the threshold comparison is >= so exactly 60 blocks and 59 does not"
    variants:
      - name: REALTIME
        when: "each call attempt, gating the call itself"
        difference: "counts a 60-minute rolling window at 4 points per attempt, keeps BLOCKED_FRAUD rows in the window, and multiplies by 1.5 for devices younger than 72 hours"
      - name: DAILY_REVIEW
        when: "a SecurityAnalyst asks to lift a block"
        difference: "counts the UTC calendar day at 2 points per attempt, discards BLOCKED_FRAUD rows and never applies the new-device multiplier, so the same four attempts that score 69 in REALTIME score 49 here"

  - name: international_spend_control
    trigger: "POST /voip/devices/{id}/call-attempts whose destination_country_code != '1'"
    algorithm: tiered_pricing
    formula: |
      STEP 1  billable_minutes = max(MIN_BILLABLE_MINUTES, ceil(requested_duration_seconds / 60))
      STEP 2  rate_cents_per_minute = COUNTRY_RATE_CENTS_PER_MIN[cc] when present, else DEFAULT_RATE_CENTS_PER_MIN
              estimated_base_cents  = rate_cents_per_minute * billable_minutes
      STEP 3  day_subtotal_cents = estimated_base_cents
                + sum(estimated_base_cents of CallAttempt rows whose device belongs to the SAME ACCOUNT,
                      whose created_at falls in the clock's UTC calendar day,
                      whose destination_country_code != '1',
                      AND whose decision == ALLOWED)
              # the subtotal deliberately EXCLUDES every previously applied surcharge - this is the
              # pinned break in the apparent circularity between total and surcharge
      STEP 4  surcharge_pct_applied = pct of the highest SURCHARGE_TIERS entry whose
              min_subtotal_cents <= day_subtotal_cents
      STEP 5  projected_day_total_cents = day_subtotal_cents
                + round_half_up(day_subtotal_cents * surcharge_pct_applied / 100)
      STEP 6  breach when projected_day_total_cents > account.intl_daily_cap_cents  (STRICTLY greater;
              a projection landing exactly on the cap is allowed) -> refuse with
              ERR_INTL_SPEND_CAP_EXCEEDED and record decision = BLOCKED_SPEND_CAP
      Had step 4 keyed the tier on projected_day_total_cents the definition would be circular; the
      scaffold pins the tier to the surcharge-free subtotal instead.
    input_set: "same-UTC-day, non-domestic, decision == ALLOWED attempts across every Device of the account; blocked attempts never contribute to any later subtotal"
    constants:
      COUNTRY_RATE_CENTS_PER_MIN: { "44": 12, "53": 60, "234": 95, "252": 140 }
      DEFAULT_RATE_CENTS_PER_MIN: 75
      MIN_BILLABLE_MINUTES: 1
      SURCHARGE_TIERS:
        - { min_subtotal_cents: 0, pct: 0 }
        - { min_subtotal_cents: 2000, pct: 5 }
        - { min_subtotal_cents: 5000, pct: 12 }
    precision: "whole cents; exactly one round_half_up, applied to the surcharge only, never to the base"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a role declared in §1.7; X-User-ID is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when the acting role is AccountAdmin, X-User-ID equals the Account.id that owns the addressed resource (Account itself, Device.account_id, PhoneNumber.assigned_account_id, NumberReservation.account_id, PortRequest.account_id, E911Registration.account_id, FeeAssessment.account_id); the check runs before any body parsing"
    error_id: ERR_ACCOUNT_FORBIDDEN
    http_status: 403
    applies_to: "every endpoint whose roles list includes AccountAdmin"

  - priority: 4
    category: business_constraint
    check: "every required input field is present, of the declared JSON type, and inside its declared constraint (enum membership, length, charset, numeric range, ISO-8601 instant syntax, YYYY-MM period syntax, non-empty array)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 6
    category: existence
    check: "every referenced Account id resolves, evaluated left-to-right (path segment before body field)"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /voip/accounts/{id}, POST /voip/port-requests, POST /voip/number-reservations, POST /voip/devices, POST /voip/fee-assessments"

  - priority: 7
    category: existence
    check: "every referenced Device id resolves"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /voip/devices/{id}, POST /voip/devices/{id}/network-reports, POST /voip/devices/{id}/call-attempts, GET /voip/devices/{id}/call-attempts, POST /voip/devices/{id}/calling-restrictions, POST /voip/e911-registrations"

  - priority: 8
    category: existence
    check: "every referenced PortRequest id resolves"
    error_id: ERR_PORT_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /voip/port-requests/{id} and every POST under /voip/port-requests/{id}/, plus POST /voip/temporary-bridges"

  - priority: 9
    category: existence
    check: "every other referenced id resolves - Carrier, Jurisdiction, NumberBlock, PhoneNumber, NumberReservation, CutoverSlot, TemporaryBridge, E911Registration, FeeAssessment"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 10
    category: state
    check: "the owning Account.status == ACTIVE"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /voip/port-requests, POST /voip/number-reservations, POST /voip/devices, POST /voip/e911-registrations, POST /voip/devices/{id}/call-attempts"

  - priority: 11
    category: state
    check: "the PortRequest is in a status from which the requested trigger is declared in state_machines.PortRequest - csr-snapshots requires SUBMITTED, resubmit requires CSR_MISMATCH or REJECTED, cancel requires REJECTED, complete-cutover requires SCHEDULED or BRIDGED, reject requires SCHEDULED"
    error_id: ERR_PORT_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /voip/port-requests/{id}/csr-snapshots, .../resubmit, .../reject, .../cancel, .../complete-cutover"

  - priority: 12
    category: state
    check: "scheduling requires PortRequest.status == VALIDATED; any other status is refused before the cutover window is examined at all"
    error_id: ERR_PORT_REQUEST_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /voip/port-requests/{id}/schedule"

  - priority: 13
    category: state
    check: "resubmission from REJECTED requires last_rejection_code to be resubmittable - CSR_MISMATCH, PIN_INVALID, ACCOUNT_NOT_FOUND and PENDING_BALANCE are; NUMBER_NOT_PORTABLE and DUPLICATE_REQUEST are terminal rejection reasons"
    error_id: ERR_REJECTION_NOT_RESUBMITTABLE
    http_status: 409
    applies_to: "POST /voip/port-requests/{id}/resubmit"

  - priority: 14
    category: state
    check: "the named CutoverSlot.status == OPEN"
    error_id: ERR_SLOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /voip/port-requests/{id}/schedule"

  - priority: 15
    category: state
    check: "bridging requires PortRequest.status == SCHEDULED and a CutoverSlot whose booked_port_request_id is that request and whose status == BOOKED"
    error_id: ERR_BRIDGE_SLOT_NOT_BOOKED
    http_status: 409
    applies_to: "POST /voip/temporary-bridges"

  - priority: 16
    category: state
    check: "the TemporaryBridge.status == PROVISIONED"
    error_id: ERR_BRIDGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /voip/temporary-bridges/{id}/activate"

  - priority: 17
    category: state
    check: "the PhoneNumber is in a status the operation accepts - release requires ASSIGNED; a reservation requires AVAILABLE or RESERVED (an already-RESERVED number may take a further hold over a disjoint interval, adjudicated at priority 48) and never ASSIGNED or PARKED; device assignment requires AVAILABLE or a RESERVED number held for the same account"
    error_id: ERR_PHONE_NUMBER_STATE_INVALID
    http_status: 409
    applies_to: "POST /voip/phone-numbers/{id}/release, POST /voip/number-reservations, POST /voip/devices"

  - priority: 18
    category: state
    check: "the NumberReservation.status == HELD"
    error_id: ERR_RESERVATION_NOT_HELD
    http_status: 409
    applies_to: "POST /voip/number-reservations/{id}/release, POST /voip/temporary-bridges, POST /voip/devices"

  - priority: 19
    category: state
    check: "the E911Registration.verification_status is UNVERIFIED or STALE; VERIFIED, REJECTED and SUPERSEDED rows are not verifiable"
    error_id: ERR_REGISTRATION_NOT_VERIFIABLE
    http_status: 409
    applies_to: "POST /voip/e911-registrations/{id}/verify"

  - priority: 20
    category: state
    check: "the FeeAssessment.status == ASSESSED"
    error_id: ERR_ASSESSMENT_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /voip/fee-assessments/{id}/void"

  - priority: 21
    category: state
    check: "expected_port_request_version equals the PortRequest's current version (concurrency_rules.csr-snapshot-create-stale-port-request)"
    error_id: ERR_STALE_PORT_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /voip/port-requests/{id}/csr-snapshots"

  - priority: 22
    category: state
    check: "expected_number_block_version equals the NumberBlock's current version (concurrency_rules.reservation-create-stale-number-block)"
    error_id: ERR_STALE_NUMBER_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /voip/number-reservations"

  - priority: 23
    category: business_safety
    check: "Device.calling_status != FULL_BLOCKED"
    error_id: ERR_DEVICE_CALLING_BLOCKED
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 24
    category: business_safety
    check: "Device.registration_status != SUSPENDED_911; a device whose dispatchable location was rejected may not place any call, domestic or international"
    error_id: ERR_DEVICE_911_SUSPENDED
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 25
    category: business_safety
    check: "the owning Account.e911_compliance_posture != BLOCKED"
    error_id: ERR_ACCOUNT_E911_BLOCKED
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts, POST /voip/number-reservations"

  - priority: 26
    category: business_safety
    check: "a device that holds a PhoneNumber has a current E911Registration in VERIFIED or STALE status; PENDING_REGISTRATION and ADDRESS_UNVERIFIED devices with a number may not place calls"
    error_id: ERR_E911_REGISTRATION_REQUIRED
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 27
    category: business_safety
    check: "a network report whose drift class is INTRA_JURISDICTION or CROSS_JURISDICTION is refused when Device.nomadic == false, and nothing at all is mutated"
    error_id: ERR_NON_NOMADIC_DEVICE_RELOCATION
    http_status: 409
    applies_to: "POST /voip/devices/{id}/network-reports"

  - priority: 28
    category: business_safety
    check: "REVIEW_UNBLOCK requires the device's DAILY_REVIEW risk score < FRAUD_BLOCK_THRESHOLD and a current E911Registration in VERIFIED status"
    error_id: ERR_UNBLOCK_REVIEW_SCORE_TOO_HIGH
    http_status: 409
    applies_to: "POST /voip/devices/{id}/calling-restrictions"

  - priority: 29
    category: business_referential
    check: "segregation of duties by X-User-ID - the CarrierLiaison posting a CSR snapshot or rejecting a port request must not be the user recorded on the port request's own creation, and the BillingAdmin voiding a FeeAssessment must not equal its assessed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /voip/port-requests/{id}/csr-snapshots, POST /voip/port-requests/{id}/reject, POST /voip/fee-assessments/{id}/void"

  - priority: 30
    category: business_referential
    check: "CutoverSlot.carrier_id equals PortRequest.losing_carrier_id"
    error_id: ERR_SLOT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /voip/port-requests/{id}/schedule"

  - priority: 31
    category: business_referential
    check: "the consumed NumberReservation.account_id equals the consuming PortRequest's or Device's account_id"
    error_id: ERR_RESERVATION_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /voip/temporary-bridges, POST /voip/devices"

  - priority: 32
    category: business_referential
    check: "the consumed reservation's purpose matches its consumer - PORT_BRIDGE for a TemporaryBridge, NEW_LINE for a Device"
    error_id: ERR_RESERVATION_PURPOSE_INVALID
    http_status: 422
    applies_to: "POST /voip/temporary-bridges, POST /voip/devices"

  - priority: 33
    category: business_referential
    check: "E911Registration.state_code equals the named Jurisdiction.state_code, and a FeeAssessment's jurisdiction must have at least one registration of that account"
    error_id: ERR_JURISDICTION_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /voip/e911-registrations"

  - priority: 34
    category: business_constraint
    check: "uniqueness of natural keys - Account.account_number, Carrier.ocn, (Jurisdiction.state_code, county_fips), NumberBlock.npa_nxx, (PhoneNumber.block_id, line_number), Device.mac_address"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /voip/accounts, POST /voip/carriers, POST /voip/jurisdictions, POST /voip/number-blocks, POST /voip/number-blocks/{id}/phone-numbers, POST /voip/devices"

  - priority: 35
    category: business_constraint
    check: "no other PortRequest of the same account is in a non-terminal status (SUBMITTED, CSR_MISMATCH, VALIDATED, SCHEDULED, BRIDGED, REJECTED) sharing any E.164 string with requested_numbers"
    error_id: ERR_ACTIVE_PORT_REQUEST_EXISTS
    http_status: 409
    applies_to: "POST /voip/port-requests"

  - priority: 36
    category: business_constraint
    check: "resubmission_count < PORT_RESUBMISSION_LIMIT (2); the third resubmission attempt is refused and the request stays where it was"
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /voip/port-requests/{id}/resubmit"

  - priority: 37
    category: business_constraint
    check: "no other FeeAssessment exists for the same (account_id, jurisdiction_id, period_month) with status == ASSESSED"
    error_id: ERR_DUPLICATE_PROVISIONAL_ASSESSMENT
    http_status: 409
    applies_to: "POST /voip/fee-assessments"

  - priority: 38
    category: business_constraint
    check: "the (account_id, jurisdiction_id, period_month) triple has no REMITTED assessment already; a remitted period is closed to further assessment and to voiding"
    error_id: ERR_ASSESSMENT_PERIOD_ALREADY_REMITTED
    http_status: 409
    applies_to: "POST /voip/fee-assessments"

  - priority: 39
    category: business_temporal
    check: "window_end > window_start and the window length in minutes is within MIN_WINDOW_MINUTES..MAX_WINDOW_MINUTES (60..480)"
    error_id: ERR_CUTOVER_WINDOW_LENGTH_INVALID
    http_status: 422
    applies_to: "POST /voip/cutover-slots"

  - priority: 40
    category: business_temporal
    check: "the buffer-expanded candidate window does not overlap any OPEN or BOOKED slot of the same carrier per calculations.cutover_slot_overlap"
    error_id: ERR_CUTOVER_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /voip/cutover-slots"

  - priority: 41
    category: business_temporal
    check: "the chosen slot's window_start >= PortRequest.earliest_cutover_at as computed by calculations.earliest_cutover_floor"
    error_id: ERR_CUTOVER_BEFORE_FOC
    http_status: 422
    applies_to: "POST /voip/port-requests/{id}/schedule"

  - priority: 42
    category: business_temporal
    check: "the logical clock is inside the booked slot's half-open window [window_start, window_end)"
    error_id: ERR_BRIDGE_ACTIVATION_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /voip/temporary-bridges/{id}/activate"

  - priority: 43
    category: business_temporal
    check: "reserved_until >= reserved_from and the closed interval spans at most RESERVATION_MAX_DAYS (45) days"
    error_id: ERR_RESERVATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /voip/number-reservations"

  - priority: 44
    category: business_temporal
    check: "period_month is strictly before the clock's own YYYY-MM and the clock's day-of-month >= Jurisdiction.remit_day_of_month"
    error_id: ERR_REMITTANCE_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /voip/jurisdictions/{id}/remittance-runs"

  - priority: 45
    category: business_constraint
    check: "the count of HELD reservations of the block whose closed interval intersects the candidate interval, plus this one, is <= NumberBlock.max_concurrent_reservations (calculations.reservation_interval_capacity)"
    error_id: ERR_BLOCK_RESERVATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /voip/number-reservations"

  - priority: 46
    category: business_constraint
    check: "NumberBlock.minted_count < total_capacity"
    error_id: ERR_BLOCK_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /voip/number-blocks/{id}/phone-numbers"

  - priority: 47
    category: business_constraint
    check: "when number_id is omitted, calculations.reservation_number_selector finds at least one AVAILABLE number in the block"
    error_id: ERR_NO_NUMBERS_AVAILABLE
    http_status: 409
    applies_to: "POST /voip/number-reservations"

  - priority: 48
    category: business_constraint
    check: "the selected number has no other HELD reservation whose closed interval intersects the candidate interval"
    error_id: ERR_NUMBER_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /voip/number-reservations"

  - priority: 49
    category: business_safety
    check: "for a destination_country_code != '1', the owning Account.intl_calling_enabled == true"
    error_id: ERR_INTL_CALLING_DISABLED
    http_status: 403
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 50
    category: business_safety
    check: "for a destination_country_code != '1', Device.calling_status != INTL_BLOCKED"
    error_id: ERR_INTL_BLOCKED_ON_DEVICE
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 51
    category: business_safety
    check: "the REALTIME risk score of calculations.toll_fraud_risk_score, computed with this attempt counted, is < FRAUD_BLOCK_THRESHOLD (60)"
    error_id: ERR_TOLL_FRAUD_THRESHOLD_BREACHED
    http_status: 409
    applies_to: "POST /voip/devices/{id}/call-attempts"

  - priority: 52
    category: business_constraint
    check: "calculations.e911_fee_assessment selects at least one billable unit"
    error_id: ERR_NO_BILLABLE_UNITS
    http_status: 422
    applies_to: "POST /voip/fee-assessments"

  - priority: 53
    category: business_fiscal
    check: "projected_day_total_cents <= Account.intl_daily_cap_cents per calculations.international_spend_control; the fiscal ceiling is the very last check, so every safety refusal above outranks it"
    error_id: ERR_INTL_SPEND_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /voip/devices/{id}/call-attempts"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, window, proration anchor and risk window in this domain reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "the logical clock used by every subsequent request is set to current_utc"
      - "no entity is mutated and no recomputation is triggered by the clock move itself"

  - method: POST
    path: "/voip/accounts"
    description: "Registers an Ooma billing account."
    roles: [PlatformAdmin]
    code: 201
    input: [account_number, billing_name, service_state_code, "status?", "intl_calling_enabled?", "intl_daily_cap_cents?"]
    output: Account
    side_effects:
      - "e911_compliance_posture initialised to COMPLIANT (vacuously, the account has no devices)"
      - "fee_liability_cents and ported_number_count initialised to 0"

  - method: GET
    path: "/voip/accounts/{id}"
    description: "Reads one account including its derived posture and fee liability."
    roles: [PlatformAdmin, BillingAdmin, SecurityAnalyst, AccountAdmin]
    code: 200
    output: Account
    side_effects: []

  - method: POST
    path: "/voip/carriers"
    description: "Registers a losing carrier with its CSR match policy, porting buffer and FOC interval."
    roles: [PlatformAdmin]
    code: 201
    input: [name, ocn, csr_match_policy, porting_buffer_minutes, foc_business_days]
    output: Carrier
    side_effects:
      - "immutable once created; the entity carries no version field and has no update endpoint"

  - method: GET
    path: "/voip/carriers/{id}"
    description: "Reads one carrier."
    roles: [PlatformAdmin, PortingSpecialist, CarrierLiaison]
    code: 200
    output: Carrier
    side_effects: []

  - method: POST
    path: "/voip/jurisdictions"
    description: "Registers a 911 taxing jurisdiction and its monthly fee basis."
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, county_fips, fee_type, monthly_fee_cents, remit_day_of_month]
    output: Jurisdiction
    side_effects:
      - "pending_fee_cents and remitted_fee_cents initialised to 0; last_remitted_period initialised to null"

  - method: GET
    path: "/voip/jurisdictions/{id}"
    description: "Reads one jurisdiction including its fee ledger counters."
    roles: [PlatformAdmin, BillingAdmin, E911Validator]
    code: 200
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/voip/jurisdictions/{id}/remittance-runs"
    description: "Closes one period for this jurisdiction: voids every ASSESSED PROVISIONAL row of the period, writes a FINAL assessment per affected account, and remits it."
    roles: [BillingAdmin]
    code: 200
    input: [period_month]
    output: Jurisdiction
    side_effects:
      - "every FeeAssessment of the jurisdiction with this period_month, variant PROVISIONAL and status ASSESSED transitions to VOIDED with voided_by_user_id 'system:remittance'"
      - "for each account that had at least one billable unit, a FeeAssessment with variant FINAL is created via the FINAL branch of calculations.e911_fee_assessment and immediately transitions ASSESSED -> REMITTED with remitted_at set to the clock"
      - "recomputes calculations.fee_ledger_reconciliation for the jurisdiction and every touched account"
      - "sets last_remitted_period to period_month"

  - method: POST
    path: "/voip/number-blocks"
    description: "Creates an empty NPA-NXX inventory block inside a jurisdiction."
    roles: [NumberingAdmin]
    code: 201
    input: [jurisdiction_id, npa_nxx, total_capacity, max_concurrent_reservations]
    output: NumberBlock
    side_effects:
      - "all five census counters initialised to 0, satisfying calculations.number_inventory_census trivially"

  - method: GET
    path: "/voip/number-blocks/{id}"
    description: "Reads one block including its census counters and version."
    roles: [NumberingAdmin, PlatformAdmin, PortingSpecialist]
    code: 200
    output: NumberBlock
    side_effects: []

  - method: GET
    path: "/voip/number-blocks"
    description: "Lists blocks, optionally filtered by jurisdiction."
    roles: [NumberingAdmin, PlatformAdmin]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: NumberBlock[]
    side_effects: []

  - method: POST
    path: "/voip/number-blocks/{id}/phone-numbers"
    description: "Mints one phone number into the block."
    roles: [NumberingAdmin]
    code: 201
    input: [line_number]
    output: PhoneNumber
    side_effects:
      - "e164 derived as '+1' + block.npa_nxx + line_number"
      - "status set to AVAILABLE; increments the block's minted_count and available_count by 1"
      - "increments NumberBlock.version by 1"
      - "recomputes calculations.number_inventory_census for the block"

  - method: GET
    path: "/voip/phone-numbers/{id}"
    description: "Reads one phone number including its inventory status and park state."
    roles: [NumberingAdmin, PlatformAdmin, PortingSpecialist]
    code: 200
    output: PhoneNumber
    side_effects: []

  - method: GET
    path: "/voip/phone-numbers"
    description: "Lists phone numbers by block, holding account or status."
    roles: [NumberingAdmin, PlatformAdmin]
    code: 200
    input: ["block_id?", "assigned_account_id?", "status?", "limit?", "offset?"]
    output: PhoneNumber[]
    side_effects: []

  - method: POST
    path: "/voip/phone-numbers/{id}/release"
    description: "Releases an ASSIGNED number from its device, parking it for the cooling-off period."
    roles: [NumberingAdmin]
    code: 200
    input: []
    output: PhoneNumber
    side_effects:
      - "status ASSIGNED -> PARKED; parked_until set to clock + NUMBER_PARK_HOURS (168); park_cycle_count incremented"
      - "assigned_account_id cleared; the holding Device's assigned_number_id cleared"
      - "moves one unit from the block's assigned_count to its parked_count and increments NumberBlock.version by 1"
      - "recomputes calculations.number_inventory_census and calculations.account_e911_posture for the former holder"

  - method: POST
    path: "/voip/number-blocks/{id}/reclamation-runs"
    description: "Reclaims every PARKED number of the block whose parked_until has elapsed and expires every HELD reservation whose reserved_until is past."
    roles: [NumberingAdmin]
    code: 200
    input: []
    output: NumberBlock
    side_effects:
      - "each PARKED number with parked_until <= clock transitions PARKED -> AVAILABLE, processed in line_number ASC order then created_at ASC"
      - "each HELD NumberReservation of the block with reserved_until < clock transitions HELD -> EXPIRED and returns its RESERVED number to AVAILABLE"
      - "increments NumberBlock.version by 1 and recomputes calculations.number_inventory_census"

  - method: POST
    path: "/voip/number-reservations"
    description: "Holds one number out of a block for an account over a closed date interval. Omitting number_id delegates selection to calculations.reservation_number_selector."
    roles: [NumberingAdmin]
    code: 201
    input: [block_id, account_id, purpose, reserved_from, reserved_until, expected_number_block_version, "number_id?"]
    output: NumberReservation
    side_effects:
      - "runs calculations.reservation_interval_capacity and calculations.reservation_number_selector in the pinned order"
      - "the selected PhoneNumber transitions AVAILABLE -> RESERVED; the block's available_count drops and reserved_count rises by 1"
      - "increments NumberBlock.version by 1"
      - "recomputes calculations.number_inventory_census for the block"

  - method: GET
    path: "/voip/number-reservations/{id}"
    description: "Reads one reservation."
    roles: [NumberingAdmin, PortingSpecialist, PlatformAdmin]
    code: 200
    output: NumberReservation
    side_effects: []

  - method: GET
    path: "/voip/number-reservations"
    description: "Lists reservations by number, block, account or status."
    roles: [NumberingAdmin, PortingSpecialist, PlatformAdmin]
    code: 200
    input: ["number_id?", "block_id?", "account_id?", "status?", "limit?", "offset?"]
    output: NumberReservation[]
    side_effects: []

  - method: POST
    path: "/voip/number-reservations/{id}/release"
    description: "Releases a HELD reservation, returning its number to the available pool."
    roles: [NumberingAdmin]
    code: 200
    input: []
    output: NumberReservation
    side_effects:
      - "status HELD -> RELEASED with released_reason MANUAL"
      - "the held PhoneNumber transitions RESERVED -> AVAILABLE, but only when no other HELD reservation of that same number remains; otherwise it stays RESERVED"
      - "increments NumberBlock.version by 1 and restores the block's available_count and reserved_count to their pre-reservation values per calculations.number_inventory_census"

  - method: POST
    path: "/voip/port-requests"
    description: "Files a port-in request against a losing carrier with the subscriber's claimed CSR data."
    roles: [PortingSpecialist, AccountAdmin]
    code: 201
    input: [account_id, losing_carrier_id, requested_numbers, claimed_account_number, claimed_pin, claimed_billing_name, claimed_address_line1, claimed_zip]
    output: PortRequest
    side_effects:
      - "status initialised to SUBMITTED; resubmission_count 0; last_match_points, last_rejection_code, validated_at and earliest_cutover_at all null"
      - "the acting X-User-ID is stored in created_by_user_id as the filing user for the segregation-of-duties check at priority 29"

  - method: GET
    path: "/voip/port-requests/{id}"
    description: "Reads one port request including its CSR evaluation echo and FOC floor."
    roles: [PortingSpecialist, CarrierLiaison, PlatformAdmin, AccountAdmin]
    code: 200
    output: PortRequest
    side_effects: []

  - method: GET
    path: "/voip/port-requests"
    description: "Lists port requests by account, losing carrier or status."
    roles: [PortingSpecialist, CarrierLiaison, PlatformAdmin]
    code: 200
    input: ["account_id?", "losing_carrier_id?", "status?", "limit?", "offset?"]
    output: PortRequest[]
    side_effects: []

  - method: POST
    path: "/voip/port-requests/{id}/csr-snapshots"
    description: "Posts the losing carrier's customer service record for comparison against the subscriber's claim. Optimistically concurrent on the port request's version."
    roles: [CarrierLiaison]
    code: 201
    input: [account_number_on_file, pin_on_file, billing_name_on_file, address_line1_on_file, zip_on_file, expected_port_request_version]
    output: CarrierAccountSnapshot
    side_effects:
      - "runs calculations.csr_match_evaluation, storing match_points, threshold_applied, match_status and mismatch_fields on the snapshot"
      - "any previous snapshot of this request gets superseded_at set to the clock"
      - "PortRequest.status SUBMITTED -> VALIDATED when match_status == MATCHED, setting validated_at to the clock and earliest_cutover_at per calculations.earliest_cutover_floor; SUBMITTED -> CSR_MISMATCH otherwise"
      - "copies match_points to PortRequest.last_match_points and mismatch_fields to last_mismatch_fields"
      - "increments PortRequest.version by 1"

  - method: GET
    path: "/voip/port-requests/{id}/csr-snapshots"
    description: "Lists every CSR snapshot ever posted against this port request, newest first, including superseded rows."
    roles: [PortingSpecialist, CarrierLiaison, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CarrierAccountSnapshot[]
    side_effects: []

  - method: POST
    path: "/voip/port-requests/{id}/resubmit"
    description: "Corrects the subscriber's claimed CSR data and returns the request to SUBMITTED for another carrier comparison."
    roles: [PortingSpecialist, AccountAdmin]
    code: 200
    input: [claimed_account_number, claimed_pin, claimed_billing_name, claimed_address_line1, claimed_zip]
    output: PortRequest
    side_effects:
      - "status CSR_MISMATCH -> SUBMITTED or REJECTED -> SUBMITTED; resubmission_count incremented"
      - "every non-superseded CarrierAccountSnapshot of the request gets superseded_at set to the clock"
      - "last_match_points reset to null, last_mismatch_fields reset to the empty array, validated_at and earliest_cutover_at reset to null"
      - "increments PortRequest.version by 1"

  - method: POST
    path: "/voip/port-requests/{id}/reject"
    description: "Records a losing-carrier rejection of a scheduled port, unwinding the cutover booking and every downstream hold."
    roles: [CarrierLiaison]
    code: 200
    input: [reason_code, "note?"]
    output: PortRequest
    side_effects:
      - "status SCHEDULED -> REJECTED; last_rejection_code set to reason_code"
      - "the booked CutoverSlot transitions BOOKED -> RELEASED"
      - "every TemporaryBridge of this request in PROVISIONED or ACTIVE transitions to ORPHANED with released_at set to the clock"
      - "each orphaned bridge's NumberReservation transitions CONSUMED -> RELEASED with released_reason BRIDGE_ORPHANED, and its PhoneNumber transitions RESERVED -> PARKED with parked_until = clock + NUMBER_PARK_HOURS"
      - "recomputes calculations.number_inventory_census for every affected block and increments each NumberBlock.version by 1"
      - "increments PortRequest.version by 1"

  - method: POST
    path: "/voip/port-requests/{id}/cancel"
    description: "Cancels a rejected port request, closing it permanently."
    roles: [PortingSpecialist, AccountAdmin]
    code: 200
    input: ["reason_note?"]
    output: PortRequest
    side_effects:
      - "status REJECTED -> CANCELLED, a terminal state"
      - "any TemporaryBridge still in PROVISIONED or ACTIVE transitions to ORPHANED and its reservation and number unwind exactly as on reject"
      - "increments PortRequest.version by 1"

  - method: POST
    path: "/voip/port-requests/{id}/schedule"
    description: "Books an OPEN cutover slot for a VALIDATED port request, subject to the carrier's FOC floor."
    roles: [PortingSpecialist]
    code: 200
    input: [cutover_slot_id]
    output: PortRequest
    side_effects:
      - "status VALIDATED -> SCHEDULED"
      - "the named CutoverSlot transitions OPEN -> BOOKED with booked_port_request_id set to this request and booked_at set to the clock"
      - "increments PortRequest.version by 1"

  - method: POST
    path: "/voip/port-requests/{id}/complete-cutover"
    description: "Completes the cutover, consuming the slot, releasing any bridge and returning the bridge number to the pool."
    roles: [PortingSpecialist]
    code: 200
    input: []
    output: PortRequest
    side_effects:
      - "status SCHEDULED -> COMPLETED or BRIDGED -> COMPLETED, a terminal state"
      - "the booked CutoverSlot transitions BOOKED -> CONSUMED"
      - "any ACTIVE TemporaryBridge transitions ACTIVE -> RELEASED with released_at set to the clock"
      - "the bridge's NumberReservation transitions CONSUMED -> RELEASED with released_reason CUTOVER_COMPLETED and its PhoneNumber transitions RESERVED -> AVAILABLE"
      - "Account.ported_number_count increased by the length of requested_numbers"
      - "increments PortRequest.version and the affected NumberBlock.version by 1 each"

  - method: POST
    path: "/voip/cutover-slots"
    description: "Opens a cutover window on a carrier's porting calendar. The candidate window is expanded by the carrier's porting_buffer_minutes on both sides before the overlap test."
    roles: [PortingSpecialist]
    code: 201
    input: [carrier_id, window_start, window_end]
    output: CutoverSlot
    side_effects:
      - "runs calculations.cutover_slot_overlap against every OPEN or BOOKED slot of the same carrier"
      - "status initialised to OPEN with booked_port_request_id and booked_at null"

  - method: GET
    path: "/voip/cutover-slots/{id}"
    description: "Reads one cutover slot."
    roles: [PortingSpecialist, CarrierLiaison, PlatformAdmin]
    code: 200
    output: CutoverSlot
    side_effects: []

  - method: GET
    path: "/voip/cutover-slots"
    description: "Lists cutover slots by carrier, booked port request or status."
    roles: [PortingSpecialist, CarrierLiaison, PlatformAdmin]
    code: 200
    input: ["carrier_id?", "booked_port_request_id?", "status?", "limit?", "offset?"]
    output: CutoverSlot[]
    side_effects: []

  - method: POST
    path: "/voip/temporary-bridges"
    description: "Provisions a temporary bridging number for a scheduled port, consuming a PORT_BRIDGE reservation."
    roles: [PortingSpecialist]
    code: 201
    input: [port_request_id, reservation_id]
    output: TemporaryBridge
    side_effects:
      - "bridge_number_id copied from the consumed reservation's number_id"
      - "the NumberReservation transitions HELD -> CONSUMED"
      - "status initialised to PROVISIONED"

  - method: POST
    path: "/voip/temporary-bridges/{id}/activate"
    description: "Activates a provisioned bridge; only permitted while the logical clock sits inside the booked cutover window."
    roles: [PortingSpecialist]
    code: 200
    input: []
    output: TemporaryBridge
    side_effects:
      - "status PROVISIONED -> ACTIVE with activated_at set to the clock"
      - "the PortRequest transitions SCHEDULED -> BRIDGED and its version increments by 1"

  - method: GET
    path: "/voip/temporary-bridges/{id}"
    description: "Reads one temporary bridge."
    roles: [PortingSpecialist, PlatformAdmin]
    code: 200
    output: TemporaryBridge
    side_effects: []

  - method: GET
    path: "/voip/temporary-bridges"
    description: "Lists temporary bridges by port request, consumed reservation or bridge number."
    roles: [PortingSpecialist, PlatformAdmin]
    code: 200
    input: ["port_request_id?", "reservation_id?", "bridge_number_id?", "status?", "limit?", "offset?"]
    output: TemporaryBridge[]
    side_effects: []

  - method: POST
    path: "/voip/devices"
    description: "Registers an endpoint device on an account, optionally taking a phone number immediately. AccountAdmin must act as the owning account."
    roles: [AccountAdmin, PlatformAdmin]
    code: 201
    input: [account_id, mac_address, device_type, "nomadic?", "assigned_number_id?"]
    output: Device
    side_effects:
      - "registration_status initialised to PENDING_REGISTRATION and calling_status to UNRESTRICTED"
      - "registration_prompt_deadline set to created_at + E911_PROMPT_GRACE_HOURS (72)"
      - "when assigned_number_id is supplied, that PhoneNumber transitions AVAILABLE -> ASSIGNED or RESERVED -> ASSIGNED, its assigned_account_id is set, any HELD NEW_LINE reservation on it transitions HELD -> CONSUMED, the block census is recomputed and NumberBlock.version increments by 1"
      - "recomputes calculations.account_e911_posture for the owning account, which may cascade the account COMPLIANT -> AT_RISK and every UNRESTRICTED device of the account to INTL_BLOCKED"

  - method: GET
    path: "/voip/devices/{id}"
    description: "Reads one device including both state dimensions and its newest risk score."
    roles: [AccountAdmin, SecurityAnalyst, E911Validator, PlatformAdmin]
    code: 200
    output: Device
    side_effects: []

  - method: GET
    path: "/voip/devices"
    description: "Lists devices by account or by held number."
    roles: [SecurityAnalyst, E911Validator, PlatformAdmin]
    code: 200
    input: ["account_id?", "assigned_number_id?", "registration_status?", "calling_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: POST
    path: "/voip/devices/{id}/network-reports"
    description: "Reports the network location the device is currently seen at, driving relocation detection and address re-verification."
    roles: [AccountAdmin, PlatformAdmin]
    code: 200
    input: [reported_state_code, reported_postal_code]
    output: Device
    side_effects:
      - "runs calculations.relocation_drift_class"
      - "reported_state_code, reported_postal_code and last_network_report_at are stored on the device"
      - "an INTRA_JURISDICTION drift moves registration_status REGISTERED -> ADDRESS_UNVERIFIED; a CROSS_JURISDICTION drift moves it REGISTERED -> RELOCATION_DETECTED"
      - "a VERIFIED current E911Registration transitions VERIFIED -> STALE on either drift class"
      - "recomputes calculations.account_e911_posture, which may cascade the account to AT_RISK and every UNRESTRICTED device of that account to INTL_BLOCKED"
      - "increments Device.version by 1"

  - method: POST
    path: "/voip/devices/{id}/call-attempts"
    description: "Places a call attempt through the E911, fraud and international spend gates. A CallAttempt row is persisted with its decision whether the call is allowed or refused."
    roles: [AccountAdmin, PlatformAdmin]
    code: 201
    input: [destination_e164, destination_country_code, requested_duration_seconds]
    output: CallAttempt
    side_effects:
      - "runs the REALTIME variant of calculations.toll_fraud_risk_score and, for non-domestic destinations, calculations.international_spend_control"
      - "persists billable_minutes, rate_cents_per_minute, estimated_base_cents, day_subtotal_cents, surcharge_pct_applied, projected_day_total_cents, realtime_risk_score, decision and decision_error_id"
      - "copies realtime_risk_score to Device.toll_fraud_score"
      - "a BLOCKED_FRAUD decision increments Device.fraud_block_count, moves calling_status UNRESTRICTED -> INTL_BLOCKED, and on reaching FRAUD_FULL_BLOCK_COUNT (3) moves INTL_BLOCKED -> FULL_BLOCKED"
      - "immutable row: CallAttempt carries no version field and has no update endpoint"

  - method: GET
    path: "/voip/devices/{id}/call-attempts"
    description: "Lists every call attempt of the device, newest first, including refused ones with their decision and decision_error_id."
    roles: [AccountAdmin, SecurityAnalyst, PlatformAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: CallAttempt[]
    side_effects: []

  - method: POST
    path: "/voip/devices/{id}/calling-restrictions"
    description: "Applies or lifts a calling restriction. REVIEW_UNBLOCK runs the DAILY_REVIEW variant of the fraud score and requires a currently VERIFIED dispatchable location."
    roles: [SecurityAnalyst]
    code: 200
    input: [action, "note?"]
    output: Device
    side_effects:
      - "BLOCK_INTL moves calling_status UNRESTRICTED -> INTL_BLOCKED; BLOCK_ALL moves UNRESTRICTED -> FULL_BLOCKED"
      - "REVIEW_UNBLOCK moves INTL_BLOCKED -> UNRESTRICTED only when the DAILY_REVIEW score is below FRAUD_BLOCK_THRESHOLD and the device's current E911Registration is VERIFIED"
      - "stores the DAILY_REVIEW score in Device.toll_fraud_score"
      - "increments Device.version by 1"

  - method: POST
    path: "/voip/e911-registrations"
    description: "Captures a dispatchable location for a device, superseding any previous registration of that device."
    roles: [AccountAdmin, PlatformAdmin]
    code: 201
    input: [device_id, jurisdiction_id, address_line1, "unit?", city, state_code, postal_code]
    output: E911Registration
    side_effects:
      - "account_id copied from the device; effective_from set to the clock; normalized_location_key derived; verification_status initialised to UNVERIFIED"
      - "any prior registration of the device in VERIFIED, STALE or REJECTED transitions to SUPERSEDED with superseded_at set to the clock"
      - "device registration_status moves PENDING_REGISTRATION -> ADDRESS_UNVERIFIED, RELOCATION_DETECTED -> ADDRESS_UNVERIFIED or SUSPENDED_911 -> ADDRESS_UNVERIFIED"
      - "recomputes calculations.account_e911_posture, which may move the account BLOCKED -> AT_RISK"

  - method: GET
    path: "/voip/e911-registrations/{id}"
    description: "Reads one dispatchable-location registration."
    roles: [AccountAdmin, E911Validator, BillingAdmin, PlatformAdmin]
    code: 200
    output: E911Registration
    side_effects: []

  - method: GET
    path: "/voip/e911-registrations"
    description: "Lists registrations by account, device, jurisdiction or verification status."
    roles: [E911Validator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["account_id?", "device_id?", "jurisdiction_id?", "verification_status?", "limit?", "offset?"]
    output: E911Registration[]
    side_effects: []

  - method: POST
    path: "/voip/e911-registrations/{id}/verify"
    description: "Records the validator's outcome on a captured or stale dispatchable location."
    roles: [E911Validator]
    code: 200
    input: [outcome, "rejection_note?"]
    output: E911Registration
    side_effects:
      - "outcome VERIFIED moves verification_status UNVERIFIED -> VERIFIED or STALE -> VERIFIED with verified_at set to the clock, and the device's registration_status ADDRESS_UNVERIFIED -> REGISTERED"
      - "outcome REJECTED moves verification_status UNVERIFIED -> REJECTED with rejection_note stored, and the device's registration_status ADDRESS_UNVERIFIED -> SUSPENDED_911"
      - "recomputes calculations.account_e911_posture, which may move the account AT_RISK -> COMPLIANT (restoring every INTL_BLOCKED device of the account to UNRESTRICTED) or AT_RISK -> BLOCKED"
      - "increments E911Registration.version and Device.version by 1 each"

  - method: POST
    path: "/voip/fee-assessments"
    description: "Assesses a mid-period PROVISIONAL 911 fee for one account in one jurisdiction."
    roles: [BillingAdmin]
    code: 201
    input: [account_id, jurisdiction_id, period_month]
    output: FeeAssessment
    side_effects:
      - "runs the PROVISIONAL branch of calculations.e911_fee_assessment, storing unit_basis, billable_units, unit_fee_breakdown and amount_cents"
      - "variant set to PROVISIONAL; status initialised to ASSESSED; assessed_by_user_id set to the acting X-User-ID"
      - "recomputes calculations.fee_ledger_reconciliation, raising Jurisdiction.pending_fee_cents and Account.fee_liability_cents by amount_cents"

  - method: POST
    path: "/voip/fee-assessments/{id}/void"
    description: "Voids an assessed fee. The voiding BillingAdmin must differ from the assessing one."
    roles: [BillingAdmin]
    code: 200
    input: ["void_note?"]
    output: FeeAssessment
    side_effects:
      - "status ASSESSED -> VOIDED with voided_by_user_id set to the acting X-User-ID"
      - "recomputes calculations.fee_ledger_reconciliation, restoring Jurisdiction.pending_fee_cents and Account.fee_liability_cents to their pre-assessment cent values"
      - "increments FeeAssessment.version by 1"

  - method: GET
    path: "/voip/fee-assessments/{id}"
    description: "Reads one fee assessment including its per-unit breakdown."
    roles: [BillingAdmin, PlatformAdmin, AccountAdmin]
    code: 200
    output: FeeAssessment
    side_effects: []

  - method: GET
    path: "/voip/fee-assessments"
    description: "Lists fee assessments by account, jurisdiction, period or status."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: ["account_id?", "jurisdiction_id?", "period_month?", "status?", "variant?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role not declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not in the endpoint's roles list"
  - id: ERR_ACCOUNT_FORBIDDEN
    http: 403
    condition: "an AccountAdmin addresses a resource owned by an account other than its own X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, mistyped, or outside its declared enum/length/charset/range/ISO-8601 constraint"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "a referenced Account id does not resolve"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "a referenced Device id does not resolve"
  - id: ERR_PORT_REQUEST_NOT_FOUND
    http: 404
    condition: "a referenced PortRequest id does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a referenced Carrier, Jurisdiction, NumberBlock, PhoneNumber, NumberReservation, CutoverSlot, TemporaryBridge, E911Registration or FeeAssessment id does not resolve"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "the owning Account.status is SUSPENDED or CLOSED"
  - id: ERR_PORT_REQUEST_STATE_INVALID
    http: 409
    condition: "the requested port-request trigger is not declared from the request's current status"
  - id: ERR_PORT_REQUEST_NOT_SCHEDULABLE
    http: 409
    condition: "scheduling attempted on a port request whose status is not VALIDATED"
  - id: ERR_REJECTION_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmission attempted after a terminal rejection reason code (NUMBER_NOT_PORTABLE, DUPLICATE_REQUEST)"
  - id: ERR_SLOT_NOT_OPEN
    http: 409
    condition: "the named CutoverSlot is BOOKED, CONSUMED or RELEASED"
  - id: ERR_BRIDGE_SLOT_NOT_BOOKED
    http: 409
    condition: "bridge creation attempted while the port request is not SCHEDULED with a BOOKED slot"
  - id: ERR_BRIDGE_STATE_INVALID
    http: 409
    condition: "activation attempted on a bridge that is not PROVISIONED"
  - id: ERR_PHONE_NUMBER_STATE_INVALID
    http: 409
    condition: "the phone number is not in a status the operation accepts (release needs ASSIGNED; a reservation needs AVAILABLE or RESERVED and is refused on ASSIGNED or PARKED; device assignment needs AVAILABLE or a RESERVED hold of the same account)"
  - id: ERR_RESERVATION_NOT_HELD
    http: 409
    condition: "the reservation being released or consumed is CONSUMED, RELEASED or EXPIRED"
  - id: ERR_REGISTRATION_NOT_VERIFIABLE
    http: 409
    condition: "verification attempted on a registration that is already VERIFIED, REJECTED or SUPERSEDED"
  - id: ERR_ASSESSMENT_NOT_VOIDABLE
    http: 409
    condition: "void attempted on a FeeAssessment that is already VOIDED or REMITTED"
  - id: ERR_STALE_PORT_REQUEST_VERSION
    http: 412
    condition: "expected_port_request_version does not equal the PortRequest's current version"
  - id: ERR_STALE_NUMBER_BLOCK_VERSION
    http: 412
    condition: "expected_number_block_version does not equal the NumberBlock's current version"
  - id: ERR_DEVICE_CALLING_BLOCKED
    http: 409
    condition: "a call attempt on a device whose calling_status is FULL_BLOCKED"
  - id: ERR_DEVICE_911_SUSPENDED
    http: 409
    condition: "a call attempt on a device whose registration_status is SUSPENDED_911"
  - id: ERR_ACCOUNT_E911_BLOCKED
    http: 409
    condition: "the owning account's e911_compliance_posture is BLOCKED"
  - id: ERR_E911_REGISTRATION_REQUIRED
    http: 409
    condition: "a call attempt on a number-holding device with no current registration in VERIFIED or STALE status"
  - id: ERR_TOLL_FRAUD_THRESHOLD_BREACHED
    http: 409
    condition: "the REALTIME risk score with this attempt counted is at or above FRAUD_BLOCK_THRESHOLD (60)"
  - id: ERR_UNBLOCK_REVIEW_SCORE_TOO_HIGH
    http: 409
    condition: "REVIEW_UNBLOCK requested while the DAILY_REVIEW score is at or above 60, or while the device's current registration is not VERIFIED"
  - id: ERR_NON_NOMADIC_DEVICE_RELOCATION
    http: 409
    condition: "a network report shows INTRA_JURISDICTION or CROSS_JURISDICTION drift on a device whose nomadic flag is false"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "the same X-User-ID both filed and validated/rejected a port request, or both assessed and voided a fee"
  - id: ERR_SLOT_CARRIER_MISMATCH
    http: 422
    condition: "the chosen cutover slot belongs to a carrier other than the port request's losing carrier"
  - id: ERR_RESERVATION_ACCOUNT_MISMATCH
    http: 422
    condition: "the consumed reservation is earmarked for a different account than the consumer"
  - id: ERR_RESERVATION_PURPOSE_INVALID
    http: 422
    condition: "a NEW_LINE reservation is consumed by a bridge, or a PORT_BRIDGE reservation by a device"
  - id: ERR_JURISDICTION_STATE_MISMATCH
    http: 422
    condition: "the registration's state_code differs from the named jurisdiction's state_code"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "a natural key collides - account_number, ocn, (state_code, county_fips), npa_nxx, (block_id, line_number) or mac_address"
  - id: ERR_ACTIVE_PORT_REQUEST_EXISTS
    http: 409
    condition: "another non-terminal port request of the account already claims one of the requested E.164 numbers"
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "resubmission_count has already reached PORT_RESUBMISSION_LIMIT (2)"
  - id: ERR_DUPLICATE_PROVISIONAL_ASSESSMENT
    http: 409
    condition: "an ASSESSED assessment already exists for the same account, jurisdiction and period_month"
  - id: ERR_ASSESSMENT_PERIOD_ALREADY_REMITTED
    http: 409
    condition: "the account/jurisdiction/period triple already has a REMITTED assessment"
  - id: ERR_CUTOVER_WINDOW_LENGTH_INVALID
    http: 422
    condition: "window_end <= window_start, or the window length is under 60 or over 480 minutes"
  - id: ERR_CUTOVER_SLOT_OVERLAP
    http: 409
    condition: "the buffer-expanded candidate window overlaps an OPEN or BOOKED slot of the same carrier"
  - id: ERR_CUTOVER_BEFORE_FOC
    http: 422
    condition: "the chosen slot starts before the port request's earliest_cutover_at"
  - id: ERR_BRIDGE_ACTIVATION_OUTSIDE_WINDOW
    http: 409
    condition: "activation attempted while the clock is outside the booked slot's half-open window"
  - id: ERR_RESERVATION_WINDOW_INVALID
    http: 422
    condition: "reserved_until earlier than reserved_from, or the closed interval spans more than 45 days"
  - id: ERR_BLOCK_RESERVATION_CAPACITY_EXCEEDED
    http: 409
    condition: "intersecting HELD reservations of the block plus this one would exceed max_concurrent_reservations"
  - id: ERR_BLOCK_CAPACITY_EXHAUSTED
    http: 409
    condition: "minting attempted when minted_count already equals total_capacity"
  - id: ERR_NO_NUMBERS_AVAILABLE
    http: 409
    condition: "number_id omitted and the block has no AVAILABLE number to select"
  - id: ERR_NUMBER_RESERVATION_OVERLAP
    http: 409
    condition: "the selected number already has a HELD reservation whose closed interval intersects the candidate interval"
  - id: ERR_INTL_CALLING_DISABLED
    http: 403
    condition: "a non-domestic call attempt on an account whose intl_calling_enabled is false"
  - id: ERR_INTL_BLOCKED_ON_DEVICE
    http: 409
    condition: "a non-domestic call attempt on a device whose calling_status is INTL_BLOCKED"
  - id: ERR_INTL_SPEND_CAP_EXCEEDED
    http: 402
    condition: "projected_day_total_cents strictly exceeds the account's intl_daily_cap_cents"
  - id: ERR_NO_BILLABLE_UNITS
    http: 422
    condition: "the assessment run selects zero billable units for the account in that jurisdiction and period"
  - id: ERR_REMITTANCE_PERIOD_NOT_CLOSED
    http: 422
    condition: "the remittance period is not strictly before the clock's month, or the clock's day-of-month is earlier than the jurisdiction's remit_day_of_month"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns the logical clock and the global reference data (accounts, carriers, jurisdictions), and may read every resource in the domain."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /voip/accounts"
      - "POST /voip/carriers"
      - "POST /voip/jurisdictions"
    shared_operations:
      - "POST /voip/devices"
      - "POST /voip/devices/{id}/network-reports"
      - "POST /voip/devices/{id}/call-attempts"
      - "POST /voip/e911-registrations"
      - "every GET in the domain"

  - name: NumberingAdmin
    description: "Inventory operator; mints numbers, reserves and releases them, and runs reclamation."
    identity: opaque
    exclusive_operations:
      - "POST /voip/number-blocks"
      - "POST /voip/number-blocks/{id}/phone-numbers"
      - "POST /voip/number-blocks/{id}/reclamation-runs"
      - "POST /voip/phone-numbers/{id}/release"
      - "POST /voip/number-reservations"
      - "POST /voip/number-reservations/{id}/release"
    shared_operations:
      - "GET /voip/number-blocks, GET /voip/number-blocks/{id}, GET /voip/phone-numbers, GET /voip/phone-numbers/{id}, GET /voip/number-reservations, GET /voip/number-reservations/{id}"

  - name: PortingSpecialist
    description: "Ooma-side porting operator; files and drives port requests, opens cutover slots, provisions bridges and completes cutovers. May never post the losing carrier's CSR record nor reject a port."
    identity: opaque
    exclusive_operations:
      - "POST /voip/port-requests/{id}/schedule"
      - "POST /voip/port-requests/{id}/complete-cutover"
      - "POST /voip/cutover-slots"
      - "POST /voip/temporary-bridges"
      - "POST /voip/temporary-bridges/{id}/activate"
    shared_operations:
      - "POST /voip/port-requests"
      - "POST /voip/port-requests/{id}/resubmit"
      - "POST /voip/port-requests/{id}/cancel"
      - "GET /voip/port-requests, GET /voip/port-requests/{id}, GET /voip/port-requests/{id}/csr-snapshots, GET /voip/cutover-slots, GET /voip/cutover-slots/{id}, GET /voip/temporary-bridges, GET /voip/temporary-bridges/{id}, GET /voip/carriers/{id}, GET /voip/number-reservations, GET /voip/number-reservations/{id}, GET /voip/number-blocks/{id}, GET /voip/phone-numbers, GET /voip/phone-numbers/{id}"

  - name: CarrierLiaison
    description: "Liaison who transcribes the losing carrier's customer service record and records carrier rejections. Segregated by X-User-ID from whoever filed the port request."
    identity: opaque
    exclusive_operations:
      - "POST /voip/port-requests/{id}/csr-snapshots"
      - "POST /voip/port-requests/{id}/reject"
    shared_operations:
      - "GET /voip/port-requests, GET /voip/port-requests/{id}, GET /voip/port-requests/{id}/csr-snapshots, GET /voip/cutover-slots, GET /voip/cutover-slots/{id}, GET /voip/carriers/{id}"

  - name: AccountAdmin
    description: "Subscriber-side administrator. X-User-ID is the Account.id it acts as; every addressed resource must belong to that account."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /voip/devices"
      - "POST /voip/devices/{id}/network-reports"
      - "POST /voip/devices/{id}/call-attempts"
      - "POST /voip/e911-registrations"
      - "POST /voip/port-requests"
      - "POST /voip/port-requests/{id}/resubmit"
      - "POST /voip/port-requests/{id}/cancel"
      - "GET /voip/accounts/{id}, GET /voip/devices/{id}, GET /voip/devices/{id}/call-attempts, GET /voip/e911-registrations/{id}, GET /voip/port-requests/{id}, GET /voip/fee-assessments/{id}"

  - name: E911Validator
    description: "Regulatory validator who accepts or rejects captured dispatchable locations. Cannot capture a location itself."
    identity: opaque
    exclusive_operations:
      - "POST /voip/e911-registrations/{id}/verify"
    shared_operations:
      - "GET /voip/e911-registrations, GET /voip/e911-registrations/{id}, GET /voip/devices, GET /voip/devices/{id}, GET /voip/jurisdictions/{id}"

  - name: SecurityAnalyst
    description: "Fraud analyst who applies and lifts calling restrictions using the DAILY_REVIEW risk variant."
    identity: opaque
    exclusive_operations:
      - "POST /voip/devices/{id}/calling-restrictions"
    shared_operations:
      - "GET /voip/devices, GET /voip/devices/{id}, GET /voip/devices/{id}/call-attempts, GET /voip/accounts/{id}"

  - name: BillingAdmin
    description: "911 fee accountant; assesses provisional fees, voids them (never one it assessed itself) and closes periods with remittance runs."
    identity: opaque
    exclusive_operations:
      - "POST /voip/fee-assessments"
      - "POST /voip/fee-assessments/{id}/void"
      - "POST /voip/jurisdictions/{id}/remittance-runs"
    shared_operations:
      - "GET /voip/fee-assessments, GET /voip/fee-assessments/{id}, GET /voip/jurisdictions/{id}, GET /voip/e911-registrations, GET /voip/e911-registrations/{id}, GET /voip/accounts/{id}"
