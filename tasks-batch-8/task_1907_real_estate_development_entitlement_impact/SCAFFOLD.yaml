# =============================================================================
# SCAFFOLD.yaml — Real Estate Development Entitlement & Impact Fees
# =============================================================================

scenario: |
  1907. Real Estate Development Entitlement & Impact Fees (development
  entitlement team): land use application & submittal package assembly,
  staff review comment cycles & public hearing scheduling, community
  outreach & opposition management, conditions of approval tracking &
  compliance, impact fee calculation, credits & payment timing,
  development agreement & vesting rights, appeal/referendum risk &
  timeline, permit issuance sequencing

domain_name: real-estate-entitlement
api_prefix: /entitlement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - rate_threshold_triggers

  entity_topology: hierarchical   # Project → Application → children; PermitSequence flat-referenced
  state_machine_shape: branching  # review cycles + approval/denial forks + cyclic comment rounds
  relationship_patterns:
    - one_to_many
    - cross_aggregate          # PermitSequence references Application across aggregate boundary
    - self_referential         # ReviewComment.revises_comment_id chains comment revisions
  role_model: segregation_of_duties  # staff reviewer cannot also be decision authority on same application
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: schedule_label, type: string, source: input, description: "Human label, e.g. 'FY2026 Adopted'" }
      - { name: effective_date, type: datetime, source: input, description: "When this schedule takes effect" }
      - { name: rate_transportation_res, type: number, source: input, description: "RES $/dwelling unit" }
      - { name: rate_parks_res, type: number, source: input, description: "RES $/dwelling unit" }
      - { name: rate_fire_res, type: number, source: input, description: "RES $/dwelling unit" }
      - { name: rate_water_res, type: number, source: input, description: "RES $/dwelling unit" }
      - { name: rate_sewer_res, type: number, source: input, description: "RES $/dwelling unit" }
      - { name: rate_transportation_com, type: number, source: input, description: "COM $/1,000 sqft" }
      - { name: rate_parks_com, type: number, source: input, description: "COM $/1,000 sqft" }
      - { name: rate_fire_com, type: number, source: input, description: "COM $/1,000 sqft" }
      - { name: rate_water_com, type: number, source: input, description: "COM $/1,000 sqft" }
      - { name: rate_sewer_com, type: number, source: input, description: "COM $/1,000 sqft" }
      - { name: status, type: enum, source: system, description: "DRAFT → ADOPTED → SUPERSEDED", constraints: "enum in {DRAFT, ADOPTED, SUPERSEDED}" }

  - name: EntitlementProject
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Project name" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; developer entity owning this project" }
      - { name: land_use_type, type: enum, source: input, description: "RESIDENTIAL or COMMERCIAL", constraints: "enum in {RESIDENTIAL, COMMERCIAL}" }
      - { name: dwelling_units, type: integer, source: input, description: "Total dwelling units (RESIDENTIAL); 0 for COMMERCIAL", constraints: ">= 0" }
      - { name: affordable_units, type: integer, source: input, description: "Designated affordable units (RESIDENTIAL)", constraints: "0 <= affordable_units <= dwelling_units" }
      - { name: floor_area_sqft, type: integer, source: input, description: "Gross floor area sqft (COMMERCIAL); 0 for RESIDENTIAL", constraints: ">= 0" }
      - { name: prior_use_basis, type: object, source: input, description: "Per-category prior demand basis for credits, e.g. {TRANSPORTATION: 20}; basis units match land_use_type" }
      - { name: status, type: enum, source: system, description: "ACTIVE → WITHDRAWN | COMPLETE", constraints: "enum in {ACTIVE, WITHDRAWN, COMPLETE}" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Developer legal entity name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: EntitlementApplication
    parent: EntitlementProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> EntitlementProject.id" }
      - { name: application_type, type: enum, source: input, description: "REZONE | CONDITIONAL_USE | PLANNED_DEVELOPMENT", constraints: "enum in {REZONE, CONDITIONAL_USE, PLANNED_DEVELOPMENT}" }
      - { name: submittal_package, type: array, source: input, description: "Array of required document keys, e.g. [SITE_PLAN, TRAFFIC_STUDY, ENVIRONMENTAL]" }
      - { name: improvement_credits, type: object, source: input, description: "Per-category approved in-lieu improvement credits, e.g. {TRANSPORTATION: 50000.00}; dollar amounts capped per-category at net-after-prior-use" }
      - { name: pinned_fee_schedule_id, type: string, source: computed, description: "FK -> FeeSchedule.id; fee schedule in effect at SUBMITTED time — the vesting pin" }
      - { name: provisional_fee_total, type: number, source: computed, description: "Provisional impact fee computed at submittal using pinned schedule" }
      - { name: final_fee_total, type: number, source: computed, description: "Final impact fee computed at decision-approval (or at permit issuance if schedule changed and not vested)" }
      - { name: opposition_score, type: integer, source: computed, description: "Derived from OutreachEvent dispositions; drives posture" }
      - { name: opposition_posture, type: enum, source: computed, description: "LOW | ELEVATED | HIGH — gates administrative vs hearing decision", constraints: "enum in {LOW, ELEVATED, HIGH}" }
      - { name: decision_due_date, type: datetime, source: computed, description: "Statutory decision deadline = submitted_at + PERMIT_STREAMLINING_DAYS" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → UNDER_REVIEW → HEARING_SCHEDULED → DECISION_PENDING → APPROVED | DENIED | WITHDRAWN; cyclic via comment rounds", constraints: "enum in {DRAFT, SUBMITTED, UNDER_REVIEW, HEARING_SCHEDULED, DECISION_PENDING, APPROVED, DENIED, WITHDRAWN}" }

  - name: ReviewComment
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> StaffReviewer.id authoring this comment" }
      - { name: discipline, type: enum, source: input, description: "TRANSPORTATION | PARKS | FIRE | WATER | SEWER | PLANNING", constraints: "enum in {TRANSPORTATION, PARKS, FIRE, WATER, SEWER, PLANNING}" }
      - { name: comment_text, type: string, source: input, description: "Review comment body" }
      - { name: severity, type: enum, source: input, description: "INFO | REQUIRED | BLOCKING", constraints: "enum in {INFO, REQUIRED, BLOCKING}" }
      - { name: round_number, type: integer, source: computed, description: "Comment round; increments each time application returns from APPLICANT_RESPONSE" }
      - { name: revises_comment_id, type: string, source: input, description: "FK -> ReviewComment.id; self-referential — this comment supersedes an earlier one in the same discipline", constraints: "nullable; when set, target must be same application and same discipline" }
      - { name: status, type: enum, source: system, description: "OPEN → ADDRESSED → VERIFIED | WAIVED", constraints: "enum in {OPEN, ADDRESSED, VERIFIED, WAIVED}" }

  - name: OutreachEvent
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: event_date, type: datetime, source: input, description: "When the outreach event occurred" }
      - { name: disposition, type: enum, source: input, description: "SUPPORT | NEUTRAL | OPPOSE | ORGANIZED_OPPOSITION", constraints: "enum in {SUPPORT, NEUTRAL, OPPOSE, ORGANIZED_OPPOSITION}" }
      - { name: attendee_count, type: integer, source: input, description: "Attendance count (informational)", constraints: ">= 1" }
      - { name: weight, type: integer, source: computed, description: "Derived from disposition: SUPPORT=-2, NEUTRAL=0, OPPOSE=+5, ORGANIZED_OPPOSITION=+12" }

  - name: PublicHearing
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: hearing_date, type: datetime, source: input, description: "Scheduled hearing datetime" }
      - { name: notice_posted_date, type: datetime, source: input, description: "Date public notice was posted; hearing_date - notice_posted_date >= NOTICE_LEAD_DAYS" }
      - { name: hearing_body, type: enum, source: input, description: "PLANNING_COMMISSION | CITY_COUNCIL", constraints: "enum in {PLANNING_COMMISSION, CITY_COUNCIL}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → HELD → CONTINUED | CANCELLED", constraints: "enum in {SCHEDULED, HELD, CONTINUED, CANCELLED}" }

  - name: ConditionOfApproval
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: condition_text, type: string, source: input, description: "Condition language" }
      - { name: category, type: enum, source: input, description: "FEE | IMPROVEMENT | DESIGN | ENVIRONMENTAL", constraints: "enum in {FEE, IMPROVEMENT, DESIGN, ENVIRONMENTAL}" }
      - { name: required_before, type: enum, source: input, description: "PERMIT_ISSUANCE | CERTIFICATE_OF_OCCUPANCY | FINAL_INSPECTION", constraints: "enum in {PERMIT_ISSUANCE, CERTIFICATE_OF_OCCUPANCY, FINAL_INSPECTION}" }
      - { name: satisfied_at, type: datetime, source: system, description: "When satisfied; null until satisfied" }
      - { name: status, type: enum, source: system, description: "PENDING → SATISFIED | WAIVED | BREACHED", constraints: "enum in {PENDING, SATISFIED, WAIVED, BREACHED}" }

  - name: ImpactFeeAssessment
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: fee_schedule_id, type: string, source: computed, description: "FK -> FeeSchedule.id used for THIS assessment (pinned or current per vesting)" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL | FINAL", constraints: "enum in {PROVISIONAL, FINAL}" }
      - { name: category_lines, type: array, source: computed, description: "Per-category breakdown: [{category, gross, prior_use_credit, improvement_credit, net}]" }
      - { name: gross_total, type: number, source: computed, description: "Sum of category gross amounts" }
      - { name: prior_use_credit_total, type: number, source: computed, description: "Sum of prior-use credits" }
      - { name: improvement_credit_total, type: number, source: computed, description: "Sum of improvement credits" }
      - { name: net_total, type: number, source: computed, description: "gross_total - prior_use_credit_total - improvement_credit_total" }
      - { name: due_date, type: datetime, source: computed, description: "Payment due date: for PROVISIONAL, the application's submitted_at; for FINAL, the parent application's approval (decision_effective_date); if DEFERRED, moved to CERTIFICATE_OF_OCCUPANCY milestone" }
      - { name: outstanding_balance, type: number, source: computed, description: "net_total - sum(applied_amount over non-refunded payments)" }
      - { name: status, type: enum, source: system, description: "OPEN → PARTIALLY_PAID → PAID | DEFERRED | REFUNDED", constraints: "enum in {OPEN, PARTIALLY_PAID, PAID, DEFERRED, REFUNDED}" }

  - name: FeePayment
    parent: ImpactFeeAssessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> ImpactFeeAssessment.id" }
      - { name: amount, type: number, source: input, description: "Payment amount in dollars", constraints: "> 0" }
      - { name: paid_at, type: datetime, source: input, description: "When payment tendered" }
      - { name: late_fee, type: number, source: computed, description: "Late fee charged on this payment (0 if on time); charged IN ADDITION to amount" }
      - { name: applied_amount, type: number, source: computed, description: "Portion of amount applied to principal = amount (late_fee is additive, not netted)" }

  - name: DevelopmentAgreement
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: agreement_number, type: string, source: input, description: "Unique ordinance/resolution number" }
      - { name: adoption_date, type: datetime, source: input, description: "Date council adopted the DA" }
      - { name: vesting_term_years, type: integer, source: input, description: "Years of fee-schedule vesting from adoption_date", constraints: "1 <= vesting_term_years <= 15" }
      - { name: registered_voters, type: integer, source: input, description: "Registered voter count recorded at adoption (referendum threshold basis)", constraints: "> 0" }
      - { name: vesting_expires_at, type: datetime, source: computed, description: "adoption_date + vesting_term_years years" }
      - { name: referendum_deadline, type: datetime, source: computed, description: "adoption_date + REFERENDUM_WINDOW_DAYS" }
      - { name: vesting_status, type: enum, source: computed, description: "PENDING_REFERENDUM | VESTED | LAPSED | INVALIDATED", constraints: "enum in {PENDING_REFERENDUM, VESTED, LAPSED, INVALIDATED}" }
      - { name: status, type: enum, source: system, description: "DRAFT → ADOPTED → EFFECTIVE | REPEALED", constraints: "enum in {DRAFT, ADOPTED, EFFECTIVE, REPEALED}" }

  - name: ReferendumPetition
    parent: DevelopmentAgreement
    common_fields: true
    fields:
      - { name: development_agreement_id, type: string, source: system, description: "FK -> DevelopmentAgreement.id" }
      - { name: filed_at, type: datetime, source: input, description: "When petition filed; must be within referendum window" }
      - { name: valid_signature_count, type: integer, source: input, description: "Certified valid signatures", constraints: ">= 0" }
      - { name: required_signature_count, type: computed, description: "ceil(REFERENDUM_SIGNATURE_PCT * registered_voters) from parent DA" }
      - { name: qualifies, type: boolean, source: computed, description: "valid_signature_count >= required_signature_count" }
      - { name: status, type: enum, source: system, description: "FILED → CERTIFIED_QUALIFIED | CERTIFIED_INSUFFICIENT | REJECTED_UNTIMELY", constraints: "enum in {FILED, CERTIFIED_QUALIFIED, CERTIFIED_INSUFFICIENT, REJECTED_UNTIMELY}" }

  - name: Appeal
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: appellant_name, type: string, source: input, description: "Who files the appeal" }
      - { name: filed_at, type: datetime, source: input, description: "Appeal filing datetime; must be within appeal window of decision" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: status, type: enum, source: system, description: "FILED → UPHELD | REVERSED | DISMISSED_UNTIMELY", constraints: "enum in {FILED, UPHELD, REVERSED, DISMISSED_UNTIMELY}" }

  - name: EntitlementDecision
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: decision, type: enum, source: input, description: "APPROVE | DENY", constraints: "enum in {APPROVE, DENY}" }
      - { name: decided_by, type: string, source: input, description: "FK -> DecisionAuthority.id rendering the decision" }
      - { name: decision_effective_date, type: datetime, source: computed, description: "Date decision becomes effective; appeal window opens here" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "decision_effective_date + APPEAL_WINDOW_DAYS" }
      - { name: via_hearing, type: boolean, source: computed, description: "True if decision rendered after a HELD PublicHearing; false if administrative" }
      - { name: status, type: enum, source: system, description: "RENDERED → FINAL | STAYED_ON_APPEAL | REVERSED_ON_APPEAL", constraints: "enum in {RENDERED, FINAL, STAYED_ON_APPEAL, REVERSED_ON_APPEAL}" }

  - name: PermitSequence
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: permit_type, type: enum, source: input, description: "GRADING | BUILDING | UTILITY | OCCUPANCY", constraints: "enum in {GRADING, BUILDING, UTILITY, OCCUPANCY}" }
      - { name: sequence_rank, type: integer, source: computed, description: "Derived from permit_type: GRADING=1, BUILDING=2, UTILITY=2, OCCUPANCY=3" }
      - { name: requested_at, type: datetime, source: system, description: "When issuance requested" }
      - { name: issued_at, type: datetime, source: system, description: "When issued; null until issued" }
      - { name: status, type: enum, source: system, description: "REQUESTED → ISSUED | BLOCKED", constraints: "enum in {REQUESTED, ISSUED, BLOCKED}" }

  - name: StaffReviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer name" }
      - { name: disciplines, type: array, source: input, description: "Array of disciplines this reviewer may comment in" }

  - name: DecisionAuthority
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Authority name" }
      - { name: body, type: enum, source: input, description: "PLANNING_COMMISSION | CITY_COUNCIL | STAFF_DIRECTOR", constraints: "enum in {PLANNING_COMMISSION, CITY_COUNCIL, STAFF_DIRECTOR}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EntitlementApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /entitlement/applications/{appId}/submit
        actor: Applicant
        preconditions:
          - "submittal_package non-empty (ERR_INCOMPLETE_PACKAGE)"
          - "Project must be ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "At least one ADOPTED FeeSchedule exists (ERR_NO_ADOPTED_FEE_SCHEDULE)"
        side_effects:
          - "pinned_fee_schedule_id ← latest ADOPTED FeeSchedule by effective_date (tie-break: created_at ASC)"
          - "compute provisional_fee_total via impact_fee_assessment (variant=PROVISIONAL)"
          - "create ImpactFeeAssessment (variant=PROVISIONAL, status=OPEN)"
          - "decision_due_date ← now + PERMIT_STREAMLINING_DAYS"
          - "opposition_score ← 0, opposition_posture ← LOW"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /entitlement/applications/{appId}/open-review
        actor: StaffReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: POST /entitlement/applications/{appId}/hearings (creates PublicHearing SCHEDULED)
        actor: StaffReviewer
        preconditions:
          - "No BLOCKING ReviewComment with status OPEN (ERR_BLOCKING_COMMENTS_OPEN)"
          - "notice lead satisfied on the new hearing (see PublicHearing machine)"
        side_effects: []

      - from: UNDER_REVIEW
        to: DECISION_PENDING
        trigger: POST /entitlement/applications/{appId}/advance-to-decision
        actor: StaffReviewer
        preconditions:
          - "All BLOCKING ReviewComment status in {VERIFIED, WAIVED} (ERR_BLOCKING_COMMENTS_OPEN)"
          - "If opposition_posture == HIGH: at least one PublicHearing with status HELD must exist (ERR_HEARING_REQUIRED)"
          - "If any PublicHearing SCHEDULED exists: it must be HELD or CANCELLED first (ERR_HEARING_PENDING)"
        side_effects: []

      - from: HEARING_SCHEDULED
        to: DECISION_PENDING
        trigger: POST /entitlement/applications/{appId}/advance-to-decision
        actor: StaffReviewer
        preconditions:
          - "All BLOCKING ReviewComment status in {VERIFIED, WAIVED}"
          - "All PublicHearing status in {HELD, CANCELLED}"
          - "If opposition_posture == HIGH: at least one HELD hearing exists"
        side_effects: []

      - from: DECISION_PENDING
        to: APPROVED
        trigger: POST /entitlement/applications/{appId}/decisions (decision=APPROVE)
        actor: DecisionAuthority
        preconditions:
          - "status == DECISION_PENDING (ERR_INVALID_STATE)"
          - "decided_by must not equal any StaffReviewer.id who authored a ReviewComment on this application (ERR_SEGREGATION_OF_DUTIES)"
          - "If opposition_posture == HIGH: via_hearing must be true (ERR_HEARING_REQUIRED)"
        side_effects:
          - "create EntitlementDecision (status=RENDERED, via_hearing computed)"
          - "compute final_fee_total via impact_fee_assessment (variant=FINAL); create/update FINAL ImpactFeeAssessment"
          - "spawn ConditionOfApproval defaults? No — conditions are added explicitly by DecisionAuthority via POST conditions"

      - from: DECISION_PENDING
        to: DENIED
        trigger: POST /entitlement/applications/{appId}/decisions (decision=DENY)
        actor: DecisionAuthority
        preconditions:
          - "status == DECISION_PENDING"
          - "segregation of duties as above"
        side_effects:
          - "create EntitlementDecision (status=RENDERED, decision=DENY)"
          - "OPEN/PARTIALLY_PAID ImpactFeeAssessment → REFUNDED (provisional assessment voided; payments refunded)"

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: POST /entitlement/applications/{appId}/review-comments (each new BLOCKING comment round)
        actor: StaffReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "round_number increments on the new comment batch"
        note: "Cyclic comment rounds — applicant responds, staff re-reviews; same-state loop."

      - from: {SUBMITTED, UNDER_REVIEW, HEARING_SCHEDULED, DECISION_PENDING}
        to: WITHDRAWN
        trigger: POST /entitlement/applications/{appId}/withdraw
        actor: Applicant
        preconditions:
          - "Applicant owns parent project (X-User-ID == project.applicant_id)"
        side_effects:
          - "OPEN/PARTIALLY_PAID ImpactFeeAssessment → REFUNDED"
          - "SCHEDULED PublicHearing → CANCELLED"
          - "PENDING ConditionOfApproval → WAIVED (moot)"

  - entity: PublicHearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: POST /entitlement/hearings/{hearingId}/mark-held
        actor: StaffReviewer
        preconditions:
          - "logical clock now >= hearing_date (ERR_HEARING_NOT_YET)"
        side_effects:
          - "application remains HEARING_SCHEDULED until advance-to-decision"

      - from: SCHEDULED
        to: CONTINUED
        trigger: POST /entitlement/hearings/{hearingId}/continue
        actor: StaffReviewer
        preconditions: []
        side_effects:
          - "hearing_date replaced by new_date input; notice_posted_date must be re-validated against new date"
        note: "CONTINUED is non-terminal; a continued hearing returns to SCHEDULED via re-notice."

      - from: CONTINUED
        to: SCHEDULED
        trigger: POST /entitlement/hearings/{hearingId}/renotice
        actor: StaffReviewer
        preconditions:
          - "new hearing_date - new notice_posted_date >= NOTICE_LEAD_DAYS"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /entitlement/hearings/{hearingId}/cancel
        actor: StaffReviewer
        preconditions: []
        side_effects: []

  - entity: ReviewComment
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: ADDRESSED
        trigger: POST /entitlement/review-comments/{commentId}/address
        actor: Applicant
        preconditions:
          - "Application status == UNDER_REVIEW (applicant responds during review)"
        side_effects: []

      - from: ADDRESSED
        to: VERIFIED
        trigger: POST /entitlement/review-comments/{commentId}/verify
        actor: StaffReviewer
        preconditions:
          - "verifier reviewer_id == original reviewer_id (author verifies own comment)"
        side_effects: []

      - from: OPEN
        to: WAIVED
        trigger: POST /entitlement/review-comments/{commentId}/waive
        actor: StaffReviewer
        preconditions:
          - "waiving reviewer_id == original reviewer_id"
        side_effects: []

  - entity: ImpactFeeAssessment
    initial_state: OPEN
    terminal_states: [PAID, REFUNDED]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: POST /entitlement/assessments/{assessmentId}/payments
        actor: Applicant
        preconditions:
          - "cumulative payments < net_total"
        side_effects:
          - "recompute outstanding balance"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: POST /entitlement/assessments/{assessmentId}/payments
        actor: Applicant
        preconditions:
          - "cumulative applied_amount >= net_total after this payment"
        side_effects:
          - "if parent application APPROVED and all PERMIT_ISSUANCE conditions satisfied, PermitSequence GRADING unblock eligible"

      - from: {OPEN, PARTIALLY_PAID, PAID}
        to: DEFERRED
        trigger: POST /entitlement/assessments/{assessmentId}/defer
        actor: Applicant
        preconditions:
          - "No PermitSequence row with status == ISSUED exists for this application (ERR_PERMIT_ALREADY_ISSUED) — checked FIRST, before the variant check"
          - "variant == FINAL (provisional cannot be deferred) (ERR_INVALID_STATE)"
        side_effects:
          - "payment due date moves to CERTIFICATE_OF_OCCUPANCY"
          - "if previously PAID: prior payments remain recorded as credit toward the deferred balance"

      - from: {OPEN, PARTIALLY_PAID}
        to: REFUNDED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "all FeePayment rows marked refunded (applied_amount reversed)"

  - entity: DevelopmentAgreement
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REPEALED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: POST /entitlement/development-agreements/{daId}/adopt
        actor: DecisionAuthority
        preconditions:
          - "parent application status == APPROVED (ERR_APPLICATION_NOT_APPROVED)"
        side_effects:
          - "vesting_status ← PENDING_REFERENDUM"
          - "referendum_deadline ← adoption_date + REFERENDUM_WINDOW_DAYS"

      - from: ADOPTED
        to: EFFECTIVE
        trigger: "system (referendum window lapses with no qualifying petition) OR POST /entitlement/development-agreements/{daId}/finalize-vesting"
        actor: system | DecisionAuthority
        preconditions:
          - "logical clock >= referendum_deadline AND no ReferendumPetition with status CERTIFIED_QUALIFIED"
        side_effects:
          - "vesting_status ← VESTED"

      - from: ADOPTED
        to: REPEALED
        trigger: "system (ReferendumPetition CERTIFIED_QUALIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "vesting_status ← INVALIDATED"

  - entity: ReferendumPetition
    initial_state: FILED
    terminal_states: [CERTIFIED_QUALIFIED, CERTIFIED_INSUFFICIENT, REJECTED_UNTIMELY]
    transitions:
      - from: FILED
        to: CERTIFIED_QUALIFIED
        trigger: POST /entitlement/referendum-petitions/{petitionId}/certify
        actor: DecisionAuthority
        preconditions:
          - "filed_at < parent DA referendum_deadline (else REJECTED_UNTIMELY path)"
          - "valid_signature_count >= required_signature_count (ERR_INSUFFICIENT_SIGNATURES)"
        side_effects:
          - "parent DevelopmentAgreement → REPEALED, vesting_status → INVALIDATED"

      - from: FILED
        to: CERTIFIED_INSUFFICIENT
        trigger: POST /entitlement/referendum-petitions/{petitionId}/certify
        actor: DecisionAuthority
        preconditions:
          - "filed_at < referendum_deadline"
          - "valid_signature_count < required_signature_count"
        side_effects: []

      - from: FILED
        to: REJECTED_UNTIMELY
        trigger: POST /entitlement/referendum-petitions/{petitionId}/certify
        actor: DecisionAuthority
        preconditions:
          - "filed_at >= referendum_deadline"
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, DISMISSED_UNTIMELY]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: POST /entitlement/appeals/{appealId}/resolve (ruling=UPHELD)
        actor: DecisionAuthority
        preconditions:
          - "filed_at < parent EntitlementDecision.appeal_deadline"
        side_effects:
          - "EntitlementDecision → FINAL (appeal exhausted)"

      - from: FILED
        to: REVERSED
        trigger: POST /entitlement/appeals/{appealId}/resolve (ruling=REVERSED)
        actor: DecisionAuthority
        preconditions:
          - "filed_at < appeal_deadline"
        side_effects:
          - "EntitlementDecision → REVERSED_ON_APPEAL"
          - "Application → DECISION_PENDING (remand for re-decision)"
          - "FINAL ImpactFeeAssessment → recompute on re-approval"

      - from: FILED
        to: DISMISSED_UNTIMELY
        trigger: POST /entitlement/appeals/{appealId}/resolve (ruling=DISMISS)
        actor: DecisionAuthority
        preconditions:
          - "filed_at >= appeal_deadline"
        side_effects:
          - "EntitlementDecision → FINAL"

  - entity: ConditionOfApproval
    initial_state: PENDING
    terminal_states: [SATISFIED, WAIVED, BREACHED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: POST /entitlement/conditions/{conditionId}/satisfy
        actor: Applicant
        preconditions:
          - "parent application APPROVED"
        side_effects:
          - "satisfied_at ← now"

      - from: PENDING
        to: WAIVED
        trigger: POST /entitlement/conditions/{conditionId}/waive
        actor: DecisionAuthority
        preconditions: []
        side_effects: []

      - from: PENDING
        to: BREACHED
        trigger: "system (required_before milestone passed without satisfaction)"
        actor: system
        preconditions:
          - "required_before == PERMIT_ISSUANCE AND a PermitSequence was ISSUED while this PENDING"
        side_effects:
          - "Application posture flag for enforcement action"

  - entity: PermitSequence
    initial_state: REQUESTED
    terminal_states: [ISSUED, BLOCKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: POST /entitlement/permit-sequences/{seqId}/issue
        actor: StaffReviewer
        preconditions:
          - "parent application status == APPROVED (ERR_APPLICATION_NOT_APPROVED)"
          - "parent EntitlementDecision status == FINAL (appeal window lapsed or appeal resolved UPHELD/DISMISSED) (ERR_APPEAL_WINDOW_OPEN)"
          - "all lower sequence_rank PermitSequence rows for this application are ISSUED (ERR_SEQUENCE_VIOLATION)"
          - "no ConditionOfApproval with required_before == PERMIT_ISSUANCE and status == PENDING (ERR_CONDITIONS_PENDING)"
          - "FINAL ImpactFeeAssessment status in {PAID, DEFERRED} (ERR_FEES_UNPAID)"
          - "If FINAL assessment DEFERRED: deferral only valid for OCCUPANCY due-date; GRADING/BUILDING/UTILITY may issue, OCCUPANCY requires PAID"
        side_effects:
          - "issued_at ← now"

      - from: REQUESTED
        to: BLOCKED
        trigger: "system (precondition fails at request time)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EntitlementDecision
    initial_state: RENDERED
    terminal_states: [FINAL, REVERSED_ON_APPEAL]
    transitions:
      - from: RENDERED
        to: FINAL
        trigger: "system (logical clock passes appeal_deadline with no Appeal in status FILED)"
        actor: system
        preconditions:
          - "now >= appeal_deadline"
          - "no Appeal row for this decision's application in status FILED"
        side_effects: []

      - from: RENDERED
        to: STAYED_ON_APPEAL
        trigger: "system (an Appeal is FILED within the appeal window)"
        actor: system
        preconditions:
          - "appeal filed_at < appeal_deadline"
        side_effects: []

      - from: STAYED_ON_APPEAL
        to: FINAL
        trigger: "system (appeal resolved UPHELD or DISMISSED_UNTIMELY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: STAYED_ON_APPEAL
        to: REVERSED_ON_APPEAL
        trigger: "system (appeal resolved REVERSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Application → DECISION_PENDING (remand)"
          - "FINAL ImpactFeeAssessment recompute on re-approval"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: application-submit-stale-project
    parent_entity: EntitlementProject
    write_endpoint: POST /entitlement/applications
    occ_field: expected_project_version
    description: |
      Creating an EntitlementApplication against an EntitlementProject whose
      version has advanced since the client last observed it is rejected. The
      project may have been updated (units changed, land_use_type changed) by
      another writer; the new application must be based on the current project
      definition, not a stale one.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: decision-render-stale-application
    parent_entity: EntitlementApplication
    write_endpoint: POST /entitlement/applications/{appId}/decisions
    occ_field: expected_application_version
    description: |
      Rendering a decision against an EntitlementApplication whose version has
      advanced since the DecisionAuthority last observed it is rejected. A new
      BLOCKING comment or a posture flip (e.g., new ORGANIZED_OPPOSITION event)
      between observation and decision must force re-review.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: impact_fee_assessment
    trigger: "application SUBMITTED (variant=PROVISIONAL) and decision APPROVE / permit issuance (variant=FINAL)"
    algorithm: tiered_pricing
    description: |
      Per-category impact fee with prior-use credit and improvement credit
      stacking. Rounding: round each category's NET to cents (round_half_up)
      BEFORE summing to net_total — "round per-category then sum", not the
      reverse.
    input_set: |
      Parent EntitlementProject fields (land_use_type, dwelling_units,
      affordable_units, floor_area_sqft, prior_use_basis) and the FeeSchedule
      selected per vesting rule.
    constants:
      AFFORDABLE_EXEMPT_CATEGORIES: "TRANSPORTATION, PARKS"
      SQFT_BASIS_DIVISOR: 1000
    formula: |
      basis_c = (land_use_type == RESIDENTIAL) ? dwelling_units
                                               : floor_area_sqft / SQFT_BASIS_DIVISOR
      For each category c in {TRANSPORTATION, PARKS, FIRE, WATER, SEWER}:
        rate_c = schedule rate for (c, land_use_type)
        eff_basis_c = basis_c
        if land_use_type == RESIDENTIAL AND c in AFFORDABLE_EXEMPT_CATEGORIES:
          eff_basis_c = dwelling_units - affordable_units
        gross_c = eff_basis_c * rate_c
        prior_use_credit_c = min(prior_use_basis[c] * rate_c, gross_c)
          (prior_use_basis[c] defaults to 0 when absent)
        improvement_credit_c = min(application.improvement_credits[c],
                                   gross_c - prior_use_credit_c)
          (improvement_credits[c] defaults to 0 when absent)
        net_c = round_half_up(gross_c - prior_use_credit_c - improvement_credit_c, 2)
      gross_total = sum(gross_c); prior_use_credit_total = sum(prior_use_credit_c)
      improvement_credit_total = sum(improvement_credit_c); net_total = sum(net_c)
    precision: "2 decimal places, round_half_up; round per-category net then sum"
    variants:
      - name: PROVISIONAL
        when: "application SUBMITTED"
        difference: "always uses pinned_fee_schedule_id (schedule in effect at submittal)"
      - name: FINAL
        when: "decision APPROVE, or first permit issuance when schedule changed"
        difference: |
          If a DevelopmentAgreement with vesting_status == VESTED covers this
          application AND logical clock <= vesting_expires_at: still uses
          pinned_fee_schedule_id. Otherwise uses the ADOPTED FeeSchedule with
          the latest effective_date at computation time (may differ from
          pinned, producing a different net_total for identical project data).

  - name: opposition_score_and_posture
    trigger: "OutreachEvent created; drives application opposition_posture"
    algorithm: weighted_scoring
    input_set: "All OutreachEvent rows for the application (any status — events are append-only)"
    constants:
      WEIGHT_SUPPORT: -2
      WEIGHT_NEUTRAL: 0
      WEIGHT_OPPOSE: 5
      WEIGHT_ORGANIZED_OPPOSITION: 12
      ELEVATED_THRESHOLD: 10
      HIGH_THRESHOLD: 30
    formula: |
      opposition_score = sum(weight(disposition) for each OutreachEvent)
      posture: score < ELEVATED_THRESHOLD  -> LOW
               ELEVATED_THRESHOLD <= score < HIGH_THRESHOLD -> ELEVATED
               score >= HIGH_THRESHOLD -> HIGH
      Boundary precision: score == 10 is ELEVATED (>=); score == 30 is HIGH (>=).
    precision: "integer score; thresholds inclusive at lower bound"

  - name: late_fee_on_payment
    trigger: "FeePayment recorded with paid_at later than due date"
    algorithm: threshold
    input_set: "FeePayment.paid_at, assessment due date (permit issuance or CO per deferral)"
    constants:
      LATE_FEE_RATE_PER_MONTH: 0.015
      DAYS_PER_MONTH: 30
    formula: |
      days_late = max(0, floor((paid_at - due_date) in days))
      full_months = floor(days_late / DAYS_PER_MONTH)
      late_fee = round_half_up(amount * LATE_FEE_RATE_PER_MONTH * full_months, 2)
        where `amount` is THIS payment's tendered principal (the sum being paid late).
      applied_amount = amount (late_fee is charged IN ADDITION, not netted from principal).
      Boundary: 29 days late -> 0 full months -> late_fee = 0
                30 days late -> 1 full month  -> late_fee = 1.5% of THIS payment amount
    precision: "2 decimal places, round_half_up"

  - name: referendum_threshold
    trigger: "ReferendumPetition certify"
    algorithm: threshold
    input_set: "DevelopmentAgreement.registered_voters (recorded at adoption)"
    constants:
      REFERENDUM_SIGNATURE_PCT: 0.10
    formula: |
      required_signature_count = ceil(REFERENDUM_SIGNATURE_PCT * registered_voters)
      qualifies = (valid_signature_count >= required_signature_count)
      Boundary: valid == required qualifies (>=); valid == required - 1 does not.
      Precision: ceil on the raw product BEFORE any rounding of signatures.
    precision: "integer counts; ceiling applied to the raw decimal product"

  - name: decision_deadline_check
    trigger: "decision render; system may also flag overdue applications"
    algorithm: threshold
    input_set: "Application SUBMITTED timestamp and logical clock"
    constants:
      PERMIT_STREAMLINING_DAYS: 90
    formula: |
      decision_due_date = submitted_at + PERMIT_STREAMLINING_DAYS days
      If decision rendered after decision_due_date, the application is deemed
      approved-by-operation-of-law UNLESS a DevelopmentAgreement is in DRAFT
      or ADOPTED (tolling). This scaffold pins: decision after due date is
      REJECTED with ERR_DECISION_DEADLINE_PASSED; applicant must invoke
      deemed-approved via appeal path. Boundary: rendering exactly at
      decision_due_date is allowed (<=).
    precision: "datetime comparison, inclusive at deadline"

  - name: vesting_window
    trigger: "FINAL fee assessment and permit issuance"
    algorithm: temporal_windowing
    input_set: "DevelopmentAgreement adoption_date, vesting_term_years, logical clock"
    formula: |
      vesting_expires_at = adoption_date + vesting_term_years years
      Vested schedule applies iff vesting_status == VESTED AND now <= vesting_expires_at
      Boundary: exactly at vesting_expires_at still vested (inclusive).
    precision: "datetime, inclusive upper bound"

  - name: hearing_notice_lead
    trigger: "PublicHearing creation and renotice"
    algorithm: temporal_windowing
    input_set: "hearing_date, notice_posted_date"
    constants:
      NOTICE_LEAD_DAYS: 20
    formula: |
      require (hearing_date - notice_posted_date) >= NOTICE_LEAD_DAYS days
      Boundary: exactly 20 days OK (>=); 19 days rejected ERR_INSUFFICIENT_NOTICE.
    precision: "datetime delta, inclusive at threshold"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is declared"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path IDs exist, validated left-to-right (project before application before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Target entity in a state from which this transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_temporal
    check: "Statutory/temporal windows satisfied (notice lead, appeal window, referendum window, decision deadline, vesting window)"
    error_id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    applies_to: "hearing create/renotice, appeal file/resolve, referendum file/certify, decision render, permit issue"
    description: "Specific sub-errors (ERR_INSUFFICIENT_NOTICE, ERR_APPEAL_WINDOW_CLOSED, ERR_REFERENDUM_WINDOW_CLOSED, ERR_DECISION_DEADLINE_PASSED, ERR_VESTING_LAPSED) refine this row per-endpoint."

  - priority: 6
    category: business_referential
    check: "Cross-entity referential preconditions (reviewer discipline match, revises_comment_id same application+discipline, segregation-of-duties, ownership)"
    error_id: ERR_REFERENTIAL_VIOLATION
    http_status: 422
    applies_to: "review-comments, decisions, payments, withdrawals"

  - priority: 7
    category: business_constraint
    check: "Aggregate/structural constraints (no OPEN BLOCKING comments, hearings terminal, sequence ranks satisfied, conditions satisfied)"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: "advance-to-decision, permit issue"

  - priority: 8
    category: business_fiscal
    check: "Fee-related fiscal checks (assessment PAID or DEFERRED before permit; payment amount <= outstanding)"
    error_id: ERR_FEES_UNPAID
    http_status: 402
    applies_to: "permit issue, payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/entitlement/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server default at startup is 2026-08-01T00:00:00Z; an unset clock reads exactly this default, never wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["advance any system transitions that depend on clock (DA vesting lapse, decision deadlines)"]

  # --- FeeSchedule ---
  - method: POST
    path: "/entitlement/fee-schedules"
    description: "Create a fee schedule (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [schedule_label, effective_date, rate_transportation_res, rate_parks_res, rate_fire_res, rate_water_res, rate_sewer_res, rate_transportation_com, rate_parks_com, rate_fire_com, rate_water_com, rate_sewer_com]
    output: FeeSchedule
    side_effects: []

  - method: POST
    path: "/entitlement/fee-schedules/{fsId}/adopt"
    description: "Adopt a fee schedule (DRAFT → ADOPTED); prior ADOPTED schedule → SUPERSEDED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: ["existing ADOPTED schedule (if any) → SUPERSEDED"]

  - method: GET
    path: "/entitlement/fee-schedules/{fsId}"
    description: "Get a fee schedule"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/entitlement/fee-schedules"
    description: "List fee schedules"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FeeSchedule[]"
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/entitlement/applicants"
    description: "Register an applicant (developer entity)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contact_email]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/entitlement/applicants/{applicantId}"
    description: "Get applicant"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- StaffReviewer / DecisionAuthority registry ---
  - method: POST
    path: "/entitlement/staff-reviewers"
    description: "Register a staff reviewer"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, disciplines]
    output: StaffReviewer
    side_effects: []

  - method: GET
    path: "/entitlement/staff-reviewers/{reviewerId}"
    description: "Get staff reviewer"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority]
    code: 200
    input: []
    output: StaffReviewer
    side_effects: []

  - method: POST
    path: "/entitlement/decision-authorities"
    description: "Register a decision authority"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, body]
    output: DecisionAuthority
    side_effects: []

  - method: GET
    path: "/entitlement/decision-authorities/{authorityId}"
    description: "Get decision authority"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority]
    code: 200
    input: []
    output: DecisionAuthority
    side_effects: []

  # --- EntitlementProject ---
  - method: POST
    path: "/entitlement/projects"
    description: "Create an entitlement project"
    roles: [Applicant, PlatformAdmin]
    code: 201
    input: [project_name, applicant_id, land_use_type, dwelling_units, affordable_units, floor_area_sqft, prior_use_basis]
    output: EntitlementProject
    side_effects: ["status ← ACTIVE"]

  - method: GET
    path: "/entitlement/projects/{projectId}"
    description: "Get project"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: []
    output: EntitlementProject
    side_effects: []

  - method: GET
    path: "/entitlement/projects"
    description: "List projects"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: "EntitlementProject[]"
    side_effects: []

  # --- EntitlementApplication ---
  - method: POST
    path: "/entitlement/applications"
    description: "Create an application (DRAFT) for a project; OCC on project version"
    roles: [Applicant]
    code: 201
    input: [project_id, application_type, submittal_package, "improvement_credits?", expected_project_version]
    output: EntitlementApplication
    side_effects: ["increments EntitlementProject.version by 1 (project gains an application)"]

  - method: GET
    path: "/entitlement/applications/{appId}"
    description: "Get application"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: []

  - method: GET
    path: "/entitlement/applications"
    description: "List applications (filterable)"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: ["project_id?", "status?", "pinned_fee_schedule_id?", "limit?", "offset?"]
    output: "EntitlementApplication[]"
    side_effects: []

  - method: POST
    path: "/entitlement/applications/{appId}/submit"
    description: "Submit application (DRAFT → SUBMITTED); pins fee schedule, computes provisional fee, stamps decision_due_date"
    roles: [Applicant]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["pin fee schedule", "create PROVISIONAL ImpactFeeAssessment", "set decision_due_date", "init opposition_score=0/posture=LOW"]

  - method: POST
    path: "/entitlement/applications/{appId}/open-review"
    description: "Open staff review (SUBMITTED → UNDER_REVIEW)"
    roles: [StaffReviewer]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: []

  - method: POST
    path: "/entitlement/applications/{appId}/advance-to-decision"
    description: "Advance to DECISION_PENDING (from UNDER_REVIEW or HEARING_SCHEDULED) once blockers clear"
    roles: [StaffReviewer]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: []

  - method: POST
    path: "/entitlement/applications/{appId}/withdraw"
    description: "Withdraw application (→ WITHDRAWN); cascades to assessments, hearings, conditions"
    roles: [Applicant]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["assessment REFUNDED", "SCHEDULED hearings CANCELLED", "PENDING conditions WAIVED"]

  # --- ReviewComment ---
  - method: POST
    path: "/entitlement/applications/{appId}/review-comments"
    description: "Post a review comment (review round); application stays UNDER_REVIEW"
    roles: [StaffReviewer]
    code: 201
    input: [reviewer_id, discipline, comment_text, severity, "revises_comment_id?"]
    output: ReviewComment
    side_effects: ["increment round_number for this batch", "application.updated_at bump"]

  - method: GET
    path: "/entitlement/applications/{appId}/review-comments"
    description: "List review comments for an application"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: "ReviewComment[]"
    side_effects: []

  - method: GET
    path: "/entitlement/review-comments/{commentId}"
    description: "Get a review comment"
    roles: [PlatformAdmin, StaffReviewer, DecisionAuthority, Applicant]
    code: 200
    input: []
    output: ReviewComment
    side_effects: []

  - method: POST
    path: "/entitlement/review-comments/{commentId}/address"
    description: "Applicant marks comment addressed (OPEN → ADDRESSED)"
    roles: [Applicant]
    code: 200
    input: []
    output: ReviewComment
    side_effects: []

  - method: POST
    path: "/entitlement/review-comments/{commentId}/verify"
    description: "Original reviewer verifies (ADDRESSED → VERIFIED)"
    roles: [StaffReviewer]
    code: 200
    input: []
    output: ReviewComment
    side_effects: []

  - method: POST
    path: "/entitlement/review-comments/{commentId}/waive"
    description: "Original reviewer waives (OPEN → WAIVED)"
    roles: [StaffReviewer]
    code: 200
    input: []
    output: ReviewComment
    side_effects: []

  # --- OutreachEvent ---
  - method: POST
