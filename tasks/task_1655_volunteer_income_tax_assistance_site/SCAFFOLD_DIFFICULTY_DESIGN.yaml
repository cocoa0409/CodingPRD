  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transmit_requires_site_open
        grounds:
          - state_machines.TaxReturn.QR_PASSED_to_TRANSMITTED
          - validations[priority=9]
          - errors[ERR_SITE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair TaxReturn -> Site: a QR_PASSED return cannot transition
          to TRANSMITTED while its Site is SUSPENDED; the same transition
          succeeds once the site is OPEN again. Also verifies cascade
          selectivity: suspension cancels the CHECKED_IN appointment but does
          NOT withdraw the QR_PASSED return.
        test_recipe:
          setup:
            - "Certified OPEN site; return driven to QR_PASSED (PAPER_CHECK)"
            - "Site then SUSPENDED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
