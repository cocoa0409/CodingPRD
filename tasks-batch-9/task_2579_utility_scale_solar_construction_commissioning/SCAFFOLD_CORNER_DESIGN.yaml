              payload: {}
              as: InstallationForeman
              captures: { b2_ct: $.data.circuits_tested_count, b2_cf: $.data.circuits_failed_count, b2_es: $.data.electrical_status, b2_mcr: $.data.mc_ready }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: EpcProjectManager
              captures: { br4: $.data.blocks_mc_ready_count, ready4: $.data.mc_readiness }
          assert:
            - "${ready0} == BLOCKED with ${bt0} == 0 at creation; ${b1_pa} == 0 and ${b1_mcr} == false at block creation"
            - "${bt1} == 2, ${br1} == 0 and ${ready1} == BLOCKED once both blocks exist"
            - "${b1_pa2} == 1, ${b1_pr2} == 0 and ${b1_ms2} == PILES_COMPLETE — the counter is derived from the pile row, not from the request"
            - "${b1_ms3} == MECH_COMPLETE, then ${b1_cw} == 1, ${b1_ct} == 1, ${b1_cf} == 0, ${b1_es} == TESTED and ${b1_mcr2} == true"
            - "${br2} == 1 with ${ready2} == BLOCKED — one of two blocks is not enough"
            - "${br3} == 2 with ${ready3} == READY — the flip happens only on the second block"
            - "${c2_st} == FAILED with ${c2_reason} == INSULATION, ${b2_ct} == 1, ${b2_cf} == 1, ${b2_es} == REWORK and ${b2_mcr} == false"
            - "${br4} == 1 and ${ready4} == BLOCKED — the rollup DECREMENTS, proving it is recomputed from source rows rather than latched"

  - section: consistency_model
    instances:
      - name: every_derived_change_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.yard_zone_pallet_ledger
          - calculations.pile_drive_disposition
          - entities.Delivery.fields.damage_ratio
        distinguishing_aspect: "Under the immediate model nothing lags: the receipt response ALREADY carries damage_ratio, accepted_unit_qty and the resolved ACCEPTED status from the in-request ARRIVED fork, and the very next read of the affected sibling entities (yard zone ledger, block counters) shows the new values with no second write and no settling delay."
        test_recipe:
          setup:
            - "One project with an ACCEPTED grading area, a yard zone of capacity 100 holding one RESERVED 60-pallet MODULE delivery, and one block with one PLANNED pile"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Immediate Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, zv: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${zv}" }
              as: ProcurementCoordinator
              captures: { dlv: $.data.id, dlv_st: $.data.status }
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B1", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { blk: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 1, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { pile: $.data.id }
          trigger:
            - call: "POST /solar/deliveries/${dlv}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 3 }
              as: ProcurementCoordinator
              captures: { r_st: $.data.status, r_ratio: $.data.damage_ratio, r_acc: $.data.accepted_unit_qty }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { z_res: $.data.reserved_pallets, z_av: $.data.available_pallets }
            - call: "POST /solar/piles/${pile}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false }
              as: InstallationForeman
              captures: { p_st: $.data.status, p_rem: $.data.remediated }
            - call: "GET /solar/blocks/${blk}"
              payload: {}
              as: InstallationForeman
              captures: { b_pa: $.data.piles_accepted_count, b_ms: $.data.mechanical_status }
            - call: "GET /solar/deliveries/${dlv}"
              payload: {}
              as: ProcurementCoordinator
              captures: { d_st2: $.data.status, d_ratio2: $.data.damage_ratio }
          assert:
            - "${dlv_st} == RESERVED at creation"
            - "the receipt response itself already carries ${r_st} == ACCEPTED, ${r_ratio} == 0.0500 and ${r_acc} == 57 — the ARRIVED fork is resolved inside the same request, never surfacing ARRIVED to the client"
            - "${z_res} == 60 and ${z_av} == 40 on the immediately following read — an ACCEPTED delivery keeps its pallets, with no settling step"
            - "${p_st} == ACCEPTED with ${p_rem} == false in the drive response"
            - "${b_pa} == 1 and ${b_ms} == PILES_COMPLETE on the immediately following block read — the parent counter is already reconciled"
            - "${d_st2} == ${r_st} and ${d_ratio2} == ${r_ratio} — re-reading returns exactly what the write response returned, so no field is eventually-consistent"
