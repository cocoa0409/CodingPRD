# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Pay Equity Analysis & Reporting
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reachable from
# empty-DB via its own setup_api_calls chain. Numeric asserts are precomputed.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gap_methodology_variants_diverge
        grounds:
          - calculations.adjusted_pay_gap
          - entities.GapFinding.fields.adjusted_gap_pct
          - entities.GapFinding.fields.is_actionable
        distinguishing_aspect: |
          Same comparator group membership yields adjusted_gap_pct 9.5238 under
          COHORT_MEDIAN but 3.0612 under REGRESSION_OLS (GapFinding domain) —
          two valid algorithms, two different results, and actionability itself
          flips (p 0.0338 <= 0.05 actionable vs p 0.0982 > 0.05 not actionable).
        test_recipe:
          setup:
            - "Study S (protected_classes [GENDER], min_group_size 7, default thresholds 2.0/0.05) in MODELING with group G (ENG, CA, levels 4-6) LOCKED holding 7 members: 4 MALE level 6 at 12000000/11000000/10000000/9000000 cents, 3 FEMALE level 4 at 10000000/9500000/9000000 cents, all fte 1.0"
            - "A COHORT_MEDIAN run on G is FINAL with its FLAGGED finding generated"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyGap", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"], min_group_size: 7 }, as: CompAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "M1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 6, location_code: CA, fte_factor: 1.0, base_salary_cents: 12000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "M2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 6, location_code: CA, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "M3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 6, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "M4", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 6, location_code: CA, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m4: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "F1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 4, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "F2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 4, location_code: CA, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${s_id}", employee_ref: "F3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 4, location_code: CA, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${s_id}", name: "ENG-CA-L4-6", job_family: ENG, min_job_level: 4, max_job_level: 6, location_code: CA }, as: CompAnalyst, captures: { g_id: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${e_m1}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_m2}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_m3}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_m4}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f1}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f2}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f3}", payload: { comparator_group_id: "${g_id}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${s_id}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${g_id}/lock", payload: {}, as: CompAnalyst, captures: { gv_locked: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${g_id}", methodology: COHORT_MEDIAN, expected_group_version: "${gv_locked}" }, as: CompAnalyst, captures: { run_med: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_med}/finalize", payload: {}, as: CompAnalyst }
            - { call: "GET /api/gap-findings", payload: { model_run_id: "${run_med}" }, as: CompAnalyst, captures: { f_med: "$.data[0].id" } }
          trigger:
            - { call: "GET /api/comparator-groups/${g_id}", payload: {}, as: CompAnalyst, captures: { gv2: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${g_id}", methodology: REGRESSION_OLS, expected_group_version: "${gv2}" }, as: CompAnalyst, captures: { run_ols: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_ols}/finalize", payload: {}, as: CompAnalyst }
            - { call: "GET /api/gap-findings", payload: { model_run_id: "${run_ols}" }, as: CompAnalyst, captures: { f_ols: "$.data[0].id" } }
          assert:
            - "GapFinding.${f_med}.adjusted_gap_pct == 9.5238"
            - "GapFinding.${f_med}.p_value == 0.0338"
            - "GapFinding.${f_med}.is_actionable == true"
            - "GapFinding.${f_ols}.adjusted_gap_pct == 3.0612"
            - "GapFinding.${f_ols}.p_value == 0.0982"
            - "GapFinding.${f_ols}.is_actionable == false"
            - "GapFinding.${f_med}.adjusted_gap_pct != GapFinding.${f_ols}.adjusted_gap_pct on identical membership"

      - name: allocation_strategy_variants_diverge
        grounds:
          - calculations.remediation_suggested_allocation
          - entities.RemediationPlan.fields.allocation_strategy
        distinguishing_aspect: |
          Identical TARGETED-finding universe (per-capita gaps 950000/900000/850000
          cents) yields FULL_CLOSURE suggestions 950000/900000/850000 totaling
          2700000 but PRO_RATA suggestions 703704/666667/629629 totaling exactly
          the 2000000 budget — RemediationPlan domain, distinct from the
          GapFinding-domain variant in gap_methodology_variants_diverge.
        test_recipe:
          setup:
            - "Study A (period 2025) and Study B (period 2026-H1), each with an identical 6-member group (FIN, NY, level 5): MALE 11000000/10000000/9000000, FEMALE 9500000/9000000/8500000, fte 1.0; MEDIAN run FINAL (gap 10.0000, p 0.0323, GENDER:FEMALE actionable); both studies REMEDIATION_OPEN with the finding TARGETED"
            - "Plan A budget 3000000 FULL_CLOSURE; plan B budget 2000000 PRO_RATA"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "AllocA", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { sa: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sa}", employee_ref: "AF3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 8500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { a_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sa}", name: "GA", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { ga: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${a_m1}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${a_m2}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${a_m3}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${a_f1}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${a_f2}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${a_f3}", payload: { comparator_group_id: "${ga}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sa}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${ga}/lock", payload: {}, as: CompAnalyst, captures: { gva: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${ga}", methodology: COHORT_MEDIAN, expected_group_version: "${gva}" }, as: CompAnalyst, captures: { run_a: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_a}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sa}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sa}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${sa}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${sa}", total_budget_cents: 3000000, allocation_strategy: FULL_CLOSURE }, as: CompAnalyst, captures: { plan_a: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${sa}" }, as: CompAnalyst, captures: { fa: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fa}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies", payload: { name: "AllocB", analysis_period_start: "2026-01-01", analysis_period_end: "2026-06-30", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { sb: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sb}", employee_ref: "BF3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 8500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { b_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sb}", name: "GB", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { gb: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${b_m1}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${b_m2}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${b_m3}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${b_f1}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${b_f2}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${b_f3}", payload: { comparator_group_id: "${gb}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sb}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gb}/lock", payload: {}, as: CompAnalyst, captures: { gvb: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gb}", methodology: COHORT_MEDIAN, expected_group_version: "${gvb}" }, as: CompAnalyst, captures: { run_b: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_b}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sb}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sb}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${sb}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${sb}", total_budget_cents: 2000000, allocation_strategy: PRO_RATA }, as: CompAnalyst, captures: { plan_b: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${sb}" }, as: CompAnalyst, captures: { fb: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fb}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
          trigger:
            - { call: "GET /api/remediation-plans/${plan_a}/suggested-allocation", payload: {}, as: CompAnalyst, captures: { alloc_a_total: "$.data.total_suggested_cents" } }
            - { call: "GET /api/remediation-plans/${plan_b}/suggested-allocation", payload: {}, as: RemediationApprover, captures: { alloc_b_total: "$.data.total_suggested_cents" } }
          assert:
            - "Plan A (${plan_a}) total_suggested_cents == 2700000"
            - "Plan A suggestions: ${a_f1} == 950000, ${a_f2} == 900000, ${a_f3} == 850000 (full per-capita gap, ignores budget headroom)"
            - "Plan B (${plan_b}) total_suggested_cents == 2000000 (scales exactly to budget)"
            - "Plan B suggestions: ${b_f1} == 703704, ${b_f2} == 666667, ${b_f3} == 629629"
            - "alloc_a_total (2700000) != alloc_b_total (2000000) on an identical TARGETED universe"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: prorata_waterfall_remainder_distribution
        grounds:
          - calculations.remediation_suggested_allocation
          - calculations.plan_budget_reconciliation
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear waterfall: suggestion depends on
          budget, per-capita gap, and the (gap DESC, created_at ASC) remainder
          ordering; FLOOR then cent-by-cent remainder makes the top-gap employee
          end at 703704 (= floor 703703 + 1 remainder cent) while the lowest
          stays at its floor 629629, and the total lands exactly on 2000000.
        test_recipe:
          setup:
            - "Study P (period 2024-01-01..2024-12-31, protected_classes [GENDER], min_group_size 6) REMEDIATION_OPEN with group (FIN, NY, level 5): MALE 11000000/10000000/9000000, FEMALE 9500000/9000000/8500000; MEDIAN run FINAL (gap 10.0000 actionable); finding TARGETED"
            - "Plan budget 2000000 with allocation_strategy PRO_RATA"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyP", analysis_period_start: "2024-01-01", analysis_period_end: "2024-12-31", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { sp: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sp}", employee_ref: "PF3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 8500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { p_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sp}", name: "GP", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { gp: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${p_m1}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${p_m2}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${p_m3}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${p_f1}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${p_f2}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${p_f3}", payload: { comparator_group_id: "${gp}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sp}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gp}/lock", payload: {}, as: CompAnalyst, captures: { gvp: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gp}", methodology: COHORT_MEDIAN, expected_group_version: "${gvp}" }, as: CompAnalyst, captures: { run_p: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_p}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sp}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sp}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${sp}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${sp}", total_budget_cents: 2000000, allocation_strategy: PRO_RATA }, as: CompAnalyst, captures: { plan_p: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${sp}" }, as: CompAnalyst, captures: { fp: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fp}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
          trigger:
            - { call: "GET /api/remediation-plans/${plan_p}/suggested-allocation", payload: {}, as: CompAnalyst, captures: { alloc_total: "$.data.total_suggested_cents" } }
          assert:
            - "total_suggested_cents == 2000000 exactly (budget exhausted, never exceeded)"
            - "suggestion for ${p_f1} == 703704 (floor 703703 + first remainder cent: highest per-capita gap 950000 wins the (gap DESC, created_at ASC) ordering)"
            - "suggestion for ${p_f2} == 666667 (floor 666666 + second remainder cent)"
            - "suggestion for ${p_f3} == 629629 (floor, no remainder)"
            - "floors 703703+666666+629629 = 1999998 and the 2-cent remainder is distributed deterministically, not randomly"

      - name: adverse_impact_nested_rounding_order
        grounds:
          - calculations.adverse_impact_ratio
          - entities.PipelineAnalysis.fields.adverse_impact_ratio
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each pass rate is
          rounded to 4dp FIRST and the ratio is computed FROM the rounded rates
          then rounded again; with rates 0.8000 and 0.6400 the pinned order
          yields exactly 0.8000 (flag false), and a one-person change to 63/100
          yields 0.7875 (flag true) — different mode than the waterfall instance.
        test_recipe:
          setup:
            - "Study Q exists (period 2025-01-01..2025-12-31); clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyQ", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { sq: "$.data.id" } }
          trigger:
            - { call: "POST /api/pipeline-analyses", payload: { study_id: "${sq}", stage: INTERVIEW, cohort_period_start: "2026-01-01", cohort_period_end: "2026-03-31", records: [ { class_label: "MAJORITY", count_in: 100, count_passed: 80 }, { class_label: "MINORITY", count_in: 100, count_passed: 64 } ] }, as: CompAnalyst, captures: { pa1: "$.data.id", ratio1: "$.data.adverse_impact_ratio", flag1: "$.data.adverse_impact_flag" } }
            - { call: "POST /api/pipeline-analyses", payload: { study_id: "${sq}", stage: OFFER, cohort_period_start: "2026-01-01", cohort_period_end: "2026-03-31", records: [ { class_label: "MAJORITY", count_in: 100, count_passed: 80 }, { class_label: "MINORITY", count_in: 100, count_passed: 63 } ] }, as: CompAnalyst, captures: { pa2: "$.data.id", ratio2: "$.data.adverse_impact_ratio", flag2: "$.data.adverse_impact_flag" } }
          assert:
            - "PipelineAnalysis.${pa1}.pass_rates == { MAJORITY: 0.8, MINORITY: 0.64 } (0.8000 and 0.6400 at 4dp)"
            - "PipelineAnalysis.${pa1}.adverse_impact_ratio == 0.8 (ROUND(0.6400/0.8000, 4) = 0.8000 from the ROUNDED rates)"
            - "PipelineAnalysis.${pa1}.adverse_impact_flag == false (exactly 0.8000 is not < 0.80)"
            - "PipelineAnalysis.${pa1}.highest_rate_class == MAJORITY"
            - "PipelineAnalysis.${pa2}.adverse_impact_ratio == 0.7875"
            - "PipelineAnalysis.${pa2}.adverse_impact_flag == true"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: study_legal_review_rework_cycle
        grounds:
          - state_machines.PayEquityStudy.UNDER_LEGAL_REVIEW_to_DRAFT
          - state_machines.PayEquityStudy.MODELING_to_UNDER_LEGAL_REVIEW
          - entities.PayEquityStudy.fields.review_rounds
        distinguishing_aspect: |
          PayEquityStudy loops UNDER_LEGAL_REVIEW -> DRAFT -> MODELING ->
          UNDER_LEGAL_REVIEW (a true cycle, not a pipeline): review_rounds == 2
          after the second entry, proving the loop re-traversed.
        test_recipe:
          setup:
            - "Study R (protected_classes [GENDER], min_group_size 2) with group GR (ENG, CA, level 5) holding 2 members; group LOCKED; one OLS run FINAL — study MODELING ready for review"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyR", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"], min_group_size: 2 }, as: CompAnalyst, captures: { sr: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sr}", employee_ref: "RM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { r_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sr}", employee_ref: "RF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { r_f1: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sr}", name: "GR", job_family: ENG, min_job_level: 5, max_job_level: 5, location_code: CA }, as: CompAnalyst, captures: { gr: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${r_m1}", payload: { comparator_group_id: "${gr}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${r_f1}", payload: { comparator_group_id: "${gr}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sr}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gr}/lock", payload: {}, as: CompAnalyst, captures: { gvr: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gr}", methodology: REGRESSION_OLS, expected_group_version: "${gvr}" }, as: CompAnalyst, captures: { run_r: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_r}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sr}/submit-legal-review", payload: {}, as: CompAnalyst, captures: { rr1: "$.data.review_rounds" } }
          trigger:
            - { call: "POST /api/pay-equity-studies/${sr}/legal-decision", payload: { decision: REQUEST_CHANGES, rationale: "Expand comparator scope before privilege" }, as: LegalCounsel, captures: { st_after_reject: "$.data.status" } }
            - { call: "POST /api/pay-equity-studies/${sr}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sr}/submit-legal-review", payload: {}, as: CompAnalyst, captures: { rr2: "$.data.review_rounds", st_final: "$.data.status" } }
          assert:
            - "review_rounds after first submit == 1"
            - "REQUEST_CHANGES lands the study back in DRAFT (st_after_reject == DRAFT)"
            - "Re-advance from DRAFT to MODELING succeeds because the still-LOCKED group qualifies (member_count 2 >= min_group_size 2)"
            - "review_rounds after second submit == 2 and status == UNDER_LEGAL_REVIEW — the cycle looped"

      - name: plan_reject_resubmit_cycle
        grounds:
          - state_machines.RemediationPlan.SUBMITTED_to_DRAFT
          - state_machines.RemediationPlan.SUBMITTED_to_APPROVED
          - entities.RemediationPlan.fields.rejection_count
        distinguishing_aspect: |
          RemediationPlan loops SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED on a
          different entity than the study cycle: rejection_count == 1 after the
          rework loop while the PROPOSED adjustment survives the rejection.
        test_recipe:
          setup:
            - "Study T (period 2024-01-01..2024-12-31, protected_classes [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group (FIN, NY, 5) with MEDIAN gap 10.0000; finding TARGETED; plan budget 5000000 with one PROPOSED adjustment (100000 cents, effective 2026-09-01)"
