  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: exposure_rolling_window_ages_out_old_violation
        claim_type: input_set_filtering
        grounds: [calculations.calc_ncd_violation_rolling_count, calculations.calc_case_exposure_score]
        distinguishing_aspect: "The 365-day rolling window filters the exposure input set: a violation substantiated 2026-08-01 stops counting once the clock passes 2027-08-01; the next input mutation (directive lift) recomputes the score from 60 to 40, proving both the window boundary and the stored-score recompute trigger."
        test_recipe:
          setup:
            - "case [SEXUAL_ASSAULT] with one ACTIVE open-ended directive and one SUBSTANTIATED violation (score 60 = 40 + 10 + 10) at clock 2026-08-01"
            - "clock advanced to 2027-08-02T00:00:00Z (violation aged past the inclusive 365-day window)"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, v0: $.data.version }
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "MUTUAL", restrictions: ["IN_PERSON"], effective_from: "2026-08-01T00:00:00Z", expected_case_version: "${v0}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /api/no-contact-directives/${dir_id}/violations"
              payload: { reported_by_side: "COMPLAINANT", occurred_at: "2026-08-01T08:00:00Z", description: "Approach" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { vio_id: $.data.id }
            - { call: "POST /api/directive-violations/${vio_id}/substantiate", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: CaseAdministrator }
          trigger:
            - { call: "POST /api/no-contact-directives/${dir_id}/lift", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { exp: $.data.exposure_score, elig: $.data.interim_suspension_eligible } }
          assert:
            - "after lift at 2027-08-02: exposure_score == 40 (base 40; violation substantiated 2026-08-01 falls outside [now-365d, now]; directive no longer ACTIVE)"
            - "interim_suspension_eligible == false"
            - "directive.substantiated_violation_count remains 1 (the all-time counter is unaffected by rolling-window aging - two different counts on purpose)"

      - name: statistics_hierarchy_rule_single_bucket_per_case
        claim_type: correct_result
        grounds: [calculations.calc_annual_statistics]
        distinguishing_aspect: "A multi-category case ([STALKING, SEXUAL_ASSAULT]) is counted exactly once, under the highest-priority category SEXUAL_ASSAULT; the per-category buckets sum to reports_received (no double counting, no omission)."
        test_recipe:
          setup: ["two cases received in 2026: case A [STALKING, SEXUAL_ASSAULT], case B [STALKING]"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
