              payload: { crate_label: "CRATE-01", contents_value_cents: 600000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Atlas Hall", city: "Seattle", climate_controlled: true, max_gallery_sqm: 600, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 2000, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 100000, sponsorship_credit_cents: 0 }
              as: TourManager
              captures: { contract_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
          assert:
            - "ParticipationContract.${contract_id}.status == SIGNED"
            - "TourStop.${stop_id}.status == CONTRACTED  # cross-entity state dependency"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_half_open_window_overlap_rejected
        grounds:
          - validations[priority=8]
        distinguishing_aspect: |
          Half-open [install_start, teardown_end) semantics on Venue: a second
          stop at the same venue starting exactly at the first stop's
          teardown_end is ALLOWED (adjacent, gap=0), but one starting one day
          earlier is REJECTED with ERR_VENUE_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Venue V with existing stop [2026-09-01, 2026-10-07); tour refurbishment_gap_days=0"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Glass", exhibit_code: "GLAS-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Crystal Hall", city: "Corning", climate_controlled: true, max_gallery_sqm: 500, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-10-01T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv1}" }
              as: TourManager
              captures: { s1_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-10-07T00:00:00Z", open_date: "2026-10-10T00:00:00Z", close_date: "2026-11-10T00:00:00Z", teardown_end: "2026-11-15T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { s2_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv3: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-10-06T00:00:00Z", open_date: "2026-10-10T00:00:00Z", close_date: "2026-11-10T00:00:00Z", teardown_end: "2026-11-20T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv3}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "Second booking at install_start == teardown_end succeeded (half-open adjacency allowed)"
            - "Overlapping booking rejected with error_id == ERR_VENUE_DOUBLE_BOOKED"

      - name: consecutive_stop_refurbishment_gap_enforced
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Different interval semantics on the Tour resource (aggregate gap
          rule, not geometric overlap): consecutive stops of the same tour must
          keep next.install_start - prev.teardown_end >= refurbishment_gap_days;
          a 2-day gap against a 5-day requirement is rejected.
        test_recipe:
          setup:
            - "Tour T refurbishment_gap_days=5, first stop booked with teardown_end=2026-10-07"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Fossils", exhibit_code: "FOSS-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 5 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V1", city: "A", climate_controlled: true, max_gallery_sqm: 500, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { v1_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V2", city: "B", climate_controlled: true, max_gallery_sqm: 500, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { v2_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${v1_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-10-01T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv1}" }
              as: TourManager
              captures: { s1_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${v2_id}", install_start: "2026-10-12T00:00:00Z", open_date: "2026-10-15T00:00:00Z", close_date: "2026-11-15T00:00:00Z", teardown_end: "2026-11-20T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { s2_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv3: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${v2_id}", install_start: "2026-10-09T00:00:00Z", open_date: "2026-10-15T00:00:00Z", close_date: "2026-11-15T00:00:00Z", teardown_end: "2026-11-20T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv3}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "Gap of exactly 5 days (2026-10-07 -> 2026-10-12) accepted"
            - "Gap of 2 days (2026-10-07 -> 2026-10-09) rejected with error_id == ERR_REFURBISHMENT_GAP_VIOLATED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: crate_location_conservation_across_shipment_dispatch_and_hold
        grounds:
          - state_machines.Shipment.PLANNED_to_DISPATCHED
          - state_machines.Shipment.RECEIVED_to_DAMAGE_HOLD
          - entities.Crate.fields.location_status
        distinguishing_aspect: |
          Conserved quantity: total crate count across location_status buckets
          (AT_ORIGIN + IN_TRANSIT + AT_VENUE + IN_REFURBISHMENT == tour.crate_count).
          Dispatch moves crates AT_ORIGIN -> IN_TRANSIT and DAMAGE_HOLD changes
          no counts; sum across buckets is invariant.
        test_recipe:
          setup:
            - "Tour with crate_count=2, both crates AT_ORIGIN; one shipment planned for both crates"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Ceramics", exhibit_code: "CERA-2026", crate_count: 2, declared_value_cents: 2000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
              captures: { c1: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-02", contents_value_cents: 1000000 }
              as: TourManager
              captures: { c2: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Kiln Hall", city: "A", climate_controlled: true, max_gallery_sqm: 500, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 1000, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 2000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${c1}", "${c2}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "GET /tours/${tour_id}/crates"
              payload: {}
              as: TourManager
              captures: { crates_after: $.data }
          assert:
            - "count(crates with location_status == IN_TRANSIT) == 2 after DISPATCH"
            - "count(AT_ORIGIN) + count(IN_TRANSIT) + count(AT_VENUE) + count(IN_REFURBISHMENT) == 2 throughout"

      - name: tour_fee_ledger_conservation_billed_equals_waived_plus_expected
        grounds:
          - calculations.participation_fee
          - entities.Tour.fields.total_billed_cents
          - entities.Tour.fields.total_waived_cents
          - state_machines.TourStop.TEARDOWN_to_CLOSED
        distinguishing_aspect: |
          Different conserved quantity (money): after CLOSE_STOP, the tour
          ledger satisfies total_billed_cents == final_fee where
          final_fee = base + tier_uplift - min(credit, cap, base+uplift); and
          total_waived_cents equals the credited portion exactly — no drift in
          either direction after the provisional->final switch.
        test_recipe:
          setup:
            - "Stop with contract base=2000000, credit=300000 (cap 500000), projected 8000 -> provisional 1700000; actual 60000 -> final 2200000; waived equals 300000"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Dinosaurs", exhibit_code: "DINO-2026", crate_count: 1, declared_value_cents: 5000000, refurbishment_gap_days: 7 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 5000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
