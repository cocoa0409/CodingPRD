            - call: "GET /records-desk/investigations/${inv_id}/disclosure-risk-preview"
              payload: { release_dataset_id: "${ds_999_id}" }
              as: ManagingEditor
            - call: "GET /records-desk/investigations/${inv_id}/disclosure-risk-preview"
              payload: { release_dataset_id: "${ds_1000_id}" }
              as: ManagingEditor
          assert:
            - "trigger call 1: aggregate_max_score == 80 (max unsuppressed risk 8 * 10, no source bump because the source column is suppressed)"
            - "trigger call 1: composite_weighted_score == 69 - base 11 over 2 unsuppressed fields is density 5.5, 5.5*10 == 55, 55*1.25 == 68.75, round_half_up ONCE -> 69, penalty 0"
            - "trigger call 1: applicable_variant == \"COMPOSITE_WEIGHTED\" and applicable_score == 69 (publication_mode FULL_DATA_RELEASE)"
            - "trigger call 1: the suppressed inspector_badge_id contributes to NEITHER variant - it neither raises the max to 8/10 nor adds the 25-point penalty"
            - "trigger call 2: composite_weighted_score == 100 - base 20 over 2 fields is density 10, 10*10 == 100, *1.25 == 125, round_half_up 125, + 25 penalty == 150, then min(100, 150) == 100 with the clamp applied LAST"
            - "trigger call 2: aggregate_max_score == 100 - 10*10 == 100 plus the 10-point source bump is 110, clamped to 100"
            - "trigger call 3: composite_weighted_score == 40 - density 4, 4*10 == 40, size_multiplier 1.0 because record_count 999 < 1000"
            - "trigger call 4: composite_weighted_score == 50 - identical field data, but record_count 1000 crosses into the 1.25 tier: 40 * 1.25 == 50"
            - "trigger calls 3 and 4 both report aggregate_max_score == 40 - the AGGREGATE_MAX variant ignores record_count entirely"
            - "no trigger call persists anything: after all four, GET /records-desk/investigations/${inv_id} still reports disclosure_risk_score == null, applicable_risk_variant == null, published_at == null and status == \"DRAFTING\""

      - name: publish_risk_ceiling_admits_exactly_sixty_and_refuses_seventy
        claim_type: threshold
        grounds:
          - calculations.disclosure_risk_score
          - validations[priority=130]
          - validations[priority=140]
          - state_machines.Investigation.FINDINGS_LOCKED_to_PUBLISHED
        distinguishing_aspect: |
          PUBLISH_RISK_CEILING is an inclusive ceiling, and the AGGREGATE_MAX variant moves in steps of
          ten, so the three interesting points are reachable on ONE dataset by suppressing columns in
          order: 70 (above, refused), 60 (exactly at the ceiling, published) and 50 (below, on a sibling
          dataset). The instance also pins that priority 130 fires BEFORE 140 - with the source-identifying
          column unsuppressed the score is 80 and both gates are violated, yet the answer must be
          ERR_SOURCE_EXPOSURE_RISK, not ERR_DISCLOSURE_RISK_TOO_HIGH.
