            - "report A submitted at exactly due_at: submitted_late == false, because the comparison is submitted_at > due_at (strict)"
            - "report B submitted one millisecond later: submitted_late == true"
            - "GET /regulatory-reports?submitted_late=true has total_count == 1"
            - "both reports are \"SUBMITTED\" and both complaints' regulatory_status is \"SUBMITTED\""

      - name: corner_severity_variant_divergence_and_selection
        claim_type: variant_divergence
        grounds: [calculations.complaint_severity_score.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / severity_provisional_vs_adjudicated_band_divergence
          rationale: "That §1.8 instance already asserts both variants on identical data (57.00/S3 provisional vs 61.28/S2 adjudicated) and pins which one effective_severity_band selects at each stage."

      - name: corner_severity_rounding_is_applied_after_each_multiplier
        claim_type: precision
        grounds: [calculations.complaint_severity_score.precision]
        excluded_because:
          difficulty_instance: combinatorial_formula / severity_sequential_rounding_order_is_normative
          rationale: "The sequential-vs-fused rounding difference (111.89 vs 111.88) is the entire subject of that §1.8 instance."

      - name: corner_lot_rate_variant_divergence_and_zero_denominator
        claim_type: variant_divergence
        grounds: [calculations.lot_complaint_rate_ppm.variants, calculations.lot_complaint_rate_ppm.precision]
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_rate_provisional_vs_adjudicated_numerator_divergence
          rationale: "Numerator divergence between the two rate variants is asserted there, and the zero-denominator behaviour is asserted by boundary_precision_check / zero_unit_denominator_returns_undefined_not_error."

      - name: corner_trend_threshold_constants_at_the_boundary
        claim_type: constants_applied
        grounds: [calculations.trend_signal_evaluation.constants, calculations.trend_signal_evaluation.precision]
        excluded_because:
          difficulty_instance: boundary_precision_check / ops_run_fires_at_exact_weighted_count_and_exact_threshold_ppm
          rationale: "MIN_WEIGHTED_COUNT and THRESHOLD_PPM.LOT are probed at their exact inclusive boundaries there, with a non-firing control scope."

      - name: corner_goodwill_uplift_keyed_on_base_not_payout
        claim_type: correct_result
        grounds: [calculations.goodwill_authorization.formula]
        excluded_because:
          difficulty_instance: combinatorial_formula / goodwill_uplift_rate_keyed_on_base_not_payout
          rationale: "That §1.8 instance pins the normative step order and states the payout-keyed wrong answer explicitly."

      - name: corner_regulatory_deadline_hours_selected_by_band
        claim_type: constants_applied
        grounds: [calculations.regulatory_due_at.constants]
        excluded_because:
          difficulty_instance: transitive_cascade / s1_triage_cascades_band_to_lot_hold_to_report_deadline_to_sentiment
          rationale: "The choice between S1_DEADLINE_HOURS and STANDARD_DEADLINE_HOURS is asserted there with the 72-hour wrong answer named."

      - name: corner_kit_retention_interval_endpoints
        claim_type: correct_result
        grounds: [calculations.sample_kit_retention_window]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / sample_kit_occupancy_interval_is_closed_at_both_ends
          rationale: "The occupancy interval, its closed endpoints and the cooldown arithmetic are all asserted by that §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: corner_contact_received_at_may_equal_the_clock_but_not_exceed_it
        claim_type: violation_to_error
        grounds: ["validations[priority 33]", "errors[ERR_RECEIVED_AT_IN_FUTURE]"]
        distinguishing_aspect: "The temporal guard is probed one millisecond either side of the logical clock, so 'not after' is pinned as <= rather than <."
        test_recipe:
          setup: ["A consumer and a care agent; the clock is pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00.001Z", raw_message: "One millisecond in the future." }, captures: { err: "$.data.error_id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Exactly now." }, captures: { ok1: "$.data.id", st: "$.data.status" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-07-15T09:30:00Z", raw_message: "Backdated intake." }, captures: { ok2: "$.data.id" } }
            - { call: "GET /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}" }, captures: { tc: "$.total_count" } }
          assert:
            - "received_at one millisecond after the clock: HTTP 422 with data.error_id == \"ERR_RECEIVED_AT_IN_FUTURE\""
            - "received_at exactly equal to the clock: HTTP 201 with status \"OPEN\""
            - "a backdated received_at is accepted: HTTP 201"
            - "GET /contacts for the consumer has total_count == 2 — the rejected attempt persisted nothing"

      - name: corner_custody_event_occurred_at_may_tie_but_not_regress
        claim_type: violation_to_error
        grounds: ["validations[priority 35]", "errors[ERR_CUSTODY_OUT_OF_ORDER]", "calculations.custody_chain_integrity.formula rule (3)"]
        distinguishing_aspect: "The rule is 'not before the previous event', so equal timestamps are legal while a one-second regression is refused; the refusal leaves sequence_no and the kit version untouched."
        test_recipe:
          setup: ["A shipped kit whose CONSUMER_SEALED event occurred at 2026-08-01T12:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-02T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Soft matter." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "A1B20260710", foreign_object_class: SOFT }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Retrieve." } }
            - { call: "POST /sample-kits", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", kit_code: "K-901", seal_id_issued: "SEAL-901" }, captures: { k1: "$.data.id" } }
            - { call: "POST /sample-kits/${k1}/ship", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { kv2: "$.data.version" } }
            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: CONSUMER_SEALED, occurred_at: "2026-08-01T12:00:00Z", actor_label: "Rin Sato", seal_id_observed: "SEAL-901", expected_sample_kit_version: "${kv2}" } }
            - { call: "GET /sample-kits/${k1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { kv3: "$.data.version", cnt3: "$.data.custody_event_count" } }
          trigger:
            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: CARRIER_PICKUP, occurred_at: "2026-08-01T11:59:59Z", actor_label: "Courier 88", expected_sample_kit_version: "${kv3}" }, captures: { err: "$.data.error_id" } }
            - { call: "GET /sample-kits/${k1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { kv4: "$.data.version", cnt4: "$.data.custody_event_count" } }
            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: CARRIER_PICKUP, occurred_at: "2026-08-01T12:00:00Z", actor_label: "Courier 88", expected_sample_kit_version: "${kv4}" }, captures: { seq: "$.data.sequence_no" } }
            - { call: "GET /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { tc: "$.total_count" } }
          assert:
            - "a CARRIER_PICKUP one second BEFORE the CONSUMER_SEALED event returns HTTP 422 with data.error_id == \"ERR_CUSTODY_OUT_OF_ORDER\""
            - "after the refusal custody_event_count is still 2 and the kit version is unchanged — a rejected append does not consume the OCC token"
            - "a CARRIER_PICKUP at exactly the same instant is accepted with sequence_no == 3, because the rule forbids only strictly-earlier timestamps"
            - "GET /sample-kits/${k1}/custody-events has total_count == 3 and the kit status is \"IN_TRANSIT_INBOUND\""

      - name: corner_custody_event_type_must_match_the_next_required_position
        claim_type: violation_to_error
        grounds: ["validations[priority 39]", "errors[ERR_CUSTODY_SEQUENCE_INVALID]", calculations.custody_chain_integrity.constants.REQUIRED_SEQUENCE]
        distinguishing_aspect: "Skipping ahead in REQUIRED_SEQUENCE is rejected on the SHAPE rule (priority 39) even though the occurred_at ordering is perfectly valid, and re-appending an already-consumed event type is rejected the same way."
        test_recipe:
          setup: ["A shipped kit holding only its automatic KIT_ISSUED event."]
