      - name: fundraiser_tier_boundary_25_vs_26_dozens
        grounds:
          - calculations.fundraiser_pricing
          - state_machines.FundraiserOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Boundary metric 2 (marginal tier breakpoint on dozen count) reached via
          the fundraiser approve endpoint: 25 dozen quotes 17500 (all in tier A at
          700), 26 dozen quotes 18150 (25*700 + 1*650) — the 26th dozen is priced
          at the marginal tier-B rate, not the average.
        test_recipe:
