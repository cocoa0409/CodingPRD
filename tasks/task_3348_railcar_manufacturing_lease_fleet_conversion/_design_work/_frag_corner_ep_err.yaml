              captures: { po_ok_status: $.data.status }
          assert:
            - "Order ${po_short} was accepted at creation with no gated rows: status == ${po_short_status} == \"DRAFT\" and horizon 2026-09-11 minus 2026-09-01 == 10 days"
            - "After the WHEELSET row lands, the second gate site rejects it: HTTP 422 with data.error_id == ${err_lead} == \"ERR_LEAD_TIME_INFEASIBLE\""
            - "worst_lead == ceil(lead_time_days 60 / qty_per_car 2) == 30 > horizon 10, the exact §1.3 production_feasibility_gate comparison"
            - "Stock is not the binding constraint — 100 units on hand against a requirement of 2 — so the rejection is driven by the lead-time term rather than by priority 13"
            - "The rejection is atomic: ProductionOrder.${po_short}.status == ${po_short_after} == \"DRAFT\" with no stock committed"
