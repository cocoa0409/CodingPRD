# =============================================================================
# Task 1910 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7; section/claim_type values per claim-extraction-guide.
# Instances already exercised by §1.8 appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_creation_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.Species.fields.is_import"
          - "entities.Customer.fields.discount_pct"
          - "entities.MarketQuote.fields.status"
          - "entities.SalesOrder.fields.total_cents"
        distinguishing_aspect: "Omitting optional fields applies documented defaults; computed/system fields start at their defaults regardless of input."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 500000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
          trigger:
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager }
            - { call: "GET /customers/${c_id}", payload: {}, as: OperationsManager }
            - { call: "GET /market-quotes/${q_id}", payload: {}, as: OperationsManager }
          assert:
            - "Species.${sp_id}.is_import == false and requires_cites == false (defaults)"
            - "Customer.${c_id}.discount_pct == 0 and credit_exposure_cents == 0"
            - "MarketQuote.${q_id}.status == DRAFT and volatility_pct == 0 (initial state + computed default)"
            - "All three responses carry id, created_at, updated_at, version == 1"

      - name: entity_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Vessel.fields.registration_number"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A required input field (registration_number) omitted on create is rejected with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", home_port: "Gloucester" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400) and no Vessel row is created"

      - name: entity_invalid_enum_value_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.MarketQuote.fields.grade"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "An out-of-enum grade value on quote creation is rejected; enum membership is closed over {GRADE_A, GRADE_B, GRADE_C}."
        test_recipe:
          setup: ["Species COD exists"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id } }
          trigger:
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_X", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: entity_computed_and_system_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.DockTicket.fields.status"
          - "entities.DockTicket.fields.provisional_total_cents"
        distinguishing_aspect: "Client-supplied values for system/computed fields (status, provisional_total_cents, id) on create are ignored, not honored and not an error."
        test_recipe:
          setup: ["Vessel and catch area exist"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
          trigger:
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z", status: "PAID", provisional_total_cents: 999999, id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }, as: DockBuyer, captures: { t_id: $.data.id, t_status: $.data.status } }
          assert:
            - "DockTicket.${t_id}.status == DRAFT (client-injected PAID ignored)"
            - "DockTicket.${t_id}.provisional_total_cents == 0 (client-injected 999999 ignored)"
            - "DockTicket.${t_id}.id != ffffffff-ffff-4fff-8fff-ffffffffffff (server-minted)"

      - name: entity_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_VESSEL_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the resource-specific 404, not a generic 400/500."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vessels/00000000-0000-0000-0000-000000000000", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VESSEL_NOT_FOUND (404)"

      - name: entity_body_fk_unknown_species_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.LandingLine.fields.species_id"
          - "errors[ERR_SPECIES_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "A body-carried FK (species_id on landing-line create) that does not resolve is an existence failure (404), raised before state or business checks."
        test_recipe:
          setup: ["Ticket LANDED"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
          trigger:
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "00000000-0000-0000-0000-000000000000", declared_grade: "GRADE_A", landed_weight_kg: 10.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SPECIES_NOT_FOUND (404); ticket version unchanged at ${t_v2}"

      - name: entity_pagination_defaults_and_filter_interaction
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
          - 'endpoints."GET /market-quotes"'
        distinguishing_aspect: "Default limit 10 with total_count/has_more; offset page 2 returns the remainder; species_id filter narrows both items and total_count consistently."
        test_recipe:
          setup:
            - "Species COD with 7 DRAFT quotes (2026-08-01..2026-08-07) and species HADDOCK with 5 DRAFT quotes (2026-08-01..2026-08-05)"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp1_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "HADDOCK", common_name: "Haddock", labeling_name: "Haddock", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp2_id: $.data.id } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-02", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-03", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-04", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-05", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-06", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_A", quote_date: "2026-08-07", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 999 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-02", price_per_kg_cents: 999 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-03", price_per_kg_cents: 999 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-04", price_per_kg_cents: 999 }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp2_id}", grade: "GRADE_A", quote_date: "2026-08-05", price_per_kg_cents: 999 }, as: OperationsManager }
          trigger:
            - { call: "GET /market-quotes", payload: {}, as: OperationsManager }
            - { call: "GET /market-quotes", payload: { offset: 10 }, as: OperationsManager }
            - { call: "GET /market-quotes", payload: { species_id: "${sp2_id}" }, as: OperationsManager }
          assert:
            - "Default page: 10 items, total_count == 12, has_more == true, limit == 10, offset == 0"
            - "Offset page: 2 items, total_count == 12, has_more == false"
            - "Filtered page: 5 items, all with species_id == ${sp2_id}, total_count == 5, has_more == false"

  - section: state_machines
    instances:
      - name: sm_initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.DockTicket"
          - "state_machines.SalesOrder"
          - "state_machines.Shipment"
          - "state_machines.ImportDocument"
          - "state_machines.InspectionHold"
          - "state_machines.SubstitutionApproval"
        distinguishing_aspect: "Every stateful entity is born in its declared initial_state: DRAFT (ticket/order/document), QUOTED (shipment), PLACED (hold), REQUESTED (substitution), RESERVED (allocation)."
        test_recipe:
          setup: ["Config entities, one CONFIRMED order with line, one ACTIVE+CLEAR lot of 87.30 kg (standard landing chain)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_B", quote_date: "2026-08-01", price_per_kg_cents: 950 }, as: OperationsManager, captures: { qb_id: $.data.id } }
            - { call: "POST /market-quotes/${qb_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version, t_status: $.data.status } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_B", yield_pct: 0.90 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id, o_status: $.data.status } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00, allow_substitution: true }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { o_v: $.data.version } }
            - { call: "POST /import-documents", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", doc_type: "HEALTH_CERT", reference_number: "HC-001" }, as: ComplianceOfficer, captures: { doc_id: $.data.id, doc_status: $.data.status } }
            - { call: "POST /inspection-holds", payload: { inventory_lot_id: "${lot_id}", reason: "spot check" }, as: ComplianceOfficer, as_user_id: "off_1", captures: { h_id: $.data.id, h_status: $.data.status } }
          trigger:
            - { call: "POST /shipments", payload: { sales_order_id: "${o_id}", mode: "TRUCK", booked_weight_kg: 10.00, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { sh_id: $.data.id, sh_status: $.data.status } }
            - { call: "POST /substitution-approvals", payload: { order_line_id: "${ol_id}", substitute_species_id: "${sp_id}" }, as: InventoryPlanner, captures: { sub_id: $.data.id } }
          assert:
            - "t_status == DRAFT; o_status == DRAFT; doc_status == DRAFT; h_status == PLACED at creation"
            - "Shipment.${sh_id}.status == QUOTED at creation"
            - "SubstitutionApproval.${sub_id}.status == REQUESTED at creation (group/price checks run at approve, not request)"

      - name: sm_terminal_lockdown_voided_ticket_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.DockTicket"
          - "errors[ERR_TICKET_INVALID_STATE]"
        distinguishing_aspect: "VOIDED is terminal: land on a VOIDED ticket fails with ERR_TICKET_INVALID_STATE and no transition fires."
        test_recipe:
          setup: ["Ticket created then voided from DRAFT"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id } }
            - { call: "POST /dock-tickets/${t_id}/void", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TICKET_INVALID_STATE (409); status remains VOIDED"

      - name: sm_settle_from_landed_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DockTicket.GRADED_to_SETTLED"
          - "errors[ERR_TICKET_INVALID_STATE]"
        distinguishing_aspect: "Settle requires GRADED; from LANDED it is rejected and the vessel ledger is untouched."
        test_recipe:
          setup: ["Ticket LANDED with one line (no assessments finalized)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/settle", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TICKET_INVALID_STATE (409)"
            - "Vessel.${v_id}.payable_balance_cents == 0 and ticket stays LANDED"

      - name: sm_ticket_auto_grades_when_last_line_final
        claim_type: side_effect_execution
        grounds:
          - "state_machines.DockTicket.LANDED_to_GRADED"
          - "state_machines.GradeAssessment.DRAFT_to_FINAL"
        distinguishing_aspect: "Bubble-up: ticket auto-transitions to GRADED only when EVERY non-voided line holds a FINAL assessment — after the first of two lines finalizes it stays LANDED; the second finalize flips it."
        test_recipe:
          setup: ["Ticket LANDED with two lines (50.00 and 25.00 kg), two DRAFT assessments"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l1_id: $.data.id } }
            - { call: "GET /dock-tickets/${t_id}", payload: {}, as: OperationsManager, captures: { t_v3: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 25.00, expected_dock_ticket_version: "${t_v3}" }, as: DockBuyer, captures: { l2_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l1_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga1_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l2_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga2_id: $.data.id } }
          trigger:
            - { call: "POST /grade-assessments/${ga1_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /dock-tickets/${t_id}", payload: {}, as: OperationsManager, captures: { mid_status: $.data.status } }
            - { call: "POST /grade-assessments/${ga2_id}/finalize", payload: {}, as: GradingInspector }
