          assert:
            - "${eng_status} == RECONCILIATION and ${eng_verified} == 900 before the trigger"
            - "hop 1: CirculationStatement.${st1_id}.discrepancy_copies == 300 and discrepancy_pct == 25.00; AuditEngagement.${eng_id}.status == REPORT_ISSUED"
            - "hop 2: CirculationStatement.${st1_id}.status == RESTATEMENT_REQUIRED"
