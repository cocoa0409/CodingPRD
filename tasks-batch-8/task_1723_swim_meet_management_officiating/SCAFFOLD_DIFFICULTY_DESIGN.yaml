            - "${pts_sd} == 5.00  # place 4 under both policies"
            - "${tot_s} == 27.00  # 9.00 + 6.50 + 6.50 + 5.00"
            - "${pts_tb} == 7.00  # TOP: each tied swimmer gets place-2 points"
            - "${pts_td} == 5.00"
            - "${tot_t} == 28.00  # 9.00 + 7.00 + 7.00 + 5.00"
            - "${tot_s} != ${tot_t}"

  # Rule 2 — combinatorial_formula (different modes: (a) multi-input non-linear, (b) nested rounding order)
  - rule_id: combinatorial_formula
    instances:
      - name: relay_tie_multiplier_depth_interaction
        grounds:
          - calculations.place_points
          - entities.Meet.fields.points_table
          - entities.Meet.fields.relay_points_multiplier
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: place (tiered table lookup), tie_count
          (pooled average branch), is_relay (multiplier branch), table depth (min-truncation) —
          relay tie at 1st pays 16.00 ((9+7)/2 pooled, then x2), 3rd pays 12.00, 4th pays 0.00
          (beyond depth-3 table) in one formula evaluation set.
        test_recipe:
          setup:
            - "Meet with points_table [9,7,6] and relay multiplier 2; one 200 Free Relay with four VERIFIED relay entries; finals 8000, 8000, 8100, 8200"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "CF1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z", points_table: [9, 7, 6], relay_points_multiplier: 2 }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "RLY", team_name: "Relayville" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 7, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE_RELAY", distance_meters: 200, is_relay: true, session_date: "2026-08-15", scheduled_start_minute: 600, scheduled_end_minute: 630 }, as: MeetDirector, captures: { ev_r: "$.data.id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "A", seed_time_cs: 9500 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_a: "$.data.id", en_a: "$.data.entry_id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "B", seed_time_cs: 9600 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_b: "$.data.id", en_b: "$.data.entry_id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "C", seed_time_cs: 9700 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_c: "$.data.id", en_c: "$.data.entry_id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "D", seed_time_cs: 9800 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_d: "$.data.id", en_d: "$.data.entry_id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_b}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_c}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_d}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev_r}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev_r}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
