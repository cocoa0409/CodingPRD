# =============================================================================
# Hospital Surgery Scheduling System — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  ## 7. Hospital Surgery Scheduling System

  **Extended System Functional Description:**

  Hospital surgery scheduling system: operating room resource pool with room-type classification, equipment availability, and specialty-room restrictions; surgery application and approval with department head review, pre-operative assessment attachment, and informed consent verification; anesthesiologist and nurse rostering with qualification matching, working-hour limits, on-call rotation, and shift handover; surgical instrument sterilization cycle with sterilization status tracking, expiration handling, and instrument-set availability check; emergency surgery insertion with priority-based preemption, automatic rescheduling of affected cases, and notification to involved staff; cost estimation and settlement with item-level fee breakdown, insurance pre-authorization, implant cost handling, and multi-payer split billing; event-driven synchronization with HIS, EMR, pharmacy, and bed management systems; audit logging for scheduling changes and approval records.

domain_name: hospital-surgery
api_prefix: /surgical-cases

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - compensating_invariants
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OperatingRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_number, type: string, source: input, description: "Hospital-internal room label, unique" }
      - { name: room_type, type: enum, source: input, description: "GENERAL_OR | CARDIAC_OR | NEURO_OR | OBSTETRIC_OR", constraints: "one of {GENERAL_OR, CARDIAC_OR, NEURO_OR, OBSTETRIC_OR}" }
      - { name: equipment_list, type: array, source: input, description: "List of equipment identifiers present in this room (e.g., ['HEART_LUNG_BYPASS','C_ARM_FLUOROSCOPE'])" }
      - { name: specialty_required, type: enum, source: input, description: "GENERAL | CARDIAC | NEURO | OBSTETRIC — only cases with matching specialty_required can be scheduled here", constraints: "one of {GENERAL, CARDIAC, NEURO, OBSTETRIC}" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 30, description: "Required gap after a case ends before the next case can start in this room (minutes, integer >= 0)" }
      - { name: hourly_rate, type: number, source: input, description: "Currency-units per hour for room cost calculation (>= 0, 2 decimal places)" }

  - name: SurgicalCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "External patient identifier (opaque string)" }
      - { name: surgery_type, type: string, source: input, description: "Free-text surgery name (e.g., 'CABG', 'Appendectomy')" }
      - { name: specialty_required, type: enum, source: input, description: "GENERAL | CARDIAC | NEURO | OBSTETRIC — must match scheduled OperatingRoom.specialty_required", constraints: "one of {GENERAL, CARDIAC, NEURO, OBSTETRIC}" }
      - { name: priority, type: enum, source: input, default: "ROUTINE", description: "ROUTINE | URGENT | EMERGENCY — drives preemption eligibility", constraints: "one of {ROUTINE, URGENT, EMERGENCY}" }
      - { name: pre_op_assessment_attached, type: boolean, source: input, default: false, description: "Set true when pre-operative assessment document is attached; required for approval" }
      - { name: informed_consent_verified, type: boolean, source: input, default: false, description: "Set true when informed consent verification is complete; required for approval" }
      - { name: planned_start_minute, type: integer, source: input, description: "Planned start time, integer minutes since epoch_minute_0; required at /schedule" }
      - { name: planned_end_minute, type: integer, source: input, description: "Planned end time; must be > planned_start_minute" }
      - { name: scheduled_room_id, type: string, source: system, description: "OperatingRoom.id assigned at /schedule; null while REQUESTED/APPROVED/REJECTED/CANCELLED-pre-schedule" }
      - { name: actual_start_minute, type: integer, source: system, description: "Set at /start, equals current_minute when /start was called" }
      - { name: actual_end_minute, type: integer, source: system, description: "Set at /complete, equals current_minute when /complete was called" }
      - { name: implant_cost_estimate, type: number, source: input, default: 0.0, description: "Estimated implant cost provided at request creation; 0.0 if no implants (>= 0, 2 decimal places)" }
      - { name: implant_cost_actual, type: number, source: input, default: null, description: "Actual implant cost recorded at /complete; if null, falls back to implant_cost_estimate" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | PREEMPTED" }
      - { name: rejected_reason, type: string, source: input, default: null, description: "Reason supplied with /reject; null otherwise" }
      - { name: preempted_at_minute, type: integer, source: system, default: null, description: "Set when status flips to PREEMPTED; equals current_minute at preemption" }
      - { name: preempted_by_case_id, type: string, source: system, default: null, description: "Id of the EMERGENCY case that triggered this preemption" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: staff_name, type: string, source: input, description: "Display name" }
      - { name: staff_role, type: enum, source: input, description: "ANESTHESIOLOGIST | SCRUB_NURSE | CIRCULATING_NURSE", constraints: "one of {ANESTHESIOLOGIST, SCRUB_NURSE, CIRCULATING_NURSE}" }
      - { name: qualifications, type: array, source: input, description: "List of specialty qualifications (subset of {GENERAL, CARDIAC, NEURO, OBSTETRIC, PEDIATRIC})" }
      - { name: hourly_rate, type: number, source: input, description: "Currency-units per hour for staff cost calculation (>= 0, 2 decimal places)" }
      - { name: shift_start_minute, type: integer, source: input, description: "Shift window start (inclusive)" }
      - { name: shift_end_minute, type: integer, source: input, description: "Shift window end (exclusive); must be > shift_start_minute" }
      - { name: on_call, type: boolean, source: input, default: false, description: "True if this staff member is currently the on-call holder for their staff_role; only one on-call holder per role at any time" }
      - { name: planned_workload_minutes, type: integer, source: computed, description: "Forward-looking workload: sum of (assigned_end_minute - assigned_start_minute) over this staff member's CaseAssignments with status in {RESERVED, CONFIRMED, COMPLETED}; recomputed on each GET /staff/{staffId}" }
      - { name: actual_workload_minutes, type: integer, source: computed, description: "Chronological workload: sum of (owning_case.actual_end_minute - owning_case.actual_start_minute) over this staff member's CaseAssignments with status == COMPLETED; recomputed on each GET /staff/{staffId}" }

  - name: CaseAssignment
    parent: SurgicalCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "Owning SurgicalCase.id" }
      - { name: staff_id, type: string, source: input, description: "Assigned StaffMember.id" }
      - { name: role_in_case, type: enum, source: input, description: "LEAD_ANESTHESIOLOGIST | SCRUB_NURSE | CIRCULATING_NURSE", constraints: "must be compatible with StaffMember.staff_role: LEAD_ANESTHESIOLOGIST requires ANESTHESIOLOGIST; SCRUB_NURSE requires SCRUB_NURSE; CIRCULATING_NURSE requires CIRCULATING_NURSE" }
      - { name: assigned_start_minute, type: integer, source: system, description: "Equals SurgicalCase.planned_start_minute at creation" }
      - { name: assigned_end_minute, type: integer, source: system, description: "Equals SurgicalCase.planned_end_minute at creation" }
      - { name: status, type: enum, source: system, description: "RESERVED → CONFIRMED → COMPLETED | RELEASED | PREEMPTED" }

  - name: InstrumentSet
    parent: null
    common_fields: true
    fields:
      - { name: set_name, type: string, source: input, description: "Instrument set label (e.g., 'GENERAL_LAPAROTOMY_TRAY')" }
      - { name: specialty, type: enum, source: input, description: "GENERAL | CARDIAC | NEURO | OBSTETRIC — instrument sets are scoped to a specialty", constraints: "one of {GENERAL, CARDIAC, NEURO, OBSTETRIC}" }
      - { name: sterilization_status, type: enum, source: system, description: "SOILED → IN_STERILIZATION → CLEAN_STERILIZED → CHECKED_OUT → SOILED (cycle); CLEAN_STERILIZED → EXPIRED on time gate; EXPIRED → IN_STERILIZATION on resterilize", constraints: "one of {SOILED, IN_STERILIZATION, CLEAN_STERILIZED, CHECKED_OUT, EXPIRED}" }
      - { name: last_sterilized_at_minute, type: integer, source: system, default: null, description: "Set when sterilization completes; null until first sterilization completes" }
      - { name: current_case_id, type: string, source: system, default: null, description: "Owning SurgicalCase.id when CHECKED_OUT; null otherwise" }
      - { name: cycle_count, type: integer, source: system, default: 0, description: "Number of completed sterilization cycles" }

  - name: InstrumentBooking
    parent: SurgicalCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "Owning SurgicalCase.id" }
      - { name: instrument_set_id, type: string, source: input, description: "Booked InstrumentSet.id" }
      - { name: status, type: enum, source: system, description: "RESERVED → CHECKED_OUT → RETURNED_SOILED | RELEASED | PREEMPTED" }

  - name: Settlement
    parent: SurgicalCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "Owning SurgicalCase.id; one Settlement per SurgicalCase" }
      - { name: status, type: enum, source: system, description: "DRAFT → PRE_AUTHORIZED → ITEMIZED → SETTLED | REFUNDED" }
      - { name: estimated_total_amount, type: number, source: computed, description: "Sum of estimated line items at /approve (forward-looking provisional_cost_estimate)" }
      - { name: final_total_amount, type: number, source: computed, default: null, description: "Sum of final line items at /complete (chronological final_settlement_cost); null until case completes" }
      - { name: line_items, type: array, source: computed, default: [], description: "Array of {description, category, fee} populated at /itemize" }
      - { name: insurance_split, type: array, source: input, default: [], description: "Array of {payer_id, percentage} (sum of percentages must equal 100, primary payer first); persisted at /itemize" }
      - { name: per_payer_amounts, type: array, source: computed, default: [], description: "Array of {payer_id, amount} computed by insurance_split_calculation at /itemize" }
      - { name: implant_cost, type: number, source: computed, default: 0.0, description: "Implant component carried into estimated/final totals" }
      - { name: refund_amount, type: number, source: computed, default: 0.0, description: "Set when status flips to REFUNDED; equals the most-recent final_total_amount or estimated_total_amount" }
      - { name: insurance_pre_auth_reference, type: string, source: input, default: null, description: "Free-text pre-auth reference recorded at /pre-authorize" }

  - name: AuditEntry
    parent: null
    common_fields: false   # immutable: id + created_at only
    fields:
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the request actor" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the request actor" }
      - { name: entity_type, type: string, source: system, description: "Affected entity (e.g., 'SurgicalCase')" }
      - { name: entity_id, type: string, source: system, description: "Affected entity id" }
      - { name: action, type: string, source: system, description: "Logical action label (e.g., 'CASE_APPROVED', 'EMERGENCY_PREEMPT', 'STERILIZATION_COMPLETED')" }
      - { name: payload, type: object, source: system, description: "Action-specific payload snapshot at the time of the event" }
      - { name: occurred_at_minute, type: integer, source: system, description: "current_minute when the event occurred" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SurgicalCase
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED, PREEMPTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /surgical-cases/{caseId}/approve"
        actor: DepartmentHead
        preconditions:
          - "SurgicalCase.pre_op_assessment_attached == true (else ERR_PRE_OP_ASSESSMENT_MISSING)"
          - "SurgicalCase.informed_consent_verified == true (else ERR_INFORMED_CONSENT_MISSING)"
        side_effects:
          - "Create Settlement with status=DRAFT, case_id=this.id, estimated_total_amount=null (becomes computed at /schedule when room+staff+instruments are pinned)"
          - "Append AuditEntry with action='CASE_APPROVED'"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /surgical-cases/{caseId}/reject"
        actor: DepartmentHead
        preconditions: []
        side_effects:
          - "Persist rejected_reason from request body"
          - "Append AuditEntry with action='CASE_REJECTED'"

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /surgical-cases/{caseId}/schedule"
        actor: Scheduler
        preconditions:
          - "OperatingRoom.specialty_required == SurgicalCase.specialty_required (else ERR_ROOM_SPECIALTY_RESTRICTED)"
          - "Each staff_id in payload has qualifications containing SurgicalCase.specialty_required (else ERR_QUALIFICATION_MISMATCH)"
          - "Each staff_id has shift_start_minute <= planned_start_minute AND shift_end_minute >= planned_end_minute (else ERR_STAFF_OUT_OF_SHIFT)"
          - "For each staff_id, sum(duration_minutes of CaseAssignments with status in {RESERVED,CONFIRMED,COMPLETED} whose [assigned_start_minute, assigned_end_minute) intersects the 1440-minute window centered at planned_start_minute) + (planned_end_minute - planned_start_minute) <= STAFF_MAX_WORKING_MINUTES_PER_DAY (else ERR_STAFF_WORKING_HOURS_EXCEEDED)"
          - "InstrumentSet.sterilization_status == CLEAN_STERILIZED (else ERR_INSTRUMENT_NOT_STERILIZED if SOILED/IN_STERILIZATION/CHECKED_OUT, ERR_INSTRUMENT_EXPIRED if EXPIRED)"
          - "InstrumentSet.specialty == SurgicalCase.specialty_required (else ERR_INSTRUMENT_SPECIALTY_MISMATCH)"
          - "No SCHEDULED/IN_PROGRESS case in scheduled_room_id whose [planned_start_minute, planned_end_minute + room.turnover_buffer_minutes) intersects [planned_start_minute, planned_end_minute + room.turnover_buffer_minutes) of this case (else ERR_ROOM_TIME_CONFLICT)"
          - "No CaseAssignment with status in {RESERVED,CONFIRMED} for any of the requested staff_ids whose [assigned_start_minute, assigned_end_minute) overlaps [planned_start_minute, planned_end_minute) (else ERR_STAFF_TIME_CONFLICT)"
          - "No InstrumentBooking with status in {RESERVED,CHECKED_OUT} for the requested instrument_set_id whose owning case [planned_start_minute, planned_end_minute) overlaps [planned_start_minute, planned_end_minute) (else ERR_INSTRUMENT_TIME_CONFLICT)"
        side_effects:
          - "Persist scheduled_room_id, planned_start_minute, planned_end_minute on the SurgicalCase"
          - "Create one CaseAssignment per requested staff_id with status=RESERVED"
          - "Create one InstrumentBooking with status=RESERVED for the requested instrument_set_id"
          - "InstrumentSet.sterilization_status: CLEAN_STERILIZED → CHECKED_OUT; current_case_id := this case.id"
          - "Settlement.estimated_total_amount := provisional_cost_estimate(this case)"
          - "Append AuditEntry with action='CASE_SCHEDULED'"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Settlement (DRAFT) → REFUNDED with refund_amount = estimated_total_amount (which is null at this point; treated as 0.0)"
          - "Append AuditEntry with action='CASE_CANCELLED'"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /surgical-cases/{caseId}/start"
        actor: Scheduler
        preconditions:
          - "All CaseAssignments for this case have status == CONFIRMED (else ERR_ASSIGNMENT_NOT_CONFIRMED)"
        side_effects:
          - "Set actual_start_minute := current_minute"
          - "InstrumentBooking RESERVED → CHECKED_OUT (instrument set is already CHECKED_OUT from /schedule; this just advances the booking-side status)"
          - "Append AuditEntry with action='CASE_STARTED'"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "All CaseAssignments for this case (status RESERVED|CONFIRMED) → RELEASED"
          - "InstrumentBooking RESERVED → RELEASED; InstrumentSet.sterilization_status CHECKED_OUT → SOILED; current_case_id := null"
          - "Settlement (DRAFT) → REFUNDED with refund_amount := estimated_total_amount"
          - "Append AuditEntry with action='CASE_CANCELLED'"

      - from: SCHEDULED
        to: PREEMPTED
        trigger: "system (cascade from POST /surgical-cases/emergency-insert)"
        actor: system
        preconditions:
          - "Triggering case has priority == EMERGENCY"
          - "This case has priority != EMERGENCY (else ERR_CANNOT_PREEMPT_EMERGENCY)"
        side_effects:
          - "Set preempted_at_minute := current_minute, preempted_by_case_id := triggering_case.id"
          - "All CaseAssignments for this case (status RESERVED|CONFIRMED) → PREEMPTED"
          - "InstrumentBooking RESERVED → PREEMPTED; InstrumentSet.sterilization_status CHECKED_OUT → SOILED; current_case_id := null"
          - "Settlement (DRAFT) → REFUNDED with refund_amount := estimated_total_amount"
          - "Append AuditEntry with action='EMERGENCY_PREEMPT'"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /surgical-cases/{caseId}/complete"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Set actual_end_minute := current_minute"
          - "All CaseAssignments for this case (CONFIRMED) → COMPLETED"
          - "InstrumentBooking CHECKED_OUT → RETURNED_SOILED; InstrumentSet.sterilization_status CHECKED_OUT → SOILED; current_case_id := null"
          - "Settlement.final_total_amount := final_settlement_cost(this case)"
          - "Append AuditEntry with action='CASE_COMPLETED'"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Set actual_end_minute := current_minute"
          - "All CaseAssignments (CONFIRMED) → RELEASED"
          - "InstrumentBooking CHECKED_OUT → RELEASED; InstrumentSet.sterilization_status CHECKED_OUT → SOILED; current_case_id := null"
          - "Settlement → REFUNDED with refund_amount := estimated_total_amount"
          - "Append AuditEntry with action='CASE_CANCELLED'"

  - entity: CaseAssignment
    initial_state: RESERVED
    terminal_states: [COMPLETED, RELEASED, PREEMPTED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /surgical-cases/{caseId}/assignments/{assignmentId}/confirm"
        actor: Scheduler
        preconditions:
          - "Owning SurgicalCase.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Append AuditEntry with action='ASSIGNMENT_CONFIRMED'"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade from SurgicalCase IN_PROGRESS → COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "system (cascade from SurgicalCase SCHEDULED → CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: RELEASED
        trigger: "system (cascade from SurgicalCase IN_PROGRESS → CANCELLED or SCHEDULED → CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: PREEMPTED
        trigger: "system (cascade from SurgicalCase SCHEDULED → PREEMPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: PREEMPTED
        trigger: "system (cascade from SurgicalCase SCHEDULED → PREEMPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InstrumentSet
    initial_state: SOILED
    terminal_states: []   # cyclic — no terminal states
    transitions:
      - from: SOILED
        to: IN_STERILIZATION
        trigger: "POST /instrument-sets/{instrumentSetId}/start-sterilization"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Append AuditEntry with action='STERILIZATION_STARTED'"

      - from: EXPIRED
        to: IN_STERILIZATION
        trigger: "POST /instrument-sets/{instrumentSetId}/start-sterilization"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Append AuditEntry with action='STERILIZATION_STARTED'"

      - from: IN_STERILIZATION
        to: CLEAN_STERILIZED
        trigger: "POST /instrument-sets/{instrumentSetId}/complete-sterilization"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Set last_sterilized_at_minute := current_minute"
          - "Increment cycle_count by 1"
          - "Append AuditEntry with action='STERILIZATION_COMPLETED'"

      - from: CLEAN_STERILIZED
        to: CHECKED_OUT
        trigger: "system (cascade from SurgicalCase APPROVED → SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set current_case_id := SurgicalCase.id"

      - from: CHECKED_OUT
        to: SOILED
        trigger: "system (cascade from SurgicalCase IN_PROGRESS → COMPLETED, SCHEDULED → CANCELLED, IN_PROGRESS → CANCELLED, or SCHEDULED → PREEMPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set current_case_id := null"

      - from: CLEAN_STERILIZED
        to: EXPIRED
        trigger: "system (auto on read or sweep when current_minute - last_sterilized_at_minute >= STERILIZATION_EXPIRY_MINUTES)"
        actor: system
        preconditions:
          - "current_minute - last_sterilized_at_minute >= 4320 (= 72 hours)"
        side_effects:
          - "Append AuditEntry with action='STERILIZATION_EXPIRED'"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [SETTLED, REFUNDED]
    transitions:
      - from: DRAFT
        to: PRE_AUTHORIZED
        trigger: "POST /settlements/{settlementId}/pre-authorize"
        actor: BillingAdmin
        preconditions:
          - "Owning SurgicalCase.status in {APPROVED, SCHEDULED, IN_PROGRESS, COMPLETED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Persist insurance_pre_auth_reference from request body"
          - "Append AuditEntry with action='SETTLEMENT_PRE_AUTHORIZED'"

      - from: PRE_AUTHORIZED
        to: ITEMIZED
        trigger: "POST /settlements/{settlementId}/itemize"
        actor: BillingAdmin
        preconditions:
          - "Owning SurgicalCase.status == COMPLETED (else ERR_CASE_NOT_COMPLETED)"
          - "Sum of insurance_split[*].percentage == 100 (else ERR_INVALID_INSURANCE_SPLIT)"
        side_effects:
          - "Persist insurance_split from request body"
          - "Compute line_items: one entry per cost component (room, staff x N, instrument, implant) using final_settlement_cost breakdown"
          - "Compute per_payer_amounts via insurance_split_calculation"
          - "Append AuditEntry with action='SETTLEMENT_ITEMIZED'"

      - from: ITEMIZED
        to: SETTLED
        trigger: "POST /settlements/{settlementId}/settle"
        actor: BillingAdmin
        preconditions:
          - "insurance_pre_auth_reference is non-null (else ERR_INSURANCE_PRE_AUTH_REQUIRED)"
        side_effects:
          - "Append AuditEntry with action='SETTLEMENT_SETTLED'"

      - from: DRAFT
        to: REFUNDED
        trigger: "system (cascade from SurgicalCase non-terminal → CANCELLED or SCHEDULED → PREEMPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set refund_amount := coalesce(final_total_amount, estimated_total_amount, 0.0)"
          - "Append AuditEntry with action='SETTLEMENT_REFUNDED'"

      - from: PRE_AUTHORIZED
        to: REFUNDED
        trigger: "system (cascade from SurgicalCase non-terminal → CANCELLED or SCHEDULED → PREEMPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set refund_amount := coalesce(final_total_amount, estimated_total_amount, 0.0)"

      - from: ITEMIZED
        to: REFUNDED
        trigger: "system (cascade from SurgicalCase IN_PROGRESS → CANCELLED — exceptional path: completed case under settlement workflow gets cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Set refund_amount := final_total_amount"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two /schedule requests target the same OperatingRoom for an overlapping window"
    guarantee: "At most one schedule succeeds; second is rejected with ERR_ROOM_TIME_CONFLICT"
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on (scheduled_room_id, planned window) — second writer observes the first's interval and fails the room-overlap precondition"

  - scenario: "Two /schedule requests both attempt to book the same InstrumentSet for an overlapping window"
    guarantee: "At most one schedule succeeds; second is rejected with ERR_INSTRUMENT_NOT_AVAILABLE"
    error_id: ERR_INSTRUMENT_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on InstrumentSet.sterilization_status flip CLEAN_STERILIZED → CHECKED_OUT — once flipped, subsequent /schedule reads CHECKED_OUT and fails ERR_INSTRUMENT_NOT_STERILIZED. ERR_INSTRUMENT_NOT_AVAILABLE applies when the instrument's current_case_id is set but sterilization_status has not yet flipped."

  - scenario: "Concurrent /approve and /reject on the same SurgicalCase"
    guarantee: "Exactly one transition wins; the loser sees status no longer REQUESTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SurgicalCase.status"

  - scenario: "Two /emergency-insert requests both attempt to preempt the same SCHEDULED case"
    guarantee: "Exactly one preemption wins; the second observes the case already in PREEMPTED and fails"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SurgicalCase.preempted_at_minute"

  - scenario: "Concurrent /schedule and /complete-sterilization on the same InstrumentSet"
    guarantee: "Exactly one wins; if /complete-sterilization runs first the schedule sees CLEAN_STERILIZED, else schedule sees IN_STERILIZATION and is rejected"
    error_id: ERR_INSTRUMENT_NOT_STERILIZED
    http_status: 409
    serialization: "First-writer-wins on InstrumentSet.sterilization_status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: provisional_cost_estimate
    trigger: "SurgicalCase APPROVED → SCHEDULED (writes Settlement.estimated_total_amount)"
    algorithm: forward_looking
    formula: |
      Let planned_duration_minutes = SurgicalCase.planned_end_minute - SurgicalCase.planned_start_minute.
      Let billable_hours = ceil(planned_duration_minutes / 60).   # whole-hour billing, rounded up
      For each cost component, compute per-component amount and round_half_up to 2 decimal places, then sum the rounded components:
        room_component   = round_half_up(billable_hours * OperatingRoom.hourly_rate, 2)
        staff_components = for each CaseAssignment in this case: round_half_up(billable_hours * StaffMember.hourly_rate, 2)
        instrument_component = round_half_up(INSTRUMENT_SET_BASE_FEE, 2)   # one set per case
        implant_component    = round_half_up(SurgicalCase.implant_cost_estimate, 2)
      Settlement.estimated_total_amount = room_component + sum(staff_components) + instrument_component + implant_component
      Settlement.implant_cost           = implant_component
    input_set: "All CaseAssignments for this case (status RESERVED at this moment), the scheduled OperatingRoom, the SurgicalCase.implant_cost_estimate, and INSTRUMENT_SET_BASE_FEE"
    constants:
      INSTRUMENT_SET_BASE_FEE: 150.00
    precision: "2 decimal places, round_half_up; per-component rounding then sum (NOT sum then round)"
    variants:
      - name: provisional
        when: "Case is in APPROVED → SCHEDULED transition; uses planned_start_minute and planned_end_minute"
        difference: "Uses planned interval to compute billable_hours; result may differ from final_settlement_cost when actual duration differs"

  - name: final_settlement_cost
    trigger: "SurgicalCase IN_PROGRESS → COMPLETED (writes Settlement.final_total_amount)"
    algorithm: chronological
    formula: |
      Let actual_duration_minutes = SurgicalCase.actual_end_minute - SurgicalCase.actual_start_minute.
      Let billable_hours_actual   = ceil(actual_duration_minutes / 60).
      Let implant_actual = SurgicalCase.implant_cost_actual if non-null else SurgicalCase.implant_cost_estimate.
      For each cost component, round_half_up to 2dp then sum:
        room_component   = round_half_up(billable_hours_actual * OperatingRoom.hourly_rate, 2)
        staff_components = for each CaseAssignment (status COMPLETED) in this case: round_half_up(billable_hours_actual * StaffMember.hourly_rate, 2)
        instrument_component = round_half_up(INSTRUMENT_SET_BASE_FEE, 2)
        implant_component    = round_half_up(implant_actual, 2)
      Settlement.final_total_amount = room_component + sum(staff_components) + instrument_component + implant_component
      Settlement.implant_cost       = implant_component
    input_set: "All CaseAssignments for this case at status COMPLETED, the scheduled OperatingRoom, SurgicalCase.implant_cost_actual (or implant_cost_estimate if actual is null), and INSTRUMENT_SET_BASE_FEE"
    constants:
      INSTRUMENT_SET_BASE_FEE: 150.00
    precision: "2 decimal places, round_half_up; per-component rounding then sum"
    variants:
      - name: final
        when: "Case has reached COMPLETED state; uses actual_start_minute and actual_end_minute"
        difference: "When actual_duration > planned_duration, final_total_amount > estimated_total_amount (and vice versa); the same Settlement therefore carries two different totals computed from the same staff/room set"

  - name: insurance_split_calculation
    trigger: "Settlement PRE_AUTHORIZED → ITEMIZED (writes Settlement.per_payer_amounts)"
    algorithm: waterfall_allocation
    formula: |
      total = Settlement.final_total_amount.
      For each entry e in Settlement.insurance_split (preserving input order; primary payer is index 0):
        per_payer_amounts[i].amount = round_half_up(total * e.percentage / 100, 2)
        per_payer_amounts[i].payer_id = e.payer_id
      remainder = total - sum(per_payer_amounts[*].amount).   # may be positive, zero, or negative due to rounding
      per_payer_amounts[0].amount = per_payer_amounts[0].amount + remainder.   # primary absorbs rounding remainder
    input_set: "Settlement.final_total_amount and Settlement.insurance_split (preserved in input order)"
    constants: {}
    precision: "2 decimal places, round_half_up per payer; primary payer absorbs the rounding remainder so sum(per_payer_amounts) == final_total_amount exactly"
    variants:
      - name: rounding_remainder_pinned
        when: "Sum of per-payer rounded amounts differs from final_total_amount by ±0.01 to ±0.0N due to half-up rounding"
        difference: "Primary payer (index 0) absorbs the entire remainder; other payers are unaffected"

  - name: staff_working_hours_window
    trigger: "Pre-check at SurgicalCase APPROVED → SCHEDULED for each requested staff_id (validation); also recomputed when reading staff usage"
    algorithm: aggregation
    formula: |
      For staff_id S and reference_minute R = planned_start_minute of the schedule under evaluation:
        window_start = R - 720
        window_end   = R + 720
        existing_minutes = sum of (assigned_end_minute - assigned_start_minute) over CaseAssignments where:
          - staff_id == S
          - status in {RESERVED, CONFIRMED, COMPLETED}
          - [assigned_start_minute, assigned_end_minute) intersects [window_start, window_end)
        new_minutes = planned_end_minute - planned_start_minute   # duration of the schedule under evaluation
        total = existing_minutes + new_minutes
      Reject when total > STAFF_MAX_WORKING_MINUTES_PER_DAY.
    input_set: "All CaseAssignments for the staff member with status RESERVED, CONFIRMED, or COMPLETED whose [assigned_start_minute, assigned_end_minute) overlaps the 1440-minute window centered at the candidate planned_start_minute"
    constants:
      STAFF_MAX_WORKING_MINUTES_PER_DAY: 720   # 12 hours

  - name: room_turnover_buffer_check
    trigger: "Pre-check at SurgicalCase APPROVED → SCHEDULED for the requested room"
    algorithm: interval_merge
    formula: |
      For new case N with room R and interval [N.start, N.end):
        For every existing SurgicalCase E in {SCHEDULED, IN_PROGRESS} with scheduled_room_id == R:
          E_window = [E.planned_start_minute, E.planned_end_minute + R.turnover_buffer_minutes)
          N_window = [N.planned_start_minute, N.planned_end_minute + R.turnover_buffer_minutes)
          If E_window intersects N_window: REJECT with ERR_ROOM_TIME_CONFLICT.
        Otherwise the new schedule is accepted.
      Boundary semantics (closed-gap): E.planned_end_minute + R.turnover_buffer_minutes <= N.planned_start_minute is the exact tie boundary that PASSES.
    input_set: "All SurgicalCases with status SCHEDULED or IN_PROGRESS that share scheduled_room_id with the candidate case"

  - name: emergency_preemption_selector
    trigger: "POST /surgical-cases/emergency-insert"
    algorithm: selector
    formula: |
      Eligibility filter: SurgicalCase E is preemptable iff:
        - E.status in {SCHEDULED, IN_PROGRESS}? — only SCHEDULED is preemptable (IN_PROGRESS cases are protected; emergency must wait or use a different room)
        - E.priority != EMERGENCY (else ERR_CANNOT_PREEMPT_EMERGENCY for any conflict-only-with-emergency-cases attempt)
        - And at least one of:
            (i)   E.scheduled_room_id == new_case.scheduled_room_id
                  AND time_overlap_with_buffer(E, new_case, room.turnover_buffer_minutes);
            (ii)  E shares a CaseAssignment.staff_id with new_case AND time_overlap(E, new_case);
            (iii) E shares an InstrumentBooking.instrument_set_id with new_case AND time_overlap(E, new_case).
      Action: All eligible E are PREEMPTED in a single atomic step. There is no ranking — every eligible case is preempted.
      Empty-pool fallback: If no eligible E exist, the new emergency case is scheduled directly (status APPROVED → SCHEDULED in one step) without any preemption.
      If any conflicting case has priority == EMERGENCY, the entire emergency-insert request is rejected with ERR_CANNOT_PREEMPT_EMERGENCY (no partial preemption).
    input_set: "All SurgicalCases at status SCHEDULED whose room/staff/instrument overlap the new emergency case"
    note: "EMERGENCY priority is a fixed protected class; no other priority preempts EMERGENCY."

  - name: staff_workload_planned
    trigger: "GET /staff/{staffId} (computed at read time, not persisted)"
    algorithm: forward_looking
    formula: |
      For staff member S:
        planned_workload_minutes = sum(assigned_end_minute - assigned_start_minute)
          over CaseAssignments with staff_id == S.id AND status in {RESERVED, CONFIRMED, COMPLETED}.
      Notes:
        - Counts every still-on-the-books assignment, including those not yet started.
        - RELEASED and PREEMPTED assignments are excluded (they no longer represent committed staff time).
    input_set: "All CaseAssignments for this staff member with status in {RESERVED, CONFIRMED, COMPLETED}"
    constants: {}
    variants:
      - name: forward_looking
        when: "Computed any time the staff member is read"
        difference: "Includes RESERVED and CONFIRMED assignments — staff time that is committed but not yet executed"

  - name: staff_workload_actual
    trigger: "GET /staff/{staffId} (computed at read time, not persisted)"
    algorithm: chronological
    formula: |
      For staff member S:
        actual_workload_minutes = sum(case.actual_end_minute - case.actual_start_minute)
          over CaseAssignments with staff_id == S.id AND status == COMPLETED, joining each assignment to its owning SurgicalCase.
      Notes:
        - Counts only assignments that finished, using the case's recorded actual interval (not the planned interval).
        - When actual interval differs from planned interval, this value differs from planned_workload_minutes — the same staff member therefore carries two different workload totals computed from the same ground-truth set of assignments.
    input_set: "All CaseAssignments for this staff member with status == COMPLETED"
    constants: {}
    variants:
      - name: chronological
        when: "Computed any time the staff member is read"
        difference: "Includes only COMPLETED assignments and uses each case's actual_start_minute / actual_end_minute, so an assignment whose case ran longer than planned contributes more minutes here than its planned-duration peer in staff_workload_planned"

  - name: sterilization_expiration_check
    trigger: "GET /instrument-sets/{instrumentSetId}; POST /_sweep/sterilization; pre-check at SurgicalCase APPROVED → SCHEDULED"
    algorithm: threshold
    formula: |
      For InstrumentSet I:
        if I.sterilization_status == CLEAN_STERILIZED
           AND I.last_sterilized_at_minute is non-null
           AND (current_minute - I.last_sterilized_at_minute) >= STERILIZATION_EXPIRY_MINUTES:
          I.sterilization_status := EXPIRED.
      Boundary: elapsed exactly == 4320 -> EXPIRED (>=, inclusive). Elapsed == 4319 -> remains CLEAN_STERILIZED.
    constants:
      STERILIZATION_EXPIRY_MINUTES: 4320   # 72 hours

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in path resolve, validated left-to-right (caseId before assignmentId, etc.); first miss returns its specific NOT_FOUND"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (per resource: ERR_CASE_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INSTRUMENT_SET_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "All entity ids referenced in request body resolve (room_id, staff_ids, instrument_set_id) — first miss returns its specific NOT_FOUND in input order"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 5
    category: state
    check: "Target SurgicalCase / Settlement / InstrumentSet must be in the correct state for the requested transition"
    error_id: "varies (ERR_CASE_NOT_REQUESTED, ERR_CASE_NOT_APPROVED, ERR_CASE_NOT_SCHEDULED, ERR_CASE_NOT_IN_PROGRESS, ERR_CASE_NOT_COMPLETED, ERR_INSTRUMENT_NOT_STERILIZED, ERR_INSTRUMENT_EXPIRED, ERR_INVALID_STATE)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "All CaseAssignments for this case must be CONFIRMED before /start"
    error_id: ERR_ASSIGNMENT_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/start"

  - priority: 7
    category: business_safety
    check: "pre_op_assessment_attached must be true at /approve"
    error_id: ERR_PRE_OP_ASSESSMENT_MISSING
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/approve"

  - priority: 8
    category: business_safety
    check: "informed_consent_verified must be true at /approve"
    error_id: ERR_INFORMED_CONSENT_MISSING
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/approve"

  - priority: 9
    category: business_safety
    check: "Each requested staff_id has SurgicalCase.specialty_required in their qualifications"
    error_id: ERR_QUALIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 10
    category: business_safety
    check: "Each requested staff_id has shift_start_minute <= planned_start_minute and shift_end_minute >= planned_end_minute"
    error_id: ERR_STAFF_OUT_OF_SHIFT
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 11
    category: business_safety
    check: "Each requested staff_id's role_in_case is compatible with StaffMember.staff_role"
    error_id: ERR_STAFF_ROLE_MISMATCH
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 12
    category: business_referential
    check: "OperatingRoom.specialty_required matches SurgicalCase.specialty_required"
    error_id: ERR_ROOM_SPECIALTY_RESTRICTED
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 13
    category: business_referential
    check: "InstrumentSet.specialty matches SurgicalCase.specialty_required"
    error_id: ERR_INSTRUMENT_SPECIALTY_MISMATCH
    http_status: 400
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 14
    category: business_temporal
    check: "Room turnover-buffer overlap test: existing case window [start, end+buffer) must not intersect new case window"
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/schedule"

  - priority: 15
    category: business_temporal
    check: "Each requested staff_id has no overlapping CaseAssignment in {RESERVED,CONFIRMED} during [planned_start_minute, planned_end_minute)"
    error_id: ERR_STAFF_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/schedule"

  - priority: 16
    category: business_temporal
    check: "Requested instrument_set_id has no overlapping InstrumentBooking in {RESERVED,CHECKED_OUT}"
    error_id: ERR_INSTRUMENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/schedule"

  - priority: 17
    category: business_constraint
    check: "Sum of staff working minutes within 1440-minute window centered at planned_start_minute, including the new schedule, must be <= STAFF_MAX_WORKING_MINUTES_PER_DAY (720)"
    error_id: ERR_STAFF_WORKING_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /surgical-cases/{caseId}/schedule, POST /surgical-cases/emergency-insert"

  - priority: 18
    category: business_constraint
    check: "Emergency-insert may not preempt any case with priority == EMERGENCY"
    error_id: ERR_CANNOT_PREEMPT_EMERGENCY
    http_status: 409
    applies_to: "POST /surgical-cases/emergency-insert"

  - priority: 19
    category: business_fiscal
    check: "Sum of insurance_split[*].percentage at /itemize must equal 100"
    error_id: ERR_INVALID_INSURANCE_SPLIT
    http_status: 400
    applies_to: "POST /settlements/{settlementId}/itemize"

  - priority: 20
    category: business_fiscal
    check: "Settlement.insurance_pre_auth_reference must be non-null at /settle"
    error_id: ERR_INSURANCE_PRE_AUTH_REQUIRED
    http_status: 402
    applies_to: "POST /settlements/{settlementId}/settle"

  - priority: 21
    category: business_constraint
    check: "Request.version (when provided) must equal current entity.version (optimistic concurrency)"
    error_id: ERR_STALE_DATA
    http_status: 409
    applies_to: "all mutation endpoints accepting `version`"

  - priority: 22
    category: business_constraint
    check: "Request body fields have correct types and required fields are present (planned_end_minute > planned_start_minute, percentages in [0,100], etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- OperatingRoom ---
  - method: POST
    path: "/operating-rooms"
    description: "Create a new OperatingRoom"
    roles: [Scheduler]
    code: 201
    input: [room_number, room_type, equipment_list, specialty_required, turnover_buffer_minutes, hourly_rate]
    output: OperatingRoom
    side_effects: []

  - method: GET
    path: "/operating-rooms"
    description: "List operating rooms"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OperatingRoom[]"
    side_effects: []

  - method: GET
    path: "/operating-rooms/{roomId}"
    description: "Get a specific operating room"
    roles: [Any]
    code: 200
    input: []
    output: OperatingRoom
    side_effects: []

  # --- SurgicalCase ---
  - method: POST
    path: "/surgical-cases"
    description: "Create a new SurgicalCase request"
    roles: [SurgicalCoordinator]
    code: 201
    input: [patient_id, surgery_type, specialty_required, "priority?", "pre_op_assessment_attached?", "informed_consent_verified?", "implant_cost_estimate?"]
    output: SurgicalCase
    side_effects: ["status initialized to REQUESTED; AuditEntry action='CASE_REQUESTED'"]

  - method: GET
    path: "/surgical-cases"
    description: "List surgical cases"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SurgicalCase[]"
    side_effects: []

  - method: GET
    path: "/surgical-cases/{caseId}"
    description: "Get a specific surgical case"
    roles: [Any]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []

  - method: POST
    path: "/surgical-cases/{caseId}/approve"
    description: "Department head approves a case (REQUESTED → APPROVED)"
    roles: [DepartmentHead]
    code: 200
    input: ["version?"]
    output: SurgicalCase
    side_effects: ["Settlement created in DRAFT; AuditEntry action='CASE_APPROVED'"]

  - method: POST
    path: "/surgical-cases/{caseId}/reject"
    description: "Department head rejects a case (REQUESTED → REJECTED)"
    roles: [DepartmentHead]
    code: 200
    input: ["rejected_reason?", "version?"]
    output: SurgicalCase
    side_effects: ["AuditEntry action='CASE_REJECTED'"]

  - method: POST
    path: "/surgical-cases/{caseId}/schedule"
    description: "Schedule an APPROVED case onto a room with staff and instrument set"
    roles: [Scheduler]
    code: 200
    input: [scheduled_room_id, planned_start_minute, planned_end_minute, "staff_assignments (list of {staff_id, role_in_case})", instrument_set_id, "version?"]
    output: SurgicalCase
    side_effects:
      - "Persist scheduled_room_id, planned_start_minute, planned_end_minute"
      - "Create CaseAssignments (RESERVED) and InstrumentBooking (RESERVED)"
      - "InstrumentSet CLEAN_STERILIZED → CHECKED_OUT; current_case_id := this case.id"
      - "Settlement.estimated_total_amount := provisional_cost_estimate"
      - "AuditEntry action='CASE_SCHEDULED'"

  - method: POST
    path: "/surgical-cases/{caseId}/start"
    description: "Begin surgery (SCHEDULED → IN_PROGRESS)"
    roles: [Scheduler]
    code: 200
    input: ["version?"]
    output: SurgicalCase
    side_effects:
      - "actual_start_minute := current_minute"
      - "InstrumentBooking RESERVED → CHECKED_OUT"
      - "AuditEntry action='CASE_STARTED'"

  - method: POST
    path: "/surgical-cases/{caseId}/complete"
    description: "Complete surgery (IN_PROGRESS → COMPLETED)"
    roles: [Scheduler]
    code: 200
    input: ["implant_cost_actual?", "version?"]
    output: SurgicalCase
    side_effects:
      - "actual_end_minute := current_minute; persist implant_cost_actual if provided"
      - "CaseAssignments CONFIRMED → COMPLETED"
      - "InstrumentBooking CHECKED_OUT → RETURNED_SOILED; InstrumentSet → SOILED"
      - "Settlement.final_total_amount := final_settlement_cost"
      - "AuditEntry action='CASE_COMPLETED'"

  - method: POST
    path: "/surgical-cases/{caseId}/cancel"
    description: "Cancel a non-terminal case (APPROVED|SCHEDULED|IN_PROGRESS → CANCELLED) with cascade refund"
    roles: [Scheduler]
    code: 200
    input: ["version?"]
    output: SurgicalCase
    side_effects:
      - "All CaseAssignments → RELEASED; InstrumentBooking → RELEASED; InstrumentSet → SOILED"
      - "Settlement → REFUNDED with refund_amount := coalesce(final_total_amount, estimated_total_amount, 0.0)"
      - "AuditEntry action='CASE_CANCELLED'"

  - method: POST
    path: "/surgical-cases/emergency-insert"
    description: "Insert an EMERGENCY priority case directly with preemption of conflicting non-EMERGENCY SCHEDULED cases"
    roles: [Scheduler]
    code: 201
    input: [patient_id, surgery_type, specialty_required, scheduled_room_id, planned_start_minute, planned_end_minute, "staff_assignments", instrument_set_id, "implant_cost_estimate?"]
    output: SurgicalCase
    side_effects:
      - "Create new SurgicalCase with priority=EMERGENCY, status=APPROVED then SCHEDULED in one transaction (pre_op_assessment_attached and informed_consent_verified are forced to true on emergency-insert)"
      - "Run emergency_preemption_selector and cascade-preempt every eligible case (their CaseAssignments → PREEMPTED, InstrumentBooking → PREEMPTED, InstrumentSet → SOILED, Settlement → REFUNDED)"
      - "Reject entire request with ERR_CANNOT_PREEMPT_EMERGENCY if any conflicting case has priority == EMERGENCY"
      - "AuditEntry action='EMERGENCY_INSERTED' for the new case; AuditEntry action='EMERGENCY_PREEMPT' for each preempted case"

  # --- CaseAssignment ---
  - method: GET
    path: "/surgical-cases/{caseId}/assignments"
    description: "List assignments for a case"
    roles: [Any]
    code: 200
    input: []
    output: "CaseAssignment[]"
    side_effects: []

  - method: POST
    path: "/surgical-cases/{caseId}/assignments/{assignmentId}/confirm"
    description: "Confirm a RESERVED assignment (RESERVED → CONFIRMED)"
    roles: [Scheduler]
    code: 200
    input: ["version?"]
    output: CaseAssignment
    side_effects: ["AuditEntry action='ASSIGNMENT_CONFIRMED'"]

  # --- StaffMember ---
  - method: POST
    path: "/staff"
    description: "Create a staff roster entry"
    roles: [Scheduler]
    code: 201
    input: [staff_name, staff_role, qualifications, hourly_rate, shift_start_minute, shift_end_minute, "on_call?"]
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff"
    description: "List staff"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "staff_role?"]
    output: "StaffMember[]"
    side_effects: []

  - method: GET
    path: "/staff/{staffId}"
    description: "Get a specific staff member"
    roles: [Any]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # --- InstrumentSet ---
  - method: POST
    path: "/instrument-sets"
    description: "Create an instrument set (initial state SOILED)"
    roles: [Scheduler]
    code: 201
    input: [set_name, specialty]
    output: InstrumentSet
    side_effects: ["sterilization_status := SOILED"]

  - method: GET
    path: "/instrument-sets"
    description: "List instrument sets — also auto-applies sterilization expiration on read"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "sterilization_status?"]
    output: "InstrumentSet[]"
    side_effects: ["For each set in CLEAN_STERILIZED with elapsed >= 4320 min: status → EXPIRED"]

  - method: GET
    path: "/instrument-sets/{instrumentSetId}"
    description: "Get a specific instrument set — auto-applies sterilization expiration on read"
    roles: [Any]
    code: 200
    input: []
    output: InstrumentSet
    side_effects: ["If CLEAN_STERILIZED and elapsed >= 4320: status → EXPIRED"]

  - method: POST
    path: "/instrument-sets/{instrumentSetId}/start-sterilization"
    description: "Begin sterilization (SOILED|EXPIRED → IN_STERILIZATION)"
    roles: [Scheduler]
    code: 200
    input: ["version?"]
    output: InstrumentSet
    side_effects: ["AuditEntry action='STERILIZATION_STARTED'"]

  - method: POST
    path: "/instrument-sets/{instrumentSetId}/complete-sterilization"
    description: "Complete sterilization (IN_STERILIZATION → CLEAN_STERILIZED); sets last_sterilized_at_minute := current_minute and increments cycle_count"
    roles: [Scheduler]
    code: 200
    input: ["version?"]
    output: InstrumentSet
    side_effects: ["AuditEntry action='STERILIZATION_COMPLETED'"]

  # --- Settlement ---
  - method: GET
    path: "/settlements"
    description: "List settlements"
    roles: [Any, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get a specific settlement"
    roles: [Any, BillingAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/settlements/{settlementId}/pre-authorize"
    description: "Record insurance pre-authorization (DRAFT → PRE_AUTHORIZED)"
    roles: [BillingAdmin]
    code: 200
    input: [insurance_pre_auth_reference, "version?"]
    output: Settlement
    side_effects: ["AuditEntry action='SETTLEMENT_PRE_AUTHORIZED'"]

  - method: POST
    path: "/settlements/{settlementId}/itemize"
    description: "Compute line items and per-payer split (PRE_AUTHORIZED → ITEMIZED); requires owning case in COMPLETED"
    roles: [BillingAdmin]
    code: 200
    input: [insurance_split, "version?"]
    output: Settlement
    side_effects:
      - "Compute and persist line_items"
      - "Compute and persist per_payer_amounts via insurance_split_calculation"
      - "AuditEntry action='SETTLEMENT_ITEMIZED'"

  - method: POST
    path: "/settlements/{settlementId}/settle"
    description: "Mark settlement settled (ITEMIZED → SETTLED); requires non-null insurance_pre_auth_reference"
    roles: [BillingAdmin]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["AuditEntry action='SETTLEMENT_SETTLED'"]

  # --- AuditEntry ---
  - method: GET
    path: "/audit-entries"
    description: "List audit entries (immutable append-only); supports filters by entity_type, entity_id, action"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "entity_type?", "entity_id?", "action?"]
    output: "AuditEntry[]"
    side_effects: []

  # --- Test-driving endpoints (clock + sweep) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's current_minute (testing endpoint to drive time-gated transitions)"
    roles: [Scheduler]
    code: 200
    input: [delta_minutes]
    output: "object {current_minute}"
    side_effects: ["current_minute := current_minute + delta_minutes (delta_minutes must be > 0)"]

  - method: POST
    path: "/_sweep/sterilization"
    description: "Force a sterilization-expiration sweep across all CLEAN_STERILIZED instrument sets (testing/admin endpoint)"
    roles: [Scheduler]
    code: 200
    input: []
    output: "object {expired_count}"
    side_effects: ["Every CLEAN_STERILIZED set with elapsed >= 4320 min has status → EXPIRED; AuditEntry action='STERILIZATION_EXPIRED' per affected set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or empty"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role lacks permission for this operation per RBAC matrix"

  # Existence
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "SurgicalCase with given caseId does not exist"

  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "OperatingRoom with given id does not exist"

  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "StaffMember with given id does not exist"

  - id: ERR_INSTRUMENT_SET_NOT_FOUND
    http: 404
    condition: "InstrumentSet with given id does not exist"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "CaseAssignment with given id does not exist (or does not belong to the path's case)"

  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "InstrumentBooking with given id does not exist"

  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "Settlement with given id does not exist"

  # State
  - id: ERR_CASE_NOT_REQUESTED
    http: 409
    condition: "approve/reject requires SurgicalCase in REQUESTED state"

  - id: ERR_CASE_NOT_APPROVED
    http: 409
    condition: "schedule requires SurgicalCase in APPROVED state"

  - id: ERR_CASE_NOT_SCHEDULED
    http: 409
    condition: "start requires SurgicalCase in SCHEDULED state"

  - id: ERR_CASE_NOT_IN_PROGRESS
    http: 409
    condition: "complete requires SurgicalCase in IN_PROGRESS state"

  - id: ERR_CASE_NOT_COMPLETED
    http: 409
    condition: "Settlement /itemize requires owning SurgicalCase in COMPLETED state"

  - id: ERR_CASE_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires SurgicalCase in a non-terminal state"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic illegal state transition (covers race losers and unspecified illegal transitions)"

  - id: ERR_ASSIGNMENT_NOT_CONFIRMED
    http: 409
    condition: "Cannot start case while one or more CaseAssignments are still RESERVED"

  - id: ERR_INSTRUMENT_NOT_STERILIZED
    http: 409
    condition: "Instrument set is not in CLEAN_STERILIZED at time of /schedule (it is SOILED, IN_STERILIZATION, or CHECKED_OUT)"

  - id: ERR_INSTRUMENT_EXPIRED
    http: 409
    condition: "Instrument set is in EXPIRED state at time of /schedule (sterilization elapsed >= 72 hours)"

  - id: ERR_INSTRUMENT_NOT_AVAILABLE
    http: 409
    condition: "Instrument set is currently checked-out to another case"

  # Business Safety / Compliance
  - id: ERR_PRE_OP_ASSESSMENT_MISSING
    http: 400
    condition: "/approve fails: pre_op_assessment_attached is false"

  - id: ERR_INFORMED_CONSENT_MISSING
    http: 400
    condition: "/approve fails: informed_consent_verified is false"

  - id: ERR_QUALIFICATION_MISMATCH
    http: 400
    condition: "Requested staff member's qualifications do not include the case specialty"

  - id: ERR_STAFF_OUT_OF_SHIFT
    http: 400
    condition: "Requested staff member's shift window does not cover [planned_start_minute, planned_end_minute]"

  - id: ERR_STAFF_ROLE_MISMATCH
    http: 400
    condition: "role_in_case is incompatible with StaffMember.staff_role (e.g., LEAD_ANESTHESIOLOGIST requested for a SCRUB_NURSE)"

  - id: ERR_ROOM_SPECIALTY_RESTRICTED
    http: 400
    condition: "OperatingRoom.specialty_required does not match SurgicalCase.specialty_required"

  - id: ERR_INSTRUMENT_SPECIALTY_MISMATCH
    http: 400
    condition: "InstrumentSet.specialty does not match SurgicalCase.specialty_required"

  # Business Temporal
  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: "New schedule's room window (including turnover_buffer_minutes after end) intersects an existing case's window in the same room"

  - id: ERR_STAFF_TIME_CONFLICT
    http: 409
    condition: "Requested staff member already has a CaseAssignment overlapping the new window"

  - id: ERR_INSTRUMENT_TIME_CONFLICT
    http: 409
    condition: "Requested instrument set already has an InstrumentBooking overlapping the new window"

  # Business Constraint
  - id: ERR_STAFF_WORKING_HOURS_EXCEEDED
    http: 422
    condition: "Adding the new schedule would push staff member's working minutes within a 1440-minute window above STAFF_MAX_WORKING_MINUTES_PER_DAY (720)"

  - id: ERR_CANNOT_PREEMPT_EMERGENCY
    http: 409
    condition: "emergency-insert conflicts with an existing case whose priority == EMERGENCY"

  # Business Fiscal
  - id: ERR_INVALID_INSURANCE_SPLIT
    http: 400
    condition: "Sum of insurance_split[*].percentage at /itemize is not exactly 100"

  - id: ERR_INSURANCE_PRE_AUTH_REQUIRED
    http: 402
    condition: "/settle requires Settlement.insurance_pre_auth_reference to be non-null"

  # Validation / Concurrency
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body has missing required fields, type mismatches, or invalid value ranges (planned_end_minute <= planned_start_minute, negative minutes, percentage outside [0,100], etc.)"

  - id: ERR_INVALID_TIME_PARAMETERS
    http: 400
    condition: "Time parameters fail invariants (planned_end_minute must be > planned_start_minute; shift_end_minute must be > shift_start_minute; delta_minutes must be > 0)"

  - id: ERR_STALE_DATA
    http: 409
    condition: "Request.version does not match current entity.version (optimistic concurrency)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SurgicalCoordinator
    description: "Front-line scheduling assistant who creates new case requests on behalf of surgeons"
    identity: opaque
    exclusive_operations:
      - "POST /surgical-cases — Create case (REQUESTED)"
    shared_operations: []

  - name: DepartmentHead
    description: "Department head responsible for clinical approval of case requests"
    identity: opaque
    exclusive_operations:
      - "POST /surgical-cases/{caseId}/approve — Approve case (REQUESTED → APPROVED)"
      - "POST /surgical-cases/{caseId}/reject — Reject case (REQUESTED → REJECTED)"
    shared_operations: []

  - name: Scheduler
    description: "Operating-room scheduling coordinator responsible for resource allocation, lifecycle transitions, sterilization tracking, and emergency insertion"
    identity: opaque
    exclusive_operations:
      - "POST /operating-rooms — Create operating room"
      - "POST /staff — Create staff roster entry"
      - "POST /instrument-sets — Create instrument set"
      - "POST /instrument-sets/{instrumentSetId}/start-sterilization — Begin sterilization"
      - "POST /instrument-sets/{instrumentSetId}/complete-sterilization — Complete sterilization"
      - "POST /surgical-cases/{caseId}/schedule — Schedule a case"
      - "POST /surgical-cases/{caseId}/start — Begin surgery"
      - "POST /surgical-cases/{caseId}/complete — Complete surgery"
      - "POST /surgical-cases/{caseId}/cancel — Cancel a case"
      - "POST /surgical-cases/{caseId}/assignments/{assignmentId}/confirm — Confirm assignment"
      - "POST /surgical-cases/emergency-insert — Insert emergency case"
      - "POST /_clock/advance — Advance simulation clock"
      - "POST /_sweep/sterilization — Force sterilization expiration sweep"
    shared_operations: []

  - name: BillingAdmin
    description: "Billing and revenue-cycle administrator handling pre-auth, itemization, and settlement"
    identity: opaque
    exclusive_operations:
      - "POST /settlements/{settlementId}/pre-authorize"
      - "POST /settlements/{settlementId}/itemize"
      - "POST /settlements/{settlementId}/settle"
    shared_operations:
      - "GET /settlements — List settlements"
      - "GET /settlements/{settlementId} — Get settlement"

  - name: Any
    description: "Any authenticated role (for read-only endpoints)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /operating-rooms"
      - "GET /operating-rooms/{roomId}"
      - "GET /surgical-cases"
      - "GET /surgical-cases/{caseId}"
      - "GET /surgical-cases/{caseId}/assignments"
      - "GET /staff"
      - "GET /staff/{staffId}"
      - "GET /instrument-sets"
      - "GET /instrument-sets/{instrumentSetId}"
      - "GET /settlements"
      - "GET /settlements/{settlementId}"
      - "GET /audit-entries"
