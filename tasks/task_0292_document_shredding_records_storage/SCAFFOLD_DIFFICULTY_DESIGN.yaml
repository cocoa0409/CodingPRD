        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - entities.ServiceOrder.fields.order_charge_cents
          - entities.ServiceOrder.fields.billed_weight_kg
          - calculations.destruction_charge
        distinguishing_aspect: "A different conserved quantity (provisional charge cents, not container count): canceling from SCHEDULED zeroes order_charge_cents and billed_weight_kg, fully reversing the provisional 4900-cent estimate so no phantom charge persists."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; ON_SITE SCHEDULED order over two CONSOLE (est weight 80) -> provisional order_charge_cents 4900; never dispatched"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Inv2", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 30, tare_weight_kg: 5.0 }
              as: AccountManager
              captures: { c2: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}", "${c2}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { order_id: $.data.id, charge_before: $.data.order_charge_cents }
          trigger:
            - call: "POST /service-orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
              captures: { charge_after: $.data.order_charge_cents }
          assert:
            - "the provisional charge_before captured at create == 4900"
            - "ServiceOrder.${order_id}.order_charge_cents == 0"
            - "ServiceOrder.${order_id}.billed_weight_kg == 0"
            - "ServiceOrder.${order_id}.status == CANCELLED"
