# =============================================================================
# PRD Benchmark Scaffold — Residential PACE Energy-Improvement Financing
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2568. Residential PACE Energy-Improvement Financing (Ygrene Energy Fund):
  property-based eligibility (equity, tax payment history, mortgage lien position),
  eligible product list & savings-to-investment ratio test, contractor enrollment
  and workmanship recourse, assessment amortization onto the county property tax
  roll, lender consent & mortgage holder notification, three-day right of
  rescission and oral confirmation call, completion certificate before funds
  release to contractor, delinquency and tax-lien priority handling, assessment
  transfer at property sale

domain_name: residential-pace-financing
api_prefix: /pace

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: flat
  # Every business collection is a peer at /pace/<collection>; parents are reached
  # through FK fields in request bodies, never through nested ownership URLs. The
  # only nested segments are action sub-paths (/{id}/submit) and the installment
  # ledger that has no independent identity outside its Assessment.

  state_machine_shape: branching
  # Branching is the dominant shape (underwrite forks into CONSENT_PENDING /
  # NEEDS_CURE / DECLINED; adjudication forks into remedy / denial / recourse),
  # layered with two revision cycles (Application UNDER_REVIEW <-> NEEDS_CURE,
  # Contractor ENROLLED <-> PROBATION) and one entity carrying two independent
  # state axes (Assessment.billing_status x Assessment.lien_status).

  relationship_patterns:
    - one_to_many          # Property -> MortgageLien, Assessment -> AmortizationInstallment
    - self_referential     # Application.supersedes_application_id -> Application.id
    - cross_aggregate      # Disbursement -> CompletionCertificate, Assessment -> Application
    - polymorphic: false

  role_model: segregation_of_duties
  # The analyst who underwrites an Application may not approve it, and the funding
  # officer who verified a CompletionCertificate may not release its Disbursement.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 53 endpoints / 12 calculations / 11 state machines. The surface is
  # wide because the domain has four independent actors writing to one parcel
  # (homeowner, contractor, program underwriting/funding, county tax collector),
  # but the difficulty is concentrated in the coupling: one parcel's committed
  # principal is a conserved quantity across eight endpoints, and the same three
  # numbers (CLTV, SIR, financed amount) are computed twice under two different
  # bases.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: apn
        type: string
        source: input
        description: "Assessor parcel number; unique per county_code"
        constraints: "1-32 chars; unique on (county_code, apn)"
      - name: county_code
        type: enum
        source: input
        description: "County that maintains the tax roll this parcel sits on"
        constraints: "one of 06073 (San Diego CA), 06037 (Los Angeles CA), 12086 (Miami-Dade FL); 06073 and 06037 permit deemed lender consent, 12086 requires written consent"
      - name: owner_full_name
        type: string
        source: input
        description: "Current record owner of the parcel"
      - name: owner_birth_date
        type: string
        source: input
        description: "Record owner date of birth (YYYY-MM-DD); drives the oral-confirmation-call requirement"
      - name: owner_email
        type: string
        source: input
        description: "Record owner contact email"
      - name: preferred_language
        type: enum
        source: input
        description: "Language the owner elected for disclosures"
        default: "EN"
        constraints: "EN | ES"
      - name: occupancy_type
        type: enum
        source: input
        description: "Occupancy classification of the parcel"
        constraints: "OWNER_OCCUPIED | RENTAL | VACANT"
      - name: assessed_value_cents
        type: integer
        source: input
        description: "County-assessed value; the default valuation basis for eligibility"
        constraints: ">= 1"
      - name: market_value_cents
        type: integer
        source: input
        description: "Appraised market value; null until an appraisal is filed via PATCH /pace/properties/{id}/valuation"
        default: null
      - name: appraisal_effective_on
        type: string
        source: input
        description: "Effective date (YYYY-MM-DD) of the appraisal backing market_value_cents; null when no appraisal is on file"
        default: null
      - name: annual_property_tax_cents
        type: integer
        source: input
        description: "Current annual ad-valorem property tax billed on the parcel"
        constraints: ">= 0"
      - name: tax_delinquency_count_36m
        type: integer
        source: input
        description: "Count of property-tax delinquencies recorded on this parcel in the trailing 36 months; the system increments this by 1 whenever an Assessment on this parcel enters lien_status LIEN_SALE_REFERRED"
        default: 0
        constraints: ">= 0"
      - name: in_bankruptcy
        type: boolean
        source: input
        description: "True when the record owner has an undischarged bankruptcy filing"
        default: false
      - name: senior_lien_balance_cents
        type: integer
        source: computed
        description: "Sum of MortgageLien.current_balance_cents over liens of this property with status == ACTIVE; 0 when that set is empty"
      - name: equity_ratio_bps
        type: integer
        source: computed
        description: "10000 - round_half_up(senior_lien_balance_cents / assessed_value_cents * 10000)"
      - name: recorded_pace_principal_cents
        type: integer
        source: computed
        description: "Sum of Assessment.principal_balance_cents over Assessments of this property with billing_status IN {PENDING_ROLL, ON_ROLL}"
      - name: committed_pace_principal_cents
        type: integer
        source: computed
        description: "recorded_pace_principal_cents + sum of FinancingAgreement.financed_amount_cents over agreements whose application.property_id == this property and whose status IN {SIGNED, EFFECTIVE}; conserved quantity of the sign/rescind compensating pair"

  - name: MortgageLien
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel this mortgage lien encumbers"
      - name: holder_name
        type: string
        source: input
        description: "Mortgage holder of record entitled to PACE notification"
      - name: lien_position
        type: integer
        source: input
        description: "Recording priority of this lien (1 = first position)"
        constraints: ">= 1; unique among liens of the same property with status == ACTIVE"
      - name: current_balance_cents
        type: integer
        source: input
        description: "Unpaid principal balance of this mortgage"
        constraints: ">= 0"
      - name: recorded_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) this lien was recorded"
      - name: status
        type: enum
        source: input
        description: "ACTIVE liens count toward senior_lien_balance_cents and must be notified; RELEASED liens are historical title entries that count toward neither"
        default: "ACTIVE"
        constraints: "ACTIVE | RELEASED"
      - name: consent_application_id
        type: string
        source: system
        description: "FK -> Application.id; the Application whose notification most recently reset this lien's consent fields; null before the first notification"
        default: null
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock instant the holder notification was issued"
        default: null
      - name: consent_deadline_at
        type: datetime
        source: system
        description: "notified_at + 30 days; the instant after which silence may be deemed consent in deemed-consent counties"
        default: null
      - name: consent_response
        type: enum
        source: system
        description: "Consent axis of this lien for consent_application_id"
        default: "NOT_NOTIFIED"
        constraints: "NOT_NOTIFIED | PENDING | CONSENTED | DECLINED | DEEMED_CONSENTED"
      - name: consent_responded_at
        type: datetime
        source: system
        description: "Instant CONSENTED / DECLINED / DEEMED_CONSENTED was recorded"
        default: null

  - name: EligibleProduct
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: "Program catalog code"
        constraints: "unique across EligibleProduct"
      - name: category
        type: enum
        source: input
        description: "Measure family"
        constraints: "SOLAR_PV | HVAC | ROOF | WINDOWS | WATER_EFFICIENCY"
      - name: useful_life_years
        type: integer
        source: input
        description: "Expected useful life (EUL) used as the SIR discount horizon and the term cap input"
        constraints: "1..40"
      - name: max_annual_savings_cents
        type: integer
        source: input
        description: "Ceiling on the annual savings a single measure of this product may claim"
        constraints: ">= 1"
      - name: requires_permit
        type: boolean
        source: input
        description: "True when the measure needs a building permit before completion certification"
        default: true
      - name: status
        type: enum
        source: input
        description: "ACTIVE products may back new ProjectMeasures; RETIRED products may not"
        default: "ACTIVE"
        constraints: "ACTIVE | RETIRED"

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Contractor legal entity name"
      - name: license_number
        type: string
        source: input
        description: "State contractor license number"
        constraints: "unique across Contractor"
      - name: license_expires_on
        type: string
        source: input
        description: "License expiry date (YYYY-MM-DD)"
      - name: workmanship_warranty_years
        type: integer
        source: input
        description: "Warranty the contractor offers on installed measures"
        constraints: ">= 0"
      - name: counties_served
        type: array
        source: input
        description: "County codes this contractor is enrolled to work in"
        constraints: "non-empty array of county_code values"
      - name: enrollment_status
        type: enum
        source: system
        description: "Enrollment axis; only ENROLLED contractors may be named on a new Application or receive released funds"
        default: "PENDING_REVIEW"
        constraints: "PENDING_REVIEW | ENROLLED | PROBATION | SUSPENDED | TERMINATED"
      - name: workmanship_score
        type: integer
        source: computed
        description: "trailing_24m variant of contractor_workmanship_score; gates PROBATION / SUSPENDED. Expressed in basis points, so a clean contractor sits at 10000"
        default: 10000
      - name: lifetime_workmanship_score
        type: integer
        source: computed
        description: "lifetime variant of contractor_workmanship_score; gates reinstatement. Basis points, 10000 when no complaint has ever been upheld"
        default: 10000
      - name: upheld_open_remedy_count
        type: integer
        source: computed
        description: "Count of WorkmanshipComplaints of this contractor with status == REMEDY_ORDERED"
        default: 0
      - name: net_disbursed_cents
        type: integer
        source: computed
        description: "gross_disbursed_cents - clawed_back_total_cents; conserved quantity of the release/reverse compensating pair"
        default: 0
      - name: gross_disbursed_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.amount_cents over this contractor's disbursements with status IN {RELEASED, REVERSED}"
        default: 0
      - name: clawed_back_total_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.amount_cents over this contractor's disbursements with status == REVERSED"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: "Free-text reason recorded when enrollment_status becomes SUSPENDED"
        default: null

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel to be assessed"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the enrolled contractor that will install the measures"
      - name: supersedes_application_id
        type: string
        source: input
        description: "FK -> Application.id; the prior DECLINED or WITHDRAWN Application on the same parcel this one replaces; null for a first-time filing"
        default: null
      - name: requested_term_years
        type: integer
        source: input
        description: "Requested amortization term in tax years"
        constraints: "5..30"
      - name: status
        type: enum
        source: system
        description: "Lifecycle axis of the application"
        default: "DRAFT"
        constraints: "DRAFT | UNDER_REVIEW | NEEDS_CURE | CONSENT_PENDING | APPROVED | FUNDING_PENDING | FUNDING_HELD | FUNDED | ASSESSED | DECLINED | WITHDRAWN"
      - name: requested_principal_cents
        type: integer
        source: computed
        description: "Sum of ProjectMeasure.installed_cost_cents over this application's measures with status IN {PROPOSED, APPROVED}; 0 when that set is empty"
        default: 0
      - name: screening_cltv_bps
        type: integer
        source: computed
        description: "combined_lien_to_value_ratio, assessed_basis variant, stamped by POST /pace/applications/{id}/submit"
        default: null
      - name: underwriting_cltv_bps
        type: integer
        source: computed
        description: "combined_lien_to_value_ratio under valuation_basis, stamped by POST /pace/applications/{id}/underwrite"
        default: null
      - name: valuation_basis
        type: enum
        source: system
        description: "Basis the underwriter elected on the most recent underwrite call; null until then. GET /pace/applications/{id}/eligibility-report reports valuation_basis_applied = this value when set, else ASSESSED (the screening default)"
        default: null
        constraints: "ASSESSED | MARKET"
      - name: portfolio_sir_bps
        type: integer
        source: computed
        description: "savings_to_investment_ratio, portfolio_blended variant, over measures with status IN {PROPOSED, APPROVED}"
        default: null
      - name: min_measure_sir_bps
        type: integer
        source: computed
        description: "Minimum ProjectMeasure.sir_bps over measures with status IN {PROPOSED, APPROVED}; null when that set is empty"
        default: null
      - name: weighted_useful_life_years
        type: integer
        source: computed
        description: "weighted_average_useful_life output; floor of the cost-weighted EUL"
        default: null
      - name: cure_round_count
        type: integer
        source: system
        description: "Number of completed NEEDS_CURE -> UNDER_REVIEW cure cycles"
        default: 0
      - name: cure_reason_codes
        type: array
        source: system
        description: "Reason codes attached when status becomes NEEDS_CURE; members: TAX_DELINQUENCY | MEASURE_SIR_FAIL | APPRAISAL_MISSING | LENDER_UNRESPONSIVE; emptied on each cure"
        default: []
      - name: decline_reason_code
        type: enum
        source: system
        description: "Reason status became DECLINED"
        default: null
        constraints: "CLTV_LIMIT | PTV_LIMIT | EQUITY_FLOOR | SIR_FLOOR | BANKRUPTCY | LENDER_DECLINED | CURE_ROUNDS_EXHAUSTED"
      - name: underwriter_user_id
        type: string
        source: system
        description: "X-User-ID of the UnderwritingAnalyst that ran the most recent underwrite"
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: "X-User-ID of the UnderwritingAnalyst that approved; must differ from underwriter_user_id"
        default: null
      - name: notified_lien_count
        type: integer
        source: system
        description: "Number of MortgageLiens notified when this application entered CONSENT_PENDING"
        default: 0
      - name: consent_deadline_at
        type: datetime
        source: system
        description: "Notification instant + 30 days; identical across all liens notified for this application"
        default: null
      - name: consent_posture
        type: enum
        source: computed
        description: "lender_consent_posture output over this application's notified liens"
        default: "NOT_STARTED"
        constraints: "NOT_STARTED | PENDING | CLEARED | VETOED"
      - name: oral_confirmation_required
        type: boolean
        source: computed
        description: "True when the owner's age in whole years on the signing date is >= 62 OR property.preferred_language != EN"
        default: false
      - name: funding_hold_reason
        type: enum
        source: system
        description: "Why funding is held; set when status becomes FUNDING_HELD, cleared on return to FUNDING_PENDING"
        default: null
        constraints: "CONTRACTOR_PROBATION | CONTRACTOR_SUSPENSION"

  - name: ProjectMeasure
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this measure belongs to"
      - name: product_id
        type: string
        source: input
        description: "FK -> EligibleProduct.id; the catalog product installed"
      - name: installed_cost_cents
        type: integer
        source: input
        description: "Contractor-quoted installed cost of this measure; the PACE principal contribution"
        constraints: ">= 100000"
      - name: estimated_annual_savings_cents
        type: integer
        source: input
        description: "Claimed first-year energy/water savings"
        constraints: ">= 1 and <= product.max_annual_savings_cents"
      - name: pv_savings_cents
        type: integer
        source: computed
        description: "round_half_up(estimated_annual_savings_cents * annuity_factor(0.03, product.useful_life_years)) in whole cents"
        default: null
      - name: sir_bps
        type: integer
        source: computed
        description: "savings_to_investment_ratio, per_measure_gate variant: round_half_up(pv_savings_cents / installed_cost_cents * 10000)"
        default: null
      - name: status
        type: enum
        source: system
        description: "PROPOSED at creation; APPROVED / INELIGIBLE stamped by underwrite; COMPLETED when a VERIFIED CompletionCertificate lists it"
        default: "PROPOSED"
        constraints: "PROPOSED | APPROVED | INELIGIBLE | COMPLETED"

  - name: FinancingAgreement
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application this agreement papers"
      - name: term_years
        type: integer
        source: input
        description: "Amortization term in tax years; pinned into the assessment schedule"
        constraints: "5..30 and <= application.weighted_useful_life_years"
      - name: apr_bps
        type: integer
        source: input
        description: "Annual percentage rate in basis points applied to the financed amount"
        default: 800
        constraints: "1..1500"
      - name: principal_cents
        type: integer
        source: computed
        description: "Snapshot of application.requested_principal_cents at issue time (version-pinned; later measure edits do not move it)"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "financed_amount_composition output: round_half_up(principal_cents * 250 / 10000)"
      - name: county_recording_fee_cents
        type: integer
        source: computed
        description: "Flat COUNTY_RECORDING_FEE_CENTS constant at issue time"
      - name: financed_amount_cents
        type: integer
        source: computed
        description: "principal_cents + admin_fee_cents + county_recording_fee_cents; the amount amortized onto the tax roll"
      - name: annual_installment_cents
        type: integer
        source: computed
        description: "level_payment_amortization_schedule level payment over term_years at apr_bps on financed_amount_cents"
      - name: contractor_payable_cents
        type: integer
        source: computed
        description: "Equals principal_cents; fees are never payable to the contractor"
      - name: status
        type: enum
        source: system
        description: "Document lifecycle axis"
        default: "ISSUED"
        constraints: "ISSUED | SIGNED | EFFECTIVE | RECORDED | RESCINDED | VOID"
      - name: signature_name
        type: string
        source: input
        description: "Name the owner typed when signing"
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of signature"
        default: null
      - name: rescission_expires_at
        type: datetime
        source: computed
        description: "rescission_window_expiry output: 00:00:00Z of the day after the third program business day following the signing date"
        default: null
      - name: oral_confirmation_required
        type: boolean
        source: computed
        description: "Snapshot of application.oral_confirmation_required evaluated at signing"
        default: false
      - name: oral_confirmation_completed_at
        type: datetime
        source: system
        description: "Instant the compliance officer logged a CONFIRMED oral confirmation call"
        default: null
      - name: oral_confirmation_reference
        type: string
        source: input
        description: "Call-recording reference logged with the oral confirmation"
        default: null
      - name: rescinded_at
        type: datetime
        source: system
        description: "Instant the owner rescinded"
        default: null
      - name: effective_at
        type: datetime
        source: system
        description: "Instant the agreement became EFFECTIVE (first funds release)"
        default: null

  - name: CompletionCertificate
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application whose measures were installed"
      - name: measure_ids
        type: array
        source: input
        description: "Ids of the ProjectMeasures this certificate certifies; every member must be a ProjectMeasure whose application_id equals this certificate's application_id and whose status == APPROVED"
        constraints: "non-empty array, no duplicates"
      - name: certified_cost_cents
        type: integer
        source: computed
        description: "Sum of ProjectMeasure.installed_cost_cents over the measures listed in measure_ids"
      - name: contractor_attestation_note
        type: string
        source: input
        description: "Contractor's attestation that the listed measures are installed and permitted"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle axis"
        default: "CONTRACTOR_ATTESTED"
        constraints: "CONTRACTOR_ATTESTED | HOMEOWNER_SIGNED | VERIFIED | REJECTED"
      - name: homeowner_signature_name
        type: string
        source: input
        description: "Name the owner typed when signing off on completion"
        default: null
      - name: homeowner_signed_at
        type: datetime
        source: system
        description: "Instant the owner signed the certificate"
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FundingOfficer that verified; may not release the resulting Disbursement"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Instant of verification"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded when a verification decision is REJECT"
        default: null

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application being funded"
      - name: completion_certificate_id
        type: string
        source: input
        description: "FK -> CompletionCertificate.id; the certificate that authorizes this payment"
      - name: contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; copied from application.contractor_id at creation"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount payable to the contractor"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle axis"
        default: "REQUESTED"
        constraints: "REQUESTED | HELD | RELEASED | REVERSED"
      - name: hold_reason
        type: enum
        source: system
        description: "Why the payment is held; set when status becomes HELD, cleared on return to REQUESTED"
        default: null
        constraints: "CONTRACTOR_PROBATION | CONTRACTOR_SUSPENSION"
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FundingOfficer that released the funds"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Instant of release"
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded on clawback"
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: "Instant of clawback"
        default: null

  - name: WorkmanshipComplaint
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the funded application the complaint is about"
      - name: contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; copied from application.contractor_id at creation"
      - name: category
        type: enum
        source: input
        description: "Complaint family"
        constraints: "WORKMANSHIP_DEFECT | INCOMPLETE_WORK | SAVINGS_SHORTFALL | PERMIT_FAILURE"
      - name: severity
        type: enum
        source: input
        description: "Severity band; drives the workmanship-score penalty weight (MINOR 3, MAJOR 8, SEVERE 20)"
        constraints: "MINOR | MAJOR | SEVERE"
      - name: description
        type: string
        source: input
        description: "Owner's narrative of the defect"
      - name: status
        type: enum
        source: system
        description: "Recourse lifecycle axis"
        default: "OPEN"
        constraints: "OPEN | REMEDY_ORDERED | CLOSED_REMEDIED | CLOSED_DENIED | ESCALATED_RECOURSE"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Instant the complaint was first adjudicated; the anchor for the trailing_24m workmanship variant"
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that adjudicated"
        default: null
      - name: remedy_deadline_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) by which the contractor must remedy; required when the decision is UPHOLD_REMEDY"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Instant the complaint reached CLOSED_REMEDIED, CLOSED_DENIED or ESCALATED_RECOURSE"
        default: null

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the funded application being amortized onto the roll"
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from application.property_id at recording"
      - name: apn
        type: string
        source: system
        description: "Parcel number copied from the property at recording"
      - name: first_tax_year
        type: integer
        source: input
        description: "First tax year the assessment appears on the roll"
        constraints: "2027..2060"
      - name: final_tax_year
        type: integer
        source: computed
        description: "first_tax_year + term_years - 1; the closed end of the parcel's roll-year occupancy"
      - name: term_years
        type: integer
        source: system
        description: "Copied from the agreement at recording"
      - name: apr_bps
        type: integer
        source: system
        description: "Copied from the agreement at recording"
      - name: original_principal_cents
        type: integer
        source: system
        description: "Copied from agreement.financed_amount_cents at recording; the schedule-principal conservation baseline"
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "original_principal_cents minus the sum of AmortizationInstallment.principal_cents over installments with status == PAID minus prepaid principal"
      - name: annual_installment_cents
        type: integer
        source: system
        description: "Copied from agreement.annual_installment_cents at recording"
      - name: recorded_on
        type: string
        source: system
        description: "Logical-clock date the assessment was recorded onto the roll"
      - name: interest_accrual_from
        type: string
        source: system
        description: "Date interest starts accruing for payoff math: recorded_on, or the due_on of the most recent PAID installment once one exists"
      - name: billing_status
        type: enum
        source: system
        description: "Billing axis; advances only through county roll runs, payments and payoffs"
        default: "PENDING_ROLL"
        constraints: "PENDING_ROLL | ON_ROLL | PAID_OFF"
      - name: lien_status
        type: enum
        source: system
        description: "Lien-priority axis; advances independently of billing_status through delinquency and cure"
        default: "SENIOR_RECORDED"
        constraints: "SENIOR_RECORDED | LIEN_SALE_REFERRED | RELEASED"
      - name: delinquent_installment_count
        type: integer
        source: computed
        description: "Count of this assessment's installments with status == DELINQUENT"
        default: 0
      - name: accrued_penalty_cents
        type: integer
        source: computed
        description: "Sum of AmortizationInstallment.penalty_cents over installments with status == DELINQUENT"
        default: 0
      - name: transfer_status
        type: enum
        source: system
        description: "Sale-transfer axis"
        default: "NONE"
        constraints: "NONE | QUOTED | ASSUMED | PAID_OFF_AT_SALE"

  - name: AmortizationInstallment
    parent: Assessment
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: system
        description: "FK -> Assessment.id; the assessment this roll line belongs to"
      - name: tax_year
        type: integer
        source: system
        description: "Tax year this installment is billed in"
      - name: sequence
        type: integer
        source: system
        description: "1-based position in the amortization schedule"
      - name: due_on
        type: string
        source: system
        description: "Always {tax_year}-04-10; the county roll due date"
      - name: principal_cents
        type: integer
        source: system
        description: "Principal component from level_payment_amortization_schedule"
      - name: interest_cents
        type: integer
        source: system
        description: "Interest component from level_payment_amortization_schedule"
      - name: servicing_fee_cents
        type: integer
        source: system
        description: "Flat ANNUAL_SERVICING_FEE_CENTS constant added to every installment"
      - name: total_due_cents
        type: integer
        source: system
        description: "principal_cents + interest_cents + servicing_fee_cents"
      - name: status
        type: enum
        source: system
        description: "Roll-line lifecycle axis"
        default: "SCHEDULED"
        constraints: "SCHEDULED | BILLED | PAID | DELINQUENT | CANCELLED"
      - name: billed_on
        type: string
        source: system
        description: "Effective date of the roll run that billed this installment"
        default: null
      - name: paid_on
        type: string
        source: system
        description: "Date the county recorded payment"
        default: null
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Amount the county recorded against this installment"
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "delinquency_penalty_accrual output; 0 while status != DELINQUENT"
        default: 0
      - name: months_past_due
        type: integer
        source: computed
        description: "floor((roll-run effective date - due_on) / 30 days) at the moment of delinquency"
        default: 0

  - name: AssessmentTransfer
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment being assumed or paid off at closing"
      - name: mode
        type: enum
        source: input
        description: "ASSUME_WITH_PROPERTY leaves the assessment on the roll under the new owner; PAYOFF_AT_CLOSING retires it"
        constraints: "ASSUME_WITH_PROPERTY | PAYOFF_AT_CLOSING"
      - name: closing_date
        type: string
        source: input
        description: "Escrow closing date (YYYY-MM-DD); the payoff interest-accrual end date"
      - name: buyer_full_name
        type: string
        source: input
        description: "Name of the purchasing owner who assumes the parcel"
      - name: buyer_birth_date
        type: string
        source: input
        description: "Purchaser date of birth (YYYY-MM-DD); becomes property.owner_birth_date on an assumption"
      - name: quoted_at
        type: datetime
        source: system
        description: "Logical-clock instant the payoff quote was produced; half-open window start"
      - name: good_through_date
        type: string
        source: computed
        description: "date(quoted_at) + 30 days; exclusive end of the quote window"
      - name: payoff_principal_cents
        type: integer
        source: computed
        description: "assessment.principal_balance_cents at quote time"
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "payoff_quote_composition step 1 output"
      - name: payoff_admin_fee_cents
        type: integer
        source: computed
        description: "Flat PAYOFF_ADMIN_FEE_CENTS constant"
      - name: base_payoff_cents
        type: integer
        source: computed
        description: "payoff_principal_cents + accrued_interest_cents + payoff_admin_fee_cents; the tier key"
      - name: prepayment_premium_bps
        type: integer
        source: computed
        description: "Tier selected from base_payoff_cents, never from payoff_total_cents"
      - name: prepayment_premium_cents
        type: integer
        source: computed
        description: "round_half_up(base_payoff_cents * prepayment_premium_bps / 10000)"
      - name: payoff_total_cents
        type: integer
        source: computed
        description: "base_payoff_cents + prepayment_premium_cents"
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle axis"
        default: "QUOTED"
        constraints: "QUOTED | RECORDED_ASSUMED | RECORDED_PAID_OFF | VOID_STALE | EXPIRED"
      - name: recorded_on
        type: string
        source: system
        description: "Date the county recorded the assumption or payoff"
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2)
#   11 machines. Assessment is modelled as TWO parallel dimensions (billing_status,
#   lien_status) declared as two entries carrying a `dimension:` key.
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [ASSESSED, DECLINED, WITHDRAWN]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /pace/applications"
        actor: PropertyOwner
        preconditions:
          - "property_id resolves to an existing Property"
          - "contractor_id resolves to a Contractor whose enrollment_status == ENROLLED"
          - "X-User-ID equals property_id (the caller owns the parcel)"
          - "no other Application on the same property_id has status NOT IN {DECLINED, WITHDRAWN, ASSESSED}"
          - "when supersedes_application_id is supplied it resolves to an Application on the same property_id whose status IN {DECLINED, WITHDRAWN}"
          - "Property.in_bankruptcy == false"
        side_effects:
          - "status := DRAFT; requested_principal_cents := 0; cure_round_count := 0; consent_posture := NOT_STARTED"
          - "notified_lien_count := 0; oral_confirmation_required := (Property.preferred_language == 'ES') OR (Property.occupancy_type != 'OWNER_OCCUPIED')"
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /pace/applications/{id}/submit"
        actor: PropertyOwner
        preconditions:
          - "the Application has at least one ProjectMeasure with status == PROPOSED"
          - "the Application has at most 5 ProjectMeasure rows"
          - "requested_term_years <= weighted_average_useful_life(PROPOSED measures)"
          - "Property.in_bankruptcy == false"
          - "Property.tax_delinquency_count_36m <= 1"
        side_effects:
          - "runs weighted_average_useful_life -> weighted_useful_life_years"
          - "runs savings_to_investment_ratio (per_measure_gate) over every PROPOSED measure -> ProjectMeasure.pv_savings_cents, ProjectMeasure.sir_bps, Application.min_measure_sir_bps"
          - "runs savings_to_investment_ratio (portfolio_blended) over every PROPOSED measure -> Application.portfolio_sir_bps"
          - "requested_principal_cents := sum(installed_cost_cents) over PROPOSED measures"
          - "runs combined_lien_to_value_ratio (assessed_basis) -> screening_cltv_bps (advisory only; never blocks submit)"
      - from: UNDER_REVIEW
        to: CONSENT_PENDING
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED"
        actor: UnderwritingAnalyst
        preconditions:
          - "PINNED EVALUATION ORDER on this path: (1) classify every PROPOSED measure APPROVED/INELIGIBLE via the per_measure_gate variant, (2) recompute requested_principal_cents over the APPROVED subset only, (3) recompute portfolio_sir_bps over the APPROVED subset, (4) evaluate the CLTV / PTV / equity gates against that APPROVED principal. The gates therefore never see the cost of a measure that was just ruled INELIGIBLE."
          - "at least one measure survives step (1) as APPROVED"
          - "portfolio_sir_bps over the APPROVED subset >= SIR_FLOOR_BPS (10000)"
          - "underwriting_cltv_bps (APPROVED principal) <= CLTV_CAP_BPS (9700)"
          - "APPROVED principal / Property.assessed_value_cents <= PTV_CAP_BPS (1500)"
          - "Property equity_ratio_bps >= EQUITY_FLOOR_BPS (1000)"
        side_effects:
          - "each PROPOSED ProjectMeasure moves to APPROVED (sir_bps >= 10000 and product ACTIVE) or INELIGIBLE otherwise"
          - "requested_principal_cents := sum(installed_cost_cents) over APPROVED measures only"
          - "runs combined_lien_to_value_ratio using the requested valuation_basis over the APPROVED principal -> underwriting_cltv_bps"
          - "underwriter_user_id := X-User-ID"
          - "every MortgageLien on the parcel with status == ACTIVE moves NOT_NOTIFIED -> PENDING with consent_application_id := this Application, notified_at := now, consent_deadline_at := now + CONSENT_WINDOW_DAYS (30)"
          - "notified_lien_count := count of liens notified; consent_deadline_at := max lien consent_deadline_at (null when no lien was notified); consent_posture := lender_consent_posture over the notified set, i.e. PENDING when at least one ACTIVE lien exists and CLEARED for a free-and-clear parcel with zero ACTIVE liens (the Application still parks in CONSENT_PENDING, but approve then needs no consent-response call)"
      - from: UNDER_REVIEW
        to: NEEDS_CURE
        trigger: "POST /pace/applications/{id}/underwrite with decision == CURE"
        actor: UnderwritingAnalyst
        preconditions:
          - "cure_round_count < MAX_CURE_ROUNDS (2)"
          - "cure_reason_codes is a non-empty array in the request"
        side_effects:
          - "cure_round_count := cure_round_count + 1; cure_reason_codes := request value; underwriter_user_id := X-User-ID"
          - "no MortgageLien is notified on this path"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /pace/applications/{id}/underwrite with decision == DECLINE"
        actor: UnderwritingAnalyst
        preconditions:
          - "decline_reason_code is supplied in the request and is one of CLTV_LIMIT | PTV_LIMIT | EQUITY_FLOOR | SIR_FLOOR | BANKRUPTCY"
        side_effects:
          - "underwriter_user_id := X-User-ID; underwriting_cltv_bps is computed and persisted on this path too"
          - "every ProjectMeasure with status == PROPOSED moves to INELIGIBLE"
          - "no MortgageLien is notified; consent_posture stays NOT_STARTED"
          - "NOTE: a decision == PROCEED whose eligibility gate fails is an ERROR (see §1.4), not an implicit decline; the Application stays in UNDER_REVIEW and nothing is persisted"
      - from: NEEDS_CURE
        to: UNDER_REVIEW
        trigger: "POST /pace/applications/{id}/cure"
        actor: PropertyOwner
        preconditions:
          - "at least one ProjectMeasure with status == PROPOSED exists after the cure (measures may be added while status == NEEDS_CURE)"
          - "cure_round_count <= MAX_CURE_ROUNDS (2)"
        side_effects:
          - "cure_reason_codes := []"
          - "all submit-time calculations re-run against the current PROPOSED measure set (weighted_useful_life_years, sir, screening_cltv_bps, requested_principal_cents)"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /pace/applications/{id}/underwrite with decision == CURE when cure_round_count is already MAX_CURE_ROUNDS"
        actor: UnderwritingAnalyst
        preconditions:
          - "cure_round_count == MAX_CURE_ROUNDS (2), i.e. the owner has already been given both cure rounds"
        side_effects:
          - "decline_reason_code := CURE_ROUNDS_EXHAUSTED; cure_round_count is left at 2"
          - "every ProjectMeasure with status == PROPOSED moves to INELIGIBLE"
      - from: UNDER_REVIEW
        to: NEEDS_CURE
        trigger: "POST /pace/counties/{countyCode}/roll-runs (cascade link 4: a parcel of this Application became tax-delinquent)"
        actor: system
        preconditions:
          - "an Assessment on the same property_id moved lien_status SENIOR_RECORDED -> LIEN_SALE_REFERRED during this roll run"
        side_effects:
          - "cure_reason_codes := ['TAX_DELINQUENCY']; cure_round_count is NOT incremented (system-initiated cure does not consume an owner cure round)"
      - from: CONSENT_PENDING
        to: NEEDS_CURE
        trigger: "POST /pace/counties/{countyCode}/roll-runs (cascade link 4)"
        actor: system
        preconditions:
          - "an Assessment on the same property_id moved lien_status SENIOR_RECORDED -> LIEN_SALE_REFERRED during this roll run"
        side_effects:
          - "cure_reason_codes := ['TAX_DELINQUENCY']; consent_posture is left untouched so already-collected lender consents survive the cure round"
      - from: CONSENT_PENDING
        to: DECLINED
        trigger: "POST /pace/mortgage-liens/{id}/consent-response with response == DECLINE"
        actor: ComplianceOfficer
        preconditions:
          - "the MortgageLien's consent_application_id == this Application"
        side_effects:
          - "decline_reason_code := LENDER_DECLINED; consent_posture := VETOED"
          - "every ProjectMeasure with status == APPROVED moves to INELIGIBLE"
      - from: CONSENT_PENDING
        to: APPROVED
        trigger: "POST /pace/applications/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != underwriter_user_id (segregation of duties)"
          - "consent_posture resolves to CLEARED at call time"
          - "no MortgageLien on the parcel with status == ACTIVE still has consent_response == PENDING before the deemed-consent sweep"
        side_effects:
          - "runs lender_consent_posture: every ACTIVE lien still PENDING whose consent_deadline_at <= now moves to DEEMED_CONSENTED when Property.county_code is in DEEMED_CONSENT_COUNTIES"
          - "consent_posture := CLEARED; approver_user_id := X-User-ID"
      - from: APPROVED
        to: FUNDING_PENDING
        trigger: "POST /pace/financing-agreements/{id}/sign"
        actor: PropertyOwner
        preconditions:
          - "the FinancingAgreement belongs to this Application and has status == ISSUED"
        side_effects:
          - "Property.committed_pace_principal_cents += FinancingAgreement.financed_amount_cents"
      - from: FUNDING_PENDING
        to: WITHDRAWN
        trigger: "POST /pace/financing-agreements/{id}/rescind"
        actor: PropertyOwner
        preconditions:
          - "now < FinancingAgreement.rescission_expires_at"
        side_effects:
          - "Property.committed_pace_principal_cents -= FinancingAgreement.financed_amount_cents (compensating restore)"
          - "every ProjectMeasure with status == APPROVED moves to INELIGIBLE"
      - from: FUNDING_PENDING
        to: FUNDING_HELD
        trigger: "POST /pace/complaints/{id}/adjudicate (cascade link 4) or a Contractor moving to PROBATION/SUSPENDED for any reason"
        actor: system
        preconditions:
          - "the Application's contractor_id matches the penalised Contractor"
          - "at least one Disbursement of this Application moved REQUESTED -> HELD in the same cascade"
        side_effects:
          - "funding_hold_reason := CONTRACTOR_PROBATION when the contractor landed on PROBATION, CONTRACTOR_SUSPENSION when it landed on SUSPENDED"
      - from: FUNDING_HELD
        to: FUNDING_PENDING
        trigger: "POST /pace/contractors/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "the Contractor returns to ENROLLED"
        side_effects:
          - "funding_hold_reason := null; every Disbursement of this Application with status == HELD moves back to REQUESTED"
      - from: FUNDING_PENDING
        to: FUNDED
        trigger: "POST /pace/disbursements/{id}/release"
        actor: FundingOfficer
        preconditions:
          - "sum(amount_cents) over Disbursements of the Application with status == RELEASED == FinancingAgreement.contractor_payable_cents after this release"
        side_effects:
          - "FinancingAgreement moves SIGNED -> EFFECTIVE on the first release of the Application"
      - from: FUNDED
        to: ASSESSED
        trigger: "POST /pace/assessments"
        actor: CountyOfficer
        preconditions:
          - "the Application has status == FUNDED and no Assessment yet"
        side_effects:
          - "FinancingAgreement moves EFFECTIVE -> RECORDED; Property.recorded_pace_principal_cents += Assessment.original_principal_cents"

  - entity: MortgageLien
    dimension: consent_response
    initial_state: NOT_NOTIFIED
    terminal_states: []
    transitions:
      - from: NOT_NOTIFIED
        to: PENDING
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED (mortgage holder notification)"
        actor: system
        preconditions:
          - "MortgageLien.status == ACTIVE"
          - "the lien's property_id == the Application's property_id"
        side_effects:
          - "consent_application_id := the Application; notified_at := now; consent_deadline_at := now + 30 days"
      - from: PENDING
        to: CONSENTED
        trigger: "POST /pace/mortgage-liens/{id}/consent-response with response == CONSENT"
        actor: ComplianceOfficer
        preconditions:
          - "now < consent_deadline_at OR the county is not in DEEMED_CONSENT_COUNTIES (a late explicit consent is always accepted)"
          - "the referenced Application has status == CONSENT_PENDING"
        side_effects:
          - "consent_responded_at := now; the Application's consent_posture is re-derived by lender_consent_posture"
      - from: PENDING
        to: DECLINED
        trigger: "POST /pace/mortgage-liens/{id}/consent-response with response == DECLINE"
        actor: ComplianceOfficer
        preconditions:
          - "the referenced Application has status == CONSENT_PENDING"
        side_effects:
          - "consent_responded_at := now; the Application moves CONSENT_PENDING -> DECLINED with decline_reason_code := LENDER_DECLINED"
      - from: PENDING
        to: DEEMED_CONSENTED
        trigger: "POST /pace/applications/{id}/approve (deemed-consent sweep)"
        actor: system
        preconditions:
          - "now >= consent_deadline_at"
          - "Property.county_code IN DEEMED_CONSENT_COUNTIES (06073, 06037)"
        side_effects:
          - "consent_responded_at := now (the sweep timestamp, not the deadline)"
      - from: CONSENTED
        to: PENDING
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED for a DIFFERENT Application on the same parcel (re-notification)"
        actor: system
        preconditions:
          - "the new Application's id != consent_application_id"
          - "MortgageLien.status == ACTIVE"
        side_effects:
          - "consent_application_id := the new Application; consent_responded_at := null; consent_deadline_at := now + 30 days (a consent given for a superseded Application never carries over)"
      - from: DECLINED
        to: PENDING
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED for a DIFFERENT Application on the same parcel (re-notification)"
        actor: system
        preconditions:
          - "the new Application's id != consent_application_id"
          - "MortgageLien.status == ACTIVE"
        side_effects:
          - "consent_application_id := the new Application; consent_responded_at := null; consent_deadline_at := now + 30 days"
      - from: DEEMED_CONSENTED
        to: PENDING
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED for a DIFFERENT Application on the same parcel (re-notification)"
        actor: system
        preconditions:
          - "the new Application's id != consent_application_id"
          - "MortgageLien.status == ACTIVE"
        side_effects:
          - "consent_application_id := the new Application; consent_responded_at := null; consent_deadline_at := now + 30 days"

  - entity: Contractor
    initial_state: PENDING_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: null
        to: PENDING_REVIEW
        trigger: "POST /pace/contractors"
        actor: ProgramAdmin
        preconditions:
          - "license_number is unique across Contractors"
        side_effects:
          - "workmanship_score := 10000; lifetime_workmanship_score := 10000; upheld_open_remedy_count := 0; all disbursed rollups := 0"
      - from: PENDING_REVIEW
        to: ENROLLED
        trigger: "POST /pace/contractors/{id}/enroll"
        actor: ProgramAdmin
        preconditions:
          - "license_expires_on > the current logical date"
          - "workmanship_warranty_years >= MIN_WARRANTY_YEARS (5)"
          - "counties_served is non-empty"
        side_effects:
          - "suspension_reason := null"
      - from: ENROLLED
        to: PROBATION
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == UPHOLD_REMEDY (cascade link 2)"
        actor: system
        preconditions:
          - "the recomputed trailing_24m workmanship_score < PROBATION_THRESHOLD (9000) and >= SUSPENSION_THRESHOLD (7000)"
        side_effects:
          - "suspension_reason := 'WORKMANSHIP_SCORE_BELOW_9000'"
          - "every Disbursement of this Contractor with status == REQUESTED moves to HELD with hold_reason := CONTRACTOR_PROBATION (cascade link 3)"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == UPHOLD_REMEDY (cascade link 2)"
        actor: system
        preconditions:
          - "the recomputed trailing_24m workmanship_score < SUSPENSION_THRESHOLD (7000)"
        side_effects:
          - "suspension_reason := 'WORKMANSHIP_SCORE_BELOW_7000'"
          - "every Disbursement of this Contractor with status == REQUESTED moves to HELD with hold_reason := CONTRACTOR_SUSPENSION (cascade link 3)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == UPHOLD_REMEDY (cascade link 2)"
        actor: system
        preconditions:
          - "the recomputed trailing_24m workmanship_score < SUSPENSION_THRESHOLD (7000)"
        side_effects:
          - "suspension_reason := 'WORKMANSHIP_SCORE_BELOW_7000'; already-HELD Disbursements keep hold_reason but it is upgraded to CONTRACTOR_SUSPENSION"
      - from: PROBATION
        to: ENROLLED
        trigger: "POST /pace/contractors/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "workmanship_score (trailing_24m) >= REINSTATE_TRAILING_BPS (9000)"
          - "lifetime_workmanship_score >= REINSTATE_LIFETIME_BPS (8000)"
          - "upheld_open_remedy_count == 0"
          - "license_expires_on > the current logical date"
        side_effects:
          - "suspension_reason := null"
          - "every Disbursement of this Contractor with status == HELD moves back to REQUESTED with hold_reason := null (cascade)"
          - "every Application of this Contractor with status == FUNDING_HELD moves back to FUNDING_PENDING with funding_hold_reason := null"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /pace/contractors/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "workmanship_score (trailing_24m) >= REINSTATE_TRAILING_BPS (9000)"
          - "lifetime_workmanship_score >= REINSTATE_LIFETIME_BPS (8000)"
          - "upheld_open_remedy_count == 0"
          - "license_expires_on > the current logical date"
        side_effects:
          - "same reinstatement cascade as PROBATION -> ENROLLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == RECOURSE"
        actor: system
        preconditions:
          - "the Contractor's enrollment_status is already SUSPENDED when the complaint escalates to ESCALATED_RECOURSE"
        side_effects:
          - "suspension_reason := 'RECOURSE_WHILE_SUSPENDED'; every Disbursement with status == HELD stays HELD and can never be released"

  - entity: ProjectMeasure
    initial_state: PROPOSED
    terminal_states: [COMPLETED, INELIGIBLE]
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /pace/applications/{id}/measures"
        actor: PropertyOwner
        preconditions:
          - "the Application status IN {DRAFT, NEEDS_CURE}"
          - "product_id resolves to an EligibleProduct with status == ACTIVE"
          - "expected_application_version matches the Application version (OCC)"
          - "estimated_annual_savings_cents <= EligibleProduct.max_annual_savings_cents"
          - "no other ProjectMeasure of this Application already references the same product_id"
        side_effects:
          - "pv_savings_cents and sir_bps := 0 until the next submit/cure recomputation"
          - "the Application version is incremented"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /pace/applications/{id}/underwrite with decision == PROCEED"
        actor: system
        preconditions:
          - "sir_bps >= SIR_FLOOR_BPS (10000)"
          - "the referenced EligibleProduct still has status == ACTIVE at underwrite time"
        side_effects:
          - "the measure's installed_cost_cents joins Application.requested_principal_cents"
      - from: PROPOSED
        to: INELIGIBLE
        trigger: "POST /pace/applications/{id}/underwrite (any decision)"
        actor: system
        preconditions:
          - "sir_bps < SIR_FLOOR_BPS (10000) OR the referenced EligibleProduct status == RETIRED at underwrite time OR the decision is DECLINE"
        side_effects:
          - "the measure's installed_cost_cents is excluded from Application.requested_principal_cents"
      - from: APPROVED
        to: INELIGIBLE
        trigger: "POST /pace/financing-agreements/{id}/rescind"
        actor: system
        preconditions:
          - "the Application moves FUNDING_PENDING -> WITHDRAWN"
        side_effects:
          - "no CompletionCertificate may reference the measure afterwards"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /pace/completion-certificates/{id}/verify with decision == APPROVE"
        actor: system
        preconditions:
          - "the measure id appears in CompletionCertificate.measure_ids"
        side_effects:
          - "the Application becomes eligible for a Disbursement covering this certificate"

  - entity: FinancingAgreement
    initial_state: ISSUED
    terminal_states: [RECORDED, RESCINDED, VOID]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /pace/financing-agreements"
        actor: UnderwritingAnalyst
        preconditions:
          - "the Application status == APPROVED"
          - "expected_application_version matches the Application version (OCC)"
          - "term_years <= Application.weighted_useful_life_years"
          - "term_years IN {10, 15, 18, 20, 25}"
        side_effects:
          - "runs financed_amount_composition -> principal_cents, admin_fee_cents, county_recording_fee_cents, financed_amount_cents, contractor_payable_cents"
          - "runs level_payment_amortization_schedule -> annual_installment_cents"
          - "oral_confirmation_required := Application.oral_confirmation_required (snapshot at issue time)"
          - "any prior FinancingAgreement of the same Application with status == ISSUED moves to VOID"
          - "the Application version is incremented"
      - from: ISSUED
        to: VOID
        trigger: "POST /pace/financing-agreements (a newer agreement is issued for the same Application)"
        actor: system
        preconditions:
          - "the superseded agreement has status == ISSUED (a SIGNED agreement blocks re-issue instead)"
        side_effects:
          - "no Property rollup changes: an ISSUED agreement never contributed to committed_pace_principal_cents"
      - from: ISSUED
        to: SIGNED
        trigger: "POST /pace/financing-agreements/{id}/sign"
        actor: PropertyOwner
        preconditions:
          - "X-User-ID equals the Application's property_id"
          - "signature_name matches Property.owner_full_name exactly (case-sensitive)"
          - "the Application status == APPROVED"
        side_effects:
          - "signed_at := now; runs rescission_window_expiry -> rescission_expires_at"
          - "the Application moves APPROVED -> FUNDING_PENDING"
          - "Property.committed_pace_principal_cents += financed_amount_cents"
      - from: SIGNED
        to: RESCINDED
        trigger: "POST /pace/financing-agreements/{id}/rescind"
        actor: PropertyOwner
        preconditions:
          - "now < rescission_expires_at (strictly before; at the boundary instant the right has lapsed)"
          - "no Disbursement of the Application has status == RELEASED"
        side_effects:
          - "rescinded_at := now; the Application moves FUNDING_PENDING -> WITHDRAWN"
          - "Property.committed_pace_principal_cents -= financed_amount_cents"
          - "every APPROVED ProjectMeasure moves to INELIGIBLE; every CompletionCertificate with status IN {CONTRACTOR_ATTESTED, HOMEOWNER_SIGNED} moves to REJECTED with rejection_reason := 'AGREEMENT_RESCINDED'"
      - from: SIGNED
        to: EFFECTIVE
        trigger: "POST /pace/disbursements/{id}/release (first release of the Application)"
        actor: system
        preconditions:
          - "now >= rescission_expires_at"
          - "oral_confirmation_required == false OR oral_confirmation_completed_at is not null"
        side_effects:
          - "effective_at := now; the rescission right is permanently spent"
      - from: EFFECTIVE
        to: RECORDED
        trigger: "POST /pace/assessments"
        actor: system
        preconditions:
          - "the Application status == FUNDED"
        side_effects:
          - "the Assessment inherits term_years, apr_bps and annual_installment_cents from this agreement"

  - entity: CompletionCertificate
    initial_state: CONTRACTOR_ATTESTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: null
        to: CONTRACTOR_ATTESTED
        trigger: "POST /pace/completion-certificates"
        actor: Contractor
        preconditions:
          - "X-User-ID equals the Application's contractor_id"
          - "the Application status IN {FUNDING_PENDING, FUNDING_HELD}"
          - "every id in measure_ids is a ProjectMeasure of the Application with status == APPROVED"
          - "no other CompletionCertificate of the Application with status IN {CONTRACTOR_ATTESTED, HOMEOWNER_SIGNED, VERIFIED} shares any measure id"
          - "certified_cost_cents <= sum(installed_cost_cents) over the referenced measures"
        side_effects:
          - "none beyond creation; funds stay locked until VERIFIED"
      - from: CONTRACTOR_ATTESTED
        to: HOMEOWNER_SIGNED
        trigger: "POST /pace/completion-certificates/{id}/sign"
        actor: PropertyOwner
        preconditions:
          - "X-User-ID equals the Application's property_id"
          - "homeowner_signature_name matches Property.owner_full_name exactly"
        side_effects:
          - "homeowner_signed_at := now"
      - from: HOMEOWNER_SIGNED
        to: VERIFIED
        trigger: "POST /pace/completion-certificates/{id}/verify with decision == APPROVE"
        actor: FundingOfficer
        preconditions:
          - "the Application status == FUNDING_PENDING (a FUNDING_HELD application cannot be verified)"
        side_effects:
          - "verified_by_user_id := X-User-ID; verified_at := now"
          - "every ProjectMeasure in measure_ids moves APPROVED -> COMPLETED"
      - from: HOMEOWNER_SIGNED
        to: REJECTED
        trigger: "POST /pace/completion-certificates/{id}/verify with decision == REJECT"
        actor: FundingOfficer
        preconditions:
          - "rejection_reason is present in the request"
        side_effects:
          - "the referenced measures stay APPROVED so the Contractor can file a replacement certificate"
      - from: CONTRACTOR_ATTESTED
        to: REJECTED
        trigger: "POST /pace/financing-agreements/{id}/rescind"
        actor: system
        preconditions:
          - "the Application moves FUNDING_PENDING -> WITHDRAWN"
        side_effects:
          - "rejection_reason := 'AGREEMENT_RESCINDED'"
      - from: HOMEOWNER_SIGNED
        to: REJECTED
        trigger: "POST /pace/financing-agreements/{id}/rescind"
        actor: system
        preconditions:
          - "the Application moves FUNDING_PENDING -> WITHDRAWN"
        side_effects:
          - "rejection_reason := 'AGREEMENT_RESCINDED'"

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [REVERSED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /pace/disbursements"
        actor: FundingOfficer
        preconditions:
          - "completion_certificate_id resolves to a CompletionCertificate of the same Application with status == VERIFIED"
          - "the Application status == FUNDING_PENDING"
          - "contractor_id equals the Application's contractor_id"
          - "the Contractor enrollment_status IN {ENROLLED, PROBATION}"
          - "amount_cents <= CompletionCertificate.certified_cost_cents"
          - "sum(amount_cents) over the Application's Disbursements with status IN {REQUESTED, HELD, RELEASED} plus this amount <= FinancingAgreement.contractor_payable_cents"
          - "the certificate still has headroom: the live draws (REQUESTED / HELD / RELEASED) against this completion_certificate_id sum to strictly less than certified_cost_cents (progress draws are legal; a fully drawn certificate is not)"
        side_effects:
          - "status := HELD instead of REQUESTED when the Contractor enrollment_status == PROBATION at creation time, with hold_reason := CONTRACTOR_PROBATION"
      - from: REQUESTED
        to: HELD
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == UPHOLD_REMEDY (cascade link 3)"
        actor: system
        preconditions:
          - "the Contractor moved to PROBATION or SUSPENDED in this cascade"
        side_effects:
          - "hold_reason := CONTRACTOR_PROBATION or CONTRACTOR_SUSPENSION"
          - "the owning Application moves FUNDING_PENDING -> FUNDING_HELD (cascade link 4)"
      - from: HELD
        to: REQUESTED
        trigger: "POST /pace/contractors/{id}/reinstate"
        actor: system
        preconditions:
          - "the Contractor returns to ENROLLED"
        side_effects:
          - "hold_reason := null; the owning Application moves FUNDING_HELD -> FUNDING_PENDING"
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /pace/disbursements/{id}/release"
        actor: FundingOfficer
        preconditions:
          - "the FinancingAgreement status IN {SIGNED, EFFECTIVE}"
          - "now >= FinancingAgreement.rescission_expires_at"
          - "oral_confirmation_required == false OR oral_confirmation_completed_at is not null"
          - "X-User-ID != CompletionCertificate.verified_by_user_id (segregation of duties)"
          - "the Contractor enrollment_status == ENROLLED"
          - "sum of RELEASED amounts including this one <= FinancingAgreement.contractor_payable_cents"
        side_effects:
          - "released_by_user_id := X-User-ID; released_at := now"
          - "Contractor.gross_disbursed_cents += amount_cents; net_disbursed_cents := gross_disbursed_cents - clawed_back_total_cents"
          - "the FinancingAgreement moves SIGNED -> EFFECTIVE on the first release"
          - "the Application moves FUNDING_PENDING -> FUNDED once released total == contractor_payable_cents"
      - from: RELEASED
        to: REVERSED
        trigger: "POST /pace/disbursements/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "a WorkmanshipComplaint on the same Application has status == ESCALATED_RECOURSE"
          - "reversal_reason is present in the request"
        side_effects:
          - "reversed_at := now; Contractor.clawed_back_total_cents += amount_cents; net_disbursed_cents := gross_disbursed_cents - clawed_back_total_cents (gross is never rewound)"
          - "the Application status is left untouched: a reversal is a contractor-recourse clawback, not an unwind of the homeowner's assessment"

  - entity: WorkmanshipComplaint
    initial_state: OPEN
    terminal_states: [CLOSED_REMEDIED, CLOSED_DENIED, ESCALATED_RECOURSE]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /pace/complaints"
        actor: PropertyOwner
        preconditions:
          - "the Application status IN {FUNDED, ASSESSED}"
          - "X-User-ID equals the Application's property_id"
          - "contractor_id equals the Application's contractor_id"
          - "at most COMPLAINT_CAP_PER_APPLICATION (3) complaints exist for the Application"
        side_effects:
          - "no score change on filing: only an upheld adjudication moves workmanship_score"
      - from: OPEN
        to: REMEDY_ORDERED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == UPHOLD_REMEDY"
        actor: ComplianceOfficer
        preconditions:
          - "remedy_deadline_on is present in the request and strictly after the current logical date"
        side_effects:
          - "adjudicated_at := now; adjudicated_by_user_id := X-User-ID; Contractor.upheld_open_remedy_count += 1"
          - "runs contractor_workmanship_score (both variants) -> Contractor.workmanship_score, Contractor.lifetime_workmanship_score (cascade link 2)"
          - "the Contractor may move ENROLLED/PROBATION -> PROBATION/SUSPENDED, which cascades to Disbursements (link 3) and Applications (link 4)"
      - from: OPEN
        to: CLOSED_DENIED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == DENY"
        actor: ComplianceOfficer
        preconditions:
          - "the complaint status == OPEN"
        side_effects:
          - "closed_at := now; no score change and no cascade (a denied complaint never penalises the contractor)"
      - from: REMEDY_ORDERED
        to: CLOSED_REMEDIED
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == REMEDY_VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "the current logical date <= remedy_deadline_on"
        side_effects:
          - "closed_at := now; Contractor.upheld_open_remedy_count -= 1"
          - "the score penalty is NOT refunded: workmanship_score keeps the deduction, so remediation only re-opens the reinstatement gate"
      - from: REMEDY_ORDERED
        to: ESCALATED_RECOURSE
        trigger: "POST /pace/complaints/{id}/adjudicate with decision == RECOURSE"
        actor: ComplianceOfficer
        preconditions:
          - "the current logical date > remedy_deadline_on"
        side_effects:
          - "closed_at := now; Contractor.upheld_open_remedy_count -= 1 (the complaint leaves REMEDY_ORDERED, so it is no longer an OPEN remedy obligation; the recourse is now monetary, not a repair)"
          - "the score penalty is NOT refunded either: workmanship_score and lifetime_workmanship_score keep the deduction because ESCALATED_RECOURSE is an upheld terminal status"
          - "RELEASED Disbursements of the Application become reversible"
          - "a Contractor already SUSPENDED moves to TERMINATED"

  - entity: Assessment
    dimension: billing_status
    initial_state: PENDING_ROLL
    terminal_states: [PAID_OFF]
    transitions:
      - from: null
        to: PENDING_ROLL
        trigger: "POST /pace/assessments"
        actor: CountyOfficer
        preconditions:
          - "the Application status == FUNDED"
          - "the FinancingAgreement status == EFFECTIVE"
          - "first_tax_year >= the tax year of the current logical date"
          - "no other Assessment on the same property_id has a tax-year span overlapping [first_tax_year, final_tax_year]"
        side_effects:
          - "final_tax_year := first_tax_year + term_years - 1; original_principal_cents := financed_amount_cents; principal_balance_cents := original_principal_cents"
          - "lien_status := SENIOR_RECORDED; transfer_status := NONE; delinquent_installment_count := 0"
          - "term_years AmortizationInstallment rows are generated in status SCHEDULED by level_payment_amortization_schedule"
          - "the Application moves FUNDED -> ASSESSED; the FinancingAgreement moves EFFECTIVE -> RECORDED; Property.recorded_pace_principal_cents += original_principal_cents"
      - from: PENDING_ROLL
        to: ON_ROLL
        trigger: "POST /pace/counties/{countyCode}/roll-runs covering first_tax_year"
        actor: CountyOfficer
        preconditions:
          - "the roll run's county_code == Assessment.apn county (Property.county_code)"
          - "the roll run's tax_year >= first_tax_year"
        side_effects:
          - "the installment for that tax_year moves SCHEDULED -> BILLED with billed_on := the roll run effective date"
      - from: ON_ROLL
        to: PAID_OFF
        trigger: "POST /pace/assessments/{id}/installments/{installmentId}/payments, POST /pace/assessments/{id}/prepayments, or POST /pace/assessment-transfers/{id}/record with mode == PAYOFF_AT_CLOSING"
        actor: system
        preconditions:
          - "principal_balance_cents reaches 0"
          - "no AmortizationInstallment remains in status DELINQUENT"
        side_effects:
          - "lien_status moves SENIOR_RECORDED -> RELEASED (cross-dimension coupling)"
          - "every AmortizationInstallment with status == SCHEDULED moves to CANCELLED"
          - "Property.recorded_pace_principal_cents -= the retired balance"

  - entity: Assessment
    dimension: lien_status
    initial_state: SENIOR_RECORDED
    terminal_states: [RELEASED]
    transitions:
      - from: SENIOR_RECORDED
        to: LIEN_SALE_REFERRED
        trigger: "POST /pace/counties/{countyCode}/roll-runs (cascade link 2)"
        actor: system
        preconditions:
          - "delinquent_installment_count >= LIEN_SALE_REFERRAL_COUNT (2) after this roll run's delinquency sweep"
        side_effects:
          - "penalties switch to the referred schedule (cap 3000 bps plus a 15000-cent referral fee)"
          - "every AssessmentTransfer of this Assessment with status == QUOTED moves to VOID_STALE (cascade link 3)"
          - "Property.tax_delinquency_count_36m += 1 (cascade link 3)"
          - "Applications on the same parcel with status IN {UNDER_REVIEW, CONSENT_PENDING} move to NEEDS_CURE (cascade link 4)"
      - from: LIEN_SALE_REFERRED
        to: SENIOR_RECORDED
        trigger: "POST /pace/assessments/{id}/installments/{installmentId}/payments (cure of the last delinquent installment)"
        actor: system
        preconditions:
          - "no AmortizationInstallment of the Assessment remains in status DELINQUENT after the payment"
        side_effects:
          - "delinquent_installment_count := 0; accrued_penalty_cents := 0"
          - "Property.tax_delinquency_count_36m is NOT decremented: the 36-month history is a permanent record"
      - from: SENIOR_RECORDED
        to: RELEASED
        trigger: "the billing dimension reaching PAID_OFF"
        actor: system
        preconditions:
          - "principal_balance_cents == 0"
        side_effects:
          - "the PACE lien loses its senior position; no further installment may be billed"

  - entity: AmortizationInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BILLED
        trigger: "POST /pace/counties/{countyCode}/roll-runs with tax_year == the installment tax_year"
        actor: CountyOfficer
        preconditions:
          - "the parent Assessment lien_status != RELEASED"
        side_effects:
          - "billed_on := the roll run effective date; the parent Assessment moves PENDING_ROLL -> ON_ROLL on the first billing"
      - from: BILLED
        to: PAID
        trigger: "POST /pace/assessments/{id}/installments/{installmentId}/payments"
        actor: CountyOfficer
        preconditions:
          - "amount_cents == total_due_cents (partial payments are rejected)"
        side_effects:
          - "paid_on := the payment date; paid_amount_cents := amount_cents"
          - "Assessment.principal_balance_cents -= principal_cents"
      - from: BILLED
        to: DELINQUENT
        trigger: "POST /pace/counties/{countyCode}/roll-runs (delinquency sweep, cascade link 1)"
        actor: system
        preconditions:
          - "the roll run effective date > due_on"
        side_effects:
          - "runs delinquency_penalty_accrual -> penalty_cents, months_past_due"
          - "Assessment.delinquent_installment_count += 1; Assessment.accrued_penalty_cents := sum of DELINQUENT penalty_cents"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /pace/assessments/{id}/installments/{installmentId}/payments"
        actor: CountyOfficer
        preconditions:
          - "amount_cents == total_due_cents + penalty_cents (the penalty must be paid with the installment)"
        side_effects:
          - "paid_on := the payment date; paid_amount_cents := amount_cents; Assessment.principal_balance_cents -= principal_cents"
          - "Assessment.delinquent_installment_count -= 1; the lien dimension may move LIEN_SALE_REFERRED -> SENIOR_RECORDED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pace/assessments/{id}/prepayments or POST /pace/assessment-transfers/{id}/record with mode == PAYOFF_AT_CLOSING"
        actor: system
        preconditions:
          - "the Assessment principal_balance_cents reaches 0"
        side_effects:
          - "no penalty is ever accrued on a CANCELLED installment"

  - entity: AssessmentTransfer
    initial_state: QUOTED
    terminal_states: [RECORDED_ASSUMED, RECORDED_PAID_OFF, VOID_STALE, EXPIRED]
    transitions:
      - from: null
        to: QUOTED
        trigger: "POST /pace/assessment-transfers"
        actor: CountyOfficer
        preconditions:
          - "the Assessment billing_status == ON_ROLL"
          - "the Assessment lien_status == SENIOR_RECORDED (a referred lien must be cured before a sale quote)"
          - "closing_date >= the current logical date"
          - "no other AssessmentTransfer of the same Assessment with status == QUOTED has a quote window overlapping [quoted_at, good_through_date + QUOTE_BUFFER_DAYS)"
        side_effects:
          - "quoted_at := now; good_through_date := the date of now + QUOTE_VALIDITY_DAYS (30)"
          - "runs payoff_quote_composition -> payoff_principal_cents, accrued_interest_cents, payoff_admin_fee_cents, base_payoff_cents, prepayment_premium_bps, prepayment_premium_cents, payoff_total_cents"
          - "Assessment.transfer_status := QUOTED"
      - from: QUOTED
        to: RECORDED_ASSUMED
        trigger: "POST /pace/assessment-transfers/{id}/record with mode == ASSUME_WITH_PROPERTY"
        actor: CountyOfficer
        preconditions:
          - "the current logical date < good_through_date"
          - "the Assessment lien_status == SENIOR_RECORDED"
          - "no AmortizationInstallment of the Assessment has status == DELINQUENT"
        side_effects:
          - "recorded_on := the current logical date; Assessment.transfer_status := ASSUMED"
          - "Property.owner_full_name := buyer_full_name; Property.owner_birth_date := buyer_birth_date"
          - "the remaining SCHEDULED installments are untouched: the buyer inherits the amortization unchanged"
      - from: QUOTED
        to: RECORDED_PAID_OFF
        trigger: "POST /pace/assessment-transfers/{id}/record with mode == PAYOFF_AT_CLOSING"
        actor: CountyOfficer
        preconditions:
          - "the current logical date < good_through_date"
          - "the Assessment lien_status == SENIOR_RECORDED"
          - "no AmortizationInstallment of the Assessment has status == DELINQUENT"
        side_effects:
          - "recorded_on := the current logical date; Assessment.transfer_status := PAID_OFF_AT_SALE"
          - "Assessment.principal_balance_cents := 0; billing_status -> PAID_OFF; lien_status -> RELEASED; SCHEDULED installments -> CANCELLED"
          - "Property.owner_full_name/owner_birth_date are replaced by the buyer values; Property.recorded_pace_principal_cents -= the retired balance"
      - from: QUOTED
        to: VOID_STALE
        trigger: "POST /pace/counties/{countyCode}/roll-runs (cascade link 3)"
        actor: system
        preconditions:
          - "the parent Assessment moved lien_status SENIOR_RECORDED -> LIEN_SALE_REFERRED in this roll run"
        side_effects:
          - "Assessment.transfer_status := NONE, freeing the quote window for a post-cure re-quote"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /pace/assessment-transfers/{id}/record after the quote lapsed"
        actor: system
        preconditions:
          - "the current logical date >= good_through_date"
        side_effects:
          - "the transfer moves to EXPIRED and the record call is rejected with ERR_QUOTE_EXPIRED in the same request"
          - "Assessment.transfer_status := NONE"

# =============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency control only.
#   Both rules guard a PARENT `version` that a serially-observable read cannot
#   substitute for: the caller must echo the version it read.
# =============================================================================
concurrency_rules:
  - id: agreement-issue-stale-application
    scenario: "An UnderwritingAnalyst reads an APPROVED Application, then a ProjectMeasure addition during an intervening cure round bumps the Application version; the analyst posts POST /pace/financing-agreements quoting the version it read."
    write_endpoint: "POST /pace/financing-agreements"
    occ_field: "Application.version"
    occ_input: expected_application_version
    guarantee: "The write is accepted only when expected_application_version equals the Application's current version; otherwise the agreement is not created and no fee is computed."
    error_id: ERR_APPLICATION_VERSION_CONFLICT
    http_status: 412
    side_effect_on_success: "Application.version is incremented, so replaying the same expected_application_version afterwards fails."
  - id: prepayment-stale-assessment
    scenario: "A CountyOfficer reads an ON_ROLL Assessment to compute a prepayment, an installment payment lands first and reduces principal_balance_cents (bumping Assessment.version), and the officer then posts POST /pace/assessments/{id}/prepayments with the stale version."
    write_endpoint: "POST /pace/assessments/{id}/prepayments"
    occ_field: "Assessment.version"
    occ_input: expected_assessment_version
    guarantee: "The prepayment is applied only when expected_assessment_version equals the Assessment's current version; otherwise principal_balance_cents is unchanged and no installment is cancelled."
    error_id: ERR_ASSESSMENT_VERSION_CONFLICT
    http_status: 412
    side_effect_on_success: "Assessment.version is incremented on every accepted prepayment, payment and roll-run mutation."
  - id: measure-add-stale-application
    scenario: "A PropertyOwner reads a DRAFT Application at version N and derives two measure additions from that single read; the first POST /pace/applications/{id}/measures succeeds and bumps the version, and the second still quotes N."
    write_endpoint: "POST /pace/applications/{id}/measures"
    occ_field: "Application.version"
    occ_input: expected_application_version
    guarantee: "Only the addition quoting the Application's current version is accepted; the stale one creates no ProjectMeasure and leaves requested_principal_cents unchanged."
    error_id: ERR_APPLICATION_VERSION_CONFLICT
    http_status: 412
    side_effect_on_success: "Application.version is incremented by every accepted measure addition, so the client must re-read between additions."

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
#   All money is integer cents; all ratios are integer basis points (bps).
#   Every quantization is round_half_up unless a step explicitly says otherwise.
# =============================================================================
calculations:
  - name: present_value_annuity_factor
    description: "Shared 3%-discount annuity factor used by the savings-to-investment ratio. Pinned to 10 decimal places so every downstream SIR is reproducible bit-for-bit."
    trigger: "Internally, whenever savings_to_investment_ratio runs"
    inputs: [EligibleProduct.useful_life_years]
    algorithm: threshold
    formula: |
      r  = DISCOUNT_RATE_BPS / 10000                  # 0.03
      AF = (1 - (1 + r) ** (-useful_life_years)) / r
      AF = round_half_up(AF, 10 decimal places)       # quantize BEFORE any multiplication
      # Pinned reference values (the only useful lives products may declare):
      #   AF(10) = 8.5302028368   AF(15) = 11.9379350868  AF(18) = 13.7535130795
      #   AF(20) = 14.8774748605  AF(25) = 17.4131476913
    constants:
      DISCOUNT_RATE_BPS: 300
      AF_DECIMALS: 10
    precision: "10 decimal places, round_half_up; quantized before multiplication by savings"

  - name: savings_to_investment_ratio
    description: "Ratio of discounted lifetime energy savings to installed cost, in bps. Applied twice with different aggregation: once per measure as an eligibility gate, once blended across the portfolio."
    trigger: "POST /pace/applications/{id}/submit, POST /pace/applications/{id}/cure, POST /pace/applications/{id}/underwrite, GET /pace/applications/{id}/eligibility-report"
    inputs:
      - ProjectMeasure.installed_cost_cents
      - ProjectMeasure.estimated_annual_savings_cents
      - EligibleProduct.useful_life_years
    algorithm: threshold
    formula: |
      # per measure
      pv_savings_cents = round_half_up(estimated_annual_savings_cents * AF(useful_life_years))
      sir_bps          = round_half_up(pv_savings_cents * 10000 / installed_cost_cents)
      # portfolio
      portfolio_sir_bps = round_half_up(sum(pv_savings_cents) * 10000 / sum(installed_cost_cents))
      # gate
      measure passes  <=>  sir_bps >= SIR_FLOOR_BPS
      application passes <=> portfolio_sir_bps >= SIR_FLOOR_BPS AND every measure counted in the
                             principal passes the per-measure gate
    constants:
      SIR_FLOOR_BPS: 10000
    precision: "cents and bps are integers, round_half_up at each of the two steps (never one fused division)"
    variants:
      - name: per_measure_gate
        when: "Deciding each ProjectMeasure's own APPROVED / INELIGIBLE outcome during underwrite"
        difference: "Evaluated measure by measure against SIR_FLOOR_BPS; a single measure below 10000 bps is dropped from the principal even when the blend is comfortably above the floor."
      - name: portfolio_blended
        when: "Deciding the Application-level SIR_FLOOR gate and populating portfolio_sir_bps"
        difference: "Sums pv_savings_cents and installed_cost_cents across the measure set first and divides once, so a strong measure can carry a weak one; this is why the two variants disagree on identical data."
    variant_input_set:
      per_measure_gate: "each ProjectMeasure individually, statuses PROPOSED (at submit/cure) or PROPOSED (at underwrite)"
      portfolio_blended: "the whole PROPOSED measure set at submit/cure, and the APPROVED subset once underwrite has classified them"

  - name: combined_lien_to_value_ratio
    description: "Combined loan-to-value across the senior mortgage debt and all PACE principal on the parcel, in bps. Also produces the property equity and property-tax-to-value screens."
    trigger: "POST /pace/applications/{id}/submit (screening), POST /pace/applications/{id}/underwrite (binding), GET /pace/applications/{id}/eligibility-report"
    inputs:
      - Property.assessed_value_cents
      - Property.market_value_cents
      - Property.appraisal_effective_on
      - Property.senior_lien_balance_cents
      - Property.committed_pace_principal_cents
      - Application.requested_principal_cents
    algorithm: threshold
    formula: |
      basis_value = assessed_value_cents            # assessed_basis variant
                  | market_value_cents              # market_basis variant, only when the appraisal is fresh
      pace_exposure = committed_pace_principal_cents + requested_principal_cents
      cltv_bps   = round_half_up((senior_lien_balance_cents + pace_exposure) * 10000 / basis_value)
      ptv_bps    = round_half_up(requested_principal_cents * 10000 / assessed_value_cents)   # always assessed
      equity_bps = 10000 - round_half_up(senior_lien_balance_cents * 10000 / assessed_value_cents)
      # equity_bps follows the §1.1 Property.equity_ratio_bps definition exactly: the
      # ratio is rounded FIRST and then subtracted from 10000, never the other way round.
      passes <=> cltv_bps <= CLTV_CAP_BPS AND ptv_bps <= PTV_CAP_BPS AND equity_bps >= EQUITY_FLOOR_BPS
    constants:
      CLTV_CAP_BPS: 9700
      PTV_CAP_BPS: 1500
      EQUITY_FLOOR_BPS: 1000
      APPRAISAL_STALENESS_DAYS: 180
    precision: "integer bps, round_half_up; the cap comparison is inclusive (cltv_bps == 9700 passes, 9701 fails)"
    variants:
      - name: assessed_basis
        when: "valuation_basis == ASSESSED, or valuation_basis == MARKET while appraisal_effective_on is more than 180 days before the current logical date"
        difference: "Divides by the county assessed value. Because assessed values lag the market, the same debt yields a HIGHER cltv_bps, so this is the conservative basis and the only one allowed for screening at submit."
      - name: market_basis
        when: "valuation_basis == MARKET and the current logical date minus appraisal_effective_on <= 180 days"
        difference: "Divides by the appraised market value. A stale appraisal silently degrades to assessed_basis and rewrites Application.valuation_basis to ASSESSED, so the response reveals which variant actually ran."
    variant_input_set:
      assessed_basis: "Property.assessed_value_cents"
      market_basis: "Property.market_value_cents when fresh, else fall back to assessed_value_cents and record the fallback"

  - name: weighted_average_useful_life
    description: "Cost-weighted average effective useful life of the measure set, truncated to whole years. Caps the financing term."
    trigger: "POST /pace/applications/{id}/submit, POST /pace/applications/{id}/cure"
    inputs: [ProjectMeasure.installed_cost_cents, EligibleProduct.useful_life_years]
    algorithm: aggregation
    formula: |
      weighted_useful_life_years = floor(
        sum(installed_cost_cents * useful_life_years) / sum(installed_cost_cents)
      )
      # truncation, NOT round_half_up: the program never finances beyond the physical life
    constants: {}
    precision: "integer years, floor (truncate toward zero)"

  - name: financed_amount_composition
    description: "Builds the amount actually placed on the tax roll from the approved principal plus program fees. The contractor is only ever paid the principal."
    trigger: "POST /pace/financing-agreements"
    inputs: [Application.requested_principal_cents]
    algorithm: waterfall_allocation
    formula: |
      principal_cents            = Application.requested_principal_cents   # APPROVED measures only
      admin_fee_cents            = round_half_up(principal_cents * ADMIN_FEE_BPS / 10000)
      county_recording_fee_cents = COUNTY_RECORDING_FEE_CENTS
      financed_amount_cents      = principal_cents + admin_fee_cents + county_recording_fee_cents
      contractor_payable_cents   = principal_cents
    constants:
      ADMIN_FEE_BPS: 250
      COUNTY_RECORDING_FEE_CENTS: 9500
    precision: "integer cents, round_half_up on the admin fee only"

  - name: level_payment_amortization_schedule
    description: "Level annual payment amortization of the financed amount onto the county tax roll, with a pinned per-year rounding order and a final-year balloon absorber."
    trigger: "POST /pace/financing-agreements (annual_installment_cents only) and POST /pace/assessments (the full installment set)"
    inputs: [FinancingAgreement.financed_amount_cents, FinancingAgreement.apr_bps, FinancingAgreement.term_years, Assessment.first_tax_year]
    algorithm: chronological
    formula: |
      r  = apr_bps / 10000
      AF = round_half_up((1 - (1 + r) ** (-term_years)) / r, 10 decimal places)
      annual_installment_cents = round_half_up(financed_amount_cents / AF)
      # Pinned reference: AF(20 y, 800 bps) = 9.8181474074; AF(25 y, 800 bps) = 10.6747761886
      balance = financed_amount_cents
      for year in 1 .. term_years:                       # STRICTLY chronological
          interest_cents = round_half_up(balance * r)    # round the interest FIRST
          if year < term_years:
              principal_cents = annual_installment_cents - interest_cents   # then subtract
          else:
              principal_cents = balance                  # final year absorbs the drift
          servicing_fee_cents = ANNUAL_SERVICING_FEE_CENTS
          total_due_cents     = principal_cents + interest_cents + servicing_fee_cents
          balance            -= principal_cents
          tax_year            = first_tax_year + year - 1
          due_on              = December 10 of tax_year
      # Guarantees: sum(principal_cents) == financed_amount_cents exactly, balance ends at 0,
      # and only the FINAL total_due_cents may differ from the others.
    constants:
      ANNUAL_SERVICING_FEE_CENTS: 4000
      DUE_MONTH: 12
      DUE_DAY: 10
    precision: "integer cents; interest is quantized per year before principal is derived, so the rounding order is observable"

  - name: delinquency_penalty_accrual
    description: "Penalty on a past-due installment: a flat base plus a per-full-30-day increment, capped, with a harsher cap and a flat referral fee once the lien has been referred for tax sale."
    trigger: "POST /pace/counties/{countyCode}/roll-runs (delinquency sweep) ONLY; penalty_cents and months_past_due are stamped on the installment at the sweep that moves it BILLED -> DELINQUENT and are never recomputed on read, so an already-DELINQUENT installment keeps its original figure through later runs"
    inputs: [AmortizationInstallment.total_due_cents, AmortizationInstallment.due_on, Assessment.lien_status]
    algorithm: threshold
    formula: |
      days_past_due  = (roll_run_effective_date - due_on) in whole days      # > 0 to be delinquent
      months_past_due = floor(days_past_due / DAYS_PER_PENALTY_MONTH)        # 29 days -> 0, 30 days -> 1
      raw_bps  = BASE_PENALTY_BPS + MONTHLY_PENALTY_BPS * months_past_due
      cap_bps  = REFERRED_PENALTY_CAP_BPS if Assessment.lien_status == LIEN_SALE_REFERRED
                 else PENALTY_CAP_BPS
      rate_bps = min(raw_bps, cap_bps)
      penalty_cents = round_half_up(total_due_cents * rate_bps / 10000)
      if Assessment.lien_status == LIEN_SALE_REFERRED:
          penalty_cents += LIEN_REFERRAL_FEE_CENTS        # flat fee added AFTER the cap
    constants:
      BASE_PENALTY_BPS: 1000
      MONTHLY_PENALTY_BPS: 150
      PENALTY_CAP_BPS: 2400
      REFERRED_PENALTY_CAP_BPS: 3000
      LIEN_REFERRAL_FEE_CENTS: 15000
      DAYS_PER_PENALTY_MONTH: 30
    precision: "integer cents, round_half_up; the flat referral fee is never subject to the cap"
    ordering_note: "Assessment.lien_status is read as of the START of step 2 of the roll run (see the POST /pace/counties/{countyCode}/roll-runs pinned step order). A run that itself pushes an assessment to LIEN_SALE_REFERRED therefore prices its installments with PENALTY_CAP_BPS and no referral fee; only later runs use REFERRED_PENALTY_CAP_BPS."

  - name: payoff_quote_composition
    description: "Payoff figure for a sale or prepayment: principal, actual/365 accrued interest and an admin fee form a base, and the prepayment premium tier is keyed on that BASE — never on the total it helps produce."
    trigger: "POST /pace/assessment-transfers, POST /pace/assessments/{id}/prepayments"
    inputs: [Assessment.principal_balance_cents, Assessment.apr_bps, Assessment.interest_accrual_from, AssessmentTransfer.closing_date]
    algorithm: tiered_pricing
    formula: |
      # step 1 - principal
      payoff_principal_cents = Assessment.principal_balance_cents
      # step 2 - actual/365 interest since the last accrual anchor
      days_accrued           = (closing_date - Assessment.interest_accrual_from date) in whole days
      accrued_interest_cents = round_half_up(
          payoff_principal_cents * (apr_bps / 10000) * days_accrued / 365 )
      # step 3 - fee
      payoff_admin_fee_cents = PAYOFF_ADMIN_FEE_CENTS
      # step 4 - base
      base_payoff_cents      = payoff_principal_cents + accrued_interest_cents + payoff_admin_fee_cents
      # step 5 - tier selected on base_payoff_cents (PINNED; using payoff_total_cents here is circular)
      prepayment_premium_bps = 0   if base_payoff_cents <  PREMIUM_TIER1_CEILING_CENTS
                             | 200 if base_payoff_cents <  PREMIUM_TIER2_CEILING_CENTS
                             | 350 otherwise
      # step 6 - premium and total
      prepayment_premium_cents = round_half_up(base_payoff_cents * prepayment_premium_bps / 10000)
      payoff_total_cents       = base_payoff_cents + prepayment_premium_cents
    constants:
      PAYOFF_ADMIN_FEE_CENTS: 7500
      PREMIUM_TIER1_CEILING_CENTS: 1000000
      PREMIUM_TIER2_CEILING_CENTS: 5000000
      PREMIUM_TIER1_BPS: 0
      PREMIUM_TIER2_BPS: 200
      PREMIUM_TIER3_BPS: 350
      DAY_COUNT_BASIS: 365
    precision: "integer cents, round_half_up once on interest and once on the premium; the six steps are evaluated in the stated order and no step may be folded into another"

  - name: contractor_workmanship_score
    description: "Workmanship score in bps, 10000 minus severity-weighted deductions for upheld complaints. Computed over two different windows that gate different decisions."
    trigger: "POST /pace/complaints/{id}/adjudicate (any decision), POST /pace/contractors/{id}/reinstate (re-evaluated before the gate)"
    inputs: [WorkmanshipComplaint.severity, WorkmanshipComplaint.status, WorkmanshipComplaint.created_at]
    algorithm: weighted_scoring
    formula: |
      upheld = complaints of the contractor with status IN {REMEDY_ORDERED, CLOSED_REMEDIED, ESCALATED_RECOURSE}
      # DENIED complaints never deduct; a remedied complaint keeps its deduction.
      deduction(c) = MINOR_PENALTY_BPS  if c.severity == MINOR
                   | MAJOR_PENALTY_BPS  if c.severity == MAJOR
                   | SEVERE_PENALTY_BPS if c.severity == SEVERE
      score(set) = max(0, 10000 - sum(deduction(c) for c in set))
      # enrollment consequence, evaluated on the trailing_24m variant only:
      #   score <  SUSPENSION_THRESHOLD_BPS -> SUSPENDED
      #   score <  PROBATION_THRESHOLD_BPS  -> PROBATION
      #   otherwise                         -> unchanged
    constants:
      MINOR_PENALTY_BPS: 300
      MAJOR_PENALTY_BPS: 800
      SEVERE_PENALTY_BPS: 2000
      PROBATION_THRESHOLD_BPS: 9000
      SUSPENSION_THRESHOLD_BPS: 7000
      REINSTATE_TRAILING_BPS: 9000
      REINSTATE_LIFETIME_BPS: 8000
      TRAILING_WINDOW_DAYS: 730
    precision: "integer bps, floored at 0; no rounding is needed because all deductions are whole bps"
    variants:
      - name: trailing_24m
        when: "Deciding enrollment_status (PROBATION / SUSPENDED) and the trailing half of the reinstatement gate"
        difference: "Only counts upheld complaints whose created_at is within TRAILING_WINDOW_DAYS (730) of the current logical date, so old defects age out and a contractor can recover to 10000 by waiting."
      - name: lifetime
        when: "Populating lifetime_workmanship_score and the second half of the reinstatement gate (>= 8000)"
        difference: "Counts every upheld complaint ever filed with no window, so it never recovers; a contractor whose old defects have aged out of the trailing window can still be barred from reinstatement by lifetime."
    variant_input_set:
      trailing_24m: "upheld complaints with created_at >= now - 730 days"
      lifetime: "all upheld complaints regardless of age"

  - name: lender_consent_posture
    description: "Derives the Application-level consent posture from the mortgage holders' individual responses, applying deemed consent only in counties whose program rules allow it."
    trigger: "POST /pace/applications/{id}/underwrite, POST /pace/mortgage-liens/{id}/consent-response, POST /pace/applications/{id}/approve, GET /pace/applications/{id}/eligibility-report"
    inputs: [MortgageLien.status, MortgageLien.consent_response, MortgageLien.consent_deadline_at, MortgageLien.consent_application_id, Property.county_code]
    algorithm: threshold
    formula: |
      liens = MortgageLien rows on the parcel with status == ACTIVE and consent_application_id == this Application
      # deemed-consent sweep (only inside POST /pace/applications/{id}/approve):
      for lien in liens where consent_response == PENDING and now >= consent_deadline_at:
          if Property.county_code IN DEEMED_CONSENT_COUNTIES:
              lien.consent_response = DEEMED_CONSENTED
      # posture, evaluated in this fixed order:
      VETOED      if any lien.consent_response == DECLINED
      PENDING     else if any lien.consent_response IN {NOT_NOTIFIED, PENDING}
      CLEARED     else                        # includes the empty-lien case (nothing to consent)
      NOT_STARTED only while the Application is still DRAFT
    constants:
      CONSENT_WINDOW_DAYS: 30
      DEEMED_CONSENT_COUNTIES: ["06073", "06037"]
    precision: "not numeric; the ordering of the three posture tests is normative"

  - name: rescission_window_expiry
    description: "Three-business-day right of rescission. The window closes at the start of the day after the third program business day following signature, so the whole third day belongs to the homeowner."
    trigger: "POST /pace/financing-agreements/{id}/sign"
    inputs: [FinancingAgreement.signed_at]
    algorithm: chronological
    formula: |
      d = date(signed_at)                    # the signing day itself never counts
      counted = 0
      while counted < RESCISSION_BUSINESS_DAYS:
          d = d + 1 day
          if weekday(d) NOT IN {SATURDAY, SUNDAY} and d NOT IN PROGRAM_HOLIDAYS:
              counted = counted + 1
      rescission_expires_at = (d + 1 day) at 00:00:00Z
      # Worked references (PROGRAM_HOLIDAYS as listed below):
      #   signed 2026-08-12 (Wed) -> 2026-08-18T00:00:00Z
      #   signed 2026-08-13 (Thu) -> 2026-08-19T00:00:00Z
      #   signed 2026-09-03 (Thu, 09-07 holiday skipped) -> 2026-09-10T00:00:00Z
      #   signed 2026-09-04 (Fri) -> 2026-09-11T00:00:00Z
    constants:
      RESCISSION_BUSINESS_DAYS: 3
      PROGRAM_HOLIDAYS: ["2026-09-07", "2026-11-26", "2026-12-25", "2027-01-01", "2027-07-03"]
    precision: "whole days; the expiry instant is exactly 00:00:00Z and the comparison at release is now >= rescission_expires_at while the comparison at rescind is now < rescission_expires_at"

  - name: committed_pace_principal_rollup
    description: "Parcel-level conserved quantity: the PACE principal the program has actually committed to. Every sign adds and every rescission removes exactly the same amount."
    trigger: "POST /pace/financing-agreements/{id}/sign, POST /pace/financing-agreements/{id}/rescind, POST /pace/assessments, POST /pace/assessment-transfers/{id}/record"
    inputs: [FinancingAgreement.status, FinancingAgreement.financed_amount_cents, Assessment.principal_balance_cents, Assessment.billing_status]
    algorithm: aggregation
    formula: |
      recorded_pace_principal_cents  = sum(
          principal_balance_cents for Assessments on the parcel with billing_status IN {PENDING_ROLL, ON_ROLL} )
      committed_pace_principal_cents = recorded_pace_principal_cents + sum(
          financed_amount_cents for FinancingAgreements whose application.property_id == this parcel
          and whose status IN {SIGNED, EFFECTIVE} )
      # Hand-off invariant: when an Assessment is recorded the agreement moves EFFECTIVE -> RECORDED
      # (dropping out of the second sum) at the same instant principal_balance_cents enters the first,
      # so committed_pace_principal_cents does not move on POST /pace/assessments.
      # Invariants (checked after every mutation above):
      #   committed_pace_principal_cents >= recorded_pace_principal_cents
      #   an ISSUED, VOID, RESCINDED or RECORDED agreement contributes nothing to the second sum
      #   sign(+X) followed by rescind(-X) returns committed_pace_principal_cents to its prior value
    constants: {}
    precision: "integer cents; the rollup is recomputed from the contributing rows, never incremented blindly"

  - name: contractor_net_disbursed_rollup
    description: "Contractor cash position. gross is monotonically non-decreasing and a reversal only grows the clawback side, so the two-sided ledger always reconciles."
    trigger: "POST /pace/disbursements/{id}/release, POST /pace/disbursements/{id}/reverse"
    inputs: [Disbursement.status, Disbursement.amount_cents]
    algorithm: aggregation
    formula: |
      gross_disbursed_cents   = sum(amount_cents for disbursements with status IN {RELEASED, REVERSED})
      clawed_back_total_cents = sum(amount_cents for disbursements with status == REVERSED)
      net_disbursed_cents     = gross_disbursed_cents - clawed_back_total_cents
      # Invariants: gross never decreases; net == sum over RELEASED only; net >= 0
    constants: {}
    precision: "integer cents; no rounding"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — evaluated in strict priority order.
#   Ladder: auth -> role -> schema -> path existence -> body FK existence ->
#           ownership -> OCC -> referential -> state -> safety/compliance ->
#           temporal -> constraint -> fiscal.
#   The lower the priority number, the earlier the check runs; the FIRST failing
#   check determines the response, and no side effect of a later stage is applied.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and non-empty; X-User-ID present on every endpoint whose authorized_roles include an entity_backed role"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all
    description: "Header presence is checked before anything else, including request-body shape."
  - priority: 2
    category: auth
    check: "X-Role is one of the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role authorization precedes schema validation, so a wrong role on a malformed body still yields ERR_UNAUTHORIZED."
  - priority: 3
    category: request_schema
    check: "All required body fields present, all types/enums valid, integers non-negative where the field is a cents/bps amount, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
    description: "Pure shape validation with no database access."
  - priority: 4
    category: existence
    check: "Every id in the request path resolves to a live row"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_MORTGAGE_LIEN_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_TRANSFER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Outer path segment is resolved before inner ones (e.g. the Assessment before the installment)."
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to a live row"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_MEASURE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /pace/applications, POST /pace/mortgage-liens, POST /pace/applications/{id}/measures, POST /pace/financing-agreements, POST /pace/completion-certificates, POST /pace/disbursements, POST /pace/complaints, POST /pace/assessments, POST /pace/assessment-transfers"
    description: "Body FK resolution happens after path resolution and before ownership."
  - priority: 6
    category: auth
    check: "For an entity_backed caller the X-User-ID must equal the id of the entity it acts for: PropertyOwner -> the Application's property_id, Contractor -> the Application's contractor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /pace/applications, POST /pace/applications/{id}/measures, POST /pace/applications/{id}/submit, POST /pace/applications/{id}/cure, POST /pace/financing-agreements/{id}/sign, POST /pace/financing-agreements/{id}/rescind, POST /pace/completion-certificates, POST /pace/completion-certificates/{id}/sign, POST /pace/complaints"
    description: "Ownership is a per-row check and therefore runs after the row has been loaded, unlike the coarse role check at priority 2."
  - priority: 7
    category: concurrency
    check: "expected_<parent>_version equals the parent's current version"
    error_id: "ERR_APPLICATION_VERSION_CONFLICT | ERR_ASSESSMENT_VERSION_CONFLICT"
    http_status: 412
    applies_to: "POST /pace/applications/{id}/measures, POST /pace/financing-agreements, POST /pace/assessments/{id}/prepayments"
    description: "OCC is checked before any business rule so a stale writer never learns whether its business intent was otherwise valid."
  - priority: 8
    category: business_referential
    check: "The referenced EligibleProduct.status == ACTIVE"
    error_id: ERR_PRODUCT_RETIRED
    http_status: 422
    applies_to: "POST /pace/applications/{id}/measures"
    description: "A RETIRED product can still be read and can still appear on old measures, but no new measure may reference it."
  - priority: 9
    category: business_referential
    check: "The referenced Contractor.enrollment_status == ENROLLED at application creation"
    error_id: ERR_CONTRACTOR_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /pace/applications, POST /pace/disbursements, POST /pace/disbursements/{id}/release"
    description: "Creation demands ENROLLED; disbursement creation additionally tolerates PROBATION (it lands HELD); release demands ENROLLED again."
  - priority: 10
    category: business_referential
    check: "supersedes_application_id points at an Application on the SAME property_id whose status IN {DECLINED, WITHDRAWN}"
    error_id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 422
    applies_to: "POST /pace/applications"
    description: "Prevents a live application from being chained behind another live one."
  - priority: 11
    category: business_referential
    check: "Every id in measure_ids is a ProjectMeasure of the same Application; the Disbursement's completion_certificate_id belongs to the same Application; the installment in the path belongs to the Assessment in the path; the MortgageLien's consent_application_id is set and matches the Application being approved"
    error_id: "ERR_MEASURE_NOT_IN_APPLICATION | ERR_CERTIFICATE_APPLICATION_MISMATCH | ERR_INSTALLMENT_ASSESSMENT_MISMATCH | ERR_LIEN_NOT_NOTIFIED"
    http_status: 422
    applies_to: "POST /pace/completion-certificates, POST /pace/disbursements, POST /pace/assessments/{id}/installments/{installmentId}/payments, POST /pace/mortgage-liens/{id}/consent-response"
    description: "Cross-aggregate wiring errors are distinguished from plain 404s: the row exists but belongs to a different parent."
  - priority: 12
    category: business_referential
    check: "The Disbursement's contractor_id equals the Application's contractor_id"
    error_id: ERR_CONTRACTOR_MISMATCH
    http_status: 422
    applies_to: "POST /pace/disbursements, POST /pace/complaints"
    description: "Money and complaints may only ever be routed to the contractor named on the application."
  - priority: 13
    category: state
    check: "The Application is in a status that permits the operation"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/applications/{id}/measures, POST /pace/applications/{id}/submit, POST /pace/applications/{id}/underwrite, POST /pace/applications/{id}/cure, POST /pace/applications/{id}/approve, POST /pace/financing-agreements, POST /pace/completion-certificates, POST /pace/completion-certificates/{id}/verify, POST /pace/disbursements, POST /pace/complaints, POST /pace/assessments"
    description: "Includes the idempotency guard: a second submit, underwrite, approve or assessment on the same Application fails here."
  - priority: 14
    category: state
    check: "The FinancingAgreement is in a status that permits the operation (sign requires ISSUED; rescind requires SIGNED; oral-confirmation requires ISSUED or SIGNED)"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/financing-agreements/{id}/sign, POST /pace/financing-agreements/{id}/rescind, POST /pace/financing-agreements/{id}/oral-confirmation, POST /pace/disbursements/{id}/release"
    description: "A VOID agreement (superseded by a re-issue) can never be signed."
  - priority: 15
    category: state
    check: "The CompletionCertificate is in a status that permits the operation (sign requires CONTRACTOR_ATTESTED; verify requires HOMEOWNER_SIGNED; a Disbursement requires VERIFIED)"
    error_id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/completion-certificates/{id}/sign, POST /pace/completion-certificates/{id}/verify, POST /pace/disbursements"
    description: "Funds can never be requested against an unverified or rejected certificate."
  - priority: 16
    category: state
    check: "The Disbursement is in a status that permits the operation (release requires REQUESTED; reverse requires RELEASED)"
    error_id: ERR_DISBURSEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/disbursements/{id}/release, POST /pace/disbursements/{id}/reverse"
    description: "A HELD disbursement cannot be released until the contractor is reinstated; a REVERSED one is terminal."
  - priority: 17
    category: state
    check: "The WorkmanshipComplaint status permits the requested decision (UPHOLD_REMEDY/DENY require OPEN; REMEDY_VERIFIED/RECOURSE require REMEDY_ORDERED)"
    error_id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/complaints/{id}/adjudicate"
    description: "Terminal complaint states reject every further adjudication."
  - priority: 18
    category: state
    check: "The Contractor enrollment_status permits the operation (enroll requires PENDING_REVIEW; reinstate requires PROBATION or SUSPENDED)"
    error_id: ERR_CONTRACTOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/contractors/{id}/enroll, POST /pace/contractors/{id}/reinstate"
    description: "TERMINATED is terminal: neither enroll nor reinstate can revive it."
  - priority: 19
    category: state
    check: "The Assessment billing_status/lien_status permit the operation. Payoff quotes (POST /pace/assessment-transfers) and prepayments require billing_status == ON_ROLL AND lien_status == SENIOR_RECORDED. Installment payments require billing_status == ON_ROLL ONLY and are explicitly LEGAL while lien_status == LIEN_SALE_REFERRED, because paying the delinquent installments is the only cure path back to SENIOR_RECORDED."
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/assessment-transfers, POST /pace/assessments/{id}/prepayments, POST /pace/assessments/{id}/installments/{installmentId}/payments"
    description: "The two dimensions are checked independently: the lien dimension gates sales and prepayments (forcing a delinquency cure before a sale) but never gates the cure payment itself, otherwise LIEN_SALE_REFERRED would be a trap state."
  - priority: 20
    category: state
    check: "The AmortizationInstallment status permits payment (BILLED or DELINQUENT only)"
    error_id: ERR_INSTALLMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/assessments/{id}/installments/{installmentId}/payments"
    description: "A SCHEDULED installment has not been placed on the roll yet and a PAID or CANCELLED one is terminal."
  - priority: 21
    category: state
    check: "The AssessmentTransfer status == QUOTED"
    error_id: ERR_TRANSFER_STATE_INVALID
    http_status: 409
    applies_to: "POST /pace/assessment-transfers/{id}/record"
    description: "A VOID_STALE quote (lien referred for tax sale) and an already-recorded transfer both reject recording."
  - priority: 22
    category: business_safety
    check: "now >= FinancingAgreement.rescission_expires_at before any money moves"
    error_id: ERR_RESCISSION_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /pace/disbursements/{id}/release"
    description: "The three-day right of rescission outranks every fiscal check: a release that is both early AND over the payable cap reports ERR_RESCISSION_PERIOD_ACTIVE."
  - priority: 23
    category: business_safety
    check: "If FinancingAgreement.oral_confirmation_required then oral_confirmation_completed_at is not null"
    error_id: ERR_ORAL_CONFIRMATION_REQUIRED
    http_status: 422
    applies_to: "POST /pace/disbursements/{id}/release"
    description: "Spanish-language or non-owner-occupied deals demand a recorded oral confirmation call before funding."
  - priority: 24
    category: business_safety
    check: "Segregation of duties: the approver must differ from the underwriter, and the disbursement releaser must differ from the certificate verifier"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /pace/applications/{id}/approve, POST /pace/disbursements/{id}/release"
    description: "Compared on X-User-ID against Application.underwriter_user_id and CompletionCertificate.verified_by_user_id respectively."
  - priority: 25
    category: business_safety
    check: "The Application's consent posture resolves to CLEARED (no ACTIVE lien left PENDING and none DECLINED)"
    error_id: "ERR_LENDER_CONSENT_PENDING | ERR_LENDER_CONSENT_DECLINED"
    http_status: 422
    applies_to: "POST /pace/applications/{id}/approve"
    description: "PENDING yields ERR_LENDER_CONSENT_PENDING (retryable after the deemed-consent deadline in a deemed-consent county); DECLINED yields ERR_LENDER_CONSENT_DECLINED and is permanent for that application."
  - priority: 26
    category: business_safety
    check: "The submitted signature name matches the recorded name exactly (case-sensitive, whitespace-trimmed)"
    error_id: ERR_SIGNATURE_NAME_MISMATCH
    http_status: 422
    applies_to: "POST /pace/financing-agreements/{id}/sign, POST /pace/completion-certificates/{id}/sign"
    description: "Compared against Property.owner_full_name."
  - priority: 27
    category: business_safety
    check: "No Disbursement of the Application has status == RELEASED when a rescission is attempted"
    error_id: ERR_FUNDS_ALREADY_RELEASED
    http_status: 409
    applies_to: "POST /pace/financing-agreements/{id}/rescind"
    description: "Belt-and-braces behind the rescission clock: once cash has left, the deal can only be unwound through contractor recourse."
  - priority: 28
    category: business_safety
    check: "A WorkmanshipComplaint of the same Application has status == ESCALATED_RECOURSE"
    error_id: ERR_NO_RECOURSE_BASIS
    http_status: 422
    applies_to: "POST /pace/disbursements/{id}/reverse"
    description: "Clawbacks require an escalated, unremedied defect; a merely upheld complaint is not enough."
  - priority: 29
    category: business_safety
    check: "Property.in_bankruptcy == false"
    error_id: ERR_PROPERTY_IN_BANKRUPTCY
    http_status: 422
    applies_to: "POST /pace/applications, POST /pace/applications/{id}/submit, POST /pace/applications/{id}/underwrite"
    description: "An active bankruptcy blocks the parcel outright and is checked before any ratio is computed."
  - priority: 30
    category: business_safety
    check: "Property.tax_delinquency_count_36m <= MAX_TAX_DELINQUENCIES_36M (1)"
    error_id: ERR_TAX_DELINQUENCY_HISTORY
    http_status: 422
    applies_to: "POST /pace/applications/{id}/submit, POST /pace/applications/{id}/underwrite"
    description: "Tax payment history screen; the count is incremented by the roll-run cascade, so a parcel can fail this on a re-underwrite it previously passed."
  - priority: 31
    category: business_temporal
    check: "The current logical date < AssessmentTransfer.good_through_date"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /pace/assessment-transfers/{id}/record"
    description: "The stale quote is first moved to EXPIRED and then the call is rejected, so the failure is visible in the transfer row afterwards."
  - priority: 32
    category: business_temporal
    check: "AssessmentTransfer.closing_date >= the current logical date"
    error_id: ERR_CLOSING_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /pace/assessment-transfers"
    description: "Interest accrues to the closing date, so a back-dated closing would understate the payoff."
  - priority: 33
    category: business_temporal
    check: "No other Assessment on the same property_id has a tax-year span overlapping [first_tax_year, final_tax_year] (closed integer interval; adjacency is allowed)"
    error_id: ERR_ASSESSMENT_YEAR_OVERLAP
    http_status: 409
    applies_to: "POST /pace/assessments"
    description: "A parcel may carry consecutive PACE assessments but never two on the roll for the same tax year."
  - priority: 34
    category: business_temporal
    check: "No other AssessmentTransfer of the same Assessment with status == QUOTED has a quote window overlapping [quoted_at, good_through_date + QUOTE_BUFFER_DAYS) (half-open datetime interval; adjacency is forbidden because of the buffer)"
    error_id: ERR_QUOTE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pace/assessment-transfers"
    description: "Two live payoff quotes on one assessment would let a buyer choose the cheaper figure; the 5-day buffer also forbids back-to-back quotes."
  - priority: 35
    category: business_temporal
    check: "For decision == REMEDY_VERIFIED the current logical date <= remedy_deadline_on; for decision == RECOURSE the current logical date > remedy_deadline_on; for decision == UPHOLD_REMEDY the supplied remedy_deadline_on is strictly after the current logical date"
    error_id: "ERR_REMEDY_DEADLINE_PASSED | ERR_REMEDY_DEADLINE_NOT_REACHED"
    http_status: 422
    applies_to: "POST /pace/complaints/{id}/adjudicate"
    description: "Escalation to recourse cannot be short-circuited and a late remediation cannot be credited."
  - priority: 36
    category: business_temporal
    check: "Contractor.license_expires_on > the current logical date"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /pace/contractors/{id}/enroll, POST /pace/contractors/{id}/reinstate"
    description: "Licence currency is re-checked at reinstatement, not just at first enrollment."
  - priority: 37
    category: business_temporal
    check: "Assessment.first_tax_year >= the tax year of the current logical date"
    error_id: ERR_TAX_YEAR_IN_PAST
    http_status: 422
    applies_to: "POST /pace/assessments"
    description: "An assessment can be placed on the current or a future roll but never a closed one."
  - priority: 38
    category: business_constraint
    check: "No other Application on the property_id has status NOT IN {DECLINED, WITHDRAWN, ASSESSED}"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /pace/applications"
    description: "One live application per parcel; a superseding filing is only allowed once the previous one is dead."
  - priority: 39
    category: business_constraint
    check: "No other ProjectMeasure of the Application references the same product_id"
    error_id: ERR_DUPLICATE_MEASURE_PRODUCT
    http_status: 409
    applies_to: "POST /pace/applications/{id}/measures"
    description: "Prevents the same product being financed twice to inflate the blended SIR."
  - priority: 40
    category: business_constraint
    check: "The Application has fewer than MAX_MEASURES_PER_APPLICATION (5) measures; the Application has fewer than COMPLAINT_CAP_PER_APPLICATION (3) complaints; Contractor.license_number is unique; Contractor.workmanship_warranty_years >= MIN_WARRANTY_YEARS (5)"
    error_id: "ERR_MEASURE_LIMIT_EXCEEDED | ERR_COMPLAINT_LIMIT_EXCEEDED | ERR_DUPLICATE_LICENSE_NUMBER | ERR_WARRANTY_TOO_SHORT"
    http_status: 422
    applies_to: "POST /pace/applications/{id}/measures, POST /pace/complaints, POST /pace/contractors, POST /pace/contractors/{id}/enroll"
    description: "Flat cardinality and catalog constraints; ERR_DUPLICATE_LICENSE_NUMBER is 409, the other three are 422."
  - priority: 41
    category: business_constraint
    check: "estimated_annual_savings_cents <= EligibleProduct.max_annual_savings_cents"
    error_id: ERR_SAVINGS_EXCEEDS_PRODUCT_CAP
    http_status: 422
    applies_to: "POST /pace/applications/{id}/measures"
    description: "Caps the savings claim per product category so the SIR cannot be gamed."
  - priority: 42
    category: business_constraint
    check: "At least one ProjectMeasure with status == PROPOSED exists"
    error_id: ERR_NO_ELIGIBLE_MEASURES
    http_status: 422
    applies_to: "POST /pace/applications/{id}/submit, POST /pace/applications/{id}/cure, POST /pace/applications/{id}/underwrite"
    description: "Empty-collection boundary: an application with zero measures can never be submitted, and an underwrite where every measure fails the per-measure SIR gate also lands here."
  - priority: 43
    category: business_constraint
    check: "term_years IN {10, 15, 18, 20, 25} and term_years <= Application.weighted_useful_life_years"
    error_id: ERR_TERM_EXCEEDS_USEFUL_LIFE
    http_status: 422
    applies_to: "POST /pace/applications/{id}/submit, POST /pace/financing-agreements"
    description: "The financing term may never outlive the cost-weighted useful life of the equipment."
  - priority: 44
    category: business_constraint
    check: "No other CompletionCertificate of the Application with status IN {CONTRACTOR_ATTESTED, HOMEOWNER_SIGNED, VERIFIED} shares any measure id"
    error_id: ERR_MEASURE_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /pace/completion-certificates"
    description: "A REJECTED certificate releases its measures so a replacement can be filed."
  - priority: 45
    category: business_constraint
    check: "The certificate is not already fully drawn: sum(amount_cents) over Disbursements with status IN {REQUESTED, HELD, RELEASED} referencing this completion_certificate_id is strictly less than CompletionCertificate.certified_cost_cents"
    error_id: ERR_CERTIFICATE_ALREADY_DISBURSED
    http_status: 409
    applies_to: "POST /pace/disbursements"
    description: "Progress draws against one certificate are legal while the certificate still has headroom, so this rule only rejects a draw on a certificate that has already been paid in full. A REVERSED disbursement does NOT restore headroom: recourse money is never re-requested. Because this rule looks only at the single certificate, it is priority 45's job to stop the fully-drawn duplicate while priority 52 stops a collection of individually-legal draws from breaching the application-level payable."
  - priority: 46
    category: business_fiscal
    check: "combined_lien_to_value_ratio <= CLTV_CAP_BPS (9700)"
    error_id: ERR_CLTV_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /pace/applications/{id}/underwrite"
    description: "Inclusive cap: exactly 9700 bps passes, 9701 bps fails. Never blocks submit, which is advisory only."
  - priority: 47
    category: business_fiscal
    check: "requested_principal_cents / Property.assessed_value_cents <= PTV_CAP_BPS (1500)"
    error_id: ERR_PTV_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /pace/applications/{id}/underwrite"
    description: "Always computed on the assessed value, even when the CLTV was computed on the market basis."
  - priority: 48
    category: business_fiscal
    check: "Property equity ratio >= EQUITY_FLOOR_BPS (1000)"
    error_id: ERR_EQUITY_FLOOR_NOT_MET
    http_status: 422
    applies_to: "POST /pace/applications/{id}/underwrite"
    description: "Equity is measured against the assessed value net of senior mortgage debt only, before any PACE exposure."
  - priority: 49
    category: business_fiscal
    check: "portfolio_sir_bps >= SIR_FLOOR_BPS (10000)"
    error_id: ERR_SIR_FLOOR_NOT_MET
    http_status: 422
    applies_to: "POST /pace/applications/{id}/underwrite"
    description: "Only the blended portfolio figure can fail the application; an individual measure below the floor is merely marked INELIGIBLE."
  - priority: 50
    category: business_fiscal
    check: "certified_cost_cents <= sum(installed_cost_cents) over the referenced measures"
    error_id: ERR_CERTIFIED_COST_EXCEEDS_MEASURES
    http_status: 422
    applies_to: "POST /pace/completion-certificates"
    description: "A contractor may certify less than the approved cost but never more."
  - priority: 51
    category: business_fiscal
    check: "Disbursement.amount_cents <= CompletionCertificate.certified_cost_cents"
    error_id: ERR_AMOUNT_EXCEEDS_CERTIFICATE
    http_status: 422
    applies_to: "POST /pace/disbursements"
    description: "Per-certificate ceiling, checked before the cumulative payable ceiling."
  - priority: 52
    category: business_fiscal
    check: "sum(amount_cents) over Disbursements with status IN {REQUESTED, HELD, RELEASED} <= FinancingAgreement.contractor_payable_cents"
    error_id: ERR_DISBURSEMENT_EXCEEDS_PAYABLE
    http_status: 422
    applies_to: "POST /pace/disbursements, POST /pace/disbursements/{id}/release"
    description: "Aggregate validation: each request is individually within its certificate yet the collection may breach the payable, and program fees are never payable to the contractor."
  - priority: 53
    category: business_fiscal
    check: "The payment amount equals total_due_cents for a BILLED installment, or total_due_cents + penalty_cents for a DELINQUENT one"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /pace/assessments/{id}/installments/{installmentId}/payments"
    description: "Partial and over-payments are both rejected; the penalty must be paid together with the installment."
  - priority: 54
    category: business_fiscal
    check: "The prepayment amount equals the payoff_total_cents computed by payoff_quote_composition as of the request date"
    error_id: ERR_PREPAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /pace/assessments/{id}/prepayments"
    description: "A prepayment must retire the whole assessment: the caller has to reproduce the six-step payoff figure exactly."
  - priority: 55
    category: business_safety
    check: "Reinstatement score gate: workmanship_score (trailing_24m) >= REINSTATE_TRAILING_BPS (9000) AND lifetime_workmanship_score >= REINSTATE_LIFETIME_BPS (8000)"
    error_id: ERR_WORKMANSHIP_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /pace/contractors/{id}/reinstate"
    description: "Sits at the tail of the ladder because reinstate has no competing business check: the only rules above it that can fire on this endpoint are auth (1-3), existence (4), enrollment state (priority 18) and licence currency (priority 36). BOTH variants of contractor_workmanship_score must clear, so an aged-out trailing window is not enough."
  - priority: 56
    category: business_safety
    check: "Reinstatement remedy gate: upheld_open_remedy_count == 0 (every UPHELD_REMEDY complaint has been verified or has lapsed to ESCALATED_RECOURSE)"
    error_id: ERR_OPEN_REMEDY_OUTSTANDING
    http_status: 422
    applies_to: "POST /pace/contractors/{id}/reinstate"
    description: "Evaluated after the score gate, so a contractor failing both gets ERR_WORKMANSHIP_GATE_NOT_MET."

# =============================================================================
# Table 5: API Endpoint Table (§1.5) — 60 endpoints.
#   Every business collection sits one level under api_prefix `/pace`; the single
#   logical-clock endpoint sits in the `/_<name>` test-driving namespace.
#   Read endpoints are open to all seven roles; every mutation is role-scoped.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Every deadline, rescission window, delinquency sweep and quote expiry is evaluated against this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "no entity is mutated; subsequent reads of derived time-dependent values (installment penalties, consent deemed-consent eligibility) use the new instant"

  # --- Property ---
  - method: POST
    path: "/pace/properties"
    description: "Register a parcel with its assessor record, owner identity, valuation and tax history"
    roles: [ProgramAdmin, CountyOfficer]
    code: 201
    input: ["apn", "county_code", "owner_full_name", "owner_birth_date", "owner_email", "occupancy_type", "assessed_value_cents", "annual_property_tax_cents", "preferred_language?", "market_value_cents?", "appraisal_effective_on?", "tax_delinquency_count_36m?", "in_bankruptcy?"]
    output: Property
    side_effects:
      - "senior_lien_balance_cents=0, equity_ratio_bps=10000, recorded_pace_principal_cents=0, committed_pace_principal_cents=0"
      - "preferred_language defaults to EN, tax_delinquency_count_36m to 0, in_bankruptcy to false"
  - method: GET
    path: "/pace/properties/{id}"
    description: "Read a parcel including its computed equity and PACE exposure rollups"
