            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 20.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 20.00 }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { o_v: $.data.version } }
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 20.00, transit_hours: 8, expected_sales_order_version: "${o_v}" }, as: InventoryPlanner, captures: { al_id: $.data.id } }
            - { call: "POST /allocations/${al_id}/commit", payload: {}, as: InventoryPlanner }
            - { call: "POST /shipments", payload: { sales_order_id: "${o_id}", mode: "TRUCK", booked_weight_kg: 20.00, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { sh_id: $.data.id } }
            - { call: "POST /shipments/${sh_id}/book", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /shipments/${sh_id}/tender", payload: { actual_weight_kg: 20.00, volume_m3: 0.10 }, as: LogisticsCoordinator }
            - { call: "POST /shipments/${sh_id}/depart", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /shipments/${sh_id}/deliver", payload: {}, as: LogisticsCoordinator }
          assert:
            - "Shipment.${sh_id}.status == DELIVERED"
            - "InventoryLot.${lot_id}: committed_weight_kg == 0, shipped_weight_kg == 20.00, available+reserved+committed == 0 so lifecycle_status == DEPLETED"
            - "SalesOrder.${o_id}.status == FULFILLED (deliver does not regress it)"

      - name: ep_response_envelope_shape
        claim_type: computed_read
        grounds:
          - response_envelope
        distinguishing_aspect: "Every success response carries meta.api_request_id + meta.api_request_timestamp, response_type object for single GET and array for list GET; error responses carry data.error_id + data.message."
        test_recipe:
          setup: ["One species exists"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id } }
          trigger:
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager }
            - { call: "GET /market-quotes", payload: { species_id: "${sp_id}" }, as: OperationsManager }
          assert:
            - "Single GET: response_type == object; meta.api_request_id present; meta.api_request_timestamp present"
            - "List GET: response_type == array; data carries limit, offset, total_count, has_more"
            - "Error responses (any 4xx above) carry data.error_id and data.message"

      - name: ep_freeze_resets_shelf_clock_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - 'endpoints."POST /inventory-lots/{id}/freeze"'
        excluded_because:
          difficulty_instance: inventory_lot_parallel_hold_and_lifecycle
          rationale: "Freeze conversion and the expires_at reset to frozen_at + 30 days are asserted there with exact timestamps."

  - section: errors
    instances:
      - name: err_quote_not_published_on_confirm
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUOTE_NOT_PUBLISHED]
          - calculations.latest_published_quote
        distinguishing_aspect: "Selector fallback: the only quote for the line's species+grade is DRAFT, so confirm fails with ERR_QUOTE_NOT_PUBLISHED and the order stays SUBMITTED."
        test_recipe:
          setup: ["Species COD with a DRAFT (never published) GRADE_A quote; order SUBMITTED with one line"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
