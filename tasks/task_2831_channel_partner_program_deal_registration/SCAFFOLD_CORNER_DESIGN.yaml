      - name: conflict_recommendation_variant_selected_by_conflict_type
        claim_type: variant_selection
        grounds:
          - calculations.conflict_recommendation
          - calculations.conflict_recommendation.variants
          - state_machines.Account.CHANNEL_PROTECTED_to_CHANNEL_PROTECTED
        distinguishing_aspect: "A PARTNER_VS_DIRECT case stores both recommendation variants but sets applied_variant to COVERAGE_FIRST, so recommended_resolution is copied from the coverage-order variant even though the chronological variant was also computed."
        test_recipe:
          setup:
            - "Clock 2026-04-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; one account."
            - "The partner's ANALYTICS_ADDON registration is APPROVED at 2026-04-01, protecting the account until 2026-05-01T00:00:00.000Z (PROTECTION_DAYS_BY_TIER[REGISTERED] = 30)."
            - "The clock then advances to 2026-04-05T00:00:00.000Z before the direct pursuit, so the two claim instants differ and no tiebreak is needed."
            - "REGISTRATION_FIRST ranks submitted_at 2026-04-01 before direct_pursuit_declared_at 2026-04-05 -> GRANT_SUBJECT; COVERAGE_FIRST sees CHANNEL_PROTECTED with protected_partner_id == the subject's partner and clock < protected_until -> GRANT_SUBJECT."
