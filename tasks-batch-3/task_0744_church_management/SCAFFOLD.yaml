# =============================================================================
# Task 0744 — Faith Congregation & Church Management (Planning Center style)
# Difficulty: Expert
# =============================================================================

scenario: |
  744. Faith Congregation & Church Management (Planning Center style): member/household &
  directory, giving/tithe & pledge campaign, recurring donation & year-end statement,
  event/service & volunteer scheduling, small-group/ministry roster, child check-in &
  security, facility booking, communication/attendance

domain_name: faith-congregation
api_prefix: ""    # Endpoints are top-level collections; no shared prefix.

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential   # Household -> primary contact Member; Member -> household loop
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Household display name (e.g., 'The Nguyen Family')" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: postal_code, type: string, source: input, description: "Postal / ZIP code" }
      - { name: primary_contact_member_id, type: string, source: input, description: "FK -> Member.id; must belong to this Household. Nullable at Household creation (bootstrap) and set once first ADULT member is registered." }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED. Starts ACTIVE.", constraints: "ACTIVE | ARCHIVED" }
      - { name: archived_at, type: datetime, source: system, description: "Set when transitioning to ARCHIVED; null while ACTIVE" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id" }
      - { name: full_name, type: string, source: input, description: "Given + family name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: member_type, type: enum, source: input, description: "ADULT | CHILD. CHILD requires guardian_member_ids non-empty at creation.", constraints: "ADULT | CHILD" }
      - { name: guardian_member_ids, type: array, source: input, description: "For CHILD only: array of Member.id (each must be ADULT in same Household). Empty for ADULT.", default: "[]" }
      - { name: email, type: string, source: input, description: "Email; required for ADULT, optional for CHILD" }
      - { name: phone, type: string, source: input, description: "E.164 phone; optional" }
      - { name: membership_status, type: enum, source: system, description: "VISITOR | REGULAR | MEMBER | DEPARTED. Starts VISITOR.", constraints: "VISITOR | REGULAR | MEMBER | DEPARTED" }
      - { name: allow_directory_publish, type: boolean, source: input, description: "Whether to include in printed directory", default: "true" }

  - name: PledgeCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name (e.g., '2027 Building Fund')" }
      - { name: target_amount_cents, type: integer, source: input, description: "Fundraising target, integer cents; > 0" }
      - { name: starts_on, type: string, source: input, description: "ISO date YYYY-MM-DD (inclusive)" }
      - { name: ends_on, type: string, source: input, description: "ISO date YYYY-MM-DD (inclusive); MUST be >= starts_on" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED. Starts DRAFT.", constraints: "DRAFT | ACTIVE | CLOSED" }
      - { name: pledged_total_cents, type: integer, source: computed, description: "Sum of Pledge.pledged_amount_cents for pledges whose status IN {ACTIVE, FULFILLED} on this campaign", default: "0" }
      - { name: received_total_cents, type: integer, source: computed, description: "Sum of Donation.amount_cents for donations whose status == POSTED and campaign_id == this.id", default: "0" }
      - { name: fulfilled_pledge_count, type: integer, source: computed, description: "Count of Pledge with campaign_id==this.id AND status == FULFILLED", default: "0" }

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> PledgeCampaign.id; campaign MUST be in status ACTIVE at pledge creation" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member.membership_status MUST != DEPARTED at pledge creation" }
      - { name: pledged_amount_cents, type: integer, source: input, description: "Total commitment in cents; > 0" }
      - { name: frequency, type: enum, source: input, description: "ONE_TIME | WEEKLY | MONTHLY", constraints: "ONE_TIME | WEEKLY | MONTHLY" }
      - { name: first_expected_on, type: string, source: input, description: "ISO date of first expected installment; MUST fall in [campaign.starts_on, campaign.ends_on]" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FULFILLED | CANCELLED. Starts ACTIVE.", constraints: "ACTIVE | FULFILLED | CANCELLED" }
      - { name: received_amount_cents, type: integer, source: computed, description: "Sum of Donation.amount_cents for donations whose status == POSTED and pledge_id == this.id", default: "0" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "= max(0, pledged_amount_cents - received_amount_cents)", default: "0" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the donor" }
      - { name: campaign_id, type: string, source: input, description: "FK -> PledgeCampaign.id; nullable when donation is a general/undesignated gift" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; nullable. When set, pledge.member_id MUST match member_id and pledge.campaign_id MUST match campaign_id." }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount, integer cents; > 0" }
      - { name: donation_date, type: string, source: input, description: "ISO date YYYY-MM-DD when the gift was received" }
      - { name: payment_method, type: enum, source: input, description: "CASH | CHECK | CARD | ACH", constraints: "CASH | CHECK | CARD | ACH" }
      - { name: is_tax_deductible, type: boolean, source: input, description: "Whether this contribution counts toward the year-end deductible statement", default: "true" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | REFUNDED | FAILED. Starts PENDING for CARD/ACH; auto-POSTED for CASH/CHECK on creation.", constraints: "PENDING | POSTED | REFUNDED | FAILED" }
      - { name: posted_at, type: datetime, source: system, description: "Timestamp of transition to POSTED; null while PENDING" }
      - { name: refunded_at, type: datetime, source: system, description: "Timestamp of transition to REFUNDED; null unless refunded" }

  - name: YearEndStatement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; statement recipient" }
      - { name: tax_year, type: integer, source: input, description: "Four-digit year (e.g., 2026)" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL. PROVISIONAL includes PENDING+POSTED; FINAL includes POSTED only.", constraints: "PROVISIONAL | FINAL" }
      - { name: total_deductible_cents, type: integer, source: computed, description: "Computed sum per member_ytd_deductible calculation using the chosen variant" }
      - { name: donation_count, type: integer, source: computed, description: "Number of Donation rows included in total_deductible_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOIDED. Starts DRAFT (on generate); VOIDED can regenerate back to DRAFT.", constraints: "DRAFT | ISSUED | VOIDED" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of transition to ISSUED; null while DRAFT" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name (e.g., 'Sunday 10am Service')" }
      - { name: event_type, type: enum, source: input, description: "SERVICE | CLASS | MEETING | OUTREACH", constraints: "SERVICE | CLASS | MEETING | OUTREACH" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; nullable for offsite events" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC end; MUST be > starts_at" }
      - { name: expected_attendance, type: integer, source: input, description: "Anticipated headcount; >= 0" }
      - { name: volunteer_slots, type: integer, source: input, description: "Number of volunteer roles this event needs; >= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED | COMPLETED. Starts SCHEDULED.", constraints: "SCHEDULED | CANCELLED | COMPLETED" }
      - { name: volunteer_filled_count, type: integer, source: computed, description: "Count of VolunteerAssignment with event_id==this.id AND status IN {ACCEPTED, CHECKED_IN, COMPLETED}", default: "0" }
      - { name: attendance_count, type: integer, source: computed, description: "Count of ChildCheckIn with event_id==this.id AND status IN {CHECKED_IN, CHECKED_OUT}", default: "0" }
      - { name: coverage_score, type: number, source: computed, description: "Weighted coverage score per volunteer_coverage_score calc, recomputed on read against the current server clock", default: "0" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name (e.g., 'Sanctuary', 'Fellowship Hall')" }
      - { name: capacity, type: integer, source: input, description: "Maximum simultaneous occupancy; > 0" }
      - { name: buffer_minutes, type: integer, source: input, description: "Minimum gap between consecutive bookings, in minutes; >= 0", default: "0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE. Starts AVAILABLE and never leaves; retained as a field so future maintenance modes can be added.", constraints: "AVAILABLE" }
      - { name: upcoming_booked_hours, type: number, source: computed, description: "Sum of (ends_at - starts_at)/3600 for FacilityBooking with facility_id==this.id AND status == CONFIRMED AND ends_at > current_time", default: "0" }

  - name: FacilityBooking
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; nullable for external bookings (rentals, private use)" }
      - { name: booking_type, type: enum, source: input, description: "EVENT | EXTERNAL. Must be EVENT iff event_id is non-null.", constraints: "EVENT | EXTERNAL" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC start; must fall within a Facility open interval" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC end; > starts_at" }
      - { name: headcount, type: integer, source: input, description: "Expected occupancy for this booking; > 0 and <= facility.capacity" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED. Starts CONFIRMED.", constraints: "CONFIRMED | CANCELLED" }
      - { name: expected_facility_version, type: integer, source: input, description: "Client-observed Facility.version for OCC (see §1.2.1). Required on booking-create." }

  - name: VolunteerAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: role_type, type: enum, source: input, description: "USHER | GREETER | CHILDCARE | AUDIO_VISUAL | TEACHER", constraints: "USHER | GREETER | CHILDCARE | AUDIO_VISUAL | TEACHER" }
      - { name: status, type: enum, source: system, description: "INVITED | ACCEPTED | DECLINED | CHECKED_IN | COMPLETED | CANCELLED. Starts INVITED.", constraints: "INVITED | ACCEPTED | DECLINED | CHECKED_IN | COMPLETED | CANCELLED" }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp of transition INVITED->ACCEPTED; null otherwise" }

  - name: SmallGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Group name" }
      - { name: leader_member_id, type: string, source: input, description: "FK -> Member.id; leader MUST have membership_status IN {REGULAR, MEMBER}" }
      - { name: ministry_area, type: enum, source: input, description: "WORSHIP | STUDY | OUTREACH | CARE | YOUTH", constraints: "WORSHIP | STUDY | OUTREACH | CARE | YOUTH" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent ACTIVE roster size; > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE. Starts ACTIVE and does not transition in v1.", constraints: "ACTIVE" }
      - { name: roster_count, type: integer, source: computed, description: "Count of GroupMembership with group_id==this.id AND status == ACTIVE", default: "0" }

  - name: GroupMembership
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> SmallGroup.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: role, type: enum, source: input, description: "LEADER | CO_LEADER | MEMBER", constraints: "LEADER | CO_LEADER | MEMBER", default: "MEMBER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST. Starts ACTIVE.", constraints: "ACTIVE | PAST" }
      - { name: joined_on, type: string, source: system, description: "ISO date derived from server clock at creation" }

  - name: ChildCheckIn
    parent: null
    common_fields: true
    fields:
      - { name: child_member_id, type: string, source: input, description: "FK -> Member.id; MUST have member_type == CHILD" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event.status MUST == SCHEDULED at check-in" }
      - { name: guardian_member_id, type: string, source: input, description: "FK -> Member.id; MUST be in child.guardian_member_ids AND same Household as child" }
      - { name: pickup_pin, type: string, source: system, description: "4-digit server-minted pickup code; MUST equal the value the pickup requester supplies at checkout" }
      - { name: status, type: enum, source: system, description: "CHECKED_IN | SECURITY_HOLD | CHECKED_OUT. Starts CHECKED_IN.", constraints: "CHECKED_IN | SECURITY_HOLD | CHECKED_OUT" }
      - { name: checked_in_at, type: datetime, source: system, description: "Server-stamped timestamp of CHECKED_IN transition" }
      - { name: checked_out_at, type: datetime, source: system, description: "Server-stamped timestamp of CHECKED_OUT transition; null otherwise" }
      - { name: hold_reason, type: enum, source: system, description: "PIN_MISMATCH | UNAUTHORIZED_PICKUP | STAFF_HOLD; null unless status == SECURITY_HOLD", constraints: "PIN_MISMATCH | UNAUTHORIZED_PICKUP | STAFF_HOLD" }

# =============================================================================
# 1.2 State Machine Table (5 machines; 4 non-linear on different entities)
# =============================================================================
state_machines:
  - entity: Donation
    initial_state: PENDING       # for CARD/ACH; CASH/CHECK go straight to POSTED on create
    terminal_states: [REFUNDED, FAILED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /donations/{id}/post (via /_payments/simulate SUCCEEDED for CARD/ACH; automatic on-create for CASH/CHECK)"
        actor: FinanceAdmin
        preconditions:
          - "donation.status == PENDING"
        side_effects:
          - "posted_at = current UTC"
          - "If pledge_id != null: Pledge.received_amount_cents += donation.amount_cents"
          - "If pledge_id != null AND Pledge.received_amount_cents now >= Pledge.pledged_amount_cents: auto-transition Pledge ACTIVE -> FULFILLED (see Pledge machine)"
          - "If campaign_id != null: PledgeCampaign.received_total_cents += donation.amount_cents"

      - from: PENDING
        to: FAILED
        trigger: "POST /donations/{id}/mark-failed (via /_payments/simulate FAILED)"
        actor: FinanceAdmin
        preconditions:
          - "donation.status == PENDING"
        side_effects: []

      - from: POSTED
        to: REFUNDED
        trigger: "POST /donations/{id}/refund"
        actor: FinanceAdmin
        preconditions:
          - "donation.status == POSTED"
          - "current_date <= donation.donation_date + 60 days (business_temporal cutoff)"
        side_effects:
          - "refunded_at = current UTC"
          - "If pledge_id != null: Pledge.received_amount_cents -= donation.amount_cents (Cascade Link 1)"
          - "If pledge_id != null AND Pledge was FULFILLED AND Pledge.received_amount_cents now < Pledge.pledged_amount_cents: auto-transition Pledge FULFILLED -> ACTIVE (Cascade Link 2; triggered by the received_amount_cents change from Link 1, not directly by the refund action)"
          - "If Pledge.status transition FULFILLED -> ACTIVE fires: PledgeCampaign.fulfilled_pledge_count -= 1 (Cascade Link 3; triggered by the Pledge state change from Link 2)"
          - "If campaign_id != null: PledgeCampaign.received_total_cents -= donation.amount_cents"

  - entity: Pledge
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (automatic when Donation POSTED pushes received_amount_cents >= pledged_amount_cents)"
        actor: system
        preconditions:
          - "pledge.status == ACTIVE"
          - "pledge.received_amount_cents >= pledge.pledged_amount_cents"
        side_effects:
          - "PledgeCampaign.fulfilled_pledge_count += 1"

      - from: FULFILLED
        to: ACTIVE
        trigger: "system (automatic when Donation REFUND pulls received_amount_cents back below pledged_amount_cents)"
        actor: system
        preconditions:
          - "pledge.status == FULFILLED"
          - "pledge.received_amount_cents < pledge.pledged_amount_cents"
        side_effects:
          - "PledgeCampaign.fulfilled_pledge_count -= 1"
        note: "This is the cyclic revert leg (Rule 3 non-linearity)."

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /pledges/{id}/cancel"
        actor: FinanceAdmin
        preconditions:
          - "pledge.status == ACTIVE"
          - "PledgeCampaign.status == ACTIVE (cannot cancel a pledge on a closed campaign)"
        side_effects:
          - "PledgeCampaign.pledged_total_cents -= pledge.pledged_amount_cents"

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "event.status == SCHEDULED"
        side_effects:
          - "For every FacilityBooking with event_id == this.id AND status == CONFIRMED: auto-transition CONFIRMED -> CANCELLED (Cascade Link 1)"
          - "Each FacilityBooking CANCELLED transition triggers Facility.upcoming_booked_hours recompute for its facility_id (Cascade Link 2, caused by Link 1's FacilityBooking state change)"
          - "For every VolunteerAssignment with event_id == this.id AND status IN {INVITED, ACCEPTED}: auto-transition to CANCELLED (parallel side effect, not part of the depth-2 cascade)"
          - "For every ChildCheckIn with event_id == this.id AND status == CHECKED_IN: auto-transition to SECURITY_HOLD with hold_reason=STAFF_HOLD (guardian pickup blocked until re-cleared)"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: Coordinator
        preconditions:
          - "event.status == SCHEDULED"
          - "current_time >= event.ends_at"
          - "No ChildCheckIn with event_id == this.id AND status IN {CHECKED_IN, SECURITY_HOLD} (all children must be checked out first)"
        side_effects:
          - "For every VolunteerAssignment with event_id == this.id AND status == CHECKED_IN: auto-transition to COMPLETED"
        note: "Rule 3: branching from SCHEDULED — two divergent side-effect sets per branch."

  - entity: YearEndStatement
    initial_state: DRAFT
    terminal_states: []      # ISSUED and VOIDED are recoverable — VOIDED -> DRAFT allowed
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /year-end-statements/{id}/issue"
        actor: FinanceAdmin
        preconditions:
          - "statement.status == DRAFT"
          - "statement.variant == FINAL (PROVISIONAL statements cannot be ISSUED)"
        side_effects:
          - "issued_at = current UTC"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /year-end-statements/{id}/void"
        actor: FinanceAdmin
        preconditions:
          - "statement.status == ISSUED"
        side_effects: []

      - from: VOIDED
        to: DRAFT
        trigger: "POST /year-end-statements/{id}/regenerate"
        actor: FinanceAdmin
        preconditions:
          - "statement.status == VOIDED"
        side_effects:
          - "total_deductible_cents recomputed against current donation ledger for member_id + tax_year"
          - "donation_count recomputed"
          - "issued_at = null"
        note: "Rule 3: cyclic (VOIDED -> DRAFT reopens the statement for re-issue)."

  - entity: ChildCheckIn
    initial_state: CHECKED_IN
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /child-checkins/{id}/checkout"
        actor: Coordinator
        preconditions:
          - "checkin.status == CHECKED_IN"
          - "request.pickup_pin == checkin.pickup_pin (else transition to SECURITY_HOLD instead)"
          - "request.pickup_by_member_id IN checkin.child.guardian_member_ids (else transition to SECURITY_HOLD)"
        side_effects:
          - "checked_out_at = current UTC"

      - from: CHECKED_IN
        to: SECURITY_HOLD
        trigger: "POST /child-checkins/{id}/checkout (auto-triggered when precondition fails) OR POST /child-checkins/{id}/security-hold (staff-initiated)"
        actor: Coordinator | system
        preconditions:
          - "checkin.status == CHECKED_IN"
        side_effects:
          - "hold_reason set from failure cause (PIN_MISMATCH | UNAUTHORIZED_PICKUP | STAFF_HOLD)"

      - from: SECURITY_HOLD
        to: CHECKED_IN
        trigger: "POST /child-checkins/{id}/clear-hold"
        actor: Coordinator
        preconditions:
          - "checkin.status == SECURITY_HOLD"
        side_effects:
          - "hold_reason cleared to null"
        note: "Rule 3: cyclic (SECURITY_HOLD -> CHECKED_IN); differs from YearEndStatement cycle (different entity)."

  - entity: FacilityBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /facility-bookings/{id}/cancel OR system (cascade from Event.cancel)"
        actor: Coordinator | system
        preconditions:
          - "booking.status == CONFIRMED"
        side_effects:
          - "Facility.upcoming_booked_hours recomputed (booking excluded)"

  - entity: VolunteerAssignment
    initial_state: INVITED
    terminal_states: [DECLINED, COMPLETED, CANCELLED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /volunteer-assignments/{id}/accept"
        actor: Member
        preconditions:
          - "assignment.status == INVITED"
          - "Event.status == SCHEDULED"
          - "Member.membership_status != DEPARTED"
          - "No overlap conflict with the member's other ACCEPTED/CHECKED_IN assignments (see Rule 8 overlap check)"
        side_effects:
          - "accepted_at = current UTC"
          - "Event.volunteer_filled_count += 1"

      - from: INVITED
        to: DECLINED
        trigger: "POST /volunteer-assignments/{id}/decline"
        actor: Member
        preconditions:
          - "assignment.status == INVITED"
        side_effects: []

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /volunteer-assignments/{id}/cancel"
        actor: Coordinator | Member
        preconditions:
          - "assignment.status == ACCEPTED"
        side_effects:
          - "Event.volunteer_filled_count -= 1"

      - from: ACCEPTED
        to: CHECKED_IN
        trigger: "POST /volunteer-assignments/{id}/checkin"
        actor: Coordinator
        preconditions:
          - "assignment.status == ACCEPTED"
          - "current_time >= (event.starts_at - 60 minutes) AND current_time <= event.ends_at"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: facility-booking-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /facility-bookings"
    occ_field: "expected_facility_version"
    description: |
      Creating a FacilityBooking against a Facility whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a booking on the same facility
      (which legitimately supersedes the prior schedule snapshot the current
      writer used to compute non-overlap), so the current writer's view of
      the facility is therefore stale and must re-check availability before
      resubmitting.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pledge_campaign_progress
    trigger: "GET /pledge-campaigns/{id} (returns both variants); also recomputed on-write when Donation.status changes to/from POSTED or Pledge.status changes"
    algorithm: forward_looking       # base is forward_looking; a variant recomputes chronologically
    formula: |
      # Base (projected):
      # projected_total_cents = sum of Pledge.pledged_amount_cents for pledges
      #   whose status IN {ACTIVE, FULFILLED} and campaign_id == campaign.id.
      # projected_shortfall_cents = max(0, campaign.target_amount_cents - projected_total_cents)
      # projected_fulfillment_pct = round( 100 * projected_total_cents / campaign.target_amount_cents, 2 )
    input_set: "Pledges WHERE campaign_id == campaign.id AND status IN {ACTIVE, FULFILLED}; CANCELLED pledges are excluded."
    constants: {}
    precision: "2 decimal places, round_half_up (percentage); amounts are integer cents"
    variants:
      - name: projected
        when: "Default when GET /pledge-campaigns/{id} is called without ?variant= or with ?variant=PROJECTED"
        difference: "Uses Pledge.pledged_amount_cents (commitments) as input. Assumes every ACTIVE pledge will be fulfilled."
      - name: chronological
        when: "GET /pledge-campaigns/{id}?variant=CHRONOLOGICAL"
        difference: "Uses received_total_cents = sum of Donation.amount_cents WHERE campaign_id == campaign.id AND status == POSTED AND posted_at <= current_time; iterates donations in ASCENDING donation_date, tie-break created_at ASC. Never uses id. Produces a running-total series culminating in current received_total_cents. projected and chronological on the same campaign disagree by definition (commitments vs cash received)."

  - name: member_ytd_deductible
    trigger: "POST /year-end-statements (statement create); also on YearEndStatement.regenerate"
    algorithm: aggregation
    formula: |
      # For member M and tax_year Y:
      #   candidates = { Donation d : d.member_id == M.id
      #                           AND d.is_tax_deductible == true
      #                           AND year_of(d.donation_date) == Y }
      #   included = candidates filtered by variant (see below)
      #   total_deductible_cents = sum(d.amount_cents for d in included)
      #   donation_count = len(included)
    input_set: "See variant."
    constants: {}
    precision: "Integer cents; no rounding step (sum is exact)."
    variants:
      - name: PROVISIONAL
        when: "Statement created with variant == PROVISIONAL (interim receipt during the year)"
        difference: "Included = { d in candidates : d.status IN {PENDING, POSTED} }. Optimistic — assumes PENDING donations will POST."
      - name: FINAL
        when: "Statement created with variant == FINAL (year-end; only issuable after Dec 31)"
        difference: "Included = { d in candidates : d.status == POSTED AND d.posted_at <= (Y+1)-01-15T00:00:00Z }. Pessimistic — REFUNDED / PENDING / FAILED donations excluded; late POSTs after the Jan-15 cutoff excluded even if backdated. FINAL and PROVISIONAL for the same (M, Y) produce different totals when M has any PENDING/REFUNDED/late-POSTED donations."

  - name: volunteer_coverage_score
    trigger: "GET /events/{id} (returned as event.coverage_score, computed on-read)"
    algorithm: weighted_scoring       # combinatorial mode (a): ≥3 inputs, non-linear interaction
    formula: |
      # Let filled = event.volunteer_filled_count
      # Let slots  = event.volunteer_slots
      # Let hours_to_event = max(0, (event.starts_at - current_time) / 3600.0)
      # Let priority_weight = case event.event_type
      #     SERVICE  -> 1.00
      #     CLASS    -> 0.80
      #     MEETING  -> 0.60
      #     OUTREACH -> 0.90
      # Let fill_ratio = min(1.0, filled / slots) if slots > 0 else 1.0
      # Let urgency = max(0.0, 1.0 - (hours_to_event / 72.0))    # 0 when >=72h away, 1 at start
      # coverage_score = round(
      #     100.0 * priority_weight * ( 0.60 * fill_ratio + 0.40 * (1 - urgency) ),
      #     2
      # )
      # Non-linearity: min-clamp on fill_ratio, max-clamp+linear-decay on urgency, priority multiplier over both.
    input_set: "The event itself plus its VolunteerAssignments (for filled count) and current server clock."
    constants:
      URGENCY_HORIZON_HOURS: 72
      FILL_WEIGHT: 0.60
      URGENCY_WEIGHT: 0.40
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: donation_split_across_pledges
    trigger: "POST /donations when the request body contains split_across=true and no explicit pledge_id (auto-split mode; splits the donation across all of the member's ACTIVE pledges on that campaign)"
    algorithm: waterfall_allocation   # combinatorial mode (b): nested rounding — order matters
    formula: |
      # Given donation of amount_cents A, member M, campaign C, split_across=true.
      # candidate_pledges = [ p : p.member_id == M AND p.campaign_id == C AND p.status == ACTIVE ]
      # Sort candidate_pledges by (remaining_amount_cents DESC, created_at ASC).  # created_at, never id
      # weight_denom = sum(p.remaining_amount_cents for p in candidate_pledges)
      # If weight_denom == 0: reject with ERR_NO_ACTIVE_PLEDGE.
      #
      # PINNED ROUNDING ORDER (round-per-item, then adjust remainder):
      #   for each p in candidate_pledges except the LAST:
      #       share_p = floor(A * p.remaining_amount_cents / weight_denom)      # integer cents
      #   share_last = A - sum(share_p for p != LAST)                            # absorb rounding drift
      # NOTE: computing shares in the reverse order — "sum-then-round" — produces
      # a different last-share value when A * remaining_amount_cents / weight_denom
      # is non-integer for at least one non-last pledge. The scaffold PINS the
      # per-item floor + last-absorbs-remainder order.
      #
      # Create one child Donation row per pledge with amount_cents = share_p, status = same as parent.
      # Return { donation_id: <parent>, splits: [ { pledge_id, amount_cents }, ... ] }.
    input_set: "The donation plus all ACTIVE pledges of M on C."
    constants: {}
    precision: "Integer cents; floor per item; remainder absorbed by the last (tie-broken by created_at ASC) pledge."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except /_clock/set_current_utc and /_payments/simulate (which still require PlatformAdmin)"

  - priority: 2
    category: auth
    check: "Acting role is authorized for this endpoint (see §1.7 RBAC matrix)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body ids reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource-scoped endpoints"

  - priority: 4
    category: business_referential
    check: "Foreign-key referential integrity across bodies (e.g., Donation.pledge_id.campaign_id must match Donation.campaign_id; ChildCheckIn.guardian_member_id must belong to child's Household and be in child.guardian_member_ids)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /donations, POST /child-checkins, POST /group-memberships, POST /volunteer-assignments"

  - priority: 5
    category: state
    check: "Target resource is in a state that admits the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST/PATCH action endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state dependency: sibling entity's state permits this operation (Event.status == SCHEDULED for volunteer accept and child check-in; Household.status == ACTIVE for member check-in; PledgeCampaign.status == ACTIVE for creating a pledge)"
    error_id: ERR_DEPENDENCY_STATE
    http_status: 409
    applies_to: "POST /facility-bookings, POST /volunteer-assignments/{id}/accept, POST /child-checkins"

  - priority: 7
    category: business_safety
    check: "Child check-in security invariants: pickup_pin match at checkout, guardian in child.guardian_member_ids at checkout, all children checked out before event completion"
    error_id: ERR_SECURITY_HOLD_TRIGGERED
    http_status: 409
    applies_to: "POST /child-checkins/{id}/checkout, POST /events/{id}/complete"

  - priority: 8
    category: business_temporal
    check: "Temporal overlap: FacilityBooking overlaps another CONFIRMED booking on the same facility (buffered half-open intervals); VolunteerAssignment ACCEPT overlaps another accepted assignment for the same member (unbuffered half-open intervals)"
    error_id: "ERR_FACILITY_OVERLAP or ERR_VOLUNTEER_OVERLAP"
    http_status: 409
    applies_to: "POST /facility-bookings, POST /volunteer-assignments/{id}/accept"

  - priority: 9
    category: business_constraint
    check: "Capacity/quota: FacilityBooking.headcount <= Facility.capacity; SmallGroup roster_count < capacity when creating GroupMembership; Event.expected_attendance <= Facility.capacity when facility_id is set"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /facility-bookings, POST /events, POST /group-memberships"

  - priority: 10
    category: business_temporal
    check: "Donation refund window: current_date <= donation.donation_date + 60 days"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /donations/{id}/refund"

  - priority: 11
    category: business_fiscal
    check: "Pledge fulfillment invariants: pledge.first_expected_on falls within [campaign.starts_on, campaign.ends_on]; pledged_amount_cents > 0; donation amount_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /pledges, POST /donations"

  - priority: 12
    category: business_fiscal
    check: "YearEndStatement FINAL variant may only be created on/after (tax_year + 1)-01-16T00:00:00Z; PROVISIONAL may be created any time during or after tax_year"
    error_id: ERR_STATEMENT_TIMING
    http_status: 409
    applies_to: "POST /year-end-statements"

  - priority: 13
    category: business_referential
    check: "SmallGroup roster and volunteer eligibility: leader_member_id.membership_status IN {REGULAR, MEMBER}; VolunteerAssignment.role_type == CHILDCARE requires member.member_type == ADULT AND membership_status IN {REGULAR, MEMBER}"
    error_id: ERR_MEMBERSHIP_INELIGIBLE
    http_status: 422
    applies_to: "POST /small-groups, POST /volunteer-assignments"

  - priority: 14
    category: business_constraint
    check: "Required input fields present and typed correctly; enum values in declared set; integer >= 0 where declared; datetimes ISO8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

# =============================================================================
# 1.5 API Endpoint Table (~30 endpoints)
# =============================================================================
endpoints:
  # --- Household ---
  - method: POST
    path: "/households"
    description: "Create a Household. primary_contact_member_id may be omitted at bootstrap and set later."
    roles: [Registrar, PlatformAdmin]
    code: 201
    input: [name, address_line1, postal_code, "primary_contact_member_id?"]
    output: Household
    side_effects: ["status=ACTIVE, archived_at=null"]

  - method: GET
    path: "/households/{id}"
    description: "Get a specific Household by id."
    roles: [Registrar, Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: PATCH
    path: "/households/{id}"
    description: "Update a Household's directory fields or set primary_contact_member_id."
    roles: [Registrar, PlatformAdmin]
    code: 200
    input: ["name?", "address_line1?", "postal_code?", "primary_contact_member_id?", "status?"]
    output: Household
    side_effects:
      - "If status transitions to ARCHIVED: archived_at = current UTC"

  - method: GET
    path: "/households"
    description: "List households with filters (covers Household.primary_contact_member_id reverse-reachability)."
    roles: [Registrar, Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["primary_contact_member_id?", "status?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  - method: GET
    path: "/households/{id}/members"
    description: "List members belonging to this Household (reverse-reachability for Member.household_id)."
    roles: [Registrar, Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Member[]
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/members"
    description: "Create a Member. CHILD requires guardian_member_ids non-empty and all guardian ids ADULT + same household."
    roles: [Registrar, PlatformAdmin]
    code: 201
    input: [household_id, full_name, date_of_birth, member_type, "guardian_member_ids?", "email?", "phone?", "allow_directory_publish?"]
    output: Member
    side_effects: ["membership_status=VISITOR"]

  - method: GET
    path: "/members/{id}"
    description: "Get a specific Member by id."
    roles: [Registrar, Coordinator, FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: PATCH
    path: "/members/{id}"
    description: "Update Member fields (contact info, membership_status upgrade)."
    roles: [Registrar, PlatformAdmin]
    code: 200
    input: ["full_name?", "email?", "phone?", "membership_status?", "allow_directory_publish?"]
    output: Member
    side_effects: []

  # --- PledgeCampaign ---
  - method: POST
    path: "/pledge-campaigns"
    description: "Create a PledgeCampaign in DRAFT."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 201
    input: [name, target_amount_cents, starts_on, ends_on]
    output: PledgeCampaign
    side_effects: ["status=DRAFT, pledged_total_cents=0, received_total_cents=0, fulfilled_pledge_count=0"]

  - method: POST
    path: "/pledge-campaigns/{id}/activate"
    description: "Transition PledgeCampaign DRAFT -> ACTIVE."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PledgeCampaign
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/pledge-campaigns/{id}/close"
    description: "Transition PledgeCampaign ACTIVE -> CLOSED. No pledges can be created after close."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PledgeCampaign
    side_effects: ["status=CLOSED"]

  - method: GET
    path: "/pledge-campaigns/{id}"
    description: "Get a PledgeCampaign. Response includes both progress variants (projected and chronological) alongside the campaign fields."
    roles: [FinanceAdmin, Coordinator, PlatformAdmin]
    code: 200
    input: ["variant?"]
    output: PledgeCampaign
    side_effects: []

  # --- Pledge ---
  - method: POST
    path: "/pledges"
    description: "Create a Pledge against an ACTIVE campaign."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 201
    input: [campaign_id, member_id, pledged_amount_cents, frequency, first_expected_on]
    output: Pledge
    side_effects:
      - "status=ACTIVE, received_amount_cents=0, remaining_amount_cents=pledged_amount_cents"
      - "PledgeCampaign.pledged_total_cents += pledged_amount_cents"

  - method: GET
    path: "/pledges/{id}"
    description: "Get a specific Pledge by id."
    roles: [FinanceAdmin, Coordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects: []

  - method: POST
    path: "/pledges/{id}/cancel"
    description: "Cancel an ACTIVE pledge."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects:
      - "status=CANCELLED"
      - "PledgeCampaign.pledged_total_cents -= pledged_amount_cents"

  - method: GET
    path: "/pledges"
    description: "List pledges with optional filters (covers Pledge.campaign_id and Pledge.member_id reverse-reachability)."
    roles: [FinanceAdmin, Coordinator, Member, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []

  # --- Donation ---
  - method: POST
    path: "/donations"
    description: "Create a Donation. CASH/CHECK auto-post; CARD/ACH start PENDING pending /_payments/simulate. Setting split_across=true auto-splits across the member's ACTIVE pledges on the campaign (see donation_split_across_pledges calc)."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 201
    input: [member_id, amount_cents, donation_date, payment_method, "campaign_id?", "pledge_id?", "is_tax_deductible?", "split_across?"]
    output: Donation
    side_effects:
      - "status=PENDING (CARD/ACH) or POSTED (CASH/CHECK on create)"
      - "If status=POSTED on create: apply POSTED side effects (see Donation state machine)"

  - method: GET
    path: "/donations/{id}"
    description: "Get a specific Donation by id."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: POST
    path: "/donations/{id}/post"
    description: "Manually transition a PENDING donation to POSTED (also invoked by /_payments/simulate with SUCCEEDED)."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects:
      - "status=POSTED, posted_at=current UTC"
      - "Cascade: Pledge.received_amount_cents += amount_cents; possibly Pledge ACTIVE->FULFILLED; PledgeCampaign.received_total_cents += amount_cents"

  - method: POST
    path: "/donations/{id}/refund"
    description: "Refund a POSTED donation (within 60-day window). Triggers depth-3 Rule 4 cascade."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects:
      - "status=REFUNDED, refunded_at=current UTC"
      - "Cascade Link 1: Pledge.received_amount_cents -= amount_cents (caused by donation state change)"
      - "Cascade Link 2: If Pledge was FULFILLED and now under threshold, Pledge.status FULFILLED->ACTIVE (caused by Link 1's received_amount_cents change, not by the refund action itself)"
      - "Cascade Link 3: If Link 2 fired, PledgeCampaign.fulfilled_pledge_count -= 1 (caused by Link 2's Pledge state change)"
      - "PledgeCampaign.received_total_cents -= amount_cents"

  - method: POST
    path: "/donations/{id}/mark-failed"
    description: "Mark a PENDING donation FAILED (via /_payments/simulate FAILED)."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: ["status=FAILED"]

  - method: GET
    path: "/donations"
    description: "List donations with filters (covers Donation.member_id, campaign_id, pledge_id reverse-reachability)."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "campaign_id?", "pledge_id?", "status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []

  # --- YearEndStatement ---
  - method: POST
    path: "/year-end-statements"
    description: "Generate a YearEndStatement in DRAFT for (member_id, tax_year, variant). Total is computed per member_ytd_deductible calc."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 201
    input: [member_id, tax_year, variant]
    output: YearEndStatement
    side_effects: ["status=DRAFT; total_deductible_cents and donation_count computed per variant"]

  - method: GET
    path: "/year-end-statements/{id}"
    description: "Get a specific YearEndStatement by id."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: []
    output: YearEndStatement
    side_effects: []

  - method: POST
    path: "/year-end-statements/{id}/issue"
    description: "Transition DRAFT -> ISSUED. FINAL variant only."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: YearEndStatement
    side_effects: ["status=ISSUED, issued_at=current UTC"]

  - method: POST
    path: "/year-end-statements/{id}/void"
    description: "Transition ISSUED -> VOIDED."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: YearEndStatement
    side_effects: ["status=VOIDED"]

  - method: POST
    path: "/year-end-statements/{id}/regenerate"
    description: "Transition VOIDED -> DRAFT with recomputed totals."
    roles: [FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: YearEndStatement
    side_effects: ["status=DRAFT, issued_at=null, total_deductible_cents and donation_count recomputed"]

  - method: GET
    path: "/year-end-statements"
    description: "List statements with filters (covers YearEndStatement.member_id reverse-reachability)."
    roles: [FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: YearEndStatement[]
    side_effects: []

  # --- Facility & Booking ---
  - method: POST
    path: "/facilities"
    description: "Create a Facility."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [name, capacity, "buffer_minutes?"]
    output: Facility
    side_effects: ["status=AVAILABLE, upcoming_booked_hours=0"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get a specific Facility."
    roles: [Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facility-bookings"
    description: "Create a FacilityBooking. Enforces temporal overlap (buffered half-open interval) and capacity. OCC via expected_facility_version — increments Facility.version on success."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [facility_id, booking_type, starts_at, ends_at, headcount, expected_facility_version, "event_id?"]
    output: FacilityBooking
    side_effects:
      - "status=CONFIRMED"
      - "increments Facility.version by 1"
      - "Facility.upcoming_booked_hours recomputed"

  - method: GET
    path: "/facility-bookings/{id}"
    description: "Get a specific FacilityBooking by id."
    roles: [Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: FacilityBooking
    side_effects: []

  - method: POST
    path: "/facility-bookings/{id}/cancel"
    description: "Cancel a FacilityBooking."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: FacilityBooking
    side_effects:
      - "status=CANCELLED"
      - "Facility.upcoming_booked_hours recomputed"

  - method: GET
    path: "/facility-bookings"
    description: "List bookings with filters (covers FacilityBooking.facility_id and event_id reverse-reachability)."
    roles: [Coordinator, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["facility_id?", "event_id?", "status?", "limit?", "offset?"]
    output: FacilityBooking[]
    side_effects: []

  # --- Event ---
  - method: POST
    path: "/events"
    description: "Create an Event."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [name, event_type, starts_at, ends_at, expected_attendance, volunteer_slots, "facility_id?"]
    output: Event
    side_effects: ["status=SCHEDULED, volunteer_filled_count=0, attendance_count=0"]

  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel a SCHEDULED event. Triggers depth-2 cascade (Rule 4)."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects:
      - "status=CANCELLED"
      - "Cascade Link 1: linked CONFIRMED FacilityBookings -> CANCELLED"
      - "Cascade Link 2: each FacilityBooking's Facility.upcoming_booked_hours recomputed (caused by Link 1)"
      - "Parallel: INVITED/ACCEPTED VolunteerAssignments -> CANCELLED (fan-out, not part of the depth-2 chain)"
      - "Parallel: CHECKED_IN ChildCheckIns -> SECURITY_HOLD with STAFF_HOLD (fan-out)"

  - method: POST
    path: "/events/{id}/complete"
    description: "Complete a SCHEDULED event after ends_at."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects:
      - "status=COMPLETED"
      - "CHECKED_IN VolunteerAssignments -> COMPLETED"

  - method: GET
    path: "/events/{id}"
    description: "Get an Event including its coverage_score (computed via volunteer_coverage_score calc)."
    roles: [Coordinator, FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "List events with filters (covers Event.facility_id reverse-reachability)."
    roles: [Coordinator, FinanceAdmin, Member, PlatformAdmin]
    code: 200
    input: ["facility_id?", "event_type?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  # --- VolunteerAssignment ---
  - method: POST
    path: "/volunteer-assignments"
    description: "Create a VolunteerAssignment invitation (INVITED)."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [event_id, member_id, role_type]
    output: VolunteerAssignment
    side_effects: ["status=INVITED"]

  - method: GET
    path: "/volunteer-assignments/{id}"
    description: "Get a specific VolunteerAssignment by id."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: []

  - method: POST
    path: "/volunteer-assignments/{id}/accept"
    description: "Member accepts an INVITED assignment."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects:
      - "status=ACCEPTED, accepted_at=current UTC"
      - "Event.volunteer_filled_count += 1"

  - method: POST
    path: "/volunteer-assignments/{id}/decline"
    description: "Member declines an INVITED assignment."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: ["status=DECLINED"]

  - method: POST
    path: "/volunteer-assignments/{id}/cancel"
    description: "Cancel an ACCEPTED assignment (member or coordinator can trigger)."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects:
      - "status=CANCELLED"
      - "Event.volunteer_filled_count -= 1 (only if was ACCEPTED)"

  - method: POST
    path: "/volunteer-assignments/{id}/checkin"
    description: "Coordinator marks volunteer CHECKED_IN at the event."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: ["status=CHECKED_IN"]

  - method: GET
    path: "/volunteer-assignments"
    description: "List assignments with filters (covers VolunteerAssignment.event_id and member_id reverse-reachability)."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: ["event_id?", "member_id?", "status?", "limit?", "offset?"]
    output: VolunteerAssignment[]
    side_effects: []

  # --- SmallGroup & GroupMembership ---
  - method: POST
    path: "/small-groups"
    description: "Create a SmallGroup."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [name, leader_member_id, ministry_area, capacity]
    output: SmallGroup
    side_effects: ["status=ACTIVE, roster_count=0"]

  - method: GET
    path: "/small-groups/{id}"
    description: "Get a specific SmallGroup."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: SmallGroup
    side_effects: []

  - method: GET
    path: "/small-groups"
    description: "List small groups with filters (covers SmallGroup.leader_member_id reverse-reachability via leader_member_id filter)."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: ["leader_member_id?", "ministry_area?", "status?", "limit?", "offset?"]
    output: SmallGroup[]
    side_effects: []

  - method: POST
    path: "/group-memberships"
    description: "Add a Member to a SmallGroup roster."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [group_id, member_id, "role?"]
    output: GroupMembership
    side_effects:
      - "status=ACTIVE"
      - "joined_on=current server date"
      - "SmallGroup.roster_count += 1"

  - method: GET
    path: "/group-memberships/{id}"
    description: "Get a specific GroupMembership by id."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: []
    output: GroupMembership
    side_effects: []

  - method: POST
    path: "/group-memberships/{id}/deactivate"
    description: "Mark a GroupMembership PAST (member leaves group)."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: GroupMembership
    side_effects:
      - "status=PAST"
      - "SmallGroup.roster_count -= 1"

  - method: GET
    path: "/group-memberships"
    description: "List memberships with filters (covers GroupMembership.group_id and member_id reverse-reachability)."
    roles: [Coordinator, Member, PlatformAdmin]
    code: 200
    input: ["group_id?", "member_id?", "status?", "limit?", "offset?"]
    output: GroupMembership[]
    side_effects: []

  # --- ChildCheckIn ---
  - method: POST
    path: "/child-checkins"
    description: "Check a CHILD member into a SCHEDULED event. Server mints pickup_pin."
    roles: [Coordinator, PlatformAdmin]
    code: 201
    input: [child_member_id, event_id, guardian_member_id]
    output: ChildCheckIn
    side_effects:
      - "status=CHECKED_IN, checked_in_at=current UTC"
      - "pickup_pin generated server-side (4 digits)"

  - method: GET
    path: "/child-checkins/{id}"
    description: "Get a specific ChildCheckIn by id."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: ChildCheckIn
    side_effects: []

  - method: POST
    path: "/child-checkins/{id}/checkout"
    description: "Check the child out. Requires matching pickup_pin AND pickup_by_member_id in child.guardian_member_ids; else transitions to SECURITY_HOLD."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: [pickup_pin, pickup_by_member_id]
    output: ChildCheckIn
    side_effects:
      - "On match: status=CHECKED_OUT, checked_out_at=current UTC"
      - "On PIN mismatch: status=SECURITY_HOLD, hold_reason=PIN_MISMATCH"
      - "On unauthorized guardian: status=SECURITY_HOLD, hold_reason=UNAUTHORIZED_PICKUP"

  - method: POST
    path: "/child-checkins/{id}/security-hold"
    description: "Staff-initiated SECURITY_HOLD on an active check-in."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: ChildCheckIn
    side_effects: ["status=SECURITY_HOLD, hold_reason=STAFF_HOLD"]

  - method: POST
    path: "/child-checkins/{id}/clear-hold"
    description: "Clear a SECURITY_HOLD back to CHECKED_IN."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: []
    output: ChildCheckIn
    side_effects: ["status=CHECKED_IN, hold_reason=null"]

  - method: GET
    path: "/child-checkins"
    description: "List check-ins with filters (covers ChildCheckIn.child_member_id, guardian_member_id, event_id reverse-reachability)."
    roles: [Coordinator, PlatformAdmin]
    code: 200
    input: ["child_member_id?", "guardian_member_id?", "event_id?", "status?", "limit?", "offset?"]
    output: ChildCheckIn[]
    side_effects: []

  # --- Test-driving endpoints (§1.5 priority ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default: 2026-03-01T00:00:00Z (fixed; before any call to this endpoint, the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time). All temporal calculations, refund-window checks, tax-year cutoffs, and event scheduling deadlines resolve against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/_payments/simulate"
    description: "Simulate the payment processor's response for a PENDING donation (CARD/ACH). SUCCEEDED transitions PENDING -> POSTED with the same side effects as POST /donations/{id}/post; FAILED transitions to FAILED."
    roles: [PlatformAdmin]
    code: 200
    input: [donation_id, outcome]
    output: Donation
    side_effects: ["applies the corresponding Donation state transition and its downstream cascades"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body / missing required input / invalid enum / negative amount" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role is not authorized for this endpoint per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that admits the requested transition" }
  - { id: ERR_DEPENDENCY_STATE, http: 409, condition: "A sibling entity's state blocks the operation (Household ARCHIVED, Event not SCHEDULED at volunteer accept or child check-in time, PledgeCampaign not ACTIVE at pledge create)" }
  - { id: ERR_REFERENCE_MISMATCH, http: 422, condition: "Cross-entity foreign-key alignment violated (donation.pledge_id.campaign_id != donation.campaign_id; guardian not in child.guardian_member_ids; guardian not in child's Household)" }
  - { id: ERR_SECURITY_HOLD_TRIGGERED, http: 409, condition: "Child checkout failed pickup_pin match OR unauthorized guardian; check-in transitioned to SECURITY_HOLD instead of CHECKED_OUT. Also raised when POST /events/{id}/complete fires with children still checked in." }
  - { id: ERR_FACILITY_OVERLAP, http: 409, condition: "Requested FacilityBooking [starts_at, ends_at) overlaps another CONFIRMED booking on the same Facility once the facility's buffer_minutes are added on both sides" }
  - { id: ERR_VOLUNTEER_OVERLAP, http: 409, condition: "Volunteer accept would cause the same Member to have two overlapping [Event.starts_at, Event.ends_at) windows across ACCEPTED/CHECKED_IN assignments" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "FacilityBooking.headcount > Facility.capacity; Event.expected_attendance > Facility.capacity; SmallGroup.roster_count would exceed capacity" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 409, condition: "current_date > donation.donation_date + 60 days" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "pledged_amount_cents <= 0; donation amount_cents <= 0; first_expected_on outside campaign window" }
  - { id: ERR_STATEMENT_TIMING, http: 409, condition: "FINAL YearEndStatement requested before (tax_year+1)-01-16T00:00:00Z" }
  - { id: ERR_MEMBERSHIP_INELIGIBLE, http: 422, condition: "SmallGroup leader membership_status not in {REGULAR, MEMBER}; CHILDCARE volunteer not ADULT+{REGULAR,MEMBER}" }
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version does not equal current Facility.version at booking-create time" }
  - { id: ERR_NO_ACTIVE_PLEDGE, http: 409, condition: "POST /donations with split_across=true when the member has no ACTIVE pledges on the specified campaign" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Attempted pledge creation on a campaign whose status is not ACTIVE" }
  - { id: ERR_CHILD_MUST_HAVE_GUARDIAN, http: 422, condition: "Creating a CHILD member with an empty guardian_member_ids or any guardian id not ADULT+same-Household" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "POST /events/{id}/complete fired before current_time >= event.ends_at" }
  - { id: ERR_STATEMENT_VARIANT_INVALID, http: 409, condition: "POST /year-end-statements/{id}/issue on a statement whose variant is PROVISIONAL" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Owns household + member directory operations. Cannot touch finance, events, or check-ins."
    identity: opaque
    exclusive_operations:
      - "POST /households"
      - "PATCH /households/{id}"
      - "POST /members"
      - "PATCH /members/{id}"
    shared_operations:
      - "GET /households/{id}"
      - "GET /households/{id}/members"
      - "GET /members/{id}"

  - name: FinanceAdmin
    description: "Owns giving/pledge/donation/statement operations. Read-only on members and facilities where needed."
    identity: opaque
    exclusive_operations:
      - "POST /pledge-campaigns"
      - "POST /pledge-campaigns/{id}/activate"
      - "POST /pledge-campaigns/{id}/close"
      - "POST /donations/{id}/post"
      - "POST /donations/{id}/refund"
      - "POST /donations/{id}/mark-failed"
      - "POST /year-end-statements"
      - "POST /year-end-statements/{id}/issue"
      - "POST /year-end-statements/{id}/void"
      - "POST /year-end-statements/{id}/regenerate"
    shared_operations:
      - "POST /pledges (also open to Member)"
      - "POST /pledges/{id}/cancel (also open to Member)"
      - "POST /donations (also open to Member)"
      - "GET /pledge-campaigns/{id}"
      - "GET /pledges"
      - "GET /donations"
      - "GET /year-end-statements"
      - "GET /events/{id}, GET /events"
      - "GET /facilities/{id}, GET /facility-bookings"
      - "GET /households/{id}, GET /members/{id}, GET /households/{id}/members"

  - name: Coordinator
    description: "Owns events, facilities, volunteer scheduling, small groups, and child check-in."
    identity: opaque
    exclusive_operations:
      - "POST /events"
      - "POST /events/{id}/cancel"
      - "POST /events/{id}/complete"
      - "POST /facilities"
      - "POST /facility-bookings"
      - "POST /facility-bookings/{id}/cancel"
      - "POST /volunteer-assignments"
      - "POST /volunteer-assignments/{id}/checkin"
      - "POST /small-groups"
      - "POST /group-memberships"
      - "POST /group-memberships/{id}/deactivate"
      - "POST /child-checkins"
      - "POST /child-checkins/{id}/checkout"
      - "POST /child-checkins/{id}/security-hold"
      - "POST /child-checkins/{id}/clear-hold"
    shared_operations:
      - "POST /volunteer-assignments/{id}/cancel (also open to Member)"
      - "GET /facilities/{id}, GET /facility-bookings"
      - "GET /events, GET /events/{id}"
      - "GET /volunteer-assignments"
      - "GET /small-groups, GET /small-groups/{id}, GET /group-memberships"
      - "GET /child-checkins"
      - "GET /households/{id}, GET /households/{id}/members, GET /members/{id}"
      - "GET /pledge-campaigns/{id}"

  - name: Member
    description: "Self-service role. X-User-ID equals the acting Member's id. Can view own giving history, own group memberships, and RSVP to own volunteer invitations. Cannot see or modify other members' donations, statements, or check-ins."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /volunteer-assignments/{id}/accept  (only when the assignment's member_id equals X-User-ID)"
      - "POST /volunteer-assignments/{id}/decline (only when the assignment's member_id equals X-User-ID)"
    shared_operations:
      - "POST /pledges (only for pledges whose member_id equals X-User-ID)"
      - "POST /pledges/{id}/cancel (only if pledge.member_id == X-User-ID)"
      - "POST /donations (only for donations whose member_id equals X-User-ID)"
      - "POST /volunteer-assignments/{id}/cancel (only if assignment.member_id == X-User-ID)"
      - "GET /members/{id}, GET /pledges, GET /donations, GET /year-end-statements, GET /events, GET /events/{id}, GET /volunteer-assignments, GET /small-groups, GET /small-groups/{id}, GET /group-memberships"

  - name: PlatformAdmin
    description: "Operational superuser and owner of test-driving endpoints (logical clock, payment simulator). PlatformAdmin may perform any business operation in this scaffold — encoded by listing PlatformAdmin as an allowed role on every endpoint above."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_payments/simulate"
    shared_operations:
      - "All business endpoints (see per-endpoint roles)"
