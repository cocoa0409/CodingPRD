              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "GG", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [3], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ggg@x.com", full_name: "GG Gifter" }
