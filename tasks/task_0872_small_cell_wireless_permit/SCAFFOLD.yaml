    path: "/applications/{id}/incompleteness-notices"
    description: "list incompleteness notices (FK reverse: IncompletenessNotice.application_id)"
    roles: [PlatformAdmin, Applicant, ROWReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: IncompletenessNotice[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/cure"
    description: "applicant cures the latest incompleteness notice; resumes and extends the shot clock"
    roles: [Applicant]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["set latest notice cured_at + toll_days; toll_days_accumulated += toll_days; recompute shot_clock_deadline; INCOMPLETE->SUBMITTED", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/nodes/{id}/design-review"
    description: "record the ROW/design-standard review; PASS reserves a structure slot (OCC on structure)"
    roles: [ROWReviewer]
    code: 201
    input: [outcome, expected_support_structure_version, "findings?"]
    output: NodeReview
    side_effects: ["create NodeReview(DESIGN_STANDARD)", "set design_review_status; PASS -> reserved_collocations += 1", "increments SupportStructure.version by 1", "fork-join may move node to APPROVED/REJECTED"]

  - method: POST
    path: "/nodes/{id}/aesthetic-review"
    description: "record the aesthetic/historic review"
    roles: [AestheticReviewer]
    code: 201
    input: [outcome, "concealment_required?", "findings?"]
    output: NodeReview
    side_effects: ["create NodeReview(AESTHETIC_HISTORIC)", "set aesthetic_review_status", "fork-join may move node to APPROVED/REJECTED (FAIL releases any reserved slot)"]

  - method: GET
    path: "/nodes/{id}/reviews"
    description: "list a node's review records (FK reverse: NodeReview.node_id)"
    roles: [PlatformAdmin, Applicant, ROWReviewer, AestheticReviewer, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: NodeReview[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/decision"
    description: "Approver issues the batch decision (auto grant/partial/deny from node outcomes); four-eyes SoD enforced"
    roles: [Approver]
    code: 200
    input: ["decision_notes?"]
    output: PermitApplication
    side_effects: ["set decided_at; move nodes to PERMITTED/DENIED", "create PENDING RecurringRentals for permitted nodes", "recompute FeeInvoice to FINAL; refund excess on partial/deny", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/applications/{id}/evaluate-deadline"
    description: "if the shot clock has strictly expired on an undecided application, deem it granted"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["clock > deadline -> DEEMED_GRANTED with the same granting side effects; else ERR_SHOT_CLOCK_NOT_EXPIRED", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/nodes/{id}/inspection"
    description: "record a physical inspection of a permitted node"
    roles: [Inspector]
    code: 201
    input: [outcome, "scheduled_start?", "scheduled_end?", "notes?"]
    output: Inspection
    side_effects: ["create Inspection(inspector_user_id = X-User-ID)"]

  - method: GET
    path: "/nodes/{id}/inspections"
    description: "list a node's inspections (FK reverse: Inspection.node_id)"
    roles: [PlatformAdmin, Applicant, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/nodes/{id}/activate"
    description: "activate a permitted, inspected, fully-paid node; finalizes its ROW rental"
    roles: [Inspector]
    code: 200
    input: []
    output: Node
    side_effects: ["Node PERMITTED->ACTIVATED", "RecurringRental PENDING->ACTIVE with actual proration", "reserved_collocations -= 1; active_collocations += 1", "increments Node.version by 1"]

  - method: GET
    path: "/nodes/{id}/rentals"
    description: "list a node's ROW rentals (FK reverse: RecurringRental.node_id)"
    roles: [PlatformAdmin, Applicant, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: RecurringRental[]
