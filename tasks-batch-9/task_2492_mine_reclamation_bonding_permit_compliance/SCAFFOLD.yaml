      - { name: completed_at, type: datetime, source: computed, description: "Logical clock value at COMPLETED; null otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Permit (1/2)
  - entity: Permit
    dimension: status
    initial_state: APPLICATION_SUBMITTED
    terminal_states: [DENIED, TERMINATED, FORFEITED]
    transitions:
      - from: APPLICATION_SUBMITTED
        to: ISSUED
        trigger: "POST /mining/permits/{id}/decide with decision == ISSUE"
        actor: PermitReviewer
        preconditions:
          - "permit.status == APPLICATION_SUBMITTED"
          - "a ReclamationCostEstimate with permit_id == permit.id AND status == ACCEPTED exists"
          - "permit.bond_held_amount >= permit.bond_required_amount"
          - "operator.registry_status == ACTIVE for permit.operator_id"
        side_effects:
          - "permit.status = ISSUED; permit.issued_at = logical clock now"
          - "permit.compliance_posture recomputed by calculations.permit_compliance_posture"
          - "permit.version incremented by 1"
      - from: APPLICATION_SUBMITTED
        to: DENIED
        trigger: "POST /mining/permits/{id}/decide with decision == DENY"
        actor: PermitReviewer
        preconditions: ["permit.status == APPLICATION_SUBMITTED", "denial_reason is present"]
        side_effects:
          - "permit.status = DENIED; permit.denial_reason = request denial_reason"
          - "permit.version incremented by 1"
        note: "Branch of the same trigger as ISSUE with a disjoint side-effect set — no bond determination, no issued_at."
      - from: ISSUED
        to: RECLAMATION_PHASE
        trigger: "POST /mining/permits/{id}/cease-mining"
        actor: Operator
        preconditions:
          - "permit.status == ISSUED"
          - "permit.disturbed_acres > 0"
          - "X-User-ID == permit.operator_id"
        side_effects:
          - "permit.status = RECLAMATION_PHASE"
          - "permit.version incremented by 1"
      - from: RECLAMATION_PHASE
        to: TERMINATED
        trigger: "system — evaluated at the end of a PHASE_III bond-release approval"
        actor: system
        preconditions:
          - "permit.status == RECLAMATION_PHASE"
          - "the approved application's phase == PHASE_III"
          - "permit.phase3_released_acres == permit.disturbed_acres after the approval"
        side_effects:
          - "every BondInstrument with permit_id == permit.id AND status == ACCEPTED transitions to RELEASED"
          - "permit.bond_released_to_date = round(permit.bond_released_to_date + permit.bond_held_amount, 2)"
          - "permit.bond_held_amount = 0.00; permit.bond_deficiency_amount = 0.00"
          - "permit.status = TERMINATED; permit.version incremented by 1"
        note: "Bubble-up auto-transition: the child release approval drives the parent permit terminal state."
      - from: ISSUED
        to: FORFEITED
        trigger: "system — link 2 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["the permit's ForfeitureProceeding just transitioned to FINAL"]
        side_effects:
          - "every BondInstrument with permit_id == permit.id AND status == ACCEPTED transitions to FORFEITED"
          - "permit.bond_held_amount = 0.00; permit.bond_deficiency_amount = 0.00"
          - "every Inspection with permit_id == permit.id AND status == SCHEDULED transitions to CANCELLED"
          - "permit.status = FORFEITED; permit.version incremented by 1"
          - "because the permit became FORFEITED, link 3 fires on the Operator (see Operator.self_bond_status machine)"
      - from: RECLAMATION_PHASE
        to: FORFEITED
        trigger: "system — link 2 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["the permit's ForfeitureProceeding just transitioned to FINAL"]
        side_effects:
          - "identical to the ISSUED -> FORFEITED side-effect set"

  # ---------------------------------------------------------------- Permit (2/2)
  - entity: Permit
    dimension: compliance_posture
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: NOTICE_ACTIVE
        trigger: "POST /mining/violation-notices (system recompute of calculations.permit_compliance_posture)"
        actor: system
        preconditions: ["a ViolationNotice with permit_id == permit.id AND notice_status == ISSUED exists", "permit.bond_deficiency_amount == 0", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["permit.compliance_posture = NOTICE_ACTIVE", "permit.version incremented by 1"]
      - from: NOTICE_ACTIVE
        to: COMPLIANT
        trigger: "POST /mining/violation-notices/{id}/abate or /vacate (system recompute)"
        actor: system
        preconditions: ["no ViolationNotice with permit_id == permit.id remains in notice_status IN {ISSUED, CESSATION_ORDERED}", "permit.bond_deficiency_amount == 0", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["permit.compliance_posture = COMPLIANT", "permit.version incremented by 1"]
      - from: NOTICE_ACTIVE
        to: CESSATION
        trigger: "POST /mining/violation-notices/{id}/order-cessation (system recompute) — link 2 of the cessation cascade"
        actor: system
        preconditions: ["a ViolationNotice with permit_id == permit.id AND notice_status == CESSATION_ORDERED exists", "no ForfeitureProceeding exists for the permit"]
        side_effects:
          - "permit.compliance_posture = CESSATION"
          - "because the posture entered CESSATION, link 3 fires: every BondReleaseApplication with permit_id == permit.id AND status IN {SUBMITTED, PUBLIC_NOTICE} transitions to SUSPENDED, with notice_start_date and notice_end_date cleared to null"
          - "permit.last_notice_end_date recomputed"
          - "permit.version incremented by 1"
      - from: CESSATION
        to: COMPLIANT
        trigger: "POST /mining/violation-notices/{id}/abate or /vacate on the cessation notice (system recompute)"
        actor: system
        preconditions: ["no ViolationNotice with permit_id == permit.id remains in notice_status IN {ISSUED, CESSATION_ORDERED}", "permit.bond_deficiency_amount == 0", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["permit.compliance_posture = COMPLIANT", "permit.version incremented by 1"]
        note: "Suspended release applications are NOT auto-reinstated; POST /bond-release-applications/{id}/reinstate is required."
      - from: COMPLIANT
        to: BOND_DEFICIENT
        trigger: "system — recompute after POST /mining/permits/{id}/recalculate-bond, after an EXPANSION revision approval (link 2 of the expansion cascade), or after a substitution acceptance that lowers credited coverage"
        actor: system
        preconditions: ["permit.bond_deficiency_amount > 0", "no ViolationNotice with permit_id == permit.id in notice_status == CESSATION_ORDERED", "no ForfeitureProceeding exists for the permit"]
        side_effects:
          - "permit.compliance_posture = BOND_DEFICIENT"
          - "because the posture entered BOND_DEFICIENT, link 3 fires: every BondReleaseApplication with permit_id == permit.id AND status IN {SUBMITTED, PUBLIC_NOTICE} transitions to SUSPENDED, with notice_start_date and notice_end_date cleared to null"
          - "permit.last_notice_end_date recomputed"
          - "permit.version incremented by 1"
      - from: NOTICE_ACTIVE
        to: BOND_DEFICIENT
        trigger: "system — same triggers as COMPLIANT -> BOND_DEFICIENT"
        actor: system
        preconditions: ["permit.bond_deficiency_amount > 0", "no notice in notice_status == CESSATION_ORDERED", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["identical to the COMPLIANT -> BOND_DEFICIENT side-effect set"]
        note: "BOND_DEFICIENT outranks NOTICE_ACTIVE in the posture precedence order pinned by calculations.permit_compliance_posture."
      - from: BOND_DEFICIENT
        to: COMPLIANT
        trigger: "POST /mining/bond-instruments/{id}/accept that raises bond_held_amount to at least bond_required_amount (system recompute)"
        actor: system
        preconditions: ["permit.bond_deficiency_amount == 0 after the acceptance", "no notice in notice_status IN {ISSUED, CESSATION_ORDERED}", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["permit.compliance_posture = COMPLIANT", "permit.version incremented by 1"]
      - from: BOND_DEFICIENT
        to: NOTICE_ACTIVE
        trigger: "POST /mining/bond-instruments/{id}/accept that cures the deficiency while an ISSUED notice remains (system recompute)"
        actor: system
        preconditions: ["permit.bond_deficiency_amount == 0 after the acceptance", "a ViolationNotice with notice_status == ISSUED exists", "no ForfeitureProceeding exists for the permit"]
        side_effects: ["permit.compliance_posture = NOTICE_ACTIVE", "permit.version incremented by 1"]
      - from: CESSATION
        to: FORFEITURE_PENDING
        trigger: "POST /mining/forfeiture-proceedings (system recompute)"
        actor: system
        preconditions: ["a ForfeitureProceeding with permit_id == permit.id exists"]
        side_effects:
          - "permit.compliance_posture = FORFEITURE_PENDING"
          - "every BondReleaseApplication with permit_id == permit.id AND status IN {SUBMITTED, PUBLIC_NOTICE} transitions to SUSPENDED, with notice_start_date and notice_end_date cleared to null"
          - "permit.version incremented by 1"
      - from: BOND_DEFICIENT
        to: FORFEITURE_PENDING
        trigger: "POST /mining/forfeiture-proceedings (system recompute)"
        actor: system
        preconditions: ["a ForfeitureProceeding with permit_id == permit.id exists"]
        side_effects: ["identical to the CESSATION -> FORFEITURE_PENDING side-effect set"]

  # ------------------------------------------------- ReclamationCostEstimate
  - entity: ReclamationCostEstimate
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mining/reclamation-cost-estimates/{id}/accept"
        actor: PermitReviewer
        preconditions:
          - "estimate.status == SUBMITTED"
          - "permit.status IN {APPLICATION_SUBMITTED, ISSUED, RECLAMATION_PHASE}"
          - "request expected_permit_version == permit.version"
        side_effects:
          - "estimate.status = ACCEPTED; estimate.accepted_at = logical clock now"
          - "any other ReclamationCostEstimate with the same permit_id AND status == ACCEPTED transitions to SUPERSEDED"
          - "permit.bond_required_amount recomputed by calculations.bond_required_amount under permit.bond_basis"
          - "permit.bond_deficiency_amount recomputed; permit.compliance_posture recomputed"
          - "permit.version incremented by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system — acceptance of a later estimate on the same permit"
        actor: system
        preconditions: ["another estimate on the same permit_id just transitioned to ACCEPTED"]
        side_effects: ["estimate.status = SUPERSEDED", "estimate.version incremented by 1"]

  # ----------------------------------------------------------- BondInstrument
  - entity: BondInstrument
    initial_state: PROPOSED
    terminal_states: [REPLACED, RELEASED, FORFEITED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /mining/bond-instruments/{id}/accept"
        actor: BondSpecialist
        preconditions:
          - "instrument.status == PROPOSED"
          - "permit.status IN {APPLICATION_SUBMITTED, ISSUED, RECLAMATION_PHASE}"
          - "when instrument_type == SURETY: surety_naic_rating IN {A_PLUS_PLUS, A_PLUS, A, B_PLUS_PLUS}"
          - "when instrument_type == SELF_BOND: operator.self_bond_status == QUALIFIED and calculations.bond_instrument_credited_amount yields credited_amount == face_amount"
          - "when replaces_instrument_id is present: that instrument has the same permit_id AND status IN {ACCEPTED, SUBSTITUTION_REQUIRED}"
        side_effects:
          - "instrument.credited_amount = calculations.bond_instrument_credited_amount"
          - "instrument.status = ACCEPTED; instrument.accepted_by_user_id = X-User-ID; instrument.accepted_at = logical clock now"
          - "when replaces_instrument_id is present, that instrument transitions to REPLACED"
          - "permit.bond_held_amount recomputed; permit.bond_deficiency_amount recomputed; permit.compliance_posture recomputed"
          - "operator.self_bond_exposure_amount recomputed when instrument_type == SELF_BOND"
          - "permit.version incremented by 1"
      - from: ACCEPTED
        to: REPLACED
        trigger: "system — acceptance of an instrument whose replaces_instrument_id points at this row"
        actor: system
        preconditions: ["a substitution instrument on the same permit just transitioned to ACCEPTED"]
        side_effects: ["instrument.status = REPLACED", "its credited_amount leaves the permit.bond_held_amount sum", "instrument.version incremented by 1"]
      - from: SUBSTITUTION_REQUIRED
        to: REPLACED
        trigger: "system — acceptance of an instrument whose replaces_instrument_id points at this row"
        actor: system
        preconditions: ["a substitution instrument on the same permit just transitioned to ACCEPTED"]
        side_effects: ["instrument.status = REPLACED", "instrument.version incremented by 1"]
      - from: ACCEPTED
        to: SUBSTITUTION_REQUIRED
        trigger: "system — link 4 of the forfeiture-finalize cascade (operator disqualification)"
        actor: system
        preconditions: ["instrument.instrument_type == SELF_BOND", "the operator's self_bond_status just became DISQUALIFIED", "instrument.permit_id != the forfeited permit"]
        side_effects:
          - "instrument.status = SUBSTITUTION_REQUIRED; its credited_amount leaves the permit.bond_held_amount sum"
          - "the holding permit's bond_deficiency_amount recomputed and compliance_posture recomputed (BOND_DEFICIENT when deficiency > 0)"
          - "instrument.version incremented by 1"
      - from: ACCEPTED
        to: RELEASED
        trigger: "system — permit RECLAMATION_PHASE -> TERMINATED auto-transition"
        actor: system
        preconditions: ["the holding permit just transitioned to TERMINATED"]
        side_effects: ["instrument.status = RELEASED", "instrument.version incremented by 1"]
      - from: ACCEPTED
        to: FORFEITED
        trigger: "system — link 2 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["the holding permit just transitioned to FORFEITED"]
        side_effects: ["instrument.status = FORFEITED", "instrument.version incremented by 1"]

  # --------------------------------------------------- BondReleaseApplication
  - entity: BondReleaseApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESCINDED]
    transitions:
      - from: SUBMITTED
        to: PUBLIC_NOTICE
        trigger: "POST /mining/bond-release-applications/{id}/publish-notice"
        actor: BondSpecialist
        preconditions:
          - "application.status == SUBMITTED"
          - "permit.compliance_posture IN {COMPLIANT, NOTICE_ACTIVE}"
          - "no notice-window conflict per validations priority 15 (closed interval plus NOTICE_GAP_DAYS buffer)"
        side_effects:
          - "application.notice_start_date = logical clock now; application.notice_end_date = notice_start_date + PUBLIC_NOTICE_DAYS"
          - "permit.last_notice_end_date recomputed"
          - "application.version incremented by 1"
      - from: PUBLIC_NOTICE
        to: APPROVED
        trigger: "POST /mining/bond-release-applications/{id}/decide with decision == APPROVE"
        actor: BondSpecialist
        preconditions:
          - "application.status == PUBLIC_NOTICE"
          - "logical clock now > application.notice_end_date"
          - "application.objection_count == 0 OR application.objections_resolved == true"
          - "no ViolationNotice with permit_id == application.permit_id in notice_status IN {ISSUED, CESSATION_ORDERED}"
          - "the cited Inspection has permit_id == application.permit_id, inspection_type == RELEASE, status == COMPLETED, result == PASS"
          - "X-User-ID != accepted_by_user_id of every BondInstrument with permit_id == application.permit_id AND status == ACCEPTED"
          - "application.requested_amount <= round(permit.bond_held_amount - retention_floor, 2) per calculations.bond_release_amount"
        side_effects:
          - "application.status = APPROVED; application.approved_amount = application.requested_amount; application.approved_at = logical clock now; application.inspection_id = cited inspection; application.decided_by_user_id = X-User-ID"
          - "permit.bond_released_to_date = round(permit.bond_released_to_date + approved_amount, 2)"
          - "permit.bond_held_amount recomputed; permit.bond_deficiency_amount recomputed"
          - "permit.phase{1,2,3}_released_acres incremented by acres_requested for the application's phase"
          - "the RECLAMATION_PHASE -> TERMINATED auto-transition is evaluated"
          - "application.version and permit.version each incremented by 1"
      - from: PUBLIC_NOTICE
        to: DENIED
        trigger: "POST /mining/bond-release-applications/{id}/decide with decision == DENY"
        actor: BondSpecialist
        preconditions: ["application.status == PUBLIC_NOTICE", "logical clock now > application.notice_end_date", "denial_reason is present", "the cited Inspection has permit_id == application.permit_id, inspection_type == RELEASE, status == COMPLETED"]
        side_effects:
          - "application.status = DENIED; application.denial_reason = request denial_reason; application.inspection_id = cited inspection; application.decided_by_user_id = X-User-ID"
          - "no bond ledger field on the permit changes; permit.version unchanged"
          - "application.version incremented by 1"
        note: "Fork-join branch: APPROVE mutates the permit bond ledger and may terminate the permit, DENY touches nothing outside the application."
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system — permit.compliance_posture entered CESSATION, BOND_DEFICIENT or FORFEITURE_PENDING"
        actor: system
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["application.status = SUSPENDED", "application.version incremented by 1"]
      - from: PUBLIC_NOTICE
        to: SUSPENDED
        trigger: "system — permit.compliance_posture entered CESSATION, BOND_DEFICIENT or FORFEITURE_PENDING"
        actor: system
        preconditions: ["application.status == PUBLIC_NOTICE"]
        side_effects:
          - "application.status = SUSPENDED; application.notice_start_date = null; application.notice_end_date = null"
          - "permit.last_notice_end_date recomputed"
          - "application.version incremented by 1"
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /mining/bond-release-applications/{id}/reinstate"
        actor: BondSpecialist
        preconditions: ["application.status == SUSPENDED", "permit.compliance_posture IN {COMPLIANT, NOTICE_ACTIVE}"]
        side_effects:
          - "application.status = SUBMITTED; application.requested_amount recomputed by calculations.bond_release_amount against the permit's current bond_required_amount"
          - "application.version incremented by 1"
        note: "Cycle: SUBMITTED -> PUBLIC_NOTICE -> SUSPENDED -> SUBMITTED. The public notice must be republished, which re-runs the notice-window conflict check."
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /mining/bond-release-applications/{id}/rescind"
        actor: ProgramDirector
        preconditions:
          - "application.status == APPROVED"
          - "logical clock now <= application.approved_at + RESCISSION_WINDOW_DAYS"
          - "permit.status IN {ISSUED, RECLAMATION_PHASE}"
        side_effects:
          - "permit.bond_released_to_date = round(permit.bond_released_to_date - application.approved_amount, 2)"
          - "permit.phase{1,2,3}_released_acres decremented by application.acres_requested for the application's phase"
          - "application.approved_amount = 0.00; application.status = RESCINDED; application.rescission_reason = request rescission_reason"
          - "permit.bond_held_amount recomputed; permit.bond_deficiency_amount recomputed; permit.compliance_posture recomputed"
          - "application.version and permit.version each incremented by 1"
        note: "Compensating action for the APPROVE branch — restores the bond ledger invariant to its pre-approval values."

  # ---------------------------------------------------------------- Inspection
  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /mining/inspections/{id}/record-result"
        actor: Inspector
        preconditions: ["inspection.status == SCHEDULED", "X-User-ID == inspection.inspector_id"]
        side_effects:
          - "inspection.status = COMPLETED; inspection.result = request result; inspection.findings_note = request findings_note; inspection.completed_at = logical clock now"
          - "inspector.scheduled_inspection_count decremented by 1"
          - "inspection.version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — link 2 of the forfeiture-finalize cascade (permit became FORFEITED)"
        actor: system
        preconditions: ["the inspection's permit just transitioned to FORFEITED"]
        side_effects: ["inspection.status = CANCELLED", "inspector.scheduled_inspection_count decremented by 1", "inspection.version incremented by 1"]

  # -------------------------------------------------------- ViolationNotice 1/2
  - entity: ViolationNotice
    dimension: notice_status
    initial_state: ISSUED
    terminal_states: [ABATED, VACATED]
    transitions:
      - from: ISSUED
        to: CESSATION_ORDERED
        trigger: "POST /mining/violation-notices/{id}/order-cessation"
        actor: Inspector
        preconditions:
          - "notice.notice_status == ISSUED"
          - "notice.total_points >= CESSATION_POINTS_THRESHOLD OR logical clock now > notice.abatement_deadline OR notice.violation_class == IMMINENT_HARM"
        side_effects:
          - "notice.notice_status = CESSATION_ORDERED; notice.cessation_ordered_at = logical clock now; notice.cessation_reason = request cessation_reason"
          - "because the notice entered CESSATION_ORDERED, link 2 fires: permit.compliance_posture recomputed to CESSATION"
          - "notice.version incremented by 1"
      - from: ISSUED
        to: ABATED
        trigger: "POST /mining/violation-notices/{id}/abate"
        actor: Operator
        preconditions: ["notice.notice_status == ISSUED", "X-User-ID == permit.operator_id"]
        side_effects:
          - "notice.notice_status = ABATED; notice.abated_at = logical clock now; notice.abatement_note = request abatement_note"
          - "operator.violation_points_total recomputed (this notice leaves the sum)"
          - "permit.compliance_posture recomputed"
          - "notice.version incremented by 1"
      - from: CESSATION_ORDERED
        to: ABATED
        trigger: "POST /mining/violation-notices/{id}/abate"
        actor: Operator
        preconditions: ["notice.notice_status == CESSATION_ORDERED", "X-User-ID == permit.operator_id"]
        side_effects: ["identical to the ISSUED -> ABATED side-effect set"]
      - from: ISSUED
        to: VACATED
        trigger: "POST /mining/violation-notices/{id}/vacate"
        actor: ProgramDirector
        preconditions: ["notice.notice_status IN {ISSUED, CESSATION_ORDERED}", "notice.penalty_status != PAID"]
        side_effects:
          - "notice.notice_status = VACATED; notice.vacated_at = logical clock now; notice.vacate_reason = request vacate_reason"
          - "when notice.penalty_status == ASSESSED it transitions to VACATED and notice.penalty_amount = 0.00"
          - "operator.violation_points_total and operator.outstanding_penalty_balance recomputed"
          - "permit.compliance_posture recomputed"
          - "notice.version incremented by 1"
      - from: CESSATION_ORDERED
        to: VACATED
        trigger: "POST /mining/violation-notices/{id}/vacate"
        actor: ProgramDirector
        preconditions: ["notice.notice_status == CESSATION_ORDERED", "notice.penalty_status != PAID"]
        side_effects: ["identical to the ISSUED -> VACATED side-effect set"]

  # -------------------------------------------------------- ViolationNotice 2/2
  - entity: ViolationNotice
    dimension: penalty_status
    initial_state: NONE
    terminal_states: [PAID, VACATED]
    transitions:
      - from: NONE
        to: ASSESSED
        trigger: "POST /mining/violation-notices/{id}/assess-penalty"
        actor: ProgramDirector
        preconditions: ["notice.penalty_status == NONE", "notice.notice_status IN {ISSUED, CESSATION_ORDERED, ABATED}"]
        side_effects:
          - "notice.good_faith_level = request good_faith_level; notice.penalty_amount = calculations.penalty_assessment_amount"
          - "operator.outstanding_penalty_balance recomputed"
          - "notice.version incremented by 1"
        note: "Independent of notice_status: a notice already ABATED can still carry a civil penalty."
      - from: ASSESSED
        to: PAID
        trigger: "POST /mining/violation-notices/{id}/pay-penalty"
        actor: Operator
        preconditions: ["notice.penalty_status == ASSESSED", "request amount_paid == notice.penalty_amount", "X-User-ID == permit.operator_id"]
        side_effects:
          - "notice.penalty_paid_amount = request amount_paid; notice.penalty_status = PAID"
          - "operator.outstanding_penalty_balance recomputed"
          - "notice.version incremented by 1"
      - from: ASSESSED
        to: VACATED
        trigger: "system — POST /mining/violation-notices/{id}/vacate"
        actor: system
        preconditions: ["notice.notice_status just became VACATED"]
        side_effects: ["notice.penalty_status = VACATED; notice.penalty_amount = 0.00", "operator.outstanding_penalty_balance recomputed"]

  # ------------------------------------------------------------- PermitRevision
  - entity: PermitRevision
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /mining/permit-revisions/{id}/request-info"
        actor: PermitReviewer
        preconditions: ["revision.status == SUBMITTED"]
        side_effects: ["revision.status = INFO_REQUESTED; revision.info_request_note = request info_request_note", "revision.version incremented by 1"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /mining/permit-revisions/{id}/resubmit"
        actor: Operator
        preconditions: ["revision.status == INFO_REQUESTED", "revision.round_count < REVISION_ROUND_CAP", "X-User-ID == permit.operator_id"]
        side_effects: ["revision.status = SUBMITTED; revision.response_note = request response_note; revision.round_count incremented by 1", "revision.version incremented by 1"]
        note: "Cycle: SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by REVISION_ROUND_CAP."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mining/permit-revisions/{id}/decide with decision == APPROVE"
        actor: PermitReviewer
        preconditions:
          - "revision.status == SUBMITTED"
          - "permit.status IN {ISSUED, RECLAMATION_PHASE}"
          - "permit.compliance_posture IN {COMPLIANT, NOTICE_ACTIVE}"
        side_effects:
          - "revision.status = APPROVED; revision.decided_at = logical clock now"
          - "EXPANSION: permit.mining_plan_acres = round(permit.mining_plan_acres + revision.acreage_delta, 2); permit.bond_required_amount recomputed under permit.bond_basis (link 1 of the expansion cascade)"
          - "SEQUENCE_CHANGE: no permit field other than updated_at/version changes"
          - "PMLU_CHANGE: permit.post_mining_land_use = revision.new_post_mining_land_use"
          - "because bond_required_amount rose above bond_held_amount, link 2 fires: permit.bond_deficiency_amount set > 0 and permit.compliance_posture recomputed to BOND_DEFICIENT"
          - "because the posture entered BOND_DEFICIENT, link 3 fires: every BondReleaseApplication on the permit with status IN {SUBMITTED, PUBLIC_NOTICE} transitions to SUSPENDED"
          - "revision.version and permit.version each incremented by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mining/permit-revisions/{id}/decide with decision == DENY"
        actor: PermitReviewer
        preconditions: ["revision.status == SUBMITTED", "denial_reason is present"]
        side_effects: ["revision.status = DENIED; revision.denial_reason = request denial_reason; revision.decided_at = logical clock now", "no permit field changes", "revision.version incremented by 1"]

  # -------------------------------------------------------- ForfeitureProceeding
  - entity: ForfeitureProceeding
    initial_state: INITIATED
    terminal_states: [COMPLETED]
    transitions:
      - from: INITIATED
        to: CONTESTED
        trigger: "POST /mining/forfeiture-proceedings/{id}/contest"
        actor: Operator
        preconditions: ["proceeding.status == INITIATED", "logical clock now <= proceeding.contest_deadline", "X-User-ID == permit.operator_id"]
        side_effects: ["proceeding.status = CONTESTED; proceeding.contest_note = request contest_note", "proceeding.version incremented by 1"]
      - from: INITIATED
        to: FINAL
        trigger: "POST /mining/forfeiture-proceedings/{id}/finalize"
        actor: ProgramDirector
        preconditions: ["proceeding.status == INITIATED", "logical clock now > proceeding.contest_deadline"]
        side_effects:
          - "proceeding.status = FINAL; proceeding.finalized_at = logical clock now; proceeding.state_reclamation_cost_estimate = request value"
          - "proceeding.forfeited_bond_amount = permit.bond_held_amount at entry; proceeding.deficiency_amount per calculations.forfeiture_settlement (finalization stage)"
          - "link 2: the permit transitions to FORFEITED (instruments FORFEITED, held bond zeroed, SCHEDULED inspections CANCELLED)"
          - "link 3: because the permit became FORFEITED, operator.forfeiture_count incremented by 1, operator.self_bond_status = DISQUALIFIED and operator.registry_status = DISQUALIFIED"
          - "link 4: because the operator became DISQUALIFIED, every BondInstrument with instrument_type == SELF_BOND AND status == ACCEPTED on the operator's OTHER permits transitions to SUBSTITUTION_REQUIRED, and each of those permits recomputes bond_deficiency_amount and compliance_posture (BOND_DEFICIENT)"
          - "proceeding.version incremented by 1"
      - from: CONTESTED
        to: FINAL
        trigger: "POST /mining/forfeiture-proceedings/{id}/finalize"
        actor: ProgramDirector
        preconditions: ["proceeding.status == CONTESTED", "logical clock now > proceeding.contest_deadline"]
        side_effects: ["identical to the INITIATED -> FINAL side-effect set (links 2, 3 and 4 included)"]
      - from: FINAL
        to: COMPLETED
        trigger: "POST /mining/forfeiture-proceedings/{id}/record-state-reclamation with completion_pct == 100"
        actor: ProgramDirector
        preconditions: ["proceeding.status == FINAL", "request completion_pct == 100"]
        side_effects:
          - "proceeding.actual_cost_incurred = request actual_cost_incurred; proceeding.completion_pct = 100; proceeding.status = COMPLETED; proceeding.completed_at = logical clock now"
          - "proceeding.deficiency_amount and proceeding.surplus_amount per calculations.forfeiture_settlement (completion stage)"
          - "operator.refund_due_amount = round(operator.refund_due_amount + proceeding.surplus_amount, 2)"
          - "when proceeding.deficiency_amount > 0: mine_site.site_class = ABANDONED_LEGACY, mine_site.funding_status = NOMINATED, mine_site.unfunded_reclamation_need = proceeding.deficiency_amount, mine_site.acres_affected = round(permit.disturbed_acres - permit.reclaimed_acres_credited, 2), mine_site.legacy_priority_score recomputed"
          - "proceeding.version incremented by 1"
        note: "A record-state-reclamation call with completion_pct < 100 keeps status FINAL and only updates actual_cost_incurred / completion_pct."

  # ------------------------------------------------------------------ MineSite
  - entity: MineSite
    dimension: funding_status
    initial_state: NOT_APPLICABLE
    terminal_states: [FUNDED]
    transitions:
      - from: NOT_APPLICABLE
        to: NOMINATED
        trigger: "POST /mining/mine-sites/{id}/nominate-legacy, or the state-reclamation-completion cascade when a deficiency remains"
        actor: ProgramDirector
        preconditions: ["mine_site.funding_status == NOT_APPLICABLE", "mine_site.site_class == ABANDONED_LEGACY (set at creation or by the cascade)"]
        side_effects: ["mine_site.hazard_class / public_safety_score / water_quality_score / acres_affected / unfunded_reclamation_need set from the request", "mine_site.legacy_priority_score = calculations.legacy_priority_score", "mine_site.funding_status = NOMINATED", "mine_site.version incremented by 1"]
      - from: NOMINATED
        to: FUNDED
        trigger: "POST /mining/mine-sites/{id}/award-legacy-funding"
        actor: ProgramDirector
        preconditions:
          - "mine_site.funding_status == NOMINATED"
          - "this site is the head of the funding queue defined in calculations.legacy_priority_score"
          - "round(sum(MineSite.awarded_funding_amount over all sites) + request award_amount, 2) <= LEGACY_FUND_ANNUAL_CAP"
        side_effects: ["mine_site.awarded_funding_amount = request award_amount; mine_site.unfunded_reclamation_need = max(round(unfunded_reclamation_need - award_amount, 2), 0); mine_site.funding_status = FUNDED", "mine_site.version incremented by 1"]

  # ------------------------------------------------------------------ Operator
  - entity: Operator
    dimension: self_bond_status
    initial_state: UNTESTED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNTESTED
        to: QUALIFIED
        trigger: "POST /mining/operators/{id}/financial-test"
        actor: BondSpecialist
        preconditions: ["operator.self_bond_status IN {UNTESTED, QUALIFIED, FAILED}", "the elected test passes per calculations.operator_self_bond_capacity"]
        side_effects: ["operator.self_bond_capacity_amount = calculations.operator_self_bond_capacity", "operator.self_bond_status = QUALIFIED", "operator.version incremented by 1"]
      - from: UNTESTED
        to: FAILED
        trigger: "POST /mining/operators/{id}/financial-test"
        actor: BondSpecialist
        preconditions: ["operator.self_bond_status IN {UNTESTED, QUALIFIED, FAILED}", "the elected test fails per calculations.operator_self_bond_capacity"]
        side_effects: ["operator.self_bond_capacity_amount = 0.00", "operator.self_bond_status = FAILED", "operator.version incremented by 1"]
      - from: QUALIFIED
        to: UNTESTED
        trigger: "PATCH /mining/operators/{id}/financials"
        actor: ProgramDirector
        preconditions: ["operator.self_bond_status != DISQUALIFIED"]
        side_effects: ["the supplied financial fields are replaced", "operator.self_bond_status = UNTESTED; operator.self_bond_capacity_amount = 0.00", "operator.version incremented by 1"]
        note: "Changing the financial inputs invalidates the prior test result; a fresh financial-test call is required."
      - from: FAILED
        to: UNTESTED
        trigger: "PATCH /mining/operators/{id}/financials"
        actor: ProgramDirector
        preconditions: ["operator.self_bond_status != DISQUALIFIED"]
        side_effects: ["identical to the QUALIFIED -> UNTESTED side-effect set"]
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system — link 3 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["one of the operator's permits just transitioned to FORFEITED"]
        side_effects:
          - "operator.self_bond_status = DISQUALIFIED; operator.registry_status = DISQUALIFIED; operator.forfeiture_count incremented by 1; operator.self_bond_capacity_amount = 0.00"
          - "because the operator became DISQUALIFIED, link 4 fires on the operator's remaining SELF_BOND instruments (see BondInstrument ACCEPTED -> SUBSTITUTION_REQUIRED)"
          - "operator.version incremented by 1"
      - from: UNTESTED
        to: DISQUALIFIED
        trigger: "system — link 3 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["one of the operator's permits just transitioned to FORFEITED"]
        side_effects: ["identical to the QUALIFIED -> DISQUALIFIED side-effect set"]
      - from: FAILED
        to: DISQUALIFIED
        trigger: "system — link 3 of the forfeiture-finalize cascade"
        actor: system
        preconditions: ["one of the operator's permits just transitioned to FORFEITED"]
        side_effects: ["identical to the QUALIFIED -> DISQUALIFIED side-effect set"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on Permit.version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-accept-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /mining/reclamation-cost-estimates/{id}/accept"
    occ_field: "expected_permit_version"
    description: |
      Accepting a ReclamationCostEstimate against a Permit whose version has
      advanced since the client last observed it is rejected. Two distinct
      SUBMITTED estimates on the same permit are each independently
      acceptable, and accepting the second legitimately supersedes the first
      and re-prices the bond, so no state precondition rejects the second
      acceptance; the stale-version check is what tells the second reviewer
      that the bond basis they were pricing against has already moved.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

  - rule_id: bond-recalculation-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /mining/permits/{id}/recalculate-bond"
    occ_field: "expected_permit_version"
    description: |
      A periodic bond recalculation carrying a permit version older than the
      permit's current version is rejected. A recalculation is always
      permissible on an ISSUED or RECLAMATION_PHASE permit and legitimately
      supersedes the previous determination, so nothing in the state machine
      blocks a second recalculation; the stale-version check is what stops a
      determination computed from an outdated disturbance report or estimate
      from overwriting a newer one.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: bond_required_amount
    entity: Permit
    field: bond_required_amount
    algorithm_type: threshold
    variants:
      - variant: FULL_PLAN
        when: "permit.bond_basis == FULL_PLAN (the basis a permit is created with)"
        basis_acres: "permit.mining_plan_acres"
      - variant: INCREMENTAL
        when: "permit.bond_basis == INCREMENTAL (set by POST /mining/permits/{id}/recalculate-bond with basis == INCREMENTAL)"
        basis_acres: "max(round(permit.disturbed_acres - permit.reclaimed_acres_credited, 2), 0)"
    inputs:
      - "the single ReclamationCostEstimate with permit_id == permit.id AND status == ACCEPTED (field direct_cost_per_acre, field estimate_effective_date)"
      - "permit.bond_basis, permit.mining_plan_acres, permit.disturbed_acres, permit.reclaimed_acres_credited"
      - "the logical clock's current UTC instant"
    formula: |
      escalation_years = floor((clock_now_date - estimate.estimate_effective_date) / 365 days)   # integer, >= 0
      per_acre_loaded  = round(estimate.direct_cost_per_acre * (1 + INDIRECT_COST_RATE)
                               * (1 + ANNUAL_INFLATION_RATE) ** escalation_years, 2)
      basis_acres      = variant-specific (see variants above)
      subtotal         = round(per_acre_loaded * basis_acres, 2)
      admin_fee        = min(max(round(subtotal * ADMIN_FEE_RATE, 2), ADMIN_FEE_MIN), ADMIN_FEE_MAX)
      bond_required    = max(round(subtotal + admin_fee, 2), STATUTORY_MINIMUM_BOND)
      # Rounding order is normative: per_acre_loaded is rounded to 2dp BEFORE it is
      # multiplied by basis_acres. Deferring that rounding to the subtotal changes
      # the answer (see the worked divergence case below).
    constants:
      INDIRECT_COST_RATE: 0.185
      ANNUAL_INFLATION_RATE: 0.03
      ADMIN_FEE_RATE: 0.015
      ADMIN_FEE_MIN: 2500.00
      ADMIN_FEE_MAX: 25000.00
      STATUTORY_MINIMUM_BOND: 10000.00
      DAYS_PER_ESCALATION_YEAR: 365
    precision: "2 decimal places, ROUND_HALF_UP, at each named step"
    recompute_triggers:
      - "POST /mining/reclamation-cost-estimates/{id}/accept"
      - "POST /mining/permits/{id}/recalculate-bond"
      - "POST /mining/permit-revisions/{id}/decide with decision == APPROVE on an EXPANSION revision"
    worked_examples:
      - "FULL_PLAN, direct_cost_per_acre 6000.00, mining_plan_acres 120, escalation_years 0: per_acre_loaded 7110.00, subtotal 853200.00, admin_fee 12798.00, bond_required 865998.00"
      - "INCREMENTAL, same estimate, disturbed_acres 120, reclaimed_acres_credited 75 (basis 45): subtotal 319950.00, admin_fee 4799.25, bond_required 324749.25"
      - "INCREMENTAL with basis_acres 0: subtotal 0.00, admin_fee floored at 2500.00, bond_required floored at 10000.00"
      - "escalation_years 1 (365 days elapsed): per_acre_loaded 7323.30, bond_required 891977.94; escalation_years 2 (762 days elapsed): per_acre_loaded 7543.00, bond_required 918737.40"
      - "rounding-order divergence, direct_cost_per_acre 6133.33, 120 acres, 0 years: normative 7268.00 -> 872160.00 -> 13082.40 -> 885242.40; the deferred-rounding reading yields 885241.92"

  - name: bond_instrument_credited_amount
    entity: BondInstrument
    field: credited_amount
    algorithm_type: tiered_pricing
    inputs:
      - "instrument.instrument_type, instrument.face_amount, instrument.surety_naic_rating, instrument.collateral_type, instrument.collateral_market_value"
      - "for SELF_BOND: operator.self_bond_status, operator.self_bond_capacity_amount, operator.self_bond_exposure_amount"
    formula: |
      CASH:        credited = instrument.face_amount
      SURETY:      credited = round(face_amount * SURETY_RATING_MULTIPLIER[surety_naic_rating], 2)
      COLLATERAL:  credited = min(round(collateral_market_value
                                        * (1 - COLLATERAL_HAIRCUT[collateral_type]), 2),
                                  face_amount)
                   # the haircut applies to MARKET VALUE, then the face amount caps the result
      SELF_BOND:   credited = 0.00 when operator.self_bond_status != QUALIFIED
                   otherwise min(face_amount,
                                 max(round(operator.self_bond_capacity_amount
                                           - operator.self_bond_exposure_amount, 2), 0))
    constants:
      SURETY_RATING_MULTIPLIER: { A_PLUS_PLUS: 1.00, A_PLUS: 1.00, A: 0.90, B_PLUS_PLUS: 0.75 }
      COLLATERAL_HAIRCUT: { US_TREASURY: 0.00, MUNICIPAL_BOND: 0.05, IRREVOCABLE_LOC: 0.00, REAL_PROPERTY: 0.30 }
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers: ["POST /mining/bond-instruments/{id}/accept (credited_amount is frozen at acceptance)"]
    worked_examples:
      - "SURETY, face 900000.00, rating A: 810000.00"
      - "COLLATERAL, MUNICIPAL_BOND, face 500000.00, market_value 520000.00: round(520000 * 0.95) = 494000.00, under the face cap"
      - "COLLATERAL, REAL_PROPERTY, face 500000.00, market_value 600000.00: round(600000 * 0.70) = 420000.00"
      - "COLLATERAL, US_TREASURY, face 500000.00, market_value 620000.00: round(620000 * 1.00) = 620000.00 capped by face to 500000.00"

  - name: operator_self_bond_capacity
    entity: Operator
    field: self_bond_capacity_amount
    algorithm_type: threshold
    variants:
      - variant: NET_WORTH_TEST
        when: "operator.elected_financial_test == NET_WORTH_TEST"
      - variant: FIXED_ASSET_TEST
        when: "operator.elected_financial_test == FIXED_ASSET_TEST"
    inputs: ["operator.tangible_net_worth", "operator.fixed_assets_in_state", "operator.total_liabilities", "operator.net_income_prior_year", "operator.elected_financial_test"]
    formula: |
      leverage_ok = tangible_net_worth >= round(total_liabilities * SELF_BOND_MIN_TNW_RATIO, 2)
      profit_ok   = net_income_prior_year > 0

      NET_WORTH_TEST:
        passes  = leverage_ok AND profit_ok AND tangible_net_worth >= SELF_BOND_MIN_TNW
        capacity = round(tangible_net_worth * NET_WORTH_CAPACITY_RATE, 2) when passes else 0.00
      FIXED_ASSET_TEST:
        passes  = leverage_ok AND profit_ok AND fixed_assets_in_state >= SELF_BOND_MIN_FIXED_ASSETS
        capacity = round(fixed_assets_in_state * FIXED_ASSET_CAPACITY_RATE, 2) when passes else 0.00

      self_bond_status = QUALIFIED when passes else FAILED
      # The leverage comparison is >= on the ROUNDED product; the rounding is
      # load-bearing at the boundary.
    constants:
      SELF_BOND_MIN_TNW: 10000000.00
      SELF_BOND_MIN_TNW_RATIO: 2.5
      NET_WORTH_CAPACITY_RATE: 0.25
      SELF_BOND_MIN_FIXED_ASSETS: 20000000.00
      FIXED_ASSET_CAPACITY_RATE: 0.10
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers: ["POST /mining/operators/{id}/financial-test"]
    worked_examples:
      - "NET_WORTH_TEST, TNW 40000000.00, liabilities 8000000.00, net income 2500000.00: threshold 20000000.00 met, QUALIFIED, capacity 10000000.00"
      - "NET_WORTH_TEST at the boundary, TNW 10000000.00, liabilities 4000000.00: round(4000000 * 2.5) = 10000000.00, TNW >= threshold with equality, QUALIFIED, capacity 2500000.00"
      - "NET_WORTH_TEST one cent over, TNW 10000000.00, liabilities 4000000.01: round(4000000.01 * 2.5) = 10000000.03 > TNW, FAILED, capacity 0.00"
      - "same operator, TNW 24000000.00 and fixed_assets_in_state 30000000.00, liabilities 9600000.00: NET_WORTH_TEST capacity 6000000.00 vs FIXED_ASSET_TEST capacity 3000000.00"

  - name: bond_release_amount
    entity: BondReleaseApplication
    field: requested_amount
    algorithm_type: waterfall_allocation
    inputs:
      - "application.phase, application.acres_requested"
      - "permit.bond_required_amount, permit.bond_held_amount, permit.disturbed_acres"
    formula: |
      per_acre_bond   = round(permit.bond_required_amount / permit.disturbed_acres, 2)
      eligible        = round(per_acre_bond * application.acres_requested
                              * PHASE_RELEASE_PCT[application.phase], 2)
      retention_floor = max(round(permit.bond_required_amount
                                  * PHASE_RETENTION_RATE[application.phase], 2),
                            STATUTORY_MINIMUM_BOND)
      available       = max(round(permit.bond_held_amount - retention_floor, 2), 0)
      requested_amount = min(eligible, available)
      # The retention floor is a hard waterfall boundary: the held bond drains down
      # to the floor and no further, so a phase whose eligible amount exceeds the
      # remaining headroom is clipped rather than rejected.
    constants:
      PHASE_RELEASE_PCT: { PHASE_I: 0.60, PHASE_II: 0.25, PHASE_III: 0.15 }
      PHASE_RETENTION_RATE: { PHASE_I: 0.40, PHASE_II: 0.15, PHASE_III: 0.00 }
      STATUTORY_MINIMUM_BOND: 10000.00
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers:
      - "POST /mining/bond-release-applications (at creation)"
      - "POST /mining/bond-release-applications/{id}/reinstate (recomputed against the permit's current figures)"
    worked_examples:
      - "bond_required 865998.00, disturbed_acres 120, per_acre_bond 7216.65; PHASE_I, 30 acres, bond_held 900000.00: eligible 129899.70, retention_floor 346399.20, available 553600.80, requested 129899.70"
      - "PHASE_II, 30 acres, bond_held 770100.30: eligible round(216499.50 * 0.25) = 54124.88 (half-up on 54124.875), retention_floor 129899.70, available 640200.60, requested 54124.88"
      - "PHASE_III, 30 acres, bond_held 900000.00: retention_floor max(0.00, 10000.00) = 10000.00, available 890000.00, requested 32474.93"
      - "PHASE_I, 100 acres, bond_held 900000.00: eligible 432999.00 exceeds available 553600.80? no — but PHASE_I with 130 acres yields eligible 562898.70 which is clipped to available 553600.80"

  - name: penalty_assessment_amount
    entity: ViolationNotice
    field: penalty_amount
    algorithm_type: tiered_pricing
    inputs: ["notice.total_points", "notice.good_faith_level (supplied on the assess-penalty call)", "notice.violation_class"]
    formula: |
      base            = round(notice.total_points * DOLLARS_PER_POINT, 2)
      good_faith_rate = GOOD_FAITH_RATE[notice.good_faith_level]
      credit_cap      = 1500.00 when base > 3000.00
                        else 750.00 when base > 1500.00
                        else 0.00                              # band keyed on BASE
      credit          = min(round(base * good_faith_rate, 2), credit_cap)
      subtotal        = round(base - credit, 2)
      surcharge_rate  = 0.00 when notice.violation_class != IMMINENT_HARM
                        else 0.25 when subtotal > 5000.00
                        else 0.10 when subtotal > 2000.00
                        else 0.00                              # band keyed on SUBTOTAL, not base
      surcharge       = round(subtotal * surcharge_rate, 2)
      penalty_amount  = max(round(subtotal + surcharge, 2), MINIMUM_PENALTY)
      # Two independently keyed bands: the good-faith credit cap is keyed on BASE
      # while the imminent-harm surcharge is keyed on the POST-CREDIT SUBTOTAL.
      # Keying the surcharge on base instead flips the band for any notice whose
      # credit carries it across 5000.00.
    constants:
      DOLLARS_PER_POINT: 60.00
      GOOD_FAITH_RATE: { RAPID: 0.30, PARTIAL: 0.10, NONE: 0.00 }
      CREDIT_CAP_HIGH: 1500.00
      CREDIT_CAP_HIGH_BASE_THRESHOLD: 3000.00
      CREDIT_CAP_LOW: 750.00
      CREDIT_CAP_LOW_BASE_THRESHOLD: 1500.00
      IMMINENT_HARM_SURCHARGE_HIGH: 0.25
      IMMINENT_HARM_SURCHARGE_HIGH_THRESHOLD: 5000.00
      IMMINENT_HARM_SURCHARGE_LOW: 0.10
      IMMINENT_HARM_SURCHARGE_LOW_THRESHOLD: 2000.00
      MINIMUM_PENALTY: 750.00
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers: ["POST /mining/violation-notices/{id}/assess-penalty (penalty_amount is frozen at assessment; a vacate zeroes it)"]
    worked_examples:
      - "85 points, RAPID, IMMINENT_HARM: base 5100.00, credit_cap 1500.00, credit 1500.00, subtotal 3600.00, surcharge_rate 0.10, surcharge 360.00, penalty 3960.00 (keying the surcharge on base 5100.00 would give 4500.00)"
      - "85 points, NONE, IMMINENT_HARM: base 5100.00, credit 0.00, subtotal 5100.00, surcharge_rate 0.25, surcharge 1275.00, penalty 6375.00"
      - "45 points, PARTIAL, NON_COMPLIANCE: base 2700.00, credit_cap 750.00, credit 270.00, subtotal 2430.00, no surcharge, penalty 2430.00"
      - "10 points, NONE, NON_COMPLIANCE: base 600.00, subtotal 600.00, penalty floored to 750.00"

  - name: violation_history_points
    entity: ViolationNotice
    field: total_points
    algorithm_type: chronological
    inputs:
      - "the request's severity_points, negligence_points and duration_points"
      - "every other ViolationNotice whose permit.operator_id equals this notice's operator, ordered by created_at ascending"
      - "the logical clock's current UTC instant"
    formula: |
      prior_count    = count of ViolationNotice rows where
                         permit.operator_id == this notice's operator
                         AND notice_status != VACATED
                         AND created_at >= clock_now - HISTORY_LOOKBACK_DAYS
                         AND the row is not this notice
      history_points = min(prior_count * HISTORY_POINTS_PER_PRIOR, HISTORY_POINTS_CAP)
      total_points   = min(severity_points + negligence_points + duration_points
                           + history_points, TOTAL_POINTS_CAP)
      # History is counted across ALL of the operator's permits, not just this
      # permit, and a VACATED notice is excluded from the count for notices
      # created after the vacate.
    constants:
      HISTORY_LOOKBACK_DAYS: 365
      HISTORY_POINTS_PER_PRIOR: 2
      HISTORY_POINTS_CAP: 10
      TOTAL_POINTS_CAP: 100
      CESSATION_POINTS_THRESHOLD: 70
    precision: "integer arithmetic; no rounding"
    recompute_triggers: ["POST /mining/violation-notices (total_points is frozen at creation)"]
    worked_examples:
      - "severity 30, negligence 30, duration 25, no priors: total_points 85, at or above CESSATION_POINTS_THRESHOLD"
      - "severity 20, negligence 15, duration 10, no priors: total_points 45, below the cessation threshold"
      - "severity 30, negligence 30, duration 25 with 3 prior non-vacated notices on a second permit of the same operator: history_points 6, total_points 91"
      - "severity 30, negligence 30, duration 25 with 6 prior notices: history_points capped at 10, total_points 95"

  - name: permit_compliance_posture
    entity: Permit
    field: compliance_posture
    algorithm_type: constraint_propagation
    inputs:
      - "every ForfeitureProceeding with permit_id == permit.id"
      - "every ViolationNotice with permit_id == permit.id (field notice_status)"
      - "permit.bond_required_amount, permit.bond_held_amount"
    formula: |
      bond_deficiency_amount = max(round(permit.bond_required_amount
                                         - permit.bond_held_amount, 2), 0)

      compliance_posture = first matching band, in this order:
        1. FORFEITURE_PENDING  when any ForfeitureProceeding exists for the permit
        2. CESSATION           when any notice has notice_status == CESSATION_ORDERED
        3. BOND_DEFICIENT      when bond_deficiency_amount > 0
        4. NOTICE_ACTIVE       when any notice has notice_status == ISSUED
        5. COMPLIANT           otherwise

      Propagation: whenever the recomputed posture lands in
      {CESSATION, BOND_DEFICIENT, FORFEITURE_PENDING}, every
      BondReleaseApplication on the permit with status IN {SUBMITTED,
      PUBLIC_NOTICE} is driven to SUSPENDED (clearing its notice window when it
      was in PUBLIC_NOTICE), and permit.last_notice_end_date is recomputed as the
      maximum notice_end_date still held by a non-suspended application (null when
      none remains). The propagation reaches its fixed point in one pass: a
      SUSPENDED application has no further downstream effect.
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP for bond_deficiency_amount"
    recompute_triggers:
      - "POST /mining/permits/{id}/decide, /recalculate-bond, /cease-mining"
      - "POST /mining/reclamation-cost-estimates/{id}/accept"
      - "POST /mining/bond-instruments/{id}/accept"
      - "POST /mining/bond-release-applications/{id}/decide and /rescind"
      - "POST /mining/violation-notices, /{id}/order-cessation, /{id}/abate, /{id}/vacate"
      - "POST /mining/permit-revisions/{id}/decide with decision == APPROVE"
      - "POST /mining/forfeiture-proceedings and /{id}/finalize"
    worked_examples:
      - "bond_required 865998.00, bond_held 900000.00, one ISSUED notice, no proceeding: deficiency 0.00, posture NOTICE_ACTIVE"
      - "bond_required 918737.40, bond_held 900000.00, one ISSUED notice: deficiency 18737.40, posture BOND_DEFICIENT (band 3 outranks band 4)"
      - "bond_required 918737.40, bond_held 900000.00, one CESSATION_ORDERED notice: posture CESSATION (band 2 outranks band 3)"

  - name: legacy_priority_score
    entity: MineSite
    field: legacy_priority_score
    algorithm_type: weighted_scoring
    inputs: ["mine_site.hazard_class", "mine_site.public_safety_score", "mine_site.water_quality_score", "mine_site.acres_affected"]
    formula: |
      acre_points = min(round(acres_affected * ACRE_POINT_RATE, 2), ACRE_POINTS_CAP)
      score       = min(round(HAZARD_WEIGHT[hazard_class]
                              + public_safety_score * PUBLIC_SAFETY_WEIGHT
                              + water_quality_score * WATER_QUALITY_WEIGHT
                              + acre_points, 2),
                        SCORE_CAP)

      Funding queue order over MineSite rows with site_class == ABANDONED_LEGACY
      AND funding_status == NOMINATED:
        legacy_priority_score DESC,
        then unfunded_reclamation_need DESC,
        then created_at ASC
      POST /mining/mine-sites/{id}/award-legacy-funding is only permitted on the
      head of that queue, and the cumulative award across all sites may not exceed
      LEGACY_FUND_ANNUAL_CAP.
    constants:
      HAZARD_WEIGHT: { H1_EXTREME: 50, H2_HIGH: 30, H3_MODERATE: 15 }
      PUBLIC_SAFETY_WEIGHT: 0.30
      WATER_QUALITY_WEIGHT: 0.20
      ACRE_POINT_RATE: 0.05
      ACRE_POINTS_CAP: 15
      SCORE_CAP: 100.00
      LEGACY_FUND_ANNUAL_CAP: 5000000.00
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers:
      - "POST /mining/mine-sites/{id}/nominate-legacy"
      - "POST /mining/forfeiture-proceedings/{id}/record-state-reclamation with completion_pct == 100 and a remaining deficiency"
    worked_examples:
      - "H1_EXTREME, public_safety 80, water_quality 60, acres_affected 90: 50 + 24.00 + 12.00 + 4.50 = 90.50"
      - "H2_HIGH, public_safety 50, water_quality 40, acres_affected 200: 30 + 15.00 + 8.00 + min(10.00, 15) = 63.00"
      - "H3_MODERATE, public_safety 20, water_quality 10, acres_affected 50: 15 + 6.00 + 2.00 + 2.50 = 25.50"
      - "H1_EXTREME, public_safety 100, water_quality 100, acres_affected 300: 50 + 30.00 + 20.00 + 15 = 115.00 capped to 100.00"

  - name: forfeiture_settlement
    entity: ForfeitureProceeding
    field: deficiency_amount
    algorithm_type: aggregation
    inputs: ["permit.bond_held_amount at the moment of finalization", "proceeding.state_reclamation_cost_estimate", "proceeding.actual_cost_incurred"]
    formula: |
      finalization stage (INITIATED|CONTESTED -> FINAL):
        forfeited_bond_amount = permit.bond_held_amount as observed before the
                                permit transitions to FORFEITED
        deficiency_amount     = max(round(state_reclamation_cost_estimate
                                          - forfeited_bond_amount, 2), 0)
        surplus_amount        = 0.00

      completion stage (FINAL -> COMPLETED, completion_pct == 100):
        deficiency_amount = max(round(actual_cost_incurred
                                      - forfeited_bond_amount, 2), 0)
        surplus_amount    = max(round(forfeited_bond_amount
                                      - actual_cost_incurred, 2), 0)
        # deficiency_amount and surplus_amount are mutually exclusive: at most one
        # is non-zero, and their difference always reconciles to
        # actual_cost_incurred - forfeited_bond_amount.
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP"
    recompute_triggers:
      - "POST /mining/forfeiture-proceedings/{id}/finalize"
      - "POST /mining/forfeiture-proceedings/{id}/record-state-reclamation"
    worked_examples:
      - "forfeited_bond_amount 900000.00, state estimate 1200000.00: deficiency 300000.00, surplus 0.00"
      - "same proceeding completed with actual_cost_incurred 780000.00: deficiency 0.00, surplus 120000.00, and operator.refund_due_amount rises by 120000.00"
      - "same proceeding completed with actual_cost_incurred 1050000.00: deficiency 150000.00, surplus 0.00, and the MineSite is reclassified ABANDONED_LEGACY with unfunded_reclamation_need 150000.00"

# =============================================================================
# 1.4 Validation Rules (evaluated in strict ascending priority; the first
#     violated rule short-circuits the request and is the only error returned)
# =============================================================================
validations:
  - priority: 1
    category: auth
    applies_to: "every endpoint"
    rule: "X-Role and X-User-ID request headers must both be present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401

  - priority: 2
    category: role
    applies_to: "every endpoint"
    rule: "X-Role must appear in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  - priority: 3
    category: schema
    applies_to: "every endpoint with a request body or query parameters"
    rule: |
      Every required body field is present; every field has the declared type;
      enums are members of their declared value set; numeric constraints in §1.1
      hold (acreages and money > 0 or >= 0 as declared, scores within 0..100,
      duration_hours > 0, completion_pct within 0..100, limit within 1..100,
      offset >= 0); ISO-8601 date and timestamp strings parse.
    error_id: ERR_INVALID_REQUEST
    http_status: 422

  - priority: 4
    category: existence
    applies_to: "every endpoint with a path {id}"
    rule: "The path id must resolve to a stored row of the addressed entity"
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_MINE_SITE_NOT_FOUND | ERR_INSPECTOR_PROFILE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_ESTIMATE_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_RELEASE_APPLICATION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_VIOLATION_NOTICE_NOT_FOUND | ERR_REVISION_NOT_FOUND | ERR_PROCEEDING_NOT_FOUND"
    http_status: 404

  - priority: 5
    category: existence
    applies_to: "every endpoint carrying an FK in its request body"
    rule: |
      Each FK in the body must resolve: permit_id, operator_id, mine_site_id,
      inspector_id, inspection_id, replaces_instrument_id.
    error_id: "the addressed entity's NOT_FOUND code (e.g. ERR_PERMIT_NOT_FOUND for permit_id)"
    http_status: 404

  - priority: 6
    category: ownership
    applies_to: "POST /mining/permits, POST /mining/reclamation-cost-estimates, POST /mining/bond-instruments, POST /mining/bond-release-applications, POST /mining/permit-revisions, POST /mining/permits/{id}/cease-mining, PATCH /mining/permits/{id}/disturbance, POST /mining/permit-revisions/{id}/resubmit, POST /mining/violation-notices/{id}/abate, POST /mining/violation-notices/{id}/pay-penalty, POST /mining/forfeiture-proceedings/{id}/contest"
    rule: "For X-Role == Operator, X-User-ID must equal the operator_id of the permit the request targets (or the operator_id in the body for permit creation)"
    error_id: ERR_NOT_PERMIT_OPERATOR
    http_status: 403

  - priority: 6
    category: ownership
    applies_to: "POST /mining/inspections/{id}/record-result, POST /mining/violation-notices"
    rule: "For X-Role == Inspector, X-User-ID must equal inspection.inspector_id of the addressed (or cited) inspection"
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403

  - priority: 7
    category: segregation_of_duties
    applies_to: "POST /mining/bond-release-applications/{id}/decide"
    rule: |
      X-User-ID must differ from BondInstrument.accepted_by_user_id for every
      instrument on the application's permit with status == ACCEPTED. The
      specialist who accepted the bond cannot decide its release.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409

  - priority: 8
    category: occ
    applies_to: "POST /mining/reclamation-cost-estimates/{id}/accept, POST /mining/permits/{id}/recalculate-bond"
    rule: "expected_permit_version must equal the current Permit.version (see §1.2.1)"
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

  - priority: 9
    category: state
    applies_to: "every action endpoint"
    rule: |
      The addressed entity's own current state must admit the requested
      transition per §1.2. Terminal states admit nothing.
    error_id: "ERR_PERMIT_STATE_INVALID | ERR_ESTIMATE_STATE_INVALID | ERR_INSTRUMENT_STATE_INVALID | ERR_RELEASE_STATE_INVALID | ERR_INSPECTION_STATE_INVALID | ERR_NOTICE_STATE_INVALID | ERR_PENALTY_STATE_INVALID | ERR_REVISION_STATE_INVALID | ERR_PROCEEDING_STATE_INVALID | ERR_SITE_FUNDING_STATE_INVALID"
    http_status: 409

  - priority: 10
    category: cross_entity_state
    applies_to: "POST /mining/permits (creation)"
    rule: "operator.registry_status must be ACTIVE"
    error_id: ERR_OPERATOR_DISQUALIFIED
    http_status: 409

  - priority: 10
    category: cross_entity_state
    applies_to: "POST /mining/reclamation-cost-estimates/{id}/accept, POST /mining/bond-instruments/{id}/accept, POST /mining/bond-instruments (creation), POST /mining/bond-release-applications (creation), POST /mining/permit-revisions (creation), POST /mining/inspections (creation)"
    rule: "permit.status must be in the set the child operation admits: {APPLICATION_SUBMITTED, ISSUED, RECLAMATION_PHASE} for estimates, instruments and inspections; {ISSUED, RECLAMATION_PHASE} for release applications and revisions"
    error_id: ERR_PERMIT_STATE_INVALID
    http_status: 409

  - priority: 10
    category: cross_entity_state
    applies_to: "POST /mining/bond-release-applications/{id}/decide"
    rule: |
      The cited inspection_id must reference an Inspection whose permit_id
      equals the application's permit_id, whose inspection_type is RELEASE,
      whose status is COMPLETED, and — for decision == APPROVE — whose result
      is PASS.
    error_id: ERR_INSPECTION_NOT_ELIGIBLE
    http_status: 409

  - priority: 10
    category: cross_entity_state
    applies_to: "POST /mining/violation-notices (creation)"
    rule: "The cited inspection must have status == COMPLETED and result == VIOLATIONS_FOUND"
    error_id: ERR_INSPECTION_NOT_ELIGIBLE
    http_status: 409

  - priority: 10
    category: cross_entity_state
    applies_to: "POST /mining/forfeiture-proceedings (creation)"
    rule: "No other ForfeitureProceeding may already exist for the permit"
    error_id: ERR_PERMIT_HAS_OPEN_PROCEEDING
    http_status: 409

  - priority: 11
    category: business_safety
    applies_to: "POST /mining/bond-release-applications/{id}/decide"
    rule: |
      No ViolationNotice on the application's permit may be in notice_status IN
      {ISSUED, CESSATION_ORDERED}. Public money cannot be returned while an
      unabated violation stands, and this outranks the notice-period timing
      check at priority 12: when an application is still inside its public
      notice window AND carries an unabated violation, the violation is the
      reported error.
    error_id: ERR_UNABATED_VIOLATION
    http_status: 409

  - priority: 11
    category: business_safety
    applies_to: "POST /mining/bond-release-applications/{id}/publish-notice, POST /mining/bond-release-applications/{id}/reinstate, POST /mining/permit-revisions/{id}/decide with decision == APPROVE"
    rule: "permit.compliance_posture must be in {COMPLIANT, NOTICE_ACTIVE}"
    error_id: ERR_PERMIT_NOT_COMPLIANT
    http_status: 409

  - priority: 11
    category: business_safety
    applies_to: "POST /mining/permits/{id}/decide with decision == ISSUE"
    rule: "An ACCEPTED ReclamationCostEstimate must exist for the permit"
    error_id: ERR_NO_ACCEPTED_ESTIMATE
    http_status: 409

  - priority: 11
    category: business_safety
    applies_to: "POST /mining/violation-notices/{id}/order-cessation"
    rule: |
      At least one cessation criterion must hold: total_points >=
      CESSATION_POINTS_THRESHOLD (70), or the logical clock is past
      abatement_deadline, or violation_class == IMMINENT_HARM.
    error_id: ERR_CESSATION_CRITERIA_NOT_MET
    http_status: 409

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/bond-release-applications/{id}/decide"
    rule: "The logical clock's current instant must be strictly after application.notice_end_date"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/bond-release-applications/{id}/rescind"
    rule: "The logical clock's current instant must be at or before approved_at + RESCISSION_WINDOW_DAYS (60)"
    error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/forfeiture-proceedings/{id}/contest"
    rule: "The logical clock's current instant must be at or before proceeding.contest_deadline"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 409

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/forfeiture-proceedings/{id}/finalize"
    rule: "The logical clock's current instant must be strictly after proceeding.contest_deadline"
    error_id: ERR_CONTEST_WINDOW_OPEN
    http_status: 409

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/reclamation-cost-estimates/{id}/accept"
    rule: "estimate_effective_date must be no more than ESTIMATE_MAX_AGE_DAYS (1095) before the logical clock's current instant"
    error_id: ERR_ESTIMATE_EXPIRED
    http_status: 422

  - priority: 12
    category: business_temporal
    applies_to: "POST /mining/reclamation-cost-estimates (creation)"
    rule: "estimate_effective_date must not be after the logical clock's current instant"
    error_id: ERR_ESTIMATE_DATE_IN_FUTURE
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/permits/{id}/decide, POST /mining/permit-revisions/{id}/decide, POST /mining/bond-release-applications/{id}/decide"
    rule: "When decision == DENY, denial_reason must be present and non-empty; when decision != DENY, denial_reason must be absent"
    error_id: ERR_DECISION_REASON_REQUIRED
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/bond-instruments (creation)"
    rule: |
      Type-conditional body shape: SURETY requires surety_company_name and
      surety_naic_rating; COLLATERAL requires collateral_type and
      collateral_market_value; CASH and SELF_BOND require neither group and
      reject both.
    error_id: ERR_COLLATERAL_DETAILS_REQUIRED
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/bond-instruments/{id}/accept"
    rule: "For instrument_type == SURETY, surety_naic_rating must be in {A_PLUS_PLUS, A_PLUS, A, B_PLUS_PLUS}"
    error_id: ERR_SURETY_RATING_INELIGIBLE
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/permit-revisions (creation)"
    rule: |
      Type-conditional body shape: EXPANSION requires acreage_delta > 0 and
      rejects new_post_mining_land_use; PMLU_CHANGE requires
      new_post_mining_land_use and rejects acreage_delta; SEQUENCE_CHANGE
      requires sequence_note and rejects both.
    error_id: ERR_REVISION_FIELDS_MISMATCH
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/permit-revisions/{id}/resubmit"
    rule: "revision.round_count must be strictly below REVISION_ROUND_CAP (2)"
    error_id: ERR_REVISION_ROUND_LIMIT
    http_status: 409

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/bond-release-applications (creation)"
    rule: |
      acres_requested plus the permit's already-released acreage for the
      requested phase must not exceed permit.disturbed_acres.
    error_id: ERR_ACRES_EXCEED_DISTURBED
    http_status: 422

  - priority: 13
    category: business_constraint
    applies_to: "POST /mining/violation-notices/{id}/pay-penalty"
    rule: "amount_paid must equal notice.penalty_amount exactly"
    error_id: ERR_PENALTY_AMOUNT_MISMATCH
    http_status: 422

  - priority: 14
    category: business_referential
    applies_to: "POST /mining/bond-instruments/{id}/accept"
    rule: |
      When replaces_instrument_id is set, the referenced instrument must belong
      to the same permit and be in status IN {ACCEPTED, SUBSTITUTION_REQUIRED},
      and it must not already be the target of another accepted substitution.
    error_id: ERR_SUBSTITUTION_TARGET_INVALID
    http_status: 409

  - priority: 14
    category: business_referential
    applies_to: "POST /mining/bond-instruments/{id}/accept"
    rule: "For instrument_type == SELF_BOND, operator.self_bond_status must be QUALIFIED"
    error_id: ERR_SELF_BOND_NOT_QUALIFIED
    http_status: 409

  - priority: 14
    category: business_referential
    applies_to: "POST /mining/bond-release-applications/{id}/decide with decision == APPROVE"
    rule: "application.objection_count must be 0 or application.objections_resolved must be true"
    error_id: ERR_OBJECTIONS_UNRESOLVED
    http_status: 409

  - priority: 14
    category: business_referential
    applies_to: "POST /mining/mine-sites/{id}/award-legacy-funding"
    rule: "The addressed site must be the head of the funding queue ordered by legacy_priority_score DESC, unfunded_reclamation_need DESC, created_at ASC"
    error_id: ERR_FUNDING_QUEUE_ORDER
    http_status: 409

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/permits/{id}/decide with decision == ISSUE"
    rule: "permit.bond_held_amount must be at least permit.bond_required_amount"
    error_id: ERR_BOND_BELOW_REQUIRED
    http_status: 409

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/bond-instruments/{id}/accept"
    rule: |
      For instrument_type == SELF_BOND, face_amount must not exceed
      operator.self_bond_capacity_amount - operator.self_bond_exposure_amount.
    error_id: ERR_SELF_BOND_CAPACITY_EXCEEDED
    http_status: 409

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/bond-release-applications/{id}/decide with decision == APPROVE"
    rule: |
      application.requested_amount must not exceed
      permit.bond_held_amount - the phase retention floor from
      calculations.bond_release_amount, recomputed at decision time.
    error_id: ERR_RELEASE_EXCEEDS_AVAILABLE
    http_status: 422

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/bond-release-applications/{id}/publish-notice"
    rule: |
      Resource-temporal exclusion on the permit's public notice windows: the new
      window [now, now + PUBLIC_NOTICE_DAYS] must not fall within
      NOTICE_GAP_DAYS (15) of the notice_end_date of any other application on
      the same permit whose status is PUBLIC_NOTICE or APPROVED. Treated as a
      closed interval — a new window starting exactly NOTICE_GAP_DAYS after a
      prior window's end is permitted; one day earlier is not.
    error_id: ERR_NOTICE_WINDOW_CONFLICT
    http_status: 409

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/inspections (creation)"
    rule: |
      Resource-temporal exclusion on an inspector's calendar: the requested
      [scheduled_start, scheduled_start + duration_hours] interval must not
      overlap the interval of any other Inspection with the same inspector_id
      and status == SCHEDULED. Endpoint-to-endpoint abutment (one interval's end
      equal to the other's start) is permitted.
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409

  - priority: 15
    category: business_fiscal
    applies_to: "POST /mining/mine-sites/{id}/award-legacy-funding"
    rule: "The cumulative awarded_funding_amount across all sites plus award_amount must not exceed LEGACY_FUND_ANNUAL_CAP (5000000.00)"
    error_id: ERR_LEGACY_FUND_CAP_EXCEEDED
    http_status: 409

# =============================================================================
# 1.5 API Endpoint Table
#   Every business collection lives directly under the /mining umbrella prefix.
#   Parent-scoped GETs exist purely for FK reverse reachability; no write is
#   addressed through a parent-nested id path.
# =============================================================================
endpoints:
  # ------------------------------------------------------------------ Operator
  - method: POST
    path: /mining/operators
    roles: [ProgramDirector]
    input: [legal_name, tangible_net_worth, fixed_assets_in_state, total_liabilities, net_income_prior_year, elected_financial_test]
    output: Operator
    side_effects: ["registry_status ACTIVE, self_bond_status UNTESTED, all computed ledgers 0"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /mining/operators/{id}
    roles: [Operator, PermitReviewer, BondSpecialist, Inspector, ProgramDirector, PublicParticipant]
    input: []
    output: Operator
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_OPERATOR_NOT_FOUND]

  - method: GET
    path: /mining/operators
    roles: [PermitReviewer, BondSpecialist, ProgramDirector, PublicParticipant]
    input: ["registry_status?", "self_bond_status?", "limit?", "offset?"]
    output: Operator[]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /mining/operators/{id}/financials
    roles: [ProgramDirector]
    input: ["tangible_net_worth?", "fixed_assets_in_state?", "total_liabilities?", "net_income_prior_year?", "elected_financial_test?"]
    output: Operator
    side_effects: ["self_bond_status reset to UNTESTED; self_bond_capacity_amount reset to 0.00"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_OPERATOR_NOT_FOUND, ERR_OPERATOR_DISQUALIFIED]

  - method: POST
    path: /mining/operators/{id}/financial-test
    roles: [BondSpecialist]
    input: []
    output: Operator
    side_effects: ["self_bond_status QUALIFIED or FAILED; self_bond_capacity_amount per calculations.operator_self_bond_capacity"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_OPERATOR_NOT_FOUND, ERR_OPERATOR_DISQUALIFIED]

  - method: GET
    path: /mining/operators/{id}/permits
    roles: [Operator, PermitReviewer, BondSpecialist, ProgramDirector, PublicParticipant]
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_OPERATOR_NOT_FOUND]

  # ------------------------------------------------------------------ MineSite
  - method: POST
    path: /mining/mine-sites
    roles: [ProgramDirector]
    input: [name, county, total_acres, "site_class?"]
    output: MineSite
    side_effects: ["funding_status NOT_APPLICABLE; legacy_priority_score 0"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /mining/mine-sites/{id}
    roles: [Operator, PermitReviewer, BondSpecialist, Inspector, ProgramDirector, PublicParticipant]
    input: []
    output: MineSite
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_MINE_SITE_NOT_FOUND]

  - method: GET
    path: /mining/mine-sites
    roles: [Operator, PermitReviewer, BondSpecialist, Inspector, ProgramDirector, PublicParticipant]
    input: ["site_class?", "funding_status?", "county?", "hazard_class?", "limit?", "offset?"]
    output: MineSite[]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /mining/mine-sites/{id}/nominate-legacy
    roles: [ProgramDirector]
    input: [hazard_class, public_safety_score, water_quality_score, acres_affected, unfunded_reclamation_need]
    output: MineSite
    side_effects: ["site_class ABANDONED_LEGACY; legacy_priority_score computed; funding_status NOMINATED"]
