            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advR}", name: "cR1", budget_cents: 1000000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advR}"
              captures: { cR1: $.data.id }
            - call: "POST /ad-campaigns/${cR1}/activate"
