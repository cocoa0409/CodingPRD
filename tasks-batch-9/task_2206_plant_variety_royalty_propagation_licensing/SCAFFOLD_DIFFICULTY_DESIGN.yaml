  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_quota_state_check_outranks_tag_unit_ceiling_check
        grounds:
          - validations[priority=10]
          - validations[priority=36]
          - errors.ERR_QUOTA_FROZEN
          - errors.ERR_QUOTA_UNITS_EXCEEDED
          - endpoints[POST /tag-orders/{tag_order_id}/issue]
        distinguishing_aspect: |
          Category pair `state` (priority 10) versus `business_fiscal`
          (priority 36) on POST /tag-orders/{tag_order_id}/issue. The request
          violates BOTH: the quota was frozen by the agreement suspension AND
          requested_units 5000 exceeds units_available 1000. Only the state
          verdict may surface. The intervening `business_safety` rule at
          priority 11 is violated too, which is why the expected code is the
          lowest-priority-number one of the three.
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B PropagatorAgreement for US-WA."
            - "One ACTIVE ProductionQuota with allocated_units 1000 - deliberately small."
            - "One TagOrder REQUESTED for 5000 units. Creation is legal because the unit ceiling is only checked at issue time."
            - "The agreement is then suspended manually, which freezes the quota."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Tin Roof Plum", species: "Prunus domestica", breeder_code: "TP", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Tinroof Propagators", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 1000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id, q_ver: $.data.version }
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 5000, expected_quota_version: "${q_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { t_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/suspend"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /tag-orders/${t_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "Before the trigger: ProductionQuota.${q_id}.status == FROZEN, units_available == 1000, TagOrder.${t_id}.requested_units == 5000, so both rules are genuinely violated"
            - "The trigger returns 409 with data.error_id == ERR_QUOTA_FROZEN"
            - "The trigger does NOT return ERR_QUOTA_UNITS_EXCEEDED (422) and does NOT return ERR_AGREEMENT_NOT_ACTIVE (409)"
            - "TagOrder.${t_id}.status is still REQUESTED and ProductionQuota.${q_id}.tags_committed_units == 0 - a rejected request writes nothing"
            - "After POST /propagator-agreements/${a_id}/reinstate thaws the quota, the same POST /tag-orders/${t_id}/issue returns 422 with data.error_id == ERR_QUOTA_UNITS_EXCEEDED, proving the second rule was masked and not absent"

      - name: agreement_activity_safety_check_outranks_quota_agreement_referential_check
        grounds:
          - validations[priority=11]
          - validations[priority=18]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - errors.ERR_QUOTA_AGREEMENT_MISMATCH
          - endpoints[POST /royalty-reports/{report_id}/line-items]
        distinguishing_aspect: |
          A different error-category pair on a different endpoint:
          `business_safety` (priority 11) versus `business_referential`
          (priority 18) on POST /royalty-reports/{report_id}/line-items. One
          propagator holds two agreements; the line item names a quota belonging
          to the OTHER agreement while the report's own agreement has been
          suspended, so both rules are violated and the safety verdict wins.
        test_recipe:
          setup:
            - "One Variety and one Propagator holding TWO countersigned agreements A1 (US-WA) and A2 (US-OR)."
            - "One ACTIVE ProductionQuota Q2 under A2, territory US-OR."
            - "One DRAFT RoyaltyReport R1 under A1, whose version is captured for the OCC guard."
            - "A1 is then suspended, so the report's governing agreement is no longer ACTIVE while Q2 remains ACTIVE under the untouched A2."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Slate Harvest", species: "Malus domestica", breeder_code: "SH", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Slatefield Nurseries", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a1_id: $.data.id }
            - call: "POST /propagator-agreements/${a1_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-OR"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a2_id: $.data.id }
            - call: "POST /propagator-agreements/${a2_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a2_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-OR", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q2_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a1_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r1_id: $.data.id, r1_ver: $.data.version }
            - call: "POST /propagator-agreements/${a1_id}/suspend"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /royalty-reports/${r1_id}/line-items"
              payload: { quota_id: "${q2_id}", reported_units: 500, expected_report_version: "${r1_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "Before the trigger: PropagatorAgreement.${a1_id}.status == SUSPENDED, PropagatorAgreement.${a2_id}.status == ACTIVE, ProductionQuota.${q2_id}.status == ACTIVE, and quota.agreement_id != report.agreement_id - so both rules are genuinely violated"
            - "The trigger returns 409 with data.error_id == ERR_AGREEMENT_NOT_ACTIVE"
            - "The trigger does NOT return ERR_QUOTA_AGREEMENT_MISMATCH (422) and does NOT return ERR_QUOTA_FROZEN (409), since Q2 was never frozen"
            - "No RoyaltyLineItem row exists for report ${r1_id} and RoyaltyReport.${r1_id}.version is unchanged"
            - "After POST /propagator-agreements/${a1_id}/reinstate, the identical call (with a freshly read expected_report_version) returns 422 with data.error_id == ERR_QUOTA_AGREEMENT_MISMATCH, proving the referential rule was masked and not absent"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: propagation_pass_rate_inclusive_at_exactly_four_decimal_threshold
        grounds:
          - calculations.trial_performance_index
          - state_machines.VarietyTrial.status.EVALUATED_to_PASSED
          - state_machines.VarietyTrial.status.EVALUATED_to_FAILED
          - entities.VarietyTrial.fields.propagation_pass_rate
          - entities.Variety.fields.regional_performance_index
        distinguishing_aspect: |
          A four-decimal numeric threshold on POST
          /variety-trials/{trial_id}/certify: MIN_PASS_RATE 0.9500 is INCLUSIVE,
          and the one-ten-thousandth step from 0.9500 to 0.9499 flips the fork
          twice over - the pass-rate gate fails AND the index it scales drops
          from 72.96 to 72.95, below RELEASE_MIN_INDEX 72.00's own companion
          check. The two trials sit at exactly the boundary and one step below.
        test_recipe:
          setup:
            - "One Variety with no protection filings."
            - "One TrialSite in region PNW with plot_capacity 100."
            - "Two VarietyTrials at that site, each plot_count 20, window [2026-08-05, 2026-09-20), so together they consume 40 of 100 plots."
            - "Both trials planted at 2026-08-05 and evaluated at 2026-09-20 with the SAME four component scores 82 / 74 / 78 / 68 (weighted sum exactly 76.80) and differing ONLY in propagation_pass_rate: 0.9500 on trial C and 0.9499 on trial D."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Northlight Pear", species: "Pyrus communis", breeder_code: "NP", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Okanogan Station", region_code: "PNW", plot_capacity: 100 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 20, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { trc_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 20, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { trd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${trc_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${trd_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${trc_id}/evaluate"
              payload: { yield_index: 82, vigor_score: 74, uniformity_score: 78, disease_resistance_score: 68, propagation_pass_rate: 0.9500 }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${trd_id}/evaluate"
              payload: { yield_index: 82, vigor_score: 74, uniformity_score: 78, disease_resistance_score: 68, propagation_pass_rate: 0.9499 }
              as: TrialCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /variety-trials/${trc_id}/certify"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /variety-trials/${trd_id}/certify"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "After evaluate: VarietyTrial.${trc_id}.performance_index == 72.96"
            - "After evaluate: VarietyTrial.${trd_id}.performance_index == 72.95"
            - "After the first certify: VarietyTrial.${trc_id}.status == PASSED (0.9500 is accepted AT the threshold)"
            - "After the first certify: Variety.${v_id}.passed_trial_region_count == 1 and regional_performance_index == 72.96"
            - "After the first certify: Variety.${v_id}.lifecycle_state == IN_TRIAL (one region is short of MIN_RELEASE_REGIONS 2)"
            - "After the second certify: VarietyTrial.${trd_id}.status == FAILED"
            - "After the second certify: Variety.${v_id}.passed_trial_region_count == 1 and regional_performance_index == 72.96 (the FAILED branch performs no variety recomputation)"
            - "POST /varieties/${v_id}/release returns ERR_RELEASE_CRITERIA_NOT_MET (422)"

      - name: empty_line_item_collection_blocks_report_submission
        grounds:
          - validations[priority=39]
          - errors.ERR_REPORT_HAS_NO_LINES
          - endpoints[POST /royalty-reports/{report_id}/submit]
          - state_machines.RoyaltyReport.review_status.DRAFT_to_SUBMITTED
          - calculations.royalty_report_totals
        distinguishing_aspect: |
          A different boundary KIND on a different endpoint: the zero-cardinality
          edge of a child collection rather than a numeric threshold. A DRAFT
          RoyaltyReport with exactly zero RoyaltyLineItem rows must be rejected
          on POST /royalty-reports/{report_id}/submit, because the aggregation
          would produce a 0 total indistinguishable from a genuine zero-production
          period; adding the FIRST line flips the same call to success.
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B PropagatorAgreement for US-WA, one ACTIVE ProductionQuota with allocated_units 20000 and no tag orders."
            - "One RoyaltyReport created and left in DRAFT with NO line items at all."
