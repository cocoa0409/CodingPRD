    roles: [CommercialSalesRep]
    code: 200
    input: ["expected_order_version", "expected_account_version"]
    output: PartOrder
    side_effects:
      - "superseded lines repointed to their terminal current part"
      - "unit_price_cents recomputed at the order's pricing band"
      - "the selected source's reserved_units and committed_units_today increased by the order's line quantities"
      - "promised_at, fulfillment_route, tier_discount_cents and delivery_fee_cents recomputed"
      - "status → CONFIRMED"

  - method: POST
    path: "/commercial/part-orders/{orderId}/allocate"
    description: "Allocate a confirmed order to its source slot"
    roles: [CommercialSalesRep]
    code: 200
    input: ["expected_order_version", "expected_account_version"]
    output: PartOrder
    side_effects: ["status → ALLOCATED", "tier_discount_cents recomputed at the order level", "promised_at recomputed"]

