        distinguishing_aspect: |
          This instance pins a FOUR-INPUT ORDERED CHAIN whose output is not a product of independent
          factors: from one plan (300 minutes) the allowance is 270 for BOTTOM gear on a MECHANICAL
          vessel at 24.0 C, 330 for the same gear and vessel at 22.0 C, and 240 for FLOATING_BAG gear on
