            - "default page: 2 elements, total_count == 2, has_more == false"
            - "array responses use response_type == array with meta.api_request_id present"

      - name: turns_filtered_by_unit_reverse_reachable
        claim_type: parent_relationships
        grounds: [entities.Turn.fields.unit_id, endpoints]
        distinguishing_aspect: "FK reverse-reachability: GET /turns?unit_id= returns exactly the turns opened on that unit (1 element), and the sub-resource GET /turns/{id}/inspections returns the submitted inspection (1 element)."
        test_recipe:
