              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00006" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 900000, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
