              as: MethodologyStatistician
              captures: { ti83a_id: "$.data.id" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt83t_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-04T01:00:00Z", end_iso: "2026-08-04T02:00:00Z", station_code: "WAAA", tuning_minutes: 60 }
              as: MethodologyStatistician
              captures: { ti83b_id: "$.data.id" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt83s_id}", source_methodology: "STREAMING_SDK", start_iso: "2026-08-04T03:00:00Z", end_iso: "2026-08-04T04:00:00Z", station_code: "WCCC", tuning_minutes: 45 }
              as: MethodologyStatistician
              captures: { ti83c_id: "$.data.id" }
          trigger:
            - call: "GET /tuning-intervals"
              payload: { household_id: "${h83_id}" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals"
              payload: { meter_id: "${mt83t_id}" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals"
              payload: { source_methodology: "STREAMING_SDK" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals"
              payload: { household_id: "${h83_id}", state: "RAW" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals"
              payload: { household_id: "${h83_id}", state: "EDITED" }
