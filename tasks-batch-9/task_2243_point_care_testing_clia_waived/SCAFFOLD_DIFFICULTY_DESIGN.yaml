              as_user_id: "${op_locked_id}"
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "${lot_status} == UNVERIFIED and ${locked_access} == LOCKED_OUT and ${locked_reason} == TRAINING_INCOMPLETE"
            - "HTTP status == 409"
            - "${error_id} == ERR_LOT_NOT_VERIFIED (priority 44 wins)"
            - "${error_id} != ERR_OPERATOR_ACCESS_LOCKED (priority 52 is also violated by the same request)"
            - "TestSite.${site_id}.held_result_count == 0 and Device.${dev1_id}.status == ACTIVE"
            - "ReagentLot.${lot1_id}.verification_status == UNVERIFIED (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: qc_control_value_exactly_at_upper_bound_passes_then_one_tenth_over_fails
        grounds:
          - calculations.qc_run_result
          - entities.QcRun.fields.expected_max
          - state_machines.Device.ACTIVE_to_QC_LOCKED_on_qc_fail
          - entities.ReagentLot.fields.control_max_level_1
        distinguishing_aspect: |
          measured_value 120.0 against control_max_level_1 120.0 is a PASS
          because the acceptable interval is closed at both ends, while 120.1
          - one tenth beyond - is a FAIL that locks the device; an
          implementation using a strict `<` upper comparison flips the first
          call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "One ACTIVE INTERFACED device with qc_frequency_days 30."
            - "One reagent lot with control_min_level_1 80.0 and control_max_level_1 120.0, left UNVERIFIED so both QC runs are evaluated against the lot's own stored range without any lot-state gate."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243015", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Boundary POCT", department_code: "DEPT-240", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0801", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-G1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 120.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { at_bound_result: $.data.result, at_bound_max: $.data.expected_max, at_bound_min: $.data.expected_min, at_bound_locked: $.data.locked_device }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 120.1 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { over_bound_result: $.data.result, over_bound_locked: $.data.locked_device }
          assert:
            - "${at_bound_result} == PASS with ${at_bound_min} == 80.0, ${at_bound_max} == 120.0 and ${at_bound_locked} == false"
            - "${over_bound_result} == FAIL and ${over_bound_locked} == true"
            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == QC_FAILURE"
            - "Device.${dev1_id}.last_two_level_qc_pass_on == null (no LEVEL_2 run was ever recorded)"
            - "ReagentLot.${lot1_id}.verification_status == UNVERIFIED (a single-level PASS does not verify a lot)"
            - "TestSite.${site_id}.held_result_count == 0"

      - name: pt_score_exactly_eighty_passes_and_seventy_nine_ninety_nine_fails
        grounds:
          - calculations.pt_event_outcome
          - state_machines.ProficiencyEvent.PENDING_to_PASSED
          - state_machines.ProficiencyEvent.PENDING_to_INVESTIGATION_OPEN
          - entities.ProficiencyEvent.fields.outcome
          - entities.ProficiencyEnrollment.fields.fail_count_last_three
        distinguishing_aspect: |
          A score of exactly 80.00 is a PASS (the acceptability threshold is
          inclusive) while 79.99 - one hundredth below - is a FAIL that opens
          an investigation; the two-decimal gap makes any float-truncating or
          strictly-greater comparison visible, and the readiness score moves
          from 100.00 to 97.00 as a result.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage, no devices, no operators, no deficiencies."
            - "One GLUCOSE PT enrollment for 2026 with two shipments PENDING (shipment 1 and shipment 2)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243016", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "PT Boundary POCT", department_code: "DEPT-250", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "NationalPT" }
              as: QualityCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev1_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_id}", shipment_number: 2, due_date: "2026-08-20" }
              as: QualityCoordinator
              captures: { ev2_id: $.data.id }
          trigger:
            - call: "POST /poct/pt-events/${ev1_id}/score"
              payload: { score_pct: 80.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
              captures: { pass_outcome: $.data.outcome, pass_status: $.data.status }
            - call: "POST /poct/pt-events/${ev2_id}/score"
              payload: { score_pct: 79.99, graded_on: "2026-08-01" }
              as: QualityCoordinator
              captures: { fail_outcome: $.data.outcome, fail_status: $.data.status }
            - call: "GET /poct/sites/${site_id}/readiness"
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { score: $.data.score, pp: $.data.pt_penalty }
          assert:
            - "${pass_outcome} == PASS and ${pass_status} == PASSED"
            - "${fail_outcome} == FAIL and ${fail_status} == INVESTIGATION_OPEN"
            - "ProficiencyEnrollment.${enr_id}.fail_count_last_three == 1"
            - "ProficiencyEnrollment.${enr_id}.status == ENROLLED (one failure of the last three is not unsuccessful participation)"
            - "ProficiencyEnrollment.${enr_id}.graded_event_count == 2"
            - "TestSite.${site_id}.pt_unsuccessful_count == 1"
            - "${pp} == 3.00 and ${score} == 97.00"

      - name: oversight_posture_walks_inclusive_weight_thresholds_six_and_sixteen
        grounds:
          - calculations.site_oversight_posture
          - calculations.deficiency_weight
          - entities.TestSite.fields.open_deficiency_weight
          - entities.TestSite.fields.oversight_posture
        distinguishing_aspect: |
          The site's open deficiency weight is walked to 3.00 (OPEN), then to
          exactly 6.00 (RESTRICTED - the RESTRICT threshold is inclusive), then
          to exactly 16.00 (SUSPENDED - the SUSPEND threshold is inclusive);
          both threshold hits land on the boundary value rather than past it,
          so a strict `>` comparison misclassifies both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and no other penalty inputs."
            - "Inspection A is issued with one STANDARD_LEVEL finding (weight 3.00), leaving W == 3.00 and posture OPEN."
            - "Inspection B is drafted with one STANDARD_LEVEL finding (weight 3.00) and Inspection C is drafted with one CONDITION_LEVEL finding plus two ADVISORY findings (weight 8.00 + 1.00 + 1.00 == 10.00); both are issued inside the trigger so the posture transitions are observed at each step."
