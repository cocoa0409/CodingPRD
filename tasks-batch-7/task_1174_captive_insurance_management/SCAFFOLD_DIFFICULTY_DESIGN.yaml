            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "Prop Prog R", line_of_business: "PROPERTY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, fronting_required: true, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting"
              payload: { fronting_carrier_name: "FrontCo R", fronting_fee_pct: 0.05, reinsurance_ceded_pct: 0.90 }
