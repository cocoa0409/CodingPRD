      - name: assign_coordinator_second_attempt_returns_referral_state_invalid
        claim_type: idempotency
        grounds:
          - state_machines.Referral[INTAKE -> EVALUATION_PENDING]
          - validations[priority 19 -> ERR_REFERRAL_STATE_INVALID]
          - endpoints[POST /ei/referrals/{referralId}/assign-coordinator]
        distinguishing_aspect: |
          Replaying the same trigger is an error, not a no-op and not a re-assignment: the second
          assign-coordinator call returns ERR_REFERRAL_STATE_INVALID (409) because EVALUATION_PENDING
          has no outgoing assign edge, and — critically — the coordinator's weighted points stay at
          1.50 rather than double-counting to 3.00.
        test_recipe:
          setup:
