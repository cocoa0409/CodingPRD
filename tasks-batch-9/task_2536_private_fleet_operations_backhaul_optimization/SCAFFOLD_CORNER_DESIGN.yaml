      - name: a_driver_on_coaching_hold_can_neither_drive_nor_bid_until_coached
        claim_type: Error triggerable
        grounds:
          - errors.ERR_DRIVER_COACHING_HOLD
          - calculations.driver_safety_score
          - validations[priority 11]
        distinguishing_aspect: "The hold is a computed consequence of open penalty points, and it is reported ahead of the safety-score threshold in the priority 11 order, so a driver at 64 points of score sees ERR_DRIVER_COACHING_HOLD rather than ERR_DRIVER_SAFETY_INELIGIBLE on both the assignment and the bid path. Coaching two of the three events retires 24 points and restores both privileges in the same breath."
