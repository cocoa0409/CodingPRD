scenario: |
  Generate task harder than expert level!

  2535. Marrow Donor Registry Search & Workup (national marrow donor program): patient HLA typing and preliminary registry search with match probability scoring, donor confirmatory typing request and response deadlines, donor availability, health screening and deferral handling, workup scheduling including physical, infectious disease testing and collection method decision, patient conditioning timeline dependency and donor backup identification, collection center scheduling and courier transport of the product, donor follow-up and adverse event tracking, international registry coordination and cost reimbursement

domain_name: marrow-donor-registry-search-workup
api_prefix: /registry

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every business resource lives at a top-level collection under /registry and is
  # linked by explicit FK body fields (patient_id, donor_id, workup_case_id, ...).
  # No business identity is expressed by URL nesting: nested GETs exist ONLY as
  # reverse-reachability read channels for cascade-created children.

  state_machine_shape: parallel
  # WorkupCase carries two independent state dimensions (clearance_status x
  # logistics_status) on the same row; SearchRequest is cyclic
  # (PRIMARY_ENGAGED -> BACKUP_REQUIRED -> PRIMARY_ENGAGED); MatchCandidate is
  # cyclic (TYPING_REQUESTED -> TYPING_EXPIRED -> TYPING_REQUESTED and
  # DEFERRED -> SCREENING_PASSED); Patient conditioning is branching with a
  # SCHEDULED -> SCHEDULED reschedule self-loop.

  relationship_patterns:
    - one_to_many          # SearchRequest -> MatchCandidate, WorkupCase -> ClearanceItem
    - cross_aggregate      # CollectionBooking couples WorkupCase (clinical) with CollectionCenter (logistics)
    - polymorphic          # DonorUnavailability.source_booking_id is null for manual windows, set for auto COLLECTION_WINDOW windows

  role_model: segregation_of_duties
  # The MedicalDirector who records the PHYSICAL_EXAM clearance result MUST NOT be
  # the MedicalDirector who authorizes the collection-method decision on the same
  # WorkupCase (two-physician donor-safety rule).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Registry
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Registry short code, unique across all registries
        constraints: "1..16 chars, uppercase alphanumeric plus hyphen; unique -> ERR_REGISTRY_CODE_ALREADY_EXISTS"
      - name: name
        type: string
        source: input
        description: Legal registry name
        constraints: "1..120 chars"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the registry
        constraints: "exactly 2 uppercase letters"
      - name: currency_code
        type: string
        source: input
        description: ISO-4217 currency the registry invoices in
        constraints: "exactly 3 uppercase letters"
      - name: fx_rate_to_usd
        type: number
        source: input
        description: USD value of one unit of currency_code; billed_amount_local_cents = round_half_up(total_usd_cents / fx_rate_to_usd)
        constraints: "> 0, exactly 4 decimal places"
      - name: is_domestic
        type: boolean
        source: input
        description: true for the national (home) registry; false marks an international partner registry that attracts the courier surcharge, the international coordination fee and the CT grace hours
      - name: cooperation_status
        type: enum
        source: input
        description: Cooperation state of the registry; gates confirmatory-typing requests against its donors
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: cooperation_tier
        type: integer
        source: input
        description: Partner service tier feeding the logistics factor of candidate_rank_score
        constraints: "1..3"
      - name: ct_response_deadline_hours
        type: integer
        source: input
        description: Contractual hours the registry has to answer a confirmatory-typing request
        constraints: "1..720"
      - name: donor_count
        type: integer
        source: computed
        description: "count of DonorProfile rows whose registry_id == this.id (all availability_status values included)"

  - name: CollectionCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Apheresis / marrow harvest center name
        constraints: "1..120 chars"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the center
        constraints: "exactly 2 uppercase letters"
      - name: concurrent_collection_capacity
        type: integer
        source: input
        description: Number of collections the center can run over one instant; aggregate capacity used by the buffered-interval overlap rule
        constraints: "1..5"
      - name: committed_slot_minutes
        type: integer
        source: computed
        description: "sum of CollectionBooking.duration_minutes over bookings whose collection_center_id == this.id AND status IN {HELD, CONFIRMED, COMPLETED}; conserved quantity of the booking/cancel compensating invariant"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical record number, unique across patients
        constraints: "1..32 chars; unique -> ERR_MRN_ALREADY_EXISTS"
      - name: transplant_center_code
        type: string
        source: input
        description: Code of the transplant center that owns the case (free-form label; no entity behind it)
        constraints: "1..16 chars"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the transplant center
        constraints: "exactly 2 uppercase letters"
      - name: diagnosis_code
        type: string
        source: input
        description: Primary diagnosis code
        constraints: "1..16 chars"
      - name: urgency_tier
        type: enum
        source: input
        description: Clinical urgency of the transplant
        constraints: "STANDARD | HIGH | CRITICAL"
      - name: weight_kg
        type: number
        source: input
        description: Recipient weight, denominator of the CD34+ cell-dose adequacy check
        constraints: "> 0, 1 decimal place"
      - name: cmv_status
        type: enum
        source: input
        description: Recipient cytomegalovirus serostatus, compared with the donor for the match bonus
        constraints: "NEGATIVE | POSITIVE"
      - name: hla_typing
        type: object
        source: input
        description: "Allele-level recipient typing; exactly the five keys A, B, C, DRB1, DQB1, each an array of exactly 2 allele strings in field:allele form (e.g. 02:01)"
        constraints: "all five loci required; malformed -> ERR_INVALID_REQUEST"
      - name: case_budget_cents
        type: integer
        source: input
        description: USD-cent ceiling the transplant center authorized for this case; compared against committed_cost_cents
        constraints: ">= 0"
      - name: coordinating_user_id
        type: string
        source: system
        description: X-User-ID of the TransplantCoordinator that created the patient; only this operator may drive the patient's search, typing, workup and conditioning writes
      - name: conditioning_status
        type: enum
        source: system
        description: Conditioning-regimen dimension of the patient case
        default: NOT_SCHEDULED
        constraints: "NOT_SCHEDULED | SCHEDULED | STARTED | INFUSED | ABORTED"
      - name: conditioning_start_date
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD, UTC) the conditioning regimen is scheduled to start; null while conditioning_status == NOT_SCHEDULED; anchors the legal collection-date window"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "sum over ReimbursementClaim rows whose patient_id == this.id AND status IN {PROVISIONAL, FINALIZED} of total_usd_cents; conserved quantity of the workup-open/abort compensating invariant"
      - name: conditioning_aborted_reason
        type: string
        source: system
        description: Free-text reason captured when conditioning is aborted; null otherwise

  - name: SearchRequest
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the recipient this registry search serves"
      - name: search_scope
        type: enum
        source: input
        description: Restricts the donor pool by registry nationality
        constraints: "DOMESTIC_ONLY | DOMESTIC_AND_INTERNATIONAL"
      - name: min_preliminary_score
        type: number
        source: input
        description: Preliminary-score floor a donor must reach to be materialized as a MatchCandidate
        default: 60.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Search lifecycle state
        default: SEARCHING
        constraints: "SEARCHING | NO_MATCH_FOUND | PRIMARY_ENGAGED | WORKUP_ACTIVE | BACKUP_REQUIRED | STALLED | FULFILLED"
      - name: match_pool_size
        type: integer
        source: computed
        description: "count of MatchCandidate rows materialized for this search at creation time (0 when the eligible pool was empty)"
      - name: backup_candidate_count
        type: integer
        source: computed
        description: "count of MatchCandidate rows whose search_request_id == this.id AND candidate_role == BACKUP AND status IN {IDENTIFIED, TYPING_REQUESTED, TYPING_RESPONDED, SCREENING_PASSED}; the live donor-backup depth of the search, which the promotion cascade consumes"
      - name: last_sweep_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent deadline sweep on this search; null before the first sweep

  - name: DonorProfile
    parent: null
    common_fields: true
    fields:
      - name: registry_id
        type: string
        source: input
        description: "FK -> Registry.id; the donor's home registry, and the invoicing party of every claim built on this donor"
      - name: donor_code
        type: string
        source: input
        description: Registry-local donor code
        constraints: "1..24 chars; unique per registry_id -> ERR_DONOR_CODE_ALREADY_EXISTS"
      - name: age_years
        type: integer
        source: input
        description: Donor age in whole years at registration; feeds both the demographic bonus and the age factor of candidate_rank_score
        constraints: "17..75 accepted at registration; the search eligibility filter admits only 18..60"
      - name: sex
        type: enum
        source: input
        description: Donor sex
        constraints: "M | F"
      - name: weight_kg
        type: number
        source: input
        description: Donor weight
        constraints: "> 0, 1 decimal place"
      - name: cmv_status
        type: enum
        source: input
        description: Donor cytomegalovirus serostatus
        constraints: "NEGATIVE | POSITIVE"
      - name: hla_typing_registry
        type: object
        source: input
        description: "Registry-level typing; the five keys A, B, C, DRB1, DQB1, each an array of exactly 2 strings. For a locus listed in ambiguous_loci the strings MAY be antigen-level (first field only, e.g. 07); otherwise they MUST be allele-level (e.g. 07:02)"
        constraints: "all five loci required; malformed -> ERR_INVALID_REQUEST"
      - name: ambiguous_loci
        type: array
        source: input
        description: Loci whose registry typing is antigen-level only; each costs a fixed ambiguity penalty in the PRELIMINARY match variant
        default: []
        constraints: "subset of [A, B, C, DRB1, DQB1], no duplicates"
      - name: consented_methods
        type: array
        source: input
        description: Collection methods this donor consented to at registration
        constraints: "non-empty subset of [PBSC, MARROW], no duplicates"
      - name: prior_donation_count
        type: integer
        source: input
        description: Number of completed prior donations; penalizes the domestic logistics factor
        default: 0
        constraints: "0..5"
      - name: availability_status
        type: enum
        source: input
        description: Donor availability; supplied at registration and thereafter mutated only by system transitions (CT non-availability answer, screening deferral, adverse event, deferral lapse)
        default: AVAILABLE
        constraints: "AVAILABLE | TEMPORARILY_DEFERRED | PERMANENTLY_DEFERRED | WITHDRAWN"
      - name: deferral_until
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD, UTC) a TEMPORARILY_DEFERRED donor may be re-screened from; null unless availability_status == TEMPORARILY_DEFERRED"
      - name: blocked_day_count
        type: integer
        source: computed
        description: "sum of DonorUnavailability.day_count over windows whose donor_id == this.id AND status == ACTIVE; conserved quantity of the confirm/cancel compensating invariant"
      - name: adverse_event_count
        type: integer
        source: computed
        description: "count of DonorFollowUp rows whose donor_id == this.id AND event_type == ADVERSE_EVENT"
      - name: last_followup_at
        type: datetime
        source: system
        description: reported_at of the most recent DonorFollowUp row for this donor (max over reported_at); null when none exists

  - name: MatchCandidate
    parent: null
    common_fields: true
    fields:
      - name: search_request_id
        type: string
        source: input
        description: "FK -> SearchRequest.id; the search that materialized this candidate"
      - name: donor_id
        type: string
        source: input
        description: "FK -> DonorProfile.id; the candidate donor"
      - name: preliminary_score
        type: number
        source: computed
        description: PRELIMINARY variant of match_probability_score, computed at search creation from registry-level typing
        constraints: "0.00..100.00, 2 decimal places"
      - name: confirmed_score
        type: number
        source: computed
        description: CONFIRMED variant of match_probability_score, computed from the confirmatory-typing response; null until the CT request is answered
        constraints: "0.00..100.00, 2 decimal places"
      - name: confirmed_match_grade
        type: string
        source: computed
        description: "Allele-level grade string N/10 where N is the number of matched alleles across A, B, C, DRB1, DQB1 in the CT response; null until answered"
      - name: rank_score
        type: number
        source: computed
        description: candidate_rank_score used to order the pool and assign candidate_role
        constraints: "0.000..100.000, 3 decimal places"
      - name: rank_position
        type: integer
        source: computed
        description: 1-based position of this candidate inside its search's materialized pool, assigned once at search creation and never re-ranked afterwards
      - name: candidate_role
        type: enum
        source: system
        description: Current duty of the candidate inside the search; assigned from rank_position at materialization (rank 1 -> PRIMARY, ranks 2..3 -> BACKUP, ranks 4..5 -> ARCHIVED_POOL) and mutated afterwards only by the backup-promotion cascade
        constraints: "PRIMARY | BACKUP | ARCHIVED_POOL"
      - name: status
        type: enum
        source: system
        description: Candidate workflow state
        default: IDENTIFIED
        constraints: "IDENTIFIED | TYPING_REQUESTED | TYPING_RESPONDED | TYPING_EXPIRED | SCREENING_PASSED | DEFERRED | EXCLUDED | WORKUP_OPEN | COLLECTED | CLOSED"
      - name: ct_attempt_count
        type: integer
        source: system
        description: Number of confirmatory-typing requests already raised for this candidate
        default: 0
        constraints: "0..2; a third request is refused"
      - name: screening_outcome
        type: enum
        source: system
        description: Outcome of the donor health screening for this candidate; null before screening
        constraints: "PASS | DEFER | FAIL"
      - name: screening_deferral_type
        type: enum
        source: system
        description: Deferral class carried by the screening outcome; null before screening
        constraints: "NONE | TEMPORARY | PERMANENT"
      - name: promoted_from_rank
        type: integer
        source: system
        description: rank_position this candidate held when the promotion cascade lifted it to PRIMARY; null when it was never promoted

  - name: ConfirmatoryTypingRequest
    parent: null
    common_fields: true
    fields:
      - name: match_candidate_id
        type: string
        source: input
        description: "FK -> MatchCandidate.id; the candidate whose donor is asked for allele-level typing"
      - name: attempt_number
        type: integer
        source: system
        description: Value of MatchCandidate.ct_attempt_count after this request was raised (1 or 2)
      - name: priority_flag
        type: boolean
        source: input
        description: Marks the request as clinically urgent; shortens deadline_at by PRIORITY_DEADLINE_REDUCTION_HOURS
        default: false
      - name: requested_at
        type: datetime
        source: system
        description: Logical-clock instant the request was raised
      - name: deadline_at
        type: datetime
        source: computed
        description: "requested_at + Registry.ct_response_deadline_hours hours, plus INTERNATIONAL_GRACE_HOURS when the donor's registry has is_domestic == false, minus PRIORITY_DEADLINE_REDUCTION_HOURS when priority_flag is true"
      - name: status
        type: enum
        source: system
        description: Request lifecycle state
        default: REQUESTED
        constraints: "REQUESTED | RESPONDED | EXPIRED | CANCELLED"
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant the registry answered; null unless status == RESPONDED
      - name: reported_hla_typing
        type: object
        source: input
        description: "Allele-level typing reported by the donor's registry; the five keys A, B, C, DRB1, DQB1, each an array of exactly 2 allele strings in field:allele form; null while status == REQUESTED"
      - name: reported_match_grade
        type: string
        source: computed
        description: "Grade string N/10 derived from reported_hla_typing against the recipient typing; copied onto MatchCandidate.confirmed_match_grade"
      - name: donor_available_flag
        type: boolean
        source: input
        description: Registry's availability answer accompanying the typing; false withdraws the donor and excludes the candidate without a confirmed_score
      - name: expired_by_sweep_at
        type: datetime
        source: system
        description: Logical-clock instant of the deadline sweep that expired this request; null unless status == EXPIRED

  - name: WorkupCase
    parent: null
    common_fields: true
    fields:
      - name: match_candidate_id
        type: string
        source: input
        description: "FK -> MatchCandidate.id; the PRIMARY candidate being worked up"
      - name: case_status
        type: enum
        source: system
        description: Overall workup disposition
        default: OPEN
        constraints: "OPEN | ABORTED | COMPLETED"
      - name: clearance_status
        type: enum
        source: system
        description: Clearance dimension, derived from the three ClearanceItem results
        default: PENDING
        constraints: "PENDING | IN_PROGRESS | CLEARED | FAILED"
      - name: logistics_status
        type: enum
        source: system
        description: Logistics dimension, driven by method decision, booking, collection and transport; evolves independently of clearance_status until booking creation couples them
        default: UNSCHEDULED
        constraints: "UNSCHEDULED | METHOD_SET | BOOKED | COLLECTED | IN_TRANSIT | DELIVERED | PRODUCT_LOST"
      - name: collection_method
        type: enum
        source: system
        description: Decided collection method; null until the collection-method decision is recorded
        constraints: "PBSC | MARROW"
      - name: method_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector that authorized collection_method; null before the decision
      - name: physical_cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector that recorded the PHYSICAL_EXAM result; the segregation-of-duties comparand of the collection-method decision
      - name: idm_resulted_at
        type: datetime
        source: computed
        description: "resulted_at of this case's ClearanceItem whose item_type == IDM_PANEL when its result == PASS, else null; anchors the IDM validity window"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the TransplantCoordinator that opened the case
      - name: planned_window_days
        type: integer
        source: computed
        description: "Inclusive donor calendar days the collection will block: 6 when collection_method is PBSC or still null (the planning default), 8 when MARROW"
      - name: abort_reason
        type: string
        source: system
        description: Reason recorded when case_status became ABORTED; null otherwise

  - name: ClearanceItem
    parent: null
    common_fields: true
    fields:
      - name: workup_case_id
        type: string
        source: input
        description: "FK -> WorkupCase.id; the case this clearance line belongs to"
      - name: item_type
        type: enum
        source: system
        description: Which clearance step this row tracks; the three rows are created together at workup open in the pinned order PHYSICAL_EXAM, IDM_PANEL, CONSENT
        constraints: "PHYSICAL_EXAM | IDM_PANEL | CONSENT"
      - name: result
        type: enum
        source: input
        description: Recorded outcome of the step
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: resulted_at
        type: datetime
        source: system
        description: Logical-clock instant the result was recorded; null while result == PENDING
      - name: resulted_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector that recorded the result; null while result == PENDING
      - name: expires_at
        type: datetime
        source: computed
        description: "resulted_at + IDM_VALIDITY_DAYS days for item_type == IDM_PANEL with result == PASS; null for every other row"
      - name: note
        type: string
        source: input
        description: Free-text remark recorded with the result

  - name: CollectionBooking
    parent: null
    common_fields: true
    fields:
      - name: workup_case_id
        type: string
        source: input
        description: "FK -> WorkupCase.id; the cleared case whose product this slot collects"
      - name: collection_center_id
        type: string
        source: input
        description: "FK -> CollectionCenter.id; the center whose capacity this slot occupies"
      - name: method
        type: enum
        source: computed
        description: Copied from WorkupCase.collection_method at creation and frozen on the booking
        constraints: "PBSC | MARROW"
      - name: start_at
        type: datetime
        source: input
        description: Start instant of the collection slot (UTC, minute precision)
      - name: end_at
        type: datetime
        source: computed
        description: "start_at + duration_minutes; the occupied interval is half-open [start_at, end_at)"
      - name: duration_minutes
        type: integer
        source: computed
        description: "METHOD_DURATION_MINUTES[method]: 300 for PBSC, 240 for MARROW"
      - name: collection_date
        type: string
        source: computed
        description: "UTC calendar date (YYYY-MM-DD) of start_at; anchors both the conditioning-window check and the derived donor calendar window"
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state
        default: HELD
        constraints: "HELD | CONFIRMED | COMPLETED | CANCELLED | SUPERSEDED"
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant the center confirmed the slot; null before confirmation
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when status became CANCELLED or SUPERSEDED; null otherwise
      - name: cancelled_after_confirmation
        type: boolean
        source: computed
        description: "true when status == CANCELLED and confirmed_at is not null; drives the CANCELLATION line of the FINAL claim variant"
        default: false

  - name: DonorUnavailability
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> DonorProfile.id; the donor whose calendar this window blocks"
      - name: source_booking_id
        type: string
        source: system
        description: "FK -> CollectionBooking.id; set only on windows auto-created by booking confirmation (reason == COLLECTION_WINDOW), null on manually created and deferral windows"
      - name: date_from
        type: string
        source: input
        description: "First blocked calendar date (YYYY-MM-DD, UTC), inclusive"
      - name: date_to
        type: string
        source: input
        description: "Last blocked calendar date (YYYY-MM-DD, UTC), inclusive; MUST be >= date_from"
      - name: reason
        type: enum
        source: input
        description: Why the calendar is blocked; only PERSONAL and MEDICAL_HOLD may be supplied by a client, DEFERRAL and COLLECTION_WINDOW are system-created
        constraints: "PERSONAL | MEDICAL_HOLD | DEFERRAL | COLLECTION_WINDOW"
      - name: day_count
        type: integer
        source: computed
        description: "Inclusive day count date_to - date_from + 1 (closed interval on both ends)"
      - name: status
        type: enum
        source: system
        description: Whether the window still blocks the calendar
        default: ACTIVE
        constraints: "ACTIVE | RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the window was released; null while status == ACTIVE

  - name: ProductShipment
    parent: null
    common_fields: true
    fields:
      - name: collection_booking_id
        type: string
        source: input
        description: "FK -> CollectionBooking.id; the completed collection whose product travels"
      - name: collected_at
        type: datetime
        source: system
        description: Logical-clock instant the shipment record was created, i.e. the end of collection; anchors the viability deadline
      - name: collected_cd34_e6_per_kg
        type: number
        source: input
        description: CD34+ cells collected per kilogram of recipient weight, in units of 1e6
        constraints: "> 0, 2 decimal places"
      - name: collected_volume_ml
        type: number
        source: input
        description: Product volume in millilitres
        constraints: "> 0, 1 decimal place"
      - name: courier_reference
        type: string
        source: input
        description: Courier air-waybill / chain-of-custody reference
        constraints: "1..40 chars"
      - name: must_infuse_by
        type: datetime
        source: computed
        description: "collected_at + VIABILITY_HOURS[booking.method] hours (PBSC 72, MARROW 48)"
      - name: dose_adequacy
        type: enum
        source: computed
        description: "ADEQUATE when collected_cd34_e6_per_kg >= MIN_CD34_E6_PER_KG, otherwise INADEQUATE"
        constraints: "ADEQUATE | INADEQUATE"
      - name: status
        type: enum
        source: system
        description: Transport lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | IN_TRANSIT | DELIVERED | DISCARDED | CANCELLED"
      - name: departed_at
        type: datetime
        source: system
        description: Logical-clock instant of the DEPARTED event; null before it
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of the DELIVERED event; null unless status IN {DELIVERED, DISCARDED}
      - name: transit_event_count
        type: integer
        source: system
        description: Number of transit events recorded against this shipment
        default: 0

  - name: DonorFollowUp
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> DonorProfile.id; the donor being followed up"
      - name: event_type
        type: enum
        source: input
        description: Follow-up contact or adverse-event report
        constraints: "DAY_7_CONTACT | DAY_30_CONTACT | ONE_YEAR_CONTACT | ADVERSE_EVENT"
      - name: severity_grade
        type: integer
        source: input
        description: CTCAE-style grade; only meaningful for ADVERSE_EVENT rows, MUST be 0 for contact rows
        constraints: "0..5"
      - name: description
        type: string
        source: input
        description: Free-text narrative
        constraints: "0..400 chars"
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant the row was filed
      - name: triggered_permanent_deferral
        type: boolean
        source: computed
        description: "true when event_type == ADVERSE_EVENT AND severity_grade >= ADVERSE_EVENT_DEFERRAL_GRADE, i.e. when filing this row permanently deferred the donor"

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: workup_case_id
        type: string
        source: input
        description: "FK -> WorkupCase.id; the case whose costs this claim carries"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the paying case, resolved from the workup's candidate and search at claim creation"
      - name: billing_registry_id
        type: string
        source: input
        description: "FK -> Registry.id; the donor's home registry, which invoices in its own currency"
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINALIZED | VOID"
      - name: variant_applied
        type: enum
        source: computed
        description: Which variant of reimbursement_claim_amount produced the current numbers
        constraints: "PROVISIONAL | FINAL"
      - name: currency_code
        type: string
        source: computed
        description: Copied from the billing registry's currency_code
      - name: fx_rate_snapshot
        type: number
        source: computed
        description: "Registry.fx_rate_to_usd read at the moment the current numbers were computed: at claim creation for the PROVISIONAL variant, re-read at finalize for the FINAL variant"
      - name: line_items
        type: array
        source: computed
        description: "Ordered array of objects {line_type, amount_usd_cents} in the pinned order CT_TYPING, WORKUP_PHYSICAL, IDM_PANEL, COLLECTION, COURIER, DONOR_LOST_WAGE, CANCELLATION; zero-valued lines are still present"
      - name: subtotal_usd_cents
        type: integer
        source: computed
        description: Exact integer sum of all line_items amounts (each line already rounded to whole cents)
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Discount rate selected from subtotal_usd_cents alone (0, 0.05 or 0.09)"
      - name: discount_usd_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_usd_cents * volume_discount_pct)"
      - name: intl_coordination_fee_usd_cents
        type: integer
        source: computed
        description: "round_half_up((subtotal_usd_cents - discount_usd_cents) * INTL_COORDINATION_FEE_PCT) when the billing registry has is_domestic == false, else 0"
      - name: total_usd_cents
        type: integer
        source: computed
        description: "subtotal_usd_cents - discount_usd_cents + intl_coordination_fee_usd_cents"
      - name: billed_amount_local_cents
        type: integer
        source: computed
        description: "round_half_up(total_usd_cents / fx_rate_snapshot)"
      - name: cancellation_fee_applied
        type: boolean
        source: computed
        description: "true when the FINAL variant found a booking of this case with cancelled_after_confirmation == true"
        default: false
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant the claim was finalized; null unless status == FINALIZED
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the claim was voided by the workup-abort cascade; null otherwise

state_machines:
  - entity: Patient
    state_field: conditioning_status
    initial_state: NOT_SCHEDULED
    terminal_states: [INFUSED, ABORTED]
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "POST /registry/patients/{id}/conditioning with action == SCHEDULE"
        actor: TransplantCoordinator
        preconditions:
          - "expected_patient_version equals Patient.version"
          - "the patient has a SearchRequest whose status == WORKUP_ACTIVE"
          - "conditioning_start_date is supplied and is not earlier than the current logical UTC date"
        side_effects:
          - "sets Patient.conditioning_start_date"
          - "increments Patient.version by 1"
          - "opens the legal collection window conditioning_start_date + CONDITIONING_TO_COLLECTION_MIN_DAYS .. + CONDITIONING_TO_COLLECTION_MAX_DAYS for every subsequent CollectionBooking of this patient"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /registry/patients/{id}/conditioning with action == SCHEDULE (re-schedule self-loop)"
        actor: TransplantCoordinator
        preconditions:
          - "expected_patient_version equals Patient.version"
          - "no CollectionBooking of this patient's workup case is in status COMPLETED"
        side_effects:
          - "overwrites Patient.conditioning_start_date and re-derives the legal collection window"
          - "increments Patient.version by 1"
          - "every CollectionBooking of this patient's OPEN workup case in status HELD or CONFIRMED whose collection_date now falls outside the re-derived window transitions to CANCELLED with cancel_reason CONDITIONING_RESCHEDULED, releasing the center's committed_slot_minutes and RELEASING its COLLECTION_WINDOW DonorUnavailability row"
          - "WorkupCase.logistics_status reverts to METHOD_SET for each such cancelled booking"
        note: "Self-loop: the state label does not change but the derived window and dependent bookings do."
      - from: SCHEDULED
        to: STARTED
        trigger: "POST /registry/patients/{id}/conditioning with action == START"
        actor: MedicalDirector
        preconditions:
          - "expected_patient_version equals Patient.version"
          - "the current logical UTC date is not earlier than Patient.conditioning_start_date"
          - "a CollectionBooking in status CONFIRMED exists for this patient's OPEN WorkupCase"
        side_effects:
          - "increments Patient.version by 1"
          - "marks the point of no return: from here an abort is recorded with conditioning_aborted_reason and the search moves to STALLED rather than BACKUP_REQUIRED"
        note: "Guarded cross-entity transition: conditioning cannot start without a confirmed collection slot."
      - from: STARTED
        to: INFUSED
        trigger: "POST /registry/patients/{id}/conditioning with action == INFUSE"
        actor: MedicalDirector
        preconditions:
          - "expected_patient_version equals Patient.version"
          - "a ProductShipment of this patient's WorkupCase is in status DELIVERED"
          - "the current logical UTC instant is not after that shipment's must_infuse_by"
        side_effects:
          - "increments Patient.version by 1"
          - "WorkupCase.case_status becomes COMPLETED"
          - "MatchCandidate.status becomes CLOSED"
          - "SearchRequest.status becomes FULFILLED"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions:
          - "expected_patient_version equals Patient.version"
        side_effects:
          - "increments Patient.version by 1; records conditioning_aborted_reason"
          - "every CollectionBooking of the patient's OPEN WorkupCase in status HELD or CONFIRMED becomes CANCELLED with cancel_reason CONDITIONING_ABORTED, releasing CollectionCenter.committed_slot_minutes; bookings already in a terminal status keep their own cancel_reason"
          - "every COLLECTION_WINDOW DonorUnavailability row sourced by those bookings becomes RELEASED, restoring DonorProfile.blocked_day_count"
          - "every ProductShipment of this case still in status SCHEDULED becomes CANCELLED, while the COMPLETED booking that produced it is left untouched"
          - "WorkupCase.case_status becomes ABORTED with abort_reason CONDITIONING_ABORTED"
          - "every ReimbursementClaim of that case in status PROVISIONAL becomes VOID, restoring Patient.committed_cost_cents"
          - "SearchRequest.status becomes STALLED"
      - from: STARTED
        to: ABORTED
        trigger: "POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions:
          - "expected_patient_version equals Patient.version"
        side_effects:
          - "identical cascade to the SCHEDULED -> ABORTED transition"

  - entity: SearchRequest
    state_field: status
    initial_state: SEARCHING
    terminal_states: [NO_MATCH_FOUND, FULFILLED]
    transitions:
      - from: SEARCHING
        to: NO_MATCH_FOUND
        trigger: "POST /registry/search-requests (the creation-time preliminary sweep finds no eligible donor)"
        actor: system
        preconditions:
          - "the eligible-donor input set of candidate_pool_materialization is empty"
        side_effects:
          - "match_pool_size stays 0; no MatchCandidate rows are created"
        note: "Reached inside the creation call itself, so the row is never observable in SEARCHING when the pool is empty."
      - from: SEARCHING
        to: PRIMARY_ENGAGED
        trigger: "POST /registry/match-candidates/{id}/typing-requests on the candidate whose candidate_role == PRIMARY"
        actor: TransplantCoordinator
        preconditions:
          - "the candidate belongs to this search and its candidate_role == PRIMARY"
        side_effects:
          - "a ConfirmatoryTypingRequest is created with a computed deadline_at"
      - from: PRIMARY_ENGAGED
        to: WORKUP_ACTIVE
        trigger: "POST /registry/match-candidates/{id}/workup-cases"
        actor: TransplantCoordinator
        preconditions:
          - "the candidate's status == SCREENING_PASSED and candidate_role == PRIMARY"
        side_effects:
          - "a WorkupCase is opened with three PENDING ClearanceItem rows"
          - "a PROVISIONAL ReimbursementClaim is created, raising Patient.committed_cost_cents"
      - from: PRIMARY_ENGAGED
        to: BACKUP_REQUIRED
        trigger: "POST /registry/search-requests/{id}/deadline-sweep expiring the primary's last allowed CT attempt, or POST /registry/match-candidates/{id}/screening with outcome DEFER or FAIL on the primary"
        actor: RegistryOperations | DonorRegistryLiaison
        preconditions:
          - "the affected candidate's candidate_role == PRIMARY"
          - "at least one candidate of this search with candidate_role == BACKUP is still promotable"
        side_effects:
          - "the highest-ranked promotable BACKUP candidate becomes PRIMARY, recording promoted_from_rank"
          - "the demoted candidate's candidate_role becomes ARCHIVED_POOL"
          - "backup_candidate_count decreases by 1"
      - from: WORKUP_ACTIVE
        to: BACKUP_REQUIRED
        trigger: "POST /registry/clearance-items/{id}/result with result == FAIL"
        actor: MedicalDirector
        preconditions:
          - "the item's WorkupCase belongs to the search's PRIMARY candidate"
          - "at least one candidate of this search with candidate_role == BACKUP is still promotable"
        side_effects:
          - "the WorkupCase is ABORTED and its PROVISIONAL claim becomes VOID"
          - "the promotion cascade lifts the highest-ranked promotable BACKUP candidate to PRIMARY"
      - from: BACKUP_REQUIRED
        to: PRIMARY_ENGAGED
        trigger: "POST /registry/match-candidates/{id}/typing-requests on the newly promoted PRIMARY candidate"
        actor: TransplantCoordinator
        preconditions:
          - "the candidate's candidate_role == PRIMARY and its status == IDENTIFIED or TYPING_EXPIRED"
          - "the candidate's ct_attempt_count < MAX_CT_ATTEMPTS"
        side_effects:
          - "a ConfirmatoryTypingRequest is created for the promoted candidate"
        note: "Cycle: PRIMARY_ENGAGED -> BACKUP_REQUIRED -> PRIMARY_ENGAGED may repeat once per available backup."
      - from: BACKUP_REQUIRED
        to: STALLED
        trigger: "POST /registry/search-requests/{id}/deadline-sweep when no promotable candidate remains"
        actor: RegistryOperations
        preconditions:
          - "every MatchCandidate of this search is in status EXCLUDED, DEFERRED, CLOSED or TYPING_EXPIRED with ct_attempt_count == MAX_CT_ATTEMPTS"
        side_effects:
          - "backup_candidate_count becomes 0; last_sweep_at is stamped"
      - from: WORKUP_ACTIVE
        to: STALLED
        trigger: "POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions:
          - "the patient's conditioning_status is SCHEDULED or STARTED"
        side_effects:
          - "see the Patient ABORT cascade"
      - from: WORKUP_ACTIVE
        to: FULFILLED
        trigger: "POST /registry/patients/{id}/conditioning with action == INFUSE"
        actor: MedicalDirector
        preconditions:
          - "a DELIVERED ProductShipment exists within its viability window"
        side_effects:
          - "the search is closed; further typing requests on its candidates are refused"

  - entity: DonorProfile
    state_field: availability_status
    initial_state: AVAILABLE
    terminal_states: [PERMANENTLY_DEFERRED, WITHDRAWN]
    transitions:
      - from: AVAILABLE
        to: TEMPORARILY_DEFERRED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == DEFER and deferral_type == TEMPORARY, or POST /registry/clearance-items/{id}/result with result == FAIL on a PHYSICAL_EXAM or IDM_PANEL item of an OPEN WorkupCase"
        actor: DonorRegistryLiaison | MedicalDirector
        preconditions:
          - "on the screening path, deferral_until is supplied and is later than the current logical UTC date"
          - "on the clearance-FAIL path, no client-supplied deferral_until is accepted: it is derived as the current logical UTC date plus CLEARANCE_FAIL_DEFERRAL_DAYS"
        side_effects:
          - "sets deferral_until (supplied on the screening path, derived on the clearance-FAIL path)"
          - "creates an ACTIVE DonorUnavailability row with reason DEFERRAL spanning the current logical date .. deferral_until, raising blocked_day_count"
          - "on the screening path MatchCandidate.status becomes DEFERRED from TYPING_RESPONDED; on the clearance-FAIL path MatchCandidate.status becomes DEFERRED from WORKUP_OPEN and the WorkupCase abort cascade runs"
      - from: TEMPORARILY_DEFERRED
        to: AVAILABLE
        trigger: "DELETE /registry/donors/{id}/unavailability-windows/{windowId} on the ACTIVE DEFERRAL window"
        actor: DonorRegistryLiaison
        preconditions:
          - "the current logical UTC date is later than DonorProfile.deferral_until"
        side_effects:
          - "the window becomes RELEASED, lowering blocked_day_count"
          - "deferral_until becomes null; the donor is eligible for candidate pools again"
        note: "Deferral lapse is the only path back to AVAILABLE, which makes DEFERRED -> SCREENING_PASSED reachable on the candidate."
      - from: AVAILABLE
        to: PERMANENTLY_DEFERRED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == FAIL, or POST /registry/donors/{id}/follow-ups with event_type == ADVERSE_EVENT and severity_grade >= ADVERSE_EVENT_DEFERRAL_GRADE"
        actor: DonorRegistryLiaison | MedicalDirector
        preconditions:
          - "for the screening path, deferral_type == PERMANENT"
        side_effects:
          - "MatchCandidate.status becomes EXCLUDED on the screening path"
          - "the donor is removed from every future eligible pool; open non-terminal candidates for this donor become EXCLUDED and their REQUESTED typing requests CANCELLED"
      - from: TEMPORARILY_DEFERRED
        to: PERMANENTLY_DEFERRED
        trigger: "POST /registry/donors/{id}/follow-ups with event_type == ADVERSE_EVENT and severity_grade >= ADVERSE_EVENT_DEFERRAL_GRADE"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "triggered_permanent_deferral is recorded true on the follow-up row"
          - "any ACTIVE DEFERRAL window stays ACTIVE; deferral_until is cleared"
      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /registry/typing-requests/{id}/response with donor_available_flag == false"
        actor: DonorRegistryLiaison
        preconditions:
          - "the typing request is in status REQUESTED"
        side_effects:
          - "the ConfirmatoryTypingRequest becomes RESPONDED but the MatchCandidate becomes EXCLUDED without a confirmed_score"
          - "the promotion cascade runs on the candidate's search when the candidate was PRIMARY"

  - entity: MatchCandidate
    state_field: status
    initial_state: IDENTIFIED
    terminal_states: [EXCLUDED, CLOSED]
    transitions:
      - from: IDENTIFIED
        to: TYPING_REQUESTED
        trigger: "POST /registry/match-candidates/{id}/typing-requests"
        actor: TransplantCoordinator
        preconditions:
          - "the candidate's search is in status SEARCHING, PRIMARY_ENGAGED or BACKUP_REQUIRED"
          - "the donor's registry has cooperation_status == ACTIVE"
          - "ct_attempt_count < MAX_CT_ATTEMPTS"
        side_effects:
          - "ct_attempt_count increases by 1"
          - "a ConfirmatoryTypingRequest is created with attempt_number == ct_attempt_count and a computed deadline_at"
      - from: TYPING_REQUESTED
        to: TYPING_RESPONDED
        trigger: "POST /registry/typing-requests/{id}/response with donor_available_flag == true"
        actor: DonorRegistryLiaison
        preconditions:
          - "the typing request is in status REQUESTED"
          - "the reported typing is allele-level for all five loci"
        side_effects:
          - "confirmed_score and confirmed_match_grade are computed from the CONFIRMED variant"
      - from: TYPING_REQUESTED
        to: TYPING_EXPIRED
        trigger: "POST /registry/search-requests/{id}/deadline-sweep"
        actor: RegistryOperations
        preconditions:
          - "the current logical UTC instant is strictly after the request's deadline_at"
        side_effects:
          - "the ConfirmatoryTypingRequest becomes EXPIRED with expired_by_sweep_at stamped"
      - from: TYPING_EXPIRED
        to: TYPING_REQUESTED
        trigger: "POST /registry/match-candidates/{id}/typing-requests (second attempt)"
        actor: TransplantCoordinator
        preconditions:
          - "ct_attempt_count == 1"
        side_effects:
          - "ct_attempt_count becomes 2; a second ConfirmatoryTypingRequest with attempt_number 2 is created"
        note: "Cycle TYPING_REQUESTED -> TYPING_EXPIRED -> TYPING_REQUESTED is bounded by MAX_CT_ATTEMPTS."
      - from: TYPING_EXPIRED
        to: EXCLUDED
        trigger: "POST /registry/search-requests/{id}/deadline-sweep when ct_attempt_count == MAX_CT_ATTEMPTS"
        actor: RegistryOperations
        preconditions:
          - "candidate_role == PRIMARY, the candidate has no REQUESTED typing request left and ct_attempt_count == MAX_CT_ATTEMPTS"
        side_effects:
          - "the promotion cascade runs when the excluded candidate was PRIMARY"
        note: "A BACKUP candidate at MAX_CT_ATTEMPTS is deliberately NOT auto-excluded: it rests in TYPING_EXPIRED, which is what makes ERR_CT_ATTEMPTS_EXHAUSTED reachable on a third request."
      - from: TYPING_RESPONDED
        to: EXCLUDED
        trigger: "POST /registry/typing-requests/{id}/response whose confirmed_match_grade is below MIN_ACCEPTABLE_ALLELE_MATCHES/10"
        actor: DonorRegistryLiaison
        preconditions:
          - "the computed matched-allele count is lower than MIN_ACCEPTABLE_ALLELE_MATCHES"
        side_effects:
          - "confirmed_score is still stored for audit; the candidate leaves the workflow"
        note: "Reached inside the response call: the candidate never rests in TYPING_RESPONDED when the grade is unacceptable."
      - from: TYPING_RESPONDED
        to: SCREENING_PASSED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == PASS"
        actor: DonorRegistryLiaison
        preconditions:
          - "the donor's availability_status == AVAILABLE"
          - "deferral_type == NONE"
        side_effects:
          - "screening_outcome PASS and screening_deferral_type NONE are recorded"
      - from: TYPING_RESPONDED
        to: DEFERRED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == DEFER"
        actor: DonorRegistryLiaison
        preconditions:
          - "deferral_type == TEMPORARY and deferral_until is later than the current logical UTC date"
        side_effects:
          - "the donor becomes TEMPORARILY_DEFERRED and an ACTIVE DEFERRAL window is created"
      - from: TYPING_RESPONDED
        to: EXCLUDED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == FAIL"
        actor: DonorRegistryLiaison
        preconditions:
          - "deferral_type == PERMANENT"
        side_effects:
          - "the donor becomes PERMANENTLY_DEFERRED"
      - from: DEFERRED
        to: SCREENING_PASSED
        trigger: "POST /registry/match-candidates/{id}/screening with outcome == PASS after the deferral lapsed"
        actor: DonorRegistryLiaison
        preconditions:
          - "the donor's availability_status is back to AVAILABLE"
        side_effects:
          - "screening_outcome is overwritten with PASS and screening_deferral_type with NONE"
        note: "Non-linear re-entry: a deferred candidate rejoins the workflow without a new typing request."
      - from: SCREENING_PASSED
        to: WORKUP_OPEN
        trigger: "POST /registry/match-candidates/{id}/workup-cases"
        actor: TransplantCoordinator
        preconditions:
          - "candidate_role == PRIMARY"
          - "no other WorkupCase of this candidate is in case_status OPEN"
          - "the patient's committed_cost_cents plus the provisional claim total does not exceed case_budget_cents"
        side_effects:
          - "a WorkupCase, its three ClearanceItem rows and a PROVISIONAL ReimbursementClaim are created"
          - "SearchRequest.status becomes WORKUP_ACTIVE"
      - from: WORKUP_OPEN
        to: DEFERRED
        trigger: "POST /registry/clearance-items/{id}/result with result == FAIL on an IDM_PANEL or PHYSICAL_EXAM item"
        actor: MedicalDirector
        preconditions:
          - "the WorkupCase is in case_status OPEN"
        side_effects:
          - "the WorkupCase becomes ABORTED with clearance_status FAILED"
          - "the donor becomes TEMPORARILY_DEFERRED with a DEFERRAL window of CLEARANCE_FAIL_DEFERRAL_DAYS days"
          - "the PROVISIONAL claim becomes VOID and Patient.committed_cost_cents is restored"
          - "the promotion cascade runs and SearchRequest.status becomes BACKUP_REQUIRED"
        note: "Backwards transition WORKUP_OPEN -> DEFERRED is the deepest cascade in the scaffold."
      - from: WORKUP_OPEN
        to: COLLECTED
        trigger: "POST /registry/collection-bookings/{id}/shipments"
        actor: CollectionCenterOps
        preconditions:
          - "the booking is in status CONFIRMED"
        side_effects:
          - "the booking becomes COMPLETED and WorkupCase.logistics_status becomes COLLECTED"
      - from: COLLECTED
        to: CLOSED
        trigger: "POST /registry/patients/{id}/conditioning with action == INFUSE"
        actor: MedicalDirector
        preconditions:
          - "a DELIVERED shipment inside its viability window exists"
        side_effects:
          - "SearchRequest.status becomes FULFILLED"
      - from: WORKUP_OPEN
        to: CLOSED
        trigger: "POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "see the Patient ABORT cascade"
      - from: COLLECTED
        to: CLOSED
        trigger: "POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "the shipment is CANCELLED or, once DELIVERED, left untouched while the claim is voided"

  - entity: ConfirmatoryTypingRequest
    state_field: status
    initial_state: REQUESTED
    terminal_states: [RESPONDED, EXPIRED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESPONDED
        trigger: "POST /registry/typing-requests/{id}/response"
        actor: DonorRegistryLiaison
        preconditions:
          - "X-User-ID equals the donor's registry_id"
          - "the current logical UTC instant is not after deadline_at"
        side_effects:
          - "responded_at, reported_hla_typing, reported_match_grade and donor_available_flag are stored"
          - "the MatchCandidate advances to TYPING_RESPONDED or EXCLUDED"
      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /registry/search-requests/{id}/deadline-sweep"
        actor: RegistryOperations
        preconditions:
          - "the current logical UTC instant is strictly after deadline_at"
        side_effects:
          - "expired_by_sweep_at is stamped; the MatchCandidate becomes TYPING_EXPIRED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system cascade: the candidate's donor becomes PERMANENTLY_DEFERRED, or the patient's conditioning is ABORTED"
        actor: system
        preconditions:
          - "the request is still REQUESTED when the cascade runs"
        side_effects:
          - "no response may be filed afterwards"

  - entity: WorkupCase
    state_field: case_status
    initial_state: OPEN
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: OPEN
        to: ABORTED
        trigger: "POST /registry/clearance-items/{id}/result with result == FAIL, or POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: MedicalDirector
        preconditions:
          - "the case is OPEN"
        side_effects:
          - "abort_reason is recorded; the PROVISIONAL claim becomes VOID; bookings and shipments are cancelled"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /registry/patients/{id}/conditioning with action == INFUSE"
        actor: MedicalDirector
        preconditions:
          - "clearance_status == CLEARED and logistics_status == DELIVERED"
        side_effects:
          - "the case's claim becomes finalizable"

  - entity: WorkupCase
    state_field: clearance_status
    initial_state: PENDING
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /registry/clearance-items/{id}/result with result == PASS on the first of the three items"
        actor: MedicalDirector
        preconditions:
          - "the case is OPEN and at least one ClearanceItem is still PENDING"
        side_effects:
          - "for item_type PHYSICAL_EXAM, physical_cleared_by_user_id is stamped with X-User-ID"
          - "for item_type IDM_PANEL, expires_at is set to resulted_at + IDM_VALIDITY_DAYS and idm_resulted_at is exposed on the case"
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /registry/clearance-items/{id}/result with result == PASS on the last PENDING item"
        actor: MedicalDirector
        preconditions:
          - "the other two ClearanceItem rows already carry result == PASS"
        side_effects:
          - "the case becomes bookable once logistics_status == METHOD_SET"
        note: "Bubble-up: the parent dimension is derived from its three children."
      - from: PENDING
        to: FAILED
        trigger: "POST /registry/clearance-items/{id}/result with result == FAIL as the first result"
        actor: MedicalDirector
        preconditions:
          - "the case is OPEN"
        side_effects:
          - "case_status becomes ABORTED and the abort cascade runs"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /registry/clearance-items/{id}/result with result == FAIL after an earlier PASS"
        actor: MedicalDirector
        preconditions:
          - "the case is OPEN"
        side_effects:
          - "the remaining PENDING items keep result PENDING and are never resultable again"

  - entity: WorkupCase
    state_field: logistics_status
    initial_state: UNSCHEDULED
    terminal_states: [DELIVERED, PRODUCT_LOST]
    transitions:
      - from: UNSCHEDULED
        to: METHOD_SET
        trigger: "POST /registry/workup-cases/{id}/collection-method"
        actor: MedicalDirector
        preconditions:
          - "the case is OPEN"
          - "the requested method is contained in the donor's consented_methods"
          - "X-User-ID differs from physical_cleared_by_user_id (segregation of duties)"
        side_effects:
          - "collection_method and method_decided_by_user_id are stored; planned_window_days becomes 6 for PBSC and 8 for MARROW"
      - from: METHOD_SET
        to: BOOKED
        trigger: "POST /registry/collection-bookings"
        actor: CollectionCenterOps
        preconditions:
          - "clearance_status == CLEARED"
          - "the IDM_PANEL item has not expired at the booked collection_date"
          - "expected_workup_case_version equals WorkupCase.version"
        side_effects:
          - "a HELD CollectionBooking is created; any prior HELD booking of the case becomes SUPERSEDED"
          - "increments WorkupCase.version by 1"
      - from: BOOKED
        to: METHOD_SET
        trigger: "POST /registry/collection-bookings/{id}/cancel"
        actor: CollectionCenterOps | MedicalDirector
        preconditions:
          - "the case has no other booking in status HELD or CONFIRMED after this cancellation"
        side_effects:
          - "CollectionCenter.committed_slot_minutes is released and any COLLECTION_WINDOW window becomes RELEASED"
        note: "Revert transition: the logistics dimension moves backwards while the clearance dimension is untouched."
      - from: BOOKED
        to: COLLECTED
        trigger: "POST /registry/collection-bookings/{id}/shipments"
        actor: CollectionCenterOps
        preconditions:
          - "the booking is CONFIRMED"
          - "the patient's conditioning_status == STARTED"
        side_effects:
          - "the booking becomes COMPLETED; a SCHEDULED ProductShipment with must_infuse_by is created"
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /registry/shipments/{id}/events with event_type == DEPARTED"
        actor: CollectionCenterOps
        preconditions:
          - "the shipment is SCHEDULED"
        side_effects:
          - "departed_at is stamped and transit_event_count increases by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /registry/shipments/{id}/events with event_type == DELIVERED"
        actor: CollectionCenterOps | RegistryOperations
        preconditions:
          - "the current logical UTC instant is not after the shipment's must_infuse_by"
        side_effects:
          - "delivered_at is stamped; the patient may be infused"
      - from: IN_TRANSIT
        to: PRODUCT_LOST
        trigger: "POST /registry/shipments/{id}/events with event_type == LOST, or with event_type == DELIVERED after must_infuse_by"
        actor: CollectionCenterOps | RegistryOperations
        preconditions:
          - "the shipment is IN_TRANSIT"
        side_effects:
          - "the shipment becomes DISCARDED; the case's claim keeps its collection and courier lines"

  - entity: CollectionBooking
    state_field: status
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /registry/collection-bookings/{id}/confirm"
        actor: CollectionCenterOps
        preconditions:
          - "X-User-ID equals collection_center_id"
          - "the donor calendar has no ACTIVE window overlapping the derived collection window"
        side_effects:
          - "confirmed_at is stamped"
          - "a COLLECTION_WINDOW DonorUnavailability row is created over the method-specific window, raising DonorProfile.blocked_day_count"
      - from: HELD
        to: SUPERSEDED
        trigger: "POST /registry/collection-bookings creating a replacement booking for the same WorkupCase"
        actor: CollectionCenterOps
        preconditions:
          - "the replacement carries a current expected_workup_case_version"
        side_effects:
          - "cancel_reason SUPERSEDED_BY_NEW_BOOKING is recorded and the center's committed_slot_minutes is released"
      - from: HELD
        to: CANCELLED
        trigger: "POST /registry/collection-bookings/{id}/cancel"
        actor: CollectionCenterOps | MedicalDirector
        preconditions:
          - "the booking is HELD"
        side_effects:
          - "CollectionCenter.committed_slot_minutes is released; cancelled_after_confirmation stays false so no cancellation fee is charged"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /registry/collection-bookings/{id}/cancel"
        actor: CollectionCenterOps | MedicalDirector
        preconditions:
          - "the booking is CONFIRMED and has no ProductShipment"
        side_effects:
          - "cancelled_after_confirmation becomes true, which adds the CANCELLATION line to the FINAL claim variant"
          - "the COLLECTION_WINDOW window becomes RELEASED and committed_slot_minutes is released"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /registry/collection-bookings/{id}/shipments"
        actor: CollectionCenterOps
        preconditions:
          - "the patient's conditioning_status == STARTED"
        side_effects:
          - "committed_slot_minutes keeps counting COMPLETED bookings; a ProductShipment is created"

  - entity: ProductShipment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, DISCARDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /registry/shipments/{id}/events with event_type == DEPARTED"
        actor: CollectionCenterOps
        preconditions:
          - "the shipment is SCHEDULED"
        side_effects:
          - "departed_at is stamped; WorkupCase.logistics_status becomes IN_TRANSIT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /registry/shipments/{id}/events with event_type == DELIVERED"
        actor: CollectionCenterOps | RegistryOperations
        preconditions:
          - "the current logical UTC instant is not after must_infuse_by"
        side_effects:
          - "delivered_at is stamped; WorkupCase.logistics_status becomes DELIVERED"
      - from: IN_TRANSIT
        to: DISCARDED
        trigger: "POST /registry/shipments/{id}/events with event_type == LOST, or event_type == DELIVERED filed after must_infuse_by"
        actor: CollectionCenterOps | RegistryOperations
        preconditions:
          - "the shipment is IN_TRANSIT"
        side_effects:
          - "delivered_at is stamped on the late-delivery path; WorkupCase.logistics_status becomes PRODUCT_LOST"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from POST /registry/patients/{id}/conditioning with action == ABORT"
        actor: system
        preconditions:
          - "the shipment has not departed"
        side_effects:
          - "no further transit events are accepted"

  - entity: ReimbursementClaim
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /registry/reimbursement-claims/{id}/finalize"
        actor: RegistryOperations
        preconditions:
          - "the claim's WorkupCase is in case_status COMPLETED, or the case has a booking with cancelled_after_confirmation == true"
        side_effects:
          - "variant_applied becomes FINAL and every monetary field is recomputed with a freshly read fx_rate_snapshot"
          - "finalized_at is stamped; Patient.committed_cost_cents moves by the FINAL minus PROVISIONAL delta"
      - from: PROVISIONAL
        to: VOID
        trigger: "system cascade from a clearance FAIL or a conditioning ABORT"
        actor: system
        preconditions:
          - "the claim is PROVISIONAL"
        side_effects:
          - "void_reason is recorded; Patient.committed_cost_cents drops by the claim's total_usd_cents"

concurrency_rules:
  - rule_id: booking-create-stale-workup
    parent_entity: WorkupCase
    write_endpoint: "POST /registry/collection-bookings"
    occ_field: "expected_workup_case_version"
    description: |
      Creating a CollectionBooking against a WorkupCase whose version has
      advanced since the client last read it is rejected. A booking create is
      a supersede operation: it legitimately replaces the case's prior HELD
      booking, so a writer holding a stale view of the case would otherwise
      discard a slot decision it never observed. The stale-version check turns
      that into a deterministic rejection.
    error_id: ERR_STALE_WORKUP_VERSION
    http_status: 412
  - rule_id: conditioning-schedule-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /registry/patients/{id}/conditioning"
    occ_field: "expected_patient_version"
    description: |
      Every conditioning action carries the Patient version the caller last
      observed. Because a re-schedule legitimately overwrites the previously
      recorded conditioning_start_date and cancels bookings that fall outside
      the new window, a writer whose view of the patient is stale is rejected
      rather than allowed to overwrite a timeline it never read.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

calculations:
  - name: match_probability_score
    trigger: "PRELIMINARY variant at POST /registry/search-requests (pool materialization); CONFIRMED variant at POST /registry/typing-requests/{id}/response"
    algorithm: weighted_scoring
    formula: |
      # matched_count(patient_typing, donor_typing, locus, compare_level):
      #   patient and donor each carry exactly 2 strings at the locus.
      #   compare_level == ALLELE  -> compare the full strings ("07:02")
      #   compare_level == ANTIGEN -> compare only the first field ("07")
      #   returns the size of the multiset intersection of the two 2-element
      #   lists, i.e. 0, 1 or 2 matched alleles at that locus
      #
      # weighted_sum = 0
      # for locus in [A, B, C, DRB1, DQB1]:            # fixed order, not data order
      #     compare_level = ANTIGEN if (variant == PRELIMINARY and
      #                                 locus in donor.ambiguous_loci) else ALLELE
      #     weighted_sum += LOCUS_WEIGHTS[locus] * matched_count(..., compare_level)
      #
      # base = 100 * weighted_sum / LOCUS_WEIGHT_TOTAL
      #   LOCUS_WEIGHT_TOTAL = 2 * sum(LOCUS_WEIGHTS.values()) = 9.6, the
      #   weighted sum of a perfect 10/10 match
      #
      # penalty = AMBIGUITY_PENALTY_PER_LOCUS * count(donor.ambiguous_loci)
      #           if variant == PRELIMINARY else 0
      #
      # bonus = age_bonus(donor.age_years)                      # AGE_BONUS table
      #       + (CMV_MATCH_BONUS if donor.cmv_status == patient.cmv_status else 0)
      #       + (DOMESTIC_BONUS if donor.registry.is_domestic else 0)
      #
      # raw = base - penalty + bonus
      # score = clamp(round_half_up(raw, 2), 0.00, 100.00)      # ONE rounding, at the end
      #
      # CONFIRMED variant additionally sets:
      #   matched_alleles = sum over the five loci of
      #                     matched_count(patient, reported_typing, locus, ALLELE)   # 0..10
      #   confirmed_match_grade = "<matched_alleles>/10"
    input_set: "Patient.hla_typing plus, for PRELIMINARY, DonorProfile.hla_typing_registry with DonorProfile.ambiguous_loci; for CONFIRMED, ConfirmatoryTypingRequest.reported_hla_typing (always allele-level, ambiguity penalty never applies)"
    constants:
      LOCUS_WEIGHTS: "{ A: 1.0, B: 1.0, C: 0.8, DRB1: 1.4, DQB1: 0.6 }"
      LOCUS_WEIGHT_TOTAL: 9.6
      AMBIGUITY_PENALTY_PER_LOCUS: 3.5
      AGE_BONUS: "{ 18..25: 4.0, 26..35: 2.0, 36..44: 0.5, 45..60: 0.0 }"
      CMV_MATCH_BONUS: 1.5
      DOMESTIC_BONUS: 1.0
      MIN_ACCEPTABLE_ALLELE_MATCHES: 9
    precision: "2 decimal places, round_half_up, applied exactly once to the final raw value; intermediate weighted sums are kept exact"
    variants:
      - name: PRELIMINARY
        when: "registry-level typing at search creation, before any confirmatory typing exists"
        difference: "loci listed in ambiguous_loci are compared at ANTIGEN level (first field only) AND each such locus costs AMBIGUITY_PENALTY_PER_LOCUS; stored in MatchCandidate.preliminary_score"
      - name: CONFIRMED
        when: "the registry answers the confirmatory typing request with allele-level typing"
        difference: "every locus is compared at ALLELE level and the ambiguity penalty is zero, so the same donor data yields a strictly different number; stored in MatchCandidate.confirmed_score together with confirmed_match_grade"
    note: |
      Worked example (canonical fixture): patient A 01:01/02:01, B 07:02/08:01,
      C 07:02/07:04, DRB1 15:01/03:01, DQB1 06:02/02:01, cmv_status POSITIVE.
      Domestic donor D1, age 27, cmv_status POSITIVE, ambiguous_loci ["C"],
      registry typing identical to the patient at A, B, C and DRB1 and matching
      one of two alleles at DQB1 -> PRELIMINARY 94.75, CONFIRMED 98.25,
      confirmed_match_grade "9/10".

  - name: candidate_rank_score
    trigger: "once per eligible donor during POST /registry/search-requests pool materialization"
    algorithm: weighted_scoring
    formula: |
      # age_factor       = min(100, max(0, 100 - AGE_FACTOR_SLOPE * abs(donor.age_years - AGE_FACTOR_IDEAL)))
      # logistics_factor =
      #     if donor.registry.is_domestic and donor.prior_donation_count == 0: 100
      #     elif donor.registry.is_domestic: max(40, 100 - PRIOR_DONATION_PENALTY * donor.prior_donation_count)
      #     else: min(70, INTL_BASE_FACTOR + TIER_BONUS * donor.registry.cooperation_tier)
      #
      # rank_score = round_half_up(
      #       RANK_W_SCORE     * candidate.preliminary_score
      #     + RANK_W_AGE       * age_factor
      #     + RANK_W_LOGISTICS * logistics_factor, 3)
    input_set: "every donor that survived the eligibility filter of candidate_pool_materialization, together with its Registry row"
    constants:
      RANK_W_SCORE: 0.55
      RANK_W_AGE: 0.25
      RANK_W_LOGISTICS: 0.20
      AGE_FACTOR_IDEAL: 27
      AGE_FACTOR_SLOPE: 2.5
      PRIOR_DONATION_PENALTY: 15
      INTL_BASE_FACTOR: 55
      TIER_BONUS: 5
    precision: "3 decimal places, round_half_up, applied once to the weighted sum; preliminary_score enters already rounded to 2 places"
    note: |
      Canonical fixtures: domestic D1 (age 27, prior 0, preliminary 94.75)
      -> 97.113. International D2 (EUR registry, cooperation_tier 2, age 41,
      prior 1, preliminary 86.58) -> 76.869. Domestic D3 (age 55, prior 0,
      preliminary 69.17) -> 65.544.

  - name: candidate_pool_materialization
    trigger: "POST /registry/search-requests, exactly once, inside the creation call"
    algorithm: threshold
    formula: |
      # eligible(donor) iff ALL of:
      #   donor.availability_status == AVAILABLE
      #   donor.registry.cooperation_status == ACTIVE
      #   DONOR_MIN_AGE <= donor.age_years <= DONOR_MAX_AGE
      #   (search.search_scope == DOMESTIC_AND_INTERNATIONAL or donor.registry.is_domestic)
      #   preliminary_score(donor) >= search.min_preliminary_score        # >= , not >
      #   donor has no MatchCandidate row in status WORKUP_OPEN or COLLECTED on any search
      #
      # order eligible donors by:
      #   rank_score DESC, then preliminary_score DESC, then DonorProfile.created_at ASC
      # keep the first MAX_CANDIDATES_MATERIALIZED rows; rank_position = 1..N
      # candidate_role = PRIMARY for rank 1, BACKUP for ranks 2..1+BACKUP_SLOTS,
      #                  ARCHIVED_POOL for the remainder
      # match_pool_size = N ; backup_candidate_count = number of BACKUP rows
      # if N == 0: search.status = NO_MATCH_FOUND and no MatchCandidate row is written
      #
      # Promotion cascade (invoked later, never re-ranking): the promotable
      # candidate with the smallest rank_position among rows with
      # candidate_role == BACKUP and status in {IDENTIFIED, TYPING_EXPIRED with
      # ct_attempt_count < MAX_CT_ATTEMPTS} becomes PRIMARY, recording
      # promoted_from_rank; the outgoing PRIMARY becomes ARCHIVED_POOL; the
      # ARCHIVED_POOL row with the smallest rank_position is NOT auto-promoted
      # into the vacated BACKUP slot.
    input_set: "all DonorProfile rows joined to their Registry, filtered by the eligibility predicate above; rank_position is frozen at materialization and never recomputed"
    constants:
      DONOR_MIN_AGE: 18
      DONOR_MAX_AGE: 60
      MIN_PRELIM_SCORE_DEFAULT: 60.00
      MAX_CANDIDATES_MATERIALIZED: 5
      BACKUP_SLOTS: 2
    precision: "scores compared at their stored precision (2 decimal places); no re-rounding during ordering"
    note: "Tie-break never uses id: rank_score DESC, preliminary_score DESC, DonorProfile.created_at ASC."

  - name: ct_deadline_and_expiry_sweep
    trigger: "deadline_at computed at POST /registry/match-candidates/{id}/typing-requests; expiry evaluated at POST /registry/search-requests/{id}/deadline-sweep"
    algorithm: chronological
    formula: |
      # deadline_at = requested_at
      #             + hours(registry.ct_response_deadline_hours)
      #             + hours(INTERNATIONAL_GRACE_HOURS if not registry.is_domestic else 0)
      #             - hours(PRIORITY_DEADLINE_REDUCTION_HOURS if request.priority_flag else 0)
      #
      # sweep(search):
      #   process this search's ConfirmatoryTypingRequest rows in status REQUESTED
      #   in created_at ASC order:
      #     if now > deadline_at:                       # STRICT: equality does NOT expire
      #         request.status = EXPIRED; request.expired_by_sweep_at = now
      #         candidate.status = TYPING_EXPIRED
      #         if candidate.candidate_role == PRIMARY and candidate.ct_attempt_count
      #            == MAX_CT_ATTEMPTS: candidate.status = EXCLUDED; run promotion cascade
      #   search.last_sweep_at = now
      #   if the search has NO candidate with candidate_role == PRIMARY in a
      #      non-terminal status AND no promotable BACKUP remains
      #      (backup_candidate_count == 0): search.status = STALLED
    input_set: "ConfirmatoryTypingRequest rows of the swept SearchRequest whose status == REQUESTED, processed in created_at ASC order"
    constants:
      INTERNATIONAL_GRACE_HOURS: 48
      PRIORITY_DEADLINE_REDUCTION_HOURS: 24
      MAX_CT_ATTEMPTS: 2
    precision: "whole hours added to the stored instant; comparison is exact to the second with a strict > test"
    note: |
      With the default clock 2026-08-01T00:00:00Z, a domestic registry whose
      ct_response_deadline_hours == 168 yields deadline_at
      2026-08-08T00:00:00Z; a sweep at exactly 2026-08-08T00:00:00Z does NOT
      expire the request, a sweep at 2026-08-08T00:00:01Z does. The same
      request raised against an international registry gets
      2026-08-10T00:00:00Z.

  - name: collection_window_derivation
    trigger: "evaluated at POST /registry/collection-bookings and at every conditioning re-schedule"
    algorithm: interval_merge
    formula: |
      # Conditioning dependency (whole calendar dates, both ends inclusive):
      #   legal_from = patient.conditioning_start_date + CONDITIONING_TO_COLLECTION_MIN_DAYS
      #   legal_to   = patient.conditioning_start_date + CONDITIONING_TO_COLLECTION_MAX_DAYS
      #   booking.collection_date must satisfy legal_from <= collection_date <= legal_to
      #
      # Donor blocking window created when a booking is CONFIRMED:
      #   offsets = METHOD_WINDOW_OFFSETS[booking.method]     # (before, after)
      #   date_from = collection_date - before ; date_to = collection_date + after
      #   day_count = date_to - date_from + 1                # = planned_window_days
      #
      # Product viability:
      #   must_infuse_by = shipment.collected_at + hours(VIABILITY_HOURS[booking.method])
    input_set: "the booking's WorkupCase, its candidate's donor, and the patient's conditioning_start_date"
    constants:
      CONDITIONING_TO_COLLECTION_MIN_DAYS: 6
      CONDITIONING_TO_COLLECTION_MAX_DAYS: 8
      METHOD_WINDOW_OFFSETS: "{ PBSC: (4, 1), MARROW: (1, 6) }"
      VIABILITY_HOURS: "{ PBSC: 72, MARROW: 48 }"
      METHOD_DURATION_MINUTES: "{ PBSC: 300, MARROW: 240 }"
      MIN_CD34_E6_PER_KG: 2.00
    precision: "dates are whole UTC calendar days, inclusive on both ends; instants are exact to the minute"
    note: |
      conditioning_start_date 2026-10-05 admits collection_date
      2026-10-11..2026-10-13 only. A PBSC booking on 2026-10-11 blocks the
      donor 2026-10-07..2026-10-12 (day_count 6); the same date booked as
      MARROW blocks 2026-10-10..2026-10-17 (day_count 8).

  - name: center_slot_conflict_detection
    trigger: "POST /registry/collection-bookings"
    algorithm: interval_merge
    formula: |
      # new_interval = [start_at, start_at + METHOD_DURATION_MINUTES[method])   # half-open
      # for each existing booking B of the same collection_center_id with
      #     B.status in {HELD, CONFIRMED, COMPLETED}:
      #   buffered = [B.start_at - TURNAROUND_BUFFER_MINUTES,
      #               B.end_at   + TURNAROUND_BUFFER_MINUTES)                   # half-open
      #   overlaps iff new_interval.start < buffered.end AND buffered.start < new_interval.end
      # conflicting = count of overlapping bookings
      # reject with ERR_CENTER_SLOT_CONFLICT iff
      #     conflicting >= center.concurrent_collection_capacity
      # committed_slot_minutes = sum of duration_minutes over the center's
      #     bookings in status HELD, CONFIRMED or COMPLETED
    input_set: "CollectionBooking rows of the same CollectionCenter in status HELD, CONFIRMED or COMPLETED; CANCELLED and SUPERSEDED rows are excluded"
    constants:
      TURNAROUND_BUFFER_MINUTES: 90
    precision: "minute precision; the interval is half-open so a booking starting exactly at a buffered interval's end does not overlap"
    note: |
      A PBSC booking 2026-10-11T08:00Z..13:00Z buffers to
      [06:30Z, 14:30Z). On a capacity-1 center a new 14:00Z booking overlaps
      and is rejected; a 14:30Z booking touches the boundary and succeeds.

  - name: donor_calendar_conflict_detection
    trigger: "POST /registry/donors/{id}/unavailability-windows and POST /registry/collection-bookings/{id}/confirm"
    algorithm: interval_merge
    formula: |
      # Whole-day CLOSED intervals, capacity 1, no buffer:
      #   conflict(a, b) iff a.date_from <= b.date_to AND b.date_from <= a.date_to
      # Only rows with status == ACTIVE participate. Adjacency is legal:
      #   a.date_to == b.date_from - 1 day is not a conflict.
      # blocked_day_count = sum of day_count over the donor's ACTIVE rows.
    input_set: "DonorUnavailability rows of the same donor whose status == ACTIVE; RELEASED rows never conflict"
    constants:
      DONOR_CALENDAR_CAPACITY: 1
      CLEARANCE_FAIL_DEFERRAL_DAYS: 90
      ADVERSE_EVENT_DEFERRAL_GRADE: 4
      IDM_VALIDITY_DAYS: 30
    precision: "whole UTC calendar dates, inclusive on both ends"
    note: |
      Deliberately different boundary semantics from
      center_slot_conflict_detection: closed inclusive whole days with
      capacity 1 and zero buffer, versus half-open minute intervals with a
      90-minute buffer and aggregate capacity.

  - name: reimbursement_claim_amount
    trigger: "PROVISIONAL variant at POST /registry/match-candidates/{id}/workup-cases (claim creation); FINAL variant at POST /registry/reimbursement-claims/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      # Lines are built in this PINNED order and each line is rounded to whole
      # cents BEFORE the sum (never sum-then-round). Zero lines stay present.
      #
      # 1 CT_TYPING        = CT_TYPING_FEE_CENTS * candidate.ct_attempt_count
      # 2 WORKUP_PHYSICAL  = WORKUP_PHYSICAL_FEE_CENTS
      # 3 IDM_PANEL        = IDM_PANEL_FEE_CENTS
      # 4 COLLECTION       = COLLECTION_FEE_CENTS[method_for_variant]
      # 5 COURIER          = round_half_up(COURIER_BASE_CENTS *
      #                        (1 + (COURIER_INTERNATIONAL_SURCHARGE_PCT
      #                              if not billing_registry.is_domestic else 0)))
      # 6 DONOR_LOST_WAGE  = DONOR_LOST_WAGE_PER_DAY_CENTS * window_days_for_variant
      # 7 CANCELLATION     = round_half_up(COLLECTION_FEE_CENTS[method_for_variant]
      #                        * CANCELLATION_FEE_PCT)   in the FINAL variant when the
      #                      case has a booking with cancelled_after_confirmation == true,
      #                      otherwise 0
      #
      # subtotal_usd_cents = exact integer sum of lines 1..7
      #
      # volume_discount_pct is selected from subtotal_usd_cents ALONE:
      #   subtotal >= DISCOUNT_TIER_2_CENTS -> DISCOUNT_TIER_2_PCT
      #   elif subtotal >= DISCOUNT_TIER_1_CENTS -> DISCOUNT_TIER_1_PCT
      #   else 0
      # discount_usd_cents = round_half_up(subtotal_usd_cents * volume_discount_pct)
      #
      # fee_base = subtotal_usd_cents - discount_usd_cents
      # intl_coordination_fee_usd_cents =
      #     round_half_up(fee_base * INTL_COORDINATION_FEE_PCT)
      #         if not billing_registry.is_domestic else 0
      #
      # total_usd_cents = subtotal_usd_cents - discount_usd_cents
      #                 + intl_coordination_fee_usd_cents
      # billed_amount_local_cents = round_half_up(total_usd_cents / fx_rate_snapshot)
    input_set: "the claim's WorkupCase, its MatchCandidate (for ct_attempt_count), the donor's Registry (currency, fx_rate_to_usd, is_domestic) and, for the FINAL variant, the case's CollectionBooking rows"
    constants:
      CT_TYPING_FEE_CENTS: 34500
      WORKUP_PHYSICAL_FEE_CENTS: 78000
      IDM_PANEL_FEE_CENTS: 52500
      COLLECTION_FEE_CENTS: "{ PBSC: 1450000, MARROW: 1980000 }"
      COURIER_BASE_CENTS: 265000
      COURIER_INTERNATIONAL_SURCHARGE_PCT: 0.35
      DONOR_LOST_WAGE_PER_DAY_CENTS: 32000
      CANCELLATION_FEE_PCT: 0.40
      INTL_COORDINATION_FEE_PCT: 0.08
      DISCOUNT_TIER_1_CENTS: 2500000
      DISCOUNT_TIER_1_PCT: 0.05
      DISCOUNT_TIER_2_CENTS: 4000000
      DISCOUNT_TIER_2_PCT: 0.09
      PROVISIONAL_ASSUMED_METHOD: PBSC
      PROVISIONAL_ASSUMED_WINDOW_DAYS: 6
    precision: "every line and every derived amount is a whole cent, round_half_up per line and per derived amount; volume_discount_pct is a rate, never rounded"
    variants:
      - name: PROVISIONAL
        when: "the claim is created together with the WorkupCase, i.e. before POST /registry/workup-cases/{id}/collection-method has decided anything"
        difference: "method_for_variant is forced to PROVISIONAL_ASSUMED_METHOD and window_days_for_variant to PROVISIONAL_ASSUMED_WINDOW_DAYS because no method exists yet; the CANCELLATION line is always 0; fx_rate_snapshot is the registry's fx_rate_to_usd read at creation"
      - name: FINAL
        when: "the claim is finalized after the case completed or after a confirmed booking was cancelled"
        difference: "method_for_variant is WorkupCase.collection_method and window_days_for_variant is WorkupCase.planned_window_days; the CANCELLATION line is charged when a confirmed booking of the case was cancelled; fx_rate_snapshot is re-read at finalize, so a registry whose fx_rate_to_usd changed in between yields a different billed_amount_local_cents for identical USD totals"
    note: |
      Verified fixtures. Domestic PBSC PROVISIONAL: lines 34500, 78000, 52500,
      1450000, 265000, 192000, 0 -> subtotal 2072000, discount 0, fee 0,
      total 2072000. Domestic MARROW FINAL: 34500, 78000, 52500, 1980000,
      265000, 256000, 0 -> subtotal 2666000, discount 133300, total 2532700.
      Domestic PBSC FINAL after a confirmed-booking cancellation: 34500, 78000,
      52500, 1450000, 265000, 192000, 580000 -> subtotal 2652000, discount
      132600, total 2519400. International (EUR, fx 1.0850) PBSC PROVISIONAL:
      courier 357750 -> subtotal 2164750, discount 0, fee 173180, total
      2337930, billed_amount_local_cents 2154774. International MARROW FINAL:
      subtotal 2758750, discount 137938, fee 209665, total 2830477,
      billed_amount_local_cents 2608735.

  - name: derived_counter_reconciliation
    trigger: "recomputed on every write that touches a booking, a donor calendar window or a claim"
    algorithm: aggregation
    formula: |
      # CollectionCenter.committed_slot_minutes =
      #     sum(duration_minutes) over bookings of the center with
      #     status in {HELD, CONFIRMED, COMPLETED}
      #
      # DonorProfile.blocked_day_count =
      #     sum(day_count) over DonorUnavailability rows of the donor with
      #     status == ACTIVE
      #
      # Patient.committed_cost_cents =
      #     sum(total_usd_cents) over ReimbursementClaim rows of the patient with
      #     status in {PROVISIONAL, FINALIZED}
      #
      # Registry.donor_count = count of DonorProfile rows whose registry_id
      #     equals the registry (every availability_status included)
      #
      # SearchRequest.match_pool_size = count of MatchCandidate rows of the search
      # SearchRequest.backup_candidate_count = count of those rows whose
      #     candidate_role == BACKUP AND status IN {IDENTIFIED,
      #     TYPING_REQUESTED, TYPING_RESPONDED, SCREENING_PASSED}
      #
      # Every counter is a pure re-derivation, so a cascade that cancels a
      # booking, releases a window or voids a claim must return the counter to
      # its pre-cascade value exactly.
    input_set: "the child rows enumerated above, filtered by the listed statuses; terminal-but-excluded rows (CANCELLED, SUPERSEDED, RELEASED, VOID) never contribute"
    constants: {}
    precision: "exact integers; no rounding"
    note: |
      Conserved quantities used by the compensating-invariant tests: a PBSC
      booking takes committed_slot_minutes 0 -> 300 and confirm/cancel returns
      it to 0; confirming that booking takes blocked_day_count 0 -> 6 and the
      cancel returns it to 0; opening the workup takes
      committed_cost_cents 0 -> 2072000 and voiding the claim returns it to 0.

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, types correct, enums in range, numeric bounds respected, hla typing objects carry all five loci with exactly two strings each, consented_methods non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PATCH and DELETE endpoints"
  - priority: 4
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints (GET /registry/donors, /registry/match-candidates, /registry/collection-bookings, /registry/reimbursement-claims and every sub-resource list)"
  - priority: 5
    category: existence
    check: "every id appearing in the path exists, validated left-to-right: ERR_PATIENT_NOT_FOUND, ERR_SEARCH_REQUEST_NOT_FOUND, ERR_DONOR_NOT_FOUND, ERR_MATCH_CANDIDATE_NOT_FOUND, ERR_TYPING_REQUEST_NOT_FOUND, ERR_WORKUP_CASE_NOT_FOUND, ERR_CLEARANCE_ITEM_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_REGISTRY_NOT_FOUND, ERR_UNAVAILABILITY_WINDOW_NOT_FOUND"
    error_id: ERR_MATCH_CANDIDATE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"
  - priority: 6
    category: existence
    check: "every FK supplied in the body exists, validated in the order the endpoint's input list declares them: ERR_PATIENT_NOT_FOUND, ERR_WORKUP_CASE_NOT_FOUND, ERR_COLLECTION_CENTER_NOT_FOUND"
    error_id: ERR_COLLECTION_CENTER_NOT_FOUND
    http_status: 404
    applies_to: "POST /registry/search-requests, POST /registry/collection-bookings"
  - priority: 7
    category: auth
    check: "for TransplantCoordinator, the target Patient's coordinating_user_id equals X-User-ID (reached through search_request -> patient for candidate-scoped calls)"
    error_id: ERR_PATIENT_NOT_OWNED
    http_status: 403
    applies_to: "POST /registry/patients/{id}/conditioning, POST /registry/search-requests, POST /registry/match-candidates/{id}/typing-requests, POST /registry/match-candidates/{id}/workup-cases"
  - priority: 8
    category: auth
    check: "for DonorRegistryLiaison, the target DonorProfile's registry_id equals X-User-ID (and for a typing response, the candidate's donor's registry_id equals X-User-ID)"
    error_id: ERR_REGISTRY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /registry/donors, POST /registry/donors/{id}/unavailability-windows, DELETE /registry/donors/{id}/unavailability-windows/{windowId}, POST /registry/donors/{id}/follow-ups, POST /registry/typing-requests/{id}/response, POST /registry/match-candidates/{id}/screening"
  - priority: 9
    category: auth
    check: "for CollectionCenterOps, the booking's collection_center_id equals X-User-ID"
    error_id: ERR_CENTER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /registry/collection-bookings, POST /registry/collection-bookings/{id}/confirm, POST /registry/collection-bookings/{id}/cancel, POST /registry/collection-bookings/{id}/shipments, POST /registry/shipments/{id}/events"
  - priority: 10
    category: auth
    check: "the X-User-ID deciding the collection method differs from the WorkupCase's physical_cleared_by_user_id (two-physician donor-safety rule)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /registry/workup-cases/{id}/collection-method"
  - priority: 11
    category: state
    check: "the SearchRequest is not in a terminal status (NO_MATCH_FOUND, FULFILLED) and not STALLED"
    error_id: ERR_SEARCH_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /registry/match-candidates/{id}/typing-requests, POST /registry/match-candidates/{id}/workup-cases"
  - priority: 12
    category: state
    check: "the MatchCandidate's status permits the requested operation: IDENTIFIED or TYPING_EXPIRED for a typing request, TYPING_RESPONDED or DEFERRED for screening, SCREENING_PASSED or WORKUP_OPEN for opening a workup case"
    note: "WORKUP_OPEN passes this rule so that the duplicate-workup attempt reaches priority 50 (ERR_DUPLICATE_OPEN_WORKUP) instead of being masked here; every other status is rejected at this priority."
    error_id: ERR_INVALID_CANDIDATE_STATE
    http_status: 409
    applies_to: "POST /registry/match-candidates/{id}/typing-requests, POST /registry/match-candidates/{id}/screening, POST /registry/match-candidates/{id}/workup-cases"
  - priority: 13
    category: state
    check: "the MatchCandidate's candidate_role == PRIMARY"
    error_id: ERR_CANDIDATE_NOT_PRIMARY
    http_status: 409
    applies_to: "POST /registry/match-candidates/{id}/workup-cases"
  - priority: 14
    category: state
    check: "the ConfirmatoryTypingRequest is in status REQUESTED"
    error_id: ERR_TYPING_REQUEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /registry/typing-requests/{id}/response"
  - priority: 15
    category: state
    check: "for a screening with outcome PASS the donor's availability_status == AVAILABLE"
    error_id: ERR_DONOR_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /registry/match-candidates/{id}/screening"
  - priority: 16
    category: state
    check: "the WorkupCase is in case_status OPEN"
    error_id: ERR_WORKUP_CASE_NOT_OPEN
    http_status: 409
    applies_to: "POST /registry/clearance-items/{id}/result, POST /registry/workup-cases/{id}/collection-method, POST /registry/collection-bookings"
  - priority: 17
    category: state
    check: "the ClearanceItem's result is still PENDING"
    error_id: ERR_CLEARANCE_ITEM_ALREADY_RESULTED
    http_status: 409
    applies_to: "POST /registry/clearance-items/{id}/result"
  - priority: 18
    category: state
    check: "clearance items are resulted in their created order: IDM_PANEL requires PHYSICAL_EXAM to carry result PASS, CONSENT requires both PHYSICAL_EXAM and IDM_PANEL to carry result PASS"
    error_id: ERR_CLEARANCE_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST /registry/clearance-items/{id}/result"
  - priority: 19
    category: state
    check: "the WorkupCase's collection_method is still null (logistics_status == UNSCHEDULED)"
    error_id: ERR_METHOD_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /registry/workup-cases/{id}/collection-method"
  - priority: 20
    category: state
    check: "the WorkupCase's collection_method is set (logistics_status is at least METHOD_SET)"
    error_id: ERR_METHOD_NOT_DECIDED
    http_status: 409
    applies_to: "POST /registry/collection-bookings"
  - priority: 21
    category: state
    check: "the WorkupCase's clearance_status == CLEARED"
    error_id: ERR_CLEARANCE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /registry/collection-bookings"
  - priority: 22
    category: state
    check: "the CollectionBooking is in status HELD"
    error_id: ERR_BOOKING_NOT_HELD
    http_status: 409
    applies_to: "POST /registry/collection-bookings/{id}/confirm"
  - priority: 23
    category: state
    check: "the CollectionBooking is in status HELD or CONFIRMED and has no ProductShipment"
    error_id: ERR_BOOKING_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /registry/collection-bookings/{id}/cancel"
  - priority: 24
    category: state
    check: "the CollectionBooking is in status CONFIRMED and has no ProductShipment yet"
    error_id: ERR_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /registry/collection-bookings/{id}/shipments"
  - priority: 25
    category: state
    check: "the patient's conditioning_status == STARTED"
    error_id: ERR_CONDITIONING_NOT_STARTED
    http_status: 409
    applies_to: "POST /registry/collection-bookings/{id}/shipments"
  - priority: 26
    category: state
    check: "the requested conditioning action is legal from the patient's current conditioning_status (SCHEDULE from NOT_SCHEDULED or SCHEDULED, START from SCHEDULED, INFUSE from STARTED, ABORT from SCHEDULED or STARTED)"
    error_id: ERR_INVALID_CONDITIONING_ACTION
    http_status: 409
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 27
    category: state
    check: "for action == SCHEDULE the patient has a SearchRequest in status WORKUP_ACTIVE; for action == START a CONFIRMED CollectionBooking exists for the patient's OPEN WorkupCase"
    error_id: ERR_CONDITIONING_PRECONDITION_UNMET
    http_status: 409
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 28
    category: state
    check: "for action == INFUSE a ProductShipment of the patient's WorkupCase is in status DELIVERED"
    error_id: ERR_PRODUCT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 29
    category: state
    check: "the shipment's status admits the event: DEPARTED only from SCHEDULED, DELIVERED and LOST only from IN_TRANSIT"
    error_id: ERR_SHIPMENT_EVENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /registry/shipments/{id}/events"
  - priority: 30
    category: state
    check: "the ReimbursementClaim is in status PROVISIONAL"
    error_id: ERR_CLAIM_NOT_PROVISIONAL
    http_status: 409
    applies_to: "POST /registry/reimbursement-claims/{id}/finalize"
  - priority: 31
    category: state
    check: "the claim's WorkupCase is in case_status COMPLETED, or the case has a CollectionBooking with cancelled_after_confirmation == true"
    error_id: ERR_CLAIM_NOT_FINALIZABLE
    http_status: 409
    applies_to: "POST /registry/reimbursement-claims/{id}/finalize"
  - priority: 32
    category: state
    check: "the DonorUnavailability row is ACTIVE and manually releasable: reason PERSONAL and MEDICAL_HOLD always, reason DEFERRAL only once the current logical date is later than the donor's deferral_until, reason COLLECTION_WINDOW never"
    error_id: ERR_WINDOW_NOT_RELEASABLE
    http_status: 409
    applies_to: "DELETE /registry/donors/{id}/unavailability-windows/{windowId}"
  - priority: 33
    category: state
    check: "expected_workup_case_version equals the WorkupCase's current version"
    error_id: ERR_STALE_WORKUP_VERSION
    http_status: 412
    applies_to: "POST /registry/collection-bookings"
  - priority: 34
    category: state
    check: "expected_patient_version equals the Patient's current version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 35
    category: business_safety
    check: "the IDM_PANEL clearance item has not expired for the requested collection date: booking.collection_date is on or before the UTC date of ClearanceItem.expires_at"
    error_id: ERR_IDM_RESULT_EXPIRED
    http_status: 422
    applies_to: "POST /registry/collection-bookings"
  - priority: 36
    category: business_safety
    check: "the requested collection method is contained in the donor's consented_methods"
    error_id: ERR_DONOR_METHOD_NOT_CONSENTED
    http_status: 422
    applies_to: "POST /registry/workup-cases/{id}/collection-method"
  - priority: 37
    category: business_safety
    check: "the screening outcome and deferral_type agree: PASS requires NONE and no deferral_until, DEFER requires TEMPORARY plus a deferral_until later than the current logical date, FAIL requires PERMANENT and no deferral_until"
    error_id: ERR_SCREENING_OUTCOME_MISMATCH
    http_status: 422
    applies_to: "POST /registry/match-candidates/{id}/screening"
  - priority: 38
    category: business_safety
    check: "severity_grade is 0 for every event_type other than ADVERSE_EVENT, and 1..5 for ADVERSE_EVENT"
    error_id: ERR_ADVERSE_EVENT_GRADE_INVALID
    http_status: 422
    applies_to: "POST /registry/donors/{id}/follow-ups"
  - priority: 39
    category: business_safety
    check: "the DELIVERED shipment's dose_adequacy == ADEQUATE before the patient may be infused"
    error_id: ERR_PRODUCT_DOSE_INADEQUATE
    http_status: 422
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 40
    category: business_referential
    check: "the donor's Registry has cooperation_status == ACTIVE"
    error_id: ERR_REGISTRY_NOT_COOPERATING
    http_status: 422
    applies_to: "POST /registry/match-candidates/{id}/typing-requests"
  - priority: 41
    category: business_referential
    check: "reported_hla_typing is allele-level (each string contains a colon) at all five loci"
    error_id: ERR_CT_TYPING_NOT_ALLELE_LEVEL
    http_status: 422
    applies_to: "POST /registry/typing-requests/{id}/response"
  - priority: 42
    category: business_temporal
    check: "the current logical UTC instant is not after the request's deadline_at"
    error_id: ERR_CT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /registry/typing-requests/{id}/response"
  - priority: 43
    category: business_temporal
    check: "conditioning_start_date is not earlier than the current logical UTC date"
    error_id: ERR_CONDITIONING_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 44
    category: business_temporal
    check: "date_to is not earlier than date_from"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /registry/donors/{id}/unavailability-windows"
  - priority: 45
    category: business_temporal
    check: "booking.collection_date lies within conditioning_start_date + 6 .. conditioning_start_date + 8 days, inclusive on both ends; the patient must already be SCHEDULED or STARTED"
    error_id: ERR_COLLECTION_OUTSIDE_CONDITIONING_WINDOW
    http_status: 422
    applies_to: "POST /registry/collection-bookings"
  - priority: 46
    category: business_temporal
    check: "the donor's derived collection window (or the requested manual window) does not overlap any ACTIVE DonorUnavailability row of the same donor, using closed inclusive whole-day comparison"
    error_id: ERR_DONOR_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /registry/donors/{id}/unavailability-windows, POST /registry/collection-bookings/{id}/confirm"
  - priority: 47
    category: business_temporal
    check: "the current logical UTC instant is not after the DELIVERED shipment's must_infuse_by"
    error_id: ERR_PRODUCT_VIABILITY_EXPIRED
    http_status: 422
    applies_to: "POST /registry/patients/{id}/conditioning"
  - priority: 48
    category: business_constraint
    check: "the number of the center's HELD, CONFIRMED and COMPLETED bookings whose 90-minute-buffered half-open interval overlaps the requested half-open interval is strictly below concurrent_collection_capacity"
    error_id: ERR_CENTER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /registry/collection-bookings"
  - priority: 49
    category: business_constraint
    check: "the candidate's ct_attempt_count is strictly below MAX_CT_ATTEMPTS"
    error_id: ERR_CT_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /registry/match-candidates/{id}/typing-requests"
  - priority: 50
    category: business_constraint
    check: "the candidate has no other WorkupCase in case_status OPEN"
    error_id: ERR_DUPLICATE_OPEN_WORKUP
    http_status: 409
    applies_to: "POST /registry/match-candidates/{id}/workup-cases"
  - priority: 51
    category: business_constraint
    check: "the patient has no SearchRequest in a non-terminal status (SEARCHING, PRIMARY_ENGAGED, WORKUP_ACTIVE, BACKUP_REQUIRED)"
    error_id: ERR_SEARCH_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /registry/search-requests"
  - priority: 52
    category: business_constraint
    check: "mrn is unique across all patients"
    error_id: ERR_MRN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /registry/patients"
  - priority: 53
    category: business_constraint
    check: "code is unique across all registries"
    error_id: ERR_REGISTRY_CODE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /registry/registries"
  - priority: 54
    category: business_constraint
    check: "donor_code is unique within the donor's registry_id"
    error_id: ERR_DONOR_CODE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /registry/donors"
  - priority: 55
    category: business_fiscal
    check: "Patient.committed_cost_cents plus the PROVISIONAL claim's total_usd_cents does not exceed Patient.case_budget_cents"
    error_id: ERR_PATIENT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /registry/match-candidates/{id}/workup-cases"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/registry/registries/{id}"
    description: "Read one registry, including its computed donor_count, its fx_rate_to_usd and its version"
    roles: [RegistryOperations, TransplantCoordinator, MedicalDirector, DonorRegistryLiaison, CollectionCenterOps]
    code: 200
    input: []
    output: Registry
    side_effects: []
  - method: GET
    path: "/registry/collection-centers/{id}"
    description: "Read one collection center, including its computed committed_slot_minutes"
    roles: [RegistryOperations, CollectionCenterOps, MedicalDirector, TransplantCoordinator]
    code: 200
    input: []
    output: CollectionCenter
    side_effects: []
  - method: GET
    path: "/registry/patients/{id}"
    description: "Read one patient, including conditioning_status, conditioning_start_date, committed_cost_cents and version"
    roles: [TransplantCoordinator, MedicalDirector, RegistryOperations]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/registry/patients/{id}/search-requests"
    description: "List the patient's search requests, newest last (created_at ASC); reverse-reachability channel for SearchRequest.patient_id"
    roles: [TransplantCoordinator, MedicalDirector, RegistryOperations]
    code: 200
    input: ["limit?", "offset?"]
    output: SearchRequest[]
    side_effects: []
  - method: GET
    path: "/registry/search-requests/{id}"
    description: "Read one search request, including status, match_pool_size, backup_candidate_count and last_sweep_at"
