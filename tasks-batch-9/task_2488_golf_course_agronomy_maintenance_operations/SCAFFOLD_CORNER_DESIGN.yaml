              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 4, daily_withdrawal_cap_gal: 50000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v_read: $.data.version }
            - call: "PATCH /pump-stations/${pump_id}/status"
              payload: { status: "OFFLINE" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
            - call: "PATCH /pump-stations/${pump_id}/status"
              payload: { status: "ONLINE" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green12_id}", window_start: "2026-08-02T04:00:00Z", window_end: "2026-08-02T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v_read}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /pump-stations/${pump_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_v_fresh: $.data.version, pump_status: $.data.status }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green12_id}", window_start: "2026-08-02T04:00:00Z", window_end: "2026-08-02T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v_fresh}" }
