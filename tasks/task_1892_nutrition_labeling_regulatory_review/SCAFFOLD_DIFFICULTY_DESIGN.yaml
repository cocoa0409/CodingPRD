  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, disjoint pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_review_state_beats_safety_rejected
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_RECIPE_NOT_LOCKED]
          - errors[ERR_ALLERGEN_STATEMENT_INCOMPLETE]
        distinguishing_aspect: |
          Error-category pair {state, business_safety}: submit-review with the recipe still
          DRAFT (state, priority 4) AND a contains_text omitting the WHEAT allergen
          (business_safety, priority 5) MUST return ERR_RECIPE_NOT_LOCKED — state outranks
          safety.
        test_recipe:
          setup:
            - "Client, product Cookie, recipe v1 DRAFT (never locked), US_FDA RACC, label with wrong contains_text 'Contains: None.'"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
