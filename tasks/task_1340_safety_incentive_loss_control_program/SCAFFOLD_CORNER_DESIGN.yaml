# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1340 — Safety Incentive & Loss Control Program
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: program_creation_defaults_applied
        claim_type: creation_defaults_computed
        grounds: [entities.SafetyProgram]
        distinguishing_aspect: "Creating a program without the optional knobs applies defaults (near_miss_floor_ratio 0.20, quorum_min 5), initializes computed fields (remaining_budget_cents == budget, posture NORMAL, status DRAFT) and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
          trigger:
            - { call: "GET /safety/programs/${p_id}", payload: {}, as: EHSAdmin, captures: { st: $.data.status, rem: $.data.remaining_budget_cents, floor: $.data.near_miss_floor_ratio, qm: $.data.quorum_min, v: $.data.version, post: $.data.posture } }
          assert:
            - "status == DRAFT; posture == NORMAL; version == 1"
            - "near_miss_floor_ratio == 0.20; quorum_min == 5 (defaults applied)"
            - "remaining_budget_cents == 500000 (initialized from incentive_budget_cents)"

      - name: program_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.SafetyProgram, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required program_year (or any required input) yields 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - call: "POST /safety/programs"
              payload: { scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: employee_auto_required_training_on_create
        claim_type: computed_fields
        grounds: [entities.Employee.fields.pending_required_training_count, entities.TrainingAssignment.fields.source]
        distinguishing_aspect: "Employee creation under a job role with a required course cascades a SYSTEM_JOB_HAZARD TrainingAssignment (required == true, due = logical now + 30 days) and sets pending_required_training_count == 1."
        test_recipe:
          setup: ["clock at 2026-06-01; HIGH course; HIGH job role requiring it"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "LOTO", hazard_class: "HIGH", validity_months: 12, renewal_window_days: 30 }, as: EHSAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/job-roles", payload: { title: "Electrician", hazard_class: "HIGH", required_course_ids: ["${c_id}"] }, as: EHSAdmin, captures: { jr_id: $.data.id } }
          trigger:
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-06-01" }, as: EHSAdmin, captures: { e_id: $.data.id, pending: $.data.pending_required_training_count } }
            - { call: "GET /safety/training-assignments", payload: { employee_id: "${e_id}" }, as: EHSAdmin, captures: { due: "$.data[0].due_date", src: "$.data[0].source", req: "$.data[0].required" } }
          assert:
            - "pending_required_training_count == 1"
            - "auto assignment: source == SYSTEM_JOB_HAZARD, required == true, status == ASSIGNED, due_date == 2026-07-01T00:00:00Z"

      - name: hazard_assess_invalid_severity_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Hazard.fields.severity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "severity outside 1..5 is a schema-level 400 even though the hazard is otherwise assessable."
        test_recipe:
          setup: ["ACTIVE program; employees A and M; one OPEN hazard"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Spill", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 6, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; hazard remains OPEN with risk_score null"

      - name: emr_forecast_snapshot_immutability
        claim_type: immutability
        grounds: [entities.EMRForecast]
        distinguishing_aspect: "EMRForecast has common_fields: false — the response carries id and created_at only (no version, no updated_at) and no update endpoint exists; values are a frozen valuation snapshot."
        test_recipe:
          setup: ["ACTIVE 2026 program (payroll 3 x $100000 @ elr 1.0 -> E $3000); zero claims; clock past year end so payroll_factor == 1.0"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin, captures: { p_v2: $.data.version } }
          trigger:
            - { call: "POST /safety/emr-forecasts", payload: { program_id: "${p_id}", expected_program_version: "${p_v2}" }, as: EHSAdmin, captures: { f_id: $.data.id, emr_f: $.data.emr_final, emr_p: $.data.emr_provisional } }
          assert:
            - "emr_final == 0.57 and emr_provisional == 0.57 (no claims: (0.95*165000 + 30000)/330000 = 0.5659 -> 0.57)"
            - "response contains no version field and no updated_at field (append-only snapshot)"

      - name: get_nonexistent_hazard_returns_not_found
        claim_type: not_found
        grounds: [ "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/hazards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: course_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List pagination honors limit/offset with total_count and has_more: 3 courses, limit 2 -> 2 rows + has_more true; offset 2 -> 1 row + has_more false."
        test_recipe:
          setup: ["three courses exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "C1", hazard_class: "LOW", validity_months: 12 }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "C2", hazard_class: "MODERATE", validity_months: 12 }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "C3", hazard_class: "HIGH", validity_months: 24 }, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/training-courses", payload: { limit: 2 }, as: EHSAdmin }
            - { call: "GET /safety/training-courses", payload: { limit: 2, offset: 2 }, as: EHSAdmin }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length == 1, total_count == 3, has_more == false"

      - name: contractor_create_retrieval_roundtrip
        claim_type: retrieval
        grounds: [entities.ContractorOrg]
        distinguishing_aspect: "Created contractor is retrievable by id with identical input fields; status DRAFT; prequal_score is null before submit."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Acme Erectors", contact_email: "safety@acme.example", emr: 0.9, trir: 1.5, safety_audit_pct: 88, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /safety/contractor-orgs/${c_id}", payload: {}, as: EHSAdmin, captures: { st: $.data.status, emr: $.data.emr } }
          assert:
            - "status == DRAFT; emr == 0.9 echoed; prequal_score == null (not yet submitted)"

  - section: state_machines
    instances:
      - name: hazard_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.Hazard]
        distinguishing_aspect: "A newly created hazard starts OPEN with risk_score/risk_band null until assess."
        test_recipe:
          setup: ["ACTIVE program; employees A and M"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Spill", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st: $.data.status, rs: $.data.risk_score } }
          assert:
            - "status == OPEN; risk_score == null; risk_band == null; sla_breached == false"

      - name: assess_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Hazard.OPEN_to_ASSESSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Assess is only valid from OPEN; a second assess on an ASSESSED hazard is rejected and changes nothing."
        test_recipe:
          setup: ["ACTIVE program; employees A and M; one OPEN hazard"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Spill", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 2, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 5, probability: 5 }, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; risk_score remains 4 from the first assess"

      - name: deny_claim_then_accept_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ClaimRecord, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DENIED is terminal: accept on a denied claim fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE program; manager M; one REPORTED claim"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-01", kind: "INDEMNITY", incurred_cents: 100000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { cl_id: $.data.id } }
            - { call: "POST /safety/claims/${cl_id}/deny", payload: { reason: "not work related" }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /safety/claims/${cl_id}/accept", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; claim remains DENIED"

      - name: cancelled_meeting_cannot_be_held
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CommitteeMeeting.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: hold on a cancelled meeting fails with ERR_INVALID_STATE and records no attendance."
        test_recipe:
          setup: ["ACTIVE program (quorum_min 1); committee member A; chair M; meeting created then cancelled"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_id: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_id}/cancel", payload: {}, as: CommitteeChair, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /safety/committee-meetings/${mt_id}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; meeting stays CANCELLED"

      - name: lcr_carrier_rejection_loop
        claim_type: valid_transition
        grounds: [state_machines.LossControlRecommendation.CARRIER_REJECTED_to_RESPONSE_SUBMITTED, state_machines.LossControlRecommendation.RESPONSE_SUBMITTED_to_CLOSED_ACCEPTED]
        distinguishing_aspect: "The carrier-rejection loop is exercised end to end: ISSUED -> RESPONSE_SUBMITTED -> CARRIER_REJECTED -> RESPONSE_SUBMITTED -> CLOSED_ACCEPTED."
        test_recipe:
          setup: ["ACTIVE program; manager M; one ISSUED recommendation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/loss-control-recommendations", payload: { program_id: "${p_id}", carrier_name: "Acme Mutual", priority: "HIGH", description: "Install machine guarding", due_date: "2026-09-01T00:00:00Z" }, as: CarrierConsultant, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /safety/loss-control-recommendations/${r_id}/respond", payload: { response_text: "Guards ordered" }, as: SafetyManager, as_user_id: "${m_id}", captures: { s1: $.data.status } }
            - { call: "POST /safety/loss-control-recommendations/${r_id}/review-response", payload: { outcome: "REJECT", review_note: "PO insufficient; need install proof" }, as: CarrierConsultant, captures: { s2: $.data.status } }
            - { call: "POST /safety/loss-control-recommendations/${r_id}/respond", payload: { response_text: "Install photos attached" }, as: SafetyManager, as_user_id: "${m_id}", captures: { s3: $.data.status } }
            - { call: "POST /safety/loss-control-recommendations/${r_id}/review-response", payload: { outcome: "ACCEPT" }, as: CarrierConsultant, captures: { s4: $.data.status } }
          assert:
            - "status sequence: RESPONSE_SUBMITTED -> CARRIER_REJECTED -> RESPONSE_SUBMITTED -> CLOSED_ACCEPTED"
            - "responded_by == ${m_id} on both responses; reviewed_by set on both reviews"

      - name: training_expire_reassign_complete_cycle
        claim_type: valid_transition
        grounds: [state_machines.TrainingAssignment.ASSIGNED_to_EXPIRED, state_machines.TrainingAssignment.EXPIRED_to_ASSIGNED, state_machines.TrainingAssignment.ASSIGNED_to_COMPLETED]
        distinguishing_aspect: "Sweep expiry then reassign then complete: cert_valid_until == completed_at + validity_months (2026-06-20 + 3 months = 2026-09-20)."
        test_recipe:
          setup: ["course validity_months 3; employee E with ASSIGNED assignment due 2026-06-10; program exists for sweep; clock advanced to 2026-06-15"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "HAZCOM", hazard_class: "LOW", validity_months: 3, renewal_window_days: 30 }, as: EHSAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-06-10T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { ta_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs/${p_id}/sweep", payload: {}, as: EHSAdmin, captures: { exp: $.data.expired_assignments } }
          trigger:
            - { call: "POST /safety/training-assignments/${ta_id}/reassign", payload: { due_date: "2026-06-25T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { st1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-assignments/${ta_id}/complete", payload: {}, as: Supervisor, as_user_id: "${e_id}", captures: { st2: $.data.status, cvu: $.data.cert_valid_until } }
          assert:
            - "sweep expired_assignments == 1 (ASSIGNED past due -> EXPIRED)"
            - "reassign -> ASSIGNED with due_date 2026-06-25"
            - "complete -> COMPLETED with cert_valid_until == 2026-09-20T00:00:00Z"

      - name: observation_no_action_earns_no_points
        claim_type: side_effect_absence
        grounds: [state_machines.Observation.SUBMITTED_to_NO_ACTION, entities.IncentiveEvent]
        distinguishing_aspect: "Triage NO_ACTION is terminal and creates zero IncentiveEvents — only validated observations pay, which is the anti-underreporting guard against report farming."
        test_recipe:
          setup: ["ACTIVE program; reporter A; triager M"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Faded sign", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /safety/observations/${o_id}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st: $.data.status } }
            - { call: "GET /safety/incentive-events", payload: { program_id: "${p_id}", employee_id: "${a_id}" }, as: EHSAdmin }
          assert:
            - "observation status == NO_ACTION (terminal)"
            - "GET /safety/incentive-events?employee_id=${a_id} returns zero rows (no points for NO_ACTION)"

      - name: employee_deactivate_cancels_open_training
        claim_type: cascade_down
        grounds: [state_machines.Employee.ACTIVE_to_INACTIVE, state_machines.TrainingAssignment.ASSIGNED_to_CANCELLED]
        distinguishing_aspect: "Deactivation cascades: the employee's ASSIGNED auto-required assignment becomes CANCELLED and pending_required_training_count drops 1 -> 0."
        test_recipe:
          setup: ["HIGH role requiring LOTO course; employee E created (auto assignment ASSIGNED, pending count 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "LOTO", hazard_class: "HIGH", validity_months: 12 }, as: EHSAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/job-roles", payload: { title: "Electrician", hazard_class: "HIGH", required_course_ids: ["${c_id}"] }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /safety/employees/${e_id}/deactivate", payload: {}, as: EHSAdmin, captures: { pending: $.data.pending_required_training_count } }
            - { call: "GET /safety/training-assignments", payload: { employee_id: "${e_id}" }, as: EHSAdmin, captures: { st: "$.data[0].status" } }
          assert:
            - "employee status == INACTIVE; pending_required_training_count == 0"
            - "the auto assignment status == CANCELLED"

      - name: meeting_overlap_adjacency
        claim_type: precondition_enforcement
        grounds: [calculations.meeting_overlap, "errors[ERR_MEETING_OVERLAP]"]
        excluded_because:
          difficulty_instance: meeting_half_open_overlap
          rationale: "Adjacency-allowed and strict-intersection rejection both asserted in the named §1.8 instance."

      - name: certification_window_boundary
        claim_type: precondition_enforcement
        grounds: [calculations.certification_window, "errors[ERR_CERTIFICATION_ACTIVE]"]
        excluded_because:
          difficulty_instance: certification_renewal_window_suppression
          rationale: "Blocked at 31 days remaining and allowed at exactly 30 days are both asserted in the named §1.8 instance."

      - name: control_verify_fail_revision_fields
        claim_type: side_effect_execution
        grounds: [state_machines.ControlItem.IMPLEMENTED_to_PLANNED]
        excluded_because:
          difficulty_instance: hazard_verification_revision_loop
          rationale: "FAIL path (status PLANNED, new due_date, hazard loops to IN_PROGRESS) is asserted in the named §1.8 instance."

  - section: calculations
    instances:
      - name: risk_score_band_and_sla_boundaries
        claim_type: boundary_edge
        grounds: [calculations.hazard_risk_score]
        distinguishing_aspect: "Band edges: score 4 (4x1) is LOW with a 60-day SLA; score 16 (4x4) is CRITICAL with a 7-day SLA — assessed 2026-06-01 gives sla due 2026-07-31 vs 2026-06-08."
        test_recipe:
          setup: ["ACTIVE program; employees A and M; two OPEN hazards"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Minor", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h1: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L2", description: "Severe", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h2: $.data.id } }
          trigger:
            - { call: "POST /safety/hazards/${h1}/assess", payload: { severity: 4, probability: 1 }, as: SafetyManager, as_user_id: "${m_id}", captures: { s1: $.data.risk_score, b1: $.data.risk_band, d1: $.data.response_sla_due } }
            - { call: "POST /safety/hazards/${h2}/assess", payload: { severity: 4, probability: 4 }, as: SafetyManager, as_user_id: "${m_id}", captures: { s2: $.data.risk_score, b2: $.data.risk_band, d2: $.data.response_sla_due } }
          assert:
            - "hazard 1: risk_score == 4, risk_band == LOW, response_sla_due == 2026-07-31T00:00:00Z"
            - "hazard 2: risk_score == 16, risk_band == CRITICAL, response_sla_due == 2026-06-08T00:00:00Z"

      - name: leading_indicator_rate_normalization_and_exclusion
        claim_type: input_set_filtering
        grounds: [calculations.leading_indicator_rates]
        distinguishing_aspect: "Only triaged observations (LINKED|NO_ACTION|CLOSED) count; a SUBMITTED one is excluded: 3 triaged of 4 total over 100000 hours -> rate 6.0 per 200k hours, ratio 0.3333, target_met true at target 5.0."
        test_recipe:
          setup: ["ACTIVE program exposure_hours 100000 target 5.0; reporter A; triager M; 2 OBSERVATION + 1 NEAR_MISS triaged NO_ACTION; 1 more OBSERVATION left SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "O1", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o1: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "O2", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o2: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "NEAR_MISS", description: "N1", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o3: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "O3 untriaged", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}" }
            - { call: "POST /safety/observations/${o1}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o2}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o3}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "GET /safety/programs/${p_id}/leading-indicators", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { rate: $.data.observation_rate, ratio: $.data.near_miss_ratio, tm: $.data.target_met, oc: $.data.observation_count } }
          assert:
            - "observation_count == 3 (SUBMITTED observation excluded), near_miss_count == 1"
            - "observation_rate == 6.0 (3 * 200000 / 100000)"
            - "near_miss_ratio == 0.3333 (1/3 rounded half-up to 4dp)"
            - "target_met == true (6.0 >= 5.0); integrity_flag == false (no accepted claims)"

      - name: emr_medical_only_era_factor
        claim_type: constants_applied
        grounds: [calculations.emr_forecast, entities.ClaimRecord.fields.effective_incurred_cents]
        distinguishing_aspect: "ERA-style factor: MEDICAL_ONLY claims carry effective_incurred_cents = round_half_up(incurred * 0.3) — 800000c -> 240000c — while INDEMNITY passes through unscaled."
        test_recipe:
          setup: ["ACTIVE program; manager M"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-01", kind: "MEDICAL_ONLY", incurred_cents: 800000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { eff_mo: $.data.effective_incurred_cents } }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-02", kind: "INDEMNITY", incurred_cents: 100001 }, as: SafetyManager, as_user_id: "${m_id}", captures: { eff_in: $.data.effective_incurred_cents } }
          assert:
            - "MEDICAL_ONLY: effective_incurred_cents == 240000 (0.3 x 800000)"
            - "INDEMNITY: effective_incurred_cents == 100001 (identity)"

      - name: award_tier_boundary_exactly_50_silver
        claim_type: boundary_edge
