scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: property_chronic_score_provisional_vs_reviewed
        grounds:
          - calculations.property_chronic_score
          - entities.Property.fields.provisional_chronic_score
          - entities.Property.fields.chronic_score
          - entities.Property.fields.chronic_flag
          - endpoints[POST /vector-control/inspections/{id}/assessments]
          - endpoints[POST /vector-control/inspections/{id}/complete]
        distinguishing_aspect: |
          The dual variant lives on the Property risk domain: the PROVISIONAL variant copies
          the newest Assessment's infestation_index verbatim (66.50) while the REVIEWED
          variant recomputes a 30-day-step decayed weighted mean over the parcel's 365-day
          assessment history plus an 8.00 repeat-offence surcharge (65.03), and only the
          REVIEWED variant is allowed to flip chronic_flag.
        test_recipe:
          setup:
            - "Zone Riverside, owner Dana Ruiz, parcel APN-1001, one FIELD_INSPECTOR and one SUPERVISOR exist"
            - "A first complaint was inspected on 2026-01-25T10:00:00Z with an assessment scoring 43.50 (MODERATE), leaving chronic_score 43.50 and chronic_flag false"
            - "A second complaint on the same parcel is in progress on 2026-05-05, exactly 100 days after the first completion"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St", notice_preference: "CERTIFIED_MAIL", hardship_certified: false }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI", unit_count: 6 }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "HIGH", reporter_name: "Ann Park" }
              as: IntakeClerk
              captures: { comp1_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp1_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp1_id}", officer_id: "${insp1_id}", scheduled_start: "2026-01-25T09:00:00Z", scheduled_end: "2026-01-25T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { insp1_visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-25T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${insp1_visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/inspections/${insp1_visit_id}/assessments"
              payload: { harborage_score: 4, attractant_score: 4, sanitation_score: 3, burrow_count: 2, evidence_photo_count: 2 }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-25T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${insp1_visit_id}/complete"
              payload: { result: "VIOLATION_FOUND", notes: "Harborage confirmed" }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "GARBAGE_ACCUMULATION", reporter_type: "AGENCY", description: "Refuse piled behind the building", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp2_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp2_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp2_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { insp2_visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${insp2_visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
          trigger:
            - call: "POST /vector-control/inspections/${insp2_visit_id}/assessments"
              payload: { harborage_score: 6, attractant_score: 6, sanitation_score: 5, burrow_count: 3, evidence_photo_count: 4 }
              as: Inspector
              as_user_id: "${insp1_id}"
              captures: { assess2_index: $.data.infestation_index }
            - call: "GET /vector-control/properties/${prop_id}"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { prov_score: $.data.provisional_chronic_score }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${insp2_visit_id}/complete"
              payload: { result: "VIOLATION_FOUND" }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "GET /vector-control/properties/${prop_id}"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { reviewed_score: $.data.chronic_score }
          assert:
            - "Assessment.infestation_index of the second assessment == 66.50 with infestation_tier == SEVERE"
            - "Property.${prop_id}.provisional_chronic_score == 66.50 immediately after the assessment POST"
            - "Property.${prop_id}.chronic_flag == false immediately after the assessment POST"
            - "Property.${prop_id}.chronic_score == 65.03 after the completion (weights 0.7 for the 100-day-old 43.50 and 1.0 for the new 66.50, weighted mean 57.03, plus 8.00 repeat-offence surcharge)"
            - "A single GET on the parcel returns provisional_chronic_score 66.50 and chronic_score 65.03 on the same row, so the two variants differ by 1.47"
            - "Property.${prop_id}.chronic_flag == true after the completion"

      - name: invoice_estimate_vs_final_total
        grounds:
          - calculations.cost_recovery_invoice_total
          - entities.CostRecoveryInvoice.fields.estimated_total_cents
          - entities.CostRecoveryInvoice.fields.final_total_cents
          - endpoints[POST /vector-control/cost-recovery-invoices]
          - endpoints[POST /vector-control/cost-recovery-invoices/{id}/approve]
        distinguishing_aspect: |
          The second dual variant lives on the CostRecoveryInvoice money domain, not on the
          Property risk domain: the ESTIMATE run at invoice creation bills the SEVERE tier
          standard of 8 labour hours and a 25000-cent material allowance (123257 cents) while
          the FINAL run at approval bills the crew's recorded 5.5 hours and 18750 cents
          (86807 cents), and both numbers remain readable on the same row.
        test_recipe:
          setup:
            - "A SEVERE-tier abatement order on parcel APN-1001 has been served, an educational advisory has been served on it, one re-inspection returned NON_COMPLIANT so escalation_level is 1, and the city abated the nuisance with 5.5 crew hours and 18750 cents of materials"
            - "The owner is not hardship certified"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St", notice_preference: "CERTIFIED_MAIL", hardship_certified: false }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
