            - { call: "POST /actual-collections", payload: { source_id: "${src_pit}", fiscal_year: 2027, actual_amount_cents: 1296456684 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { act: $.data.id } }
            - { call: "POST /actual-collections", payload: { source_id: "${src_pit}", fiscal_year: 2027, actual_amount_cents: 1296456684 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err: $.data.error_id } }
          assert:
            - "first trigger: HTTP 201; ActualCollection.${act}.matched_cycle_id == ${cyc}, matched_forecast_cents == 1296456684, abs_pct_error_bps == 0, error_direction == EXACT"
