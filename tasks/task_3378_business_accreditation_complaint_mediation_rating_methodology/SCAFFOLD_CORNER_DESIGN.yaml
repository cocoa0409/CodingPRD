      - name: dispute_referencing_other_business_snapshot_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_SNAPSHOT_BUSINESS_MISMATCH
        distinguishing_aspect: "A dispute filed on business B naming a snapshot of business A is a 422 ERR_SNAPSHOT_BUSINESS_MISMATCH (referential check), even with a correct OCC version for B."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; LARGE businesses A and B; a PUBLISHED snapshot exists only for A."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - &k_biz_a
              call: "POST /businesses"
              payload: { legal_name: "Rated A LLC", home_state_code: "IA", employee_count: 250, founded_on: "2018-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_a_id: $.data.id }
            - call: "POST /businesses/${biz_a_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { snap_a_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Unrated B LLC", home_state_code: "IA", employee_count: 250, founded_on: "2018-01-01T00:00:00Z" }
