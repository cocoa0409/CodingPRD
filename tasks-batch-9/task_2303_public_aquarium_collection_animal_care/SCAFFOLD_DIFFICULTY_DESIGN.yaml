  - name: nonlinear_quarantine_extend_resume_cycle_then_extension_ceiling
    grounds:
    - §1.2 QuarantineCase ACTIVE -> EXTENDED and EXTENDED -> ACTIVE (cycle)
    - §1.1 QuarantineCase.extension_count / total_extension_days / projected_release_at / status
    - §1.3 quarantine_required_days (projected_release_at = started_at + protocol_days + total_extension_days)
    - §1.4 priority 12 ERR_INVALID_ACTION, priority 39 ERR_ROUND_LIMIT_EXCEEDED
    - §1.5 POST /aquarium/quarantine-cases/{id}/reviews
    distinguishing_aspect: ACTIVE is re-entered after every RESUME, so the pair (status, extension_count) — not status alone — decides legality, and the release date must move by the cumulative total_extension_days rather than by the last extension. CLEAR from EXTENDED is a distinct failure (ERR_INVALID_ACTION at priority 12) from CLEAR before the release date (ERR_QUARANTINE_NOT_COMPLETE at priority 21).
    test_recipe:
      setup: A TELEOST specimen with base_quarantine_days 30 arrives on 2026-08-01, giving an ACTIVE quarantine case with protocol_days 30 and projected_release_at 2026-08-31T00:00:00Z. The clock stays at 2026-08-01 so no CLEAR can ever succeed during the trigger.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {spec_id: $.data.id}
      - call: GET /aquarium/specimens/${spec_id}/quarantine-cases
        payload: {}
        as: VeterinaryOfficer
        captures: {qc_id: '$.data[0].id'}
      trigger:
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: EXTEND, extension_days: 10, reason: gill biopsy pending}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: CLEAR}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
        captures: {err: $.data.error_id}
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: RESUME}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: EXTEND, extension_days: 10, reason: second biopsy}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: RESUME}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: EXTEND, extension_days: 5, reason: third biopsy}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-reviewer
        captures: {err: $.data.error_id}
      assert:
      - 'trigger[0]: status == EXTENDED, extension_count == 1, total_extension_days == 10, projected_release_at == ''2026-09-10T00:00:00Z'''
      - 'trigger[1]: 422 ERR_INVALID_ACTION — CLEAR is not a declared outcome from EXTENDED (RESUME first); this is priority 12, not the priority 21 quarantine-not-complete complaint'
      - 'trigger[2]: status back to ACTIVE with extension_count still 1 and projected_release_at still ''2026-09-10T00:00:00Z'''
      - 'trigger[3]: status == EXTENDED, extension_count == 2, total_extension_days == 20, projected_release_at == ''2026-09-20T00:00:00Z'' — the ceiling itself is allowed'
      - 'trigger[4]: status back to ACTIVE'
      - 'trigger[5]: 409 ERR_ROUND_LIMIT_EXCEEDED because 2 + 1 > QUARANTINE_MAX_EXTENSIONS 2; status stays ACTIVE, extension_count stays 2, total_extension_days stays 20'
      - Specimen.disposition_status is QUARANTINE for the whole trigger and QuarantineCase.clearance_exam_count is 0
- rule_id: transitive_cascade
  rationale: Three named cascades of depth 5, 5 and 3, each traversing at least three entity types and each with a link that is caused by the previous link rather than by the request.
  instances:
  - name: cascade_a_critical_reading_closes_exhibit_and_auto_disables_programme
    grounds:
    - §1.2 LifeSupportSystem NORMAL -> CRITICAL (CASCADE A links 1-5)
    - §1.3 water_quality_index, §1.3 exhibit_posture
    - §1.2 Exhibit OPEN -> CLOSED, §1.2 InteractionSession SCHEDULED -> SUSPENDED
    - §1.1 Exhibit.posture / last_posture_reason / suspended_session_count / interaction_program_enabled
    - §1.1 InteractionSession.status / suspension_reason
    - §1.5 POST /aquarium/life-support-systems/{id}/water-quality-readings
    distinguishing_aspect: 'Depth 5 from a single POST: reading severity -> plant alarm -> exhibit posture -> session suspension -> suspended_session_count -> programme auto-disable. Links 4 and 5 are caused by link 3, not by the request, so the auto-disable only fires because TWO sessions were suspended in the same request — INTERACTION_AUTO_DISABLE_THRESHOLD is 2.'
    test_recipe:
      setup: One COLD_MARINE plant serving one exhibit whose interaction programme is enabled, with two SCHEDULED sessions on 2026-08-02 separated by exactly the 30-minute turnover buffer so both are legal. Clock at 2026-08-01T12:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T12:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {ses1_id: $.data.id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T11:30:00Z', ends_at: '2026-08-02T12:30:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {ses2_id: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T10:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.05, nitrite_mg_l: 0.02}
        as: AquaristTechnician
        captures: {sev: $.data.severity, idx: $.data.water_quality_index_snapshot}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v2: $.data.version}
      assert:
      - 'link 1: the reading response carries severity == CRITICAL, water_quality_index_snapshot == 58.00 (ammonia ratio (0.050-0.020)/0.030*2 = 2.00 exactly; 100 - (6*2.00 + 15*2.00) = 58.00) and breach_parameters == [''ammonia_mg_l'']'
      - 'link 1: LifeSupportSystem.alarm_state == CRITICAL, water_quality_index == 58.00, consecutive_breach_readings == 1, consecutive_normal_readings == 0'
      - 'link 2: the served Exhibit has posture == CLOSED and last_posture_reason == ''LSS_CRITICAL'''
      - 'link 3: both InteractionSession rows have status == SUSPENDED and suspension_reason == ''EXHIBIT_CLOSED'', processed in created_at ascending order'
      - 'link 4: Exhibit.suspended_session_count == 2'
      - 'link 5: Exhibit.interaction_program_enabled == false because suspended_session_count reached INTERACTION_AUTO_DISABLE_THRESHOLD 2'
      - a subsequent POST /aquarium/interaction-sessions on that exhibit now fails at priority 15 with ERR_EXHIBIT_CLOSED, and would fail at priority 18 with ERR_INTERACTION_PROGRAM_DISABLED once the plant recovers
      - the suspended sessions are NOT reinstated by any later NORMAL reading; they require an explicit REINSTATE
  - name: cascade_b_mortality_suspends_plan_and_revokes_downstream_permit
    grounds:
    - §1.2 Specimen ON_EXHIBIT -> DECEASED and HEALTHY -> DECEASED_PENDING_NECROPSY (CASCADE B links 1-5)
    - §1.2 CollectionPlanEntry APPROVED -> SUSPENDED, §1.2 AcquisitionRequest PENDING_PERMIT -> CANCELLED, §1.2 Permit ISSUED -> REVOKED
    - §1.3 exhibit_bioload_ledger, §1.3 exhibit_posture
    - §1.1 CollectionPlanEntry.suspension_reason, AcquisitionRequest.closure_reason, Permit.decision_reason
    - §1.5 POST /aquarium/specimens/{id}/mortality
    distinguishing_aspect: 'Depth 5 across five entity types from one POST: specimen -> auto-created necropsy case and exhibit ledger -> plan entry suspension -> sibling acquisition-request cancellation -> permit revocation. The plan entry is only suspended because the DECEASED animal was the exhibit''s LAST specimen of that species, and the sibling request is only cancelled because the plan entry moved — neither is reachable from the request payload.'
    test_recipe:
      setup: One exhibit holding exactly one specimen of a TELEOST species under an APPROVED plan entry with planned_count 2. A SECOND acquisition request under the same plan entry is in PENDING_PERMIT with an ISSUED import permit, so links 4 and 5 have something to hit. The first request is already FULFILLED and must stay untouched because FULFILLED is terminal.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
