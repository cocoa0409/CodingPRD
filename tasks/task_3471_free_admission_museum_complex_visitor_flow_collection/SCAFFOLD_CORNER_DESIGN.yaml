              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Borrower One", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 400000000, coverage_type: "INDEMNITY", courier_required: true }
              as: LoansOfficer
              captures: { l1: $.data.id, v1: $.data.version }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Borrower Two", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 600000000, coverage_type: "INDEMNITY", courier_required: false }
              as: LoansOfficer
              captures: { l2: $.data.id, v2: $.data.version }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Borrower Three", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 600000000, coverage_type: "INDEMNITY", courier_required: true }
              as: LoansOfficer
              captures: { l3: $.data.id, v3: $.data.version }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Borrower Four", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 150000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { l4: $.data.id, v4: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${l1}/accept"
              payload: { expected_loan_version: "${v1}" }
              as: BorrowerRep
              captures: { e1: $.data.error_id }
            - call: "POST /campus/loan-agreements/${l2}/accept"
              payload: { expected_loan_version: "${v2}" }
              as: BorrowerRep
              captures: { e2: $.data.error_id }
            - call: "POST /campus/loan-agreements/${l3}/accept"
              payload: { expected_loan_version: "${v3}" }
              as: BorrowerRep
              captures: { prem3: $.data.premium_cents }
            - call: "POST /campus/loan-agreements/${l4}/accept"
              payload: { expected_loan_version: "${v4}" }
              as: BorrowerRep
              captures: { e4: $.data.error_id }
          assert:
            - "L1 accept fails e1 == ERR_INDEMNITY_MINIMUM_NOT_MET (400000000 < 500000000)"
            - "L2 accept fails e2 == ERR_INDEMNITY_REQUIRES_COURIER"
            - "L3 accept succeeds: status AGREED and prem3 == 0 (federal indemnity replaces a commercial premium)"
            - "L4 accept fails e4 == ERR_COURIER_REQUIRED (150000000 >= 100000000 requires a courier under INSURANCE)"
            - "all failed accepts leave their loans PROPOSED (rejections are non-destructive)"

