              captures: { cyc_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: PipelineScheduler
          trigger:
            - call: "POST /pipeline/cycles/${cyc_id}/close"
              payload: {}
              as: PipelineScheduler
            - call: "POST /pipeline/cycles/${cyc_id}/prorate"
              payload: {}
              as: PipelineScheduler
          assert:
            - "NominationCycle.${cyc_id}.status == PRORATED"
            - "NominationCycle.${cyc_id}.proration_factor == 1.000000"
            - "NominationCycle.${cyc_id}.effective_capacity_bbl == 100000"
            - "NominationCycle.${cyc_id}.nominated_total_bbl == 0 and NominationCycle.${cyc_id}.allocated_total_bbl == 0"
            - "NominationCycle.${cyc_id}.unallocated_capacity_bbl == 100000"
            - "NominationCycle.${cyc_id}.derate_pct_applied == 0"
            - "both trigger responses are 200 (neither close nor prorate errors on the empty set)"

