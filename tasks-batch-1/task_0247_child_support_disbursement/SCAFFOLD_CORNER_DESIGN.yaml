            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 45000, coverage_start_at: "2026-07-01T00:00:00Z", coverage_end_at: "2026-12-31T00:00:00Z" }
              as: CaseWorker
              captures: { mod_id: "$.data.id" }
            - call: "POST /sdu/modifications/${mod_id}/submit"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /sdu/modifications/${mod_id}/decide"
              payload: { decision: "APPROVE" }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no recognized X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sdu/support-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_enforcement_propose
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enforcement-propose-stale-order]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A POST /sdu/enforcement-actions carrying a stale expected_support_order_version (the value observed before a prior enforcement bumped the order) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "ACTIVE order arrears principal 50000; one enforcement already proposed then withdrawn (order version advanced twice; a second propose is state-legal because enforcement is back to NONE)."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1027" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver_stale: "$.data.version" }
            - call: "POST /sdu/enforcement-actions"
              payload: { support_order_id: "${o_id}", action_type: "TAX_INTERCEPT", expected_support_order_version: "${o_ver_stale}" }
              as: CaseWorker
              captures: { enf1_id: "$.data.id" }
            - call: "POST /sdu/enforcement-actions/${enf1_id}/withdraw"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /sdu/enforcement-actions"
              payload: { support_order_id: "${o_id}", action_type: "LICENSE_SUSPENSION", expected_support_order_version: "${o_ver_stale}" }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_version_on_modification_apply
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[modification-apply-stale-order]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Applying an APPROVED modification with a stale expected_support_order_version (observed before another modification was applied) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "ACTIVE order with two APPROVED non-overlapping modifications M1, M2; client captures the order version, then M1 is applied (order → MODIFIED, version bumped), leaving the captured version stale for M2."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1028" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 40000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 50000, coverage_start_at: "2026-01-01T00:00:00Z", coverage_end_at: "2026-06-29T00:00:00Z" }
              as: CaseWorker
              captures: { m1_id: "$.data.id" }
            - call: "POST /sdu/modifications/${m1_id}/submit"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications/${m1_id}/decide"
              payload: { decision: "APPROVE" }
              as: Supervisor
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 55000, coverage_start_at: "2026-07-01T00:00:00Z", coverage_end_at: "2026-12-31T00:00:00Z" }
              as: CaseWorker
              captures: { m2_id: "$.data.id" }
            - call: "POST /sdu/modifications/${m2_id}/submit"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications/${m2_id}/decide"
              payload: { decision: "APPROVE" }
              as: Supervisor
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver_stale: "$.data.version" }
            - call: "POST /sdu/modifications/${m1_id}/apply"
              payload: { expected_support_order_version: "${o_ver_stale}" }
              as: CaseWorker
          trigger:
            - call: "POST /sdu/modifications/${m2_id}/apply"
              payload: { expected_support_order_version: "${o_ver_stale}" }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: cascade_modification_apply_full_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Modification.APPROVED_to_APPLIED
          - entities.NoncustodialParty.fields.total_current_support_cents
        excluded_because:
          difficulty_instance: modification_apply_cascade_depth3
          rationale: "The end-to-end apply cascade (order amount → MODIFIED → NCP total recompute) is the depth-3 §1.8 cascade instance."

      - name: version_increments_on_each_order_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.SupportOrder.fields.version
          - state_machines.SupportOrder.obligation_status.ESTABLISHED_to_ACTIVE
        distinguishing_aspect: "SupportOrder.version starts at 1 and increments to 2 after activate, 3 after suspend (each mutation bumps version by exactly 1)."
        test_recipe:
          setup: ["An ESTABLISHED order (version 1)."]
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1029" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { v_after_activate: "$.data.version" }
            - call: "POST /sdu/support-orders/${o_id}/suspend"
              payload: {}
              as: CaseWorker
              captures: { v_after_suspend: "$.data.version" }
          assert:
            - "SupportOrder.${o_id}.version == 3"

      - name: ccpa_cap_binds_dual_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.ccpa_withholding_cap
        excluded_because:
          difficulty_instance: ccpa_cap_tier_selection_nonlinear
          rationale: "The cap_binds variant (distributable = cap < gross) is asserted by the named §1.8 CCPA instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: allocation_balances_visible_in_same_request
        claim_type: immediate
        grounds:
          - state_machines.Remittance.RECEIVED_to_ALLOCATED
          - entities.SupportOrder.fields.current_support_due_cents
        distinguishing_aspect: "Immediately after POST /sdu/remittances/{id}/allocate, a GET on the target order reflects the reduced current_support_due_cents (no eventual lag)."
        test_recipe:
          setup:
            - "ACTIVE order cs=50000 (due 50000); remittance distributable 50000 allocated."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1030" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp", fein: "29-3030303" }
              as: CaseWorker
              captures: { emp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_id}", disposable_earnings_cents: 200000, gross_remitted_cents: 50000 }
              as: FinanceOfficer
              captures: { rem_id: "$.data.id" }
            - call: "POST /sdu/remittances/${rem_id}/allocate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: FinanceOfficer
              captures: { due: "$.data.current_support_due_cents" }
          assert:
            - "SupportOrder.${o_id}.current_support_due_cents == 0"
