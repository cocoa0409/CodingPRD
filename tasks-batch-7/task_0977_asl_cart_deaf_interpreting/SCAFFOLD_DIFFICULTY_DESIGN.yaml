            - "After apply: CreditMemo.${memo1}.remaining_cents == 0 and status == EXHAUSTED; RequestingOrg.${org1}.outstanding_balance_cents == 19840"
            - "After void: Invoice.${inv1}.credits_applied_cents == 0 and amount_due_cents == 24840 == subtotal_cents (invariant restored, zero drift)"
            - "After void: CreditMemo.${memo1}.status == VOID; RequestingOrg.${org1}.outstanding_balance_cents == 24840"

