            - { call: "POST /conf/bookings", payload: { slot_id: "${qb0}", student_id: "${stB2}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f2}", captures: { bkB2: $.data.id } }
