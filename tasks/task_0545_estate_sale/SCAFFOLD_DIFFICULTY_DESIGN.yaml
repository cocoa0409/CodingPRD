      - name: bid_close_with_empty_bid_set_falls_back_to_unsold
        grounds:
          - state_machines.Lot.LISTED_to_UNSOLD
          - calculations.winning_bid_price
          - entities.Lot.fields.winning_bid_id
        distinguishing_aspect: |
          Closing bidding on a LISTED bid lot with zero PLACED bids (empty candidate set) resolves to
