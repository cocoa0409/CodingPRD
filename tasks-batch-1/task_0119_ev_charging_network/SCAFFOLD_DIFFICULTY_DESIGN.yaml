              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_SETTLEABLE (session billing_status is UNBILLED, not RATED)"
            - "HTTP status == 409"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_buffered_overlap_on_stall
        grounds:
          - validations[priority=11]
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - entities.Reservation.fields.window_start
        distinguishing_aspect: |
          Resource = Stall, interval semantics = half-open [start,end) plus a turnaround
          buffer: a second reservation whose window starts within the buffer after a
          CONFIRMED reservation's end is rejected ERR_RESERVATION_OVERLAP on confirm.
        test_recipe:
          setup:
            - "Stall with one CONFIRMED reservation [09:00,10:00). A second REQUESTED reservation [10:00,11:00) on the same stall whose start falls inside the post-end buffer."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dro@x.com", full_name: "DRO", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "Site RO", circuit_limit_kw: 200, demand_charge_threshold_kw: 200, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_id: $.data.id, stall_v0: $.data.version }
            - call: "POST /api/reservations"
              payload: { stall_id: "${stall_id}", driver_id: "${drv_id}", window_start: "2026-06-01T09:00:00Z", window_end: "2026-06-01T10:00:00Z", hold_fee_cents: 0, expected_stall_version: "${stall_v0}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { resv1_id: $.data.id }
            - call: "POST /api/reservations/${resv1_id}/confirm"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "GET /api/stalls/${stall_id}"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { stall_v1: $.data.version }
            - call: "POST /api/reservations"
              payload: { stall_id: "${stall_id}", driver_id: "${drv_id}", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T11:00:00Z", hold_fee_cents: 0, expected_stall_version: "${stall_v1}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { resv2_id: $.data.id }
          trigger:
            - call: "POST /api/reservations/${resv2_id}/confirm"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESERVATION_OVERLAP (10:00 start falls inside the RESERVATION_BUFFER_MIN turnaround after the 10:00 end of resv1)"
            - "HTTP status == 409"

      - name: tariff_effective_window_overlap_on_site
        grounds:
          - validations[priority=10]
          - entities.Tariff.fields.effective_from
          - entities.Tariff.fields.effective_to
        distinguishing_aspect: |
          Resource = Site (via Tariff), interval semantics = closed [from,to] where
          touching endpoints are ALLOWED but interior overlap is rejected (no buffer) —
          a second CCS tariff [2026-06-01,2026-12-31] overlapping an existing
          [2026-01-01,2026-09-01] is rejected ERR_TARIFF_WINDOW_OVERLAP. Distinct
          interval arithmetic and resource entity from the buffered Stall reservation rule.
        test_recipe:
          setup:
            - "A site with a CCS ENERGY tariff effective [2026-01-01,2026-09-01]. A second CCS tariff is created with an overlapping window."
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "Site TWO", circuit_limit_kw: 200, demand_charge_threshold_kw: 200, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: CPOOperator
          trigger:
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "TIME_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TARIFF_WINDOW_OVERLAP (interior overlap of [2026-06-01,2026-12-31] with [2026-01-01,2026-09-01])"
            - "HTTP status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: site_power_conservation_on_suspend_release
        grounds:
          - calculations.site_load_allocation
          - state_machines.ChargingSession.CHARGING_to_SUSPENDED
          - entities.Site.fields.allocated_total_kw
        distinguishing_aspect: |
          Conserved quantity = Site power (kW). Suspending a CHARGING session (forward)
          frees its kW, which the reallocation grants to remaining CHARGING sessions;
          the invariant Site.allocated_total_kw == sum over CHARGING sessions of
          allocated_power_kw <= cap_kw holds exactly (no kW leaks or is double-counted).
        test_recipe:
          setup:
            - "Site circuit 60 kW, PRIORITY. Two CCS stalls (60/60), priorities 1 and 2. Session A and B both CHARGING -> A=60, B=0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dpc@x.com", full_name: "DPC", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "Site PC", circuit_limit_kw: 60, demand_charge_threshold_kw: 60, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60, reservation_priority: 1 }
              as: CPOOperator
              captures: { stall_a_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60, reservation_priority: 2 }
              as: CPOOperator
              captures: { stall_b_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_a_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /api/sessions/${sa_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sa_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_b_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /api/sessions/${sb_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sb_id}/begin-charging"
              payload: {}
              as: StationController
          trigger:
            - call: "POST /api/sessions/${sa_id}/suspend"
              payload: {}
              as: StationController
              captures: { a_alloc: $.data.allocated_power_kw }
          assert:
            - "ChargingSession.${sa_id}.allocated_power_kw == 0.0 (released on suspend)"
            - "ChargingSession.${sb_id}.allocated_power_kw == 60.0 (received the freed 60 kW)"
            - "Site.${site_id}.allocated_total_kw == 60.0 (== sum of CHARGING allocations, still <= cap 60; no kW leaked)"

      - name: emsp_receivable_conservation_on_lineitem_reverse
        grounds:
          - calculations.roaming_settlement_total
          - state_machines.ChargingSession.RATED_to_REVERSED
          - entities.EMSP.fields.receivable_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (eMSP receivable cents), a different conserved type
          from Site power kW. Adding a line item bumps EMSP.receivable_balance_cents by
          net_amount_cents; the compensating reversal must decrement it by exactly the
          same net, returning the receivable to its pre-add value (zero drift).
        test_recipe:
          setup:
            - "An eMSP at receivable 0; one rated roaming session (1825 -> net 1688) added to an OPEN batch (receivable becomes 1688), then the batch is disputed/reopened and the line item reversed."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP RC", commission_pct: 0.075 }
