              captures: { pay_id: $.data.id }
            - call: "GET /advancement/pledges/${pl_id}"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { out_mid: $.data.outstanding_cents }
            - call: "GET /advancement/campaigns/${c_id}/totals"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { cash_mid: $.data.cash_counted_cents, face_mid: $.data.face_value_counted_cents }
          trigger:
            - call: "POST /advancement/gift-payments/${pay_id}/reverse"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
            - call: "GET /advancement/pledges/${pl_id}"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { out_end: $.data.outstanding_cents, pl_status: $.data.status }
            - call: "GET /advancement/pledges/${pl_id}/installments"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { i1_status: "$.data[0].status", i1_paid: "$.data[0].paid_cents" }
            - call: "GET /advancement/campaigns/${c_id}/totals"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { cash_end: $.data.cash_counted_cents, face_end: $.data.face_value_counted_cents }
            - call: "GET /advancement/funds/${fund_id}"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { fund_end: $.data.balance_cents }
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { lifetime_end: $.data.lifetime_given_cents }
          assert:
            - "out_mid == 2000000 and cash_mid == 1000000 and face_mid == 3000000  # forward action effects"
            - "out_end == 3000000  # conserved: outstanding restored"
            - "pl_status == \"ACTIVE\"  # FULFILLED never reached; single paid installment reverted"
            - "i1_status == \"SCHEDULED\" and i1_paid == 0  # clock 2026-08-01 <= due 2026-08-15 + 30d and reminder_count == 0"
            - "cash_end == 0 and face_end == 3000000  # CASH restored; FACE never moved (booking variant)"
            - "fund_end == 0 and lifetime_end == 0  # all monetary conserved quantities restored"
            - "GiftPayment.${pay_id}.reversed == true"

      - name: assign_release_restores_portfolio_counters
        grounds:
          - state_machines.PortfolioAssignment.ACTIVE_to_RELEASED
          - entities.Fundraiser.fields.current_prospect_count
          - entities.Fundraiser.fields.current_open_ask_cents
          - concurrency_rules[assignment-create-stale-fundraiser]
        distinguishing_aspect: |
          Conserved quantity: portfolio cardinality/load counters. The pair
          (assign, release) MUST leave fundraiser.current_prospect_count and
          current_open_ask_cents identical to their pre-assignment values (0 and
          0), including the intermediate window where an UNDER_REVIEW proposal
          contributed 5000000 to the open-ask load. Distinct quantity type from
          the monetary-balances instance.
        test_recipe:
          setup:
            - "Fundraiser fresh (counters 0/0); prospect rated band C and assigned, with an UNDER_REVIEW STANDARD proposal of 5000000"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 5, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version, cnt0: $.data.current_prospect_count, ask0: $.data.current_open_ask_cents }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { asg_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 5000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { cnt_mid: $.data.current_prospect_count, ask_mid: $.data.current_open_ask_cents }
          trigger:
            - call: "POST /advancement/assignments/${asg_id}/release"
              payload: { released_reason: "REBALANCING" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { cnt_end: $.data.current_prospect_count, ask_end: $.data.current_open_ask_cents }
          assert:
            - "cnt0 == 0 and ask0 == 0  # pre-assignment counters"
            - "cnt_mid == 1 and ask_mid == 5000000  # assignment counts the prospect's UNDER_REVIEW proposal"
            - "cnt_end == 0 and ask_end == 0  # conserved: release restores both counters exactly"
            - "PortfolioAssignment.${asg_id}.status == \"RELEASED\" and released_reason == \"REBALANCING\""
            - "Proposal.${prop_id}.status == \"UNDER_REVIEW\"  # release does not cascade into the proposal"
