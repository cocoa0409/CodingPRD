              payload: { worker_id: "${worker_id}", site_id: "${site_id}", prequalification_id: "${pq_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "InsuranceCertificate.${cert_gl_id}.verification_status == VERIFIED (per_occurrence_basis accepted 1000000 >= 1000000 at verify time)"
            - "Contractor.${con_id}.open_severe_incident_count == 1"
            - "GET /contractors/${con_id}/insurance-certificates returns InsuranceCertificate.${cert_gl_id}.available_aggregate == 1750000"
            - "grant response HTTP 422 with error_id ERR_COVERAGE_LIMIT_INSUFFICIENT (1750000 < 2000000 required aggregate for GL at multiplier 1.0)"
            - "Site.${site_id}.granted_worker_count == 0"
            - "Prequalification.${pq_id}.status == APPROVED (a RECORDABLE incident does not suspend)"

  - rule_id: combinatorial_formula
    instances:
      - name: metric_normalization_rounds_each_weighted_product_before_summing
        grounds:
          - calculations.metric_normalization
          - calculations.citation_points
          - calculations.grade_band_assignment
          - calculations.grading_decision
          - state_machines.Prequalification.UNDER_REVIEW_to_CONDITIONAL
        distinguishing_aspect: |
          Rounding-ORDER combination: the four weighted products are each rounded to 2 decimals
          before the sum, giving 63.14; summing the unrounded products and rounding once gives
          63.13. The one-cent difference is the only observable that separates the pinned order
          from the forbidden one, and it lands in the C band either way so the grade cannot mask it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Client Northwind on all defaults (BALANCED bands, thresholds 3.0/1.5/1.0/6, weights 0.40/0.25/0.25/0.10, conditional_band_pct 20)."
            - "Contractor Acme with hazard_profile [GENERAL] so base_hazard_tier is 1 and tightening stays 1.00."
            - "GL 1000000/2000000 and WC 500000/1000000 certificates VERIFIED and CURRENT."
            - "One VERIFIED SafetyStatistic for 2025 engineered so every sub-score lands on a repeating decimal: hours 1000000, recordable 10, DART 5, EMR 0.95, two SERIOUS citations (citation_points 4). Sub-scores are 66.67 / 66.67 / 52.50 / 66.67."
            - "Both required written programs ACCEPTED, prequalification joined UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "WC", carrier_name: "Ironclad Mutual", each_occurrence_limit: 500000, aggregate_limit: 1000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_wc_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_wc_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 1000000, recordable_incidents: 10, dart_cases: 5, fatalities: 0, emr: 0.95, citation_count_willful: 0, citation_count_serious: 2, citation_count_other: 0, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
            - call: "POST /safety-statistics/${stat_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-stat-1"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "DISCIPLINE_POLICY", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-DISC-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_disc_id: $.data.id }
            - call: "POST /written-programs/${wp_disc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /prequalifications/${pq_id}/grade"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "SafetyStatistic.${stat_id}.trir == 2.00"
            - "SafetyStatistic.${stat_id}.dart_rate == 1.00"
            - "SafetyStatistic.${stat_id}.citation_points == 4"
            - "Prequalification.${pq_id}.final_composite_score == 63.14 (NOT 63.13, which is what summing the unrounded products would produce)"
            - "Prequalification.${pq_id}.grade == C"
            - "Prequalification.${pq_id}.status == CONDITIONAL"
            - "Prequalification.${pq_id}.deficiency_codes == [COMPOSITE_C] (no metric exceeds its threshold; only the composite band drives the outcome)"
            - "Contractor.${con_id}.open_deficiency_count == 1"
            - "Prequalification.${pq_id}.conditional_expires_at == 2026-10-30T00:00:00Z"
            - "Prequalification.${pq_id}.expires_at == 2027-08-01T00:00:00Z"

      - name: threshold_resolution_escalates_tier_from_closed_lost_time_at_badged_site
        grounds:
          - calculations.effective_client_threshold_resolution
          - calculations.composite_prequalification_score
          - state_machines.Prequalification.APPROVED_to_SUSPENDED
          - state_machines.Prequalification.SUSPENDED_to_UNDER_REVIEW
          - entities.IncidentReport.fields.review_status
          - entities.SiteAccessGrant.fields.site_id
        distinguishing_aspect: |
          Cross-ENTITY-GRAPH combination rather than a rounding combination: the effective
          thresholds are a function of (client thresholds x contractor hazard profile x the maximum
          incident severity restricted to sites this contractor was badged into through THIS
          client), so the same contractor, client and statistic score 80.51 before a closed
          LOST_TIME incident at a badged site and 77.06 after it, with hazard_tier moving 1 -> 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Client Northwind on defaults; Site PLANT-7 required_hazard_classes [GENERAL], min_grade C."
            - "Contractor Acme with hazard_profile [GENERAL] (base_hazard_tier 1), GL 1000000/2000000 and WC 500000/1000000 VERIFIED."
            - "Worker Dana with a current OSHA10 qualification."
            - "One VERIFIED 2025 statistic: hours 500000, recordable 2, DART 1, EMR 0.80, citation_points 1; both required programs ACCEPTED."
            - "First grading produced APPROVED at 80.51 with hazard_tier 1, after which Dana was granted access to PLANT-7 - so PLANT-7 is now a badged site for this contractor/client pair."
            - "A LOST_TIME incident at PLANT-7 then suspended the prequalification and revoked the grant; closing that incident review returned the row to UNDER_REVIEW with all grade fields cleared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sites"
              payload: { site_code: "PLANT-7", required_hazard_classes: ["GENERAL"] }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { site_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
