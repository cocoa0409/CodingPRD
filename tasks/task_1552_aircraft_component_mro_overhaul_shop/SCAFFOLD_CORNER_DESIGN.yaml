          setup: ["customer credit_limit_cents 0; pool unit available; agreement OPEN"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "BrokeAir", certificate_number: "AIR-002", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 0 }, as: ShopManager, captures: { c_id: $.data.id } }
