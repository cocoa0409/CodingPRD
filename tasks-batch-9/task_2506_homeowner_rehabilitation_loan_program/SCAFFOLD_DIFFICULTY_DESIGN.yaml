  - rule_id: resource_temporal_overlap
    instances:
      - name: inspection_windows_on_one_property_are_half_open_so_touching_windows_are_allowed
        grounds:
          - validations.priority_16.ERR_INSPECTION_WINDOW_CONFLICT
          - entities.PropertyInspection.fields.scheduled_start_at
          - entities.PropertyInspection.fields.scheduled_end_at
          - endpoints.POST_/rehab/inspections
          - errors.ERR_INSPECTION_WINDOW_CONFLICT
        distinguishing_aspect: |
          The contended resource is the property's inspection calendar (PropertyInspection rows on one
          RehabApplication) and the interval semantics are half-open [start, end): a request for
          14:00-16:00 against an existing 13:00-15:00 window is rejected, while 15:00-17:00 — whose
          start touches the existing end exactly — is accepted. Zero-length touching is legal here,
          which is the opposite of the contractor-capacity instance below.
        test_recipe:
          setup:
            - "one ownership-verified RehabApplication with a single SCHEDULED inspection running 2026-08-03T13:00:00Z to 2026-08-03T15:00:00Z, assigned to insp-1"
            - "no other inspection exists on that application"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 2, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "18 Larkspur Ave", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 15000000, senior_lien_balance_cents: 12000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
            - call: "POST /rehab/applications/${app_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T14:00:00Z", scheduled_end_at: "2026-08-03T16:00:00Z" }
              as: Inspector
              as_user_id: "insp-2"
              captures: { seen_error: $.data.error_id }
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T15:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }
              as: Inspector
              as_user_id: "insp-2"
              captures: { insp2_id: $.data.id }
          assert:
            - "overlapping attempt: HTTP 409 with error_id ERR_INSPECTION_WINDOW_CONFLICT"
            - "overlapping attempt creates no row: GET /rehab/inspections?application_id=${app_id} still returns 1 row immediately after it"
            - "touching attempt: HTTP 201 with PropertyInspection.${insp2_id}.scheduled_start_at == 2026-08-03T15:00:00Z and status SCHEDULED"
            - "GET /rehab/inspections?application_id=${app_id} returns 2 rows after the touching attempt"
            - "PropertyInspection.${insp1_id}.status == SCHEDULED and its window is unchanged"
            - "the conflict rule ignores inspections on other applications: it is scoped to application_id"

      - name: contractor_award_capacity_uses_closed_buffered_windows_so_touching_windows_conflict
        grounds:
          - validations.priority_18.ERR_CONTRACTOR_CAPACITY_CONFLICT
          - entities.Bid.fields.proposed_start_date
          - entities.Bid.fields.proposed_end_date
          - entities.Contractor.fields.active_award_count
          - state_machines.BidSolicitation.TABULATED_to_AWARDED
        distinguishing_aspect: |
          The contended resource is the contractor's crew (Contractor.active_award_count), a different
          resource entity from the property inspection calendar, and the interval semantics are the
          opposite: each award window is inflated by CREW_TURNOVER_BUFFER_DAYS = 3 on both ends and
          compared as a closed interval with MAX_CONCURRENT_AWARDS = 1, so a second window starting
