            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${w}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r1: $.data.id }
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b2}", warehouse_id: "${w}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r2: $.data.id }
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${w}", grower_id: "${g}", bale_ids: ["${b1}", "${b2}"], dock_number: 1, load_start: "2026-08-25T10:00:00Z", load_end: "2026-08-25T12:00:00Z" }
              as: WarehouseManager
