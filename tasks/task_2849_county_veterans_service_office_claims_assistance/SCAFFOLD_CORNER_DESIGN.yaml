            - "${e_quarter} == ERR_INVALID_FISCAL_QUARTER"
            - "${e_enrolled} == ERR_ENROLLED_EXCEEDS_CONTACTED"
            - "HTTP status of all three trigger calls == 422"
            - "exactly one OutreachEvent row exists afterwards and OutreachEvent.${ev}.status == PLANNED"
            - "zero OutcomeReport rows exist afterwards"

