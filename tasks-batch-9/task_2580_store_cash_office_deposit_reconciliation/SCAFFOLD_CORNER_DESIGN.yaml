      - name: clock_cannot_move_backwards
        claim_type: violation_error
        grounds:
          - validations[priority=58]
          - errors[ERR_CLOCK_MONOTONIC]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: >
          The logical clock is monotonic: rewinding from 12:00Z to 11:00Z returns 422
          ERR_CLOCK_MONOTONIC and the clock stays at 12:00Z, which the created_at of the next write
          proves.
        test_recipe:
          setup:
            - "Empty database with the clock advanced to 2026-08-03T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1949", name: "Store 1949", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
          assert:
            - "the rewind returns HTTP 422 with data.error_id == \"ERR_CLOCK_MONOTONIC\""
            - "the store creation that follows returns 201 with created_at == \"2026-08-03T12:00:00Z\" — the clock never moved"
            - "setting the clock to the identical value 2026-08-03T12:00:00Z is accepted (the rule rejects only strictly earlier values)"

