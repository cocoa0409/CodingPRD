            - "A1 start at exactly window_start succeeds: status == IN_PROGRESS (inclusive lower bound)"
            - "A2 start at exactly window_end fails with ERR_AUDIT_WINDOW_NOT_OPEN (exclusive upper bound)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contract_cumulative_volume_conserved_on_reject
        grounds:
          - state_machines.CertificateOfAnalysis.UNDER_REVIEW_to_ACCEPTED
          - state_machines.CertificateOfAnalysis.UNDER_REVIEW_to_REJECTED
          - entities.SupplyContract.fields.cumulative_shipped_kg
        distinguishing_aspect: |
          Conserved quantity: SupplyContract.cumulative_shipped_kg. An
          accepted lot adds exactly shipped_qty_kg; the paired compensating
          path (a subsequent REJECTED lot) adds exactly 0 — the accumulator
          after accept+reject equals the value after accept alone, with no
          drift from the rejection side effects.
        test_recipe:
          setup:
            - "ACTIVE source + declarations; ACTIVE contract C with cumulative_shipped_kg == 0"
            - "Lot OK-1 (1000 kg, in-spec) accepted; lot BAD-1 (700 kg, purity 90 on CRITICAL 95..100) rejected"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ACD-1", name: "Acidulant One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "purity", criticality: "CRITICAL", uom: "percent", target_value: 97, min_value: 95, max_value: 100 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-C", legal_name: "Conserved Supplier", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 91, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id, src_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["NONE"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["US"], primary_country: "US" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/contracts"
              payload: { annual_committed_volume_kg: 40000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", expected_approved_source_version: "${src_v}" }
              as: ProcurementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${ctr_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/coas"
              payload: { contract_id: "${ctr_id}", lot_number: "OK-1", shipped_qty_kg: 1000, received_at: "2026-08-01T00:00:00Z", measured_values: [ { parameter_name: "purity", observed_value: 97 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { coa_ok: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_ok}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_ok}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/approved-sources/${src_id}/contracts"
              payload: {}
              as: ProcurementManager
              captures: { cum_after_accept: "$.data[0].cumulative_shipped_kg" }
            - call: "POST /sourcing/approved-sources/${src_id}/coas"
              payload: { contract_id: "${ctr_id}", lot_number: "BAD-1", shipped_qty_kg: 700, received_at: "2026-08-02T00:00:00Z", measured_values: [ { parameter_name: "purity", observed_value: 90.0 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { coa_bad: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_bad}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/approved-sources/${src_id}/coas/${coa_bad}/findings"
              payload: {}
              as: QualityManager
              captures: { bad_f: "$.data[0].id" }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_bad}/findings/${bad_f}/disposition"
              payload: { disposition: "REJECT_LOT", disposition_note: "critical failure reject" }
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_bad}/close-review"
              payload: { outcome: "REJECT" }
              as: QualityManager
              as_user_id: qm-2
            - call: "GET /sourcing/approved-sources/${src_id}/contracts"
              payload: {}
              as: ProcurementManager
              captures: { cum_after_reject: "$.data[0].cumulative_shipped_kg" }
          assert:
            - "cumulative_shipped_kg after accept == 1000"
            - "cumulative_shipped_kg after reject == 1000 (rejection compensates by accruing zero; invariant: sum over ACCEPTED/CONDITIONALLY_ACCEPTED lots only)"

      - name: dual_source_breach_recompute_roundtrip_conserved
        grounds:
          - calculations.dual_source_breach
          - state_machines.ApprovedSource.ACTIVE_to_SUSPENDED
          - state_machines.ApprovedSource.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Different conserved quantity: count of ACTIVE ApprovedSources pinned
          to the EFFECTIVE spec of a dual-source ingredient. Suspend then
          reinstate of the same source is a compensating pair: the count
          returns to its prior value and current_dual_source_breach flips true
          then false — no drift after the round trip.
        test_recipe:
          setup:
            - "Ingredient DUAL-2 requires_dual_source=true, EFFECTIVE spec"
            - "Two QUALIFIED suppliers, sources A and B both ACTIVE pinned to the EFFECTIVE spec (declarations valid); breach == false"
