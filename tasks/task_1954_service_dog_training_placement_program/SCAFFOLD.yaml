scenario: |
  1954. Service Dog Training & Placement Program (assistance dog organization): applicant intake & disability-related task assessment, waitlist management & fundraising requirement, puppy raiser recruitment & placement, training milestone tracking & career-change decisions, team training class & public access test, post-placement follow-up & recertification, owner support & aftercare, breeding/donation intake & health screening

domain_name: service-dog-placement
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (18 entities)
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across applicants" }
      - { name: placement_track, type: enum, source: input, description: "MOBILITY | PTSD | AUTISM | FACILITY — program track applied for", constraints: "enum members: MOBILITY, PTSD, AUTISM, FACILITY" }
      - { name: household_income_cents, type: integer, source: input, description: "Self-reported annual household income in cents; >= 0" }
      - { name: verified_income_cents, type: integer, source: system, description: "Income verified at eligibility recalculation; null until recalculated", default: null }
      - { name: region, type: string, source: input, description: "Region code used for raiser/dog matching, e.g. NW, SW" }
      - { name: application_status, type: enum, source: system, description: "SUBMITTED | IN_REVIEW | NEEDS_INFO | WAITLISTED | MATCH_ELIGIBLE | MATCHED | TEAM_TRAINING | PLACED | DENIED | WITHDRAWN" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Operator id of IntakeCoordinator who began review" }
      - { name: approved_by_user_id, type: string, source: system, description: "Operator id of IntakeCoordinator who approved to waitlist" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded when DENIED", default: null }

  - name: TaskAssessment
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; owning applicant" }
      - { name: required_tasks, type: array, source: input, description: "Array of task codes the dog must perform: RETRIEVE_ITEMS | OPEN_DOORS | BALANCE_SUPPORT | INTERRUPT_ANXIETY | ALERT_SOUND | GUIDE_NAVIGATION | DEEP_PRESSURE | MEDICAL_ALERT; at least one required" }
      - { name: task_urgency_tier, type: enum, source: input, description: "STANDARD | HIGH | CRITICAL — feeds waitlist rank score" }
      - { name: home_environment_score, type: integer, source: input, description: "0-10 home suitability score; feeds waitlist rank score", constraints: "0 <= value <= 10" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED_ACCEPTED | FINALIZED_REJECTED" }
      - { name: finalized_by_user_id, type: string, source: system, description: "Operator id who finalized", default: null }
      - { name: notes, type: string, source: input, description: "Free-text assessor notes", default: null }

  - name: WaitlistEntry
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; at most one entry with status in {PENDING, ELIGIBLE, MATCHED, SUSPENDED} per applicant" }
      - { name: status, type: enum, source: system, description: "PENDING | ELIGIBLE | MATCHED | SUSPENDED | CLOSED" }
      - { name: listed_at, type: datetime, source: system, description: "Logical-clock timestamp when entry was created; rank wait_days derives from this" }
      - { name: requirement_provisional_cents, type: integer, source: computed, description: "Provisional fundraising requirement per fundraising_requirement provisional variant" }
      - { name: requirement_final_cents, type: integer, source: computed, description: "Final fundraising requirement per fundraising_requirement final variant; null until recalculate", default: null }
      - { name: effective_requirement_cents, type: integer, source: computed, description: "requirement_final_cents if set, else requirement_provisional_cents" }
      - { name: raised_cents, type: integer, source: computed, description: "Sum of amount_cents over this applicant's Contributions with status RECEIVED" }
      - { name: dissolved_match_count, type: integer, source: computed, description: "Count of MatchRecords for this entry that reached DISSOLVED; feeds rank penalty", default: 0 }
      - { name: rank_score, type: number, source: computed, description: "Per waitlist_rank_score; recomputed on eligibility flips, clock sweep, and dissolve events" }

  - name: Contribution
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; fundraising ledger owner" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents; >= 100 (ERR_CONTRIBUTION_BELOW_MINIMUM)" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | REFUNDED | VOID" }
      - { name: created_by_user_id, type: string, source: system, description: "Operator id of IntakeCoordinator who recorded the pledge" }
      - { name: received_by_user_id, type: string, source: system, description: "Operator id who marked RECEIVED; must differ from created_by_user_id (ERR_SOD_CONFLICT)", default: null }

  - name: PuppyRaiser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Raiser legal name" }
      - { name: region, type: string, source: input, description: "Region code; must equal dog.region for raiser selector eligibility" }
      - { name: foster_capacity, type: integer, source: input, description: "Max number of dogs the raiser may foster at any given time; >= 1" }
      - { name: experience_score, type: integer, source: input, description: "0-100 experience rating; primary rank key in raiser_selector", constraints: "0 <= value <= 100" }
      - { name: status, type: enum, source: system, description: "APPLIED | VETTED | APPROVED | ACTIVE | ON_HIATUS | INACTIVE" }
      - { name: current_dog_count, type: integer, source: computed, description: "Count of RaiserPlacements with status ACTIVE for this raiser", default: 0 }
      - { name: last_placement_ended_at, type: datetime, source: system, description: "Timestamp the most recent placement ended; null if none; selector tie-break (nulls sort last)", default: null }

  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Trainer legal name" }
      - { name: pat_certified, type: boolean, source: input, description: "Whether certified to administer public access tests / recertifications", default: false }
      - { name: status, type: enum, source: system, description: "PROBATION | CERTIFIED | SUSPENDED | INACTIVE" }

  - name: Dog
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dog call name" }
      - { name: origin, type: enum, source: input, description: "BRED | DONATED — selects health clearance threshold variant" }
      - { name: breed, type: string, source: input, description: "Breed label" }
      - { name: sex, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: born_on, type: string, source: input, description: "Birth date ISO YYYY-MM-DD" }
      - { name: region, type: string, source: input, description: "Region code; raiser selector requires raiser.region == dog.region" }
      - { name: sire_id, type: string, source: input, description: "FK -> Dog.id; sire — required when origin=BRED, must reference a MALE dog; forbidden when DONATED", default: null }
      - { name: dam_id, type: string, source: input, description: "FK -> Dog.id; dam — required when origin=BRED, must reference a FEMALE dog distinct from sire; forbidden when DONATED", default: null }
      - { name: donor_name, type: string, source: input, description: "Donating owner name — required when origin=DONATED; forbidden when BRED", default: null }
      - { name: status, type: enum, source: system, description: "REGISTERED | IN_HEALTH_SCREENING | CLEARED | RAISER_PLACED | RECALLED | IN_ADVANCED_TRAINING | MATCH_READY | MATCHED | TEAM_TRAINING | PLACED | CAREER_CHANGED | RETIRED" }
      - { name: clearance_score, type: integer, source: computed, description: "Health clearance score from latest submitted HealthScreening", default: null }
      - { name: primary_trainer_id, type: string, source: system, description: "FK -> Trainer.id; assigned when raiser placement completes; PAT/recert evaluator must differ (segregation of duties)", default: null }
      - { name: certified_tasks, type: array, source: computed, description: "Set of task codes demonstrated by TASK_WORK milestones scoring >= 80", default: [] }
      - { name: career_change_reason, type: string, source: system, description: "HEALTH | TEMPERAMENT | OTHER recorded on career change", default: null }

  - name: HealthScreening
    parent: Dog
    common_fields: true
    fields:
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; screened dog" }
      - { name: hip_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR" }
      - { name: elbow_grade, type: enum, source: input, description: "NORMAL | GRADE1 | GRADE2" }
      - { name: eye_result, type: enum, source: input, description: "CLEAR | ABNORMAL" }
      - { name: cardiac_result, type: enum, source: input, description: "NORMAL | ABNORMAL" }
      - { name: genetic_panel, type: enum, source: input, description: "CLEAR | CARRIER | AFFECTED" }
      - { name: clearance_score, type: integer, source: computed, description: "0-100 per health_clearance_score" }
      - { name: status, type: enum, source: system, description: "DRAFT | CLEARED | FAILED" }
      - { name: veterinarian_user_id, type: string, source: system, description: "Operator id of Veterinarian who created the screening" }

  - name: RaiserPlacement
    parent: Dog
    common_fields: true
    fields:
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; fostered dog" }
      - { name: puppy_raiser_id, type: string, source: system, description: "FK -> PuppyRaiser.id; request-supplied or chosen by raiser_selector" }
      - { name: started_on, type: string, source: system, description: "ISO date from logical clock at creation" }
      - { name: ended_on, type: string, source: system, description: "ISO date when placement ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | EARLY_RETURN" }

  - name: TrainingMilestone
    parent: Dog
    common_fields: false
    fields:
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; dog assessed" }
      - { name: category, type: enum, source: input, description: "OBEDIENCE | TASK_WORK | PUBLIC_MANNERS | SOCIALIZATION" }
      - { name: task_code, type: enum, source: input, description: "Task code from the TaskAssessment task universe; required when category=TASK_WORK, forbidden otherwise", default: null }
      - { name: score, type: integer, source: input, description: "0-100 milestone score", constraints: "0 <= value <= 100" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of record; chronological ordering key" }
      - { name: recorded_by_trainer_id, type: string, source: system, description: "FK -> Trainer.id; recording trainer (must equal dog.primary_trainer_id)" }
      - { name: rolling_avg_3, type: number, source: computed, description: "Mean of this and up to 2 prior milestone scores (chronological), 1 decimal round_half_up" }
      - { name: cumulative_gate_score, type: number, source: computed, description: "Weighted cumulative gate score per training_advancement cumulative variant" }

  - name: MatchRecord
    parent: null
    common_fields: true
    fields:
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; matched dog" }
      - { name: waitlist_entry_id, type: string, source: system, description: "FK -> WaitlistEntry.id; matched entry" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | DISSOLVED | COMPLETED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "Operator id of IntakeCoordinator who proposed" }
      - { name: rank_score_at_match, type: number, source: system, description: "Entry rank_score captured at proposal time" }

  - name: TeamTrainingClass
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Class label" }
      - { name: lead_trainer_id, type: string, source: input, description: "FK -> Trainer.id; lead trainer — must be CERTIFIED at open-enrollment and have no overlapping class" }
      - { name: starts_on, type: string, source: input, description: "ISO date classes begin (inclusive)" }
      - { name: ends_on, type: string, source: input, description: "ISO date classes end (exclusive); must be > starts_on" }
      - { name: capacity, type: integer, source: input, description: "Max enrolled pairs; 2 <= capacity <= 6" }
      - { name: total_sessions, type: integer, source: input, description: "Sessions held over the class; >= 1; attendance denominator" }
      - { name: status, type: enum, source: system, description: "PLANNED | ENROLLING | IN_SESSION | GRADUATION_REVIEW | COMPLETED | CANCELLED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollments with status ENROLLED for this class", default: 0 }

  - name: Enrollment
    parent: TeamTrainingClass
    common_fields: true
    fields:
      - { name: class_id, type: string, source: system, description: "FK -> TeamTrainingClass.id; owning class" }
      - { name: match_id, type: string, source: input, description: "FK -> MatchRecord.id; matched pair enrolling; match must be ACCEPTED" }
      - { name: status, type: enum, source: system, description: "ENROLLED | GRADUATED | FAILED | WITHDRAWN" }
      - { name: sessions_attended, type: integer, source: system, description: "Absolute attended session count set via record-attendance", default: 0 }
      - { name: attendance_pct, type: number, source: computed, description: "round_half_up(100 * sessions_attended / class.total_sessions, 1)", default: 0 }

  - name: PublicAccessTest
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; tested enrollment" }
      - { name: evaluator_id, type: string, source: system, description: "Trainer.id of administering evaluator = acting Evaluator's X-User-ID; must differ from dog.primary_trainer_id" }
      - { name: scheduled_at, type: datetime, source: input, description: "ISO8601 start; evaluator occupied for [scheduled_at, scheduled_at + 60min) with 30-minute buffer on each side" }
      - { name: location, type: string, source: input, description: "Test venue label", default: null }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of prior non-INVALIDATED tests for this enrollment; max 2" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SCORED_PASS | SCORED_FAIL | INVALIDATED" }
      - { name: exercise_scores, type: array, source: system, description: "12 entries {exercise_code, raw_score}; codes C1..C6 CONTROL, P1..P4 PUBLIC_MANNERS, S1..S2 SAFETY; raw 0-3", default: [] }
      - { name: section_percents, type: object, source: computed, description: "{control, public_manners, safety} each round_half_up(100*sum/(3*count), 1)" }
      - { name: official_score, type: number, source: computed, description: "round_half_up(mean of the three rounded section_percents, 1) — per-section-then-average order pinned" }
      - { name: passed_gates, type: boolean, source: computed, description: "official_score >= 80.0 AND every raw >= 1 AND S1,S2 raw >= 2" }

  - name: Partnership
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; graduated client" }
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; placed dog" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; originating enrollment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECERT_DUE | SUSPENDED | RETIRED | DISSOLVED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of graduation" }
      - { name: recert_due_at, type: datetime, source: system, description: "activated_at + 365 days; on pass resets to completion date + 365 days" }
      - { name: followups_completed, type: integer, source: computed, description: "Count of FollowUps with status COMPLETED", default: 0 }
      - { name: last_recert_passed_at, type: datetime, source: system, description: "Completion timestamp of latest COMPLETED_PASS recertification", default: null }

  - name: FollowUp
    parent: Partnership
    common_fields: true
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> Partnership.id; followed partnership" }
      - { name: due_on, type: string, source: system, description: "ISO date; auto-generated at activation +90/+180/+270 days or supplied on manual create" }
      - { name: auto_generated, type: boolean, source: system, description: "True when system-scheduled at graduation", default: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | WAIVED" }
      - { name: outcome, type: enum, source: system, description: "SATISFACTORY | NEEDS_SUPPORT; null until completed", default: null }
      - { name: completed_on, type: string, source: system, description: "ISO date completed", default: null }

  - name: Recertification
    parent: Partnership
    common_fields: true
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> Partnership.id; recertified partnership" }
      - { name: scheduled_on, type: string, source: input, description: "ISO date; must fall within [recert_due_at - 30 days, recert_due_at + 30 days]" }
      - { name: evaluator_id, type: string, source: input, description: "Trainer.id of evaluator; must be pat_certified and differ from dog.primary_trainer_id" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED_PASS | REMEDIATION | FAILED_FINAL" }
      - { name: completed_on, type: string, source: system, description: "ISO date of latest record-result", default: null }

  - name: SupportRequest
    parent: Partnership
    common_fields: true
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> Partnership.id; owning partnership" }
      - { name: raised_by_applicant_id, type: string, source: system, description: "FK -> Applicant.id; client who raised it (= partnership.applicant_id)" }
      - { name: category, type: enum, source: input, description: "EQUIPMENT | BEHAVIOR | HEALTH | TRAVEL | HOUSING | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | URGENT", default: MEDIUM }
      - { name: priority, type: enum, source: system, description: "LOW | MEDIUM | HIGH | URGENT; set at triage", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | IN_PROGRESS | RESOLVED | CLOSED | REOPENED" }
      - { name: assigned_trainer_id, type: string, source: system, description: "Trainer.id assigned at start (plain reference, not an ownership FK)", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolution; reopen window = resolved_at + 14 days", default: null }

# =============================================================================
# Table 2: State Machine Table (16 machines)
# =============================================================================
state_machines:
  - entity: Applicant
    field: application_status
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /api/applicants/{id}/begin-review"
        actor: IntakeCoordinator
        preconditions: ["application_status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["reviewed_by_user_id := acting operator id", "increments Applicant.version by 1"]
      - from: IN_REVIEW
        to: NEEDS_INFO
        trigger: "POST /api/applicants/{id}/request-info"
        actor: IntakeCoordinator
        preconditions: ["application_status == IN_REVIEW (ERR_INVALID_STATE)"]
        side_effects: ["increments Applicant.version by 1"]
      - from: NEEDS_INFO
        to: IN_REVIEW
        trigger: "POST /api/applicants/{id}/resubmit"
        actor: Applicant
        preconditions: ["application_status == NEEDS_INFO (ERR_INVALID_STATE)", "acting Applicant id == this Applicant.id (ERR_OWNERSHIP_SCOPE)"]
        side_effects: ["increments Applicant.version by 1"]
      - from: IN_REVIEW
        to: WAITLISTED
        trigger: "POST /api/applicants/{id}/approve"
        actor: IntakeCoordinator
        preconditions:
          - "application_status == IN_REVIEW (ERR_INVALID_STATE)"
          - "exists TaskAssessment of this applicant with status FINALIZED_ACCEPTED (ERR_ASSESSMENT_REQUIRED)"
        side_effects:
          - "approved_by_user_id := acting operator id"
          - "create WaitlistEntry: status PENDING, listed_at := logical clock, requirement_provisional_cents per fundraising_requirement provisional variant, requirement_final_cents null, raised_cents 0, dissolved_match_count 0, rank_score computed"
          - "increments Applicant.version by 1"
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /api/applicants/{id}/deny"
        actor: IntakeCoordinator
        preconditions: ["application_status in {IN_REVIEW, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: ["denial_reason := payload", "increments Applicant.version by 1"]
      - from: NEEDS_INFO
        to: DENIED
        trigger: "POST /api/applicants/{id}/deny"
        actor: IntakeCoordinator
        preconditions: ["application_status in {IN_REVIEW, NEEDS_INFO} (ERR_INVALID_STATE)"]
        side_effects: ["denial_reason := payload", "increments Applicant.version by 1"]
      - from: WAITLISTED
        to: MATCH_ELIGIBLE
        trigger: "system (WaitlistEntry PENDING -> ELIGIBLE)"
        actor: system
        preconditions: ["linked WaitlistEntry flipped to ELIGIBLE"]
        side_effects: ["increments Applicant.version by 1"]
      - from: MATCH_ELIGIBLE
        to: WAITLISTED
        trigger: "system (WaitlistEntry ELIGIBLE -> PENDING revert on refund or recalculation)"
        actor: system
        preconditions: ["linked WaitlistEntry reverted to PENDING"]
        side_effects: ["increments Applicant.version by 1"]
      - from: MATCH_ELIGIBLE
        to: MATCHED
        trigger: "system (MatchRecord PROPOSED -> ACCEPTED for this applicant's entry)"
        actor: system
        preconditions: ["linked WaitlistEntry ELIGIBLE"]
        side_effects: ["increments Applicant.version by 1"]
      - from: MATCHED
        to: MATCH_ELIGIBLE
        trigger: "system (MatchRecord ACCEPTED -> DISSOLVED)"
        actor: system
        preconditions: ["linked match dissolved"]
        side_effects: ["increments Applicant.version by 1"]
      - from: MATCHED
        to: TEAM_TRAINING
        trigger: "system (Enrollment created for this applicant's ACCEPTED match)"
        actor: system
        preconditions: ["linked MatchRecord ACCEPTED"]
        side_effects: ["increments Applicant.version by 1"]
      - from: TEAM_TRAINING
        to: MATCHED
        trigger: "system (TeamTrainingClass CANCELLED — match retained)"
        actor: system
        preconditions: ["enrollment withdrawn by class cancellation"]
        side_effects: ["increments Applicant.version by 1"]
      - from: TEAM_TRAINING
        to: MATCH_ELIGIBLE
        trigger: "system (Enrollment WITHDRAWN or FAILED — match dissolved)"
        actor: system
        preconditions: ["enrollment withdrawn or failed; match dissolved"]
        side_effects: ["increments Applicant.version by 1"]
      - from: TEAM_TRAINING
        to: PLACED
        trigger: "system (Enrollment GRADUATED)"
        actor: system
        preconditions: ["graduation requirements met"]
        side_effects: ["increments Applicant.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions:
          - "application_status in {SUBMITTED, IN_REVIEW, NEEDS_INFO, WAITLISTED, MATCH_ELIGIBLE, MATCHED, TEAM_TRAINING} (ERR_INVALID_STATE; PLACED applicants use partnership dissolve)"
          - "when actor is Applicant: acting Applicant id == this Applicant.id (ERR_OWNERSHIP_SCOPE)"
        side_effects:
          - "withdraw cascade: WaitlistEntry (if status in {PENDING, ELIGIBLE, MATCHED, SUSPENDED}) -> CLOSED"
          - "every Contribution PLEDGED -> VOID; every Contribution RECEIVED -> REFUNDED (each triggers refund_clawback recompute; raised_cents settles to 0)"
          - "ACCEPTED MatchRecord -> DISSOLVED and Dog MATCHED -> MATCH_READY"
          - "ENROLLED Enrollment -> WITHDRAWN, which itself reverts Dog TEAM_TRAINING -> MATCH_READY, dissolves the ACCEPTED MatchRecord, and decrements TeamTrainingClass.enrolled_count"
          - "increments Applicant.version by 1"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]
      - from: MATCH_ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]
      - from: MATCHED
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]
      - from: TEAM_TRAINING
        to: WITHDRAWN
        trigger: "POST /api/applicants/{id}/withdraw"
        actor: Applicant | IntakeCoordinator
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same cascade as SUBMITTED -> WITHDRAWN"]

  - entity: WaitlistEntry
    field: status
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system (contribution receive or recalculate leaves raised_cents >= effective_requirement_cents)"
        actor: system
        preconditions: ["raised_cents >= effective_requirement_cents (inclusive boundary)"]
        side_effects: ["Applicant WAITLISTED -> MATCH_ELIGIBLE", "rank_score recomputed (fundraising bonus +15 applies)"]
      - from: ELIGIBLE
        to: PENDING
        trigger: "system (refund_clawback or recalculate leaves raised_cents < effective_requirement_cents)"
        actor: system
        preconditions: ["raised_cents < effective_requirement_cents"]
        side_effects: ["Applicant MATCH_ELIGIBLE -> WAITLISTED", "rank_score recomputed (bonus removed)"]
      - from: ELIGIBLE
        to: MATCHED
        trigger: "system (MatchRecord PROPOSED -> ACCEPTED)"
        actor: system
        preconditions: ["match accepted referencing this entry"]
        side_effects: []
      - from: MATCHED
        to: ELIGIBLE
        trigger: "system (MatchRecord ACCEPTED -> DISSOLVED)"
        actor: system
        preconditions: ["match dissolved"]
        side_effects: ["dissolved_match_count += 1", "rank_score recomputed with dissolve penalty -10 per dissolved match"]
      - from: PENDING
        to: SUSPENDED
        trigger: "POST /api/waitlist-entries/{id}/suspend"
        actor: IntakeCoordinator
        preconditions: ["status in {PENDING, ELIGIBLE} (ERR_INVALID_STATE)"]
        side_effects: ["entry excluded from match_selector candidate pool"]
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /api/waitlist-entries/{id}/suspend"
        actor: IntakeCoordinator
        preconditions: ["status in {PENDING, ELIGIBLE} (ERR_INVALID_STATE)"]
        side_effects: ["entry excluded from match_selector candidate pool"]
      - from: SUSPENDED
        to: PENDING
        trigger: "POST /api/waitlist-entries/{id}/reinstate"
        actor: IntakeCoordinator
        preconditions: ["status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["target state PENDING when raised_cents < effective_requirement_cents", "rank_score recomputed"]
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /api/waitlist-entries/{id}/reinstate"
        actor: IntakeCoordinator
        preconditions: ["status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["target state ELIGIBLE when raised_cents >= effective_requirement_cents", "if ELIGIBLE: Applicant WAITLISTED -> MATCH_ELIGIBLE", "rank_score recomputed"]
      - from: PENDING
        to: CLOSED
        trigger: "system (applicant withdraws, or entry's enrollment graduates)"
        actor: system
        preconditions: ["applicant withdrew OR graduation completed"]
        side_effects: []
      - from: ELIGIBLE
        to: CLOSED
        trigger: "system (applicant withdraws)"
        actor: system
        preconditions: ["applicant withdrew"]
        side_effects: []
      - from: MATCHED
        to: CLOSED
        trigger: "system (applicant withdraws, or entry's enrollment graduates)"
        actor: system
        preconditions: ["applicant withdrew OR graduation completed"]
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "system (applicant withdraws)"
        actor: system
        preconditions: ["applicant withdrew"]
        side_effects: []

  - entity: Contribution
    field: status
    initial_state: PLEDGED
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /api/contributions/{id}/receive"
        actor: IntakeCoordinator
        preconditions:
          - "status == PLEDGED (ERR_INVALID_STATE)"
          - "acting operator id != created_by_user_id (ERR_SOD_CONFLICT)"
        side_effects:
          - "received_by_user_id := acting operator id"
          - "WaitlistEntry.raised_cents += amount_cents"
          - "if entry PENDING and raised_cents >= effective_requirement_cents: entry -> ELIGIBLE and Applicant WAITLISTED -> MATCH_ELIGIBLE"
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /api/contributions/{id}/refund"
        actor: IntakeCoordinator
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
          - "Applicant.application_status not in {PLACED} and linked WaitlistEntry.status != MATCHED (ERR_REFUND_NOT_ALLOWED)"
        side_effects:
          - "refund_clawback: WaitlistEntry.raised_cents -= amount_cents"
          - "if entry ELIGIBLE and raised_cents < effective_requirement_cents: entry -> PENDING and Applicant MATCH_ELIGIBLE -> WAITLISTED"
      - from: PLEDGED
        to: VOID
        trigger: "system (applicant withdraws)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PuppyRaiser
    field: status
    initial_state: APPLIED
    terminal_states: [INACTIVE]
    transitions:
      - from: APPLIED
        to: VETTED
        trigger: "POST /api/puppy-raisers/{id}/vet"
        actor: ProgramAdmin
        preconditions: ["status == APPLIED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VETTED
        to: APPROVED
        trigger: "POST /api/puppy-raisers/{id}/approve"
        actor: ProgramAdmin
        preconditions: ["status == VETTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "system (first RaiserPlacement created for this raiser)"
        actor: system
        preconditions: ["current_dog_count becomes 1"]
        side_effects: []
      - from: ACTIVE
        to: APPROVED
        trigger: "system (current_dog_count returns to 0 on placement complete/early-return)"
        actor: system
        preconditions: ["current_dog_count == 0"]
        side_effects: []
      - from: APPROVED
        to: ON_HIATUS
        trigger: "POST /api/puppy-raisers/{id}/hiatus"
        actor: PuppyRaiser | ProgramAdmin
        preconditions:
          - "status in {APPROVED, ACTIVE} and current_dog_count == 0 (ERR_INVALID_STATE)"
          - "when actor is PuppyRaiser: acting raiser id == this PuppyRaiser.id (ERR_OWNERSHIP_SCOPE)"
        side_effects: []
      - from: ACTIVE
        to: ON_HIATUS
        trigger: "POST /api/puppy-raisers/{id}/hiatus"
        actor: PuppyRaiser | ProgramAdmin
        preconditions: ["same as APPROVED -> ON_HIATUS"]
        side_effects: []
      - from: ON_HIATUS
        to: APPROVED
        trigger: "POST /api/puppy-raisers/{id}/resume"
        actor: PuppyRaiser | ProgramAdmin
        preconditions: ["status == ON_HIATUS (ERR_INVALID_STATE)", "ownership as above"]
        side_effects: []
      - from: APPLIED
        to: INACTIVE
        trigger: "POST /api/puppy-raisers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["status in {APPLIED, VETTED, APPROVED, ON_HIATUS} (ERR_INVALID_STATE)", "current_dog_count == 0 (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VETTED
        to: INACTIVE
        trigger: "POST /api/puppy-raisers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["same as APPLIED -> INACTIVE"]
        side_effects: []
      - from: APPROVED
        to: INACTIVE
        trigger: "POST /api/puppy-raisers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["same as APPLIED -> INACTIVE"]
        side_effects: []
      - from: ON_HIATUS
        to: INACTIVE
        trigger: "POST /api/puppy-raisers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["same as APPLIED -> INACTIVE"]
        side_effects: []

  - entity: Trainer
    field: status
    initial_state: PROBATION
    terminal_states: [INACTIVE]
    transitions:
      - from: PROBATION
        to: CERTIFIED
        trigger: "POST /api/trainers/{id}/certify"
        actor: ProgramAdmin
        preconditions: ["status == PROBATION (ERR_INVALID_STATE)"]
        side_effects: []
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /api/trainers/{id}/suspend"
        actor: ProgramAdmin
        preconditions: ["status == CERTIFIED (ERR_INVALID_STATE)"]
        side_effects: ["SUSPENDED trainers are excluded from new milestone recording, class lead assignment, and evaluator duty (ERR_INVALID_STATE on those endpoints)"]
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /api/trainers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PROBATION
        to: INACTIVE
        trigger: "POST /api/trainers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["status in {PROBATION, CERTIFIED, SUSPENDED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: CERTIFIED
        to: INACTIVE
        trigger: "POST /api/trainers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["same as PROBATION -> INACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: INACTIVE
        trigger: "POST /api/trainers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["same as PROBATION -> INACTIVE"]
        side_effects: []

  - entity: Dog
    field: status
    initial_state: REGISTERED
    terminal_states: [CAREER_CHANGED, RETIRED]
    transitions:
      - from: REGISTERED
        to: IN_HEALTH_SCREENING
        trigger: "POST /api/dogs/{id}/begin-screening"
        actor: Veterinarian
        preconditions: ["status == REGISTERED (ERR_INVALID_STATE)"]
        side_effects: ["increments Dog.version by 1"]
      - from: IN_HEALTH_SCREENING
        to: CLEARED
        trigger: "system (HealthScreening submitted with outcome CLEARED)"
        actor: system
        preconditions: ["submitted screening outcome CLEARED per health_clearance_score"]
        side_effects: ["clearance_score := screening.clearance_score", "increments Dog.version by 1"]
      - from: IN_HEALTH_SCREENING
        to: CAREER_CHANGED
        trigger: "system (HealthScreening submitted with outcome FAILED)"
        actor: system
        preconditions: ["submitted screening outcome FAILED per health_clearance_score"]
        side_effects: ["career_change_reason := HEALTH", "clearance_score := screening.clearance_score", "increments Dog.version by 1"]
      - from: CLEARED
        to: RAISER_PLACED
        trigger: "system (RaiserPlacement created)"
        actor: system
        preconditions: ["reachable only via a submitted CLEARED HealthScreening (state-guarded)"]
        side_effects: ["increments Dog.version by 1"]
      - from: RECALLED
        to: RAISER_PLACED
        trigger: "system (RaiserPlacement created)"
        actor: system
        preconditions: ["same as CLEARED -> RAISER_PLACED"]
        side_effects: ["increments Dog.version by 1"]
      - from: RAISER_PLACED
        to: RECALLED
        trigger: "system (RaiserPlacement ACTIVE -> EARLY_RETURN)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: RAISER_PLACED
        to: IN_ADVANCED_TRAINING
        trigger: "system (RaiserPlacement ACTIVE -> COMPLETED)"
        actor: system
        preconditions: ["payload primary_trainer_id references a Trainer with status CERTIFIED (ERR_INVALID_STATE)"]
        side_effects: ["primary_trainer_id := placement-completion payload trainer", "increments Dog.version by 1"]
      - from: IN_ADVANCED_TRAINING
        to: MATCH_READY
        trigger: "system (training_advancement gates satisfied by a new TrainingMilestone)"
        actor: system
        preconditions:
          - ">= 6 TrainingMilestones recorded"
          - "cumulative_gate_score >= 80.0"
          - "rolling_avg_3 >= 70.0"
          - "no score < 40 among the latest 3 milestones"
          - "at most 1 recorded milestone with score < 50"
        side_effects: ["increments Dog.version by 1"]
      - from: MATCH_READY
        to: MATCHED
        trigger: "system (MatchRecord PROPOSED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: MATCHED
        to: MATCH_READY
        trigger: "system (MatchRecord ACCEPTED -> DISSOLVED)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: MATCHED
        to: TEAM_TRAINING
        trigger: "system (Enrollment created)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: TEAM_TRAINING
        to: MATCHED
        trigger: "system (TeamTrainingClass CANCELLED — match retained)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: TEAM_TRAINING
        to: MATCH_READY
        trigger: "system (Enrollment WITHDRAWN or FAILED — match dissolved)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: TEAM_TRAINING
        to: PLACED
        trigger: "system (Enrollment GRADUATED)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: PLACED
        to: RETIRED
        trigger: "system (Partnership -> RETIRED)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: PLACED
        to: MATCH_READY
        trigger: "system (Partnership -> DISSOLVED; dog returns to program)"
        actor: system
        preconditions: []
        side_effects: ["increments Dog.version by 1"]
      - from: RAISER_PLACED
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["status in {RAISER_PLACED, RECALLED, IN_ADVANCED_TRAINING, MATCH_READY, MATCHED, TEAM_TRAINING} (ERR_INVALID_STATE)"]
        side_effects:
          - "career-change cascade link 1: ACTIVE RaiserPlacement -> EARLY_RETURN; PuppyRaiser.current_dog_count -= 1; raiser ACTIVE -> APPROVED when count hits 0; raiser.last_placement_ended_at := now"
          - "career-change cascade link 2 (from MATCHED/TEAM_TRAINING): ACCEPTED MatchRecord -> DISSOLVED, which itself reverts WaitlistEntry MATCHED -> ELIGIBLE (dissolved_match_count += 1, rank recomputed) and Applicant MATCHED/TEAM_TRAINING -> MATCH_ELIGIBLE"
          - "career-change cascade link 2 (from TEAM_TRAINING): ENROLLED Enrollment -> WITHDRAWN, which itself decrements TeamTrainingClass.enrolled_count"
          - "career_change_reason := payload reason_category"
          - "increments Dog.version by 1"
      - from: RECALLED
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["same as RAISER_PLACED -> CAREER_CHANGED"]
        side_effects: ["same cascade as RAISER_PLACED -> CAREER_CHANGED (links apply only to entities present)"]
      - from: IN_ADVANCED_TRAINING
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["same as RAISER_PLACED -> CAREER_CHANGED"]
        side_effects: ["same cascade as RAISER_PLACED -> CAREER_CHANGED"]
      - from: MATCH_READY
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["same as RAISER_PLACED -> CAREER_CHANGED"]
        side_effects: ["same cascade as RAISER_PLACED -> CAREER_CHANGED"]
      - from: MATCHED
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["same as RAISER_PLACED -> CAREER_CHANGED"]
        side_effects: ["same cascade as RAISER_PLACED -> CAREER_CHANGED"]
      - from: TEAM_TRAINING
        to: CAREER_CHANGED
        trigger: "POST /api/dogs/{id}/career-change"
        actor: TrainingDirector
        preconditions: ["same as RAISER_PLACED -> CAREER_CHANGED"]
        side_effects: ["same cascade as RAISER_PLACED -> CAREER_CHANGED"]

  - entity: HealthScreening
    field: status
    initial_state: DRAFT
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: DRAFT
        to: CLEARED
        trigger: "POST /api/screenings/{id}/submit"
        actor: Veterinarian
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)", "health_clearance_score yields pass for the dog's origin"]
        side_effects: ["clearance_score computed and stored", "Dog IN_HEALTH_SCREENING -> CLEARED with clearance_score"]
      - from: DRAFT
        to: FAILED
        trigger: "POST /api/screenings/{id}/submit"
        actor: Veterinarian
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)", "health_clearance_score yields fail for the dog's origin (hard-fail zero or below threshold)"]
        side_effects: ["clearance_score computed and stored", "Dog IN_HEALTH_SCREENING -> CAREER_CHANGED with career_change_reason HEALTH"]

  - entity: RaiserPlacement
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, EARLY_RETURN]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/raiser-placements/{id}/complete"
        actor: TrainingDirector
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)", "payload primary_trainer_id references CERTIFIED Trainer (ERR_INVALID_STATE)"]
        side_effects:
          - "Dog RAISER_PLACED -> IN_ADVANCED_TRAINING; primary_trainer_id set"
          - "PuppyRaiser.current_dog_count -= 1; last_placement_ended_at := now; ACTIVE -> APPROVED when count hits 0"
      - from: ACTIVE
        to: EARLY_RETURN
        trigger: "POST /api/raiser-placements/{id}/early-return"
        actor: TrainingDirector | PuppyRaiser
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "when actor is PuppyRaiser: acting raiser id == placement.puppy_raiser_id (ERR_OWNERSHIP_SCOPE)"
        side_effects:
          - "Dog RAISER_PLACED -> RECALLED"
          - "PuppyRaiser.current_dog_count -= 1; last_placement_ended_at := now; ACTIVE -> APPROVED when count hits 0"

  - entity: MatchRecord
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, DISSOLVED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/matches/{id}/accept"
        actor: IntakeCoordinator
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
          - "Dog.status == MATCH_READY (ERR_INVALID_STATE)"
          - "WaitlistEntry.status == ELIGIBLE (ERR_INVALID_STATE)"
        side_effects:
          - "Dog MATCH_READY -> MATCHED"
          - "WaitlistEntry ELIGIBLE -> MATCHED"
          - "Applicant MATCH_ELIGIBLE -> MATCHED"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/matches/{id}/reject"
        actor: IntakeCoordinator
        preconditions: ["status == PROPOSED (ERR_INVALID_STATE)"]
        side_effects: ["Dog remains MATCH_READY; entry remains ELIGIBLE"]
      - from: ACCEPTED
        to: DISSOLVED
        trigger: "POST /api/matches/{id}/dissolve OR system (career-change / withdraw / enrollment-withdraw / PAT-fail cascades)"
        actor: IntakeCoordinator | system
        preconditions: ["status == ACCEPTED (ERR_INVALID_STATE)"]
        side_effects:
          - "Dog MATCHED -> MATCH_READY (or TEAM_TRAINING -> MATCH_READY when dissolved mid-class)"
          - "WaitlistEntry MATCHED -> ELIGIBLE; dissolved_match_count += 1; rank_score recomputed"
          - "Applicant MATCHED -> MATCH_ELIGIBLE (or TEAM_TRAINING -> MATCH_ELIGIBLE mid-class); skipped when applicant already WITHDRAWN (entry then -> CLOSED)"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (Enrollment GRADUATED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TeamTrainingClass
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ENROLLING
        trigger: "POST /api/classes/{id}/open-enrollment"
        actor: TrainingDirector
        preconditions: ["status == PLANNED (ERR_INVALID_STATE)", "lead Trainer status == CERTIFIED (ERR_INVALID_STATE)"]
        side_effects: ["increments TeamTrainingClass.version by 1"]
      - from: ENROLLING
        to: IN_SESSION
        trigger: "POST /api/classes/{id}/start"
        actor: TrainingDirector
        preconditions:
          - "status == ENROLLING (ERR_INVALID_STATE)"
          - "enrolled_count >= 1 (MIN_CLASS_SIZE; ERR_CLASS_TOO_SMALL)"
          - "logical clock date >= starts_on (ERR_ENROLLMENT_WINDOW)"
        side_effects: ["increments TeamTrainingClass.version by 1"]
      - from: IN_SESSION
        to: GRADUATION_REVIEW
        trigger: "POST /api/classes/{id}/begin-graduation-review"
        actor: TrainingDirector
        preconditions: ["status == IN_SESSION (ERR_INVALID_STATE)", "logical clock date > ends_on (ERR_ENROLLMENT_WINDOW)"]
        side_effects: ["increments TeamTrainingClass.version by 1"]
      - from: GRADUATION_REVIEW
        to: COMPLETED
        trigger: "POST /api/classes/{id}/complete"
        actor: TrainingDirector
        preconditions:
          - "status == GRADUATION_REVIEW (ERR_INVALID_STATE)"
          - "every Enrollment status in {GRADUATED, FAILED, WITHDRAWN} (ERR_INVALID_STATE)"
        side_effects: ["increments TeamTrainingClass.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/classes/{id}/cancel"
        actor: TrainingDirector
        preconditions: ["status in {PLANNED, ENROLLING, IN_SESSION} (ERR_INVALID_STATE)"]
        side_effects:
          - "class-cancel cascade link 1: every ENROLLED Enrollment -> WITHDRAWN"
          - "class-cancel cascade link 2: each withdrawn enrollment's Dog TEAM_TRAINING -> MATCHED and Applicant TEAM_TRAINING -> MATCHED (match retained; MatchRecord stays ACCEPTED)"
          - "class-cancel cascade link 3: enrolled_count recomputed to 0"
          - "increments TeamTrainingClass.version by 1"
      - from: ENROLLING
        to: CANCELLED
        trigger: "POST /api/classes/{id}/cancel"
        actor: TrainingDirector
        preconditions: ["same as PLANNED -> CANCELLED"]
        side_effects: ["same cascade as PLANNED -> CANCELLED"]
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /api/classes/{id}/cancel"
        actor: TrainingDirector
        preconditions: ["same as PLANNED -> CANCELLED"]
        side_effects: ["same cascade as PLANNED -> CANCELLED"]

  - entity: Enrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [GRADUATED, FAILED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /api/enrollments/{id}/graduate"
        actor: TrainingDirector
        preconditions:
          - "status == ENROLLED (ERR_INVALID_STATE)"
          - "TeamTrainingClass.status == GRADUATION_REVIEW (ERR_INVALID_STATE)"
          - "attendance_pct >= 85.0 (ERR_ATTENDANCE_BELOW_THRESHOLD)"
          - "exists PublicAccessTest of this enrollment with status SCORED_PASS (ERR_GRADUATION_REQUIREMENTS)"
        side_effects:
          - "create Partnership: status ACTIVE, activated_at := now, recert_due_at := now + 365 days; auto-create 3 FollowUps SCHEDULED at +90/+180/+270 days (auto_generated true)"
          - "Dog TEAM_TRAINING -> PLACED"
          - "Applicant TEAM_TRAINING -> PLACED"
          - "MatchRecord ACCEPTED -> COMPLETED"
          - "WaitlistEntry MATCHED -> CLOSED"
      - from: ENROLLED
        to: FAILED
        trigger: "system (PublicAccessTest scored FAIL at attempt_number == 2)"
        actor: system
        preconditions: ["second non-INVALIDATED PAT scored fail"]
        side_effects:
          - "PAT-fail cascade link 1: MatchRecord ACCEPTED -> DISSOLVED"
          - "PAT-fail cascade link 2: Dog TEAM_TRAINING -> MATCH_READY; WaitlistEntry MATCHED -> ELIGIBLE (dissolved_match_count += 1); Applicant TEAM_TRAINING -> MATCH_ELIGIBLE"
          - "PAT-fail cascade link 3: TeamTrainingClass.enrolled_count -= 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /api/enrollments/{id}/withdraw OR system (class cancel / applicant withdraw / dog career change)"
        actor: TrainingDirector | system
        preconditions: ["status == ENROLLED (ERR_INVALID_STATE)"]
        side_effects:
          - "when actor-initiated withdraw: MatchRecord ACCEPTED -> DISSOLVED (its side effects fire), Dog TEAM_TRAINING -> MATCH_READY, Applicant TEAM_TRAINING -> MATCH_ELIGIBLE"
          - "when class-cancel: Dog TEAM_TRAINING -> MATCHED, Applicant TEAM_TRAINING -> MATCHED, match retained"
          - "TeamTrainingClass.enrolled_count -= 1"

  - entity: PublicAccessTest
    field: status
    initial_state: SCHEDULED
    terminal_states: [SCORED_PASS, SCORED_FAIL, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: SCORED_PASS
        trigger: "POST /api/public-access-tests/{id}/score"
        actor: Evaluator
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
          - "acting Evaluator id == evaluator_id (ERR_OWNERSHIP_SCOPE)"
          - "pat_scoring passes all gates"
        side_effects: ["section_percents, official_score, passed_gates computed and stored"]
      - from: SCHEDULED
        to: SCORED_FAIL
        trigger: "POST /api/public-access-tests/{id}/score"
        actor: Evaluator
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)", "acting Evaluator id == evaluator_id", "pat_scoring fails any gate"]
        side_effects:
          - "section_percents, official_score, passed_gates computed and stored"
          - "when attempt_number == 2: Enrollment ENROLLED -> FAILED with the PAT-fail cascade"
      - from: SCHEDULED
        to: INVALIDATED
        trigger: "POST /api/public-access-tests/{id}/invalidate"
        actor: TrainingDirector
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["invalidated tests do not count toward the 2-attempt cap"]

  - entity: Partnership
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED, DISSOLVED]
    transitions:
      - from: ACTIVE
        to: RECERT_DUE
        trigger: "system (clock sweep: logical date > recert_due_at and no COMPLETED_PASS recertification since activation)"
        actor: system
        preconditions: ["recert_due_at passed without pass"]
        side_effects: ["increments Partnership.version by 1"]
      - from: RECERT_DUE
        to: ACTIVE
        trigger: "system (Recertification -> COMPLETED_PASS)"
        actor: system
        preconditions: []
        side_effects: ["recert_due_at := completed_on + 365 days", "last_recert_passed_at := completion timestamp", "increments Partnership.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/partnerships/{id}/suspend"
        actor: TrainingDirector
        preconditions: ["status in {ACTIVE, RECERT_DUE} (ERR_INVALID_STATE)"]
        side_effects: ["increments Partnership.version by 1"]
      - from: RECERT_DUE
        to: SUSPENDED
        trigger: "POST /api/partnerships/{id}/suspend OR system (Recertification -> FAILED_FINAL)"
        actor: TrainingDirector | system
        preconditions: ["status in {ACTIVE, RECERT_DUE} (ERR_INVALID_STATE)"]
        side_effects: ["increments Partnership.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/partnerships/{id}/reinstate"
        actor: TrainingDirector
        preconditions: ["status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["recert schedule re-evaluated: if logical date > recert_due_at, lands in RECERT_DUE instead", "increments Partnership.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/partnerships/{id}/retire"
        actor: TrainingDirector
        preconditions: ["status in {ACTIVE, RECERT_DUE, SUSPENDED} (ERR_INVALID_STATE)"]
        side_effects: ["Dog PLACED -> RETIRED", "open FollowUps (SCHEDULED) -> WAIVED", "increments Partnership.version by 1"]
      - from: RECERT_DUE
        to: RETIRED
        trigger: "POST /api/partnerships/{id}/retire"
        actor: TrainingDirector
        preconditions: ["same as ACTIVE -> RETIRED"]
        side_effects: ["same as ACTIVE -> RETIRED"]
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /api/partnerships/{id}/retire"
        actor: TrainingDirector
        preconditions: ["same as ACTIVE -> RETIRED"]
        side_effects: ["same as ACTIVE -> RETIRED"]
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /api/partnerships/{id}/dissolve"
        actor: TrainingDirector
        preconditions: ["status in {ACTIVE, RECERT_DUE, SUSPENDED} (ERR_INVALID_STATE)"]
        side_effects: ["Dog PLACED -> MATCH_READY", "open FollowUps (SCHEDULED) -> WAIVED", "increments Partnership.version by 1"]
      - from: RECERT_DUE
        to: DISSOLVED
        trigger: "POST /api/partnerships/{id}/dissolve"
        actor: TrainingDirector
        preconditions: ["same as ACTIVE -> DISSOLVED"]
        side_effects: ["same as ACTIVE -> DISSOLVED"]
      - from: SUSPENDED
        to: DISSOLVED
        trigger: "POST /api/partnerships/{id}/dissolve"
        actor: TrainingDirector
        preconditions: ["same as ACTIVE -> DISSOLVED"]
        side_effects: ["same as ACTIVE -> DISSOLVED"]

  - entity: FollowUp
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/follow-ups/{id}/complete"
        actor: TrainingDirector
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)", "Partnership.status in {ACTIVE, RECERT_DUE} (ERR_INVALID_STATE)"]
        side_effects: ["completed_on := logical date; outcome := payload", "Partnership.followups_completed += 1"]
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /api/follow-ups/{id}/waive OR system (partnership retire/dissolve)"
        actor: TrainingDirector | system
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: MISSED
        trigger: "system (clock sweep: logical date > due_on + 7 days grace)"
        actor: system
        preconditions: ["due date + grace elapsed without completion"]
        side_effects: []

  - entity: Recertification
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, FAILED_FINAL]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /api/recertifications/{id}/record-result with outcome PASS"
        actor: Evaluator
        preconditions: ["status in {SCHEDULED, REMEDIATION} (ERR_INVALID_STATE)", "acting Evaluator id == evaluator_id (ERR_OWNERSHIP_SCOPE)"]
        side_effects: ["completed_on := logical date", "Partnership RECERT_DUE -> ACTIVE (or stays ACTIVE); recert_due_at := completed_on + 365 days; last_recert_passed_at set"]
      - from: SCHEDULED
        to: REMEDIATION
        trigger: "POST /api/recertifications/{id}/record-result with outcome FAIL"
        actor: Evaluator
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)", "acting Evaluator id == evaluator_id"]
        side_effects: ["completed_on := logical date"]
      - from: REMEDIATION
        to: COMPLETED_PASS
        trigger: "POST /api/recertifications/{id}/record-result with outcome PASS"
        actor: Evaluator
        preconditions: ["same as SCHEDULED -> COMPLETED_PASS"]
        side_effects: ["same as SCHEDULED -> COMPLETED_PASS"]
      - from: REMEDIATION
        to: FAILED_FINAL
        trigger: "POST /api/recertifications/{id}/record-result with outcome FAIL"
        actor: Evaluator
        preconditions: ["status == REMEDIATION (ERR_INVALID_STATE)", "acting Evaluator id == evaluator_id"]
        side_effects: ["completed_on := logical date", "Partnership -> SUSPENDED"]

  - entity: SupportRequest
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /api/support-requests/{id}/triage"
        actor: TrainingDirector
        preconditions: ["status == OPEN (ERR_INVALID_STATE)"]
        side_effects: ["priority := payload priority"]
      - from: TRIAGED
        to: IN_PROGRESS
        trigger: "POST /api/support-requests/{id}/start"
        actor: TrainingDirector
        preconditions: ["status in {TRIAGED, REOPENED} (ERR_INVALID_STATE)", "payload assigned_trainer_id references Trainer with status CERTIFIED (ERR_INVALID_STATE)"]
        side_effects: ["assigned_trainer_id := payload"]
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /api/support-requests/{id}/start"
        actor: TrainingDirector
        preconditions: ["same as TRIAGED -> IN_PROGRESS"]
        side_effects: ["assigned_trainer_id := payload"]
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /api/support-requests/{id}/resolve"
        actor: Trainer | TrainingDirector
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "when actor is Trainer: acting Trainer id == assigned_trainer_id (ERR_OWNERSHIP_SCOPE)"
        side_effects: ["resolved_at := logical clock"]
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /api/support-requests/{id}/reopen"
        actor: Applicant
        preconditions:
          - "status == RESOLVED (ERR_INVALID_STATE)"
          - "acting Applicant id == partnership.applicant_id (ERR_OWNERSHIP_SCOPE)"
          - "logical clock <= resolved_at + 14 days (ERR_REOPEN_WINDOW_EXPIRED)"
        side_effects: ["resolved_at := null"]
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /api/support-requests/{id}/close"
        actor: TrainingDirector
        preconditions: ["status == RESOLVED (ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-stale-class
    parent_entity: TeamTrainingClass
    write_endpoint: "POST /api/classes/{id}/enrollments"
    occ_field: "expected_class_version"
    description: |
      Creating an Enrollment against a TeamTrainingClass whose version has
      advanced since the client last observed it is rejected. This covers the
      case where another writer has just enrolled a pair (legitimately
      consuming a seat) and the current writer's view of remaining capacity
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: match-propose-stale-dog
    parent_entity: Dog
    write_endpoint: "POST /api/dogs/{id}/match-proposals"
    occ_field: "expected_dog_version"
    description: |
      Creating a MatchRecord proposal against a Dog whose version has
      advanced since the client last observed it is rejected. This covers
      the case where another writer's proposal has just been accepted (or a
      milestone advanced the dog) and the current writer's view of the dog
      is therefore stale.
    error_id: ERR_STALE_DOG_VERSION
    http_status: 412
  - rule_id: recert-schedule-stale-partnership
    parent_entity: Partnership
    write_endpoint: "POST /api/partnerships/{id}/recertifications"
    occ_field: "expected_partnership_version"
    description: |
      Creating a Recertification against a Partnership whose version has
      advanced since the client last observed it is rejected. This covers
      the case where another writer has just scheduled a recertification
      (or a sweep moved the partnership into RECERT_DUE) and the current
      writer's view of the recert calendar is therefore stale.
    error_id: ERR_STALE_PARTNERSHIP_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (10 rules)
# =============================================================================
calculations:
  - name: fundraising_requirement
    trigger: "WaitlistEntry creation (provisional variant); POST /api/waitlist-entries/{id}/recalculate (final variant)"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
      1. gross = BASE_REQUIREMENT_CENTS[placement_track]
      2. income = applicant.household_income_cents (provisional) or payload.verified_income_cents (final)
      3. credit_pct: income < 3000000 -> 0.60; 3000000 <= income < 6000000 -> 0.40;
         6000000 <= income < 10000000 -> 0.20; income >= 10000000 -> 0.00 (boundaries inclusive-low)
      4. income_credit = round_half_up(gross * credit_pct) to whole cents
      5. provisional_net = gross - income_credit
      6. FINAL variant ONLY: subsidy_tier on provisional_net: >= 1000000 -> 0.10 else 0.15;
         subsidy = round_half_up(provisional_net * subsidy_tier);
         net = provisional_net - subsidy
      7. PROVISIONAL variant ONLY: subsidy_tier on GROSS: >= 1000000 -> 0.10 else 0.15;
         subsidy = round_half_up(gross * subsidy_tier);
         net = gross - income_credit - subsidy
    input_set: "Applicant placement_track + income; constants below"
    constants:
      BASE_MOBILITY_CENTS: 1500000
      BASE_PTSD_CENTS: 1800000
      BASE_AUTISM_CENTS: 1800000
      BASE_FACILITY_CENTS: 900000
      BRACKET1_LIMIT_CENTS: 3000000
      BRACKET2_LIMIT_CENTS: 6000000
      BRACKET3_LIMIT_CENTS: 10000000
      CREDIT_PCT_1: 0.60
      CREDIT_PCT_2: 0.40
      CREDIT_PCT_3: 0.20
      CREDIT_PCT_4: 0.00
      SUBSIDY_TIER_THRESHOLD_CENTS: 1000000
      SUBSIDY_PCT_HIGH: 0.10
      SUBSIDY_PCT_LOW: 0.15
    precision: "integer cents; round_half_up to whole cent at each multiplication"
    variants:
      - name: provisional
        when: "WaitlistEntry creation at approve time; uses self-reported income"
        difference: "subsidy tier keyed on GROSS requirement and subsidy base is gross; written to requirement_provisional_cents"
      - name: final
        when: "POST /api/waitlist-entries/{id}/recalculate; uses verified income from payload"
        difference: "subsidy tier keyed on provisional_net (post-credit) and subsidy base is provisional_net; written to requirement_final_cents; identical inputs can diverge from provisional (e.g. MOBILITY @ income 4500000: provisional 750000 vs final 765000)"

  - name: waitlist_rank_score
    trigger: "WaitlistEntry creation, eligibility flip, dissolve, clock sweep"
    algorithm: weighted_scoring
    formula: |
      wait_days = floor((current_utc - listed_at) / 86400 seconds)
      rank_score = round_half_up(
          min(WAIT_CAP, wait_days * WAIT_PTS_PER_DAY)
        + URGENCY_PTS[latest FINALIZED_ACCEPTED assessment.task_urgency_tier]
        + min(HOME_CAP, home_environment_score * HOME_PTS_PER_POINT)
        + (FUNDRAISING_BONUS if status == ELIGIBLE else 0)
        - DISSOLVE_PENALTY * dissolved_match_count
      , 1)
    input_set: "The entry plus its applicant's latest FINALIZED_ACCEPTED TaskAssessment (urgency tier, home score); entry status; dissolved count; logical clock"
    constants:
      WAIT_PTS_PER_DAY: 0.5
      WAIT_CAP: 40
      URGENCY_PTS_STANDARD: 10
      URGENCY_PTS_HIGH: 25
      URGENCY_PTS_CRITICAL: 40
      HOME_PTS_PER_POINT: 2
      HOME_CAP: 20
      FUNDRAISING_BONUS: 15
      DISSOLVE_PENALTY: 10
    precision: "1 decimal place, round_half_up"

  - name: health_clearance_score
    trigger: "POST /api/screenings/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      component points: hip {EXCELLENT:30, GOOD:24, FAIR:12, POOR:0};
        elbow {NORMAL:20, GRADE1:8, GRADE2:0}; eye {CLEAR:15, ABNORMAL:0};
        cardiac {NORMAL:15, ABNORMAL:0}; genetic {CLEAR:20, CARRIER:10, AFFECTED:0}
      clearance_score = sum of the five component points
      HARD FAIL (outcome FAILED regardless of total): any single component scores 0
      origin gates:
        origin == DONATED: pass iff clearance_score >= 84 and no hard fail
        origin == BRED:    pass iff clearance_score >= 92 and genetic_panel == CLEAR and no other hard fail
    input_set: "The DRAFT HealthScreening being submitted and its Dog.origin"
    constants:
      DONATED_THRESHOLD: 84
      BRED_THRESHOLD: 92
    precision: "integer points, no rounding"
    variants:
      - name: donated_track
        when: "Dog.origin == DONATED"
        difference: "threshold 84, genetic CARRIER tolerated (10 pts)"
      - name: bred_track
        when: "Dog.origin == BRED"
        difference: "threshold 92 and genetic_panel must be CLEAR — identical component scores can pass DONATED yet fail BRED (e.g. 84 with CARRIER passes DONATED, fails BRED twice over)"

  - name: training_advancement
    trigger: "POST /api/dogs/{id}/milestones (after persist)"
    algorithm: chronological
    formula: |
      Chronological order: milestones ordered by recorded_at ASC, ties by created_at ASC.
      rolling_avg_3 = round_half_up(mean of scores of latest 3 milestones), 1 decimal)
      cumulative_gate_score = round_half_up(
          0.5 * mean(all TASK_WORK scores)
        + 0.3 * mean(all PUBLIC_MANNERS scores)
        + 0.2 * mean(all OBEDIENCE and SOCIALIZATION scores combined), 1)
        (a category absent from the record contributes 0 to the numerator and its weight is dropped from the denominator — renormalize over present weights)
      certified_tasks := set of task_code over TASK_WORK milestones with score >= 80
      MATCH_READY gates (dog IN_ADVANCED_TRAINING only):
        count >= 6 AND cumulative_gate_score >= 80.0 AND rolling_avg_3 >= 70.0
        AND no score < 40 among latest 3 AND at most 1 milestone total with score < 50
      career_change_recommended (flag surfaced on the milestone response) when latest 2 scores both < 50
    input_set: "All TrainingMilestones of the dog, chronological"
    constants:
      GATE_MIN_MILESTONES: 6
      GATE_CUMULATIVE: 80.0
      GATE_ROLLING: 70.0
      GATE_FLOOR_RECENT: 40
      GATE_MAX_LOW_TOTAL: 1
      CERTIFY_TASK_MIN_SCORE: 80
    precision: "1 decimal place, round_half_up"
    variants:
      - name: rolling_window
        when: "progress readout on each milestone response"
        difference: "latest-3 mean only; a strong early history cannot rescue a recent dip"
      - name: cumulative_gate
        when: "MATCH_READY advancement gate"
        difference: "category-weighted mean over ALL milestones; identical milestone sets can satisfy cumulative_gate while failing rolling_window (e.g. 6 milestones: 95TW,90TW,88PM,85OB,82SOC,41TW -> cumulative 80.8 >= 80 but rolling 69.3 < 70, so no advancement)"

  - name: pat_scoring
    trigger: "POST /api/public-access-tests/{id}/score"
    algorithm: aggregation
    formula: |
      Rounding order PINNED (per-section-then-average):
      1. For each section: section_sum = sum of raw_score over its exercises
         (CONTROL 6 ex C1..C6 max 18; PUBLIC_MANNERS 4 ex P1..P4 max 12; SAFETY 2 ex S1..S2 max 6)
      2. section_percent = round_half_up(100 * section_sum / section_max, 1) per section
      3. official_score = round_half_up((control + public_manners + safety) / 3, 1)
      Pass gates: official_score >= 80.0 (inclusive) AND every raw_score >= 1 AND S1 raw >= 2 AND S2 raw >= 2
      status := SCORED_PASS when all gates hold else SCORED_FAIL
    input_set: "Payload exercise_scores (12 entries, one per exercise code)"
    constants:
      PASS_THRESHOLD: 80.0
      MIN_RAW_ANY: 1
      MIN_RAW_SAFETY: 2
    precision: "1 decimal place, round_half_up at each of steps 2 and 3 — never sum-then-round"
    variants: []

  - name: graduation_eligibility
    trigger: "POST /api/enrollments/{id}/graduate"
    algorithm: threshold
    formula: |
      attendance_pct = round_half_up(100 * sessions_attended / class.total_sessions, 1)
      eligible iff: class.status == GRADUATION_REVIEW
        AND attendance_pct >= 85.0 (inclusive boundary)
        AND exists PublicAccessTest for enrollment with status SCORED_PASS
    input_set: "The enrollment, its class, its PATs"
    constants:
      ATTENDANCE_THRESHOLD: 85.0
    precision: "1 decimal place, round_half_up"

  - name: match_selector
    trigger: "POST /api/dogs/{id}/match-proposals with waitlist_entry_id omitted"
    algorithm: selector_policy
    formula: |
      Eligibility filter: WaitlistEntry.status == ELIGIBLE
        AND applicant's required_tasks (latest FINALIZED_ACCEPTED assessment) is a subset of dog.certified_tasks
        (subset failure on an explicit waitlist_entry_id -> ERR_TASK_COVERAGE_INSUFFICIENT;
         filtered-out candidates are silently excluded in selector mode)
      Ranking: rank_score DESC
      Tie-break 1: listed_at ASC (earlier listing wins)
      Tie-break 2: applicant.created_at ASC
      Empty pool -> ERR_NO_ELIGIBLE_MATCH
    input_set: "All WaitlistEntries (filtered), the MATCH_READY dog"
    constants: {}
    precision: "n/a"

  - name: raiser_selector
    trigger: "POST /api/dogs/{id}/raiser-placements with puppy_raiser_id omitted"
    algorithm: selector_policy
    formula: |
      Eligibility filter: PuppyRaiser.status in {APPROVED, ACTIVE}
        AND current_dog_count < foster_capacity
        AND region == dog.region
      Ranking: experience_score DESC
      Tie-break 1: last_placement_ended_at ASC with NULLS LAST (never-placed raisers lose ties to previously-active ones)
      Tie-break 2: created_at ASC
      Empty pool -> ERR_NO_AVAILABLE_RAISER
      Explicit puppy_raiser_id bypasses ranking but still enforces the filter
      (status/capacity violations -> ERR_RAISER_CAPACITY; region mismatch -> ERR_VALIDATION)
    input_set: "All PuppyRaisers, the dog"
    constants: {}
    precision: "n/a"

  - name: recert_and_followup_schedule
    trigger: "graduation (schedule creation); POST /api/_clock/set_current_utc (sweep); recert pass (reschedule)"
    algorithm: forward_looking
    formula: |
      At graduation: recert_due_at = activated_at + 365 days;
        auto-create 3 FollowUps due_on = activated date + 90, +180, +270 days (auto_generated = true)
      On recert COMPLETED_PASS: recert_due_at = completed_on + 365 days
      Clock sweep on every set_current_utc (advancing the logical clock):
        FollowUp SCHEDULED with current_date > due_on + 7 days -> MISSED
        Partnership ACTIVE with current_date > recert_due_at and no COMPLETED_PASS recert -> RECERT_DUE
        (sweep processes entities ordered by due_on/recert_due_at ASC, ties by created_at ASC)
    input_set: "Partnerships, their FollowUps and Recertifications; logical clock"
    constants:
      RECERT_INTERVAL_DAYS: 365
      FOLLOWUP_OFFSETS_DAYS: [90, 180, 270]
      FOLLOWUP_GRACE_DAYS: 7
    precision: "date arithmetic on ISO dates/timestamps; no rounding"

  - name: refund_clawback
    trigger: "POST /api/contributions/{id}/refund; withdraw cascade"
    algorithm: chronological
    formula: |
      On RECEIVED -> REFUNDED:
        1. WaitlistEntry.raised_cents -= contribution.amount_cents
        2. If entry ELIGIBLE and raised_cents < effective_requirement_cents:
             entry -> PENDING (rank_score recomputed without bonus);
             Applicant MATCH_ELIGIBLE -> WAITLISTED
        3. Ledger invariant maintained: raised_cents == SUM(amount_cents over RECEIVED contributions)
      Withdraw cascade processes PLEDGED -> VOID first, then RECEIVED -> REFUNDED in
      contribution created_at ASC order; raised_cents settles to exactly 0.
    input_set: "The refunded contribution, its applicant's WaitlistEntry and Applicant"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: request, check: "Request body well-formed: required fields present, enum members valid, numeric ranges respected (amounts positive, scores 0-100, ends_on > starts_on, capacity 2..6)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Entity-backed ownership scope: Applicant acts only on own records (resource's applicant chain terminates at acting id); PuppyRaiser only on own profile/placements; Evaluator only scores own tests/results; Trainer only resolves requests assigned to them", error_id: ERR_OWNERSHIP_SCOPE, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 5, category: existence, check: "Path parameters resolve left-to-right (parent before child)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 6, category: existence, check: "Body-supplied references resolve (waitlist_entry_id, puppy_raiser_id, primary_trainer_id, match_id, evaluator_id, sire_id/dam_id, lead_trainer_id, assigned_trainer_id)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints taking body references" }
  - { priority: 7, category: business_constraint, check: "OCC: expected_class_version equals the class's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/classes/{id}/enrollments" }
  - { priority: 7, category: business_constraint, check: "OCC: expected_dog_version equals the dog's current version", error_id: ERR_STALE_DOG_VERSION, http_status: 412, applies_to: "POST /api/dogs/{id}/match-proposals" }
  - { priority: 7, category: business_constraint, check: "OCC: expected_partnership_version equals the partnership's current version", error_id: ERR_STALE_PARTNERSHIP_VERSION, http_status: 412, applies_to: "POST /api/partnerships/{id}/recertifications" }
  - { priority: 8, category: state, check: "Terminal lockdown: no transition out of terminal states (DENIED/WITHDRAWN, CAREER_CHANGED/RETIRED, CLOSED, REFUNDED/VOID, INACTIVE, REJECTED/DISSOLVED/COMPLETED, COMPLETED/CANCELLED, GRADUATED/FAILED/WITHDRAWN, SCORED_*/INVALIDATED, RETIRED/DISSOLVED, COMPLETED/MISSED/WAIVED, COMPLETED_PASS/FAILED_FINAL, CLOSED)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "Resource is in a declared from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 10, category: state, check: "Fundraising operations require applicant not in {DENIED, WITHDRAWN, PLACED}", error_id: ERR_APPLICANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/applicants/{id}/contributions" }
  - { priority: 11, category: state, check: "Refunds blocked once entry MATCHED or applicant PLACED", error_id: ERR_REFUND_NOT_ALLOWED, http_status: 409, applies_to: "POST /api/contributions/{id}/refund" }
  - { priority: 13, category: business_safety, check: "Segregation of duties: PAT/recertification evaluator must differ from the dog's primary_trainer_id", error_id: ERR_EVALUATOR_CONFLICT, http_status: 409, applies_to: "POST /api/enrollments/{id}/public-access-tests, POST /api/partnerships/{id}/recertifications" }
  - { priority: 14, category: business_safety, check: "Segregation of duties: contribution receive operator must differ from created_by_user_id", error_id: ERR_SOD_CONFLICT, http_status: 409, applies_to: "POST /api/contributions/{id}/receive" }
  - { priority: 16, category: business_constraint, check: "Lineage: BRED requires sire_id (MALE dog) and dam_id (FEMALE dog), sire != dam, both existing; DONATED requires donor_name and forbids sire/dam", error_id: ERR_DONOR_LINEAGE_INVALID, http_status: 422, applies_to: "POST /api/dogs" }
  - { priority: 17, category: business_constraint, check: "Trainer class overlap: same lead trainer's classes use half-open [starts_on, ends_on) — overlap iff starts_on < other.ends_on AND ends_on > other.starts_on; adjacency (ends_on == other.starts_on) is ALLOWED", error_id: ERR_TRAINER_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /api/classes" }
  - { priority: 18, category: business_constraint, check: "Evaluator PAT buffer: evaluator occupied for [scheduled_at, scheduled_at + 60min) plus 30-minute buffer each side; a new SCHEDULED/SCORED_* PAT for the same evaluator whose buffered window intersects another's is rejected; windows exactly 30 minutes apart are ALLOWED", error_id: ERR_EVALUATOR_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /api/enrollments/{id}/public-access-tests" }
  - { priority: 19, category: business_constraint, check: "Raiser capacity for explicit puppy_raiser_id: status in {APPROVED, ACTIVE} and current_dog_count < foster_capacity", error_id: ERR_RAISER_CAPACITY, http_status: 409, applies_to: "POST /api/dogs/{id}/raiser-placements" }
  - { priority: 20, category: business_constraint, check: "Class seat capacity: enrolled_count < capacity at enrollment creation (enrolling the capacity-th pair succeeds)", error_id: ERR_CLASS_FULL, http_status: 409, applies_to: "POST /api/classes/{id}/enrollments" }
  - { priority: 21, category: business_constraint, check: "Class minimum size to start: enrolled_count >= 1", error_id: ERR_CLASS_TOO_SMALL, http_status: 409, applies_to: "POST /api/classes/{id}/start" }
  - { priority: 22, category: business_constraint, check: "Selector empty pool: no eligible raiser / no eligible waitlist entry", error_id: ERR_NO_AVAILABLE_RAISER, http_status: 409, applies_to: "POST /api/dogs/{id}/raiser-placements" }
  - { priority: 23, category: business_constraint, check: "PAT attempt cap: fewer than 2 non-INVALIDATED tests already exist for the enrollment", error_id: ERR_PAT_ATTEMPTS_EXHAUSTED, http_status: 409, applies_to: "POST /api/enrollments/{id}/public-access-tests" }
  - { priority: 24, category: business_constraint, check: "Graduation attendance gate: attendance_pct >= 85.0", error_id: ERR_ATTENDANCE_BELOW_THRESHOLD, http_status: 409, applies_to: "POST /api/enrollments/{id}/graduate" }
  - { priority: 25, category: business_temporal, check: "Recertification scheduled_on within [recert_due_at - 30 days, recert_due_at + 30 days] (inclusive)", error_id: ERR_RECERT_WINDOW, http_status: 409, applies_to: "POST /api/partnerships/{id}/recertifications" }
  - { priority: 26, category: business_temporal, check: "Manual FollowUp due_on at least 7 days from every other non-WAIVED follow-up due_on of the same partnership (gap semantics; exactly 7 days allowed)", error_id: ERR_FOLLOWUP_TOO_SOON, http_status: 409, applies_to: "POST /api/partnerships/{id}/follow-ups" }
  - { priority: 27, category: business_temporal, check: "Class temporal gates: start requires logical date >= starts_on; graduation review requires logical date > ends_on", error_id: ERR_ENROLLMENT_WINDOW, http_status: 409, applies_to: "POST /api/classes/{id}/start, POST /api/classes/{id}/begin-graduation-review" }
  - { priority: 28, category: business_temporal, check: "Support reopen within resolved_at + 14 days", error_id: ERR_REOPEN_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /api/support-requests/{id}/reopen" }
  - { priority: 29, category: business_referential, check: "Evaluator qualification: referenced evaluator Trainer has pat_certified == true and status CERTIFIED", error_id: ERR_EVALUATOR_NOT_CERTIFIED, http_status: 409, applies_to: "POST /api/enrollments/{id}/public-access-tests, POST /api/partnerships/{id}/recertifications" }
  - { priority: 30, category: business_referential, check: "Approve requires a FINALIZED_ACCEPTED TaskAssessment", error_id: ERR_ASSESSMENT_REQUIRED, http_status: 409, applies_to: "POST /api/applicants/{id}/approve" }
  - { priority: 31, category: business_referential, check: "Explicit match proposal: dog.certified_tasks covers applicant required_tasks", error_id: ERR_TASK_COVERAGE_INSUFFICIENT, http_status: 422, applies_to: "POST /api/dogs/{id}/match-proposals" }
  - { priority: 32, category: business_referential, check: "Graduation requires a SCORED_PASS PublicAccessTest for the enrollment", error_id: ERR_GRADUATION_REQUIREMENTS, http_status: 409, applies_to: "POST /api/enrollments/{id}/graduate" }
  - { priority: 33, category: business_fiscal, check: "Contribution amount_cents >= 100", error_id: ERR_CONTRIBUTION_BELOW_MINIMUM, http_status: 422, applies_to: "POST /api/applicants/{id}/contributions" }
  - { priority: 34, category: business_constraint, check: "Selector empty pool for match proposals", error_id: ERR_NO_ELIGIBLE_MATCH, http_status: 409, applies_to: "POST /api/dogs/{id}/match-proposals" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Advance the logical clock; server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock; triggers the recert_and_followup_schedule sweep", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string, swept_followups_missed: integer, swept_partnerships_recert_due: integer }, side_effects: ["clock sweep transitions per recert_and_followup_schedule", "waitlist rank_score recompute (wait_days advance)"] }

  # --- Applicant lifecycle ---
  - { method: POST, path: "/api/applicants", description: "Create applicant (intake)", roles: [IntakeCoordinator, ProgramAdmin], code: 201, input: [full_name, email, placement_track, household_income_cents, region], output: Applicant, side_effects: ["application_status := SUBMITTED"] }
  - { method: GET, path: "/api/applicants/{id}", description: "Get applicant", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: Applicant, side_effects: [] }
  - { method: GET, path: "/api/applicants", description: "List applicants with filters + pagination", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector], code: 200, input: ["application_status?", "placement_track?", "limit?", "offset?"], output: "Applicant[]", side_effects: [] }
  - { method: POST, path: "/api/applicants/{id}/begin-review", description: "SUBMITTED -> IN_REVIEW", roles: [IntakeCoordinator], code: 200, input: [], output: Applicant, side_effects: ["reviewed_by_user_id set"] }
  - { method: POST, path: "/api/applicants/{id}/request-info", description: "IN_REVIEW -> NEEDS_INFO", roles: [IntakeCoordinator], code: 200, input: [info_request_note], output: Applicant, side_effects: [] }
  - { method: POST, path: "/api/applicants/{id}/resubmit", description: "NEEDS_INFO -> IN_REVIEW (applicant self-service)", roles: [Applicant], code: 200, input: [], output: Applicant, side_effects: [] }
  - { method: POST, path: "/api/applicants/{id}/approve", description: "IN_REVIEW -> WAITLISTED; creates WaitlistEntry with provisional requirement", roles: [IntakeCoordinator], code: 200, input: [], output: Applicant, side_effects: ["WaitlistEntry created (PENDING)", "fundraising_requirement provisional variant computed", "waitlist_rank_score computed"] }
  - { method: POST, path: "/api/applicants/{id}/deny", description: "IN_REVIEW|NEEDS_INFO -> DENIED", roles: [IntakeCoordinator], code: 200, input: [denial_reason], output: Applicant, side_effects: [] }
  - { method: POST, path: "/api/applicants/{id}/withdraw", description: "non-terminal (except PLACED) -> WITHDRAWN with full compensation cascade", roles: [Applicant, IntakeCoordinator], code: 200, input: [], output: Applicant, side_effects: ["withdraw cascade per Applicant machine"] }
  - { method: GET, path: "/api/applicants/{id}/assessments", description: "Assessments of applicant", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: "TaskAssessment[]", side_effects: [] }
  - { method: GET, path: "/api/applicants/{id}/waitlist-entries", description: "Waitlist entries of applicant (0-1 active)", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: "WaitlistEntry[]", side_effects: [] }
  - { method: GET, path: "/api/applicants/{id}/contributions", description: "Contributions of applicant", roles: [IntakeCoordinator, ProgramAdmin, Applicant], code: 200, input: [], output: "Contribution[]", side_effects: [] }
  - { method: GET, path: "/api/applicants/{id}/partnerships", description: "Partnerships of applicant", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: "Partnership[]", side_effects: [] }

  # --- TaskAssessment ---
  - { method: POST, path: "/api/applicants/{id}/assessments", description: "Create DRAFT task assessment", roles: [IntakeCoordinator], code: 201, input: [required_tasks, task_urgency_tier, home_environment_score, "notes?"], output: TaskAssessment, side_effects: ["status := DRAFT"] }
  - { method: GET, path: "/api/assessments/{id}", description: "Get assessment", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector], code: 200, input: [], output: TaskAssessment, side_effects: [] }
  - { method: POST, path: "/api/assessments/{id}/finalize", description: "DRAFT -> FINALIZED_ACCEPTED | FINALIZED_REJECTED", roles: [IntakeCoordinator], code: 200, input: [outcome], output: TaskAssessment, side_effects: ["finalized_by_user_id set"] }

  # --- WaitlistEntry ---
  - { method: GET, path: "/api/waitlist-entries/{id}", description: "Get waitlist entry (includes rank_score, raised_cents, requirements)", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: GET, path: "/api/waitlist-entries", description: "List waitlist entries with filters + pagination", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector], code: 200, input: ["status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: POST, path: "/api/waitlist-entries/{id}/recalculate", description: "Recompute final requirement from verified income; eligibility re-evaluated", roles: [IntakeCoordinator], code: 200, input: [verified_income_cents], output: WaitlistEntry, side_effects: ["fundraising_requirement final variant -> requirement_final_cents", "PENDING<->ELIGIBLE flip with Applicant mirror transition", "applicant.verified_income_cents set"] }
  - { method: POST, path: "/api/waitlist-entries/{id}/suspend", description: "PENDING|ELIGIBLE -> SUSPENDED", roles: [IntakeCoordinator], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: POST, path: "/api/waitlist-entries/{id}/reinstate", description: "SUSPENDED -> PENDING|ELIGIBLE per raised vs requirement", roles: [IntakeCoordinator], code: 200, input: [], output: WaitlistEntry, side_effects: ["eligibility re-evaluated; applicant mirror when ELIGIBLE"] }
  - { method: GET, path: "/api/waitlist-entries/{id}/matches", description: "Match records of entry", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: "MatchRecord[]", side_effects: [] }

  # --- Contribution ---
  - { method: POST, path: "/api/applicants/{id}/contributions", description: "Record a PLEDGED contribution", roles: [IntakeCoordinator], code: 201, input: [donor_name, amount_cents], output: Contribution, side_effects: ["status := PLEDGED; created_by_user_id := acting operator"] }
  - { method: GET, path: "/api/contributions/{id}", description: "Get contribution", roles: [IntakeCoordinator, ProgramAdmin, Applicant], code: 200, input: [], output: Contribution, side_effects: [] }
  - { method: POST, path: "/api/contributions/{id}/receive", description: "PLEDGED -> RECEIVED (SoD: receiver != creator); eligibility re-eval", roles: [IntakeCoordinator], code: 200, input: [], output: Contribution, side_effects: ["raised_cents += amount_cents", "entry PENDING->ELIGIBLE + applicant mirror when threshold crossed (inclusive)"] }
  - { method: POST, path: "/api/contributions/{id}/refund", description: "RECEIVED -> REFUNDED with clawback", roles: [IntakeCoordinator], code: 200, input: [], output: Contribution, side_effects: ["refund_clawback", "entry ELIGIBLE->PENDING + applicant mirror when threshold uncrossed"] }

  # --- PuppyRaiser ---
  - { method: POST, path: "/api/puppy-raisers", description: "Recruit puppy raiser (APPLIED)", roles: [ProgramAdmin], code: 201, input: [full_name, region, foster_capacity, experience_score], output: PuppyRaiser, side_effects: [] }
  - { method: GET, path: "/api/puppy-raisers/{id}", description: "Get raiser", roles: [ProgramAdmin, TrainingDirector, PuppyRaiser], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: GET, path: "/api/puppy-raisers", description: "List raisers with filters + pagination", roles: [ProgramAdmin, TrainingDirector], code: 200, input: ["status?", "region?", "limit?", "offset?"], output: "PuppyRaiser[]", side_effects: [] }
  - { method: POST, path: "/api/puppy-raisers/{id}/vet", description: "APPLIED -> VETTED", roles: [ProgramAdmin], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: POST, path: "/api/puppy-raisers/{id}/approve", description: "VETTED -> APPROVED", roles: [ProgramAdmin], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: POST, path: "/api/puppy-raisers/{id}/hiatus", description: "APPROVED|ACTIVE (0 dogs) -> ON_HIATUS", roles: [ProgramAdmin, PuppyRaiser], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: POST, path: "/api/puppy-raisers/{id}/resume", description: "ON_HIATUS -> APPROVED", roles: [ProgramAdmin, PuppyRaiser], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: POST, path: "/api/puppy-raisers/{id}/deactivate", description: "non-terminal (0 dogs) -> INACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: PuppyRaiser, side_effects: [] }
  - { method: GET, path: "/api/puppy-raisers/{id}/placements", description: "Raiser placements", roles: [ProgramAdmin, TrainingDirector, PuppyRaiser], code: 200, input: [], output: "RaiserPlacement[]", side_effects: [] }

  # --- Trainer ---
  - { method: POST, path: "/api/trainers", description: "Create trainer (PROBATION)", roles: [ProgramAdmin], code: 201, input: [full_name, "pat_certified?"], output: Trainer, side_effects: [] }
  - { method: GET, path: "/api/trainers/{id}", description: "Get trainer", roles: [ProgramAdmin, TrainingDirector, Trainer, Evaluator], code: 200, input: [], output: Trainer, side_effects: [] }
  - { method: POST, path: "/api/trainers/{id}/certify", description: "PROBATION -> CERTIFIED", roles: [ProgramAdmin], code: 200, input: [], output: Trainer, side_effects: [] }
  - { method: POST, path: "/api/trainers/{id}/suspend", description: "CERTIFIED -> SUSPENDED", roles: [ProgramAdmin], code: 200, input: [], output: Trainer, side_effects: [] }
  - { method: POST, path: "/api/trainers/{id}/reinstate", description: "SUSPENDED -> CERTIFIED", roles: [ProgramAdmin], code: 200, input: [], output: Trainer, side_effects: [] }
  - { method: POST, path: "/api/trainers/{id}/deactivate", description: "non-terminal -> INACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Trainer, side_effects: [] }
  - { method: GET, path: "/api/trainers/{id}/dogs", description: "Dogs whose primary_trainer_id is this trainer", roles: [ProgramAdmin, TrainingDirector, Trainer], code: 200, input: [], output: "Dog[]", side_effects: [] }
  - { method: GET, path: "/api/trainers/{id}/classes", description: "Classes led by trainer", roles: [ProgramAdmin, TrainingDirector, Trainer], code: 200, input: [], output: "TeamTrainingClass[]", side_effects: [] }
  - { method: GET, path: "/api/trainers/{id}/evaluations", description: "PATs administered by trainer (as evaluator)", roles: [ProgramAdmin, TrainingDirector, Trainer, Evaluator], code: 200, input: [], output: "PublicAccessTest[]", side_effects: [] }
  - { method: GET, path: "/api/trainers/{id}/milestones", description: "Milestones recorded by trainer", roles: [ProgramAdmin, TrainingDirector, Trainer], code: 200, input: [], output: "TrainingMilestone[]", side_effects: [] }

  # --- Dog intake / lineage / health ---
  - { method: POST, path: "/api/dogs", description: "Dog intake (breeding or donation)", roles: [ProgramAdmin], code: 201, input: [name, origin, breed, sex, born_on, region, "sire_id?", "dam_id?", "donor_name?"], output: Dog, side_effects: ["status := REGISTERED"] }
  - { method: GET, path: "/api/dogs/{id}", description: "Get dog", roles: [ProgramAdmin, TrainingDirector, Veterinarian, Trainer, IntakeCoordinator, PuppyRaiser], code: 200, input: [], output: Dog, side_effects: [] }
  - { method: GET, path: "/api/dogs", description: "List dogs with filters + pagination", roles: [ProgramAdmin, TrainingDirector, Veterinarian, IntakeCoordinator], code: 200, input: ["status?", "origin?", "region?", "limit?", "offset?"], output: "Dog[]", side_effects: [] }
  - { method: GET, path: "/api/dogs/{id}/offspring", description: "Dogs whose sire_id or dam_id is this dog", roles: [ProgramAdmin, TrainingDirector, Veterinarian], code: 200, input: [], output: "Dog[]", side_effects: [] }
  - { method: POST, path: "/api/dogs/{id}/begin-screening", description: "REGISTERED -> IN_HEALTH_SCREENING", roles: [Veterinarian], code: 200, input: [], output: Dog, side_effects: [] }
  - { method: POST, path: "/api/dogs/{id}/career-change", description: "Career-change decision with full cascade", roles: [TrainingDirector], code: 200, input: [reason_category, "notes?"], output: Dog, side_effects: ["career-change cascade per Dog machine"] }
  - { method: GET, path: "/api/dogs/{id}/screenings", description: "Health screenings of dog", roles: [ProgramAdmin, TrainingDirector, Veterinarian], code: 200, input: [], output: "HealthScreening[]", side_effects: [] }
  - { method: GET, path: "/api/dogs/{id}/milestones", description: "Milestones of dog (chronological)", roles: [ProgramAdmin, TrainingDirector, Trainer, IntakeCoordinator], code: 200, input: [], output: "TrainingMilestone[]", side_effects: [] }
  - { method: GET, path: "/api/dogs/{id}/raiser-placements", description: "Raiser placements of dog", roles: [ProgramAdmin, TrainingDirector], code: 200, input: [], output: "RaiserPlacement[]", side_effects: [] }
  - { method: GET, path: "/api/dogs/{id}/matches", description: "Match records of dog", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator], code: 200, input: [], output: "MatchRecord[]", side_effects: [] }
  - { method: GET, path: "/api/dogs/{id}/partnerships", description: "Partnerships of dog", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator], code: 200, input: [], output: "Partnership[]", side_effects: [] }

  # --- HealthScreening ---
  - { method: POST, path: "/api/dogs/{id}/screenings", description: "Create DRAFT screening (dog must be IN_HEALTH_SCREENING)", roles: [Veterinarian], code: 201, input: [hip_grade, elbow_grade, eye_result, cardiac_result, genetic_panel], output: HealthScreening, side_effects: ["veterinarian_user_id := acting operator"] }
  - { method: GET, path: "/api/screenings/{id}", description: "Get screening", roles: [ProgramAdmin, TrainingDirector, Veterinarian], code: 200, input: [], output: HealthScreening, side_effects: [] }
  - { method: POST, path: "/api/screenings/{id}/submit", description: "DRAFT -> CLEARED|FAILED per health_clearance_score; dog mirrors", roles: [Veterinarian], code: 200, input: [], output: HealthScreening, side_effects: ["clearance_score computed", "Dog IN_HEALTH_SCREENING -> CLEARED or CAREER_CHANGED"] }

  # --- RaiserPlacement ---
  - { method: POST, path: "/api/dogs/{id}/raiser-placements", description: "Place dog with raiser; requires Dog.status in {CLEARED, RECALLED} (ERR_INVALID_STATE) (Dog.status in {CLEARED, RECALLED} is only reachable with a submitted CLEARED screening); selector when puppy_raiser_id omitted", roles: [TrainingDirector], code: 201, input: ["puppy_raiser_id?"], output: RaiserPlacement, side_effects: ["raiser_selector when omitted", "Dog CLEARED|RECALLED -> RAISER_PLACED", "PuppyRaiser.current_dog_count += 1; APPROVED -> ACTIVE on first placement", "started_on := logical date"] }
  - { method: GET, path: "/api/raiser-placements/{id}", description: "Get raiser placement", roles: [ProgramAdmin, TrainingDirector, PuppyRaiser], code: 200, input: [], output: RaiserPlacement, side_effects: [] }
  - { method: POST, path: "/api/raiser-placements/{id}/complete", description: "ACTIVE -> COMPLETED; dog advances to IN_ADVANCED_TRAINING", roles: [TrainingDirector], code: 200, input: [primary_trainer_id], output: RaiserPlacement, side_effects: ["Dog -> IN_ADVANCED_TRAINING; primary_trainer_id set", "raiser count -= 1; ACTIVE -> APPROVED at 0"] }
  - { method: POST, path: "/api/raiser-placements/{id}/early-return", description: "ACTIVE -> EARLY_RETURN; dog RECALLED", roles: [TrainingDirector, PuppyRaiser], code: 200, input: ["reason?"], output: RaiserPlacement, side_effects: ["Dog -> RECALLED", "raiser count -= 1; ACTIVE -> APPROVED at 0"] }

  # --- TrainingMilestone ---
  - { method: POST, path: "/api/dogs/{id}/milestones", description: "Record milestone; requires Dog.status in {IN_ADVANCED_TRAINING, TEAM_TRAINING} (ERR_INVALID_STATE); when actor is Trainer, acting id must equal dog.primary_trainer_id (ERR_OWNERSHIP_SCOPE); when actor is TrainingDirector, recorded_by_trainer_id := dog.primary_trainer_id; advancement gates evaluated", roles: [Trainer, TrainingDirector], code: 201, input: [category, "task_code?", score], output: TrainingMilestone, side_effects: ["rolling_avg_3 + cumulative_gate_score computed", "certified_tasks updated", "Dog IN_ADVANCED_TRAINING -> MATCH_READY when gates met"] }
  - { method: GET, path: "/api/milestones/{id}", description: "Get milestone", roles: [ProgramAdmin, TrainingDirector, Trainer], code: 200, input: [], output: TrainingMilestone, side_effects: [] }

  # --- MatchRecord ---
  - { method: POST, path: "/api/dogs/{id}/match-proposals", description: "Propose match (selector when entry omitted); requires Dog.status == MATCH_READY and, when waitlist_entry_id supplied, entry status == ELIGIBLE (ERR_INVALID_STATE); OCC on Dog.version", roles: [IntakeCoordinator], code: 201, input: ["waitlist_entry_id?", expected_dog_version], output: MatchRecord, side_effects: ["MatchRecord PROPOSED created", "increments Dog.version by 1"] }
  - { method: GET, path: "/api/matches/{id}", description: "Get match", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector], code: 200, input: [], output: MatchRecord, side_effects: [] }
  - { method: POST, path: "/api/matches/{id}/accept", description: "PROPOSED -> ACCEPTED; dog/entry/applicant mirror transitions", roles: [IntakeCoordinator], code: 200, input: [], output: MatchRecord, side_effects: ["Dog MATCH_READY -> MATCHED", "WaitlistEntry ELIGIBLE -> MATCHED", "Applicant MATCH_ELIGIBLE -> MATCHED"] }
  - { method: POST, path: "/api/matches/{id}/reject", description: "PROPOSED -> REJECTED", roles: [IntakeCoordinator], code: 200, input: [], output: MatchRecord, side_effects: [] }
  - { method: POST, path: "/api/matches/{id}/dissolve", description: "ACCEPTED -> DISSOLVED with reverts", roles: [IntakeCoordinator], code: 200, input: [], output: MatchRecord, side_effects: ["Dog MATCHED -> MATCH_READY", "entry MATCHED -> ELIGIBLE (dissolved_match_count += 1, rank recomputed)", "Applicant MATCHED -> MATCH_ELIGIBLE"] }
  - { method: GET, path: "/api/matches/{id}/enrollments", description: "Enrollments of match", roles: [IntakeCoordinator, ProgramAdmin, TrainingDirector], code: 200, input: [], output: "Enrollment[]", side_effects: [] }

  # --- TeamTrainingClass ---
  - { method: POST, path: "/api/classes", description: "Create class PLANNED; half-open trainer-overlap enforced", roles: [TrainingDirector], code: 201, input: [name, lead_trainer_id, starts_on, ends_on, capacity, total_sessions], output: TeamTrainingClass, side_effects: [] }
  - { method: GET, path: "/api/classes/{id}", description: "Get class", roles: [ProgramAdmin, TrainingDirector, Trainer, IntakeCoordinator], code: 200, input: [], output: TeamTrainingClass, side_effects: [] }
  - { method: GET, path: "/api/classes", description: "List classes with filters + pagination", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator], code: 200, input: ["status?", "lead_trainer_id?", "limit?", "offset?"], output: "TeamTrainingClass[]", side_effects: [] }
  - { method: POST, path: "/api/classes/{id}/open-enrollment", description: "PLANNED -> ENROLLING (lead trainer must be CERTIFIED)", roles: [TrainingDirector], code: 200, input: [], output: TeamTrainingClass, side_effects: ["increments TeamTrainingClass.version by 1"] }
  - { method: POST, path: "/api/classes/{id}/start", description: "ENROLLING -> IN_SESSION (min size 2; clock >= starts_on)", roles: [TrainingDirector], code: 200, input: [], output: TeamTrainingClass, side_effects: ["increments TeamTrainingClass.version by 1"] }
  - { method: POST, path: "/api/classes/{id}/begin-graduation-review", description: "IN_SESSION -> GRADUATION_REVIEW (clock > ends_on)", roles: [TrainingDirector], code: 200, input: [], output: TeamTrainingClass, side_effects: ["increments TeamTrainingClass.version by 1"] }
  - { method: POST, path: "/api/classes/{id}/complete", description: "GRADUATION_REVIEW -> COMPLETED (all enrollments terminal)", roles: [TrainingDirector], code: 200, input: [], output: TeamTrainingClass, side_effects: ["increments TeamTrainingClass.version by 1"] }
  - { method: POST, path: "/api/classes/{id}/cancel", description: "PLANNED|ENROLLING|IN_SESSION -> CANCELLED; enrollments withdrawn with match retained", roles: [TrainingDirector], code: 200, input: [], output: TeamTrainingClass, side_effects: ["class-cancel cascade per TeamTrainingClass machine"] }
  - { method: GET, path: "/api/classes/{id}/enrollments", description: "Enrollments of class", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator], code: 200, input: [], output: "Enrollment[]", side_effects: [] }

  # --- Enrollment ---
  - { method: POST, path: "/api/classes/{id}/enrollments", description: "Enroll ACCEPTED match; OCC on class version", roles: [TrainingDirector], code: 201, input: [match_id, expected_class_version], output: Enrollment, side_effects: ["class.enrolled_count += 1", "Dog MATCHED -> TEAM_TRAINING", "Applicant MATCHED -> TEAM_TRAINING", "increments TeamTrainingClass.version by 1"] }
  - { method: GET, path: "/api/enrollments/{id}", description: "Get enrollment", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator, Trainer], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/api/enrollments/{id}/record-attendance", description: "Set absolute sessions_attended (class must be IN_SESSION)", roles: [TrainingDirector, Trainer], code: 200, input: [sessions_attended], output: Enrollment, side_effects: ["attendance_pct recomputed"] }
  - { method: POST, path: "/api/enrollments/{id}/withdraw", description: "ENROLLED -> WITHDRAWN; match dissolved", roles: [TrainingDirector], code: 200, input: [], output: Enrollment, side_effects: ["MatchRecord ACCEPTED -> DISSOLVED cascade", "enrolled_count -= 1"] }
  - { method: POST, path: "/api/enrollments/{id}/graduate", description: "Graduate pair; creates Partnership + auto follow-ups", roles: [TrainingDirector], code: 201, input: [], output: Partnership, side_effects: ["graduation cascade per Enrollment machine"] }
  - { method: GET, path: "/api/enrollments/{id}/public-access-tests", description: "PATs of enrollment", roles: [ProgramAdmin, TrainingDirector, Evaluator, IntakeCoordinator], code: 200, input: [], output: "PublicAccessTest[]", side_effects: [] }
  - { method: GET, path: "/api/enrollments/{id}/partnerships", description: "Partnership created by enrollment (0-1)", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator, Applicant], code: 200, input: [], output: "Partnership[]", side_effects: [] }

  # --- PublicAccessTest ---
  - { method: POST, path: "/api/enrollments/{id}/public-access-tests", description: "Schedule PAT (attempt cap 2; evaluator SoD + buffer)", roles: [Evaluator], code: 201, input: [scheduled_at, "location?"], output: PublicAccessTest, side_effects: ["evaluator_id := acting Evaluator id", "attempt_number computed"] }
  - { method: GET, path: "/api/public-access-tests/{id}", description: "Get PAT", roles: [ProgramAdmin, TrainingDirector, Evaluator], code: 200, input: [], output: PublicAccessTest, side_effects: [] }
  - { method: POST, path: "/api/public-access-tests/{id}/score", description: "Score PAT (12 exercises); computes official score; 2nd fail fails enrollment", roles: [Evaluator], code: 200, input: [exercise_scores], output: PublicAccessTest, side_effects: ["pat_scoring", "on 2nd SCORED_FAIL: Enrollment FAILED cascade"] }
  - { method: POST, path: "/api/public-access-tests/{id}/invalidate", description: "SCHEDULED -> INVALIDATED (frees attempt)", roles: [TrainingDirector], code: 200, input: [reason], output: PublicAccessTest, side_effects: [] }

  # --- Partnership / aftercare ---
  - { method: GET, path: "/api/partnerships/{id}", description: "Get partnership", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator, Applicant], code: 200, input: [], output: Partnership, side_effects: [] }
  - { method: GET, path: "/api/partnerships", description: "List partnerships with filters + pagination", roles: [ProgramAdmin, TrainingDirector, IntakeCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "Partnership[]", side_effects: [] }
  - { method: POST, path: "/api/partnerships/{id}/suspend", description: "ACTIVE|RECERT_DUE -> SUSPENDED", roles: [TrainingDirector], code: 200, input: [reason], output: Partnership, side_effects: ["increments Partnership.version by 1"] }
  - { method: POST, path: "/api/partnerships/{id}/reinstate", description: "SUSPENDED -> ACTIVE (or RECERT_DUE when overdue)", roles: [TrainingDirector], code: 200, input: [], output: Partnership, side_effects: ["recert schedule re-evaluated", "increments Partnership.version by 1"] }
  - { method: POST, path: "/api/partnerships/{id}/retire", description: "ACTIVE|RECERT_DUE|SUSPENDED -> RETIRED; dog retires", roles: [TrainingDirector], code: 200, input: [], output: Partnership, side_effects: ["Dog PLACED -> RETIRED", "SCHEDULED follow-ups -> WAIVED"] }
  - { method: POST, path: "/api/partnerships/{id}/dissolve", description: "ACTIVE|RECERT_DUE|SUSPENDED -> DISSOLVED; dog returns to MATCH_READY", roles: [TrainingDirector], code: 200, input: [reason], output: Partnership, side_effects: ["Dog PLACED -> MATCH_READY", "SCHEDULED follow-ups -> WAIVED"] }
  - { method: GET, path: "/api/partnerships/{id}/follow-ups", description: "Follow-ups of partnership", roles: [ProgramAdmin, TrainingDirector, Applicant], code: 200, input: [], output: "FollowUp[]", side_effects: [] }
  - { method: GET, path: "/api/partnerships/{id}/recertifications", description: "Recertifications of partnership", roles: [ProgramAdmin, TrainingDirector, Applicant, Evaluator], code: 200, input: [], output: "Recertification[]", side_effects: [] }
  - { method: GET, path: "/api/partnerships/{id}/support-requests", description: "Support requests of partnership", roles: [ProgramAdmin, TrainingDirector, Applicant, Trainer], code: 200, input: [], output: "SupportRequest[]", side_effects: [] }

  # --- FollowUp ---
  - { method: POST, path: "/api/partnerships/{id}/follow-ups", description: "Manual follow-up; 7-day min gap vs other due dates", roles: [TrainingDirector], code: 201, input: [due_on], output: FollowUp, side_effects: ["auto_generated := false"] }
  - { method: GET, path: "/api/follow-ups/{id}", description: "Get follow-up", roles: [ProgramAdmin, TrainingDirector], code: 200, input: [], output: FollowUp, side_effects: [] }
  - { method: POST, path: "/api/follow-ups/{id}/complete", description: "SCHEDULED -> COMPLETED", roles: [TrainingDirector], code: 200, input: [outcome, "notes?"], output: FollowUp, side_effects: ["Partnership.followups_completed += 1"] }
  - { method: POST, path: "/api/follow-ups/{id}/waive", description: "SCHEDULED -> WAIVED", roles: [TrainingDirector], code: 200, input: [], output: FollowUp, side_effects: [] }

  # --- Recertification ---
  - { method: POST, path: "/api/partnerships/{id}/recertifications", description: "Schedule recert (window +-30d around due); OCC on partnership version", roles: [TrainingDirector], code: 201, input: [scheduled_on, evaluator_id, expected_partnership_version], output: Recertification, side_effects: ["increments Partnership.version by 1"] }
  - { method: GET, path: "/api/recertifications/{id}", description: "Get recertification", roles: [ProgramAdmin, TrainingDirector, Evaluator], code: 200, input: [], output: Recertification, side_effects: [] }
  - { method: POST, path: "/api/recertifications/{id}/record-result", description: "SCHEDULED|REMEDIATION -> COMPLETED_PASS | REMEDIATION | FAILED_FINAL", roles: [Evaluator], code: 200, input: [outcome], output: Recertification, side_effects: ["PASS: Partnership -> ACTIVE with recert_due_at = completed_on + 365d", "FAIL from REMEDIATION: Partnership -> SUSPENDED"] }

  # --- SupportRequest ---
  - { method: POST, path: "/api/partnerships/{id}/support-requests", description: "Raise support request (client self-service or staff)", roles: [Applicant, TrainingDirector], code: 201, input: [category, description, "severity?"], output: SupportRequest, side_effects: ["raised_by_applicant_id := partnership.applicant_id"] }
  - { method: GET, path: "/api/support-requests", description: "List support requests with filters + pagination", roles: [ProgramAdmin, TrainingDirector, Applicant], code: 200, input: ["status?", "category?", "raised_by_applicant_id?", "limit?", "offset?"], output: "SupportRequest[]", side_effects: [] }
  - { method: GET, path: "/api/support-requests/{id}", description: "Get support request", roles: [ProgramAdmin, TrainingDirector, Trainer, Applicant], code: 200, input: [], output: SupportRequest, side_effects: [] }
  - { method: POST, path: "/api/support-requests/{id}/triage", description: "OPEN -> TRIAGED; sets priority", roles: [TrainingDirector], code: 200, input: [priority], output: SupportRequest, side_effects: [] }
  - { method: POST, path: "/api/support-requests/{id}/start", description: "TRIAGED|REOPENED -> IN_PROGRESS; assigns trainer", roles: [TrainingDirector], code: 200, input: [assigned_trainer_id], output: SupportRequest, side_effects: [] }
  - { method: POST, path: "/api/support-requests/{id}/resolve", description: "IN_PROGRESS -> RESOLVED (assigned trainer or director)", roles: [Trainer, TrainingDirector], code: 200, input: [resolution_note], output: SupportRequest, side_effects: ["resolved_at := logical clock"] }
  - { method: POST, path: "/api/support-requests/{id}/reopen", description: "RESOLVED -> REOPENED within 14 days (client)", roles: [Applicant], code: 200, input: [], output: SupportRequest, side_effects: ["resolved_at := null"] }
  - { method: POST, path: "/api/support-requests/{id}/close", description: "RESOLVED -> CLOSED", roles: [TrainingDirector], code: 200, input: [], output: SupportRequest, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum member, numeric range violated, ends_on <= starts_on, capacity outside 2..6, task_code present on non-TASK_WORK milestone, region mismatch on explicit raiser pick" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_OWNERSHIP_SCOPE, http: 403, condition: "Entity-backed role acting on a record it does not own (applicant/raiser/evaluator/trainer scope)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path parameter does not resolve (left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-supplied reference id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_class_version != TeamTrainingClass.version" }
  - { id: ERR_STALE_DOG_VERSION, http: 412, condition: "expected_dog_version != Dog.version" }
  - { id: ERR_STALE_PARTNERSHIP_VERSION, http: 412, condition: "expected_partnership_version != Partnership.version" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a declared from-state for the transition (includes non-CERTIFIED trainer/evaluator status gates)" }
  - { id: ERR_APPLICANT_NOT_ACTIVE, http: 409, condition: "Fundraising create on applicant in DENIED/WITHDRAWN/PLACED" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "Refund while entry MATCHED or applicant PLACED, or contribution not RECEIVED" }
  - { id: ERR_EVALUATOR_CONFLICT, http: 409, condition: "Evaluator equals the dog's primary_trainer_id (segregation of duties)" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "Contribution receive operator equals created_by_user_id (segregation of duties)" }
  - { id: ERR_DONOR_LINEAGE_INVALID, http: 422, condition: "BRED without valid sire/dam (wrong sex, same dog, missing), or DONATED with sire/dam / without donor_name" }
  - { id: ERR_TRAINER_SCHEDULE_CONFLICT, http: 409, condition: "Lead trainer has another non-CANCELLED class whose half-open [starts_on, ends_on) intersects" }
  - { id: ERR_EVALUATOR_SCHEDULE_CONFLICT, http: 409, condition: "Evaluator has another SCHEDULED/SCORED PAT whose buffered 60-minute window intersects" }
  - { id: ERR_RAISER_CAPACITY, http: 409, condition: "Explicit raiser pick: not APPROVED/ACTIVE or current_dog_count >= foster_capacity" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "Enrollment would exceed class capacity" }
  - { id: ERR_CLASS_TOO_SMALL, http: 409, condition: "Class start with enrolled_count < 2" }
  - { id: ERR_NO_AVAILABLE_RAISER, http: 409, condition: "Raiser selector pool empty" }
  - { id: ERR_NO_ELIGIBLE_MATCH, http: 409, condition: "Match selector pool empty" }
  - { id: ERR_PAT_ATTEMPTS_EXHAUSTED, http: 409, condition: "Third PAT attempt for an enrollment (2 non-INVALIDATED already exist)" }
  - { id: ERR_ATTENDANCE_BELOW_THRESHOLD, http: 409, condition: "Graduation with attendance_pct < 85.0" }
  - { id: ERR_RECERT_WINDOW, http: 409, condition: "Recertification scheduled outside [due-30d, due+30d]" }
  - { id: ERR_FOLLOWUP_TOO_SOON, http: 409, condition: "Manual follow-up due_on within 7 days of another non-WAIVED follow-up" }
  - { id: ERR_ENROLLMENT_WINDOW, http: 409, condition: "Class start before starts_on or graduation review not after ends_on" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "Support reopen after resolved_at + 14 days" }
  - { id: ERR_EVALUATOR_NOT_CERTIFIED, http: 409, condition: "Referenced evaluator lacks pat_certified or CERTIFIED status" }
  - { id: ERR_ASSESSMENT_REQUIRED, http: 409, condition: "Approve without FINALIZED_ACCEPTED assessment" }
  - { id: ERR_TASK_COVERAGE_INSUFFICIENT, http: 422, condition: "Explicit match proposal where dog.certified_tasks misses a required task" }
  - { id: ERR_GRADUATION_REQUIREMENTS, http: 409, condition: "Graduation without a SCORED_PASS PAT" }
  - { id: ERR_CONTRIBUTION_BELOW_MINIMUM, http: 422, condition: "amount_cents < 100" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Organization superuser; owns raiser/trainer administration and dog intake"
    identity: opaque
    exclusive_operations: ["puppy-raiser administer (create/vet/approve/deactivate)", "trainer administer (create/certify/suspend/reinstate/deactivate)", "dog intake create", "logical clock set"]
    shared_operations: ["read access to nearly all resources"]
  - name: IntakeCoordinator
    description: "Applicant intake, assessments, waitlist, fundraising ledger, match proposals"
    identity: opaque
    exclusive_operations: ["applicant create/review/approve/deny", "assessment create/finalize", "waitlist suspend/reinstate/recalculate", "contribution record/receive/refund", "match propose/accept/reject/dissolve"]
    shared_operations: ["applicant withdraw (with Applicant)", "read access"]
  - name: TrainingDirector
    description: "Dog training program: placements, career-change, classes, enrollments, graduation, aftercare"
    identity: opaque
    exclusive_operations: ["raiser placement create/complete/early-return", "career-change", "class administer", "enrollment create/withdraw/graduate/record-attendance", "PAT invalidate", "partnership suspend/reinstate/retire/dissolve", "follow-up create/complete/waive", "recertification schedule", "support triage/start/close"]
    shared_operations: ["milestone create (with Trainer)", "support resolve (with Trainer)", "read access"]
  - name: Veterinarian
    description: "Health screening operator (external vet account)"
    identity: opaque
    exclusive_operations: ["begin-screening", "screening create/submit"]
    shared_operations: ["dog read access"]
  - name: Trainer
    description: "Certified trainer; records milestones for own dogs, resolves assigned support requests"
    identity: "entity_backed:Trainer"
    exclusive_operations: ["milestone create for dogs where primary_trainer_id == self", "resolve support requests assigned to self"]
    shared_operations: ["record-attendance (with TrainingDirector)", "read access"]
  - name: Evaluator
    description: "PAT/recertification evaluator (a Trainer identity with evaluator privileges); may never evaluate a dog whose primary_trainer_id is self"
    identity: "entity_backed:Trainer"
    exclusive_operations: ["PAT schedule/score", "recertification record-result"]
    shared_operations: ["read access"]
  - name: Applicant
    description: "Program applicant / graduated client; acts only on own records across the lifecycle"
    identity: "entity_backed:Applicant"
    exclusive_operations: ["resubmit own application", "reopen own support request"]
    shared_operations: ["withdraw own application (with IntakeCoordinator)", "raise support request on own partnership (with TrainingDirector)", "read own records"]
  - name: PuppyRaiser
    description: "Volunteer puppy raiser; manages own profile and foster placements"
    identity: "entity_backed:PuppyRaiser"
    exclusive_operations: []
    shared_operations: ["hiatus/resume own profile (with ProgramAdmin)", "early-return own placement (with TrainingDirector)", "read own records"]
