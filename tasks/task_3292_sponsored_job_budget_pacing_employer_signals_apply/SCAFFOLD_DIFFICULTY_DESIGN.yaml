          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer owning one ACTIVE posting, one ACTIVE CPC campaign, one ELIGIBLE sponsored job with a 600-cent ACTIVE pacing hold."
          setup_api_calls:
