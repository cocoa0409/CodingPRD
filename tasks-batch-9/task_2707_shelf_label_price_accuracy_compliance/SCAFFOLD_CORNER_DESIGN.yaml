              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-02T09:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${file_a_v}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { task_1: $.data.id, t1_print: $.data.print_status, t1_place: $.data.placement_status }
          assert:
            - "${x1_status} == UNTRAINED — a new associate is never born certified"
            - "${file_status_before} == DRAFT and ${line_status_before} == PENDING"
            - "${audit_status} == OPEN (not SCANNING; SCANNING requires a first scan line)"
            - "${sign_status} == DRAFT and ${sign_state} == NOT_APPLICABLE"
            - "${file_status_dist} == DISTRIBUTED and ${t1_print} == NOT_PRINTED and ${t1_place} == UNPLACED"
            - "Store.${store_a}.compliance_posture == OPEN and label_backlog_count == 1 after the task is created (one UNPLACED task on a non-WITHDRAWN line)"

      - name: corner_distribute_transition_applies_every_declared_side_effect
        claim_type: valid_transition
        grounds:
          - state_machines.PriceChangeFile.DRAFT_to_DISTRIBUTED
          - endpoints.POST_/price-integrity/price-change-files/{id}/distribute
        distinguishing_aspect: "Distribution is the only transition that opens the file for execution: status becomes DISTRIBUTED, distributed_at is stamped from the logical clock, version increments, and the file's lines stay PENDING (distribution alone does not task them)."
        test_recipe:
          setup:
            - "A DRAFT file scoped to one store with two lines, jurisdiction grace_period_hours 48, clock at 2026-08-01T00:00:00Z, effective_date 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id, file_v0: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000002002", item_description: "Milk 1gal", category_code: "DAIRY", old_retail_cents: 499, new_retail_cents: 449, net_content_qty: 128, net_content_uom: "FL_OZ" }
              as: PricingAdmin
              captures: { line_2: $.data.id }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_a}/distribute"
              as: PricingAdmin
              captures: { st: $.data.status, dist_at: $.data.distributed_at, v1: $.data.version, lc: $.data.line_count }
            - call: "GET /price-integrity/price-change-files/${file_a}/lines"
              as: PricingAdmin
              captures: { l0_status: "$.data[0].line_status" }
          assert:
            - "${st} == DISTRIBUTED, ${dist_at} == 2026-08-01T00:00:00Z (the logical clock, set explicitly in setup)"
            - "${v1} == 2 — exactly one version increment for one write, from ${file_v0} == 1"
            - "${lc} == 2 and verified_line_count == 0"
            - "${l0_status} == PENDING — distribution does not task any line; only label-task creation does"
            - "Store.${store_a}.compliance_posture is still OPEN and label_backlog_count is still 0"

      - name: corner_precondition_enforcement_on_distribute_and_line_append
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PriceChangeFile.DRAFT_to_DISTRIBUTED.preconditions
          - errors.ERR_FILE_HAS_NO_LINES
          - errors.ERR_FILE_INVALID_STATE
        distinguishing_aspect: "The DRAFT -> DISTRIBUTED precondition set is checked field by field: an empty file fails with ERR_FILE_HAS_NO_LINES (422) while a file already DISTRIBUTED refuses further lines with ERR_FILE_INVALID_STATE (409) — two different codes for two different preconditions on the same file."
        test_recipe:
          setup:
            - "Two DRAFT files under one jurisdiction: file_empty with no lines, file_ok with one line."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-EMPTY", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_empty: $.data.id }
            - call: "POST /price-integrity/price-change-files"
