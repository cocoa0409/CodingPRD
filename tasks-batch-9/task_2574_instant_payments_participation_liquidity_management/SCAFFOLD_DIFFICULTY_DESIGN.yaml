          - calculations.liquidity_alert_tier
        distinguishing_aspect: |
          A different conserved quantity from the ledger identity, and deliberately conserved
          asymmetrically: a partial honor of 100,000,000 against a 250,000,000 transfer credits only
          the returned amount to the position (final balance 1,050,000,000, so the tier lands AMBER
          and the posture THROTTLED rather than GREEN/NORMAL), yet the customer's
          daily_sent_amount_cents returns all the way to 0 because the honored row leaves the
          daily-sent input set entirely. Conserving the velocity counter pro-rata, or clearing the
          RED alert because "money came back", both diverge.
