scaffold_corner_design:

  # =======================================================================
  # Entities
  # =======================================================================
  - section: entities
    instances:
      - name: corner_account_create_returns_pending_verification_and_system_fields
        claim_type: creation
        grounds: [entities.Account.fields.status, entities.Account.fields.verification_token, entities.Account.fields.referral_code]
        distinguishing_aspect: "POST /accounts returns 201 with status PENDING_VERIFICATION, version 1, and server-minted verification_token, referral_code and loyalty_account_id."
        test_recipe:
          setup: ["Empty database with the logical clock at its default 2026-05-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /accounts"
              payload: { email: "new1@example.com", full_name: "New One" }
              as: Anonymous
              captures: { a_id: $.data.id, a_status: $.data.status, a_ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${a_status} == PENDING_VERIFICATION"
            - "${a_ver} == 1"
            - "Account.${a_id}.verification_token is a non-empty string"
            - "Account.${a_id}.referral_code is a non-empty string"
            - "Account.${a_id}.loyalty_account_id is a non-empty string"

      - name: corner_account_defaults_payment_method_false_and_referred_by_null
        claim_type: defaults
        grounds: [entities.Account.fields.payment_method_on_file, entities.Account.fields.referred_by_code]
        distinguishing_aspect: "Omitting payment_method_on_file and referred_by_code yields false and null respectively, not an error."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /accounts"
              payload: { email: "defaults@example.com", full_name: "Default Household" }
              as: Anonymous
              captures: { a_id: $.data.id }
          assert:
            - "Account.${a_id}.payment_method_on_file == false"
            - "Account.${a_id}.referred_by_code == null"
            - "Account.${a_id}.available_credit_cents == 0"
            - "Account.${a_id}.next_charge_estimate_cents == 0"

      - name: corner_child_stage_is_computed_and_supplied_stage_input_ignored
        claim_type: computed_fields
        grounds: [entities.Child.fields.stage, calculations.stage_from_weight]
        distinguishing_aspect: "Child.stage is derived from weight_grams by stage_from_weight; POST /children declares no stage input, so a 7000 g child is S2 regardless of anything the client sends."
        test_recipe:
          setup: ["One verified ACTIVE account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "comp@example.com", full_name: "Computed Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id, st: $.data.stage }
          assert:
            - "${st} == S2"
            - "Child.${child_id}.stage_pinned == false"
            - "Child.${child_id}.hypoallergenic_required == false"
            - "Child.${child_id}.archived == false"

      - name: corner_sku_defaults_pack_size_units_and_stock_and_status
        claim_type: defaults
        grounds: [entities.Sku.fields.pack_size_units, entities.Sku.fields.stock_packs, entities.Sku.fields.status, entities.Sku.fields.allergen_tags]
        distinguishing_aspect: "A SKU created without pack_size_units, stock_packs or allergen_tags defaults to 60 units, 0 packs, an empty tag array and status ACTIVE."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /skus"
              payload: { code: "S3-DEF", name: "Stage 3 Default", stage: "S3", line: "STANDARD", pack_price_cents: 1500 }
              as: OpsAdmin
              captures: { sku_id: $.data.id }
          assert:
            - "Sku.${sku_id}.pack_size_units == 60"
            - "Sku.${sku_id}.stock_packs == 0"
            - "Sku.${sku_id}.status == ACTIVE"
            - "Sku.${sku_id}.allergen_tags == []"

      - name: corner_plan_defaults_promo_zero_and_allows_hypoallergenic_true
        claim_type: defaults
        grounds: [entities.Plan.fields.promo_discount_pct, entities.Plan.fields.allows_hypoallergenic, entities.Plan.fields.status]
        distinguishing_aspect: "A plan created without promo_discount_pct or allows_hypoallergenic defaults to 0 and true, with status ACTIVE."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /plans"
              payload: { code: "BARE", name: "Bare Plan", default_pack_count: 2 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "Plan.${plan_id}.promo_discount_pct == 0"
            - "Plan.${plan_id}.allows_hypoallergenic == true"
            - "Plan.${plan_id}.status == ACTIVE"

      - name: corner_allergen_flag_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds: [entities.AllergenFlag.fields.child_id, entities.AllergenFlag.fields.severity]
        distinguishing_aspect: "AllergenFlag is declared common_fields: false, so its response exposes id and created_at but no version and no updated_at, and §1.5 offers no update endpoint for it."
        test_recipe:
          setup: ["One verified account with one S2 child."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "imm@example.com", full_name: "Immutable Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /children/${child_id}/allergen-flags"
              payload: { allergen_tag: "LATEX", severity: "MILD" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { flag_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "AllergenFlag.${flag_id} response contains id and created_at"
            - "AllergenFlag.${flag_id} response contains no version field and no updated_at field"
            - "AllergenFlag.${flag_id}.note == null"

      - name: corner_subscription_starts_draft_and_billing_current
        claim_type: initial_state
        grounds: [entities.Subscription.fields.lifecycle_state, entities.Subscription.fields.billing_state, calculations.cadence_interval_days]
        distinguishing_aspect: "A newly created subscription is DRAFT on the lifecycle axis and CURRENT on the billing axis at the same time, with cadence_interval_days already derived as 20."
        test_recipe:
          setup: ["One verified account, one plan, one S2 child."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "draft@example.com", full_name: "Draft Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, life: $.data.lifecycle_state, bill: $.data.billing_state }
          assert:
            - "${life} == DRAFT"
            - "${bill} == CURRENT"
            - "Subscription.${sub_id}.cadence_interval_days == 20"
            - "Subscription.${sub_id}.cadence_override_days == null"
            - "Subscription.${sub_id}.free_shipping_eligible == false"

      - name: corner_subscription_pack_count_defaults_from_plan
        claim_type: defaults
        grounds: [entities.Plan.fields.default_pack_count, entities.Subscription.fields.pack_count]
        distinguishing_aspect: "Omitting pack_count copies Plan.default_pack_count (4) onto the subscription, which then drives cadence 4 * 60 / 6 = 40 days."
        test_recipe:
          setup: ["A plan whose default_pack_count is 4, one verified account and one S2 child."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE4", name: "Core Four", default_pack_count: 4, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "packdef@example.com", full_name: "Pack Default" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, pc: $.data.pack_count }
          assert:
            - "${pc} == 4"
            - "Subscription.${sub_id}.cadence_interval_days == 40"

      - name: corner_registry_item_fulfilled_quantity_starts_zero
        claim_type: computed_fields
        grounds: [entities.RegistryItem.fields.fulfilled_quantity, entities.RegistryItem.fields.status, entities.Registry.fields.completion_pct]
        distinguishing_aspect: "A newly added registry item has fulfilled_quantity 0 and status REQUESTED, and the registry's completion_pct is exactly 0."
        test_recipe:
          setup: ["One verified account owning a DRAFT registry for its S2 child, plus one ACTIVE SKU."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "regitem@example.com", full_name: "Registry Item Household" }
              as: Anonymous
              captures: { o_id: $.data.id, o_tok: $.data.verification_token }
            - call: "POST /accounts/${o_id}/verify"
              payload: { verification_token: "${o_tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${o_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { child_id: $.data.id }
            - call: "POST /registries"
              payload: { owner_account_id: "${o_id}", child_id: "${child_id}", title: "Fresh Registry" }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registries/${reg_id}/items"
              payload: { sku_id: "${sku_std}", requested_quantity: 4 }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { item_id: $.data.id, fq: $.data.fulfilled_quantity }
          assert:
            - "${fq} == 0"
            - "RegistryItem.${item_id}.status == REQUESTED"
            - "Registry.${reg_id}.completion_pct == 0"
            - "Registry.${reg_id}.status == DRAFT"

      - name: corner_goodwill_credit_remaining_equals_issued_at_creation
        claim_type: computed_fields
        grounds: [entities.Credit.fields.remaining_cents, entities.Credit.fields.refundable, entities.Credit.fields.credit_type, calculations.account_available_credit_cents]
        distinguishing_aspect: "A SupportAgent-issued credit defaults to credit_type GOODWILL with refundable true, remaining_cents equal to issued_cents and consumed_cents 0, and it raises Account.available_credit_cents by the same amount."
        test_recipe:
          setup: ["One verified ACTIVE account with no credits."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "goodwill@example.com", full_name: "Goodwill Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /credits"
              payload: { account_id: "${acct_id}", issued_cents: 2500 }
              as: SupportAgent
              as_user_id: "cs-1"
              captures: { credit_id: $.data.id, ctype: $.data.credit_type }
          assert:
            - "${ctype} == GOODWILL"
            - "Credit.${credit_id}.remaining_cents == 2500"
            - "Credit.${credit_id}.consumed_cents == 0"
            - "Credit.${credit_id}.forfeited_cents == 0"
            - "Credit.${credit_id}.refundable == true"
            - "Credit.${credit_id}.status == AVAILABLE"
            - "Account.${acct_id}.available_credit_cents == 2500"

      - name: corner_loyalty_account_auto_created_with_account
        claim_type: parent_relationships
        grounds: [entities.LoyaltyAccount.fields.account_id, entities.LoyaltyAccount.fields.tier, entities.Account.fields.loyalty_account_id]
        distinguishing_aspect: "Creating an Account synthesises exactly one LoyaltyAccount in tier BRONZE with points_balance 0, discoverable only through GET /loyalty-accounts?account_id=."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "wallet@example.com", full_name: "Wallet Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, loy_id: $.data.loyalty_account_id }
          trigger:
            - call: "GET /loyalty-accounts"
              payload: { account_id: "${acct_id}" }
              as: OpsAdmin
              captures: { found_id: "$.data[0].id", found_tier: "$.data[0].tier" }
          assert:
            - "${found_id} == ${loy_id}"
            - "${found_tier} == BRONZE"
            - "LoyaltyAccount.${loy_id}.points_balance == 0"
            - "LoyaltyAccount.${loy_id}.trailing_earned_points == 0"
            - "LoyaltyAccount.${loy_id}.tier_evaluated_at == null"
            - "exactly 1 LoyaltyAccount row exists with account_id == ${acct_id}"

      - name: corner_child_creation_with_unknown_account_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=7]", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key that does not resolve is rejected at priority 7 with ERR_ACCOUNT_NOT_FOUND, before any shape or ownership rung runs."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z with no accounts."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /children"
              payload: { account_id: "11111111-1111-4111-8111-111111111111", name: "Ghost", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_FOUND"
            - "HTTP status is 404"

      - name: corner_sku_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds: [endpoints.GET./skus, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /skus with limit 2 and offset 0 over three SKUs returns 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup: ["Three ACTIVE SKUs exist at stages S1, S2 and S3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /skus"
              payload: { code: "S1-P", name: "S1 Pack", stage: "S1", line: "STANDARD", pack_price_cents: 1000, pack_size_units: 60, allergen_tags: [], stock_packs: 5 }
              as: OpsAdmin
            - call: "POST /skus"
              payload: { code: "S2-P", name: "S2 Pack", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 5 }
              as: OpsAdmin
            - call: "POST /skus"
              payload: { code: "S3-P", name: "S3 Pack", stage: "S3", line: "STANDARD", pack_price_cents: 1400, pack_size_units: 60, allergen_tags: [], stock_packs: 5 }
              as: OpsAdmin
          trigger:
            - call: "GET /skus"
              payload: { limit: 2, offset: 0 }
              as: OpsAdmin
          assert:
            - "the response contains exactly 2 Sku rows"
            - "meta/pagination total_count == 3"
            - "has_more == true"
            - "response_type == array"

      - name: corner_cycle_retrieval_returns_every_declared_money_field
        claim_type: retrieval
        grounds: [entities.Cycle.fields.subtotal_cents, entities.Cycle.fields.total_due_cents, entities.Cycle.fields.payment_status]
        distinguishing_aspect: "GET /cycles/{id} on an allocated cycle returns subtotal_cents 2400, shipping_cents 599, total_due_cents 2999 and every zeroed credit bucket."
        test_recipe:
          setup: ["One ACTIVE subscription whose first cycle has been allocated onto a 1200-cent SKU at pack_count 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "read@example.com", full_name: "Read Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "GET /cycles/${c1}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_total: $.data.subtotal_cents, due: $.data.total_due_cents }
          assert:
            - "${sub_total} == 2400"
            - "${due} == 2999"
            - "Cycle.${c1}.shipping_cents == 599"
            - "Cycle.${c1}.gift_credit_applied_cents == 0"
            - "Cycle.${c1}.referral_credit_applied_cents == 0"
            - "Cycle.${c1}.loyalty_redemption_applied_cents == 0"
            - "Cycle.${c1}.promo_discount_cents == 0"
            - "Cycle.${c1}.stage_at_allocation == S2"
            - "Cycle.${c1}.sequence_number == 1"

      - name: corner_cycle_window_and_cutoff_are_system_computed
        claim_type: system_fields
        grounds: [calculations.cycle_window, calculations.cutoff_instant, entities.Cycle.fields.cutoff_at]
        distinguishing_aspect: "Generating the first cycle after a 2026-06-01T00:00:00Z activation yields window_start 2026-06-08T00:00:00.000Z, window_end 2026-06-28T00:00:00.000Z and cutoff_at 2026-06-06T00:00:00.000Z, none of which the client supplies."
        test_recipe:
          setup: ["One ACTIVE subscription activated at 2026-06-01T00:00:00Z with cadence_interval_days 20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
