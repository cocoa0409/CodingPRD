# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — task_0325
# Walks references/claim-extraction-guide.md against §1.1-§1.7. Shared fixture
# values match SCAFFOLD_DIFFICULTY_DESIGN.yaml (Product P1 price 4000 / coverage 350,
# S1 120/1/LIGHT -> material 4000, labor 4913).
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /painting/projects with required fields -> 201; workflow_status=DRAFT, payment_status=UNPAID, deposit_pct defaults 30, warranty_months defaults 12, version=1, all totals 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id, dp: $.data.deposit_pct, wm: $.data.warranty_months }
          assert:
            - "HTTP 201"
            - "Project.${proj}.workflow_status == DRAFT"
            - "Project.${proj}.payment_status == UNPAID"
            - "Project.${proj}.deposit_pct == 30"
            - "Project.${proj}.warranty_months == 12"
            - "Project.${proj}.version == 1"
            - "Project.${proj}.estimate_total_cents == 0"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]", entities.Project]
        distinguishing_aspect: "GET /painting/projects/{id} with a well-formed but non-existent UUID -> ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /painting/projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: list_projects_paginated_envelope
        claim_type: Listing
        grounds: [entities.Project, response_envelope]
        distinguishing_aspect: "GET /painting/projects returns response_type=array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
          trigger:
            - call: "GET /painting/projects"
              payload: {}
              as: Estimator
          assert:
            - "HTTP 200 and response_type == array"
            - "meta contains api_request_id and api_request_timestamp; data carries total_count and has_more"

      - name: list_projects_filter_by_customer_id
        claim_type: Listing
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /painting/projects?customer_id=cust-2 returns only projects whose customer_id == cust-2."
        test_recipe:
          setup: ["projects for cust-1 and cust-2 exist"]
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-2", site_address: "2 Elm St", scope: "EXTERIOR" }
              as: Estimator
              captures: { proj2: $.data.id }
          trigger:
            - call: "GET /painting/projects?customer_id=cust-2"
              payload: {}
              as: Estimator
          assert:
            - "Every returned project has customer_id == cust-2; project ${proj2} present"

      - name: create_project_missing_scope_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /painting/projects omitting required scope -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: surface_coats_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", entities.Surface.fields.coats, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST surface with coats=5 (range is 1..4) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["project exists, product exists"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bad", surface_kind: "INTERIOR", area_sqft: 120, coats: 5, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: surface_system_fields_are_server_minted
        claim_type: System Fields
        grounds: [entities.Surface.fields.status, entities.Surface.fields.project_id]
        distinguishing_aspect: "POST surface: status is forced to PLANNED regardless of any client-supplied status, and id/created_at/version are server-minted (version starts at 1)."
        test_recipe:
          setup: ["project and product exist"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id, st: $.data.status, pid: $.data.project_id }
          assert:
            - "Surface.${s1}.status == PLANNED"
            - "Surface.${s1}.project_id == ${proj}"
            - "Surface.${s1}.version == 1"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — it exposes id and created_at but no version field and no update endpoint (append-only ledger)."
        test_recipe:
          setup: ["a captured DEPOSIT payment exists on an ESTIMATED project"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
              captures: { pay: $.data.id }
          trigger:
            - call: "GET /painting/payments/${pay}"
              payload: {}
              as: Estimator
              captures: { st: $.data.status }
          assert:
            - "Payment.${pay}.status == CAPTURED and the response carries id + created_at but no version"

  # =========================================================================
  - section: state_machines
    instances:
      - name: finalize_estimate_from_estimated_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.Project.DRAFT_to_ESTIMATED, "errors[ERR_PROJECT_NOT_DRAFT]"]
        distinguishing_aspect: "Calling finalize-estimate twice: the second call from ESTIMATED -> ERR_PROJECT_NOT_DRAFT (409); no totals change."
        test_recipe:
          setup: ["ESTIMATED project (S1)"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_PROJECT_NOT_DRAFT"

      - name: finalize_estimate_with_no_surfaces_returns_no_surfaces
        claim_type: Precondition Enforcement
        grounds: [state_machines.Project.DRAFT_to_ESTIMATED, "errors[ERR_NO_SURFACES]"]
        distinguishing_aspect: "finalize-estimate on a DRAFT project that has zero PLANNED surfaces -> ERR_NO_SURFACES (409)."
        test_recipe:
          setup: ["DRAFT project, no surfaces"]
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_NO_SURFACES"

      - name: schedule_without_deposit_returns_deposit_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Project.ESTIMATED_to_SCHEDULED, "errors[ERR_DEPOSIT_NOT_PAID]"]
        distinguishing_aspect: "schedule on an ESTIMATED, UNPAID project (even with colors approved and crew scheduled) -> ERR_DEPOSIT_NOT_PAID (409)."
        test_recipe:
          setup: ["ESTIMATED project, payment_status UNPAID, color approved, crew scheduled"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
          trigger:
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_DEPOSIT_NOT_PAID"

      - name: schedule_without_approved_color_returns_color_not_approved
        claim_type: Precondition Enforcement
        grounds: [state_machines.Project.ESTIMATED_to_SCHEDULED, "errors[ERR_COLOR_NOT_APPROVED]"]
        distinguishing_aspect: "schedule on a deposit-paid project whose PLANNED surface still lacks an APPROVED ColorSelection -> ERR_COLOR_NOT_APPROVED (409)."
        test_recipe:
          setup: ["ESTIMATED project, deposit paid, crew scheduled, color NOT approved"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
          trigger:
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_COLOR_NOT_APPROVED"

      - name: request_walkthrough_with_active_crew_returns_crew_not_done
        claim_type: Precondition Enforcement
        grounds: [state_machines.Project.IN_PROGRESS_to_WALKTHROUGH_PENDING, "errors[ERR_CREW_NOT_DONE]"]
        distinguishing_aspect: "request-walkthrough on an IN_PROGRESS project with an IN_PROGRESS crew assignment -> ERR_CREW_NOT_DONE (409)."
        test_recipe:
          setup: ["IN_PROGRESS project with crew assignment IN_PROGRESS (begun, not completed)"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/projects/${proj}/start-work"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/crew-assignments/${ca1}/begin"
              payload: {}
              as: CrewMember
          trigger:
            - call: "POST /painting/projects/${proj}/request-walkthrough"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_CREW_NOT_DONE"

      - name: walkthrough_pass_with_open_punch_list_returns_punch_list_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.Walkthrough.PENDING_to_PASSED, "errors[ERR_PUNCH_LIST_OPEN]"]
        distinguishing_aspect: "pass on a PENDING walkthrough whose punch_list_count > 0 (set via reopen) -> ERR_PUNCH_LIST_OPEN (409)."
        test_recipe:
          setup: ["WALKTHROUGH_PENDING project; latest walkthrough FAILED then reopened with punch_list_count=2"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/projects/${proj}/start-work"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/crew-assignments/${ca1}/begin"
              payload: {}
              as: CrewMember
            - call: "POST /painting/crew-assignments/${ca1}/complete"
              payload: {}
              as: CrewMember
            - call: "POST /painting/projects/${proj}/request-walkthrough"
              payload: {}
              as: ProjectManager
            - call: "GET /painting/walkthroughs?project_id=${proj}"
              payload: {}
              as: ProjectManager
              captures: { wt: "$.data[0].id" }
            - call: "POST /painting/walkthroughs/${wt}/fail"
              payload: {}
              as: Customer
            - call: "POST /painting/walkthroughs/${wt}/reopen"
              payload: { punch_list_count: 2 }
              as: ProjectManager
          trigger:
            - call: "POST /painting/walkthroughs/${wt}/pass"
              payload: {}
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_PUNCH_LIST_OPEN"

      - name: walkthrough_failed_then_pending_reopen_cycle
        claim_type: cyclic
        grounds: [state_machines.Walkthrough.PENDING_to_FAILED, state_machines.Walkthrough.FAILED_to_PENDING]
        distinguishing_aspect: "Walkthrough revert loop: fail moves PENDING->FAILED, reopen moves FAILED->PENDING with punch_list_count reset to 0."
        test_recipe:
          setup: ["WALKTHROUGH_PENDING project with a PENDING walkthrough"]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "POST /painting/payments"
