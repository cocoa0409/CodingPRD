            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000, is_network_connected: false }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2001", acquisition_date: "2019-03-01", acquisition_cost_cents: 1400000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { devb_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2002", acquisition_date: "2023-01-10", acquisition_cost_cents: 1450000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 2, is_loaner_pool: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { devpool_id: $.data.id }
            - call: "POST /clinical-engineering/devices/${devpool_id}/security-state"
              payload: { to_state: "VULNERABLE" }
              as: SecurityOfficer
              as_user_id: "sec-01"
            - call: "POST /clinical-engineering/devices/${devpool_id}/security-state"
              payload: { to_state: "QUARANTINED", note: "Telnet service exposed" }
              as: SecurityOfficer
              as_user_id: "sec-01"
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${devb_id}", reported_severity: "ROUTINE", problem_summary: "SpO2 module dropout" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_v: $.data.version }
          trigger:
            - call: "POST /clinical-engineering/loaner-assignments"
              payload: { work_order_id: "${wo_id}", source: "POOL", loaner_device_id: "${devpool_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-08T00:00:00Z", expected_work_order_version: "${wo_v}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_DEVICE_QUARANTINED"
            - "Device.${devpool_id}.security_state == QUARANTINED and Device.${devpool_id}.operational_state == DOWN"
            - "WorkOrder.${wo_id}.loaner_status == NONE"
            - "GET /clinical-engineering/loaner-assignments?work_order_id=${wo_id} returns exactly 0 elements"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: loaner_half_open_interval_adjacency_versus_overlap
        grounds:
          - validations[priority=18]
          - errors[ERR_LOANER_INTERVAL_CONFLICT]
          - entities.LoanerAssignment.fields.start_at
          - entities.LoanerAssignment.fields.returned_at
          - state_machines.LoanerAssignment.DEPLOYED_to_RETURNED
        distinguishing_aspect: |
          Interval semantics #1 on the DEVICE resource — HALF-OPEN [start_at,
          coalesce(returned_at, end_at)). A new assignment starting at exactly the instant a
          prior one was returned is ACCEPTED (touching endpoints do not overlap), while one
          starting strictly inside a prior occupancy is rejected with
          ERR_LOANER_INTERVAL_CONFLICT.
        test_recipe:
          setup:
            - "One downed monitor with a work order at IN_REPAIR and one same-model pool unit."
            - "A first assignment occupying [2026-08-01T08:00:00Z, 2026-08-05T08:00:00Z), already RETURNED at exactly 2026-08-05T08:00:00Z, so the pool unit is IN_SERVICE again."
          setup_api_calls:
