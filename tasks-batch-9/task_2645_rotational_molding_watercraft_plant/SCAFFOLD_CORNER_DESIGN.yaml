              payload: { actual_cooling_end_at: "2026-08-01T14:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?product_model_id=${pm}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "the first demould creates exactly 2 FinishedUnit rows with hull_serial PO-CVK-01-0001 and PO-CVK-02-0002: build_seq = 1 + 0 already-created units, so cavity 1 gets zero_pad(1 + 1 - 1, 4) = 0001 and cavity 2 gets zero_pad(1 + 2 - 1, 4) = 0002 — the cavity_index appears TWICE in the serial, once padded to 2 and once folded into the sequence"
            - "GET /finished-units?molding_cycle_id=${cyc2} returns an empty list — the ABORTED cycle created no FinishedUnit, so it consumed no sequence number"
            - "the third cycle's demould creates hull_serial PO-CVK-01-0003 and PO-CVK-02-0004, NOT -0005/-0006: build_seq = 1 + 2 because only two units exist for the order; an implementation that counted CYCLES (3 attempted) or that advanced a counter on abort would emit 0005/0006"
            - "GET /finished-units?product_model_id=${pm} returns exactly 4 rows — PM-CVK is built by no other order and the multiset of hull_serial values is {PO-CVK-01-0001, PO-CVK-02-0002, PO-CVK-01-0003, PO-CVK-02-0004} with no duplicate and no gap"
            - "within each demould the two rows are created in ascending cavity_index order, so ordering the four rows by created_at ASC yields the serial sequence 0001, 0002, 0003, 0004 — created_at ordering of siblings matches cavity order, which is what makes hull_serial a usable total tie-break in storage_footprint and shipment_cube_rollup"
            - "every serial is derived only from order_code, cavity_index and the unit count; no server id or timestamp appears in it, so the four values are reproducible by replaying the same three cycles"

      # -----------------------------------------------------------------------
      # C17 — warranty_payout PRO_RATA_AGE: 2-dp coverage, the fee tier chosen
      # from the GROSS, and a fee that rounds HALF_UP off a .5 cent.
      # -----------------------------------------------------------------------
      - name: calc_precision_warranty_pro_rata_coverage_and_top_fee_rate
        claim_type: Precision
        grounds:
          - calculations.warranty_payout
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/approve
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/start-review
          - entities.ProductModel.warranty_reserve_cents
        distinguishing_aspect: "Three approvals on one PRO_RATA_AGE model with msrp_cents 400020 must read net 335671, 190009 and 55203 — the 7-month coverage is round(53/60*100, 2) == 88.33 to two places, the 30-month gross 200010 clears the 200000 fee ceiling by ten cents so it pays 5.00 pct not 8.00, and that fee is round_half_up(10000.50) == 10001."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVW (warranty_basis PRO_RATA_AGE, msrp_cents 400020, initial_warranty_reserve_cents 1000000, gross_cube_m3 1.0000, nest_factor 0.5000, unit_weight_kg 40.000), 2-cavity mould MLD-CVW-1, oven OV-CVW, bay CB-CVW, site WH-CVA, four technicians and Customer CUS-CVW."
            - "ProductionOrder PO-CVW has produced two SELLABLE hulls; both are STORED, loaded on trailer SHP-CVW (Z2, capacity 2.4000 m3), sealed, departed and DELIVERED at 2026-08-01T12:00:00Z, so both carry delivered_at 2026-08-01T12:00:00Z and logistics_status DELIVERED."
            - "CUS-CVW acknowledged the storage guidance at exactly 2026-08-01T12:00:00Z — equal to delivered_at, which the storage review accepts — and PM-CVW still shows warranty_reserve_cents 1000000 with warranty_paid_cents 0."
