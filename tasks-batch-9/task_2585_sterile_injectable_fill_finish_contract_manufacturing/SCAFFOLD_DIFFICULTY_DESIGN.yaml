  - rule_id: non_linear_state_machine
    instances:

      - name: deviation_capa_rejection_cycle_escalates_risk_on_reentry
        grounds:
          - state_machines.Deviation.status.OPEN_to_UNDER_INVESTIGATION
          - state_machines.Deviation.status.UNDER_INVESTIGATION_to_CAPA_PENDING
          - state_machines.Deviation.status.CAPA_PENDING_to_UNDER_INVESTIGATION
          - calculations.deviation_risk_score
          - entities.Deviation.fields.capa_rejection_count
          - entities.ClientProject.fields.open_deviation_risk_total
          - validations[priority=70]
        distinguishing_aspect: |
          The Deviation machine re-enters UNDER_INVESTIGATION through the backward edge
          CAPA_PENDING -> UNDER_INVESTIGATION, and the state it returns to is NOT the state it
          left: capa_rejection_count has incremented to 1, so risk_score moves 35 -> 45 and the
          project risk ledger follows. The machine is therefore path-dependent, not memoryless —
          the same status label carries a different derived payload on the second visit.
