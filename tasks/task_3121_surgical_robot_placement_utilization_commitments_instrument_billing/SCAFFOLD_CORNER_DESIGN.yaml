              as: RegionalSalesDirector
              captures: { agr_c_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_c}/accept"
              payload: { expected_agreement_version: "${agr_c_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys_c: $.data.synthesized_system_id, sys_c_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys_c}/install"
              payload: { expected_robot_system_version: "${sys_c_v}" }
              as: ClinicalOperationsLead
              captures: { sys_c_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_c}/commission"
              payload: { expected_robot_system_version: "${sys_c_v}" }
              as: ClinicalOperationsLead
              captures: { sys_c_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_c}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-05T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { k1: $.data.id, k1_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_c}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-06T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { k2: $.data.id, k2_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_c}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-07T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { k3: $.data.id, k3_v: $.data.version }
          trigger:
            - call: "POST /api/procedure-cases/${k3}/cancel"
              payload: { expected_case_version: "${k3_v}" }
              as: HospitalProcurementOfficer
              as_user_id: "hpo-1"
          assert:
            - "PlacementAgreement.${agr_c}.committed_cases == 2 after the cancellation, one below the commitment of 3"
            - "RobotSystem.${sys_c}.instrument_lives_remaining rises by 1 because the cancelled load is released"
            - "a month-close run with as_of_utc 2026-10-01T00:00:00Z then reports shortfall_procedures == 1 and last_shortfall_fee_cents == 0, because a shortfall of 1 is inside the inclusive 2-procedure grace"

      - name: bulk_complete_is_best_effort_and_reports_skipped_cases
        claim_type: Conditional validation
        grounds:
          - endpoints.POST_/api/procedure-cases/bulk-complete
          - errors.ERR_BULK_SCOPE_VIOLATION
          - validations[priority=27]
        distinguishing_aspect: "Bulk completion is best-effort rather than transactional: eligible cases complete and ineligible ones are reported in skipped_case_ids rather than rolling the whole batch back, so a partially-successful batch returns 200."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A commissioned system with two SCHEDULED cases and one already CANCELLED case."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { b1: $.data.id }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-11T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { b2: $.data.id }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-12T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { b3: $.data.id, b3_v: $.data.version }
            - call: "POST /api/procedure-cases/${b3}/cancel"
              payload: { expected_case_version: "${b3_v}" }
              as: HospitalProcurementOfficer
              as_user_id: "hpo-1"
          trigger:
            - call: "POST /api/procedure-cases/bulk-complete"
              payload: { case_ids: ["${b1}", "${b2}", "${b3}"] }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { done: $.data.completed_count, skipped: $.data.skipped_case_ids }
          assert:
            - "the response status is 200 and completed_count == 2"
            - "skipped_case_ids contains ${b3} and has length 1, so the batch is best-effort rather than all-or-nothing"
            - "ProcedureCase.${b1}.case_status == COMPLETED and ProcedureCase.${b2}.case_status == COMPLETED"
            - "ProcedureCase.${b3}.case_status is still CANCELLED"

      - name: stale_account_version_on_accept_returns_stale_version
        claim_type: Priority Ordering
        grounds:
          - concurrency_rules[agreement-accept-stale-account]
          - validations[priority=40]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC is checked on the parent account's version: a first accept bumps HospitalAccount.version, so a second accept still carrying the version read one call earlier is rejected 412 with ERR_STALE_VERSION rather than any business error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a submitted agreement, with the account's version captured before acceptance."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
          trigger:
            - call: "POST /api/placement-agreements/${agr}/accept"
              payload: { expected_agreement_version: "${agr_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys: $.data.synthesized_system_id, agr_v2: $.data.version }
          assert:
            - "the first accept succeeds because expected_hospital_account_version ${acct_v} matches"
            - "after it, GET /api/accounts/${acct} reports a version strictly greater than ${acct_v}, because the accept bumped the account version"
            - "replaying the accept with expected_hospital_account_version ${acct_v} returns 412 ERR_STALE_VERSION, and that replay is a purely sequential second request"
            - "PostgreSQL-style wall-clock framing is absent: the rejection depends only on the observed version, not on request timing"

      - name: stale_robot_system_version_on_contract_create_returns_stale_version
        claim_type: Priority Ordering
        grounds:
          - concurrency_rules[service-contract-create-stale-robot-system]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/api/service-contracts
        distinguishing_aspect: "A second OCC rule on a different parent entity: the system's version is bumped by an unrelated mutation, so a contract create carrying the older system version is rejected 412 even though the contract's own payload is entirely valid."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed, with the system's version captured, then bumped by a service action and a restore."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v_stale: $.data.version, sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /api/service-contracts"
              payload: { robot_system_id: "${sys}", coverage_tier: "STANDARD", contract_start_utc: "2026-09-01T00:00:00Z", contract_months: 12, expected_robot_system_version: "${sys_v_stale}" }
              as: ServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "the same create with expected_robot_system_version ${sys_v} succeeds with 201 and service_tier_index 2"
            - "the successful contract reports response_time_commitment_hours == 24 (min(24, max(4, 48 - 12 x 2)))"

      - name: reinstate_with_an_out_of_window_contract_returns_temporal_invalid
        claim_type: Temporal validation
        grounds:
          - state_machines.PlacementAgreement.SUSPENDED_to_ACTIVE
          - validations[priority=33]
          - errors.ERR_CONTRACT_TEMPORALLY_INVALID
        distinguishing_aspect: "A reinstate is valid in the present but the cross-entity contract check fails because the coverage contract's window has already closed, so the operation is rejected for a future-state reason rather than a current-state one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One SUSPENDED agreement whose system is in SERVICE_ACTION_REQUIRED and whose synthesized contract ran for 1 month, with the clock then advanced past its end."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev}", arrangement_type: "USAGE_BASED", base_monthly_fee_cents: 0, minimum_procedures_per_cycle: 4, interval_months: 1, placement_fee_cents: 1000000, usage_rate_basis_points: 400 }
              as: RegionalSalesDirector
              captures: { agr_t: $.data.id, agr_t_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_t}/submit"
              payload: { expected_agreement_version: "${agr_t_v}" }
              as: RegionalSalesDirector
              captures: { agr_t_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_t}/accept"
              payload: { expected_agreement_version: "${agr_t_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys_t: $.data.synthesized_system_id, sys_t_v: $.data.synthesized_system_version, sc_sc: $.data.synthesized_service_contract_id, agr_t_v: $.data.version }
            - call: "GET /api/service-contracts/${sc_sc}"
              payload: {}
              as: ServiceEngineer
              captures: { sc_sc_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_t}/install"
              payload: { expected_robot_system_version: "${sys_t_v}" }
              as: ClinicalOperationsLead
              captures: { sys_t_v: $.data.version }
            - call: "POST /api/robot-systems/${sys_t}/commission"
              payload: { expected_robot_system_version: "${sys_t_v}" }
              as: ClinicalOperationsLead
              captures: { sys_t_v: $.data.version }
            - call: "POST /api/month-close/runs"
              payload: { as_of_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/robot-systems/${sys_t}/open-service-action"
              payload: { expected_robot_system_version: "${sys_t_v}" }
              as: ServiceEngineer
              captures: { agr_t_v: $.data.version }
            - call: "POST /api/service-contracts/${sc_sc}/terminate"
              payload: { expected_contract_version: "${sc_sc_v}" }
              as: ServiceEngineer
          trigger:
            - call: "POST /api/placement-agreements/${agr_t}/reinstate"
              payload: { expected_agreement_version: "${agr_t_v}" }
              as: RegionalSalesDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 or 409 and error_id is ERR_CONTRACT_TEMPORALLY_INVALID or ERR_SERVICE_CONTRACT_REQUIRED"
            - "PlacementAgreement.${agr_t}.agreement_status is still SUSPENDED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: evidence_renew_side_effect_clears_expiring_status
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/api/credentialing-evidence/{evidenceId}/renew
          - state_machines.CredentialingEvidence.EXPIRING_SOON_to_VALID
          - endpoints.GET_/api/credentialing-evidence/{evidenceId}
        distinguishing_aspect: "The renew action's declared side effect is observable afterwards: an EXPIRING_SOON record comes back VALID with the new expiry, and the training path's step-5 grace recomputes from the renewed instant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a training record, with one evidence record whose expiry is inside the 30-day window."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/training-records/${tr}/credentialing-evidence"
              payload: { evidence_type: "PRIVILEGE_ATTESTATION", issued_utc: "2026-08-01T00:00:00Z", expires_utc: "2026-09-15T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { ev: $.data.id, ev_v: $.data.version, ev_status: $.data.evidence_status }
          trigger:
            - call: "POST /api/credentialing-evidence/${ev}/renew"
              payload: { issued_utc: "2026-09-01T00:00:00Z", expires_utc: "2027-09-01T00:00:00Z", expected_evidence_version: "${ev_v}" }
              as: ComplianceOfficer
              captures: { ev_status_after: $.data.evidence_status }
          assert:
            - "CredentialingEvidence.${ev}.evidence_status == EXPIRING_SOON on creation, because the expiry sits inside 30 days of the clock"
            - "after renew it is VALID with expires_utc 2027-09-01T00:00:00Z"
            - "GET /api/credentialing-evidence/${ev} reflects the same VALID status and the new expiry"

      - name: case_list_ordering_is_stable_by_case_started_at
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/api/procedure-cases
          - entities.ProcedureCase.fields.case_started_at
        distinguishing_aspect: "The list orders deterministically by case_started_at ascending, so a caller that pages with limit=1 walks the cases in schedule order rather than in insertion or id order."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A commissioned system with three cases deliberately created out of chronological order: 2026-09-12, 2026-09-10, 2026-09-11."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-12T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { late: $.data.id }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { early: $.data.id }
          trigger:
            - call: "GET /api/procedure-cases"
              payload: { robot_system_id: "${sys}", limit: 1, offset: 0 }
              as: AccountOwner
              as_user_id: "${acct}"
          assert:
            - "the first page returns ${early}, the earliest case_started_at, not the most recently inserted one"
            - "the second page (offset 1) returns the 2026-09-11 case and the third page returns ${late}"

  # ===========================================================================
  - section: errors
    instances:

      - name: ownership_mismatch_on_an_entity_backed_role
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_OWNERSHIP_MISMATCH
          - roles.AccountOwner
          - endpoints.POST_/api/robot-systems/{systemId}/procedure-cases
        distinguishing_aspect: "The AccountOwner role is entity_backed:HospitalAccount, so acting as a different account's identity on a system it does not own is a 403 ERR_OWNERSHIP_MISMATCH rather than a not-found or a silent success."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack installed and commissioned under account A, plus a second unrelated account B."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/accounts"
              payload: { account_name: "Outsider Clinic", idn_group_code: "IDN-OUTSIDER", region_code: "WEST", placement_cap: 2, maximum_procedure_commitment: 10 }
              as: RegionalSalesDirector
              captures: { acct_b: $.data.id }
          trigger:
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-25T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_OWNERSHIP_MISMATCH"
            - "the same call with as_user_id ${acct} succeeds with 201"

      - name: evidence_required_before_credentialing_returns_dedicated_error
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_CREDENTIALING_EVIDENCE_REQUIRED
          - validations[priority=16]
          - endpoints.POST_/api/proctor-cases/{proctorCaseId}/approve
        distinguishing_aspect: "Credentialing with the proctoring requirement met but no evidence on file fails on the evidence rule specifically, distinguishing it from ERR_PROCTORING_CASES_INCOMPLETE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a training record in PROCTORING with its required proctored case logged, and no credentialing evidence."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/training-records/${tr}/complete-simulation"
              payload: { simulation_modules_completed: 4, expected_training_record_version: "${tr_v}" }
              as: ClinicalOperationsLead
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/begin-proctoring"
              payload: { required_proctored_cases: 1, expected_training_record_version: "${tr_v}" }
              as: RegionalSalesDirector
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/proctor-cases"
              payload: { case_observation_ref: "OBS-NOEV", occurred_at_utc: "2026-08-20T00:00:00Z" }
              as: ClinicalOperationsLead
              captures: { pc: $.data.id, tr_v: $.data.version }
          trigger:
            - call: "POST /api/proctor-cases/${pc}/approve"
              payload: { expected_training_record_version: "${tr_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CREDENTIALING_EVIDENCE_REQUIRED"
            - "error_id is NOT ERR_PROCTORING_CASES_INCOMPLETE even though no case has been approved yet"
            - "SurgeonTrainingRecord.${tr}.training_status is still PROCTORING"

      - name: duplicate_serial_number_on_a_second_accept_is_409
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DUPLICATE_SERIAL_NUMBER
          - validations[priority=23]
        distinguishing_aspect: "Serial uniqueness is enforced at synthesis time, so a second acceptance that would mint a system with an already-used serial is refused rather than producing two rows with the same serial."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack with one accepted PURCHASE agreement, plus a second PASSED review and a second submitted agreement on the same account."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "CG-9", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev9: $.data.id, rev9_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev9}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev9_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev9}", arrangement_type: "PURCHASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, placement_fee_cents: 6000000 }
              as: RegionalSalesDirector
              captures: { agr9: $.data.id, agr9_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr9}/submit"
              payload: { expected_agreement_version: "${agr9_v}" }
              as: RegionalSalesDirector
              captures: { agr9_v: $.data.version }
          trigger:
            - call: "POST /api/placement-agreements/${agr9}/accept"
              payload: { expected_agreement_version: "${agr9_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
          assert:
            - "either the accept succeeds with a distinct serial and GET /api/robot-systems?hospital_account_id=${acct} returns 2 systems with distinct serials, or it fails with 409 ERR_DUPLICATE_SERIAL_NUMBER"
            - "in every case the two systems' tags differ, so serial uniqueness is never violated"
            - "GET /api/robot-systems?service_status=NOT_INSTALLED returns exactly the second system when the accept succeeded"

  # ===========================================================================
  - section: rbac
    instances:

      - name: engineer_cannot_publish_software_releases
        claim_type: Role denial
        grounds:
          - roles.ServiceEngineer
          - roles.PlatformAdmin.exclusive_operations
          - endpoints.POST_/api/system-configurations/{configId}/releases
          - errors.ERR_AGENT_NOT_PERMITTED
        distinguishing_aspect: "Publishing a release is a PlatformAdmin-exclusive operation, so a ServiceEngineer is denied 403 ERR_AGENT_NOT_PERMITTED while the same engineer's own deployment operations still succeed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DA_V2 configuration."
          setup_api_calls:
            - *clock
            - *cfg2
          trigger:
            - call: "POST /api/system-configurations/${cfg}/releases"
              payload: { release_index: 1, feature_codes: ["FIREFLY"] }
              as: ServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_AGENT_NOT_PERMITTED"
            - "the same call as PlatformAdmin succeeds with 201 and release_index 1"
            - "GET /api/software-releases?system_configuration_id=${cfg} returns exactly 1 row after the admin call"

      - name: account_owner_cannot_verify_its_own_compliance_evidence
        claim_type: Segregation of duties
        grounds:
          - validations[priority=17]
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
          - roles.AccountOwner
        distinguishing_aspect: "Segregation of duties forbids one identity from both operating and verifying: the approver's X-User-ID must differ from HospitalAccount.hospital_owner_user_id, so an account owner attempting the approval is refused even with ComplianceOfficer privileges."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack up to a PROCTORING record with a logged proctor case and one VALID evidence record, where the account's hospital_owner_user_id is the same string the test will present as the approver."
          setup_api_calls:
            - *clock
            - call: "POST /api/accounts"
              payload: { account_name: "Greyrock Surgical", idn_group_code: "IDN-GREYROCK", region_code: "EAST", placement_cap: 3, maximum_procedure_commitment: 20 }
              as: RegionalSalesDirector
              as_user_id: "owner-greyrock"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - *cfg2
            - *review_pass
            - *review_verdict
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Greyrock", simulation_modules_completed: 4, required_proctored_cases: 1 }
              as: ClinicalOperationsLead
              captures: { tr: $.data.id, tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/complete-simulation"
              payload: { simulation_modules_completed: 4, expected_training_record_version: "${tr_v}" }
              as: ClinicalOperationsLead
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/begin-proctoring"
              payload: { required_proctored_cases: 1, expected_training_record_version: "${tr_v}" }
              as: RegionalSalesDirector
              captures: { tr_v: $.data.version }
            - call: "POST /api/training-records/${tr}/credentialing-evidence"
              payload: { evidence_type: "CREDENTIAL_LETTER", issued_utc: "2026-08-01T00:00:00Z", expires_utc: "2027-08-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /api/training-records/${tr}/proctor-cases"
              payload: { case_observation_ref: "OBS-SOD", occurred_at_utc: "2026-08-20T00:00:00Z" }
              as: ClinicalOperationsLead
              captures: { pc: $.data.id, tr_v: $.data.version }
          trigger:
            - call: "POST /api/proctor-cases/${pc}/approve"
              payload: { expected_training_record_version: "${tr_v}" }
              as: ComplianceOfficer
              as_user_id: "owner-greyrock"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "SurgeonTrainingRecord.${tr}.training_status is still PROCTORING"
            - "the same approval with as_user_id co-1 succeeds and drives training_status to CREDENTIALED"

      - name: surgeon_reads_only_its_own_training_record
        claim_type: Role denial
        grounds:
          - roles.Surgeon
          - endpoints.GET_/api/training-records/{recordId}
        distinguishing_aspect: "The Surgeon role is entity_backed:SurgeonTrainingRecord, so its identity may read its own record but is denied on another record while a ClinicalOperationsLead reads both."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack with two training records on the same account."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - call: "POST /api/accounts/${acct}/training-records"
              payload: { surgeon_name: "Dr. Second", simulation_modules_completed: 0, required_proctored_cases: 2 }
              as: ClinicalOperationsLead
              captures: { tr2: $.data.id }
          trigger:
            - call: "GET /api/training-records/${tr}"
              payload: {}
              as: Surgeon
              as_user_id: "${tr}"
          assert:
            - "the response status is 200 and returns the acting record ${tr}"
            - "GET /api/training-records/${tr2} with as_user_id ${tr} returns 403 ERR_OWNERSHIP_MISMATCH"
            - "GET /api/training-records/${tr2} as ClinicalOperationsLead returns 200"

      - name: anonymous_can_only_reach_the_logical_clock
        claim_type: Role denial
        grounds:
          - roles.Anonymous
          - endpoints.POST_/api/_clock/set_current_utc
          - errors.ERR_AGENT_NOT_PERMITTED
        distinguishing_aspect: "The Anonymous role's entire surface is the logical clock endpoint, so it drives fixtures successfully there and is refused on every business mutation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Anonymous
            - call: "POST /api/accounts"
              payload: { account_name: "Anon Attempt", idn_group_code: "IDN-ANON", region_code: "WEST", placement_cap: 1, maximum_procedure_commitment: 1 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the clock call succeeds and is visible on any later response's meta timestamp basis"
            - "the account create returns 403 ERR_AGENT_NOT_PERMITTED"
            - "GET /api/accounts with as Anonymous returns 403 as well, so the role has no read surface either"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: cascading_effects_from_commission_are_ordered_and_complete
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RobotSystem.INSTALLED_to_IN_SERVICE
          - state_machines.RobotSystem.NOT_INSTALLED_to_INSTALLED
          - entities.RobotSystem.fields.current_utilization_cycle_id
        distinguishing_aspect: "The install-then-commission chain fires its side effects in a fixed order — install mutates only the system, commission then stamps the cycle and the band — so an implementation that opens the cycle at install time produces a second cycle at commission and is detectably wrong."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The standard stack accepted, with a credentialed surgeon and an active contract."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
          trigger:
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { cyc: $.data.current_utilization_cycle_id }
          assert:
            - "after install, RobotSystem.${sys}.current_utilization_cycle_id is null and service_status is INSTALLED"
            - "after commission, current_utilization_cycle_id is non-null and service_status is IN_SERVICE"
            - "GET /api/robot-systems/${sys}/utilization-cycles returns exactly 1 row, proving the cycle was not opened twice"
            - "that row's utilization_band is UNDERUTILIZED and its reporting_period_index is 0"

      - name: derived_expansion_eligible_reconciles_after_every_input_moves
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.system_expansion_eligibility
          - entities.RobotSystem.fields.expansion_eligible
          - endpoints.POST_/api/robot-systems/{systemId}/open-service-action
        distinguishing_aspect: "expansion_eligible is a three-conjunct derived field, and it flips false the moment any single conjunct breaks — the service tier drops to LIMITED, the system leaves IN_SERVICE, or utilization falls below the commitment — so it never goes stale on a single input."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A commissioned system on an agreement with minimum_procedures_per_cycle 0, so the third conjunct is vacuously true and the field is driven only by the first two."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/service-contracts"
              payload: { robot_system_id: "${sys}", coverage_tier: "STANDARD", contract_start_utc: "2026-09-01T00:00:00Z", contract_months: 24, expected_robot_system_version: "${sys_v}" }
              as: ServiceEngineer
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /api/robot-systems/${sys}/open-service-action"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ServiceEngineer
              captures: { sys_v: $.data.version }
          assert:
            - "with a COMPREHENSIVE tier-3 contract the system is expansion_eligible true"
            - "after open-service-action the system is SERVICE_ACTION_REQUIRED and expansion_eligible false"
            - "after restore-service the field returns to true because both remaining conjuncts still hold"
            - "the field is recomputed on every read rather than cached, so the three reads disagree exactly where the inputs do"

      - name: release_entitlement_reconciles_on_deployment_completion
        claim_type: conditional_feature_flags
        grounds:
          - entities.SystemConfiguration.fields.feature_entitlements
          - entities.RobotSystem.fields.entitled_feature_codes
          - entities.RobotSystem.fields.installed_software_release_index
          - endpoints.POST_/api/software-deployments/{deploymentId}/complete
        distinguishing_aspect: "Feature entitlement is a function of the installed release index: a system with release index 1 exposes only the features whose min_release_index <= 1, and completing a later deployment raises the index and grows the entitled set without any feature being set directly."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A configuration with two releases: index 1 unlocking FIREFLY and index 3 unlocking FORCE_FEEDBACK, plus a commissioned system on that configuration."
          setup_api_calls:
            - *clock
            - *acct
            - call: "POST /api/system-configurations"
              payload: { model_code: "DA_V3", base_placement_fee_cents: 7200000, max_instrument_lives: 14, feature_entitlements: [{ feature_code: "FIREFLY", min_release_index: 1 }, { feature_code: "FORCE_FEEDBACK", min_release_index: 3 }], requires_dark_fiber: false, requires_dedicated_power_circuit: false, integration_tier: 2, min_operating_room_length_cm: 780, min_operating_room_width_cm: 700, min_table_throw_radius_cm: 320, min_ceiling_clearance_cm: 280 }
              as: PlatformAdmin
              captures: { cfg3: $.data.id }
            - call: "POST /api/system-configurations/${cfg3}/releases"
              payload: { release_index: 1, feature_codes: ["FIREFLY"] }
              as: PlatformAdmin
              captures: { rel1: $.data.id }
            - call: "POST /api/system-configurations/${cfg3}/releases"
              payload: { release_index: 3, feature_codes: ["FORCE_FEEDBACK"] }
              as: PlatformAdmin
              captures: { rel3: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "RL-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg3}" }
              as: ClinicalOperationsLead
              captures: { rev3: $.data.id, rev3_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev3}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev3_v}" }
              as: ClinicalOperationsLead
            - *surgeon
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg3}", site_readiness_review_id: "${rev3}", arrangement_type: "LEASE", base_monthly_fee_cents: 200000, minimum_procedures_per_cycle: 0, interval_months: 1, lease_monthly_amount_cents: 900000 }
              as: RegionalSalesDirector
              captures: { agr3: $.data.id, agr3_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr3}/submit"
              payload: { expected_agreement_version: "${agr3_v}" }
              as: RegionalSalesDirector
              captures: { agr3_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr3}/accept"
              payload: { expected_agreement_version: "${agr3_v}", expected_hospital_account_version: "${acct_v}" }
              as: HospitalProcurementOfficer
              captures: { sys3: $.data.synthesized_system_id, sys3_v: $.data.synthesized_system_version }
            - call: "POST /api/robot-systems/${sys3}/install"
              payload: { expected_robot_system_version: "${sys3_v}" }
              as: ClinicalOperationsLead
              captures: { sys3_v: $.data.version }
            - call: "POST /api/robot-systems/${sys3}/commission"
              payload: { expected_robot_system_version: "${sys3_v}" }
              as: ClinicalOperationsLead
              captures: { sys3_v: $.data.version }
            - call: "POST /api/robot-systems/${sys3}/software-deployments"
              payload: { software_release_id: "${rel1}", scheduled_window_start_utc: "2026-09-20T00:00:00Z", scheduled_window_end_utc: "2026-09-20T04:00:00Z" }
              as: ServiceEngineer
              captures: { dep1: $.data.id, dep1_v: $.data.version }
          trigger:
            - call: "POST /api/software-deployments/${dep1}/complete"
              payload: { expected_deployment_version: "${dep1_v}" }
              as: ServiceEngineer
              captures: { dep1_v: $.data.version }
          assert:
            - "before the deployment RobotSystem.${sys3}.installed_software_release_index == 0 and entitled_feature_codes is empty"
            - "after completing release 1 the index is 1 and entitled_feature_codes == [\"FIREFLY\"] only"
            - "presenting release index 3 is accepted next, and completing it raises the index to 3 and grows entitled_feature_codes to [\"FIREFLY\", \"FORCE_FEEDBACK\"]"
            - "attempting release index 1 again after the index is 3 returns 409 ERR_RELEASE_DOWNGRADE"

      - name: bulk_completion_leaves_the_non_cancelled_cases_untouched
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_/api/procedure-cases/bulk-complete
          - entities.ProcedureCase.fields.case_status
        distinguishing_aspect: "The bulk endpoint reports per-item outcomes rather than a single verdict: the completed and skipped sets partition the requested ids with no overlap and no silent omission."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A commissioned system with three scheduled cases, one of which is then cancelled."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { m1: $.data.id }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-11T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { m2: $.data.id }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-12T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { m3: $.data.id, m3_v: $.data.version }
            - call: "POST /api/procedure-cases/${m3}/cancel"
              payload: { expected_case_version: "${m3_v}" }
              as: HospitalProcurementOfficer
              as_user_id: "hpo-1"
          trigger:
            - call: "POST /api/procedure-cases/bulk-complete"
              payload: { case_ids: ["${m1}", "${m2}", "${m3}"] }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { done: $.data.completed_count, skipped: $.data.skipped_case_ids }
          assert:
            - "completed_count + len(skipped_case_ids) == 3, so every requested id is accounted for exactly once"
            - "skipped_case_ids == [\"${m3}\"]"
            - "GET /api/procedure-cases?robot_system_id=${sys}&case_status=COMPLETED returns total_count 2"
            - "POST /api/procedure-cases/bulk-complete again with the same ids returns completed_count 0 and skipped_case_ids of length 3, because completed cases are no longer eligible"

      - name: month_close_advanced_clock_rolls_cycles_and_bands
        claim_type: rate_threshold_triggers
        grounds:
          - endpoints.POST_/api/month-close/runs
          - entities.UtilizationCycle.fields.reporting_period_index
          - errors.ERR_ACCEPTANCE_WINDOW_EXPIRED
        distinguishing_aspect: "The month-close run is the only thing that advances reporting_period_index and expires acceptance windows, so behaviour before and after the run differs with no other state change."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One commissioned system and a second submitted agreement whose acceptance window expires 30 days after 2026-09-01."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version, cyc: $.data.current_utilization_cycle_id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "MC-2", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev_m: $.data.id, rev_m_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev_m}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_m_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/placement-agreements"
              payload: { hospital_account_id: "${acct}", system_configuration_id: "${cfg}", site_readiness_review_id: "${rev_m}", arrangement_type: "LEASE", base_monthly_fee_cents: 200000, lease_monthly_amount_cents: 900000 }
              as: RegionalSalesDirector
              captures: { agr_m: $.data.id, agr_m_v: $.data.version }
            - call: "POST /api/placement-agreements/${agr_m}/submit"
              payload: { expected_agreement_version: "${agr_m_v}" }
              as: RegionalSalesDirector
              captures: { agr_m_v: $.data.version }
          trigger:
            - call: "POST /api/month-close/runs"
              payload: { as_of_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "UtilizationCycle.${cyc}.reporting_period_index is 1 after the run, having been 0 before"
            - "PlacementAgreement.${agr_m}.agreement_status == DRAFT after the run, because the clock moved past its 2026-10-01 acceptance expiry"
            - "a later accept on ${agr_m} returns 409 ERR_ACCEPTANCE_WINDOW_EXPIRED"
            - "a second month-close run at as_of_utc 2026-11-05T00:00:00Z raises reporting_period_index to 2"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_mutation_returns_fully_reconciled_state_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.ProcedureCase.fields.instrument_billing_cents
          - entities.UtilizationCycle.fields.completed_case_count
          - entities.HospitalAccount.fields.service_line_tier
        distinguishing_aspect: "The consistency model is immediate, so the very response that completes a case already carries the recomputed billing amount, and a read of every derived field in the same breath agrees with the write — no eventual reconciliation window exists."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A commissioned system and one scheduled UROLOGY case on a PURCHASE agreement with max_instrument_lives 40."
          setup_api_calls:
            - *clock
            - *acct
            - *cfg2
            - *review_pass
            - *review_verdict
            - *surgeon
            - *agreement
            - *submit
            - *accept
            - call: "POST /api/robot-systems/${sys}/install"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/procedure-cases"
              payload: { training_record_id: "${tr}", procedure_family: "UROLOGY", case_started_at: "2026-09-10T08:00:00Z", duration_minutes: 60, instrument_load: 1 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { zz: $.data.id, zz_v: $.data.version }
          trigger:
            - call: "POST /api/procedure-cases/${zz}/mark-completed"
              payload: { expected_case_version: "${zz_v}" }
              as: AccountOwner
              as_user_id: "${acct}"
          assert:
            - "the completion response itself reports case_status COMPLETED and instrument_billing_cents == 125000, with no follow-up read required"
            - "GET /api/robot-systems/${sys}/current-utilization-cycle immediately reports completed_case_count 1 with no delay"
            - "GET /api/accounts/${acct} immediately reports a service_line_tier index of 0, derived from the single UROLOGY family"
            - "PlacementAgreement.${agr}.committed_cases immediately reports 1"

  # ===========================================================================
  # Exclusion stubs — corners already exercised by a named §1.8 instance.
  # No test_recipe is emitted for these (forbidden by SKILL.md §1.9).
  # ===========================================================================
  - section: calculations
    instances:

      - name: instrument_billing_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.instrument_billing_amount.variants.quote_at_creation
          - calculations.instrument_billing_amount.variants.settle_at_completion
        excluded_because:
          difficulty_instance: instrument_billing_quote_vs_settle_on_same_case
          rationale: "Asserted there as the 375000 quote versus the 125000 settle on one case, which is exactly this row's divergence claim."

      - name: placement_fee_variant_selection
        claim_type: Variant Selection
        grounds:
          - calculations.placement_fee.variants.list_fee_at_submit
          - calculations.placement_fee.variants.write_down_after_integration
        excluded_because:
          difficulty_instance: placement_fee_list_at_submit_vs_net_at_activation
          rationale: "The §1.8 instance pins both variants' contexts and their 3850000 versus 3773000 divergence."

      - name: shortfall_fee_variant_selection_at_rollover
        claim_type: Variant Selection
        grounds:
          - calculations.shortfall_fee.variants.reconciliation_at_interval_close
          - calculations.shortfall_fee.variants.actual_at_billing
        excluded_because:
          difficulty_instance: shortfall_compliance_tier_escalation_remainder_ladder
          rationale: "That instance drives an interval with undelivered cases through the rollover, exercising the reconciliation variant's state filter."

      - name: shortfall_compliance_variant_pre_and_post_waiver
        claim_type: Variant Divergence
        grounds:
          - calculations.shortfall_compliance_status.variants.provisional_at_reconciliation
          - calculations.shortfall_compliance_status.variants.authoritative_after_waiver
        excluded_because:
          difficulty_instance: shortfall_compliance_tier_escalation_remainder_ladder
          rationale: "The §1.8 instance asserts the pre-waiver tier that the provisional variant reads, so the waiver divergence is already covered."

  - section: state_machines
    instances:

      - name: agreement_termination_cascade_end_to_end
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_TERMINATED
          - state_machines.RobotSystem.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
        excluded_because:
          difficulty_instance: agreement_termination_three_hop_contract_incident_cascade
          rationale: "The depth-3 cascade instance asserts every hop's end state after termination."

      - name: install_blocked_by_a_conditional_review
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RobotSystem.NOT_INSTALLED_to_INSTALLED
          - state_machines.SiteReadinessReview.PENDING_REVIEW_to_CONDITIONAL
        excluded_because:
          difficulty_instance: opportunity_enrollment_invalid_when_review_not_passed
          rationale: "That instance asserts ERR_SYSTEM_SITE_NOT_READY on a CONDITIONAL review and the same call succeeding after remediation."

      - name: agreement_revision_loop_round_trip
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_DRAFT
          - state_machines.PlacementAgreement.DRAFT_to_PENDING_ACCEPTANCE
        excluded_because:
          difficulty_instance: agreement_draft_pending_active_reject_revision_loop
          rationale: "The §1.8 instance drives DRAFT to ACTIVE and back to DRAFT, then re-submits the same row."

      - name: account_dormant_transition_on_a_month_close
        claim_type: Side Effect Execution
        grounds:
          - state_machines.HospitalAccount.ACTIVE_to_DORMANT
          - state_machines.HospitalAccount.DORMANT_to_ACTIVE
        excluded_because:
          difficulty_instance: system_service_action_two_hop_agreement_suspension_cascade
          rationale: "That instance's depth-2 chain is the same posture-recompute pattern the dormancy transition uses, and it asserts the recomputed posture end state."

  - section: validations
    instances:

      - name: loaner_dispatch_overlap_rejection_matches_the_loaner_rule
        claim_type: Violation -> Error
        grounds:
          - validations[priority=21]
          - errors.ERR_LOANER_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: loaner_unit_half_open_window_with_four_hour_turn_buffer
          rationale: "The §1.8 instance asserts the 409 ERR_LOANER_WINDOW_CONFLICT one minute inside the buffered end."

      - name: case_schedule_overlap_rejection_matches_the_scheduling_rule
        claim_type: Violation -> Error
        grounds:
          - validations[priority=19]
          - errors.ERR_CASE_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: empty_collection_boundary_on_cancelled_case_reversal
          rationale: "The §1.8 instance asserts the 409 ERR_CASE_SCHEDULE_CONFLICT before the sibling is cancelled and the 201 after."

      - name: accept_dual_failure_prefers_the_state_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: state_versus_temporal_priority_at_accept
          rationale: "That instance is precisely this dual-failure scenario and pins the winning error_id."
