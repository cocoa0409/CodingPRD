              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
