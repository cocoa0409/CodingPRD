          assert:
            - "qty 7: error_id == ERR_CASE_QTY_MISMATCH (captured ${err_1})"
            - "qty 10: line created (captured ${line_ok})"

      - name: error_artwork_required_for_custom_line
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_ARTWORK_REQUIRED]
        distinguishing_aspect: "Custom-print line without print_artwork_ref -> ERR_ARTWORK_REQUIRED; tolerance_pct 21 (above the 0..20 band) -> same error."
        test_recipe:
          setup: ["warehouse ATL; account; custom product; DRAFT order"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "N-1", name: "N", category: "LABELS", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20, is_custom_print: true, lead_time_days: 2 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 5, over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 5, print_artwork_ref: "art-n", over_under_tolerance_pct: 21 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_2: $.data.error_id }
          assert:
            - "missing artwork: error_id == ERR_ARTWORK_REQUIRED (captured ${err_1})"
            - "tolerance 21 out of band: error_id == ERR_ARTWORK_REQUIRED (captured ${err_2})"

      - name: error_duplicate_po_per_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_PO]
        distinguishing_aspect: "A second submitted order reusing po_number PO-DUP for the same account fails with ERR_DUPLICATE_PO, while the SAME po_number on a DIFFERENT account is accepted (uniqueness is per-account)."
        test_recipe:
          setup: ["warehouse ATL; accounts A1 and A2 (both po_required); product inventory 500; A1 order with PO-DUP submitted; A1 second DRAFT order with PO-DUP; A2 DRAFT order with PO-DUP"]
          setup_api_calls:
