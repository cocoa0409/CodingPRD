# =============================================================================
# PRD Benchmark Seed Tables — task_3090
# High-Net-Worth Homeowners Underwriting & Risk Mitigation Services
# =============================================================================

scenario: |
  High-Net-Worth Homeowners Underwriting & Risk Mitigation Services (Chubb Personal Risk Services): appraisal-based replacement cost valuation with extended and guaranteed replacement provisions, scheduled personal property for jewelry, art and collections with appraisal currency requirements, wildfire and catastrophe exposure scoring with defensible space requirements and mitigation credits, complimentary risk consulting visits and loss prevention device requirements, wildfire defense service dispatch during active events with vendor coordination, agent-produced business with high-value client servicing standards, claim handling with cash settlement options and specialty restoration vendors, non-renewal decisions in concentrated catastrophe zones with regulatory notice rules

domain_name: hnw-homeowners-underwriting
api_prefix: /hnw

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - posture_driven_gating
    - cascading_side_effects
    - dual_variant_calculation
    - contagion_risk_propagation
    - version_pinning_on_approval
    - selector_policy

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: RiskZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Regulatory catastrophe-zone code", constraints: "unique across RiskZone" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state the zone sits in" }
      - { name: wildland_urban_interface_band, type: enum, source: input, description: "WITHIN_WUI | ADJACENT_WUI | OUTSIDE_WUI" }
      - { name: sustained_wind_mph, type: integer, source: input, description: "Zone design wind speed", constraints: ">= 0" }
      - { name: mitigation_band_multiplier, type: number, source: input, description: "Loss-cost multiplier applied at mitigation band CLEARED", constraints: "> 0" }
      - { name: mitigated_loss_multiplier, type: number, source: input, description: "Loss-cost factor on the mitigated (base) loss when the property is CLEARED", default: 1.0 }
      - { name: concentration_ratio_pct, type: number, source: computed, description: "Exposure-weighted share of the carrier's insured value tied to this zone, recomputed by check_concentration" }
      - { name: concentration_band, type: enum, source: computed, description: "NORMAL | ELEVATED | CRITICAL — derived from concentration_ratio_pct" }
      - { name: freeze_active, type: boolean, source: computed, default: false, description: "True while concentration_band == CRITICAL; gates attachment on every property in the zone" }
      - { name: exposure_band, type: enum, source: computed, description: "STANDARD | ELEVATED | EXTREME — zone-level catastrophe severity band" }
      - { name: state_event, type: enum, source: input, description: "NONE | WATCH | ACTIVE — the zone-level wildfire event that gates wildfire defense dispatch", default: "NONE" }

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: agency_code, type: string, source: input, description: "Licensed agency identifier", constraints: "unique across Agency" }
      - { name: legal_name, type: string, source: input, description: "Agency legal name" }
      - { name: state_code, type: string, source: input, description: "State of licensure" }
      - { name: servicing_tier, type: enum, source: input, description: "PREMIER | SELECT | STANDARD", default: "STANDARD" }
      - { name: delegated_authority_limit_cents, type: integer, source: input, description: "Maximum replacement cost the agency may bind without referral", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether the agency may produce new business", default: true }
      - { name: concentration_ratio_pct, type: number, source: computed, description: "Exposure-weighted share of the carrier's portfolio written by this agency for the zone in question" }
      - { name: concentration_band, type: enum, source: computed, description: "NORMAL | ELEVATED | CRITICAL — derived from concentration_ratio_pct" }

  - name: Property
    parent: RiskZone
    common_fields: true
    fields:
      - { name: risk_zone_id, type: string, source: input, description: "FK -> RiskZone.id; the catastrophe zone the dwelling sits in" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; producing agency" }
      - { name: address_line, type: string, source: input, description: "Street address of the dwelling" }
      - { name: grid_risk_block, type: string, source: input, description: "Adjacency key: properties sharing a grid block are treated as co-exposed", default: "UNGROUPED" }
      - { name: dwelling_replacement_cost_cents, type: integer, source: computed, description: "Current-percent-complete appraised replacement cost of the dwelling", default: 0 }
      - { name: contents_replacement_cost_cents, type: integer, source: computed, description: "Current-percent-complete appraised replacement cost of unscheduled contents", default: 0 }
      - { name: scheduled_valuation_cents, type: computed, description: "Sum of approved ScheduledItem values currently attached to this property", default: 0 }
      - { name: appraised_at, type: datetime, source: system, description: "Timestamp of the most recent approved appraisal" }
      - { name: total_insured_value_cents, type: integer, source: computed, description: "dwelling + contents + scheduled valuation, excluding loss-of-use — the concentration/exposure currency", default: 0 }
      - { name: mitigation_band, type: enum, source: computed, description: "CLEARED | PARTIAL | FAILED | UNVERIFIED — CLEARED if any VERIFIED requirement has band_awarded CLEARED; else PARTIAL if any VERIFIED requirement has band_awarded PARTIAL; else FAILED if any MitigationRequirement is LAPSED or WAIVED; else UNVERIFIED" }
      - { name: base_posture, type: enum, source: computed, description: "PENDING_APPRAISAL | MITIGATION_REQUIRED | UNDERWRITABLE | DECLINED — ordered gate derived from appraisal and mitigation state", default: "PENDING_APPRAISAL" }
      - { name: posture, type: enum, source: computed, description: "WRITE_FROZEN | REFERRAL_REQUIRED | WRITE_ELIGIBLE. Pinned order: if base_posture is DECLINED or PENDING_APPRAISAL -> WRITE_FROZEN; elif RiskZone.freeze_active is true -> WRITE_FROZEN; elif base_posture is MITIGATION_REQUIRED -> REFERRAL_REQUIRED; elif RiskZone.exposure_band is ELEVATED and RiskZone.wildland_urban_interface_band is WITHIN_WUI or ADJACENT_WUI and defense_in_progress is false -> REFERRAL_REQUIRED; else -> WRITE_ELIGIBLE. The agency concentration band never participates in the posture of a property.", default: "WRITE_FROZEN" }
      - { name: defense_in_progress, type: boolean, source: computed, description: "True while a WildfireDefenseDispatch exists in state VENDOR_ASSIGNED or ON_SITE" }
      - { name: non_renewal_ground_activated, type: boolean, source: computed, description: "Set only when a NonRenewalNotice holds ground CONCENTRATION_REVIEW at effective_on" }

  - name: Appraisal
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling being appraised" }
      - { name: appraiser_name, type: string, source: input, description: "Credentialed appraiser or vendor" }
      - { name: valuation_method, type: enum, source: input, description: "SITE_MEASURED | DESKTOP_ESTIMATE | DRIVE_BY" }
      - { name: appraised_on, type: datetime, source: input, description: "Date the valuation was performed" }
      - { name: dwelling_cost_cents, type: integer, source: input, description: "Appraised dwelling replacement cost", constraints: "> 0" }
      - { name: contents_cost_cents, type: integer, source: input, description: "Appraised unscheduled contents replacement cost", default: 0 }
      - { name: valuation_confidence_pct, type: number, source: input, description: "Appraiser-stated confidence", constraints: "0 < pct <= 100" }
      - { name: percent_complete, type: number, source: computed, description: "1.00 while APPROVED or SUPERSEDED, 0.00 otherwise — drives Property valuation accumulation" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW → REVIEWED → APPROVED / REJECTED / SUPERSEDED / WITHDRAWN" }
      - { name: review_kind, type: enum, source: input, description: "FULL_APPRAISAL | VALUATION_PROVISION — the two admissible post-approval review paths", default: "VALUATION_PROVISION" }

  - name: ScheduledItem
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling the item is scheduled on" }
      - { name: item_type, type: enum, source: input, description: "JEWELRY | FINE_ART | COLLECTION | WINE" }
      - { name: declared_value_cents, type: integer, source: input, description: "Client-declared value", constraints: "> 0" }
      - { name: appraisal_doc_id, type: string, source: input, description: "FK -> AppraisalDocument.id; the substantiating appraisal document for this item" }
      - { name: appraisal_currency_months, type: integer, source: computed, description: "Whole months from the substantiating AppraisalDocument.appraisal_date to the logical clock month; freshness metric" }
      - { name: status, type: enum, source: system, description: "PENDING → APPROVED → ATTACHED, with APPROVED → REJECTED for a stale item and ATTACHED → APPROVED on a post-claim detach" }
      - { name: attached_value_cents, type: integer, source: computed, description: "= declared_value_cents while APPROVED or ATTACHED, else 0" }

  - name: AppraisalDocument
    parent: Property
    common_fields: false
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling the document substantiates" }
      - { name: item_class, type: enum, source: input, description: "JEWELRY | FINE_ART | COLLECTION | WINE | DWELLING" }
      - { name: appraiser_name, type: string, source: input, description: "Appraiser who issued the document" }
      - { name: appraisal_date, type: datetime, source: input, description: "Date of the underlying valuation" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Value attested by the document", constraints: "> 0" }
      - { name: currency_months, type: integer, source: computed, description: "Whole months from appraisal_date to the logical clock" }
      - { name: currency_status, type: enum, source: computed, description: "CURRENT | AGING | EXPIRED — currency band derived from currency_months" }
      - { name: expires_on, type: datetime, source: computed, description: "appraisal_date + 24 months, rolled to the first day of the following month" }

  - name: MitigationRequirement
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling the requirement is imposed on" }
      - { name: requirement_code, type: enum, source: input, description: "DEFENSIBLE_SPACE | FIRE_RESISTANT_ROOF | EMBER_VENT_SCREEN | EXTERIOR_IRRIGATION | FULL_MITIGATION_PROGRAM" }
      - { name: band_awarded, type: enum, source: input, description: "CLEARED | PARTIAL — the mitigation band this requirement confers when verified" }
      - { name: source, type: enum, source: input, description: "UNDERWRITING | RISK_CONSULTANT | DEFENSE_FOLLOW_UP" }
      - { name: due_on, type: datetime, source: input, description: "Date by which the requirement must be verified" }
      - { name: status, type: enum, source: system, description: "IMPOSED → VERIFIED / LAPSED / WAIVED, and VERIFIED → IMPOSED when the verification is thrown back for re-inspection" }
      - { name: verification_count, type: integer, source: computed, default: 0, description: "Number of times this requirement has reached VERIFIED; monotone and never decremented, so a reopen does not erase the history" }
      - { name: verified_on, type: datetime, source: system, description: "Timestamp of verification; null until VERIFIED", default: null }

  - name: RiskConsultation
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling visited" }
      - { name: consultant_user_id, type: string, source: input, description: "Opaque operator identifier of the assigned risk consultant" }
      - { name: scheduled_for, type: datetime, source: input, description: "Appointment start" }
      - { name: duration_minutes, type: integer, source: input, description: "Appointment length in minutes", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → COMPLETED / CANCELLED / NO_SHOW" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of completion; null until COMPLETED", default: null }
      - { name: report_issued_at, type: datetime, source: system, description: "Timestamp the visit produced a report; null until issued", default: null }

  - name: WildfireDefenseDispatch
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling being defended" }
      - { name: risk_zone_id, type: string, source: input, description: "FK -> RiskZone.id; zone holding the active wildfire event" }
      - { name: vendor_ref, type: string, source: input, description: "Private fire-service vendor reference; null while unassigned", default: null }
      - { name: state_event, type: enum, source: input, description: "Zone-level wildfire event: NONE | WATCH | ACTIVE" }
      - { name: status, type: enum, source: system, description: "REQUESTED → VENDOR_ASSIGNED → ON_SITE → COMPLETED / CANCELLED" }
      - { name: priority_rank, type: integer, source: computed, description: "Defense dispatch rank within the zone; lower is dispatched first" }
      - { name: assigned_at, type: datetime, source: system, description: "Timestamp the vendor was assigned; null until VENDOR_ASSIGNED", default: null }

  - name: Enrollment
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling being enrolled" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the producing agency of record" }
      - { name: risk_zone_id, type: string, source: input, description: "FK -> RiskZone.id; bound zone at submission" }
      - { name: dwelling_coverage_cents, type: integer, source: input, description: "Coverage A limit; must be >= 1.5 x current replacement cost", constraints: "> 0" }
      - { name: contents_coverage_cents, type: integer, source: input, description: "Coverage C limit", default: 0 }
      - { name: scheduled_coverage_cents, type: integer, source: input, description: "Coverage for scheduled personal property", default: 0 }
      - { name: loss_of_use_coverage_cents, type: integer, source: input, description: "Coverage D limit — never feeds risk scoring or concentration", default: 0 }
      - { name: risk_score, type: integer, source: computed, description: "Composite wildfire/risk score snapshotted at APPROVED", default: 0 }
      - { name: risk_tier, type: enum, source: computed, description: "MANAGED | REVIEW | SURCHARGE | REFER — band derived from risk_score" }
      - { name: required_dwelling_coverage_cents, type: integer, source: computed, description: "Current replacement cost x 1.5 — the binding minimum at ATTACHED", default: 0 }
      - { name: gross_premium_cents, type: integer, source: computed, description: "Annual gross premium before extended-replacement top-up", default: 0 }
      - { name: extended_replacement_premium_cents, type: integer, source: computed, description: "Top-up premium for the 1.5x valuation provision", default: 0 }
      - { name: extended_replacement_limit_cents, type: integer, source: computed, description: "Coverage A x 1.5 — limit while extended replacement is active", default: 0 }
      - { name: guaranteed_replacement_limit_cents, type: integer, source: computed, description: "Unlimited while defence-in-progress exemption holds; otherwise pinned to Coverage A", default: 0 }
      - { name: replacement_provision, type: enum, source: computed, description: "GUARANTEED | EXTENDED | NONE — the snapshot of which replacement provision survived the guarantee-fails freeze", default: "NONE" }
      - { name: stress_reserve_cents, type: integer, source: computed, description: "Dwelling + contents + scheduled coverage — non-decoration reserve currency", default: 0 }
      - { name: committed_reserve_cents, type: integer, source: computed, description: "Dwelling + contents + scheduled coverage while status is not terminal, else 0", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → REFERRED → APPROVED → ATTACHED / DECLINED / WITHDRAWN; not-yet-DONE claims do not create reserves" }
      - { name: bound_at, type: datetime, source: system, description: "Timestamp of ATTACH; null until bound", default: null }
      - { name: valuation_fingerprint, type: string, source: computed, description: "Snapshot of approved dwelling + contents + scheduled values at APPROVED; re-compared at ATTACH" }
      - { name: expected_property_version, type: integer, source: input, description: "OCC guard the client last observed on the parent Property", default: null }

  - name: ManagedRiskEvent
    parent: Property
    common_fields: false
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling the managed-risk letter was sent about" }
      - { name: event_type, type: enum, source: system, description: "OVERDUE_WARNING | REPEAT_INSPECTION_NOTICE — the mail-letter classes, each door-opened exactly once per derived key" }
      - { name: source_requirement_id, type: string, source: system, description: "The MitigationRequirement that stands as the evidence reference for the letter" }
      - { name: derived_key, type: string, source: computed, description: "Immutable identity of the letter: {property_id}:{source_requirement_id}:{event_type}. The same key never opens a second letter" }
      - { name: sent_at, type: datetime, source: system, description: "Timestamp the letter was recorded as sent" }
      - { name: body_summary, type: string, source: computed, description: "Rendered letter text" }

  - name: Claim
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the policy the claim draws on" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the damaged dwelling" }
      - { name: cause_of_loss, type: enum, source: input, description: "WILDFIRE | WIND | HALL | WATER | THEFT | OTHER" }
      - { name: loss_date, type: datetime, source: input, description: "Date the loss occurred" }
      - { name: reported_at, type: datetime, source: system, description: "Timestamp the claim was reported" }
      - { name: reported_indemnity_cents, type: integer, source: input, description: "Claimed replacement cost", constraints: ">= 0" }
      - { name: adjuster_user_id, type: string, source: input, description: "Opaque operator identifier of the assigned adjuster", default: null }
      - { name: adjuster_override, type: boolean, source: input, description: "Specialty-restoration override; forces the 1.20 scarcity factor on the settlement", default: false }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Cash-settlement value of the loss, capped by the applicable limit", default: 0 }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Deductible actually absorbed, capped at the settlement", default: 0 }
      - { name: limit_applied_cents, type: integer, source: computed, description: "Replacement-cost limit the settlement was capped by", default: 0 }
      - { name: cash_settlement_eligible, type: boolean, source: computed, description: "True while the applicable limit is the guaranteed (unlimited) limit", default: false }
      - { name: status, type: enum, source: system, description: "REPORTED → UNDER_REVIEW → APPROVED → SETTLED / DENIED / PAID / REJECTED" }

  - name: NonRenewalNotice
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the policy being non-renewed" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling of record" }
      - { name: risk_zone_id, type: string, source: input, description: "FK -> RiskZone.id; zone whose concentration drives the decision" }
      - { name: ground, type: enum, source: input, description: "CONCENTRATION_REVIEW | MITIGATION_FAILURE | APPRAISAL_LAPSE | NONPAYMENT" }
      - { name: issued_on, type: datetime, source: system, description: "Timestamp the notice was issued" }
      - { name: effective_on, type: datetime, source: input, description: "Cancellation effective date; pins the notice period" }
      - { name: required_notice_days, type: integer, source: computed, description: "Regulator-required notice period for the band, read from the zone's RiskZone rules", default: 0 }
      - { name: notice_period_days, type: integer, source: computed, description: "Whole days from issued_on to effective_on", default: 0 }
      - { name: delay_exempt, type: boolean, source: computed, description: "True when the ground is CONCENTRATION_REVIEW and the zone band is CRITICAL", default: false }
      - { name: seal_at, type: datetime, source: computed, description: "Pinpoint instant of the notice period; strictly-after rule at the pin", default: null }
      - { name: status, type: enum, source: system, description: "PENDING → ISSUED → EFFECTIVE / RESCINDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: Property
    initial_state: PENDING_APPRAISAL
    terminal_states: [DECLINED]
    transitions:
      - from: PENDING_APPRAISAL
        to: UNDERWRITABLE
        trigger: POST /hnw/properties/{id}/posture-eval
        actor: Underwriter
        preconditions:
          - "Property has at least one Appraisal with status APPROVED"
          - "At least one approved appraisal has valuation_method SITE_MEASURED"
          - "The latest approved appraisal satisfies the 1.50 guarantee ratio: dwelling_cost_cents >= 1.50 * dwelling_replacement_cost_cents"
        side_effects:
          - "Property.appraised_at is stamped from the latest approved appraisal's appraised_on"
          - "If no CLEARED mitigation exists, RiskZone.exposure_band == EXTREME and RiskZone.wildland_urban_interface_band is WITHIN_WUI or ADJACENT_WUI, a MitigationRequirement with requirement_code DEFENSIBLE_SPACE, band_awarded PARTIAL and source UNDERWRITING is auto-imposed"
          - "Property.posture recomputed"
        note: "Order matters: the CLEARED-mitigation short circuit is applied only after the guarantee ratio has been tested, so a fully-mitigated property with an under-insured valuation still fails closed."

      - from: PENDING_APPRAISAL
        to: DECLINED
        trigger: POST /hnw/properties/{id}/posture-eval
        actor: Underwriter
        preconditions:
          - "The latest approved appraisal fails the 1.50 guarantee ratio"
        side_effects:
          - "Property.posture = WRITE_FROZEN"
          - "Every Enrollment of this property in state DRAFT or SUBMITTED transitions to DECLINED"
          - "Every Enrollment driven to DECLINED triggers the enrollment-declined cascade in §1.2 (Enrollment machine): its wildland defense dispatch, if any, is cancelled and its claim, if any, is rejected"

      - from: UNDERWRITABLE
        to: MITIGATION_REQUIRED
        trigger: "system (automatic when an UNDERWRITING-sourced MitigationRequirement is imposed on the property; the same transition also fires for a RISK_CONSULTANT-sourced or DEFENSE_FOLLOW_UP-sourced requirement)"
        actor: system
        preconditions:
          - "At least one MitigationRequirement with status IMPOSED exists"
        side_effects:
          - "Property.posture recomputed"
          - "Every Enrollment of this property in state SUBMITTED transitions to REFERRED"
          - "increments Property.version by 1"

      - from: MITIGATION_REQUIRED
        to: UNDERWRITABLE
        trigger: POST /hnw/mitigation-requirements/{id}/verify, and again when a reopened requirement is re-verified
        actor: RiskConsultant
        preconditions:
          - "MitigationRequirement.status == IMPOSED"
          - "logical clock <= MitigationRequirement.due_on"
        side_effects:
          - "MitigationRequirement.status = VERIFIED and verified_on stamped"
          - "Property.mitigation_band recomputed from the verification bands"
          - "If MitigationRequirement.verification_count reaches 2, a ManagedRiskEvent with event_type REPEAT_INSPECTION_NOTICE and derived_key {property_id}:{requirement_id}:REPEAT_INSPECTION_NOTICE is recorded, unless that derived key already exists"
          - "Property.base_posture recomputed; Property.posture recomputed"
          - "increments Property.version by 1"

      - from: MITIGATION_REQUIRED
        to: DECLINED
        trigger: "system (automatic when the logical clock passes the due_on of the last IMPOSED MitigationRequirement, or an imposed requirement is waived)"
        actor: system
        preconditions:
          - "Every MitigationRequirement of the property is LAPSED or WAIVED"
        side_effects_note: "The requirement itself transitions IMPOSED -> LAPSED as a separate link in this chain; that lapse is what emits the letter."
        side_effects:
          - "Property.posture = WRITE_FROZEN"
          - "Every Enrollment of this property in state DRAFT or SUBMITTED transitions to DECLINED"

      - from: UNDERWRITABLE
        to: PENDING_APPRAISAL
        trigger: "system (automatic when the base appraisal's valuation currency lapses at 24 months)"
        actor: system
        preconditions:
          - "No approved appraisal remains within currency"
        side_effects:
          - "Property.posture recomputed"
          - "Every Enrollment of this property in state SUBMITTED transitions to REFERRED"

  - entity: Appraisal
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: PENDING_REVIEW
        to: REVIEWED
        trigger: POST /hnw/appraisals/{id}/review
        actor: Underwriter
        preconditions:
          - "Appraisal.status == PENDING_REVIEW"
        side_effects:
          - "no valuation fields change until approval"

      - from: REVIEWED
        to: APPROVED
        trigger: POST /hnw/appraisals/{id}/approve
        actor: Underwriter
        preconditions:
          - "Appraisal.status == REVIEWED"
          - "Appraisal.valuation_method == SITE_MEASURED"
        side_effects:
          - "Appraisal.percent_complete = 1.00"
          - "Property.dwelling_replacement_cost_cents recomputed as sum(dwelling_cost_cents * percent_complete) over APPROVED appraisals"
          - "Property.contents_replacement_cost_cents recomputed the same way"
          - "Property.total_insured_value_cents recomputed"

      - from: REVIEWED
        to: APPROVED
        trigger: POST /hnw/appraisals/{id}/provision
        actor: Underwriter
        preconditions:
          - "Appraisal.status == REVIEWED"
          - "At least one prior Appraisal of the same property has status APPROVED or SUPERSEDED"
          - "max(prior approved or superseded Appraisal.dwelling_cost_cents) >= 1.25 * Appraisal.dwelling_cost_cents"
        side_effects:
          - "Appraisal.percent_complete = 1.00"
          - "Property.dwelling_replacement_cost_cents recomputed the same way"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: POST /hnw/appraisals/{id}/reject
        actor: Underwriter
        preconditions:
          - "Appraisal.status == PENDING_REVIEW"
        side_effects: []

      - from: REVIEWED
        to: REJECTED
        trigger: POST /hnw/appraisals/{id}/reject
        actor: Underwriter
        preconditions:
          - "Appraisal.status == REVIEWED"
        side_effects: []

      - from: APPROVED
        to: REVIEWED
        trigger: POST /hnw/properties/{id}/valuation/reappraise
        actor: Underwriter
        preconditions:
          - "The target Appraisal.status == APPROVED"
          - "No other Appraisal of the property is in state PENDING_REVIEW or REVIEWED"
        side_effects:
          - "Target Appraisal.status = REVIEWED and percent_complete reset to 0.00"
          - "Property.dwelling_replacement_cost_cents recomputed; Property.total_insured_value_cents recomputed"
        note: "The re-opened row is the second half of the review cycle: it is recycled through review/approve rather than replaced, so a provision may be re-derived from a superseded baseline."

      - from: REVIEWED
        to: SUPERSEDED
        trigger: POST /hnw/appraisals/{id}/supersede
        actor: Underwriter
        preconditions:
          - "Appraisal.valuation_method == DESKTOP_ESTIMATE or DRIVE_BY"
        side_effects:
          - "Appraisal.percent_complete = 1.00"
          - "Property.dwelling_replacement_cost_cents recomputed; Property.total_insured_value_cents recomputed"

      - from: REVIEWED
        to: WITHDRAWN
        trigger: POST /hnw/appraisals/{id}/withdraw
        actor: AgencyProducer
        preconditions:
          - "Appraisal.status == REVIEWED"
          - "No Enrollment of this property is in state APPROVED or ATTACHED"
        side_effects: []

  - entity: ScheduledItem
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /hnw/scheduled-items/{id}/approve
        actor: Underwriter
        preconditions:
          - "Referenced AppraisalDocument belongs to the same Property"
          - "AppraisalDocument.item_class matches ScheduledItem.item_type"
          - "AppraisalDocument.currency_status == CURRENT or AGING"
          - "AppraisalDocument.appraised_value_cents >= ScheduledItem.declared_value_cents"
          - "Aggregate: sum of declared_value_cents for this property's items in status APPROVED or ATTACHED, excluding this item, plus this item's declared_value_cents <= 0.60 * Property.total_insured_value_cents"
        side_effects:
          - "ScheduledItem.appraisal_currency_months recomputed from the logical clock"
          - "Property.scheduled_valuation_cents recomputed"
          - "Property.total_insured_value_cents recomputed"

      - from: PENDING
        to: REJECTED
        trigger: POST /hnw/scheduled-items/{id}/reject
        actor: Underwriter
        preconditions:
          - "ScheduledItem.status == PENDING"
        side_effects: []

      - from: APPROVED
        to: ATTACHED
        trigger: "system (automatic when the item's Property Enrollment reaches ATTACHED)"
        actor: system
        preconditions:
          - "ScheduledItem.status == APPROVED"
          - "The property's Enrollment.status == ATTACHED"
        side_effects:
          - "ScheduledItem.attached_value_cents = declared_value_cents"

      - from: APPROVED
        to: PENDING
        trigger: POST /hnw/scheduled-items/{id}/refresh-appraisal
        actor: AgencyProducer
        preconditions:
          - "ScheduledItem.appraisal_currency_months >= 24"
          - "A replacement AppraisalDocument of matching item_class exists with currency_status CURRENT or AGING"
        side_effects:
          - "ScheduledItem.appraisal_doc_id repointed to the replacement document"
          - "ScheduledItem.appraisal_currency_months recomputed"
          - "ScheduledItem.attached_value_cents = 0 while the row is no longer APPROVED"
          - "Property.scheduled_valuation_cents recomputed; Property.total_insured_value_cents recomputed"

      - from: APPROVED
        to: REJECTED
        trigger: POST /hnw/scheduled-items/{id}/reject
        actor: Underwriter
        preconditions:
          - "ScheduledItem.status == APPROVED"
          - "ScheduledItem.appraisal_currency_months >= 24"
        side_effects:
          - "Property.scheduled_valuation_cents recomputed; Property.total_insured_value_cents recomputed"
        note: "The re-work branch: a stale APPROVED item is thrown back to REJECTED rather than silently retained."

      - from: ATTACHED
        to: APPROVED
        trigger: POST /hnw/scheduled-items/{id}/detach
        actor: Underwriter
        preconditions:
          - "ScheduledItem.status == ATTACHED"
          - "The claim that triggered the detach has already been SETTLED, PAID or REJECTED"
        side_effects:
          - "ScheduledItem.attached_value_cents recomputed"
          - "Property.scheduled_valuation_cents recomputed; Property.total_insured_value_cents recomputed"

  - entity: RiskConsultation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /hnw/risk-consultations/{id}/complete
        actor: RiskConsultant
        preconditions:
          - "RiskConsultation.status == SCHEDULED"
          - "logical clock >= scheduled_for"
        side_effects:
          - "completed_at stamped"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /hnw/risk-consultations/{id}/cancel
        actor: AgencyProducer
        preconditions:
          - "RiskConsultation.status == SCHEDULED"
          - "logical clock < scheduled_for"
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (automatic when the logical clock passes scheduled_for by more than 7 days with no completion)"
        actor: system
        preconditions:
          - "RiskConsultation.status == SCHEDULED"
          - "logical clock > scheduled_for + 7 days"
        side_effects: []

      - from: COMPLETED
        to: SCHEDULED
        trigger: POST /hnw/risk-consultations/{id}/revisit
        actor: RiskConsultant
        preconditions:
          - "RiskConsultation.status == COMPLETED"
          - "RiskConsultation.report_issued_at is not null"
        side_effects:
          - "completed_at reset to null"
          - "report_issued_at reset to null"
        note: "A completed visit that produced a report is recycled into a fresh appointment; the regained state is SCHEDULED, not a terminal."

  - entity: WildfireDefenseDispatch
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: VENDOR_ASSIGNED
        trigger: POST /hnw/wildfire-events/vendors/poll
        actor: system
        preconditions:
          - "Dispatch.status == REQUESTED"
          - "RiskZone.state_event == ACTIVE"
        side_effects:
          - "vendor_ref set from the polled selection"
          - "assigned_at stamped"
          - "A dispatch in VENDOR_ASSIGNED or ON_SITE sets Property.defense_in_progress true, which is the sole input that grants replacement_provision GUARANTEED at the next approval"

      - from: VENDOR_ASSIGNED
        to: REQUESTED
        trigger: POST /hnw/wildfire-events/properties/{id}/dispatch-ack
        actor: AgencyProducer
        preconditions:
          - "Dispatch.status == VENDOR_ASSIGNED"
          - "The dispatch's risk zone still has state_event ACTIVE"
          - "RiskZone.concentration_band != CRITICAL"
          - "supplied vendor_ref matches the assigned vendor_ref for the property, or is null for a release"
        side_effects:
          - "vendor_ref cleared to null and assigned_at reset to null"
        note: "Vendor release is a directed edge back to REQUESTED, so the dispatch state machine is cyclic; a released dispatch is immediately re-selectable by the next vendor poll."

      - from: VENDOR_ASSIGNED
        to: CANCELLED
        trigger: "system (automatic when the dispatch's zone event drops below ACTIVE)"
        actor: system
        preconditions:
          - "RiskZone.state_event != ACTIVE"
        side_effects:
          - "Property.defense_in_progress recomputed to false"
          - "If the property had an Enrollment in APPROVED whose replacement_provision was GUARANTEED, the enrollment's guaranteed_replacement_limit_cents is recomputed to dwelling_replacement_cost_cents"

      - from: VENDOR_ASSIGNED
        to: ON_SITE
        trigger: POST /hnw/wildfire-events/dispatches/{dispatch_id}/advance
        actor: system
        preconditions:
          - "Dispatch.status == VENDOR_ASSIGNED"
        side_effects: []

      - from: ON_SITE
        to: COMPLETED
        trigger: POST /hnw/wildfire-events/dispatches/{dispatch_id}/advance
        actor: system
        preconditions:
          - "Dispatch.status == ON_SITE"
        side_effects:
          - "A MitigationRequirement with requirement_code DEFENSIBLE_SPACE, band_awarded CLEARED and source DEFENSE_FOLLOW_UP is auto-imposed with status IMPOSED"
          - "If the property is UNDERWRITABLE and no DEFENSIBLE_SPACE mitigation was CLEARED before, Property transitions UNDERWRITABLE -> MITIGATION_REQUIRED"
          - "If that new requirement is verified as CLEARED within 14 days, Property returns MITIGATION_REQUIRED -> UNDERWRITABLE"

      - from: REQUESTED
        to: CANCELLED
        trigger: POST /hnw/enrollments/{id}/decline
        actor: Underwriter
        preconditions:
          - "The dispatch's property has an Enrollment in state DRAFT or SUBMITTED"
          - "That Enrollment is being declined in the same request"
        side_effects:
          - "vendor_ref cleared; assigned_at reset to null"
          - "Property.defense_in_progress recomputed to false"
          - "RiskZone.concentration_ratio_pct recomputed by check_concentration, then concentration_band and freeze_active re-derived"
        note: "Triggered transitively by an Enrollment decline — the first hop of the enrollment-declined cascade."

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /hnw/enrollments/{id}/submit
        actor: AgencyProducer
        preconditions:
          - "Enrollment.agency_id equals the acting agency (X-User-ID must equal Enrollment.agency_id)"
          - "Agency.active == true"
          - "Property.posture != WRITE_FROZEN (ERR_WRITE_FROZEN)"
          - "Property.posture != REFERRAL_REQUIRED (ERR_POSTURE_REFERRAL_REQUIRED)"
        side_effects:
          - "Enrollment.status = SUBMITTED"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /hnw/enrollments/{id}/approve
        actor: Underwriter
        preconditions:
          - "Enrollment.status == SUBMITTED"
          - "Property.posture is WRITE_ELIGIBLE or REFERRAL_REQUIRED"
          - "Property.total_insured_value_cents >= 1.5 * Property.dwelling_replacement_cost_cents"
        side_effects:
          - "Enrollment.risk_score computed and snapshotted"
          - "Enrollment.risk_tier computed from risk_score"
          - "Enrollment.required_dwelling_coverage_cents computed"
          - "Enrollment.gross_premium_cents and extended_replacement_premium_cents computed"
          - "Enrollment.extended_replacement_limit_cents and guaranteed_replacement_limit_cents computed"
          - "Enrollment.replacement_provision snapshot written"
          - "Enrollment.valuation_fingerprint written"

      - from: SUBMITTED
        to: REFERRED
        trigger: POST /hnw/enrollments/{id}/refer
        actor: Underwriter
        preconditions:
          - "Enrollment.status == SUBMITTED"
          - "Property.posture == REFERRAL_REQUIRED or Property.posture == WRITE_ELIGIBLE"
        side_effects: []

      - from: SUBMITTED
        to: REFERRED
        trigger: "system (automatic when the property's posture becomes WRITE_FROZEN or the property's base_posture leaves UNDERWRITABLE)"
        actor: system
        preconditions:
          - "Property.posture == WRITE_FROZEN or Property.base_posture != UNDERWRITABLE"
        side_effects:
          - "Enrollment is parked: it may not be approved while the property is frozen, because the REFERRED -> APPROVED hop additionally requires Property.posture == REFERRAL_REQUIRED"
        note: "The second path into REFERRED. A zone freeze, an unresolved mitigation lapse or an appraisal currency failure parks every SUBMITTED enrollment of the property without any underwriter action."

      - from: REFERRED
        to: APPROVED
        trigger: POST /hnw/enrollments/{id}/approve
        actor: Underwriter
        preconditions:
          - "Enrollment.status == REFERRED"
          - "Property.posture == REFERRAL_REQUIRED"
          - "Property.base_posture == UNDERWRITABLE"
        side_effects:
          - "The same snapshot block as the SUBMITTED -> APPROVED transition"

      - from: REFERRED
        to: DRAFT
        trigger: POST /hnw/enrollments/{id}/return-to-draft
        actor: Underwriter
        preconditions:
          - "Enrollment.status == REFERRED"
        side_effects:
          - "Enrollment.risk_score reset to 0; risk_tier reset to MANAGED"
          - "Enrollment.required_dwelling_coverage_cents retained"

      - from: APPROVED
        to: SUBMITTED
        trigger: POST /hnw/enrollments/{id}/recall
        actor: AgencyProducer
        preconditions:
          - "Enrollment.status == APPROVED"
          - "Enrollment.agency_id equals the acting agency"
          - "Agency.concentration_band == CRITICAL and Agency.active == true"
        side_effects:
          - "Enrollment.risk_score reset to 0; risk_tier reset to MANAGED"
          - "Enrollment.replacement_provision reset to NONE"
          - "Enrollment.valuation_fingerprint cleared"
        note: "Recall pulls an approved-but-unbound enrollment back into the queue; the re-approval re-snapshots the score, so a recall after mitigation is verified produces a strictly lower score for identical coverage."

      - from: APPROVED
        to: ATTACHED
        trigger: POST /hnw/enrollments/{id}/attach
        actor: Underwriter
        preconditions:
          - "Enrollment.status == APPROVED"
          - "RiskZone.freeze_active == false (ERR_RISK_ZONE_FROZEN)"
          - "Enrollment.dwelling_coverage_cents >= Enrollment.required_dwelling_coverage_cents (ERR_COVERAGE_BELOW_REQUIRED)"
          - "Enrollment.valuation_fingerprint equals the property's current approved dwelling + contents + scheduled values (ERR_VALUATION_STALE)"
        side_effects:
          - "Property.dwelling_replacement_cost_cents re-read; required_dwelling_coverage_cents recomputed"
          - "Enrollment.stress_reserve_cents and committed_reserve_cents computed"
          - "bound_at stamped"
          - "Every ScheduledItem of this property in status APPROVED transitions to ATTACHED"
          - "increments Property.version by 1 — the attach writes the property's exposure ledger, so a later attach still holding the pre-attach version is stale"

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /hnw/enrollments/{id}/withdraw
        actor: AgencyProducer
        preconditions:
          - "Enrollment.status == DRAFT"
          - "Enrollment.agency_id equals the acting agency"
        side_effects:
          - "committed_reserve_cents recomputed to 0"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /hnw/enrollments/{id}/withdraw
        actor: AgencyProducer
        preconditions:
          - "Enrollment.status == SUBMITTED"
          - "Enrollment.agency_id equals the acting agency"
        side_effects:
          - "committed_reserve_cents recomputed to 0"

      - from: SUBMITTED
        to: DECLINED
        trigger: POST /hnw/enrollments/{id}/decline
        actor: Underwriter
        preconditions:
          - "Enrollment.status == SUBMITTED"
        side_effects:
          - "ENROLLMENT-DECLINED CASCADE (depth 4): (1) every WildfireDefenseDispatch of the property in state REQUESTED transitions to CANCELLED; (2) each dispatch just cancelled causes check_concentration to re-run across the whole book — the dispatch's own zone and every other zone have concentration_ratio_pct, concentration_band and freeze_active re-derived, because the portfolio denominator changed; (3) each RiskZone whose freeze_active flag changed causes every Property bound to that zone to have posture recomputed, flipping between WRITE_FROZEN and WRITE_ELIGIBLE; (4) every Property that becomes WRITE_FROZEN pushes its SUBMITTED enrollments to REFERRED, and every Property that becomes WRITE_ELIGIBLE releases its WRITE_FROZEN posture"
          - "Enrollment.committed_reserve_cents recomputed to 0"

      - from: DRAFT
        to: DECLINED
        trigger: POST /hnw/enrollments/{id}/decline
        actor: Underwriter
        preconditions:
          - "Enrollment.status == DRAFT"
        side_effects:
          - "ENROLLMENT-DECLINED CASCADE (depth 4), identical to the SUBMITTED -> DECLINED hop"
          - "Enrollment.committed_reserve_cents recomputed to 0"

      - from: REFERRED
        to: DECLINED
        trigger: POST /hnw/enrollments/{id}/decline
        actor: Underwriter
        preconditions:
          - "Enrollment.status == REFERRED"
        side_effects:
          - "ENROLLMENT-DECLINED CASCADE (depth 4), identical to the SUBMITTED -> DECLINED hop"
          - "Enrollment.committed_reserve_cents recomputed to 0"

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [PAID, DENIED, REJECTED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: POST /hnw/claims/{id}/review
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == REPORTED"
          - "The parent Enrollment.status == ATTACHED (ERR_ENROLLMENT_NOT_BOUND)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /hnw/claims/{id}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "Claim.adjuster_user_id is not null"
        side_effects:
          - "Claim.settlement_amount_cents computed and capped by the applicable limit"
          - "Claim.limit_applied_cents computed"
          - "Claim.cash_settlement_eligible computed"

      - from: APPROVED
        to: SETTLED
        trigger: POST /hnw/claims/{id}/settle
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == APPROVED"
          - "Claim.settlement_amount_cents > 0"
        side_effects:
          - "Claim.deductible_applied_cents computed"
          - "Every ScheduledItem of the property in status ATTACHED transitions to APPROVED with attached_value_cents 0"
          - "Property.scheduled_valuation_cents recomputed; Property.total_insured_value_cents recomputed"
        note: "The second hop of the settlement cascade: detaching a scheduled item is caused by the claim settlement, not by the original detach request."

      - from: SETTLED
        to: PAID
        trigger: POST /hnw/claims/{id}/pay
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SETTLED"
        side_effects: []

      - from: REPORTED
        to: DENIED
        trigger: POST /hnw/claims/{id}/deny
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == REPORTED or UNDER_REVIEW"
        side_effects: []

      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /hnw/claims/{id}/deny
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
        side_effects: []

      - from: REPORTED
        to: REJECTED
        trigger: "system (automatic when the parent Enrollment transitions to DECLINED)"
        actor: system
        preconditions:
          - "Claim.status is REPORTED or UNDER_REVIEW"
        side_effects:
          - "Claim.settlement_amount_cents reset to 0"
        note: "The third hop of the enrollment-declined cascade."

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (automatic when the parent Enrollment transitions to DECLINED)"
        actor: system
        preconditions:
          - "Claim.status == UNDER_REVIEW"
        side_effects:
          - "Claim.settlement_amount_cents reset to 0"

  - entity: NonRenewalNotice
    initial_state: PENDING
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: POST /hnw/non-renewal-notices/{id}/issue
        actor: Underwriter
        preconditions:
          - "NonRenewalNotice.status == PENDING"
          - "notice_period_days > 0"
          - "delay_exempt == true OR notice_period_days > required_notice_days (ERR_NOTICE_PERIOD_INSUFFICIENT)"
          - "The parent Enrollment.status == ATTACHED"
          - "Enrollment.bound_at is at least 60 days before issued_on (ERR_NOTICE_PERIOD_INSUFFICIENT)"
        side_effects:
          - "issued_on stamped"
          - "seal_at computed as issued_on + required_notice_days"
          - "Notice period evaluated strictly after seal_at"
          - "If ground == CONCENTRATION_REVIEW: Property.non_renewal_ground_activated is set true"

      - from: ISSUED
        to: EFFECTIVE
        trigger: "system (automatic when the logical clock passes effective_on)"
        actor: system
        preconditions:
          - "NonRenewalNotice.status == ISSUED"
          - "logical clock > effective_on"
          - "NonRenewalNotice.status was ISSUED before the clock crossed effective_on"
        side_effects:
          - "The parent Enrollment transitions ATTACHED -> DECLINED"
          - "Enrollment.committed_reserve_cents recomputed to 0"
          - "The zone concentration is re-evaluated by check_concentration"

      - from: PENDING
        to: RESCINDED
        trigger: POST /hnw/non-renewal-notices/{id}/rescind
        actor: Underwriter
        preconditions:
          - "NonRenewalNotice.status is PENDING or ISSUED"
          - "logical clock <= effective_on"
        side_effects:
          - "Property.non_renewal_ground_activated reset to false"

      - from: ISSUED
        to: RESCINDED
        trigger: POST /hnw/non-renewal-notices/{id}/rescind
        actor: Underwriter
        preconditions:
          - "NonRenewalNotice.status == ISSUED"
          - "logical clock <= effective_on"
        side_effects:
          - "Property.non_renewal_ground_activated reset to false"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================

concurrency_rules:
  - rule_id: attach-stale-property-version
    parent_entity: Property
    write_endpoint: "POST /hnw/enrollments/{id}/attach"
    occ_field: "expected_property_version"
    description: |
      Attaching an Enrollment against a Property whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just recorded an appraisal approval or a
      mitigation verification — both of which legitimately advance the
      property's valuation inputs and its version — so the client's view of the
      property valuation is stale and the requested coverage can no longer be
      checked against it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: attach-stale-property-version-second-path
    parent_entity: Property
    write_endpoint: "POST /hnw/properties/{id}/posture-eval"
    occ_field: "expected_property_version"
    description: |
      Re-running the posture evaluation against a Property whose version has
      advanced since the client last observed it is rejected. The evaluation
      itself legitimately advances the property (it stamps appraised_at and may
      auto-impose a mitigation requirement), so a second evaluation carrying a
      stale view of the property would re-derive a posture from superseded
      valuation inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: replacement_cost_valuation
    trigger: "POST /hnw/appraisals/{id}/approve, POST /hnw/appraisals/{id}/provision, POST /hnw/appraisals/{id}/supersede, POST /hnw/properties/{id}/valuation/reappraise, and the automatic base-appraisal currency lapse"
    algorithm: aggregation
    formula: |
      # Per-field, per-percent-complete accumulation. Evaluation order is pinned:
      #   1. compute each contributing Appraisal's percent_complete
      #   2. multiply PER APPRAISAL and round each product half-up to cents
      #   3. sum the rounded products
      # "round per appraisal then sum" and "sum then round" differ by cents on
      # a re-opened appraisal, so the order is fixed here.
      dwelling_replacement_cost_cents =
          SUM(round_half_up(a.dwelling_cost_cents * a.percent_complete) for a in contributions)
      contents_replacement_cost_cents =
          SUM(round_half_up(a.contents_cost_cents * a.percent_complete) for a in contributions)
      total_insured_value_cents =
          dwelling_replacement_cost_cents + contents_replacement_cost_cents + scheduled_valuation_cents
    input_set: "contributions = every Appraisal of the property with status IN {APPROVED, SUPERSEDED}. Appraisals in PENDING_REVIEW, REVIEWED, REJECTED or WITHDRAWN contribute nothing. scheduled_valuation_cents is the sum of attached_value_cents over the property's ScheduledItems in status IN {APPROVED, ATTACHED}. Loss-of-use coverage is NEVER included. When several contributions exist, the latest-effective contribution is the one with the greatest appraised_on, tie-broken by created_at ASC."
    constants:
      GUARANTEE_RATIO: 1.50
      EXTENDED_REPLACEMENT_FACTOR: 1.5
      BASE_APPRAISAL_CURRENCY_MONTHS: 24
    precision: "2 decimal places, round_half_up, applied per appraisal before summation"
    variants:
      - name: percent_complete_contribution
        when: "every appraisal row, including re-opened rows recycled from APPROVED back to REVIEWED"
        difference: "a row carries weight 1.00 while APPROVED or SUPERSEDED and 0.00 otherwise, so a re-opened appraisal stops contributing without being deleted"
      - name: base_appraisal_lapse
        when: "the logical clock passes 24 months from the latest approved SITE_MEASURED appraisal"
        difference: "the property reverts to PENDING_APPRAISAL and the dwelling component continues to be computed from the stale approved rows rather than being zeroed"

  - name: wildfire_risk_score
    trigger: POST /hnw/enrollments/{id}/approve
    algorithm: weighted_scoring
    two_variants_note: "See variants.gross_unmitigated and variants.net_scored below — the SAME inputs produce two legitimately different integers."
    formula: |
      # Pinned evaluation order: (1) zone severity, (2) agency concentration,
      # (3) mitigation credit floor, (4) clamp, (5) band.
      # Round ONCE, at the end.
      band_points = {STANDARD: 0, ELEVATED: 240, EXTREME: 420}[zone.exposure_band]
      mitigation_credit = {CLEARED: 420, PARTIAL: 250, FAILED: 60, UNVERIFIED: 0}[property.mitigation_band]
      mitigation_adjustment = max(0, band_points - mitigation_credit)
      agency_points = {NORMAL: 0, ELEVATED: 70, CRITICAL: 150}[agency.concentration_band]
      base = 300 + band_points + agency_points - mitigation_credit
      risk_score = clamp(base, 0, 999)
      risk_tier = REFER if risk_score >= 700 else (SURCHARGE if risk_score >= 450 else (REVIEW if risk_score >= 200 else MANAGED))
    input_set: "Property must have a resolved mitigation_band. zone.exposure_band is taken from the bound RiskZone; agency.concentration_band from the producing Agency. Only the bound risk_zone_id is read — an agency writing into a zone does not change the zone's own exposure band."
    constants:
      BASE_SCORE: 300
      MAX_SCORE: 999
      TIER_MANAGED_MAX: 199
      TIER_REVIEW_MIN: 200
      TIER_SURCHARGE_MIN: 450
      TIER_REFER_MIN: 700
      BAND_POINTS: { STANDARD: 0, ELEVATED: 240, EXTREME: 420 }
      MITIGATION_CREDIT: { CLEARED: 420, PARTIAL: 250, FAILED: 60, UNVERIFIED: 0 }
      AGENCY_POINTS: { NORMAL: 0, ELEVATED: 70, CRITICAL: 150 }
    precision: "integer, round_half_up, computed once"
    variants:
      - name: net_scored
        when: "the binding variant whenever the property has at least one VERIFIED mitigation whose band_awarded is CLEARED or PARTIAL"
        difference: "the mitigation_credit term is subtracted, so clearing a mitigation lowers the score by exactly the credit delta"
      - name: gross_unmitigated
        when: "an underwriting report requested with view=gross, the same property and coverage as net_scored"
        difference: "mitigation_credit is treated as 0 while band_points, agency_points and BASE_SCORE are unchanged, so the reported score is strictly greater than net_scored by exactly mitigation_credit"

  - name: concentration_ratio
    trigger: "POST /hnw/risk-zones/{id}/check_concentration and every Enrollment decline cascade"
    algorithm: aggregation
    formula: |
      # Population is pinned to ACTIVE Enrollments (a frozen snapshot) so the
      # ratio does not move as enrollments advance; it moves only when a new
      # ACTIVE row appears or one leaves ACTIVE.
      portfolio_active_count = COUNT(active_portfolio)
      if portfolio_active_count < MIN_PORTFOLIO_ACTIVE_COUNT:
          zone_concentration_ratio_pct = 0.0
          zone_concentration_band = NORMAL
      else:
          zone_concentration_ratio_pct =
              round_half_up(100 * SUM(P(e).total_insured_value_cents for e in active_zone)
                                / SUM(P(e).total_insured_value_cents for e in active_portfolio), 2)
          zone_concentration_band = CRITICAL if pct >= 30.0 else (ELEVATED if pct >= 18.0 else NORMAL)
      freeze_active = (zone_concentration_band == CRITICAL and portfolio_active_count >= MIN_PORTFOLIO_ACTIVE_COUNT)
      agency_concentration_ratio_pct =
          round_half_up(100 * SUM(P(e).total_insured_value_cents for e in active_zone_and_agency)
                            / SUM(P(e).total_insured_value_cents for e in active_zone), 2)
      agency_concentration_band = CRITICAL if pct >= 25.0 else (ELEVATED if pct >= 15.0 else NORMAL)
    input_set: "active_zone = Enrollments with status IN {SUBMITTED, REFERRED, APPROVED, ATTACHED} whose risk_zone_id is the zone. active_portfolio = all such Enrollments. active_zone_and_agency additionally filters agency_id. Terminal enrollments (DECLINED, WITHDRAWN) are excluded. P(e) is the Property named by e.property_id; the summand is that property's total_insured_value_cents, computed unrounded, and the percentage is rounded exactly once."
    constants:
      BAND_ELEVATED_PCT: 18.0
      BAND_CRITICAL_PCT: 30.0
      MIN_PORTFOLIO_ACTIVE_COUNT: 2
      AGENCY_ELEVATED_PCT: 15.0
      AGENCY_CRITICAL_PCT: 25.0
    precision: "2 decimal places, round_half_up, computed once on the ratio"
    variants:
      - name: below_population_minimum
        when: "fewer than 2 ACTIVE enrollments exist in the whole portfolio"
        difference: "the ratio is pinned to 0.0, the band to NORMAL and the freeze flag to false even though a single ACTIVE enrollment is by construction 100 percent of the book"
      - name: zone_scope
        when: "the numerator is the zone's ACTIVE exposure"
        difference: "drives RiskZone.concentration_band and the population freeze"
      - name: agency_scope
        when: "the numerator is the zone x agency intersection"
        difference: "drives Agency.concentration_band only; a CRITICAL agency band never freezes a zone and never gate-blocks attachment, it only ranks (see defense_dispatch_priority)"

  - name: extended_replacement_provision
    trigger: "POST /hnw/enrollments/{id}/approve and again at POST /hnw/enrollments/{id}/attach (the provision is re-evaluated so a defence window that opened after approval is honoured)"
    algorithm: threshold
    formula: |
      # Extended: only when a CLEARED valuation-grade mitigation exists.
      # Guaranteed: only the defence-in-progress exemption qualifies.
      extended_replacement_limit_cents = round_half_up(1.5 * dwelling_replacement_cost_cents)
      if property.mitigation_band == "CLEARED" and dispatch_in_progress == false:
          replacement_provision = "EXTENDED"
          guaranteed_replacement_limit_cents = round_half_up(dwelling_replacement_cost_cents / 1.5)
      elif dispatch_in_progress == true:
          replacement_provision = "GUARANTEED"
          guaranteed_replacement_limit_cents = null            # unlimited
      else:
          replacement_provision = "NONE"
          guaranteed_replacement_limit_cents = dwelling_replacement_cost_cents
    input_set: "dwelling_replacement_cost_cents is the current-percent-complete appraised value. dispatch_in_progress is true exactly while a WildfireDefenseDispatch of the property is in state VENDOR_ASSIGNED or ON_SITE. The EXTENDED branch is tested FIRST; a property that is both design-cleared and under active defence takes EXTENDED, never the larger GUARANTEED grant."
    constants:
      EXTENDED_REPLACEMENT_FACTOR: 1.5
      GUARANTEE_RATIO: 1.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: extended_active
        when: "mitigation_band == CLEARED and no defence dispatch is in VENDOR_ASSIGNED or ON_SITE"
        difference: "limit is 1.5x dwelling replacement cost and guaranteed_replacement_limit_cents is only 0.667x it"
      - name: guaranteed_active
        when: "any defence dispatch is in VENDOR_ASSIGNED or ON_SITE"
        difference: "radically larger grant — guaranteed_replacement_limit_cents is null (unlimited) and extended_replacement_limit_cents is not the applicable cap"

  - name: extended_replacement_premium
    trigger: "POST /hnw/enrollments/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiers keyed on the GUARANTEE RATIO, not on the coverage amount.
      ratio = round_half_up(dwelling_coverage_cents / dwelling_replacement_cost_cents, 4)
      base_rate = round_half_up(0.0021 * dwelling_coverage_cents)
      premium = round_half_up(base_rate * ratio)
      # The floor is applied AFTER the multiplication, never inside it.
      extended_replacement_premium_cents = max(premium, 12500)
      gross_premium_cents = extended_replacement_premium_cents + contents_coverage_premium_cents
      contents_coverage_premium_cents = round_half_up(0.0009 * contents_coverage_cents)
    input_set: "dwelling_replacement_cost_cents is current-percent-complete. dwelling_coverage_cents is the client-requested Coverage A limit. The ratio is computed before any rounding of the premium, and the floor is a final clamp so the two step points are ratio 1.50 (multiplier 1.0000) and the premium floor."
    constants:
      RATIO_FACTOR_1_00: 1.0000
      RATIO_FACTOR_1_25: 1.2500
      RATIO_FACTOR_1_50: 1.5000
      RATIO_FACTOR_OVER_1_50: 1.5000
      BASE_RATE: 0.0021
      CONTENTS_RATE: 0.0009
      MIN_EXTENDED_PREMIUM_CENTS: 12500
    precision: "2 decimal places, round_half_up, per step"
    variants:
      - name: ratio_edge_rounding
        when: "the requested coverage ratio lands exactly on 1.2500 or 1.5000"
        difference: "the ratio is rounded to 4 places once, before the rate multiplication; a ratio of 1.24999 uses the 1.0000 factor while 1.25000 uses 1.2500"

  - name: cash_settlement_valuation
    trigger: POST /hnw/claims/{id}/approve
    algorithm: threshold
    formula: |
      # Deductible is a percentage of Coverage A, computed FIRST, then applied
      # to the loss and capped BY the loss.
      pct = {WILDFIRE: 0.02, WIND: 0.01, HALL: 0.01, WATER: 0.005, THEFT: 0.005, OTHER: 0.005}[cause_of_loss]
      raw_deductible = round_half_up(pct * enrollment.dwelling_coverage_cents)
      if enrollment.replacement_provision == "GUARANTEED":
          limit = null                    # unlimited — the defence window overrides every mitigation state
      elif enrollment.replacement_provision == "EXTENDED":
          limit = enrollment.extended_replacement_limit_cents
      else:
          limit = enrollment.dwelling_coverage_cents
      scarcity = 1.20 if claim.adjuster_override else 1.0
      # Cap BEFORE the scarcity factor; the scarcity factor is an adjuster
      # override for specialty restoration vendors, not a limit extension.
      capped = min(claim.reported_indemnity_cents, limit) if limit is not null else claim.reported_indemnity_cents
      settlement_amount_cents = round_half_up(capped * scarcity)
      deductible_applied_cents = min(raw_deductible, settlement_amount_cents)
      cash_settlement_eligible = (enrollment.replacement_provision == "GUARANTEED")
    input_set: "Enrollment must be ATTACHED. reported_indemnity_cents is the claimed replacement cost. adjuster_override is set by the assigned ClaimsAdjuster when a specialty restoration vendor is required. A settlement in which settlement_amount_cents would equal deductible_applied_cents is still recorded — the line is drawn strictly below, i.e. settlement_amount_cents > deductible_applied_cents for a payout."
    constants:
      DEDUCTIBLE_PCT_WILDFIRE: 0.02
      DEDUCTIBLE_PCT_WIND: 0.01
      DEDUCTIBLE_PCT_HALL: 0.01
      DEDUCTIBLE_PCT_WATER: 0.005
      DEDUCTIBLE_PCT_THEFT: 0.005
      SCARCITY_FACTOR: 1.20
    precision: "2 decimal places, round_half_up"
    variants:
      - name: guaranteed_settlement
        when: "enrollment.replacement_provision == GUARANTEED"
        difference: "the loss is uncapped (COVERAGE_ABOVE_APPRAISAL does not fire) and cash_settlement_eligible is true"
      - name: extended_settlement
        when: "enrollment.replacement_provision == EXTENDED"
        difference: "the loss over Coverage A is payable up to extended_replacement_limit_cents; the excess over that limit is refused while the excess over Coverage A alone is not"

  - name: defense_dispatch_priority
    trigger: POST /hnw/wildfire-events/properties/{id}/dispatch-request and POST /hnw/wildfire-events/vendors/poll
    algorithm: weighted_scoring
    formula: |
      # priority_rank: LOWER is dispatched first.
      rank = zone_rank * 1000000 + expiring_rank * 1000 + age_days
      zone_rank = 1 if property.mitigation_band in {PARTIAL, UNVERIFIED} else 2
      expiring_rank = 0 if property has any MitigationRequirement IMPOSED with due_on <= logical_clock + 14 days else 1
      age_days = whole days from property.created_at to the logical clock
      # Selection over the REQUESTED pool for the zone, ordered by:
      #   (1) zone_rank ASC   (2) expiring_rank ASC   (3) age_days DESC
      #   (4) created_at ASC  (5) property.id never participates
      # Dispatch exactly one assignment per poll.
    input_set: "Candidate pool = WildfireDefenseDispatch rows with status == REQUESTED whose RiskZone.state_event == ACTIVE, in the zone being polled, and whose zone does not already hold 2 or more assignments occupying [assigned_at, assigned_at + 24 hours). A property with mitigation_band CLEARED is eligible but ranked last within its zone; it is never excluded outright. When the pool is empty the poll returns ERR_NO_ELIGIBLE_VENDOR."
    constants:
      ZONE_RANK_CLEARED: 2
      ZONE_RANK_UNMITIGATED: 1
      EXPIRING_WINDOW_DAYS: 14
      ZONE_RANK_SCALE: 1000000
      EXPIRING_RANK_SCALE: 1000
    precision: "integer rank; age_days is a whole-day floor"
    variants:
      - name: rank_ordering
        when: "ordering the candidate pool within one zone"
        difference: "zone_rank dominates, so an unmitigated property in the zone always outranks a CLEARED one regardless of age"
      - name: tie_break
        when: "two candidates share zone_rank, expiring_rank and age_days"
        difference: "created_at ASC decides; the UUID id is never consulted"

  - name: notice_period_days
    trigger: POST /hnw/non-renewal-notices/{id}/issue and the automatic ISSUED -> EFFECTIVE transition
    algorithm: interval_merge
    formula: |
      notice_period_days = whole_days_between(issued_on, effective_on)   # exclusive of issued_on, inclusive of effective_on
      required_notice_days = 90 if zone.concentration_band == CRITICAL else (60 if zone.concentration_band == ELEVATED else 45)
      delay_exempt = (ground == "CONCENTRATION_REVIEW" and zone.concentration_band == "CRITICAL")
      seal_at = issued_on + required_notice_days days
      # STRICTLY-AFTER rule: a notice is sufficient iff notice_period_days > required_notice_days.
      # Effective date exactly at seal_at is INSUFFICIENT. Statement-date starts the clock with
      # exclusive counting and the effective date ends it with inclusive counting.
    input_set: "issued_on is stamped from the logical clock. required_notice_days is read from the zone's band at issue time and re-read at the EFFECTIVE transition, so a zone that downgrades out of CRITICAL between issue and effect lengthens the effective requirement from 90 to 60 days."
    constants:
      NOTICE_DAYS_NORMAL: 45
      NOTICE_DAYS_ELEVATED: 60
      NOTICE_DAYS_CRITICAL: 90
      MIN_POLICY_AGE_DAYS: 60
    precision: "whole days, no rounding"
    variants:
      - name: exempt
        when: "ground == CONCENTRATION_REVIEW and zone band is CRITICAL"
        difference: "delay_exempt is true, so the required_notice_days test is skipped entirely and only the 60-day minimum policy age is enforced"
      - name: standard
        when: "any other ground, or a zone band below CRITICAL"
        difference: "the strictly-greater-than test is enforced against 45, 60 or 90 days depending on the band"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /hnw/_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the role in X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "every resource id in the path resolves, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_safety
    check: "Property.posture must not be WRITE_FROZEN for any operation that writes an Enrollment"
    error_id: ERR_WRITE_FROZEN
    http_status: 409
    applies_to: ["POST /hnw/enrollments/{id}/submit", "POST /hnw/enrollments/{id}/attach"]

  - priority: 5
    category: business_safety
    check: "RiskZone.freeze_active must be false when an Enrollment is attached"
    error_id: ERR_RISK_ZONE_FROZEN
    http_status: 409
    applies_to: ["POST /hnw/enrollments/{id}/attach"]

  - priority: 6
    category: business_safety
    check: "Property.posture must be WRITE_ELIGIBLE at submit time; REFERRAL_REQUIRED is a distinct refusal"
    error_id: ERR_POSTURE_REFERRAL_REQUIRED
    http_status: 409
    applies_to: ["POST /hnw/enrollments/{id}/submit"]

  - priority: 7
    category: business_referential
    check: "the acting agency in X-User-ID must equal Enrollment.agency_id for producer-scoped writes"
    error_id: ERR_AGENCY_NOT_OF_RECORD
    http_status: 403
    applies_to: ["POST /hnw/enrollments/{id}/submit", "POST /hnw/enrollments/{id}/recall", "POST /hnw/enrollments/{id}/withdraw"]

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: state
    check: "the OCC guard expected_property_version must equal the parent Property.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /hnw/enrollments/{id}/attach", "POST /hnw/properties/{id}/posture-eval"]

  - priority: 10
    category: business_temporal
    check: "a NonRenewalNotice must clear both the notice-period test (strictly greater than required_notice_days) and the 60-day minimum policy age"
    error_id: ERR_NOTICE_PERIOD_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /hnw/non-renewal-notices/{id}/issue"]

  - priority: 11
    category: business_temporal
    check: "MitigationRequirement.due_on must not have passed at verification time"
    error_id: ERR_MITIGATION_LAPSED
    http_status: 422
    applies_to: ["POST /hnw/mitigation-requirements/{id}/verify"]

  - priority: 12
    category: business_constraint
    check: "aggregate scheduled personal property value must not exceed 60 percent of Property.total_insured_value_cents"
    error_id: ERR_SCHEDULED_VALUE_CAP
    http_status: 422
    applies_to: ["POST /hnw/scheduled-items/{id}/approve"]

  - priority: 13
    category: business_constraint
    check: "the claim's reported indemnity must not exceed the applicable replacement-cost limit"
    error_id: ERR_COVERAGE_ABOVE_APPRAISAL
    http_status: 422
    applies_to: ["POST /hnw/claims/{id}/approve"]

  - priority: 14
    category: business_constraint
    check: "Enrollment.dwelling_coverage_cents must be at least Enrollment.required_dwelling_coverage_cents"
    error_id: ERR_COVERAGE_BELOW_REQUIRED
    http_status: 422
    applies_to: ["POST /hnw/enrollments/{id}/attach"]

  - priority: 15
    category: business_fiscal
    check: "the non-renewal ground must be consistent with the property's state: a MITIGATION_FAILURE ground is refused unless the property's mitigation_band is FAILED, an APPRAISAL_LAPSE ground is refused unless no approved appraisal remains current, and a CONCENTRATION_REVIEW ground is refused unless the zone band is CRITICAL"
    error_id: ERR_GROUND_NOT_ACTIONABLE
    http_status: 422
    applies_to: ["POST /hnw/non-renewal-notices/{id}/issue"]

  - priority: 16
    category: business_fiscal
    check: "Enrollment.valuation_fingerprint must equal the property's current approved dwelling + contents + scheduled values"
    error_id: ERR_VALUATION_STALE
    http_status: 422
    applies_to: ["POST /hnw/enrollments/{id}/attach"]

  - priority: 17
    category: business_referential
    check: "an AppraisalDocument substantiating a ScheduledItem must belong to the same Property and match the item class"
    error_id: ERR_APPRAISAL_DOC_MISMATCH
    http_status: 422
    applies_to: ["POST /hnw/scheduled-items/{id}/approve"]

  - priority: 18
    category: business_referential
    check: "an AppraisalDocument must not substantiate a ScheduledItem whose declared_value_cents exceeds the document's appraised_value_cents"
    error_id: ERR_APPRAISAL_CURRENCY_EXPIRED
    http_status: 422
    applies_to: ["POST /hnw/scheduled-items/{id}/approve", "POST /hnw/scheduled-items/{id}/refresh-appraisal"]

  - priority: 19
    category: business_constraint
    check: "the acting agency must be active to produce or recall business"
    error_id: ERR_AGENCY_INACTIVE
    http_status: 409
    applies_to: ["POST /hnw/enrollments/{id}/submit", "POST /hnw/enrollments/{id}/recall"]

  - priority: 20
    category: business_constraint
    check: "the parent Enrollment must be ATTACHED before a Claim may be reviewed"
    error_id: ERR_ENROLLMENT_NOT_BOUND
    http_status: 409
    applies_to: ["POST /hnw/claims/{id}/review"]

  - priority: 21
    category: business_temporal
    check: "a consultation booking on a half-open [scheduled_for, scheduled_for + duration_minutes) interval must not overlap another non-CANCELLED consultation of the same consultant; an appointment starting exactly at the previous one's end is adjacent, not overlapping, and is allowed"
    error_id: ERR_CONSULTATION_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /hnw/properties/{id}/risk-consultations"]

  - priority: 22
    category: business_temporal
    check: "a zone may hold at most two dispatches whose 24-hour occupancy windows overlap; a vendor poll that would create a third overlapping assignment is refused"
    error_id: ERR_ZONE_DISPATCH_CAPACITY
    http_status: 422
    applies_to: ["POST /hnw/wildfire-events/vendors/poll"]

  - priority: 23
    category: business_fiscal
    check: "a reopen is refused when the branch's mitigated_loss_multiplier exceeds 1.00"
    error_id: ERR_BRANCH_CAPITAL_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /hnw/properties/{id}/reopen"]

  - priority: 24
    category: business_fiscal
    check: "a claim tapped with reported_indemnity_cents strictly above the deductible for its cause of loss is admissible; at or below the deductible it is refused"
    error_id: ERR_CLAIM_BELOW_DEDUCTIBLE
    http_status: 422
    applies_to: ["POST /hnw/claims/{id}/approve"]

  - priority: 25
    category: business_constraint
    check: "an endorsement whose required provision conflicts with the enrollment's snapshotted replacement provision is refused"
    error_id: ERR_INCOMPATIBLE_ENDORSEMENT
    http_status: 422
    applies_to: ["POST /hnw/enrollments/{id}/endorsements"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:

  - method: POST
    path: "/hnw/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is 2026-09-01T00:00:00Z and the clock NEVER falls back to real wall-clock time, so every currency, notice, lapse and dispatch-age rule is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["recomputes every clock-derived field on read (AppraisalDocument.currency_months, ScheduledItem.appraisal_currency_months, NonRenewalNotice.notice_period_days) and fires every automatic date-driven transition whose threshold the clock has crossed"]

  - method: POST
    path: "/hnw/risk-zones"
    description: "Register a catastrophe risk zone"
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, state_code, wildland_urban_interface_band, sustained_wind_mph, mitigation_band_multiplier, "mitigated_loss_multiplier?", exposure_band, "state_event?"]
    output: RiskZone
    side_effects: []

  - method: GET
    path: "/hnw/risk-zones"
    description: "List risk zones with optional filters"
    roles: [Underwriter, AgencyProducer, ClaimsAdjuster, RiskConsultant, PlatformAdmin]
    code: 200
    input: ["zone_code?", "state_code?", "concentration_band?", "limit?", "offset?"]
    output: RiskZone[]
    side_effects: []

  - method: GET
    path: "/hnw/risk-zones/{id}"
    description: "Read one risk zone including derived concentration fields"
    roles: [Underwriter, AgencyProducer, ClaimsAdjuster, RiskConsultant, PlatformAdmin]
    code: 200
    input: []
    output: RiskZone
    side_effects: []

  - method: POST
    path: "/hnw/risk-zones/{id}/check_concentration"
    description: "Recompute the zone and agency concentration ratios and re-derive the bands and freeze flag"
    roles: [Underwriter]
    code: 200
    input: []
    output: RiskZone
    side_effects: ["RiskZone.concentration_ratio_pct and concentration_band recomputed", "RiskZone.freeze_active re-derived from concentration_band", "Agency.concentration_ratio_pct and concentration_band recomputed for every agency with exposure in the zone", "every Property bound to a zone whose freeze_active flag changed has posture recomputed", "every Property that becomes WRITE_FROZEN pushes its SUBMITTED enrollments to REFERRED"]

  - method: POST
    path: "/hnw/risk-zones/{id}/set-event"
    description: "Set the zone wildfire event level; dropping below ACTIVE cancels outstanding defence assignments"
    roles: [Underwriter]
    code: 200
