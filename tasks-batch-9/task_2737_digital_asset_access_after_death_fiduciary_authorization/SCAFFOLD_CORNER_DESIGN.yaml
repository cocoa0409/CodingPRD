            - "${court_state} == REVOKED with revocation_reason stored and verified_at still null"
            - "${e_verify_revoked} == ERR_INVALID_DOCUMENT_STATE with HTTP 409"
            - "${e_revoke_twice} == ERR_INVALID_DOCUMENT_STATE with HTTP 409"
