              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/refer-expulsion", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", hearing_officer_id: "ho_1", scheduled_start: "2026-05-08T10:00:00Z", scheduled_end: "2026-05-08T12:00:00Z" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { h_id: $.data.id }
            - call: "POST /hearings/${h_id}/evidence"
              payload: { item_type: "DOCUMENT", description: "Incident report" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { ev_id: $.data.id }
            - { call: "POST /evidence-items/${ev_id}/rule", payload: { ruling: "ADMITTED" }, as: HearingOfficer, as_user_id: "ho_1" }
            - { call: "POST /hearings/${h_id}/serve-packet", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T12:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /hearings/${h_id}/convene", payload: {}, as: HearingOfficer, as_user_id: "ho_1" }
          trigger:
            - { call: "POST /hearings/${h_id}/decision", payload: { outcome: "EXPULSION_ORDERED", rationale: "preponderance of evidence" }, as: HearingOfficer, as_user_id: "ho_1" }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_status_after: $.data.status }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { enroll_after: $.data.enrollment_status }
          assert:
            - "ExpulsionHearing.status == EXPULSION_ORDERED (trigger)"
            - "DisciplineCase.status == EXPULSION_ACTIVE (link 1: hearing decision -> case), got ${case_status_after}"
            - "Student.enrollment_status == ALT_ED_PENDING (link 2: case mutation -> student), got ${enroll_after}"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: {state, business_temporal} on
  # appeals vs {business_safety, business_constraint} on placements.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_on_closed_case_state_beats_deadline
        grounds:
          - "validations[priority=8]"
          - "validations[priority=10]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_APPEAL_WINDOW_CLOSED]"
        distinguishing_aspect: |
          Error-category pair = state (case CLOSED) vs business_temporal
          (appeal window long past). Priority 8 state beats priority 10
          temporal, so the dual-failure returns ERR_INVALID_STATE, not
          ERR_APPEAL_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Student NONE, guardian g5; offense DISR-01 band occ1 [1,3]"
            - "Case fully closed: classified, sanctioned 2 days, notice 2026-05-04T09:00Z, confirmed at 2026-05-11T00:00Z (cumulative 2), closed at 2026-05-13T00:00Z"
            - "Clock at 2026-06-20T00:00:00Z — far past the appeal deadline 2026-05-09T09:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Prio", date_of_birth: "2009-09-01T00:00:00Z", grade_level: 10, demographic_group: "WHITE", guardian_id: "g5" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${case_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${case_id}/close", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - call: "POST /cases/${case_id}/appeals"
              payload: { grounds: "very late appeal" }
              as: ParentGuardian
              as_user_id: "g5"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409): the state precondition (case CLOSED, priority 8) wins over the temporal failure (window closed, priority 10)"
            - "no Appeal row is created: GET /cases/${case_id}/appeals returns an empty list"

      - name: placement_mdr_safety_beats_capacity_constraint
        grounds:
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "errors[ERR_MDR_INCOMPLETE]"
          - "errors[ERR_SITE_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Error-category pair = business_safety (IDEA MDR gate) vs
          business_constraint (site capacity) — disjoint from the
          state-vs-temporal pair. Priority 9 safety beats priority 11
          constraint, so the dual-failure returns ERR_MDR_INCOMPLETE, not
          ERR_SITE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "AltEdSite S with capacity 1"
            - "Student X (disability NONE) expelled; placement PX at S covering [2026-05-11, 2026-05-29] (occupies the only seat over that window)"
            - "Student Y (disability IEP) expelled via a second case; NO manifestation determination exists for Y's case (manual MDR never opened)"
