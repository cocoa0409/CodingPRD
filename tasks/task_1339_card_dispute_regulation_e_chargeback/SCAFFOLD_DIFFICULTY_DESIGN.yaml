              captures: { err2: $.data.error_id }
          assert:
            - "st1 == REVERSAL_PENDING (resolve at exactly the inclusive deadline succeeds)"
            - "err2 == ERR_INVESTIGATION_WINDOW_EXPIRED (one second past the deadline fails)"
      - name: representment_empty_evidence_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_EVIDENCE_REQUIRED]
          - entities.Representment.fields.evidence_documents
        distinguishing_aspect: |
          Collection-cardinality metric on POST /chargebacks/{id}/representments
          (different metric and endpoint than instance 1): an empty
          evidence_documents array (0 documents) is rejected while exactly 1
          document succeeds.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 12000 posted 2026-07-01; non-fraud dispute classified; chargeback FILED 2026-08-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
