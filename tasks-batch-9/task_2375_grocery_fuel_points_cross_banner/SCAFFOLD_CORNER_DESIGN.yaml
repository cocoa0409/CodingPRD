            - "the 100-point call returned HTTP 201 with ${min_ok_cents} == 10"
            - "FuelRedemption.${min_ok_id}.points_debited_at_auth == 100 and Member.${cm_id}.available_points == 200"

      - name: insufficient_points_is_measured_against_the_computed_debit
        claim_type: Violation → Error
        grounds:
