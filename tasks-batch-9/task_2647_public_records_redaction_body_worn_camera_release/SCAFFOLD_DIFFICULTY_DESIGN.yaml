            - "ResponsiveRecord.${rec_id}.inclusion_status == RESPONSIVE (a PARTIAL_REDACT sustain never withholds the record) and release_posture == RESTRICTED"
            - "ResponsiveRecord.${rec_id}.adjudicated_burden_minutes == 10 == baseline 4 (ceil(15 * 0.25)) + PERSONAL_PRIVACY 6 (ceil(15 * 0.40))"
            - "AFTER adjudication the identical PASS returns HTTP 200: RedactionTask.${task_id}.status == APPROVED with approved_labor_minutes == 6"
            - "ResponsiveRecord.${rec_id}.approved_labor_minutes == 6 and PublicRecordsRequest.${req_id}.billable_labor_minutes == 6"
            - "StaffMember.${reviewer_id}.open_qa_assignment_count == 0"
            - "PublicRecordsRequest.${req_id}.processing_status == RELEASE_READY (every task is now terminal and one RESPONSIVE record remains)"
      - name: responsive_ruling_requires_request_past_intake
        grounds:
          - state_machines.ResponsiveRecord.CANDIDATE_to_RESPONSIVE
          - state_machines.PublicRecordsRequest.processing_status.INTAKE_to_SCOPING
          - errors[ERR_REQUEST_STATE_INVALID]
          - endpoints[POST /records/responsive-records/{id}/inclusion]
        distinguishing_aspect: |
          A DIFFERENT entity pair from qa_pass_requires_sustained_exemption_claim:
          ResponsiveRecord -> PublicRecordsRequest. A record may not be ruled RESPONSIVE while
          its parent request is still in INTAKE; the mandatory scope clarification that moves the
          request INTAKE -> SCOPING is what unlocks the identical inclusion call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ROUTINE VideoAsset, incident INC-2026-0514, duration_ms 600000 (10 min); one MEDIA Requester."
            - "One PublicRecordsRequest left in processing_status INTAKE - NO scope clarification has been filed yet."
            - "One ResponsiveRecord attached to that request in inclusion_status CANDIDATE (attaching a candidate is legal at INTAKE; only the RESPONSIVE ruling is gated)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
