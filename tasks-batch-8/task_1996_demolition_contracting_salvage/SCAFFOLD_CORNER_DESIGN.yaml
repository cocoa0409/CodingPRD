            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "dl-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "dl-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "dl-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "dl-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "dl-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "dl-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "48 Pine St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-1", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 10.0 }, as: HaulingDispatcher, captures: { tk1: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk1}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-2", facility_type: "LANDFILL", material_class: "WOOD", gross_tons: 8.0 }, as: HaulingDispatcher, captures: { tk2: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk2}/transition", payload: { action: "RECEIVE", diverted_tons: 3.0 }, as: HaulingDispatcher }
          trigger:
            - { call: "POST /demolition/debris-tickets/${tk1}/transition", payload: { action: "RECONCILE", corrected_gross_tons: 12.5, corrected_diverted_tons: 4.0 }, as: HaulingDispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/debris-tickets/${tk2}/transition", payload: { action: "RECONCILE", corrected_gross_tons: 10.0, corrected_diverted_tons: 3.0 }, as: HaulingDispatcher, captures: { st2: $.data.status, g2: $.data.gross_tons } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { lf: $.data.landfill_tons, dv: $.data.diverted_tons } }
          assert:
            - "delta 2.5 > 2.0: ${err} == ERR_RECONCILE_DELTA_EXCEEDED (ticket 1 stays RECEIVED, gross unchanged 10.0)"
            - "delta exactly 2.0 <= cap: ${st2} == RECONCILED and ${g2} == 10.0"
            - "counters after accepted reconcile: ${lf} == 13.0 (6.0 + (10.0-3.0)) and ${dv} == 7.0"

      - name: provisional_coverage_constant_applied_at_approve
        claim_type: correct_result
        grounds: [calculations.erosion_coverage]
        excluded_because:
          difficulty_instance: "dual_variant_calc / erosion_provisional_vs_final_divergence"
          rationale: "provisional_coverage_ratio == 0.95 at APPROVE is asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role fails with ERR_UNAUTHENTICATED (401) before any role/existence logic."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /demolition/projects", payload: { name: "NoAuth", address: "50 Pine St", lot_area_sqft: 12000 }, as: "", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: release_with_zero_notifications_returns_incomplete
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NOTIFICATIONS_INCOMPLETE]"]
        distinguishing_aspect: "Empty-set boundary: with every safety prerequisite satisfied but ZERO notifications ever created, release fails ERR_NOTIFICATIONS_INCOMPLETE (the >= 1 clause, not the 72h window clause)."
