  - rule_id: boundary_precision_check
    instances:

      - name: bench_l1_escalation_at_exact_threshold_day
        grounds:
          - calculations.bench_aging_escalation
          - state_machines.BenchSpell.MONITORING_to_ESCALATED_L1
          - entities.BenchSpell.fields.age_days
          - entities.BenchSpell.fields.escalation_count
          - endpoints[POST /bench-runs]
        distinguishing_aspect: |
          Boundary on the AGE_DAYS metric at POST /bench-runs: a bench-run on day 13 leaves the
          spell in MONITORING and a bench-run on day 14 escalates it, pinning the threshold
          comparison as inclusive `>=` rather than `>`.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group with default level_targets, so the CONSULTANT L1 threshold is 14 days and L2 is 30."
            - "One CONSULTANT-level consultant, never staffed, whose creation opened BenchSpell #1 in MONITORING with started_on 2026-08-03 and age_reset_on null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
          assert:
            - "after the 2026-08-16 bench-run: GET /bench-spells?consultant_id=${c1_id} returns 1 row with state == MONITORING, age_days == 13, escalation_count == 0"
            - "after the 2026-08-17 bench-run: the same row has state == ESCALATED_L1, age_days == 14, escalation_count == 1"
            - "the escalation happened on the threshold day itself, not the day after: age_days == 14 == the CONSULTANT bench_escalation_l1_days"
            - "state != ESCALATED_L2 after the second run — a single bench-run advances at most one rung"
            - "PracticeGroup.${pg_id}.escalated_l2_count == 0 and posture == FROZEN (own_bench_ratio 1.0000 on a single benched head, the ratio arm not the L2 arm)"

      - name: allocation_sum_exactly_100_confirms_then_next_percent_rejected
        grounds:
          - validations[priority=32]
          - errors[ERR_ALLOCATION_CAPACITY_EXCEEDED]
          - calculations.consultant_availability
          - entities.Consultant.fields.allocated_pct
          - endpoints[POST /assignments/{id}/confirm]
        distinguishing_aspect: |
          Boundary on the ALLOCATION-PERCENTAGE metric at POST /assignments/{id}/confirm:
          60.00 + 40.00 == 100.00 confirms, and the very next 1.00 point is rejected, pinning
          the ceiling as `<= 100.00` on an exact decimal sum with no epsilon slack.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, one consultant (cost 120.00, ACTIVE proficiency 4)."
            - "One QUALIFIED, INTERNAL demand for 3.00 FTE, standard 250.00 / requested 240.00 (so coverage never caps the test and the margin stays at 50.00)."
            - "Assignment A1 CONFIRMED at 60.00% over [2026-08-03, 2026-08-29); assignments A2 at 40.00% and A3 at 1.00% created PROPOSED over the identical interval."
