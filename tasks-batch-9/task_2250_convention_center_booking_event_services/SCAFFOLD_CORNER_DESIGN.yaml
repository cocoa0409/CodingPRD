  - section: validations
    instances:
      - name: local_event_booking_at_the_close_month_boundary_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=70]
          - errors[ERR_BOOKING_WINDOW_CLOSED]
          - entities.BookingPolicyWindow.fields.close_months_before
        distinguishing_aspect: |
          The booking window check is inclusive on both ends. A LOCAL_EVENT whose
          show_start_date is 2026-11-01, exactly the close_months_before figure of 3 whole
          months from the default clock of 2026-08-01, must be accepted rather than
          refused; a strict comparison on either side of the range turns this legal
          booking into a 422.
        test_recipe:
          setup:
            - "the LOCAL_EVENT window opens 24 months out and closes 3 months out"
            - "the logical clock is the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "LOCAL_EVENT", priority_rank: 2, open_months_before: 24, close_months_before: 3, max_holds_per_booking: 2, challenge_response_hours: 72, rental_discount_pct: 0.1, max_challenge_rounds: 2 }
              as: VenueAdmin
              captures: { pw_local_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: VenueAdmin
              captures: { cl_rr_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_rr_id}", space_id: "${sp_bb_id}", event_name: "Riverbend Harvest Gala", event_class: "LOCAL_EVENT", move_in_start_date: "2026-10-31", show_start_date: "2026-11-01", show_end_date: "2026-11-03", move_out_end_date: "2026-11-04" }
              as: SalesManager
              captures: { bk_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "EventBooking.${bk_id}.status == TENTATIVE"
            - "EventBooking.${bk_id}.policy_window_id == ${pw_local_id}"
            - "EventBooking.${bk_id}.gross_rental_cents == 4800000"
            - "EventBooking.${bk_id}.contracted_rental_cents == 4320000"
            - "EventBooking.${bk_id}.deposit_required_cents == 1080000"
            - "EventBooking.${bk_id}.space_days_committed == 5"

      - name: citywide_qualification_satisfied_at_exactly_the_room_night_floor
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=38]
          - errors[ERR_CITYWIDE_QUALIFICATION_NOT_MET]
          - entities.Client.fields.organization_type
        distinguishing_aspect: |
          Both halves of the citywide qualification are satisfied exactly and no more:
          the client is a NATIONAL_ASSOCIATION and projected_room_nights is 2500, the
          CITYWIDE_ROOM_NIGHT_FLOOR itself. The comparison is at least, so this booking
          must be accepted; the §1.8 counterpart proves the failing side.
        test_recipe:
          setup:
            - "the CITYWIDE_CONVENTION window closes 18 months out and 2028-05-14 is well inside that range"
            - "National Widget Association is a NATIONAL_ASSOCIATION"
            - "projected_room_nights is exactly 2500"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CITYWIDE_CONVENTION", priority_rank: 1, open_months_before: 60, close_months_before: 18, max_holds_per_booking: 3, challenge_response_hours: 120, rental_discount_pct: 0.25, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A", space_class: "HALL", rentable_sqft: 200000, daily_base_rate_cents: 4800000, rigging_capable: true }
              as: VenueAdmin
              captures: { sp_ha_id: $.data.id }
            - call: "POST /convention-center/clients"
