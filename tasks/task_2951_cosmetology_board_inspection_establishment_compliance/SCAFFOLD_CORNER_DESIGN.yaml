            - "each error body carries a non-empty data.message alongside the error_id"

      - name: error_hazard_declaration_family_and_the_closed_establishment_write_gate
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HAZARD_FINDING_NOT_ELIGIBLE
          - errors.ERR_HAZARD_NOT_DECLARED
          - errors.ERR_HAZARD_ALREADY_DECLARED
          - errors.ERR_ESTABLISHMENT_NOT_OPERABLE
        distinguishing_aspect: "Four distinct refusals hang off one visit: a MINOR finding cannot support closure (422), clearance before declaration is refused at priority 43 before the reinspection check at priority 62 (409), a second declaration is refused (409), and once the establishment is CLOSED_IMMINENT_HAZARD the capacity-adding write is refused by priority 30 with ERR_ESTABLISHMENT_NOT_OPERABLE — not by the posture gate at priority 60."
        test_recipe:
          setup:
            - "Two violation codes: IMM-960 (IMMINENT_HAZARD, base_points 5.0, fine_cents_base 40000) and REC-960 (MINOR, base_points 2.0, fine_cents_base 3000)."
            - "Establishment 'Hazard Salon' (station_capacity 4) has an IN_PROGRESS ROUTINE inspection holding one IMM-960 finding and one REC-960 finding."
