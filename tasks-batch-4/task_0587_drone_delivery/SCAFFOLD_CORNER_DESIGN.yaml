              as: PlatformAdmin
              captures: { drone_2: $.data.id }
            - call: "POST /drones/${drone_2}/install-battery"
              payload: { battery_id: "${bat_2}" }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N103", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_3: $.data.id }
            - call: "POST /drones/${drone_3}/install-battery"
              payload: { battery_id: "${bat_3}" }
              as: MaintenanceTech
            - call: "POST /customers"
