              payload: { carrier_id: "${c_id}", product_code: "PZ", name: "Product Z", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-Z1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured Z", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "P-Z1", reported_amount_cents: 1200000 }, { line_ref: "GHOST-1", reported_amount_cents: 5000 } ] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/close"
              payload: {}
              as: AgencyAdmin
              captures: { close_err: "$.data.error_id" }
            - call: "POST /agency/carrier-statements/${st_id}/waive-line"
              payload: { line_ref: "GHOST-1" }
              as: AgencyAdmin
            - call: "POST /agency/carrier-statements/${st_id}/close"
              payload: {}
              as: AgencyAdmin
              captures: { final_status: "$.data.status" }
          assert:
            - "First close: error_id == ERR_UNMATCHED_STATEMENT_LINES (1 unresolved ORPHAN line blocks)"
            - "waive-line flips GHOST-1 to WAIVED"
            - "Second close: status == RECONCILED (unresolved count exactly 0 succeeds)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bind_requires_effective_schedule
        grounds:
          - state_machines.Policy.QUOTED_to_ACTIVE
          - validations[priority=6]
        distinguishing_aspect: |
          Pair Policy -> CommissionSchedule: binding is gated on an ACTIVE
          schedule covering (product, tier, effective_date). With no schedule
          the bind fails ERR_NO_EFFECTIVE_SCHEDULE; after the schedule is
          created, the identical bind call succeeds.
        test_recipe:
          setup:
            - "Producer tier STANDARD; carrier; product with NO schedule; DIRECT_BILL policy P-X1 effective 2026-08-01, disclosure DELIVERED"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer X", license_number: "LIC-X1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier X", carrier_code: "CX" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PX", name: "Product X", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-X1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured X", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
              captures: { bind_err: "$.data.error_id" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
              captures: { final_status: "$.data.status" }
          assert:
            - "First bind: error_id == ERR_NO_EFFECTIVE_SCHEDULE, policy stays QUOTED"
            - "After schedule creation, the same bind succeeds: status == ACTIVE and a BASE entry of 1200000 exists"

      - name: writeoff_requires_terminated_producer
        grounds:
          - state_machines.Chargeback.PENDING_to_WRITTEN_OFF
          - validations[priority=7]
        distinguishing_aspect: |
          Pair Chargeback -> Producer (different pair than Policy ->
          CommissionSchedule): write-off is gated on the linked producer being
          TERMINATED. While the producer is ACTIVE/SUSPENDED it fails
          ERR_PRODUCER_NOT_TERMINATED; after termination the same call succeeds.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; DIRECT_BILL policy premium 2400000 bound; cancelled effective 2027-02-01 -> Chargeback 600000 PENDING (producer auto-SUSPENDED since 600000 > 500000)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer W2", license_number: "LIC-W2", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier W2", carrier_code: "CW2" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PW2", name: "Product W2", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-W2", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured W2", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-02-01" }
              as: AgencyAdmin
            - call: "GET /agency/chargebacks"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { cb_id: "$.data[0].id" }
          trigger:
            - call: "POST /agency/chargebacks/${cb_id}/write-off"
              payload: {}
              as: AgencyAdmin
              captures: { wo_err: "$.data.error_id" }
            - call: "POST /agency/producers/${w_id}/terminate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/chargebacks/${cb_id}/write-off"
              payload: {}
              as: AgencyAdmin
              captures: { wo_status: "$.data.status" }
          assert:
            - "First write-off: error_id == ERR_PRODUCER_NOT_TERMINATED (producer merely SUSPENDED, not TERMINATED)"
            - "After POST /agency/producers/{id}/terminate, write-off succeeds: status == WRITTEN_OFF"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: schedule_half_open_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_SCHEDULE_WINDOW_OVERLAP]
          - entities.CommissionSchedule.fields.effective_to
        distinguishing_aspect: |
          Half-open interval semantics on CommissionSchedule: [2026-01-01,
          2027-01-01) and [2027-01-01, open) merely touch and are BOTH accepted;
          [2026-06-01, 2026-12-01) properly intersects the first and is rejected
          with ERR_SCHEDULE_WINDOW_OVERLAP. effective_to is EXCLUSIVE here.
        test_recipe:
          setup:
            - "Carrier; product (version tracked across schedule creates)"
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier W", carrier_code: "CW" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PW", name: "Product W", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
          trigger:
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", effective_to: "2027-01-01", supersede_existing: false, expected_product_version: "${p_v1}" }
              as: AgencyAdmin
              captures: { s1_id: "$.data.id" }
            - call: "GET /agency/products/${p_id}"
              payload: {}
              as: AgencyAdmin
              captures: { p_v2: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5200, override_rate_bps: 0, advance_months: 12, effective_from: "2027-01-01", supersede_existing: false, expected_product_version: "${p_v2}" }
              as: AgencyAdmin
              captures: { s2_id: "$.data.id" }
            - call: "GET /agency/products/${p_id}"
              payload: {}
              as: AgencyAdmin
              captures: { p_v3: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5400, override_rate_bps: 0, advance_months: 12, effective_from: "2026-06-01", effective_to: "2026-12-01", supersede_existing: false, expected_product_version: "${p_v3}" }
              as: AgencyAdmin
              captures: { ov_err: "$.data.error_id" }
          assert:
            - "Schedule 1 created: [2026-01-01, 2027-01-01)"
            - "Schedule 2 created: effective_from 2027-01-01 touches but does not overlap (half-open boundary is free)"
            - "Schedule 3 [2026-06-01, 2026-12-01): error_id == ERR_SCHEDULE_WINDOW_OVERLAP"

      - name: statement_closed_interval_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
          - entities.CarrierStatement.fields.period_end
        distinguishing_aspect: |
          Closed-interval semantics on CarrierStatement (a different resource
          than CommissionSchedule): period_end is INCLUSIVE, so a new statement
          starting on the previous statement's end date (2026-01-31) DOES
          overlap and is rejected, while starting the next day (2026-02-01) is
          accepted — adjacency is NOT free here, the exact inverse of the
          sibling instance's half-open rule.
        test_recipe:
          setup:
            - "Carrier; statement S1 for period 2026-01-01..2026-01-31 already imported"
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier I", carrier_code: "CI" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-01-01", period_end: "2026-01-31", lines: [] }
              as: AgencyAdmin
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-01-31", period_end: "2026-02-28", lines: [] }
              as: AgencyAdmin
              captures: { ov_err: "$.data.error_id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-02-01", period_end: "2026-02-28", lines: [] }
              as: AgencyAdmin
              captures: { s3_id: "$.data.id" }
          assert:
            - "Statement sharing the boundary date 2026-01-31: error_id == ERR_STATEMENT_PERIOD_OVERLAP (closed interval: shared date IS overlap)"
            - "Statement starting 2026-02-01: created successfully (201)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trust_payment_reversal_conserves_cash
        grounds:
          - calculations.trust_remittance
          - state_machines.PremiumInvoice.OPEN_to_OPEN
          - entities.Carrier.fields.trust_balance_cents
        distinguishing_aspect: |
          Conserved quantity: carrier trust cash. Recording a full payment and
          then its compensating reversal leaves trust_balance_cents bit-identical
          to its pre-payment value (0), i.e. trust == sum(payments) -
          sum(reversals) - sum(remittances) holds with zero drift.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; AGENCY_BILL policy premium 2400000 effective 2026-08-01, disclosure DELIVERED, bound (invoice OPEN, due 2026-08-31; clock still at default so invoice is not delinquent)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer T2", license_number: "LIC-T2", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier T2", carrier_code: "CT2" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PT2", name: "Product T2", line_of_business: "PROPERTY_CASUALTY" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-T2", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured T2", billing_type: "AGENCY_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/policies/${pol_id}/invoices"
              payload: {}
              as: AgencyAdmin
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /agency/premium-invoices/${inv_id}/payments"
              payload: { amount_cents: 2400000 }
              as: AgencyAdmin
              captures: { paid_total: "$.data.paid_total_cents" }
            - call: "GET /agency/carriers/${c_id}"
              payload: {}
              as: AgencyAdmin
              captures: { trust_after_pay: "$.data.trust_balance_cents" }
            - call: "POST /agency/premium-invoices/${inv_id}/reverse-payments"
              payload: {}
              as: AgencyAdmin
              captures: { paid_total_after: "$.data.paid_total_cents" }
            - call: "GET /agency/carriers/${c_id}"
              payload: {}
              as: AgencyAdmin
              captures: { trust_after_reverse: "$.data.trust_balance_cents" }
          assert:
            - "After payment: trust_balance_cents == 2400000 and invoice paid_total_cents == 2400000 (status PAID)"
            - "After reversal: trust_balance_cents == 0 (identical to pre-payment), invoice paid_total_cents == 0, status OPEN"
            - "Invariant: trust == sum(payments 2400000) - sum(reversals 2400000) - sum(remittances 0) == 0, no drift"

      - name: cancel_chargeback_earned_identity
        grounds:
          - calculations.chargeback_unearned_commission
          - entities.Chargeback.fields.amount_cents
          - entities.CommissionEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: total commission allocation per entry (a different
          quantity than trust cash). The forward booking (BASE 6600000) plus its
          compensating cancellation split MUST satisfy chargeback.amount_cents +
          earned_adjustment.amount_cents == original entry.amount_cents:
          3300000 + 3300000 == 6600000, no drift across the pair.
        test_recipe:
          setup:
            - "Producer (no upline); carrier; product; STANDARD schedule 5500bps override 0 advance 12; DIRECT_BILL policy premium 12000000 effective 2026-08-01, disclosure DELIVERED, bound (BASE 6600000)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer E", license_number: "LIC-E1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier E", carrier_code: "CE" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PE", name: "Product E", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5500, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-E1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured E", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-02-01" }
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "EARNED_ADJUSTMENT" }
              as: AgencyAdmin
              captures: { adj_amt: "$.data[0].amount_cents" }
            - call: "GET /agency/chargebacks"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { cb_amt: "$.data[0].amount_cents" }
          assert:
            - "EARNED_ADJUSTMENT.amount_cents == 3300000 (6 whole months earned of 12)"
            - "Chargeback.amount_cents == 3300000 (unearned half)"
            - "Conservation identity: 3300000 + 3300000 == 6600000 == original BASE entry amount_cents"
