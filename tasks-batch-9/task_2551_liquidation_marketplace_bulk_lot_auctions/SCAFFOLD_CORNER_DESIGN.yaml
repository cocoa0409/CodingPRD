            - "Lot.${lot1}.lot_status == MANIFEST_APPROVED"
            - "Lot.${lot1}.manifest_reviewed_by_user_id == ops-review-1 (unchanged by the rejected replay)"

      - name: manifest_rejection_cycles_the_lot_back_to_draft_and_into_review_again
        claim_type: cyclic
        grounds:
          - state_machines.Lot.MANIFEST_IN_REVIEW_to_MANIFEST_REJECTED
          - state_machines.Lot.MANIFEST_REJECTED_to_DRAFT
          - state_machines.Lot.DRAFT_to_MANIFEST_IN_REVIEW
          - endpoints[POST /liquidation/lots/{id}/manifest-lines]
        distinguishing_aspect: >
          The lot machine is cyclic on the manifest leg: REJECT sends the lot to
          MANIFEST_REJECTED, adding a manifest line pulls it back to DRAFT (aggregates now
          400 units / 10000000 cents), and re-submission returns it to MANIFEST_IN_REVIEW so the
          same lot can be approved on the second pass.
        test_recipe:
          setup:
            - "One seller, one warehouse, one lot with one ACTIVE line (100 x 40000) whose manifest was submitted and then REJECTED by ops-review-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
