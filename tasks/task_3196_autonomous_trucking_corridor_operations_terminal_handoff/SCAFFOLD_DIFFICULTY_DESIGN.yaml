  - rule_id: compensating_invariant
    instances:

      - name: run_plan_slot_and_rate_compensation_conserves_commitment_slots
        grounds:
          - state_machines.RunPlan.transitions.DRAFT_to_READINESS_PENDING
          - state_machines.RunPlan.transitions.DISPATCH_READY_to_ABORTED
          - entities.ShipperCommitment.fields.remaining_slots
          - concurrency_rules[run-plan-dispatch-stale]
        distinguishing_aspect: "The commitment slot is a conserved quantity over the forward/compensating pair: submit debits one slot, abort credits exactly one back, and the invariant committed_slots - consumed_slots == remaining_slots holds before and after; the same pair also conserves the commitment's captured slot worth at ABORT_RELEASE_CENTS per slot, so a pair that leaves slot drift or rate drift is detectable as a non-zero delta."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
