            - call: "POST /products"
              payload: { sku: "DRP", name: "DR P", on_hand_qty: 9 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "dr1@x.com", full_name: "DR One" }
              as: Subscriber
              captures: { a1: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a1}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a1}"
              captures: { box1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "dr2@x.com", full_name: "DR Two" }
              as: Subscriber
              captures: { a2: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a2}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a2}"
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions/${sub2}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a2}"
              captures: { box2: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 5 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_v0: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${sub1}", wave_id: "${wave_id}", box_selection_id: "${box1}", expected_wave_version: "${wave_v0}" }
              as: CurationAdmin
              captures: { alloc1: $.data.id, wave_v1: $.data.version }
            - call: "POST /allocations"
