  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: effectiveness_fail_dedesignation_reaches_policy_exception_count
        grounds:
          - state_machines.HedgeInstrument.accounting_status_DESIGNATED_to_DEDESIGNATED
          - entities.HedgeProgram.fields.undesignated_mtm_usd
          - entities.HedgeProgram.fields.compliance_posture
          - entities.PolicyException.fields.origin
          - entities.HedgePolicy.fields.open_exception_count
        distinguishing_aspect: |
          A single POST of an effectiveness test propagates four hops: instrument
          accounting_status DESIGNATED -> DEDESIGNATED, then the program's 200000.00
          mark-to-market moves from the designated bucket to the undesignated bucket
          making earnings_volatility_usd 200000.00 and compliance_posture BREACH, then a
          SYSTEM_BREACH PolicyException row appears, then HedgePolicy.open_exception_count
          becomes 1 - the policy row is never named in the request.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_earnings_volatility_usd 150000.00 and open_exception_count 0."
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, holding one EXECUTED and DESIGNATED 2000000-gallon SWAP at strike 2.4000."
            - "One PUBLISHED MarkToMarketRun for 2027-02 at index 2.5000, so the trade carries mtm_value_usd 200000.00 and the program has designated_mtm_usd 200000.00."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-TC1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-TC1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 20.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 2000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/designate"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs"
              payload: { period_month: "2027-02", settlement_index_usd_per_gal: 2.5000 }
              as: HedgeAccountant
              captures: { run_id: $.data.id }
            - call: "POST /fuel/mark-to-market-runs/${run_id}/compute"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs/${run_id}/publish"
              payload: {}
              as: RiskPolicyAdmin
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { period_month: "2027-02", hedge_change_usd: -30000.00, hedged_item_change_usd: 100000.00 }
              as: HedgeAccountant
              captures: { test_id: $.data.id }
          assert:
            - "before the trigger: HedgeProgram.${prog_id}.designated_mtm_usd == 200000.00, undesignated_mtm_usd == 0.00, earnings_volatility_usd == 0.00, compliance_posture == COMPLIANT, HedgePolicy.${policy_id}.open_exception_count == 0"
            - "EffectivenessTest.${test_id}.period_ratio == 0.3000 and EffectivenessTest.${test_id}.cumulative_ratio == 0.3000 and EffectivenessTest.${test_id}.result == FAIL"
            - "HOP 1: HedgeInstrument.${inst_id}.accounting_status == DEDESIGNATED while trade_status is still EXECUTED"
            - "HOP 2: HedgeProgram.${prog_id}.designated_mtm_usd == 0.00, undesignated_mtm_usd == 200000.00, earnings_volatility_usd == 200000.00, compliance_posture == BREACH"
            - "HOP 3: exactly one PolicyException exists with hedge_instrument_id == ${inst_id}, origin == SYSTEM_BREACH, reason_code == EARNINGS_VOLATILITY_BREACH, status == REQUESTED and requested_by_user_id == null"
            - "HOP 4: HedgePolicy.${policy_id}.open_exception_count == 1"
            - "HedgeInstrument.${inst_id}.mtm_value_usd == 200000.00 is unchanged: the cascade reclassifies, it does not revalue"

      - name: terminate_returns_posted_collateral_and_restores_counterparty
        grounds:
          - state_machines.HedgeInstrument.trade_status_EXECUTED_to_TERMINATED
          - state_machines.CollateralPosting.POSTED_to_RETURNED_system
          - entities.Counterparty.fields.posted_collateral_usd
          - entities.Counterparty.fields.utilized_credit_usd
          - entities.CollateralPosting.fields.status
        distinguishing_aspect: |
          Terminating one trade reaches three entities in a strict chain and discriminates
          by posting state: the POSTED collateral row of 180000.00 is driven to RETURNED
          and only then is Counterparty.posted_collateral_usd reduced, while a sibling
          posting still in REQUIRED with required_amount_usd 0.00 is deliberately left
          untouched and keeps open_margin_call_count at 1.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, with one EXECUTED 3000000-gallon SWAP whose margin_requirement_usd is 180000.00."
            - "Counterparty credit_limit_usd 1000000.00, utilized_credit_usd 180000.00, utilization_pct 18.00."
            - "One CollateralPosting POSTED for 180000.00 and a second CollateralPosting still REQUIRED with required_amount_usd 0.00."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-TC2", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
