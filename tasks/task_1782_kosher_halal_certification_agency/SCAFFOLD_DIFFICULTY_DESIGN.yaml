# =============================================================================
# Task 1782 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 24 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and its test_recipe replays only declared endpoints.
# Canonical certified-client chain used below (abbreviations in comments):
#   create client -> submit-application -> facility -> equipment-line -> assess
#   -> INITIAL visit -> clock into window -> start -> complete -> approve facility
#   -> agreement (OCC expected_client_version) -> activate -> annual invoice
#   -> record-payment (as_user_id am-1) -> ingredient approve -> product certify
#   -> certificate create -> issue (as_user_id co-1, != am-1 segregation)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: prorata_fee_anniversary_vs_calendar_year_divergence
        grounds:
          - calculations.prorata_product_fee
          - calculations.product_addition_invoice_total
          - entities.CertificationAgreement.fields.billing_cycle
        distinguishing_aspect: "Fee/invoice entity domain: identical addition_date 2026-07-01 and per_product_fee_cents 73000 yield total_cents == 54600 under ANNIVERSARY (term_end 2027-03-31, 273 days) vs total_cents == 36600 under CALENDAR_YEAR (cycle end 2026-12-31, 183 days) — same inputs, different money, driven only by the agreement's billing_cycle variant."
        test_recipe:
          setup:
            - "Client A: fully certified (KOSHER, 1 OWNED APPROVED facility), agreement ANNIVERSARY term_start 2026-04-01 (term_end 2027-03-31), per_product_fee_cents 73000; certificate ACTIVE with product p1; second CERTIFIABLE product p2 ready"
            - "Client B: identical except agreement billing_cycle CALENDAR_YEAR (term_end auto-computed 2026-12-31)"
            - "Clock at 2026-07-01T00:00:00Z for both additions"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Anniv Co", certification_scheme: "KOSHER", contact_email: "a@x.com" }, as: AccountManager, captures: { cA: $.data.id } }
            - { call: "POST /api/clients/${cA}/submit-application", as: ClientContact, as_user_id: "${cA}", captures: { cA_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cA}", name: "A Plant", address: "1 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cA}", captures: { fA: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fA}", designation: "L1" }, as: ClientContact, as_user_id: "${cA}", captures: { eA: $.data.id } }
            - { call: "POST /api/equipment-lines/${eA}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fA}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vA: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vA}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vA}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fA}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cA}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cA_v}" }, as: AccountManager, captures: { aA: $.data.id } }
            - { call: "POST /api/agreements/${aA}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cA}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aA}" }, as: AccountManager, captures: { invA: $.data.id } }
            - { call: "POST /api/invoices/${invA}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cA}", name: "IngA1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cA}", captures: { iA1: $.data.id } }
            - { call: "POST /api/ingredients/${iA1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iA1}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cA}", brand: "BA", name: "PA1", ingredient_ids: ["${iA1}"] }, as: ClientContact, as_user_id: "${cA}", captures: { pA1: $.data.id } }
            - { call: "POST /api/products/${pA1}/submit-review", as: ClientContact, as_user_id: "${cA}" }
            - { call: "POST /api/products/${pA1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cA}", brand: "BA", name: "PA2", ingredient_ids: ["${iA1}"] }, as: ClientContact, as_user_id: "${cA}", captures: { pA2: $.data.id } }
            - { call: "POST /api/products/${pA2}/submit-review", as: ClientContact, as_user_id: "${cA}" }
            - { call: "POST /api/products/${pA2}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cA}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fA}"], product_ids: ["${pA1}"] }, as: CertificateOfficer, captures: { certA: $.data.id } }
            - { call: "POST /api/certificates/${certA}/issue", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/clients", payload: { legal_name: "CalYear Co", certification_scheme: "KOSHER", contact_email: "b@x.com" }, as: AccountManager, captures: { cB: $.data.id } }
            - { call: "POST /api/clients/${cB}/submit-application", as: ClientContact, as_user_id: "${cB}", captures: { cB_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cB}", name: "B Plant", address: "2 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cB}", captures: { fB: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fB}", designation: "L1" }, as: ClientContact, as_user_id: "${cB}", captures: { eB: $.data.id } }
            - { call: "POST /api/equipment-lines/${eB}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fB}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }, as: AccountManager, captures: { vB: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vB}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vB}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fB}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cB}", scheme: "KOSHER", billing_cycle: "CALENDAR_YEAR", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cB_v}" }, as: AccountManager, captures: { aB: $.data.id } }
            - { call: "POST /api/agreements/${aB}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cB}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aB}" }, as: AccountManager, captures: { invB: $.data.id } }
            - { call: "POST /api/invoices/${invB}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cB}", name: "IngB1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cB}", captures: { iB1: $.data.id } }
            - { call: "POST /api/ingredients/${iB1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iB1}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cB}", brand: "BB", name: "PB1", ingredient_ids: ["${iB1}"] }, as: ClientContact, as_user_id: "${cB}", captures: { pB1: $.data.id } }
            - { call: "POST /api/products/${pB1}/submit-review", as: ClientContact, as_user_id: "${cB}" }
            - { call: "POST /api/products/${pB1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cB}", brand: "BB", name: "PB2", ingredient_ids: ["${iB1}"] }, as: ClientContact, as_user_id: "${cB}", captures: { pB2: $.data.id } }
            - { call: "POST /api/products/${pB2}/submit-review", as: ClientContact, as_user_id: "${cB}" }
            - { call: "POST /api/products/${pB2}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cB}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fB}"], product_ids: ["${pB1}"] }, as: CertificateOfficer, captures: { certB: $.data.id } }
            - { call: "POST /api/certificates/${certB}/issue", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AgencyAdmin }
          trigger:
            - { call: "POST /api/certificates/${certA}/products", payload: { product_ids: ["${pA2}"] }, as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/certificates/${certB}/products", payload: { product_ids: ["${pB2}"] }, as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "GET /api/invoices", payload: { related_certificate_id: "${certA}", invoice_type: "PRODUCT_ADDITION" }, as: AccountManager, captures: { invA_total: "$.data[0].total_cents" } }
            - { call: "GET /api/invoices", payload: { related_certificate_id: "${certB}", invoice_type: "PRODUCT_ADDITION" }, as: AccountManager, captures: { invB_total: "$.data[0].total_cents" } }
          assert:
            - "Client A PRODUCT_ADDITION invoice: subtotal_cents == 54600, discount_cents == 0, total_cents == 54600 (73000 * 273/365, term_end 2027-03-31)"
            - "Client B PRODUCT_ADDITION invoice: subtotal_cents == 36600, discount_cents == 0, total_cents == 36600 (73000 * 183/365, cycle end 2026-12-31)"
            - "invA_total == 54600 and invB_total == 36600 and invA_total != invB_total despite identical fee and addition date"

      - name: certificate_valid_until_annual_vs_seasonal_divergence
        grounds:
          - calculations.certificate_valid_until
          - entities.Certificate.fields.term_type
          - entities.Certificate.fields.valid_until
        distinguishing_aspect: "Certificate temporal domain (distinct from instance 1's invoice/fee domain): two certificates with identical issued_at 2026-08-15T10:00:00Z produce valid_until == 2027-08-15T10:00:00Z under ANNUAL vs valid_until == 2026-09-30T23:59:59Z under SEASONAL — same issuance instant, different expiration arithmetic, driven only by term_type."
        test_recipe:
          setup:
            - "Client fully certified; ANNUAL certificate certA ACTIVE; PASSOVER holiday window 2026-09-20T00:00:00Z..2026-09-30T23:59:59Z CONFIRMED at the same facility (covered by certA)"
            - "SEASONAL certificate certB in DRAFT referencing the window; clock frozen at 2026-08-15T10:00:00Z for both issuances"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Seasonal Co", certification_scheme: "KOSHER", contact_email: "s@x.com" }, as: AccountManager, captures: { cS: $.data.id } }
            - { call: "POST /api/clients/${cS}/submit-application", as: ClientContact, as_user_id: "${cS}", captures: { cS_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cS}", name: "S Plant", address: "3 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cS}", captures: { fS: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fS}", designation: "L1" }, as: ClientContact, as_user_id: "${cS}", captures: { eS: $.data.id } }
            - { call: "POST /api/equipment-lines/${eS}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fS}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: AccountManager, captures: { vS: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vS}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vS}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fS}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cS}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cS_v}" }, as: AccountManager, captures: { aS: $.data.id } }
            - { call: "POST /api/agreements/${aS}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cS}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aS}" }, as: AccountManager, captures: { invS: $.data.id } }
            - { call: "POST /api/invoices/${invS}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cS}", name: "IngS1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cS}", captures: { iS1: $.data.id } }
            - { call: "POST /api/ingredients/${iS1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iS1}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cS}", brand: "BS", name: "PS1", ingredient_ids: ["${iS1}"] }, as: ClientContact, as_user_id: "${cS}", captures: { pS1: $.data.id } }
            - { call: "POST /api/products/${pS1}/submit-review", as: ClientContact, as_user_id: "${cS}" }
            - { call: "POST /api/products/${pS1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cS}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fS}"], product_ids: ["${pS1}"] }, as: CertificateOfficer, captures: { certSA: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/certificates/${certSA}/issue", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/holiday-windows", payload: { facility_id: "${fS}", holiday_code: "PASSOVER", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }, as: ClientContact, as_user_id: "${cS}", captures: { hwS: $.data.id } }
            - { call: "POST /api/holiday-windows/${hwS}/confirm", payload: { assigned_supervisor_id: "sup-9" }, as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cS}", scheme: "KOSHER", term_type: "SEASONAL", facility_ids: ["${fS}"], product_ids: ["${pS1}"], holiday_window_id: "${hwS}" }, as: CertificateOfficer, captures: { certSB: $.data.id } }
          trigger:
            - { call: "POST /api/certificates/${certSB}/issue", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "GET /api/certificates/${certSA}", as: CertificateOfficer, captures: { vuA: $.data.valid_until, iaA: $.data.issued_at } }
            - { call: "GET /api/certificates/${certSB}", as: CertificateOfficer, captures: { vuB: $.data.valid_until, iaB: $.data.issued_at } }
          assert:
            - "iaA == iaB == 2026-08-15T10:00:00Z (identical issuance instant, clock frozen)"
            - "certSA (ANNUAL).valid_until == 2027-08-15T10:00:00Z (issued_at + 365 days)"
            - "certSB (SEASONAL).valid_until == 2026-09-30T23:59:59Z (window end, ~319 days shorter)"
            - "vuA != vuB with iaA == iaB"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: annual_fee_tiered_copacker_multiplier_surcharge
        grounds:
          - calculations.annual_certification_fee
          - entities.CertificationAgreement.fields.annual_fee_snapshot_cents
        distinguishing_aspect: "Mode (a) — >=3 inputs with non-linear interaction: marginal facility tiers (1@120000, 4@90000, 2@70000 = 620000) + per-site CO_PACKER surcharge (2x25000) x DUAL scheme multiplier (1.8) + conditional MEDIUM risk surcharge (5%): (620000+50000)*1.8 = 1206000, +5% = 60300, snapshot == 1266300."
        test_recipe:
          setup:
            - "DUAL client with 7 non-DECOMMISSIONED facilities: 5 OWNED + 2 CO_PACKER (creation order f1..f7 fixes tier assignment by created_at ASC)"
            - "One OPEN MAJOR finding on f1 -> open_nc_score 3 -> risk_tier MEDIUM at activation instant"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Fee Co", certification_scheme: "DUAL", contact_email: "f@x.com" }, as: AccountManager, captures: { cF: $.data.id } }
            - { call: "POST /api/clients/${cF}/submit-application", as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F1", address: "1", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cF}", captures: { fF1: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F2", address: "2", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F3", address: "3", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F4", address: "4", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F5", address: "5", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F6", address: "6", facility_role: "CO_PACKER" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/facilities", payload: { client_id: "${cF}", name: "F7", address: "7", facility_role: "CO_PACKER" }, as: ClientContact, as_user_id: "${cF}" }
            - { call: "POST /api/visits", payload: { facility_id: "${fF1}", visit_type: "ROUTINE", inspector_user_id: "sup-2", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: AccountManager, captures: { vF: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vF}/start", as: FieldSupervisor, as_user_id: "sup-2" }
            - { call: "POST /api/visits/${vF}/findings", payload: { severity: "MAJOR", description: "traceability gap", remediation_deadline: "2026-12-31T00:00:00Z" }, as: FieldSupervisor, as_user_id: "sup-2" }
            - { call: "POST /api/visits/${vF}/complete", as: FieldSupervisor, as_user_id: "sup-2" }
            - { call: "GET /api/clients/${cF}", as: AccountManager, captures: { cF_v: $.data.version } }
            - { call: "POST /api/agreements", payload: { client_id: "${cF}", scheme: "DUAL", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cF_v}" }, as: AccountManager, captures: { aF: $.data.id } }
          trigger:
            - { call: "POST /api/agreements/${aF}/activate", as: AccountManager, captures: { snap: $.data.annual_fee_snapshot_cents } }
          assert:
            - "Agreement.${aF}.annual_fee_snapshot_cents == 1266300"
            - "AgencyClient.${cF}.open_nc_score == 3 and risk_tier == MEDIUM (gate for the 5% surcharge branch)"
            - "snapshot derivation: tier_sum 620000 (120000 + 4*90000 + 2*70000) + copacker 50000 = 670000; *1.8 = 1206000; +5% = 60300; total 1266300"

      - name: product_addition_per_line_rounding_then_sum
        grounds:
          - calculations.product_addition_invoice_total
          - calculations.prorata_product_fee
        distinguishing_aspect: "Mode (b) — nested rounding order (distinct from instance annual_fee's mode (a)): per-line round_half_up(10000*183/365 = 5013.6986) = 5014 twice, THEN sum = 10028; the forbidden sum-then-round gives round(10027.397) = 10027 — the two orders differ by exactly 1 cent and the scaffold pins per-line-then-sum."
        test_recipe:
          setup:
            - "Certified client; agreement ANNIVERSARY term 2026-01-01..2026-12-31, per_product_fee_cents 10000; certificate ACTIVE with p1; p2 and p3 CERTIFIABLE and unlisted; clock 2026-07-01 (183 days remaining)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Round Co", certification_scheme: "KOSHER", contact_email: "r@x.com" }, as: AccountManager, captures: { cR: $.data.id } }
            - { call: "POST /api/clients/${cR}/submit-application", as: ClientContact, as_user_id: "${cR}", captures: { cR_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cR}", name: "R Plant", address: "4 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cR}", captures: { fR: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fR}", designation: "L1" }, as: ClientContact, as_user_id: "${cR}", captures: { eR: $.data.id } }
            - { call: "POST /api/equipment-lines/${eR}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fR}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vR: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vR}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vR}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fR}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cR}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-01-01", per_product_fee_cents: 10000, expected_client_version: "${cR_v}" }, as: AccountManager, captures: { aR: $.data.id } }
            - { call: "POST /api/agreements/${aR}/activate", as: AccountManager }
