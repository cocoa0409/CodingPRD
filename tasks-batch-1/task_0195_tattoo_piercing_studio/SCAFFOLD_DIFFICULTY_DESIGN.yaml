          Depth-3 cascade from the complete trigger: complete mutates Appointment
          (status/gross) -> that completion bumps Artist.completed_session_count ->
          that counter change recomputes Artist.reliability_score; and the
          appointment completion flips its Deposit rows to APPLIED. Each link is
          caused by the prior link.
