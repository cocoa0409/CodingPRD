  # =======================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_points_tier_shipping_repricing_depth_six
        grounds:
          - state_machines.Cycle.DISPATCHED_to_DELIVERED
          - calculations.points_earned
          - calculations.tier_evaluation
          - calculations.shipping_cents
          - calculations.next_charge_estimate_cents
          - entities.Subscription.fields.free_shipping_eligible
        distinguishing_aspect: |
          A depth-6 chain from ONE trigger where each hop is caused by the hop before it:
          deliver -> EARN 2000 points -> trailing_earned_points crosses 2000 so tier becomes
          SILVER -> because the tier is SILVER, free_shipping_eligible flips true -> because that
          flag flipped, the already-allocated next cycle's shipping_cents drops 599 -> 0 and its
          total_due_cents 2999 -> 2400 -> because that total changed,
          Account.next_charge_estimate_cents becomes 2400.
        test_recipe:
          setup:
            - "A luxury S2 SKU priced at 100000 cents with stock 2 and a cheap S2 SKU priced at 1200 cents created with stock 0."
            - "Cycle 1 allocated onto the luxury SKU only (the cheap SKU is out of stock at that instant): subtotal 200000, shipping 0, total_due 200000."
            - "The cheap SKU is then restocked, cycle 2 is generated and allocated onto it: subtotal 2400, shipping 599, total_due 2999."
            - "Cycle 1 is locked, charged for 200000 cash and dispatched on 2026-06-08T00:00:00Z; the loyalty wallet is still BRONZE with 0 points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-LUX", name: "Stage 2 Luxury", stage: "S2", line: "STANDARD", pack_price_cents: 100000, pack_size_units: 60, allergen_tags: [], stock_packs: 2 }
              as: OpsAdmin
              captures: { sku_lux: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-CHEAP", name: "Stage 2 Cheap", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 0 }
              as: OpsAdmin
              captures: { sku_cheap: $.data.id }
            - call: "POST /accounts"
              payload: { email: "cascade@example.com", full_name: "Cascade Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token, loy_id: $.data.loyalty_account_id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
