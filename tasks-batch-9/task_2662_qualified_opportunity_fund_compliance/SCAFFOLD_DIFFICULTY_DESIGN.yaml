            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Runway Systems LLC", zone_tract_code: "12345678903", declared_nqfp_amount: 0.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZB_EQUITY", qoz_business_id: "${biz_id}", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 900000.00, afs_fair_value: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { eq_id: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WCSH-PLAN-2026-A", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_id: $.data.id }
            - call: "POST /qof/wcsh-plans/${plan_id}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses/${biz_id}/business-tests"
              payload: { testing_date: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { bt1_id: $.data.id }
            - call: "POST /qof/business-tests/${bt1_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 50000.00, intangibles_total_amount: 100000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/business-tests/${bt1_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "POST /qof/qoz-businesses/${biz_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { bt2_id: $.data.id }
            - call: "POST /qof/business-tests/${bt2_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 50000.00, intangibles_total_amount: 100000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/wcsh-plans/${plan_id}/expenditures"
              payload: { amount: 20000.00, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
