              as: PayrollAnalyst
              captures: { stmt_status_2: $.data.status }
            - call: "GET /fleet/domiciles/${dom_chi_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { dom_accrued_2: $.data.accrued_pay_cents }
            - call: "GET /fleet/drivers/${drv_77_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { drv_ytd_2: $.data.ytd_gross_cents }
            - call: "POST /fleet/pay-statements/${stmt_id}/reverse"
              payload: { reason_code: "PAYROLL_ERROR" }
              as: PayrollAnalyst
              captures: { stmt_status_3: $.data.status }
            - call: "GET /fleet/domiciles/${dom_chi_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { dom_accrued_3: $.data.accrued_pay_cents }
            - call: "GET /fleet/drivers/${drv_77_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { drv_ytd_3: $.data.ytd_gross_cents }
            - call: "GET /fleet/trips/${trip_f1_id}"
              payload: {}
