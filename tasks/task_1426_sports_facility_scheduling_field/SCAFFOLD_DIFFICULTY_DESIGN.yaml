            - { call: "POST /invoices/${i_id}/refunds", payload: { amount_cents: 10001, reason: "Larger partial" }, as: FinanceClerk, as_user_id: "clerk-1", captures: { r2_id: $.data.id, r2_status: $.data.status } }
            - { call: "GET /invoices/${i_id}", payload: {}, as: FinanceClerk, captures: { i_ref_mid: $.data.refunded_cents } }
