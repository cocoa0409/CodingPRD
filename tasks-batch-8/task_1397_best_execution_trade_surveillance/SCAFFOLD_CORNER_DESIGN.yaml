        claim_type: side_effect_execution
        grounds: ["state_machines.RestrictedListEntry.SCHEDULED_to_ACTIVE", "state_machines.PersonalTrade"]
        distinguishing_aspect: "Ops-run activation of a restricted entry cascades: pending preclearances in that symbol are auto-DENIED with denial_reason RESTRICTED_LIST (caused by the activation, not by a human decision)."
        test_recipe:
          setup: ["Employee with PRECLEARANCE_REQUESTED trade for ACME; SCHEDULED entry ACME ALL [2026-08-10, 2026-08-20); clock at 2026-08-12"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Pen Ding", employee_ref: "EMP-130", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 50 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "ALL", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }, as: ComplianceAdmin, captures: { r_id: "$.data.id" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /surveillance/ops/runs", payload: {}, as: OpsAdmin, captures: { n_act: "$.data.restricted_activated", n_den: "$.data.preclearances_denied" } }
            - { call: "GET /surveillance/restricted-list-entries/${r_id}", payload: {}, as: ComplianceAdmin, captures: { r_status: "$.data.status" } }
            - { call: "GET /surveillance/employees/${e_id}/personal-trades", payload: {}, as: ComplianceAdmin, captures: { t_status: "$.data[0].status", t_reason: "$.data[0].denial_reason" } }
          assert:
            - "${n_act} == 1 and ${r_status} == ACTIVE"
            - "Cascade: ${n_den} == 1, ${t_status} == DENIED, ${t_reason} == RESTRICTED_LIST"
      - name: employee_termination_cascades_trades_and_training
        claim_type: side_effect_execution
        grounds: ["state_machines.Employee", "state_machines.PersonalTrade", "state_machines.TrainingAssignment"]
        distinguishing_aspect: "Termination fans out over two aggregates: PRECLEARANCE_REQUESTED->DENIED(EMPLOYMENT_ENDED), APPROVED->EXPIRED, ASSIGNED->CANCELLED."
        test_recipe:
          setup: ["Employee with one requested trade, one approved trade, one assigned training (policy published)"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Term Inee", employee_ref: "EMP-140", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 50 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t1: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "BBB", side: "BUY", quantity: 50 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t2: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t2}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/compliance-policies", payload: { policy_code: "PAT", title: "Personal Account Trading", version_label: "v2026.1" }, as: ComplianceAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies/${p_id}/publish", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/employees/${e_id}/employment-transition", payload: { to_status: "TERMINATED" }, as: ComplianceAdmin, captures: { e_status: "$.data.employment_status" } }
            - { call: "GET /surveillance/employees/${e_id}/personal-trades", payload: {}, as: ComplianceAdmin, captures: { t1_status: "$.data[0].status", t1_reason: "$.data[0].denial_reason", t2_status: "$.data[1].status" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e_id}" }, as: ComplianceAdmin, captures: { a_status: "$.data[0].status" } }
          assert:
            - "${e_status} == TERMINATED"
            - "${t1_status} == DENIED with ${t1_reason} == EMPLOYMENT_ENDED; ${t2_status} == EXPIRED; ${a_status} == CANCELLED (list order: created_at ASC)"
      - name: attest_on_terminated_employee_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Employee", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The attest action is locked out once employment is TERMINATED."
        test_recipe:
          setup: ["Employee TERMINATED"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Gone Already", employee_ref: "EMP-141", department: "TRADING", attestation_due_at: "2026-07-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/employees/${e_id}/employment-transition", payload: { to_status: "TERMINATED" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/employees/${e_id}/attest", payload: {}, as: CoveredEmployee, as_user_id: "${e_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: case_begin_investigation_from_reopened
        claim_type: valid_transition
        grounds: ["state_machines.SurveillanceCase"]
        distinguishing_aspect: "REOPENED->UNDER_INVESTIGATION re-enters the investigation loop after a reopen."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / case_parallel_dimensions_with_cycles"
          rationale: "Its final trigger asserts the case lands UNDER_INVESTIGATION after REOPENED."
      - name: filing_submit_on_unfounded_case_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=30]", "errors[ERR_FILING_NOT_REQUIRED]"]
        distinguishing_aspect: "UNFOUNDED disposition leaves filing_status NOT_REQUIRED; a submit attempt yields ERR_FILING_NOT_REQUIRED (not ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Case on employee DISPOSITIONED with disposition UNFOUNDED"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Unfounded", employee_ref: "EMP-150", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "LX", terms: [ { term: "guarantee", weight: 100 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "EMAIL", author_employee_id: "${e_id}", body_text: "guarantee" }, as: OpsAdmin, captures: { ci: "$.data.id" } }
            - { call: "GET /surveillance/surveillance-cases", payload: { source_comm_item_id: "${ci}" }, as: SurveillanceAnalyst, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "UNDER_INVESTIGATION" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "DISPOSITIONED", disposition: "UNFOUNDED" }, as: SurveillanceAnalyst, captures: { c_fil: "$.data.filing_status" } }
          trigger:
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "Setup: auto-escalated comm item opened the case; UNFOUNDED disposition kept ${c_fil} == NOT_REQUIRED"
            - "${err} == ERR_FILING_NOT_REQUIRED"
      - name: case_reopen_blocked_while_filing_submitted
        claim_type: precondition_enforcement
        grounds: ["state_machines.SurveillanceCase", "errors[ERR_FILING_IN_FLIGHT]"]
        distinguishing_aspect: "Cross-dimension gate: review reopen is forbidden while the filing dimension is SUBMITTED."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / case_parallel_dimensions_with_cycles"
          rationale: "Its trigger asserts ERR_FILING_IN_FLIGHT on reopen while SUBMITTED (capture reopen_err)."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: execution_quality_excludes_non_executed_orders
        claim_type: input_set_filtering
        grounds: ["calculations.calc_execution_quality"]
        distinguishing_aspect: "The snapshot input set counts EXECUTED orders only: a ROUTED order and a CANCELLED order in the same venue/type/month bucket contribute nothing to order_count or totals."
        test_recipe:
          setup: ["Venue + ACTIVE arrangement; O1 EXECUTED (BUY 100 @ 10005, NBBO 10000/10010); O2 ROUTED; O3 CANCELLED from RECEIVED; PROVISIONAL FAR_TOUCH snapshot"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "F1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "F2", symbol: "ACME", side: "BUY", quantity: 999, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "F3", symbol: "ACME", side: "SELL", quantity: 777, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o3: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o3}/transition", payload: { to_status: "CANCELLED" }, as: OpsAdmin }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin }
          trigger:
            - { call: "GET /surveillance/venues/${v_id}/execution-quality-snapshots", payload: { period_month: "2026-08" }, as: ComplianceAdmin, captures: { s_cnt: "$.data[0].order_count", s_qty: "$.data[0].total_quantity", s_tot: "$.data[0].total_improvement_cents" } }
          assert:
            - "${s_cnt} == 1 and ${s_qty} == 100 and ${s_tot} == 500.00 — ROUTED and CANCELLED orders are excluded"
      - name: execution_quality_month_window_half_open
        claim_type: boundary
        grounds: ["calculations.calc_execution_quality"]
        distinguishing_aspect: "Period window is half-open [month start, next month start): an execution at 2026-09-01T00:00:00Z exactly falls OUT of the 2026-08 snapshot."
        test_recipe:
          setup: ["Venue + ACTIVE arrangement with wide window; two EXECUTED orders: 2026-08-31T23:59:59Z and 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "W1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-31T23:59:59Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "W2", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-09-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin }
          trigger:
            - { call: "GET /surveillance/venues/${v_id}/execution-quality-snapshots", payload: { period_month: "2026-08" }, as: ComplianceAdmin, captures: { s_cnt: "$.data[0].order_count" } }
          assert:
            - "${s_cnt} == 1 — the 2026-09-01T00:00:00Z execution belongs to the next half-open month window"
      - name: late_filing_fee_boundaries_and_cap
        claim_type: boundary
        grounds: ["calculations.calc_late_filing_fee"]
        distinguishing_aspect: "Three precision points on the late-fee metric: submitted_at == due_at yields 0 (inclusive on-time boundary), due_at+1s yields the 50000 base fee (any lateness), due_at+86400s yields 55000, and due_at+200d hits the 500000 cap (50000+5000*200 = 1050000 -> capped)."
        test_recipe:
          setup: ["Case DISPOSITIONED (VIOLATION_CONFIRMED) at clock 2026-08-03T14:55:00Z; filing_due_at == 2026-09-02T14:55:00Z; filing DRAFT"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Fee Subject", employee_ref: "EMP-301", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "LX", terms: [ { term: "guarantee", weight: 100 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "EMAIL", author_employee_id: "${e_id}", body_text: "guarantee" }, as: OpsAdmin, captures: { ci: "$.data.id" } }
            - { call: "GET /surveillance/surveillance-cases", payload: { source_comm_item_id: "${ci}" }, as: SurveillanceAnalyst, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "UNDER_INVESTIGATION" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:55:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "DISPOSITIONED", disposition: "VIOLATION_CONFIRMED" }, as: SurveillanceAnalyst, captures: { due: "$.data.filing_due_at" } }
          trigger:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T14:55:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer, captures: { fee0: "$.data.late_fee_cents" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "DRAFT" }, as: FilingOfficer }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T14:55:01Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer, captures: { fee1: "$.data.late_fee_cents" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "DRAFT" }, as: FilingOfficer }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T14:55:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer, captures: { fee2: "$.data.late_fee_cents" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "DRAFT" }, as: FilingOfficer }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2027-03-21T14:55:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer, captures: { fee3: "$.data.late_fee_cents" } }
          assert:
            - "Due date pinned: ${due} == 2026-09-02T14:55:00Z (dispositioned_at + 30d)"
            - "Exactly at due: ${fee0} == 0 (<= boundary, on time)"
            - "One second late: ${fee1} == 50000 (base fee, floor(1s/86400) == 0 days)"
            - "One day late: ${fee2} == 55000 (50000 + 5000*1)"
            - "200 days late: ${fee3} == 500000 (cap binds: 50000 + 5000*200 = 1050000 -> 500000)"
      - name: front_running_reverse_scan_on_late_report
        claim_type: correct_result
        grounds: ["calculations.calc_front_running_score", "state_machines.PersonalTrade.APPROVED_to_EXECUTION_REPORTED"]
        distinguishing_aspect: "The reverse scan fires when the trade report lands AFTER the client execution: trade approved 14:00, client order executed 14:45, trade reported 15:10 with executed_at 14:30 — the report itself creates the alert (score 88)."
        test_recipe:
          setup: ["Employee; trade APPROVED at 14:00 (no report yet); client order EXECUTED at 14:45 (forward scan finds nothing)"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Rev Scan", employee_ref: "EMP-901", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 100 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "RS1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:50:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-03T14:45:00Z" }, as: OpsAdmin }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_trade_id: "${t_id}" }, as: SurveillanceAnalyst }
          trigger:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:10:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "EXECUTION_REPORTED", executed_price_cents: 10000, executed_at: "2026-08-03T14:30:00Z" }, as: CoveredEmployee, as_user_id: "${e_id}" }
