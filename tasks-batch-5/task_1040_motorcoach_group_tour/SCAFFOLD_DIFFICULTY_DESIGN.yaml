        distinguishing_aspect: "Conserved quantity = seat occupancy: Departure.confirmed_pax returns to its pre-confirm value (0) after confirm(+2) then cancel(-2); the forward and compensating actions leave the named quantity unchanged."
        test_recipe:
          setup:
            - "Departure OPEN with coach assigned min_pax 5; Booking pax 2 confirmed then cancelled."
          setup_api_calls:
            - call: "POST /api/tour-products"
