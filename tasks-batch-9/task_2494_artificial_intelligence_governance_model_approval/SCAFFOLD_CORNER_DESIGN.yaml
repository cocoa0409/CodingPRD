        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_precedes_business_fiscal_on_approve
          rationale: "The 1.8 instance already builds the one state in which both rules are simultaneously violated - a HIGH-tier approval whose reach would breach PORTFOLIO_HIGH_TIER_REACH_CAP while safety_flag is true from a FAILED BIAS run - and asserts that p22 answers first. A separate corner instance would need the same expensive portfolio fixture."

      - name: security_gate_clear_without_passed_redteam
        claim_type: error_triggerable
        grounds: ["errors[ERR_REQUIRED_EVALUATION_MISSING]", "validations[p23]", state_machines.ReviewGate.transitions.IN_REVIEW_to_CLEARED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / security_gate_clear_depends_on_evaluation_row_status
          rationale: "The 1.8 cross-entity instance already flips the SECURITY_REDTEAM evaluation between PLANNED, FAILED and PASSED against an unchanged gate to show that only the row's status decides between 422 ERR_REQUIRED_EVALUATION_MISSING and a clean clearance, on the HIGH-tier fixture that is the only tier with a SECURITY gate."

      - name: binding_created_against_registered_asset
        claim_type: error_triggerable
        grounds: ["errors[ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE]", "validations[p30]", "endpoints[POST /use-cases/{id}/model-bindings]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / binding_creation_depends_on_model_asset_status
          rationale: "The p30 route into this code is exactly what the 1.8 cross-entity instance walks: the same binding request is refused against a REGISTERED asset, refused again after the asset is RESTRICTED, and accepted once it reaches APPROVED_FOR_USE. The p20 route into the same code is covered live above by approve_for_use_twice_asset_not_approvable."

      - name: disclosure_window_conflict_inside_quiet_buffer
        claim_type: error_triggerable
        grounds: ["errors[ERR_DISCLOSURE_WINDOW_CONFLICT]", "validations[p35]", calculations.window_conflict_detection]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / disclosure_notice_windows_closed_with_quiet_buffer_per_jurisdiction
          rationale: "The 1.8 temporal-overlap instance already probes the closed-interval semantics at the boundary: an adjacent window, a window starting inside DISCLOSURE_QUIET_BUFFER_DAYS and the first accepted start date, plus the jurisdiction and notice_type key that keeps two notices from colliding at all."

      - name: evaluation_window_conflict_on_shared_asset
        claim_type: error_triggerable
        grounds: ["errors[ERR_EVALUATION_WINDOW_CONFLICT]", "validations[p36]", calculations.window_conflict_detection]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / evaluation_windows_half_open_on_shared_model_asset
          rationale: "The half-open semantics, the fact that the conflict key is the ModelAsset rather than the binding or the use case, and the release of a window by a VOIDED evaluation are all exercised by the 1.8 instance; a corner instance could only restate its assertions."

  # ===========================================================================
  # 7. RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: governance_officer_exclusive_registry_and_classification_operations
        claim_type: exclusive_operations
        grounds: [roles.GovernanceOfficer.exclusive_operations, "endpoints[POST /use-cases/{id}/classify]", "endpoints[GET /inventory-summary]"]
        distinguishing_aspect: "One GovernanceOfficer identity performs the whole registry-and-classification block - register asset, approve for use, classify, bind, read the ledger, read the inventory summary - and every call returns its declared success code."
        test_recipe:
          setup: ["Empty database, clock pinned, one MINIMAL intake filed by usr_req_1 so there is something to classify."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
          trigger:
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${ucm_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}/ledger-entries", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "POST /model-assets -> 201, approve-for-use -> 200 with version 2, classify -> 200 with risk_tier MINIMAL, model-bindings -> 201 with pinned_model_version 2"
            - "GET /use-cases/{uc_m}/ledger-entries -> 200 with 0 rows (nothing ledgerable has happened yet)"
            - "GET /inventory-summary -> 200 with inventory_count 0, portfolio_approved_reach 0, control_debt_index_total 0.00, unapproved_shadow_count 0"
            - "no other role appears anywhere in the trigger block"

      - name: business_reviewer_exclusive_business_gate_operations
        claim_type: exclusive_operations
        grounds: [roles.BusinessReviewer.exclusive_operations, "endpoints[POST /review-gates/{id}/start-review]", "endpoints[POST /review-gates/{id}/issue-conditions]"]
        distinguishing_aspect: "The BusinessReviewer drives its own gate through the full loop start-review -> issue-conditions -> start-review -> clear, and each call is accepted on a gate whose gate_type is BUSINESS."
        test_recipe:
          setup: ["MINIMAL use case classified by usr_gov_1, so exactly one PENDING BUSINESS gate exists."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
          trigger:
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/issue-conditions", payload: {conditions: ["quantify the deflection benefit", "name the accountable owner"], decision_note: "value case not yet evidenced"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "conditions answered out of band"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
          assert:
            - "every call returns 200 and the gate ends CLEARED at version 5 with assigned_reviewer_user_id usr_biz_1 and cleared_by_user_id usr_biz_1"
            - "the issue-conditions step set open_condition_count 2 and control_debt_index 0.25 (0.75 * 2/3 * 0.5 for a MINIMAL BUSINESS gate) and pushed the use case UNDER_REVIEW -> CHANGES_REQUESTED"
            - "the second start-review zeroed open_condition_count and control_debt_index and returned the use case to UNDER_REVIEW"
            - "the clear left control_debt_index 0.00, debt_before_clear 0.00 and bubbled the use case to READY_FOR_APPROVAL"

      - name: requester_and_officer_share_the_disclosure_notice_surface
        claim_type: shared_operations
        grounds: [roles.Requester.shared_operations, roles.GovernanceOfficer.shared_operations, "endpoints[POST /use-cases/{id}/disclosure-notices]", "endpoints[POST /disclosure-notices/{id}/withdraw]"]
        distinguishing_aspect: "Both the Requester and the GovernanceOfficer can publish a notice on the same use case and either can withdraw one - the two identities are interchangeable on this pair of endpoints, unlike the gate and approval surfaces."
        test_recipe:
          setup: ["A use case deployed in the EU and the US_CA, classified; the two notices use different jurisdictions so the window rule at p35 (keyed on notice_type plus jurisdiction) cannot interfere."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Applicant screening ranker", business_unit: "HR", description: "ranks external applicants for recruiter shortlisting", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: ["EU", "US_CA"], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_eu: "$.data.id", uceu_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uceu_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uceu_v2: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "EMPLOYMENT_SCREENING_NOTICE", jurisdiction: "EU", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn_eu: "$.data.id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "EMPLOYMENT_SCREENING_NOTICE", jurisdiction: "US_CA", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 1}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {dn_ca: "$.data.id"}}
            - {call: "POST /disclosure-notices/{id}/withdraw", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "risk_score == 52 (EU is high-scrutiny, US_CA is not) and required_gate_types == [PRIVACY, BUSINESS]"
            - "both creates return 201 with status PUBLISHED and version 1"
            - "the withdraw of the EU notice returns 200 with status WITHDRAWN, withdrawn_at 2026-08-01T00:00:00Z and version 2 - an officer may withdraw a notice a requester published"
            - "GET /use-cases/{uc_eu}/disclosure-notices?status=PUBLISHED returns exactly the US_CA row"

      - name: security_reviewer_and_officer_share_the_evaluation_surface
        claim_type: shared_operations
        grounds: [roles.SecurityReviewer.shared_operations, roles.GovernanceOfficer.shared_operations, "endpoints[POST /test-evaluations]", "endpoints[POST /test-evaluations/{id}/complete]"]
        distinguishing_aspect: "A SecurityReviewer may plan an evaluation that a GovernanceOfficer then completes, and the reverse also holds - the testing programme is the one place where a reviewer role and the officer write the same rows."
        test_recipe:
          setup: ["LIMITED use case with a PINNED binding on an approved first-party asset; two non-overlapping half-open windows are reserved so the p36 window rule cannot fire."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${uc_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
          trigger:
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {ev_bias: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {worst_group_parity_ratio: 0.7000, sample_size: 300}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc}", model_binding_id: "${bind}", eval_type: "ROBUSTNESS", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ev_rob: "$.data.id"}}
            - {call: "POST /test-evaluations/{id}/complete", payload: {adversarial_pass_rate: 0.8200, sample_size: 400}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
          assert:
            - "both creates return 201 and both completes return 200 - neither endpoint cares which of the two roles calls it"
            - "the BIAS row ends PASSED: 0.7000 is exactly the LIMITED threshold 0.70 and 300 is exactly MIN_SAMPLE_SIZE[LIMITED], and both comparisons are >="
            - "the ROBUSTNESS row ends PASSED against threshold 0.80 with sample_size 400"
            - "the second window starts exactly when the first ends, and the half-open semantics of p36 accept it"
            - "use_case.safety_flag == false after the PASSED BIAS run"

      - name: requester_cannot_classify_forbidden
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: [roles.GovernanceOfficer.exclusive_operations, "errors[ERR_UNAUTHORIZED]", "validations[p2]"]
        distinguishing_aspect: "classify is exclusive to the GovernanceOfficer, so the Requester who filed the intake is refused 403 ERR_UNAUTHORIZED before the version rule at p9 or the DRAFT rule at p11 is consulted."
        test_recipe:
          setup: ["One MINIMAL intake in DRAFT filed by usr_req_1, with the correct current version captured so that only the role can be at fault."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: Requester, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the use case is still DRAFT at version 1 with risk_score null and risk_tier null"
            - "no ClassificationSnapshot and no ReviewGate row was created"

      - name: business_reviewer_cannot_approve_forbidden
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: [roles.GovernanceOfficer.exclusive_operations, "errors[ERR_UNAUTHORIZED]", "endpoints[POST /use-cases/{id}/approve]"]
        distinguishing_aspect: "Approval is exclusive to the GovernanceOfficer: the BusinessReviewer who just cleared the last gate is refused 403 ERR_UNAUTHORIZED, which is a role denial and not the identity-based ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
