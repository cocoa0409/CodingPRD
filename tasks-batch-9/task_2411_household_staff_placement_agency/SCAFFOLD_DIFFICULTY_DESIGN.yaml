  - name: background_inconclusive_self_loop_then_flagged_adjudication_halves_the_points
    grounds: state_machines.BackgroundVerification (INITIATED -> INCONCLUSIVE, INCONCLUSIVE -> INCONCLUSIVE, INCONCLUSIVE
      -> FLAGGED, FLAGGED -> ADJUDICATED_PASS); calculations.candidate_vetting_score constants CLEARED_BACKGROUND_POINTS
      / ADJUDICATED_PASS_BACKGROUND_POINTS
    mechanism: 'The background machine is neither linear nor acyclic: INCONCLUSIVE re-runs loop onto themselves and
      increment rerun_count, the row can then fork to FLAGGED, and only from FLAGGED can it be adjudicated. An ADJUDICATED_PASS
      clears the candidate but is worth 10 score points where a clean CLEARED result is worth 20, so the path taken
      through the machine is still visible in the score afterwards.'
    naive_implementation: Treat every non-failing background outcome as equivalent (or forbid re-runs), so the candidate
      ends with the 20-point CLEARED credit and a score of 94 regardless of the path.
    distinguishing_aspect: The candidate reaches vetting_status CLEARED through two INCONCLUSIVE re-runs and an adjudicated
      waiver, and placement_ready_score is 84 rather than the 94 a directly CLEARED background would give.
