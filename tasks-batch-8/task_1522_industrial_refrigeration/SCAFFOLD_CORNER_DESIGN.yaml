              captures: { emp_b: $.data.id }
            - call: "POST /psm/training-records"
              payload: { employee_id: "${emp_a}", topic: "AMMONIA_OPERATOR", completed_at: "2023-10-31T00:00:00Z" }
              as: PsCoordinator
              captures: { tr_a: $.data.id }
            - call: "POST /psm/training-records"
              payload: { employee_id: "${emp_b}", topic: "AMMONIA_OPERATOR", completed_at: "2023-08-02T00:00:00Z" }
              as: PsCoordinator
              captures: { tr_b: $.data.id }
          trigger:
            - call: "GET /psm/training-records/${tr_a}"
              as: PsCoordinator
              captures: { exp_a: $.data.expires_at, cur_a: $.data.currency }
            - call: "GET /psm/training-records/${tr_b}"
              as: PsCoordinator
              captures: { exp_b: $.data.expires_at, cur_b: $.data.currency }
          assert:
            - "Record A: expires_at == '2026-10-30T00:00:00Z' (2023-10-31 + 1095 days), currency == 'EXPIRING_SOON' (exactly 90 days out, <=)"
            - "Record B: expires_at == '2026-08-01T00:00:00Z', currency == 'EXPIRED' (now >= expires_at at exact equality)"

      - name: inspection_fail_forces_thirty_day_recheck
        claim_type: correct_result
        grounds: [calculations.inspection_due_date, entities.Equipment.fields.integrity_status]
        distinguishing_aspect: "CONDITION_BASED FAIL overrides the interval entirely: next_due_at = completed + 30 days (not the 180-day base or 270-day extension) and integrity becomes FAILED."
        test_recipe:
