              payload: { quantification_run_id: "${r1_id}", verification_body_id: "${vb1_id}", sample_pct: 20.00, site_visit_start: "2026-11-02T00:00:00Z", site_visit_end: "2026-11-06T00:00:00Z" }
              as: ProgramAdmin
