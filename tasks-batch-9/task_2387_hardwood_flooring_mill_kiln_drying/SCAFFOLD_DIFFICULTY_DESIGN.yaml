          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-chambers/${chamber_id}/complete_maintenance", payload: {}, as: KilnOperator }
