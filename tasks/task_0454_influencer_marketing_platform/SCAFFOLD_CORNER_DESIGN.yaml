  # =================================================================
  # Excluded stubs (already covered by §1.8 difficulty instances)
  # =================================================================
  - section: state_machines
    instances:
      - name: settle_cascade_to_contract_and_creator_stub
        claim_type: Bubble up
        grounds: [state_machines.Contract.FULFILLED_to_SETTLED]
        excluded_because:
          difficulty_instance: transitive_cascade / settle_cascade_to_contract_creator_and_1099
          rationale: "The payout-settle -> contract SETTLED -> creator/campaign reconcile cascade is fully asserted by the named §1.8 instance."

  - section: calculations
