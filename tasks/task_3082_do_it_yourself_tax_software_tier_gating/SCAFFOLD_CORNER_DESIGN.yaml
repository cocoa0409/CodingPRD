# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 3082: DIY Tax Software Tier Gating & Free-File Eligibility
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Catalog fixture where needed: tiers FREE(0c/0c, rank 0), PREMIER(12999c/4999c,
# rank 2); FormSpec F1040(FREE, dq=false), W2_WH(FREE, dq=false,
# counts_toward_refund=true), SCH_D(PREMIER, dq=true). Bank partners
# BANK_A/BANK_B; disclosure RTD-2026-1; default logical clock 2026-09-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: account_creation_applies_defaults
        claim_type: creation_with_defaults
        grounds: [entities.TaxpayerAccount.fields.status, entities.TaxpayerAccount.fields.accuracy_guarantee_enrolled, entities.TaxpayerAccount.fields.disclosure_accepted_version]
        distinguishing_aspect: "POST /tax/accounts with only required inputs returns 201 with system defaults applied: status=ACTIVE, accuracy_guarantee_enrolled=true, disclosure_accepted_version=null."
        test_recipe:
          setup: ["Empty database; no catalog needed"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/accounts"
              payload: { email: "ent1@x.com", full_name: "Ent One", filing_status: "SINGLE", agi_cents: 5000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
          assert:
            - "TaxpayerAccount.${acct_id}.status == ACTIVE"
            - "TaxpayerAccount.${acct_id}.accuracy_guarantee_enrolled == true"
            - "TaxpayerAccount.${acct_id}.disclosure_accepted_version == null"
            - "TaxpayerAccount.${acct_id}.version == 1"

      - name: account_creation_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - "entities.TaxpayerAccount.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required agi_cents yields ERR_INVALID_REQUEST (400); nothing is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/accounts"
              payload: { email: "ent2@x.com", full_name: "Ent Two", filing_status: "SINGLE", resident_state_code: "CA" }
              as: Taxpayer
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_REQUEST"

      - name: get_nonexistent_return_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_RETURN_NOT_FOUND]"
          - "endpoints[GET /tax/returns/{returnId}]"
        distinguishing_aspect: "GET with a well-formed but unknown returnId yields 404 ERR_RETURN_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /tax/returns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Taxpayer
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_RETURN_NOT_FOUND"

      - name: snapshot_supersession_on_reregistration
        claim_type: computed_field_correctness
        grounds: [state_machines.PriorYearReturnSnapshot.AVAILABLE_to_SUPERSEDED, entities.PriorYearReturnSnapshot.fields.import_status]
        distinguishing_aspect: "Registering a second snapshot for the same (account, tax_year) flips the first from AVAILABLE to SUPERSEDED while the new one starts AVAILABLE; only the newest is importable."
        test_recipe:
          setup: ["Account A exists"]
          setup_api_calls:
            - call: "POST /tax/accounts"
              payload: { email: "ent3@x.com", full_name: "Ent Three", filing_status: "SINGLE", agi_cents: 5000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "BASIS"
                    asset_tag: "lot-1"
                    remaining_amount_cents: 100000
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { snap_old: $.data.id }
          trigger:
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "BASIS"
                    asset_tag: "lot-1"
                    remaining_amount_cents: 150000
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { snap_new: $.data.id }
          assert:
            - "PriorYearReturnSnapshot.${snap_old}.import_status == SUPERSEDED"
            - "PriorYearReturnSnapshot.${snap_new}.import_status == AVAILABLE"

      - name: prompt_price_delta_frozen_at_creation
        claim_type: computed_field_correctness
        grounds: [entities.UpgradePrompt.fields.price_delta_cents, calculations.minimum_tier_classification]
        distinguishing_aspect: "price_delta_cents is stamped once at prompt creation (PREMIER 12999 - FREE 0 = 12999) and does not move when later events recompute the minimum tier."
        test_recipe:
          setup: ["Catalog seeded; account A with return R holding ACTIVE F1040 + SCH_D (prompt P created FREE->PREMIER)"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "ent4@x.com", full_name: "Ent Four", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: 1000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { schd_form: $.data.id, ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
          trigger:
            - call: "POST /tax/returns/${ret_id}/forms/${schd_form}/remove"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "UpgradePrompt.${prompt_id}.price_delta_cents == 12999 (frozen even though the minimum tier later collapsed back to FREE)"
            - "UpgradePrompt.${prompt_id}.status == SUPERSEDED (removal dropped the minimum to current_tier, auto-resolving the pending prompt)"
            - "TaxReturn.${ret_id}.minimum_required_tier == FREE"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: amend_blocked_until_authority_acceptance
        claim_type: invalid_transition
        grounds:
          - "state_machines.TaxReturn.ACCEPTED_to_AMENDED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST amend on a DRAFT return (never ACCEPTED) is rejected; only a return with an ACCEPTED filing may amend."
        test_recipe:
          setup: ["Catalog seeded; account A with return R(2025, DRAFT) holding ACTIVE F1040"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm1@x.com", full_name: "Sm One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "TaxReturn.${ret_id}.status == DRAFT"

      - name: reopen_while_filing_pending_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.TaxReturn.READY_FOR_REVIEW_to_DRAFT"
          - "validations[priority=13]"
          - "errors[ERR_FILING_IN_FLIGHT]"
        distinguishing_aspect: "Reopen from SUBMITTED with a PENDING FilingAttempt fails with ERR_FILING_IN_FLIGHT; the return stays SUBMITTED."
        test_recipe:
          setup: ["Catalog seeded; account A; return R filed (SUBMITTED) with one PENDING FilingAttempt"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm2@x.com", full_name: "Sm Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/reopen"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_FILING_IN_FLIGHT"
            - "TaxReturn.${ret_id}.status == SUBMITTED"

      - name: prompt_double_acknowledge_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.UpgradePrompt.PENDING_to_ACKNOWLEDGED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Acknowledging an already-ACKNOWLEDGED prompt is rejected; the second call is a no-op error with no further tier or fee change."
        test_recipe:
          setup: ["Catalog seeded; account A; return R with prompt P already ACKNOWLEDGED (current_tier=PREMIER, fees 12999)"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm3@x.com", full_name: "Sm Three", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: 1000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/acknowledge"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/acknowledge"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 12999 (no double charge)"
            - "TaxReturn.${ret_id}.current_tier == PREMIER"

      - name: decline_blocked_by_imported_carryforward_gap
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.UpgradePrompt.PENDING_to_DECLINED_DOWNGRADED"
          - "errors[ERR_DOWNGRADE_WOULD_LEAVE_GAP]"
        distinguishing_aspect: "Decline refuses to auto-remove IMPORTED carryforward forms: when the prompt's offending form is IMPORTED (F4562 from a depreciation carryforward), decline is rejected until the form is explicitly removed."
        test_recipe:
          setup: ["Catalog seeded (incl. F4562 PREMIER/dq); account A; return R(2025); snapshot S(2024) with one DEPRECIATION item (50000c) imported, creating prompt P FREE->PREMIER"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F4562", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm4@x.com", full_name: "Sm Four", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "DEPRECIATION"
                    asset_tag: "truck"
                    remaining_amount_cents: 50000
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { snap_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots/${snap_id}/import"
              payload: { return_id: "${ret_id}", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
          trigger:
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/decline"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_DOWNGRADE_WOULD_LEAVE_GAP"
            - "UpgradePrompt.${prompt_id}.status == PENDING"
            - "TaxReturn.${ret_id}.minimum_required_tier == PREMIER"

      - name: claim_terminal_lockdown_after_pay
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AccuracyClaim.APPROVED_to_PAID"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After PAID (terminal), reopen-review and further adjudication are both rejected; reimbursement is locked."
        test_recipe:
          setup: ["Catalog seeded; account A with ACCEPTED return; claim C filed for 8000c, reviewed, adjudicated APPROVED at 8000c, then PAID"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm5@x.com", full_name: "Sm Five", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "ACCEPTED" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/claims"
              payload: { claimed_error_amount_cents: 8000 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /tax/claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /tax/claims/${claim_id}/adjudicate"
              payload: { reviewed_error_amount_cents: 8000 }
              as: ClaimsAdjuster
            - call: "POST /tax/claims/${claim_id}/pay"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /tax/claims/${claim_id}/reopen-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "AccuracyClaim.${claim_id}.status == PAID"
            - "AccuracyClaim.${claim_id}.reimbursement_cents == 8000"

      - name: superseded_snapshot_import_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SNAPSHOT_SUPERSEDED]"
          - "validations[priority=16]"
        distinguishing_aspect: "Importing a SUPERSEDED snapshot is rejected with ERR_SNAPSHOT_SUPERSEDED; only the newest registration per (account, tax_year) is importable."
        test_recipe:
          setup: ["Catalog seeded; account A; return R(2025); snapshot S1(2024) superseded by re-registration S2(2024)"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "sm6@x.com", full_name: "Sm Six", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "BASIS"
                    asset_tag: "lot-1"
                    remaining_amount_cents: 100000
