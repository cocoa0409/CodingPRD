            - "${net2} == ${net1} and ${funded2} == ${funded1} and ${out2} == ${out1} and ${wo2} == ${wo1}"
            - "${gross2} == ${gross1} and ${prov2} == ${prov1} and ${final2} == ${final1} and ${alerts2} == ${alerts1} and ${conf2} == ${conf1}"
            - "${p_v2} == ${p_v1} and ${p_restatements} == 0 — neither read bumped the version nor counted as a restatement"

      - name: bulk_request_info_clears_identity_and_returns_the_order_to_pending
        claim_type: conditional_action
        grounds:
          - endpoints[POST /bulk-purchase-orders/{id}/decide]
          - state_machines.BulkPurchaseOrder.IDENTITY_VERIFIED_to_PENDING_IDENTITY
          - entities.BulkPurchaseOrder.fields.info_request_count
          - validations[priority=60]
        distinguishing_aspect: "REQUEST_INFO is not a decision but a reversal of the identity step: it moves IDENTITY_VERIFIED -> PENDING_IDENTITY, nulls all three identity fields, bumps info_request_count, and — because the order's total 102250 is above the identity threshold — makes the next APPROVE fail again with 422 until a new ID is captured."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN."
            - "One BulkPurchaseOrder of 20 cards at 5000 each (subtotal 100000, 225 bps, fee 2250, total 102250), advanced to IDENTITY_VERIFIED by one identity capture."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Request Info Store", region_code: "NW", address_line: "43 Info Ln" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 20, face_value_cents_each: 5000, purchaser_name: "Northwind Rewards Co", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { order_id: $.data.id, o_state0: $.data.state, o_total: $.data.total_cents, o_v0: $.data.version, o_info0: $.data.info_request_count }
            - call: "POST /bulk-purchase-orders/${order_id}/identity-verification"
              payload: { id_type: "PASSPORT", id_number_hash: "idh-72-a", id_expiry_date: "2031-01-31" }
              as: PosAssociate
              captures: { o_state1: $.data.state, o_v1: $.data.version, o_hash1: $.data.identity_id_number_hash }
          trigger:
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "REQUEST_INFO", decision_note: "passport image unreadable" }
              as: RiskManager
              as_user_id: "risk-72"
              captures: { o_state2: $.data.state, o_v2: $.data.version, o_info2: $.data.info_request_count, o_type2: $.data.identity_id_type, o_hash2: $.data.identity_id_number_hash, o_exp2: $.data.identity_id_expiry_date }
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "APPROVE", decision_note: "approving without the replacement ID" }
              as: RiskManager
              as_user_id: "risk-72"
              captures: { err: $.data.error_id }
            - call: "POST /bulk-purchase-orders/${order_id}/identity-verification"
              payload: { id_type: "PASSPORT", id_number_hash: "idh-72-b", id_expiry_date: "2031-01-31" }
              as: PosAssociate
              captures: { o_state3: $.data.state, o_v3: $.data.version, o_hash3: $.data.identity_id_number_hash }
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "APPROVE", decision_note: "replacement ID accepted" }
              as: RiskManager
              as_user_id: "risk-72"
              captures: { o_state4: $.data.state, o_v4: $.data.version, o_decider: $.data.decided_by_user_id }
          assert:
            - "${o_total} == 102250 and ${o_state0} == PENDING_IDENTITY and ${o_info0} == 0"
            - "${o_state1} == IDENTITY_VERIFIED and ${o_hash1} == idh-72-a"
            - "first trigger call: HTTP status == 200 and ${o_state2} == PENDING_IDENTITY"
            - "${o_type2} == null and ${o_hash2} == null and ${o_exp2} == null — REQUEST_INFO wipes the captured identity"
            - "${o_info2} == 1"
            - "second trigger call: HTTP status == 422 and ${err} == ERR_IDENTITY_VERIFICATION_REQUIRED"
            - "${o_state3} == IDENTITY_VERIFIED and ${o_hash3} == idh-72-b"
            - "fourth trigger call: HTTP status == 200 and ${o_state4} == APPROVED and ${o_decider} == risk-72"
            - "${o_v1} == ${o_v0} + 1 and ${o_v2} == ${o_v1} + 1 and ${o_v3} == ${o_v2} + 1 and ${o_v4} == ${o_v3} + 1 — the rejected APPROVE bumped nothing"
            - "BulkPurchaseOrder.${order_id}.info_request_count == 1 — approval does not clear the counter"

      - name: referrals_are_scoped_to_the_alert_they_were_filed_against
        claim_type: cross_reference_link
