scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: bundle_case_payable_locked_vs_repriced_basis
    grounds:
    - calculations.claim_adjudication
    - calculations.price_basis_determination
    - state_machines.Episode.SOR_PENDING_to_APPROVED
    - entities.Episode.fields.applied_bundle_price_cents
    distinguishing_aspect: 'Entity domain: Claim (bundle case-rate payable). The same

      billed_cents adjudicates to a different payable depending on which

      price basis variant the episode locked at approval — LOCKED (original

      contract price) vs REPRICED (latest amendment) — a fiscal dual-variant

      on claims, not a provisional/final copy.

      '
    test_recipe:
      setup:
      - Clock 2026-09-01. Employer with baseline rate book; ACTIVE contract (price 3000000 cents, outlier threshold 5000000, share 0%). Two episodes reach SOR_PENDING.
      - Contract repriced to 3200000 cents (amendment effective at seq 1). Episode A approved immediately (approve seq 2, gap 1 < 30 -> LOCKED at 3000000), then its day counter burned 28 steps and it is
        driven to POST_OP_TRACKING.
      - Episode B approved after the burn (approve seq 31, gap 30 >= 30 -> REPRICED at 3200000) and driven to POST_OP_TRACKING. Each episode gets a BUNDLE_CASE claim with identical billed_cents 4000000.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-DV1
          rates:
            ORTHO_JOINT: 2500000
            CARDIAC: 9000000
            BARIATRIC: 4000000
            SPINE: 6000000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Acme
          ein: E-DV1
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 2400000
            professional: 300000
            implant: 200000
            anesthesia: 100000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
          ctr_v: $.data.version
      - call: POST /coe/contracts/${ctr}/activate
        payload: {}
        as: ProgramAdmin
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat A
          dob: '1970-01-01'
          member_id: M-DV1-A
        as: CareCoordinator
        captures:
          pa: $.data.id
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat B
          dob: '1971-01-01'
          member_id: M-DV1-B
        as: CareCoordinator
        captures:
          pb: $.data.id
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-DV1-A
        as: CareCoordinator
        captures:
          epa: $.data.id
          epa_v: $.data.version
      - call: POST /coe/episodes
        payload:
          patient_id: ${pb}
          contract_id: ${ctr}
          intake_request_id: IR-DV1-B
        as: CareCoordinator
        captures:
          epb: $.data.id
          epb_v: $.data.version
      - call: POST /coe/episodes/${epa}/screenings
        payload:
          doc_type: IMAGING
          result: CANDIDATE
        as: CareCoordinator
      - call: POST /coe/episodes/${epb}/screenings
        payload:
          doc_type: IMAGING
          result: CANDIDATE
        as: CareCoordinator
      - call: POST /coe/contracts/${ctr}/reprice
        payload:
          expected_contract_version: ${ctr_v}
          new_bundle_price_cents: 3200000
          new_rate_components:
            facility: 2600000
            professional: 300000
            implant: 200000
            anesthesia: 100000
        captures:
          occ_v1: $.data.version
        as: ProgramAdmin
      - call: POST /coe/episodes/${epa}/reviews
        payload:
          conclusion: SURGERY_INDICATED
          expected_episode_version: ${epa_v}
        captures:
          epa_v2: $.data.version
        as: PhysicianReviewer
      - call: POST /coe/episodes/${epa}/advance-day
