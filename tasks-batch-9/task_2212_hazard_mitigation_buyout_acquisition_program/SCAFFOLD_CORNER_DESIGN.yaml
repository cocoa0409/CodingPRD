      - name: an_absent_x_user_id_header_is_unauthenticated_before_any_role_check_runs
        claim_type: exclusive_operations
        grounds:
          - validations.priority_1
          - validations.priority_2
        distinguishing_aspect: |
          Priority 1 outranks priority 2, so a request with no X-User-ID gets ERR_UNAUTHENTICATED (401)
          even when the role header also names a role that would not be permitted, and even when the
          body is malformed - and the clock endpoint is the single exception that accepts an
          unauthenticated caller.
        test_recipe:
          setup:
            - "One DRAFT MitigationProject."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
