scaffold_corner_design:
- section: entities
  instances:
  - name: ent_account_create_returns_201_with_zeroed_counters
    claim_type: creation
    grounds:
    - entities.TeamAccount.fields.tasks_used_current
    - entities.TeamAccount.fields.overage_amount_cents
    - endpoints.POST /zapier/accounts
    distinguishing_aspect: A newly created TeamAccount starts with both metering counters zeroed and status-free.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /zapier/accounts
        payload:
          name: Zero Co
          plan_code: TEAM_FREE
          task_allowance: 5
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      assert:
      - the created account has tasks_used_current == 0
      - overage_amount_cents == 0 and overage_tasks_used == 0
      - usage_pct_current == 0.0
  - name: ent_get_account_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_ACCOUNT_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: An unknown account id is reported as ERR_ACCOUNT_NOT_FOUND rather than returning an empty object.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: &id001
      - call: POST /zapier/accounts
        payload:
          name: C1
          plan_code: TEAM_PRO
          task_allowance: 10
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: GET /zapier/accounts/00000000-0000-4000-8000-000000000000
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the read returns error_id ERR_ACCOUNT_NOT_FOUND
  - name: ent_member_register_snapshots_plan_code
    claim_type: computed_fields
    grounds:
    - entities.Member.fields.plan_code
    - endpoints.POST /zapier/members/register
    distinguishing_aspect: Member.plan_code is copied from the parent account at registration and ignores any client-supplied value.
    test_recipe:
      setup:
      - TeamAccount with plan_code TEAM_PRO
      setup_api_calls: *id001
      trigger:
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: snap@c1.test
          full_name: Snap Shot
          role: MEMBER
        as: PlatformAdmin
        captures:
          m2: $.data.id
      assert:
      - the new member's plan_code == TEAM_PRO
      - the member starts with role MEMBER when role is omitted or supplied
  - name: ent_workflow_create_status_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Workflow.fields.status
    - state_machines.Workflow.initial_state
    distinguishing_aspect: A client-supplied status on workflow creation is ignored; the server always mints DRAFT.
    test_recipe:
      setup:
      - TeamAccount with a folder
      setup_api_calls: *id001
      trigger:
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: Sneaky
          folder_id: ${fld_id}
          trigger_type: WEBHOOK
          status: ACTIVE
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_new: $.data.id
      assert:
      - the created workflow's status == DRAFT despite the injected status
  - name: ent_folder_create_missing_required_account_id_returns_400
    claim_type: required_fields
    grounds:
    - endpoints.POST /zapier/folders
    - errors[ERR_ACCOUNT_NOT_FOUND]
    distinguishing_aspect: Omitting the required account_id on folder creation is rejected rather than defaulting.
    test_recipe:
      setup:
      - one account exists
      setup_api_calls: *id001
      trigger:
      - call: POST /zapier/folders
        payload:
          name: No Owner
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the create does not return a folder id
      - the response is an error envelope rather than a created Folder
  - name: ent_job_event_has_no_version_field
    claim_type: immutability
    grounds:
    - entities.JobEvent.common_fields
    - endpoints.GET /zapier/job-events
    distinguishing_aspect: JobEvent is append-only with common_fields false, so its rows expose no version field for update conflicts.
    test_recipe:
      setup:
      - a workflow run has produced at least one job event
      setup_api_calls: *id001
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      - call: GET /zapier/job-events?action_id=${act1}
        as: Member
        as_user_id: ${mem_id}
        captures:
          ev_id: $.data[0].id
      assert:
      - the event list returns at least one JobEvent whose id is ${ev_id}
      - the returned JobEvent carries no version field
- section: state_machines
  instances:
  - name: sm_activate_already_active_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Workflow.DRAFT_to_ACTIVE
    - errors[ERR_WORKFLOW_INVALID_STATE]
    - validations[priority=10]
    distinguishing_aspect: Activating an already ACTIVE workflow is refused; the DRAFT-to-ACTIVE transition has no ACTIVE-to-ACTIVE edge.
    test_recipe:
      setup:
      - one activated workflow
      setup_api_calls: &id011
      - &id002
        call: POST /zapier/accounts
        payload:
          name: C2
          plan_code: TEAM_PRO
          task_allowance: 10
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - &id003
        call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - &id004
        call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - &id005
        call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - &id006
        call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - &id007
        call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - &id008
        call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - &id009
        call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - &id010
        call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the repeat activation returns error_id ERR_WORKFLOW_INVALID_STATE
      - Workflow.${wf_id}.status remains ACTIVE
  - name: sm_disabled_workflow_cannot_activate
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Workflow.terminal_states
    - state_machines.Workflow.DRAFT_to_DISABLED
    distinguishing_aspect: DISABLED is terminal, so no transition out of it exists and activation is refused.
    test_recipe:
      setup:
      - one workflow disabled while still DRAFT
      setup_api_calls:
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - call: POST /zapier/workflows/${wf_id}/disable
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the activation returns error_id ERR_WORKFLOW_INVALID_STATE
      - Workflow.${wf_id}.status remains DISABLED
  - name: sm_workflow_created_in_draft
    claim_type: initial_state
    grounds:
    - state_machines.Workflow.initial_state
    - entities.Workflow.fields.status
    distinguishing_aspect: Workflow.initial_state is DRAFT, so a fresh workflow cannot run before activation.
    test_recipe:
      setup:
      - TeamAccount with a folder
      setup_api_calls:
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the DRAFT workflow's status == DRAFT
      - dispatching a run returns error_id ERR_WORKFLOW_INVALID_STATE or ERR_NO_RUNNABLE_ACTION
  - name: sm_activate_sets_action_count_side_effect
    claim_type: side_effect_execution
    grounds:
    - state_machines.Workflow.DRAFT_to_ACTIVE
    - entities.Workflow.fields.action_count
    distinguishing_aspect: Attaching an action raises Workflow.action_count, and activation requires that count to be at least one.
    test_recipe:
      setup:
      - one DRAFT workflow with one attached action
      setup_api_calls: *id011
      trigger:
      - call: GET /zapier/workflows/${wf_id}
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf: $.data
      assert:
      - wf.action_count == 1
      - wf.status == ACTIVE after the setup activation
- section: calculations
