          setup:
            - "Retailer BIGMART (1200 stores); principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement and slotting_budget_cents 20000000; item I1 VALIDATED; review OPEN with deadline 2026-08-20 and window [2026-09-01, 2026-09-15); presentation SUBMITTED."
