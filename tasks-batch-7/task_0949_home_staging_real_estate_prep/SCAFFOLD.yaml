    side_effects: ["Listing UNDER_CONTRACT -> CLOSED_SOLD with closed_at set", "Invoice DEFERRED_CLOSING -> ISSUED with due_date := closed_at + INVOICE_DUE_DAYS days", "Project.payment_state DEFERRED -> INVOICED"]
  - method: POST
    path: "/staging/listings/{listing_id}/terminate"
