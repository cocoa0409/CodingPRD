              call: "GET /licensing/harvest-lots/${h1_id}"
              payload: {}
              as: SettlementOfficer
            - &k_h3_get
              call: "GET /licensing/harvest-lots/${h3_id}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "PoolPeriod.${pool_id}: at close total_net_kg == 3950, total_weighted_kg == 4122.5, gross_pool_revenue_cents == 1975000, marketing_fee_cents == 118500, net_pool_revenue_cents == 1856500, provisional_pool_rate == 450.3335"
            - "PoolPeriod.${pool_id}: after settle gross_pool_revenue_cents == 2054000, marketing_fee_cents == 123240, net_pool_revenue_cents == 1930760, final_pool_rate == 468.3469, pool_distributable_cents == 1930760"
            - "provisional_pool_rate 450.3335 != final_pool_rate 468.3469 — identical lots, two valid algorithm passes, different money"
            - "HarvestLot.${h1_id}.lot_gross_provisional_cents == 595566 but lot_gross_final_cents == 619389; both fields persist after settle"
            - "HarvestLot.${h2_id}.lot_gross_provisional_cents == 360267 but lot_gross_final_cents == 374678"
            - "HarvestLot.${h3_id}.lot_gross_provisional_cents == 900667 but lot_gross_final_cents == 936693 (includes -1 remainder allocation)"
            - "SettlementStatement.${s_g1} at close: status PROVISIONAL, provisional_net_cents == 927012"
            - "SettlementStatement.${s_g1} after settle: status ISSUED, gross_cents == 994067, cold_chain_deduction_cents == 29974, royalty_offset_cents == 0, recall_credit_cents == 0, net_cents == 964093"
            - "SettlementStatement.${s_g2} after settle: gross_cents == 936693, cold_chain_deduction_cents == 0, net_cents == 936693"
            - "HarvestLot.${h1_id} and ${h3_id}.lot_status == SETTLED; pool_period_id == ${pool_id} on all three lots"

      - name: royalty_provisional_vs_tiered_final
        grounds:
          - calculations.royalty_charge
          - state_machines.PlantLot.PLANTED_to_DEPLETED
          - entities.PlantLot.fields.royalty_provisional_cents
          - entities.PlantLot.fields.royalty_final_cents
          - entities.PlantLot.fields.royalty_adjustment_cents
        distinguishing_aspect: |
          Royalty accounting on PlantLot (plant-material domain — a DIFFERENT entity domain than
          pool settlement): a 5000-plant lot whose cumulative (variety, season) counter starts at
          exactly 100000 prices at 225000 cents under the flat provisional variant but at 190000
          cents under the tiered marginal final variant (entirely inside the 38c tier), leaving
          royalty_adjustment_cents == -35000.
        test_recipe:
          setup:
            - "Variety V2 (RASPBERRY) RELEASED; grower G3 ACTIVE with ACTIVE agreement A3 (region OR-WILLAMETTE, max_planting_units 200000)."
            - "Harvest window W3 [2026-10-12, 2026-10-19) target 300000 covers the raspberry 75-day first harvest of plantings made 2026-08-01 (2026-10-15)."
            - "Lot A: 100000 plants shipped 2026-06-01, fully planted -> DEPLETED; final royalty 4500000 (all tier-1), adjustment 0."
          setup_api_calls:
            - *k_clock0
            - &k_v2
              call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-RSP-01", berry_type: "RASPBERRY", name: "Cascadia Gem" }
              as: BreedingManager
              captures: { v2_id: $.data.id }
            - &k_v2_rel
              call: "POST /licensing/varieties/${v2_id}/release"
              payload: {}
              as: BreedingManager
            - &k_g3
              call: "POST /licensing/growers"
              payload: { legal_name: "Willamette Valley Growers", region_code: "OR-WILLAMETTE" }
              as: PlatformAdmin
              captures: { g3_id: $.data.id }
            - &k_a3
              call: "POST /licensing/agreements"
              payload: { grower_id: "${g3_id}", variety_id: "${v2_id}", region_code: "OR-WILLAMETTE", max_planting_units: 200000, cultural_practice_codes: ["CONVENTIONAL"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g3_id}"
              captures: { a3_id: $.data.id }
            - &k_a3_dec
              call: "POST /licensing/agreements/${a3_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { a3_v: $.data.version }
            - &k_w3
              call: "POST /licensing/harvest-windows"
              payload: { region_code: "OR-WILLAMETTE", variety_id: "${v2_id}", week_start: "2026-10-12T00:00:00Z", week_end: "2026-10-19T00:00:00Z", target_volume_kg: 300000 }
              as: PlatformAdmin
            - &k_la
              call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-OR-01", agreement_id: "${a3_id}", variety_id: "${v2_id}", quantity_plants: 100000 }
              as: NurseryManager
              captures: { la_id: $.data.id }
            - &k_pa
              call: "POST /licensing/plantings"
              payload: { agreement_id: "${a3_id}", plant_lot_id: "${la_id}", planned_plants: 100000, expected_agreement_version: "${a3_v}" }
              as: GrowerPrincipal
              as_user_id: "${g3_id}"
              captures: { pa_id: $.data.id }
            - *k_clock_aug
            - &k_pa_conf
              call: "POST /licensing/plantings/${pa_id}/confirm"
              payload: { plants_planted_actual: 100000, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g3_id}"
            - &k_la_get
              call: "GET /licensing/plant-lots/${la_id}"
              payload: {}
              as: NurseryManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-OR-01", agreement_id: "${a3_id}", variety_id: "${v2_id}", quantity_plants: 5000 }
              as: NurseryManager
              captures: { lb_id: $.data.id }
            - call: "GET /licensing/agreements/${a3_id}"
              payload: {}
              as: NurseryManager
              captures: { a3_v_now: $.data.version }
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a3_id}", plant_lot_id: "${lb_id}", planned_plants: 5000, expected_agreement_version: "${a3_v_now}" }
              as: GrowerPrincipal
              as_user_id: "${g3_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /licensing/plantings/${pb_id}/confirm"
              payload: { plants_planted_actual: 5000, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g3_id}"
            - call: "GET /licensing/plant-lots/${lb_id}"
              payload: {}
              as: NurseryManager
          assert:
            - "PlantLot.${la_id}: status == DEPLETED, royalty_provisional_cents == 4500000, royalty_final_cents == 4500000, royalty_adjustment_cents == 0 (positions 1..100000 all inside tier 1 at 45c)"
            - "PlantLot.${lb_id}: status == DEPLETED, royalty_provisional_cents == 225000 (5000 x 45 flat)"
            - "PlantLot.${lb_id}.royalty_final_cents == 190000 — its counter positions 100001..105000 all fall in tier 2 at 38c (5000 x 38)"
            - "PlantLot.${lb_id}.royalty_adjustment_cents == -35000 — the two variants disagree by exactly the tier discount"
            - "royalty counter ordering is by (shipped_at ASC, created_at ASC): lot A shipped 2026-06-01 strictly before lot B's 2026-08-03, so lot B never dips into tier 1"

  - rule_id: combinatorial_formula
    instances:
      - name: pool_rate_conditional_shoulder_mode_a
        grounds:
          - calculations.pool_rate
          - entities.PoolPeriod.fields.is_shoulder_week
          - entities.PoolPeriod.fields.pool_distributable_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: the pool rate combines the market
          price (division by total weighted kg), per-grade GRADE_WEIGHT multipliers, and a
          conditional SHOULDER_WEEK_MULTIPLIER branch. Identical volume (1000 kg STANDARD) and
          identical price (400c) yield base_rate 376.0000 without the flag and 413.6000 with it —
          the conditional branch changes the result, and pool_distributable_cents (413600)
          intentionally exceeds net_pool_revenue_cents (376000) as the brand-funded shoulder
          incentive.
        test_recipe:
          setup:
            - "Canonical G2 chain through certified H3 (aliases the &k_ base chain up to H3 certification; pool 1 is NOT created here)."
            - "H4: G2's second lot on P2 — net 1000 kg (gross 1050, tare 50), harvested 2026-10-13T06:00, received 11:00 (5h, compliant), certified STANDARD."
            - "Pool 2: STRAWBERRY [2026-10-12, 2026-10-19) with is_shoulder_week=true, closed and settled at price 400."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g2
            - *k_a2
            - *k_a2_dec
            - *k_l2
            - *k_w1
            - *k_p2
            - *k_clock_aug
            - *k_p2_conf
            - *k_clock_h3a
            - *k_h3
            - *k_clock_h3b
            - *k_h3_recv
            - *k_h3_grade
            - *k_h3_cert
            - call: "GET /licensing/plantings/${p2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p2_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-13T06:30:00Z" }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p2_id}", harvested_at: "2026-10-13T06:00:00Z", gross_weight_kg: 1050, tare_weight_kg: 50, expected_planting_version: "${p2_v3}" }
              as: GrowerPrincipal
              as_user_id: "${g2_id}"
              captures: { h4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-13T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-lots/${h4_id}/receive"
