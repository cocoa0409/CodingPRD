            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-100", received_kg: 500 }, as: PlantAdmin, captures: { mlot_id: "$.data.id" } }
            - { call: "POST /plant/material-lots/${mlot_id}/release", as: QualityTechnician }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders/${ord_id}/release", as: ProductionScheduler }
            - { call: "PATCH /plant/bottle-specs/${spec_id}", payload: { target_weight_g: 23 }, as: ProcessEngineer }
