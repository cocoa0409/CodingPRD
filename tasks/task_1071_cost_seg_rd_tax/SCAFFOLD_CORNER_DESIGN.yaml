          assert:
            - "response error_id == ERR_NO_QUALIFIED_QRE"

      - name: invalid_amount_qualified_percent_out_of_range_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_AMOUNT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_constraint_on_add_component
          rationale: "ERR_INVALID_AMOUNT (allocated_cost_cents 0) is exercised as the lower-priority loser in the referential-vs-constraint §1.8 conflict."

