scenario: 'Accelerator Allocation, Cloud Partner Supply & Developer Programs (NVIDIA): product allocation across cloud providers, system builders and direct customers under supply constraints with prioritization criteria, partner qualification with reference architecture certification and validation testing, software stack licensing with enterprise support subscriptions tied to hardware deployments, developer program tiers granting early access, technical support and preview software with confidentiality obligations, export control classification and license requirements for certain destinations and configurations, demand forecasting from partners with commitment and cancellation terms, evaluation hardware loans and proof-of-concept programs, product lifecycle and long-term availability commitments for embedded customers

  '
domain_name: accelerator-allocation-supply
api_prefix: /accelerators
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
  - rate_threshold_triggers
  - cascading_side_effects
  - optimistic_concurrency
  - selector_policy
  - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: PartnerAccount
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Registered partner legal name
  - name: partner_type
    type: enum
    source: input
    description: CLOUD_PROVIDER | SYSTEM_BUILDER | ENTERPRISE_OEM | EMBEDDED_VENDOR | DIRECT_ENTERPRISE
  - name: destination_country
    type: enum
    source: input
    description: ISO-3166 alpha-2 shipping/access destination; see export control rules
  - name: origin_epoch_index
    type: integer
    source: input
    description: Epoch index at which the partner relationship began; selects between the time_based and unit_based committed-rate variants
  - name: export_restriction_tier
    type: enum
    source: input
    default: LICENSE_EXCEPTION
    description: LICENSE_EXCEPTION | LICENSE_REQUIRED | PROHIBITED
  - name: qualification_status
    type: enum
    source: system
    description: 'Candidate values: APPLIED | IN_VALIDATION | QUALIFIED | REJECTED. Written only by the PartnerAccount state machine.'
  - name: qualification_attempt_count
    type: integer
    source: computed
    default: 0
    description: Incremented on every rejection roll-back; see calculation qualification_attempt_penalty
  - name: allocation_priority_class
    type: enum
    source: system
    description: 'Derived tier at every allocation epoch: TIER_1 | TIER_2 | TIER_3 | UNQUALIFIED. Never client-supplied.'
  - name: entitlement_units_held
    type: integer
    source: computed
    default: 0
    description: Sum of ACTIVE allocations for this partner (visible units). Conserved quantity generated by §1.3 entitlement_state_transition.
  - name: capacity_ledger_net
    type: integer
    source: computed
    default: 0
    description: Signed cumulative units granted minus units reclaimed across supplier nodes. Conserved quantity generated by §1.3 allocation_capacity_ledger.
  - name: cancellation_forfeit_rate
    type: number
    source: computed
    default: 0.0
    description: Set at forecast confirmation from the acknowledged horizon band; see calculation forecast_forfeit_rate
  - name: committed_volume_units
    type: integer
    source: computed
    default: 0
    description: Sum of committed quantities over DEMAND_FORECASTs whose tracking_status = ACTIVE
  - name: lifecycle_floor_expires_at
    type: datetime
    source: system
    description: Set when a LIFECYCLE_COMMITMENT is acknowledged; null when no commitment covers this partner
  - name: eligibility_deadline_at
    type: datetime
    source: system
    description: Computed when a DEMAND_FORECAST is acknowledged; see calculation forecast_commitment_deadline
  - name: status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED | TERMINATED (partner standing, independent of qualification_status)
- name: AcceleratorProduct
  parent: null
  common_fields: true
  fields:
  - name: sku_code
    type: string
    source: input
    description: Unique product SKU code, e.g. AC-100-PCIE
  - name: product_family
    type: enum
    source: input
    description: DATACENTER | WORKSTATION | EMBEDDED | CONSUMER
  - name: lifecycle_stage
    type: enum
    source: system
    description: PREVIEW | GENERAL_AVAILABILITY | MATURE | END_OF_LIFE, advanced one stage per POST /_ops/advance_epoch
  - name: form_factor
    type: enum
    source: input
    description: SXM | PCLE | MCM
  - name: hbm_capacity_gb
    type: integer
    source: input
    description: Memory capacity in GB
  - name: tdp_watts
    type: integer
    source: input
    description: Board power draw in watts; drives export performance-density bands
  - name: export_performance_density
    type: integer
    source: computed
    description: Computed by calculation export_density_band; refreshed whenever supply is allocated to a destination band
  - name: supply_ceiling_units
    type: integer
    source: input
    description: Maximum units the supplier may ever allocate for this SKU
  - name: reserved_evaluation_units
    type: integer
    source: system
    default: 0
    description: Units ring-fenced for evaluation loans; see calculation evaluation_ring_fence
  - name: allocated_units
    type: integer
    source: computed
    default: 0
    description: Sum of ACTIVE allocation quantities for this SKU
  - name: available_units
    type: integer
    source: computed
    description: = supply_ceiling_units - allocated_units - reserved_evaluation_units; never negative
  - name: long_term_availability_through
    type: datetime
    source: input
    description: Promised availability horizon folded in at MATURE stage
  - name: lifecycle_min_remaining_days
    type: integer
    source: computed
    description: Derived by calculation lifecycle_commitment_floor from the covering commitment and the product lifecycle stage
- name: SupplyNode
  parent: null
  common_fields: true
  fields:
  - name: node_code
    type: string
    source: input
    description: Unique supplier pool code
  - name: product_sku_id
    type: string
    source: input
    description: FK -> AcceleratorProduct.id; the SKU this pool can only serve
  - name: node_region
    type: enum
    source: input
    description: AMERICAS | EMEA | APAC
  - name: capacity_units
    type: integer
    source: input
    description: Units this pool can hold at one time
  - name: held_units
    type: integer
    source: computed
    default: 0
    description: Sum of held units over active holds in this pool
  - name: stage
    type: enum
    source: system
    description: OPEN | FRICTION_HOLD | DRAINING | BINDING. FRICTION_HOLD is fenced by a requested-at-creation hold_friction_tier above the tip band; see state machine SupplyNode
  - name: requested_hotness_tier
    type: enum
    source: input
    description: COOL | WARM | HOT | SCALDING; client declares the intended pool temperature
  - name: hotness_tier
    type: enum
    source: computed
    description: Re-derived on every allocation from the pool's committed rate split against the current epoch index; see calculation supply_hotness_tier
  - name: temp_band_ceiling
    type: enum
    source: computed
    description: 'Maximum hold_friction_tier the pool currently accepts: SCALDING → COOL, HOT → WARM, else COOL'
  - name: friction_penalty_score
    type: number
    source: computed
    default: 0
    description: Accumulated FrictionPenalty.score for this pool; decays at every epoch advance
  - name: total_committed_rate
    type: number
    source: computed
    default: 0.0
    description: Sum over ACTIVE AllocationHolds of committed_rate_v2
  - name: committed_fee_cents
    type: integer
    source: computed
    default: 0
    description: Per-allocation-rounded sum of commitment fees over the node's holds, by allocation_commitment_fee
- name: SolutionBlueprint
  parent: null
  common_fields: true
  note: Reference architecture definitions are global; partners certify against them via ValidationEvidence.
  fields:
  - name: blueprint_code
    type: string
    source: input
    description: Unique reference architecture code, e.g. RA-8X-HGX
  - name: blueprint_type
    type: enum
    source: input
    description: TRAINING_CLUSTER | INFERENCE_SERVER | EDGE_BOX | WORKSTATION
  - name: target_tdp_watts
    type: integer
    source: input
    description: Aggregate board power the design is validated at; drives export density evaluation
  - name: required_validation_minutes
    type: integer
    source: input
    description: Validation test minutes a partner must accumulate to certify against this blueprint
  - name: blueprint_status
    type: enum
    source: system
    description: DRAFT | CERTIFIED | RETIRED
  - name: era_index
    type: integer
    source: system
    default: 1
    description: Incremented on each major blueprint revision; evidence accumulates only within the current era
  - name: evaluation_deadline_days
    type: integer
    source: input
    description: Days after an evaluation loan start within which the POC must record a result
- name: AllocationHold
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the partner this hold competes for
  - name: product_sku_id
    type: string
    source: input
    description: FK -> AcceleratorProduct.id; the SKU being held
  - name: supply_node_id
    type: string
    source: input
    description: FK -> SupplyNode.id; the pool the units are held from
  - name: hold_friction_tier
    type: enum
    source: input
    default: COOL
    description: COOL | WARM | HOT | SCALDING; declares the pool temperature the client is willing to accept
  - name: quantity_units
    type: integer
    source: input
    description: Units requested; must be positive
  - name: committed_rate_v2
    type: number
    source: computed
    description: Committed rate under the current SKU pricing model; see calculation committed_rate_v2
  - name: cancellation_forfeit_units
    type: number
    source: computed
    default: 0
    description: Units forfeited on cancellation, computed against the confirming forecast's horizon band
  - name: economic_tag
    type: enum
    source: computed
    default: LOW_VALUE
    description: LOW_VALUE | HIGH_VALUE; emitted by comparison allocation_value_estimate against allocation_value_confirm
  - name: state
    type: enum
    source: system
    description: REQUESTED | COMMITTED | CANCELLED | RECLAIMED | EXPIRED
  - name: expected_partner_version
    type: integer
    source: input
    description: Optimistic-concurrency token echoed back from the parent PartnerAccount.version at submission time
- name: ValidationEvidence
  parent: SolutionBlueprint
  common_fields: true
  note: 'Child of the global SolutionBlueprint rather than of the partner: a partner''s certification evidence is filed under the blueprint it certifies against.'
  fields:
  - name: partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the partner that ran the validation
  - name: blueprint_id
    type: string
    source: system
    description: FK -> SolutionBlueprint.id; the blueprint the evidence certifies against
  - name: validation_minutes
    type: integer
    source: input
    description: Minutes of validation testing performed
  - name: evidence_pack_status
    type: enum
    source: system
    description: SUBMITTED | ACCEPTED | REJECTED
  - name: test_count
    type: integer
    source: input
    description: Number of discrete validation tests executed
- name: EnterpriseSubscription
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the subscribing partner
  - name: deployment_id
    type: string
    source: input
    description: FK -> HardwareDeployment.id; the deployment the subscription is bound to at activation
  - name: stack_license_id
    type: string
    source: input
    description: FK -> SoftwareStackLicense.id; the software stack the subscription covers
  - name: support_tier
    type: enum
    source: input
    description: BASIC | BUSINESS | ENTERPRISE
  - name: seat_count
    type: integer
    source: input
    description: Named support seats; must be positive
  - name: annual_fee_cents
    type: integer
    source: computed
    default: 0
    description: Per-seat annual fee for the tier at creation time
  - name: support_credit_units
    type: integer
    source: computed
    default: 0
    description: Derived by calculation support_tier_credit; tier boundary is inclusive at 40 seats
  - name: status
    type: enum
    source: system
    description: DRAFT | ACTIVE | SUSPENDED | RECLAIMED | EXPIRED
  - name: billed_fee_cents
    type: integer
    source: computed
    default: 0
    description: Forward-looking billed fee written at activation by subscription_fee_provisional
  - name: settled_fee_cents
    type: integer
    source: computed
    default: 0
    description: Settled fee written at reclaim or expiry by subscription_fee_final; diverges from billed_fee_cents whenever seat_count is below SEAT_MIN
- name: HardwareDeployment
  parent: AcceleratorProduct
  common_fields: true
  fields:
  - name: product_sku_id
    type: string
    source: system
    description: FK -> AcceleratorProduct.id; the SKU this deployment runs
  - name: partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the partner operating the deployment
  - name: destination_country_code
    type: enum
    source: input
    description: US | DE | FR | CN | SG | CA; classified by export_control_classification
  - name: export_classification
    type: enum
    source: system
    description: TIER_1_CLEARED | TIER_2_LICENSE_REQUIRED | TIER_3_PROHIBITED; computed by export_control_classification
  - name: stack_manifest
    type: array
    source: input
    description: List of stack components, each with license_id and entitlement_units bound at activation
  - name: activation_state
    type: enum
    source: system
    description: PENDING | ACTIVATED | TERMINATED
  - name: bound_stack_ids
    type: array
    source: computed
    description: Stack license ids actually bound at activation; a subset of the manifest after rejections
  - name: service_ready
    type: boolean
    source: computed
    description: Recomputed on every subscription supersede; true only when at least one covering subscription is ACTIVE
  - name: termination_effect_units
    type: integer
    source: computed
    default: 0
    description: Units released back to the parent SKU by the termination cascade
  - name: expected_product_version
    type: integer
    source: input
    description: OCC token echoed from AcceleratorProduct.version by the supersede path
  - name: activation_actor_user_id
    type: string
    source: system
    description: X-User-ID recorded on the PENDING_to_ACTIVATED transition or the latest handover; the separation-of-duties gate compares against it at termination
- name: SoftwareStackLicense
  parent: AcceleratorProduct
  common_fields: true
  fields:
  - name: license_code
    type: string
    source: input
    description: Unique stack license code
  - name: product_sku_id
    type: string
    source: system
    description: FK -> AcceleratorProduct.id; the SKU this stack targets
  - name: stack_name
    type: string
    source: input
    description: Human-readable software stack name
  - name: entitlement_units
    type: integer
    source: input
    description: Entitlement units the stack grants per bound deployment at release
  - name: preview_stack_flag
    type: boolean
    source: input
    default: false
    description: True for preview software; binding it to a deployment requires an accepted NDA
  - name: license_state
    type: enum
    source: system
    description: DRAFT | RELEASED | RETIRED
  - name: min_package_version
    type: string
    source: input
    description: Minimum firmware version a deployment must be at to bind this stack
  - name: bound_deployment_count
    type: integer
    source: computed
    default: 0
    description: Number of AcceleratorProduct deployments currently bound to this stack, re-derived from the FK graph
- name: DeveloperProgramMembership
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the partner that holds the membership
  - name: requested_tier
    type: enum
    source: input
    description: COMMUNITY | REGISTERED | PREFERRED | ELITE; eligibility is evaluated against the PREVIOUS (stored) tier
  - name: stored_tier
    type: enum
    source: system
    description: Tier actually held; only POST /developer-memberships/{id}/renew moves it, and only after the evaluation deadline
  - name: preview_kit_units
    type: integer
    source: computed
    default: 0
    description: Preview hardware kits granted by calculation developer_tier_provision
  - name: support_incidents_included
    type: integer
    source: computed
    default: 0
    description: Included support incidents granted by calculation developer_tier_provision
  - name: evaluation_deadline_at
    type: datetime
    source: system
    description: 'Timestamp from the grace rule: acknowledged_at + grace period'
  - name: status
    type: enum
    source: system
    description: REQUESTED | UNDER_EVALUATION | ACTIVE | LAPSED | REVOKED
- name: PreviewSoftwareGrant
  parent: DeveloperProgramMembership
  common_fields: true
  fields:
  - name: membership_id
    type: string
    source: system
    description: FK -> DeveloperProgramMembership.id; the membership that unlocked the grant
  - name: partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the grantee
  - name: stack_license_id
    type: string
    source: input
    description: FK -> SoftwareStackLicense.id; the preview stack being granted
  - name: device_serial
    type: string
    source: input
    description: Serial of the evaluation device the preview stack is loaded onto
  - name: commitment_boundary_at
    type: datetime
    source: system
    description: Start of the grant's temporal window; set when the grant opens
  - name: commitment_expires_at
    type: datetime
    source: system
    description: End of the grant's temporal window; a 60-day span from the boundary
  - name: confidentiality_ack_id
    type: string
    source: input
    description: FK -> ConfidentialityAcknowledgement.id; the NDA backing this grant
  - name: grant_status
    type: enum
    source: system
    description: OPEN | FULFILLED | REVOKED | EXPIRED
- name: ConfidentialityAcknowledgement
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the bound partner
  - name: membership_id
    type: string
    source: input
    description: FK -> DeveloperProgramMembership.id; the membership binding this NDA
  - name: acknowledged_at
    type: datetime
    source: system
    description: Server-stamped instant the NDA was accepted
  - name: ack_status
    type: enum
    source: system
    description: BOUND | FULFILLED, advanced only when the bound grant closes with FULFILLED
- name: DemandForecast
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the forecasting partner
  - name: product_sku_id
    type: string
    source: input
    description: FK -> AcceleratorProduct.id; the SKU being forecast
  - name: requested_quantity_units
    type: integer
    source: input
    description: Units the partner requests as the forecast ceiling
  - name: acknowledged_at
    type: datetime
    source: system
    description: Server-stamped instant on acknowledgement; the anchor for the third-Saturday rule
  - name: horizon_band
    type: enum
    source: system
    description: SHORT | MEDIUM | LONG, derived from the commit date across the third Saturday of the acknowledgement month
  - name: committed_quantity_units
    type: integer
    source: computed
    default: 0
    description: Set by the commit endpoint, capped at requested_quantity_units
  - name: cancellation_notice_days
    type: integer
    source: computed
    description: 'Set from horizon_band at commit: SHORT 14, MEDIUM 30, LONG 60'
  - name: forfeit_rate
    type: number
    source: computed
    default: 0.0
    description: Forfeit rate whose boundary flips to 0.25 inclusive at MEDIUM
  - name: tracking_status
    type: enum
    source: system
    description: DRAFT | FORECAST_SUBMITTED | ACTIVE | COMMITTED | CANCELLED
  - name: expected_partner_version
    type: integer
    source: input
    description: OCC token echoed from PartnerAccount.version at submission
- name: EvaluationLoan
  parent: AcceleratorProduct
  common_fields: true
  fields:
  - name: product_sku_id
    type: string
    source: system
    description: FK -> AcceleratorProduct.id; the SKU lent for evaluation
  - name: partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the borrowing partner
  - name: blueprint_id
    type: string
    source: input
    description: FK -> SolutionBlueprint.id; the reference architecture under evaluation
  - name: loan_units
    type: integer
    source: input
    description: Units lent; must be positive and must not exceed the SKU's reserved_evaluation_units
  - name: loan_state
    type: enum
    source: system
    description: REQUESTED | APPROVED | ACTIVE | RETURNED | RECLAIMED | OVERDUE
  - name: required_return_at
    type: datetime
    source: system
    description: Set at approval from the blueprint's evaluation_deadline_days
  - name: late_fee_units
    type: number
    source: computed
    default: 0
    description: Accrued while OVERDUE; see calculation loan_late_fee
  - name: expected_product_version
    type: integer
    source: input
    description: OCC token echoed from AcceleratorProduct.version at approval
- name: ProofOfConceptMilestone
  parent: EvaluationLoan
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> EvaluationLoan.id; the loan this milestone belongs to
  - name: milestone_type
    type: enum
    source: input
    description: KICKOFF | BENCHMARK | INTEGRATION | ACCEPTANCE
  - name: milestone_result
    type: enum
    source: input
    description: PASSED | FAILED | INCONCLUSIVE; only PASSED advances the bound loan
  - name: recorded_at
    type: datetime
    source: system
    description: Server-stamped instant the milestone was recorded
  - name: milestone_triggered_at
    type: datetime
    source: system
    description: Server-stamped instant the bound loan transitioned ACTIVE → RETURNED
  - name: milestone_state
    type: enum
    source: system
    description: OPEN | RECORDED | LATE
- name: LifecycleCommitment
  parent: AcceleratorProduct
  common_fields: true
  fields:
  - name: product_sku_id
    type: string
    source: system
    description: FK -> AcceleratorProduct.id; the SKU whose availability is committed
  - name: embedded_partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the embedded vendor receiving the commitment
  - name: availability_through
    type: datetime
    source: input
    description: Requested long-term availability horizon
  - name: commitment_floor_days
    type: integer
    source: computed
    default: 0
    description: Derived by calculation lifecycle_commitment_floor
  - name: commitment_status
    type: enum
    source: system
    description: REQUESTED | GRANTED | DECLINED, advanced by POST /lifecycle-commitments/{id}/grant
  - name: covered_units
    type: integer
    source: input
    description: Units the commitment protects; must not exceed the SKU's available_units
  - name: expected_product_version
    type: integer
    source: input
    description: OCC token echoed from AcceleratorProduct.version at grant
- name: FrictionPenalty
  parent: SupplyNode
  common_fields: true
  fields:
  - name: supply_node_id
    type: string
    source: system
    description: FK -> SupplyNode.id; the pool that was engaged above its temperature band
  - name: partner_id
    type: string
    source: input
    description: FK -> PartnerAccount.id; the over-committing partner
  - name: hold_id
    type: string
    source: system
    description: FK -> AllocationHold.id; the hold that produced the penalty
  - name: score
    type: number
    source: computed
    description: SCORE_BASE * 2 ^ (min(engaged_tier_index, ceiling_index) - ceiling_index), rounded HalfEven to 1 decimal
  - name: penalty_reason
    type: enum
    source: input
    description: BAND_VIOLATION | LATE_CANCEL
  - name: penalty_state
    type: enum
    source: system
    description: ACTIVE | DECAYED | SETTLED
- name: AllocationEpoch
  parent: null
  common_fields: true
  fields:
  - name: epoch_index
    type: integer
    source: system
    description: Advancing counter; committed rates are stamped with the epoch index in force
  - name: opened_at
    type: datetime
    source: system
    description: Server-stamped instant the epoch opened
  - name: half_life_next
    type: enum
    source: system
    description: Half-life band predicted for the next epoch from the scheduled plan; see calculation supply_hotness_tier
  - name: epoch_status
    type: enum
    source: system
    description: OPEN | CLOSED
- name: AuditTrailEntry
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the partner the entry is filed under
  - name: action_code
    type: string
    source: system
    description: Stable code of the mutating operation that produced the entry
  - name: subject_entity
    type: string
    source: system
    description: Entity name of the mutated resource
  - name: subject_id
    type: string
    source: system
    description: PK of the mutated resource
  - name: actor_user_id
    type: string
    source: system
    description: X-User-ID of the actor; used by the segregation-of-duties rule
  - name: actor_role
    type: string
    source: system
    description: X-User-Role of the actor
  - name: recorded_at
    type: datetime
    source: system
    description: Server-stamped instant the entry was appended
  - name: entry_digest
    type: string
    source: computed
    description: Digest over predecessor entries; tamper-evident chain for the audit surface
- name: ExportLicenseGrant
  parent: null
  common_fields: true
  fields:
  - name: product_sku_id
    type: string
    source: input
    description: FK -> AcceleratorProduct.id; the SKU the grant permits
  - name: destination_country_code
    type: enum
    source: input
    description: The destination the grant unlocks; permitted values include DE, FR, SG, CA, US
  - name: granted_units
    type: integer
    source: input
    description: Units the grant authorises for that destination
  - name: grant_status
    type: enum
    source: system
    description: ACTIVE | REVOKED
- name: SupplyContract
  parent: PartnerAccount
  common_fields: true
  fields:
  - name: partner_id
    type: string
    source: system
    description: FK -> PartnerAccount.id; the partner holding the contract
  - name: product_sku_id
    type: string
    source: input
    description: FK -> AcceleratorProduct.id; the SKU under contract
  - name: start_month
    type: string
    source: input
    description: First month of the half-open window, formatted YYYY-MM
  - name: end_month
    type: string
    source: input
    description: Last contracted month, formatted YYYY-MM; the window is [start_month, end_month + 1 month)
  - name: contracted_units
    type: integer
    source: input
    description: Monthly contracted units
  - name: window_status
    type: enum
    source: system
    description: OPEN | CLOSED
state_machines:
- entity: PartnerAccount
  initial_state: APPLIED
  terminal_states:
  - TERMINATED
  transitions:
  - from: APPLIED
    to: IN_VALIDATION
    trigger: POST /partners/{partnerId}/validations
    actor: PartnerProgramManager
    preconditions:
    - partner.status == ACTIVE (not SUSPENDED or TERMINATED)
    - An AcceleratorEpoch is not required for qualification, but the evidence blueprint must be in blueprint_status == CERTIFIED
    side_effects:
    - A ValidationEvidence row is created with evidence_pack_status = SUBMITTED
    - No qualification_attempt_count increment on this transition
  - from: IN_VALIDATION
    to: QUALIFIED
    trigger: POST /partners/{partnerId}/qualify
    actor: PartnerProgramManager
    preconditions:
    - At least one ValidationEvidence for this partner has evidence_pack_status == ACCEPTED
    - The accepted evidence's blueprint.blueprint_status == CERTIFIED
    - Every accepted evidence's blueprint has a blueprint_type present in the partner's declared partner_type support set
    side_effects:
    - partner.allocation_priority_class is re-derived at the next epoch advance; the field itself is not written here
    - AuditTrailEntry appended with action_code = PARTNER_QUALIFIED
  - from: IN_VALIDATION
    to: APPLIED
    trigger: POST /partners/{partnerId}/reject
    actor: PartnerProgramManager
    preconditions:
    - The partner is not already APPLIED
    side_effects:
    - partner.qualification_attempt_count += 1
    - 'CASCADE depth=1: every ValidationEvidence for this partner with evidence_pack_status == SUBMITTED is set to REJECTED'
    - 'CASCADE depth=2: for each blueprint that lost its only ACCEPTED evidence in the current era, blueprint.era_index += 1, which invalidates the remaining evidence filed under the previous era'
    - AuditTrailEntry appended with action_code = PARTNER_REJECTED
  - from: QUALIFIED
    to: SUSPENDED
    trigger: POST /partners/{partnerId}/suspend
    actor: PartnerProgramManager
    preconditions:
    - partner.qualification_status == QUALIFIED
    - partner.status == ACTIVE
    side_effects:
    - partner.status -> SUSPENDED
    - 'CASCADE depth=1: every EnterpriseSubscription whose partner_id == this partner and status == ACTIVE is set to SUSPENDED'
    - 'CASCADE depth=2: for each suspended subscription, the deployment it covers has service_ready recomputed - service_ready becomes false when the deployment has no remaining ACTIVE covering subscription'
    - 'CASCADE depth=3: a deployment whose service_ready flipped false while activation_state == ACTIVATED is moved to activation_state = TERMINATED, which itself cascades to HardwareDeployment.ACTIVATED_to_TERMINATED'
    - entitlement_units_held is NOT reduced by this transition
  - from: SUSPENDED
    to: QUALIFIED
    trigger: POST /partners/{partnerId}/reinstate
    actor: PlatformAdmin
    preconditions:
    - partner.status == SUSPENDED
    side_effects:
    - partner.status -> ACTIVE
    - Suspended subscriptions are NOT auto-reactivated; each must be reinstated individually via POST /subscriptions/{subscriptionId}/reinstate
  - from: QUALIFIED
    to: TERMINATED
    trigger: POST /partners/{partnerId}/terminate
    actor: PlatformAdmin
    preconditions:
    - partner.qualification_status == QUALIFIED or SUSPENDED
    - Every EnterpriseSubscription covering this partner that is in ACTIVE state has been RECLAIMED or EXPIRED
    side_effects:
    - partner.status -> TERMINATED
    - Returns 200 with the partner body; no allocations are released by this transition
  - from: SUSPENDED
    to: TERMINATED
    trigger: POST /partners/{partnerId}/terminate
    actor: PlatformAdmin
    preconditions:
    - partner.qualification_attempt_count >= 1
    side_effects:
    - partner.status -> TERMINATED
  - from: TERMINATED
    to: APPLIED
    trigger: POST /partners/{partnerId}/reapply
    actor: PlatformAdmin
    preconditions:
    - The partner has no ACTIVE AllocationHold
    side_effects:
    - partner.qualification_status -> APPLIED and partner.status -> ACTIVE
    - qualification_attempt_count is preserved across the re-application
    - 'CYCLE: the partner re-enters the qualification pipeline at APPLIED, so APPLIED -> IN_VALIDATION -> APPLIED may repeat indefinitely'
- entity: SupplyNode
  initial_state: OPEN
  terminal_states: []
  transitions:
  - from: OPEN
    to: FRICTION_HOLD
    trigger: 'system event: an AllocationHold is created against this node with hold_friction_tier ranked strictly above the node''s temp_band_ceiling'
    actor: system
    preconditions:
    - The node is in OPEN
    side_effects:
    - A FrictionPenalty row is created with penalty_reason = BAND_VIOLATION and penalty_state = ACTIVE
    - node.friction_penalty_score += that penalty's score
    - The offending AllocationHold is COMMITTED but its quantity is never counted toward the node's held_units
  - from: FRICTION_HOLD
    to: OPEN
    trigger: POST /_ops/advance_epoch
    actor: PlatformAdmin
    preconditions:
    - node.friction_penalty_score < 4.0
    side_effects:
    - node.stage -> OPEN
    - Every FrictionPenalty on this node with score == 0.0 and penalty_state == ACTIVE is set to DECAYED
  - from: OPEN
    to: DRAINING
    trigger: POST /supply-nodes/{nodeId}/drain
    actor: SupplyPlanner
    preconditions:
    - node.stage == OPEN
    - node.held_units == 0
    side_effects:
    - node.stage -> DRAINING
  - from: DRAINING
    to: BINDING
    trigger: POST /supply-nodes/{nodeId}/bind
    actor: SupplyPlanner
    preconditions:
    - node.friction_penalty_score <= 4.0
    side_effects:
    - node.stage -> BINDING
    - Every FrictionPenalty on this node with penalty_state == ACTIVE is set to SETTLED
  - from: BINDING
    to: OPEN
    trigger: POST /_ops/advance_epoch
    actor: PlatformAdmin
    preconditions:
    - node.stage == BINDING
    side_effects:
    - node.stage -> OPEN
    - node.friction_penalty_score is reset to 0.0
    - 'CYCLE: OPEN -> FRICTION_HOLD -> OPEN and OPEN -> DRAINING -> BINDING -> OPEN are both repeatable, so the pool revisits OPEN indefinitely'
- entity: AllocationEpoch
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: CLOSED
    trigger: POST /_ops/advance_epoch
    actor: PlatformAdmin
    preconditions:
    - There is no other OPEN epoch
    side_effects:
    - epoch.epoch_status -> CLOSED
    - A successor AllocationEpoch is opened with epoch_index = predecessor.epoch_index + 1, opened_at = logical clock, epoch_status = OPEN, half_life_next derived by calculation supply_hotness_tier
    - 'CYCLE at collection level: the CLOSED epoch is superseded by a fresh OPEN epoch, so the OPEN posture recurs on every advance'
    - 'POSTURE GATE: while no AllocationEpoch has epoch_status == OPEN, every allocation-creating endpoint (POST /allocation-holds, POST /demand-forecasts/{id}/commit, POST /partners/{id}/qualify) is rejected with ERR_NO_OPEN_EPOCH'
    - 'CASCADE: every ACTIVE FrictionPenalty on any node is re-scored by half-life decay; a penalty whose score reaches 0.0 becomes DECAYED'
    - 'CASCADE: every EvaluationLoan in ACTIVE state whose required_return_at is strictly before the new clock time becomes OVERDUE and accrues loan_late_fee'
    - 'CASCADE: every ProofOfConceptMilestone still OPEN whose bound loan became OVERDUE becomes LATE and creates a FrictionPenalty with penalty_reason = LATE_CANCEL and penalty_state = ACTIVE against the loan''s supply node'
    - 'CASCADE: every DemandForecast in ACTIVE state whose partner.eligibility_deadline_at is at or before the new clock time becomes COMMITTED'
- entity: DemandForecast
  initial_state: DRAFT
  terminal_states:
  - COMMITTED
  transitions:
  - from: DRAFT
    to: FORECAST_SUBMITTED
    trigger: POST /demand-forecasts/{forecastId}/acknowledge
    actor: PartnerProgramManager
    preconditions:
    - forecast.requested_quantity_units > 0
    - The partner is in qualification_status == QUALIFIED
    side_effects:
    - forecast.acknowledged_at = logical clock
    - forecast.horizon_band and partner.eligibility_deadline_at are set by calculation forecast_commitment_deadline
    - forecast.forfeit_rate is unset (0.0) until commit
  - from: FORECAST_SUBMITTED
    to: ACTIVE
    trigger: POST /demand-forecasts/{forecastId}/commit
    actor: PartnerProgramManager
    preconditions:
    - The logical clock is strictly before partner.eligibility_deadline_at
    - committed_quantity_units <= requested_quantity_units
    - An AllocationEpoch with epoch_status == OPEN exists
    side_effects:
    - forecast.committed_quantity_units is set from the request
    - forecast.cancellation_notice_days and forecast.forfeit_rate are set by calculation forecast_forfeit_rate
    - partner.committed_volume_units += committed_quantity_units
    - An AllocationHold may now be requested against this forecast; before commit, holds referencing it are rejected
  - from: ACTIVE
    to: CANCELLED
    trigger: POST /demand-forecasts/{forecastId}/cancel
    actor: PartnerProgramManager
    preconditions:
    - Every AllocationHold referencing this forecast is in a terminal state (CANCELLED, RECLAIMED or EXPIRED)
    side_effects:
    - forecast.tracking_status -> CANCELLED
    - partner.committed_volume_units -= committed_quantity_units
    - A penalty is recorded only when the cancel is received strictly after acknowledged_at + cancellation_notice_days; the forfeited units are computed against forfeit_rate
  - from: CANCELLED
    to: FORECAST_SUBMITTED
    trigger: POST /demand-forecasts/{forecastId}/revise
    actor: PartnerProgramManager
    preconditions:
    - The partner is still in qualification_status == QUALIFIED
    side_effects:
    - forecast.tracking_status -> FORECAST_SUBMITTED
    - acknowledged_at is re-stamped to the current logical clock, re-deriving horizon_band and eligibility_deadline_at
    - 'CYCLE: a cancelled forecast may be revised and cancelled again, so ACTIVE -> CANCELLED -> FORECAST_SUBMITTED -> ACTIVE repeats'
  - from: ACTIVE
    to: COMMITTED
    trigger: POST /_ops/advance_epoch when the logical clock reaches partner.eligibility_deadline_at
    actor: system
    preconditions:
    - tracking_status == ACTIVE
    side_effects:
    - forecast.tracking_status -> COMMITTED
    - forfeit_rate is frozen at its committed value; further cancellation is no longer accepted
- entity: SoftwareStackLicense
  initial_state: DRAFT
  terminal_states:
  - RETIRED
  transitions:
  - from: DRAFT
    to: RELEASED
    trigger: POST /stack-licenses/{stackLicenseId}/release
    actor: SupplyPlanner
    preconditions:
    - min_package_version is non-empty
    side_effects:
    - license_state -> RELEASED
  - from: RELEASED
    to: RETIRED
    trigger: POST /stack-licenses/{stackLicenseId}/retire
    actor: SupplyPlanner
    preconditions:
    - bound_deployment_count == 0
    side_effects:
    - license_state -> RETIRED
- entity: HardwareDeployment
  initial_state: PENDING
  terminal_states:
  - TERMINATED
  transitions:
  - from: PENDING
    to: ACTIVATED
    trigger: POST /deployments/{deploymentId}/activate
    actor: SupportAccountManager
    preconditions:
    - The partner is in qualification_status == QUALIFIED
    - The parent product has allocated_units > 0
    - export_control_classification != TIER_3_PROHIBITED
    - When export_control_classification == TIER_2_LICENSE_REQUIRED, an ExportLicenseGrant for this deployment exists with grant_status == ACTIVE
    - Every stack in the manifest with preview_stack_flag == true has a ConfidentialityAcknowledgement for the partner with ack_status == BOUND
    side_effects:
    - activation_state -> ACTIVATED
    - bound_stack_ids is set to the manifest stack ids that passed the NDA gate; manifest entries without an accepted NDA are dropped rather than rejecting the request
    - deployment.service_ready is set true only after at least one EnterpriseSubscription bound to this deployment reaches ACTIVE
    - 'CASCADE depth=1: every PreviewSoftwareGrant referenced by a bound stack and in OPEN state becomes FULFILLED'
    - 'CASCADE depth=2: each fulfilled grant''s ConfidentialityAcknowledgement becomes FULFILLED'
    - 'CASCADE depth=3: each fulfilled grant''s DeveloperProgramMembership has support_incidents_included recomputed by calculation developer_tier_provision against the newer accepted-evidence count'
  - from: ACTIVATED
    to: TERMINATED
    trigger: POST /deployments/{deploymentId}/terminate
    actor: SupportAccountManager
    preconditions:
    - activation_state == ACTIVATED
    side_effects:
    - activation_state -> TERMINATED
    - 'CASCADE depth=1: every EnterpriseSubscription bound to this deployment whose status is ACTIVE or SUSPENDED becomes RECLAIMED'
    - 'CASCADE depth=2: partner.entitlement_units_held is reduced by the entitlement release computed for the SKU by calculation entitlement_pool_release'
    - 'CASCADE depth=3: parent_product.allocated_units decreases by termination_effect_units, which re-derives parent_product.available_units and re-runs calculation export_density_band in its final variant for the product'
    - service_ready -> false
    - 'SUBSCRIPTION SUSPENSION DOES NOT RELEASE ENTITLEMENTS: the depth-2 release runs only on deployment termination, so a partner whose subscriptions were SUSPENDED then reinstated must show an unchanged entitlement_units_held'
    - 'SEGREGATION OF DUTIES: when the acting X-User-ID matches the actor_user_id of the AuditTrailEntry that recorded this deployment''s PENDING_to_ACTIVATED transition, the request is rejected with ERR_SAME_ACTOR_DEPLOYMENT_CHAIN and no state changes are applied; this gate is ordered after the exit-license gate, so a deployment terminated without a covering subscription reports ERR_NO_COVERING_SUBSCRIPTION instead'
    - 'SEGREGATION OF DUTIES: when the acting X-User-ID matches the actor_user_id of the AuditTrailEntry that recorded this deployment''s PENDING_to_ACTIVATED transition, the request is rejected with ERR_SAME_ACTOR_DEPLOYMENT_CHAIN and no state changes are applied; this gate is ordered after the exit-license gate, so a deployment terminated without a covering subscription reports ERR_NO_COVERING_SUBSCRIPTION instead'
  - from: TERMINATED
    to: PENDING
    trigger: POST /deployments/{deploymentId}/reinstate
    actor: SupportAccountManager
    preconditions:
    - No EnterpriseSubscription bound to this deployment is in ACTIVE state
    side_effects:
    - activation_state -> PENDING
    - The depth-3 allocation subtract performed at termination is NOT reversed; parent_product.allocated_units stays where the termination left it
    - 'CYCLE: PENDING -> ACTIVATED -> TERMINATED -> PENDING is repeatable'
- entity: EnterpriseSubscription
  initial_state: DRAFT
  terminal_states:
  - RECLAIMED
  - EXPIRED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /subscriptions/{subscriptionId}/activate
    actor: SupportAccountManager
    preconditions:
    - The covering deployment is in activation_state == ACTIVATED
    - The referenced stack license is in license_state == RELEASED
    - seat_count > 0 and trial_flag == true
    side_effects:
    - status -> ACTIVE
    - annual_fee_cents, billed_fee_cents and support_credit_units are computed by calculations subscription_fee_provisional and support_tier_credit
    - partner.entitlement_units_held += the bound stack's entitlement_units
    - The bound deployment's service_ready is recomputed to true
    - 'CASCADE depth=1: partner.allocation_priority_class is re-derived at the next epoch advance because a deployment under this partner is now service-ready'
  - from: ACTIVE
    to: SUSPENDED
    trigger: 'system event: the covering partner transitions QUALIFIED_to_SUSPENDED'
    actor: system
    preconditions:
    - status == ACTIVE
    side_effects:
    - status -> SUSPENDED
    - The bind relationship is preserved so that POST /subscriptions/{subscriptionId}/reinstate can restore it
    - partner.entitlement_units_held is unchanged
    - settled_fee_cents stops accruing while SUSPENDED
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /subscriptions/{subscriptionId}/reinstate
    actor: SupportAccountManager
    preconditions:
    - The covering partner is in qualification_status == QUALIFIED
    - The covering deployment is in activation_state == ACTIVATED
    side_effects:
    - status -> ACTIVE
    - The deployment's service_ready is recomputed to true
    - The settlement anchor epoch index is restamped so that settlement resumes from the reinstatement instant
  - from: ACTIVE
    to: RECLAIMED
    trigger: POST /subscriptions/{subscriptionId}/reclaim
    actor: SupportAccountManager
    preconditions:
    - status == ACTIVE
    side_effects:
    - status -> RECLAIMED
    - settled_fee_cents is finalized by calculation subscription_fee_final
    - partner.entitlement_units_held is unchanged; the stack entitlement is only returned by the deployment termination cascade
  - from: SUSPENDED
    to: RECLAIMED
    trigger: POST /subscriptions/{subscriptionId}/reclaim
    actor: SupportAccountManager
    preconditions:
    - status == SUSPENDED
    side_effects:
    - status -> RECLAIMED
    - partner.entitlement_units_held is unchanged
  - from: ACTIVE
    to: EXPIRED
    trigger: POST /_ops/advance_epoch when the logical clock passes the subscription anniversary
    actor: system
    preconditions:
    - status == ACTIVE
    side_effects:
    - status -> EXPIRED
    - settled_fee_cents is finalized by calculation subscription_fee_final
    - The parent product's FrictionPenalty set is untouched; expiry is a subscription event, not a pool event
- entity: DeveloperProgramMembership
  initial_state: REQUESTED
  terminal_states:
  - REVOKED
  transitions:
  - from: REQUESTED
    to: UNDER_EVALUATION
    trigger: POST /developer-memberships/{membershipId}/evaluate
    actor: PartnerProgramManager
    preconditions:
    - The partner is in qualification_status == QUALIFIED
    - The partner has at least one ACCEPTED ValidationEvidence
    side_effects:
    - status -> UNDER_EVALUATION
    - evaluation_deadline_at = logical clock + MEMBERSHIP_GRACE_DAYS
    - preview_kit_units and support_incidents_included are computed by calculation developer_tier_provision against stored_tier, not against requested_tier
  - from: UNDER_EVALUATION
    to: ACTIVE
    trigger: POST /developer-memberships/{membershipId}/renew
    actor: PartnerProgramManager
    preconditions:
    - The logical clock is at or after evaluation_deadline_at
    - The partner has at least one ACCEPTED ValidationEvidence
    side_effects:
    - stored_tier advances by exactly one tier toward requested_tier
    - preview_kit_units and support_incidents_included are recomputed for the new stored_tier
  - from: ACTIVE
    to: LAPSED
    trigger: POST /developer-memberships/{membershipId}/lapse
    actor: PartnerProgramManager
    preconditions:
    - status == ACTIVE
    side_effects:
    - status -> LAPSED
    - granted preview kits remain provisioned until the next renewal
    - 'CASCADE depth=1: every PreviewSoftwareGrant under this membership that is still OPEN becomes REVOKED'
  - from: LAPSED
    to: UNDER_EVALUATION
    trigger: POST /developer-memberships/{membershipId}/renew
    actor: PartnerProgramManager
    preconditions:
    - The logical clock is at or after evaluation_deadline_at
    side_effects:
    - status -> UNDER_EVALUATION; re-arming the grace window
    - 'CYCLE: ACTIVE -> LAPSED -> UNDER_EVALUATION -> ACTIVE repeats'
  - from: ACTIVE
    to: REVOKED
    trigger: 'system event: a bound PreviewSoftwareGrant of this membership is REVOKED for a confidentiality breach'
    actor: system
    preconditions:
    - At least one bound PreviewSoftwareGrant has been REVOKED by POST /preview-grants/{grantId}/revoke
    side_effects:
    - status -> REVOKED
    - preview_kit_units is set to 0
    - 'CASCADE depth=1: every remaining OPEN PreviewSoftwareGrant of this membership becomes REVOKED'
- entity: PreviewSoftwareGrant
  initial_state: OPEN
  terminal_states:
  - FULFILLED
  - REVOKED
  - EXPIRED
  transitions:
  - from: OPEN
    to: FULFILLED
    trigger: 'system event: the bound deployment completes PENDING_to_ACTIVATED'
    actor: system
    preconditions:
    - grant_status == OPEN
    side_effects:
    - grant_status -> FULFILLED
    - The backing ConfidentialityAcknowledgement is set to FULFILLED
  - from: OPEN
    to: REVOKED
    trigger: POST /preview-grants/{grantId}/revoke
    actor: SupplyComplianceOfficer
    preconditions:
    - grant_status == OPEN
    side_effects:
    - grant_status -> REVOKED
    - 'CASCADE depth=1: the parent DeveloperProgramMembership becomes REVOKED'
    - The backing ConfidentialityAcknowledgement stays BOUND until the membership revocation closes it
  - from: OPEN
    to: EXPIRED
    trigger: POST /_ops/advance_epoch when the logical clock passes commitment_expires_at
    actor: system
    preconditions:
    - grant_status == OPEN
    side_effects:
    - grant_status -> EXPIRED
- entity: EvaluationLoan
  initial_state: REQUESTED
  terminal_states:
  - RETURNED
  - RECLAIMED
  transitions:
  - from: REQUESTED
    to: APPROVED
    trigger: POST /evaluation-loans/{loanId}/approve
    actor: PartnerProgramManager
    preconditions:
    - The partner is in qualification_status == QUALIFIED
    - loan_units <= product.reserved_evaluation_units
    - expected_product_version matches product.version
    side_effects:
    - loan_state -> APPROVED
    - product.reserved_evaluation_units += loan_units, re-deriving product.available_units
    - required_return_at = logical clock + blueprint.evaluation_deadline_days
  - from: REQUESTED
    to: RECLAIMED
    trigger: POST /evaluation-loans/{loanId}/reclaim
    actor: PartnerProgramManager
    preconditions:
    - loan_state == REQUESTED
    side_effects:
    - loan_state -> RECLAIMED; no ring-fence was taken, so reserved_evaluation_units is unchanged
  - from: APPROVED
    to: ACTIVE
    trigger: POST /evaluation-loans/{loanId}/start
    actor: PartnerProgramManager
    preconditions:
    - loan_state == APPROVED
    - The logical clock is at or after required_return_at minus the loan window
    side_effects:
    - loan_state -> ACTIVE
    - An OPEN ProofOfConceptMilestone of type KICKOFF is created
  - from: ACTIVE
    to: RETURNED
    trigger: 'system event: the bound ProofOfConceptMilestone is recorded with milestone_result == PASSED'
    actor: system
    preconditions:
    - A milestone on this loan was recorded PASSED
    side_effects:
    - loan_state -> RETURNED
    - product.reserved_evaluation_units -= loan_units, re-deriving product.available_units
    - The bound milestone's milestone_state -> RECORDED and milestone_triggered_at = logical clock
  - from: ACTIVE
    to: OVERDUE
    trigger: POST /_ops/advance_epoch when the logical clock is strictly after required_return_at and the loan is still ACTIVE
    actor: system
    preconditions:
    - loan_state == ACTIVE
    - The bound milestone is still OPEN
    side_effects:
    - loan_state -> OVERDUE
    - The bound milestone's milestone_state -> LATE
    - loan.late_fee_units is computed by calculation loan_late_fee
    - 'CASCADE depth=1: a FrictionPenalty with penalty_reason = LATE_CANCEL and penalty_state = ACTIVE is created against the loan''s supply node'
  - from: OVERDUE
    to: RETURNED
    trigger: POST /evaluation-loans/{loanId}/return
    actor: PartnerProgramManager
    preconditions:
    - loan_state == OVERDUE
    side_effects:
    - loan_state -> RETURNED
    - product.reserved_evaluation_units -= loan_units, so the full round trip nets a zero ring-fence delta
    - Accrued late_fee_units are frozen and not reversed by the return
  - from: OVERDUE
    to: RECLAIMED
    trigger: POST /evaluation-loans/{loanId}/reclaim
    actor: PartnerProgramManager
    preconditions:
    - loan_state == OVERDUE
    side_effects:
    - loan_state -> RECLAIMED
    - product.reserved_evaluation_units -= loan_units, so reclaim nets the same zero delta as return
    - The bound milestone's milestone_state stays LATE and the FrictionPenalty stays ACTIVE
- entity: FrictionPenalty
  initial_state: ACTIVE
  terminal_states:
  - SETTLED
  transitions:
  - from: ACTIVE
    to: DECAYED
    trigger: POST /_ops/advance_epoch
    actor: system
    preconditions:
    - score reaches 0.0 after the half-life decay step is applied
    side_effects:
    - penalty_state -> DECAYED
    - The parent node's friction_penalty_score is recomputed over ACTIVE penalties only
  - from: ACTIVE
    to: SETTLED
    trigger: 'system event: the parent SupplyNode enters BINDING via POST /supply-nodes/{nodeId}/bind'
    actor: system
    preconditions:
    - node.stage == BINDING
    side_effects:
    - penalty_state -> SETTLED
    - The penalty stops contributing to the node's friction_penalty_score
- entity: LifecycleCommitment
  initial_state: REQUESTED
  terminal_states:
  - GRANTED
  - DECLINED
  transitions:
  - from: REQUESTED
    to: GRANTED
    trigger: POST /lifecycle-commitments/{commitmentId}/grant
    actor: LifecycleProgramManager
    preconditions:
    - The embedded partner is in qualification_status == QUALIFIED
    - availability_through is at or after the logical clock plus LIFECYCLE_GRACE_DAYS
    - covered_units <= product.available_units
    side_effects:
    - commitment_status -> GRANTED
    - commitment_floor_days and product.lifecycle_min_remaining_days are computed by calculation lifecycle_commitment_floor
    - partner.lifecycle_floor_expires_at = availability_through
  - from: REQUESTED
    to: DECLINED
    trigger: POST /lifecycle-commitments/{commitmentId}/decline
    actor: LifecycleProgramManager
    preconditions:
    - commitment_status == REQUESTED
    side_effects:
    - commitment_status -> DECLINED; covered_units are returned to the product's uncommitted pool
- entity: AllocationHold
  initial_state: REQUESTED
  terminal_states:
  - CANCELLED
  - RECLAIMED
  - EXPIRED
  transitions:
  - from: REQUESTED
    to: COMMITTED
    trigger: POST /allocation-holds/{id}/commit
    actor: PartnerOps
    preconditions:
    - state == REQUESTED
    - The target SupplyNode is not in stage DRAINING or BINDING
    side_effects:
    - state -> COMMITTED
    - partner.capacity_ledger_net += quantity_units and node.held_units += quantity_units
    - recomputes supply_hotness_tier, temp_band_ceiling, total_committed_rate and allocation_commitment_fee
  - from: REQUESTED
    to: CANCELLED
    trigger: POST /allocation-holds/{id}/cancel
    actor: PartnerOps
    preconditions:
    - state == REQUESTED
    side_effects:
    - state -> CANCELLED; the reservation was never committed so node.held_units is unchanged
    - records an AuditTrailEntry with action_code = HOLD_CANCELLED
  - from: REQUESTED
    to: RECLAIMED
    trigger: 'system event: preemption_displacement displaces this hold while resolving an incoming displacing request'
    actor: system
    preconditions:
    - The hold appears in the frozen displaced prefix produced by the incoming request's preemption pass
    side_effects:
    - state -> RECLAIMED
    - partner.capacity_ledger_net -= quantity_units
    - node.held_units is unchanged because the reservation was never committed
    - the displaced client is expected to resubmit at a later epoch
  - from: COMMITTED
    to: CANCELLED
    trigger: POST /allocation-holds/{id}/cancel
    actor: PartnerOps
    preconditions:
    - state == COMMITTED
    side_effects:
    - state -> CANCELLED; partner.capacity_ledger_net -= quantity_units and node.held_units -= quantity_units
    - when the logical clock is strictly after the confirming forecast's acknowledged_at plus cancellation_notice_days, cancellation_forfeit_units is written from the forecast's forfeit_rate
  - from: COMMITTED
    to: RECLAIMED
    trigger: POST /allocation-holds/{id}/reclaim
    actor: PlatformAdmin
    preconditions:
    - state == COMMITTED
    side_effects:
    - state -> RECLAIMED; partner.capacity_ledger_net -= quantity_units and node.held_units -= quantity_units
    - recomputes supply_hotness_tier and temp_band_ceiling
  - from: COMMITTED
    to: EXPIRED
    trigger: POST /allocation-holds/{id}/expire
    actor: PlatformAdmin
    preconditions:
    - state == COMMITTED
    side_effects:
    - state -> EXPIRED; node.held_units -= quantity_units
    - partner.capacity_ledger_net is deliberately NOT changed, so an expiry leaves more held capacity on the partner's ledger than the pool actually holds
- entity: ValidationEvidence
  initial_state: SUBMITTED
  terminal_states:
  - ACCEPTED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /validations/{id}/accept
    actor: PartnerProgramManager
    preconditions:
    - evidence_pack_status == SUBMITTED
    - The evidence's validation_minutes is at least the blueprint's required_validation_minutes, otherwise ERR_EVIDENCE_INSUFFICIENT
    side_effects:
    - evidence_pack_status -> ACCEPTED
  - from: SUBMITTED
    to: REJECTED
    trigger: 'POST /validations/{id}/reject, or system event: the owning partner is rejected'
    actor: PartnerProgramManager | system
    preconditions:
    - evidence_pack_status == SUBMITTED
    side_effects:
    - evidence_pack_status -> REJECTED
    - when the parent blueprint loses its only ACCEPTED evidence in the current era, blueprint.era_index += 1 so the superseded round's minutes stop counting toward certification
concurrency_rules:
- rule_id: hold-supersede-stale-partner
  parent_entity: PartnerAccount
  write_endpoint: POST /accelerators/allocation-holds
  occ_field: expected_partner_version
  description: 'Submitting a new allocation hold against a partner whose version has

    advanced since the client last observed it is rejected with 412. This is

    the sanctioned way to resolve the case where the partner''s committed

    volume or entitlement ledger moved between the client''s read and its

    write, because the request the client is repeating would otherwise be

    accepted twice on the same observed partner state.

    '
  error_id: ERR_STALE_PARTNER_VERSION
  http_status: 412
- rule_id: forecast-stale-partner
  parent_entity: PartnerAccount
  write_endpoint: POST /accelerators/demand-forecasts
  occ_field: expected_partner_version
  description: 'Creating a demand forecast at a partner version that is no longer current

    is rejected with 412. The forecast ceiling is evaluated against the

    partner''s committed volume at the time the request is applied, so a hold

    application carrying a superseded version must not silently re-derive the

    ceiling from a stale read.

    '
  error_id: ERR_STALE_PARTNER_VERSION
  http_status: 412
- rule_id: evaluate-subscription-version
  parent_entity: EnterpriseSubscription
  write_endpoint: POST /accelerators/subscriptions/{id}/evaluate
  occ_field: expected_subscription_version
  description: 'Evaluating a subscription from a stale version is rejected with 412. The

    subscription-level evaluation competes with a second evaluation of the

    same subscription against the account record; the OCC check on the

    subscription version is what rejects the evaluation carrying the

    superseded observation.

    '
  error_id: ERR_STALE_SUBSCRIPTION_VERSION
  http_status: 412
concurrency_guards:
- name: allocation-units-human-locked
  entity: AcceleratorProduct
  endpoint: POST /accelerators/allocation-holds
  field: expected_allocated_units
  error_id: ERR_ALLOCATED_UNITS_CHANGED
  http_status: 412
  note: 'The allocation guard is NOT optimistic concurrency on AcceleratorProduct.version.

    The request must echo the product''s allocated_units value the client

    observed; a mismatch is rejected with ERR_ALLOCATED_UNITS_CHANGED (412),

    whatever the row version happens to be. This is the deliberately

    different failure mode the specification pins so that a test can tell the

    two guards apart: bumping the product version while leaving

    allocated_units unchanged must NOT trip this guard, and changing

    allocated_units while leaving the version untouched must.'
calculations:
- name: subscription_fee_provisional
  trigger: EnterpriseSubscription DRAFT_to_ACTIVE
  algorithm: forward_looking
  formula: 'per_seat_fee_cents = TIER_SEAT_FEE[support_tier]

    annual_fee_cents = per_seat_fee_cents

    billed_fee_cents = seat_count * per_seat_fee_cents

    '
  input_set: 'Included: the subscription''s declared seat_count as submitted. Excluded: no floor, cap or historical adjustment is applied.'
  constants:
    TIER_SEAT_FEE:
      BASIC: 12000
      BUSINESS: 36000
      ENTERPRISE: 90000
    SEAT_MIN: 40
    SEAT_CAP: 1000
  precision: 0 decimal places (integer cents)
  note: 'Forward-looking: bills every declared seat. This value differs from subscription_fee_final whenever seat_count < SEAT_MIN.'
- name: subscription_fee_final
  trigger: EnterpriseSubscription ACTIVE_to_RECLAIMED, ACTIVE_to_EXPIRED and every settle pass
  algorithm: chronological
  formula: 'per_seat_fee_cents = TIER_SEAT_FEE[support_tier]

    billable_seats = max( min(seat_count, SEAT_CAP), SEAT_MIN )

    settled_fee_cents = billable_seats * per_seat_fee_cents

    '
  input_set: 'Included: seat_count as finally recorded at settlement. Excluded: seats above SEAT_CAP are never billed, and the SEAT_MIN floor is always billed even when fewer seats were declared.'
  constants:
    TIER_SEAT_FEE:
      BASIC: 12000
      BUSINESS: 36000
      ENTERPRISE: 90000
    SEAT_MIN: 40
    SEAT_CAP: 1000
  precision: 0 decimal places (integer cents)
  key_insight: 'subscription_fee_provisional (forward-looking) and subscription_fee_final

    (chronological) produce different results for identical input whenever

    seat_count < SEAT_MIN. On the same subscription, seat_count = 25 and

    support_tier = BUSINESS yields 900000 provisional and 1440000 final.

    '
- name: support_tier_credit
  trigger: EnterpriseSubscription DRAFT_to_ACTIVE and every settle pass
  algorithm: threshold
  formula: "if seat_count < SEAT_MIN:\n  support_credit_units = seat_count * CREDIT_BELOW_MIN\nelse:\n  support_credit_units = seat_count * CREDIT_AT_OR_ABOVE_MIN\n"
  input_set: 'Included: seat_count as declared. Excluded: nothing — the credit is defined for every positive seat count.'
  constants:
    SEAT_MIN: 40
    CREDIT_BELOW_MIN: 3
    CREDIT_AT_OR_ABOVE_MIN: 5
  precision: 0 decimal places (integer)
  note: 'Boundary: seat_count == 40 is AT or above the minimum, giving 200 credit units. seat_count == 39 gives 117.'
- name: allocation_value_estimate
  trigger: AllocationHold creation and every preemption ranking pass
  algorithm: weighted_scoring
  formula: 'allocation_gap_days = max(0, floor((partner.eligibility_deadline_at - logical_clock) / 86400))

    t_scaled = min(allocation_gap_days, TIME_MAX)

    u_scaled = min(quantity_units, UNIT_MAX)

    value_units = round_half_even(W_TIME * t_scaled + W_UNIT * u_scaled, 1)

    '
  input_set: 'Included: the requesting partner''s eligibility_deadline_at and the request''s quantity_units. Excluded: real elapsed time beyond TIME_MAX is discarded (saturating ramp).'
  constants:
    W_TIME: 10.0
    W_UNIT: 1.0
    TIME_MAX: 30
    UNIT_MAX: 500
  precision: 1 decimal place, round_half_even
- name: allocation_value_confirm
  trigger: AllocationHold creation, preemption ranking and every re-rank pass
  algorithm: weighted_scoring
  formula: 'allocation_gap_days = max(0, floor((partner.eligibility_deadline_at - logical_clock) / 86400))

    t_scaled = allocation_gap_days

    u_scaled = min(quantity_units, UNIT_MAX)

    value_units = round_half_even(W_TIME * t_scaled + W_UNIT * u_scaled, 1)

    '
  input_set: 'Included: every real elapsed day, with no saturation. Excluded: nothing.'
  constants:
    W_TIME: 10.0
    W_UNIT: 1.0
    TIME_MAX: 30
    UNIT_MAX: 500
  precision: 1 decimal place, round_half_even
  key_insight: 'Identical inputs, different numbers: with allocation_gap_days = 45 and

    quantity_units = 500 the estimate is 800.0 while the confirm score is

    950.0, because the chronological variant does not clamp the ramp at

    TIME_MAX.

    '
- name: allocation_priority_ranking
  trigger: AllocationHold creation when the node has insufficient unheld capacity, and POST /supply-nodes/{nodeId}/rank
  algorithm: weighted_scoring
  formula: "candidate_set = every AllocationHold h where\n  h.product_sku_id == incoming.product_sku_id\n  AND h.state == REQUESTED\n  AND TIER_INDEX[h.hold_friction_tier] <= TIER_INDEX[parent_node.temp_band_ceiling]\n\nscore(h) = allocation_value_confirm(h)\n           - 0.5 * allocation_value_estimate(h)\n           - PENALTY_ATTEMPT * h.partner.qualification_attempt_count\n\nTerms whose product is exactly 0.0 are omitted from the sum rather than\nbeing written as an explicit zero addend, so a candidate with a\nqualification_attempt_count of 0 carries no penalty term at all.\n\nrank(candidate_set) by:\n  1. score(h) DESCENDING\n  2. tie-break: the earliest created_at among the candidate's AllocationHold\n     rows for this SKU, ASCENDING (the standby request that created the\n     eligibility is the tie-break anchor)\n  3. final fallback: h.created_at ASCENDING\nThe random `id` field is never consulted at any level of this ranking.\n"
  input_set: 'Included: holds in state REQUESTED only; holds that are COMMITTED, CANCELLED, RECLAIMED or EXPIRED are excluded. The candidate set is empty when no REQUESTED hold exists on the SKU.'
  constants:
    TIER_INDEX:
      COOL: 0
      WARM: 1
      HOT: 2
      SCALDING: 3
    PENALTY_ATTEMPT: 5.0
    TIE_BREAK_SOURCE: created_at
  precision: 1 decimal place, round_half_even
  note: 'A score of exactly 0.0 is representable: it is what a candidate carries when allocation_value_confirm and allocation_value_estimate are both 0.0 and the penalty term is omitted.'
  fallback: When candidate_set is empty, POST /allocation-holds returns ERR_NO_ALLOCATION_CANDIDATE rather than rejecting on capacity.
- name: preemption_displacement
  trigger: POST /allocation-holds when node.held_units + quantity_units would exceed node.capacity_units and the incoming hold carries preempt_lower_tier = true
  algorithm: constraint_propagation
  formula: "Walk the allocation_priority_ranking of the candidate set from the LOWEST\nscore upward, accumulating quantity_units, and stop as soon as the\naccumulated total is greater than or equal to the incoming quantity_units.\nThe resulting prefix is the displaced set — every member becomes RECLAIMED.\n\nEvaluation order is pinned and MUST NOT be revisited mid-loop:\n  1. Each candidate partner's committed_volume_units is read ONCE, as a\n     snapshot taken before the incoming hold row is created.\n  2. allocation_priority_ranking is evaluated ONCE per candidate against\n     that snapshot.\n  3. The incoming hold's quantity is added to its partner's\n     committed_volume_units only AFTER the displaced set is frozen and the\n     RECLAIMED rows have been written.\nThe order is explicit because committed_volume_units feeds\nallocation_priority_ranking, so allowing step 3 to run before step 2\nwould re-rank the very candidates the preemption is displacing.\n"
  input_set: 'Included: every candidate in the frozen ranking snapshot, lowest score first. Excluded: the incoming hold itself, and any hold already in a terminal state.'
  constants:
    TIER_INDEX:
      COOL: 0
      WARM: 1
      HOT: 2
      SCALDING: 3
  precision: 0 decimal places (integer unit counts)
  invariant: "INVARIANT-CAPACITY-LEDGER (conserved quantity: partner-held supplier\ncapacity units). See calculation capacity_ledger_signed for the closed\nsigned-delta table over AllocationHold states; the fill-then-free amount\nis exactly zero:\n  partner_A.capacity_ledger_net (after commit-then-reclaim)\n    + partner_B.capacity_ledger_net (after commit-then-consume_reservation)\n  == 0\n"
- name: capacity_ledger_signed
  trigger: Every AllocationHold state transition
  algorithm: accumulation
  formula: "partner.capacity_ledger_net changes by exactly these signed deltas:\n  AllocationHold REQUESTED_to_COMMITTED (reserve)      : += quantity_units\n  AllocationHold COMMITTED_to_RECLAIMED (preempt)      : -= quantity_units\n  AllocationHold REQUESTED_or_COMMITTED_to_CANCELLED   : -= quantity_units\n  AllocationHold COMMITTED_to_EXPIRED (no successor)   : no change\n  SupplyNode.consume_reservation                       : -= quantity_units\nEvery other transition in the scaffold leaves this field untouched.\n"
  input_set: 'Included: all hold transitions that carry a signed ledger delta. Excluded: SupplyNode, partial-allocation and lifecycle transitions, which never touch this ledger.'
  constants:
    LEDGER_NAME: capacity_ledger_net
  precision: 0 decimal places (integer units)
  note: 'Reconciliation available on the partner read: capacity_ledger_net equals the running sum of the delta table above across every hold the partner ever created.'
- name: allocation_commitment_fee
  trigger: Every allocation-creating or reclaiming mutation on a SupplyNode
  algorithm: aggregation
  formula: "ROUNDING ORDER IS PINNED: round PER ALLOCATION at the half-even cent,\nTHEN sum. Summing first and rounding once afterwards is NOT this\nscaffold's semantics and produces a different total.\n\nfor each hold h on the node with h.state IN {COMMITTED, REQUESTED}:\n  amount_cents = round_half_even(\n      h.committed_rate_v2 * h.quantity_units\n      * COMMITMENT_RATE_TABLE[h.forecast.horizon_band] * 100,\n      0)\nnode.committed_fee_cents = sum(amount_cents)\n"
  input_set: 'Included: holds in state COMMITTED or REQUESTED. Excluded: RECLAIMED, CANCELLED and EXPIRED holds contribute nothing.'
  constants:
    COMMITMENT_RATE_TABLE:
      SHORT: 0.2
      MEDIUM: 0.35
      LONG: 0.5
    CENT_SCALE: 100
  precision: 0 decimal places (integer cents), round_half_even per allocation
- name: entitlement_pool_release
  trigger: HardwareDeployment ACTIVATED_to_TERMINATED
  algorithm: waterfall_allocation
  formula: "Step 1 (subscription bucket): released_entitlement_units = sum of the\n  bound stack's entitlement_units for every EnterpriseSubscription bound\n  to this deployment whose status was ACTIVE or SUSPENDED at the instant\n  of termination.\nStep 2 (deployment bucket): deployment.termination_effect_units =\n  min(released_entitlement_units, product.allocated_units)\nStep 3 (partner bucket): partner.entitlement_units_held -=\n  released_entitlement_units\nStep 4 (product bucket): product.allocated_units -=\n  deployment.termination_effect_units\n"
  input_set: 'Included: ACTIVE and SUSPENDED subscriptions bound to the terminating deployment. Excluded: subscriptions already RECLAIMED or EXPIRED contribute no entitlement release.'
  constants:
    ENTITLEMENT_MULTIPLIER: 2
  precision: 0 decimal places (integer units)
  invariant: 'INVARIANT-CONFIRM-RECLAIM: for the holder of a subscription, confirming the

    subscription (DRAFT_to_ACTIVE) and then reclaiming it

    (ACTIVE_or_SUSPENDED_to_RECLAIMED) leaves partner.entitlement_units_held

    exactly unchanged, because reclaim is forbidden from touching the

    entitlement ledger. Only the deployment termination path releases

    entitlement units.

    '
- name: entitlement_state_transition
  trigger: Every EnterpriseSubscription and HardwareDeployment transition
  algorithm: aggregation
  formula: "partner.entitlement_units_held changes by exactly these deltas and by no\nothers:\n  EnterpriseSubscription DRAFT_to_ACTIVE          : += bound_stack.entitlement_units\n  HardwareDeployment ACTIVATED_to_TERMINATED      : -= entitlement_pool_release step 1\n  EnterpriseSubscription ACTIVE_to_SUSPENDED      : no change\n  EnterpriseSubscription SUSPENDED_to_ACTIVE      : no change\n  EnterpriseSubscription ACTIVE_or_SUSPENDED_to_RECLAIMED : no change\n  EnterpriseSubscription ACTIVE_to_EXPIRED        : no change\n  HardwareDeployment PENDING_to_ACTIVATED         : no change\n  HardwareDeployment TERMINATED_to_PENDING        : no change\n"
  input_set: 'Included: all subscription and deployment transitions that carry a ledger delta. Excluded: membership, forecast, qualification and loan transitions, which never touch this ledger.'
  constants:
    LEDGER_NAME: entitlement_units_held
  precision: 0 decimal places (integer units)
  note: 'Reconciliation assertion available on the partner read: partner.entitlement_units_held equals the running sum of the delta table above.'
- name: export_density_band
  trigger: AcceleratorProduct creation and every HardwareDeployment PENDING_to_ACTIVATED for that product
  algorithm: threshold
  formula: "declared variant (forward-looking, used at product creation):\n  declared_density = tdp_watts\n  export_performance_density_band = HIGH if declared_density >= DENSITY_BOUNDARY else LOW\n\nfinal variant (computed, used whenever a deployment activates on the product):\n  computed_density = ceil(tdp_watts / 100.0) * 100\n  export_performance_density = computed_density\n  export_performance_density_band = HIGH if computed_density >= DENSITY_BOUNDARY else LOW\n"
  input_set: 'Included: the product''s tdp_watts. Excluded: partner and destination fields — those are resolved by export_control_classification, which consumes this band.'
  constants:
    DENSITY_BOUNDARY: 1400
    DENSITY_STEP: 100
  precision: 0 decimal places (integer watts)
  variants:
  - name: declared
    when: at product creation, before any deployment has activated
    difference: uses tdp_watts verbatim, so a declared 1350 stays LOW
  - name: computed
    when: at the first HardwareDeployment PENDING_to_ACTIVATED for the product
    difference: ceil(1350/100)*100 = 1400, so the same product flips to HIGH with export_performance_density == 1400
- name: qualification_attempt_penalty
  trigger: PartnerAccount IN_VALIDATION_to_APPLIED (rejection roll-back) and every priority re-rank
  algorithm: decay_function
  formula: 'penalty_points = min(qualification_attempt_count * ATTEMPT_PENALTY_BASE, ATTEMPT_PENALTY_CAP)

    allocation_priority_score = allocation_priority_score - penalty_points

    '
  input_set: 'Included: every recorded rejection for this partner, preserved across re-application. Excluded: successes, which never increment the counter.'
  constants:
    ATTEMPT_PENALTY_BASE: 5
    ATTEMPT_PENALTY_CAP: 20
  precision: 0 decimal places (integer points)
  note: 'Boundary: attempt_count == 4 and attempt_count == 5 both yield a 20-point penalty because the cap binds at 4.'
- name: forecast_commitment_deadline
  trigger: DemandForecast DRAFT_to_FORECAST_SUBMITTED and DemandForecast CANCELLED_to_FORECAST_SUBMITTED
  algorithm: threshold
  formula: "month = month of acknowledged_at\nboundary = the third Saturday of that month. Evaluated as: start at\n  day_of_month = FORECAST_BOUNDARY_DAY (15); advance forward one day at a\n  time until the weekday is Saturday; that day is `boundary`.\n\nif day_of_month(acknowledged_at) >= FORECAST_BOUNDARY_DAY\n   AND acknowledged_at <= boundary + 1 day:\n     horizon_band = SHORT\n     eligibility_deadline_at = boundary + 1 day\nelif acknowledged_at <= boundary + 7 days:\n     horizon_band = MEDIUM\n     eligibility_deadline_at = acknowledged_at + 45 days\nelse:\n     horizon_band = LONG\n     eligibility_deadline_at = acknowledged_at + 90 days\n"
  input_set: 'Included: the acknowledgement instant only. Excluded: the requested quantity, which never influences the band.'
  constants:
    FORECAST_BOUNDARY_DAY: 15
    SHORT_DEADLINE_OFFSET_DAYS: 1
    MEDIUM_GAP_DAYS: 45
    LONG_GAP_DAYS: 90
  precision: UTC instants truncated to the second; date arithmetic in whole days
  note: 'Worked example: acknowledged_at == 2026-09-01T00:00:00Z (day 1, before the 15th) gives boundary 2026-09-19; 2026-09-01 is within boundary + 7 days, so the band is MEDIUM and eligibility_deadline_at == 2026-10-16T00:00:00Z.'
  note_second: 'Boundary case: acknowledged_at == 2026-09-18T00:00:00Z (day 18 >= 15 and <= 2026-09-20) gives SHORT with eligibility_deadline_at == 2026-09-20T00:00:00Z.'
- name: forecast_forfeit_rate
  trigger: DemandForecast FORECAST_SUBMITTED_to_ACTIVE (commit)
  algorithm: threshold
  formula: "base_rate = FORFEIT_BAND_RATE[horizon_band]\noverage_excess = max(0, partner.committed_volume_units - requested_quantity_units)\noverage_ratio = overage_excess / max(1, requested_quantity_units)\nforfeit_rate = round_half_even(\n    min( base_rate + min(FORFEIT_OVERAGE_PENALTY, overage_ratio), OVERAGE_CAP ),\n    4)\n"
  input_set: 'Included: the band fixed at acknowledgement and the partner''s committed volume snapshot taken before this commit is applied. Excluded: holds, which do not contribute to committed_volume_units.'
  constants:
    FORFEIT_BAND_RATE:
      SHORT: 0.1
      MEDIUM: 0.25
      LONG: 0.25
    FORFEIT_OVERAGE_PENALTY: 0.05
    OVERAGE_CAP: 0.75
  precision: 4 decimal places, round_half_even
  note: 'Boundary: the MEDIUM band yields exactly 0.25 — the flip is inclusive at MEDIUM. The SHORT band yields 0.10 when the partner''s committed volume does not exceed the requested ceiling.'
- name: evaluation_ring_fence
  trigger: AcceleratorProduct lifecycle advance to GENERAL_AVAILABILITY, EvaluationLoan REQUESTED_to_APPROVED, and EvaluationLoan return or reclaim
  algorithm: waterfall_allocation
  formula: "at product advance to GENERAL_AVAILABILITY:\n  reserved_evaluation_units = ceil(supply_ceiling_units * EVAL_RESERVE_RATIO)\nat loan approval:\n  reserved_evaluation_units += loan_units\nat loan return or reclaim:\n  reserved_evaluation_units -= loan_units\navailable_units = max(0, supply_ceiling_units - allocated_units - reserved_evaluation_units)\n"
  input_set: 'Included: every loan in state IN {APPROVED, ACTIVE, OVERDUE} contributes its loan_units to the ring fence. Excluded: REQUESTED and RECLAIMED loans, whose units were never ring-fenced or have already been released.'
  constants:
    EVAL_RESERVE_RATIO: 0.1
  precision: 0 decimal places (integer units)
  invariant: 'INVARIANT-EVAL-LOAN: approving a loan of u units and then returning or

    reclaiming that loan leaves AcceleratorProduct.reserved_evaluation_units

    exactly where it started; the round trip nets a zero ring-fence delta.

    '
- name: supply_hotness_tier
  trigger: Every allocation mutation on a SupplyNode, and POST /_ops/advance_epoch
  algorithm: decay_function
  formula: "total_committed_rate = sum(h.committed_rate_v2 for h in node's holds\n                           where h.state IN {COMMITTED, REQUESTED})\n\nif total_committed_rate >= HOTNESS_SCALDING_RATE: hotness_tier = SCALDING\nelif total_committed_rate >= HOTNESS_HOT_RATE:   hotness_tier = HOT\nelif total_committed_rate >= HOTNESS_WARM_RATE:  hotness_tier = WARM\nelse:                                            hotness_tier = COOL\n\ntemp_band_ceiling = BAND_CEILING[hotness_tier]\nhalf_life_next = the band total_committed_rate would occupy after\n                 HALF_LIFE_EPOCHS epochs of exponential half-life decay,\n                 evaluated against the same boundary constants\n"
  input_set: 'Included: holds in state COMMITTED or REQUESTED only. Excluded: holds that were RECLAIMED, CANCELLED or EXPIRED, which stop contributing to the pool temperature.'
  constants:
    HOTNESS_WARM_RATE: 2.0
    HOTNESS_HOT_RATE: 7.0
    HOTNESS_SCALDING_RATE: 10.5
    HALF_LIFE_EPOCHS: 3
    BAND_CEILING:
      COOL: COOL
      WARM: COOL
      HOT: WARM
      SCALDING: COOL
  precision: 1 decimal place, round_half_even
  note: 'Boundary: total_committed_rate == 7.0 is HOT (the comparison is inclusive); 6.999 is WARM. total_committed_rate == 10.5 is SCALDING. Because BAND_CEILING[SCALDING] is COOL, a SCALDING pool accepts only COOL holds — a hotter ceiling is never granted to a hotter pool.'
- name: committed_rate_v2
  trigger: Every AllocationHold creation and every evolve pass
  algorithm: tiered_pricing
  formula: "unit_based variant (the pricing model named \"v2\"):\n  for each 100-unit band b (0-indexed) covering quantity_units:\n    band_units = number of this hold's units that fall in band b\n    band_rate_b = min( RATE_PER_UNIT + b * RATE_BAND_STEP, RATE_CAP )\n    committed_rate_v2 = round_half_even(\n        sum(band_units * band_rate_b) / quantity_units, 4)\n    committed_fee_cents = round_half_even(sum(band_units * band_rate_b) * 100, 0)\ntime_based variant (the previous pricing model, still requested by\npartners whose origin_epoch_index is below the cutover):\n  committed_rate_v2 = RATE_PER_UNIT\n  committed_fee_cents = round_half_even(quantity_units * RATE_PER_UNIT * 100, 0)\n"
  input_set: 'Included: the hold''s quantity_units. Excluded: the partner''s other holds, which are summed separately by supply_hotness_tier.'
  constants:
    RATE_PER_UNIT: 1.75
    RATE_BAND_WIDTH_UNITS: 100
    RATE_BAND_STEP: 0.25
    RATE_CAP: 4.5
    CUTOVER_EPOCH_INDEX: 3
  precision: 4 decimal places, round_half_even
  variants:
  - name: time_based
    when: the hold's partner origin_epoch_index is below CUTOVER_EPOCH_INDEX
    difference: every unit is charged RATE_PER_UNIT, so the rate is 1.75 regardless of quantity
  - name: unit_based
    when: the hold's partner origin_epoch_index is at or above CUTOVER_EPOCH_INDEX
    difference: marginal bands apply, so quantity_units == 250 yields 1.95 while the time-based model still yields 1.75
- name: loan_late_fee
  trigger: POST /_ops/advance_epoch while an EvaluationLoan is OVERDUE
  algorithm: accumulation
  formula: 'days_late = max(0, floor((logical_clock - required_return_at) / 86400))

    late_fee_units = round_half_even(min(days_late * LATE_FEE_PER_DAY_UNITS, LATE_FEE_CAP_UNITS), 1)

    '
  input_set: 'Included: every whole day past required_return_at while the loan sits in OVERDUE. Excluded: days before required_return_at, and days after the loan leaves OVERDUE.'
  constants:
    LATE_FEE_PER_DAY_UNITS: 0.5
    LATE_FEE_CAP_UNITS: 15.0
  precision: 1 decimal place, round_half_even
  note: 'Boundary: 30 days late and 31 days late both yield 15.0 because the cap binds at 30 days.'
- name: developer_tier_provision
  trigger: DeveloperProgramMembership REQUESTED_to_UNDER_EVALUATION, UNDER_EVALUATION_to_ACTIVE, LAPSED_to_UNDER_EVALUATION, and the deployment activation cascade depth 3
  algorithm: threshold
  formula: "preview_kit_units = TIER_KIT_UNITS[stored_tier]\n                    + ceil(accepted_evidence_minutes / ELITE_ADVANCE_MINUTES)\nsupport_incidents_included = TIER_INCIDENT_UNITS[stored_tier]\n                    + floor(latest_active_subscription.support_credit_units / 100)\n"
  input_set: 'Included: the membership''s stored_tier, the partner''s ACCEPTED ValidationEvidence minutes in the current blueprint era, and the partner''s most recently activated EnterpriseSubscription. Excluded: requested_tier, which never grants provisioning before a renewal lifts stored_tier.'
  constants:
    TIER_KIT_UNITS:
      COMMUNITY: 0
      REGISTERED: 2
      PREFERRED: 6
      ELITE: 12
    TIER_INCIDENT_UNITS:
      COMMUNITY: 0
      REGISTERED: 1
      PREFERRED: 3
      ELITE: 8
    ELITE_ADVANCE_MINUTES: 600
  precision: 0 decimal places (integer)
  note: Grants are computed against stored_tier, never against requested_tier, so an ELITE request from a REGISTERED membership still provisions 2 kits.
- name: lifecycle_commitment_floor
  trigger: LifecycleCommitment REQUESTED_to_GRANTED and every AcceleratorProduct lifecycle advance
  algorithm: threshold
  formula: "EVALUATION ORDER IS PINNED as follows; reversing steps 1 and 2 changes the result.\n  1. requested_floor_days = floor((availability_through - logical_clock) / 86400)\n     computed from the REQUESTED availability_through, before any clamping\n  2. extension_days = EMBEDDED_EXTENSION_DAYS if partner.partner_type == EMBEDDED_VENDOR else 0\n  3. commitment_floor_days = max(requested_floor_days, COMMITMENT_FLOOR_MIN_DAYS + extension_days)\n  4. product.lifecycle_min_remaining_days =\n       commitment_floor_days if product.lifecycle_stage IN {MATURE, END_OF_LIFE}\n       else min(commitment_floor_days, COMMITMENT_FLOOR_MIN_DAYS)\n"
  input_set: 'Included: the requested horizon, the partner type and the SKU lifecycle stage. Excluded: covered_units, which gate the grant but never change the floor.'
  constants:
    LIFECYCLE_GRACE_DAYS: 365
    EMBEDDED_EXTENSION_DAYS: 730
    COMMITMENT_FLOOR_MIN_DAYS: 1825
  precision: 0 decimal places (whole days)
  note: 'Trap: for an EMBEDDED_VENDOR at MATURE stage, step 3 produces 2555 and step 4''s min() at MATURE is not applied because MATURE is in the exempt set. For the same commitment taken at GENERAL_AVAILABILITY, step 4 caps the value back to 1825.'
- name: partner_priority_class
  trigger: POST /_ops/advance_epoch; derived for every qualified partner
  algorithm: threshold
  formula: "on_time_ratio = round_half_even(on_time_deliveries / max(1, total_deliveries), 4)\nif qualification_status != QUALIFIED:\n  allocation_priority_class = UNQUALIFIED\nelif entitlement_units_held >= TIER1_ENTITLEMENT_MIN\n     AND on_time_ratio >= TIER1_ON_TIME_RATIO_MIN\n     AND qualification_attempt_count == 0:\n  allocation_priority_class = TIER_1\nelif entitlement_units_held >= TIER2_ENTITLEMENT_MIN:\n  allocation_priority_class = TIER_2\nelse:\n  allocation_priority_class = TIER_3\n"
  input_set: 'Included: every partner with qualification_status == QUALIFIED. Excluded: APPLIED, IN_VALIDATION and REJECTED partners, which always classify as UNQUALIFIED.'
  constants:
    TIER1_ENTITLEMENT_MIN: 2000
    TIER1_ON_TIME_RATIO_MIN: 0.8
    TIER2_ENTITLEMENT_MIN: 500
  precision: 4 decimal places for the ratio, round_half_even
  note: 'Boundary: entitlement_units_held == 2000 is TIER_1 (inclusive) while 1999 is TIER_2. A single prior rejection zeroes the TIER_1 path even at 2000 units.'
validations:
- priority: 1
  name: header_context_present
  category: auth
  check: X-User-ID and X-User-Role headers must both be present and carry a role declared in the RBAC matrix
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all endpoints
- priority: 2
  name: role_permitted
  category: auth
  check: The caller's X-User-Role must appear in the endpoint's declared roles list
  error_id: ERR_FORBIDDEN_FOR_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  name: path_resource_exists
  category: existence
  check: 'The resource named in the path must exist: partner, product, supply node, blueprint, hold, evidence, subscription, deployment, stack license, membership, preview grant, forecast, loan, milestone, commitment, penalty or epoch'
  error_id: ERR_PARTNER_NOT_FOUND
  http_status: 404
  applies_to: all /partners/{partnerId}/... paths; ERR_RESOURCE_NOT_FOUND for every other collection
  note: The path segment is resolved before any body field, so a request naming an unknown parent path and an unknown body FK reports the path error.
- priority: 4
  name: body_foreign_keys_resolve
  category: existence
  check: Body-declared references must exist, resolved in the order the endpoint's input list declares them left-to-right; a partner_id or embedded_partner_id body reference resolves to a PartnerAccount, a product_sku_id / blueprint_id / stack_license_id to the corresponding collection
  error_id: ERR_BLUEPRINT_NOT_FOUND
  http_status: 404
  applies_to: POST /partners/{partnerId}/validations, POST /deployment-groups, POST /license-hold-groups
  note: 'Two body references on the same request resolve left-to-right: the earlier field''s error wins.'
- priority: 5
  name: target_state_precondition
  category: state
  check: The target resource must be in a state whose state machine admits the requested trigger; e.g. a deployment must be ACTIVATED to terminate, a license must be RELEASED to retire, a commitment must be REQUESTED to grant
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  name: export_control_destination
  category: business_safety
  check: The resolved export_control_classification for the request must not be TIER_3_PROHIBITED; a TIER_2_LICENSE_REQUIRED destination additionally requires an ExportLicenseGrant with grant_status == ACTIVE before the operation may proceed
  error_id: ERR_EXPORT_CONTROL_RESTRICTED
  http_status: 403
  applies_to: POST /deployments, POST /deployments/{deploymentId}/activate, POST /license-hold-groups, POST /deployment-groups
  note: 'Two distinct errors are emitted from this rule: ERR_EXPORT_CONTROL_RESTRICTED when the tier is TIER_3_PROHIBITED, and ERR_EXPORT_LICENSE_REQUIRED when the tier is TIER_2_LICENSE_REQUIRED and no active grant is on file.'
- priority: 7
  name: confidentiality_nda_bound
  category: business_safety
  check: A request whose referenced stack license has preview_stack_flag == true requires the acting partner to hold a ConfidentialityAcknowledgement with ack_status == BOUND for that stack
  error_id: ERR_NDA_NOT_BOUND
  http_status: 403
  applies_to: POST /preview-grants, POST /deployments/{deploymentId}/activate
- priority: 8
  name: same_actor_deployment_chain
  category: business_safety
  check: The X-User-ID terminating a deployment must differ from the X-User-ID recorded on the AuditTrailEntry for that deployment's PENDING_to_ACTIVATED transition
  error_id: ERR_SAME_ACTOR_DEPLOYMENT_CHAIN
  http_status: 409
  applies_to: POST /deployments/{deploymentId}/terminate
  note: This rule is ordered BELOW the covering-subscription business-constraint rule, so a deployment with no covering subscription reports ERR_NO_COVERING_SUBSCRIPTION (409) rather than this error, while a deployment with a covering subscription terminated by its own activator reports this error.
- priority: 9
  name: hold_tier_within_band
  category: business_constraint
  check: hold_friction_tier must rank at or below the target SupplyNode's temp_band_ceiling; ranking is TIER_INDEX order COOL=0 < WARM=1 < HOT=2 < SCALDING=3, compared with <=
  error_id: ERR_HOLD_TIER_EXCEEDS_BAND
  http_status: 409
  applies_to: POST /allocation-holds, POST /license-hold-groups
- priority: 10
  name: supply_node_open_for_allocation
  category: business_constraint
  check: The target SupplyNode must not be in stage DRAINING or BINDING for a new allocation; both stages refuse allocation-creating requests
  error_id: ERR_NODE_NOT_OPEN_FOR_ALLOCATION
  http_status: 409
  applies_to: POST /allocation-holds, POST /license-hold-groups
- priority: 11
  name: open_epoch_exists
  category: business_constraint
  check: An AllocationEpoch with epoch_status == OPEN must exist before any allocation-creating call may proceed
  error_id: ERR_NO_OPEN_EPOCH
  http_status: 409
  applies_to: POST /allocation-holds, POST /demand-forecasts/{forecastId}/commit, POST /partners/{partnerId}/qualify, POST /license-hold-groups
- priority: 12
  name: licence_group_honoured
  category: business_constraint
  check: 'A deployment group with group_satisfied == false must not be shipped: every member valuation must be satisfied before the group may be dispatched'
  error_id: ERR_GROUP_NOT_SATISFIED
  http_status: 409
  applies_to: POST /deployment-groups/{groupId}/dispatch
- priority: 13
  name: forecast_supports_hold
  category: business_constraint
  check: When an AllocationHold names a forecast_id, that DemandForecast must be in tracking_status IN {ACTIVE, COMMITTED} for the same partner and product SKU
  error_id: ERR_FORECAST_NOT_COMMITTED
  http_status: 409
  applies_to: POST /allocation-holds
- priority: 14
  name: contract_window_overlap
  category: business_temporal
  check: Two supply contracts for the same product SKU are compared as half-open month windows [start_month, end_month+1); an inclusive boundary collision is the case start_month == an existing contract's end_month + 1 month
  error_id: ERR_CONTRACT_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /supply-contracts
- priority: 15
  name: preview_grant_window_overlap
  category: business_temporal
  check: Two preview grants for the same partner and product SKU are compared as closed day windows [commitment_boundary_at, commitment_expires_at], with a 30-day buffer applied to the existing grant's end; a new grant whose start falls on the buffered end minus one day is an overlap
  error_id: ERR_PREVIEW_GRANT_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /preview-grants
- priority: 16
  name: nda_window_overlap
  category: business_temporal
  check: Two confidentiality acknowledgements for the same stack license are compared as open month windows (start_month, end_month] that allow a single month of adjacency by rejecting only when the new window starts strictly before the existing window's end month minus one
  error_id: ERR_NDA_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /confidentiality-acks
- priority: 17
  name: forecast_deadline_open
  category: business_temporal
  check: A forecast commit must be received strictly before the partner's eligibility_deadline_at; a commit arriving at exactly the deadline instant is late
  error_id: ERR_FORECAST_DEADLINE_PASSED
  http_status: 409
  applies_to: POST /demand-forecasts/{forecastId}/commit
- priority: 18
  name: lifecycle_horizon_floor
  category: business_temporal
  check: availability_through must be at or after the logical clock plus LIFECYCLE_GRACE_DAYS
  error_id: ERR_LIFECYCLE_HORIZON_TOO_SHORT
  http_status: 422
  applies_to: POST /lifecycle-commitments
- priority: 19
  name: subscription_covering_deployment
  category: business_referential
  check: A subscription may only be created against a deployment that exists and is still in activation_state IN {PENDING, ACTIVATED}; a subscription whose covering deployment is TERMINATED is refused
  error_id: ERR_NO_COVERING_SUBSCRIPTION
  http_status: 409
  applies_to: POST /subscriptions, POST /deployments/{deploymentId}/terminate
- priority: 20
  name: subscription_license_group_resolves
  category: business_referential
  check: Every stack_license_id in a subscription's licence group must resolve to a SoftwareStackLicense whose product_sku_id equals the covering deployment's product_sku_id
  error_id: ERR_LICENSE_GROUP_UNRESOLVED
  http_status: 422
  applies_to: POST /subscriptions, POST /deployments
- priority: 21
  name: entitlement_units_ceiling
  category: business_fiscal
  check: partner.entitlement_units_held plus the entitlement units the activation would add must not exceed ENTITLEMENT_CEILING_UNITS
  error_id: ERR_ENTITLEMENT_UNITS_EXCEEDED
  http_status: 409
  applies_to: POST /subscriptions/{subscriptionId}/activate
- priority: 22
  name: partner_committed_volume_ceiling
  category: business_fiscal
  check: For POST /allocation-holds, partner.committed_volume_units plus the requested quantity_units must not exceed partner.committed_volume_units + partner.entitlement_units_held + SUPPLY_CEILING_HEADROOM_UNITS; the comparison uses the strict form (a request that lands exactly on the ceiling is accepted)
  error_id: ERR_SUPPLY_CEILING_EXCEEDED
  http_status: 409
  applies_to: POST /allocation-holds, POST /demand-forecasts/{forecastId}/commit
- priority: 23
  name: evaluation_units_ring_fenced
  category: business_fiscal
  check: loan_units must not exceed product.reserved_evaluation_units
  error_id: ERR_RESERVED_FOR_EVALUATION
  http_status: 409
  applies_to: POST /evaluation-loans/{loanId}/approve
- priority: 24
  name: lifecycle_units_available
  category: business_fiscal
  check: covered_units must not exceed product.available_units
  error_id: ERR_LIFECYCLE_UNITS_UNCOMMITTED
  http_status: 409
  applies_to: POST /lifecycle-commitments/{commitmentId}/grant
- priority: 25
  name: allocation_candidate_exists
  category: business_fiscal
  check: An allocation request that must displace competitors requires a non-empty candidate set per calculation allocation_priority_ranking; an empty candidate set is reported before any capacity comparison
  error_id: ERR_NO_ALLOCATION_CANDIDATE
  http_status: 409
  applies_to: POST /allocation-holds, POST /license-hold-groups/{groupId}/preempt
- priority: 26
  name: allocated_units_unchanged
  category: business_constraint
  check: expected_allocated_units must equal the AcceleratorProduct.allocated_units the client observed; this guard is independent of the product's version
  error_id: ERR_ALLOCATED_UNITS_CHANGED
  http_status: 412
  applies_to: POST /allocation-holds, POST /license-hold-groups
- priority: 27
  name: partner_version_current
  category: business_constraint
  check: expected_partner_version must equal PartnerAccount.version at the instant the write is applied
  error_id: ERR_STALE_PARTNER_VERSION
  http_status: 412
  applies_to: POST /allocation-holds, POST /demand-forecasts
- priority: 28
  name: subscription_version_current
  category: business_constraint
  check: expected_subscription_version must equal EnterpriseSubscription.version at the instant the write is applied
  error_id: ERR_STALE_SUBSCRIPTION_VERSION
  http_status: 412
  applies_to: POST /subscriptions/{subscriptionId}/evaluate
- priority: 29
  name: request_shape_valid
  category: business_constraint
  check: Required fields present, enum members valid, integer fields non-negative, and quantity_units strictly positive
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all POST/PUT/PATCH endpoints
- priority: 30
  name: partner_qualified_for_program
  category: business_constraint
  check: A partner must be in qualification_status == QUALIFIED before it may hold allocations, subscriptions, developer memberships, evaluation loans or lifecycle commitments
  error_id: ERR_QUALIFICATION_NOT_MET
  http_status: 422
  applies_to: POST /allocation-holds, POST /subscriptions, POST /developer-memberships, POST /evaluation-loans, POST /lifecycle-commitments
- priority: 31
  name: blueprint_certified_for_evidence
  category: business_constraint
  check: ValidationEvidence may only be filed against a SolutionBlueprint in blueprint_status == CERTIFIED or DRAFT; a RETIRED blueprint refuses new evidence
  error_id: ERR_BLUEPRINT_NOT_CERTIFIED
  http_status: 409
  applies_to: POST /partners/{partnerId}/validations
- priority: 32
  name: evidence_minutes_sufficient
  category: business_constraint
  check: ValidationEvidence must record at least the blueprint's required_validation_minutes to be ACCEPTED when the partner is qualified at this pass
  error_id: ERR_EVIDENCE_INSUFFICIENT
  http_status: 422
  applies_to: POST /partners/{partnerId}/validations
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role missing, or the role is not one of the declared roles
- id: ERR_FORBIDDEN_FOR_ROLE
  http: 403
  condition: The caller's role is not in the endpoint's roles list
- id: ERR_PARTNER_NOT_FOUND
  http: 404
  condition: A /partners/{partnerId}/... path names a partner id that does not exist
- id: ERR_RESOURCE_NOT_FOUND
  http: 404
  condition: A path names any other collection member that does not exist
- id: ERR_BLUEPRINT_NOT_FOUND
  http: 404
  condition: A body-declared blueprint_id does not resolve to a SolutionBlueprint
- id: ERR_INVALID_STATE
  http: 409
  condition: The target resource's current state does not admit the requested trigger
- id: ERR_INVALID_REQUEST
  http: 400
  condition: A required field is absent, an enum member is unknown, a numeric field is negative, or quantity_units is not strictly positive
- id: ERR_QUALIFICATION_NOT_MET
  http: 422
  condition: The partner's qualification_status is not QUALIFIED for an operation that requires qualification
- id: ERR_EXPORT_CONTROL_RESTRICTED
  http: 403
  condition: The resolved export_control_classification is TIER_3_PROHIBITED
- id: ERR_EXPORT_LICENSE_REQUIRED
  http: 403
  condition: The resolved export_control_classification is TIER_2_LICENSE_REQUIRED and no ExportLicenseGrant with grant_status ACTIVE covers the request
- id: ERR_NDA_NOT_BOUND
  http: 403
  condition: A preview stack is being bound without a ConfidentialityAcknowledgement in ack_status BOUND for the acting partner
- id: ERR_HOLD_TIER_EXCEEDS_BAND
  http: 409
  condition: hold_friction_tier ranks above the target SupplyNode's temp_band_ceiling; a SCALDING pool accepts only COOL
- id: ERR_NODE_NOT_OPEN_FOR_ALLOCATION
  http: 409
  condition: The target SupplyNode is in stage DRAINING or BINDING
- id: ERR_NO_OPEN_EPOCH
  http: 409
  condition: No AllocationEpoch with epoch_status OPEN exists
- id: ERR_GROUP_NOT_SATISFIED
  http: 409
  condition: A deployment group with group_satisfied false is dispatched
- id: ERR_FORECAST_NOT_COMMITTED
  http: 409
  condition: An allocation names a forecast that is not ACTIVE or COMMITTED for the same partner and SKU
- id: ERR_FORECAST_DEADLINE_PASSED
  http: 409
  condition: A forecast commit arrives at or after the partner's eligibility_deadline_at
- id: ERR_CONTRACT_WINDOW_OVERLAP
  http: 409
  condition: A supply contract's half-open month window collides with an existing contract on the same SKU
- id: ERR_PREVIEW_GRANT_WINDOW_OVERLAP
  http: 409
  condition: A preview grant's closed day window intersects an existing grant for the same partner and SKU after the 30-day buffer is applied
- id: ERR_NDA_WINDOW_OVERLAP
  http: 409
  condition: A confidentiality acknowledgement's open month window collides with an existing acknowledgement on the same stack license
- id: ERR_LIFECYCLE_HORIZON_TOO_SHORT
  http: 422
  condition: availability_through is earlier than the logical clock plus LIFECYCLE_GRACE_DAYS
- id: ERR_LIFECYCLE_UNITS_UNCOMMITTED
  http: 409
  condition: A lifecycle commitment's covered_units exceed the product's available_units
- id: ERR_NO_COVERING_SUBSCRIPTION
  http: 409
  condition: A subscription is created against a TERMINATED deployment, or a deployment with no covering subscription is terminated
- id: ERR_LICENSE_GROUP_UNRESOLVED
  http: 422
  condition: A licence group names a stack license whose product SKU does not match the deployment's SKU
- id: ERR_ENTITLEMENT_UNITS_EXCEEDED
  http: 409
  condition: Activating a subscription would push partner.entitlement_units_held above ENTITLEMENT_CEILING_UNITS
- id: ERR_SUPPLY_CEILING_EXCEEDED
  http: 409
  condition: An allocation or commit would push the partner's committed volume above its ceiling headroom
- id: ERR_RESERVED_FOR_EVALUATION
  http: 409
  condition: loan_units exceed product.reserved_evaluation_units
- id: ERR_NO_ALLOCATION_CANDIDATE
  http: 409
  condition: A displacing allocation request finds an empty candidate set
- id: ERR_ALLOCATED_UNITS_CHANGED
  http: 412
  condition: expected_allocated_units does not equal the product's current allocated_units
- id: ERR_STALE_PARTNER_VERSION
  http: 412
  condition: expected_partner_version does not equal PartnerAccount.version
- id: ERR_STALE_SUBSCRIPTION_VERSION
  http: 412
  condition: expected_subscription_version does not equal EnterpriseSubscription.version
- id: ERR_SAME_ACTOR_DEPLOYMENT_CHAIN
  http: 409
  condition: The terminating X-User-ID matches the auditor recorded on the deployment's activation entry
- id: ERR_EPOCH_ALREADY_CLOSED
  http: 409
  condition: An advance is requested against an epoch that is already CLOSED
- id: ERR_LICENSE_GROUP_DUPLICATE_MEMBER
  http: 409
  condition: A licence group names the same stack license twice
- id: ERR_BLUEPRINT_NOT_CERTIFIED
  http: 409
  condition: ValidationEvidence is filed against a SolutionBlueprint whose blueprint_status is RETIRED
- id: ERR_EVIDENCE_INSUFFICIENT
  http: 422
  condition: ValidationEvidence records fewer minutes than the blueprint's required_validation_minutes at the point the pack is accepted
roles:
- name: PlatformAdmin
  description: Supplier-side superuser for catalog, epoch and account-standing operations. Never edits a partner's ledger directly.
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  - POST /_ops/advance_epoch
  - POST /allocations and POST /allocations/{allocationId}/advance_lifecycle
  - POST /allocations/{allocationId}/promote_evaluation_pool
  - POST /allocation-holds/{holdId}/reclaim and /expire
  - POST /partners/{partnerId}/terminate, /reinstate and /reapply
  - POST /subscriptions/{subscriptionId}/evaluate
  - POST /license-hold-groups/{groupId}/preempt
  - POST /epochs/{epochId}/close
  shared_operations: []
- name: SupplyPlanner
  description: Owns supplier pools, reference architectures and software stack licenses.
  identity: opaque
  exclusive_operations:
  - POST /supply-nodes and /supply-nodes/{nodeId}/drain, /bind, /rank
  - POST /blueprints, /blueprints/{blueprintId}/certify, /retire
  - POST /stack-licenses, /stack-licenses/{stackLicenseId}/release, /retire
  - GET /friction-penalties
  shared_operations: []
- name: PartnerProgramManager
  description: Owns partner qualification, evidence acceptance, developer program evaluation and evaluation loans.
  identity: opaque
  exclusive_operations:
  - POST /partners/{partnerId}/validations, /qualify, /reject, /suspend
  - POST /validations/{evidenceId}/accept and /reject
  - POST /developer-memberships/{membershipId}/evaluate, /renew, /lapse
  - POST /preview-grants
  - POST /demand-forecasts/{forecastId}/acknowledge
  - POST /evaluation-loans/{loanId}/approve, /start, /return, /reclaim, /milestones
  shared_operations: []
- name: PartnerOps
  description: Acts as a partner account. Entity-backed, so ownership checks compare X-User-ID against the partner's own id.
  identity: entity_backed:PartnerAccount
  exclusive_operations:
  - POST /allocation-holds, /commit, /cancel
  - POST /license-hold-groups
  - POST /demand-forecasts, /commit, /cancel, /revise
  - POST /developer-memberships
  - POST /evaluation-loans
  shared_operations:
  - GET /partners/{partnerId} and the partner's own child collections
  - GET /allocation-holds, /demand-forecasts, /evaluation-loans
- name: SupportAccountManager
  description: Owns hardware deployments, deployment groups, enterprise subscriptions and the entitlement-bearing activation path.
  identity: opaque
  exclusive_operations:
  - POST /subscriptions, /activate, /reinstate, /reclaim
  - POST /deployments, /activate, /terminate, /reinstate
  - POST /deployment-groups and /deployment-groups/{groupId}/dispatch
  shared_operations: []
- name: SupplyComplianceOfficer
  description: Owns export licence grants, confidentiality acknowledgements, membership revocation and the audit trail.
  identity: opaque
  exclusive_operations:
  - POST /export-licenses, /export-licenses/{grantId}/revoke
  - POST /confidentiality-acks
  - POST /preview-grants/{grantId}/revoke
  - POST /developer-memberships/{membershipId}/revoke
  - GET /audit-entries and GET /partners/{partnerId}/audit-entries
  shared_operations: []
- name: LifecycleProgramManager
  description: Owns long-term availability commitments and the supply-contract calendar.
  identity: opaque
  exclusive_operations:
  - POST /lifecycle-commitments, /grant, /decline
  - POST /supply-contracts
  shared_operations: []
endpoints:
- method: POST
  path: /accelerators/_clock/set_current_utc
  description: 'Advance or rewind the logical clock. The logical clock exists so that horizon bands, deadlines, grace windows and late fees are deterministic. SERVER STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time.'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - current_utc
  output: null
  side_effects: []
- method: POST
  path: /accelerators/_ops/advance_epoch
  description: 'Close the open AllocationEpoch and open its successor at the current logical clock. Runs the whole checkpoint pass: penalty decay, loan overdue sweep, milestone late sweep, forecast auto-commit and lifecycle re-derivation.'
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: AllocationEpoch
  side_effects:
  - the open epoch becomes CLOSED and increments its version; a successor epoch opens with epoch_index + 1
  - recomputes supply_hotness_tier and temp_band_ceiling for every SupplyNode; FRICTION_HOLD nodes with friction_penalty_score < 4.0 return to OPEN and BINDING nodes return to OPEN with the score reset to 0.0
  - applies FrictionPenalty half-life decay; penalties reaching score 0.0 become DECAYED
  - sweeps EvaluationLoan rows in ACTIVE whose required_return_at is past into OVERDUE and recomputes loan_late_fee
  - moves OPEN ProofOfConceptMilestone rows whose bound loan is OVERDUE into LATE and creates the LATE_CANCEL FrictionPenalty
  - auto-commits DemandForecast rows in ACTIVE whose partner eligibility_deadline_at has been reached
  - recomputes partner_priority_class for every qualified partner
- method: POST
  path: /accelerators/allocations
  description: Create an accelerator SKU in the allocation catalog. Initial lifecycle stage is PREVIEW; the reservation for evaluation hardware is created when the SKU promotes.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - sku_code
  - product_family
  - form_factor
  - hbm_capacity_gb
  - tdp_watts
  - supply_ceiling_units
  - long_term_availability_through
  output: AcceleratorProduct
  side_effects:
  - available_units is initialized to supply_ceiling_units
  - export_performance_density_band is set by the declared variant of export_density_band
- method: GET
  path: /accelerators/allocations
  description: List every accelerator SKU in the allocation catalog.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - limit?
  - offset?
  output: AcceleratorProduct[]
  side_effects: []
- method: GET
  path: /accelerators/allocations/{id}
  description: Read one accelerator SKU, including its derived free units and density fields.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: AcceleratorProduct
  side_effects: []
- method: PUT
  path: /accelerators/allocations/{id}
  description: Adjust the SKU's supply ceiling or promised availability horizon.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - supply_ceiling_units?
  - long_term_availability_through?
  output: AcceleratorProduct
  side_effects:
  - re-derives available_units without re-running any hold ranking
- method: POST
  path: /accelerators/allocations/{id}/advance_lifecycle
  description: 'Advance the SKU one lifecycle stage: PREVIEW to GENERAL_AVAILABILITY to MATURE to END_OF_LIFE. Promoting to GENERAL_AVAILABILITY creates the evaluation ring fence.'
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: AcceleratorProduct
  side_effects:
  - lifecycle_stage advances one step; the transition is refused from END_OF_LIFE with ERR_INVALID_STATE
  - on entering GENERAL_AVAILABILITY, reserved_evaluation_units is set by evaluation_ring_fence
  - re-runs export_density_band and lifecycle_commitment_floor for the SKU
- method: POST
  path: /accelerators/allocations/{id}/promote_evaluation_pool
  description: Set the reserved evaluation units for the SKU directly. This is the operator override used when a partner needs a larger evaluation pool than the ratio-derived floor.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - units
  output: AcceleratorProduct
  side_effects:
  - reserved_evaluation_units is set to the supplied value, re-deriving available_units
- method: POST
  path: /accelerators/allocation-holds
  description: 'Request accelerator units from a supply pool on behalf of a partner. Fields are read positionally: the positional key set is [product_sku_id, supply_node_id, quantity_units, hold_friction_tier, forecast_id, preempt_lower_tier, expected_partner_version, expected_allocated_units] and the payload is bound to that key order rather than to field names.'
  roles:
  - PartnerOps
  code: 201
  input:
  - product_sku_id
  - supply_node_id
  - quantity_units
  - hold_friction_tier?
  - forecast_id?
  - preempt_lower_tier?
  - expected_partner_version
  - expected_allocated_units
  output: AllocationHold
  side_effects:
  - creates the hold in state REQUESTED with committed_rate_v2 from committed_rate_v2 and economic_tag from the comparison of allocation_value_estimate against allocation_value_confirm
  - increments PartnerAccount.version by 1
  - when the pool lacks unheld capacity and preempt_lower_tier is true, runs preemption_displacement and marks the displaced prefix RECLAIMED
  - recomputes supply_hotness_tier, temp_band_ceiling and total_committed_rate on the node, and allocation_commitment_fee
  - when hold_friction_tier ranks above the node's temp_band_ceiling the hold still commits but a BAND_VIOLATION FrictionPenalty is created and the node enters FRICTION_HOLD
- method: GET
  path: /accelerators/allocation-holds
  description: List allocation holds, filtered by partner, state, SKU, pool or forecast.
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id?
  - state?
  - product_sku_id?
  - supply_node_id?
  - forecast_id?
  - limit?
  - offset?
  output: AllocationHold[]
  side_effects: []
- method: POST
  path: /accelerators/allocation-holds/{id}/commit
  description: Commit a requested hold, converting the reservation into held units on the pool.
  roles:
  - PartnerOps
  code: 200
  input:
  - consume_reservation?
  output: AllocationHold
  side_effects:
  - state moves REQUESTED to COMMITTED
  - partner.capacity_ledger_net += quantity_units; node.held_units += quantity_units
  - recomputes allocation_commitment_fee, supply_hotness_tier and temp_band_ceiling
- method: POST
  path: /accelerators/allocation-holds/{id}/cancel
  description: Cancel a hold. Before commit this is a free cancellation; after the confirming forecast's cancellation notice window the partner forfeits units at forfeit_rate.
  roles:
  - PartnerOps
  code: 200
  input:
  - as_user_id?
  output: AllocationHold
  side_effects:
  - state moves to CANCELLED; partner.capacity_ledger_net -= quantity_units and node.held_units -= quantity_units when the hold was COMMITTED
  - when the logical clock is strictly after the confirming forecast's acknowledged_at plus cancellation_notice_days, cancellation_forfeit_units is written from forfeit_rate
  - records an AuditTrailEntry with action_code = HOLD_CANCELLED and the acting X-User-ID
- method: POST
  path: /accelerators/allocation-holds/{id}/reclaim
  description: Operator reclaim of a committed hold, returning the units to the pool.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: AllocationHold
  side_effects:
  - state moves COMMITTED to RECLAIMED; partner.capacity_ledger_net -= quantity_units and node.held_units -= quantity_units
  - recomputes supply_hotness_tier and temp_band_ceiling
- method: POST
  path: /accelerators/allocation-holds/{id}/expire
  description: Expire a committed hold whose confirming forecast fell away. Unlike reclaim, expiry releases the pool units but leaves the partner's signed capacity ledger untouched.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: AllocationHold
  side_effects:
  - state moves COMMITTED to EXPIRED; node.held_units -= quantity_units
  - partner.capacity_ledger_net is deliberately NOT changed by this transition
- method: POST
  path: /accelerators/supply-nodes
  description: Create a supplier pool for one SKU. The pool opens with a client-declared requested_hotness_tier, which is the declared value the derived hotness tier will be compared against.
  roles:
  - SupplyPlanner
  code: 201
  input:
  - node_code
  - product_sku_id
  - node_region
  - capacity_units
  - requested_hotness_tier
  output: SupplyNode
  side_effects:
  - stage starts OPEN, held_units starts 0
  - the declared variant of supply_hotness_tier is applied from requested_hotness_tier so temp_band_ceiling is available before any hold exists
- method: GET
  path: /accelerators/supply-nodes
  description: List supplier pools, filtered by the SKU they serve.
  roles:
  - SupplyPlanner
  code: 200
  input:
  - product_sku_id?
  - limit?
  - offset?
  output: SupplyNode[]
  side_effects: []
- method: GET
  path: /accelerators/supply-nodes/{id}
  description: Read one supplier pool with its derived temperature.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SupplyNode
  side_effects: []
- method: POST
  path: /accelerators/supply-nodes/{id}/rank
  description: Rank the eligible holds competing for this pool. Returns the ordered candidate list so the ranking and its tie-breaks are directly observable.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: AllocationHold[]
  side_effects:
  - returns 200 with the ranking computed by allocation_priority_ranking; an empty candidate set returns an empty array, not an error
- method: POST
  path: /accelerators/supply-nodes/{id}/stage
  description: 'Advance a supplier pool''s stage: OPEN to DRAINING, DRAINING to BINDING, or BINDING back to OPEN.'
  roles:
  - SupplyPlanner
  code: 200
  input:
  - target_stage
  output: SupplyNode
  side_effects:
  - a pool in DRAINING or BINDING refuses further allocation
  - entering BINDING settles every ACTIVE FrictionPenalty on the node
  - returning to OPEN from BINDING resets friction_penalty_score to 0.0
- method: POST
  path: /accelerators/partners
  description: Register a partner account. It starts in qualification_status APPLIED with status ACTIVE and an unqualified priority class.
  roles:
  - PartnerOps
  code: 201
  input:
  - legal_name
  - partner_type
  - destination_country
  - export_restriction_tier
  - origin_epoch_index
  output: PartnerAccount
  side_effects:
  - qualification_status is APPLIED; allocation_priority_class is UNQUALIFIED
- method: GET
  path: /accelerators/partners/{id}
  description: Read one partner with its derived priority class, held entitlements and capacity ledger.
  roles:
  - PartnerOps
  code: 200
  input: []
  output: PartnerAccount
  side_effects: []
- method: GET
  path: /accelerators/partners/{id}/audit-entries
  description: List the tamper-evident audit entries filed under this partner.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  output: AuditTrailEntry[]
  side_effects: []
- method: POST
  path: /accelerators/partners/{id}/validations
  description: File a validation evidence pack against a reference architecture. The body reference to the blueprint resolves with priority 3 before the pack is accepted.
  roles:
  - PartnerProgramManager
  code: 201
  input:
  - validation_minutes
  - test_count
  - blueprint_id
  output: ValidationEvidence
  side_effects:
  - creates the evidence in evidence_pack_status SUBMITTED; the partner moves APPLIED to IN_VALIDATION
  - the pack is ACCEPTED only when validation_minutes reaches the blueprint's required_validation_minutes, otherwise ERR_EVIDENCE_INSUFFICIENT is returned
- method: POST
  path: /accelerators/partners/{id}/qualify
  description: Qualify the partner once an accepted evidence pack exists.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: PartnerAccount
  side_effects:
  - qualification_status moves IN_VALIDATION to QUALIFIED and PartnerAccount.version increments by 1
  - allocation_priority_class is re-derived at the next epoch advance
- method: POST
  path: /accelerators/partners/{id}/reject
  description: Reject the partner's current validation round and roll the account back to APPLIED.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: PartnerAccount
  side_effects:
  - qualification_status moves IN_VALIDATION to APPLIED and qualification_attempt_count += 1
  - 'depth-1: every SUBMITTED evidence for this partner becomes REJECTED'
  - 'depth-2: for each blueprint that lost its only ACCEPTED evidence, blueprint.era_index += 1'
- method: POST
  path: /accelerators/partners/{id}/suspend
  description: Suspend a qualified partner. The suspension cascades into subscriptions and deployments while leaving the entitlement ledger untouched.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: PartnerAccount
  side_effects:
  - qualification_status moves QUALIFIED to SUSPENDED and partner.status moves to SUSPENDED
  - 'depth-1: every ACTIVE subscription of this partner becomes SUSPENDED'
  - 'depth-2: each covered deployment has service_ready recomputed to false when nothing else covers it'
  - 'depth-3: a deployment whose service_ready flipped false while ACTIVATED moves to TERMINATED, triggering entitlement_pool_release'
  - partner.entitlement_units_held is unchanged by this transition
- method: POST
  path: /accelerators/blueprints
  description: Define a reference architecture. Blueprints are global definitions, not partner-owned resources.
  roles:
  - SupplyPlanner
  code: 201
  input:
  - blueprint_code
  - blueprint_type
  - target_tdp_watts
  - required_validation_minutes
  - evaluation_deadline_days
  output: SolutionBlueprint
  side_effects:
  - blueprint_status starts DRAFT with era_index 1
- method: GET
  path: /accelerators/blueprints/{id}
  description: Read one reference architecture.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SolutionBlueprint
  side_effects: []
- method: POST
  path: /accelerators/blueprints/{id}/certify
  description: Certify a reference architecture so partners may file evidence against it.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SolutionBlueprint
  side_effects:
  - blueprint_status moves DRAFT to CERTIFIED
- method: POST
  path: /accelerators/validations/{id}/accept
  description: Accept a submitted evidence pack.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: ValidationEvidence
  side_effects:
  - evidence_pack_status moves SUBMITTED to ACCEPTED
- method: POST
  path: /accelerators/validations/{id}/reject
  description: Reject a submitted evidence pack.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: ValidationEvidence
  side_effects:
  - evidence_pack_status moves SUBMITTED to REJECTED
- method: GET
  path: /accelerators/supply-nodes/{id}
  description: Read one supplier pool with its derived temperature, ceiling and friction score.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SupplyNode
  side_effects: []
- method: GET
  path: /accelerators/allocation-holds/{id}
  description: Read one allocation hold.
  roles:
  - PartnerOps
  code: 200
  input: []
  output: AllocationHold
  side_effects: []
- method: GET
  path: /accelerators/validations
  description: List validation evidence packs across partners.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - partner_id?
  - blueprint_id?
  - limit?
  - offset?
  output: ValidationEvidence[]
  side_effects: []
- method: GET
  path: /accelerators/validations/{id}
  description: Read one validation evidence pack.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: ValidationEvidence
  side_effects: []
- method: POST
  path: /accelerators/allocation-holds/bulk
  description: 'Reserve units for several SKUs in one request. Body references resolve left-to-right: partner_id before product_sku_id.'
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id
  - product_sku_id
  - supply_node_id
  - hold_friction_tier
  - members
  - expected_partner_version
  - expected_allocated_units
  output: AllocationHold[]
  side_effects:
  - creates one hold per member entry, all in state REQUESTED
  - increments PartnerAccount.version by 1
  - recomputes allocation_commitment_fee and supply_hotness_tier for the pool
- method: GET
  path: /accelerators/allocations
  description: List every accelerator SKU in the allocation catalog.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - limit?
  - offset?
  output: AcceleratorProduct[]
  side_effects: []
- method: POST
  path: /accelerators/partners/{id}/reinstate
  description: Lift a partner suspension. Subscriptions are not auto-reactivated.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: PartnerAccount
  side_effects:
  - qualification_status moves SUSPENDED to QUALIFIED and status moves to ACTIVE
  - suspended subscriptions stay SUSPENDED until each is reinstated individually
- method: POST
  path: /accelerators/subscriptions
  description: Create an enterprise support subscription against a hardware deployment. The licence group names the stack licenses the subscription will cover.
  roles:
  - SupportAccountManager
  code: 201
  input:
  - deployment_id
  - support_tier
  - seat_count
  - licence_group
  - trial_flag
  output: EnterpriseSubscription
  side_effects:
  - creates the subscription in DRAFT with annual_fee_cents provisioned by the forward-looking subscription_fee_provisional
  - EVERY member of the licence group is bound at creation, including preview stacks that carry preview_stack_flag true
- method: GET
  path: /accelerators/subscriptions
  description: List enterprise support subscriptions.
  roles:
  - SupportAccountManager
  code: 200
  input:
  - partner_id?
  - deployment_id?
  - status?
  - limit?
  - offset?
  - stack_license_id?
  output: EnterpriseSubscription[]
  side_effects: []
- method: GET
  path: /accelerators/deployments
  description: List hardware deployments, filtered by SKU or partner.
  roles:
  - SupportAccountManager
  code: 200
  input:
  - product_sku_id?
  - partner_id?
  - limit?
  - offset?
  output: HardwareDeployment[]
  side_effects: []
- method: GET
  path: /accelerators/memberships
  description: List every developer program membership together with the preview grants and acknowledgements hanging off it.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - partner_id?
  - limit?
  - offset?
  output: DeveloperProgramMembership[]
  side_effects: []
- method: GET
  path: /accelerators/preview-grants
  description: List preview software grants, filtered by membership, partner, stack license or the acknowledgement backing them.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - membership_id?
  - partner_id?
  - stack_license_id?
  - confidentiality_ack_id?
  - limit?
  - offset?
  output: PreviewSoftwareGrant[]
  side_effects: []
- method: GET
  path: /accelerators/confidentiality-acks
  description: List confidentiality acknowledgements, filtered by partner, membership or stack license.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input:
  - partner_id?
  - membership_id?
  - stack_license_id?
  - limit?
  - offset?
  output: ConfidentialityAcknowledgement[]
  side_effects: []
- method: GET
  path: /accelerators/demand-forecasts
  description: List demand forecasts, filtered by partner or SKU.
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id?
  - product_sku_id?
  - limit?
  - offset?
  output: DemandForecast[]
  side_effects: []
- method: GET
  path: /accelerators/evaluation-loans
  description: List evaluation loans, filtered by partner, SKU or blueprint.
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id?
  - product_sku_id?
  - blueprint_id?
  - limit?
  - offset?
  output: EvaluationLoan[]
  side_effects: []
- method: GET
  path: /accelerators/milestones
  description: List proof-of-concept milestones, filtered by the loan they belong to.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - loan_id?
  - limit?
  - offset?
  output: ProofOfConceptMilestone[]
  side_effects: []
- method: POST
  path: /accelerators/subscriptions/{id}/activate
  description: Activate a subscription. This is the point at which the entitlement ledger moves.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: EnterpriseSubscription
  side_effects:
  - status moves DRAFT to ACTIVE; annual_fee_cents, billed_fee_cents and support_credit_units are computed
  - partner.entitlement_units_held += the bound stack's entitlement_units, and PartnerAccount.version increments by 1
  - the covering deployment's service_ready is recomputed to true
  - records an AuditTrailEntry with action_code = SUBSCRIPTION_ACTIVATED
- method: POST
  path: /accelerators/subscriptions/{id}/reinstate
  description: Reinstate a suspended subscription once the partner is qualified again.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: EnterpriseSubscription
  side_effects:
  - status moves SUSPENDED to ACTIVE; partner.entitlement_units_held is untouched
  - the settlement anchor epoch index is restamped to the current epoch
- method: POST
  path: /accelerators/subscriptions/{id}/reclaim
  description: Reclaim a subscription. The entitlement ledger is deliberately left alone here.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: EnterpriseSubscription
  side_effects:
  - status moves ACTIVE or SUSPENDED to RECLAIMED; settled_fee_cents is finalised by subscription_fee_final
  - partner.entitlement_units_held is NOT changed by this transition
- method: POST
  path: /accelerators/subscriptions/{id}/evaluate
  description: Score the subscription against the account record. This endpoint is the OCC-guarded evaluation path.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - expected_subscription_version
  output: EnterpriseSubscription
  side_effects:
  - increments EnterpriseSubscription.version by 1 and re-derives support_credit_units
  - the evaluation is refused with 412 when expected_subscription_version is stale
- method: POST
  path: /accelerators/deployments
  description: Register a hardware deployment. The export classification is resolved here, before any activation.
  roles:
  - SupportAccountManager
  code: 201
  input:
  - product_sku_id
  - destination_country_code
  - stack_manifest
  output: HardwareDeployment
  side_effects:
  - activation_state starts PENDING
  - export_control_classification is resolved from the destination and the product's density band
  - every stack_manifest entry's licence group is resolved against the SKU at create time
- method: GET
  path: /accelerators/deployments/{id}
  description: Read one deployment with its classification, bound stacks and service readiness.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: HardwareDeployment
  side_effects: []
- method: POST
  path: /accelerators/deployments/{id}/activate
  description: Activate a deployment. The activation applies the qualification, allocation, export and NDA gates.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: HardwareDeployment
  side_effects:
  - activation_state moves PENDING to ACTIVATED
  - 'depth-1: OPEN preview grants for the bound stacks become FULFILLED'
  - 'depth-2: their confidentiality acknowledgements become FULFILLED'
  - 'depth-3: developer membership provisioning is recomputed by developer_tier_provision'
  - re-runs the final variant of export_density_band for the product
  - records an AuditTrailEntry with action_code = DEPLOYMENT_ACTIVATED carrying the acting X-User-ID
- method: POST
  path: /accelerators/deployments/{id}/terminate
  description: Terminate a deployment. This is the only path that releases entitlement units.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: HardwareDeployment
  side_effects:
  - activation_state moves ACTIVATED to TERMINATED
  - 'depth-1: every bound subscription in ACTIVE or SUSPENDED becomes RECLAIMED'
  - 'depth-2: partner.entitlement_units_held is reduced by evaluation of entitlement_pool_release'
  - 'depth-3: the parent product''s allocated_units is reduced by termination_effect_units and available_units is re-derived'
  - the acting X-User-ID is compared against the activation auditor; a match is refused with ERR_SAME_ACTOR_DEPLOYMENT_CHAIN
- method: POST
  path: /accelerators/deployments/{id}/reinstate
  description: Return a terminated deployment to the pending pool. The earlier allocation subtract is not reversed.
  roles:
  - SupportAccountManager
  code: 200
  input: []
  output: HardwareDeployment
  side_effects:
  - activation_state moves TERMINATED to PENDING; allocated_units stays where termination left it
- method: POST
  path: /accelerators/stack-licenses
  description: Define a software stack license targeting a SKU.
  roles:
  - SupplyPlanner
  code: 201
  input:
  - license_code
  - product_sku_id
  - stack_name
  - entitlement_units
  - min_package_version
  - preview_stack_flag
  output: SoftwareStackLicense
  side_effects:
  - license_state starts DRAFT; bound_deployment_count starts 0 and is re-derived from the deployment graph
- method: GET
  path: /accelerators/stack-licenses
  description: List software stack licenses, filtered by SKU.
  roles:
  - SupplyPlanner
  code: 200
  input:
  - product_sku_id?
  - limit?
  - offset?
  output: SoftwareStackLicense[]
  side_effects: []
- method: POST
  path: /accelerators/stack-licenses/{id}/release
  description: Release a stack license so deployments may bind it.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SoftwareStackLicense
  side_effects:
  - license_state moves DRAFT to RELEASED
- method: POST
  path: /accelerators/stack-licenses/{id}/retire
  description: Retire a stack license once nothing is bound to it.
  roles:
  - SupplyPlanner
  code: 200
  input: []
  output: SoftwareStackLicense
  side_effects:
  - license_state moves RELEASED to RETIRED when bound_deployment_count is 0
- method: POST
  path: /accelerators/export-licenses
  description: File an export licence grant for a destination. The grant drives the tier-two gate.
  roles:
  - SupplyComplianceOfficer
  code: 201
  input:
  - product_sku_id
  - destination_country_code
  - granted_units
  output: ExportLicenseGrant
  side_effects:
  - grant_status starts ACTIVE; the grant covers every deployment to that destination on the SKU
- method: GET
  path: /accelerators/export-licenses
  description: List export licence grants, optionally filtered by SKU.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input:
  - product_sku_id?
  - limit?
  - offset?
  output: ExportLicenseGrant[]
  side_effects: []
- method: POST
  path: /accelerators/export-licenses/{id}/revoke
  description: Revoke an export licence grant.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input: []
  output: ExportLicenseGrant
  side_effects:
  - grant_status moves ACTIVE to REVOKED
- method: POST
  path: /accelerators/developer-memberships
  description: Request a developer program membership at a target tier. The stored tier always starts at the floor.
  roles:
  - PartnerOps
  code: 201
  input:
  - requested_tier
  output: DeveloperProgramMembership
  side_effects:
  - status starts REQUESTED; stored_tier starts COMMUNITY regardless of requested_tier
- method: GET
  path: /accelerators/developer-memberships
  description: List developer program memberships.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - partner_id?
  - limit?
  - offset?
  output: DeveloperProgramMembership[]
  side_effects: []
- method: POST
  path: /accelerators/developer-memberships/{id}/evaluate
  description: Open the evaluation window for a membership request.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: DeveloperProgramMembership
  side_effects:
  - status moves REQUESTED to UNDER_EVALUATION
  - evaluation_deadline_at = logical clock + MEMBERSHIP_GRACE_DAYS
  - preview_kit_units and support_incidents_included are provisioned against stored_tier
- method: POST
  path: /accelerators/developer-memberships/{id}/renew
  description: Lift the stored tier one step toward the requested tier once the evaluation window has elapsed.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: DeveloperProgramMembership
  side_effects:
  - stored_tier advances by exactly one tier toward requested_tier, then provisioning is recomputed
  - a renewal attempted before evaluation_deadline_at is refused with ERR_INVALID_STATE
- method: POST
  path: /accelerators/developer-memberships/{id}/lapse
  description: Lapse an active membership, revoking its open preview grants.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: DeveloperProgramMembership
  side_effects:
  - status moves ACTIVE to LAPSED
  - 'depth-1: every OPEN preview grant under this membership becomes REVOKED'
- method: POST
  path: /accelerators/developer-memberships/{id}/revoke
  description: Revoke a membership outright.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input: []
  output: DeveloperProgramMembership
  side_effects:
  - status moves to REVOKED and preview_kit_units is set to 0
- method: POST
  path: /accelerators/preview-grants
  description: Open a preview software grant against an evaluation device. Requires a bound confidentiality acknowledgement for the preview stack.
  roles:
  - PartnerProgramManager
  code: 201
  input:
  - stack_license_id
  - device_serial
  - commitment_boundary_at
  - commitment_expires_at
  - confidentiality_ack_id
  output: PreviewSoftwareGrant
  side_effects:
  - grant_status starts OPEN
  - is refused with ERR_NDA_NOT_BOUND when the referenced acknowledgement is absent or not BOUND
  - is refused with ERR_PREVIEW_GRANT_WINDOW_OVERLAP when the closed window collides across the 30-day buffer
- method: GET
  path: /accelerators/preview-grants
  description: List preview software grants, optionally filtered by membership or partner.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - membership_id?
  - partner_id?
  - limit?
  - offset?
  output: PreviewSoftwareGrant[]
  side_effects: []
- method: POST
  path: /accelerators/preview-grants/{id}/revoke
  description: Revoke a preview grant, for example after a confidentiality breach.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input: []
  output: PreviewSoftwareGrant
  side_effects:
  - grant_status moves OPEN to REVOKED
  - 'depth-1: the parent membership becomes REVOKED'
- method: POST
  path: /accelerators/confidentiality-acks
  description: Bind a confidentiality acknowledgement to a membership. The window arithmetic allows a single month of adjacency.
  roles:
  - SupplyComplianceOfficer
  code: 201
  input:
  - membership_id
  - stack_license_id
  - acknowledged_at
  output: ConfidentialityAcknowledgement
  side_effects:
  - ack_status starts BOUND
  - is refused with ERR_NDA_WINDOW_OVERLAP when the open month window collides on the same stack license
- method: GET
  path: /accelerators/confidentiality-acks
  description: List confidentiality acknowledgements.
  roles:
  - SupplyComplianceOfficer
  code: 200
  input:
  - partner_id?
  - limit?
  - offset?
  output: ConfidentialityAcknowledgement[]
  side_effects: []
- method: POST
  path: /accelerators/demand-forecasts
  description: Create a demand forecast against a SKU. The partner's version is checked before the ceiling is evaluated.
  roles:
  - PartnerOps
  code: 201
  input:
  - product_sku_id
  - requested_quantity_units
  - expected_partner_version
  output: DemandForecast
  side_effects:
  - tracking_status starts DRAFT; horizon_band and the partner's eligibility deadline are not set until acknowledgement
  - is refused with 412 when expected_partner_version is stale
  - increments PartnerAccount.version by 1, because the forecast ceiling is evaluated against the partner's committed volume
- method: GET
  path: /accelerators/demand-forecasts
  description: List demand forecasts, optionally filtered by partner.
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id?
  - limit?
  - offset?
  output: DemandForecast[]
  side_effects: []
- method: POST
  path: /accelerators/demand-forecasts/{id}/acknowledge
  description: Acknowledge a forecast, which stamps the horizon band from the third-Saturday rule.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: DemandForecast
  side_effects:
  - tracking_status moves DRAFT to FORECAST_SUBMITTED; acknowledged_at is stamped with the logical clock
  - horizon_band, cancellation_notice_days and the partner's eligibility_deadline_at are derived by forecast_commitment_deadline
- method: POST
  path: /accelerators/demand-forecasts/{id}/commit
  description: Commit quantity against an acknowledged forecast, before the eligibility deadline.
  roles:
  - PartnerOps
  code: 200
  input:
  - committed_quantity_units
  output: DemandForecast
  side_effects:
  - tracking_status moves FORECAST_SUBMITTED to ACTIVE
  - forfeit_rate is set by forecast_forfeit_rate and partner.committed_volume_units is increased
  - is refused with ERR_FORECAST_DEADLINE_PASSED at or after the deadline instant
- method: POST
  path: /accelerators/demand-forecasts/{id}/cancel
  description: Cancel an active forecast once every hold referencing it has terminated.
  roles:
  - PartnerOps
  code: 200
  input:
  - as_user_id?
  output: DemandForecast
  side_effects:
  - tracking_status moves ACTIVE to CANCELLED and partner.committed_volume_units is reduced
  - records an AuditTrailEntry with action_code = FORECAST_CANCELLED and the acting X-User-ID
- method: POST
  path: /accelerators/demand-forecasts/{id}/revise
  description: Return a cancelled forecast to the submitted pool, re-stamping its acknowledgement clock.
  roles:
  - PartnerOps
  code: 200
  input: []
  output: DemandForecast
  side_effects:
  - tracking_status moves CANCELLED to FORECAST_SUBMITTED and acknowledged_at is re-stamped from the logical clock
- method: POST
  path: /accelerators/evaluation-loans
  description: Request an evaluation hardware loan for a proof-of-concept.
  roles:
  - PartnerOps
  code: 201
  input:
  - product_sku_id
  - blueprint_id
  - loan_units
  output: EvaluationLoan
  side_effects:
  - loan_state starts REQUESTED
- method: GET
  path: /accelerators/evaluation-loans
  description: List evaluation loans, optionally filtered by partner.
  roles:
  - PartnerOps
  code: 200
  input:
  - partner_id?
  - limit?
  - offset?
  - product_sku_id?
  output: EvaluationLoan[]
  side_effects: []
- method: POST
  path: /accelerators/evaluation-loans/{id}/approve
  description: Approve a loan, ring-fencing its units from the SKU's evaluation pool.
  roles:
  - PartnerProgramManager
  code: 200
  input:
  - expected_product_version
  output: EvaluationLoan
  side_effects:
  - loan_state moves REQUESTED to APPROVED
  - product.reserved_evaluation_units += loan_units and required_return_at is set from the blueprint's deadline
  - increments AcceleratorProduct.version by 1
- method: POST
  path: /accelerators/evaluation-loans/{id}/start
  description: Start an approved loan, which opens the kickoff milestone.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: EvaluationLoan
  side_effects:
  - loan_state moves APPROVED to ACTIVE and an OPEN KICKOFF milestone is created
- method: POST
  path: /accelerators/evaluation-loans/{id}/return
  description: Return a loan's hardware, releasing the ring fence.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: EvaluationLoan
  side_effects:
  - loan_state moves ACTIVE or OVERDUE to RETURNED and product.reserved_evaluation_units -= loan_units
- method: POST
  path: /accelerators/evaluation-loans/{id}/reclaim
  description: Reclaim a loan's hardware.
  roles:
  - PartnerProgramManager
  code: 200
  input: []
  output: EvaluationLoan
  side_effects:
  - loan_state moves REQUESTED, APPROVED or OVERDUE to RECLAIMED and the ring fence is released for every non-requested state
- method: POST
  path: /accelerators/evaluation-loans/{id}/milestones
  description: Record a proof-of-concept milestone. A passing result is what advances a bound loan.
  roles:
  - PartnerProgramManager
  code: 201
  input:
  - milestone_type
  - milestone_result
  output: ProofOfConceptMilestone
  side_effects:
  - creates the milestone in milestone_state RECORDED with recorded_at stamped from the logical clock
  - when milestone_result is PASSED and the bound loan is ACTIVE the loan moves to RETURNED and milestone_triggered_at is stamped
- method: POST
  path: /accelerators/lifecycle-commitments
