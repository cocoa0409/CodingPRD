scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: auth_risk_score_provisional_vs_final
        grounds:
          - calculations.authentication_risk_score
          - calculations.authentication_risk_score.variants[provisional]
          - calculations.authentication_risk_score.variants[final]
          - entities.Recipient.fields.auth_risk_score
          - entities.Recipient.fields.auth_risk_score_final
          - state_machines.Recipient.SIGNING_to_SIGNED
        distinguishing_aspect: |
          Two valid readings of the same recipient authentication record produce different integers:
          the provisional variant clamps into [0,100] and excludes any peer term while the final
          variant clamps only at the ceiling and adds 10 per authenticated ACCESS_CODE-or-stronger
          peer, so for the EMAIL_ACCESS signer against one authenticated ACCESS_CODE peer the
          provisional reads 10 and the final reads 20.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one GLOBAL retention policy with retention_years 3"
            - "one PARALLEL envelope with two SIGNER recipients at routing_order 1: peer uses ACCESS_CODE, target uses EMAIL_ACCESS"
            - "both recipients carry a SIGNATURE field with a value so the target may sign"
            - "the envelope has been sent so both recipients are SENT with auth_status PENDING"
            - "peer has authenticated by ACCESS_CODE; the target has an OPEN signing session with consent recorded"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Risk scoring envelope", routing_mode: "PARALLEL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "MSA.pdf", page_count: 10 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "peer@example.com", routing_order: 1, auth_level: "ACCESS_CODE", access_code: "P-7781", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { peer_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "target@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${peer_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Peer Name" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "Target Name" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v: $.data.version }
            - call: "POST /esign/recipients/${peer_id}/authenticate"
              payload: { method: "ACCESS_CODE", access_code: "P-7781" }
              as: Recipient
              as_user_id: "${peer_id}"
            - call: "POST /esign/recipients/${rec_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { sess_id: $.data.id }
            - call: "GET /esign/recipients/${rec_id}"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { pre_score: $.data.auth_risk_score }
            - call: "GET /esign/recipients/${peer_id}"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { peer_score: $.data.auth_risk_score }
          trigger:
            - call: "POST /esign/recipients/${rec_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${rec_id}"
          assert:
            - "Recipient.${rec_id}.auth_risk_score == 10  (provisional: BASE 10 for EMAIL_ACCESS, no failures, no identity verification, peer term excluded)"
            - "Recipient.${rec_id}.auth_risk_score_final == 20  (final: 10 + 10 for the one authenticated ACCESS_CODE peer)"
            - "Recipient.${rec_id}.auth_risk_score_final != Recipient.${rec_id}.auth_risk_score"
            - "Recipient.${peer_id}.auth_risk_score == 30  (provisional for ACCESS_CODE base 30)"
            - "Recipient.${peer_id}.auth_risk_score_final == 0  (never signed, final never computed)"
            - "Recipient.${rec_id}.status == \"SIGNED\""
      - name: envelope_expiry_calendar_vs_business_days
        grounds:
          - entities.Envelope.fields.expires_at
          - entities.Envelope.fields.sender_visible_expires_at
          - entities.Envelope.fields.expires_after_days
          - entities.Envelope.fields.sender_visible_window_days
          - state_machines.Envelope.CREATED_to_SENT
        distinguishing_aspect: |
          Two valid readings of one send instant produce two different deadlines on the same
          envelope: the sealed expires_at advances expires_after_days calendar days while the
          sender-visible sender_visible_expires_at advances the same count of business days
          skipping Saturday and Sunday, so from a Tuesday 2026-09-01 send with both counts at 30
          the two deadlines are twelve days apart.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one GLOBAL retention policy with retention_years 3"
            - "logical clock pinned to 2026-09-01T00:00:00Z (a Tuesday)"
            - "one CREATED SEQUENTIAL envelope with expires_after_days 30 and sender_visible_window_days 30, one document, one SIGNER recipient at routing_order 1, and one SIGNATURE field holding a value"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Expiry window envelope", routing_mode: "SEQUENTIAL", expires_after_days: 30, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Lease.pdf", page_count: 12 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "expiry.signer@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Alex Signer" }
              as: Account
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v: $.data.version }
          assert:
            - "Envelope.${env_id}.status == \"SENT\""
            - "Envelope.${env_id}.sent_at == \"2026-09-01T00:00:00Z\""
            - "Envelope.${env_id}.expires_at == \"2026-10-01T23:59:59Z\"  (30 calendar days from Tuesday 2026-09-01)"
            - "Envelope.${env_id}.sender_visible_expires_at == \"2026-10-13T23:59:59Z\"  (30 business days from Tuesday 2026-09-01, skipping 12 weekend days)"
            - "Envelope.${env_id}.expires_at != Envelope.${env_id}.sender_visible_expires_at"
  - rule_id: combinatorial_formula
    instances:
      - name: credit_spend_consumption_tiered_and_status_conditional
        grounds:
          - calculations.credit_spend_consumption
          - calculations.credit_spend_consumption.variants[sender_visible_estimate]
          - entities.Account.fields.credit_balance
          - entities.Account.fields.tier
          - state_machines.Envelope.CREATED_to_SENT
        distinguishing_aspect: |
          The debit is a four-input non-linear formula (total pages, signer count, tier multiplier
          by lookup, and a conditional doubling when the account is SUSPENDED) whose result crosses
          two ceilings and a maximum, so no additive decomposition reproduces it: 210 pages with 7
          signers on a STANDARD account yields 22 units while the same envelope on an ENTERPRISE
          account yields 2.
        test_recipe:
          setup:
            - "one STANDARD account with page_allowance 25 seeded to credit_balance 11000"
            - "logical clock pinned to 2026-09-01T00:00:00Z"
            - "one CREATED SEQUENTIAL envelope holding three 70-page documents (210 pages total) and 7 recipients whose roles are SIGNER or APPROVER"
            - "every recipient carries a SIGNATURE field with a value"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Std Co", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_std_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_std_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_std_id}", subject: "Tier debit envelope", routing_mode: "PARALLEL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D1.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D2.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D3.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "s1@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "s2@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "s3@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "s4@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "s5@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "APPROVER", email: "a1@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "APPROVER", email: "a2@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${d1_id}", recipient_id: "${r1_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "S1" }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${d1_id}", recipient_id: "${r2_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "S2" }
              as: Account
              as_user_id: "${acct_std_id}"
            - call: "GET /esign/accounts/${acct_std_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_before: $.data.credit_balance }
          trigger:
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { env_v: $.data.version }
          assert:
            - "Account.${acct_std_id}.credit_balance == 10978  (11000 - 22)"
            - "computed credit units == 22  (page_overage = ceil(max(0, 210 - 25) / 10) = 19; recipient_overage = max(0, 7 - 5) = 2; base = 1 + 19 + 2 = 22; STANDARD multiplier 1.0; ACTIVE so no doubling)"
            - "Envelope.${env_id}.status == \"SENT\""
            - "the same envelope on an ENTERPRISE account would debit 2 units, proving the tier multiplier is non-additive"
      - name: envelope_page_fee_per_document_rounding_order
        grounds:
          - calculations.envelope_page_fee
          - calculations.envelope_page_fee.variants[sum_then_round]
          - calculations.envelope_fee_quote
          - entities.EnvelopeDocument.fields.page_count
          - entities.Account.fields.page_allowance
        distinguishing_aspect: |
          The page fee is a nested-rounding formula whose evaluation order is pinned: each
          document's chargeable blocks are rounded to cents before summing, so three 70-page
          documents at a 25-page allowance yield 185.04 while rounding the aggregate once yields
          185.03 — a one-cent divergence that only the pinned order reproduces.
        test_recipe:
          setup:
            - "one STANDARD account with page_allowance 25"
            - "one CREATED envelope holding three 70-page documents named D1.pdf, D2.pdf, D3.pdf"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Std Co", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_std_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_std_id}", subject: "Fee envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D1.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D2.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D3.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { d3_id: $.data.id }
          trigger:
            - call: "GET /esign/envelopes/${env_id}/fee-breakdown"
              payload: {}
              as: Account
              as_user_id: "${acct_std_id}"
              captures: { per_doc_fee: $.data.per_document_fee, total_fee: $.data.total_page_fee }
          assert:
            - "Envelope.${env_id} fee-breakdown.per_document_fee == 61.68  (each 70-page document has ceil(70/10)=7 blocks; the 25-page allowance gives floor(25/10)=2 free blocks; 5 chargeable blocks x 12.335 = 61.675 rounds half-up to 61.68)"
            - "Envelope.${env_id} fee-breakdown.total_page_fee == 185.04  (61.68 x 3 documents, the pinned per-document rounding order)"
            - "185.04 != 185.03  (the sum-then-round variant would round 15 chargeable blocks x 12.335 = 185.025 once to 185.03, so the pinned order is observable)"
  - rule_id: non_linear_state_machine
    instances:
      - name: envelope_fork_join_terminal_convergence
        grounds:
          - state_machines.Envelope
          - state_machines.Envelope.DELIVERED_to_COMPLETED
          - state_machines.Envelope.DELIVERED_to_DECLINED
          - state_machines.Envelope.DELIVERED_to_VOIDED
          - state_machines.Envelope.DELIVERED_to_EXPIRED
        distinguishing_aspect: |
          The Envelope machine is a genuine fork-join: from DELIVERED it branches to four
          distinct terminals and the join into COMPLETED additionally requires every signer and
          approver recipient to be terminal, so the reachable terminal set depends on which
          branch the divergent side-effect set of each path produces.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one GLOBAL retention policy with retention_years 3"
            - "logical clock pinned to 2026-09-01T00:00:00Z"
            - "one SEQUENTIAL envelope with one SIGNER at routing_order 1 holding a filled SIGNATURE field, already sent"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Fork join envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "MSA.pdf", page_count: 10 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "fork.signer@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Fork Signer" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/feed"
              payload: { feed_event: "DELIVERED" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_delivered: $.data.version }
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /esign/envelopes/${env_id}/expire"
              payload: { expected_envelope_version: "${env_v_delivered}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_expired: $.data.version }
          assert:
            - "Envelope.${env_id}.status == \"EXPIRED\"  (branch DELIVERED -> EXPIRED taken)"
            - "Recipient.${rec_id}.status == \"EXPIRED\"  (divergent side-effect set of the expire branch)"
            - "Envelope.${env_id}.status != \"COMPLETED\""
            - "Envelope.${env_id}.is_sealed == false"
            - "Envelope.${env_id}.version == ${env_v_delivered} + 1"
      - name: recipient_parallel_status_and_auth_dimensions
        grounds:
          - state_machines.Recipient
          - entities.Recipient.fields.status
          - entities.Recipient.fields.auth_status
          - state_machines.Recipient.SIGNING_to_SIGNED
          - entities.Recipient.fields.auth_level
        distinguishing_aspect: |
          Recipient carries two independent state dimensions on one row: status moves
          WAITING -> SIGNING -> SIGNED while auth_status moves PENDING -> AUTHENTICATED
          separately, so after a sign the row at once holds a terminal status value and a
          non-terminal auth_status value, which no single-linear-pipeline encoding can express.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one SEQUENTIAL envelope with one SIGNER at routing_order 1 whose auth_level is KBA"
