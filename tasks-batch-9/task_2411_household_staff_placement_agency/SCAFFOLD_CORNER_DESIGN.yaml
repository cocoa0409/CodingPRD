  - name: the_ledger_fold_stamps_a_running_balance_on_every_row
    claim_type: correct_result
    grounds: calculations.client_receivable_balance (running fold in sequence_no order, balance may be
      negative)
    distinguishing_aspect: Three adjustments of mixed sign are folded in sequence order, so each row carries
      the balance as at that row rather than the final total, and the household figure equals the last
      row.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: 500000
          memo: Retainer received.
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: -200000
          memo: Partial credit applied.
      trigger:
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: 100000
          memo: Late-cancellation charge.
      asserts:
      - the trigger returns 201 with sequence_no == 3 and balance_after_cents == 400000
      - GET /clients/${client_id}/ledger-entries as BillingAdministrator returns three rows in sequence_no
        order with balance_after_cents 500000, 300000 and 400000
      - GET /clients/${client_id} as BillingAdministrator shows outstanding_balance_cents == 400000, equal
        to the last row
  - name: an_invoice_and_its_reversal_return_the_running_total_to_its_prior_value
    claim_type: correct_result
    grounds: calculations.client_receivable_balance invariant (FEE_INVOICED and FEE_REVERSAL sum to zero)
    excluded_because:
      difficulty_instance: invoice_then_reverse_restores_the_client_balance_exactly
      rationale: Queue A already drives the invoice-then-reverse pair and asserts both the compensating
        ledger row and the exactly restored balance; a breadth instance would repeat those two calls.
- section: validations
  instances:
  - name: missing_auth_headers_on_an_unknown_id_returns_unauthenticated
    claim_type: priority_ordering
    grounds: validations.auth_headers_present (priority 10, before path-parameter parsing); validations.path_entity_exists
      (priority 30); errors[ERR_MISSING_AUTH_HEADER]
    distinguishing_aspect: The path id does not exist either, so the two candidate answers are 401 and
      404; the auth rule runs before path parsing, which pins the answer at 401.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: GET /clients/00000000-0000-0000-0000-000000000000
      asserts:
      - the trigger, sent with neither X-User-ID nor X-User-Role, returns 401 with error_id == ERR_MISSING_AUTH_HEADER
      - message == "X-User-ID and X-User-Role headers are required."
      - the answer is not ERR_CLIENT_NOT_FOUND, even though the id resolves to nothing
  - name: an_unrecognised_role_header_is_invalid_role
    claim_type: violation_to_error
    grounds: validations.role_recognised (priority 11); errors[ERR_INVALID_ROLE]
    distinguishing_aspect: The headers are present, so rule 10 is satisfied; the role string is simply
      not one of the seven, which is a 401 ERR_INVALID_ROLE rather than the 403 given to a real-but-forbidden
      role.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      trigger:
      - call: GET /clients/${client_id}
        as: HouseManager
      asserts:
      - the trigger returns 401 with error_id == ERR_INVALID_ROLE
      - message == "X-User-Role is not a recognised role."
      - the answer is neither ERR_MISSING_AUTH_HEADER nor ERR_UNAUTHORIZED
  - name: a_forbidden_role_sending_a_malformed_body_returns_forbidden
    claim_type: priority_ordering
    grounds: validations.role_permitted_for_operation (priority 12, precedes request-shape); validations.required_fields_present
      (priority 20); endpoints.POST /fee-schedules roles [AgencyPrincipal]
    distinguishing_aspect: The body is also missing a required field, so 403 and 400 are both defensible;
      the RBAC check at 12 runs first, so the caller learns nothing about the shape of a body it is not
      allowed to send.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /fee-schedules
        as: VettingSpecialist
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      asserts:
      - the trigger returns 403 with error_id == ERR_UNAUTHORIZED
      - message == "Your role is not permitted to perform this operation."
      - the answer is not ERR_INVALID_REQUEST, even though fee_percent_bps is absent
      - GET /fee-schedules as AgencyPrincipal returns total_count == 0
  - name: a_fee_band_missing_required_fee_percent_bps_is_rejected
    claim_type: violation_to_error
    grounds: validations.required_fields_present (priority 20); endpoints.POST /fee-schedules input; errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'The caller is permitted and every other required field is present, so the
      only defect is the absent rate: 400 ERR_INVALID_REQUEST and no stored band.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      asserts:
      - the trigger returns 400 with error_id == ERR_INVALID_REQUEST
      - message == "A required field is missing or null."
      - GET /fee-schedules as AgencyPrincipal returns total_count == 0
  - name: an_unrecognised_role_type_enum_on_a_fee_band_is_rejected
    claim_type: violation_to_error
    grounds: validations.enum_values_recognised (priority 21); entities.FeeSchedule.role_type enum {ESTATE_MANAGER,
      HOUSEKEEPER, CHEF, CHAUFFEUR}; errors[ERR_INVALID_ENUM]
    distinguishing_aspect: 'Every required field is present and in range, so the refusal isolates the
      enum check: BUTLER is not one of the four staff role types.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: BUTLER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      asserts:
      - the trigger returns 400 with error_id == ERR_INVALID_ENUM
      - the answer is not ERR_INVALID_REQUEST, because nothing is missing
  - name: a_fee_percent_of_zero_basis_points_is_rejected
    claim_type: violation_to_error
    grounds: validations.numeric_ranges_respected (priority 22, fee_percent_bps outside 1..10000); errors[ERR_INVALID_RANGE]
    distinguishing_aspect: Zero is one below the inclusive floor of the permitted rate range, so it is
      a range violation rather than a missing field; 1 basis point is accepted.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 0
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      asserts:
      - the trigger returns 400 with error_id == ERR_INVALID_RANGE
      - the same payload with fee_percent_bps 1 returns 201 with fee_percent_bps == 1
  - name: a_non_iso_effective_from_date_is_rejected
    claim_type: violation_to_error
    grounds: validations.temporal_formats_valid (priority 23); errors[ERR_INVALID_DATE_FORMAT]
    distinguishing_aspect: The value is a real date in the wrong notation, so the failure is format-specific
      rather than a range or enum problem.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
