            - *k_mp_cc_submit
            - *k_mp_cc_approve
            - *k_get_alpha_v
            - *k_mp_cc_complete
            - *k_filing
            - call: "POST /plan-filings/${filing_id}/submit"
              payload: {}
              as: GridPlanner
          assert:
            - "every call returns its declared success code — 201 for the six creates, 200 for the four actions"
            - "MitigationProject.${mp_cc_id}.status == COMPLETED with completed_miles 4.0"
            - "WildfirePlanFiling.${filing_id}.status == SUBMITTED with qualifying_project_count 1"
            - "FirePotentialIndex.${fpi_fc_id}.fpi_score == 85.93 with fpi_tier R5"
