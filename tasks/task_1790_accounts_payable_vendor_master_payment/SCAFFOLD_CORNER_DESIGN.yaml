        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_VENDOR_BLOCKED]"]
        distinguishing_aspect: "A vendor BLOCKED via an exact BLOCK watchlist hit at approve time cannot take new invoices — the blocked guard is checked before constraint-level vendor-active logic."
        test_recipe:
          setup: ["Watchlist BLOCK 'Vortex Trading'; vendor 'Vortex Trading' submitted and approve attempted -> BLOCKED"]
          setup_api_calls:
            - { call: "POST /watchlist-entries", payload: { name_pattern: "Vortex Trading", severity: "BLOCK", list_source: "OFAC_SDN" }, as: ComplianceOfficer, as_user_id: "u-co-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Vortex Trading", tax_id: "20-0000052", remit_email: "ap@vt2.com", phone: "+1-555-2057", address_line1: "83 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
          trigger:
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9005", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { err: $.data.error_id }
          assert:
            - "Vendor is BLOCKED after approve; invoice create error_id == ERR_VENDOR_BLOCKED (409)"

      - name: callback_confirm_after_expiry_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CALLBACK_EXPIRED]"]
        distinguishing_aspect: "Confirming with the CORRECT code after the verification expired fails ERR_CALLBACK_EXPIRED — expiry is terminal, not retryable."
        test_recipe:
          setup: ["Vendor DRAFT; account created 2026-08-01T00:00:00Z (expires 2026-08-03T00:00:00Z); sweep at 2026-08-04 flipped it EXPIRED and the account REJECTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Expired Echo", tax_id: "20-0000053", remit_email: "ap@ee4.com", phone: "+1-555-2058", address_line1: "84 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - { call: "POST /vendors/${v_id}/bank-accounts", payload: { account_number: "000888111777", routing_number: "021000021", account_holder_name: "Expired Echo", is_primary: true, expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-01", captures: { ba_id: $.data.id } }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /vendor-sweeps/run", payload: {}, as: SystemAdmin, as_user_id: "u-sys-01" }
          trigger:
            - call: "POST /bank-accounts/${ba_id}/confirm-verification"
              payload: { verification_code: "${cb_code}" }
              as: VendorManager
              as_user_id: "u-vm-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CALLBACK_EXPIRED (409); verification stays EXPIRED, account stays REJECTED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: apclerk_cannot_create_vendor_forbidden
        claim_type: role_denial
        grounds: ["roles[APClerk]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "APClerk is not on POST /vendors: 403 ERR_FORBIDDEN_FOR_ROLE at p2, before any business logic."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Clerk Made", tax_id: "20-0000054", remit_email: "ap@cm2.com", phone: "+1-555-2059", address_line1: "85 Fir St", city: "Springfield", country: "US" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); no vendor persisted"

      - name: treasury_analyst_cannot_approve_run_forbidden
        claim_type: role_denial
        grounds: ["roles[TreasuryAnalyst]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Run approve is TreasuryManager-exclusive: TreasuryAnalyst (who compiled it) is refused at the role gate even though the run state is irrelevant."
        test_recipe:
          setup: ["Empty DRAFT run exists"]
          setup_api_calls:
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-05", payment_method: "CHECK" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
          trigger:
            - call: "POST /payment-runs/${run_id}/approve"
              payload: {}
              as: TreasuryAnalyst
              as_user_id: "u-ta-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403) — role gate p2 precedes the state check p6 (run is merely DRAFT)"

      - name: auditor_read_only_with_audit_access
        claim_type: role_allowance
        grounds: ["roles[Auditor]", "endpoints.\"GET /audit-events\""]
        distinguishing_aspect: "Auditor can query audit events and read vendors, but POST /vendors is 403 — read-only segregation holds."
