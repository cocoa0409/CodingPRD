              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest Again" }
              as: ClientOwner
              as_user_id: "${v1_id}"
              captures: { dup_error: $.data.error_id }
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { c1_sig: $.data.client_signature_name, c1_v: $.data.version }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_CONTRACT_NOT_DRAFT"
            - "CustomFarmingContract.${c1_id}.contract_status == ACTIVE"
            - "CustomFarmingContract.${c1_id}.client_signature_name == Dana Ridgecrest"
            - "CustomFarmingContract.${c1_id}.version == 3"

      - name: contract_settle_after_close_returns_contract_not_active
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=61]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - state_machines.CustomFarmingContract.terminal_states
        distinguishing_aspect: "CLOSED is terminal for settlement too: a second FINAL settle-period on an already CLOSED contract returns ERR_CONTRACT_NOT_ACTIVE at HTTP 409 and settled_period_count stays 1 with last_settlement_total unchanged at 11955.00."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (12.5 acres) enrolled under ACTIVE contract C1 (period_overhead_pool 1000.00, cost_pass_through_pct 0.08, per_acre_annual_fee 950.00, period 2026-01-01..2026-12-31); no farming activity of any kind."
            - "A FINAL settle-period at period_end_date 2026-12-31 has already run, so C1 is CLOSED with settled_period_count 1 and last_settlement_total 11955.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
            - call: "POST /contracts/${c1_id}/settle-period"
              payload: { settlement_mode: "FINAL", period_end_date: "2026-12-31" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { first_total: $.data.total_billable }
          trigger:
            - call: "POST /contracts/${c1_id}/settle-period"
              payload: { settlement_mode: "FINAL", period_end_date: "2026-12-31" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { closed_error: $.data.error_id }
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { c1_status: $.data.contract_status, c1_count: $.data.settled_period_count, c1_last: $.data.last_settlement_total }
          assert:
            - "the first settlement returns total_billable 11955.00 and contract_status CLOSED"
            - "the second settlement attempt: HTTP status is 409 and error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "CustomFarmingContract.${c1_id}.contract_status == CLOSED"
            - "CustomFarmingContract.${c1_id}.settled_period_count == 1"
            - "CustomFarmingContract.${c1_id}.last_settlement_total == 11955.00"

      - name: plan_return_for_revision_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=63]
          - errors[ERR_PLAN_NOT_SUBMITTED]
          - state_machines.FarmingPlan.SUBMITTED_to_DRAFT
        distinguishing_aspect: "return-for-revision is only defined from SUBMITTED: invoked on a DRAFT plan it returns ERR_PLAN_NOT_SUBMITTED at HTTP 409, leaving revision_count 0 and version 1."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 and a DRAFT FarmingPlan P1 for plan_year 2026 that has never been submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
