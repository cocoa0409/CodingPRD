      - name: occ_line_patch_stale_estimate_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-edit-stale-estimate]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential line patches against the same observed estimate version: the first succeeds (version bumps), the second — carrying the stale version — fails 412 ERR_STALE_VERSION."
