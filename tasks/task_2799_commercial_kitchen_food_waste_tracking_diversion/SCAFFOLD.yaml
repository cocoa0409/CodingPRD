    output: ReductionTarget
    side_effects: ["creates the target in PROPOSED; any prior PROPOSED/ACTIVE target with the same site_id, window_start and window_end transitions to SUPERSEDED"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_BASELINE_NOT_FOUND, ERR_STALE_SITE_VERSION, ERR_TARGET_WINDOW_BEFORE_BASELINE]

  - method: POST
    path: /reduction-targets/{id}/activate
    purpose: Activate a proposed target and compute its first attainment evaluation.
    roles: [CorporateSustainabilityLead]
    input: []
    output: ReductionTarget
    side_effects: ["state_machines.ReductionTarget.PROPOSED_to_ACTIVE — computes calculations.reduction_attainment; NEVER resolves the target to ACHIEVED/MISSED, which only POST /_clock/set_current_utc can do"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TARGET_NOT_FOUND, ERR_INVALID_TARGET_STATE, ERR_BASELINE_NOT_CERTIFIED]

