  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: break_resolve_adjust_cascade
        grounds:
          - state_machines.ReconciliationBreak.OPEN_to_RESOLVED
          - state_machines.Position.OPEN_to_CLOSED
          - calculations.break_variance
        distinguishing_aspect: |
          Depth-3 cascade from the resolve trigger: break resolution mutates
          Position.quantity (hop 1); the position mutation recomputes the
          class's ESTIMATED NavRecord GAV (hop 2); because this is the class's
          first record the accrual base is GAV, so the ExpenseAccrual amount
          itself recomputes 0.27 -> 0.33 (hop 3).
        test_recipe:
          setup:
            - "Base kit with position qty 1000; NavRecord 2026-08-04 ESTIMATED (first record: accrual base = GAV 100000.00, accrual 0.27, version 1)"
            - "Custodian reports 1200 against book 1000 -> break variance +200"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant, captures: { pos_id: "$.data.id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
            - { call: "POST /reconciliation-breaks", payload: { fund_id: "${fund_id}", position_id: "${pos_id}", break_type: "CUSTODIAN_POSITION", break_date: "2026-08-04", counterparty_quantity: 1200 }, as: FundAccountant, captures: { brk_id: "$.data.id" } }
          trigger:
            - { call: "POST /reconciliation-breaks/${brk_id}/resolve", payload: { resolution_type: "ADJUST_POSITION" }, as: FundController }
            - { call: "GET /positions/${pos_id}", payload: {}, as: FundController, captures: { pos_qty: "$.data.quantity" } }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_gav: "$.data.gross_asset_value", nav_accr: "$.data.expense_accrual_total", nav_tna: "$.data.total_net_assets", nav_ps: "$.data.nav_per_share", nav_v2: "$.data.version" } }
          assert:
            - "Position.${pos_id}.quantity == 1200 (${pos_qty}) — hop 1"
            - "NavRecord.${nav_id}.gross_asset_value == 120000.00 (${nav_gav}) — hop 2, recomputed from the adjusted position"
            - "NavRecord.${nav_id}.expense_accrual_total == 0.33 (${nav_accr}) — hop 3, accrual recomputed because base is GAV on the first record"
            - "NavRecord.${nav_id}.total_net_assets == 119999.67 and nav_per_share == 12.0000; version ${nav_v2} == ${nav_v1} + 1"
      - name: distribution_reinvest_cascade
        grounds:
          - state_machines.Distribution.DECLARED_to_PAID
          - calculations.distribution_per_share
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: paying with reinvest=true
          mutates ShareClass (retained_income -50.00 and shares_outstanding
          +5.0000, hop 1), and that shares mutation recomputes the class's
          latest ESTIMATED NavRecord (nav_per_share 10.0000 -> 9.9950, hop 2).
        test_recipe:
          setup:
            - "Base kit, 100000 shares; NavRecord 2026-08-04 FINAL (TNA 99999.73, nav 10.0000)"
            - "retained_income 51.00; Distribution declared (income_per_share 0.0005, total 50.00, payable 2026-08-10)"
            - "NavRecord 2026-08-05 ESTIMATED (GAV 100000.00, accrual 0.27 on base 99999.73, nav 10.0000, version 1)"
            - "Clock advanced to payable date 2026-08-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 100000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px1_id: "$.data.id" } }
            - { call: "POST /price-observations/${px1_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav1_id: "$.data.id", nav1_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav1_id}/finalize", payload: { expected_nav_record_version: "${nav1_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "INCOME_POSTING", activity_date: "2026-08-05", amount: 51.00 }, as: FundAccountant }
            - { call: "POST /distributions", payload: { share_class_id: "${class_id}", declaration_date: "2026-08-05", ex_date: "2026-08-06", record_date: "2026-08-07", payable_date: "2026-08-10" }, as: FundAccountant, captures: { dist_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: FundController }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-05", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px2_id: "$.data.id" } }
            - { call: "POST /price-observations/${px2_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-05" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav2_id: "$.data.id", nav2_v1: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FundController }
          trigger:
            - { call: "POST /distributions/${dist_id}/pay", payload: { reinvest: true }, as: FundController, captures: { dist_status: "$.data.status", reinvested: "$.data.reinvested_shares" } }
            - { call: "GET /share-classes/${class_id}", payload: {}, as: FundController, captures: { cls_shares: "$.data.shares_outstanding", cls_retained: "$.data.retained_income" } }
            - { call: "GET /nav-records/${nav2_id}", payload: {}, as: FundController, captures: { nav2_ps: "$.data.nav_per_share", nav2_v2: "$.data.version" } }
          assert:
            - "Distribution.${dist_id}.status == PAID and reinvested_shares == 5.0000 (round4(50.00 / 10.0000))"
            - "ShareClass.${class_id}.retained_income == 1.00 (${cls_retained}) and shares_outstanding == 100005 (${cls_shares}) — hop 1"
            - "NavRecord.${nav2_id}.nav_per_share == 9.9950 (${nav2_ps}, round4(99999.73/100005)) and version ${nav2_v2} == ${nav2_v1} + 1 — hop 2"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: finalize_conflict_state_beats_price_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRICE_NOT_APPROVED]
        distinguishing_aspect: |
          Error-category pair state vs business_constraint: finalizing an
          already-FINAL record while a SUBMITTED observation also exists for a
          held security on that date violates both rules; priority 5 (state)
          wins over priority 9 (constraint), so ERR_INVALID_STATE is returned.
        test_recipe:
          setup:
            - "Base kit; NavRecord 2026-08-04 already FINAL (version 2)"
            - "A BROKER_QUOTE LEVEL_2 99.00 observation for the same security/date is left SUBMITTED (price create does not recompute FINAL records)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v1}" }, as: FundController, as_user_id: "ctl_1", captures: { nav_v2: "$.data.version" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 99.00, source: "BROKER_QUOTE", pricing_level: "LEVEL_2" }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v2}" }, as: FundController, as_user_id: "ctl_1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409) — the already-FINAL state violation at priority 5 masks the SUBMITTED-price constraint violation at priority 9 (ERR_PRICE_NOT_APPROVED must NOT be returned)"
      - name: filing_approve_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_BREAK_ESCALATED_BLOCKS]
          - errors[ERR_PERIOD_NOT_ENDED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          pair from the other instance): approving a filing while a break is
          ESCALATED AND its period_end is still in the future violates both;
          priority 7 (safety) wins over priority 8 (temporal).
        test_recipe:
          setup:
            - "Fund/class/position qty 1000; break dated 2026-08-04 (counterparty 900) escalated after clock moves to 2026-08-10 (> 5 days)"
            - "N_PORT filing with period_end 2026-08-31 (in the future vs clock) submitted for review by comp_1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant, captures: { pos_id: "$.data.id" } }
            - { call: "POST /reconciliation-breaks", payload: { fund_id: "${fund_id}", position_id: "${pos_id}", break_type: "CUSTODIAN_POSITION", break_date: "2026-08-04", counterparty_quantity: 900 }, as: FundAccountant, captures: { brk_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FundController }
            - { call: "POST /reconciliation-breaks/escalate-overdue", payload: {}, as: FundController, captures: { esc_n: "$.data.escalated_count" } }
            - { call: "POST /regulatory-filings", payload: { fund_id: "${fund_id}", filing_type: "N_PORT", period_end: "2026-08-31" }, as: ComplianceOfficer, as_user_id: "comp_1", captures: { fil_id: "$.data.id" } }
            - { call: "POST /regulatory-filings/${fil_id}/submit-review", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1" }
          trigger:
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1", captures: { err: "$.data.error_id" } }
          assert:
            - "${esc_n} == 1 (break ESCALATED before the approve attempt)"
            - "${err} == ERR_BREAK_ESCALATED_BLOCKS (http 409) — priority-7 safety masks priority-8 ERR_PERIOD_NOT_ENDED even though period_end 2026-08-31 is after the clock date 2026-08-10"

