scenario: "Advanced Placement Exam Ordering, Course Audit & Score Reporting (College Board): course audit where a school submits syllabi for approval before it may label a course with the program name, exam ordering windows with per-student registration, late order fees and unused exam charges, secure exam material shipment, storage and chain of custody at schools with seal verification, testing accommodations approval through a documentation review process with extended time and alternate format provisioning, alternate exam dates for conflicts and emergencies with separate forms, scoring operations with reader recruitment, rubric calibration and score aggregation, score release with student score sends, college recipient designation and score cancellation or withholding requests, testing irregularity investigation with score invalidation"
domain_name: "advanced-placement-exam-program"
api_prefix: "/ap-program"
complexity_profile:
  primary_archetype: "compliance/audit"
  secondary_archetype: "temporal windowing"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
  entity_topology: "flat"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal school name
      - name: school_code
        type: string
        source: input
        description: six-character school code; unique per API
        constraints: "UNIQUE across School"
      - name: country_code
        type: string
        source: input
        description: ISO country code; ordering and pricing rules branch on this value
      - name: program_label_authorized
        type: boolean
        source: computed
        description: true only while the School has at least one CourseAudit with status APPROVED; gates every course-label and exam-order operation
        default: false
      - name: center_code
        type: string
        source: input
        description: four-digit test-center code; unique per API
        constraints: "UNIQUE across School"
      - name: seat_capacity
        type: integer
        source: input
        description: maximum simultaneous examinees the school center can host
        constraints: "must be >= 1"
      - name: seal_required
        type: boolean
        source: input
        description: whether every material shipment to this school requires a verified seal
        default: true
      - name: test_center_status
        type: enum
        source: system
        description: lifecycle of the school's test center; gates material dispatch and alternate scheduling
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, RETIRED"
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: sum over every ExamOrder of this school of (order_fee_cents + unused_exam_charge_cents); recomputed whenever either field changes
        default: 0
      - name: designation_slots_used
        type: integer
        source: computed
        description: count of ScoreSend rows with recipient_type == COLLEGE and status IN {PENDING, SENT, ACKNOWLEDGED} across this school students
        default: 0
  - name: CourseAudit
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; owning school"
      - name: course_title
        type: string
        source: input
        description: title of the course submitted for program designation
      - name: syllabus_hash
        type: string
        source: input
        description: content hash of the submitted syllabus document
      - name: status
        type: enum
        source: system
        description: audit lifecycle
        default: SUBMITTED
        constraints: "one of SUBMITTED, IN_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED, EXPIRED"
      - name: review_round
        type: integer
        source: system
        description: number of completed reviewer passes; starts at 0
        default: 0
      - name: syllabus_revision_count
        type: integer
        source: system
        description: number of syllabus revisions submitted after a REVISION_REQUESTED state
        default: 0
      - name: approval_term_end_utc
        type: datetime
        source: computed
        description: end of the approved term; APPROVED audits expire when the logical clock passes this instant
        default: null
      - name: decision_notes
        type: string
        source: input
        description: reviewer notes recorded on the latest decision
      - name: designated_course_count
        type: integer
        source: computed
        description: count of CourseAudit rows for the same school_id with status APPROVED; recomputed on every audit status change
        default: 0
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: student legal name
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; school of record"
      - name: student_code
        type: string
        source: input
        description: program-issued student identifier; unique within one school
        constraints: "UNIQUE on (school_id, student_code)"
      - name: grade_level
        type: integer
        source: input
        description: grade level in the school year of the exam administration
      - name: accommodation_eligible
        type: boolean
        source: computed
        description: true while the student holds at least one AccommodationRequest with status APPROVED
        default: false
      - name: enrolled
        type: boolean
        source: input
        description: whether the student is currently enrolled at the school of record
        default: true
  - name: ExamOrder
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; ordering school"
      - name: course_audit_id
        type: string
        source: input
        description: "FK -> CourseAudit.id; the approved audit the order spends its designation authority on"
      - name: administration_year
        type: integer
        source: input
        description: exam administration year, e.g. 2027
      - name: ordering_window
        type: enum
        source: computed
        description: ordering window classification derived from the logical clock at submission time
        default: NOT_OPEN
        constraints: "one of NOT_OPEN, REGULAR, LATE, CLOSED"
      - name: status
        type: enum
        source: system
        description: order lifecycle
        default: DRAFT
        constraints: "one of DRAFT, OPEN, SUBMITTED, MATERIALS_SHIPPED, MATERIALS_RECEIVED, DELIVERED, VOIDED"
      - name: registration_count
        type: integer
        source: computed
        description: count of ExamRegistration rows for this order in status IN {REGISTERED, FEE_PENDING, CONFIRMED, MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}
        default: 0
      - name: order_fee_cents
        type: integer
        source: computed
        description: live order fee; holds the provisional variant while status IN {OPEN, SUBMITTED, MATERIALS_SHIPPED, MATERIALS_RECEIVED} and the consolidated variant once status == DELIVERED; see calculation order_fee_dual_variant
        default: 0
      - name: provisional_order_fee_cents
        type: integer
        source: computed
        description: always holds the provisional variant of calculation order_fee_dual_variant, so both variants are readable side by side on one row
        default: 0
      - name: unused_exam_charge_cents
        type: integer
        source: computed
        description: charge for registered exams that were never delivered
        default: 0
      - name: materials_sealed
        type: boolean
        source: system
        description: whether the latest custody event for this order recorded an intact seal
        default: false
  - name: ExamRegistration
    parent: ExamOrder
    common_fields: true
    fields:
      - name: exam_order_id
        type: string
        source: input
        description: "FK -> ExamOrder.id; owning order"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; examining student"
      - name: exam_subject
        type: string
        source: input
        description: exam subject code, e.g. AP-CALC-AB
      - name: registration_tier
        type: enum
        source: input
        description: window tier the registration was accepted in
        default: REGULAR
        constraints: "one of REGULAR, LATE, EMERGENCY"
      - name: status
        type: enum
        source: system
        description: registration lifecycle
        default: REGISTERED
        constraints: "one of REGISTERED, FEE_PENDING, CONFIRMED, MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED, CANCELLED, INVALIDATED"
      - name: late_fee_cents
        type: integer
        source: computed
        description: late order fee assessed on this registration
        default: 0
      - name: refundable_cents
        type: integer
        source: computed
        description: refundable portion of the fees collected for this registration
        default: 0
      - name: fees_paid_cents
        type: integer
        source: input
        description: fees settled for this registration; must reach late_fee_cents before CONFIRMED
        default: 0
      - name: fee_waived
        type: boolean
        source: input
        description: whether PlatformAdmin waived the assessed late fee
        default: false
      - name: accommodation_flag
        type: boolean
        source: computed
        description: true when the linked Student holds an APPROVED AccommodationRequest for this exam
        default: false
  - name: AccommodationRequest
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student seeking accommodations"
      - name: exam_subject
        type: string
        source: input
        description: exam subject the accommodation applies to
      - name: accommodation_type
        type: enum
        source: input
        description: requested accommodation category
        constraints: "one of EXTENDED_TIME, ALTERNATE_FORMAT, SMALL_GROUP, BREAK_AS_NEEDED"
      - name: documentation_completeness
        type: integer
        source: input
        description: count of distinct required documentation items supplied; threshold is 3
        constraints: "0 <= value <= 3"
      - name: extended_time_multiplier
        type: number
        source: computed
        description: minutes multiplier provisioned to the exam session when approved
        default: 1.0
      - name: status
        type: enum
        source: system
        description: accommodation review lifecycle
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_DOC_REVIEW, INFO_REQUESTED, APPROVED, DENIED, REVOKED"
      - name: review_round
        type: integer
        source: system
        description: count of documentation review cycles completed; starts at 0
        default: 0
  - name: AlternateExamRequest
    parent: ExamRegistration
    common_fields: true
    fields:
      - name: exam_registration_id
        type: string
        source: input
        description: "FK -> ExamRegistration.id; registration being rescheduled"
      - name: alternate_date_utc
        type: datetime
        source: input
        description: requested alternate administration date
      - name: reason_code
        type: enum
        source: input
        description: reason for the alternate administration
        constraints: "one of SCHEDULE_CONFLICT, ILLNESS, RELIGIOUS_OBSERVANCE, EMERGENCY, OTHER"
      - name: form_code
        type: string
        source: input
        description: separate alternate-exam form identifier required for the request
      - name: status
        type: enum
        source: system
        description: alternate request lifecycle
        default: FILED
        constraints: "one of FILED, UNDER_REVIEW, APPROVED, SCHEDULED, DENIED, WITHDRAWN"
      - name: seat_block_conflict
        type: boolean
        source: computed
        description: true when the requested alternate date collides with another alternate request at the same center
        default: false
  - name: ExamScore
    parent: ExamRegistration
    common_fields: true
    fields:
      - name: exam_registration_id
        type: string
        source: input
        description: "FK -> ExamRegistration.id; registration being scored"
      - name: raw_composite
        type: number
        source: input
        description: unrounded composite of section raw scores; range 0.0 to 120.0
      - name: reader_id
        type: string
        source: input
        description: "FK -> Reader.id; reader whose rubric pass produced the section marks"
      - name: ap_score
        type: integer
        source: computed
        description: final 1-5 composite score; see calculation ap_score_marginal_vs_cumulative
        default: 0
      - name: reader_reliability_index
        type: number
        source: computed
        description: copied from the assigned Reader.reliability_index when the score row is created and refreshed whenever that reader recalibrates; drives reader demotion
        default: 0.0
      - name: status
        type: enum
        source: system
        description: score lifecycle, independent of the registration's own status dimension
        default: NOT_SCORED
        constraints: "one of NOT_SCORED, RUBRIC_PENDING, AGGREGATED, RELEASED, CANCELLED, WITHHELD, INVALIDATED"
      - name: release_blocked
        type: boolean
        source: computed
        description: true while an open IrregularityCase for this registration has status IN {OPEN, INVESTIGATING}; gates score release
        default: false
  - name: Reader
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: reader legal name
      - name: subject_expertise
        type: string
        source: input
        description: exam subject the reader is certified to score
      - name: calibration_status
        type: enum
        source: system
        description: reader calibration lifecycle
        default: RECRUITED
        constraints: "one of RECRUITED, CALIBRATING, CALIBRATED, DEMOTED, INACTIVE"
      - name: reliability_index
        type: number
        source: computed
        description: latest calibration agreement index; 0.00 to 1.00
        default: 0.0
      - name: calibration_round_count
        type: integer
        source: system
        description: number of calibration passes completed; starts at 0
        default: 0
      - name: calibration_sample_count
        type: integer
        source: input
        description: number of calibration papers scored in the latest pass; 0 to 40
      - name: calibration_agreement_rate
        type: number
        source: input
        description: fraction of calibration papers agreeing with the master rubric in the latest pass; 0.0000 to 1.0000
      - name: calibration_index
        type: number
        source: computed
        description: weighted calibration index; see calculation calibration_index_weighted
        default: 0.0
      - name: assigned_score_count
        type: integer
        source: computed
        description: count of ExamScore rows in status IN {AGGREGATED, RELEASED} assigned to this reader
        default: 0
      - name: load_status
        type: enum
        source: computed
        description: derived load band used by the reader selector
        default: AVAILABLE
        constraints: "one of AVAILABLE, AT_CAPACITY, DEMOTED, INACTIVE"
  - name: ExamMaterialShipment
    parent: School
    common_fields: true
    fields:
      - name: exam_order_id
        type: string
        source: input
        description: "FK -> ExamOrder.id; order whose exams are shipped"
      - name: carrier_tracking_id
        type: string
        source: input
        description: carrier tracking identifier; unique per API
        constraints: "UNIQUE across ExamMaterialShipment"
      - name: seal_number
        type: string
        source: input
        description: tamper-evident seal number applied at dispatch
      - name: seal_verified
        type: boolean
        source: system
        description: whether the receiving center verified the seal on receipt
        default: false
      - name: status
        type: enum
        source: system
        description: custody lifecycle
        default: CREATED
        constraints: "one of CREATED, DISPATCHED, IN_TRANSIT, RECEIVED, SEAL_BROKEN, RETURNED"
      - name: storage_checkpoint_count
        type: integer
        source: computed
        description: count of storage checkpoints recorded for this shipment
        default: 0
      - name: custody_event_types
        type: array
        source: system
        description: ordered chain-of-custody log; each element is an object of {event_type, seal_intact, occurred_at_utc, custody_sequence} appended by the custody endpoint and by every status transition
        default: []
      - name: custody_sequence_count
        type: integer
        source: computed
        description: length of custody_event_types; the chain must be gap-free for RECEIVED and RETURNED
        default: 0
  - name: ScoreSend
    parent: ExamScore
    common_fields: true
    fields:
      - name: exam_score_id
        type: string
        source: input
        description: "FK -> ExamScore.id; score being sent"
      - name: recipient_type
        type: enum
        source: input
        description: destination category for the score send
        constraints: "one of COLLEGE, STUDENT, SCHOOL"
      - name: recipient_code
        type: string
        source: input
        description: college code, school code, or student code receiving the score
      - name: designation_year
        type: integer
        source: input
        description: administration year whose designation budget the send consumes
      - name: fee_cents
        type: integer
        source: computed
        description: dual-variant send fee; see calculation score_send_fee_dual_variant
        default: 0
      - name: status
        type: enum
        source: system
        description: send lifecycle
        default: PENDING
        constraints: "one of PENDING, SENT, ACKNOWLEDGED, FAILED, CANCELLED"
      - name: credit_back_cents
        type: integer
        source: computed
        description: credit restored when the send is cancelled
        default: 0
  - name: IrregularityCase
    parent: ExamRegistration
    common_fields: true
    fields:
      - name: exam_registration_id
        type: string
        source: input
        description: "FK -> ExamRegistration.id; registration under investigation"
      - name: test_center_id
        type: string
        source: input
        description: "FK -> School.id; school whose center hosted the irregularity"
      - name: irregularity_type
        type: enum
        source: input
        description: category of the reported testing irregularity
        constraints: "one of UNAUTHORIZED_DEVICE, IMPROPER_ADMINISTRATION, IDENTITY_DISCREPANCY, MATERIAL_COMPROMISE, ADMINISTRATOR_MISCONDUCT"
      - name: status
        type: enum
        source: system
        description: investigation lifecycle
        default: OPEN
        constraints: "one of OPEN, INVESTIGATING, DECISION_PENDING, CONFIRMED, DISMISSED, APPEALED"
      - name: finding_code
        type: string
        source: input
        description: recorded finding when a decision is issued
        default: null
      - name: investigation_round
        type: integer
        source: system
        description: number of investigation passes completed; starts at 0
        default: 0

state_machines:
  - entity: CourseAudit
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /course-audits/{id}/status-transitions with to_status=IN_REVIEW"
        actor: CourseAuditReviewer
        preconditions:
          - "actor user id != course_audit.submitted_by_user_id (segregation of duties)"
          - "course_audit.syllabus_hash is non-empty"
        side_effects:
          - "course_audit.review_round := course_audit.review_round + 1"
          - "course_audit.updated_at refreshed; course_audit.version incremented by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /course-audits/{id}/status-transitions with to_status=REVISION_REQUESTED"
        actor: CourseAuditReviewer
        preconditions:
          - "course_audit.decision_notes is non-empty"
          - "course_audit.review_round >= 1"
        side_effects:
          - "course_audit.version incremented by 1"
          - "no change to school.program_label_authorized (audit was never APPROVED)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /course-audits/{id}/status-transitions with to_status=SUBMITTED"
        actor: SchoolCoordinator
        preconditions:
          - "course_audit.syllabus_revision_count < MAX_SYLLABUS_REVISIONS = 5"
          - "the submitted syllabus_hash differs from the hash recorded on the previous SUBMITTED state (identical hash raises ERR_SYLLABUS_UNCHANGED)"
        side_effects:
          - "course_audit.syllabus_revision_count := course_audit.syllabus_revision_count + 1"
          - "course_audit.version incremented by 1"
        note: "Revision loop — REVISION_REQUESTED -> SUBMITTED is the cyclic edge of this machine."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /course-audits/{id}/status-transitions with to_status=APPROVED"
        actor: CourseAuditReviewer
        preconditions:
          - "actor user id != course_audit.submitted_by_user_id (segregation of duties)"
          - "course_audit.decision_notes is non-empty"
          - "course_audit.review_round >= 1"
          - "school.status == ACTIVE"
        side_effects:
          - "course_audit.approval_term_end_utc := 2027-06-30T23:59:59Z"
          - "school.designated_course_count := count of CourseAudit rows with school_id == school.id AND status == APPROVED (recomputed after this audit flips to APPROVED)"
          - "school.program_label_authorized := true (designated_course_count >= 1)"
          - "CASCADE hop 1 -> hop 2: every ExamOrder with course_audit_id == course_audit.id AND status == DRAFT transitions DRAFT -> OPEN (see ExamOrder machine), which recomputes that order's ordering_window from the logical clock"
          - "CASCADE hop 3: every ExamRegistration of each newly OPENED order with status == REGISTERED AND student.accommodation_eligible == false transitions REGISTERED -> CONFIRMED; registrations whose student holds a non-REVOKED AccommodationRequest for that exam stay REGISTERED"
          - "school.version incremented by 1 (one increment per affected school, not per child)"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /course-audits/{id}/status-transitions with to_status=REJECTED"
        actor: CourseAuditReviewer
        preconditions:
          - "course_audit.review_round >= 1"
          - "course_audit.syllabus_revision_count >= 2"
          - "course_audit.decision_notes is non-empty"
        side_effects:
          - "school.designated_course_count recomputed; school.program_label_authorized := (designated_course_count >= 1)"
          - "course_audit.version incremented by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: logical clock passes course_audit.approval_term_end_utc"
        actor: system
        preconditions:
          - "logical clock instant > course_audit.approval_term_end_utc"
        side_effects:
          - "school.designated_course_count recomputed; school.program_label_authorized := (designated_course_count >= 1)"
          - "every ExamOrder with course_audit_id == course_audit.id AND status == DRAFT is VOIDED"
          - "course_audit.version incremented by 1"
  - entity: ExamOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=OPEN, or course-audit approval cascade"
        actor: SchoolCoordinator | system
        preconditions:
          - "the CourseAudit referenced by exam_order.course_audit_id has status == APPROVED (cross-entity dependency: CourseAudit -> ExamOrder)"
          - "school.program_label_authorized == true"
          - "school.status == ACTIVE"
        side_effects:
          - "exam_order.ordering_window := classify_window(logical clock) per calculation ordering_window_classification"
          - "school.version incremented by 1 (only when the transition is triggered by the audit-approval cascade)"
          - "exam_order.version incremented by 1"
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=SUBMITTED"
        actor: SchoolCoordinator
        preconditions:
          - "exam_order.registration_count >= MIN_ORDER_SIZE = 1"
          - "exam_order.ordering_window IN {REGULAR, LATE}"
          - "every ExamRegistration of this order has status IN {REGISTERED, FEE_PENDING, CONFIRMED}"
        side_effects:
          - "exam_order.order_fee_cents := provisional variant of calculation order_fee_dual_variant"
          - "exam_order.version incremented by 1"
      - from: SUBMITTED
        to: MATERIALS_SHIPPED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=MATERIALS_SHIPPED"
        actor: PlatformAdmin
        preconditions:
          - "every ExamRegistration of this order has status == CONFIRMED"
          - "at least one ExamMaterialShipment exists with exam_order_id == exam_order.id"
          - "every ExamMaterialShipment of this order has status IN {CREATED, DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "exam_order.materials_sealed := true"
          - "exam_order.version incremented by 1"
      - from: MATERIALS_SHIPPED
        to: MATERIALS_RECEIVED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=MATERIALS_RECEIVED"
        actor: PlatformAdmin
        preconditions:
          - "every ExamMaterialShipment of this order has status == RECEIVED AND seal_verified == true"
          - "exam_order.registration_count <= MAX_EXAMINEES_PER_ORDER = 500"
        side_effects:
          - "every ExamRegistration of this order with status == CONFIRMED transitions CONFIRMED -> MATERIAL_ASSIGNED"
          - "exam_order.version incremented by 1"
      - from: MATERIALS_RECEIVED
        to: DELIVERED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=DELIVERED"
        actor: PlatformAdmin
        preconditions:
          - "exam_order.registration_count >= MIN_ORDER_SIZE = 1"
          - "no ExamMaterialShipment of this order has status IN {SEAL_BROKEN, IN_TRANSIT, DISPATCHED}"
        side_effects:
          - "exam_order.order_fee_cents := final variant of calculation order_fee_dual_variant"
          - "exam_order.unused_exam_charge_cents := calculation unused_exam_charge (evaluated AFTER order_fee_cents, per its pinned evaluation order)"
          - "every ExamRegistration of this order with status == CONFIRMED transitions CONFIRMED -> CANCELLED with refundable_cents := 0 (charged as unused instead)"
          - "exam_order.version incremented by 1"
      - from: MATERIALS_SHIPPED
        to: SUBMITTED
        trigger: "system: ExamMaterialShipment of this order transitions to SEAL_BROKEN"
        actor: system
        preconditions:
          - "at least one ExamMaterialShipment with exam_order_id == exam_order.id has status == SEAL_BROKEN"
        side_effects:
          - "exam_order.materials_sealed := false"
          - "for each ExamRegistration of this order with status == MATERIAL_ASSIGNED an IrregularityCase with irregularity_type == MATERIAL_COMPROMISE and status == OPEN is created (depth-2 cascade from the seal break)"
          - "exam_order.version incremented by 1"
        note: "Revert edge — MATERIALS_SHIPPED -> SUBMITTED is the cyclic edge of this machine."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=VOIDED"
        actor: SchoolCoordinator
        preconditions:
          - "no ExamRegistration of this order has status IN {MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}"
        side_effects:
          - "exam_order.version incremented by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=VOIDED"
        actor: SchoolCoordinator
        preconditions:
          - "no ExamRegistration of this order has status IN {MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}"
        side_effects:
          - "every ExamRegistration of this order with status == REGISTERED transitions REGISTERED -> CANCELLED with refundable_cents := 0"
          - "school.version incremented by 1"
          - "exam_order.version incremented by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /exam-orders/{id}/status-transitions with to_status=VOIDED"
        actor: PlatformAdmin
        preconditions:
          - "no ExamRegistration of this order has status IN {MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}"
          - "exam_order.order_fee_cents == 0 OR every ExamRegistration of this order has status == CANCELLED"
        side_effects:
          - "every ExamRegistration of this order transitions to CANCELLED with refundable_cents := registration fee paid"
          - "school.version incremented by 1"
          - "exam_order.order_fee_cents := 0; exam_order.version incremented by 1"
  - entity: ExamRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, INVALIDATED]
    transitions:
      - from: REGISTERED
        to: FEE_PENDING
        trigger: "POST /exam-registrations/{id}/status-transitions with to_status=FEE_PENDING"
        actor: SchoolCoordinator
        preconditions:
          - "the ExamOrder referenced by exam_registration.exam_order_id has status IN {OPEN, SUBMITTED}"
          - "exam_registration.student_id refers to a Student with enrolled == true"
          - "the student's registration count across all orders for this administration_year is < MAX_EXAMS_PER_STUDENT = 9"
        side_effects:
          - "exam_registration.late_fee_cents := calculation late_order_fee variant 'per-registration'"
          - "exam_registration.refundable_cents := exam fee base (18000) + late_fee_cents when registration_tier == LATE, else 18000"
          - "exam_order.registration_count recomputed; exam_order.version incremented by 1"
          - "exam_registration.version incremented by 1"
      - from: FEE_PENDING
        to: REGISTERED
        trigger: "POST /exam-registrations/{id}/status-transitions with to_status=REGISTERED"
        actor: PlatformAdmin
        preconditions:
          - "exceptionally allowed only when the assessed late_fee_cents is waived by PlatformAdmin (fee_waived=true in payload)"
        side_effects:
          - "exam_registration.late_fee_cents := 0; exam_registration.version incremented by 1"
        note: "Revert edge — FEE_PENDING -> REGISTERED is the cyclic edge of this machine."
      - from: FEE_PENDING
        to: CONFIRMED
        trigger: "POST /exam-registrations/{id}/status-transitions with to_status=CONFIRMED"
        actor: SchoolCoordinator
        preconditions:
          - "exam_registration.late_fee_cents has been paid (fees_paid_cents >= late_fee_cents)"
          - "the ExamOrder of this registration has status IN {OPEN, SUBMITTED, MATERIALS_SHIPPED, MATERIALS_RECEIVED}"
        side_effects:
          - "student.accommodation_eligible := (an APPROVED AccommodationRequest exists for student_id); a flip from false to true moves pending material assignment"
          - "exam_registration.accommodation_flag := student.accommodation_eligible"
          - "exam_registration.version incremented by 1"
      - from: REGISTERED
        to: CONFIRMED
        trigger: "course-audit approval cascade, or POST /exam-registrations/{id}/status-transitions with to_status=CONFIRMED"
        actor: system | SchoolCoordinator
        preconditions:
          - "when triggered by the cascade: student.accommodation_eligible == false AND exam_registration.status == REGISTERED"
          - "when triggered directly: exam_registration.late_fee_cents == 0"
        side_effects:
          - "exam_registration.version incremented by 1"
      - from: CONFIRMED
        to: MATERIAL_ASSIGNED
        trigger: "system: owning ExamOrder transitions MATERIALS_SHIPPED -> MATERIALS_RECEIVED"
        actor: system
        preconditions:
          - "exam_registration.status == CONFIRMED"
          - "exam_registration.accommodation_flag == false OR (the linked AccommodationRequest has status == APPROVED AND extended_time_multiplier has been provisioned)"
        side_effects:
          - "when accommodation_flag == true: the linked AccommodationRequest's provisioning is recorded on the registration and the ExamScore row is created with reader_id resolved by calculation reader_selection"
          - "exam_registration.version incremented by 1"
      - from: MATERIAL_ASSIGNED
        to: SCORED
        trigger: "system: ExamScore of this registration reaches status AGGREGATED"
        actor: system
        preconditions:
          - "the ExamScore with exam_registration_id == exam_registration.id has status == AGGREGATED"
        side_effects:
          - "exam_registration.version incremented by 1"
      - from: SCORED
        to: SCORE_RELEASED
        trigger: "system: ExamScore of this registration reaches status RELEASED"
        actor: system
        preconditions:
          - "the ExamScore with exam_registration_id == exam_registration.id has status == RELEASED"
        side_effects:
          - "exam_registration.version incremented by 1"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /exam-registrations/{id}/status-transitions with to_status=CANCELLED, or owning order VOIDED"
        actor: SchoolCoordinator | system
        preconditions:
          - "exam_registration.status IN {REGISTERED, FEE_PENDING, CONFIRMED}"
        side_effects:
          - "exam_registration.refundable_cents := 18000 (base exam fee only; late_fee_cents is non-refundable)"
          - "exam_order.registration_count recomputed; exam_order.version incremented by 1"
          - "school.version incremented by 1"
          - "exam_registration.version incremented by 1"
      - from: CANCELLED
        to: REGISTERED
        trigger: "POST /exam-registrations/{id}/status-transitions with to_status=REGISTERED"
        actor: PlatformAdmin
        preconditions:
          - "exam_registration.status == CANCELLED AND the owning ExamOrder has status == OPEN"
          - "the reinstatement occurs inside the REGULAR window (ordering_window == REGULAR)"
        side_effects:
          - "exam_registration.refundable_cents := 18000 + late_fee_cents"
          - "exam_registration.version incremented by 1"
        note: "Revert edge — CANCELLED -> REGISTERED is the cyclic edge of this machine."
      - from: SCORE_RELEASED
        to: INVALIDATED
        trigger: "system: IrregularityCase of this registration transitions to CONFIRMED with finding_code == SCORE_INVALIDATION_REQUIRED"
        actor: system
        preconditions:
          - "the IrregularityCase with exam_registration_id == exam_registration.id has status == CONFIRMED AND finding_code == SCORE_INVALIDATION_REQUIRED"
        side_effects:
          - "the ExamScore of this registration transitions to INVALIDATED"
          - "every ScoreSend of that ExamScore transitions to CANCELLED with credit_back_cents := its fee_cents"
          - "exam_registration.version incremented by 1"
  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_DOC_REVIEW
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=UNDER_DOC_REVIEW"
        actor: AccommodationReviewer
        preconditions:
          - "actor user id != accommodation_request.submitted_by_user_id (segregation of duties)"
          - "accommodation_request.documentation_completeness >= 1"
        side_effects:
          - "accommodation_request.review_round := accommodation_request.review_round + 1"
          - "accommodation_request.version incremented by 1"
      - from: UNDER_DOC_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=INFO_REQUESTED"
        actor: AccommodationReviewer
        preconditions:
          - "accommodation_request.documentation_completeness < DOC_COMPLETENESS_THRESHOLD = 3"
        side_effects:
          - "accommodation_request.version incremented by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=SUBMITTED"
        actor: SchoolCoordinator
        preconditions:
          - "documentation_completeness submitted in the payload > the value recorded on the previous SUBMITTED state"
          - "accommodation_request.review_round < MAX_DOC_REVIEW_ROUNDS = 3"
        side_effects:
          - "accommodation_request.version incremented by 1"
        note: "Revision loop — INFO_REQUESTED -> SUBMITTED is the cyclic edge of this machine."
      - from: UNDER_DOC_REVIEW
        to: APPROVED
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=APPROVED"
        actor: AccommodationReviewer
        preconditions:
          - "accommodation_request.documentation_completeness >= DOC_COMPLETENESS_THRESHOLD = 3"
          - "actor user id != accommodation_request.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "accommodation_request.extended_time_multiplier := 1.5 when accommodation_type == EXTENDED_TIME, else 1.0"
          - "student.accommodation_eligible := true; student.version incremented by 1"
          - "CASCADE hop 1 -> hop 2: every ExamRegistration with student_id == accommodation_request.student_id AND exam_subject == accommodation_request.exam_subject AND status == REGISTERED transitions REGISTERED -> CONFIRMED; hop 2 then sets that ExamScore release eligibility so a later ExamScore aggregation requires the provisioned extended_time_multiplier"
          - "accommodation_request.version incremented by 1"
      - from: UNDER_DOC_REVIEW
        to: DENIED
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=DENIED"
        actor: AccommodationReviewer
        preconditions:
          - "accommodation_request.review_round >= 1"
        side_effects:
          - "student.accommodation_eligible := (an APPROVED AccommodationRequest still exists for student_id)"
          - "accommodation_request.extended_time_multiplier := 1.0"
          - "student.version incremented by 1"
          - "accommodation_request.version incremented by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /accommodation-requests/{id}/status-transitions with to_status=REVOKED"
        actor: AccommodationReviewer
        preconditions:
          - "actor user id != accommodation_request.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "student.accommodation_eligible := (another APPROVED AccommodationRequest exists for student_id)"
          - "every ExamRegistration of that student whose accommodation_flag == true and that has not reached SCORED has accommodation_flag := false; registrations that already reached SCORED keep the provisioned multiplier and are NOT reverted"
          - "student.version incremented by 1"
          - "accommodation_request.version incremented by 1"
  - entity: ExamScore
    initial_state: NOT_SCORED
    terminal_states: [RELEASED, CANCELLED, WITHHELD, INVALIDATED]
    transitions:
      - from: NOT_SCORED
        to: RUBRIC_PENDING
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=RUBRIC_PENDING"
        actor: ScoringSpecialist
        preconditions:
          - "the ExamRegistration with id == exam_score.exam_registration_id has status == MATERIAL_ASSIGNED"
          - "the Reader named by exam_score.reader_id has calibration_status == CALIBRATED"
          - "the Reader named by exam_score.reader_id has calibration_index >= CALIBRATION_PASS_THRESHOLD = 0.85"
        side_effects:
          - "the assigned Reader's assigned_score_count := assigned_score_count + 1"
          - "the assigned Reader's load_status := AT_CAPACITY when assigned_score_count reaches READER_LOAD_CAP = 120"
          - "exam_score.version incremented by 1"
      - from: RUBRIC_PENDING
        to: AGGREGATED
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=AGGREGATED"
        actor: ScoringSpecialist
        preconditions:
          - "exam_score.raw_composite is between 0.0 and 120.0 inclusive"
          - "the Reader named by exam_score.reader_id has reliability_index >= READER_RELIABILITY_FLOOR = 0.75"
        side_effects:
          - "exam_score.ap_score := final variant (cross-total mapping) of calculation ap_score_marginal_vs_cumulative"
          - "the owning ExamRegistration MATCHED -> SCORED transition is fired"
          - "exam_score.version incremented by 1"
      - from: AGGREGATED
        to: RELEASED
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=RELEASED"
        actor: ScoringSpecialist
        preconditions:
          - "exam_score.release_blocked == false (no IrregularityCase with status IN {OPEN, INVESTIGATING} for the registration)"
          - "logical clock >= score_release_open(window)"
          - "the registration's accommodation provisioning is complete when accommodation_flag == true"
        side_effects:
          - "every ExamRegistration of the same ExamOrder whose ExamScore is RELEASED and whoserelease is complete triggers the ExamOrder auto-transition to DELIVERED (see ExamOrder auto-transitions)"
          - "exam_score.version incremented by 1"
      - from: RELEASED
        to: WITHHELD
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=WITHHELD"
        actor: ScoringSpecialist
        preconditions:
          - "a score withholding request has been recorded for this ExamScore"
          - "logical clock < the withholding deadline = 2027-07-31T23:59:59Z"
        side_effects:
          - "every ScoreSend of this ExamScore with status IN {PENDING, SENT} transitions to CANCELLED with credit_back_cents := its fee_cents"
          - "exam_score.version incremented by 1"
      - from: AGGREGATED
        to: WITHHELD
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=WITHHELD"
        actor: ScoringSpecialist
        preconditions:
          - "a score withholding request has been recorded for this ExamScore"
          - "exam_score.status == AGGREGATED"
        side_effects:
          - "the ExamRegistration stays SCORED; no ScoreSend exists yet"
          - "exam_score.version incremented by 1"
      - from: AGGREGATED
        to: CANCELLED
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=CANCELLED"
        actor: ScoringSpecialist
        preconditions:
          - "a score cancellation request has been recorded for this ExamScore"
          - "logical clock < the cancellation deadline = 2027-07-31T23:59:59Z"
        side_effects:
          - "exam_score.version incremented by 1"
      - from: WITHHELD
        to: RELEASED
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=RELEASED"
        actor: ScoringSpecialist
        preconditions:
          - "the withholding request for this ExamScore has been withdrawn"
        side_effects:
          - "exam_score.version incremented by 1"
        note: "Revert edge — WITHHELD -> RELEASED is the cyclic edge of this machine."
      - from: CANCELLED
        to: AGGREGATED
        trigger: "POST /exam-scores/{id}/status-transitions with to_status=AGGREGATED"
        actor: PlatformAdmin
        preconditions:
          - "the score cancellation request for this ExamScore has been withdrawn"
          - "logical clock < the cancellation deadline = 2027-07-31T23:59:59Z"
        side_effects:
          - "exam_score.ap_score recomputed per calculation ap_score_marginal_vs_cumulative final variant"
          - "exam_score.version incremented by 1"
        note: "Revert edge — CANCELLED -> AGGREGATED is the cyclic edge of this machine."
      - from: RELEASED
        to: INVALIDATED
        trigger: "system: IrregularityCase CONFIRMED with finding_code == SCORE_INVALIDATION_REQUIRED"
        actor: system
        preconditions:
          - "the IrregularityCase with exam_registration_id == exam_score.exam_registration_id has status == CONFIRMED AND finding_code == SCORE_INVALIDATION_REQUIRED"
        side_effects:
          - "every ScoreSend of this ExamScore transitions to CANCELLED with credit_back_cents := its fee_cents"
          - "the owning ExamRegistration transitions SCORE_RELEASED -> INVALIDATED"
          - "exam_score.version incremented by 1"
      - from: RELEASED
        to: CANCELLED
        trigger: "system: IrregularityCase DISMISSED after a prior withholding, or explicit POST with to_status=CANCELLED"
        actor: system | ScoringSpecialist
        preconditions:
          - "a score cancellation request has been recorded OR an irregularity decision released the block"
        side_effects:
          - "exam_score.version incremented by 1"
  - entity: Reader
    initial_state: RECRUITED
    terminal_states: [INACTIVE]
    transitions:
      - from: RECRUITED
        to: CALIBRATING
        trigger: "POST /readers/{id}/status-transitions with to_status=CALIBRATING"
        actor: ScoringSpecialist
        preconditions:
          - "reader.calibration_status == RECRUITED"
        side_effects:
          - "reader.version incremented by 1"
      - from: CALIBRATING
        to: CALIBRATED
        trigger: "POST /readers/{id}/status-transitions with to_status=CALIBRATED"
        actor: ScoringSpecialist
        preconditions:
          - "reader.calibration_sample_count >= MIN_CALIBRATION_SAMPLES = 10"
          - "reader.calibration_agreement_rate >= READER_RELIABILITY_FLOOR = 0.75"
        side_effects:
          - "reader.calibration_round_count := reader.calibration_round_count + 1"
          - "reader.reliability_index := reader.calibration_agreement_rate"
          - "reader.calibration_index := calculation calibration_index_weighted applied to this reader"
          - "reader.load_status := AT_CAPACITY when reader.assigned_score_count >= READER_LOAD_CAP = 120, else AVAILABLE"
          - "reader.version incremented by 1"
      - from: CALIBRATING
        to: RECRUITED
        trigger: "POST /readers/{id}/status-transitions with to_status=RECRUITED"
        actor: ScoringSpecialist
        preconditions:
          - "reader.calibration_index < CALIBRATION_PASS_THRESHOLD = 0.85"
        side_effects:
          - "reader.reliability_index unchanged"
          - "reader.version incremented by 1"
        note: "Revert edge — CALIBRATING -> RECRUITED is the cyclic edge of this machine."
      - from: CALIBRATED
        to: DEMOTED
        trigger: "POST /readers/{id}/status-transitions with to_status=DEMOTED"
        actor: ScoringSpecialist
        preconditions:
          - "the payload calibration_agreement_rate < READER_RELIABILITY_FLOOR = 0.75"
        side_effects:
          - "reader.reliability_index := reader.calibration_agreement_rate"
          - "reader.load_status := DEMOTED"
          - "every ExamScore with reader_id == reader.id AND status == RUBRIC_PENDING is reassigned by calculation reader_selection when at least one other eligible reader exists; when the eligible pool is empty the ExamScore keeps its reader_id and parks in RUBRIC_PENDING"
          - "reader.version incremented by 1"
      - from: DEMOTED
        to: CALIBRATING
        trigger: "POST /readers/{id}/status-transitions with to_status=CALIBRATING"
        actor: ScoringSpecialist
        preconditions:
          - "the payload records a new calibration pass for reader.subject_expertise"
        side_effects:
          - "reader.version incremented by 1"
        note: "Revert edge — DEMOTED -> CALIBRATING is the cyclic edge of this machine."
      - from: CALIBRATED
        to: INACTIVE
        trigger: "POST /readers/{id}/status-transitions with to_status=INACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "reader.assigned_score_count == 0"
        side_effects:
          - "reader.load_status := INACTIVE"
          - "reader.version incremented by 1"
  - entity: ExamMaterialShipment
    initial_state: CREATED
    terminal_states: [RECEIVED, RETURNED, SEAL_BROKEN]
    transitions:
      - from: CREATED
        to: DISPATCHED
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=DISPATCHED"
        actor: PlatformAdmin
        preconditions:
          - "exam_material_shipment.seal_number is non-empty"
          - "the School with id == exam_material_shipment.school_id has program_label_authorized == true"
        side_effects:
          - "a custody event of event_type DISPATCH with seal_intact == true is appended to exam_material_shipment.custody_event_types"
          - "exam_material_shipment.version incremented by 1"
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=IN_TRANSIT"
        actor: PlatformAdmin
        preconditions:
          - "the latest CustodyEvent of this shipment has event_type == DISPATCH"
        side_effects:
          - "a custody event of event_type TRANSIT_SCAN is appended with custody_sequence := custody_sequence_count + 1"
          - "exam_material_shipment.version incremented by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=RECEIVED"
        actor: SchoolCoordinator
        preconditions:
          - "the center's seal_required flag is true implies the payload seal_intact == true"
          - "the shipment's custody_sequence chain has no gap (each 1..n present exactly once)"
        side_effects:
          - "exam_material_shipment.seal_verified := true"
          - "a custody event of event_type SEAL_VERIFY with seal_intact == true is appended"
          - "when School.seal_required == false the received seal verification is recorded as NOT_REQUIRED rather than verified"
          - "exam_material_shipment.version incremented by 1"
      - from: IN_TRANSIT
        to: SEAL_BROKEN
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=SEAL_BROKEN"
        actor: SchoolCoordinator
        preconditions:
          - "the payload seal_intact == false"
        side_effects:
          - "a custody event of event_type SEAL_BREAK_REPORT with seal_intact == false is appended"
          - "the owning ExamOrder transitions MATERIALS_SHIPPED -> SUBMITTED when it is MATERIALS_SHIPPED"
          - "exam_material_shipment.version incremented by 1"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=RETURNED"
        actor: SchoolCoordinator
        preconditions:
          - "every ExamRegistration of the owning order with a MATERIAL_ASSIGNED status has been consumed or cancelled"
        side_effects:
          - "a custody event of event_type RETURN is appended"
          - "exam_material_shipment.version incremented by 1"
      - from: SEAL_BROKEN
        to: RETURNED
        trigger: "POST /material-shipments/{id}/status-transitions with to_status=RETURNED"
        actor: PlatformAdmin
        preconditions:
          - "every IrregularityCase created from the seal break has status IN {CONFIRMED, DISMISSED}"
        side_effects:
          - "a custody event of event_type RETURN is appended"
          - "exam_material_shipment.version incremented by 1"
  - entity: AlternateExamRequest
    initial_state: FILED
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=UNDER_REVIEW"
        actor: SchoolCoordinator
        preconditions:
          - "alternate_exam_request.form_code is non-empty"
          - "the ExamRegistration with id == alternate_exam_request.exam_registration_id has status == CONFIRMED"
        side_effects:
          - "alternate_exam_request.version incremented by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=APPROVED"
        actor: SchoolCoordinator
        preconditions:
          - "the alternate date does not exceed the concurrent alternate-exam seat cap of the School hosting the center (see calculation alternate_seat_occupancy)"
        side_effects:
          - "alternate_exam_request.version incremented by 1"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=SCHEDULED"
        actor: SchoolCoordinator
        preconditions:
          - "an alternate form is available for alternate_exam_request.form_code"
          - "the linked ExamRegistration has status == CONFIRMED"
        side_effects:
          - "the linked ExamRegistration's exam_subject is scored against the alternate form; ExamScore rows created for the alternate form use the alternate form's rubric_calibration_id resolved by calculation reader_selection"
          - "alternate_exam_request.version incremented by 1"
      - from: APPROVED
        to: FILED
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=FILED"
        actor: SchoolCoordinator
        preconditions:
          - "the alternate_date_utc submitted in the payload differs from the approved date"
        side_effects:
          - "alternate_exam_request.version incremented by 1"
        note: "Revision loop — APPROVED -> FILED is the cyclic edge of this machine."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=DENIED"
        actor: SchoolCoordinator
        preconditions:
          - "the reason_code is OTHER OR the seat-occupancy formula returned an overflow"
        side_effects:
          - "alternate_exam_request.version incremented by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /alternate-exam-requests/{id}/status-transitions with to_status=WITHDRAWN"
        actor: SchoolCoordinator
        preconditions:
          - "alternate_exam_request.status == FILED"
        side_effects:
          - "alternate_exam_request.version incremented by 1"
  - entity: IrregularityCase
    initial_state: OPEN
    terminal_states: [DISMISSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=INVESTIGATING"
        actor: IntegrityInvestigator
        preconditions:
          - "irregularity_case.irregularity_type is non-empty"
        side_effects:
          - "irregularity_case.investigation_round := investigation_round + 1"
          - "every ExamScore of the linked ExamRegistration with status IN {AGGREGATED, RELEASED} has release_blocked := true"
          - "irregularity_case.version incremented by 1"
      - from: INVESTIGATING
        to: DECISION_PENDING
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=DECISION_PENDING"
        actor: IntegrityInvestigator
        preconditions:
          - "irregularity_case.investigation_round >= 1"
          - "the payload finding_code is non-empty"
        side_effects:
          - "irregularity_case.version incremented by 1"
      - from: DECISION_PENDING
        to: CONFIRMED
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=CONFIRMED"
        actor: IntegrityInvestigator
        preconditions:
          - "irregularity_case.finding_code IN {SCORE_INVALIDATION_REQUIRED, WARNING_ONLY}"
          - "actor user id != the user id recorded as the case reporter (segregation of duties)"
        side_effects:
          - "when finding_code == SCORE_INVALIDATION_REQUIRED: the linked ExamRegistration transitions to INVALIDATED and its ExamScore to INVALIDATED; depth-3 cascade continues to every ScoreSend of that ExamScore which transitions to CANCELLED with credit_back_cents := fee_cents"
          - "when finding_code == WARNING_ONLY: release_blocked is cleared on every ExamScore of the registration and no score state changes"
          - "irregularity_case.version incremented by 1"
      - from: DECISION_PENDING
        to: DISMISSED
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=DISMISSED"
        actor: IntegrityInvestigator
        preconditions:
          - "irregularity_case.finding_code == NO_FINDING OR irregularity_case.finding_code is null"
        side_effects:
          - "every ExamScore of the linked ExamRegistration has release_blocked := false"
          - "irregularity_case.version incremented by 1"
      - from: CONFIRMED
        to: APPEALED
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=APPEALED"
        actor: SchoolCoordinator
        preconditions:
          - "logical clock < the appeal deadline = the later of (case confirmed_at + 30 days) and 2027-08-15T23:59:59Z"
        side_effects:
          - "irregularity_case.version incremented by 1"
        note: "Cyclic edge — CONFIRMED -> APPEALED -> INVESTIGATING allows one more investigation round."
      - from: APPEALED
        to: INVESTIGATING
        trigger: "POST /irregularity-cases/{id}/status-transitions with to_status=INVESTIGATING"
        actor: IntegrityInvestigator
        preconditions:
          - "irregularity_case.status == APPEALED"
        side_effects:
          - "irregularity_case.investigation_round := investigation_round + 1"
          - "exam_score.release_blocked := true again for every ExamScore of the registration that had been released"
          - "irregularity_case.version incremented by 1"
  - entity: ScoreSend
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, FAILED, CANCELLED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /score-sends/{id}/status-transitions with to_status=SENT"
        actor: ScoringSpecialist
        preconditions:
          - "the ExamScore with id == score_send.exam_score_id has status == RELEASED"
          - "score_send.recipient_type == COLLEGE implies score_send.designation_year == the administration year of the exam"
        side_effects:
          - "score_send.version incremented by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /score-sends/{id}/status-transitions with to_status=ACKNOWLEDGED"
        actor: system
        preconditions:
          - "score_send.status == SENT"
        side_effects:
          - "score_send.version incremented by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /score-sends/{id}/status-transitions with to_status=CANCELLED"
        actor: SchoolCoordinator
        preconditions:
          - "score_send.status == PENDING"
          - "logical clock <= the send cancellation deadline = the later of (send created_at + 7 days) and 2027-07-31T23:59:59Z"
        side_effects:
          - "score_send.credit_back_cents := score_send.fee_cents"
          - "score_send.version incremented by 1"
      - from: SENT
        to: CANCELLED
        trigger: "system: the owning ExamScore transitions to INVALIDATED or WITHHELD"
        actor: system
        preconditions:
          - "the ExamScore with id == score_send.exam_score_id has status IN {WITHHELD, INVALIDATED}"
        side_effects:
          - "score_send.credit_back_cents := score_send.fee_cents"
          - "score_send.version incremented by 1"
        note: "Compensating edge — this reversal restores the designation budget consumed by the original SENT transition."
      - from: PENDING
        to: FAILED
        trigger: "POST /score-sends/{id}/status-transitions with to_status=FAILED"
        actor: system
        preconditions:
          - "the recipient_code does not resolve to a known recipient"
        side_effects:
          - "score_send.version incremented by 1"

  - entity: School
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: "This machine governs School.test_center_status, a second state dimension carried on the same School row as its program_label_authorized flag and its designated_course_count."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /schools/{id}/status-transitions with to_status=SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "a CONFIRMED IrregularityCase with irregularity_type == ADMINISTRATOR_MISCONDUCT exists for an exam registration hosted by this school"
        side_effects:
          - "school.test_center_status := SUSPENDED"
          - "school.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /schools/{id}/status-transitions with to_status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "every IrregularityCase hosted by this school has status == DISMISSED"
        side_effects:
          - "school.version incremented by 1"
        note: "Revert edge — SUSPENDED -> ACTIVE is the cyclic edge of this machine."
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /schools/{id}/status-transitions with to_status=RETIRED"
        actor: PlatformAdmin
        preconditions:
          - "every AlternateExamRequest whose registration belongs to a student of this school has status IN {DENIED, WITHDRAWN}"
        side_effects:
          - "school.version incremented by 1"

concurrency_rules:
  - rule_id: audit-decision-stale-audit
    parent_entity: CourseAudit
    write_endpoint: "POST /course-audits/{id}/status-transitions"
    occ_field: "expected_course_audit_version"
    description: |
      A CourseAudit status transition carrying a course_audit version observed
      before another writer advanced that audit is rejected, because the cursor
      of review_round / syllabus_revision_count the caller acted on is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-transition-stale-order
    parent_entity: ExamOrder
    write_endpoint: "POST /exam-orders/{id}/status-transitions"
    occ_field: "expected_exam_order_version"
    description: |
      An ExamOrder status transition carrying an exam_order version observed
      before a cascade (course-audit approval or a seal-break revert) advanced
      the order is rejected; the caller's view of status and order_fee_cents is
      stale even though the request itself is well-formed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: score-transition-stale-score
    parent_entity: ExamScore
    write_endpoint: "POST /exam-scores/{id}/status-transitions"
    occ_field: "expected_exam_score_version"
    description: |
      An ExamScore status transition carrying an exam_score version observed
      before a release-block write advanced the score is rejected; the caller's
      view of release_blocked is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: alternate-request-stale-request
    parent_entity: AlternateExamRequest
    write_endpoint: "POST /alternate-exam-requests/{id}/status-transitions"
    occ_field: "expected_alternate_exam_request_version"
    description: |
      An AlternateExamRequest status transition carrying a version observed
      before another writer moved the same request is rejected; the caller's
      view of approved alternate_date_utc is stale, so re-filing is required
      rather than overwriting the approved date.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: order_fee_dual_variant
    trigger: "ExamOrder OPEN -> SUBMITTED (base variant) and MATERIALS_RECEIVED -> DELIVERED (final variant)"
    algorithm: tiered_pricing
    formula: |
      BASE (variant "provisional"):
        BASE_FEE_CENTS = 18000 * exam_order.registration_count
        LATE_SURCHARGE_CENTS = 4000 * (count of ExamRegistration rows of this order whose registration_tier == LATE)
        EMERGENCY_SURCHARGE_CENTS = 9000 * (count of ExamRegistration rows of this order whose registration_tier == EMERGENCY)
        provisional_fee = BASE_FEE_CENTS + LATE_SURCHARGE_CENTS + EMERGENCY_SURCHARGE_CENTS
      FINAL (variant "consolidated"):
        DELIVERED_COUNT = count of ExamRegistration rows of this order whose status IN {MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}
        CONSOLIDATION_BREAKS = [0, 2, 5, 10]  # exclusive lower bounds on DELIVERED_COUNT
        CONSOLIDATION_RATES = [1.00, 0.97, 0.94, 0.90]
        MARGINAL_BASE_CENTS = 0
        for index in ascending order 0..3:
            slice_lo = CONSOLIDATION_BREAKS[index]
            slice_hi = CONSOLIDATION_BREAKS[index + 1] if index + 1 <= 3 else +infinity
            slice_count = max(0, min(DELIVERED_COUNT, slice_hi) - slice_lo)
            MARGINAL_BASE_CENTS += round_half_up(slice_count * 18000 * CONSOLIDATION_RATES[index])
        RATE_APPLIED = CONSOLIDATION_RATES[index of the slice containing DELIVERED_COUNT; DELIVERED_COUNT == 10 uses CONSOLIDATION_RATES[3]]
        single_rate_base = round_half_up(DELIVERED_COUNT * 18000 * RATE_APPLIED)
        final_fee = single_rate_base + LATE_SURCHARGE_CENTS + EMERGENCY_SURCHARGE_CENTS
      Evaluation order pinned: DELIVERED_COUNT is computed from the CURRENT registration
      statuses first; the rebate tier is then read off that count. The fee is never
      re-derived from the fee itself (no circular dependence on order_fee_cents).
    input_set: "ExamRegistration rows with exam_order_id == exam_order.id and status IN {MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED} for the final variant; all non-CANCELLED rows for the provisional variant"
    constants:
      BASE_EXAM_FEE_CENTS: 18000
      LATE_SURCHARGE_PER_EXAM_CENTS: 4000
      EMERGENCY_SURCHARGE_PER_EXAM_CENTS: 9000
      CONSOLIDATION_BREAKS: [0, 2, 5, 10]
      CONSOLIDATION_RATES: [1.00, 0.97, 0.94, 0.90]
    precision: "integer cents, round_half_up on every per-slice product BEFORE summing slices"
    variants:
      - name: provisional
        when: "ExamOrder OPEN -> SUBMITTED; no exam has been delivered yet"
        difference: "charges every registered exam at the full 18000 rate plus per-tier surcharges; ignores consolidation entirely"
      - name: consolidated
        when: "ExamOrder MATERIALS_RECEIVED -> DELIVERED"
        difference: "applies marginal consolidation rates over delivered-exam slices; an 8-delivered order yields marginal_base 139140 while the single-rate base is 135360, a 3780 delta"
  - name: ap_score_marginal_vs_cumulative
    trigger: "ExamScore RUBRIC_PENDING -> AGGREGATED, and again on CANCELLED -> AGGREGATED"
    algorithm: threshold
    formula: |
      FINAL (variant "cross_total_mapping"): ap_score is the FIRST matching band, evaluated top-down,
      on the UNROUNDED raw_composite:
        raw_composite >= AP5_MIN             -> 5
        AP4_MIN <= raw_composite < AP5_MIN   -> 4
        AP3_MIN <= raw_composite < AP4_MIN   -> 3
        AP2_MIN <= raw_composite < AP3_MIN   -> 2
        raw_composite <  AP2_MIN             -> 1
      MARGINAL (variant "section_band_sum"): first map each of the five sections to its own band,
      then map the integer sum of bands through the sum-band table:
        sum_of_bands >= 21 -> 5
        17 <= sum_of_bands <= 20 -> 4
        13 <= sum_of_bands <= 16 -> 3
        9  <= sum_of_bands <= 12 -> 2
        sum_of_bands <= 8 -> 1
      The two variants diverge whenever the section bands straddle a cross-total band edge.
    input_set: "the single ExamScore row under transition; raw_composite for the final variant, per-section band marks for the marginal variant"
    constants:
      AP5_MIN: 96.0
      AP4_MIN: 76.0
      AP3_MIN: 52.0
      AP2_MIN: 30.0
    precision: "raw_composite compared at full float precision; no intermediate rounding before band selection"
    variants:
      - name: cross_total_mapping
        when: "ExamScore RUBRIC_PENDING -> AGGREGATED"
        difference: "applies the four cross-total thresholds directly to raw_composite and returns one of 1..5"
      - name: section_band_sum
        when: "audit recomputation of an already aggregated score (CANCELLED -> AGGREGATED recompute path)"
        difference: "sums five per-section bands and returns one of 1..5; raw_composite 95.5 yields final 4 but marginal 5"
  - name: late_order_fee
    trigger: "ExamRegistration REGISTERED -> FEE_PENDING, and ExamOrder order_fee_cents recompute"
    algorithm: tiered_pricing
    formula: |
      window = calculate ordering_window_classification at submission time
      variant "per-registration":
        if registration_tier == REGULAR: late_fee = 0
        elif registration_tier == LATE and window == LATE: late_fee = 4000
        elif registration_tier == LATE and window == CLOSED: late_fee = 4000 + 5500  # LATE_BASE + CLOSED_STEP
        elif registration_tier == EMERGENCY: late_fee = 9000
      variant "order_level":
        LATE_COUNT = count of ExamRegistration rows of this order with registration_tier == LATE
        CHARGEABLE = min(LATE_COUNT, LATE_FEE_CAP_COUNT)   # cap is an absolute count, not a fraction
        order_level_late = CHARGEABLE * 4000
    input_set: "ExamRegistration rows of the order whose registration_tier IN {LATE, EMERGENCY} and status IN {FEE_PENDING, CONFIRMED, MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED}"
    constants:
      LATE_FEE_PER_EXAM_CENTS: 4000
      EMERGENCY_FEE_PER_EXAM_CENTS: 9000
      CLOSED_WINDOW_ADDITIONAL_CENTS: 5500
      LATE_FEE_CAP_COUNT: 25
    precision: "integer cents, exact arithmetic, no rounding"
    variants:
      - name: per_registration
        when: "assessing a single ExamRegistration into FEE_PENDING"
        difference: "adds CLOSED_WINDOW_ADDITIONAL_CENTS when the submission happened in the CLOSED window"
      - name: order_level
        when: "cancelling a subset of late registrations on one order"
        difference: "caps the chargeable late count at LATE_FEE_CAP_COUNT = 25, so a 30-late order pays 25 * 4000 = 100000 on reversal instead of 120000"
  - name: unused_exam_charge
    trigger: "ExamOrder MATERIALS_RECEIVED -> DELIVERED, evaluated after order_fee_dual_variant"
    algorithm: aggregation
    formula: |
      CONFIRMED_AND_UNUSED = count of ExamRegistration rows of this order whose status == CONFIRMED
      if CONFIRMED_AND_UNUSED <= UNUSED_EXAM_GRACE_COUNT:   # 1
          unused_exam_charge_cents = 0
      else:
          chargeable = CONFIRMED_AND_UNUSED - UNUSED_EXAM_GRACE_COUNT
          unused_exam_charge_cents = chargeable * 27000
      Evaluation order pinned: order_fee_cents (final variant) is computed first; the unused
      charge is computed second and is never an input to the rebate tier selection.
    input_set: "ExamRegistration rows of this order with status == CONFIRMED at the instant of the DELIVERED transition"
    constants:
      UNUSED_EXAM_GRACE_COUNT: 1
      UNUSED_EXAM_CHARGE_PER_EXAM_CENTS: 27000
    precision: "integer cents, exact arithmetic"
    variants:
      - name: base
        when: "always"
        difference: "the grace count is subtracted before multiplying; 0 or 1 unused exams are free, 2 unused exams cost 27000"
  - name: calibration_index_weighted
    trigger: "RubricCalibration OPEN -> SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      SAMPLE_FACTOR = min(1.0, rubric_calibration.sample_paper_count / SAMPLE_FULL_CREDIT_COUNT)   # SAMPLE_FULL_CREDIT_COUNT = 20
      PRECISION_PENALTY = round_half_up(DEVIATION_SCALE * (1.0 - SAMPLE_FACTOR), 4)                # DEVIATION_SCALE = 0.08
      calibration_index = round_half_up(rubric_calibration.agreement_rate * 0.90
                            + SAMPLE_FACTOR * 0.10
                            - PRECISION_PENALTY, 4)
      Evaluation order pinned: agreement_rate term first, sample term second, penalty subtracted last.
    input_set: "the single RubricCalibration row under transition"
    constants:
      SAMPLE_FULL_CREDIT_COUNT: 20
      DEVIATION_SCALE: 0.08
      AGREEMENT_WEIGHT: 0.90
      SAMPLE_WEIGHT: 0.10
      CALIBRATION_PASS_THRESHOLD: 0.85
      MIN_CALIBRATION_SAMPLES: 10
    precision: "4 decimal places, round_half_up at the final step only"
    variants:
      - name: base
        when: "always"
        difference: "a single-index formula; sample_paper_count 10 with agreement_rate 0.9000 yields 0.9000*0.90 + 0.5000*0.10 - 0.0400 = 0.8200, which FAILS the 0.85 threshold, while sample_paper_count 20 with agreement_rate 0.9000 yields 0.9100, which PASSES"
  - name: reader_selection
    trigger: "ExamScore creation (material assignment) and ExamScore reader reassignment after a reader demotion"
    algorithm: constraint_propagation
    formula: |
      ELIGIBLE = Readers R where
          R.subject_expertise == exam_registration.exam_subject
          AND R.calibration_status == CALIBRATED
          AND R.load_status == AVAILABLE
          AND R.assigned_score_count < READER_LOAD_CAP        # 120
      RANKING = ascending R.assigned_score_count
      TIE_BREAK = ascending R.created_at, then ascending R.reliability_index DESCENDING? NO —
          TIE_BREAK = ascending R.created_at; if still tied, HIGHER R.reliability_index wins;
          if still tied, the lexicographically smaller R.full_name wins. UUID/id NEVER used.
      EXCLUSION ON RETRY: any reader already demoted for this ExamScore is excluded from ELIGIBLE.
      FALLBACK when ELIGIBLE is empty: the ExamScore parks in RUBRIC_PENDING with reader_id null
          and the endpoint returns ERR_NO_ELIGIBLE_READER (409) rather than deferring silently.
    input_set: "Readers with calibration_status == CALIBRATED and load_status == AVAILABLE"
    constants:
      READER_LOAD_CAP: 120
      READER_RELIABILITY_FLOOR: 0.75
      READER_RELIABILITY_CEILING: 1.0
    precision: "n/a (discrete selector)"
    variants:
      - name: initial_assignment
        when: "first assignment when an ExamScore row is created"
        difference: "exclusion set is empty, so the full ELIGIBLE pool participates"
      - name: reassignment_after_demotion
        when: "a reader is demoted and its RUBRIC_PENDING scores are reassigned"
        difference: "the demoted reader is excluded from ELIGIBLE, so the next-ranked reader wins even if it carries a heavier assigned_score_count"
  - name: ordering_window_classification
    trigger: "ExamOrder DRAFT -> OPEN and ExamRegistration fee assessment"
    algorithm: threshold
    formula: |
      clock = logical clock instant
      if clock < 2026-11-01T00:00:00Z: window = NOT_OPEN
      elif clock <= 2027-01-31T23:59:59Z: window = REGULAR
      elif clock <= 2027-03-15T23:59:59Z: window = LATE
      else: window = CLOSED
      Boundary precision pinned: the comparison is STRICTLY LESS for the opening edge
      (2026-11-01T00:00:00Z is already REGULAR) and INCLUSIVE on the closing edge of each
      band (2027-01-31T23:59:59Z is still REGULAR; 2027-02-01T00:00:00Z is LATE).
    input_set: "the logical clock instant supplied by POST /_clock/set_current_utc, defaulting to 2026-09-01T00:00:00Z"
    constants:
      REGULAR_WINDOW_OPENS_UTC: "2026-11-01T00:00:00Z"
      REGULAR_WINDOW_CLOSES_UTC: "2027-01-31T23:59:59Z"
      LATE_WINDOW_CLOSES_UTC: "2027-03-15T23:59:59Z"
      DEFAULT_CLOCK_UTC: "2026-09-01T00:00:00Z"
    precision: "instant comparison at second precision, UTC"
    variants:
      - name: base
        when: "always"
        difference: "a four-band classification where the default clock 2026-09-01T00:00:00Z yields NOT_OPEN, so any order created without an explicit clock set is NOT_OPEN"
  - name: alternate_seat_occupancy
    trigger: "AlternateExamRequest UNDER_REVIEW -> APPROVED"
    algorithm: interval_merge
    formula: |
      For the requesting School, gather every AlternateExamRequest whose linked ExamRegistration
      belongs to a Student of that school and whose status IN {APPROVED, SCHEDULED}.
      Interval for each such request: [alternate_date_utc - BUFFER_BEFORE_MINUTES, alternate_date_utc + EXAM_DURATION_MINUTES + BUFFER_AFTER_MINUTES]
      Merge intervals whose gap is 0 — i.e. touching intervals (end == next start) MERGE and
      count as ONE block, because the buffer must remain unoccupied.
      total_merged_minutes = sum of merged block lengths
      seat_minutes_available = school.seat_capacity * BUFFER_BEFORE_MINUTES
      if the requesting request's own interval overlaps any existing block, OR
         total_merged_minutes > seat_minutes_available:
          OVERFLOW -> AlternateExamRequest is DENIED with ERR_ALT_SEAT_CONFLICT
      else: APPROVED
      A SEPARATE stricter rule applies to the alternate-exam concurrent cap: no more than
      ALT_CONCURRENT_CAP = 2 alternate administrations for the same school may share one
      calendar day, regardless of buffer arithmetic.
    input_set: "AlternateExamRequest rows for the same School with status IN {APPROVED, SCHEDULED}"
    constants:
      BUFFER_BEFORE_MINUTES: 30
      EXAM_DURATION_MINUTES: 195
      BUFFER_AFTER_MINUTES: 30
      ALT_CONCURRENT_CAP: 2
    precision: "minute precision, UTC; touching intervals merge (gap == 0 merges, gap >= 1 minute does not)"
    variants:
      - name: base
        when: "always"
        difference: "buffer-merge occupancy; a request placed exactly at an existing block's end merges rather than opening a new block, and the same-day cap of 2 is evaluated independently of the merge result"
  - name: score_send_fee_dual_variant
    trigger: "ScoreSend creation for a COLLEGE recipient, and ScoreSend cancellation"
    algorithm: forward_looking
    formula: |
      COLLEGE_SENDS = count of ScoreSend rows with exam_score_id == score_send.exam_score_id
                      AND recipient_type == COLLEGE
                      AND status IN {PENDING, SENT, ACKNOWLEDGED}
      INCLUDE_SCHOOL = count of ScoreSend rows with recipient_type == SCHOOL and status IN {PENDING, SENT, ACKNOWLEDGED}
      ALL_INCLUDE = COLLEGE_SENDS + INCLUDE_SCHOOL
      variant "all_include":
        fee_cents = max(0, ALL_INCLUDE - FREE_SEND_ALLOWANCE) * SEND_FEE_CENTS        # allowance 2, fee 2500
      variant "college_only_exclude":
        first_college = max(0, COLLEGE_SENDS - 1)
        fee_cents = max(0, first_college - FREE_SEND_ALLOWANCE) * SEND_FEE_CENTS
      The two variants diverge on the SAME row because the include-set differs: a request with
      one SCHOOL send already recorded pays 0 under all_include and 0 under college_only for the
      first college send only when ALL_INCLUDE <= FREE_SEND_ALLOWANCE.
    input_set: "ScoreSend rows with status IN {PENDING, SENT, ACKNOWLEDGED}; CANCELLED and FAILED rows are excluded from every count"
    constants:
      FREE_SEND_ALLOWANCE: 2
      SEND_FEE_CENTS: 2500
    precision: "integer cents, exact arithmetic"
    variants:
      - name: all_include
        when: "the school-level send report (GET /score-sends with recipient_type filter)"
        difference: "counts SCHOOL sends against the same allowance as COLLEGE sends; a student with 2 college sends and 1 school send reports a 2500 fee for the school send"
      - name: college_only_exclude
        when: "the per-student checkout view for a college designation"
        difference: "excludes SCHOOL sends from BOTH the allowance and the count, so the same row reports 2500 for the third college send and 0 for the school send"
  - name: score_release_open
    trigger: "ExamScore AGGREGATED -> RELEASED"
    algorithm: threshold
    formula: |
      release_open_utc = max(
          REGULAR_RELEASE_UTC = 2027-07-05T00:00:00Z,
          the latest alternate_date_utc among AlternateExamRequest rows of this registration with status == SCHEDULED
      )
      release is permitted when logical clock >= release_open_utc
      A score whose registration has an SCHEDULED alternate date of 2027-07-18T00:00:00Z therefore
      becomes releasable only on or after that instant, not on the regular release date.
    input_set: "the single ExamScore under transition plus the AlternateExamRequest rows of its registration"
    constants:
      REGULAR_RELEASE_UTC: "2027-07-05T00:00:00Z"
      SCORE_RELEASE_WINDOW_CLOSES_UTC: "2027-09-15T23:59:59Z"
    precision: "instant comparison at second precision, UTC; equality releases"
    variants:
      - name: base
        when: "always"
        difference: "regular-release floor raised by the latest scheduled alternate date; a registration with no SCHEDULED alternate releases exactly at the regular date"
  - name: accommodation_provisioning
    trigger: "AccommodationRequest UNDER_DOC_REVIEW -> APPROVED and the linked ExamRegistration CONFIRMED -> MATERIAL_ASSIGNED"
    algorithm: aggregation
    formula: |
      APPROVED_DOC_ITEMS = count of distinct documentation item codes submitted, capped at 3
      doc_score = min(3, APPROVED_DOC_ITEMS)
      review_penalty = ACCOMMODATION_REVIEW_PENALTY = 0.05 * accommodation_request.review_round
      weight_sum = round_half_up(doc_score * 0.6 + accommodation_type_weight * 0.4 - review_penalty, 4)
      where accommodation_type_weight = 1.0 for EXTENDED_TIME, 0.8 for ALTERNATE_FORMAT,
      0.6 for SMALL_GROUP, 0.5 for BREAK_AS_NEEDED
      quantity variant: the provisioned minutes are
          round_half_up(EXAM_BASE_MINUTES * (1 + quantity_parameter), 0)
      where quantity_parameter = 0.5 for EXTENDED_TIME and 0.0 for every other type.
      BOTH variants are computed and BOTH are surfaced: weight_sum as a review-quality measure,
      provisioned_minutes as the operational quantity.
    input_set: "the single AccommodationRequest row under transition"
    constants:
      DOC_COMPLETENESS_THRESHOLD: 3
      ACCOMMODATION_REVIEW_PENALTY: 0.05
      EXAM_BASE_MINUTES: 195
      MAX_DOC_REVIEW_ROUNDS: 3
    precision: "weight_sum 4 decimal places round_half_up; provisioned_minutes integer half-up"
    variants:
      - name: weight_sum
        when: "any accommodation decision"
        difference: "returns a 0.6/0.4-weighted quality index; documentation_completeness 3 with zero review rounds and EXTENDED_TIME yields min(3,3)*0.6 + 1.0*0.4 - 0 = 2.2000"
      - name: provisioned_quantity
        when: "EXTENDED_TIME approval only"
        difference: "returns minutes rather than a score; EXAM_BASE_MINUTES 195 with a 0.5 parameter yields 293 provisioned minutes (round_half_up(292.5)) rather than 292"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles AND, when the role is entity_backed, X-User-ID equals the id of an existing instance of the backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "segregation of duties: the acting X-User-ID is not the user recorded as the submitter/reporter of the record under review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /course-audits/{id}/status-transitions, POST /accommodation-requests/{id}/status-transitions, POST /irregularity-cases/{id}/status-transitions"
  - priority: 5
    category: existence
    check: "the path resource exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 6
    category: existence
    check: "every referenced foreign key on the payload resolves to an existing row"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 7
    category: state
    check: "the entity's current status admits the requested to_status per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all status-transitions endpoints"
  - priority: 8
    category: state
    check: "the entity is not already in one of its terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all status-transitions endpoints"
  - priority: 9
    category: state
    check: "CourseAudit IN_REVIEW -> APPROVED requires review_round >= 1 and non-empty decision_notes"
    error_id: ERR_AUDIT_NOT_REVIEWED
    http_status: 409
    applies_to: "POST /course-audits/{id}/status-transitions"
  - priority: 10
    category: business_referential
    check: "an ExamOrder entering OPEN requires its CourseAudit to be APPROVED and school.program_label_authorized == true"
    error_id: ERR_COURSE_AUDIT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /exam-orders, POST /exam-orders/{id}/status-transitions"
  - priority: 11
    category: business_temporal
    check: "the ordering window classification at the logical clock must be REGULAR or LATE for a registration to be accepted; CLOSED and NOT_OPEN are refused"
    error_id: ERR_ORDER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /exam-registrations, POST /exam-orders/{id}/status-transitions"
  - priority: 12
    category: business_constraint
    check: "a student may hold at most MAX_EXAMS_PER_STUDENT = 9 registrations per administration_year"
    error_id: ERR_MAX_EXAMS_EXCEEDED
    http_status: 422
    applies_to: "POST /exam-registrations"
  - priority: 13
    category: business_constraint
    check: "an ExamOrder entering SUBMITTED requires registration_count >= MIN_ORDER_SIZE = 1"
    error_id: ERR_ORDER_MIN_SIZE
    http_status: 422
    applies_to: "POST /exam-orders/{id}/status-transitions"
  - priority: 14
    category: business_constraint
    check: "an ExamOrder holding more than MAX_EXAMINEES_PER_ORDER = 500 registrations is refused"
    error_id: ERR_ORDER_CAPACITY
    http_status: 422
    applies_to: "POST /exam-registrations, POST /exam-orders/{id}/status-transitions"
  - priority: 15
    category: business_safety
    check: "a material shipment may only be RECEIVED when the seal is intact where seal_required is true; an intact-seal violation is a safety failure, not a fiscal one"
    error_id: ERR_SEAL_VERIFICATION_FAILED
    http_status: 409
    applies_to: "POST /material-shipments/{id}/status-transitions"
  - priority: 16
    category: business_constraint
    check: "the custody chain must be gap-free: the sequence 1..n must be present exactly once before RECEIVED or RETURNED"
    error_id: ERR_CUSTODY_CHAIN_GAP
    http_status: 409
    applies_to: "POST /material-shipments/{id}/status-transitions"
  - priority: 17
    category: business_safety
    check: "a reader whose reader_reliability_index is below READER_RELIABILITY_FLOOR = 0.75 may not aggregate a score"
    error_id: ERR_READER_RELIABILITY_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /exam-scores/{id}/status-transitions"
  - priority: 18
    category: business_constraint
    check: "reader_selection must yield at least one eligible reader; an empty eligible pool refuses the aggregation"
    error_id: ERR_NO_ELIGIBLE_READER
    http_status: 409
    applies_to: "POST /exam-scores/{id}/status-transitions, POST /exam-scores"
  - priority: 19
    category: business_referential
    check: "score release requires release_blocked == false; an IrregularityCase in status IN {OPEN, INVESTIGATING} for the registration blocks it"
    error_id: ERR_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /exam-scores/{id}/status-transitions, POST /score-sends"
  - priority: 20
    category: business_temporal
    check: "a score may only be RELEASED when the logical clock is at or after score_release_open for its registration"
    error_id: ERR_SCORE_RELEASE_TOO_EARLY
    http_status: 422
    applies_to: "POST /exam-scores/{id}/status-transitions"
  - priority: 21
    category: business_temporal
    check: "a cancellation or withholding request is refused once the logical clock passes the cancellation deadline 2027-07-31T23:59:59Z"
    error_id: ERR_CANCELLATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /exam-scores/{id}/status-transitions, POST /score-cancellations"
  - priority: 22
    category: business_constraint
    check: "an alternate-exam request may only be approved when its buffered interval does not collide and the same-day cap ALT_CONCURRENT_CAP = 2 is respected"
    error_id: ERR_ALT_SEAT_CONFLICT
    http_status: 409
    applies_to: "POST /alternate-exam-requests/{id}/status-transitions"
  - priority: 23
    category: business_constraint
    check: "an accommodation may only be APPROVED when documentation_completeness >= DOC_COMPLETENESS_THRESHOLD = 3"
    error_id: ERR_DOCUMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/status-transitions"
  - priority: 24
    category: business_fiscal
    check: "a registration may only reach CONFIRMED when fees_paid_cents >= late_fee_cents"
    error_id: ERR_LATE_FEE_UNPAID
    http_status: 402
    applies_to: "POST /exam-registrations/{id}/status-transitions"
  - priority: 25
    category: business_fiscal
    check: "a ScoreSend may only be dispatched when its fee_cents has been settled"
    error_id: ERR_SEND_FEE_UNPAID
    http_status: 402
    applies_to: "POST /score-sends/{id}/status-transitions"
  - priority: 26
    category: business_fiscal
    check: "a new COLLEGE ScoreSend is refused when the school's designation_slots_used has reached DESIGNATION_SLOT_BUDGET = 8 for the administration year"
    error_id: ERR_DESIGNATION_SLOTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /score-sends"
  - priority: 27
    category: business_constraint
    check: "attempting a status transition with a stale expected_<entity>_version is rejected per §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /course-audits/{id}/status-transitions, POST /exam-orders/{id}/status-transitions, POST /exam-scores/{id}/status-transitions, POST /alternate-exam-requests/{id}/status-transitions"
  - priority: 28
    category: business_constraint
    check: "school_code, center_code, student_code (within a school) and carrier_tracking_id are unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /schools, POST /students, POST /material-shipments"
  - priority: 29
    category: business_constraint
    check: "required fields are present and enum-valued fields carry a declared enum member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

endpoints:
  - method: POST
    path: "/ap-program/schools"
    description: "Register a school; mints center_code when supplied; the school starts with program_label_authorized=false and test_center_status=ACTIVE"
    roles: [PlatformAdmin]
    code: 201
    input: [name, school_code, country_code, center_code, seat_capacity, "seal_required?"]
    output: School
    side_effects: []
  - method: GET
    path: "/ap-program/schools/{id}"
    description: "Read one school"
    roles: [PlatformAdmin, SchoolCoordinator, IntegrityInvestigator]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: POST
    path: "/ap-program/schools/{id}/status-transitions"
    description: "Single state-transition endpoint for the School test-center dimension; the to_status field selects ACTIVE, SUSPENDED or RETIRED and the machine in §1.2 validates it"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status, expected_school_version, "finding_code?"]
    output: School
    side_effects: ["apply the §1.2 School transition side effects", "increment School.version by 1"]
  - method: GET
    path: "/ap-program/schools/{id}/course-audits"
    description: "Reverse-reachability read: all course audits of a school"
    roles: [PlatformAdmin, SchoolCoordinator, CourseAuditReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: CourseAudit[]
    side_effects: []
  - method: POST
    path: "/ap-program/course-audits"
    description: "Submit a syllabus for program designation; the audit opens in SUBMITTED"
    roles: [SchoolCoordinator]
    code: 201
    input: [school_id, course_title, syllabus_hash, submitted_by_user_id]
    output: CourseAudit
    side_effects: []
  - method: GET
    path: "/ap-program/course-audits"
    description: "List course audits with status filtering"
    roles: [PlatformAdmin, SchoolCoordinator, CourseAuditReviewer]
    code: 200
    input: ["limit?", "offset?", "school_id?", "status?"]
    output: CourseAudit[]
    side_effects: []
  - method: POST
    path: "/ap-program/course-audits/{id}/status-transitions"
    description: "Single state-transition endpoint for the course-audit machine; to_status selects IN_REVIEW, REVISION_REQUESTED, SUBMITTED, APPROVED or REJECTED and each branch carries its own side-effect set"
    roles: [CourseAuditReviewer, SchoolCoordinator]
    code: 200
    input: [to_status, expected_course_audit_version, "decision_notes?", "syllabus_hash?"]
    output: CourseAudit
    side_effects: ["apply the §1.2 CourseAudit transition side effects including the DRAFT-order cascade on APPROVED", "increment CourseAudit.version by 1"]
  - method: POST
    path: "/ap-program/students"
    description: "Enroll a student at a school of record"
    roles: [SchoolCoordinator]
    code: 201
    input: [full_name, school_id, student_code, grade_level]
    output: Student
    side_effects: []
  - method: GET
    path: "/ap-program/students/{id}/accommodation-requests"
    description: "Reverse-reachability read: all accommodation requests of a student"
    roles: [PlatformAdmin, SchoolCoordinator, AccommodationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []
  - method: POST
    path: "/ap-program/exam-orders"
    description: "Create a draft exam order for an approved course audit; recomputes school.accrued_fee_cents"
    roles: [SchoolCoordinator]
    code: 201
    input: [school_id, course_audit_id, administration_year]
    output: ExamOrder
    side_effects: ["recompute school.accrued_fee_cents", "increment School.version by 1"]
  - method: GET
    path: "/ap-program/exam-orders/{id}"
    description: "Read one exam order including order_fee_cents and unused_exam_charge_cents"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: []
    output: ExamOrder
    side_effects: []
  - method: POST
    path: "/ap-program/exam-orders/{id}/status-transitions"
    description: "Single state-transition endpoint for the exam-order machine; to_status selects OPEN, SUBMITTED, MATERIALS_SHIPPED, MATERIALS_RECEIVED, DELIVERED or VOIDED"
    roles: [SchoolCoordinator, PlatformAdmin]
    code: 200
    input: [to_status, expected_exam_order_version]
    output: ExamOrder
    side_effects: ["apply the §1.2 ExamOrder transition side effects and recompute order_fee_cents / unused_exam_charge_cents where the branch requires it", "increment ExamOrder.version by 1"]
  - method: GET
    path: "/ap-program/exam-orders/{id}/registrations"
    description: "Reverse-reachability read: all registrations of an order"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamRegistration[]
    side_effects: []
  - method: GET
    path: "/ap-program/exam-orders/{id}/material-shipments"
    description: "Reverse-reachability read: all material shipments covering an order"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamMaterialShipment[]
    side_effects: []
  - method: POST
    path: "/ap-program/exam-registrations"
    description: "Register a student for one exam within an order; assesses the registration tier from the ordering window"
    roles: [SchoolCoordinator]
    code: 201
    input: [exam_order_id, student_id, exam_subject, "registration_tier?"]
    output: ExamRegistration
    side_effects: ["recompute exam_order.registration_count", "assess late_fee_cents and refundable_cents per calculation late_order_fee", "increment ExamOrder.version by 1"]
  - method: POST
    path: "/ap-program/exam-registrations/{id}/status-transitions"
    description: "Single state-transition endpoint for the registration machine; to_status selects FEE_PENDING, REGISTERED, CONFIRMED, MATERIAL_ASSIGNED, SCORED, SCORE_RELEASED, CANCELLED or INVALIDATED; fee_waived=true is required for the FEE_PENDING revert"
    roles: [SchoolCoordinator, PlatformAdmin]
    code: 200
    input: [to_status, "fee_waived?"]
    output: ExamRegistration
    side_effects: ["apply the §1.2 ExamRegistration transition side effects", "recompute exam_order.registration_count and increment ExamOrder.version by 1 where the branch requires it"]
  - method: POST
    path: "/ap-program/exam-registrations/{id}/fees"
    description: "Settle or waive the assessed fees of one registration; settles late_fee_cents first, then the base exam fee, and exposes refundable_cents"
    roles: [SchoolCoordinator, PlatformAdmin]
    code: 200
    input: [fees_paid_cents, "fee_waived?"]
    output: ExamRegistration
    side_effects: ["raise fees_paid_cents and recompute refundable_cents", "clear ERR_LATE_FEE_UNPAID gating for a CONFIRMED transition"]
  - method: GET
    path: "/ap-program/exam-registrations/{id}/alternate-exam-requests"
    description: "Reverse-reachability read: alternate-exam requests filed for a registration"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: AlternateExamRequest[]
    side_effects: []
  - method: GET
    path: "/ap-program/exam-registrations/{id}/exam-scores"
    description: "Reverse-reachability read: the score rows of a registration"
    roles: [PlatformAdmin, ScoringSpecialist, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamScore[]
    side_effects: []
  - method: GET
    path: "/ap-program/exam-registrations/{id}/irregularity-cases"
    description: "Reverse-reachability read: irregularity cases opened against a registration"
    roles: [IntegrityInvestigator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: IrregularityCase[]
    side_effects: []
  - method: POST
    path: "/ap-program/accommodation-requests"
    description: "File an accommodation request with documentation for a student and exam subject"
    roles: [SchoolCoordinator]
    code: 201
    input: [student_id, exam_subject, accommodation_type, documentation_completeness, submitted_by_user_id]
    output: AccommodationRequest
    side_effects: []
  - method: POST
    path: "/ap-program/accommodation-requests/{id}/status-transitions"
    description: "Single state-transition endpoint for the accommodation machine; to_status selects UNDER_DOC_REVIEW, INFO_REQUESTED, SUBMITTED, APPROVED, DENIED or REVOKED; documentation_completeness carries the updated count on a SUBMITTED revision"
    roles: [AccommodationReviewer, SchoolCoordinator]
    code: 200
    input: [to_status, "documentation_completeness?", "expected_accommodation_request_version?"]
    output: AccommodationRequest
    side_effects: ["apply the §1.2 AccommodationRequest transition side effects including the REGISTERED->CONFIRMED cascade on APPROVED", "increment AccommodationRequest.version by 1"]
  - method: POST
    path: "/ap-program/alternate-exam-requests"
    description: "File an alternate-exam request for a registration with a reason code and separate form code"
    roles: [SchoolCoordinator]
    code: 201
    input: [exam_registration_id, alternate_date_utc, reason_code, form_code]
    output: AlternateExamRequest
    side_effects: []
  - method: POST
    path: "/ap-program/alternate-exam-requests/{id}/status-transitions"
    description: "Single state-transition endpoint for the alternate-exam machine; to_status selects UNDER_REVIEW, APPROVED, SCHEDULED, FILED, DENIED or WITHDRAWN; alternate_date_utc is required for the APPROVED->FILED refile"
    roles: [SchoolCoordinator, PlatformAdmin]
    code: 200
    input: [to_status, expected_alternate_exam_request_version, "alternate_date_utc?"]
    output: AlternateExamRequest
    side_effects: ["apply the §1.2 AlternateExamRequest transition side effects", "increment AlternateExamRequest.version by 1"]
  - method: POST
    path: "/ap-program/material-shipments"
    description: "Create a secure material shipment for an exam order and school test center"
    roles: [PlatformAdmin]
    code: 201
    input: [school_id, exam_order_id, carrier_tracking_id, seal_number]
    output: ExamMaterialShipment
    side_effects: []
  - method: GET
    path: "/ap-program/material-shipments/{id}"
    description: "Read one shipment including seal_verified and storage_checkpoint_count"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: []
    output: ExamMaterialShipment
    side_effects: []
  - method: POST
    path: "/ap-program/material-shipments/{id}/status-transitions"
    description: "Single state-transition endpoint for the custody machine; to_status selects DISPATCHED, IN_TRANSIT, RECEIVED, SEAL_BROKEN or RETURNED; seal_intact carries the physical seal observation"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: [to_status, "seal_intact?"]
    output: ExamMaterialShipment
    side_effects: ["append the matching custody event to exam_material_shipment.custody_event_types and recompute custody_sequence_count", "apply the §1.2 ExamMaterialShipment transition side effects", "increment ExamMaterialShipment.version by 1"]
  - method: POST
    path: "/ap-program/material-shipments/{id}/custody-events"
    description: "Append a chain-of-custody event such as a storage checkpoint or transit scan; stamping of occurred_at_utc uses the logical clock"
    roles: [SchoolCoordinator, PlatformAdmin]
    code: 201
    input: [event_type, seal_intact]
    output: "{ custody_sequence: integer, event_type: string, seal_intact: boolean, occurred_at_utc: string }"
    side_effects: ["increment ExamMaterialShipment.storage_checkpoint_count when event_type == STORAGE_CHECKPOINT"]
  - method: POST
    path: "/ap-program/readers"
    description: "Recruit a scoring reader with subject expertise; the reader opens in RECRUITED"
    roles: [ScoringSpecialist]
    code: 201
    input: [full_name, subject_expertise]
    output: Reader
    side_effects: []
  - method: POST
    path: "/ap-program/readers/{id}/status-transitions"
    description: "Single state-transition endpoint for the reader machine; to_status selects CALIBRATING, CALIBRATED, RECRUITED, DEMOTED or INACTIVE; calibration_sample_count, calibration_agreement_rate and calibration_index carry the latest calibration pass"
    roles: [ScoringSpecialist, PlatformAdmin]
    code: 200
    input: [to_status, "calibration_sample_count?", "calibration_agreement_rate?", "calibration_index?"]
    output: Reader
    side_effects: ["apply the §1.2 Reader transition side effects including reassignment of RUBRIC_PENDING scores on DEMOTED", "increment Reader.version by 1"]
  - method: POST
    path: "/ap-program/exam-scores"
    description: "Create the score row for a material-assigned registration; reader_id is resolved by calculation reader_selection when omitted"
    roles: [ScoringSpecialist]
    code: 201
    input: [exam_registration_id, raw_composite, "reader_id?"]
    output: ExamScore
    side_effects: ["resolve reader_id via calculation reader_selection", "increment the selected Reader.assigned_score_count"]
  - method: POST
    path: "/ap-program/exam-scores/{id}/status-transitions"
    description: "Single state-transition endpoint for the score machine; to_status selects RUBRIC_PENDING, AGGREGATED, RELEASED, WITHHELD, CANCELLED or INVALIDATED; request_withholding and request_cancellation flags record the student request the transition requires"
    roles: [ScoringSpecialist, PlatformAdmin]
    code: 200
    input: [to_status, expected_exam_score_version, "request_withholding?", "request_cancellation?"]
    output: ExamScore
    side_effects: ["apply the §1.2 ExamScore transition side effects including cascade to ScoreSend rows", "increment ExamScore.version by 1"]
  - method: POST
    path: "/ap-program/score-sends"
    description: "Designate a recipient for a released score; computes fee_cents per calculation score_send_fee_dual_variant"
    roles: [ScoringSpecialist, SchoolCoordinator]
    code: 201
    input: [exam_score_id, recipient_type, recipient_code, designation_year]
    output: ScoreSend
    side_effects: ["compute fee_cents via calculation score_send_fee_dual_variant", "recompute school.designation_slots_used", "increment School.version by 1"]
  - method: POST
    path: "/ap-program/score-sends/{id}/status-transitions"
    description: "Single state-transition endpoint for the send machine; to_status selects SENT, ACKNOWLEDGED, CANCELLED or FAILED"
    roles: [ScoringSpecialist, SchoolCoordinator, PlatformAdmin]
    code: 200
    input: [to_status, "fees_paid_cents?"]
    output: ScoreSend
    side_effects: ["apply the §1.2 ScoreSend transition side effects", "recompute school.designation_slots_used on CANCELLED", "increment ScoreSend.version by 1"]
  - method: POST
    path: "/ap-program/irregularity-cases"
    description: "Open a testing-irregularity investigation against a registration and school; the case opens in OPEN and blocks score release from OPEN onwards"
    roles: [IntegrityInvestigator, PlatformAdmin]
    code: 201
    input: [exam_registration_id, school_id, irregularity_type]
    output: IrregularityCase
    side_effects: ["set ExamScore.release_blocked := true for every AGGREGATED or RELEASED score of the registration"]
  - method: POST
    path: "/ap-program/irregularity-cases/{id}/status-transitions"
    description: "Single state-transition endpoint for the investigation machine; to_status selects INVESTIGATING, DECISION_PENDING, CONFIRMED, DISMISSED or APPEALED; finding_code is required for DECISION_PENDING"
    roles: [IntegrityInvestigator, SchoolCoordinator]
    code: 200
    input: [to_status, "finding_code?", "reporter_user_id?"]
    output: IrregularityCase
    side_effects: ["apply the §1.2 IrregularityCase transition side effects including the depth-3 invalidation cascade", "increment IrregularityCase.version by 1"]
  - method: POST
    path: "/ap-program/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the logical clock. The server's startup default logical clock is exactly 2026-09-01T00:00:00Z and every window, deadline, expiry and release rule reads this clock, never wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance the logical clock, which can trigger time-driven transitions such as CourseAudit APPROVED -> EXPIRED"]

  - method: GET
    path: "/ap-program/students"
    description: "List students with school, grade and code filtering; also the reverse-reachability read from School"
    roles: [PlatformAdmin, SchoolCoordinator, AccommodationReviewer]
    code: 200
    input: ["limit?", "offset?", "school_id?", "grade_level?", "student_code?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/ap-program/score-sends"
    description: "List score sends with recipient-type, score and status filtering; the recipient include-set used by calculation score_send_fee_dual_variant is read from this list"
    roles: [ScoringSpecialist, PlatformAdmin, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?", "exam_score_id?", "recipient_type?", "status?"]
    output: ScoreSend[]
    side_effects: []

  - method: POST
    path: "/ap-program/students/{id}/status-transitions"
    description: "Set the student enrollment dimension; to_status selects ACTIVE (enrolled := true) or INACTIVE (enrolled := false) and is the only way to change Student.enrolled after creation"
    roles: [SchoolCoordinator]
    code: 200
    input: [to_status, "expected_student_version?"]
    output: Student
    side_effects: ["set Student.enrolled from to_status", "increment Student.version by 1"]
  - method: GET
    path: "/ap-program/exam-registrations/{id}"
    description: "Read one registration including late_fee_cents, refundable_cents, fees_paid_cents and accommodation_flag"
    roles: [PlatformAdmin, SchoolCoordinator, SchoolStudent]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: []
  - method: GET
    path: "/ap-program/students/{id}/registrations"
    description: "Reverse-reachability read: every registration of one student across all orders"
    roles: [PlatformAdmin, SchoolCoordinator, SchoolStudent]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamRegistration[]
    side_effects: []
  - method: GET
    path: "/ap-program/exam-scores/{id}"
    description: "Read one score including ap_score, release_blocked, reader_reliability_index and raw_composite"
    roles: [PlatformAdmin, ScoringSpecialist, SchoolCoordinator]
    code: 200
    input: []
    output: ExamScore
    side_effects: []
  - method: GET
    path: "/ap-program/score-sends/{id}"
    description: "Read one score send including fee_cents and credit_back_cents"
    roles: [PlatformAdmin, ScoringSpecialist, SchoolCoordinator]
    code: 200
    input: []
    output: ScoreSend
    side_effects: []
  - method: GET
    path: "/ap-program/accommodation-requests/{id}"
    description: "Read one accommodation request including the computed extended_time_multiplier and the provisioning numbers"
    roles: [PlatformAdmin, SchoolCoordinator, AccommodationReviewer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []
  - method: GET
    path: "/ap-program/readers/{id}"
    description: "Read one reader including calibration_index, reliability_index, load_status and assigned_score_count"
    roles: [PlatformAdmin, ScoringSpecialist, Reader]
    code: 200
    input: []
    output: Reader
    side_effects: []
  - method: GET
    path: "/ap-program/readers/{id}/calibration-summary"
    description: "Computed read returning the reader's calibration numbers side by side: { calibration_index, reliability_index, calibration_round_count, load_status, pass_threshold_met }"
    roles: [PlatformAdmin, ScoringSpecialist, Reader]
    code: 200
    input: []
    output: "{ calibration_index: number, reliability_index: number, calibration_round_count: integer, load_status: string, pass_threshold_met: boolean }"
    side_effects: []
  - method: GET
    path: "/ap-program/irregularity-cases"
    description: "List irregularity cases with registration and status filtering; also the reverse-reachability read from ExamRegistration"
    roles: [IntegrityInvestigator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "exam_registration_id?", "status?"]
    output: IrregularityCase[]
    side_effects: []

  - method: GET
    path: "/ap-program/students/{id}"
    description: "Read one student including accommodation_eligible and enrolled"
    roles: [PlatformAdmin, SchoolCoordinator, AccommodationReviewer, SchoolStudent]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/ap-program/exam-orders"
    description: "List exam orders with school, course-audit and status filtering; also the reverse-reachability read for ExamOrder.school_id and ExamOrder.course_audit_id"
    roles: [PlatformAdmin, SchoolCoordinator]
    code: 200
    input: ["limit?", "offset?", "school_id?", "course_audit_id?", "status?"]
    output: ExamOrder[]
    side_effects: []
  - method: GET
    path: "/ap-program/readers/{id}/exam-scores"
    description: "Reverse-reachability read: every score row assigned to one reader"
    roles: [PlatformAdmin, ScoringSpecialist, Reader]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamScore[]
    side_effects: []
  - method: GET
    path: "/ap-program/schools/{id}/irregularity-cases"
    description: "Reverse-reachability read: every irregularity case hosted at one school test center"
    roles: [PlatformAdmin, IntegrityInvestigator]
    code: 200
    input: ["limit?", "offset?"]
    output: IrregularityCase[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or the role is entity_backed and X-User-ID does not match an existing instance of the backing entity"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the user recorded as submitter or reporter of the record under review"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "the path resource id does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign-key field in the payload does not resolve to an existing row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the entity's current status is not a valid from-state for the requested to_status"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the entity sits in one of its terminal_states and admits no further transition"
  - id: ERR_AUDIT_NOT_REVIEWED
    http: 409
    condition: "CourseAudit decision requested with review_round == 0 or empty decision_notes"
  - id: ERR_COURSE_AUDIT_NOT_APPROVED
    http: 422
    condition: "ExamOrder enters OPEN while its CourseAudit is not APPROVED or school.program_label_authorized == false"
  - id: ERR_ORDER_WINDOW_CLOSED
    http: 422
    condition: "registration or submission attempted while ordering_window_classification is CLOSED or NOT_OPEN"
  - id: ERR_MAX_EXAMS_EXCEEDED
    http: 422
    condition: "a student already holds MAX_EXAMS_PER_STUDENT = 9 registrations for the administration year"
  - id: ERR_ORDER_MIN_SIZE
    http: 422
    condition: "ExamOrder enters SUBMITTED with registration_count below MIN_ORDER_SIZE = 1"
  - id: ERR_ORDER_CAPACITY
    http: 422
    condition: "the resulting registration_count would exceed MAX_EXAMINEES_PER_ORDER = 500"
  - id: ERR_SEAL_VERIFICATION_FAILED
    http: 409
    condition: "a shipment with school.seal_required == true is RECEIVED while the reported seal is not intact"
  - id: ERR_CUSTODY_CHAIN_GAP
    http: 409
    condition: "the custody_event_types chain has a missing or duplicated custody_sequence at RECEIVED or RETURNED"
  - id: ERR_READER_RELIABILITY_BELOW_FLOOR
    http: 409
    condition: "a score is aggregated while reader_reliability_index < READER_RELIABILITY_FLOOR = 0.75"
  - id: ERR_NO_ELIGIBLE_READER
    http: 409
    condition: "calculation reader_selection yields an empty eligible pool for the exam subject"
  - id: ERR_RELEASE_BLOCKED
    http: 409
    condition: "score release or score send attempted while ExamScore.release_blocked == true"
  - id: ERR_SCORE_RELEASE_TOO_EARLY
    http: 422
    condition: "release attempted while the logical clock is before score_release_open for the registration"
  - id: ERR_CANCELLATION_DEADLINE_PASSED
    http: 422
    condition: "a cancellation or withholding request arrives after 2027-07-31T23:59:59Z"
  - id: ERR_ALT_SEAT_CONFLICT
    http: 409
    condition: "a buffered alternate interval collides with an existing block or exceeds the merged-minute budget, or the same-day cap ALT_CONCURRENT_CAP = 2 is exceeded"
  - id: ERR_DOCUMENTS_INCOMPLETE
    http: 422
    condition: "accommodation APPROVED while documentation_completeness < DOC_COMPLETENESS_THRESHOLD = 3"
  - id: ERR_LATE_FEE_UNPAID
    http: 402
    condition: "ExamRegistration enters CONFIRMED while fees_paid_cents < late_fee_cents"
  - id: ERR_SEND_FEE_UNPAID
    http: 402
    condition: "ScoreSend enters SENT while its fee_cents has not been settled"
  - id: ERR_DESIGNATION_SLOTS_EXHAUSTED
    http: 422
    condition: "a new COLLEGE score send would push school.designation_slots_used past DESIGNATION_SLOT_BUDGET = 8"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<entity>_version in the payload does not equal the entity's current version per §1.2.1"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "school_code, center_code, student_code within a school, or carrier_tracking_id already exists"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a numeric field is out of its declared range, or an enum field carries an undeclared member"
  - id: ERR_SYLLABUS_UNCHANGED
    http: 409
    condition: "a CourseAudit revision submits a syllabus_hash identical to the previous submission"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "an irregularity appeal is filed after the later of case-confirmation plus 30 days and 2027-08-15T23:59:59Z"
  - id: ERR_NO_ALTERNATE_FORM
    http: 409
    condition: "an alternate-exam request is scheduled while form_code does not resolve to an available alternate form for the subject"
  - id: ERR_ACCOMMODATION_PROVISION_INCOMPLETE
    http: 409
    condition: "a registration with accommodation_flag == true advances to MATERIAL_ASSIGNED or the score to RELEASED before the approved extended_time_multiplier is provisioned"

roles:
  - name: PlatformAdmin
    description: "Program operations administrator; owns cross-school configuration, capacity caps and emergency reversals"
    identity: "opaque"
    exclusive_operations:
      - "POST /schools"
      - "POST /schools/{id}/status-transitions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /exam-orders/{id}/status-transitions"
      - "POST /exam-registrations/{id}/status-transitions"
      - "POST /exam-registrations/{id}/fees"
      - "POST /material-shipments/{id}/status-transitions"
      - "POST /exam-scores/{id}/status-transitions"
      - "POST /score-sends/{id}/status-transitions"
      - "POST /irregularity-cases"
      - "GET /exam-registrations/{id}"
      - "GET /students/{id}/registrations"
      - "GET /exam-scores/{id}"
      - "GET /score-sends/{id}"
      - "GET /accommodation-requests/{id}"
      - "GET /readers/{id}"
      - "GET /irregularity-cases"
      - "GET /ap-program/students/{id}"
      - "GET /ap-program/exam-orders"
      - "GET /ap-program/readers/{id}/exam-scores"
      - "GET /ap-program/schools/{id}/irregularity-cases"
  - name: SchoolCoordinator
    description: "School-side administrator who submits syllabi, orders exams and files student paperwork; the acting X-User-ID identifies the school it acts for"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /course-audits"
      - "POST /students"
      - "POST /students/{id}/status-transitions"
      - "POST /exam-orders"
      - "POST /exam-registrations"
      - "POST /accommodation-requests"
      - "POST /alternate-exam-requests"
      - "POST /score-sends"
    shared_operations:
      - "POST /course-audits/{id}/status-transitions"
      - "POST /exam-orders/{id}/status-transitions"
      - "POST /exam-registrations/{id}/status-transitions"
      - "POST /accommodation-requests/{id}/status-transitions"
      - "POST /alternate-exam-requests/{id}/status-transitions"
      - "POST /material-shipments/{id}/status-transitions"
      - "POST /irregularity-cases/{id}/status-transitions"
      - "POST /score-sends/{id}/status-transitions"
      - "GET /exam-registrations/{id}"
      - "GET /students/{id}/registrations"
      - "GET /exam-scores/{id}"
      - "GET /score-sends/{id}"
      - "GET /accommodation-requests/{id}"
      - "GET /ap-program/students/{id}"
      - "GET /ap-program/exam-orders"
  - name: CourseAuditReviewer
    description: "Curriculum reviewer who decides syllabus audits; opaque because reviewers are not persisted as entities in this surface"
    identity: "opaque"
    exclusive_operations:
      - "POST /course-audits/{id}/status-transitions to_status IN {IN_REVIEW, APPROVED, REJECTED, REVISION_REQUESTED}"
    shared_operations:
      - "GET /course-audits"
      - "GET /schools/{id}/course-audits"
  - name: AccommodationReviewer
    description: "Disability-services reviewer who decides accommodation requests after documentation review"
    identity: "opaque"
    exclusive_operations:
      - "POST /accommodation-requests/{id}/status-transitions to_status IN {UNDER_DOC_REVIEW, APPROVED, DENIED, INFO_REQUESTED, REVOKED}"
    shared_operations:
      - "GET /accommodation-requests/{id}"
      - "GET /students/{id}/accommodation-requests"
      - "GET /ap-program/students/{id}"
  - name: ScoringSpecialist
    description: "Scoring operations staff who recruit and calibrate readers, aggregate scores, release them and dispatch sends"
    identity: "opaque"
    exclusive_operations:
      - "POST /readers"
      - "POST /readers/{id}/status-transitions"
      - "POST /exam-scores"
    shared_operations:
      - "POST /exam-scores/{id}/status-transitions"
      - "GET /readers/{id}/calibration-summary"
      - "GET /readers/{id}"
      - "GET /exam-scores/{id}"
      - "GET /score-sends/{id}"
      - "GET /ap-program/readers/{id}/exam-scores"
  - name: IntegrityInvestigator
    description: "Testing-integrity investigator who opens and decides irregularity cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /irregularity-cases"
      - "POST /irregularity-cases/{id}/status-transitions to_status IN {INVESTIGATING, DECISION_PENDING, CONFIRMED, DISMISSED}"
    shared_operations:
      - "GET /irregularity-cases"
      - "GET /exam-registrations/{id}/irregularity-cases"
      - "GET /ap-program/schools/{id}/irregularity-cases"
  - name: Reader
    description: "Scoring reader; acts only on its own calibration passes"
    identity: "entity_backed:Reader"
    exclusive_operations:
      - "POST /readers/{id}/status-transitions to_status == CALIBRATING when the acting reader is the reader itself"
    shared_operations:
      - "GET /readers/{id}"
      - "GET /readers/{id}/calibration-summary"
      - "GET /ap-program/readers/{id}/exam-scores"
  - name: SchoolStudent
    description: "Student acting on its own records; the acting X-User-ID identifies the student requesting a send, withholding or cancellation"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /score-sends/{id}/status-transitions to_status == CANCELLED when the acting student owns the score"
    shared_operations:
      - "GET /exam-registrations/{id}"
      - "GET /students/{id}/registrations"
      - "GET /ap-program/students/{id}"
