# =============================================================================
# task_0474_musical_instrument_store — SCAFFOLD (§1.0–§1.7)
# Musical Instrument Store (Guitar Center style)
# =============================================================================

scenario: |
  474. Musical Instrument Store (Guitar Center style): inventory (new/used/vintage)
  & serial, rental & rent-to-own (band/orchestra), repair/setup (luthier) ticket,
  lesson-studio linkage, trade-in & consignment, financing, special order, layaway

domain_name: musical-instrument-store
api_prefix: ""

# Primary archetype: Ledger reconciliation — rent-to-own equity accrual vs
#   early-buyout payoff are two valid algorithms over the same payment stream
#   that produce different dollar figures for identical inputs.
# Secondary archetype: Quota / allocation — each InventoryUnit (serial-tracked,
#   quantity 1) is a finite resource competed for by rental, rent-to-own,
#   layaway, special-order fulfillment, and consignment sale; a unit can only
#   be committed to one disposition at a time.
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on InventoryUnit.version (reserve race)
    - dual_variant_calculation      # equity-accrual vs early-buyout payoff
    - cascading_side_effects        # buyout/default/repossess chains across 3 entities
    - rate_threshold_triggers       # rent-to-own equity cap, late-fee accrual

  entity_topology: flat
  # Flat with FK references: InventoryUnit, Customer, and the agreement/ticket
  # entities are peers joined by foreign keys; no nested-ownership URL tree.

  state_machine_shape: branching
  # RentalAgreement forks: ACTIVE → {BOUGHT_OUT, RETURNED, DEFAULTED} with a
  # divergent side-effect set per branch. ConsignmentListing and RepairTicket
  # also branch. No long linear pipelines.

  relationship_patterns:
    - one_to_many        # Customer has many agreements/tickets/orders
    - flat               # FK references across peers
    - cross_aggregate    # RentalAgreement <-> InventoryUnit, LessonEnrollment <-> RentalAgreement

  role_model: peer_roles
  # SalesAssociate (sells/reserves/inventory), Luthier (repair tickets),
  # StoreManager (financing approval, trade-in valuation, write-offs),
  # Customer (entity-backed; views own agreements, makes payments).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Customer ---------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Customers" }
      - { name: credit_score, type: integer, source: input, description: "FICO-style score 300..850; drives financing approval", constraints: "300 <= credit_score <= 850" }
      - { name: store_credit_cents, type: integer, source: computed, description: "Running store-credit balance from trade-ins and consignment payouts; never negative" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- InventoryUnit (serial-tracked, quantity 1) -----------------------------
  - name: InventoryUnit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: model_name, type: string, source: input, description: "Instrument model, e.g. 'Yamaha YAS-280 Alto Sax'" }
      - { name: category, type: enum, source: input, description: "Instrument family", constraints: "one of BAND, ORCHESTRA, GUITAR, KEYBOARD, OTHER" }
      - { name: condition, type: enum, source: input, description: "Stock condition tier", constraints: "one of NEW, USED, VINTAGE" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique among InventoryUnits with the SAME (model_name)" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "What the store paid (purchase, trade-in valuation, or consignment cost basis)", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Outright sale sticker price", constraints: ">= 0" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Rent-to-own / rental monthly rate", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Allocation status of this unit", constraints: "one of AVAILABLE, RESERVED, ON_RENT, ON_LAYAWAY, SOLD, IN_REPAIR, CONSIGNED, RETIRED" }
      - { name: source_kind, type: enum, source: input, description: "How the unit entered stock", default: STORE_PURCHASE, constraints: "one of STORE_PURCHASE, TRADE_IN, CONSIGNMENT" }
      - { name: consignment_listing_id, type: string, source: system, description: "FK -> ConsignmentListing.id; set only when source_kind=CONSIGNMENT, else null" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation; reserve uses expected_inventory_unit_version" }

  # --- RentalAgreement (rental + rent-to-own; the ledger entity) --------------
  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the renter" }
      - { name: inventory_unit_id, type: string, source: input, description: "FK -> InventoryUnit.id; the rented unit (must be RESERVED for this customer)" }
      - { name: plan, type: enum, source: input, description: "Rental product", constraints: "one of RENTAL, RENT_TO_OWN" }
      - { name: monthly_rate_cents, type: integer, source: system, description: "Snapshot of InventoryUnit.monthly_rent_cents at start; immutable for the agreement" }
      - { name: purchase_price_cents, type: integer, source: system, description: "Snapshot of InventoryUnit.list_price_cents at start; the rent-to-own target price; immutable" }
      - { name: equity_rate_pct, type: number, source: input, description: "Fraction of each paid month credited toward purchase (RENT_TO_OWN only)", default: 0.50, constraints: "0 <= equity_rate_pct <= 1; ignored for plan=RENTAL" }
      - { name: equity_cap_pct, type: number, source: input, description: "Max fraction of purchase_price_cents that accrued equity may reach", default: 1.0, constraints: "0 < equity_cap_pct <= 1" }
      - { name: months_paid, type: integer, source: computed, description: "Count of PaymentRecord rows with kind=RENT and status=POSTED on this agreement" }
      - { name: accrued_equity_cents, type: integer, source: computed, description: "Equity credited toward purchase; capped (see §1.3 equity_accrual)" }
      - { name: payoff_quote_cents, type: integer, source: computed, description: "Early-buyout amount = purchase_price - accrued_equity + early_buyout_fee (see §1.3 buyout_payoff)" }
      - { name: late_fee_balance_cents, type: integer, source: computed, description: "Sum of LATE_FEE PaymentRecords (POSTED) minus those waived; never negative" }
      - { name: missed_streak, type: integer, source: computed, description: "Consecutive missed billing cycles since last POSTED rent payment" }
      - { name: status, type: enum, source: system, description: "Agreement lifecycle", constraints: "one of ACTIVE, BOUGHT_OUT, RETURNED, DEFAULTED, REPOSSESSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- PaymentRecord (append-only ledger event on an agreement) ---------------
  - name: PaymentRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the agreement this payment belongs to" }
      - { name: kind, type: enum, source: system, description: "Payment classification", constraints: "one of RENT, LATE_FEE, BUYOUT, REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents; positive = customer pays store, negative = store refunds customer" }
      - { name: billing_cycle_index, type: integer, source: input, description: "Which monthly cycle this RENT payment covers (1-based); null for non-RENT", default: null }
      - { name: status, type: enum, source: system, description: "Ledger status", constraints: "one of POSTED, WAIVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; chronological replay key" }

  # --- LayawayPlan ------------------------------------------------------------
  - name: LayawayPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the layaway holder" }
      - { name: inventory_unit_id, type: string, source: input, description: "FK -> InventoryUnit.id; the held unit (must be RESERVED for this customer)" }
      - { name: total_price_cents, type: integer, source: system, description: "Snapshot of InventoryUnit.list_price_cents at open; immutable" }
      - { name: deposit_cents, type: integer, source: input, description: "Initial non-refundable-on-cancel deposit", constraints: ">= 0" }
      - { name: paid_cents, type: integer, source: computed, description: "deposit_cents + sum of LayawayPayment.amount_cents" }
      - { name: remaining_cents, type: integer, source: computed, description: "total_price_cents - paid_cents; never negative" }
      - { name: restock_fee_pct, type: number, source: input, description: "Fraction of total_price_cents charged as restock fee on cancel", default: 0.10, constraints: "0 <= restock_fee_pct <= 1" }
      - { name: status, type: enum, source: system, description: "Layaway lifecycle", constraints: "one of OPEN, COMPLETED, CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- LayawayPayment (append-only) -------------------------------------------
  - name: LayawayPayment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: layaway_plan_id, type: string, source: input, description: "FK -> LayawayPlan.id; the plan this installment pays into" }
      - { name: amount_cents, type: integer, source: input, description: "Installment amount in cents", constraints: "> 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; chronological key" }

  # --- RepairTicket (luthier) -------------------------------------------------
  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ticket owner" }
      - { name: inventory_unit_id, type: string, source: input, description: "FK -> InventoryUnit.id; the unit under repair (null for customer-owned outside instruments)", default: null }
      - { name: assigned_luthier_id, type: string, source: system, description: "Opaque X-User-ID of the Luthier who claimed the ticket; null until claimed" }
      - { name: labor_hours, type: number, source: input, description: "Estimated labor hours", constraints: ">= 0" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Per-hour labor rate in cents", constraints: ">= 0" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Parts cost in cents", default: 0, constraints: ">= 0" }
      - { name: rush, type: boolean, source: input, description: "Whether rush surcharge applies", default: false }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Repair invoice total (see §1.3 repair_invoice)" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle", constraints: "one of INTAKE, IN_PROGRESS, AWAITING_PARTS, READY, CLOSED, CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- ConsignmentListing -----------------------------------------------------
  - name: ConsignmentListing
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: consignor_id, type: string, source: input, description: "FK -> Customer.id; the person consigning the instrument" }
      - { name: model_name, type: string, source: input, description: "Model of the consigned instrument" }
      - { name: ask_price_cents, type: integer, source: input, description: "Listed sale price", constraints: "> 0" }
      - { name: commission_pct, type: number, source: input, description: "Store's commission fraction on sale", default: 0.20, constraints: "0 <= commission_pct <= 1" }
      - { name: consignor_payout_cents, type: integer, source: computed, description: "Payout to consignor once sold (see §1.3 consignment_settlement); 0 until SOLD" }
      - { name: status, type: enum, source: system, description: "Listing lifecycle", constraints: "one of LISTED, SOLD, WITHDRAWN" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- TradeIn ----------------------------------------------------------------
  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer trading in" }
      - { name: model_name, type: string, source: input, description: "Model of the traded-in instrument" }
      - { name: condition, type: enum, source: input, description: "Assessed condition", constraints: "one of NEW, USED, VINTAGE" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Manager-assessed market value", constraints: ">= 0" }
      - { name: offer_cents, type: integer, source: computed, description: "Store credit offered (see §1.3 tradein_offer)" }
      - { name: resulting_unit_id, type: string, source: system, description: "FK -> InventoryUnit.id; unit minted on ACCEPT; null otherwise" }
      - { name: status, type: enum, source: system, description: "Trade-in lifecycle", constraints: "one of OFFERED, ACCEPTED, DECLINED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- FinancingApplication ---------------------------------------------------
  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the applicant" }
      - { name: special_order_id, type: string, source: input, description: "FK -> SpecialOrder.id; the order being financed", default: null }
      - { name: principal_cents, type: integer, source: input, description: "Amount to finance", constraints: "> 0" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months", constraints: "one of 6, 12, 24, 36" }
      - { name: apr_pct, type: number, source: computed, description: "APR assigned from credit tier (see §1.3 financing_terms)" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortized monthly payment (see §1.3 financing_terms)" }
      - { name: status, type: enum, source: system, description: "Application lifecycle", constraints: "one of SUBMITTED, APPROVED, DENIED, CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- SpecialOrder -----------------------------------------------------------
