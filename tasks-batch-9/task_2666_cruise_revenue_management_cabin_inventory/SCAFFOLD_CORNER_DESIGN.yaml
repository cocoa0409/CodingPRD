      - name: upgrade_chain_length_walks_the_self_referential_hierarchy
        claim_type: topological
        grounds:
          - calculations.upgrade_chain_depth
          - entities.CabinCategory.fields.upgrade_to_category_id
          - validations[priority=17].ERR_UPGRADE_PATH_INVALID
        distinguishing_aspect: |
          The chain length is derived by walking the self-referential edge to its end, so a
          four-deep ladder must produce 3, 2, 1, 0 from the bottom up, and a disconnected
          category sits at 0 without disturbing the ladder. Acyclicity is not checked by cycle
          detection but falls out of the strict tier_rank ordering: pointing at an equal or lower
          tier is ERR_UPGRADE_PATH_INVALID, which also rules out self-reference.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; an empty category table. Categories must be created richest-first because upgrade_to_category_id has to resolve at creation time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /cabin-categories"
              payload: { code: "SUITE", tier_rank: 4, max_occupancy: 4, onboard_spend_lower_per_night_cents: 20000, onboard_spend_upper_per_night_cents: 12000 }
              as: RevenueManager
              captures: { c_suite: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "BALCONY", tier_rank: 3, max_occupancy: 4, onboard_spend_lower_per_night_cents: 14000, onboard_spend_upper_per_night_cents: 9000, upgrade_to_category_id: "${c_suite}" }
              as: RevenueManager
              captures: { c_balc: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000, upgrade_to_category_id: "${c_balc}" }
              as: RevenueManager
              captures: { c_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${c_ov}" }
              as: RevenueManager
              captures: { c_ia: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "SPA", tier_rank: 9, max_occupancy: 2, onboard_spend_lower_per_night_cents: 25000, onboard_spend_upper_per_night_cents: 15000 }
              as: RevenueManager
              captures: { c_spa: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "DOWN", tier_rank: 10, max_occupancy: 2, onboard_spend_lower_per_night_cents: 8000, onboard_spend_upper_per_night_cents: 5000, upgrade_to_category_id: "${c_spa}" }
              as: RevenueManager
              captures: { e1: $.data.error_id }
          assert:
            - "CabinCategory.${c_suite}.upgrade_to_category_id == null and upgrade_chain_length == 0"
            - "CabinCategory.${c_balc}.upgrade_chain_length == 1"
            - "CabinCategory.${c_ov}.upgrade_chain_length == 2"
            - "CabinCategory.${c_ia}.upgrade_chain_length == 3 (the walk terminates at SUITE)"
            - "CabinCategory.${c_spa}.upgrade_chain_length == 0 - a disconnected component, unaffected by the ladder"
            - "the DOWN creation returns HTTP 422 with data.error_id == ERR_UPGRADE_PATH_INVALID because tier_rank 9 is not strictly greater than 10"
            - "GET /cabin-categories returns total_count == 5 - the refused row was not stored"
            - "GET /cabin-categories?upgrade_to_category_id=${c_ov} returns total_count == 1 and that item is ${c_ia}"

      - name: ralbd_gross_and_net_diverge_on_the_same_sailing
        claim_type: variant_divergence
        grounds:
          - calculations.sailing_ralbd.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: ralbd_gross_versus_net_capacity_basis_on_group_held_sailing
          rationale: |
            That §1.8 instance builds a sailing whose lower berths are partly fenced inside a
            tentative group block and asserts both denominators and both quotients from the same
            revenue numerator, including that revenue_alert reads only the NET variant. Testing
            variant divergence again here would duplicate that fixture exactly.

      - name: settlement_reconciles_the_provisional_quote_against_cash
        claim_type: reconciliation
        grounds:
          - calculations.cancellation_settlement.variants
          - state_machines.Booking[PENALTY_ASSESSED -> REFUNDED]
        excluded_because:
          difficulty_instance: settled_cash_retained_equals_final_penalty
          rationale: |
            That §1.8 instance drives cancel-then-settle across a band boundary and asserts the
            reconciliation identity amount_paid_cents - refund_cents == cancellation_penalty_cents
            together with the delta against the never-corrected provisional quote, which is
            exactly the claim this row would make.

  # ===========================================================================
  - section: validations
    instances:

      - name: a_fourth_berth_over_an_empty_third_berth_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13].ERR_BERTH_SEQUENCE_INVALID
          - validations[priority=12].ERR_MAX_OCCUPANCY_EXCEEDED
          - errors[ERR_BERTH_SEQUENCE_INVALID]
        distinguishing_aspect: |
          The two berth-safety rules are distinct and each must raise its own code: selling a
          fourth berth over an empty third is a SEQUENCE violation even though the party of three
          fits the cabin, while a party that simply does not fit, or two adults asked to share a
          single lower berth, is an OCCUPANCY violation. Both are 422, and neither may be
          collapsed into the generic 400.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing BRT-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE."
            - "Three categories are on the sailing, each with its own allotment and a 730..0 fare window: IA (guarantee, max_occupancy 4, lower_berths 2), TRIPLE (max_occupancy 3, lower_berths 2) and SOLO (max_occupancy 2, lower_berths 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "TRIPLE", tier_rank: 2, max_occupancy: 3, lower_berths: 2, onboard_spend_lower_per_night_cents: 10000, onboard_spend_upper_per_night_cents: 6500 }
              as: RevenueManager
              captures: { cat_tri: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "SOLO", tier_rank: 3, max_occupancy: 2, lower_berths: 1, onboard_spend_lower_per_night_cents: 12000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_solo: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "BRT-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_b: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_ia}", physical_cabins: 20, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_b_ia: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_tri}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_solo}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_tri}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 199995, third_berth_fare_cents: 66000, fourth_berth_fare_cents: 50000 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_solo}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 209995, third_berth_fare_cents: 70000, fourth_berth_fare_cents: 55000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_b}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2, third_berth_guests: 0, fourth_berth_guests: 1 }
              as: ReservationAgent
              captures: { e1: $.data.error_id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_tri}", guest_id: "${g_none}", occupancy_adults: 2, third_berth_guests: 1, fourth_berth_guests: 1 }
              as: ReservationAgent
              captures: { e2: $.data.error_id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_solo}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { e3: $.data.error_id }
          assert:
            - "the fourth-over-empty-third booking returns HTTP 422 with data.error_id == ERR_BERTH_SEQUENCE_INVALID (the party of three would otherwise fit IA's four berths)"
            - "the party of four in TRIPLE returns HTTP 422 with data.error_id == ERR_MAX_OCCUPANCY_EXCEEDED (4 > max_occupancy 3)"
            - "the two adults in SOLO return HTTP 422 with data.error_id == ERR_MAX_OCCUPANCY_EXCEEDED (occupancy_adults 2 > lower_berths 1)"
            - "none of the three is HTTP 400 ERR_INVALID_REQUEST - every field value is individually inside its declared range"
            - "GET /bookings?sailing_id=${sail_b} returns total_count == 0, SailingInventory.${inv_b_ia}.booked_cabins == 0 and Guest.${g_none}.bookings_count == 0"

      - name: a_party_of_four_in_a_four_berth_category_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - calculations.booking_fare_buildup
          - calculations.booking_onboard_projection
        distinguishing_aspect: |
          The mirror image of the berth-safety rules: a fully occupied cabin at exactly
          max_occupancy with the berths filled in order must be ACCEPTED, and it exercises the
          upper-berth pricing path that the rejected payloads never reach - the berth tier chosen
          from the lower subtotal alone, the per-berth rounding of the discounted upper fares, and
          the per-guest deposit floor of 25000 * 4 == 100000 beating the 20 percent rule.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing OKB-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 (max_occupancy 4, lower_berths 2) and the 365..120 fare window at base 189995 / third 64997 / fourth 49997."
            - "The guest has prior_sailings_count 0, so no loyalty offer applies, and no promotion is quoted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "OKB-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_o: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_o: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_o}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2, third_berth_guests: 1, fourth_berth_guests: 1 }
              as: ReservationAgent
              captures: { bk_full: $.data.id }
          assert:
            - "HTTP 201 and Booking.${bk_full}.booking_status == OPTION with guest_count == 4"
            - "Booking.${bk_full}.lower_berth_subtotal_cents == 379990 and berth_discount_pct == 0.10 (tier 1 floor 250000 reached, tier 2 floor 400000 not)"
            - "Booking.${bk_full}.third_berth_net_cents == 58497 (round_half_up(64997 * 0.90)) and fourth_berth_net_cents == 44997 (round_half_up(49997 * 0.90))"
            - "Booking.${bk_full}.gross_ticket_cents == 483484 and net_ticket_cents == 483484"
            - "Booking.${bk_full}.deposit_due_cents == 100000 - the per-guest floor 25000 * 4 beats round_half_up(483484 * 0.20) == 96697"
            - "Booking.${bk_full}.projected_onboard_gross_cents == 210000 (7 * (2 * 9000 + 2 * 6000))"
            - "Sailing.${sail_o}.lower_berths_sold == 2, third_berths_sold == 1, fourth_berths_sold == 1, occupancy_pct == 1.00"
            - "Sailing.${sail_o}.ralbd_gross_cents == 495 (693484 / 1400 == 495.345...) and SailingInventory.${inv_o}.available_cabins == 63"

      - name: segregation_of_duties_outranks_the_group_block_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=8].ERR_SEGREGATION_OF_DUTIES
          - validations[priority=10].ERR_GROUP_BLOCK_NOT_TENTATIVE
        excluded_because:
          difficulty_instance: sod_auth_beats_group_block_state_precondition
          rationale: |
            That §1.8 instance already violates priority 8 and priority 10 in the same request -
            the creating agent re-signing an already DEFINITE block - and asserts the 403
            ERR_SEGREGATION_OF_DUTIES rather than the 409, plus the single-violation control cases
            in both directions. This row would restate it.

      - name: group_block_creation_needs_the_whole_hold_free_at_once
        claim_type: aggregate_validation
        grounds:
          - validations[priority=19].ERR_INSUFFICIENT_GROUP_INVENTORY
          - calculations.oversell_availability
          - endpoints[POST /group-blocks]
        distinguishing_aspect: |
          Each individual hold is legal against fresh inventory, but the CUMULATIVE fence is what
          the rule measures: two blocks of two on a five-cabin allotment leave one cabin, so a
          third block of two is refused while a block of one is admitted. The check compares
          request.cabins_held against available_cabins - which already nets out every other block's
          unpicked cabins - so it is an aggregate rule, not a per-row one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AGG-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 5 physical cabins and oversell_allowance 0, so sellable capacity is 5, and a 730..0 fare window at base 50000."
            - "No bookings exist, so inventory_posture is OPEN and the posture gate at priority 18 never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AGG-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_g: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", physical_cabins: 5, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_g: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_g}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_1: $.data.id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Harbour Tours", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "FULL_RELEASE" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_2: $.data.id }
          trigger:
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Overreach Travel", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e1: $.data.error_id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Lastcabin Travel", cabins_held: 1, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_3: $.data.id }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Toolate Travel", cabins_held: 1, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e2: $.data.error_id }
          assert:
            - "before the triggers SailingInventory.${inv_g}.group_held_cabins == 4 and available_cabins == 1"
            - "the block of two returns HTTP 422 with data.error_id == ERR_INSUFFICIENT_GROUP_INVENTORY even though two cabins would have been legal against the empty allotment"
            - "the block of one is created with status TENTATIVE and cabins_held == 1"
            - "the final block of one returns HTTP 422 with data.error_id == ERR_INSUFFICIENT_GROUP_INVENTORY (available_cabins is now 0)"
            - "SailingInventory.${inv_g}.group_held_cabins == 5, booked_cabins == 0, available_cabins == 0, and the identity 5 + 0 == 0 + 0 + 5 holds"
            - "GET /group-blocks?sailing_id=${sail_g} returns total_count == 3 - neither refused block was stored"
            - "Sailing.${sail_g}.available_lower_berth_days_gross == 160 and available_lower_berth_days_net == 120 (10 lower berths fenced by 5 held cabins)"

      - name: oversell_allowance_is_only_legal_on_a_guarantee_category
        claim_type: conditional_validation
        grounds:
          - validations[priority=14].ERR_OVERSELL_NOT_PERMITTED
          - calculations.oversell_availability
          - endpoints[PATCH /sailing-inventories/{id}]
        distinguishing_aspect: |
          The rule is conditional on the CabinCategory's is_guarantee flag, not on the allotment,
          and it fires on both the create and the update path. The subtlety is that allowance 0 is
          always legal on a named category, so the same PATCH body is refused with 2 and accepted
          with 0 - the rule keys on allowance > 0 rather than on the presence of the field.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing CND-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is PLANNED."
            - "Category IA is a guarantee category; category OV is a named one."
            - "The OV allotment is created at allowance 0 and its version is captured as ${ov_v}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "CND-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_c: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_c}", cabin_category_id: "${cat_ov}", physical_cabins: 30, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_ov: $.data.id, ov_v: $.data.version }
          trigger:
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_c}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_ia: $.data.id, ia_v: $.data.version }
            - call: "PATCH /sailing-inventories/${inv_ov}"
              payload: { oversell_allowance: 2, expected_inventory_version: "${ov_v}" }
              as: RevenueManager
              captures: { e1: $.data.error_id }
            - call: "PATCH /sailing-inventories/${inv_ov}"
              payload: { oversell_allowance: 0, expected_inventory_version: "${ov_v}" }
              as: RevenueManager
              captures: { ov_v2: $.data.version }
            - call: "PATCH /sailing-inventories/${inv_ia}"
              payload: { oversell_allowance: 2, expected_inventory_version: "${ia_v}" }
              as: RevenueManager
              captures: { ia_v2: $.data.version }
          assert:
            - "the guarantee allotment is created with HTTP 201, effective_oversell_cabins == 4 and available_cabins == 64"
            - "the PATCH raising the named allotment to 2 returns HTTP 422 with data.error_id == ERR_OVERSELL_NOT_PERMITTED, and it is not a 412 - the version was current"
            - "after that refusal SailingInventory.${inv_ov}.oversell_allowance == 0 and version is still ${ov_v}"
            - "the PATCH setting the named allotment to 0 succeeds with ${ov_v2} == ${ov_v} + 1, effective_oversell_cabins == 0 and available_cabins == 30"
            - "the PATCH lowering the guarantee allotment to 2 succeeds with ${ia_v2} == ${ia_v} + 1, effective_oversell_cabins == 2 and available_cabins == 62"
            - "Sailing.${sail_c}.status is still PLANNED - allotment maintenance does not require an open sailing"

      - name: reviewing_a_block_before_its_review_date_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=16].ERR_REVIEW_DATE_NOT_REACHED
          - validations[priority=16].ERR_REVIEW_DATE_IN_PAST
          - calculations.group_attrition_release
        distinguishing_aspect: |
          Two temporal guards with opposite senses live at the same priority: a review is refused
          while current_utc is strictly before review_date but permitted at exactly that instant
          (the comparison is >=), and a proposed new review date must be strictly AFTER current_utc.
          Reaching the date then makes the attrition release fire for real, so the same call that
          was a 422 becomes a state transition without any other change to the world.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing TMP-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 10 physical cabins / allowance 0 and a 730..0 fare window at base 50000."
            - "A TENTATIVE ATTRITION_50 block holds 4 cabins with picked_up_cabins 0 and review_date 2026-08-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "TMP-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_m: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_m}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_m: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_m}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_m}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_m}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 4, review_date: "2026-08-16T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_m: $.data.id, bv_m: $.data.version }
          trigger:
            - call: "POST /group-blocks/${blk_m}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e1: $.data.error_id }
            - call: "POST /group-blocks/${blk_m}/extend-review"
              payload: { new_review_date: "2026-07-01T00:00:00Z" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
            - call: "POST /group-blocks/${blk_m}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { bv_m2: $.data.version }
          assert:
            - "the early review returns HTTP 422 with data.error_id == ERR_REVIEW_DATE_NOT_REACHED and leaves GroupBlock.${blk_m}.status == TENTATIVE, cabins_held == 4, review_count == 0, version ${bv_m}"
            - "the backdated extension returns HTTP 422 with data.error_id == ERR_REVIEW_DATE_IN_PAST and leaves review_date == 2026-08-16T00:00:00Z with review_extension_count == 0"
            - "at exactly 2026-08-16T00:00:00Z the same review call succeeds - the guard is current_utc >= review_date, inclusive"
            - "GroupBlock.${blk_m}.status == PARTIALLY_RELEASED with cabins_held == 2, released_cabins_total == 2 (floor(4 * 0.5)), review_count == 1 and ${bv_m2} == ${bv_m} + 1"
            - "SailingInventory.${inv_m}.group_held_cabins == 2, released_cabins_total == 2, available_cabins == 8"
            - "Sailing.${sail_m}.available_lower_berth_days_net == 144 (it was 128 while 4 cabins were fenced) and available_lower_berth_days_gross == 160"
            - "no booking existed to promote, so the waitlist selector was a silent no-op"

      - name: a_repeat_guest_promotion_is_refused_for_a_guest_with_no_history
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=17].ERR_PROMO_AUDIENCE_MISMATCH
          - calculations.guest_loyalty_tier
          - calculations.booking_fare_buildup
        distinguishing_aspect: |
          Whether the same promotion may be quoted depends on the state of a DIFFERENT entity -
          the Guest's derived loyalty_tier - so the identical request body succeeds or fails purely
          on who the guest is. Both branches are exercised against one ACTIVE promotion, and the
          successful branch shows the audience gate sits before the money: the discount is applied
          and redemption_count moves only on the admitted booking.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUD-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 and the 365..120 fare window at base 189995."
            - "Promotion REPEATONLY (audience REPEAT_GUEST, discount_pct 0.10, window 2026-08-01..2026-08-20, max_redemptions 5) has been activated and is ACTIVE with redemption_count 0."
            - "Nell has prior_sailings_count 0 (loyalty_tier NONE); Gil has prior_sailings_count 3 (loyalty_tier GOLD, repeat_guest_offer_pct 0.03)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUD-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_a: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_a}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_a}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_a}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { v_a_open: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_a}", code: "REPEATONLY", audience: "REPEAT_GUEST", discount_pct: 0.10, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-20T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${v_a_open}" }
              as: RevenueManager
              captures: { promo_a: $.data.id }
            - call: "POST /promotions/${promo_a}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Nell Newman", email: "nell@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_nell: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Gil Gold", email: "gil@example.com", prior_sailings_count: 3 }
              as: ReservationAgent
              captures: { g_gil: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_a}", cabin_category_id: "${cat_ia}", guest_id: "${g_nell}", occupancy_adults: 2, promotion_id: "${promo_a}" }
              as: ReservationAgent
              captures: { e1: $.data.error_id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_a}", cabin_category_id: "${cat_ia}", guest_id: "${g_gil}", occupancy_adults: 2, promotion_id: "${promo_a}" }
              as: ReservationAgent
              captures: { bk_gil: $.data.id }
          assert:
            - "Nell's booking returns HTTP 422 with data.error_id == ERR_PROMO_AUDIENCE_MISMATCH because Guest.${g_nell}.loyalty_tier == NONE"
            - "after that refusal Promotion.${promo_a}.redemption_count == 0 and Guest.${g_nell}.bookings_count == 0"
            - "Gil's identical request succeeds with HTTP 201 - the only difference is the guest's derived tier"
            - "Booking.${bk_gil}.promo_discount_cents == 37999 (round_half_up(379990 * 0.10))"
            - "Booking.${bk_gil}.loyalty_discount_cents == 10260 (round_half_up((379990 - 37999) * 0.03))"
            - "Booking.${bk_gil}.net_ticket_cents == 331731 and deposit_due_cents == 66346"
            - "Promotion.${promo_a}.redemption_count == 1 and status is still ACTIVE (max_redemptions 5 not reached)"
            - "GET /bookings?promotion_id=${promo_a} returns total_count == 1"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: cabin_category_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /cabin-categories]
          - endpoints[GET /cabin-categories/{id}]
          - endpoints[GET /cabin-categories]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          CabinCategory is the only fleet-level catalogue entity and its CRUD surface is
          deliberately partial: create, read one, list with three independent filters, and NO
          update or delete verb at all. The round trip must show that every stored field comes back
          unchanged on the single read, that each filter selects on its own field, and that
          limit/offset split the same collection into complementary pages carrying total_count and
          has_more.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. No categories exist yet."
            - "Three categories are created richest-first so each upgrade target already exists: BALCONY (tier_rank 3), OV (tier_rank 2, upgrade_to BALCONY) and IA (tier_rank 1, guarantee, upgrade_to OV)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /cabin-categories"
              payload: { code: "BALCONY", tier_rank: 3, max_occupancy: 4, onboard_spend_lower_per_night_cents: 13000, onboard_spend_upper_per_night_cents: 8000 }
              as: RevenueManager
              captures: { cat_bal: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000, upgrade_to_category_id: "${cat_bal}" }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${cat_ov}" }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "GET /cabin-categories/${cat_ia}"
              payload: {}
              as: ReservationAgent
            - call: "GET /cabin-categories"
              payload: { is_guarantee: true }
              as: Guest
            - call: "GET /cabin-categories"
              payload: { upgrade_to_category_id: "${cat_ov}" }
              as: GroupSalesAgent
            - call: "GET /cabin-categories"
              payload: { code: "OV" }
              as: PortOpsCoordinator
            - call: "GET /cabin-categories"
              payload: { limit: 2, offset: 0 }
              as: RevenueManager
            - call: "GET /cabin-categories"
              payload: { limit: 2, offset: 2 }
              as: RevenueManager
          assert:
            - "each create returns HTTP 201 with response_type object and a data object carrying id, created_at, updated_at and version == 1"
            - "GET /cabin-categories/${cat_ia} returns every field exactly as the create response did: code IA, tier_rank 1, is_guarantee true, lower_berths 2, max_occupancy 4, onboard_spend_lower_per_night_cents 9000, onboard_spend_upper_per_night_cents 6000, upgrade_to_category_id ${cat_ov} and the same upgrade_chain_length the create returned"
            - "the read is performed by a ReservationAgent and still succeeds - the catalogue is readable by all five roles"
            - "GET /cabin-categories?is_guarantee=true returns total_count == 1 containing only ${cat_ia}"
            - "GET /cabin-categories?upgrade_to_category_id=${cat_ov} returns total_count == 1 containing only ${cat_ia} - the filter matches the edge, not the node"
            - "GET /cabin-categories?code=OV returns total_count == 1 containing only ${cat_ov}"
            - "the limit 2 / offset 0 page returns 2 rows with total_count == 3 and has_more == true; the limit 2 / offset 2 page returns 1 row with total_count == 3 and has_more == false"
            - "the two pages together contain exactly the three created ids with no duplicate and no omission"
            - "no PATCH or DELETE verb is declared for /cabin-categories/{id} - the catalogue is append-only by design"

      - name: withdraw_closes_a_promotion_on_both_paths
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /promotions/{id}/withdraw]
          - state_machines.Promotion[SCHEDULED -> WITHDRAWN]
          - state_machines.Promotion[ACTIVE -> WITHDRAWN]
          - validations[priority=20].ERR_PROMOTION_NOT_ACTIVE
          - validations[priority=10].ERR_PROMOTION_NOT_SCHEDULED
        distinguishing_aspect: |
          One action endpoint serves two source states and must apply the same side effects from
          both, including the explicit no-repricing rule: a booking that already pinned the
          discount keeps it after the promotion is withdrawn, while a new booking quoting the dead
          promotion is refused on the fiscal gate rather than the state gate. Re-activating a
          withdrawn promotion is a 409 on the state precondition and re-withdrawing it is the other
          409, so the two closure codes are told apart.
        test_recipe:
          setup:
            - "Clock at 2026-08-13T00:00:00Z; sailing WDR-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 and the 365..120 fare window at base 189995 (booked_days_to_sail is 150)."
            - "Promotion EARLYBIRD covers 2026-08-01..2026-08-05 and is left SCHEDULED; promotion AUGUSTGA covers 2026-08-13..2026-08-20, so the two closed intervals are 8 whole days apart and the 7-day cadence gap holds."
            - "AUGUSTGA is activated and one booking pins its 10 percent discount."
            - "Each POST /promotions bumps Sailing.version, so the sailing version is re-read before the second promotion is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "WDR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_w: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_w}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_w}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_w}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { wv1: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_w}", code: "EARLYBIRD", audience: "GENERAL", discount_pct: 0.15, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-05T00:00:00Z", max_redemptions: 10, expected_sailing_version: "${wv1}" }
              as: RevenueManager
              captures: { promo_early: $.data.id, pev1: $.data.version }
            - call: "GET /sailings/${sail_w}"
              payload: {}
              as: RevenueManager
              captures: { wv2: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_w}", code: "AUGUSTGA", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-13T00:00:00Z", ends_on: "2026-08-20T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${wv2}" }
              as: RevenueManager
              captures: { promo_aug: $.data.id }
            - call: "POST /promotions/${promo_aug}/activate"
              payload: {}
              as: RevenueManager
              captures: { pav1: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Nell Newman", email: "nell@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_nell: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ike Ito", email: "ike@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ike: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_w}", cabin_category_id: "${cat_ia}", guest_id: "${g_nell}", occupancy_adults: 2, promotion_id: "${promo_aug}" }
              as: ReservationAgent
              captures: { bk_nell: $.data.id }
          trigger:
            - call: "POST /promotions/${promo_early}/withdraw"
              payload: { reason: "CALENDAR_REPLACED" }
              as: RevenueManager
              captures: { pev2: $.data.version }
            - call: "POST /promotions/${promo_aug}/withdraw"
              payload: { reason: "MARGIN_PROTECTION" }
              as: RevenueManager
              captures: { pav2: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_w}", cabin_category_id: "${cat_ia}", guest_id: "${g_ike}", occupancy_adults: 2, promotion_id: "${promo_aug}" }
              as: ReservationAgent
              captures: { e1: $.data.error_id }
            - call: "POST /promotions/${promo_aug}/activate"
              payload: {}
              as: RevenueManager
              captures: { e2: $.data.error_id }
            - call: "POST /promotions/${promo_aug}/withdraw"
              payload: { reason: "DOUBLE_WITHDRAW" }
              as: RevenueManager
              captures: { e3: $.data.error_id }
          assert:
            - "Promotion.${promo_early}.status == WITHDRAWN with withdraw_reason == CALENDAR_REPLACED, redemption_count == 0 and ${pev2} == ${pev1} + 1 - the SCHEDULED -> WITHDRAWN edge needs no activation first"
            - "Promotion.${promo_aug}.status == WITHDRAWN with withdraw_reason == MARGIN_PROTECTION, redemption_count == 1 and ${pav2} == ${pav1} + 1"
            - "Booking.${bk_nell}.promo_discount_cents == 37999 and net_ticket_cents == 341991 are unchanged after the withdrawal - already-pinned money is never repriced"
            - "Booking.${bk_nell}.deposit_due_cents == 68398 (round_half_up(341991 * 0.20) beats the 50000 per-guest floor)"
            - "Ike's booking quoting the withdrawn promotion returns HTTP 422 with data.error_id == ERR_PROMOTION_NOT_ACTIVE - the fiscal gate at priority 20, not a 404 and not a 409"
            - "Promotion.${promo_aug}.redemption_count is still 1 and Guest.${g_ike}.bookings_count == 0"
            - "re-activating returns HTTP 409 with data.error_id == ERR_PROMOTION_NOT_SCHEDULED"
            - "re-withdrawing returns HTTP 409 with data.error_id == ERR_PROMOTION_ALREADY_CLOSED, and withdraw_reason is still MARGIN_PROTECTION"
            - "GET /promotions?sailing_id=${sail_w}&status=WITHDRAWN returns total_count == 2"

      - name: revenue_summary_refreshes_without_bumping_version
        claim_type: computed_read
        grounds:
          - endpoints[GET /sailings/{id}/revenue-summary]
          - calculations.sailing_ralbd
          - calculations.sailing_occupancy_posture
          - consistency_model
        distinguishing_aspect: |
          This is the only read endpoint that re-runs calculations, and it is the one write-shaped
          operation in the API that must NOT increment version: two consecutive summary calls have
