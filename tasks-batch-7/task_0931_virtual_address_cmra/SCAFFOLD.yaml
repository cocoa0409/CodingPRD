    code: 201
    input: [disposition_type, expected_mail_item_version]
    output: DispositionRequest
    side_effects:
      - "runs disposition_precedence; losing PENDING requests move to SUPERSEDED with resolution_reason LOST_PRECEDENCE"
      - "MailItem.handling_status HELD -> PENDING_DISPOSITION"
      - "increments MailItem.version by 1"
  - method: GET
    path: "/mail-items/{id}/dispositions"
    description: "List the disposition requests lodged against a piece."
    roles: [PlatformAdmin, CmraOperator, BoxHolder, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DispositionRequest[]
    side_effects: []
  - method: POST
    path: "/dispositions/{id}/cancel"
    description: "Withdraw a pending disposition request."
    roles: [BoxHolder]
    code: 200
    input: []
    output: DispositionRequest
    side_effects:
      - "DispositionRequest.status PENDING -> CANCELLED with resolution_reason HOLDER_CANCELLED"
      - "MailItem.handling_status PENDING_DISPOSITION -> HELD when no PENDING request remains"
      - "increments DispositionRequest.version by 1"
  - method: POST
    path: "/dispositions/{id}/execute"
