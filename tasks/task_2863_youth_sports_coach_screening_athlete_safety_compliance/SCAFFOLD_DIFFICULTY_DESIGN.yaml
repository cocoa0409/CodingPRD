  - rule_id: transitive_cascade
    instances:
      - name: interim_measure_four_hop_restriction_cascade
        grounds:
          - state_machines.InterimMeasure.initial_state
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.CoachAssignment.ACTIVE_to_SUSPENDED
          - calculations.club_compliance_posture
          - calculations.contact_eligibility_derivation
          - concurrency_rules[interim-measure-create-stale-member]
        distinguishing_aspect: |
          A single POST /safesport/cases/{case_id}/interim-measures call propagates four hops
          across four entities - InterimMeasure created ACTIVE (hop 1), Member driven to
          contact_eligibility RESTRICTED and membership_status SUSPENDED (hop 2), the member's
          ACTIVE CoachAssignment driven to SUSPENDED with suspended_reason INTERIM_MEASURE
          (hop 3), and the Club's active_assignment_count driven 1 -> 0 with
          restricted_member_count 0 -> 1 flipping compliance_posture OPEN -> RESTRICTED (hop 4).
