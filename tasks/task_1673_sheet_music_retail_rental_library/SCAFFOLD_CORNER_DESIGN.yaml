            - "v_create == 1, v_res == 2, v_dis == 3, v_conf == 4, v_ren == 5 (each mutation +1)"
      - name: encumbrance_reconciliation_on_settle
        claim_type: derived_field_reconciliation
        grounds: [state_machines.RentalOrder.RETURNED_to_SETTLED, entities.PurchaseOrder.fields.encumbered_cents]
        distinguishing_aspect: "PO encumbrance is a derived ledger: +10000 at reserve, back to 0 at settle — before/after reconcile proves the ledger-sync side effect."
        test_recipe:
          setup: ["PO-backed order through full lifecycle to SETTLED"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "ER Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "ER Work", catalog_number: "ER-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "ER-SET", copy_count: 5, replacement_value_cents: 40000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "ER HS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0, requires_purchase_order: true }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/purchase-orders"
              payload: { account_id: "${a}", po_number: "PO-ER", authorized_amount_cents: 100000, valid_from: "2026-08-01", valid_until: "2027-06-30" }
              as: BillingManager
              captures: { po: $.data.id }
            - call: "POST /library/purchase-orders/${po}/approve"
              payload: {}
              as: BillingManager
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", purchase_order_id: "${po}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "GET /library/purchase-orders/${po}"
              as: BillingManager
              captures: { enc_reserved: $.data.encumbered_cents }
            - call: "POST /library/rental-orders/${o}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${a}"
            - call: "POST /library/rental-orders/${o}/check-in"
              payload: { line_grades: "A" }
              as: ReturnsClerk
          trigger:
            - call: "POST /library/rental-orders/${o}/settle"
              payload: {}
              as: BillingManager
            - call: "GET /library/purchase-orders/${po}"
              as: BillingManager
              captures: { enc_settled: $.data.encumbered_cents }
          assert:
            - "after reserve: encumbered_cents == 10000"
            - "after settle: encumbered_cents == 0 (released, no drift)"

  # ================================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_reserve_side_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "In the reserve response and an immediate re-GET, RentalSet.available_copy_count and RentalOrder.estimated_fee_cents are already final — no eventual-consistency lag anywhere in the immediate model."
        test_recipe:
          setup: ["10-copy set; DRAFT order 3 copies"]
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "IC Pub" }
              as: LibraryAdmin
              captures: { p: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${p}", title: "IC Work", catalog_number: "IC-1", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { w: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${w}", set_code: "IC-SET", copy_count: 10, replacement_value_cents: 80000 }
              as: LibraryAdmin
              captures: { s: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "IC Acct", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { a: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${a}", rental_set_id: "${s}", copies_requested: 3, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { fee: $.data.estimated_fee_cents, st: $.data.status }
            - call: "GET /library/rental-sets/${s}"
              as: LibraryClerk
              captures: { avail: $.data.available_copy_count }
          assert:
            - "reserve response: status == RESERVED, estimated_fee_cents == 30000 (same request)"
            - "immediate re-GET: RentalSet.${s}.available_copy_count == 7 (visible at once)"

  # ================================================================ covered-by-§1.8 stubs
  - section: state_machines
    instances:
      - name: renewal_cycle_and_cap
        claim_type: cyclic_shape
        grounds: [state_machines.RentalOrder.ON_LOAN_to_ON_LOAN]
        excluded_because:
          difficulty_instance: rental_order_renewal_cycle_and_cap
          rationale: "Renewal loop semantics, fee growth, and cap rejection are asserted by the named §1.8 instance."
      - name: dispute_reissue_loop
        claim_type: branching_with_revert
        grounds: [state_machines.DamageInvoice.DISPUTED_to_ISSUED]
        excluded_because:
          difficulty_instance: damage_invoice_dispute_reissue_loop
          rationale: "Dispute → reissue → resolve loop with SUPERSEDED report transitions is asserted by the named §1.8 instance."
  - section: calculations
    instances:
      - name: tiered_volume_discount
        claim_type: tiered_pricing_boundaries
        grounds: [calculations.rental_fee_estimate]
        excluded_because:
          difficulty_instance: rental_fee_tiered_volume_discount_inversion
          rationale: "24-vs-25-copy tier inversion covers the volume-discount tier boundaries."
      - name: provisional_vs_final_fee
        claim_type: variant_divergence
        grounds: [calculations.rental_fee_final]
        excluded_because:
          difficulty_instance: rental_fee_provisional_vs_final_on_late_return
          rationale: "Provisional vs final divergence with late tiers is asserted by the named §1.8 instance."
      - name: open_vs_settled_exposure
        claim_type: variant_divergence
        grounds: [calculations.account_exposure]
        excluded_because:
          difficulty_instance: account_exposure_open_vs_settled_divergence
          rationale: "Open vs settled exposure divergence asserted by the named §1.8 instance."
  - section: validations
    instances:
      - name: credit_limit_boundary
        claim_type: boundary_precision
        grounds: ["validations[priority=14]"]
        excluded_because:
          difficulty_instance: credit_limit_exact_boundary_on_reserve
          rationale: "Exact 70000 boundary plus one-cent-under rejection asserted by the named §1.8 instance."
      - name: zero_copy_pool_boundary_on_overlap
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "calculations.set_availability_projection", "errors[ERR_INSUFFICIENT_COPIES]"]
        distinguishing_aspect: "Empty-collection edge: a 2-copy set fully booked [08-05, 09-04) leaves exactly 0 allocatable copies — a 1-copy overlapping request fails ERR_INSUFFICIENT_COPIES, while a request adjacent at the exact due_date touch succeeds (half-open)."
        test_recipe:
          setup:
            - "Set with copy_count 2; order O1 for 2 copies RESERVED [2026-08-05, 2026-09-04)"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Twelve" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Nocturne", catalog_number: "P12-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-1001", copy_count: 2, replacement_value_cents: 16000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
              payload: { account_name: "Lake MS", account_kind: SCHOOL, credit_tier: STANDARD, credit_limit_cents: 0 }
              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 2, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-08-20", due_date: "2026-09-19" }
              as: LibraryClerk
              captures: { o2: $.data.id }
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 2, checkout_date: "2026-09-04", due_date: "2026-10-04" }
              as: LibraryClerk
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o2}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { err_overlap: $.data.error_id }
            - call: "POST /library/rental-orders/${o3}/reserve"
              payload: {}
              as: LibraryClerk
              captures: { o3_status: $.data.status }
          assert:
            - "overlapping reserve: error_id == ERR_INSUFFICIENT_COPIES (0 allocatable copies, request 1)"
            - "adjacent reserve at exact due_date touch: RentalOrder.${o3}.status == RESERVED (half-open adjacency allowed)"
            - "RentalSet.${set_id}.available_copy_count == 0 after both (O1 2 copies + O3 2 copies non-overlapping)"
      - name: insufficient_copies_error_via_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_COPIES]"]
        excluded_because:
          difficulty_instance: rental_copy_half_open_adjacency
          rationale: "Asserted as the one-day-overlap failure path of the named §1.8 instance; zero-pool variant covered by zero_copy_pool_boundary_on_overlap in this file."
      - name: perusal_hold_closed_interval
        claim_type: temporal_validation
        grounds: ["validations[priority=11]"]
        excluded_because:
          difficulty_instance: perusal_hold_closed_interval_with_quarantine
          rationale: "Closed-interval + quarantine buffer semantics asserted by the named §1.8 instance."
      - name: rights_clearance_gate
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]"]
        excluded_because:
          difficulty_instance: dispatch_gated_by_rights_advisory_state
          rationale: "Rights gate across OPEN/LICENSE_REQUIRED/CLEARED asserted by the named §1.8 instance."
      - name: po_state_gate_on_dispatch
        claim_type: cross_entity_validation
        grounds: ["validations[priority=12]"]
        excluded_because:
          difficulty_instance: dispatch_gated_by_purchase_order_state
          rationale: "PO SUBMITTED gating and post-approval success asserted by the named §1.8 instance."
      - name: segregation_of_duties_gate
        claim_type: priority_ordering
        grounds: ["validations[priority=5]"]
        excluded_because:
          difficulty_instance: safety_vs_referential_on_invoice_issue
          rationale: "SoD vs standing-gate precedence asserted by the named §1.8 instance; plain SoD denial also exercised there."
      - name: state_vs_fiscal_precedence
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=15]"]
        excluded_because:
          difficulty_instance: state_vs_business_fiscal_on_dispatch
          rationale: "Priority conflict resolution asserted by the named §1.8 instance."
      - name: standing_gate_on_reserve
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_ACCOUNT_NOT_IN_GOOD_STANDING]"]
        excluded_because:
          difficulty_instance: overdue_sweep_cascade_order_account_po
          rationale: "Standing flips to HOLD are asserted there; the reserve-time rejection uses the same gate exercised across cascade instances."
  - section: errors
    instances:
      - name: renewal_cap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENEWAL_CAP_REACHED]"]
        excluded_because:
          difficulty_instance: rental_order_renewal_cycle_and_cap
          rationale: "Asserted as the third-renewal failure of the named §1.8 instance."
      - name: perusal_hold_conflict_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERUSAL_HOLD_CONFLICT]"]
        excluded_because:
          difficulty_instance: perusal_hold_closed_interval_with_quarantine
          rationale: "Asserted as the touch-boundary failure of the named §1.8 instance."
      - name: credit_limit_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: credit_limit_exact_boundary_on_reserve
          rationale: "Asserted as the one-cent-under failure of the named §1.8 instance."
      - name: rights_not_cleared_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_RIGHTS_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: dispatch_gated_by_rights_advisory_state
          rationale: "Asserted twice (OPEN and LICENSE_REQUIRED) in the named §1.8 instance."
      - name: po_not_usable_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_PO_NOT_USABLE]"]
        excluded_because:
          difficulty_instance: dispatch_gated_by_purchase_order_state
          rationale: "Asserted as the SUBMITTED-PO reserve failure of the named §1.8 instance."
      - name: prepayment_required_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREPAYMENT_REQUIRED]"]
        excluded_because:
          difficulty_instance: state_vs_business_fiscal_on_dispatch
          rationale: "The dual-failure scenario names ERR_PREPAYMENT_REQUIRED as the losing (masked) error; the unmasked path is covered by prepay_dispatch_without_prepayment_rejected_then_succeeds in this file."
