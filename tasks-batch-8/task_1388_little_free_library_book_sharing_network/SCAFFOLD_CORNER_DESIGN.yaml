  - section: calculations
    instances:
      - name: sla_winter_doubling_and_breach_boundary
        claim_type: constants_applied
        grounds: ["calculations.repair_sla_deadline", "entities.MaintenanceRequest.fields.sla_breached"]
        distinguishing_aspect: "WINTER doubles the SLA (CRITICAL 24h x 2.0 = 48h from triaged_at); resolving exactly at the deadline is not a breach (strict >), resolving one second after is."
        test_recipe:
          setup: ["ACTIVE steward with ACTIVE box; two maintenance requests reported at 2026-12-01T00:00:00Z (WINTER), both triaged CRITICAL at that instant"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Winter Owner", email: "winter@example.org", region_code: "WA" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
