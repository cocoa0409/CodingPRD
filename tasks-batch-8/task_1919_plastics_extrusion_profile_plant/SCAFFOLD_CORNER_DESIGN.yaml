      - name: lot_incompatible_colorant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - "errors[ERR_LOT_INCOMPATIBLE]"
        distinguishing_aspect: "Colorant lot of color_family BLUE against a RED formulation returns ERR_LOT_INCOMPATIBLE (compatibility, not purity — purity covers regrind only)."
