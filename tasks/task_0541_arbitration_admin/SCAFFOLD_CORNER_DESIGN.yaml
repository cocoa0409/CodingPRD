              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 100000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
          trigger:
            - call: "POST /deposits/${dep}/refund"
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      # ---- §1.8-covered corners (stubs) ----
      - name: award_cyclic_vacatur_then_redraft
        claim_type: cyclic
        grounds:
          - state_machines.Award.ISSUED_to_VACATED
          - state_machines.Award.VACATED_to_DRAFT
        excluded_because:
          difficulty_instance: non_linear_state_machine / award_vacatur_redraft_cycle
          rationale: "The ISSUED->VACATED->DRAFT loop on the Award entity is fully exercised by the named §1.8 instance."

      - name: candidate_objection_cured_back_to_cleared_corner
        claim_type: valid_transition
        grounds:
          - state_machines.Candidate.OBJECTED_to_CLEARED
        excluded_because:
          difficulty_instance: non_linear_state_machine / candidate_objection_cured_back_to_cleared
          rationale: "The OBJECTED->CLEARED cure back-edge is asserted directly by the named §1.8 instance."

      - name: appoint_winner_cascades_siblings_not_selected_corner
        claim_type: cascade_down
        grounds:
          - state_machines.Candidate.CLEARED_to_APPOINTED
          - state_machines.Candidate.CLEARED_to_NOT_SELECTED
        excluded_because:
          difficulty_instance: transitive_cascade / appoint_sets_winner_and_cascades_siblings_not_selected
          rationale: "Winner APPOINTED plus sibling NOT_SELECTED cascade is the assertion body of the named §1.8 instance."

      - name: appeal_grant_bubbles_award_vacated_and_case_hearing_corner
        claim_type: cross_entity
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.Award.ISSUED_to_VACATED
          - state_machines.Case.AWARD_ISSUED_to_HEARING
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_grant_vacates_award_reverts_case_restores_balance
          rationale: "The appeal-grant cross-entity cascade is fully asserted by the named §1.8 instance."

      - name: fee_reversal_compensation_no_drift_corner
        claim_type: compensation
        grounds:
          - state_machines.FeeCharge.POSTED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / fee_reversal_restores_deposit_balance
          rationale: "Reversal restoring deposit_balance with posted_fee_cents 0 is the assertion of the named §1.8 instance."

      - name: strike_withdraw_compensation_restores_allowance_corner
        claim_type: compensation
        grounds:
          - state_machines.Ranking.ACTIVE_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / strike_withdraw_restores_allowance
          rationale: "Strike withdrawal returning the allowance is asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 3 — Calculations (boundary correct_result / precision /
  #   input_set_filtering + §1.8 stubs)
  # ===========================================================================
  - section: calculations
    instances:

      - name: filing_fee_below_tier2_floor_is_tier1
        claim_type: correct_result
        grounds:
          - calculations.case_fee_tier
          - calculations.filing_fee
        distinguishing_aspect: |
          claim_amount_cents 999999 (one below the TIER_2 floor 1_000_000) stays TIER_1 with
          filing_fee_cents 75000.
        test_recipe:
          setup:
            - "Empty DB; a single ARBITRATION filing one cent below the TIER_2 floor."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "T1edge", claim_amount_cents: 999999, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.fee_tier == TIER_1"
            - "Case.${c_id}.filing_fee_cents == 75000"

      - name: filing_fee_tier2_floor_inclusive
        claim_type: correct_result
        grounds:
          - calculations.case_fee_tier
          - calculations.filing_fee
        distinguishing_aspect: |
          claim_amount_cents exactly 1_000_000 lands in TIER_2 (floor inclusive) with
          filing_fee_cents 175000.
        test_recipe:
          setup:
            - "Empty DB; a single ARBITRATION filing at the exact TIER_2 floor."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "T2floor", claim_amount_cents: 1000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.fee_tier == TIER_2"
            - "Case.${c_id}.filing_fee_cents == 175000"

      - name: filing_fee_tier4_floor_inclusive
        claim_type: correct_result
        grounds:
          - calculations.case_fee_tier
          - calculations.filing_fee
        distinguishing_aspect: |
          claim_amount_cents exactly 50_000_000 lands in TIER_4 (floor inclusive) with
          filing_fee_cents 700000.
        test_recipe:
          setup:
            - "Empty DB; a single ARBITRATION filing at the exact TIER_4 floor."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "T4floor", claim_amount_cents: 50000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.fee_tier == TIER_4"
            - "Case.${c_id}.filing_fee_cents == 700000"

      - name: filing_fee_mediation_half_multiplier
        claim_type: correct_result
        grounds:
          - calculations.filing_fee
          - entities.Case.fields.case_type
        distinguishing_aspect: |
          A MEDIATION panel-1 filing at claim 500000 applies the 0.5 case_type multiplier:
          TIER_1 base 75000 * 0.5 = filing_fee_cents 37500.
        test_recipe:
          setup:
            - "Empty DB; a single MEDIATION panel-1 filing at claim 500000."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "MEDIATION", title: "MedFee", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.fee_tier == TIER_1"
            - "Case.${c_id}.filing_fee_cents == 37500"

      - name: cancel_hearing_recomputes_estimated_comp
        claim_type: input_set_filtering
        grounds:
          - calculations.neutral_estimated_comp
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
          - entities.Case.fields.estimated_neutral_fee_cents
        distinguishing_aspect: |
          With two 3-hour SCHEDULED hearings (rate 50000 => estimate 300000), cancelling one drops
          it from the SCHEDULED input set so estimated_neutral_fee_cents recomputes to 150000.
        test_recipe:
          setup:
            - "Appointed HEARING case (rate 50000); clock 2026-06-01; two 3h SCHEDULED hearings 2026-06-20 and 2026-06-21."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Est N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "EstCase", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-20T09:00:00Z", end_at: "2026-06-20T12:00:00Z", location: "Room A" }
              as: CaseAdministrator
              captures: { h1: $.data.id }
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-21T09:00:00Z", end_at: "2026-06-21T12:00:00Z", location: "Room B" }
              as: CaseAdministrator
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /hearings/${h2}/transition"
              payload: { to_status: "CANCELLED" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "Case.${c_id}.estimated_neutral_fee_cents == 150000"

      - name: appoint_tie_break_earliest_created_at_wins
        claim_type: correct_result
        grounds:
          - calculations.appoint_selector
          - state_machines.Case.SELECTION_to_APPOINTED
        distinguishing_aspect: |
          With two CLEARED, unranked candidates (both aggregate_rank_score 0), appoint selects the
          earliest-created candidate by created_at ASC — id is never used as a tie-break.
        test_recipe:
          setup:
            - "A SELECTION case with two CLEARED candidates and no rankings (both score 0)."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "TieCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n1}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand1: $.data.id }
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_a1: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n2}", expected_case_version: "${cv_a1}" }
              as: CaseAdministrator
              captures: { cand2: $.data.id }
            - call: "POST /candidates/${cand1}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n1}"
            - call: "POST /candidates/${cand1}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "POST /candidates/${cand2}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n2}"
            - call: "POST /candidates/${cand2}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "Candidate.${cand1}.status == APPOINTED"
            - "Candidate.${cand2}.status == NOT_SELECTED"
            - "Case.${c_id}.appointed_neutral_id == ${n1}"

      # ---- §1.8-covered corners (stubs) ----
      - name: filing_fee_tier3_floor_boundary_corner
        claim_type: correct_result
        grounds:
          - calculations.case_fee_tier
        excluded_because:
          difficulty_instance: boundary_precision_check / filing_fee_tier3_floor_is_inclusive
          rationale: "The 7_500_000 TIER_3 inclusive-floor boundary is asserted by the named §1.8 instance."

      - name: filing_fee_panel3_multiplier_corner
        claim_type: correct_result
        grounds:
          - calculations.filing_fee
          - entities.Case.fields.panel_size
        excluded_because:
          difficulty_instance: combinatorial_formula / filing_fee_tier_times_panel_multiplier
          rationale: "The tier*case_type*panel multiplier (panel 3 => 1.5) is asserted by the named §1.8 instance."

      - name: filing_vs_final_admin_fee_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.filing_fee
          - calculations.final_admin_fee
        excluded_because:
          difficulty_instance: dual_variant_calc / filing_fee_provisional_vs_final_admin_fee
          rationale: "Provisional-vs-final admin-fee divergence is asserted by the named §1.8 instance."

      - name: estimated_vs_actual_neutral_comp_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.neutral_estimated_comp
          - calculations.neutral_actual_comp
        excluded_because:
          difficulty_instance: dual_variant_calc / neutral_estimated_vs_actual_compensation
          rationale: "Estimate-vs-actual neutral compensation divergence is asserted by the named §1.8 instance."

      - name: party_fee_allocation_remainder_corner
        claim_type: correct_result
        grounds:
          - calculations.party_fee_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / party_fee_allocation_floor_then_remainder
          rationale: "Floor-then-remainder allocation order (100001 => 50001/50000) is asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 4 — Validations (violation_to_error / satisfaction_to_pass /
  #   priority_ordering + §1.8 stubs)
  # ===========================================================================
  - section: validations
    instances:

      - name: open_selection_without_respondent_returns_parties_incomplete
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - state_machines.Case.FILED_to_SELECTION
          - errors[ERR_PARTIES_INCOMPLETE]
        distinguishing_aspect: |
          Transitioning FILED->SELECTION with only a CLAIMANT party (no RESPONDENT) returns 409
          ERR_PARTIES_INCOMPLETE.
        test_recipe:
          setup:
            - "A FILED case with only a CLAIMANT party."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "OnlyClaimant", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_PARTIES_INCOMPLETE"

      - name: add_mediator_candidate_to_arbitration_returns_type_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_NEUTRAL_TYPE_MISMATCH]
        distinguishing_aspect: |
          Adding a MEDIATOR-typed neutral as a candidate to an ARBITRATION case returns 409
          ERR_NEUTRAL_TYPE_MISMATCH (ARBITRATION needs ARBITRATOR/BOTH).
        test_recipe:
          setup:
            - "A SELECTION-phase ARBITRATION case and a rostered MEDIATOR neutral."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Med Only", neutral_type: "MEDIATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "TypeMis", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_NEUTRAL_TYPE_MISMATCH"

      - name: clear_candidate_with_conflict_returns_candidate_has_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - state_machines.Candidate.DISCLOSED_to_CLEARED
          - errors[ERR_CANDIDATE_HAS_CONFLICT]
        distinguishing_aspect: |
          Clearing a candidate whose disclosure set has_conflict=true returns 409
          ERR_CANDIDATE_HAS_CONFLICT.
        test_recipe:
          setup:
            - "A SELECTION case with a DISCLOSED candidate whose has_conflict is true."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Conf N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "ConfCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "has a conflict", has_conflict: true }
              as: Neutral
              as_user_id: "${n_id}"
          trigger:
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_CANDIDATE_HAS_CONFLICT"

      - name: strike_over_allowance_returns_strike_budget_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - entities.Case.fields.strikes_per_party
          - errors[ERR_STRIKE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          On a case with strikes_per_party 1, a party's second STRIKE (after one used) returns 409
          ERR_STRIKE_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "A SELECTION case (strikes_per_party 1) with two PROPOSED candidates; party A has struck candidate 1."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Budget", claim_amount_cents: 500000, panel_size: 1, strikes_per_party: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n1}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand1: $.data.id }
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_a1: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n2}", expected_case_version: "${cv_a1}" }
              as: CaseAdministrator
              captures: { cand2: $.data.id }
            - call: "POST /rankings"
              payload: { candidate_id: "${cand1}", party_id: "${pA}", action: "STRIKE" }
              as: Party
              as_user_id: "${pA}"
          trigger:
            - call: "POST /rankings"
              payload: { candidate_id: "${cand2}", party_id: "${pA}", action: "STRIKE" }
              as: Party
              as_user_id: "${pA}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_STRIKE_BUDGET_EXCEEDED"

      - name: duplicate_ranking_on_same_candidate_returns_duplicate_ranking
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_RANKING]
        distinguishing_aspect: |
          A party that already holds an ACTIVE ranking on a candidate gets 409 ERR_DUPLICATE_RANKING
          when ranking the same candidate again.
        test_recipe:
          setup:
            - "A SELECTION case with one PROPOSED candidate; party A already RANKed it (rank_value 5)."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Dup N", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Dup", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
