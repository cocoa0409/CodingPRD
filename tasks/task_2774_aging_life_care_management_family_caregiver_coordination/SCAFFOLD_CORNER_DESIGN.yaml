      - name: conference_convene_with_attendee_outside_invited_set_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FamilyConference.SCHEDULED_to_CONVENED
          - validations[priority=62]
          - errors[ERR_ENTITY_RELATIONSHIP_INVALID]
          - entities.FamilyConference.fields.attended_contact_ids
        distinguishing_aspect: "attended_contact_ids must be a subset of invited_contact_ids, so convening with a contact of the same client who was never invited returns ERR_ENTITY_RELATIONSHIP_INVALID (422) and leaves the conference SCHEDULED."
