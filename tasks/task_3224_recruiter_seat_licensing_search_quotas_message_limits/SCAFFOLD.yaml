# =============================================================================
# SCAFFOLD — task_3224_recruiter_seat_licensing_search_quotas_message_limits
# LinkedIn Recruiter: seat licensing, search quotas, message credits,
# job-posting budget pacing, ATS write-back, talent insights, renewal true-up.
# =============================================================================

scenario: |
  Recruiter Seat Licensing, Search Quotas & Message Limits (LinkedIn): recruiter
  product tiers with seat-based licensing, search result limits and project
  management features, message credit allocation with monthly refresh,
  response-based credit return and anti-spam limits, candidate search filtering
  with visibility rules based on member privacy settings and open-to-work
  signals, job posting products with budget pacing, promoted slots and applicant
  routing, applicant tracking system integrations with data write-back and
  duplicate handling, contract compliance where seats cannot be shared across
  recruiters with audit, talent insights products aggregating member data with
  privacy aggregation thresholds, renewal and seat true-up.

domain_name: recruiter-seats
api_prefix: ""   # multi-root API surface: /contracts, /recruiters, /seats, /messages, /ats-sync-records, /renewal-events, /candidate-profiles, /_clock

complexity_profile:
  primary_archetype: quota_allocation          # §0.1: finite pools, reserved/committed/released across seats, credits, and job budgets
  secondary_archetype: compliance_audit        # §0.1: seat non-sharing + audit log, privacy aggregation thresholds
  complexity_layers:
    - optimistic_concurrency                   # §0.2: OCC on RecruiterContract.version for true-up; on Seat.version for assignment
    - cascading_side_effects                   # §0.2: true-up cascade depth >= 3 (Contract→Seat→CreditPool→Message audit)
    - dual_variant_calculation                 # §0.2: budget pacing (EVEN vs FRONT_LOADED) and renewal proration (ELAPSED vs REMAINING)
    - rate_threshold_triggers                  # §0.2: anti-spam throttle thresholds, privacy aggregation floor, monthly credit refresh
    - derived_field_reconciliation             # §0.2: QuotaLedger.used_searches, MessageCreditPool.credits_used, Seat.seat_status derived
    - soft_delete                              # §0.2: Recruiter is deactivated (soft), Seat reclaim respects deactivated recruiters

  entity_topology: hybrid                      # Contract → Seat → (QuotaLedger, CreditPool); CandidateProfile is peer, JobPosting is peer, AtsIntegration nested
  state_machine_shape: branching               # Seat: fork-join on assign/reclaim with posture; Message: parallel dims (delivery × response)
  relationship_patterns:
    - one_to_many                              # Contract→Seat, Seat→Message, JobPosting→PromotedSlot, AtsIntegration→AtsSyncRecord
    - cross_aggregate                          # Message→CandidateProfile (peer), Message→JobPosting (peer), TalentInsightReport→Contract
    - self_referential                         # Recruiter.manager_recruiter_id (hierarchical recruiters within same contract)
  role_model: hierarchical_override            # ContractAdmin > SeatAdmin > RecruiterUser > AtsService; plus opaque Auditor
  consistency_model: immediate                 # all cascades complete in the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: RecruiterContract
    parent: null
    common_fields: true
    fields:
      - { name: contract_number, type: string, source: input, description: "Human-facing contract identifier; unique tenant-wide" }
      - { name: product_tier, type: enum, source: input, description: "RECRUITER_LITE | RECRUITER_PRO | RECRUITER_CORP; drives quota/credit/search limits", constraints: "enum {RECRUITER_LITE, RECRUITER_PRO, RECRUITER_CORP}" }
      - { name: seat_cap, type: integer, source: input, description: "Maximum seats purchasable on this contract; must be >= 1", constraints: "1 <= seat_cap <= 5000" }
      - { name: seats_purchased, type: integer, source: system, description: "Seats actually paid for; starts at 0; only true-up and initial activation can raise it" }
      - { name: seats_assigned, type: integer, source: computed, description: "Count of Seat rows in status ASSIGNED linked to this contract" }
      - { name: monthly_credit_per_seat, type: integer, source: computed, description: "Tier-derived: LITE=30, PRO=100, CORP=150" }
      - { name: monthly_search_quota_per_seat, type: integer, source: computed, description: "Tier-derived: LITE=100, PRO=1000, CORP=10000" }
      - { name: search_result_page_cap, type: integer, source: computed, description: "Tier-derived max candidates per search response: LITE=40, PRO=100, CORP=1000" }
      - { name: current_period_start, type: datetime, source: system, description: "UTC start of the active quota/credit billing period" }
      - { name: current_period_end, type: datetime, source: system, description: "UTC end (exclusive) of the active period; exactly 30 days after start" }
      - { name: period_index, type: integer, source: system, description: "Monotone period counter; starts at 1; +1 on each monthly refresh" }
      - { name: contract_status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | RENEWAL_PENDING | EXPIRED", constraints: "enum {PENDING_ACTIVATION, ACTIVE, SUSPENDED, RENEWAL_PENDING, EXPIRED}" }
      - { name: true_up_allowed, type: boolean, source: input, description: "Whether seat true-up events are permitted for this contract", default: true }

  - name: Seat
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: seat_label, type: string, source: system, description: "System-generated label SEAT-<sequence>; unique within the contract" }
      - { name: seat_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED | SUSPENDED | REVOKED", constraints: "enum {UNASSIGNED, ASSIGNED, SUSPENDED, REVOKED}" }
      - { name: assigned_recruiter_id, type: string, source: system, description: "Recruiter currently holding this seat (Recruiter.id); null when UNASSIGNED or REVOKED; nullable" }
      - { name: assignment_started_at, type: datetime, source: system, description: "Timestamp of most recent assign; null when never assigned" }
      - { name: assignment_audit_count, type: integer, source: computed, description: "Number of ASSIGN transitions performed on this seat; audit counter" }
      - { name: last_period_credit_refresh, type: integer, source: system, description: "period_index at which credit pool was last refreshed; 0 before first refresh" }

  - name: Recruiter
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Recruiter login email; unique tenant-wide; lowercase" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: manager_recruiter_id, type: string, source: input, description: "FK -> Recruiter.id; nullable; must point to an ACTIVE recruiter when provided" }
      - { name: recruiter_status, type: enum, source: system, description: "ACTIVE | DEACTIVATED; soft-delete", constraints: "enum {ACTIVE, DEACTIVATED}" }
      - { name: home_contract_id, type: string, source: system, description: "FK -> RecruiterContract.id; the contract under which the recruiter was onboarded" }
      - { name: active_seat_id, type: string, source: system, description: "FK -> Seat.id; null when no seat currently assigned; at most one seat per recruiter" }

  - name: QuotaLedger
    parent: Seat
    common_fields: true
    fields:
      - { name: seat_id, type: string, source: system, description: "FK -> Seat.id; one ledger per seat per period" }
      - { name: period_index, type: integer, source: system, description: "Period this ledger covers" }
      - { name: search_quota_total, type: integer, source: system, description: "Snapshot of contract.monthly_search_quota_per_seat at refresh time" }
      - { name: searches_used, type: integer, source: computed, description: "Running count of candidate_search invocations in this period" }
      - { name: searches_remaining, type: integer, source: computed, description: "search_quota_total - searches_used; can never go negative" }
      - { name: ledger_status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED", constraints: "enum {OPEN, EXHAUSTED, CLOSED}" }

  - name: MessageCreditPool
    parent: Seat
    common_fields: true
    fields:
      - { name: seat_id, type: string, source: system, description: "FK -> Seat.id" }
      - { name: period_index, type: integer, source: system, description: "Period this pool covers" }
      - { name: credits_granted, type: integer, source: system, description: "Snapshot of contract.monthly_credit_per_seat at refresh" }
      - { name: credits_used, type: integer, source: computed, description: "Sum of credits consumed by SENT messages in this pool" }
      - { name: credits_returned, type: integer, source: computed, description: "Sum of credits returned by RESPONDED messages (capped per policy)" }
      - { name: credits_available, type: integer, source: computed, description: "credits_granted - credits_used + credits_returned; floor at 0" }
      - { name: spam_strike_count, type: integer, source: computed, description: "Count of NEGATIVE_RESPONSE or REPORTED_AS_SPAM responses in this pool" }
      - { name: pool_status, type: enum, source: system, description: "OPEN | THROTTLED | CLOSED", constraints: "enum {OPEN, THROTTLED, CLOSED}" }

  - name: Message
    parent: Seat
    common_fields: true
    fields:
      - { name: seat_id, type: string, source: system, description: "FK -> Seat.id; the sending seat" }
      - { name: candidate_id, type: string, source: input, description: "FK -> CandidateProfile.id; the recipient" }
      - { name: project_id, type: string, source: input, description: "FK -> SearchProject.id; the project the message is associated with" }
      - { name: job_posting_id, type: string, source: input, description: "FK -> JobPosting.id; nullable; set when sent in the context of a job" }
      - { name: body, type: string, source: input, description: "Message body text" }
      - { name: delivery_status, type: enum, source: system, description: "PENDING | SENT | FAILED; parallel dimension", constraints: "enum {PENDING, SENT, FAILED}" }
      - { name: response_status, type: enum, source: system, description: "AWAITING | RESPONDED | NEGATIVE_RESPONSE | REPORTED_AS_SPAM | EXPIRED; parallel dimension", constraints: "enum {AWAITING, RESPONDED, NEGATIVE_RESPONSE, REPORTED_AS_SPAM, EXPIRED}" }
      - { name: credit_consumed, type: integer, source: system, description: "1 when the send consumed a credit; 0 otherwise (e.g. open-profile member)" }
      - { name: credit_returned_flag, type: boolean, source: system, description: "true when this message returned its credit on positive response" }

  - name: CandidateProfile
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "External member identifier; unique" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: headline, type: string, source: input, description: "Free-text headline" }
      - { name: privacy_setting, type: enum, source: input, description: "PUBLIC | CONNECTIONS_ONLY | PRIVATE; drives visibility rules", constraints: "enum {PUBLIC, CONNECTIONS_ONLY, PRIVATE}" }
      - { name: open_to_work, type: boolean, source: input, description: "Whether member signals open-to-work" }
      - { name: open_to_work_visibility, type: enum, source: input, description: "ALL_MEMBERS | RECRUITERS_ONLY | NONE", constraints: "enum {ALL_MEMBERS, RECRUITERS_ONLY, NONE}" }
      - { name: years_experience, type: integer, source: input, description: "Total years of experience" }
      - { name: current_title, type: string, source: input, description: "Current job title" }

  - name: SearchProject
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: owner_seat_id, type: string, source: system, description: "FK -> Seat.id; the seat that owns this project" }
      - { name: name, type: string, source: input, description: "Project name; unique within the contract" }
      - { name: project_status, type: enum, source: system, description: "DRAFT | OPEN | ON_HOLD | CLOSED", constraints: "enum {DRAFT, OPEN, ON_HOLD, CLOSED}" }
      - { name: pinned_candidate_ids, type: array, source: input, description: "Ordered list of CandidateProfile.id pinned to the project; max 100" }
      - { name: message_count, type: integer, source: computed, description: "Count of Message rows with this project_id and delivery_status=SENT" }

  - name: JobPosting
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: created_by_seat_id, type: string, source: system, description: "FK -> Seat.id" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: budget_cents, type: integer, source: input, description: "Total budget in cents; must be >= 1000" }
      - { name: daily_cap_cents, type: integer, source: input, description: "Max spend per UTC day; must be >= 100 and <= budget_cents" }
      - { name: pacing_mode, type: enum, source: input, description: "EVEN | FRONT_LOADED; selects pacing variant", constraints: "enum {EVEN, FRONT_LOADED}" }
      - { name: start_at, type: datetime, source: input, description: "UTC start of the posting" }
      - { name: end_at, type: datetime, source: input, description: "UTC end (exclusive); must be at least 1 day after start" }
      - { name: spent_cents, type: integer, source: computed, description: "Cumulative spend from promoted-slot impression events" }
      - { name: posting_status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | EXHAUSTED | CLOSED", constraints: "enum {DRAFT, ACTIVE, PAUSED, EXHAUSTED, CLOSED}" }

  - name: PromotedSlot
    parent: JobPosting
    common_fields: true
    fields:
      - { name: job_posting_id, type: string, source: system, description: "FK -> JobPosting.id" }
      - { name: slot_date, type: string, source: input, description: "UTC calendar day YYYY-MM-DD this slot reserves" }
      - { name: reserved_cents, type: integer, source: input, description: "Amount reserved for that day; must be >= 1" }
      - { name: slot_status, type: enum, source: system, description: "RESERVED | CONFIRMED | RELEASED", constraints: "enum {RESERVED, CONFIRMED, RELEASED}" }

  - name: AtsIntegration
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: vendor, type: enum, source: input, description: "GREENHOUSE | LEVER | WORKDAY | ICIMS", constraints: "enum {GREENHOUSE, LEVER, WORKDAY, ICIMS}" }
      - { name: external_tenant_id, type: string, source: input, description: "ATS-side tenant identifier; unique with vendor within contract" }
      - { name: write_back_enabled, type: boolean, source: input, description: "Whether hire/disposition events are pushed back to the ATS", default: true }
      - { name: integration_status, type: enum, source: system, description: "PROVISIONING | CONNECTED | SYNC_ERROR | DISABLED", constraints: "enum {PROVISIONING, CONNECTED, SYNC_ERROR, DISABLED}" }

  - name: AtsSyncRecord
    parent: AtsIntegration
    common_fields: true
    fields:
      - { name: ats_integration_id, type: string, source: system, description: "FK -> AtsIntegration.id" }
      - { name: candidate_id, type: string, source: input, description: "FK -> CandidateProfile.id" }
      - { name: external_candidate_ref, type: string, source: input, description: "ATS-side candidate identifier" }
      - { name: event_type, type: enum, source: input, description: "APPLICATION_FORWARDED | STAGE_CHANGED | HIRED | DISQUALIFIED", constraints: "enum {APPLICATION_FORWARDED, STAGE_CHANGED, HIRED, DISQUALIFIED}" }
      - { name: payload_fingerprint, type: string, source: system, description: "Deterministic fingerprint of (candidate_id, event_type, normalized payload); used for duplicate handling" }
      - { name: sync_status, type: enum, source: system, description: "QUEUED | WRITTEN | DUPLICATE_SKIPPED | FAILED", constraints: "enum {QUEUED, WRITTEN, DUPLICATE_SKIPPED, FAILED}" }

  - name: TalentInsightReport
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: report_name, type: string, source: input, description: "Report display name" }
      - { name: filter_spec, type: object, source: input, description: "Search filter spec: current_title?, min_years_experience?, open_to_work_only?" }
      - { name: matched_count, type: integer, source: computed, description: "Count of CandidateProfile rows matching filter_spec under visibility rules" }
      - { name: aggregation_floor, type: integer, source: system, description: "Minimum matched_count for report to be shareable; fixed at 25" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | GENERATED | PUBLISHED | SUPPRESSED", constraints: "enum {DRAFT, GENERATED, PUBLISHED, SUPPRESSED}" }

  - name: RenewalEvent
    parent: RecruiterContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> RecruiterContract.id" }
      - { name: event_kind, type: enum, source: input, description: "TRUE_UP | RENEWAL | SUSPENSION", constraints: "enum {TRUE_UP, RENEWAL, SUSPENSION}" }
      - { name: seats_delta, type: integer, source: input, description: "Signed seat adjustment for TRUE_UP; ignored for other kinds" }
      - { name: requested_by, type: string, source: system, description: "Auditor user id (opaque) that initiated the event" }
      - { name: event_status, type: enum, source: system, description: "PROPOSED | APPROVED | APPLIED | REJECTED", constraints: "enum {PROPOSED, APPROVED, APPLIED, REJECTED}" }
      - { name: proration_credit_cents, type: integer, source: computed, description: "Computed on APPROVED for TRUE_UP with negative seats_delta using proration formula" }
      - { name: expected_contract_version, type: integer, source: input, description: "OCC guard against RecruiterContract.version; required at creation" }

# =============================================================================
# §1.2 State Machine Table (6 machines, branching/cyclic/parallel)
# =============================================================================
state_machines:
  - entity: RecruiterContract
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/activate"
        actor: ContractAdmin
        preconditions:
          - "seats_purchased >= 1"
        side_effects:
          - "current_period_start = now; current_period_end = now + 30d; period_index = 1"
          - "increments RecruiterContract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{contract_id}/suspend (auditor-initiated via RenewalEvent kind=SUSPENSION)"
        actor: Auditor
        preconditions:
          - "a RenewalEvent with kind=SUSPENSION in APPROVED state exists for this contract"
        side_effects:
          - "every Seat in ASSIGNED on this contract -> SUSPENDED (cascade)"
          - "every Message with response_status=AWAITING on suspended seats -> EXPIRED (depth-3 cascade: contract->seat->message)"
          - "increments RecruiterContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/resume"
        actor: ContractAdmin
        preconditions: []
        side_effects:
          - "Seats in SUSPENDED on this contract revert to their pre-suspension status (ASSIGNED)"
          - "increments RecruiterContract.version by 1"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "system (current time crosses current_period_end minus 7 days)"
        actor: system
        preconditions: []
        side_effects:
          - "no credit/quota effect; only flag"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /renewal-events/{id}/approve then POST /renewal-events/{id}/apply (kind=RENEWAL)"
        actor: Auditor
        preconditions:
          - "RenewalEvent.event_status == APPROVED and kind == RENEWAL"
        side_effects:
          - "period_index += 1; current_period_start = previous current_period_end; current_period_end = previous current_period_end + 30d"
          - "every OPEN QuotaLedger for the contract seats -> CLOSED; new QuotaLedger rows created at new period"
          - "every OPEN/THROTTLED MessageCreditPool -> CLOSED; new MessageCreditPool rows created"
          - "increments RecruiterContract.version by 1"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system (current time > current_period_end + 14 days without renewal applied)"
        actor: system
        preconditions: []
        side_effects:
          - "every Seat -> REVOKED; assigned_recruiter_id cleared; every Recruiter with active_seat_id on this contract has active_seat_id cleared"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /renewal-events/{id}/apply (kind=TRUE_UP)"
        actor: Auditor
        preconditions:
          - "RenewalEvent.event_status == APPROVED and kind == TRUE_UP"
          - "seats_purchased + seats_delta >= seats_assigned (cannot drop below assigned count)"
          - "seats_purchased + seats_delta >= 1 and <= seat_cap"
        side_effects:
          - "seats_purchased += seats_delta"
          - "proration_credit_cents computed and recorded on RenewalEvent"
          - "if seats_delta > 0: that many new Seat rows are created in UNASSIGNED state on this contract"
          - "if seats_delta < 0: that many UNASSIGNED seats (oldest by created_at first) -> REVOKED"
          - "increments RecruiterContract.version by 1"

  - entity: Seat
    initial_state: UNASSIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /contracts/{contract_id}/seats/{seat_id}/assign"
        actor: SeatAdmin
        preconditions:
          - "contract.contract_status == ACTIVE"
          - "Recruiter.recruiter_status == ACTIVE"
          - "Recruiter.active_seat_id is null (recruiter does not already hold a seat)"
          - "target seat has assigned_recruiter_id == null"
          - "expected_seat_version matches current Seat.version (OCC)"
        side_effects:
          - "assigned_recruiter_id = recruiter_id; assignment_started_at = now"
          - "Recruiter.active_seat_id = seat_id"
          - "assignment_audit_count += 1"
          - "contract.seats_assigned += 1"
          - "if no OPEN QuotaLedger exists for this seat at current period_index: create one with search_quota_total = contract.monthly_search_quota_per_seat"
          - "if no OPEN MessageCreditPool exists for this seat at current period_index: create one with credits_granted = contract.monthly_credit_per_seat"
          - "increments Seat.version by 1"
      - from: ASSIGNED
        to: SUSPENDED
        trigger: "system (contract suspension cascade) or POST /contracts/{cid}/seats/{sid}/suspend"
        actor: "system or SeatAdmin"
        preconditions: []
        side_effects:
          - "any Message in response_status=AWAITING on this seat -> EXPIRED"
          - "increments Seat.version by 1"
      - from: SUSPENDED
        to: ASSIGNED
        trigger: "system (contract resume cascade) or POST /contracts/{cid}/seats/{sid}/resume"
        actor: "system or SeatAdmin"
        preconditions:
          - "contract.contract_status == ACTIVE"
        side_effects:
          - "increments Seat.version by 1"
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "POST /contracts/{cid}/seats/{sid}/unassign"
        actor: SeatAdmin
        preconditions:
          - "contract.contract_status == ACTIVE"
        side_effects:
          - "prior Recruiter.active_seat_id cleared"
          - "assigned_recruiter_id cleared; assignment_started_at cleared"
          - "contract.seats_assigned -= 1"
          - "OPEN QuotaLedger and OPEN/THROTTLED MessageCreditPool for this seat at current period remain but their owning seat is UNASSIGNED — they can no longer be consumed"
          - "increments Seat.version by 1"
      - from: UNASSIGNED
        to: REVOKED
        trigger: "system (contract expiration cascade or negative true-up)"
        actor: system
        preconditions: []
        side_effects:
          - "any OPEN/THROTTLED MessageCreditPool for this seat -> CLOSED"
          - "any OPEN QuotaLedger for this seat -> CLOSED"
      - from: ASSIGNED
        to: REVOKED
        trigger: "system (contract expiration cascade only; negative true-up never revokes ASSIGNED seats)"
        actor: system
        preconditions: []
        side_effects:
          - "Recruiter.active_seat_id cleared"
          - "contract.seats_assigned -= 1"
          - "same pool/ledger closure as UNASSIGNED -> REVOKED"

  - entity: QuotaLedger
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (searches_used crosses search_quota_total)"
        actor: system
        preconditions: []
        side_effects:
          - "further candidate_search invocations on this seat are rejected"
      - from: OPEN
        to: CLOSED
        trigger: "system (period rollover or seat revocation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "system (period rollover or seat revocation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MessageCreditPool
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: THROTTLED
        trigger: "system (spam_strike_count reaches 3 in this pool)"
        actor: system
        preconditions: []
        side_effects:
          - "further message_send invocations on this seat are rejected with ERR_ANTISPAM_THROTTLED"
      - from: THROTTLED
        to: OPEN
        trigger: "system (a response with kind=RESPONDED on a message that was SENT BEFORE the pool entered THROTTLED reduces spam_strike_count below 3 — a positive response offsets one strike; the strike memory is the pool's, not consumed by the reopen)"
        actor: system
        preconditions:
          - "spam_strike_count < 3"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (period rollover or seat revocation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: THROTTLED
        to: CLOSED
        trigger: "system (period rollover or seat revocation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Message
    initial_state: "delivery_status=PENDING, response_status=AWAITING"
    terminal_states: ["delivery_status=FAILED", "delivery_status=SENT with response_status in {RESPONDED, NEGATIVE_RESPONSE, REPORTED_AS_SPAM, EXPIRED}"]
    transitions:
      - from: "delivery_status=PENDING"
        to: "delivery_status=SENT"
        trigger: "system (dispatch succeeds immediately within the POST /messages call)"
        actor: system
        preconditions:
          - "the MessageCreditPool.credits_available >= 1 unless candidate is open-to-work with visibility ALL_MEMBERS (then credit_consumed=0)"
        side_effects:
          - "if credit_consumed == 1: pool.credits_used += 1"
      - from: "delivery_status=PENDING"
        to: "delivery_status=FAILED"
        trigger: "system (dispatch fails — e.g. candidate profile is PRIVATE and not open-to-work)"
        actor: system
        preconditions: []
        side_effects:
          - "no credit consumed"
      - from: "delivery_status=SENT, response_status=AWAITING"
        to: "response_status=RESPONDED"
        trigger: "POST /messages/{id}/record-response { response_kind: RESPONDED }"
        actor: AtsService
        preconditions:
          - "delivery_status == SENT"
          - "response_status == AWAITING"
        side_effects:
          - "if credit_consumed == 1 and credit_returned_flag == false: pool.credits_returned += 1 and credit_returned_flag = true"
          - "if pool.pool_status == THROTTLED and pool.spam_strike_count drops below 3 after this response: pool -> OPEN"
      - from: "delivery_status=SENT, response_status=AWAITING"
        to: "response_status=NEGATIVE_RESPONSE"
        trigger: "POST /messages/{id}/record-response { response_kind: NEGATIVE_RESPONSE }"
        actor: AtsService
        preconditions:
          - "delivery_status == SENT"
          - "response_status == AWAITING"
        side_effects:
          - "pool.spam_strike_count += 1"
          - "if pool.spam_strike_count >= 3: pool -> THROTTLED"
          - "no credit returned"
      - from: "delivery_status=SENT, response_status=AWAITING"
        to: "response_status=REPORTED_AS_SPAM"
        trigger: "POST /messages/{id}/record-response { response_kind: REPORTED_AS_SPAM }"
        actor: AtsService
        preconditions:
          - "delivery_status == SENT"
          - "response_status == AWAITING"
        side_effects:
          - "pool.spam_strike_count += 2"
          - "if pool.spam_strike_count >= 3: pool -> THROTTLED"
          - "no credit returned"
      - from: "delivery_status=SENT, response_status=AWAITING"
        to: "response_status=EXPIRED"
        trigger: "system (30 days elapsed since SENT, or seat suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "no credit returned"

  - entity: SearchProject
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /projects/{id}/open"
        actor: SeatAdmin
        preconditions:
          - "contract.contract_status == ACTIVE"
          - "owner_seat_id references an ASSIGNED seat on this contract"
        side_effects: []
      - from: OPEN
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: SeatAdmin
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: OPEN
        trigger: "POST /projects/{id}/open"
        actor: SeatAdmin
        preconditions:
          - "contract.contract_status == ACTIVE"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: SeatAdmin
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: SeatAdmin
        preconditions: []
        side_effects: []

  - entity: JobPosting
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{cid}/job-postings/{id}/activate"
        actor: SeatAdmin
        preconditions:
          - "contract.contract_status == ACTIVE"
          - "at least one PromotedSlot in RESERVED or CONFIRMED exists for this posting"
          - "start_at <= now < end_at"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /contracts/{cid}/job-postings/{id}/pause"
        actor: SeatAdmin
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /contracts/{cid}/job-postings/{id}/resume"
        actor: SeatAdmin
        preconditions:
          - "spent_cents < budget_cents"
          - "now < end_at"
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (spent_cents >= budget_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "all PromotedSlot in RESERVED -> RELEASED"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /contracts/{cid}/job-postings/{id}/close"
        actor: SeatAdmin
        preconditions: []
        side_effects:
          - "all PromotedSlot in RESERVED -> RELEASED"
      - from: PAUSED
        to: CLOSED
        trigger: "POST /contracts/{cid}/job-postings/{id}/close"
        actor: SeatAdmin
        preconditions: []
        side_effects:
          - "all PromotedSlot in RESERVED -> RELEASED"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /contracts/{cid}/job-postings/{id}/close"
        actor: SeatAdmin
        preconditions: []
        side_effects: []

  - entity: AtsIntegration
    initial_state: PROVISIONING
    terminal_states: [DISABLED]
    transitions:
      - from: PROVISIONING
        to: CONNECTED
        trigger: "POST /contracts/{cid}/ats-integrations/{id}/connect"
        actor: ContractAdmin
        preconditions:
          - "contract.contract_status in {ACTIVE, RENEWAL_PENDING}"
        side_effects: []
      - from: CONNECTED
        to: SYNC_ERROR
        trigger: "system (a AtsSyncRecord transitions to FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SYNC_ERROR
        to: CONNECTED
        trigger: "POST /contracts/{cid}/ats-integrations/{id}/connect"
        actor: ContractAdmin
        preconditions: []
        side_effects: []
      - from: CONNECTED
        to: DISABLED
        trigger: "POST /contracts/{cid}/ats-integrations/{id}/disable"
        actor: ContractAdmin
        preconditions: []
        side_effects:
          - "any QUEUED AtsSyncRecord -> FAILED"
      - from: SYNC_ERROR
        to: DISABLED
        trigger: "POST /contracts/{cid}/ats-integrations/{id}/disable"
        actor: ContractAdmin
        preconditions: []
        side_effects:
          - "any QUEUED AtsSyncRecord -> FAILED"

  - entity: AtsSyncRecord
    initial_state: QUEUED
    terminal_states: [WRITTEN, DUPLICATE_SKIPPED, FAILED]
    transitions:
      - from: QUEUED
        to: WRITTEN
        trigger: "system (write-back completes; only when integration_status == CONNECTED and write_back_enabled == true)"
        actor: system
        preconditions:
          - "AtsIntegration.integration_status == CONNECTED"
          - "AtsIntegration.write_back_enabled == true"
          - "no other AtsSyncRecord with the same payload_fingerprint in status WRITTEN"
        side_effects: []
      - from: QUEUED
        to: DUPLICATE_SKIPPED
        trigger: "system (a WRITTEN record with identical payload_fingerprint already exists for this integration)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: FAILED
        trigger: "system (integration DISABLED, or integration_status != CONNECTED at dispatch)"
        actor: system
        preconditions: []
        side_effects:
          - "if integration was CONNECTED, integration -> SYNC_ERROR"

  - entity: TalentInsightReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED, SUPPRESSED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /contracts/{cid}/talent-insights/{id}/generate"
        actor: ContractAdmin
        preconditions:
          - "contract.contract_status in {ACTIVE, RENEWAL_PENDING}"
        side_effects:
          - "matched_count computed by applying filter_spec against visible CandidateProfile rows"
      - from: GENERATED
        to: PUBLISHED
        trigger: "POST /contracts/{cid}/talent-insights/{id}/publish"
        actor: ContractAdmin
        preconditions:
          - "matched_count >= aggregation_floor (25)"
        side_effects: []
      - from: GENERATED
        to: SUPPRESSED
        trigger: "system (matched_count < aggregation_floor at publish attempt, or privacy-aggregation sweep marks it)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RenewalEvent
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /renewal-events/{id}/approve"
        actor: Auditor
        preconditions:
          - "contract.contract_status in {ACTIVE, RENEWAL_PENDING}"
          - "for TRUE_UP: contract.true_up_allowed == true"
        side_effects:
          - "for TRUE_UP with negative seats_delta: proration_credit_cents computed (see proration_credit calculation)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /renewal-events/{id}/reject"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /renewal-events/{id}/apply"
        actor: Auditor
        preconditions:
          - "see contract/renewal transitions"
        side_effects:
          - "see contract/renewal transitions"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: seat-assign-stale-version
    parent_entity: Seat
    write_endpoint: "POST /contracts/{contract_id}/seats/{seat_id}/assign"
    occ_field: "expected_seat_version"
    description: |
      Assigning a seat based on a stale view of Seat.version is rejected. The
      canonical case: two SeatAdmin clients both observe an UNASSIGNED seat at
      version N and both attempt to assign it to different recruiters; only the
      first assign succeeds and bumps Seat.version to N+1, so the second
      assign carrying expected_seat_version=N is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: renewal-event-stale-contract-version
    parent_entity: RecruiterContract
    write_endpoint: "POST /contracts/{contract_id}/renewal-events"
    occ_field: "expected_contract_version"
    description: |
      Creating a RenewalEvent against a RecruiterContract whose version has
      advanced since the auditor last observed it is rejected. Captures the
      case where another writer has just applied a true-up (which changes
      seats_purchased and therefore the proration baseline) and the current
      writer's view of the contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_return_on_response
    trigger: "POST /messages/{id}/record-response with response_kind=RESPONDED"
    algorithm: aggregation
    formula: |
      if credit_consumed == 1 and credit_returned_flag == false:
        credits_returned += 1
        credit_returned_flag = true
      else:
        no-op
      Then recompute credits_available = credits_granted - credits_used + credits_returned,
      floored at 0.
    input_set: "Messages with delivery_status=SENT on the seat's OPEN/THROTTLED MessageCreditPool for the current period"
    precision: "integer"
    variants:
      - name: with_return
        when: "credit_consumed == 1 and not yet returned"
        difference: "credits_returned increments by 1; credit_returned_flag flips"
      - name: no_return
        when: "credit_consumed == 0 (open-to-work ALL_MEMBERS) or already returned"
        difference: "no-op; protects against double-returns"

  - name: budget_pacing
    trigger: "POST /contracts/{cid}/job-postings/{id}/record-spend"
    algorithm: tiered_pricing
    formula: |
      total_days = whole UTC days in [start_at, end_at) (end_at - start_at, floor; validation guarantees >= 1)
      elapsed_days = whole UTC days in [start_at, today_date) plus 1, clamped to [1, total_days]; today_date = current logical UTC date
      Cumulative spend cap at end of today depends on pacing variant:
        EVEN:
          cumulative_cap = floor(budget_cents * elapsed_days / total_days)
        FRONT_LOADED:
          front_days = ceil(total_days / 2)
          if elapsed_days <= front_days:
            cumulative_cap = min(budget_cents, floor(budget_cents * 1.5 * elapsed_days / total_days))
          else:
            cumulative_cap = min(budget_cents, floor(budget_cents * (1.5 * front_days + 0.5 * (elapsed_days - front_days)) / total_days))
      Accept the spend event IFF all four hold:
        (i)   amount_cents >= 1
        (ii)  amount_cents <= daily_cap_cents
        (iii) spent_cents + amount_cents <= cumulative_cap
        (iv)  spent_cents + amount_cents <= budget_cents
      Else reject with ERR_PACING_VIOLATION.
      On accept: spent_cents += amount_cents. If spent_cents >= budget_cents, posting transitions ACTIVE -> EXHAUSTED.
    input_set: "PromotedSlot rows with slot_date == today's UTC date for this posting; posting must be ACTIVE"
    constants:
      FRONT_LOAD_FACTOR: 1.5
      TAIL_LOAD_FACTOR: 0.5
    precision: "integer cents; floor division at each floor() step"
    variants:
      - name: even
        when: "pacing_mode == EVEN"
        difference: "cumulative_cap = floor(budget_cents * elapsed_days / total_days) — uniform ramp"
      - name: front_loaded
        when: "pacing_mode == FRONT_LOADED"
        difference: "first ceil(total_days/2) days ramp at 1.5x the uniform rate, remainder at 0.5x; same total spend capacity by end_at but a different acceptance set on identical (budget, elapsed_days, amount) inputs"

  - name: spam_strike_scoring
    trigger: "POST /messages/{id}/record-response"
    algorithm: threshold
    formula: |
      strike_delta =
        NEGATIVE_RESPONSE -> 1
        REPORTED_AS_SPAM  -> 2
        RESPONDED         -> -1 if the message was SENT while the pool was OPEN (i.e. it predates the current throttle episode) and spam_strike_count > 0 else 0   (a positive response cancels one strike)
        EXPIRED           -> 0
      new_count = max(0, spam_strike_count + strike_delta)
      if new_count >= 3 and pool_status == OPEN: pool_status = THROTTLED
      if new_count < 3 and pool_status == THROTTLED: pool_status = OPEN
    input_set: "Message rows on the seat's current MessageCreditPool"
    constants:
      THROTTLE_THRESHOLD: 3
    precision: "integer"
    variants:
      - name: crossing_up
        when: "new_count crosses from < 3 to >= 3"
        difference: "triggers THROTTLED; further sends rejected"
      - name: crossing_down
        when: "new_count drops from >= 3 to < 3 via RESPONDED"
        difference: "pool reopens"

  - name: proration_credit
    trigger: "POST /renewal-events/{id}/approve with kind=TRUE_UP and seats_delta < 0"
    algorithm: forward_looking
    formula: |
      Variant selection (ELAPSED vs REMAINING) is determined by contract tier:
        RECRUITER_LITE / RECRUITER_PRO -> REMAINING
        RECRUITER_CORP                  -> ELAPSED
      period_total_days   = 30 (fixed)
      days_remaining      = ceil((current_period_end - now) / 86400); floor at 0
      days_elapsed        = period_total_days - days_remaining
      per_seat_period_cost_cents = monthly_credit_per_seat * 100   # $1 per credit as contract accounting unit
      Variant REMAINING:  proration_credit_cents = abs(seats_delta) * per_seat_period_cost_cents * days_remaining / period_total_days, rounded half-up to integer cents
      Variant ELAPSED:    proration_credit_cents = abs(seats_delta) * per_seat_period_cost_cents * days_elapsed  / period_total_days, rounded half-up to integer cents
      The two variants deliberately differ (one credits for unused remainder, the other credits only for the elapsed fraction) so identical inputs produce different outputs across tiers.
    input_set: "RenewalEvent (PROPOSED) plus the linked RecruiterContract"
    precision: "integer cents, round_half_up"
    variants:
      - name: remaining_variant
        when: "tier in {RECRUITER_LITE, RECRUITER_PRO}"
        difference: "credit proportional to days remaining"
      - name: elapsed_variant
        when: "tier == RECRUITER_CORP"
        difference: "credit proportional to days elapsed"

  - name: visibility_filter
    trigger: "POST /seats/{seat_id}/candidate-search AND talent insight matched_count compute"
    algorithm: constraint_propagation
    formula: |
      A CandidateProfile row is visible to a recruiter search IFF:
        privacy_setting == PUBLIC
        OR (privacy_setting == CONNECTIONS_ONLY AND the requester_seat's assigned_recruiter.manager_recruiter_id chain includes a recruiter whose recruiter_status == ACTIVE)  # simplified connection proxy
        OR (open_to_work == true AND open_to_work_visibility in {ALL_MEMBERS, RECRUITERS_ONLY})
      Visible candidates then pass the request's filter_spec (current_title substring, min_years_experience >=, open_to_work_only == true requires open_to_work==true).
      Result count is capped at contract.search_result_page_cap (returned list length).
      matched_count for TalentInsightReport uses the same visibility+filter logic but is NOT capped by page cap.
    input_set: "CandidateProfile rows (all statuses — there is no deletion on this entity)"
    precision: "integer count"
    variants:
      - name: recruiter_search
        when: "triggered by POST /seats/{seat_id}/candidate-search"
        difference: "result list is truncated to search_result_page_cap"
      - name: insight_aggregate
        when: "triggered by talent insight generate"
        difference: "count is uncapped; matched_count stored raw"

  - name: ats_duplicate_detection
    trigger: "POST /ats-sync-records (create) — system resolves sync_status"
    algorithm: projection
    formula: |
      payload_fingerprint = sha1_hex(vendor + "|" + external_tenant_id + "|" + candidate_id + "|" + event_type + "|" + normalized_payload_json)
      If any AtsSyncRecord under the same ats_integration_id has payload_fingerprint == new.payload_fingerprint AND sync_status == WRITTEN:
        new.sync_status = DUPLICATE_SKIPPED
      elif integration_status == CONNECTED and write_back_enabled == true:
        new.sync_status = WRITTEN
      elif integration_status == DISABLED:
        new.sync_status = FAILED
      else:
        new.sync_status = QUEUED
    input_set: "AtsSyncRecord rows under the same AtsIntegration"
    precision: "n/a"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 2.5, category: existence,           check: "Request body is well-formed: all required fields present, types match the endpoint input schema, enum values in range", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 1,  category: auth,                 check: "X-User-Role header is present and one of {ContractAdmin, SeatAdmin, RecruiterUser, AtsService, Auditor}", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Role is permitted to invoke this endpoint (per endpoint.roles)", error_id: ERR_ROLE_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Every path-parameter id (contract_id, seat_id, recruiter_id, project_id, message_id, job_posting_id, ats_integration_id, report_id, renewal_event_id) resolves to an existing entity", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3.5, category: state,               check: "OCC: expected_<parent>_version in request body equals the parent entity's current version (per §1.2.1 concurrency_rules)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /contracts/{cid}/seats/{sid}/assign, POST /contracts/{cid}/renewal-events" }
  - { priority: 4,  category: state,                check: "Entity is in the correct state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 4.1, category: state,               check: "Seat is ASSIGNED when consuming quota or credits (candidate-search, message send); UNASSIGNED/SUSPENDED/REVOKED seats cannot consume", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /seats/{seat_id}/candidate-search, POST /seats/{seat_id}/messages" }
  - { priority: 4.2, category: auth,                check: "RecruiterUser ownership: X-User-ID must equal the target seat's assigned_recruiter_id (seat non-sharing at the identity level)", error_id: ERR_ROLE_FORBIDDEN, http_status: 403, applies_to: "POST /seats/{seat_id}/candidate-search, POST /seats/{seat_id}/messages when X-User-Role == RecruiterUser" }
  - { priority: 5,  category: business_safety,      check: "Anti-spam: seat's current MessageCreditPool is not THROTTLED when sending a message", error_id: ERR_ANTISPAM_THROTTLED, http_status: 429, applies_to: "POST /seats/{seat_id}/messages" }
  - { priority: 6,  category: business_safety,      check: "Privacy: message recipient CandidateProfile is visible to the sending recruiter per visibility_filter", error_id: ERR_CANDIDATE_NOT_VISIBLE, http_status: 403, applies_to: "POST /seats/{seat_id}/messages" }
  - { priority: 7,  category: business_compliance,  check: "Seat non-sharing: recruiter does not already hold an ACTIVE seat (active_seat_id is null) when assigning", error_id: ERR_RECRUITER_ALREADY_SEATED, http_status: 409, applies_to: "POST /contracts/{cid}/seats/{sid}/assign" }
  - { priority: 8,  category: business_compliance,  check: "Seat non-sharing: seat is UNASSIGNED when assigning (cannot double-assign a seat)", error_id: ERR_SEAT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /contracts/{cid}/seats/{sid}/assign" }
  - { priority: 9,  category: business_referential, check: "Recruiter.manager_recruiter_id (when provided) references an ACTIVE Recruiter", error_id: ERR_MANAGER_INACTIVE, http_status: 422, applies_to: "POST /recruiters" }
  - { priority: 10, category: business_constraint,  check: "TalentInsightReport matched_count >= aggregation_floor (25) at publish", error_id: ERR_AGGREGATION_FLOOR, http_status: 422, applies_to: "POST /contracts/{cid}/talent-insights/{id}/publish" }
  - { priority: 11, category: business_fiscal,      check: "MessageCreditPool.credits_available >= 1 for credit-consuming send", error_id: ERR_NO_CREDITS_REMAINING, http_status: 402, applies_to: "POST /seats/{seat_id}/messages" }
  - { priority: 12, category: business_fiscal,      check: "QuotaLedger.searches_remaining >= 1 when invoking candidate-search", error_id: ERR_QUOTA_EXHAUSTED, http_status: 402, applies_to: "POST /seats/{seat_id}/candidate-search" }
  - { priority: 13, category: business_fiscal,      check: "JobPosting spend event does not breach pacing rule (budget_pacing_even / _front_loaded)", error_id: ERR_PACING_VIOLATION, http_status: 422, applies_to: "POST /contracts/{cid}/job-postings/{id}/record-spend" }
  - { priority: 14, category: business_fiscal,      check: "True-up: seats_purchased + seats_delta within [seats_assigned, seat_cap]", error_id: ERR_TRUEUP_BOUNDS, http_status: 422, applies_to: "POST /renewal-events/{id}/approve" }
  - { priority: 15, category: business_temporal,    check: "JobPosting.start_at < end_at AND end_at - start_at >= 1 day; PromotedSlot.slot_date within [start_at.date, end_at.date)", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "POST /contracts/{cid}/job-postings and POST /contracts/{cid}/job-postings/{id}/promoted-slots" }
  - { priority: 16, category: business_constraint,  check: "Uniqueness: Seat.seat_label unique within contract; SearchProject.name unique within contract; AtsIntegration (vendor, external_tenant_id) unique within contract; contract_number unique tenant-wide; Recruiter.email unique tenant-wide", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "creation endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Contracts ---
  - { method: POST,   path: "/contracts",                                                              description: "Create a recruiter contract", roles: [ContractAdmin], code: 201, input: [contract_number, product_tier, seat_cap, "true_up_allowed?"], output: RecruiterContract, side_effects: ["seats_purchased=0; status=PENDING_ACTIVATION"] }
  - { method: GET,    path: "/contracts/{contract_id}",                                                description: "Fetch a contract", roles: [ContractAdmin, SeatAdmin, Auditor], code: 200, input: [], output: RecruiterContract, side_effects: [] }
  - { method: GET,    path: "/contracts",                                                              description: "List contracts (paginated)", roles: [ContractAdmin, Auditor], code: 200, input: ["limit?", "offset?", "product_tier?", "contract_status?"], output: "RecruiterContract[]", side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/activate",                                       description: "Activate a PENDING_ACTIVATION contract; starts period 1", roles: [ContractAdmin], code: 200, input: [seats_purchased_initial], output: RecruiterContract, side_effects: ["sets seats_purchased; creates seats_purchased UNASSIGNED Seat rows; bumps version"] }
  - { method: POST,   path: "/contracts/{contract_id}/suspend",                                        description: "Suspend an ACTIVE contract", roles: [Auditor], code: 200, input: [], output: RecruiterContract, side_effects: ["seats -> SUSPENDED; AWAITING messages -> EXPIRED"] }
  - { method: POST,   path: "/contracts/{contract_id}/resume",                                         description: "Resume a SUSPENDED contract", roles: [ContractAdmin], code: 200, input: [], output: RecruiterContract, side_effects: ["seats revert to ASSIGNED"] }

  # --- Seats ---
  - { method: GET,    path: "/contracts/{id}/seats",                                          description: "List seats for a contract (paginated)", roles: [ContractAdmin, SeatAdmin, Auditor], code: 200, input: ["limit?", "offset?", "seat_status?"], output: "Seat[]", side_effects: [] }
  - { method: GET,    path: "/contracts/{contract_id}/seats/{seat_id}",                                description: "Fetch a seat", roles: [ContractAdmin, SeatAdmin, Auditor, RecruiterUser], code: 200, input: [], output: Seat, side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/seats/{seat_id}/assign",                         description: "Assign seat to recruiter (OCC)", roles: [SeatAdmin], code: 200, input: [recruiter_id, expected_seat_version], output: Seat, side_effects: ["per Seat.UNASSIGNED->ASSIGNED; creates OPEN QuotaLedger + OPEN MessageCreditPool; increments Seat.version by 1"] }
  - { method: POST,   path: "/contracts/{contract_id}/seats/{seat_id}/unassign",                       description: "Unassign a seat from its recruiter", roles: [SeatAdmin], code: 200, input: [], output: Seat, side_effects: ["recruiter.active_seat_id cleared; contract.seats_assigned -= 1"] }
  - { method: POST,   path: "/contracts/{contract_id}/seats/{seat_id}/suspend",                        description: "Suspend a single seat", roles: [SeatAdmin], code: 200, input: [], output: Seat, side_effects: ["AWAITING messages on this seat -> EXPIRED"] }
  - { method: POST,   path: "/contracts/{contract_id}/seats/{seat_id}/resume",                         description: "Resume a suspended seat", roles: [SeatAdmin], code: 200, input: [], output: Seat, side_effects: [] }

  # --- Recruiters ---
  - { method: POST,   path: "/recruiters",                                                             description: "Onboard a recruiter", roles: [ContractAdmin], code: 201, input: [email, full_name, home_contract_id, "manager_recruiter_id?"], output: Recruiter, side_effects: ["status=ACTIVE"] }
  - { method: GET,    path: "/recruiters/{recruiter_id}",                                              description: "Fetch a recruiter", roles: [ContractAdmin, SeatAdmin, Auditor], code: 200, input: [], output: Recruiter, side_effects: [] }
  - { method: GET,    path: "/recruiters",                                                             description: "List recruiters (paginated; soft-deleted excluded by default)", roles: [ContractAdmin, SeatAdmin, Auditor], code: 200, input: ["limit?", "offset?", "recruiter_status?", "home_contract_id?", "manager_recruiter_id?", "active_seat_id?"], output: "Recruiter[]", side_effects: [] }
  - { method: POST,   path: "/recruiters/{recruiter_id}/deactivate",                                   description: "Soft-delete a recruiter", roles: [ContractAdmin], code: 200, input: [], output: Recruiter, side_effects: ["if active_seat_id set, that seat -> UNASSIGNED and contract.seats_assigned -= 1"] }

  # --- Quota & credit introspection ---
  - { method: GET,    path: "/seats/{seat_id}",                                                        description: "Fetch a seat by id (FK reverse-reachability anchor)", roles: [ContractAdmin, SeatAdmin, Auditor, RecruiterUser], code: 200, input: [], output: Seat, side_effects: [] }
  - { method: GET,    path: "/seats/{id}/projects",                                               description: "List projects owned by a seat", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: ["limit?", "offset?"], output: "SearchProject[]", side_effects: [] }
  - { method: GET,    path: "/seats/{id}/job-postings",                                           description: "List job postings created by a seat", roles: [SeatAdmin, Auditor], code: 200, input: ["limit?", "offset?"], output: "JobPosting[]", side_effects: [] }
  - { method: GET,    path: "/seats/{id}/quota-ledgers",                                          description: "List quota ledgers for a seat", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: ["period_index?"], output: "QuotaLedger[]", side_effects: [] }
  - { method: GET,    path: "/seats/{id}/credit-pools",                                           description: "List credit pools for a seat", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: ["period_index?"], output: "MessageCreditPool[]", side_effects: [] }

  # --- Candidate profiles & search ---
  - { method: POST,   path: "/candidate-profiles",                                                     description: "Create a candidate profile (test-driving data setup)", roles: [ContractAdmin], code: 201, input: [member_id, full_name, headline, privacy_setting, open_to_work, open_to_work_visibility, years_experience, current_title], output: CandidateProfile, side_effects: [] }
  - { method: GET,    path: "/candidate-profiles/{candidate_id}",                                      description: "Fetch a candidate profile", roles: [ContractAdmin, SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: CandidateProfile, side_effects: [] }
  - { method: GET,    path: "/candidate-profiles/{id}/messages",                             description: "List messages addressed to a candidate", roles: [ContractAdmin, Auditor], code: 200, input: ["limit?", "offset?"], output: "Message[]", side_effects: [] }
  - { method: POST,   path: "/seats/{seat_id}/candidate-search",                                       description: "Run a candidate search; consumes 1 search quota", roles: [RecruiterUser, SeatAdmin], code: 200, input: [filter_spec], output: "CandidateProfile[]", side_effects: ["QuotaLedger.searches_used += 1; transitions OPEN->EXHAUSTED at cap"] }

  # --- Projects ---
  - { method: POST,   path: "/contracts/{id}/projects",                                       description: "Create a search project", roles: [SeatAdmin], code: 201, input: [name, owner_seat_id, "pinned_candidate_ids?"], output: SearchProject, side_effects: [] }
  - { method: GET,    path: "/contracts/{contract_id}/projects/{project_id}",                          description: "Fetch a project", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: SearchProject, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/projects",                                       description: "List projects for a contract", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: ["limit?", "offset?", "project_status?", "owner_seat_id?"], output: "SearchProject[]", side_effects: [] }
  - { method: POST,   path: "/projects/{project_id}/open",                                             description: "Open a project (DRAFT->OPEN or ON_HOLD->OPEN)", roles: [SeatAdmin], code: 200, input: [], output: SearchProject, side_effects: [] }
  - { method: GET,    path: "/projects/{project_id}",                                                  description: "Fetch a project by id (FK reverse-reachability anchor)", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: SearchProject, side_effects: [] }
  - { method: POST,   path: "/projects/{project_id}/hold",                                             description: "Place a project on hold", roles: [SeatAdmin], code: 200, input: [], output: SearchProject, side_effects: [] }
  - { method: POST,   path: "/projects/{project_id}/close",                                            description: "Close a project", roles: [SeatAdmin], code: 200, input: [], output: SearchProject, side_effects: [] }

  # --- Messages ---
  - { method: POST,   path: "/seats/{id}/messages",                                               description: "Send an InMail message; consumes a credit unless open-to-work ALL_MEMBERS", roles: [RecruiterUser, SeatAdmin], code: 201, input: [candidate_id, project_id, body, "job_posting_id?"], output: Message, side_effects: ["delivery PENDING->SENT or FAILED; pool accounting; spam-strike hooks"] }
  - { method: GET,    path: "/messages/{message_id}",                                                  description: "Fetch a message", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: Message, side_effects: [] }
  - { method: GET,    path: "/messages",                                                               description: "List messages (filtered by project or job posting)", roles: [SeatAdmin, Auditor], code: 200, input: ["project_id?", "job_posting_id?", "limit?", "offset?"], output: "Message[]", side_effects: [] }
  - { method: GET,    path: "/seats/{id}/messages",                                               description: "List messages sent by a seat", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: ["limit?", "offset?", "delivery_status?", "response_status?"], output: "Message[]", side_effects: [] }
  - { method: POST,   path: "/messages/{message_id}/record-response",                                  description: "Record candidate response; triggers credit return / strike", roles: [AtsService], code: 200, input: [response_kind], output: Message, side_effects: ["per Message transitions; may flip pool THROTTLED<->OPEN"] }

  # --- Job postings & promoted slots ---
  - { method: POST,   path: "/contracts/{id}/job-postings",                                   description: "Create a job posting", roles: [SeatAdmin], code: 201, input: [title, budget_cents, daily_cap_cents, pacing_mode, start_at, end_at, created_by_seat_id], output: JobPosting, side_effects: ["spent_cents=0; status=DRAFT"] }
  - { method: GET,    path: "/contracts/{contract_id}/job-postings/{job_posting_id}",                  description: "Fetch a job posting", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: JobPosting, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/job-postings",                                   description: "List postings for a contract", roles: [SeatAdmin, Auditor], code: 200, input: ["limit?", "offset?", "posting_status?"], output: "JobPosting[]", side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/job-postings/{job_posting_id}/activate",         description: "Activate a posting (requires >=1 RESERVED/CONFIRMED slot)", roles: [SeatAdmin], code: 200, input: [], output: JobPosting, side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/job-postings/{job_posting_id}/pause",            description: "Pause a posting", roles: [SeatAdmin], code: 200, input: [], output: JobPosting, side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/job-postings/{job_posting_id}/resume",           description: "Resume a posting", roles: [SeatAdmin], code: 200, input: [], output: JobPosting, side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/job-postings/{job_posting_id}/close",            description: "Close a posting", roles: [SeatAdmin], code: 200, input: [], output: JobPosting, side_effects: ["RESERVED slots -> RELEASED"] }
  - { method: POST,   path: "/contracts/{id}/job-postings/{job_posting_id}/promoted-slots",   description: "Reserve a promoted slot for a UTC day", roles: [SeatAdmin], code: 201, input: [slot_date, reserved_cents], output: PromotedSlot, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/job-postings/{job_posting_id}/promoted-slots",   description: "List promoted slots for a posting", roles: [SeatAdmin, Auditor], code: 200, input: ["slot_status?"], output: "PromotedSlot[]", side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/job-postings/{job_posting_id}/record-spend",     description: "Record spend against a promoted slot for today; enforces pacing", roles: [SeatAdmin], code: 200, input: [amount_cents], output: JobPosting, side_effects: ["spent_cents += amount_cents; transitions to EXHAUSTED at budget"] }
  - { method: GET,    path: "/job-postings/{job_posting_id}",                                          description: "Fetch a job posting by id (FK reverse-reachability anchor)", roles: [SeatAdmin, RecruiterUser, Auditor], code: 200, input: [], output: JobPosting, side_effects: [] }
  - { method: GET,    path: "/job-postings/{id}/promoted-slots",                           description: "List promoted slots for a posting (top-level form)", roles: [SeatAdmin, Auditor], code: 200, input: ["slot_status?", "limit?", "offset?"], output: "PromotedSlot[]", side_effects: [] }

  # --- ATS integrations & sync records ---
  - { method: POST,   path: "/contracts/{id}/ats-integrations",                               description: "Create an ATS integration", roles: [ContractAdmin], code: 201, input: [vendor, external_tenant_id, "write_back_enabled?"], output: AtsIntegration, side_effects: ["status=PROVISIONING"] }
  - { method: GET,    path: "/contracts/{contract_id}/ats-integrations/{integration_id}",              description: "Fetch an integration", roles: [ContractAdmin, Auditor], code: 200, input: [], output: AtsIntegration, side_effects: [] }
  - { method: GET,    path: "/ats-integrations/{integration_id}",                                      description: "Fetch an integration by id (FK reverse-reachability anchor)", roles: [ContractAdmin, Auditor], code: 200, input: [], output: AtsIntegration, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/ats-integrations",                               description: "List integrations", roles: [ContractAdmin, Auditor], code: 200, input: ["vendor?", "integration_status?"], output: "AtsIntegration[]", side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/ats-integrations/{integration_id}/connect",      description: "Mark integration CONNECTED (PROVISIONING->CONNECTED or SYNC_ERROR->CONNECTED)", roles: [ContractAdmin], code: 200, input: [], output: AtsIntegration, side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/ats-integrations/{integration_id}/disable",      description: "Disable an integration", roles: [ContractAdmin], code: 200, input: [], output: AtsIntegration, side_effects: ["QUEUED records -> FAILED"] }
  - { method: POST,   path: "/ats-sync-records",                                                       description: "Create an ATS sync record; server computes fingerprint and duplicate status", roles: [AtsService], code: 201, input: [ats_integration_id, candidate_id, external_candidate_ref, event_type, payload], output: AtsSyncRecord, side_effects: ["ats_duplicate_detection calculation"] }
  - { method: GET,    path: "/ats-sync-records/{record_id}",                                           description: "Fetch a sync record", roles: [ContractAdmin, Auditor], code: 200, input: [], output: AtsSyncRecord, side_effects: [] }
  - { method: GET,    path: "/ats-sync-records",                                                       description: "List sync records (filtered)", roles: [ContractAdmin, Auditor], code: 200, input: ["ats_integration_id?", "candidate_id?", "sync_status?", "limit?", "offset?"], output: "AtsSyncRecord[]", side_effects: [] }

  # --- Talent insights ---
  - { method: POST,   path: "/contracts/{id}/talent-insights",                                description: "Create a talent insight report (DRAFT)", roles: [ContractAdmin], code: 201, input: [report_name, filter_spec], output: TalentInsightReport, side_effects: [] }
  - { method: GET,    path: "/contracts/{contract_id}/talent-insights/{report_id}",                    description: "Fetch a report", roles: [ContractAdmin, Auditor], code: 200, input: [], output: TalentInsightReport, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/talent-insights",                                description: "List reports for a contract", roles: [ContractAdmin, Auditor], code: 200, input: ["report_status?", "limit?", "offset?"], output: "TalentInsightReport[]", side_effects: [] }
  - { method: POST,   path: "/contracts/{contract_id}/talent-insights/{report_id}/generate",           description: "Compute matched_count (DRAFT->GENERATED)", roles: [ContractAdmin], code: 200, input: [], output: TalentInsightReport, side_effects: ["visibility_filter calculation"] }
  - { method: POST,   path: "/contracts/{contract_id}/talent-insights/{report_id}/publish",            description: "Publish a report (GENERATED->PUBLISHED or SUPPRESSED if below floor)", roles: [ContractAdmin], code: 200, input: [], output: TalentInsightReport, side_effects: ["ERR_AGGREGATION_FLOOR when matched_count < 25"] }

  # --- Renewal events ---
  - { method: POST,   path: "/contracts/{id}/renewal-events",                                 description: "Propose a renewal/true-up/suspension event (OCC on contract)", roles: [Auditor], code: 201, input: [event_kind, "seats_delta?", expected_contract_version], output: RenewalEvent, side_effects: ["status=PROPOSED", "increments RecruiterContract.version by 1"] }
  - { method: GET,    path: "/renewal-events/{renewal_event_id}",                                      description: "Fetch a renewal event", roles: [Auditor, ContractAdmin], code: 200, input: [], output: RenewalEvent, side_effects: [] }
  - { method: GET,    path: "/contracts/{id}/renewal-events",                                 description: "List renewal events", roles: [Auditor, ContractAdmin], code: 200, input: ["event_status?", "event_kind?"], output: "RenewalEvent[]", side_effects: [] }
  - { method: POST,   path: "/renewal-events/{renewal_event_id}/approve",                              description: "Approve a proposed event; computes proration_credit for TRUE_UP", roles: [Auditor], code: 200, input: [], output: RenewalEvent, side_effects: ["proration_credit calculation"] }
  - { method: POST,   path: "/renewal-events/{renewal_event_id}/reject",                               description: "Reject a proposed event", roles: [Auditor], code: 200, input: [], output: RenewalEvent, side_effects: [] }
  - { method: POST,   path: "/renewal-events/{renewal_event_id}/apply",                                description: "Apply an approved event; mutates contract", roles: [Auditor], code: 200, input: [], output: RenewalEvent, side_effects: ["per contract transitions"] }

  # --- Test-driving (logical clock) ---
  - { method: POST,   path: "/_clock/set_current_utc",                                                 description: "Set the server's logical UTC clock. Default before any set: 2026-09-01T00:00:00Z", roles: [ContractAdmin], code: 200, input: [to_iso8601], output: "{ now_iso8601: string }", side_effects: ["drives period rollover, EXPIRED messages, RENEWAL_PENDING transitions"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing or unrecognized X-User-Role" }
  - { id: ERR_ROLE_FORBIDDEN,            http: 403, condition: "Role not permitted to invoke this endpoint" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Path id does not resolve" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Entity not in required state for the transition" }
  - { id: ERR_STALE_VERSION,             http: 412, condition: "OCC expected_*_version does not match current version" }
  - { id: ERR_DUPLICATE,                 http: 409, condition: "Unique constraint violated (contract_number, seat_label within contract, project name within contract, email, vendor+external_tenant_id within contract)" }
  - { id: ERR_RECRUITER_ALREADY_SEATED,  http: 409, condition: "Recruiter.active_seat_id is non-null when assigning" }
  - { id: ERR_SEAT_NOT_AVAILABLE,        http: 409, condition: "Seat.seat_status != UNASSIGNED when assigning" }
  - { id: ERR_MANAGER_INACTIVE,          http: 422, condition: "manager_recruiter_id references a non-ACTIVE recruiter" }
  - { id: ERR_NO_CREDITS_REMAINING,      http: 402, condition: "MessageCreditPool.credits_available == 0 and message would consume a credit" }
  - { id: ERR_QUOTA_EXHAUSTED,           http: 402, condition: "QuotaLedger.searches_remaining == 0" }
  - { id: ERR_ANTISPAM_THROTTLED,        http: 429, condition: "Seat's current MessageCreditPool is THROTTLED" }
  - { id: ERR_CANDIDATE_NOT_VISIBLE,     http: 403, condition: "Target CandidateProfile not visible to the requesting recruiter per visibility_filter" }
  - { id: ERR_PACING_VIOLATION,          http: 422, condition: "Spend event would breach pacing rule or exceed budget" }
  - { id: ERR_INVALID_DATE_RANGE,        http: 422, condition: "Posting start/end range invalid, or slot_date outside posting range" }
  - { id: ERR_AGGREGATION_FLOOR,         http: 422, condition: "TalentInsightReport.matched_count < 25 at publish" }
  - { id: ERR_TRUEUP_BOUNDS,             http: 422, condition: "seats_purchased + seats_delta would fall below seats_assigned or outside [1, seat_cap]" }
  - { id: ERR_INVALID_REQUEST,           http: 400, condition: "Generic request shape error (missing required field, wrong type)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractAdmin
    description: "Top-tier operator of the contract; provisions contracts, integrations, insights, recruiters"
    identity: opaque
    exclusive_operations:
      - "POST /contracts"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/resume"
      - "POST /recruiters"
      - "POST /recruiters/{id}/deactivate"
      - "POST /contracts/{id}/ats-integrations"
      - "POST /contracts/{id}/ats-integrations/{id}/connect"
      - "POST /contracts/{id}/ats-integrations/{id}/disable"
      - "POST /contracts/{id}/talent-insights"
      - "POST /contracts/{id}/talent-insights/{id}/generate"
      - "POST /contracts/{id}/talent-insights/{id}/publish"
      - "POST /candidate-profiles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /contracts"
      - "GET /contracts/{id}"
      - "GET /recruiters"
      - "GET /recruiters/{id}"
      - "GET /renewal-events/{id}"
      - "GET /contracts/{id}/renewal-events"
      - "GET /ats-sync-records"
      - "GET /ats-sync-records/{id}"
      - "GET /seats/{id}"
      - "GET /projects/{id}"
      - "GET /job-postings/{id}"
      - "GET /ats-integrations/{id}"
      - "GET /candidate-profiles/{id}"
      - "GET /candidate-profiles/{id}/messages"
      - "GET /contracts/{id}/seats"
      - "GET /contracts/{id}/seats/{seat_id}"
      - "GET /contracts/{id}/projects"
      - "GET /contracts/{id}/projects/{project_id}"
      - "GET /contracts/{id}/job-postings"
      - "GET /contracts/{id}/job-postings/{job_posting_id}"
      - "GET /contracts/{id}/job-postings/{job_posting_id}/promoted-slots"
      - "GET /job-postings/{id}/promoted-slots"
      - "GET /contracts/{id}/ats-integrations"
      - "GET /contracts/{id}/ats-integrations/{integration_id}"
      - "GET /contracts/{id}/talent-insights"
      - "GET /contracts/{id}/talent-insights/{report_id}"
      - "GET /seats/{id}/projects"
      - "GET /seats/{id}/job-postings"
      - "GET /seats/{id}/quota-ledgers"
      - "GET /seats/{id}/credit-pools"
      - "GET /seats/{id}/messages"
      - "GET /messages/{id}"
      - "GET /messages"

  - name: SeatAdmin
    description: "Operator managing seats, projects, and postings within an existing contract"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{cid}/seats/{sid}/assign"
      - "POST /contracts/{cid}/seats/{sid}/unassign"
      - "POST /contracts/{cid}/seats/{sid}/suspend"
      - "POST /contracts/{cid}/seats/{sid}/resume"
      - "POST /contracts/{cid}/projects"
      - "POST /projects/{id}/open"
      - "POST /projects/{id}/hold"
      - "POST /projects/{id}/close"
      - "POST /contracts/{cid}/job-postings"
      - "POST /contracts/{cid}/job-postings/{id}/activate"
      - "POST /contracts/{cid}/job-postings/{id}/pause"
      - "POST /contracts/{cid}/job-postings/{id}/resume"
      - "POST /contracts/{cid}/job-postings/{id}/close"
      - "POST /contracts/{cid}/job-postings/{id}/promoted-slots"
      - "POST /contracts/{cid}/job-postings/{id}/record-spend"
    shared_operations:
      - "GET /contracts/{cid}/seats"
      - "GET /contracts/{cid}/seats/{sid}"
      - "GET /seats/{id}"
      - "GET /seats/{id}/projects"
      - "GET /seats/{id}/job-postings"
      - "GET /projects/{id}"
      - "GET /job-postings/{id}"
      - "GET /messages"
      - "POST /seats/{sid}/candidate-search"
      - "POST /seats/{sid}/messages"
      - "GET /seats/{sid}/quota-ledgers"
      - "GET /seats/{sid}/credit-pools"
      - "GET /seats/{sid}/messages"

  - name: RecruiterUser
    description: "The seated recruiter performing day-to-day search and messaging; X-User-ID equals the Recruiter.id"
    identity: entity_backed:Recruiter
    exclusive_operations: []
    shared_operations:
      - "POST /seats/{sid}/candidate-search"
      - "POST /seats/{sid}/messages"
      - "GET /seats/{sid}/quota-ledgers"
      - "GET /seats/{sid}/credit-pools"
      - "GET /seats/{sid}/messages"
      - "GET /seats/{id}"
      - "GET /seats/{id}/projects"
      - "GET /contracts/{cid}/seats/{sid}"
      - "GET /contracts/{cid}/projects"
      - "GET /contracts/{cid}/projects/{id}"
      - "GET /projects/{id}"
      - "GET /contracts/{cid}/job-postings/{id}"
      - "GET /job-postings/{id}"
      - "GET /candidate-profiles/{id}"
      - "GET /messages/{id}"

  - name: AtsService
    description: "Machine role invoked by ATS webhooks to record responses and sync records"
    identity: opaque
    exclusive_operations:
      - "POST /messages/{id}/record-response"
      - "POST /ats-sync-records"
    shared_operations: []

