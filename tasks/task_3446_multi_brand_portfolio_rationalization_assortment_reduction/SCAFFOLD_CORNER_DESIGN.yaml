# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_3446_multi_brand_portfolio_rationalization_assortment_reduction
# Sections per claim-extraction-guide; stubs mark corners already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_item_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Item.fields.sku_code, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "Omitting required sku_code on POST /portfolio/items fails 400 ERR_INVALID_REQUEST before any existence or state check runs."
        test_recipe:
          setup: ["Brand B and Plant P exist"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-EN1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-EN1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"
            - "GET /portfolio/items?brand_id=${b_id} returns empty array (nothing persisted)"
      - name: item_salvageable_defaults_false_when_omitted
        claim_type: defaults
        grounds: [entities.Item.fields.salvageable]
        distinguishing_aspect: "The optional salvageable field defaults to false, and the STANDARD obsolescence variant therefore applies by default."
        test_recipe:
          setup: ["Brand B and Plant P exist"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-EN2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-EN2", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-EN2", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { salv: $.data.salvageable, st: $.data.item_status } }
          assert:
            - "salvageable == false in the creation response (default applied, not null)"
            - "item_status == LISTED (initial state)"
      - name: brand_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Brand, response_envelope]
        distinguishing_aspect: "Client-supplied id/created_at/version in the create body are ignored: the server mints a UUID id, stamps created_at from the logical clock, and initializes version to 1."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /portfolio/brands", payload: { name: "B-EN3", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000, id: "client-supplied-id", version: 99 }, as: PortfolioManager, captures: { rid: $.data.id, rver: $.data.version, rcat: $.data.created_at } }
          assert:
            - "rid != 'client-supplied-id' (server-minted UUID)"
            - "rver == 1 (system-initialized, input ignored)"
            - "rcat == 2026-09-01T00:00:00.000Z (logical clock, three fractional digits)"
      - name: invalid_enum_risk_rating_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Retailer.fields.risk_rating, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "risk_rating is enum LOW|MEDIUM|HIGH; 'EXTREME' is rejected 400 at priority 4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /portfolio/retailers", payload: { name: "R-EN4", risk_rating: "EXTREME" }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"
      - name: get_item_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Item, "endpoints[GET /portfolio/items/{id}]"]
        distinguishing_aspect: "GET by id round-trips every stored input field plus system fields; computed and input fields keep creation values."
        test_recipe:
          setup: ["Brand B, Plant P, Item I created with known field values"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-EN5", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-EN5", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-EN5", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 42 }, as: PortfolioManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: FinanceController, captures: { sku: $.data.sku_code, oh: $.data.units_on_hand, sold: $.data.units_sold_cumulative, wo: $.data.units_written_off_cumulative, chg: $.data.obsolescence_charge_cents } }
          assert:
            - "sku == SKU-EN5 and units_on_hand == 42 (input fields round-trip)"
            - "units_sold_cumulative == 0 and units_written_off_cumulative == 0 and obsolescence_charge_cents == 0 (system defaults)"
            - "sell_through_deadline is null (no approved case)"
      - name: get_nonexistent_item_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /portfolio/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"
      - name: qualification_run_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.QualificationRun]
        distinguishing_aspect: "QualificationRun has common_fields false: its response carries id and created_at but NO version and NO updated_at, and there is no update endpoint — runs are append-only."
        test_recipe:
          setup: ["Brand B, Plants S and T, Item I at S, transfer PLANNED S->T"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-EN7", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-EN7-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-EN7-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-EN7", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { rid: $.data.id, res: $.data.result, cert: $.data.certifier_plant_id } }
          assert:
            - "run response has id and created_at but no 'version' and no 'updated_at' key"
            - "result == PASS and certifier_plant_id == ${pt_id} (stamped from X-User-ID)"
            - "GET /portfolio/product-transfers/${t_id}/qualification-runs returns exactly 1 run"
  - section: state_machines
    instances:
      - name: brand_created_active_initial_state
        claim_type: initial_state
        grounds: [state_machines.Brand]
        distinguishing_aspect: "A newly created brand starts ACTIVE with version 1 before any divestiture touches it."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM1", category_name: "storage", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { st: $.data.brand_status, ver: $.data.version } }
          assert:
            - "brand_status == ACTIVE and version == 1"
      - name: case_create_moves_item_to_cut_proposed
        claim_type: side_effect_execution
        grounds: [state_machines.Item.LISTED_to_CUT_PROPOSED, "endpoints[POST /portfolio/rationalization-cases]"]
        distinguishing_aspect: "Case creation cascades to the item: item_status becomes CUT_PROPOSED and Item.version increments by 1 (from 1 to 2)."
        test_recipe:
          setup: ["Brand B, Plant P, Item I LISTED (version 1)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM2", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-SM2", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_st: $.data.case_status, c_prop: $.data.proposer_user_id } }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { i_st: $.data.item_status, i_v: $.data.version } }
          assert:
            - "case_status == SCORED (initial state) and proposer_user_id == pm-proposer-1"
            - "item_status == CUT_PROPOSED and version == 2 (cascade bumped it once)"
      - name: sign_spa_creates_tsa_draft_and_brand_divesting
        claim_type: side_effect_execution
        grounds: [state_machines.Divestiture.PROPOSED_to_SPA_SIGNED, state_machines.Brand.UNDER_REVIEW_to_DIVESTING]
        distinguishing_aspect: "sign-spa's cascade creates exactly one TSA in DRAFT with the supplied fee/window and moves the brand UNDER_REVIEW -> DIVESTING."
        test_recipe:
          setup: ["Non-core brand B with an open divestiture (PROPOSED)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM3", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 75000, tsa_start_date: "2026-09-15T00:00:00Z", tsa_end_date: "2027-09-15T00:00:00Z" }, as: PortfolioManager, captures: { d_st: $.data.divestiture_status } }
            - { call: "GET /portfolio/tsas?divestiture_id=${d_id}", payload: {}, as: PortfolioManager, captures: { tsa_st: "$.data[0].tsa_status", tsa_fee: "$.data[0].monthly_fee_cents" } }
            - { call: "GET /portfolio/brands", payload: {}, as: PortfolioManager, captures: { b_st: "$.data[0].brand_status" } }
          assert:
            - "divestiture_status == SPA_SIGNED"
            - "exactly one TSA exists for the divestiture: tsa_status == DRAFT and monthly_fee_cents == 75000"
            - "brand_status == DIVESTING"
      - name: close_activates_tsa_and_brand_divested
        claim_type: side_effect_execution
        grounds: [state_machines.Divestiture.SPA_SIGNED_to_CLOSED, state_machines.TransitionServiceAgreement.DRAFT_to_ACTIVE, state_machines.Brand.DIVESTING_to_DIVESTED]
        distinguishing_aspect: "close fires a three-way side effect: divestiture CLOSED, TSA DRAFT -> ACTIVE, brand DIVESTING -> DIVESTED, in one request."
        test_recipe:
          setup: ["Divestiture SPA_SIGNED with TSA start 2026-09-01 (default clock satisfies the start guard)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM4", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 75000, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager, captures: { d_st: $.data.divestiture_status } }
            - { call: "GET /portfolio/tsas?divestiture_id=${d_id}", payload: {}, as: PortfolioManager, captures: { tsa_st: "$.data[0].tsa_status" } }
            - { call: "GET /portfolio/brands", payload: {}, as: PortfolioManager, captures: { b_st: "$.data[0].brand_status" } }
          assert:
            - "divestiture_status == CLOSED"
            - "tsa_status == ACTIVE"
            - "brand_status == DIVESTED"
      - name: decide_on_executing_case_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RationalizationCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide is valid only from SCORED; an EXECUTING case rejects a second decide with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case C approved (EXECUTING) on Item I"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM5", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM5", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-SM5", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "REJECT" }, as: PortfolioManager, as_user_id: "pm-decider-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and http status 409"
            - "GET /portfolio/rationalization-cases/${c_id} still shows EXECUTING (no flip-flop)"
      - name: finalize_from_scored_case_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RationalizationCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "finalize requires EXECUTING; calling it on a SCORED (undecided) case fails ERR_INVALID_STATE regardless of clock position."
        test_recipe:
          setup: ["Case C SCORED on Item I"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM6", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM6", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-SM6", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and http status 409"
            - "item remains CUT_PROPOSED (no side effects fired)"
      - name: rejected_case_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RationalizationCase]
        distinguishing_aspect: "REJECTED is terminal: decide and finalize on a REJECTED case both fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case C REJECTED on Item I (item back to LISTED)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM7", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM7", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-SM7", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "REJECT" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-2", captures: { err1: $.data.error_id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE"
            - "case remains REJECTED and item remains LISTED"
      - name: sign_spa_on_closed_divestiture_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Divestiture, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "sign-spa is valid only from PROPOSED; a CLOSED divestiture rejects a second sign-spa."
        test_recipe:
          setup: ["Divestiture CLOSED (TSA ACTIVE)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM8", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 75000, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 99000, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /portfolio/tsas?divestiture_id=${d_id} still returns exactly one TSA with monthly_fee_cents == 75000 (no duplicate TSA created)"
      - name: run_on_executed_transfer_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductTransfer, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "EXECUTED is terminal: a third qualification run after auto-execution (2 consecutive PASSes) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Transfer EXECUTED after two PASS runs"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM9", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM9-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM9-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-SM9", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-03T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-04T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (EXECUTED terminal; no further runs accepted)"
            - "GET /portfolio/product-transfers/${t_id}/qualification-runs still returns exactly 2 runs"
      - name: sell_down_on_discontinued_item_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Item, "errors[ERR_INVALID_STATE]", "endpoints[POST /portfolio/items/{id}/sell-down]"]
        distinguishing_aspect: "sell-down is legal only while LISTED or SELL_THROUGH; a DISCONTINUED item rejects it with ERR_INVALID_STATE (state priority 7 fires before the OCC check at priority 23)."
        test_recipe:
          setup: ["Item I DISCONTINUED via approved + finalized case (clock advanced past deadline); item version captured pre-trigger"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM10", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM10", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-SM10", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 50 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: SupplyChainPlanner, captures: { i_v: $.data.version, i_st: $.data.item_status } }
          trigger:
            - { call: "POST /portfolio/items/${i_id}/sell-down", payload: { units_sold: 1, expected_item_version: "${i_v}" }, as: SupplyChainPlanner, captures: { err: $.data.error_id } }
          assert:
            - "setup confirms item_status == DISCONTINUED before the trigger"
            - "err == ERR_INVALID_STATE (not ERR_STALE_VERSION: state beats OCC even with the correct version supplied)"
      - name: first_run_moves_transfer_planned_to_qualifying
        claim_type: side_effect_execution
        grounds: [state_machines.ProductTransfer.PLANNED_to_QUALIFYING]
        distinguishing_aspect: "The first recorded run auto-transitions the transfer PLANNED -> QUALIFYING and sets consecutive_pass_count per the result (PASS -> 1)."
        test_recipe:
          setup: ["Transfer PLANNED S -> T"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-SM11", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM11-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-SM11-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-SM11", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id, t_st0: $.data.transfer_status } }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
            - { call: "GET /portfolio/product-transfers/${t_id}", payload: {}, as: SupplyChainPlanner, captures: { t_st1: $.data.transfer_status, t_cnt1: $.data.consecutive_pass_count } }
          assert:
            - "t_st0 == PLANNED at creation"
            - "after first PASS run: transfer_status == QUALIFYING and consecutive_pass_count == 1"

  - section: calculations
    instances:
      - name: recommendation_keep_below_composite_threshold
        claim_type: correct_result
        grounds:
          - calculations.rationalization_composite_score
          - entities.RationalizationCase.fields.recommendation
        distinguishing_aspect: "A high-volume high-margin star item scores composite 15.75 (volume 0, margin 0, shelf 0, backlash 63.00) -> recommendation KEEP, exercising the < 65 side of the threshold."
        test_recipe:
          setup:
            - "Brand B (revenue 1000000000, pl_share 40), Plant P, Item I (annual_units 200000, unit_net_revenue_cents 2000, unit_cost_cents 1000, units_on_hand 0)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CA1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CA1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-CA1", annual_units: 200000, unit_net_revenue_cents: 2000, unit_cost_cents: 1000, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { comp: $.data.composite_score, rec: $.data.recommendation, vol: $.data.volume_score, mar: $.data.margin_score, she: $.data.shelf_resilience_score, bac: $.data.backlash_resilience_score } }
          assert:
            - "volume_score == 0.00 and margin_score == 0.00 and shelf_resilience_score == 0.00 (all clamps hit the floor)"
            - "backlash_resilience_score == 63.00 (unchanged from the brand-level inputs)"
            - "composite_score == 15.75 and recommendation == KEEP"
      - name: sell_through_deadline_exact_date_math
        claim_type: correct_result
        grounds:
          - entities.Item.fields.sell_through_deadline
          - state_machines.Item.CUT_PROPOSED_to_SELL_THROUGH
        distinguishing_aspect: "The 90-day sell-through deadline is computed from the DECIDE timestamp: approval at 2026-10-05T12:00:00Z yields deadline 2027-01-03T12:00:00Z exactly."
        test_recipe:
          setup:
            - "Brand B, Plant P, Item I with SCORED case; logical clock set to 2026-10-05T12:00:00Z before decide"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CA3", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CA3", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-CA3", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T12:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { dl: $.data.sell_through_deadline } }
          assert:
            - "sell_through_deadline == 2027-01-03T12:00:00Z (2026-10-05T12:00:00Z + 90 days, time-of-day preserved)"
      - name: negotiation_shelf_reduction_aggregates_and_expiry
        claim_type: correct_result
        grounds:
          - calculations.negotiation_shelf_reduction
          - entities.CombinedNegotiation.fields.shelf_reduction_pct
        distinguishing_aspect: "Negotiation creation computes total_baseline 160, total_proposed 140, shelf_reduction_pct 12.50, and stamps expires_at = created_at + 30 days (2026-10-01T00:00:00Z at the default clock)."
        test_recipe:
          setup: ["Retailer R, Brands B1/B2 ACTIVE"]
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-CA4", risk_rating: "LOW" }, as: PortfolioManager, captures: { r_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CA4-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CA4-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 80 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 60 } ], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }, as: PortfolioManager, captures: { tb: $.data.total_baseline_facings, tp: $.data.total_proposed_facings, srp: $.data.shelf_reduction_pct, exp: $.data.expires_at } }
          assert:
            - "total_baseline_facings == 160 and total_proposed_facings == 140"
            - "shelf_reduction_pct == 12.50  (round_half_up(20/160*100, 2dp))"
            - "expires_at == 2026-10-01T00:00:00Z (created at default clock 2026-09-01 + 30 days)"
            - "negotiation_status == TERMS_PROPOSED"
      - name: priority_score_core_variant_capped_at_100
        claim_type: constants_applied
        grounds:
          - calculations.innovation_priority_score
        distinguishing_aspect: "A perfect project on a core brand would score 110.00; the CORE_BRAND variant cap pins it to 100.00 (min applied AFTER the +10 bonus)."
        test_recipe:
          setup: ["Cycle CY ALLOCATING; core Brand B"]
          setup_api_calls:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-H1-CA6", total_capital_cents: 1000000000, window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }, as: FinanceController, captures: { cy: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CA6", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_id}", funding_cycle_id: "${cy}", title: "P-MAX", requested_capital_cents: 1000, expected_revenue_cents_year3: 2000000000, strategic_fit_score: 100 }, as: PortfolioManager, captures: { ps: $.data.priority_score } }
          assert:
            - "priority_score == 100.00  (STANDARD 100.00 + bonus 10 capped at 100)"
      - name: run_selection_empty_proposed_set_locks_at_zero
        claim_type: correct_result
        grounds:
          - calculations.capital_waterfall
          - state_machines.CapitalCycle.ALLOCATING_to_LOCKED
        distinguishing_aspect: "The waterfall over an EMPTY selector set is legal: cycle locks with allocated_cents 0 and remaining_cents == total_capital_cents (no projects touched)."
        test_recipe:
          setup: ["Cycle CY ALLOCATING with no projects"]
          setup_api_calls:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-H1-CA7", total_capital_cents: 750000000, window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }, as: FinanceController, captures: { cy: $.data.id } }
          trigger:
            - { call: "POST /portfolio/capital-cycles/${cy}/run-selection", payload: {}, as: FinanceController, captures: { alloc: $.data.allocated_cents, rem: $.data.remaining_cents, st: $.data.cycle_status } }
          assert:
            - "allocated_cents == 0 and remaining_cents == 750000000 and cycle_status == LOCKED"
      - name: utilization_excludes_discontinued_items
        claim_type: input_set_filtering
        grounds:
          - calculations.plant_load
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_depth2_cascade
          rationale: "finalize_depth2_cascade asserts the host plant's committed_units_per_quarter drops to 0 exactly because the DISCONTINUED item leaves the committed set."
      - name: tsa_natural_termination_zero_penalty
        claim_type: boundary_edge
        grounds:
          - calculations.tsa_early_termination_penalty
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / separate_requires_tsa_terminated
          rationale: "That instance terminates at clock == end_date and asserts early_termination_penalty_cents == 0."

  - section: validations
    instances:
      - name: forbidden_role_precedes_existence_on_decide
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A BrandManager calling decide on a NON-EXISTENT case id gets ERR_FORBIDDEN_ROLE (priority 3), not ERR_NOT_FOUND (priority 5): authorization runs before path resolution."
        test_recipe:
          setup: ["Brand B exists (for the BrandManager identity)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: { decision: "APPROVE" }, as: BrandManager, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE and http status 403 (role check precedes the 404)"
      - name: existence_precedes_state_on_decide
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A PortfolioManager deciding a non-existent case id gets ERR_NOT_FOUND (priority 5), never ERR_INVALID_STATE (priority 7)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /portfolio/rationalization-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-x", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"
      - name: brand_manager_cannot_create_item_for_other_brand
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - roles[BrandManager]
        distinguishing_aspect: "BrandManager with X-User-ID == brand B1 creating an item under brand B2 fails ERR_OWNERSHIP_MISMATCH (entity-backed identity check at priority 9)."
        test_recipe:
          setup: ["Brands B1 and B2, Plant P"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA3-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-VA3-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA3", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/items", payload: { brand_id: "${b2}", primary_plant_id: "${p_id}", sku_code: "SKU-VA3", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: BrandManager, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH and http status 403"
      - name: same_user_cannot_decide_own_case
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_SELF_DECISION]
        distinguishing_aspect: "Segregation of duties: the decide caller's X-User-ID equals proposer_user_id -> ERR_SELF_DECISION, even though the role (PortfolioManager) is correct."
        test_recipe:
          setup: ["Case C proposed by pm-same-1 (SCORED)"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA4", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA4", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-VA4", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-same-1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-same-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SELF_DECISION and http status 403"
            - "case remains SCORED"
      - name: duplicate_sku_returns_duplicate
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE]
          - entities.Item.fields.sku_code
        distinguishing_aspect: "sku_code is globally unique: reusing SKU-VA5 under a DIFFERENT brand fails ERR_DUPLICATE."
        test_recipe:
          setup: ["Brands B1/B2, Plant P, Item with sku SKU-VA5 under B1"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA5-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-VA5-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA5", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b1}", primary_plant_id: "${p_id}", sku_code: "SKU-VA5", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/items", payload: { brand_id: "${b2}", primary_plant_id: "${p_id}", sku_code: "SKU-VA5", annual_units: 100, unit_net_revenue_cents: 500, unit_cost_cents: 400, units_on_hand: 0 }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE and http status 409"
      - name: second_open_case_returns_case_already_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_CASE_ALREADY_OPEN]
        distinguishing_aspect: "Item CUT_PROPOSED implies an open case; a second case create on it fails ERR_CASE_ALREADY_OPEN (priority 11), not the generic state error."
        test_recipe:
          setup: ["Item I with open SCORED case"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA6", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA6", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-VA6", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1" }
          trigger:
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CASE_ALREADY_OPEN and http status 409"
      - name: second_open_divestiture_returns_divestiture_already_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DIVESTITURE_ALREADY_OPEN]
        distinguishing_aspect: "A brand with an open (PROPOSED) divestiture rejects a second divestiture with ERR_DIVESTITURE_ALREADY_OPEN — the uniqueness rule, not a brand-state error, fires for UNDER_REVIEW brands."
        test_recipe:
          setup: ["Non-core brand B with divestiture D1 PROPOSED"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA7", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq One", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Two", headline_price_cents: 600000000, expected_close_date: "2026-11-01T00:00:00Z" }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DIVESTITURE_ALREADY_OPEN and http status 409"
      - name: second_open_transfer_returns_transfer_already_open
        claim_type: violation_to_error
        grounds:
