      - name: role_scoped_write_denial_corner
        claim_type: bulk_operations
        grounds:
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - roles.NetworkAnalyst
        excluded_because:
          difficulty_instance: terms_freeze_beats_referential_contract_check
          rationale: "A refused write is asserted as the failure path of the named §1.8 instance, which sends a both-invalid create from a role without write authority and pins ERR_TERMS_FROZEN as the winning error."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_of_state_change_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Practice.fields.unsettled_balance_cents
          - endpoints.POST_/networks/practices/{practiceId}/withdraw-departure
        distinguishing_aspect: "Every change is atomic in the request that makes it: the withdraw-departure response itself already carries the reconciled unsettled_balance_cents and affiliation_status, with no re-read and no settling delay."
        test_recipe:
          setup:
            - "Practice P with an ACTIVE contract and an ACTIVE agreement, plus one PENDING rebate qualification so the departure notice withholds dollars."
          setup_api_calls:
            - *c_clock
            - *c_net
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Corner Case Cancer Care", practice_npi: "6543211015", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - *c_con
            - call: "POST /networks/affiliation-contracts/${c_id}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_ag
            - call: "POST /networks/pricing-agreements/${ag_id}/submit"
              payload: { expected_practice_version: "${p_v}" }
              as: PracticeAdmin
              as_user_id: "pa-corner"
            - call: "POST /networks/pricing-agreements/${ag_id}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/affiliate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/${n_id}/rebate-programs"
              payload: { program_name: "Immediate Program", drug_ndc_scope: "ALL", market_share_threshold_pct: 0.00, rebate_pct: 0.02, compliance_min_score: 0.00, period_epoch_index: 0, weight_reporting_compliance: 1, weight_adherence_steering: 1, weight_transparency: 1 }
              as: NetworkAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /networks/rebate-programs/${prog_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/rebate-qualifications"
              payload: { practice_id: "${p_id}", rebate_program_id: "${prog_id}" }
              as: PracticeAdmin
              as_user_id: "pa-corner"
              captures: { q_id: $.data.id }
            - call: "POST /networks/practices/${p_id}/departure-notice"
              payload: {}
              as: PracticeAdmin
              as_user_id: "pa-corner"
          trigger:
            - call: "POST /networks/practices/${p_id}/withdraw-departure"
              payload: {}
              as: PracticeAdmin
              as_user_id: "pa-corner"
              captures: { bal: $.data.unsettled_balance_cents, aff: $.data.affiliation_status, eff: $.data.departure_effective_epoch_index }
            - call: "GET /networks/affiliation-contracts/${c_id}"
              payload: {}
              as: NetworkAnalyst
              captures: { con_st: $.data.status, con_hold: $.data.rebate_holdback_cents }
          assert:
            - "the withdraw response carries affiliation_status == AFFILIATED and departure_effective_epoch_index == null"
            - "the withdraw response carries unsettled_balance_cents == 0 — the reconciliation is visible in the same response"
            - "GET immediately after shows AffiliationContract.${c_id}.status == ACTIVE and rebate_holdback_cents == 0"
            - "no waiting period or re-read is required for either figure to be correct"