        excluded_because:
          difficulty_instance: cross_entity_state_dependency / package_load_gate_depends_on_aircraft_cancellation_and_maintenance
          rationale: "The move/aircraft cross-entity gate on this endpoint is asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: package_reject_induction_is_a_dead_end_dimension
        claim_type: valid_transition
        grounds:
          - state_machines.Package.transitions.NOT_INDUCTED_to_REJECTED
          - state_machines.Package.transitions.NOT_INDUCTED_to_INDUCTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "NOT_INDUCTED -> REJECTED succeeds once and then locks the induction plane: both the repeat reject and the competing NOT_INDUCTED -> INDUCTED transition are refused with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, one GENERAL package."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-RJ-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_rj: $.data.id }
          trigger:
            - call: "POST /airhub/packages/${pkg_rj}/reject-induction"
              payload: {}
              as: SortOperator
              captures: { rejected: $.data.induction_status }
            - call: "POST /airhub/packages/${pkg_rj}/reject-induction"
              payload: {}
              as: SortOperator
              captures: { err_repeat: $.data.error_id }
            - call: "POST /airhub/packages/${pkg_rj}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err_competing: $.data.error_id }
          assert:
            - "the reject reports ${rejected} == REJECTED"
            - "the repeat reject returns 409 with ${err_repeat} == ERR_INVALID_STATE"
            - "the competing induct returns 409 with ${err_competing} == ERR_INVALID_STATE"
            - "Package.${pkg_rj}.sort_status == UNSORTED and rated_weight_grams is null"

      - name: package_induct_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Package.transitions.NOT_INDUCTED_to_INDUCTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The induction transition has no self-loop, so a second induct on an already-INDUCTED package is ERR_INVALID_STATE rather than a re-rated no-op."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, one GENERAL package already inducted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-IN-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_in: $.data.id }
            - call: "POST /airhub/packages/${pkg_in}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { rated: $.data.rated_weight_grams, v_after: $.data.version }
          trigger:
            - call: "POST /airhub/packages/${pkg_in}/induct"
              payload: { dimension_weight_grams: 90000 }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the first induct rated the package at ${rated} == 20000 with version ${v_after} == 2"
            - "the second induct returns 409 with ${err} == ERR_INVALID_STATE"
            - "Package.${pkg_in}.rated_weight_grams is still 20000, so the 90000 payload was never applied"

      - name: package_downgrade_before_the_lead_window_returns_cutoff_not_reached
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Package.transitions.COMMITTED_to_DOWNGRADED
          - errors.ERR_CUTOFF_NOT_REACHED
        distinguishing_aspect: "The time-downgrade window opens at SERVICE_DOWNGRADE_LEAD_MINUTES before the cutoff, so at minute 1510 with a 1560 cutoff the attempt is refused with ERR_CUTOFF_NOT_REACHED, while minute 1540 on the same package succeeds."
        test_recipe:
          setup:
            - "Clock 1510. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, one NEXT_DAY_AIR package (cutoff 1560)."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-LD-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_ld: $.data.id, pkg_ld_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:10:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_ld}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_ld_v}" }
              as: CommitmentController
              captures: { err_early: $.data.error_id }
          assert:
            - "the attempt at minute 1510 returns 409 with ${err_early} == ERR_CUTOFF_NOT_REACHED"
            - "1510 is inside the 30-minute lead, so current hub minute > commitment_cutoff_minutes - 30 is false"
            - "Package.${pkg_ld}.commitment_status == COMMITTED and final_commitment_minutes is null"
            - "the same call at minute 1540 succeeds, so the boundary is the lead window and not a blanket refusal"

      - name: package_downgrade_after_the_grace_window_returns_commitment_grace_exceeded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Package.transitions.COMMITTED_to_DOWNGRADED
          - errors.ERR_COMMITMENT_GRACE_EXCEEDED
        distinguishing_aspect: "The downgrade window also closes: at minute 1581 with a 1560 cutoff the grace of 60 minutes has expired and the attempt is ERR_COMMITMENT_GRACE_EXCEEDED, distinct from the early-window refusal."
        test_recipe:
          setup:
            - "Clock 1581. SDF hub, BANK_A with N701UP landed and unloaded, shift N-B (1380-1630), one NEXT_DAY_AIR package still COMMITTED."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-GR-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_gr: $.data.id, pkg_gr_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T02:21:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_gr}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_gr_v}" }
              as: CommitmentController
              captures: { err_late: $.data.error_id }
          assert:
            - "the attempt returns 409 with ${err_late} == ERR_COMMITMENT_GRACE_EXCEEDED"
            - "1581 > 1560 + 60, so the grace clause fails while the lead clause is satisfied"
            - "Package.${pkg_gr}.commitment_status == COMMITTED and no ServiceFailure exists for it"
            - "GET /airhub/failures?package_id=${pkg_gr} returns 0 rows"

      - name: bank_begin_unload_without_the_hydraulic_crew_returns_crew_unavailable
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ArrivalBank.transitions.EN_ROUTE_to_UNLOADING
          - errors.ERR_HYDRAULIC_CREW_UNAVAILABLE
        distinguishing_aspect: "hydraulic_crew_available is a bank-level flag that gates the unload face entirely, so an EN_ROUTE bank with a landed aircraft is still refused with ERR_HYDRAULIC_CREW_UNAVAILABLE."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A declared with hydraulic_crew_available false, N701UP landed, shift N-A."
