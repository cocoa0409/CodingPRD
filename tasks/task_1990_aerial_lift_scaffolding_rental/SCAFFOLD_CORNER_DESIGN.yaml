              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-20", required_working_height_ft: 15, expected_contract_version: "${cv}", engineering_plan_ref: "ENG-2026-114" }
              as: RentalCoordinator
              captures: { lid: $.data.id }
          assert:
            - "without engineering_plan_ref: error_id == ERR_ENGINEERING_PLAN_REQUIRED (422)"
            - "with engineering_plan_ref 'ENG-2026-114': creation succeeds, status RESERVED"

      - name: segregation_of_duties_certify_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The certifier's X-User-ID must differ from the inspector's: a BranchManager reusing the inspector's id (yt-1) is rejected even though the role is correct."
        test_recipe:
          setup: ["unit; SUBMITTED PASS inspection record created by YardTechnician yt-1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
