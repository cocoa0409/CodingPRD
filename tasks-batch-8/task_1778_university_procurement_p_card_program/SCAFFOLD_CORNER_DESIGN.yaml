      - name: issue_po_version_pin_and_amend_supersede_chain
        claim_type: conditional_action
        grounds: ["entities.PurchaseOrder.fields.contract_version_pinned", "concurrency_rules", "contract", "amend", "stale", "version", "errors", "ERR_CONTRACT_NOT_EXECUTED"]
        distinguishing_aspect: "Version pinning end-to-end: a PO pins the contract's version at issue; an amendment (OCC-guarded) bumps the original, executes, and supersedes it — the pin on the PO is untouched, and new requisitions can no longer reference the SUPERSEDED contract."
        test_recipe:
          setup: ["Contract C EXECUTED (version 4); requisition R1 on C APPROVED and issued (PO pins version 4)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Pin", cost_center: "CC-4700", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
