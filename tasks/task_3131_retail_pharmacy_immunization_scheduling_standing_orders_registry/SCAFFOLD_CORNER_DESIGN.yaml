        claim_type: side_effect_execution
        grounds: [state_machines.VaccineLot.QUARANTINED_to_RELEASED, "errors[ERR_LOT_NOT_QUARANTINED]", "errors[ERR_EXCURSION_DISPOSITION_REQUIRED]"]
        distinguishing_aspect: "Release from QUARANTINED with RELEASE_OK restores RELEASED, clears quarantine_reason, bumps version; releasing a RELEASED lot fails ERR_LOT_NOT_QUARANTINED; releasing a QUARANTINED lot without excursion_disposition fails ERR_EXCURSION_DISPOSITION_REQUIRED."
        test_recipe:
          setup: ["store S, product FLU, lot L1 RELEASED 5 doses; lot L2 manually quarantined"]
