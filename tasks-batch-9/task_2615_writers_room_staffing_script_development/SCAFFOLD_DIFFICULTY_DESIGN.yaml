        distinguishing_aspect: |
          The gate on a write to ScriptAssignment lives on TWO other entities at once: the writer needs a
          RoomSeat in status CONFIRMED **and** that seat's WritersRoom must be in status ACTIVE. The
          instance walks the three-point truth table with the identical request body - OFFERED seat in a
          STAFFING room (refused), CONFIRMED seat in a STAFFING room (still refused, which is the case an
