              captures: { fail_result: $.data.result }
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { err_after_fail: $.data.error_id }
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-10", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T11:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { sealed_status: $.data.status }
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { w1_status: $.data.status }
          assert:
            - "captured err_no_test == ERR_DYNO_NOT_PASSED (latest_dyno_result is null)"
            - "captured fail_result == FAIL and captured err_after_fail == ERR_DYNO_NOT_PASSED (latest FAIL also blocks)"
            - "captured sealed_status == SEALED after the PASS test"
            - "captured w1_status == CLOSED (seal bubbles up to the work order)"

  # =================================================================
  # Rule 8 — resource_temporal_overlap
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_window_half_open_overlap
        grounds:
          - validations[priority=17]
          - state_machines.MachineOperation.PENDING_to_COMPLETED
        distinguishing_aspect: |
          Resource MachineOperation/station_code with HALF-OPEN interval
          semantics: an overlapping window [10:30,11:30) against [10:00,11:00) on
          the same station is rejected, while exact adjacency at 11:00 is allowed.
        test_recipe:
          setup:
            - "Two work orders WA and WB (same 1-op spec) both in MACHINING, each with a PENDING CRANK_GRIND op"
            - "WA's op OA already performed on station STN-SHARED with window [2026-08-02T10:00, 11:00)"
