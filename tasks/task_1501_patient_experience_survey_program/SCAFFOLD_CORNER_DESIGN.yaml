            - "progress_pinned == -80.0 (0.0 - 80.00)"

  # ========================================================== validations ====
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call without X-User-ID / X-User-Role headers fails at priority 1 with 400 before any role/existence checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/units", payload: { program_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "U", unit_code: "U1" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the test omits both headers; `as:` documents intended role only)"

      - name: forbidden_role_denied_on_cycle_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - "roles[VendorOperator]"
        distinguishing_aspect: "VendorOperator calling POST /api/cycles (ProgramAdmin-only) is denied 403 ERR_FORBIDDEN_ROLE even with a well-formed payload."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
          trigger:
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: VendorOperator, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: "$.data.error_id" } }
          assert:
            - "403 ERR_FORBIDDEN_ROLE; no cycle created (GET /api/cycles?program_id=${pg} -> empty)"

      - name: invalid_enum_member_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3.5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "mode_assigned FAX is not a declared enum member -> 400 ERR_INVALID_REQUEST at shape validation."
        test_recipe:
          setup: ["cycle SAMPLING_OPEN with an ELIGIBLE discharge"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V3", sampling_protocol: "CENSUS", admin_mode: "MIXED_MODE" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy}", discharge_id: "${d_ids[0]}", mode_assigned: "FAX", postage_cost_cents: 100 }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "400 ERR_INVALID_REQUEST (FAX not in {MAIL, PHONE})"

      - name: cross_program_reference_single_failure
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_CROSS_PROGRAM_REFERENCE]"
        distinguishing_aspect: "An ELIGIBLE discharge of program P2 sampled into P1's cycle fails ONLY referential integrity (priority 6) -> ERR_CROSS_PROGRAM_REFERENCE (contrast with the dual-failure safety case in §1.8)."
        test_recipe:
          setup: ["P1 cycle SAMPLING_OPEN; P2 discharge ELIGIBLE (auto-evaluated)"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V4A", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg1: "$.data.id", pg1_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg1}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg1_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg1}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un1: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg1}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr1: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg1}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/survey-programs", payload: { name: "P-V4B", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg2: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg2}", name: "Unit 9", unit_code: "U9" }, as: ProgramAdmin, captures: { un2: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg2}", full_name: "Dr B", npi: "NPI9", specialty: "IM" }, as: ProgramAdmin, captures: { pr2: "$.data.id" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg2}", count: 1, template: { mrn_prefix: "X", unit_id: "${un2}", provider_id: "${pr2}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2_ids: "$.data.discharge_ids" } }
          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy}", discharge_id: "${d2_ids[0]}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "400 ERR_CROSS_PROGRAM_REFERENCE (discharge is ELIGIBLE — safety passes; referential fails)"

      - name: mode_not_allowed_by_admin_mode
        claim_type: conditional_validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_MODE_NOT_ALLOWED]"
          - entities.SurveyProgram.fields.admin_mode
        distinguishing_aspect: "Program admin_mode MAIL_ONLY rejects a PHONE sample case (ERR_MODE_NOT_ALLOWED); the same payload succeeds after the program is MIXED_MODE — behavior is conditional on entity config. (Second leg uses a separate MIXED_MODE program.)"
        test_recipe:
          setup: ["program P1 MAIL_ONLY with SAMPLING_OPEN cycle + ELIGIBLE discharge d1; program P2 MIXED_MODE with SAMPLING_OPEN cycle + ELIGIBLE discharge d2"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V5A", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg1: "$.data.id", pg1_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg1}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg1_v}" }, as: ProgramAdmin, captures: { vn1: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg1}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un1: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg1}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr1: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg1}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy1: "$.data.id" } }
            - { call: "POST /api/cycles/${cy1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg1}", count: 1, template: { mrn_prefix: "M", unit_id: "${un1}", provider_id: "${pr1}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1: "$.data.discharge_ids" } }
            - { call: "POST /api/survey-programs", payload: { name: "P-V5B", sampling_protocol: "CENSUS", admin_mode: "MIXED_MODE" }, as: ProgramAdmin, captures: { pg2: "$.data.id", pg2_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg2}", name: "V2", cycle_budget_cents: 100000, expected_program_version: "${pg2_v}" }, as: ProgramAdmin, captures: { vn2: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg2}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un2: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg2}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr2: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg2}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy2: "$.data.id" } }
            - { call: "POST /api/cycles/${cy2}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg2}", count: 1, template: { mrn_prefix: "N", unit_id: "${un2}", provider_id: "${pr2}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2: "$.data.discharge_ids" } }
          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy1}", discharge_id: "${d1[0]}", mode_assigned: "PHONE", postage_cost_cents: 100 }, as: DataSteward, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy2}", discharge_id: "${d2[0]}", mode_assigned: "PHONE", postage_cost_cents: 100 }, as: DataSteward, captures: { k2: "$.data.id" } }
          assert:
            - "MAIL_ONLY program: 422 ERR_MODE_NOT_ALLOWED"
            - "MIXED_MODE program: 201, SampleCase.${k2}.mode_assigned == PHONE"

      - name: discharge_outside_sampling_window
        claim_type: temporal_validation
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DISCHARGE_OUTSIDE_WINDOW]"
        distinguishing_aspect: "discharge_date 2026-07-05 falls outside the cycle's inclusive discharge window [2026-06-01, 2026-06-30] -> 422 ERR_DISCHARGE_OUTSIDE_WINDOW."
        test_recipe:
          setup: ["cycle SAMPLING_OPEN (discharge window June); ELIGIBLE discharge dated 2026-07-05"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V6", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
