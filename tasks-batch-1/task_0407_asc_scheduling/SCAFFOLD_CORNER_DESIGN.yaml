          - state_machines.SurgicalCase.PENDING_CLEARANCE_to_CLEARED
        distinguishing_aspect: "A DEFER clearance check leaves clearance PENDING_CLEARANCE but blocks clearing; clear with fresh H&P + a passing HP_REVIEW yet an un-superseded DEFER (on LABS) -> ERR_OPEN_FAILED_CHECK."
        test_recipe:
          setup: ["Facility(hp_validity 30)/OR/surgeon/MAC-proc(60)/patient/day(2026-07-15); block; case booked; HP_REVIEW PASS recorded; a LABS DEFER recorded (clearance still PENDING_CLEARANCE)."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC F12", hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
