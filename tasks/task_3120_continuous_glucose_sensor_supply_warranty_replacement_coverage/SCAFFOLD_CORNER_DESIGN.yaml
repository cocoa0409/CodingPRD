  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: response_envelope
        grounds:
          - "response_envelope.error"
        distinguishing_aspect: "Error response has meta + response_type=error + data.error_id + data.message"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cgm/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response has meta.api_request_id"
            - "response has response_type == 'error'"
            - "response has data.error_id and data.message"

      - name: error_stale_patient_version_via_occ
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_PATIENT_VERSION]"
          - "concurrency_rules[prescription-renew-stale-patient]"
        distinguishing_aspect: "Prescription create with stale expected_patient_version returns 412 ERR_STALE_PATIENT_VERSION"
        test_recipe:
          setup: ["Patient at version 1; first prescription create bumps version to 2; second create with stale version 1"]
          setup_api_calls:
            - call: "POST /cgm/patients"
