            - "Period remains FORECAST_LOCKED; forecast count for the period unchanged (1)"

      - name: catering_resubmit_after_reject_cycle
        claim_type: valid_transition
        grounds: [state_machines.CateringOrder, calculations.department_budget_ledger]
        distinguishing_aspect: "REJECTED -> SUBMITTED is legal (revision loop); the resubmission reserves the quote exactly once — no double counting from the first submission."
        test_recipe:
          setup: ["Order quoted 50000 (covers 10), SUBMITTED then REJECTED; department budget 500000"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM10", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Soc", department_code: "SOC", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-12", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders/${o}/reject", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { os: $.data.approval_status } }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { rs: $.data.reserved_cents, av: $.data.available_cents } }
          assert:
            - "approval_status == SUBMITTED again (REJECTED is not terminal)"
            - "reserved_cents == 50000 (not 100000) and available_cents == 450000 — the reject fully unwound the first reservation"
  # ===========================================================================
  # Section: calculations — input-set filtering, constants, zero-quantity edges
  # ===========================================================================
  - section: calculations
    instances:
      - name: forecast_insufficient_history_rejected
        claim_type: input_set_filtering
        grounds: [calculations.production_forecast_portions, "errors[ERR_INSUFFICIENT_HISTORY]"]
        distinguishing_aspect: "TREND requires >= 2 qualifying occurrences; with exactly 1 the create is rejected while BASE would have used the capacity fallback."
        test_recipe:
          setup:
            - "Hall (capacity 1000), recipe, published cycle; ONE historical Wednesday LUNCH (2026-08-05) in IN_SERVICE with 10 swipes; target Wednesday 2026-08-12 SCHEDULED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall C1", service_model: "BOARD", dining_capacity: 1000, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-05", meal_period: "LUNCH" }, as: HallManager, captures: { hp: $.data.id, hpv: $.data.version } }
            - { call: "POST /meal-periods/${hp}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${hpv}" }, as: KitchenLead, captures: { hf: $.data.id } }
            - { call: "POST /production-forecasts/${hf}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${hp}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${hp}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${hp}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 10 } ] }, as: HallManager }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-12", meal_period: "LUNCH" }, as: HallManager, captures: { tp: $.data.id, tpv: $.data.version } }
          trigger:
            - { call: "POST /meal-periods/${tp}/forecasts", payload: { recipe_id: "${r}", variant: "TREND", expected_meal_period_version: "${tpv}" }, as: KitchenLead, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_HISTORY with HTTP 422"
            - "A parallel BASE request would have succeeded via the capacity fallback (round_half_up(1000*0.60)*share) — the gate is variant-specific"

      - name: catering_quote_minimum_order_floor
        claim_type: constants_applied
        grounds: [calculations.catering_quote, entities.CateringOrder.fields.quoted_total_cents]
        distinguishing_aspect: "MINIMUM_ORDER_CENTS 50000 floor applied LAST: computed 13350 becomes exactly 50000."
        test_recipe:
          setup: ["Hall, recipe R (unit 800), department; order with covers 10 and food cost 4000"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall C2", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Econ", department_code: "ECON", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
          trigger:
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-15", time_slot: "BREAKFAST", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { oq: $.data.quoted_total_cents } }
          assert:
            - "quoted_total_cents == 50000 (raw = round_half_up(4000*1.40) + 0 + 7500 + 25*10 = 5600 + 7750 = 13350 < 50000 floor)"

      - name: reconcile_variance_null_when_forecast_zero
        claim_type: correct_result
        grounds: [calculations.meal_period_reconciliation, entities.MealPeriodService.fields.forecast_variance_pct]
        distinguishing_aspect: "Zero-quantity edge: forecasted_covers == 0 makes the percentage variance null (not an error, not infinity)."
        test_recipe:
          setup:
            - "Two historical Wednesday LUNCH periods (2026-08-05, 2026-08-12) IN_SERVICE with ZERO swipes; target Wednesday 2026-08-19 with BASE forecast (portions 0), locked, opened, 5 board swipes recorded"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall C3", service_model: "BOARD", dining_capacity: 1000, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-05", meal_period: "LUNCH" }, as: HallManager, captures: { h1: $.data.id, h1v: $.data.version } }
            - { call: "POST /meal-periods/${h1}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${h1v}" }, as: KitchenLead, captures: { f1: $.data.id } }
            - { call: "POST /production-forecasts/${f1}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${h1}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${h1}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-12", meal_period: "LUNCH" }, as: HallManager, captures: { h2: $.data.id, h2v: $.data.version } }
            - { call: "POST /meal-periods/${h2}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${h2v}" }, as: KitchenLead, captures: { f2: $.data.id } }
            - { call: "POST /production-forecasts/${f2}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${h2}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${h2}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-19", meal_period: "LUNCH" }, as: HallManager, captures: { tp: $.data.id, tpv: $.data.version } }
            - { call: "POST /meal-periods/${tp}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${tpv}" }, as: KitchenLead, captures: { tf: $.data.id, tf_portions: $.data.forecasted_portions } }
            - { call: "POST /production-forecasts/${tf}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${tp}/lock-forecast", payload: {}, as: HallManager, captures: { tp_fc: $.data.forecasted_covers } }
            - { call: "POST /meal-periods/${tp}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${tp}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 5 } ] }, as: HallManager }
          trigger:
            - { call: "POST /meal-periods/${tp}/reconcile", payload: {}, as: HallManager, captures: { var_pct: $.data.forecast_variance_pct, covers: $.data.actual_covers } }
          assert:
            - "BASE forecast on zero-cover history: forecasted_portions == 0 (mean 0 * 0.5 * 1.05)"
            - "forecasted_covers == 0 at lock-forecast"
            - "After reconcile: actual_covers == 5 and forecast_variance_pct is null (division-by-zero rule), not an error"

      - name: commission_duplicate_statement_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_STATEMENT]", endpoints]
        distinguishing_aspect: "(vendor_contract_id, period_month) is unique: the second POST for the same month is ERR_DUPLICATE_STATEMENT 409."
        test_recipe:
          setup: ["ACTIVE contract; statement for 2026-08 already exists"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall C4", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "V3", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin }
          trigger:
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_STATEMENT with HTTP 409; a statement for 2026-09 would still succeed"

      - name: corrective_due_dates_from_severity
        claim_type: side_effect_execution
        grounds: [state_machines.InspectionReport.DRAFT_to_SUBMITTED, entities.CorrectiveAction.fields.due_date]
        distinguishing_aspect: "Cascade-created corrective actions derive due_date from severity: +7d CRITICAL, +14d MAJOR, +30d MINOR relative to inspection_date."
        test_recipe:
          setup: ["Hall; report with one violation of each severity, inspection_date 2026-08-01"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall C5", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-01", violations: [ { code: "C1", severity: "CRITICAL" }, { code: "M1", severity: "MAJOR" }, { code: "m1", severity: "MINOR" } ] }, as: HealthInspector, as_user_id: "insp-2", captures: { ir: $.data.id } }
          trigger:
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-2" }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}", severity: "CRITICAL" }, as: HealthInspector, captures: { ca_crit: "$.data[0].due_date" } }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}", severity: "MAJOR" }, as: HealthInspector, captures: { ca_maj: "$.data[0].due_date" } }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}", severity: "MINOR" }, as: HealthInspector, captures: { ca_min: "$.data[0].due_date" } }
          assert:
            - "CRITICAL row: due_date == 2026-08-08, status OPEN"
            - "MAJOR row: due_date == 2026-08-15; MINOR row: due_date == 2026-08-31"
            - "Report outcome == FAIL (CRITICAL present) even though score == 62"

  # ===========================================================================
  # Section: validations — auth, conditional fields, ranges, temporal edges
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without a valid role header is 401 before any other check — even on a read endpoint."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dining-halls", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401"

      - name: swipe_batch_atomic_conditional_amount
        claim_type: conditional_validation
        grounds: [entities.SwipeEvent.fields.amount_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "amount_cents rules are conditional on entry_type, and the bulk ingest is atomic: one bad element rejects the whole batch with zero rows persisted."
        test_recipe:
          setup: ["Period 2026-08-31 LUNCH in IN_SERVICE"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V2", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-31", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 5, count: 1 } ] }, as: HallManager, captures: { err1: $.data.error_id } }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 2 }, { entry_type: "RETAIL_SALE", amount_cents: 0, count: 1 } ] }, as: HallManager, captures: { err2: $.data.error_id } }
            - { call: "GET /swipe-events", payload: { meal_period_id: "${p}" }, as: HallManager }
          assert:
            - "Trigger 1: ERR_VALIDATION (BOARD_SWIPE must carry amount_cents == 0)"
            - "Trigger 2: ERR_VALIDATION (RETAIL_SALE must carry amount_cents > 0) and the batch is atomic"
            - "GET /swipe-events?meal_period_id shows total_count == 0 — the 2 valid board swipes in batch 2 were NOT persisted"

      - name: shift_worked_minutes_bounds
        claim_type: type_constraints
        grounds: [state_machines.LaborShift.CONFIRMED_to_COMPLETED, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "worked_minutes may exceed the scheduled window by at most 60 (grace): 541 over a 480-minute shift is ERR_VALIDATION, 540 is accepted."
        test_recipe:
          setup: ["Shift 2026-08-13 [480,960] CONFIRMED"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V3", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "SV3", role: "SERVER", shift_date: "2026-08-13", start_minute: 480, end_minute: 960, hourly_rate_cents: 1800 }, as: HallManager, captures: { s: $.data.id } }
            - { call: "POST /labor-shifts/${s}/confirm", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /labor-shifts/${s}/complete", payload: { worked_minutes: 541 }, as: HallManager, captures: { err: $.data.error_id } }
            - { call: "POST /labor-shifts/${s}/complete", payload: { worked_minutes: 540 }, as: HallManager, captures: { ss: $.data.status } }
          assert:
            - "First trigger: error_id == ERR_VALIDATION (541 > 480+60); shift stays CONFIRMED"
            - "Second trigger: succeeds (540 == scheduled + 60, inclusive bound); status COMPLETED, regular_minutes == 540, overtime_minutes == 0"

      - name: catering_lead_time_exactly_48h
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_LEAD_TIME_VIOLATION]"]
        distinguishing_aspect: "Lead-time boundary: submit at event_start - 47h59m fails; at exactly event_start - 48h00m it succeeds (inclusive >= 48h)."
        test_recipe:
          setup: ["Hall, recipe, department (budget 500000); order for 2026-08-10 DINNER (slot start 17:00) in DRAFT, quoted 50000"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V4", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "PoliSci", department_code: "POLI", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-08-10", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T17:01:00Z" }, as: DiningAdmin }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T17:00:00Z" }, as: DiningAdmin }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { os: $.data.approval_status } }
          assert:
            - "At 47h59m lead: error_id == ERR_LEAD_TIME_VIOLATION with HTTP 422; order stays DRAFT"
            - "At exactly 48h00m lead: submit succeeds, approval_status == SUBMITTED"

      - name: invoice_final_total_bounds
        claim_type: type_constraints
        grounds: [state_machines.CateringOrder, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "final_total_cents bounds are inclusive: 79% of quoted (39500) is ERR_VALIDATION; exactly 80% (40000) invoices cleanly."
        test_recipe:
          setup: ["Order quoted exactly 50000 (minimum-floor configuration), fulfillment == FULFILLED"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V5", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Stats", department_code: "STAT", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-16", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id, oq: $.data.quoted_total_cents } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: HallManager }
            - { call: "POST /catering-orders/${o}/schedule", payload: {}, as: HallManager }
            - { call: "POST /catering-orders/${o}/fulfill", payload: {}, as: KitchenLead }
          trigger:
            - { call: "POST /catering-orders/${o}/invoice", payload: { final_total_cents: 39500 }, as: HallManager, captures: { err: $.data.error_id } }
            - { call: "POST /catering-orders/${o}/invoice", payload: { final_total_cents: 40000 }, as: HallManager, captures: { ofs: $.data.fulfillment_status } }
          assert:
            - "quoted_total_cents == 50000"
            - "First trigger: error_id == ERR_VALIDATION (39500 < 40000 lower bound); fulfillment stays FULFILLED"
            - "Second trigger: succeeds at exactly 80%; fulfillment_status == INVOICED, final_total_cents == 40000"

      - name: menu_cycle_end_before_start_rejected
        claim_type: type_constraints
        grounds: [entities.MenuCycle.fields.end_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Interval shape rule: end_date <= start_date is ERR_VALIDATION at creation."
        test_recipe:
          setup: ["Hall exists"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V6", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Bad", cycle_length_weeks: 4, start_date: "2026-10-01", end_date: "2026-09-01" }, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION with HTTP 400; no cycle persisted"

      - name: default_clock_governs_lead_time
        claim_type: temporal_validation
        grounds: [endpoints, "errors[ERR_LEAD_TIME_VIOLATION]"]
        distinguishing_aspect: "Without any clock-set call the logical clock is the fixed default 2026-08-01T00:00:00Z, not the wall clock: a 2026-08-02 LUNCH event (35h lead) fails while a 2026-08-03 DINNER event (65h) submits."
        test_recipe:
          setup: ["Hall, recipe, department; two DRAFT orders (no clock calls anywhere in the test)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall V7", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Ling", department_code: "LING", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-08-02", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o1: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-08-03", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /catering-orders/${o1}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
            - { call: "POST /catering-orders/${o2}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { o2s: $.data.approval_status } }
          assert:
            - "Order 1 (2026-08-02 11:00 slot, 35h from default clock): error_id == ERR_LEAD_TIME_VIOLATION"
            - "Order 2 (2026-08-03 17:00 slot, 65h): approval_status == SUBMITTED"

  # ===========================================================================
  # Section: errors — every remaining error id gets a deterministic trigger
  # ===========================================================================
  - section: errors
    instances:
      - name: duplicate_active_contract_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_ACTIVE_CONTRACT]", "state_machines.VendorContract.NEGOTIATION_to_ACTIVE"]
        distinguishing_aspect: "One ACTIVE contract per hall: activating a second NEGOTIATION contract for the same hall fails even though the contract itself is activatable."
        test_recipe:
          setup: ["Hall with contract C1 ACTIVE and contract C2 NEGOTIATION"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E1", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "VA", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { c1: $.data.id } }
            - { call: "POST /vendor-contracts/${c1}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "VB", board_rate_per_cover_cents: 600, retail_commission_bps: 1100, catering_commission_bps: 900, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /vendor-contracts/${c2}/activate", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_CONTRACT with HTTP 409; C2 remains NEGOTIATION"

      - name: waste_self_verify_segregation_of_duties
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The verifier's X-User-ID equals the recorder's — the role is allowed (HallManager) yet the call is rejected 403 because the same human recorded the log."
        test_recipe:
          setup: ["Period 2026-09-01 LUNCH in RECONCILED; waste log recorded by X-User-ID 'dual-1' (role KitchenLead)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E2", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-09-01", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 5 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "SPOILAGE", disposition: "LANDFILL", weight_kg: 2.0 }, as: KitchenLead, as_user_id: "dual-1", captures: { wl: $.data.id, rec: $.data.recorded_by_user_id } }
          trigger:
            - { call: "POST /waste-logs/${wl}/verify", payload: {}, as: HallManager, as_user_id: "dual-1", captures: { err: $.data.error_id } }
          assert:
            - "recorded_by_user_id == 'dual-1'"
            - "error_id == ERR_SEGREGATION_OF_DUTIES with HTTP 403; log remains RECORDED with verified_by_user_id null"

      - name: waste_record_after_period_close_window_closed
        claim_type: violation_to_error
        grounds: ["errors[ERR_WASTE_WINDOW_CLOSED]", "validations[priority=8]"]
        distinguishing_aspect: "Once the period is CLOSED, waste recording is the temporal ERR_WASTE_WINDOW_CLOSED (422), distinct from the generic ERR_INVALID_STATE used for SCHEDULED periods."
        test_recipe:
          setup: ["Period 2026-09-02 LUNCH driven to CLOSED with no waste logs"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E3", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-09-02", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 5 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/close", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "PRE_CONSUMER", disposition: "LANDFILL", weight_kg: 1.0 }, as: KitchenLead, as_user_id: "kl-4", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WASTE_WINDOW_CLOSED with HTTP 422"

      - name: inspection_close_incomplete_blocked_then_succeeds
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_INSPECTION_INCOMPLETE]", "state_machines.InspectionReport.ACKNOWLEDGED_to_CLOSED"]
        distinguishing_aspect: "Close requires every corrective action VERIFIED: a RESOLVED (unverified) action blocks with ERR_INSPECTION_INCOMPLETE; after verify the close succeeds."
        test_recipe:
          setup: ["Report (1 MAJOR violation, 2026-08-03) SUBMITTED and ACKNOWLEDGED; its corrective action RESOLVED"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E4", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-03", violations: [ { code: "M1", severity: "MAJOR" } ] }, as: HealthInspector, as_user_id: "insp-3", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-3", captures: { oc: $.data.outcome, sc: $.data.score } }
            - { call: "POST /inspection-reports/${ir}/acknowledge", payload: {}, as: HallManager }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}" }, as: HealthInspector, captures: { ca: "$.data[0].id" } }
            - { call: "POST /corrective-actions/${ca}/resolve", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /inspection-reports/${ir}/close", payload: {}, as: HealthInspector, as_user_id: "insp-3", captures: { err: $.data.error_id } }
            - { call: "POST /corrective-actions/${ca}/verify", payload: {}, as: HealthInspector, as_user_id: "insp-3" }
            - { call: "POST /inspection-reports/${ir}/close", payload: {}, as: HealthInspector, as_user_id: "insp-3", captures: { irs: $.data.status } }
          assert:
            - "Report submitted with score == 90, outcome == PASS (single MAJOR)"
            - "First close: error_id == ERR_INSPECTION_INCOMPLETE with HTTP 409 (action only RESOLVED)"
            - "After verify: close succeeds, report status == CLOSED (terminal)"

      - name: accommodation_approve_no_suitable_menu_then_succeeds
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_NO_SUITABLE_MENU]", "state_machines.AccommodationRequest.NUTRITION_REVIEW_to_APPROVED"]
        distinguishing_aspect: "The only VEGAN recipe at the hall contains PEANUT, which the student excludes — approve fails; adding a clean VEGAN recipe unblocks the same transition."
        test_recipe:
          setup: ["Hall with recipe R1 (allergens [PEANUT], flags [VEGAN]); accommodation request (exclusions [PEANUT], requirement VEGAN) in NUTRITION_REVIEW"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E5", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Peanut Satay", station: "GLOBAL", allergen_tags: ["PEANUT"], dietary_flags: ["VEGAN"], popularity_share: 0.4, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r1: $.data.id } }
            - { call: "POST /accommodation-requests", payload: { dining_hall_id: "${h}", student_ref: "STU-2", allergen_exclusions: ["PEANUT"], dietary_requirement: "VEGAN" }, as: HallManager, captures: { ar: $.data.id } }
            - { call: "POST /accommodation-requests/${ar}/start-review", payload: {}, as: Dietitian }
          trigger:
            - { call: "POST /accommodation-requests/${ar}/approve", payload: {}, as: Dietitian, captures: { err: $.data.error_id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Lentil Bowl", station: "GLOBAL", allergen_tags: [], dietary_flags: ["VEGAN"], popularity_share: 0.3, unit_cost_cents: 450, allergen_reviewed: true }, as: KitchenLead }
            - { call: "POST /accommodation-requests/${ar}/approve", payload: {}, as: Dietitian, captures: { ars: $.data.status } }
          assert:
            - "First approve: error_id == ERR_NO_SUITABLE_MENU with HTTP 422 (R1 fails the allergen-exclusion predicate)"
            - "After adding a compliant recipe: approve succeeds, status == APPROVED"

      - name: catering_submit_on_suspended_hall_rejected
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_HALL_SUSPENDED]", "state_machines.CateringOrder"]
        distinguishing_aspect: "Hall posture gates catering submission: DRAFT order on a SUSPENDED hall gets ERR_HALL_SUSPENDED, not a budget or lead-time error."
        test_recipe:
          setup: ["Hall SUSPENDED; order DRAFT (created while ACTIVE) for 2026-09-20 DINNER"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E6", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Music2", department_code: "MUS2", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-20", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /dining-halls/${h}/suspend", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HALL_SUSPENDED with HTTP 409; order remains DRAFT; department buckets unchanged"

      - name: hall_reactivate_blocked_by_open_critical_then_succeeds
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_CRITICAL_VIOLATION_OPEN]", "state_machines.DiningHall.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "Reactivate checks hall-scoped compliance state: an OPEN CRITICAL corrective action blocks with ERR_CRITICAL_VIOLATION_OPEN; once VERIFIED the same call succeeds."
        test_recipe:
          setup: ["Hall SUSPENDED by a FAIL inspection; report ACKNOWLEDGED; corrective action CA (CRITICAL) OPEN"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E7", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-04", violations: [ { code: "CR-1", severity: "CRITICAL" } ] }, as: HealthInspector, as_user_id: "insp-4", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-4" }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}" }, as: HealthInspector, captures: { ca: "$.data[0].id" } }
            - { call: "POST /inspection-reports/${ir}/acknowledge", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /dining-halls/${h}/reactivate", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /corrective-actions/${ca}/resolve", payload: {}, as: HallManager }
            - { call: "POST /corrective-actions/${ca}/verify", payload: {}, as: HealthInspector, as_user_id: "insp-4" }
            - { call: "POST /dining-halls/${h}/reactivate", payload: {}, as: DiningAdmin, captures: { hs: $.data.status } }
          assert:
            - "First reactivate: error_id == ERR_CRITICAL_VIOLATION_OPEN with HTTP 422"
            - "After resolve+verify: reactivate succeeds, hall status == ACTIVE"
            - "Note the resolve/verify ordering: verify requires the report ACKNOWLEDGED — acknowledging before resolving is what makes the chain legal"

      - name: recipe_reinstate_requires_allergen_review
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALLERGEN_UNDECLARED]", "state_machines.Recipe.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "Reinstate of a still-unreviewed recipe is ERR_ALLERGEN_UNDECLARED; PATCHing allergen_reviewed true makes the same call succeed — the safety gate reads live recipe fields."
        test_recipe:
          setup: ["Recipe R ACTIVE (allergen_reviewed false by default), then suspended"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E8", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Mystery Soup", station: "DELI", allergen_tags: ["SOY"], dietary_flags: [], popularity_share: 0.3, unit_cost_cents: 300 }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /recipes/${r}/suspend", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /recipes/${r}/reinstate", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
            - { call: "PATCH /recipes/${r}", payload: { allergen_reviewed: true }, as: KitchenLead }
            - { call: "POST /recipes/${r}/reinstate", payload: {}, as: DiningAdmin, captures: { rs: $.data.status } }
          assert:
            - "First reinstate: error_id == ERR_ALLERGEN_UNDECLARED with HTTP 422"
            - "After PATCH allergen_reviewed=true: reinstate succeeds, status == ACTIVE"

      - name: cycle_publish_unreviewed_recipe_single_failure
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALLERGEN_UNDECLARED]", "state_machines.MenuCycle.DRAFT_to_PUBLISHED"]
        distinguishing_aspect: "The safety error in isolation: a single unreviewed ACTIVE recipe blocks publish of a non-overlapping cycle (no competing overlap failure, unlike the priority instance)."
        test_recipe:
          setup: ["Hall with one ACTIVE unreviewed recipe; cycle [2026-09-01, 2026-10-01) in DRAFT, no other cycles"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E9", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Unreviewed Pie", station: "BAKERY", allergen_tags: ["WHEAT", "EGG"], dietary_flags: [], popularity_share: 0.2, unit_cost_cents: 250 }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C", cycle_length_weeks: 4, start_date: "2026-09-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /menu-cycles/${c}/publish", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLERGEN_UNDECLARED with HTTP 422; cycle remains DRAFT"

      - name: forecast_duplicate_draft_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_FORECAST]", "endpoints"]
        distinguishing_aspect: "A second forecast for a (meal_period_id, recipe_id) pair that still has a DRAFT row is ERR_DUPLICATE_FORECAST — supersede only replaces LOCKED rows."
        test_recipe:
          setup: ["Period SCHEDULED with one DRAFT forecast for recipe R; fresh period version observed"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall E10", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-09-03", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "GET /meal-periods/${p}", payload: {}, as: KitchenLead, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv2}" }, as: KitchenLead, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_FORECAST with HTTP 409 (a DRAFT for the pair already exists)"

  # ===========================================================================
  # Section: rbac — role denials and entity-backed ownership
  # ===========================================================================
  - section: rbac
    instances:
      - name: contract_manager_cannot_create_recipe
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Recipe creation is KitchenLead-exclusive; ContractManager gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Hall exists"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R1", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; no recipe persisted"

      - name: health_inspector_cannot_resolve_corrective
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Resolve is HallManager-only; the inspector who filed the report cannot self-remediate (role-level segregation complementing the waste SoD rule)."
        test_recipe:
          setup: ["Report SUBMITTED with one MAJOR corrective action OPEN"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R2", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-03", violations: [ { code: "M1", severity: "MAJOR" } ] }, as: HealthInspector, as_user_id: "insp-5", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-5" }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}" }, as: HealthInspector, captures: { ca: "$.data[0].id" } }
          trigger:
            - { call: "POST /corrective-actions/${ca}/resolve", payload: {}, as: HealthInspector, as_user_id: "insp-5", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; action remains OPEN"

      - name: dietitian_cannot_record_waste
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Waste recording is KitchenLead-exclusive; Dietitian is rejected before any state check."
        test_recipe:
          setup: ["Period 2026-09-04 LUNCH in IN_SERVICE"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R3", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-09-04", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "PRE_CONSUMER", disposition: "LANDFILL", weight_kg: 1.0 }, as: Dietitian, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; waste log count for the period stays 0"

      - name: department_user_cannot_approve_order
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Approval is HallManager-exclusive — a DepartmentUser cannot approve even their own department's order."
        test_recipe:
          setup: ["Order SUBMITTED by department D"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R4", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Theater", department_code: "THEA", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-18", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
          trigger:
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: DepartmentUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403; order remains SUBMITTED; reservation intact"

      - name: department_user_cannot_order_for_other_department
        claim_type: rbac_denial
        grounds: [roles, "entities.CateringOrder.fields.department_id", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "entity_backed ownership: X-User-ID must equal body department_id; acting for another department is ERR_FORBIDDEN even though both departments exist."
        test_recipe:
          setup: ["Hall, recipe, departments D1 and D2 exist"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R5", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "D1", department_code: "D1", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d1: $.data.id } }
            - { call: "POST /departments", payload: { name: "D2", department_code: "D2", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d2}", event_date: "2026-09-19", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403 (X-User-ID ${d1} != department_id ${d2})"

  # ===========================================================================
  # Section: cross_cutting_layers — OCC stale/success, clock sweeps, atomicity
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_forecast_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[forecast-create-stale-period]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A forecast create carrying the pre-first-write period version is rejected 412; re-reading the period and retrying with the fresh version succeeds and bumps version again."
        test_recipe:
          setup: ["Period SCHEDULED (version 1 observed at creation); forecast A for recipe R1 created against version 1 (period now version 2)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall L1", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R1", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r1: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R2", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.4, unit_cost_cents: 400, allergen_reviewed: true }, as: KitchenLead, captures: { r2: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-09-07", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv1: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r1}", variant: "BASE", expected_meal_period_version: "${pv1}" }, as: KitchenLead, captures: { fa: $.data.id } }
          trigger:
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r2}", variant: "BASE", expected_meal_period_version: "${pv1}" }, as: KitchenLead, captures: { err: $.data.error_id } }
            - { call: "GET /meal-periods/${p}", payload: {}, as: KitchenLead, captures: { pv2: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r2}", variant: "BASE", expected_meal_period_version: "${pv2}" }, as: KitchenLead, captures: { fb: $.data.id, fbs: $.data.status } }
          assert:
            - "First create for R2 with the stale version (${pv1} == 1 while the period is at 2): error_id == ERR_STALE_VERSION with HTTP 412"
            - "After GET re-read: retry with the fresh version succeeds (201), forecast status DRAFT"
            - "MealPeriodService.version == 3 after the successful create (each accepted forecast bumps the parent)"

      - name: occ_catering_approve_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[catering-approve-stale-department]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approve carrying the department version from before the submit reservation is rejected 412; retrying with the post-submit version succeeds."
        test_recipe:
          setup: ["Department observed at version 1 right after creation; order created and SUBMITTED (submit bumped the department to version 2)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall L2", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Dance", department_code: "DANC", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id, dv0: $.data.version } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-22", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
          trigger:
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv0}" }, as: HallManager, captures: { err: $.data.error_id } }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv1: $.data.version } }
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv1}" }, as: HallManager, captures: { os: $.data.approval_status } }
          assert:
            - "Approve with the pre-submit version (${dv0} == 1): error_id == ERR_STALE_VERSION with HTTP 412 (submit bumped the department to 2)"
            - "Approve with the fresh version succeeds: approval_status == APPROVED"
            - "Department.version == 3 after the successful approve"

      - name: clock_sweep_expires_contract
        claim_type: scheduled_actions
        grounds: ["state_machines.VendorContract.ACTIVE_to_EXPIRED", "endpoints"]
        distinguishing_aspect: "The clock sweep expires contracts at the half-open boundary: still ACTIVE at end_date - 1 day, EXPIRED when now reaches end_date exactly."
        test_recipe:
          setup: ["Contract effective [2026-08-01, 2026-09-01) ACTIVATED under the default clock"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall L3", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "SweepV", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-09-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: DiningAdmin, captures: { sweep1: $.data.expired_contract_ids } }
            - { call: "GET /vendor-contracts/${vc}", payload: {}, as: ContractManager, captures: { cs1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: DiningAdmin, captures: { sweep2: $.data.expired_contract_ids } }
            - { call: "GET /vendor-contracts/${vc}", payload: {}, as: ContractManager, captures: { cs2: $.data.status } }
          assert:
            - "At 2026-08-31T23:59:59Z: contract still ACTIVE, expired_contract_ids empty"
            - "At 2026-09-01T00:00:00Z (== effective_end_date, exclusive boundary): status EXPIRED, sweep lists the contract id"

      - name: clock_sweep_marks_corrective_overdue
        claim_type: scheduled_actions
        grounds: ["state_machines.CorrectiveAction.OPEN_to_OVERDUE", "endpoints"]
        distinguishing_aspect: "Overdue uses strict less-than: at due_date exactly the action stays OPEN; the next day it flips to OVERDUE via the sweep."
        test_recipe:
          setup: ["PASS report (1 MAJOR, inspection 2026-08-01) SUBMITTED — corrective action OPEN with due_date 2026-08-15"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall L4", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-01", violations: [ { code: "M1", severity: "MAJOR" } ] }, as: HealthInspector, as_user_id: "insp-6", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-6" }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}" }, as: HealthInspector, captures: { ca: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DiningAdmin, captures: { sw1: $.data.overdue_corrective_action_ids } }
            - { call: "GET /corrective-actions/${ca}", payload: {}, as: HealthInspector, captures: { s1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: DiningAdmin, captures: { sw2: $.data.overdue_corrective_action_ids } }
            - { call: "GET /corrective-actions/${ca}", payload: {}, as: HealthInspector, captures: { s2: $.data.status } }
          assert:
            - "At due_date exactly (2026-08-15): status still OPEN; sweep lists no ids"
            - "At 2026-08-16: status OVERDUE; sweep lists the action id"
            - "Hall remains ACTIVE throughout (single MAJOR -> PASS, no suspension)"

      # ---- stubs: corners already exercised as §1.8 difficulty instances ----
      - name: hall_suspend_cascade_corner
        claim_type: cascading_side_effects
        grounds: ["state_machines.DiningHall.ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_fail_suspends_hall_cancels_periods
          rationale: "The cascade and its state-conditional scope (only SCHEDULED periods cancel) are asserted there end-to-end."
      - name: catering_capacity_boundary_corner
        claim_type: boundary_edge
        grounds: ["calculations.department_budget_ledger", "errors[ERR_CATERING_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / catering_capacity_exact_fit_then_overflow
          rationale: "Exact-fit equality and +1 overflow are both asserted in the difficulty instance."
      - name: overtime_boundary_corner
        claim_type: boundary_edge
        grounds: ["calculations.weekly_overtime_allocation"]
        excluded_because:
          difficulty_instance: boundary_precision_check / overtime_threshold_exactly_2400_minutes
          rationale: "Exactly-2400 (no OT) and beyond-2400 (all OT) are both asserted there; the split-shift arithmetic is covered by combinatorial_formula / overtime_split_shift_evaluation_order."
      - name: inspection_threshold_corner
        claim_type: boundary_edge
        grounds: ["calculations.inspection_scoring"]
        excluded_because:
          difficulty_instance: boundary_precision_check / inspection_score_exactly_70_passes
          rationale: "The 70/69 band edge and the CRITICAL override are asserted there."
      - name: priority_conflict_corners
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "validations[priority=2]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_approved_order_state_beats_budget
          rationale: "All three dual-failure orderings (state>fiscal, safety>constraint, authz>existence) are covered by the three difficulty instances."
      - name: derived_field_reconciliation_corner
        claim_type: derived_field_reconciliation
        grounds: ["entities.MealPeriodService.fields.posted_waste_kg", "calculations.sustainability_metrics"]
        excluded_because:
          difficulty_instance: compensating_invariant / waste_posted_mass_conservation
          rationale: "Posted-mass stability across verify/reject and single-counting after post are asserted there."
      - name: dual_variant_corners
        claim_type: dual_variant_calculation
        grounds: ["calculations.production_forecast_portions", "calculations.commission_settlement"]
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_base_vs_trend_variants
          rationale: "Both variants of both calculations are exercised with literal expected values in the two difficulty instances."
      - name: occ_happy_path_increments_corner
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[forecast-create-stale-period]"]
        excluded_because:
          difficulty_instance: compensating_invariant / forecast_locked_cardinality_conservation
          rationale: "The supersede write path (which carries a fresh expected_meal_period_version) is exercised there; the stale-path rejection lives in occ_forecast_create_stale_version above."

  # ===========================================================================
  # Section: consistency_model — immediate read-after-write
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_submit_then_read
        claim_type: immediate_consistency
        grounds: [complexity_profile, "calculations.department_budget_ledger"]
        distinguishing_aspect: "The submit response itself carries approval_status == SUBMITTED, and an immediate GET on the department shows the reservation — no eventual-consistency lag."
        test_recipe:
          setup: ["Hall, recipe, department (budget 500000); DRAFT order quoted 50000"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall CM1", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Film", department_code: "FILM", semester_budget_cents: 500000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-24", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { os: $.data.approval_status } }
            - { call: "GET /departments/${d}", payload: {}, as: HallManager, captures: { rs: $.data.reserved_cents, av: $.data.available_cents } }
          assert:
            - "Submit response: approval_status == SUBMITTED (state change visible in the same response)"
            - "Immediate GET /departments/${d}: reserved_cents == 50000 and available_cents == 450000"

  # ===========================================================================
  # Section: state_machines (appendix) — PLANNED initial state + assign path
  # ===========================================================================
  - section: state_machines
    instances:
      - name: labor_shift_planned_initial_then_assign
        claim_type: initial_state
        grounds: ["state_machines.LaborShift.PLANNED_to_ASSIGNED", "entities.LaborShift.fields.staff_ref"]
        distinguishing_aspect: "Creating a shift without staff_ref lands in PLANNED; assign moves it to ASSIGNED and runs the overlap/rest checks at that point."
        test_recipe:
          setup: ["Hall ACTIVE; one shift created without staff_ref (PLANNED)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM11", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", role: "DISHWASHER", shift_date: "2026-08-14", start_minute: 960, end_minute: 1200, hourly_rate_cents: 1800 }, as: HallManager, captures: { s: $.data.id, s0: $.data.status } }
          trigger:
            - { call: "POST /labor-shifts/${s}/assign", payload: { staff_ref: "S11" }, as: HallManager, captures: { s1: $.data.status, s1ref: $.data.staff_ref } }
          assert:
            - "At creation: status == PLANNED and staff_ref is null"
            - "After assign: status == ASSIGNED and staff_ref == 'S11'"
