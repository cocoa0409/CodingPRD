            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 2, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
