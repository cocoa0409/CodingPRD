    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or undeclared role value" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or ownership check failed (Participant/Moderator acting on a resource they do not own), or breach-case action by a non-adjudicator counsel" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or numeric range violation (age < 13, max_age < min_age, capacity/quota < 1, reproducibility outside [0,1], answer points outside [0, max_points], etc.)" }
  - { id: ERR_WINDOW_VIOLATION, http: 422, condition: "ends_at <= starts_at on session create or reschedule" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that forbids the requested transition (generic state-machine rejection)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC conflict on study amend or session reschedule)" }
  - { id: ERR_STUDY_NOT_RECRUITING, http: 409, condition: "Application create or approve attempted while the study is not RECRUITING" }
  - { id: ERR_STUDY_NOT_CLOSED, http: 409, condition: "Session start attempted while the study is not in {CLOSED, ANALYSIS}" }
  - { id: ERR_PARTICIPANT_NOT_ACTIVE, http: 409, condition: "Application create by a non-ACTIVE participant, or payout approve for a BANNED participant" }
  - { id: ERR_COHORT_FULL, http: 422, condition: "Approve attempted while study.enrolled_count >= study.cohort_capacity (boundary: equality means full)" }
  - { id: ERR_FIT_SCORE_BELOW_THRESHOLD, http: 422, condition: "Approve attempted with fit_score_final < 60" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "A non-terminal application already exists for (study_id, participant_id)" }
  - { id: ERR_NDA_NOT_PUBLISHED, http: 409, condition: "Approve attempted while no NdaAgreement is PUBLISHED for the study" }
  - { id: ERR_NDA_NOT_SIGNED, http: 422, condition: "Access-key issue attempted without a SIGNED signature on the study's current PUBLISHED agreement (safety gate, outranks quota)" }
  - { id: ERR_SIGNATURE_EXPIRED, http: 422, condition: "Sign attempted with now >= signature.expires_at (boundary: equality is expired)" }
  - { id: ERR_BUILD_NOT_RELEASED, http: 409, condition: "Access-key issue attempted against a build not in RELEASED" }
  - { id: ERR_KEY_QUOTA_EXCEEDED, http: 422, condition: "Issue attempted while build.keys_active_count >= build.max_keys (boundary: equality means full)" }
  - { id: ERR_KEY_EXPIRED, http: 422, condition: "Redeem attempted with now >= key.expires_at (boundary: equality is expired)" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "An ISSUED or REDEEMED key already exists for (build_id, participant_id)" }
  - { id: ERR_STATION_REQUIRED, http: 422, condition: "IN_LAB session created/rescheduled without station_id (or station OUT_OF_SERVICE); also when station_id is supplied for a REMOTE session" }
  - { id: ERR_STATION_CONFLICT, http: 409, condition: "Station double-booked under half-open interval semantics: overlap iff new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at; touching endpoints (end == start) do NOT conflict. Only sessions in {SCHEDULED, IN_PROGRESS} occupy a station." }
  - { id: ERR_MODERATOR_REQUIRED, http: 422, condition: "Session start attempted without an assigned moderator" }
  - { id: ERR_MODERATOR_CONFLICT, http: 409, condition: "Moderator double-booked under buffered semantics: conflict iff new.starts_at < existing.ends_at + 15 min AND existing.starts_at < new.ends_at + 15 min; a gap of exactly 15 minutes is allowed, anything smaller conflicts. Only the moderator's sessions in {SCHEDULED, IN_PROGRESS} count." }
  - { id: ERR_PARTICIPANT_CONFLICT, http: 409, condition: "Participant double-booked under closed-interval semantics: conflict iff new.starts_at <= existing.ends_at AND existing.starts_at <= new.ends_at; touching endpoints (end == start) DO conflict. Only the participant's sessions with a booking in {BOOKED, PROMOTED} count." }
  - { id: ERR_SESSION_NOT_BOOKABLE, http: 409, condition: "Booking attempted into a session not in SCHEDULED" }
  - { id: ERR_SESSION_NOT_IN_WINDOW, http: 422, condition: "Session start attempted with now outside [starts_at, ends_at] (inclusive both ends)" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "A non-terminal booking already exists for (session_id, participant_id)" }
  - { id: ERR_NOT_ENROLLED, http: 422, condition: "Booking attempted without an ENROLLED application for (participant, session's study)" }
  - { id: ERR_ATTENDANCE_REQUIRED, http: 422, condition: "Survey submit attempted without an ATTENDED booking for (session, participant)" }
  - { id: ERR_UNKNOWN_QUESTION, http: 422, condition: "Survey submit with an answer question_key absent from the instrument" }
  - { id: ERR_DUPLICATE_RESPONSE, http: 409, condition: "A response already exists for (instrument_id, session_id, participant_id)" }
  - { id: ERR_INSTRUMENT_ALREADY_PUBLISHED, http: 409, condition: "Publish attempted while another instrument for the study is PUBLISHED" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Approve attempted with budget_committed_cents + final amount > incentive_budget_cents (fiscal; evaluated after all other checks)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Payout approve by its creator, or issue by its approver" }
  - { id: ERR_OPEN_BREACH_EXISTS, http: 409, condition: "Reinstate attempted while a breach case for the participant is in {REPORTED, UNDER_INVESTIGATION, SUBSTANTIATED}" }
  - { id: ERR_REPORTER_CANNOT_ADJUDICATE, http: 403, condition: "Breach open-investigation attempted with X-User-ID == reported_by_user_id" }
  - { id: ERR_NO_COMPENSABLE_ACTIVITY, http: 422, condition: "Payout create attempted with zero ATTENDED bookings for (study, participant)" }
  - { id: ERR_DUPLICATE_PAYOUT, http: 409, condition: "A non-VOID payout already exists for (study_id, participant_id)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ResearchOpsAdmin
    description: "Operations administrator: owns participants, moderators, studies, builds, keys, stations, clock and sweeps."
    identity: opaque
    exclusive_operations:
      - "POST /playtests/_clock/set_current_utc"
      - "POST /playtests/_sweeps/run-expiry"
      - "POST /playtests/participants"
      - "POST /playtests/participants/{id}/activate"
      - "POST /playtests/participants/{id}/verify-attributes"
      - "POST /playtests/participants/{id}/suspend"
      - "POST /playtests/participants/{id}/reinstate"
      - "POST /playtests/moderators"
      - "PATCH /playtests/moderators/{id}"
      - "POST /playtests/studies"
      - "PATCH /playtests/studies/{id}"
      - "POST /playtests/studies/{id}/open-recruitment"
      - "POST /playtests/studies/{id}/close-recruitment"
      - "POST /playtests/studies/{id}/complete"
      - "POST /playtests/builds"
      - "POST /playtests/builds/{id}/release"
      - "POST /playtests/builds/{id}/retire"
      - "POST /playtests/access-keys"
      - "POST /playtests/lab-stations"
      - "PATCH /playtests/lab-stations/{id}"
    shared_operations:
      - "GET read endpoints shared with staff roles"
      - "POST /playtests/session-bookings/{id}/cancel (shared with Participant owner)"
      - "POST /playtests/sessions/{id}/cancel (shared with Researcher)"
      - "POST /playtests/access-keys/{id}/revoke (shared with LegalCounsel)"
  - name: Researcher
    description: "User researcher: reviews applications, designs survey instruments, schedules sessions, triages and routes feedback, reports breaches."
    identity: opaque
    exclusive_operations:
      - "POST /playtests/applications/{id}/start-review"
      - "POST /playtests/applications/{id}/request-info"
      - "POST /playtests/applications/{id}/approve"
      - "POST /playtests/applications/{id}/reject"
      - "POST /playtests/studies/{id}/begin-analysis"
      - "POST /playtests/sessions"
      - "POST /playtests/sessions/{id}/assign-moderator"
      - "PATCH /playtests/sessions/{id}/reschedule"
      - "POST /playtests/survey-instruments"
      - "POST /playtests/survey-instruments/{id}/publish"
      - "POST /playtests/survey-instruments/{id}/retire"
      - "POST /playtests/feedback-tickets/{id}/triage"
      - "POST /playtests/feedback-tickets/{id}/request-info"
      - "POST /playtests/feedback-tickets/{id}/route"
      - "POST /playtests/feedback-tickets/{id}/resolve"
      - "POST /playtests/feedback-tickets/{id}/mark-wont-fix"
    shared_operations:
      - "GET read endpoints shared with staff roles"
      - "POST /playtests/feedback-tickets (shared with Moderator)"
      - "POST /playtests/breach-cases (shared with Moderator)"
      - "POST /playtests/sessions/{id}/cancel (shared with ResearchOpsAdmin)"
  - name: Moderator
    description: "Session moderator: runs assigned sessions, marks attendance and no-shows, files feedback and breach reports."
    identity: "entity_backed:Moderator"
    exclusive_operations:
      - "POST /playtests/sessions/{id}/start"
      - "POST /playtests/sessions/{id}/complete"
      - "POST /playtests/session-bookings/{id}/mark-attended"
      - "POST /playtests/session-bookings/{id}/mark-no-show"
    shared_operations:
      - "GET read endpoints shared with staff roles"
      - "POST /playtests/feedback-tickets (shared with Researcher)"
      - "POST /playtests/breach-cases (shared with Researcher)"
  - name: Participant
    description: "Playtest participant: applies to studies, signs NDAs, books and cancels sessions, redeems keys, submits surveys."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /playtests/applications"
      - "POST /playtests/applications/{id}/submit-info"
      - "POST /playtests/applications/{id}/withdraw"
      - "POST /playtests/nda-signatures/{id}/sign"
      - "POST /playtests/session-bookings"
      - "POST /playtests/access-keys/{id}/redeem"
      - "POST /playtests/survey-responses"
      - "POST /playtests/survey-responses/{id}/submit"
    shared_operations:
      - "GET read endpoints shared with staff roles"
      - "POST /playtests/session-bookings/{id}/cancel (shared with ResearchOpsAdmin)"
  - name: IncentiveOfficer
    description: "Compensation officer: drafts, submits, approves, rejects and issues incentive payouts under segregation-of-duties control."
    identity: opaque
    exclusive_operations:
      - "POST /playtests/incentive-payouts"
      - "POST /playtests/incentive-payouts/{id}/submit"
      - "POST /playtests/incentive-payouts/{id}/approve"
      - "POST /playtests/incentive-payouts/{id}/reject"
      - "POST /playtests/incentive-payouts/{id}/resubmit"
      - "POST /playtests/incentive-payouts/{id}/issue"
    shared_operations:
      - "GET /playtests/incentive-payouts* (shared with ResearchOpsAdmin)"
      - "GET /playtests/participants* and GET /playtests/studies* (shared with staff)"
  - name: LegalCounsel
    description: "Legal counsel: authors and publishes NDA versions, adjudicates breach cases, bans participants, revokes keys."
    identity: opaque
    exclusive_operations:
      - "POST /playtests/nda-agreements"
      - "POST /playtests/nda-agreements/{id}/publish"
      - "POST /playtests/participants/{id}/ban"
      - "POST /playtests/breach-cases/{id}/open-investigation"
      - "POST /playtests/breach-cases/{id}/substantiate"
      - "POST /playtests/breach-cases/{id}/dismiss"
      - "POST /playtests/breach-cases/{id}/sanction"
    shared_operations:
      - "GET read endpoints shared with staff roles"
      - "POST /playtests/access-keys/{id}/revoke (shared with ResearchOpsAdmin)"
