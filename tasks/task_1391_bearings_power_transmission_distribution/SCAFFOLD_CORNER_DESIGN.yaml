      - name: factory_cutoff_boundary_at_exact_cutoff_hour
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_FACTORY_ORDER_CUTOFF_PASSED]"
        distinguishing_aspect: "Cutoff uses >= semantics: NONE-tier factory order at local 13:59 succeeds; the identical request at 14:00 fails — verified on two lines of one order with the clock pinned each time."
        test_recipe:
          setup: ["confirmed order with lines l1 (NONE) and l2 (NONE); branch cutoff 14 (tz 0)"]
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6035", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
