              captures: { unit: $.data.unit_price_cents, line: $.data.line_total_cents }
          assert:
            - "PassAddOn.unit_price_cents == 2500"
            - "PassAddOn.line_total_cents == 2500"

      - name: late_cancel_partial_refund_socks_only
        claim_type: Variant Divergence
        grounds: [calculations.cancellation_refund, entities.JumpPass.fields.payment_status]
        distinguishing_aspect: "Late cancel (clock 2026-06-20T09:00:00Z, only 60 min before start < 120 cutoff) of a paid pass (paid 2350) refunds only socks 350, forfeits the 2000 pass price -> payment_status PARTIALLY_REFUNDED, amount_refunded_cents 350."
        test_recipe:
          setup: ["Paid reservation pass base 2000 + 1 sock; clock advanced to 60 min before start."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "LC J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:00:00Z" }
              as: ParkManager
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { refunded: $.data.amount_refunded_cents, paystatus: $.data.payment_status }
          assert:
            - "JumpPass.${pass_id}.amount_refunded_cents == 350"
            - "JumpPass.${pass_id}.payment_status == PARTIALLY_REFUNDED"

      - name: pass_pricing_inclusion_variant_only_socks
        claim_type: Variant Selection
        grounds: [calculations.pass_pricing]
        excluded_because:
          difficulty_instance: dual_variant_calc / pass_pricing_inclusion_vs_discount_on_jump_pass
          rationale: "Inclusion variant (only socks billed -> 350) is the asserted path of the named §1.8 dual-variant instance."

      - name: membership_renewal_resets_inclusion
        claim_type: Reconciliation
        grounds: [calculations.membership_pricing, entities.Membership.fields.included_visits_remaining]
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_cyclic_active_pastdue_active_loop
          rationale: "Inclusion reset to tier allotment on renewal cure is asserted (==4) in the cyclic membership §1.8 instance."

