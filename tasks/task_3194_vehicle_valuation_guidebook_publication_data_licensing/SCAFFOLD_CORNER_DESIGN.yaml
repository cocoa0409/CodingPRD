              payload: { source_id: "${src_fund_d}", submission_ref: "b-fund", items: [ { configuration_id: "${cfg_fund}", region_id: "${r_fund}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_fund: $.data.id }
            - call: "POST /batches/${b_fund}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_fund}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_fund}", region_id: "${r_fund}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-fund" }
              as: ValuationAdmin
              captures: { s_fund: $.data.id }
            - call: "POST /valuation-series/${s_fund}/activate"
              payload: {}
              as: ValuationAdmin
