# =============================================================================
# Task 983 — Beehive Hosting & Backyard-Hive Service
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2-3 instances = 26 instances. All arithmetic literals precomputed
# with decimal arithmetic per SCAFFOLD.yaml §1.3 precision pins.
# Logical clock default is 2026-05-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: three instances on three DIFFERENT entity domains
  # (HoneyAllocation accounting, Subscription/Invoice billing, Hive posture)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: honey_share_projected_vs_final_variant
        grounds:
          - calculations.honey_share_allocation
          - entities.HoneyAllocation.fields.projected_host_kg
          - entities.HoneyAllocation.fields.host_kg
        distinguishing_aspect: |
          Same (season, hive) harvest data, two sanctioned algorithms on the honey-allocation
          domain: projected includes RECORDED harvest h3 and reads the amended 3450 bps live
          (7.866 kg); final at rollover counts APPROVED harvests only (6.141 kg). The variants
          diverge by both input-set filter and bps pinning time.
        test_recipe:
          setup:
            - "Season S1 OPEN (frost 2026-10-15); host ACTIVE, waiver current; PLUS subscription with first invoice PAID; HOST-101 COMPLETED"
            - "Site (capacity 2) CLEAR; agreement ACTIVE, host_share_base_bps amended 2500 -> 3000 mid-season; one hive installed"
            - "h1 APPROVED net 9.800 kg; h2 APPROVED net 8.000 kg; h3 RECORDED net 5.000 kg (never approved)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host One", email: "h1@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "1 Oak Ln", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}", captures: { ag_v: $.data.version } }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "PLUS" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "HOST-101" }, as: Host, as_user_id: "${h}", captures: { en: $.data.id } }
            - { call: "POST /api/enrollments/${en}/complete", payload: { quiz_score: 95 }, as: PlatformOps }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-07-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-07-10T00:00:00Z", gross_kg: 10.000, moisture_pct: 19.6 }, as: Beekeeper, as_user_id: "bk-1", captures: { h1: $.data.id } }
            - { call: "POST /api/harvests/${h1}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-08-01T00:00:00Z", mites_counted: 1, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 11.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i2: $.data.id } }
            - { call: "POST /api/inspections/${i2}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i2}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-08-10T00:00:00Z", gross_kg: 8.000, moisture_pct: 18.6 }, as: Beekeeper, as_user_id: "bk-1", captures: { h2: $.data.id } }
            - { call: "POST /api/harvests/${h2}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 3000, expected_agreement_version: "${ag_v}" }, as: PlatformOps, captures: { ag_v2: $.data.version } }
            - { call: "POST /api/agreements/${ag}/accept-amendment", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-09-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 13.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i3: $.data.id } }
            - { call: "POST /api/inspections/${i3}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i3}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-09-05T00:00:00Z", gross_kg: 5.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { h3: $.data.id } }
            - { call: "GET /api/allocations", payload: { hive_id: "${hv}", season_id: "${s1}" }, as: PlatformOps, captures: { alloc: "$.data[0].id" } }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps, captures: { proj_host: $.data.projected_host_kg, proj_pool: $.data.projected_pool_net_kg } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps }
          assert:
            - "captured ${proj_host} == 7.866 (projected: per-harvest round of (9.800, 8.000, 5.000) x 3450/10000 -> 3.381 + 2.760 + 1.725)"
            - "captured ${proj_pool} == 22.800 (RECORDED h3 included in the projected input set)"
            - "after rollover HoneyAllocation.${alloc}.status == FINALIZED"
            - "HoneyAllocation.${alloc}.host_kg == 6.141 (final: APPROVED only -> 3.381 + 2.760)"
            - "HoneyAllocation.${alloc}.pool_net_kg == 17.800"
            - "HoneyAllocation.${alloc}.effective_bps == 3450"
            - "7.866 != 6.141 — identical harvest ledger, two valid variants, different results"

      - name: overwinter_credit_projected_vs_realized
        grounds:
          - calculations.overwinter_credit
          - entities.Subscription.fields.projected_overwinter_credit_cents
          - entities.Invoice.fields.overwinter_credit_cents
        distinguishing_aspect: |
          Billing-domain dual variant: the projected credit computed live on Subscription read
          counts hive2 alive at read time (8000 cents for 2 hives); the realized variant on the
          rollover-issued invoice counts only hives alive at season close (4000 cents) because
          hive2 was marked DEAD between the read and the close.
        test_recipe:
          setup:
            - "Season S1 OPEN with frost_date 2026-10-15; host ACTIVE; BASIC subscription with first invoice PAID"
            - "Two hives installed 2026-05-01 (both installed_at <= frost_date); logical clock 2026-10-18 when hive2 dies; rollover at 2026-10-20"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Two", email: "h2@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "2 Birch Rd", base_capacity_hives: 2, water_source: true, setback_feet: 8 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "GET /api/subscriptions/${sub}", payload: {}, as: PlatformOps, captures: { proj_credit: $.data.projected_overwinter_credit_cents } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-18T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/hives/${hv2}/mark-dead", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv2: "$.data[1].id" } }
            - { call: "GET /api/invoices/${inv2}", payload: {}, as: PlatformOps }
          assert:
            - "captured ${proj_credit} == 8000 (provisional variant: both hives alive at read time)"
            - "Invoice.${inv2}.overwinter_credit_cents == 4000 (realized variant: only hive1 survived to close)"
            - "Invoice.${inv2}.fee_cents == 2999 and Invoice.${inv2}.carried_balance_cents == 0 and Invoice.${inv2}.late_fee_cents == 0"
            - "Invoice.${inv2}.total_cents == 0 (max(0, 2999 + 0 + 0 - 4000))"
            - "Invoice.${inv1}.status == PAID (paid before rollover, so no aging side effects pollute the variant comparison)"

      - name: posture_provisional_vs_authoritative_gating
        grounds:
          - calculations.hive_posture_derivation
          - entities.Hive.fields.posture
          - entities.Hive.fields.provisional_posture
          - state_machines.Hive.ACTIVE_to_QUARANTINED
        distinguishing_aspect: |
          Hive-domain dual variant: with a bad inspection merely SUBMITTED (mites 9.00/100),
          provisional_posture flips to QUARANTINED while authoritative posture stays THRIVING
          and a harvest create still succeeds; verifying that inspection flips the authoritative
          variant and the lifecycle, voiding the in-flight harvest.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; site CLEAR; agreement ACTIVE; hive installed"
            - "Verified healthy inspection at 2026-05-02 (0.00 mites/100, brood 9, queen seen, stores 12) -> posture THRIVING"
            - "Bad inspection (9 mites / 100 bees = 9.00) recorded and SUBMITTED but NOT verified"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Three", email: "h3@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "3 Cedar Ave", base_capacity_hives: 2, water_source: true, setback_feet: 12 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-02T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { ok_insp: $.data.id } }
            - { call: "POST /api/inspections/${ok_insp}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${ok_insp}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-18T00:00:00Z", mites_counted: 9, bees_sampled: 100, disease_flag: false, brood_score: 7, queen_seen: true, stores_kg: 9.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { bad_insp: $.data.id } }
            - { call: "POST /api/inspections/${bad_insp}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "GET /api/hives/${hv}", payload: {}, as: ApiaryManager, captures: { posture_pre: $.data.posture, prov_pre: $.data.provisional_posture } }
          trigger:
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-05-20T00:00:00Z", gross_kg: 4.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { har: $.data.id } }
            - { call: "POST /api/inspections/${bad_insp}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/hives/${hv}", payload: {}, as: ApiaryManager }
            - { call: "GET /api/harvests/${har}", payload: {}, as: ApiaryManager }
          assert:
            - "captured ${posture_pre} == THRIVING (authoritative variant: SUBMITTED inspection excluded)"
            - "captured ${prov_pre} == QUARANTINED (provisional variant: SUBMITTED inspection with 9.00 mites/100 included)"
            - "harvest create under THRIVING authoritative posture succeeded: Harvest.${har}.status == RECORDED at creation"
            - "after verify: Hive.${hv}.posture == QUARANTINED and Hive.${hv}.lifecycle_status == QUARANTINED"
            - "after verify cascade: Harvest.${har}.status == VOIDED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: three instances in three DIFFERENT modes
  # (a) multi-input non-linear, (b) nested rounding order, (c) pinned evaluation order
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: share_formula_cap_tier_edu_combination
        grounds:
          - calculations.honey_share_allocation
          - calculations.season_pool_and_reserve
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — effective_bps = min(5500 base +
          500 PREMIUM tier + 200 education, 6000 cap) engages the nested-min cap: uncapped 6200 bps
          would give 12.400 kg, the cap pins host_kg to 12.000 kg on a 20.000 kg pool.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver and HOST-101 COMPLETED (before subscription creation)"
            - "PREMIUM subscription (7999 cents, invoice paid); agreement ACTIVE with host_share_base_bps 5500; one hive"
            - "One APPROVED harvest: gross 20.000 kg, moisture 18.0 -> net 20.000 kg"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Four", email: "h4@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "HOST-101" }, as: Host, as_user_id: "${h}", captures: { en: $.data.id } }
            - { call: "POST /api/enrollments/${en}/complete", payload: { quiz_score: 88 }, as: PlatformOps }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "4 Elm St", base_capacity_hives: 2, water_source: true, setback_feet: 9 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 5500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "PREMIUM" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-06-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 14.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-15T00:00:00Z", gross_kg: 20.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { h1: $.data.id } }
            - { call: "POST /api/harvests/${h1}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/allocations", payload: { hive_id: "${hv}", season_id: "${s1}" }, as: PlatformOps, captures: { alloc: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps }
          assert:
            - "HoneyAllocation.${alloc}.effective_bps == 6000 (min(5500 + 500 + 200, 6000) — cap engaged, not 6200)"
            - "HoneyAllocation.${alloc}.host_kg == 12.000 (round3(20.000 * 6000/10000); uncapped would be 12.400)"
            - "HoneyAllocation.${alloc}.edu_bonus_kg == 0.400 (round3(20.000 * 200/10000))"
            - "HoneyAllocation.${alloc}.reserve_kg == 1.000 (round3(20.000 * 0.03) + 0.400)"
            - "HoneyAllocation.${alloc}.operator_kg == 7.000 (20.000 - 12.000 - 1.000)"

      - name: per_harvest_rounding_order_pinned
        grounds:
          - calculations.honey_share_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-harvest-then-sum.
          Two harvests of net 1.005 kg at 1000 bps: per-harvest round3(1.005 * 0.10) = 0.101 each,
          summed 0.202; the forbidden sum-then-round order gives round3(2.010 * 0.10) = 0.201.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; NO subscription (tier bonus 0); no education"
            - "Agreement ACTIVE with host_share_base_bps 1000; one hive; two APPROVED harvests each gross 1.005 kg at 18.0% moisture (net 1.005 each)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Five", email: "h5@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "5 Pine Dr", base_capacity_hives: 2, water_source: false, setback_feet: 6 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 1000 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
