      - name: claim_lifecycle_refusals_including_the_arbiter_conflict
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DUPLICATE_CLAIM]
          - errors[ERR_CLAIM_NOT_DISPUTABLE]
          - errors[ERR_DISPUTER_IS_CLAIMANT]
          - errors[ERR_ARBITER_CONFLICT]
          - validations[priority=100]
          - validations[priority=120]
        distinguishing_aspect: |
          Four distinct refusals along one claim's life: the uniqueness key (cycle, matter,
          claimant) rejects a second filing, a DRAFT claim is not yet disputable, a partner
          may not dispute their own claim, and an arbiter who happens to be the matter's
          responsible attorney is conflicted out even though they hold the CreditArbiter
          role and the claim is otherwise adjudicable.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Matter M for the new client CLI-CF has billing attorney P1 and responsible attorney ARB, where ARB is the firm's only credit arbiter; P2 is an uninvolved partner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Claim One", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Claim Two", practice_group: "LITIGATION", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Arb Conflicted", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-CF", client_display_name: "Conflicted Client Corp", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${p1}", responsible_attorney_id: "${arb}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "I sourced this client." }
              as: Partner
              as_user_id: "${p1}"
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 90.00, narrative: "Filing again with a lower ask." }
              as: Partner
              as_user_id: "${p1}"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl}/dispute"
              payload: { contested_pct: 50.00, dispute_grounds: "I introduced the general counsel." }
              as: Partner
              as_user_id: "${p2}"
              captures: { e_notdisp: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1}"
              captures: { st: "$.data.state" }
            - call: "POST /comp/credit-claims/${cl}/dispute"
              payload: { contested_pct: 10.00, dispute_grounds: "Disputing my own filing." }
              as: Partner
              as_user_id: "${p1}"
              captures: { e_self: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${mv}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { e_conf: "$.data.error_id" }
          assert:
            - "${e_dup} == ERR_DUPLICATE_CLAIM with HTTP 409 - (cycle_id, matter_id, claimant_partner_id) is unique"
            - "${e_notdisp} == ERR_CLAIM_NOT_DISPUTABLE with HTTP 409, because the claim was still DRAFT"
            - "${st} == SUBMITTED"
            - "${e_self} == ERR_DISPUTER_IS_CLAIMANT with HTTP 403"
            - "${e_conf} == ERR_ARBITER_CONFLICT with HTTP 403, because ${arb} is the matter's responsible attorney"
            - "CreditClaim.${cl}.state is still SUBMITTED and disputing_partner_id is null"
            - "Matter.${m}.origination_pct_assigned == 0.00 and Matter.${m}.version == ${mv}"

      - name: assessment_and_peer_review_refusals_across_the_stage_windows
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DUPLICATE_ASSESSMENT]
          - errors[ERR_ASSESSMENT_NOT_REVIEWABLE]
          - errors[ERR_ASSESSMENT_NOT_MUTABLE]
          - errors[ERR_ASSESSMENT_WINDOW_CLOSED]
          - errors[ERR_REVIEW_WINDOW_CLOSED]
          - errors[ERR_SELF_REVIEW_FORBIDDEN]
          - errors[ERR_DUPLICATE_REVIEW_ASSIGNMENT]
          - errors[ERR_REVIEW_ALREADY_DECIDED]
        distinguishing_aspect: |
          Assessment creation carries no cycle-stage precondition while submission and
          scoring do, which is what makes all seven refusals reachable in one chain: a
          record can be opened during OPEN_INTAKE, but submitting it there is
          ERR_ASSESSMENT_WINDOW_CLOSED and scoring it there is ERR_REVIEW_WINDOW_CLOSED,
          while the priority-70 state checks (ERR_ASSESSMENT_NOT_REVIEWABLE,
          ERR_ASSESSMENT_NOT_MUTABLE, ERR_REVIEW_ALREADY_DECIDED) fire ahead of the
          priority-90 window checks.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 sits in OPEN_INTAKE with assessment_deadline_on 2026-10-31."
            - "Partner PY is evaluation_required; C1 is a committee member with evaluation_required false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ass Essed", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { py: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ref Uses", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Opened before the stage window opened.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${py}"
              captures: { sa: "$.data.id" }
          trigger:
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "A second assessment for the same cycle.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${py}"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { e_notrev: "$.data.error_id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${py}" }
              as: CycleAdmin
              captures: { e_selfrev: "$.data.error_id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { e_duprev: "$.data.error_id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Too early to score." }
              as: Partner
              as_user_id: "${c1}"
              captures: { e_revwin: "$.data.error_id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${py}"
              captures: { e_asswin: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${py}"
              captures: { st: "$.data.state" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${py}"
              captures: { e_notmut: "$.data.error_id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Now in window." }
              as: Partner
              as_user_id: "${c1}"
              captures: { rst: "$.data.state" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "RECUSE", recusal_reason: "Changed my mind after scoring." }
              as: Partner
              as_user_id: "${c1}"
              captures: { e_already: "$.data.error_id" }
          assert:
            - "${e_dup} == ERR_DUPLICATE_ASSESSMENT with HTTP 409"
            - "${e_notrev} == ERR_ASSESSMENT_NOT_REVIEWABLE with HTTP 409 - the priority-70 state check beats the priority-90 window check"
            - "${e_selfrev} == ERR_SELF_REVIEW_FORBIDDEN with HTTP 403"
            - "${e_duprev} == ERR_DUPLICATE_REVIEW_ASSIGNMENT with HTTP 409"
            - "${e_revwin} == ERR_REVIEW_WINDOW_CLOSED with HTTP 409, because the cycle was still OPEN_INTAKE"
            - "${e_asswin} == ERR_ASSESSMENT_WINDOW_CLOSED with HTTP 409, for the same reason"
            - "${st} == SUBMITTED once the cycle reaches SELF_ASSESSMENT"
            - "${e_notmut} == ERR_ASSESSMENT_NOT_MUTABLE with HTTP 409"
            - "${rst} == SCORED and SelfAssessment.${sa}.scored_review_count == 1"
            - "${e_already} == ERR_REVIEW_ALREADY_DECIDED with HTTP 409, and PeerReview.${r1}.state is still SCORED"

      - name: ballot_and_award_readiness_refusals_including_the_reopen_bound
        claim_type: Violation → Error
        grounds:
          - errors[ERR_AWARD_NOT_DRAWABLE]
          - errors[ERR_AWARD_NOT_TRUE_UP_READY]
          - errors[ERR_QUORUM_NOT_MET]
          - errors[ERR_POINTS_CAP_EXCEEDED]
          - errors[ERR_BALLOT_ALREADY_DECIDED]
          - errors[ERR_CYCLE_NOT_REOPENABLE]
          - errors[ERR_AWARDS_NOT_SETTLED]
          - governance_constants.MAX_REOPENS
        distinguishing_aspect: |
          Seven readiness refusals along one cycle's publication path, including the loop
          bound on the reconsideration cycle: the first reopen is accepted and sets
          reopen_count to 1, the second is refused with ERR_CYCLE_NOT_REOPENABLE because
          reopen_count has reached MAX_REOPENS, and the already-CAST ballots survive the
          reopen so the second publication does not have to re-establish quorum.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 with discretionary_pool_pct 0.2000 and lockstep_unit_cents 0."
            - "Subject S is DISCRETIONARY and evaluation_required; C1 and C2 are committee members with evaluation_required false."
            - "S's assessment is ACCEPTED after two SCORED reviews and the cycle has reached DELIBERATION, so two PENDING ballots and one PROPOSED award exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
