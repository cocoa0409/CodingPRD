            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-2100-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "TREE_ROOT_UPHEAVAL", measured_offset_inches: 0.75, area_sqft: 30, city_tree_involved: true }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "GET /defects/${defect_id}/forestry-reviews", as: ForestryOfficer, captures: { review_id: "$.data[0].id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /forestry-reviews/${review_id}/decision", payload: { decision: "PRUNE_APPROVED" }, as: ForestryOfficer, as_user_id: "for-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /forestry-reviews/${review_id}/clear", as: ForestryOfficer, as_user_id: "for-1", captures: { cleared_at: "$.data.work_completed_at", r_status: "$.data.status" } }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-D", work_window_start: "2026-09-26", work_window_end: "2026-10-10", bid_deadline: "2026-09-24T00:00:00Z" }, as: ProgramCoordinator, captures: { batchB1: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batchB1}", notice_id: "${notice_id}", scope_sqft: 30, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item1: "$.data.id" } }
          trigger:
            - { call: "POST /bid-batches/${batchB1}/seal", as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "POST /batch-work-items/${item1}/remove", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-E", work_window_start: "2026-09-27", work_window_end: "2026-10-10", bid_deadline: "2026-09-24T00:00:00Z" }, as: ProgramCoordinator, captures: { batchB2: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batchB2}", notice_id: "${notice_id}", scope_sqft: 30, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batchB2}/seal", as: ProgramCoordinator, captures: { seal2_status: "$.data.status" } }
          assert:
            - "cleared_at == 2026-09-20T00:00:00Z and r_status == CLEARED"
            - "err == ERR_CURE_WINDOW_VIOLATION for window start 2026-09-26 (6 days < 7-day buffer)"
            - "seal2_status == SEALED_FOR_BIDDING for window start 2026-09-27 (exactly D+7 satisfies >=)"

  - rule_id: compensating_invariant
    instances:
      - name: obligate_then_withdraw_restores_funds
        grounds:
          - calculations.program_cap_reservation
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
          - state_machines.CostShareApplication.OBLIGATED_to_WITHDRAWN
          - entities.ProgramCycle.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity: fiscal cents — the funds identity
          appropriation_cents == committed_cents + disbursed_cents + available_cents
          must hold before the pair, after the forward obligate, and after the compensating
          withdraw; the pair's net effect on committed_cents and available_cents is exactly zero.
        test_recipe:
          setup:
            - "cycle appropriation 10000000; application qty 100 APPROVED (provisional 60000)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Xena Xyla", mailing_address: "35 Xyla St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-2200", owner_id: "${owner_id}", street_address: "35 Xyla St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-2200-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed_mid: "$.data.committed_cents", available_mid: "$.data.available_cents" } }
            - { call: "POST /cost-share-applications/${app_id}/withdraw", as: PropertyOwner, as_user_id: "${owner_id}", captures: { r3: "$.data.review_status", p3: "$.data.payment_status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed_end: "$.data.committed_cents", disbursed_end: "$.data.disbursed_cents", available_end: "$.data.available_cents" } }
          assert:
            - "committed_mid == 60000 and available_mid == 9940000 (forward action)"
            - "r3 == WITHDRAWN and p3 == RELEASED (compensating action)"
            - "committed_end == 0 and disbursed_end == 0 and available_end == 10000000 — the pair conserves the funds identity with zero net drift"

      - name: issue_then_appeal_reversal_restores_defect_pool
        grounds:
          - state_machines.RepairNotice.UNDER_APPEAL_to_VOID
          - state_machines.Defect.UNDER_REPAIR_to_OPEN
          - entities.SidewalkSegment.fields.open_defect_count
        distinguishing_aspect: |
          Conserved quantity: integer cardinality (different type from fiscal cents) — the
          segment's open_defect_count over statuses {OPEN, AWAITING_FORESTRY, UNDER_REPAIR}.
          The issue + appeal-reversal pair must leave the count at its pre-pair value (2) and
          revert the segment status UNDER_NOTICE -> FLAGGED.
        test_recipe:
          setup:
            - "owner/parcel; one segment with two OPEN defects (open_defect_count 2); notice issued over both (defects UNDER_REPAIR, segment UNDER_NOTICE); appeal filed within deadline"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Yara Yew", mailing_address: "36 Yew St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-2300", owner_id: "${owner_id}", street_address: "36 Yew St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-2300-1", length_ft: 30, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { def1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SETTLEMENT", area_sqft: 12 }, as: Inspector, as_user_id: "insp-1", captures: { def2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${def1_id}", "${def2_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "GET /segments/${segment_id}", as: ProgramCoordinator, captures: { count_mid: "$.data.open_defect_count", seg_mid: "$.data.status" } }
            - { call: "POST /repair-notices/${notice_id}/appeal", payload: { grounds: "defects are pre-existing city damage" }, as: PropertyOwner, as_user_id: "${owner_id}" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/appeal-decision", payload: { decision: "REVERSED" }, as: HearingOfficer, as_user_id: "hear-1", captures: { n_status: "$.data.status", n_appeal: "$.data.appeal_status" } }
            - { call: "GET /defects/${def1_id}", as: ProgramCoordinator, captures: { d1_status: "$.data.status" } }
            - { call: "GET /defects/${def2_id}", as: ProgramCoordinator, captures: { d2_status: "$.data.status" } }
            - { call: "GET /segments/${segment_id}", as: ProgramCoordinator, captures: { count_end: "$.data.open_defect_count", seg_end: "$.data.status" } }
          assert:
            - "count_mid == 2 and seg_mid == UNDER_NOTICE (forward action kept both defects in the non-verified pool)"
            - "n_status == VOID and n_appeal == REVERSED"
            - "d1_status == OPEN and d2_status == OPEN"
            - "count_end == 2 and seg_end == FLAGGED — the issue/reversal pair conserves the defect-pool cardinality and segment status"
