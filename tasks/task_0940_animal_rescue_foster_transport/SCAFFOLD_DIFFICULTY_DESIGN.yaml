              as_user_id: "counselor-1"
            - call: "GET /rescue/animals/${animal_id}"
              payload: {}
              as: PlatformAdmin
              captures: { animal_v: $.data.version }
          trigger:
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_id}", expected_animal_version: "${animal_v}", credit_application_order: "CREDIT_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { gate_error: $.data.error_id }
            - call: "POST /rescue/holds/${hold_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_id}", expected_animal_version: "${animal_v}", credit_application_order: "CREDIT_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { safety_error: $.data.error_id }
          assert:
            - "gate_error == ERR_MEDICAL_HOLD_ACTIVE"
            - "the first finalize returns HTTP 409"
            - "safety_error == ERR_ALTERATION_REQUIRED"
            - "the second finalize returns HTTP 422"
            - "AdoptionApplication.${app_id}.status == APPROVED"
            - "Animal.${animal_id}.lifecycle_status == IN_CUSTODY"

      - name: litter_split_referential_preempts_crate_capacity_constraint
        grounds:
          - validations[priority=31]
          - validations[priority=40]
          - calculations.litter_transport_units
          - errors[ERR_LITTER_SPLIT_NOT_APPROVED]
          - errors[ERR_LEG_CRATE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A different category pair from the gate case: `business_referential` (littermate
          grouping at priority 31) versus `business_constraint` (leg crate capacity at priority
          40). One manifest request violates both; it returns ERR_LITTER_SPLIT_NOT_APPROVED, and
          only after split approval does the identical request surface
          ERR_LEG_CRATE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z."
            - "A GROUPED Litter with two SMALL puppies, plus one unrelated LARGE dog."
            - "A PLANNED relay with leg A (crate_capacity_units 5) and leg B (crate_capacity_units 3)."
            - "Puppy 1 is the litter anchor on leg A consuming 2 crate units; the LARGE dog occupies all 3 crate units of leg B."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Milo Frey", email: "milo@example.test", driver_license_number: "CDL-8891" }
              as: PlatformAdmin
              captures: { driver_id: $.data.id }
            - call: "POST /rescue/litters"
              payload: { label: "Maple litter" }
              as: PlatformAdmin
              captures: { litter_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Pup1", species: "DOG", size_class: "SMALL", weight_lb: 8.0, date_of_birth: "2026-03-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: PlatformAdmin
              captures: { pup1: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Pup2", species: "DOG", size_class: "SMALL", weight_lb: 8.0, date_of_birth: "2026-03-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: PlatformAdmin
              captures: { pup2: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "BigDog", species: "DOG", size_class: "LARGE", weight_lb: 70.0, date_of_birth: "2021-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { bigdog: $.data.id }
            - call: "POST /rescue/animals/${pup1}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${pup2}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${bigdog}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/transport-runs"
              payload: { origin_organization_id: "${org_id}", run_type: "RELAY", origin_hub_code: "HUB-A", destination_hub_code: "HUB-C", purpose: "INTAKE_TRANSPORT" }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 1, origin_hub_code: "HUB-A", destination_hub_code: "HUB-B", scheduled_depart_at: "2026-05-05T08:00:00Z", scheduled_arrive_at: "2026-05-05T12:00:00Z", crate_capacity_units: 5, weight_capacity_lb: 500.0, crosses_state_line: false, species_policy: "DOGS_ONLY" }
              as: PlatformAdmin
              captures: { legA_id: $.data.id, legA_v1: $.data.version }
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 2, origin_hub_code: "HUB-B", destination_hub_code: "HUB-C", scheduled_depart_at: "2026-05-05T14:00:00Z", scheduled_arrive_at: "2026-05-05T18:00:00Z", crate_capacity_units: 3, weight_capacity_lb: 500.0, crosses_state_line: false, species_policy: "DOGS_ONLY" }
              as: PlatformAdmin
              captures: { legB_id: $.data.id, legB_v1: $.data.version }
            - call: "POST /rescue/transport-legs/${legA_id}/manifest-entries"
              payload: { animal_id: "${pup1}", expected_leg_version: "${legA_v1}" }
              as: PlatformAdmin
              captures: { anchor_entry: $.data.id, anchor_units: $.data.crate_units }
            - call: "POST /rescue/transport-legs/${legB_id}/manifest-entries"
              payload: { animal_id: "${bigdog}", expected_leg_version: "${legB_v1}" }
              as: PlatformAdmin
            - call: "GET /rescue/transport-legs/${legB_id}"
              payload: {}
              as: PlatformAdmin
              captures: { legB_v2: $.data.version, legB_used: $.data.used_crate_units }
          trigger:
            - call: "POST /rescue/transport-legs/${legB_id}/manifest-entries"
              payload: { animal_id: "${pup2}", expected_leg_version: "${legB_v2}" }
              as: PlatformAdmin
              captures: { referential_error: $.data.error_id }
            - call: "POST /rescue/litters/${litter_id}/split-approval"
              payload: { approved_reason: "medical separation of littermates" }
              as: TransportDispatcher
              captures: { basis_after: $.data.transport_basis }
            - call: "GET /rescue/transport-legs/${legB_id}"
              payload: {}
              as: PlatformAdmin
              captures: { legB_v3: $.data.version }
            - call: "POST /rescue/transport-legs/${legB_id}/manifest-entries"
              payload: { animal_id: "${pup2}", expected_leg_version: "${legB_v3}" }
              as: PlatformAdmin
              captures: { constraint_error: $.data.error_id }
          assert:
            - "anchor_units == 2"
            - "legB_used == 3"
            - "referential_error == ERR_LITTER_SPLIT_NOT_APPROVED"
            - "the first manifest attempt returns HTTP 409"
            - "basis_after == SPLIT_APPROVED"
            - "constraint_error == ERR_LEG_CRATE_CAPACITY_EXCEEDED"
            - "the second manifest attempt returns HTTP 409"
            - "TransportLeg.${legB_id}.used_crate_units == 3"

  - rule_id: boundary_precision_check
    instances:
      - name: household_child_age_inclusive_boundary_on_application
        grounds:
          - calculations.adoption_match_evaluation
          - validations[priority=24]
          - entities.Animal.fields.restriction_no_children_under_years
          - entities.Person.fields.youngest_child_age_years
        distinguishing_aspect: |
          Numeric threshold boundary on the child-age metric reached through
          POST /rescue/adoption-applications: youngest_child_age_years exactly equal to
          restriction_no_children_under_years (6 vs 6) is admitted, one year below (5 vs 6) is
          refused with ERR_HOUSEHOLD_MISMATCH.
        test_recipe:
          setup:
            - "Clock at 2026-05-05T00:00:00Z."
            - "One in-custody DOG whose restriction_no_children_under_years is 6 and whose other restrictions are all off."
            - "Applicant A has youngest_child_age_years 6; applicant B has youngest_child_age_years 5."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Ada Six", email: "ada@example.test", youngest_child_age_years: 6, resident_cat_count: 0, resident_dog_count: 0, housing_type: "HOUSE", has_fenced_yard: true }
              as: PlatformAdmin
              captures: { person_a: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Ben Five", email: "ben@example.test", youngest_child_age_years: 5, resident_cat_count: 0, resident_dog_count: 0, housing_type: "HOUSE", has_fenced_yard: true }
              as: PlatformAdmin
              captures: { person_b: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Rex", species: "DOG", size_class: "LARGE", weight_lb: 65.0, date_of_birth: "2020-01-01T00:00:00Z", current_organization_id: "${org_id}", restriction_no_children_under_years: 6, restriction_no_cats: false, restriction_no_dogs: false, restriction_requires_fenced_yard: false, restriction_housing_types_excluded: [] }
              as: PlatformAdmin
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_id}", applicant_person_id: "${person_a}" }
              as: PlatformAdmin
              captures: { app_a: $.data.id, app_a_status: $.data.status }
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_id}", applicant_person_id: "${person_b}" }
              as: PlatformAdmin
              captures: { mismatch_error: $.data.error_id }
          assert:
            - "app_a_status == SUBMITTED"
            - "the applicant-A submission returns HTTP 201"
            - "AdoptionApplication.${app_a}.attempt_count == 1"
            - "mismatch_error == ERR_HOUSEHOLD_MISMATCH"
            - "the applicant-B submission returns HTTP 422"

      - name: live_release_rate_empty_window_returns_null_rate
        grounds:
          - calculations.live_release_rate
          - endpoints["GET /rescue/reports/live-release-rate"]
        distinguishing_aspect: |
          A different metric and a different endpoint from the child-age boundary: this is the
          empty-collection edge on the outcome pool. A window containing zero OutcomeRecord rows
          yields denominator 0 and live_release_rate null rather than 0.0 or a division error.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z."
            - "Exactly one OutcomeRecord in the whole system, recorded on 2026-05-10."
            - "The queried window is 2026-06-01 to 2026-06-30, which contains no outcomes."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Solo", species: "CAT", size_class: "SMALL", weight_lb: 9.0, date_of_birth: "2023-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: PlatformAdmin
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals/${animal_id}/outcomes"
              payload: { outcome_type: "DIED_IN_CARE" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/reports/live-release-rate"
              payload: { from_date: "2026-06-01", to_date: "2026-06-30", methodology: "SAC" }
              as: PlatformAdmin
              captures: { empty_rate: $.data.live_release_rate, empty_den: $.data.denominator, empty_live: $.data.live_outcome_count }
            - call: "GET /rescue/reports/live-release-rate"
              payload: { from_date: "2026-05-01", to_date: "2026-05-31", methodology: "SAC" }
              as: PlatformAdmin
              captures: { may_rate: $.data.live_release_rate, may_den: $.data.denominator }
          assert:
            - "empty_den == 0"
            - "empty_rate is null"
            - "empty_live == 0"
            - "the empty-window request returns HTTP 200, not an error"
            - "may_den == 1"
            - "may_rate == 0.0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: leg_departure_depends_on_health_certificate_state
        grounds:
          - validations[priority=35]
          - calculations.cvi_validity_window
          - state_machines.HealthCertificate.VALID_to_EXPIRED
          - state_machines.TransportLeg.SCHEDULED_to_DEPARTED
        distinguishing_aspect: |
          Entity pair TransportLeg x HealthCertificate: an interstate leg whose own status is
          SCHEDULED and whose run is IN_PROGRESS still cannot depart because a different entity —
          the cat's certificate — has reached EXPIRED, while the dog's certificate on the same
          leg is still VALID.
        test_recipe:
          setup:
            - "Clock at 2026-05-20T08:00:00Z."
            - "One cat and one dog, both in custody and both rabies-vaccinated on 2026-05-01 at well over 12 weeks of age."
            - "Both hold a WA health certificate issued 2026-05-01: the cat's expires 2026-05-16T00:00:00Z (15-day window) and the dog's expires 2026-05-31T00:00:00Z (30-day window)."
            - "A RELAY run is IN_PROGRESS; leg 1 has ARRIVED at HUB-B; leg 2 crosses the state line into WA with scheduled_depart_at 2026-05-20T08:00:00Z."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
