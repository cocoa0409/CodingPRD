            - call: "POST /demurrage/regulatory-complaints"
              payload: { demurrage_dispute_id: "${dsp_id}", complaint_type: "BILLING_PRACTICE", docket_narrative: "Both rounds exhausted; the tariff was applied unreasonably." }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cmp_id: $.data.id }
          assert:
            - "attempt 1, dispute UNDER_REVIEW: 409 with error_id ERR_DISPUTE_INVALID_STATE"
            - "attempt 2, dispute DECIDED with round_number 1: 422 with error_id ERR_APPEAL_NOT_EXHAUSTED — a DIFFERENT code and a different status family from attempt 1"
            - "attempt 2 proves the two gates are independent: the status gate is satisfied and the round gate is not"
            - "neither failed attempt created a RegulatoryComplaint row, and DemurrageDispute.${dsp_id}.status was unchanged by both"
            - "after the round-2 DENIED decision: DemurrageDispute.${dsp_id}.status DECIDED with round_number 2 and allowed_credit_cents 0"
            - "attempt 3 returns 201: RegulatoryComplaint.${cmp_id}.status FILED, filed_at 2026-09-05T00:00:00.000Z, response_due_at 2026-09-25T23:59:59.999Z (the 15th Mon-Fri date strictly after 2026-09-05)"
            - "RegulatoryComplaint.${cmp_id}.docket_number matches ^D-[0-9]{5}$ and tariff_rule_set_id is null because complaint_type is BILLING_PRACTICE"
            - "the successful create cascades back into the other entity: DemurrageDispute.${dsp_id}.status DECIDED -> ESCALATED and Customer.${cust_id}.dispute_posture -> ESCALATED"
            - "TariffRuleSet.${tar_id}.status is still PUBLISHED with challenge_count 0, because only RULE_REASONABLENESS challenges the tariff"

      - name: placement_cycle_create_gated_by_tariff_rule_set_publication
        grounds:
          - validations.priority_54_tariff_not_published
          - state_machines.TariffRuleSet.status
          - entities.PlacementCycle.fields.tariff_rule_set_id
          - errors.ERR_TARIFF_NOT_PUBLISHED
        distinguishing_aspect: |
          The blocking state lives on the pinned rate table, two entities away
          from anything the request talks about: the RailCar is free, the
          Facility is OPEN and the Customer is CURRENT, but the TariffRuleSet is
          still DRAFT so the cycle cannot be created at all (422). The instance
          also shows the OCC token surviving the rejection — the refused create
          did NOT bump RailCar.version, so the retry after publication reuses the
          same expected_rail_car_version and succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE Customer with billing_posture CURRENT"
            - "one INDUSTRY_TRACK Facility with access_mode OPEN"
            - "one RAILROAD_OWNED RailCar with active_cycle_count 0 and version 1"
            - "one TariffRuleSet still in status DRAFT — deliberately NOT published"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R7I3-CUST", name: "Draft Tariff Traders", serving_station_code: "STN19", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R7I3-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R7I3-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R7I3-CITX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
          trigger:
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R7I3-001", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { err_tariff: $.data.error_id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R7I3-001", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
          assert:
            - "the first create returns 422 with error_id ERR_TARIFF_NOT_PUBLISHED"
            - "the first create does NOT return 404 and does NOT return ERR_TARIFF_WITHDRAWN: DRAFT is a distinct condition from WITHDRAWN"
            - "the refused create left RailCar.${car_id}.version at ${car_v} and active_cycle_count at 0"
            - "after publish, TariffRuleSet.${tar_id}.status == PUBLISHED with version incremented"
            - "the identical retry with the SAME expected_rail_car_version ${car_v} returns 201: the rejection consumed no OCC token"
            - "PlacementCycle.${cyc_id} is created with movement_status ORDERED, billing_status UNBILLED, clock_basis NONE and tariff_rule_set_id ${tar_id}"
            - "RailCar.${car_id}.version is ${car_v} + 1 and active_cycle_count is 1 only after the successful create"
            - "no DemurrageCharge exists yet, because the charge is born at constructive placement"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rail_car_occupation_interval_is_half_open_at_released_at
        grounds:
          - validations.priority_58_car_cycle_overlap
          - entities.RailCar.fields.active_cycle_count
          - entities.PlacementCycle.fields.released_at
          - errors.ERR_CAR_CYCLE_OVERLAP
        distinguishing_aspect: |
          The scarce resource is one physical car and the contended dimension is
          time, with the interval HALF-OPEN at the upper end:
          [created_at, released_at). A new cycle created at exactly the prior
          cycle's released_at of 2026-08-10T16:00:00.000Z is legal, and one
          millisecond earlier is ERR_CAR_CYCLE_OVERLAP. Unlike a facility spot
          this is a single-unit resource with no capacity column at all, so the
          check is an interval test rather than a count comparison, and a VOIDED
          cycle occupies no interval whatsoever.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z when cycle 1 is created, so cycle 1's occupation interval is [2026-08-01T00:00:00.000Z, 2026-08-10T16:00:00.000Z)"
