          - calculations.audit_recoupment_amount.constants.PENALTY_RATE_LOW
        distinguishing_aspect: |
          The extrapolated figure lands at 493 - seven cents BELOW PENALTY_TIER_1_CENTS - so
          only the strict `<` comparator of the lowest tier can produce the required answer:
          penalty round_half_up(24.65) = 25, recoupment 518, net_payable 468. A claim whose
          gross is 986 would sit in the MID tier if the tier were read off the claim total,
          so this instance also pins the marginal-rate reading in the low band.
