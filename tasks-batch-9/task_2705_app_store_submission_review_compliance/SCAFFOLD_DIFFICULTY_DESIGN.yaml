  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: submission_reject_redraft_requeue_reject_cycle
        grounds:
          - state_machines.Submission.IN_REVIEW_to_REJECTED
          - state_machines.Submission.REJECTED_to_DRAFT
          - state_machines.Submission.DRAFT_to_PRE_REVIEW_PASSED
          - state_machines.Submission.PRE_REVIEW_PASSED_to_WAITING_FOR_REVIEW
          - entities.Submission.fields.resubmission_count
          - calculations.review_capacity_allocation
          - calculations.standing_score
        distinguishing_aspect: |
          The same Submission row traverses REJECTED -> DRAFT -> PRE_REVIEW_PASSED ->
          WAITING_FOR_REVIEW -> IN_REVIEW -> REJECTED a second time, so state is revisited while
          resubmission_count (1), the RejectionReason row count (2) and the standing penalty (96.00)
          all keep moving — a linear "one pass per row" model cannot reach this end state.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE with an ACTIVE IOS DISTRIBUTION_CERT; AppRecord IOS with one PASSED PRIVACY mapping (index 100.00, posture OPEN)"
