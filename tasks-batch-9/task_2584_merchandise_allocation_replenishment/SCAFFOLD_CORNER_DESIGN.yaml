            - "No operator id can ever equal 'system', so a CONSOLIDATION transfer is structurally incapable of violating rung 12 - the exemption is a property of the proposer field, not a special case in approve"
            - "The final read of the run shows one commit, one committing user (u-mgr-1) and one proposing user (u-alloc-1) that never coincide"
  # cross-cutting complexity layers declared in the profile
  - section: complexity_layers
    instances:
      - name: both_occ_rules_reject_a_stale_parent_token_and_a_successful_write_invalidates_its_own_token
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.run-create-stale-receipt
          - concurrency_rules.transfer-create-stale-position
          - validations[priority:11]
          - errors.ERR_STALE_RECEIPT_VERSION
          - errors.ERR_STALE_POSITION_VERSION
        distinguishing_aspect: |
          Both §1.2.1 rules are driven through the same three states - stale, refreshed, and stale again -
          and they must answer with DIFFERENT error ids at the same rung and the same 412, because one guards
          a Receipt through expected_receipt_version and the other guards a StorePosition through
          expected_from_position_version. The sharpest corner is self-invalidation: creating a run is itself
          declared to increment Receipt.version, so the token that just succeeded is stale for the very next
          call, and a client that caches the version it read once will succeed exactly once. An
          implementation that only bumps the receipt on adjust or commit passes every other OCC test and
          fails this one. Rung 11's position in the ladder is pinned on both sides: a LOCKED program answers
          rung 9 for the identical stale call, while a from == to transfer that is ALSO stale answers 412
          rather than the rung 21 same-store code.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101 (capacity 48, presentation minimum 6) and 0102 (capacity 24, minimum 2)"
            - "SKU-1001 SEASONAL on TOP-4SZ; position 0101 holds 6 units (M 4 / L 2) -> BROKEN with S and XL out; position 0102 holds 30 units of every size -> COMPLETE"
            - "Receipt ASN-R401 was created with 30 units, so the client holds ${rcpt_v1} = version 1; the client also holds ${p2_v1} = position 0102's version 1"
            - "run-create-stale-receipt guards POST /allocation/receipts/{receiptId}/allocation-runs on expected_receipt_version; transfer-create-stale-position guards POST /allocation/transfer-recommendations on expected_from_position_version"
            - "The logical clock is 2026-08-01T00:00:00Z"
