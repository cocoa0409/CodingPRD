      - name: client_suspend_cascade_contract_to_allocation_to_counters
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.VesselAllocation.RESERVED_to_CANCELLED
          - entities.Contract.fields.gallons_allocated
          - entities.Contract.fields.barrel_slots_used
        distinguishing_aspect: |
          A depth-3 chain from a COMPLETELY DIFFERENT trigger and in the opposite
          direction to the blend cascade: suspending the Client pushes the Contract
          to SUSPENDED (HOP 1), the contract's move cancels its RESERVED allocation
          (HOP 2), and the cancellation recomputes gallons_allocated to 0.00 and
          barrel_slots_used to 0 (HOP 3) — while the vessel stays CLEAN, proving
          the cancel branch and not the release branch fired.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Client with one ACTIVE Contract (tank_gallons_entitled 20000, barrel_slots_entitled 40)."
            - "One CLEAN 4000-gallon TANK T-101 and one CLEAN 60-gallon BARREL BBL-0442."
            - "Two RESERVED allocations on that contract: 2500 gallons on T-101 and 60 gallons on BBL-0442, so gallons_allocated == 2500.00 and barrel_slots_used == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, v1_ver: $.data.version }
            - call: "POST /vessels"
              payload: { vessel_code: "BBL-0442", vessel_type: "BARREL", capacity_gallons: 60, facility_zone: "BARREL_HALL" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { vb: $.data.id, vb_ver: $.data.version }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 2500, expected_vessel_version: "${v1_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al1: $.data.id }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${vb}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 60, expected_vessel_version: "${vb_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { alb: $.data.id }
            - call: "GET /contracts/${ct1}"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { alloc_before: $.data.gallons_allocated, slots_before: $.data.barrel_slots_used }
          trigger:
            - call: "POST /clients/${cl1}/status"
              payload: { action: "SUSPEND" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl_status: $.data.status }
          assert:
            - "${alloc_before} == 2500.00 and ${slots_before} == 1 before the trigger"
            - "${cl_status} == SUSPENDED"
            - "HOP 1: Contract.${ct1}.status == SUSPENDED"
            - "HOP 2: VesselAllocation.${al1}.status == CANCELLED and VesselAllocation.${alb}.status == CANCELLED"
            - "HOP 2: VesselAllocation.${al1}.released_at == null (CANCEL never stamps a release instant)"
            - "HOP 3: Contract.${ct1}.gallons_allocated == 0.00 and barrel_slots_used == 0"
            - "Vessel.${v1}.condition == CLEAN and Vessel.${vb}.condition == CLEAN (the cancel branch never dirties cooperage)"
            - "Vessel.${v1}.last_released_at == null"

