      - name: occ_capital_contribution_replayed_against_a_stale_partner_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capital-contribution-stale-partner]
          - endpoints[POST /comp/partners/{id}/capital-contribution]
          - errors[ERR_STALE_VERSION]
          - entities.Partner.fields.capital_account_balance_cents
        distinguishing_aspect: |
          Contributions are additive, so only the version distinguishes an intended second
          contribution from a re-send: the replay with the pre-contribution version is
          refused with ERR_STALE_VERSION 412 and the balance stays at 5000000, while the
          same body with the fresh version legitimately takes it to 10000000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; partner P was admitted with opening_capital_cents 0 and target_capital_cents 20000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Cap Contributor", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014, opening_capital_cents: 0, target_capital_cents: 20000000 }
              as: CycleAdmin
              captures: { pp: "$.data.id", pv0: "$.data.version", bal0: "$.data.capital_account_balance_cents" }
          trigger:
            - call: "POST /comp/partners/${pp}/capital-contribution"
              payload: { amount_cents: 5000000, expected_partner_version: "${pv0}" }
              as: CycleAdmin
              captures: { bal1: "$.data.capital_account_balance_cents", pv1: "$.data.version" }
            - call: "POST /comp/partners/${pp}/capital-contribution"
              payload: { amount_cents: 5000000, expected_partner_version: "${pv0}" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { bal2: "$.data.capital_account_balance_cents", pv2: "$.data.version" }
            - call: "POST /comp/partners/${pp}/capital-contribution"
              payload: { amount_cents: 5000000, expected_partner_version: "${pv2}" }
              as: CycleAdmin
              captures: { bal3: "$.data.capital_account_balance_cents" }
          assert:
            - "${bal0} == 0 and ${bal1} == 5000000 with ${pv1} == ${pv0} + 1"
            - "${err} == ERR_STALE_VERSION with HTTP 412"
            - "${bal2} == 5000000 and ${pv2} == ${pv1} - the refused replay wrote nothing"
            - "${bal3} == 10000000 - the identical body succeeds once the version is refreshed"

      - name: occ_transition_effectuate_after_an_intervening_matter_write
