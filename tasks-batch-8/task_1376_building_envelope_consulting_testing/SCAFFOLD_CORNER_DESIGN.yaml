  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_USER_CONTEXT]"
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers is rejected with ERR_MISSING_USER_CONTEXT (400) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /engagements"
              payload: { name: "NA", client_name: "C", fee_cap_cents: 1000, labor_rate_cents_per_hour: 100 }
              as: Principal
              captures: { err: $.data.error_id }
          assert:
            - "request sent without X-User-ID header -> err == ERR_MISSING_USER_CONTEXT (400)"
      - name: forbidden_role_on_exclusive_endpoint
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "A Reviewer (valid role, wrong permission) calling POST /engagements is rejected with ERR_FORBIDDEN_ROLE (403) — authorization precedes existence and body checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /engagements"
              payload: { name: "FR", client_name: "C", fee_cap_cents: 1000, labor_rate_cents_per_hour: 100 }
              as: Reviewer
              as_user_id: "rev-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403)"
      - name: fee_cap_exceeded_on_plan_issue
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_FEE_CAP_EXCEEDED]"
        distinguishing_aspect: "Provisional fee event that would drive fee_headroom_cents negative is rejected with ERR_FEE_CAP_EXCEEDED (402): cap 1000000 with a MEDIUM-anomaly plan estimate 1800000 cannot be issued."
        test_recipe:
          setup: ["engagement IN_PROGRESS, fee_cap 1000000; MEDIUM anomaly VERIFIED; plan DRAFT created (create is not a fee event, so it succeeds)"]
          setup_api_calls:
            - call: "POST /engagements"
