            - call: "POST /allotments"
              payload: { name: "Posture Gate Allotment", admin_unit_code: "NV-054", acres: 36000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 2 }
