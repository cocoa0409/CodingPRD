# Task 2896 — Guest Ranch & All-Inclusive Resort Operations
# §1.9 Scaffold Corner Design (breadth probe).
# Walked row-by-row against references/claim-extraction-guide.md; section: and claim_type:
# values are taken from that guide only. Corners already asserted by §1.8 appear as
# excluded_because: stubs naming the covering difficulty instance.

scaffold_corner_design:
  - section: entities
    instances:
      - name: season_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Season
          - endpoints[POST /seasons]
          - response_envelope.success
        distinguishing_aspect: "A season created with all twelve required inputs returns 201, echoes every input, and initialises season_status PLANNING with all money counters at 0."
        test_recipe:
          setup:
            - "empty database; the logical clock is pinned to the server startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
          trigger:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Season.${season_id}.season_status == PLANNING"
            - "Season.${season_id}.arrival_weekday == SUNDAY"
            - "Season.${season_id}.dining_seat_capacity == 8"
            - "Season.${season_id}.gross_package_revenue_cents == 0"
            - "Season.${season_id}.retention_bonus_liability_cents == 0"
            - "Season.${season_id}.capital_committed_cents == 0"
            - "Season.${season_id}.bed_nights_sold == 0"
            - "Season.${season_id}.in_house_guest_count == 0"

      - name: cabin_detail_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Cabin
          - endpoints[GET /cabins/{cabinId}]
        distinguishing_aspect: "GET /cabins/{cabinId} returns the same name and bed_capacity that were posted, with cabin_status READY and last_turnover_completed_at null."
        test_recipe:
          setup:
            - "one cabin Aspen with bed_capacity 4"
          setup_api_calls:
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
          trigger:
            - call: "GET /cabins/${cabin_id}"
              payload: {}
              as: ReservationsAgent
              captures: { got_name: $.data.name, got_capacity: $.data.bed_capacity, got_status: $.data.cabin_status, got_turnover: $.data.last_turnover_completed_at }
          assert:
            - "${got_name} == Aspen"
            - "${got_capacity} == 4"
            - "${got_status} == READY"
            - "${got_turnover} == null"

      - name: guest_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Guest
          - endpoints[GET /guests]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three guests stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "exactly three guests registered and nothing else"
          setup_api_calls:
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
          trigger:
            - call: "GET /guests"
              payload: { limit: 2, offset: 0 }
              as: ReservationsAgent
              captures: { page1_first_name: "$.data[0].full_name" }
            - call: "GET /guests"
              payload: { limit: 2, offset: 2 }
              as: ReservationsAgent
              captures: { page2_first_name: "$.data[0].full_name" }
          assert:
            - "the first response carries exactly 2 rows and response_type == array"
            - "the first response reports meta.total_count 3 and meta.has_more true"
            - "${page1_first_name} == Ann Adult"
            - "the second response carries exactly 1 row"
            - "the second response reports meta.total_count 3 and meta.has_more false"
            - "${page2_first_name} == Cal Child"
            - "the union of the two pages contains all three stored guest ids exactly once"

      - name: booking_detail_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - validations[priority=7]
          - endpoints[GET /bookings/{bookingId}]
        distinguishing_aspect: "A well-formed but unstored booking id returns ERR_BOOKING_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "empty database except a single season, so no booking with the probed id can exist"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ReservationsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_BOOKING_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: cabin_create_missing_required_bed_capacity_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=9]
          - errors[ERR_MISSING_REQUIRED_FIELD]
          - endpoints[POST /cabins]
        distinguishing_aspect: "Omitting bed_capacity, which POST /cabins declares required with no default, returns ERR_MISSING_REQUIRED_FIELD 400 and stores nothing."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
          trigger:
            - call: "POST /cabins"
              payload: { name: "Aspen" }
              as: RanchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_MISSING_REQUIRED_FIELD"
            - "GET /cabins returns total_count 0"

      - name: horse_creation_applies_declared_field_defaults
        claim_type: defaults
        grounds:
          - entities.Horse
          - state_machines.Horse.horse_status
          - endpoints[POST /horses]
        distinguishing_aspect: "A freshly created horse defaults to horse_status IN_SERVICE with scheduled_load_hours 0.0, realized_load_hours 0.0, consecutive_duty_days 0 and last_duty_date null, none of which are inputs."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HorseProgramDirector
          trigger:
            - call: "POST /horses"
              payload: { name: "Comet", min_rider_ability: "BEGINNER", max_rider_ability: "ADVANCED", weight_limit_lb: 240 }
              as: HorseProgramDirector
              captures: { horse_id: $.data.id, status: $.data.horse_status, sched: $.data.scheduled_load_hours, real: $.data.realized_load_hours, duty: $.data.consecutive_duty_days, last_duty: $.data.last_duty_date }
          assert:
            - "${status} == IN_SERVICE"
            - "${sched} == 0.0"
            - "${real} == 0.0"
            - "${duty} == 0"
            - "${last_duty} == null"
            - "Horse.${horse_id}.last_rest_started_on == null"

      - name: guest_age_and_booking_party_counts_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Guest.fields.age_years
          - entities.Booking.fields.party_size
          - entities.Booking.fields.adult_count
          - entities.Booking.fields.child_count
          - calculations.package_charge_total
        distinguishing_aspect: "age_years is derived from birth_date against the clock (41 for 1985-04-02, 43 for 1983-07-11, 10 for 2016-05-20 at 2026-08-01) and party_size / adult_count / child_count are derived from party_members, never accepted as input."
        test_recipe:
          setup:
            - "OPEN season, cabin Aspen with bed_capacity 4, three guests, one 7-night CLASSIC hold for two adults and one child"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id, ann_age: $.data.age_years }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id, ben_age: $.data.age_years }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id, cal_age: $.data.age_years }
          trigger:
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id }
          assert:
            - "${ann_age} == 41"
            - "${ben_age} == 43"
            - "${cal_age} == 10"
            - "Guest.${g_a1}.waiver_status == NONE"
            - "Guest.${g_a1}.effective_ability_rank == UNASSESSED"
            - "Booking.${booking_id}.party_size == 3"
            - "Booking.${booking_id}.adult_count == 2"
            - "Booking.${booking_id}.child_count == 1"
            - "Booking.${booking_id}.nights == 7"
            - "Booking.${booking_id}.provisional_package_total_cents == 1258691"

      - name: guest_version_advances_by_one_on_every_write
        claim_type: system_fields
        grounds:
          - entities.Guest
          - endpoints[POST /guests]
          - endpoints[POST /guests/{guestId}/waiver-signature]
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated: the waiver write leaves id and created_at untouched, moves updated_at forward and raises version by exactly 1."
        test_recipe:
          setup:
            - "one guest registered at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReservationsAgent
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id, created_v: $.data.version, created_at_1: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: ReservationsAgent
          trigger:
            - call: "POST /guests/${g_a1}/waiver-signature"
              payload: { signed_on: "2026-08-02", equine_statute_ack: true }
              as: ReservationsAgent
              captures: { after_v: $.data.version, after_created_at: $.data.created_at, after_updated_at: $.data.updated_at }
          assert:
            - "${after_v} == ${created_v} + 1"
            - "${after_created_at} == ${created_at_1}"
            - "${after_updated_at} == 2026-08-02T09:00:00Z"
            - "Guest.${g_a1}.waiver_status == SIGNED"
            - "Guest.${g_a1}.waiver_expires_on == 2027-08-02"

      - name: activity_slot_create_with_unknown_terrain_grade_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_FIELD_VALUE]
          - entities.ActivitySlot.fields.terrain_grade
        distinguishing_aspect: "terrain_grade accepts only MEADOW, ROLLING, STEEP or RIVER_CROSSING; the value CANYON returns ERR_INVALID_FIELD_VALUE 422 and no slot is stored."
        test_recipe:
          setup:
            - "one OPEN season and nothing else"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
          trigger:
            - call: "POST /seasons/${season_id}/activity-slots"
              payload: { activity_type: "TRAIL_RIDE", starts_at: "2026-10-12T15:00:00Z", ends_at: "2026-10-12T17:00:00Z", terrain_grade: "CANYON", min_ability_rank: "BEGINNER", capacity: 4, rider_surcharge_cents: 20000, mount_required: true }
              as: RanchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err} == ERR_INVALID_FIELD_VALUE"
            - "GET /activity-slots?season_id=${season_id} returns total_count 0"

      - name: horse_health_event_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.HorseHealthEvent
          - endpoints[POST /horses/{horseId}/health-events]
          - endpoints[GET /horse-health-events/{healthEventId}]
        distinguishing_aspect: "HorseHealthEvent is declared common_fields false: §1.5 exposes only create and read endpoints for it, and the read body carries id and created_at but no version and no updated_at."
        test_recipe:
          setup:
            - "one horse with a single REST_START health event logged at clock 2026-08-01"
          setup_api_calls:
            - call: "POST /horses"
              payload: { name: "Comet", min_rider_ability: "BEGINNER", max_rider_ability: "ADVANCED", weight_limit_lb: 240 }
              as: HorseProgramDirector
              captures: { horse_id: $.data.id }
            - call: "POST /horses/${horse_id}/health-events"
              payload: { event_type: "REST_START", observed_on: "2026-08-01", note: "scheduled rest day" }
              as: HorseProgramDirector
              captures: { he_id: $.data.id }
          trigger:
            - call: "GET /horse-health-events/${he_id}"
              payload: {}
              as: HorseProgramDirector
              captures: { got_type: $.data.event_type, got_status: $.data.resulting_horse_status }
          assert:
            - "${got_type} == REST_START"
            - "${got_status} == REST"
            - "the response body exposes no version field and no updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path contains horse-health-events"
            - "Horse.${horse_id}.horse_status == REST"
            - "Horse.${horse_id}.consecutive_duty_days == 0"

      - name: activity_slot_create_under_unknown_season_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_SEASON_NOT_FOUND]
          - entities.ActivitySlot.fields.season_id
        distinguishing_aspect: "ActivitySlot is created under a season parent path; an unstored seasonId returns ERR_SEASON_NOT_FOUND 404 before any field validation runs, and the graph topology's junction rows (ActivityReservation, GuideAssignment) are equally unreachable without their parents."
        test_recipe:
          setup:
            - "one OPEN season exists, but the probed season id is not stored"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
          trigger:
            - call: "POST /seasons/00000000-0000-4000-8000-000000000000/activity-slots"
              payload: { activity_type: "TRAIL_RIDE", starts_at: "2026-10-12T15:00:00Z", ends_at: "2026-10-12T17:00:00Z", terrain_grade: "MEADOW", min_ability_rank: "BEGINNER", capacity: 4, rider_surcharge_cents: 20000, mount_required: true }
              as: RanchManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_SEASON_NOT_FOUND"
            - "GET /activity-slots?season_id=${season_id} returns total_count 0"

  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Booking.booking_status.initial_state
          - state_machines.Booking.payment_status.initial_state
          - state_machines.ActivitySlot.slot_status.initial_state
          - state_machines.StaffMember.employment_status.initial_state
        distinguishing_aspect: "A brand-new booking is HELD on booking_status and AWAITING_DEPOSIT on payment_status simultaneously, while the slot created alongside it is DRAFT, the staff member HIRED, the cabin READY and the guest GOOD / NONE."
        test_recipe:
          setup:
            - "OPEN season with a cabin, one adult guest, one horse, one staff member and one draft slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /horses"
              payload: { name: "Comet", min_rider_ability: "BEGINNER", max_rider_ability: "ADVANCED", weight_limit_lb: 240 }
              as: HorseProgramDirector
              captures: { horse_id: $.data.id }
            - call: "POST /seasons/${season_id}/staff-members"
              payload: { full_name: "Gus Guide", role_type: "GUIDE", certifications: ["EQUINE_HANDLER", "WILDERNESS_FIRST_AID"], hired_on: "2026-08-01", contract_end_date: "2026-11-15" }
              as: RanchManager
              captures: { staff_id: $.data.id }
            - call: "POST /seasons/${season_id}/activity-slots"
              payload: { activity_type: "TRAIL_RIDE", starts_at: "2026-10-12T15:00:00Z", ends_at: "2026-10-12T17:00:00Z", terrain_grade: "MEADOW", min_ability_rank: "BEGINNER", capacity: 4, rider_surcharge_cents: 20000, mount_required: true }
              as: RanchManager
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id, bs: $.data.booking_status, ps: $.data.payment_status }
          assert:
            - "${bs} == HELD"
            - "${ps} == AWAITING_DEPOSIT"
            - "ActivitySlot.${slot_id}.slot_status == DRAFT"
            - "ActivitySlot.${slot_id}.readiness_posture == STAFFED_READY"
            - "StaffMember.${staff_id}.employment_status == HIRED"
            - "Horse.${horse_id}.horse_status == IN_SERVICE"
            - "Cabin.${cabin_id}.cabin_status == READY"
            - "Guest.${g_a1}.guest_standing == GOOD"
            - "Guest.${g_a1}.waiver_status == NONE"

      - name: season_advances_planning_to_open_to_in_season
        claim_type: valid_transition
        grounds:
          - state_machines.Season.season_status.transitions[PLANNING->OPEN]
          - state_machines.Season.season_status.transitions[OPEN->IN_SEASON]
          - endpoints[POST /seasons/{seasonId}/advance]
        distinguishing_aspect: "The two forward steps of the season lifecycle each succeed on their own request and are visible in the same response body."
        test_recipe:
          setup:
            - "one PLANNING season with a single package tier"
          setup_api_calls:
            - call: "POST /seasons"
