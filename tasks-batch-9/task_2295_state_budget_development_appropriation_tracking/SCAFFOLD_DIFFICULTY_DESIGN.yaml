scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: available_balance_cash_basis_vs_authority_basis_diverge
        grounds:
          - calculations.appropriation_available_balance
          - entities.Appropriation.fields.available_cash_cents
          - entities.Appropriation.fields.available_authority_cents
          - validations[priority=36]
          - validations[priority=37]
        distinguishing_aspect: |
          The two variants of appropriation_available_balance are computed over the SAME
          Appropriation row and disagree by exactly 1600000000 cents, and a single
          expenditure of 500000000 passes the authority-basis guard (priority 36) while
          failing the cash-basis guard (priority 37).
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 starting 2026-07-01 with constitutional_reserve_pct 0.05 and reserve_balance_cents 500000000, driven to phase EXECUTION"
            - "One ADOPTED GENERAL RevenueForecast of 10000000000 cents"
            - "One GENERAL Appropriation P100 enacted at 2000000000 cents"
            - "One RELEASED Allotment for quarter 1 of 400000000 cents, so released_cents == 400000000 and expended_cents == 0"
            - "Logical clock at the default 2026-08-01T00:00:00Z, which is inside quarter 1"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 400000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { allot_id: $.data.id }
            - call: "POST /fiscal/allotments/${allot_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${allot_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "director-1"
            - call: "POST /fiscal/allotments/${allot_id}/release"
              payload: {}
              as: StateController
          trigger:
            - call: "GET /fiscal/appropriations/${appr_id}/balance-summary"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_id}", quarter: 1, amount_cents: 500000000, object_code: "6100", vendor_reference: "INV-9001" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { exp_err: $.data.error_id }
          assert:
            - "GET /fiscal/appropriations/${appr_id}/balance-summary returns 200 with released_cents == 400000000 and expended_cents == 0"
            - "balance-summary.available_cash_cents == 400000000"
            - "balance-summary.available_authority_cents == 2000000000"
            - "balance-summary.basis_delta_cents == 1600000000"
            - "POST /fiscal/expenditures returns HTTP 422 with error_id == ERR_INSUFFICIENT_CASH_RELEASED, not ERR_APPROPRIATION_OVERSPEND, because 500000000 <= 2000000000 on the authority basis but > 400000000 on the cash basis"
            - "Appropriation.${appr_id}.expended_cents == 0 after the rejected charge"

      - name: moe_single_year_vs_three_year_average_flips_verdict
        grounds:
          - calculations.federal_moe_compliance
          - entities.FederalGrant.fields.moe_compliance_status
          - entities.FederalGrant.fields.moe_compliance_ratio
          - entities.FederalGrant.fields.moe_assessed_basis
        distinguishing_aspect: |
          On a different entity domain than the appropriation instance, the identical
          FederalGrant row assessed twice returns moe_compliance_status COMPLIANT under
          SINGLE_YEAR (assessed 300000000, ratio 1.000000) and DEFICIENT under
          THREE_YEAR_AVERAGE (assessed 250000000, ratio 0.833333).
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000 with a RELEASED quarter-1 allotment of 400000000"
            - "One POSTED Expenditure of 300000000 cents against that GENERAL appropriation, so moe_current_spend_cents == 300000000"
            - "FederalGrant with award_cents 400000000, required_match_ratio 0.25, moe_baseline_cents 300000000, moe_prior_year1_spend_cents 250000000, moe_prior_year2_spend_cents 200000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 400000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { allot_id: $.data.id }
            - call: "POST /fiscal/allotments/${allot_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${allot_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "director-1"
            - call: "POST /fiscal/allotments/${allot_id}/release"
              payload: {}
              as: StateController
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_id}", quarter: 1, amount_cents: 300000000, object_code: "6100", vendor_reference: "INV-7001" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/federal-grants"
              payload: { agency_id: "${ag_id}", budget_cycle_id: "${cyc_id}", cfda_number: "93.778", award_cents: 400000000, period_start: "2026-07-01T00:00:00Z", period_end: "2027-07-01T00:00:00Z", moe_baseline_cents: 300000000, required_match_ratio: 0.25, moe_prior_year1_spend_cents: 250000000, moe_prior_year2_spend_cents: 200000000 }
              as: BudgetAnalyst
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /fiscal/federal-grants/${grant_id}/moe-assessment"
              payload: { basis: "SINGLE_YEAR" }
              as: BudgetAnalyst
            - call: "POST /fiscal/federal-grants/${grant_id}/moe-assessment"
              payload: { basis: "THREE_YEAR_AVERAGE" }
              as: BudgetAnalyst
          assert:
            - "after the SINGLE_YEAR assessment FederalGrant.${grant_id}.moe_current_spend_cents == 300000000"
            - "after the SINGLE_YEAR assessment FederalGrant.${grant_id}.moe_compliance_status == COMPLIANT"
            - "after the SINGLE_YEAR assessment FederalGrant.${grant_id}.moe_compliance_ratio == 1.000000"
            - "after the SINGLE_YEAR assessment FederalGrant.${grant_id}.moe_assessed_basis == SINGLE_YEAR"
            - "after the THREE_YEAR_AVERAGE assessment FederalGrant.${grant_id}.moe_compliance_status == DEFICIENT"
            - "after the THREE_YEAR_AVERAGE assessment FederalGrant.${grant_id}.moe_compliance_ratio == 0.833333"
            - "after the THREE_YEAR_AVERAGE assessment FederalGrant.${grant_id}.moe_assessed_basis == THREE_YEAR_AVERAGE"
            - "FederalGrant.${grant_id}.required_state_match_cents == 100000000 under both assessments"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allotment_ceiling_nested_min_with_fund_tiered_quarter_cap
        grounds:
          - calculations.allotment_release_ceiling
          - entities.Allotment.fields.computed_release_cents
          - entities.Allotment.fields.binding_constraint
          - state_machines.Allotment.DRAFT_to_PREPARED
        distinguishing_aspect: |
          Mode (a) nested-minimum: the ceiling is min(requested, quarter_cap, unreleased,
          cash_available) and the SAME requested_cents of 500000000 against the SAME
          authority of 2000000000 yields 440000000 with binding_constraint QUARTER_CAP on a
          GENERAL line (QUARTER_CAP_PCT 0.22) and 500000000 with binding_constraint REQUEST
          on a DEDICATED line (QUARTER_CAP_PCT 0.30).
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 starting 2026-07-01, reserve_balance_cents 500000000, constitutional_reserve_pct 0.05, driven to phase EXECUTION"
            - "One ADOPTED GENERAL RevenueForecast of 10000000000 cents, so projected quarter-1 cash is 2000000000"
            - "GENERAL Appropriation P100 enacted 2000000000 and DEDICATED Appropriation P200 enacted 2000000000"
            - "Nothing released anywhere yet, so cycle total_released_cents == 0"
            - "Two DRAFT allotments, one per appropriation, both quarter 1, both requested_cents 500000000 with allow_partial true"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_g_id: $.data.id }
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "DEDICATED", program_code: "P200", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_d_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_g_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations/${appr_d_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_g_id}", quarter: 1, requested_cents: 500000000, allow_partial: true }
              as: BudgetAnalyst
              captures: { allot_g_id: $.data.id }
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_d_id}", quarter: 1, requested_cents: 500000000, allow_partial: true }
              as: BudgetAnalyst
              captures: { allot_d_id: $.data.id }
          trigger:
            - call: "POST /fiscal/allotments/${allot_g_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${allot_d_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Allotment.${allot_g_id}.computed_release_cents == 440000000"
            - "Allotment.${allot_g_id}.binding_constraint == QUARTER_CAP"
            - "Allotment.${allot_g_id}.status == PREPARED"
            - "Allotment.${allot_d_id}.computed_release_cents == 500000000"
            - "Allotment.${allot_d_id}.binding_constraint == REQUEST"
            - "Allotment.${allot_d_id}.status == PREPARED"

      - name: carryforward_cap_rounded_per_row_before_cycle_rollup
        grounds:
          - calculations.reversion_carryforward_split
          - entities.Appropriation.fields.carryforward_cents
          - entities.Appropriation.fields.reverted_cents
          - entities.BudgetCycle.fields.total_carryforward_cents
          - state_machines.Appropriation.AUTHORITY_ENACTED_to_AUTHORITY_CLOSED
        distinguishing_aspect: |
          Mode (b) pinned rounding order: two DEDICATED appropriations of 1000000010 and
          1000000030 cents produce total_carryforward_cents == 300000007 because each
          15-percent cap is rounded round_half_up per row BEFORE the rollup; rounding the
          summed authority once at the end would yield 300000006, one cent less.
        test_recipe:
          setup:
            - "Agency DOT; BudgetCycle 2027 starting 2026-07-01, constitutional_reserve_pct 0.05, reserve_balance_cents 500000000, driven to phase EXECUTION"
            - "One ADOPTED GENERAL RevenueForecast of 10000000000 cents"
            - "Two DEDICATED Appropriations, P301 enacted 1000000010 and P302 enacted 1000000030, with zero expenditures and zero transfers"
            - "Logical clock advanced to exactly 2027-07-01T00:00:00Z, the fiscal_year_start_date plus 12 months boundary"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "DEDICATED", program_code: "P301", introduced_amount_cents: 1000000010 }
              as: LegislativeFiscalOfficer
              captures: { appr_1_id: $.data.id }
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "DEDICATED", program_code: "P302", introduced_amount_cents: 1000000030 }
              as: LegislativeFiscalOfficer
              captures: { appr_2_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_1_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations/${appr_2_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/budget-cycles/${cyc_id}/close"
              payload: {}
              as: StateController
          assert:
            - "Appropriation.${appr_1_id}.carryforward_cents == 150000002"
            - "Appropriation.${appr_1_id}.reverted_cents == 850000008"
            - "Appropriation.${appr_2_id}.carryforward_cents == 150000005"
            - "Appropriation.${appr_2_id}.reverted_cents == 850000025"
            - "BudgetCycle.${cyc_id}.total_carryforward_cents == 300000007"
            - "BudgetCycle.${cyc_id}.total_reverted_cents == 1700000033"
            - "BudgetCycle.${cyc_id}.phase == CLOSED"
            - "Appropriation.${appr_1_id}.authority_status == CLOSED and Appropriation.${appr_2_id}.authority_status == CLOSED"

      - name: emergency_capacity_pinned_four_step_order_excludes_pending_request
        grounds:
          - calculations.emergency_appropriation_capacity
          - state_machines.Appropriation.AUTHORITY_PENDING_to_AUTHORITY_ENACTED
          - validations[priority=42]
          - entities.BudgetCycle.fields.emergency_granted_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: an emergency request of exactly 400000000 cents
          SUCCEEDS because step 1 sums only the already-ENACTED GENERAL authority of
          2000000000 and excludes the row being requested (capacity 400000000), whereas an
          order that folded the pending request into step 1 would compute capacity 380000000
          and reject it; the immediately following request of 1 cent then fails with
          ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY because capacity has collapsed to 0.
        test_recipe:
          setup:
            - "Agency DPS; BudgetCycle 2027 with constitutional_reserve_pct 0.05 and reserve_balance_cents 500000000, driven to phase EXECUTION"
            - "One ADOPTED GENERAL RevenueForecast of 10000000000 cents"
            - "One GENERAL Appropriation P100 enacted 2000000000, so general_fund_authority_total == 2000000000"
            - "emergency_granted_cents == 0 before the first request"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DPS", name: "Department of Public Safety", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
