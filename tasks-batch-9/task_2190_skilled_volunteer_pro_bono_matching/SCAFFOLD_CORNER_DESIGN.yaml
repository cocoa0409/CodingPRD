      - name: error_clock_regression_on_setting_the_current_instant
        claim_type: error_triggerable
        grounds: ["errors[ERR_CLOCK_REGRESSION]", "validations[priority=42]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The rule is at-or-before, not strictly-before: re-setting the clock to exactly its current value 2026-08-01T12:00:00Z is refused with 422 ERR_CLOCK_REGRESSION, so the endpoint is not idempotent, and one microsecond forward is accepted."
        test_recipe:
          setup: ["One partner; the clock is advanced once to 2026-08-01T12:00:00Z."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T12:00:00Z"}}
          trigger:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T12:00:00Z"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_CLOCK_REGRESSION\""
            - "a following POST /_clock/set_current_utc with to_iso8601 \"2026-08-01T12:00:01Z\" returns HTTP 200"
