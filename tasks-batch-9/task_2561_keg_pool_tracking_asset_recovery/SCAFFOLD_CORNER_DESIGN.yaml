          rationale: "That §1.8 instance already walks the full four-link uphold cascade (keg custody write-off -> pool census/posture -> chargeback_balance_cents -> brewer PROBATION -> float_posture SUSPENDED on every ACTIVE agreement of that brewer) and asserts each link's literal outcome, including the version of every row the request touched. A second cascading_side_effects instance on the same chain would duplicate its calls and asserts."

      - name: an_unusable_depreciated_book_basis_is_silently_coerced_to_replacement_cost
        claim_type: dual_variant_calculation
        grounds:
          - calculations.keg_loss_value.variants
          - calculations.keg_loss_value.note
          - entities.LossAssessment.fields.assessment_basis
        distinguishing_aspect: "Variant selection here is an INPUT that the server may silently overrule: DEPRECIATED_BOOK is coerced to REPLACEMENT_COST when fill_count is 0 and when the cause is STOLEN_SUSPECTED, with no ERR_INVALID_REQUEST, and the coercion is observable on the stored row and in the money. The same request shape therefore produces three different values in one instance — 14100 coerced, 0 coerced-and-zero-liability, and 13592 when the basis is actually honoured."
