scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_borrower_minimum_required_fields_returns_201
        claim_type: Creation
        grounds:
          - entities.Borrower
          - endpoints["POST /v1/borrowers"]
        distinguishing_aspect: "POST /v1/borrowers with ssn_last4, full_name, date_of_birth, email returns 201 with all stored fields; military_status defaults to NONE."
        test_recipe:
          setup:
            - "Empty DB; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "9999", full_name: "Mini Test", date_of_birth: "1992-05-05", email: "mini@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "Borrower.${brw_id}.full_name == 'Mini Test'"
            - "Borrower.${brw_id}.ssn_last4 == '9999'"
            - "Borrower.${brw_id}.military_status == 'NONE'"
            - "Borrower.${brw_id}.borrower_status == 'CURRENT'"
            - "Borrower.${brw_id}.aggregate_outstanding_principal_cents == 0"

      - name: get_borrower_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints["GET /v1/borrowers/{borrower_id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /v1/borrowers/<non-existent-uuid> returns 404 with error_id=ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "GET /v1/borrowers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.error_id == ERR_NOT_FOUND"

      - name: list_borrowers_paginated_returns_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /v1/borrowers"]
        distinguishing_aspect: "GET /v1/borrowers with limit=2 against 3 borrowers returns 2 items, total_count=3, has_more=true."
        test_recipe:
          setup:
            - "Three Borrowers created."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "0001", full_name: "B1", date_of_birth: "1990-01-01", email: "b1@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "0002", full_name: "B2", date_of_birth: "1990-01-01", email: "b2@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "0003", full_name: "B3", date_of_birth: "1990-01-01", email: "b3@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "GET /v1/borrowers?limit=2&offset=0"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "response.data.length == 2"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == true"

      - name: missing_required_field_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Borrower.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /v1/borrowers without email returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1234", full_name: "NoEmail", date_of_birth: "1990-01-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: borrower_email_uniqueness_collision_returns_409
        claim_type: Type Constraints
        grounds:
          - validations[priority=31]
          - errors[ERR_EMAIL_DUPLICATE]
        distinguishing_aspect: "POST /v1/borrowers with email 'dup@example.com' (case differs) when another Borrower already uses 'DUP@example.com' returns 409 ERR_EMAIL_DUPLICATE."
        test_recipe:
          setup: ["One Borrower with email='Dup@example.com' exists."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1234", full_name: "First", date_of_birth: "1990-01-01", email: "Dup@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "5678", full_name: "Second", date_of_birth: "1990-01-01", email: "dup@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_EMAIL_DUPLICATE"

      - name: loan_computed_aggregate_outstanding_principal_correct
        claim_type: Computed Fields
        grounds:
          - entities.Borrower.fields.aggregate_outstanding_principal_cents
        distinguishing_aspect: "Borrower with two Loans of original_principal_cents 100000 and 250000 (both non-terminal) yields aggregate_outstanding_principal_cents = 350000."
        test_recipe:
          setup: ["Borrower with two IN_SCHOOL DIRECT_UNSUBSIDIZED 0%-rate loans of $1000 and $2500 respectively (interest_rate_bps=0 to avoid accrual)."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1111", full_name: "Agg Br", date_of_birth: "1990-01-01", email: "agg@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 250000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "GET /v1/borrowers/${brw_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "Borrower.${brw_id}.aggregate_outstanding_principal_cents == 350000"

      - name: loan_invalid_loan_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Loan.fields.loan_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /v1/loans with loan_type='DIRECT_OTHER' (not in enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One Borrower exists."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "2121", full_name: "Enum Br", date_of_birth: "1990-01-01", email: "enum@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
          trigger:
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_OTHER", original_principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: servicing_event_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ServicingEvent
        distinguishing_aspect: "ServicingEvent has common_fields=false (no version field). No PATCH/PUT endpoint exists in §1.5 — verified by attempting PATCH and receiving 404 from the routing layer."
        test_recipe:
          setup: ["A loan with one ServicingEvent (GRACE_BEGIN) recorded."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "3131", full_name: "Imm Br", date_of_birth: "1990-01-01", email: "imm@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { event_id: $.data.id }
          trigger:
            - call: "GET /v1/loans/${loan_id}/servicing-events"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "response.data.length == 1"
            - "response.data[0].event_type == 'GRACE_BEGIN'"
            - "response.data[0].created_by_user_id == 'svc-1'"

      - name: foreign_key_borrower_nonexistent_on_loan_create_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Loan.fields.borrower_id
          - validations[priority=20]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /v1/loans with borrower_id pointing to non-existent borrower returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans"
              payload: { borrower_id: "00000000-0000-0000-0000-000000000000", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: loan_initial_state_is_in_school
        claim_type: Initial State
        grounds:
          - state_machines.Loan.initial_state
          - entities.Loan.fields.status
        distinguishing_aspect: "Newly created Loan has status=IN_SCHOOL."
        test_recipe:
          setup: ["Empty DB; one Borrower exists."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "4141", full_name: "Init Br", date_of_birth: "1990-01-01", email: "init@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
          trigger:
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_SUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 533, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
          assert:
            - "Loan.${loan_id}.status == IN_SCHOOL"
            - "Loan.${loan_id}.version == 1"

      - name: loan_terminal_state_paid_off_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Loan.terminal_states
          - state_machines.Loan.transitions.REPAYMENT_to_PAID_OFF
        distinguishing_aspect: "Loan in PAID_OFF cannot transition (any servicing-event trigger returns ERR_INVALID_STATE)."
        test_recipe:
          setup:
            - "Loan in PAID_OFF (achieved via small loan paid off via POST /payments)."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "5151", full_name: "Po Lock", date_of_birth: "1990-01-01", email: "polock@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 100000, posted_on: "2026-06-01", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-01", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "Loan.${loan_id}.status == PAID_OFF"
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: forbearance_end_from_repayment_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Loan.transitions.FORBEARANCE_to_REPAYMENT
          - validations[priority=21]
        distinguishing_aspect: "POST /loans/{id}/servicing-events event_type=FORBEARANCE_END on a Loan in REPAYMENT (not FORBEARANCE) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Loan in REPAYMENT."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "6161", full_name: "Inv Tr", date_of_birth: "1990-01-01", email: "invtr@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_END", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: deferment_end_from_repayment_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Loan.transitions.DEFERMENT_to_REPAYMENT
          - validations[priority=21]
        distinguishing_aspect: "DEFERMENT_END on a Loan not in DEFERMENT returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Loan in REPAYMENT."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "7171", full_name: "Inv Dt", date_of_birth: "1990-01-01", email: "invdt@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "DEFERMENT_END", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: grace_begin_from_repayment_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Loan.transitions.IN_SCHOOL_to_GRACE
          - validations[priority=21]
        distinguishing_aspect: "GRACE_BEGIN on a Loan in REPAYMENT (not IN_SCHOOL) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Loan in REPAYMENT."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "8181", full_name: "Gr Inv", date_of_birth: "1990-01-01", email: "grinv@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: borrower_status_bubble_up_to_at_risk_on_delinquent
        claim_type: Side Effect Execution
        grounds:
          - entities.Borrower.fields.borrower_status
          - state_machines.Loan.transitions.REPAYMENT_to_DELINQUENT
        distinguishing_aspect: "When a Loan transitions to DELINQUENT (via clock-advance past due_date+15d), Borrower.borrower_status bubbles up to AT_RISK."
        test_recipe:
          setup:
