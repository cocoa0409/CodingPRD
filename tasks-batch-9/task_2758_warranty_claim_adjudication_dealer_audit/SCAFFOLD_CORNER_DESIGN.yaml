      - name: dealer_create_by_field_auditor_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 20]
          - roles
        distinguishing_aspect: |
          Authorization is per endpoint, not per resource family: a FieldAuditor who may read every dealer still
          cannot create one, a WarrantyAdmin who owns all reference data cannot adjudicate a claim, and an
          AuditManager cannot start the field work of the audit it scheduled.
        test_recipe:
          setup:
            - "WORLD-BRAKE: dealer D1 and claim CL1 exist."
            - "The acting roles are all valid §1.7 roles, so the priority-10 auth rule passes and priority 20 is what refuses."
            - "Each targeted endpoint's roles list excludes the acting role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
