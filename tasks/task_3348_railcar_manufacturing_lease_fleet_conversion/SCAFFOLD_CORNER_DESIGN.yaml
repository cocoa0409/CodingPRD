  - name: error_retrofit_deadline_passed_start_after_deadline_returns_422
    claim_type: Violation → Error
    grounds:
    - validations[priority=9]
    - errors[ERR_RETROFIT_DEADLINE_PASSED]
    - entities.RetrofitProgram.fields.compliance_deadline_date
    - POST /api/v1/retrofit-programs/{id}/start
    distinguishing_aspect: POST /retrofit-programs/{id}/start on a mandate whose compliance_deadline_date
      2026-09-15 has already lapsed at the logical clock 2026-10-01 is rejected by priority 9 with ERR_RETROFIT_DEADLINE_PASSED
      and HTTP 422, while a covered program with deadline 2026-12-31 starts 200 at the same clock.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z for creation, then advanced to 2026-10-01
        so the lapsed mandate is past its deadline.
      - Car type CT-K (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-K) covers
        both programs, so the priority-18 prerequisite of at least one RetrofitProgramCarType row is satisfied
        for each.
      - Program MAND-K1 carries compliance_deadline_date 2026-09-15 (lapsed at the operation date) and
        program MAND-K2 carries 2026-12-31 (still open); both are PLANNED.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-K
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-K
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-K1
          description: Lapsed mandate
          compliance_deadline_date: '2026-09-15'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          p1_id: $.data.id
      - call: POST /api/v1/retrofit-program-car-types
        payload:
          retrofit_program_id: ${p1_id}
          car_type_id: ${ct_id}
        as: RegulatoryRetrofitist
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-K2
          description: Open mandate
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          p2_id: $.data.id
      - call: POST /api/v1/retrofit-program-car-types
        payload:
          retrofit_program_id: ${p2_id}
          car_type_id: ${ct_id}
        as: RegulatoryRetrofitist
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          clock_now: $.data.current_utc
      trigger:
      - call: POST /api/v1/retrofit-programs/${p1_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          err_deadline: $.data.error_id
      - call: GET /api/v1/retrofit-programs/${p1_id}
        payload: {}
        as: PlatformAdmin
        captures:
          p1_after: $.data.status
      - call: POST /api/v1/retrofit-programs/${p2_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          p2_status: $.data.status
          p2_version: $.data.version
      assert:
      - The logical clock reads ${clock_now} == "2026-10-01T00:00:00Z", so the lapsed mandate's deadline
        2026-09-15 is 16 days in the past
      - Starting the lapsed mandate returns HTTP 422 with data.error_id == ${err_deadline} == "ERR_RETROFIT_DEADLINE_PASSED"
      - 'The rejection is atomic: GET /retrofit-programs/${p1_id} still reports status == ${p1_after}
        == "PLANNED"'
      - 'The rule is temporal, not state-based: the program was PLANNED and covered, so priority 5 and
        priority 18 were both satisfied and priority 9 is the rejecting rule'
      - 'The control program with deadline 2026-12-31 starts at the same clock: HTTP 200 with data.status
        == ${p2_status} == "IN_PROGRESS" at version ${p2_version} == 2'
      - The deadline is read as the last legal day for retrofit work, so any program whose remaining window
        cannot end on or before it is refused at start
