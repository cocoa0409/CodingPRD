          - entities.UptimeReport.fields.finalized_by_user_id
          - entities.UptimeReport.fields.returned_count
          - endpoints[POST /uptime-reports/{uptime_report_id}/program-review]
        distinguishing_aspect: "RETURN is the compensating edge of finalize/submit: the report drops back to PROVISIONAL, returned_count rises to 1 and finalized_by_user_id must be cleared to null so that SoD-2 is re-armed for whoever finalizes next. Leaving the old finalizer id behind would silently keep barring that auditor."
