        grounds:
          - errors[ERR_REVIEW_PERIOD_OVERLAP]
          - entities.FiduciaryReview.fields.period_start
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: FiduciaryReview coverage periods per plan; interval semantics: half-open
          [period_start, period_end). Overlapping interior [08-15, 09-15) vs existing [08-01, 09-01)
          is rejected; an exactly-adjacent successor [09-01, 10-01) is ACCEPTED (end == start is not
          an intersection).
        test_recipe:
          setup: ["Batch RECONCILED; one review R1 exists for the plan covering [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
