scenario: "Generate task harder than expert level!\n\n2466. Insurance Guaranty Association & Insolvency Claims (state insurance guaranty association): triggering event on a liquidation order with covered claim definition and coverage caps by line, policyholder claim transfer from the receiver with proof-of-claim data conversion, exhaustion of other insurance and non-duplication rules, unearned premium refund calculation and priority ordering, member insurer assessment calculation on premium base with recoupment through rate surcharges, claims administration through contracted adjusters and defense counsel, large deductible and self-insured retention treatment, coordination with other state associations for multistate policyholders"
domain_name: "insurance-guaranty-association"
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit_trail
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
    - conditional_feature_flags
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: branching
  state_machine_traits: [branching_with_revert, cyclic, parallel_dimensions, compound_aggregate, guarded]
  relationship_patterns: [one_to_many, cross_aggregate_reference, polymorphic_vendor_role]
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: "beyond_expert"
  difficulty_notes: |
    Estate money is a closed ledger: every cent remitted by the receiver is either distributed,
    still undistributed, or returned. Three independent capped calculations (per-claim statutory
    net payable, unearned-premium refund, member assessment allocation) each have two variants
    whose divergence is observable, and all three feed the same estate ledger through a
    priority-ordered waterfall. Coverage caps are read from a CoverageProfile configuration row
    whose cap_order_mode flag flips the order of the statutory-deductible offset relative to the
    per-claim cap, so identical loss data yields different payables under different profiles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Insolvency
    parent: null
    common_fields: true
    fields:
      - name: insurer_name
        type: string
        source: input
        description: legal name of the insolvent member insurer placed in liquidation
      - name: naic_code
        type: string
        source: input
        description: NAIC company code of the insolvent insurer
        constraints: unique across Insolvency rows
      - name: domiciliary_state_code
        type: string
        source: input
        description: two-letter state code of the court that entered the liquidation order
        constraints: exactly 2 uppercase letters
      - name: liquidation_order_date
        type: string
        source: input
        description: date the court entered the order of liquidation with a finding of insolvency
        constraints: ISO 8601 calendar date (YYYY-MM-DD)
      - name: coverage_termination_date
        type: string
        source: computed
        description: liquidation_order_date plus 30 calendar days; policies in force are cancelled by operation of law on this date
      - name: proof_of_claim_deadline_utc
        type: datetime
        source: computed
        description: liquidation_order_date plus 365 calendar days at 00:00:00Z; claim filing is allowed at or before this instant (inclusive)
      - name: status
        type: enum
        source: system
        description: lifecycle of the insolvency file inside the association
        default: DECLARED
        constraints: one of [DECLARED, TRIGGERED, CLOSED]
      - name: triggered_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the triggering event was recorded; null while status is DECLARED
      - name: estate_remitted_cents
        type: integer
        source: computed
        description: cumulative early-access and dividend cash remitted to the association by the receiver
        default: 0
      - name: estate_distributed_cents
        type: integer
        source: computed
        description: cumulative cash paid out of the estate through distribution runs
        default: 0
      - name: estate_undistributed_cents
        type: integer
        source: computed
        description: estate_remitted_cents minus estate_distributed_cents minus estate_returned_cents
        default: 0
      - name: estate_returned_cents
        type: integer
        source: computed
        description: cash returned to the receiver when the insolvency file is closed
        default: 0
      - name: administrative_expense_cents
        type: integer
        source: computed
        description: sum of fees_accrued_cents over all VendorAssignment rows on claims of this insolvency; class 1 in the distribution waterfall
        default: 0
      - name: administrative_paid_cents
        type: integer
        source: computed
        description: cumulative class 1 administrative expense already settled by distribution runs
        default: 0
      - name: reserved_claim_cents
        type: integer
        source: computed
        description: sum of (net_payable_cents - paid_amount_cents) over CoveredClaim rows of this insolvency whose status IN {APPROVED, PARTIALLY_PAID}
        default: 0
      - name: pending_up_liability_cents
        type: integer
        source: computed
        description: sum of (computed_refund_cents - paid_amount_cents) over UnearnedPremiumRefund rows on policies of this insolvency whose status IN {PENDING, PARTIALLY_PAID}
        default: 0
      - name: referral_pending_count
        type: integer
        source: computed
        description: count of CoveredClaim rows of this insolvency whose status == REFERRAL_PENDING
        default: 0
      - name: assessment_shortfall_cents
        type: integer
        source: computed
        description: sum of shortfall_cents over Assessment rows of this insolvency whose status IN {CERTIFIED, SETTLED}
        default: 0
      - name: distribution_sequence
        type: integer
        source: system
        description: number of distribution runs executed against this insolvency; incremented by one per run
        default: 0
      - name: policy_count
        type: integer
        source: computed
        description: count of TransferredPolicy rows whose insolvency_id equals this row's id
        default: 0

  - name: CoverageProfile
    parent: null
    common_fields: false
    fields:
      - name: line_of_business
        type: enum
        source: input
        description: statutory line whose coverage caps and offsets this configuration row defines
        constraints: one of [PERSONAL_AUTO, HOMEOWNERS, COMMERCIAL_GENERAL_LIABILITY, WORKERS_COMPENSATION]; unique across CoverageProfile rows
      - name: per_claim_cap_cents
        type: integer
        source: input
        description: statutory maximum the association pays on one covered claim in this line
        constraints: greater than 0
      - name: per_policy_aggregate_cap_cents
        type: integer
        source: input
        description: statutory maximum the association pays across all covered claims sharing one TransferredPolicy in this line
        constraints: greater than or equal to per_claim_cap_cents
      - name: unearned_premium_cap_cents
        type: integer
        source: input
        description: statutory maximum unearned premium refund payable on one policy in this line
        constraints: greater than 0
      - name: statutory_deductible_cents
        type: integer
        source: input
        description: statutory deductible subtracted from every covered claim in this line
        default: 10000
      - name: net_worth_exclusion_threshold_cents
        type: integer
        source: input
        description: policyholder net worth at or above which the claim is excluded from coverage in this line
        default: 2500000000
      - name: covers_punitive_damages
        type: boolean
        source: input
        description: when false, punitive_damages_cents is excluded from the covered loss basis in this line
        default: false
      - name: refund_priority_class
        type: integer
        source: input
        description: ordering rank of this line's unearned premium refunds inside distribution class 3 (lower pays first)
        constraints: integer in [1, 2, 3]
      - name: cap_order_mode
        type: enum
        source: input
        description: conditional flag selecting whether the statutory deductible and other-insurance offsets are applied before or after the per-claim cap
        default: OFFSET_THEN_CAP
        constraints: one of [OFFSET_THEN_CAP, CAP_THEN_OFFSET]

  - name: MemberInsurer
    parent: null
    common_fields: true
    fields:
      - name: naic_code
        type: string
        source: input
        description: NAIC company code of the solvent member insurer
        constraints: the triple (naic_code, assessable_line, base_year) is unique across MemberInsurer rows
      - name: insurer_name
        type: string
        source: input
        description: legal name of the member insurer
      - name: assessable_line
        type: enum
        source: input
        description: statutory account whose premium this row reports
        constraints: one of [PERSONAL_AUTO, HOMEOWNERS, COMMERCIAL_GENERAL_LIABILITY, WORKERS_COMPENSATION]
      - name: base_year
        type: integer
        source: input
        description: calendar year of the reported direct written premium
        constraints: integer in [2000, 2100]
      - name: direct_written_premium_cents
        type: integer
        source: input
        description: direct written premium in this state for the assessable_line in base_year; the premium base for assessment allocation
        constraints: greater than or equal to 0
      - name: annual_cap_rate_bps
        type: integer
        source: input
        description: per-member annual assessment cap expressed in basis points of direct_written_premium_cents
        default: 200
        constraints: integer in [0, 200]
      - name: account_status
        type: enum
        source: system
        description: membership posture; only ACTIVE rows enter the assessment allocation pool
        default: ACTIVE
        constraints: one of [ACTIVE, IMPAIRED, WITHDRAWN]
      - name: sequence
        type: integer
        source: system
        description: monotone registration counter assigned by the server, used as the deterministic tie-break after created_at ASC

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: insolvency_id
        type: string
        source: input
        description: FK -> Insolvency.id; the insolvency whose covered-claim liabilities this assessment funds
      - name: assessable_line
        type: enum
        source: input
        description: statutory account assessed; only MemberInsurer rows with a matching assessable_line participate
        constraints: one of [PERSONAL_AUTO, HOMEOWNERS, COMMERCIAL_GENERAL_LIABILITY, WORKERS_COMPENSATION]
      - name: base_year
        type: integer
        source: input
        description: premium base year used for allocation; only MemberInsurer rows with a matching base_year participate
      - name: needed_amount_cents
        type: integer
        source: input
        description: cash the association must raise from member insurers for this account
        constraints: greater than 0
      - name: status
        type: enum
        source: system
        description: lifecycle of the assessment levy
        default: DRAFT
        constraints: one of [DRAFT, CERTIFIED, SETTLED]
      - name: levied_amount_cents
        type: integer
        source: computed
        description: sum of levied_amount_cents over the MemberAssessment rows created at certification
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: needed_amount_cents minus levied_amount_cents; positive when per-member caps exhaust the pool
        default: 0
      - name: member_count
        type: integer
        source: computed
        description: number of MemberAssessment rows created at certification
        default: 0
      - name: collected_amount_cents
        type: integer
        source: computed
        description: sum of paid_amount_cents over this assessment's MemberAssessment rows
        default: 0
      - name: certified_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the assessment was certified; null while status is DRAFT

  - name: MemberAssessment
    parent: Assessment
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: system
        description: FK -> Assessment.id; the certified levy this member invoice belongs to
      - name: member_insurer_id
        type: string
        source: system
        description: FK -> MemberInsurer.id; the member insurer invoiced by this row
      - name: premium_base_cents
        type: integer
        source: computed
        description: snapshot of MemberInsurer.direct_written_premium_cents at certification time
      - name: cap_amount_cents
        type: integer
        source: computed
        description: round_half_up(premium_base_cents * MemberInsurer.annual_cap_rate_bps / 10000) - the ceiling this member can be levied
      - name: levied_amount_cents
        type: integer
        source: computed
        description: amount allocated to this member by the assessment allocation calculation
      - name: paid_amount_cents
        type: integer
        source: computed
        description: cumulative cash remitted by the member against levied_amount_cents
        default: 0
      - name: capped
        type: boolean
        source: computed
        description: true when levied_amount_cents equals cap_amount_cents and the uncapped raw share exceeded the cap
        default: false
      - name: billing_status
        type: enum
        source: system
        description: collection dimension of this invoice, independent of the recoupment dimension
        default: INVOICED
        constraints: one of [INVOICED, PARTIALLY_PAID, PAID, DELINQUENT]
      - name: recoupment_status
        type: enum
        source: system
        description: rate-surcharge recovery dimension of this invoice, independent of the billing dimension
        default: NOT_STARTED
        constraints: one of [NOT_STARTED, SURCHARGE_FILED, RECOUPING, RECOUPED]
      - name: surcharge_rate_bps
        type: integer
        source: system
        description: filed policyholder rate surcharge in basis points of surcharge_base_cents; 0 until a surcharge filing is accepted
        default: 0
      - name: surcharge_base_cents
        type: integer
        source: system
        description: written premium base the filed surcharge applies to; 0 until a surcharge filing is accepted
        default: 0
      - name: projected_recoupment_cents
        type: integer
        source: computed
        description: recoupment the filed surcharge is projected to recover, capped at levied_amount_cents
        default: 0
      - name: recouped_amount_cents
        type: integer
        source: computed
        description: cumulative surcharge proceeds reported by the member against levied_amount_cents
        default: 0
      - name: sequence
        type: integer
        source: system
        description: monotone counter within the parent Assessment, used as the deterministic tie-break after created_at ASC in remainder-cent allocation

  - name: ProofOfClaimTransfer
    parent: Insolvency
    common_fields: true
    fields:
      - name: insolvency_id
        type: string
        source: input
        description: FK -> Insolvency.id; the insolvency whose receiver produced this batch
      - name: receiver_batch_ref
        type: string
        source: input
        description: receiver-assigned batch reference for the transferred proof-of-claim extract
        constraints: unique within one insolvency_id
      - name: records
        type: array
        source: input
        description: raw proof-of-claim rows as delivered by the receiver; each element is an object with keys record_type (POLICY or CLAIM), policy_number, line_of_business, policyholder_name, policyholder_state_code, policyholder_net_worth_cents, effective_date, expiration_date, annual_premium_cents, claimant_name, claimant_state_code, loss_date, gross_loss_cents
        constraints: at least 1 element
      - name: record_count
        type: integer
        source: computed
        description: number of elements in records
      - name: converted_count
        type: integer
        source: computed
        description: number of records converted into TransferredPolicy or CoveredClaim rows
        default: 0
      - name: rejected_count
        type: integer
        source: computed
        description: number of records rejected by the data conversion pass
        default: 0
      - name: rejection_reasons
        type: array
        source: computed
        description: >-
          one string per rejected record in records order, formatted "<index>:<reason_code>" with the zero-based index of the
          record inside records; reason_code is exactly one of MISSING_REQUIRED_FIELD (a key the record_type needs is absent
          or empty), UNKNOWN_LINE_OF_BUSINESS (no CoverageProfile row exists for the record's line_of_business) or
          NO_MATCHING_POLICY (a CLAIM record whose policy_number matches no TransferredPolicy of this insolvency, including
          the ones created earlier in the same conversion pass); a record is evaluated against these three checks in that
          order and only the first failing reason_code is reported
      - name: status
        type: enum
        source: system
        description: conversion outcome of the batch
        default: RECEIVED
        constraints: one of [RECEIVED, CONVERTED, PARTIALLY_CONVERTED, REJECTED]

  - name: TransferredPolicy
    parent: Insolvency
    common_fields: true
    fields:
      - name: insolvency_id
        type: string
        source: input
        description: FK -> Insolvency.id; the insolvency this policy was written by
      - name: source_transfer_id
        type: string
        source: system
        description: FK -> ProofOfClaimTransfer.id; the batch whose conversion produced this policy, or null when keyed in directly
      - name: policy_number
        type: string
        source: input
        description: policy number as carried on the receiver's records
        constraints: unique within one insolvency_id
      - name: line_of_business
        type: enum
        source: input
        description: statutory line of the policy; selects the CoverageProfile row that governs its claims
        constraints: one of [PERSONAL_AUTO, HOMEOWNERS, COMMERCIAL_GENERAL_LIABILITY, WORKERS_COMPENSATION]
      - name: policyholder_name
        type: string
        source: input
        description: named insured on the policy
      - name: policyholder_state_code
        type: string
        source: input
        description: two-letter residence or principal-place-of-business state of the named insured
        constraints: exactly 2 uppercase letters
      - name: policyholder_net_worth_cents
        type: integer
        source: input
        description: net worth of the named insured as reported on the proof of claim; compared against the line's net_worth_exclusion_threshold_cents
        default: 0
      - name: effective_date
        type: string
        source: input
        description: policy inception date (inclusive)
        constraints: ISO 8601 calendar date
      - name: expiration_date
        type: string
        source: input
        description: policy expiration date (exclusive); the policy term is the half-open interval [effective_date, expiration_date)
        constraints: ISO 8601 calendar date strictly after effective_date
      - name: annual_premium_cents
        type: integer
        source: input
        description: premium written for the full policy term
        constraints: greater than 0
      - name: large_deductible_cents
        type: integer
        source: input
        description: insured-funded large deductible obligation under the policy
        default: 0
      - name: self_insured_retention_cents
        type: integer
        source: input
        description: self-insured retention the insured must satisfy before the policy layer attaches
        default: 0
      - name: collateral_held_cents
        type: integer
        source: input
        description: collateral posted by the insured and held by the receiver against the retained obligation
        default: 0
      - name: status
        type: enum
        source: system
        description: coverage posture of the policy relative to the liquidation order
        default: IMPORTED
        constraints: one of [IMPORTED, CANCELLED_BY_ORDER, EXPIRED_BEFORE_ORDER]
      - name: cancellation_date
        type: string
        source: computed
        description: earlier of expiration_date and Insolvency.coverage_termination_date; null while status is IMPORTED
      - name: unexpired_days
        type: integer
        source: computed
        description: whole calendar days from cancellation_date to expiration_date; 0 when the policy expired before the liquidation order
        default: 0
      - name: aggregate_paid_cents
        type: integer
        source: computed
        description: sum of net_payable_cents over CoveredClaim rows on this policy whose status IN {APPROVED, PARTIALLY_PAID, PAID}
        default: 0
      - name: up_refund_filed
        type: boolean
        source: computed
        description: true once an UnearnedPremiumRefund row exists for this policy
        default: false

  - name: CoveredClaim
    parent: TransferredPolicy
    common_fields: true
    fields:
      - name: insolvency_id
        type: string
        source: input
        description: FK -> Insolvency.id; the insolvency whose estate this claim is presented against
      - name: policy_id
        type: string
        source: input
        description: FK -> TransferredPolicy.id; the policy the claim arises under
      - name: source_transfer_id
        type: string
        source: system
        description: FK -> ProofOfClaimTransfer.id; the batch whose conversion produced this claim, or null when filed directly
      - name: claim_number
        type: string
        source: input
        description: claim number as presented
        constraints: unique within one policy_id
      - name: claimant_name
        type: string
        source: input
        description: person or entity presenting the claim
      - name: claimant_state_code
        type: string
        source: input
        description: two-letter residence state of the claimant
        constraints: exactly 2 uppercase letters
      - name: loss_date
        type: string
        source: input
        description: date of the occurrence giving rise to the claim
        constraints: ISO 8601 calendar date
      - name: filed_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the claim was presented to the association
      - name: gross_loss_cents
        type: integer
        source: input
        description: adjudicated or demanded loss amount before any offset or cap
        constraints: greater than 0
      - name: punitive_damages_cents
        type: integer
        source: input
        description: portion of the demand attributable to punitive damages
        default: 0
      - name: covered_basis_cents
        type: integer
        source: computed
        description: gross_loss_cents plus punitive_damages_cents when the line's covers_punitive_damages is true, else gross_loss_cents alone
        default: 0
      - name: other_insurance_recoverable_cents
        type: integer
        source: computed
        description: sum of recovered_cents over OtherInsuranceCoverage rows of this claim whose status IN {EXHAUSTED, CARRIER_DENIED}
        default: 0
      - name: attachment_point_cents
        type: integer
        source: computed
        description: min(large_deductible_cents + self_insured_retention_cents, collateral_held_cents) on the parent policy
        default: 0
      - name: covered_layer_cents
        type: integer
        source: computed
        description: max(0, covered_basis_cents - attachment_point_cents)
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: statutory net payable under the parent line's cap_order_mode, after the per-policy aggregate cap
        default: 0
      - name: alt_net_payable_cents
        type: integer
        source: computed
        description: net payable the opposite cap_order_mode variant would have produced on identical data
        default: 0
      - name: cap_binding
        type: enum
        source: computed
        description: which statutory ceiling reduced the payable
        default: NONE
        constraints: one of [NONE, PER_CLAIM, PER_POLICY_AGGREGATE]
      - name: paid_amount_cents
        type: integer
        source: computed
        description: cumulative cash paid to the claimant by distribution runs
        default: 0
      - name: status
        type: enum
        source: system
        description: claims-administration lifecycle of the covered claim
        default: RECEIVED
        constraints: one of [RECEIVED, SCREENED_ELIGIBLE, DENIED_NOT_COVERED, ADJUSTING, RECOMMENDED, REFERRAL_PENDING, REFERRED_OUT, APPROVED, PARTIALLY_PAID, PAID]
      - name: screened_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CoverageAnalyst who screened the claim; null before screening
      - name: approved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ClaimsCommitteeOfficer who approved the claim; null before approval
      - name: recommended_by_vendor_name
        type: string
        source: system
        description: vendor_name of the VendorAssignment whose adjuster recommended the settlement; null before recommendation
      - name: recommended_amount_cents
        type: integer
        source: system
        description: settlement amount recommended by the assigned adjuster; null before recommendation
      - name: recommended_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the latest recommendation; null before recommendation
      - name: remand_count
        type: integer
        source: computed
        description: number of times the claims committee has remanded this claim from RECOMMENDED back to ADJUSTING
        default: 0
      - name: pre_referral_status
        type: enum
        source: system
        description: status the claim held before entering REFERRAL_PENDING, restored when the referral is declined; null when no referral is open
        constraints: one of [SCREENED_ELIGIBLE, ADJUSTING]
      - name: referred_to_state_code
        type: string
        source: system
        description: two-letter state code of the sister association that accepted the claim; null unless status is REFERRED_OUT
      - name: denial_reason
        type: string
        source: system
        description: reason code recorded when screening denies coverage; null unless status is DENIED_NOT_COVERED
      - name: sequence
        type: integer
        source: system
        description: monotone filing counter assigned by the server, used as the deterministic tie-break after created_at ASC in waterfall ordering

  - name: OtherInsuranceCoverage
    parent: CoveredClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: FK -> CoveredClaim.id; the covered claim this other-insurance layer sits against
      - name: carrier_name
        type: string
        source: input
        description: solvent carrier that may owe on the same loss
      - name: policy_number
        type: string
        source: input
        description: policy number of the other insurance
      - name: coverage_type
        type: enum
        source: input
        description: relationship of the other insurance to the insolvent insurer's policy
        constraints: one of [PRIMARY, EXCESS, UMBRELLA]
      - name: stated_limit_cents
        type: integer
        source: input
        description: limit stated on the other insurance policy
        constraints: greater than 0
      - name: recovered_cents
        type: integer
        source: computed
        description: amount actually recovered from this carrier; 0 until the layer reaches EXHAUSTED or CARRIER_DENIED
        default: 0
      - name: status
        type: enum
        source: system
        description: exhaustion posture of this other-insurance layer
        default: UNEXHAUSTED
        constraints: one of [UNEXHAUSTED, PURSUING, EXHAUSTED, CARRIER_DENIED]
      - name: sequence
        type: integer
        source: system
        description: monotone counter within the claim, used as the deterministic tie-break after created_at ASC

  - name: VendorAssignment
    parent: CoveredClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: FK -> CoveredClaim.id; the claim this contracted vendor is engaged on
      - name: vendor_type
        type: enum
        source: input
        description: contracted role of the vendor on this claim
        constraints: one of [ADJUSTER, DEFENSE_COUNSEL]
      - name: vendor_name
        type: string
        source: input
        description: firm name of the contracted adjuster or defense counsel
      - name: settlement_authority_cents
        type: integer
        source: input
        description: maximum settlement the vendor may recommend without committee re-authorization
        constraints: greater than or equal to 0
      - name: hourly_rate_cents
        type: integer
        source: input
        description: contracted hourly rate used to accrue administrative expense
        constraints: greater than 0
      - name: engagement_start
        type: string
        source: input
        description: first date of the engagement (inclusive)
        constraints: ISO 8601 calendar date
      - name: engagement_end
        type: string
        source: input
        description: last date of the engagement (inclusive); the engagement occupies the closed interval [engagement_start, engagement_end]
        constraints: ISO 8601 calendar date on or after engagement_start
      - name: hours_logged
        type: number
        source: computed
        description: cumulative invoiced hours on this engagement
        default: 0
      - name: fees_accrued_cents
        type: integer
        source: computed
        description: cumulative vendor fee accrued from invoices; rolls up into Insolvency.administrative_expense_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: engagement posture
        default: ASSIGNED
        constraints: one of [ASSIGNED, SUPERSEDED, CLOSED]

  - name: UnearnedPremiumRefund
    parent: TransferredPolicy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: FK -> TransferredPolicy.id; the cancelled policy whose unearned premium is refunded
      - name: refund_method
        type: enum
        source: input
        description: statutory computation variant elected for this refund
        constraints: one of [PRO_RATA, SHORT_RATE]
      - name: computed_refund_cents
        type: integer
        source: computed
        description: refund produced by the elected variant after the line's unearned_premium_cap_cents is applied
      - name: alt_refund_cents
        type: integer
        source: computed
        description: refund the other variant would have produced on identical policy data, after the same cap
      - name: capped
        type: boolean
        source: computed
        description: true when the uncapped refund exceeded the line's unearned_premium_cap_cents
        default: false
      - name: priority_class
        type: integer
        source: computed
        description: snapshot of the line's refund_priority_class, used to order payment inside distribution class 3
      - name: paid_amount_cents
        type: integer
        source: computed
        description: cumulative cash paid on this refund by distribution runs
        default: 0
      - name: status
        type: enum
        source: system
        description: payment posture of the refund
        default: PENDING
        constraints: one of [PENDING, PARTIALLY_PAID, PAID]
      - name: sequence
        type: integer
        source: system
        description: monotone filing counter assigned by the server, used as the deterministic tie-break after created_at ASC in class 3 ordering

  - name: SisterAssociationReferral
    parent: CoveredClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: FK -> CoveredClaim.id; the claim offered to another state's guaranty association
      - name: target_state_code
        type: string
        source: input
        description: two-letter state code of the sister guaranty association the claim is offered to
        constraints: exactly 2 uppercase letters and not equal to the association's own state code MI
      - name: basis
        type: enum
        source: input
        description: statutory connecting factor asserted as the reason the sister association has jurisdiction
        constraints: one of [POLICYHOLDER_RESIDENCE, CLAIMANT_RESIDENCE, PROPERTY_LOCATION]
      - name: basis_state_code
        type: string
        source: computed
        description: state code the asserted basis resolves to - TransferredPolicy.policyholder_state_code for POLICYHOLDER_RESIDENCE, CoveredClaim.claimant_state_code for CLAIMANT_RESIDENCE and PROPERTY_LOCATION
      - name: status
        type: enum
        source: system
        description: disposition of the referral by the sister association
        default: OPEN
        constraints: one of [OPEN, ACCEPTED, DECLINED]
      - name: response_note
        type: string
        source: system
        description: free-text disposition note supplied by the responding association; null while status is OPEN
      - name: responded_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the sister association's response; null while status is OPEN

state_machines:
  - entity: Insolvency
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: TRIGGERED
        trigger: "POST /insolvencies/{id}/trigger"
        actor: AssociationAdmin
        preconditions:
          - "status == DECLARED"
          - "at least one TransferredPolicy row exists with insolvency_id == this id and status == IMPORTED"
          - "a CoverageProfile row exists for every distinct line_of_business among this insolvency's TransferredPolicy rows, else ERR_COVERAGE_PROFILE_MISSING"
        side_effects:
          - "sets triggered_at_utc to the logical clock instant"
          - "sets coverage_termination_date = liquidation_order_date + 30 days"
          - "sets proof_of_claim_deadline_utc = liquidation_order_date + 365 days at 00:00:00Z"
          - "cascades to every TransferredPolicy with status == IMPORTED: expiration_date > liquidation_order_date moves it to CANCELLED_BY_ORDER, otherwise to EXPIRED_BEFORE_ORDER"
          - "recomputes policy_count"
          - "increments Insolvency.version by 1"
        note: "The triggering event; no covered claim may be filed before this transition."
      - from: TRIGGERED
        to: CLOSED
        trigger: "POST /insolvencies/{id}/close"
        actor: AssociationAdmin
        preconditions:
          - "status == TRIGGERED"
          - "no CoveredClaim of this insolvency has status IN {RECEIVED, SCREENED_ELIGIBLE, ADJUSTING, RECOMMENDED, REFERRAL_PENDING, APPROVED, PARTIALLY_PAID}, else ERR_CLAIMS_OUTSTANDING"
          - "no UnearnedPremiumRefund on a policy of this insolvency has status IN {PENDING, PARTIALLY_PAID}, else ERR_REFUNDS_OUTSTANDING"
        side_effects:
          - "adds estate_undistributed_cents into estate_returned_cents and sets estate_undistributed_cents to 0, preserving the identity estate_remitted_cents == estate_distributed_cents + estate_undistributed_cents + estate_returned_cents"
          - "increments Insolvency.version by 1"

  - entity: TransferredPolicy
    initial_state: IMPORTED
    terminal_states: [CANCELLED_BY_ORDER, EXPIRED_BEFORE_ORDER]
    transitions:
      - from: IMPORTED
        to: CANCELLED_BY_ORDER
        trigger: "system cascade from Insolvency DECLARED_to_TRIGGERED"
        actor: system
        preconditions:
          - "status == IMPORTED"
          - "expiration_date > Insolvency.liquidation_order_date"
        side_effects:
          - "sets cancellation_date = earlier of expiration_date and Insolvency.coverage_termination_date"
          - "sets unexpired_days = whole days from cancellation_date to expiration_date"
          - "increments TransferredPolicy.version by 1"
      - from: IMPORTED
        to: EXPIRED_BEFORE_ORDER
        trigger: "system cascade from Insolvency DECLARED_to_TRIGGERED"
        actor: system
        preconditions:
          - "status == IMPORTED"
          - "expiration_date <= Insolvency.liquidation_order_date"
        side_effects:
          - "leaves cancellation_date null and unexpired_days 0, so no unearned premium refund can be filed"
          - "increments TransferredPolicy.version by 1"

  - entity: ProofOfClaimTransfer
    initial_state: RECEIVED
    terminal_states: [CONVERTED, PARTIALLY_CONVERTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: CONVERTED
        trigger: "POST /poc-transfers/{id}/convert"
        actor: ReceiverLiaison
        preconditions:
          - "status == RECEIVED"
          - "Insolvency.status IN {DECLARED, TRIGGERED}"
          - "every element of records passes conversion"
        side_effects:
          - "creates one TransferredPolicy per POLICY record with source_transfer_id set to this row's id"
          - "creates one CoveredClaim per CLAIM record with source_transfer_id set to this row's id, matched to the TransferredPolicy sharing its policy_number"
          - "sets converted_count = record_count, rejected_count = 0, rejection_reasons = []"
          - "recomputes Insolvency.policy_count"
      - from: RECEIVED
        to: PARTIALLY_CONVERTED
        trigger: "POST /poc-transfers/{id}/convert"
        actor: ReceiverLiaison
        preconditions:
          - "status == RECEIVED"
          - "Insolvency.status IN {DECLARED, TRIGGERED}"
          - "at least one element of records passes conversion and at least one fails"
        side_effects:
          - "creates rows only for passing records"
          - "sets converted_count and rejected_count to the respective counts and appends one '<index>:<reason_code>' string per failing record to rejection_reasons in records order"
          - "recomputes Insolvency.policy_count"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /poc-transfers/{id}/convert"
        actor: ReceiverLiaison
        preconditions:
          - "status == RECEIVED"
          - "Insolvency.status IN {DECLARED, TRIGGERED}"
          - "every element of records fails conversion"
        side_effects:
          - "creates no rows, sets converted_count = 0 and rejected_count = record_count"
          - "appends one '<index>:<reason_code>' string per record to rejection_reasons in records order"

  - entity: CoveredClaim
    initial_state: RECEIVED
    terminal_states: [DENIED_NOT_COVERED, REFERRED_OUT, PAID]
    transitions:
      - from: RECEIVED
        to: SCREENED_ELIGIBLE
        trigger: "POST /claims/{id}/screen with decision COVERED"
        actor: CoverageAnalyst
        preconditions:
          - "status == RECEIVED"
          - "Insolvency.status == TRIGGERED"
          - "TransferredPolicy.status == CANCELLED_BY_ORDER, else ERR_POLICY_NOT_CANCELLED"
          - "TransferredPolicy.policyholder_net_worth_cents < CoverageProfile.net_worth_exclusion_threshold_cents, else ERR_NET_WORTH_EXCLUSION"
        side_effects:
          - "sets screened_by_user_id to the acting X-User-ID"
          - "runs claim_net_payable and writes covered_basis_cents, attachment_point_cents, covered_layer_cents, net_payable_cents, alt_net_payable_cents, cap_binding"
          - "increments CoveredClaim.version by 1"
      - from: RECEIVED
        to: DENIED_NOT_COVERED
        trigger: "POST /claims/{id}/screen with decision DENIED"
        actor: CoverageAnalyst
        preconditions:
          - "status == RECEIVED"
          - "Insolvency.status == TRIGGERED"
        side_effects:
          - "sets denial_reason to the supplied reason code and screened_by_user_id to the acting X-User-ID"
          - "leaves net_payable_cents at 0 so the claim never enters the waterfall"
          - "closes every VendorAssignment of this claim whose status == ASSIGNED"
      - from: SCREENED_ELIGIBLE
        to: ADJUSTING
        trigger: "POST /claims/{id}/vendor-assignments with vendor_type ADJUSTER"
        actor: AssociationAdmin
        preconditions:
          - "status == SCREENED_ELIGIBLE"
          - "the new engagement interval does not intersect the closed interval of another ASSIGNED ADJUSTER engagement on this claim, else ERR_ADJUSTER_ENGAGEMENT_OVERLAP"
        side_effects:
          - "creates the VendorAssignment row in ASSIGNED"
          - "increments CoveredClaim.version by 1"
      - from: ADJUSTING
        to: RECOMMENDED
        trigger: "POST /claims/{id}/recommend"
        actor: ClaimsAdjuster
        preconditions:
          - "status == ADJUSTING"
          - "the acting X-User-ID equals the id of an ASSIGNED VendorAssignment on this claim with vendor_type == ADJUSTER, else ERR_NOT_ASSIGNED_ADJUSTER"
          - "recommended_amount_cents <= that VendorAssignment.settlement_authority_cents, else ERR_ADJUSTER_AUTHORITY_EXCEEDED"
          - "recommended_amount_cents <= net_payable_cents, else ERR_OVERPAYMENT"
        side_effects:
          - "sets recommended_amount_cents, recommended_by_vendor_name and recommended_at_utc"
          - "increments CoveredClaim.version by 1"
      - from: RECOMMENDED
        to: ADJUSTING
        trigger: "POST /claims/{id}/remand"
        actor: ClaimsCommitteeOfficer
        preconditions:
          - "status == RECOMMENDED"
          - "remand_count < 2, else ERR_REMAND_LIMIT_REACHED"
        side_effects:
          - "increments remand_count by 1"
          - "clears recommended_amount_cents, recommended_by_vendor_name and recommended_at_utc back to null"
          - "leaves Insolvency.reserved_claim_cents unchanged, since no reserve is booked before approval"
        note: "Branching-with-revert cycle; the third remand attempt is refused."
      - from: RECOMMENDED
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsCommitteeOfficer
        preconditions:
          - "status == RECOMMENDED"
          - "the acting X-User-ID differs from screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "every OtherInsuranceCoverage row of this claim has status IN {EXHAUSTED, CARRIER_DENIED}, else ERR_OTHER_INSURANCE_NOT_EXHAUSTED"
          - "net_payable_cents <= max(0, CoverageProfile.per_policy_aggregate_cap_cents - TransferredPolicy.aggregate_paid_cents), else ERR_AGGREGATE_CAP_EXHAUSTED"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "re-runs claim_net_payable so late other-insurance recoveries are reflected in net_payable_cents"
          - "adds net_payable_cents into Insolvency.reserved_claim_cents"
          - "recomputes TransferredPolicy.aggregate_paid_cents"
      - from: SCREENED_ELIGIBLE
        to: REFERRAL_PENDING
        trigger: "POST /claims/{id}/referrals"
        actor: AssociationAdmin
        preconditions:
          - "status == SCREENED_ELIGIBLE"
          - "no SisterAssociationReferral of this claim has status == OPEN, else ERR_REFERRAL_ALREADY_OPEN"
          - "the referral's basis_state_code equals target_state_code, else ERR_REFERRAL_BASIS_MISMATCH"
        side_effects:
          - "creates the SisterAssociationReferral row in OPEN"
          - "sets pre_referral_status to SCREENED_ELIGIBLE"
          - "increments Insolvency.referral_pending_count by 1"
      - from: ADJUSTING
        to: REFERRAL_PENDING
        trigger: "POST /claims/{id}/referrals"
        actor: AssociationAdmin
        preconditions:
          - "status == ADJUSTING"
          - "no SisterAssociationReferral of this claim has status == OPEN, else ERR_REFERRAL_ALREADY_OPEN"
          - "the referral's basis_state_code equals target_state_code, else ERR_REFERRAL_BASIS_MISMATCH"
        side_effects:
          - "creates the SisterAssociationReferral row in OPEN"
          - "sets pre_referral_status to ADJUSTING"
          - "increments Insolvency.referral_pending_count by 1"
      - from: REFERRAL_PENDING
        to: REFERRED_OUT
        trigger: "POST /claims/{id}/referrals/{referralId}/respond with disposition ACCEPTED"
        actor: AssociationAdmin
        preconditions:
          - "status == REFERRAL_PENDING"
          - "the referral status == OPEN, else ERR_REFERRAL_ALREADY_ANSWERED"
        side_effects:
          - "sets the referral status to ACCEPTED with response_note and responded_at_utc"
          - "sets referred_to_state_code to the referral's target_state_code and clears pre_referral_status to null"
          - "decrements Insolvency.referral_pending_count by 1"
          - "closes every VendorAssignment of this claim whose status == ASSIGNED"
          - "sets net_payable_cents to 0 so the referred claim leaves the local waterfall"
      - from: REFERRAL_PENDING
        to: ADJUSTING
        trigger: "POST /claims/{id}/referrals/{referralId}/respond with disposition DECLINED"
        actor: AssociationAdmin
        preconditions:
          - "status == REFERRAL_PENDING"
          - "the referral status == OPEN, else ERR_REFERRAL_ALREADY_ANSWERED"
          - "pre_referral_status == ADJUSTING"
        side_effects:
          - "sets the referral status to DECLINED with response_note and responded_at_utc"
          - "restores status from pre_referral_status and clears pre_referral_status to null"
          - "decrements Insolvency.referral_pending_count by 1"
      - from: REFERRAL_PENDING
        to: SCREENED_ELIGIBLE
        trigger: "POST /claims/{id}/referrals/{referralId}/respond with disposition DECLINED"
        actor: AssociationAdmin
        preconditions:
          - "status == REFERRAL_PENDING"
          - "the referral status == OPEN, else ERR_REFERRAL_ALREADY_ANSWERED"
          - "pre_referral_status == SCREENED_ELIGIBLE"
        side_effects:
          - "sets the referral status to DECLINED with response_note and responded_at_utc"
          - "restores status from pre_referral_status and clears pre_referral_status to null"
          - "decrements Insolvency.referral_pending_count by 1"
      - from: APPROVED
        to: PARTIALLY_PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the waterfall allocated a positive amount strictly less than net_payable_cents - paid_amount_cents to this claim"
        side_effects:
          - "adds the allocated amount to paid_amount_cents"
          - "reduces Insolvency.reserved_claim_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"
      - from: APPROVED
        to: PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the waterfall allocated exactly net_payable_cents - paid_amount_cents to this claim"
        side_effects:
          - "sets paid_amount_cents = net_payable_cents"
          - "reduces Insolvency.reserved_claim_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"
          - "closes every VendorAssignment of this claim whose status == ASSIGNED"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == PARTIALLY_PAID"
          - "the waterfall allocated exactly net_payable_cents - paid_amount_cents to this claim"
        side_effects:
          - "sets paid_amount_cents = net_payable_cents"
          - "reduces Insolvency.reserved_claim_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"
          - "closes every VendorAssignment of this claim whose status == ASSIGNED"

  - entity: OtherInsuranceCoverage
    initial_state: UNEXHAUSTED
    terminal_states: [EXHAUSTED, CARRIER_DENIED]
    transitions:
      - from: UNEXHAUSTED
        to: PURSUING
        trigger: "PATCH /claims/{id}/other-insurance/{coverageId} with status PURSUING"
        actor: CoverageAnalyst
        preconditions:
          - "status == UNEXHAUSTED"
          - "CoveredClaim.status IN {SCREENED_ELIGIBLE, ADJUSTING, RECOMMENDED}"
        side_effects:
          - "leaves recovered_cents at 0 and CoveredClaim.other_insurance_recoverable_cents unchanged"
      - from: PURSUING
        to: EXHAUSTED
        trigger: "PATCH /claims/{id}/other-insurance/{coverageId} with status EXHAUSTED"
        actor: CoverageAnalyst
        preconditions:
          - "status == PURSUING"
          - "recovered_cents <= stated_limit_cents, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets recovered_cents to the reported recovery"
          - "recomputes CoveredClaim.other_insurance_recoverable_cents, net_payable_cents, alt_net_payable_cents and cap_binding"
          - "increments CoveredClaim.version by 1"
      - from: PURSUING
        to: CARRIER_DENIED
        trigger: "PATCH /claims/{id}/other-insurance/{coverageId} with status CARRIER_DENIED"
        actor: CoverageAnalyst
        preconditions:
          - "status == PURSUING"
        side_effects:
          - "leaves recovered_cents at 0 but marks the layer resolved so approval is no longer blocked"
          - "recomputes CoveredClaim.other_insurance_recoverable_cents, net_payable_cents, alt_net_payable_cents and cap_binding"
          - "increments CoveredClaim.version by 1"

  - entity: VendorAssignment
    initial_state: ASSIGNED
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: ASSIGNED
        to: SUPERSEDED
        trigger: "system cascade from POST /claims/{id}/vendor-assignments creating a row with the same vendor_type"
        actor: system
        preconditions:
          - "status == ASSIGNED"
          - "a newer VendorAssignment with the same claim_id and vendor_type has just been created"
        side_effects:
          - "freezes fees_accrued_cents; no further invoices may be posted to this engagement"
      - from: ASSIGNED
        to: CLOSED
        trigger: "system cascade from a CoveredClaim transition into DENIED_NOT_COVERED, REFERRED_OUT or PAID"
        actor: system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "freezes fees_accrued_cents; Insolvency.administrative_expense_cents keeps the accrued total"

  - entity: UnearnedPremiumRefund
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: PARTIALLY_PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == PENDING"
          - "the waterfall allocated a positive amount strictly less than computed_refund_cents to this refund"
        side_effects:
          - "adds the allocated amount to paid_amount_cents"
          - "reduces Insolvency.pending_up_liability_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"
      - from: PENDING
        to: PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == PENDING"
          - "the waterfall allocated exactly computed_refund_cents to this refund"
        side_effects:
          - "sets paid_amount_cents = computed_refund_cents"
          - "reduces Insolvency.pending_up_liability_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system cascade from POST /insolvencies/{id}/distributions"
        actor: system
        preconditions:
          - "status == PARTIALLY_PAID"
          - "the waterfall allocated exactly computed_refund_cents - paid_amount_cents to this refund"
        side_effects:
          - "sets paid_amount_cents = computed_refund_cents"
          - "reduces Insolvency.pending_up_liability_cents by the allocated amount and adds it to Insolvency.estate_distributed_cents"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /assessments/{id}/certify"
        actor: AssessmentOfficer
        preconditions:
          - "status == DRAFT"
          - "Insolvency.status == TRIGGERED, else ERR_INSOLVENCY_NOT_TRIGGERED"
          - "at least one MemberInsurer row has account_status == ACTIVE, assessable_line == this row's assessable_line, base_year == this row's base_year and direct_written_premium_cents > 0, else ERR_PREMIUM_BASE_EMPTY"
        side_effects:
          - "runs member_assessment_allocation and creates one MemberAssessment per eligible member in billing_status INVOICED and recoupment_status NOT_STARTED"
          - "sets levied_amount_cents, member_count, shortfall_cents and certified_at_utc"
          - "adds shortfall_cents into Insolvency.assessment_shortfall_cents"
      - from: CERTIFIED
        to: SETTLED
        trigger: "system bubble-up when every MemberAssessment of this assessment reaches billing_status PAID"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "every MemberAssessment with this assessment_id has billing_status == PAID"
        side_effects:
          - "sets collected_amount_cents = levied_amount_cents"

  - entity: MemberAssessment
    initial_state: INVOICED
    terminal_states: [PAID]
    transitions:
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /member-assessments/{id}/payments with amount_cents below the outstanding balance"
        actor: MemberInsurerAgent
        preconditions:
          - "billing_status == INVOICED"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "paid_amount_cents + amount_cents < levied_amount_cents"
        side_effects:
          - "adds amount_cents to paid_amount_cents"
          - "recomputes Assessment.collected_amount_cents"
        note: "Billing dimension; the recoupment dimension is unaffected."
      - from: INVOICED
        to: PAID
        trigger: "POST /member-assessments/{id}/payments with amount_cents equal to the outstanding balance"
        actor: MemberInsurerAgent
        preconditions:
          - "billing_status == INVOICED"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "paid_amount_cents + amount_cents == levied_amount_cents, else ERR_OVERPAYMENT when it exceeds"
        side_effects:
          - "sets paid_amount_cents = levied_amount_cents"
          - "recomputes Assessment.collected_amount_cents and bubbles Assessment to SETTLED when every sibling is PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /member-assessments/{id}/payments with amount_cents equal to the outstanding balance"
        actor: MemberInsurerAgent
        preconditions:
          - "billing_status == PARTIALLY_PAID"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "paid_amount_cents + amount_cents == levied_amount_cents, else ERR_OVERPAYMENT when it exceeds"
        side_effects:
          - "sets paid_amount_cents = levied_amount_cents"
          - "recomputes Assessment.collected_amount_cents and bubbles Assessment to SETTLED when every sibling is PAID"
      - from: INVOICED
        to: DELINQUENT
        trigger: "system cascade from POST /_clock/set_current_utc advancing past Assessment.certified_at_utc + 30 days"
        actor: system
        preconditions:
          - "billing_status == INVOICED"
          - "the new logical clock instant is strictly after Assessment.certified_at_utc + 30 days"
        side_effects:
          - "sets billing_status to DELINQUENT, leaving recoupment_status untouched"
        note: "Rate-threshold trigger evaluated on every clock advance."
      - from: NOT_STARTED
        to: SURCHARGE_FILED
        trigger: "POST /member-assessments/{id}/surcharge-filings"
        actor: MemberInsurerAgent
        preconditions:
          - "recoupment_status == NOT_STARTED"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "the sum of surcharge_rate_bps already filed by this member across MemberAssessment rows with recoupment_status IN {SURCHARGE_FILED, RECOUPING} plus the requested rate is <= 300, else ERR_SURCHARGE_AGGREGATE_EXCEEDED"
        side_effects:
          - "sets surcharge_rate_bps and surcharge_base_cents from the filing"
          - "runs recoupment_surcharge_projection and writes projected_recoupment_cents"
        note: "Recoupment dimension; the billing dimension is unaffected."
      - from: SURCHARGE_FILED
        to: RECOUPING
        trigger: "POST /member-assessments/{id}/recoupment-remittances with proceeds below levied_amount_cents"
        actor: MemberInsurerAgent
        preconditions:
          - "recoupment_status == SURCHARGE_FILED, else ERR_RECOUPMENT_NOT_FILED"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "recouped_amount_cents + proceeds_cents < levied_amount_cents"
        side_effects:
          - "adds proceeds_cents to recouped_amount_cents"
      - from: RECOUPING
        to: RECOUPED
        trigger: "POST /member-assessments/{id}/recoupment-remittances reaching levied_amount_cents"
        actor: MemberInsurerAgent
        preconditions:
          - "recoupment_status == RECOUPING"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "recouped_amount_cents + proceeds_cents >= levied_amount_cents, and the sum must not exceed levied_amount_cents, else ERR_OVER_RECOUPMENT"
        side_effects:
          - "sets recouped_amount_cents = levied_amount_cents"
        note: "Boundary: the transition fires at exactly levied_amount_cents (>=), and one cent more is ERR_OVER_RECOUPMENT."
      - from: SURCHARGE_FILED
        to: RECOUPED
        trigger: "POST /member-assessments/{id}/recoupment-remittances reaching levied_amount_cents in one remittance"
        actor: MemberInsurerAgent
        preconditions:
          - "recoupment_status == SURCHARGE_FILED"
          - "the acting X-User-ID equals member_insurer_id, else ERR_NOT_ASSESSED_MEMBER"
          - "recouped_amount_cents + proceeds_cents == levied_amount_cents"
        side_effects:
          - "sets recouped_amount_cents = levied_amount_cents"
    note: "Parallel dimensions on one entity: billing_status moves over {INVOICED, PARTIALLY_PAID, PAID, DELINQUENT} and recoupment_status over {NOT_STARTED, SURCHARGE_FILED, RECOUPING, RECOUPED} independently; initial_state INVOICED and terminal_state PAID describe the billing dimension, whose terminal state does not lock the recoupment dimension."

concurrency_rules:
  - rule_id: oic-create-stale-claim
    parent_entity: CoveredClaim
    write_endpoint: "POST /claims/{id}/other-insurance"
    occ_field: "expected_claim_version"
    description: |
      Adding an other-insurance layer to a CoveredClaim whose version has advanced since the
      client last observed it is rejected. Registering a new layer legitimately supersedes the
      claim's previously computed net_payable_cents, so a writer holding a stale view of the
      claim would post an offset against a payable that no longer exists.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: up-refund-create-stale-policy
    parent_entity: TransferredPolicy
    write_endpoint: "POST /policies/{id}/premium-refunds"
    occ_field: "expected_policy_version"
    description: |
      Filing an unearned premium refund against a TransferredPolicy whose version has advanced
      since the client last observed it is rejected. The refund is computed from the policy's
      cancellation_date, unexpired_days and annual_premium_cents, so a writer holding a stale
      view of the policy would elect a variant against superseded cancellation data.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: distribution-stale-insolvency
    parent_entity: Insolvency
    write_endpoint: "POST /insolvencies/{id}/distributions"
    occ_field: "expected_insolvency_version"
    description: |
      Executing a distribution run against an Insolvency whose version has advanced since the
      client last observed it is rejected. A distribution run legitimately supersedes the estate
      ledger, so a writer holding a stale view of estate_undistributed_cents would allocate cash
      that an earlier run has already committed.
    error_id: ERR_STALE_INSOLVENCY_VERSION
    http_status: 412

calculations:
  - name: claim_net_payable
    trigger: "on CoveredClaim RECEIVED_to_SCREENED_ELIGIBLE, on every OtherInsuranceCoverage PURSUING_to_EXHAUSTED or PURSUING_to_CARRIER_DENIED, and again on CoveredClaim RECOMMENDED_to_APPROVED"
    algorithm: threshold
    formula: |
      profile      = CoverageProfile row whose line_of_business == TransferredPolicy.line_of_business
      covered_basis_cents  = gross_loss_cents + (punitive_damages_cents if profile.covers_punitive_damages else 0)
      attachment_point_cents = min(TransferredPolicy.large_deductible_cents + TransferredPolicy.self_insured_retention_cents,
                                   TransferredPolicy.collateral_held_cents)
      covered_layer_cents  = max(0, covered_basis_cents - attachment_point_cents)
      other        = other_insurance_recoverable_cents
      ded          = profile.statutory_deductible_cents
      cap          = profile.per_claim_cap_cents
      if profile.cap_order_mode == "OFFSET_THEN_CAP":
          statutory = max(0, min(covered_layer_cents - other - ded, cap))
          alternate = max(0, min(covered_layer_cents, cap) - other - ded)
      else:                       # CAP_THEN_OFFSET
          statutory = max(0, min(covered_layer_cents, cap) - other - ded)
          alternate = max(0, min(covered_layer_cents - other - ded, cap))
      remaining_aggregate = max(0, profile.per_policy_aggregate_cap_cents - TransferredPolicy.aggregate_paid_cents)
      net_payable_cents   = min(statutory, remaining_aggregate)
      alt_net_payable_cents = alternate
      uncapped            = max(0, covered_layer_cents - other - ded)
      cap_binding = "PER_POLICY_AGGREGATE" if net_payable_cents < statutory
                    else ("PER_CLAIM" if uncapped > cap else "NONE")
    input_set: |
      other_insurance_recoverable_cents sums recovered_cents over OtherInsuranceCoverage rows with claim_id == this claim
      and status IN {EXHAUSTED, CARRIER_DENIED}; rows in UNEXHAUSTED or PURSUING contribute 0.
      TransferredPolicy.aggregate_paid_cents sums net_payable_cents over sibling CoveredClaim rows on the same policy_id
      whose status IN {APPROVED, PARTIALLY_PAID, PAID}, excluding this claim.
    constants:
      SELF_FUNDED_RETENTION_CREDIT_RULE: "the retained layer is credited only up to the collateral actually held by the receiver"
    precision: "integer cents, no rounding step (all inputs are integer cents)"
    variants:
      - name: statutory_offset_then_cap
        when: "the governing CoverageProfile has cap_order_mode == OFFSET_THEN_CAP"
        difference: "the statutory deductible and other-insurance recovery are subtracted from the covered layer BEFORE the per-claim cap is applied, so the association can still pay the full cap on a large loss"
      - name: alternate_cap_then_offset
        when: "the governing CoverageProfile has cap_order_mode == CAP_THEN_OFFSET"
        difference: "the covered layer is first truncated to the per-claim cap and the deductible and other-insurance recovery are subtracted afterwards, producing a strictly lower payable whenever the uncapped layer exceeds the cap"

  - name: unearned_premium_refund
    trigger: "on POST /policies/{id}/premium-refunds"
    algorithm: chronological
    formula: |
      term_days     = whole days from TransferredPolicy.effective_date to TransferredPolicy.expiration_date
      unexpired_days = TransferredPolicy.unexpired_days
      pro_rata_raw  = round_half_up(annual_premium_cents * unexpired_days / term_days)
      short_rate_raw = round_half_up(annual_premium_cents * unexpired_days / term_days * SHORT_RATE_FACTOR)
      elected_raw   = pro_rata_raw if refund_method == "PRO_RATA" else short_rate_raw
      other_raw     = short_rate_raw if refund_method == "PRO_RATA" else pro_rata_raw
      cap           = CoverageProfile[TransferredPolicy.line_of_business].unearned_premium_cap_cents
      computed_refund_cents = min(elected_raw, cap)
      alt_refund_cents      = min(other_raw, cap)
      capped        = elected_raw > cap
      priority_class = CoverageProfile[TransferredPolicy.line_of_business].refund_priority_class
    input_set: "one refund per TransferredPolicy whose status == CANCELLED_BY_ORDER and up_refund_filed == false; policies in IMPORTED or EXPIRED_BEFORE_ORDER are ineligible"
    constants:
      SHORT_RATE_FACTOR: 0.90
    precision: "round_half_up to integer cents, applied exactly once at the end of each raw variant; the SHORT_RATE_FACTOR multiplication happens before that single rounding"
    variants:
      - name: pro_rata
        when: "refund_method == PRO_RATA (policy cancelled by operation of the liquidation order)"
        difference: "refunds the full unexpired fraction of the written premium"
      - name: short_rate
        when: "refund_method == SHORT_RATE (policyholder-initiated cancellation recorded before the order)"
        difference: "retains a 10 percent penalty of the unexpired fraction, so the refund is SHORT_RATE_FACTOR times the pro-rata figure before the cap"

  - name: distribution_waterfall
    trigger: "on POST /insolvencies/{id}/distributions"
    algorithm: waterfall_allocation
    formula: |
      available = distribution_amount_cents            # validated <= estate_undistributed_cents
      # class 1 - association administrative expense
      class1_outstanding = administrative_expense_cents - administrative_paid_cents
      class1_paid = min(available, class1_outstanding); available -= class1_paid
      # class 2 - covered claim payments, ordered created_at ASC then sequence ASC
      class2_items = CoveredClaim rows of this insolvency with status IN {APPROVED, PARTIALLY_PAID},
                     outstanding_i = net_payable_cents - paid_amount_cents, ordered by created_at ASC then sequence ASC
      available = allocate(available, class2_items)
      # class 3 - unearned premium refunds, ordered priority_class ASC then created_at ASC then sequence ASC
      class3_items = UnearnedPremiumRefund rows on policies of this insolvency with status IN {PENDING, PARTIALLY_PAID},
                     outstanding_i = computed_refund_cents - paid_amount_cents,
                     ordered by priority_class ASC then created_at ASC then sequence ASC
      available = allocate(available, class3_items)
      # allocate(): full payment when funds suffice, otherwise pro-rata with deterministic remainder cents
      def allocate(funds, items):
          total = sum(outstanding_i)
          if funds >= total: pay each item its outstanding_i in full; return funds - total
          for each item: share_i = floor(funds * outstanding_i / total)
          remainder = funds - sum(share_i)
          walk items in the class ordering and add one cent to each until remainder is 0
          pay each item its share_i; return 0
      estate_distributed_cents += (class1_paid + everything paid in class 2 and class 3)
      estate_undistributed_cents = estate_remitted_cents - estate_distributed_cents - estate_returned_cents
      distribution_sequence += 1
    input_set: "class 2 includes only CoveredClaim rows in APPROVED or PARTIALLY_PAID (RECOMMENDED, REFERRED_OUT and DENIED_NOT_COVERED rows are excluded); class 3 includes only UnearnedPremiumRefund rows in PENDING or PARTIALLY_PAID"
    constants:
      CLASS_ORDER: "1 = administrative expense, 2 = covered claims, 3 = unearned premium refunds"
    precision: "integer cents; pro-rata shares are floored and the residual cents are handed out one per item in the class ordering"
    variants:
      - name: full_satisfaction
        when: "the funds reaching a class are greater than or equal to that class's total outstanding"
        difference: "every item in the class is paid in full and the surplus flows to the next class; no rounding step occurs"
      - name: pro_rata_insufficient
        when: "the funds reaching a class are less than that class's total outstanding"
        difference: "each item receives floor(funds * outstanding_i / total) plus at most one residual cent assigned in class order, and later classes receive nothing"

  - name: member_assessment_allocation
    trigger: "on Assessment DRAFT_to_CERTIFIED"
    algorithm: constraint_propagation
    formula: |
      pool = eligible members (see input_set)
      for m in pool: cap_m = round_half_up(m.direct_written_premium_cents * m.annual_cap_rate_bps / 10000)
      need = Assessment.needed_amount_cents
      allocated = {}
      for round in 1..MAX_REDISTRIBUTION_ROUNDS:
          if pool is empty: break
          total_base = sum(m.direct_written_premium_cents for m in pool)
          if total_base == 0: break
          for m in pool: raw_m = floor(need * m.direct_written_premium_cents / total_base)
          remainder = need - sum(raw_m)
          walk pool ordered by created_at ASC then sequence ASC, adding one cent to raw_m until remainder is 0
          newly_capped = [m in pool where raw_m > cap_m]
          if newly_capped is empty:
              for m in pool: allocated[m] = raw_m
              pool = []
              break
          for m in newly_capped ordered by created_at ASC then sequence ASC:
              allocated[m] = cap_m; need -= cap_m; remove m from pool
      for m still in pool: allocated[m] = min(raw_m, cap_m)
      MemberAssessment.levied_amount_cents = allocated[m]
      MemberAssessment.cap_amount_cents = cap_m
      MemberAssessment.capped = (allocated[m] == cap_m and raw_m > cap_m)
      Assessment.levied_amount_cents = sum(allocated)
      Assessment.shortfall_cents = Assessment.needed_amount_cents - Assessment.levied_amount_cents
      Assessment.member_count = count(allocated)
    input_set: "MemberInsurer rows with account_status == ACTIVE, assessable_line == Assessment.assessable_line, base_year == Assessment.base_year and direct_written_premium_cents > 0; IMPAIRED and WITHDRAWN members are excluded from the pool and receive no MemberAssessment row"
    constants:
      MAX_REDISTRIBUTION_ROUNDS: 3
      DEFAULT_ANNUAL_CAP_RATE_BPS: 200
    precision: "integer cents; per-member caps use round_half_up, raw shares are floored and residual cents are handed out one per member in created_at ASC then sequence ASC order"
    variants:
      - name: uncapped_single_round
        when: "no member's raw share exceeds its cap_amount_cents in round 1"
        difference: "the levy closes in one round at exactly needed_amount_cents with shortfall_cents == 0"
      - name: capped_with_redistribution
        when: "at least one member's raw share exceeds its cap_amount_cents"
        difference: "capped members are fixed at their cap and the residual need is re-spread over the remaining premium base in a further round, so uncapped members carry a strictly larger share than their first-round raw figure; if every member caps, the levy stops short and the gap lands in shortfall_cents"

  - name: recoupment_surcharge_projection
    trigger: "on MemberAssessment NOT_STARTED_to_SURCHARGE_FILED"
    algorithm: threshold
    formula: |
      projected_recoupment_cents = min(round_half_up(surcharge_base_cents * surcharge_rate_bps / 10000),
                                       levied_amount_cents)
    input_set: "the single MemberAssessment row being filed on; surcharge_base_cents and surcharge_rate_bps come from the filing payload"
    constants:
      MAX_AGGREGATE_SURCHARGE_BPS: 300
    precision: "round_half_up to integer cents before the levied_amount_cents ceiling is applied"

  - name: insolvency_ledger_recompute
    trigger: "on every write that changes a CoveredClaim, UnearnedPremiumRefund, VendorAssignment, Assessment or estate cash position of the insolvency"
    algorithm: aggregation
    formula: |
      administrative_expense_cents = sum(VendorAssignment.fees_accrued_cents) over assignments whose claim_id
                                     belongs to this insolvency, all statuses included
      reserved_claim_cents  = sum(net_payable_cents - paid_amount_cents) over CoveredClaim rows of this insolvency
                              whose status IN {APPROVED, PARTIALLY_PAID}
      pending_up_liability_cents = sum(computed_refund_cents - paid_amount_cents) over UnearnedPremiumRefund rows
                              on policies of this insolvency whose status IN {PENDING, PARTIALLY_PAID}
      referral_pending_count = count(CoveredClaim rows of this insolvency with status == REFERRAL_PENDING)
      assessment_shortfall_cents = sum(Assessment.shortfall_cents) over assessments of this insolvency
                              whose status IN {CERTIFIED, SETTLED}
      policy_count = count(TransferredPolicy rows with insolvency_id == this id, all statuses included)
      estate_undistributed_cents = estate_remitted_cents - estate_distributed_cents - estate_returned_cents
    input_set: "explicit status filters as written above; DENIED_NOT_COVERED and REFERRED_OUT claims never enter reserved_claim_cents, and DRAFT assessments never enter assessment_shortfall_cents"
    constants:
      LEDGER_IDENTITY: "estate_remitted_cents == estate_distributed_cents + estate_undistributed_cents + estate_returned_cents"
    precision: "integer cents, full recompute on every mutation (no incremental drift)"

  - name: vendor_fee_accrual
    trigger: "on POST /claims/{id}/vendor-assignments/{assignmentId}/invoices"
    algorithm: aggregation
    formula: |
      invoice_fee_cents = round_half_up(hours * VendorAssignment.hourly_rate_cents)
      VendorAssignment.hours_logged += hours
      VendorAssignment.fees_accrued_cents += invoice_fee_cents
      Insolvency.administrative_expense_cents = recomputed by insolvency_ledger_recompute
    input_set: "only VendorAssignment rows with status == ASSIGNED accept invoices; SUPERSEDED and CLOSED engagements reject them"
    constants:
      FEE_ROUNDING: round_half_up
    precision: "round_half_up to integer cents per invoice; accrued fees are class 1 in the waterfall and never reduce CoveredClaim.net_payable_cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for ClaimsAdjuster and DefenseCounsel the acting X-User-ID equals the id of a VendorAssignment on the target claim whose status == ASSIGNED and vendor_type matches the role"
    error_id: ERR_NOT_ASSIGNED_ADJUSTER
    http_status: 403
    applies_to: "POST /claims/{id}/recommend, POST /claims/{id}/vendor-assignments/{assignmentId}/invoices"
  - priority: 4
    category: auth
    check: "for MemberInsurerAgent the acting X-User-ID equals the target MemberAssessment.member_insurer_id"
    error_id: ERR_NOT_ASSESSED_MEMBER
    http_status: 403
    applies_to: "POST /member-assessments/{id}/payments, POST /member-assessments/{id}/surcharge-filings, POST /member-assessments/{id}/recoupment-remittances"
  - priority: 5
    category: auth
    check: "the acting X-User-ID differs from CoveredClaim.screened_by_user_id (segregation of duties between coverage screening and committee approval)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /claims/{id}/approve"
  - priority: 6
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_INSOLVENCY_NOT_FOUND
    http_status: 404
    applies_to: "all /insolvencies/{id} paths"
  - priority: 7
    category: existence
    check: "the first path id resolves to an existing row of its collection, evaluated left to right after the insolvency rows"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all /claims/{id} paths"
  - priority: 8
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "all /policies/{id} paths"
  - priority: 9
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "all /poc-transfers/{id} paths"
  - priority: 10
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /assessments/{id} paths"
  - priority: 11
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_MEMBER_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /member-assessments/{id} paths"
  - priority: 11.5
    category: existence
    check: "the first path id resolves to an existing row of its collection"
    error_id: ERR_MEMBER_INSURER_NOT_FOUND
    http_status: 404
    applies_to: "GET /member-insurers/{id}, PATCH /member-insurers/{id}"
  - priority: 12
    category: existence
    check: "the nested child id resolves to a row whose parent foreign key equals the first path id"
    error_id: ERR_CHILD_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "PATCH /claims/{id}/other-insurance/{coverageId}, POST /claims/{id}/vendor-assignments/{assignmentId}/invoices, POST /claims/{id}/referrals/{referralId}/respond"
  - priority: 13
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_REFERENCED_ROW_NOT_FOUND
    http_status: 404
    applies_to: "POST /policies, POST /claims, POST /assessments, POST /insolvencies/{id}/poc-transfers"
  - priority: 14
    category: business_constraint
    check: "the request body carries every required field with the declared type, enum membership and numeric range, and no unknown field is accepted"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 15
    category: state
    check: "expected_claim_version equals CoveredClaim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/other-insurance"
  - priority: 16
    category: state
    check: "expected_policy_version equals TransferredPolicy.version"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /policies/{id}/premium-refunds"
  - priority: 17
    category: state
    check: "expected_insolvency_version equals Insolvency.version"
    error_id: ERR_STALE_INSOLVENCY_VERSION
    http_status: 412
    applies_to: "POST /insolvencies/{id}/distributions"
  - priority: 17.5
    category: business_constraint
    check: "no SisterAssociationReferral on the claim has status == OPEN; this outranks the claim-state check so a claim already parked with a sister association reports the open referral rather than its parked status"
    error_id: ERR_REFERRAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /claims/{id}/referrals"
  - priority: 18
    category: state
    check: "the target CoveredClaim.status is a declared from-state of the requested transition; the three engagement and other-insurance writes (POST /claims/{id}/vendor-assignments, POST /claims/{id}/other-insurance, PATCH /claims/{id}/other-insurance/{coverageId}) instead require status IN {SCREENED_ELIGIBLE, ADJUSTING, RECOMMENDED}, and only a claim in SCREENED_ELIGIBLE is moved on to ADJUSTING by an ADJUSTER engagement"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /claims/{id}/screen, POST /claims/{id}/vendor-assignments, POST /claims/{id}/recommend, POST /claims/{id}/approve, POST /claims/{id}/referrals, POST /claims/{id}/other-insurance, PATCH /claims/{id}/other-insurance/{coverageId}"
  - priority: 19
    category: state
    check: "the remand is refused once the claim has already been remanded twice"
    error_id: ERR_REMAND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /claims/{id}/remand"
  - priority: 20
    category: state
    check: "the target ProofOfClaimTransfer.status == RECEIVED"
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    applies_to: "POST /poc-transfers/{id}/convert"
  - priority: 21
    category: state
    check: "the target Assessment.status == DRAFT"
    error_id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /assessments/{id}/certify"
  - priority: 22
    category: state
    check: "the target MemberAssessment is in a declared from-state of the requested dimension transition (billing_status for payments, recoupment_status for surcharge filings)"
    error_id: ERR_MEMBER_ASSESSMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /member-assessments/{id}/payments, POST /member-assessments/{id}/surcharge-filings"
  - priority: 23
    category: state
    check: "the target SisterAssociationReferral.status == OPEN"
    error_id: ERR_REFERRAL_ALREADY_ANSWERED
    http_status: 409
    applies_to: "POST /claims/{id}/referrals/{referralId}/respond"
  - priority: 24
    category: state
    check: "the governing Insolvency.status == TRIGGERED"
    error_id: ERR_INSOLVENCY_NOT_TRIGGERED
    http_status: 409
    applies_to: "POST /claims, POST /policies/{id}/premium-refunds, POST /insolvencies/{id}/estate-remittances, POST /insolvencies/{id}/distributions, POST /assessments/{id}/certify, POST /insolvencies/{id}/close"
  - priority: 25
    category: state
    check: "the governing Insolvency.status != CLOSED"
    error_id: ERR_INSOLVENCY_CLOSED
    http_status: 409
    applies_to: "POST /policies, POST /insolvencies/{id}/poc-transfers, POST /poc-transfers/{id}/convert, POST /insolvencies/{id}/trigger, POST /assessments"
  - priority: 25.5
    category: state
    check: "the triggering event runs once - POST /insolvencies/{id}/trigger requires Insolvency.status == DECLARED"
    error_id: ERR_INSOLVENCY_ALREADY_TRIGGERED
    http_status: 409
    applies_to: "POST /insolvencies/{id}/trigger"
  - priority: 26
    category: state
    check: "the CoveredClaim's TransferredPolicy.status == CANCELLED_BY_ORDER"
    error_id: ERR_POLICY_NOT_CANCELLED
    http_status: 409
    applies_to: "POST /claims/{id}/screen, POST /policies/{id}/premium-refunds"
  - priority: 27
    category: business_temporal
    check: "the logical clock instant of the request is at or before Insolvency.proof_of_claim_deadline_utc (inclusive boundary)"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /claims, POST /policies/{id}/premium-refunds"
  - priority: 28
    category: business_safety
    check: "TransferredPolicy.policyholder_net_worth_cents is strictly below the line's net_worth_exclusion_threshold_cents"
    error_id: ERR_NET_WORTH_EXCLUSION
    http_status: 422
    applies_to: "POST /claims/{id}/screen"
  - priority: 29
    category: business_constraint
    check: "a CoverageProfile row exists for every line_of_business the operation must price"
    error_id: ERR_COVERAGE_PROFILE_MISSING
    http_status: 422
    applies_to: "POST /insolvencies/{id}/trigger, POST /claims/{id}/screen, POST /policies/{id}/premium-refunds"
  - priority: 30
    category: business_constraint
    check: "claim_number is unique within the target policy_id"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /claims"
  - priority: 31
    category: business_constraint
    check: "TransferredPolicy.up_refund_filed == false"
    error_id: ERR_UP_REFUND_ALREADY_FILED
    http_status: 409
    applies_to: "POST /policies/{id}/premium-refunds"
  - priority: 32
    category: business_constraint
    check: "the triple (naic_code, assessable_line, base_year) is not already registered"
    error_id: ERR_MEMBER_DUPLICATE_LINE
    http_status: 409
    applies_to: "POST /member-insurers"
  - priority: 33
    category: business_constraint
    check: "the new policy term [effective_date, expiration_date) does not intersect the term of another TransferredPolicy of the same insolvency with the same policy_number; adjacent terms that merely touch at a boundary are allowed"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /policies"
  - priority: 34
    category: business_constraint
    check: "the new engagement's closed interval [engagement_start, engagement_end] does not intersect the closed interval of another VendorAssignment on the same claim with the same vendor_type and status == ASSIGNED; touching endpoints collide"
    error_id: ERR_ADJUSTER_ENGAGEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /claims/{id}/vendor-assignments"
  - priority: 35
    category: business_constraint
    check: "the referral's basis resolves to a state code equal to target_state_code"
    error_id: ERR_REFERRAL_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /claims/{id}/referrals"
  - priority: 37
    category: business_constraint
    check: "the member's already filed surcharge rates across MemberAssessment rows with recoupment_status IN {SURCHARGE_FILED, RECOUPING} plus the requested surcharge_rate_bps stays at or below MAX_AGGREGATE_SURCHARGE_BPS"
    error_id: ERR_SURCHARGE_AGGREGATE_EXCEEDED
    http_status: 422
    applies_to: "POST /member-assessments/{id}/surcharge-filings"
  - priority: 38
    category: business_referential
    check: "every OtherInsuranceCoverage row of the claim has status IN {EXHAUSTED, CARRIER_DENIED} (non-duplication - the association pays only after other insurance resolves)"
    error_id: ERR_OTHER_INSURANCE_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /claims/{id}/approve"
  - priority: 39
    category: business_referential
    check: "recoupment_status IN {SURCHARGE_FILED, RECOUPING} before surcharge proceeds may be remitted"
    error_id: ERR_RECOUPMENT_NOT_FILED
    http_status: 409
    applies_to: "POST /member-assessments/{id}/recoupment-remittances"
  - priority: 40
    category: business_referential
    check: "no CoveredClaim of the insolvency has status IN {RECEIVED, SCREENED_ELIGIBLE, ADJUSTING, RECOMMENDED, REFERRAL_PENDING, APPROVED, PARTIALLY_PAID}"
    error_id: ERR_CLAIMS_OUTSTANDING
    http_status: 409
    applies_to: "POST /insolvencies/{id}/close"
  - priority: 41
    category: business_referential
    check: "no UnearnedPremiumRefund on a policy of the insolvency has status IN {PENDING, PARTIALLY_PAID}"
    error_id: ERR_REFUNDS_OUTSTANDING
    http_status: 409
    applies_to: "POST /insolvencies/{id}/close"
  - priority: 42
    category: business_fiscal
    check: "recommended_amount_cents is at or below the acting VendorAssignment.settlement_authority_cents"
    error_id: ERR_ADJUSTER_AUTHORITY_EXCEEDED
    http_status: 422
    applies_to: "POST /claims/{id}/recommend"
  - priority: 43
    category: business_fiscal
    check: "the amount tendered does not exceed the outstanding balance - recommended_amount_cents at or below net_payable_cents on a recommendation, amount_cents at or below levied_amount_cents - paid_amount_cents on a member payment"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /claims/{id}/recommend, POST /member-assessments/{id}/payments"
  - priority: 44
    category: business_fiscal
    check: "the claim's stored net_payable_cents is at or below max(0, per_policy_aggregate_cap_cents - TransferredPolicy.aggregate_paid_cents); the check reads the value stored at screening time and runs before the approval recompute, so a sibling approval that consumed the policy aggregate in the meantime blocks this approval"
    error_id: ERR_AGGREGATE_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /claims/{id}/approve"
  - priority: 45
    category: business_fiscal
    check: "recouped_amount_cents + proceeds_cents does not exceed levied_amount_cents"
    error_id: ERR_OVER_RECOUPMENT
    http_status: 422
    applies_to: "POST /member-assessments/{id}/recoupment-remittances"
  - priority: 46
    category: business_fiscal
    check: "at least one MemberInsurer row satisfies the assessment's eligibility filter with direct_written_premium_cents > 0"
    error_id: ERR_PREMIUM_BASE_EMPTY
    http_status: 422
    applies_to: "POST /assessments/{id}/certify"
  - priority: 47
    category: business_fiscal
    check: "distribution_amount_cents is at or below Insolvency.estate_undistributed_cents"
    error_id: ERR_INSUFFICIENT_ESTATE_FUNDS
    http_status: 422
    applies_to: "POST /insolvencies/{id}/distributions"

endpoints:
  - method: POST
    path: "/coverage-profiles"
    description: "Register the statutory coverage configuration for one line of business, including caps, the statutory deductible and the cap_order_mode flag."
    roles: [AssociationAdmin]
    code: 201
    input: [line_of_business, per_claim_cap_cents, per_policy_aggregate_cap_cents, unearned_premium_cap_cents, refund_priority_class, "statutory_deductible_cents?", "net_worth_exclusion_threshold_cents?", "covers_punitive_damages?", "cap_order_mode?"]
    output: CoverageProfile
    side_effects: ["creates the configuration row; no lifecycle fields (common_fields false, id and created_at only)"]

  - method: GET
    path: "/coverage-profiles"
    description: "List coverage configuration rows, optionally filtered by line of business."
    roles: [AssociationAdmin, CoverageAnalyst, ClaimsCommitteeOfficer, AssessmentOfficer]
    code: 200
    input: ["line_of_business?", "limit?", "offset?"]
    output: CoverageProfile[]
    side_effects: []

  - method: POST
    path: "/insolvencies"
    description: "Open an insolvency file on an insurer placed in liquidation; the file starts in DECLARED with a zeroed estate ledger."
    roles: [AssociationAdmin]
    code: 201
    input: [insurer_name, naic_code, domiciliary_state_code, liquidation_order_date]
    output: Insolvency
    side_effects: ["creates the Insolvency in DECLARED with every estate ledger field at 0 and distribution_sequence 0"]

  - method: GET
    path: "/insolvencies/{id}"
    description: "Read one insolvency file including the estate ledger and the derived reserve, refund-liability, referral and shortfall counters."
    roles: [AssociationAdmin, ReceiverLiaison, CoverageAnalyst, ClaimsCommitteeOfficer, AssessmentOfficer]
    code: 200
    input: []
    output: Insolvency
    side_effects: []

  - method: POST
    path: "/insolvencies/{id}/trigger"
    description: "Record the triggering event on the liquidation order: computes the coverage termination date and the proof-of-claim deadline and cancels or expires every imported policy."
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Insolvency
    side_effects:
      - "moves Insolvency DECLARED -> TRIGGERED and stamps triggered_at_utc from the logical clock"
      - "computes coverage_termination_date and proof_of_claim_deadline_utc"
      - "cascades every IMPORTED TransferredPolicy to CANCELLED_BY_ORDER or EXPIRED_BEFORE_ORDER and writes cancellation_date and unexpired_days"
      - "recomputes policy_count via insolvency_ledger_recompute"
      - "increments Insolvency.version by 1"

  - method: POST
    path: "/insolvencies/{id}/estate-remittances"
    description: "Record cash remitted to the association by the receiver (early access or dividend) against the estate ledger."
    roles: [ReceiverLiaison]
    code: 200
    input: [amount_cents, remittance_ref]
    output: Insolvency
    side_effects:
      - "adds amount_cents to estate_remitted_cents"
      - "recomputes estate_undistributed_cents via insolvency_ledger_recompute"
      - "increments Insolvency.version by 1"

  - method: POST
    path: "/insolvencies/{id}/distributions"
    description: "Execute one distribution run over the undistributed estate cash using distribution_waterfall: class 1 administrative expense, class 2 covered claims, class 3 unearned premium refunds."
    roles: [AssociationAdmin]
    code: 200
    input: [distribution_amount_cents, expected_insolvency_version]
    output: "{ distribution_sequence: integer, class1_paid_cents: integer, class2_paid_cents: integer, class3_paid_cents: integer, claim_payments: object[], refund_payments: object[], estate_distributed_cents: integer, estate_undistributed_cents: integer }"
    side_effects:
      - "runs distribution_waterfall and pays class 1, then class 2, then class 3"
      - "cascades CoveredClaim APPROVED -> PARTIALLY_PAID or PAID and PARTIALLY_PAID -> PAID"
      - "cascades UnearnedPremiumRefund PENDING -> PARTIALLY_PAID or PAID and PARTIALLY_PAID -> PAID"
      - "updates administrative_paid_cents, estate_distributed_cents, estate_undistributed_cents, reserved_claim_cents and pending_up_liability_cents"
      - "increments distribution_sequence by 1"
      - "increments Insolvency.version by 1"

  - method: POST
    path: "/insolvencies/{id}/close"
    description: "Close the insolvency file and return the undistributed estate balance to the receiver."
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Insolvency
    side_effects:
      - "moves Insolvency TRIGGERED -> CLOSED"
      - "moves estate_undistributed_cents into estate_returned_cents and zeroes estate_undistributed_cents"
      - "increments Insolvency.version by 1"

  - method: POST
    path: "/insolvencies/{id}/poc-transfers"
    description: "Accept a proof-of-claim extract batch delivered by the receiver; the raw records are stored unconverted."
    roles: [ReceiverLiaison]
    code: 201
    input: [receiver_batch_ref, records]
    output: ProofOfClaimTransfer
    side_effects: ["creates the batch in RECEIVED and sets record_count from the records array length"]

  - method: GET
    path: "/insolvencies/{id}/poc-transfers"
    description: "List the proof-of-claim batches delivered for one insolvency."
    roles: [AssociationAdmin, ReceiverLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProofOfClaimTransfer[]
    side_effects: []

  - method: GET
    path: "/insolvencies/{id}/assessments"
    description: "List the assessments drafted or certified against one insolvency."
    roles: [AssociationAdmin, AssessmentOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: POST
    path: "/poc-transfers/{id}/convert"
    description: "Run the proof-of-claim data conversion pass, materialising TransferredPolicy and CoveredClaim rows from the batch records and recording per-record rejections."
    roles: [ReceiverLiaison]
    code: 200
    input: []
    output: ProofOfClaimTransfer
    side_effects:
      - "moves ProofOfClaimTransfer RECEIVED -> CONVERTED, PARTIALLY_CONVERTED or REJECTED"
      - "creates TransferredPolicy rows (source_transfer_id set) for passing POLICY records"
      - "creates CoveredClaim rows (source_transfer_id set) for passing CLAIM records"
      - "sets converted_count, rejected_count and rejection_reasons"
      - "recomputes Insolvency.policy_count"

  - method: GET
    path: "/poc-transfers/{id}"
    description: "Read one proof-of-claim batch including conversion counters and per-record rejection reasons."
    roles: [AssociationAdmin, ReceiverLiaison]
    code: 200
    input: []
    output: ProofOfClaimTransfer
    side_effects: []

  - method: POST
    path: "/member-insurers"
    description: "Register a solvent member insurer's premium base for one assessable line and base year."
    roles: [AssociationAdmin]
    code: 201
    input: [naic_code, insurer_name, assessable_line, base_year, direct_written_premium_cents, "annual_cap_rate_bps?"]
    output: MemberInsurer
    side_effects: ["creates the member row in ACTIVE and assigns the next sequence value"]

  - method: PATCH
    path: "/member-insurers/{id}"
    description: "Update a member insurer's premium base, regulator-reduced annual cap rate, or membership posture."
    roles: [AssociationAdmin]
    code: 200
    input: ["direct_written_premium_cents?", "annual_cap_rate_bps?", "account_status?"]
    output: MemberInsurer
    side_effects: ["writes the supplied fields and increments MemberInsurer.version by 1"]

  - method: GET
    path: "/member-insurers/{id}"
    description: "Read one member insurer's premium base, cap rate and membership posture."
    roles: [AssociationAdmin, AssessmentOfficer, MemberInsurerAgent]
    code: 200
    input: []
    output: MemberInsurer
    side_effects: []

  - method: POST
    path: "/policies"
    description: "Key in a transferred policy directly (outside a proof-of-claim batch), including large deductible, self-insured retention and collateral data."
    roles: [ReceiverLiaison, AssociationAdmin]
    code: 201
    input: [insolvency_id, policy_number, line_of_business, policyholder_name, policyholder_state_code, effective_date, expiration_date, annual_premium_cents, "policyholder_net_worth_cents?", "large_deductible_cents?", "self_insured_retention_cents?", "collateral_held_cents?"]
    output: TransferredPolicy
    side_effects: ["creates the policy in IMPORTED with source_transfer_id null", "recomputes Insolvency.policy_count"]

  - method: GET
    path: "/policies"
    description: "List transferred policies filtered by insolvency, originating proof-of-claim batch, status or line of business."
    roles: [AssociationAdmin, ReceiverLiaison, CoverageAnalyst]
    code: 200
    input: ["insolvency_id?", "source_transfer_id?", "status?", "line_of_business?", "limit?", "offset?"]
    output: TransferredPolicy[]
    side_effects: []

  - method: GET
    path: "/policies/{id}"
    description: "Read one transferred policy including cancellation_date, unexpired_days and aggregate_paid_cents."
    roles: [AssociationAdmin, ReceiverLiaison, CoverageAnalyst, ClaimsCommitteeOfficer]
    code: 200
    input: []
    output: TransferredPolicy
    side_effects: []

  - method: POST
    path: "/policies/{id}/premium-refunds"
    description: "File the unearned premium refund on a policy cancelled by the liquidation order, electing the pro-rata or short-rate variant."
    roles: [CoverageAnalyst]
    code: 201
    input: [refund_method, expected_policy_version]
    output: UnearnedPremiumRefund
    side_effects:
      - "runs unearned_premium_refund and writes computed_refund_cents, alt_refund_cents, capped and priority_class"
      - "sets TransferredPolicy.up_refund_filed to true and increments TransferredPolicy.version by 1"
      - "adds computed_refund_cents to Insolvency.pending_up_liability_cents"

  - method: GET
    path: "/policies/{id}/premium-refunds"
    description: "List the unearned premium refunds filed on one policy (0 or 1 row)."
    roles: [AssociationAdmin, CoverageAnalyst, ReceiverLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UnearnedPremiumRefund[]
    side_effects: []

  - method: POST
    path: "/claims"
    description: "Present a covered claim against a transferred policy of a triggered insolvency."
    roles: [ReceiverLiaison, CoverageAnalyst]
    code: 201
    input: [insolvency_id, policy_id, claim_number, claimant_name, claimant_state_code, loss_date, gross_loss_cents, "punitive_damages_cents?"]
    output: CoveredClaim
    side_effects: ["creates the claim in RECEIVED, stamps filed_at_utc from the logical clock and assigns the next sequence value"]

  - method: GET
    path: "/claims"
    description: "List covered claims filtered by insolvency, policy, originating proof-of-claim batch or status."
    roles: [AssociationAdmin, ReceiverLiaison, CoverageAnalyst, ClaimsCommitteeOfficer]
    code: 200
    input: ["insolvency_id?", "policy_id?", "source_transfer_id?", "status?", "limit?", "offset?"]
    output: CoveredClaim[]
    side_effects: []

  - method: GET
    path: "/claims/{id}"
    description: "Read one covered claim including both computed payable variants and cap_binding."
    roles: [AssociationAdmin, ReceiverLiaison, CoverageAnalyst, ClaimsCommitteeOfficer, ClaimsAdjuster, DefenseCounsel]
    code: 200
    input: []
    output: CoveredClaim
    side_effects: []

  - method: GET
    path: "/claims/{id}/settlement-worksheet"
    description: "Computed read exposing every intermediate term of claim_net_payable side by side with the opposite cap_order_mode variant and their delta."
    roles: [CoverageAnalyst, ClaimsCommitteeOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: "{ claim_id: string, cap_order_mode: string, covered_basis_cents: integer, attachment_point_cents: integer, covered_layer_cents: integer, other_insurance_recoverable_cents: integer, statutory_deductible_cents: integer, per_claim_cap_cents: integer, remaining_aggregate_cents: integer, net_payable_cents: integer, alt_net_payable_cents: integer, variant_delta_cents: integer, cap_binding: string }"
    side_effects: []

  - method: POST
    path: "/claims/{id}/screen"
    description: "Screen the claim against the covered-claim definition; a COVERED decision computes the statutory payable, a DENIED decision closes the claim."
    roles: [CoverageAnalyst]
    code: 200
    input: [decision, "denial_reason?"]
    output: CoveredClaim
    side_effects:
      - "moves CoveredClaim RECEIVED -> SCREENED_ELIGIBLE or RECEIVED -> DENIED_NOT_COVERED"
      - "records screened_by_user_id from the acting X-User-ID"
      - "runs claim_net_payable on a COVERED decision"
      - "closes every ASSIGNED VendorAssignment on a DENIED decision"
      - "increments CoveredClaim.version by 1"

  - method: POST
    path: "/claims/{id}/other-insurance"
    description: "Register an other-insurance layer that may owe on the same loss; guarded by optimistic concurrency on the claim version."
    roles: [CoverageAnalyst]
    code: 201
    input: [carrier_name, policy_number, coverage_type, stated_limit_cents, expected_claim_version]
    output: OtherInsuranceCoverage
    side_effects:
      - "creates the layer in UNEXHAUSTED and assigns the next sequence value within the claim"
      - "increments CoveredClaim.version by 1"

  - method: PATCH
    path: "/claims/{id}/other-insurance/{coverageId}"
    description: "Advance an other-insurance layer through pursuit to exhaustion or carrier denial and record the recovery."
    roles: [CoverageAnalyst]
    code: 200
    input: [status, "recovered_cents?"]
    output: OtherInsuranceCoverage
    side_effects:
      - "moves OtherInsuranceCoverage UNEXHAUSTED -> PURSUING, PURSUING -> EXHAUSTED or PURSUING -> CARRIER_DENIED"
      - "re-runs claim_net_payable on the parent claim for EXHAUSTED and CARRIER_DENIED"
      - "increments CoveredClaim.version by 1 for EXHAUSTED and CARRIER_DENIED"

  - method: GET
    path: "/claims/{id}/other-insurance"
    description: "List the other-insurance layers registered against one claim."
    roles: [AssociationAdmin, CoverageAnalyst, ClaimsCommitteeOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OtherInsuranceCoverage[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/vendor-assignments"
    description: "Engage a contracted adjuster or defense counsel on the claim; the first ADJUSTER engagement moves the claim into adjustment."
    roles: [AssociationAdmin]
    code: 201
    input: [vendor_type, vendor_name, settlement_authority_cents, hourly_rate_cents, engagement_start, engagement_end]
    output: VendorAssignment
    side_effects:
      - "creates the VendorAssignment in ASSIGNED"
      - "moves CoveredClaim SCREENED_ELIGIBLE -> ADJUSTING when vendor_type is ADJUSTER"
      - "moves an existing ASSIGNED engagement of the same vendor_type to SUPERSEDED"
      - "increments CoveredClaim.version by 1"

  - method: GET
    path: "/claims/{id}/vendor-assignments"
    description: "List the contracted vendor engagements on one claim."
    roles: [AssociationAdmin, CoverageAnalyst, ClaimsCommitteeOfficer, ClaimsAdjuster, DefenseCounsel]
    code: 200
    input: ["vendor_type?", "status?", "limit?", "offset?"]
    output: VendorAssignment[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/vendor-assignments/{assignmentId}/invoices"
    description: "Post an hourly invoice against an ASSIGNED engagement, accruing association administrative expense."
    roles: [ClaimsAdjuster, DefenseCounsel]
    code: 201
    input: [hours, invoice_ref]
    output: VendorAssignment
    side_effects:
      - "runs vendor_fee_accrual and increases hours_logged and fees_accrued_cents"
      - "recomputes Insolvency.administrative_expense_cents"

  - method: POST
    path: "/claims/{id}/recommend"
    description: "The assigned adjuster recommends a settlement amount within its delegated settlement authority."
    roles: [ClaimsAdjuster]
    code: 200
    input: [recommended_amount_cents, "note?"]
    output: CoveredClaim
    side_effects:
      - "moves CoveredClaim ADJUSTING -> RECOMMENDED"
      - "writes recommended_amount_cents, recommended_by_vendor_name and recommended_at_utc"
      - "increments CoveredClaim.version by 1"

  - method: POST
    path: "/claims/{id}/remand"
    description: "The claims committee remands a recommendation back to adjustment; permitted at most twice per claim."
    roles: [ClaimsCommitteeOfficer]
    code: 200
    input: [remand_reason]
    output: CoveredClaim
    side_effects:
      - "moves CoveredClaim RECOMMENDED -> ADJUSTING and increments remand_count by 1"
      - "clears recommended_amount_cents, recommended_by_vendor_name and recommended_at_utc"
      - "leaves Insolvency.reserved_claim_cents unchanged"

  - method: POST
    path: "/claims/{id}/approve"
    description: "The claims committee approves the recommended settlement, booking the statutory payable as an estate reserve."
    roles: [ClaimsCommitteeOfficer]
    code: 200
    input: ["approval_note?"]
    output: CoveredClaim
    side_effects:
      - "moves CoveredClaim RECOMMENDED -> APPROVED and records approved_by_user_id"
      - "re-runs claim_net_payable"
      - "adds net_payable_cents to Insolvency.reserved_claim_cents"
      - "recomputes TransferredPolicy.aggregate_paid_cents"

  - method: POST
    path: "/claims/{id}/referrals"
    description: "Offer the claim to another state's guaranty association on a statutory connecting factor; the claim parks in REFERRAL_PENDING."
    roles: [AssociationAdmin]
    code: 201
    input: [target_state_code, basis]
    output: SisterAssociationReferral
    side_effects:
      - "creates the referral in OPEN and resolves basis_state_code"
      - "moves CoveredClaim SCREENED_ELIGIBLE or ADJUSTING -> REFERRAL_PENDING and stores pre_referral_status"
      - "increments Insolvency.referral_pending_count by 1"

  - method: GET
    path: "/claims/{id}/referrals"
    description: "List the sister-association referrals raised on one claim."
    roles: [AssociationAdmin, CoverageAnalyst, ClaimsCommitteeOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SisterAssociationReferral[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/referrals/{referralId}/respond"
    description: "Record the sister association's disposition; ACCEPTED transfers the claim out, DECLINED restores the pre-referral status."
    roles: [AssociationAdmin]
    code: 200
    input: [disposition, "response_note?"]
    output: SisterAssociationReferral
    side_effects:
      - "sets the referral to ACCEPTED or DECLINED with response_note and responded_at_utc"
      - "moves CoveredClaim REFERRAL_PENDING -> REFERRED_OUT on ACCEPTED, zeroing net_payable_cents and closing ASSIGNED engagements"
      - "moves CoveredClaim REFERRAL_PENDING -> pre_referral_status on DECLINED"
      - "decrements Insolvency.referral_pending_count by 1"

  - method: POST
    path: "/assessments"
    description: "Draft an assessment against one assessable line and premium base year to fund covered-claim liabilities."
    roles: [AssessmentOfficer]
    code: 201
    input: [insolvency_id, assessable_line, base_year, needed_amount_cents]
    output: Assessment
    side_effects: ["creates the assessment in DRAFT with levied_amount_cents, shortfall_cents and member_count at 0"]

  - method: GET
    path: "/assessments/{id}"
    description: "Read one assessment including levied total, shortfall and collected total."
    roles: [AssociationAdmin, AssessmentOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: "/assessments/{id}/certify"
    description: "Certify the assessment, allocating the needed amount across eligible member insurers under their per-member caps."
    roles: [AssessmentOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "moves Assessment DRAFT -> CERTIFIED and stamps certified_at_utc"
      - "runs member_assessment_allocation and creates one MemberAssessment per eligible member"
      - "writes levied_amount_cents, shortfall_cents and member_count"
      - "adds shortfall_cents to Insolvency.assessment_shortfall_cents"

  - method: GET
    path: "/member-assessments"
    description: "List member assessment invoices filtered by assessment, member insurer, billing status or recoupment status."
    roles: [AssociationAdmin, AssessmentOfficer, MemberInsurerAgent]
    code: 200
    input: ["assessment_id?", "member_insurer_id?", "billing_status?", "recoupment_status?", "limit?", "offset?"]
    output: MemberAssessment[]
    side_effects: []

  - method: GET
    path: "/member-assessments/{id}"
    description: "Read one member assessment invoice including both the billing and the recoupment dimension."
    roles: [AssociationAdmin, AssessmentOfficer, MemberInsurerAgent]
    code: 200
    input: []
    output: MemberAssessment
    side_effects: []

  - method: POST
    path: "/member-assessments/{id}/payments"
    description: "The assessed member remits cash against its levy."
    roles: [MemberInsurerAgent]
    code: 200
    input: [amount_cents, payment_ref]
    output: MemberAssessment
    side_effects:
      - "advances billing_status INVOICED -> PARTIALLY_PAID or -> PAID and adds amount_cents to paid_amount_cents"
      - "recomputes Assessment.collected_amount_cents and bubbles Assessment CERTIFIED -> SETTLED when every sibling is PAID"
      - "leaves recoupment_status untouched"

  - method: POST
    path: "/member-assessments/{id}/surcharge-filings"
    description: "The assessed member files a policyholder rate surcharge to recoup its levy; the projected recovery is computed and capped at the levy."
    roles: [MemberInsurerAgent]
    code: 200
    input: [surcharge_rate_bps, surcharge_base_cents, filing_ref]
    output: MemberAssessment
    side_effects:
      - "advances recoupment_status NOT_STARTED -> SURCHARGE_FILED and stores surcharge_rate_bps and surcharge_base_cents"
      - "runs recoupment_surcharge_projection and writes projected_recoupment_cents"
      - "leaves billing_status untouched"

  - method: POST
    path: "/member-assessments/{id}/recoupment-remittances"
    description: "The assessed member reports surcharge proceeds collected from policyholders against its levy."
    roles: [MemberInsurerAgent]
    code: 200
    input: [proceeds_cents, remittance_ref]
    output: MemberAssessment
    side_effects:
      - "advances recoupment_status SURCHARGE_FILED -> RECOUPING, SURCHARGE_FILED -> RECOUPED or RECOUPING -> RECOUPED"
      - "adds proceeds_cents to recouped_amount_cents"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every created_at, filed_at_utc, triggered_at_utc, certified_at_utc and responded_at_utc is stamped from it."
    roles: [AssociationAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, delinquent_member_assessment_count: integer }"
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "sweeps MemberAssessment rows with billing_status INVOICED whose Assessment.certified_at_utc + 30 days is strictly before the new instant into DELINQUENT"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role not one of the declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_ASSIGNED_ADJUSTER
    http: 403
    condition: "a ClaimsAdjuster or DefenseCounsel acts on a claim where its X-User-ID is not the id of an ASSIGNED VendorAssignment of the matching vendor_type"
  - id: ERR_NOT_ASSESSED_MEMBER
    http: 403
    condition: "a MemberInsurerAgent acts on a MemberAssessment whose member_insurer_id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving ClaimsCommitteeOfficer X-User-ID equals CoveredClaim.screened_by_user_id"
  - id: ERR_INSOLVENCY_NOT_FOUND
    http: 404
    condition: "no Insolvency row matches the path id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no CoveredClaim row matches the path id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no TransferredPolicy row matches the path id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no ProofOfClaimTransfer row matches the path id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no Assessment row matches the path id"
  - id: ERR_MEMBER_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no MemberAssessment row matches the path id"
  - id: ERR_MEMBER_INSURER_NOT_FOUND
    http: 404
    condition: "no MemberInsurer row matches the path id"
  - id: ERR_CHILD_RESOURCE_NOT_FOUND
    http: 404
    condition: "the nested other-insurance, vendor-assignment or referral id does not belong to the claim named earlier in the path"
  - id: ERR_REFERENCED_ROW_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body (insolvency_id or policy_id) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, value outside the declared range, unknown enum member, unknown field, or a reported other-insurance recovery above stated_limit_cents"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal CoveredClaim.version"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal TransferredPolicy.version"
  - id: ERR_STALE_INSOLVENCY_VERSION
    http: 412
    condition: "expected_insolvency_version does not equal Insolvency.version"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "the CoveredClaim's current status is not a declared from-state of the requested transition"
  - id: ERR_REMAND_LIMIT_REACHED
    http: 409
    condition: "a third remand is attempted on a claim whose remand_count is already 2"
  - id: ERR_TRANSFER_INVALID_STATE
    http: 409
    condition: "conversion is requested on a ProofOfClaimTransfer whose status is not RECEIVED"
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "certification is requested on an Assessment whose status is not DRAFT"
  - id: ERR_MEMBER_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "the MemberAssessment dimension addressed by the request is not in a declared from-state (for example a payment on a PAID invoice or a second surcharge filing)"
  - id: ERR_REFERRAL_ALREADY_ANSWERED
    http: 409
    condition: "a disposition is recorded on a SisterAssociationReferral whose status is not OPEN"
  - id: ERR_INSOLVENCY_NOT_TRIGGERED
    http: 409
    condition: "an operation that presupposes the triggering event runs while Insolvency.status is DECLARED"
  - id: ERR_INSOLVENCY_CLOSED
    http: 409
    condition: "any write against an Insolvency whose status is CLOSED"
  - id: ERR_INSOLVENCY_ALREADY_TRIGGERED
    http: 409
    condition: "POST /insolvencies/{id}/trigger against an Insolvency whose status is already TRIGGERED"
  - id: ERR_POLICY_NOT_CANCELLED
    http: 409
    condition: "screening or refund filing on a TransferredPolicy whose status is IMPORTED or EXPIRED_BEFORE_ORDER"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is strictly after Insolvency.proof_of_claim_deadline_utc"
  - id: ERR_NET_WORTH_EXCLUSION
    http: 422
    condition: "the policyholder's net worth is at or above the line's net_worth_exclusion_threshold_cents"
  - id: ERR_COVERAGE_PROFILE_MISSING
    http: 422
    condition: "no CoverageProfile row exists for a line_of_business the operation must price"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "claim_number already exists on the target policy"
  - id: ERR_UP_REFUND_ALREADY_FILED
    http: 409
    condition: "a second unearned premium refund is filed on a policy whose up_refund_filed is already true"
  - id: ERR_MEMBER_DUPLICATE_LINE
    http: 409
    condition: "the triple (naic_code, assessable_line, base_year) is already registered"
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 409
    condition: "the new policy term intersects the term of another policy of the same insolvency sharing its policy_number"
  - id: ERR_ADJUSTER_ENGAGEMENT_OVERLAP
    http: 409
    condition: "the new engagement's closed date interval intersects an ASSIGNED engagement of the same vendor_type on the same claim"
  - id: ERR_REFERRAL_BASIS_MISMATCH
    http: 422
    condition: "the referral basis resolves to a state code different from target_state_code"
  - id: ERR_REFERRAL_ALREADY_OPEN
    http: 409
    condition: "a second referral is raised while an OPEN referral exists on the claim"
  - id: ERR_SURCHARGE_AGGREGATE_EXCEEDED
    http: 422
    condition: "the member's cumulative filed surcharge rate would exceed MAX_AGGREGATE_SURCHARGE_BPS of 300"
  - id: ERR_OTHER_INSURANCE_NOT_EXHAUSTED
    http: 409
    condition: "approval is attempted while an other-insurance layer on the claim is still UNEXHAUSTED or PURSUING"
  - id: ERR_RECOUPMENT_NOT_FILED
    http: 409
    condition: "surcharge proceeds are remitted while recoupment_status is NOT_STARTED or RECOUPED"
  - id: ERR_CLAIMS_OUTSTANDING
    http: 409
    condition: "the insolvency file is closed while a covered claim remains in a non-terminal, non-denied status"
  - id: ERR_REFUNDS_OUTSTANDING
    http: 409
    condition: "the insolvency file is closed while an unearned premium refund remains PENDING or PARTIALLY_PAID"
  - id: ERR_ADJUSTER_AUTHORITY_EXCEEDED
    http: 422
    condition: "the recommended settlement exceeds the acting engagement's settlement_authority_cents"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "a recommendation exceeds net_payable_cents, or a member payment exceeds the outstanding levy balance"
  - id: ERR_AGGREGATE_CAP_EXHAUSTED
    http: 422
    condition: "approving the claim would push the policy past its per_policy_aggregate_cap_cents"
  - id: ERR_OVER_RECOUPMENT
    http: 422
    condition: "reported surcharge proceeds would push recouped_amount_cents above levied_amount_cents"
  - id: ERR_PREMIUM_BASE_EMPTY
    http: 422
    condition: "certification finds no ACTIVE member insurer with a positive premium base for the assessed line and base year"
  - id: ERR_INSUFFICIENT_ESTATE_FUNDS
    http: 422
    condition: "distribution_amount_cents exceeds Insolvency.estate_undistributed_cents"

roles:
  - name: AssociationAdmin
    description: "Association staff who open and administer insolvency files, configure statutory coverage, register member insurers, engage vendors, run distributions and coordinate sister-association referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /coverage-profiles"
      - "POST /insolvencies"
      - "POST /insolvencies/{id}/trigger"
      - "POST /insolvencies/{id}/distributions"
      - "POST /insolvencies/{id}/close"
      - "POST /member-insurers"
      - "PATCH /member-insurers/{id}"
      - "POST /claims/{id}/vendor-assignments"
      - "POST /claims/{id}/referrals"
      - "POST /claims/{id}/referrals/{referralId}/respond"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /policies"
      - "GET /coverage-profiles"
      - "GET /insolvencies/{id}"
      - "GET /insolvencies/{id}/poc-transfers"
      - "GET /insolvencies/{id}/assessments"
      - "GET /poc-transfers/{id}"
      - "GET /member-insurers/{id}"
      - "GET /policies"
      - "GET /policies/{id}"
      - "GET /policies/{id}/premium-refunds"
      - "GET /claims"
      - "GET /claims/{id}"
      - "GET /claims/{id}/other-insurance"
      - "GET /claims/{id}/vendor-assignments"
      - "GET /claims/{id}/referrals"
      - "GET /assessments/{id}"
      - "GET /member-assessments"
      - "GET /member-assessments/{id}"

  - name: ReceiverLiaison
    description: "Staff of the liquidator's office who remit estate cash, deliver proof-of-claim batches and run the data conversion pass."
    identity: "opaque"
    exclusive_operations:
      - "POST /insolvencies/{id}/estate-remittances"
      - "POST /insolvencies/{id}/poc-transfers"
      - "POST /poc-transfers/{id}/convert"
    shared_operations:
      - "POST /policies"
      - "POST /claims"
      - "GET /insolvencies/{id}"
      - "GET /insolvencies/{id}/poc-transfers"
      - "GET /poc-transfers/{id}"
      - "GET /policies"
      - "GET /policies/{id}"
      - "GET /policies/{id}/premium-refunds"
      - "GET /claims"
      - "GET /claims/{id}"

  - name: CoverageAnalyst
    description: "Association coverage staff who screen claims against the covered-claim definition, track other insurance and file unearned premium refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/screen"
      - "POST /claims/{id}/other-insurance"
      - "PATCH /claims/{id}/other-insurance/{coverageId}"
      - "POST /policies/{id}/premium-refunds"
    shared_operations:
      - "POST /claims"
      - "GET /coverage-profiles"
      - "GET /insolvencies/{id}"
      - "GET /policies"
      - "GET /policies/{id}"
      - "GET /policies/{id}/premium-refunds"
      - "GET /claims"
      - "GET /claims/{id}"
      - "GET /claims/{id}/settlement-worksheet"
      - "GET /claims/{id}/other-insurance"
      - "GET /claims/{id}/vendor-assignments"
      - "GET /claims/{id}/referrals"

  - name: ClaimsAdjuster
    description: "Contracted independent adjuster acting under a VendorAssignment of vendor_type ADJUSTER; recommends settlements within delegated authority and invoices hours."
    identity: "entity_backed:VendorAssignment"
    exclusive_operations:
      - "POST /claims/{id}/recommend"
    shared_operations:
      - "POST /claims/{id}/vendor-assignments/{assignmentId}/invoices"
      - "GET /claims/{id}"
      - "GET /claims/{id}/settlement-worksheet"
      - "GET /claims/{id}/vendor-assignments"

  - name: DefenseCounsel
    description: "Contracted defense counsel acting under a VendorAssignment of vendor_type DEFENSE_COUNSEL; bills defense hours but has no settlement recommendation authority."
    identity: "entity_backed:VendorAssignment"
    exclusive_operations: []
    shared_operations:
      - "POST /claims/{id}/vendor-assignments/{assignmentId}/invoices"
      - "GET /claims/{id}"
      - "GET /claims/{id}/vendor-assignments"

  - name: ClaimsCommitteeOfficer
    description: "Association claims committee member who approves or remands adjuster recommendations; barred from approving a claim it screened."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/remand"
    shared_operations:
      - "GET /coverage-profiles"
      - "GET /insolvencies/{id}"
      - "GET /policies/{id}"
      - "GET /claims"
      - "GET /claims/{id}"
      - "GET /claims/{id}/settlement-worksheet"
      - "GET /claims/{id}/other-insurance"
      - "GET /claims/{id}/vendor-assignments"
      - "GET /claims/{id}/referrals"

  - name: AssessmentOfficer
    description: "Association assessment staff who draft and certify member assessments against premium bases."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessments"
      - "POST /assessments/{id}/certify"
    shared_operations:
      - "GET /coverage-profiles"
      - "GET /insolvencies/{id}"
      - "GET /insolvencies/{id}/assessments"
      - "GET /member-insurers/{id}"
      - "GET /assessments/{id}"
      - "GET /member-assessments"
      - "GET /member-assessments/{id}"

  - name: MemberInsurerAgent
    description: "Authorised agent of an assessed member insurer; pays its levy, files rate surcharges and reports recoupment proceeds. X-User-ID equals the MemberInsurer id."
    identity: "entity_backed:MemberInsurer"
    exclusive_operations:
      - "POST /member-assessments/{id}/payments"
      - "POST /member-assessments/{id}/surcharge-filings"
      - "POST /member-assessments/{id}/recoupment-remittances"
    shared_operations:
      - "GET /member-insurers/{id}"
      - "GET /member-assessments"
      - "GET /member-assessments/{id}"

