          - endpoints.GET_/airhub/lanes/{lane_id}
        distinguishing_aspect: "The lane configuration round-trips through create and read exactly as posted, including the half-open turnout pair and the certification horizon, with status and lane_load_grams defaulted rather than supplied."
        test_recipe:
          setup:
            - "Clock 23:00Z (minute 1380). SDF hub exists."
          setup_api_calls:
