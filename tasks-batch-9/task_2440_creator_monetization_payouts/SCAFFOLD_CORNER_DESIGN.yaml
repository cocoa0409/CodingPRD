      - name: submit_verified_tax_profile_rejected_as_not_draft
        claim_type: invalid_transitions
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_TAX_PROFILE_NOT_DRAFT]"
          - state_machines.TaxProfile.transitions.DRAFT_to_SUBMITTED
        distinguishing_aspect: "submit is defined only from DRAFT, so calling it on a VERIFIED profile is 409 ERR_TAX_PROFILE_NOT_DRAFT and leaves verified_at intact."
        test_recipe:
          setup: ["One creator with a VERIFIED W9 profile."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
              captures: { tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr}"
            - call: "POST /monetization/tax-profiles/${tp}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
          trigger:
            - call: "POST /monetization/tax-profiles/${tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_TAX_PROFILE_NOT_DRAFT'"
            - "TaxProfile.${tp}.status == 'VERIFIED'"
            - "TaxProfile.${tp}.verified_at == '2026-08-01T00:00:00Z'"

