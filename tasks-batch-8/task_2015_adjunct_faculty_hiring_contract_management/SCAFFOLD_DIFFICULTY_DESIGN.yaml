            - "CredentialVerification.${cred_t}.verification_status == PENDING (unchanged)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.RateSchedule.fields.effective_end_date
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on RateSchedule: a new
          schedule whose start EQUALS an existing schedule's end (2027-01-31 ==
          2027-01-31) is NOT an overlap and must publish; one day earlier
          (start 2027-01-30) IS an overlap and must fail with
          ERR_SCHEDULE_OVERLAP. Both directions of the boundary are asserted.
        test_recipe:
          setup:
            - "Department with one PUBLISHED MASTERS schedule covering [2026-08-01, 2027-01-31)"
            - "Two additional DRAFT schedules for the same (department, tier): A [2027-01-31, 2027-07-31) adjacent; B [2027-01-30, 2027-07-31) overlapping by one day"
          setup_api_calls:
            - call: "POST /adjunct-hr/departments"
              payload: { code: "SOCI", name: "Sociology", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_COURSE", base_rate_cents: 450000, longevity_step_cents: 0, longevity_step_cap: 0, effective_start_date: "2026-08-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_base: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_base}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_COURSE", base_rate_cents: 460000, longevity_step_cents: 0, longevity_step_cap: 0, effective_start_date: "2027-01-31", effective_end_date: "2027-07-31" }
              as: HRAdmin
              captures: { sched_adjacent: $.data.id }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_COURSE", base_rate_cents: 470000, longevity_step_cents: 0, longevity_step_cap: 0, effective_start_date: "2027-01-30", effective_end_date: "2027-07-31" }
              as: HRAdmin
              captures: { sched_overlap: $.data.id }
          trigger:
            - call: "POST /adjunct-hr/rate-schedules/${sched_adjacent}/publish"
              payload: {}
              as: HRAdmin
              captures: { adj_status: $.data.schedule_status }
            - call: "POST /adjunct-hr/rate-schedules/${sched_overlap}/publish"
              payload: {}
              as: HRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "adjacent schedule publishes: RateSchedule.${sched_adjacent}.schedule_status == PUBLISHED (half-open adjacency 2027-01-31 == 2027-01-31 is NOT overlap)"
            - "overlapping schedule rejected: error_id == ERR_SCHEDULE_OVERLAP (start 2027-01-30 < existing end 2027-01-31)"
            - "RateSchedule.${sched_overlap}.schedule_status == DRAFT (unchanged)"

      - name: payroll_period_closed_interval_touching_endpoints_overlap
        grounds:
          - validations[priority=12]
          - entities.PayrollPeriod.fields.end_date
          - errors[ERR_PAYROLL_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics from instance 1 (closed vs half-open) on
          a different resource (PayrollPeriod vs RateSchedule): payroll periods
          use CLOSED intervals, so a new period whose start EQUALS an existing
          OPEN period's end (2026-09-20 == 2026-09-20) IS an overlap and must
          be rejected — the opposite geometric treatment from rate schedules.
        test_recipe:
          setup:
            - "Existing OPEN payroll period P1 [2026-08-24, 2026-09-20]"
          setup_api_calls:
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P1", start_date: "2026-08-24", end_date: "2026-09-20" }
              as: PayrollOfficer
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P2", start_date: "2026-09-20", end_date: "2026-10-18" }
              as: PayrollOfficer
              captures: { err: $.data.error_id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P2B", start_date: "2026-09-21", end_date: "2026-10-18" }
              as: PayrollOfficer
              captures: { p2b: $.data.id }
          assert:
            - "touching-endpoints period rejected: error_id == ERR_PAYROLL_PERIOD_OVERLAP (closed-interval semantics: 2026-09-20 is inside P1)"
            - "gap-of-one-day period succeeds: PayrollPeriod.${p2b}.period_status == OPEN (2026-09-21 > 2026-09-20 creates no closed-interval intersection)"
            - "the two outcomes pin the closed-vs-half-open contrast against the rate-schedule rule"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payroll_accrual_plus_clawback_conserves_payable
        grounds:
          - calculations.payroll_accrual_split
          - calculations.cancellation_partial_pay
          - entities.PayrollEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = per-contract net payroll cents. Invariant:
          SUM(PayrollEntry.amount_cents where contract_id == C) ==
          Contract.payable_cents after any forward action (accrual) paired with
          its compensating action (clawback on cancellation). Pinned numbers:
          accrual 2,290,909 posted in P1; late-tier cancellation at early census
          sets payable 2,250,000; CLAWBACK -40,909 in P2 restores the
          invariant: 2,290,909 - 40,909 == 2,250,000.
