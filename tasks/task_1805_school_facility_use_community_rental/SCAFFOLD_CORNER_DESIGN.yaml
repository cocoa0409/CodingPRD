            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Auction", headcount_estimate: 100, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req_vr: $.data.version }
          trigger:
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_vr}" }
              as: FacilitiesDirector
              captures: { permit_id: $.data.id }
