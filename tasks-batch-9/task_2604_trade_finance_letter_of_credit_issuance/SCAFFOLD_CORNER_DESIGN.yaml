      - name: facility_close_rejected_while_an_allocation_is_open_then_freezes_posture
        claim_type: cascade_down
        grounds:
          - state_machines.CreditFacility.ACTIVE_to_CLOSED
          - errors.ERR_FACILITY_HAS_OPEN_ALLOCATION
          - errors.ERR_FACILITY_NOT_ACTIVE
          - endpoints.POST_/facilities/{id}/status-changes
        distinguishing_aspect: |
          CLOSE is guarded by the child ledger and then cascades downward: with
          one OPEN FacilityAllocation the call returns 409
          ERR_FACILITY_HAS_OPEN_ALLOCATION; once the credit is cancelled and the
          allocation is RELEASED the same call succeeds, sets status CLOSED and
          utilisation_posture FROZEN, and a sibling APPROVED credit can no longer
