# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Hot Air Balloon Ride Operations (task 2007)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations in different domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fare_quote_provisional_vs_final_diverge
        grounds:
          - calculations.fare_quote
          - entities.Reservation.fields.quoted_fare_cents
          - entities.Reservation.fields.final_fare_cents
        distinguishing_aspect: |
          Reservation-domain dual variant: identical reservation, but the provisional
          variant uses declared_weight_lbs (660 lbs → avg 220 → surcharge) while the
          final variant uses actual passenger weights (200/200/200 → avg 200 → no
          surcharge), producing 97200 vs 89700 — a 7500-cent settle delta.
        test_recipe:
          setup:
            - "GRANTED launch site S1, ACTIVE balloon B1 (cap 6, max_gross 1400, empty 600, inspected), CURRENT pilot P1 (5 t/o, 20.0 h)"
            - "Flight F1 SHARED on 2026-08-10 (REGULAR), window 05:30-07:00Z, PUBLISHED → SCHEDULED"
            - "Clock inside the dawn window; flight advanced to WEATHER_REVIEW"
            - "Reservation R1 party_size 3, declared_weight_lbs 660, CONFIRMED at paid 97200"
            - "Passengers added with actual weights 200, 200, 200"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "ENTER_WEATHER_REVIEW" }
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 3, declared_weight_lbs: 660, photo_package_tier: "NONE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id, quoted: $.data.quoted_fare_cents }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 97200 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/reservations/${r1}/passengers"
              payload: { name: "P A", weight_lbs: 200 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/reservations/${r1}/passengers"
              payload: { name: "P B", weight_lbs: 200 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/reservations/${r1}/passengers"
              payload: { name: "P C", weight_lbs: 200 }
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CHECK_IN", additional_paid_cents: 0 }
              as: OperationsManager
          assert:
            - "Reservation.${r1}.quoted_fare_cents == 97200"
            - "Reservation.${r1}.final_fare_cents == 89700"
            - "Reservation.${r1}.paid_cents == 89700"
            - "Customer.${c1}.wallet_credit_cents == 7500"

      - name: pilot_currency_faa_vs_operator_diverge
        grounds:
          - calculations.pilot_currency
          - entities.Pilot.fields.faa_currency_met
          - entities.Pilot.fields.operator_currency_met
          - entities.Pilot.fields.currency_status
        distinguishing_aspect: |
          Pilot-domain dual variant: on the same pilot record the FAA-style method
          (takeoffs/landings >= 3) says MET while the operator rolling-hours method
          (PIC hours >= 12.0) says NOT MET — the two variants disagree, and the
          gated currency_status follows the conservative AND (EXPIRED).
        test_recipe:
          setup:
            - "Pilot P2 with 5 external takeoffs/landings in 90d but only 8.0 PIC hours in 180d"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Sam Rill", certificate_number: "PC-8899", medical_expires_on: "2027-06-30", external_pic_hours_180d: 8.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /v1/pilots/${p2}"
              payload: {}
              as: OperationsManager
          assert:
            - "Pilot.${p2}.faa_currency_met == true"
            - "Pilot.${p2}.operator_currency_met == false"
            - "Pilot.${p2}.currency_status == EXPIRED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in different modes (a) and (b)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fare_quote_shared_combinatorial
        grounds:
          - calculations.fare_quote
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction: season
          tier branch (PEAK vs REGULAR) x party size x conditional weight surcharge
          x photo add-on. PEAK party of 2 with avg weight over threshold and DELUXE
          photos yields 2*(39900+2500)+9900 = 94700.
        test_recipe:
          setup:
            - "GRANTED site, inspected ACTIVE balloon (cap 6), CURRENT pilot"
            - "Flight on 2026-10-05 (PEAK, inside Oct 1-14), SCHEDULED"
            - "Customer books party 2, declared_weight_lbs 500 (avg 250 > 200 → surcharge), photo DELUXE"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "North Valley", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N701AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-10-05", dawn_window_start: "2026-10-05T05:30:00Z", dawn_window_end: "2026-10-05T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 2, declared_weight_lbs: 500, photo_package_tier: "DELUXE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
          assert:
            - "Flight.${f1}.season_tier == PEAK"
            - "Reservation.${r1}.quoted_fare_cents == 94700"

      - name: refund_per_passenger_rounding_order
        grounds:
          - calculations.refund_amount
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: paid 102100 / party 3,
          80% policy. Per-passenger-first (pinned): round(102100/3)=34033,
          round(34033*0.8)=27226, x3 = 81678. Total-then-round would give
          round(102100*0.8)=81680 — the two orders diverge by 2 cents and the
          scaffold pins per-passenger-first.
        test_recipe:
          setup:
            - "SHARED REGULAR flight 2026-08-10 SCHEDULED, window 2026-08-10T05:30-07:00Z"
            - "Reservation party 3, declared 660, photo STANDARD → quoted 102100, CONFIRMED paid 102100"
            - "Clock set to 2026-08-08T00:00:00Z — more than 24h before dawn_window_start (CUSTOMER_CANCEL_EARLY)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 3, declared_weight_lbs: 660, photo_package_tier: "STANDARD" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 102100 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CANCEL" }
              as: Customer
              as_user_id: "${c1}"
            - call: "GET /v1/reservations/${r1}/refunds"
              payload: {}
              as: OperationsManager
              captures: { refund_amt: "$.data[0].requested_amount_cents" }
          assert:
            - "Reservation.${r1}.cancel_reason == CUSTOMER_CANCEL_EARLY"
            - "Refund.requested_amount_cents == 81678"
            - "Refund.requested_amount_cents != 81680"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: two non-linear machines, different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: flight_no_go_reschedule_cycle
        grounds:
          - state_machines.Flight.WEATHER_REVIEW_to_NO_GO
          - state_machines.Flight.NO_GO_to_SCHEDULED
        distinguishing_aspect: |
          Flight machine is cyclic + branching: WEATHER_REVIEW forks to
          CLEARED_FOR_LAUNCH or NO_GO, and NO_GO loops back to SCHEDULED via
          RESCHEDULE — after the loop the flight carries the new date, reset
          weather_decision, and intact reservations.
        test_recipe:
          setup:
            - "Flight SCHEDULED for 2026-08-10, one CONFIRMED reservation attached"
            - "Clock inside the dawn window; flight in WEATHER_REVIEW"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 1, declared_weight_lbs: 180, photo_package_tier: "NONE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 29900 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "ENTER_WEATHER_REVIEW" }
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "RECORD_NO_GO" }
              as: Pilot
              as_user_id: "${p1}"
          trigger:
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "RESCHEDULE", new_scheduled_date: "2026-08-11", new_dawn_window_start: "2026-08-11T05:30:00Z", new_dawn_window_end: "2026-08-11T07:00:00Z" }
              as: OperationsManager
          assert:
            - "Flight.${f1}.status == SCHEDULED"
            - "Flight.${f1}.scheduled_date == 2026-08-11"
            - "Flight.${f1}.weather_decision == NONE"
            - "Reservation.${r1}.booking_status == CONFIRMED"
            - "Reservation.${r1}.paid_cents == 29900"

      - name: reservation_parallel_payment_dimension
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.ReservationPayment
        distinguishing_aspect: |
          Reservation carries two independent state axes: booking_status reaches
          CANCELLED while payment_status is still PAID; only the subsequent Refund
          PAY moves the payment axis to REFUNDED — the two dimensions evolve on
          different triggers and are observable in intermediate combination
          (booking CANCELLED x payment PAID).
        test_recipe:
          setup:
            - "SHARED flight 2026-08-10 SCHEDULED; reservation CONFIRMED paid 29900"
            - "Clock at 2026-08-08 (CUSTOMER_CANCEL_EARLY window)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 1, declared_weight_lbs: 180, photo_package_tier: "NONE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 29900 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CANCEL" }
              as: Customer
              as_user_id: "${c1}"
            - call: "GET /v1/reservations/${r1}/refunds"
              payload: {}
              as: OperationsManager
              captures: { rf1: "$.data[0].id" }
            - call: "POST /v1/refunds/${rf1}/events"
              payload: { event_type: "APPROVE", approved_amount_cents: 23920 }
              as: OperationsManager
          trigger:
            - call: "POST /v1/refunds/${rf1}/events"
              payload: { event_type: "PAY", paid_via: "ORIGINAL_PAYMENT" }
              as: OperationsManager
          assert:
            - "Reservation.${r1}.booking_status == CANCELLED (booking axis terminal before payment axis moved)"
            - "Reservation.${r1}.payment_status == PARTIALLY_REFUNDED (after PAY; was PAID at cancel time — axes moved on different triggers)"
            - "Reservation.${r1}.refunded_cents == 23920"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth >= 3 and depth >= 2, different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: weather_no_go_cancel_cascade
        grounds:
          - state_machines.Flight.NO_GO_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Refund
          - calculations.refund_amount
        distinguishing_aspect: |
          Depth-3 chain triggered by flight CANCEL from NO_GO: Flight → CANCELLED
          causes Reservation → CANCELLED (WEATHER_CANCEL), which itself causes a
          Refund to be created (REQUESTED at 100% of paid) — each link caused by
          the previous link, not fan-out from the original call.
        test_recipe:
          setup:
            - "Flight pushed to NO_GO on 2026-08-10 with two PAID reservations (29900 and 59800)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
