      - name: venue_date_conflict_outranks_market_rotation_cooldown_on_one_booking
        grounds:
          - validations[order=30]
          - validations[order=37]
          - calculations.venue_occupancy_conflict
          - calculations.market_rotation_cooldown
          - errors.ERR_VENUE_DATE_CONFLICT
          - errors.ERR_MARKET_ROTATION_COOLDOWN
        distinguishing_aspect: |
          A different error-category pair from the first instance: business_temporal (order 30)
          against business_constraint (order 37). Both rules read the same CONFIRMED booking of the
          same venue, so a naive implementation that checks market rotation first — the more
          "business-looking" rule — returns the wrong error. Each rule is also demonstrated firing
          alone, on a different venue in the same market for the cooldown side.
        test_recipe:
          setup:
            - "Season with market_rotation_cooldown_days 21"
            - "Venue 'Atlanta Dome' (market ATL, turnaround_hours 12) and a second Venue 'Atlanta Arena' also in market ATL"
            - "One CONFIRMED booking B1 at Atlanta Dome for 2026-11-14, occupancy [2026-11-13T14:00:00Z, 2026-11-15T06:00:00Z]; padded by 12h its blocked interval is [2026-11-13T02:00:00Z, 2026-11-15T18:00:00Z]"
            - "Logical clock at its 2026-08-01T00:00:00Z default so every candidate date clears the 45-day lead time"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000, market_rotation_cooldown_days: 21 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_dome: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Arena", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 7000, floor_type: "CONCRETE", catch_fence_max_height_ft: 12, medical_bay_count: 1, load_in_hours_required: 8, staging_bay_count: 3, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_arena: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dome}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b1: "$.data.id" }
            - call: "POST /venue-bookings/${b1}/accept"
              payload: {}
              as: SeriesPromoter
          trigger:
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dome}", tour_date: "2026-11-15", rental_base_cents: 3100000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-15T10:00:00Z", tear_down_end_utc: "2026-11-16T02:00:00Z" }
              as: SeriesPromoter
              captures: { err_pair: "$.data.error_id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_arena}", tour_date: "2026-11-30", rental_base_cents: 2600000, revenue_share_pct: 0.10, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-11-29T14:00:00Z", tear_down_end_utc: "2026-12-01T06:00:00Z" }
              as: SeriesPromoter
              captures: { err_cooldown_only: "$.data.error_id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_arena}", tour_date: "2026-12-05", rental_base_cents: 2600000, revenue_share_pct: 0.10, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-12-04T14:00:00Z", tear_down_end_utc: "2026-12-06T06:00:00Z" }
              as: SeriesPromoter
              captures: { b3: "$.data.id" }
          assert:
            - "conflict: trigger call 1 violates order 30 (its interval [2026-11-15T10:00:00Z, 2026-11-16T02:00:00Z] overlaps B1's padded blocked interval ending 2026-11-15T18:00:00Z) and order 37 (gap_days == 1 < 21) and returns HTTP 409 with ${err_pair} == ERR_VENUE_DATE_CONFLICT"
            - "isolation: trigger call 2 targets a different venue so order 30 cannot fire; gap_days == 16 < 21 and it returns HTTP 409 with ${err_cooldown_only} == ERR_MARKET_ROTATION_COOLDOWN"
            - "control: trigger call 3 has gap_days == 21 from 2026-11-14, which the strict `<` comparison admits, and returns HTTP 201 in state TERMS_PROPOSED"
            - "no VenueBooking row exists for tour_date 2026-11-15 or 2026-11-30 after the trigger sequence"
            - "VenueBooking.${b1}.state == CONFIRMED throughout — a rejected candidate never mutates the incumbent booking"

  - rule_id: boundary_precision_check
