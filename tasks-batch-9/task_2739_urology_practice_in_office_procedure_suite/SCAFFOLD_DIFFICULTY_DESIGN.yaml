            - "after trigger call 1 the case is still schedule_status \"DRAFT\" and ProcedureRoom.${uds_room_id}.version is still ${uds_room_v1}"
            - "an implementation that checks the provider before the room returns ERR_PROVIDER_ACCREDITATION_LAPSED at call 1; one that applies the gate to every room type fails call 6"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rt_room_halfopen_turnover_inclusive
        grounds:
          - calculations.case_occupancy_window.interval_semantics
          - validations[priority=58]
          - entities.ProcedureRoom.fields.occupied_block_count
        distinguishing_aspect: |
          ROOM geometry: the occupied resource interval includes the turnover tail,
          so a case starting at the first case's scheduled_end_at (14:20, when
          the patient has already left the room) is still rejected — the room is
          being cleaned. This is the "turnover is part of the resource hold" claim.
          The other overlap instance uses the PROVIDER geometry, which excludes
          turnover entirely and is closed rather than half-open, so the two
          instances make opposite predictions about the same clock arithmetic.
        test_recipe:
          setup:
            - "two urologists (Ada and Bell), one scheduler"
            - "patient Cyrus Lund, egfr 60, anticoagulant_flag false"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
