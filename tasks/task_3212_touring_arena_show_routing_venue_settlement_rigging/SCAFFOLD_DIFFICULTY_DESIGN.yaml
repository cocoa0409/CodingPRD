  # ===========================================================================
  # Rule 4: transitive_cascade — different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: venue_deactivate_releases_avail_cascades_engagement_cancel_supersedes_plans
        grounds:
          - state_machines.Venue.ACTIVE_to_INACTIVE
          - state_machines.DateAvail.OPEN_to_RELEASED
          - state_machines.Engagement.HOLD_to_CANCELLED
          - state_machines.RiggingPlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /venues/{id}/deactivate:
          Venue ACTIVE→INACTIVE ⇒ every OPEN DateAvail on the venue → RELEASED
          (link 1); for any DateAvail in HELD at the time of force-release by
          this venue's deactivation path, the held Engagement → CANCELLED
          (link 2); each CANCELLED Engagement then SUPERSEDES its non-terminal
          RiggingPlans and CANCELS its LaborCalls/TruckMoves (link 3).
          Each link is caused by the previous link's mutation, not the original
          deactivation call.
        test_recipe:
          setup:
            - "Venue V ACTIVE; DateAvail A1 OPEN; Engagement E1 in HOLD holding A1 (a force-release is simulated by first releasing A1, which cascades); RiggingPlan P1 DRAFT with 1 allocation; LaborCall L1 DRAFT; TruckMove M1 SCHEDULED."
            - "Venue has no other engagements (so deactivation itself would succeed only after force-release of A1 cancels E1 — the cascade test focuses on DateAvail release as the link-1 trigger)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/rigging-points"
              payload: { label: "A-1", zone: "GRID", max_static_load_kg: 5000, max_dynamic_load_kg: 500 }
              as: VenueBooker
              captures: { point_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
