            - "Channel.${channel_direct_id}.activity_cost_cents == 100010"
            - "Channel.${channel_direct_id}.cost_per_booking_activity_cents == 50005"

      - name: empty_required_disclosure_codes_publish_succeeds_with_omitted_ack
        grounds:
          - calculations.disclosure_completeness
          - entities.Channel.fields.required_disclosure_codes
          - entities.Offer.fields.acknowledged_disclosure_codes
          - entities.Offer.fields.disclosure_complete
          - state_machines.Offer.CONSTRUCTED_to_PUBLISHED
          - calculations.surcharge_amount
        distinguishing_aspect: |
          EMPTY-SET boundary rather than a numeric one: with required_disclosure_codes == [] the
          missing-code set is empty for ANY submitted value, so a publish that omits
          disclosure_ack_codes entirely still succeeds and stores acknowledged_disclosure_codes == []
          with disclosure_complete == true — the vacuous-truth edge of the set-difference, tested on a
          GDS_LEGACY channel whose zero-threshold surcharge rule also fires on every scope base.
        test_recipe:
          setup:
            - "Channel GDS_LEG: GDS_LEGACY, content_tier STANDARD, content_markup_pct 0.08, required_disclosure_codes [] (explicitly empty), one surcharge rule GDS_SEG scope ALL rate_pct 0.03 threshold_cents 0 clamped to [300, 900]."
            - "Travel agency Delta registered; FareFiling YGDS01 ACTIVE at base_amount_cents 20000."
            - "An offer is constructed on GDS_LEG: subtotal 21600 (round_half_up(20000 * 1.08)), surcharge 648 (round_half_up(21600 * 0.03), inside the clamp), total 22248."
