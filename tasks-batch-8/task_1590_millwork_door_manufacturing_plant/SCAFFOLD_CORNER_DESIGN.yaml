  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers fails priority-1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even when the payload is otherwise valid."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CV-1" }, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "trigger is sent with auth headers omitted"
            - "captured ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
      - name: existence_beats_payload_on_missing_drawing
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=3.4]", "errors[ERR_DRAWING_NOT_FOUND]"]
        distinguishing_aspect: "PUT status on a nonexistent drawing id AND a malformed payload (missing target_status) — existence (priority 3) wins over payload shape (priority 3.4): ERR_DRAWING_NOT_FOUND, not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "PUT /millwork/shop-drawings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/status", payload: {}, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_DRAWING_NOT_FOUND"
      - name: occ_precedes_state_on_label_issue
        claim_type: priority_ordering
        grounds: ["validations[priority=3.5]", "validations[priority=4]", "concurrency_rules[label-issue-stale-roll]", "errors[ERR_STALE_ROLL_VERSION]"]
        distinguishing_aspect: "OCC (priority 3.5) is checked before state gates (priority 4): issuing against a RETIRED roll with a stale expected_roll_version returns 412 ERR_STALE_ROLL_VERSION, not ERR_ROLL_NOT_ACTIVE / ERR_OPENING_NOT_RATED."
        test_recipe:
          setup: ["Unrated order with one QUEUED opening; UL_20MIN roll created (version 1) then RETIRED (version 2)."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CV-2" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-V2", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "V1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll_id: $.data.id, roll_v1: $.data.version } }
            - { call: "PUT /millwork/fire-label-rolls/${roll_id}/status", payload: { target_status: "RETIRED" }, as: LabelAuthority }
          trigger:
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${roll_v1}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_STALE_ROLL_VERSION (412 beats the 409 state gates)"
      - name: opening_rating_exceeds_order_rank
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_OPENING_RATING_EXCEEDS_ORDER]"]
        distinguishing_aspect: "Rating rank rule is conditional on the order's ceiling: a MIN_45 opening under a MIN_20 order is rejected (ERR_OPENING_RATING_EXCEEDS_ORDER); MIN_20 under the same order and MIN_45 under a MIN_45 order both succeed."
        test_recipe:
          setup: ["Order R20 (fire_rating_required MIN_20, TEMPLATE_PREP) and order R45 (MIN_45)."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CV-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-V3", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-R20", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord20: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-R45", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_45" }, as: Estimator, captures: { ord45: $.data.id } }
          trigger:
            - { call: "POST /millwork/openings", payload: { order_id: "${ord20}", opening_no: "X1", width_in: 36, height_in: 84, fire_rating: "MIN_45", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { err: $.data.error_id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord20}", opening_no: "X2", width_in: 36, height_in: 84, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { ok1: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord45}", opening_no: "X3", width_in: 36, height_in: 84, fire_rating: "MIN_45", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { ok2: $.data.id } }
          assert:
            - "captured ${err} == ERR_OPENING_RATING_EXCEEDS_ORDER"
            - "Opening.${ok1}.fab_status == QUEUED and Opening.${ok2}.fab_status == QUEUED"
      - name: rated_config_safety_rules
        claim_type: conditional_validation
        grounds: ["validations[priority=5]", "errors[ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP]", "errors[ERR_TEMPLATE_NOT_FIRE_RATED]", "errors[ERR_TEMPLATE_REQUIRED]"]
        distinguishing_aspect: "Configure-time fire safety is conditional on order fields: rated+INSTALLER_PREP -> ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP; rated+non-fire-rated template -> ERR_TEMPLATE_NOT_FIRE_RATED; TEMPLATE_PREP without template -> ERR_TEMPLATE_REQUIRED."
        test_recipe:
          setup: ["Three orders each with one opening: OI (MIN_20, INSTALLER_PREP), OT (MIN_20, TEMPLATE_PREP with non-rated template), OM (NONE, TEMPLATE_PREP without template_id)."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CV-4" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-NR", manufacturer: "ACME", fire_rated_compatible: false }, as: PlantManager, captures: { tmpl_nr: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-I", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_i: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_i}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-T", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_nr}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_t: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_t}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-M", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_m: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_m}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
          trigger:
            - { call: "PUT /millwork/orders/${ord_i}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { err_i: $.data.error_id } }
            - { call: "PUT /millwork/orders/${ord_t}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { err_t: $.data.error_id } }
            - { call: "PUT /millwork/orders/${ord_m}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { err_m: $.data.error_id } }
          assert:
            - "captured ${err_i} == ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP"
            - "captured ${err_t} == ERR_TEMPLATE_NOT_FIRE_RATED"
            - "captured ${err_m} == ERR_TEMPLATE_REQUIRED"
            - "all three orders remain DRAFT"
      - name: duplicate_codes_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ORDER_CODE_NOT_UNIQUE]", "errors[ERR_OPENING_NO_NOT_UNIQUE]"]
        distinguishing_aspect: "Scoped uniqueness: order_code repeats within the SAME project are rejected (ERR_ORDER_CODE_NOT_UNIQUE) but allowed in a different project; opening_no repeats within the same order are rejected (ERR_OPENING_NO_NOT_UNIQUE)."
        test_recipe:
          setup: ["Projects P1, P2; order O-DUP in P1 with opening N1."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P1", site_address: "1 Main St", contract_code: "CV-5A" }, as: PlantManager, captures: { proj1: $.data.id } }
            - { call: "POST /millwork/projects", payload: { name: "P2", site_address: "2 Main St", contract_code: "CV-5B" }, as: PlantManager, captures: { proj2: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj1}", order_code: "DUP", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "N1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
          trigger:
            - { call: "POST /millwork/orders", payload: { project_id: "${proj1}", order_code: "DUP", species: "MAPLE", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { err_o: $.data.error_id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj2}", order_code: "DUP", species: "MAPLE", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ok_o: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "N1", width_in: 32, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { err_n: $.data.error_id } }
          assert:
            - "captured ${err_o} == ERR_ORDER_CODE_NOT_UNIQUE (same project)"
            - "MillworkOrder.${ok_o}.status == DRAFT (same code allowed in another project)"
            - "captured ${err_n} == ERR_OPENING_NO_NOT_UNIQUE"
      - name: second_active_drawing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ACTIVE_DRAWING_EXISTS]"]
        distinguishing_aspect: "At most one drawing per order may be in {DRAFT, SUBMITTED}: creating a second DRAFT fails ERR_ACTIVE_DRAWING_EXISTS; after voiding the first, creation succeeds."
        test_recipe:
          setup: ["Order CONFIGURED; drawing D1 in DRAFT."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CV-6" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-D6", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v1: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v1}" }, as: Estimator, captures: { drw1: $.data.id } }
          trigger:
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v2: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v2}" }, as: Estimator, captures: { err: $.data.error_id } }
            - { call: "PUT /millwork/shop-drawings/${drw1}/status", payload: { target_status: "VOID" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v3: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v3}" }, as: Estimator, captures: { drw2: $.data.id, rev2: $.data.revision_no } }
          assert:
            - "captured ${err} == ERR_ACTIVE_DRAWING_EXISTS"
            - "captured ${rev2} == 2 and ShopDrawing.${drw2}.status == DRAFT (revision counter advances across VOID)"
      - name: program_order_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]", "errors[ERR_PROGRAM_ORDER_MISMATCH]"]
        distinguishing_aspect: "Referential coherence: a program whose payload order_id differs from its drawing's order is rejected ERR_PROGRAM_ORDER_MISMATCH."
        test_recipe:
