              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/route-stops/${stop_id}/lodging-reservations"
              payload: { crew_member_id: "${crew_a}", lodging_site_id: "${site_id}", stay_start_date: "2026-08-05", stay_end_date: "2026-08-08", bed_count: 2 }
              as: CrewBoss
              captures: { res_a: $.data.id }
          trigger:
            - call: "POST /harvest/route-stops/${stop_id}/lodging-reservations"
              payload: { crew_member_id: "${crew_b}", lodging_site_id: "${site_id}", stay_start_date: "2026-08-06", stay_end_date: "2026-08-09", bed_count: 1 }
