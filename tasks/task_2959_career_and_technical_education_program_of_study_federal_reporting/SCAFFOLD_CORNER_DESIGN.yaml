      - name: collection_reads_expose_every_declared_filter_and_paginate
        claim_type: standard_crud
        grounds:
          - endpoints[GET /cte/programs-of-study/{id}/credentials]
          - endpoints[GET /cte/credentials/{id}]
          - endpoints[GET /cte/programs-of-study/{id}/advisory-committees]
          - endpoints[GET /cte/advisory-committees/{id}/members]
          - endpoints[GET /cte/advisory-committees/{id}/meetings]
          - endpoints[GET /cte/programs-of-study/{id}/educators]
          - endpoints[GET /cte/programs-of-study/{id}/performance-indicators]
          - endpoints[GET /cte/grant-awards]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Eight declared collection reads carry eleven declared query filters between them, and a handler that ignores an
          unrecognised filter silently returns the unfiltered set — which still looks correct whenever the filter happens
          to select everything. Every filter is therefore probed twice: once with a value that selects a known subset and
          once with a value that must select nothing, so an ignored filter is caught by the second probe returning the
          full count instead of zero. Each read also has to report meta.total_count and meta.has_more, and the reads that
          are scoped to a parent id must not leak the sibling program's rows.
