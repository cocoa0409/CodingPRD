  # =========================================================================
  # Rule 9 -- compensating-action invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: adjustment_allowance_conserved_across_complete_and_void
        grounds:
          - conservation_invariants.adjustment_allowance_conservation
          - state_machines.PostDeliveryService.IN_CHAIR_to_COMPLETED
          - state_machines.PostDeliveryService.COMPLETED_to_VOIDED
          - entities.Prosthesis.fields.adjustments_remaining
        distinguishing_aspect: |
          Conserved quantity: a COUNT of included visits. adjustments_used plus
          adjustments_remaining equals 4 before the completion, after the completion and
          after the void, and the void also removes the charge line it created.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case with one MAXILLARY arch delivered on 2026-05-01, so adjustments_used is 0 and adjustments_remaining is 4."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
