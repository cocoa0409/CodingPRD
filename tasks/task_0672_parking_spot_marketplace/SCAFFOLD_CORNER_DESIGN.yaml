  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_spot_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Spot.fields.host_id, "concurrency_rules[booking-create-stale-spot]"]
        distinguishing_aspect: "Spot.version increments by exactly 1 per booking created on it: starts 1, after one booking GET /spots shows version 2; the matching expected_spot_version then succeeds."
        test_recipe:
          setup: ["Spot S (version 1); one booking created."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "cc1@x.com", display_name: "CC1", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "ccd1@x.com", display_name: "CCD1" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 10000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZCC1", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
