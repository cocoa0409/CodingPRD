# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2484 — Home Improvement Pro Desk & Contractor Account
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Every money literal in `assert:` was computed by executing the referenced
# §1.3 formula against the pinned fixture inputs (integer cents, round_half_up).
# The logical clock starts at 2026-08-01T00:00:00Z (§1.5 POST /pro/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: tier_variant_divergence_pinned_vs_rolling_on_order_pricing
        grounds:
          - calculations.account_tier_determination
          - entities.ProAccount.fields.tier_review_mode
          - entities.ProOrder.fields.tier_code_applied
          - entities.ProOrder.fields.total_cents
          - state_machines.ProOrder.fulfillment_status.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Same stored data (baseline_volume_cents 4990000, one 100-unit line at list 1999) priced under
          PINNED_AT_REVIEW selects MEMBER (0%) and under ROLLING_365_INCLUSIVE selects GOLD (5%), so the
          two accounts' orders differ by exactly 10000 cents of discount and 10825 cents of total.
        test_recipe:
          setup:
            - "One store HD-101 (IL, MIDWEST, tax 0.0825) stocking SHINGLE-BUNDLE at list 1999 with 600 on hand."
            - "Two pro accounts, both with baseline_volume_cents 4990000 (10000 cents below the GOLD threshold of 5000000), one PINNED_AT_REVIEW and one ROLLING_365_INCLUSIVE."
            - "Each account has one DRAFT will-call, card-paid order carrying a single 100-unit SHINGLE-BUNDLE line."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Pinned Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 4990000 }
              as: PlatformAdmin
              captures: { acct_pinned_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Rolling Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "ROLLING_365_INCLUSIVE", baseline_volume_cents: 4990000 }
              as: PlatformAdmin
              captures: { acct_rolling_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_pinned_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_pinned_id}"
              captures: { order_pinned_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_pinned_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 100 }
              as: ContractorAdmin
              as_user_id: "${acct_pinned_id}"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_rolling_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_rolling_id}"
              captures: { order_rolling_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_rolling_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 100 }
              as: ContractorAdmin
              as_user_id: "${acct_rolling_id}"
          trigger:
            - call: "POST /pro/pro-orders/${order_pinned_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_pinned_id}"
            - call: "POST /pro/pro-orders/${order_rolling_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_rolling_id}"
          assert:
            - "ProOrder.${order_pinned_id}.tier_code_applied == MEMBER"
            - "ProOrder.${order_pinned_id}.subtotal_cents == 199900"
            - "ProOrder.${order_pinned_id}.discount_cents == 0"
            - "ProOrder.${order_pinned_id}.tax_cents == 16492"
            - "ProOrder.${order_pinned_id}.total_cents == 216392"
            - "ProOrder.${order_rolling_id}.tier_code_applied == GOLD"
            - "ProOrder.${order_rolling_id}.subtotal_cents == 189900"
            - "ProOrder.${order_rolling_id}.discount_cents == 10000"
            - "ProOrder.${order_rolling_id}.tax_cents == 15667"
            - "ProOrder.${order_rolling_id}.total_cents == 205567"
            - "ProAccount.${acct_pinned_id}.tier_code == MEMBER"
            - "ProAccount.${acct_rolling_id}.tier_code == MEMBER"

      - name: return_valuation_quoted_term_vs_current_list_divergence
        grounds:
          - calculations.return_refund_valuation
          - entities.ReturnRequest.fields.valuation_mode
          - entities.ReturnRequest.fields.refund_total_cents
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - entities.JobQuote.fields.term_end
        distinguishing_aspect: |
          Refund valuation on ReturnRequest (a different entity domain from order pricing): four units of
          the same fulfilled quote-bound line refund 5521 cents when approved inside the quote term
          (QUOTED_TERM, negotiated 1500/unit) and 6990 cents when approved after term_end (CURRENT_LIST,
          list 1999 less the account's GOLD 5% = 1899/unit).
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825) stocking SHINGLE-BUNDLE at list 1999, 600 on hand; GOLD account (baseline 6000000, PINNED_AT_REVIEW) with a 100000000-cent credit line."
            - "An ACCEPTED job quote for 8 units negotiated at 1500/unit; term_days capped to 30 by the GOLD tier, term_start 2026-08-01T00:00:00Z, term_end 2026-08-31T00:00:00Z."
            - "A quote-bound credit-line order for the same 8 units, submitted / reserved / staged / picked up on 2026-08-01, so fulfilled_at is 2026-08-01T00:00:00Z and fulfilled_units is 8."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
              captures: { stock_main_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Ridgeline Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 6000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "${acct_id}", limit_cents: 100000000, terms_days: 30 }
              as: CreditManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /pro/job-quotes"
              payload: { pro_account_id: "${acct_id}", originating_store_id: "${store_main_id}", job_name: "MAPLE-ST-REROOF", requested_term_days: 45 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_id: "$.data.id" }
            - call: "POST /pro/job-quotes/${quote_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 8 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { qline_id: "$.data.id" }
            - call: "POST /pro/job-quotes/${quote_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_v1: "$.data.version" }
            - call: "POST /pro/job-quotes/${quote_id}/counter-offers"
              payload: { line_prices: [{ quote_line_id: "${qline_id}", negotiated_unit_price_cents: 1500 }], term_days: 45, expected_job_quote_version: "${quote_v1}" }
              as: ProDeskAssociate
              as_user_id: "assoc-1"
            - call: "POST /pro/job-quotes/${quote_id}/approve"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
            - call: "POST /pro/job-quotes/${quote_id}/accept"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", job_quote_id: "${quote_id}", payment_method: "CREDIT_LINE", delivery_mode: "WILL_CALL", job_name: "MAPLE-ST-REROOF", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 8 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { oline_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
              captures: { resv_id: "$.data[0].id" }
            - call: "POST /pro/reservations/${resv_id}/allocate"
              payload: {}
              as: StoreOperations
              as_user_id: "ops-1"
            - call: "POST /pro/will-call-stagings"
              payload: { pro_order_id: "${order_id}", store_id: "${store_main_id}", stage_start: "2026-08-01T08:00:00Z", stage_hours: 6 }
              as: StoreOperations
              as_user_id: "ops-1"
              captures: { staging_id: "$.data.id" }
            - call: "POST /pro/will-call-stagings/${staging_id}/stage"
              payload: {}
              as: StoreOperations
              as_user_id: "ops-1"
            - call: "POST /pro/will-call-stagings/${staging_id}/pick-up"
              payload: { picked_up_by: "Crew A" }
              as: StoreOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /pro/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pro/return-requests"
              payload: { pro_order_id: "${order_id}", reason_code: "OVER_ORDERED", lines: [{ order_line_id: "${oline_id}", qty_units: 4 }] }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { ret_a_id: "$.data.id" }
            - call: "POST /pro/return-requests/${ret_a_id}/approve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
            - call: "POST /pro/return-requests/${ret_a_id}/credit"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
            - call: "POST /pro/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pro/return-requests"
              payload: { pro_order_id: "${order_id}", reason_code: "OVER_ORDERED", lines: [{ order_line_id: "${oline_id}", qty_units: 4 }] }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { ret_b_id: "$.data.id" }
            - call: "POST /pro/return-requests/${ret_b_id}/approve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
          assert:
            - "ReturnRequest.${ret_a_id}.valuation_mode == QUOTED_TERM"
            - "ReturnRequest.${ret_a_id}.gross_refund_cents == 6000"
            - "ReturnRequest.${ret_a_id}.restocking_fee_pct == 0.15"
            - "ReturnRequest.${ret_a_id}.restocking_fee_cents == 900"
            - "ReturnRequest.${ret_a_id}.tax_refund_cents == 421"
            - "ReturnRequest.${ret_a_id}.refund_total_cents == 5521"
            - "ReturnRequest.${ret_b_id}.valuation_mode == CURRENT_LIST"
            - "ReturnRequest.${ret_b_id}.gross_refund_cents == 7596"
            - "ReturnRequest.${ret_b_id}.restocking_fee_cents == 1139"
            - "ReturnRequest.${ret_b_id}.tax_refund_cents == 533"
            - "ReturnRequest.${ret_b_id}.refund_total_cents == 6990"
            - "ReturnRequest.${ret_b_id}.refund_total_cents - ReturnRequest.${ret_a_id}.refund_total_cents == 1469"

  - rule_id: combinatorial_formula
    instances:

      - name: per_unit_rounding_pinned_before_multiply_mode_b
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.effective_unit_price_cents
          - entities.OrderLine.fields.line_subtotal_cents
          - entities.ProOrder.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding order: list 1999 at the PLATINUM 8% discount over 7 units must yield
          round_half_up(1839.08) * 7 = 12873, never round_half_up(13993 * 0.92) = 12874 — a one-cent
          divergence that only the pinned round-then-multiply order produces.
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825) stocking SHINGLE-BUNDLE at list 1999."
            - "A PLATINUM account (baseline_volume_cents 20000000, PINNED_AT_REVIEW) with one DRAFT will-call card order carrying a single 7-unit line."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Platinum Builders", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 20000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 7 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { oline_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          assert:
            - "ProOrder.${order_id}.tier_code_applied == PLATINUM"
            - "OrderLine.${oline_id}.effective_unit_price_cents == 1839"
            - "OrderLine.${oline_id}.line_subtotal_cents == 12873"
            - "ProOrder.${order_id}.list_subtotal_cents == 13993"
            - "ProOrder.${order_id}.subtotal_cents == 12873"
            - "ProOrder.${order_id}.subtotal_cents != 12874"
            - "ProOrder.${order_id}.discount_cents == 1120"
            - "ProOrder.${order_id}.tax_cents == 1062"
            - "ProOrder.${order_id}.total_cents == 13935"

      - name: freight_waiver_keyed_on_pre_surcharge_subtotal_mode_c
        grounds:
          - calculations.order_total_assembly
          - entities.ProOrder.fields.freight_surcharge_cents
          - entities.ProOrder.fields.lift_gate_fee_cents
          - entities.ProOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the freight waiver is tested against subtotal_cents
          only, so a 132-unit delivery totals 276219 while a smaller 131-unit delivery totals 283798 —
          the smaller order is more expensive, and the lift-gate fee 4500 survives the waiver in both.
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825, lift_gate_available true) stocking SHINGLE-BUNDLE at list 1999 with 600 on hand."
            - "A GOLD account (baseline 6000000, PINNED_AT_REVIEW), two DRAFT delivery orders with lift_gate_required true, one carrying 132 units and one carrying 131 units."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Ridgeline Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 6000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "DELIVERY", lift_gate_required: true, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_big_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_big_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 132 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "DELIVERY", lift_gate_required: true, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_small_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_small_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 131 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /pro/pro-orders/${order_big_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_small_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          assert:
            - "ProOrder.${order_big_id}.subtotal_cents == 250668"
            - "ProOrder.${order_big_id}.freight_surcharge_cents == 0"
            - "ProOrder.${order_big_id}.lift_gate_fee_cents == 4500"
            - "ProOrder.${order_big_id}.tax_cents == 21051"
            - "ProOrder.${order_big_id}.total_cents == 276219"
            - "ProOrder.${order_small_id}.subtotal_cents == 248769"
            - "ProOrder.${order_small_id}.freight_surcharge_cents == 8900"
            - "ProOrder.${order_small_id}.lift_gate_fee_cents == 4500"
            - "ProOrder.${order_small_id}.tax_cents == 21629"
            - "ProOrder.${order_small_id}.total_cents == 283798"
            - "ProOrder.${order_small_id}.total_cents > ProOrder.${order_big_id}.total_cents"

  - rule_id: non_linear_state_machine
    instances:

      - name: job_quote_negotiation_cycle_countered_back_to_submitted
        grounds:
          - state_machines.JobQuote.SUBMITTED_to_COUNTERED
          - state_machines.JobQuote.COUNTERED_to_SUBMITTED
          - entities.JobQuote.fields.round_count
          - entities.JobQuote.fields.revision_count
          - concurrency_rules[counter-offer-stale-quote]
        distinguishing_aspect: |
          JobQuote cycles SUBMITTED -> COUNTERED -> SUBMITTED -> COUNTERED, so round_count reaches 2 and
          revision_count reaches 1 on the same row — a loop no linear pipeline can produce; the second
          counter-offer supersedes the first round's negotiated prices (10400 -> 12000).
        test_recipe:
          setup:
            - "Store HD-101 stocking SHINGLE-BUNDLE at list 1999; GOLD account (baseline 6000000)."
            - "A quote for 8 units, SUBMITTED (list_subtotal 15992)."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Ridgeline Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 6000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/job-quotes"
              payload: { pro_account_id: "${acct_id}", originating_store_id: "${store_main_id}", job_name: "MAPLE-ST-REROOF", requested_term_days: 45 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_id: "$.data.id" }
            - call: "POST /pro/job-quotes/${quote_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 8 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { qline_id: "$.data.id" }
            - call: "POST /pro/job-quotes/${quote_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_v1: "$.data.version" }
          trigger:
            - call: "POST /pro/job-quotes/${quote_id}/counter-offers"
              payload: { line_prices: [{ quote_line_id: "${qline_id}", negotiated_unit_price_cents: 1300 }], term_days: 45, expected_job_quote_version: "${quote_v1}" }
              as: ProDeskAssociate
              as_user_id: "assoc-1"
              captures: { quote_v2: "$.data.version", depth_round1: "$.data.discount_depth_pct" }
            - call: "POST /pro/job-quotes/${quote_id}/revise"
              payload: { revision_note: "1300 is under our cost basis; re-price at 1500" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_v3: "$.data.version" }
