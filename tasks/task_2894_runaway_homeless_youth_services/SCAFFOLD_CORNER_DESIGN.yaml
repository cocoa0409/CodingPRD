            - "TlpPlacement.${exi_plc_id}.exited_at == 2026-08-01T00:00:00Z"
            - "ShelterProgram.${exi_tlp_id}.occupied_beds == 0"
            - "ShelterProgram.${exi_tlp_id}.utilization_bp == 0"
            - "Youth.${exi_youth_id}.status == EXITED"

      - name: decided_proposal_rejects_a_second_close_vote
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=17]
          - errors.ERR_PROPOSAL_ALREADY_DECIDED
          - calculations.governance_adoption_tally
        distinguishing_aspect: "REJECTED is terminal for a GovernanceProposal: with an electorate of 1 and a single SUPPORT vote the ratio is 10000 bp but support_vote_count 1 is below ADOPTION_MIN_SUPPORT 2, so the first close-vote REJECTS, and the replay returns 409 ERR_PROPOSAL_ALREADY_DECIDED without re-freezing the frozen tally."
        test_recipe:
          setup:
            - "youth Suri Baptiste with one outreach contact (so governance_vote_eligible becomes true on admission) and an ACTIVE admission at the shelter, making the electorate exactly one youth"
            - "a HOUSE_RULES proposal open until 2026-08-20T00:00:00Z, with one SUPPORT vote cast by that youth, closed once by admin-1"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { gov_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Suri", legal_last_name: "Baptiste", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { gov_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${gov_youth_id}/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${gov_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { gov_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${gov_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${gov_youth_id}", program_id: "${gov_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { gov_adm_id: $.data.id }
            - call: "POST /ryhs/shelter-programs/${gov_program_id}/governance-proposals"
              payload: { title: "Quiet hours after 22:00", category: "HOUSE_RULES", voting_closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { gov_prop_id: $.data.id }
            - call: "POST /ryhs/governance-proposals/${gov_prop_id}/votes"
              payload: { stance: "SUPPORT" }
              as: YouthMember
              as_user_id: "${gov_youth_id}"
              captures: { gov_vote_id: $.data.id }
            - call: "POST /ryhs/governance-proposals/${gov_prop_id}/close-vote"
