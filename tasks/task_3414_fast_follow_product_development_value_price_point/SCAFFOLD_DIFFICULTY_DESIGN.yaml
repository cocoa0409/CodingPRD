            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - *k_partner
            - *k_lr
            - *k_clock2
            - *k_lr_open
            - *k_slot
            - call: "GET /line-reviews/${lr_id}"
              payload: {}
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr_v3: $.data.version }
          trigger:
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A1", facings: 2, occupancy_start: "2027-02-14T00:00:00Z", occupancy_end: "2027-03-31T00:00:00Z", expected_line_review_version: "${lr_v3}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { s2_ok_id: $.data.id }
            - call: "GET /line-reviews/${lr_id}"
              payload: {}
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr_v4: $.data.version }
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A1", facings: 2, occupancy_start: "2027-02-13T00:00:00Z", occupancy_end: "2027-03-31T00:00:00Z", expected_line_review_version: "${lr_v4}" }
              as: RetailPlanner
