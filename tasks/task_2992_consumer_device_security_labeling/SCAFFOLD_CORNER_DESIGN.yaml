# §1.9 Scaffold Corner Design — breadth coverage index for task 2992
# Taxonomy: references/claim-extraction-guide.md (nine sections, per-section claim_type rows).
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; §1.8 corners are stubbed, not repeated.
scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_program_tier_persists_every_declared_input_field
        claim_type: Creation
        grounds:
          - entities.ProgramTier
          - endpoints[POST /labeling/program-tiers]
        distinguishing_aspect: "A POST carrying all seven declared ProgramTier input fields returns 201 and echoes each one unchanged plus the system-owned id/created_at/version, so no declared input field is silently dropped."
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "ProgramTier.${tier1_id}.tier_code == TIER_1"
            - "ProgramTier.${tier1_id}.required_route == SELF_ATTESTATION"
            - "ProgramTier.${tier1_id}.label_validity_days == 365"
            - "ProgramTier.${tier1_id}.min_overall_score == 70.00"
            - "ProgramTier.${tier1_id}.unverified_weight_factor == 0.60"
            - "ProgramTier.${tier1_id}.issuance_base_fee_cents == 40000"
            - "ProgramTier.${tier1_id}.max_deficiency_rounds == 2"
            - "ProgramTier.${tier1_id}.version == 1 and created_at and updated_at are non-null"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: retrieval_product_returns_stored_representation_after_create
        claim_type: Retrieval
        grounds:
          - entities.Product
          - endpoints[GET /labeling/products/{id}]
        distinguishing_aspect: "GET /labeling/products/{id} returns byte-identical stored values for every input field of the created Product, proving the read path is not recomputing model_name/sku/firmware_version."
        test_recipe:
          setup:
            - "One ELIGIBLE device category on TIER_1 and one SMALL manufacturer exist; that manufacturer registered product SPK-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
              captures: { cat_ok_id: "$.data.id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_ok_id}", model_name: "Speaker One", sku: "SPK-001", firmware_version: "1.0.0", declared_support_period_end: "2029-08-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
          trigger:
            - call: "GET /labeling/products/${product_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "HTTP status is 200"
            - "Product.${product_id}.model_name == Speaker One"
            - "Product.${product_id}.sku == SPK-001"
            - "Product.${product_id}.firmware_version == 1.0.0"
            - "Product.${product_id}.declared_support_period_end == 2029-08-01T00:00:00.000Z"
            - "Product.${product_id}.update_policy_disclosed == true"
            - "Product.${product_id}.retail_units_shipped == 1000"
            - "Product.${product_id}.manufacturer_id == ${mfr_id} and device_category_id == ${cat_ok_id}"

      - name: listing_device_categories_of_a_tier_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /labeling/program-tiers/{id}/device-categories]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three categories on one tier, limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, while limit=2&offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "TIER_1 exists with exactly three device categories attached."
          setup_api_calls:
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_LOCK", display_name: "Smart Lock", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_CAMERA", display_name: "Smart Camera", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 365 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /labeling/program-tiers/${tier1_id}/device-categories"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdministrator
            - call: "GET /labeling/program-tiers/${tier1_id}/device-categories"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdministrator
          assert:
            - "first response: response_type == array, 2 items returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second response: 1 item returned, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "the union of the two pages contains each of SMART_SPEAKER, SMART_LOCK and SMART_CAMERA exactly once"

      - name: listing_security_criteria_filter_and_pagination_interact
        claim_type: Listing
        grounds:
          - endpoints[GET /labeling/security-criteria]
          - entities.SecurityCriterion.fields.practice_area
        distinguishing_aspect: "practice_area=AUTHENTICATION narrows a four-criterion catalogue to total_count 1 while requires_lab_verification=true narrows it to total_count 1 for a different row, so the filters are applied before the page window rather than after."
        test_recipe:
          setup:
            - "A four-criterion catalogue with one criterion per practice area; only DAT-1 requires lab verification."
          setup_api_calls:
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 10, requires_lab_verification: false, criterion_text: "Unique per-device credentials" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 10, requires_lab_verification: false, criterion_text: "Signed firmware updates" }, { criterion_code: "DAT-1", practice_area: "DATA_PROTECTION", weight: 10, requires_lab_verification: true, criterion_text: "Encryption of data at rest" }, { criterion_code: "VLN-1", practice_area: "VULN_DISCLOSURE", weight: 10, requires_lab_verification: false, criterion_text: "Published disclosure contact" } ] }
              as: ProgramAdministrator
          trigger:
            - call: "GET /labeling/security-criteria"
              payload: { practice_area: "AUTHENTICATION" }
              as: Consumer
            - call: "GET /labeling/security-criteria"
              payload: { requires_lab_verification: true }
              as: Consumer
            - call: "GET /labeling/security-criteria"
              payload: { limit: 3, offset: 0 }
              as: Consumer
          assert:
            - "first response: total_count == 1 and the single row's criterion_code == AUTH-1"
            - "second response: total_count == 1 and the single row's criterion_code == DAT-1"
            - "third response: 3 items returned, total_count == 4, has_more == true"

      - name: not_found_unknown_assessment_id_on_read
        claim_type: Not Found
        grounds:
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A syntactically valid but unknown ConformanceAssessment id on GET returns ERR_ASSESSMENT_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock position."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /labeling/assessments/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_ASSESSMENT_NOT_FOUND"
            - "response_type == error"

      - name: required_fields_missing_declared_support_period_end_on_product_create
        claim_type: Required Fields
        grounds:
          - entities.Product.fields.declared_support_period_end
          - validations[priority=31]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Sending declared_support_period_end as an explicit null on POST /labeling/products returns ERR_INVALID_REQUEST (422) and creates no Product row, so the field is required at the request boundary rather than defaulted or left empty."
        test_recipe:
          setup:
            - "TIER_1, an ELIGIBLE category and a SMALL manufacturer exist; no products yet."
          setup_api_calls:
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
              captures: { cat_ok_id: "$.data.id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
          trigger:
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_ok_id}", model_name: "Speaker One", sku: "SPK-001", firmware_version: "1.0.0", declared_support_period_end: null, update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /labeling/products"
              payload: { manufacturer_id: "${mfr_id}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "first response HTTP status is 422 with data.error_id == ERR_INVALID_REQUEST"
            - "second response: total_count == 0"

      - name: defaults_optional_exclusion_reason_and_pagination_defaults
        claim_type: Defaults
        grounds:
          - entities.DeviceCategory.fields.exclusion_reason
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Omitting the optional exclusion_reason on an ELIGIBLE category leaves it null, and omitting limit/offset on a list read applies limit 10 / offset 0 rather than returning all rows."
        test_recipe:
          setup:
            - "TIER_1 exists with one ELIGIBLE category created without exclusion_reason."
          setup_api_calls:
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
          trigger:
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
              captures: { cat_ok_id: "$.data.id" }
            - call: "GET /labeling/program-tiers/${tier1_id}/device-categories"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "DeviceCategory.${cat_ok_id}.exclusion_reason == null"
            - "DeviceCategory.${cat_ok_id}.eligibility_status == ELIGIBLE"
            - "second response: limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: defaults_manufacturer_penalty_ledger_zeroed_with_standing_good
        claim_type: Defaults
        grounds:
          - entities.Manufacturer.fields.standing
          - calculations.manufacturer_penalty_ledger
          - endpoints[POST /labeling/manufacturers]
        distinguishing_aspect: "A freshly created Manufacturer reports standing GOOD with all five ledger counters at 0 even though none of them appear in the request body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
          assert:
            - "Manufacturer.${mfr_id}.standing == GOOD"
            - "Manufacturer.${mfr_id}.outstanding_penalty_cents == 0"
            - "Manufacturer.${mfr_id}.paid_penalty_cents == 0"
            - "Manufacturer.${mfr_id}.vacated_penalty_cents == 0"
            - "Manufacturer.${mfr_id}.total_assessed_penalty_cents == 0"
            - "Manufacturer.${mfr_id}.upheld_case_count == 0"

      - name: computed_fields_product_eligibility_mirrors_category_and_spec_revision_starts_at_one
        claim_type: Computed Fields
        grounds:
          - entities.Product.fields.eligibility_status
          - entities.Product.fields.spec_revision
          - entities.Product.fields.conformance_currency
        distinguishing_aspect: "Two products created with identical bodies but different device categories report eligibility_status ELIGIBLE and EXCLUDED respectively, and both start at spec_revision 1 / conformance_currency CURRENT without either field appearing in the request."
        test_recipe:
          setup:
            - "TIER_1 carries one ELIGIBLE category (SMART_SPEAKER) and one EXCLUDED category (MEDICAL_IMPLANT); one SMALL manufacturer exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
              captures: { cat_ok_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "MEDICAL_IMPLANT", display_name: "Regulated Medical Implant", eligibility_status: "EXCLUDED", program_tier_id: "${tier1_id}", min_support_period_days: 180, exclusion_reason: "Regulated as a medical device outside program scope" }
              as: ProgramAdministrator
              captures: { cat_excluded_id: "$.data.id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
          trigger:
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_ok_id}", model_name: "Speaker One", sku: "SPK-001", firmware_version: "1.0.0", declared_support_period_end: "2029-08-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_ok_id: "$.data.id" }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_excluded_id}", model_name: "Pacer X", sku: "MED-001", firmware_version: "1.0.0", declared_support_period_end: "2029-08-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_excluded_id: "$.data.id" }
          assert:
            - "Product.${product_ok_id}.eligibility_status == ELIGIBLE"
            - "Product.${product_excluded_id}.eligibility_status == EXCLUDED"
            - "Product.${product_ok_id}.spec_revision == 1 and Product.${product_excluded_id}.spec_revision == 1"
            - "Product.${product_ok_id}.conformance_currency == CURRENT"
            - "Product.${product_ok_id}.last_change_summary == null"

      - name: computed_fields_test_lab_bench_ledger_initialised_from_total_hours
        claim_type: Computed Fields
        grounds:
          - entities.TestLab.fields.reserved_bench_hours
          - entities.TestLab.fields.available_bench_hours
          - calculations.lab_bench_hour_ledger
        distinguishing_aspect: "A newly created TestLab with total_bench_hours 200 reports reserved_bench_hours 0 and available_bench_hours 200, so the ledger is derived from the empty reserving set rather than left null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /labeling/test-labs"
              payload: { lab_name: "Northline Labs", accreditation_status: "ACCREDITED", total_bench_hours: 200, concurrent_bench_capacity: 2 }
              as: ProgramAdministrator
              captures: { lab_id: "$.data.id" }
          assert:
            - "TestLab.${lab_id}.reserved_bench_hours == 0"
            - "TestLab.${lab_id}.available_bench_hours == 200"
            - "TestLab.${lab_id}.reserved_bench_hours + TestLab.${lab_id}.available_bench_hours == 200"

      - name: system_fields_scannable_code_and_audit_timestamps_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.LabelGrant.fields.scannable_code
          - endpoints[POST /labeling/label-grants]
        distinguishing_aspect: "POST /labeling/label-grants accepts only product_id and assessment_id yet the created grant carries a 16-character server-minted scannable_code plus id/created_at/updated_at/version, none of which the client can supply."
        test_recipe:
          setup:
            - "An APPROVED SELF_ATTESTATION assessment exists for an ELIGIBLE product of a GOOD-standing manufacturer at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 180 }
              as: ProgramAdministrator
              captures: { cat_ok_id: "$.data.id" }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 10, requires_lab_verification: false, criterion_text: "Unique per-device credentials" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 10, requires_lab_verification: false, criterion_text: "Signed firmware updates" }, { criterion_code: "DAT-1", practice_area: "DATA_PROTECTION", weight: 10, requires_lab_verification: false, criterion_text: "Encryption of data at rest" }, { criterion_code: "VLN-1", practice_area: "VULN_DISCLOSURE", weight: 10, requires_lab_verification: false, criterion_text: "Published disclosure contact" } ] }
              as: ProgramAdministrator
              captures: { auth1_id: "$.data[0].id", upd1_id: "$.data[1].id", dat1_id: "$.data[2].id", vln1_id: "$.data[3].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_ok_id}", model_name: "Speaker One", sku: "SPK-001", firmware_version: "1.0.0", declared_support_period_end: "2029-08-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id", product_v1: "$.data.version" }
            - call: "POST /labeling/products/${product_id}/assessments"
              payload: { expected_product_version: "${product_v1}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /labeling/assessments/${asmt_id}/responses"
              payload: { responses: [ { criterion_id: "${auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH-1" }, { criterion_id: "${upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD-1" }, { criterion_id: "${dat1_id}", self_declared_conformant: true, evidence_ref: "EV-DAT-1" }, { criterion_id: "${vln1_id}", self_declared_conformant: true, evidence_ref: "EV-VLN-1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /labeling/assessments/${asmt_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /labeling/assessments/${asmt_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "All four practice areas self-declared conformant" }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /labeling/label-grants"
              payload: { product_id: "${product_id}", assessment_id: "${asmt_id}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { grant_id: "$.data.id", grant_code: "$.data.scannable_code" }
          assert:
            - "HTTP status is 201"
            - "LabelGrant.${grant_id}.scannable_code is a non-null 16-character string"
            - "LabelGrant.${grant_id}.grant_status == PENDING_REGISTRY"
            - "LabelGrant.${grant_id}.registry_publication_status == DRAFT"
