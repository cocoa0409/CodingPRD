  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: displayed_count_conserved_across_restore_remove
        grounds:
          - calculations.displayed_rating_average
          - state_machines.Complaint.UNDER_REVIEW_to_RESOLVED_ACTIONED
        distinguishing_aspect: |
          Conserved quantity: BusinessPage.displayed_review_count must always
          equal the true count of DISPLAYED reviews. Forward action
          RESTORE_REVIEW (+1) followed by compensating REMOVE_REVIEW (-1) on the
          same review returns count AND average to their exact pre-complaint
          values — no drift in either conserved field.
        test_recipe:
          setup:
            - "Clock 2026-09-01; author UA trust 100 posts rating-4 review R1 on P1 -> DISPLAYED; then trust dropped to 50 and re-evaluated -> FILTERED (count back to 0, avg 0)"
            - "Owner UO claims P1, files FILTERED_DISPUTE CM1, CM1 UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ia@x.com", display_name: "Inv Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { ia_id: $.data.id }
            - call: "POST /platform/users/${ia_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "io@x.com", display_name: "Inv Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { io_id: $.data.id }
