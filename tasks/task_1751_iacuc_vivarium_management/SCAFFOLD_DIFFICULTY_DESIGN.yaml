      - name: billing_period_adjacency_exclusive_end
        grounds:
          - calculations.per_diem_billing
          - entities.BillingRun.fields.period_end
        distinguishing_aspect: |
          Adjacent-interval semantics on BillingRun (a different resource than
          rooms and a different geometric rule — no buffer, period_end
