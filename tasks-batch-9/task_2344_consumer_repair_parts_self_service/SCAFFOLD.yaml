scenario: "2344. Consumer Repair Parts & Self-Service Repair Program (consumer electronics manufacturer): parts catalog definition with repairability tiers and safety-restricted component policies, pricing structure across parts, tools and rental kits with core return credits, repair manual and guide publication with revision control by model, self-repair eligibility, warranty impact disclosure and liability warnings, parts authentication and calibration requirements after component replacement, independent repair provider authorization with training and parts access terms, regional right-to-repair law compliance on parts availability duration and documentation, defective part return, failure analysis and inventory forecasting for long-tail models"
domain_name: consumer-repair-parts-self-service
api_prefix: /repair-program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  # PartCatalogItem <-> ProductModel is many-to-many through PartModelCompatibility;
  # PartCatalogItem.supersedes_part_id is self-referential; PartsOrder joins
  # EligibilityAssessment + ProductModel + RepairProvider + ManualRevision across
  # aggregate boundaries. No single ownership tree exists.

  state_machine_shape: parallel
  # PartsOrder carries two independent dimensions (fulfillment_status x
  # core_return_status); PartsOrderLine carries two more (authentication_status x
  # calibration_status, the latter cyclic on retry); ManualRevision is cyclic
  # (IN_REVIEW -> DRAFT -> IN_REVIEW); RepairProvider is cyclic (AUTHORIZED ->
  # SUSPENDED -> AUTHORIZED); ComplianceObligation is compound over model children.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A ManualRevision author may not approve their own revision; the failure-analysis
  # engineer who recorded the root cause may not issue the credit for that case.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 72 endpoints / 66 error codes / 15 calculations (4 with variants) /
  # 8 state machines (2 cyclic, 3 with parallel dimensions, 1 compound) /
  # 2 OCC rules / 56 ordered validations / 2 conservation invariants /
  # 2 multi-hop cascades (depth 4 each, one of them conditional).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Manufacturer model code, globally unique
        constraints: unique; 3-32 chars
      - name: product_family
        type: string
        source: input
        description: Marketing family the model belongs to
      - name: market_release_date
        type: datetime
        source: input
        description: First retail availability date (ISO 8601 UTC)
      - name: end_of_production_date
        type: datetime
        source: input
        description: Date the last unit left the line; null while in production
        default: null
      - name: last_hardware_change_date
        type: datetime
        source: input
        description: Date of the last board/enclosure revision; used by documentation staleness
        default: null
      - name: repairability_tier
        type: enum
        source: input
        description: Repairability tier driving self-repair eligibility and price surcharge
        constraints: TIER_A_SELF_SERVICE | TIER_B_GUIDED | TIER_C_AUTHORIZED_ONLY | TIER_D_NON_SERVICEABLE
      - name: support_state
        type: enum
        source: system
        description: Lifecycle dimension of the model
        default: ACTIVE_PRODUCTION
        constraints: ACTIVE_PRODUCTION | LEGACY_SUPPORT | SUPPORT_ENDED
      - name: support_end_date
        type: datetime
        source: system
        description: Set by POST /product-models/{model_id}/end-support
        default: null
      - name: documentation_posture
        type: enum
        source: computed
        description: "Derived by calculations.documentation_posture_rollup from this model's ManualRevision rows and PartModelCompatibility coverage"
        default: MISSING
        constraints: CURRENT | STALE | MISSING
      - name: published_disassembly_revision_number
        type: integer
        source: computed
        description: revision_number of the ManualRevision row with doc_type=DISASSEMBLY_GUIDE and status=PUBLISHED for this model; null when none
        default: null
      - name: published_safety_sheet_revision_number
        type: integer
        source: computed
        description: revision_number of the ManualRevision row with doc_type=SAFETY_SHEET and status=PUBLISHED for this model; null when none
        default: null
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived by calculations.model_compliance_posture_rollup from this model's ComplianceObligation children; ORDER_RESTRICTED gates POST request-disclosure and POST confirm"
        default: OPEN
        constraints: OPEN | WATCH | ORDER_RESTRICTED
      - name: open_obligation_count
        type: integer
        source: computed
        description: Count of ComplianceObligation rows for this model whose status is in {OPEN, AT_RISK, ATTESTED}
        default: 0

  - name: RegionalComplianceProfile
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: Right-to-repair jurisdiction key, unique; child rows join on this natural key (not on id)
        constraints: unique; 2-8 uppercase chars
      - name: min_parts_availability_years
        type: integer
        source: input
        description: Years after end of production during which parts must remain orderable
        constraints: 0-15
      - name: min_documentation_years
        type: integer
        source: input
        description: Years after end of production during which manuals must remain published
        constraints: 0-15
      - name: requires_public_manual
        type: boolean
        source: input
        description: When true, documentation must be free of charge; documentation_fee_cents is forced to 0
      - name: max_documentation_fee_cents
        type: integer
        source: input
        description: Statutory cap on the per-order documentation fee
        constraints: ">= 0"
      - name: allows_pairing_restriction
        type: boolean
        source: input
        description: When false, PAIRED_SECURITY parts are treated as UNRESTRICTED for self-repair eligibility
      - name: self_service_mandate_tier
        type: enum
        source: input
        description: Strength of the local self-service mandate
        constraints: MANDATE_NONE | MANDATE_BASIC | MANDATE_FULL

  - name: ComplianceObligation
    parent: ProductModel
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: FK -> ProductModel.id; the model the obligation covers
      - name: region_code
        type: string
        source: input
        description: Region key; MUST equal an existing RegionalComplianceProfile.region_code else ERR_REGION_PROFILE_NOT_FOUND
      - name: parts_available_until
        type: datetime
        source: computed
        description: "Computed by calculations.mandated_support_window; null while deadline_basis=PRODUCTION_ACTIVE"
        default: null
      - name: documentation_available_until
        type: datetime
        source: computed
        description: "Computed by calculations.mandated_support_window; null while deadline_basis=PRODUCTION_ACTIVE"
        default: null
      - name: deadline_basis
        type: enum
        source: computed
        description: PRODUCTION_ACTIVE when the model has no end_of_production_date, else END_OF_PRODUCTION
        constraints: PRODUCTION_ACTIVE | END_OF_PRODUCTION
      - name: status
        type: enum
        source: system
        description: "Obligation posture recomputed by calculations.obligation_status_evaluation on create, on attest, on compliance sweep, and on documentation-posture cascades"
        default: OPEN
        constraints: OPEN | AT_RISK | BREACHED_PARTS | BREACHED_DOCUMENTATION | ATTESTED | CLOSED
      - name: documentation_verified
        type: boolean
        source: system
        description: Set from the attest call body
        default: false
      - name: last_attested_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent attest call
        default: null
      - name: last_attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who attested
        default: null
      - name: breach_count
        type: integer
        source: system
        description: Incremented by one each time an evaluation lands on BREACHED_PARTS or BREACHED_DOCUMENTATION
        default: 0

  - name: PartCatalogItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Catalog SKU, globally unique
        constraints: unique; 3-32 chars
      - name: part_class
        type: enum
        source: input
        description: Commercial class of the catalog line
        constraints: COMPONENT | TOOL | RENTAL_KIT | CONSUMABLE
      - name: safety_class
        type: enum
        source: input
        description: Safety/authentication restriction policy for the part
        constraints: UNRESTRICTED | SAFETY_RESTRICTED_BATTERY | SAFETY_RESTRICTED_HIGH_VOLTAGE | PAIRED_SECURITY
      - name: list_price_cents
        type: integer
        source: input
        description: Undiscounted unit list price in cents
        constraints: ">= 0"
      - name: core_return_required
        type: boolean
        source: input
        description: When true, ordering the part places a refundable core deposit and opens a core return obligation
        default: false
      - name: core_credit_cents
        type: integer
        source: input
        description: Face value of the core return credit per unit
        default: 0
      - name: rental_deposit_cents
        type: integer
        source: input
        description: Per-unit deposit charged for part_class=RENTAL_KIT lines
        default: 0
      - name: concurrent_rental_capacity
        type: integer
        source: input
        description: Number of kits in the rental pool; null for non-rental classes
        default: null
      - name: requires_authentication
        type: boolean
        source: input
        description: When true, a delivered line mints a pairing_token and must be authenticated
        default: false
      - name: requires_calibration
        type: boolean
        source: input
        description: When true, a delivered line must pass calibration after replacement
        default: false
      - name: supersedes_part_id
        type: string
        source: input
        description: FK -> PartCatalogItem.id; the predecessor SKU this part replaces; null for original parts
        default: null
      - name: status
        type: enum
        source: system
        description: Catalog lifecycle state
        default: DRAFT
        constraints: DRAFT | PUBLISHED | RESTRICTED | SUPERSEDED
      - name: restriction_reason
        type: string
        source: system
        description: Reason recorded by POST /part-catalog-items/{part_id}/restrict
        default: null
      - name: core_face_value_committed_cents
        type: integer
        source: computed
        description: "Running total of core face value ever committed by confirmed orders for this part; decremented only by the cancel compensation (see calculations.core_liability_conservation)"
        default: 0
      - name: core_liability_outstanding_cents
        type: integer
        source: computed
        description: Committed core face value not yet settled, forfeited, or released
        default: 0
      - name: core_credit_settled_cents
        type: integer
        source: computed
        description: Cumulative core credit actually paid out for this part
        default: 0
      - name: core_credit_forfeited_cents
        type: integer
        source: computed
        description: Cumulative core face value forfeited for this part
        default: 0

  - name: PartModelCompatibility
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> PartCatalogItem.id; the part being fitted
      - name: model_id
        type: string
        source: input
        description: FK -> ProductModel.id; the model the part fits
      - name: required_tool_part_id
        type: string
        source: input
        description: FK -> PartCatalogItem.id; tool or rental kit required to install; null when no tool is needed
        default: null
      - name: self_service_eligible
        type: boolean
        source: input
        description: Whether an unassisted consumer may install this part on this model
      - name: install_minutes
        type: integer
        source: input
        description: Documented bench time for the replacement
        constraints: 1-600
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the compatibility window
      - name: effective_until
        type: datetime
        source: input
        description: Exclusive end of the compatibility window; null means open-ended
        default: null
      - name: superseded_by_safety_restriction
        type: boolean
        source: system
        description: Set true when a safety restriction on the part forced self_service_eligible to false
        default: false

  - name: ManualRevision
    parent: ProductModel
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: FK -> ProductModel.id; the model this document revision covers
      - name: doc_type
        type: enum
        source: input
        description: Document family under revision control
        constraints: DISASSEMBLY_GUIDE | SAFETY_SHEET | CALIBRATION_PROCEDURE | PARTS_LIST
      - name: revision_number
        type: integer
        source: system
        description: Server-assigned as max(revision_number) for the same (model_id, doc_type) plus one, starting at 1
      - name: covered_part_skus
        type: array
        source: input
        description: SKU strings the revision documents; drives documentation coverage gap detection
      - name: safety_warning_count
        type: integer
        source: input
        description: Number of liability warnings in the revision; drives the documentation fee
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Revision control state
        default: DRAFT
        constraints: DRAFT | IN_REVIEW | APPROVED | PUBLISHED | SUPERSEDED
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator; the segregation-of-duties subject
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyReviewer who approved or rejected
        default: null
      - name: rejection_cycle_count
        type: integer
        source: system
        description: Number of times this revision has gone IN_REVIEW -> DRAFT
        default: 0
      - name: effective_from
        type: datetime
        source: system
        description: Publication effective instant; defaults to the logical clock at publish
        default: null
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication
        default: null
      - name: coverage_gap_sku_count
        type: integer
        source: computed
        description: "Count of PUBLISHED PartCatalogItem SKUs with an in-window compatibility row for the model that are absent from covered_part_skus (see calculations.documentation_posture_rollup)"
        default: 0

  - name: EligibilityAssessment
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: FK -> ProductModel.id; model being repaired
      - name: part_id
        type: string
        source: input
        description: FK -> PartCatalogItem.id; part the requester wants to install
      - name: provider_id
        type: string
        source: input
        description: FK -> RepairProvider.id; set only when requester_class=AUTHORIZED_PROVIDER
        default: null
      - name: pinned_manual_revision_id
        type: string
        source: computed
        description: FK -> ManualRevision.id; the PUBLISHED DISASSEMBLY_GUIDE revision observed at assessment time; null when none was published
        default: null
      - name: region_code
        type: string
        source: input
        description: Region key; MUST equal an existing RegionalComplianceProfile.region_code else ERR_REGION_PROFILE_NOT_FOUND
      - name: requester_class
        type: enum
        source: input
        description: Who intends to perform the repair
        constraints: SELF_REPAIR_CONSUMER | AUTHORIZED_PROVIDER
      - name: requester_user_id
        type: string
        source: system
        description: X-User-ID of the caller
      - name: decision
        type: enum
        source: computed
        description: "Computed by calculations.self_repair_eligibility_decision (first matching branch wins)"
        constraints: ELIGIBLE | ELIGIBLE_WITH_TOOL_RENTAL | BLOCKED_NO_COMPATIBILITY | BLOCKED_PART_UNAVAILABLE | BLOCKED_TIER | BLOCKED_SAFETY | BLOCKED_NO_MANUAL
      - name: warranty_impact_class
        type: enum
        source: computed
        description: "Computed by calculations.warranty_impact_classification; the value the disclosure acknowledgment must echo"
        constraints: WARRANTY_PRESERVED | WARRANTY_PRESERVED_WITH_LOG | WARRANTY_LIMITED_COMPONENT_EXCLUSION | WARRANTY_VOID_AFFECTED_SUBSYSTEM
      - name: self_repair_risk_index
        type: integer
        source: computed
        description: "0-100 weighted risk index from calculations.self_repair_risk_index"
      - name: liability_warning_version
        type: string
        source: computed
        description: "Warning text version string the acknowledgment must echo; format LW-{model_code}-R{pinned revision_number}, null when pinned_manual_revision_id is null"
        default: null
      - name: tool_rental_part_id
        type: string
        source: computed
        description: Copy of the in-window PartModelCompatibility.required_tool_part_id value; null when no tool is required
        default: null
      - name: status
        type: enum
        source: system
        description: Assessment usability state
        default: VALID
        constraints: VALID | REVOKED_BY_SAFETY | EXPIRED | CONSUMED
      - name: expires_at
        type: datetime
        source: computed
        description: created_at plus ASSESSMENT_VALIDITY_DAYS (60); materialized to EXPIRED by POST /compliance-sweeps

  - name: PartsOrder
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: FK -> EligibilityAssessment.id; the eligibility ruling this order is placed against
      - name: model_id
        type: string
        source: system
        description: FK -> ProductModel.id; copied from the assessment at creation
      - name: provider_id
        type: string
        source: input
        description: FK -> RepairProvider.id; required when buyer_class=AUTHORIZED_PROVIDER, else null
        default: null
      - name: pinned_manual_revision_id
        type: string
        source: system
        description: FK -> ManualRevision.id; the PUBLISHED DISASSEMBLY_GUIDE revision locked at confirm time
        default: null
      - name: region_code
        type: string
        source: input
        description: Region key; MUST equal an existing RegionalComplianceProfile.region_code else ERR_REGION_PROFILE_NOT_FOUND
      - name: buyer_class
        type: enum
        source: input
        description: Pricing class of the buyer
        constraints: SELF_REPAIR_CONSUMER | AUTHORIZED_PROVIDER
      - name: customer_user_id
        type: string
        source: system
        description: X-User-ID of the caller who created the order; ownership subject for later mutations
      - name: rental_window_start
        type: datetime
        source: input
        description: Inclusive start of the requested rental-kit occupation window; null when no RENTAL_KIT line is ordered
        default: null
      - name: rental_window_end
        type: datetime
        source: input
        description: Inclusive end of the requested rental-kit occupation window
        default: null
      - name: fulfillment_status
        type: enum
        source: system
        description: First state dimension; evolves independently of core_return_status
        default: DRAFT
        constraints: DRAFT | PENDING_DISCLOSURE | BLOCKED_SAFETY_HOLD | CONFIRMED | DELIVERED | CLOSED | CANCELLED
      - name: core_return_status
        type: enum
        source: system
        description: Second state dimension; tracks the core deposit lifecycle
        default: NOT_REQUIRED
        constraints: NOT_REQUIRED | PENDING_CORE | CORE_RECEIVED | CORE_CREDIT_ISSUED | CORE_FORFEITED | CORE_RELEASED
      - name: pinned_manual_revision_number
        type: integer
        source: system
        description: revision_number of pinned_manual_revision_id, frozen at confirm even if a newer revision is published later
        default: null
      - name: warranty_impact_class
        type: enum
        source: computed
        description: Copied from the assessment when POST request-disclosure runs
        default: null
        constraints: WARRANTY_PRESERVED | WARRANTY_PRESERVED_WITH_LOG | WARRANTY_LIMITED_COMPONENT_EXCLUSION | WARRANTY_VOID_AFFECTED_SUBSYSTEM
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_total_cents over lines whose part_class is in {COMPONENT, CONSUMABLE} (calculations.parts_order_pricing)"
        default: 0
      - name: tool_purchase_cents
        type: integer
        source: computed
        description: Sum of line_total_cents over lines whose part_class=TOOL
        default: 0
      - name: rental_deposit_cents
        type: integer
        source: computed
        description: Sum of part.rental_deposit_cents times quantity over lines whose part_class=RENTAL_KIT
        default: 0
      - name: documentation_fee_cents
        type: integer
        source: computed
        description: "Region-capped documentation fee (calculations.parts_order_pricing step 12)"
        default: 0
      - name: core_deposit_cents
        type: integer
        source: computed
        description: Sum of part.core_credit_cents times quantity over lines whose part.core_return_required=true
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: parts_subtotal_cents + tool_purchase_cents + rental_deposit_cents + documentation_fee_cents + core_deposit_cents
        default: 0
      - name: core_credit_provisional_cents
        type: integer
        source: computed
        description: "PROVISIONAL_HOLD variant of calculations.core_return_credit_settlement, stamped at confirm"
        default: 0
      - name: core_credit_final_cents
        type: integer
        source: computed
        description: "FINAL_SETTLEMENT variant of calculations.core_return_credit_settlement, stamped at core receipt"
        default: null
      - name: core_return_due_at
        type: datetime
        source: system
        description: confirmed_at plus CORE_RETURN_WINDOW_DAYS (30); null when no core is owed
        default: null
      - name: core_days_late
        type: integer
        source: computed
        description: Whole days between core_return_due_at and the recorded received_at, floored at 0
        default: null
      - name: disclosure_acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant of the first DisclosureAcknowledgment row for this order; gates the conditional safety cascade
        default: null
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of confirm
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of delivery
        default: null
      - name: blocked_reason
        type: string
        source: system
        description: Reason recorded when the order was pushed to BLOCKED_SAFETY_HOLD by a safety cascade
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: Reason recorded at cancel
        default: null

  - name: PartsOrderLine
    parent: PartsOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> PartsOrder.id; the owning order
      - name: part_id
        type: string
        source: input
        description: FK -> PartCatalogItem.id; the catalog line being bought
      - name: quantity
        type: integer
        source: input
        description: Units ordered
        constraints: 1-500
      - name: buyer_multiplier
        type: number
        source: computed
        description: 1.00 for SELF_REPAIR_CONSUMER, 0.82 for AUTHORIZED_PROVIDER
      - name: volume_multiplier
        type: number
        source: computed
        description: 0.85 when quantity >= 25, else 0.92 when quantity >= 10, else 1.00
      - name: tier_surcharge_multiplier
        type: number
        source: computed
        description: 1.00 / 1.05 / 1.12 for model repairability_tier TIER_A_SELF_SERVICE / TIER_B_GUIDED / TIER_C_AUTHORIZED_ONLY
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Display-only rounded unit price; NEVER an input to line_total_cents (see calculations.parts_order_pricing)"
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "round_half_up(unit_effective_cents * quantity) — the single rounding point for this line"
        default: 0
      - name: authentication_status
        type: enum
        source: system
        description: First line dimension; parts authentication after replacement
        default: NOT_REQUIRED
        constraints: NOT_REQUIRED | PENDING_AUTHENTICATION | AUTHENTIC | COUNTERFEIT_SUSPECT
      - name: calibration_status
        type: enum
        source: system
        description: Second line dimension; calibration after replacement, cyclic on retry
        default: NOT_REQUIRED
        constraints: NOT_REQUIRED | CALIBRATION_REQUIRED | CALIBRATION_IN_PROGRESS | CALIBRATION_PASSED | CALIBRATION_FAILED | CALIBRATION_ESCALATED
      - name: calibration_attempt_count
        type: integer
        source: system
        description: Number of POST calibrate attempts recorded; escalates at CALIBRATION_ATTEMPT_CAP (3)
        default: 0
      - name: last_measured_offset_ppm
        type: number
        source: system
        description: Offset reported by the most recent calibration attempt
        default: null
      - name: pairing_token
        type: string
        source: system
        description: Token minted at delivery for parts with requires_authentication=true; null otherwise
        default: null

  - name: DisclosureAcknowledgment
    parent: PartsOrder
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> PartsOrder.id; the order whose warranty impact is being acknowledged
      - name: warranty_impact_class_ack
        type: enum
        source: input
        description: Must equal the order's warranty_impact_class else ERR_DISCLOSURE_MISMATCH
        constraints: WARRANTY_PRESERVED | WARRANTY_PRESERVED_WITH_LOG | WARRANTY_LIMITED_COMPONENT_EXCLUSION | WARRANTY_VOID_AFFECTED_SUBSYSTEM
      - name: liability_warning_version
        type: string
        source: input
        description: Must equal the assessment's liability_warning_version else ERR_LIABILITY_WARNING_STALE
      - name: acknowledged_scope
        type: enum
        source: input
        description: Scope of the acknowledgment the buyer signed
        constraints: FULL_SELF_REPAIR | TOOL_RENTAL_ONLY | PROVIDER_MANAGED
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the signer; must equal PartsOrder.customer_user_id
      - name: manual_revision_number
        type: integer
        source: system
        description: revision_number of the assessment's pinned DISASSEMBLY_GUIDE revision at signature time
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant of signature; the row is append-only and never updated

  - name: RepairProvider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the independent repair business
      - name: region_code
        type: string
        source: input
        description: Region key; MUST equal an existing RegionalComplianceProfile.region_code else ERR_REGION_PROFILE_NOT_FOUND
      - name: requested_access_tier
        type: enum
        source: input
        description: Parts access tier the applicant asked for
        constraints: TIER_1_UNRESTRICTED | TIER_2_SAFETY | TIER_3_STANDARD
      - name: technician_count
        type: integer
        source: input
        description: Head count of technicians; drives required_cert_count
        constraints: 1-500
      - name: authorization_status
        type: enum
        source: system
        description: Authorization lifecycle, cyclic through SUSPENDED
        default: APPLIED
        constraints: APPLIED | TRAINING_IN_PROGRESS | AUTHORIZED | SUSPENDED | REVOKED
      - name: parts_access_tier
        type: enum
        source: system
        description: Effective granted tier; null until authorized
        default: null
        constraints: TIER_1_UNRESTRICTED | TIER_2_SAFETY | TIER_3_STANDARD
      - name: training_credit_granted_total
        type: integer
        source: system
        description: Cumulative training credits ever granted to this provider
        default: 0
      - name: training_credit_balance
        type: integer
        source: system
        description: Unconsumed training credits
        default: 0
      - name: training_credit_forfeited_total
        type: integer
        source: system
        description: Credits swept back to the program when the provider was revoked
        default: 0
      - name: required_cert_count
        type: integer
        source: computed
        description: ceil(technician_count / TECHS_PER_CERT (4))
        default: 1
      - name: active_cert_count
        type: integer
        source: computed
        description: Count of this provider's TrainingCertification rows with status=ACTIVE
        default: 0
      - name: attested_compliance_score
        type: integer
        source: system
        description: "ROLLING_ATTESTED score snapshot stamped at the last authorization decision (calculations.provider_compliance_score)"
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded by the SUSPEND or REVOKE authorization decision
        default: null

  - name: TrainingCertification
    parent: RepairProvider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: FK -> RepairProvider.id; the employing provider
      - name: technician_user_id
        type: string
        source: input
        description: Opaque technician identifier; uniqueness of validity windows is scoped to (technician_user_id, course_code)
      - name: course_code
        type: enum
        source: input
        description: Training course certified
        constraints: CRS_BATTERY_SAFETY | CRS_HIGH_VOLTAGE | CRS_PAIRING_CALIBRATION | CRS_GENERAL_REPAIR
      - name: valid_from
        type: datetime
        source: input
        description: Inclusive start of the certification validity interval
      - name: valid_until
        type: datetime
        source: input
        description: Inclusive end of the certification validity interval
      - name: exam_score
        type: integer
        source: input
        description: Exam result; must be >= CERT_PASS_SCORE (70)
        constraints: 0-100
      - name: status
        type: enum
        source: system
        description: Certification usability state
        default: ACTIVE
        constraints: ACTIVE | EXPIRED | VOIDED
      - name: credits_consumed
        type: integer
        source: system
        description: Training credits held by this certification; CERT_CREDIT_COST (2) while ACTIVE or EXPIRED, 0 once VOIDED
        default: 2
      - name: void_reason
        type: string
        source: system
        description: Reason recorded at void
        default: null

  - name: DefectiveReturnCase
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: FK -> PartsOrderLine.id; the delivered line the defective unit came from
      - name: part_id
        type: string
        source: system
        description: FK -> PartCatalogItem.id; denormalized from the line at creation
      - name: quantity
        type: integer
        source: input
        description: Units returned as defective; must be <= the line quantity
        constraints: ">= 1"
      - name: reported_failure_code
        type: enum
        source: input
        description: Symptom reported by the returner
        constraints: NO_POWER | INTERMITTENT | PHYSICAL_DAMAGE | CALIBRATION_DRIFT | AUTHENTICATION_FAILURE
      - name: status
        type: enum
        source: system
        description: Failure-analysis workflow state; branches to CREDIT_ISSUED or REJECTED
        default: REQUESTED
        constraints: REQUESTED | RECEIVED | ANALYSIS_COMPLETE | CREDIT_ISSUED | REJECTED
      - name: root_cause_code
        type: enum
        source: system
        description: Root cause recorded by the failure-analysis engineer
        default: null
        constraints: MANUFACTURING_DEFECT | PROVIDER_INSTALL_ERROR | CUSTOMER_MISUSE | PART_AUTHENTICATION_FAILURE | UNDETERMINED
      - name: defect_confirmed
        type: boolean
        source: system
        description: Whether bench analysis reproduced the reported failure
        default: null
      - name: analyzed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FailureAnalysisEngineer who recorded the root cause; the segregation-of-duties subject
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who issued or rejected the credit
        default: null
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "GOODWILL_PROVISIONAL variant of calculations.defective_return_credit, stamped at receive"
        default: 0
      - name: final_credit_cents
        type: integer
        source: computed
        description: "ANALYSIS_FINAL variant of calculations.defective_return_credit, stamped at the credit decision"
        default: null
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the returned unit was booked in
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductModel
    initial_state: ACTIVE_PRODUCTION
    terminal_states: [SUPPORT_ENDED]
    note: |
      Two dimensions live on this row. support_state is driven by the two lifecycle
      endpoints below. compliance_posture (OPEN | WATCH | ORDER_RESTRICTED) is a
      derived dimension recomputed by calculations.model_compliance_posture_rollup
      whenever a ComplianceObligation child changes status; it evolves independently
      of support_state and gates child order operations.
    transitions:
      - from: ACTIVE_PRODUCTION
        to: LEGACY_SUPPORT
        trigger: "POST /product-models/{model_id}/end-production"
        actor: ProgramAdmin
        preconditions:
          - "support_state == ACTIVE_PRODUCTION"
          - "body end_of_production_date >= market_release_date"
        side_effects:
          - "sets end_of_production_date from the body"
          - "recomputes parts_available_until and documentation_available_until on every ComplianceObligation of this model via calculations.mandated_support_window, flipping each row's deadline_basis from PRODUCTION_ACTIVE to END_OF_PRODUCTION"
          - "re-evaluates each of those obligations through calculations.obligation_status_evaluation"
          - "recomputes compliance_posture from the resulting obligation statuses"
          - "increments version by 1"
      - from: LEGACY_SUPPORT
        to: SUPPORT_ENDED
        trigger: "POST /product-models/{model_id}/end-support"
        actor: ProgramAdmin
        preconditions:
          - "support_state == LEGACY_SUPPORT"
          - "every ComplianceObligation of this model has status in {CLOSED, ATTESTED} (else ERR_INVALID_STATE_TRANSITION)"
          - "body support_end_date >= end_of_production_date"
        side_effects:
          - "sets support_end_date"
          - "blocks further ManualRevision approvals for this model (see ManualRevision IN_REVIEW -> APPROVED preconditions)"
          - "increments version by 1"

  - entity: PartCatalogItem
    initial_state: DRAFT
    terminal_states: [RESTRICTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /part-catalog-items/{part_id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "when part_class == RENTAL_KIT: concurrent_rental_capacity is not null and >= 1 (else ERR_INVALID_RANGE)"
          - "when core_return_required == true: core_credit_cents >= 1 (else ERR_INVALID_RANGE)"
        side_effects:
          - "part becomes orderable and enters documentation coverage checks"
          - "for every ProductModel with an in-window compatibility row for this part, recomputes documentation_posture via calculations.documentation_posture_rollup; a model whose PUBLISHED DISASSEMBLY_GUIDE revision does not cover this sku flips CURRENT -> STALE"
          - "each such posture change re-evaluates that model's ComplianceObligation rows, which in turn recomputes the model's compliance_posture"
          - "increments version by 1"
      - from: PUBLISHED
        to: RESTRICTED
        trigger: "POST /part-catalog-items/{part_id}/restrict"
        actor: SafetyReviewer
        preconditions:
          - "status == PUBLISHED"
          - "body safety_class != UNRESTRICTED"
        side_effects:
          - "HOP 1: sets status=RESTRICTED, overwrites safety_class from the body, stores restriction_reason"
          - "HOP 2 (caused by HOP 1): every PartModelCompatibility row with part_id == this part and self_service_eligible == true is forced to self_service_eligible=false and superseded_by_safety_restriction=true"
          - "HOP 3 (caused by HOP 2): every EligibilityAssessment with status=VALID whose (part_id, model_id) matches one of the rows changed in HOP 2 and whose decision is in {ELIGIBLE, ELIGIBLE_WITH_TOOL_RENTAL} moves to status=REVOKED_BY_SAFETY"
          - "HOP 4 (caused by HOP 3, conditional cascade): every PartsOrder whose assessment_id is one of the assessments revoked in HOP 3, whose fulfillment_status == PENDING_DISCLOSURE and whose disclosure_acknowledged_at IS NULL moves to fulfillment_status=BLOCKED_SAFETY_HOLD with blocked_reason='SAFETY_RESTRICTION_ON_PART'. Orders that already carry an acknowledgment are deliberately left in PENDING_DISCLOSURE and are instead rejected at confirm by validations[priority=50]."
          - "increments version by 1 on this part and on every row touched by HOPs 2-4"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: POST /part-catalog-items creating a successor whose supersedes_part_id references this part, or POST /part-catalog-items/{part_id}/supersession re-pointing an existing successor at this part"
        actor: system
        preconditions:
          - "status == PUBLISHED"
          - "the successor's part_class equals this part's part_class (else ERR_SUPERSESSION_CLASS_MISMATCH)"
        side_effects:
          - "sets status=SUPERSEDED; the part stays orderable only through already-CONFIRMED orders"
          - "every PartModelCompatibility row for this part keeps its window but new EligibilityAssessment calls on it resolve to BLOCKED_PART_UNAVAILABLE"
          - "increments version by 1"

  - entity: ManualRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: IN_REVIEW -> DRAFT -> IN_REVIEW repeats until rejection_cycle_count reaches REVISION_CYCLE_CAP (3)."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /manual-revisions/{revision_id}/submit"
        actor: DocumentationEngineer
        preconditions:
          - "status == DRAFT"
          - "covered_part_skus is a non-empty array (else ERR_SAFETY_WARNINGS_REQUIRED)"
        side_effects:
          - "recomputes coverage_gap_sku_count against the model's PUBLISHED parts with in-window compatibility"
          - "increments version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /manual-revisions/{revision_id}/review-decision with decision=REJECT"
        actor: SafetyReviewer
        preconditions:
          - "status == IN_REVIEW"
          - "rejection_cycle_count < 3 (else ERR_REVISION_CYCLE_CAP_REACHED)"
        side_effects:
          - "increments rejection_cycle_count by 1, stores reviewed_by_user_id and the review note"
          - "increments version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /manual-revisions/{revision_id}/review-decision with decision=APPROVE"
        actor: SafetyReviewer
        preconditions:
          - "status == IN_REVIEW"
          - "X-User-ID != authored_by_user_id (else ERR_SELF_REVIEW_FORBIDDEN)"
          - "the parent ProductModel.support_state != SUPPORT_ENDED (else ERR_INVALID_STATE_TRANSITION)"
          - "coverage_gap_sku_count == 0 when doc_type == DISASSEMBLY_GUIDE (else ERR_REVISION_COVERAGE_GAP)"
        side_effects:
          - "stores reviewed_by_user_id"
          - "increments version by 1"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /manual-revisions/{revision_id}/publish"
        actor: SafetyReviewer
        preconditions:
          - "status == APPROVED"
          - "body effective_from (defaulted to the logical clock) >= the currently PUBLISHED revision's effective_from for the same (model_id, doc_type)"
        side_effects:
          - "HOP 1: sets status=PUBLISHED, published_at and effective_from from the logical clock or body"
          - "HOP 2 (caused by HOP 1): the previously PUBLISHED revision for the same (model_id, doc_type), if any, moves to status=SUPERSEDED"
          - "HOP 3 (caused by HOP 2 changing which revision is current): the parent ProductModel refreshes published_disassembly_revision_number / published_safety_sheet_revision_number and re-derives documentation_posture via calculations.documentation_posture_rollup"
          - "HOP 4 (caused by HOP 3): every ComplianceObligation of that model is re-evaluated by calculations.obligation_status_evaluation, and the model's compliance_posture is recomputed from the new obligation statuses"
          - "increments version by 1 on this revision, the superseded revision, the model, and every re-evaluated obligation"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: publication of a newer revision for the same (model_id, doc_type)"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "row is frozen; PartsOrder rows that pinned it keep pinned_manual_revision_number unchanged"
          - "increments version by 1"

  - entity: PartsOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Parallel dimensions on one row. Dimension F = fulfillment_status
      (DRAFT -> PENDING_DISCLOSURE -> CONFIRMED -> DELIVERED -> CLOSED, with
      PENDING_DISCLOSURE -> BLOCKED_SAFETY_HOLD and cancel from any non-terminal
      state). Dimension C = core_return_status (NOT_REQUIRED | PENDING_CORE ->
      CORE_RECEIVED -> CORE_CREDIT_ISSUED | CORE_FORFEITED | CORE_RELEASED).
      Dimension C only starts moving at confirm and advances on its own triggers.
    transitions:
      - from: DRAFT
        to: PENDING_DISCLOSURE
        trigger: "POST /parts-orders/{order_id}/request-disclosure"
        actor: SelfRepairCustomer | RepairProviderTech
        preconditions:
          - "fulfillment_status == DRAFT"
          - "at least one PartsOrderLine exists (else ERR_ORDER_HAS_NO_LINES)"
          - "the referenced EligibilityAssessment was CONSUMED by THIS order (POST /parts-orders already moved it VALID -> CONSUMED) and has never since been REVOKED_BY_SAFETY or EXPIRED, and its decision is in {ELIGIBLE, ELIGIBLE_WITH_TOOL_RENTAL} (else ERR_ASSESSMENT_NOT_VALID)"
          - "the parent ProductModel.compliance_posture != ORDER_RESTRICTED (else ERR_MODEL_ORDER_RESTRICTED)"
        side_effects:
          - "runs calculations.parts_order_pricing over all lines, writing per-line unit_price_cents / line_total_cents and order-level parts_subtotal_cents, tool_purchase_cents, rental_deposit_cents, documentation_fee_cents, core_deposit_cents and total_due_cents"
          - "copies warranty_impact_class from the assessment"
          - "increments version by 1"
      - from: PENDING_DISCLOSURE
        to: BLOCKED_SAFETY_HOLD
        trigger: "system: HOP 4 of the PartCatalogItem PUBLISHED -> RESTRICTED cascade"
        actor: system
        preconditions:
          - "fulfillment_status == PENDING_DISCLOSURE"
          - "disclosure_acknowledged_at IS NULL"
        side_effects:
          - "sets blocked_reason='SAFETY_RESTRICTION_ON_PART'"
          - "increments version by 1"
      - from: PENDING_DISCLOSURE
        to: CONFIRMED
        trigger: "POST /parts-orders/{order_id}/confirm"
        actor: SelfRepairCustomer | RepairProviderTech
        preconditions:
          - "fulfillment_status == PENDING_DISCLOSURE"
          - "disclosure_acknowledged_at IS NOT NULL (else ERR_DISCLOSURE_NOT_ACKNOWLEDGED)"
          - "a ManualRevision with (model_id == this order's model_id, doc_type == DISASSEMBLY_GUIDE, status == PUBLISHED) exists (else ERR_INVALID_STATE_TRANSITION)"
          - "no line references a PartCatalogItem whose status == RESTRICTED, whatever the buyer_class (else ERR_ORDER_CONTAINS_RESTRICTED_PART)"
          - "every line's part has an in-window PartModelCompatibility row for this model at the logical clock (else ERR_PART_NOT_PUBLISHED)"
          - "when a ComplianceObligation exists for (model_id, region_code): the logical clock <= its parts_available_until (else ERR_PARTS_WINDOW_ELAPSED)"
          - "the parent ProductModel.compliance_posture != ORDER_RESTRICTED (else ERR_MODEL_ORDER_RESTRICTED)"
          - "when buyer_class == AUTHORIZED_PROVIDER: the RepairProvider.authorization_status == AUTHORIZED (else ERR_PROVIDER_NOT_AUTHORIZED)"
        side_effects:
          - "sets confirmed_at from the logical clock"
          - "leaves pinned_manual_revision_id and pinned_manual_revision_number exactly as the EligibilityAssessment pinned them (version_pinning_on_approval): a publication that happened between assessment and confirmation never moves these fields, and the acknowledgment at priority 86 is checked against the pinned values, not against the model's current published revision"
          - "leaves the assessment CONSUMED — it was already consumed by POST /parts-orders, so this is a no-op"
          - "dimension C: when any line's part has core_return_required == true, core_return_status moves NOT_REQUIRED -> PENDING_CORE, core_return_due_at = confirmed_at + 30 days, and core_credit_provisional_cents is stamped by the PROVISIONAL_HOLD variant of calculations.core_return_credit_settlement"
          - "for each such part: core_face_value_committed_cents and core_liability_outstanding_cents each increase by part.core_credit_cents * line.quantity"
          - "increments version by 1"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /parts-orders/{order_id}/deliver"
        actor: ProgramAdmin
        preconditions:
          - "fulfillment_status == CONFIRMED"
        side_effects:
          - "sets delivered_at from the body or the logical clock"
          - "for every line whose part.requires_authentication == true: authentication_status NOT_REQUIRED -> PENDING_AUTHENTICATION and a pairing_token is minted"
          - "for every line whose part.requires_calibration == true: calibration_status NOT_REQUIRED -> CALIBRATION_REQUIRED"
          - "increments version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "system: every line reaches a terminal service state and dimension C is in {NOT_REQUIRED, CORE_CREDIT_ISSUED, CORE_FORFEITED}"
        actor: system
        preconditions:
          - "fulfillment_status == DELIVERED"
          - "every line has authentication_status in {NOT_REQUIRED, AUTHENTIC} and calibration_status in {NOT_REQUIRED, CALIBRATION_PASSED}"
          - "core_return_status in {NOT_REQUIRED, CORE_CREDIT_ISSUED, CORE_FORFEITED}"
        side_effects:
          - "order is frozen; defective returns remain openable against its lines"
          - "increments version by 1"
      - from: DRAFT | PENDING_DISCLOSURE | BLOCKED_SAFETY_HOLD | CONFIRMED
        to: CANCELLED
        trigger: "POST /parts-orders/{order_id}/cancel"
        actor: SelfRepairCustomer | RepairProviderTech | ProgramAdmin
        preconditions:
          - "fulfillment_status in {DRAFT, PENDING_DISCLOSURE, BLOCKED_SAFETY_HOLD, CONFIRMED}"
          - "when fulfillment_status == CONFIRMED: core_return_status in {NOT_REQUIRED, PENDING_CORE} (else ERR_CORE_LEDGER_INVARIANT)"
        side_effects:
          - "stores cancellation_reason"
          - "compensation: when core_return_status == PENDING_CORE it moves to CORE_RELEASED, core_credit_provisional_cents is reset to 0 and core_return_due_at to null"
          - "compensation: for every core-required line, part.core_liability_outstanding_cents AND part.core_face_value_committed_cents each decrease by part.core_credit_cents * line.quantity, so calculations.core_liability_conservation stays balanced"
          - "increments version by 1"
      - from: PENDING_CORE
        to: CORE_RECEIVED
        trigger: "POST /parts-orders/{order_id}/core-returns"
        actor: ProgramAdmin
        note: "Dimension C transition; fulfillment_status must already be DELIVERED. The same trigger is DECLARED (and therefore not a priority-60 undefined trigger) from CORE_RECEIVED, CORE_CREDIT_ISSUED, CORE_FORFEITED and CORE_RELEASED, but it is guarded: it always fails with ERR_CORE_LEDGER_INVARIANT at priority 160 because the face value has already left core_liability_outstanding_cents."
        preconditions:
          - "core_return_status == PENDING_CORE"
          - "fulfillment_status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
          - "body received_at >= confirmed_at (else ERR_CORE_RECEIPT_BEFORE_CONFIRM)"
        side_effects:
          - "stamps core_days_late and core_credit_final_cents from the FINAL_SETTLEMENT variant of calculations.core_return_credit_settlement"
          - "when core_days_late >= 20 or body core_condition == NON_RETURNABLE: core_return_status continues to CORE_FORFEITED, core_credit_final_cents = 0, and for each core line part.core_liability_outstanding_cents decreases while part.core_credit_forfeited_cents increases by the same face value"
          - "otherwise core_return_status continues to CORE_CREDIT_ISSUED and for each core line part.core_liability_outstanding_cents decreases by the face value while part.core_credit_settled_cents increases by core_credit_final_cents and part.core_credit_forfeited_cents increases by the unpaid remainder"
          - "increments version by 1"
      - from: CORE_RECEIVED
        to: CORE_CREDIT_ISSUED
        trigger: "system: continuation of POST /parts-orders/{order_id}/core-returns when the graded credit is greater than 0"
        actor: system
        preconditions:
          - "core_return_status == CORE_RECEIVED"
          - "core_credit_final_cents > 0"
        side_effects:
          - "terminal for dimension C; enables the DELIVERED -> CLOSED rollup"
      - from: CORE_RECEIVED
        to: CORE_FORFEITED
        trigger: "system: continuation of POST /parts-orders/{order_id}/core-returns when the graded credit is 0"
        actor: system
        preconditions:
          - "core_return_status == CORE_RECEIVED"
          - "core_credit_final_cents == 0"
        side_effects:
          - "terminal for dimension C; enables the DELIVERED -> CLOSED rollup"

  - entity: PartsOrderLine
    initial_state: NOT_REQUIRED
    terminal_states: [AUTHENTIC, COUNTERFEIT_SUSPECT, CALIBRATION_PASSED, CALIBRATION_ESCALATED]
    note: |
      Parallel dimensions. Dimension A = authentication_status; Dimension B =
      calibration_status, which is cyclic (CALIBRATION_FAILED -> CALIBRATION_IN_PROGRESS
      -> CALIBRATION_FAILED) until calibration_attempt_count reaches 3.
    transitions:
      - from: PENDING_AUTHENTICATION
        to: AUTHENTIC
        trigger: "POST /parts-orders/{order_id}/lines/{line_id}/authenticate"
        actor: SelfRepairCustomer | RepairProviderTech | ProgramAdmin
        preconditions:
          - "authentication_status == PENDING_AUTHENTICATION"
          - "the parent PartsOrder.fulfillment_status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
          - "body pairing_token == the line's minted pairing_token"
        side_effects:
          - "when the part also requires calibration, calibration_status stays CALIBRATION_REQUIRED and calibration may now start"
          - "may enable the parent order's DELIVERED -> CLOSED rollup"
          - "increments version by 1"
      - from: PENDING_AUTHENTICATION
        to: COUNTERFEIT_SUSPECT
        trigger: "POST /parts-orders/{order_id}/lines/{line_id}/authenticate with a token that does not match"
        actor: SelfRepairCustomer | RepairProviderTech | ProgramAdmin
        preconditions:
          - "authentication_status == PENDING_AUTHENTICATION"
          - "the parent PartsOrder.fulfillment_status == DELIVERED"
          - "body pairing_token != the line's minted pairing_token"
        side_effects:
          - "sets authentication_status=COUNTERFEIT_SUSPECT and forces calibration_status to CALIBRATION_ESCALATED when calibration was required"
          - "any DefectiveReturnCase later opened on this line settles at final_credit_cents = 0 regardless of root cause"
          - "increments version by 1"
      - from: CALIBRATION_REQUIRED
        to: CALIBRATION_IN_PROGRESS
        trigger: "POST /parts-orders/{order_id}/lines/{line_id}/calibrate (first attempt)"
        actor: SelfRepairCustomer | RepairProviderTech
        preconditions:
          - "calibration_status == CALIBRATION_REQUIRED"
          - "the parent PartsOrder.fulfillment_status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
          - "authentication_status in {NOT_REQUIRED, AUTHENTIC} (else ERR_AUTHENTICATION_REQUIRED_FIRST)"
          - "a ManualRevision with (model_id, doc_type=CALIBRATION_PROCEDURE, status=PUBLISHED) exists (else ERR_NO_PUBLISHED_CALIBRATION_PROCEDURE)"
        side_effects:
          - "increments calibration_attempt_count by 1, stores last_measured_offset_ppm"
          - "immediately continues to CALIBRATION_PASSED or CALIBRATION_FAILED in the same request"
          - "increments version by 1"
      - from: CALIBRATION_IN_PROGRESS
        to: CALIBRATION_PASSED
        trigger: "system: |measured_offset_ppm| <= CALIBRATION_TOLERANCE_PPM (150)"
        actor: system
        preconditions:
          - "calibration_status == CALIBRATION_IN_PROGRESS"
        side_effects:
          - "may enable the parent order's DELIVERED -> CLOSED rollup"
      - from: CALIBRATION_IN_PROGRESS
        to: CALIBRATION_FAILED
        trigger: "system: |measured_offset_ppm| > 150 and calibration_attempt_count < 3"
        actor: system
        preconditions:
          - "calibration_status == CALIBRATION_IN_PROGRESS"
        side_effects:
          - "line remains retryable"
      - from: CALIBRATION_FAILED
        to: CALIBRATION_IN_PROGRESS
        trigger: "POST /parts-orders/{order_id}/lines/{line_id}/calibrate (retry)"
        actor: SelfRepairCustomer | RepairProviderTech
        preconditions:
          - "calibration_status == CALIBRATION_FAILED"
          - "calibration_attempt_count < 3 (else ERR_CALIBRATION_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "increments calibration_attempt_count by 1 and re-evaluates the tolerance branch"
          - "increments version by 1"
      - from: CALIBRATION_IN_PROGRESS
        to: CALIBRATION_ESCALATED
        trigger: "system: |measured_offset_ppm| > 150 on the attempt where calibration_attempt_count reaches 3"
        actor: system
        preconditions:
          - "calibration_status == CALIBRATION_IN_PROGRESS"
          - "calibration_attempt_count == 3"
        side_effects:
          - "terminal for dimension B; the parent order can never reach CLOSED through this line"

  - entity: RepairProvider
    initial_state: APPLIED
    terminal_states: [REVOKED]
    note: "Cyclic: AUTHORIZED -> SUSPENDED -> AUTHORIZED may repeat any number of times."
    transitions:
      - from: APPLIED
        to: TRAINING_IN_PROGRESS
        trigger: "POST /repair-providers/{provider_id}/begin-training"
        actor: ProgramAdmin
        preconditions:
          - "authorization_status == APPLIED"
          - "body training_credit_grant >= 2"
        side_effects:
          - "training_credit_granted_total and training_credit_balance each increase by training_credit_grant"
          - "increments version by 1"
      - from: TRAINING_IN_PROGRESS
        to: AUTHORIZED
        trigger: "POST /repair-providers/{provider_id}/authorization-decision with decision=AUTHORIZE"
        actor: ProgramAdmin
        preconditions:
          - "authorization_status == TRAINING_IN_PROGRESS"
          - "active_cert_count >= required_cert_count (else ERR_TRAINING_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "stamps attested_compliance_score from the ROLLING_ATTESTED variant of calculations.provider_compliance_score"
          - "sets parts_access_tier to the stricter of the requested/body tier and the band implied by that score"
          - "increments version by 1"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /repair-providers/{provider_id}/authorization-decision with decision=SUSPEND"
        actor: ComplianceOfficer
        preconditions:
          - "authorization_status == AUTHORIZED"
        side_effects:
          - "stores suspension_reason; provider-buyer orders can no longer be confirmed"
          - "increments version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /repair-providers/{provider_id}/authorization-decision with decision=REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "authorization_status == SUSPENDED"
          - "active_cert_count >= required_cert_count (else ERR_TRAINING_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "re-stamps attested_compliance_score and re-derives parts_access_tier from the new band"
          - "clears suspension_reason"
          - "increments version by 1"
      - from: APPLIED | TRAINING_IN_PROGRESS | AUTHORIZED | SUSPENDED
        to: REVOKED
        trigger: "POST /repair-providers/{provider_id}/authorization-decision with decision=REVOKE"
        actor: ComplianceOfficer
        preconditions:
          - "authorization_status != REVOKED"
        side_effects:
          - "compensation: training_credit_forfeited_total increases by training_credit_balance and training_credit_balance becomes 0, keeping calculations.training_credit_conservation balanced"
          - "parts_access_tier becomes null"
          - "increments version by 1"

  - entity: DefectiveReturnCase
    initial_state: REQUESTED
    terminal_states: [CREDIT_ISSUED, REJECTED]
    note: "Branching fork-join: ANALYSIS_COMPLETE forks to CREDIT_ISSUED or REJECTED with divergent side-effect sets."
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /defective-returns/{case_id}/receive"
        actor: ProgramAdmin
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "sets received_at from the body or the logical clock"
          - "stamps provisional_credit_cents from the GOODWILL_PROVISIONAL variant of calculations.defective_return_credit"
          - "increments version by 1"
      - from: RECEIVED
        to: ANALYSIS_COMPLETE
        trigger: "POST /defective-returns/{case_id}/analysis"
        actor: FailureAnalysisEngineer
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "stores root_cause_code, defect_confirmed and analyzed_by_user_id"
          - "when root_cause_code == PROVIDER_INSTALL_ERROR and the source order carries a provider_id, that provider's LIVE_RECOMPUTE compliance score drops through its breach_count input"
          - "increments version by 1"
      - from: ANALYSIS_COMPLETE
        to: CREDIT_ISSUED
        trigger: "POST /defective-returns/{case_id}/credit-decision with decision=ISSUE_CREDIT"
        actor: ProgramAdmin | FailureAnalysisEngineer
        preconditions:
          - "status == ANALYSIS_COMPLETE"
          - "X-User-ID != analyzed_by_user_id (else ERR_SELF_DECISION_FORBIDDEN)"
          - "root_cause_code != CUSTOMER_MISUSE (else ERR_CREDIT_NOT_ALLOWED_FOR_ROOT_CAUSE)"
          - "the source PartsOrderLine has authentication_status in {NOT_REQUIRED, AUTHENTIC, COUNTERFEIT_SUSPECT} and calibration_status in {NOT_REQUIRED, CALIBRATION_PASSED} (else ERR_CALIBRATION_INCOMPLETE) — a COUNTERFEIT_SUSPECT line is DECIDED, not incomplete: it clears this guard and the ANALYSIS_FINAL variant zeroes its credit instead"
        side_effects:
          - "stamps final_credit_cents from the ANALYSIS_FINAL variant of calculations.defective_return_credit and stores decided_by_user_id"
          - "increments version by 1"
      - from: ANALYSIS_COMPLETE
        to: REJECTED
        trigger: "POST /defective-returns/{case_id}/credit-decision with decision=REJECT"
        actor: ProgramAdmin | FailureAnalysisEngineer
        preconditions:
          - "status == ANALYSIS_COMPLETE"
          - "X-User-ID != analyzed_by_user_id (else ERR_SELF_DECISION_FORBIDDEN)"
        side_effects:
          - "sets final_credit_cents = 0 and stores decided_by_user_id; provisional_credit_cents is left untouched as the audit record of the goodwill offer"
          - "increments version by 1"

  - entity: ComplianceObligation
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: |
      Compound: status is a function of the parent model's documentation_posture, the
      published-part population, and the logical clock, recomputed by
      calculations.obligation_status_evaluation. Every status change bubbles up into
      ProductModel.compliance_posture.
    transitions:
      - from: OPEN
        to: AT_RISK
        trigger: "POST /compliance-sweeps or any documentation-posture cascade"
        actor: ComplianceOfficer | system
        preconditions:
          - "status in {OPEN, ATTESTED}"
          - "the logical clock >= parts_available_until minus AT_RISK_LEAD_DAYS (90), or the model's documentation_posture == STALE"
        side_effects:
          - "bubbles up: the model's compliance_posture becomes WATCH unless another obligation already forces ORDER_RESTRICTED"
          - "increments version by 1"
      - from: OPEN | AT_RISK | ATTESTED
        to: BREACHED_DOCUMENTATION
        trigger: "POST /compliance-sweeps or any documentation-posture cascade"
        actor: ComplianceOfficer | system
        preconditions:
          - "the model's documentation_posture == MISSING"
          - "the logical clock <= documentation_available_until or deadline_basis == PRODUCTION_ACTIVE"
        side_effects:
          - "increments breach_count by 1"
          - "bubbles up: the model's compliance_posture becomes ORDER_RESTRICTED, which blocks POST request-disclosure and POST confirm on that model"
          - "increments version by 1"
      - from: OPEN | AT_RISK | ATTESTED
        to: BREACHED_PARTS
        trigger: "POST /compliance-sweeps or any part-publication cascade"
        actor: ComplianceOfficer | system
        preconditions:
          - "no PartCatalogItem with status == PUBLISHED has an in-window PartModelCompatibility row for this model at the logical clock"
          - "the logical clock <= parts_available_until or deadline_basis == PRODUCTION_ACTIVE"
        side_effects:
          - "increments breach_count by 1"
          - "bubbles up: the model's compliance_posture becomes ORDER_RESTRICTED"
          - "increments version by 1"
      - from: AT_RISK | BREACHED_DOCUMENTATION | BREACHED_PARTS
        to: OPEN
        trigger: "POST /compliance-sweeps or any documentation-posture / part-publication cascade whose re-evaluation now falls through to branch 5 of calculations.obligation_status_evaluation"
        actor: ComplianceOfficer | system
        preconditions:
          - "status in {AT_RISK, BREACHED_DOCUMENTATION, BREACHED_PARTS}"
          - "at least one PartCatalogItem with status == PUBLISHED has an in-window PartModelCompatibility row for this model"
          - "the model's documentation_posture == CURRENT"
          - "deadline_basis == PRODUCTION_ACTIVE, or the logical clock < parts_available_until minus AT_RISK_LEAD_DAYS (90)"
        side_effects:
          - "recovery: breach_count is NOT decremented — it is a cumulative counter and the provider compliance score keeps reading it"
          - "bubbles up: the model's compliance_posture is recomputed and returns to OPEN when no sibling obligation is breached or at risk"
          - "increments version by 1"
      - from: OPEN | AT_RISK | BREACHED_DOCUMENTATION | BREACHED_PARTS
        to: ATTESTED
        trigger: "POST /compliance-obligations/{obligation_id}/attest"
        actor: ComplianceOfficer
        preconditions:
          - "status != CLOSED"
          - "body documentation_verified == true (else ERR_ATTESTATION_UNSUPPORTED)"
          - "the model's documentation_posture == CURRENT (else ERR_ATTESTATION_UNSUPPORTED) — same guard as §1.4 priority 90; STALE and MISSING both block attestation"
        side_effects:
          - "stores last_attested_at, last_attested_by_user_id and documentation_verified"
          - "bubbles up: the model's compliance_posture is recomputed and drops to OPEN or WATCH when no sibling obligation is breached"
          - "increments version by 1"
      - from: OPEN | AT_RISK | ATTESTED | BREACHED_DOCUMENTATION | BREACHED_PARTS
        to: CLOSED
        trigger: "POST /compliance-sweeps"
        actor: ComplianceOfficer | ProgramAdmin
        preconditions:
          - "deadline_basis == END_OF_PRODUCTION"
          - "the logical clock > parts_available_until AND the logical clock > documentation_available_until"
        side_effects:
          - "terminal; the obligation no longer contributes to the model's compliance_posture"
          - "increments version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-model
    parent_entity: ProductModel
    write_endpoint: "POST /repair-program/manual-revisions"
    occ_field: "expected_model_version"
    description: |
      Creating a ManualRevision against a ProductModel whose version has advanced
      since the author last observed it is rejected with a stale-version conflict.
      The product deliberately allows several DRAFT revisions per (model, doc_type),
      so a second create against unchanged state would legitimately succeed; the OCC
      check is what forces an author whose view of the model predates a publication,
      an end-of-production stamp, or a documentation-posture cascade to re-read the
      model before adding another revision.
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412
  - rule_id: line-append-stale-order
    parent_entity: PartsOrder
    write_endpoint: "POST /repair-program/parts-orders/{order_id}/lines"
    occ_field: "expected_order_version"
    description: |
      Appending a PartsOrderLine to a PartsOrder whose version has advanced since the
      buyer last observed it is rejected with a stale-version conflict. Multiple lines
      per order are legitimate, so the second append is not blocked by any state
      precondition; the OCC check is what stops a buyer from appending against a
      pricing snapshot that an earlier append or a disclosure request already moved.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: parts_order_pricing
    trigger: "POST /parts-orders/{order_id}/request-disclosure (DRAFT -> PENDING_DISCLOSURE); re-run in full on every POST /parts-orders/{order_id}/lines while fulfillment_status == DRAFT"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. Rounding happens exactly once per line, at step 6.
      # Currency is integer cents throughout; round_half_up means half-away-from-zero
      # to whole cents.
      for each PartsOrderLine L of the order, in created_at ASC order:
        1. base = part.list_price_cents                                  # unrounded
        2. buyer_multiplier      = 1.00 if order.buyer_class == SELF_REPAIR_CONSUMER
                                   else 0.82                            # AUTHORIZED_PROVIDER
        3. volume_multiplier     = 0.85 if L.quantity >= 25
                                   else 0.92 if L.quantity >= 10        # >= , not >
                                   else 1.00
        4. tier_surcharge_multiplier = { TIER_A_SELF_SERVICE: 1.00,
                                         TIER_B_GUIDED:       1.05,
                                         TIER_C_AUTHORIZED_ONLY: 1.12 }[model.repairability_tier]
                                   # TIER_D_NON_SERVICEABLE never reaches pricing:
                                   # eligibility blocks it upstream.
        5. unit_effective = base * buyer_multiplier * volume_multiplier
                                 * tier_surcharge_multiplier            # STILL UNROUNDED
        6. L.line_total_cents = round_half_up(unit_effective * L.quantity)   # THE ONLY ROUNDING
        7. L.unit_price_cents = round_half_up(unit_effective)           # DISPLAY ONLY.
             # Never multiplied by quantity, never summed. "round the unit price then
             # multiply" and "sum unrounded line values then round the order total"
             # are both WRONG for this scaffold.
      then, at order level:
        8.  parts_subtotal_cents  = sum(L.line_total_cents where part.part_class in {COMPONENT, CONSUMABLE})
        9.  tool_purchase_cents   = sum(L.line_total_cents where part.part_class == TOOL)
        10. rental_deposit_cents  = sum(part.rental_deposit_cents * L.quantity where part.part_class == RENTAL_KIT)
        11. core_deposit_cents    = sum(part.core_credit_cents * L.quantity where part.core_return_required == true)
        12. documentation_fee_cents:
              if region.requires_public_manual == true: 0               # law override wins first
              else: min(region.max_documentation_fee_cents,
                        DOC_FEE_BASE_CENTS
                        + DOC_FEE_PER_WARNING_CENTS
                          * (published DISASSEMBLY_GUIDE revision).safety_warning_count)
              # when no DISASSEMBLY_GUIDE revision is PUBLISHED yet, safety_warning_count
              # contributes 0 and the fee is min(cap, DOC_FEE_BASE_CENTS)
        13. total_due_cents = parts_subtotal_cents + tool_purchase_cents
                            + rental_deposit_cents + documentation_fee_cents
                            + core_deposit_cents
    input_set: "All PartsOrderLine rows of the order (no status filter — lines have no lifecycle of their own before delivery). Region parameters come from the RegionalComplianceProfile whose region_code equals order.region_code. Model parameters come from the order's ProductModel."
    constants:
      DOC_FEE_BASE_CENTS: 500
      DOC_FEE_PER_WARNING_CENTS: 120
      VOLUME_TIER_1_MIN_QTY: 10
      VOLUME_TIER_2_MIN_QTY: 25
      PROVIDER_BUYER_MULTIPLIER: 0.82
    precision: "integer cents; round_half_up applied once per line at step 6 and once per display unit at step 7"

  - name: core_return_credit_settlement
    trigger: "PROVISIONAL_HOLD at POST /parts-orders/{order_id}/confirm; FINAL_SETTLEMENT at POST /parts-orders/{order_id}/core-returns"
    algorithm: decay_function
    formula: |
      face_value = sum(part.core_credit_cents * L.quantity
                       over lines where part.core_return_required == true)
      # --- PROVISIONAL_HOLD ---
      core_credit_provisional_cents = face_value            # ungraded, no decay
      # --- FINAL_SETTLEMENT ---
      core_days_late = max(0, floor_whole_days(received_at - order.core_return_due_at))
      condition_multiplier = { INTACT: 1.00, DAMAGED_SHELL: 0.70,
                               INCOMPLETE: 0.40, NON_RETURNABLE: 0.00 }[body.core_condition]
      lateness_decay = max(0, 1 - CORE_DECAY_PER_DAY * core_days_late)
      if core_days_late >= CORE_FORFEIT_DAYS or body.core_condition == NON_RETURNABLE:
          core_credit_final_cents = 0                       # -> CORE_FORFEITED
      else:
          core_credit_final_cents = round_half_up(face_value
                                                 * condition_multiplier
                                                 * lateness_decay)      # -> CORE_CREDIT_ISSUED
      # Ledger effect per core-required part:
      #   outstanding -= face_value_of_that_part
      #   settled     += credited share of that part
      #   forfeited   += face_value_of_that_part - credited share
    input_set: "Only lines whose part.core_return_required == true. received_at comes from the request body and must be >= order.confirmed_at. core_return_due_at was stamped at confirm as confirmed_at + 30 days."
    constants:
      CORE_RETURN_WINDOW_DAYS: 30
      CORE_DECAY_PER_DAY: 0.05
      CORE_FORFEIT_DAYS: 20
    precision: "integer cents, round_half_up; core_days_late is whole days, floored at 0"
    variants:
      - name: PROVISIONAL_HOLD
        when: "Stamped at confirm, before the physical core is inspected"
        difference: "Uses the full undiscounted face value with no condition grading and no lateness decay; identical inputs therefore yield a strictly larger figure than FINAL_SETTLEMENT whenever the core arrives late or imperfect"
      - name: FINAL_SETTLEMENT
        when: "Stamped when the core is booked in"
        difference: "Multiplies the same face value by the condition multiplier and the per-day lateness decay, and hard-zeroes at CORE_FORFEIT_DAYS or NON_RETURNABLE condition"

  - name: provider_compliance_score
    trigger: "GET /repair-providers/{provider_id}/compliance-score (variant selected by query); the ROLLING_ATTESTED result is additionally stamped into attested_compliance_score by every AUTHORIZE or REINSTATE authorization decision"
    algorithm: weighted_scoring
    formula: |
      required_cert_count = ceil(technician_count / TECHS_PER_CERT)
      cert_coverage_ratio = min(1, counted_cert_count / required_cert_count)
      breach_count        = count(DefectiveReturnCase C where
                                   C.root_cause_code == PROVIDER_INSTALL_ERROR
                                   and the order behind C.order_line_id has
                                       provider_id == this provider
                                   and C.status in counted_case_statuses)
      attempted_lines     = count(PartsOrderLine on this provider's orders
                                  with calibration_attempt_count >= 1)
      failed_lines        = count(those lines with calibration_status in
                                  {CALIBRATION_FAILED, CALIBRATION_ESCALATED})
      calibration_failure_ratio = 0 if attempted_lines == 0
                                  else failed_lines / attempted_lines
      score = round_half_up(100 * ( 0.45 * cert_coverage_ratio
                                  + 0.35 * (1 - min(1, breach_count / BREACH_CAP))
                                  + 0.20 * (1 - calibration_failure_ratio) ))
      access_tier_band = TIER_1_UNRESTRICTED if score >= 85
                         else TIER_2_SAFETY  if score >= 65
                         else TIER_3_STANDARD
      # granted tier at AUTHORIZE/REINSTATE = the stricter (numerically higher tier
      # number) of the requested tier and access_tier_band
    input_set: "Certification and case populations depend on the variant (see variants). Ties in the tier bands are resolved by the >= comparisons above: a score of exactly 85 lands in TIER_1_UNRESTRICTED and exactly 65 in TIER_2_SAFETY."
    constants:
      TECHS_PER_CERT: 4
      BREACH_CAP: 5
      CERT_WEIGHT: 0.45
      BREACH_WEIGHT: 0.35
      CALIBRATION_WEIGHT: 0.20
    precision: "score is an integer 0-100, round_half_up; ratios are exact rationals until the final rounding"
    variants:
      - name: ROLLING_ATTESTED
        when: "Default variant; the figure the program contractually stands behind"
        difference: "counted_cert_count includes only TrainingCertification rows with status=ACTIVE whose [valid_from, valid_until] contains the logical clock; counted_case_statuses = {CREDIT_ISSUED, REJECTED} (closed cases only)"
      - name: LIVE_RECOMPUTE
        when: "Requested explicitly to see the forward-looking figure"
        difference: "counted_cert_count includes every status=ACTIVE row regardless of whether the clock sits inside its validity window (future-dated certifications count); counted_case_statuses = {REQUESTED, RECEIVED, ANALYSIS_COMPLETE, CREDIT_ISSUED, REJECTED}, so an ANALYSIS_COMPLETE install-error case that ROLLING_ATTESTED ignores lowers this score"

  - name: long_tail_demand_forecast
    trigger: "GET /part-catalog-items/{part_id}/demand-forecast?model_id=...&horizon_months=...&variant=..."
    algorithm: constraint_propagation
    formula: |
      # The safety-stock tier LOOKS circular (stock depends on projected units, and a
      # naive reader may re-apply the tier to the padded figure). The order below is
      # PINNED and is evaluated EXACTLY ONCE — no fixed-point iteration.
      1. trailing_units = sum(L.quantity) over PartsOrderLine L where
             L.part_id == part and order.model_id == model_id
             and order.fulfillment_status in {DELIVERED, CLOSED}
             and order.confirmed_at in [clock - 180 days, clock)      # half-open
      2. pipeline_units = sum(L.quantity) over the same join where
             order.fulfillment_status in {PENDING_DISCLOSURE, CONFIRMED}
             (no date filter)
      3. base_monthly_units = trailing_units / TRAILING_WINDOW_MONTHS   # unrounded
      4. months_since_eop = whole months between model.end_of_production_date and the
             logical clock (0 when end_of_production_date is null)
         obsolescence_band  = CURRENT   if months_since_eop < 12        # band from the
                              LEGACY    if 12 <= months_since_eop <= 60 # MODEL's age,
                              LONG_TAIL if months_since_eop > 60        # never from units
         band_multiplier    = { CURRENT: 1.00, LEGACY: 1.35, LONG_TAIL: 1.80 }[band]
      5. demand_monthly = base_monthly_units                            # TRAILING_ONLY
                        | 0.6 * base_monthly_units
                          + 0.4 * (pipeline_units / horizon_months)     # PIPELINE_WEIGHTED
      6. projected_units = demand_monthly * horizon_months * band_multiplier  # unrounded
      7. safety_stock_pct = 0.30 if projected_units < 50
                            else 0.20 if projected_units < 500          # tier read from
                            else 0.12                                   # STEP 6's value
      8. mandated_buffer_units = ceil(demand_monthly
                                      * mandated_support_months_remaining
                                      * MANDATE_BUFFER_RATIO)
         # mandated_support_months_remaining = whole months from the logical clock to
         # the LATEST parts_available_until across this model's ComplianceObligation
         # rows whose status != CLOSED; 0 when there is none or when it is in the past
      9. recommended_stock_units = ceil(projected_units * (1 + safety_stock_pct))
                                 + mandated_buffer_units
    input_set: "PartsOrderLine rows joined to their PartsOrder, filtered by the status sets in steps 1-2. Orders in DRAFT, BLOCKED_SAFETY_HOLD or CANCELLED never contribute to either figure."
    constants:
      TRAILING_WINDOW_DAYS: 180
      TRAILING_WINDOW_MONTHS: 6
      BAND_MULTIPLIER_CURRENT: 1.00
      BAND_MULTIPLIER_LEGACY: 1.35
      BAND_MULTIPLIER_LONG_TAIL: 1.80
      MANDATE_BUFFER_RATIO: 0.25
    precision: "unit counts are integers only at steps 8 and 9 (ceil); every intermediate is an exact rational. projected_units is reported rounded half-up to 2 decimals but the unrounded value feeds steps 7 and 9."
    variants:
      - name: TRAILING_ONLY
        when: "variant query parameter absent or TRAILING_ONLY"
        difference: "step 5 ignores pipeline_units entirely, so open orders never lift the forecast"
      - name: PIPELINE_WEIGHTED
        when: "variant=PIPELINE_WEIGHTED"
        difference: "step 5 blends 60% trailing and 40% pipeline-per-month, so the same data set produces a different projected_units, a possibly different safety_stock_pct tier, and a different recommended_stock_units"

  - name: mandated_support_window
    trigger: "POST /compliance-obligations (on create); re-run on POST /product-models/{model_id}/end-production for every obligation of that model"
    algorithm: interval_merge
    formula: |
      if model.end_of_production_date is null:
          deadline_basis = PRODUCTION_ACTIVE
          parts_available_until = null
          documentation_available_until = null
      else:
          deadline_basis = END_OF_PRODUCTION
          parts_available_until =
              end_of_day(model.end_of_production_date
                         + region.min_parts_availability_years years)
          documentation_available_until =
              max(parts_available_until,
                  end_of_day(model.end_of_production_date
                             + region.min_documentation_years years))
      # end_of_day(D) = D at 23:59:59.999Z — the deadline is INCLUSIVE of that whole
      # calendar day. A clock of exactly parts_available_until still permits ordering;
      # the next millisecond does not.
    input_set: "One ProductModel and the RegionalComplianceProfile matching the obligation's region_code. Calendar arithmetic adds whole years; 29 February plus N years clamps to 28 February when the target year is not a leap year."
    constants:
      END_OF_DAY_SUFFIX: "23:59:59.999Z"
    precision: "millisecond-precision ISO 8601 UTC timestamps"

  - name: self_repair_eligibility_decision
    trigger: "POST /eligibility-assessments"
    algorithm: threshold
    formula: |
      # FIRST MATCHING BRANCH WINS; the order below is pinned.
      compat = the PartModelCompatibility row for (part_id, model_id) whose
               [effective_from, effective_until) half-open window contains the logical
               clock (effective_until null = open-ended). When more than one such row
               exists the one with the latest effective_from wins; ties on
               effective_from are broken by created_at ASC.
      1. compat is null                                   -> BLOCKED_NO_COMPATIBILITY
      2. part.status != PUBLISHED                          -> BLOCKED_PART_UNAVAILABLE
      3. model.repairability_tier == TIER_D_NON_SERVICEABLE-> BLOCKED_TIER
      4. effective_safety_class =
             UNRESTRICTED if (part.safety_class == PAIRED_SECURITY
                              and region.allows_pairing_restriction == false)
             else part.safety_class
         # right-to-repair override: a jurisdiction that outlaws parts pairing sees a
         # PAIRED_SECURITY part as if it were unrestricted
      5. requester_class == SELF_REPAIR_CONSUMER
         and effective_safety_class in {SAFETY_RESTRICTED_HIGH_VOLTAGE, PAIRED_SECURITY}
                                                           -> BLOCKED_SAFETY
      6. requester_class == SELF_REPAIR_CONSUMER
         and effective_safety_class == SAFETY_RESTRICTED_BATTERY
         and model.published_safety_sheet_revision_number is null
                                                           -> BLOCKED_NO_MANUAL
      7. model.published_disassembly_revision_number is null-> BLOCKED_NO_MANUAL
      8. requester_class == SELF_REPAIR_CONSUMER
         and compat.self_service_eligible == false          -> BLOCKED_TIER
      9. compat.required_tool_part_id is not null
         or (requester_class == SELF_REPAIR_CONSUMER
             and effective_safety_class == SAFETY_RESTRICTED_BATTERY)
                                                           -> ELIGIBLE_WITH_TOOL_RENTAL
      10. otherwise                                        -> ELIGIBLE
      # side outputs, always written:
      pinned_manual_revision_id = id of the PUBLISHED DISASSEMBLY_GUIDE revision for
                                  the model, else null
      liability_warning_version = "LW-" + model.model_code + "-R"
                                  + published_disassembly_revision_number, else null
      tool_rental_part_id       = compat.required_tool_part_id (null when compat is null)
    input_set: "One PartModelCompatibility row selected by the window rule above, the PartCatalogItem, the ProductModel (including its computed published_* revision numbers), the RegionalComplianceProfile for region_code, and — when provider_id is supplied — the RepairProvider."
    constants:
      ASSESSMENT_VALIDITY_DAYS: 60
    precision: "enum-valued; no rounding"

  - name: warranty_impact_classification
    trigger: "POST /eligibility-assessments (same request as the decision); copied onto the PartsOrder by POST /parts-orders/{order_id}/request-disclosure"
    algorithm: threshold
    formula: |
      # FIRST MATCHING BRANCH WINS.
      1. requester_class == AUTHORIZED_PROVIDER
         and provider.authorization_status == AUTHORIZED     -> WARRANTY_PRESERVED
      2. part.safety_class == UNRESTRICTED
         and model.repairability_tier == TIER_A_SELF_SERVICE -> WARRANTY_PRESERVED_WITH_LOG
      3. part.safety_class == SAFETY_RESTRICTED_BATTERY      -> WARRANTY_LIMITED_COMPONENT_EXCLUSION
      4. otherwise                                           -> WARRANTY_VOID_AFFECTED_SUBSYSTEM
    input_set: "The assessment's part, model and (when present) provider. Uses part.safety_class as stored, NOT the pairing-override effective_safety_class from the eligibility decision."
    constants: {}
    precision: "enum-valued"

  - name: self_repair_risk_index
    trigger: "POST /eligibility-assessments"
    algorithm: weighted_scoring
    formula: |
      tier_weight   = { TIER_A_SELF_SERVICE: 0.10, TIER_B_GUIDED: 0.40,
                        TIER_C_AUTHORIZED_ONLY: 0.80, TIER_D_NON_SERVICEABLE: 1.00 }
                      [model.repairability_tier]
      safety_weight = { UNRESTRICTED: 0.10, SAFETY_RESTRICTED_BATTERY: 0.60,
                        SAFETY_RESTRICTED_HIGH_VOLTAGE: 0.90, PAIRED_SECURITY: 0.70 }
                      [part.safety_class]
      install_weight = min(1, compat.install_minutes / 120)   # 0 when compat is null
      self_repair_risk_index = round_half_up(
          100 * min(1, 0.40 * tier_weight
                     + 0.35 * safety_weight
                     + 0.25 * install_weight))
    input_set: "Same three sources as the eligibility decision; written even when the decision is a BLOCKED_* value."
    constants:
      INSTALL_MINUTES_NORMALIZER: 120
    precision: "integer 0-100, round_half_up"

  - name: defective_return_credit
    trigger: "GOODWILL_PROVISIONAL at POST /defective-returns/{case_id}/receive; ANALYSIS_FINAL at POST /defective-returns/{case_id}/credit-decision"
    algorithm: aggregation
    formula: |
      pro_rata_cents = round_half_up(line.line_total_cents * case.quantity
                                     / line.quantity)
      # --- GOODWILL_PROVISIONAL ---
      provisional_credit_cents = round_half_up(pro_rata_cents * GOODWILL_FACTOR)
      # --- ANALYSIS_FINAL ---
      if line.authentication_status == COUNTERFEIT_SUSPECT:
          final_credit_cents = 0
      else:
          root_factor = { MANUFACTURING_DEFECT: 1.00,
                          PART_AUTHENTICATION_FAILURE: 1.00,
                          UNDETERMINED: 0.50,
                          PROVIDER_INSTALL_ERROR: 0.00,
                          CUSTOMER_MISUSE: 0.00 }[case.root_cause_code]
          if case.defect_confirmed == false:
              root_factor = min(root_factor, 0.25)
          final_credit_cents = round_half_up(pro_rata_cents * root_factor)
      # REJECT decisions write final_credit_cents = 0 without evaluating root_factor
      # and deliberately leave provisional_credit_cents in place as the audit trail.
    input_set: "Exactly one PartsOrderLine (case.order_line_id) and its already-computed line_total_cents. The order's status is irrelevant here; only line values matter."
    constants:
      GOODWILL_FACTOR: 0.50
    precision: "integer cents, round_half_up applied to pro_rata_cents first and then to the graded figure — the two roundings are sequential and pinned in this order"

  - name: documentation_posture_rollup
    trigger: "POST /manual-revisions/{revision_id}/publish (HOP 3); POST /part-catalog-items/{part_id}/publish; POST /part-compatibilities; POST /manual-revisions/{revision_id}/submit (recomputes coverage_gap_sku_count only)"
    algorithm: aggregation
    formula: |
      pub = the ManualRevision with (model_id, doc_type=DISASSEMBLY_GUIDE,
                                     status=PUBLISHED)   # at most one
      if pub is null:
          documentation_posture = MISSING
      else:
          required_skus = { part.sku : part.status == PUBLISHED
                            and a PartModelCompatibility row exists for
                                (part.id, model_id) whose half-open
                                [effective_from, effective_until) window
                                contains the logical clock }
          gap = required_skus - set(pub.covered_part_skus)
          pub.coverage_gap_sku_count = |gap|
          if |gap| > 0:                        documentation_posture = STALE
          elif model.last_hardware_change_date is not null
               and pub.effective_from < model.last_hardware_change_date:
                                               documentation_posture = STALE
          else:                                documentation_posture = CURRENT
      # also refreshed on the same pass:
      published_disassembly_revision_number = pub.revision_number or null
      published_safety_sheet_revision_number = revision_number of the PUBLISHED
                                               SAFETY_SHEET revision, or null
    input_set: "All ManualRevision rows of the model (status filter PUBLISHED) and every PartCatalogItem with status=PUBLISHED holding an in-window compatibility row for the model. RESTRICTED, DRAFT and SUPERSEDED parts are excluded from required_skus."
    constants: {}
    precision: "enum-valued; coverage_gap_sku_count is an integer count"

  - name: obligation_status_evaluation
    trigger: "POST /compliance-obligations (on create); POST /compliance-sweeps; every documentation-posture or part-publication cascade; recomputed after POST /product-models/{model_id}/end-production"
    algorithm: threshold
    formula: |
      # FIRST MATCHING BRANCH WINS.
      1. deadline_basis == END_OF_PRODUCTION
         and clock > parts_available_until
         and clock > documentation_available_until          -> CLOSED
      2. no PartCatalogItem with status == PUBLISHED holds an in-window
         PartModelCompatibility row for this model at the clock -> BREACHED_PARTS
      3. model.documentation_posture == MISSING              -> BREACHED_DOCUMENTATION
      4. (deadline_basis == END_OF_PRODUCTION
          and clock >= parts_available_until - 90 days)
         or model.documentation_posture == STALE             -> AT_RISK
      5. otherwise                                          -> OPEN
      # ATTESTED is written only by the attest endpoint and is NOT preserved by this
      # evaluation: the next sweep or cascade re-derives one of the five values above.
      # breach_count increments by 1 whenever the result is BREACHED_PARTS or
      # BREACHED_DOCUMENTATION, including on repeated sweeps.
    input_set: "One ComplianceObligation, its ProductModel (including documentation_posture), and the PUBLISHED part population with in-window compatibility for that model."
    constants:
      AT_RISK_LEAD_DAYS: 90
    precision: "enum-valued"

  - name: model_compliance_posture_rollup
    trigger: "Any ComplianceObligation status change (create, attest, sweep, or cascade)"
    algorithm: aggregation
    formula: |
      obligations = ComplianceObligation rows with model_id == this model
      if any(o.status in {BREACHED_PARTS, BREACHED_DOCUMENTATION}):
          compliance_posture = ORDER_RESTRICTED
      elif any(o.status == AT_RISK):
          compliance_posture = WATCH
      else:
          compliance_posture = OPEN
      open_obligation_count = count(o.status in {OPEN, AT_RISK, ATTESTED})
    input_set: "Every ComplianceObligation row of the model regardless of region; CLOSED rows contribute to neither branch. A model with zero obligation rows keeps compliance_posture = OPEN."
    constants: {}
    precision: "enum-valued"

  - name: rental_capacity_occupancy
    trigger: "POST /parts-orders/{order_id}/lines when the referenced part has part_class == RENTAL_KIT"
    algorithm: interval_merge
    formula: |
      requested = [order.rental_window_start, order.rental_window_end]   # CLOSED interval
      occupants = PartsOrderLine rows on the same part_id whose order is NOT this order
                  and whose order.fulfillment_status in
                      {PENDING_DISCLOSURE, CONFIRMED, DELIVERED}
      for each occupant o:
          occupied = [o.order.rental_window_start,
                      o.order.rental_window_end + RENTAL_TURNAROUND_DAYS days]
          # AGGREGATE-CAPACITY, CLOSED-INTERVAL semantics: touching endpoints DO
          # collide (requested.start == occupied.end is a conflict), and the
          # turnaround buffer extends every existing occupation.
          overlaps = requested.start <= occupied.end
                     and occupied.start <= requested.end
      occupied_units = sum(o.quantity for overlapping occupants)
      if occupied_units + this_line.quantity > part.concurrent_rental_capacity:
          reject with ERR_RENTAL_CAPACITY_EXCEEDED
    input_set: "Lines of other orders only, filtered to fulfillment_status in {PENDING_DISCLOSURE, CONFIRMED, DELIVERED}; DRAFT, BLOCKED_SAFETY_HOLD, CLOSED and CANCELLED occupations are released and never counted."
    constants:
      RENTAL_TURNAROUND_DAYS: 2
    precision: "integer unit counts; day arithmetic on whole days"

  - name: core_liability_conservation
    trigger: "Invariant asserted after POST /parts-orders/{order_id}/confirm, after POST /parts-orders/{order_id}/cancel, and after POST /parts-orders/{order_id}/core-returns"
    algorithm: aggregation
    formula: |
      # Conserved quantity: committed core money on a PartCatalogItem.
      part.core_liability_outstanding_cents
        + part.core_credit_settled_cents
        + part.core_credit_forfeited_cents
        == part.core_face_value_committed_cents          # MUST hold at all times
      # confirm:      committed += F, outstanding += F
      # cancel:       committed -= F, outstanding -= F   (compensation; both sides move)
      # core-returns: outstanding -= F, settled += credited, forfeited += F - credited
      # where F = part.core_credit_cents * line.quantity for that part on that order
    input_set: "One PartCatalogItem's four core aggregate fields; F is derived from the order's lines for that part."
    constants: {}
    precision: "integer cents; no rounding is permitted anywhere in this ledger"

  - name: training_credit_conservation
    trigger: "Invariant asserted after POST /training-certifications, after POST /training-certifications/{certification_id}/void, and after a REVOKE authorization decision"
    algorithm: aggregation
    formula: |
      # Conserved quantity: training credit units held by a RepairProvider.
      provider.training_credit_balance
        + sum(cert.credits_consumed for cert of this provider
              where cert.status in {ACTIVE, EXPIRED})
        + provider.training_credit_forfeited_total
        == provider.training_credit_granted_total        # MUST hold at all times
      # certification create: balance -= 2, cert.credits_consumed = 2
      # void:                 balance += 2, cert.credits_consumed = 0 (compensation)
      # REVOKE:               forfeited_total += balance, balance = 0
    input_set: "One RepairProvider plus all of its TrainingCertification rows; VOIDED rows contribute 0."
    constants:
      CERT_CREDIT_COST: 2
    precision: "integer credit units; never fractional"

# =============================================================================
# 1.4 Validation Rules Table  (GLOBAL evaluation order — lowest priority first;
# the first rule whose condition holds returns and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 5
    rule: "X-Role header absent, empty, or not one of ProgramAdmin | SafetyReviewer | DocumentationEngineer | ComplianceOfficer | SelfRepairCustomer | RepairProviderTech | FailureAnalysisEngineer"
    category: authorization
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "every endpoint"
  - priority: 6
    rule: "X-User-ID header absent or empty on a write that records an actor identity (assessment, order, line, acknowledgment, review decision, publish, analysis, credit decision, attestation, certification, void, authorization decision)"
    category: authorization
    error_id: ERR_MISSING_USER_ID
    http_status: 400
    applies_to: "every POST endpoint except POST /repair-program/_clock/set_current_utc and POST /repair-program/compliance-sweeps"
  - priority: 8
    rule: "X-Role header is a known role but is not listed in the target endpoint's roles"
    category: authorization
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "every endpoint"
  - priority: 10
    rule: "Request body is not an object, a required input field is absent, a field has the wrong JSON type, an enum-typed field carries a value outside its declared set, or an unknown field is present"
    category: structural
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST endpoint"
  - priority: 12
    rule: "Numeric field out of admissible range: quantity < 1; exam_score outside 0..100; technician_count < 1; horizon_months outside 1..60; any *_cents < 0; safety_warning_count < 0; min_parts_availability_years or min_documentation_years < 0; concurrent_rental_capacity < 1; measured_offset_ppm outside -100000..100000; training_credit_grant < 0"
    category: structural
    error_id: ERR_INVALID_RANGE
    http_status: 422
    applies_to: "POST /product-models, POST /compliance-profiles, POST /part-catalog-items, POST /part-compatibilities, POST /manual-revisions, POST /parts-orders/{order_id}/lines, POST /parts-orders/{order_id}/lines/{line_id}/calibrate, POST /repair-providers, POST /repair-providers/{provider_id}/begin-training, POST /training-certifications, POST /defective-returns, GET /part-catalog-items/{part_id}/demand-forecast"
  - priority: 14
    rule: "Interval endpoints inverted: effective_until <= effective_from (half-open windows must be non-empty); valid_until < valid_from; rental_window_end < rental_window_start; support_end_date < end_of_production_date; end_of_production_date < market_release_date"
    category: structural
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /part-compatibilities, POST /training-certifications, POST /parts-orders, POST /product-models, POST /product-models/{model_id}/end-production, POST /product-models/{model_id}/end-support"
  - priority: 16
    rule: "Natural-key uniqueness violated: ProductModel.model_code already exists; PartCatalogItem.sku already exists; RegionalComplianceProfile.region_code already exists; a ComplianceObligation already exists for the same (model_id, region_code)"
    category: structural
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    applies_to: "POST /product-models, POST /part-catalog-items, POST /compliance-profiles, POST /compliance-obligations"
  - priority: 20
    rule: "A path-parameter or body id does not resolve to a stored row; the returned code names the missing entity — ERR_MODEL_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_MANUAL_REVISION_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_RETURN_CASE_NOT_FOUND, ERR_OBLIGATION_NOT_FOUND, ERR_ACKNOWLEDGMENT_NOT_FOUND, ERR_COMPATIBILITY_NOT_FOUND"
    category: referential
    error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id and every POST whose body carries a foreign key"
  - priority: 22
    rule: "The supplied region_code has no RegionalComplianceProfile row"
    category: referential
    error_id: ERR_REGION_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance-obligations, POST /eligibility-assessments, POST /parts-orders, POST /repair-providers"
  - priority: 24
    rule: "Nested resource is not owned by the parent named in the path: {line_id} belongs to a different order; {order_id} in a defective-return chain does not own the referenced order_line_id"
    category: referential
    error_id: ERR_ORDER_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /parts-orders/{order_id}/lines/{line_id}/authenticate, POST /parts-orders/{order_id}/lines/{line_id}/calibrate"
  - priority: 26
    rule: "supersedes_part_id would create a supersession cycle — the referenced part transitively supersedes the part being created or re-pointed, or equals it"
    category: referential
    error_id: ERR_SUPERSESSION_CYCLE
    http_status: 422
    applies_to: "POST /part-catalog-items, POST /part-catalog-items/{part_id}/supersession"
  - priority: 27
    rule: "A successor part declares supersedes_part_id on a predecessor whose part_class differs from its own"
    category: referential
    error_id: ERR_SUPERSESSION_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /repair-program/part-catalog-items, POST /repair-program/part-catalog-items/{part_id}/supersession"
  - priority: 30
    rule: "expected_model_version does not equal the current ProductModel.version (see §1.2.1 rule revision-create-stale-model)"
    category: concurrency
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412
    applies_to: "POST /manual-revisions"
  - priority: 32
    rule: "expected_order_version does not equal the current PartsOrder.version (see §1.2.1 rule line-append-stale-order)"
    category: concurrency
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /parts-orders/{order_id}/lines"
  - priority: 40
    rule: "Caller with X-Role: SelfRepairCustomer acts on a PartsOrder (or an EligibilityAssessment) whose customer_user_id / requester_user_id does not equal the caller's X-User-ID"
    category: authorization
    error_id: ERR_ORDER_NOT_OWNED
    http_status: 403
    applies_to: "POST /parts-orders/{order_id}/lines, POST /parts-orders/{order_id}/request-disclosure, POST /parts-orders/{order_id}/acknowledgments, POST /parts-orders/{order_id}/confirm, POST /parts-orders/{order_id}/cancel, POST /defective-returns"
  - priority: 42
    rule: "Caller with X-Role: RepairProviderTech, whose X-User-ID resolves through TrainingCertification.technician_user_id to RepairProvider P, acts on a PartsOrder or TrainingCertification belonging to a different provider — or the X-User-ID resolves to no provider at all"
    category: authorization
    error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /parts-orders, POST /parts-orders/{order_id}/lines, POST /parts-orders/{order_id}/confirm, POST /parts-orders/{order_id}/cancel, POST /training-certifications, POST /defective-returns"
  - priority: 44
    rule: "Segregation of duties on documentation: the review decision is submitted with the same X-User-ID that authored the revision (ManualRevision.authored_by_user_id)"
    category: authorization
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: "POST /manual-revisions/{revision_id}/review-decision"
  - priority: 46
    rule: "Segregation of duties on returns: the credit decision is submitted with the same X-User-ID that recorded the failure analysis (DefectiveReturnCase.analyzed_by_user_id)"
    category: authorization
    error_id: ERR_SELF_DECISION_FORBIDDEN
    http_status: 403
    applies_to: "POST /defective-returns/{case_id}/credit-decision"
  - priority: 50
    rule: "PRIORITY-CONFLICT PAIR A (higher half). Confirmation is refused while any line of the order references a PartCatalogItem whose status == RESTRICTED, even if the order itself was left in PENDING_DISCLOSURE by the conditional safety cascade"
    category: business_safety
    error_id: ERR_ORDER_CONTAINS_RESTRICTED_PART
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/confirm"
  - priority: 52
    rule: "Authentication is attempted on a line whose part.requires_authentication == false"
    category: business_safety
    error_id: ERR_AUTHENTICATION_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/lines/{line_id}/authenticate"
  - priority: 54
    rule: "Calibration is attempted on a line whose part.requires_authentication == true while authentication_status != AUTHENTIC"
    category: business_safety
    error_id: ERR_AUTHENTICATION_REQUIRED_FIRST
    http_status: 409
    applies_to: "POST /parts-orders/{order_id}/lines/{line_id}/calibrate"
  - priority: 56
    rule: "Calibration is attempted when calibration_attempt_count is already >= CALIBRATION_ATTEMPT_CAP (3) or calibration_status == CALIBRATION_ESCALATED"
    category: business_safety
    error_id: ERR_CALIBRATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /parts-orders/{order_id}/lines/{line_id}/calibrate"
  - priority: 58
    rule: "ISSUE_CREDIT is requested on a DefectiveReturnCase whose source PartsOrderLine never finished the mandated post-replacement service steps — calibration_status is in {CALIBRATION_REQUIRED, CALIBRATION_IN_PROGRESS, CALIBRATION_FAILED, CALIBRATION_ESCALATED} or authentication_status == PENDING_AUTHENTICATION. A COUNTERFEIT_SUSPECT line is deliberately NOT listed: it is decided rather than incomplete, so it clears this rule and calculations.defective_return_credit zeroes the credit"
    category: business_safety
    error_id: ERR_CALIBRATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /defective-returns/{case_id}/credit-decision"
  - priority: 60
    rule: "The requested trigger is not defined for the entity's current state in §1.2 (includes repeating a trigger that has already been consumed and any trigger out of a terminal state). EXEMPTION: the one declared-but-guarded call documented in §1.2 — a second POST /parts-orders/{order_id}/core-returns on an already-settled order — is NOT reported here; it falls through to the conservation rule at priority 160"
    category: business_state
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 62
    rule: "PRIORITY-CONFLICT PAIR B (higher half). A certification is filed against a provider whose authorization_status is not in {TRAINING_IN_PROGRESS, AUTHORIZED}"
    category: business_state
    error_id: ERR_PROVIDER_NOT_ACCEPTING_CERTS
    http_status: 409
    applies_to: "POST /training-certifications"
  - priority: 63
    rule: "An AUTHORIZE or REINSTATE authorization decision is taken while active_cert_count < required_cert_count (required_cert_count = ceil(technician_count / 4))"
    category: business_state
    error_id: ERR_TRAINING_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /repair-program/repair-providers/{provider_id}/authorization-decision"
  - priority: 64
    rule: "PartsOrder creation references an EligibilityAssessment whose status != VALID (REVOKED_BY_SAFETY, EXPIRED or already CONSUMED by another order)"
    category: business_state
    error_id: ERR_ASSESSMENT_NOT_VALID
    http_status: 409
    applies_to: "POST /parts-orders"
  - priority: 65
    rule: "Confirmation of an AUTHORIZED_PROVIDER order while the RepairProvider.authorization_status is not AUTHORIZED (APPLIED, TRAINING_IN_PROGRESS, SUSPENDED or REVOKED)"
    category: business_state
    error_id: ERR_PROVIDER_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /repair-program/parts-orders/{order_id}/confirm"
  - priority: 66
    rule: "PartsOrder creation references an EligibilityAssessment whose decision is one of the BLOCKED_* values"
    category: business_state
    error_id: ERR_ASSESSMENT_BLOCKED
    http_status: 422
    applies_to: "POST /parts-orders"
  - priority: 67
    rule: "A DISASSEMBLY_GUIDE revision is approved while coverage_gap_sku_count > 0 — the guide does not cover every PUBLISHED part with an in-window compatibility row for the model"
    category: business_state
    error_id: ERR_REVISION_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /repair-program/manual-revisions/{revision_id}/review-decision"
  - priority: 68
    rule: "A line references a PartCatalogItem whose status is not PUBLISHED (DRAFT, RESTRICTED or SUPERSEDED), or whose (part, model) pair has no PartModelCompatibility row whose half-open window contains the logical clock"
    category: business_state
    error_id: ERR_PART_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/lines"
  - priority: 69
    rule: "Calibration is attempted while the model has no PUBLISHED CALIBRATION_PROCEDURE ManualRevision"
    category: business_state
    error_id: ERR_NO_PUBLISHED_CALIBRATION_PROCEDURE
    http_status: 422
    applies_to: "POST /repair-program/parts-orders/{order_id}/lines/{line_id}/calibrate"
  - priority: 70
    rule: "Disclosure is requested on an order that has zero lines"
    category: business_state
    error_id: ERR_ORDER_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/request-disclosure"
  - priority: 71
    rule: "ISSUE_CREDIT is requested on a case whose root_cause_code == CUSTOMER_MISUSE"
    category: business_state
    error_id: ERR_CREDIT_NOT_ALLOWED_FOR_ROOT_CAUSE
    http_status: 422
    applies_to: "POST /repair-program/defective-returns/{case_id}/credit-decision"
  - priority: 72
    rule: "A revision is resubmitted for review when rejection_cycle_count is already >= REVISION_CYCLE_CAP (3)"
    category: business_state
    error_id: ERR_REVISION_CYCLE_CAP_REACHED
    http_status: 409
    applies_to: "POST /manual-revisions/{revision_id}/submit"
  - priority: 74
    rule: "A DISASSEMBLY_GUIDE or SAFETY_SHEET revision is published with safety_warning_count == 0, or with an empty covered_part_skus list"
    category: business_state
    error_id: ERR_SAFETY_WARNINGS_REQUIRED
    http_status: 422
    applies_to: "POST /manual-revisions/{revision_id}/publish"
  - priority: 80
    rule: "A line append or disclosure request is refused while the order's ProductModel has compliance_posture == ORDER_RESTRICTED"
    category: business_compliance
    error_id: ERR_MODEL_ORDER_RESTRICTED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/lines, POST /parts-orders/{order_id}/request-disclosure"
  - priority: 82
    rule: "An AUTHORIZED_PROVIDER order appends a line whose part.safety_class demands a stricter access tier than the provider holds: SAFETY_RESTRICTED_HIGH_VOLTAGE requires parts_access_tier == TIER_1_UNRESTRICTED; SAFETY_RESTRICTED_BATTERY and PAIRED_SECURITY require TIER_1_UNRESTRICTED or TIER_2_SAFETY"
    category: business_compliance
    error_id: ERR_PARTS_ACCESS_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /parts-orders/{order_id}/lines"
  - priority: 84
    rule: "The acknowledgment's warranty_impact_class_ack does not equal the order's computed warranty_impact_class, or acknowledged_scope is TOOL_RENTAL_ONLY while the order contains a COMPONENT line"
    category: business_compliance
    error_id: ERR_DISCLOSURE_MISMATCH
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/acknowledgments"
  - priority: 86
    rule: "The acknowledgment's liability_warning_version does not equal the order's pinned assessment liability_warning_version — the model's published documentation revision moved on since the assessment was issued"
    category: business_compliance
    error_id: ERR_LIABILITY_WARNING_STALE
    http_status: 409
    applies_to: "POST /parts-orders/{order_id}/acknowledgments"
  - priority: 88
    rule: "Confirmation is attempted with no DisclosureAcknowledgment whose acknowledged_scope covers the order's contents (FULL_SELF_REPAIR for consumer orders containing components, PROVIDER_MANAGED for provider orders, TOOL_RENTAL_ONLY only for rental/tool-only orders)"
    category: business_compliance
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/confirm"
  - priority: 90
    rule: "Attestation is submitted with documentation_verified == true while the model's documentation_posture is not CURRENT, or with documentation_verified == false at all (an attestation must assert verification)"
    category: business_compliance
    error_id: ERR_ATTESTATION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /compliance-obligations/{obligation_id}/attest"
  - priority: 120
    rule: "PRIORITY-CONFLICT PAIR A (lower half). Confirmation is attempted when the pinned EligibilityAssessment.expires_at is strictly before the logical clock"
    category: business_temporal
    error_id: ERR_ASSESSMENT_EXPIRED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/confirm"
  - priority: 122
    rule: "Confirmation is attempted after the mandated parts window has elapsed for the order's region: the logical clock is strictly after the matching ComplianceObligation.parts_available_until (an INCLUSIVE end-of-day deadline, so a clock exactly equal to it still passes)"
    category: business_temporal
    error_id: ERR_PARTS_WINDOW_ELAPSED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/confirm"
  - priority: 124
    rule: "A RENTAL_KIT line is appended to an order whose rental_window_start or rental_window_end is null, or whose rental_window_start is strictly before the logical clock's calendar date"
    category: business_temporal
    error_id: ERR_RENTAL_WINDOW_REQUIRED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/lines"
  - priority: 126
    rule: "core-returns is filed with received_at strictly before the order's confirmed_at, or strictly after the logical clock"
    category: business_temporal
    error_id: ERR_CORE_RECEIPT_BEFORE_CONFIRM
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/core-returns"
  - priority: 128
    rule: "A certification is filed whose valid_until is not strictly after the logical clock, or whose exam_score is below CERT_PASS_SCORE (70)"
    category: business_temporal
    error_id: ERR_CERTIFICATION_ALREADY_EXPIRED
    http_status: 422
    applies_to: "POST /training-certifications"
  - priority: 130
    rule: "The logical clock is asked to move to an instant that is not strictly after the current logical clock"
    category: business_temporal
    error_id: ERR_CLOCK_MONOTONICITY
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 140
    rule: "PRIORITY-CONFLICT PAIR B (lower half). A certification is filed when the provider's training_credit_balance is below CERT_CREDIT_COST (2)"
    category: resource_capacity
    error_id: ERR_TRAINING_CREDIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /training-certifications"
  - priority: 142
    rule: "Aggregate rental occupancy for the part over the requested closed window plus the RENTAL_TURNAROUND_DAYS buffer would exceed concurrent_rental_capacity (see calculation rental_capacity_occupancy)"
    category: resource_capacity
    error_id: ERR_RENTAL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /parts-orders/{order_id}/lines"
  - priority: 144
    rule: "A SELF_REPAIR_CONSUMER order's recomputed core_deposit_cents would exceed CONSUMER_CORE_DEPOSIT_CAP_CENTS (50000)"
    category: resource_capacity
    error_id: ERR_CORE_DEPOSIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /parts-orders/{order_id}/lines, POST /parts-orders/{order_id}/request-disclosure"
  - priority: 146
    rule: "The requested return quantity plus the quantities of all non-REJECTED DefectiveReturnCase rows already filed against the line would exceed the line's quantity"
    category: resource_capacity
    error_id: ERR_RETURN_QUANTITY_EXCEEDS_LINE
    http_status: 422
    applies_to: "POST /defective-returns"
  - priority: 148
    rule: "The new PartModelCompatibility half-open window [effective_from, effective_until) overlaps an existing window for the same (part_id, model_id); abutting windows where one ends exactly when the next begins are ACCEPTED"
    category: resource_temporal
    error_id: ERR_COMPATIBILITY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /part-compatibilities"
  - priority: 150
    rule: "The new TrainingCertification closed window [valid_from, valid_until] overlaps an ACTIVE certification for the same (technician_user_id, course_code); touching endpoints DO collide because both bounds are inclusive"
    category: resource_temporal
    error_id: ERR_CERTIFICATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /training-certifications"
  - priority: 160
    rule: "A second POST /parts-orders/{order_id}/core-returns is filed on an order whose core_return_status is already CORE_RECEIVED, CORE_CREDIT_ISSUED, CORE_FORFEITED or CORE_RELEASED: the face value has already left core_liability_outstanding_cents, so re-settling would drive it below zero and break the identity of calculation core_liability_conservation. Declared-but-guarded per §1.2, so the generic priority-60 rule is skipped for this call. Also covers a cancel whose compensation would break the same identity"
    category: conservation
    error_id: ERR_CORE_LEDGER_INVARIANT
    http_status: 409
    applies_to: "POST /parts-orders/{order_id}/core-returns, POST /parts-orders/{order_id}/cancel"
  - priority: 162
    rule: "A void would restore credit to a provider whose authorization_status == REVOKED, whose balance was already swept into training_credit_forfeited_total; restoring it would break calculation training_credit_conservation"
    category: conservation
    error_id: ERR_CREDIT_RESTORE_FORBIDDEN
    http_status: 409
    applies_to: "POST /training-certifications/{certification_id}/void"

# =============================================================================
# 1.5 Endpoint Contract Table  (72 endpoints, all under api_prefix /repair-program)
# =============================================================================
endpoints:
  # --- ProductModel -----------------------------------------------------------
  - method: POST
    path: /repair-program/product-models
    roles: [ProgramAdmin]
    input: [model_code, product_family, market_release_date, repairability_tier, "end_of_production_date?", "last_hardware_change_date?"]
    output: ProductModel
    success_status: 201
    side_effects: "support_state = ACTIVE_PRODUCTION (or LEGACY_SUPPORT when end_of_production_date is supplied); documentation_posture = MISSING; compliance_posture = OPEN; open_obligation_count = 0; published_disassembly_revision_number and published_safety_sheet_revision_number = null; version = 1"

  - method: GET
    path: /repair-program/product-models/{model_id}
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: []
    output: ProductModel
    success_status: 200
    side_effects: "none — read only; the source of ProductModel.version for expected_model_version"

  - method: GET
    path: /repair-program/product-models
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["product_family?", "support_state?", "repairability_tier?", "compliance_posture?", "documentation_posture?", "limit?", "offset?"]
    output: ProductModel[]
    success_status: 200
    side_effects: "none — paginated read"

  - method: POST
    path: /repair-program/product-models/{model_id}/end-production
    roles: [ProgramAdmin]
    input: [end_of_production_date]
    output: ProductModel
    success_status: 200
    side_effects: "ACTIVE_PRODUCTION -> LEGACY_SUPPORT; re-runs mandated_support_window for every ComplianceObligation of the model (deadline_basis becomes END_OF_PRODUCTION), then obligation_status_evaluation and model_compliance_posture_rollup"

  - method: POST
    path: /repair-program/product-models/{model_id}/end-support
    roles: [ProgramAdmin]
    input: [support_end_date]
    output: ProductModel
    success_status: 200
    side_effects: "LEGACY_SUPPORT -> SUPPORT_ENDED (terminal); every OPEN/AT_RISK/ATTESTED obligation whose parts_available_until is in the past is CLOSED; VALID EligibilityAssessment rows for the model become EXPIRED"

  - method: GET
    path: /repair-program/product-models/{model_id}/compliance-obligations
    roles: [ProgramAdmin, ComplianceOfficer, SafetyReviewer]
    input: ["status?", "region_code?", "limit?", "offset?"]
    output: ComplianceObligation[]
    success_status: 200
    side_effects: "none — reverse lookup for ComplianceObligation.model_id"

  - method: GET
    path: /repair-program/product-models/{model_id}/part-compatibilities
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, SelfRepairCustomer, RepairProviderTech]
    input: ["part_id?", "as_of_date?", "limit?", "offset?"]
    output: PartModelCompatibility[]
    success_status: 200
    side_effects: "none — reverse lookup for PartModelCompatibility.model_id"

  # --- RegionalComplianceProfile / ComplianceObligation ------------------------
  - method: POST
    path: /repair-program/compliance-profiles
    roles: [ProgramAdmin, ComplianceOfficer]
    input: [region_code, min_parts_availability_years, min_documentation_years, requires_public_manual, max_documentation_fee_cents, allows_pairing_restriction, self_service_mandate_tier]
    output: RegionalComplianceProfile
    success_status: 201
    side_effects: "none beyond creation; region_code is the natural key used by obligations, assessments and orders"

  - method: GET
    path: /repair-program/compliance-profiles
    roles: [ProgramAdmin, ComplianceOfficer, SafetyReviewer, SelfRepairCustomer, RepairProviderTech]
    input: ["region_code?", "self_service_mandate_tier?", "limit?", "offset?"]
    output: RegionalComplianceProfile[]
    success_status: 200
    side_effects: "none — paginated read"

  - method: POST
    path: /repair-program/compliance-obligations
    roles: [ComplianceOfficer, ProgramAdmin]
    input: [model_id, region_code]
    output: ComplianceObligation
    success_status: 201
    side_effects: "runs mandated_support_window to stamp deadline_basis, parts_available_until and documentation_available_until; runs obligation_status_evaluation for the initial status; runs model_compliance_posture_rollup on the model; breach_count = 0; documentation_verified = false"

  - method: POST
    path: /repair-program/compliance-obligations/{obligation_id}/attest
    roles: [ComplianceOfficer]
    input: [attestation_note, documentation_verified]
    output: ComplianceObligation
    success_status: 200
    side_effects: "status -> ATTESTED; last_attested_at = logical clock; last_attested_by_user_id = X-User-ID; documentation_verified stored; model_compliance_posture_rollup re-runs (an ATTESTED row counts as open, never as breached)"

  - method: GET
    path: /repair-program/compliance-obligations/{obligation_id}
    roles: [ProgramAdmin, ComplianceOfficer, SafetyReviewer]
    input: []
    output: ComplianceObligation
    success_status: 200
    side_effects: "none — read only; canonical single-row read for an obligation"

  - method: GET
    path: /repair-program/compliance-obligations
    roles: [ProgramAdmin, ComplianceOfficer, SafetyReviewer]
    input: ["model_id?", "region_code?", "status?", "deadline_basis?", "limit?", "offset?"]
    output: ComplianceObligation[]
    success_status: 200
    side_effects: "none — paginated read; reverse lookup for ComplianceObligation.model_id and .region_code"

  - method: POST
    path: /repair-program/compliance-sweeps
    roles: [ComplianceOfficer, ProgramAdmin]
    input: ["model_id?"]
    output:
      swept_obligation_count: integer
      breached_obligation_ids: string[]
      expired_assessment_ids: string[]
      restricted_model_ids: string[]
    success_status: 200
    side_effects: "re-runs obligation_status_evaluation for every obligation in scope (all obligations when model_id is omitted), incrementing breach_count on each BREACHED_* outcome; marks every VALID EligibilityAssessment whose expires_at < clock as EXPIRED; re-runs model_compliance_posture_rollup for every touched model and reports the ones now ORDER_RESTRICTED"

  # --- PartCatalogItem --------------------------------------------------------
  - method: POST
    path: /repair-program/part-catalog-items
    roles: [ProgramAdmin]
    input: [sku, part_class, safety_class, list_price_cents, core_return_required, "core_credit_cents?", "requires_authentication?", "requires_calibration?", "rental_deposit_cents?", "concurrent_rental_capacity?", "supersedes_part_id?"]
    output: PartCatalogItem
    success_status: 201
    side_effects: "status = DRAFT; the four core ledger aggregates start at 0; core_credit_cents defaults to 0, rental_deposit_cents to 0, concurrent_rental_capacity to null, requires_authentication and requires_calibration to false"

  - method: GET
    path: /repair-program/part-catalog-items/{part_id}
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: []
    output: PartCatalogItem
    success_status: 200
    side_effects: "none — read only; exposes the core ledger aggregates for the conservation invariant"

  - method: GET
    path: /repair-program/part-catalog-items
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["part_class?", "safety_class?", "status?", "supersedes_part_id?", "limit?", "offset?"]
    output: PartCatalogItem[]
    success_status: 200
    side_effects: "none — paginated read; supersedes_part_id filter is the flat reverse lookup for the self-referential supersession edge"

  - method: GET
    path: /repair-program/part-catalog-items/{part_id}/successors
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["limit?", "offset?"]
    output: PartCatalogItem[]
    success_status: 200
    side_effects: "none — reverse lookup for PartCatalogItem.supersedes_part_id (the parts that declare this part as their predecessor)"

  - method: GET
    path: /repair-program/part-catalog-items/{part_id}/part-compatibilities
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, SelfRepairCustomer, RepairProviderTech]
    input: ["model_id?", "limit?", "offset?"]
    output: PartModelCompatibility[]
    success_status: 200
    side_effects: "none — reverse lookup for PartModelCompatibility.part_id and .required_tool_part_id"

  - method: GET
    path: /repair-program/part-catalog-items/{part_id}/order-lines
    roles: [ProgramAdmin, SafetyReviewer, FailureAnalysisEngineer]
    input: ["order_id?", "calibration_status?", "authentication_status?", "limit?", "offset?"]
    output: PartsOrderLine[]
    success_status: 200
    side_effects: "none — reverse lookup for PartsOrderLine.part_id"

  - method: POST
    path: /repair-program/part-catalog-items/{part_id}/publish
    roles: [ProgramAdmin]
    input: []
    output: PartCatalogItem
    success_status: 200
    side_effects: "DRAFT -> PUBLISHED; when supersedes_part_id is set, the predecessor moves PUBLISHED -> SUPERSEDED; documentation_posture_rollup re-runs for every model this part is compatible with (a newly required sku can open a coverage gap and flip a model to STALE), then obligation_status_evaluation and model_compliance_posture_rollup"

  - method: POST
    path: /repair-program/part-catalog-items/{part_id}/supersession
    roles: [ProgramAdmin]
    input: [supersedes_part_id, supersession_note]
    output: PartCatalogItem
    success_status: 200
    side_effects: "re-points supersedes_part_id at another catalog row and marks that predecessor SUPERSEDED; refuses a chain that would close a cycle (ERR_SUPERSESSION_CYCLE) or cross part_class (ERR_SUPERSESSION_CLASS_MISMATCH); increments version by 1"

  - method: POST
    path: /repair-program/part-catalog-items/{part_id}/restrict
    roles: [SafetyReviewer]
    input: [safety_class, restriction_reason]
    output: PartCatalogItem
    success_status: 200
    side_effects: "PUBLISHED -> RESTRICTED and safety_class is raised; fires the four-hop conditional safety cascade documented in §1.2 (compatibilities flagged, VALID assessments -> REVOKED_BY_SAFETY, unacknowledged orders -> BLOCKED_SAFETY_HOLD while acknowledged orders are left for the confirm-time validation at priority 50)"

  - method: GET
    path: /repair-program/part-catalog-items/{part_id}/demand-forecast
    roles: [ProgramAdmin, ComplianceOfficer]
    input: [model_id, horizon_months, "variant?"]
    output:
      variant: string
      trailing_units: integer
      pipeline_units: integer
      base_monthly_units: number
      obsolescence_band: string
      band_multiplier: number
      projected_units: number
      safety_stock_pct: number
      mandated_buffer_units: integer
      recommended_stock_units: integer
    success_status: 200
    side_effects: "none — computed read implementing long_tail_demand_forecast; nothing is persisted"

  # --- PartModelCompatibility -------------------------------------------------
  - method: POST
    path: /repair-program/part-compatibilities
    roles: [ProgramAdmin]
    input: [part_id, model_id, effective_from, self_service_eligible, install_minutes, "effective_until?", "required_tool_part_id?"]
    output: PartModelCompatibility
    success_status: 201
    side_effects: "superseded_by_safety_restriction = false; documentation_posture_rollup re-runs for the model because the required-sku set may have grown"

  - method: GET
    path: /repair-program/part-compatibilities/{compatibility_id}
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: []
    output: PartModelCompatibility
    success_status: 200
    side_effects: "none — read only"

  - method: GET
    path: /repair-program/part-compatibilities
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: ["part_id?", "model_id?", "required_tool_part_id?", "self_service_eligible?", "as_of_date?", "limit?", "offset?"]
    output: PartModelCompatibility[]
    success_status: 200
    side_effects: "none — flat filtered lookup covering all three foreign keys of the junction entity"

  # --- ManualRevision ---------------------------------------------------------
  - method: POST
    path: /repair-program/manual-revisions
    roles: [DocumentationEngineer, SafetyReviewer]
    input: [model_id, doc_type, covered_part_skus, safety_warning_count, expected_model_version]
    output: ManualRevision
    success_status: 201
    side_effects: "OCC guarded (§1.2.1 revision-create-stale-model): the model's version must match expected_model_version, and the model's version increments on success. revision_number = 1 + max(revision_number) over existing rows for the same (model_id, doc_type); status = DRAFT; authored_by_user_id = X-User-ID; rejection_cycle_count = 0; coverage_gap_sku_count computed against the current required-sku set"

  - method: GET
    path: /repair-program/manual-revisions/{revision_id}
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: []
    output: ManualRevision
    success_status: 200
    side_effects: "none — read only"

  - method: GET
    path: /repair-program/manual-revisions
    roles: [ProgramAdmin, SafetyReviewer, DocumentationEngineer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: ["model_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: ManualRevision[]
    success_status: 200
    side_effects: "none — reverse lookup for ManualRevision.model_id"

  - method: POST
    path: /repair-program/manual-revisions/{revision_id}/submit
    roles: [DocumentationEngineer, SafetyReviewer]
    input: []
    output: ManualRevision
    success_status: 200
    side_effects: "DRAFT -> IN_REVIEW; coverage_gap_sku_count recomputed against the current required-sku set; refused once rejection_cycle_count has reached 3"

  - method: POST
    path: /repair-program/manual-revisions/{revision_id}/review-decision
    roles: [SafetyReviewer]
    input: [decision, review_note]
    output: ManualRevision
    success_status: 200
    side_effects: "decision=APPROVE: IN_REVIEW -> APPROVED and reviewed_by_user_id = X-User-ID. decision=REJECT: IN_REVIEW -> DRAFT (the cycle) and rejection_cycle_count += 1. Segregation of duties: X-User-ID must differ from authored_by_user_id"

  - method: POST
    path: /repair-program/manual-revisions/{revision_id}/publish
    roles: [SafetyReviewer]
    input: ["effective_from?"]
    output: ManualRevision
    success_status: 200
    side_effects: "APPROVED -> PUBLISHED with effective_from defaulting to the logical clock and published_at = clock; the previously PUBLISHED revision of the same (model_id, doc_type) becomes SUPERSEDED; then the four-hop documentation cascade of §1.2 — published_* revision numbers refreshed, documentation_posture_rollup, obligation_status_evaluation, model_compliance_posture_rollup"

  # --- EligibilityAssessment --------------------------------------------------
  - method: POST
    path: /repair-program/eligibility-assessments
    roles: [SelfRepairCustomer, RepairProviderTech, ProgramAdmin]
    input: [model_id, part_id, region_code, requester_class, "provider_id?"]
    output: EligibilityAssessment
    success_status: 201
    success_status_note: "always 201 — a BLOCKED_* decision is a successful assessment, not an error"
    side_effects: "runs self_repair_eligibility_decision, warranty_impact_classification and self_repair_risk_index; pins pinned_manual_revision_id and liability_warning_version; requester_user_id = X-User-ID; status = VALID; expires_at = created_at + 60 days"

  - method: GET
    path: /repair-program/eligibility-assessments/{assessment_id}
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: []
    output: EligibilityAssessment
    success_status: 200
    side_effects: "none — read only"

  - method: GET
    path: /repair-program/eligibility-assessments
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: ["model_id?", "part_id?", "provider_id?", "pinned_manual_revision_id?", "decision?", "status?", "limit?", "offset?"]
    output: EligibilityAssessment[]
    success_status: 200
    side_effects: "none — reverse lookup for all four EligibilityAssessment foreign keys"

  # --- PartsOrder -------------------------------------------------------------
  - method: POST
    path: /repair-program/parts-orders
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: [assessment_id, region_code, buyer_class, "provider_id?", "rental_window_start?", "rental_window_end?"]
    output: PartsOrder
    success_status: 201
    side_effects: "fulfillment_status = DRAFT; core_return_status = NOT_REQUIRED; model_id, pinned_manual_revision_id, pinned_manual_revision_number and warranty_impact_class copied from the assessment; the assessment moves VALID -> CONSUMED; customer_user_id = X-User-ID; every money field starts at 0"

  - method: GET
    path: /repair-program/parts-orders/{order_id}
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: []
    output: PartsOrder
    success_status: 200
    side_effects: "none — read only; the source of PartsOrder.version for expected_order_version"

  - method: GET
    path: /repair-program/parts-orders
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["model_id?", "assessment_id?", "provider_id?", "pinned_manual_revision_id?", "fulfillment_status?", "core_return_status?", "limit?", "offset?"]
    output: PartsOrder[]
    success_status: 200
    side_effects: "none — reverse lookup for all four PartsOrder foreign keys"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/lines
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: [part_id, quantity, expected_order_version]
    output: PartsOrderLine
    success_status: 201
    side_effects: "OCC guarded (§1.2.1 line-append-stale-order): the order's version must match expected_order_version and increments on success — read GET /repair-program/parts-orders/{order_id} again before appending a second line. Runs parts_order_pricing over the whole order, rental_capacity_occupancy for RENTAL_KIT parts, and sets authentication_status / calibration_status from the part's requires_* flags"

  - method: GET
    path: /repair-program/parts-orders/{order_id}/lines
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["calibration_status?", "authentication_status?", "limit?", "offset?"]
    output: PartsOrderLine[]
    success_status: 200
    side_effects: "none — reverse lookup for PartsOrderLine.order_id"

  - method: GET
    path: /repair-program/order-lines/{line_id}
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: []
    output: PartsOrderLine
    success_status: 200
    side_effects: "none — read only; canonical single-row read for a line, independent of its parent order path"

  - method: GET
    path: /repair-program/order-lines
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["order_id?", "part_id?", "calibration_status?", "authentication_status?", "limit?", "offset?"]
    output: PartsOrderLine[]
    success_status: 200
    side_effects: "none — paginated read; reverse lookup for PartsOrderLine.order_id and PartsOrderLine.part_id"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/request-disclosure
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: []
    output: PartsOrder
    success_status: 200
    side_effects: "DRAFT -> PENDING_DISCLOSURE; re-runs parts_order_pricing in full and freezes every money field; copies warranty_impact_class from the pinned assessment"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/acknowledgments
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: [warranty_impact_class_ack, liability_warning_version, acknowledged_scope]
    output: DisclosureAcknowledgment
    success_status: 201
    side_effects: "immutable record (no version, no update path); acknowledged_by_user_id = X-User-ID; manual_revision_number copied from the order's pinned revision number; the order's disclosure_acknowledged_at is stamped with the logical clock, which is what makes the order immune to HOP 4 of the safety cascade"

  - method: GET
    path: /repair-program/parts-orders/{order_id}/acknowledgments
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: ["limit?", "offset?"]
    output: DisclosureAcknowledgment[]
    success_status: 200
    side_effects: "none — reverse lookup for DisclosureAcknowledgment.order_id"

  - method: GET
    path: /repair-program/disclosure-acknowledgments/{acknowledgment_id}
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: []
    output: DisclosureAcknowledgment
    success_status: 200
    side_effects: "none — read only; an unknown id yields ERR_ACKNOWLEDGMENT_NOT_FOUND"

  - method: GET
    path: /repair-program/disclosure-acknowledgments
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, SelfRepairCustomer, RepairProviderTech]
    input: ["order_id?", "acknowledged_scope?", "limit?", "offset?"]
    output: DisclosureAcknowledgment[]
    success_status: 200
    side_effects: "none — paginated read; reverse lookup for DisclosureAcknowledgment.order_id"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/confirm
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: []
    output: PartsOrder
    success_status: 200
    side_effects: "PENDING_DISCLOSURE -> CONFIRMED; confirmed_at = clock; when any line requires a core return, core_return_status -> PENDING_CORE, core_return_due_at = confirmed_at + 30 days, core_credit_provisional_cents = PROVISIONAL_HOLD figure, and each part's core_face_value_committed_cents and core_liability_outstanding_cents rise by that part's face value"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/deliver
    roles: [ProgramAdmin]
    input: ["delivered_at?"]
    output: PartsOrder
    success_status: 200
    side_effects: "CONFIRMED -> DELIVERED with delivered_at defaulting to the logical clock; every line whose part requires authentication or calibration is activated here; when no line needs either step and core_return_status == NOT_REQUIRED the order continues straight to CLOSED"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/cancel
    roles: [SelfRepairCustomer, RepairProviderTech, ProgramAdmin]
    input: [cancellation_reason]
    output: PartsOrder
    success_status: 200
    side_effects: "DRAFT | PENDING_DISCLOSURE | BLOCKED_SAFETY_HOLD | CONFIRMED -> CANCELLED (terminal); full compensation — every committed core face value is removed from BOTH core_face_value_committed_cents and core_liability_outstanding_cents, core_return_status -> CORE_RELEASED, provisional credit zeroed, and the pinned assessment is left CONSUMED (a cancellation never resurrects eligibility)"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/core-returns
    roles: [ProgramAdmin]
    input: [core_condition, received_at]
    output: PartsOrder
    success_status: 200
    side_effects: "core_return_status PENDING_CORE -> CORE_RECEIVED -> CORE_CREDIT_ISSUED or CORE_FORFEITED in one call; runs core_return_credit_settlement FINAL_SETTLEMENT to set core_days_late and core_credit_final_cents; moves each part's ledger from core_liability_outstanding_cents into core_credit_settled_cents / core_credit_forfeited_cents; when fulfillment_status is already DELIVERED the order also moves to CLOSED"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/lines/{line_id}/authenticate
    roles: [ProgramAdmin, RepairProviderTech, SelfRepairCustomer]
    input: [pairing_token]
    output: PartsOrderLine
    success_status: 200
    side_effects: "PENDING_AUTHENTICATION -> AUTHENTIC when the body pairing_token equals the token minted on the line at delivery (readable through GET /repair-program/parts-orders/{order_id}/lines); any other value -> COUNTERFEIT_SUSPECT (terminal for the authentication dimension, and it forces final defective-return credit to 0). When the part requires calibration, calibration_status was already set to CALIBRATION_REQUIRED at line creation and a successful authentication merely unblocks it"

  - method: POST
    path: /repair-program/parts-orders/{order_id}/lines/{line_id}/calibrate
    roles: [ProgramAdmin, RepairProviderTech, SelfRepairCustomer]
    input: [measured_offset_ppm]
    output: PartsOrderLine
    success_status: 200
    side_effects: "calibration_attempt_count += 1; last_measured_offset_ppm stored; |measured_offset_ppm| <= 150 -> CALIBRATION_PASSED (150 exactly passes); otherwise CALIBRATION_FAILED, and on the third failing attempt CALIBRATION_ESCALATED (terminal), which is what the provider compliance score penalises"

  # --- RepairProvider ---------------------------------------------------------
  - method: POST
    path: /repair-program/repair-providers
    roles: [ProgramAdmin]
    input: [legal_name, region_code, requested_access_tier, technician_count]
    output: RepairProvider
    success_status: 201
    side_effects: "authorization_status = APPLIED; parts_access_tier = null; required_cert_count = ceil(technician_count / 4); active_cert_count = 0; all three training-credit aggregates = 0; attested_compliance_score = null"

  - method: GET
    path: /repair-program/repair-providers/{provider_id}
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, RepairProviderTech, FailureAnalysisEngineer]
    input: []
    output: RepairProvider
    success_status: 200
    side_effects: "none — read only; exposes the training-credit ledger for the conservation invariant"

  - method: GET
    path: /repair-program/repair-providers
    roles: [ProgramAdmin, SafetyReviewer, ComplianceOfficer, RepairProviderTech, FailureAnalysisEngineer]
    input: ["region_code?", "authorization_status?", "parts_access_tier?", "limit?", "offset?"]
    output: RepairProvider[]
    success_status: 200
    side_effects: "none — paginated read"

  - method: POST
    path: /repair-program/repair-providers/{provider_id}/begin-training
    roles: [ProgramAdmin]
    input: [training_credit_grant]
    output: RepairProvider
    success_status: 200
    side_effects: "APPLIED -> TRAINING_IN_PROGRESS; training_credit_granted_total += training_credit_grant and training_credit_balance += the same amount (the conservation identity is preserved by construction)"

  - method: POST
    path: /repair-program/repair-providers/{provider_id}/authorization-decision
    roles: [ProgramAdmin, ComplianceOfficer]
    input: [decision, decision_reason, "granted_access_tier?"]
    output: RepairProvider
    success_status: 200
    side_effects: "decision=AUTHORIZE: TRAINING_IN_PROGRESS -> AUTHORIZED only when active_cert_count >= required_cert_count; stamps attested_compliance_score from the ROLLING_ATTESTED variant and sets parts_access_tier to the stricter of granted_access_tier (default requested_access_tier) and the score band. decision=SUSPEND: AUTHORIZED -> SUSPENDED and every VALID assessment of the provider becomes REVOKED_BY_SAFETY. decision=REINSTATE: SUSPENDED -> AUTHORIZED with the score and tier recomputed. decision=REVOKE: from TRAINING_IN_PROGRESS | AUTHORIZED | SUSPENDED -> REVOKED (terminal), sweeping the whole training_credit_balance into training_credit_forfeited_total"

  - method: GET
    path: /repair-program/repair-providers/{provider_id}/compliance-score
    roles: [ProgramAdmin, ComplianceOfficer, RepairProviderTech]
    input: ["variant?"]
    output:
      variant: string
      cert_coverage_ratio: number
      breach_count: integer
      calibration_failure_ratio: number
      score: integer
      access_tier_band: string
    success_status: 200
    side_effects: "none — computed read implementing provider_compliance_score; nothing is persisted, so the two variants can be compared against the same data"

  - method: GET
    path: /repair-program/repair-providers/{provider_id}/training-certifications
    roles: [ProgramAdmin, ComplianceOfficer, RepairProviderTech]
    input: ["technician_user_id?", "course_code?", "status?", "limit?", "offset?"]
    output: TrainingCertification[]
    success_status: 200
    side_effects: "none — reverse lookup for TrainingCertification.provider_id"

  - method: GET
    path: /repair-program/training-certifications/{certification_id}
    roles: [ProgramAdmin, ComplianceOfficer, RepairProviderTech]
    input: []
    output: TrainingCertification
    success_status: 200
    side_effects: "none — read only; canonical single-row read for a certification"

  - method: GET
    path: /repair-program/training-certifications
    roles: [ProgramAdmin, ComplianceOfficer, RepairProviderTech]
    input: ["provider_id?", "technician_user_id?", "course_code?", "status?", "limit?", "offset?"]
    output: TrainingCertification[]
    success_status: 200
    side_effects: "none — paginated read; reverse lookup for TrainingCertification.provider_id"

  - method: POST
    path: /repair-program/training-certifications
    roles: [ProgramAdmin, RepairProviderTech]
    input: [provider_id, technician_user_id, course_code, valid_from, valid_until, exam_score]
    output: TrainingCertification
    success_status: 201
    side_effects: "status = ACTIVE; credits_consumed = 2; the provider's training_credit_balance drops by 2 and active_cert_count rises by 1; required_cert_count is left untouched"

  - method: POST
    path: /repair-program/training-certifications/{certification_id}/void
    roles: [ProgramAdmin]
    input: [void_reason]
    output: TrainingCertification
    success_status: 200
    side_effects: "ACTIVE -> VOIDED (terminal); compensation — credits_consumed returns to 0 and the provider's training_credit_balance rises by 2, active_cert_count drops by 1; when the void pushes active_cert_count below required_cert_count for an AUTHORIZED provider, the provider is additionally suspended (AUTHORIZED -> SUSPENDED with suspension_reason CERT_COVERAGE_LOST), which in turn revokes that provider's VALID assessments"

  # --- DefectiveReturnCase ----------------------------------------------------
  - method: POST
    path: /repair-program/defective-returns
    roles: [SelfRepairCustomer, RepairProviderTech]
    input: [order_line_id, reported_failure_code, quantity]
    output: DefectiveReturnCase
    success_status: 201
    side_effects: "status = REQUESTED; part_id copied from the line; root_cause_code, defect_confirmed, analyzed_by_user_id, decided_by_user_id, received_at and both credit fields start null/0"

  - method: GET
    path: /repair-program/defective-returns/{case_id}
    roles: [ProgramAdmin, FailureAnalysisEngineer, SelfRepairCustomer, RepairProviderTech, ComplianceOfficer]
    input: []
    output: DefectiveReturnCase
    success_status: 200
    side_effects: "none — read only"

  - method: GET
    path: /repair-program/defective-returns
    roles: [ProgramAdmin, FailureAnalysisEngineer, SelfRepairCustomer, RepairProviderTech, ComplianceOfficer]
    input: ["order_line_id?", "part_id?", "status?", "root_cause_code?", "reported_failure_code?", "limit?", "offset?"]
    output: DefectiveReturnCase[]
    success_status: 200
    side_effects: "none — reverse lookup for DefectiveReturnCase.order_line_id and .part_id"

  - method: POST
    path: /repair-program/defective-returns/{case_id}/receive
    roles: [ProgramAdmin]
    input: ["received_at?"]
    output: DefectiveReturnCase
    success_status: 200
    side_effects: "REQUESTED -> RECEIVED with received_at defaulting to the logical clock; runs defective_return_credit GOODWILL_PROVISIONAL to set provisional_credit_cents"

  - method: POST
    path: /repair-program/defective-returns/{case_id}/analysis
    roles: [FailureAnalysisEngineer]
    input: [root_cause_code, defect_confirmed, analysis_note]
    output: DefectiveReturnCase
    success_status: 200
    side_effects: "RECEIVED -> ANALYSIS_COMPLETE; root_cause_code and defect_confirmed stored; analyzed_by_user_id = X-User-ID. A PROVIDER_INSTALL_ERROR root cause immediately starts counting against the provider's LIVE_RECOMPUTE compliance score"

  - method: POST
    path: /repair-program/defective-returns/{case_id}/credit-decision
    roles: [ProgramAdmin, FailureAnalysisEngineer]
    input: [decision]
    output: DefectiveReturnCase
    success_status: 200
    side_effects: "decision=ISSUE_CREDIT: ANALYSIS_COMPLETE -> CREDIT_ISSUED with final_credit_cents from defective_return_credit ANALYSIS_FINAL. decision=REJECT: ANALYSIS_COMPLETE -> REJECTED with final_credit_cents = 0 and provisional_credit_cents preserved as the audit trail. decided_by_user_id = X-User-ID and must differ from analyzed_by_user_id"

  # --- logical clock ----------------------------------------------------------
  - method: POST
    path: /repair-program/_clock/set_current_utc
    roles: [ProgramAdmin, ComplianceOfficer]
    input: [to_iso8601]
    output:
      current_utc: string
    success_status: 200
    side_effects: "moves the logical clock that every temporal rule reads. Default clock at process start: 2026-08-01T00:00:00Z. Movement must be strictly forward. Advancing the clock never re-evaluates anything by itself — obligations are only re-derived by POST /repair-program/compliance-sweeps or by a cascade"

# =============================================================================
# 1.6 Error Catalog  (66 codes; every one is reachable from at least one call)
# =============================================================================
errors:
  - error_id: ERR_UNAUTHORIZED
    http_status: 401
    triggered_by: "any request whose X-Role header is absent or unrecognised"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    triggered_by: "a known role calling an endpoint that does not list it, e.g. SelfRepairCustomer calling POST /repair-program/part-catalog-items/{part_id}/restrict"
  - error_id: ERR_MISSING_USER_ID
    http_status: 400
    triggered_by: "an identity-recording write (assessment, order, acknowledgment, review decision, analysis, credit decision, attestation, certification) sent without an X-User-ID header"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    triggered_by: "missing required body field, wrong JSON type, unknown field, or an out-of-set enum value such as repairability_tier: TIER_E"
  - error_id: ERR_INVALID_RANGE
    http_status: 422
    triggered_by: "quantity: 0 on a line append; exam_score: 145 on a certification; horizon_months: 0 on the forecast read"
  - error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    triggered_by: "effective_until <= effective_from on a compatibility; valid_until < valid_from on a certification; rental_window_end before rental_window_start"
  - error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    triggered_by: "re-posting an existing model_code, sku or region_code, or a second obligation for the same (model_id, region_code)"
  - error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown model_id in a path or body"
  - error_id: ERR_PART_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown part_id, supersedes_part_id or required_tool_part_id"
  - error_id: ERR_COMPATIBILITY_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown compatibility_id on GET /repair-program/part-compatibilities/{compatibility_id}"
  - error_id: ERR_MANUAL_REVISION_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown revision_id on any manual-revision action"
  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown assessment_id on GET or on POST /repair-program/parts-orders"
  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown order_id on any order action"
  - error_id: ERR_ORDER_LINE_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown line_id, a line_id belonging to a different order, or an unknown order_line_id on POST /repair-program/defective-returns"
  - error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown provider_id in a path or body"
  - error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown certification_id on the void endpoint"
  - error_id: ERR_RETURN_CASE_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown case_id on any defective-return action"
  - error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown obligation_id on the attest endpoint"
  - error_id: ERR_ACKNOWLEDGMENT_NOT_FOUND
    http_status: 404
    triggered_by: "an unknown acknowledgment_id on GET /repair-program/disclosure-acknowledgments/{acknowledgment_id}"
  - error_id: ERR_REGION_PROFILE_NOT_FOUND
    http_status: 404
    triggered_by: "a region_code with no RegionalComplianceProfile row"
  - error_id: ERR_SUPERSESSION_CYCLE
    http_status: 422
    triggered_by: "POST /repair-program/part-catalog-items/{part_id}/supersession that points a part at a successor which already supersedes it, closing a cycle"
  - error_id: ERR_STALE_MODEL_VERSION
    http_status: 412
    triggered_by: "POST /repair-program/manual-revisions with an expected_model_version that no longer matches ProductModel.version"
  - error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    triggered_by: "POST /repair-program/parts-orders/{order_id}/lines with an expected_order_version that no longer matches PartsOrder.version"
  - error_id: ERR_ORDER_NOT_OWNED
    http_status: 403
    triggered_by: "a SelfRepairCustomer acting on another customer's order or assessment"
  - error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    triggered_by: "a RepairProviderTech whose X-User-ID resolves to a different provider (or to none) touching a provider-scoped resource"
  - error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    triggered_by: "the author of a manual revision submitting its review decision"
  - error_id: ERR_SELF_DECISION_FORBIDDEN
    http_status: 403
    triggered_by: "the failure analyst who filed the analysis also issuing the credit decision"
  - error_id: ERR_ORDER_CONTAINS_RESTRICTED_PART
    http_status: 422
    triggered_by: "confirming an order that holds a line on a RESTRICTED part"
  - error_id: ERR_AUTHENTICATION_NOT_APPLICABLE
    http_status: 422
    triggered_by: "authenticating a line whose part.requires_authentication is false"
  - error_id: ERR_AUTHENTICATION_REQUIRED_FIRST
    http_status: 409
    triggered_by: "calibrating a line that still needs authentication"
  - error_id: ERR_CALIBRATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    triggered_by: "a fourth calibrate call, or any calibrate call on a CALIBRATION_ESCALATED line"
  - error_id: ERR_CALIBRATION_INCOMPLETE
    http_status: 422
    triggered_by: "issuing a defective-return credit for a line whose authentication or calibration dimension was never resolved"
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    triggered_by: "any trigger not defined for the current state, including a repeated publish or a second confirm"
  - error_id: ERR_PROVIDER_NOT_ACCEPTING_CERTS
    http_status: 409
    triggered_by: "filing a certification against an APPLIED, SUSPENDED or REVOKED provider"
  - error_id: ERR_ASSESSMENT_NOT_VALID
    http_status: 409
    triggered_by: "creating an order from an EXPIRED, REVOKED_BY_SAFETY or already CONSUMED assessment"
  - error_id: ERR_ASSESSMENT_BLOCKED
    http_status: 422
    triggered_by: "creating an order from an assessment whose decision is a BLOCKED_* value"
  - error_id: ERR_PART_NOT_PUBLISHED
    http_status: 422
    triggered_by: "appending a line on a DRAFT, RESTRICTED or SUPERSEDED part, or on a part with no in-window compatibility row for the model"
  - error_id: ERR_ORDER_HAS_NO_LINES
    http_status: 422
    triggered_by: "requesting disclosure on an empty order"
  - error_id: ERR_REVISION_CYCLE_CAP_REACHED
    http_status: 409
    triggered_by: "a fourth submit after three rejections"
  - error_id: ERR_SAFETY_WARNINGS_REQUIRED
    http_status: 422
    triggered_by: "publishing a guide or safety sheet with safety_warning_count 0 or an empty covered_part_skus list"
  - error_id: ERR_MODEL_ORDER_RESTRICTED
    http_status: 422
    triggered_by: "appending a line or requesting disclosure while the model's compliance_posture is ORDER_RESTRICTED"
  - error_id: ERR_PARTS_ACCESS_TIER_INSUFFICIENT
    http_status: 403
    triggered_by: "a TIER_3_STANDARD provider ordering a SAFETY_RESTRICTED_HIGH_VOLTAGE part"
  - error_id: ERR_DISCLOSURE_MISMATCH
    http_status: 422
    triggered_by: "acknowledging a different warranty_impact_class than the order computed, or a TOOL_RENTAL_ONLY scope on an order holding a component line"
  - error_id: ERR_LIABILITY_WARNING_STALE
    http_status: 409
    triggered_by: "acknowledging with a liability_warning_version other than the one pinned on the assessment"
  - error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    triggered_by: "confirming before any covering acknowledgment exists"
  - error_id: ERR_ATTESTATION_UNSUPPORTED
    http_status: 422
    triggered_by: "attesting documentation_verified: true while the model's documentation_posture is STALE or MISSING, or attesting with documentation_verified: false"
  - error_id: ERR_ASSESSMENT_EXPIRED
    http_status: 422
    triggered_by: "confirming after the pinned assessment's 60-day validity has elapsed"
  - error_id: ERR_PARTS_WINDOW_ELAPSED
    http_status: 422
    triggered_by: "confirming one millisecond past the inclusive end-of-day parts_available_until"
  - error_id: ERR_RENTAL_WINDOW_REQUIRED
    http_status: 422
    triggered_by: "appending a RENTAL_KIT line to an order with no rental window, or with a window starting in the past"
  - error_id: ERR_CORE_RECEIPT_BEFORE_CONFIRM
    http_status: 422
    triggered_by: "a core receipt dated before confirmed_at or after the logical clock"
  - error_id: ERR_CERTIFICATION_ALREADY_EXPIRED
    http_status: 422
    triggered_by: "a certification whose valid_until is not after the clock, or whose exam_score is below 70"
  - error_id: ERR_CLOCK_MONOTONICITY
    http_status: 422
    triggered_by: "setting the clock to an instant at or before the current logical clock"
  - error_id: ERR_TRAINING_CREDIT_INSUFFICIENT
    http_status: 409
    triggered_by: "filing a certification with a training_credit_balance below 2"
  - error_id: ERR_RENTAL_CAPACITY_EXCEEDED
    http_status: 409
    triggered_by: "a rental line whose window (plus the 2-day turnaround buffer on existing occupations) pushes aggregate occupancy past concurrent_rental_capacity"
  - error_id: ERR_CORE_DEPOSIT_CAP_EXCEEDED
    http_status: 422
    triggered_by: "a consumer order whose recomputed core_deposit_cents exceeds 50000"
  - error_id: ERR_RETURN_QUANTITY_EXCEEDS_LINE
    http_status: 422
    triggered_by: "return quantities across non-REJECTED cases exceeding the line quantity"
  - error_id: ERR_COMPATIBILITY_WINDOW_OVERLAP
    http_status: 409
    triggered_by: "a second compatibility window for the same (part, model) that overlaps rather than abuts the first"
  - error_id: ERR_CERTIFICATION_WINDOW_OVERLAP
    http_status: 409
    triggered_by: "a second ACTIVE certification for the same technician and course whose closed window touches or overlaps the first"
  - error_id: ERR_CORE_LEDGER_INVARIANT
    http_status: 409
    triggered_by: "a second core receipt against an already settled order, or any operation that would drive core_liability_outstanding_cents negative"
  - error_id: ERR_CREDIT_RESTORE_FORBIDDEN
    http_status: 409
    triggered_by: "voiding a certification of a REVOKED provider whose balance was already forfeited"

  - error_id: ERR_SUPERSESSION_CLASS_MISMATCH
    http_status: 422
    triggered_by: "a successor part whose part_class differs from the predecessor named in supersedes_part_id"
  - error_id: ERR_TRAINING_COVERAGE_INSUFFICIENT
    http_status: 409
    triggered_by: "AUTHORIZE or REINSTATE while active_cert_count < required_cert_count"
  - error_id: ERR_PROVIDER_NOT_AUTHORIZED
    http_status: 403
    triggered_by: "confirming a provider order whose RepairProvider is not AUTHORIZED (for example after a SUSPEND decision)"
  - error_id: ERR_REVISION_COVERAGE_GAP
    http_status: 422
    triggered_by: "approving a DISASSEMBLY_GUIDE whose covered_part_skus omit a PUBLISHED, in-window part of the model"
  - error_id: ERR_NO_PUBLISHED_CALIBRATION_PROCEDURE
    http_status: 422
    triggered_by: "calibrating a line whose model has no PUBLISHED CALIBRATION_PROCEDURE revision"
  - error_id: ERR_CREDIT_NOT_ALLOWED_FOR_ROOT_CAUSE
    http_status: 422
    triggered_by: "ISSUE_CREDIT on a CUSTOMER_MISUSE root cause"

# =============================================================================
# 1.7 RBAC Table  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - role: ProgramAdmin
    identity: opaque
    exclusive_operations:
      - "POST /repair-program/product-models and both lifecycle actions (end-production, end-support)"
      - "POST /repair-program/part-catalog-items and POST /repair-program/part-catalog-items/{part_id}/publish"
      - "POST /repair-program/part-compatibilities"
      - "POST /repair-program/parts-orders/{order_id}/deliver"
      - "POST /repair-program/parts-orders/{order_id}/core-returns"
      - "POST /repair-program/repair-providers and POST /repair-program/repair-providers/{provider_id}/begin-training"
      - "POST /repair-program/training-certifications/{certification_id}/void"
      - "POST /repair-program/defective-returns/{case_id}/receive"
    shared_operations:
      - "POST /repair-program/compliance-profiles, POST /repair-program/compliance-obligations, POST /repair-program/compliance-sweeps (with ComplianceOfficer)"
      - "POST /repair-program/repair-providers/{provider_id}/authorization-decision (with ComplianceOfficer)"
      - "POST /repair-program/training-certifications (with RepairProviderTech)"
      - "POST /repair-program/eligibility-assessments (with SelfRepairCustomer and RepairProviderTech)"
      - "the authenticate and calibrate line actions (with RepairProviderTech and SelfRepairCustomer)"
      - "POST /repair-program/parts-orders/{order_id}/cancel (with the two buyer roles)"
      - "POST /repair-program/defective-returns/{case_id}/credit-decision (with FailureAnalysisEngineer)"
      - "POST /repair-program/_clock/set_current_utc (with ComplianceOfficer)"
      - "all read endpoints"

  - role: SafetyReviewer
    identity: opaque
    exclusive_operations:
      - "POST /repair-program/part-catalog-items/{part_id}/restrict — the only role that can raise a part's safety class and fire the four-hop safety cascade"
      - "POST /repair-program/manual-revisions/{revision_id}/review-decision"
      - "POST /repair-program/manual-revisions/{revision_id}/publish"
    shared_operations:
      - "POST /repair-program/manual-revisions and POST /repair-program/manual-revisions/{revision_id}/submit (with DocumentationEngineer)"
      - "read endpoints across models, parts, revisions, assessments, orders, lines and providers"
    notes: "Segregation of duties: a SafetyReviewer may author a revision, but the X-User-ID that authored it can never supply its review decision (ERR_SELF_REVIEW_FORBIDDEN)."

  - role: DocumentationEngineer
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /repair-program/manual-revisions and POST /repair-program/manual-revisions/{revision_id}/submit (with SafetyReviewer)"
      - "read endpoints across models, parts, compatibilities and revisions"
    notes: "Authors documentation but can neither approve nor publish it, and cannot restrict a part."

  - role: ComplianceOfficer
    identity: opaque
    exclusive_operations:
      - "POST /repair-program/compliance-obligations/{obligation_id}/attest"
    shared_operations:
      - "POST /repair-program/compliance-profiles, POST /repair-program/compliance-obligations, POST /repair-program/compliance-sweeps (with ProgramAdmin)"
      - "POST /repair-program/repair-providers/{provider_id}/authorization-decision (with ProgramAdmin)"
      - "POST /repair-program/_clock/set_current_utc (with ProgramAdmin)"
      - "read endpoints including both compliance-score variants and the demand forecast"

  - role: SelfRepairCustomer
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /repair-program/eligibility-assessments (with RepairProviderTech and ProgramAdmin)"
      - "POST /repair-program/parts-orders and the whole buyer flow: lines, request-disclosure, acknowledgments, confirm, cancel"
      - "the authenticate and calibrate line actions (with RepairProviderTech and ProgramAdmin)"
      - "POST /repair-program/defective-returns (with RepairProviderTech)"
      - "read endpoints for catalog, models, revisions, assessments, orders, lines and acknowledgments"
    notes: "Ownership-scoped: X-User-ID must equal PartsOrder.customer_user_id / EligibilityAssessment.requester_user_id, otherwise ERR_ORDER_NOT_OWNED. The identity is opaque — no entity stores a SelfRepairCustomer row; the user id is only compared, never resolved."

  - role: RepairProviderTech
    identity: entity_backed:RepairProvider
    exclusive_operations: []
    shared_operations:
      - "POST /repair-program/eligibility-assessments (with SelfRepairCustomer and ProgramAdmin)"
      - "POST /repair-program/parts-orders and the whole buyer flow: lines, request-disclosure, acknowledgments, confirm, cancel"
      - "the authenticate and calibrate line actions (with SelfRepairCustomer and ProgramAdmin)"
      - "POST /repair-program/training-certifications (with ProgramAdmin)"
      - "POST /repair-program/defective-returns (with SelfRepairCustomer)"
      - "read endpoints including GET /repair-program/repair-providers/{provider_id}/compliance-score"
    notes: "X-User-ID is resolved to a RepairProvider through TrainingCertification.technician_user_id; a mismatch or an unresolvable user id yields ERR_PROVIDER_SCOPE_VIOLATION."

  - role: FailureAnalysisEngineer
    identity: opaque
    exclusive_operations:
      - "POST /repair-program/defective-returns/{case_id}/analysis — the only role that may assign a root_cause_code"
    shared_operations:
      - "POST /repair-program/defective-returns/{case_id}/credit-decision (with ProgramAdmin)"
      - "read endpoints for returns, order lines, parts and providers"
    notes: "Segregation of duties: the X-User-ID that filed the analysis cannot also issue the credit decision (ERR_SELF_DECISION_FORBIDDEN), so a single engineer can never both diagnose and pay."
