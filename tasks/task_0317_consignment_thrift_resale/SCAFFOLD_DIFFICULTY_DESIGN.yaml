  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_invalidstate_beats_authrequired
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair state(priority 5) vs business_safety(priority 8):
          after a COUNTERFEIT verdict an auth-required item is BOTH grading_status
          REJECTED (so list's state precondition grading_status==ACCEPTED fails,
          priority 5) AND authentication_status COUNTERFEIT (so the auth gate fails,
          priority 8); a list attempt must surface the higher-priority
          ERR_INVALID_STATE (priority 5), not ERR_AUTHENTICATION_REQUIRED.
        test_recipe:
          setup:
            - "One auth-required item graded ACCEPTED by U-GRADER, review opened by U-AUTH, then ruled COUNTERFEIT — leaving grading_status REJECTED and authentication_status COUNTERFEIT while listing_status is still NOT_LISTED. A list attempt now violates both priority-5 (state) and priority-8 (auth) rules at once."
