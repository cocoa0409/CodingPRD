              payload: { name: "S01" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S02" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S03" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S04" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S05" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S06" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S07" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S08" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S09" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S10" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S11" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "S12" }
              as: CommandCenterAdmin
          trigger:
            - call: "GET /ops/storm-events"
              payload: {}
              as: CommandCenterAdmin
            - call: "GET /ops/storm-events"
              payload: { limit: 10, offset: 10 }
              as: CommandCenterAdmin
              captures: { page2: $.data }
          assert:
            - "first page returns 10 items with total_count == 12 and has_more == true"
            - "second page returns 2 items with has_more == false"
            - "pagination fields limit, offset, total_count, has_more are all present on list responses"

      - name: storm_units_filtered_by_menu_tier
        claim_type: Computed read
        grounds:
          - endpoints.GET_/ops/storm-events/{stormEventId}/units
        distinguishing_aspect: "The units collection filters by the DERIVED menu_tier: with U1 at TIER1_NO_POWER and U2 at FULL, ?menu_tier=TIER1_NO_POWER returns only U1 — filtering works on a computed field, not a stored input."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with U1 power DOWN and U2 untouched."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
