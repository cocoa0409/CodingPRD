              as_user_id: "user-treasury-01"
              captures: { fc_el_e12: "$.data.id" }
            - call: "POST /portfolio-forecasts"
              payload: { as_of_date: "2026-08-01", method: "STRESSED", stress_multiplier_bps: 30000 }
              as: PortfolioController
              as_user_id: "user-treasury-01"
              captures: { fc_st_e12: "$.data.id" }
            - call: "GET /portfolio-forecasts"
              payload: {}
              as: RiskAnalyst
