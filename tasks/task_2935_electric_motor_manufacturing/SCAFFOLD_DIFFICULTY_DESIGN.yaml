            - "hop 0: CustomerOrder.${o1_id}.status == CANCELLED"
            - "hop 1: WorkOrder.${wo1_id}.build_status == CANCELLED and WorkOrder.${wo1_id}.certification_status == PENDING"
            - "hop 2: StatorBuild.${sb1_id}.status == SCRAPPED and RotorBuild.${rb1_id}.status == SCRAPPED"
            - "hop 3: CuringOven.${oven_a_id}.booked_minutes == 0"
            - "Distributor.${dist_id}.units_outstanding == 0 and Distributor.${dist_id}.stock_allowance_remaining_units == 500"
            - "StatorBuild.${sb1_id}.oven_id and impregnation_minutes == 240 are retained on the scrapped row (the minutes are released from the oven ledger, not erased from the build)"

      - name: nameplate_revoke_cascades_to_certification_claim_and_distributor_counter
        grounds:
          - state_machines.Nameplate.ISSUED_to_REVOKED
          - state_machines.WorkOrder.certification_status_CERTIFIED_to_certification_status_SUSPENDED
          - entities.WarrantyClaim.fields.defect_presumption_applied
          - entities.Distributor.fields.open_presumed_defect_count
          - calculations.warranty_credit_ledger
          - validations[priority=54]
          - errors[ERR_TEARDOWN_EVIDENCE_REQUIRED]
        distinguishing_aspect: |
          A different triggering transition (Nameplate ISSUED -> REVOKED) drives a three-hop chain
          that crosses the WorkOrder's OTHER state dimension: certification_status CERTIFIED ->
          SUSPENDED while build_status stays SHIPPED, then every open WarrantyClaim of that work
          order gets defect_presumption_applied = true, then the owning Distributor's
          open_presumed_defect_count is recomputed to 1 — and the presumption changes admissible
          evidence, so a FIELD_DATA analysis of that claim is now rejected.
        test_recipe:
          setup:
            - "Full happy path: design D1 RELEASED, order confirmed, WO1 built, tested (measured 93.42 %), nameplated against EU-2019-1781-IE3-4P and SHIPPED at 2026-08-05T09:30:00.000Z."
