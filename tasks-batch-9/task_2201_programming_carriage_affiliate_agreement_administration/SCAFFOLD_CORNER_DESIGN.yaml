                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_id: "id"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Harbor Nights"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                tt_id: "id"
            - call: "POST /carriage/content-titles/${tt_id}/rights-status"
              payload:
                rights_status: "OWNED_CLEARED"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${ag_id}"
                content_title_id: "${tt_id}"
                platform: "VOD"
                territory_code: "US"
                window_start: "2026-09-01T00:00:00Z"
                window_end: "2026-09-30T00:00:00Z"
                exclusivity: "NON_EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                w_id: "id"
            - call: "POST /carriage/rights-windows/${w_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/distributors/${dm_id}/credit-review"
              payload:
                action: "PLACE_HOLD"
                reason: "Manual credit review pending"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          trigger:
            - call: "POST /carriage/distributors/${dm_id}/credit-review"
