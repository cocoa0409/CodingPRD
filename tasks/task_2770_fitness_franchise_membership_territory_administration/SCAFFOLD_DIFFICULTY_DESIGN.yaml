  - rule_id: boundary_precision_check
    instances:
      - name: territory_protection_slack_of_exactly_zero_km_is_accepted
        grounds:
          - calculations.territory_encroachment_slack
          - endpoints[POST /franchise/territories]
          - validations[priority=12]
          - errors[ERR_TERRITORY_ENCROACHMENT]
        boundary_metric: "territory_encroachment_slack.encroachment_km, rounded to 3 decimals, against the strict encroaches = (encroachment_km < 0) gate"
        distinguishing_aspect: |
          The exact-tangency case of the radial protection metric on POST /franchise/territories. A
          candidate at (34.0, -117.9) with radius 3.0 sits 0.1 degrees of longitude from an incumbent
          5.0 km circle: 0.1 * KM_PER_DEG_LNG = 8.5 km distance against a required
          3.0 + 5.0 + 0.5 = 8.5 km, so encroachment_km rounds to exactly 0.000 and MUST be accepted.
          Shifting the candidate by a further 0.01 degrees (7.65 km, slack -0.850) is the first rejection.
          Implementations that write the gate as encroachment_km <= 0, or that skip the 3-decimal
          ROUND_HALF_UP and compare a 8.499999... float against 8.5, reject the tangent territory.
        test_recipe:
          setup:
            - "Franchisee f1 holds an incumbent RESERVED territory centred at (34.0, -118.0) with protected_radius_km 5.0."
            - "Two other franchisees, f2 and f3, hold no territory yet."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Meridian Fitness LLC", contact_email: "ops@meridianfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Eastgate Fitness LLC", contact_email: "ops@eastgatefit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f2_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Westgate Fitness LLC", contact_email: "ops@westgatefit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f3_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f2_id}", center_lat: 34.0, center_lng: -117.9, protected_radius_km: 3.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t2_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f3_id}", center_lat: 34.0, center_lng: -118.09, protected_radius_km: 3.0, state_code: "CA" }
              as: BrandAdministrator
          assert:
            - "the f2 POST /franchise/territories response status == 201"
            - "the f2 POST /franchise/territories response data.encroachment_km == 0.0"
            - "the f2 POST /franchise/territories response data.status == RESERVED"
            - "the f2 POST /franchise/territories response data.protected_radius_km == 3.0"
            - "the f3 POST /franchise/territories response status == 409"
            - "the f3 POST /franchise/territories response data.error_id == ERR_TERRITORY_ENCROACHMENT"
            - "Territory.${t1_id}.encroachment_km == null"
            - "GET /franchise/territories?franchisee_id=${f2_id} returns total_count == 1"
            - "GET /franchise/territories?franchisee_id=${f3_id} returns total_count == 0"

      - name: usage_settlement_rebate_tier_at_the_exact_fifty_thousand_cent_floor
        grounds:
          - calculations.usage_settlement_net
          - calculations.usage_settlement_net.constants.REBATE_TIER_1_FLOOR
          - endpoints[POST /franchise/usage-settlements]
          - entities.UsageSettlement.fields.rebate_pct
        boundary_metric: "usage_settlement_net.net_before_rebate_cents against REBATE_TIER_1_FLOOR, and the ROUND_HALF_UP of the 8 percent admin hold that produces it"
        distinguishing_aspect: |
          A different metric on a different endpoint from the territory-slack boundary: an integer-cent
          tier floor rather than a rounded distance, and unlike the territory boundary the equality case
          here falls on the PERMISSIVE side. At a 647-cent guest fee, 84 visits give gross 54348, hold
          round_half_up(4347.84) = 4348 and net_before_rebate_cents exactly 50000, which is NOT below
          REBATE_TIER_1_FLOOR and therefore earns rebate_pct 0.03. One visit fewer gives gross 53701,
          hold round_half_up(4296.08) = 4296 and net_before 49405, under the floor, so rebate_pct is 0.00
          and the entire 49405 is payable. Writing the tier test as net_before <= REBATE_TIER_1_FLOOR, or
          truncating the hold instead of ROUND_HALF_UP, flips the 84-visit settlement to the zero tier.
        test_recipe:
