  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: shoot_block_halfopen_interval_with_trailing_turnaround_buffer
        grounds:
          - validations[priority=42]
          - errors[ERR_LOCATION_BLOCK_CONFLICT]
          - entities.Location.fields.turnaround_buffer_minutes
          - entities.ShootBlock.fields.start_utc
          - entities.ShootBlock.fields.end_utc
        distinguishing_aspect: |
          Resource entity Location occupied by ShootBlock rows under HALF-OPEN interval
          arithmetic with an asymmetric TRAILING buffer: a block ending 11:30Z at a venue
          with turnaround_buffer_minutes 60 occupies [08:00Z, 12:30Z), so a request
          starting 12:00Z is rejected while a request starting exactly 12:30Z is accepted
          — the right endpoint is exclusive.
        test_recipe:
          setup:
            - "COMPETITION_HIGH_STRESS / CA production with photography 2026-09-15..2026-12-15."
            - "Location Stage A with turnaround_buffer_minutes 60."
            - "One SCHEDULED block at Stage A occupying 2026-10-05T08:00Z..11:30Z, i.e. buffered to 12:30Z."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S11", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 11, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 0 }
              as: ProductionAdmin
