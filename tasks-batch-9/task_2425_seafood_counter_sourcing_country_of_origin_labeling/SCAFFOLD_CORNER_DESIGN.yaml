          - validations[priority=42]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_label_publish_safety_beats_referential_certification
          rationale: "The named §1.8 instance violates the open-excursion block and the certification claim rule in the same POST /seafood-ops/case-labels call and asserts ERR_OPEN_EXCURSION_BLOCKS wins."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: ad_lifecycle_action_endpoints_publish_close_and_retract
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /seafood-ops/ad-items/{item_id}/publish]
          - endpoints[POST /seafood-ops/ad-items/{item_id}/close]
          - endpoints[POST /seafood-ops/ad-items/{item_id}/retract]
          - calculations.cool_label_content_derivation
          - state_machines.AdvertisedItem.status
        distinguishing_aspect: |
          The three body-less action endpoints each carry their own precondition set: publish
          needs APPROVED plus an OPEN posture plus a PUBLISHED CaseLabel on the lot, close needs
          the logical clock at or past ad_end_at, and retract needs no clock at all but stamps
          retract_reason MANUAL. The published ad must also carry the four-part pipe-joined
          country-of-origin statement.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z, later advanced to 2026-08-01T11:00:00Z"
            - "Atlantic Cod SupplierLot (WILD_LONGLINE, US, not previously frozen, fresh_claim true) cased into slot 1 with a PUBLISHED CaseLabel"
            - "advertisement 1 for 09:00-10:00 cleared on both review dimensions, so it is APPROVED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
