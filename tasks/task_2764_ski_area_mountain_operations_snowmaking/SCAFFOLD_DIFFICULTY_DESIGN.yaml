            - "DayPlan.${day_id}.raw_ccc == 1080 and guest_capacity == 918   # 1080 / 18.0 = 60.0 > 25.0 so density_factor 0.85"
            - "SeasonConfig.${season_id}.open_area_count == 1"

      - name: session_start_requires_pump_house_online
        grounds:
          - validations[priority=35]
          - errors[ERR_PUMP_HOUSE_OFFLINE]
          - state_machines.SnowmakingSession.SCHEDULED_to_RUNNING
          - entities.PumpHouse.fields.status
          - entities.PumpHouse.fields.active_session_count
          - entities.SnowmakingSession.fields.snow_yield_factor
        distinguishing_aspect: |
          A different entity pair from the terrain-versus-lift dependency: SnowmakingSession -> PumpHouse.
          The session row is perfectly startable - SCHEDULED, season OPERATING, area OPEN, wet bulb 22.0 -
          and the request body is an empty-but-for-target_state transition, yet the start is refused purely
          because the referenced pump house was switched to MAINTENANCE after the session was created. The
          dependency is also directional and non-symmetric: the same MAINTENANCE flip is declared to leave an
          already-RUNNING session untouched, so it gates the transition rather than the row. Returning the
          pump house to ONLINE and replaying the identical call succeeds.
