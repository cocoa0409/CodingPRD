  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_conserves_deposit_money_refund_plus_forfeit
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.DepositLedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = money (cents). Forward action confirm appends DEPOSIT_HOLD +deposit_due_cents; compensating cancel appends REFUND -refunded and FORFEIT +forfeited such that refunded_cents + forfeited_cents == deposit_due_cents exactly (146750), leaving no cent of drift — pinned as refund+forfeit == hold."
        test_recipe:
          setup:
            - "Confirmed order deposit 146750; cancel at half-refund window (>=72h, <168h) -> refund 73375, forfeit 73375."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T17:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version, dep: $.data.deposit_due_cents }
          trigger:
            - call: "POST /catering/orders/${ord_id}/cancel"
              payload: { expected_order_version: "${ord_v2}" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { settle: $.data.settlement_status }
          assert:
            - "Order.${ord_id}.deposit_due_cents == 146750"
            - "DepositLedgerEntry list for ${ord_id}: sum of REFUND and FORFEIT amounts == 73375 + 73375 == 146750 (equals the DEPOSIT_HOLD)"
            - "Order.${ord_id}.settlement_status == REFUNDED"

      - name: fulfill_conserves_staff_pool_reserve_plus_release
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.GUARANTEED_to_FULFILLED
          - entities.StaffingReservation.fields.reserved_staff
          - entities.StaffingReservation.fields.status
        distinguishing_aspect: "Conserved quantity = staff-pool capacity (count, different conserved type from money). Forward action confirm debits the pool by reserved_staff=3 (HELD); compensating fulfill releases exactly 3 back (RELEASED) so the global pool returns to its starting capacity 10 with zero drift — pinned as pool_after == pool_before."
        test_recipe:
          setup:
            - "Staff pool 10; order with STAFFING add-on qty 3 confirmed (pool -> 7), guaranteed, paid/invoiced/settled, legs delivered, then fulfilled (pool -> 10)."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/_staff-pool/set_capacity"
              payload: { total_staff: 10 }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/routes"
              payload: { route_date: "2026-09-01T00:00:00Z", vehicle_capacity_legs: 3 }
              as: CateringAdmin
              captures: { route_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/add-ons"
              payload: { kind: "STAFFING", unit_cents: 8000, quantity: 3 }
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
            - call: "POST /catering/orders/${ord_id}/guarantee"
              payload: { expected_order_version: "${ord_v2}", guaranteed_headcount: 80 }
              as: SalesCoordinator
              captures: { ord_v3: $.data.version }
            - call: "POST /catering/orders/${ord_id}/invoice"
              payload: { expected_order_version: "${ord_v3}" }
              as: SalesCoordinator
              captures: { ord_v4: $.data.version, final: $.data.final_total_cents }
            - call: "POST /catering/orders/${ord_id}/payments"
              payload: { expected_order_version: "${ord_v4}", amount_cents: 622220 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_v5: $.data.version }
            - call: "POST /catering/orders/${ord_id}/settle"
              payload: { expected_order_version: "${ord_v5}" }
              as: SalesCoordinator
              captures: { ord_v6: $.data.version }
            - call: "POST /catering/delivery-legs"
              payload: { order_id: "${ord_id}", route_id: "${route_id}", window_start: "2026-09-01T15:00:00Z", window_end: "2026-09-01T16:00:00Z" }
              as: SalesCoordinator
              captures: { leg_id: $.data.id }
            - call: "GET /catering/routes/${route_id}"
              payload: {}
              as: EventCaptain
              captures: { route_v: $.data.version }
            - call: "POST /catering/delivery-legs/${leg_id}/dispatch"
              payload: { expected_route_version: "${route_v}" }
              as: EventCaptain
              captures: { route_v2: $.data.version }
            - call: "POST /catering/delivery-legs/${leg_id}/deliver"
              payload: { expected_route_version: "${route_v2}" }
              as: EventCaptain
          trigger:
            - call: "POST /catering/orders/${ord_id}/fulfill"
              payload: { expected_order_version: "${ord_v6}" }
              as: EventCaptain
              captures: { life: $.data.lifecycle_status }
          assert:
            - "Order.${ord_id}.lifecycle_status == FULFILLED"
            - "StaffingReservation for ${ord_id} has status RELEASED and reserved_staff == 3"
            - "global staff pool remaining == 10 (returned to starting capacity; reserve 3 then release 3, zero drift)"
