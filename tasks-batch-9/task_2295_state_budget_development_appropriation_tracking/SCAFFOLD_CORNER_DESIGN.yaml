              payload: { budget_cycle_id: "${cyc_1_id}" }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_1_id}", status: "SUBMITTED" }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { agency_id: "${ag_a_id}" }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { limit: 1, offset: 1 }
              as: BudgetAnalyst
          assert:
            - "the unfiltered list returns total_count == 3 with limit == 10 and offset == 0 applied by default"
            - "the budget_cycle_id filter returns total_count == 2 containing ${req_1_id} and ${req_2_id}"
            - "the composed cycle-and-status filter returns total_count == 1 containing only ${req_1_id}"
            - "the agency_id filter returns total_count == 2 containing ${req_1_id} and ${req_3_id}, crossing cycles"
            - "the limit 1 offset 1 page returns exactly 1 row with total_count == 3 and has_more == true"

      - name: balance_summary_exposes_both_bases_and_their_delta_mid_year
        claim_type: Computed read
        grounds:
          - endpoints[GET /fiscal/appropriations/{id}/balance-summary]
          - calculations.appropriation_available_balance
          - entities.Appropriation.fields.available_cash_cents
          - entities.Appropriation.fields.available_authority_cents
        distinguishing_aspect: |
          A read-only projection with no side effects: after releasing 440000000 of a
          2000000000 line and spending 100000000 of it, the endpoint reports available cash
          340000000 against available authority 1900000000 and a basis_delta_cents of
          1560000000, exactly the unreleased authority. Calling it twice bumps no version.
        setup_note: "Eleven-call chain to phase EXECUTION plus one released quarter-1 allotment and one posted expenditure."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents; logical clock at the default 2026-08-01 (quarter 1)"
            - "GENERAL Appropriation P100 enacted 2000000000 with quarter-1 allotment 440000000 RELEASED and one POSTED expenditure of 100000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
