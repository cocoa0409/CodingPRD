              payload: { award_id: "${aw_id}", provider_id: "${pr1_id}", session_date: "2027-09-13", start_time: "10:00", end_time: "10:45", minutes_planned: 45, expected_award_version: "${aw_v1}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /esy/makeup-sessions/${m1_id}/log-outcome"
              payload: { outcome: "DELIVERED", minutes_delivered: 45 }
              as: RelatedServiceProvider
              as_user_id: "${pr1_id}"
            - call: "POST /esy/makeup-sessions/${m1_id}/log-outcome"
              payload: { outcome: "VOIDED", outcome_note: "Service log corrected: the session did not take place" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "INVARIANT BEFORE: CompensatoryAward.${aw_id}.agreed_minutes == 85, delivered_minutes == 0, forfeited_minutes == 0, scheduled_minutes == 45, remaining_owed_minutes == 85, and Student.${s1_id}.outstanding_owed_minutes == 85 == max(0, 85 - 0 - 0)"
            - "FORWARD (trigger call 1): 200 with MakeupSession.${m1_id}.status == DELIVERED, minutes_delivered == 45, charge_cents == 7290, charged_fund_source == IDEA_611_FEDERAL, charged_budget_code == 611-ESY-01"
            - "INVARIANT AFTER FORWARD: delivered_minutes == 45, scheduled_minutes == 0, remaining_owed_minutes == 40, Student.${s1_id}.outstanding_owed_minutes == 40 == max(0, 85 - 45 - 0), delivered_makeup_minutes_total == 45"
            - "AFTER FORWARD: CompensatoryAward.${aw_id}.delivery_status == IN_PROGRESS and negotiation_status == AGREED, and FundAllocation.${f1_id}.expended_amount_cents == 7290 and compensatory_expended_cents == 7290 and available_cents == 24770122"
            - "COMPENSATION (trigger call 2): 200 with MakeupSession.${m1_id}.status == VOIDED and minutes_delivered == 0 and charge_cents == 0 and charged_fund_source == null"
            - "INVARIANT RESTORED: delivered_minutes == 0, forfeited_minutes == 0, scheduled_minutes == 0, remaining_owed_minutes == 85, Student.${s1_id}.outstanding_owed_minutes == 85 == max(0, 85 - 0 - 0), delivered_makeup_minutes_total == 0"
            - "NO FISCAL DRIFT: FundAllocation.${f1_id}.expended_amount_cents == 0 and compensatory_expended_cents == 0 and encumbered_amount_cents == 222588 and available_cents == 24777412, exactly the pre-delivery values"
            - "NO STATE DRIFT: CompensatoryAward.${aw_id}.delivery_status is still IN_PROGRESS (no transition returns an award from IN_PROGRESS to SCHEDULING) and negotiation_status is still AGREED, while the voided 45 minutes are once again schedulable because scheduled_minutes is 0 and remaining_owed_minutes is 85"
            - "Every reading of Student.${s1_id}.outstanding_owed_minutes equals the recomputed sum over the single AGREED award, never an incremental delta: 85, then 40, then 85"

      - name: fund_encumbrance_conservation_survives_an_assignment_release
        grounds:
          - state_machines.ProviderAssignment.ACTIVE_to_RELEASED
          - calculations.fund_charge_waterfall
          - entities.FundAllocation.fields.available_cents
          - entities.Provider.fields.assigned_weekly_minutes
          - endpoints.POST_/esy/provider-assignments/{assignment_id}/release
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: allocation money, under the invariant
          available_cents == authorized_amount_cents - encumbered_amount_cents -
          expended_amount_cents. Creating an assignment encumbers 222588 cents and
          loads the provider with 229 weekly minutes; releasing it must subtract
          exactly the stored total_charge_cents (never a recomputed figure), return
          available_cents to 25000000, return the provider to 0 assigned minutes and
          revert the commitment from ASSIGNED to PLANNED. The expended ledger stays 0
          throughout, so encumbrance and expenditure are proven to be separate books.
