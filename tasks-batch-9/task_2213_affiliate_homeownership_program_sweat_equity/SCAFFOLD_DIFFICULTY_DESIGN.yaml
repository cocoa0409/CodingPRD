      - name: waiver_expiry_priority_28_beats_volunteer_double_booking_priority_29
        category_pair: "business_safety (priority 28) vs business_temporal (priority 29)"
        grounds:
          - validations[priority=28]
          - validations[priority=29]
          - errors.ERR_WAIVER_EXPIRED
          - errors.ERR_VOLUNTEER_DOUBLE_BOOKED
          - entities.VolunteerProfile.fields.waiver_expires_on
          - calculations.volunteer_shift_overlap_and_weekly_cap
          - concurrency_rules[assignment-create-stale-shift]
        distinguishing_aspect: |
          Scaffold-declared PRIORITY CONFLICT PAIR B, a different error-category
          pair from the state-vs-business_fiscal instance above: a single
          POST /shift-assignments violates the business_safety row (waiver
          expires 2026-08-10T12:00Z, candidate shift starts 2026-08-10T13:00Z,
          priority 28) and the business_temporal row (the volunteer already
          holds a RESERVED seat on a shift whose half-open [08:00, 16:00)
          interval intersects [13:00, 17:00), priority 29). 28 < 29 so the
          response is ERR_WAIVER_EXPIRED with HTTP 422 and
          ERR_VOLUNTEER_DOUBLE_BOOKED is never returned.
        test_recipe:
          setup:
            - "Logical clock at its fresh-service value 2026-08-01T00:00:00.000Z."
            - "Two BuildSite rows of one program, both driven to READY_TO_BUILD with safety_posture CLEAR (so the site-buffer rule never applies across them)."
            - "One ACTIVE adult VolunteerProfile whose waiver_expires_on is 2026-08-10T12:00:00.000Z."
            - "Shift A on site A runs 2026-08-10T08:00Z-16:00Z (duration_hours 8.00, volunteer_slots 2) and is OPEN; the volunteer holds one RESERVED GENERAL_VOLUNTEER seat on it, so assigned_hours_committed is 8.00."
