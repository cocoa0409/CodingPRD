scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: load_sizing_standard_optional_vs_measured_demand_whole_home
        grounds:
          - calculations.load_sizing
          - calculations.load_sizing.variants.STANDARD_OPTIONAL_METHOD
          - calculations.load_sizing.variants.MEASURED_DEMAND_METHOD
          - entities.LoadCalculation.fields.connected_load_kw
          - entities.LoadCalculation.fields.required_surge_kw
          - endpoints[POST /load-calculations]
        distinguishing_aspect: |
          The two method variants consume disjoint input sets on identical premises: NEC_220_82_STANDARD
          derives connected_load_kw from the nameplate VA split (3000 VA at 100 % + remainder at 40 %, plus the
          larger of heating vs cooling) and yields 21.48 kW, while NEC_220_87_MEASURED ignores every VA field and
          returns measured_peak_kw * 1.25 = 17.50 kW — a 3.98 kW divergence that propagates into required_surge_kw
          (37.59 vs 30.63).
        test_recipe:
          setup:
            - "One installer and one site exist."
            - "A WHOLE_HOME load calculation using the STANDARD optional method exists for that site with lighting_area_sqft 2400, appliance_load_va 18000, heating_va 9600, cooling_va 7200."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
          trigger:
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_87_MEASURED", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, measured_peak_kw: 14.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_measured_id: $.data.id }
          assert:
            - "LoadCalculation.${lc_id}.connected_load_kw == 21.48"
            - "LoadCalculation.${lc_id}.required_continuous_kw == 21.48"
            - "LoadCalculation.${lc_id}.required_surge_kw == 37.59"
            - "LoadCalculation.${lc_measured_id}.connected_load_kw == 17.50"
            - "LoadCalculation.${lc_measured_id}.required_continuous_kw == 17.50"
            - "LoadCalculation.${lc_measured_id}.required_surge_kw == 30.63"
            - "LoadCalculation.${lc_measured_id}.connected_load_kw != LoadCalculation.${lc_id}.connected_load_kw"
      - name: rebate_award_reserved_vs_final_after_verified_capacity_shortfall
        grounds:
          - calculations.rebate_award
          - calculations.rebate_award.variants.RESERVED
          - calculations.rebate_award.variants.FINAL
          - calculations.program_budget_reservation
          - state_machines.BatterySystem.build_status.INSTALLED_to_COMMISSIONED
          - entities.RebateClaim.fields.basis_kwh_reserved
          - entities.RebateClaim.fields.final_amount_cents
        distinguishing_aspect: |
          The RESERVED variant bills the design nameplate (basis 27.0 kWh -> 423000 cents) while the FINAL
          variant, run as CASCADE-B hop 2 of commissioning, bills min(usable_kwh, verified_capacity_kwh) =
          24.30 kWh -> 398700 cents from the very same claim row, and the 24300-cent delta is returned to the
          program's remaining_budget_cents rather than being silently kept.
        test_recipe:
          setup:
            - "A 2-unit PWX_A system (usable_kwh 27.0, continuous_kw 10.0) is INSTALLED with its interconnection application APPROVED_TO_INSTALL."
            - "All four commissioning tests are RECORDED and PASS; the CAPACITY_DISCHARGE test delivered exactly 24.30 kWh (90 % of 27.0)."
            - "IncentiveProgram 'State Storage Capacity Incentive' has total_budget_cents 5000000, tier1_limit_kwh 20, tier1 rate 20000, tier2 rate 10000."
            - "A RESERVED RebateClaim against that program exists with reserved_amount_cents 423000."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /battery-systems/${sys_id}/lock-design"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits"
              payload: { battery_system_id: "${sys_id}", jurisdiction_code: "AHJ_CITY", plan_set_ref: "PS-2790-A" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits/${permit_id}/review"
              payload: { decision: "ISSUE", expires_on: "2027-06-30" }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /interconnection-applications"
              payload: { battery_system_id: "${sys_id}", export_mode: "LIMITED_EXPORT", requested_export_kw: 8.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
            - call: "POST /interconnection-applications/${app_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /interconnection-applications/${app_id}/review"
              payload: { decision: "APPROVE_TO_INSTALL", approved_export_kw: 8.0 }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
            - call: "POST /battery-systems/${sys_id}/mark-installed"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /commissioning-tests"
              payload: { battery_system_id: "${sys_id}", test_type: "BACKUP_TRANSITION", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { t_bt: $.data.id }
            - call: "POST /commissioning-tests"
              payload: { battery_system_id: "${sys_id}", test_type: "CAPACITY_DISCHARGE", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { t_cd: $.data.id }
            - call: "POST /commissioning-tests"
              payload: { battery_system_id: "${sys_id}", test_type: "ANTI_ISLANDING", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T14:00:00Z" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { t_ai: $.data.id }
            - call: "POST /commissioning-tests"
              payload: { battery_system_id: "${sys_id}", test_type: "FIRMWARE_BASELINE", window_start: "2026-08-10T15:00:00Z", window_end: "2026-08-10T16:00:00Z" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { t_fb: $.data.id }
            - call: "POST /commissioning-tests/${t_bt}/record-result"
              payload: { transition_ms: 150 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /commissioning-tests/${t_cd}/record-result"
              payload: { delivered_kwh: 24.3 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /commissioning-tests/${t_ai}/record-result"
              payload: { anti_islanding_trip_ms: 1200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /commissioning-tests/${t_fb}/record-result"
              payload: { reported_firmware_version: "24.6.0" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /incentive-programs"
              payload: { name: "State Storage Capacity Incentive", program_type: "STATE_CAPACITY", total_budget_cents: 5000000, tier1_limit_kwh: 20, tier1_rate_cents_per_kwh: 20000, tier2_rate_cents_per_kwh: 10000, per_project_cap_cents: 1500000, stack_priority: 1, max_stack_pct_of_cost_bp: 5000, requires_export_commitment: false, min_capacity_commitment_kw: 5.0 }
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
              captures: { prog_state: $.data.id }
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v1: $.data.version }
            - call: "POST /rebate-claims"
              payload: { battery_system_id: "${sys_id}", program_id: "${prog_state}", capacity_commitment_kw: 8.0, export_commitment: "LIMITED_EXPORT", expected_battery_system_version: "${sys_v1}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /battery-systems/${sys_id}/commission"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
          assert:
            - "RebateClaim.${claim_id}.basis_kwh_reserved == 27.0"
            - "RebateClaim.${claim_id}.reserved_amount_cents == 423000"
            - "RebateClaim.${claim_id}.basis_kwh_final == 24.30"
            - "RebateClaim.${claim_id}.final_amount_cents == 398700"
            - "RebateClaim.${claim_id}.status == RESERVED"
            - "BatterySystem.${sys_id}.verified_capacity_kwh == 24.30"
            - "IncentiveProgram.${prog_state}.reserved_budget_cents == 398700"
            - "IncentiveProgram.${prog_state}.remaining_budget_cents == 4601300"
            - "IncentiveProgram.${prog_state}.total_budget_cents == IncentiveProgram.${prog_state}.remaining_budget_cents + IncentiveProgram.${prog_state}.reserved_budget_cents + IncentiveProgram.${prog_state}.paid_budget_cents"
  - rule_id: combinatorial_formula
    instances:
      - name: essential_loads_nested_min_max_clamp_under_measured_method
        grounds:
          - calculations.load_sizing
          - entities.LoadCalculation.fields.essential_circuits
          - entities.LoadCalculation.fields.required_surge_kw
        distinguishing_aspect: |
          Mode (a) nesting: required_continuous_kw is min(top2 + 0.50*rest, connected_load_kw) so the
          24.55 kW essential-circuit subtotal is clamped down to the 10.00 kW measured connected load, while
          required_surge_kw = max(motor circuit kW * 3.0) + 0.25 * the CLAMPED continuous value = 36.0 + 2.5 =
          38.50 — evaluating the surge term against the unclamped 24.55 would give 42.14.
        test_recipe:
          setup:
            - "One installer and one site exist and no load calculation has been created yet."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_87_MEASURED", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, measured_peak_kw: 8.0, essential_circuits: [{ label: "HEAT_PUMP", load_kw: 12.0, has_motor: true }, { label: "RANGE", load_kw: 9.6, has_motor: false }, { label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "PUMP", load_kw: 2.4, has_motor: true }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_clamp_id: $.data.id }
          assert:
            - "LoadCalculation.${lc_clamp_id}.connected_load_kw == 10.00"
            - "LoadCalculation.${lc_clamp_id}.required_continuous_kw == 10.00"
            - "LoadCalculation.${lc_clamp_id}.required_surge_kw == 38.50"
            - "LoadCalculation.${lc_clamp_id}.required_continuous_kw != 24.55"
            - "LoadCalculation.${lc_clamp_id}.required_surge_kw != 42.14"
      - name: rebate_rounds_once_after_export_multiplier_not_per_tier
        grounds:
          - calculations.rebate_award
          - calculations.rebate_award.constants.EXPORT_MULTIPLIER_BP
          - entities.RebateClaim.fields.reserved_amount_cents
        distinguishing_aspect: |
          Mode (b) operation-order pin: the two unrounded tier subtotals (3705 * 10.5 = 38902.5 and
          1235 * 13.3 = 16425.5) are summed and only their product with the FULL_EXPORT multiplier is rounded,
          giving exactly 55328 cents; rounding each tier subtotal first gives 38903 + 16426 = 55329, a one-cent
          divergence that only this ordering distinguishes.
        test_recipe:
          setup:
            - "A 2-unit PWX_C system (usable_kwh 23.8, continuous_kw 9.2, installed_cost_cents 2400000) is INSTALLED with a FULL_EXPORT interconnection approved at 9.0 kW."
            - "IncentiveProgram 'Round-Once Capacity Adder' has tier1_limit_kwh 10.5, tier1 rate 3705, tier2 rate 1235, per_project_cap_cents 1200000, max_stack_pct_of_cost_bp 5000 and requires an export commitment."
            - "No other rebate claim exists for the system."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_C", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 2400000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /battery-systems/${sys_id}/lock-design"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits"
              payload: { battery_system_id: "${sys_id}", jurisdiction_code: "AHJ_CITY", plan_set_ref: "PS-2790-A" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits/${permit_id}/review"
              payload: { decision: "ISSUE", expires_on: "2027-06-30" }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /interconnection-applications"
              payload: { battery_system_id: "${sys_id}", export_mode: "FULL_EXPORT", requested_export_kw: 9.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
            - call: "POST /interconnection-applications/${app_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /interconnection-applications/${app_id}/review"
              payload: { decision: "APPROVE_TO_INSTALL", approved_export_kw: 9.0 }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
            - call: "POST /battery-systems/${sys_id}/mark-installed"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /incentive-programs"
              payload: { name: "Round-Once Capacity Adder", program_type: "STATE_CAPACITY", total_budget_cents: 5000000, tier1_limit_kwh: 10.5, tier1_rate_cents_per_kwh: 3705, tier2_rate_cents_per_kwh: 1235, per_project_cap_cents: 1200000, stack_priority: 1, max_stack_pct_of_cost_bp: 5000, requires_export_commitment: true, min_capacity_commitment_kw: 5.0 }
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
              captures: { prog_round: $.data.id }
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v1: $.data.version }
          trigger:
            - call: "POST /rebate-claims"
              payload: { battery_system_id: "${sys_id}", program_id: "${prog_round}", capacity_commitment_kw: 9.0, export_commitment: "FULL_EXPORT", expected_battery_system_version: "${sys_v1}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { claim_round_id: $.data.id }
          assert:
            - "RebateClaim.${claim_round_id}.basis_kwh_reserved == 23.8"
            - "RebateClaim.${claim_round_id}.reserved_amount_cents == 55328"
            - "RebateClaim.${claim_round_id}.reserved_amount_cents != 55329"
            - "RebateClaim.${claim_round_id}.stack_ceiling_cents == 1200000"
            - "IncentiveProgram.${prog_round}.remaining_budget_cents == 4944672"
            - "IncentiveProgram.${prog_round}.reserved_budget_cents == 55328"
      - name: byod_bonus_tier_read_from_post_update_season_ratio
        grounds:
          - calculations.byod_settlement
          - calculations.byod_settlement.constants.BONUS_TIER_HIGH_RATIO
          - calculations.byod_settlement.constants.EMERGENCY_MULTIPLIER_BP
          - entities.ByodEnrollment.fields.season_compliance_ratio
          - entities.DispatchPerformance.fields.bonus_cents
        distinguishing_aspect: |
          Mode (c) evaluation-order pin: settling event 2 must first fold this event's 5.00 credited kW and
          5.0 pledged kW into the enrollment accumulators (season_compliance_ratio 0.9000 -> 0.9500) and only
          then select the bonus tier, so bonus_cents is 1000 bp of 7500 = 750; choosing the tier from the
          pre-update 0.9000 ratio would pay the 500 bp tier = 375.
        test_recipe:
          setup:
            - "A COMMISSIONED, PTO_GRANTED 2-unit PWX_A system is ENROLLED in SUMMER_2026 with pledged_kw 5.0."
            - "Event 1 (2 h ECONOMIC, rate 850 cents/kW) has already been settled with delivered_kwh 9.0, leaving cumulative_credited_kw 4.50, cumulative_pledged_kw 5.0 and season_compliance_ratio 0.9000."
            - "Event 2 (3 h EMERGENCY, rate 1200 cents/kW) has a REPORTED performance with delivered_kwh 15.0."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
