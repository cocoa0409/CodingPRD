            - "trigger response: data.error_id == ERR_LICENSE_NOT_ACTIVE (NOT ERR_BEAM_SUSPENDED)"
            - "SpectrumLicense.${lic_id}.license_state == SUSPENDED and Beam.${beam_id}.beam_state == SUSPENDED"
            - "Subscription.${sn1_id}.authorization_state == UNAUTHORIZED and service_state == PENDING_ACTIVATION"
            - "Subscription.${sn1_id}.deauthorized_by_license_id == null (it was never authorised, so the cascade left no marker)"

      - name: plan_change_past_the_beam_limit_returns_beam_oversubscribed
        claim_type: error_triggerable
        grounds:
          - validations[priority=36]
          - 'errors[ERR_BEAM_OVERSUBSCRIBED]'
          - calculations.beam_weighted_oversubscription
        distinguishing_aspect: "Upgrading 200 -> 500 Mbps on a 200 Mbps beam with limit 2.0 projects 2.5, above the limit, so the change is refused 422; the subscription keeps the old plan and the beam's ratio stays exactly 1.0 (the delta is not half-applied)."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 with forward_capacity_mbps 200 and oversubscription_limit 2.0, cell CELL-001 (max 1)."
            - "Plans PLAN-P1-200 (200 Mbps) and PLAN-P1-500 (500 Mbps) exist, both PRIORITY_1."
            - "Subscription sn1 is ACTIVE + AUTHORIZED_FIXED + PRIORITY on PLAN-P1-200; beam weighted 200 / ratio 1.0 / CONSTRAINED."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 200, oversubscription_limit: 2.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-500", committed_rate_mbps: 500, priority_tier: "PRIORITY_1", monthly_fee_cents: 19900, priority_data_gb: 300, deprioritized_rate_mbps: 50, overage_rate_cents_per_gb: 15, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan500_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { obstructed_sample_count: 1, total_sample_count: 200 }, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/install", payload: {}, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "GET /satellite-broadband/service-cells/${cell_id}", payload: {}, as: ProvisioningAgent, captures: { cell_v1: "$.data.version" } }
            - call: "POST /satellite-broadband/subscriptions"
              payload: { service_order_id: "${order1_id}", terminal_id: "${term1_id}", expected_service_cell_version: "${cell_v1}" }
              as: ProvisioningAgent
              captures: { sn1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/subscriptions/${sn1_id}/disclosure-acknowledgement", payload: { acknowledged_version: "CD-2026.1" }, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/subscriptions/${sn1_id}/authorize", payload: { authorization_mode: "FIXED" }, as: ProvisioningAgent }
            - { call: "GET /satellite-broadband/beams/${beam_id}", payload: {}, as: NetworkOpsEngineer, captures: { beam_vnow: "$.data.version" } }
          trigger:
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/plan-change"
              payload: { new_service_plan_id: "${plan500_id}", expected_beam_version: "${beam_vnow}" }
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_BEAM_OVERSUBSCRIBED"
            - "Subscription.${sn1_id}.service_plan_id == ${plan_id} and effective_rate_mbps == 200"
            - "Beam.${beam_id}.weighted_sold_mbps == 200 and oversubscription_ratio == 1.0"
            - "Beam.${beam_id}.capacity_state == CONSTRAINED"
            - "Beam.${beam_id}.version == ${beam_vnow} (the rejected write did not bump the OCC counter)"

      - name: err_order_state_invalid_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - 'errors[ERR_ORDER_STATE_INVALID]'
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_conflict_outranks_beam_oversubscription_on_activation
          rationale: "That §1.8 instance activates against a non-RESERVED order and asserts the 409 ERR_ORDER_STATE_INVALID response."

      - name: err_terminal_not_installed_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=15]
          - 'errors[ERR_TERMINAL_NOT_INSTALLED]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / activation_rejected_when_the_bound_terminal_is_only_delivered
          rationale: "That §1.8 instance activates with a DELIVERED terminal and asserts the 422 ERR_TERMINAL_NOT_INSTALLED response."

      - name: err_terminal_subscriber_mismatch_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - 'errors[ERR_TERMINAL_SUBSCRIBER_MISMATCH]'
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / terminal_ownership_mismatch_outranks_jurisdiction_restriction_on_activation
          rationale: "That §1.8 instance binds a foreign terminal at activation and asserts the 422 ERR_TERMINAL_SUBSCRIBER_MISMATCH response."

      - name: err_in_motion_not_permitted_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=24]
          - 'errors[ERR_IN_MOTION_NOT_PERMITTED]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / in_motion_roaming_approval_rejected_when_the_governing_license_forbids_in_motion
          rationale: "That §1.8 instance approves an IN_MOTION request against a licence with in_motion_permitted false and asserts the 422 ERR_IN_MOTION_NOT_PERMITTED response."

      - name: err_outage_window_overlap_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=27]
          - 'errors[ERR_OUTAGE_WINDOW_OVERLAP]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / outage_window_half_open_adjacency_accepted_while_interior_start_collides
          rationale: "That §1.8 instance asserts both the accepted adjacency and the rejected interior start (422 ERR_OUTAGE_WINDOW_OVERLAP) on the same beam."

      - name: err_roaming_window_conflict_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - 'errors[ERR_ROAMING_WINDOW_CONFLICT]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / roaming_window_closed_interval_plus_cooldown_buffer_blocks_then_admits
          rationale: "That §1.8 instance asserts the blocked window inside the cooldown buffer (422 ERR_ROAMING_WINDOW_CONFLICT) and the admitted window just outside it."

      - name: err_obstruction_verdict_fail_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=32]
          - 'errors[ERR_OBSTRUCTION_VERDICT_FAIL]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / install_rejected_when_newest_qualifying_obstruction_scan_verdict_is_fail
          rationale: "That §1.8 instance installs against a newest-qualifying FAIL scan and asserts the 422 ERR_OBSTRUCTION_VERDICT_FAIL response."

      - name: err_roaming_round_limit_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=33]
          - 'errors[ERR_ROAMING_ROUND_LIMIT]'
        excluded_because:
          difficulty_instance: non_linear_state_machine / roaming_authorization_needs_info_revision_cycle_bounded_at_three_rounds
          rationale: "That §1.8 instance drives the revision cycle to ROAMING_MAX_INFO_ROUNDS and asserts the fourth request-info returns 422 ERR_ROAMING_ROUND_LIMIT."

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_role_performs_its_own_exclusive_and_shared_operations
        claim_type: exclusive_operation_coverage
        grounds:
          - rbac.ComplianceOfficer.exclusive_operations
          - rbac.NetworkOpsEngineer.exclusive_operations
          - rbac.ProvisioningAgent.exclusive_operations
          - rbac.LogisticsCoordinator.exclusive_operations
          - rbac.Subscriber.exclusive_operations
        distinguishing_aspect: "One pass over the whole provisioning funnel where each hop is issued by the single role that owns it: every call succeeds, so no role is over-restricted and the five exclusive-operation sets are jointly sufficient to reach an installed terminal."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads the 2026-08-01T00:00:00Z epoch."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 1000, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 1, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { scan1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/install", payload: {}, as: Subscriber, as_user_id: "${sub1_id}" }
          assert:
            - "every trigger call returns its declared success status (201 for the five creates and the scan, 200 for coordination, deliver and install)"
            - "no trigger call returns ERR_UNAUTHORIZED or ERR_NOT_RESOURCE_OWNER"
            - "SpectrumLicense.${lic_id}.license_state == ACTIVE and coordination_state == COORDINATED"
            - "Beam.${beam_id}.beam_state == ACTIVE and ServiceCell.${cell_id}.availability_state == WAITLIST_ONLY"
            - "ServiceOrder.${order1_id}.order_state == RESERVED"
            - "Terminal.${term1_id}.terminal_state == INSTALLED and last_scan_verdict == PASS"

      - name: every_role_is_refused_the_other_roles_exclusive_operations
        claim_type: unauthorized_role
        grounds:
          - validations[priority=2]
          - 'errors[ERR_UNAUTHORIZED]'
          - rbac.NetworkOpsEngineer.exclusive_operations
          - rbac.LogisticsCoordinator.exclusive_operations
          - rbac.ProvisioningAgent.exclusive_operations
          - rbac.ComplianceOfficer.exclusive_operations
        distinguishing_aspect: "Eight cross-role attempts, one per exclusive operation family, all return 403 ERR_UNAUTHORIZED before any state check runs and none of them writes: the role gate is enforced per endpoint, not per resource."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (version read into ${beam_v1}), cell CELL-001 (max 1), plan PLAN-P1-200, subscriber sub1 with a RESERVED order."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 1000, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id", beam_v1: "$.data.version" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-02", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 500 }
              as: ProvisioningAgent
              captures: { err1: "$.data.error_id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-002", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 5 }
              as: ComplianceOfficer
              captures: { err2: "$.data.error_id" }
            - call: "POST /satellite-broadband/beams/${beam_id}/capacity-policy"
              payload: { oversubscription_limit: 6.0, deprioritization_grace_gb: 50, expected_beam_version: "${beam_v1}" }
              as: ProvisioningAgent
              captures: { err3: "$.data.error_id" }
            - call: "POST /satellite-broadband/outage-events"
              payload: { beam_id: "${beam_id}", cause: "EQUIPMENT_FAILURE", severity: "FULL_OUTAGE", started_at: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err4: "$.data.error_id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-9999", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: NetworkOpsEngineer
              captures: { err5: "$.data.error_id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub9@example.com", full_name: "Sub Nine", jurisdiction_code: "US-CA" }
              as: LogisticsCoordinator
              captures: { err6: "$.data.error_id" }
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/enforcement-action"
              payload: { action: "SUSPEND", reason: "attempted by the wrong role" }
              as: NetworkOpsEngineer
              captures: { err7: "$.data.error_id" }
            - call: "POST /satellite-broadband/service-orders/${order1_id}/cancel"
              payload: { cancel_reason: "attempted by the wrong role" }
              as: LogisticsCoordinator
              captures: { err8: "$.data.error_id" }
          assert:
            - "all eight trigger responses HTTP status == 403"
            - "all eight trigger responses: data.error_id == ERR_UNAUTHORIZED"
            - "GET /satellite-broadband/beams returns data.total_count == 1 (BEAM-02 was never created)"
            - "GET /satellite-broadband/service-cells returns data.total_count == 1 and GET /satellite-broadband/outage-events returns data.total_count == 0"
            - "GET /satellite-broadband/terminals returns data.total_count == 0"
            - "Beam.${beam_id}.version == ${beam_v1} and oversubscription_limit == 4.0 and deprioritization_grace_gb == 0"
            - "SpectrumLicense.${lic_id}.license_state == ACTIVE and ServiceOrder.${order1_id}.order_state == RESERVED"

      - name: a_subscriber_cannot_touch_another_subscribers_terminal
        claim_type: resource_ownership
        grounds:
          - validations[priority=3]
          - 'errors[ERR_NOT_RESOURCE_OWNER]'
          - rbac.Subscriber.ownership_rule
        distinguishing_aspect: "The Subscriber role is entity_backed, so authorisation is per-row: sub2 holds the shared obstruction-scan permission yet is refused 403 ERR_NOT_RESOURCE_OWNER on sub1's terminal (write and read alike) while sub1's identical call on the same terminal succeeds."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01, cell CELL-001 (max 2), plan PLAN-P1-200."
