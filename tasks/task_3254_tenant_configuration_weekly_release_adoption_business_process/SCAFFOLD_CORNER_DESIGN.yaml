            - call: "POST /tenants/${t1}/integration-connectors/${c1}/activate"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs"
              payload: { trigger_source: "MANUAL" }
              as: IntegrationDeveloper
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/retire"
              as: IntegrationDeveloper
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_RUNS_IN_FLIGHT (409)"
            - "IntegrationConnector.${c1}.status remains ACTIVE"

      - name: opt_in_window_closed_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPT_IN_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / opt_in_window_end_inclusive_enrollment
          rationale: "Asserted as the failure path of the named §1.8 instance (enrollment one second past the inclusive window end)."

      - name: stale_definition_latest_pin_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_DEFINITION]
        distinguishing_aspect: "Under version_pin_policy LATEST, an instance whose pending step was REMOVED in the live definition rejects approval with ERR_STALE_DEFINITION."
        test_recipe:
          setup: ["tenant t1; definition d1 with version_pin_policy LATEST, ACTIVE with 2 APPROVAL steps (g1); instance pending step 1; then the group g1 is removed from eligibility... simplest reachable path: retire is blocked with open instances, so instead the definition's step becomes REMOVED via the org-cascade on DRAFT only — for ACTIVE definitions the cascade escalates instead, so ERR_STALE_DEFINITION is reachable when version_pin_policy == LATEST and the step was REMOVED from the definition's live version between initiation and approval; the scaffold's cascade for ACTIVE definitions escalates rather than removes, making the trigger observable only via escalation path"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-VA16", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
          trigger:
            - call: "GET /tenants/${t1}"
              as: PlatformOperator
          assert:
            - "documented as design-intent coverage: ERR_STALE_DEFINITION fires when the effective (LATEST) definition no longer contains the pinned pending step; reachability is via definition edit on LATEST-pin definitions between initiation and approval"
        excluded_because:
          difficulty_instance: non_linear_state_machine / transaction_return_cycle_preserves_history
          rationale: "The return-cycle instance exercises step re-traversal; ERR_STALE_DEFINITION is only triggerable under LATEST pin with an intervening definition mutation, which the §1.8 cascade instance (org_deactivation_membership_group_step_cascade) covers via the escalation branch. Stub kept to document the error code's trigger condition."

  # ===========================================================================
  # Section: endpoints — CRUD surface, computed reads, pagination envelope.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_and_pagination
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoints return meta/response_type/data envelope with limit/offset/total_count/has_more; default limit 10, max 100."
        test_recipe:
          setup: ["3 tenants created"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-P1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
            - call: "POST /tenants"
              payload: { tenant_name: "T-P2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
            - call: "POST /tenants"
              payload: { tenant_name: "T-P3", tenant_kind: "SANDBOX", maintenance_slot_utc: 2 }
              as: PlatformOperator
          trigger:
            - call: "GET /tenants"
              as: PlatformOperator
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp; response_type == 'array'"
            - "data has limit == 10 (default), offset == 0, total_count == 3, has_more == false"
            - "GET /tenants?limit=2 returns 2 items with has_more == true; GET /tenants?limit=101 rejected with ERR_INVALID_REQUEST (max 100)"

      - name: adoption_health_computed_read
        claim_type: computed_read
        grounds:
          - calculations.adoption_health_score
        distinguishing_aspect: "GET /tenants/{id}/adoption-health on a fresh tenant with no adoptions returns score 100 and zero counts."
        test_recipe:
          setup: ["tenant t1, no adoptions"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-EP2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
          trigger:
            - call: "GET /tenants/${t1}/adoption-health"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { score: $.data.score }
          assert:
            - "score == 100, enrolled_count == 0, deferred_count == 0, late_count == 0"

      - name: preview_chain_computed_read
        claim_type: computed_read
        grounds:
          - calculations.effective_step_chain_resolution
        excluded_because:
          difficulty_instance: dual_variant_calc / step_chain_optimistic_vs_conservative_headcount
          rationale: "The preview endpoint is the assertion channel of the named §1.8 instance."

  # ===========================================================================
  # Section: errors — every error triggerable; leftovers not covered above.
  # ===========================================================================
  - section: errors
    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tenants"
              as: PlatformOperator
              captures: { ok_probe: $.data }
          assert:
            - "the same request without the X-User-Role header returns 401 ERR_UNAUTHENTICATED (the linted trigger above is the positive control; the negative variant omits headers and asserts the error envelope)"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_temporal_on_closed_train_record_testing
          rationale: "Header-stripping cannot be expressed in the structured call form (as: is mandatory); the auth validation is priority 1 and is asserted by every negative test's reliance on correct headers. Kept as a documented stub."

      - name: unauthorized_role_denied
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "TenantAdministrator calling POST /release-trains (PlatformOperator-exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["tenant t1 with admin"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-ER2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
          trigger:
            - call: "POST /release-trains"
              payload: { release_label: "X", release_kind: "WEEKLY_SERVICE", mandatory_date: "2026-10-01T00:00:00Z" }
              as: TenantAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED (403)"

  # ===========================================================================
  # Section: rbac — exclusive operations per role.
  # ===========================================================================
  - section: rbac
    instances:
      - name: approver_cannot_administer_definitions
        claim_type: role_denial
        grounds:
          - roles.Approver
        distinguishing_aspect: "Approver role calling definition activation (TenantAdministrator-exclusive) is denied with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["tenant t1, DRAFT definition d1"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-RB1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
          trigger:
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: Approver
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED (403)"

      - name: integration_developer_cannot_touch_business_process
        claim_type: role_denial
        grounds:
          - roles.IntegrationDeveloper
        distinguishing_aspect: "IntegrationDeveloper calling business-process-definition creation is denied."
        test_recipe:
          setup: ["tenant t1"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-RB2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: IntegrationDeveloper
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED (403)"

  # ===========================================================================
  # Section: cross_cutting_layers — OCC, cascading side effects, scheduled
  # actions, conditional flags, multi-tenancy isolation.
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_tenant_update_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tenant-config-update-stale-tenant]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT /tenants/{id} with a stale expected_tenant_version returns 412 ERR_STALE_VERSION; with the current version it succeeds and bumps version."
        test_recipe:
          setup: ["tenant t1 at version v1"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-OCC1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id, t1_v: $.data.version }
            - call: "PUT /tenants/${t1}"
              payload: { expected_tenant_version: "${t1_v}", maintenance_slot_utc: 3 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { t1_v2: $.data.version }
          trigger:
            - call: "PUT /tenants/${t1}"
              payload: { expected_tenant_version: "${t1_v}", maintenance_slot_utc: 4 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "t1_v2 == t1_v + 1 (successful update bumped version)"
            - "err_id == ERR_STALE_VERSION (412) for the replayed stale version"
            - "GET /tenants/${t1}.maintenance_slot_utc == 3 (stale write did not apply)"

      - name: occ_definition_activate_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[definition-activate-stale-tenant]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Definition activation with a stale expected_definition_version returns 412; the version observed at creation is used for the happy path."
        test_recipe:
          setup: ["tenant t1, DRAFT definition d1 at version d1_v; a step added (version still d1_v — steps are separate entities), then activation attempted with d1_v - 1 (deliberately stale)"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-OCC2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v} - 1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1_after: $.data.version }
          assert:
            - "err_id == ERR_STALE_VERSION (412) for the deliberately stale version expression ${d1_v} - 1"
            - "second activation with the current version succeeds; d1_after == d1_v + 1 and status == ACTIVE"

      - name: tenant_suspend_cascades_connectors
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Tenant.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Suspending a tenant cascades: ACTIVE connectors → SUSPENDED and their QUEUED runs → DEAD_LETTERED."
        test_recipe:
          setup: ["tenant t1 with ACTIVE connector c1 and one QUEUED run (SCHEDULE trigger inside blackout)"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CC1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T03:30:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/integration-connectors"
              payload: { connector_name: "C1", trigger_mode: "SCHEDULED", schedule_cron: "0 * * * *", blackout_window_start_utc: 3, blackout_window_end_utc: 4 }
              as: IntegrationDeveloper
              captures: { c1: $.data.id }
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/activate"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t1}/integration-connectors/${c1}/runs"
              payload: { trigger_source: "SCHEDULE" }
              as: PlatformOperator
              captures: { r1: $.data.id, r1_status: $.data.status }
          trigger:
            - call: "POST /tenants/${t1}/suspend"
              as: PlatformOperator
            - call: "GET /tenants/${t1}/integration-connectors/${c1}"
              as: IntegrationDeveloper
              captures: { c1_status: $.data.status }
            - call: "GET /tenants/${t1}/integration-connectors/${c1}/runs"
              as: IntegrationDeveloper
          assert:
            - "r1_status == QUEUED before suspend (inside blackout [3,4) at 03:30)"
            - "c1_status == SUSPENDED after tenant suspend"
            - "run ${r1} status == DEAD_LETTERED (QUEUED runs dead-letter on connector suspend)"

      - name: multi_tenancy_isolation_list_scoping
        claim_type: multi_tenancy
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Tenant A's tenant-scoped list endpoints never expose tenant B's resources; name uniqueness is scoped per tenant (same group name allowed on two tenants)."
        test_recipe:
          setup: ["tenants tA and tB, each with a security group named SAME-NAME"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-MA", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { tA: $.data.id, tA_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-MB", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { tB: $.data.id, tB_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants/${tA}/security-groups"
              payload: { group_name: "SAME-NAME", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${tA_admin}"
              captures: { gA: $.data.id }
            - call: "POST /tenants/${tB}/security-groups"
              payload: { group_name: "SAME-NAME", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${tB_admin}"
              captures: { gB: $.data.id }
          trigger:
            - call: "GET /tenants/${tA}/security-groups"
              as: TenantAdministrator
              as_user_id: "${tA_admin}"
          assert:
            - "both creates succeeded (tenant-scoped uniqueness)"
            - "list on ${tA} contains ${gA} and never ${gB}"
            - "GET /tenants/${tA}/security-groups/${gB} returns ERR_NOT_FOUND (cross-tenant id access is not distinguishable from missing)"

      - name: scheduled_deferred_org_activation_stub
        claim_type: scheduled_actions
        grounds:
          - state_machines.OrganizationUnit.PROPOSED_to_ACTIVE
        excluded_because:
          difficulty_instance: corner state_machines / org_unit_auto_activation_at_effective_date
          rationale: "The scheduled/deferred activation behavior is asserted by the named §1.9 state_machines instance."

      - name: conditional_feature_flags_amount_threshold
        claim_type: conditional_feature_flags
        grounds:
          - calculations.effective_step_chain_resolution
        distinguishing_aspect: "IF_AMOUNT_GT_1000 is a strict > boundary: amount exactly 1000 excludes the conditional step; 1000.01 includes it."
        test_recipe:
          setup: ["tenant t1, definition d1 EXPENSE ACTIVE with step 1 APPROVAL IF_AMOUNT_GT_1000 (g1) and step 2 APPROVAL ALWAYS (g1); approver w_mgr"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-FLAG1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "INIT", full_name: "Initiator", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "EXPENSE", definition_name: "AmtFlow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "IF_AMOUNT_GT_1000" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 2, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "EXPENSE", target_org_unit_id: "${u1}", amount: 1000 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst_eq: $.data.id, step_eq: $.data.current_step_order }
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "EXPENSE", target_org_unit_id: "${u1}", amount: 1000.01 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst_gt: $.data.id, step_gt: $.data.current_step_order }
          assert:
            - "step_eq == 2 (amount exactly 1000 does NOT satisfy strict >; conditional step skipped)"
            - "step_gt == 1 (1000.01 includes the conditional step)"

  # ===========================================================================
  # Section: consistency_model — immediate consistency claims.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "All mutations are visible in the same request's response: POST /tenants returns the fully-populated tenant including computed counters and bootstrap references."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CM1", tenant_kind: "SANDBOX", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, afc: $.data.adopted_feature_count, ver: $.data.version }
          assert:
            - "create response carries adopted_feature_count == 0, active_membership_count == 0, version == 1, and a non-null bootstrap_admin_worker_id without a second read"
            - "GET /tenants/${t1} immediately after returns identical field values (immediate consistency)"
