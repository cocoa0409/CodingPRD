scenario: |
  1262. Property Restoration Estimating & Insurance Repair (restoration contractor):
  loss assessment & scope documentation with photos/moisture readings, estimate
  preparation in carrier-standard format & line-item pricing, supplement submission
  for discovered damage, carrier adjuster negotiation & approval, work authorization
  & direct-pay assignment, code upgrade/ordinance coverage identification,
  depreciation recovery & final invoice, customer deductible collection.

domain_name: property-restoration-estimating
api_prefix: /v1

complexity_profile:
  primary_archetype: multi-party negotiation      # contractor <-> carrier adjuster line-level negotiation rounds
  secondary_archetype: ledger reconciliation      # RCV vs ACV vs recoverable depreciation vs paid ledgers must reconcile
  complexity_layers:
    - optimistic_concurrency        # OCC on Claim/Estimate/NegotiationRound version fields
    - dual_variant_calculation      # provisional (approved-scope) vs final (actual-qty) money; mean vs worst drying days
    - cascading_side_effects        # line edit -> estimate totals -> claim posture -> WA void -> claim ON_HOLD
    - derived_field_reconciliation  # claim-level aggregates recomputed from estimate/payment/code-upgrade mutations
  entity_topology: flat             # peer entities joined by FK references; no nested ownership tree in URLs
  state_machine_shape: cyclic       # Estimate DRAFT->SUBMITTED->COUNTERED->REVISED->SUBMITTED; Claim IN_PROGRESS<->ON_HOLD; Payment RETURNED->REQUESTED
  relationship_patterns:
    - one_to_many                   # Claim -> Inspection/Estimate/Supplement/Payment/...
    - cross_aggregate               # Photo attaches across Claim/Inspection/Supplement aggregates
    - polymorphic                   # Photo carries exactly one of inspection_id | supplement_id under claim_id
  role_model: segregation_of_duties # estimator vs adjuster split + invoice void SoD rule on created_by_user_id
  consistency_model: immediate      # every mutation visible in the same request's response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Carrier display name" }
      - { name: tax_rate, type: number, source: input, description: "Sales tax rate applied to taxable (MATERIAL) estimate lines, e.g. 0.07" }
      - { name: overhead_rate, type: number, source: input, default: 0.10, description: "Overhead rate for O&P compounding" }
      - { name: profit_rate, type: number, source: input, default: 0.10, description: "Profit rate applied on (base + overhead)" }
      - { name: o_and_p_min_trades, type: integer, source: input, default: 3, description: "Minimum distinct trades on an estimate for O&P to apply (>= threshold)" }
      - { name: negotiation_response_days, type: integer, source: input, default: 7, description: "Days a negotiation round stays OPEN before deemed-acceptance expiry sweep" }

  - name: PriceListEntry
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; owning carrier price list" }
      - { name: category_code, type: string, source: input, description: "Carrier-standard category code (e.g. WTR-DEMO); unique per carrier over any half-open-effective window" }
      - { name: trade, type: string, source: input, description: "Trade label (DEMOLITION, DRYWALL, PAINT, EQUIPMENT, CONTAINMENT, ...); distinct-trade count drives O&P gate" }
      - { name: kind, type: enum, source: input, description: "MATERIAL | LABOR | EQUIPMENT" }
      - { name: unit, type: string, source: input, description: "Unit of measure (SF, DAY, EA)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents; >= 0" }
      - { name: tax_applicable, type: boolean, source: input, default: false, description: "Whether sales tax applies to this line kind" }
      - { name: o_and_p_eligible, type: boolean, source: input, default: false, description: "Whether extended price joins the O&P base" }
      - { name: default_depreciation_pct, type: number, source: input, default: 0, description: "Default depreciation fraction copied onto new estimate lines" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Half-open window end (exclusive); must be > effective_from" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Insured property owner name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; policyholder" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; issuing carrier" }
      - { name: policy_number, type: string, source: input, description: "Carrier-unique policy number" }
      - { name: coverage_a_limit_cents, type: integer, source: input, description: "Dwelling coverage limit; > 0" }
      - { name: deductible_type, type: enum, source: input, description: "FLAT | PERCENT_OF_COVERAGE_A" }
      - { name: flat_deductible_cents, type: integer, source: input, description: "Required iff deductible_type == FLAT" }
      - { name: deductible_pct, type: number, source: input, description: "Required iff deductible_type == PERCENT_OF_COVERAGE_A" }
      - { name: recoverable_depreciation, type: boolean, source: input, description: "RCV policy (true) vs ACV-only policy (false)" }
      - { name: ordinance_coverage_pct, type: number, source: input, default: 0, description: "Ordinance & law coverage as fraction of coverage A (0 = not covered)" }
      - { name: ordinance_flat_cap_cents, type: integer, source: input, default: 0, description: "Flat cap on ordinance & law bucket (0 = not covered)" }
      - { name: period_start, type: datetime, source: input, description: "Policy period start (inclusive, closed interval)" }
      - { name: period_end, type: datetime, source: input, description: "Policy period end (inclusive, closed interval)" }
      - { name: ordinance_limit_cents, type: integer, source: computed, description: "= min(round_half_up(ordinance_coverage_pct * coverage_a_limit_cents), ordinance_flat_cap_cents)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy the loss is filed under" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from Policy at creation for ownership checks" }
      - { name: cause_of_loss, type: enum, source: input, description: "WATER | FIRE | WIND | MOLD | HAIL" }
      - { name: date_of_loss, type: datetime, source: input, description: "Loss date; must fall inside policy period (closed interval)" }
      - { name: loss_address, type: string, source: input, description: "Loss location", default: "" }
      - { name: status, type: enum, source: system, description: "INTAKE | ASSESSING | ESTIMATING | NEGOTIATING | APPROVED | AUTHORIZED | IN_PROGRESS | ON_HOLD | COMPLETE | INVOICED | CLOSED | DENIED | WITHDRAWN" }
      - { name: deductible_cents, type: integer, source: system, description: "Deductible snapshotted from Policy at claim creation (deductible_amount calc)" }
      - { name: rcv_total_cents, type: integer, source: computed, description: "Sum of grand_total_cents over estimates in {APPROVED, LOCKED} (provisional basis)" }
      - { name: acv_total_cents, type: integer, source: computed, description: "rcv_total - total depreciation over the same estimate set" }
      - { name: recoverable_depreciation_cents, type: integer, source: computed, description: "Recoverable depreciation withheld over the same estimate set" }
      - { name: carrier_paid_cents, type: integer, source: computed, description: "Sum of CLEARED carrier-direction payments (ACV_ADVANCE + DEPRECIATION_RECOVERY)" }
      - { name: customer_paid_cents, type: integer, source: computed, description: "Sum of CLEARED customer-direction payments (DEDUCTIBLE + CUSTOMER_BALANCE)" }
      - { name: deductible_collected_cents, type: integer, source: computed, description: "Sum of CLEARED DEDUCTIBLE payments" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "0 until an invoice is ISSUED; then active invoice outstanding_cents" }
      - { name: ordinance_consumed_cents, type: integer, source: computed, description: "Sum of covered_cents over CodeUpgrade in status APPROVED (ordered allocation)" }
      - { name: payment_posture, type: enum, source: computed, description: "UNPAID | ADVANCE_PAID | DEPRECIATION_PENDING | PAID_IN_FULL (claim_payment_posture calc)" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; inspected claim" }
      - { name: type, type: enum, source: input, description: "INITIAL | VERIFICATION" }
      - { name: assignee_id, type: string, source: input, description: "Field technician identifier; scheduling conflict scope" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (exclusive); must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion" }
      - { name: drying_days_worst_variant, type: integer, source: computed, description: "Drying days from worst single wet reading (drying_days calc); null until COMPLETED" }
      - { name: drying_days_mean_variant, type: integer, source: computed, description: "Drying days from mean wet exceedance (drying_days calc); null until COMPLETED" }

  - name: MoistureReading
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; parent inspection" }
      - { name: area, type: string, source: input, description: "Room/area label" }
      - { name: material, type: string, source: input, description: "Material measured (drywall, subfloor, ...)" }
      - { name: reading_value, type: number, source: input, description: "Moisture meter reading" }
      - { name: dry_standard, type: number, source: input, description: "Dry standard for this material" }
      - { name: recorded_at, type: datetime, source: input, description: "When the reading was taken" }
      - { name: is_wet, type: boolean, source: computed, description: "= reading_value > dry_standard + MOISTURE_WET_MARGIN (2)" }

  - name: Photo
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; owning claim" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; exactly one of inspection_id | supplement_id must be set" }
      - { name: supplement_id, type: string, source: input, description: "FK -> Supplement.id; exactly one of inspection_id | supplement_id must be set" }
      - { name: tag, type: enum, source: input, description: "LOSS_OVERVIEW | AREA | MOISTURE_PROOF | SUPPLEMENT_EVIDENCE | COMPLETION" }
      - { name: file_ref, type: string, source: input, description: "Opaque storage reference" }
      - { name: captured_at, type: datetime, source: input, description: "Capture timestamp" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path)" }
      - { name: supplement_id, type: string, source: system, description: "FK -> Supplement.id; set only for SUPPLEMENT estimates spawned by supplement approval" }
      - { name: type, type: enum, source: system, description: "INITIAL (manually created) | SUPPLEMENT (system-created on supplement approval)" }
      - { name: revision_number, type: integer, source: system, description: "Per-claim sequence: 1 + max(revision_number) over the claim's estimates" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COUNTERED | REVISED | APPROVED | LOCKED | DENIED" }
      - { name: rcv_total_cents, type: integer, source: computed, description: "Sum of extended_cents over lines with negotiation_status != REMOVED (line_extended_pricing)" }
      - { name: tax_total_cents, type: integer, source: computed, description: "Sum of per-line tax_cents (sales_tax)" }
      - { name: overhead_profit_total_cents, type: integer, source: computed, description: "overhead + profit (overhead_profit); 0 when trade gate unmet" }
      - { name: depreciation_total_cents, type: integer, source: computed, description: "Sum of per-line depreciation_cents (depreciation_split)" }
      - { name: recoverable_depreciation_cents, type: integer, source: computed, description: "Recoverable portion of depreciation_total" }
      - { name: acv_total_cents, type: integer, source: computed, description: "= grand_total_cents - depreciation_total_cents" }
      - { name: grand_total_cents, type: integer, source: computed, description: "= rcv_total_cents + tax_total_cents + overhead_profit_total_cents" }
      - { name: submitted_at, type: datetime, source: system, description: "Last submission time" }
      - { name: approved_at, type: datetime, source: system, description: "Approval time" }

  - name: EstimateLine
    parent: null
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; owning estimate (path)" }
      - { name: price_list_entry_id, type: string, source: input, description: "Carrier price list entry reference; must exist at add time and its effective window must cover the claim's date_of_loss at submit time" }
      - { name: category_code, type: string, source: system, description: "Copied from price list entry at add" }
      - { name: trade, type: string, source: system, description: "Copied from price list entry at add" }
      - { name: kind, type: enum, source: system, description: "Copied from price list entry at add" }
      - { name: description, type: string, source: input, default: "", description: "Line narrative" }
      - { name: qty, type: number, source: input, description: "Planned quantity; > 0" }
      - { name: unit_price_cents, type: integer, source: system, description: "Pinned from price list entry at add; adjustable via negotiation disposition accept" }
      - { name: depreciation_pct, type: number, source: input, description: "Defaults to entry default_depreciation_pct when omitted" }
      - { name: depreciation_recoverable, type: boolean, source: input, default: true, description: "Whether this line's depreciation is recoverable" }
      - { name: tax_applicable, type: boolean, source: system, description: "Copied from price list entry" }
      - { name: o_and_p_eligible, type: boolean, source: system, description: "Copied from price list entry" }
      - { name: negotiation_status, type: enum, source: system, description: "PENDING | DISPUTED | AGREED | REMOVED" }
      - { name: qty_actual, type: number, source: input, description: "Completed quantity recorded via record-actuals; null until recorded; 0 excludes the line from final invoice" }
      - { name: extended_cents, type: integer, source: computed, description: "= round_half_up(qty * unit_price_cents) -- per-line rounding pinned" }
      - { name: depreciation_cents, type: integer, source: computed, description: "= round_half_up(extended_cents * depreciation_pct)" }
      - { name: tax_cents, type: integer, source: computed, description: "= round_half_up(extended_cents * carrier.tax_rate) when tax_applicable else 0" }

  - name: Supplement
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path)" }
      - { name: narrative, type: string, source: input, description: "Discovered-damage narrative; must be non-empty to submit" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on submit" }
      - { name: decided_at, type: datetime, source: system, description: "Set on approve/deny" }

  - name: NegotiationRound
    parent: null
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; countered estimate (path)" }
      - { name: round_number, type: integer, source: system, description: "Per-estimate sequence: 1 + max(round_number) over the estimate's rounds" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | EXPIRED" }
      - { name: due_at, type: datetime, source: system, description: "= created_at + carrier.negotiation_response_days days; expiry sweep acts when clock passes due_at" }
      - { name: disputed_amount_cents, type: integer, source: computed, description: "Sum over PENDING dispositions of abs(line.extended_cents - round_half_up(proposed_qty * proposed_unit_price_cents)); null proposals keep current value" }

  - name: LineDisposition
    parent: null
    common_fields: true
    fields:
      - { name: negotiation_round_id, type: string, source: system, description: "FK -> NegotiationRound.id; owning round (path)" }
      - { name: estimate_line_id, type: string, source: input, description: "Target line identifier; must belong to the round's estimate (validated, ERR_DISPOSITION_LINE_MISMATCH)" }
      - { name: proposed_qty, type: number, source: input, description: "Adjuster-proposed quantity; null = unchanged" }
      - { name: proposed_unit_price_cents, type: integer, source: input, description: "Adjuster-proposed unit price; null = unchanged" }
      - { name: propose_removal, type: boolean, source: input, default: false, description: "Adjuster proposes removing the line" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED" }

  - name: CodeUpgrade
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path)" }
      - { name: code_citation, type: string, source: input, description: "Building-code citation driving the upgrade (e.g. NEC 2023 AFCI)" }
      - { name: description, type: string, source: input, description: "Scope of the required code upgrade" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Contractor-estimated cost; > 0" }
      - { name: approved_cost_cents, type: integer, source: input, description: "Adjuster-approved cost; defaults to estimated_cost_cents when omitted on approve" }
      - { name: covered_cents, type: integer, source: computed, description: "= min(approved_cost_cents, ordinance bucket remaining) at approval (ordinance_law_waterfall)" }
      - { name: customer_responsibility_cents, type: integer, source: computed, description: "= approved_cost_cents - covered_cents" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | APPROVED | DENIED | WITHDRAWN" }
      - { name: approved_at, type: datetime, source: system, description: "Approval timestamp; waterfall allocation order key" }

  - name: WorkAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path)" }
      - { name: direct_pay_assignment, type: boolean, source: input, description: "Assignment of benefits: carrier pays contractor directly" }
      - { name: deductible_acknowledged, type: boolean, source: input, description: "Customer acknowledges deductible obligation (anti-waiver compliance)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | VOIDED" }
      - { name: scope_rcv_cents, type: integer, source: system, description: "Snapshot of claim.rcv_total_cents at signing; scope-drift baseline" }
      - { name: signed_at, type: datetime, source: system, description: "Signing timestamp (logical clock)" }
      - { name: expires_at, type: datetime, source: system, description: "= signed_at + WA_VALIDITY_DAYS (30) days" }
      - { name: voided_reason, type: string, source: system, description: "SCOPE_DRIFT when auto-voided by supplement approval drift check" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | SETTLED | VOIDED" }
      - { name: total_cents, type: integer, source: computed, description: "Final-variant grand total over the claim's approved estimates (rcv_acv_totals final variant)" }
      - { name: applied_cents, type: integer, source: computed, description: "Sum of amounts of the claim's payments in CLEARED status, capped at total_cents" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= total_cents - applied_cents" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; SoD anchor for void" }
      - { name: issued_at, type: datetime, source: system, description: "Set on issue" }
      - { name: voided_at, type: datetime, source: system, description: "Set on void" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim (path or system)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set for DEPRECIATION_RECOVERY auto-payments, null otherwise" }
      - { name: type, type: enum, source: input, description: "ACV_ADVANCE | DEPRECIATION_RECOVERY | DEDUCTIBLE | CUSTOMER_BALANCE (auto-payments set it system-side)" }
      - { name: direction, type: enum, source: computed, description: "ACV_ADVANCE/DEPRECIATION_RECOVERY -> CARRIER_TO_CONTRACTOR; DEDUCTIBLE/CUSTOMER_BALANCE -> CUSTOMER_TO_CONTRACTOR" }
      - { name: amount_cents, type: integer, source: input, description: "> 0; system-computed for auto-created payments" }
      - { name: auto_created, type: boolean, source: system, description: "True for system-spawned ACV_ADVANCE / DEPRECIATION_RECOVERY" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | ISSUED | CLEARED | RETURNED | VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: INTAKE
    terminal_states: [CLOSED, DENIED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: ASSESSING
        trigger: "POST /v1/claims/{id}/transition {to: ASSESSING}"
        actor: ContractorAdmin
        preconditions: ["claim.status == INTAKE"]
        side_effects: ["increments Claim.version by 1"]
      - from: ASSESSING
        to: ESTIMATING
        trigger: "POST /v1/claims/{id}/transition {to: ESTIMATING}"
        actor: ContractorAdmin
        preconditions: ["claim.status == ASSESSING"]
        side_effects: ["increments Claim.version by 1"]
      - from: ESTIMATING
        to: NEGOTIATING
        trigger: "system: INITIAL estimate submitted (POST /v1/estimates/{id}/submit)"
        actor: system
        preconditions: ["estimate.type == INITIAL", "claim.status == ESTIMATING"]
        side_effects: ["increments Claim.version by 1"]
        note: "Conditional cascade: only INITIAL submissions move the claim; SUPPLEMENT submissions leave IN_PROGRESS untouched."
      - from: NEGOTIATING
        to: APPROVED
        trigger: "system: estimate approved (approve / concede / all-dispositions-accepted / round-expiry deemed acceptance)"
        actor: system
        preconditions: ["claim.status == NEGOTIATING"]
        side_effects: ["claim aggregates recomputed (rcv/acv/recoverable_depreciation)", "increments Claim.version by 1"]
      - from: NEGOTIATING
        to: DENIED
        trigger: "system: INITIAL estimate denied (POST /v1/estimates/{id}/deny)"
        actor: system
        preconditions: ["estimate.type == INITIAL", "claim.status == NEGOTIATING"]
        side_effects: ["increments Claim.version by 1"]
        note: "Denying a SUPPLEMENT estimate never moves the claim."
      - from: APPROVED
        to: AUTHORIZED
        trigger: "system: WorkAuthorization signed (POST /v1/work-authorizations/{id}/sign) while claim APPROVED"
        actor: system
        preconditions: ["claim.status == APPROVED"]
        side_effects:
          - "if WA.direct_pay_assignment == true: auto-create Payment(type=ACV_ADVANCE, amount_cents = max(0, claim.acv_total_cents - claim.deductible_cents), status=REQUESTED, auto_created=true)"
          - "increments Claim.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /v1/claims/{id}/start-work"
        actor: ContractorAdmin
        preconditions:
          - "claim.status in {APPROVED, AUTHORIZED}"
          - "safety: a WorkAuthorization with status SIGNED exists for the claim with deductible_acknowledged == true (else ERR_AUTHORIZATION_MISSING; note a signed WA auto-moves the claim to AUTHORIZED, so this edge always fails safety — defense in depth)"
          - "safety: cause_of_loss == MOLD implies an APPROVED/LOCKED estimate has a non-REMOVED line with trade == CONTAINMENT (else ERR_CONTAINMENT_REQUIRED)"
          - "temporal: logical clock <= WA.expires_at (else ERR_AUTHORIZATION_EXPIRED)"
        side_effects: ["increments Claim.version by 1"]
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: "POST /v1/claims/{id}/start-work"
        actor: ContractorAdmin
        preconditions:
          - "claim.status == AUTHORIZED"
          - "safety: a WorkAuthorization with status SIGNED exists for the claim with deductible_acknowledged == true (else ERR_AUTHORIZATION_MISSING)"
          - "safety: cause_of_loss == MOLD implies an APPROVED/LOCKED estimate has a non-REMOVED line with trade == CONTAINMENT (else ERR_CONTAINMENT_REQUIRED)"
          - "temporal: logical clock <= WA.expires_at (else ERR_AUTHORIZATION_EXPIRED)"
        side_effects: ["increments Claim.version by 1"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "system: SIGNED WorkAuthorization auto-voided by scope drift after a SUPPLEMENT estimate approval"
        actor: system
        preconditions: ["claim.status == IN_PROGRESS"]
        side_effects: ["increments Claim.version by 1"]
        note: "Cascade hop 4 of the supplement-approval chain; see Estimate SUPPLEMENT approve transition."
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "system: a new WorkAuthorization is signed while claim ON_HOLD"
        actor: system
        preconditions: ["claim.status == ON_HOLD"]
        side_effects: ["increments Claim.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /v1/claims/{id}/complete-work"
        actor: ContractorAdmin
        preconditions:
          - "claim.status == IN_PROGRESS"
          - "no CodeUpgrade on the claim in status IDENTIFIED (else ERR_CODE_UPGRADES_PENDING)"
          - "safety: for cause_of_loss in {WATER, MOLD}, for every (area, material) group having any reading with is_wet == true, the latest reading (recorded_at DESC, tie-break created_at DESC) satisfies reading_value <= dry_standard + MOISTURE_WET_MARGIN (2) (else ERR_MOISTURE_GATE_FAILED)"
        side_effects: ["increments Claim.version by 1"]
      - from: COMPLETE
        to: INVOICED
        trigger: "system: invoice issued (POST /v1/invoices/{id}/issue)"
        actor: system
        preconditions: ["claim.status == COMPLETE"]
        side_effects: ["claim.outstanding_balance_cents := invoice.outstanding_cents", "increments Claim.version by 1"]
      - from: INVOICED
        to: COMPLETE
        trigger: "system: active invoice voided (POST /v1/invoices/{id}/void)"
        actor: system
        preconditions: ["claim.status == INVOICED"]
        side_effects: ["claim.outstanding_balance_cents := 0", "increments Claim.version by 1"]
        note: "Compensation path: voiding an ISSUED invoice reverts the claim so a corrected invoice can be created."
      - from: INVOICED
        to: CLOSED
        trigger: "system: active invoice reaches SETTLED (applied_cents >= total_cents)"
        actor: system
        preconditions: ["claim.status == INVOICED"]
        side_effects: ["claim.payment_posture := PAID_IN_FULL", "increments Claim.version by 1"]
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/transition {to: WITHDRAWN}"
        actor: ContractorAdmin
        preconditions: ["claim.status in {INTAKE, ASSESSING, ESTIMATING, NEGOTIATING}"]
        side_effects: ["increments Claim.version by 1"]
      - from: ASSESSING
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/transition {to: WITHDRAWN}"
        actor: ContractorAdmin
        preconditions: ["claim.status in {INTAKE, ASSESSING, ESTIMATING, NEGOTIATING}"]
        side_effects: ["increments Claim.version by 1"]
      - from: ESTIMATING
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/transition {to: WITHDRAWN}"
        actor: ContractorAdmin
        preconditions: ["claim.status in {INTAKE, ASSESSING, ESTIMATING, NEGOTIATING}"]
        side_effects: ["increments Claim.version by 1"]
      - from: NEGOTIATING
        to: WITHDRAWN
        trigger: "POST /v1/claims/{id}/transition {to: WITHDRAWN}"
        actor: ContractorAdmin
        preconditions: ["claim.status in {INTAKE, ASSESSING, ESTIMATING, NEGOTIATING}"]
        side_effects: ["increments Claim.version by 1"]
      - from: INTAKE
        to: DENIED
        trigger: "POST /v1/claims/{id}/transition {to: DENIED}"
        actor: Adjuster
        preconditions: ["claim.status in {INTAKE, ASSESSING, ESTIMATING}"]
        side_effects: ["increments Claim.version by 1"]

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [LOCKED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/estimates/{id}/submit"
        actor: Estimator
        preconditions:
          - "estimate.status == DRAFT or REVISED"
          - "claim.state gate: type INITIAL requires claim.status in {ESTIMATING, NEGOTIATING}; type SUPPLEMENT requires claim.status == IN_PROGRESS"
          - "constraint: claim has at least one Inspection with status COMPLETED (else ERR_INSPECTION_INCOMPLETE)"
          - "constraint: estimate has at least one line with negotiation_status != REMOVED (else ERR_INVALID_REQUEST)"
          - "temporal: every non-REMOVED line's price list entry window covers claim.date_of_loss (else ERR_PRICE_WINDOW_VIOLATION)"
        side_effects:
          - "all lines with negotiation_status == DISPUTED revert to PENDING when resubmitting from REVISED"
          - "estimate.submitted_at := logical clock"
          - "if type == INITIAL and claim.status == ESTIMATING: claim -> NEGOTIATING"
          - "increments Estimate.version by 1"
      - from: REVISED
        to: SUBMITTED
        trigger: "POST /v1/estimates/{id}/submit"
        actor: Estimator
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects: ["same as DRAFT -> SUBMITTED"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /v1/estimates/{id}/negotiation-rounds (adjuster counter-offer)"
        actor: Adjuster
        preconditions:
          - "estimate.status == SUBMITTED"
          - "every disposition's estimate_line_id belongs to this estimate (else ERR_DISPOSITION_LINE_MISMATCH)"
        side_effects:
          - "NegotiationRound created (status OPEN, due_at := clock + carrier.negotiation_response_days)"
          - "each targeted line: negotiation_status -> DISPUTED"
          - "increments Estimate.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/estimates/{id}/approve"
        actor: Adjuster
        preconditions: ["estimate.status == SUBMITTED"]
        side_effects:
          - "all non-REMOVED lines: negotiation_status -> AGREED"
          - "estimate.approved_at := logical clock"
          - "claim aggregates recomputed (rcv_total_cents, acv_total_cents, recoverable_depreciation_cents)"
          - "if estimate.type == INITIAL and claim.status == NEGOTIATING: claim -> APPROVED"
          - "if estimate.type == SUPPLEMENT: scope-drift cascade (see note)"
          - "increments Estimate.version by 1"
        note: "SUPPLEMENT approval cascade: (1) estimate APPROVED -> (2) claim.rcv_total_cents recomputed -> (3) if abs(new rcv - WA.scope_rcv_cents) > 0.10 * WA.scope_rcv_cents the SIGNED WorkAuthorization -> VOIDED (voided_reason=SCOPE_DRIFT) -> (4) claim IN_PROGRESS -> ON_HOLD."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /v1/estimates/{id}/deny"
        actor: Adjuster
        preconditions: ["estimate.status == SUBMITTED"]
        side_effects:
          - "if estimate.type == INITIAL and claim.status == NEGOTIATING: claim -> DENIED"
          - "increments Estimate.version by 1"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /v1/estimates/{id}/revise"
        actor: Estimator
        preconditions: ["estimate.status == COUNTERED"]
        side_effects: ["all lines with negotiation_status == DISPUTED revert to PENDING", "increments Estimate.version by 1"]
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /v1/estimates/{id}/concede"
        actor: Estimator
        preconditions: ["estimate.status == COUNTERED", "an OPEN NegotiationRound exists"]
        side_effects:
          - "every PENDING disposition applied: line.qty := proposed_qty (if set), line.unit_price_cents := proposed_unit_price_cents (if set), line -> REMOVED when propose_removal, else line -> AGREED"
          - "round -> RESOLVED"
          - "estimate totals recomputed; estimate -> APPROVED with the same claim-side effects as approve"
          - "increments Estimate.version by 1"
      - from: COUNTERED
        to: APPROVED
        trigger: "system: all dispositions of the OPEN round ACCEPTED, or round expiry sweep (deemed acceptance)"
        actor: system
        preconditions: ["estimate.status == COUNTERED"]
        side_effects: ["same application + claim-side effects as concede"]
        note: "Round expiry sweep: when POST /v1/_clock/set_current_utc advances the clock past an OPEN round's due_at, all PENDING dispositions are auto-ACCEPTED at proposed values and the estimate auto-approves."
      - from: APPROVED
        to: LOCKED
        trigger: "system: invoice created for the claim (POST /v1/claims/{id}/invoices)"
        actor: system
        preconditions: ["estimate.status == APPROVED"]
        side_effects: ["estimate frozen; record-actuals no longer accepted", "increments Estimate.version by 1"]

  - entity: EstimateLine
    initial_state: PENDING
    terminal_states: [AGREED, REMOVED]
    note: "negotiation_status dimension; AGREED becomes immutable when the estimate locks"
    transitions:
      - from: PENDING
        to: DISPUTED
        trigger: "system: adjuster disposition targets this line"
        actor: system
        preconditions: ["line.negotiation_status == PENDING"]
        side_effects: ["round.disputed_amount_cents recomputed"]
      - from: DISPUTED
        to: AGREED
        trigger: "POST /v1/dispositions/{id}/respond {outcome: ACCEPT} on its disposition, or concede/expiry"
        actor: Estimator | system
        preconditions: ["disposition.status == PENDING"]
        side_effects: ["line.qty / unit_price_cents overwritten with proposed values; propose_removal routes to REMOVED instead", "estimate totals recomputed", "round auto-RESOLVED when no PENDING dispositions remain; if all were ACCEPTED the estimate auto-approves"]
      - from: DISPUTED
        to: PENDING
        trigger: "system: estimate revised (POST /v1/estimates/{id}/revise) or resubmitted"
        actor: system
        preconditions: ["estimate.status in {COUNTERED, REVISED}"]
        side_effects: []
      - from: PENDING
        to: REMOVED
        trigger: "POST /v1/estimates/{id}/lines/{line_id}/remove while estimate DRAFT or REVISED"
        actor: Estimator
        preconditions: ["estimate.status in {DRAFT, REVISED}"]
        side_effects: ["estimate totals recomputed (removed lines excluded)", "increments Estimate.version by 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /v1/inspections/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "inspection.status == SCHEDULED"
          - "constraint: >= 3 Photos with inspection_id == this inspection and tag in {LOSS_OVERVIEW, AREA, MOISTURE_PROOF} (else ERR_INSPECTION_EVIDENCE_INSUFFICIENT)"
          - "constraint: claim.cause_of_loss in {WATER, MOLD} implies >= 1 MoistureReading on this inspection (else ERR_INSPECTION_EVIDENCE_INSUFFICIENT)"
        side_effects:
          - "drying_days_worst_variant and drying_days_mean_variant computed (drying_days calc)"
          - "inspection.completed_at := logical clock"
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /v1/inspections/{id}/cancel"
        actor: FieldTechnician
        preconditions: ["inspection.status == SCHEDULED"]
        side_effects: []

  - entity: Supplement
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/supplements/{id}/submit"
        actor: Estimator
        preconditions:
          - "supplement.status == DRAFT"
          - "claim.status == IN_PROGRESS"
          - "constraint: narrative non-empty and >= 2 Photos with supplement_id == this supplement and tag == SUPPLEMENT_EVIDENCE (else ERR_SUPPLEMENT_EVIDENCE_INSUFFICIENT)"
        side_effects: ["supplement.submitted_at := logical clock"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/supplements/{id}/approve"
        actor: Adjuster
        preconditions: ["supplement.status == SUBMITTED"]
        side_effects:
          - "system creates Estimate(type=SUPPLEMENT, supplement_id=this, status=DRAFT, revision_number=next per-claim)"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /v1/supplements/{id}/deny"
        actor: Adjuster
        preconditions: ["supplement.status == SUBMITTED"]
        side_effects: []

  - entity: NegotiationRound
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "system: last PENDING disposition answered (respond accept/reject) or contractor concede"
        actor: system
        preconditions: ["no PENDING dispositions remain"]
        side_effects: ["if every disposition ACCEPTED: estimate auto-approves (see Estimate COUNTERED->APPROVED)"]
      - from: OPEN
        to: EXPIRED
        trigger: "system: clock sweep via POST /v1/_clock/set_current_utc with clock > due_at"
        actor: system
        preconditions: ["round.status == OPEN", "logical clock > round.due_at"]
        side_effects: ["all PENDING dispositions auto-ACCEPTED at proposed values", "estimate auto-approves with claim-side effects"]

  - entity: LineDisposition
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /v1/dispositions/{id}/respond {outcome: ACCEPT} or system expiry sweep"
        actor: Estimator | system
        preconditions: ["disposition.status == PENDING", "round.status == OPEN (else ERR_ROUND_NOT_OPEN)"]
        side_effects: ["proposed values applied to target line", "round and estimate cascades per EstimateLine transitions"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /v1/dispositions/{id}/respond {outcome: REJECT}"
        actor: Estimator
        preconditions: ["disposition.status == PENDING", "round.status == OPEN (else ERR_ROUND_NOT_OPEN)"]
        side_effects: ["round auto-RESOLVED when no PENDING dispositions remain; estimate stays COUNTERED awaiting revise or concede"]

  - entity: CodeUpgrade
    initial_state: IDENTIFIED
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: APPROVED
        trigger: "POST /v1/code-upgrades/{id}/approve"
        actor: Adjuster
        preconditions:
          - "code_upgrade.status == IDENTIFIED"
          - "claim.status not in {CLOSED, DENIED, WITHDRAWN}"
          - "fiscal: policy.ordinance_limit_cents > 0 (else ERR_ORDINANCE_NOT_COVERED)"
          - "fiscal: bucket remaining > 0 (else ERR_ORDINANCE_CAP_EXHAUSTED)"
        side_effects:
          - "approved_cost_cents := input override or estimated_cost_cents; approved_at := clock"
          - "covered_cents := min(approved_cost_cents, remaining); customer_responsibility_cents := approved_cost_cents - covered_cents"
          - "claim.ordinance_consumed_cents recomputed (waterfall, allocation order approved_at ASC then created_at ASC)"
      - from: IDENTIFIED
        to: DENIED
        trigger: "POST /v1/code-upgrades/{id}/deny"
        actor: Adjuster
        preconditions: ["code_upgrade.status == IDENTIFIED"]
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /v1/code-upgrades/{id}/withdraw"
        actor: Estimator
        preconditions: ["code_upgrade.status == APPROVED"]
        side_effects: ["compensation: covered_cents released; claim.ordinance_consumed_cents recomputed (bucket restored)"]

  - entity: WorkAuthorization
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /v1/work-authorizations/{id}/sign"
        actor: Customer
        preconditions:
          - "wa.status == DRAFT"
          - "ownership: X-User-ID == claim.customer_id"
          - "claim.status in {APPROVED, ON_HOLD}"
        side_effects:
          - "wa.scope_rcv_cents := claim.rcv_total_cents; wa.signed_at := clock; wa.expires_at := clock + 30 days"
          - "if claim.status == APPROVED: claim -> AUTHORIZED (ACV advance auto-created when direct_pay_assignment)"
          - "if claim.status == ON_HOLD: claim -> IN_PROGRESS"
      - from: SIGNED
        to: VOIDED
        trigger: "system: scope-drift check on SUPPLEMENT estimate approval"
        actor: system
        preconditions: ["abs(claim.rcv_total_cents_new - wa.scope_rcv_cents) > 0.10 * wa.scope_rcv_cents"]
        side_effects: ["wa.voided_reason := SCOPE_DRIFT", "if claim.status == IN_PROGRESS: claim -> ON_HOLD"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{id}/issue"
        actor: ContractorAdmin
        preconditions: ["invoice.status == DRAFT", "claim.status == COMPLETE (else ERR_INVOICE_NOT_ISSUABLE)"]
        side_effects:
          - "invoice.issued_at := clock"
          - "claim -> INVOICED; claim.outstanding_balance_cents := invoice.outstanding_cents"
          - "recovery := depreciation_recovery calc; if recovery > 0: auto-create Payment(type=DEPRECIATION_RECOVERY, amount_cents=recovery, status=REQUESTED, invoice_id=this, auto_created=true)"
          - "claim.payment_posture recomputed (-> DEPRECIATION_PENDING when invoice unpaid)"
      - from: ISSUED
        to: SETTLED
        trigger: "system: payment cleared such that applied_cents >= total_cents"
        actor: system
        preconditions: ["invoice.status == ISSUED"]
        side_effects: ["claim.payment_posture := PAID_IN_FULL", "claim -> CLOSED"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /v1/invoices/{id}/void"
        actor: ContractorAdmin
        preconditions: ["SoD: X-User-ID != invoice.created_by_user_id (else ERR_SOD_VIOLATION)"]
        side_effects: ["increments Claim.version by 1"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /v1/invoices/{id}/void"
        actor: ContractorAdmin
        preconditions: ["SoD: X-User-ID != invoice.created_by_user_id (else ERR_SOD_VIOLATION)"]
        side_effects:
          - "compensation: any auto-created DEPRECIATION_RECOVERY payment still in REQUESTED -> VOIDED"
          - "claim -> COMPLETE; claim.outstanding_balance_cents := 0; claim.payment_posture recomputed"
          - "increments Claim.version by 1"

  - entity: Payment
    initial_state: REQUESTED
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/payments/{id}/approve"
        actor: "Adjuster (carrier direction) | ContractorAdmin (customer direction)"
        preconditions:
          - "payment.status == REQUESTED"
          - "direction-role match: CARRIER_TO_CONTRACTOR requires Adjuster; CUSTOMER_TO_CONTRACTOR requires ContractorAdmin (else ERR_ROLE_NOT_PERMITTED)"
        side_effects: ["increments Payment.version by 1"]
      - from: APPROVED
        to: ISSUED
        trigger: "POST /v1/payments/{id}/issue"
        actor: "Adjuster (carrier direction) | ContractorAdmin (customer direction)"
        preconditions: ["payment.status == APPROVED", "direction-role match as approve"]
        side_effects: ["increments Payment.version by 1"]
      - from: ISSUED
        to: CLEARED
        trigger: "POST /v1/payments/{id}/clear"
        actor: ContractorAdmin
        preconditions: ["payment.status == ISSUED"]
        side_effects:
          - "claim.carrier_paid_cents / customer_paid_cents / deductible_collected_cents recomputed"
          - "active invoice.applied_cents recomputed; if applied_cents >= total_cents: invoice -> SETTLED"
          - "claim.payment_posture recomputed"
          - "increments Payment.version by 1"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /v1/payments/{id}/return (bounced)"
        actor: ContractorAdmin
        preconditions: ["payment.status in {ISSUED, CLEARED}"]
        side_effects: ["if previously CLEARED: claim paid counters recomputed excluding this payment; invoice.applied_cents recomputed; claim.payment_posture recomputed", "increments Payment.version by 1"]
      - from: CLEARED
        to: RETURNED
        trigger: "POST /v1/payments/{id}/return (clawback)"
        actor: ContractorAdmin
        preconditions: ["payment.status in {ISSUED, CLEARED}"]
        side_effects: ["claim paid counters recomputed excluding this payment; invoice.applied_cents recomputed; claim.payment_posture recomputed", "increments Payment.version by 1"]
      - from: RETURNED
        to: REQUESTED
        trigger: "POST /v1/payments/{id}/requeue (re-presentment)"
        actor: ContractorAdmin
        preconditions: ["payment.status == RETURNED"]
        side_effects: ["increments Payment.version by 1"]
      - from: REQUESTED
        to: VOIDED
        trigger: "system: parent invoice voided (auto-created recovery payments only)"
        actor: system
        preconditions: ["payment.auto_created == true", "payment.status == REQUESTED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /v1/claims/{id}/estimates"
    occ_field: expected_claim_version
    description: |
      Creating an INITIAL estimate against a Claim whose version has advanced
      since the client last observed it is rejected. Estimate creation bumps
      Claim.version (supersede-style bookkeeping), so a writer holding a stale
      claim version must re-read before creating.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disposition-add-stale-round
    parent_entity: NegotiationRound
    write_endpoint: "POST /v1/negotiation-rounds/{id}/dispositions"
    occ_field: expected_negotiation_round_version
    description: |
      Appending dispositions to an OPEN NegotiationRound whose version has
      advanced since the client last observed it is rejected; the round stays
      OPEN across appends, so only the version check orders the writes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: line-edit-stale-estimate
    parent_entity: Estimate
    write_endpoint: "PATCH /v1/estimates/{id}/lines/{line_id}"
    occ_field: expected_estimate_version
    description: |
      Editing a line of an Estimate whose version has advanced since the client
      last observed it is rejected; DRAFT/REVISED estimates accept unlimited
      sequential edits, so only the version check orders the writes.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_extended_pricing
    trigger: "on estimate line add / patch / remove / disposition-accept (recompute per line, then roll up)"
    algorithm: aggregation
    formula: |
      per line L (negotiation_status != REMOVED):
        L.extended_cents = round_half_up(L.qty * L.unit_price_cents)      # ROUND PER LINE FIRST
      estimate.rcv_total_cents = sum(L.extended_cents)                    # THEN SUM
      # Pinned order: per-line round_half_up, then integer sum.
      # Counter-example pinned in tests: 3 lines of qty 0.335 @ 199 cents ->
      # per-line-then-sum = 3 * round_half_up(66.665) = 201;
      # sum-then-round would be round_half_up(199.995) = 200. The scaffold pins 201.
    input_set: "EstimateLine of the estimate with negotiation_status != REMOVED; qty is planned qty (provisional) or qty_actual when final variant runs"
    constants:
      ROUNDING: "round_half_up to integer cents, per line, before summation"
    precision: "integer cents, round_half_up at line level only"
    variants:
      - name: provisional
        when: "estimate lifecycle (submit/negotiation/approve) and claim aggregates"
        difference: "uses qty (planned); REMOVED lines excluded"
      - name: final
        when: "invoice creation"
        difference: "uses qty_actual when recorded (qty_actual == 0 excludes the line); REMOVED lines excluded"

  - name: sales_tax
    trigger: "with line_extended_pricing roll-up"
    algorithm: aggregation
    formula: |
      per taxable line L (tax_applicable == true, not REMOVED):
        L.tax_cents = round_half_up(L.extended_cents * carrier.tax_rate)
      estimate.tax_total_cents = sum(L.tax_cents)
      # tax is computed on extended price BEFORE O&P; O&P itself is never taxed.
    input_set: "non-REMOVED lines with tax_applicable == true"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants:
      - name: provisional
        when: "estimate lifecycle"
        difference: "planned qty"
      - name: final
        when: "invoice creation"
        difference: "actual qty per line_extended_pricing final variant"

  - name: overhead_profit
    trigger: "with line_extended_pricing roll-up"
    algorithm: threshold
    formula: |
      trades = count(distinct L.trade over non-REMOVED lines)
      if trades >= carrier.o_and_p_min_trades:                            # >= 3 boundary pinned
        base = sum(L.extended_cents over non-REMOVED lines with o_and_p_eligible == true)
        overhead = round_half_up(base * carrier.overhead_rate)            # 10%
        profit   = round_half_up((base + overhead) * carrier.profit_rate) # 10% of (base+overhead): sequential compounding pinned
        estimate.overhead_profit_total_cents = overhead + profit
      else:
        estimate.overhead_profit_total_cents = 0
      # Non-linear: gate on distinct trade count, eligibility filter, two-stage compounding.
    input_set: "non-REMOVED lines; eligibility and trade from pinned line fields"
    constants:
      OVERHEAD_RATE_REF: carrier.overhead_rate
      PROFIT_RATE_REF: carrier.profit_rate
      MIN_TRADES_REF: carrier.o_and_p_min_trades
    precision: "integer cents, round_half_up at each stage (overhead, then profit)"
    variants:
      - name: provisional
        when: "estimate lifecycle"
        difference: "planned qty"
      - name: final
        when: "invoice creation"
        difference: "actual qty; trade gate re-evaluated on final line set"

  - name: depreciation_split
    trigger: "with line_extended_pricing roll-up"
    algorithm: aggregation
    formula: |
      per line L (not REMOVED):
        L.depreciation_cents = round_half_up(L.extended_cents * L.depreciation_pct)
        recoverable_part = L.depreciation_cents if (claim.policy.recoverable_depreciation and L.depreciation_recoverable) else 0
      estimate.depreciation_total_cents = sum(L.depreciation_cents)
      estimate.recoverable_depreciation_cents = sum(recoverable_part)
      estimate.acv_total_cents = estimate.grand_total_cents - estimate.depreciation_total_cents
      # Depreciation applies to line extended amounts only -- never to tax or O&P.
    input_set: "non-REMOVED lines"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants:
      - name: provisional
        when: "estimate lifecycle"
        difference: "planned qty"
      - name: final
        when: "invoice creation"
        difference: "actual qty"

  - name: rcv_acv_totals
    trigger: "claim-level roll-up on estimate approval / lock / line mutation under an APPROVED estimate set"
    algorithm: aggregation
    formula: |
      estimate.grand_total_cents = rcv_total_cents + tax_total_cents + overhead_profit_total_cents
      claim.rcv_total_cents = sum(grand_total_cents over estimates in {APPROVED, LOCKED})
      claim.acv_total_cents = sum(acv_total_cents over estimates in {APPROVED, LOCKED})
      claim.recoverable_depreciation_cents = sum(recoverable_depreciation_cents over estimates in {APPROVED, LOCKED})
    input_set: "estimates of the claim with status in {APPROVED, LOCKED}; DRAFT/SUBMITTED/COUNTERED/REVISED/DENIED estimates contribute nothing"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "claim aggregate during negotiation/authorization/work"
        difference: "planned quantities from APPROVED estimates"
      - name: final
        when: "invoice.total_cents at invoice creation"
        difference: "recomputes every approved estimate with qty_actual overrides and zero-qty exclusions; the two variants diverge whenever actuals differ from plan"

  - name: deductible_amount
    trigger: "claim creation (snapshot)"
    algorithm: threshold
    formula: |
      if policy.deductible_type == FLAT:
        claim.deductible_cents = policy.flat_deductible_cents
      else:
        claim.deductible_cents = round_half_up(policy.deductible_pct * policy.coverage_a_limit_cents)
    input_set: "policy of the claim at creation time"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: flat
        when: "deductible_type == FLAT"
        difference: "fixed amount"
      - name: percentage
        when: "deductible_type == PERCENT_OF_COVERAGE_A"
        difference: "percentage of coverage A; same policy data yields a different deductible than FLAT"

  - name: acv_advance_amount
    trigger: "WorkAuthorization signing with direct_pay_assignment == true (claim -> AUTHORIZED)"
    algorithm: waterfall_allocation
    formula: |
      advance = max(0, claim.acv_total_cents - claim.deductible_cents)
      if advance > 0: auto-create Payment(type=ACV_ADVANCE, amount_cents=advance, status=REQUESTED)
      # Pinned: deductible is netted out of the FIRST carrier payment; it is never paid by the carrier.
    input_set: "claim aggregates at signing time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: direct_pay
        when: "direct_pay_assignment == true"
        difference: "payment auto-created CARRIER_TO_CONTRACTOR"
      - name: no_direct_pay
        when: "direct_pay_assignment == false"
        difference: "no payment auto-created; customer is paid by carrier out of band and owes the contractor via CUSTOMER_BALANCE at invoice"

  - name: depreciation_recovery
    trigger: "invoice issue (POST /v1/invoices/{id}/issue)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (circular-looking dependency made explicit):
      #   (1) deductible_cents  : policy snapshot taken at claim creation -- NOT derived from payments
      #   (2) acv_advance_paid  : sum of CLEARED ACV_ADVANCE payments
      #   (3) actual_spend_gap  = max(0, invoice.total_cents - acv_advance_paid - deductible_cents)
      #   (4) recovery          = min(claim.recoverable_depreciation_cents, actual_spend_gap)
      # Recovery never exceeds depreciation withheld AND never exceeds what the customer
      # actually spent beyond (advance + deductible).
      recovery = min(claim.recoverable_depreciation_cents,
                     max(0, invoice.total_cents - acv_advance_paid - claim.deductible_cents))
      if recovery > 0: auto-create Payment(type=DEPRECIATION_RECOVERY, amount_cents=recovery, status=REQUESTED, invoice_id=invoice.id)
    input_set: "claim aggregates, CLEARED ACV_ADVANCE payments, the issuing invoice"
    constants: {}
    precision: "integer cents"
    variants:
      - name: projected
        when: "at estimate approval (claim.recoverable_depreciation_cents is the projection)"
        difference: "assumes work completed at approved scope"
      - name: settled
        when: "at invoice issue"
        difference: "capped by actual final invoice; smaller actual spend reduces recovery cent-for-cent"

  - name: ordinance_law_waterfall
    trigger: "code-upgrade approve / withdraw"
    algorithm: waterfall_allocation
    formula: |
      policy.ordinance_limit_cents = min(round_half_up(ordinance_coverage_pct * coverage_a_limit_cents),
                                         ordinance_flat_cap_cents)
      # Allocation is INCREMENTAL AT APPROVAL TIME, ordered by approved_at ASC
      # (tie-break: created_at ASC). On approve of item I:
      remaining = policy.ordinance_limit_cents - sum(covered_cents over claim's CodeUpgrades in status APPROVED)
      if policy has no ordinance coverage (limit == 0): reject with ERR_ORDINANCE_NOT_COVERED
      if remaining == 0: reject with ERR_ORDINANCE_CAP_EXHAUSTED
      I.covered_cents = min(I.approved_cost_cents, remaining)             # exact-limit approval: remaining >= cost covers fully (>=)
      I.customer_responsibility_cents = I.approved_cost_cents - I.covered_cents
      claim.ordinance_consumed_cents = sum(covered_cents over APPROVED items)
      # Withdraw of an APPROVED item releases its covered_cents back to the bucket (compensation).
    input_set: "CodeUpgrades of the claim in status APPROVED, allocation order approved_at ASC then created_at ASC"
    constants: {}
    precision: "integer cents, round_half_up for the limit"
    variants:
      - name: covered
        when: "policy has ordinance coverage (limit > 0)"
        difference: "bucket allocation with partial coverage at exhaustion boundary"
      - name: not_covered
        when: "limit == 0"
        difference: "approval rejected outright; cost becomes customer responsibility only via CUSTOMER_BALANCE invoicing"

  - name: drying_days
    trigger: "inspection completion (POST /v1/inspections/{id}/complete)"
    algorithm: weighted_scoring
    formula: |
      wet points W = readings with is_wet (reading_value > dry_standard + 2)
      exceedance(r) = r.reading_value - r.dry_standard
      worst variant:  E = max(exceedance over all readings; 0 when none)
                      days = 1 if E <= 8; 3 if E <= 20; else 5
      mean variant:   M = mean(exceedance over wet points; 0 when none)
                      days = 1 if M <= 8; 2 if M <= 20; else 4
      inspection.drying_days_worst_variant := worst days
      inspection.drying_days_mean_variant  := mean days
      # Same readings, two sanctioned classifications, different equipment-day counts.
    input_set: "all MoistureReadings of the completing inspection"
    constants:
      MOISTURE_WET_MARGIN: 2
      T1: 8
      T2: 20
      WORST_DAYS: [1, 3, 5]
      MEAN_DAYS: [1, 2, 4]
    precision: "exceedances in reading points (1 decimal), days integer"
    variants:
      - name: worst_reading_governs
        when: "carrier-mandated classification (stored on drying_days_worst_variant)"
        difference: "single worst point drives the class"
      - name: area_weighted_mean
        when: "contractor provisional classification (stored on drying_days_mean_variant)"
        difference: "mean of wet points drives the class; typically fewer days"

  - name: claim_payment_posture
    trigger: "any payment status mutation or invoice issue/void/settle on the claim"
    algorithm: aggregation
    formula: |
      carrier_paid = sum(amount over CLEARED payments with direction CARRIER_TO_CONTRACTOR)
      customer_paid = sum(amount over CLEARED payments with direction CUSTOMER_TO_CONTRACTOR)
      deductible_collected = sum(amount over CLEARED DEDUCTIBLE payments)
      posture:
        PAID_IN_FULL          if active invoice SETTLED
        DEPRECIATION_PENDING  if active invoice ISSUED and not SETTLED
        ADVANCE_PAID          if no issued invoice and carrier_paid > 0
        UNPAID                otherwise
      claim.outstanding_balance_cents = active issued/SETTLED invoice.outstanding_cents, else 0
      # Conserved quantity: invoice.total_cents == invoice.outstanding_cents + sum(CLEARED payments applied)
    input_set: "payments of the claim by status; active (non-VOIDED) invoice"
    constants: {}
    precision: "integer cents"
    variants:
      - name: pre_invoice
        when: "before any invoice is ISSUED"
        difference: "posture derived from carrier advance only"
      - name: post_invoice
        when: "after ISSUED"
        difference: "posture derives from invoice settlement"

  - name: scope_drift_check
    trigger: "SUPPLEMENT estimate approval (after claim aggregates recompute)"
    algorithm: threshold
    formula: |
      drift = claim.rcv_total_cents_after - wa.scope_rcv_cents      # wa = the claim's SIGNED WorkAuthorization
      if abs(drift) > round_half_up(0.10 * wa.scope_rcv_cents):     # strictly greater; exactly 10% does NOT void
        wa -> VOIDED (SCOPE_DRIFT); claim IN_PROGRESS -> ON_HOLD
    input_set: "claim aggregates post-approval; the SIGNED WorkAuthorization"
    constants:
      WA_SCOPE_DRIFT_TOLERANCE: 0.10
    precision: "integer cents; comparison strictly greater-than on rounded threshold"
    variants:
      - name: within_tolerance
        when: "abs(drift) <= 10% of scope"
        difference: "no side effects"
      - name: beyond_tolerance
        when: "abs(drift) > 10%"
        difference: "WA voided, claim placed ON_HOLD until re-signed"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_MISSING_AUTH_HEADER, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's role list; direction-role split on payment approve/issue (CARRIER_TO_CONTRACTOR requires Adjuster, CUSTOMER_TO_CONTRACTOR requires ContractorAdmin)", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "Customer-role ownership: X-User-ID must equal the owning claim's customer_id for claim-scoped reads, payment creation, and WA signing", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "GET /v1/claims/{id}, GET /v1/claims/{id}/estimates, GET /v1/claims/{id}/payments, GET /v1/claims/{id}/financial-summary, GET /v1/claims/{id}/invoices, GET /v1/invoices/{id}, GET /v1/estimates/{id}, POST /v1/claims/{id}/payments, POST /v1/work-authorizations/{id}/sign" }
  - { priority: 2, category: auth, check: "Segregation of duties: invoice void caller's X-User-ID must differ from invoice.created_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /v1/invoices/{id}/void" }
  - { priority: 3, category: existence, check: "Path identifiers resolve left-to-right; body-referenced resources (policy_id, price_list_entry_id, claim_id, inspection_id/supplement_id, estimate_line_id) must exist", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all", note: "missing body references surface as 404 with the same error id" }
  - { priority: 4, category: business_constraint, check: "Required fields present; types and enum memberships valid; qty > 0; amount_cents > 0; effective_to > effective_from; scheduled_end > scheduled_start; deductible field matches deductible_type; Photo sets exactly one of inspection_id|supplement_id and tag consistent with target (supplement_id requires SUPPLEMENT_EVIDENCE)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /v1/claims/{id}/estimates, POST /v1/negotiation-rounds/{id}/dispositions, PATCH /v1/estimates/{id}/lines/{line_id}" }
  - { priority: 6, category: state, check: "Generic state-machine legality: transition endpoint `to` must be a declared edge from current state; action endpoints require the machine's from-state (e.g. submit from DRAFT/REVISED, approve from SUBMITTED, respond on PENDING disposition, return from ISSUED/CLEARED)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "POST /v1/claims/{id}/transition and all action endpoints" }
  - { priority: 6, category: state, check: "Payment creation requires claim in a payable state {AUTHORIZED, IN_PROGRESS, ON_HOLD, COMPLETE, INVOICED}; DENIED/WITHDRAWN/CLOSED claims reject payment creation", error_id: ERR_CLAIM_NOT_PAYABLE, http_status: 409, applies_to: "POST /v1/claims/{id}/payments" }
  - { priority: 6, category: state, check: "Supplement creation requires claim.status == IN_PROGRESS", error_id: ERR_SUPPLEMENT_NOT_PERMITTED, http_status: 409, applies_to: "POST /v1/claims/{id}/supplements" }
  - { priority: 6, category: state, check: "Line add/patch/remove and record-actuals require estimate in an editable state (DRAFT/REVISED for line edits; APPROVED with claim IN_PROGRESS/COMPLETE for actuals)", error_id: ERR_ESTIMATE_NOT_EDITABLE, http_status: 409, applies_to: "POST /v1/estimates/{id}/lines, PATCH /v1/estimates/{id}/lines/{line_id}, POST /v1/estimates/{id}/lines/{line_id}/remove, POST /v1/estimates/{id}/record-actuals" }
  - { priority: 6, category: state, check: "Invoice issue requires invoice DRAFT and claim COMPLETE", error_id: ERR_INVOICE_NOT_ISSUABLE, http_status: 409, applies_to: "POST /v1/invoices/{id}/issue" }
  - { priority: 6, category: state, check: "Disposition add/respond requires the round OPEN. Within priority 6 on respond, the disposition's own status is checked FIRST (non-PENDING -> ERR_INVALID_STATE_TRANSITION), then the round's", error_id: ERR_ROUND_NOT_OPEN, http_status: 409, applies_to: "POST /v1/negotiation-rounds/{id}/dispositions, POST /v1/dispositions/{id}/respond" }
  - { priority: 6, category: state, check: "Child-creation state gates: estimate create requires claim in {ASSESSING, ESTIMATING, NEGOTIATING}; inspection create requires claim in {INTAKE, ASSESSING}; code-upgrade create requires claim non-terminal; work-authorization create requires claim in {APPROVED, ON_HOLD}; invoice create requires claim COMPLETE", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "POST /v1/claims/{id}/estimates, POST /v1/claims/{id}/inspections, POST /v1/claims/{id}/code-upgrades, POST /v1/claims/{id}/work-authorizations, POST /v1/claims/{id}/invoices" }
  - { priority: 7, category: business_safety, check: "start-work requires a SIGNED (non-voided) WorkAuthorization with deductible_acknowledged == true", error_id: ERR_AUTHORIZATION_MISSING, http_status: 409, applies_to: "POST /v1/claims/{id}/start-work" }
  - { priority: 7, category: business_safety, check: "MOLD claims require a non-REMOVED CONTAINMENT-trade line in an APPROVED/LOCKED estimate before work starts", error_id: ERR_CONTAINMENT_REQUIRED, http_status: 422, applies_to: "POST /v1/claims/{id}/start-work" }
  - { priority: 7, category: business_safety, check: "WATER/MOLD complete-work moisture gate: latest reading per wet (area, material) group must be <= dry_standard + 2", error_id: ERR_MOISTURE_GATE_FAILED, http_status: 422, applies_to: "POST /v1/claims/{id}/complete-work" }
  - { priority: 8, category: business_constraint, check: "Estimate submit requires >= 1 COMPLETED inspection on the claim and >= 1 non-REMOVED line", error_id: ERR_INSPECTION_INCOMPLETE, http_status: 422, applies_to: "POST /v1/estimates/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "Inspection complete requires >= 3 tagged photos (LOSS_OVERVIEW/AREA/MOISTURE_PROOF) and, for WATER/MOLD claims, >= 1 moisture reading", error_id: ERR_INSPECTION_EVIDENCE_INSUFFICIENT, http_status: 422, applies_to: "POST /v1/inspections/{id}/complete" }
  - { priority: 8, category: business_constraint, check: "Supplement submit requires non-empty narrative and >= 2 SUPPLEMENT_EVIDENCE photos", error_id: ERR_SUPPLEMENT_EVIDENCE_INSUFFICIENT, http_status: 422, applies_to: "POST /v1/supplements/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "At most one INITIAL estimate per claim", error_id: ERR_DUPLICATE_INITIAL_ESTIMATE, http_status: 409, applies_to: "POST /v1/claims/{id}/estimates" }
  - { priority: 8, category: business_constraint, check: "At most one non-VOIDED invoice per claim", error_id: ERR_DUPLICATE_ACTIVE_INVOICE, http_status: 409, applies_to: "POST /v1/claims/{id}/invoices" }
  - { priority: 8, category: business_constraint, check: "Inspection scheduling: for the same assignee_id, windows must not overlap with a 30-minute travel buffer on both sides (new_start < existing_end + 30min AND new_end > existing_start - 30min conflicts; exactly 30 minutes gap is allowed)", error_id: ERR_INSPECTION_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /v1/claims/{id}/inspections" }
  - { priority: 8, category: business_constraint, check: "Disposition estimate_line_id must belong to the round's estimate", error_id: ERR_DISPOSITION_LINE_MISMATCH, http_status: 422, applies_to: "POST /v1/estimates/{id}/negotiation-rounds, POST /v1/negotiation-rounds/{id}/dispositions" }
  - { priority: 8, category: business_constraint, check: "complete-work rejected while any CodeUpgrade on the claim is still IDENTIFIED", error_id: ERR_CODE_UPGRADES_PENDING, http_status: 409, applies_to: "POST /v1/claims/{id}/complete-work" }
  - { priority: 8, category: business_constraint, check: "Price list window overlap: per (carrier_id, category_code), half-open [effective_from, effective_to) windows must not overlap; adjacency (from == prior to) is allowed", error_id: ERR_PRICE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /v1/carriers/{id}/price-list-entries" }
  - { priority: 9, category: business_temporal, check: "Claim date_of_loss must satisfy policy.period_start <= date_of_loss <= policy.period_end (closed interval)", error_id: ERR_POLICY_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /v1/claims" }
  - { priority: 9, category: business_temporal, check: "At estimate submit, every non-REMOVED line's price entry must satisfy effective_from <= date_of_loss < effective_to", error_id: ERR_PRICE_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /v1/estimates/{id}/submit" }
  - { priority: 9, category: business_temporal, check: "start-work requires logical clock <= WA.expires_at (signed_at + 30 days)", error_id: ERR_AUTHORIZATION_EXPIRED, http_status: 422, applies_to: "POST /v1/claims/{id}/start-work" }
  - { priority: 10, category: business_fiscal, check: "Code-upgrade approve on a policy whose ordinance_limit_cents == 0", error_id: ERR_ORDINANCE_NOT_COVERED, http_status: 422, applies_to: "POST /v1/code-upgrades/{id}/approve" }
  - { priority: 10, category: business_fiscal, check: "Code-upgrade approve when ordinance bucket remaining == 0", error_id: ERR_ORDINANCE_CAP_EXHAUSTED, http_status: 422, applies_to: "POST /v1/code-upgrades/{id}/approve" }
  - { priority: 10, category: business_fiscal, check: "CUSTOMER_BALANCE payment amount must be <= active invoice outstanding_cents (post-invoice) and > 0", error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http_status: 422, applies_to: "POST /v1/claims/{id}/payments" }
  - { priority: 10, category: business_fiscal, check: "DEDUCTIBLE payments: sum of CLEARED/ISSUED/APPROVED/REQUESTED deductible payments + new amount must be <= claim.deductible_cents; exactly equal is allowed", error_id: ERR_DEDUCTIBLE_OVERPAID, http_status: 422, applies_to: "POST /v1/claims/{id}/payments" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-05-01T00:00:00Z (never wall-clock). Advancing past an OPEN round's due_at fires the expiry sweep; also drives WA expiry checks.", roles: [ContractorAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string, expired_round_ids: string[] }", side_effects: ["round expiry sweep (deemed acceptance)", "no wall-clock dependency anywhere"] }
  - { method: POST, path: "/v1/carriers", description: "Create carrier pricing/tax configuration", roles: [ContractorAdmin], code: 201, input: [name, tax_rate, "overhead_rate?", "profit_rate?", "o_and_p_min_trades?", "negotiation_response_days?"], output: Carrier, side_effects: [] }
  - { method: GET, path: "/v1/carriers/{id}", description: "Read carrier", roles: [ContractorAdmin, Estimator, Adjuster], code: 200, input: [], output: Carrier, side_effects: [] }
  - { method: POST, path: "/v1/carriers/{id}/price-list-entries", description: "Add price list entry with half-open effective window; overlap on (carrier_id, category_code) rejected", roles: [ContractorAdmin], code: 201, input: [category_code, trade, kind, unit, unit_price_cents, "tax_applicable?", "o_and_p_eligible?", "default_depreciation_pct?", effective_from, effective_to], output: PriceListEntry, side_effects: ["ERR_PRICE_WINDOW_OVERLAP when window intersects an existing entry for the same carrier+category_code"] }
  - { method: GET, path: "/v1/carriers/{id}/price-list-entries", description: "List price entries of a carrier (reverse reachability for PriceListEntry.carrier_id)", roles: [ContractorAdmin, Estimator, Adjuster], code: 200, input: ["category_code?", "limit?", "offset?"], output: "PriceListEntry[]", side_effects: [] }
  - { method: POST, path: "/v1/customers", description: "Create insured customer", roles: [ContractorAdmin], code: 201, input: [full_name, email], output: Customer, side_effects: [] }
  - { method: POST, path: "/v1/policies", description: "Create policy with coverage/deductible/ordinance terms; ordinance_limit_cents computed", roles: [ContractorAdmin], code: 201, input: [customer_id, carrier_id, policy_number, coverage_a_limit_cents, deductible_type, "flat_deductible_cents?", "deductible_pct?", recoverable_depreciation, "ordinance_coverage_pct?", "ordinance_flat_cap_cents?", period_start, period_end], output: Policy, side_effects: ["ordinance_limit_cents computed"] }
  - { method: GET, path: "/v1/policies/{id}", description: "Read policy", roles: [ContractorAdmin, Estimator, Adjuster], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET, path: "/v1/policies", description: "List policies (reverse reachability for Policy.customer_id and Policy.carrier_id)", roles: [ContractorAdmin, Estimator, Adjuster], code: 200, input: ["customer_id?", "carrier_id?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: POST, path: "/v1/claims", description: "Open a claim; deductible snapshotted; date_of_loss must sit inside policy period", roles: [ContractorAdmin], code: 201, input: [policy_id, cause_of_loss, date_of_loss, "loss_address?"], output: Claim, side_effects: ["deductible_cents snapshot (deductible_amount)", "customer_id copied from policy"] }
  - { method: GET, path: "/v1/claims", description: "List claims (reverse reachability for Claim.policy_id and Claim.customer_id); Customer sees only own", roles: [ContractorAdmin, Estimator, Adjuster, Customer], code: 200, input: ["policy_id?", "customer_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/v1/claims/{id}", description: "Read claim incl. computed aggregates", roles: [ContractorAdmin, Estimator, Adjuster, Customer], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/v1/claims/{id}/transition", description: "Manual claim transitions (INTAKE->ASSESSING->ESTIMATING; WITHDRAWN from pre-approval states; DENIED by Adjuster from INTAKE/ASSESSING/ESTIMATING)", roles: [ContractorAdmin, Adjuster], code: 200, input: [to, "reason?"], output: Claim, side_effects: ["increments Claim.version by 1"] }
  - { method: POST, path: "/v1/claims/{id}/start-work", description: "AUTHORIZED -> IN_PROGRESS with safety (signed WA, containment) and temporal (expiry) gates", roles: [ContractorAdmin], code: 200, input: [], output: Claim, side_effects: ["increments Claim.version by 1"] }
