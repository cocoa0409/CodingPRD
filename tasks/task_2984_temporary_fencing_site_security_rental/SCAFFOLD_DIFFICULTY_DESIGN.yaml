              as: PlatformAdmin
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 3, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version"}
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_id: "$.data.id", q1_status_draft: "$.data.status"}
          trigger:
            - call: "POST /fence-rentals/contracts"
              payload: { quote_id: "${q1_id}", terms_acknowledged_by: "R. Vance" }
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/quotes/${q1_id}/issue"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_issued_at: "$.data.issued_at_utc", q1_valid_through: "$.data.valid_through_utc"}
            - call: "POST /fence-rentals/contracts"
