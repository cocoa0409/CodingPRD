            - "FreightLoad.${fl_a_id}.linehaul_cost_cents == 259834 (198000 + round(20611.2 x 3)); the CUBE shares are 86611 each with residual +1 absorbed by freight_sequence 1, so A1 carries 86612 and A2 and A3 carry 86611"
            - "86612 + 86611 + 86611 == 259834 - the residual keeps the allocation invariant exact"
            - "Dealer.${dlr_a_id}.staged_kit_count == 1 after the successful dispatch - L_A left the PLANNED set while L_R is still in it"
            - "an exclusive (>) reading of MIN_CUBE_UTILIZATION_PCT would reject the 75.00 load, and a reading that compares the unrounded ratio would also reject it; both are falsified by the DISPATCHED status"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: freight_load_dispatch_blocked_until_every_attached_dealer_order_is_deposit_paid
        grounds:
          - validations[priority=35]
          - state_machines.FreightLoad.PLANNED_to_DISPATCHED
          - state_machines.DealerOrder.financial_status_AWAITING_DEPOSIT_to_DEPOSIT_PAID
          - errors.ERR_DEPOSIT_REQUIRED
        distinguishing_aspect: |
          Entity pair (FreightLoad, DealerOrder): a FreightLoad transition is gated on the
          financial_status of every DealerOrder attached to it, and the gate is universally
          quantified - one unpaid order out of two blocks the whole trailer. Nothing about the load
          itself changes between the rejected and the accepted dispatch; the only state that moves is
          on the other entity, and it moves through an endpoint that never mentions the load.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha (credit limit 900000000, 2 staging slots)."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) at UNDER_REVIEW via one PASS ASD analysis plus submit-review."
            - "DealerOrders O1 and O2, both on D1 (NONE / GRAVITY): kit_weight_kg 6410.4, kit_cube_m3 18.45, required_deposit_cents 499933, credit_hold_cents 1999734 each."
            - "Both orders confirmed to production_status QUEUED, so priority 7 on the production dimension is satisfied."
