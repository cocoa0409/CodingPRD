# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task 1364)
# 9 Difficulty Rules, 26 non-stub instances. Every chain replays from empty DB
# using only SCAFFOLD.yaml §1.5 endpoints.
# Reusable baseline (repeated per instance): program -> year -> activate ->
# complement -> submit -> approve -> resident -> activate.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: duty hours vs fiscal)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: duty_hours_official_vs_projected_divergence
        grounds:
          - calculations.official_weekly_duty_hours
          - calculations.moonlighting_headroom_check
          - validations[priority=7]
          - errors[ERR_PROJECTED_HOURS_EXCEED_80]
        distinguishing_aspect: |
          Duty-hour domain variant split: the OFFICIAL variant (ATTESTED logs
          only) stays at exactly 80.00h and produces zero violations, while the
          PROJECTED variant (includes the SUBMITTED unattested log) reads 80.75h
          and defeats a 1.00 h/wk moonlighting approval — identical data, two
          variants, different observable outcomes. Sits in the duty-hour/wellness
          domain, unlike the fiscal-domain complement fill variants.
        test_recipe:
          setup:
            - "Program with ACTIVE year 2026-07-01..2027-06-30 and APPROVED complement (4 positions, ample budget)"
            - "Resident R ACTIVE with 16 ATTESTED 20.00h logs spread 4 per ISO week over 2026-08-03..2026-08-28 (total 320.00h, rolling avg exactly 80.00, all rest gaps >= 12h)"
            - "One additional SUBMITTED (unattested) 3.00h log on 2026-08-29"
            - "Logical clock at 2026-08-28T12:00:00Z (rolling window = weeks of Aug 3..Aug 30)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM Residency", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0001" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-28T12:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T00:00:00Z", ended_at: "2026-08-03T20:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l01: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l01}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-04T08:00:00Z", ended_at: "2026-08-05T04:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l02: "$.data.id" } }
