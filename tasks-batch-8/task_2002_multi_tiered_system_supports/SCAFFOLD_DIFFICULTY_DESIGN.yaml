              as: TeamLead
              captures: { mv1_status: $.data.status }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements/${mv2_id}"
              payload: {}
              as: TeamLead
              captures: { mv2_status: $.data.status }
          assert:
            - "TierMovement.${mv1_id}.status == 'SUPERSEDED'"
            - "TierMovement.${mv2_id}.status == 'PROPOSED'"
            - "Count of PROPOSED movements for student G remains 1 (conserved across the propose+supersede pair)"
            - "Conserved quantity (PROPOSED count) is different from interventionist minutes (separate invariant domain)"
