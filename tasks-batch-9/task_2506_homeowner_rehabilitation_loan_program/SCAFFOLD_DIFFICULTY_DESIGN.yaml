  - rule_id: boundary_precision_check
    instances:
      - name: xrf_reading_of_exactly_one_milligram_per_square_centimeter_is_a_lead_hazard
        grounds:
          - entities.PropertyInspection.fields.xrf_reading_mg_cm2
          - entities.PropertyInspection.fields.lead_hazard_present
          - entities.RehabApplication.fields.lead_hazard_detected
          - state_machines.PropertyInspection.SCHEDULED_to_COMPLETED
          - state_machines.RehabApplication.OWNERSHIP_VERIFIED_to_INSPECTED
        distinguishing_aspect: |
          The metric under test is the XRF lead reading in mg/cm2 at its inclusive 1.00 threshold, on
          the POST /rehab/inspections/{inspection_id}/record-result endpoint: 0.99 must leave
          lead_hazard_present false while exactly 1.00 must set it true. Two decimal places matter,
          and the endpoint differs from the income-boundary instance below.
        test_recipe:
          setup:
            - "two RehabApplication rows, both built 1995 outside a historic district and both ownership-verified, so lead_review_required is false and the flag under test is purely the recorded reading"
            - "each application has one SCHEDULED INITIAL_STANDARDS inspection assigned to insp-1"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 2, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "31 Bellow St", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 15000000, senior_lien_balance_cents: 12000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_lo_id: $.data.id }
            - call: "POST /rehab/applications/${app_lo_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "33 Bellow St", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 15000000, senior_lien_balance_cents: 12000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_hi_id: $.data.id }
            - call: "POST /rehab/applications/${app_hi_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_lo_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_lo_id: $.data.id }
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_hi_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-04T13:00:00Z", scheduled_end_at: "2026-08-04T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_hi_id: $.data.id }
          trigger:
            - call: "POST /rehab/inspections/${insp_lo_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 2, xrf_reading_mg_cm2: 0.99 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /rehab/inspections/${insp_hi_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 2, xrf_reading_mg_cm2: 1.00 }
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "PropertyInspection.${insp_lo_id}.xrf_reading_mg_cm2 == 0.99 and lead_hazard_present == false"
            - "RehabApplication.${app_lo_id}.lead_hazard_detected == false"
            - "PropertyInspection.${insp_hi_id}.xrf_reading_mg_cm2 == 1.00 and lead_hazard_present == true"
            - "RehabApplication.${app_hi_id}.lead_hazard_detected == true"
            - "both inspections end in status COMPLETED and both applications reach workflow_state INSPECTED"
            - "RehabApplication.${app_lo_id}.compliance_posture == CLEAR and RehabApplication.${app_hi_id}.compliance_posture == CLEAR (the 1995 build year keeps lead_review_required false, so the flag is recorded without gating)"

      - name: ami_percent_of_exactly_eighty_point_zero_is_still_income_eligible
        grounds:
          - calculations.applicant_annual_income_and_category
          - entities.Applicant.fields.ami_percent
          - entities.Applicant.fields.income_category
          - entities.Applicant.fields.eligibility_status
          - endpoints.POST_/rehab/applicants/{applicant_id}/verify-income
        distinguishing_aspect: |
          A different metric on a different endpoint: ami_percent, rounded to one decimal place, at
          its inclusive 80.0 LOW/OVER_INCOME edge on POST /rehab/applicants/{applicant_id}/verify-income.
          A wage of 7,180,000 plus 20,000 of imputed asset income lands on exactly 80.0 and stays
          eligible, while 7,185,000 produces 80.1 (raw 80.0555 rounded up) and is ineligible — a
          5,000-cent input difference that flips the program decision.
        test_recipe:
          setup:
            - "ProgramYear 2026 with ami_median_income_cents 9,000,000, so a household of 4 has income_limit_cents 9,000,000 and the 80 percent line sits at ami_percent 80.0"
            - "two PART_5_ANNUAL applicants, household_size 4, dependents_count 0, elderly_household false, household_assets_cents 5,000,000 (imputed asset income 20,000 at the 0.004 passbook rate), actual_asset_income_cents 0, benefit_income_cents 0"
            - "the only difference is wage_income_cents: 7,180,000 versus 7,185,000"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Edge Case On", email: "on@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7180000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 0, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { at_edge_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Edge Case Over", email: "over@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7185000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 0, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { over_edge_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants/${at_edge_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applicants/${over_edge_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
          assert:
            - "Applicant.${at_edge_id}.annual_income_cents == 7200000"
            - "Applicant.${at_edge_id}.ami_percent == 80.0"
            - "Applicant.${at_edge_id}.income_category == LOW"
            - "Applicant.${at_edge_id}.eligibility_status == INCOME_VERIFIED"
            - "Applicant.${over_edge_id}.annual_income_cents == 7205000"
            - "Applicant.${over_edge_id}.ami_percent == 80.1"
            - "Applicant.${over_edge_id}.income_category == OVER_INCOME"
            - "Applicant.${over_edge_id}.eligibility_status == INELIGIBLE"
            - "both rows have income_limit_cents == 9000000 and imputed asset income of 20000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: lien_recording_is_gated_by_the_applications_compliance_posture
        grounds:
          - validations.priority_11.ERR_LEAD_CLEARANCE_REQUIRED
          - validations.priority_12.ERR_HISTORIC_CLEARANCE_REQUIRED
          - state_machines.RehabLoan.STRUCTURED_to_LIEN_RECORDED
          - state_machines.RehabApplication.compliance_posture.DUAL_HOLD_to_HISTORIC_HOLD
          - state_machines.RehabApplication.compliance_posture.HISTORIC_HOLD_to_CLEARED_WITH_PROTOCOL
          - entities.RehabApplication.fields.compliance_posture
        distinguishing_aspect: |
          The dependent entity pair is (RehabLoan <- RehabApplication.compliance_posture): a loan
          that is itself perfectly valid in STRUCTURED cannot record its lien while the *other*
          entity sits in DUAL_HOLD, and the two holds must be discharged in priority order — the
          first attempt answers ERR_LEAD_CLEARANCE_REQUIRED, the identical second attempt after the
          lead clearance answers ERR_HISTORIC_CLEARANCE_REQUIRED, and only the third attempt (after
          both axes clear) records the lien.
        test_recipe:
          setup:
            - "one RehabApplication built 1962 in a historic district: lead_review_required true, historic_review_required true, compliance_posture DUAL_HOLD"
            - "the write-up carries the three-line DUAL fixture (1,234,567 lead-safe HEALTH_SAFETY, 987,654 historic CODE, 500,001 GENERAL_PROPERTY_IMPROVEMENT), so total_estimate_cents is 3,328,518"
            - "contractor c1 is APPROVED, lead_safe_certified and historic_qualified; its 3,200,000 bid is inside the responsive window 2,496,389 to 3,661,370 and has been awarded"
            - "a DEFERRED loan exists in STRUCTURED with approved_project_cost_cents 3,200,000, lien_recording_fee_cents 25,000 and principal_cents 3,225,000"
            - "no clearance has been recorded on either compliance axis yet"
