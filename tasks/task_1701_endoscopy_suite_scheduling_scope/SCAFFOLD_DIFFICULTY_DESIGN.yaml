# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Endoscopy Suite Scheduling & Scope Reprocessing
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: occupancy_scheduled_vs_actual_minutes
        grounds:
          - calculations.procedure_occupancy_minutes
          - entities.ProcedureBooking.fields.procedure_minutes
          - entities.ProcedureBooking.fields.actual_duration_minutes
        distinguishing_aspect: |
          Two valid algorithms over the SAME ProcedureBooking produce different durations:
          the forward-looking scheduled variant stores procedure_minutes == 40
          (base 40 + NONE add-on 0 + age add-on 0, from configuration inputs) while the
          chronological actual variant stores actual_duration_minutes == 47
          (floor((09:47 - 09:00) / 60), from recorded timestamps). This instance's entity
          domain is booking scheduling; the sibling instance is quality-metric aggregation.
        test_recipe:
          setup:
            - "Patient (dob 1990-05-05, age 36), provider DR1, type COLONO (base 40, SPLIT_DOSE, family+adr true, COLONOSCOPE), room R_STD STANDARD, scope SC1 COLONOSCOPE"
            - "Booking B1 COLONO / NONE at 2026-08-02T09:00:00Z, prep confirmed, checked in at 09:00, started 09:00 with SC1"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M1001", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr One", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-001", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:47:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${dr1}" }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 480, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${dr1}", captures: { b1_proc_min: $.data.procedure_minutes, b1_act_min: $.data.actual_duration_minutes, b1_sched_end: $.data.scheduled_end } }
          assert:
            - "ProcedureBooking.${b1}.procedure_minutes == 40 (scheduled variant)"
            - "ProcedureBooking.${b1}.actual_duration_minutes == 47 (actual variant; 47 != 40 for identical booking)"
            - "ProcedureBooking.${b1}.scheduled_end == 2026-08-02T09:40:00Z"
            - "ProcedureBooking.${b1}.status == COMPLETED"
            - "GET /endoscopy/scopes/${sc1}.status == AWAITING_REPROCESS"

      - name: adr_screening_strict_vs_expanded_denominators
        grounds:
          - calculations.adenoma_detection_rate
          - calculations.withdrawal_time_average
          - calculations.cecal_intubation_and_prep_rates
          - entities.QualityMetricReport.fields.metric_variant
        distinguishing_aspect: |
          Identical underlying data, two denominator algorithms on the quality-metric domain:
          STRICT (screening + age>=45 + cecal intubation + adequate prep) yields 1/3 == 33.3;
          EXPANDED (all completed adr_relevant colonoscopies) yields 3/6 == 50.0. Different
          entity domain from the booking-occupancy sibling instance.
        test_recipe:
          setup:
            - "Patients: P_MID (1976-03-10, age 50), P_SR (1966-05-20, age 60), P_YOUNG (1990-05-05, age 36); provider DRQ; COLONO type; STANDARD room RQ; colonoscopes QSC1..QSC7"
            - "Seven bookings on 2026-08-03 (starts 08:00/08:55/09:50/10:45/11:40/12:35/13:30), all NONE anesthesia:"
            - "B1 SCREENING P_MID: prep adequate (2,2,2), completed cecum=true withdrawal=540 adenomas=2"
            - "B2 SCREENING P_SR: prep adequate (3,3,3), completed cecum=true withdrawal=480 adenomas=0, no specimen"
            - "B3 SCREENING P_YOUNG: prep INADEQUATE (2,2,1 sum 5), completed anyway cecum=true withdrawal=500 adenomas=1"
            - "B4 DIAGNOSTIC P_YOUNG: prep adequate, completed cecum=true withdrawal=420 adenomas=1"
            - "B5 SCREENING P_YOUNG: prep INADEQUATE (3,3,0 sum 6 but segment 0), aborted"
            - "B6 SCREENING P_YOUNG: prep adequate, completed cecum=false withdrawal=300 adenomas=0"
            - "B7 SCREENING P_MID: prep adequate, POLYP specimen collected, completed cecum=true withdrawal=600 adenomas=0"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M2001", full_name: "Pat Mid", date_of_birth: "1976-03-10" }, as: SchedulingCoordinator, captures: { p_mid: $.data.id } }
            - { call: "POST /endoscopy/patients", payload: { mrn: "M2002", full_name: "Pat Senior", date_of_birth: "1966-05-20" }, as: SchedulingCoordinator, captures: { p_sr: $.data.id } }
            - { call: "POST /endoscopy/patients", payload: { mrn: "M2003", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p_yng: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Quality", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { drq: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RQ", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rq: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-2", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc2: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-3", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc3: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-4", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc4: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-5", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc5: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-6", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc6: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QSC-7", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qsc7: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_mid}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T08:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_sr}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T08:55:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T09:50:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b3: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T10:45:00Z", indication: "DIAGNOSTIC", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b4: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T11:40:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b5: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T12:35:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b6: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_mid}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T13:30:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b7: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b2}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b3}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b4}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b5}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b6}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b7}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            # B1 08:00
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${qsc1}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:40:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 540, adenomas_detected: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            # B2 08:55
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:55:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b2}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b2}/start", payload: { scope_id: "${qsc2}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b2}/record-prep-assessment", payload: { bbps_left: 3, bbps_right: 3, bbps_transverse: 3 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:35:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b2}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 480, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drq}" }
            # B3 09:50 inadequate but completed
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:50:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b3}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b3}/start", payload: { scope_id: "${qsc3}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b3}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 1 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b3}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 500, adenomas_detected: 1 }, as: Endoscopist, as_user_id: "${drq}" }
            # B4 10:45 diagnostic
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:45:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b4}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b4}/start", payload: { scope_id: "${qsc4}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b4}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:25:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b4}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 420, adenomas_detected: 1 }, as: Endoscopist, as_user_id: "${drq}" }
            # B5 11:40 aborted
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:40:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b5}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b5}/start", payload: { scope_id: "${qsc5}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b5}/record-prep-assessment", payload: { bbps_left: 3, bbps_right: 3, bbps_transverse: 0 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b5}/abort", payload: { reason: "inadequate prep" }, as: Endoscopist, as_user_id: "${drq}" }
            # B6 12:35 no cecal intubation
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:35:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b6}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b6}/start", payload: { scope_id: "${qsc6}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b6}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:15:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b6}/complete", payload: { cecum_intubated: false, withdrawal_time_seconds: 300, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drq}" }
            # B7 13:30 with specimen
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b7}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b7}/start", payload: { scope_id: "${qsc7}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/specimens", payload: { booking_id: "${b7}", specimen_type: "POLYP", container_count: 1 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b7}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:10:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b7}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 600, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drq}" }
          trigger:
            - { call: "POST /endoscopy/quality-reports", payload: { provider_id: "${drq}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-03T23:59:59Z", metric_variant: "STRICT" }, as: QualityOfficer, captures: { rep_strict: $.data.id, strict_adr: $.data.adenoma_detection_rate, strict_den: $.data.adr_denominator } }
            - { call: "POST /endoscopy/quality-reports", payload: { provider_id: "${drq}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-03T23:59:59Z", metric_variant: "EXPANDED" }, as: QualityOfficer, captures: { rep_exp: $.data.id, exp_adr: $.data.adenoma_detection_rate, exp_den: $.data.adr_denominator } }
          assert:
            - "STRICT report ${rep_strict}: adr_denominator == 3 (B1,B2,B7 only), adr_numerator == 1 (B1), adenoma_detection_rate == 33.3"
            - "EXPANDED report ${rep_exp}: adr_denominator == 6 (B1,B2,B3,B4,B6,B7), adr_numerator == 3 (B1,B3,B4), adenoma_detection_rate == 50.0"
            - "33.3 != 50.0 for identical underlying procedure data (variant divergence)"
            - "Both reports: withdrawal_time_avg_seconds == 480.0 and withdrawal_sample_size == 1 (B2 only: B1/B3/B4 excluded by adenomas >= 1, B6 by cecum_intubated false, B7 by specimen present, B5 not COMPLETED)"
            - "Both reports: cecal_intubation_rate == 83.3 (5 of 6 completed colonoscopy-family), prep_adequacy_rate == 71.4 (5 of 7 assessed)"

  - rule_id: combinatorial_formula
    instances:
      - name: scheduled_window_multi_input_formula_mode_a
        grounds:
          - calculations.procedure_occupancy_minutes
          - calculations.room_block_window
          - entities.ProcedureBooking.fields.room_block_end
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula with conditional branches: procedure_minutes
          = base 40 + anesthesia add-on (NONE 0 / MAC 10 / GENERAL 15) + age add-on (5 iff
          age_at_scheduled_start >= 65), then room_block_end = scheduled_end + turnover
          (STANDARD 15 / ERCP_CAPABLE 25). The sibling instance exercises mode (b) nested
          rounding, a different combinatorial axis.
        test_recipe:
          setup:
            - "Patients: P_OLD (dob 1961-08-02 — turns exactly 65 on 2026-08-02), P_YOUNG (dob 1990-05-05, 36)"
            - "Provider DR1; type COLONO base 40; rooms R_STD (STANDARD) and R_ERCP (ERCP_CAPABLE)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M3001", full_name: "Pat Old", date_of_birth: "1961-08-02" }, as: SchedulingCoordinator, captures: { p_old: $.data.id } }
            - { call: "POST /endoscopy/patients", payload: { mrn: "M3002", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p_yng: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr One", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r_std: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-ERCP", room_class: "ERCP_CAPABLE", supports_anesthesia: true }, as: UnitAdmin, captures: { r_ercp: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r_std}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { b1: $.data.id, b1_pm: $.data.procedure_minutes, b1_se: $.data.scheduled_end, b1_rbe: $.data.room_block_end } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r_ercp}", scheduled_start: "2026-08-02T09:00:00Z", indication: "DIAGNOSTIC", anesthesia_type: "GENERAL" }, as: SchedulingCoordinator, captures: { b2: $.data.id, b2_pm: $.data.procedure_minutes, b2_se: $.data.scheduled_end, b2_rbe: $.data.room_block_end } }
          assert:
            - "B1 ${b1}: procedure_minutes == 55 (40 + MAC 10 + age 5 — 65th birthday on procedure date counts), scheduled_end == 2026-08-02T09:55:00Z, room_block_end == 2026-08-02T10:10:00Z (STANDARD turnover 15)"
            - "B2 ${b2}: procedure_minutes == 55 (40 + GENERAL 15 + age 0), scheduled_end == 2026-08-02T09:55:00Z, room_block_end == 2026-08-02T10:20:00Z (ERCP_CAPABLE turnover 25)"
            - "B1 and B2 have equal procedure_minutes but different room_block_end — branch on room class is observable"

      - name: unit_utilization_round_per_room_then_average_mode_b
        grounds:
          - calculations.room_utilization_report
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the pinned order rounds each room's
          percentage to 1 decimal FIRST (41.7 and 24.0), then averages and rounds again
          (32.9). The alternative sum-then-round algorithm yields 32.8 for the same minutes
          (200 and 115 of 480 per room) and is non-conformant. Different mode from the
          multi-input sibling instance.
        test_recipe:
          setup:
