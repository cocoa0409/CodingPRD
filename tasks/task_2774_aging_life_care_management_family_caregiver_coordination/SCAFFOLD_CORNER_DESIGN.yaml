            - "A decision recorded as decided_by_contact_id == ${fc_nils} returns HTTP 422 with data.error_id == \"ERR_SURROGATE_AUTHORITY_MISSING\" — the contact exists and belongs to the client, so neither 404 nor priority 62 applies"
