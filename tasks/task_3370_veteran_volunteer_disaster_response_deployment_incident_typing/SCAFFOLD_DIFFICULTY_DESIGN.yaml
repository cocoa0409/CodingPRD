  - rule_id: compensating_invariant
    instances:
      - name: fob_bunk_occupancy_compensation
        grounds:
          - calculations.fob_occupancy
          - entities.FobSite.fields.bunks_occupied
          - state_machines.Deployment.ACCEPTED_to_ON_SITE
        distinguishing_aspect: |
          Conserved quantity = FOB bunk count: check-in (forward) then demobe
          (compensating) must leave bunks_occupied == count(Deployments with
          fob_site_id == fob.id and status IN {ON_SITE, SAFETY_HOLD}); the
          invariant is asserted at 0 -> 1 -> 0 with zero drift.
        test_recipe:
          setup:
            - "Operation OPEN (caps [CHAINSAW]); FOB Alpha bunks_total=2, nightly_rate_cents=1000; d1 (needs_lodging=true) ACCEPTED"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Helena Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/fob-sites"
              payload: { name: "FOB Alpha", bunks_total: 2, nightly_rate_cents: 1000 }
              as: OperationsLead
              captures: { fob1: $.data.id }
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: true }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T09:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: DEMOBED }
              as: OperationsLead
          assert:
            - "After check-in: FobSite.${fob1}.bunks_occupied == 1 and Deployment.${d1}.fob_site_id == ${fob1}"
            - "After demobe: FobSite.${fob1}.bunks_occupied == 0 (invariant restored)"
            - "FobSite.${fob1}.bunks_occupied == count(Deployments with fob_site_id == ${fob1} and status IN {ON_SITE, SAFETY_HOLD}) at every step"

      - name: course_seat_compensation
        grounds:
          - entities.TrainingCourse.fields.seats_taken
          - state_machines.TrainingEnrollment.ENROLLED_to_DROPPED
          - state_machines.TrainingEnrollment.WAITLISTED_to_ENROLLED
        distinguishing_aspect: |
          Conserved quantity = course seats (different quantity than FOB bunks):
          enroll (forward) then drop (compensating) restores seats_taken, and the
          ops-run promotion re-consumes the freed seat for the WAITLISTED
          enrollment in created_at ASC order; seats_taken == count(ENROLLED
          enrollments) holds at every step.
        test_recipe:
          setup:
            - "Instructor-certified volunteer instr; course capacity 2; volunteers v1, v2, v3 enrolled in that order (e1, e2 ENROLLED; e3 WAITLISTED)"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Inez Struct", email: "inez@x.org", home_region: "TX-GULF", skills: [CHAINSAW], instructor_certified: true }
              as: SystemAdmin
              captures: { instr: $.data.id }
            - call: "POST /vdr/training-courses"
              payload: { title: "Chainsaw Ops 101", grants_cert_kind: CHAINSAW, capacity: 2, starts_at: "2026-09-20T09:00:00Z", lead_instructor_volunteer_id: "${instr}" }
              as: TrainingDirector
              captures: { course: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol One", email: "e1@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol Two", email: "e2@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v2: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol Three", email: "e3@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v3: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v1}" }
              as: TrainingDirector
              captures: { e1: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v2}" }
              as: TrainingDirector
              captures: { e2: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v3}" }
              as: TrainingDirector
              captures: { e3: $.data.id }
          trigger:
            - call: "PATCH /vdr/training-enrollments/${e1}"
              payload: { status: DROPPED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
          assert:
            - "After drop: TrainingCourse.${course}.seats_taken == 1 (compensation)"
            - "After ops run: TrainingCourse.${course}.seats_taken == 2 (seat re-consumed by promotion)"
            - "TrainingEnrollment.${e3}.status == ENROLLED and waitlist_position == null"
            - "TrainingEnrollment.${e1}.status == DROPPED"
            - "seats_taken == count(enrollments with status == ENROLLED) at every step"
