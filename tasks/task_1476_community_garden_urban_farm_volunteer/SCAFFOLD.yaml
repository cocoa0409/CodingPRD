# =============================================================================
# Task 1476 — Community Garden & Urban Farm Volunteer Program
# Seed tables (§1.0–§1.7). Difficulty target: harder-than-expert.
# =============================================================================

scenario: |
  Community Garden & Urban Farm Volunteer Program (community garden association): volunteer registration & orientation/waiver, shift signup by task & season, harvest logging & donation distribution split, tool inventory & shed access, crop planning & bed assignment coordination, water use & irrigation scheduling, youth/group volunteer supervision ratio, produce safety handling training

domain_name: community-garden-volunteer
api_prefix: /api

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology, FK-linked)
# =============================================================================
entities:
  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all volunteers", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives is_minor" }
      - { name: is_minor, type: boolean, source: computed, description: "true when age at current logical clock < 18 (18th birthday flips to false)" }
      - { name: orientation_status, type: enum, source: system, description: "PENDING | ORIENTED", default: "PENDING" }
      - { name: waiver_status, type: enum, source: system, description: "UNSIGNED | SIGNED | EXPIRED", default: "UNSIGNED" }
      - { name: waiver_signed_at, type: datetime, source: system, description: "Set on waiver sign; null while UNSIGNED", default: null }
      - { name: standing, type: enum, source: system, description: "GOOD | PROBATION | SUSPENDED", default: "GOOD" }
      - { name: can_supervise, type: boolean, source: computed, description: "true iff volunteer holds a TrainingCertification with cert_type=SUPERVISION and status=ACTIVE" }
      - { name: produce_safety_certified, type: boolean, source: computed, description: "true iff volunteer holds a TrainingCertification with cert_type=PRODUCE_SAFETY and status=ACTIVE" }
      - { name: tool_safety_certified, type: boolean, source: computed, description: "true iff volunteer holds a TrainingCertification with cert_type=TOOL_SAFETY and status=ACTIVE" }
      - { name: total_service_minutes, type: integer, source: computed, description: "Sum of credited_minutes over own ShiftSignups in CHECKED_IN (provisional) or COMPLETED (final)" }
      - { name: no_show_count, type: integer, source: computed, description: "Count of own ShiftSignups in NO_SHOW" }
      - { name: held_key_count, type: integer, source: computed, description: "Count of ShedKeys with current_holder_volunteer_id = this volunteer and status in {CHECKED_OUT, OVERDUE}" }

  - name: TrainingCertification
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; subject of the certification" }
      - { name: cert_type, type: enum, source: input, description: "PRODUCE_SAFETY | SUPERVISION | TOOL_SAFETY" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; must be strictly after issuance clock time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: "ACTIVE" }
      - { name: revoked_reason, type: string, source: input, description: "Required on revoke; null otherwise", default: null }

  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season name (e.g. '2026 Summer')" }
      - { name: signup_opens_at, type: datetime, source: input, description: "Enrollment window open (informational gate for slot creation)" }
      - { name: signup_closes_at, type: datetime, source: input, description: "Enrollment window close; must be strictly after signup_opens_at" }
      - { name: season_starts_at, type: datetime, source: input, description: "First day shifts/beds may operate" }
      - { name: season_ends_at, type: datetime, source: input, description: "Last day; must be strictly after season_starts_at" }
      - { name: water_budget_gallons, type: integer, source: input, description: "Total irrigation water budget; > 0" }
      - { name: water_committed_gallons, type: integer, source: computed, description: "Sum of planned_gallons over IrrigationSchedules in {SCHEDULED, DUE, MISSED}" }
      - { name: water_actual_gallons, type: integer, source: computed, description: "Sum of gallons_actual over IrrigationSchedules in {LOGGED, RECONCILED}" }
      - { name: water_remaining_gallons, type: integer, source: computed, description: "water_budget_gallons - water_committed_gallons - water_actual_gallons" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN_ENROLLMENT | PLANTING | GROWING | HARVESTING | RECONCILIATION | CLOSED | CANCELLED", default: "DRAFT" }

  - name: GardenBed
    parent: null
    common_fields: true
    fields:
      - { name: bed_code, type: string, source: input, description: "Unique bed label; unique across all beds", constraints: "unique" }
      - { name: size_sq_ft, type: integer, source: input, description: "Plantable area; > 0" }
      - { name: sun_exposure, type: enum, source: input, description: "FULL | PARTIAL | SHADE" }
      - { name: irrigation_zone, type: string, source: input, description: "Zone label used for irrigation overlap checks" }
      - { name: soil_ph, type: number, source: input, description: "Soil pH", default: null }
      - { name: allocated_sq_ft, type: integer, source: computed, description: "Sum of requested_sq_ft over CropPlans on this bed in {APPROVED, PLANTED, HARVESTING}" }
      - { name: last_plant_family, type: string, source: computed, description: "plant_family of the most recent CropPlan on this bed to reach COMPLETE; null if none", default: null }
      - { name: last_harvest_closed_at, type: datetime, source: system, description: "Clock time when bed entered POST_HARVEST; null until first harvest close", default: null }
      - { name: status, type: enum, source: system, description: "FALLOW | RESERVED | PLANTED | GROWING | HARVEST_OPEN | POST_HARVEST | OUT_OF_SERVICE", default: "FALLOW" }

  - name: CropPlan
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: bed_id, type: string, source: input, description: "FK -> GardenBed.id" }
      - { name: proposer_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; proposing volunteer" }
      - { name: crop_type, type: string, source: input, description: "Crop name (e.g. 'Roma Tomato')" }
      - { name: plant_family, type: string, source: input, description: "Botanical family for rotation checks" }
      - { name: requested_sq_ft, type: integer, source: input, description: "Area requested on the bed; > 0" }
      - { name: planned_start_date, type: string, source: input, description: "ISO date occupancy begins" }
      - { name: planned_end_date, type: string, source: input, description: "ISO date occupancy ends; must be strictly after planned_start_date" }
      - { name: expected_yield_grams, type: integer, source: input, description: "Planning estimate; >= 0", default: 0 }
      - { name: rejection_reason, type: string, source: system, description: "Set on reject; cleared on resubmit", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | PLANTED | HARVESTING | COMPLETE | WITHDRAWN", default: "PROPOSED" }

  - name: ShiftSlot
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: task_type, type: enum, source: input, description: "PLANTING | WEEDING | HARVEST | IRRIGATION | COMPOST | REPAIR | OUTREACH" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start; must be within [season_starts_at, season_ends_at] of its season" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end; strictly after starts_at" }
      - { name: capacity_total, type: integer, source: input, description: "Max occupied spots (adults + youth); > 0" }
      - { name: capacity_youth, type: integer, source: input, description: "Max youth spots within capacity_total; >= 0 and <= capacity_total" }
      - { name: requires_produce_safety, type: boolean, source: input, description: "true requires volunteers to hold ACTIVE PRODUCE_SAFETY cert to sign up", default: false }
      - { name: required_tool_id, type: string, source: input, description: "FK -> ToolItem.id; tool reserved per confirmed signup; null if none", default: null }
      - { name: required_tool_qty, type: integer, source: input, description: "Units of required_tool_id needed per confirmed signup; 0 when no tool", default: 0 }
      - { name: confirmed_count, type: integer, source: computed, description: "Occupancy: sum over signups in {CONFIRMED, CHECKED_IN} (x1) + group bookings in {CONFIRMED, CHECKED_IN} (x member_count)" }
      - { name: confirmed_youth_count, type: integer, source: computed, description: "Youth occupancy: signups in {CONFIRMED, CHECKED_IN} with is_youth + bookings in {CONFIRMED, CHECKED_IN} x minor_count" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of ShiftSignups in WAITLISTED" }
      - { name: next_waitlist_position, type: integer, source: system, description: "Monotonic per-slot counter starting at 1; assigned on WAITLISTED entry", default: 1 }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | FULL | LOCKED | COMPLETED | CANCELLED", default: "DRAFT" }

  - name: ShiftSignup
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> ShiftSlot.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must equal X-User-ID when caller role is Volunteer or GroupLeader" }
      - { name: supervision_adult_signup_id, type: string, source: input, description: "FK -> ShiftSignup.id; self-referential; required when the volunteer is a minor", default: null }
      - { name: is_youth, type: boolean, source: computed, description: "Snapshot of volunteer.is_minor at signup creation" }
      - { name: waitlist_position, type: integer, source: system, description: "Per-slot FIFO position assigned on entering WAITLISTED; null otherwise", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Clock time of check-in; null until checked in", default: null }
      - { name: checked_out_at, type: datetime, source: system, description: "Clock time of check-out; null until checked out", default: null }
      - { name: credited_minutes, type: integer, source: computed, description: "Provisional at CHECKED_IN = slot scheduled minutes; final at COMPLETED = min(actual elapsed, scheduled + 30); 0 otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | WAITLISTED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: "REQUESTED" }

  - name: GroupBooking
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> ShiftSlot.id" }
      - { name: leader_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must equal X-User-ID when caller role is GroupLeader" }
      - { name: organization_name, type: string, source: input, description: "School/club/org name" }
      - { name: member_count, type: integer, source: input, description: "Total attendees incl. chaperones; > 0" }
      - { name: minor_count, type: integer, source: input, description: "Attendees under 18; >= 0 and <= member_count" }
      - { name: chaperone_count, type: integer, source: input, description: "Declared adult chaperones; >= 0" }
      - { name: chaperone_volunteer_ids, type: array, source: input, description: "Volunteer ids of chaperones; each must hold ACTIVE SUPERVISION cert at create and confirm" }
      - { name: required_chaperones, type: integer, source: computed, description: "ceil(minor_count / 8)" }
      - { name: rejection_reason, type: string, source: system, description: "Set on reject; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | REJECTED", default: "REQUESTED" }

  - name: ShedKey
    parent: null
    common_fields: true
    fields:
      - { name: key_code, type: string, source: input, description: "Physical key label; unique", constraints: "unique" }
      - { name: current_holder_volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; set on checkout, cleared on return/lost; null while AVAILABLE", default: null }
      - { name: due_back_at, type: datetime, source: system, description: "Return deadline set at checkout from request input", default: null }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | OVERDUE | LOST | RETIRED", default: "AVAILABLE" }

  - name: ToolItem
    parent: null
    common_fields: true
    fields:
      - { name: tool_name, type: string, source: input, description: "Tool name" }
      - { name: category, type: enum, source: input, description: "HAND | POWER | IRRIGATION | SAFETY | OTHER" }
      - { name: total_count, type: integer, source: input, description: "Total units owned; > 0; invariant: total = available + checked_out + in_maintenance + written_off" }
      - { name: available_count, type: integer, source: computed, description: "total_count - checked_out_count - in_maintenance_count - written_off_count" }
      - { name: checked_out_count, type: integer, source: computed, description: "Sum of (qty - qty_returned) over ToolCheckouts in {OPEN, PARTIAL_RETURN}" }
      - { name: in_maintenance_count, type: integer, source: computed, description: "Units damaged at return and not yet restored" }
      - { name: written_off_count, type: integer, source: system, description: "Units lost via write-off; starts 0", default: 0 }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | RETIRED", default: "IN_SERVICE" }

  - name: ToolCheckout
    parent: null
    common_fields: true
    fields:
      - { name: tool_id, type: string, source: input, description: "FK -> ToolItem.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; borrower; must equal X-User-ID when caller role is Volunteer or GroupLeader" }
      - { name: signup_id, type: string, source: input, description: "FK -> ShiftSignup.id; optional link to a shift signup of the same volunteer", default: null }
      - { name: qty, type: integer, source: input, description: "Units checked out; > 0 and <= tool available_count at creation" }
      - { name: qty_returned, type: integer, source: system, description: "Cumulative units returned; starts 0", default: 0 }
      - { name: condition_on_return, type: enum, source: input, description: "GOOD | DAMAGED; required on return transitions", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIAL_RETURN | RETURNED | CLOSED_LOSS | AUTO_CLOSED", default: "OPEN" }

  - name: HarvestLog
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: bed_id, type: string, source: input, description: "FK -> GardenBed.id" }
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; optional link to the plan harvested", default: null }
      - { name: logged_by_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; logger; must equal X-User-ID when caller role is Volunteer or GroupLeader" }
      - { name: crop_type, type: string, source: input, description: "Crop harvested" }
      - { name: weight_grams, type: integer, source: input, description: "Total harvested weight; > 0" }
      - { name: quality_grade, type: enum, source: input, description: "A | B | C" }
      - { name: harvested_at, type: datetime, source: input, description: "Harvest instant; within season window and not in the future" }
      - { name: safety_attestation, type: boolean, source: input, description: "Must be true at create and at submit (produce safety handling attestation)" }
      - { name: rejection_reason, type: string, source: system, description: "Set on reject; cleared on resubmit", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | SPLIT_FINALIZED | REJECTED | DISCARDED", default: "DRAFT" }

  - name: DonationRecipient
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Food bank / shelter name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: weekly_capacity_grams, type: integer, source: input, description: "Max grams accepted per ISO week; > 0" }
      - { name: priority_tier, type: integer, source: input, description: "1 (highest) .. 5 (lowest); informational ordering for split proposals" }
      - { name: accepts_grade_c, type: boolean, source: input, description: "Whether grade-C produce is accepted", default: true }
      - { name: active, type: boolean, source: input, description: "Inactive recipients reject new allocation lines", default: true }
      - { name: committed_this_week_grams, type: integer, source: computed, description: "Sum of line grams over DonationAllocations in {PENDING, APPROVED, DISTRIBUTED} created in the same ISO week (Mon 00:00 inclusive .. next Mon 00:00 exclusive) as current clock" }

  - name: DonationAllocation
    parent: null
    common_fields: true
    fields:
      - { name: harvest_log_id, type: string, source: input, description: "FK -> HarvestLog.id; log must be VERIFIED" }
      - { name: volunteer_share_grams, type: integer, source: computed, description: "floor(weight_grams * 0.20) computed from the harvest log" }
      - { name: donatable_grams, type: integer, source: computed, description: "weight_grams - volunteer_share_grams" }
      - { name: lines, type: array, source: input, description: "[{recipient_id (FK -> DonationRecipient.id), grams (integer > 0)}]; grams must sum exactly to donatable_grams" }
      - { name: rejection_reason, type: string, source: system, description: "Set on reject; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | DISTRIBUTED", default: "PENDING" }

  - name: IrrigationSchedule
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: zone, type: string, source: input, description: "Irrigation zone label; overlap-checked per zone" }
      - { name: planned_start_at, type: datetime, source: input, description: "Window start; within season window" }
      - { name: planned_end_at, type: datetime, source: input, description: "Window end; strictly after planned_start_at" }
      - { name: planned_gallons, type: integer, source: input, description: "Planned water; > 0; gated by season water budget" }
      - { name: gallons_actual, type: integer, source: system, description: "Meter reading entered at log-meter; null until logged", default: null }
      - { name: variance_flag, type: boolean, source: computed, description: "true iff gallons_actual > floor(planned_gallons * 1.10); null-equivalent false until logged", default: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | MISSED | LOGGED | RECONCILED | CANCELLED", default: "SCHEDULED" }

# =============================================================================
# §1.2 State Machine Table (13 machines)
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: "PENDING orientation / UNSIGNED waiver / GOOD standing (three parallel dimensions)"
    terminal_states: []
    transitions:
      - from: "orientation_status = PENDING"
        to: "orientation_status = ORIENTED"
        trigger: "POST /api/volunteers/{id}/orientation/complete"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "orientation_status == PENDING (ERR_INVALID_VOLUNTEER_STATE)"
        side_effects: ["increments Volunteer.version by 1"]
      - from: "waiver_status = UNSIGNED"
        to: "waiver_status = SIGNED"
        trigger: "POST /api/volunteers/{id}/waiver/sign"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | FoodSafetyOfficer"
        preconditions:
          - "waiver_status in {UNSIGNED, EXPIRED} (ERR_INVALID_VOLUNTEER_STATE)"
          - "ownership: caller role Volunteer/GroupLeader/FoodSafetyOfficer may only sign own record (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["waiver_signed_at = now", "increments Volunteer.version by 1"]
      - from: "waiver_status = EXPIRED"
        to: "waiver_status = SIGNED"
        trigger: "POST /api/volunteers/{id}/waiver/sign (renewal, same endpoint)"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | FoodSafetyOfficer"
        preconditions: ["same as UNSIGNED -> SIGNED"]
        side_effects: ["waiver_signed_at = now", "increments Volunteer.version by 1"]
      - from: "waiver_status = SIGNED"
        to: "waiver_status = EXPIRED"
        trigger: "system (POST /api/_scheduler/run_epoch when now > waiver_signed_at + 365 days)"
        actor: system
        preconditions: []
        side_effects: ["increments Volunteer.version by 1"]
      - from: "standing = GOOD"
        to: "standing = PROBATION"
        trigger: "system (automatic when no_show_count becomes >= 3) | POST /api/volunteers/{id}/standing {to_state: PROBATION}"
        actor: "system | GardenAdmin"
        preconditions: ["manual: standing == GOOD (ERR_INVALID_VOLUNTEER_STATE)"]
        side_effects: ["increments Volunteer.version by 1"]
      - from: "standing = GOOD"
        to: "standing = SUSPENDED"
        trigger: "POST /api/volunteers/{id}/standing {to_state: SUSPENDED}"
        actor: GardenAdmin
        preconditions: ["standing in {GOOD, PROBATION} (ERR_INVALID_VOLUNTEER_STATE)"]
        side_effects:
          - "CASCADE link 1: all own ShiftSignups in REQUESTED or CONFIRMED -> CANCELLED"
          - "CASCADE link 2 (per cancelled CONFIRMED signup): freed spot triggers waitlist_promotion_select on that slot (earliest WAITLISTED fitting pools -> CONFIRMED); slot FULL -> OPEN -> (FULL if promoted)"
          - "increments Volunteer.version by 1"
      - from: "standing = PROBATION"
        to: "standing = SUSPENDED"
        trigger: "POST /api/volunteers/{id}/standing {to_state: SUSPENDED}"
        actor: GardenAdmin
        preconditions: ["standing in {GOOD, PROBATION}"]
        side_effects: ["same cascade as GOOD -> SUSPENDED"]
      - from: "standing = PROBATION"
        to: "standing = GOOD"
        trigger: "POST /api/volunteers/{id}/standing {to_state: GOOD}"
        actor: GardenAdmin
        preconditions: ["standing == PROBATION (ERR_INVALID_VOLUNTEER_STATE)"]
        side_effects: ["increments Volunteer.version by 1"]
      - from: "standing = SUSPENDED"
        to: "standing = GOOD"
        trigger: "POST /api/volunteers/{id}/standing {to_state: GOOD}"
        actor: GardenAdmin
        preconditions: ["standing == SUSPENDED (ERR_INVALID_VOLUNTEER_STATE)"]
        side_effects: ["increments Volunteer.version by 1"]

  - entity: TrainingCertification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /api/_scheduler/run_epoch when now >= expires_at)"
        actor: system
        preconditions: []
        side_effects: ["recompute subject Volunteer.can_supervise / produce_safety_certified / tool_safety_certified", "increments TrainingCertification.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/certifications/{id}/revoke"
        actor: "GardenAdmin | FoodSafetyOfficer"
        preconditions:
          - "status == ACTIVE (ERR_INVALID_CERTIFICATION_STATE)"
          - "revoked_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "recompute subject Volunteer derived cert flags"
          - "CASCADE: if cert_type == PRODUCE_SAFETY, subject's HarvestLogs in SUBMITTED -> DRAFT (re-verification required)"
          - "increments TrainingCertification.version by 1"

  - entity: Season
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN_ENROLLMENT
        trigger: "POST /api/seasons/{id}/transition {to_state: OPEN_ENROLLMENT}"
        actor: GardenAdmin
        preconditions:
          - "status == DRAFT (ERR_INVALID_SEASON_STATE)"
          - "at least one GardenBed exists with status != OUT_OF_SERVICE (ERR_SEASON_GUARD_ACTIVE_BED_REQUIRED)"
        side_effects: ["increments Season.version by 1"]
      - from: OPEN_ENROLLMENT
        to: DRAFT
        trigger: "POST /api/seasons/{id}/transition {to_state: DRAFT}"
        actor: GardenAdmin
        preconditions:
          - "status == OPEN_ENROLLMENT (ERR_INVALID_SEASON_STATE)"
          - "zero ShiftSlots, zero CropPlans, zero IrrigationSchedules reference this season (ERR_SEASON_REVERT_BLOCKED)"
        side_effects: ["increments Season.version by 1"]
      - from: OPEN_ENROLLMENT
        to: PLANTING
        trigger: "POST /api/seasons/{id}/transition {to_state: PLANTING}"
        actor: GardenAdmin
        preconditions:
          - "status == OPEN_ENROLLMENT (ERR_INVALID_SEASON_STATE)"
          - "at least one CropPlan for this season in {APPROVED, PLANTED} (ERR_CROP_PLANS_UNRESOLVED)"
        side_effects: ["increments Season.version by 1"]
      - from: PLANTING
        to: GROWING
        trigger: "POST /api/seasons/{id}/transition {to_state: GROWING}"
        actor: GardenAdmin
        preconditions:
          - "status == PLANTING (ERR_INVALID_SEASON_STATE)"
          - "zero CropPlans for this season in {PROPOSED, APPROVED} (ERR_CROP_PLANS_UNRESOLVED)"
        side_effects:
          - "CASCADE: GardenBeds in PLANTED -> GROWING"
          - "increments Season.version by 1"
      - from: GROWING
        to: HARVESTING
        trigger: "POST /api/seasons/{id}/transition {to_state: HARVESTING}"
        actor: GardenAdmin
        preconditions:
          - "status == GROWING (ERR_INVALID_SEASON_STATE)"
          - "zero IrrigationSchedules for this season in {DUE, MISSED} (ERR_IRRIGATION_UNRESOLVED)"
        side_effects:
          - "CASCADE link 1: GardenBeds in GROWING -> HARVEST_OPEN"
          - "CASCADE link 2 (per bed that flipped): CropPlans on that bed in PLANTED -> HARVESTING"
          - "increments Season.version by 1"
      - from: HARVESTING
        to: RECONCILIATION
        trigger: "POST /api/seasons/{id}/transition {to_state: RECONCILIATION}"
        actor: GardenAdmin
        preconditions:
          - "status == HARVESTING (ERR_INVALID_SEASON_STATE)"
          - "zero HarvestLogs for this season in SUBMITTED (ERR_HARVEST_LOGS_UNVERIFIED)"
          - "zero DonationAllocations for this season's logs in PENDING (ERR_ALLOCATIONS_PENDING)"
        side_effects:
          - "CASCADE: IrrigationSchedules in {SCHEDULED, DUE} -> CANCELLED (frees water_committed_gallons)"
          - "increments Season.version by 1"
      - from: RECONCILIATION
        to: CLOSED
        trigger: "POST /api/seasons/{id}/transition {to_state: CLOSED}"
        actor: GardenAdmin
        preconditions:
          - "status == RECONCILIATION (ERR_INVALID_SEASON_STATE)"
          - "zero IrrigationSchedules for this season in {SCHEDULED, DUE, MISSED, LOGGED} (ERR_IRRIGATION_UNRESOLVED)"
          - "zero HarvestLogs for this season in {DRAFT, SUBMITTED, VERIFIED} (ERR_HARVEST_LOGS_UNVERIFIED)"
        side_effects: ["increments Season.version by 1"]
      - from: "DRAFT | OPEN_ENROLLMENT | PLANTING"
        to: CANCELLED
        trigger: "POST /api/seasons/{id}/transition {to_state: CANCELLED}"
        actor: GardenAdmin
        preconditions: ["status in {DRAFT, OPEN_ENROLLMENT, PLANTING} (ERR_INVALID_SEASON_STATE)"]
        side_effects:
          - "CASCADE: CropPlans for this season in {PROPOSED, APPROVED} -> WITHDRAWN (frees bed allocation)"
          - "CASCADE: ShiftSlots for this season in {DRAFT, OPEN, FULL} -> CANCELLED (which cascades to their signups/bookings/checkouts)"
          - "CASCADE: IrrigationSchedules for this season in {SCHEDULED, DUE} -> CANCELLED"
          - "increments Season.version by 1"

  - entity: GardenBed
    initial_state: FALLOW
    terminal_states: []
    transitions:
      - from: FALLOW
        to: RESERVED
        trigger: "POST /api/beds/{id}/transition {to_state: RESERVED}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == FALLOW (ERR_INVALID_BED_STATE)"
          - "at least one Season exists in {OPEN_ENROLLMENT, PLANTING} (ERR_SEASON_NOT_ACCEPTING)"
        side_effects: ["increments GardenBed.version by 1"]
      - from: RESERVED
        to: PLANTED
        trigger: "POST /api/beds/{id}/transition {to_state: PLANTED}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == RESERVED (ERR_INVALID_BED_STATE)"
          - "at least one CropPlan on this bed in {APPROVED, PLANTED} (ERR_CROP_PLANS_UNRESOLVED)"
        side_effects: ["increments GardenBed.version by 1"]
      - from: PLANTED
        to: GROWING
        trigger: "system cascade (Season PLANTING -> GROWING) | POST /api/beds/{id}/transition {to_state: GROWING}"
        actor: "system | GardenAdmin | Coordinator"
        preconditions: ["status == PLANTED (ERR_INVALID_BED_STATE)"]
        side_effects: ["increments GardenBed.version by 1"]
      - from: GROWING
        to: HARVEST_OPEN
        trigger: "system cascade (Season GROWING -> HARVESTING) | POST /api/beds/{id}/transition {to_state: HARVEST_OPEN}"
        actor: "system | GardenAdmin | Coordinator"
        preconditions: ["status == GROWING (ERR_INVALID_BED_STATE)"]
        side_effects:
          - "CASCADE: CropPlans on this bed in PLANTED -> HARVESTING"
          - "increments GardenBed.version by 1"
      - from: HARVEST_OPEN
        to: POST_HARVEST
        trigger: "POST /api/beds/{id}/transition {to_state: POST_HARVEST}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == HARVEST_OPEN (ERR_INVALID_BED_STATE)"
          - "zero CropPlans on this bed in {APPROVED, PLANTED, HARVESTING} (ERR_CROP_PLANS_UNRESOLVED)"
        side_effects: ["last_harvest_closed_at = now", "increments GardenBed.version by 1"]
      - from: POST_HARVEST
        to: FALLOW
        trigger: "POST /api/beds/{id}/transition {to_state: FALLOW}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == POST_HARVEST (ERR_INVALID_BED_STATE)"
          - "now >= last_harvest_closed_at + 14 days (ERR_BED_REST_PERIOD_ACTIVE)"
        side_effects: ["increments GardenBed.version by 1"]
      - from: "FALLOW | RESERVED | PLANTED | GROWING | HARVEST_OPEN | POST_HARVEST"
        to: OUT_OF_SERVICE
        trigger: "POST /api/beds/{id}/transition {to_state: OUT_OF_SERVICE}"
        actor: GardenAdmin
        preconditions: ["status != OUT_OF_SERVICE (ERR_INVALID_BED_STATE)"]
        side_effects:
          - "CASCADE: CropPlans on this bed in {PROPOSED, APPROVED} -> WITHDRAWN (frees allocated_sq_ft)"
          - "increments GardenBed.version by 1"
      - from: OUT_OF_SERVICE
        to: FALLOW
        trigger: "POST /api/beds/{id}/transition {to_state: FALLOW, remediation_note}"
        actor: GardenAdmin
        preconditions:
          - "status == OUT_OF_SERVICE (ERR_INVALID_BED_STATE)"
          - "remediation_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["increments GardenBed.version by 1"]

  - entity: CropPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/crop-plans/{id}/transition {to_state: APPROVED}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == PROPOSED (ERR_INVALID_CROP_PLAN_STATE)"
          - "season.status in {OPEN_ENROLLMENT, PLANTING} (ERR_SEASON_NOT_ACCEPTING)"
          - "bed.status in {FALLOW, RESERVED} (ERR_BED_NOT_AVAILABLE)"
          - "bed_allocation_capacity: bed.allocated_sq_ft + requested_sq_ft <= bed.size_sq_ft (ERR_BED_CAPACITY_EXCEEDED)"
          - "bed_occupancy_window_check: no occupancy-window conflict (ERR_BED_OCCUPANCY_OVERLAP)"
          - "crop_rotation_check: plant_family != bed.last_plant_family (ERR_CROP_ROTATION_VIOLATION)"
        side_effects: ["bed.allocated_sq_ft += requested_sq_ft", "increments CropPlan.version by 1", "increments GardenBed.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/crop-plans/{id}/transition {to_state: REJECTED, rejection_reason}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == PROPOSED (ERR_INVALID_CROP_PLAN_STATE)"
          - "rejection_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["rejection_reason = input", "increments CropPlan.version by 1"]
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /api/crop-plans/{id}/transition {to_state: PROPOSED, ...updated fields}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == REJECTED (ERR_INVALID_CROP_PLAN_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be proposer_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["rejection_reason = null", "optional field updates applied (requested_sq_ft, planned_start_date, planned_end_date, crop_type, plant_family)", "increments CropPlan.version by 1"]
      - from: APPROVED
        to: PLANTED
        trigger: "POST /api/crop-plans/{id}/transition {to_state: PLANTED}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == APPROVED (ERR_INVALID_CROP_PLAN_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be proposer_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
          - "season.status == PLANTING (ERR_SEASON_NOT_ACCEPTING)"
          - "bed.status in {RESERVED, PLANTED} (ERR_BED_NOT_AVAILABLE)"
        side_effects: ["increments CropPlan.version by 1"]
      - from: PLANTED
        to: HARVESTING
        trigger: "system cascade (GardenBed GROWING -> HARVEST_OPEN)"
        actor: system
        preconditions: []
        side_effects: ["increments CropPlan.version by 1"]
      - from: HARVESTING
        to: COMPLETE
        trigger: "POST /api/crop-plans/{id}/transition {to_state: COMPLETE}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == HARVESTING (ERR_INVALID_CROP_PLAN_STATE)"
        side_effects: ["bed.last_plant_family = this.plant_family", "bed.allocated_sq_ft -= requested_sq_ft", "increments CropPlan.version by 1", "increments GardenBed.version by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /api/crop-plans/{id}/transition {to_state: WITHDRAWN} | system cascade (Season -> CANCELLED, GardenBed -> OUT_OF_SERVICE)"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | system"
        preconditions:
          - "manual: status == APPROVED (ERR_INVALID_CROP_PLAN_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be proposer_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["bed.allocated_sq_ft -= requested_sq_ft", "increments CropPlan.version by 1", "increments GardenBed.version by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/crop-plans/{id}/transition {to_state: WITHDRAWN} | system cascade"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | system"
        preconditions: ["manual: status in {PROPOSED, APPROVED} (ERR_INVALID_CROP_PLAN_STATE)"]
        side_effects: ["increments CropPlan.version by 1"]

  - entity: ShiftSlot
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/shift-slots/{id}/transition {to_state: OPEN}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == DRAFT (ERR_INVALID_SLOT_STATE)"
          - "season.status in {OPEN_ENROLLMENT, PLANTING, GROWING, HARVESTING} (ERR_SEASON_NOT_ACCEPTING)"
        side_effects: ["increments ShiftSlot.version by 1"]
      - from: OPEN
        to: FULL
        trigger: "system (automatic when confirmed_count reaches capacity_total)"
        actor: system
        preconditions: []
        side_effects: ["increments ShiftSlot.version by 1"]
      - from: FULL
        to: OPEN
        trigger: "system (automatic when a cancellation frees a spot and no waitlisted candidate is eligible)"
        actor: system
        preconditions: []
        side_effects: ["increments ShiftSlot.version by 1"]
      - from: "OPEN | FULL"
        to: LOCKED
        trigger: "system (POST /api/_scheduler/run_epoch when now >= starts_at - 24h) | POST /api/shift-slots/{id}/transition {to_state: LOCKED}"
        actor: "system | GardenAdmin | Coordinator"
        preconditions: ["manual: status in {OPEN, FULL} (ERR_INVALID_SLOT_STATE)"]
        side_effects: ["increments ShiftSlot.version by 1"]
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /api/shift-slots/{id}/transition {to_state: COMPLETED}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == LOCKED (ERR_INVALID_SLOT_STATE)"
          - "zero ShiftSignups in CHECKED_IN (ERR_SIGNUPS_STILL_CHECKED_IN)"
        side_effects:
          - "CASCADE link 1: ShiftSignups in CONFIRMED -> NO_SHOW (volunteer.no_show_count += 1 per signup)"
          - "CASCADE link 2 (per signup whose no_show_count crosses >= 3): volunteer.standing GOOD -> PROBATION"
          - "CASCADE: GroupBookings in CHECKED_IN -> COMPLETED; GroupBookings in CONFIRMED -> CANCELLED"
          - "increments ShiftSlot.version by 1"
      - from: "DRAFT | OPEN | FULL"
        to: CANCELLED
        trigger: "POST /api/shift-slots/{id}/transition {to_state: CANCELLED} | system cascade (Season -> CANCELLED)"
        actor: "GardenAdmin | Coordinator | system"
        preconditions: ["manual: status in {DRAFT, OPEN, FULL} (ERR_INVALID_SLOT_STATE)"]
        side_effects:
          - "CASCADE link 1: ShiftSignups in {REQUESTED, CONFIRMED, WAITLISTED} -> CANCELLED (no no-show penalty); GroupBookings in {REQUESTED, CONFIRMED} -> CANCELLED"
          - "CASCADE link 2 (per cancelled signup): its ToolCheckouts in OPEN linked via signup_id -> AUTO_CLOSED"
          - "CASCADE link 3 (per auto-closed checkout): ToolItem counts recomputed (checked_out_count -= qty - qty_returned; available_count rises)"
          - "increments ShiftSlot.version by 1"

  - entity: ShiftSignup
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/shift-signups/{id}/confirm"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == REQUESTED (ERR_INVALID_SIGNUP_STATE)"
          - "slot.status in {OPEN, FULL} (ERR_INVALID_SLOT_STATE)"
          - "now < slot.starts_at - 24h (ERR_SLOT_LOCKED)"
          - "if is_youth: supervision_adult_signup_id references a CONFIRMED/CHECKED_IN signup on the same slot whose volunteer can_supervise (ERR_YOUTH_SUPERVISION_REQUIRED)"
        side_effects:
          - "BRANCH A (fits): confirmed_count += 1 (+ confirmed_youth_count += 1 if is_youth); slot OPEN -> FULL when confirmed_count == capacity_total"
          - "BRANCH B (no room): signup -> WAITLISTED instead, waitlist_position = slot.next_waitlist_position, slot.next_waitlist_position += 1 (slot stays FULL)"
          - "increments ShiftSignup.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "system (automatic inside confirm when pools are full)"
        actor: system
        preconditions: []
        side_effects: ["waitlist_position assigned", "slot.waitlist_count += 1"]
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist_promotion_select when a CONFIRMED spot is freed)"
        actor: system
        preconditions: ["candidate is lowest waitlist_position among WAITLISTED satisfying both pool constraints"]
        side_effects: ["confirmed_count += 1", "waitlist_position = null", "slot OPEN -> FULL when full"]
      - from: "REQUESTED | WAITLISTED"
        to: CANCELLED
        trigger: "POST /api/shift-signups/{id}/cancel | system cascade (slot CANCELLED; volunteer SUSPENDED)"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | system"
        preconditions:
          - "manual: status in {REQUESTED, WAITLISTED, CONFIRMED} (ERR_INVALID_SIGNUP_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be the signup's volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["waitlist_position cleared if set", "increments ShiftSignup.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/shift-signups/{id}/cancel | system cascade (slot CANCELLED; volunteer SUSPENDED; supervision adult cancelled)"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader | system"
        preconditions:
          - "manual: status == CONFIRMED (ERR_INVALID_SIGNUP_STATE)"
          - "manual: now < slot.starts_at - 24h (ERR_SLOT_LOCKED)"
          - "ownership: Volunteer/GroupLeader caller must be volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "freed spot: confirmed_count -= 1 (and youth pool if is_youth)"
          - "waitlist_promotion_select runs on the slot (may promote one WAITLISTED -> CONFIRMED)"
          - "slot FULL -> OPEN when promotion finds no eligible candidate"
          - "CASCADE (supervision loss): if this signup is the supervision_adult_signup_id of youth signups in {REQUESTED, CONFIRMED} on the same slot, those youth signups -> CANCELLED"
          - "increments ShiftSignup.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/shift-signups/{id}/check-in"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == CONFIRMED (ERR_INVALID_SIGNUP_STATE)"
          - "ownership for Volunteer/GroupLeader callers (ERR_OWNERSHIP_VIOLATION)"
          - "now within [slot.starts_at - 30min, slot.ends_at] (ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects: ["checked_in_at = now", "credited_minutes = slot scheduled minutes (provisional)", "volunteer.total_service_minutes recomputed", "increments ShiftSignup.version by 1"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /api/shift-signups/{id}/check-out"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == CHECKED_IN (ERR_INVALID_SIGNUP_STATE)"
          - "ownership for Volunteer/GroupLeader callers (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["checked_out_at = now", "credited_minutes recomputed final = min(actual elapsed minutes, scheduled + 30)", "volunteer.total_service_minutes recomputed", "increments ShiftSignup.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system cascade (ShiftSlot LOCKED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["volunteer.no_show_count += 1", "if no_show_count >= 3 and standing == GOOD: standing -> PROBATION", "credited_minutes = 0"]

  - entity: GroupBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/group-bookings/{id}/transition {to_state: CONFIRMED}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == REQUESTED (ERR_INVALID_GROUP_STATE)"
          - "slot.status in {OPEN, FULL} (ERR_INVALID_SLOT_STATE)"
          - "now < slot.starts_at - 24h (ERR_SLOT_LOCKED)"
          - "supervision_ratio_check re-run: certified chaperones >= required_chaperones (ERR_SUPERVISION_RATIO_VIOLATION)"
          - "slot.confirmed_count + member_count <= slot.capacity_total (ERR_SLOT_CAPACITY_EXCEEDED)"
          - "slot.confirmed_youth_count + minor_count <= slot.capacity_youth (ERR_YOUTH_CAPACITY_EXCEEDED)"
        side_effects: ["slot.confirmed_count += member_count", "slot.confirmed_youth_count += minor_count", "slot OPEN -> FULL when capacity reached", "increments GroupBooking.version by 1"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/group-bookings/{id}/transition {to_state: REJECTED, rejection_reason}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == REQUESTED (ERR_INVALID_GROUP_STATE)"
          - "rejection_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["increments GroupBooking.version by 1"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/group-bookings/{id}/transition {to_state: CHECKED_IN}"
        actor: "GardenAdmin | Coordinator | GroupLeader"
        preconditions:
          - "status == CONFIRMED (ERR_INVALID_GROUP_STATE)"
          - "ownership: GroupLeader caller must be leader_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
          - "now within [slot.starts_at - 30min, slot.ends_at] (ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects: ["increments GroupBooking.version by 1"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system cascade (ShiftSlot LOCKED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["increments GroupBooking.version by 1"]
      - from: "REQUESTED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /api/group-bookings/{id}/transition {to_state: CANCELLED} | system cascade (slot CANCELLED or COMPLETED)"
        actor: "GardenAdmin | Coordinator | GroupLeader | system"
        preconditions:
          - "manual: status in {REQUESTED, CONFIRMED} (ERR_INVALID_GROUP_STATE)"
          - "ownership: GroupLeader caller must be leader_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
          - "manual from CONFIRMED: now < slot.starts_at - 24h (ERR_SLOT_LOCKED)"
        side_effects: ["if was CONFIRMED: slot pools decremented by member_count/minor_count; slot FULL -> OPEN", "increments GroupBooking.version by 1"]

  - entity: ShedKey
    initial_state: AVAILABLE
    terminal_states: [LOST, RETIRED]
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "POST /api/shed-keys/{id}/transition {to_state: CHECKED_OUT, holder_volunteer_id, due_back_at}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status == AVAILABLE (ERR_INVALID_KEY_STATE)"
          - "holder volunteer: orientation_status == ORIENTED (ERR_ORIENTATION_REQUIRED), waiver_status == SIGNED (ERR_WAIVER_REQUIRED), standing == GOOD (ERR_VOLUNTEER_NOT_IN_GOOD_STANDING)"
          - "holder.held_key_count == 0 (ERR_KEY_LIMIT_EXCEEDED)"
          - "due_back_at > now (ERR_INVALID_DATE_RANGE)"
        side_effects: ["current_holder_volunteer_id = holder", "due_back_at set", "holder.held_key_count = 1", "increments ShedKey.version by 1"]
      - from: "CHECKED_OUT | OVERDUE"
        to: RETURNED
        trigger: "POST /api/shed-keys/{id}/transition {to_state: RETURNED}"
        actor: "GardenAdmin | Coordinator"
        preconditions: ["status in {CHECKED_OUT, OVERDUE} (ERR_INVALID_KEY_STATE)"]
        side_effects: ["current_holder_volunteer_id = null", "due_back_at = null", "holder.held_key_count -= 1", "increments ShedKey.version by 1"]
      - from: CHECKED_OUT
        to: OVERDUE
        trigger: "system (POST /api/_scheduler/run_epoch when now > due_back_at)"
        actor: system
        preconditions: []
        side_effects: ["increments ShedKey.version by 1"]
      - from: "CHECKED_OUT | OVERDUE"
        to: LOST
        trigger: "POST /api/shed-keys/{id}/transition {to_state: LOST}"
        actor: "GardenAdmin | Coordinator"
        preconditions: ["status in {CHECKED_OUT, OVERDUE} (ERR_INVALID_KEY_STATE)"]
        side_effects:
          - "CASCADE: holder volunteer standing GOOD -> PROBATION"
          - "current_holder_volunteer_id = null; holder.held_key_count -= 1"
          - "increments ShedKey.version by 1"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/shed-keys/{id}/transition {to_state: RETIRED}"
        actor: GardenAdmin
        preconditions: ["status == AVAILABLE (ERR_INVALID_KEY_STATE)"]
        side_effects: ["increments ShedKey.version by 1"]

  - entity: ToolItem
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /api/tools/{id}/retire"
        actor: GardenAdmin
        preconditions:
          - "status == IN_SERVICE (ERR_INVALID_TOOL_STATE)"
          - "checked_out_count == 0 (ERR_TOOL_UNITS_OUTSTANDING)"
        side_effects: ["increments ToolItem.version by 1"]
    note: "in_maintenance movement is driven by ToolCheckout returns (DAMAGED) and POST /api/tools/{id}/restore"

  - entity: ToolCheckout
    initial_state: OPEN
    terminal_states: [RETURNED, CLOSED_LOSS, AUTO_CLOSED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /api/tool-checkouts/{id}/transition {to_state: RETURNED, qty_returned, condition_on_return}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status in {OPEN, PARTIAL_RETURN} (ERR_INVALID_CHECKOUT_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be volunteer_id (ERR_OWNERSHIP_VIOLATION)"
          - "qty_returned == qty - prior qty_returned (full remainder) (ERR_QUANTITY_INVALID)"
        side_effects:
          - "tool.checked_out_count -= qty_returned_this_call"
          - "condition GOOD: tool.available_count += qty_returned_this_call; DAMAGED: tool.in_maintenance_count += qty_returned_this_call"
          - "increments ToolCheckout.version by 1 and ToolItem.version by 1"
      - from: OPEN
        to: PARTIAL_RETURN
        trigger: "POST /api/tool-checkouts/{id}/transition {to_state: RETURNED, qty_returned < remainder}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions: ["same as OPEN -> RETURNED but qty_returned strictly less than remainder and > 0"]
        side_effects: ["same count updates, prorated to qty_returned"]
      - from: "OPEN | PARTIAL_RETURN"
        to: CLOSED_LOSS
        trigger: "POST /api/tool-checkouts/{id}/transition {to_state: CLOSED_LOSS}"
        actor: "GardenAdmin | Coordinator"
        preconditions: ["status in {OPEN, PARTIAL_RETURN} (ERR_INVALID_CHECKOUT_STATE)"]
        side_effects:
          - "tool.written_off_count += (qty - qty_returned); tool.checked_out_count -= (qty - qty_returned)"
          - "CASCADE: borrower volunteer standing GOOD -> PROBATION"
          - "increments ToolCheckout.version by 1 and ToolItem.version by 1"
      - from: OPEN
        to: AUTO_CLOSED
        trigger: "system cascade (linked ShiftSignup's slot -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["tool.checked_out_count -= qty; tool.available_count += qty (as if returned GOOD)"]

  - entity: HarvestLog
    initial_state: DRAFT
    terminal_states: [SPLIT_FINALIZED, DISCARDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/harvest-logs/{id}/transition {to_state: SUBMITTED}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == DRAFT (ERR_INVALID_HARVEST_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be logged_by_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
          - "safety_attestation == true (ERR_SAFETY_ATTESTATION_REQUIRED)"
          - "logger holds ACTIVE PRODUCE_SAFETY cert at submit time (ERR_PRODUCE_SAFETY_CERT_REQUIRED)"
        side_effects: ["increments HarvestLog.version by 1"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/harvest-logs/{id}/transition {to_state: VERIFIED}"
        actor: "GardenAdmin | FoodSafetyOfficer"
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_HARVEST_STATE)"
          - "segregation of duties: caller X-User-ID != logged_by_volunteer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "logger still holds ACTIVE PRODUCE_SAFETY cert (ERR_PRODUCE_SAFETY_CERT_REQUIRED)"
        side_effects: ["increments HarvestLog.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/harvest-logs/{id}/transition {to_state: REJECTED, rejection_reason}"
        actor: "GardenAdmin | FoodSafetyOfficer"
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_HARVEST_STATE)"
          - "rejection_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["rejection_reason set", "increments HarvestLog.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/harvest-logs/{id}/transition {to_state: DRAFT}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == REJECTED (ERR_INVALID_HARVEST_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be logged_by_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["rejection_reason = null", "increments HarvestLog.version by 1"]
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /api/harvest-logs/{id}/transition {to_state: DISCARDED}"
        actor: "GardenAdmin | Coordinator | Volunteer | GroupLeader"
        preconditions:
          - "status == DRAFT (ERR_INVALID_HARVEST_STATE)"
          - "ownership: Volunteer/GroupLeader caller must be logged_by_volunteer_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["increments HarvestLog.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "system cascade (logger's PRODUCE_SAFETY cert REVOKED)"
        actor: system
        preconditions: []
        side_effects: ["increments HarvestLog.version by 1"]
      - from: VERIFIED
        to: SPLIT_FINALIZED
        trigger: "system cascade (DonationAllocation APPROVED -> DISTRIBUTED)"
        actor: system
        preconditions: []
        side_effects: ["increments HarvestLog.version by 1"]

  - entity: DonationAllocation
    initial_state: PENDING
    terminal_states: [REJECTED, DISTRIBUTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/donation-allocations/{id}/transition {to_state: APPROVED}"
        actor: "GardenAdmin | FoodSafetyOfficer"
        preconditions:
          - "status == PENDING (ERR_INVALID_ALLOCATION_STATE)"
          - "harvest log still VERIFIED (ERR_HARVEST_LOG_NOT_VERIFIED)"
          - "segregation of duties: caller X-User-ID != harvest log's logged_by_volunteer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "recipient_weekly_commitment re-check per line: committed_this_week_grams + grams <= weekly_capacity_grams (ERR_RECIPIENT_CAPACITY_EXCEEDED)"
          - "each line recipient still active (ERR_RECIPIENT_INACTIVE)"
        side_effects: ["recipient.committed_this_week_grams += line grams", "increments DonationAllocation.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/donation-allocations/{id}/transition {to_state: REJECTED, rejection_reason}"
        actor: "GardenAdmin | FoodSafetyOfficer"
        preconditions:
          - "status == PENDING (ERR_INVALID_ALLOCATION_STATE)"
          - "rejection_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["increments DonationAllocation.version by 1"]
      - from: APPROVED
        to: DISTRIBUTED
        trigger: "POST /api/donation-allocations/{id}/transition {to_state: DISTRIBUTED}"
        actor: "GardenAdmin | Coordinator"
        preconditions: ["status == APPROVED (ERR_INVALID_ALLOCATION_STATE)"]
        side_effects:
          - "CASCADE: harvest log VERIFIED -> SPLIT_FINALIZED"
          - "increments DonationAllocation.version by 1 and HarvestLog.version by 1"

  - entity: IrrigationSchedule
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (POST /api/_scheduler/run_epoch when now >= planned_start_at and now <= planned_end_at)"
        actor: system
        preconditions: []
        side_effects: ["increments IrrigationSchedule.version by 1"]
      - from: "SCHEDULED | DUE"
        to: MISSED
        trigger: "system (POST /api/_scheduler/run_epoch when now > planned_end_at and no meter logged)"
        actor: system
        preconditions: []
        side_effects: ["increments IrrigationSchedule.version by 1"]
      - from: "SCHEDULED | DUE | MISSED"
        to: LOGGED
        trigger: "POST /api/irrigation-schedules/{id}/log-meter {gallons_actual}"
        actor: "GardenAdmin | Coordinator"
        preconditions:
          - "status in {SCHEDULED, DUE, MISSED} (ERR_INVALID_IRRIGATION_STATE)"
          - "gallons_actual >= 0 (ERR_QUANTITY_INVALID)"
        side_effects:
          - "gallons_actual recorded; variance_flag recomputed"
          - "season.water_committed_gallons -= planned_gallons; season.water_actual_gallons += gallons_actual; season.water_remaining_gallons recomputed"
          - "increments IrrigationSchedule.version by 1 and Season.version by 1"
      - from: LOGGED
        to: RECONCILED
        trigger: "POST /api/irrigation-schedules/{id}/transition {to_state: RECONCILED}"
        actor: GardenAdmin
        preconditions: ["status == LOGGED (ERR_INVALID_IRRIGATION_STATE)"]
        side_effects: ["increments IrrigationSchedule.version by 1"]
      - from: "SCHEDULED | DUE"
        to: CANCELLED
        trigger: "POST /api/irrigation-schedules/{id}/transition {to_state: CANCELLED} | system cascade (Season -> RECONCILIATION or CANCELLED)"
        actor: "GardenAdmin | Coordinator | system"
        preconditions: ["manual: status in {SCHEDULED, DUE} (ERR_INVALID_IRRIGATION_STATE)"]
        side_effects: ["season.water_committed_gallons -= planned_gallons; water_remaining recomputed", "increments IrrigationSchedule.version by 1 and Season.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: irrigation-create-stale-season
    parent_entity: Season
    write_endpoint: "POST /api/irrigation-schedules"
    occ_field: "expected_season_version"
    description: |
      Creating an IrrigationSchedule against a Season whose version has advanced
      since the client last observed it is rejected. Creating a schedule legitimately
      debits the season's water ledger, so a writer holding a stale season view
      would budget-check against water_committed_gallons/water_actual_gallons values
      that no longer hold; the stale write is refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: season-config-patch-stale-version
    parent_entity: Season
    write_endpoint: "PATCH /api/seasons/{seasonId}"
    occ_field: "expected_season_version"
    description: |
      Patching a Season's configuration (e.g. water_budget_gallons, window dates)
      against a version the client no longer holds is rejected. Two successive
      config edits are each individually legitimate; the second writer's view is
      stale once the first edit advanced Season.version, so it fails with
      ERR_STALE_VERSION and must re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shift-slot-patch-stale-version
    parent_entity: ShiftSlot
    write_endpoint: "PATCH /api/shift-slots/{slotId}"
    occ_field: "expected_slot_version"
    description: |
      Patching a ShiftSlot (capacity_total, capacity_youth, starts_at, ends_at)
      against a stale version is rejected. Auto-transitions (OPEN<->FULL) and
      signup cascades advance ShiftSlot.version between a client's read and its
      patch; the stale patch is refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (11 rules)
# =============================================================================
calculations:
  - name: water_budget_projection
    trigger: "POST /api/irrigation-schedules (gate); every irrigation create/log-meter/cancel; season RECONCILIATION transition"
    algorithm: forward_looking
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        1. committed = sum(planned_gallons over this season's IrrigationSchedules in {SCHEDULED, DUE, MISSED}),
           EXCLUDING the candidate schedule being created (the candidate is never in the persisted set yet).
        2. actual = sum(gallons_actual over this season's schedules in {LOGGED, RECONCILED}).
        3. projected = committed + actual + candidate.planned_gallons.
        4. Gate passes iff projected <= season.water_budget_gallons (exact equality allowed).
      Persisted derived fields after any mutation:
        water_committed_gallons = committed (including the candidate once persisted as SCHEDULED)
        water_actual_gallons = actual
        water_remaining_gallons = water_budget_gallons - water_committed_gallons - water_actual_gallons
    input_set: "IrrigationSchedules of one Season; committed set = {SCHEDULED, DUE, MISSED}; actual set = {LOGGED, RECONCILED}; CANCELLED excluded from both"
    constants: {}
    precision: "integer gallons; no rounding"
    variants:
      - name: projected_variant
        when: "gate at schedule creation and any mid-season read"
        difference: "uses committed + actual (forward-looking; counts unlogged planned water)"
      - name: reconciled_final_variant
        when: "after Season enters RECONCILIATION (open schedules are cascade-cancelled, so committed collapses to 0)"
        difference: "final usage = water_actual_gallons only; diverges from projected whenever actual != planned"

  - name: volunteer_service_credit
    trigger: "ShiftSignup CHECKED_IN (provisional) and check-out (final)"
    algorithm: aggregation
    formula: |
      scheduled_minutes = (slot.ends_at - slot.starts_at) in whole minutes.
      PROVISIONAL (at CHECKED_IN): credited_minutes = scheduled_minutes.
      FINAL (at check-out -> COMPLETED):
        actual_minutes = (checked_out_at - checked_in_at) in whole minutes (floor on partial minutes);
        credited_minutes = min(actual_minutes, scheduled_minutes + GRACE_MINUTES); floor at 0.
      volunteer.total_service_minutes = sum(credited_minutes) over the volunteer's signups in
        {CHECKED_IN, COMPLETED}; NO_SHOW and CANCELLED contribute 0.
    input_set: "ShiftSignups of one Volunteer in {CHECKED_IN, COMPLETED}"
    constants:
      GRACE_MINUTES: 30
    precision: "integer minutes"
    variants:
      - name: scheduled_credit
        when: "while signup is CHECKED_IN (shift in progress)"
        difference: "credits the slot's scheduled minutes regardless of actual elapsed"
      - name: actual_credit
        when: "after check-out (COMPLETED)"
        difference: "credits min(actual elapsed, scheduled + 30); identical signup data yields a different number whenever actual != scheduled"

  - name: supervision_ratio_check
    trigger: "POST /api/group-bookings (create) and GroupBooking REQUESTED -> CONFIRMED (re-check)"
    algorithm: constraint_propagation
    formula: |
      required_chaperones = ceil(minor_count / SUPERVISION_RATIO)  (SUPERVISION_RATIO = 8; exact multiple boundary: 16 minors -> exactly 2)
      certified_chaperones = count(distinct id in chaperone_volunteer_ids where the referenced Volunteer
                                     exists AND holds a SUPERVISION TrainingCertification with status == ACTIVE)
      Passes iff: chaperone_count >= required_chaperones AND certified_chaperones >= required_chaperones
                  AND minor_count <= member_count.
      Non-linear interactions: ceil() boundary, conditional branch on cert status per chaperone,
      and membership of chaperone ids (duplicates counted once).
    input_set: "GroupBooking fields + TrainingCertification rows for listed chaperones with status == ACTIVE"
    constants:
      SUPERVISION_RATIO: 8
    precision: "integer persons"

  - name: donation_split
    trigger: "POST /api/donation-allocations (create; splits are recomputed and re-validated)"
    algorithm: waterfall_allocation
    formula: |
      Rounding order is pinned (per-log first, lines absolute):
        1. volunteer_share_grams = floor(harvest_log.weight_grams * VOLUNTEER_SHARE_PCT)   -- rounded DOWN to whole grams FIRST
        2. donatable_grams = weight_grams - volunteer_share_grams                          -- remainder absorbs the rounding
        3. Request lines are absolute integer grams; sum(lines.grams) MUST == donatable_grams exactly (ERR_SPLIT_MISMATCH).
        4. Per-line: grams > 0; recipient active; if log.quality_grade == 'C', every recipient must have accepts_grade_c == true
           (ERR_RECIPIENT_GRADE_RESTRICTED).
      The forbidden alternative (round the share to nearest, or sum-then-round the lines) yields a different
      donatable_grams for weights where weight * 0.20 has a fractional part >= 0.5 (e.g. 9999 g).
    input_set: "one VERIFIED HarvestLog + request lines + referenced DonationRecipients"
    constants:
      VOLUNTEER_SHARE_PCT: 0.20
    precision: "integer grams; floor for the volunteer share; no rounding on lines"

  - name: bed_allocation_capacity
    trigger: "CropPlan PROPOSED -> APPROVED; also refreshed on WITHDRAWN/COMPLETE"
    algorithm: aggregation
    formula: |
      allocated_sq_ft = sum(requested_sq_ft over CropPlans on this bed in {APPROVED, PLANTED, HARVESTING})
      Approve gate: allocated_sq_ft + candidate.requested_sq_ft <= bed.size_sq_ft  (exact fit allowed; +1 sq ft over fails)
    input_set: "CropPlans of one GardenBed in {APPROVED, PLANTED, HARVESTING}; PROPOSED/REJECTED/WITHDRAWN/COMPLETE excluded"
    constants: {}
    precision: "integer sq ft"

  - name: slot_occupancy
    trigger: "every ShiftSignup and GroupBooking mutation affecting occupancy; slot OPEN<->FULL auto-transitions"
    algorithm: aggregation
    formula: |
      confirmed_count = count(ShiftSignups on slot in {CONFIRMED, CHECKED_IN})
                      + sum(member_count of GroupBookings on slot in {CONFIRMED, CHECKED_IN})
      confirmed_youth_count = count(signups in {CONFIRMED, CHECKED_IN} with is_youth)
                      + sum(minor_count of bookings in {CONFIRMED, CHECKED_IN})
      Slot is FULL iff confirmed_count == capacity_total; FULL -> OPEN when a free spot appears and
      waitlist_promotion_select finds no eligible candidate.
      Confirm gate for a signup: confirmed_count + 1 <= capacity_total AND (if is_youth) confirmed_youth_count + 1 <= capacity_youth.
      Confirm gate for a booking: confirmed_count + member_count <= capacity_total AND confirmed_youth_count + minor_count <= capacity_youth.
    input_set: "ShiftSignups and GroupBookings of one ShiftSlot; only {CONFIRMED, CHECKED_IN} occupy; REQUESTED/WAITLISTED do not"
    constants: {}
    precision: "integer persons"

  - name: waitlist_promotion_select
    trigger: "ShiftSignup CONFIRMED -> CANCELLED (any cause, incl. slot-independent volunteer suspension cascade)"
    algorithm: constraint_propagation
    formula: |
      Candidate set: ShiftSignups on the slot in WAITLISTED.
      Eligibility: (candidate.is_youth == false) OR (confirmed_youth_count + 1 <= capacity_youth);
                   always requires confirmed_count + 1 <= capacity_total.
      Ranking: waitlist_position ASC (positions are unique per slot, assigned from a monotonic counter; no tie-break needed).
      Selection: scan candidates in ranking order; promote the FIRST eligible candidate (WAITLISTED -> CONFIRMED).
      Empty/ineligible set fallback: no promotion; slot FULL -> OPEN.
    input_set: "ShiftSignups of one ShiftSlot in WAITLISTED"
    constants: {}
    precision: "n/a (selector)"

  - name: no_show_standing
    trigger: "ShiftSignup CONFIRMED -> NO_SHOW (slot completion cascade)"
    algorithm: threshold
    formula: |
      no_show_count = count(volunteer's ShiftSignups in NO_SHOW)
      When no_show_count becomes >= NO_SHOW_THRESHOLD (3) and standing == GOOD: standing -> PROBATION.
      Boundary: the 3rd NO_SHOW triggers; the 2nd does not. PROBATION never auto-reverts (manual reinstate only).
    input_set: "ShiftSignups of one Volunteer in NO_SHOW"
    constants:
      NO_SHOW_THRESHOLD: 3
    precision: "integer count"

  - name: irrigation_overlap_check
    trigger: "POST /api/irrigation-schedules"
    algorithm: interval_merge
    formula: |
      Interval semantics: HALF-OPEN [planned_start_at, planned_end_at). Adjacency is allowed:
      a window ending at T and another starting at T do NOT conflict.
      Conflict iff same season AND same zone AND both in occupied statuses {SCHEDULED, DUE, MISSED, LOGGED, RECONCILED}
      AND (a.start < b.end AND b.start < a.end). CANCELLED windows never block.
    input_set: "IrrigationSchedules of the same season+zone in {SCHEDULED, DUE, MISSED, LOGGED, RECONCILED}"
    constants: {}
    precision: "second precision on instants"

  - name: bed_occupancy_window_check
    trigger: "CropPlan PROPOSED -> APPROVED"
    algorithm: interval_merge
    formula: |
      Interval semantics: CLOSED occupancy dates with a mandatory cover-crop BUFFER of BUFFER_DAYS = 14 days.
      Two plans on the same bed, both in {APPROVED, PLANTED, HARVESTING}, conflict UNLESS
      (a.planned_end_date + 14d) < b.planned_start_date OR (b.planned_end_date + 14d) < a.planned_start_date.
      Adjacency is FORBIDDEN: plan B starting exactly on a.end + 14d still conflicts (strict <).
      Unlike irrigation_overlap_check, there is no same-instant tolerance and a 14-day buffer is mandatory.
    input_set: "CropPlans of one GardenBed in {APPROVED, PLANTED, HARVESTING}"
    constants:
      BUFFER_DAYS: 14
    precision: "whole days"

  - name: recipient_weekly_commitment
    trigger: "DonationAllocation create (pre-check) and PENDING -> APPROVED (re-check)"
    algorithm: aggregation
    formula: |
      committed_this_week_grams = sum(line grams for this recipient over DonationAllocations in
        {PENDING, APPROVED, DISTRIBUTED} whose created_at falls in the ISO week of the current clock:
        [Monday 00:00:00.000 inclusive, next Monday 00:00:00.000 exclusive))
      Gate per line: committed_this_week_grams + line.grams <= weekly_capacity_grams (exact fit allowed).
    input_set: "DonationAllocation lines naming the recipient, allocation status in {PENDING, APPROVED, DISTRIBUTED}, ISO-week window of now"
    constants: {}
    precision: "integer grams"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist (left-to-right), then body FK references exist (volunteer_id, slot_id, bed_id, season_id, tool_id, recipient ids in lines, supervision_adult_signup_id, signup_id, harvest_log_id, crop_plan_id, holder_volunteer_id, proposer_volunteer_id, logged_by_volunteer_id, leader_volunteer_id)"
    error_id: "ERR_*_NOT_FOUND (per referenced entity)"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Ownership: Volunteer/GroupLeader/GroupLeader-self callers may only act on own records (signup volunteer_id, booking leader_volunteer_id, checkout volunteer_id, harvest logged_by_volunteer_id, crop plan proposer_volunteer_id, waiver sign own id). Segregation of duties: harvest VERIFIED caller != logger; allocation APPROVED caller != logger; certification issuer != subject."
    error_id: "ERR_OWNERSHIP_VIOLATION | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "self-service and approval endpoints"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, types correct, enum values valid, ranges valid (minor_count <= member_count, capacity_youth <= capacity_total, quantities > 0 where required, end strictly after start for dates/times)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 6
    category: state
    check: "Target entity is in the from-state required by the transition"
    error_id: "ERR_INVALID_<ENTITY>_STATE (ERR_INVALID_VOLUNTEER_STATE, ERR_INVALID_CERTIFICATION_STATE, ERR_INVALID_SEASON_STATE, ERR_INVALID_BED_STATE, ERR_INVALID_CROP_PLAN_STATE, ERR_INVALID_SLOT_STATE, ERR_INVALID_SIGNUP_STATE, ERR_INVALID_GROUP_STATE, ERR_INVALID_KEY_STATE, ERR_INVALID_TOOL_STATE, ERR_INVALID_CHECKOUT_STATE, ERR_INVALID_HARVEST_STATE, ERR_INVALID_ALLOCATION_STATE, ERR_INVALID_IRRIGATION_STATE)"
    http_status: 409
    applies_to: "transition/action endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state guards: season accepting (ERR_SEASON_NOT_ACCEPTING), bed available for plan/harvest (ERR_BED_NOT_AVAILABLE / ERR_BED_NOT_HARVEST_OPEN), slot open for signup (ERR_INVALID_SLOT_STATE), harvest log VERIFIED for allocation (ERR_HARVEST_LOG_NOT_VERIFIED), season-level transition guards (ERR_SEASON_GUARD_ACTIVE_BED_REQUIRED, ERR_SEASON_REVERT_BLOCKED, ERR_CROP_PLANS_UNRESOLVED, ERR_IRRIGATION_UNRESOLVED, ERR_HARVEST_LOGS_UNVERIFIED, ERR_ALLOCATIONS_PENDING, ERR_SIGNUPS_STILL_CHECKED_IN, ERR_TOOL_UNITS_OUTSTANDING)"
    error_id: "guard-specific"
    http_status: 409
    applies_to: "guarded endpoints"
  - priority: 8
    category: business_safety
    check: "Participation gates, evaluated in this fixed sub-order: orientation ORIENTED (ERR_ORIENTATION_REQUIRED), then waiver SIGNED (ERR_WAIVER_REQUIRED), then standing not SUSPENDED (ERR_VOLUNTEER_SUSPENDED); key checkout additionally requires standing GOOD (ERR_VOLUNTEER_NOT_IN_GOOD_STANDING)"
    error_id: "gate-specific"
    http_status: 409
    applies_to: "signup create, booking create, harvest create, tool checkout create, key checkout"
  - priority: 9
    category: business_safety
    check: "Certification gates: slot.requires_produce_safety or harvest logging needs ACTIVE PRODUCE_SAFETY (ERR_PRODUCE_SAFETY_CERT_REQUIRED); POWER tool checkout needs ACTIVE TOOL_SAFETY (ERR_TOOL_CERT_REQUIRED); harvest safety_attestation must be true (ERR_SAFETY_ATTESTATION_REQUIRED)"
    error_id: "cert-specific"
    http_status: 409
    applies_to: "signup create, harvest create/submit/verify, tool checkout create"
  - priority: 10
    category: business_safety
    check: "Youth supervision: minor signup requires supervision_adult_signup_id (ERR_YOUTH_SUPERVISION_REQUIRED); group booking supervision_ratio_check (ERR_SUPERVISION_RATIO_VIOLATION)"
    error_id: "supervision-specific"
    http_status: 409
    applies_to: "signup create/confirm, booking create/confirm"
  - priority: 11
    category: business_constraint
    check: "Uniqueness: volunteer email (ERR_EMAIL_TAKEN), bed_code (ERR_BED_CODE_TAKEN), key_code (ERR_KEY_CODE_TAKEN), one non-terminal signup per volunteer per slot (ERR_DUPLICATE_SIGNUP), one ACTIVE cert per (volunteer, cert_type) (ERR_DUPLICATE_ACTIVE_CERT), one non-terminal allocation per harvest log (ERR_DUPLICATE_ACTIVE_ALLOCATION)"
    error_id: "uniqueness-specific"
    http_status: 409
    applies_to: "create endpoints"
  - priority: 12
    category: business_referential
    check: "Referential-state: crop rotation vs bed.last_plant_family (ERR_CROP_ROTATION_VIOLATION), recipient active (ERR_RECIPIENT_INACTIVE), grade-C restriction (ERR_RECIPIENT_GRADE_RESTRICTED), tool IN_SERVICE (ERR_INVALID_TOOL_STATE), signup_id belongs to same volunteer and is CONFIRMED/CHECKED_IN (ERR_SIGNUP_NOT_ELIGIBLE)"
    error_id: "referential-specific"
    http_status: 409
    applies_to: "crop plan approve, allocation create/approve, tool checkout create"
  - priority: 13
    category: business_temporal
    check: "Temporal windows: slot within season window (ERR_OUTSIDE_SEASON_WINDOW), slot lock at starts_at - 24h (ERR_SLOT_LOCKED), check-in window (ERR_OUTSIDE_CHECKIN_WINDOW), harvest not in future (ERR_HARVEST_IN_FUTURE), irrigation zone overlap half-open (ERR_IRRIGATION_OVERLAP), bed occupancy overlap with 14-day buffer (ERR_BED_OCCUPANCY_OVERLAP), bed rest period (ERR_BED_REST_PERIOD_ACTIVE)"
    error_id: "temporal-specific"
    http_status: 409
    applies_to: "slot create, signup create/confirm/cancel, check-in, harvest create, irrigation create, crop plan approve, bed POST_HARVEST -> FALLOW"
  - priority: 14
    category: business_constraint
    check: "Capacity/quota: slot pools (ERR_SLOT_CAPACITY_EXCEEDED, ERR_YOUTH_CAPACITY_EXCEEDED), bed area (ERR_BED_CAPACITY_EXCEEDED), one key per volunteer (ERR_KEY_LIMIT_EXCEEDED), key registry max 4 non-RETIRED (ERR_KEY_REGISTRY_FULL), tool stock (ERR_TOOL_INSUFFICIENT_STOCK), recipient weekly capacity (ERR_RECIPIENT_CAPACITY_EXCEEDED)"
    error_id: "capacity-specific"
    http_status: 409
    applies_to: "signup confirm/promote, group booking create/confirm, crop plan approve, key create/checkout, tool checkout create, allocation create/approve"
  - priority: 15
    category: business_fiscal
    check: "Water budget: water_budget_projection gate (ERR_WATER_BUDGET_EXCEEDED)"
    error_id: ERR_WATER_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "irrigation create"
  - priority: 16
    category: business_constraint
    check: "Split integrity: allocation line grams sum exactly to donatable_grams (ERR_SPLIT_MISMATCH)"
    error_id: ERR_SPLIT_MISMATCH
    http_status: 409
    applies_to: "allocation create"
  - priority: 17
    category: business_constraint
    check: "Optimistic concurrency: expected_*_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/irrigation-schedules, PATCH /api/seasons/{id}, PATCH /api/shift-slots/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# All GET list endpoints accept limit?/offset? and return the §1.0 envelope with
# pagination fields. GET endpoints are open to all five roles unless noted.
# =============================================================================
endpoints:
  # --- system / test-driving ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [GardenAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/api/_scheduler/run_epoch"
    description: "Ops-run checkpoint: applies all time-based auto-transitions as of the current logical clock (cert ACTIVE->EXPIRED, waiver SIGNED->EXPIRED, key CHECKED_OUT->OVERDUE, slot OPEN/FULL->LOCKED at starts_at-24h, irrigation SCHEDULED->DUE and ->MISSED)."
    roles: [GardenAdmin]
    code: 200
    input: []
    output: "{ transitioned_counts: object }"
    side_effects: ["all time-based transitions listed in §1.2"]

  # --- Volunteer ---
  - method: POST
    path: "/api/volunteers"
    description: "Register a volunteer"
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [full_name, email, date_of_birth, "phone?"]
    output: Volunteer
    side_effects: ["is_minor computed vs current clock; orientation PENDING; waiver UNSIGNED; standing GOOD"]
  - method: GET
    path: "/api/volunteers"
    description: "List volunteers"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "standing?", "waiver_status?", "orientation_status?"]
    output: "Volunteer[]"
    side_effects: []
  - method: GET
    path: "/api/volunteers/{volunteerId}"
    description: "Get one volunteer"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/api/volunteers/{volunteerId}/orientation/complete"
    description: "Mark orientation completed"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["orientation_status -> ORIENTED", "increments Volunteer.version by 1"]
  - method: POST
    path: "/api/volunteers/{volunteerId}/waiver/sign"
    description: "Sign (or renew) the liability waiver"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["waiver_status -> SIGNED", "waiver_signed_at = now", "increments Volunteer.version by 1"]
  - method: POST
    path: "/api/volunteers/{volunteerId}/standing"
    description: "Manual standing transition (PROBATION / SUSPENDED / GOOD)"
    roles: [GardenAdmin]
    code: 200
    input: [to_state]
    output: Volunteer
    side_effects: ["SUSPENDED cascades: own REQUESTED/CONFIRMED signups -> CANCELLED with per-slot waitlist promotion", "increments Volunteer.version by 1"]

  # --- TrainingCertification ---
  - method: POST
    path: "/api/certifications"
    description: "Issue a certification (SoD: issuer != subject)"
    roles: [GardenAdmin, FoodSafetyOfficer]
    code: 201
    input: [volunteer_id, cert_type, expires_at]
    output: TrainingCertification
    side_effects: ["recompute subject can_supervise / produce_safety_certified / tool_safety_certified"]
  - method: GET
    path: "/api/certifications"
    description: "List certifications"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "volunteer_id?", "cert_type?", "status?"]
    output: "TrainingCertification[]"
    side_effects: []
  - method: GET
    path: "/api/certifications/{certificationId}"
    description: "Get one certification"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: TrainingCertification
    side_effects: []
  - method: POST
    path: "/api/certifications/{certificationId}/revoke"
    description: "Revoke an ACTIVE certification"
    roles: [GardenAdmin, FoodSafetyOfficer]
    code: 200
    input: [revoked_reason]
    output: TrainingCertification
    side_effects: ["status -> REVOKED", "recompute subject cert flags", "if PRODUCE_SAFETY: subject's SUBMITTED harvest logs -> DRAFT"]

  # --- Season ---
  - method: POST
    path: "/api/seasons"
    description: "Create a season"
    roles: [GardenAdmin]
    code: 201
    input: [name, signup_opens_at, signup_closes_at, season_starts_at, season_ends_at, water_budget_gallons]
    output: Season
    side_effects: ["status DRAFT; water counters zeroed"]
  - method: GET
    path: "/api/seasons"
    description: "List seasons"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Season[]"
    side_effects: []
  - method: GET
    path: "/api/seasons/{seasonId}"
    description: "Get one season"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: PATCH
    path: "/api/seasons/{seasonId}"
    description: "Update season config (OCC on season version; only while DRAFT or OPEN_ENROLLMENT)"
    roles: [GardenAdmin]
    code: 200
    input: [expected_season_version, "name?", "signup_opens_at?", "signup_closes_at?", "season_starts_at?", "season_ends_at?", "water_budget_gallons?"]
    output: Season
    side_effects: ["increments Season.version by 1"]
  - method: POST
    path: "/api/seasons/{seasonId}/transition"
    description: "Season lifecycle transition with guards/cascades"
    roles: [GardenAdmin]
    code: 200
    input: [to_state]
    output: Season
    side_effects: ["per §1.2 Season machine (bed/crop-plan/irrigation cascades)", "increments Season.version by 1"]

  # --- GardenBed ---
  - method: POST
    path: "/api/beds"
    description: "Register a garden bed"
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [bed_code, size_sq_ft, sun_exposure, irrigation_zone, "soil_ph?"]
    output: GardenBed
    side_effects: ["status FALLOW"]
  - method: GET
    path: "/api/beds"
    description: "List beds"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "irrigation_zone?"]
    output: "GardenBed[]"
    side_effects: []
  - method: GET
    path: "/api/beds/{bedId}"
    description: "Get one bed"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: GardenBed
    side_effects: []
  - method: POST
    path: "/api/beds/{bedId}/transition"
    description: "Bed lifecycle transition (RESERVED/PLANTED/GROWING/HARVEST_OPEN/POST_HARVEST/FALLOW/OUT_OF_SERVICE)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [to_state, "remediation_note?"]
    output: GardenBed
    side_effects: ["per §1.2 GardenBed machine (crop-plan cascades)", "increments GardenBed.version by 1"]

  # --- CropPlan ---
  - method: POST
    path: "/api/crop-plans"
    description: "Propose a crop plan for a bed in a season. Create-time gates: season in {OPEN_ENROLLMENT, PLANTING} (ERR_SEASON_NOT_ACCEPTING); bed not OUT_OF_SERVICE (ERR_BED_NOT_AVAILABLE); proposer must exist; Volunteer/GroupLeader callers must propose as themselves."
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 201
    input: [season_id, bed_id, proposer_volunteer_id, crop_type, plant_family, requested_sq_ft, planned_start_date, planned_end_date, "expected_yield_grams?"]
    output: CropPlan
    side_effects: ["status PROPOSED"]
  - method: GET
    path: "/api/crop-plans"
    description: "List crop plans"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "season_id?", "bed_id?", "proposer_volunteer_id?", "status?"]
    output: "CropPlan[]"
    side_effects: []
  - method: GET
    path: "/api/crop-plans/{cropPlanId}"
    description: "Get one crop plan"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: CropPlan
    side_effects: []
  - method: POST
    path: "/api/crop-plans/{cropPlanId}/transition"
    description: "Crop plan transition (APPROVED/REJECTED/PROPOSED resubmit/PLANTED/COMPLETE/WITHDRAWN); approve runs capacity+overlap+rotation gates"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: [to_state, "rejection_reason?", "requested_sq_ft?", "planned_start_date?", "planned_end_date?", "crop_type?", "plant_family?"]
    output: CropPlan
    side_effects: ["per §1.2 CropPlan machine (bed allocation/last_plant_family)", "increments CropPlan.version by 1"]

  # --- ShiftSlot ---
  - method: POST
    path: "/api/shift-slots"
    description: "Create a shift slot (DRAFT). Create-time gates: starts_at/ends_at within the season's [season_starts_at, season_ends_at] (ERR_OUTSIDE_SEASON_WINDOW); capacity_youth <= capacity_total."
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [season_id, task_type, starts_at, ends_at, capacity_total, capacity_youth, "requires_produce_safety?", "required_tool_id?", "required_tool_qty?"]
    output: ShiftSlot
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/api/shift-slots"
    description: "List shift slots"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "season_id?", "task_type?", "status?"]
    output: "ShiftSlot[]"
    side_effects: []
  - method: GET
    path: "/api/shift-slots/{slotId}"
    description: "Get one shift slot"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: ShiftSlot
    side_effects: []
  - method: PATCH
    path: "/api/shift-slots/{slotId}"
    description: "Update slot capacity/times (OCC on slot version; only while DRAFT or OPEN)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [expected_slot_version, "capacity_total?", "capacity_youth?", "starts_at?", "ends_at?"]
    output: ShiftSlot
    side_effects: ["increments ShiftSlot.version by 1", "re-evaluates OPEN/FULL after capacity change"]
  - method: POST
    path: "/api/shift-slots/{slotId}/transition"
    description: "Slot lifecycle transition (OPEN/LOCKED/COMPLETED/CANCELLED)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [to_state]
    output: ShiftSlot
    side_effects: ["per §1.2 ShiftSlot machine (no-show and cancel cascades)", "increments ShiftSlot.version by 1"]

  # --- ShiftSignup ---
  - method: POST
    path: "/api/shift-signups"
    description: "Create a signup (REQUESTED). Create-time gates in priority order: slot in {OPEN, FULL}; lock (now < starts_at-24h); volunteer ORIENTED + waiver SIGNED + not SUSPENDED; ACTIVE PRODUCE_SAFETY cert when slot.requires_produce_safety; minor requires supervision_adult_signup_id of a CONFIRMED/CHECKED_IN adult signup on the same slot whose volunteer can_supervise; one non-terminal signup per volunteer per slot."
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 201
    input: [slot_id, volunteer_id, "supervision_adult_signup_id?"]
    output: ShiftSignup
    side_effects: ["is_youth snapshot from volunteer.is_minor", "status REQUESTED"]
  - method: GET
    path: "/api/shift-signups"
    description: "List signups"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "slot_id?", "volunteer_id?", "status?", "supervision_adult_signup_id?"]
    output: "ShiftSignup[]"
    side_effects: []
  - method: GET
    path: "/api/shift-signups/{signupId}"
    description: "Get one signup"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: []
  - method: POST
    path: "/api/shift-signups/{signupId}/confirm"
    description: "Confirm a REQUESTED signup; waitlists instead when pools are full"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["per §1.2 ShiftSignup machine (branch A confirm / branch B waitlist)", "increments ShiftSignup.version by 1", "may increment ShiftSlot.version by 1 (FULL flip)"]
  - method: POST
    path: "/api/shift-signups/{signupId}/cancel"
    description: "Cancel a non-terminal signup; freeing a CONFIRMED spot triggers waitlist promotion"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["per §1.2 ShiftSignup machine (promotion, supervision-loss cascade)", "increments ShiftSignup.version by 1"]
  - method: POST
    path: "/api/shift-signups/{signupId}/check-in"
    description: "Check in to a shift (window: starts_at-30min .. ends_at)"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["provisional credited_minutes = scheduled minutes", "increments ShiftSignup.version by 1"]
  - method: POST
    path: "/api/shift-signups/{signupId}/check-out"
    description: "Check out; final credited_minutes = min(actual, scheduled+30)"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["final credited_minutes", "volunteer.total_service_minutes recomputed", "increments ShiftSignup.version by 1"]

  # --- GroupBooking ---
  - method: POST
    path: "/api/group-bookings"
    description: "Request a group booking. Create-time gates in priority order: slot in {OPEN, FULL}; lock (now < starts_at-24h); leader oriented + waiver signed + not suspended; supervision_ratio_check; capacity pre-check (confirmed_count + member_count <= capacity_total AND confirmed_youth_count + minor_count <= capacity_youth); both ratio and capacity re-checked at confirm."
    roles: [GardenAdmin, Coordinator, GroupLeader]
    code: 201
    input: [slot_id, leader_volunteer_id, organization_name, member_count, minor_count, chaperone_count, chaperone_volunteer_ids]
    output: GroupBooking
    side_effects: ["required_chaperones computed (ceil(minor_count/8))", "status REQUESTED"]
  - method: GET
    path: "/api/group-bookings"
    description: "List group bookings"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "slot_id?", "leader_volunteer_id?", "status?"]
    output: "GroupBooking[]"
    side_effects: []
  - method: GET
    path: "/api/group-bookings/{bookingId}"
    description: "Get one group booking"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: GroupBooking
    side_effects: []
  - method: POST
    path: "/api/group-bookings/{bookingId}/transition"
    description: "Booking transition (CONFIRMED/REJECTED/CHECKED_IN/CANCELLED)"
    roles: [GardenAdmin, Coordinator, GroupLeader]
    code: 200
    input: [to_state, "rejection_reason?"]
    output: GroupBooking
    side_effects: ["per §1.2 GroupBooking machine (pool increments/decrements)", "increments GroupBooking.version by 1"]

  # --- ShedKey ---
  - method: POST
    path: "/api/shed-keys"
    description: "Register a shed key (max 4 non-RETIRED keys)"
    roles: [GardenAdmin]
    code: 201
    input: [key_code]
    output: ShedKey
    side_effects: ["status AVAILABLE"]
  - method: GET
    path: "/api/shed-keys"
    description: "List shed keys"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "current_holder_volunteer_id?"]
    output: "ShedKey[]"
    side_effects: []
  - method: GET
    path: "/api/shed-keys/{keyId}"
    description: "Get one shed key"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: ShedKey
    side_effects: []
  - method: POST
    path: "/api/shed-keys/{keyId}/transition"
    description: "Key transition (CHECKED_OUT with holder_volunteer_id+due_back_at / RETURNED / LOST / RETIRED)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [to_state, "holder_volunteer_id?", "due_back_at?"]
    output: ShedKey
    side_effects: ["per §1.2 ShedKey machine (holder standing cascade on LOST)", "increments ShedKey.version by 1"]

  # --- ToolItem ---
  - method: POST
    path: "/api/tools"
    description: "Register a tool pool"
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [tool_name, category, total_count]
    output: ToolItem
    side_effects: ["available_count = total_count; other counters 0"]
  - method: GET
    path: "/api/tools"
    description: "List tools"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "category?", "status?"]
    output: "ToolItem[]"
    side_effects: []
  - method: GET
    path: "/api/tools/{toolId}"
    description: "Get one tool"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: ToolItem
    side_effects: []
  - method: POST
    path: "/api/tools/{toolId}/restore"
    description: "Move qty units from in_maintenance back to available"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [qty]
    output: ToolItem
    side_effects: ["in_maintenance_count -= qty; available_count += qty", "increments ToolItem.version by 1"]
  - method: POST
    path: "/api/tools/{toolId}/retire"
    description: "Retire a tool pool (requires zero checked-out units)"
    roles: [GardenAdmin]
    code: 200
    input: []
    output: ToolItem
    side_effects: ["status -> RETIRED", "increments ToolItem.version by 1"]

  # --- ToolCheckout ---
  - method: POST
    path: "/api/tool-checkouts"
    description: "Check out tool units. Gates: tool IN_SERVICE; volunteer waiver SIGNED + not SUSPENDED; POWER category requires ACTIVE TOOL_SAFETY cert (ERR_TOOL_CERT_REQUIRED); optional signup_id must belong to the same volunteer and be in {CONFIRMED, CHECKED_IN} (ERR_SIGNUP_NOT_ELIGIBLE); qty <= available_count."
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 201
    input: [tool_id, volunteer_id, qty, "signup_id?"]
    output: ToolCheckout
    side_effects: ["tool.checked_out_count += qty; available_count -= qty", "increments ToolItem.version by 1"]
  - method: GET
    path: "/api/tool-checkouts"
    description: "List tool checkouts"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "tool_id?", "volunteer_id?", "signup_id?", "status?"]
    output: "ToolCheckout[]"
    side_effects: []
  - method: GET
    path: "/api/tool-checkouts/{checkoutId}"
    description: "Get one tool checkout"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: ToolCheckout
    side_effects: []
  - method: POST
    path: "/api/tool-checkouts/{checkoutId}/transition"
    description: "Return (full/partial with condition) or write off a checkout"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: [to_state, "qty_returned?", "condition_on_return?"]
    output: ToolCheckout
    side_effects: ["per §1.2 ToolCheckout machine (count sync, PROBATION cascade on CLOSED_LOSS)", "increments ToolCheckout.version by 1 and ToolItem.version by 1"]

  # --- HarvestLog ---
  - method: POST
    path: "/api/harvest-logs"
    description: "Create a harvest log (DRAFT). Create-time gates in priority order: season HARVESTING (ERR_SEASON_NOT_ACCEPTING); bed HARVEST_OPEN (ERR_BED_NOT_HARVEST_OPEN); logger ORIENTED + waiver SIGNED + not SUSPENDED; logger holds ACTIVE PRODUCE_SAFETY cert; safety_attestation true; harvested_at within season window and not after current clock."
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 201
    input: [season_id, bed_id, logged_by_volunteer_id, crop_type, weight_grams, quality_grade, harvested_at, safety_attestation, "crop_plan_id?"]
    output: HarvestLog
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/api/harvest-logs"
    description: "List harvest logs"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "season_id?", "bed_id?", "logged_by_volunteer_id?", "status?", "crop_plan_id?"]
    output: "HarvestLog[]"
    side_effects: []
  - method: GET
    path: "/api/harvest-logs/{harvestLogId}"
    description: "Get one harvest log"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: HarvestLog
    side_effects: []
  - method: PATCH
    path: "/api/harvest-logs/{harvestLogId}"
    description: "Edit a DRAFT harvest log (owner or staff); rejected with ERR_INVALID_HARVEST_STATE unless status == DRAFT; Volunteer/GroupLeader callers must be the logger"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader]
    code: 200
    input: ["crop_type?", "weight_grams?", "quality_grade?", "harvested_at?", "safety_attestation?", "crop_plan_id?"]
    output: HarvestLog
    side_effects: ["increments HarvestLog.version by 1"]
  - method: POST
    path: "/api/harvest-logs/{harvestLogId}/transition"
    description: "Harvest transition (SUBMITTED/VERIFIED/REJECTED/DRAFT resubmit/DISCARDED); verify enforces SoD"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: [to_state, "rejection_reason?"]
    output: HarvestLog
    side_effects: ["per §1.2 HarvestLog machine", "increments HarvestLog.version by 1"]

  # --- DonationRecipient ---
  - method: POST
    path: "/api/donation-recipients"
    description: "Register a donation recipient"
    roles: [GardenAdmin]
    code: 201
    input: [org_name, contact_email, weekly_capacity_grams, priority_tier, "accepts_grade_c?", "active?"]
    output: DonationRecipient
    side_effects: []
  - method: GET
    path: "/api/donation-recipients"
    description: "List recipients"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: "DonationRecipient[]"
    side_effects: []
  - method: GET
    path: "/api/donation-recipients/{recipientId}"
    description: "Get one recipient"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: DonationRecipient
    side_effects: []
  - method: PATCH
    path: "/api/donation-recipients/{recipientId}"
    description: "Update recipient capacity/tier/active/acceptance flags"
    roles: [GardenAdmin]
    code: 200
    input: ["weekly_capacity_grams?", "priority_tier?", "accepts_grade_c?", "active?", "contact_email?"]
    output: DonationRecipient
    side_effects: ["increments DonationRecipient.version by 1"]

  # --- DonationAllocation ---
  - method: POST
    path: "/api/donation-allocations"
    description: "Propose a donation split for a VERIFIED harvest log"
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [harvest_log_id, lines]
    output: DonationAllocation
    side_effects: ["volunteer_share_grams and donatable_grams computed (floor rounding)", "status PENDING", "recipient capacity pre-check"]
  - method: GET
    path: "/api/donation-allocations"
    description: "List donation allocations"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "harvest_log_id?", "recipient_id?", "status?"]
    output: "DonationAllocation[]"
    side_effects: []
  - method: GET
    path: "/api/donation-allocations/{allocationId}"
    description: "Get one allocation"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: DonationAllocation
    side_effects: []
  - method: POST
    path: "/api/donation-allocations/{allocationId}/transition"
    description: "Allocation transition (APPROVED/REJECTED by officer; DISTRIBUTED by coordinator)"
    roles: [GardenAdmin, Coordinator, FoodSafetyOfficer]
    code: 200
    input: [to_state, "rejection_reason?"]
    output: DonationAllocation
    side_effects: ["per §1.2 DonationAllocation machine (recipient commitment, harvest log SPLIT_FINALIZED cascade)", "increments DonationAllocation.version by 1"]

  # --- IrrigationSchedule ---
  - method: POST
    path: "/api/irrigation-schedules"
    description: "Create an irrigation window. Gates in priority order: OCC expected_season_version; season in {PLANTING, GROWING, HARVESTING} (ERR_SEASON_NOT_ACCEPTING); window within season window (ERR_OUTSIDE_SEASON_WINDOW); zone overlap half-open (ERR_IRRIGATION_OVERLAP); water budget gate (ERR_WATER_BUDGET_EXCEEDED)."
    roles: [GardenAdmin, Coordinator]
    code: 201
    input: [season_id, zone, planned_start_at, planned_end_at, planned_gallons, expected_season_version]
    output: IrrigationSchedule
    side_effects: ["season.water_committed_gallons += planned_gallons; water_remaining recomputed", "increments IrrigationSchedule.version by 1 and Season.version by 1"]
  - method: GET
    path: "/api/irrigation-schedules"
    description: "List irrigation schedules"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "season_id?", "zone?", "status?"]
    output: "IrrigationSchedule[]"
    side_effects: []
  - method: GET
    path: "/api/irrigation-schedules/{scheduleId}"
    description: "Get one irrigation schedule"
    roles: [GardenAdmin, Coordinator, Volunteer, GroupLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: IrrigationSchedule
    side_effects: []
  - method: POST
    path: "/api/irrigation-schedules/{scheduleId}/log-meter"
    description: "Record actual meter gallons (allowed from SCHEDULED/DUE/MISSED)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [gallons_actual]
    output: IrrigationSchedule
    side_effects: ["season water counters rebalanced (committed -= planned, actual += gallons_actual)", "variance_flag recomputed", "increments IrrigationSchedule.version by 1 and Season.version by 1"]
  - method: POST
    path: "/api/irrigation-schedules/{scheduleId}/transition"
    description: "Irrigation transition (CANCELLED / RECONCILED)"
    roles: [GardenAdmin, Coordinator]
    code: 200
    input: [to_state]
    output: IrrigationSchedule
    side_effects: ["cancel frees committed water", "increments IrrigationSchedule.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / request shape
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for this endpoint/transition (incl. per-transition actor gating, e.g. approve restricted to Coordinator/GardenAdmin)" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Self-service caller acts on a record owned by a different volunteer" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller is the harvest logger (verify/approve) or the cert subject (issue) — same person may not perform both steps" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, range violation (end<=start, minor_count>member_count, qty<=0, capacity_youth>capacity_total), empty rejection_reason/remediation_note/revoked_reason" }
  # not found
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteer id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id does not exist" }
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "season id does not exist" }
  - { id: ERR_BED_NOT_FOUND, http: 404, condition: "bed id does not exist" }
  - { id: ERR_CROP_PLAN_NOT_FOUND, http: 404, condition: "crop plan id does not exist" }
  - { id: ERR_SHIFT_SLOT_NOT_FOUND, http: 404, condition: "shift slot id does not exist" }
  - { id: ERR_SIGNUP_NOT_FOUND, http: 404, condition: "shift signup id does not exist" }
  - { id: ERR_GROUP_BOOKING_NOT_FOUND, http: 404, condition: "group booking id does not exist" }
  - { id: ERR_SHED_KEY_NOT_FOUND, http: 404, condition: "shed key id does not exist" }
  - { id: ERR_TOOL_NOT_FOUND, http: 404, condition: "tool id does not exist" }
  - { id: ERR_TOOL_CHECKOUT_NOT_FOUND, http: 404, condition: "tool checkout id does not exist" }
  - { id: ERR_HARVEST_LOG_NOT_FOUND, http: 404, condition: "harvest log id does not exist" }
  - { id: ERR_RECIPIENT_NOT_FOUND, http: 404, condition: "donation recipient id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "donation allocation id does not exist" }
  - { id: ERR_IRRIGATION_SCHEDULE_NOT_FOUND, http: 404, condition: "irrigation schedule id does not exist" }
  # state
  - { id: ERR_INVALID_VOLUNTEER_STATE, http: 409, condition: "Volunteer orientation/waiver/standing transition from-state mismatch" }
  - { id: ERR_INVALID_CERTIFICATION_STATE, http: 409, condition: "Certification not ACTIVE for expire/revoke" }
  - { id: ERR_INVALID_SEASON_STATE, http: 409, condition: "Season transition from-state mismatch" }
  - { id: ERR_INVALID_BED_STATE, http: 409, condition: "GardenBed transition from-state mismatch" }
  - { id: ERR_INVALID_CROP_PLAN_STATE, http: 409, condition: "CropPlan transition from-state mismatch" }
  - { id: ERR_INVALID_SLOT_STATE, http: 409, condition: "ShiftSlot transition from-state mismatch (or slot not in {OPEN, FULL} for signup/confirm)" }
  - { id: ERR_INVALID_SIGNUP_STATE, http: 409, condition: "ShiftSignup transition from-state mismatch" }
  - { id: ERR_INVALID_GROUP_STATE, http: 409, condition: "GroupBooking transition from-state mismatch" }
  - { id: ERR_INVALID_KEY_STATE, http: 409, condition: "ShedKey transition from-state mismatch" }
  - { id: ERR_INVALID_TOOL_STATE, http: 409, condition: "ToolItem not IN_SERVICE (retire double-fire or checkout against RETIRED)" }
  - { id: ERR_INVALID_CHECKOUT_STATE, http: 409, condition: "ToolCheckout transition from-state mismatch" }
  - { id: ERR_INVALID_HARVEST_STATE, http: 409, condition: "HarvestLog transition from-state mismatch" }
  - { id: ERR_INVALID_ALLOCATION_STATE, http: 409, condition: "DonationAllocation transition from-state mismatch" }
  - { id: ERR_INVALID_IRRIGATION_STATE, http: 409, condition: "IrrigationSchedule transition from-state mismatch" }
  # cross-entity state guards
  - { id: ERR_SEASON_GUARD_ACTIVE_BED_REQUIRED, http: 409, condition: "Season DRAFT->OPEN_ENROLLMENT requires >= 1 bed not OUT_OF_SERVICE" }
  - { id: ERR_SEASON_REVERT_BLOCKED, http: 409, condition: "OPEN_ENROLLMENT->DRAFT blocked by existing slots/plans/schedules" }
  - { id: ERR_SEASON_NOT_ACCEPTING, http: 409, condition: "Referenced season not in a status accepting the operation" }
  - { id: ERR_CROP_PLANS_UNRESOLVED, http: 409, condition: "Season/bed transition blocked by crop plans in pending states (or bed RESERVE->PLANTED lacking an APPROVED/PLANTED plan)" }
  - { id: ERR_IRRIGATION_UNRESOLVED, http: 409, condition: "Season transition blocked by irrigation schedules in {DUE, MISSED} (GROWING->HARVESTING) or {SCHEDULED, DUE, MISSED, LOGGED} (RECONCILIATION->CLOSED)" }
  - { id: ERR_HARVEST_LOGS_UNVERIFIED, http: 409, condition: "Season transition blocked by harvest logs in SUBMITTED (HARVESTING->RECONCILIATION) or {DRAFT, SUBMITTED, VERIFIED} (RECONCILIATION->CLOSED)" }
  - { id: ERR_ALLOCATIONS_PENDING, http: 409, condition: "Season HARVESTING->RECONCILIATION blocked by PENDING allocations" }
  - { id: ERR_SIGNUPS_STILL_CHECKED_IN, http: 409, condition: "Slot LOCKED->COMPLETED blocked while any signup is CHECKED_IN" }
  - { id: ERR_TOOL_UNITS_OUTSTANDING, http: 409, condition: "Tool retire blocked while checked_out_count > 0" }
  - { id: ERR_BED_NOT_AVAILABLE, http: 409, condition: "Crop plan approve/plant requires bed in {FALLOW, RESERVED} (approve) or {RESERVED, PLANTED} (plant)" }
  - { id: ERR_BED_NOT_HARVEST_OPEN, http: 409, condition: "Harvest log create requires bed in HARVEST_OPEN" }
  - { id: ERR_HARVEST_LOG_NOT_VERIFIED, http: 409, condition: "Allocation create/approve requires harvest log VERIFIED" }
  # safety gates
  - { id: ERR_ORIENTATION_REQUIRED, http: 409, condition: "Volunteer orientation_status != ORIENTED" }
  - { id: ERR_WAIVER_REQUIRED, http: 409, condition: "Volunteer waiver_status != SIGNED (UNSIGNED or EXPIRED)" }
  - { id: ERR_VOLUNTEER_SUSPENDED, http: 409, condition: "Volunteer standing == SUSPENDED blocks signups/bookings/checkouts/harvests" }
  - { id: ERR_VOLUNTEER_NOT_IN_GOOD_STANDING, http: 409, condition: "Shed key checkout requires standing == GOOD (PROBATION blocks)" }
  - { id: ERR_PRODUCE_SAFETY_CERT_REQUIRED, http: 409, condition: "ACTIVE PRODUCE_SAFETY cert required (HARVEST-slot signup, harvest create/submit, re-checked at verify)" }
  - { id: ERR_TOOL_CERT_REQUIRED, http: 409, condition: "ACTIVE TOOL_SAFETY cert required for POWER-category tool checkout" }
  - { id: ERR_SAFETY_ATTESTATION_REQUIRED, http: 409, condition: "safety_attestation must be true at harvest create and submit" }
  - { id: ERR_YOUTH_SUPERVISION_REQUIRED, http: 409, condition: "Minor signup lacks a valid supervising adult signup (same slot, CONFIRMED/CHECKED_IN, adult can_supervise)" }
  - { id: ERR_SUPERVISION_RATIO_VIOLATION, http: 409, condition: "Group booking fails ceil(minor_count/8) chaperone rule or certified-chaperone count" }
  # uniqueness / referential
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Volunteer email already registered" }
  - { id: ERR_BED_CODE_TAKEN, http: 409, condition: "bed_code already exists" }
  - { id: ERR_KEY_CODE_TAKEN, http: 409, condition: "key_code already exists" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "Volunteer already has a non-terminal signup on this slot" }
  - { id: ERR_DUPLICATE_ACTIVE_CERT, http: 409, condition: "Volunteer already holds an ACTIVE cert of this cert_type" }
  - { id: ERR_DUPLICATE_ACTIVE_ALLOCATION, http: 409, condition: "Harvest log already has a non-terminal (PENDING/APPROVED/DISTRIBUTED) allocation" }
  - { id: ERR_CROP_ROTATION_VIOLATION, http: 409, condition: "plant_family equals bed.last_plant_family" }
  - { id: ERR_RECIPIENT_INACTIVE, http: 409, condition: "Allocation line references an inactive recipient" }
  - { id: ERR_RECIPIENT_GRADE_RESTRICTED, http: 409, condition: "Grade-C harvest allocated to a recipient with accepts_grade_c == false" }
  - { id: ERR_SIGNUP_NOT_ELIGIBLE, http: 409, condition: "Tool checkout signup_id not owned by the same volunteer or not in {CONFIRMED, CHECKED_IN}" }
  # temporal
  - { id: ERR_OUTSIDE_SEASON_WINDOW, http: 409, condition: "Slot starts_at/ends_at or irrigation window or harvested_at outside season [season_starts_at, season_ends_at]" }
  - { id: ERR_SLOT_LOCKED, http: 409, condition: "Signup/confirm/cancel attempted at or after starts_at - 24h, or slot already LOCKED" }
  - { id: ERR_OUTSIDE_CHECKIN_WINDOW, http: 409, condition: "Check-in outside [starts_at - 30min, ends_at]" }
  - { id: ERR_HARVEST_IN_FUTURE, http: 409, condition: "harvested_at is after the current logical clock" }
  - { id: ERR_IRRIGATION_OVERLAP, http: 409, condition: "Same-season same-zone half-open window overlap with an occupied schedule" }
  - { id: ERR_BED_OCCUPANCY_OVERLAP, http: 409, condition: "Bed occupancy windows fail the 14-day buffer separation rule" }
  - { id: ERR_BED_REST_PERIOD_ACTIVE, http: 409, condition: "POST_HARVEST -> FALLOW before last_harvest_closed_at + 14 days" }
  # capacity / quota
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Confirm/booking would exceed capacity_total" }
  - { id: ERR_YOUTH_CAPACITY_EXCEEDED, http: 409, condition: "Confirm/booking would exceed capacity_youth" }
  - { id: ERR_BED_CAPACITY_EXCEEDED, http: 409, condition: "Crop plan approve would exceed bed size_sq_ft" }
  - { id: ERR_KEY_LIMIT_EXCEEDED, http: 409, condition: "Volunteer already holds a shed key (max 1)" }
  - { id: ERR_KEY_REGISTRY_FULL, http: 409, condition: "Registering a 5th non-RETIRED shed key (max 4)" }
  - { id: ERR_TOOL_INSUFFICIENT_STOCK, http: 409, condition: "Checkout qty > tool available_count" }
  - { id: ERR_RECIPIENT_CAPACITY_EXCEEDED, http: 409, condition: "Allocation line would push recipient past weekly_capacity_grams for the current ISO week" }
  # fiscal / integrity / concurrency
  - { id: ERR_WATER_BUDGET_EXCEEDED, http: 409, condition: "Irrigation create would push committed + actual + planned over water_budget_gallons" }
  - { id: ERR_SPLIT_MISMATCH, http: 409, condition: "Allocation line grams do not sum exactly to donatable_grams" }
  - { id: ERR_QUANTITY_INVALID, http: 409, condition: "Return qty invalid (<= 0, > remainder), restore qty > in_maintenance_count, or gallons_actual < 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GardenAdmin
    description: "Association administrator; opaque operator identity; full control over seasons, beds, recipients, keys, scheduler; superset of operational endpoints but still subject to SoD identity compares (opaque id never equals a Volunteer.id, so SoD checks pass)"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc, POST /api/_scheduler/run_epoch"
      - "POST/PATCH /api/seasons(+), POST /api/seasons/{id}/transition"
      - "POST /api/volunteers/{id}/standing"
      - "POST /api/shed-keys, POST /api/tools/{id}/retire"
      - "POST/PATCH /api/donation-recipients(+)"
    shared_operations:
      - "all GET endpoints; all transition/action endpoints shared with Coordinator/FoodSafetyOfficer"
  - name: Coordinator
    description: "Volunteer coordinator (is a Volunteer); manages beds, crop-plan approvals, slots, signup confirms, bookings, keys, tools, irrigation, meter logging, distribution"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/shift-signups/{id}/confirm"
      - "POST /api/tools/{id}/restore"
      - "POST /api/irrigation-schedules/{id}/log-meter"
      - "POST /api/donation-allocations (create split proposal)"
    shared_operations:
      - "POST /api/volunteers, orientation/complete, beds, crop-plan transitions, slot create/patch/transition, signup cancel, booking transitions, key transitions, tool create, checkout transitions, irrigation create/transition"
      - "DonationAllocation DISTRIBUTED transition; harvest log create (as logger)"
  - name: Volunteer
    description: "Registered volunteer; acts only on own signups, checkouts, harvest logs, crop plans; signs own waiver"
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations:
      - "POST /api/shift-signups (own), cancel/check-in/check-out (own)"
      - "POST /api/tool-checkouts (own), return (own)"
      - "POST /api/harvest-logs + PATCH + transition (own drafts; submit/discard)"
      - "POST /api/crop-plans (as proposer), resubmit/plant/withdraw (own)"
      - "POST /api/volunteers/{id}/waiver/sign (own id only)"
      - "all GET endpoints"
  - name: GroupLeader
    description: "Volunteer who leads an external group; superset of Volunteer self-service plus own group bookings"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/group-bookings (as leader_volunteer_id)"
      - "POST /api/group-bookings/{id}/transition CHECKED_IN / CANCELLED (own bookings)"
    shared_operations:
      - "all Volunteer shared operations (same identity backing)"
  - name: FoodSafetyOfficer
    description: "Produce-safety authority (is a Volunteer); issues/revokes certifications, verifies/rejects harvest logs, approves/rejects donation allocations; barred by SoD from verifying/approving own logged harvests and self-issuing certs"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/certifications, POST /api/certifications/{id}/revoke (shared with GardenAdmin)"
      - "HarvestLog VERIFIED / REJECTED transitions (shared with GardenAdmin)"
      - "DonationAllocation APPROVED / REJECTED transitions (shared with GardenAdmin)"
    shared_operations:
      - "all GET endpoints; POST /api/volunteers/{id}/waiver/sign (own)"
