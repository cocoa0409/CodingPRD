      - name: governance_advance_blocked_by_an_overdue_unbuilt_amenity
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TurnoverCase.ELECTION_HELD_to_OWNER_CONTROL
          - entities.CommonAreaComponent.fields.category
          - entities.CommonAreaComponent.fields.promised_completion_date
          - errors.ERR_UNBUILT_AMENITY_OUTSTANDING
          - validations[priority=13]
        distinguishing_aspect: "The unbuilt-amenity gate is narrow on three axes: category must be AMENITY, build_status must be UNBUILT or IN_PROGRESS, and promised_completion_date must be strictly before the logical clock. An overdue AMENITY blocks the advance with ERR_UNBUILT_AMENITY_OUTSTANDING (422) while an equally unbuilt INFRASTRUCTURE component and a not-yet-due AMENITY do not; completing the overdue one unblocks the identical call."
