              payload: { case_caption: "In re Dep2", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /opt-outs"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}" }
              as: ClaimsAdministrator
              captures: { oo_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
