            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /retainer-cycles"
              payload: { contract_id: "${contract_id}", cycle_start_utc: "2026-03-01T00:00:00Z", cycle_end_utc: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Eng R" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "P1", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep1: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep1}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T08:00:00Z", scheduled_end_utc: "2026-03-05T09:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/start"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep1}/lock-assets"
              payload: { raw_track_count: 1 }
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /deliverables"
              payload: { episode_id: "${ep1}", kind: "MASTER_AUDIO" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { d1: $.data.id }
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${d1}", integrated_loudness_lufs: -16.0 }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { av1: $.data.id }
            - call: "POST /asset-versions/${av1}/accept"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep1}/submit-edit"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep1}/approve-edit"
              payload: {}
