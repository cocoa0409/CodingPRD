  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_create_requires_available_aircraft
        grounds:
          - state_machines.Aircraft.AVAILABLE_to_IN_SHOP
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair WorkOrder->Aircraft: creating a work order is gated on the aircraft
          being AVAILABLE; with an open work order the aircraft is IN_SHOP and creation
          fails with ERR_AIRCRAFT_BUSY, while an AVAILABLE sibling aircraft accepts one.
        test_recipe:
          setup:
            - "One customer with aircraft N400CA (has open work order) and N401CB (available)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Busy Owner", contact_email: "busy@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
