  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- Instance 1: Appointment check-in depends on Barber.license_status (Appointment->Barber) ---
      - name: checkin_requires_barber_license_active
        grounds:
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - entities.Barber.fields.license_status
          - validations[priority=9]
          - errors[ERR_BARBER_NOT_ACTIVE]
        distinguishing_aspect: "Appointment's BOOKED->CHECKED_IN transition is gated by a different entity's state (Barber.license_status == ACTIVE); suspending the barber after booking makes check-in fail ERR_BARBER_NOT_ACTIVE. Entity pair: Appointment depends on Barber."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z; Shop OPEN; Barber ACTIVE then SUSPENDED; Chair; Shift 09:00–18:00; an appointment BOOKED at 16:00 (so suspend cascade — which cancels start_utc>clock — does NOT apply because we suspend AFTER setting clock past 16:00 is not done; we keep it BOOKED by suspending while it is the only future appt then re-check)."
            - "To keep the appointment BOOKED, the barber is suspended but the appointment start_utc (16:00) is in the future at suspend time, so the cascade would cancel it. Instead we set start_utc to 09:30 and suspend AFTER moving the clock to 10:00 so start_utc < clock and the cascade skips it (only future BOOKED appts are cancelled)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Gate Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0, late_grace_minutes: 1000 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: ShopOwner
            - call: "POST /barbers/${b_id}/license/suspend"
              payload: {}
              as: ShopOwner
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.status remains BOOKED (start 09:30 < clock 10:00, so suspend cascade skipped it)"
            - "check-in rejected with ERR_BARBER_NOT_ACTIVE (409)"

      # --- Instance 2: QueueTicket serve depends on Shop.status (QueueTicket->Shop), different pair ---
      - name: queue_serve_requires_shop_open
        grounds:
          - state_machines.QueueTicket.WAITING_to_SERVING
          - entities.Shop.fields.status
          - validations[priority=6]
          - errors[ERR_SHOP_CLOSED]
        distinguishing_aspect: "QueueTicket's WAITING->SERVING transition is gated by the Shop's status (must be OPEN); closing the shop (allowed because no OPEN ticket exists yet) then attempting to serve the waiting walk-in fails ERR_SHOP_CLOSED. Entity pair QueueTicket->Shop differs from instance 1's Appointment->Barber."
        test_recipe:
          setup:
            - "Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; one WAITING walk-in queue ticket (no OPEN ticket exists); shop then closed via /close (precondition satisfied: no OPEN ticket, no CHECKED_IN appointment)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Closeable Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /queue"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_barber_id: "${b_id}" }
              as: Receptionist
              captures: { q_id: $.data.id }
            - call: "POST /shops/${shop_id}/close"
              payload: {}
              as: ShopOwner
          trigger:
            - call: "POST /queue/${q_id}/serve"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "serving the WAITING ticket while Shop.status==CLOSED rejected with ERR_SHOP_CLOSED (409)"
            - "QueueTicket.status remains WAITING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Instance 1: appointment half-open overlap on a chair ---
      - name: appointment_chair_overlap_half_open
        grounds:
          - validations[priority=12]
          - errors[ERR_CHAIR_DOUBLE_BOOKED]
          - calculations.appointment_slot_end_utc
          - entities.Appointment.fields.chair_id
        distinguishing_aspect: "Appointment overlap uses HALF-OPEN [start,end) semantics: a second appointment whose start_utc equals the first's end_utc (touching) is accepted, but one starting one minute earlier (true overlap) is rejected ERR_CHAIR_DOUBLE_BOOKED. Resource: chair-appointments, touching-allowed semantics."
        test_recipe:
          setup:
            - "Clock 2026-06-10T08:00:00Z; Shop OPEN; Barber ACTIVE; Chair; Shift 09:00–18:00; Service Haircut(3000,30m). Appointment A at 10:00 (ends 10:30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Overlap Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
