          - entities.AuditEvent.fields.subject_kind
        distinguishing_aspect: >
          The trail is ordered by the per-broker sequence_no starting at 1, and the three optional
          filters narrow it without renumbering: event_type=CONSUMER_RECORDED yields exactly the
          sequence_no 3 event, subject_id=${consumer_id} yields the same single row, and an
          unfiltered limit=2 page reports total_count 3 with has_more true.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker, one 500000-cent fee deposit and one CA Consumer with no sensitive categories, so the trail holds exactly BROKER_REGISTERED, FEE_DEPOSITED and CONSUMER_RECORDED in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
