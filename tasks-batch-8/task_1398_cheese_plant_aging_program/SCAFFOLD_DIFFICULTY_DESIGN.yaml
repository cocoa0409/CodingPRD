  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: scc_exactly_at_400000_passes_accept
        grounds:
          - calculations.grade_assignment
          - validations[priority=6]
          - errors[ERR_SCC_LIMIT]
        distinguishing_aspect: |
          Numeric threshold boundary: SCC exactly == 400000 PASSES (rule is
          >-reject), while 400001 rejects — tested through the milk accept
          endpoint; metric is somatic_cell_count.
        test_recipe:
          setup:
            - "Two intakes, one SCC 400000, one SCC 400001"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant K", license_number: "WI-110" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-OK", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 400000 }, as: MilkReceiver, captures: { milk_ok: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-BAD", received_at: "2026-08-01T01:30:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 400001 }, as: MilkReceiver, captures: { milk_bad: $.data.id } }
          trigger:
            - { call: "POST /plant/milk-intakes/${milk_ok}/accept", payload: {}, as: MilkReceiver, captures: { st_ok: $.data.status } }
            - { call: "POST /plant/milk-intakes/${milk_bad}/accept", payload: {}, as: MilkReceiver, captures: { err_bad: $.data.error_id } }
          assert:
            - "st_ok == ACCEPTED (boundary value 400000 passes under >-reject semantics)"
            - "err_bad == ERR_SCC_LIMIT (400001 is one over)"

      - name: waste_gap_exactly_2pct_passes_reconcile
        grounds:
          - calculations.cut_wrap_waste_reconciliation
          - errors[ERR_WASTE_TOLERANCE]
        distinguishing_aspect: |
          Different metric and endpoint than instance 1: the cut-wrap waste gap
          on the reconcile endpoint. Gap exactly == 2.000% of input PASSES
          (<= semantics); 4.0 kg on a 180 kg input (2.222%) rejects. Metric is
          reconciliation_gap_kg.
        test_recipe:
          setup:
            - "RELEASED CHEDDAR batch with FILLED-eligible order (wheels_requested 10); two DRAFT runs: run_ok wheels_in 10, finished 150.0, trim 26.4 (gap 3.6 == exactly 2% of 180.0); run_bad on a second order wheels_in 10, finished 150.0, trim 26.0 (gap 4.0 > 3.6)"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant L", license_number: "WI-111" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 10000.0, fat_pct: 3.85, protein_pct: 3.10, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "CHEDDAR", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", liters_committed: 10000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 10.0, coagulant_ml_planned: 500.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
