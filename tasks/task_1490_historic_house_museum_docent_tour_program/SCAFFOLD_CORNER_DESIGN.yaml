      - name: frontdesk_cannot_review_script_forbidden
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Script review is exclusive to Curator (accuracy review is segregated from visitor-services duties); FrontDeskStaff gets 403."
        test_recipe:
          setup: ["script ${s1} IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Draft", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
