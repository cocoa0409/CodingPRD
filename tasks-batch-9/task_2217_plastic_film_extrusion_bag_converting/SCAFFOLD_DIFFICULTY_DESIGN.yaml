          - errors[ERR_STRENGTH_INDEX_BELOW_MIN]
          - entities.BlendRecipe.fields.strength_index
        distinguishing_aspect: |
          Mode (a) again but the OTHER branch of the same min() binds: R-NF-13 carries hdpe_pct
          60.000 (family_factor 1.000 - 0.004 x 30 = 0.880) and regrind_pct 35.000
          (regrind_factor clamped at the 0.800 floor because 1.000 - 0.006 x 35 = 0.790 is below
          it), so min() selects 0.800 and 24.8 x 0.800 = 19.84 -- multiplying the two factors
