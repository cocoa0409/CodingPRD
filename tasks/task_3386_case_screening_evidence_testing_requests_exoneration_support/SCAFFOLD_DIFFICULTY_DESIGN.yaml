            - { call: "POST /lab-analyses/${a2}/advance", payload: { event: "CANCEL" }, as: EvidenceAnalyst }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { rem4: $.data.remaining_sample_ng, tst4: $.data.testing_status }
          assert:
            - "after reserve 15: remaining == 10 and 25 == 10 + 15(reserved) + 0(consumed)"
            - "after settle consumed 12 of 15: remaining == 13 and 25 == 13 + 12 (under-consumption refund of 3 applied)"
            - "after reserve 5: remaining == 8 and 25 == 8 + 5(reserved) + 12(consumed)"
            - "after CANCEL of the 5ng reservation: remaining == 13 — forward reserve + compensating cancel leave the ledger exactly as before (13 == 25 - 12)"
            - "final testing_status == TESTED (a RESULT_RECORDED analysis exists, no active reservations, remaining 13 >= 5)"

