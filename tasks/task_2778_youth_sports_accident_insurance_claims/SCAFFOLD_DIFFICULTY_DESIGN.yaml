              as: ProgramAdministrator
              captures: { baseball_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "SWIM_U14", sport_name: "Swimming U14", hazard_class: "CLASS_1_LOW", base_rate_per_participant_cents: 900, deductible_cents: 10000, per_injury_limit_cents: 500000, cat_attachment_point_cents: 500000, aggregate_limit_cents: 4000000, cat_lifetime_max_cents: 800000, minimum_participants: 10, travel_buffer_minutes: 30, service_category_caps: { EMERGENCY_ROOM: 200000, SURGERY: 600000, DIAGNOSTIC_IMAGING: 120000, PHYSICAL_THERAPY: 15000, DENTAL: 100000, AMBULANCE: 80000, PHYSICIAN_OFFICE: 30000 } }
