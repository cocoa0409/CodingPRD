            - "the refreshed election is 201 and CmpElection.${election_id}.status == ELECTED"
            - "the list read returns total_count == 1 - the refused attempt wrote nothing"
            - "SanctionCase.${case_id}.status == CHARGE_ISSUED throughout"

      - name: civil_money_penalty_is_capped_and_reports_cmp_capped
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.civil_money_penalty_amount.constants.CMP_CAP_CENTS
          - calculations.civil_money_penalty_amount.constants.TRAFFICKING_CMP_MONTHS
          - calculations.cmp_in_lieu_eligibility
        distinguishing_aspect: "The statutory ceiling actually bites and is reported: a trafficking CMP on three closed periods of 8,000,000c each computes a monthly penalty of 800,000c which the 10-month trafficking multiplier would take to 8,000,000c, so the stored amount clamps to 6,900,000c with cmp_capped true - and the ledger, the case balance and the owner rollup all carry the capped figure, not the raw product."
        test_recipe:
          setup:
            - "The hardship CONVENIENCE store authorized on 2026-08-01 with three CLOSED periods (indices 5, 6 and 7) each carrying an imported total of 8,000,000c, and a substantiated trafficking investigation with a charge letter, a timely election and a reply."
