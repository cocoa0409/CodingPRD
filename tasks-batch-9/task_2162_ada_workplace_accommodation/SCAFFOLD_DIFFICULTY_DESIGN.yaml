      - name: doc_round_at_limit_allowed_next_round_rejected
        grounds:
          - calculations.documentation_budget
          - validations[priority=62]
          - errors[ERR_DOC_REQUEST_LIMIT_EXCEEDED]
          - entities.AccommodationRequest.fields.documentation_budget_remaining
        distinguishing_aspect: |
          The metric is the discrete documentation-round counter against
          BASE_DOC_REQUEST_LIMIT 2 on POST
          /accommodation-requests/{id}/medical-doc-requests: the round that
          takes the count from 1 to exactly 2 succeeds and the next one is
          rejected, a discrete-quota boundary distinct from both the
          hardship-score threshold and the empty-set boundary.
        test_recipe:
