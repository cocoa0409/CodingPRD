    claim_type: aggregation
    grounds:
    - calculations.engagement_hour_ledger
    excluded_because:
      difficulty_instance: engagement_hour_pool_is_conserved_across_allocation_cancel_and_reallocation
      rationale: Running total after add, after cancel and after reallocation is asserted there together with the conservation
        identity.
