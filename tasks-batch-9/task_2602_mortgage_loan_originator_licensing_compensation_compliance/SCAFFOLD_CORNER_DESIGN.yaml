              captures: { pe_st: $.data.status, dec: $.data.decided_by_user_id, sec: $.data.second_decided_by_user_id, imp: $.data.comp_impact_cents }
          assert:
            - "${drafter} == dual-1"
            - "HTTP status is 422 on the self-approval, ${err1} == ERR_SEGREGATION_OF_DUTIES"
            - "${mid_plan_st} == DRAFT and ${mid_appr} == null"
            - "HTTP status is 200 for officer-1, ${plan_st} == ACTIVE, ${plan_appr} == officer-1"
            - "${requester} == ${orig_id} and ${needs2} == false (monitoring_status is STANDARD)"
            - "HTTP status is 422 on the decision presented as the requester,
               ${err2} == ERR_SEGREGATION_OF_DUTIES"
            - "${mid_pe_st} == SUBMITTED and ${mid_dec} == null"
            - "HTTP status is 200 for officer-1, ${pe_st} == APPROVED, ${dec} == officer-1"
            - "${sec} == null (requires_second_approval is false) and ${imp} == 0
               (concession_absorption_enabled is false)"

      - name: every_role_can_read_the_shared_originator_and_audit_surface
        claim_type: shared_operations
        grounds:
          - roles.LicensingAnalyst.shared_operations
          - roles.CompensationDesigner.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - roles.Originator.shared_operations
          - roles.LoanOperations.shared_operations
          - roles.ExaminationCoordinator.shared_operations
          - roles.PlatformAdmin.shared_operations
        distinguishing_aspect: |
          All twenty-six read endpoints are shared by all seven roles; GET /originators/{id} is
          exercised from every role and returns the identical row and version each time,
          including from PlatformAdmin (which holds no business write authority) and from
          ExaminationCoordinator (which has no authority over licences or compensation). The
          Originator read still requires X-User-ID to be a real Originator.id, but the ownership
          check does not restrict which originator may be read.
        test_recipe:
          setup:
            - "One Originator 2200001 at clock 2026-08-01T00:00:00Z with one ACTIVE but
               UNSPONSORED CA licence, so exactly one AuditEvent (LICENSE_STATUS_CHANGED from the
               activation) exists and authorized_state_codes is still empty."
