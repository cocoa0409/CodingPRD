              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 10.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { f1_bench: "$.data.bench_cost_per_kg_cents" }
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
