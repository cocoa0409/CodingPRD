# =============================================================================
# Task 1168 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every setup_api_calls / trigger chain is replayable against SCAFFOLD.yaml
# §1.2/§1.4/§1.6 from empty-DB. Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hybrid_rate_sample_only_vs_admin_supplemented
        grounds:
          - calculations.rate_determination
          - entities.MeasureRun.fields.hybrid_rate
          - entities.MeasureRun.fields.sample_numerator_count
          - entities.MeasureSpecification.fields.hybrid_policy
        distinguishing_aspect: |
          MeasureRun domain: on byte-identical chase/abstraction/supplemental evidence, the
          SAMPLE_ONLY variant counts only abstraction HITs (hybrid_rate 0.5) while
          ADMIN_SUPPLEMENTED OR-s in administrative compliance (hybrid_rate 1.0) — the variant
          selected by the pinned spec's hybrid_policy changes the numerator for identical data.
        test_recipe:
          setup:
            - "Season MY2025 (deadline 2026-06-15, approved sources [LAB_FEED]), OPEN, logical clock at 2026-03-01"
            - "Two ACTIVE HYBRID specs: BCS-SO (hybrid_policy SAMPLE_ONLY) and BCS-AS (ADMIN_SUPPLEMENTED), both sample_size_floor 2, age 50-74, gender F, 12-month enrollment window, anchor 2025-12-31"
            - "Members M001 and M002 (F, born 1960-01-01 -> age 65 at anchor, attributed to provider P1), each enrolled [2025-01-01, 2025-12-31]"
            - "Each run: denominator 2, sample drawn 2 (both members), both chases RECEIVED; abstraction on M001's chase = MISS, on M002's chase = HIT, both submitted by abs-1; first-submitted abstraction over-read AGREE by orr-1; IRR evaluated PASSED; sample FINALIZED"
            - "Each run: a LAB_FEED batch with one in-window MAMMO record for M001 is SCREENED (accepted_record_count 1) and ACCEPTED (M001 entry admin_compliant=true in BOTH runs)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS-SO", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, allowable_gap_days: 45, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_so: $.data.id }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { season_v2: $.data.version } }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS-AS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "ADMIN_SUPPLEMENTED", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, allowable_gap_days: 45, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v2}" }
              as: QualityAdmin
              captures: { spec_as: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_so}/activate", as: QualityAdmin }
            - { call: "POST /hedis/measure-specifications/${spec_as}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_so}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { run_so: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_so}/identify-population", as: QualityAnalyst, as_user_id: "qa-1", captures: { den_so: $.data.denominator_count } }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_so}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { smp_so: $.data.id, drawn_so: $.data.drawn_size } }
            - { call: "GET /hedis/samples/${smp_so}/chart-chases", as: QualityAnalyst, captures: { c1so: "$.data[0].id", c1so_m: "$.data[0].member_ref", c2so: "$.data[1].id", c2so_m: "$.data[1].member_ref" } }
            - { call: "POST /hedis/chart-chases/${c1so}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c2so}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1so}", result: "MISS" }, as: Abstractor, as_user_id: "abs-1", captures: { a1so: $.data.id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c2so}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a2so: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1so}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a2so}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1so}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "POST /hedis/samples/${smp_so}/evaluate-irr", as: QualityAnalyst, captures: { irr_so: $.data.irr_ratio, irrst_so: $.data.irr_state } }
            - { call: "POST /hedis/samples/${smp_so}/finalize", as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_so}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b_so: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_so}", member_ref: "M001", service_date: "2025-06-10T00:00:00Z", evidence_code: "MAMMO" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b_so}/screen", as: QualityAnalyst, captures: { acc_so: $.data.accepted_record_count } }
            - { call: "POST /hedis/supplemental-batches/${b_so}/accept", as: QualityAnalyst }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_as}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { run_as: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_as}/identify-population", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_as}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { smp_as: $.data.id } }
            - { call: "GET /hedis/samples/${smp_as}/chart-chases", as: QualityAnalyst, captures: { c1as: "$.data[0].id", c1as_m: "$.data[0].member_ref", c2as: "$.data[1].id", c2as_m: "$.data[1].member_ref" } }
            - { call: "POST /hedis/chart-chases/${c1as}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c2as}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1as}", result: "MISS" }, as: Abstractor, as_user_id: "abs-1", captures: { a1as: $.data.id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c2as}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a2as: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1as}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a2as}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1as}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "POST /hedis/samples/${smp_as}/evaluate-irr", as: QualityAnalyst }
            - { call: "POST /hedis/samples/${smp_as}/finalize", as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_as}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b_as: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_as}", member_ref: "M001", service_date: "2025-06-10T00:00:00Z", evidence_code: "MAMMO" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b_as}/screen", as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b_as}/accept", as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_so}", as: QualityAnalyst, captures: { v_so: $.data.version } }
            - { call: "GET /hedis/measure-runs/${run_as}", as: QualityAnalyst, captures: { v_as: $.data.version } }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_so}/compute-rate", payload: { expected_measure_run_version: "${v_so}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { hr_so: $.data.hybrid_rate, sn_so: $.data.sample_numerator_count, an_so: $.data.admin_numerator_count, fr_so: $.data.final_rate } }
            - { call: "POST /hedis/measure-runs/${run_as}/compute-rate", payload: { expected_measure_run_version: "${v_as}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { hr_as: $.data.hybrid_rate, sn_as: $.data.sample_numerator_count, an_as: $.data.admin_numerator_count, fr_as: $.data.final_rate } }
          assert:
            - "c1so_m == 'M001' and c2so_m == 'M002' (draw mints chases in member_ref ASC order)"
            - "den_so == 2 and drawn_so == 2"
            - "acc_so == 1 — the M001 record is accepted in the SAMPLE_ONLY run too (evidence identical across runs)"
            - "irr_so == 1.0 and irrst_so == 'PASSED'"
            - "sn_so == 1 — SAMPLE_ONLY counts only the M002 abstraction HIT; M001's admin evidence is ignored"
            - "an_so == 1 — admin numerator counts M001 in both variants"
            - "hr_so == 0.5 and fr_so == 0.5 (1/2, 4dp round_half_up)"
            - "sn_as == 2 — ADMIN_SUPPLEMENTED counts M002's HIT OR M001's admin_compliant"
            - "hr_as == 1.0 and fr_as == 1.0 (2/2)"
            - "hr_so != hr_as — identical evidence, divergent rates purely from the variant"

      - name: supplemental_exact_vs_tolerant_matching
        grounds:
          - calculations.supplemental_record_matching
          - entities.SupplementalDataBatch.fields.accepted_record_count
          - entities.MeasureSpecification.fields.matching_policy
        distinguishing_aspect: |
          SupplementalDataBatch domain (not MeasureRun): EXACT matching string-compares raw
          member_ref values (accepted_record_count 0), while TOLERANT normalizes case,
          whitespace, and leading zeros of digit-only refs (accepted_record_count 2) — for
          byte-identical record payloads.
        test_recipe:
          setup:
            - "Season MY2025, OPEN, approved sources [LAB_FEED], clock 2026-03-01"
            - "Two ACTIVE ADMINISTRATIVE specs: SCR-EX (matching_policy EXACT) and SCR-TO (TOLERANT), age 0-100, gender ANY, 12-month window, anchor 2025-12-31"
            - "Members 'M777' and '4001' (no provider attribution), each enrolled all of 2025; one run per spec, each with denominator 2"
            - "Each run has one LAB_FEED batch holding the SAME two records: {member_ref ' m777 ', 2025-03-05, A1C} and {member_ref '04001', 2025-04-05, A1C}"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "SCR-EX", version_label: "2025.1", collection_method: "ADMINISTRATIVE", matching_policy: "EXACT", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_ex: $.data.id }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { season_v2: $.data.version } }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "SCR-TO", version_label: "2025.1", collection_method: "ADMINISTRATIVE", matching_policy: "TOLERANT", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v2}" }
              as: QualityAdmin
              captures: { spec_to: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_ex}/activate", as: QualityAdmin }
            - { call: "POST /hedis/measure-specifications/${spec_to}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M777", birth_date: "1980-06-15T00:00:00Z", gender: "M" }, as: QualityAdmin, captures: { m_a: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "4001", birth_date: "1980-06-15T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m_b: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m_a}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m_b}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_ex}" }, as: QualityAnalyst, captures: { run_ex: $.data.id } }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_to}" }, as: QualityAnalyst, captures: { run_to: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_ex}/identify-population", as: QualityAnalyst, captures: { den_ex: $.data.denominator_count } }
            - { call: "POST /hedis/measure-runs/${run_to}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_ex}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b_ex: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_ex}", member_ref: " m777 ", service_date: "2025-03-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_ex}", member_ref: "04001", service_date: "2025-04-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_to}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b_to: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_to}", member_ref: " m777 ", service_date: "2025-03-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b_to}", member_ref: "04001", service_date: "2025-04-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/supplemental-batches/${b_ex}/screen", as: QualityAnalyst, captures: { acc_ex: $.data.accepted_record_count, mp_ex: $.data.matching_policy_used } }
            - { call: "POST /hedis/supplemental-batches/${b_to}/screen", as: QualityAnalyst, captures: { acc_to: $.data.accepted_record_count, mp_to: $.data.matching_policy_used } }
            - { call: "GET /hedis/supplemental-batches/${b_ex}/records", as: QualityAnalyst, captures: { d_ex0: "$.data[0].disposition", d_ex1: "$.data[1].disposition" } }
            - { call: "GET /hedis/supplemental-batches/${b_to}/records", as: QualityAnalyst, captures: { d_to0: "$.data[0].disposition", d_to1: "$.data[1].disposition" } }
          assert:
            - "den_ex == 2"
            - "mp_ex == 'EXACT' and acc_ex == 0 — raw refs ' m777 ' / '04001' do not string-equal 'M777' / '4001'"
            - "d_ex0 == 'REJECTED_UNKNOWN_MEMBER' and d_ex1 == 'REJECTED_UNKNOWN_MEMBER'"
            - "mp_to == 'TOLERANT' and acc_to == 2 — normalize(' m777 ')=='M777'; normalize('04001')=='4001' (digit-only refs get leading zeros stripped)"
            - "d_to0 == 'ACCEPTED' and d_to1 == 'ACCEPTED'"
            - "acc_ex != acc_to on identical payloads — variant divergence on the SupplementalDataBatch domain"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overread_fraction_tier_escalation
        grounds:
          - calculations.overread_fraction_tiering
          - entities.Sample.fields.required_overread_fraction
          - entities.Sample.fields.remediation_count
          - entities.Abstraction.fields.requires_overread
        distinguishing_aspect: |
          Mode (a) combinatorial: required_overread_fraction is a non-linear function of three
          inputs (irr_ratio tier boundaries 0.95/0.90, remediation_count hard override at 2,
          submitted_count through ceil) with state-conditional branches; this instance exercises
          the <0.90 -> 1.0 branch, the remediation-driven selector top-up, and the >=0.95 ->
          0.10 branch in one remediation cycle.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS, floor 2, SAMPLE_ONLY, age 50-74 F, anchor 2025-12-31"
            - "Members M001/M002 (F, 1960-01-01, provider P1), full-year enrollment; run POPULATED (denominator 2), sample drawn 2, chases C1(M001)/C2(M002) RECEIVED"
            - "a1 = abstraction(C1, HIT) and a2 = abstraction(C2, HIT), both SUBMITTED by abs-1 in that order; default fraction 0.10 flags only a1 (ceil(0.10*1)=1 at first submit; ceil(0.10*2)=1 after second)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c2}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c2}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a2: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a2}/submit", as: Abstractor, as_user_id: "abs-1", captures: { a2_ro_pre: $.data.requires_overread } }
          trigger:
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "DISAGREE", final_result: "MISS" }, as: OverReader, as_user_id: "orr-1", captures: { or1: $.data.id } }
            - { call: "GET /hedis/abstractions/${a1}", as: QualityAnalyst, captures: { a1_st: $.data.status } }
            - { call: "GET /hedis/abstractions/${a2}", as: QualityAnalyst, captures: { a2_ro_mid: $.data.requires_overread } }
            - { call: "GET /hedis/samples/${smp}", as: QualityAnalyst, captures: { rc_mid: $.data.remediation_count } }
            - { call: "POST /hedis/samples/${smp}/evaluate-irr", as: QualityAnalyst, captures: { irr_1: $.data.irr_ratio, st_1: $.data.irr_state, frac_1: $.data.required_overread_fraction } }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a2}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "POST /hedis/abstractions/${a1}/retract", as: Abstractor, as_user_id: "abs-1", captures: { a1_rs: $.data.resubmission_count } }
            - { call: "PUT /hedis/abstractions/${a1}", payload: { result: "MISS" }, as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1", captures: { a1_ro_post: $.data.requires_overread } }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "POST /hedis/samples/${smp}/evaluate-irr", as: QualityAnalyst, captures: { irr_2: $.data.irr_ratio, st_2: $.data.irr_state, frac_2: $.data.required_overread_fraction } }
          assert:
            - "a2_ro_pre == false — at fraction 0.10 with 2 submitted, only the earliest-submitted a1 is flagged"
            - "a1_st == 'REMEDIATION' after the DISAGREE"
            - "rc_mid == 1"
            - "a2_ro_mid == true — a1 leaving SUBMITTED re-runs the selector top-up and flags a2"
            - "irr_1 == 0.0 and st_1 == 'FAILED' (0 agreements / 1 latest review)"
            - "frac_1 == 1.0 — irr_ratio 0.0 < 0.90 selects the FULL tier (remediation_count 1 is below the override of 2)"
            - "a1_rs == 1 — leaving REMEDIATION advanced the submission round, unlocking a fresh over-read"
            - "a1_ro_post == true — under fraction 1.0 the resubmitted abstraction is flagged again"
            - "irr_2 == 1.0 and st_2 == 'PASSED' (latest reviews: a1 round-1 AGREE + a2 AGREE = 2/2)"
            - "frac_2 == 0.10 — ratio >= 0.95 selects the BASE tier"

      - name: provider_gap_burden_per_line_rounding
        grounds:
          - calculations.provider_gap_burden
          - entities.Provider.fields.open_gap_count
          - entities.MeasureSpecification.fields.reporting_weight
        distinguishing_aspect: |
          Mode (b) combinatorial: the burden pins per-line rounding THEN summation — with weight
          0.125 and 3 open gaps per run, round_half_up(3 x 0.375... exact 0.375, 2dp) = 0.38 per
          line, summed to 0.76; the rejected sum-then-round order would yield round(6 x 0.125)=0.75.
          Inputs are binary-exact so no float ambiguity exists.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; two ACTIVE ADMINISTRATIVE specs GPA and GPB, both reporting_weight 0.125, age 0-100 ANY, 12-month window"
            - "Provider P1; members M01..M06 all attributed to P1 and enrolled all of 2025"
            - "run_a (GPA) covers M01-M03, run_b (GPB) covers M04-M06; both computed with no evidence -> 3 OPEN gaps each, all attributed to P1"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "GPA", version_label: "2025.1", collection_method: "ADMINISTRATIVE", reporting_weight: 0.125, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_a: $.data.id }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { season_v2: $.data.version } }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "GPB", version_label: "2025.1", collection_method: "ADMINISTRATIVE", reporting_weight: 0.125, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v2}" }
              as: QualityAdmin
              captures: { spec_b: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_a}/activate", as: QualityAdmin }
            - { call: "POST /hedis/measure-specifications/${spec_b}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin, captures: { prov: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M01", birth_date: "1990-01-01T00:00:00Z", gender: "M", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m01: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M02", birth_date: "1990-01-01T00:00:00Z", gender: "M", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m02: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M03", birth_date: "1990-01-01T00:00:00Z", gender: "M", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m03: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M04", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m04: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M05", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m05: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M06", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m06: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m01}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m02}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m03}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m04}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m05}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m06}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_a}" }, as: QualityAnalyst, captures: { run_a: $.data.id } }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_b}" }, as: QualityAnalyst, captures: { run_b: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_a}/identify-population", as: QualityAnalyst, captures: { den_a: $.data.denominator_count } }
            - { call: "POST /hedis/measure-runs/${run_b}/identify-population", as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_a}", as: QualityAnalyst, captures: { va: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_a}/compute-rate", payload: { expected_measure_run_version: "${va}" }, as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_b}", as: QualityAnalyst, captures: { vb: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_b}/compute-rate", payload: { expected_measure_run_version: "${vb}" }, as: QualityAnalyst }
          trigger:
            - { call: "GET /hedis/providers/${prov}/gap-burden", payload: { season_id: "${season_id}" }, as: ProviderRelations, captures: { burden: $.data.burden_score, ogc: $.data.open_gap_count, lines: $.data.per_measure_lines } }
          assert:
            - "den_a == 3"
            - "ogc == 6 and lines == 2"
            - "burden == 0.76 — per-line round_half_up(3 * 0.125 = 0.375, 2dp) == 0.38 per run; 0.38 + 0.38 == 0.76 (the rejected sum-then-round order would give round_half_up(0.75) == 0.75)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: chart_chase_rechase_cycles
        grounds:
          - state_machines.ChartChase.RECEIVED_to_REJECTED_UNREADABLE
          - state_machines.ChartChase.REJECTED_UNREADABLE_to_REQUESTED
          - state_machines.ChartChase.REQUESTED_to_WITHDRAWN
          - state_machines.ChartChase.WITHDRAWN_to_REQUESTED
        distinguishing_aspect: |
          ChartChase is a CYCLIC machine with two distinct loops re-entering REQUESTED
          (RECEIVED->REJECTED_UNREADABLE->REQUESTED and REQUESTED->WITHDRAWN->REQUESTED), with
          chase_round monotonically increasing per loop traversal — non-linear shape on the
          ChartChase entity (the sibling instance uses MeasureRun).
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS floor 2 SAMPLE_ONLY; members M001/M002 (F 1960-01-01, provider P1) enrolled all 2025"
            - "Run POPULATED (denominator 2); sample drawn; chases C1 (M001) and C2 (M002) minted in member_ref ASC order, both REQUESTED at chase_round 1"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c1_m: "$.data[0].member_ref", c2: "$.data[1].id" } }
          trigger:
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst, captures: { s1: $.data.status } }
            - { call: "POST /hedis/chart-chases/${c1}/reject-unreadable", as: QualityAnalyst, captures: { s2: $.data.status } }
            - { call: "POST /hedis/chart-chases/${c1}/rechase", as: QualityAnalyst, captures: { s3: $.data.status, r3: $.data.chase_round } }
            - { call: "POST /hedis/chart-chases/${c1}/withdraw", as: QualityAnalyst, captures: { s4: $.data.status } }
            - { call: "POST /hedis/chart-chases/${c1}/rechase", as: QualityAnalyst, captures: { s5: $.data.status, r5: $.data.chase_round } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst, captures: { s6: $.data.status } }
            - { call: "POST /hedis/chart-chases/${c2}/reject-unreadable", as: QualityAnalyst, captures: { err: $.data.error_id } }
            - { call: "GET /hedis/chart-chases/${c2}", as: QualityAnalyst, captures: { c2_st: $.data.status, c2_rd: $.data.chase_round } }
          assert:
            - "c1_m == 'M001'"
            - "s1 == 'RECEIVED' and s2 == 'REJECTED_UNREADABLE'"
            - "s3 == 'REQUESTED' and r3 == 2 — first loop traversal increments chase_round by exactly 1"
            - "s4 == 'WITHDRAWN'"
            - "s5 == 'REQUESTED' and r5 == 3 — second loop (withdraw/rechase) increments again"
            - "s6 == 'RECEIVED' — the cycle closes and the chase is receivable again"
            - "err == 'ERR_INVALID_STATE' — reject-unreadable is invalid from REQUESTED"
            - "c2_st == 'REQUESTED' and c2_rd == 1 — the rejected transition had no side effects"

      - name: measure_run_certification_reopen_cycle
        grounds:
          - state_machines.MeasureRun.SUBMITTED_to_CERTIFICATION_FAILED
          - state_machines.MeasureRun.CERTIFICATION_FAILED_to_POPULATED
          - state_machines.MeasureRun.RATE_COMPUTED_to_SUBMITTED
          - state_machines.MeasureRun.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          MeasureRun combines a CYCLIC reporting_status loop (SUBMITTED -> CERTIFICATION_FAILED
          -> POPULATED -> RATE_COMPUTED -> SUBMITTED -> CERTIFIED) with a PARALLEL audit_status
          dimension (UNAUDITED -> IN_REVIEW -> AUDIT_FAILED -> IN_REVIEW -> AUDIT_PASSED)
          evolving independently on the same entity — non-linear shape on MeasureRun (the
          sibling instance uses ChartChase).
        test_recipe:
          setup:
            - "Season MY2025 OPEN (deadline 2026-06-15), clock 2026-03-01; ACTIVE ADMINISTRATIVE spec CBP age 0-100 ANY"
            - "Member M01 (M, 1990-01-01, no provider) enrolled all 2025; run created by qa-1, POPULATED (denominator 1), RATE_COMPUTED (admin_rate 0.0), then SUBMITTED by qa-1"
            - "Audit engagement E1 for auditor aud-1 covering [2026-01-01, 2026-07-01) is IN_REVIEW"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M01", birth_date: "1990-01-01T00:00:00Z", gender: "M" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, as_user_id: "qa-1", captures: { den: $.data.denominator_count } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/measure-runs/${run_id}/submit", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-1", window_start: "2026-01-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }, as: Auditor, captures: { eng1: $.data.id } }
            - { call: "POST /hedis/audit-engagements/${eng1}/begin-review", as: Auditor }
          trigger:
            - { call: "POST /hedis/audit-engagements/${eng1}/complete", payload: { outcome: "FAIL" }, as: Auditor }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { aud_after_fail: $.data.audit_status } }
            - { call: "GET /hedis/audit-engagements/${eng1}/findings", as: Auditor, captures: { f1: "$.data[0].id", f1_sev: "$.data[0].severity" } }
            - { call: "POST /hedis/measure-runs/${run_id}/certify", payload: { decision: "FAILED" }, as: QualityDirector, as_user_id: "dir-1", captures: { rep_failed: $.data.reporting_status } }
            - { call: "POST /hedis/measure-runs/${run_id}/reopen", as: QualityAnalyst, as_user_id: "qa-1", captures: { rep_reopen: $.data.reporting_status, aud_reopen: $.data.audit_status } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v2}" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/measure-runs/${run_id}/submit", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-1", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }, as: Auditor, captures: { eng2: $.data.id } }
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-07-02T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/audit-engagements/${eng2}/begin-review", as: Auditor }
            - { call: "POST /hedis/audit-findings/${f1}/resolve", as: Auditor }
            - { call: "POST /hedis/audit-engagements/${eng2}/complete", payload: { outcome: "PASS" }, as: Auditor }
            - { call: "POST /hedis/measure-runs/${run_id}/certify", payload: { decision: "CERTIFIED" }, as: QualityDirector, as_user_id: "dir-1", captures: { rep_final: $.data.reporting_status, aud_final: $.data.audit_status, cert_by: $.data.certified_by_user_id } }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { crc: $.data.certified_run_count } }
          assert:
            - "den == 1"
            - "aud_after_fail == 'AUDIT_FAILED' — FAIL outcome moved the parallel audit dimension"
            - "f1_sev == 'CRITICAL' — completing with FAIL auto-minted an OPEN CRITICAL finding"
            - "rep_failed == 'CERTIFICATION_FAILED' (director dir-1 != submitter qa-1 satisfies SoD)"
            - "rep_reopen == 'POPULATED' and aud_reopen == 'UNAUDITED' — reopen closes the cycle and resets the audit dimension independently"
            - "rep_final == 'CERTIFIED' and aud_final == 'AUDIT_PASSED' and cert_by == 'dir-1' — second pass through the loop succeeds after re-review"
            - "crc == 1 — certify cascade incremented the season counter"
            - "engagement E2 window [2026-07-01, 2026-08-01) was accepted although adjacent to E1's end 2026-07-01 (half-open adjacency); begin-review required the clock at 2026-07-02 inside E2's window"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: overread_disagree_remediation_cascade
        grounds:
          - state_machines.Abstraction.SUBMITTED_to_REMEDIATION
          - entities.Sample.fields.remediation_count
          - entities.Sample.fields.required_overread_fraction
          - entities.Abstraction.fields.requires_overread
          - calculations.overread_fraction_tiering
        distinguishing_aspect: |
          Depth-4 chain rooted at POST /hedis/over-reads (DISAGREE): the review mutates the
          abstraction (B: SUBMITTED->REMEDIATION); that mutation increments
          sample.remediation_count (C); the count reaching 2 forces
          sample.required_overread_fraction := 1.0 (D); the new fraction re-runs the selector
          and flags the still-SUBMITTED sibling a3 (E). Each link is caused by the previous
          link, not by the original request, and the trigger differs from the sibling cascade
          (supplemental batch accept).
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS floor 3 SAMPLE_ONLY; members M001/M002/M003 (F 1960-01-01, P1) enrolled all 2025"
            - "Run POPULATED (denominator 3); sample drawn 3; chases C1/C2/C3 RECEIVED; a1(C1,HIT), a2(C2,HIT), a3(C3,HIT) all SUBMITTED by abs-1 in that order — fraction 0.10 flags only a1 (ceil(0.10*3)=1)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 3, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M003", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m3: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m3}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
