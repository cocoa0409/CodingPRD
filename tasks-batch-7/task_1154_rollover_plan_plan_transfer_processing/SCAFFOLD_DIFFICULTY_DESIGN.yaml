            - "link 2: RolloverCase.${c1}.status == COMPLETED (${c_status}) with credited_total_cents == 10800000 (${c_credited})"
            - "link 3: all three notices SKIPPED (${n1}, ${n2}, ${n3}) — skipped because the case completed, not because of the redeposit directly"
            - "link 3: DRAFT 1099-R corrected variant taxable_amount_cents == 0 (${f_taxable}) = 9500000 - min(10800000, 9500000)"
            - "5498 aggregate: rollover_contribution_cents == 10800000 (${f5498}), tax_year == 2026 (${f5498_year}), fair_market_value_cents == 10800000 (${f5498_fmv})"

      - name: document_rejection_reopens_docs_loop
        grounds:
          - state_machines.RequiredDocument.SUBMITTED_to_REJECTED
          - state_machines.RolloverCase.ELIGIBILITY_REVIEW_to_DOCS_PENDING
        distinguishing_aspect: |
          Depth-2 cascade from a third distinct trigger (document review): RequiredDocument
          SUBMITTED -> REJECTED (link 1) itself forces the owning RolloverCase
          ELIGIBILITY_REVIEW -> DOCS_PENDING (link 2), and an APPROVE attempt in that state
          is then rejected ERR_CASE_INVALID_STATE.
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01; P1 SEPARATED SINGLE; account A1 PRE_TAX 500,000"
            - "INDIRECT case submitted; both docs submitted -> case ELIGIBILITY_REVIEW with docs still SUBMITTED"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { st_pre: "$.data.status" } }
          trigger:
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "REJECTED", review_note: "name mismatch" }, as: RolloverProcessor, as_user_id: "proc-1", captures: { d1_status: "$.data.status" } }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { st_post: "$.data.status" } }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1", captures: { approve_err: "$.data.error_id" } }
          assert:
            - "precondition observed: case was ELIGIBILITY_REVIEW (${st_pre}) before the rejection"
            - "link 1: document ${d1}.status == REJECTED (${d1_status})"
            - "link 2: case fell back ELIGIBILITY_REVIEW -> DOCS_PENDING (${st_post}) as a consequence of the document rejection"
            - "APPROVE in the regressed state is rejected with ERR_CASE_INVALID_STATE (${approve_err})"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_disbursement_issue
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_DISBURSEMENT_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): a disbursement issue attempt that
          violates BOTH the state precondition (disbursement already CANCELLED) and the
          temporal freeze-window rule (clock 2026-06-15 inside window [2026-06-10,
          2026-06-20]) MUST surface the state error ERR_DISBURSEMENT_INVALID_STATE because
          priority 4 precedes priority 7.
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01; P1 SEPARATED SINGLE; canonical A1"
            - "Partial INDIRECT case approved; disbursement assembled PENDING then cancelled (balances restored)"
            - "Freeze window [2026-06-10, 2026-06-20] on Plan A; clock advanced to 2026-06-15 (inside the window)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", requested_amount_cents: 1000000, withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "ACH" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { disb: "$.data.id" } }
            - { call: "POST /v1/disbursements/${disb}/cancel", payload: {}, as: RolloverProcessor, as_user_id: "proc-2" }
            - { call: "POST /v1/plans/${plan_a}/freeze-windows", payload: { start_date: "2026-06-10", end_date: "2026-06-20", reason: "recordkeeper conversion blackout" }, as: PlanSponsorAdmin, captures: { fw: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: OperationsAgent }
          trigger:
            - { call: "POST /v1/disbursements/${disb}/issue", payload: {}, as: RolloverProcessor, as_user_id: "proc-2", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/accounts/${a1}", as: RolloverProcessor, captures: { vested_after: "$.data.vested_balance_cents" } }
          assert:
            - "dual-failure resolves to the higher-priority category: error_id == ERR_DISBURSEMENT_INVALID_STATE (${err}), NOT ERR_DISBURSEMENT_IN_FREEZE_WINDOW"
            - "no side effects leaked: Account.${a1}.vested_balance_cents == 10800000 (${vested_after})"

      - name: referential_beats_fiscal_on_redeposit
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_ACCOUNT_PARTICIPANT_MISMATCH]
        distinguishing_aspect: |
          Error-category pair (business_referential, business_fiscal) — different from the
          sibling's (state, business_temporal): a redeposit that names another participant's
          receiving account AND exceeds the remaining shortfall (20,000,000 > 10,800,000)
          MUST surface ERR_ACCOUNT_PARTICIPANT_MISMATCH (priority 6) over
          ERR_DEPOSIT_EXCEEDS_REMAINING (priority 9).
        test_recipe:
          setup:
            - "Plan A + IRA plan, clock 2026-06-01; P1 SEPARATED SINGLE with canonical A1; P2 SINGLE SEPARATED with IRA account A2"
            - "Full INDIRECT case for P1 issued at 2026-06-01 (gross 10,800,000, nothing credited yet)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/plans", payload: { plan_name: "IRA Plan", plan_type: "IRA" }, as: PlanSponsorAdmin, captures: { plan_ira: "$.data.id" } }
