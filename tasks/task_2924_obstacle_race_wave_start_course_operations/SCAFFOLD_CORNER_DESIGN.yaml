          assert:
            - "Venue.${venue_id}.disturbed_area_sqm == 4500"
            - "RestorationTask.${rt1_id}.status == VERIFIED, bond_release_cents == 333333 and inspection_rounds == 1"
            - "RestorationTask.${rt2_id} and ${rt3_id} are still PENDING with bond_release_cents == 0 and inspection_rounds == 0"
            - "The read returns Venue.${venue_id}.bond_released_cents == 333333 and bond_held_cents == 666667"
            - "Venue.${venue_id}.bond_forfeited_cents == 0 and the three cent fields sum to 1000000"
            - "Venue.${venue_id}.site_posture is still OPEN"

