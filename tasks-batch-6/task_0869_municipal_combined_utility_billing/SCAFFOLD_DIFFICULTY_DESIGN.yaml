              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CollectionsOfficer
            - call: "POST /bills/${b_id}/mark-delinquent"
              payload: {}
              as: CollectionsOfficer
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: CollectionsOfficer
            - call: "POST /bills/${b_id}/mark-delinquent"
              payload: {}
              as: CollectionsOfficer
          assert:
            - "first mark-delinquent (2026-06-10) returns error_id == ERR_NOT_YET_DELINQUENT (409)"
            - "second mark-delinquent (2026-06-11) succeeds; Bill.${b_id}.collection_status == DELINQUENT"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shutoff_execute_depends_on_moratorium_window
        grounds:
