          setup:
            - "Title NOVA-29, one string key, DE market plan FULL_VOICE at IN_LOCALIZATION."
            - "Booth BER-K with turnaround_buffer_minutes 45."
            - "Talents Erik and Fritz, each with a SIGNED DE-covering contract."
