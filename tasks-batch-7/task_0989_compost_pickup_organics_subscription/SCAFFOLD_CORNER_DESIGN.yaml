            - "impact.pickups_completed == 2 and contamination_tags_confirmed == 1 (waived tag excluded)"

      - name: account_standing_flips_on_overdue_and_recovers_on_pay
        claim_type: correct_result
        grounds: ["calculations.account_standing"]
        distinguishing_aspect: "Standing is derived on read: DELINQUENT the day after due_date with an unpaid ISSUED invoice, back to GOOD_STANDING immediately after pay."
        test_recipe:
