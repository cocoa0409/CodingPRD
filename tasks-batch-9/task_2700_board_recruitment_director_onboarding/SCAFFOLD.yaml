scenario: |
  Generate task harder than expert level!

  2700. Board Recruitment & Director Onboarding (public company nominating and governance committee):
  board skills matrix and gap analysis against strategy and risk oversight needs, candidate sourcing
  through search firms and network referrals with independence screening, interview process, reference
  checks and conflict-of-interest evaluation including interlocking directorate limits, nomination,
  shareholder proposal and universal proxy considerations, onboarding program with business orientation,
  committee assignment and documentation access, continuing education, board evaluation and refreshment
  policy including tenure and retirement guidelines, director compensation structure and stock ownership
  guidelines, overboarding policy monitoring

domain_name: board-recruitment-director-onboarding
api_prefix: "/governance"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Candidate/Director/ExternalCompany form a many-to-many interlock graph through
  # ExternalDirectorship; DirectorSkillRating is a Director x SkillCategory junction;
  # SlateNominee is a NominationSlate x Candidate x Director junction. Director carries a
  # back-reference to the Candidate it was elected from (cross_aggregate), so the graph
  # closes a loop Candidate -> SlateNominee -> Director -> Candidate.

  state_machine_shape: cyclic
  # Candidate cycles REFERENCE_CHECK -> INTERVIEWING -> REFERENCE_CHECK and
  # NOMINATED -> DEFERRED -> SCREENING across cycle years; NominationSlate cycles
  # COMMITTEE_REVIEW -> DRAFT on rejection/revision; Director carries three parallel
  # independent dimensions (service_status x compliance_status x onboarding_status);
  # IndependenceScreen forks SUBMITTED -> {DETERMINED_INDEPENDENT, DETERMINED_NOT_INDEPENDENT}
  # with divergent side-effect sets; Committee is posture-derived from its assignments.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential   # Candidate.referring_director_id -> Director, and Director.source_candidate_id -> Candidate close a recruitment loop

  role_model: segregation_of_duties
  # The GovernanceStaff user who assembles a slate cannot approve it (CommitteeChair only);
  # a CommitteeMember who referred a candidate on the slate must cast RECUSED, and any other
  # ballot from that director is rejected; the CommitteeChair who determines independence is
  # not the staff user who submitted the screen.

  consistency_model: immediate

entities:
  - name: GovernancePolicy
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Nomination cycle year this policy governs (drives refreshment, education and award windows)"
        constraints: "integer >= 2000; unique among GovernancePolicy rows with status == ACTIVE"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which this policy governs; used to rank the ACTIVE policy"
      - name: authorized_seats
        type: integer
        source: input
        default: 9
        description: "Total authorized board seats"
        constraints: ">= 1"
      - name: independence_min_pct
        type: number
        source: input
        default: 66.67
        description: "Minimum percentage of slate nominees that must be independent"
        constraints: "0.00 <= value <= 100.00, 2 decimal places"
      - name: independence_standard
        type: enum
        source: input
        default: BRIGHT_LINE
        description: "Selects which independence_determination variant applies when a screen is submitted"
        constraints: "one of {BRIGHT_LINE, ENHANCED}"
      - name: bright_line_payment_floor_cents
        type: integer
        source: input
        default: 100000000
        description: "Absolute payment floor (cents) in the bright-line payment materiality test"
      - name: bright_line_revenue_pct
        type: number
        source: input
        default: 2.0
        description: "Percentage of the recipient's gross revenue used in the bright-line payment materiality test"
      - name: bright_line_lookback_years
        type: integer
        source: input
        default: 3
        description: "Prior-employment lookback in years under the BRIGHT_LINE standard"
      - name: enhanced_lookback_years
        type: integer
        source: input
        default: 5
        description: "Prior-employment lookback in years under the ENHANCED standard"
      - name: enhanced_charitable_pct
        type: number
        source: input
        default: 2.0
        description: "Percentage of company gross revenue above which charitable contributions are material under ENHANCED"
      - name: max_public_boards_default
        type: integer
        source: input
        default: 4
        description: "Overboarding limit: maximum total public company boards (this board included) for a non-CEO director"
      - name: max_public_boards_sitting_ceo
        type: integer
        source: input
        default: 2
        description: "Overboarding limit: maximum total public company boards (this board included) for a sitting CEO"
      - name: interlock_max_shared_boards
        type: integer
        source: input
        default: 2
        description: "Interlocking directorate limit: shared ACTIVE public external boards with any seated director at or above this count is a violation"
      - name: mandatory_retirement_age
        type: integer
        source: input
        default: 75
        description: "Retirement guideline: age in whole years at which a person may no longer be nominated"
      - name: max_tenure_years
        type: integer
        source: input
        default: 15
        description: "Refreshment guideline: maximum completed tenure years for an incumbent to be renominated"
      - name: min_completed_interviews
        type: integer
        source: input
        default: 3
        description: "Minimum COMPLETED InterviewSession rows before a candidate may enter reference check"
      - name: quorum_size
        type: integer
        source: input
        default: 3
        description: "Minimum CommitteeVote rows with status == CAST (all ballots, RECUSED included) for a slate decision"
      - name: approval_threshold_pct
        type: number
        source: input
        default: 66.67
        description: "Minimum approval percentage of non-recused CAST ballots to approve a slate"
      - name: annual_cash_retainer_cents
        type: integer
        source: input
        default: 12000000
        description: "Annual board cash retainer in cents, prorated by service days"
      - name: committee_member_fee_cents
        type: integer
        source: input
        default: 1500000
        description: "Annual fee in cents per ACTIVE committee assignment with seat_role == MEMBER"
      - name: committee_chair_premium_cents
        type: integer
        source: input
        default: 2500000
        description: "Annual premium in cents per ACTIVE committee assignment with seat_role == CHAIR (paid instead of the member fee for that seat)"
      - name: equity_grant_value_cents
        type: integer
        source: input
        default: 20000000
        description: "Annual equity grant value in cents included in the compensation award"
      - name: ownership_multiple
        type: number
        source: input
        default: 5.0
        description: "Stock ownership guideline: multiple of cash compensation a director must hold in shares"
      - name: ownership_grace_years
        type: integer
        source: input
        default: 5
        description: "Years from appointed_on before the ownership guideline is enforced against a director"
      - name: education_hours_required
        type: number
        source: input
        default: 8.0
        description: "Continuing education credit hours a seated director must complete per cycle year"
      - name: readiness_min_score
        type: number
        source: input
        default: 60.0
        description: "Minimum candidate_readiness_score required to place a candidate on a slate"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE while this is the governing policy; SUPERSEDED once a newer policy is created"
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: SkillCategory
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Stable skills-matrix category code"
        constraints: "unique across SkillCategory; uppercase snake case"
      - name: name
        type: string
        source: input
        description: "Human readable category name"
      - name: strategic_weight
        type: number
        source: input
        description: "Weight of this category in the board_gap_index"
        constraints: "0.0 < value <= 1.0"
      - name: risk_oversight
        type: boolean
        source: input
        default: false
        description: "True when this category serves risk oversight; applies a 1.5 multiplier to the weighted gap"
      - name: required_min_directors
        type: integer
        source: input
        description: "Number of directors that must cover this category at effective_rating >= 3"
        constraints: ">= 1"
      - name: criticality
        type: enum
        source: input
        default: STRATEGIC
        description: "Tie-break rank for priority_category selection: CORE beats STRATEGIC beats EMERGING"
        constraints: "one of {CORE, STRATEGIC, EMERGING}"

  - name: SearchFirm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Executive search firm name"
        constraints: "unique across SearchFirm"
      - name: contact_email
        type: string
        source: input
        description: "Engagement partner contact email"
      - name: fee_model
        type: enum
        source: input
        default: RETAINER
        description: "RETAINER firms credit their retainer against placement fees; CONTINGENT firms bill placement fees only"
        constraints: "one of {RETAINER, CONTINGENT}"
      - name: retainer_fee_cents
        type: integer
        source: input
        default: 0
        description: "Retainer already paid in cents; credited against committed placement fees when fee_model == RETAINER"
        constraints: ">= 0"
      - name: placement_fee_pct
        type: number
        source: input
        description: "Placement fee percentage applied to the first two nominees sourced by this firm"
        constraints: "0.0 < value <= 100.0"
      - name: placement_fee_tier2_pct
        type: number
        source: input
        description: "Placement fee percentage applied to the third and later nominees sourced by this firm"
        constraints: "0.0 < value <= 100.0"
      - name: placed_nominee_count
        type: integer
        source: computed
        default: 0
        description: "Count of SlateNominee rows sourced by this firm with status IN {PROPOSED, CONFIRMED, ELECTED}"
      - name: committed_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of the per-nominee rounded placement_fee_cents over SlateNominee rows sourced by this firm with status IN {PROPOSED, CONFIRMED, ELECTED}"
      - name: retainer_credit_applied_cents
        type: integer
        source: computed
        default: 0
        description: "min(retainer_fee_cents, committed_fee_cents) when fee_model == RETAINER, else 0"
      - name: net_payable_cents
        type: integer
        source: computed
        default: 0
        description: "committed_fee_cents - retainer_credit_applied_cents"

  - name: ExternalCompany
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "External company name"
        constraints: "unique across ExternalCompany"
      - name: ticker
        type: string
        source: input
        description: "Exchange ticker symbol, empty string when not listed"
      - name: is_public
        type: boolean
        source: input
        default: true
        description: "True when the company is a public reporting company; only public boards count toward overboarding and interlock"
      - name: is_competitor
        type: boolean
        source: input
        default: false
        description: "True when the company competes with the issuer; a shared ACTIVE seat at a competitor is an automatic interlock violation"
      - name: gross_revenue_cents
        type: integer
        source: input
        default: 0
        description: "Annual gross revenue in cents, used as the recipient revenue basis in payment materiality tests"

  - name: Director
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Director legal name"
      - name: email
        type: string
        source: input
        description: "Director contact email"
        constraints: "unique across Director"
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) of birth; basis for age_years and the retirement guideline"
      - name: appointed_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the director first joined this board; basis for tenure_years and the ownership grace window"
      - name: source_candidate_id
        type: string
        source: system
        description: "FK -> Candidate.id; null for directors loaded directly, set by the record-election cascade when this row was created from an elected nominee"
      - name: is_management
        type: boolean
        source: input
        default: false
        description: "True when the director is an employee of the issuer (never independent)"
      - name: is_sitting_ceo_elsewhere
        type: boolean
        source: input
        default: false
        description: "True when the director is a sitting CEO of another company; selects the stricter overboarding limit"
      - name: is_independent
        type: boolean
        source: input
        default: true
        description: "Independence determination of record for this seated director; false whenever is_management is true"
      - name: shares_held
        type: integer
        source: input
        default: 0
        description: "Shares of the issuer held by the director; refreshed by the comp-award finalize side effect"
        constraints: ">= 0"
      - name: service_status
        type: enum
        source: system
        default: ONBOARDING
        description: "Service dimension of the parallel state machine"
        constraints: "one of {ONBOARDING, SEATED, RETIREMENT_NOTICED, RETIRED, RESIGNED, NOT_RENOMINATED}"
      - name: compliance_status
        type: enum
        source: computed
        default: COMPLIANT
        description: "Compliance dimension of the parallel state machine, recomputed by director_compliance_status"
        constraints: "one of {COMPLIANT, OVERBOARDED, OWNERSHIP_SHORTFALL, EDUCATION_DELINQUENT}"
      - name: onboarding_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: "Onboarding dimension of the parallel state machine, derived from this director's OnboardingItem rows"
        constraints: "one of {NOT_STARTED, IN_PROGRESS, COMPLETE}"
      - name: onboarding_completion_pct
        type: number
        source: computed
        default: 0.00
        description: "Percentage of required OnboardingItem rows in status IN {COMPLETED, WAIVED}, 2 decimal places"
      - name: age_years
        type: integer
        source: computed
        description: "floor((logical clock date - birth_date).days / 365)"
      - name: tenure_years
        type: integer
        source: computed
        description: "floor((logical clock date - appointed_on).days / 365)"
      - name: external_public_board_count
        type: integer
        source: computed
        default: 0
        description: "Count of ExternalDirectorship rows for this director with status == ACTIVE whose ExternalCompany.is_public is true"
      - name: education_hours_cycle
        type: number
        source: computed
        default: 0.0
        description: "Sum of OnboardingItem.credit_hours for this director where category == CONTINUING_EDUCATION and status == COMPLETED and completed_at falls inside the ACTIVE policy cycle_year"
      - name: retirement_notice_at
        type: datetime
        source: system
        description: "Logical clock instant at which the retirement notice was recorded; null until then"

  - name: DirectorSkillRating
    parent: Director
    common_fields: true
    fields:
      - name: director_id
        type: string
        source: input
        description: "FK -> Director.id; the rated director"
      - name: skill_category_id
        type: string
        source: input
        description: "FK -> SkillCategory.id; the rated skills-matrix category"
      - name: self_rating
        type: integer
        source: input
        description: "Director self-assessed proficiency"
        constraints: "integer 0..4"
      - name: validated_rating
        type: integer
        source: input
        description: "Committee-validated proficiency, null until validation"
        constraints: "integer 0..4 when present"
      - name: validation_status
        type: enum
        source: system
        default: UNVALIDATED
        description: "UNVALIDATED until a committee validation writes validated_rating"
        constraints: "one of {UNVALIDATED, VALIDATED}"
      - name: effective_rating
        type: integer
        source: computed
        description: "validated_rating when validation_status == VALIDATED, else self_rating"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical clock instant of validation; null while UNVALIDATED"

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Candidate legal name"
      - name: email
        type: string
        source: input
        description: "Candidate contact email"
        constraints: "unique across Candidate"
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) of birth; basis for the retirement guideline check at conflict clearance"
      - name: source_channel
        type: enum
        source: input
        description: "How the candidate entered the pipeline"
        constraints: "one of {SEARCH_FIRM, NETWORK_REFERRAL, SHAREHOLDER_PROPOSAL, UNIVERSAL_PROXY_NOMINATION}"
      - name: search_firm_id
        type: string
        source: input
        description: "FK -> SearchFirm.id; required when source_channel == SEARCH_FIRM, must be null otherwise"
      - name: referring_director_id
        type: string
        source: input
        description: "FK -> Director.id; required when source_channel == NETWORK_REFERRAL, must be null otherwise; this director must recuse on slate votes"
      - name: shareholder_proponent_name
        type: string
        source: input
        description: "Proponent of record; required when source_channel IN {SHAREHOLDER_PROPOSAL, UNIVERSAL_PROXY_NOMINATION}, must be null otherwise"
      - name: is_sitting_ceo
        type: boolean
        source: input
        default: false
        description: "True when the candidate is a sitting CEO elsewhere; selects the stricter overboarding limit"
      - name: target_annual_comp_cents
        type: integer
        source: input
        default: 0
        description: "Target annual compensation in cents used as the placement-fee basis for search-firm sourced nominees"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: SOURCED
        description: "Candidate pipeline state"
        constraints: "one of {SOURCED, SCREENING, SCREEN_PASSED, INTERVIEWING, REFERENCE_CHECK, SLATE_ELIGIBLE, NOMINATED, ELECTED, NOT_ELECTED, DEFERRED, REJECTED, WITHDRAWN}"
      - name: rejection_reason_code
        type: enum
        source: system
        description: "Set whenever status becomes REJECTED; null otherwise"
        constraints: "one of {INDEPENDENCE_FAILED, ADVERSE_REFERENCE, INTERLOCK_LIMIT, OVERBOARDING, RETIREMENT_AGE}"
      - name: independence_result
        type: enum
        source: computed
        default: PENDING
        description: "Mirrors the determination of the governing IndependenceScreen for this candidate"
        constraints: "one of {PENDING, INDEPENDENT, NOT_INDEPENDENT}"
      - name: completed_interview_count
        type: integer
        source: computed
        default: 0
        description: "Count of InterviewSession rows for this candidate with status == COMPLETED"
      - name: interview_score_avg
        type: number
        source: computed
        default: 0.00
        description: "Mean InterviewSession.score over rows with status == COMPLETED, round_half_up to 2 decimals; 0.00 when none"
      - name: external_public_board_count
        type: integer
        source: computed
        default: 0
        description: "Count of ExternalDirectorship rows for this candidate with status == ACTIVE whose ExternalCompany.is_public is true"
      - name: interlock_shared_board_count
        type: integer
        source: computed
        default: 0
        description: "Maximum, over directors with service_status IN {ONBOARDING, SEATED, RETIREMENT_NOTICED}, of shared ACTIVE public external companies; recomputed at conflict clearance"
      - name: readiness_score
        type: number
        source: computed
        default: 0.00
        description: "candidate_readiness_score output, 2 decimal places; gate for slate placement"
      - name: reference_check_count
        type: integer
        source: system
        default: 0
        description: "Number of references recorded at the last reference-check submission"
      - name: adverse_reference_found
        type: boolean
        source: system
        default: false
        description: "True when the last reference check reported an adverse finding"
      - name: deferred_cycle_year
        type: integer
        source: system
        description: "Cycle year in which the candidate was deferred; screening may only reopen in a later cycle"
      - name: interview_round
        type: integer
        source: system
        default: 0
        description: "Increments each time interviews are reopened from reference check; bounds the negotiation loop"

  - name: ExternalDirectorship
    parent: null
    common_fields: true
    fields:
      - name: director_id
        type: string
        source: input
        description: "FK -> Director.id; set when the subject is a seated/onboarding director, null when the subject is a candidate"
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; set when the subject is a candidate, null when the subject is a director"
      - name: external_company_id
        type: string
        source: input
        description: "FK -> ExternalCompany.id; the outside board on which the subject serves"
      - name: seat_role
        type: enum
        source: input
        default: DIRECTOR
        description: "Role held on the outside board"
        constraints: "one of {DIRECTOR, CHAIR, CEO_AND_DIRECTOR}"
      - name: is_audit_chair
        type: boolean
        source: input
        default: false
        description: "True when the subject chairs that company's audit committee (time-commitment factor recorded for the committee file)"
      - name: start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the outside seat began"
      - name: end_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the outside seat ended; null while status == ACTIVE"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE seats count toward overboarding and interlock; ENDED seats do not"
        constraints: "one of {ACTIVE, ENDED}"

  - name: IndependenceScreen
    parent: Candidate
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: system
        description: "FK -> Candidate.id; the screened candidate, taken from the path"
      - name: standard_applied
        type: enum
        source: computed
        description: "Frozen copy of the ACTIVE GovernancePolicy.independence_standard at submit time; null while DRAFT"
        constraints: "one of {BRIGHT_LINE, ENHANCED}"
      - name: payments_to_company_cents
        type: integer
        source: input
        default: 0
        description: "Payments in cents between the issuer and an organization where the candidate is an executive"
        constraints: ">= 0"
      - name: recipient_gross_revenue_cents
        type: integer
        source: input
        default: 0
        description: "Gross revenue in cents of the payment recipient organization; basis of the percentage leg of the materiality test"
        constraints: ">= 0"
      - name: prior_employment_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the candidate's employment with the issuer or its auditor ended; null when never employed"
      - name: family_member_employed
        type: boolean
        source: input
        default: false
        description: "True when an immediate family member is an executive officer of the issuer"
      - name: auditor_affiliation
        type: boolean
        source: input
        default: false
        description: "True when the candidate is a current partner or employee of the issuer's external auditor"
      - name: charitable_contributions_cents
        type: integer
        source: input
        default: 0
        description: "Issuer contributions in cents to a charity where the candidate is an executive officer"
        constraints: ">= 0"
      - name: company_gross_revenue_cents
        type: integer
        source: input
        default: 0
        description: "Issuer gross revenue in cents; basis of the ENHANCED charitable materiality test"
        constraints: ">= 0"
      - name: bright_line_fail_count
        type: integer
        source: computed
        default: 0
        description: "Number of failing bright-line factors (F1..F4) evaluated at submit"
      - name: qualitative_fail_count
        type: integer
        source: computed
        default: 0
        description: "Number of failing ENHANCED factors (F1..F5 with the enhanced lookback) evaluated at submit"
      - name: determination
        type: enum
        source: computed
        default: PENDING
        description: "PENDING while not determined; mirrors the fork taken out of SUBMITTED"
        constraints: "one of {PENDING, INDEPENDENT, NOT_INDEPENDENT}"
      - name: disqualifying_factor_code
        type: enum
        source: computed
        description: "First failing factor of the applied standard in the fixed order PAYMENT_MATERIALITY, RECENT_EMPLOYMENT, FAMILY_EMPLOYMENT, AUDITOR_AFFILIATION, CHARITABLE_MATERIALITY; null when none fail"
        constraints: "one of {PAYMENT_MATERIALITY, RECENT_EMPLOYMENT, FAMILY_EMPLOYMENT, AUDITOR_AFFILIATION, CHARITABLE_MATERIALITY}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Screen lifecycle with a fork out of SUBMITTED"
        constraints: "one of {DRAFT, SUBMITTED, DETERMINED_INDEPENDENT, DETERMINED_NOT_INDEPENDENT, VOIDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock instant of submission; null while DRAFT"
      - name: determined_at
        type: datetime
        source: system
        description: "Logical clock instant of determination; null until the fork is taken; ranking key for the governing screen"

  - name: InterviewSession
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the interviewed candidate"
      - name: interviewer_director_id
        type: string
        source: input
        description: "FK -> Director.id; the interviewing director, the resource whose calendar is protected against overlap"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the interview; intervals are half-open [start_at, end_at)"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the interview; must be strictly after start_at"
      - name: modality
        type: enum
        source: input
        default: VIDEO
        description: "Interview modality"
        constraints: "one of {IN_PERSON, VIDEO}"
      - name: interview_round
        type: integer
        source: system
        default: 1
        description: "Candidate.interview_round + 1 at creation time; distinguishes first-round from reopened-round sessions"
      - name: score
        type: integer
        source: input
        description: "Interviewer score recorded at completion; null while SCHEDULED"
        constraints: "integer 1..5 when present"
      - name: recommendation
        type: enum
        source: input
        description: "Interviewer recommendation recorded at completion; null while SCHEDULED"
        constraints: "one of {ADVANCE, HOLD, DECLINE}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Session lifecycle; only COMPLETED sessions feed interview_score_avg, only SCHEDULED sessions occupy the interviewer's calendar"
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED, NO_SHOW}"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical clock instant of completion; null otherwise"

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Committee identity"
        constraints: "one of {AUDIT, COMPENSATION, NOMINATING_GOVERNANCE, RISK}; unique across Committee"
      - name: name
        type: string
        source: input
        description: "Committee display name"
      - name: authorized_seats
        type: integer
        source: input
        description: "Maximum ACTIVE assignments this committee may hold"
        constraints: ">= 1"
      - name: min_seats
        type: integer
        source: input
        default: 3
        description: "Minimum ACTIVE assignments for the committee to be AT_STRENGTH"
        constraints: ">= 1"
      - name: requires_all_independent
        type: boolean
        source: input
        default: false
        description: "True when every ACTIVE member must have Director.is_independent == true"
      - name: requires_financial_expert
        type: boolean
        source: input
        default: false
        description: "True when at least one ACTIVE member must hold a validated rating >= 3 in a SkillCategory with criticality == CORE"
      - name: filled_seats
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeAssignment rows for this committee with status == ACTIVE; conserved quantity of the seat ledger invariant"
      - name: status
        type: enum
        source: computed
        default: UNDER_STRENGTH
        description: "Posture derived from the committee's ACTIVE assignments and their directors' compliance_status"
        constraints: "one of {AT_STRENGTH, UNDER_STRENGTH, SUSPENDED}"

  - name: CommitteeAssignment
    parent: Committee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: system
        description: "FK -> Committee.id; taken from the path"
      - name: director_id
        type: string
        source: input
        description: "FK -> Director.id; the assigned director"
      - name: seat_role
        type: enum
        source: input
        default: MEMBER
        description: "Seat role; at most one ACTIVE CHAIR per committee"
        constraints: "one of {MEMBER, CHAIR}"
      - name: term_start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) term start; intervals are closed [term_start_on, term_end_on] on both ends"
      - name: term_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) term end; must be >= term_start_on"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Assignment lifecycle; only ACTIVE rows consume a seat"
        constraints: "one of {PROPOSED, ACTIVE, ENDED, REVOKED}"
      - name: ended_reason_code
        type: enum
        source: system
        description: "Reason the assignment left ACTIVE; null while PROPOSED or ACTIVE"
        constraints: "one of {RETIREMENT_NOTICE, REVOCATION}"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical clock instant of activation; null while PROPOSED"
      - name: ended_at
        type: datetime
        source: system
        description: "Logical clock instant the assignment left ACTIVE; null otherwise"

  - name: NominationSlate
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Annual meeting cycle year of this slate"
        constraints: ">= 2000; unique across NominationSlate rows whose status != ABANDONED"
      - name: seat_count
        type: integer
        source: input
        description: "Number of board seats standing for election in this cycle"
        constraints: ">= 1"
      - name: search_fee_budget_cents
        type: integer
        source: input
        default: 10000000000
        description: "Committed search-firm placement fee budget in cents for this slate"
        constraints: ">= 0"
      - name: nominee_count
        type: integer
        source: computed
        default: 0
        description: "Count of SlateNominee rows for this slate with status IN {PROPOSED, CONFIRMED, ELECTED}"
      - name: independent_nominee_count
        type: integer
        source: computed
        default: 0
        description: "Count of those counted nominees whose is_independent is true"
      - name: independent_nominee_pct
        type: number
        source: computed
        default: 0.00
        description: "slate_independence_pct output, 2 decimal places; 0.00 when nominee_count == 0"
      - name: independence_shortfall
        type: boolean
        source: computed
        default: false
        description: "True when nominee_count > 0 and independent_nominee_pct < ACTIVE policy.independence_min_pct"
      - name: committed_search_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of SlateNominee.placement_fee_cents over this slate's rows with status IN {PROPOSED, CONFIRMED, ELECTED}"
      - name: contested
        type: boolean
        source: computed
        default: false
        description: "True when any counted nominee's candidate has source_channel == UNIVERSAL_PROXY_NOMINATION"
      - name: universal_proxy_applicable
        type: boolean
        source: computed
        default: false
        description: "Equal to contested; when true the universal proxy card requires nominee_count >= seat_count before filing"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "Number of times the slate returned from COMMITTEE_REVIEW to DRAFT"
      - name: votes_for
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows for this slate with status == CAST and ballot == FOR"
      - name: votes_against
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows for this slate with status == CAST and ballot == AGAINST"
      - name: votes_abstain
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows for this slate with status == CAST and ballot == ABSTAIN"
      - name: votes_recused
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows for this slate with status == CAST and ballot == RECUSED"
      - name: approval_pct
        type: number
        source: computed
        default: 0.00
        description: "committee_vote_tally approval percentage over non-recused CAST ballots, 2 decimal places"
      - name: quorum_met
        type: boolean
        source: computed
        default: false
        description: "True when the count of all CAST ballots (RECUSED included) >= ACTIVE policy.quorum_size"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Slate lifecycle with a review fork and a revision loop back to DRAFT"
        constraints: "one of {DRAFT, COMMITTEE_REVIEW, APPROVED, FILED, ELECTION_RECORDED, ABANDONED}"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock instant the definitive proxy was filed; null before"
      - name: election_recorded_at
        type: datetime
        source: system
        description: "Logical clock instant the annual meeting result was recorded; null before"

  - name: SlateNominee
    parent: NominationSlate
    common_fields: true
    fields:
      - name: slate_id
        type: string
        source: system
        description: "FK -> NominationSlate.id; taken from the path"
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the nominated candidate"
      - name: incumbent_director_id
        type: string
        source: input
        description: "FK -> Director.id; set when this nomination renominates a sitting director, null for a new candidate"
      - name: ballot_order
        type: integer
        source: input
        description: "Position on the proxy card"
        constraints: ">= 1; unique per slate among rows with status != VOIDED"
      - name: is_independent
        type: boolean
        source: computed
        description: "True when the nominee counts as independent: Candidate.independence_result == INDEPENDENT, or for a renomination Director.is_independent"
      - name: placement_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Per-nominee rounded search firm placement fee in cents; 0 when the candidate was not sourced by a search firm"
      - name: fee_tier_applied
        type: enum
        source: computed
        description: "Which firm tier produced placement_fee_cents; null when no search firm sourced the candidate"
        constraints: "one of {TIER1, TIER2}"
      - name: nominee_ordinal
        type: integer
        source: computed
        default: 0
        description: "1-based ordinal of this nominee among the sourcing firm's fee-bearing nominees, ordered created_at ASC then ballot_order ASC; 0 when no search firm sourced the candidate"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Nominee lifecycle"
        constraints: "one of {PROPOSED, CONFIRMED, VOIDED, ELECTED, NOT_ELECTED}"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical clock instant the nominee row was voided; null otherwise"

  - name: CommitteeVote
    parent: NominationSlate
    common_fields: true
    fields:
      - name: slate_id
        type: string
        source: system
        description: "FK -> NominationSlate.id; taken from the path"
      - name: voting_director_id
        type: string
        source: input
        description: "FK -> Director.id; the balloting nominating-and-governance committee member"
      - name: ballot
        type: enum
        source: input
        description: "Ballot cast; RECUSED ballots count toward quorum but not toward the approval percentage"
        constraints: "one of {FOR, AGAINST, ABSTAIN, RECUSED}"
      - name: rationale
        type: string
        source: input
        default: ""
        description: "Minuted rationale for the ballot"
      - name: recusal_required
        type: boolean
        source: computed
        description: "True when the balloting director referred any counted nominee's candidate on this slate; such a director must ballot RECUSED"
      - name: status
        type: enum
        source: system
        default: CAST
        description: "CAST until the slate returns to DRAFT, at which point outstanding ballots are voided"
        constraints: "one of {CAST, VOIDED_BY_REVISION}"
      - name: cast_at
        type: datetime
        source: system
        description: "Logical clock instant the ballot was cast"

  - name: OnboardingItem
    parent: Director
    common_fields: true
    fields:
      - name: director_id
        type: string
        source: system
        description: "FK -> Director.id; taken from the path"
      - name: module_code
        type: string
        source: input
        description: "Onboarding or education module code"
        constraints: "unique per director among rows with status != WAIVED"
      - name: category
        type: enum
        source: input
        description: "Programme area of this item"
        constraints: "one of {BUSINESS_ORIENTATION, COMMITTEE_ONBOARDING, DOCUMENT_ACCESS, CONTINUING_EDUCATION}"
      - name: is_required
        type: boolean
        source: input
        default: true
        description: "Required items gate the director's onboarding_status and the seating transition"
      - name: credit_hours
        type: number
        source: input
        default: 0.0
        description: "Continuing education credit hours awarded on completion"
        constraints: ">= 0.0"
      - name: due_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the item is due"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Item lifecycle"
        constraints: "one of {PENDING, COMPLETED, WAIVED}"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical clock instant of completion; null unless COMPLETED"
      - name: waiver_reason
        type: string
        source: system
        description: "Chair's waiver rationale; null unless WAIVED"

  - name: DirectorCompensationAward
    parent: Director
    common_fields: true
    fields:
      - name: director_id
        type: string
        source: system
        description: "FK -> Director.id; taken from the path"
      - name: cycle_year
        type: integer
        source: input
        description: "Award cycle year"
        constraints: ">= 2000; unique per director among rows with status != VOIDED"
      - name: service_start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) first day of the service window"
      - name: service_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) last day of the service window; must be >= service_start_on"
      - name: share_price_cents
        type: integer
        source: input
        description: "Share price in cents used to value the director's holdings"
        constraints: ">= 1"
      - name: shares_held
        type: integer
        source: input
        description: "Shares held by the director as of the award date; copied onto Director.shares_held at finalize"
        constraints: ">= 0"
      - name: service_days
        type: integer
        source: computed
        description: "(service_end_on - service_start_on).days + 1, both endpoints inclusive"
      - name: committee_member_seat_count
        type: integer
        source: computed
        default: 0
        description: "Count of the director's CommitteeAssignment rows with status == ACTIVE and seat_role == MEMBER at award creation"
      - name: committee_chair_seat_count
        type: integer
        source: computed
        default: 0
        description: "Count of the director's CommitteeAssignment rows with status == ACTIVE and seat_role == CHAIR at award creation"
      - name: prorated_cash_retainer_cents
        type: integer
        source: computed
        description: "round_half_up(policy.annual_cash_retainer_cents * service_days / 365)"
      - name: committee_fees_cents
        type: integer
        source: computed
        description: "committee_member_seat_count * policy.committee_member_fee_cents + committee_chair_seat_count * policy.committee_chair_premium_cents"
      - name: equity_value_cents
        type: integer
        source: computed
        description: "Frozen copy of policy.equity_grant_value_cents at award creation"
      - name: pre_offset_total_cents
        type: integer
        source: computed
        description: "prorated_cash_retainer_cents + committee_fees_cents + equity_value_cents; the tier key for the excess offset"
      - name: excess_offset_pct
        type: number
        source: computed
        description: "Offset tier percentage selected from pre_offset_total_cents, never from total_cents"
      - name: excess_offset_cents
        type: integer
        source: computed
        description: "round_half_up(excess_offset_pct / 100 * pre_offset_total_cents)"
      - name: total_cents
        type: integer
        source: computed
        description: "pre_offset_total_cents - excess_offset_cents"
      - name: ownership_requirement_cents
        type: integer
        source: computed
        description: "round_half_up(policy.ownership_multiple * (prorated_cash_retainer_cents + committee_fees_cents))"
      - name: ownership_actual_cents
        type: integer
        source: computed
        description: "shares_held * share_price_cents"
      - name: ownership_compliant
        type: boolean
        source: computed
        description: "ownership_actual_cents >= ownership_requirement_cents"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Award lifecycle; only FINALIZED awards feed the ownership leg of director_compliance_status"
        constraints: "one of {DRAFT, FINALIZED, VOIDED}"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical clock instant of finalization; ranking key for the governing award"

state_machines:
  - entity: Candidate
    initial_state: SOURCED
    terminal_states: [ELECTED, NOT_ELECTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SOURCED
        to: SCREENING
        trigger: "POST /governance/candidates/{candidate_id}/screens"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == SOURCED"
          - "no IndependenceScreen exists for this candidate with status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "creates an IndependenceScreen in status DRAFT with candidate_id from the path"
          - "sets Candidate.status = SCREENING"
      - from: SCREENING
        to: SCREEN_PASSED
        trigger: "POST /governance/screens/{screen_id}/determine (cascaded from the screen fork)"
        actor: system
        preconditions:
          - "the screen being determined has candidate_id == this candidate"
          - "the applied standard's fail count == 0"
        side_effects:
          - "sets Candidate.independence_result = INDEPENDENT"
          - "recomputes Candidate.readiness_score"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /governance/screens/{screen_id}/determine (cascaded from the screen fork)"
        actor: system
        preconditions:
          - "the screen being determined has candidate_id == this candidate"
          - "the applied standard's fail count >= 1"
        side_effects:
          - "sets Candidate.independence_result = NOT_INDEPENDENT and rejection_reason_code = INDEPENDENCE_FAILED"
          - "every InterviewSession for this candidate with status == SCHEDULED becomes CANCELLED"
        note: "First-pass rejection: a candidate in SCREENING has no nominee row yet, so no slate-side cascade fires here. The depth-5 cascade runs from the NOMINATED -> REJECTED transition below"
      - from: SCREEN_PASSED
        to: INTERVIEWING
        trigger: "POST /governance/interviews"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == SCREEN_PASSED"
        side_effects:
          - "sets Candidate.status = INTERVIEWING"
          - "creates the InterviewSession in status SCHEDULED with interview_round = Candidate.interview_round + 1"
        note: "Later sessions in the same round are created while the candidate is already INTERVIEWING and leave status unchanged"
      - from: INTERVIEWING
        to: REFERENCE_CHECK
        trigger: "POST /governance/candidates/{candidate_id}/reference-check"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == INTERVIEWING"
          - "candidate.completed_interview_count >= ACTIVE policy.min_completed_interviews"
          - "request field adverse_findings == false"
        side_effects:
          - "sets Candidate.reference_check_count = request field reference_count and adverse_reference_found = false"
          - "recomputes Candidate.readiness_score"
      - from: INTERVIEWING
        to: REJECTED
        trigger: "POST /governance/candidates/{candidate_id}/reference-check"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == INTERVIEWING"
          - "candidate.completed_interview_count >= ACTIVE policy.min_completed_interviews"
          - "request field adverse_findings == true"
        side_effects:
          - "sets Candidate.adverse_reference_found = true and rejection_reason_code = ADVERSE_REFERENCE"
          - "recomputes Candidate.readiness_score, which subtracts the 15.00 adverse-reference penalty"
          - "every SlateNominee row with candidate_id == this candidate and status IN {PROPOSED, CONFIRMED} becomes VOIDED"
      - from: REFERENCE_CHECK
        to: INTERVIEWING
        trigger: "POST /governance/candidates/{candidate_id}/reopen-interviews"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == REFERENCE_CHECK"
          - "candidate.interview_round < 3"
        side_effects:
          - "increments Candidate.interview_round by 1"
          - "sets Candidate.reference_check_count = 0"
        note: "Revision loop: the candidate returns to INTERVIEWING for another round; interview_round bounds the loop at 3"
      - from: REFERENCE_CHECK
        to: SLATE_ELIGIBLE
        trigger: "POST /governance/candidates/{candidate_id}/conflict-clearance"
        actor: CommitteeChair
        preconditions:
          - "candidate.status == REFERENCE_CHECK"
          - "interlock_shared_board_count < ACTIVE policy.interlock_max_shared_boards and no shared company has is_competitor true"
          - "external_public_board_count + 1 <= the applicable overboarding limit"
          - "the candidate's age in whole years at the logical clock date < ACTIVE policy.mandatory_retirement_age"
        side_effects:
          - "recomputes Candidate.interlock_shared_board_count and external_public_board_count"
          - "recomputes Candidate.readiness_score"
      - from: REFERENCE_CHECK
        to: REJECTED
        trigger: "POST /governance/candidates/{candidate_id}/conflict-clearance"
        actor: CommitteeChair
        preconditions:
          - "candidate.status == REFERENCE_CHECK"
          - "at least one conflict test fails, evaluated in the fixed order interlock, overboarding, retirement age"
        side_effects:
          - "recomputes Candidate.interlock_shared_board_count and external_public_board_count"
          - "sets rejection_reason_code to INTERLOCK_LIMIT, OVERBOARDING or RETIREMENT_AGE from the first failing test"
        note: "Divergent branch of the same trigger: no error is returned, the committee records a negative determination"
      - from: SLATE_ELIGIBLE
        to: NOMINATED
        trigger: "POST /governance/slates/{slate_id}/nominees"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == SLATE_ELIGIBLE"
          - "candidate.readiness_score >= ACTIVE policy.readiness_min_score"
        side_effects:
          - "sets Candidate.status = NOMINATED"
      - from: NOMINATED
        to: NOMINATED
        trigger: "POST /governance/candidates/{candidate_id}/screens"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == NOMINATED"
          - "no IndependenceScreen exists for this candidate with status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "creates a supplemental IndependenceScreen in status DRAFT with candidate_id from the path"
          - "leaves Candidate.status at NOMINATED and leaves independence_result at its prior value until the new screen is determined"
        note: "Self-transition: new information surfacing during proxy season forces a re-screen of a sitting nominee. This is the only way a determined screen can exist for a NOMINATED candidate, and it is the entry point of the depth-5 cascade"
      - from: NOMINATED
        to: REJECTED
        trigger: "POST /governance/screens/{screen_id}/determine (cascaded from the screen fork)"
        actor: system
        preconditions:
          - "the screen being determined has candidate_id == this candidate"
          - "the applied standard's fail count >= 1"
        side_effects:
          - "cascade hop 2: sets Candidate.independence_result = NOT_INDEPENDENT and rejection_reason_code = INDEPENDENCE_FAILED"
          - "cascade hop 3: every SlateNominee row with candidate_id == this candidate and status IN {PROPOSED, CONFIRMED} becomes VOIDED with voided_at = the logical clock, and the owning SearchFirm fee ledger is recomputed"
          - "cascade hop 4: every affected NominationSlate in status COMMITTEE_REVIEW reverts to DRAFT, increments revision_count by 1, increments version by 1, and recomputes nominee_count, independent_nominee_count, independent_nominee_pct, independence_shortfall and committed_search_fee_cents"
          - "cascade hop 5: every CommitteeVote of each reverted slate with status == CAST becomes VOIDED_BY_REVISION and the slate tallies reset to 0 with quorum_met false and approval_pct 0.00"
        note: "Hops 2-5 of the depth-5 screen-determination cascade; hop 1 is the IndependenceScreen SUBMITTED -> DETERMINED_NOT_INDEPENDENT transition itself"
      - from: NOMINATED
        to: DEFERRED
        trigger: "POST /governance/slate-nominees/{nominee_id}/void"
        actor: GovernanceStaff
        preconditions:
          - "the voided nominee row has candidate_id == this candidate and status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "sets Candidate.deferred_cycle_year = the slate's cycle_year"
      - from: DEFERRED
        to: SCREENING
        trigger: "POST /governance/candidates/{candidate_id}/reopen-screening"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status == DEFERRED"
          - "ACTIVE policy.cycle_year > candidate.deferred_cycle_year"
        side_effects:
          - "creates a new IndependenceScreen in status DRAFT for this candidate"
          - "sets Candidate.independence_result = PENDING and interview_round = 0"
        note: "Cross-cycle loop back into the pipeline; the prior determined screen is retained as history and stops governing once the new screen is determined"
      - from: NOMINATED
        to: ELECTED
        trigger: "POST /governance/slates/{slate_id}/record-election"
        actor: CorporateSecretary
        preconditions:
          - "this candidate's SlateNominee row id appears in request field elected_nominee_ids"
        side_effects:
          - "sets Candidate.status = ELECTED"
          - "when the nominee row has incumbent_director_id == null, creates a Director row in service_status ONBOARDING with source_candidate_id = this candidate"
      - from: NOMINATED
        to: NOT_ELECTED
        trigger: "POST /governance/slates/{slate_id}/record-election"
        actor: CorporateSecretary
        preconditions:
          - "this candidate's SlateNominee row id does not appear in request field elected_nominee_ids"
        side_effects:
          - "sets Candidate.status = NOT_ELECTED"
      - from: SOURCED
        to: WITHDRAWN
        trigger: "POST /governance/candidates/{candidate_id}/withdraw"
        actor: GovernanceStaff
        preconditions:
          - "candidate.status IN {SOURCED, SCREENING, SCREEN_PASSED, INTERVIEWING, REFERENCE_CHECK, SLATE_ELIGIBLE}"
        side_effects:
          - "every IndependenceScreen for this candidate with status IN {DRAFT, SUBMITTED} becomes VOIDED"
          - "every InterviewSession for this candidate with status == SCHEDULED becomes CANCELLED"
        note: "Same transition applies from SCREENING, SCREEN_PASSED, INTERVIEWING, REFERENCE_CHECK and SLATE_ELIGIBLE; NOMINATED candidates must have their nominee row voided first"

  - entity: IndependenceScreen
    initial_state: DRAFT
    terminal_states: [DETERMINED_INDEPENDENT, DETERMINED_NOT_INDEPENDENT, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /governance/screens/{screen_id}/submit"
        actor: GovernanceStaff
        preconditions:
          - "screen.status == DRAFT"
          - "candidate.status IN {SCREENING, NOMINATED}"
          - "an ACTIVE GovernancePolicy exists"
        side_effects:
          - "sets standard_applied = ACTIVE policy.independence_standard"
          - "computes bright_line_fail_count, qualitative_fail_count and disqualifying_factor_code per the independence_determination calculation"
          - "sets submitted_at = logical clock instant"
      - from: SUBMITTED
        to: DETERMINED_INDEPENDENT
        trigger: "POST /governance/screens/{screen_id}/determine"
        actor: CommitteeChair
        preconditions:
          - "screen.status == SUBMITTED"
          - "the fail count of standard_applied == 0"
        side_effects:
          - "sets determination = INDEPENDENT and determined_at = logical clock instant"
          - "cascade hop 2: Candidate.independence_result = INDEPENDENT; Candidate.status SCREENING -> SCREEN_PASSED, or stays NOMINATED when this was a supplemental re-screen"
        note: "Fork branch A; the fork is decided by the screen data, not by the actor"
      - from: SUBMITTED
        to: DETERMINED_NOT_INDEPENDENT
        trigger: "POST /governance/screens/{screen_id}/determine"
        actor: CommitteeChair
        preconditions:
          - "screen.status == SUBMITTED"
          - "the fail count of standard_applied >= 1"
        side_effects:
          - "sets determination = NOT_INDEPENDENT and determined_at = logical clock instant"
          - "cascade hop 2: because the screen became DETERMINED_NOT_INDEPENDENT, Candidate.independence_result = NOT_INDEPENDENT, Candidate.status moves SCREENING -> REJECTED (first-pass screen) or NOMINATED -> REJECTED (supplemental re-screen) and rejection_reason_code = INDEPENDENCE_FAILED"
          - "cascade hop 3: because the candidate became REJECTED, each SlateNominee with candidate_id == that candidate and status IN {PROPOSED, CONFIRMED} becomes VOIDED with voided_at set"
          - "cascade hop 4: because those nominee rows left the counted set, each affected NominationSlate recomputes nominee_count, independent_nominee_count, independent_nominee_pct, independence_shortfall, committed_search_fee_cents, contested and universal_proxy_applicable, each sourcing SearchFirm recomputes placed_nominee_count, committed_fee_cents, retainer_credit_applied_cents and net_payable_cents, and any affected slate in status COMMITTEE_REVIEW returns to DRAFT with revision_count incremented by 1 and version incremented by 1, because its nominee set changed under review"
          - "cascade hop 5: because such a slate returned to DRAFT, every CommitteeVote for it with status == CAST becomes VOIDED_BY_REVISION and the slate's votes_for, votes_against, votes_abstain, votes_recused, approval_pct and quorum_met are recomputed from the remaining CAST ballots (all zero / false)"
        note: "Fork branch B; head of the depth-5 transitive cascade Screen -> Candidate -> SlateNominee -> NominationSlate + SearchFirm -> CommitteeVote"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /governance/candidates/{candidate_id}/withdraw (cascaded)"
        actor: system
        preconditions:
          - "screen.status IN {DRAFT, SUBMITTED}"
          - "the owning candidate is withdrawing"
        side_effects:
          - "sets determination = PENDING and leaves determined_at null"
        note: "Same transition applies from SUBMITTED"

  - entity: NominationSlate
    initial_state: DRAFT
    terminal_states: [ELECTION_RECORDED, ABANDONED]
    transitions:
      - from: DRAFT
        to: COMMITTEE_REVIEW
        trigger: "POST /governance/slates/{slate_id}/submit-for-review"
        actor: GovernanceStaff
        preconditions:
          - "slate.status == DRAFT"
          - "slate.nominee_count >= 1"
          - "slate.independence_shortfall == false"
          - "slate.committed_search_fee_cents <= slate.search_fee_budget_cents"
        side_effects:
          - "recomputes independent_nominee_pct, independence_shortfall, contested and universal_proxy_applicable from the counted nominee set"
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /governance/slates/{slate_id}/decide with decision == APPROVE"
        actor: CommitteeChair
        preconditions:
          - "slate.status == COMMITTEE_REVIEW"
          - "slate.quorum_met == true"
          - "slate.approval_pct >= ACTIVE policy.approval_threshold_pct"
          - "slate.independence_shortfall == false"
        side_effects:
          - "every SlateNominee for this slate with status == PROPOSED becomes CONFIRMED"
      - from: COMMITTEE_REVIEW
        to: DRAFT
        trigger: "POST /governance/slates/{slate_id}/decide with decision == REJECT"
        actor: CommitteeChair
        preconditions:
          - "slate.status == COMMITTEE_REVIEW"
          - "slate.quorum_met == true"
        side_effects:
          - "increments revision_count by 1"
          - "every CommitteeVote for this slate with status == CAST becomes VOIDED_BY_REVISION"
          - "recomputes votes_for, votes_against, votes_abstain, votes_recused, approval_pct and quorum_met from the remaining CAST ballots"
        note: "Revision loop back to DRAFT; the same target state is reached by the cascade hop 4 transition below"
      - from: COMMITTEE_REVIEW
        to: DRAFT
        trigger: "POST /governance/slate-nominees/{nominee_id}/void or POST /governance/screens/{screen_id}/determine (cascaded)"
        actor: system
        preconditions:
          - "slate.status == COMMITTEE_REVIEW"
          - "the recomputed independence_shortfall became true because a counted nominee left the set"
        side_effects:
          - "increments revision_count by 1"
          - "every CommitteeVote for this slate with status == CAST becomes VOIDED_BY_REVISION and the vote tallies are recomputed"
        note: "Cascade hop 4/5 of the screen-determination chain and of the nominee-void chain"
      - from: APPROVED
        to: FILED
        trigger: "POST /governance/slates/{slate_id}/file"
        actor: CorporateSecretary
        preconditions:
          - "slate.status == APPROVED"
          - "when universal_proxy_applicable == true then nominee_count >= seat_count"
        side_effects:
          - "sets filed_at = logical clock instant"
      - from: FILED
        to: ELECTION_RECORDED
        trigger: "POST /governance/slates/{slate_id}/record-election"
        actor: CorporateSecretary
        preconditions:
          - "slate.status == FILED"
          - "every id in request field elected_nominee_ids is a SlateNominee of this slate with status == CONFIRMED"
          - "count of elected_nominee_ids <= slate.seat_count"
        side_effects:
          - "sets election_recorded_at = logical clock instant"
          - "cascade hop 2: each CONFIRMED SlateNominee of this slate becomes ELECTED when its id is in elected_nominee_ids, otherwise NOT_ELECTED"
          - "cascade hop 3: because a nominee became ELECTED, its Candidate becomes ELECTED, and when incumbent_director_id is null a Director row is created with service_status ONBOARDING, source_candidate_id = the candidate id, full_name/email/birth_date copied from the candidate, is_independent = the nominee's is_independent, appointed_on = the logical clock date; a nominee that became NOT_ELECTED sets its Candidate to NOT_ELECTED and, when incumbent_director_id is not null, sets that Director's service_status SEATED -> NOT_RENOMINATED"
          - "cascade hop 4: because a Director row was created in ONBOARDING, three required OnboardingItem rows are seeded for it (module_code BOARD_ORIENTATION category BUSINESS_ORIENTATION, module_code COMMITTEE_ONBOARD category COMMITTEE_ONBOARDING, module_code DOC_PORTAL category DOCUMENT_ACCESS), each is_required true with credit_hours 0.0 and due_on = logical clock date plus 90 days"
          - "cascade hop 5: because required OnboardingItem rows now exist, the new Director's onboarding_status is recomputed to NOT_STARTED and onboarding_completion_pct to 0.00"
          - "every Director with service_status == RETIREMENT_NOTICED becomes RETIRED"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /governance/slates/{slate_id}/decide with decision == ABANDON"
        actor: CommitteeChair
        preconditions:
          - "slate.status IN {DRAFT, COMMITTEE_REVIEW}"
        side_effects:
          - "every SlateNominee for this slate with status IN {PROPOSED, CONFIRMED} becomes VOIDED, which returns each NOMINATED candidate to DEFERRED"
          - "every CommitteeVote for this slate with status == CAST becomes VOIDED_BY_REVISION"
          - "each sourcing SearchFirm recomputes placed_nominee_count, committed_fee_cents, retainer_credit_applied_cents and net_payable_cents"
        note: "Same transition applies from COMMITTEE_REVIEW"

  - entity: SlateNominee
    initial_state: PROPOSED
    terminal_states: [VOIDED, ELECTED, NOT_ELECTED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /governance/slates/{slate_id}/decide with decision == APPROVE (cascaded)"
        actor: system
        preconditions:
          - "nominee.status == PROPOSED"
          - "the owning slate transitioned COMMITTEE_REVIEW -> APPROVED"
        side_effects:
          - "the nominee remains inside the counted set, so slate and search firm aggregates are unchanged"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /governance/slate-nominees/{nominee_id}/void"
        actor: GovernanceStaff
        preconditions:
          - "nominee.status IN {PROPOSED, CONFIRMED}"
          - "the owning slate has status IN {DRAFT, COMMITTEE_REVIEW}"
        side_effects:
          - "sets voided_at = logical clock instant"
          - "hop 2: because the nominee left the counted set, its Candidate goes NOMINATED -> DEFERRED with deferred_cycle_year = the slate's cycle_year"
          - "hop 3: the owning NominationSlate recomputes nominee_count, independent_nominee_count, independent_nominee_pct, independence_shortfall, committed_search_fee_cents, contested and universal_proxy_applicable, and the sourcing SearchFirm recomputes placed_nominee_count, committed_fee_cents, retainer_credit_applied_cents and net_payable_cents"
          - "hop 4: when the slate was in COMMITTEE_REVIEW and independence_shortfall became true, the slate returns to DRAFT with revision_count incremented and every CAST CommitteeVote becomes VOIDED_BY_REVISION"
        note: "Same transition applies from CONFIRMED, and is also reached as hop 3 of the screen-determination cascade and as part of slate abandonment"
      - from: CONFIRMED
        to: ELECTED
        trigger: "POST /governance/slates/{slate_id}/record-election"
        actor: CorporateSecretary
        preconditions:
          - "nominee.status == CONFIRMED"
          - "the nominee id appears in request field elected_nominee_ids"
        side_effects:
          - "the owning Candidate becomes ELECTED and, for a non-incumbent nominee, a Director row is created in ONBOARDING"
      - from: CONFIRMED
        to: NOT_ELECTED
        trigger: "POST /governance/slates/{slate_id}/record-election"
        actor: CorporateSecretary
        preconditions:
          - "nominee.status == CONFIRMED"
          - "the nominee id does not appear in request field elected_nominee_ids"
        side_effects:
          - "the owning Candidate becomes NOT_ELECTED and any incumbent Director referenced by incumbent_director_id goes SEATED -> NOT_RENOMINATED"

  - entity: Director
    dimension: service_status
    state_field: service_status
    initial_state: ONBOARDING
    terminal_states: [RETIRED, RESIGNED, NOT_RENOMINATED]
    transitions:
      - from: ONBOARDING
        to: SEATED
        trigger: "POST /governance/directors/{director_id}/seat"
        actor: CorporateSecretary
        preconditions:
          - "director.service_status == ONBOARDING"
          - "director.onboarding_status == COMPLETE"
        side_effects:
          - "recomputes compliance_status via director_compliance_status"
        note: "Cross-entity dependency on the director's OnboardingItem rows; a director with no required items has onboarding_status NOT_STARTED and cannot be seated"
      - from: SEATED
        to: RETIREMENT_NOTICED
        trigger: "POST /governance/directors/{director_id}/departure-notice with notice_type == RETIREMENT"
        actor: GovernanceStaff
        preconditions:
          - "director.service_status == SEATED"
        side_effects:
          - "sets retirement_notice_at = logical clock instant"
          - "cascade hop 2: because the director left SEATED, every CommitteeAssignment for this director with status == ACTIVE becomes ENDED with ended_reason_code = RETIREMENT_NOTICE and ended_at = logical clock instant"
          - "cascade hop 3: because those assignments left ACTIVE, each affected Committee recomputes filled_seats and its posture status (AT_STRENGTH, UNDER_STRENGTH or SUSPENDED)"
        note: "Head of the depth-3 transitive cascade Director -> CommitteeAssignment -> Committee"
      - from: SEATED
        to: RESIGNED
        trigger: "POST /governance/directors/{director_id}/departure-notice with notice_type == RESIGNATION"
        actor: GovernanceStaff
        preconditions:
          - "director.service_status == SEATED"
        side_effects:
          - "sets retirement_notice_at = logical clock instant"
          - "cascade hop 2: every CommitteeAssignment for this director with status == ACTIVE becomes ENDED with ended_reason_code = RETIREMENT_NOTICE"
          - "cascade hop 3: each affected Committee recomputes filled_seats and posture status"
        note: "Divergent branch of the same trigger: RESIGNED is terminal immediately, RETIREMENT_NOTICED still stands for election"
      - from: RETIREMENT_NOTICED
        to: RETIRED
        trigger: "POST /governance/slates/{slate_id}/record-election (cascaded)"
        actor: system
        preconditions:
          - "director.service_status == RETIREMENT_NOTICED"
        side_effects:
          - "no further cascade: the director's assignments already ended when the notice was recorded"
      - from: SEATED
        to: NOT_RENOMINATED
        trigger: "POST /governance/slates/{slate_id}/record-election (cascaded)"
        actor: system
        preconditions:
          - "director.service_status == SEATED"
          - "a SlateNominee of the recorded slate with incumbent_director_id == this director became NOT_ELECTED"
        side_effects:
          - "every CommitteeAssignment for this director with status == ACTIVE becomes ENDED with ended_reason_code = RETIREMENT_NOTICE, and each affected Committee recomputes filled_seats and posture status"

  - entity: Director
    dimension: compliance_status
    state_field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: OVERBOARDED
        trigger: "POST /governance/external-directorships"
        actor: GovernanceStaff
        preconditions:
          - "the new directorship has director_id == this director and its ExternalCompany.is_public is true"
          - "external_public_board_count + 1 > the applicable overboarding limit after the row is created"
        side_effects:
          - "recomputes external_public_board_count"
          - "cascade: every Committee with an ACTIVE assignment for this director recomputes posture status to SUSPENDED"
      - from: OVERBOARDED
        to: COMPLIANT
        trigger: "POST /governance/external-directorships/{directorship_id}/end"
        actor: GovernanceStaff
        preconditions:
          - "after the row becomes ENDED, external_public_board_count + 1 <= the applicable overboarding limit"
          - "no ownership or education leg fails"
        side_effects:
          - "recomputes external_public_board_count"
          - "cascade: every Committee with an ACTIVE assignment for this director recomputes posture status"
      - from: COMPLIANT
        to: OWNERSHIP_SHORTFALL
        trigger: "POST /governance/comp-awards/{award_id}/finalize"
        actor: CorporateSecretary
        preconditions:
          - "the finalized award is the governing award for this director"
          - "award.ownership_compliant == false"
          - "the logical clock date >= appointed_on plus ACTIVE policy.ownership_grace_years years"
        side_effects:
          - "copies award.shares_held onto Director.shares_held"
      - from: COMPLIANT
        to: EDUCATION_DELINQUENT
        trigger: "POST /governance/_clock/set_current_utc"
        actor: GovernanceStaff
        preconditions:
          - "director.service_status IN {ONBOARDING, SEATED, RETIREMENT_NOTICED}"
          - "the new logical clock date >= December 31 of ACTIVE policy.cycle_year"
          - "director.education_hours_cycle < ACTIVE policy.education_hours_required"
          - "the overboarding and ownership legs both pass"
        side_effects:
          - "recomputes education_hours_cycle before the comparison"
      - from: EDUCATION_DELINQUENT
        to: COMPLIANT
        trigger: "POST /governance/onboarding-items/{item_id}/complete"
        actor: SeatedDirector
        preconditions:
          - "the completed item has category == CONTINUING_EDUCATION and belongs to this director"
          - "education_hours_cycle >= ACTIVE policy.education_hours_required after the completion"
          - "the overboarding and ownership legs both pass"
        side_effects:
          - "recomputes education_hours_cycle and onboarding_completion_pct"
    note: "This dimension evolves independently of service_status and onboarding_status; the four legs are evaluated in the fixed order overboarding, ownership, education by the director_compliance_status calculation"

  - entity: Director
    dimension: onboarding_status
    state_field: onboarding_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /governance/onboarding-items/{item_id}/complete or POST /governance/onboarding-items/{item_id}/waive"
        actor: SeatedDirector
        preconditions:
          - "at least one OnboardingItem of this director is now in status IN {COMPLETED, WAIVED}"
          - "at least one required OnboardingItem of this director is still PENDING"
        side_effects:
          - "recomputes onboarding_completion_pct"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /governance/onboarding-items/{item_id}/complete or POST /governance/onboarding-items/{item_id}/waive"
        actor: SeatedDirector
        preconditions:
          - "the director has at least one required OnboardingItem"
          - "every required OnboardingItem of this director is in status IN {COMPLETED, WAIVED}"
        side_effects:
          - "sets onboarding_completion_pct = 100.00, which unblocks the ONBOARDING -> SEATED service transition"
      - from: COMPLETE
        to: IN_PROGRESS
        trigger: "POST /governance/directors/{director_id}/onboarding-items"
        actor: GovernanceStaff
        preconditions:
          - "the newly created item has is_required == true"
          - "director.onboarding_status was COMPLETE"
        side_effects:
          - "recomputes onboarding_completion_pct downward"
        note: "Regression loop: adding a required item after completion reopens the programme, so a director already SEATED keeps its seat while a director still ONBOARDING is blocked again"

  - entity: CommitteeAssignment
    initial_state: PROPOSED
    terminal_states: [ENDED, REVOKED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /governance/assignments/{assignment_id}/activate"
        actor: CorporateSecretary
        preconditions:
          - "assignment.status == PROPOSED"
          - "the assigned Director.service_status == SEATED"
          - "when committee.requires_all_independent == true then Director.is_independent == true"
          - "when seat_role == CHAIR then no other CommitteeAssignment of this committee with status == ACTIVE has seat_role == CHAIR"
        side_effects:
          - "sets activated_at = logical clock instant"
          - "recomputes Committee.filled_seats as the count of ACTIVE assignments (the seat-ledger conserved quantity)"
          - "recomputes Committee.status posture"
        note: "Cross-entity dependency: an ONBOARDING director cannot take a committee seat"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /governance/assignments/{assignment_id}/revoke"
        actor: CorporateSecretary
        preconditions:
          - "assignment.status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "sets ended_reason_code = REVOCATION and ended_at = logical clock instant"
          - "recomputes Committee.filled_seats, which returns the seat ledger to its pre-activation value"
          - "recomputes Committee.status posture"
        note: "Compensating action for activation; same transition applies from PROPOSED, where filled_seats is unchanged because a PROPOSED row never consumed a seat"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /governance/directors/{director_id}/departure-notice or POST /governance/slates/{slate_id}/record-election (cascaded)"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
          - "the assigned director left service_status SEATED"
        side_effects:
          - "sets ended_reason_code = RETIREMENT_NOTICE and ended_at = logical clock instant"
          - "recomputes Committee.filled_seats and Committee.status posture"

  - entity: Committee
    initial_state: UNDER_STRENGTH
    terminal_states: []
    transitions:
      - from: UNDER_STRENGTH
        to: AT_STRENGTH
        trigger: "POST /governance/assignments/{assignment_id}/activate (derived posture recompute)"
        actor: system
        preconditions:
          - "filled_seats >= committee.min_seats after the recompute"
          - "at least one ACTIVE assignment has seat_role == CHAIR"
          - "no ACTIVE assignment belongs to a Director with compliance_status == OVERBOARDED"
        side_effects:
          - "no further cascade"
      - from: AT_STRENGTH
        to: UNDER_STRENGTH
        trigger: "POST /governance/assignments/{assignment_id}/revoke or the departure-notice cascade (derived posture recompute)"
        actor: system
        preconditions:
          - "filled_seats < committee.min_seats after the recompute, or no ACTIVE assignment has seat_role == CHAIR"
        side_effects:
          - "no further cascade"
      - from: AT_STRENGTH
        to: SUSPENDED
        trigger: "POST /governance/external-directorships (derived posture recompute)"
        actor: system
        preconditions:
          - "at least one ACTIVE assignment belongs to a Director whose compliance_status became OVERBOARDED"
        side_effects:
          - "no further cascade"
        note: "Same transition applies from UNDER_STRENGTH; SUSPENDED outranks the seat-count posture"
      - from: SUSPENDED
        to: AT_STRENGTH
        trigger: "POST /governance/external-directorships/{directorship_id}/end (derived posture recompute)"
        actor: system
        preconditions:
          - "no ACTIVE assignment belongs to a Director with compliance_status == OVERBOARDED"
          - "filled_seats >= committee.min_seats and an ACTIVE CHAIR exists"
        side_effects:
          - "no further cascade"

  - entity: InterviewSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /governance/interviews/{interview_id}/complete"
        actor: CommitteeMember
        preconditions:
          - "session.status == SCHEDULED"
          - "the acting director id equals interviewer_director_id"
          - "request fields score and recommendation are present"
        side_effects:
          - "sets completed_at = logical clock instant, score and recommendation"
          - "recomputes Candidate.completed_interview_count, Candidate.interview_score_avg and Candidate.readiness_score"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /governance/interviews/{interview_id}/cancel with resolution == CANCELLED"
        actor: GovernanceStaff
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "the session no longer occupies the interviewer's calendar, so a later session may reuse the interval"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /governance/interviews/{interview_id}/cancel with resolution == NO_SHOW"
        actor: GovernanceStaff
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "the session no longer occupies the interviewer's calendar and does not count toward completed_interview_count"
        note: "Divergent branch of the same trigger; NO_SHOW is retained for the candidate file, CANCELLED is not"

  - entity: OnboardingItem
    initial_state: PENDING
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /governance/onboarding-items/{item_id}/complete"
        actor: SeatedDirector
        preconditions:
          - "item.status == PENDING"
          - "when the actor role is SeatedDirector then the acting director id equals director_id"
        side_effects:
          - "sets completed_at = logical clock instant"
          - "recomputes Director.onboarding_status, Director.onboarding_completion_pct and Director.education_hours_cycle"
          - "recomputes Director.compliance_status via director_compliance_status"
      - from: PENDING
        to: WAIVED
        trigger: "POST /governance/onboarding-items/{item_id}/waive"
        actor: CommitteeChair
        preconditions:
          - "item.status == PENDING"
          - "request field waiver_reason is a non-empty string"
        side_effects:
          - "sets waiver_reason"
          - "recomputes Director.onboarding_status and Director.onboarding_completion_pct; waived items count as satisfied but contribute no credit_hours"

  - entity: CommitteeVote
    initial_state: CAST
    terminal_states: [VOIDED_BY_REVISION]
    transitions:
      - from: CAST
        to: VOIDED_BY_REVISION
        trigger: "POST /governance/slates/{slate_id}/decide with decision IN {REJECT, ABANDON}, POST /governance/slate-nominees/{nominee_id}/void or POST /governance/screens/{screen_id}/determine (cascaded)"
        actor: system
        preconditions:
          - "vote.status == CAST"
          - "the owning slate returned to DRAFT or became ABANDONED"
        side_effects:
          - "the slate's votes_for, votes_against, votes_abstain, votes_recused, approval_pct and quorum_met are recomputed from the remaining CAST ballots"
        note: "Terminal hop of both cascades; a voided ballot never counts again, so the committee must re-ballot the revised slate"

  - entity: DirectorCompensationAward
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /governance/comp-awards/{award_id}/finalize"
        actor: CorporateSecretary
        preconditions:
          - "award.status == DRAFT"
          - "the owning Director.service_status IN {ONBOARDING, SEATED, RETIREMENT_NOTICED}"
        side_effects:
          - "sets finalized_at = logical clock instant"
          - "copies award.shares_held onto Director.shares_held"
          - "recomputes Director.compliance_status via director_compliance_status, which may set OWNERSHIP_SHORTFALL"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /governance/directors/{director_id}/departure-notice (cascaded)"
        actor: system
        preconditions:
          - "award.status == DRAFT"
          - "the owning director left service_status SEATED"
        side_effects:
          - "the award no longer occupies the per-director per-cycle uniqueness slot"

  - entity: GovernancePolicy
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /governance/policies"
        actor: CorporateSecretary
        preconditions:
          - "an existing GovernancePolicy has status == ACTIVE"
        side_effects:
          - "the newly created policy is ACTIVE and becomes the governing policy from the next request onward"
        note: "Superseding never rewrites frozen copies already taken by submitted screens or created awards"

concurrency_rules:
  - rule_id: slate-nominee-add-stale-slate
    parent_entity: NominationSlate
    write_endpoint: "POST /governance/slates/{slate_id}/nominees"
    occ_field: "expected_slate_version"
    description: |
      Adding a nominee to a NominationSlate whose version has advanced since the
      client last read it is rejected with 412. The nominee-add decision depends on
      slate-level aggregates the writer can only have read beforehand
      (nominee_count against seat_count, independent_nominee_pct against the
      independence floor, committed_search_fee_cents against search_fee_budget_cents),
      so a write built on a stale view of those aggregates would legitimately
      succeed under the product rules yet leave the slate outside policy. The check
      compares expected_slate_version to the slate's current version only.
    error_id: ERR_STALE_SLATE_VERSION
    http_status: 412
  - rule_id: committee-assignment-create-stale-committee
    parent_entity: Committee
    write_endpoint: "POST /governance/committees/{committee_id}/assignments"
    occ_field: "expected_committee_version"
    description: |
      Proposing a CommitteeAssignment against a Committee whose version has advanced
      since the client last read it is rejected with 412. Seat capacity is evaluated
      against the committee's own occupancy at the requested term start, so a writer
      holding a stale view of the committee (its authorized seat occupancy, chair seat
      or posture) would otherwise commit a proposal that the committee file cannot
      honour. The check compares expected_committee_version to the committee's current
      version only.
    error_id: ERR_STALE_COMMITTEE_VERSION
    http_status: 412

calculations:
  - name: active_policy_selector
    trigger: "Every request that reads a governance threshold (screen submit, conflict clearance, nominee add, slate submit-for-review, slate decide, comp award create, compliance recompute, clock advance)"
    algorithm: selector_policy
    formula: |
      candidates = [p for p in GovernancePolicy if p.status == "ACTIVE"]
      # ranking: latest effective_from wins; created_at breaks exact ties (never id)
      ordered = sort(candidates, key=(p.effective_from DESC, p.created_at DESC))
      if len(ordered) == 0: reject request with ERR_NO_ACTIVE_POLICY (409)
      active_policy = ordered[0]
    input_set: "GovernancePolicy rows with status == ACTIVE only; SUPERSEDED rows are never consulted"
    constants: {}
    precision: "n/a"
    variants: []
    note: "Eligibility filter, ranking expression, tie-break and empty-set fallback are all pinned; POST /governance/policies flips every prior ACTIVE row to SUPERSEDED, so at most one row is normally eligible"

  - name: independence_determination
    trigger: "POST /governance/screens/{screen_id}/submit computes the fail counts and the disqualifying factor; POST /governance/screens/{screen_id}/determine selects the fork from the count of standard_applied"
    algorithm: threshold
    formula: |
      P = active_policy_selector()
      clock_date = date part of the logical clock instant
      payment_threshold_cents = max(
          P.bright_line_payment_floor_cents,
          round_half_up(P.bright_line_revenue_pct / 100.0 * screen.recipient_gross_revenue_cents)
      )
      F1_PAYMENT_MATERIALITY = screen.payments_to_company_cents > payment_threshold_cents          # strictly greater
      F3_FAMILY_EMPLOYMENT   = screen.family_member_employed == true
      F4_AUDITOR_AFFILIATION = screen.auditor_affiliation == true

      def recent_employment(lookback_years):
          if screen.prior_employment_end_on is null: return false
          return (clock_date - screen.prior_employment_end_on).days < lookback_years * 365   # strictly less

      F2_BRIGHT  = recent_employment(P.bright_line_lookback_years)
      F2_ENHANCED = recent_employment(P.enhanced_lookback_years)
      charitable_threshold_cents = round_half_up(P.enhanced_charitable_pct / 100.0 * screen.company_gross_revenue_cents)
      F5_CHARITABLE_MATERIALITY = screen.charitable_contributions_cents >= charitable_threshold_cents   # at or above

      bright_line_fail_count  = count(true in [F1_PAYMENT_MATERIALITY, F2_BRIGHT,   F3_FAMILY_EMPLOYMENT, F4_AUDITOR_AFFILIATION])
      qualitative_fail_count  = count(true in [F1_PAYMENT_MATERIALITY, F2_ENHANCED, F3_FAMILY_EMPLOYMENT, F4_AUDITOR_AFFILIATION, F5_CHARITABLE_MATERIALITY])

      screen.standard_applied = P.independence_standard
      applied_count = bright_line_fail_count if screen.standard_applied == "BRIGHT_LINE" else qualitative_fail_count
      # first failing factor of the APPLIED standard, in this fixed order
      order = ["PAYMENT_MATERIALITY", "RECENT_EMPLOYMENT", "FAMILY_EMPLOYMENT", "AUDITOR_AFFILIATION", "CHARITABLE_MATERIALITY"]
      screen.disqualifying_factor_code = first factor in `order` that fails under standard_applied, else null
      determination = "NOT_INDEPENDENT" if applied_count >= 1 else "INDEPENDENT"
    input_set: "One IndependenceScreen row in status DRAFT at submit time, plus the ACTIVE GovernancePolicy; no other screen of the same candidate participates"
    constants:
      DAYS_PER_YEAR: 365
    precision: "cent thresholds round_half_up to whole cents; comparisons are exact integers"
    variants:
      - name: bright_line_only
        when: "ACTIVE policy.independence_standard == BRIGHT_LINE (screen.standard_applied frozen to BRIGHT_LINE at submit)"
        difference: "Evaluates F1 with a 3-year employment lookback and ignores F5 charitable materiality entirely; qualitative_fail_count is still recorded for the file but does not drive the fork"
      - name: qualitative_committee
        when: "ACTIVE policy.independence_standard == ENHANCED (screen.standard_applied frozen to ENHANCED at submit)"
        difference: "Extends the employment lookback to 5 years and adds the charitable materiality factor, so an identical screen payload can yield NOT_INDEPENDENT where bright_line_only yields INDEPENDENT"
    note: "Dual-variant instance on the candidate-independence domain; the two variants disagree for the same screen payload whenever employment ended between 3 and 5 years before the clock, or charitable contributions are at or above 2 percent of issuer revenue"

  - name: skills_gap_analysis
    trigger: "GET /governance/skills-matrix/gap-analysis"
    algorithm: weighted_scoring
    formula: |
      seated = [d for d in Director if d.service_status IN {"SEATED", "ONBOARDING"}]
      def rating_of(d, c, variant):
          r = the DirectorSkillRating with director_id == d.id and skill_category_id == c.id, or null
          if r is null: return 0
          if variant == "SELF_REPORTED":  return r.self_rating
          if variant == "VALIDATED_ONLY": return r.validated_rating if r.validation_status == "VALIDATED" else 0
      for each SkillCategory c ordered by c.code ASC:
          covered_director_count = count(d in seated where rating_of(d, c, variant) >= 3)     # at or above 3
          gap = max(0, c.required_min_directors - covered_director_count)
          risk_multiplier = 1.5 if c.risk_oversight else 1.0
          weighted_gap = round_half_up(gap * c.strategic_weight * risk_multiplier, 2)
          severity = "CRITICAL_GAP" if gap >= 2 else ("MINOR_GAP" if gap == 1 else "COVERED")
      board_gap_index = round_half_up(sum of weighted_gap over all SkillCategory rows, 2)
      # priority category: highest weighted_gap, then criticality rank CORE(0) < STRATEGIC(1) < EMERGING(2), then code ASC
      priority_category_code = sort(categories, key=(weighted_gap DESC, criticality_rank ASC, code ASC))[0].code
      if no SkillCategory rows exist: board_gap_index = 0.00 and priority_category_code = null
    input_set: "All SkillCategory rows; Director rows with service_status IN {SEATED, ONBOARDING} only (RETIRED, RESIGNED, NOT_RENOMINATED and RETIREMENT_NOTICED directors are excluded); DirectorSkillRating rows of those directors"
    constants:
      COVERAGE_RATING_FLOOR: 3
      RISK_OVERSIGHT_MULTIPLIER: 1.5
      CRITICALITY_RANK: { CORE: 0, STRATEGIC: 1, EMERGING: 2 }
    precision: "weighted_gap and board_gap_index round_half_up to 2 decimal places"
    variants:
      - name: self_reported
        when: "query parameter variant == SELF_REPORTED (the default)"
        difference: "Uses DirectorSkillRating.self_rating for every rating row regardless of validation_status"
      - name: validated_only
        when: "query parameter variant == VALIDATED_ONLY"
        difference: "Uses validated_rating and treats every UNVALIDATED row as rating 0, so the same board can be fully covered under self_reported and critically short under validated_only, and the priority category can differ between the two"
    note: "Dual-variant instance on the board-composition domain, structurally unrelated to the candidate-independence variants; the empty-board case is the zero-director boundary"

  - name: search_firm_placement_fee
    trigger: "POST /governance/slates/{slate_id}/nominees for a nominee whose Candidate.source_channel == SEARCH_FIRM; recomputed on POST /governance/slate-nominees/{nominee_id}/void and on every cascade that voids a nominee"
    algorithm: tiered_pricing
    formula: |
      firm = the SearchFirm referenced by candidate.search_firm_id
      # ordering of the firm's fee-bearing nominees; created_at then ballot_order, never id
      fee_bearing = [n for n in SlateNominee
                       if n.status IN {"PROPOSED", "CONFIRMED", "ELECTED"}
                       and Candidate(n.candidate_id).search_firm_id == firm.id]
      ordered = sort(fee_bearing, key=(created_at ASC, ballot_order ASC))
      nominee_ordinal = 1-based index of this nominee inside `ordered`
      pct = firm.placement_fee_pct if nominee_ordinal <= 2 else firm.placement_fee_tier2_pct
      fee_tier_applied = "TIER1" if nominee_ordinal <= 2 else "TIER2"
      # ROUNDING ORDER IS PINNED: round each nominee's fee to whole cents FIRST, then sum
      placement_fee_cents = round_half_up(pct / 100.0 * Candidate(n.candidate_id).target_annual_comp_cents)
      firm.placed_nominee_count       = len(ordered)
      firm.committed_fee_cents        = sum(n.placement_fee_cents for n in ordered)      # sum of already-rounded values
      firm.retainer_credit_applied_cents = min(firm.retainer_fee_cents, firm.committed_fee_cents) if firm.fee_model == "RETAINER" else 0
      firm.net_payable_cents          = firm.committed_fee_cents - firm.retainer_credit_applied_cents
      slate.committed_search_fee_cents = sum(n.placement_fee_cents for n in this slate's counted nominees)
    input_set: "SlateNominee rows with status IN {PROPOSED, CONFIRMED, ELECTED} whose candidate was sourced by the firm, across all slates; VOIDED and NOT_ELECTED rows leave the set and are excluded from every aggregate"
    constants:
      TIER1_MAX_ORDINAL: 2
    precision: "round_half_up to whole cents PER NOMINEE, then integer summation; summing the raw products and rounding once is explicitly wrong and can differ by one or more cents"
    variants: []
    note: "Combinatorial mode (b) instance: nested rounding where the order matters. Because each nominee's fee is a rounded integer, voiding a nominee releases exactly the cents it committed, which is what makes the search-fee ledger invariant hold with zero drift"

  - name: director_compensation_award
    trigger: "POST /governance/directors/{director_id}/comp-awards computes every derived money field; POST /governance/comp-awards/{award_id}/finalize freezes them and feeds the ownership leg of director_compliance_status"
    algorithm: waterfall_allocation
    formula: |
      P = active_policy_selector()
      service_days = (award.service_end_on - award.service_start_on).days + 1          # both endpoints inclusive
      committee_member_seat_count = count(CommitteeAssignment where director_id == d.id and status == "ACTIVE" and seat_role == "MEMBER")
      committee_chair_seat_count  = count(CommitteeAssignment where director_id == d.id and status == "ACTIVE" and seat_role == "CHAIR")
      prorated_cash_retainer_cents = round_half_up(P.annual_cash_retainer_cents * service_days / 365.0)
      committee_fees_cents = committee_member_seat_count * P.committee_member_fee_cents
                           + committee_chair_seat_count  * P.committee_chair_premium_cents
      equity_value_cents   = P.equity_grant_value_cents
      # STEP 1 - pre-offset total
      pre_offset_total_cents = prorated_cash_retainer_cents + committee_fees_cents + equity_value_cents
      # STEP 2 - the offset tier is keyed on pre_offset_total_cents, NEVER re-derived from total_cents
      excess_offset_pct = 0.0 if pre_offset_total_cents <= 30000000
                     else 2.5 if pre_offset_total_cents <= 40000000
                     else 5.0
      # STEP 3 - apply
      excess_offset_cents = round_half_up(excess_offset_pct / 100.0 * pre_offset_total_cents)
      total_cents         = pre_offset_total_cents - excess_offset_cents
      # ownership guideline uses CASH compensation only (retainer + committee fees), excluding equity and offset
      ownership_requirement_cents = round_half_up(P.ownership_multiple * (prorated_cash_retainer_cents + committee_fees_cents))
      ownership_actual_cents      = award.shares_held * award.share_price_cents
      ownership_compliant         = ownership_actual_cents >= ownership_requirement_cents
    input_set: "One DirectorCompensationAward row, the ACTIVE GovernancePolicy, and the owning director's CommitteeAssignment rows with status == ACTIVE at award-creation time; PROPOSED, ENDED and REVOKED assignments contribute nothing"
    constants:
      DAYS_PER_YEAR: 365
      OFFSET_TIER1_CEILING_CENTS: 30000000
      OFFSET_TIER2_CEILING_CENTS: 40000000
      OFFSET_TIER2_PCT: 2.5
      OFFSET_TIER3_PCT: 5.0
    precision: "every money field is whole cents, round_half_up; each rounding is applied once at the step shown"
    variants: []
    note: "Combinatorial mode (c) instance: total_cents is defined net of an offset whose tier is keyed on the total, and the scaffold pins the evaluation order to the PRE-offset total. A pre_offset_total_cents strictly between 40000000 and 42105263 lands in the 5.0 tier while its own total_cents falls back below 40000000, so an implementation that re-derives the tier from total_cents produces a different, wrong number"

  - name: candidate_readiness_score
    trigger: "Recomputed on POST /governance/interviews/{interview_id}/complete, POST /governance/candidates/{candidate_id}/reference-check, POST /governance/candidates/{candidate_id}/conflict-clearance and on screen determination; gate for POST /governance/slates/{slate_id}/nominees"
    algorithm: weighted_scoring
    formula: |
      interview_component = min(40.00, round_half_up(8.0 * candidate.interview_score_avg, 2))
      independence_component = 30.00 if candidate.independence_result == "INDEPENDENT" else 0.00
      channel_component = 20.00 if candidate.source_channel == "SEARCH_FIRM"
                     else 15.00 if candidate.source_channel == "NETWORK_REFERRAL"
                     else 10.00 if candidate.source_channel == "SHAREHOLDER_PROPOSAL"
                     else  5.00      # UNIVERSAL_PROXY_NOMINATION
      board_capacity_component = max(0.00, 10.00 - 2.5 * candidate.external_public_board_count)
      reference_penalty = 15.00 if candidate.adverse_reference_found else 0.00
      gross = min(100.00, interview_component + independence_component + channel_component + board_capacity_component)
      readiness_score = round_half_up(gross - reference_penalty, 2)
    input_set: "One Candidate row plus its COMPLETED InterviewSession rows (through interview_score_avg) and its ACTIVE public ExternalDirectorship rows (through external_public_board_count)"
    constants:
      INTERVIEW_POINTS_PER_SCORE: 8.0
      INTERVIEW_COMPONENT_CAP: 40.00
      INDEPENDENCE_POINTS: 30.00
      BOARD_CAPACITY_BASE: 10.00
      BOARD_CAPACITY_PENALTY_PER_SEAT: 2.5
      ADVERSE_REFERENCE_PENALTY: 15.00
      SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up; the cap is applied to the gross sum BEFORE the adverse-reference penalty is subtracted"
    variants: []
    note: "Non-linear formula with five inputs, a nested min/max pair and conditional branches on two enum fields; the ceiling-then-penalty order means a candidate at the ceiling still loses the full 15.00 penalty"

  - name: slate_independence_pct
    trigger: "Recomputed on POST /governance/slates/{slate_id}/nominees, POST /governance/slate-nominees/{nominee_id}/void, POST /governance/slates/{slate_id}/submit-for-review and every cascade that changes a nominee's status"
    algorithm: aggregation
    formula: |
      P = active_policy_selector()
      counted = [n for n in SlateNominee if n.slate_id == S.id and n.status IN {"PROPOSED", "CONFIRMED", "ELECTED"}]
      nominee_count = len(counted)
      independent_nominee_count = count(n in counted where n.is_independent == true)
      independent_nominee_pct = 0.00 if nominee_count == 0
                                else round_half_up(100.0 * independent_nominee_count / nominee_count, 2)
      independence_shortfall = (nominee_count > 0) and (independent_nominee_pct < P.independence_min_pct)
      contested = any(Candidate(n.candidate_id).source_channel == "UNIVERSAL_PROXY_NOMINATION" for n in counted)
      universal_proxy_applicable = contested
      # nominee is_independent, evaluated once at nominee creation and refreshed by cascades
      n.is_independent = Director(n.incumbent_director_id).is_independent if n.incumbent_director_id is not null
                         else (Candidate(n.candidate_id).independence_result == "INDEPENDENT")
    input_set: "SlateNominee rows of one slate with status IN {PROPOSED, CONFIRMED, ELECTED}; VOIDED and NOT_ELECTED rows are excluded from both numerator and denominator"
    constants: {}
    precision: "independent_nominee_pct round_half_up to 2 decimal places; the shortfall comparison is strictly less than the policy floor, so an exact match passes"
    variants: []
    note: "Empty-slate boundary: nominee_count == 0 yields pct 0.00 with independence_shortfall false, so an empty slate is blocked by the nominee_count >= 1 precondition rather than by the independence floor"

  - name: committee_vote_tally
    trigger: "Recomputed on POST /governance/slates/{slate_id}/votes and read by POST /governance/slates/{slate_id}/decide"
    algorithm: aggregation
    formula: |
      P = active_policy_selector()
      cast = [v for v in CommitteeVote if v.slate_id == S.id and v.status == "CAST"]
      votes_for     = count(v in cast where v.ballot == "FOR")
      votes_against = count(v in cast where v.ballot == "AGAINST")
      votes_abstain = count(v in cast where v.ballot == "ABSTAIN")
      votes_recused = count(v in cast where v.ballot == "RECUSED")
      quorum_met = (votes_for + votes_against + votes_abstain + votes_recused) >= P.quorum_size
      non_recused = votes_for + votes_against + votes_abstain
      approval_pct = 0.00 if non_recused == 0 else round_half_up(100.0 * votes_for / non_recused, 2)
      approval_met = quorum_met and (approval_pct >= P.approval_threshold_pct)
    input_set: "CommitteeVote rows of one slate with status == CAST; VOIDED_BY_REVISION ballots are excluded from every tally"
    constants: {}
    precision: "approval_pct round_half_up to 2 decimal places; the approval comparison is at-or-above, so 66.67 against a 66.67 floor passes"
    variants: []
    note: "RECUSED ballots count toward quorum but are removed from the approval denominator, so a three-member committee with one recusal needs both remaining ballots FOR to clear a 66.67 percent floor"

  - name: interlock_and_overboarding_evaluation
    trigger: "POST /governance/candidates/{candidate_id}/conflict-clearance; re-evaluated at POST /governance/slates/{slate_id}/nominees"
    algorithm: topological
    formula: |
      P = active_policy_selector()
      candidate_companies = { ed.external_company_id
                              for ed in ExternalDirectorship
                              if ed.candidate_id == C.id and ed.status == "ACTIVE"
                              and ExternalCompany(ed.external_company_id).is_public == true }
      relevant_directors = [d for d in Director if d.service_status IN {"ONBOARDING", "SEATED", "RETIREMENT_NOTICED"}]
      for d in relevant_directors:
          director_companies = { ed.external_company_id
                                 for ed in ExternalDirectorship
                                 if ed.director_id == d.id and ed.status == "ACTIVE"
                                 and ExternalCompany(ed.external_company_id).is_public == true }
          shared(d) = len(candidate_companies INTERSECT director_companies)
      interlock_shared_board_count = max(shared(d) for d in relevant_directors) if relevant_directors else 0
      competitor_overlap = any(ExternalCompany(x).is_competitor for x in
                               (candidate_companies INTERSECT union of all director_companies))
      interlock_violation = competitor_overlap or (interlock_shared_board_count >= P.interlock_max_shared_boards)
      overboard_limit = P.max_public_boards_sitting_ceo if C.is_sitting_ceo else P.max_public_boards_default
      external_public_board_count = len(candidate_companies)
      overboarding_violation = (external_public_board_count + 1) > overboard_limit      # +1 counts this board
      candidate_age_years = floor((clock_date - C.birth_date).days / 365)
      retirement_violation = candidate_age_years >= P.mandatory_retirement_age
      # fixed evaluation order; the first violation decides the rejection reason
      first_failure = "INTERLOCK_LIMIT"  if interlock_violation
                 else "OVERBOARDING"     if overboarding_violation
                 else "RETIREMENT_AGE"   if retirement_violation
                 else null
    input_set: "ACTIVE ExternalDirectorship rows of the candidate and of every Director with service_status IN {ONBOARDING, SEATED, RETIREMENT_NOTICED}, restricted to ExternalCompany rows with is_public == true; ENDED rows and private companies are excluded"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer counts; the interlock test is at-or-above the limit, the overboarding test is strictly greater than the limit"
    variants: []
    note: "The interlock count is a graph intersection over the shared-board bipartite graph; the empty-director-set case yields 0 rather than an error"

  - name: director_compliance_status
    trigger: "Recomputed on POST /governance/external-directorships, POST /governance/external-directorships/{directorship_id}/end, POST /governance/comp-awards/{award_id}/finalize, POST /governance/onboarding-items/{item_id}/complete, POST /governance/directors/{director_id}/seat and POST /governance/_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      P = active_policy_selector()
      clock_date = date part of the logical clock instant
      external_public_board_count = count(ed for ed in ExternalDirectorship
                                          if ed.director_id == d.id and ed.status == "ACTIVE"
                                          and ExternalCompany(ed.external_company_id).is_public == true)
      limit = P.max_public_boards_sitting_ceo if d.is_sitting_ceo_elsewhere else P.max_public_boards_default
      # governing award selector: FINALIZED only, latest cycle_year then latest finalized_at, created_at breaks ties
      awards = [a for a in DirectorCompensationAward if a.director_id == d.id and a.status == "FINALIZED"]
      governing_award = sort(awards, key=(cycle_year DESC, finalized_at DESC, created_at DESC))[0] if awards else null
      ownership_enforced = clock_date >= (d.appointed_on plus P.ownership_grace_years years)
      education_deadline_on = December 31 of P.cycle_year
      education_hours_cycle = sum(item.credit_hours for item in OnboardingItem
                                 if item.director_id == d.id and item.category == "CONTINUING_EDUCATION"
                                 and item.status == "COMPLETED"
                                 and year(item.completed_at) == P.cycle_year)
      # LEG ORDER IS FIXED - first match wins
      if external_public_board_count + 1 > limit:                                        compliance_status = "OVERBOARDED"
      elif governing_award is not null and governing_award.ownership_compliant == false
           and ownership_enforced:                                                       compliance_status = "OWNERSHIP_SHORTFALL"
      elif clock_date >= education_deadline_on
           and education_hours_cycle < P.education_hours_required:                        compliance_status = "EDUCATION_DELINQUENT"
      else:                                                                              compliance_status = "COMPLIANT"
    input_set: "One Director row, its ACTIVE public ExternalDirectorship rows, its FINALIZED DirectorCompensationAward rows, and its COMPLETED CONTINUING_EDUCATION OnboardingItem rows whose completed_at falls in the ACTIVE policy cycle_year"
    constants: {}
    precision: "integer and hour comparisons are exact; the overboarding test is strictly greater, the education test is strictly less than the requirement"
    variants: []
    note: "Independent compliance dimension of the Director parallel state machine; the fixed leg order means an overboarded director with an ownership shortfall reports OVERBOARDED"

  - name: director_onboarding_rollup
    trigger: "Recomputed on POST /governance/directors/{director_id}/onboarding-items, POST /governance/onboarding-items/{item_id}/complete and POST /governance/onboarding-items/{item_id}/waive"
    algorithm: aggregation
    formula: |
      required = [i for i in OnboardingItem if i.director_id == d.id and i.is_required == true]
      satisfied_required = [i for i in required if i.status IN {"COMPLETED", "WAIVED"}]
      any_touched = any(i.status IN {"COMPLETED", "WAIVED"} for i in OnboardingItem if i.director_id == d.id)
      if len(required) == 0:                                onboarding_status = "NOT_STARTED"
      elif len(satisfied_required) == len(required):        onboarding_status = "COMPLETE"
      elif any_touched:                                     onboarding_status = "IN_PROGRESS"
      else:                                                 onboarding_status = "NOT_STARTED"
      onboarding_completion_pct = 0.00 if len(required) == 0
                                  else round_half_up(100.0 * len(satisfied_required) / len(required), 2)
    input_set: "All OnboardingItem rows of one director; optional items influence any_touched but never the required denominator"
    constants: {}
    precision: "onboarding_completion_pct round_half_up to 2 decimal places"
    variants: []
    note: "Compound rollup: the director's onboarding dimension is a pure function of its items, so adding a required item to a COMPLETE director regresses the dimension to IN_PROGRESS"

  - name: committee_seat_ledger
    trigger: "Recomputed on POST /governance/assignments/{assignment_id}/activate, POST /governance/assignments/{assignment_id}/revoke and every cascade that ends an assignment"
    algorithm: aggregation
    formula: |
      filled_seats = count(a for a in CommitteeAssignment if a.committee_id == C.id and a.status == "ACTIVE")
      has_active_chair = any(a.seat_role == "CHAIR" for a in CommitteeAssignment
                             if a.committee_id == C.id and a.status == "ACTIVE")
      has_overboarded_member = any(Director(a.director_id).compliance_status == "OVERBOARDED"
                                   for a in CommitteeAssignment
                                   if a.committee_id == C.id and a.status == "ACTIVE")
      status = "SUSPENDED"      if has_overboarded_member
          else "AT_STRENGTH"    if (filled_seats >= C.min_seats and has_active_chair)
          else "UNDER_STRENGTH"
    input_set: "CommitteeAssignment rows of one committee with status == ACTIVE only; PROPOSED, ENDED and REVOKED rows never occupy a seat"
    constants: {}
    precision: "exact integer count"
    variants: []
    note: "Conserved quantity of the seat-ledger invariant: activate followed by revoke must return filled_seats to the exact count of remaining ACTIVE assignments, with the posture recomputed from the same count"

validations:
  # ---- 1-3 authentication / authorization / ownership ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles in §1.7 and that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles acting on their own resource: X-User-ID equals the resource's owning id — SeatedDirector/CommitteeMember/CommitteeChair acting on a director resource must equal that Director.id; SearchFirmPartner reading a firm resource must equal that SearchFirm.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /governance/directors/{director_id}/skill-ratings, POST /governance/onboarding-items/{item_id}/complete, POST /governance/slates/{slate_id}/votes, GET /governance/search-firms/{firm_id}"

  # ---- 10-15 payload shape ----
  - priority: 10
    category: existence
    check: "Every required field declared in the endpoint's input list is present and of the declared JSON type; unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 11
    category: existence
    check: "Every enum-typed input value is a member of the enum declared in §1.1 (source_channel, fee_model, criticality, seat_role, ballot, notice_type, resolution, decision, category, variant, independence_standard)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "POST /governance/candidates, POST /governance/search-firms, POST /governance/skill-categories, POST /governance/committees/{committee_id}/assignments, POST /governance/slates/{slate_id}/votes, POST /governance/directors/{director_id}/departure-notice, POST /governance/interviews/{interview_id}/cancel, POST /governance/slates/{slate_id}/decide, POST /governance/directors/{director_id}/onboarding-items, GET /governance/skills-matrix/gap-analysis, POST /governance/policies, POST /governance/directors"
  - priority: 12
    category: existence
    check: "Numeric inputs are inside their declared ranges: skill ratings 1..5 inclusive, interview score 1..5 inclusive, required_min_directors >= 1, strategic_weight 0.0..1.0, percentages 0.0..100.0, cent amounts and counts >= 0"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /governance/directors/{director_id}/skill-ratings, POST /governance/skill-ratings/{rating_id}/validate, POST /governance/interviews/{interview_id}/complete, POST /governance/skill-categories, POST /governance/search-firms, POST /governance/policies, POST /governance/directors/{director_id}/comp-awards"
  - priority: 13
    category: existence
    check: "Interval inputs are sane: interview end_at strictly after start_at, assignment term_end_on on or after term_start_on, award service_end_on on or after service_start_on, external directorship end_on on or after start_on"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /governance/interviews, POST /governance/committees/{committee_id}/assignments, POST /governance/directors/{director_id}/comp-awards, POST /governance/external-directorships/{directorship_id}/end"
  - priority: 14
    category: existence
    check: "ExternalDirectorship subject exclusivity: exactly one of director_id or candidate_id is supplied; supplying both or neither is rejected"
    error_id: ERR_DIRECTORSHIP_SUBJECT_INVALID
    http_status: 422
    applies_to: "POST /governance/external-directorships"
  - priority: 15
    category: existence
    check: "Candidate source-channel coherence: source_channel == SEARCH_FIRM requires search_firm_id and forbids referring_director_id; source_channel == NETWORK_REFERRAL requires referring_director_id and forbids search_firm_id; SHAREHOLDER_PROPOSAL and UNIVERSAL_PROXY_NOMINATION require shareholder_proponent_name and forbid both id fields. SlateNominee subject exclusivity: exactly one of candidate_id or incumbent_director_id"
    error_id: ERR_SOURCE_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /governance/candidates, POST /governance/slates/{slate_id}/nominees"

  # ---- 20-25 existence of referenced resources ----
  - priority: 20
    category: existence
    check: "Every path id resolves to an existing row, validated left-to-right in path order (parent before child)"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_SKILL_CATEGORY_NOT_FOUND | ERR_SEARCH_FIRM_NOT_FOUND | ERR_EXTERNAL_COMPANY_NOT_FOUND | ERR_DIRECTOR_NOT_FOUND | ERR_SKILL_RATING_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_SCREEN_NOT_FOUND | ERR_DIRECTORSHIP_NOT_FOUND | ERR_INTERVIEW_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SLATE_NOT_FOUND | ERR_NOMINEE_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_ONBOARDING_ITEM_NOT_FOUND | ERR_COMP_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 21
    category: existence
    check: "Every id supplied in the request body resolves to an existing row (search_firm_id, referring_director_id, skill_category_id, external_company_id, candidate_id, director_id, incumbent_director_id, interviewer_director_id, voting_director_id, elected_nominee_ids members)"
    error_id: "ERR_SEARCH_FIRM_NOT_FOUND | ERR_DIRECTOR_NOT_FOUND | ERR_SKILL_CATEGORY_NOT_FOUND | ERR_EXTERNAL_COMPANY_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_NOMINEE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /governance/candidates, POST /governance/directors/{director_id}/skill-ratings, POST /governance/external-directorships, POST /governance/interviews, POST /governance/committees/{committee_id}/assignments, POST /governance/slates/{slate_id}/nominees, POST /governance/slates/{slate_id}/votes, POST /governance/slates/{slate_id}/record-election"
  - priority: 25
    category: existence
    check: "An ACTIVE GovernancePolicy exists whenever a threshold is required (active_policy_selector returns an empty set)"
    error_id: ERR_NO_ACTIVE_POLICY
    http_status: 409
    applies_to: "POST /governance/screens/{screen_id}/submit, POST /governance/candidates/{candidate_id}/conflict-clearance, POST /governance/slates/{slate_id}/nominees, POST /governance/slates/{slate_id}/submit-for-review, POST /governance/slates/{slate_id}/decide, POST /governance/directors/{director_id}/comp-awards, POST /governance/directors/{director_id}/seat, GET /governance/skills-matrix/gap-analysis, POST /governance/_clock/set_current_utc"

  # ---- 30 optimistic concurrency ----
  - priority: 30
    category: state
    check: "expected_slate_version equals the current NominationSlate.version (§1.2.1 slate-nominee-add-stale-slate)"
    error_id: ERR_STALE_SLATE_VERSION
    http_status: 412
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 30
    category: state
    check: "expected_committee_version equals the current Committee.version (§1.2.1 committee-assignment-create-stale-committee)"
    error_id: ERR_STALE_COMMITTEE_VERSION
    http_status: 412
    applies_to: "POST /governance/committees/{committee_id}/assignments"

  # ---- 40 state preconditions on the target resource ----
  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2; every other from-state (including terminal states) is rejected"
    error_id: "ERR_CANDIDATE_STATE_INVALID | ERR_SCREEN_STATE_INVALID | ERR_INTERVIEW_STATE_INVALID | ERR_SLATE_STATE_INVALID | ERR_NOMINEE_STATE_INVALID | ERR_ASSIGNMENT_STATE_INVALID | ERR_ONBOARDING_ITEM_STATE_INVALID | ERR_COMP_AWARD_STATE_INVALID | ERR_DIRECTOR_STATE_INVALID | ERR_DIRECTORSHIP_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  # ---- 45 cross-entity state dependencies ----
  - priority: 45
    category: state
    check: "An incumbent renomination requires the referenced Director's service_status to be SEATED or RETIREMENT_NOTICED; a director who has RESIGNED, RETIRED, been NOT_RENOMINATED or is still ONBOARDING cannot be renominated"
    error_id: ERR_DIRECTOR_NOT_SEATABLE
    http_status: 409
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 45
    category: state
    check: "The director's onboarding dimension is COMPLETE before the director may be seated"
    error_id: ERR_ONBOARDING_INCOMPLETE
    http_status: 409
    applies_to: "POST /governance/directors/{director_id}/seat"
  - priority: 45
    category: state
    check: "A committee assignment may only be activated while its committee is not SUSPENDED and its director's service_status is exactly SEATED; an ONBOARDING, RETIREMENT_NOTICED, RETIRED, RESIGNED or NOT_RENOMINATED director may not take a seat"
    error_id: ERR_DIRECTOR_NOT_SEATABLE
    http_status: 409
    applies_to: "POST /governance/assignments/{assignment_id}/activate, POST /governance/slates/{slate_id}/nominees"

  # ---- 50 segregation of duties ----
  - priority: 50
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID may not both interview a candidate and cast the committee ballot on the slate containing that candidate; a director may not be an interviewer for a candidate whose nomination they proposed; a director may not cast a FOR/AGAINST/ABSTAIN ballot on a slate in which they are themselves a nominee (they must ballot RECUSED)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /governance/interviews, POST /governance/slates/{slate_id}/votes"

  # ---- 52 safety / compliance / regulatory ----
  - priority: 52
    category: business_safety
    check: "Tenure guideline: an incumbent director whose completed years of service at the nomination cycle start reach policy.max_tenure_years may not be renominated"
    error_id: ERR_TENURE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 52
    category: business_safety
    check: "Retirement guideline: a nominee (incumbent or candidate) whose age at the nomination cycle start reaches policy.mandatory_retirement_age may not be nominated"
    error_id: ERR_RETIREMENT_AGE_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 52
    category: business_safety
    check: "Interlocking directorate limit: interlock_shared_board_count with any ONBOARDING/SEATED/RETIREMENT_NOTICED director is at or above policy.interlock_max_shared_boards, or a shared public company is flagged is_competitor"
    error_id: ERR_INTERLOCK_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 52
    category: business_safety
    check: "Overboarding policy: external_public_board_count + 1 exceeds the applicable limit (max_public_boards_sitting_ceo when the subject is a sitting CEO elsewhere, otherwise max_public_boards_default)"
    error_id: ERR_OVERBOARDING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees, POST /governance/external-directorships"
  - priority: 52
    category: business_safety
    check: "Committee independence: a committee with requires_all_independent == true accepts only assignments whose director is_independent == true"
    error_id: ERR_COMMITTEE_INDEPENDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /governance/committees/{committee_id}/assignments"

  # ---- 55 referential / uniqueness ----
  - priority: 55
    category: business_referential
    check: "Uniqueness: one SkillCategory per code; one SearchFirm per name; one DirectorSkillRating per (director_id, skill_category_id); one open (DRAFT or SUBMITTED) IndependenceScreen per candidate; one ACTIVE ExternalDirectorship per (subject, external_company_id); one SlateNominee per (slate_id, subject) among non-VOIDED rows; one CommitteeVote per (slate_id, voting_director_id) among CAST rows; one Committee per name; one NominationSlate per cycle_year among non-ABANDONED rows; one DirectorCompensationAward per (director_id, cycle_year) among non-VOIDED rows"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /governance/skill-categories, POST /governance/search-firms, POST /governance/directors/{director_id}/skill-ratings, POST /governance/candidates/{candidate_id}/screens, POST /governance/external-directorships, POST /governance/slates/{slate_id}/nominees, POST /governance/slates/{slate_id}/votes, POST /governance/committees, POST /governance/slates, POST /governance/directors/{director_id}/comp-awards"

  # ---- 62 temporal ----
  - priority: 62
    category: business_temporal
    check: "Interviewer double-booking: the requested [start_at, end_at) window must not overlap any SCHEDULED or COMPLETED InterviewSession of the same interviewer_director_id; the interval is half-open so a session starting exactly when another ends is allowed"
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /governance/interviews"
  - priority: 62
    category: business_temporal
    check: "Assignment term overlap: the requested [term_start_on, term_end_on] window must not overlap any PROPOSED or ACTIVE CommitteeAssignment of the same (committee_id, director_id); the interval is closed on both ends so a term starting exactly on the day a prior term ends overlaps and is rejected"
    error_id: ERR_ASSIGNMENT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /governance/committees/{committee_id}/assignments"
  - priority: 62
    category: business_temporal
    check: "A new NominationSlate cycle_year must be greater than or equal to the ACTIVE policy cycle_year, and a new GovernancePolicy effective_from must be strictly after the currently ACTIVE policy effective_from"
    error_id: ERR_CYCLE_YEAR_NOT_ADVANCED
    http_status: 422
    applies_to: "POST /governance/slates, POST /governance/policies"
  - priority: 62
    category: business_temporal
    check: "The logical clock may only move forward: the requested current_utc must be strictly after the current logical clock instant"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /governance/_clock/set_current_utc"

  # ---- 65 constraint satisfaction ----
  - priority: 65
    category: business_constraint
    check: "A candidate may not exit INTERVIEWING until it has at least policy.min_completed_interviews COMPLETED InterviewSession rows"
    error_id: ERR_INSUFFICIENT_INTERVIEWS
    http_status: 422
    applies_to: "POST /governance/candidates/{candidate_id}/reference-check"
  - priority: 65
    category: business_constraint
    check: "A candidate nominee's readiness_score must be at or above policy.readiness_min_score"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees"
  - priority: 65
    category: business_constraint
    check: "Committee quorum: the number of CAST ballots (including RECUSED) must reach policy.quorum_size before a slate decision is recorded"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/decide"
  - priority: 65
    category: business_constraint
    check: "Committee approval: for decision APPROVE, approval_pct must be at or above policy.approval_threshold_pct over the non-recused ballots"
    error_id: ERR_APPROVAL_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/decide"
  - priority: 65
    category: business_constraint
    check: "Slate independence floor: independent_nominee_pct must be at or above policy.independence_min_pct at submit-for-review, and the slate must carry at least one nominee"
    error_id: ERR_INDEPENDENCE_SHORTFALL
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/submit-for-review"
  - priority: 65
    category: business_constraint
    check: "Universal proxy: once a slate carries any UNIVERSAL_PROXY_NOMINATION nominee the slate is contested and must nominate at least the authorized_seats count minus one, so that the company card lists a full alternative board"
    error_id: ERR_UNIVERSAL_PROXY_MINIMUM
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/submit-for-review"
  - priority: 65
    category: business_constraint
    check: "Committee capacity: activating an assignment may not push filled_seats above Committee.authorized_seats"
    error_id: ERR_COMMITTEE_SEATS_EXHAUSTED
    http_status: 422
    applies_to: "POST /governance/assignments/{assignment_id}/activate"
  - priority: 65
    category: business_constraint
    check: "Board capacity: the count of non-VOIDED nominees on a slate may not exceed policy.authorized_seats, and the count of SEATED directors may not exceed policy.authorized_seats"
    error_id: ERR_SEAT_COUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees, POST /governance/directors/{director_id}/seat"

  # ---- 70 fiscal (last) ----
  - priority: 70
    category: business_fiscal
    check: "Search fee budget: the slate's committed_search_fee_cents after adding this nominee may not exceed NominationSlate.search_fee_budget_cents"
    error_id: ERR_SEARCH_FEE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /governance/slates/{slate_id}/nominees"

endpoints:
  # ---------- Governance policy ----------
  - method: POST
    path: "/governance/policies"
    description: "Adopt a governance policy for a cycle year. Supersedes any currently ACTIVE policy. All threshold fields are optional and fall back to the defaults declared in §1.1, so a minimal call carries only cycle_year and effective_from."
    roles: [CorporateSecretary]
    code: 201
    input: [cycle_year, effective_from, "authorized_seats?", "independence_min_pct?", "independence_standard?", "bright_line_payment_floor_cents?", "bright_line_revenue_pct?", "bright_line_lookback_years?", "enhanced_lookback_years?", "enhanced_charitable_pct?", "max_public_boards_default?", "max_public_boards_sitting_ceo?", "interlock_max_shared_boards?", "mandatory_retirement_age?", "max_tenure_years?", "min_completed_interviews?", "quorum_size?", "approval_threshold_pct?", "annual_cash_retainer_cents?", "committee_member_fee_cents?", "committee_chair_premium_cents?", "equity_grant_value_cents?", "ownership_multiple?", "ownership_grace_years?", "education_hours_required?", "readiness_min_score?"]
    output: GovernancePolicy
    side_effects:
      - "every prior GovernancePolicy with status == ACTIVE becomes SUPERSEDED"
      - "the new row is created with status ACTIVE and becomes the active_policy_selector result"
  - method: GET
    path: "/governance/policies/{policy_id}"
    description: "Read one governance policy including every threshold in force."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: GovernancePolicy
    side_effects: []
  - method: GET
    path: "/governance/policies"
    description: "List governance policies, newest effective_from first, with offset pagination."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["status?", "cycle_year?", "limit?", "offset?"]
    output: GovernancePolicy[]
    side_effects: []

  # ---------- Skills matrix reference data ----------
  - method: POST
    path: "/governance/skill-categories"
    description: "Register a board skill category with its strategic weight, risk-oversight flag and minimum director coverage. Immutable once created."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [code, name, strategic_weight, required_min_directors, "risk_oversight?", "criticality?"]
    output: SkillCategory
    side_effects: []
  - method: GET
    path: "/governance/skill-categories"
    description: "List skill categories ordered by code ascending."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["criticality?", "risk_oversight?", "limit?", "offset?"]
    output: SkillCategory[]
    side_effects: []
  - method: GET
    path: "/governance/skills-matrix/gap-analysis"
    description: "Computed read: run the skills_gap_analysis calculation over every SkillCategory against the current board and return the per-category gap rows plus the board-level rollup. The variant query parameter selects SELF_REPORTED (default) or VALIDATED_ONLY."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["variant?"]
    output:
      variant: string
      seated_director_count: integer
      category_count: integer
      board_gap_index: number
      priority_category_code: string
      categories: array
    side_effects: []
    note: "Each element of categories carries skill_category_id, code, criticality, required_min_directors, covered_director_count, gap, weighted_gap and severity"

  # ---------- Search firms and external companies ----------
  - method: POST
    path: "/governance/search-firms"
    description: "Onboard an executive search firm with its fee model and the two placement-fee tiers."
    roles: [CorporateSecretary]
    code: 201
    input: [name, contact_email, placement_fee_pct, placement_fee_tier2_pct, "fee_model?", "retainer_fee_cents?"]
    output: SearchFirm
    side_effects: []
  - method: GET
    path: "/governance/search-firms/{firm_id}"
    description: "Read one search firm including its live placement-fee ledger. A SearchFirmPartner may only read the firm whose id equals X-User-ID."
    roles: [GovernanceStaff, CorporateSecretary, SearchFirmPartner]
    code: 200
    input: []
    output: SearchFirm
    side_effects: []
  - method: POST
    path: "/governance/external-companies"
    description: "Register an outside company on whose board a director or candidate serves. Immutable once created."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [name, ticker, "is_public?", "is_competitor?", "gross_revenue_cents?"]
    output: ExternalCompany
    side_effects: []

  # ---------- Directors ----------
  - method: POST
    path: "/governance/directors"
    description: "Create a director record. initial_service_status controls the starting value of the system field service_status and accepts ONBOARDING (default) or SEATED, so incumbent boards can be loaded directly as seated without walking the onboarding program."
    roles: [CorporateSecretary]
    code: 201
    input: [full_name, email, birth_date, appointed_on, "is_management?", "is_sitting_ceo_elsewhere?", "is_independent?", "shares_held?", "initial_service_status?"]
    output: Director
    side_effects:
      - "sets service_status from initial_service_status, compliance_status COMPLIANT and onboarding_status NOT_STARTED"
      - "computes age_years and tenure_years from birth_date and appointed_on against the logical clock"
  - method: GET
    path: "/governance/directors/{director_id}"
    description: "Read one director including all three state dimensions and every derived compliance counter."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: Director
    side_effects: []
  - method: GET
    path: "/governance/directors"
    description: "List directors with optional filters, ordered created_at ascending, with offset pagination."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["service_status?", "compliance_status?", "onboarding_status?", "source_candidate_id?", "limit?", "offset?"]
    output: Director[]
    side_effects: []
  - method: POST
    path: "/governance/directors/{director_id}/seat"
    description: "Seat an onboarding director: moves the service dimension ONBOARDING -> SEATED once the onboarding program is COMPLETE and the board has an unfilled authorized seat."
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: Director
    side_effects:
      - "sets service_status = SEATED"
      - "recomputes compliance_status via director_compliance_status"
  - method: POST
    path: "/governance/directors/{director_id}/departure-notice"
    description: "Record a departure notice. notice_type RETIREMENT moves SEATED -> RETIREMENT_NOTICED; notice_type RESIGNATION moves SEATED -> RESIGNED and cascades."
    roles: [CorporateSecretary]
    code: 200
    input: [notice_type, "effective_on?"]
    output: Director
    side_effects:
      - "sets retirement_notice_at = the logical clock instant"
      - "on RESIGNATION: every ACTIVE CommitteeAssignment of this director becomes ENDED with ended_reason_code = RETIREMENT_NOTICE, and each affected Committee recomputes filled_seats and status"
      - "on RESIGNATION: every DirectorCompensationAward of this director in status DRAFT becomes VOIDED"

  # ---------- Skills matrix ratings ----------
  - method: POST
    path: "/governance/directors/{director_id}/skill-ratings"
    description: "Record a director's self-reported rating (1-5) for one skill category. A SeatedDirector may only rate themselves; staff may rate anyone."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 201
    input: [skill_category_id, self_rating]
    output: DirectorSkillRating
    side_effects:
      - "creates the rating with validation_status UNVALIDATED, validated_rating null and effective_rating = self_rating"
  - method: GET
    path: "/governance/skill-ratings/{rating_id}"
    description: "Read one skill rating."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: DirectorSkillRating
    side_effects: []
  - method: GET
    path: "/governance/skill-ratings"
    description: "List skill ratings filtered by director, category or validation status."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["director_id?", "skill_category_id?", "validation_status?", "limit?", "offset?"]
    output: DirectorSkillRating[]
    side_effects: []
  - method: POST
    path: "/governance/skill-ratings/{rating_id}/validate"
    description: "Committee validation of a self-reported rating: records the validated_rating (1-5) and flips validation_status to VALIDATED."
    roles: [CommitteeChair]
    code: 200
    input: [validated_rating]
    output: DirectorSkillRating
    side_effects:
      - "sets validation_status = VALIDATED, validated_at = the logical clock instant and effective_rating = validated_rating"

  # ---------- Candidates ----------
  - method: POST
    path: "/governance/candidates"
    description: "Source a candidate through one of the four channels. SEARCH_FIRM requires search_firm_id; NETWORK_REFERRAL requires referring_director_id; SHAREHOLDER_PROPOSAL and UNIVERSAL_PROXY_NOMINATION require shareholder_proponent_name."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [full_name, email, birth_date, source_channel, "search_firm_id?", "referring_director_id?", "shareholder_proponent_name?", "is_sitting_ceo?", "target_annual_comp_cents?"]
    output: Candidate
    side_effects:
      - "creates the candidate in status SOURCED with independence_result PENDING and readiness_score 0.0"
  - method: GET
    path: "/governance/candidates/{candidate_id}"
    description: "Read one candidate including independence_result, interview rollups, conflict counters and readiness_score."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: GET
    path: "/governance/candidates"
    description: "List candidates with optional filters, ordered created_at ascending, with offset pagination."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["status?", "source_channel?", "search_firm_id?", "referring_director_id?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []
  - method: POST
    path: "/governance/candidates/{candidate_id}/reference-check"
    description: "Close out the interview stage with the reference-check result. adverse_findings false moves the candidate INTERVIEWING -> REFERENCE_CHECK; true moves it INTERVIEWING -> REJECTED."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: [reference_count, "adverse_findings?"]
    output: Candidate
    side_effects:
      - "sets reference_check_count = reference_count and adverse_reference_found = adverse_findings"
      - "recomputes readiness_score via candidate_readiness_score"
      - "on adverse_findings true: sets rejection_reason_code = ADVERSE_REFERENCE and voids this candidate's PROPOSED or CONFIRMED SlateNominee rows"
  - method: POST
    path: "/governance/candidates/{candidate_id}/reopen-interviews"
    description: "Send a candidate back for another interview round: REFERENCE_CHECK -> INTERVIEWING, bounded at three rounds."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Candidate
    side_effects:
      - "increments interview_round by 1 and resets reference_check_count to 0"
  - method: POST
    path: "/governance/candidates/{candidate_id}/conflict-clearance"
    description: "Run the interlock, overboarding and retirement-age evaluation. Clean result moves REFERENCE_CHECK -> SLATE_ELIGIBLE; any failure moves it to REJECTED with rejection_reason_code set from the first failing test. Both branches return 200."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Candidate
    side_effects:
      - "recomputes interlock_shared_board_count and external_public_board_count via interlock_and_overboarding_evaluation"
      - "recomputes readiness_score"
  - method: POST
    path: "/governance/candidates/{candidate_id}/reopen-screening"
    description: "Bring a deferred candidate back into the pipeline in a later cycle: DEFERRED -> SCREENING, creating a fresh DRAFT IndependenceScreen."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: []
    output: Candidate
    side_effects:
      - "creates a new IndependenceScreen in status DRAFT for this candidate"
      - "resets independence_result to PENDING and interview_round to 0"
  - method: POST
    path: "/governance/candidates/{candidate_id}/withdraw"
    description: "Candidate withdraws from consideration from any pre-nomination status."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: []
    output: Candidate
    side_effects:
      - "every IndependenceScreen of this candidate in status DRAFT or SUBMITTED becomes VOIDED"
      - "every InterviewSession of this candidate in status SCHEDULED becomes CANCELLED"

  # ---------- Independence screening ----------
  - method: POST
    path: "/governance/candidates/{candidate_id}/screens"
    description: "Open an independence screen for a candidate. From SOURCED it advances the candidate to SCREENING; from NOMINATED it is a supplemental re-screen that leaves the candidate status unchanged."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: ["payments_to_company_cents?", "recipient_gross_revenue_cents?", "prior_employment_end_on?", "family_member_employed?", "auditor_affiliation?", "charitable_contributions_cents?", "company_gross_revenue_cents?"]
    output: IndependenceScreen
    side_effects:
      - "creates the screen in status DRAFT with candidate_id taken from the path and determination PENDING"
      - "when the candidate was SOURCED, sets Candidate.status = SCREENING"
  - method: GET
    path: "/governance/candidates/{candidate_id}/screens"
    description: "List every independence screen of one candidate, newest created_at first."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["status?"]
    output: IndependenceScreen[]
    side_effects: []
  - method: GET
    path: "/governance/screens/{screen_id}"
    description: "Read one independence screen including both fail counts, the applied standard and the disqualifying factor."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: IndependenceScreen
    side_effects: []
  - method: GET
    path: "/governance/screens"
    description: "List independence screens filtered by candidate, status or applied standard, newest created_at first."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["candidate_id?", "status?", "standard_applied?", "limit?", "offset?"]
    output: IndependenceScreen[]
    side_effects: []
  - method: POST
    path: "/governance/screens/{screen_id}/submit"
    description: "Submit a screen for determination. Freezes standard_applied to the ACTIVE policy's independence_standard and computes both fail counts under the independence_determination calculation."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: []
    output: IndependenceScreen
    side_effects:
      - "sets standard_applied, bright_line_fail_count, qualitative_fail_count and disqualifying_factor_code"
      - "sets submitted_at = the logical clock instant"
  - method: POST
    path: "/governance/screens/{screen_id}/determine"
    description: "Committee determination. The fork is decided by the screen data, not the actor: fail count 0 under standard_applied yields DETERMINED_INDEPENDENT, otherwise DETERMINED_NOT_INDEPENDENT with the full depth-5 cascade."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: IndependenceScreen
    side_effects:
      - "sets determination and determined_at"
      - "cascades to Candidate, SlateNominee, NominationSlate, SearchFirm and CommitteeVote per §1.2"

  # ---------- External directorships (overboarding and interlock source data) ----------
  - method: POST
    path: "/governance/external-directorships"
    description: "Record an outside board seat for exactly one subject - either a sitting director or a candidate. For a director subject the overboarding limit is enforced immediately."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [external_company_id, start_on, "director_id?", "candidate_id?", "seat_role?", "is_audit_chair?"]
    output: ExternalDirectorship
    side_effects:
      - "creates the row in status ACTIVE"
      - "recomputes the subject's external_public_board_count"
      - "for a director subject, recomputes compliance_status via director_compliance_status and may move it to OVERBOARDED"
      - "when the subject director becomes OVERBOARDED, every Committee with an ACTIVE assignment for that director recomputes its posture to SUSPENDED"
  - method: GET
    path: "/governance/external-directorships/{directorship_id}"
    description: "Read one external directorship."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: ExternalDirectorship
    side_effects: []
  - method: GET
    path: "/governance/external-directorships"
    description: "List external directorships filtered by subject, company or status."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["director_id?", "candidate_id?", "external_company_id?", "status?", "limit?", "offset?"]
    output: ExternalDirectorship[]
    side_effects: []
  - method: POST
    path: "/governance/external-directorships/{directorship_id}/end"
    description: "End an outside board seat, releasing the overboarding pressure it created."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: [end_on]
    output: ExternalDirectorship
    side_effects:
      - "sets status = ENDED and end_on = the request value"
      - "recomputes the subject's external_public_board_count"
      - "for a director subject, recomputes compliance_status and may return it to COMPLIANT"
      - "each Committee that was SUSPENDED solely because of this director recomputes its posture"

  # ---------- Interviews ----------
  - method: POST
    path: "/governance/interviews"
    description: "Schedule an interview between a candidate and a sitting director. The interviewer's calendar is checked as a half-open [start_at, end_at) interval, so back-to-back sessions are allowed."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [candidate_id, interviewer_director_id, start_at, end_at, "modality?"]
    output: InterviewSession
    side_effects:
      - "creates the session in status SCHEDULED with interview_round = Candidate.interview_round + 1 when the candidate was SCREEN_PASSED, else the candidate's current interview_round"
      - "moves the candidate SCREEN_PASSED -> INTERVIEWING on the first session of a round"
  - method: GET
    path: "/governance/interviews/{interview_id}"
    description: "Read one interview session."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: InterviewSession
    side_effects: []
  - method: GET
    path: "/governance/interviews"
    description: "List interview sessions filtered by candidate, interviewer or status, ordered start_at ascending."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["candidate_id?", "interviewer_director_id?", "status?", "limit?", "offset?"]
    output: InterviewSession[]
    side_effects: []
  - method: POST
    path: "/governance/interviews/{interview_id}/complete"
    description: "Record the interview outcome with an integer score 1-5 and a recommendation."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 200
    input: [score, recommendation]
    output: InterviewSession
    side_effects:
      - "sets status = COMPLETED and completed_at = the logical clock instant"
      - "recomputes Candidate.completed_interview_count and interview_score_avg over the candidate's COMPLETED sessions"
      - "recomputes Candidate.readiness_score via candidate_readiness_score"
  - method: POST
    path: "/governance/interviews/{interview_id}/cancel"
    description: "Close a scheduled interview without a score. resolution CANCELLED records a withdrawal of the slot; resolution NO_SHOW records a missed appearance."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: [resolution]
    output: InterviewSession
    side_effects:
      - "sets status to the resolution value, releasing the interviewer's calendar window"

  # ---------- Committees and assignments ----------
  - method: POST
    path: "/governance/committees"
    description: "Charter a board committee with its authorized seat count, minimum strength and independence requirement."
    roles: [CorporateSecretary]
    code: 201
    input: [code, name, authorized_seats, "min_seats?", "requires_all_independent?", "requires_financial_expert?"]
    output: Committee
    side_effects:
      - "creates the committee with filled_seats 0, status UNDER_STRENGTH and version 1"
  - method: GET
    path: "/governance/committees/{committee_id}"
    description: "Read one committee including filled_seats, derived posture and the version an assignment writer must echo."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: Committee
    side_effects: []
  - method: GET
    path: "/governance/committees"
    description: "List committees ordered by code ascending."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Committee[]
    side_effects: []
  - method: POST
    path: "/governance/committees/{committee_id}/assignments"
    description: "Propose a committee assignment. Requires expected_committee_version to match the committee's current version (§1.2.1 committee-assignment-create-stale-committee). Terms are closed intervals [term_start_on, term_end_on] per (committee, director)."
    roles: [CorporateSecretary]
    code: 201
    input: [director_id, term_start_on, term_end_on, expected_committee_version, "seat_role?"]
    output: CommitteeAssignment
    side_effects:
      - "creates the assignment in status PROPOSED with committee_id from the path"
      - "increments Committee.version by 1"
  - method: GET
    path: "/governance/assignments/{assignment_id}"
    description: "Read one committee assignment."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: CommitteeAssignment
    side_effects: []
  - method: GET
    path: "/governance/assignments"
    description: "List committee assignments filtered by committee, director or status."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["committee_id?", "director_id?", "status?", "limit?", "offset?"]
    output: CommitteeAssignment[]
    side_effects: []
  - method: POST
    path: "/governance/assignments/{assignment_id}/activate"
    description: "Seat the assignment: PROPOSED -> ACTIVE. Occupies one committee seat and re-derives the committee posture."
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: CommitteeAssignment
    side_effects:
      - "sets status = ACTIVE and activated_at = the logical clock instant"
      - "recomputes Committee.filled_seats and Committee.status via committee_seat_ledger"
      - "increments Committee.version by 1"
  - method: POST
    path: "/governance/assignments/{assignment_id}/revoke"
    description: "Revoke an active assignment: ACTIVE -> REVOKED. Compensating operation for activate - releases the seat and re-derives the posture from the remaining ACTIVE rows."
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: CommitteeAssignment
    side_effects:
      - "sets status = REVOKED, ended_reason_code = REVOCATION and ended_at = the logical clock instant"
      - "recomputes Committee.filled_seats and Committee.status via committee_seat_ledger"
      - "increments Committee.version by 1"

  # ---------- Nomination slate ----------
  - method: POST
    path: "/governance/slates"
    description: "Open a nomination slate for a cycle year with the committee's search-fee budget."
    roles: [CorporateSecretary]
    code: 201
    input: [cycle_year, seat_count, "search_fee_budget_cents?"]
    output: NominationSlate
    side_effects:
      - "creates the slate in status DRAFT with every rollup at zero and version 1"
  - method: GET
    path: "/governance/slates/{slate_id}"
    description: "Read one slate including nominee rollups, independence percentage, fee commitment, ballot tallies and the version a nominee writer must echo."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: NominationSlate
    side_effects: []
  - method: GET
    path: "/governance/slates"
    description: "List nomination slates ordered cycle_year descending."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["status?", "cycle_year?", "limit?", "offset?"]
    output: NominationSlate[]
    side_effects: []
  - method: POST
    path: "/governance/slates/{slate_id}/nominees"
    description: "Add a nominee to a slate - either a cleared candidate or an incumbent director for renomination. Requires expected_slate_version to match the slate's current version (§1.2.1 slate-nominee-add-stale-slate)."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [ballot_order, expected_slate_version, "candidate_id?", "incumbent_director_id?"]
    output: SlateNominee
    side_effects:
      - "creates the nominee in status PROPOSED with slate_id from the path and is_independent copied from the subject"
      - "for a SEARCH_FIRM candidate, assigns nominee_ordinal and fee_tier_applied and computes placement_fee_cents via search_firm_placement_fee, then recomputes the firm ledger and the slate's committed_search_fee_cents"
      - "recomputes the slate's nominee_count, independent_nominee_count, independent_nominee_pct, independence_shortfall, contested and universal_proxy_applicable"
      - "moves a candidate subject SLATE_ELIGIBLE -> NOMINATED"
      - "increments NominationSlate.version by 1"
  - method: GET
    path: "/governance/slate-nominees/{nominee_id}"
    description: "Read one slate nominee including its fee tier, ordinal and committed placement fee."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: SlateNominee
    side_effects: []
  - method: GET
    path: "/governance/slate-nominees"
    description: "List slate nominees filtered by slate or subject, ordered ballot_order ascending."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["slate_id?", "candidate_id?", "incumbent_director_id?", "status?", "limit?", "offset?"]
    output: SlateNominee[]
    side_effects: []
  - method: POST
    path: "/governance/slate-nominees/{nominee_id}/void"
    description: "Withdraw a nominee from the slate. Compensating operation for the nominee add - releases the exact placement fee it committed and returns a slate under review to DRAFT."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: []
    output: SlateNominee
    side_effects:
      - "sets status = VOIDED and voided_at = the logical clock instant"
      - "recomputes the sourcing SearchFirm's placed_nominee_count, committed_fee_cents, retainer_credit_applied_cents and net_payable_cents, re-deriving every surviving nominee's nominee_ordinal, fee_tier_applied and placement_fee_cents"
      - "recomputes the slate's nominee_count, independent_nominee_count, independent_nominee_pct, independence_shortfall, committed_search_fee_cents, contested and universal_proxy_applicable"
      - "moves a candidate subject NOMINATED -> DEFERRED with deferred_cycle_year = the slate's cycle_year"
      - "a slate in COMMITTEE_REVIEW returns to DRAFT with revision_count incremented, and its CAST ballots become VOIDED_BY_REVISION"
      - "increments NominationSlate.version by 1"
  - method: POST
    path: "/governance/slates/{slate_id}/submit-for-review"
    description: "Submit the slate to the nominating committee: DRAFT -> COMMITTEE_REVIEW. Enforces the independence floor and, for a contested slate, the universal-proxy minimum nominee count."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 200
    input: []
    output: NominationSlate
    side_effects:
      - "sets status = COMMITTEE_REVIEW"
      - "recomputes independent_nominee_pct, independence_shortfall, contested and universal_proxy_applicable"
      - "increments NominationSlate.version by 1"
  - method: POST
    path: "/governance/slates/{slate_id}/votes"
    description: "Cast one committee ballot on a slate under review. A director who is themselves a nominee on the slate must ballot RECUSED."
    roles: [CommitteeChair, CommitteeMember]
    code: 201
    input: [voting_director_id, ballot, "rationale?"]
    output: CommitteeVote
    side_effects:
      - "creates the ballot in status CAST with slate_id from the path, cast_at set and recusal_required derived from whether the voter is a nominee on this slate"
      - "recomputes the slate's votes_for, votes_against, votes_abstain, votes_recused, quorum_met and approval_pct via committee_vote_tally"
  - method: GET
    path: "/governance/votes/{vote_id}"
    description: "Read one committee ballot."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: CommitteeVote
    side_effects: []
  - method: GET
    path: "/governance/votes"
    description: "List committee ballots filtered by slate or voting director."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember]
    code: 200
    input: ["slate_id?", "voting_director_id?", "status?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []
  - method: POST
    path: "/governance/slates/{slate_id}/decide"
    description: "Record the committee's decision. APPROVE moves COMMITTEE_REVIEW -> APPROVED and confirms every PROPOSED nominee; REJECT returns the slate to DRAFT and voids the ballots; ABANDON terminates a DRAFT slate."
    roles: [CommitteeChair]
    code: 200
    input: [decision, "rationale?"]
    output: NominationSlate
    side_effects:
      - "on APPROVE: every PROPOSED SlateNominee becomes CONFIRMED"
      - "on REJECT: status returns to DRAFT, revision_count increments, every CAST ballot becomes VOIDED_BY_REVISION and the tallies reset to zero"
      - "on ABANDON: status becomes ABANDONED and every CAST ballot becomes VOIDED_BY_REVISION"
      - "increments NominationSlate.version by 1"
  - method: POST
    path: "/governance/slates/{slate_id}/file"
    description: "File the approved slate in the proxy statement: APPROVED -> FILED."
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: NominationSlate
    side_effects:
      - "sets status = FILED and filed_at = the logical clock instant"
      - "increments NominationSlate.version by 1"
  - method: POST
    path: "/governance/slates/{slate_id}/record-election"
    description: "Record the shareholder-meeting result: FILED -> ELECTION_RECORDED. Nominee ids present in elected_nominee_ids are ELECTED, the rest are NOT_ELECTED."
    roles: [CorporateSecretary]
    code: 200
    input: [elected_nominee_ids]
    output: NominationSlate
    side_effects:
      - "each CONFIRMED nominee becomes ELECTED or NOT_ELECTED, and its candidate subject follows to ELECTED or NOT_ELECTED"
      - "for each newly ELECTED nominee with incumbent_director_id null, creates a Director in service_status ONBOARDING with source_candidate_id set"
      - "each RETIREMENT_NOTICED incumbent not elected becomes RETIRED; each SEATED incumbent left off the slate becomes NOT_RENOMINATED"
      - "every ACTIVE CommitteeAssignment of a departing director becomes ENDED with ended_reason_code = RETIREMENT_NOTICE and each affected committee re-derives its posture"
      - "sets election_recorded_at = the logical clock instant and increments NominationSlate.version by 1"

  # ---------- Onboarding and continuing education ----------
  - method: POST
    path: "/governance/directors/{director_id}/onboarding-items"
    description: "Add an orientation, documentation-access or continuing-education item to a director's program. Adding a required item to a COMPLETE program regresses it to IN_PROGRESS."
    roles: [GovernanceStaff, CorporateSecretary]
    code: 201
    input: [module_code, category, "is_required?", "credit_hours?", "due_on?"]
    output: OnboardingItem
    side_effects:
      - "creates the item in status PENDING with director_id from the path"
      - "recomputes Director.onboarding_status and onboarding_completion_pct via director_onboarding_rollup"
  - method: GET
    path: "/governance/directors/{director_id}/onboarding-items"
    description: "List one director's onboarding and continuing-education items."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["status?", "category?"]
    output: OnboardingItem[]
    side_effects: []
  - method: GET
    path: "/governance/onboarding-items/{item_id}"
    description: "Read one onboarding item."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: []
    output: OnboardingItem
    side_effects: []
  - method: GET
    path: "/governance/onboarding-items"
    description: "List onboarding and continuing-education items filtered by director, status or category, newest created_at first."
    roles: [GovernanceStaff, CorporateSecretary, CommitteeChair, CommitteeMember, SeatedDirector]
    code: 200
    input: ["director_id?", "status?", "category?", "limit?", "offset?"]
    output: OnboardingItem[]
    side_effects: []
  - method: POST
    path: "/governance/onboarding-items/{item_id}/complete"
    description: "Mark an onboarding or continuing-education item complete. A SeatedDirector may only complete their own items."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 200
    input: []
    output: OnboardingItem
    side_effects:
      - "sets status = COMPLETED and completed_at = the logical clock instant"
      - "recomputes Director.onboarding_status and onboarding_completion_pct"
      - "for a CONTINUING_EDUCATION item, recomputes Director.education_hours_cycle and compliance_status, which can clear EDUCATION_DELINQUENT"
  - method: POST
    path: "/governance/onboarding-items/{item_id}/waive"
    description: "Waive an onboarding item with a recorded reason; a waived required item counts as satisfied for the rollup but contributes no education credit hours."
    roles: [CorporateSecretary]
    code: 200
    input: [waiver_reason]
    output: OnboardingItem
    side_effects:
      - "sets status = WAIVED and waiver_reason = the request value"
      - "recomputes Director.onboarding_status and onboarding_completion_pct"

  # ---------- Director compensation ----------
  - method: POST
    path: "/governance/directors/{director_id}/comp-awards"
    description: "Build a director's annual compensation award for a cycle. Computes the prorated retainer, committee fees, equity value, the excess-compensation offset keyed on the pre-offset total, and the stock-ownership guideline test."
    roles: [CorporateSecretary]
    code: 201
    input: [cycle_year, service_start_on, service_end_on, share_price_cents, shares_held]
    output: DirectorCompensationAward
    side_effects:
      - "creates the award in status DRAFT with every money field computed via director_compensation_award"
      - "snapshots committee_member_seat_count and committee_chair_seat_count from the director's ACTIVE assignments"
  - method: GET
    path: "/governance/directors/{director_id}/comp-awards"
    description: "List one director's compensation awards, newest cycle_year first."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 200
    input: ["status?", "cycle_year?"]
    output: DirectorCompensationAward[]
    side_effects: []
  - method: GET
    path: "/governance/comp-awards/{award_id}"
    description: "Read one compensation award including the ownership guideline requirement and actual holdings."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 200
    input: []
    output: DirectorCompensationAward
    side_effects: []
  - method: GET
    path: "/governance/comp-awards"
    description: "List compensation awards filtered by director, cycle year or status, newest cycle_year first. A SeatedDirector may only list their own awards."
    roles: [GovernanceStaff, CorporateSecretary, SeatedDirector]
    code: 200
    input: ["director_id?", "cycle_year?", "status?", "limit?", "offset?"]
    output: DirectorCompensationAward[]
    side_effects: []
  - method: POST
    path: "/governance/comp-awards/{award_id}/finalize"
    description: "Finalize a compensation award: DRAFT -> FINALIZED. The finalized award becomes the governing award for the ownership leg of the director's compliance status."
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: DirectorCompensationAward
    side_effects:
      - "sets status = FINALIZED and finalized_at = the logical clock instant"
      - "recomputes Director.compliance_status via director_compliance_status, which can move it to OWNERSHIP_SHORTFALL once the ownership grace period has elapsed"

  # ---------- Logical clock (test-driving endpoint) ----------
  - method: POST
    path: "/governance/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The clock may only move forward."
    roles: [CorporateSecretary]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      recomputed_director_count: integer
    side_effects:
      - "sets the logical clock instant used by every timestamp, age, tenure and deadline computation"
      - "recomputes age_years and tenure_years for every director"
      - "recomputes compliance_status for every director whose service_status is not RETIRED, RESIGNED or NOT_RENOMINATED, which is how EDUCATION_DELINQUENT becomes reachable once the cycle deadline passes"

errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not listed for the target endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own - X-User-ID does not match the resource's owning Director.id or SearchFirm.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting director both interviewed a candidate and attempts to ballot on the slate carrying that candidate, or attempts a non-RECUSED ballot on a slate in which they are a nominee"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing or has the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "An enum-typed input carries a value outside the declared enum"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric input falls outside its declared range - rating outside 1..5, weight outside 0.0..1.0, percentage outside 0.0..100.0, or a negative count or cent amount"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "An interval input is inverted - interview end_at not after start_at, term_end_on before term_start_on, service_end_on before service_start_on, or end_on before start_on"
  - id: ERR_DIRECTORSHIP_SUBJECT_INVALID
    http: 422
    condition: "An external directorship supplies both director_id and candidate_id, or neither"
  - id: ERR_SOURCE_CHANNEL_MISMATCH
    http: 422
    condition: "A candidate's source_channel does not match the supplied source ids, or a slate nominee supplies both candidate_id and incumbent_director_id or neither"

  # ---- existence ----
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id does not resolve to a GovernancePolicy"
  - id: ERR_SKILL_CATEGORY_NOT_FOUND
    http: 404
    condition: "skill_category_id does not resolve to a SkillCategory"
  - id: ERR_SEARCH_FIRM_NOT_FOUND
    http: 404
    condition: "firm_id or search_firm_id does not resolve to a SearchFirm"
  - id: ERR_EXTERNAL_COMPANY_NOT_FOUND
    http: 404
    condition: "external_company_id does not resolve to an ExternalCompany"
  - id: ERR_DIRECTOR_NOT_FOUND
    http: 404
    condition: "director_id, referring_director_id, interviewer_director_id, voting_director_id or incumbent_director_id does not resolve to a Director"
  - id: ERR_SKILL_RATING_NOT_FOUND
    http: 404
    condition: "rating_id does not resolve to a DirectorSkillRating"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "candidate_id does not resolve to a Candidate"
  - id: ERR_SCREEN_NOT_FOUND
    http: 404
    condition: "screen_id does not resolve to an IndependenceScreen"
  - id: ERR_DIRECTORSHIP_NOT_FOUND
    http: 404
    condition: "directorship_id does not resolve to an ExternalDirectorship"
  - id: ERR_INTERVIEW_NOT_FOUND
    http: 404
    condition: "interview_id does not resolve to an InterviewSession"
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "committee_id does not resolve to a Committee"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve to a CommitteeAssignment"
  - id: ERR_SLATE_NOT_FOUND
    http: 404
    condition: "slate_id does not resolve to a NominationSlate"
  - id: ERR_NOMINEE_NOT_FOUND
    http: 404
    condition: "nominee_id, or a member of elected_nominee_ids, does not resolve to a SlateNominee"
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "vote_id does not resolve to a CommitteeVote"
  - id: ERR_ONBOARDING_ITEM_NOT_FOUND
    http: 404
    condition: "item_id does not resolve to an OnboardingItem"
  - id: ERR_COMP_AWARD_NOT_FOUND
    http: 404
    condition: "award_id does not resolve to a DirectorCompensationAward"
  - id: ERR_NO_ACTIVE_POLICY
    http: 409
    condition: "An operation needs a governance threshold but no GovernancePolicy has status ACTIVE"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_SLATE_VERSION
    http: 412
    condition: "expected_slate_version does not equal the NominationSlate's current version"
  - id: ERR_STALE_COMMITTEE_VERSION
    http: 412
    condition: "expected_committee_version does not equal the Committee's current version"

  # ---- state preconditions ----
  - id: ERR_CANDIDATE_STATE_INVALID
    http: 409
    condition: "The candidate's status does not permit the requested transition, including any attempt from the terminal states ELECTED, NOT_ELECTED, REJECTED or WITHDRAWN"
  - id: ERR_SCREEN_STATE_INVALID
    http: 409
    condition: "The independence screen's status does not permit submit or determine, including a second submit or a second determine"
  - id: ERR_INTERVIEW_STATE_INVALID
    http: 409
    condition: "The interview session is no longer SCHEDULED, so it cannot be completed or cancelled"
  - id: ERR_SLATE_STATE_INVALID
    http: 409
    condition: "The slate's status does not permit submit-for-review, decide, file or record-election"
  - id: ERR_NOMINEE_STATE_INVALID
    http: 409
    condition: "The nominee row is already VOIDED, ELECTED or NOT_ELECTED and cannot be voided again"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "The committee assignment is not PROPOSED for activate, or not ACTIVE for revoke"
  - id: ERR_ONBOARDING_ITEM_STATE_INVALID
    http: 409
    condition: "The onboarding item is already COMPLETED or WAIVED"
  - id: ERR_COMP_AWARD_STATE_INVALID
    http: 409
    condition: "The compensation award is not DRAFT, so it cannot be finalized"
  - id: ERR_DIRECTOR_STATE_INVALID
    http: 409
    condition: "The director's service dimension does not permit the requested transition - seating a non-ONBOARDING director, or noticing departure for a director who is not SEATED"
  - id: ERR_DIRECTORSHIP_STATE_INVALID
    http: 409
    condition: "The external directorship is already ENDED"

  # ---- cross-entity state ----
  - id: ERR_ONBOARDING_INCOMPLETE
    http: 409
    condition: "A director is seated while their onboarding dimension is NOT_STARTED or IN_PROGRESS"
  - id: ERR_DIRECTOR_NOT_SEATABLE
    http: 409
    condition: "An assignment is activated for a director whose service_status is not SEATED or while the committee is SUSPENDED, or an incumbent renomination names a director who is not SEATED or RETIREMENT_NOTICED"

  # ---- safety, compliance and regulatory ----
  - id: ERR_TENURE_LIMIT_EXCEEDED
    http: 422
    condition: "An incumbent's completed board tenure reaches the policy max_tenure_years at the nomination cycle start"
  - id: ERR_RETIREMENT_AGE_EXCEEDED
    http: 422
    condition: "A nominee's age reaches the policy mandatory_retirement_age at the nomination cycle start"
  - id: ERR_INTERLOCK_LIMIT_EXCEEDED
    http: 422
    condition: "The nominee shares at least interlock_max_shared_boards public boards with a serving director, or shares a board flagged is_competitor"
  - id: ERR_OVERBOARDING_LIMIT_EXCEEDED
    http: 422
    condition: "Adding this board would take the subject's public directorship count past the applicable overboarding limit"
  - id: ERR_COMMITTEE_INDEPENDENCE_REQUIRED
    http: 422
    condition: "An assignment is created on a committee with requires_all_independent true for a director whose is_independent is false"

  # ---- referential integrity ----
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness rule from §1.4 priority 55 is violated - duplicate skill-category code, firm name, director-category rating, open screen, active external directorship, slate nominee, committee ballot, committee name, slate cycle_year or director-cycle compensation award"

  # ---- temporal ----
  - id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http: 409
    condition: "The requested interview window overlaps an existing SCHEDULED or COMPLETED session of the same interviewer under half-open [start_at, end_at) semantics"
  - id: ERR_ASSIGNMENT_TERM_OVERLAP
    http: 409
    condition: "The requested term overlaps a PROPOSED or ACTIVE assignment of the same director on the same committee under closed [term_start_on, term_end_on] semantics"
  - id: ERR_CYCLE_YEAR_NOT_ADVANCED
    http: 422
    condition: "A slate's cycle_year is below the ACTIVE policy cycle_year, or a new policy's effective_from is not strictly after the ACTIVE policy's effective_from"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The requested current_utc is not strictly after the current logical clock instant"

  # ---- constraint satisfaction ----
  - id: ERR_INSUFFICIENT_INTERVIEWS
    http: 422
    condition: "A reference check is recorded before the candidate has policy.min_completed_interviews COMPLETED sessions"
  - id: ERR_READINESS_BELOW_THRESHOLD
    http: 422
    condition: "A candidate nominee's readiness_score is below policy.readiness_min_score"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "A slate decision is recorded with fewer CAST ballots than policy.quorum_size"
  - id: ERR_APPROVAL_THRESHOLD_NOT_MET
    http: 422
    condition: "An APPROVE decision is recorded while approval_pct over the non-recused ballots is below policy.approval_threshold_pct"
  - id: ERR_INDEPENDENCE_SHORTFALL
    http: 422
    condition: "A slate is submitted for review with independent_nominee_pct below policy.independence_min_pct, or with no nominees at all"
  - id: ERR_UNIVERSAL_PROXY_MINIMUM
    http: 422
    condition: "A contested slate is submitted for review with fewer than policy.authorized_seats minus one nominees"
  - id: ERR_COMMITTEE_SEATS_EXHAUSTED
    http: 422
    condition: "Activating an assignment would push filled_seats past the committee's authorized_seats"
  - id: ERR_SEAT_COUNT_EXCEEDED
    http: 422
    condition: "A slate's non-voided nominee count would exceed policy.authorized_seats, or seating this director would exceed the authorized board size"

  # ---- fiscal ----
  - id: ERR_SEARCH_FEE_BUDGET_EXCEEDED
    http: 422
    condition: "Adding this nominee would take the slate's committed_search_fee_cents past search_fee_budget_cents"

roles:
  - name: GovernanceStaff
    description: "Corporate-governance staff who run day-to-day sourcing, screening intake, interview logistics and slate assembly"
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/candidates/{candidate_id}/reopen-screening"
      - "POST /governance/candidates/{candidate_id}/withdraw"
    shared_operations:
      - "POST /governance/skill-categories"
      - "POST /governance/external-companies"
      - "POST /governance/candidates"
      - "POST /governance/candidates/{candidate_id}/screens"
      - "POST /governance/screens/{screen_id}/submit"
      - "POST /governance/candidates/{candidate_id}/reference-check"
      - "POST /governance/directors/{director_id}/skill-ratings"
      - "POST /governance/external-directorships"
      - "POST /governance/external-directorships/{directorship_id}/end"
      - "POST /governance/interviews"
      - "POST /governance/interviews/{interview_id}/complete"
      - "POST /governance/interviews/{interview_id}/cancel"
      - "POST /governance/slates/{slate_id}/nominees"
      - "POST /governance/slate-nominees/{nominee_id}/void"
      - "POST /governance/slates/{slate_id}/submit-for-review"
      - "POST /governance/directors/{director_id}/onboarding-items"
      - "POST /governance/onboarding-items/{item_id}/complete"
      - "every GET read endpoint whose roles list names GovernanceStaff"
  - name: CorporateSecretary
    description: "The corporate secretary: owns the official record - policy adoption, director records, committee charters and assignments, slate filing, election results, compensation awards, waivers and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/policies"
      - "POST /governance/search-firms"
      - "POST /governance/directors"
      - "POST /governance/directors/{director_id}/seat"
      - "POST /governance/directors/{director_id}/departure-notice"
      - "POST /governance/committees"
      - "POST /governance/committees/{committee_id}/assignments"
      - "POST /governance/assignments/{assignment_id}/activate"
      - "POST /governance/assignments/{assignment_id}/revoke"
      - "POST /governance/slates"
      - "POST /governance/slates/{slate_id}/file"
      - "POST /governance/slates/{slate_id}/record-election"
      - "POST /governance/onboarding-items/{item_id}/waive"
      - "POST /governance/directors/{director_id}/comp-awards"
      - "POST /governance/comp-awards/{award_id}/finalize"
      - "POST /governance/_clock/set_current_utc"
    shared_operations:
      - "every operation GovernanceStaff can perform"
  - name: CommitteeChair
    description: "Chair of the nominating and governance committee: makes the independence determination, the conflict-of-interest determination, rating validations, interview-round reopenings and the slate decision"
    identity: "entity_backed:Director"
    exclusive_operations:
      - "POST /governance/screens/{screen_id}/determine"
      - "POST /governance/candidates/{candidate_id}/conflict-clearance"
      - "POST /governance/candidates/{candidate_id}/reopen-interviews"
      - "POST /governance/skill-ratings/{rating_id}/validate"
      - "POST /governance/slates/{slate_id}/decide"
    shared_operations:
      - "POST /governance/slates/{slate_id}/votes"
      - "the committee-facing GET reads over policies, directors, candidates, screens, interviews, committees, assignments, slates, nominees and votes"
  - name: CommitteeMember
    description: "Non-chair member of the nominating and governance committee: reviews the file and casts a ballot on the slate"
    identity: "entity_backed:Director"
    exclusive_operations: []
    shared_operations:
      - "POST /governance/slates/{slate_id}/votes"
      - "the committee-facing GET reads over policies, directors, candidates, screens, interviews, committees, assignments, slates, nominees and votes"
  - name: SeatedDirector
    description: "Any director on the board acting for themselves: records their own skills self-assessment, completes their own onboarding and continuing-education items, scores interviews they conducted and reads their own compensation awards"
    identity: "entity_backed:Director"
    exclusive_operations: []
    shared_operations:
      - "POST /governance/directors/{director_id}/skill-ratings"
      - "POST /governance/interviews/{interview_id}/complete"
      - "POST /governance/onboarding-items/{item_id}/complete"
      - "GET /governance/directors/{director_id}"
      - "GET /governance/directors/{director_id}/onboarding-items"
      - "GET /governance/onboarding-items"
      - "GET /governance/onboarding-items/{item_id}"
      - "GET /governance/directors/{director_id}/comp-awards"
      - "GET /governance/comp-awards"
      - "GET /governance/comp-awards/{award_id}"
  - name: SearchFirmPartner
    description: "Partner at a retained executive-search firm: reads only their own firm record and its live placement-fee ledger"
    identity: "entity_backed:SearchFirm"
    exclusive_operations: []
    shared_operations:
      - "GET /governance/search-firms/{firm_id}"
