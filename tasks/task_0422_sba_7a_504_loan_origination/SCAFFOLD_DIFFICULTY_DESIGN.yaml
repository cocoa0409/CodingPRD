              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/applications/${app_id}/authorize"
              payload: {}
              as: SbaOfficer
            - call: "POST /sba/disbursements"
              payload: { application_id: "${app_id}", amount_cents: 10000000, tranche_label: "Draw 1", draw_window_start_day: 0, draw_window_end_day: 30 }
              as: LoanOfficer
