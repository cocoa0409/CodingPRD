            - "The first unit-101 household create returns HTTP 409 with error_id ERR_DUPLICATE_UNIT_NUMBER"
            - "The second renewal-case create returns HTTP 409 with error_id ERR_OPEN_RENEWAL_CASE_EXISTS and HapContract.${contract_id}.lifecycle_status is still RENEWAL_PENDING"
            - "${t1_status} == MOVED_OUT and the re-created household returns HTTP 201 with ${t_reuse_unit} == 101 — uniqueness excludes MOVED_OUT rows"
            - "Property.${property_id}.units_under_hap_count == 1 and released_unit_count == 1 after the move-out and the re-let (assisted_unit_count 20 conserved)"

      - name: temporal_gates_reject_an_early_case_a_short_notice_and_an_unelapsed_period
        claim_type: Temporal validation
        grounds:
