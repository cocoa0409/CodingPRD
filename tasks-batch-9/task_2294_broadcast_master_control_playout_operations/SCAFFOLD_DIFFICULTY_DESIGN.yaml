          subject and unit, distinct from Playlist seconds and Asset points):
          with three unchanged channel requests the FULL_POOL variant
          (derate_factor 1.00, effective_capacity_kbps 19500) grants
          4236 / 6353 / 8911 kbps, while the DERATED_POOL variant
          (derate_factor 0.75, effective_capacity_kbps 14500) grants
