  - rule_id: compensating_invariant
    instances:
      - name: bay_day_occupancy_restored_by_cancel
        grounds:
          - calculations.shop_bay_capacity_check
          - state_machines.CampaignWorkOrder.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: occupied bay-days per day-bucket. Scheduling a
          work order occupies the center's only bay on 2027-03-01 (a second
          order that day is rejected); the compensating cancel releases exactly
          that occupancy, and an identical second order then succeeds —
          forward action plus compensation leaves the capacity ledger
          unchanged. Distinct conserved quantity (bay-days) from the reman
          credit-ledger instance.
        test_recipe:
          setup:
            - "Logical clock 2026-12-15T00:00:00Z; family IN_PRODUCTION, NON_CONFORMING; RECALL CMP-6 IN_PROGRESS over units UN-921/UN-922."
            - "Center 'Single Bay Garage' capacity 1, AUTHORIZED, with a LEVEL_1 endorsed technician and a calibrated tool."
