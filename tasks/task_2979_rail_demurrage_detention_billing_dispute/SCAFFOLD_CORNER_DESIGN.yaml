      - name: adjudicator_cannot_void_the_cycle_it_just_credited
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.BillingAdmin.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: |
          The mirror image of the previous instance: void belongs to
          BillingAdmin, so the adjudicator who can forgive a charge cannot make
          the whole cycle disappear. Together the two instances close the loop on
          the segregated ladders.
