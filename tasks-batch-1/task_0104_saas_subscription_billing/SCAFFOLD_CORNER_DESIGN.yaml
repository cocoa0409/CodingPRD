          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { basic_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "ENTERPRISE", monthly_fee_cents: 20000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "occ@x.com", company_name: "OccCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${basic_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${pro_id}", expected_subscription_version: "${sub_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${ent_id}", expected_subscription_version: "${sub_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response error_id == ERR_STALE_VERSION"
            - "Subscription.${sub_id}.plan_id == ${pro_id} (the stale second change did not take effect)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Subscription.fields.version, "endpoints[\"POST /accounts/{id}/subscriptions/{sid}/addons\"]"]
        distinguishing_aspect: "Subscription.version starts at 1 on create and increments by at least 1 after an add-on attach mutation."
        test_recipe:
          setup: ["US-CA; BASIC plan trial_days 0; AddOn SEATS; ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "SEATS", monthly_fee_cents: 2000 }
              as: BillingAdmin
              captures: { addon_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "ver@x.com", company_name: "VerCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/addons"
              payload: { addon_id: "${addon_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { v1: $.data.version }
          assert:
            - "Subscription.${sub_id}.version after add-on attach > the version observed at create"

      - name: derived_mrr_reconciles_after_addon_then_cancel
        claim_type: derived_field_reconciliation
        grounds: [calculations.account_mrr, entities.Account.fields.mrr_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / mrr_conserved_across_subscription_create_then_cancel
          rationale: "Account.mrr_cents derived-field reconciliation across mutations is asserted by the named §1.8 conserved-quantity instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_mrr_on_create_response
        claim_type: immediate
        grounds: [entities.Account.fields.mrr_cents, "endpoints[\"POST /accounts/{id}/subscriptions\"]"]
        distinguishing_aspect: "Creating an ACTIVE subscription (trial_days 0) makes the account's mrr_cents reflect the new contribution in the same request cycle (read-back is immediate)."
        test_recipe:
          setup: ["US-CA; PRO plan fee 9000 trial_days 0; fresh account (mrr 0)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "imv@x.com", company_name: "ImvCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr: $.data.mrr_cents }
          assert:
            - "Account.${acct_id}.mrr_cents == 9000 on the immediate read-back"
