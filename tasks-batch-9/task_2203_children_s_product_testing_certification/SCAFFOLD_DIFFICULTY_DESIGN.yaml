            - "After operational_state is restored to ACTIVE, the identical start-testing request returns 200 with order_state == \"IN_TESTING\" — the only thing that changed was the parent Laboratory."
            - "After the clock passes 2026-09-01T00:00:00Z, start-testing on the fresh order returns HTTP 422 with error_id == \"ERR_UNDUE_INFLUENCE_ATTESTATION_MISSING\", even though Laboratory.operational_state is ACTIVE and no write touched the Laboratory row."
            - "That second refusal is NOT \"ERR_LAB_METHOD_NOT_ACCREDITED\": the accreditation runs through 2027-01-01T00:00:00Z, so only the attestation dimension is expired."
            - "Posting a renewed attestation valid through 2027-06-01T00:00:00Z and retrying start-testing returns 200 with order_state == \"IN_TESTING\", closing the dependency in both directions."

      - name: cross_entity_batch_release_blocked_until_certificate_satisfies_both_parallel_axes
        grounds:
          - validations[priority=12]
          - state_machines.ProductionBatch.HELD_to_RELEASED
          - state_machines.ChildrensProductCertificate.NOT_FURNISHED_to_FURNISHED
          - errors.ERR_CERTIFICATE_STATE_INVALID
        distinguishing_aspect: "A different entity pair: ProductionBatch depends on ChildrensProductCertificate — and specifically on BOTH of that certificate's parallel axes at once. The batch is releasable on every one of its own attributes (HELD, tracking label fully compliant, product CLEARED), yet release is refused first because the certificate is still DRAFT on the issuance axis and then, after issuance, still NOT_FURNISHED on the accompaniment axis. A recall-accompaniment afterwards re-blocks a second batch, showing the dependency is re-read on each attempt rather than consumed once."
