      - name: error_invalid_state_on_resale_decision_without_filing
        claim_type: error_precedence
        grounds: ["errors[ERR_RESALE_NOT_PENDING]", "errors[ERR_TERRITORY_NOT_QUALIFIED]", state_machines.Route.DRAFT_to_RETIRED]
        distinguishing_aspect: "A resale decision on a route whose resale_status is still NONE reports ERR_RESALE_NOT_PENDING 409 and not ERR_TERRITORY_NOT_QUALIFIED, even though the territory is also unqualified — the resale-axis state check is the one the decision path reads first."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 DRAFT with territory UNASSIGNED and resale_status NONE"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id", r1_resale: "$.data.resale_status", r1_territory: "$.data.territory_development_status" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: APPROVE }, as: FranchiseManager, captures: { decide_error: "$.data.error_id" } }
          assert:
            - "Route.${r1_id}.resale_status == NONE and territory_development_status == UNASSIGNED before the attempt"
            - "the decision captures ${decide_error} == ERR_RESALE_NOT_PENDING"
            - "the decision http status is 409"
            - "the decision does not carry ERR_TERRITORY_NOT_QUALIFIED, because resale_status is the axis this path reads"

  # ===========================================================================
  # section: RBAC
  # ===========================================================================
  - section: RBAC
    instances:

      - name: rbac_route_sales_rep_cannot_suspend_a_route
        claim_type: role_denial
        grounds: [roles.RouteSalesRep.exclusive_operations, roles.FranchiseManager.exclusive_operations, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Suspension is a FranchiseManager exclusive operation, so the entity-backed RouteSalesRep acting on the same route is refused with ERR_UNAUTHORIZED 403 and the route stays IN_SERVICE."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_active: "$.data.route_status" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: SUSPEND }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { suspend_error: "$.data.error_id" } }
            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_after: "$.data.route_status" } }
          assert:
            - "the RouteSalesRep SUSPEND captures ${suspend_error} == ERR_UNAUTHORIZED with http 403"
            - "Route.${r1_id}.route_status remains IN_SERVICE, so the denial preceded any state change"

      - name: rbac_franchise_manager_permitted_to_reinstate_a_suspended_route
        claim_type: role_permit
        grounds: [roles.FranchiseManager.exclusive_operations, state_machines.Route.SUSPENDED_to_IN_SERVICE]
        distinguishing_aspect: "The FranchiseManager's declared exclusive authority covers suspend and reinstate: after a manager suspension the same manager's REINSTATE is permitted and returns the route to IN_SERVICE."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 ACTIVATED in the week of 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: SUSPEND }, as: FranchiseManager, captures: { r1_suspended: "$.data.route_status" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: REINSTATE }, as: FranchiseManager, captures: { r1_reinstated: "$.data.route_status" } }
            - { call: "GET /retail/franchisees/${f_id}", payload: {}, as: FranchiseManager, captures: { f_active_routes: "$.data.active_route_count" } }
          assert:
            - "the SUSPEND succeeds with Route.${r1_id}.route_status == SUSPENDED and active_route_count dropping to 0"
            - "the REINSTATE succeeds on the same manager role and Route.${r1_id}.route_status == IN_SERVICE"
            - "Franchisee.${f_id}.active_route_count == 1 after reinstatement"
            - "no ERR_UNAUTHORIZED is returned for either manager action"

      - name: rbac_platform_admin_cannot_create_a_route
        claim_type: role_denial
        grounds: [roles.PlatformAdmin.exclusive_operations, roles.FranchiseOwner.exclusive_operations, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "PlatformAdmin owns only the clock and the product catalogue; route creation is a FranchiseOwner exclusive operation, so the operator role is refused with ERR_UNAUTHORIZED 403 and no route is created."
        test_recipe:
          setup: ["Franchisee F exists"]
          setup_api_calls:
