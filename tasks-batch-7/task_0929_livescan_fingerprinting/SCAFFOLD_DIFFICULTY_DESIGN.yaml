  - rule_id: combinatorial_formula
    instances:
      - name: waiver_applies_before_discount_with_per_component_rounding
        grounds:
          - calculations.fee_assessment_total
          - calculations.agency_volume_discount
          - entities.FeeAssessment.fields.waived_cents
          - entities.FeeAssessment.fields.discount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding and adjustment ORDER: the waiver is applied to the statutory
          components first and the volume discount is then rounded against the post-waiver base,
          giving discount 32 and total 1035; applying the discount to the pre-waiver base instead
          rounds to 176 and gives 891.
        test_recipe:
          setup:
            - "A FEE_WAIVED agency owning a CRIMINAL_JUSTICE ORI whose service type charges state 3289 and federal 1350"
            - "A MOBILE_EVENT site hosted by that agency with min_billable_prints 25 and no captures, already reconciled"
            - "That reconciliation created an ONSITE_SHORTFALL assessment of 55000 cents, so Agency.mtd_billed_cents is 55000 and the tier-1 discount of 3% is live"
            - "A card at the FIXED site finalized with all ten positions PASSED at 82"
          setup_api_calls:
