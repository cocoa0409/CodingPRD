# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2608 - Federated Fundraising Campaign & Allocation
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in `assert:` was computed with Decimal round_half_up
# against the SCAFFOLD.yaml §1.3 formulas and their `constants:`.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: campaign_shrinkage_provisional_vs_final_loss_divergence
        grounds:
          - calculations.campaign_pledge_loss_estimate
          - state_machines.Campaign.OPEN_to_SOLICITATION_CLOSED
          - state_machines.Campaign.SOLICITATION_CLOSED_to_ESCROW_HOLD
          - entities.Campaign.fields.provisional_estimated_loss
          - entities.Campaign.fields.final_actual_loss
          - entities.Campaign.fields.reserve_absorbed_amount
          - entities.Employer.fields.historical_shrinkage_rate_bps
        distinguishing_aspect: |
          This dual-variant calculation lives in the Campaign / payroll-shrinkage accounting
          domain: PROVISIONAL multiplies the employer's historical_shrinkage_rate_bps by the
          still-open payroll pledge total and never looks at loss_reserve_amount, while FINAL
          ignores the historical rate entirely and walks the actually-short pledges in a pinned
          chronological order absorbing whole uncollected amounts against the reserve. On the
          same three pledges the two variants return 120.00 and 500.00 respectively.
        test_recipe:
          setup:
            - "One ACTIVE employer with historical_shrinkage_rate_bps 800 and payroll_periods_per_year 26."
            - "One campaign of that employer with loss_reserve_amount 1000.00, driven PLANNED -> OPEN."
            - "Three CONFIRMED PAYROLL_DEDUCTION pledges created in this order: 600.00, 500.00, 400.00 - so created_at ASC is 600, 500, 400."
            - "Solicitation closed (PROVISIONAL variant stamped while all three pledges are still collection_status PENDING)."
            - "All three pledges then written off with zero collected, so each carries uncollected_amount equal to its gross_amount."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Northgate Manufacturing", employee_count: 400, payroll_periods_per_year: 26, historical_shrinkage_rate_bps: 800 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 1000.00 }
              as: UnitedFundAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/pledges"
              payload: { donor_reference: "D-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 600.00 }
              as: UnitedFundAdmin
              captures: { pl1: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/pledges"
              payload: { donor_reference: "D-002", giving_method: "PAYROLL_DEDUCTION", gross_amount: 500.00 }
              as: UnitedFundAdmin
              captures: { pl2: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/pledges"
              payload: { donor_reference: "D-003", giving_method: "PAYROLL_DEDUCTION", gross_amount: 400.00 }
              as: UnitedFundAdmin
              captures: { pl3: $.data.id }
            - call: "POST /fundraising/pledges/${pl1}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl2}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl3}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/close-solicitation"
              payload: {}
              as: UnitedFundAdmin
              captures: { prov_loss: $.data.provisional_estimated_loss, prov_net: $.data.provisional_net_expected_revenue, proj_payroll: $.data.projected_payroll_pledge_total }
            - call: "POST /fundraising/pledges/${pl1}/write-off"
              payload: { reason_code: "TERMINATION" }
              as: FinanceReviewer
            - call: "POST /fundraising/pledges/${pl2}/write-off"
              payload: { reason_code: "TERMINATION" }
              as: FinanceReviewer
            - call: "POST /fundraising/pledges/${pl3}/write-off"
              payload: { reason_code: "TERMINATION" }
              as: FinanceReviewer
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/reconcile"
              payload: {}
              as: FinanceReviewer
              captures: { final_loss: $.data.final_actual_loss, absorbed: $.data.reserve_absorbed_amount, bps: $.data.realized_shrinkage_rate_bps, posture: $.data.posture }
          assert:
            - "Campaign.${camp_id}.confirmed_gross_total == 1500.00"
            - "Campaign.${camp_id}.projected_payroll_pledge_total == 1500.00"
            - "Campaign.${camp_id}.provisional_estimated_loss == 120.00"
            - "Campaign.${camp_id}.provisional_net_expected_revenue == 1380.00"
            - "Campaign.${camp_id}.reserve_absorbed_amount == 1000.00 (600.00 absorbed, 500.00 skipped all-or-nothing, 400.00 absorbed)"
            - "Campaign.${camp_id}.final_actual_loss == 500.00"
            - "Campaign.${camp_id}.final_net_expected_revenue == 1000.00"
            - "Campaign.${camp_id}.realized_shrinkage_rate_bps == 3333"
            - "Campaign.${camp_id}.provisional_estimated_loss != Campaign.${camp_id}.final_actual_loss (120.00 vs 500.00)"
            - "Campaign.${camp_id}.posture == ESCROW_HOLD"
            - "Employer.${emp_id}.status == SUSPENDED"
            - "Employer.${emp_id}.suspended_reason == ESCROW_HOLD_SHRINKAGE"

      - name: agency_standing_preliminary_vs_certified_score_divergence
        grounds:
          - calculations.agency_financial_standing_score
          - state_machines.AgencyReview.PENDING_to_CERTIFIED
          - state_machines.Agency.UNDER_FINANCIAL_REVIEW_to_PROBATION
          - entities.AgencyReview.fields.preliminary_score
          - entities.AgencyReview.fields.certified_score
          - entities.AgencyReview.fields.restatement_penalty_applied
          - entities.Agency.fields.latest_standing_score
        distinguishing_aspect: |
          This dual-variant calculation lives in the Agency / membership-standards domain, a
          different entity domain from the Campaign shrinkage variant: PRELIMINARY reads the
          self-reported ratios, forces audit_points to 0 and never applies the restatement
          penalty; CERTIFIED reads the audited ratios, credits AUDIT_POINTS[UNQUALIFIED] = 10
          and subtracts RESTATEMENT_PENALTY 7.50 because the audited program ratio came in more
          than RESTATEMENT_TOLERANCE below the self-reported one. Same review row, 80.00 vs 69.50.
        test_recipe:
          setup:
            - "One APPLICANT agency with no reviews."
            - "One self-reported AgencyReview for fiscal_year 2025: program 0.7800, admin 0.1900, reserve 4.00 months, 8 governance items passed, audit_opinion UNQUALIFIED - which scores 80.00 under PRELIMINARY and would clear STANDARDS_PASS_SCORE 70.00."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Riverside Family Services", ein: "123456789", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fundraising/agencies/${ag_id}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_id: $.data.id, prelim: $.data.preliminary_score }
          trigger:
            - call: "POST /fundraising/agencies/${ag_id}/reviews/${rev_id}/certify"
              payload: { audited_program_expense_ratio: 0.7400, audited_admin_expense_ratio: 0.2700, audited_months_operating_reserve: 3.00 }
              as: FinanceReviewer
              captures: { cert: $.data.certified_score, pen: $.data.restatement_penalty_applied }
          assert:
            - "AgencyReview.${rev_id}.preliminary_score == 80.00"
            - "AgencyReview.${rev_id}.certified_score == 69.50"
            - "AgencyReview.${rev_id}.restatement_penalty_applied == 7.50"
            - "AgencyReview.${rev_id}.standards_met == false"
            - "AgencyReview.${rev_id}.review_basis == AUDITED"
            - "AgencyReview.${rev_id}.status == CERTIFIED"
            - "AgencyReview.${rev_id}.preliminary_score != AgencyReview.${rev_id}.certified_score (80.00 vs 69.50)"
            - "Agency.${ag_id}.membership_status == PROBATION"
            - "Agency.${ag_id}.latest_standing_score == 69.50"
            - "Agency.${ag_id}.probation_count == 1"
            - "Agency.${ag_id}.open_review_count == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: designation_fee_per_line_rounding_before_summation
        grounds:
          - calculations.pledge_designation_fee_allocation
          - entities.PledgeDesignation.fields.processing_fee
          - entities.PledgeDesignation.fields.net_designated_amount
          - entities.PledgeDesignation.fields.designation_sequence
          - entities.Pledge.fields.designation_fee_total
          - entities.Pledge.fields.undesignated_amount
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order changes the cents. The scaffold pins
          "round every per-line fee to cents first, then sum the already-rounded fees": two
          25.00 lines at DESIGNATION_FEE_RATE 0.0725 give round(1.8125) = 1.81 each and a
          designation_fee_total of 3.62, whereas the sum-then-round reading gives
          round(50.00 * 0.0725) = round(3.625) = 3.63. This instance is NOT a tiered/nested
          min-max formula (mode a) and NOT a circular evaluation-order pin (mode c).
        test_recipe:
          setup:
            - "Two member agencies both driven to GOOD_STANDING by a certified review scoring 100.00, so both are legal designation targets."
            - "One ACTIVE employer and one OPEN campaign of that employer."
            - "No pledges yet on the campaign."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Lakeside Utilities", employee_count: 220, payroll_periods_per_year: 24, historical_shrinkage_rate_bps: 500 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Harbor Literacy Council", ein: "200000001", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.9000, admin_expense_ratio: 0.1000, months_operating_reserve: 6.00, governance_checklist_passed_count: 10, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews/${rev_a}/certify"
              payload: { audited_program_expense_ratio: 0.9000, audited_admin_expense_ratio: 0.1000, audited_months_operating_reserve: 6.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Eastside Health Clinic", ein: "200000002", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.9000, admin_expense_ratio: 0.1000, months_operating_reserve: 6.00, governance_checklist_passed_count: 10, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_b: $.data.id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews/${rev_b}/certify"
              payload: { audited_program_expense_ratio: 0.9000, audited_admin_expense_ratio: 0.1000, audited_months_operating_reserve: 6.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/pledges"
              payload: { donor_reference: "D-100", giving_method: "ONE_TIME_CHECK", gross_amount: 150.00, designations: [ { agency_id: "${ag_a}", designated_amount: 25.00 }, { agency_id: "${ag_b}", designated_amount: 25.00 } ] }
              as: UnitedFundAdmin
              captures: { pl_id: $.data.id, fee_total: $.data.designation_fee_total }
          assert:
            - "GET /fundraising/pledges/${pl_id}/designations returns exactly 2 rows, designation_sequence 1 then 2"
            - "PledgeDesignation[designation_sequence=1].processing_fee == 1.81"
            - "PledgeDesignation[designation_sequence=1].net_designated_amount == 23.19"
            - "PledgeDesignation[designation_sequence=2].processing_fee == 1.81"
            - "PledgeDesignation[designation_sequence=2].net_designated_amount == 23.19"
            - "Pledge.${pl_id}.designation_fee_total == 3.62"
            - "Pledge.${pl_id}.designation_fee_total != 3.63 (the sum-then-round answer)"
            - "Pledge.${pl_id}.designated_amount_total == 50.00"
            - "Pledge.${pl_id}.undesignated_amount == 100.00"
            - "Pledge.${pl_id}.net_designated_total == 46.38"
            - "Pledge.${pl_id}.designation_status == DRAFT"
            - "Pledge.${pl_id}.collection_status == PENDING"

      - name: impact_fund_offset_then_supplement_evaluation_order_pin
        grounds:
          - calculations.community_impact_fund_allocation
          - calculations.request_panel_composite_score
          - state_machines.AllocationRequest.PANEL_APPROVED_to_AWARDED
          - concurrency_rules[award-create-stale-cycle]
          - entities.AllocationRequest.fields.base_award
          - entities.AllocationRequest.fields.designation_offset
          - entities.AllocationRequest.fields.strategic_supplement
          - entities.Agency.fields.designated_passthrough_ytd
        distinguishing_aspect: |
          Mode (c) - a dependency that LOOKS circular is resolved by a pinned evaluation order:
          OFFSET_RATE is keyed on base_award (175960.00 -> 0.35) while SUPPLEMENT_RATE is keyed
          on net_after_offset (114374.00 -> 0.03), and the pool clamp runs last. Keying the
          supplement on base_award instead - the naive reading, since 175960.00 >= 120000.00
          selects 0.01 - yields 115517.74 instead of the correct 117805.22. This is not a
          rounding-order pin (mode b).
        test_recipe:
          setup:
            - "One GOOD_STANDING agency whose designated_passthrough_ytd is exactly 92750.00, produced by a fully remitted 100000.00 pledge designated 100000.00 to it (fee 7250.00, net 92750.00)."
            - "One AllocationCycle with focus_priority_area EDUCATION, opening_undesignated_pool 500000.00 and max_award_per_agency 200000.00, driven DRAFT -> OPEN with three conflict-free panel seats."
            - "One AllocationRequest of that agency for 250000.00 in priority_area EDUCATION, submitted and scored by all three panelists so composite_score is 87.98 and status is PANEL_APPROVED."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
