              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/attendance"
              payload: { participant_id: "${pa}", access_modality: "IN_PERSON" }
              as: Facilitator
              as_user_id: "${fid}"
              captures: { aid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/attendance/${aid}/checkout"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:30:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/complete"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/surveys"
              payload: { participant_id: "${pa}", overall_rating: 5, facilitator_rating: 4, modality_rating: 5 }
              as: Participant
              as_user_id: "${pa}"
              captures: { svid: $.data.id }
          assert:
            - "Survey created with id ${svid}"
            - "EvaluationSurvey has no updated_at or version (common_fields=false)"

  # ==========================================================================
  # §1.9 Section: state_machines
