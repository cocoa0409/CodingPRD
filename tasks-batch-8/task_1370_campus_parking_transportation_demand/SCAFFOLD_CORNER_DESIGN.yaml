# =============================================================================
# §1.9 Scaffold Corner Design — task_1370 campus parking
# Enumerative coverage of testable claims NOT already probed by §1.8.
# Shared fixture dates: TERM_A = 2026-08-03 .. 2026-11-22 (112 days, 16 weeks);
# default logical clock 2026-08-01T00:00:00Z; full-term fee at base 80000 is
# 80000 + 4000 surcharge = 84000.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: create_patron_applies_computed_defaults
        claim_type: computed_fields
        grounds: ["entities.Patron.fields.standing", "entities.Patron.fields.outstanding_balance_cents"]
        distinguishing_aspect: "A freshly created patron starts with standing GOOD_STANDING, outstanding_balance_cents 0, version 1 — standing/balance are computed, never client-supplied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "New Patron", campus_role: "FACULTY", residency: "ON_CAMPUS", primary_commute_mode: "WALK" }
              as: ParkingAdmin
              captures: { np_standing: $.data.standing, np_balance: $.data.outstanding_balance_cents, np_version: $.data.version }
          trigger: []
          assert:
            - "captured np_standing == GOOD_STANDING and np_balance == 0 and np_version == 1"

      - name: list_patrons_paginates_with_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /parking/patrons honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["three patrons exist"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "P1", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
            - call: "POST /parking/patrons"
              payload: { full_name: "P2", campus_role: "STAFF", residency: "ON_CAMPUS", primary_commute_mode: "TRANSIT" }
              as: ParkingAdmin
            - call: "POST /parking/patrons"
              payload: { full_name: "P3", campus_role: "FACULTY", residency: "OFF_CAMPUS", primary_commute_mode: "BIKE" }
              as: ParkingAdmin
          trigger:
            - call: "GET /parking/patrons"
              payload: { limit: 2, offset: 0 }
              as: ParkingAdmin
          assert:
            - "page 1 returns 2 items with total_count == 3 and has_more == true"
            - "a follow-up GET with limit 2 offset 2 returns exactly 1 item and has_more == false"

      - name: get_patron_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PATRON_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random, never-created patron id yields ERR_PATRON_NOT_FOUND (404), not a generic 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /parking/patrons/00000000-0000-0000-0000-000000000000"
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PATRON_NOT_FOUND (HTTP 404)"

      - name: create_allocation_rejects_duplicate_code_per_lot
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ALLOCATION_CODE]"]
        distinguishing_aspect: "(lot_id, permit_code) uniqueness: a second GEN allocation on the same lot is rejected even though a GEN allocation on a DIFFERENT lot is fine."
        test_recipe:
          setup: ["two lots; allocation GEN exists on lot 1"]
          setup_api_calls:
            - call: "POST /parking/lots"
              payload: { lot_code: "L1", name: "Lot 1", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_1: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L2", name: "Lot 2", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_2: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_1}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_1}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 90000, proration_policy: "FLAT_HALF_TERM", term_start: "2026-08-03", term_end: "2026-11-22", quota: 3 }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_2}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 90000, proration_policy: "FLAT_HALF_TERM", term_start: "2026-08-03", term_end: "2026-11-22", quota: 3 }
              as: ParkingAdmin
              captures: { ok_code: $.data.permit_code }
          assert:
            - "captured err == ERR_DUPLICATE_ALLOCATION_CODE (HTTP 409) for the same-lot duplicate"
            - "captured ok_code == GEN on the different lot (201) — uniqueness is scoped per lot"

      - name: incentive_account_second_enroll_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_ACCOUNT_EXISTS]"]
        distinguishing_aspect: "Exactly one incentive account per patron: the second enrollment is rejected with ERR_ACCOUNT_EXISTS."
        test_recipe:
          setup: ["TRANSIT patron with an existing incentive account"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "M", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "TRANSIT" }
              as: ParkingAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/incentive-accounts"
              payload: { patron_id: "${m_id}" }
              as: Commuter
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /parking/incentive-accounts"
              payload: { patron_id: "${m_id}" }
              as: Commuter
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_ACCOUNT_EXISTS (HTTP 409)"

      - name: patron_create_with_system_fields_rejected
        claim_type: system_fields
        grounds: ["entities.Patron"]
        distinguishing_aspect: "Client-supplied system fields (id, version, standing) in a create payload are rejected with ERR_INVALID_REQUEST — system fields are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /parking/patrons"
              payload: { full_name: "Sneaky", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "TRANSIT", id: "00000000-0000-0000-0000-000000000000", version: 99, standing: "BLOCKED" }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST (HTTP 400)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: permit_purchase_initial_state_and_fee_fields
        claim_type: initial_state
        grounds: ["state_machines.Permit", "entities.Permit.fields.valid_to"]
        distinguishing_aspect: "A purchased permit starts ACTIVE with valid_to pinned to the allocation's term_end, refund_cents null, and the four fee fields populated (fee_base/surcharge/fee_total/fee_paid = 80000/4000/84000/84000 at default clock)."
        test_recipe:
          setup: ["STUDENT patron; quota-5 PRORATED_WEEKLY allocation (base 80000, TERM_A); clock untouched (2026-08-01, before term start)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "F", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { f_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LF", name: "Lot F", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_f: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_f}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_f: $.data.id }
            - call: "GET /parking/allocations/${alloc_f}"
              as: ParkingAdmin
              captures: { v_f: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${f_id}", allocation_id: "${alloc_f}", plate_number: "F111", expected_allocation_version: "${v_f}" }
              as: ParkingAdmin
              captures: { p_status: $.data.status, p_valid_from: $.data.valid_from, p_valid_to: $.data.valid_to, p_base: $.data.fee_base_cents, p_surcharge: $.data.surcharge_cents, p_total: $.data.fee_total_cents, p_paid: $.data.fee_paid_cents }
          assert:
            - "captured p_status == ACTIVE and p_valid_from == 2026-08-03 (defaulted to term start, later than clock date) and p_valid_to == 2026-11-22"
            - "captured p_base == 80000 and p_surcharge == 4000 and p_total == 84000 and p_paid == 84000"

      - name: cancel_already_cancelled_permit_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Permit.ACTIVE_to_CANCELLED", "errors[ERR_PERMIT_NOT_ACTIVE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same permit is rejected and no further refund is computed."
        test_recipe:
          setup: ["patron with one permit, already cancelled (before term start, full refund 84000)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "G", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LG", name: "Lot G", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_g: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_g}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_g: $.data.id }
            - call: "GET /parking/allocations/${alloc_g}"
              as: ParkingAdmin
              captures: { v_g: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${g_id}", allocation_id: "${alloc_g}", plate_number: "G111", expected_allocation_version: "${v_g}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /parking/permits/${permit_id}/cancel"
              payload: {}
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/permits/${permit_id}/cancel"
              payload: {}
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PERMIT_NOT_ACTIVE (HTTP 409); the permit remains CANCELLED with refund_cents unchanged"

      - name: claim_withdrawn_entry_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WaitlistEntry.WAITING_to_WITHDRAWN", "errors[ERR_OFFER_NOT_PENDING]"]
        distinguishing_aspect: "A WITHDRAWN entry cannot be claimed: claim requires status OFFERED and fails with ERR_OFFER_NOT_PENDING."
        test_recipe:
          setup: ["quota-1 allocation filled (WAITLISTING); patron J's entry joined then withdrawn"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "J", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { j_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LJ", name: "Lot J", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_j: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_j}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_j: $.data.id }
            - call: "GET /parking/allocations/${alloc_j}"
              as: ParkingAdmin
              captures: { v_j: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_j}", plate_number: "O111", expected_allocation_version: "${v_j}" }
              as: ParkingAdmin
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${j_id}", allocation_id: "${alloc_j}" }
              as: ParkingAdmin
              captures: { j_entry: $.data.id }
            - call: "POST /parking/waitlist-entries/${j_entry}/withdraw"
              payload: {}
              as: Commuter
              as_user_id: "${j_id}"
            - call: "GET /parking/allocations/${alloc_j}"
              as: ParkingAdmin
              captures: { v_j2: $.data.version }
          trigger:
            - call: "POST /parking/waitlist-entries/${j_entry}/claim"
              payload: { expected_allocation_version: "${v_j2}" }
              as: Commuter
              as_user_id: "${j_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_OFFER_NOT_PENDING (HTTP 409); no permit created"

      - name: rejoin_waitlist_after_withdrawal_allowed
        claim_type: valid_transition
        grounds: ["validations[priority=11]", "state_machines.WaitlistEntry.WAITING_to_WITHDRAWN"]
        distinguishing_aspect: "ERR_ALREADY_WAITLISTED only fires for WAITING/OFFERED entries: after withdrawal the same patron can join the same allocation's waitlist again."
        test_recipe:
          setup: ["quota-1 WAITLISTING allocation (filled); patron K joined and withdrew"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "K", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { k_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LK", name: "Lot K", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_k: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_k}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_k: $.data.id }
            - call: "GET /parking/allocations/${alloc_k}"
              as: ParkingAdmin
              captures: { v_k: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_k}", plate_number: "O222", expected_allocation_version: "${v_k}" }
              as: ParkingAdmin
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${k_id}", allocation_id: "${alloc_k}" }
              as: ParkingAdmin
              captures: { k_entry: $.data.id }
            - call: "POST /parking/waitlist-entries/${k_entry}/withdraw"
              payload: {}
              as: Commuter
              as_user_id: "${k_id}"
          trigger:
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${k_id}", allocation_id: "${alloc_k}" }
              as: Commuter
              as_user_id: "${k_id}"
              captures: { k2_status: $.data.status }
          assert:
            - "captured k2_status == WAITING (201) — a WITHDRAWN prior entry does not block rejoining"

      - name: allocation_zero_quota_starts_waitlisting
        claim_type: initial_state
        grounds: ["state_machines.LotAllocation", "entities.LotAllocation.fields.status"]
        distinguishing_aspect: "Initial state is conditional on quota: quota 0 yields WAITLISTING at creation (0 >= 0), while positive quota yields OPEN."
        test_recipe:
          setup: ["one lot"]
          setup_api_calls:
            - call: "POST /parking/lots"
              payload: { lot_code: "LZ", name: "Lot Z", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_z: $.data.id }
          trigger:
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_z}", permit_code: "ZERO", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 0 }
              as: ParkingAdmin
              captures: { z_status: $.data.status }
          assert:
            - "captured z_status == WAITLISTING"

      - name: event_closure_lifecycle_releases_reserved_spaces
        claim_type: side_effect_execution
        grounds: ["state_machines.LotClosure.SCHEDULED_to_ACTIVE", "state_machines.LotClosure.ACTIVE_to_LIFTED", "calculations.lot_availability_calculation"]
        distinguishing_aspect: "EVENT closures reserve stalls at creation (available 100 -> 90), flip lot posture only at activation (CLOSED_EVENT), and restore both posture and reservation on lift (available back to 100)."
        test_recipe:
          setup: ["lot capacity 100, no allocations; EVENT closure reserved_spaces 10 created (SCHEDULED)"]
          setup_api_calls:
            - call: "POST /parking/lots"
              payload: { lot_code: "LEV", name: "Lot EV", zone: "CORE", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_ev: $.data.id }
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_ev}", reason: "EVENT", event_name: "GameDay", reserved_spaces: 10, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-12T00:00:00Z" }
              as: ParkingAdmin
              captures: { cl_ev: $.data.id }
          trigger:
            - call: "GET /parking/lots/${lot_ev}"
              as: ParkingAdmin
              captures: { avail_sched: $.data.available_capacity, posture_sched: $.data.posture, reserved_sched: $.data.reserved_spaces_total }
            - call: "POST /parking/closures/${cl_ev}/activate"
              payload: {}
              as: ParkingAdmin
              captures: { cl_status: $.data.status }
            - call: "GET /parking/lots/${lot_ev}"
              as: ParkingAdmin
              captures: { posture_active: $.data.posture, avail_active: $.data.available_capacity }
            - call: "POST /parking/closures/${cl_ev}/lift"
              payload: {}
              as: ParkingAdmin
            - call: "GET /parking/lots/${lot_ev}"
              as: ParkingAdmin
              captures: { posture_lifted: $.data.posture, avail_lifted: $.data.available_capacity, reserved_lifted: $.data.reserved_spaces_total }
          assert:
            - "captured avail_sched == 90 and reserved_sched == 10 and posture_sched == OPEN (reservation counts while SCHEDULED; posture unchanged)"
            - "captured cl_status == ACTIVE and posture_active == CLOSED_EVENT and avail_active == 90"
            - "captured posture_lifted == OPEN and avail_lifted == 100 and reserved_lifted == 0"

      - name: route_suspend_resume_keeps_single_commitment
        claim_type: side_effect_execution
        grounds: ["state_machines.ShuttleRoute.SUSPENDED_to_ACTIVE", "calculations.fund_balance_calculation"]
        distinguishing_aspect: "Re-activation from SUSPENDED does NOT double-commit: committed_shuttle_funding_cents stays at one annual_operating_cost_cents (10000) through ACTIVE -> SUSPENDED -> ACTIVE."
        test_recipe:
          setup: ["fund with 84000 permit revenue (one full-term purchase); route cost 10000, capacity 400 >= projected 300"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "B", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { b_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_b}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_b: $.data.id }
            - call: "GET /parking/allocations/${alloc_b}"
              as: ParkingAdmin
              captures: { v_b: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${b_id}", allocation_id: "${alloc_b}", plate_number: "B111", expected_allocation_version: "${v_b}" }
              as: ParkingAdmin
            - call: "POST /parking/transportation-funds"
              payload: { fund_code: "PTS_OPERATING" }
              as: ParkingAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /parking/shuttle-routes"
              payload: { fund_id: "${fund_id}", route_code: "BLUE_LOOP", fleet_group: "FLEET_A", service_window_start_minutes: 480, service_window_end_minutes: 960, headway_minutes: 30, vehicle_capacity: 25, projected_daily_ridership: 300, annual_operating_cost_cents: 10000 }
              as: ParkingAdmin
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /parking/shuttle-routes/${route_id}/activate"
              payload: {}
              as: ParkingAdmin
              captures: { r_status1: $.data.status }
            - call: "POST /parking/shuttle-routes/${route_id}/suspend"
              payload: {}
              as: ParkingAdmin
              captures: { r_status2: $.data.status }
            - call: "POST /parking/shuttle-routes/${route_id}/activate"
              payload: {}
              as: ParkingAdmin
              captures: { r_status3: $.data.status }
            - call: "GET /parking/transportation-funds/${fund_id}"
              as: ParkingAdmin
              captures: { committed: $.data.committed_shuttle_funding_cents }
          assert:
            - "captured r_status1 == ACTIVE and r_status2 == SUSPENDED and r_status3 == ACTIVE (cyclic resume)"
            - "captured committed == 10000 (single commitment retained through suspension and resume)"

      - name: citation_voided_rejects_pay_and_appeal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Citation", "errors[ERR_CITATION_NOT_ISSUED]"]
        distinguishing_aspect: "VOIDED is terminal: both pay and appeal on a voided citation fail with ERR_CITATION_NOT_ISSUED."
        test_recipe:
          setup: ["patron with permit plate V555; citation issued, appealed, decided VOIDED"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "V", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { v_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
