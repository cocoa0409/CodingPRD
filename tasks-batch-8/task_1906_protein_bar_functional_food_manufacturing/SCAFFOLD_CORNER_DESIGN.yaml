        claim_type: role_permission
        grounds: [roles, "validations[priority=3]", "errors[ERR_FORBIDDEN_CUSTOMER_SCOPE]"]
        distinguishing_aspect: "Entity-backed scoping: BrandCustomerRep of C1 lists own customer_id (200), reads own formula (200), but reading C2's formula -> ERR_FORBIDDEN_CUSTOMER_SCOPE (403)."
        test_recipe:
          setup: ["customers C1 and C2; formula F2 owned by C2"]
