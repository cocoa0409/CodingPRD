            - "${run_v3} == ${run_v1} + 2 and the final version == ${run_v3} + 1: each of the three writes bumped the row exactly once"

      - name: conclude_audit_credits_back_every_statement_ledger
        grounds:
          - state_machines.ArtistStatement.ISSUED_to_FINALIZED
          - state_machines.ArtistStatement.FINALIZED_to_REVISED
          - state_machines.ArtistStatement.AUDIT_REQUESTED_to_AUDIT_COMPLETED
          - entities.ArtistAgreement.fields.unrecouped_artist_advance_cents
          - entities.Release.fields.recoupable_marketing_applied_cents
          - endpoints[POST /artist-statements/{id}/conclude-audit]
        distinguishing_aspect: |
          Conserved quantity = the THREE agreement/release ledgers that finalize debits
          (unrecouped_artist_advance_cents, unrecouped_recording_cents,
          recoupable_marketing_applied_cents) — a different conserved set again. A material audit finding
          must credit all three back to their exact pre-finalize values (40000 / 20000 / 0), not
          approximately and not just the advance.
