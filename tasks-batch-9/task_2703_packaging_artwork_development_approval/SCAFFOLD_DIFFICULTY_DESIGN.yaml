              captures: { runout_id: "$.data.id" }
            - call: "POST /inventory-runouts/${runout_id}/depletion-records"
              payload:
                records:
                  - { week_start_utc: "2026-08-03T00:00:00Z", units_consumed: 3333 }
              as: PackagingCoordinator
