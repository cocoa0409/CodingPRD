scenario: |
  Aircraft Component MRO & Overhaul Shop (FAA Part 145 repair station): incoming teardown & serviceable/unserviceable tag, work scope per CMM & AD/SB applicability, rotable exchange pool & lease unit, parts sourcing (PMA vs OEM) approval, test cell/ATP record & 8130 tag, turnaround-time guarantee & penalty, warranty on overhaul cycles, back-to-birth traceability

domain_name: aircraft-component-mro
api_prefix: /mro

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat        # peer entities joined by FK references; sub-resource GETs exist only for FK reverse-reachability
  state_machine_shape: cyclic  # WorkOrder retest loop + PartsRequisition reject/resubmit loop; ComponentUnit carries two parallel state dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic               # Invoice.source: work_order_id | lease_agreement_id | exchange_agreement_id
  role_model: segregation_of_duties   # Inspector who signs test results / 8130 release must differ from the Technician who performed the repair
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator / airline name" }
      - { name: certificate_number, type: string, source: input, description: "Air carrier certificate number; unique", constraints: "unique across Customers" }
      - { name: contract_tat_hours, type: integer, source: input, description: "Guaranteed door-to-door turnaround hours per work order" }
      - { name: tat_penalty_rate_cents_per_hour, type: integer, source: input, description: "Penalty credit rate per excess adjusted hour" }
      - { name: tat_penalty_cap_pct, type: integer, source: input, description: "Penalty cap as percent of invoice subtotal (0-100)" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding exposure" }
      - { name: penalty_delay_rule, type: enum, source: input, default: ADJUSTED, description: "TAT penalty variant: ADJUSTED excludes customer-delay hours; CALENDAR uses raw elapsed hours", constraints: "ADJUSTED | CALENDAR" }
      - { name: current_exposure_cents, type: integer, source: computed, default: 0, description: "Stored running total: += invoice.total_cents on ISSUED, -= on PAID" }
      - { name: credit_hold, type: boolean, source: computed, description: "true when current_exposure_cents >= credit_limit_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value; suspension is out of scope)", constraints: "ACTIVE" }

  - name: PartCatalogEntry
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Manufacturer part number; unique", constraints: "unique" }
      - { name: ata_chapter, type: string, source: input, description: "ATA chapter code, e.g. '32'" }
      - { name: is_rotable, type: boolean, source: input, description: "Rotable part eligible for exchange pool" }
      - { name: cmm_reference, type: string, source: input, description: "Component Maintenance Manual reference" }
      - { name: replacement_value_cents, type: integer, source: input, description: "New-part replacement value; base for BER and core charges" }
      - { name: ber_threshold_pct, type: integer, source: input, default: 65, description: "BER when repair estimate >= this percent of replacement_value_cents" }
      - { name: warranty_cycle_limit, type: integer, source: input, description: "Warranty coverage ceiling in cycles since overhaul (inclusive)" }
      - { name: warranty_month_limit, type: integer, source: input, description: "Warranty coverage ceiling in months since release (inclusive)" }
      - { name: flat_overhaul_price_cents, type: integer, source: input, description: "Catalog flat-rate overhaul labor price (reference for quotes)" }

  - name: DirectiveRecord
    parent: null
    common_fields: false
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> PartCatalogEntry.id; directive applies to this part" }
      - { name: directive_type, type: enum, source: input, description: "AD (Airworthiness Directive, mandatory) | SB (Service Bulletin)", constraints: "AD | SB" }
      - { name: directive_number, type: string, source: input, description: "Official directive number; unique per part", constraints: "unique per (part_id)" }
      - { name: mandatory, type: boolean, source: input, description: "true for mandatory ADs; gates complete-repair and release" }
      - { name: description, type: string, source: input, description: "Compliance summary" }

  - name: ComponentUnit
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> PartCatalogEntry.id" }
      - { name: serial_number, type: string, source: input, description: "Serial number; globally unique", constraints: "unique" }
      - { name: ownership, type: enum, source: input, description: "SHOP (pool/lease stock) | CUSTOMER", constraints: "SHOP | CUSTOMER" }
      - { name: owner_customer_id, type: string, source: input, description: "FK -> Customer.id; required iff ownership=CUSTOMER, null when SHOP", constraints: "nullable" }
      - { name: condition_status, type: enum, source: input, description: "Parallel dimension 1: SERVICEABLE | UNSERVICEABLE | SCRAPPED", constraints: "SERVICEABLE | UNSERVICEABLE | SCRAPPED" }
      - { name: custody_status, type: enum, source: input, description: "Parallel dimension 2: OFF_SITE | IN_SHOP | AWAITING_SHIPMENT | SHIPPED | IN_POOL | ON_LEASE", constraints: "OFF_SITE | IN_SHOP | AWAITING_SHIPMENT | SHIPPED | IN_POOL | ON_LEASE" }
      - { name: total_cycles, type: integer, source: input, description: "Accumulated cycles since new (back-to-birth)" }
      - { name: cycles_since_overhaul, type: integer, source: input, description: "Cycles since last overhaul; reset to 0 at release when work_scope in {OVERHAUL, WARRANTY_REWORK}" }
      - { name: manufactured_at, type: string, source: input, description: "Manufacture date (YYYY-MM-DD); start of back-to-birth traceability" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billing customer" }
      - { name: unit_id, type: string, source: input, description: "FK -> ComponentUnit.id" }
      - { name: work_scope, type: enum, source: input, description: "REPAIR | OVERHAUL | WARRANTY_REWORK", constraints: "REPAIR | OVERHAUL | WARRANTY_REWORK" }
      - { name: status, type: enum, source: system, description: "TEARDOWN_IN_PROGRESS | AWAITING_QUOTE | QUOTE_SUBMITTED | REPAIR_IN_PROGRESS | AWAITING_PARTS | READY_FOR_TEST | TEST_PASSED | RELEASED | CLOSED | CANCELLED | BER_SCRAPPED" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at creation (TAT start)" }
      - { name: quote_submitted_at, type: datetime, source: system, description: "Clock at latest quote submission", constraints: "nullable" }
      - { name: accumulated_delay_hours, type: number, source: computed, default: 0, description: "Cumulative customer-delay hours: += (decision_time - quote_submitted_at) on each quote-approval/quote-decline" }
      - { name: promised_return_at, type: datetime, source: computed, description: "received_at + customer.contract_tat_hours" }
      - { name: released_at, type: datetime, source: system, description: "Clock at release (TAT stop)", constraints: "nullable" }
      - { name: labor_estimate_cents, type: integer, source: input, description: "Fixed-price labor quoted; becomes labor charge" }
      - { name: parts_estimate_cents, type: integer, source: input, description: "Estimated parts cost quoted" }
      - { name: ber_flag, type: boolean, source: computed, default: false, description: "true when labor_estimate_cents + parts_estimate_cents >= ber_threshold_pct% of part replacement_value_cents" }
      - { name: labor_charge_cents, type: integer, source: computed, description: "= labor_estimate_cents once quote submitted (fixed price)" }
      - { name: parts_charge_cents, type: integer, source: computed, default: 0, description: "Sum of extended_price_cents over ISSUED requisitions (per-line rounding)" }
      - { name: test_attempt_count, type: integer, source: computed, default: 0, description: "Increments on every test-results call" }
      - { name: open_discrepancy_count, type: integer, source: computed, default: 0, description: "Stored count of DiscrepancyCards with status OPEN for this work order" }
      - { name: technician_user_id, type: string, source: system, description: "X-User-ID captured at complete-repair; segregation-of-duties anchor", constraints: "nullable" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID captured at release", constraints: "nullable" }

  - name: DiscrepancyCard
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: finding_text, type: string, source: input, description: "Teardown finding" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR", constraints: "MINOR | MAJOR" }
      - { name: disposition_text, type: string, source: input, description: "Corrective action per CMM", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPOSITIONED | CLOSED" }

  - name: DirectiveCompliance
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: directive_number, type: string, source: system, description: "Copied from DirectiveRecord at work-order creation (not an FK)" }
      - { name: directive_type, type: enum, source: system, description: "AD | SB copied from DirectiveRecord" }
      - { name: mandatory, type: boolean, source: system, description: "Copied from DirectiveRecord" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLIED | NOT_APPLICABLE" }
      - { name: compliance_note, type: string, source: input, description: "Method of compliance", constraints: "nullable" }

  - name: PartsRequisition
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: part_number, type: string, source: input, description: "Free-text part number of the required part (shop stock, not catalog FK)" }
      - { name: quantity, type: integer, source: input, description: "Quantity required (> 0)" }
      - { name: requested_source, type: enum, source: input, description: "OEM | PMA", constraints: "OEM | PMA" }
      - { name: approved_source, type: enum, source: system, description: "OEM | PMA after approvals", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PMA_PENDING_CUSTOMER | APPROVED | SOURCE_REJECTED | PMA_REJECTED | RECEIVED | ISSUED" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Actual unit cost recorded at receive", constraints: "nullable" }
      - { name: extended_price_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_cost_cents * markup_pct, 0) computed at receive; markup tier keyed on unit_cost_cents" }

  - name: TestCell
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cell name; unique", constraints: "unique" }
      - { name: supported_ata_chapters, type: array, source: input, description: "ATA chapter strings this cell can test" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Test cell hourly rate" }

  - name: TestCellBooking
    parent: null
    common_fields: true
    fields:
      - { name: test_cell_id, type: string, source: input, description: "FK -> TestCell.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: start_time, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: end_time, type: datetime, source: input, description: "Window end (exclusive); half-open [start,end)" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED" }
      - { name: fee_cents, type: integer, source: computed, description: "round_half_up(duration_hours * cell.hourly_rate_cents, 0) at creation" }

  - name: ReleaseCertificate
    parent: null
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; at most one ISSUED certificate per work order", constraints: "unique per work_order_id" }
      - { name: cert_number, type: string, source: system, description: "Sequential 8130 number: '8130-<zero-padded sequence>'" }
      - { name: signed_by, type: string, source: system, description: "Inspector X-User-ID at release" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at release" }
      - { name: status, type: enum, source: system, description: "ISSUED (only value produced)" }

  - name: ExchangeAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: part_id, type: string, source: input, description: "FK -> PartCatalogEntry.id" }
      - { name: status, type: enum, source: system, description: "OPEN | FULFILLED | CLOSED | DEFAULTED" }
      - { name: pool_unit_id, type: string, source: system, description: "FK -> ComponentUnit.id; selector-chosen pool unit shipped to customer", constraints: "nullable" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Clock at fulfill", constraints: "nullable" }
      - { name: core_due_date, type: string, source: computed, description: "Calendar date fulfilled_at + CORE_RETURN_DAYS(15)", constraints: "nullable" }
      - { name: core_unit_id, type: string, source: system, description: "FK -> ComponentUnit.id; customer's returned core", constraints: "nullable" }
      - { name: core_received_at, type: datetime, source: system, description: "Clock at core-return", constraints: "nullable" }
      - { name: core_ber_flag, type: boolean, source: computed, default: false, description: "true when core teardown estimate >= ber threshold" }
      - { name: core_charge_cents, type: integer, source: computed, description: "0 NON_BER | 80% replacement BER | 100% replacement DEFAULTED" }
      - { name: late_fee_cents, type: integer, source: computed, description: "late_days * 50000, capped at replacement_value_cents - core_charge_cents (floor 0)" }
      - { name: admin_fee_cents, type: integer, source: computed, default: 25000, description: "Flat exchange administration fee" }
      - { name: settlement_total_cents, type: integer, source: computed, description: "admin_fee + core_charge + late_fee (pinned evaluation order)" }

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> ComponentUnit.id; leased shop unit" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Lease day rate" }
      - { name: start_date, type: string, source: input, description: "First billed day (inclusive, YYYY-MM-DD)" }
      - { name: end_date, type: string, source: input, description: "Last contracted day (inclusive); day-closed interval [start_date, end_date]" }
      - { name: returned_at, type: string, source: system, description: "Calendar date of return", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETURNED" }
      - { name: billed_days, type: integer, source: computed, description: "Inclusive day count start_date..min(return_date, end_date)" }
      - { name: overage_days, type: integer, source: computed, description: "max(0, return_date - end_date) in whole days" }
      - { name: total_charge_cents, type: integer, source: computed, description: "billed_days*daily_rate + round_half_up(overage_days*daily_rate*1.5, 0)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; set from X-User-ID" }
      - { name: original_work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the closed overhaul being claimed against" }
      - { name: unit_id, type: string, source: system, description: "ComponentUnit id copied from original work order (plain reference)" }
      - { name: claim_cycles_used, type: integer, source: input, description: "Cycles accumulated since the warranted overhaul" }
      - { name: claim_months_used, type: integer, source: input, description: "Months since the warranted release" }
      - { name: failure_description, type: string, source: input, description: "Claimed defect" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | DENIED | SETTLED" }
      - { name: credit_variant, type: enum, source: system, description: "FULL when claim_cycles_used*2 <= warranty_cycle_limit else PRORATED", constraints: "FULL | PRORATED | null" }
      - { name: credit_cents, type: integer, source: computed, description: "FULL: original invoice labor+parts; PRORATED: that amount * remaining_cycles/warranty_cycle_limit" }
      - { name: rework_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; auto-created on ACCEPT", constraints: "nullable" }
      - { name: denial_reason, type: string, source: input, description: "Required when decision=DENY", constraints: "nullable" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: system, description: "WORK_ORDER | EXCHANGE | LEASE", constraints: "WORK_ORDER | EXCHANGE | LEASE" }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; when source_type=WORK_ORDER (unique)", constraints: "nullable" }
      - { name: exchange_agreement_id, type: string, source: system, description: "FK -> ExchangeAgreement.id; when source_type=EXCHANGE", constraints: "nullable" }
      - { name: lease_agreement_id, type: string, source: system, description: "FK -> LeaseAgreement.id; when source_type=LEASE", constraints: "nullable" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; billed customer" }
      - { name: labor_cents, type: integer, source: computed, default: 0, description: "Labor line (work-order invoices)" }
      - { name: parts_cents, type: integer, source: computed, default: 0, description: "Sum of per-requisition rounded extended prices" }
      - { name: test_fee_cents, type: integer, source: computed, default: 0, description: "Sum of per-booking rounded cell fees" }
      - { name: penalty_credit_cents, type: integer, source: computed, default: 0, description: "TAT penalty credit reducing the invoice (>= 0)" }
      - { name: other_charge_cents, type: integer, source: computed, default: 0, description: "Exchange settlement / lease charge on non-work-order invoices" }
      - { name: total_cents, type: integer, source: computed, description: "WORK_ORDER: max(0, labor+parts+test_fee - penalty_credit - warranty_credit); EXCHANGE: settlement_total_cents; LEASE: total_charge_cents" }
      - { name: warranty_credit_applied_cents, type: integer, source: computed, default: 0, description: "Claim credit applied when work_scope=WARRANTY_REWORK" }
      - { name: penalty_variant, type: enum, source: system, description: "ADJUSTED | CALENDAR | NONE (non-STANDARD scopes)", constraints: "ADJUSTED | CALENDAR | NONE" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID" }
      - { name: issued_at, type: datetime, source: system, description: "Clock at issuance" }
      - { name: paid_at, type: datetime, source: system, description: "Clock at payment", constraints: "nullable" }

  - name: TraceabilityRecord
    parent: null
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ComponentUnit.id" }
      - { name: event_type, type: enum, source: system, description: "BIRTH | INDUCT | DISPOSITION | RELEASE_OVERHAUL | RELEASE_REPAIR | SCRAP | EXCHANGE_OUT | CORE_IN | LEASE_OUT | LEASE_RETURN | WARRANTY_INDUCT", constraints: "enum as listed" }
      - { name: event_at, type: datetime, source: system, description: "Logical clock when the event was recorded" }
      - { name: work_order_id, type: string, source: system, description: "Originating work order when applicable (plain reference)", constraints: "nullable" }
      - { name: notes, type: string, source: system, description: "Event detail (e.g. cert number, agreement id)", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: TEARDOWN_IN_PROGRESS
    terminal_states: [CLOSED, CANCELLED, BER_SCRAPPED]
    note: "Manual creation starts in TEARDOWN_IN_PROGRESS; warranty-claim acceptance creates the rework WorkOrder directly in REPAIR_IN_PROGRESS."
    transitions:
      - from: TEARDOWN_IN_PROGRESS
        to: AWAITING_QUOTE
        trigger: "POST /mro/work-orders/{workOrderId}/teardown-complete"
        actor: Technician
        preconditions:
          - "WorkOrder.status == TEARDOWN_IN_PROGRESS (ERR_WORK_ORDER_INVALID_STATE)"
          - "No DiscrepancyCard of this work order in status OPEN (ERR_OPEN_DISCREPANCIES)"
        side_effects: []
      - from: AWAITING_QUOTE
        to: QUOTE_SUBMITTED
        trigger: "POST /mro/work-orders/{workOrderId}/quote"
        actor: CustomerServiceRep
        preconditions:
          - "WorkOrder.status == AWAITING_QUOTE (ERR_WORK_ORDER_INVALID_STATE)"
          - "If ber_flag (recomputed from submitted estimates) is true, payload scrap_option_ack must be true (ERR_BER_SCRAP_ACK_REQUIRED — business_safety)"
          - "Customer.credit_hold must be false (ERR_CUSTOMER_CREDIT_HOLD — business_fiscal; checked after the safety check)"
        side_effects:
          - "quote_submitted_at = current clock; promised_return_at = received_at + customer.contract_tat_hours"
          - "labor_charge_cents = labor_estimate_cents; ber_flag recomputed and stored"
          - "increments WorkOrder.version by 1"
      - from: QUOTE_SUBMITTED
        to: QUOTE_SUBMITTED
        trigger: "POST /mro/work-orders/{workOrderId}/quote"
        actor: CustomerServiceRep
        preconditions:
          - "Same checks as AWAITING_QUOTE -> QUOTE_SUBMITTED (re-quote supersedes the prior quote)"
        side_effects:
          - "quote_submitted_at = current clock; estimates, labor_charge_cents and ber_flag overwritten"
          - "increments WorkOrder.version by 1 (this is what invalidates a stale expected_work_order_version)"
        note: "Self-loop re-quote; drives the OCC rule on quote-approval."
      - from: QUOTE_SUBMITTED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /mro/work-orders/{workOrderId}/quote-approval"
        actor: Customer
        preconditions:
          - "X-User-ID == WorkOrder.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "expected_work_order_version == WorkOrder.version (ERR_STALE_VERSION, 412)"
          - "WorkOrder.status == QUOTE_SUBMITTED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "accumulated_delay_hours += (current clock - quote_submitted_at) in hours (2dp)"
          - "increments WorkOrder.version by 1"
      - from: QUOTE_SUBMITTED
        to: CANCELLED
        trigger: "POST /mro/work-orders/{workOrderId}/quote-decline with disposition=RETURN_UNREPAIRED"
        actor: Customer
        preconditions:
          - "X-User-ID == WorkOrder.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "WorkOrder.status == QUOTE_SUBMITTED (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "accumulated_delay_hours += (current clock - quote_submitted_at)"
          - "ComponentUnit.custody_status -> AWAITING_SHIPMENT (condition_status unchanged)"
      - from: QUOTE_SUBMITTED
        to: BER_SCRAPPED
        trigger: "POST /mro/work-orders/{workOrderId}/quote-decline with disposition=SCRAP"
        actor: Customer
        preconditions:
          - "X-User-ID == WorkOrder.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "WorkOrder.status == QUOTE_SUBMITTED (ERR_WORK_ORDER_INVALID_STATE)"
          - "WorkOrder.ber_flag == true (ERR_SCRAP_REQUIRES_BER)"
        side_effects:
          - "CASCADE hop 1 (caused by this transition): ComponentUnit.condition_status -> SCRAPPED, custody_status -> AWAITING_SHIPMENT"
          - "CASCADE hop 2 (caused by hop 1): TraceabilityRecord event_type=SCRAP appended for the unit"
          - "accumulated_delay_hours += (current clock - quote_submitted_at)"
      - from: REPAIR_IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "system (automatic when POST /mro/work-orders/{id}/parts-requisitions creates a requisition while status == REPAIR_IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Creation while already AWAITING_PARTS keeps status AWAITING_PARTS."
      - from: AWAITING_PARTS
        to: REPAIR_IN_PROGRESS
        trigger: "system (automatic when the last requisition of this work order leaves the active set {REQUESTED, PMA_PENDING_CUSTOMER, APPROVED, RECEIVED} via issue)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Rejected requisitions (SOURCE_REJECTED, PMA_REJECTED) do not block; only the active set gates."
      - from: REPAIR_IN_PROGRESS
        to: READY_FOR_TEST
        trigger: "POST /mro/work-orders/{workOrderId}/complete-repair"
        actor: Technician
        preconditions:
          - "WorkOrder.status == REPAIR_IN_PROGRESS (ERR_WORK_ORDER_INVALID_STATE)"
          - "business_safety: every DirectiveCompliance of this work order with mandatory == true is COMPLIED or NOT_APPLICABLE (ERR_AD_COMPLIANCE_INCOMPLETE)"
          - "business_constraint: no DiscrepancyCard of this work order in status OPEN (ERR_OPEN_DISCREPANCIES)"
        side_effects:
          - "All DISPOSITIONED DiscrepancyCards of this work order -> CLOSED"
          - "technician_user_id = X-User-ID"
          - "increments WorkOrder.version by 1"
      - from: READY_FOR_TEST
        to: TEST_PASSED
        trigger: "POST /mro/work-orders/{workOrderId}/test-results with result=PASS"
        actor: Inspector
        preconditions:
          - "WorkOrder.status == READY_FOR_TEST (ERR_WORK_ORDER_INVALID_STATE)"
          - "business_safety: X-User-ID != WorkOrder.technician_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "business_temporal: exists TestCellBooking for this work order with status BOOKED and start_time <= current clock < end_time (ERR_NO_ACTIVE_TEST_BOOKING)"
        side_effects:
          - "test_attempt_count += 1; the covering booking -> COMPLETED"
          - "If work_scope in {OVERHAUL, WARRANTY_REWORK}: ComponentUnit.cycles_since_overhaul = 0"
      - from: READY_FOR_TEST
        to: REPAIR_IN_PROGRESS
        trigger: "POST /mro/work-orders/{workOrderId}/test-results with result=FAIL"
        actor: Inspector
        preconditions:
          - "WorkOrder.status == READY_FOR_TEST (ERR_WORK_ORDER_INVALID_STATE)"
          - "business_safety: X-User-ID != WorkOrder.technician_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "business_temporal: covering BOOKED booking exists (ERR_NO_ACTIVE_TEST_BOOKING)"
        side_effects:
          - "test_attempt_count += 1; the covering booking -> COMPLETED (slot consumed; retest needs a new booking)"
          - "CASCADE hop 1 (caused by FAIL): a new DiscrepancyCard is created with status OPEN, finding_text 'ATP FAILURE: <atp_reference>', severity MAJOR"
          - "CASCADE hop 2 (caused by hop 1): WorkOrder.open_discrepancy_count += 1"
        note: "Retest cycle READY_FOR_TEST -> REPAIR_IN_PROGRESS -> READY_FOR_TEST -> TEST_PASSED (cyclic shape)."
      - from: TEST_PASSED
        to: RELEASED
        trigger: "POST /mro/work-orders/{workOrderId}/release"
        actor: Inspector
        preconditions:
          - "WorkOrder.status == TEST_PASSED (ERR_WORK_ORDER_INVALID_STATE — checked before safety)"
          - "business_safety: X-User-ID != WorkOrder.technician_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "business_constraint: no ReleaseCertificate already exists for this work order (ERR_INVALID_STATE on re-entry is unreachable because state check fires first; uniqueness enforced at write)"
        side_effects:
          - "ReleaseCertificate created (cert_number sequential, signed_by = X-User-ID, status ISSUED)"
          - "released_at = current clock; inspector_user_id = X-User-ID"
          - "ComponentUnit.condition_status -> SERVICEABLE; custody_status -> AWAITING_SHIPMENT (or IN_POOL when ownership == SHOP)"
          - "TraceabilityRecord RELEASE_OVERHAUL (work_scope OVERHAUL/WARRANTY_REWORK) or RELEASE_REPAIR appended"
          - "increments WorkOrder.version by 1"
      - from: RELEASED
        to: CLOSED
        trigger: "POST /mro/work-orders/{workOrderId}/close"
        actor: CustomerServiceRep
        preconditions:
          - "WorkOrder.status == RELEASED (ERR_WORK_ORDER_INVALID_STATE)"
          - "An Invoice with source_type=WORK_ORDER exists for this work order (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "ComponentUnit.custody_status -> SHIPPED (ownership CUSTOMER) or stays IN_POOL (ownership SHOP)"
          - "If this work order is a warranty rework (work_scope == WARRANTY_REWORK): the WarrantyClaim with rework_work_order_id == this id transitions ACCEPTED -> SETTLED (bubble-up)"

  - entity: ComponentUnit
    initial_state: "condition_status=(as registered), custody_status=(as registered)"
    terminal_states: ["condition_status=SCRAPPED"]
    note: "Two parallel state dimensions evolve on the same row; custody transitions never reset condition and vice versa."
    transitions:
      - from: "custody OFF_SITE"
        to: "custody IN_SHOP"
        trigger: "POST /mro/work-orders (induction)"
        actor: system
        preconditions: []
        side_effects: ["TraceabilityRecord INDUCT appended"]
      - from: "custody IN_SHOP"
        to: "custody AWAITING_SHIPMENT"
        trigger: "WorkOrder release (ownership CUSTOMER)"
        actor: system
        preconditions: []
        side_effects: ["condition_status -> SERVICEABLE"]
      - from: "custody AWAITING_SHIPMENT"
        to: "custody SHIPPED"
        trigger: "WorkOrder close"
        actor: system
        preconditions: []
        side_effects: []
      - from: "custody IN_POOL"
        to: "custody SHIPPED"
        trigger: "ExchangeAgreement fulfill (pool unit leaves on exchange)"
        actor: system
        preconditions: []
        side_effects: ["TraceabilityRecord EXCHANGE_OUT appended"]
      - from: "custody OFF_SITE (customer core)"
        to: "custody IN_POOL"
        trigger: "ExchangeAgreement core-return with NON_BER core"
        actor: system
        preconditions: []
        side_effects: ["ownership CUSTOMER -> SHOP", "condition_status UNSERVICEABLE -> SERVICEABLE", "TraceabilityRecord CORE_IN appended"]
      - from: "custody OFF_SITE (customer core)"
        to: "custody IN_SHOP"
        trigger: "ExchangeAgreement core-return with BER core"
        actor: system
        preconditions: []
        side_effects: ["ownership CUSTOMER -> SHOP", "TraceabilityRecord CORE_IN appended"]
      - from: "custody IN_POOL or ON_LEASE"
        to: "custody ON_LEASE"
        trigger: "POST /mro/lease-agreements"
        actor: system
        preconditions: []
        side_effects: ["TraceabilityRecord LEASE_OUT appended", "increments ComponentUnit.version by 1 (OCC anchor)"]
      - from: "custody ON_LEASE"
        to: "custody IN_POOL"
        trigger: "POST /mro/lease-agreements/{id}/return"
        actor: system
        preconditions: []
        side_effects: ["TraceabilityRecord LEASE_RETURN appended"]
      - from: "condition SERVICEABLE or UNSERVICEABLE"
        to: "condition SCRAPPED"
        trigger: "WorkOrder BER scrap path"
        actor: system
        preconditions: []
        side_effects: ["TraceabilityRecord SCRAP appended"]

  - entity: DiscrepancyCard
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISPOSITIONED
        trigger: "POST /mro/discrepancies/{discrepancyId}/disposition"
        actor: Technician
        preconditions:
          - "DiscrepancyCard.status == OPEN (ERR_DISCREPANCY_INVALID_STATE)"
        side_effects: ["disposition_text stored", "WorkOrder.open_discrepancy_count -= 1"]
      - from: DISPOSITIONED
        to: CLOSED
        trigger: "system (automatic on WorkOrder complete-repair)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DirectiveCompliance
    initial_state: PENDING
    terminal_states: [COMPLIED, NOT_APPLICABLE]
    transitions:
      - from: PENDING
        to: COMPLIED
        trigger: "POST /mro/work-orders/{workOrderId}/directive-compliance with result=COMPLIED"
        actor: Technician
        preconditions:
          - "DirectiveCompliance.status == PENDING (ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: NOT_APPLICABLE
        trigger: "POST /mro/work-orders/{workOrderId}/directive-compliance with result=NOT_APPLICABLE"
        actor: Technician
        preconditions:
          - "DirectiveCompliance.status == PENDING (ERR_INVALID_STATE)"
        side_effects: []

  - entity: PartsRequisition
    initial_state: "REQUESTED (requested_source=OEM) | PMA_PENDING_CUSTOMER (requested_source=PMA)"
    terminal_states: [ISSUED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/source-approval with approved=true"
        actor: PartsBuyer
        preconditions:
          - "status in {REQUESTED, SOURCE_REJECTED} (ERR_REQUISITION_INVALID_STATE)"
        side_effects: ["approved_source = OEM (or source_override when re-approving a rejected PMA request)"]
        note: "SOURCE_REJECTED -> APPROVED re-approval closes the reject/resubmit cycle."
      - from: REQUESTED
        to: SOURCE_REJECTED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/source-approval with approved=false"
        actor: PartsBuyer
        preconditions:
          - "status in {REQUESTED, SOURCE_REJECTED} (ERR_REQUISITION_INVALID_STATE)"
        side_effects: []
      - from: PMA_PENDING_CUSTOMER
        to: APPROVED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/pma-approval with approved=true"
        actor: Customer
        preconditions:
          - "status == PMA_PENDING_CUSTOMER (ERR_REQUISITION_INVALID_STATE)"
          - "X-User-ID == work order's customer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["approved_source = PMA"]
      - from: PMA_PENDING_CUSTOMER
        to: PMA_REJECTED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/pma-approval with approved=false"
        actor: Customer
        preconditions:
          - "status == PMA_PENDING_CUSTOMER (ERR_REQUISITION_INVALID_STATE)"
          - "X-User-ID == work order's customer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: PMA_REJECTED
        to: APPROVED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/source-approval with approved=true and source_override=OEM"
        actor: PartsBuyer
        preconditions:
          - "status == PMA_REJECTED (ERR_REQUISITION_INVALID_STATE)"
          - "source_override must be OEM (ERR_INVALID_REQUEST)"
        side_effects: ["approved_source = OEM"]
        note: "Fork-join: PMA branch requires the customer gate; OEM fallback rejoins at APPROVED."
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/receive"
        actor: PartsBuyer
        preconditions:
          - "status == APPROVED (ERR_REQUISITION_INVALID_STATE)"
        side_effects: ["unit_cost_cents stored; extended_price_cents computed with markup tier (per-line rounding)"]
      - from: RECEIVED
        to: ISSUED
        trigger: "POST /mro/parts-requisitions/{requisitionId}/issue"
        actor: Technician
        preconditions:
          - "status == RECEIVED (ERR_REQUISITION_INVALID_STATE)"
          - "WorkOrder.status in {REPAIR_IN_PROGRESS, AWAITING_PARTS} (ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "WorkOrder.parts_charge_cents += extended_price_cents (ledger sync)"
          - "If WorkOrder.status == AWAITING_PARTS and no requisition remains in {REQUESTED, PMA_PENDING_CUSTOMER, APPROVED, RECEIVED}: WorkOrder -> REPAIR_IN_PROGRESS (bubble-up)"

  - entity: TestCellBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /mro/test-cell-bookings/{bookingId}/cancel"
        actor: CustomerServiceRep
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects: []
      - from: BOOKED
        to: COMPLETED
        trigger: "system (automatic when test-results is recorded against the booking's work order inside the booking window)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExchangeAgreement
    initial_state: OPEN
    terminal_states: [CLOSED, DEFAULTED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "POST /mro/exchange-agreements/{agreementId}/fulfill"
        actor: CustomerServiceRep
        preconditions:
          - "status == OPEN (ERR_EXCHANGE_INVALID_STATE)"
          - "business_fiscal: Customer.credit_hold == false (ERR_CUSTOMER_CREDIT_HOLD)"
          - "Selector (pool_unit_selector): eligibility ComponentUnit with part_id == agreement.part_id AND ownership == SHOP AND custody_status == IN_POOL AND condition_status == SERVICEABLE; ranking cycles_since_overhaul ASC; tie-break created_at ASC; empty set -> ERR_POOL_EMPTY"
        side_effects:
          - "pool_unit_id = selected unit; fulfilled_at = clock; core_due_date = date(fulfilled_at) + 15 days"
          - "Selected ComponentUnit.custody_status IN_POOL -> SHIPPED; TraceabilityRecord EXCHANGE_OUT appended"
      - from: FULFILLED
        to: CLOSED
        trigger: "POST /mro/exchange-agreements/{agreementId}/core-return"
        actor: Technician
        preconditions:
          - "status == FULFILLED (ERR_EXCHANGE_INVALID_STATE)"
          - "core unit's part_id == agreement.part_id (ERR_CORE_PART_MISMATCH)"
          - "core unit ownership == CUSTOMER and owner_customer_id == agreement.customer_id (ERR_UNIT_OWNER_MISMATCH)"
        side_effects:
          - "CASCADE hop 1 (direct): core unit inducted — ownership CUSTOMER -> SHOP; custody_status -> IN_POOL (NON_BER) or IN_SHOP (BER); condition_status -> SERVICEABLE (NON_BER) or stays UNSERVICEABLE (BER); TraceabilityRecord CORE_IN appended"
          - "CASCADE hop 2 (caused by hop 1's induction evaluation): core BER determination and settlement computed in pinned order, then Invoice(source_type=EXCHANGE, total=settlement_total_cents) created with status ISSUED"
          - "CASCADE hop 3 (caused by hop 2): Customer.current_exposure_cents += settlement_total_cents (credit_hold re-derived)"
          - "CASCADE hop 4 (caused by hop 3): this agreement -> CLOSED"
      - from: FULFILLED
        to: DEFAULTED
        trigger: "system (POST /mro/_clock/set_current_utc sweep: FULFILLED and core_due_date + 5 grace days < current date)"
        actor: system
        preconditions: []
        side_effects:
          - "core_charge_cents = 100% of replacement_value_cents; late_fee capped to 0 (replacement - core_charge); settlement_total = 25000 + replacement_value_cents"
          - "Invoice(source_type=EXCHANGE) created ISSUED; Customer.current_exposure_cents += settlement_total_cents"
          - "pool unit ownership SHOP -> CUSTOMER (customer keeps the pool unit)"

  - entity: LeaseAgreement
    initial_state: ACTIVE
    terminal_states: [RETURNED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /mro/lease-agreements/{agreementId}/return"
        actor: CustomerServiceRep
        preconditions:
          - "status == ACTIVE (ERR_LEASE_INVALID_STATE)"
          - "current date >= start_date (ERR_LEASE_INVALID_STATE)"
        side_effects:
          - "returned_at = current date; billed_days / overage_days / total_charge_cents computed"
          - "ComponentUnit.custody_status ON_LEASE -> IN_POOL; TraceabilityRecord LEASE_RETURN appended"
          - "Invoice(source_type=LEASE, total=total_charge_cents) created ISSUED; Customer.current_exposure_cents += total_charge_cents"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mro/warranty-claims/{claimId}/review with decision=ACCEPT"
        actor: ShopManager
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "credit_variant and credit_cents computed (FULL | PRORATED)"
          - "CASCADE hop 1 (direct): this claim -> ACCEPTED"
          - "CASCADE hop 2 (caused by hop 1): rework WorkOrder auto-created (customer_id = claimant, unit_id = claim.unit_id, work_scope = WARRANTY_REWORK, labor_estimate_cents = original labor, status starts at REPAIR_IN_PROGRESS)"
          - "CASCADE hop 3 (caused by hop 2's induction): ComponentUnit custody_status -> IN_SHOP, condition_status -> UNSERVICEABLE; TraceabilityRecord WARRANTY_INDUCT appended"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mro/warranty-claims/{claimId}/review with decision=DENY"
        actor: ShopManager
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "denial_reason present (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "system (automatic when the rework WorkOrder transitions RELEASED -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /mro/invoices/{invoiceId}/pay"
        actor: Customer
        preconditions:
          - "X-User-ID == Invoice.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "status == ISSUED (ERR_INVOICE_INVALID_STATE)"
          - "amount_cents == total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_at = clock; Customer.current_exposure_cents -= total_cents (compensating action)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-approval-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /mro/work-orders/{workOrderId}/quote-approval"
    occ_field: expected_work_order_version
    description: |
      Approving a quote against a WorkOrder whose version has advanced since the
      customer last observed it (e.g. a re-quote superseded the quoted amounts)
      is rejected. Approval of the superseded quote would otherwise succeed
      because the work order is still in QUOTE_SUBMITTED.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lease-create-stale-unit
    parent_entity: ComponentUnit
    write_endpoint: "POST /mro/lease-agreements"
    occ_field: expected_unit_version
    description: |
      Creating a LeaseAgreement against a ComponentUnit whose version has
      advanced since the client last observed it is rejected. A prior lease
      creation legitimately moved the unit to ON_LEASE and forward-dated
      non-overlapping leases remain legal, so no state precondition catches the
      stale writer — only the version check does.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tat_penalty_calc
    trigger: "POST /mro/work-orders/{workOrderId}/invoice (work-order invoice generation)"
    algorithm: threshold
    formula: |
      elapsed_hours   = (released_at - received_at) in hours, 2dp
      delay_hours     = accumulated_delay_hours          # approved/declined quote windows
      adjusted_hours  = elapsed_hours - delay_hours      # ADJUSTED variant only
      excess_hours    = max(0, basis_hours - customer.contract_tat_hours)
      raw_penalty     = excess_hours * customer.tat_penalty_rate_cents_per_hour
      cap_cents       = round_half_up(customer.tat_penalty_cap_pct/100 * (labor_cents + parts_cents + test_fee_cents), 0)
      penalty_credit_cents = min(raw_penalty, cap_cents) # cap applied LAST, after raw penalty
      work_scope WARRANTY_REWORK: penalty_credit_cents = 0 (penalty_variant NONE)
    input_set: "WorkOrder in RELEASED with released_at set; customer contract fields; invoice line subtotal"
    constants:
      ROUNDING: round_half_up
    precision: "hours at 2 decimal places; money integer cents, round_half_up"
    variants:
      - name: ADJUSTED
        when: "customer.penalty_delay_rule == ADJUSTED"
        difference: "basis_hours = elapsed_hours - accumulated_delay_hours (customer delay excluded)"
      - name: CALENDAR
        when: "customer.penalty_delay_rule == CALENDAR"
        difference: "basis_hours = elapsed_hours (delay NOT excluded) — larger penalty for identical timestamps"

  - name: invoice_total_calc
    trigger: "POST /mro/work-orders/{workOrderId}/invoice"
    algorithm: aggregation
    formula: |
      parts_cents   = SUM over ISSUED requisitions of round_half_up(quantity*unit_cost_cents*markup_pct, 0)
                      # PER-LINE rounding pinned: each requisition rounded to whole cents BEFORE summing.
                      # (sum-then-round would produce a different cent total and is FORBIDDEN)
      test_fee_cents = SUM over COMPLETED bookings of this WO of round_half_up(duration_hours*hourly_rate, 0)
                      # same pinned per-line order
      labor_cents    = work_order.labor_charge_cents
      STANDARD scope:      total = max(0, labor + parts + test_fee - tat_penalty_credit)
      WARRANTY_REWORK:     total = max(0, labor + parts + test_fee - warranty_credit_applied_cents)
      penalty_credit / warranty_credit are computed AFTER the per-line sums (evaluation order pinned)
    input_set: "WorkOrder RELEASED; requisitions status ISSUED; bookings status COMPLETED; claim credit if WARRANTY_REWORK"
    constants:
      MARKUP_TIER1_MAX_CENTS: 100000   # unit_cost <= 100000 -> markup 25%
      MARKUP_TIER2_MAX_CENTS: 1000000  # unit_cost <= 1000000 -> markup 15%
      MARKUP_TIER1_PCT: 1.25
      MARKUP_TIER2_PCT: 1.15
      MARKUP_TIER3_PCT: 1.10           # unit_cost > 1000000
    precision: "integer cents; round_half_up per line before summation"
    variants:
      - name: per_line_rounding
        when: "always (pinned)"
        difference: "round each line then sum — diverges by cents from sum-then-round on fractional markups"

  - name: exchange_settlement_calc
    trigger: "ExchangeAgreement core-return (CLOSED) or clock-sweep default (DEFAULTED)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency resolved by PINNED evaluation order (1)->(5):
      (1) core_status: MISSING_DEFAULTED (sweep) | BER | NON_BER
      (2) core_charge_cents: NON_BER -> 0; BER -> round_half_up(0.80 * replacement_value_cents, 0);
          MISSING_DEFAULTED -> replacement_value_cents
      (3) late_days: CLOSED path -> whole days between core_due_date and return date, min 0;
          DEFAULTED path -> 5 (grace days elapsed at sweep)
      (4) late_fee_cents = min(late_days * LATE_FEE_PER_DAY_CENTS,
                               max(0, replacement_value_cents - core_charge_cents))
          # cap references core_charge from step (2): evaluation order is what makes this well-defined
      (5) settlement_total_cents = ADMIN_FEE_CENTS + core_charge_cents + late_fee_cents
    input_set: "ExchangeAgreement FULFILLED; PartCatalogEntry.replacement_value_cents / ber_threshold_pct; core teardown estimate"
    constants:
      ADMIN_FEE_CENTS: 25000
      CORE_RETURN_DAYS: 15
      CORE_GRACE_DAYS: 5
      LATE_FEE_PER_DAY_CENTS: 50000
      BER_CORE_CHARGE_PCT: 0.80
    precision: "integer cents, round_half_up"

  - name: warranty_credit_calc
    trigger: "POST /mro/warranty-claims/{claimId}/review with decision=ACCEPT"
    algorithm: weighted_scoring
    formula: |
      eligibility gate (create time): claim_cycles_used <= warranty_cycle_limit
                                      AND claim_months_used <= warranty_month_limit   # both inclusive
      base = original work-order invoice.labor_cents + invoice.parts_cents
      variant FULL:     claim_cycles_used * 2 <= warranty_cycle_limit  -> credit_cents = base
      variant PRORATED: otherwise -> remaining = max(0, warranty_cycle_limit - claim_cycles_used)
                        credit_cents = round_half_up(base * remaining / warranty_cycle_limit, 0)
    input_set: "WarrantyClaim SUBMITTED; original WorkOrder CLOSED with its Invoice; PartCatalogEntry warranty limits"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: FULL
        when: "claim_cycles_used <= half the cycle limit"
        difference: "full labor+parts credit — identical claim data under the other policy would pay strictly less"
      - name: PRORATED
        when: "claim_cycles_used > half the cycle limit"
        difference: "credit scaled by remaining-cycle fraction"

  - name: ber_evaluation_calc
    trigger: "POST /mro/work-orders/{id}/quote (work-order BER) and core-return (core BER)"
    algorithm: threshold
    formula: |
      ber_threshold_cents = round_half_up(part.ber_threshold_pct/100 * part.replacement_value_cents, 0)
      Work order: ber_flag = (labor_estimate_cents + parts_estimate_cents) >= ber_threshold_cents
      Core:         core_ber_flag = core_teardown_estimate_cents >= ber_threshold_cents
      # INCLUSIVE boundary: estimate exactly equal to the threshold IS beyond-economic-repair
    input_set: "quote estimates or core teardown estimate; catalog threshold and replacement value"
    constants:
      DEFAULT_BER_THRESHOLD_PCT: 65
    precision: "integer cents"

  - name: lease_accrual_calc
    trigger: "POST /mro/lease-agreements/{id}/return"
    algorithm: chronological
    formula: |
      billed_days   = inclusive day count from start_date to min(return_date, end_date)
      overage_days  = max(0, return_date - end_date) in whole days
      base_charge   = billed_days * daily_rate_cents
      overage_charge = round_half_up(overage_days * daily_rate_cents * 1.5, 0)
      total_charge_cents = base_charge + overage_charge
      # return exactly on end_date -> overage_days = 0 (boundary: no overage)
    input_set: "LeaseAgreement ACTIVE; return date from logical clock"
    constants:
      OVERAGE_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up"

  - name: pool_unit_selector
    trigger: "POST /mro/exchange-agreements/{id}/fulfill"
    algorithm: constraint_propagation
    formula: |
      eligibility: ComponentUnit where part_id == agreement.part_id
                   AND ownership == 'SHOP' AND custody_status == 'IN_POOL'
                   AND condition_status == 'SERVICEABLE'
      ranking: cycles_since_overhaul ASC; tie-break: created_at ASC (never id)
      fallback: eligible set empty -> reject with ERR_POOL_EMPTY (no deferred queue)
    input_set: "all ComponentUnit rows for the agreement's part"
    constants: {}
    precision: "n/a"

  - name: credit_exposure_calc
    trigger: "Invoice ISSUED (+total_cents) and Invoice PAID (-total_cents)"
    algorithm: aggregation
    formula: |
      customer.current_exposure_cents += invoice.total_cents on ISSUED
      customer.current_exposure_cents -= invoice.total_cents on PAID
      credit_hold = (current_exposure_cents >= credit_limit_cents)   # INCLUSIVE boundary
      Invariant: current_exposure_cents == SUM(total_cents of customer invoices with status ISSUED)
    input_set: "all invoices of the customer with status ISSUED"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body reference ids (customer_id, unit_id, part_id, core_unit_id, original_work_order_id, work_order_id on bookings) exist, path validated left-to-right; specific ids ERR_CUSTOMER_NOT_FOUND / ERR_PART_NOT_FOUND / ERR_UNIT_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_REQUISITION_NOT_FOUND / ERR_TEST_CELL_NOT_FOUND / ERR_EXCHANGE_NOT_FOUND / ERR_LEASE_NOT_FOUND per resource family, else ERR_NOT_FOUND", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: existence, check: "OCC: expected_<parent>_version == current parent version (before any business logic)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /mro/work-orders/{id}/quote-approval; POST /mro/lease-agreements" }
  - { priority: 5, category: state, check: "Target resource in a from-state of the attempted transition", error_id: "ERR_WORK_ORDER_INVALID_STATE | ERR_REQUISITION_INVALID_STATE | ERR_EXCHANGE_INVALID_STATE | ERR_LEASE_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_DISCREPANCY_INVALID_STATE | ERR_INVALID_STATE", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5.5, category: state, check: "POST /mro/work-orders: unit custody_status must be OFF_SITE (not already inducted/leased/pooled)", error_id: ERR_UNIT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /mro/work-orders" }
  - { priority: 5.6, category: business_constraint, check: "POST /mro/work-orders: work_scope WARRANTY_REWORK is system-reserved (only claim acceptance creates it)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /mro/work-orders" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: X-User-ID != WorkOrder.technician_user_id", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: "POST test-results; POST release" }
  - { priority: 7, category: business_safety, check: "All mandatory DirectiveCompliance records COMPLIED or NOT_APPLICABLE", error_id: ERR_AD_COMPLIANCE_INCOMPLETE, http_status: 403, applies_to: "POST complete-repair" }
  - { priority: 8, category: business_safety, check: "BER quote requires scrap_option_ack=true", error_id: ERR_BER_SCRAP_ACK_REQUIRED, http_status: 403, applies_to: "POST quote" }
  - { priority: 9, category: business_temporal, check: "Booking window does not overlap existing BOOKED window on same cell (half-open [start,end); adjacency allowed)", error_id: ERR_TEST_CELL_OVERLAP, http_status: 409, applies_to: "POST /mro/test-cells/{id}/bookings" }
  - { priority: 10, category: business_temporal, check: "Covering BOOKED booking exists for test-results (start <= clock < end)", error_id: ERR_NO_ACTIVE_TEST_BOOKING, http_status: 409, applies_to: "POST test-results" }
  - { priority: 11, category: business_temporal, check: "Lease day-closed interval [start_date,end_date] does not share any day with an ACTIVE lease on the same unit (shared boundary day IS a conflict)", error_id: ERR_LEASE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /mro/lease-agreements" }
  - { priority: 12, category: business_constraint, check: "Open discrepancy cards block teardown-complete / complete-repair", error_id: ERR_OPEN_DISCREPANCIES, http_status: 409, applies_to: "POST teardown-complete; POST complete-repair" }
  - { priority: 13, category: business_constraint, check: "Cell supports the work order's part ATA chapter", error_id: ERR_CELL_ATA_UNSUPPORTED, http_status: 422, applies_to: "POST /mro/test-cells/{id}/bookings" }
  - { priority: 14, category: business_constraint, check: "Lease unit: ownership SHOP, condition SERVICEABLE, custody in {IN_POOL, ON_LEASE}; end_date >= start_date", error_id: ERR_UNIT_NOT_LEASABLE, http_status: 422, applies_to: "POST /mro/lease-agreements" }
  - { priority: 15, category: business_constraint, check: "Exchange selector candidate set non-empty", error_id: ERR_POOL_EMPTY, http_status: 422, applies_to: "POST fulfill" }
  - { priority: 16, category: business_constraint, check: "Uniqueness: serial_number, certificate_number, part_number, cell name, one work-order invoice per WO, one certificate per WO", error_id: "ERR_DUPLICATE_SERIAL | ERR_INVALID_REQUEST | ERR_INVOICE_ALREADY_EXISTS", http_status: 409, applies_to: "create endpoints; POST invoice" }
  - { priority: 17, category: business_constraint, check: "Scrap decline requires ber_flag == true", error_id: ERR_SCRAP_REQUIRES_BER, http_status: 409, applies_to: "POST quote-decline" }
  - { priority: 18, category: business_referential, check: "Unit owner matches WO customer (CUSTOMER-owned units); core owner matches agreement customer", error_id: ERR_UNIT_OWNER_MISMATCH, http_status: 422, applies_to: "POST /mro/work-orders; POST core-return" }
  - { priority: 19, category: business_referential, check: "Core unit part matches agreement part", error_id: ERR_CORE_PART_MISMATCH, http_status: 422, applies_to: "POST core-return" }
  - { priority: 20, category: business_referential, check: "Acting customer owns the resource (WO quote decisions, PMA approval, warranty claim, invoice pay)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "Customer-role endpoints" }
  - { priority: 21, category: business_referential, check: "Warranty claim: original WO must be CLOSED", error_id: ERR_WARRANTY_REQUIRES_CLOSED_WO, http_status: 409, applies_to: "POST /mro/warranty-claims" }
  - { priority: 21.5, category: business_constraint, check: "Warranty claim: claim_cycles_used <= warranty_cycle_limit AND claim_months_used <= warranty_month_limit (inclusive)", error_id: ERR_WARRANTY_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /mro/warranty-claims" }
  - { priority: 22, category: business_fiscal, check: "Customer not on credit hold", error_id: ERR_CUSTOMER_CREDIT_HOLD, http_status: 402, applies_to: "POST quote; POST fulfill" }
  - { priority: 23, category: business_fiscal, check: "Payment amount equals invoice total exactly", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST pay" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
