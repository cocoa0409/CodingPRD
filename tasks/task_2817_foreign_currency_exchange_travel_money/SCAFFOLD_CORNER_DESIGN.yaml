            - "InventoryPlan.${plan_id}.computed_targets == [{ currency_code: VND, target_minor_units: 5000000 }]: raw = floor(500000 * 10 * 10000 / 10000) = 5000000, the EXOTIC cap is 5000000, the vault cap floor(20000000 * 2500 / 10000 * 250000000 / 1000000) = 1250000000 does not bind, and 5000000 is already a whole multiple of the 500000 largest note"
