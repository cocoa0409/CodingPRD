    side_effects: []

  # --- NationalCustomerAgreement ---
  - method: POST
    path: "/bottler/national-customer-agreements"
    description: "Draft an NCA"
    roles: [BrandOwnerAdmin]
    code: 201
    input: [brand_owner_id, nca_code, national_price_cents, effective_start, effective_end]
    output: NationalCustomerAgreement
    side_effects: []
  - method: GET
    path: "/bottler/national-customer-agreements/{id}"
    description: "Fetch one NCA"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: NationalCustomerAgreement
    side_effects: []
  - method: GET
    path: "/bottler/national-customer-agreements"
    description: "List NCAs, optionally by brand"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["brand_owner_id?", "limit?", "offset?"]
    output: NationalCustomerAgreement[]
