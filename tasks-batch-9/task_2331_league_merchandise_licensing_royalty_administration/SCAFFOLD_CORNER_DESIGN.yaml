          1000000, no closeout and no deductions. net_regular_total is the gross
          itself, the basis 1000000 lands in the first tier [0, 2000000) at
          1200 bps, and royalty_due_cents is exactly 120000. Using the
          category's base_royalty_rate_bps by accident happens to also give
          1200 bps here, so the instance additionally pins
