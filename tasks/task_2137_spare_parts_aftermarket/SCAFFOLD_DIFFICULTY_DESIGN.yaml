          - errors[ERR_FORECAST_INPUT_EMPTY]
        distinguishing_aspect: |
          A boundary on a DIFFERENT metric (a time window, not a score) reached through a
          DIFFERENT endpoint: a work order closed at exactly now - lookback_days sits on the
          excluded edge of the half-open window ( now - lookback_days , now ], so a 365-day
          WORK_ORDER_HISTORY forecast finds an empty input set and fails, while a 366-day
