# =============================================================================
# Task 1943 — Broker-Dealer Compliance & Representative Supervision
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1943. Broker-Dealer Compliance & Representative Supervision (independent broker-dealer):
  branch office inspection cycle & findings, supervisory system & designated principal review
  of correspondence, outside business activity & private securities transaction approval,
  customer complaint & disclosure event reporting, heightened supervision plan for statutorily
  disqualified reps, annual compliance meeting & attestation, written supervisory procedure
  updates, exam preparation & books/records

domain_name: broker-dealer-compliance
api_prefix: /   # flat topology: every entity is a top-level collection; FKs link peers

complexity_profile:
  primary_archetype: compliance_audit        # regulatory gates, SoD, immutable audit trail of decisions
  secondary_archetype: workflow_orchestration # review/decision pipelines with branching + cycles
  complexity_layers:
    - optimistic_concurrency      # OCC on RegisteredRepresentative.version and BranchOffice.version
    - cascading_side_effects      # SD-acknowledgement chain, finding->posture chain, terminate cascade
    - dual_variant_calculation    # provisional vs final (correspondence risk; complaint reserve)
    - rate_threshold_triggers     # reportability threshold, posture escalation threshold
  entity_topology: flat
  state_machine_shape: branching  # dominant shape; Finding and OBA machines are cyclic, Complaint is parallel
  relationship_patterns:
    - one_to_many          # branch->reps, rep->{oba, complaint, disclosure, plan, correspondence}, meeting->attestations
    - self_referential     # WSPDocument.supersedes_id
    - cross_aggregate      # attestation.rep_id + meeting_id; exam_request.branch_id
  role_model: segregation_of_duties  # analyst drafts/intakes; principal decides; same principal cannot resolve own escalation; WSP publisher != drafter
  consistency_model: immediate       # all mutations + cascades atomic in the request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat; FK annotations are canonical)
# =============================================================================
entities:
  - name: BranchOffice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch name" }
      - { name: region, type: string, source: input, description: "Geographic region code" }
      - { name: inspection_cycle_months, type: integer, source: input, default: 12, description: "Inspection cycle in months; cascade-accelerated to 6 when sd_rep_count crosses to >= 1 (sticky, never auto-reverts)" }
      - { name: open_findings_count, type: integer, source: computed, default: 0, description: "Findings of this branch's inspections with status in {OPEN, OVERDUE, REMEDIATION_SUBMITTED}" }
      - { name: high_severity_open_count, type: integer, source: computed, default: 0, description: "Findings with severity HIGH and status in {OPEN, OVERDUE, REMEDIATION_SUBMITTED} across all inspections of this branch" }
      - { name: sd_rep_count, type: integer, source: computed, default: 0, description: "Reps of this branch with is_statutorily_disqualified == true and status != TERMINATED" }
      - { name: posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | REMEDIATION_REQUIRED — derived per branch_posture_evaluation" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Weighted finding score per branch_risk_score" }
      - { name: next_inspection_due_date, type: string, source: computed, description: "YYYY-MM-DD or null; base date + inspection_cycle_months, per branch_inspection_due_date" }

  - name: RegisteredRepresentative
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> BranchOffice.id; assigned branch" }
      - { name: crd_number, type: string, source: input, description: "CRD number; unique across the firm" }
      - { name: full_name, type: string, source: input, description: "Representative full name" }
      - { name: hire_date, type: string, source: input, description: "Hire date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED (initial ACTIVE)" }
      - { name: is_statutorily_disqualified, type: boolean, source: computed, default: false, description: "Set true when a SD-trigger DisclosureEvent is acknowledged; never auto-reverts" }
      - { name: supervision_tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | HEIGHTENED — HEIGHTENED iff is_statutorily_disqualified" }
      - { name: compliance_flag_count, type: integer, source: computed, default: 0, description: "Count of the rep's CorrespondenceItems in FLAGGED status" }
      - { name: active_approved_activity_count, type: integer, source: computed, default: 0, description: "Count of the rep's OutsideActivityRequests in {APPROVED, APPROVED_WITH_CONDITIONS}" }
      - { name: pst_fee_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-approval rounded PST supervisory fees, per pst_supervisory_fee_accrual" }

  - name: BranchInspection
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> BranchOffice.id; inspected branch" }
      - { name: scheduled_date, type: string, source: input, description: "Scheduled date YYYY-MM-DD; cascade-rescheduled on cycle acceleration" }
      - { name: started_at, type: datetime, source: system, description: "Set when inspection enters IN_PROGRESS" }
      - { name: completed_date, type: string, source: system, description: "Set when inspection reaches CLOSED" }
      - { name: open_findings_count, type: integer, source: computed, default: 0, description: "Findings of this inspection in {OPEN, OVERDUE, REMEDIATION_SUBMITTED}" }
      - { name: high_severity_open_count, type: integer, source: computed, default: 0, description: "Findings of this inspection with severity HIGH in {OPEN, OVERDUE, REMEDIATION_SUBMITTED}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | AWAITING_REMEDIATION | CLOSED" }

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> BranchInspection.id; parent inspection" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: description, type: string, source: input, description: "Finding text" }
      - { name: due_date, type: string, source: input, description: "Remediation due date YYYY-MM-DD" }
      - { name: remediation_note, type: string, source: input, description: "Set by remediate action; null until then" }
      - { name: adjudication_note, type: string, source: input, description: "Set by adjudicate action; null until then" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Increments on each REOPEN adjudication" }
      - { name: verified_by, type: string, source: system, description: "Opaque principal id that verified closure; null until then" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | REMEDIATION_SUBMITTED | VERIFIED_CLOSED" }

  - name: CorrespondenceItem
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> RegisteredRepresentative.id; authoring rep" }
      - { name: channel, type: enum, source: input, description: "EMAIL | SMS | SOCIAL_MEDIA | PAPER_LETTER" }
      - { name: subject, type: string, source: input, description: "Subject line" }
      - { name: body_excerpt, type: string, source: input, description: "Excerpt text", default: "" }
      - { name: lexicon_hits, type: integer, source: input, description: "Number of surveillance-lexicon hits (>= 0)" }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock timestamp at capture" }
      - { name: review_deadline, type: datetime, source: computed, description: "captured_at + 30 days" }
      - { name: provisional_risk_score, type: integer, source: computed, description: "Provisional score per correspondence_risk_score (capture variant)" }
      - { name: final_risk_score, type: integer, source: computed, description: "Final score per correspondence_risk_score (review variant); null until terminal review" }
      - { name: reviewed_by, type: string, source: system, description: "Opaque principal id of first reviewer" }
      - { name: escalated_by, type: string, source: system, description: "Opaque principal id who escalated; null unless ESCALATED" }
      - { name: resolved_by, type: string, source: system, description: "Opaque principal id who resolved an escalation; null unless resolved" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | OVERDUE | ESCALATED | APPROVED | FLAGGED" }

  - name: OutsideActivityRequest
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: system, description: "FK -> RegisteredRepresentative.id; always the requesting rep (X-User-ID), never a payload field" }
      - { name: activity_type, type: enum, source: input, description: "OUTSIDE_BUSINESS_ACTIVITY | PRIVATE_SECURITIES_TRANSACTION" }
      - { name: description, type: string, source: input, description: "Activity description" }
      - { name: compensation_expected, type: boolean, source: input, description: "Whether the rep expects compensation" }
      - { name: estimated_gross_comp_cents, type: integer, source: input, description: "Estimated gross compensation in cents; required at decision time for compensated PST" }
      - { name: start_date, type: string, source: input, description: "Planned activity start date YYYY-MM-DD" }
      - { name: conditions, type: array, source: input, description: "Supervisory conditions imposed at APPROVE_WITH_CONDITIONS; otherwise null" }
      - { name: supervisory_fee_cents, type: integer, source: computed, description: "Per-approval rounded PST fee; null unless approved compensated PST" }
      - { name: decided_by, type: string, source: system, description: "Opaque principal id of decision-maker; null until decided" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | APPROVED_WITH_CONDITIONS | REJECTED | WITHDRAWN | REVOKED | SUSPENDED_REVIEW" }

  - name: CustomerComplaint
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> RegisteredRepresentative.id; subject rep" }
      - { name: allegation_type, type: enum, source: input, description: "FORGERY | THEFT | MISREPRESENTATION | SUITABILITY | UNAUTHORIZED_TRADING | OTHER" }
      - { name: damages_claimed_cents, type: integer, source: input, description: "Claimed damages in cents (>= 0); amendable via PATCH while RECEIVED" }
      - { name: received_date, type: string, source: input, description: "Date complaint was received YYYY-MM-DD" }
      - { name: description, type: string, source: input, description: "Complaint narrative", default: "" }
      - { name: reportable, type: boolean, source: computed, description: "damages_claimed_cents >= 500000 OR allegation_type in {FORGERY, THEFT}" }
      - { name: report_deadline, type: string, source: computed, description: "received_date + 30 days" }
      - { name: provisional_reserve_cents, type: integer, source: computed, description: "Per complaint_reserve provisional variant" }
      - { name: final_reserve_cents, type: integer, source: computed, description: "Per complaint_reserve final variant; null until RESOLVED" }
      - { name: damages_paid_cents, type: integer, source: input, description: "Set at resolve; null until then" }
      - { name: legal_cost_cents, type: integer, source: input, description: "Set at resolve; null until then" }
      - { name: reported_at, type: string, source: system, description: "Date regulatory report filed; null until FILED" }
      - { name: is_late_report, type: boolean, source: computed, description: "reported_at > report_deadline; null until FILED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | RESOLVED" }
      - { name: regulatory_status, type: enum, source: system, description: "NOT_REQUIRED | REQUIRED | FILED — parallel dimension, independent of status" }

  - name: DisclosureEvent
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> RegisteredRepresentative.id; subject rep" }
      - { name: event_type, type: enum, source: input, description: "FELONY_CONVICTION | SECURITIES_MISDEMEANOR | REGULATORY_BAR | CUSTOMER_AWARD | CIVIL_JUDGMENT | BANKRUPTCY" }
      - { name: event_date, type: string, source: input, description: "Date of the underlying event YYYY-MM-DD" }
      - { name: description, type: string, source: input, description: "Event narrative", default: "" }
      - { name: is_sd_trigger, type: boolean, source: computed, description: "event_type in {FELONY_CONVICTION, SECURITIES_MISDEMEANOR, REGULATORY_BAR}" }
      - { name: filing_deadline, type: string, source: computed, description: "event_date + 30 days" }
      - { name: filed_at, type: datetime, source: system, description: "Set at file action; null until FILED" }
      - { name: is_late, type: boolean, source: computed, description: "date(filed_at) > filing_deadline; null until FILED" }
      - { name: source_complaint_id, type: string, source: system, description: "Identifier of originating CustomerComplaint when auto-created by award cascade; null otherwise (plain identifier, not a join key)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | ACKNOWLEDGED" }

  - name: HeightenedSupervisionPlan
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> RegisteredRepresentative.id; supervised rep" }
      - { name: start_date, type: string, source: input, description: "Window start YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "Window end YYYY-MM-DD, exclusive (half-open [start_date, end_date))" }
      - { name: conditions, type: array, source: input, description: "Supervision condition strings (>= 1)" }
      - { name: terminated_reason, type: enum, source: system, description: "MANUAL | REP_TERMINATED; null until TERMINATED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED | COMPLETED" }

  - name: ComplianceMeeting
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Calendar year; unique — one meeting per year" }
      - { name: meeting_date, type: string, source: input, description: "Planned date YYYY-MM-DD" }
      - { name: held_at, type: datetime, source: system, description: "Set when meeting enters HELD; null until then" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CLOSED" }

  - name: Attestation
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> ComplianceMeeting.id; set at fan-out creation" }
      - { name: rep_id, type: string, source: system, description: "FK -> RegisteredRepresentative.id; set at fan-out creation" }
      - { name: attest_deadline, type: string, source: computed, description: "meeting.meeting_date + 30 days; attestation allowed while current date <= deadline" }
      - { name: attested_at, type: datetime, source: system, description: "Set at attest action; null until ATTESTED" }
      - { name: status, type: enum, source: system, description: "PENDING | ATTESTED | OVERDUE" }

  - name: WSPDocument
    parent: null
    common_fields: true
    fields:
      - { name: policy_area, type: enum, source: input, description: "CORRESPONDENCE | OBA_PST | COMPLAINTS | DISCLOSURE | HEIGHTENED_SUPERVISION | INSPECTIONS | BOOKS_RECORDS" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: effective_date, type: string, source: input, description: "Effective date YYYY-MM-DD" }
      - { name: version_number, type: integer, source: computed, description: "1 + max(version_number) within policy_area, else 1; computed at creation" }
      - { name: drafted_by, type: string, source: system, description: "Opaque analyst id of creator (X-User-ID)" }
      - { name: published_by, type: string, source: system, description: "Opaque principal id of publisher; null until PUBLISHED" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> WSPDocument.id; set at publish to the previously PUBLISHED document of the same policy_area; null if none" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: ExamDocumentRequest
    parent: null
    common_fields: true
    fields:
      - { name: regulator, type: enum, source: input, description: "SEC | FINRA | STATE" }
      - { name: request_ref, type: string, source: input, description: "Regulator's request reference" }
      - { name: document_type, type: enum, source: input, description: "TRADE_BLOTTER | CORRESPONDENCE_LOG | COMPLAINT_FILE | WSP_COPY | OBA_REGISTER" }
      - { name: branch_id, type: string, source: input, description: "FK -> BranchOffice.id; optional branch scope", default: null }
      - { name: due_date, type: string, source: input, description: "Regulatory production due date YYYY-MM-DD" }
      - { name: produced_document_ref, type: string, source: input, description: "Set at fulfill; null until then" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Set at fulfill; null until FULFILLED" }
      - { name: is_late, type: boolean, source: computed, description: "date(fulfilled_at) > due_date; null until FULFILLED" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | FULFILLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RegisteredRepresentative
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /representatives/{id}/terminate"
        actor: CompliancePrincipal
        preconditions:
          - "rep.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Every OutsideActivityRequest of this rep in {SUBMITTED, SUSPENDED_REVIEW} -> WITHDRAWN (rep.activity_count unaffected because none were approved)"
          - "Every HeightenedSupervisionPlan of this rep in ACTIVE -> TERMINATED with terminated_reason = REP_TERMINATED"
          - "Branch recompute: branch.sd_rep_count decremented if rep was SD-flagged; supervision_tier/is_statutorily_disqualified left as-is (historical)"
          - "increments RegisteredRepresentative.version by 1"

  - entity: BranchInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: ComplianceAnalyst
        preconditions:
          - "inspection.status == SCHEDULED (else ERR_INSPECTION_INVALID_STATE)"
        side_effects:
          - "started_at := current logical clock"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /inspections/{id}/close"
        actor: CompliancePrincipal
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "inspection.open_findings_count == 0 (zero-finding close)"
        side_effects:
          - "completed_date := current logical clock date"
          - "cascade recompute on branch: open/high counts, posture, risk_score, next_inspection_due_date := completed_date + inspection_cycle_months; increments BranchOffice.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_REMEDIATION
        trigger: "POST /inspections/{id}/close"
        actor: CompliancePrincipal
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "inspection.open_findings_count > 0 (fieldwork ends, remediation begins)"
        side_effects: []
      - from: AWAITING_REMEDIATION
        to: CLOSED
        trigger: "POST /inspections/{id}/close"
        actor: CompliancePrincipal
        preconditions:
          - "inspection.status == AWAITING_REMEDIATION"
          - "all findings VERIFIED_CLOSED (else ERR_FINDINGS_STILL_OPEN)"
        side_effects:
          - "completed_date := current logical clock date"
          - "cascade recompute on branch (as above); increments BranchOffice.version by 1"
        note: "close is a conditional action: same endpoint forks on aggregate child state"

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /findings/{id}/remediate"
        actor: ComplianceAnalyst
        preconditions:
          - "finding.status in {OPEN, OVERDUE} (else ERR_FINDING_INVALID_STATE)"
        side_effects:
          - "remediation_note := payload; branch risk_score recompute (finding leaves the scored {OPEN, OVERDUE} set)"
      - from: OVERDUE
        to: REMEDIATION_SUBMITTED
        trigger: "POST /findings/{id}/remediate"
        actor: ComplianceAnalyst
        preconditions:
          - "finding.status in {OPEN, OVERDUE}"
        side_effects:
          - "remediation_note := payload; branch risk_score recompute"
      - from: REMEDIATION_SUBMITTED
        to: VERIFIED_CLOSED
        trigger: "POST /findings/{id}/adjudicate with decision VERIFY"
        actor: CompliancePrincipal
        preconditions:
          - "finding.status == REMEDIATION_SUBMITTED (else ERR_FINDING_INVALID_STATE)"
        side_effects:
          - "verified_by := X-User-ID; inspection.open_findings_count -= 1; branch counts/posture/risk recompute"
      - from: REMEDIATION_SUBMITTED
        to: OPEN
        trigger: "POST /findings/{id}/adjudicate with decision REOPEN"
        actor: CompliancePrincipal
        preconditions:
          - "finding.status == REMEDIATION_SUBMITTED"
        side_effects:
          - "reopen_count += 1; adjudication_note := payload.rejection_reason; branch risk_score recompute (finding re-enters the scored set) — compensates the remediate transition"
        note: "cyclic revision loop OPEN -> REMEDIATION_SUBMITTED -> OPEN is unlimited"
      - from: OPEN
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "finding.status == OPEN and finding.due_date < current clock date"
        side_effects: []

  - entity: CorrespondenceItem
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, FLAGGED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /correspondence-items/{id}/review with decision APPROVE"
        actor: CompliancePrincipal
        preconditions:
          - "item.status in {PENDING_REVIEW, OVERDUE} (else ERR_CORRESPONDENCE_INVALID_STATE)"
        side_effects:
          - "reviewed_by := X-User-ID; final_risk_score := provisional_risk_score (review variant, no clamp)"
      - from: OVERDUE
        to: APPROVED
        trigger: "POST /correspondence-items/{id}/review with decision APPROVE"
        actor: CompliancePrincipal
        preconditions: ["item.status in {PENDING_REVIEW, OVERDUE}"]
        side_effects:
          - "reviewed_by := X-User-ID; final_risk_score := provisional_risk_score"
      - from: PENDING_REVIEW
        to: FLAGGED
        trigger: "POST /correspondence-items/{id}/review with decision FLAG"
        actor: CompliancePrincipal
        preconditions: ["item.status in {PENDING_REVIEW, OVERDUE}"]
        side_effects:
          - "reviewed_by := X-User-ID; final_risk_score := max(provisional_risk_score, 70); rep.compliance_flag_count += 1"
      - from: OVERDUE
        to: FLAGGED
        trigger: "POST /correspondence-items/{id}/review with decision FLAG"
        actor: CompliancePrincipal
        preconditions: ["item.status in {PENDING_REVIEW, OVERDUE}"]
        side_effects:
          - "reviewed_by := X-User-ID; final_risk_score := max(provisional_risk_score, 70); rep.compliance_flag_count += 1"
      - from: PENDING_REVIEW
        to: ESCALATED
        trigger: "POST /correspondence-items/{id}/review with decision ESCALATE"
        actor: CompliancePrincipal
        preconditions: ["item.status in {PENDING_REVIEW, OVERDUE}"]
        side_effects:
          - "escalated_by := X-User-ID"
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /correspondence-items/{id}/review with decision ESCALATE"
        actor: CompliancePrincipal
        preconditions: ["item.status in {PENDING_REVIEW, OVERDUE}"]
        side_effects:
          - "escalated_by := X-User-ID"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /correspondence-items/{id}/resolve-escalation with decision APPROVE"
        actor: CompliancePrincipal
        preconditions:
          - "item.status == ESCALATED (else ERR_CORRESPONDENCE_INVALID_STATE)"
          - "X-User-ID != escalated_by (segregation of duties; else ERR_SOD_ESCALATION_RESOLVER)"
        side_effects:
          - "resolved_by := X-User-ID; final_risk_score := min(provisional_risk_score, 30)"
      - from: ESCALATED
        to: FLAGGED
        trigger: "POST /correspondence-items/{id}/resolve-escalation with decision FLAG"
        actor: CompliancePrincipal
        preconditions:
          - "item.status == ESCALATED"
          - "X-User-ID != escalated_by (ERR_SOD_ESCALATION_RESOLVER)"
        side_effects:
          - "resolved_by := X-User-ID; final_risk_score := max(provisional_risk_score, 70); rep.compliance_flag_count += 1"
      - from: PENDING_REVIEW
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "item.status == PENDING_REVIEW and item.review_deadline < current clock"
        side_effects: []

  - entity: OutsideActivityRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /outside-activities/{id}/decide with decision APPROVE"
        actor: CompliancePrincipal
        preconditions:
          - "activity.status == SUBMITTED (else ERR_ACTIVITY_NOT_PENDING_DECISION)"
          - "rep.status == ACTIVE (else ERR_REP_NOT_ACTIVE)"
          - "if rep.is_statutorily_disqualified then rep has a HeightenedSupervisionPlan in ACTIVE (else ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN)"
          - "if activity_type == PRIVATE_SECURITIES_TRANSACTION and compensation_expected then estimated_gross_comp_cents present and > 0 (else ERR_PST_COMP_DETAILS_REQUIRED)"
        side_effects:
          - "decided_by := X-User-ID; rep.active_approved_activity_count += 1; if compensated PST: supervisory_fee_cents := round_half_up(estimated_gross_comp_cents * 0.025) and rep.pst_fee_total_cents += supervisory_fee_cents; increments RegisteredRepresentative.version by 1"
      - from: SUBMITTED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /outside-activities/{id}/decide with decision APPROVE_WITH_CONDITIONS"
        actor: CompliancePrincipal
        preconditions: ["same as APPROVE", "conditions must be a non-empty array"]
        side_effects: ["same as APPROVE, plus conditions := payload.conditions"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /outside-activities/{id}/decide with decision REJECT"
        actor: CompliancePrincipal
        preconditions:
          - "activity.status == SUBMITTED"
        side_effects:
          - "decided_by := X-User-ID"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /outside-activities/{id}/withdraw"
        actor: RegisteredRep
        preconditions:
          - "X-User-ID == activity.rep_id (else ERR_FORBIDDEN_ROLE)"
          - "activity.status in {SUBMITTED, SUSPENDED_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS} (else ERR_ACTIVITY_NOT_PENDING_DECISION)"
        side_effects:
          - "if prior status in {APPROVED, APPROVED_WITH_CONDITIONS}: rep.active_approved_activity_count -= 1 and rep.pst_fee_total_cents -= supervisory_fee_cents (compensating reversal)"
      - from: SUSPENDED_REVIEW
        to: WITHDRAWN
        trigger: "POST /outside-activities/{id}/withdraw"
        actor: RegisteredRep
        preconditions: ["X-User-ID == activity.rep_id", "activity.status in {SUBMITTED, SUSPENDED_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS}"]
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /outside-activities/{id}/withdraw"
        actor: RegisteredRep
        preconditions: ["X-User-ID == activity.rep_id", "activity.status in {SUBMITTED, SUSPENDED_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS}"]
        side_effects:
          - "rep.active_approved_activity_count -= 1; rep.pst_fee_total_cents -= supervisory_fee_cents (null-safe)"
      - from: APPROVED_WITH_CONDITIONS
        to: WITHDRAWN
        trigger: "POST /outside-activities/{id}/withdraw"
        actor: RegisteredRep
        preconditions: ["X-User-ID == activity.rep_id", "activity.status in {SUBMITTED, SUSPENDED_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS}"]
        side_effects:
          - "rep.active_approved_activity_count -= 1; rep.pst_fee_total_cents -= supervisory_fee_cents (null-safe)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /outside-activities/{id}/revoke"
        actor: CompliancePrincipal
        preconditions:
          - "activity.status in {APPROVED, APPROVED_WITH_CONDITIONS} (else ERR_ACTIVITY_NOT_PENDING_DECISION)"
        side_effects:
          - "rep.active_approved_activity_count -= 1; rep.pst_fee_total_cents -= supervisory_fee_cents (null-safe) — compensates the approve transition"
      - from: APPROVED_WITH_CONDITIONS
        to: REVOKED
        trigger: "POST /outside-activities/{id}/revoke"
        actor: CompliancePrincipal
        preconditions: ["activity.status in {APPROVED, APPROVED_WITH_CONDITIONS}"]
        side_effects:
          - "rep.active_approved_activity_count -= 1; rep.pst_fee_total_cents -= supervisory_fee_cents (null-safe)"
      - from: SUBMITTED
        to: SUSPENDED_REVIEW
        trigger: "system cascade — rep becomes statutorily disqualified (SD disclosure acknowledgement)"
        actor: system
        preconditions:
          - "activity.status == SUBMITTED and activity.rep_id's is_statutorily_disqualified flipped false->true"
        side_effects: []
      - from: SUSPENDED_REVIEW
        to: SUBMITTED
        trigger: "POST /outside-activities/{id}/resume"
        actor: CompliancePrincipal
        preconditions:
          - "activity.status == SUSPENDED_REVIEW (else ERR_ACTIVITY_NOT_PENDING_DECISION)"
          - "rep has a HeightenedSupervisionPlan in ACTIVE (else ERR_NO_ACTIVE_HEIGHTENED_PLAN)"
        side_effects: []
        note: "cyclic loop SUBMITTED <-> SUSPENDED_REVIEW guarded by plan state"

  - entity: CustomerComplaint
    initial_state: RECEIVED (regulatory_status initialized per complaint_reportability)
    terminal_states: [RESOLVED]   # regulatory axis terminal: FILED
    transitions:
      - from: RECEIVED
        to: RESOLVED
        trigger: "POST /complaints/{id}/resolve"
        actor: CompliancePrincipal
        preconditions:
          - "complaint.status == RECEIVED (else ERR_COMPLAINT_NOT_RESOLVABLE)"
        side_effects:
          - "damages_paid_cents / legal_cost_cents := payload; final_reserve_cents per complaint_reserve final variant"
          - "if damages_paid_cents >= 150000: auto-create DisclosureEvent(status=DRAFT, event_type=CUSTOMER_AWARD, event_date=current date, rep_id=complaint.rep_id, source_complaint_id=complaint.id)"
      - from: NOT_REQUIRED
        to: REQUIRED
        trigger: "system recompute on POST /complaints or PATCH /complaints/{id} crossing the threshold"
        actor: system
        preconditions: ["complaint.reportable flipped false -> true"]
        side_effects: []
      - from: REQUIRED
        to: NOT_REQUIRED
        trigger: "system recompute on PATCH /complaints/{id} crossing the threshold downward"
        actor: system
        preconditions: ["complaint.reportable flipped true -> false"]
        side_effects: []
      - from: REQUIRED
        to: FILED
        trigger: "POST /complaints/{id}/report"
        actor: CompliancePrincipal
        preconditions:
          - "complaint.regulatory_status == REQUIRED (else ERR_REPORT_NOT_REQUIRED)"
        side_effects:
          - "reported_at := current date; is_late_report := reported_at > report_deadline"
        note: "status and regulatory_status are independent parallel dimensions"

  - entity: DisclosureEvent
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /disclosure-events/{id}/file"
        actor: CompliancePrincipal
        preconditions:
          - "disclosure.status == DRAFT (else ERR_DISCLOSURE_INVALID_STATE)"
        side_effects:
          - "filed_at := current clock; is_late := date(filed_at) > filing_deadline"
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /disclosure-events/{id}/acknowledge"
        actor: CompliancePrincipal
        preconditions:
          - "disclosure.status == FILED (else ERR_DISCLOSURE_INVALID_STATE)"
        side_effects:
          - "L1: if is_sd_trigger: rep.is_statutorily_disqualified := true; rep.supervision_tier := HEIGHTENED; increments RegisteredRepresentative.version by 1"
          - "L1-fanout: every OutsideActivityRequest of this rep in SUBMITTED -> SUSPENDED_REVIEW"
          - "L2 (caused by L1): branch.sd_rep_count recomputed; when >= 1 the branch cycle accelerates: inspection_cycle_months := min(current, 6) and next_inspection_due_date recomputed on the shortened cycle; increments BranchOffice.version by 1"
          - "L3 (caused by L2): if the branch has a BranchInspection in SCHEDULED with scheduled_date > next_inspection_due_date, that inspection's scheduled_date := next_inspection_due_date; increments BranchInspection.version by 1"

  - entity: HeightenedSupervisionPlan
    initial_state: DRAFT
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /supervision-plans/{id}/activate"
        actor: CompliancePrincipal
        preconditions:
          - "plan.status == DRAFT (else ERR_PLAN_NOT_ACTIVE)"
          - "rep.is_statutorily_disqualified == true (else ERR_REP_NOT_STATUTORILY_DISQUALIFIED)"
          - "no other ACTIVE plan for this rep (else ERR_PLAN_ALREADY_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /supervision-plans/{id}/terminate"
        actor: CompliancePrincipal
        preconditions:
          - "plan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "terminated_reason := MANUAL"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system cascade — rep termination"
        actor: system
        preconditions: ["plan.status == ACTIVE and rep terminated"]
        side_effects:
          - "terminated_reason := REP_TERMINATED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions: ["plan.status == ACTIVE and plan.end_date <= current clock date"]
        side_effects: []

  - entity: ComplianceMeeting
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /meetings/{id}/hold"
        actor: CompliancePrincipal
        preconditions:
          - "meeting.status == SCHEDULED (else ERR_MEETING_NOT_HELD)"
          - "current clock date >= meeting.meeting_date (else ERR_MEETING_DATE_NOT_REACHED)"
        side_effects:
          - "held_at := current clock"
      - from: HELD
        to: CLOSED
        trigger: "POST /meetings/{id}/close"
        actor: CompliancePrincipal
        preconditions:
          - "meeting.status == HELD (else ERR_MEETING_NOT_HELD)"
          - "every Attestation of this meeting in {ATTESTED, OVERDUE} (else ERR_ATTESTATIONS_STILL_PENDING)"
        side_effects: []

  - entity: Attestation
    initial_state: PENDING
    terminal_states: [ATTESTED, OVERDUE]
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /attestations/{id}/attest"
        actor: RegisteredRep
        preconditions:
          - "X-User-ID == attestation.rep_id (else ERR_NOT_ATTESTATION_OWNER)"
          - "attestation.status == PENDING (else ERR_ATTESTATION_NOT_PENDING)"
          - "current clock date <= attestation.attest_deadline (else ERR_ATTESTATION_DEADLINE_PASSED)"
          - "meeting of attestation.meeting_id in HELD (else ERR_MEETING_NOT_HELD)"
        side_effects:
          - "attested_at := current clock"
      - from: PENDING
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions: ["attestation.status == PENDING and attestation.attest_deadline < current clock date"]
        side_effects: []

  - entity: WSPDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /wsp-documents/{id}/publish"
        actor: CompliancePrincipal
        preconditions:
          - "document.status == DRAFT (else ERR_WSP_NOT_DRAFT)"
          - "X-User-ID != document.drafted_by (segregation of duties; else ERR_SOD_WSP_PUBLISHER)"
        side_effects:
          - "published_by := X-User-ID"
          - "supersede cascade: the (unique, by invariant) currently-PUBLISHED document of the same policy_area -> SUPERSEDED, and this document.supersedes_id := that document's id; if none, supersedes_id stays null"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system cascade — another document of the same policy_area is published"
        actor: system
        preconditions: ["document.status == PUBLISHED"]
        side_effects: []

  - entity: ExamDocumentRequest
    initial_state: OPEN
    terminal_states: [FULFILLED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "POST /exam-requests/{id}/fulfill"
        actor: ComplianceAnalyst
        preconditions:
          - "request.status in {OPEN, OVERDUE} (else ERR_EXAM_REQUEST_INVALID_STATE)"
        side_effects:
          - "produced_document_ref := payload; fulfilled_at := current clock; is_late := date(fulfilled_at) > due_date"
      - from: OVERDUE
        to: FULFILLED
        trigger: "POST /exam-requests/{id}/fulfill"
        actor: ComplianceAnalyst
        preconditions: ["request.status in {OPEN, OVERDUE}"]
        side_effects:
          - "produced_document_ref := payload; fulfilled_at := current clock; is_late := date(fulfilled_at) > due_date"
      - from: OPEN
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions: ["request.status == OPEN and request.due_date < current clock date"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-representative
    parent_entity: RegisteredRepresentative
    write_endpoint: "POST /supervision-plans"
    occ_field: "expected_representative_version"
    description: |
      Creating a HeightenedSupervisionPlan against a RegisteredRepresentative whose
      version has advanced since the client last observed it is rejected. This captures
      the case where another writer has just registered a plan (which the product treats
      as superseding context for the rep's supervision file) or an SD cascade has flipped
      the rep's flags, so the current writer's view of the rep is stale.
    error_id: ERR_STALE_REPRESENTATIVE_VERSION
    http_status: 412
  - rule_id: inspection-create-stale-branch
    parent_entity: BranchOffice
    write_endpoint: "POST /inspections"
    occ_field: "expected_branch_version"
    description: |
      Creating a BranchInspection against a BranchOffice whose version has advanced since
      the client last observed it is rejected. Scheduling decisions depend on branch-local
      fields (next_inspection_due_date, posture, open inspection uniqueness) that cascades
      mutate, so a stale view of the branch must fail the write rather than schedule on
      outdated cycle math.
    error_id: ERR_STALE_BRANCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: correspondence_risk_score
    trigger: "variant A (provisional) at POST /correspondence-items; variant B (final) at review/resolve-escalation reaching APPROVED or FLAGGED"
    algorithm: weighted_scoring
    formula: |
      CHANNEL_WEIGHT = { EMAIL: 5, PAPER_LETTER: 10, SMS: 20, SOCIAL_MEDIA: 25 }
      provisional = min(100, 10 * lexicon_hits + CHANNEL_WEIGHT[channel] + (30 if rep.supervision_tier == HEIGHTENED else 0))
      final (variant B): on APPROVE decision -> provisional unchanged;
                         on FLAG decision   -> max(provisional, 70);
                         on escalation resolution APPROVE -> min(provisional, 30);
                         on escalation resolution FLAG   -> max(provisional, 70)
    input_set: "the CorrespondenceItem plus its rep's current supervision_tier"
    constants:
      CAP: 100
      FLAG_FLOOR: 70
      ESCALATION_APPROVE_CEILING: 30
      HEIGHTENED_BONUS: 30
    precision: "integer points; no rounding"
    variants:
      - name: provisional
        when: "capture time"
        difference: "pure formula over lexicon_hits + channel + rep tier"
      - name: final
        when: "terminal review decision"
        difference: "outcome-clamped: same inputs yield 70 on FLAG when provisional was 20, or 30 on escalation-APPROVE when provisional was 80"

  - name: complaint_reserve
    trigger: "variant A (provisional) at complaint create and at each PATCH of damages_claimed_cents; variant B (final) at resolve"
    algorithm: tiered_pricing
    formula: |
      ALLEGATION_RATE = { FORGERY: 1.00, THEFT: 1.00, MISREPRESENTATION: 0.60, UNAUTHORIZED_TRADING: 0.50, SUITABILITY: 0.40, OTHER: 0.25 }
      provisional_reserve_cents = round_half_up(damages_claimed_cents * ALLEGATION_RATE[allegation_type])
      final_reserve_cents = min(damages_paid_cents + legal_cost_cents, round_half_up(1.25 * damages_claimed_cents))
    input_set: "the single CustomerComplaint"
    constants:
      CAP_MULTIPLE: 1.25
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "while complaint.status == RECEIVED"
        difference: "rate-keyed estimate on claimed damages"
      - name: final
        when: "on RESOLVED"
        difference: "actual paid + legal, capped at 1.25x claimed — for identical claimed damages the two variants differ (e.g., claimed 2000000 SUITABILITY: provisional 800000 vs final capped 1500000)"

  - name: branch_risk_score
    trigger: "finding create / remediate / adjudicate / sweep-to-OVERDUE on any finding of the branch's inspections"
    algorithm: weighted_scoring
    formula: |
      scored statuses = {OPEN, OVERDUE}   # REMEDIATION_SUBMITTED and VERIFIED_CLOSED are excluded
      raw = 15 * (#HIGH scored) + 5 * (#MEDIUM scored) + 2 * (#LOW scored)
      if branch.sd_rep_count >= 1: raw += 20
      risk_score = min(100, raw)
    input_set: "all InspectionFindings whose inspection.branch_id == branch.id, filtered by status; plus branch.sd_rep_count"
    constants:
      HIGH_W: 15
      MEDIUM_W: 5
      LOW_W: 2
      SD_BONUS: 20
      CAP: 100
    precision: "integer points; no rounding"

  - name: pst_supervisory_fee_accrual
    trigger: "OBA decide APPROVE / APPROVE_WITH_CONDITIONS where activity_type == PRIVATE_SECURITIES_TRANSACTION and compensation_expected == true"
    algorithm: aggregation
    formula: |
      per_approval_fee_cents = round_half_up(estimated_gross_comp_cents * PST_FEE_RATE)
      rep.pst_fee_total_cents = SUM of per_approval_fee_cents over all of the rep's compensated-PST approvals,
                                MINUS the fee of any such approval later withdrawn or revoked
      ROUNDING ORDER (pinned): round each approval's fee to whole cents FIRST, then sum.
      Summing gross amounts and rounding once at the end is FORBIDDEN — the two orders differ
      (e.g., two PSTs of 33333 cents each: per-item 833 + 833 = 1666 vs sum-then-round 1667).
    input_set: "the rep's OutsideActivityRequests that reached {APPROVED, APPROVED_WITH_CONDITIONS} via decide and have not been withdrawn/revoked"
    constants:
      PST_FEE_RATE: 0.025
    precision: "whole cents, round_half_up per approval before summation"

  - name: branch_inspection_due_date
    trigger: "branch creation; inspection CLOSED; SD cascade cycle acceleration"
    algorithm: threshold
    formula: |
      base_date = (completed_date of the branch's most recently CLOSED inspection)
                  else (date of branch.created_at) when no CLOSED inspection exists
      cycle = 6 if branch.sd_rep_count >= 1 else branch.inspection_cycle_months (12 unless already accelerated)
      next_inspection_due_date = base_date + cycle months
      Acceleration is sticky: once inspection_cycle_months has been reduced to 6 it does not revert,
      even if sd_rep_count later falls to 0.
    input_set: "the branch's inspections (status == CLOSED, latest completed_date; tie-break: created_at ASC then first-created wins) and sd_rep_count"
    constants:
      STANDARD_CYCLE_MONTHS: 12
      ACCELERATED_CYCLE_MONTHS: 6
    precision: "calendar date arithmetic"

  - name: correspondence_review_deadline
    trigger: "correspondence capture"
    algorithm: chronological
    formula: |
      review_deadline = captured_at + 30 days (exact timestamp arithmetic)
      sweep marks OVERDUE when review_deadline < current clock (strictly later; exactly at the deadline is still PENDING_REVIEW)
    input_set: "the single CorrespondenceItem"
    constants:
      REVIEW_WINDOW_DAYS: 30
    precision: "ISO8601 datetime"

  - name: complaint_reportability
    trigger: "POST /complaints; PATCH /complaints/{id}"
    algorithm: threshold
    formula: |
      reportable = (damages_claimed_cents >= REPORT_THRESHOLD_CENTS) OR (allegation_type in {FORGERY, THEFT})
      regulatory_status = REQUIRED iff reportable else NOT_REQUIRED (recomputed on every amendment while RECEIVED)
      Boundary: exactly 500000 cents IS reportable (>=), 499999 is not.
    input_set: "the single CustomerComplaint"
    constants:
      REPORT_THRESHOLD_CENTS: 500000
    precision: "whole-cent comparison"

  - name: branch_posture_evaluation
    trigger: "finding create / adjudicate / remediate on HIGH findings; SD cascade; inspection close"
    algorithm: threshold
    formula: |
      if any inspection of the branch has high_severity_open_count >= HIGH_FINDING_THRESHOLD:
        posture = REMEDIATION_REQUIRED
        next_inspection_due_date = min(next_inspection_due_date, current clock date + ESCALATION_WINDOW_DAYS)  (pull-in, only on upward transition)
      else:
        posture = NORMAL
      Boundary: count >= 2 triggers; count == 1 does not.
    input_set: "the branch's inspections with their HIGH findings in {OPEN, OVERDUE, REMEDIATION_SUBMITTED}"
    constants:
      HIGH_FINDING_THRESHOLD: 2
      ESCALATION_WINDOW_DAYS: 90
    precision: "integer comparison"

  - name: oba_active_count_conservation
    trigger: "invariant checked on decide APPROVE / withdraw / revoke"
    algorithm: aggregation
    formula: |
      rep.active_approved_activity_count = COUNT of rep's OutsideActivityRequests in {APPROVED, APPROVED_WITH_CONDITIONS}
      Invariant: an APPROVE decision (+1) paired with its WITHDRAW or REVOKE (-1) leaves the count unchanged;
      intermediate states may differ but the forward+compensating pair nets to zero.
    input_set: "the rep's OutsideActivityRequests"
    precision: "integer count"

  - name: wsp_publish_singleton
    trigger: "WSP create (version_number) and publish (supersede)"
    algorithm: aggregation
    formula: |
      version_number (at create) = 1 + max(version_number) over WSPDocuments with the same policy_area; 1 if none exist
      singleton invariant: COUNT of PUBLISHED documents per policy_area is exactly 1 whenever any document of that
      area has been published — publish(new) is always paired with supersede(old PUBLISHED) in the same request.
    input_set: "WSPDocuments of the same policy_area; selector for the supersede target: status == PUBLISHED (unique by invariant; empty set -> supersedes_id null)"
    precision: "integer count"

  - name: meeting_attestation_fanout
    trigger: "POST /meetings"
    algorithm: aggregation
    formula: |
      for each RegisteredRepresentative with status == ACTIVE at creation time (iteration order: created_at ASC):
        create Attestation(status=PENDING, meeting_id=meeting.id, rep_id=rep.id, attest_deadline=meeting.meeting_date + 30 days)
      TERMINATED reps receive no attestation.
    input_set: "RegisteredRepresentatives filtered status == ACTIVE"
    constants:
      ATTEST_WINDOW_DAYS: 30
    precision: "calendar date arithmetic"

  - name: disclosure_filing_timeliness
    trigger: "file action"
    algorithm: chronological
    formula: |
      filing_deadline = event_date + 30 days
      is_late = date(filed_at) > filing_deadline
    input_set: "the single DisclosureEvent"
    constants:
      FILING_WINDOW_DAYS: 30
    precision: "calendar date arithmetic"

  - name: complaint_award_disclosure_trigger
    trigger: "complaint resolve"
    algorithm: threshold
    formula: |
      if damages_paid_cents >= AWARD_DISCLOSURE_THRESHOLD_CENTS:
        auto-create DisclosureEvent(status=DRAFT, event_type=CUSTOMER_AWARD, event_date=current date,
                                    rep_id=complaint.rep_id, source_complaint_id=complaint.id)
      Boundary: exactly 150000 cents triggers (>=).
    input_set: "the resolving CustomerComplaint"
    constants:
      AWARD_DISCLOSURE_THRESHOLD_CENTS: 150000
    precision: "whole-cent comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "endpoint role membership (roles list per §1.5); entity-backed ownership where declared (OBA create/withdraw and attest bind X-User-ID to the rep resource)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids and body FK references (branch_id, rep_id, inspection_id, meeting_id...) resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 3.5
    category: state
    check: "OCC: expected_*_version equals the parent entity's current version — runs before all business checks on endpoints declaring it"
    error_id: "ERR_STALE_REPRESENTATIVE_VERSION | ERR_STALE_BRANCH_VERSION"
    http_status: 412
    applies_to: "POST /supervision-plans, POST /inspections, POST /inspections/{id}/close"
  - priority: 4
    category: state
    check: "target resource in the required state per its state machine (ERR_INSPECTION_INVALID_STATE, ERR_FINDING_INVALID_STATE, ERR_CORRESPONDENCE_INVALID_STATE, ERR_ACTIVITY_NOT_PENDING_DECISION, ERR_COMPLAINT_NOT_RESOLVABLE, ERR_REPORT_NOT_REQUIRED, ERR_DISCLOSURE_INVALID_STATE, ERR_PLAN_NOT_ACTIVE, ERR_MEETING_NOT_HELD, ERR_ATTESTATION_NOT_PENDING, ERR_WSP_NOT_DRAFT, ERR_EXAM_REQUEST_INVALID_STATE, ERR_INVALID_STATE)"
    error_id: "(per-resource state error)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "regulatory gates and segregation of duties: SD rep decision requires ACTIVE heightened plan (ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN); rep must be ACTIVE for OBA create/decide (ERR_REP_NOT_ACTIVE); escalation resolver != escalated_by (ERR_SOD_ESCALATION_RESOLVER); WSP publisher != drafted_by (ERR_SOD_WSP_PUBLISHER); attestation ownership (ERR_NOT_ATTESTATION_OWNER)"
    error_id: "(per-rule error)"
    http_status: 403
    applies_to: "decide / create OBA / resolve-escalation / publish / attest"
  - priority: 6
    category: business_temporal
    check: "plan.start_date >= current date (ERR_PLAN_START_IN_PAST); meeting hold requires current date >= meeting_date (ERR_MEETING_DATE_NOT_REACHED); attest requires current date <= attest_deadline (ERR_ATTESTATION_DEADLINE_PASSED)"
    error_id: "(per-rule error)"
    http_status: 422
    applies_to: "POST /supervision-plans, POST /meetings/{id}/hold, POST /attestations/{id}/attest"
  - priority: 7
    category: business_constraint
    check: "plan window overlap per rep (ERR_PLAN_WINDOW_OVERLAP) and single ACTIVE plan (ERR_PLAN_ALREADY_ACTIVE); one meeting per year (ERR_DUPLICATE_MEETING_YEAR); compensated PST requires estimated_gross_comp_cents > 0 (ERR_PST_COMP_DETAILS_REQUIRED); inspection minimum gap vs last CLOSED (ERR_INSPECTION_GAP_VIOLATION); at most one non-CLOSED inspection per branch (ERR_INSPECTION_ALREADY_OPEN); attestation's meeting must be HELD (ERR_MEETING_NOT_HELD)"
    error_id: "(per-rule error)"
    http_status: 409
    applies_to: "POST /supervision-plans, POST /supervision-plans/{id}/activate, POST /meetings, OBA decide, POST /inspections, attest"
  - priority: 8
    category: business_fiscal
    check: "monetary fields are non-negative integers (damages_*, legal_cost_cents, estimated_gross_comp_cents, lexicon_hits); enum membership; required fields present"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
    note: "schema-level field validation is reported as ERR_VALIDATION; domain rule conflicts report their specific error per priorities above"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; logical time for deadlines/sweeps) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock to an absolute ISO8601 UTC time (free-setting: forward and backward both allowed; sweeps evaluate against the new time). Startup default before any call is exactly 2026-08-01T00:00:00Z. Triggers sweeps: Finding OPEN->OVERDUE past due_date; CorrespondenceItem PENDING_REVIEW->OVERDUE past review_deadline; Attestation PENDING->OVERDUE past attest_deadline; ExamDocumentRequest OPEN->OVERDUE past due_date; HeightenedSupervisionPlan ACTIVE->COMPLETED at end_date."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the five sweeps listed in the description"]

  # --- BranchOffice ---
  - method: POST
    path: "/branches"
    description: "Create a branch office"
    roles: [FirmAdmin]
    code: 201
    input: [name, region, "inspection_cycle_months?"]
    output: BranchOffice
    side_effects: ["posture NORMAL; next_inspection_due_date initialized from creation date + cycle"]
  - method: GET
    path: "/branches"
    description: "List branches"
    roles: [Any]
    code: 200
    input: ["region?", "limit?", "offset?"]
    output: "BranchOffice[]"
    side_effects: []
  - method: GET
    path: "/branches/{id}"
    description: "Get one branch (computed posture/risk/due fields)"
    roles: [Any]
    code: 200
    input: []
    output: BranchOffice
    side_effects: []

  # --- RegisteredRepresentative ---
  - method: POST
    path: "/representatives"
    description: "Register a representative"
    roles: [FirmAdmin]
    code: 201
    input: [crd_number, full_name, branch_id, hire_date]
    output: RegisteredRepresentative
    side_effects: ["status ACTIVE; supervision_tier STANDARD"]
  - method: GET
    path: "/representatives"
    description: "List representatives"
    roles: [Any]
    code: 200
    input: ["branch_id?", "status?", "supervision_tier?", "limit?", "offset?"]
    output: "RegisteredRepresentative[]"
    side_effects: []
  - method: GET
    path: "/representatives/{id}"
    description: "Get one representative"
    roles: [Any]
    code: 200
    input: []
    output: RegisteredRepresentative
    side_effects: []
  - method: POST
    path: "/representatives/{id}/terminate"
    description: "Terminate a representative; cascades per state machine"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: RegisteredRepresentative
    side_effects: ["OBA {SUBMITTED, SUSPENDED_REVIEW} -> WITHDRAWN", "ACTIVE plans -> TERMINATED (REP_TERMINATED)", "branch sd_rep_count recompute", "increments RegisteredRepresentative.version by 1"]

  # --- BranchInspection ---
  - method: POST
    path: "/inspections"
    description: "Schedule a branch inspection (OCC on BranchOffice.version)"
    roles: [ComplianceAnalyst]
    code: 201
    input: [branch_id, scheduled_date, expected_branch_version]
    output: BranchInspection
    side_effects: ["increments BranchOffice.version by 1", "validates minimum 300-day gap vs last CLOSED inspection (ERR_INSPECTION_GAP_VIOLATION) and single non-CLOSED inspection per branch (ERR_INSPECTION_ALREADY_OPEN)"]
  - method: GET
    path: "/inspections"
    description: "List inspections"
    roles: [Any]
    code: 200
    input: ["branch_id?", "status?", "limit?", "offset?"]
    output: "BranchInspection[]"
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get one inspection"
    roles: [Any]
    code: 200
    input: []
    output: BranchInspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: BranchInspection
    side_effects: ["started_at := clock"]
  - method: POST
    path: "/inspections/{id}/close"
    description: "Conditional close: IN_PROGRESS->CLOSED (zero open findings) or ->AWAITING_REMEDIATION (open findings); AWAITING_REMEDIATION->CLOSED (all findings VERIFIED_CLOSED)"
    roles: [CompliancePrincipal]
    code: 200
    input: [expected_branch_version]
    output: BranchInspection
    side_effects: ["on reaching CLOSED: completed_date := clock date; branch cascade recompute; increments BranchOffice.version by 1"]

  # --- InspectionFinding ---
  - method: POST
    path: "/findings"
    description: "Record a finding on an IN_PROGRESS inspection"
    roles: [ComplianceAnalyst]
    code: 201
    input: [inspection_id, severity, description, due_date]
    output: InspectionFinding
    side_effects: ["inspection counts += 1; branch counts/risk recompute; posture cascade when a HIGH finding pushes an inspection to >= 2 open HIGH (ERR-side: none, automatic)"]
  - method: GET
    path: "/findings"
    description: "List findings"
    roles: [Any]
    code: 200
    input: ["inspection_id?", "severity?", "status?", "limit?", "offset?"]
    output: "InspectionFinding[]"
    side_effects: []
  - method: GET
    path: "/findings/{id}"
    description: "Get one finding"
    roles: [Any]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: []
  - method: POST
    path: "/findings/{id}/remediate"
    description: "OPEN/OVERDUE -> REMEDIATION_SUBMITTED"
    roles: [ComplianceAnalyst]
    code: 200
    input: [remediation_note]
    output: InspectionFinding
    side_effects: ["branch risk_score recompute (finding leaves scored set)"]
  - method: POST
    path: "/findings/{id}/adjudicate"
    description: "Principal verifies (VERIFIED_CLOSED) or reopens (OPEN, reopen_count += 1)"
    roles: [CompliancePrincipal]
    code: 200
    input: [decision, "rejection_reason?"]
    output: InspectionFinding
    side_effects: ["on VERIFY: inspection.open_findings_count -= 1, verified_by set; on REOPEN: reopen_count += 1; branch counts/posture/risk recompute"]

  # --- CorrespondenceItem ---
  - method: POST
    path: "/correspondence-items"
    description: "Capture a correspondence item for supervisory review"
    roles: [ComplianceAnalyst]
    code: 201
    input: [rep_id, channel, subject, "body_excerpt?", lexicon_hits]
    output: CorrespondenceItem
    side_effects: ["captured_at := clock; provisional_risk_score and review_deadline computed"]
  - method: GET
    path: "/correspondence-items"
    description: "List correspondence items"
    roles: [Any]
    code: 200
    input: ["rep_id?", "status?", "limit?", "offset?"]
    output: "CorrespondenceItem[]"
    side_effects: []
  - method: GET
    path: "/correspondence-items/{id}"
    description: "Get one correspondence item"
    roles: [Any]
    code: 200
    input: []
    output: CorrespondenceItem
    side_effects: []
  - method: POST
    path: "/correspondence-items/{id}/review"
    description: "Principal review decision: APPROVE | FLAG | ESCALATE"
    roles: [CompliancePrincipal]
    code: 200
    input: [decision, "note?"]
    output: CorrespondenceItem
    side_effects: ["final_risk_score per variant; FLAG increments rep.compliance_flag_count"]
  - method: POST
    path: "/correspondence-items/{id}/resolve-escalation"
    description: "Resolve an ESCALATED item (APPROVE | FLAG); resolver must differ from escalated_by (SoD)"
    roles: [CompliancePrincipal]
    code: 200
    input: [decision, "note?"]
    output: CorrespondenceItem
    side_effects: ["final_risk_score per escalation-resolution variant; FLAG increments rep.compliance_flag_count"]

  # --- OutsideActivityRequest ---
  - method: POST
    path: "/outside-activities"
    description: "Rep submits an OBA or PST request (rep identity from X-User-ID)"
    roles: [RegisteredRep]
    code: 201
    input: [activity_type, description, compensation_expected, "estimated_gross_comp_cents?", start_date]
    output: OutsideActivityRequest
    side_effects: ["rep_id := X-User-ID; requires rep.status == ACTIVE (ERR_REP_NOT_ACTIVE)"]
  - method: GET
    path: "/outside-activities"
    description: "List outside activity requests"
    roles: [Any]
    code: 200
    input: ["rep_id?", "activity_type?", "status?", "limit?", "offset?"]
    output: "OutsideActivityRequest[]"
    side_effects: []
  - method: GET
    path: "/outside-activities/{id}"
    description: "Get one request"
    roles: [Any]
    code: 200
    input: []
    output: OutsideActivityRequest
    side_effects: []
  - method: POST
    path: "/outside-activities/{id}/decide"
    description: "Principal decision: APPROVE | APPROVE_WITH_CONDITIONS | REJECT"
    roles: [CompliancePrincipal]
    code: 200
    input: [decision, "conditions?"]
    output: OutsideActivityRequest
    side_effects: ["on approval: rep.active_approved_activity_count += 1; compensated PST accrues rounded fee into rep.pst_fee_total_cents; increments RegisteredRepresentative.version by 1"]
  - method: POST
    path: "/outside-activities/{id}/withdraw"
    description: "Owning rep withdraws (compensates approval counts/fees when withdrawing an approved activity)"
    roles: [RegisteredRep]
    code: 200
    input: []
    output: OutsideActivityRequest
    side_effects: ["compensating reversal of count and fee when prior status was APPROVED / APPROVED_WITH_CONDITIONS"]
  - method: POST
    path: "/outside-activities/{id}/revoke"
    description: "Principal revokes an approved activity"
    roles: [CompliancePrincipal]
    code: 200
    input: [reason]
    output: OutsideActivityRequest
    side_effects: ["compensating reversal of count and fee"]
  - method: POST
    path: "/outside-activities/{id}/resume"
    description: "SUSPENDED_REVIEW -> SUBMITTED; requires the rep to have an ACTIVE heightened supervision plan"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: OutsideActivityRequest
    side_effects: []

  # --- CustomerComplaint ---
  - method: POST
    path: "/complaints"
    description: "Intake a customer complaint"
    roles: [ComplianceAnalyst]
    code: 201
    input: [rep_id, allegation_type, damages_claimed_cents, received_date, "description?"]
    output: CustomerComplaint
    side_effects: ["reportable/report_deadline/provisional_reserve_cents computed; regulatory_status initialized"]
  - method: GET
    path: "/complaints"
    description: "List complaints"
    roles: [Any]
    code: 200
    input: ["rep_id?", "status?", "regulatory_status?", "limit?", "offset?"]
    output: "CustomerComplaint[]"
    side_effects: []
  - method: GET
    path: "/complaints/{id}"
    description: "Get one complaint"
    roles: [Any]
    code: 200
    input: []
    output: CustomerComplaint
    side_effects: []
  - method: PATCH
    path: "/complaints/{id}"
    description: "Amend claimed damages while RECEIVED; recomputes reportability/reserve (both threshold-crossing directions)"
    roles: [ComplianceAnalyst]
    code: 200
    input: [damages_claimed_cents]
    output: CustomerComplaint
    side_effects: ["reportable, provisional_reserve_cents recomputed; regulatory_status flips if threshold crossed"]
  - method: POST
    path: "/complaints/{id}/resolve"
    description: "Resolve with payment figures; computes final reserve; auto-creates CUSTOMER_AWARD disclosure at >= 150000 cents paid"
    roles: [CompliancePrincipal]
    code: 200
    input: [damages_paid_cents, legal_cost_cents]
    output: CustomerComplaint
    side_effects: ["final_reserve_cents computed", "award disclosure cascade per complaint_award_disclosure_trigger"]
  - method: POST
    path: "/complaints/{id}/report"
    description: "File the regulatory report (regulatory axis REQUIRED -> FILED)"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: CustomerComplaint
    side_effects: ["reported_at := current date; is_late_report computed"]

  # --- DisclosureEvent ---
  - method: POST
    path: "/disclosure-events"
    description: "Draft a disclosure event for a rep"
    roles: [ComplianceAnalyst]
    code: 201
    input: [rep_id, event_type, event_date, "description?"]
    output: DisclosureEvent
    side_effects: ["is_sd_trigger and filing_deadline computed"]
  - method: GET
    path: "/disclosure-events"
    description: "List disclosure events"
    roles: [Any]
    code: 200
    input: ["rep_id?", "event_type?", "status?", "limit?", "offset?"]
    output: "DisclosureEvent[]"
    side_effects: []
  - method: GET
    path: "/disclosure-events/{id}"
    description: "Get one disclosure event"
    roles: [Any]
    code: 200
    input: []
    output: DisclosureEvent
    side_effects: []
  - method: POST
    path: "/disclosure-events/{id}/file"
    description: "DRAFT -> FILED; timeliness computed"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: DisclosureEvent
    side_effects: ["filed_at := clock; is_late computed"]
  - method: POST
    path: "/disclosure-events/{id}/acknowledge"
    description: "FILED -> ACKNOWLEDGED; SD-trigger events fire the three-link cascade (rep flags -> branch cycle acceleration -> scheduled inspection reschedule) plus OBA suspension fan-out"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: DisclosureEvent
    side_effects: ["SD cascade L1/L2/L3 per state machine; OBA SUBMITTED -> SUSPENDED_REVIEW fan-out"]

  # --- HeightenedSupervisionPlan ---
  - method: POST
    path: "/supervision-plans"
    description: "Create a heightened supervision plan (OCC on RegisteredRepresentative.version); half-open [start_date, end_date) windows must not overlap the rep's other DRAFT/ACTIVE plans"
    roles: [CompliancePrincipal]
    code: 201
    input: [rep_id, start_date, end_date, conditions, expected_representative_version]
    output: HeightenedSupervisionPlan
    side_effects: ["increments RegisteredRepresentative.version by 1"]
  - method: GET
    path: "/supervision-plans"
    description: "List supervision plans"
    roles: [Any]
    code: 200
    input: ["rep_id?", "status?", "limit?", "offset?"]
    output: "HeightenedSupervisionPlan[]"
    side_effects: []
  - method: GET
    path: "/supervision-plans/{id}"
    description: "Get one plan"
    roles: [Any]
    code: 200
    input: []
    output: HeightenedSupervisionPlan
    side_effects: []
  - method: POST
    path: "/supervision-plans/{id}/activate"
    description: "DRAFT -> ACTIVE; requires rep SD-flagged and no other ACTIVE plan for the rep"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: HeightenedSupervisionPlan
    side_effects: []
  - method: POST
    path: "/supervision-plans/{id}/terminate"
    description: "ACTIVE -> TERMINATED (MANUAL)"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: HeightenedSupervisionPlan
    side_effects: ["terminated_reason := MANUAL"]

  # --- ComplianceMeeting / Attestation ---
  - method: POST
    path: "/meetings"
    description: "Schedule the annual compliance meeting; fans out PENDING attestations to all ACTIVE reps"
    roles: [CompliancePrincipal]
    code: 201
    input: [year, meeting_date]
    output: ComplianceMeeting
    side_effects: ["attestation fan-out per meeting_attestation_fanout"]
  - method: GET
    path: "/meetings"
    description: "List meetings"
    roles: [Any]
    code: 200
    input: ["year?", "status?", "limit?", "offset?"]
    output: "ComplianceMeeting[]"
    side_effects: []
  - method: GET
    path: "/meetings/{id}"
    description: "Get one meeting"
    roles: [Any]
    code: 200
    input: []
    output: ComplianceMeeting
    side_effects: []
  - method: POST
    path: "/meetings/{id}/hold"
    description: "SCHEDULED -> HELD; requires clock date >= meeting_date"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: ComplianceMeeting
    side_effects: ["held_at := clock"]
  - method: POST
    path: "/meetings/{id}/close"
    description: "HELD -> CLOSED; requires every attestation terminal (ATTESTED or OVERDUE)"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: ComplianceMeeting
    side_effects: []
  - method: GET
    path: "/attestations"
    description: "List attestations (both FK filters supported)"
    roles: [Any]
    code: 200
    input: ["meeting_id?", "rep_id?", "status?", "limit?", "offset?"]
    output: "Attestation[]"
    side_effects: []
  - method: GET
    path: "/attestations/{id}"
    description: "Get one attestation"
    roles: [Any]
    code: 200
    input: []
    output: Attestation
    side_effects: []
  - method: POST
    path: "/attestations/{id}/attest"
    description: "Owning rep attests; meeting must be HELD; deadline inclusive"
    roles: [RegisteredRep]
    code: 200
    input: []
    output: Attestation
    side_effects: ["attested_at := clock"]

  # --- WSPDocument ---
  - method: POST
    path: "/wsp-documents"
    description: "Draft a WSP document; version_number assigned per policy_area"
    roles: [ComplianceAnalyst]
    code: 201
    input: [policy_area, title, effective_date]
    output: WSPDocument
    side_effects: ["drafted_by := X-User-ID; version_number computed"]
  - method: GET
    path: "/wsp-documents"
    description: "List WSP documents"
    roles: [Any]
    code: 200
    input: ["policy_area?", "status?", "supersedes_id?", "limit?", "offset?"]
    output: "WSPDocument[]"
    side_effects: []
  - method: GET
    path: "/wsp-documents/{id}"
    description: "Get one WSP document"
    roles: [Any]
    code: 200
    input: []
    output: WSPDocument
    side_effects: []
  - method: POST
    path: "/wsp-documents/{id}/publish"
    description: "DRAFT -> PUBLISHED; SoD vs drafted_by; auto-supersedes the policy area's current PUBLISHED document"
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: WSPDocument
    side_effects: ["published_by := X-User-ID; singleton supersede cascade per wsp_publish_singleton"]

  # --- ExamDocumentRequest ---
  - method: POST
    path: "/exam-requests"
    description: "Log a regulator's books-and-records exam request"
    roles: [ComplianceAnalyst]
    code: 201
    input: [regulator, request_ref, document_type, "branch_id?", due_date]
    output: ExamDocumentRequest
    side_effects: []
  - method: GET
    path: "/exam-requests"
    description: "List exam requests"
    roles: [Any]
    code: 200
    input: ["branch_id?", "status?", "limit?", "offset?"]
    output: "ExamDocumentRequest[]"
    side_effects: []
  - method: GET
    path: "/exam-requests/{id}"
    description: "Get one exam request"
    roles: [Any]
    code: 200
    input: []
    output: ExamDocumentRequest
    side_effects: []
  - method: POST
    path: "/exam-requests/{id}/fulfill"
    description: "Produce the requested record (OPEN/OVERDUE -> FULFILLED); late flag computed"
    roles: [ComplianceAnalyst]
    code: 200
    input: [produced_document_ref]
    output: ExamDocumentRequest
    side_effects: ["fulfilled_at := clock; is_late computed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint, or entity-backed ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, invalid enum member, or negative amount" }
  - { id: ERR_STALE_REPRESENTATIVE_VERSION, http: 412, condition: "expected_representative_version does not match the rep's current version" }
  - { id: ERR_STALE_BRANCH_VERSION, http: 412, condition: "expected_branch_version does not match the branch's current version" }
  - { id: ERR_INSPECTION_GAP_VIOLATION, http: 409, condition: "scheduled_date is less than 300 days after the branch's last CLOSED inspection's completed_date" }
  - { id: ERR_INSPECTION_ALREADY_OPEN, http: 409, condition: "Branch already has an inspection in {SCHEDULED, IN_PROGRESS, AWAITING_REMEDIATION}" }
  - { id: ERR_INSPECTION_INVALID_STATE, http: 409, condition: "start/close invoked from a state the transition does not allow (incl. terminal CLOSED)" }
  - { id: ERR_FINDINGS_STILL_OPEN, http: 409, condition: "AWAITING_REMEDIATION close attempted while findings remain non-terminal" }
  - { id: ERR_FINDING_INVALID_STATE, http: 409, condition: "remediate/adjudicate invoked from a non-matching finding state" }
  - { id: ERR_CORRESPONDENCE_INVALID_STATE, http: 409, condition: "review/resolve-escalation invoked from a non-matching correspondence state (incl. terminal)" }
  - { id: ERR_SOD_ESCALATION_RESOLVER, http: 403, condition: "Escalation resolver X-User-ID equals escalated_by (segregation of duties)" }
  - { id: ERR_ACTIVITY_NOT_PENDING_DECISION, http: 409, condition: "decide/withdraw/revoke/resume invoked from a non-matching OBA state" }
  - { id: ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN, http: 403, condition: "Approval decision for an SD-flagged rep without an ACTIVE heightened supervision plan" }
  - { id: ERR_REP_NOT_ACTIVE, http: 409, condition: "OBA create or decision for a TERMINATED rep" }
  - { id: ERR_NO_ACTIVE_HEIGHTENED_PLAN, http: 409, condition: "resume attempted without an ACTIVE heightened supervision plan for the rep" }
  - { id: ERR_PST_COMP_DETAILS_REQUIRED, http: 422, condition: "Compensated PST approval without estimated_gross_comp_cents > 0" }
  - { id: ERR_PLAN_START_IN_PAST, http: 422, condition: "plan start_date is before the current clock date" }
  - { id: ERR_PLAN_WINDOW_OVERLAP, http: 409, condition: "[start_date, end_date) overlaps another DRAFT/ACTIVE plan of the same rep (touching endpoints allowed)" }
  - { id: ERR_REP_NOT_STATUTORILY_DISQUALIFIED, http: 409, condition: "plan activation for a rep without the SD flag" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "activation while another plan of the same rep is ACTIVE" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "terminate/activate invoked from a non-matching plan state" }
  - { id: ERR_COMPLAINT_NOT_RESOLVABLE, http: 409, condition: "resolve/PATCH invoked on a non-RECEIVED complaint" }
  - { id: ERR_REPORT_NOT_REQUIRED, http: 409, condition: "report invoked while regulatory_status != REQUIRED" }
  - { id: ERR_DISCLOSURE_INVALID_STATE, http: 409, condition: "file/acknowledge invoked from a non-matching disclosure state" }
  - { id: ERR_MEETING_DATE_NOT_REACHED, http: 422, condition: "hold invoked before meeting_date" }
  - { id: ERR_DUPLICATE_MEETING_YEAR, http: 409, condition: "a meeting already exists for the given calendar year" }
  - { id: ERR_MEETING_NOT_HELD, http: 409, condition: "attest/close invoked while meeting is not HELD (attest), or hold/close from non-matching state" }
  - { id: ERR_ATTESTATIONS_STILL_PENDING, http: 409, condition: "meeting close while any attestation remains PENDING" }
  - { id: ERR_NOT_ATTESTATION_OWNER, http: 403, condition: "attest X-User-ID does not equal attestation.rep_id" }
  - { id: ERR_ATTESTATION_NOT_PENDING, http: 409, condition: "attest invoked on a non-PENDING attestation" }
  - { id: ERR_ATTESTATION_DEADLINE_PASSED, http: 422, condition: "attest invoked after attest_deadline" }
  - { id: ERR_WSP_NOT_DRAFT, http: 409, condition: "publish invoked on a non-DRAFT WSP document" }
  - { id: ERR_SOD_WSP_PUBLISHER, http: 403, condition: "WSP publisher X-User-ID equals drafted_by (segregation of duties)" }
  - { id: ERR_EXAM_REQUEST_INVALID_STATE, http: 409, condition: "fulfill invoked on a FULFILLED request" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic terminal/invalid transition (e.g., terminate a TERMINATED rep)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm administrator — reference data (branches, reps) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /branches"
      - "POST /representatives"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints via Any"]
  - name: ComplianceAnalyst
    description: "Compliance operations staff — intake/capture/drafting; cannot decide or publish (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /inspections, POST /inspections/{id}/start"
      - "POST /findings, POST /findings/{id}/remediate"
      - "POST /correspondence-items"
      - "POST /complaints, PATCH /complaints/{id}"
      - "POST /disclosure-events"
      - "POST /wsp-documents"
      - "POST /exam-requests, POST /exam-requests/{id}/fulfill"
    shared_operations: ["all GET endpoints via Any"]
  - name: CompliancePrincipal
    description: "Designated principal — reviews, decisions, filings, plan/meeting supervision, WSP publishing"
    identity: opaque
    exclusive_operations:
      - "POST /representatives/{id}/terminate"
      - "POST /inspections/{id}/close"
      - "POST /findings/{id}/adjudicate"
      - "POST /correspondence-items/{id}/review, POST /correspondence-items/{id}/resolve-escalation"
      - "POST /outside-activities/{id}/decide, /revoke, /resume"
      - "POST /complaints/{id}/resolve, /report"
      - "POST /disclosure-events/{id}/file, /acknowledge"
      - "POST /supervision-plans, POST /supervision-plans/{id}/activate, /terminate"
      - "POST /meetings, POST /meetings/{id}/hold, /close"
      - "POST /wsp-documents/{id}/publish"
    shared_operations: ["all GET endpoints via Any"]
  - name: RegisteredRep
    description: "Registered representative — submits own OBA/PST requests and own attestations"
    identity: "entity_backed:RegisteredRepresentative"
    exclusive_operations:
      - "POST /outside-activities (rep_id := X-User-ID)"
      - "POST /outside-activities/{id}/withdraw (own requests only)"
      - "POST /attestations/{id}/attest (own attestations only)"
    shared_operations: ["all GET endpoints via Any"]
  - name: Any
    description: "Umbrella read role — every authenticated role may call GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
