            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - call: "POST /isps/${isp_id}/activate"
              payload: {}
              as: QIDP
              as_user_id: "${q_id}"
              captures: { isp_stf: $.data.status, isp_vf: $.data.version, isp_ac: $.data.amendment_count }
          assert:
            - "ISP status after amend == AMENDMENT_DRAFT"
            - "ISP status after the full loop == ACTIVE (cycle closed back to origin)"
            - "ISP.amendment_count == 1"
            - "ISP.version == 8 (v4 at first activation + 4 mutations: amend, submit, approve, activate)"

      - name: evv_parallel_dimensions_verification_x_billing
        grounds:
          - state_machines.EVVVisit
          - entities.EVVVisit.fields.verification_status
