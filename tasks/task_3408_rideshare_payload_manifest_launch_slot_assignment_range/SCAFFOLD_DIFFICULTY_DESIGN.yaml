            - "GET /rideshare/separation-events?mission_id=${m_id} returns exactly 1 row with sequence_index == 0 and offset_seconds == 0 and status PLANNED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_until_latest_safety_review_approves
        grounds:
          - state_machines.ManifestAssignment.PROVISIONAL_to_CONFIRMED
          - entities.SafetyReview.fields.decision
        distinguishing_aspect: |
          Entity pair ManifestAssignment -> SafetyReview: confirm is gated on the LATEST review's
          decision. With verifications PASSED and license GRANTED but the newest review REJECT,
          confirm fails 409; after a newer APPROVE review the same confirm succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission, DSP-A, contract signed with PL1 100 kg RING_15 SSO; customer license GRANTED; A1 PROVISIONAL with MECHANICAL+ELECTRICAL PASSED (recorded by eng-1); one SafetyReview with decision REJECT (by so-1)."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "REJECT", rationale: "wiring harness doubt" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
              captures: { err: $.data.error_id }
            - call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "harness reworked and re-inspected" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
          assert:
            - "first confirm returns 409 and err == ERR_SAFETY_REVIEW_REQUIRED (latest review is REJECT)"
            - "second confirm returns 200 and ManifestAssignment.${a1}.status == CONFIRMED (latest review is APPROVE)"
            - "GET /rideshare/assignments/${a1}/safety-reviews returns exactly 2 rows"

      - name: range_confirm_blocked_until_launch_license_granted
        grounds:
          - state_machines.RangeSlot.RESERVED_to_CONFIRMED
          - entities.RegulatoryLicense.fields.status
          - errors.ERR_LICENSE_NOT_GRANTED
        distinguishing_aspect: |
          Entity pair RangeSlot -> RegulatoryLicense: slot confirm is gated on the MISSION holding
          a GRANTED LAUNCH_AUTHORIZATION. With the license missing, confirm fails 422; after the
          license is filed and GRANTED, the same confirm succeeds and the mission auto-advances.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission MANIFEST_LOCKED (one CONFIRMED assignment locked). CCAFS slot [2026-10-10, 2026-10-20] RESERVED. No LAUNCH_AUTHORIZATION license exists yet."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - *d_slot
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
            - *d_lic_mission
            - *d_lic_mission_grant
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
          assert:
            - "first confirm returns 422 and err == ERR_LICENSE_NOT_GRANTED"
            - "second confirm returns 200 and RangeSlot.${s1}.status == CONFIRMED"
            - "Mission.${m_id}.status == RANGE_SCHEDULED (auto-advanced by the confirm)"
            - "RegulatoryLicense.${lic_m_id}.composite_score == 87"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: range_reserve_respects_exactly_45_minute_turnaround
        grounds:
          - calculations.range_slot_overlap
          - errors.ERR_RANGE_WINDOW_CONFLICT
          - endpoints.POST_/rideshare/range-slots/{id}/reserve
        distinguishing_aspect: |
          RangeSlot-vs-RangeSlot semantics: an inter-slot turnaround buffer of 45 minutes with
          >= acceptance. A slot starting 44 minutes after a RESERVED slot's close is rejected;
          exactly 45 minutes is allowed (boundary belongs to the allowed side).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission-1 (window 2026-10-10..2026-10-20) holds CCAFS slot S1 [2026-10-10T00:00:00Z, 2026-10-12T00:00:00Z] RESERVED. Mission-2 exists for follow-on requests."
          setup_api_calls:
            - *d_clock
            - *d_mission
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "CCAFS", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-12T00:00:00Z" }
              as: RangeOfficer
              captures: { s1: $.data.id }
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X4", target_orbit: "SSO", window_open_utc: "2026-10-12T00:00:00Z", window_close_utc: "2026-10-16T00:00:00Z", mass_capacity_kg: 50, volume_capacity_m3: 1.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m2_id}", range_code: "CCAFS", window_open_utc: "2026-10-12T00:44:00Z", window_close_utc: "2026-10-14T00:00:00Z" }
              as: RangeOfficer
              captures: { s2: $.data.id }
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m2_id}", range_code: "CCAFS", window_open_utc: "2026-10-12T00:45:00Z", window_close_utc: "2026-10-14T00:00:00Z" }
              as: RangeOfficer
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /rideshare/range-slots/${s2}/reserve"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
            - call: "POST /rideshare/range-slots/${s3}/reserve"
              payload: {}
              as: RangeOfficer
          assert:
            - "S2 (gap 44 minutes) reserve returns 422 and err == ERR_RANGE_WINDOW_CONFLICT"
            - "S2 stays REQUESTED (a failed reserve never occupies the range)"
            - "S3 (gap exactly 45 minutes) reserve returns 200 and RangeSlot.${s3}.status == RESERVED"

      - name: cola_touching_slot_confirms_overlapping_slot_rejected
        grounds:
          - calculations.exclusion_window_checks
          - errors.ERR_COLA_CONFLICT
          - endpoints.POST_/rideshare/range-slots/{id}/confirm
        distinguishing_aspect: |
          RangeSlot-vs-ExclusionWindow semantics: pure half-open intersection with NO buffer —
          a slot whose close equals the COLA window's start does NOT intersect and confirms,
          while a slot overlapping the COLA window by 12 hours is rejected. Different resource
          pair and different interval semantics than the turnaround-buffer rule.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Two SSO missions, each with a CONFIRMED-then-locked manifest and a GRANTED launch license (valid_until 2026-12-31). COLA-touch window [2026-10-21T00:00:00Z, 2026-10-23T00:00:00Z) exists before S1 confirms; COLA-overlap window [2026-10-20T12:00:00Z, 2026-10-23T00:00:00Z) is published only after S1 is CONFIRMED."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X5", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 6.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "POST /rideshare/missions/${m2_id}/dispenser-ports"
              payload: { port_code: "DSP-A", stack_position: 4, max_mass_kg: 150, supported_interface_classes: ["RING_15", "RING_24"] }
              as: MissionOps
              captures: { p_a2: $.data.id }
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - call: "GET /rideshare/missions/${m2_id}"
              payload: {}
              as: MissionOps
              captures: { m2_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m2_id}", payload_id: "${pl2}", dispenser_port_id: "${p_a2}", expected_mission_version: "${m2_v1}" }
              as: MissionOps
              captures: { a2: $.data.id }
            - call: "POST /rideshare/assignments/${a2}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - call: "POST /rideshare/assignments/${a2}/verifications"
              payload: { check_type: "ELECTRICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - call: "POST /rideshare/assignments/${a2}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "interfaces nominal" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /rideshare/assignments/${a2}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m2_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - *d_lic_mission
            - *d_lic_mission_grant
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "MISSION", kind: "LAUNCH_AUTHORIZATION", mission_id: "${m2_id}", valid_until: "2026-12-31T00:00:00Z", debris_score: 90, spectrum_score: 80, operator_history_score: 90 }
              as: MissionOps
              captures: { lic_m2_id: $.data.id }
            - call: "POST /rideshare/licenses/${lic_m2_id}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - call: "POST /rideshare/exclusion-windows"
              payload: { scope_type: "ORBIT", scope_value: "SSO", kind: "COLA", start_utc: "2026-10-21T00:00:00Z", end_utc: "2026-10-23T00:00:00Z" }
              as: RangeOfficer
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "CCAFS", window_open_utc: "2026-10-09T00:00:00Z", window_close_utc: "2026-10-21T00:00:00Z" }
              as: RangeOfficer
              captures: { s1: $.data.id }
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/exclusion-windows"
              payload: { scope_type: "ORBIT", scope_value: "SSO", kind: "COLA", start_utc: "2026-10-20T12:00:00Z", end_utc: "2026-10-23T00:00:00Z" }
              as: RangeOfficer
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m2_id}", range_code: "VAFB", window_open_utc: "2026-10-09T00:00:00Z", window_close_utc: "2026-10-21T00:00:00Z" }
              as: RangeOfficer
              captures: { s2: $.data.id }
            - call: "POST /rideshare/range-slots/${s2}/reserve"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/range-slots/${s2}/confirm"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "S1 (slot close 2026-10-21T00:00:00Z == COLA-touch start) confirmed 200 earlier: touching half-open intervals do not intersect"
            - "Mission.${m_id}.status == RANGE_SCHEDULED"
            - "S2 confirm returns 422 and err == ERR_COLA_CONFLICT (slot overlaps the COLA-overlap window 2026-10-20T12:00:00Z..2026-10-21T00:00:00Z)"
            - "RangeSlot.${s2}.status is still RESERVED and Mission.${m2_id}.status is still MANIFEST_LOCKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assign_then_remove_restores_committed_mass_and_volume
        grounds:
          - calculations.manifest_commitment
          - state_machines.ManifestAssignment.PROVISIONAL_to_REMOVED
        distinguishing_aspect: |
          Conserved quantity: mission commitment fields obey committed_mass_kg == sum of mass_kg
          over live assignments (and likewise volume). The forward action (assign PL2, 50 kg /
          1.0 m3) paired with its compensating action (remove that assignment) returns both
          fields to their exact pre-action values 100 / 2.0 — no drift.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission (300 kg / 6.0 m3), ports DSP-A and DSP-B; contract signed with PL1 100 kg RING_15 and PL2 50 kg CUBESAT; A1 = PL1 on DSP-A (PROVISIONAL). Baseline: committed_mass_kg == 100, committed_volume_m3 == 2.0."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_port_b
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /rideshare/assignments/${a2}/remove"
              payload: { reason_code: "SCHEDULE_CHANGE" }
              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
          assert:
            - "after the pair, Mission.${m_id}.committed_mass_kg == 100 (exactly the pre-assign baseline)"
            - "Mission.${m_id}.committed_volume_m3 == 2.0"
            - "Mission.${m_id}.firm_mass_kg == 0 (both assignments are non-CONFIRMED: A1 PROVISIONAL, A2 REMOVED)"
            - "Payload.${pl2}.status == REGISTERED and ManifestAssignment.${a2}.status == REMOVED"
            - "LaunchContract.${ct_id}.status == MANIFESTED (PL1 still live, so no revert)"

      - name: confirm_then_delay_releases_range_capacity_for_next_operator
        grounds:
          - calculations.range_slot_overlap
          - state_machines.RangeSlot.CONFIRMED_to_RELEASED
          - state_machines.Mission.RANGE_SCHEDULED_to_MANIFEST_LOCKED
        distinguishing_aspect: |
          Conserved quantity: the count of active ({RESERVED, CONFIRMED}) slot windows on range
          CCAFS. The forward action (confirm S1) holds one window; the compensating delay cascade
          releases it, after which a previously-conflicting slot S2 from another operator's
          mission reserves successfully — the range's occupation count returns through 1 -> 0 -> 1.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission-1 launch-ready with contract window [2026-10-01, 2026-11-30] (delay-safe), CCAFS slot S1 [2026-10-10, 2026-10-20] CONFIRMED, RANGE_SCHEDULED. Mission-2 (SSO, window 2026-10-20..2026-10-25) requests CCAFS slot S2 [2026-10-20T00:30:00Z, 2026-10-22T00:00:00Z] whose 30-minute gap violates the turnaround buffer against S1."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-11-30T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - *d_lic_mission
            - *d_lic_mission_grant
            - *d_slot
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X6", target_orbit: "SSO", window_open_utc: "2026-10-20T00:00:00Z", window_close_utc: "2026-10-25T00:00:00Z", mass_capacity_kg: 50, volume_capacity_m3: 1.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m2_id}", range_code: "CCAFS", window_open_utc: "2026-10-20T00:30:00Z", window_close_utc: "2026-10-22T00:00:00Z" }
              as: RangeOfficer
              captures: { s2: $.data.id }
            - call: "POST /rideshare/range-slots/${s2}/reserve"
              payload: {}
              as: RangeOfficer
              captures: { err_first: $.data.error_id }
          trigger:
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-11-01T00:00:00Z", new_window_close_utc: "2026-11-10T00:00:00Z", reason_code: "RANGE_CONFLICT" }
              as: MissionOps
              captures: { delay_id: $.data.id }
            - call: "POST /rideshare/range-slots/${s2}/reserve"
              payload: {}
              as: RangeOfficer
          assert:
            - "first S2 reserve returned 422 and err_first == ERR_RANGE_WINDOW_CONFLICT (30-minute gap vs S1 CONFIRMED)"
            - "after the delay, RangeSlot.${s1}.status == RELEASED (compensating action freed the range)"
            - "DelayEvent.${delay_id}.slot_released == true and assignments_removed_count == 0 (contract window 2026-11-30 covers the new window)"
            - "ManifestAssignment.${a1}.status is still INTEGRATED (selective cascade)"
            - "second S2 reserve returns 200 and RangeSlot.${s2}.status == RESERVED (occupation count back to 1)"
