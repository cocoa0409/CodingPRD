        distinguishing_aspect: "The curve is append-only at exactly one position: on a job with sample_count == 0 a seq of 2 is rejected (no gaps), and after seq 1 is accepted a replay of seq 1 is rejected too (no overwrite). Both failures leave sample_count untouched, so the sequence cannot be walked forward by a rejected call."
