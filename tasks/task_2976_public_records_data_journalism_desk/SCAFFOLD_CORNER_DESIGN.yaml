      - name: records_request_system_fields_are_generated_from_the_caller_identity
        claim_type: system_fields
        grounds:
          - entities.RecordsRequest.fields.requester_user_id
          - entities.Appeal.fields.filed_by_user_id
          - entities.EnclaveSession.fields.opened_by_user_id
        distinguishing_aspect: |
          The three `source: system` identity fields are stamped from the X-User-ID header and appear in
          no endpoint's `input:` at all, so they cannot be spoofed through the body: two different
          coordinators submitting against the same desk must produce two different requester_user_id
          values. This is what makes the desk's audit trail (and SS1.7 segregation of duties) meaningful.
        test_recipe:
          setup:
            - "One Desk and one Agency; two RecordsRequests created by two different RecordsCoordinator users."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v1: $.data.version }
          trigger:
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Filed by coordinator one", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v1}" }
              as: RecordsCoordinator
              as_user_id: "coord-001"
              captures: { req1_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v2: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Filed by coordinator two", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v2}" }
              as: RecordsCoordinator
              as_user_id: "coord-002"
              captures: { req2_id: $.data.id }
          assert:
            - "trigger call 1: RecordsRequest.requester_user_id == \"coord-001\", id is a non-empty string, created_at and updated_at are ISO-8601 instants, version == 1"
            - "trigger call 3: RecordsRequest.requester_user_id == \"coord-002\" - the field tracks the caller, not the desk or the payload"
            - "the two requests have distinct id values and distinct requester_user_id values"
            - "requester_user_id appears in no endpoint's declared input, so no request body can set it"
            - "after trigger call 3: Desk.open_request_count == 2 and Desk.version == ${desk_v2} + 1"

      - name: agency_creation_rejects_bad_enums_and_out_of_range_numbers
        claim_type: type_constraints
        grounds:
          - validations[priority=50]
          - entities.Agency.fields.jurisdiction_code
          - entities.Agency.fields.deadline_basis
          - entities.Agency.fields.initial_response_days
          - entities.Agency.fields.page_fee_cents
        distinguishing_aspect: |
          Each SS1.1 constraint clause is independently enforced at priority 50: the charset rule on
          jurisdiction_code (uppercase and hyphen only) rejects a lowercase code that is otherwise the
          right length, the closed range on initial_response_days rejects 61 but accepts 60, and an enum
          field rejects a plausible-but-undeclared member ("WEEKDAYS"). Accepting the boundary value 60
          in the same instance proves the range is inclusive rather than merely narrow.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
          trigger:
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "ca-state", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 61, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "WEEKDAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { e3: $.data.error_id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "CALENDAR_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 1001, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { e4: $.data.error_id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 60, deadline_basis: "CALENDAR_DAYS", tolling_allowed: false, appeal_venue: "COURT", appeal_decision_days: 90, search_fee_cents_per_hour: 50000, page_fee_cents: 1000, max_waiver_cents: 0 }
              as: ManagingEditor
              captures: { agency_ok_id: $.data.id }
          assert:
            - "trigger calls 1-4 each return HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "trigger call 1 is rejected for charset (jurisdiction_code must be uppercase letters and hyphen only), not for length"
            - "trigger call 2 is rejected because initial_response_days 61 is above the inclusive maximum 60"
            - "trigger call 3 is rejected because \"WEEKDAYS\" is outside {BUSINESS_DAYS, CALENDAR_DAYS}"
            - "trigger call 4 is rejected because page_fee_cents 1001 is above the inclusive maximum 1000"
            - "trigger call 5: HTTP 201 - every value sits exactly on an inclusive bound (initial_response_days 60, appeal_decision_days 90, search_fee_cents_per_hour 50000, page_fee_cents 1000, max_waiver_cents 0)"
            - "after all five calls exactly one Agency exists: GET /records-desk/agencies/${agency_ok_id} returns HTTP 200"

      - name: agency_is_immutable_and_exposes_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.Agency
          - endpoints[GET /records-desk/agencies/{id}]
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          Agency is the scaffold's only `common_fields: false` entity: it carries id and created_at only,
          with no version and no updated_at, and SS1.5 declares no mutation endpoint for it at all. That
          is what lets every RecordsRequest read Agency.initial_response_days, deadline_basis and
          holiday_dates as frozen statutory parameters - a mutable Agency would silently re-date every
          already-stamped deadline. No OCC token is therefore required, or accepted, anywhere for it.
        test_recipe:
          setup:
            - "One Agency, and one submitted RecordsRequest whose deadlines were stamped from it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Immutability probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
          trigger:
            - call: "GET /records-desk/agencies/${agency_id}"
              as: LegalCounsel
          assert:
            - "HTTP 200; data.id == \"${agency_id}\" and every input field is echoed unchanged, including holiday_dates == [\"2026-09-07\"]"
            - "the response body contains NO \"version\" key and NO \"updated_at\" key - Agency declares common_fields: false, so it exposes id and created_at only and can never be versioned"
            - "SS1.5 declares exactly two Agency endpoints - POST /records-desk/agencies and GET /records-desk/agencies/{id} - so there is no update or delete surface"
            - "no endpoint in SS1.5 accepts an expected_agency_version input, and SS1.2.1 declares no concurrency rule with parent_entity Agency"
            - "RecordsRequest.${req_id}.due_at_strict == \"2026-08-17T23:59:59.000Z\" was stamped from this frozen Agency row"

      - name: field_definition_requires_an_existing_parent_dataset
        claim_type: parent_relationships
        grounds:
          - entities.FieldDefinition.fields.dataset_id
          - validations[priority=40]
          - validations[priority=60]
          - errors[ERR_DATASET_NOT_FOUND]
          - errors[ERR_FIELD_NOT_FOUND]
        distinguishing_aspect: |
          FieldDefinition is the scaffold's only nested sub-resource, so it has two distinct parent
          checks: an unresolvable dataset in the PATH is a priority-40 ERR_DATASET_NOT_FOUND, while a
          field_definition_id that exists but belongs to a DIFFERENT dataset is ERR_FIELD_NOT_FOUND -
          not a 403 and not a silent cross-dataset suppression. The second is the one that stops a
          suppression from being applied to another investigation's column.
        test_recipe:
          setup:
            - "One Desk, one Agency, two RecordsRequests, one Investigation and two RAW Datasets ds-a and ds-b, each with one FieldDefinition."
          setup_api_calls:
