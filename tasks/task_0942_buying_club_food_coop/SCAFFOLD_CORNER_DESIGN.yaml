  - name: a_request_without_auth_headers_returns_unauthenticated
    claim_type: other_roles_denied
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: Priority 1 runs before existence at 4 and before the role rung at 3, so a request carrying neither X-User-Role nor X-User-ID is refused with 401 even when its path id is perfectly valid. The test issues this call with both headers omitted.
