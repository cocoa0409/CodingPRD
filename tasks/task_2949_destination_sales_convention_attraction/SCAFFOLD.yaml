    roles: [BureauAdmin]
    code: 201
    input: [amount, received_at]
    output: LodgingTaxReceipt
    side_effects: ["IncentiveFund.lodging_tax_receipts_total and budget_amount increased by amount", "uncommitted_amount recomputed and posture re-derived per state_machines.IncentiveFund", "increments IncentiveFund.version by 1"]

  - method: GET
    path: "/incentive-funds/{id}/lodging-tax-receipts"
    description: "Lists the remittance lines credited to one fund (FK reverse-reachability for LodgingTaxReceipt.fund_id)."
    roles: [BureauAdmin, BoardAnalyst]
    code: 200
