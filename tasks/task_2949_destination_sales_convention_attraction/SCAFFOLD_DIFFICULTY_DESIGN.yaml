        distinguishing_aspect: |
          Every gate that lives on the BidPackage itself is satisfied - status APPROVED, two distinct support
          letter types, coverage 90.00, cutoff spread 0, response_due_at in the future - and the call still
          fails, because the decisive state sits on a THIRD entity: the opportunity's only SpaceHold was
          released and nothing is HELD, CHALLENGED or CONFIRMED. Re-holding the hall makes the identical
