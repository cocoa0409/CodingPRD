              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/extra-pickups"
              payload: { requested_date: "2026-03-27T00:00:00Z", bulk_item_count: 1 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { epr1_id: $.data.id }
            - call: "POST /extra-pickups/${epr1_id}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/extra-pickups"
              payload: { requested_date: "2026-03-27T00:00:00Z", bulk_item_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { epr2_id: $.data.id }
          trigger:
            - call: "POST /extra-pickups/${epr2_id}/schedule"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_DATE_DOUBLE_BOOKED"
      - name: address_uniqueness_overlap_across_active_accounts
        grounds:
          - validations[priority=10]
          - entities.ServiceAccount.fields.service_address
          - entities.ServiceAccount.fields.status
        distinguishing_aspect: |
          Different interval semantics on the ServiceAccount resource: address occupancy is an
          open-ended status-window {PENDING_START, ACTIVE, SUSPENDED} (no calendar date) — creating a
          second account with the same service_address while the first occupies that window is rejected
          ERR_ADDRESS_IN_USE, unlike the single-day point collision above.
        test_recipe:
          setup:
            - "One ACTIVE account at '40 Oak St'."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
