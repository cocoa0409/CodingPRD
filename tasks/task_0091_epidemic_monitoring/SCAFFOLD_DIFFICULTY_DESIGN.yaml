scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: region_tier_provisional_vs_final
        grounds:
          - calculations.case_density_risk_score
          - state_machines.RiskTierDecision.PROVISIONAL_to_UNDER_REVIEW
          - state_machines.RiskTierDecision.APPROVED_to_PUBLISHED
          - entities.Region.fields.provisional_risk_tier
          - entities.Region.fields.current_risk_tier
        distinguishing_aspect: |
          Operates on the Region entity domain: same Case + ContactEvent inputs produce one tier
          via the provisional_auto variant (writes Region.provisional_risk_tier) and a potentially
          different tier via the final_expert_override variant (writes Region.current_risk_tier on
          publish), so Region.provisional_risk_tier and Region.current_risk_tier can differ
          for identical underlying epidemiological data.
        test_recipe:
          setup:
            - "Create Region R with district_code='D1' and population=100000"
            - "Register two CONFIRMED Cases in district D1 for distinct Persons via POST /epi/cases"
            - "Register one ASYMPTOMATIC Case in district D1 via POST /epi/cases"
            - "No ContactEvents ingested (chain_count = 0)"
          trigger:
            - "POST /epi/regions/{R.id}/recompute-risk -> creates RiskTierDecision rd in PROVISIONAL with provisional_tier=LOW"
            - "POST /epi/risk-decisions/{rd.id}/submit-review"
            - "POST /epi/risk-decisions/{rd.id}/approve with final_tier=HIGH"
            - "POST /epi/risk-decisions/{rd.id}/publish"
          assert:
            - "After recompute: Region.provisional_risk_tier == 'LOW' (density = (2*3+1*1)/100000 * 100000 = 7.00; score = 7.00 + 0*5 = 7.00 < 10.00 threshold)"
            - "After publish: Region.current_risk_tier == 'HIGH' (overridden by expert final_tier)"
            - "rd.provisional_tier == 'LOW' and rd.final_tier == 'HIGH' on the SAME RiskTierDecision row"

      - name: person_exposure_chronological_vs_projection
        grounds:
          - calculations.contact_exposure_score
          - endpoints.GET /epi/persons/{id}/exposure-score
          - entities.ContactEvent.fields.tier
        distinguishing_aspect: |
          Operates on the Person entity domain (different from Region above): the same set of
          ContactEvent rows yields one numeric score via the chronological_replay variant
          (decay applied) and a higher score via the forward_looking_projection variant
          (decay disabled for recent events), so the two reads of the same Person at the same
          moment return divergent contact_exposure_score values.
        test_recipe:
          setup:
            - "Create Person P_src and Person P_tgt"
            - "Advance clock so 'now' is fixed at T0"
            - "POST /epi/contact-events with source=P_src, target=P_tgt, type=HOUSEHOLD, distance=1.0, duration=60, event_time=T0-7 days"
          trigger:
            - "GET /epi/persons/{P_tgt.id}/exposure-score (default chronological_replay)"
            - "GET /epi/persons/{P_tgt.id}/exposure-score?projection=true"
          assert:
            - "chronological_replay response.data.contact_exposure_score == 5.00 (raw=10*1.0*1, decay = max(0, 1 - 7/14) = 0.5, score = 10 * 0.5 = 5.00)"
            - "forward_looking_projection response.data.contact_exposure_score == 10.00 (decay forced to 1.0 for projection)"
            - "chronological_replay score < projection score for the SAME Person and SAME ContactEvent set"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: case_density_tiered_selection
        grounds:
          - calculations.case_density_risk_score
        distinguishing_aspect: |
          Mode (a): formula uses four inputs (confirmed_count, asymptomatic_count, chain_count,
          population) with non-linear interaction (multiplicative weight then tiered threshold
          selection HIGH/MEDIUM/LOW with top-down first-match evaluation). The tier band selected
          depends on threshold ordering that the scaffold pins explicitly.
        test_recipe:
          setup:
            - "Create Region R with population=100000"
            - "Insert 16 CONFIRMED Cases for distinct Persons in district D1 over 7 days (within TIER_WINDOW_DAYS=14)"
            - "Insert 2 ASYMPTOMATIC Cases for distinct Persons in district D1"
            - "Insert ContactEvents that form exactly 1 connected component spanning persons with cases"
          trigger:
            - "POST /epi/regions/{R.id}/recompute-risk"
          assert:
            - "density_per_100k computed as (16*3 + 2*1)/100000 * 100000 = 50.00 (rounded to 2 decimals)"
            - "score = 50.00 + 1*5 = 55.00 (final sum)"
            - "Region.provisional_risk_tier == 'HIGH' (55.00 >= TIER_HIGH_THRESHOLD 50.00; first-match-wins top-down evaluation)"

      - name: supply_allocation_rounding_order
        grounds:
          - calculations.supply_allocation_distribution
          - state_machines.SupplyRequest.PENDING_to_ALLOCATED
        distinguishing_aspect: |
          Mode (b): nested allocation order matters. Scaffold pins the order as (priority_score DESC,
          created_at ASC, id ASC) and integer units with NO proportional split — different sort
          orders or proportional allocation would distribute units differently across the same
          requests, producing different per-request allocated_quantity values.
        test_recipe:
          setup:
            - "Create SupplyItem with sku='PPE_MASK', category='PPE', reserve_quantity=100"
            - "Create Region R_HIGH (district='D1', population=100000) and Region R_LOW (district='D2', population=100000)"
            - "Force R_HIGH.current_risk_tier='HIGH' via expert-approved decision publish"
            - "Register institutions inst_A in district D1 and inst_B in district D2"
            - "POST /epi/supply-requests sku=PPE_MASK, requesting_institution_id=inst_A.id, requested_quantity=80 (Request A)"
            - "POST /epi/supply-requests sku=PPE_MASK, requesting_institution_id=inst_B.id, requested_quantity=50 (Request B)"
          trigger:
            - "POST /epi/supply/allocate-batch with sku='PPE_MASK'"
          assert:
            - "Request A.allocated_quantity == 80 (priority_score = TIER_WEIGHT_HIGH(100) + CATEGORY_WEIGHT_PPE(5) = 105, sorted first, fully allocated)"
            - "Request B.allocated_quantity == 20 (priority_score = TIER_WEIGHT_LOW(0) + CATEGORY_WEIGHT_PPE(5) = 5, sorted second, gets remaining 100-80 = 20)"
            - "Request A.allocated_quantity + Request B.allocated_quantity == 100 (no fractional, no rounding remainder, sum equals available)"

      - name: isolation_release_circular_dependency
        grounds:
          - calculations.isolation_release_eligibility
          - state_machines.Isolation.ACTIVE_to_RELEASED
          - state_machines.Isolation.ACTIVE_to_EXTENDED
        distinguishing_aspect: |
          Mode (c): a circular-looking evaluation pinned by explicit order. RELEASE depends on
          'negative_tests >= 2', but each NEGATIVE TestOrder must have collected_at > start_date
          AND the test must have been ingested within TEST_VALIDITY_HOURS of collection (which
          depends on the clock advance order). The scaffold pins evaluation top-down: min-days
          first, abnormal next, count next, distinct-dates last — guaranteeing well-defined output.
        test_recipe:
          setup:
            - "Create Person P, Isolation I (mode=HOME, start_date=T0)"
            - "Advance clock to T0 + 5 days; collect TestOrder1, ingest NEGATIVE PCR result"
            - "Advance clock to T0 + 9 days; collect TestOrder2, ingest NEGATIVE PCR result"
          trigger:
            - "Advance clock to T0 + 10 days"
            - "POST /epi/isolations/{I.id}/check-release"
          assert:
            - "Response.data.status == 'RELEASED' (min-days >=10 passes, abnormal=0, negative_tests=2, distinct_dates=2)"
            - "Person.isolation_status == 'RELEASED'"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tracing_task_revision_cycle
        grounds:
          - state_machines.TracingTask.COMPLETED_to_NEEDS_REVISION
          - state_machines.TracingTask.NEEDS_REVISION_to_IN_PROGRESS
          - state_machines.TracingTask.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Cycle on TracingTask: IN_PROGRESS -> COMPLETED -> NEEDS_REVISION -> IN_PROGRESS
          forms a true loop (revision rounds). After traversing the loop the task can re-enter
          COMPLETED and from there CLOSED. This is structurally a cyclic shape on TracingTask,
          distinct from the branching shape on Isolation below.
        test_recipe:
          setup:
            - "Create Case C, dispatch TracingTask T"
            - "Accept T (DISPATCHED -> IN_PROGRESS)"
            - "Complete T (IN_PROGRESS -> COMPLETED)"
          trigger:
            - "POST /epi/tracing-tasks/{T.id}/reject (COMPLETED -> NEEDS_REVISION)"
            - "POST /epi/tracing-tasks/{T.id}/accept (NEEDS_REVISION -> IN_PROGRESS)"
            - "POST /epi/tracing-tasks/{T.id}/complete (IN_PROGRESS -> COMPLETED, second time)"
          assert:
            - "T.status transitions follow IN_PROGRESS->COMPLETED->NEEDS_REVISION->IN_PROGRESS->COMPLETED (cycle observed)"
            - "T.status == 'COMPLETED' at end"

      - name: isolation_branching_release_or_violation
        grounds:
          - state_machines.Isolation.ACTIVE_to_RELEASED
          - state_machines.Isolation.ACTIVE_to_VIOLATED_TERMINATED
          - state_machines.Isolation.ACTIVE_to_EXTENDED
          - state_machines.Isolation.EXTENDED_to_RELEASED
          - state_machines.Isolation.EXTENDED_to_VIOLATED_TERMINATED
        distinguishing_aspect: |
          Branching fork on the Isolation entity (different entity from TracingTask above):
          ACTIVE forks into EXTENDED (revisit) or RELEASED (terminal A) or VIOLATED_TERMINATED
          (terminal B) with divergent side_effect sets — RELEASE decrements facility occupied AND
          sets Person.isolation_status=RELEASED, while VIOLATED_TERMINATED increments violations_count
          AND sets Person.isolation_status=VIOLATED_TERMINATED. The two terminal branches produce
          divergent side effects on Person and IsolationFacility.
        test_recipe:
          setup:
            - "Create two Isolations I_a (mode=CENTRALIZED in facility F) and I_b (mode=CENTRALIZED in facility F)"
            - "F.capacity == 2, F.occupied == 2 (both occupied)"
          trigger:
            - "Advance clock to start_date + ISOLATION_MIN_DAYS_CENTRALIZED + 1 day"
            - "Set up two NEGATIVE PCR tests for I_a's person; POST /epi/isolations/{I_a.id}/check-release -> RELEASED"
            - "POST /epi/isolations/{I_b.id}/violation -> VIOLATED_TERMINATED"
          assert:
            - "I_a.status == 'RELEASED' and Person_a.isolation_status == 'RELEASED' and facility.occupied decremented"
            - "I_b.status == 'VIOLATED_TERMINATED' and Person_b.isolation_status == 'VIOLATED_TERMINATED' and I_b.violations_count == 1"
            - "F.occupied == 0 (both decrements observed); F.status == 'OPEN'"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: test_result_to_case_to_region_tier
        grounds:
          - state_machines.TestOrder.COLLECTED_to_RESULTED
          - state_machines.Case.UNDER_TRACING_to_CONFIRMED
          - calculations.case_density_risk_score
          - entities.Region.fields.provisional_risk_tier
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /epi/test-orders/{id}/result. Hop 1: TestOrder
          COLLECTED->RESULTED on a POSITIVE result. Hop 2: that ingestion advances the linked
          Case UNDER_TRACING->CONFIRMED (the Case mutation is caused by the TestOrder mutation,
          NOT a separate API call). Hop 3: the Case advance recomputes Region.provisional_risk_tier
          via case_density_risk_score (the Region mutation is caused by the Case mutation).
        test_recipe:
          setup:
            - "Create Region R with population=100000"
            - "Register Case C in UNDER_TRACING status (case_type=SUSPECTED) for Person P in district of R"
            - "Set 16 other CONFIRMED Cases in district to push provisional tier near boundary"
            - "Initial: Region.provisional_risk_tier == 'MEDIUM' (16*3/100000*100000 = 48.00, score 48.00 -> MEDIUM)"
            - "Create TestOrder T (test_type=PCR) for P; collect"
          trigger:
            - "POST /epi/test-orders/{T.id}/result with result='POSITIVE'"
          assert:
            - "T.status == 'RESULTED' and T.result == 'POSITIVE' (hop 1)"
            - "Case C.case_type == 'CONFIRMED' and C.status == 'CONFIRMED' (hop 2, caused by hop 1)"
            - "Region.provisional_risk_tier == 'HIGH' (hop 3, density now (17*3)/100000*100000 = 51.00 >= 50.00, caused by hop 2)"

      - name: risk_publish_to_supply_priority_to_allocation
        grounds:
          - state_machines.RiskTierDecision.APPROVED_to_PUBLISHED
          - entities.SupplyRequest.fields.priority_score
          - calculations.supply_allocation_distribution
          - state_machines.SupplyRequest.PENDING_to_ALLOCATED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /epi/risk-decisions/{id}/publish (different trigger
          than the TestOrder cascade above). Hop 1: Region.current_risk_tier updated. Hop 2: that
          change recomputes priority_score on all PENDING SupplyRequest rows whose
          requesting_institution.district_code == Region.district_code (caused by hop 1). Hop 3:
          a subsequent allocate-batch run sees the updated priorities and allocates differently
          than it would have under the prior tier (caused by hop 2).
        test_recipe:
          setup:
            - "Create Region R (district='D1', current_risk_tier='LOW'), SupplyItem sku='PPE_MASK' with reserve=100"
            - "Register inst in D1; POST /epi/supply-requests for sku=PPE_MASK, requested=80, requesting_institution_id=inst.id (Request A; priority_score = 0+5 = 5)"
            - "Create competing Request B with requested=50 in a different district at LOW (priority_score=5, but created later than A)"
            - "Create RiskTierDecision rd for R; submit-review; approve with final_tier='HIGH'"
          trigger:
            - "POST /epi/risk-decisions/{rd.id}/publish (hop 1)"
            - "POST /epi/supply/allocate-batch sku='PPE_MASK' (hop 3 trigger)"
          assert:
            - "Region.current_risk_tier == 'HIGH' (hop 1)"
            - "Request A.priority_score == 105 (hop 2, recomputed = TIER_WEIGHT_HIGH(100) + CATEGORY_WEIGHT_PPE(5))"
            - "After allocate-batch: Request A.allocated_quantity == 80, Request B.allocated_quantity == 20 (hop 3, allocation ordering changed by hop 2)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_isolation_violation
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair: 'state' (priority 5) vs 'business_safety' (priority 7). When a violation is recorded
          against an Isolation that is already RELEASED, both checks would trip — the violation
          cannot be recorded against a terminal-status Isolation. The scaffold pins state to fire
          first, so ERR_INVALID_STATE wins over the business_safety duplicate.
        test_recipe:
          setup:
            - "Create Isolation I; complete release flow so I.status == 'RELEASED'"
          trigger:
            - "POST /epi/isolations/{I.id}/violation"
          assert:
            - "Response status == 409 (state check wins)"
            - "Response.data.error_id == 'ERR_INVALID_STATE'"

      - name: business_temporal_vs_business_fiscal_supply_allocation
        grounds:
          - validations[priority=11]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair: 'business_temporal' (priority 11, ERR_ISOLATION_DATE_INVALID) vs 'business_fiscal'
          (priority 16, ERR_SUPPLY_INSUFFICIENT). The two conflicts involve different categories
          from the state vs business_safety pair above. Although these checks live on different
          endpoints, in priority terms the lower-numbered check fires first when both apply on a
          conflated request — confirms scaffold pins a global ordering, not endpoint-local order.
        test_recipe:
          setup:
            - "Create Person P with prior Case onset_date=T0"
            - "Create SupplyItem with reserve=10"
            - "Request 5000 units (would trigger ERR_SUPPLY_INSUFFICIENT)"
          trigger:
            - "POST /epi/isolations with person_id=P.id, mode=HOME, start_date=T0-5 days (BEFORE Case.onset_date -> ERR_ISOLATION_DATE_INVALID)"
            - "Separately: POST /epi/supply-requests/{id}/allocate when reserve insufficient"
          assert:
            - "Isolation POST returns 422 ERR_ISOLATION_DATE_INVALID (priority 11)"
            - "Allocate POST returns 409 ERR_SUPPLY_INSUFFICIENT (priority 16)"
            - "Different categories trip different errors; ordering predictable per priority table"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: case_report_lateness_strict_gt
        grounds:
          - calculations.case_report_lateness
          - entities.Case.fields.is_late_report
          - endpoints.POST /epi/cases
        distinguishing_aspect: |
          Numeric-threshold boundary on Case.report_deadline_at with strict '>': equality means
          on-time. Boundary lives on the POST /epi/cases endpoint (case-reporting flow); different
          metric/endpoint from the empty-collection edge below.
        test_recipe:
          setup:
            - "Advance clock so 'now' = T_NOW"
            - "Onset_date = T_ONSET (= T_NOW - REPORT_LIMIT_HOURS exactly, i.e., 24 hours before now)"
          trigger:
            - "POST /epi/cases with onset_date=T_ONSET (reported_at=T_NOW; reported_at - onset_date = 24h exactly = REPORT_LIMIT_HOURS)"
          assert:
            - "Response.data.is_late_report == false (equality is on-time per strict '>' rule)"
            - "Repeating with onset_date = T_NOW - REPORT_LIMIT_HOURS - 1 second yields is_late_report == true (just over the boundary)"

      - name: tracing_complete_with_zero_contacts
        grounds:
          - state_machines.TracingTask.IN_PROGRESS_to_COMPLETED
          - entities.TracingTask.fields.discovered_contact_count
          - endpoints.POST /epi/tracing-tasks/{id}/complete
        distinguishing_aspect: |
          Empty-collection edge: a TracingTask must be completable with zero ContactEvents
          (discovered_contact_count == 0 is allowed). Different metric (a count edge, not a numeric
          threshold) and different endpoint (POST /epi/tracing-tasks/{id}/complete) from the report-
          lateness boundary above.
        test_recipe:
          setup:
            - "Create Case, dispatch TracingTask T, accept T"
            - "Do NOT ingest any ContactEvent linked to this tracing"
          trigger:
            - "POST /epi/tracing-tasks/{T.id}/complete"
          assert:
            - "T.status == 'COMPLETED' (zero contacts is a valid completion)"
            - "T.discovered_contact_count == 0"
            - "No Isolations auto-created (empty CLOSE set)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_recovery_depends_on_isolation_state
        grounds:
          - state_machines.Case.CONFIRMED_to_RECOVERED
          - entities.Isolation.fields.status
          - entities.Person.fields.isolation_status
        distinguishing_aspect: |
          Entity pair (Case, Isolation): Case.CONFIRMED -> RECOVERED is permitted only when the
          linked Isolation for Case.person_id is in RELEASED. The same person's Isolation must
          itself first reach RELEASED via its own state machine. Different pair from the
          (RiskTierDecision, Region) dependency below.
        test_recipe:
          setup:
            - "Person P, Case C in CONFIRMED, two NEGATIVE PCR test orders for P at distinct dates"
            - "Isolation I for P in ACTIVE (not yet released)"
          trigger:
            - "POST /epi/cases/{C.id}/recover (first attempt while I.status == 'ACTIVE')"
            - "Run release check on I to reach RELEASED, then POST /epi/cases/{C.id}/recover (second attempt)"
          assert:
            - "First attempt returns 409 ERR_INVALID_STATE (Isolation not RELEASED)"
            - "After I.status == 'RELEASED', second attempt succeeds: C.status == 'RECOVERED'"

      - name: risk_decision_publish_depends_on_region_state
        grounds:
          - state_machines.RiskTierDecision.APPROVED_to_PUBLISHED
          - entities.Region.fields.current_risk_tier
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair (RiskTierDecision, Region) — different pair from (Case, Isolation) above.
          The publish transition's precondition reads Region.current_risk_tier and gates on
          (final_tier != current_risk_tier OR first publication). This makes publishing
          conditional on the Region's existing state, not just the RiskTierDecision's own status.
        test_recipe:
          setup:
            - "Create Region R with current_risk_tier='HIGH' (achieved via a prior publish)"
            - "Create new RiskTierDecision rd, approve with final_tier='HIGH' (same as current)"
          trigger:
            - "POST /epi/risk-decisions/{rd.id}/publish (when current_risk_tier already == final_tier and not first publication)"
            - "Create another RiskTierDecision rd2, approve with final_tier='MEDIUM', publish"
          assert:
            - "First publish returns 409 ERR_INVALID_STATE (no-op publish blocked by Region.current_risk_tier == final_tier precondition)"
            - "Second publish succeeds: Region.current_risk_tier == 'MEDIUM' and rd2.status == 'PUBLISHED'"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: isolation_facility_aggregate_capacity
        grounds:
          - entities.IsolationFacility.fields.capacity
          - entities.IsolationFacility.fields.occupied
          - concurrency_rules[facility_at_capacity]
          - validations[priority=12]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on IsolationFacility: an Isolation occupies the
          interval [start_date, actual_end_date) on a bed. Multiple active Isolations may run in
          parallel — overlap is permitted up to capacity (aggregate cap), and only the (capacity+1)-th
          concurrent admission is rejected. Geometric treatment is 'aggregate capacity', not
          adjacency. Different semantics from the chain-of-custody window below.
        test_recipe:
          setup:
            - "Create IsolationFacility F with capacity=2"
            - "Create two CENTRALIZED Isolations I_a and I_b in F (occupied = 2 after both)"
          trigger:
            - "Attempt POST /epi/isolations with mode=CENTRALIZED, facility_id=F.id for a third Person P_c"
          assert:
            - "Response status == 409 ERR_FACILITY_AT_CAPACITY"
            - "F.occupied == 2 (no overflow); I_a and I_b unchanged"

      - name: test_order_validity_window
        grounds:
          - calculations.isolation_release_eligibility
          - entities.TestOrder.fields.collected_at
          - state_machines.TestOrder.COLLECTED_to_RESULTED
          - state_machines.TestOrder.COLLECTED_to_VOID
        distinguishing_aspect: |
          Single-resource freshness-window interval semantics on TestOrder: result ingestion is
          valid only while (now() - collected_at) <= TEST_VALIDITY_HOURS[test_type]. Inclusive '<='
          boundary, no adjacency rule, no aggregate. The result is rejected once the validity
          interval has elapsed. Different interval semantics (single-resource time-since boundary)
          from the aggregate-capacity overlap on IsolationFacility above; sits on a different
          resource entity (TestOrder vs IsolationFacility).
        test_recipe:
          setup:
            - "Create TestOrder T (test_type=PCR), collect; TEST_VALIDITY_HOURS[PCR]=72"
            - "Advance clock by 71 hours (still within window)"
          trigger:
            - "POST /epi/test-orders/{T.id}/result with result='NEGATIVE' (within window)"
            - "Create TestOrder T2 (test_type=PCR), collect; advance clock 73 hours"
            - "POST /epi/test-orders/{T2.id}/result with result='NEGATIVE' (past window)"
          assert:
            - "T result accepted: T.status == 'RESULTED' and T.result == 'NEGATIVE'"
            - "T2 result rejected: response 422 ERR_TEST_RESULT_EXPIRED; T2.status remains 'COLLECTED'"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: supply_allocate_then_cancel_preserves_available
        grounds:
          - state_machines.SupplyRequest.PENDING_to_ALLOCATED
          - state_machines.SupplyRequest.ALLOCATED_to_CANCELLED
          - entities.SupplyItem.fields.reserve_quantity
          - entities.SupplyItem.fields.allocated_quantity
        distinguishing_aspect: |
          Conserved quantity: SupplyItem.reserve_quantity - SupplyItem.allocated_quantity
          ('available reserve'). Forward = allocate decreases available; compensate = cancel an
          ALLOCATED request increases available. The named invariant
          'available_before == available_after' MUST hold after the forward+compensating pair
          for the same units; reserve_quantity itself is unchanged because no dispatch occurred.
        test_recipe:
          setup:
            - "Create SupplyItem with reserve_quantity=100, allocated_quantity=0 (available=100)"
            - "POST /epi/supply-requests (Request A, requested=30); POST /epi/supply-requests/{A.id}/allocate -> A.status=ALLOCATED, A.allocated_quantity=30"
            - "Snapshot available_after_allocate = 100 - 30 = 70"
          trigger:
            - "POST /epi/supply-requests/{A.id}/cancel (compensating action)"
          assert:
            - "SupplyItem.reserve_quantity == 100 (unchanged across forward+compensate)"
            - "SupplyItem.allocated_quantity == 0 (released)"
            - "available_after_compensate (100 - 0 = 100) == available_before_allocate (100)"

      - name: isolation_admit_then_violation_preserves_facility_beds
        grounds:
          - state_machines.Isolation.ACTIVE_to_VIOLATED_TERMINATED
          - entities.IsolationFacility.fields.capacity
          - entities.IsolationFacility.fields.occupied
        distinguishing_aspect: |
          Conserved quantity: IsolationFacility.capacity - IsolationFacility.occupied ('free beds').
          Different from the supply-reserve conserved quantity above. Forward = create CENTRALIZED
          Isolation -> occupied++, free beds--. Compensate = transition that Isolation to
          VIOLATED_TERMINATED -> occupied--, free beds++. The invariant 'free_beds_before ==
          free_beds_after' MUST hold after the forward+compensating pair, and IsolationFacility.capacity
          itself is unchanged.
        test_recipe:
          setup:
            - "Create IsolationFacility F with capacity=3, occupied=0 (free=3)"
            - "Create CENTRALIZED Isolation I in F"
            - "Snapshot free_after_admit = 3 - 1 = 2"
          trigger:
            - "POST /epi/isolations/{I.id}/violation"
          assert:
            - "F.capacity == 3 (unchanged)"
            - "F.occupied == 0 (decremented from 1)"
            - "free_beds_after_compensate (3 - 0 = 3) == free_beds_before_admit (3)"
            - "I.status == 'VIOLATED_TERMINATED' and I.violations_count == 1"
