            - "${err_cross} == ERR_CROSS_TERM_MERGE at HTTP 422 — shell ${x_id} belongs to term ${t2}"
            - "${err_absorbed} == ERR_SHELL_ALREADY_MERGED at HTTP 409 — priority 20 fires for a child that is already absorbed, before the chain rule at 22 is consulted"
            - "${err_chain_parent} == ERR_MERGE_CHAIN_FORBIDDEN at HTTP 422 — here the ABSORBED shell is the parent, which is rule 22, not rule 20"
            - "${err_chain_child} == ERR_MERGE_CHAIN_FORBIDDEN at HTTP 422 — a child with absorbed_child_count 1 cannot itself be absorbed"
            - "${first_mr} == ${m1} and GET /merge-requests reports total_count 1 — none of the four refusals created a MergeRequest row"

      - name: enrollment_creation_refuses_wrong_shell_states_and_conflicting_roles
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHELL_STATE_BLOCKS_ENROLLMENT]
          - errors[ERR_ROLE_CONFLICT]
          - validations[31]
          - validations[35]
        distinguishing_aspect: "Three separate clauses of the role-integrity rule must all return ERR_ROLE_CONFLICT — a second non-DROPPED row for the same (shell, person), a STUDENT row for the shell's own owner, and a STUDENT row alongside an existing TEACHER row — while a REQUESTED shell instead returns ERR_SHELL_STATE_BLOCKS_ENROLLMENT. Implementations that enforce only a naive unique (shell, person) index pass the first and fail the second."
        test_recipe:
          setup:
            - "Term 2026FA REGISTRATION_OPEN; shell SA is PROVISIONED with base_seat_cap 10; shell SB is left REQUESTED; one student S1 exists and the shell owner is prof."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6200", full_name: "Maryam Mirzakhani", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6201", full_name: "Learner E", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "GE140-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { sa: $.data.id }
            - call: "POST /course-shells/${sa}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "GE140-02", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { sb: $.data.id, sb_state: $.data.provisioning_state }
          trigger:
            - call: "POST /enrollments"
              payload: { shell_id: "${sb}", person_id: "${s1}", role: "STUDENT" }
              as: Registrar
              captures: { err_state: $.data.error_id }
            - call: "POST /enrollments"
              payload: { shell_id: "${sa}", person_id: "${s1}", role: "STUDENT" }
              as: Registrar
              captures: { e1: $.data.id, e1_state: $.data.enrollment_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${sa}", person_id: "${s1}", role: "TA" }
              as: Registrar
              captures: { err_dup_person: $.data.error_id }
            - call: "POST /enrollments"
              payload: { shell_id: "${sa}", person_id: "${prof_id}", role: "STUDENT" }
              as: Registrar
              captures: { err_owner_student: $.data.error_id }
            - call: "POST /enrollments"
              payload: { shell_id: "${sa}", person_id: "${prof_id}", role: "TEACHER" }
              as: Registrar
              captures: { e2: $.data.id, e2_role: $.data.role }
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "DROP" }
              as: Registrar
              captures: { e1_dropped: $.data.enrollment_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${sa}", person_id: "${s1}", role: "OBSERVER" }
              as: Registrar
              captures: { err_dropped_still_counts: $.data.error_id }
            - call: "GET /course-shells/${sa}"
              payload: {}
              as: LmsAdmin
              captures: { sa_active: $.data.active_enrollment_count }
          assert:
            - "${err_state} == ERR_SHELL_STATE_BLOCKS_ENROLLMENT at HTTP 409 — shell ${sb} is ${sb_state} (REQUESTED), which is not in {PROVISIONED, PUBLISHED}"
            - "${e1_state} == ACTIVE for the same person on the PROVISIONED shell"
            - "${err_dup_person} == ERR_ROLE_CONFLICT at HTTP 409 — one person may hold at most one non-DROPPED row per shell, whatever the second role is"
            - "${err_owner_student} == ERR_ROLE_CONFLICT at HTTP 409 — the shell's owner_person_id may never hold a STUDENT row in that shell"
            - "${e2_role} == TEACHER — the same owner IS allowed a teaching row, so the refusal above was about the role, not the person"
            - "${e1_dropped} == DROPPED, and ${err_dropped_still_counts} == ERR_ROLE_CONFLICT — a DROPPED row is retained for reinstatement, so it still blocks a fresh row for that person"
            - "${sa_active} == 1 — only the TEACHER row survives as active; none of the four refusals created an Enrollment"

      - name: passback_staging_refuses_duplicates_ungraded_books_and_submitted_item_deletion
