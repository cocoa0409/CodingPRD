              as: Host
          trigger:
            - call: "POST /service-floor/reservations/${res_round}/seat"
              payload: {}
              as: Host
              captures: { res_round_v: $.data.version }
          assert:
            - "GUESTS_BILLED == min(4, 3) == 3, so the raw quotient is 3200 * 3 / (4 + 1) == 1920.0"
            - "Reservation.${res_round}.seat_surcharge_cents == 1925, i.e. ceil(1920 / 25) * 25"
            - "a per-guest ceiling would have given four guests each ceiled to 500 for 2000, which is NOT the pinned answer"
            - "the surcharge is independent of the party's loyalty tier: the same booking for a NONE-tier party also yields 1925"
            - "GET /service-floor/ledger-entries?reservation_id=${res_round}&entry_kind=SEAT_SURCHARGE returns exactly 1 POSTED row with amount_cents == 1925"

      - name: seat_surcharge_guest_cap_bites_at_three_not_two
        claim_type: tiered_pricing
        grounds:
