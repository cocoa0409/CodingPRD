            - "err == ERR_EXCHANGE_WINDOW_CLOSED one second past day 14"

      - name: segregation_counter_must_not_equal_opener
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.EventSale.OPEN_to_COUNTED]
        distinguishing_aspect: "close-count with the same X-User-ID that opened the drawer is refused (403) even though the role (Treasurer) is otherwise permitted."
        test_recipe:
          setup: ["Program ACTIVE; event OPEN — opened by user cashier-01 (who also holds a Treasurer badge in this scenario)"]
