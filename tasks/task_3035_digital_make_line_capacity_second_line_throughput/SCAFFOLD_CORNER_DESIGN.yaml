  # ===========================================================================
  - section: calculations
    instances:
      - name: fifo_consumption_drains_oldest_batch_first
        claim_type: Correct Result
        grounds:
          - calculations.fifo_consumption
        distinguishing_aspect: "FIFO consumption decrements the oldest ACTIVE batch (by cooked_at) before the newer one; a 250g order against batches of 200g (09:00) and 500g (09:30) leaves batch1 at 0 (DEPLETED) and batch2 at 450."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL on chicken, two chicken batches (200g at 09:00, 500g at 09:30)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "FF", name: "Fifo Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 200 }
              as: StoreManager
              captures: { batch_old: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:30:00Z", grams_cooked: 500 }
              as: StoreManager
              captures: { batch_new: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 250 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_id}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
          assert:
            - "IngredientBatch.${batch_old}.grams_remaining == 0 and status == DEPLETED"
            - "IngredientBatch.${batch_new}.grams_remaining == 450 and status == ACTIVE"
            - "Ingredient.${ing_chicken}.on_hand_grams == 450"

      - name: suppression_cascade_recovers_on_new_batch
        claim_type: Correct Result
        grounds:
          - calculations.suppression_cascade
        distinguishing_aspect: "Recovery: cooking a fresh batch that pushes on_hand back >= 0.5x par resolves the ACTIVE SHORTAGE SuppressionEvents and flips MenuItem back to SELLABLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store S9x, BOWL on chicken par 5000."
            - "Chicken batch 2560g; one order consumes 120g -> on_hand 2440 < 2500 -> SUPPRESSED_MARKETPLACE."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "RC", name: "Recovery Store", digital_line_capacity_per_interval: 50, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 2560 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_id}", quantity: 1, customizations: [] }] }
              as: StoreManager
          trigger:
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T10:05:00Z", grams_cooked: 3000 }
              as: StoreManager
              captures: { batch_new: $.data.id }
          assert:
            - "Ingredient.${ing_chicken}.on_hand_grams == 5440 (2440 + 3000)"
            - "Ingredient.${ing_chicken}.shortage_state == STOCKED (>= 0.5x par)"
            - "MenuItem.${item_id}.suppression_state == SELLABLE"
            - "the ACTIVE SHORTAGE SuppressionEvent for ${item_id} is now RESOLVED"

      - name: staffing_split_round_then_complement
        claim_type: Constants Applied
        grounds:
          - calculations.staffing_split
        distinguishing_aspect: "staffing_split pins round-half-up for digital then complement for in-store: headcount 7 at 0.5 digital yields digital 4, in-store 3 (sum exact 7), not 4+4."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. One store."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "SS", name: "Split Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 7, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
          assert:
            - "StaffingDeployment.${deploy_id}.digital_headcount == 4"
            - "StaffingDeployment.${deploy_id}.instore_headcount == 3"
            - "digital_headcount + instore_headcount == 7 (round-then-complement keeps the sum exact)"

      - name: marketplace_per_line_precision_half_up
        claim_type: Precision
        grounds:
          - calculations.marketplace_net_revenue
        distinguishing_aspect: "round_half_up is honored at the per-line boundary: a 0.5 fractional commission rounds up, not banker's-down."
        excluded_because:
          difficulty_instance: per_line_commission_rounding_beats_aggregate
          rationale: "The §1.8 instance already pins the per-line round-half-up divergence (852 vs 853) with literal values; this corner would duplicate it."

