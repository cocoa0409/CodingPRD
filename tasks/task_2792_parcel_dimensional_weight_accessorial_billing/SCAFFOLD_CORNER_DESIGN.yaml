              payload: {}
              as: BillingOps
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { open_issued: $.data.open_charges_cents }
            - call: "POST /invoices/${inv}/settle"
              payload: { payment_reference: "ACH-99001" }
              as: BillingOps
              captures: { inv_status: $.data.status }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { open_settled: $.data.open_charges_cents, credit: $.data.credit_balance_cents }
          assert:
            - "${net} == 2660 and ${open_open} == 0 — an OPEN invoice is outside the aggregate"
            - "${open_issued} == 2660 — the ISSUED invoice's net is the whole aggregate"
            - "${inv_status} == SETTLED with payment_reference ACH-99001"
            - "${open_settled} == 0 — SETTLED leaves the {ISSUED, ADJUSTED} aggregate"
            - "${credit} == 0 throughout — no APPLIED adjustment exists, so the credit aggregate never moves"
            - "Shipment.${p}.billing_status is still BILLED and InvoiceLine.line_total_cents is still 2660 — settling changes only which aggregate the invoice belongs to"

      - name: an_unscanned_parcel_bills_on_its_preliminary_variant
        claim_type: variant_selection
        grounds:
          - calculations.billable_weight
          - entities.Shipment.fields.preliminary_billable_weight_lbs
          - entities.Shipment.fields.final_billable_weight_lbs
        distinguishing_aspect: |
          With no scan on file the governing measurement is the declared set, so
          billable_weight_lbs is the preliminary 30 lb ACTUAL value (the 15 lb dimensional
          weight loses) and every final_* field stays null — the invoice line is built from
          the preliminary variant, at 10200.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Parcel 1Z-U-0001 is declared 10 x 10 x 20 in at 30.0 lb, zone 2 (cube 2000, dim weight ceil(2000 / 139) == 15). It is NEVER scanned, and it is delivered."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-U-0001", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { p: $.data.id, prelim: $.data.preliminary_billable_weight_lbs, basis: $.data.preliminary_basis, bw: $.data.billable_weight_lbs }
            - call: "GET /shipments/${p}/scans"
              payload: {}
              as: BillingOps
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, tsub: $.data.transportation_subtotal_cents }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line_basis: "$.data[0].billable_weight_basis", line_bw: "$.data[0].billable_weight_lbs", line_total: "$.data[0].line_total_cents" }
          assert:
            - "Shipment.${p}.preliminary_dim_weight_lbs == 15 and ${prelim} == 30 with ${basis} == ACTUAL — a tie is impossible here, the scale weight simply wins"
            - "${bw} == 30 — billable_weight_lbs mirrors the preliminary variant while no scan exists"
            - "Shipment.${p}.scanned_cube_in3, final_dim_weight_lbs, final_billable_weight_lbs, final_basis, dim_variance_pct and weight_variance_lbs are all null, and GET /shipments/${p}/scans returns total_count == 0"
            - "${line_bw} == 30 and ${line_basis} == ACTUAL — the line copies the preliminary variant"
            - "${line_total} == 10200 (30 lb at the 21-70 lb row rate 340) and ${tsub} == 10200"
            - "Shipment.${p}.measurement_status is still PENDING_SCAN, which is sweepable"

      - name: billable_weight_preliminary_vs_final_basis_flip
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: billable_weight_preliminary_vs_final_basis_flip
          rationale: |
            The §1.8 dual_variant_calc instance already computes both variants of
            calculations.billable_weight from the same parcel and asserts that the
            preliminary basis and the final basis disagree (ACTUAL versus DIMENSIONAL) while
            both variants remain readable side by side. A second variant-divergence corner
            would restate that comparison.

      - name: automated_rescan_propagates_new_constraints_through_the_frozen_line
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: automated_rescan_cascades_through_a_frozen_issued_invoice_to_the_shipper_ledger
          rationale: |
            The §1.8 transitive_cascade instance already forces a re-scan to propagate through
            accessorial re-evaluation, the reconciliation branch, the frozen InvoiceLine, the
            Invoice totals and the ShipperAccount ledger in one request, asserting each hop's
            arithmetic. The constraint-propagation claim has no residue left over.

      - name: reversing_adjustments_reconcile_the_invoice_back_to_its_gross
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: reversing_adjustment_pair_restores_the_money_invariant_through_a_zero_net_invoice
          rationale: |
            The §1.8 compensating_invariant instance already reconciles adjustment_total_cents
            against the pair of APPLIED rows and re-derives net_amount_cents and
            credit_balance_cents from them, which is exactly the reconciliation claim for
            calculations.invoice_totals and calculations.shipper_ledger_aggregates.

  # =====================================================================
  # SECTION 4 — VALIDATIONS (§1.3)
  # =====================================================================
  - section: validations
    instances:
      - name: a_suspended_shipper_cannot_induct_a_new_parcel
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]  # ERR_SHIPPER_SUSPENDED
          - state_machines.ShipperAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Suspension is intake-only: POST /shipments returns 409 ERR_SHIPPER_SUSPENDED and
          nothing persists, while the shipper's existing parcel is untouched and still
          readable, delivered and billable.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "One parcel 1Z-S-1001 (12 x 10 x 8 in, 6.0 lb, zone 2) is already IN_TRANSIT."
            - "The shipper is then suspended."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-S-1001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipper-accounts/${sh}/suspend"
              payload: {}
              as: CarrierAdmin
              captures: { st: $.data.status }
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-S-1002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { err: $.data.error_id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
              captures: { mv: $.data.movement_status }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, net: $.data.net_amount_cents }
          assert:
            - "${st} == SUSPENDED and ShipperAccount.${sh}.total_shipment_count == 1"
            - "The blocked induction returns HTTP 409 with ${err} == ERR_SHIPPER_SUSPENDED"
            - "GET /shipments with shipper_id ${sh} still returns total_count == 1 — tracking number 1Z-S-1002 was never created and can be reused later"
            - "${mv} == DELIVERED — suspension does not freeze parcels already in the network"
            - "${net} == 2660 — a suspended shipper is still billable for work already done"

      - name: an_active_shipper_induction_satisfies_every_gate_at_once
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=20]  # ERR_SHIPPER_SUSPENDED
          - validations[priority=41]  # ERR_NO_ACTIVE_CONTRACT
          - validations[priority=18]  # ERR_DUPLICATE_KEY
          - calculations.contract_selection
        distinguishing_aspect: |
          The positive counterpart: with an ACTIVE shipper, an ACTIVE contract covering the
          pickup date and a fresh tracking number, the induction returns 201 and every
          conditional gate that could have fired stays silent — contract_id is bound and the
          shipper's counters move by exactly one.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 covering [2026-01-01, 2026-12-31] (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS. No shipment exists yet."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-S-2001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id, cid: $.data.contract_id, div: $.data.divisor_used }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { total: $.data.total_shipment_count, unbilled: $.data.unbilled_shipment_count }
          assert:
            - "HTTP status is 201 — no ERR_SHIPPER_SUSPENDED, no ERR_NO_ACTIVE_CONTRACT, no ERR_DUPLICATE_KEY, no ERR_INVALID_REQUEST"
            - "${cid} == ${c1} and ${div} == 139 — contract_selection bound the only ACTIVE contract covering pickup_date 2026-08-01"
            - "Shipment.${p}.pickup_date == 2026-08-01 and picked_up_at == 2026-08-01T00:00:00.000Z"
            - "${total} == 1 and ${unbilled} == 1"
            - "Shipment.${p}.billable_weight_lbs == 7 with preliminary_basis == DIMENSIONAL"

      - name: missing_auth_headers_outrank_every_other_validation
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]  # ERR_MISSING_AUTH_HEADERS
          - validations[priority=9]  # ERR_SHIPMENT_NOT_FOUND
          - validations[priority=16]  # ERR_INVALID_REQUEST
        distinguishing_aspect: |
          One request violates three rules at once — no auth headers, an unknown shipment id
          and a malformed body — and the response is 401 ERR_MISSING_AUTH_HEADERS, not the
          404 or the 400. Supplying an unknown role then yields 401 ERR_UNKNOWN_ROLE, still
          ahead of the 404.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "One real parcel 1Z-P-3001 (12 x 10 x 8 in, 6.0 lb, zone 2) exists at version 1, purely so that the four attempts below can carry a genuine, current expected_shipment_version."
            - "The scan target in the path is a zero UUID that resolves to no shipment at all."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-P-3001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /shipments/00000000-0000-0000-0000-000000000000/scans"
              payload: { scan_source: "NOT_A_SOURCE", scanned_length_in: -5, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v}" }
              captures: { err_noauth: $.data.error_id }
            - call: "POST /shipments/00000000-0000-0000-0000-000000000000/scans"
              payload: { scan_source: "NOT_A_SOURCE", scanned_length_in: -5, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v}" }
              as: WarehouseGoblin
              captures: { err_role: $.data.error_id }
            - call: "POST /shipments/00000000-0000-0000-0000-000000000000/scans"
              payload: { scan_source: "NOT_A_SOURCE", scanned_length_in: -5, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v}" }
              as: BillingOps
              captures: { err_perm: $.data.error_id }
            - call: "POST /shipments/00000000-0000-0000-0000-000000000000/scans"
              payload: { scan_source: "NOT_A_SOURCE", scanned_length_in: -5, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v}" }
              as: CarrierOps
              captures: { err_404: $.data.error_id }
          assert:
            - "The first call sends NEITHER X-User-Role NOR X-User-ID and returns HTTP 401 with ${err_noauth} == ERR_MISSING_AUTH_HEADERS (priority 1 wins over 9 and 16)"
            - "The second call sends the unrecognised role WarehouseGoblin and returns HTTP 401 with ${err_role} == ERR_UNKNOWN_ROLE (priority 2)"
            - "The third call sends a valid role that is not on this endpoint and returns HTTP 403 with ${err_perm} == ERR_ROLE_NOT_PERMITTED (priority 3)"
            - "The fourth call sends the permitted CarrierOps role and only then reaches the id check: HTTP 404 with ${err_404} == ERR_SHIPMENT_NOT_FOUND (priority 9)"
            - "ERR_INVALID_REQUEST (priority 16) is never returned even though scan_source is not a declared enum member and scanned_length_in is negative — a lower-priority rule masks it in all four calls"
            - "${p_v} is the real, current version of parcel ${p}, so no call can be blamed on ERR_STALE_SHIPMENT_VERSION (priority 19) either — the unresolvable path id at priority 9 always answers first"
            - "GET /shipments/${p}/scans returns total_count == 0 and Shipment.${p}.version is still ${p_v} — the real parcel was never touched"

      - name: role_denial_is_evaluated_before_the_referenced_ids
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]  # ERR_ROLE_NOT_PERMITTED
          - validations[priority=5]  # ERR_SHIPPER_NOT_FOUND
          - validations[priority=7]  # ERR_SERVICE_LEVEL_NOT_FOUND
        distinguishing_aspect: |
          The same induction body with two unknown parent ids returns 403
          ERR_ROLE_NOT_PERMITTED when the caller is a ShipperUser and only reveals the 404
          ERR_SHIPPER_NOT_FOUND once the caller is CarrierOps — an unauthorised caller never
          learns whether an id exists. Between the two 404s, the shipper's priority 5 wins
          over the service level's priority 7.
        test_recipe:
          setup:
            - "Empty database. Neither the shipper id nor the service level id in the body resolves."
          setup_api_calls: []
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "00000000-0000-0000-0000-000000000000", service_level_id: "00000000-0000-0000-0000-000000000001", tracking_number: "1Z-S-3001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: ShipperUser
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err_role: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "00000000-0000-0000-0000-000000000000", service_level_id: "00000000-0000-0000-0000-000000000001", tracking_number: "1Z-S-3001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { err_ids: $.data.error_id }
          assert:
            - "The ShipperUser call returns HTTP 403 with ${err_role} == ERR_ROLE_NOT_PERMITTED — POST /shipments is CarrierOps only, and priority 3 runs before priority 5"
            - "The CarrierOps call returns HTTP 404 with ${err_ids} == ERR_SHIPPER_NOT_FOUND, NOT ERR_SERVICE_LEVEL_NOT_FOUND — priority 5 masks priority 7 even though both ids are unknown"
            - "No Shipment row exists after either call: GET /shipments as CarrierOps returns total_count == 0"

      - name: an_accessorial_dispute_must_name_a_code_that_was_actually_assessed
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=43]  # ERR_DISPUTED_CODE_NOT_ASSESSED
          - calculations.dispute_credit
          - entities.AccessorialCharge.fields.code
        distinguishing_aspect: |
          The dispute rule reaches across three entities — Dispute to InvoiceLine to
          Shipment's AccessorialCharge rows: naming OVERSIZE on a parcel that only carries a
          RESIDENTIAL charge is 422 ERR_DISPUTED_CODE_NOT_ASSESSED, while naming RESIDENTIAL
          on the same line is accepted.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305, no accessorial overrides, residential_waived false) and ServiceLevel EXPRESS."
            - "Parcel 1Z-S-4001 (12 x 10 x 8 in, 6.0 lb, zone 2, residential_declared true) therefore carries exactly one ASSESSED AUTO RESIDENTIAL charge of 590 and no OVERSIZE charge."
            - "It is delivered, swept onto INV1 (line total 3250) and the invoice is ISSUED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                residential_waived: false
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-S-4001", zone: 2, residential_declared: true, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id", line_total: "$.data[0].line_total_cents" }
          trigger:
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "ACCESSORIAL", claimed_reason: "we were charged for an oversize parcel", disputed_codes: ["OVERSIZE"] }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { err_code: $.data.error_id }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "ACCESSORIAL", claimed_reason: "this is a commercial address", disputed_codes: [] }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { err_empty: $.data.error_id }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "ACCESSORIAL", claimed_reason: "this is a commercial address", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { dsp: $.data.id, dsp_status: $.data.status }
          assert:
            - "${line_total} == 3250 (transportation 2660 plus RESIDENTIAL 590)"
            - "The OVERSIZE dispute returns HTTP 422 with ${err_code} == ERR_DISPUTED_CODE_NOT_ASSESSED — the code exists in the enum but no ASSESSED charge on this shipment carries it"
            - "The empty-list ACCESSORIAL dispute also returns HTTP 422 with ${err_empty} == ERR_DISPUTED_CODE_NOT_ASSESSED — an ACCESSORIAL claim must name at least one code"
            - "The RESIDENTIAL dispute returns HTTP 201 with ${dsp_status} == SUBMITTED, disputed_codes == [RESIDENTIAL] and granted_credit_cents == 0 (nothing is credited until resolution)"
            - "GET /disputes with invoice_line_id ${line} returns total_count == 1 — the two rejected attempts persisted nothing"

      - name: the_claim_window_closes_one_second_after_fifteen_days
