              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/robot-systems/${sys}/commission"
              payload: { expected_robot_system_version: "${sys_v}" }
              as: ClinicalOperationsLead
              captures: { sys_v: $.data.version }
            - call: "POST /api/incident-service-requests"
              payload: { robot_system_id: "${sys}", incident_started_at: "2026-09-05T08:00:00Z" }
