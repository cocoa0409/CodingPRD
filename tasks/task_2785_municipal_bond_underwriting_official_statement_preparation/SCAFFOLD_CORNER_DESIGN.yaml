# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2785 - Municipal Bond Underwriting & Official Statement Preparation
#
# Breadth probe. The nine `section:` values below are exactly the nine sections
# of references/claim-extraction-guide.md; every `claim_type:` is a row of that
# guide's per-section table. Corners already asserted by an instance of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# test_recipe.
#
# Fixture conventions used throughout:
#   - Firms: MA0001 "Beta Municipal Advisors" (MUNICIPAL_ADVISOR),
#            AU0001 "Alpha Underwriting" / AU0002 "Gamma Securities" (UNDERWRITER).
#   - Issuer: "City of Fairhaven" (OH, CITY) -> disclosure_risk_score 5, gate off.
#   - Deal:   dated_date 2026-08-01T00:00:00.000Z so 2036-08-01 and 2046-08-01
#             are exact semiannual anniversaries (20 and 40 periods).
#   - Identity: X-User-Id is the Issuer id for IssuerOfficial and the Firm id for
#             MunicipalAdvisor / Underwriter (section 1.7 entity_backed identity);
#             BondCounsel, RatingAnalyst and ComplianceOfficer are opaque.
#   - Logical clock defaults to 2026-08-01T00:00:00Z; it is only moved when a
#             window or a presentation promotion is under test.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: issuer_creation_returns_persisted_and_computed_fields
        claim_type: creation
        grounds:
          - entities.Issuer
          - endpoints[POST /bond-offerings/issuers]
          - calculations.issuer_disclosure_risk_score
        distinguishing_aspect: |
          A single POST with every input field supplied returns 201 with all seven inputs
          echoed verbatim plus the computed disclosure_risk_score 42 (12 for one late annual
          filing + 0 late event notices + 25 for the material event + the CITY surcharge 5).
          An implementation that omits the entity-type surcharge lands on 37 and one that
          drops the material-event weight lands on 17, so both are caught.
        test_recipe:
          setup:
            - "Empty database. No clock call is needed."
          setup_api_calls: []
          trigger:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY", prior_late_annual_filings: 1, prior_late_event_notices: 0, has_prior_material_event: true, is_bank_qualified_eligible: true }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Issuer.${issuer_id}.name == 'City of Fairhaven'"
            - "Issuer.${issuer_id}.state_code == 'OH'"
            - "Issuer.${issuer_id}.entity_type == CITY"
            - "Issuer.${issuer_id}.prior_late_annual_filings == 1"
            - "Issuer.${issuer_id}.prior_late_event_notices == 0"
            - "Issuer.${issuer_id}.has_prior_material_event == true"
            - "Issuer.${issuer_id}.is_bank_qualified_eligible == true"
            - "Issuer.${issuer_id}.disclosure_risk_score == 42"
            - "Issuer.${issuer_id}.id, created_at, updated_at and version are present, with version == 1"

      - name: firm_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Firm
          - endpoints[GET /bond-offerings/firms/{id}]
        distinguishing_aspect: |
          GET by id echoes exactly what POST stored, including the default is_suspended
          false that was never supplied, and the same id the create call returned.
        test_recipe:
          setup:
            - "One underwriting firm has been registered."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
          trigger:
            - call: "GET /bond-offerings/firms/${uw_firm_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "response.data.id == ${uw_firm_id}"
            - "Firm.${uw_firm_id}.name == 'Alpha Underwriting'"
            - "Firm.${uw_firm_id}.firm_type == UNDERWRITER"
            - "Firm.${uw_firm_id}.msrb_registration_id == 'AU0001'"
            - "Firm.${uw_firm_id}.is_suspended == false"

      - name: issuer_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /bond-offerings/issuers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three issuers exist; limit 2 offset 0 returns 2 rows with total_count 3 and
          has_more true, and limit 2 offset 2 returns 1 row with has_more false. The
          pairing of an unchanged total_count with a flipping has_more separates a real
          paginator from one that reports the page size as the total.
        test_recipe:
          setup:
            - "Exactly three Issuers exist: two OH cities and one OH authority."
          setup_api_calls:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Ashbury", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/issuers"
              payload: { name: "Fairhaven Port Authority", state_code: "OH", entity_type: "AUTHORITY" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { entity_type: "CITY" }
              as: ComplianceOfficer
          assert:
            - "first call: HTTP 200, response_type == 'array', 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second call: 1 row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "third call: default limit 10 and offset 0 are applied, 2 rows returned, total_count == 2, has_more == false"

      - name: maturity_tranche_listing_filters_on_is_callable
        claim_type: listing
        grounds:
          - endpoints[GET /bond-offerings/deals/{id}/maturity-tranches]
          - entities.MaturityTranche.fields.is_callable
        distinguishing_aspect: |
          The deal carries one non-callable and one callable tranche; the is_callable true
          filter must return exactly the callable one with total_count 1, while the
          unfiltered call returns both with total_count 2 - so a filter that is silently
          ignored is caught by total_count, not just by row count.
        test_recipe:
          setup:
            - "A DRAFT deal of 10,000,000 carries tranche 1 (non-callable, 2036-08-01) and tranche 2 (callable 2036-08-01 at 100.000, maturing 2046-08-01)."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "GET /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { is_callable: true }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "filtered call: HTTP 200, exactly 1 row whose id == ${t2_id}, total_count == 1, has_more == false"
            - "unfiltered call: 2 rows, total_count == 2, ordered by sequence_number ASC so row 0 id == ${t1_id}"

      - name: deal_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Deal.fields.status
          - entities.Deal.fields.sale_method
          - entities.Deal.fields.par_amount_usd
          - entities.Deal.fields.disclosure_clearance
          - entities.Deal.fields.post_issuance_handoff_status
          - endpoints[POST /bond-offerings/deals]
        distinguishing_aspect: |
          A deal created with only the five required inputs (no municipal_advisor_firm_id,
          no record_retention_years) comes back with every system default materialised:
          DRAFT / UNDETERMINED / 0 / PENDING / NOT_STARTED / version 1, and a null
          municipal_advisor_firm_id rather than a fabricated one.
        test_recipe:
          setup:
            - "One issuer exists; no firms are needed."
          setup_api_calls:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000 }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
              captures: { deal_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Deal.${deal_id}.status == DRAFT"
            - "Deal.${deal_id}.sale_method == UNDETERMINED"
            - "Deal.${deal_id}.gross_spread_basis == UNDETERMINED"
            - "Deal.${deal_id}.par_amount_usd == 0"
            - "Deal.${deal_id}.disclosure_clearance == PENDING"
            - "Deal.${deal_id}.post_issuance_handoff_status == NOT_STARTED"
            - "Deal.${deal_id}.requires_g17_letter == false and requires_notice_of_sale == false"
            - "Deal.${deal_id}.municipal_advisor_firm_id is null"
            - "Deal.${deal_id}.version == 1"

      - name: omitted_optional_inputs_fall_back_to_field_defaults
        claim_type: defaults
        grounds:
          - entities.Issuer.fields.prior_late_annual_filings
          - entities.Issuer.fields.has_prior_material_event
          - entities.MaturityTranche.fields.is_callable
          - entities.MaturityTranche.fields.is_insured
          - entities.ContinuingDisclosureUndertaking.fields.audited_financials_included
        distinguishing_aspect: |
          Defaults differ per field and are not all false: the undertaking's
          audited_financials_included defaults to TRUE while is_callable, is_insured and
          has_prior_material_event default to false, and the two Issuer counters default
          to the integer 0 rather than null.
        test_recipe:
          setup:
            - "A DRAFT deal exists so a tranche and an undertaking can be attached."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/undertakings"
              payload: { annual_report_due_days: 180, material_event_notice_days: 10, dissemination_agent: "Fairhaven Trust" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { und_id: $.data.id }
          assert:
            - "Issuer.${issuer_id}.prior_late_annual_filings == 0 and prior_late_event_notices == 0"
            - "Issuer.${issuer_id}.has_prior_material_event == false and is_bank_qualified_eligible == false"
            - "Issuer.${issuer_id}.disclosure_risk_score == 5"
            - "MaturityTranche.${t1_id}.is_callable == false and is_insured == false"
            - "MaturityTranche.${t1_id}.first_call_date is null, call_price_pct is null, price_to_call_pct is null, periods_to_call is null"
            - "MaturityTranche.${t1_id}.is_priced_to_call == false"
            - "ContinuingDisclosureUndertaking.${und_id}.audited_financials_included == true"
            - "ContinuingDisclosureUndertaking.${und_id}.status == DRAFT"

      - name: deal_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[request-shape-valid] (priority 5, category schema)
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /bond-offerings/deals]
        distinguishing_aspect: |
          tax_status has source input and no default, so omitting it is a 422
          ERR_INVALID_REQUEST and no Deal row is created - distinct from omitting
          municipal_advisor_firm_id, which is optional and succeeds.
        test_recipe:
          setup:
            - "One issuer exists."
          setup_api_calls:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000 }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "GET /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}" }
              as: ComplianceOfficer
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "second call: total_count == 0, confirming no partial Deal was persisted"

      - name: section_word_count_is_computed_from_body_text
        claim_type: computed_fields
        grounds:
          - entities.OfficialStatementSection.fields.word_count
          - entities.OfficialStatementSection.fields.authored_by_user_id
          - endpoints[POST /bond-offerings/official-statements/{id}/sections]
        distinguishing_aspect: |
          word_count is derived from body_text at creation, not supplied: the ten-word body
          asserted here yields exactly 10, and authored_by_user_id is taken from the
          X-User-Id header ('bc_drafter') rather than from any request field.
        test_recipe:
          setup:
            - "A DRAFT official statement exists on a DRAFT deal of 5,000,000."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-1", is_preliminary: true, expected_deal_version: "${deal_v}" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { os_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "RF-1", title: "Risk Factors", body_text: "Ad valorem tax collections may decline in future fiscal years", section_type: "RISK_FACTOR", is_material_risk: true }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_rf_id: $.data.id }
          assert:
            - "HTTP 201"
            - "OfficialStatementSection.${s_rf_id}.word_count == 10"
            - "OfficialStatementSection.${s_rf_id}.review_status == DRAFT"
            - "OfficialStatementSection.${s_rf_id}.authored_by_user_id == 'bc_drafter'"
            - "OfficialStatementSection.${s_rf_id}.approved_by_user_id is null"
            - "OfficialStatementSection.${s_rf_id}.parent_section_id is null"

      - name: system_and_computed_fields_in_the_body_are_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Deal.fields.status
          - entities.Deal.fields.takedown_per_bond_usd
          - validations[request-shape-valid] (priority 5, category schema)
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Deal.status and Deal.takedown_per_bond_usd are source system and are absent from
          the create endpoint's input list, so supplying either is an unknown field and a
          422 - the scaffold rejects rather than silently ignores, which is the opposite of
          a permissive implementation that would echo PRICED back.
        test_recipe:
          setup:
            - "One issuer exists."
          setup_api_calls:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, status: "PRICED" }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, takedown_per_bond_usd: 5.000 }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "second call: HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "no Deal exists for ${issuer_id} afterwards"

      - name: issuer_enum_and_numeric_range_constraints_enforced
        claim_type: type_constraints
        grounds:
          - entities.Issuer.fields.entity_type
          - entities.Issuer.fields.state_code
          - entities.Issuer.fields.prior_late_annual_filings
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Three different shape failures on the same endpoint all land on
          ERR_INVALID_REQUEST 422: an unlisted enum member (TOWNSHIP), a state_code that is
          the right length but not uppercase ('Oh'), and an integer one past the declared
          maximum (21 against 0..20) - so a validator that only checks presence and type
          fails all three.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "Fairhaven Township", state_code: "OH", entity_type: "TOWNSHIP" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "Oh", entity_type: "CITY" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY", prior_late_annual_filings: 21 }
              as: ComplianceOfficer
          assert:
            - "all three calls: HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /bond-offerings/issuers afterwards reports total_count == 0"

      - name: root_entity_lookups_report_their_own_not_found_codes
        claim_type: not_found
        grounds:
          - validations[path-resource-exists] (priority 4, category existence)
          - errors[ERR_ISSUER_NOT_FOUND]
          - errors[ERR_FIRM_NOT_FOUND]
          - errors[ERR_DEAL_NOT_FOUND]
        distinguishing_aspect: |
          Each root aggregate has its OWN 404 code rather than one shared code, so the same
          well-formed but unknown UUID must produce ERR_ISSUER_NOT_FOUND, ERR_FIRM_NOT_FOUND
          and ERR_DEAL_NOT_FOUND on the three GET-by-id routes respectively.
        test_recipe:
          setup:
            - "Empty database; the UUID below matches nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /bond-offerings/issuers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/firms/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "call 1: HTTP 404 with data.error_id == 'ERR_ISSUER_NOT_FOUND'"
            - "call 2: HTTP 404 with data.error_id == 'ERR_FIRM_NOT_FOUND'"
            - "call 3: HTTP 404 with data.error_id == 'ERR_DEAL_NOT_FOUND'"

      - name: deal_child_lookups_report_their_own_not_found_codes
        claim_type: not_found
        grounds:
          - validations[path-resource-exists] (priority 4, category existence)
          - errors[ERR_TRANCHE_NOT_FOUND]
          - errors[ERR_ENHANCEMENT_NOT_FOUND]
          - errors[ERR_OFFICIAL_STATEMENT_NOT_FOUND]
          - errors[ERR_SECTION_NOT_FOUND]
          - errors[ERR_UNDERTAKING_NOT_FOUND]
          - errors[ERR_RATING_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_PRESENTATION_NOT_FOUND]
        distinguishing_aspect: |
          Seven distinct deal-child routes must each map the same unknown UUID to their own
          404 code. CreditEnhancement has no GET-by-id route, so its code is reached through
          the commit action instead - the action's 404 must fire before its state check.
        test_recipe:
          setup:
            - "Empty database; the UUID below matches nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /bond-offerings/maturity-tranches/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/credit-enhancements/00000000-0000-4000-8000-000000000001/commit"
              payload: {}
              as: IssuerOfficial
              as_user_id: "00000000-0000-4000-8000-00000000000a"
            - call: "GET /bond-offerings/official-statements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/os-sections/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/undertakings/00000000-0000-4000-8000-000000000001/activate"
              payload: {}
              as: IssuerOfficial
              as_user_id: "00000000-0000-4000-8000-00000000000a"
            - call: "GET /bond-offerings/rating-engagements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/rating-presentations/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "call 1: HTTP 404 ERR_TRANCHE_NOT_FOUND"
            - "call 2: HTTP 404 ERR_ENHANCEMENT_NOT_FOUND (path existence at priority 4 outranks the priority-3 identity check and the priority-11 state check)"
            - "call 3: HTTP 404 ERR_OFFICIAL_STATEMENT_NOT_FOUND"
            - "call 4: HTTP 404 ERR_SECTION_NOT_FOUND"
            - "call 5: HTTP 404 ERR_UNDERTAKING_NOT_FOUND"
            - "call 6: HTTP 404 ERR_RATING_ENGAGEMENT_NOT_FOUND"
            - "call 7: HTTP 404 ERR_PRESENTATION_NOT_FOUND"

      - name: order_book_and_closing_document_lookups_report_not_found
        claim_type: not_found
        grounds:
          - validations[path-resource-exists] (priority 4, category existence)
          - errors[ERR_ORDER_PERIOD_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_CLOSING_DOCUMENT_NOT_FOUND]
        distinguishing_aspect: |
          The three order-book and closing routes complete the 404 catalogue; each is read
          with a role that is authorised for the route, so a 403 in place of the 404 would
          mean the existence check is running after the wrong gate.
        test_recipe:
          setup:
            - "Empty database; the UUID below matches nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /bond-offerings/order-periods/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/orders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/closing-documents/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "call 1: HTTP 404 ERR_ORDER_PERIOD_NOT_FOUND"
            - "call 2: HTTP 404 ERR_ORDER_NOT_FOUND"
            - "call 3: HTTP 404 ERR_CLOSING_DOCUMENT_NOT_FOUND"

      - name: tranche_creation_requires_an_existing_parent_deal
        claim_type: parent_relationships
        grounds:
          - entities.MaturityTranche.parent
          - validations[path-resource-exists] (priority 4, category existence)
          - errors[ERR_DEAL_NOT_FOUND]
        distinguishing_aspect: |
          The child route is nested under the parent, so an unknown deal_id must yield
          ERR_DEAL_NOT_FOUND before any tranche-level validation runs - the body carries a
          deliberately unaligned maturity_date (2036-09-01) that would otherwise produce
          ERR_MATURITY_DATE_UNALIGNED at priority 14.
        test_recipe:
          setup:
            - "One advisory firm exists so the acting MunicipalAdvisor identity resolves."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/00000000-0000-4000-8000-000000000001/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-09-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "HTTP 404 with data.error_id == 'ERR_DEAL_NOT_FOUND'"
            - "the response is NOT ERR_MATURITY_DATE_UNALIGNED, confirming priority 4 precedes priority 14"

      - name: enhancement_may_not_insure_a_tranche_of_another_deal
        claim_type: graph
        grounds:
          - validations[references-share-one-deal] (priority 9, category integrity)
          - errors[ERR_CROSS_DEAL_REFERENCE]
          - entities.CreditEnhancement.fields.insured_tranche_ids
        distinguishing_aspect: |
          insured_tranche_ids is a graph edge that must stay inside one deal: the referenced
          tranche exists (so this is not a 404) and belongs to the same issuer, yet the
          request is a 422 ERR_CROSS_DEAL_REFERENCE because it belongs to a different deal.
        test_recipe:
          setup:
            - "One issuer owns two DRAFT deals, each with one 5,000,000 tranche maturing 2036-08-01."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_a_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_a_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t_a_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_b_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_b_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t_b_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_b_id}/credit-enhancements"
              payload: { provider_name: "Keystone Assurance", enhancement_type: "BOND_INSURANCE", enhanced_rating: "AA", premium_bps: 45, insured_tranche_ids: ["${t_a_id}"] }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "HTTP 422 with data.error_id == 'ERR_CROSS_DEAL_REFERENCE'"
            - "the same call with insured_tranche_ids [${t_b_id}] returns 201 with status PROPOSED"
            - "no CreditEnhancement row exists on ${deal_b_id} after the rejected call"

      - name: refunding_tranche_rejects_a_prior_deal_that_is_not_closed
        claim_type: graph
        grounds:
          - validations[refunded-tranche-eligible] (priority 15, category business_constraint)
          - errors[ERR_REFUNDED_TRANCHE_INVALID]
          - entities.MaturityTranche.fields.refunded_tranche_id
        distinguishing_aspect: |
          refunded_tranche_id is the self-referential edge of the tranche graph. The
          reference passes the priority-9 integrity rule (different deal, same issuer) and
          still fails at priority 15 because the refunded deal is DRAFT rather than CLOSED -
          separating deal-scope integrity from refunding eligibility.
        test_recipe:
          setup:
            - "One issuer owns DRAFT deal A carrying one 5,000,000 tranche, plus DRAFT deal B with no tranches."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2016A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_old_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_old_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t_old_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026R", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_ref_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_ref_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250, refunded_tranche_id: "${t_old_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "HTTP 422 with data.error_id == 'ERR_REFUNDED_TRANCHE_INVALID'"
            - "Deal.${deal_old_id}.status == DRAFT, i.e. the refunded deal was never CLOSED"
            - "GET /bond-offerings/deals/${deal_ref_id}/maturity-tranches reports total_count == 0"

      - name: one_firm_holds_syndicate_seats_on_two_deals
        claim_type: graph
        grounds:
          - entities.SyndicateMember
          - endpoints[GET /bond-offerings/firms/{id}/syndicate-memberships]
          - complexity_profile.relationship_patterns
        distinguishing_aspect: |
          SyndicateMember is the Deal-to-Firm junction of a many-to-many relation: the same
          underwriting firm holds a 100.0000 percent senior seat on two different deals at
          once, and the firm-side traversal returns both rows (total_count 2) while each
          deal-side traversal returns exactly one.
        test_recipe:
          setup:
            - "One advisory firm, one underwriting firm and one issuer exist; the issuer owns two DRAFT deals."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_a_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_b_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_a_id}/syndicate-members"
              payload: { firm_id: "${uw_firm_id}", member_role: "SENIOR_MANAGER", liability_pct: 100.0000, takedown_share_pct: 100.0000, priority_rank: 1 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { m_a_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_b_id}/syndicate-members"
              payload: { firm_id: "${uw_firm_id}", member_role: "SENIOR_MANAGER", liability_pct: 100.0000, takedown_share_pct: 100.0000, priority_rank: 1 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { m_b_id: $.data.id }
            - call: "GET /bond-offerings/firms/${uw_firm_id}/syndicate-memberships"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals/${deal_a_id}/syndicate-members"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "both POSTs return 201 with status ACTIVE; the second is NOT ERR_DUPLICATE_SYNDICATE_MEMBER because uniqueness is scoped per deal"
            - "firm-side listing: total_count == 2, containing ${m_a_id} and ${m_b_id}"
            - "deal-side listing for ${deal_a_id}: total_count == 1, containing only ${m_a_id}"
            - "SyndicateMember.${m_a_id}.liability_par_usd == 0 because Deal.${deal_a_id}.par_amount_usd is still 0 in DRAFT"

  # ===========================================================================
  # SECTION 2 - STATE MACHINES
  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_child_aggregate_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.CreditEnhancement.initial_state
          - state_machines.ContinuingDisclosureUndertaking.initial_state
          - state_machines.RatingEngagement.initial_state
          - state_machines.RatingPresentation.initial_state
          - state_machines.OrderPeriod.initial_state
          - state_machines.OfficialStatement.initial_state
          - state_machines.OfficialStatementSection.initial_state
        distinguishing_aspect: |
          Seven machines with seven different initial labels are created off one STRUCTURING
          deal in a single pass: PROPOSED, DRAFT, REQUESTED, SCHEDULED, SCHEDULED, DRAFTING
          and DRAFT. An implementation that reuses one 'DRAFT'/'PENDING' label everywhere,
          or that pre-advances a child on creation, fails on at least four of them.
        test_recipe:
          setup:
            - "A STRUCTURING deal of 10,000,000 exists with two tranches summing to the authorized par."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/submit-structure"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/credit-enhancements"
              payload: { provider_name: "Keystone Assurance", enhancement_type: "BOND_INSURANCE", enhanced_rating: "AA", premium_bps: 45, insured_tranche_ids: ["${t1_id}"] }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/undertakings"
              payload: { annual_report_due_days: 180, material_event_notice_days: 10, dissemination_agent: "Fairhaven Trust" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { und_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "MOODYS" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: { starts_at: "2026-08-03T09:00:00.000Z", ends_at: "2026-08-03T10:00:00.000Z", attendee_count: 6 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { pres_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T13:00:00.000Z", closes_at: "2026-08-05T17:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { op_id: $.data.id }
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-1", is_preliminary: true, expected_deal_version: "${deal_v}" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { os_id: $.data.id }
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "RF-1", title: "Risk Factors", body_text: "Ad valorem tax collections may decline.", section_type: "RISK_FACTOR", is_material_risk: true }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_rf_id: $.data.id }
          assert:
            - "CreditEnhancement.${ce_id}.status == PROPOSED"
            - "ContinuingDisclosureUndertaking.${und_id}.status == DRAFT"
            - "RatingEngagement.${eng_id}.status == REQUESTED with info_request_count == 0 and assigned_analyst_user_id null"
            - "RatingPresentation.${pres_id}.status == SCHEDULED"
            - "OrderPeriod.${op_id}.status == SCHEDULED with allotment_run_count == 0, orders_received_count == 0 and allotted_order_count == 0"
            - "OfficialStatement.${os_id}.status == DRAFTING with draft_round == 1 and mandatory_sections_approved == false"
            - "OfficialStatementSection.${s_rf_id}.review_status == DRAFT"

      - name: submit_structure_moves_draft_to_structuring_and_fixes_par
        claim_type: valid_transition
        grounds:
          - state_machines.Deal.DRAFT_to_STRUCTURING
          - entities.Deal.fields.par_amount_usd
          - entities.MaturityTranche.fields.par_unsold_usd
          - entities.SyndicateMember.fields.liability_par_usd
        distinguishing_aspect: |
          The transition is not a status flip alone: it freezes par_amount_usd at 10,000,000
          from the tranche schedule, initialises both tranches to par_allotted_usd 0 with
          par_unsold_usd 5,000,000 each, and back-fills the senior manager's
          liability_par_usd to 10,000,000.00 from a share that was 0 while the deal was DRAFT.
        test_recipe:
          setup:
            - "A DRAFT deal of 10,000,000 carries two 5,000,000 tranches and one ACTIVE SENIOR_MANAGER holding 100.0000 percent."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
