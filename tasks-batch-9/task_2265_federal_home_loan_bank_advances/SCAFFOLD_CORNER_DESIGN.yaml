      - name: per_asset_rounding_precision_already_covered
        claim_type: precision
        grounds: ["calculations.lendable_collateral_value (round per asset first, then sum)"]
        excluded_because:
          difficulty_instance: combinatorial_formula / lendable_value_rounds_per_asset_before_summing
          rationale: "That §1.8 instance pins the rounding order with two assets whose per-asset rounding sums to 19,259,259 while the round-once-at-the-end alternative gives 19,259,258 — the single falsifiable cent of this claim."

      - name: weighted_exception_scoring_boundary_already_covered
        claim_type: weighted_scoring
        grounds: ["calculations.verification_exception_rate (weights 3.0 / 1.0 / 0.25, bands at 2.00 / 5.00 / 10.00)"]
        excluded_because:
          difficulty_instance: boundary_precision_check / exception_rate_exactly_five_percent_selects_seven_hundred_bps_band
          rationale: "The weight arithmetic, the two-decimal rounding of the rate and the inclusive lower bound of each haircut band are all asserted at the 5.00 percent boundary by that §1.8 instance."

