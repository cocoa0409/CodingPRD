# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Task 1808 OSHA Recordkeeping
# §1.8 Test Targeting Index: 9 rules x 2 instances = 18 instances.
#
# Clock discipline: the server logical clock defaults to 2026-08-01T00:00:00Z.
# Any classify call must land within occurred_at + 7 calendar days of the case,
# so chains set the clock to just after each case's occurred_at before
# classifying, and advance the clock monotonically within an instance.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trir_provisional_vs_certified_freeze
        grounds:
          - calculations.trir_rate
          - state_machines.AnnualSummary.PREPARED_to_CERTIFIED
          - state_machines.AnnualSummary.PREPARED_to_DRAFT
        distinguishing_aspect: |
          AnnualSummary-domain dual variant: the PROVISIONAL trir computed at
          PREPARED (3 recordable cases, 60000 hours -> 10.0) is frozen as the
          CERTIFIED snapshot; when a 4th case later becomes recordable, the
          CERTIFIED summary still reports 10.0 while the LIVE rates endpoint
          recomputes 13.3 — identical year data, two variant answers.
        test_recipe:
          setup:
            - "Company C, Establishment E (non-exempt), Employee W in C"
            - "3 cases classified MEDICAL_TREATMENT, occurred/classified Mar-May 2026 (clock moved per case)"
            - "12 APPROVED hour logs for (E, 2026), 5000 hours each, employment 10 each"
            - "Summary S for (E, 2026) prepared then certified (clock 2026-06-20)"
            - "K4 created (occurred 2026-08-01) and classified MEDICAL_TREATMENT after certification"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Acme Corp", fein: "12-3456789" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Plant 1", naics_code: "332710", state_code: "OH", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker One", job_title: "Machinist", hire_date: "2024-01-15" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-03-05T10:00:00Z", description: "Laceration sutured", body_part: "left hand", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_1: $.data.id, case_1_v: $.data.version }
            - call: "POST /safety/cases/${case_1}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_1_v}" }
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-04-11T09:00:00Z", description: "Sprain Rx meds", body_part: "ankle", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_2: $.data.id, case_2_v: $.data.version }
            - call: "POST /safety/cases/${case_2}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_2_v}" }
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-05-20T14:00:00Z", description: "Back strain restricted duty", body_part: "back", event_type: "INJURY" }
