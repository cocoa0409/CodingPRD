            - { call: "POST /shop/reservation-items/${ia}/assign", payload: { preferred_equipment_item_id: "${u1}" }, as: FrontDesk }
            - { call: "POST /shop/reservations/${ra}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
