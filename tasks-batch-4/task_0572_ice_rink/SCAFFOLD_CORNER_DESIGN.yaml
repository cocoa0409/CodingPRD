scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: rink_create_returns_computed_availability
        claim_type: Computed Fields
        grounds: [entities.Rink.fields.available_lockers, entities.Rink.fields.available_rental_skates]
        distinguishing_aspect: "A freshly created rink reports available_lockers == locker_count (3) and available_rental_skates == rental_skate_count (4), version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 1500, rental_skate_count: 4, locker_count: 3, locker_fee_cents: 2000 }
              as: RinkManager
              captures: { rink_id: $.data.id }
          trigger:
            - call: "GET /rinks/${rink_id}"
              payload: {}
              as: RinkManager
          assert:
            - "Rink.${rink_id}.available_lockers == 3"
            - "Rink.${rink_id}.available_rental_skates == 4"
            - "Rink.${rink_id}.version == 1"

      - name: skater_membership_defaults_non_member
        claim_type: Defaults
        grounds: [entities.Skater.fields.membership]
        distinguishing_aspect: "Registering without membership yields membership == NON_MEMBER and wallet_credit_cents == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /skaters"
              payload: { full_name: "Nobody", email: "n@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "GET /skaters/${sk}"
              payload: {}
              as: RinkManager
          assert:
            - "Skater.${sk}.membership == NON_MEMBER"
            - "Skater.${sk}.wallet_credit_cents == 0"

      - name: skater_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent skater id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /skaters/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: ice_slot_missing_required_purpose_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.IceSlot.fields.purpose]
        distinguishing_aspect: "POST /ice-slots omitting required purpose returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One rink."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
          trigger:
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: ice_slot_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.IceSlot.fields.end_utc]
        distinguishing_aspect: "POST /ice-slots with end_utc <= start_utc returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One rink."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
          trigger:
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T08:00:00Z" }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

  # =================================================================
  - section: state_machines
    instances:
      - name: publish_already_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.IceSlot.DRAFT_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a slot that is already SCHEDULED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One rink; a published PUBLIC_SKATE slot."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_terminal_slot_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.IceSlot.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a slot already in terminal CANCELLED returns ERR_INVALID_STATE (409); no further transitions from terminal."
        test_recipe:
          setup: ["One rink; a published PUBLIC_SKATE slot then cancelled."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: unpublish_with_active_admission_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.IceSlot.SCHEDULED_to_DRAFT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Unpublishing a SCHEDULED slot that has an ADMITTED admission is rejected ERR_INVALID_STATE (no-children precondition)."
        test_recipe:
          setup: ["One rink (fee 0); a published PUBLIC_SKATE slot with one ADMITTED skater."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 5, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "S", email: "up@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${sk}" }
              as: FrontDesk
          trigger:
            - call: "POST /ice-slots/${slot_id}/unpublish"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: complete_slot_before_end_time_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.IceSlot.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a slot while logical clock (default 2026-05-01) is before end_utc (2026-06-10T09:00) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One rink; a published PUBLIC_SKATE slot; clock left at startup default 2026-05-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/complete"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: sharpening_order_advances_to_picked_up
        claim_type: Valid Transition
        grounds: [state_machines.SharpeningOrder.RECEIVED_to_IN_PROGRESS, state_machines.SharpeningOrder.READY_to_PICKED_UP]
        distinguishing_aspect: "Three advance calls move a sharpening order RECEIVED->IN_PROGRESS->READY->PICKED_UP terminal."
        test_recipe:
          setup: ["One skater with a RECEIVED sharpening order."]
          setup_api_calls:
            - call: "POST /skaters"
              payload: { full_name: "S", email: "sh@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /sharpening-orders"
              payload: { skater_id: "${sk}", skate_type: "HOCKEY", price_cents: 900 }
              as: FrontDesk
              captures: { so: $.data.id }
          trigger:
            - call: "POST /sharpening-orders/${so}/advance"
              payload: {}
              as: FrontDesk
            - call: "POST /sharpening-orders/${so}/advance"
              payload: {}
              as: FrontDesk
            - call: "POST /sharpening-orders/${so}/advance"
              payload: {}
              as: FrontDesk
          assert:
            - "SharpeningOrder.${so}.status == PICKED_UP"

      - name: slot_cancel_learn_to_skate_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.IceSlot.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_slot_cancel_class_enrollment_subscription_refund
          rationale: "The full LEARN_TO_SKATE cancel cascade and its refund are asserted by the named §1.8 instance."

  # =================================================================
  - section: calculations
    instances:
      - name: sharpening_queue_positions_and_repositioning
        claim_type: Correct Result
        grounds: [calculations.sharpening_queue_position]
        distinguishing_aspect: "Three RECEIVED orders get queue_position 1,2,3 by created_at; advancing the first to READY re-positions the remaining two to 1,2."
        test_recipe:
          setup: ["One skater with three sharpening orders created in sequence."]
          setup_api_calls:
            - call: "POST /skaters"
              payload: { full_name: "S", email: "q@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /sharpening-orders"
              payload: { skater_id: "${sk}", skate_type: "HOCKEY", price_cents: 900 }
              as: FrontDesk
              captures: { o1: $.data.id }
            - call: "POST /sharpening-orders"
              payload: { skater_id: "${sk}", skate_type: "FIGURE", price_cents: 900 }
              as: FrontDesk
              captures: { o2: $.data.id }
            - call: "POST /sharpening-orders"
              payload: { skater_id: "${sk}", skate_type: "GOALIE", price_cents: 900 }
              as: FrontDesk
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /sharpening-orders/${o1}/advance"
              payload: {}
              as: FrontDesk
            - call: "POST /sharpening-orders/${o1}/advance"
              payload: {}
              as: FrontDesk
          assert:
            - "SharpeningOrder.${o1}.status == READY and its queue_position is not counted"
            - "SharpeningOrder.${o2}.queue_position == 1"
            - "SharpeningOrder.${o3}.queue_position == 2"

      - name: rental_quote_offpeak_non_member_baseline
        claim_type: Correct Result
        grounds: [calculations.slot_booking_rental_quote]
        distinguishing_aspect: "Off-peak (09:00 < peak 16) 1-hour PRIVATE_RENTAL, non-member, no resurface = 12000 (base only, no discount/surcharge)."
        test_recipe:
          setup: ["One rink; published RENTAL slot 2026-06-11T09:00..10:00; a funded non-member skater."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0, peak_start_hour_utc: 16 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "RENTAL", start_utc: "2026-06-11T09:00:00Z", end_utc: "2026-06-11T10:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "S", email: "rq@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/slot-bookings"
              payload: { skater_id: "${sk}", booking_type: "PRIVATE_RENTAL" }
              as: Skater
              as_user_id: "${sk}"
              captures: { bk: $.data.id }
          assert:
            - "SlotBooking.${bk}.quoted_cents == 12000"
            - "Skater.${sk}.wallet_credit_cents == 88000"

      - name: rental_skate_inventory_exhausted
        claim_type: Input Set Filtering
        grounds: [calculations.rink_available_rental_skates, "errors[ERR_NO_RENTAL_SKATES]"]
        distinguishing_aspect: "With rental_skate_count 1, a first rental admission drops available_rental_skates to 0 and a second rental admission is rejected ERR_NO_RENTAL_SKATES (409)."
        test_recipe:
          setup: ["One rink (rental_skate_count 1, fee 0, capacity 5); a published PUBLIC_SKATE slot; two skaters."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 5, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "A", email: "ra@x.com" }
              as: RinkManager
              captures: { s1: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "B", email: "rb@x.com" }
              as: RinkManager
              captures: { s2: $.data.id }
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s1}", rental_skate: true }
              as: FrontDesk
          trigger:
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s2}", rental_skate: true }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Rink.${rink_id}.available_rental_skates == 0"
            - "response error_id == ERR_NO_RENTAL_SKATES"
            - "http status == 409"

  # =================================================================
  - section: validations
    instances:
      - name: enroll_without_completed_prerequisite_returns_422
        claim_type: Cross-entity validation
        grounds: ["validations[priority=5]", "errors[ERR_PREREQUISITE_NOT_MET]", entities.LearnToSkateClass.fields.prerequisite_class_id]
        distinguishing_aspect: "Enrolling in a class whose prerequisite_class_id the skater has not COMPLETED returns ERR_PREREQUISITE_NOT_MET (422)."
        test_recipe:
          setup: ["One rink; two published LEARN_TO_SKATE slots; class BASIC with no prereq; class BASIC_2 with prerequisite_class_id = BASIC; a skater who never completed BASIC."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot1: $.data.id }
            - call: "POST /ice-slots/${slot1}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot1}", level_name: "BASIC", capacity: 5 }
              as: RinkManager
              captures: { class_basic: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-11T08:00:00Z", end_utc: "2026-06-11T09:00:00Z" }
              as: RinkManager
              captures: { slot2: $.data.id }
            - call: "POST /ice-slots/${slot2}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot2}", level_name: "BASIC_2", capacity: 5, prerequisite_class_id: "${class_basic}" }
              as: RinkManager
              captures: { class_basic2: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S", email: "pre@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "POST /learn-to-skate-classes/${class_basic2}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PREREQUISITE_NOT_MET"
            - "http status == 422"

      - name: admission_insufficient_funds_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_FUNDS]"]
        distinguishing_aspect: "Admitting a zero-balance skater to a fee-1500 public slot returns ERR_INSUFFICIENT_FUNDS (402)."
        test_recipe:
          setup: ["One rink (fee 1500); a published PUBLIC_SKATE slot; a skater with wallet 0."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 5, public_skate_fee_cents: 1500, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Broke", email: "poor@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${sk}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_FUNDS"
            - "http status == 402"

      - name: league_roster_full_returns_capacity_full
        claim_type: Aggregate validation
        grounds: ["validations[priority=7]", "errors[ERR_CAPACITY_FULL]", entities.League.fields.roster_capacity]
        distinguishing_aspect: "With roster_capacity 1, a second registration is rejected ERR_CAPACITY_FULL (409)."
        test_recipe:
          setup: ["One REGISTRATION_OPEN league (roster_capacity 1) with one ACTIVE registration; a second skater."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Solo", sport: "FIGURE", season_start: "2026-06-01", season_end: "2026-09-01", roster_capacity: 1 }
              as: RinkManager
              captures: { lg: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "A", email: "ga@x.com" }
              as: RinkManager
              captures: { s1: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "B", email: "gb@x.com" }
              as: RinkManager
              captures: { s2: $.data.id }
            - call: "POST /leagues/${lg}/registrations"
              payload: { skater_id: "${s1}" }
              as: Skater
              as_user_id: "${s1}"
          trigger:
            - call: "POST /leagues/${lg}/registrations"
              payload: { skater_id: "${s2}" }
              as: Skater
              as_user_id: "${s2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_FULL"
            - "http status == 409"

      - name: register_on_in_season_league_returns_invalid_state
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4]", state_machines.League.REGISTRATION_OPEN_to_IN_SEASON, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Registering for a league in IN_SEASON (registration closed) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One league started to IN_SEASON; a skater."]
          setup_api_calls:
            - call: "POST /leagues"
