              as: InnovationLead
              captures: { go_bc_id: $.data.id }
            - call: "POST /business-cases/${go_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 5.0000 }
              as: InnovationLead
            - call: "POST /innovation-projects/${go_p_id}/gate-reviews"
              payload: { gate_id: "${go_g3_id}", scheduled_at: "2026-08-06T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-go"
              captures: { go_gr_early3_id: $.data.id }
            - call: "POST /innovation-projects/${go_p_id}/gate-reviews"
              payload: { gate_id: "${go_g2_id}", scheduled_at: "2026-08-07T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-go"
              captures: { go_gr2a_id: $.data.id }
