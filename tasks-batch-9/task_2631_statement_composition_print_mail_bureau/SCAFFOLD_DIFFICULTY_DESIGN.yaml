  - rule_id: transitive_cascade
    instances:

      - name: print_run_abort_unwinds_a_four_link_chain
        grounds:
          - state_machines.CompositionJob.PRINTING_to_PRESORTED
          - state_machines.PrintRun.RUNNING_to_ABORTED
          - state_machines.MailPiece.PRINTED_to_COMPOSED
          - entities.PressLine.fields.committed_sheet_count
          - entities.CompositionJob.fields.projected_penalty_cents
        distinguishing_aspect: |
          Depth 4 on a single abort trigger where each link is caused strictly by the previous one:
          the run leaving {PLANNED, RUNNING} (link 1) is what releases the press sheet reservation
          (link 2), the released reservation is what invalidates the PRINT-scanned pieces (link 3),
          and the pieces reverting to COMPOSED is what drags the job back to PRESORTED and clears
          its projected SLA exposure (link 4) — cutting link 2 would leave links 3 and 4 unfired.
        test_recipe:
          setup:
            - "Client CL-AB on the default 48-hour turnaround, 2500 cents/hour penalty rate, 500000 cents cap, dr_readiness_required false."
            - "ACTIVE template T-AB: FIRST_CLASS, sheets_per_document 1, no inserts. Two hygienic records in postal_code 30301 -> one THREE_DIGIT batch of 2 pieces, print_sheet_count 2."
            - "The file is ACCEPTED at clock 2026-08-01T00:00:00Z, so sla_due_at is 2026-08-03T00:00:00Z."
            - "PressLine PL-AB: daily_sheet_capacity 2000, sheets_per_hour 600, changeover_buffer_minutes 30 — chosen so committed 2 sheets reads as a clean utilization_bp of 10."
