          assert:
            - "rejected ERR_INVALID_REQUEST (lien_id conditionally required when purpose == LIEN_PAYOFF)"
      - name: v_trust_date_range_returns_invalid_date_range
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "Trust with effective_date == expiry_date (or later) is rejected ERR_INVALID_DATE_RANGE (422) at creation."
        test_recipe:
          setup: ["aircraft and verified trustee"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N142TD", serial_number: "S-27", make_model: "Pilatus PC-24", year: 2020 }, as: EscrowOfficer, captures: { ac: $.data.id } }
