          trigger:
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-05", end_date: "2026-10-15", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-12-01", end_date: "2026-12-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq2_id: $.data.id } }
          assert:
            - "err == ERR_DUPLICATE_ACTIVE_REQUEST (half-open overlap with DRAFT R1)"
            - "rq2 created (201): disjoint dates are fine for the same client+yacht"

