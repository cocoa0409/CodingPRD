          assert:
            - "${ct1_billing_new} == CURRENT at creation, the billing dimension's initial state"
            - "${inv_t1_energy} == 1.000 and ${inv_t1_dem} == 50.00, the reservation floor beating the 45.0 peak, and ${inv_t1_lf} == 2.78"
            - "${inv_t1_total} == 25000.00 and ${inv_t1_minbill} == true, the 420.00 computed subtotal replaced by the floor"
            - "${inv_t2_total} == 25000.01 and ${inv_t2_minbill} == true"
            - "${ct1_balance} == 25000.00 and ${ct1_billing} == CURRENT, because the cascade needs a balance strictly above 25000.00"
            - "${ct2_balance} == 25000.01 and ${ct2_billing} == IN_ARREARS, one cent past the ceiling"
            - "${ct1_contract} == ACTIVE and ${ct2_contract} == ACTIVE, the contract dimension untouched by either cascade"
            - "${inv_t2_state} == PAID and ${inv_t2_paid} == 25000.01"
            - "${ct2_balance_after} == 0.00 and ${ct2_billing_after} == CURRENT, the threshold reset"
            - "Invoice.${inv_t1_id}.invoice_state == ISSUED and paid_amount == 0.00 at the end"

      - name: fuel_suspension_cascade_reaches_asset_plan_and_loop
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: fuel_suspension_derates_asset_reverts_plan_constrains_loop
          rationale: "Rule 4 instance 1 already drives the full three-level chain end to end: suspending an INTERRUPTIBLE contract derates its ProductionAsset, reverts the APPROVED DispatchPlan to DRAFT with reviewed_by_user_id cleared, and moves NetworkLoop.posture from NORMAL to CONSTRAINED, with the ordering and the untouched sibling assets pinned."
      - name: both_forecast_variants_produce_their_own_determinants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: forecast_weather_normal_vs_actual_weighted_variant_divergence
          rationale: "Rule 1 instance 1 pins both variants of the load forecast (7475.76 against 7470.47) and Rule 1 instance 2 pins both variants of the billing determinants together with the ledger delta on the switch, so the layer is already covered on both calculations that declare variants."
      - name: reserved_capacity_and_charge_ledgers_reconcile_after_every_write
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: loop_reserved_capacity_kw_conserved_across_activate_suspend_terminate
          rationale: "Rule 9 instance 1 already reconciles NetworkLoop.committed_reserved_kw across activation, suspension and termination, and Rule 9 instance 2 does the same for ProductionAsset.state_of_charge_kwh across two commit and decommit cycles, which is exactly this layer's create/update/delete reconciliation triple."

  - section: Consistency Model
    instances:
      - name: every_cascade_of_a_write_is_already_visible_in_that_write_s_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - state_machines.ConnectionAgreement.PENDING_CAPACITY_to_ACTIVE
          - state_machines.WorkOrder.SCHEDULED_to_EXCAVATING
        distinguishing_aspect: "Nothing in this system lags: the activation response already carries the new contract_state while the very next read of the loop shows committed_reserved_kw and the loop version already moved, and a single excavation request that touches three entities leaves the work order, the segment condition and the loop posture all consistent on the first read after it — no second read is ever needed to see a cascade."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-I with PipeSegment SEG-I1 and a PENDING_CAPACITY agreement CI1 reserving 600.0 kW."
            - "A SCHEDULED WorkOrder on SEG-I1 with requires_isolation true and a window covering the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-I", name: "Immediate Loop I", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 5000.0 }
              as: SystemController
              captures: { loop_i_id: $.data.id, loop_i_v0: $.data.version }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_i_id}", code: "SEG-I1", length_m: 350.0, diameter_mm: 150, install_year: 2016, insulation_class: "A", buried_depth_m: 1.0 }
              as: NetworkEngineer
              captures: { seg_i1_id: $.data.id, seg_i1_condition0: $.data.condition }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_i_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Immediate Offices", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 600.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ci1_id: $.data.id }
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_i1_id}", loop_id: "${loop_i_id}", work_type: "LEAK_REPAIR", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-02T00:00:00Z", requires_isolation: true }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wo_i_id: $.data.id }
            - call: "POST /district-energy/work-orders/${wo_i_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${wo_i_id}/permit-decision"
              payload: { permit_decision: "GRANTED", decision_note: "isolation window agreed" }
              as: NetworkEngineer
              captures: { wo_i_scheduled: $.data.work_state }
          trigger:
            - call: "POST /district-energy/connection-agreements/${ci1_id}/activate"
              payload: {}
              as: BillingAnalyst
              captures: { ci1_state: $.data.contract_state, ci1_v: $.data.version }
            - call: "GET /district-energy/network-loops/${loop_i_id}"
              payload: {}
              as: BillingAnalyst
              captures: { loop_i_reserved: $.data.committed_reserved_kw, loop_i_v1: $.data.version }
            - call: "POST /district-energy/work-orders/${wo_i_id}/begin-excavation"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wo_i_state: $.data.work_state }
            - call: "GET /district-energy/pipe-segments/${seg_i1_id}"
              payload: {}
              as: NetworkEngineer
              captures: { seg_i1_condition1: $.data.condition }
            - call: "GET /district-energy/network-loops/${loop_i_id}"
              payload: {}
              as: NetworkEngineer
              captures: { loop_i_posture: $.data.posture, loop_i_iso: $.data.open_isolation_count, loop_i_v2: $.data.version }
          assert:
            - "${loop_i_v0} == 1 and ${seg_i1_condition0} == SOUND at registration"
            - "${wo_i_scheduled} == SCHEDULED"
            - "the activation response itself already carries ${ci1_state} == ACTIVE and ${ci1_v} == 2"
            - "the first read after activation already shows ${loop_i_reserved} == 600.0 and ${loop_i_v1} == 2"
            - "the excavation response already carries ${wo_i_state} == EXCAVATING"
            - "the first read of the segment after excavation already shows ${seg_i1_condition1} == UNDER_REPAIR"
            - "the first read of the loop after excavation already shows ${loop_i_posture} == ISOLATED, ${loop_i_iso} == 1 and ${loop_i_v2} == 3"
            - "no value changes on a repeated read: a second GET of the loop returns the same posture, open_isolation_count and version"
