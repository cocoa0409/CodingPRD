# =============================================================================
# Task 1820: Compressed-Air Audit & Service Contract (Atlas Copco service dealer)
# Scaffold seed tables — §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  1820. Compressed-Air Audit & Service Contract (Atlas Copco service dealer): baseline demand
  profile & leak survey, leak tagging & repair prioritization by CFM, dryer/filter maintenance
  interval, energy savings calculation & utility rebate, compressor sequencing & control
  retrofit, service contract tier & response SLA, rental compressor during outage, guarantee &
  measurement dispute

domain_name: compressed-air-audit-service
api_prefix: "/"

complexity_profile:
  primary_archetype: posture_driven_gating     # Facility.posture gates rentals and certificate settlement
  secondary_archetype: quota_allocation        # dealer rental fleet allocation w/ selector policy; facility repair budget
  complexity_layers:
    - optimistic_concurrency                   # OCC on Facility.version for lock / activate supersede writes
    - cascading_side_effects                   # run-hours -> schedule -> posture -> certificate gate; breach -> credit -> contract suspension
    - dual_variant_calculation                 # deemed vs measured savings; quoted vs actual rental bill; provisional vs final rebate
    - version_pinning_on_approval              # SavingsCase pins baseline DemandProfile id+version; supersede flags staleness
  entity_topology: flat                        # peer collections, FKs in request bodies, filtered-list reads
  state_machine_shape: parallel                # SavingsCase & GuaranteeCertificate carry two independent state dimensions; Compressor/ServiceContract/RentalAsset cycle
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]   # DemandProfile.superseded_by_id is self-referential
  role_model: segregation_of_duties            # survey submitter may not verify; baseline locker may not close measurement
  consistency_model: immediate                 # all side effects atomic in the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs in request bodies)
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: utility_rate_cents_per_kwh, type: integer, source: input, description: "Blended utility rate in cents per kWh; used by guarantee payout" }
      - { name: operating_hours_per_year, type: integer, source: input, description: "Annual operating hours; used by leak savings rollup" }
      - { name: repair_budget_cents, type: integer, source: input, description: "Cap on committed leak-repair quotes" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | OUTAGE_ACTIVE | MAINTENANCE_DELINQUENT; precedence OUTAGE_ACTIVE > MAINTENANCE_DELINQUENT > NORMAL; see facility_posture calc" }
      - { name: repair_committed_cents, type: integer, source: computed, description: "Sum of repair_quote_cents over LeakTags in {REPAIR_AUTHORIZED, REPAIRED, VERIFIED_CLOSED} across this facility" }
      - { name: rental_escrow_cents, type: integer, source: computed, description: "Sum of deposit_cents over RentalReservations in {RESERVED, ON_RENT} for this facility" }

  - name: Compressor
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: asset_tag, type: string, source: input, description: "Dealer asset tag; unique per facility among compressors not DECOMMISSIONED" }
      - { name: rated_kw, type: integer, source: input, description: "Nameplate kW" }
      - { name: rated_cfm, type: integer, source: input, description: "Nameplate CFM; rental sizing reference" }
      - { name: run_hours_total, type: integer, source: system, default: 0, description: "Cumulative run-hours; monotonic non-decreasing via log-run-hours" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | DOWN | DECOMMISSIONED" }

  - name: DemandProfile
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; measured facility" }
      - { name: window_start_date, type: string, source: input, description: "ISO date YYYY-MM-DD; inclusive window start" }
      - { name: window_end_date, type: string, source: input, description: "ISO date YYYY-MM-DD; inclusive window end; must be >= window_start_date" }
      - { name: measured_kwh, type: integer, source: input, description: "kWh measured over the inclusive window" }
      - { name: measured_avg_cfm, type: number, source: input, description: "Average CFM demand over window (1 decimal)" }
      - { name: measured_peak_cfm, type: number, source: input, description: "Peak CFM demand over window (1 decimal)" }
      - { name: baseline_annual_kwh, type: integer, source: computed, description: "round_half_up(measured_kwh * 365 / window_days); window_days = end - start + 1 (inclusive)" }
      - { name: status, type: enum, source: system, description: "COLLECTING | LOCKED | SUPERSEDED" }
      - { name: locked_by_user_id, type: string, source: system, description: "X-User-ID that locked the profile; segregation-of-duties reference for close-measurement" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> DemandProfile.id; set when a later lock supersedes this profile; null otherwise" }

  - name: LeakSurvey
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; surveyed facility" }
      - { name: survey_date, type: string, source: input, description: "ISO date of field survey" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted; verifier must differ" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID that verified; null until VERIFIED" }
      - { name: total_leak_cfm, type: number, source: computed, description: "Sum of cfm_loss over all tags in this survey (1 decimal), computed at verify" }
      - { name: tag_count, type: integer, source: computed, description: "Number of LeakTags in this survey, computed at verify" }

  - name: LeakTag
    parent: LeakSurvey
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: input, description: "FK -> LeakSurvey.id; parent survey" }
      - { name: location_description, type: string, source: input, description: "Free-text location of the leak" }
      - { name: cfm_loss, type: number, source: input, description: "Estimated CFM lost (1 decimal, > 0)" }
      - { name: repair_quote_cents, type: integer, source: input, description: "Quoted repair cost (>= 0)" }
      - { name: severity, type: enum, source: computed, description: "LOW if cfm_loss < 2.0; MEDIUM if 2.0 <= cfm_loss <= 10.0; HIGH if cfm_loss > 10.0; assigned at survey verify" }
      - { name: priority_rank, type: integer, source: computed, description: "1-based repair priority assigned at survey verify: cfm_loss DESC, tie repair_quote_cents ASC, tie created_at ASC" }
      - { name: annual_kwh_savings, type: integer, source: computed, description: "round_half_up(cfm_loss * 0.20 * facility.operating_hours_per_year), whole kWh; set at verify-closure" }
      - { name: status, type: enum, source: system, description: "TAGGED | QUOTED | REPAIR_AUTHORIZED | REPAIRED | VERIFIED_CLOSED | WONT_FIX" }
      - { name: repaired_by_user_id, type: string, source: system, description: "ServiceTech X-User-ID that marked repaired; null until REPAIRED" }

  - name: MaintenanceSchedule
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; serviced facility" }
      - { name: component, type: enum, source: input, description: "DRYER | FILTER; unique per facility among ACTIVE schedules" }
      - { name: interval_hours, type: integer, source: input, description: "Run-hour interval between services (> 0)" }
      - { name: anchor_run_hours, type: integer, source: system, description: "Facility max compressor run-hours at creation; reset to run_hours_reading at record-service" }
      - { name: next_due_run_hours, type: integer, source: computed, description: "= anchor_run_hours + interval_hours" }
      - { name: is_delinquent, type: boolean, source: computed, description: "true iff status==ACTIVE AND facility max compressor run_hours >= next_due_run_hours (>= is inclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: RetrofitProject
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; retrofit site" }
      - { name: baseline_pressure_psi, type: integer, source: input, description: "Current system pressure setpoint" }
      - { name: target_pressure_psi, type: integer, source: input, description: "Post-retrofit setpoint; must be < baseline_pressure_psi" }
      - { name: sequence_compressor_ids, type: array, source: input, description: "Ordered array of Compressor.id values forming the sequencing plan; each must belong to facility_id and be IN_SERVICE at approve time" }
      - { name: project_cost_cents, type: integer, source: input, description: "Total installed cost; drives rebate cost cap" }
      - { name: accepted_date, type: string, source: system, description: "ISO date (logical clock) when ACCEPTED; null until then" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | INSTALLED | COMMISSIONED | ACCEPTED | CANCELLED" }

  - name: SavingsCase
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; subject facility" }
      - { name: baseline_profile_id, type: string, source: input, description: "FK -> DemandProfile.id; pinned baseline; must be LOCKED and same facility" }
      - { name: baseline_profile_version, type: integer, source: system, description: "DemandProfile.version captured at creation (version-pinning on approval)" }
      - { name: baseline_stale, type: boolean, source: system, default: false, description: "true when pinned baseline profile was SUPERSEDED after pinning; blocks model" }
      - { name: retrofit_project_id, type: string, source: input, description: "FK -> RetrofitProject.id; sequencing source; must be same facility and APPROVED-or-later at creation" }
      - { name: retrofit_stale, type: boolean, source: system, default: false, description: "true when referenced project was CANCELLED by compressor decommission cascade; blocks model" }
      - { name: deemed_annual_savings_kwh, type: integer, source: computed, description: "Engineering estimate: leak rollup + sequencing component; computed at model, recomputed on leak verify-closure while MODELED" }
      - { name: measured_annual_savings_kwh, type: integer, source: computed, description: "Final: baseline_annual_kwh - post profile annualized kWh (signed); set at close-measurement" }
      - { name: post_profile_id, type: string, source: system, description: "FK -> DemandProfile.id; post-retrofit measurement profile; set at close-measurement" }
      - { name: savings_status, type: enum, source: system, description: "Dimension 1: DRAFT | MODELED | MEASUREMENT_OPEN | MEASURED" }
      - { name: rebate_status, type: enum, source: system, description: "Dimension 2 (independent): NONE | FILED | APPROVED | REJECTED" }
      - { name: provisional_rebate_cents, type: integer, source: computed, description: "Rebate formula over deemed savings; set at file-rebate; never recomputed" }
      - { name: final_rebate_cents, type: integer, source: computed, description: "Rebate formula over measured savings if MEASURED else deemed; set at record-rebate-decision APPROVED" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; covered facility" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM; immutable after creation" }
      - { name: start_date, type: string, source: input, description: "ISO coverage start date" }
      - { name: term_months, type: integer, source: input, description: "Coverage length in whole months" }
      - { name: end_date, type: string, source: computed, description: "= start_date + term_months months (same day-of-month)" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Gross monthly service fee; SLA credits are computed against this gross value (never net of credits)" }
      - { name: sla_base_hours, type: integer, source: computed, description: "BASIC 48 | STANDARD 24 | PREMIUM 8" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | SUPERSEDED | EXPIRED | TERMINATED" }
      - { name: sla_breach_count, type: integer, source: computed, default: 0, description: "Count of ServiceCredit rows (any status) for this contract" }
      - { name: termination_penalty_waived, type: boolean, source: computed, default: false, description: "true once sla_breach_count >= 3" }
      - { name: termination_fee_cents, type: integer, source: computed, description: "Set at terminate: 0 if termination_penalty_waived else 2 * monthly_fee_cents" }
      - { name: credits_accrued_total_cents, type: integer, source: computed, default: 0, description: "All-time sum of credit amounts ever ACCRUED (immutable once added)" }
      - { name: credits_applied_total_cents, type: integer, source: computed, default: 0, description: "Sum over credits in APPLIED" }
      - { name: credits_expired_total_cents, type: integer, source: computed, default: 0, description: "Sum over credits in EXPIRED" }
      - { name: credits_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum over credits in ACCRUED; invariant: accrued == applied + expired + outstanding" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; calling facility" }
      - { name: contract_id, type: string, source: system, description: "FK -> ServiceContract.id; resolved server-side to the facility's status==ACTIVE contract at creation" }
      - { name: compressor_id, type: string, source: input, description: "FK -> Compressor.id; affected unit; must belong to facility_id" }
      - { name: severity, type: enum, source: input, description: "EMERGENCY | URGENT | ROUTINE; multiplies SLA base hours by 1 | 2 | 4" }
      - { name: reported_at, type: string, source: system, description: "ISO datetime from logical clock at creation" }
      - { name: sla_tier_snapshot, type: string, source: system, description: "Contract tier captured at creation; immune to later contract changes" }
      - { name: sla_deadline, type: string, source: computed, description: "= reported_at + sla_base_hours(tier snapshot) * severity_multiplier hours" }
      - { name: first_response_at, type: string, source: system, description: "ISO datetime from logical clock at record-response; null until ON_SITE" }
      - { name: sla_met, type: boolean, source: computed, description: "first_response_at <= sla_deadline (inclusive); null until first_response_at set" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPATCHED | ON_SITE | RESOLVED | CANCELLED" }

  - name: RentalAsset
    parent: null
    common_fields: true
    fields:
      - { name: fleet_tag, type: string, source: input, description: "Dealer fleet identifier; globally unique" }
      - { name: rated_cfm, type: integer, source: input, description: "Rental unit capacity" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Per-calendar-day rental rate" }
      - { name: deposit_cents, type: integer, source: input, description: "Escrow deposit held while RESERVED or ON_RENT" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_RENT | IN_MAINTENANCE" }
      - { name: next_available_date, type: string, source: computed, description: "Set at reservation return: actual_return_date + 1 day turnaround buffer; null otherwise" }

  - name: RentalReservation
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; renting facility" }
      - { name: rental_asset_id, type: string, source: system, description: "FK -> RentalAsset.id; optional in request (rental_asset_id?), server auto-selects smallest sufficient available asset when omitted" }
      - { name: down_compressor_id, type: string, source: input, description: "FK -> Compressor.id; the DOWN compressor being substituted" }
      - { name: start_date, type: string, source: input, description: "ISO rental start date" }
      - { name: end_date, type: string, source: input, description: "ISO planned end date; must be >= start_date" }
      - { name: planned_days, type: integer, source: computed, description: "= end_date - start_date + 1 (inclusive)" }
      - { name: quoted_cents, type: integer, source: computed, description: "Quote variant: planned_days * daily_rate_cents; no minimum-days floor, no long-term discount" }
      - { name: deposit_cents, type: integer, source: system, description: "Snapshot of RentalAsset.deposit_cents at reservation" }
      - { name: actual_return_date, type: string, source: system, description: "ISO actual return date; set at return" }
      - { name: actual_bill_cents, type: integer, source: computed, description: "Actual variant: billable = max(actual_days, 3); round_half_up(daily_rate * (min(billable,27) + 0.85 * max(0, billable-27)))" }
      - { name: final_bill_cents, type: integer, source: system, description: "Locked copy of actual_bill_cents at invoice" }
      - { name: status, type: enum, source: system, description: "RESERVED | ON_RENT | RETURNED | INVOICED | CANCELLED" }

  - name: GuaranteeCertificate
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; guaranteed facility" }
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; must be same facility, ACTIVE, tier PREMIUM" }
      - { name: savings_case_id, type: string, source: input, description: "FK -> SavingsCase.id; must be same facility with savings_status MODELED or MEASURED; at most one certificate per savings case" }
      - { name: guaranteed_pct, type: number, source: input, description: "Fraction of deemed savings guaranteed, e.g. 0.90" }
      - { name: guaranteed_kwh, type: integer, source: computed, description: "round_half_up(deemed_annual_savings_kwh at creation * guaranteed_pct); snapshot, never recomputed" }
      - { name: deadband_kwh, type: integer, source: computed, description: "round_half_up(guaranteed_kwh * 0.02); measurement-uncertainty deadband" }
      - { name: measured_kwh_at_settlement, type: integer, source: system, description: "SavingsCase.measured_annual_savings_kwh pulled at settle (or corrected value on upheld dispute)" }
      - { name: shortfall_kwh, type: integer, source: computed, description: "max(0, guaranteed_kwh - measured_kwh_at_settlement - deadband_kwh)" }
      - { name: payout_cents, type: integer, source: computed, description: "min(round_half_up(shortfall_kwh * facility.utility_rate_cents_per_kwh), contract.monthly_fee_cents * 12)" }
      - { name: settlement_blocked, type: boolean, source: computed, description: "true iff facility.posture != NORMAL; recomputed whenever posture changes" }
      - { name: settlement_status, type: enum, source: system, description: "Dimension 1: AWAITING_MEASUREMENT | SETTLED_NO_SHORTFALL | SETTLED_PAYOUT_DUE | PAID" }
      - { name: dispute_status, type: enum, source: system, description: "Dimension 2 (independent): NONE | OPEN | RESOLVED_UPHELD | RESOLVED_OVERRULED" }
      - { name: dispute_reason, type: string, source: system, description: "Free text from dispute; null unless disputed" }

  - name: ServiceCredit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> ServiceContract.id; credited contract" }
      - { name: ticket_id, type: string, source: system, description: "FK -> ServiceTicket.id; breaching ticket" }
      - { name: source, type: enum, source: system, description: "SLA_BREACH (only source)" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(contract.monthly_fee_cents * 0.05) on the GROSS fee snapshot at accrual" }
      - { name: accrued_at, type: string, source: system, description: "ISO datetime from logical clock at accrual" }
      - { name: expires_at, type: string, source: computed, description: "= accrued_at + 90 days; expirable when logical clock >= expires_at" }
      - { name: status, type: enum, source: system, description: "ACCRUED | APPLIED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /facilities/{facilityId}/activate"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE; version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /facilities/{facilityId}/suspend"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED; posture recompute; certificate settlement_blocked recompute for this facility"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /facilities/{facilityId}/reinstate"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE; posture recompute; certificate settlement_blocked recompute"]
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /facilities/{facilityId}/offboard"
        actor: DealerAdmin
        preconditions:
          - "No ServiceContract of this facility in {DRAFT, ACTIVE, SUSPENDED} (ERR_FACILITY_HAS_OPEN_OBLIGATIONS)"
          - "No RentalReservation of this facility in {RESERVED, ON_RENT} (ERR_FACILITY_HAS_OPEN_OBLIGATIONS)"
          - "No GuaranteeCertificate of this facility in {AWAITING_MEASUREMENT, SETTLED_PAYOUT_DUE} (ERR_FACILITY_HAS_OPEN_OBLIGATIONS)"
        side_effects: ["status -> OFFBOARDED"]
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /facilities/{facilityId}/offboard"
        actor: DealerAdmin
        preconditions: ["Same open-obligations checks as ACTIVE -> OFFBOARDED"]
        side_effects: ["status -> OFFBOARDED"]

  - entity: Compressor
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: DOWN
        trigger: "POST /compressors/{compressorId}/mark-down"
        actor: ServiceTech
        preconditions: ["Facility not OFFBOARDED"]
        side_effects:
          - "Facility.posture recompute (>=1 DOWN compressor forces OUTAGE_ACTIVE)"
          - "GuaranteeCertificate.settlement_blocked recompute for this facility"
      - from: DOWN
        to: IN_SERVICE
        trigger: "POST /compressors/{compressorId}/return-to-service"
        actor: ServiceTech
        preconditions: []
        side_effects:
          - "Facility.posture recompute (OUTAGE_ACTIVE clears when last DOWN unit returns)"
          - "GuaranteeCertificate.settlement_blocked recompute"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /compressors/{compressorId}/decommission"
        actor: DealerAdmin | ContractManager
        preconditions: []
        side_effects:
          - "Cascade 1: every RetrofitProject of this facility in {PROPOSED, APPROVED, INSTALLED} whose sequence_compressor_ids contains this compressor -> CANCELLED"
          - "Cascade 2: every SavingsCase whose retrofit_project_id was cancelled by cascade 1 and savings_status in {DRAFT, MODELED} -> retrofit_stale = true"
          - "Facility.posture recompute; certificate settlement_blocked recompute"
      - from: DOWN
        to: DECOMMISSIONED
        trigger: "POST /compressors/{compressorId}/decommission"
        actor: DealerAdmin | ContractManager
        preconditions: []
        side_effects: ["Same cascades as IN_SERVICE -> DECOMMISSIONED; posture recompute (this unit no longer counts as DOWN)"]

  - entity: DemandProfile
    initial_state: COLLECTING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COLLECTING
        to: LOCKED
        trigger: "POST /demand-profiles/{demandProfileId}/lock"
        actor: EnergyEngineer
        preconditions:
          - "Facility status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
          - "OCC: expected_facility_version == Facility.version (ERR_STALE_VERSION)"
        side_effects:
          - "locked_by_user_id = X-User-ID; Facility.version += 1"
          - "Supersede: the facility's previously LOCKED profile (if any) -> SUPERSEDED with superseded_by_id = this profile"
          - "Every SavingsCase pinning that superseded profile with savings_status in {DRAFT, MODELED} -> baseline_stale = true"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (cascade when a newer DemandProfile of the same facility is locked)"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_id set to the newly LOCKED profile"]

  - entity: LeakSurvey
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /leak-surveys/{leakSurveyId}/submit"
        actor: EnergyEngineer
        preconditions:
          - "tag_count of contained LeakTags >= 1 (ERR_EMPTY_SURVEY — empty set rejected)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "Every contained LeakTag TAGGED -> QUOTED"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /leak-surveys/{leakSurveyId}/verify"
        actor: EnergyEngineer
        preconditions:
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "Compute per-tag severity (LOW | MEDIUM | HIGH per cfm_loss bands) and priority_rank (cfm_loss DESC, tie repair_quote_cents ASC, tie created_at ASC)"
          - "Compute total_leak_cfm and tag_count"

  - entity: LeakTag
    initial_state: TAGGED
    terminal_states: [VERIFIED_CLOSED, WONT_FIX]
    transitions:
      - from: TAGGED
        to: QUOTED
        trigger: "system (cascade when parent LeakSurvey is submitted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: REPAIR_AUTHORIZED
        trigger: "POST /leak-tags/{leakTagId}/authorize-repair"
        actor: FacilityManager
        preconditions:
          - "Parent LeakSurvey.status == VERIFIED (ERR_SURVEY_NOT_VERIFIED)"
          - "Facility.status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
          - "Fiscal: facility.repair_committed_cents + this repair_quote_cents <= facility.repair_budget_cents (ERR_REPAIR_BUDGET_EXCEEDED; <= inclusive, exact-budget allowed)"
        side_effects: ["Facility.repair_committed_cents += repair_quote_cents"]
      - from: REPAIR_AUTHORIZED
        to: REPAIRED
        trigger: "POST /leak-tags/{leakTagId}/mark-repaired"
        actor: ServiceTech
        preconditions: []
        side_effects: ["repaired_by_user_id = X-User-ID"]
      - from: REPAIRED
        to: VERIFIED_CLOSED
        trigger: "POST /leak-tags/{leakTagId}/verify-closure"
        actor: EnergyEngineer
        preconditions: []
        side_effects:
          - "annual_kwh_savings = round_half_up(cfm_loss * 0.20 * facility.operating_hours_per_year)"
          - "Every SavingsCase of this facility with savings_status == MODELED recomputes deemed_annual_savings_kwh"
      - from: QUOTED
        to: WONT_FIX
        trigger: "POST /leak-tags/{leakTagId}/mark-wont-fix"
        actor: FacilityManager
        preconditions: []
        side_effects: []
      - from: REPAIR_AUTHORIZED
        to: WONT_FIX
        trigger: "POST /leak-tags/{leakTagId}/mark-wont-fix"
        actor: FacilityManager
        preconditions: []
        side_effects: ["Compensation: Facility.repair_committed_cents -= repair_quote_cents (authorization released)"]

  - entity: MaintenanceSchedule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /maintenance-schedules/{maintenanceScheduleId}/record-service"
        actor: ServiceTech
        preconditions:
          - "run_hours_reading >= anchor_run_hours (ERR_RUN_HOURS_REGRESSION)"
          - "run_hours_reading <= max run_hours_total over this facility's compressors (ERR_READING_EXCEEDS_LOGGED)"
        side_effects:
          - "anchor_run_hours = run_hours_reading; next_due_run_hours recomputed"
          - "is_delinquent recomputed (clears when reading lifts anchor)"
          - "Facility.posture recompute; GuaranteeCertificate.settlement_blocked recompute"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /maintenance-schedules/{maintenanceScheduleId}/retire"
        actor: ContractManager
        preconditions: []
        side_effects: ["Facility.posture recompute (retired schedules never count as delinquent); certificate settlement_blocked recompute"]

  - entity: RetrofitProject
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /retrofit-projects/{retrofitProjectId}/approve"
        actor: FacilityManager
        preconditions:
          - "Every id in sequence_compressor_ids resolves to a Compressor of this facility with status == IN_SERVICE (ERR_SEQUENCE_COMPRESSOR_INVALID)"
        side_effects: []
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /retrofit-projects/{retrofitProjectId}/mark-installed"
        actor: ServiceTech
        preconditions: []
        side_effects: []
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /retrofit-projects/{retrofitProjectId}/commission"
        actor: ServiceTech
        preconditions: []
        side_effects: []
      - from: COMMISSIONED
        to: ACCEPTED
        trigger: "POST /retrofit-projects/{retrofitProjectId}/accept"
        actor: FacilityManager
        preconditions: []
        side_effects: ["accepted_date = current logical clock date"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "system (cascade: a sequenced compressor is decommissioned)"
        actor: system
        preconditions: []
        side_effects: ["SavingsCase referencing this project with savings_status in {DRAFT, MODELED} -> retrofit_stale = true"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system (cascade: a sequenced compressor is decommissioned)"
        actor: system
        preconditions: []
        side_effects: ["Same SavingsCase staleness cascade"]
      - from: INSTALLED
        to: CANCELLED
        trigger: "system (cascade: a sequenced compressor is decommissioned)"
        actor: system
        preconditions: []
        side_effects: ["Same SavingsCase staleness cascade"]

  - entity: SavingsCase
    initial_state: "savings_status=DRAFT, rebate_status=NONE (two independent dimensions)"
    terminal_states: ["savings_status=MEASURED (dim 1 terminal)", "rebate_status in {APPROVED, REJECTED} (dim 2 terminal)"]
    transitions:
      - from: "savings_status DRAFT"
        to: "savings_status MODELED"
        trigger: "POST /savings-cases/{savingsCaseId}/model"
        actor: EnergyEngineer
        preconditions:
          - "baseline_stale == false (ERR_BASELINE_SUPERSEDED)"
          - "retrofit_stale == false (ERR_RETROFIT_STALE)"
          - "RetrofitProject.status in {APPROVED, INSTALLED, COMMISSIONED, ACCEPTED} (ERR_RETROFIT_NOT_APPROVED)"
        side_effects: ["deemed_annual_savings_kwh = leak rollup + sequencing component (see deemed_annual_savings calc)"]
        note: "rebate_status unchanged — dimensions evolve independently"
      - from: "savings_status DRAFT or MODELED with baseline_stale == true or retrofit_stale == true"
        to: "savings_status DRAFT (reset), staleness flags cleared"
        trigger: "POST /savings-cases/{savingsCaseId}/rebase"
        actor: EnergyEngineer
        preconditions:
          - "baseline_stale == true OR retrofit_stale == true (else ERR_INVALID_STATE_TRANSITION)"
          - "A LOCKED DemandProfile exists for this facility (ERR_PROFILE_NOT_LOCKED)"
          - "If retrofit_project_id supplied in body: project belongs to same facility and status in {APPROVED, INSTALLED, COMMISSIONED, ACCEPTED} (ERR_FACILITY_MISMATCH / ERR_RETROFIT_NOT_APPROVED)"
        side_effects:
          - "Re-pin baseline_profile_id + baseline_profile_version to the facility's current LOCKED profile; baseline_stale = false"
          - "If retrofit_project_id supplied: re-point project, retrofit_stale = false"
          - "savings_status -> DRAFT; deemed_annual_savings_kwh reset to 0 until re-modeled"
      - from: "savings_status MODELED"
        to: "savings_status MEASUREMENT_OPEN"
        trigger: "POST /savings-cases/{savingsCaseId}/open-measurement"
        actor: EnergyEngineer
        preconditions: ["RetrofitProject.status == ACCEPTED (ERR_RETROFIT_NOT_ACCEPTED)"]
        side_effects: []
      - from: "savings_status MEASUREMENT_OPEN"
        to: "savings_status MEASURED"
        trigger: "POST /savings-cases/{savingsCaseId}/close-measurement"
        actor: EnergyEngineer
        preconditions:
          - "post_profile_id is LOCKED (ERR_PROFILE_NOT_LOCKED) and belongs to same facility (ERR_FACILITY_MISMATCH)"
          - "post profile window_start_date > RetrofitProject.accepted_date (ERR_POST_WINDOW_BEFORE_ACCEPTANCE)"
          - "Segregation of duties: X-User-ID != baseline profile's locked_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "post_profile_id stored; measured_annual_savings_kwh = baseline_annual_kwh - round_half_up(post.measured_kwh * 365 / post window_days) (signed)"
      - from: "rebate_status NONE"
        to: "rebate_status FILED"
        trigger: "POST /savings-cases/{savingsCaseId}/file-rebate"
        actor: EnergyEngineer
        preconditions: ["savings_status in {MODELED, MEASURED}"]
        side_effects: ["provisional_rebate_cents = utility_rebate(deemed_annual_savings_kwh, project_cost_cents) — always from deemed, even when MEASURED"]
      - from: "rebate_status FILED"
        to: "rebate_status APPROVED"
        trigger: "POST /savings-cases/{savingsCaseId}/record-rebate-decision (outcome=APPROVED)"
        actor: DealerAdmin | ContractManager
        preconditions: []
        side_effects: ["final_rebate_cents = utility_rebate(measured if savings_status==MEASURED else deemed, project_cost_cents)"]
      - from: "rebate_status FILED"
        to: "rebate_status REJECTED"
        trigger: "POST /savings-cases/{savingsCaseId}/record-rebate-decision (outcome=REJECTED)"
        actor: DealerAdmin | ContractManager
        preconditions: []
        side_effects: ["final_rebate_cents stays null"]

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-contracts/{serviceContractId}/activate"
        actor: ContractManager
        preconditions:
          - "Facility status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
          - "OCC: expected_facility_version == Facility.version (ERR_STALE_VERSION)"
        side_effects:
          - "Facility.version += 1"
          - "Supersede: the facility's currently ACTIVE contract (if any) -> SUPERSEDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-contracts/{serviceContractId}/suspend"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when sla_breach_count reaches 3)"
        actor: system
        preconditions: []
        side_effects: ["termination_penalty_waived = true"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-contracts/{serviceContractId}/reinstate"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /service-contracts/{serviceContractId}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects: ["termination_fee_cents = 0 if termination_penalty_waived else 2 * monthly_fee_cents"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /service-contracts/{serviceContractId}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects: ["termination_fee_cents = 0 if termination_penalty_waived else 2 * monthly_fee_cents"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /service-contracts/{serviceContractId}/expire"
        actor: ContractManager
        preconditions: ["current logical clock date > end_date (ERR_CONTRACT_NOT_EXPIRED; strictly greater — expirable the day after end_date)"]
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascade when another contract of the same facility is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /service-tickets/{serviceTicketId}/dispatch"
        actor: ServiceTech
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /service-tickets/{serviceTicketId}/record-response"
        actor: ServiceTech
        preconditions: []
        side_effects:
          - "first_response_at = logical clock; sla_met = (first_response_at <= sla_deadline)"
          - "Breach cascade 1: if sla_met == false, create ServiceCredit(source=SLA_BREACH, status=ACCRUED, amount = round_half_up(monthly_fee_cents * 0.05) gross snapshot)"
          - "Breach cascade 2: contract counters — credits_accrued_total_cents += amount, credits_outstanding_cents += amount, sla_breach_count += 1"
          - "Breach cascade 3: if sla_breach_count >= 3, contract ACTIVE -> SUSPENDED and termination_penalty_waived = true"
      - from: ON_SITE
        to: RESOLVED
        trigger: "POST /service-tickets/{serviceTicketId}/resolve"
        actor: ServiceTech
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /service-tickets/{serviceTicketId}/cancel"
        actor: FacilityManager
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /service-tickets/{serviceTicketId}/cancel"
        actor: FacilityManager
        preconditions: []
        side_effects: []

  - entity: RentalAsset
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_RENT
        trigger: "system (cascade when a RentalReservation on this asset is delivered)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: AVAILABLE
        trigger: "system (cascade when the ON_RENT RentalReservation is returned)"
        actor: system
        preconditions: []
        side_effects: ["next_available_date = actual_return_date + 1 day (turnaround buffer)"]
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /rental-assets/{rentalAssetId}/set-maintenance (in_maintenance=true)"
        actor: ServiceTech | DealerAdmin
        preconditions: ["No RentalReservation on this asset in {RESERVED, ON_RENT} (ERR_RENTAL_ASSET_UNAVAILABLE)"]
        side_effects: []
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /rental-assets/{rentalAssetId}/set-maintenance (in_maintenance=false)"
        actor: ServiceTech | DealerAdmin
        preconditions: []
        side_effects: []

  - entity: RentalReservation
    initial_state: RESERVED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ON_RENT
        trigger: "POST /rental-reservations/{rentalReservationId}/deliver"
        actor: ServiceTech
        preconditions: []
        side_effects: ["RentalAsset -> ON_RENT"]
      - from: ON_RENT
        to: RETURNED
        trigger: "POST /rental-reservations/{rentalReservationId}/return"
        actor: ServiceTech
        preconditions: ["actual_return_date >= start_date (ERR_RENTAL_DATE_RANGE_INVALID)"]
        side_effects:
          - "actual_bill_cents = actual rental_billing variant (min-days floor + long-term discount)"
          - "RentalAsset -> AVAILABLE with next_available_date = actual_return_date + 1"
          - "Facility.rental_escrow_cents -= deposit_cents (deposit released)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /rental-reservations/{rentalReservationId}/cancel"
        actor: FacilityManager
        preconditions: []
        side_effects: ["Facility.rental_escrow_cents -= deposit_cents (compensating release; net escrow drift of create+cancel is zero)"]
      - from: RETURNED
        to: INVOICED
        trigger: "POST /rental-reservations/{rentalReservationId}/invoice"
        actor: ContractManager
        preconditions: []
        side_effects: ["final_bill_cents = actual_bill_cents (locked)"]

  - entity: GuaranteeCertificate
    initial_state: "settlement_status=AWAITING_MEASUREMENT, dispute_status=NONE (two independent dimensions)"
    terminal_states: ["settlement_status=PAID (dim 1 terminal)", "dispute_status in {RESOLVED_UPHELD, RESOLVED_OVERRULED} (dim 2 terminal)"]
    transitions:
      - from: "settlement_status AWAITING_MEASUREMENT"
        to: "settlement_status SETTLED_NO_SHORTFALL"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/settle"
        actor: ContractManager
        preconditions:
          - "SavingsCase.savings_status == MEASURED (ERR_MEASUREMENT_INCOMPLETE)"
          - "Facility.posture == NORMAL (ERR_POSTURE_NOT_NORMAL)"
          - "dispute_status == NONE"
        side_effects:
          - "measured_kwh_at_settlement = savings case measured value; shortfall_kwh and payout_cents computed"
          - "SETTLED_NO_SHORTFALL when shortfall_kwh == 0 (payout_cents == 0)"
      - from: "settlement_status AWAITING_MEASUREMENT"
        to: "settlement_status SETTLED_PAYOUT_DUE"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/settle"
        actor: ContractManager
        preconditions: ["Same gates as the NO_SHORTFALL branch"]
        side_effects: ["SETTLED_PAYOUT_DUE when shortfall_kwh > 0"]
      - from: "settlement_status SETTLED_PAYOUT_DUE"
        to: "settlement_status PAID"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/pay"
        actor: ContractManager
        preconditions: ["dispute_status in {NONE, RESOLVED_OVERRULED, RESOLVED_UPHELD} — OPEN freezes payout (ERR_DISPUTE_OPEN_PAYOUT_FROZEN)"]
        side_effects: []
      - from: "dispute_status NONE (settlement SETTLED_NO_SHORTFALL or SETTLED_PAYOUT_DUE)"
        to: "dispute_status OPEN"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/dispute"
        actor: FacilityManager
        preconditions: ["settlement_status in {SETTLED_NO_SHORTFALL, SETTLED_PAYOUT_DUE} (not PAID)"]
        side_effects: ["dispute_reason stored; payout frozen while OPEN (pay rejected)"]
      - from: "dispute_status OPEN"
        to: "dispute_status RESOLVED_UPHELD"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/resolve-dispute (outcome=UPHELD, corrected_measured_kwh)"
        actor: ContractManager
        preconditions: ["corrected_measured_kwh required when outcome=UPHELD (ERR_INVALID_REQUEST)"]
        side_effects:
          - "Recompute loop: measured_kwh_at_settlement = corrected_measured_kwh; shortfall_kwh and payout_cents recomputed"
          - "settlement_status re-derived: SETTLED_NO_SHORTFALL if shortfall_kwh == 0 else SETTLED_PAYOUT_DUE (unless already PAID, which cannot happen since pay is blocked while OPEN)"
      - from: "dispute_status OPEN"
        to: "dispute_status RESOLVED_OVERRULED"
        trigger: "POST /guarantee-certificates/{guaranteeCertificateId}/resolve-dispute (outcome=OVERRULED)"
        actor: ContractManager
        preconditions: []
        side_effects: ["Settlement figures unchanged; payout released for pay"]

  - entity: ServiceCredit
    initial_state: ACCRUED
    terminal_states: [APPLIED, EXPIRED]
    transitions:
      - from: ACCRUED
        to: APPLIED
        trigger: "POST /service-credits/{serviceCreditId}/apply"
        actor: ContractManager
        preconditions: []
        side_effects: ["Contract: credits_outstanding_cents -= amount, credits_applied_total_cents += amount (identity accrued == applied + expired + outstanding preserved)"]
      - from: ACCRUED
        to: EXPIRED
        trigger: "POST /service-credits/{serviceCreditId}/expire"
        actor: ContractManager
        preconditions: ["current logical clock >= expires_at (ERR_CREDIT_NOT_EXPIRED; >= inclusive)"]
        side_effects: ["Contract: credits_outstanding_cents -= amount, credits_expired_total_cents += amount (identity preserved)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Facility.version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: demand-profile-lock-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /demand-profiles/{demandProfileId}/lock"
    occ_field: "expected_facility_version"
    description: |
      Locking a DemandProfile supersedes the facility's previously LOCKED profile.
      A lock request carrying an expected_facility_version that no longer equals
      Facility.version (because another lock or contract activation has advanced
      it) is rejected: the caller's view of which baseline is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-activate-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /service-contracts/{serviceContractId}/activate"
    occ_field: "expected_facility_version"
    description: |
      Activating a ServiceContract supersedes the facility's currently ACTIVE
      contract. An activate request whose expected_facility_version is behind
      Facility.version is rejected: the caller may not have observed the contract
      that is now ACTIVE.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: baseline_annualization
    trigger: "DemandProfile creation"
    algorithm: aggregation
    formula: |
      window_days = (window_end_date - window_start_date) in days + 1   # inclusive both ends
      baseline_annual_kwh = round_half_up(measured_kwh * 365 / window_days) to whole kWh
    input_set: "the single DemandProfile being created; runs identically for baseline and post-retrofit profiles"
    precision: "0 decimal places (whole kWh), round_half_up"

  - name: leak_annual_savings_per_tag
    trigger: "LeakTag verify-closure"
    algorithm: aggregation
    formula: |
      annual_kwh_savings = round_half_up(cfm_loss * KW_PER_CFM * facility.operating_hours_per_year) to whole kWh
    input_set: "the single LeakTag being closed; facility is the tag's survey's facility"
    constants:
      KW_PER_CFM: 0.20
    precision: "0 decimal places (whole kWh), round_half_up"

  - name: deemed_annual_savings
    trigger: "SavingsCase model; recompute on any facility LeakTag verify-closure while savings_status == MODELED"
    algorithm: aggregation
    formula: |
      leak_component_kwh = SUM(tag.annual_kwh_savings) over input set   # per-tag values already rounded (see leak_annual_savings_per_tag); NEVER recompute from raw cfm and round after summing
      pressure_drop_psi = min(project.baseline_pressure_psi - project.target_pressure_psi, PRESSURE_REDUCTION_CAP_PSI)
      sequencing_component_kwh = round_half_up(baseline_profile.baseline_annual_kwh * (SEQ_BASE_PCT + PRESSURE_SAVINGS_PCT_PER_PSI * pressure_drop_psi))
      deemed_annual_savings_kwh = leak_component_kwh + sequencing_component_kwh
    input_set: "LeakTags in VERIFIED_CLOSED belonging to VERIFIED LeakSurveys of the same facility; pinned baseline profile; referenced retrofit project"
    constants:
      SEQ_BASE_PCT: 0.07
      PRESSURE_SAVINGS_PCT_PER_PSI: 0.005
      PRESSURE_REDUCTION_CAP_PSI: 20
    precision: "0 decimal places (whole kWh), round_half_up; nested rounding order pinned: round each leak first, then sum, then add sequencing component"
    variants:
      - name: sum_then_round_rejected
        when: "never — documented rejection"
        difference: "Summing raw cfm*kW*hours across leaks and rounding once yields a different total (e.g. 2373 vs 2374 for 0.85+1.15 CFM at 5933 h); the scaffold pins per-tag rounding"

  - name: measured_annual_savings
    trigger: "SavingsCase close-measurement"
    algorithm: aggregation
    formula: |
      post_annual_kwh = round_half_up(post.measured_kwh * 365 / post.window_days)   # baseline_annualization on post profile
      measured_annual_savings_kwh = baseline_profile.baseline_annual_kwh - post_annual_kwh   # signed; may be negative
    input_set: "pinned baseline DemandProfile (by id+version); post DemandProfile supplied at close"
    precision: "0 decimal places, round_half_up"
    variants:
      - name: deemed_vs_measured
        when: "deemed computed at model from engineering estimates; measured computed at close-measurement from metered post profile"
        difference: "Same facility inputs produce different savings: deemed 522800 kWh vs measured 486667 kWh for the canonical fixture; rebate and guarantee consume different variants at different stages"

  - name: utility_rebate
    trigger: "file-rebate (provisional, always over deemed); record-rebate-decision APPROVED (final, over measured when savings_status==MEASURED else deemed)"
    algorithm: tiered_pricing
    formula: |
      tiered_cents = TIER1_RATE_CENTS * min(savings_kwh, TIER1_KWH) + TIER2_RATE_CENTS * max(0, savings_kwh - TIER1_KWH)
      cost_cap_cents = round_half_up(project.project_cost_cents * COST_CAP_PCT)
      rebate_cents = min(tiered_cents, cost_cap_cents, PROGRAM_CAP_CENTS)   # evaluation order pinned: tiered first, then caps
    input_set: "the SavingsCase (savings figure per variant); referenced RetrofitProject.project_cost_cents"
    constants:
      TIER1_KWH: 100000
      TIER1_RATE_CENTS: 7
      TIER2_RATE_CENTS: 3
      COST_CAP_PCT: 0.50
      PROGRAM_CAP_CENTS: 20000000
    precision: "integer cents throughout; only the cost cap involves rounding (round_half_up)"
    variants:
      - name: provisional_vs_final
        when: "provisional at file-rebate over deemed; final at rebate approval over measured (if MEASURED) else deemed"
        difference: "identical formula, different savings input: provisional 1968400c (deemed 522800) vs final 1860001c (measured 486667) on the canonical fixture"

  - name: sla_deadline_and_met
    trigger: "ServiceTicket creation (deadline); record-response (sla_met)"
    algorithm: threshold
    formula: |
      base_hours = SLA_BASE_HOURS[sla_tier_snapshot]            # BASIC 48, STANDARD 24, PREMIUM 8
      sla_deadline = reported_at + base_hours * SEVERITY_MULTIPLIER[severity] hours   # EMERGENCY 1, URGENT 2, ROUTINE 4
      sla_met = (first_response_at <= sla_deadline)             # <= inclusive: response exactly at deadline is MET
    input_set: "the ticket; tier snapshot taken from the ACTIVE contract at creation"
    constants:
      SLA_BASE_HOURS: { BASIC: 48, STANDARD: 24, PREMIUM: 8 }
      SEVERITY_MULTIPLIER: { EMERGENCY: 1, URGENT: 2, ROUTINE: 4 }
    precision: "second-granularity ISO datetimes; comparison is inclusive <="

  - name: sla_credit_amount
    trigger: "record-response when sla_met == false"
    algorithm: threshold
    formula: |
      credit_cents = round_half_up(contract.monthly_fee_cents * SLA_CREDIT_PCT)
      # Evaluation order pinned (circular-looking dependency resolved): the credit base is the GROSS
      # monthly fee snapshot at accrual time. It is NEVER the fee net of previously applied credits,
      # so the credit amount does not depend on the order in which earlier credits were applied.
    input_set: "the ServiceContract resolved on the breaching ticket"
    constants:
      SLA_CREDIT_PCT: 0.05
      SLA_BREACH_SUSPEND_THRESHOLD: 3
      CREDIT_TTL_DAYS: 90
    precision: "integer cents, round_half_up"

  - name: rental_billing
    trigger: "RentalReservation creation (quote variant); return (actual variant)"
    algorithm: tiered_pricing
    formula: |
      # Quote variant (at creation):
      planned_days = end_date - start_date + 1
      quoted_cents = planned_days * daily_rate_cents                     # no minimum-days floor, no discount
      # Actual variant (at return):
      actual_days = actual_return_date - start_date + 1
      billable_days = max(actual_days, MIN_BILL_DAYS)                    # 3-day minimum
      full_rate_days = min(billable_days, LONG_TERM_DAY - 1)             # days 1..27 full rate
      discounted_days = max(0, billable_days - (LONG_TERM_DAY - 1))      # days 28+ discounted
      actual_bill_cents = round_half_up(daily_rate_cents * (full_rate_days + LONG_TERM_RATE_FACTOR * discounted_days))
    input_set: "the reservation; daily_rate_cents snapshotted from the RentalAsset"
    constants:
      MIN_BILL_DAYS: 3
      LONG_TERM_DAY: 28
      LONG_TERM_RATE_FACTOR: 0.85
    precision: "integer cents, round_half_up once at the end of the actual variant"
    variants:
      - name: quoted_vs_actual
        when: "quote at reservation over planned_days; actual at return over actual duration with floor and discount"
        difference: "same reservation, different totals: quote 350000c for 10 planned days vs actual 140000c when returned after 4 days"

  - name: maintenance_delinquency
    trigger: "compressor log-run-hours; schedule creation; record-service; schedule retire"
    algorithm: threshold
    formula: |
      facility_max_run_hours = max(run_hours_total over the facility's compressors not DECOMMISSIONED; 0 when none)
      schedule.next_due_run_hours = schedule.anchor_run_hours + schedule.interval_hours
      schedule.is_delinquent = (schedule.status == ACTIVE) AND (facility_max_run_hours >= schedule.next_due_run_hours)
      # boundary pinned: >= is inclusive — reaching exactly next_due_run_hours IS delinquent
    input_set: "all compressors of the facility; all ACTIVE MaintenanceSchedules of the facility"
    precision: "integer run-hours; inclusive >="

  - name: facility_posture
    trigger: "any compressor status change, log-run-hours, schedule create/record-service/retire, facility status change"
    algorithm: constraint_propagation
    formula: |
      if any compressor of facility has status == DOWN: posture = OUTAGE_ACTIVE
      elif any ACTIVE MaintenanceSchedule of facility has is_delinquent: posture = MAINTENANCE_DELINQUENT
      else: posture = NORMAL
      # precedence pinned: OUTAGE_ACTIVE > MAINTENANCE_DELINQUENT > NORMAL
      # every recompute also recomputes GuaranteeCertificate.settlement_blocked = (posture != NORMAL)
      # for all certificates of the facility not in settlement_status PAID
    input_set: "facility's compressors and ACTIVE schedules; facility's GuaranteeCertificates"
    precision: "n/a"

  - name: guarantee_settlement
    trigger: "certificate creation (guaranteed/deadband snapshot); settle and resolve-dispute UPHELD (shortfall/payout)"
    algorithm: tiered_pricing
    formula: |
      guaranteed_kwh = round_half_up(savings_case.deemed_annual_savings_kwh_at_creation * guaranteed_pct)   # snapshot; never recomputed even if deemed later changes
      deadband_kwh = round_half_up(guaranteed_kwh * DEADBAND_PCT)
      shortfall_kwh = max(0, guaranteed_kwh - measured_kwh_at_settlement - deadband_kwh)   # deadband subtracted before clamp
      payout_cents = min(round_half_up(shortfall_kwh * facility.utility_rate_cents_per_kwh), contract.monthly_fee_cents * 12)
    input_set: "certificate's savings case (deemed snapshot), facility rate, contract monthly fee; measured value from case at settle or corrected value on upheld dispute"
    constants:
      DEADBAND_PCT: 0.02
      PAYOUT_CAP_MONTHS: 12
    precision: "whole kWh and integer cents, round_half_up; nested rounding order pinned: guaranteed -> deadband -> shortfall -> payout"

  - name: leak_priority_ranking
    trigger: "LeakSurvey verify"
    algorithm: weighted_scoring
    formula: |
      rank all LeakTags of the survey by: cfm_loss DESC, tie -> repair_quote_cents ASC, tie -> created_at ASC
      assign priority_rank 1..N in that order
    input_set: "all LeakTags of the survey regardless of status at verify time"
    precision: "ranks are dense 1-based integers; ties fully broken by created_at (never by id)"

  - name: rental_asset_selector
    trigger: "RentalReservation creation when rental_asset_id is omitted"
    algorithm: selector
    formula: |
      eligible = RentalAssets where status == AVAILABLE
                 AND rated_cfm >= down_compressor.rated_cfm
                 AND no overlapping reservation (see rental_overlap validation)
      rank by rated_cfm ASC, tie -> created_at ASC
      empty pool -> ERR_NO_RENTAL_ASSET_AVAILABLE
    input_set: "all RentalAssets; reservations on each candidate"
    precision: "deterministic selector: explicit filter, ranking, tie-break, and empty-pool error all pinned"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; a request failing several
# rules reports the LOWEST priority number)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template resource ids resolve, left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_constraint
    check: "Request schema: required fields present, types valid, enum values in declared sets, dates ISO format, target_pressure_psi < baseline_pressure_psi, corrected_measured_kwh present iff outcome=UPHELD"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: auth
    check: "Ownership: when X-User-Role == FacilityManager, X-User-ID must equal the id of the Facility that owns the acted-upon resource (directly or via its parent chain)"
    error_id: ERR_FACILITY_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include FacilityManager"
  - priority: 6
    category: state
    check: "State-machine from-state: the transition must be declared for the entity's current state/dimension; otherwise rejected"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints (non-CRUD POSTs on a resource)"
  - priority: 6
    category: state
    check: "Facility gate: facility status == ACTIVE"
    error_id: ERR_FACILITY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /demand-profiles/{id}/lock, POST /service-contracts/{id}/activate, POST /service-tickets, POST /rental-reservations, POST /leak-tags/{id}/authorize-repair, POST /savings-cases"
  - priority: 6
    category: state
    check: "Contract gate: facility has a ServiceContract in ACTIVE; none exists -> ERR_NO_ACTIVE_CONTRACT; the facility's latest non-terminal contract is SUSPENDED -> ERR_CONTRACT_SUSPENDED"
    error_id: ERR_NO_ACTIVE_CONTRACT
    http_status: 409
    applies_to: "POST /service-tickets, POST /rental-reservations, POST /guarantee-certificates"
  - priority: 6
    category: state
    check: "Contract gate variant: the facility's latest non-terminal contract is SUSPENDED"
    error_id: ERR_CONTRACT_SUSPENDED
    http_status: 409
    applies_to: "POST /service-tickets, POST /rental-reservations"
  - priority: 6
    category: state
    check: "Compressor gate: down_compressor_id's status == DOWN"
    error_id: ERR_COMPRESSOR_NOT_DOWN
    http_status: 409
    applies_to: "POST /rental-reservations"
  - priority: 6
    category: state
    check: "Survey gate: parent LeakSurvey.status == VERIFIED"
    error_id: ERR_SURVEY_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /leak-tags/{id}/authorize-repair"
  - priority: 6
    category: state
    check: "Baseline gate: referenced DemandProfile.status == LOCKED"
    error_id: ERR_PROFILE_NOT_LOCKED
    http_status: 409
    applies_to: "POST /savings-cases, POST /savings-cases/{id}/close-measurement, POST /savings-cases/{id}/rebase"
  - priority: 6
    category: state
    check: "Staleness gates: savings case baseline_stale == false and retrofit_stale == false; ERR_BASELINE_SUPERSEDED wins over ERR_RETROFIT_STALE when both flags set"
    error_id: ERR_BASELINE_SUPERSEDED
    http_status: 409
    applies_to: "POST /savings-cases/{id}/model"
  - priority: 6
    category: state
    check: "Retrofit staleness gate: retrofit_stale == false"
    error_id: ERR_RETROFIT_STALE
    http_status: 409
    applies_to: "POST /savings-cases/{id}/model"
  - priority: 6
    category: state
    check: "Retrofit status gate: APPROVED-or-later for savings-case creation/model/rebase"
    error_id: ERR_RETROFIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /savings-cases, POST /savings-cases/{id}/model, POST /savings-cases/{id}/rebase (when retrofit_project_id supplied)"
  - priority: 6
    category: state
    check: "Retrofit must be ACCEPTED before measurement opens"
    error_id: ERR_RETROFIT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /savings-cases/{id}/open-measurement"
  - priority: 6
    category: state
    check: "Measurement gate: linked SavingsCase.savings_status == MEASURED"
    error_id: ERR_MEASUREMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /guarantee-certificates/{id}/settle"
  - priority: 6
    category: state
    check: "Posture gate: facility.posture == NORMAL"
    error_id: ERR_POSTURE_NOT_NORMAL
    http_status: 409
    applies_to: "POST /guarantee-certificates/{id}/settle"
  - priority: 6
    category: state
    check: "Dispute freeze gate: certificate.dispute_status != OPEN"
    error_id: ERR_DISPUTE_OPEN_PAYOUT_FROZEN
    http_status: 409
    applies_to: "POST /guarantee-certificates/{id}/pay"
  - priority: 7
    category: business_referential
    check: "Cross-facility referential integrity: every referenced entity (baseline/post profile, retrofit project, contract, savings case, compressor) must belong to the same facility as the resource being created/acted on"
    error_id: ERR_FACILITY_MISMATCH
    http_status: 409
    applies_to: "POST /savings-cases, POST /savings-cases/{id}/close-measurement, POST /service-tickets, POST /rental-reservations, POST /guarantee-certificates, POST /savings-cases/{id}/rebase"
  - priority: 7
    category: business_referential
    check: "Sequence referential integrity: every sequence_compressor_ids entry resolves to a Compressor of this facility; at approve time each must also be IN_SERVICE"
    error_id: ERR_SEQUENCE_COMPRESSOR_INVALID
    http_status: 422
    applies_to: "POST /retrofit-projects, POST /retrofit-projects/{id}/approve"
  - priority: 8
    category: business_temporal
    check: "Measurement-window overlap: closed-closed [window_start_date, window_end_date] must not intersect any other DemandProfile of the same facility in {COLLECTING, LOCKED}; sharing a single calendar day IS an intersection (no buffer)"
    error_id: ERR_MEASUREMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /demand-profiles"
  - priority: 8
    category: business_temporal
    check: "Rental overlap with turnaround buffer: for the chosen RentalAsset, occupied interval = [start_date, effective_end + 1 day] where effective_end = actual_return_date if RETURNED/INVOICED else end_date, over reservations in {RESERVED, ON_RENT, RETURNED, INVOICED}; new [start_date, end_date] intersecting any occupied interval (closed-closed) is rejected — a new start exactly 2 days after an occupied end is the earliest legal adjacency"
    error_id: ERR_RENTAL_ASSET_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rental-reservations"
  - priority: 8
    category: business_temporal
    check: "Rental asset explicit-choice gates: explicitly named asset must be status AVAILABLE and rated_cfm >= down compressor rated_cfm; set-maintenance(true) requires no reservation on the asset in {RESERVED, ON_RENT}"
    error_id: ERR_RENTAL_ASSET_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rental-reservations (when rental_asset_id supplied); POST /rental-assets/{id}/set-maintenance"
  - priority: 8
    category: business_temporal
    check: "Rental date range: end_date >= start_date; actual_return_date >= start_date"
    error_id: ERR_RENTAL_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "POST /rental-reservations, POST /rental-reservations/{id}/return"
  - priority: 8
    category: business_temporal
    check: "Post-measurement window must begin after retrofit acceptance: post profile window_start_date > project.accepted_date"
    error_id: ERR_POST_WINDOW_BEFORE_ACCEPTANCE
    http_status: 409
    applies_to: "POST /savings-cases/{id}/close-measurement"
  - priority: 8
    category: business_temporal
    check: "Expiry timing: contract expirable only when logical clock date > end_date; credit expirable only when logical clock >= expires_at"
    error_id: ERR_CONTRACT_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /service-contracts/{id}/expire (ERR_CONTRACT_NOT_EXPIRED); POST /service-credits/{id}/expire (ERR_CREDIT_NOT_EXPIRED)"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: Compressor.asset_tag unique per facility among non-DECOMMISSIONED; RentalAsset.fleet_tag globally unique; MaintenanceSchedule (facility_id, component) unique among ACTIVE; at most one GuaranteeCertificate per savings_case_id"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: "POST /compressors (ERR_DUPLICATE_ASSET_TAG); POST /rental-assets (ERR_DUPLICATE_FLEET_TAG); POST /maintenance-schedules (ERR_DUPLICATE_SCHEDULE_COMPONENT); POST /guarantee-certificates (ERR_CERTIFICATE_EXISTS)"
  - priority: 9
    category: business_constraint
    check: "Monotonic run-hours: log-run-hours run_hours_total >= current run_hours_total; record-service run_hours_reading >= anchor_run_hours"
    error_id: ERR_RUN_HOURS_REGRESSION
    http_status: 422
    applies_to: "POST /compressors/{id}/log-run-hours, POST /maintenance-schedules/{id}/record-service"
  - priority: 9
    category: business_constraint
    check: "Cross-check: record-service run_hours_reading <= facility max compressor run_hours_total"
    error_id: ERR_READING_EXCEEDS_LOGGED
    http_status: 422
    applies_to: "POST /maintenance-schedules/{id}/record-service"
  - priority: 9
    category: business_constraint
    check: "Non-empty set: survey submit requires >= 1 LeakTag"
    error_id: ERR_EMPTY_SURVEY
    http_status: 422
    applies_to: "POST /leak-surveys/{id}/submit"
  - priority: 9
    category: business_constraint
    check: "Segregation of duties: survey verify X-User-ID != submitted_by_user_id; close-measurement X-User-ID != baseline profile locked_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /leak-surveys/{id}/verify, POST /savings-cases/{id}/close-measurement"
  - priority: 9
    category: business_constraint
    check: "Selector empty pool: rental auto-select finds no eligible RentalAsset"
    error_id: ERR_NO_RENTAL_ASSET_AVAILABLE
    http_status: 409
    applies_to: "POST /rental-reservations (rental_asset_id omitted)"
  - priority: 10
    category: business_fiscal
    check: "Repair budget: facility.repair_committed_cents + repair_quote_cents <= facility.repair_budget_cents (inclusive)"
    error_id: ERR_REPAIR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /leak-tags/{id}/authorize-repair"
  - priority: 10
    category: business_fiscal
    check: "Tier entitlement: rental reservation requires the facility's ACTIVE contract tier in {STANDARD, PREMIUM}; guarantee certificate requires tier PREMIUM"
    error_id: ERR_CONTRACT_TIER_INELIGIBLE
    http_status: 409
    applies_to: "POST /rental-reservations, POST /guarantee-certificates"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Drives reported_at/first_response_at/accrued_at stamps, accepted_date, and expiry checks."
    roles: [DealerAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Facility ---
  - method: POST
    path: "/facilities"
    description: "Create a Facility in ONBOARDING with posture NORMAL"
    roles: [DealerAdmin]
    code: 201
    input: [name, utility_rate_cents_per_kwh, operating_hours_per_year, repair_budget_cents]
    output: Facility
    side_effects: ["status=ONBOARDING, posture=NORMAL, repair_committed_cents=0, rental_escrow_cents=0"]

  - method: GET
    path: "/facilities"
    description: "List facilities with optional filters and pagination"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["status?", "posture?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/facilities/{facilityId}"
    description: "Get a Facility"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{facilityId}/activate"
    description: "ONBOARDING -> ACTIVE"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/facilities/{facilityId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> SUSPENDED; posture recompute; certificate settlement_blocked recompute"]

  - method: POST
    path: "/facilities/{facilityId}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> ACTIVE; posture recompute; certificate settlement_blocked recompute"]

  - method: POST
    path: "/facilities/{facilityId}/offboard"
    description: "ACTIVE|SUSPENDED -> OFFBOARDED; blocked by open obligations"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> OFFBOARDED"]

  # --- Compressor ---
  - method: POST
    path: "/compressors"
    description: "Register a Compressor (IN_SERVICE)"
    roles: [DealerAdmin, ServiceTech]
    code: 201
    input: [facility_id, asset_tag, rated_kw, rated_cfm, "run_hours_total?"]
    output: Compressor
    side_effects: ["status=IN_SERVICE; facility posture recompute"]

  - method: GET
    path: "/compressors"
    description: "List compressors (FK reverse for Compressor.facility_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "Compressor[]"
    side_effects: []

  - method: GET
    path: "/compressors/{compressorId}"
    description: "Get a Compressor"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: Compressor
    side_effects: []

  - method: POST
    path: "/compressors/{compressorId}/log-run-hours"
    description: "Set cumulative run-hours (monotonic); recomputes delinquency and posture"
    roles: [ServiceTech]
    code: 200
    input: [run_hours_total]
    output: Compressor
    side_effects:
      - "run_hours_total updated (ERR_RUN_HOURS_REGRESSION if lower)"
      - "Maintenance schedule is_delinquent recompute -> Facility.posture recompute -> GuaranteeCertificate.settlement_blocked recompute"

  - method: POST
    path: "/compressors/{compressorId}/mark-down"
    description: "IN_SERVICE -> DOWN (opens outage posture)"
    roles: [ServiceTech]
    code: 200
    input: []
    output: Compressor
    side_effects: ["status -> DOWN; Facility.posture -> OUTAGE_ACTIVE (recompute); certificate settlement_blocked recompute"]

  - method: POST
    path: "/compressors/{compressorId}/return-to-service"
    description: "DOWN -> IN_SERVICE (closes outage posture when last DOWN unit returns)"
    roles: [ServiceTech]
    code: 200
    input: []
    output: Compressor
    side_effects: ["status -> IN_SERVICE; posture recompute; certificate settlement_blocked recompute"]

  - method: POST
    path: "/compressors/{compressorId}/decommission"
    description: "IN_SERVICE|DOWN -> DECOMMISSIONED; cancels referencing retrofit projects; flags savings cases retrofit_stale"
    roles: [DealerAdmin, ContractManager]
    code: 200
    input: []
    output: Compressor
    side_effects:
      - "status -> DECOMMISSIONED"
      - "RetrofitProjects in {PROPOSED, APPROVED, INSTALLED} sequencing this unit -> CANCELLED"
      - "SavingsCases referencing cancelled projects in {DRAFT, MODELED} -> retrofit_stale = true"
      - "posture recompute; settlement_blocked recompute"

  # --- DemandProfile ---
  - method: POST
    path: "/demand-profiles"
    description: "Create a DemandProfile (COLLECTING); closed-closed window overlap check per facility"
    roles: [EnergyEngineer]
    code: 201
    input: [facility_id, window_start_date, window_end_date, measured_kwh, measured_avg_cfm, measured_peak_cfm]
    output: DemandProfile
    side_effects: ["status=COLLECTING; baseline_annual_kwh computed"]

  - method: GET
    path: "/demand-profiles"
    description: "List demand profiles (FK reverse for facility_id and superseded_by_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "status?", "superseded_by_id?", "limit?", "offset?"]
    output: "DemandProfile[]"
    side_effects: []

  - method: GET
    path: "/demand-profiles/{demandProfileId}"
    description: "Get a DemandProfile"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: DemandProfile
    side_effects: []

  - method: POST
    path: "/demand-profiles/{demandProfileId}/lock"
    description: "COLLECTING -> LOCKED with OCC; supersedes the facility's prior LOCKED profile"
    roles: [EnergyEngineer]
    code: 200
    input: [expected_facility_version]
    output: DemandProfile
    side_effects:
      - "increments Facility.version by 1"
      - "prior LOCKED profile -> SUPERSEDED (superseded_by_id set)"
      - "SavingsCases pinning the superseded profile in {DRAFT, MODELED} -> baseline_stale = true"
      - "locked_by_user_id = X-User-ID"

  # --- LeakSurvey / LeakTag ---
  - method: POST
    path: "/leak-surveys"
    description: "Create a LeakSurvey (DRAFT)"
    roles: [EnergyEngineer]
    code: 201
    input: [facility_id, survey_date]
    output: LeakSurvey
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/leak-surveys"
    description: "List leak surveys (FK reverse for LeakSurvey.facility_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "LeakSurvey[]"
    side_effects: []

  - method: GET
    path: "/leak-surveys/{leakSurveyId}"
    description: "Get a LeakSurvey"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: []

  - method: POST
    path: "/leak-surveys/{leakSurveyId}/leak-tags"
    description: "Add a LeakTag to a DRAFT survey"
    roles: [EnergyEngineer]
    code: 201
    input: [location_description, cfm_loss, repair_quote_cents]
    output: LeakTag
    side_effects: ["tag status=TAGGED; ERR_INVALID_STATE_TRANSITION if survey not DRAFT"]

  - method: GET
    path: "/leak-tags"
    description: "List leak tags (FK reverse for LeakTag.survey_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["survey_id?", "status?", "limit?", "offset?"]
    output: "LeakTag[]"
    side_effects: []

  - method: GET
    path: "/leak-tags/{leakTagId}"
    description: "Get a LeakTag"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: LeakTag
    side_effects: []

  - method: POST
    path: "/leak-surveys/{leakSurveyId}/submit"
    description: "DRAFT -> SUBMITTED; requires >= 1 tag; tags TAGGED -> QUOTED"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: ["status -> SUBMITTED; submitted_by_user_id set; contained tags TAGGED -> QUOTED"]

  - method: POST
    path: "/leak-surveys/{leakSurveyId}/verify"
    description: "SUBMITTED -> VERIFIED; verifier must differ from submitter; computes severity/rank/totals"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: ["status -> VERIFIED; verified_by_user_id set; severity + priority_rank + total_leak_cfm + tag_count computed"]

  - method: POST
    path: "/leak-tags/{leakTagId}/authorize-repair"
    description: "QUOTED -> REPAIR_AUTHORIZED; gates: survey VERIFIED, facility ACTIVE, repair budget"
    roles: [FacilityManager]
    code: 200
    input: []
    output: LeakTag
    side_effects: ["Facility.repair_committed_cents += repair_quote_cents"]

  - method: POST
    path: "/leak-tags/{leakTagId}/mark-repaired"
    description: "REPAIR_AUTHORIZED -> REPAIRED"
    roles: [ServiceTech]
    code: 200
    input: []
    output: LeakTag
    side_effects: ["repaired_by_user_id set"]

  - method: POST
    path: "/leak-tags/{leakTagId}/verify-closure"
    description: "REPAIRED -> VERIFIED_CLOSED; computes annual_kwh_savings; recomputes deemed savings on MODELED cases"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: LeakTag
    side_effects: ["annual_kwh_savings computed; deemed_annual_savings_kwh recompute on facility's MODELED SavingsCases"]

  - method: POST
    path: "/leak-tags/{leakTagId}/mark-wont-fix"
    description: "QUOTED|REPAIR_AUTHORIZED -> WONT_FIX; releases budget commitment when authorized"
    roles: [FacilityManager]
    code: 200
    input: []
    output: LeakTag
    side_effects: ["if was REPAIR_AUTHORIZED: Facility.repair_committed_cents -= repair_quote_cents"]

  # --- MaintenanceSchedule ---
  - method: POST
    path: "/maintenance-schedules"
    description: "Create a dryer/filter MaintenanceSchedule (ACTIVE); anchor = facility max compressor run-hours"
    roles: [DealerAdmin, ContractManager]
    code: 201
    input: [facility_id, component, interval_hours]
    output: MaintenanceSchedule
    side_effects: ["status=ACTIVE; anchor_run_hours set; next_due_run_hours and is_delinquent computed; posture recompute"]

  - method: GET
    path: "/maintenance-schedules"
    description: "List maintenance schedules (FK reverse for MaintenanceSchedule.facility_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "component?", "status?", "limit?", "offset?"]
    output: "MaintenanceSchedule[]"
    side_effects: []

  - method: GET
    path: "/maintenance-schedules/{maintenanceScheduleId}"
    description: "Get a MaintenanceSchedule"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: MaintenanceSchedule
    side_effects: []

  - method: POST
    path: "/maintenance-schedules/{maintenanceScheduleId}/record-service"
    description: "Record dryer/filter service; resets anchor to run_hours_reading and recomputes delinquency"
    roles: [ServiceTech]
    code: 200
    input: [service_date, run_hours_reading]
    output: MaintenanceSchedule
    side_effects: ["anchor_run_hours = run_hours_reading; next_due_run_hours recomputed; is_delinquent recomputed; posture recompute; settlement_blocked recompute"]

  - method: POST
    path: "/maintenance-schedules/{maintenanceScheduleId}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [ContractManager]
    code: 200
    input: []
    output: MaintenanceSchedule
    side_effects: ["status -> RETIRED; posture recompute; settlement_blocked recompute"]

  # --- RetrofitProject ---
  - method: POST
    path: "/retrofit-projects"
