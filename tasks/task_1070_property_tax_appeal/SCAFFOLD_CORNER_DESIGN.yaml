# §1.9 Scaffold Corner Design (breadth coverage of testable claims not covered by §1.8).
# Section/claim_type values come from references/claim-extraction-guide.md.
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_client_creation_returns_201
        claim_type: Creation
        grounds: [entities.Client.fields.entity_type]
        distinguishing_aspect: "POST /api/clients with all required fields returns 201 and echoes entity_type=BUSINESS, portal_enabled default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/clients"
              payload: { full_name: "New Co", email: "newco@x.test", entity_type: "BUSINESS" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Client.${cl_id}.entity_type == BUSINESS"
            - "Client.${cl_id}.portal_enabled == true"
            - "Client.${cl_id}.lifetime_fees_billed_cents == 0"

      - name: corner_assessment_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/assessments/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/assessments/00000000-0000-0000-0000-000000000000"
              as: Analyst
              as_user_id: "op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response HTTP status == 404"

      - name: corner_appeal_missing_valuation_method_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Appeal.fields.valuation_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/appeals without valuation_method returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Analyst, client, jurisdiction, fee agreement, parcel, assessment exist."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "ca1@f.test", license_number: "CL1" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CC1", email: "cc1@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JX", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX1", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
          trigger:
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 422"

      - name: corner_evidence_adjusted_value_is_computed
        claim_type: Computed Fields
        grounds: [entities.Evidence.fields.adjusted_sale_value_cents, calculations.comp_adjusted_sale_value]
        distinguishing_aspect: "POST evidence sale_price 20000000 adjustment -0.10 -> adjusted_sale_value_cents == 18000000 (server-computed)."
        test_recipe:
          setup: ["Appeal in DRAFT exists."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "ca2@f.test", license_number: "CL2" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CC2", email: "cc2@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JY", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX2", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "z", sale_price_cents: 20000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 18000000, adjustment_pct: -0.10 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { adj: $.data.adjusted_sale_value_cents }
          assert:
            - "Evidence.adjusted_sale_value_cents == 18000000"

      - name: corner_assessment_duplicate_year_returns_duplicate
        claim_type: Type Constraints
        grounds: ["validations[priority=19]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second assessment for the same (parcel_id, tax_year) returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Parcel with a 2026 assessment already created."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "ca3@f.test", license_number: "CL3" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CC3", email: "cc3@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JZ", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX3", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
          trigger:
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 31000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "response HTTP status == 409"

      - name: corner_assessment_list_by_parcel_paginated
        claim_type: Listing
        grounds: [entities.Assessment.fields.parcel_id]
        distinguishing_aspect: "GET /api/assessments?parcel_id returns an array envelope with total_count and has_more (FK reverse-reachability)."
        test_recipe:
          setup: ["One parcel with one assessment."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "ca4@f.test", license_number: "CL4" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CC4", email: "cc4@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JW", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX4", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
          trigger:
            - call: "GET /api/assessments?parcel_id=${p_id}"
              as: Analyst
              as_user_id: "${an_id}"
          assert:
            - "response_type == array"
            - "meta/total_count == 1"
            - "data[0].id == ${as_id}"

  - section: state_machines
    instances:
      - name: corner_cancel_hearing_from_held_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Hearing.SCHEDULED_to_HELD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A HELD hearing cannot be cancelled — POST /hearings/{id}/cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Filed appeal with a hearing that has been HELD."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "cs1@f.test", license_number: "SL1" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "B", email: "cs1b@f.test", license_number: "SL1b" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CS1", email: "cs1c@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JH", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "SX1", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 27000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /api/hearings/${h_id}/cancel"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: corner_fee_agreement_double_accept_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.FeeAgreement.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACTIVE fee agreement a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Fee agreement accepted once (ACTIVE)."]
          setup_api_calls:
            - call: "POST /api/clients"
              payload: { full_name: "CS2", email: "cs2@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: corner_exemption_decide_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ExemptionClaim.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding a DRAFT (not SUBMITTED) exemption returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Exemption claim in DRAFT (never submitted)."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "cs3@f.test", license_number: "SL3" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CS3", email: "cs3c@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JE", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "SX3", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/exemption-claims"
              payload: { parcel_id: "${p_id}", tax_year: 2026, exemption_type: "SENIOR", exemption_value_cents: 1000000 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /api/exemption-claims/${ex_id}/decide"
              payload: { decision: "APPROVE" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response HTTP status == 409"

      - name: corner_settlement_double_accept_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SettlementOffer.PROPOSED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: ni_appeal_branch_settled_side_effects
          rationale: "Offer ACCEPTED (terminal) reached and asserted in the named §1.8 branch instance; a second accept is the same transition already exercised."

  - section: calculations
    instances:
      - name: corner_projected_annual_tax_no_exemption_on_create
        claim_type: Correct Result
        grounds: [calculations.assessment_projected_annual_tax, entities.Assessment.fields.projected_annual_tax_cents]
        distinguishing_aspect: "New assessment 30000000 @ millage 25.0 with no exemptions -> projected_annual_tax_cents == 750000."
        test_recipe:
          setup: ["Empty DB; one parcel."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "cc5@f.test", license_number: "CL5" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CN5", email: "cn5@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JT", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX5", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { pat: $.data.projected_annual_tax_cents }
          assert:
            - "Assessment.projected_annual_tax_cents == 750000"
            - "Assessment.assessed_value_cents == 30000000"

      - name: corner_fee_minimum_floor_applies
        claim_type: Constants Applied
        grounds: [calculations.contingency_fee, entities.FeeAgreement.fields.minimum_fee_cents, entities.Invoice.fields.fee_amount_cents]
        distinguishing_aspect: "Realized savings 25000 -> raw tier fee 10000 < minimum 15000, so Invoice.fee_amount_cents == 15000 (floor applied)."
        test_recipe:
          setup: ["Appeal decided with a small reduction: decision 29000000 -> realized 25000 -> fee floored to 15000."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "cc6@f.test", license_number: "CL6" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "B", email: "cc6b@f.test", license_number: "CL6b" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CN6", email: "cn6@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JF", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "CX6", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 29000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 29000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /api/appeals/${ap_id}/record-decision"
              payload: { decision_value_cents: 29000000 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { rs: $.data.realized_savings_cents }
          assert:
            - "Appeal.${ap_id}.realized_savings_cents == 25000"
            - "Invoice(appeal_id=${ap_id}).fee_amount_cents == 15000"

      - name: corner_valuation_equity_median_stub
        claim_type: Variant Selection
        grounds: [calculations.opinion_of_value]
        excluded_because:
          difficulty_instance: di_valuation_sales_comparison_vs_assessment_equity
          rationale: "ASSESSMENT_EQUITY median result (29000000) is directly asserted in the named §1.8 dual-variant instance."

  - section: validations
    instances:
      - name: corner_missing_role_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/absent role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/clients"
              payload: { full_name: "X", email: "x@x.test", entity_type: "INDIVIDUAL" }
              as: Anonymous
