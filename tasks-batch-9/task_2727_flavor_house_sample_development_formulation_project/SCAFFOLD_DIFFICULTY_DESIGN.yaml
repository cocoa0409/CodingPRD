            - "${cap_free_initial} == 4 and ${rs1_slots} == 3 (ceil(120/50)) and ${rs2_slots} == 1 (ceil(50/50), exact multiple)"
            - "the 50 g aliquot was admitted at occupancy 3 + 1 == 4 == capacity_slots (equality admits)"
            - "${free_after_two} == 0 at the 2026-08-01T00:00:00Z clock position"
            - "${err} == ERR_CABINET_CAPACITY_EXCEEDED with HTTP 422 (4 + 1 == 5 > 4)"
