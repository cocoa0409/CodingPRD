            - "melt_posture is STILL RESTRICTED immediately after the reverse — lowering the ratio does not auto-clear the posture"
            - "the second RECOMPUTE returns HTTP 200 with melt_posture == OPEN and posture_reason == null"
            - "the final staging call then returns HTTP 201: Plant.${plant_id}.cullet_received_kg_ytd == 3000.00 and cullet_on_hand_kg == 1500.00"

      - name: a_free_claim_that_contradicts_its_own_ppm_and_a_lab_result_over_the_program_limit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORMALDEHYDE_FREE_CLAIM_INVALID]
          - errors[ERR_FORMALDEHYDE_LIMIT_EXCEEDED]
          - validations[priority=50]
          - validations[priority=54]
          - calculations.permit_period_emissions.constants.FORMALDEHYDE_CERT_LIMIT_PPM
          - calculations.permit_period_emissions.constants.VOC_CERT_LIMIT_G_PER_KG
        distinguishing_aspect: "Two different formaldehyde gates that must not be confused. Rule 50 is a CLAIM-consistency check on the declared chemistry at draft time and fires in BOTH directions (free with ppm > 0, and not-free with ppm == 0); rule 54 is a MEASUREMENT check at the certification lab and fires on either the formaldehyde leg (> 300 ppm) or the VOC leg (> 6.0 g/kg). Both are cross-field or constant comparisons, not declared-range checks, so neither collapses into ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database apart from the binder rows created below. No SKU references any of them, so no suspension cascade can interfere."
          setup_api_calls:
            - call: "GET /_health"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /binder-formulations"
              payload: { code: "BF-CLAIM-1", formaldehyde_free: true, formaldehyde_ppm: 5, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_free_claim: "$.data.error_id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-CLAIM-2", formaldehyde_free: false, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_phen_claim: "$.data.error_id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-PHEN-1", formaldehyde_free: false, formaldehyde_ppm: 250, voc_g_per_kg: 4.1, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_phen: "$.data.id" }
            - call: "POST /binder-formulations/${binder_phen}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_phen}/emissions-test"
              payload: { formaldehyde_ppm: 420, voc_g_per_kg: 4.1, lab_reference: "LAB-9101" }
              as: CertificationOfficer
              as_user_id: "co-1"
              captures: { err_ch2o_limit: "$.data.error_id" }
            - call: "POST /binder-formulations/${binder_phen}/emissions-test"
              payload: { formaldehyde_ppm: 250, voc_g_per_kg: 7.0, lab_reference: "LAB-9102" }
              as: CertificationOfficer
              as_user_id: "co-1"
              captures: { err_voc_limit: "$.data.error_id" }
            - call: "POST /binder-formulations/${binder_phen}/emissions-test"
              payload: { formaldehyde_ppm: 300, voc_g_per_kg: 6.0, lab_reference: "LAB-9103" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "${err_free_claim} == \"ERR_FORMALDEHYDE_FREE_CLAIM_INVALID\" with HTTP 422: formaldehyde_free true cannot be declared alongside formaldehyde_ppm 5"
            - "${err_phen_claim} == \"ERR_FORMALDEHYDE_FREE_CLAIM_INVALID\" with HTTP 422 as well — the rule is symmetric, a non-free binder declaring 0 ppm is equally inconsistent"
            - "neither refused draft was persisted: GET /binder-formulations returns exactly one row (BF-PHEN-1) with total_count == 1"
            - "${err_ch2o_limit} == \"ERR_FORMALDEHYDE_LIMIT_EXCEEDED\" with HTTP 422: 420 ppm is above FORMALDEHYDE_CERT_LIMIT_PPM == 300"
            - "${err_voc_limit} == \"ERR_FORMALDEHYDE_LIMIT_EXCEEDED\" with HTTP 422 too: the SAME code covers the VOC leg, 7.0 > VOC_CERT_LIMIT_G_PER_KG == 6.0, even though the formaldehyde reading of 250 ppm was inside its limit"
            - "BinderFormulation.${binder_phen}.status is STILL SUBMITTED after both refusals, with lab_reference == null — a failed emissions test does not move the row into EMISSIONS_TESTING"
            - "the third call, exactly AT both limits (300 ppm and 6.0 g/kg), returns HTTP 200: the comparison is <=, so the boundary passes and status becomes EMISSIONS_TESTING with lab_reference == \"LAB-9103\""

      - name: a_short_specimen_list_and_a_retest_with_nothing_to_retest_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SPECIMEN_COUNT_INSUFFICIENT]
          - errors[ERR_RETEST_LIMIT_REACHED]
          - validations[priority=74]
          - validations[priority=76]
          - entities.CertificationProgram.fields.min_specimen_count
          - entities.CertificationProgram.fields.retest_limit
        distinguishing_aspect: "The two guards that bound the laboratory loop from below and from above. min_specimen_count is a per-program floor on the SIZE of the specimen list (and every value must be positive), while retest_limit only matters once a result exists: a CONFORMING result leaves no retest due at all, so request-retest is refused with ERR_RETEST_LIMIT_REACHED even though attempt_number (1) is still below the limit of 2."
        test_recipe:
          setup:
            - "Program RCERT-PS (PER_SPECIMEN, r_value_tolerance 0.30, min_specimen_count 3, retest_limit 2), plant NWK, certified binder BF-FREE-1, SKU PL-A (declared_r_value 13.0)."
            - "One run of PL-A driven to CURING, and one ThermalTest on it moved to IN_LAB (attempt_number 1)."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
