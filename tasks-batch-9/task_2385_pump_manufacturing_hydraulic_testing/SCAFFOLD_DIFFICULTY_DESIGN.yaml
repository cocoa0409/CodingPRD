scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 - dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: certified_curve_as_tested_vs_rated_speed_corrected_flip_hydraulic_status
        grounds:
          - calculations.certified_test_curve
          - entities.TestRun.fields.correction_basis
          - entities.TestRun.fields.speed_ratio
          - entities.TestRun.fields.head_deviation_pct
          - state_machines.TestRun.NOT_EVALUATED_to_WITHIN_TOLERANCE
          - state_machines.TestRun.NOT_EVALUATED_to_OUT_OF_TOLERANCE
        distinguishing_aspect: |
          This instance's variant axis is the TestRun.correction_basis enum on the measurement
          entity: one identical five-point measured set evaluated at 2900 rpm yields
          head_at_guarantee_m 71.25 / head_deviation_pct -3.68 / OUT_OF_TOLERANCE under AS_TESTED
          and 74.43 / +0.62 / WITHIN_TOLERANCE under RATED_SPEED_CORRECTED, so the affinity-law
          variant alone decides whether the unit is certifiable.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE with capacity 2; PumpModel HSC-14 ORDERABLE; PatternAsset PAT-HSC14-A QUALIFIED; MaterialSealConfig MSC-CI-P11 (CLEAN, API_PLAN_11, clearance band [0.30, 0.45])."
            - "DutyApplication APP-1001 duty point 265.0 m3/h at 74.0 m, GRADE_1B, witness required; Selection APPROVED with predicted_head_m 73.97, predicted_efficiency_pct 80.96, npshr_catalog_m 3.52."
            - "CastingLot H-9001 ACCEPTED (4 pieces); BuildOrder SN-0001 ASSEMBLED with allowable_unbalance_g_mm 1386.71."
            - "Two TestRuns on the SAME BuildOrder, both POINTS_LOCKED, both carrying the identical five measured points (150/82.0/52.0, 200/78.5/58.0, 250/73.5/63.5 + npsh3 3.30, 280/69.0/66.5, 310/63.0/68.0) at test_speed_rpm 2900 - one AS_TESTED, one RATED_SPEED_CORRECTED."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /selections"
              payload: { duty_application_id: "${d1_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c1_id}", expected_duty_application_version: "${d1_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s1_id: $.data.id }
            - call: "POST /selections/${s1_id}/propose"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-101"
            - call: "POST /selections/${s1_id}/approve"
              payload: {}
              as: HydraulicApprover
              as_user_id: "appr-201"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /build-orders"
              payload: { selection_id: "${s1_id}", casting_lot_id: "${l1_id}", serial_number: "SN-0001" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /build-orders/${b1_id}/assembly"
              payload: { running_clearance_mm: 0.35, residual_unbalance_g_mm: 900.00, seal_flush_plan_installed: "API_PLAN_11" }
              as: ProductionPlanner
            - call: "POST /test-runs"
              payload: { build_order_id: "${b1_id}", test_speed_rpm: 2900, correction_basis: "AS_TESTED", test_grade: "GRADE_1B", witness_required: true }
              as: TestEngineer
              captures: { tr_as_id: $.data.id }
            - call: "POST /test-runs"
              payload: { build_order_id: "${b1_id}", test_speed_rpm: 2900, correction_basis: "RATED_SPEED_CORRECTED", test_grade: "GRADE_1B", witness_required: true }
              as: TestEngineer
              captures: { tr_corr_id: $.data.id }
            - call: "POST /test-runs/${tr_as_id}/points"
              payload: { measured_flow_m3h: 150.0, measured_head_m: 82.0, measured_power_kw: 52.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/points"
              payload: { measured_flow_m3h: 200.0, measured_head_m: 78.5, measured_power_kw: 58.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/points"
              payload: { measured_flow_m3h: 250.0, measured_head_m: 73.5, measured_power_kw: 63.5, measured_npsh3_m: 3.30, is_npsh_point: true }
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/points"
              payload: { measured_flow_m3h: 280.0, measured_head_m: 69.0, measured_power_kw: 66.5 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/points"
              payload: { measured_flow_m3h: 310.0, measured_head_m: 63.0, measured_power_kw: 68.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/points"
              payload: { measured_flow_m3h: 150.0, measured_head_m: 82.0, measured_power_kw: 52.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/points"
              payload: { measured_flow_m3h: 200.0, measured_head_m: 78.5, measured_power_kw: 58.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/points"
              payload: { measured_flow_m3h: 250.0, measured_head_m: 73.5, measured_power_kw: 63.5, measured_npsh3_m: 3.30, is_npsh_point: true }
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/points"
              payload: { measured_flow_m3h: 280.0, measured_head_m: 69.0, measured_power_kw: 66.5 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/points"
              payload: { measured_flow_m3h: 310.0, measured_head_m: 63.0, measured_power_kw: 68.0 }
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/lock"
              payload: {}
              as: TestEngineer
            - call: "POST /test-runs/${tr_corr_id}/lock"
              payload: {}
              as: TestEngineer
          trigger:
            - call: "POST /test-runs/${tr_corr_id}/evaluate"
              payload: {}
              as: TestEngineer
            - call: "POST /test-runs/${tr_as_id}/evaluate"
              payload: {}
              as: TestEngineer
          assert:
            - "TestRun.${tr_corr_id}.speed_ratio == 1.0172"
            - "TestRun.${tr_corr_id}.head_at_guarantee_m == 74.43"
            - "TestRun.${tr_corr_id}.power_at_guarantee_kw == 67.95"
            - "TestRun.${tr_corr_id}.efficiency_at_guarantee_pct == 79.07"
            - "TestRun.${tr_corr_id}.head_deviation_pct == 0.62"
            - "TestRun.${tr_corr_id}.efficiency_deviation_pct == -2.33"
            - "TestRun.${tr_corr_id}.npshr_tested_m == 3.41"
            - "TestRun.${tr_corr_id}.hydraulic_status == WITHIN_TOLERANCE"
            - "TestRun.${tr_corr_id}.npsh_status == VERIFIED"
            - "TestRun.${tr_as_id}.speed_ratio == 1.0"
            - "TestRun.${tr_as_id}.head_at_guarantee_m == 71.25"
            - "TestRun.${tr_as_id}.power_at_guarantee_kw == 65.00"
            - "TestRun.${tr_as_id}.efficiency_at_guarantee_pct == 79.13"
            - "TestRun.${tr_as_id}.head_deviation_pct == -3.68"
            - "TestRun.${tr_as_id}.npshr_tested_m == 3.30"
            - "TestRun.${tr_as_id}.hydraulic_status == OUT_OF_TOLERANCE"
            - "TestRun.${tr_as_id}.npsh_status == VERIFIED"
            - "BuildOrder.${b1_id}.status == REWORK_REQUIRED"
            - "Selection.${s1_id}.status == UNDER_REVIEW"
            - "DutyApplication.${d1_id}.status == OPEN"

      - name: warranty_liability_certified_curve_vs_selection_basis_flips_determination
        grounds:
          - calculations.warranty_liability_determination
          - entities.PumpPackage.fields.guarantee_basis
          - entities.WarrantyClaim.fields.liability_basis
          - entities.WarrantyClaim.fields.head_shortfall_pct
          - state_machines.WarrantyClaim.UNDER_ADJUDICATION_to_ADJUDICATED_NO_DEFECT
          - state_machines.WarrantyClaim.UNDER_ADJUDICATION_to_ADJUDICATED_MANUFACTURING
        distinguishing_aspect: |
          This instance's variant axis lives on a different entity and is contextually derived,
          not client-supplied: PumpPackage.guarantee_basis is fixed at release from
          TestRun.witness_required, and two packages carrying byte-identical measured curves and
          byte-identical field data adjudicate to ADJUDICATED_NO_DEFECT (expected_head_m 68.31,
          shortfall -1.92) on CERTIFIED_CURVE_BASIS and ADJUDICATED_MANUFACTURING
          (expected_head_m 69.58, shortfall -3.71) on SELECTION_BASIS.
        test_recipe:
          setup:
            - "Same master data as instance 1 (FDY-NORTH, HSC-14, PAT-HSC14-A wear_threshold 20, MSC-CI-P11)."
            - "Two DutyApplications APP-1001 and APP-1002 with identical duty data (265.0 m3/h at 74.0 m, GRADE_1B); two APPROVED Selections, each with predicted_head_m 73.97, diameter_ratio from trim 350.3 mm and npshr_certified_m 4.40."
            - "One ACCEPTED CastingLot H-9001 of 6 pieces carrying both BuildOrders SN-0001 and SN-0002, both ASSEMBLED."
            - "TestRun TR-A on SN-0001 with witness_required true and TestRun TR-B on SN-0002 with witness_required false; both RATED_SPEED_CORRECTED at 2900 rpm with the identical five measured points; both CERTIFIED."
            - "PumpPackage PKG-A (from TR-A) released with guarantee_basis CERTIFIED_CURVE and PKG-B (from TR-B) released with guarantee_basis SELECTION; both SHIPPED on 2026-09-15."
            - "Logical clock advanced to 2028-03-01T00:00:00Z, so months_since_ship is 17 and coverage_factor 0.60 for both claims."
            - "Two WarrantyClaims UNDER_ADJUDICATION, both carrying as_found_flow_m3h 300.0, as_found_head_m 67.0, as_found_npsha_m 5.10, as_found_solids_pct 0.0, as_found_viscosity_cst 1.2, as_found_speed_rpm 2950."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { da_id: $.data.id, da_ver: $.data.version }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1002", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: false, service_class_required: "CLEAN" }
              as: ApplicationEngineer
