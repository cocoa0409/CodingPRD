          difficulty_instance: condition_grade_rounds_per_component_before_summing
          rationale: >
            That §1.8 instance pins 74.16 against the 74.15 produced by summing
            first, which is exactly the declared rounding-order precision claim.

      - name: storage_threshold_at_the_grace_boundary
        claim_type: threshold
        excluded_because:
          grounds: calculations.storage_fee_accrual
          difficulty_instance: storage_grace_boundary_zero_versus_one_chargeable_day_and_cap
          rationale: >
            That §1.8 instance probes the boundary at exactly grace_end_at, one
            second before the first whole day, at the day boundary and at the 25%
            cap, covering every threshold claim for this calculation.

      - name: premium_tier_boundaries_and_ceiling
        claim_type: tiered_pricing
        excluded_because:
          grounds: calculations.buyer_premium_computation
          difficulty_instance: premium_tier_sum_then_online_surcharge_then_ceiling_clamp
          rationale: >
            That §1.8 instance straddles both tier limits, adds the online
            surcharge and clamps at PREMIUM_MAX_CENTS, which subsumes the
            per-tier boundary claims for the STANDARD schedule.

      - name: volume_discount_uses_prior_hammer_only
        claim_type: constants_applied
        excluded_because:
          grounds: calculations.buyer_premium_computation
          difficulty_instance: volume_discount_keyed_on_prior_hammer_evaluated_before_clamp
          rationale: >
            That §1.8 instance shows the discount keyed on prior hammer totals of
            the same registration and applied before the clamp, exercising
            VOLUME_TIER1/2 thresholds and percentages.

      - name: invoice_variant_is_chosen_by_lifecycle_position
        claim_type: variant_selection
        excluded_because:
          grounds: calculations.buyer_settlement_total
          difficulty_instance: invoice_provisional_versus_final_export_zero_rating
          rationale: >
            That §1.8 instance stamps PROVISIONAL at hammer and FINAL at
            finalize, so both variant selection and the reconciliation delta on
            the switch are already asserted.

      - name: exposure_variants_disagree_on_the_same_data
        claim_type: variant_divergence
        excluded_because:
          grounds: calculations.bidder_exposure_and_bid_cap
          difficulty_instance: bid_cap_forecast_versus_chronological_replay
          rationale: >
            That §1.8 instance reads both variants over identical data and pins
            the delta plus breached_at_sale_id, which is the divergence claim.

