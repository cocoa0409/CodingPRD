              payload: {}
              as: LegalCounsel
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (403); notice stays DRAFT"

      - name: rbac_sod_submitter_cannot_approve_own
        claim_type: exclusive_operation_denied
        grounds: [roles, "validations[priority=7]", entities.PrivacyImpactAssessment.fields.submitted_by_user_id]
        distinguishing_aspect: "Segregation of duties (role_model): the same operator id that submitted cannot approve — LegalCounsel role with X-User-ID == submitted_by_user_id -> 403 ERR_SEGREGATION_OF_DUTIES from a clean IN_REVIEW state."
        test_recipe:
