            - "GET /pbra/tenant-households/${t2_id}/certifications returns 2 rows; the UA_ADJUSTMENT row has ttp_cents 2500, tenant_rent_cents 0, utility_reimbursement_cents 10035 and hap_cents 128035"
            - "TenantHousehold.${t1_id}.current_hap_cents == 85535 and TenantHousehold.${t2_id}.current_hap_cents == 128035"
            - "${included} == 2 and ${requested} == 213570"
