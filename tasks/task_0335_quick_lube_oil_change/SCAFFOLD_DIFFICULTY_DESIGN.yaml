              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VINPRI001", plate: "PRI1", make: "Ford", model: "F150", odometer: 3000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 3000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "FLEET_ACCOUNT" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "authorize returns HTTP 409 with error_id == ERR_INVALID_STATE (state priority 5 wins over fiscal priority 10)"
            - "NOT ERR_FLEET_CREDIT_EXCEEDED despite total 6995-based total exceeding the 5000 limit"

      - name: referential_beats_temporal_on_work_order_create
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_COUPON_NOT_FOUND]
        distinguishing_aspect: |
          Different error-category pair than the first conflict (which was state vs
          business_fiscal): here business_referential (priority-4 ERR_COUPON_NOT_FOUND, bogus
          coupon_code) versus business_temporal (priority-8 ERR_BAY_NOT_OPEN, target bay already
          OCCUPIED). Both fail on the same POST /work-orders; the referential check (priority 4)
          wins, so ERR_COUPON_NOT_FOUND is returned, not ERR_BAY_NOT_OPEN.
        test_recipe:
          setup:
            - "One bay already OCCUPIED by WO_A; a second create targets that bay AND passes a coupon_code that does not exist."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
