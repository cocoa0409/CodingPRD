  - method: POST
    path: "/mail/reprint-requests/{reprint_request_id}/fulfill"
    description: "Fulfil a reprint, re-queueing the record and consuming its single per-campaign allowance."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
