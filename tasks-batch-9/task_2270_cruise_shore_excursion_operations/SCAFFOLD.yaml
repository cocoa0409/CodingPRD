  - method: POST
    path: /shore-excursions/claims/{claimId}/actions
    description: "Drive the claim state machine. Actions: SEND_TO_OPERATOR, RECORD_DISPUTE, ADJUDICATE_UPHELD, ADJUDICATE_DENIED. Adjudication is barred to the officer who opened the claim."
    roles: [RiskOfficer]
    success_code: 200
    input:
      - action
      - liability_share_bps?
      - settlement_amount_cents?
      - note?
    output: LiabilityClaim
    side_effects:
      - "RECORD_DISPUTE increments dispute_round_count and is capped at 2 rounds"
      - "ADJUDICATE_UPHELD requires an X-User-ID different from submitted_by_user_id, sets operator_charge_cents = round_half_up(settlement_amount_cents * liability_share_bps / 10000), adds it to TourOperator.liability_reserve_cents, re-scores the operator with a 5-point adverse-claim penalty, and closes the incident CLOSED_UPHELD"
      - "a re-score that lands below 60 suspends the operator and starts CASCADE-A"
      - "ADJUDICATE_DENIED closes the incident CLOSED_DENIED and moves no money"
      - "increments LiabilityClaim.version by 1"

  # ---------------------------------------------------- Commission statements
  - method: POST
    path: /shore-excursions/commission-statements
    description: "Draft a commission statement for one operator on one port call. Creating a statement voids any existing DRAFT statement for the same pair. Optimistically concurrent on the operator's version."
    roles: [FinanceController]
    success_code: 201
    input:
      - operator_id
      - port_call_id
      - basis
      - expected_operator_version
    output: CommissionStatement
    side_effects:
      - "rejected with ERR_STALE_OPERATOR_VERSION (412) when expected_operator_version does not equal the operator's current version"
      - "any existing DRAFT statement for the same (operator_id, port_call_id) transitions DRAFT -> VOIDED"
      - "all nine steps of calculations.statement_net_payable computed onto the new DRAFT row"
      - "CommissionStatement created in DRAFT with issued_at null and settled_at null"
  - method: GET
    path: /shore-excursions/commission-statements/{statementId}
    description: "Read one commission statement with every waterfall step exposed as its own field."
    roles: [FinanceController, ExcursionManager]
    success_code: 200
    input: []
    output: CommissionStatement
    side_effects: []
  - method: GET
    path: /shore-excursions/commission-statements
    description: "List commission statements, filterable by operator, port call, status and accrual basis."
    roles: [FinanceController, ExcursionManager]
    success_code: 200
    input:
      - operator_id?
      - port_call_id?
      - status?
      - basis?
      - limit?
      - offset?
    output: CommissionStatement[]
    side_effects: []
  - method: POST
    path: /shore-excursions/commission-statements/{statementId}/transitions
    description: "Drive the statement state machine. Actions: ISSUE, DISPUTE, ADJUST, SETTLE."
    roles: [FinanceController]
    success_code: 200
    input:
      - action
      - adjustment_cents?
      - note?
    output: CommissionStatement
    side_effects:
      - "ISSUE re-runs and freezes all nine waterfall steps, sets issued_at, and is refused while any claim for the pair is open or, on a FINAL basis, while the port call is not CLOSED"
      - "ADJUST rewrites adjustment_cents and operator_payable_cents only; payable_pre_rebate_cents, rebate_bps and rebate_cents are left exactly as issued"
      - "SETTLE requires basis == FINAL, sets settled_at, moves every ADJUDICATED_UPHELD claim for the pair to SETTLED and debits TourOperator.liability_reserve_cents by each claim's operator_charge_cents"
      - "increments CommissionStatement.version by 1"

  # -------------------------------------------------------------- Logical clock
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: set the logical clock every temporal rule reads. Mandatory because sales cutoffs, check-in windows, refund tiers, the pre-cruise release, insurance runway and the all-aboard deadline are all clock-relative and cannot otherwise be reached deterministically. The clock defaults to 2026-08-01T00:00:00Z when never set."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - current_utc
    output:
      current_utc: string
    side_effects:
      - "every subsequent request reads this instant as `now`; no stored entity is mutated by the call itself"

# =============================================================================
# §1.6 Error Code Catalog — 59 codes, every one reachable from §1.5.
# =============================================================================
errors:
  # ------------------------------------------------------------------ 401 / 403
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header absent or empty"
    applies_to: [all except "POST /_clock/set_current_utc"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the caller's role is not in the endpoint's authorized roles"
    applies_to: [all]
  - id: ERR_BOOKING_NOT_OWNED
    http_status: 403
    condition: "a Guest-role caller targets a Booking whose guest_id is not their own Guest row"
    applies_to:
      - "GET /shore-excursions/bookings/{bookingId}"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the X-User-ID adjudicating a claim equals LiabilityClaim.submitted_by_user_id"
    applies_to: ["POST /shore-excursions/claims/{claimId}/actions"]
  - id: ERR_AUDITOR_CANNOT_APPROVE
    http_status: 403
    condition: "the X-User-ID approving an operator equals TourOperator.latest_audit_auditor_user_id"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]

  # ------------------------------------------------------------------- 400 -----
  - id: ERR_VALIDATION
    http_status: 400
    condition: "missing required field, wrong type, enum value outside its set, number outside its range, array member outside its value set, or pagination limit/offset out of bounds"
    applies_to: [all]

  # ------------------------------------------------------------------- 404 -----
  - id: ERR_PORT_NOT_FOUND
    http_status: 404
    condition: "portId in the path, or port_id in a body, names no stored Port"
    applies_to:
      - "GET /shore-excursions/ports/{portId}"
      - "GET /shore-excursions/ports/{portId}/revenue-report"
      - "POST /shore-excursions/ports/{portId}/meeting-points"
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/excursions"
  - id: ERR_MEETING_POINT_NOT_FOUND
    http_status: 404
    condition: "meetingPointId in the path, or meeting_point_id in a body, names no stored MeetingPoint"
    applies_to:
      - "GET /shore-excursions/meeting-points/{meetingPointId}"
      - "POST /shore-excursions/departures"
  - id: ERR_PORT_CALL_NOT_FOUND
    http_status: 404
    condition: "portCallId in the path, or port_call_id in a body, names no stored PortCall"
    applies_to:
      - "GET /shore-excursions/port-calls/{portCallId}"
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/port-calls/{portCallId}/delays"
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/commission-statements"
  - id: ERR_TENDER_WAVE_NOT_FOUND
    http_status: 404
    condition: "tenderWaveId in the path names no stored TenderWave"
    applies_to: ["GET /shore-excursions/tender-waves/{tenderWaveId}"]
  - id: ERR_OPERATOR_NOT_FOUND
    http_status: 404
    condition: "operatorId in the path, or operator_id in a body, names no stored TourOperator"
    applies_to:
      - "GET /shore-excursions/operators/{operatorId}"
      - "POST /shore-excursions/operators/{operatorId}/safety-audits"
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
      - "POST /shore-excursions/excursions"
      - "POST /shore-excursions/commission-statements"
  - id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    condition: "auditId in the path names no stored SafetyAudit"
    applies_to: ["GET /shore-excursions/safety-audits/{auditId}"]
  - id: ERR_EXCURSION_NOT_FOUND
    http_status: 404
    condition: "excursionId in the path, or excursion_id / alternative_excursion_id in a body, names no stored Excursion"
    applies_to:
      - "GET /shore-excursions/excursions/{excursionId}"
      - "PATCH /shore-excursions/excursions/{excursionId}"
      - "POST /shore-excursions/excursions"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "POST /shore-excursions/departures"
  - id: ERR_DEPARTURE_NOT_FOUND
    http_status: 404
    condition: "departureId in the path, or departure_id in a body, names no stored ExcursionDeparture"
    applies_to:
      - "GET /shore-excursions/departures/{departureId}"
      - "POST /shore-excursions/departures/{departureId}/allocation"
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
      - "POST /shore-excursions/departures/{departureId}/cancel"
      - "POST /shore-excursions/departures/{departureId}/operations"
      - "POST /shore-excursions/bookings"
  - id: ERR_GUEST_NOT_FOUND
    http_status: 404
    condition: "guestId in the path, or guest_id in a body, names no stored Guest"
    applies_to:
      - "GET /shore-excursions/guests/{guestId}"
      - "POST /shore-excursions/bookings"
  - id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    condition: "bookingId in the path names no stored Booking"
    applies_to:
      - "GET /shore-excursions/bookings/{bookingId}"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    condition: "entryId in the path names no stored RefundLedgerEntry"
    applies_to: ["GET /shore-excursions/refund-ledger-entries/{entryId}"]
  - id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    condition: "incidentId in the path names no stored GuestIncident"
    applies_to:
      - "GET /shore-excursions/incidents/{incidentId}"
      - "POST /shore-excursions/incidents/{incidentId}/claims"
      - "POST /shore-excursions/incidents/{incidentId}/close"
  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "claimId in the path names no stored LiabilityClaim"
    applies_to:
      - "GET /shore-excursions/claims/{claimId}"
      - "POST /shore-excursions/claims/{claimId}/actions"
  - id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    condition: "statementId in the path names no stored CommissionStatement"
    applies_to:
      - "GET /shore-excursions/commission-statements/{statementId}"
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"

  # ------------------------------------------------------------------- 409 -----
  - id: ERR_DUPLICATE_PORT_CODE
    http_status: 409
    condition: "port_code already used by another Port"
    applies_to: ["POST /shore-excursions/ports"]
  - id: ERR_DUPLICATE_WAVE_INDEX
    http_status: 409
    condition: "wave_index already used by another TenderWave on the same port call"
    applies_to: ["POST /shore-excursions/port-calls/{portCallId}/tender-waves"]
  - id: ERR_TENDER_WAVE_OVERLAP
    http_status: 409
    condition: "the candidate wave's closed window [window_start_utc, window_end_utc] shares at least one instant with another non-cancelled wave on the same call; touching endpoints DO collide"
    applies_to: ["POST /shore-excursions/port-calls/{portCallId}/tender-waves"]
  - id: ERR_MEETING_POINT_CONGESTED
    http_status: 409
    condition: "the candidate departure's half-open meeting-point window pushes the peak concurrent group count above MeetingPoint.max_concurrent_groups; touching windows do NOT collide"
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"

  # ------------------------------------------------------------------- 412 -----
  - id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412
    condition: "expected_departure_version does not equal the current ExcursionDeparture.version"
    applies_to:
      - "POST /shore-excursions/bookings"
      - "POST /shore-excursions/departures/{departureId}/allocation"
  - id: ERR_STALE_OPERATOR_VERSION
    http_status: 412
    condition: "expected_operator_version does not equal the current TourOperator.version"
    applies_to: ["POST /shore-excursions/commission-statements"]

  # ------------------------------------------------------------------- 422 -----
  - id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    condition: "cross-field instant or range incoherence: arrival >= all_aboard, all_aboard > departure, wave window_start >= window_end, audit or incident instant in the future, max_age < min_age, or actual_return_utc outside [meeting_time_utc, now]"
    applies_to:
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
      - "POST /shore-excursions/operators/{operatorId}/safety-audits"
      - "POST /shore-excursions/excursions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
      - "POST /shore-excursions/departures/{departureId}/operations"
  - id: ERR_INVALID_PORT_CALL_ACTION
    http_status: 422
    condition: "the requested transition is not declared for the port call's status, or its clock precondition is unmet, or a delay is recorded against a CLOSED or CANCELLED call"
    applies_to:
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/port-calls/{portCallId}/delays"
  - id: ERR_INVALID_CATALOG_ACTION
    http_status: 422
    condition: "the requested catalog action is not declared for the excursion's catalog_status, or a PATCH targets an excursion past PENDING_REVIEW"
    applies_to:
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
  - id: ERR_INVALID_VETTING_ACTION
    http_status: 422
    condition: "the requested vetting action is not declared for the operator's vetting_status, including any action on a TERMINATED operator"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]
  - id: ERR_INVALID_DEPARTURE_STATE
    http_status: 422
    condition: "the requested departure operation is not declared for its status, or the owning port call is not in the state the operation needs"
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/cancel"
      - "POST /shore-excursions/departures/{departureId}/operations"
      - "POST /shore-excursions/departures/{departureId}/allocation"
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
  - id: ERR_DEPARTURE_NOT_SELLING
    http_status: 422
    condition: "a new booking names a departure whose status is not SELLING, or a TICKET action names a departure outside {SELLING, CLOSED}"
    applies_to:
      - "POST /shore-excursions/bookings"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
  - id: ERR_INVALID_BOOKING_ACTION
    http_status: 422
    condition: "the requested action is not declared for the booking's (fulfillment_status, financial_status) pair, or an incident is filed against a booking that never reached the shore"
    applies_to:
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
  - id: ERR_INVALID_CLAIM_ACTION
    http_status: 422
    condition: "the requested claim action is not declared for the claim's status, a claim is opened on an incident that is not FILED or already has one, an incident with a claim is closed, or a claim is sent to a TERMINATED operator"
    applies_to:
      - "POST /shore-excursions/incidents/{incidentId}/claims"
      - "POST /shore-excursions/incidents/{incidentId}/close"
      - "POST /shore-excursions/claims/{claimId}/actions"
  - id: ERR_INVALID_STATEMENT_ACTION
    http_status: 422
    condition: "the requested statement transition is not declared for its status, or SETTLE is requested on a PROVISIONAL statement"
    applies_to: ["POST /shore-excursions/commission-statements/{statementId}/transitions"]
  - id: ERR_PORT_CALL_NOT_CLOSED
    http_status: 422
    condition: "a FINAL statement is issued while the owning port call has not reached CLOSED"
    applies_to: ["POST /shore-excursions/commission-statements/{statementId}/transitions"]
  - id: ERR_INSURANCE_EXPIRED
    http_status: 422
    condition: "the operator's insurance_expiry_date is at or before the logical clock on a vetting action, or less than 30 days ahead of it on a catalog PUBLISH"
    applies_to:
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
  - id: ERR_INSURANCE_LIMIT_INSUFFICIENT
    http_status: 422
    condition: "insurance_liability_limit_cents below 100000000 on APPROVE"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]
  - id: ERR_AUDIT_REQUIRED
    http_status: 422
    condition: "SUBMIT on an operator with no SafetyAudit"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]
  - id: ERR_SAFETY_SCORE_BELOW_FLOOR
    http_status: 422
    condition: "safety_score below 60 on APPROVE or REINSTATE"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]
  - id: ERR_VETTING_CYCLE_EXHAUSTED
    http_status: 422
    condition: "RESUBMIT with vetting_cycle_count already above 3"
    applies_to: ["POST /shore-excursions/operators/{operatorId}/vetting-actions"]
  - id: ERR_OPERATOR_NOT_APPROVED
    http_status: 422
    condition: "publishing or ticketing against an operator whose vetting_status is not APPROVED"
    applies_to:
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
  - id: ERR_AGE_RESTRICTION
    http_status: 422
    condition: "age_at_meeting outside the excursion's inclusive [min_age, max_age] band"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_MOBILITY_RESTRICTION
    http_status: 422
    condition: "guest mobility rank below the excursion's required rank, or a LEVEL_4 excursion booked by a guest carrying CARDIAC, RESPIRATORY or PREGNANCY"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_MEDICAL_ACK_REQUIRED
    http_status: 422
    condition: "the guest's medical_flags intersect the excursion's medical_warning_codes and medical_warning_acknowledged is not true"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_LANGUAGE_UNAVAILABLE
    http_status: 422
    condition: "language_choice is not a member of the excursion's languages"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_VOYAGE_MISMATCH
    http_status: 422
    condition: "the guest's voyage_code differs from the port call's voyage_code"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_MEETING_TIME_OUTSIDE_CALL
    http_status: 422
    condition: "meeting_time_utc outside the inclusive [arrival_utc, all_aboard_utc] window of the port call"
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
  - id: ERR_SALES_CUTOFF_PASSED
    http_status: 422
    condition: "the logical clock has reached meeting_time_utc minus 60 minutes"
    applies_to: ["POST /shore-excursions/bookings"]
  - id: ERR_TIMING_RISK_RED
    http_status: 422
    condition: "DISPATCH requested while timing_risk_band_actual is RED"
    applies_to: ["POST /shore-excursions/departures/{departureId}/operations"]
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 422
    condition: "CHECK_IN outside the inclusive [meeting_time_utc - 45 minutes, meeting_time_utc + 10 minutes] window"
    applies_to: ["POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"]
  - id: ERR_NO_ELIGIBLE_TENDER_WAVE
    http_status: 422
    condition: "the tender-wave eligibility pool is empty, a TENDER-mode call has no EXCURSION_PRIORITY wave when sales open, or DISPATCH is requested at a TENDER port with no wave assigned"
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/departures/{departureId}/operations"
  - id: ERR_OPEN_CLAIM_BLOCKS_ISSUE
    http_status: 422
    condition: "a claim for the pair is SUBMITTED, UNDER_OPERATOR_REVIEW or DISPUTED when issuing a statement, or any claim is open when reinstating or terminating the operator"
    applies_to:
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
  - id: ERR_CLAIM_EXCEEDS_INSURANCE_LIMIT
    http_status: 422
    condition: "the computed operator_charge_cents exceeds the operator's insurance_liability_limit_cents"
    applies_to: ["POST /shore-excursions/claims/{claimId}/actions"]
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 422
    condition: "RECORD_DISPUTE with dispute_round_count already at 2, or SEND_TO_OPERATOR from DISPUTED with the cap already spent"
    applies_to: ["POST /shore-excursions/claims/{claimId}/actions"]
  - id: ERR_NO_ALTERNATIVE_AVAILABLE
    http_status: 422
    condition: "offer_alternative is true and the alternative pool is empty, or a PUBLISH names an alternative excursion that is not itself published at the same port"
    applies_to:
      - "POST /shore-excursions/departures/{departureId}/cancel"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
  - id: ERR_ALLOCATION_MISMATCH
    http_status: 422
    condition: "precruise_allocation + onboard_allocation does not equal total_capacity"
    applies_to:
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/allocation"
  - id: ERR_ALLOCATION_BELOW_SOLD
    http_status: 422
    condition: "a rebalance would leave a channel bucket smaller than the seats already sold out of it"
    applies_to: ["POST /shore-excursions/departures/{departureId}/allocation"]
  - id: ERR_CHANNEL_ALLOCATION_EXHAUSTED
    http_status: 422
    condition: "party_size exceeds the effective available seats of the booking's own channel, including every pre-cruise request made at or after the 2880-minute release"
    applies_to: ["POST /shore-excursions/bookings"]

# =============================================================================
# §1.7 RBAC Permission Matrix — 7 roles, segregation-of-duties model.
# =============================================================================
roles:
  - name: Guest
    description: "A sailing guest browsing the catalog and managing their own bookings. Row-level scoped: a Guest may only read and cancel Booking rows whose guest_id resolves to their own Guest row."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "GET /shore-excursions/ports/{portId}"
      - "GET /shore-excursions/ports"
      - "GET /shore-excursions/meeting-points/{meetingPointId}"
      - "GET /shore-excursions/meeting-points"
      - "GET /shore-excursions/port-calls/{portCallId}"
      - "GET /shore-excursions/port-calls"
      - "GET /shore-excursions/tender-waves/{tenderWaveId}"
      - "GET /shore-excursions/tender-waves"
      - "GET /shore-excursions/excursions/{excursionId}"
      - "GET /shore-excursions/excursions"
      - "GET /shore-excursions/departures/{departureId}"
      - "GET /shore-excursions/departures"
      - "POST /shore-excursions/bookings"
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/bookings"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "GET /shore-excursions/refund-ledger-entries/{entryId}"
      - "GET /shore-excursions/refund-ledger-entries"
      - "POST /_clock/set_current_utc"
    note: "The only role with no exclusive operation: everything a guest may do, the desk may also do on their behalf. The Guest role is instead constrained by the row-level ownership rule at validation priority 3."

  - name: ShoreExcursionDesk
    description: "Onboard and pre-cruise sales desk. Registers guests, sells and tickets bookings, checks guests in at the meeting point and files incident reports."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/guests"
      - "GET /shore-excursions/guests/{guestId}"
      - "GET /shore-excursions/guests"
      - "POST /shore-excursions/bookings/{bookingId}/fulfillment-actions"
      - "POST /shore-excursions/bookings/{bookingId}/incidents"
    shared_operations:
      - "POST /shore-excursions/bookings"
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/bookings"
      - "POST /shore-excursions/bookings/{bookingId}/cancel"
      - "GET /shore-excursions/refund-ledger-entries/{entryId}"
      - "GET /shore-excursions/refund-ledger-entries"
      - "GET /shore-excursions/incidents/{incidentId}"
      - "GET /shore-excursions/incidents"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "The desk may TICKET but may never publish a catalog item, vet an operator, dispatch a departure, adjudicate a claim or settle a statement."

  - name: ExcursionManager
    description: "Owns the excursion catalog, the departure schedule and the channel seat allocation. Publishes and withdraws catalog items and cancels departures."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/ports"
      - "POST /shore-excursions/ports/{portId}/meeting-points"
      - "POST /shore-excursions/excursions"
      - "PATCH /shore-excursions/excursions/{excursionId}"
      - "POST /shore-excursions/excursions/{excursionId}/catalog-actions"
      - "POST /shore-excursions/departures"
      - "POST /shore-excursions/departures/{departureId}/allocation"
      - "POST /shore-excursions/departures/{departureId}/reschedule-meeting"
      - "POST /shore-excursions/departures/{departureId}/cancel"
    shared_operations:
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "GET /shore-excursions/ports/{portId}/revenue-report"
      - "GET /shore-excursions/guests/{guestId}"
      - "GET /shore-excursions/guests"
      - "GET /shore-excursions/operators/{operatorId}"
      - "GET /shore-excursions/operators"
      - "GET /shore-excursions/safety-audits/{auditId}"
      - "GET /shore-excursions/safety-audits"
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/bookings"
      - "GET /shore-excursions/incidents/{incidentId}"
      - "GET /shore-excursions/incidents"
      - "GET /shore-excursions/commission-statements/{statementId}"
      - "GET /shore-excursions/commission-statements"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "May cancel a departure but may never vet the operator whose tour it is, and may never issue or settle the statement that pays that operator."

  - name: OperatorVettingOfficer
    description: "Vets tour operators: records insurance and safety audits and drives the vetting state machine. The officer who recorded an operator's newest audit may not approve that operator."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/operators"
      - "POST /shore-excursions/operators/{operatorId}/safety-audits"
      - "POST /shore-excursions/operators/{operatorId}/vetting-actions"
    shared_operations:
      - "GET /shore-excursions/operators/{operatorId}"
      - "GET /shore-excursions/operators"
      - "GET /shore-excursions/safety-audits/{auditId}"
      - "GET /shore-excursions/safety-audits"
      - "GET /shore-excursions/claims/{claimId}"
      - "GET /shore-excursions/claims"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties is enforced on X-User-ID, not on role: two different officers are needed to audit and then approve one operator."

  - name: PortAgent
    description: "Shoreside agent for a call: records arrival delay, publishes tender waves, drives the port-call lifecycle and dispatches and completes departures."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/port-calls/{portCallId}/delays"
      - "POST /shore-excursions/port-calls/{portCallId}/tender-waves"
      - "POST /shore-excursions/departures/{departureId}/operations"
    shared_operations:
      - "POST /shore-excursions/port-calls"
      - "POST /shore-excursions/port-calls/{portCallId}/transitions"
      - "POST /shore-excursions/departures/{departureId}/tender-assignment"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "Holds the all-aboard deadline and the dispatch decision but cannot price, sell, cancel or settle anything."

  - name: RiskOfficer
    description: "Handles guest incidents and operator liability claims. The officer who opens a claim may not adjudicate it."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/incidents/{incidentId}/claims"
      - "POST /shore-excursions/incidents/{incidentId}/close"
      - "POST /shore-excursions/claims/{claimId}/actions"
    shared_operations:
      - "GET /shore-excursions/incidents/{incidentId}"
      - "GET /shore-excursions/incidents"
      - "GET /shore-excursions/claims/{claimId}"
      - "GET /shore-excursions/claims"
      - "GET /shore-excursions/guests/{guestId}"
      - "GET /shore-excursions/guests"
      - "GET /shore-excursions/operators/{operatorId}"
      - "GET /shore-excursions/operators"
      - "GET /shore-excursions/safety-audits/{auditId}"
      - "GET /shore-excursions/safety-audits"
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/bookings"
      - "GET /shore-excursions/refund-ledger-entries/{entryId}"
      - "GET /shore-excursions/refund-ledger-entries"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "Adjudicating a claim can suspend an operator and therefore cancel live departures, but the RiskOfficer cannot cancel a departure directly."

  - name: FinanceController
    description: "Settles commission with operators and reads per-port revenue. Owns the statement lifecycle end to end."
    identity: opaque
    exclusive_operations:
      - "POST /shore-excursions/commission-statements"
      - "POST /shore-excursions/commission-statements/{statementId}/transitions"
    shared_operations:
      - "GET /shore-excursions/ports/{portId}/revenue-report"
      - "GET /shore-excursions/commission-statements/{statementId}"
      - "GET /shore-excursions/commission-statements"
      - "GET /shore-excursions/operators/{operatorId}"
      - "GET /shore-excursions/operators"
      - "GET /shore-excursions/safety-audits/{auditId}"
      - "GET /shore-excursions/safety-audits"
      - "GET /shore-excursions/bookings/{bookingId}"
      - "GET /shore-excursions/bookings"
      - "GET /shore-excursions/refund-ledger-entries/{entryId}"
      - "GET /shore-excursions/refund-ledger-entries"
      - "GET /shore-excursions/claims/{claimId}"
      - "GET /shore-excursions/claims"
      - "every catalog, port, port-call, tender-wave and departure read endpoint"
      - "POST /_clock/set_current_utc"
    note: "Settling a FINAL statement is what closes an upheld claim, so the FinanceController completes a workflow that only the RiskOfficer can start."
