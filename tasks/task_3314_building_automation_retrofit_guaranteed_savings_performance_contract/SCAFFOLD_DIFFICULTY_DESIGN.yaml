- rule_id: resource_temporal_overlap
  instances:
  - name: phase_window_overlap_half_open_semantics
    grounds:
    - validations[priority=8]
    - errors.ERR_PHASE_WINDOW_OVERLAP
    distinguishing_aspect: 'Interval semantics (half-open): mobilizing phase B [09-10, 09-15)

      collides with MOBILIZED phase A [09-01, 09-20) → rejected; phase C

      [09-20, 09-25) touches A at exactly a.end == c.start → NOT an

      overlap (half-open) → accepted.

      '
    test_recipe:
      setup:
      - Contract in EXECUTED; phase A [2026-09-01, 2026-09-20) MOBILIZED; phases B [09-10,09-15) and C [09-20,09-25) PLANNED.
