            - "the screening decision sets Volunteer.${volunteer_id}.screening_status == CLEARED, screening_decided_on == 2026-08-01 and screening_expires_on == 2027-08-01 (decided_on + 365 days)"
            - "the retried approve returns 200: StaffAssignment.${assignment_id}.status == APPROVED, approved_by_user_id == tm-quinn and Volunteer.${volunteer_id}.assignment_count == 1"

      - name: cyclic_agreement_negotiation_loop_shape
        claim_type: cyclic_shape
        grounds:
          - complexity_profile.state_machine_shape_cyclic
          - state_machines.FacilityAgreement.SUBMITTED_to_COUNTERED
        excluded_because:
          difficulty_instance: facility_agreement_counter_loop_then_signed_branch_pins_countered_rate
          rationale: "The cyclic-shape corner (loop back, respect the round cap, then branch out of the loop) is the whole subject of that §1.8 non_linear_state_machine instance, which walks SUBMITTED -> COUNTERED -> SUBMITTED twice, proves the third counter is refused with ERR_MAX_COUNTER_ROUNDS_EXCEEDED, and shows the sign pinning the COUNTERED rate rather than the original. Repeating it here would duplicate the same transition sequence and the same assertions."

      - name: parallel_medical_dimension_independence
        claim_type: parallel_shape
        grounds:
          - state_machines.Member.medical_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: member_parallel_medical_dimension_gates_contract_execution
          rationale: "That §1.8 cross-entity/parallel instance already drives medical_status through CLEARED -> RESTRICTED -> SIDELINED -> CLEARED while membership_status stays OFFERED, and proves the combined state gates execute with ERR_MEDICAL_NOT_CLEARED. A separate parallel-dimension corner would exercise the identical transition pair on the identical entity."

      - name: payment_reversal_compensation_pattern
        claim_type: compensation_side_effect
        grounds:
          - state_machines.TuitionPayment.POSTED_to_REVERSED.side_effects
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: payment_reversal_restores_plan_member_and_season_ledgers_and_delinquency
          rationale: "The compensation corner — undo transition reverses every original side effect with no drift, while the strike counter deliberately does NOT decrease — is exactly that §1.8 compensating_invariant instance, which reconciles plan, member and season ledgers before and after the reversal cent for cent."

      - name: stop_cancellation_cascade_ordering
        claim_type: cascade_down_side_effect
        grounds:
          - state_machines.TourStop.PLANNED_to_CANCELLED.side_effects
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: tour_stop_cancellation_cascades_bookings_school_counts_and_volunteer_loads
          rationale: "That §1.8 transitive_cascade instance already verifies the full stop-cancellation chain end to end (bookings released, HostSchool.booked_block_count decremented once per released booking, staff assignments released, Volunteer.assignment_count decremented only for the APPROVED one), including the conditional-cascade aspect that terminal children are skipped."

  - section: calculations
    instances:
      - name: travel_feasibility_fuel_stop_appears_exactly_at_200_miles
        claim_type: constants_applied
        grounds:
          - calculations.travel_feasibility
          - entities.TourStop.fields.required_travel_minutes
        distinguishing_aspect: "FUEL_STOP_MILES is a floor division, so the first 30-minute fuel stop appears AT 200 miles and not at 201: 199 miles gives 266 minutes, 200 miles gives 297 (267 + 30), 420 miles gives 620 (560 + 60), and a null previous_stop_id gives exactly 0 rather than a 1-truck-style minimum."
        test_recipe:
          setup: ["One season. Four stops are chained so that each new stop's previous_stop_id is the head stop, giving three independent mileage samples plus the null-previous origin."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Origin", city: "Rockford", state_code: "IL", arrive_at: "2027-06-18T06:00:00Z", depart_at: "2027-06-18T18:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { origin_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", previous_stop_id: "${origin_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Under Threshold", city: "Dubuque", state_code: "IA", arrive_at: "2027-06-19T06:00:00Z", depart_at: "2027-06-19T18:00:00Z", travel_miles_from_previous: 199, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_199_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", previous_stop_id: "${origin_id}", stop_type: "REHEARSAL_ONLY", venue_name: "At Threshold", city: "Madison", state_code: "WI", arrive_at: "2027-06-20T06:00:00Z", depart_at: "2027-06-20T18:00:00Z", travel_miles_from_previous: 200, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_200_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", previous_stop_id: "${origin_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Long Haul", city: "Indianapolis", state_code: "IN", arrive_at: "2027-06-21T06:00:00Z", depart_at: "2027-06-21T18:00:00Z", travel_miles_from_previous: 420, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_420_id: "$.data.id" }
          assert:
            - "TourStop.${origin_id}.required_travel_minutes == 0 because previous_stop_id is null"
            - "TourStop.${stop_199_id}.required_travel_minutes == 266 — ceil(199/45*60) == 266 drive minutes and floor(199/200) == 0 fuel stops"
            - "TourStop.${stop_200_id}.required_travel_minutes == 297 — 267 drive minutes plus exactly one 30-minute fuel stop at the 200-mile boundary"
            - "TourStop.${stop_420_id}.required_travel_minutes == 620 — 560 drive minutes (an exact division, so the ceiling adds nothing) plus two fuel stops"
            - "TourStop.${stop_420_id}.trucks_required == 2 — the empty load needs the 1-truck floor and the 420 >= 350 long-haul relief tractor adds one"

      - name: payment_waterfall_fills_late_fees_before_principal
        claim_type: correct_result
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.late_fee_assessment
          - entities.TuitionPayment.fields.allocated_to_late_fee_cents
        distinguishing_aspect: "Bucket order is the whole rule: a 10000-cent payment against a plan carrying 3999 of accrued fees must split 3999 fee / 6001 principal, and only the 6001 may reach Member.tuition_paid_cents and Season.tuition_collected_cents — a principal-first implementation posts 10000 of principal and leaves the fee outstanding."
        test_recipe:
          setup:
            - "A member holds an EXECUTED 399900 STANDARD_3 contract with a plan whose installments are 133300 on 2027-01-15, 2027-02-14 and 2027-03-16. The clock is moved to 2027-02-20 and one sweep is run: two installments (266600) are due, arrears 266600, raw fee 266600*0.015 == 3999 which sits between the 2500 floor and the 15000 cap."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_v: "$.data.version" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-01-15", expected_member_version: "${member_v}" }
              as: BusinessManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: BusinessManager
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: BusinessManager
          trigger:
            - call: "POST /tuition-payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 10000, received_on: "2027-02-20", method: "ACH" }
              as: BusinessManager
              captures: { payment_id: "$.data.id" }
          assert:
            - "the sweep left PaymentPlan.${plan_id}.late_fee_accrued_cents == 3999, delinquency_strikes == 1 and status == DELINQUENT"
            - "TuitionPayment.${payment_id}.allocated_to_late_fee_cents == 3999 and allocated_to_principal_cents == 6001, summing exactly to amount_cents"
            - "PaymentPlan.${plan_id}.late_fee_paid_cents == 3999 and principal_paid_cents == 6001"
            - "PaymentPlan.${plan_id}.arrears_cents == 260599 and outstanding_cents == 393899, and status is still DELINQUENT because arrears did not reach 0 (no cure)"
            - "Member.${member_id}.tuition_paid_cents == 6001 (principal only) and tuition_balance_cents == 393899"
            - "Season.${season_id}.tuition_collected_cents == 6001 and late_fee_collected_cents == 3999 — the two buckets land in different season ledgers"

      - name: late_fee_floor_and_cap_clamp_after_the_percentage
        claim_type: constants_applied
        grounds:
          - calculations.late_fee_assessment.constants
          - state_machines.PaymentPlan.ACTIVE_to_DELINQUENT
        distinguishing_aspect: "One sweep, two plans, both clamps: 100000 of arrears gives raw 1500 which the 2500 MIN raises, while 5000000 of arrears gives raw 75000 which the 15000 CAP lowers. The order is percentage, then floor, then cap — a max/min applied in the wrong order or a percentage applied to the financed total instead of the arrears yields different numbers on both plans."
        test_recipe:
          setup:
            - "Two members of one season hold EXECUTED STANDARD_3 contracts of 100000 and 5000000 cents, each with a plan whose first installment fell on 2027-01-15, and no payments have been made. The clock is moved to 2027-03-20 so all three installments of both plans are due."
