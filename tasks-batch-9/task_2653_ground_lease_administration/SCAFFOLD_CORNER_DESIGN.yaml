              as: LessorAdmin
              captures: { lease_b: $.data.id }
            - call: "POST /portfolio/leases/${lease_b}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 45 }
