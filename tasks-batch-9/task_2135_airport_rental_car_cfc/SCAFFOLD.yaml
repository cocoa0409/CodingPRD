# =============================================================================
# task_2135 — Airport Rental Car Facility & Customer Facility Charge (CFC)
# Administration (consolidated rental car facility / ConRAC)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2135. Airport Rental Car Facility &
  Customer Facility Charge Administration (consolidated rental car facility):
  concession agreement & percentage rent, CFC collection per transaction day &
  bond debt service, shuttle bus operation cost allocation, counter/ready-return
  space assignment, transaction day reporting & audit, fleet parking allocation
  & overflow, minimum guarantee true-up, capital project funded by CFC

domain_name: airport-rental-car-cfc
api_prefix: /rac

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nesting in URL paths.
  # Every collection sits directly under /rac and children are discovered
  # through filtered list endpoints, never through nested routes.

  state_machine_shape: branching
  # TransactionDayReport carries a revision cycle (REJECTED -> DRAFT -> SUBMITTED),
  # ConcessionAgreement carries two independent status axes on one row
  # (contract_status and compliance_status advance on their own clocks), and
  # CapitalDisbursement forks REQUESTED -> {AUTHORIZED, REJECTED} with divergent
  # side-effect sets.

  relationship_patterns:
    - one_to_many          # Facility -> Concessionaire/CounterSpace/FleetParkingZone/...
    - many_to_many         # ShuttleCostAllocation joins ShuttleCostPeriod x ConcessionAgreement
    - self_referential     # CapitalProject.predecessor_project_id -> CapitalProject.id
    - cross_aggregate      # CfcRemittance mutates Facility trust buckets and DebtServiceObligation

  role_model: segregation_of_duties
  # The FinanceOfficer who requests a capital draw may not authorize it, and the
  # AuditOfficer who accepted a transaction-day report may not issue the
  # minimum-guarantee true-up settlement built on that report.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 69 endpoints / 46 error codes / 7 calculations / 10 state machines.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Airport/ConRAC code; unique across facilities", constraints: "3-8 chars, uppercase" }
      - { name: name, type: string, source: input, description: "Display name of the consolidated rental car facility" }
      - { name: cfc_rate_per_transaction_day_cents, type: integer, source: input, description: "Customer Facility Charge levied per on-airport transaction day, in cents", constraints: ">= 0" }
      - { name: ds_reserve_requirement_cents, type: integer, source: input, description: "Bond debt-service reserve requirement that CFC receipts must fund", constraints: ">= 0" }
      - { name: om_reserve_requirement_cents, type: integer, source: input, description: "Operations & maintenance reserve requirement", constraints: ">= 0" }
      - { name: capital_fund_cap_cents, type: integer, source: input, description: "Ceiling on the CFC capital fund bucket; overflow spills to unallocated", constraints: ">= 0" }
      - { name: overflow_lot_stalls, type: integer, source: input, description: "Total stalls in the shared remote overflow lot", constraints: ">= 0" }
      - { name: overflow_daily_surcharge_cents, type: integer, source: input, default: 0, description: "Per-stall per-day surcharge billed for overflow-lot stalls" }
      - { name: remittance_grace_days, type: integer, source: input, default: 20, description: "Days after the reporting period's last calendar day before a PENDING CfcRemittance is DELINQUENT" }
      - { name: trust_lifetime_received_cents, type: integer, source: computed, default: 0, description: "Cumulative CFC cash received into the trust; never decreases" }
      - { name: trust_debt_service_reserve_cents, type: integer, source: computed, default: 0, description: "Unencumbered debt-service reserve bucket of the CFC trust" }
      - { name: trust_debt_service_funded_cents, type: integer, source: computed, default: 0, description: "Debt-service cash committed to FUNDED obligations but not yet paid out" }
      - { name: trust_om_reserve_cents, type: integer, source: computed, default: 0, description: "Operations & maintenance reserve bucket of the CFC trust" }
      - { name: trust_capital_fund_cents, type: integer, source: computed, default: 0, description: "Unencumbered capital-project bucket of the CFC trust" }
      - { name: trust_unallocated_cents, type: integer, source: computed, default: 0, description: "Residue that exceeded every bucket cap" }
      - { name: trust_encumbered_cents, type: integer, source: computed, default: 0, description: "Capital cash reserved by AUTHORIZED CapitalDisbursement rows" }
      - { name: trust_disbursed_cents, type: integer, source: computed, default: 0, description: "Cash that has permanently left the trust (paid draws + paid obligations)" }
      - { name: bond_coverage_status, type: enum, source: computed, default: DEFICIENT, description: "SATISFIED when trust_debt_service_reserve_cents + trust_debt_service_funded_cents >= ds_reserve_requirement_cents, else DEFICIENT", constraints: "SATISFIED | DEFICIENT" }
      - { name: funded_obligation_count, type: integer, source: computed, default: 0, description: "Number of DebtServiceObligation rows that have ever reached FUNDED at this facility" }
      - { name: overflow_stalls_allocated, type: integer, source: computed, default: 0, description: "Sum of overflow_stalls_granted over FleetAllocation rows with status ALLOCATED at this facility" }
      - { name: overflow_stalls_available, type: integer, source: computed, description: "overflow_lot_stalls - overflow_stalls_allocated" }
      - { name: current_utc, type: datetime, source: computed, description: "Logical clock reading; defaults to 2026-08-01T00:00:00Z until POST /rac/_clock/set_current_utc moves it" }

  - name: Concessionaire
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC this rental-car brand operates in" }
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the operator" }
      - { name: brand_code, type: string, source: input, description: "Short brand code; unique within a facility", constraints: "2-8 chars, uppercase" }
      - { name: contact_email, type: string, source: input, description: "Billing contact address" }
      - { name: agreement_count, type: integer, source: computed, default: 0, description: "Number of ConcessionAgreement rows referencing this concessionaire" }

  - name: ConcessionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC governed by this agreement" }
      - { name: concessionaire_id, type: string, source: input, description: "FK -> Concessionaire.id; the operator bound by this agreement" }
      - { name: contract_year_index, type: integer, source: input, description: "1-based contract year this agreement covers", constraints: ">= 1" }
      - { name: term_start_date, type: string, source: input, description: "First calendar day of the contract year, YYYY-MM-DD, inclusive" }
      - { name: term_end_date, type: string, source: input, description: "Last calendar day of the contract year, YYYY-MM-DD, inclusive" }
      - { name: mag_annual_cents, type: integer, source: input, description: "Minimum Annual Guarantee for the contract year, in cents", constraints: ">= 0" }
      - { name: percentage_rent_rate_bps, type: integer, source: input, description: "Percentage rent rate in basis points applied to gross revenue", constraints: "0..10000" }
      - { name: rent_settlement_basis, type: enum, source: input, description: "Selects the percentage-rent variant: CUMULATIVE_YTD or MONTHLY_STANDALONE", constraints: "CUMULATIVE_YTD | MONTHLY_STANDALONE" }
      - { name: contract_status, type: enum, source: system, default: DRAFT, description: "Contract lifecycle axis: DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED" }
      - { name: compliance_status, type: enum, source: system, default: COMPLIANT, description: "Independent compliance axis: COMPLIANT | DELINQUENT | COVENANT_BREACH" }
      - { name: gross_revenue_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of audited_gross_revenue_cents over this agreement's ACCEPTED TransactionDayReport rows" }
      - { name: transaction_days_ytd, type: integer, source: computed, default: 0, description: "Sum of audited_on_airport_transaction_days over this agreement's ACCEPTED TransactionDayReport rows" }
      - { name: accepted_report_count, type: integer, source: computed, default: 0, description: "Count of this agreement's TransactionDayReport rows currently in ACCEPTED status" }
      - { name: percentage_rent_accrued_cents, type: integer, source: computed, default: 0, description: "Year-to-date percentage rent = round_half_up(gross_revenue_ytd_cents * percentage_rent_rate_bps / 10000)" }
      - { name: rent_billed_to_date_cents, type: integer, source: computed, default: 0, description: "Cumulative rent installments billed across accepted reports" }
      - { name: last_installment_cents, type: integer, source: computed, default: 0, description: "Installment produced by the most recent report acceptance" }
      - { name: rent_tier, type: enum, source: computed, default: MAG_FLOOR, description: "PERCENTAGE when percentage_rent_accrued_cents > mag_to_date_cents, else MAG_FLOOR", constraints: "MAG_FLOOR | PERCENTAGE" }
      - { name: mag_shortfall_cents, type: integer, source: computed, default: 0, description: "max(0, mag_to_date_cents - percentage_rent_accrued_cents)" }
      - { name: counter_units_assigned, type: integer, source: computed, default: 0, description: "Count of CounterAssignment rows for this agreement with status in {ALLOCATED, ACTIVE}" }
      - { name: fleet_stalls_allocated, type: integer, source: computed, default: 0, description: "Sum of zone_stalls_granted + overflow_stalls_granted over this agreement's ALLOCATED FleetAllocation rows" }

  - name: CounterSpace
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC that owns this counter/ready-return space" }
      - { name: terminal_code, type: string, source: input, description: "Terminal or level identifier where the space sits" }
      - { name: space_label, type: string, source: input, description: "Space label; unique within a facility" }
      - { name: space_class, type: enum, source: input, description: "COUNTER for rental counters, READY_RETURN for ready/return stalls", constraints: "COUNTER | READY_RETURN" }
      - { name: active_assignment_id, type: string, source: computed, default: null, description: "Denormalized pointer to the CounterAssignment currently in ACTIVE status on this space; null when unoccupied" }
      - { name: assignment_count, type: integer, source: computed, default: 0, description: "Count of CounterAssignment rows on this space with status in {ALLOCATED, ACTIVE}" }

  - name: CounterAssignment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; the agreement occupying the space" }
      - { name: counter_space_id, type: string, source: input, description: "FK -> CounterSpace.id; the space being occupied" }
      - { name: effective_start_date, type: string, source: input, description: "Occupancy start, YYYY-MM-DD, INCLUSIVE" }
      - { name: effective_end_date, type: string, source: input, description: "Occupancy end, YYYY-MM-DD, EXCLUSIVE (half-open interval)" }
      - { name: status, type: enum, source: system, default: ALLOCATED, description: "ALLOCATED | ACTIVE | RELEASED" }
      - { name: released_on_date, type: string, source: computed, default: null, description: "Calendar date (YYYY-MM-DD) of the logical clock when release ran; null while not RELEASED" }

  - name: FleetParkingZone
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC that owns this fleet parking zone" }
      - { name: zone_label, type: string, source: input, description: "Zone label shown on the parking deck" }
      - { name: stall_capacity, type: integer, source: input, description: "Physical stall count in this zone", constraints: ">= 0" }
      - { name: stalls_allocated, type: integer, source: computed, default: 0, description: "Sum of zone_stalls_granted over FleetAllocation rows on this zone with status ALLOCATED" }
      - { name: stalls_available, type: integer, source: computed, description: "stall_capacity - stalls_allocated" }

  - name: FleetAllocation
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; the agreement holding the stalls" }
      - { name: zone_id, type: string, source: input, description: "FK -> FleetParkingZone.id; the primary zone drawn from" }
      - { name: start_date, type: string, source: input, description: "Allocation start, YYYY-MM-DD, INCLUSIVE" }
      - { name: end_date, type: string, source: input, description: "Allocation end, YYYY-MM-DD, INCLUSIVE (closed interval)" }
      - { name: stalls_requested, type: integer, source: input, description: "Total stalls requested for the closed interval", constraints: ">= 1" }
      - { name: allow_overflow, type: boolean, source: input, default: false, description: "When true, unmet demand may spill into the facility overflow lot" }
      - { name: zone_stalls_granted, type: integer, source: computed, default: 0, description: "Stalls granted inside zone_id" }
      - { name: overflow_stalls_granted, type: integer, source: computed, default: 0, description: "Stalls granted in the facility overflow lot" }
      - { name: inclusive_days, type: integer, source: computed, default: 0, description: "(end_date - start_date) in days + 1, because the interval is closed" }
      - { name: overflow_surcharge_cents, type: integer, source: computed, default: 0, description: "overflow_stalls_granted * facility.overflow_daily_surcharge_cents * inclusive_days" }
      - { name: status, type: enum, source: system, default: ALLOCATED, description: "ALLOCATED | RELEASED" }

  - name: TransactionDayReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; the agreement whose activity is reported" }
      - { name: period_year, type: integer, source: input, description: "Reporting period year", constraints: "2000..2100" }
      - { name: period_month, type: integer, source: input, description: "Reporting period month", constraints: "1..12" }
      - { name: reported_gross_revenue_cents, type: integer, source: input, description: "Self-reported gross revenue for the period, in cents", constraints: ">= 0" }
      - { name: reported_on_airport_transaction_days, type: integer, source: input, description: "Self-reported on-airport transaction days for the period", constraints: ">= 0" }
      - { name: audited_gross_revenue_cents, type: integer, source: computed, default: null, description: "Gross revenue confirmed at audit acceptance; null before ACCEPTED" }
      - { name: audited_on_airport_transaction_days, type: integer, source: computed, default: null, description: "Transaction days confirmed at audit acceptance; null before ACCEPTED" }
      - { name: revenue_variance_cents, type: integer, source: computed, default: null, description: "audited_gross_revenue_cents - reported_gross_revenue_cents; null before ACCEPTED" }
      - { name: variance_assessment_cents, type: integer, source: computed, default: 0, description: "round_half_up(max(0, revenue_variance_cents) * agreement.percentage_rent_rate_bps / 10000)" }
      - { name: period_rent_installment_cents, type: integer, source: computed, default: 0, description: "Rent installment this acceptance produced on the agreement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_AUDIT | REJECTED | ACCEPTED | SUPERSEDED" }
      - { name: audited_by_user_id, type: string, source: computed, default: null, description: "X-User-ID of the AuditOfficer that accepted this report; null before ACCEPTED" }
      - { name: rejection_reason, type: string, source: computed, default: null, description: "Reason recorded by the AuditOfficer on rejection" }
      - { name: submission_count, type: integer, source: computed, default: 0, description: "How many times this report has entered SUBMITTED" }

  - name: CfcRemittance
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; payer of the Customer Facility Charge" }
      - { name: report_id, type: string, source: input, description: "FK -> TransactionDayReport.id; the report whose transaction days the charge is derived from" }
      - { name: remittance_basis, type: enum, source: input, description: "PROVISIONAL uses self-reported days; FINAL uses audited days", constraints: "PROVISIONAL | FINAL" }
      - { name: expected_amount_cents, type: integer, source: computed, default: 0, description: "billable transaction days * facility.cfc_rate_per_transaction_day_cents" }
      - { name: amount_received_cents, type: integer, source: computed, default: 0, description: "Cumulative cash received against this remittance" }
      - { name: shortfall_cents, type: integer, source: computed, default: 0, description: "max(0, expected_amount_cents - amount_received_cents)" }
      - { name: due_date, type: string, source: computed, description: "Last calendar day of the reporting period plus facility.remittance_grace_days, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | DELINQUENT | RECEIVED | RECONCILED" }
      - { name: allocated_to_debt_service_cents, type: integer, source: computed, default: 0, description: "Cumulative cents this remittance sent to the debt-service reserve bucket" }
      - { name: allocated_to_om_cents, type: integer, source: computed, default: 0, description: "Cumulative cents this remittance sent to the O&M reserve bucket" }
      - { name: allocated_to_capital_cents, type: integer, source: computed, default: 0, description: "Cumulative cents this remittance sent to the capital fund bucket" }
      - { name: allocated_to_unallocated_cents, type: integer, source: computed, default: 0, description: "Cumulative cents this remittance left unallocated" }

  - name: DebtServiceObligation
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC whose CFC trust services this bond payment" }
      - { name: series_label, type: string, source: input, description: "Bond series label, e.g. 'Series 2026A'" }
      - { name: due_date, type: string, source: input, description: "Payment due date, YYYY-MM-DD" }
      - { name: amount_due_cents, type: integer, source: input, description: "Debt service payable on due_date", constraints: ">= 1" }
      - { name: coverage_requirement_bps, type: integer, source: input, default: 12500, description: "Required coverage in basis points of amount_due_cents; 12500 means 1.25x" }
      - { name: coverage_ratio_at_funding, type: number, source: computed, default: null, description: "Coverage ratio recorded when the obligation reached FUNDED, 4 decimal places round_half_up" }
      - { name: funded_from_reserve_cents, type: integer, source: computed, default: 0, description: "Cash moved from trust_debt_service_reserve_cents into trust_debt_service_funded_cents" }
      - { name: auto_funded, type: boolean, source: computed, default: false, description: "True when the CFC remittance cascade funded this obligation rather than an explicit fund call" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | FUNDED | PAID | DEFERRED" }

  - name: ShuttleCostPeriod
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC whose shuttle bus pool is being allocated" }
      - { name: period_year, type: integer, source: input, description: "Shuttle cost period year", constraints: "2000..2100" }
      - { name: period_month, type: integer, source: input, description: "Shuttle cost period month", constraints: "1..12" }
      - { name: total_cost_cents, type: integer, source: input, description: "Total shuttle bus operating cost pool for the period", constraints: ">= 0" }
      - { name: allocation_basis, type: enum, source: input, description: "TRANSACTION_DAYS or GROSS_REVENUE; picks the dual-variant allocation driver", constraints: "TRANSACTION_DAYS | GROSS_REVENUE" }
      - { name: total_basis_value, type: integer, source: computed, default: 0, description: "Sum of basis_value across every eligible agreement for the period" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents across the generated ShuttleCostAllocation rows; must equal total_cost_cents after allocation" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of ShuttleCostAllocation rows generated" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ALLOCATED" }

  - name: ShuttleCostAllocation
    parent: null
    common_fields: false
    fields:
      - { name: shuttle_period_id, type: string, source: input, description: "FK -> ShuttleCostPeriod.id; the pool this line draws from" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; the agreement charged this line" }
      - { name: basis_value, type: integer, source: computed, description: "Transaction days or gross revenue cents contributed by this agreement in the period" }
      - { name: share_bps, type: integer, source: computed, description: "round_half_up(basis_value * 10000 / total_basis_value); display only, never used for money" }
      - { name: floor_cents, type: integer, source: computed, description: "floor(total_cost_cents * basis_value / total_basis_value)" }
      - { name: remainder_rank, type: integer, source: computed, description: "1-based rank in the largest-remainder ordering; ranks 1..remainder_pool each receive one extra cent" }
      - { name: amount_cents, type: integer, source: computed, description: "floor_cents plus one cent when remainder_rank <= remainder_pool" }

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the ConRAC the project improves" }
      - { name: predecessor_project_id, type: string, source: input, default: null, description: "FK -> CapitalProject.id; gate project that must be CLOSED before draws may be requested; null when ungated" }
      - { name: project_name, type: string, source: input, description: "Capital project name" }
      - { name: budget_cents, type: integer, source: input, description: "Authorized project budget funded from the CFC capital bucket", constraints: ">= 1" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this project's PAID CapitalDisbursement rows" }
      - { name: encumbered_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this project's AUTHORIZED CapitalDisbursement rows" }
      - { name: draw_request_count, type: integer, source: computed, default: 0, description: "Number of CapitalDisbursement rows ever created against this project" }
      - { name: rejected_draw_count, type: integer, source: computed, default: 0, description: "Number of CapitalDisbursement rows that reached REJECTED" }
      - { name: funding_hold, type: boolean, source: computed, default: true, description: "True while the project may not advance APPROVED -> FUNDED" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | FUNDED | CLOSED | CANCELLED" }

  - name: CapitalDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CapitalProject.id; the project this draw funds" }
      - { name: amount_cents, type: integer, source: input, description: "Requested draw amount in cents", constraints: ">= 1" }
      - { name: memo, type: string, source: input, default: null, description: "Free-text purpose of the draw" }
      - { name: requested_by_user_id, type: string, source: computed, description: "X-User-ID captured from the creating request" }
      - { name: authorized_by_user_id, type: string, source: computed, default: null, description: "X-User-ID captured from the authorizing request" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | AUTHORIZED | PAID | REJECTED | VOIDED" }

  - name: TrueUpSettlement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ConcessionAgreement.id; the agreement being trued up" }
      - { name: contract_year_index, type: integer, source: input, description: "Contract year being settled; must equal agreement.contract_year_index", constraints: ">= 1" }
      - { name: final_percentage_rent_cents, type: integer, source: computed, default: 0, description: "round_half_up(agreement.gross_revenue_ytd_cents * agreement.percentage_rent_rate_bps / 10000) frozen at issue" }
      - { name: mag_cents, type: integer, source: computed, default: 0, description: "agreement.mag_annual_cents frozen at issue" }
      - { name: rent_billed_cents, type: integer, source: computed, default: 0, description: "agreement.rent_billed_to_date_cents frozen at issue" }
      - { name: audit_assessment_cents, type: integer, source: computed, default: 0, description: "Sum of variance_assessment_cents over the agreement's ACCEPTED reports" }
      - { name: base_true_up_cents, type: integer, source: computed, default: 0, description: "max(mag_cents, final_percentage_rent_cents) - rent_billed_cents + audit_assessment_cents" }
      - { name: credit_bps, type: integer, source: computed, default: 0, description: "Shuttle performance credit tier in basis points, keyed on base_true_up_cents" }
      - { name: shuttle_credit_cents, type: integer, source: computed, default: 0, description: "round_half_up(base_true_up_cents * credit_bps / 10000)" }
      - { name: net_true_up_cents, type: integer, source: computed, default: 0, description: "base_true_up_cents - shuttle_credit_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cash applied at settlement" }
      - { name: issued_by_user_id, type: string, source: computed, default: null, description: "X-User-ID of the AuditOfficer that issued this settlement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | DISPUTED | SETTLED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # ConcessionAgreement — TWO INDEPENDENT STATUS AXES on one row.
  # Axis 1 `contract_status` is driven by FacilityAdmin lifecycle calls and
  # carries the ACTIVE -> SUSPENDED -> ACTIVE loop.
  # Axis 2 `compliance_status` is driven entirely by remittance and audit
  # events and never by the lifecycle calls; the two axes advance on their own.
  # ---------------------------------------------------------------------------
  - entity: ConcessionAgreement
    axis: contract_status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rac/concession-agreements/{agreement_id}/execute"
        actor: FacilityAdmin
        preconditions:
          - "contract_status == DRAFT"
          - "term_start_date < term_end_date"
        side_effects:
          - "Concessionaire.agreement_count is unchanged (it was incremented at creation)"
          - "increments ConcessionAgreement.version by 1"
        note: "compliance_status is untouched by this transition."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rac/concession-agreements/{agreement_id}/suspend"
        actor: FacilityAdmin
        preconditions: ["contract_status == ACTIVE"]
        side_effects:
          - "every CounterAssignment of this agreement with status == ACTIVE is set back to ALLOCATED and its CounterSpace.active_assignment_id is cleared to null"
          - "increments ConcessionAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rac/concession-agreements/{agreement_id}/reinstate"
        actor: FacilityAdmin
        preconditions: ["contract_status == SUSPENDED"]
        side_effects: ["increments ConcessionAgreement.version by 1"]
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE loop; the agreement may cycle any number of times."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /rac/_clock/set_current_utc moves the clock past term_end_date"
        actor: system
        preconditions: ["contract_status == ACTIVE", "date(current_utc) > term_end_date"]
        side_effects:
          - "increments ConcessionAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system: POST /rac/_clock/set_current_utc moves the clock past term_end_date while suspended"
        actor: system
        preconditions: ["contract_status == SUSPENDED", "date(current_utc) > term_end_date"]
        side_effects:
          - "every CounterAssignment of this agreement with status in {ALLOCATED, ACTIVE} is set to RELEASED and CounterSpace.assignment_count decrements accordingly"
          - "increments ConcessionAgreement.version by 1"

  - entity: ConcessionAgreement
    axis: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "system: POST /rac/_clock/set_current_utc pushes a PENDING CfcRemittance past its due_date"
        actor: system
        preconditions: ["a CfcRemittance of this agreement has status == PENDING and due_date < date(current_utc)"]
        side_effects:
          - "the offending CfcRemittance moves PENDING -> DELINQUENT"
          - "increments ConcessionAgreement.version by 1"
        note: "contract_status is untouched; an ACTIVE agreement stays ACTIVE while DELINQUENT."
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive brings the last outstanding remittance to RECONCILED"
        actor: FinanceOfficer
        preconditions:
          - "compliance_status == DELINQUENT"
          - "no CfcRemittance of this agreement remains in status DELINQUENT after this receipt"
        side_effects: ["increments ConcessionAgreement.version by 1"]
      - from: COMPLIANT
        to: COVENANT_BREACH
        trigger: "POST /rac/transaction-day-reports/{report_id}/accept records variance_assessment_cents > 0"
        actor: AuditOfficer
        preconditions: ["compliance_status == COMPLIANT", "the accepted report's variance_assessment_cents > 0"]
        side_effects: ["increments ConcessionAgreement.version by 1"]
      - from: DELINQUENT
        to: COVENANT_BREACH
        trigger: "POST /rac/transaction-day-reports/{report_id}/accept records variance_assessment_cents > 0"
        actor: AuditOfficer
        preconditions: ["compliance_status == DELINQUENT", "the accepted report's variance_assessment_cents > 0"]
        side_effects: ["increments ConcessionAgreement.version by 1"]
      - from: COVENANT_BREACH
        to: COMPLIANT
        trigger: "POST /rac/true-up-settlements/{settlement_id}/settle"
        actor: FinanceOfficer
        preconditions: ["compliance_status == COVENANT_BREACH", "settlement.status == ISSUED", "amount_paid_cents >= net_true_up_cents"]
        side_effects: ["increments ConcessionAgreement.version by 1"]

  # ---------------------------------------------------------------------------
  # TransactionDayReport — CYCLIC (REJECTED -> DRAFT -> SUBMITTED -> ...)
  # ---------------------------------------------------------------------------
  - entity: TransactionDayReport
    axis: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rac/transaction-day-reports/{report_id}/submit"
        actor: ConcessionaireOperator
        preconditions:
          - "status == DRAFT"
          - "agreement.contract_status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "submission_count increments by 1"
          - "increments TransactionDayReport.version by 1"
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /rac/transaction-day-reports/{report_id}/begin-audit"
        actor: AuditOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["increments TransactionDayReport.version by 1"]
      - from: UNDER_AUDIT
        to: REJECTED
        trigger: "POST /rac/transaction-day-reports/{report_id}/reject"
        actor: AuditOfficer
        preconditions: ["status == UNDER_AUDIT"]
        side_effects:
          - "rejection_reason is stored"
          - "increments TransactionDayReport.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /rac/transaction-day-reports/{report_id}/reopen"
        actor: ConcessionaireOperator
        preconditions: ["status == REJECTED"]
        side_effects:
          - "rejection_reason is cleared to null"
          - "increments TransactionDayReport.version by 1"
        note: "Closes the revision cycle: DRAFT -> SUBMITTED -> UNDER_AUDIT -> REJECTED -> DRAFT."
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /rac/transaction-day-reports/{report_id}/accept"
        actor: AuditOfficer
        preconditions:
          - "status == UNDER_AUDIT"
          - "audited_gross_revenue_cents >= 0 and audited_on_airport_transaction_days >= 0"
        side_effects:
          - "CASCADE HOP 1: report.audited_gross_revenue_cents / audited_on_airport_transaction_days are stored; revenue_variance_cents = audited_gross_revenue_cents - reported_gross_revenue_cents; variance_assessment_cents = round_half_up(max(0, revenue_variance_cents) * agreement.percentage_rent_rate_bps / 10000); audited_by_user_id = X-User-ID; status = ACCEPTED"
          - "CASCADE HOP 2: because this report became ACCEPTED, agreement.accepted_report_count += 1, agreement.gross_revenue_ytd_cents += audited_gross_revenue_cents, agreement.transaction_days_ytd += audited_on_airport_transaction_days, and calculations.percentage_rent_accrual runs, writing agreement.percentage_rent_accrued_cents, agreement.rent_billed_to_date_cents, agreement.last_installment_cents, agreement.mag_shortfall_cents, agreement.rent_tier and report.period_rent_installment_cents"
          - "CASCADE HOP 3: because HOP 2 moved agreement.rent_tier from MAG_FLOOR to PERCENTAGE, every TrueUpSettlement whose agreement_id equals this agreement and whose status == DRAFT transitions DRAFT -> SUPERSEDED, ordered by created_at ASC"
          - "if variance_assessment_cents > 0, agreement.compliance_status moves to COVENANT_BREACH"
          - "any other TransactionDayReport of the same agreement with the same period_year and period_month already in ACCEPTED transitions ACCEPTED -> SUPERSEDED and its contribution is subtracted from agreement.gross_revenue_ytd_cents, agreement.transaction_days_ytd and agreement.accepted_report_count before HOP 2 runs"
          - "increments TransactionDayReport.version by 1 and ConcessionAgreement.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a later TransactionDayReport for the same agreement_id + period_year + period_month reaches ACCEPTED"
        actor: system
        preconditions: ["status == ACCEPTED"]
        side_effects:
          - "its audited figures are removed from the agreement's year-to-date accumulators"
          - "increments TransactionDayReport.version by 1"

  # ---------------------------------------------------------------------------
  # CfcRemittance
  # ---------------------------------------------------------------------------
  - entity: CfcRemittance
    axis: status
    initial_state: PENDING
    terminal_states: [RECONCILED]
    transitions:
      - from: PENDING
        to: DELINQUENT
        trigger: "system: POST /rac/_clock/set_current_utc moves the clock past due_date"
        actor: system
        preconditions: ["status == PENDING", "due_date < date(current_utc)"]
        side_effects:
          - "agreement.compliance_status moves COMPLIANT -> DELINQUENT"
          - "increments CfcRemittance.version by 1"
      - from: PENDING
        to: RECEIVED
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive with cumulative receipts below expected_amount_cents"
        actor: FinanceOfficer
        preconditions: ["status in {PENDING, DELINQUENT, RECEIVED}", "amount_received_cents + payload.amount_received_cents < expected_amount_cents"]
        side_effects:
          - "CASCADE HOP 1: amount_received_cents accumulates; shortfall_cents = expected_amount_cents - amount_received_cents"
          - "CASCADE HOP 2: because cash arrived, calculations.cfc_trust_waterfall runs on the newly received delta and mutates facility.trust_* buckets and facility.trust_lifetime_received_cents"
          - "CASCADE HOP 3: because the buckets moved, facility.bond_coverage_status is recomputed"
          - "CASCADE HOP 4: because bond_coverage_status is SATISFIED, calculations.debt_service_auto_funding may move one DebtServiceObligation SCHEDULED -> FUNDED"
          - "CASCADE HOP 5: because that obligation became FUNDED, facility.funded_obligation_count increments and every CapitalProject of the facility with status == APPROVED and funding_hold == true is released to FUNDED"
          - "increments CfcRemittance.version by 1 and Facility.version by 1"
      - from: DELINQUENT
        to: RECEIVED
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive with cumulative receipts below expected_amount_cents"
        actor: FinanceOfficer
        preconditions: ["status == DELINQUENT"]
        side_effects: ["same five-hop cascade as PENDING -> RECEIVED", "increments CfcRemittance.version by 1"]
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive with cumulative receipts reaching expected_amount_cents"
        actor: FinanceOfficer
        preconditions: ["status == RECEIVED", "amount_received_cents + payload.amount_received_cents >= expected_amount_cents"]
        side_effects:
          - "shortfall_cents = 0"
          - "same five-hop cascade as PENDING -> RECEIVED"
          - "if no CfcRemittance of the agreement remains DELINQUENT, agreement.compliance_status moves DELINQUENT -> COMPLIANT"
          - "increments CfcRemittance.version by 1"
      - from: PENDING
        to: RECONCILED
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive paying expected_amount_cents in full on the first receipt"
        actor: FinanceOfficer
        preconditions: ["status == PENDING", "payload.amount_received_cents >= expected_amount_cents"]
        side_effects:
          - "shortfall_cents = 0"
          - "same five-hop cascade as PENDING -> RECEIVED"
          - "increments CfcRemittance.version by 1"
        note: "A zero-expected remittance (expected_amount_cents == 0) reconciles on a receipt of 0 and the waterfall moves no cents."
      - from: DELINQUENT
        to: RECONCILED
        trigger: "POST /rac/cfc-remittances/{remittance_id}/receive paying the balance in full"
        actor: FinanceOfficer
        preconditions: ["status == DELINQUENT", "amount_received_cents + payload.amount_received_cents >= expected_amount_cents"]
        side_effects:
          - "same five-hop cascade as PENDING -> RECEIVED"
          - "if no CfcRemittance of the agreement remains DELINQUENT, agreement.compliance_status moves DELINQUENT -> COMPLIANT"
          - "increments CfcRemittance.version by 1"

  # ---------------------------------------------------------------------------
  # DebtServiceObligation
  # ---------------------------------------------------------------------------
  - entity: DebtServiceObligation
    axis: status
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFERRED]
    transitions:
      - from: SCHEDULED
        to: FUNDED
        trigger: "POST /rac/debt-service-obligations/{obligation_id}/fund"
        actor: FinanceOfficer
        preconditions:
          - "status == SCHEDULED"
          - "(facility.trust_debt_service_reserve_cents + facility.trust_unallocated_cents) * 10000 >= coverage_requirement_bps * amount_due_cents"
        side_effects:
          - "funded_from_reserve_cents = amount_due_cents; auto_funded stays false; coverage_ratio_at_funding is recorded"
          - "facility.trust_debt_service_reserve_cents -= amount_due_cents; facility.trust_debt_service_funded_cents += amount_due_cents"
          - "facility.funded_obligation_count += 1"
          - "because funded_obligation_count is now >= 1 and facility.bond_coverage_status == SATISFIED, every CapitalProject of the facility with status == APPROVED, funding_hold == true and (predecessor_project_id is null OR the predecessor's status == CLOSED) transitions APPROVED -> FUNDED with funding_hold = false, ordered by created_at ASC"
          - "increments DebtServiceObligation.version by 1 and Facility.version by 1"
      - from: SCHEDULED
        to: FUNDED
        trigger: "system: calculations.debt_service_auto_funding fires inside POST /rac/cfc-remittances/{remittance_id}/receive"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "facility.bond_coverage_status == SATISFIED after the waterfall"
          - "(facility.trust_debt_service_reserve_cents + facility.trust_unallocated_cents) * 10000 >= coverage_requirement_bps * amount_due_cents"
        side_effects:
          - "auto_funded = true; funded_from_reserve_cents = amount_due_cents; coverage_ratio_at_funding is recorded"
          - "facility.trust_debt_service_reserve_cents -= amount_due_cents; facility.trust_debt_service_funded_cents += amount_due_cents"
          - "facility.funded_obligation_count += 1"
          - "the same APPROVED -> FUNDED CapitalProject release runs"
          - "increments DebtServiceObligation.version by 1"
      - from: FUNDED
        to: PAID
        trigger: "POST /rac/debt-service-obligations/{obligation_id}/pay"
        actor: FinanceOfficer
        preconditions: ["status == FUNDED"]
        side_effects:
          - "facility.trust_debt_service_funded_cents -= amount_due_cents; facility.trust_disbursed_cents += amount_due_cents"
          - "facility.bond_coverage_status is recomputed and may fall back to DEFICIENT"
          - "increments DebtServiceObligation.version by 1 and Facility.version by 1"
      - from: SCHEDULED
        to: DEFERRED
        trigger: "system: POST /rac/_clock/set_current_utc moves the clock past due_date while still SCHEDULED"
        actor: system
        preconditions: ["status == SCHEDULED", "due_date < date(current_utc)"]
        side_effects: ["increments DebtServiceObligation.version by 1"]

  # ---------------------------------------------------------------------------
  # CounterAssignment
  # ---------------------------------------------------------------------------
  - entity: CounterAssignment
    axis: status
    initial_state: ALLOCATED
    terminal_states: [RELEASED]
    transitions:
      - from: ALLOCATED
        to: ACTIVE
        trigger: "POST /rac/counter-assignments/{counter_assignment_id}/activate"
        actor: ConcessionaireOperator
        preconditions:
          - "status == ALLOCATED"
          - "the referenced ConcessionAgreement.contract_status == ACTIVE"
          - "the referenced CounterSpace.active_assignment_id is null"
        side_effects:
          - "CounterSpace.active_assignment_id = this assignment's id"
          - "increments CounterAssignment.version by 1 and CounterSpace.version by 1"
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /rac/counter-assignments/{counter_assignment_id}/release"
        actor: ConcessionaireOperator
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "CounterSpace.assignment_count -= 1; ConcessionAgreement.counter_units_assigned -= 1"
          - "released_on_date = date(facility.current_utc)"
          - "increments CounterAssignment.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /rac/counter-assignments/{counter_assignment_id}/release"
        actor: ConcessionaireOperator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CounterSpace.active_assignment_id = null; CounterSpace.assignment_count -= 1; ConcessionAgreement.counter_units_assigned -= 1"
          - "released_on_date = date(facility.current_utc)"
          - "increments CounterAssignment.version by 1"

  # ---------------------------------------------------------------------------
  # FleetAllocation
  # ---------------------------------------------------------------------------
  - entity: FleetAllocation
    axis: status
    initial_state: ALLOCATED
    terminal_states: [RELEASED]
    transitions:
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /rac/fleet-allocations/{fleet_allocation_id}/release"
        actor: ConcessionaireOperator
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "FleetParkingZone.stalls_allocated -= zone_stalls_granted; FleetParkingZone.stalls_available is recomputed"
          - "Facility.overflow_stalls_allocated -= overflow_stalls_granted; Facility.overflow_stalls_available is recomputed"
          - "ConcessionAgreement.fleet_stalls_allocated -= (zone_stalls_granted + overflow_stalls_granted)"
          - "increments FleetAllocation.version by 1, FleetParkingZone.version by 1 and Facility.version by 1"
        note: "Compensating action for the grant performed at creation; both conserved stall totals return to their pre-grant values."

  # ---------------------------------------------------------------------------
  # ShuttleCostPeriod
  # ---------------------------------------------------------------------------
  - entity: ShuttleCostPeriod
    axis: status
    initial_state: OPEN
    terminal_states: [ALLOCATED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /rac/shuttle-cost-periods/{shuttle_period_id}/allocate"
        actor: FinanceOfficer
        preconditions:
          - "status == OPEN"
          - "at least one eligible ConcessionAgreement has a positive basis_value for the period"
        side_effects:
          - "one immutable ShuttleCostAllocation row is created per eligible agreement, ordered by ConcessionAgreement.created_at ASC"
          - "total_basis_value, allocated_total_cents and line_count are written; allocated_total_cents equals total_cost_cents exactly"
          - "increments ShuttleCostPeriod.version by 1"

  # ---------------------------------------------------------------------------
  # CapitalProject
  # ---------------------------------------------------------------------------
  - entity: CapitalProject
    axis: status
    initial_state: PROPOSED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /rac/capital-projects/{project_id}/approve"
        actor: FacilityAdmin
        preconditions: ["status == PROPOSED"]
        side_effects:
          - "funding_hold = false when facility.funded_obligation_count >= 1 AND facility.bond_coverage_status == SATISFIED AND (predecessor_project_id is null OR predecessor.status == CLOSED); otherwise funding_hold stays true"
          - "when funding_hold became false, the project immediately continues APPROVED -> FUNDED inside the same request"
          - "increments CapitalProject.version by 1"
      - from: APPROVED
        to: FUNDED
        trigger: "system: released by the approve call itself, by a DebtServiceObligation reaching FUNDED, or by the predecessor project reaching CLOSED"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "facility.funded_obligation_count >= 1 AND facility.bond_coverage_status == SATISFIED"
          - "predecessor_project_id is null OR predecessor.status == CLOSED"
        side_effects:
          - "funding_hold = false"
          - "increments CapitalProject.version by 1"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /rac/capital-projects/{project_id}/close"
        actor: FacilityAdmin
        preconditions: ["status == FUNDED", "encumbered_cents == 0"]
        side_effects:
          - "because this project reached CLOSED, every CapitalProject whose predecessor_project_id equals this project's id, whose status == APPROVED and whose funding_hold == true is released APPROVED -> FUNDED when facility.funded_obligation_count >= 1 and facility.bond_coverage_status == SATISFIED, ordered by created_at ASC"
          - "increments CapitalProject.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /rac/capital-projects/{project_id}/cancel"
        actor: FacilityAdmin
        preconditions: ["status == PROPOSED"]
        side_effects: ["increments CapitalProject.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /rac/capital-projects/{project_id}/cancel"
        actor: FacilityAdmin
        preconditions: ["status == APPROVED", "encumbered_cents == 0"]
        side_effects: ["increments CapitalProject.version by 1"]
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /rac/capital-projects/{project_id}/cancel"
        actor: FacilityAdmin
        preconditions: ["status == FUNDED", "encumbered_cents == 0"]
        side_effects: ["increments CapitalProject.version by 1"]

  # ---------------------------------------------------------------------------
  # CapitalDisbursement — BRANCHING FORK with divergent side-effect sets.
  # ---------------------------------------------------------------------------
  - entity: CapitalDisbursement
    axis: status
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED, VOIDED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /rac/capital-disbursements/{disbursement_id}/authorize"
        actor: FinanceOfficer
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID != requested_by_user_id"
          - "project.status == FUNDED"
          - "facility.bond_coverage_status == SATISFIED"
          - "project.disbursed_cents + project.encumbered_cents + amount_cents <= project.budget_cents"
          - "facility.trust_capital_fund_cents >= amount_cents"
        side_effects:
          - "authorized_by_user_id = X-User-ID"
          - "facility.trust_capital_fund_cents -= amount_cents; facility.trust_encumbered_cents += amount_cents"
          - "project.encumbered_cents += amount_cents"
          - "increments CapitalDisbursement.version by 1, CapitalProject.version by 1 and Facility.version by 1"
        note: "Money-moving branch of the fork."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /rac/capital-disbursements/{disbursement_id}/reject"
        actor: FinanceOfficer
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID != requested_by_user_id"
        side_effects:
          - "project.rejected_draw_count += 1"
          - "no facility.trust_* bucket changes"
          - "increments CapitalDisbursement.version by 1 and CapitalProject.version by 1"
        note: "Money-free branch of the fork; the divergence from AUTHORIZED is the entire trust-bucket effect set."
      - from: AUTHORIZED
        to: PAID
        trigger: "POST /rac/capital-disbursements/{disbursement_id}/pay"
        actor: FinanceOfficer
        preconditions: ["status == AUTHORIZED"]
        side_effects:
          - "facility.trust_encumbered_cents -= amount_cents; facility.trust_disbursed_cents += amount_cents"
          - "project.encumbered_cents -= amount_cents; project.disbursed_cents += amount_cents"
          - "increments CapitalDisbursement.version by 1, CapitalProject.version by 1 and Facility.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /rac/capital-disbursements/{disbursement_id}/void"
        actor: FinanceOfficer
        preconditions: ["status == AUTHORIZED"]
        side_effects:
          - "facility.trust_encumbered_cents -= amount_cents; facility.trust_capital_fund_cents += amount_cents"
          - "project.encumbered_cents -= amount_cents"
          - "increments CapitalDisbursement.version by 1, CapitalProject.version by 1 and Facility.version by 1"
        note: "Compensating action for AUTHORIZED; the CFC trust conservation identity is left unchanged and trust_capital_fund_cents returns to its pre-authorization value."

  # ---------------------------------------------------------------------------
  # TrueUpSettlement — carries the ISSUED -> DISPUTED -> ISSUED loop.
  # ---------------------------------------------------------------------------
  - entity: TrueUpSettlement
    axis: status
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rac/true-up-settlements/{settlement_id}/issue"
        actor: AuditOfficer
        preconditions:
          - "status == DRAFT"
          - "every TransactionDayReport of the agreement has status in {ACCEPTED, SUPERSEDED}"
          - "X-User-ID does not equal audited_by_user_id on any ACCEPTED report of the agreement"
        side_effects:
          - "calculations.true_up_settlement_amount runs and freezes final_percentage_rent_cents, mag_cents, rent_billed_cents, audit_assessment_cents, base_true_up_cents, credit_bps, shuttle_credit_cents and net_true_up_cents"
          - "issued_by_user_id = X-User-ID"
          - "increments TrueUpSettlement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /rac/true-up-settlements/{settlement_id}/dispute"
        actor: ConcessionaireOperator
        preconditions: ["status == ISSUED"]
        side_effects: ["increments TrueUpSettlement.version by 1"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /rac/true-up-settlements/{settlement_id}/issue"
        actor: AuditOfficer
        preconditions:
          - "status == DISPUTED"
          - "X-User-ID does not equal audited_by_user_id on any ACCEPTED report of the agreement"
        side_effects:
          - "calculations.true_up_settlement_amount re-runs against current agreement figures"
          - "increments TrueUpSettlement.version by 1"
        note: "Closes the ISSUED -> DISPUTED -> ISSUED negotiation loop."
      - from: ISSUED
        to: SETTLED
        trigger: "POST /rac/true-up-settlements/{settlement_id}/settle"
        actor: FinanceOfficer
        preconditions: ["status == ISSUED", "payload.amount_paid_cents >= net_true_up_cents"]
        side_effects:
          - "amount_paid_cents is recorded"
          - "agreement.compliance_status moves COVENANT_BREACH -> COMPLIANT when it was COVENANT_BREACH"
          - "increments TrueUpSettlement.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: an accepted TransactionDayReport flips agreement.rent_tier from MAG_FLOOR to PERCENTAGE (cascade hop 3)"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["increments TrueUpSettlement.version by 1"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: counter-assignment-create-stale-agreement
    parent_entity: ConcessionAgreement
    write_endpoint: "POST /rac/counter-assignments"
    occ_field: "expected_agreement_version"
    description: |
      A CounterAssignment may be created against an agreement whose term dates,
      counter tally or compliance posture have moved since the client last read
      it; two assignments on different counter spaces both legitimately succeed,
      so no state precondition rejects the later write. The scaffold therefore
      requires the client to echo the agreement version it observed, and rejects
      the write when that version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: fleet-allocation-create-stale-zone
    parent_entity: FleetParkingZone
    write_endpoint: "POST /rac/fleet-allocations"
    occ_field: "expected_zone_version"
    description: |
      A FleetAllocation may be created against a zone whose stalls_allocated has
      moved since the client last read it; a second allocation for a disjoint
      interval legitimately succeeds, so no state precondition rejects it. The
      write therefore carries the zone version the client observed and is
      rejected when that version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: capital-disbursement-create-stale-project
    parent_entity: CapitalProject
    write_endpoint: "POST /rac/capital-disbursements"
    occ_field: "expected_project_version"
    description: |
      A CapitalDisbursement may be created against a project whose budget,
      encumbrance or funding state has moved since the client last read it;
      several draw requests against one project legitimately coexist, so no
      state precondition rejects the later write. The write therefore carries
      the project version the client observed and is rejected when stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  - name: percentage_rent_accrual
    trigger: "Cascade hop 2 of POST /rac/transaction-day-reports/{report_id}/accept"
    algorithm: tiered_pricing
    formula: |
      # --- shared preamble (runs for both variants) ---
      months_elapsed        = agreement.accepted_report_count            # AFTER the += 1 of hop 2
      monthly_mag_cents     = floor(agreement.mag_annual_cents / 12)
      mag_to_date_cents     = agreement.mag_annual_cents if months_elapsed >= 12
                              else monthly_mag_cents * months_elapsed
      pct_ytd_cents         = round_half_up(agreement.gross_revenue_ytd_cents
                                            * agreement.percentage_rent_rate_bps / 10000)

      # --- variant CUMULATIVE_YTD ---
      rent_due_to_date_cents = max(pct_ytd_cents, mag_to_date_cents)
      installment_cents      = rent_due_to_date_cents - agreement.rent_billed_to_date_cents

      # --- variant MONTHLY_STANDALONE ---
      pct_month_cents        = round_half_up(report.audited_gross_revenue_cents
                                             * agreement.percentage_rent_rate_bps / 10000)
      installment_cents      = max(pct_month_cents, monthly_mag_cents)

      # --- shared epilogue (identical for both variants) ---
      agreement.percentage_rent_accrued_cents = pct_ytd_cents
      agreement.rent_billed_to_date_cents    += installment_cents
      agreement.last_installment_cents        = installment_cents
      agreement.mag_shortfall_cents           = max(0, mag_to_date_cents - pct_ytd_cents)
      agreement.rent_tier                     = PERCENTAGE if pct_ytd_cents > mag_to_date_cents
                                                else MAG_FLOOR
      report.period_rent_installment_cents    = installment_cents
    input_set: |
      gross_revenue_ytd_cents and accepted_report_count are the sums/counts over
      TransactionDayReport rows of this agreement whose status == ACCEPTED.
      Reports in DRAFT, SUBMITTED, UNDER_AUDIT, REJECTED and SUPERSEDED are
      excluded. Reports are folded in acceptance order; when two reports for the
      same period both reach ACCEPTED, the earlier one is first demoted to
      SUPERSEDED and subtracted, then the new one is added.
    constants:
      MONTHS_PER_CONTRACT_YEAR: 12
      BPS_DENOMINATOR: 10000
    precision: "Integer cents. round_half_up on the bps multiplication; floor on the monthly MAG division."
    variants:
      - name: CUMULATIVE_YTD
        when: "agreement.rent_settlement_basis == CUMULATIVE_YTD"
        difference: |
          Rent is recomputed against year-to-date revenue and a year-to-date MAG
          accrual, and only the delta over rent_billed_to_date_cents is charged.
          A strong month therefore absorbs a weak month's MAG floor.
      - name: MONTHLY_STANDALONE
        when: "agreement.rent_settlement_basis == MONTHLY_STANDALONE"
        difference: |
          Each month independently pays max(month percentage rent, monthly MAG).
          The MAG floor of a weak month is never recovered by a strong month, so
          cumulative rent_billed_to_date_cents ends strictly higher whenever any
          month fell below the monthly MAG.

  - name: cfc_remittance_expected_amount
    trigger: "POST /rac/cfc-remittances (creation)"
    algorithm: aggregation
    formula: |
      if remittance_basis == PROVISIONAL:
          billable_days = report.reported_on_airport_transaction_days
      else:  # FINAL
          billable_days = report.audited_on_airport_transaction_days
      expected_amount_cents = billable_days * facility.cfc_rate_per_transaction_day_cents
      shortfall_cents       = expected_amount_cents          # nothing received yet
      due_date              = last_calendar_day(report.period_year, report.period_month)
                              + facility.remittance_grace_days days
    input_set: |
      Exactly one TransactionDayReport, identified by report_id. PROVISIONAL is
      only admissible while that report is in SUBMITTED or UNDER_AUDIT; FINAL is
      only admissible once it is ACCEPTED.
    constants: {}
    precision: "Integer cents; the product is exact, no rounding occurs."
    variants:
      - name: PROVISIONAL
        when: "remittance_basis == PROVISIONAL and report.status in {SUBMITTED, UNDER_AUDIT}"
        difference: "Bills the operator's self-reported transaction days before the audit confirms them."
      - name: FINAL
        when: "remittance_basis == FINAL and report.status == ACCEPTED"
        difference: "Bills the audited transaction days; diverges from PROVISIONAL by exactly (audited_days - reported_days) * cfc_rate_per_transaction_day_cents."

  - name: cfc_trust_waterfall
    trigger: "Cascade hop 2 of POST /rac/cfc-remittances/{remittance_id}/receive"
    algorithm: waterfall_allocation
    formula: |
      amount = payload.amount_received_cents            # only the NEW delta flows through
      gap_ds = max(0, facility.ds_reserve_requirement_cents
                      - facility.trust_debt_service_reserve_cents
                      - facility.trust_debt_service_funded_cents)
      gap_om = max(0, facility.om_reserve_requirement_cents - facility.trust_om_reserve_cents)

      # bucket 1 — debt service reserve (conditional branch on covenant posture)
      if facility.bond_coverage_status == DEFICIENT:
          to_ds = min(amount, gap_ds)                          # full sweep while deficient
      else:
          to_ds = min(floor(amount * DS_SHARE_BPS / 10000), gap_ds)
      r1 = amount - to_ds

      # bucket 2 — O&M reserve
      to_om = min(floor(r1 * OM_SHARE_BPS / 10000), gap_om)
      r2 = r1 - to_om

      # bucket 3 — capital fund, capped
      gap_cap    = max(0, facility.capital_fund_cap_cents - facility.trust_capital_fund_cents)
      to_capital = min(r2, gap_cap)

      # bucket 4 — residue
      to_unallocated = r2 - to_capital

      facility.trust_debt_service_reserve_cents += to_ds
      facility.trust_om_reserve_cents           += to_om
      facility.trust_capital_fund_cents         += to_capital
      facility.trust_unallocated_cents          += to_unallocated
      facility.trust_lifetime_received_cents    += amount
      remittance.allocated_to_debt_service_cents += to_ds
      remittance.allocated_to_om_cents           += to_om
      remittance.allocated_to_capital_cents      += to_capital
      remittance.allocated_to_unallocated_cents  += to_unallocated

      # bucket order is PINNED: debt service, then O&M, then capital, then residue.
      # to_ds + to_om + to_capital + to_unallocated == amount always holds.
    input_set: |
      Exactly the cents supplied in this receive call; previously received cents
      are never re-run through the waterfall. Buckets are read at their values
      as of the start of this request.
    constants:
      DS_SHARE_BPS: 6000
      OM_SHARE_BPS: 2500
      BPS_DENOMINATOR: 10000
    precision: "Integer cents; floor at each share computation; the residue bucket absorbs every truncated cent so no cents are lost."
    variants: []

  - name: debt_service_coverage_test
    trigger: "POST /rac/debt-service-obligations/{obligation_id}/fund, and cascade hop 4 of POST /rac/cfc-remittances/{remittance_id}/receive"
    algorithm: threshold
    formula: |
      available_cents = facility.trust_debt_service_reserve_cents
                        + facility.trust_unallocated_cents
      # exact integer cross-multiplication — no floating point, no rounding
      passes = (available_cents * 10000) >= (obligation.coverage_requirement_bps
                                             * obligation.amount_due_cents)
      coverage_ratio_at_funding = round_half_up(available_cents / obligation.amount_due_cents, 4)

      # --- auto-funding selector (cascade hop 4 only) ---
      candidates = DebtServiceObligation rows where
                     facility_id == facility.id
                     AND status == SCHEDULED
                     AND passes
      if candidates is empty: no obligation is funded and no error is raised
      else:
        winner = candidates sorted by (due_date ASC, created_at ASC) [0]
        at most ONE obligation is funded per receive call
    input_set: |
      Only the unencumbered debt-service reserve and the unallocated residue count
      toward coverage; trust_debt_service_funded_cents, trust_om_reserve_cents,
      trust_capital_fund_cents, trust_encumbered_cents and trust_disbursed_cents
      are excluded.
    constants:
      BPS_DENOMINATOR: 10000
      DEFAULT_COVERAGE_REQUIREMENT_BPS: 12500
    precision: "The pass/fail test is exact integer arithmetic and uses >= (a ratio of exactly 1.2500 against a 12500 bps requirement PASSES). coverage_ratio_at_funding is a display value rounded to 4 decimals, round_half_up, and never feeds the test."
    variants: []

  - name: shuttle_cost_allocation
    trigger: "POST /rac/shuttle-cost-periods/{shuttle_period_id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      eligible = ConcessionAgreement rows where
                   facility_id == period.facility_id
                   AND contract_status IN {ACTIVE, SUSPENDED}
                   AND basis_value > 0

      basis_value(agreement) =
        if period.allocation_basis == TRANSACTION_DAYS:
            sum of audited_on_airport_transaction_days over TransactionDayReport rows
            with agreement_id == agreement.id, status == ACCEPTED,
            period_year == period.period_year, period_month == period.period_month
        if period.allocation_basis == GROSS_REVENUE:
            sum of audited_gross_revenue_cents over the same report set

      total_basis_value = sum of basis_value over `eligible`
      if total_basis_value == 0 -> ERR_NO_ALLOCATION_BASIS (422)

      # STEP 1 — floor every line (round-per-line-THEN-sum is FORBIDDEN here)
      exact_i      = period.total_cost_cents * basis_value_i / total_basis_value   # exact rational
      floor_cents_i = floor(exact_i)
      frac_i        = exact_i - floor_cents_i

      # STEP 2 — largest-remainder distribution of the shortfall
      remainder_pool = period.total_cost_cents - sum(floor_cents_i)
      ranking        = lines sorted by (frac_i DESC, ConcessionAgreement.created_at ASC)
      remainder_rank_i = 1-based position of line i in `ranking`
      amount_cents_i = floor_cents_i + (1 if remainder_rank_i <= remainder_pool else 0)

      # STEP 3 — display share, never used for money
      share_bps_i = round_half_up(basis_value_i * 10000 / total_basis_value)

      period.allocated_total_cents = sum(amount_cents_i)   # == period.total_cost_cents, exactly
      period.line_count            = count(eligible)
    input_set: |
      Only ACCEPTED reports of the exact period_year + period_month are counted;
      SUPERSEDED, DRAFT, SUBMITTED, UNDER_AUDIT and REJECTED reports contribute
      nothing. Agreements in DRAFT, TERMINATED or EXPIRED contract_status are
      excluded even when they hold accepted reports for the period.
    constants:
      BPS_DENOMINATOR: 10000
    precision: |
      Integer cents. The rounding ORDER IS PINNED: floor each line first, then
      distribute the remaining cents one at a time down the largest-remainder
      ranking. Rounding each exact share to the nearest cent and summing is
      explicitly wrong and will not reproduce total_cost_cents.
    variants:
      - name: TRANSACTION_DAYS
        when: "period.allocation_basis == TRANSACTION_DAYS"
        difference: "Shuttle cost follows head-count of rentals: an operator with many low-value rentals pays a larger share than its revenue would imply."
      - name: GROSS_REVENUE
        when: "period.allocation_basis == GROSS_REVENUE"
        difference: "Shuttle cost follows revenue: for identical report sets the two variants assign materially different amount_cents to the same agreement."

  - name: true_up_settlement_amount
    trigger: "POST /rac/true-up-settlements/{settlement_id}/issue (both DRAFT -> ISSUED and DISPUTED -> ISSUED)"
    algorithm: constraint_propagation
    formula: |
      # ---- STEP 1 (evaluation order is PINNED; the credit must NOT re-enter the base) ----
      final_percentage_rent_cents = round_half_up(agreement.gross_revenue_ytd_cents
                                                  * agreement.percentage_rent_rate_bps / 10000)
      mag_cents            = agreement.mag_annual_cents
      rent_billed_cents    = agreement.rent_billed_to_date_cents
      audit_assessment_cents = sum of variance_assessment_cents over TransactionDayReport rows
                               with agreement_id == agreement.id AND status == ACCEPTED

      base_true_up_cents = max(mag_cents, final_percentage_rent_cents)
                           - rent_billed_cents
                           + audit_assessment_cents

      # ---- STEP 2 — the credit tier is keyed on base_true_up_cents, NEVER on the net ----
      if base_true_up_cents <= 0:                      credit_bps = 0
      elif base_true_up_cents >= CREDIT_TIER_HIGH_MIN_CENTS: credit_bps = CREDIT_TIER_HIGH_BPS
      elif base_true_up_cents >= CREDIT_TIER_MID_MIN_CENTS:  credit_bps = CREDIT_TIER_MID_BPS
      else:                                            credit_bps = 0
      shuttle_credit_cents = round_half_up(base_true_up_cents * credit_bps / 10000)

      # ---- STEP 3 ----
      net_true_up_cents = base_true_up_cents - shuttle_credit_cents
    input_set: |
      Only ACCEPTED reports of the agreement contribute to audit_assessment_cents;
      SUPERSEDED reports are excluded even though their assessments were once
      real. gross_revenue_ytd_cents and rent_billed_to_date_cents are read from
      the agreement at issue time and frozen onto the settlement row.
    constants:
      CREDIT_TIER_HIGH_MIN_CENTS: 5000000
      CREDIT_TIER_HIGH_BPS: 300
      CREDIT_TIER_MID_MIN_CENTS: 1000000
      CREDIT_TIER_MID_BPS: 150
      BPS_DENOMINATOR: 10000
    precision: |
      Integer cents, round_half_up on the credit multiplication. The dependency
      LOOKS circular (net depends on credit, credit depends on a total that the
      credit reduces); the pinned order resolves it: base first, tier from base,
      net last. Keying the tier on net_true_up_cents is explicitly wrong.
    variants: []

  - name: fleet_stall_overflow_allocation
    trigger: "POST /rac/fleet-allocations (creation)"
    algorithm: waterfall_allocation
    formula: |
      inclusive_days = (date(end_date) - date(start_date)).days + 1     # CLOSED interval

      overlapping_zone = FleetAllocation rows where
                           zone_id == payload.zone_id
                           AND status == ALLOCATED
                           AND payload.start_date <= row.end_date
                           AND row.start_date <= payload.end_date       # closed-interval overlap
      zone_in_use = sum(overlapping_zone.zone_stalls_granted)
      zone_free   = max(0, zone.stall_capacity - zone_in_use)
      zone_stalls_granted = min(payload.stalls_requested, zone_free)

      overflow_need = payload.stalls_requested - zone_stalls_granted
      if overflow_need > 0:
          if payload.allow_overflow != true -> ERR_ZONE_CAPACITY_EXCEEDED (409)
          overlapping_overflow = FleetAllocation rows of ANY zone of this facility where
                                   status == ALLOCATED
                                   AND payload.start_date <= row.end_date
                                   AND row.start_date <= payload.end_date
          overflow_in_use = sum(overlapping_overflow.overflow_stalls_granted)
          overflow_free   = max(0, facility.overflow_lot_stalls - overflow_in_use)
          if overflow_need > overflow_free -> ERR_OVERFLOW_EXHAUSTED (409)
          overflow_stalls_granted = overflow_need
      else:
          overflow_stalls_granted = 0

      overflow_surcharge_cents = overflow_stalls_granted
                                 * facility.overflow_daily_surcharge_cents
                                 * inclusive_days
    input_set: |
      Only FleetAllocation rows in status ALLOCATED occupy stalls; RELEASED rows
      are excluded from both the zone and the overflow sums. Interval overlap is
      evaluated on CLOSED intervals, so two allocations that merely touch on one
      calendar day DO collide.
    constants: {}
    precision: "Integer stalls and integer cents; inclusive_days always adds the +1 of a closed interval."
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in Table 5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request shape: every required input field is present, types match, enum members are legal, integers satisfy their declared range, dates parse as YYYY-MM-DD, and pagination limit is 1..100 with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every resource named in the path exists, validated left-to-right"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_CONCESSIONAIRE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COUNTER_SPACE_NOT_FOUND | ERR_COUNTER_ASSIGNMENT_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_FLEET_ALLOCATION_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_OBLIGATION_NOT_FOUND | ERR_SHUTTLE_PERIOD_NOT_FOUND | ERR_SHUTTLE_ALLOCATION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_CONCESSIONAIRE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COUNTER_SPACE_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "every POST that carries a foreign key"

  - priority: 6
    category: auth
    check: "when the acting role is ConcessionaireOperator, X-User-ID must equal the Concessionaire.id reached from the target resource through its agreement_id -> ConcessionAgreement.concessionaire_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every write endpoint whose roles include ConcessionaireOperator"

  - priority: 7
    category: state
    check: "the target resource is in a from-state that Table 2 declares for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 8
    category: state
    check: "the expected_<parent>_version supplied by the client equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rac/counter-assignments, POST /rac/fleet-allocations, POST /rac/capital-disbursements"

  - priority: 9
    category: business_safety
    check: "segregation of duties on capital draws: X-User-ID must differ from CapitalDisbursement.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rac/capital-disbursements/{disbursement_id}/authorize, POST /rac/capital-disbursements/{disbursement_id}/reject"

  - priority: 10
    category: business_safety
    check: "segregation of duties on true-up: X-User-ID must not equal audited_by_user_id on any ACCEPTED TransactionDayReport of the agreement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rac/true-up-settlements/{settlement_id}/issue"

  - priority: 11
    category: state
    check: "activating a counter assignment requires the referenced ConcessionAgreement.contract_status == ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rac/counter-assignments/{counter_assignment_id}/activate"

  - priority: 12
    category: state
    check: "authorizing a capital draw requires the referenced CapitalProject.status == FUNDED"
    error_id: ERR_PROJECT_NOT_FUNDED
    http_status: 409
    applies_to: "POST /rac/capital-disbursements/{disbursement_id}/authorize"

  - priority: 13
    category: state
    check: "closing or cancelling a capital project requires encumbered_cents == 0"
    error_id: ERR_PROJECT_HAS_ENCUMBRANCE
    http_status: 409
    applies_to: "POST /rac/capital-projects/{project_id}/close, POST /rac/capital-projects/{project_id}/cancel"

  - priority: 14
    category: business_safety
    check: "bond covenant: authorizing a capital draw requires facility.bond_coverage_status == SATISFIED"
    error_id: ERR_BOND_COVENANT_DEFICIENT
    http_status: 409
    applies_to: "POST /rac/capital-disbursements/{disbursement_id}/authorize"

  - priority: 15
    category: business_safety
    check: "predecessor gate: requesting a draw against a project with a non-null predecessor_project_id requires that predecessor's status == CLOSED"
    error_id: ERR_PREDECESSOR_NOT_CLOSED
    http_status: 409
    applies_to: "POST /rac/capital-disbursements"

  - priority: 16
    category: business_temporal
    check: "counter assignment requires effective_start_date < effective_end_date; fleet allocation requires start_date <= end_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /rac/counter-assignments, POST /rac/fleet-allocations"

  - priority: 17
    category: business_temporal
    check: "the requested occupancy interval lies inside the agreement's [term_start_date, term_end_date] closed term"
    error_id: ERR_OUTSIDE_AGREEMENT_TERM
    http_status: 422
    applies_to: "POST /rac/counter-assignments, POST /rac/fleet-allocations"

  - priority: 18
    category: business_constraint
    check: "HALF-OPEN exclusive occupancy on CounterSpace: reject when an existing CounterAssignment on the same counter_space_id with status in {ALLOCATED, ACTIVE} satisfies new.effective_start_date < existing.effective_end_date AND existing.effective_start_date < new.effective_end_date. Touching intervals (new.start == existing.end) do NOT collide."
    error_id: ERR_COUNTER_SPACE_OCCUPIED
    http_status: 409
    applies_to: "POST /rac/counter-assignments"

  - priority: 19
    category: business_constraint
    check: "CLOSED-interval AGGREGATE capacity on FleetParkingZone: overlap holds when new.start_date <= existing.end_date AND existing.start_date <= new.end_date (touching intervals DO collide); reject when the unmet demand cannot spill because allow_overflow is not true"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rac/fleet-allocations"

  - priority: 20
    category: business_constraint
    check: "overflow spill exceeds facility.overflow_lot_stalls minus the overflow stalls already granted on overlapping ALLOCATED rows"
    error_id: ERR_OVERFLOW_EXHAUSTED
    http_status: 409
    applies_to: "POST /rac/fleet-allocations"

  - priority: 21
    category: business_constraint
    check: "an agreement may hold at most one TransactionDayReport per period_year + period_month in status DRAFT, SUBMITTED, UNDER_AUDIT or REJECTED; an ACCEPTED report may be amended by a new report for the same period, which supersedes it on acceptance"
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /rac/transaction-day-reports"

  - priority: 22
    category: business_constraint
    check: "brand_code is unique within a facility"
    error_id: ERR_DUPLICATE_BRAND_CODE
    http_status: 409
    applies_to: "POST /rac/concessionaires"

  - priority: 23
    category: business_constraint
    check: "space_label is unique within a facility"
    error_id: ERR_DUPLICATE_SPACE_LABEL
    http_status: 409
    applies_to: "POST /rac/counter-spaces"

  - priority: 24
    category: business_constraint
    check: "at most one CfcRemittance per report_id + remittance_basis in a status other than RECONCILED"
    error_id: ERR_DUPLICATE_REMITTANCE
    http_status: 409
    applies_to: "POST /rac/cfc-remittances"

  - priority: 25
    category: business_constraint
    check: "at most one TrueUpSettlement per agreement_id + contract_year_index in status in {DRAFT, ISSUED, DISPUTED}"
    error_id: ERR_DUPLICATE_SETTLEMENT
    http_status: 409
    applies_to: "POST /rac/true-up-settlements"

  - priority: 26
    category: business_referential
    check: "the report named by report_id must have agreement_id equal to the agreement_id in the same request body"
    error_id: ERR_REPORT_AGREEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /rac/cfc-remittances"

  - priority: 27
    category: business_referential
    check: "remittance_basis PROVISIONAL requires report.status in {SUBMITTED, UNDER_AUDIT}; remittance_basis FINAL requires report.status == ACCEPTED"
    error_id: ERR_REMITTANCE_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /rac/cfc-remittances"

  - priority: 28
    category: business_referential
    check: "contract_year_index in the body must equal the referenced agreement's contract_year_index"
    error_id: ERR_CONTRACT_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /rac/true-up-settlements"

  - priority: 29
    category: business_referential
    check: "every TransactionDayReport of the agreement must be in status ACCEPTED or SUPERSEDED before a settlement may be issued"
    error_id: ERR_REPORTS_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /rac/true-up-settlements/{settlement_id}/issue"

  - priority: 30
    category: business_referential
    check: "the shuttle allocation candidate set is non-empty and total_basis_value > 0"
    error_id: ERR_NO_ALLOCATION_BASIS
    http_status: 422
    applies_to: "POST /rac/shuttle-cost-periods/{shuttle_period_id}/allocate"

  - priority: 31
    category: business_fiscal
    check: "(trust_debt_service_reserve_cents + trust_unallocated_cents) * 10000 >= coverage_requirement_bps * amount_due_cents"
    error_id: ERR_COVERAGE_BELOW_REQUIREMENT
    http_status: 409
    applies_to: "POST /rac/debt-service-obligations/{obligation_id}/fund"

  - priority: 32
    category: business_fiscal
    check: "project.disbursed_cents + project.encumbered_cents + amount_cents <= project.budget_cents"
    error_id: ERR_PROJECT_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /rac/capital-disbursements/{disbursement_id}/authorize"

  - priority: 33
    category: business_fiscal
    check: "facility.trust_capital_fund_cents >= amount_cents"
    error_id: ERR_CAPITAL_FUND_INSUFFICIENT
    http_status: 409
    applies_to: "POST /rac/capital-disbursements/{disbursement_id}/authorize"

  - priority: 34
    category: business_fiscal
    check: "amount_paid_cents >= net_true_up_cents"
    error_id: ERR_SETTLEMENT_UNDERPAID
    http_status: 422
    applies_to: "POST /rac/true-up-settlements/{settlement_id}/settle"

# =============================================================================
# Table 5: API Endpoint Table  (all paths sit flat under /rac)
# =============================================================================
endpoints:

  # --- Facility -------------------------------------------------------------
  - method: POST
    path: "/rac/facilities"
    description: "Register a consolidated rental car facility with its CFC rate, reserve requirements and overflow lot"
    roles: [FacilityAdmin]
    code: 201
    input: [code, name, cfc_rate_per_transaction_day_cents, ds_reserve_requirement_cents, om_reserve_requirement_cents, capital_fund_cap_cents, overflow_lot_stalls, "overflow_daily_surcharge_cents?", "remittance_grace_days?"]
    output: Facility
    side_effects:
      - "every trust_* bucket initialises to 0 and trust_lifetime_received_cents = 0"
      - "bond_coverage_status = DEFICIENT whenever ds_reserve_requirement_cents > 0, else SATISFIED"
      - "overflow_stalls_allocated = 0; overflow_stalls_available = overflow_lot_stalls"
      - "funded_obligation_count = 0; current_utc = the logical clock reading"

  - method: GET
    path: "/rac/facilities/{facility_id}"
    description: "Read one facility including the seven CFC trust buckets, the covenant posture and the logical clock"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # --- Concessionaire -------------------------------------------------------
  - method: POST
    path: "/rac/concessionaires"
    description: "Register a rental car brand operating in the ConRAC; the created id is the X-User-ID a ConcessionaireOperator acts as"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, legal_name, brand_code, contact_email]
    output: Concessionaire
    side_effects: ["agreement_count = 0"]

  - method: GET
    path: "/rac/concessionaires/{concessionaire_id}"
    description: "Read one concessionaire"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: Concessionaire
    side_effects: []

  - method: GET
    path: "/rac/concessionaires"
    description: "List concessionaires, optionally filtered by facility"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: Concessionaire[]
    side_effects: []

  # --- ConcessionAgreement --------------------------------------------------
  - method: POST
    path: "/rac/concession-agreements"
    description: "Draft a concession agreement carrying the minimum annual guarantee, the percentage rent rate and the rent settlement basis"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, concessionaire_id, contract_year_index, term_start_date, term_end_date, mag_annual_cents, percentage_rent_rate_bps, rent_settlement_basis]
    output: ConcessionAgreement
    side_effects:
      - "contract_status = DRAFT; compliance_status = COMPLIANT"
      - "every ledger field (gross_revenue_ytd_cents, transaction_days_ytd, accepted_report_count, percentage_rent_accrued_cents, rent_billed_to_date_cents, last_installment_cents, mag_shortfall_cents, counter_units_assigned, fleet_stalls_allocated) initialises to 0 and rent_tier = MAG_FLOOR"
      - "Concessionaire.agreement_count increments by 1"

  - method: GET
    path: "/rac/concession-agreements/{agreement_id}"
    description: "Read one concession agreement with both status axes and the full rent ledger"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects: []

  - method: GET
    path: "/rac/concession-agreements"
    description: "List concession agreements filtered by facility, concessionaire or either status axis"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "concessionaire_id?", "contract_status?", "compliance_status?", "limit?", "offset?"]
    output: ConcessionAgreement[]
    side_effects: []

  - method: POST
    path: "/rac/concession-agreements/{agreement_id}/execute"
    description: "Execute a drafted agreement: contract_status DRAFT -> ACTIVE"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects: ["contract_status = ACTIVE", "compliance_status is untouched", "increments ConcessionAgreement.version by 1"]

  - method: POST
    path: "/rac/concession-agreements/{agreement_id}/suspend"
    description: "Suspend an active agreement: contract_status ACTIVE -> SUSPENDED"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects:
      - "every ACTIVE CounterAssignment of this agreement falls back to ALLOCATED and its CounterSpace.active_assignment_id is cleared"
      - "increments ConcessionAgreement.version by 1"

  - method: POST
    path: "/rac/concession-agreements/{agreement_id}/reinstate"
    description: "Reinstate a suspended agreement: contract_status SUSPENDED -> ACTIVE, closing the suspend/reinstate loop"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects: ["contract_status = ACTIVE", "increments ConcessionAgreement.version by 1"]

  # --- CounterSpace ---------------------------------------------------------
  - method: POST
    path: "/rac/counter-spaces"
    description: "Create a rental counter or ready/return space in the facility inventory"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, terminal_code, space_label, space_class]
    output: CounterSpace
    side_effects: ["active_assignment_id = null; assignment_count = 0"]

  - method: GET
    path: "/rac/counter-spaces/{counter_space_id}"
    description: "Read one counter or ready/return space"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: CounterSpace
    side_effects: []

  - method: GET
    path: "/rac/counter-spaces"
    description: "List counter/ready-return spaces filtered by facility or space class"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "space_class?", "limit?", "offset?"]
    output: CounterSpace[]
    side_effects: []

  # --- CounterAssignment ----------------------------------------------------
  - method: POST
    path: "/rac/counter-assignments"
    description: "Assign a counter/ready-return space to an agreement over a HALF-OPEN [start, end) interval; guarded by optimistic concurrency on the agreement's version"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 201
    input: [agreement_id, counter_space_id, effective_start_date, effective_end_date, expected_agreement_version]
    output: CounterAssignment
    side_effects:
      - "status = ALLOCATED"
      - "CounterSpace.assignment_count increments by 1"
      - "ConcessionAgreement.counter_units_assigned increments by 1"
      - "increments ConcessionAgreement.version by 1"
      - "increments CounterSpace.version by 1"

  - method: GET
    path: "/rac/counter-assignments/{counter_assignment_id}"
    description: "Read one counter assignment"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: CounterAssignment
    side_effects: []

  - method: GET
    path: "/rac/counter-assignments"
    description: "List counter assignments filtered by agreement, space or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "counter_space_id?", "status?", "limit?", "offset?"]
    output: CounterAssignment[]
    side_effects: []

  - method: POST
    path: "/rac/counter-assignments/{counter_assignment_id}/activate"
    description: "Occupy the space: ALLOCATED -> ACTIVE, only while the agreement's contract_status is ACTIVE"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 200
    input: []
    output: CounterAssignment
    side_effects: ["CounterSpace.active_assignment_id = this id", "increments CounterAssignment.version by 1 and CounterSpace.version by 1"]

  - method: POST
    path: "/rac/counter-assignments/{counter_assignment_id}/release"
    description: "Vacate the space: ALLOCATED or ACTIVE -> RELEASED"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 200
    input: []
    output: CounterAssignment
    side_effects:
      - "CounterSpace.assignment_count decrements by 1 and active_assignment_id is cleared when it pointed here"
      - "ConcessionAgreement.counter_units_assigned decrements by 1"
      - "released_on_date = the logical clock's calendar date"
      - "increments CounterAssignment.version by 1 and CounterSpace.version by 1"

  # --- FleetParkingZone -----------------------------------------------------
  - method: POST
    path: "/rac/fleet-parking-zones"
    description: "Create a fleet parking zone with a fixed stall capacity"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, zone_label, stall_capacity]
    output: FleetParkingZone
    side_effects: ["stalls_allocated = 0; stalls_available = stall_capacity"]

  - method: GET
    path: "/rac/fleet-parking-zones/{zone_id}"
    description: "Read one fleet parking zone with its live stall counters"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: FleetParkingZone
    side_effects: []

  - method: GET
    path: "/rac/fleet-parking-zones"
    description: "List fleet parking zones filtered by facility"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: FleetParkingZone[]
    side_effects: []

  # --- FleetAllocation ------------------------------------------------------
  - method: POST
    path: "/rac/fleet-allocations"
    description: "Allocate fleet parking stalls over a CLOSED [start, end] interval with optional overflow-lot spill; guarded by optimistic concurrency on the zone's version"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 201
    input: [agreement_id, zone_id, start_date, end_date, stalls_requested, "allow_overflow?", expected_zone_version]
    output: FleetAllocation
    side_effects:
      - "calculations.fleet_stall_overflow_allocation writes zone_stalls_granted, overflow_stalls_granted, inclusive_days and overflow_surcharge_cents"
      - "FleetParkingZone.stalls_allocated += zone_stalls_granted and stalls_available is recomputed"
      - "Facility.overflow_stalls_allocated += overflow_stalls_granted and overflow_stalls_available is recomputed"
      - "ConcessionAgreement.fleet_stalls_allocated += zone_stalls_granted + overflow_stalls_granted"
      - "increments FleetParkingZone.version by 1"
      - "increments Facility.version by 1 and ConcessionAgreement.version by 1"

  - method: GET
    path: "/rac/fleet-allocations/{fleet_allocation_id}"
    description: "Read one fleet allocation with its zone/overflow split and surcharge"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: FleetAllocation
    side_effects: []

  - method: GET
    path: "/rac/fleet-allocations"
    description: "List fleet allocations filtered by agreement, zone or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: FleetAllocation[]
    side_effects: []

  - method: POST
    path: "/rac/fleet-allocations/{fleet_allocation_id}/release"
    description: "Release the allocation: ALLOCATED -> RELEASED, returning both zone stalls and overflow stalls"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 200
    input: []
    output: FleetAllocation
    side_effects:
      - "FleetParkingZone.stalls_allocated -= zone_stalls_granted"
      - "Facility.overflow_stalls_allocated -= overflow_stalls_granted"
      - "ConcessionAgreement.fleet_stalls_allocated -= zone_stalls_granted + overflow_stalls_granted"
      - "increments FleetAllocation.version, FleetParkingZone.version and Facility.version by 1 each"

  # --- TransactionDayReport -------------------------------------------------
  - method: POST
    path: "/rac/transaction-day-reports"
    description: "Draft a monthly transaction-day and gross-revenue report for an agreement"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 201
    input: [agreement_id, period_year, period_month, reported_gross_revenue_cents, reported_on_airport_transaction_days]
    output: TransactionDayReport
    side_effects: ["status = DRAFT; submission_count = 0; audited fields are null; variance_assessment_cents = 0"]

  - method: GET
    path: "/rac/transaction-day-reports/{report_id}"
    description: "Read one transaction-day report with its audited figures and variance assessment"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: TransactionDayReport
    side_effects: []

  - method: GET
    path: "/rac/transaction-day-reports"
    description: "List transaction-day reports filtered by agreement, status or reporting period"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "period_year?", "period_month?", "limit?", "offset?"]
    output: TransactionDayReport[]
    side_effects: []

  - method: POST
    path: "/rac/transaction-day-reports/{report_id}/submit"
    description: "Submit the report for audit: DRAFT -> SUBMITTED"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 200
    input: []
    output: TransactionDayReport
    side_effects: ["submission_count increments by 1", "increments TransactionDayReport.version by 1"]

  - method: POST
    path: "/rac/transaction-day-reports/{report_id}/begin-audit"
    description: "Open the audit: SUBMITTED -> UNDER_AUDIT"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: TransactionDayReport
    side_effects: ["increments TransactionDayReport.version by 1"]

  - method: POST
    path: "/rac/transaction-day-reports/{report_id}/accept"
    description: "Accept audited figures: UNDER_AUDIT -> ACCEPTED, driving the three-hop rent-ledger cascade"
    roles: [AuditOfficer]
    code: 200
    input: [audited_gross_revenue_cents, audited_on_airport_transaction_days]
    output: TransactionDayReport
    side_effects:
      - "hop 1: audited figures, revenue_variance_cents, variance_assessment_cents and audited_by_user_id are written"
      - "hop 2: the agreement's year-to-date accumulators advance and calculations.percentage_rent_accrual writes the installment and rent_tier"
      - "hop 3: because rent_tier flipped MAG_FLOOR -> PERCENTAGE, DRAFT TrueUpSettlement rows of the agreement move to SUPERSEDED"
      - "compliance_status moves to COVENANT_BREACH when variance_assessment_cents > 0"
      - "increments TransactionDayReport.version by 1 and ConcessionAgreement.version by 1"

  - method: POST
    path: "/rac/transaction-day-reports/{report_id}/reject"
    description: "Reject the report: UNDER_AUDIT -> REJECTED"
    roles: [AuditOfficer]
    code: 200
    input: [rejection_reason]
    output: TransactionDayReport
    side_effects: ["rejection_reason is stored", "increments TransactionDayReport.version by 1"]

  - method: POST
    path: "/rac/transaction-day-reports/{report_id}/reopen"
    description: "Reopen a rejected report for revision: REJECTED -> DRAFT, closing the revision cycle"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 200
    input: []
    output: TransactionDayReport
    side_effects: ["rejection_reason is cleared to null", "increments TransactionDayReport.version by 1"]

  # --- CfcRemittance --------------------------------------------------------
  - method: POST
    path: "/rac/cfc-remittances"
    description: "Raise a Customer Facility Charge remittance for a reporting period on either the PROVISIONAL or the FINAL transaction-day basis"
    roles: [ConcessionaireOperator, FacilityAdmin]
    code: 201
    input: [agreement_id, report_id, remittance_basis]
    output: CfcRemittance
    side_effects:
      - "calculations.cfc_remittance_expected_amount writes expected_amount_cents, shortfall_cents and due_date"
      - "status = PENDING; amount_received_cents = 0; every allocated_to_* field = 0"

  - method: GET
    path: "/rac/cfc-remittances/{remittance_id}"
    description: "Read one CFC remittance with its waterfall split"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: CfcRemittance
    side_effects: []

  - method: GET
    path: "/rac/cfc-remittances"
    description: "List CFC remittances filtered by agreement, report or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "report_id?", "status?", "limit?", "offset?"]
    output: CfcRemittance[]
    side_effects: []

  - method: POST
    path: "/rac/cfc-remittances/{remittance_id}/receive"
    description: "Record CFC cash into the trust, driving the five-hop waterfall / covenant / auto-funding / project-release cascade"
    roles: [FinanceOfficer]
    code: 200
    input: [amount_received_cents]
    output: CfcRemittance
    side_effects:
      - "hop 1: amount_received_cents accumulates and shortfall_cents is recomputed; status becomes RECEIVED or RECONCILED"
      - "hop 2: calculations.cfc_trust_waterfall splits the new delta across the debt-service, O&M, capital and residue buckets"
      - "hop 3: facility.bond_coverage_status is recomputed from the moved buckets"
      - "hop 4: when coverage is SATISFIED, calculations.debt_service_coverage_test auto-funds at most one SCHEDULED obligation"
      - "hop 5: because funded_obligation_count advanced, APPROVED CapitalProject rows on funding_hold are released to FUNDED"
      - "agreement.compliance_status returns DELINQUENT -> COMPLIANT when no delinquent remittance remains"
      - "increments CfcRemittance.version by 1 and Facility.version by 1"

  # --- DebtServiceObligation ------------------------------------------------
  - method: POST
    path: "/rac/debt-service-obligations"
    description: "Schedule a bond debt-service payment to be funded from the CFC trust"
    roles: [FacilityAdmin, FinanceOfficer]
    code: 201
    input: [facility_id, series_label, due_date, amount_due_cents, "coverage_requirement_bps?"]
    output: DebtServiceObligation
    side_effects: ["status = SCHEDULED; auto_funded = false; funded_from_reserve_cents = 0; coverage_requirement_bps defaults to 12500"]

  - method: GET
    path: "/rac/debt-service-obligations/{obligation_id}"
    description: "Read one debt-service obligation"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: DebtServiceObligation
    side_effects: []

  - method: GET
    path: "/rac/debt-service-obligations"
    description: "List debt-service obligations filtered by facility or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: DebtServiceObligation[]
    side_effects: []

  - method: POST
    path: "/rac/debt-service-obligations/{obligation_id}/fund"
    description: "Explicitly fund a scheduled obligation once the coverage test passes: SCHEDULED -> FUNDED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: DebtServiceObligation
    side_effects:
      - "trust_debt_service_reserve_cents -= amount_due_cents; trust_debt_service_funded_cents += amount_due_cents"
      - "facility.funded_obligation_count increments by 1 and APPROVED CapitalProject rows on funding_hold are released to FUNDED"
      - "coverage_ratio_at_funding is recorded; auto_funded stays false"
      - "increments DebtServiceObligation.version by 1 and Facility.version by 1"

  - method: POST
    path: "/rac/debt-service-obligations/{obligation_id}/pay"
    description: "Pay a funded obligation out of the trust: FUNDED -> PAID"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: DebtServiceObligation
    side_effects:
      - "trust_debt_service_funded_cents -= amount_due_cents; trust_disbursed_cents += amount_due_cents"
      - "facility.bond_coverage_status is recomputed and may fall back to DEFICIENT"
      - "increments DebtServiceObligation.version by 1 and Facility.version by 1"

  # --- ShuttleCostPeriod / ShuttleCostAllocation ----------------------------
  - method: POST
    path: "/rac/shuttle-cost-periods"
    description: "Open a monthly shuttle bus operating cost pool on a chosen allocation basis"
    roles: [FacilityAdmin, FinanceOfficer]
    code: 201
    input: [facility_id, period_year, period_month, total_cost_cents, allocation_basis]
    output: ShuttleCostPeriod
    side_effects: ["status = OPEN; total_basis_value = 0; allocated_total_cents = 0; line_count = 0"]

  - method: GET
    path: "/rac/shuttle-cost-periods/{shuttle_period_id}"
    description: "Read one shuttle cost period"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: ShuttleCostPeriod
    side_effects: []

  - method: GET
    path: "/rac/shuttle-cost-periods"
    description: "List shuttle cost periods filtered by facility or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: ShuttleCostPeriod[]
    side_effects: []

  - method: POST
    path: "/rac/shuttle-cost-periods/{shuttle_period_id}/allocate"
    description: "Allocate the shuttle cost pool across eligible agreements by largest remainder: OPEN -> ALLOCATED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ShuttleCostPeriod
    side_effects:
      - "calculations.shuttle_cost_allocation creates one immutable ShuttleCostAllocation per eligible agreement"
      - "total_basis_value, allocated_total_cents and line_count are written; allocated_total_cents == total_cost_cents exactly"
      - "increments ShuttleCostPeriod.version by 1"

  - method: GET
    path: "/rac/shuttle-cost-allocations/{shuttle_allocation_id}"
    description: "Read one immutable shuttle cost allocation line"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: ShuttleCostAllocation
    side_effects: []

  - method: GET
    path: "/rac/shuttle-cost-allocations"
    description: "List shuttle cost allocation lines filtered by period or agreement; the only discovery channel for these cascade-created rows"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["shuttle_period_id?", "agreement_id?", "limit?", "offset?"]
    output: ShuttleCostAllocation[]
    side_effects: []

  # --- CapitalProject -------------------------------------------------------
  - method: POST
    path: "/rac/capital-projects"
    description: "Propose a capital project funded from the CFC capital bucket, optionally gated behind a predecessor project"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, project_name, budget_cents, "predecessor_project_id?"]
    output: CapitalProject
    side_effects: ["status = PROPOSED; funding_hold = true; disbursed_cents = encumbered_cents = draw_request_count = rejected_draw_count = 0"]

  - method: GET
    path: "/rac/capital-projects/{project_id}"
    description: "Read one capital project"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: GET
    path: "/rac/capital-projects"
    description: "List capital projects filtered by facility, predecessor or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["facility_id?", "predecessor_project_id?", "status?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []

  - method: POST
    path: "/rac/capital-projects/{project_id}/approve"
    description: "Approve a proposed project: PROPOSED -> APPROVED, continuing straight to FUNDED when the covenant and predecessor gates are already clear"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: CapitalProject
    side_effects:
      - "funding_hold is set from facility.funded_obligation_count >= 1, facility.bond_coverage_status == SATISFIED and the predecessor gate"
      - "when funding_hold became false the project continues APPROVED -> FUNDED inside the same request"
      - "increments CapitalProject.version by 1"

  - method: POST
    path: "/rac/capital-projects/{project_id}/close"
    description: "Close a funded project with no outstanding encumbrance: FUNDED -> CLOSED, releasing any successor projects waiting on this predecessor"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: CapitalProject
    side_effects:
      - "successor projects whose predecessor_project_id equals this id and that sit APPROVED with funding_hold are released to FUNDED, ordered by created_at ASC"
      - "increments CapitalProject.version by 1"

  - method: POST
    path: "/rac/capital-projects/{project_id}/cancel"
    description: "Cancel a project from PROPOSED, APPROVED or FUNDED when nothing is encumbered"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status = CANCELLED", "increments CapitalProject.version by 1"]

  # --- CapitalDisbursement --------------------------------------------------
  - method: POST
    path: "/rac/capital-disbursements"
    description: "Request a capital draw against a project; guarded by optimistic concurrency on the project's version and by the predecessor gate"
    roles: [FinanceOfficer, FacilityAdmin]
    code: 201
    input: [project_id, amount_cents, "memo?", expected_project_version]
    output: CapitalDisbursement
    side_effects:
      - "status = REQUESTED; requested_by_user_id = X-User-ID; authorized_by_user_id = null"
      - "CapitalProject.draw_request_count increments by 1"
      - "increments CapitalProject.version by 1"

  - method: GET
    path: "/rac/capital-disbursements/{disbursement_id}"
    description: "Read one capital draw"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: CapitalDisbursement
    side_effects: []

  - method: GET
    path: "/rac/capital-disbursements"
    description: "List capital draws filtered by project or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: CapitalDisbursement[]
    side_effects: []

  - method: POST
    path: "/rac/capital-disbursements/{disbursement_id}/authorize"
    description: "Authorize a draw: REQUESTED -> AUTHORIZED; the requester may not authorize their own draw"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CapitalDisbursement
    side_effects:
      - "authorized_by_user_id = X-User-ID"
      - "facility.trust_capital_fund_cents -= amount_cents; facility.trust_encumbered_cents += amount_cents"
      - "project.encumbered_cents += amount_cents"
      - "increments CapitalDisbursement.version, CapitalProject.version and Facility.version by 1 each"

  - method: POST
    path: "/rac/capital-disbursements/{disbursement_id}/reject"
    description: "Reject a draw: REQUESTED -> REJECTED; the money-free branch of the fork"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CapitalDisbursement
    side_effects:
      - "project.rejected_draw_count increments by 1"
      - "no facility.trust_* bucket moves"
      - "increments CapitalDisbursement.version and CapitalProject.version by 1 each"

  - method: POST
    path: "/rac/capital-disbursements/{disbursement_id}/pay"
    description: "Pay an authorized draw out of the trust: AUTHORIZED -> PAID"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CapitalDisbursement
    side_effects:
      - "facility.trust_encumbered_cents -= amount_cents; facility.trust_disbursed_cents += amount_cents"
      - "project.encumbered_cents -= amount_cents; project.disbursed_cents += amount_cents"
      - "increments CapitalDisbursement.version, CapitalProject.version and Facility.version by 1 each"

  - method: POST
    path: "/rac/capital-disbursements/{disbursement_id}/void"
    description: "Void an authorized draw: AUTHORIZED -> VOIDED, returning the encumbrance to the capital bucket"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CapitalDisbursement
    side_effects:
      - "facility.trust_encumbered_cents -= amount_cents; facility.trust_capital_fund_cents += amount_cents"
      - "project.encumbered_cents -= amount_cents"
      - "increments CapitalDisbursement.version, CapitalProject.version and Facility.version by 1 each"

  # --- TrueUpSettlement -----------------------------------------------------
  - method: POST
    path: "/rac/true-up-settlements"
    description: "Draft a minimum-guarantee true-up settlement for a contract year"
    roles: [AuditOfficer, FacilityAdmin]
    code: 201
    input: [agreement_id, contract_year_index]
    output: TrueUpSettlement
    side_effects: ["status = DRAFT; every computed money field starts at 0"]

  - method: GET
    path: "/rac/true-up-settlements/{settlement_id}"
    description: "Read one true-up settlement with the frozen base / credit / net figures"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: []
    output: TrueUpSettlement
    side_effects: []

  - method: GET
    path: "/rac/true-up-settlements"
    description: "List true-up settlements filtered by agreement or status"
    roles: [FacilityAdmin, ConcessionaireOperator, AuditOfficer, FinanceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: TrueUpSettlement[]
    side_effects: []

  - method: POST
    path: "/rac/true-up-settlements/{settlement_id}/issue"
    description: "Issue the settlement from DRAFT or DISPUTED, freezing the true-up computation; the officer who audited the year's reports may not issue it"
    roles: [AuditOfficer]
    code: 200
    input: []
    output: TrueUpSettlement
    side_effects:
      - "calculations.true_up_settlement_amount freezes final_percentage_rent_cents, mag_cents, rent_billed_cents, audit_assessment_cents, base_true_up_cents, credit_bps, shuttle_credit_cents and net_true_up_cents"
      - "issued_by_user_id = X-User-ID"
      - "increments TrueUpSettlement.version by 1"

  - method: POST
    path: "/rac/true-up-settlements/{settlement_id}/dispute"
    description: "Dispute an issued settlement: ISSUED -> DISPUTED, reopening the negotiation loop"
    roles: [ConcessionaireOperator]
    code: 200
    input: []
    output: TrueUpSettlement
    side_effects: ["increments TrueUpSettlement.version by 1"]

  - method: POST
    path: "/rac/true-up-settlements/{settlement_id}/settle"
    description: "Settle an issued true-up: ISSUED -> SETTLED once the payment covers net_true_up_cents"
    roles: [FinanceOfficer]
    code: 200
    input: [amount_paid_cents]
    output: TrueUpSettlement
    side_effects:
      - "amount_paid_cents is recorded"
      - "agreement.compliance_status returns COVENANT_BREACH -> COMPLIANT"
      - "increments TrueUpSettlement.version by 1 and ConcessionAgreement.version by 1"

  # --- Logical clock (test-driving endpoint) --------------------------------
  - method: POST
    path: "/rac/_clock/set_current_utc"
    description: "Move the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock past a PENDING remittance's due_date marks it DELINQUENT, past a SCHEDULED obligation's due_date marks it DEFERRED, and past an agreement's term_end_date expires or terminates it."
    roles: [FacilityAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, delinquent_remittance_count: integer, deferred_obligation_count: integer, expired_agreement_count: integer }
    side_effects:
      - "PENDING CfcRemittance rows past due_date move to DELINQUENT and their agreements move COMPLIANT -> DELINQUENT"
      - "SCHEDULED DebtServiceObligation rows past due_date move to DEFERRED"
      - "ACTIVE agreements past term_end_date move to EXPIRED; SUSPENDED agreements past term_end_date move to TERMINATED"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # -- authentication / authorization ---------------------------------------
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of FacilityAdmin / ConcessionaireOperator / AuditOfficer / FinanceOfficer" }
  - { id: ERR_ROLE_NOT_PERMITTED,     http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "a ConcessionaireOperator acts on a resource whose agreement belongs to a different Concessionaire than X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES,  http: 403, condition: "the acting X-User-ID requested the capital draw it is now authorizing/rejecting, or audited a report of the contract year whose true-up it is now issuing" }

  # -- request shape ---------------------------------------------------------
  - { id: ERR_INVALID_REQUEST,        http: 400, condition: "missing required field, wrong type, illegal enum member, out-of-range integer, unparsable YYYY-MM-DD date, or pagination limit outside 1..100 / negative offset" }

  # -- existence -------------------------------------------------------------
  - { id: ERR_FACILITY_NOT_FOUND,           http: 404, condition: "facility_id in path or body matches no Facility" }
  - { id: ERR_CONCESSIONAIRE_NOT_FOUND,     http: 404, condition: "concessionaire_id in path or body matches no Concessionaire" }
  - { id: ERR_AGREEMENT_NOT_FOUND,          http: 404, condition: "agreement_id in path or body matches no ConcessionAgreement" }
  - { id: ERR_COUNTER_SPACE_NOT_FOUND,      http: 404, condition: "counter_space_id in path or body matches no CounterSpace" }
  - { id: ERR_COUNTER_ASSIGNMENT_NOT_FOUND, http: 404, condition: "counter_assignment_id in path matches no CounterAssignment" }
  - { id: ERR_ZONE_NOT_FOUND,               http: 404, condition: "zone_id in path or body matches no FleetParkingZone" }
  - { id: ERR_FLEET_ALLOCATION_NOT_FOUND,   http: 404, condition: "fleet_allocation_id in path matches no FleetAllocation" }
  - { id: ERR_REPORT_NOT_FOUND,             http: 404, condition: "report_id in path or body matches no TransactionDayReport" }
  - { id: ERR_REMITTANCE_NOT_FOUND,         http: 404, condition: "remittance_id in path matches no CfcRemittance" }
  - { id: ERR_OBLIGATION_NOT_FOUND,         http: 404, condition: "obligation_id in path matches no DebtServiceObligation" }
  - { id: ERR_SHUTTLE_PERIOD_NOT_FOUND,     http: 404, condition: "shuttle_period_id in path matches no ShuttleCostPeriod" }
  - { id: ERR_SHUTTLE_ALLOCATION_NOT_FOUND, http: 404, condition: "shuttle_allocation_id in path matches no ShuttleCostAllocation" }
  - { id: ERR_PROJECT_NOT_FOUND,            http: 404, condition: "project_id or predecessor_project_id matches no CapitalProject" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND,       http: 404, condition: "disbursement_id in path matches no CapitalDisbursement" }
  - { id: ERR_SETTLEMENT_NOT_FOUND,         http: 404, condition: "settlement_id in path matches no TrueUpSettlement" }

  # -- state / concurrency ---------------------------------------------------
  - { id: ERR_INVALID_STATE,          http: 409, condition: "the target resource is not in a from-state Table 2 declares for the requested transition" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "expected_agreement_version / expected_zone_version / expected_project_version does not equal the parent's current version" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE,   http: 409, condition: "activating a counter assignment whose ConcessionAgreement.contract_status is not ACTIVE" }
  - { id: ERR_PROJECT_NOT_FUNDED,     http: 409, condition: "authorizing a capital draw whose CapitalProject.status is not FUNDED" }
  - { id: ERR_PROJECT_HAS_ENCUMBRANCE,http: 409, condition: "closing or cancelling a CapitalProject whose encumbered_cents > 0" }

  # -- safety / covenant / compliance ---------------------------------------
  - { id: ERR_BOND_COVENANT_DEFICIENT, http: 409, condition: "authorizing a capital draw while facility.bond_coverage_status == DEFICIENT" }
  - { id: ERR_PREDECESSOR_NOT_CLOSED,  http: 409, condition: "requesting a draw against a project whose predecessor_project_id points at a project not in CLOSED" }

  # -- temporal --------------------------------------------------------------
  - { id: ERR_INVALID_DATE_RANGE,      http: 422, condition: "effective_start_date >= effective_end_date on a counter assignment, or start_date > end_date on a fleet allocation" }
  - { id: ERR_OUTSIDE_AGREEMENT_TERM,  http: 422, condition: "the requested occupancy interval falls outside the agreement's [term_start_date, term_end_date] closed term" }

  # -- capacity / uniqueness constraints ------------------------------------
  - { id: ERR_COUNTER_SPACE_OCCUPIED,  http: 409, condition: "the HALF-OPEN [start, end) interval overlaps an existing ALLOCATED/ACTIVE CounterAssignment on the same CounterSpace; touching intervals do not collide" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED,  http: 409, condition: "the CLOSED [start, end] interval's aggregate stall demand exceeds the zone's free stalls and allow_overflow is not true; touching intervals do collide" }
  - { id: ERR_OVERFLOW_EXHAUSTED,      http: 409, condition: "spill demand exceeds facility.overflow_lot_stalls minus the overflow stalls held by overlapping ALLOCATED rows" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "the agreement already holds a TransactionDayReport for that period_year + period_month in status DRAFT, SUBMITTED, UNDER_AUDIT or REJECTED (an ACCEPTED report may be amended)" }
  - { id: ERR_DUPLICATE_BRAND_CODE,    http: 409, condition: "brand_code already used by another Concessionaire at that facility" }
  - { id: ERR_DUPLICATE_SPACE_LABEL,   http: 409, condition: "space_label already used by another CounterSpace at that facility" }
  - { id: ERR_DUPLICATE_REMITTANCE,    http: 409, condition: "a non-RECONCILED CfcRemittance already exists for that report_id + remittance_basis" }
  - { id: ERR_DUPLICATE_SETTLEMENT,    http: 409, condition: "a TrueUpSettlement in DRAFT, ISSUED or DISPUTED already exists for that agreement_id + contract_year_index" }

  # -- referential -----------------------------------------------------------
  - { id: ERR_REPORT_AGREEMENT_MISMATCH, http: 422, condition: "the report named by report_id belongs to a different agreement than agreement_id in the same body" }
  - { id: ERR_REMITTANCE_BASIS_MISMATCH, http: 422, condition: "PROVISIONAL requested while the report is not SUBMITTED/UNDER_AUDIT, or FINAL requested while the report is not ACCEPTED" }
  - { id: ERR_CONTRACT_YEAR_MISMATCH,    http: 422, condition: "contract_year_index in the body differs from the referenced agreement's contract_year_index" }
  - { id: ERR_REPORTS_NOT_FINALIZED,     http: 409, condition: "issuing a true-up while some TransactionDayReport of the agreement is still DRAFT, SUBMITTED, UNDER_AUDIT or REJECTED" }
  - { id: ERR_NO_ALLOCATION_BASIS,       http: 422, condition: "allocating a shuttle cost period whose eligible agreement set is empty or whose total_basis_value is 0" }

  # -- fiscal ----------------------------------------------------------------
  - { id: ERR_COVERAGE_BELOW_REQUIREMENT, http: 409, condition: "(trust_debt_service_reserve_cents + trust_unallocated_cents) * 10000 < coverage_requirement_bps * amount_due_cents at funding time" }
  - { id: ERR_PROJECT_BUDGET_EXCEEDED,    http: 409, condition: "project.disbursed_cents + project.encumbered_cents + amount_cents > project.budget_cents at authorization time" }
  - { id: ERR_CAPITAL_FUND_INSUFFICIENT,  http: 409, condition: "facility.trust_capital_fund_cents < amount_cents at authorization time" }
  - { id: ERR_SETTLEMENT_UNDERPAID,       http: 422, condition: "amount_paid_cents < net_true_up_cents at settlement time" }

# =============================================================================
# Table 7: RBAC Matrix  (segregation of duties)
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Airport authority property manager: builds the facility inventory, registers operators, drafts and runs concession agreements, governs capital projects, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /rac/facilities"
      - "POST /rac/concessionaires"
      - "POST /rac/concession-agreements"
      - "POST /rac/concession-agreements/{agreement_id}/execute"
      - "POST /rac/concession-agreements/{agreement_id}/suspend"
      - "POST /rac/concession-agreements/{agreement_id}/reinstate"
      - "POST /rac/counter-spaces"
      - "POST /rac/fleet-parking-zones"
      - "POST /rac/capital-projects"
      - "POST /rac/capital-projects/{project_id}/approve"
      - "POST /rac/capital-projects/{project_id}/close"
      - "POST /rac/capital-projects/{project_id}/cancel"
      - "POST /rac/_clock/set_current_utc"
    shared_operations:
      - "POST /rac/counter-assignments and its activate/release actions (shared with ConcessionaireOperator)"
      - "POST /rac/fleet-allocations and its release action (shared with ConcessionaireOperator)"
      - "POST /rac/transaction-day-reports and its submit/reopen actions (shared with ConcessionaireOperator)"
      - "POST /rac/cfc-remittances (shared with ConcessionaireOperator)"
      - "POST /rac/debt-service-obligations and POST /rac/shuttle-cost-periods (shared with FinanceOfficer)"
      - "POST /rac/capital-disbursements (shared with FinanceOfficer)"
      - "POST /rac/true-up-settlements (shared with AuditOfficer)"
      - "every GET endpoint"

  - name: ConcessionaireOperator
    description: "Rental car brand acting on its own agreements: requests space, reports transaction days and gross revenue, raises CFC remittances and disputes true-up settlements."
    identity: "entity_backed:Concessionaire"
    exclusive_operations:
      - "POST /rac/true-up-settlements/{settlement_id}/dispute"
    shared_operations:
      - "POST /rac/counter-assignments, /activate, /release (shared with FacilityAdmin)"
      - "POST /rac/fleet-allocations, /release (shared with FacilityAdmin)"
      - "POST /rac/transaction-day-reports, /submit, /reopen (shared with FacilityAdmin)"
      - "POST /rac/cfc-remittances (shared with FacilityAdmin)"
      - "every GET endpoint"
    note: "X-User-ID MUST equal the id of a Concessionaire row; every write is additionally checked against the target resource's agreement.concessionaire_id (validation priority 6)."

  - name: AuditOfficer
    description: "Transaction-day audit authority: opens, accepts and rejects reports and issues the minimum-guarantee true-up. Barred from issuing a true-up built on reports it accepted itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /rac/transaction-day-reports/{report_id}/begin-audit"
      - "POST /rac/transaction-day-reports/{report_id}/accept"
      - "POST /rac/transaction-day-reports/{report_id}/reject"
      - "POST /rac/true-up-settlements/{settlement_id}/issue"
    shared_operations:
      - "POST /rac/true-up-settlements (shared with FacilityAdmin)"
      - "every GET endpoint"
    note: "Segregation of duties: the X-User-ID recorded in TransactionDayReport.audited_by_user_id may not issue a TrueUpSettlement for that agreement (validation priority 10)."

  - name: FinanceOfficer
    description: "CFC trust and bond treasury: receives remittances, funds and pays debt service, allocates shuttle costs, and authorizes, rejects, pays or voids capital draws."
    identity: "opaque"
    exclusive_operations:
      - "POST /rac/cfc-remittances/{remittance_id}/receive"
      - "POST /rac/debt-service-obligations/{obligation_id}/fund"
      - "POST /rac/debt-service-obligations/{obligation_id}/pay"
      - "POST /rac/shuttle-cost-periods/{shuttle_period_id}/allocate"
      - "POST /rac/capital-disbursements/{disbursement_id}/authorize"
      - "POST /rac/capital-disbursements/{disbursement_id}/reject"
      - "POST /rac/capital-disbursements/{disbursement_id}/pay"
      - "POST /rac/capital-disbursements/{disbursement_id}/void"
      - "POST /rac/true-up-settlements/{settlement_id}/settle"
    shared_operations:
      - "POST /rac/debt-service-obligations and POST /rac/shuttle-cost-periods (shared with FacilityAdmin)"
      - "POST /rac/capital-disbursements (shared with FacilityAdmin)"
      - "every GET endpoint"
    note: "Segregation of duties: the X-User-ID stored in CapitalDisbursement.requested_by_user_id may not authorize or reject that same draw (validation priority 9)."
