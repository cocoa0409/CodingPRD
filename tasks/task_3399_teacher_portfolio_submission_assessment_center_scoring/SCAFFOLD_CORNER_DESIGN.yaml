              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_center
            - *c_cka_sub
            - *c_cka_book
          trigger:
            - *c_clk20
            - call: "POST /bookings/${bk_id}/transition"
              payload: { to: "COMPLETED", earned_score: 3.00 }
              as: ScoringAdministrator
            - call: "GET /submissions/${sub_cka}"
              payload: {}
              as: BoardAdministrator
              captures: { cka_st: $.data.status, cka_final: $.data.final_score }
            - *c_cert_list
            - call: "GET /certifications/${cert_id}"
              payload: {}
              as: BoardAdministrator
              captures: { prov: $.data.weighted_total_provisional }
          assert:
            - "Booking.${bk_id}.status == COMPLETED and earned_score == 3.00"
            - "ComponentSubmission.${sub_cka}.status == SCORED and final_score == 3.00 (ASSESSMENT path: single source, no reads)"
            - "Certification.${cert_id}.weighted_total_provisional == 1.20 immediately (immediate consistency)"
            - "Certification.${cert_id}.status == PENDING (portfolio components unscored — no premature decision)"

