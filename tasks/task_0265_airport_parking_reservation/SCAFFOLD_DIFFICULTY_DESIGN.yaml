scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: parking_charge_provisional_vs_final_diverge
        grounds:
          - calculations.compute_parking_charge
          - calculations.compute_overstay_surcharge
          - entities.Reservation.fields.provisional_quote_cents
          - entities.Reservation.fields.final_charge_cents
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          On the Reservation entity, the provisional variant prices the planned
          interval [scheduled_start, scheduled_end) while the final variant prices
          the actual interval [actual_in, actual_out) plus overstay; for one booking
          the same plan yields provisional_quote_cents=5800 but final_charge_cents=6900.
        test_recipe:
          setup:
            - "Clock at 2026-06-30T09:00:00Z."
            - "HOURLY VALET_GARAGE-irrelevant lot SURFACE_LOT with standard_capacity=5; HOURLY rate plan hourly_cents=300, daily_cap_cents=2000."
            - "Customer with STANDARD non-EV vehicle; non-prepaid reservation [2026-07-01T10:00Z, 2026-07-03T15:30Z]."
            - "Checked in at scheduled_start, checked out at 2026-07-03T18:00Z (overstay past 59-min grace)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "d1@x.com", full_name: "D One" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L1", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD1", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-03T15:30:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id, prov: $.data.provisional_quote_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-03T18:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: LotOperator
              captures: { final: $.data.final_charge_cents, overstay: $.data.overstay_cents }
          assert:
            - "Reservation.${res_id}.provisional_quote_cents == 5800"
            - "Reservation.${res_id}.final_charge_cents == 6900"
            - "Reservation.${res_id}.overstay_cents == 900"
            - "Reservation.${res_id}.provisional_quote_cents != Reservation.${res_id}.final_charge_cents"

      - name: lot_availability_decrement_vs_increment_diverge
        grounds:
          - calculations.compute_lot_availability
          - entities.Lot.fields.available_standard_count
          - state_machines.StallHold.HELD_to_RELEASED
          - state_machines.Reservation.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          On the Lot entity (a different domain from Reservation pricing), the same
          availability formula yields a decrement when a StallHold is created
          (available_standard_count 5→4) and an increment when that hold is RELEASED
          on cancel (4→5); identical lot, opposite results by variant.
        test_recipe:
          setup:
            - "Clock at 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=5, available_standard_count=5."
            - "One non-prepaid BOOKED reservation holds one STANDARD stall (available 4)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "d2@x.com", full_name: "D Two" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L2", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD2", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail_after_hold: $.data.available_standard_count }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail_after_release: $.data.available_standard_count }
          assert:
            - "available_standard_count after hold creation == 4"
            - "available_standard_count after cancel release == 5"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hourly_charge_tiered_cap_with_class_surcharge_mode_a
        grounds:
          - calculations.compute_parking_charge
          - entities.RatePlan.fields.oversized_multiplier_bps
          - entities.RatePlan.fields.daily_cap_cents
          - entities.Reservation.fields.provisional_quote_cents
        distinguishing_aspect: |
          Mode (a): the HOURLY charge composes ≥3 inputs with non-linear interaction —
          per-day min(hours*hourly, daily_cap) tier selection, full-day vs remainder
          split, then an OVERSIZED basis-points multiplier — producing 6000 for a
          2-day+2h OVERSIZED booking (base 5000 then *1.2), not a linear hours*rate.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT oversized_capacity=3."
            - "HOURLY plan hourly_cents=300, daily_cap_cents=2500, oversized_multiplier_bps=12000."
            - "OVERSIZED vehicle; non-prepaid reservation spanning 1 day + 2h (2026-07-01T10:00Z → 2026-07-02T12:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c2a@x.com", full_name: "C2a" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L2a", kind: "SURFACE_LOT", standard_capacity: 0, oversized_capacity: 3, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2500, oversized_multiplier_bps: 12000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "OVR2a", size_class: "OVERSIZED", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T12:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id, prov: $.data.provisional_quote_cents }
          assert:
            - "Reservation.${res_id}.stall_class == OVERSIZED"
            - "Reservation.${res_id}.provisional_quote_cents == 6000"

      - name: prepay_discount_then_overstay_capture_evaluation_order_mode_c
        grounds:
          - calculations.compute_prepay_discount
          - calculations.compute_parking_charge
          - state_machines.Reservation.AUTHORIZED_to_SETTLED
          - entities.Reservation.fields.provisional_quote_cents
          - entities.PaymentTxn.fields.amount_cents
        distinguishing_aspect: |
          Mode (c): the settlement has a pinned evaluation order — the prepay discount
          is applied to the provisional quote at booking (5800→4930), but the overstay
          delta captured at check-out is computed against the UNDISCOUNTED final and
          settled as final-minus-prepaid (6900-4930=1970), so reversing the order
          (discounting the overstay too) would yield a different, wrong total.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z (≥24h before start so prepay discount is eligible)."
            - "SURFACE_LOT standard_capacity=5; HOURLY plan hourly_cents=300, daily_cap_cents=2000; CancellationPolicy prepay_discount_bps=1500, free_cancel_hours=48."
            - "STANDARD vehicle; PREPAID reservation [2026-07-01T10:00Z, 2026-07-03T15:30Z]; checked in at start, checked out 2026-07-03T18:00Z (overstay)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c2c@x.com", full_name: "C2c" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L2c", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /cancellation-policies"
              payload: { lot_id: "${lot_id}", free_cancel_hours: 48, late_cancel_fee_bps: 2500, prepay_discount_bps: 1500 }
              as: FacilityAdmin
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD2c", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-03T15:30:00Z", prepaid: true, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id, prov: $.data.provisional_quote_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-03T18:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: LotOperator
              captures: { final: $.data.final_charge_cents }
          assert:
            - "Reservation.${res_id}.provisional_quote_cents == 4930"
            - "Reservation.${res_id}.final_charge_cents == 6900"
            - "PaymentTxn rows for ${res_id} include CAPTURE amount_cents == 4930 (prepay capture)"
            - "PaymentTxn rows for ${res_id} include CAPTURE amount_cents == 1970 (overstay capture, undiscounted delta)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_in_out_cycle_checked_in_out_temp
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_OUT_TEMP
          - state_machines.Reservation.OUT_TEMP_to_CHECKED_IN
          - entities.Lot.fields.in_out_allowed
          - entities.Reservation.fields.occupancy_status
        distinguishing_aspect: |
          The Reservation occupancy machine has a cycle CHECKED_IN→OUT_TEMP→CHECKED_IN
          that repeats under in/out privileges, with the stall retained (OCCUPIED)
          throughout — a non-linear loop, not an A→B→C pipeline.
        test_recipe:
          setup:
            - "Clock 2026-07-01T12:00:00Z; SURFACE_LOT with in_out_allowed=true, standard_capacity=2."
            - "Non-prepaid reservation [2026-07-01T10:00Z, 2026-07-02T10:00Z], checked in."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c3a@x.com", full_name: "C3a" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L3a", kind: "SURFACE_LOT", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: true }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD3a", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /reservations/${res_id}/gate-exit"
              payload: {}
              as: LotOperator
            - call: "POST /reservations/${res_id}/gate-reentry"
              payload: {}
              as: LotOperator
            - call: "POST /reservations/${res_id}/gate-exit"
              payload: {}
              as: LotOperator
              captures: { occ: $.data.occupancy_status }
          assert:
            - "Reservation.${res_id}.occupancy_status == OUT_TEMP after the second gate-exit"
            - "Lot.${lot_id}.available_standard_count == 1 throughout (stall retained across the cycle)"

      - name: shuttle_trip_branching_cancel_vs_depart
        grounds:
          - state_machines.ShuttleTrip.SCHEDULED_to_CANCELLED
          - state_machines.ShuttleTrip.SCHEDULED_to_BOARDING
          - state_machines.ShuttleTrip.BOARDING_to_DEPARTED
          - entities.ShuttleTrip.fields.status
        distinguishing_aspect: |
          The ShuttleTrip machine branches at SCHEDULED into two divergent paths —
          SCHEDULED→CANCELLED (detaches riders, seats_taken→0) versus
          SCHEDULED→BOARDING→DEPARTED (seats frozen) — with different side-effect
          sets per branch, on a different entity than the Reservation cycle.
        test_recipe:
          setup:
            - "Clock 2026-07-01T09:40:00Z; SURFACE_LOT; two scheduled shuttle trips departing 2026-07-01T10:00Z, seat_capacity=4."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T09:40:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "L3b", kind: "SURFACE_LOT", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T10:00:00Z", seat_capacity: 4 }
              as: FacilityAdmin
              captures: { trip_a: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T10:00:00Z", seat_capacity: 4 }
              as: FacilityAdmin
              captures: { trip_b: $.data.id }
          trigger:
            - call: "POST /shuttle-trips/${trip_a}/cancel"
              payload: {}
              as: LotOperator
              captures: { status_a: $.data.status }
            - call: "POST /shuttle-trips/${trip_b}/open-boarding"
              payload: {}
              as: LotOperator
            - call: "POST /shuttle-trips/${trip_b}/depart"
              payload: {}
              as: LotOperator
              captures: { status_b: $.data.status }
          assert:
            - "ShuttleTrip.${trip_a}.status == CANCELLED"
            - "ShuttleTrip.${trip_b}.status == DEPARTED"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_show_sweep_cascade_depth4_to_customer_suspension
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - state_machines.StallHold.HELD_to_RELEASED
          - calculations.compute_lot_availability
          - calculations.compute_no_show_settlement
          - entities.Customer.fields.no_show_strikes
          - entities.Customer.fields.status
        distinguishing_aspect: |
          Trigger = BOOKED→NO_SHOW (mark-no-show). Hop1 marks NO_SHOW, which
          causes Hop2 (its StallHold HELD→RELEASED), which causes Hop3 (Lot
          available_standard_count recompute +1), and the NO_SHOW also drives Hop4
          (Customer.no_show_strikes 2→3 → Customer.status SUSPENDED). Depth ≥3,
          each link caused by the previous, ending on the Customer aggregate.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=3, available 3 after two prior no-shows leave strikes=2."
            - "Customer already at no_show_strikes=2 via two prior marked no-shows (clock advanced past grace with /_clock/set, which does not sweep); one fresh BOOKED non-prepaid reservation holds a STANDARD stall (available 2)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c4a@x.com", full_name: "C4a" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L4a", kind: "SURFACE_LOT", standard_capacity: 3, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD4a", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_v1: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-06-30T09:05:00Z", scheduled_end: "2026-07-01T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v1}" }
              as: FacilityAdmin
              captures: { res1: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:40:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res1}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_v2: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-06-30T09:45:00Z", scheduled_end: "2026-07-01T11:00:00Z", prepaid: false, expected_lot_version: "${lot_v2}" }
              as: FacilityAdmin
              captures: { res2: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T10:20:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res2}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_v3: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-06-30T10:25:00Z", scheduled_end: "2026-07-01T12:00:00Z", prepaid: false, expected_lot_version: "${lot_v3}" }
              as: FacilityAdmin
              captures: { res3: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T11:00:00Z" }
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail_before: $.data.available_standard_count }
          trigger:
            - call: "POST /reservations/${res3}/mark-no-show"
              payload: {}
              as: LotOperator
              captures: { occ3: $.data.occupancy_status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: FacilityAdmin
              captures: { strikes: $.data.no_show_strikes, cust_status: $.data.status }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail_after: $.data.available_standard_count }
          assert:
            - "Reservation.${res3}.occupancy_status == NO_SHOW"
            - "Customer.${cust_id}.no_show_strikes == 3"
            - "Customer.${cust_id}.status == SUSPENDED"
            - "Lot.${lot_id}.available_standard_count == 3 after the third release"

      - name: checkout_cascade_depth3_stall_and_shuttle_release
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - state_machines.StallHold.OCCUPIED_to_RELEASED
          - calculations.compute_lot_availability
          - entities.ShuttleTrip.fields.seats_taken
          - entities.Lot.fields.available_standard_count
        distinguishing_aspect: |
          Trigger = check-out (a different transition than the no-show sweep). Hop1
          CHECKED_IN→CHECKED_OUT causes Hop2 (StallHold OCCUPIED→RELEASED) which
          causes Hop3 (Lot available_standard_count +1); the same check-out also
          releases the assigned shuttle seat (seats_taken 1→0). Depth ≥2 on the
          stall chain, distinct origin from instance 1.
        test_recipe:
          setup:
            - "Clock 2026-07-01T09:30:00Z; SURFACE_LOT standard_capacity=2 (available 2)."
            - "Non-prepaid reservation [2026-07-01T10:00Z, 2026-07-02T10:00Z], assigned to a shuttle trip (seats_taken=1), checked in (available 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c4b@x.com", full_name: "C4b" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L4b", kind: "SURFACE_LOT", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD4b", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T12:00:00Z", seat_capacity: 4 }
              as: FacilityAdmin
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/assign-shuttle"
              payload: { shuttle_trip_id: "${trip_id}", expected_shuttle_trip_version: "${trip_v}" }
              as: FacilityAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-02T08:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: LotOperator
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail: $.data.available_standard_count }
            - call: "GET /shuttle-trips/${trip_id}"
              payload: {}
              as: FacilityAdmin
              captures: { seats: $.data.seats_taken }
          assert:
            - "Lot.${lot_id}.available_standard_count == 2 after check-out release"
            - "ShuttleTrip.${trip_id}.seats_taken == 0 after check-out release"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_state_beats_no_stall_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_CUSTOMER_SUSPENDED]
          - errors[ERR_NO_STALL_AVAILABLE]
        distinguishing_aspect: |
          A booking that is both from a SUSPENDED customer (category=state, priority 9)
          AND for a class with available_count==0 (category=business_constraint,
          priority 13) returns ERR_CUSTOMER_SUSPENDED — the lower-numbered state check
          wins over the constraint check (state vs business_constraint pair).
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z. A target SURFACE_LOT (capacity 1) whose single STANDARD stall is already held by a filler customer's BOOKED reservation (available_standard_count==0)."
            - "A separate strike-building SURFACE_LOT (capacity 3) used only to drive the suspect customer to no_show_strikes==3 (SUSPENDED) via three marked no-shows, advancing the clock with /_clock/set (no sweep) past each grace window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "L5a-target", kind: "SURFACE_LOT", standard_capacity: 1, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L5a-strikes", kind: "SURFACE_LOT", standard_capacity: 3, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { lot_id: "${slot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { srp_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "filler5@x.com", full_name: "Filler" }
              as: FacilityAdmin
              captures: { filler_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${filler_id}", plate: "FILL5", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { filler_veh: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${filler_id}", lot_id: "${lot_id}", vehicle_id: "${filler_veh}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { res_filler: $.data.id }
            - call: "POST /customers"
              payload: { email: "susp5@x.com", full_name: "Susp Five" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD5a", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "GET /lots/${slot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { sv1: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${slot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${srp_id}", scheduled_start: "2026-06-30T09:05:00Z", scheduled_end: "2026-07-01T09:30:00Z", prepaid: false, expected_lot_version: "${sv1}" }
              as: FacilityAdmin
              captures: { res_strike1: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:40:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_strike1}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${slot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { sv2: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${slot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${srp_id}", scheduled_start: "2026-06-30T09:45:00Z", scheduled_end: "2026-07-01T09:45:00Z", prepaid: false, expected_lot_version: "${sv2}" }
              as: FacilityAdmin
              captures: { res_strike2: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T10:20:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_strike2}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${slot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { sv3: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${slot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${srp_id}", scheduled_start: "2026-06-30T10:25:00Z", scheduled_end: "2026-07-01T09:50:00Z", prepaid: false, expected_lot_version: "${sv3}" }
              as: FacilityAdmin
              captures: { res_strike3: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T11:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_strike3}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_vnow: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-05T10:00:00Z", scheduled_end: "2026-07-06T10:00:00Z", prepaid: false, expected_lot_version: "${lot_vnow}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUSTOMER_SUSPENDED (state check wins over ERR_NO_STALL_AVAILABLE)"
            - "HTTP status == 409"

      - name: interval_temporal_beats_rate_plan_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_INTERVAL]
          - errors[ERR_RATE_PLAN_NOT_QUOTABLE]
        distinguishing_aspect: |
          A booking that is BOTH on a retired (inactive) rate plan (category=
          business_constraint, priority 6) AND has scheduled_end <= scheduled_start
          (category=business_temporal, priority 7) returns ERR_RATE_PLAN_NOT_QUOTABLE
          — the lower-numbered constraint check wins (business_constraint vs
          business_temporal pair, a different pair than instance 1).
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=5; a DAILY rate plan then RETIRED (active=false)."
            - "STANDARD vehicle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c5b@x.com", full_name: "C5b" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L5b", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /rate-plans/${rp_id}/retire"
              payload: {}
              as: FacilityAdmin
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD5b", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-02T10:00:00Z", scheduled_end: "2026-07-02T08:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RATE_PLAN_NOT_QUOTABLE (priority 6 wins over ERR_INVALID_INTERVAL at priority 7)"
            - "HTTP status == 422"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overstay_grace_boundary_at_59_vs_60_min
        grounds:
          - calculations.compute_overstay_surcharge
          - entities.Reservation.fields.overstay_cents
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          Checking out exactly OVERSTAY_GRACE_MIN (59) minutes past scheduled_end
          yields overstay_cents==0 (<= grace_end), while 60 minutes past yields
          overstay_cents>0 — a numeric-threshold boundary on the check-out endpoint.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=2; HOURLY plan hourly_cents=300, daily_cap_cents=2000."
            - "Non-prepaid reservation [2026-07-01T10:00Z, 2026-07-01T14:00Z]; checked in at start; checked out at 2026-07-01T14:59:00Z (exactly grace)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c6a@x.com", full_name: "C6a" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L6a", kind: "SURFACE_LOT", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD6a", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T14:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T14:59:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: LotOperator
              captures: { overstay: $.data.overstay_cents }
          assert:
            - "Reservation.${res_id}.overstay_cents == 0 (actual_out exactly at scheduled_end + 59 min)"

      - name: no_stall_available_at_zero_count_empty_inventory
        grounds:
          - validations[priority=13]
          - calculations.compute_lot_availability
          - errors[ERR_NO_STALL_AVAILABLE]
          - entities.Lot.fields.available_ev_count
        distinguishing_aspect: |
          A different metric/endpoint: booking an EV vehicle on a lot whose
          available_ev_count is exactly 0 (empty typed inventory) returns
          ERR_NO_STALL_AVAILABLE on POST /reservations — an empty-collection/zero-count
          edge, distinct from the overstay numeric threshold.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; GARAGE with ev_capacity=1, the single EV stall already held by another EV reservation (available_ev_count==0)."
            - "Second customer with an EV vehicle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "L6b", kind: "GARAGE", standard_capacity: 0, oversized_capacity: 0, ev_capacity: 1, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 3000, ev_surcharge_cents_per_day: 400 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ev1@x.com", full_name: "EV One" }
              as: FacilityAdmin
              captures: { c1: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c1}", plate: "EVA", size_class: "STANDARD", is_ev: true }
              as: FacilityAdmin
              captures: { v1: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1}", lot_id: "${lot_id}", vehicle_id: "${v1}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { res1: $.data.id }
            - call: "POST /customers"
              payload: { email: "ev2@x.com", full_name: "EV Two" }
              as: FacilityAdmin
              captures: { c2: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c2}", plate: "EVB", size_class: "STANDARD", is_ev: true }
              as: FacilityAdmin
              captures: { v2: $.data.id }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_vnow: $.data.version, ev_avail: $.data.available_ev_count }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c2}", lot_id: "${lot_id}", vehicle_id: "${v2}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T12:00:00Z", scheduled_end: "2026-07-02T12:00:00Z", prepaid: false, expected_lot_version: "${lot_vnow}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "available_ev_count == 0 before the trigger"
            - "response error_id == ERR_NO_STALL_AVAILABLE"
            - "HTTP status == 409"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_customer_active_reservation_lot
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - entities.Customer.fields.status
          - validations[priority=9]
          - errors[ERR_CUSTOMER_SUSPENDED]
        distinguishing_aspect: |
          The Reservation→Customer pair: a Reservation's BOOKED→CHECKED_IN transition
          depends on the booking Customer.status==ACTIVE; a booking attempt while the
          Customer is SUSPENDED is rejected — entity pair (Reservation, Customer).
