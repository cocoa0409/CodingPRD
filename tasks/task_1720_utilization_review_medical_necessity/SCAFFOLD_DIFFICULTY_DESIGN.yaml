  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturn_depth3_cascade
        grounds:
          - state_machines.AppealCase.FILED_to_DECIDED_OVERTURNED
          - state_machines.DenialCase.APPEAL_FILED_to_RESOLVED_OVERTURNED
          - state_machines.AuthorizationRequest.DENIED_to_APPROVED
        distinguishing_aspect: |
          Depth-3 chain from the appeal-decision trigger: (1) AppealCase decided OVERTURNED causes (2) DenialCase APPEAL_FILED -> RESOLVED_OVERTURNED, which causes (3) AuthorizationRequest DENIED -> APPROVED with a frontier-appended certified interval, which causes the UtilizationCase auth axis and certified_day_count to recompute — each hop is caused by the previous hop's mutation, not by the original call.
        test_recipe:
          setup:
            - "Medicare case; authorization request for 3 days denied at logical time 2026-08-02T12:00:00Z; appeal filed (denial is final: no conference scheduled)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-C3", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "DENY", denial_reason_code: "CRITERIA_NOT_MET" }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}/denial-cases"
              as: URNurse
              captures: { den_id: "$.data[0].id" }
            - call: "POST /api/denial-cases/${den_id}/appeals"
              payload: { appeal_level: 1, argument_summary: "Denial contradicts documented severity indicators." }
              as: AppealsCoordinator
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/appeals/${app_id}/decision"
              payload: { decision: "OVERTURNED" }
              as: PayerReviewer
          assert:
            - "Hop 1: AppealCase.${app_id}.status == DECIDED_OVERTURNED and overturned_day_count == 3"
            - "Hop 2: DenialCase.${den_id}.status == RESOLVED_OVERTURNED"
            - "Hop 3: AuthorizationRequest.${auth_id}.status == APPROVED with certified_day_start == 1 and certified_day_end == 4 (frontier append of the 3 restored days)"
            - "End of chain: UtilizationCase.${case_id}.auth_status == AUTHORIZED and certified_day_count == 3"

      - name: cc44_approval_withdrawal_cascade
        grounds:
          - state_machines.ConditionCode44Request.COMMITTEE_PENDING_to_APPROVED
          - state_machines.AuthorizationRequest
          - entities.UtilizationCase.fields.current_admission_status
        distinguishing_aspect: |
          Depth-2 chain from the committee-review trigger: (1) CC44 APPROVED flips UtilizationCase.current_admission_status INPATIENT -> OBSERVATION, and that flip itself causes (2) the case's non-terminal INPATIENT AuthorizationRequest to transition SUBMITTED -> WITHDRAWN — a different trigger and propagation pattern than the appeal cascade.
        test_recipe:
          setup:
            - "Medicare INPATIENT case; submitted CRITERIA_NOT_MET review; one INPATIENT authorization request sitting SUBMITTED (undecided)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-C44", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "MCG", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v3: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/condition-code-44-requests"
              payload: { rationale: "Inpatient criteria not met.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_v3}" }
              as: URNurse
              captures: { cc_id: $.data.id }
            - call: "POST /api/condition-code-44-requests/${cc_id}/concurrence"
              payload: { decision: "CONCUR" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
          trigger:
            - call: "POST /api/condition-code-44-requests/${cc_id}/committee-review"
              payload: { decision: "APPROVE" }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
          assert:
            - "Hop 1: UtilizationCase.${case_id}.current_admission_status == OBSERVATION"
            - "Hop 2: AuthorizationRequest.${auth_id}.status == WITHDRAWN (non-terminal INPATIENT request withdrawn by the flip, not by the committee call directly)"
            - "ConditionCode44Request.${cc_id}.status == APPROVED and effective_at is set"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cc44_committee_terminal_state_beats_sod
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SOD_ROLE_CONFLICT]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the committee-review call violates both the from-state rule (CC44 already REJECTED, terminal) and segregation of duties (reviewer is the attending) — the state error must win because priority 7 precedes priority 13.
        test_recipe:
          setup:
            - "Medicare case whose attending is ALSO registered as an advisor (is_advisor true); CC44 request advanced CONCUR -> committee REJECT by a different advisor, so status == REJECTED"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. AttendAdvisor", specialty: "Internal Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_attadv: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-PP1", payer_id: "${pay_med}", attending_physician_id: "${dr_attadv}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/condition-code-44-requests"
              payload: { rationale: "Inpatient criteria not met.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { cc_id: $.data.id }
            - call: "POST /api/condition-code-44-requests/${cc_id}/concurrence"
              payload: { decision: "CONCUR" }
              as: AttendingPhysician
              as_user_id: "${dr_attadv}"
            - call: "POST /api/condition-code-44-requests/${cc_id}/committee-review"
              payload: { decision: "REJECT", committee_note: "Committee finds inpatient justified" }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
          trigger:
            - call: "POST /api/condition-code-44-requests/${cc_id}/committee-review"
              payload: { decision: "APPROVE" }
              as: PhysicianAdvisor
              as_user_id: "${dr_attadv}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 — the terminal-state violation (priority 7) wins over the SoD violation (priority 13) even though the caller is also the attending"
            - "ConditionCode44Request.${cc_id}.status remains REJECTED"

      - name: auth_create_safety_beats_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=27]
          - errors[ERR_CLINICAL_DOC_INCOMPLETE]
          - errors[ERR_BED_DAY_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: one auth-create call carries a 5-character clinical_summary (safety, priority 12) and requests 99 days against a 30-day budget (fiscal, priority 27) — the safety error must win.
        test_recipe:
          setup:
            - "Commercial payer with bed_day_budget_per_case 30; case at version 1"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Commercial PPO", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_com: $.data.id }
