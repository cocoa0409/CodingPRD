              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_id}/exam-attempts"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
              captures: { att_id: $.data.id }
            - call: "POST /exam-attempts/${att_id}/submit"
              payload: { raw_correct_count: 34, proctor_attestation: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:30:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "GET /certificates"
              payload: { alcohol_server_id: "${srv_id}" }
              as: ProgramAdmin
              captures: { cert1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2027-05-04T14:00:00Z", scheduled_end_at: "2027-05-04T18:00:00Z", capacity: 5 }
              as: ProgramAdmin
              captures: { sess2_id: $.data.id, sess2_v: $.data.version }
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess2_id}", alcohol_server_id: "${srv_id}", expected_class_session_version: "${sess2_v}" }
              as: AlcoholServer
              as_user_id: "${srv_id}"
              captures: { enr2_id: $.data.id }
            - call: "POST /class-sessions/${sess2_id}/lock-roster"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr2_id}/attendance"
              payload: { attended: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-04T14:05:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess2_id}/open-exam"
              payload: { proctor_trainer_id: "${tr_id}" }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr2_id}/exam-attempts"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
              captures: { att2_id: $.data.id }
            - call: "POST /exam-attempts/${att2_id}/submit"
              payload: { raw_correct_count: 34, proctor_attestation: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-04T17:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /class-sessions/${sess2_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "GET /certificates"
              payload: { alcohol_server_id: "${srv_id}", validity_state: "ACTIVE" }
              as: ProgramAdmin
              captures: { cert2_id: "$.data[0].id", cert2_expires: "$.data[0].expires_at", cert2_mode: "$.data[0].expiry_anchor_mode" }
          assert:
            - "Certificate.${cert2_id}.expiry_anchor_mode == \"ANNIVERSARY_ANCHORED\""
            - "Certificate.${cert2_id}.expires_at == \"2030-08-10T18:30:00Z\" (add_months(2028-08-10T18:30:00Z, 24)); the ISSUANCE_ANCHORED variant would have produced 2029-05-04T17:00:00Z"
            - "Certificate.${cert2_id}.issued_at == \"2027-05-04T17:00:00Z\""
            - "Certificate.${cert2_id}.renews_certificate_id == ${cert1_id}"
            - "Certificate.${cert2_id}.certificate_number == \"TX-2027-00002\""
            - "Certificate.${cert1_id}.validity_state == \"SUPERSEDED\""
            - "AlcoholServer.${srv_id}.active_certificate_id == ${cert2_id}"
            - "AlcoholServer.${srv_id}.work_eligibility == \"ELIGIBLE\""
            - "AlcoholServer.${srv_id}.certification_count == 2"

      - name: location_strict_rate_diverges_from_grace_inclusive_rate_for_all_grace_roster
        grounds:
          - calculations.location_compliance_metrics
          - entities.EmployerLocation.fields.compliance_rate_strict_pct
          - entities.EmployerLocation.fields.compliance_rate_grace_inclusive_pct
          - entities.EmployerAccount.fields.account_compliance_rate_pct
          - state_machines.Certificate.ACTIVE_to_GRACE
        distinguishing_aspect: |
          The location's only live assignment belongs to a server whose certificate has
          just entered GRACE, so the STRICT variant (ELIGIBLE only) reports 0.00 while
          the GRACE_INCLUSIVE variant (ELIGIBLE plus GRACE) reports 100.00 from the
          identical assignment set — a 100.00-point divergence driven purely by which
          eligibility values the numerator admits, and the account roll-up uses the
          STRICT numerator so it reads 0.00 too.
        test_recipe:
          setup:
            - "TX jurisdiction with MANDATORY mandate covering ON_PREMISE and OFF_PREMISE, certificate_validity_months 24, renewal_grace_days 30, reminder_lead_days 60."
            - "Employer Lone Star Taverns LLC with one ON_PREMISE TX location (training_requirement MANDATED)."
            - "Server Ari Cole holds an ACTIVE certificate expiring 2028-08-10T18:30:00Z and is assigned ACTIVE at that location, so both rates read 100.00."
            - "The logical clock is moved to exactly 2028-08-10T18:30:00Z, the certificate's expiry instant."
