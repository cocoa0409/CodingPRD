    applies_to: "POST /breakage-draws"
    condition: "quantity_lites > glass_order.available_stock_lites"
    error_id: ERR_BREAKAGE_STOCK_EXHAUSTED
    http_status: 422
  - priority: 103
    category: business_capacity
    applies_to: "POST /breakage-draws"
    condition: "quantity_lites exceeds the referenced PanelLot's lite_count (a replacement draw cannot exceed the glass content of the lot it repairs); quantity_lites < 1 is caught earlier by priority 32"
    error_id: ERR_DRAW_QUANTITY_INVALID
    http_status: 422
  - priority: 104
    category: business_fiscal
    applies_to: "POST /installation-zones/{id}/certify-weather-tight"
    condition: "the certified subtotal after adding this zone's line would exceed package.contract_value_cents"
    error_id: ERR_BILLING_EXCEEDS_CONTRACT
    http_status: 422
  - priority: 105
    category: business_fiscal
    applies_to: "POST /fabrication-releases"
    condition: "the referenced glass order's risk_flag is true (risk_score >= RISK_THRESHOLD)"
    error_id: ERR_GLASS_RISK_THRESHOLD_EXCEEDED
    http_status: 422
    note: "Boundary: risk_score exactly 70.00 blocks the release; 69.99 does not."
  - priority: 106
    category: business_fiscal
    applies_to: "POST /installation-zones/{id}/crew-days"
    condition: "a POSTED CrewDayLog already exists for this zone and work_date"
    error_id: ERR_CREW_DAY_DUPLICATE
    http_status: 409
  - priority: 108
    category: business_fiscal
    applies_to: "POST /facade-packages/{id}/close-out"
    condition: "any InstallationZone of the package has weather_status != WEATHER_TIGHT"
    error_id: ERR_ZONES_NOT_WEATHER_TIGHT
    http_status: 422
  - priority: 110
    category: business_fiscal
    applies_to: "POST /facade-packages/{id}/close-out"
    condition: "any DefectItem of the package is OPEN or REMEDIATION_SUBMITTED, or any submittal has open_notes_count > 0, or any submittal is in SUBMITTED/UNDER_REVIEW/REVISION_REQUIRED/ESCALATED"
    error_id: ERR_PUNCH_LIST_OPEN
    http_status: 422

# ---------------------------------------------------------------------------
# §1.5 Endpoint Table  (api_prefix is "", so every collection sits at the root)
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    roles: &all_roles [CWProjectManager, CWDetailer, DelegatedEngineer, ArchitectOfRecord, GlazingProcurement, StructuralContractor, FieldSuperintendent, QCInspector]
    input: [to_iso8601]
    output: { current_utc: datetime }
    description: "Sets the logical clock. Default clock when never set: 2026-08-01T00:00:00Z. Every timestamp default, lead-time delta and reservation-window comparison reads this clock."
    errors: [ERR_INVALID_REQUEST]

  # --- FacadePackage -------------------------------------------------------
  - method: POST
    path: /facade-packages
    roles: [CWProjectManager]
    input: [name, floor_count, total_area_sqm, contract_value_cents, unit_rate_cents_per_sqm, base_labor_rate_cents_per_hour, design_temp_delta_c, weather_tightness_deadline_date, "system_type?"]
    output: FacadePackage
    description: "Opens a facade package in DESIGN_ASSIST with engineering_posture OPEN and system_type UNDECIDED."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_VALUE_OUT_OF_RANGE]
  - method: GET
    path: /facade-packages
    roles: *all_roles
    input: ["state?", "engineering_posture?", "system_type?", "limit?", "offset?"]
    output: FacadePackage[]
    description: "Filtered, paginated package list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /facade-packages/{id}
    roles: *all_roles
    input: []
    output: FacadePackage
    description: "Reads one package, including version for optimistic concurrency on POST /fabrication-releases."
    errors: [ERR_MISSING_ROLE, ERR_PACKAGE_NOT_FOUND]
  - method: POST
    path: /facade-packages/{id}/system-decision
    roles: [CWProjectManager]
    input: [system_type]
    output: FacadePackage
    description: "Branching fork: fixes UNITIZED or STICK_BUILT, writes planned_shop_hours / planned_field_crew_size per calculations.system_decision_labor_split and recomputes thermal_movement_allowance_mm and deflection_limit_mm on every existing zone."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_ENUM, ERR_PACKAGE_NOT_FOUND, ERR_INVALID_STATE]
  - method: POST
    path: /facade-packages/{id}/close-out
    roles: [CWProjectManager]
    input: ["closeout_note?"]
    output: FacadePackage
    description: "Terminal transition; freezes earned value and retention."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_PACKAGE_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE, ERR_ZONES_NOT_WEATHER_TIGHT, ERR_OPEN_CRITICAL_DEFECT, ERR_PUNCH_LIST_OPEN]
  - method: GET
    path: /facade-packages/{id}/earned-value
    roles: *all_roles
    input: []
    output: { certified_area_sqm: number, certified_subtotal_cents: integer, retention_held_cents: integer, earned_value_certified_cents: integer, weather_tight_zone_count: integer, contract_value_cents: integer }
    description: "Computed read: re-derives calculations.earned_value_certified_cents from the current weather-tight zone set without mutating anything."
    errors: [ERR_MISSING_ROLE, ERR_PACKAGE_NOT_FOUND]
  - method: GET
    path: /facade-packages/{id}/submittals
    roles: *all_roles
    input: ["state?"]
    output: ShopDrawingSubmittal[]
    description: "Submittals of the package."
    errors: [ERR_MISSING_ROLE, ERR_PACKAGE_NOT_FOUND]
  - method: GET
    path: /facade-packages/{id}/zones
    roles: *all_roles
    input: ["weather_status?"]
    output: InstallationZone[]
    description: "Zones of the package."
    errors: [ERR_MISSING_ROLE, ERR_PACKAGE_NOT_FOUND]

  # --- ShopDrawingSubmittal ------------------------------------------------
  - method: POST
    path: /shop-drawing-submittals
    roles: [CWDetailer]
    input: [package_id, submittal_type, title, drawing_set_ref, "delegated_design_scope?"]
    output: ShopDrawingSubmittal
    description: "Creates a submittal in SUBMITTED with revision_cycle 1."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_PACKAGE_NOT_FOUND]
  - method: GET
    path: /shop-drawing-submittals
    roles: *all_roles
    input: ["package_id?", "state?", "submittal_type?", "limit?", "offset?"]
    output: ShopDrawingSubmittal[]
    description: "Filtered submittal list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /shop-drawing-submittals/{id}
    roles: *all_roles
    input: []
    output: ShopDrawingSubmittal
    description: "Reads one submittal."
    errors: [ERR_MISSING_ROLE, ERR_SUBMITTAL_NOT_FOUND]
  - method: POST
    path: /shop-drawing-submittals/{id}/seal
    roles: [DelegatedEngineer]
    input: [seal_license_no]
    output: ShopDrawingSubmittal
    description: "Applies the delegated designer's seal: records sealed_by_user_id from X-User-ID, seal_license_no and sealed_at."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_REQUEST, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE, ERR_SEAL_INVALID]
  - method: POST
    path: /shop-drawing-submittals/{id}/start-review
    roles: [ArchitectOfRecord]
    input: []
    output: ShopDrawingSubmittal
    description: "SUBMITTED -> UNDER_REVIEW; enforces the seal requirement and the sealer/reviewer segregation of duties."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE, ERR_SEAL_REQUIRED, ERR_SEALER_CANNOT_REVIEW]
  - method: POST
    path: /shop-drawing-submittals/{id}/review
    roles: [ArchitectOfRecord]
    input: [decision, "notes_count?", "escalation_ref?"]
    output: ShopDrawingSubmittal
    description: "Branching review: APPROVED, APPROVED_AS_NOTED, REVISION_REQUIRED (revision_cycle <= 2) or ESCALATED (revision_cycle >= 3). The revision branches run the four-hop revoke cascade."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE, ERR_SEALER_CANNOT_REVIEW]
  - method: POST
    path: /shop-drawing-submittals/{id}/resubmit
    roles: [CWDetailer]
    input: [drawing_set_ref, "dispute_resolution_ref?"]
    output: ShopDrawingSubmittal
    description: "Cycle edge back to SUBMITTED; increments revision_cycle and clears the seal. From ESCALATED a dispute_resolution_ref is mandatory."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE, ERR_DISPUTE_REF_REQUIRED]
  - method: POST
    path: /shop-drawing-submittals/{id}/reopen-review
    roles: [ArchitectOfRecord]
    input: [reopen_reason]
    output: ShopDrawingSubmittal
    description: "APPROVED_AS_NOTED -> UNDER_REVIEW while open_notes_count >= 1; the re-entry edge that lets a later REVISION_REQUIRED decision revoke live fabrication releases."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_REQUEST, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE, ERR_SEALER_CANNOT_REVIEW]
  - method: POST
    path: /shop-drawing-submittals/{id}/close-notes
    roles: [ArchitectOfRecord]
    input: [notes_closed]
    output: ShopDrawingSubmittal
    description: "Burns down open_notes_count on an APPROVED_AS_NOTED submittal; open_notes_count never goes below 0."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_VALUE_OUT_OF_RANGE, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_STATE]

