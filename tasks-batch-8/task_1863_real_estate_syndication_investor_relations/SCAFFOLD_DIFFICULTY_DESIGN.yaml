  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: min_subscription_boundary_inclusive
        grounds:
          - validations[priority=7b]
          - entities.Offering.fields.min_subscription_cents
          - entities.Subscription.fields.committed_cents
