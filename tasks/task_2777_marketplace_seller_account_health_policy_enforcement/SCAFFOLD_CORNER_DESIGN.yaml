          assert:
            - "HTTP 409 and ${err_code} == ERR_LISTING_NOT_REMOVED"
            - "Seller.${s_id}.enforcement_state == ACTIVE   # the seller guard passed; the listing state is what failed"
            - "Listing.${l1}.state == ACTIVE"
            - "Listing.${l1}.removal_policy_category == null and Listing.${l1}.suppressed_by_suspension == false"
            - "Listing.${l1}.version == 1   # the refused call wrote nothing"

      - name: state_repeating_investigation_and_adjudication_triggers_is_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Violation.transitions.REPORTED_to_UNDER_INVESTIGATION.preconditions"
          - "state_machines.Violation.transitions.UNDER_INVESTIGATION_to_SUBSTANTIATED.preconditions"
          - "state_machines.Violation.terminal_states (SUBSTANTIATED, DISMISSED)"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Firing the same trigger twice is an error, not a silent replay: the second
          open-investigation on an already UNDER_INVESTIGATION violation fails, and a second
          adjudication of a SUBSTANTIATED violation fails as well because SUBSTANTIATED is
          terminal. Both refusals leave adjudicated_at and decision_note exactly as the FIRST
          successful adjudication wrote them, and the seller's disbursement posture stays NORMAL
          (the investigation already closed) rather than flapping back to RESERVE_HELD.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
