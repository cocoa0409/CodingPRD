  - name: Any
    description: "Every authenticated role: read-only access to the surface this scaffold marks public"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /stores and GET /stores/{storeId}"
      - "GET /stores/members and GET /stores/members/{memberId}"
      - "GET /stores/pets, GET /stores/pets/{petId} and the pet sub-resource lists"
