              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
          trigger:
            - call: "POST /stores/${s}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert: $.data.id }
            - call: "GET /stores/${s}/credit-accounts/${ac}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "the issuance response reports status ACTIVE, issued_amount_cents == 1000, remaining_balance_cents == 1000, expires_at == 2026-10-08T00:00:00Z"
            - "the immediately-following account read reports credit_balance_cents == 1000 and pending_award_cents == 0"

