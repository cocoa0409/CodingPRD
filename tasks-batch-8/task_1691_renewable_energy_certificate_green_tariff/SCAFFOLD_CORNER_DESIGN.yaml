            - "mint-run consumed only r2: minted_count == 1 (July bucket 1000 kWh -> 1 REC, carryover 0); r1 did not exist at mint time"
            - "err == ERR_READING_ALREADY_MINTED for r2 (consumed readings are void-proof)"
            - "r1 void succeeds: MeterReading.${r1}.status == VOIDED and Generator.${g}.cumulative_accepted_kwh == 1000 (1700 - 700)"
