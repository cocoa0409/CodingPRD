  - section: validations
    instances:
      - name: pay_nonexistent_invoice_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) precedes state and fiscal checks: PAY on a nonexistent invoice id returns 404, never ERR_INVOICE_NOT_ISSUED or ERR_PAYMENT_MISMATCH."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/invoices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/events", payload: { event_type: "PAY", amount_cents: 1 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: request_with_unowned_bike_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_BIKE_NOT_OWNED]"]
        distinguishing_aspect: "Cross-entity referential check: a request whose bike belongs to another customer fails with ERR_BIKE_NOT_OWNED (403)."
        test_recipe:
          setup: ["customers Ann and Bob; bike owned by Bob"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_a: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Bob", email: "bob@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_b: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_b}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_b: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_a}", bike_id: "${bike_b}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BIKE_NOT_OWNED (403)"

      - name: individual_subscription_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=20]", "errors[ERR_SUBSCRIPTION_REQUIRES_ORG_ACCOUNT]"]
        distinguishing_aspect: "Conditional on account_kind: subscriptions are only for FLEET/APARTMENT; INDIVIDUAL is rejected with 422."
        test_recipe:
          setup: ["one INDIVIDUAL customer"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /v1/subscriptions", payload: { customer_id: "${cust_id}", included_tunes_per_period: 4, discount_pct: 0.10, period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSCRIPTION_REQUIRES_ORG_ACCOUNT (422)"

      - name: window_too_short_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "Window shape rule: a 20-minute window (< 30 minutes minimum) fails with ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["zone, tier, customer, bike"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T10:20:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
