                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${hb_src}", weight_lbs: 200, position: 1 }
              as: CellarLead
              captures: { pb_src: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T10:00:00Z"
                press_window_minutes: 60
                blend_lines:
