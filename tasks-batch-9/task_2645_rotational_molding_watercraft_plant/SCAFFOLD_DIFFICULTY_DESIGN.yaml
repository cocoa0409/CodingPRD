              captures: { reserve_3: $.data.warranty_reserve_cents, paid_3: $.data.warranty_paid_cents, pm_v3: $.data.version }
            - call: "GET /warranty-claims/${clm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
          assert:
            - "PRE-DRAW: ${reserve_1} == 500000 and ${paid_1} == 0, and 500000 + 0 == initial_warranty_reserve_cents 500000"
            - "${util} == 66.67 and ${quoted} == 10707: a single line is nest_position 1, so billable cube is the full 2.0000 m3, dim weight is round(2.0000 * 120.000, 3) == 240.000 kg which beats unit_weight_kg 24.000, line freight is round_half_up(240.000 * 42) == 10080, the 66.67 pct utilisation selects the 3.00 pct tier giving round_half_up(10080 * 3 / 100) == 302, and fuel is round_half_up(9778 * 9.50 / 100) == 929, so 10080 - 302 + 929 == 10707"
            - "${billed} == 10707 as well — with exactly one line the nested and gross bases coincide, which isolates this instance from the multi-line quote-vs-bill divergence"
            - "FinishedUnit.${fu}.logistics_status == DELIVERED and FinishedUnit.${fu}.delivered_at == 2026-08-02T00:00:00Z"
            - "${months} == 6   (2026-08-02T00:00:00Z to the clock at 2027-02-02T00:00:00Z is 6 COMPLETE calendar months, floored)"
            - "${srs} == GUIDANCE_VERIFIED, so §1.4 priority 55 is satisfied and the storage deduction path is the zero branch"
            - "${basis} == PRO_RATA_AGE and coverage_pct == 90.00   (round((60 - 6) / 60 * 100, 2) == round(90.00, 2))"
            - "${gross} == 162000   (round_half_up(180000 * 90.00 / 100 * CLAIM_TYPE_FACTOR[HULL_DEFORMATION] 1.00) == round_half_up(162000.00))"
            - "${fee} == 12960   (the FIRST ADMIN_FEE_TIERS row with max_gross_cents >= 162000 is the 200000 row at 8.00 pct, so round_half_up(162000 * 8.00 / 100) == 12960; the 50000/12.00 row is skipped and the tier is never re-selected)"
            - "${deduct} == 0   (storage_review_status is GUIDANCE_VERIFIED, not WAIVED, so STORAGE_WAIVED_DEDUCTION_PCT never applies)"
            - "${net} == 149040   (max(0, 162000 - 0 - 12960))"
            - "the approval passes the reserve gate because 149040 <= 500000; §1.4 priority 76 ERR_WARRANTY_RESERVE_EXHAUSTED would fire only on a strict greater-than"
            - "POST-DRAW INVARIANT: ${reserve_2} == 350960 and ${paid_2} == 149040, and 350960 + 149040 == 500000 — the sum is unchanged, so the ledger is conserved"
            - "${pm_v2} == ${pm_v1} + 1   (approve bumps ProductModel.version, which is exactly why expected_product_model_version is OCC-guarded)"
            - "${clm_status} == VOIDED and ${clm_denial} == APPROVAL_VOIDED"
            - "POST-RESTORE INVARIANT: ${reserve_3} == 500000 and ${paid_3} == 0, and 500000 + 0 == 500000 — the compensating move returned the IDENTICAL integer 149040 in both buckets, an exact reversal with no rounding involved"
            - "${net_after_void} == 149040 and WarrantyClaim.${clm}.pre_fee_gross_cents == 162000 and admin_fee_cents == 12960 and storage_deduction_cents == 0 — the money fields are RETAINED after the void, so the reversal is reproducible from the claim row alone"
            - "${pm_v3} == ${pm_v2} + 1 and the reserve is back to full headroom, so a fresh approval of the same value would now succeed again"

      - name: storage_footprint_conserved_with_asymmetric_anchor_promotion
        grounds:
          - calculations.storage_footprint
          - calculations.warehouse_footprint_posture
          - calculations.storage_zone_selection
          - state_machines.FinishedUnit.logistics.STORED_to_UNALLOCATED
          - "CASCADE-C links 2-3"
          - concurrency_rules[store-unit-stale-warehouse]
        distinguishing_aspect: |
          The conserved quantity is nested VOLUME in cubic metres at 4 decimal places
          (Warehouse.committed_cube_m3 must always equal the sum of the occupying units'
          stored_footprint_cube_m3), and its compensating move is deliberately ASYMMETRIC in a way
          neither the mass nor the money ledger is: releasing the zone ANCHOR promotes the earliest
          surviving sibling to full gross cube, so removing a 2.0000 m3 hull lowers committed cube by
          only 1.0000 m3 and the invariant holds at a total a naive subtraction would get wrong.
        test_recipe:
          setup:
            - "ProductModel PM-X9C-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000 (so a nested follower costs 1.0000 and the promotion delta is 2.0000 * (1 - 0.5000) == 1.0000), unit_weight_kg 8.000, nominal_charge_kg 8.000, charge_tolerance_pct 5.00, min_cooling_minutes 30."
            - "THREE-cavity Mold MLD-X9C-3 with nominal_charge_kg 24.000 == 8.000 * 3 and service_interval_cycles 10, so one cycle mints three sibling hulls in ascending cavity_index order."
            - "OvenStation OV-X9C (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE); CoolingBay CB-X9C (concurrent_slot_capacity 2, FORCED_AIR)."
            - "Four distinct ACTIVE Technicians T-X9C-RES / T-X9C-OPR / T-X9C-ASM / T-X9C-QCI (§1.4 priority 57)."
            - "Warehouse WH-X9C has ONE zone Z-A with footprint_capacity_cube_m3 20.0000, restricted_threshold_pct 85.00 and frozen_threshold_pct 95.00 — capacity is deliberately generous so utilisation never reaches a posture threshold and §1.4 priorities 40, 66, 73 and 75 stay vacuous; the whole instance is about the footprint arithmetic, not about admission."
            - "Qualified ResinLot LOT-X9C received_kg 500.000, expires_on 2027-12-31."
            - "ProductionOrder PO-X9C (ordered_qty 3, no demand_bucket_id) released, one cycle ran 09:00 / 10:00 / 10:35, and hulls PO-X9C-01-0001, PO-X9C-02-0002 and PO-X9C-03-0003 were each trimmed, outfitted and inspected PASS, so all three are SELLABLE / UNALLOCATED and the order reached COMPLETE at completed_qty 3."
            - "The zone starts EMPTY, so the first store takes the ANCHOR_PLACEMENT branch and the next two take the nested branch."
            - "The logical clock is stepped 11:00 -> 11:05 -> 11:10 across the three stores so stored_at strictly increases in hull order, making the CASCADE-C link 2 promotion target (stored_at ASC, tie-break hull_serial ASC) unambiguous."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-X9C-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 8.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 8.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
