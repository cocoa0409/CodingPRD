            - call: "POST /kiosk-ops/rice-batches/${rb_id}/verify-ttc"
              as: FranchiseChef
              as_user_id: "${chef_id}"
            - call: "POST /kiosk-ops/fish-lots"
              payload: { kiosk_id: "${kiosk_id}", species: "TUNA_YELLOWFIN", supplier_code: "SUP-9931", harvest_method: "WILD", net_weight_kg: 7.2, received_at: "2026-08-03T06:30:00Z", receiving_temp_c: 2.8 }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { fl_id: $.data.id }
            - call: "POST /kiosk-ops/fish-lots/${fl_id}/release"
              as: QualityAuditor
            - call: "POST /kiosk-ops/pack-lots"
              payload: { rice_batch_id: "${rb_id}", fish_lot_id: "${fl_id}", sku_code: "CALIF-8", pack_count: 160, list_price_cents: 900, produced_at: "2026-08-03T08:00:00Z" }
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/pack-lots/${pl_id}/void"
              payload: { void_reason: "Mislabelled allergen sleeve on the whole run" }
              as: FranchisorOps
              captures: { void_status: $.data.status }
          assert:
            - "PackLot.${pl_id}.status == VOIDED with void_reason recorded and discarded_count 0"
            - "no DiscardEvent is appended: GET /kiosk-ops/pack-lots/${pl_id}/discard-events returns total_count 0, because a void is not a discard"
            - "FishLot.${fl_id}.allocated_kg == 0.000 and remaining_kg == 7.200, restored to the pre-allocation values exactly"
            - "FishLot.${fl_id}.status == RELEASED, having come back out of CONSUMED"
            - "the invariant allocated_kg + remaining_kg == net_weight_kg == 7.200 holds at every step: 7.200 + 0.000 before the void and 0.000 + 7.200 after it"
            - "ProductionPlan.${plan_id}.actual_pack_count == 0, down from 160"
            - "RiceBatch.${rb_id}.status remains CONSUMED, so the void compensates fish mass only and never re-opens rice yield"
            - "a second void of the same lot is refused with ERR_PACK_LOT_INVALID_STATE and HTTP 409, so the compensation cannot be applied twice to double-credit the mass"
      - name: settlement_void_restores_license_lifetime_accrual_exactly
        grounds:
          - "state_machines.SettlementStatement.ISSUED_to_VOID"
          - "entities.LicenseAgreement.fields.lifetime_share_accrued_cents"
          - "calculations.revenue_share_settlement"
          - "roles[FranchisorOps]"
        distinguishing_aspect: |
          A DIFFERENT CONSERVED QUANTITY: accrued revenue-share cents on the LicenseAgreement ledger, not
          kilograms on a lot. The issue books 296000 cents and the void must unbook exactly the amount that
          was booked, leaving the lifetime accrual back at its pre-issue value with zero cents of drift.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "an ACTIVE GROSS_SALES agreement whose lifetime_share_accrued_cents is 0"
            - "one RECONCILED POS feed for 2026-08-03 with gross_sales_cents 2400000 and markdown_sales_cents 300000"
            - "a DRAFT statement for 2026-08-01..2026-08-31 created by ops-creator-1 with binding_share_cents 296000 and net_due_cents 296000"
            - "the statement was ISSUED by the distinct user ops-issuer-2, taking lifetime_share_accrued_cents to 296000"
