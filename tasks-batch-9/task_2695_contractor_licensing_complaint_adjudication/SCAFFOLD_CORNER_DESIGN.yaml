      - name: corner_screening_a_complaint_twice_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.Complaint.RECEIVED_to_INVESTIGATION
          - validations[priority=20]
          - errors[ERR_COMPLAINT_STATE_INVALID]
        distinguishing_aspect: "The second identical screen request is refused with ERR_COMPLAINT_STATE_INVALID (409) because the precondition is status == RECEIVED; the first screening's side effects (jurisdiction_basis UNLICENSED_PRACTICE, mediation_round_count 0) are not re-applied."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one complaint against an unlicensed operator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Ida Idem", contact_email: "ida@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "No Licence Larry", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Paid for a panel upgrade never performed" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
