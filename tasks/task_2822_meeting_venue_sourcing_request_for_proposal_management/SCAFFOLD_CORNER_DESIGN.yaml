# =============================================================================
# 1.9 Scaffold Corner Design - Meeting Venue Sourcing & RFP Management
# Breadth probe: every testable claim of SCAFFOLD.yaml 1.1-1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# Taxonomy: references/claim-extraction-guide.md (nine sections, per-section rows).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
    - name: create_meeting_event_returns_all_declared_fields
      claim_type: Creation
      grounds:
      - entities.MeetingEvent
      - endpoints[POST /sourcing/events]
      - entities.MeetingEvent.fields.nights_span
      - entities.MeetingEvent.fields.budget_remaining_usd
      - calculations.budget_envelope_invariant
      - response_envelope.success
      distinguishing_aspect: 'POST /sourcing/events with every required field returns 201 and a body carrying all 20 declared MeetingEvent fields: nights_span is derived as 3 from the 2027-03-15..2027-03-18 span (not 4 calendar days), status is the DRAFT initial state, and the money rollups start at 0.00 with budget_remaining_usd already equal to the full 500000.00 ceiling.'
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        assert:
        - HTTP 201 and response_type == object
        - meta.api_request_id and meta.api_request_timestamp are present on the envelope
        - MeetingEvent.${ev_id}.event_code == EVT-2822-A and name == Global User Conference 2027
        - MeetingEvent.${ev_id}.program_type == USER_CONFERENCE
        - MeetingEvent.${ev_id}.start_date == 2027-03-15 and end_date == 2027-03-18
        - MeetingEvent.${ev_id}.nights_span == 3
        - MeetingEvent.${ev_id}.peak_attendees == 200 and requested_room_nights == 600
        - MeetingEvent.${ev_id}.largest_meeting_space_sqft == 12000
        - MeetingEvent.${ev_id}.budget_ceiling_usd == 500000.00
        - MeetingEvent.${ev_id}.preferred_program_only == false
        - MeetingEvent.${ev_id}.status == DRAFT
        - MeetingEvent.${ev_id}.sourcing_owner_user_id == planner-anita
        - MeetingEvent.${ev_id}.shortlisted_venue_count == 0
        - MeetingEvent.${ev_id}.best_total_cost_usd == null
        - MeetingEvent.${ev_id}.awarded_proposal_id == null
        - MeetingEvent.${ev_id}.committed_spend_usd == 0.00
        - MeetingEvent.${ev_id}.cancellation_liability_usd == 0.00
        - MeetingEvent.${ev_id}.budget_remaining_usd == 500000.00
        - MeetingEvent.${ev_id}.savings_recognized_usd == null
        - MeetingEvent.${ev_id}.version == 1 and created_at == updated_at == 2026-08-05T09:00:00.000Z
    - name: get_venue_by_id_returns_stored_row
      claim_type: Retrieval
      grounds:
      - entities.Venue
      - endpoints[GET /sourcing/venues/{venue_id}]
      - entities.Venue.fields.blocked_room_nights
      - entities.Venue.fields.performance_score
      distinguishing_aspect: GET /sourcing/venues/{id} echoes exactly the row POST /sourcing/venues persisted - the same guest_rooms_total 420 and largest_space_sqft 14000 - and the score/inventory rollups read null / 0 because no performance review and no EXECUTED contract exist yet.
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        - One PREFERRED TIER_1 Venue 'Harborline Grand' (420 guest rooms, 14000 sqft) registered by the programme admin.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        trigger:
        - call: GET /sourcing/venues/${v1_id}
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        assert:
        - HTTP 200 and response_type == object
        - Venue.${v1_id}.name == Harborline Grand, city == Lisbon, country == PT
        - Venue.${v1_id}.destination_tier == TIER_1
        - Venue.${v1_id}.guest_rooms_total == 420 and largest_space_sqft == 14000
        - Venue.${v1_id}.preferred_supplier_status == PREFERRED
        - Venue.${v1_id}.performance_score == null and performance_score_simple_mean == null
        - Venue.${v1_id}.performance_review_count == 0
        - Venue.${v1_id}.blocked_room_nights == 0
        - Venue.${v1_id}.version == 1 and created_at == 2026-08-05T09:00:00.000Z
    - name: list_venues_paginated_with_total_count_and_has_more
      claim_type: Listing
      grounds:
      - endpoints[GET /sourcing/venues]
      - response_envelope.pagination_fields
      - response_envelope.pagination_defaults
      - entities.Venue
      distinguishing_aspect: 'GET /sourcing/venues returns response_type array with the four pagination fields: with three venues on file and limit 2 / offset 0 the page carries 2 rows, total_count 3 and has_more true, and the offset-2 page carries 1 row with has_more false - total_count stays 3 on both pages because it counts the whole filtered set, not the page.'
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        - 'Three venues registered: ''Harborline Grand'' (TIER_1, Lisbon), ''Cascade Bay Resort'' (TIER_1, Porto) and ''Lakeview Training Centre'' (TIER_2, Warsaw).'
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Cascade Bay Resort, city: Porto, country: PT, destination_tier: TIER_1, guest_rooms_total: 380, largest_space_sqft: 16000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v2_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Lakeview Training Centre, city: Warsaw, country: PL, destination_tier: TIER_2, guest_rooms_total: 200, largest_space_sqft: 6000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {vs_id: $.data.id}
        trigger:
        - call: GET /sourcing/venues
          payload: {limit: 2, offset: 0}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/venues
          payload: {limit: 2, offset: 2}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/venues
          payload: {destination_tier: TIER_1}
          as: SourcingManager
          as_user_id: planner-anita
        assert:
        - the first call returns HTTP 200, response_type == array and exactly 2 rows
        - the first call reports limit == 2, offset == 0, total_count == 3, has_more == true
        - the second call returns exactly 1 row with limit == 2, offset == 2, total_count == 3, has_more == false
        - the third call (no limit supplied) applies the declared default limit 10 and offset 0
        - the third call returns exactly 2 rows (the two TIER_1 venues) with total_count == 2 and has_more == false
        - the third call's rows do NOT include Lakeview Training Centre
    - name: get_event_with_unknown_id_returns_event_not_found
      claim_type: Not Found
      grounds:
      - validations[priority=10]
      - errors[ERR_EVENT_NOT_FOUND]
      - endpoints[GET /sourcing/events/{event_id}]
      - response_envelope.error
      distinguishing_aspect: A syntactically valid but unknown event id resolves to nothing, so the read returns HTTP 404 ERR_EVENT_NOT_FOUND in the error envelope (response_type error with data.error_id and data.message) rather than an empty object or a 200.
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        - No MeetingEvent has ever been created.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: GET /sourcing/events/00000000-0000-4000-8000-000000000000
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_notfound: $.data.error_id}
        assert:
        - HTTP 404 with response_type == error
        - data.error_id == ERR_EVENT_NOT_FOUND
        - data.message is a non-empty string
        - GET /sourcing/events returns 0 rows with total_count == 0
    - name: create_event_missing_budget_ceiling_returns_invalid_request
      claim_type: Required Fields
      grounds:
      - validations[priority=20]
      - errors[ERR_INVALID_REQUEST]
      - entities.MeetingEvent.fields.budget_ceiling_usd
      - endpoints[POST /sourcing/events]
      distinguishing_aspect: 'budget_ceiling_usd carries source input with no default, so omitting it is a shape failure: HTTP 400 ERR_INVALID_REQUEST, and no MeetingEvent row is created (the partial body is never persisted with a null ceiling).'
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-X, name: Ceiling-less Event, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_shape: $.data.error_id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-X, name: Bad Enum Event, program_type: OFFSITE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_enum: $.data.error_id}
        assert:
        - the first call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST
        - the second call (program_type OFFSITE, not a declared enum member) also returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST
        - GET /sourcing/events returns 0 rows with total_count == 0 after both calls
    - name: create_venue_omitting_preferred_supplier_status_applies_default_none
      claim_type: Defaults
      grounds:
      - entities.Venue.fields.preferred_supplier_status
      - entities.Venue.fields.performance_review_count
      - entities.Venue.fields.blocked_room_nights
      - endpoints[POST /sourcing/venues]
      distinguishing_aspect: preferred_supplier_status is the only optional input on POST /sourcing/venues and its declared default is NONE - not PREFERRED - so an omitted body field yields a venue that is outside the preferred-supplier programme, while the computed rollups take their declared 0 / 0 defaults.
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: POST /sourcing/venues
          payload: {name: Meridian Riverside, city: Seville, country: ES, destination_tier: TIER_1, guest_rooms_total: 260, largest_space_sqft: 13000}
          as: ProgramAdmin
          captures: {vd_id: $.data.id}
        assert:
        - HTTP 201
        - Venue.${vd_id}.preferred_supplier_status == NONE (the declared default, not PREFERRED)
        - Venue.${vd_id}.performance_review_count == 0
        - Venue.${vd_id}.blocked_room_nights == 0
        - Venue.${vd_id}.performance_score == null and performance_score_simple_mean == null
        - Venue.${vd_id}.guest_rooms_total == 260 and largest_space_sqft == 13000
        - GET /sourcing/venues?preferred_supplier_status=NONE returns exactly 1 row
    - name: proposal_computed_fields_derived_from_gross_rate_and_commission
      claim_type: Computed Fields
      grounds:
      - entities.Proposal.fields.net_adr_usd
      - entities.Proposal.fields.comp_room_nights
      - entities.Proposal.fields.paid_room_nights
      - entities.Proposal.fields.total_cost_contracted_usd
      - entities.Proposal.fields.compliance_status
      - calculations.proposal_total_cost_model
      - calculations.rate_benchmark_compliance
      - calculations.event_sourcing_rollup
      distinguishing_aspect: 'Every computed field on Proposal is server-derived from the quoted grid and never echoed from the request: a 275.00 GROSS rate at 10% commission becomes net_adr_usd 247.50, 400 nights at 1-comp-per-40 becomes 10 comp / 390 paid, and the pinned evaluation order yields total_cost_contracted_usd 290551.07 with the concession clipped to the 8% cap - while total_cost_modeled_usd stays null because no BidEvaluation has been run.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        - PREFERRED TIER_1 Venue 'Harborline Grand'.
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18, ceiling 500000.00, requirements locked, that venue shortlisted at rank 1.
        - Round-1 Rfp issued (response_due_at 2026-09-30T17:00:00.000Z), so the venue holds one INVITED Proposal.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/events/${ev_id}/shortlist-entries
          payload: {venue_id: '${v1_id}', rank_seq: 1, inspection_required: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {e1_id: $.data.id}
        - call: POST /sourcing/shortlist-entries/${e1_id}/shortlist
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/events/${ev_id}/rfps
          payload: {round_number: 1, response_due_at: '2026-09-30T17:00:00.000Z', standard_response_version: V2, instructions: Answer every line of the standard grid.}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {rfp1_id: $.data.id}
        - call: POST /sourcing/rfps/${rfp1_id}/issue
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/proposals
          payload: {rfp_id: '${rfp1_id}', venue_id: '${v1_id}'}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {p1_id: '$.data[0].id'}
        trigger:
        - call: POST /sourcing/proposals/${p1_id}/submit
          payload: {room_rate_usd: 275.0, rate_type: GROSS, commission_pct: 0.1, room_nights_offered: 400, comp_room_ratio: 40, resort_fee_usd_per_night: 0.0, service_charge_pct: 0.22, tax_pct: 0.145, av_estimate_usd: 30000.0, fnb_minimum_usd: 90000.0, concession_credit_usd: 12000.0, attrition_allowance_pct: 0.05, cancellation_schedule: [{days_before_arrival_min: 181, fee_pct: 0.25}, {days_before_arrival_min: 91, fee_pct: 0.5}, {days_before_arrival_min: 31, fee_pct: 0.75}, {days_before_arrival_min: 0, fee_pct: 1.0}], force_majeure_scope: STANDARD, rebooking_credit_pct: 0.4}
          as: VenueRep
          as_user_id: ${v1_id}
        assert:
        - HTTP 200 and Proposal.${p1_id}.status == SUBMITTED
        - Proposal.${p1_id}.net_adr_usd == 247.50 (275.00 GROSS less 10% commission)
        - Proposal.${p1_id}.comp_room_nights == 10 and paid_room_nights == 390
        - Proposal.${p1_id}.total_cost_contracted_usd == 290551.07
        - Proposal.${p1_id}.benchmark_variance_pct == -0.0481
        - Proposal.${p1_id}.compliance_status == COMPLIANT
        - Proposal.${p1_id}.total_cost_modeled_usd == null and last_evaluation_basis == null
        - Proposal.${p1_id}.negotiation_round_count == 0
        - Proposal.${p1_id}.submitted_at == 2026-08-05T09:00:00.000Z
        - Rfp.${rfp1_id}.submitted_count == 1 and invited_count == 1
        - MeetingEvent.${ev_id}.best_total_cost_usd == 290551.07
        - GET /sourcing/proposals/${p1_id}/bid-evaluations returns 0 rows
    - name: system_fields_on_shortlist_entry_are_server_derived
      claim_type: System Fields
      grounds:
      - entities.VenueShortlistEntry.fields.status
      - entities.VenueShortlistEntry.fields.program_status_at_shortlist
      - entities.VenueShortlistEntry.fields.elimination_reason
      - entities.VenueShortlistEntry.fields.inspection_count
      - endpoints[POST /sourcing/events/{event_id}/shortlist-entries]
      distinguishing_aspect: 'The three system fields of VenueShortlistEntry are stamped by the server at creation and cannot be supplied: status takes the CANDIDATE initial state, elimination_reason stays null, and program_status_at_shortlist snapshots IN_PROGRAM because the venue is CONDITIONAL (a member of the programme) at creation time - a snapshot that is never re-derived later.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        - Venue 'Harborline Grand' registered with preferred_supplier_status CONDITIONAL.
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18, requirements locked.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: CONDITIONAL}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        trigger:
        - call: POST /sourcing/events/${ev_id}/shortlist-entries
          payload: {venue_id: '${v1_id}', rank_seq: 1, inspection_required: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {e1_id: $.data.id}
        assert:
        - HTTP 201
        - VenueShortlistEntry.${e1_id}.status == CANDIDATE (the declared initial state)
        - VenueShortlistEntry.${e1_id}.program_status_at_shortlist == IN_PROGRAM (snapshot of CONDITIONAL)
        - VenueShortlistEntry.${e1_id}.elimination_reason == null
        - VenueShortlistEntry.${e1_id}.inspection_count == 0
        - VenueShortlistEntry.${e1_id}.event_id == ${ev_id} and venue_id == ${v1_id}
        - VenueShortlistEntry.${e1_id}.rank_seq == 1 and inspection_required == false
        - VenueShortlistEntry.${e1_id}.version == 1 and created_at == 2026-08-05T09:00:00.000Z
        - MeetingEvent.${ev_id}.shortlisted_venue_count == 0 (creation alone does not count as shortlisting)
    - name: create_event_with_end_date_before_start_date_returns_invalid_date_range
      claim_type: Type Constraints
      grounds:
      - validations[priority=22]
      - errors[ERR_INVALID_DATE_RANGE]
      - entities.MeetingEvent.fields.start_date
      - entities.MeetingEvent.fields.end_date
      distinguishing_aspect: 'The date-range rule is STRICT: end_date must be strictly after start_date, so both a reversed pair (end 2027-03-15 before start 2027-03-18) and an equal pair (2027-03-15..2027-03-15, a zero-night span) return HTTP 422 ERR_INVALID_DATE_RANGE.'
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-R1, name: Reversed Span, program_type: USER_CONFERENCE, start_date: '2027-03-18', end_date: '2027-03-15', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_reversed: $.data.error_id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-R2, name: Zero Night Span, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-15', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_equal: $.data.error_id}
        assert:
        - the reversed-span call returns HTTP 422 with data.error_id == ERR_INVALID_DATE_RANGE
        - the equal-date call also returns HTTP 422 with data.error_id == ERR_INVALID_DATE_RANGE
        - GET /sourcing/events returns 0 rows with total_count == 0 after both calls
    - name: rate_benchmark_is_immutable_with_no_version_field
      claim_type: Immutability
      grounds:
