              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r3_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [5200, 5600, 6000, 6600, 7200], seats_left_at_each_day: [9, 8, 7, 5, 3] }
              as: OpsAgent
            - call: "POST /fare/itineraries/${i9_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i9_version}" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the first arming is refused with ERR_CURVE_UNPUBLISHED at priority 33 and the status is 409"
            - "Route.${r3_id}.curve_published == false at that instant"
            - "after publication Route.${r3_id}.curve_published == true and the arming succeeds with 201"
            - "Itinerary.${i9_id}.watch_armed == true and its version advanced exactly once, on the successful call"

