          assert:
            - "error_id == ERR_BOOKING_INVALID_STATE (state p8 beats business_safety p10 even though actor is SUSPENDED)"
            - "HTTP status == 409"
      - name: temporal_beats_constraint_at_booking
        grounds:
          - validations[priority=14]
          - validations[priority=16]
          - errors[ERR_TURNAROUND_VIOLATION]
          - errors[ERR_NO_NONUNION_SLOT]
        distinguishing_aspect: |
          Different error-category pair: business_temporal vs business_constraint.
          Booking create that violates BOTH the 600-minute turnaround and the exhausted
          nonunion slot pool must return ERR_TURNAROUND_VIOLATION (p14) ahead of
          ERR_NO_NONUNION_SLOT (p16).
        test_recipe:
          setup:
            - "Production ACTIVE; nonunion actor N has OFFERED booking on call1 (2026-08-10 07:00 + 600m -> expected wrap 17:00); call2 (2026-08-11) nonunion_slots 1 already fully consumed by filler booking"
          setup_api_calls:
