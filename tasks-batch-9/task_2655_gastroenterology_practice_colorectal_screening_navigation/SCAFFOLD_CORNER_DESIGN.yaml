              captures: { ep_a: $.data.id, ix_a: $.data.index_date, due_a: $.data.due_date, cr_a: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-25T09:30:00Z" }
              as: PracticeAdmin
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_b}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_b: $.data.id, ix_b: $.data.index_date, due_b: $.data.due_date, cr_b: $.data.created_at }
            - call: "GET /screening-episodes/${ep_a}"
