              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 2500000, memo: "Q3 2026 base rent" }
              as: LeaseAccountant
