scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_billed_total_provisional_vs_final_diverge
        grounds:
          - calculations.visit_billed_total
          - state_machines.Visit.IN_PROGRESS_to_CODED
          - state_machines.Visit.CODED_to_FINALIZED
          - entities.Visit.fields.billed_total_cents
        distinguishing_aspect: "On the Visit/ChargeLine domain, the provisional variant (sum of per-line amounts = 8000) differs from the final variant (sum * 0.90 = 7200) for identical charge lines; the contractual write-down is the divergence."
        test_recipe:
          setup:
            - "Provider ACTIVE; Patient ACTIVE; CptCode EM01 base_fee_cents=8000 requires_em_level=true; Visit IN_PROGRESS with one ChargeLine em_level=3 units=1"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr A", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "One", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "EM001", short_description: "Office visit lvl tiered", category: "EM", base_fee_cents: 8000, requires_em_level: true }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "EM001", units: 1, em_level: 3 }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { prov_total: $.data.billed_total_cents }
            - call: "POST /visits/${visit_id}/finalize"
              payload: {}
              as: Biller
              captures: { final_total: $.data.billed_total_cents }
          assert:
            - "Visit.${visit_id}.billed_total_cents == 8000 immediately after code (provisional)"
            - "Visit.${visit_id}.billed_total_cents == 7200 after finalize (final = round(8000*0.90))"

      - name: hedis_administrative_vs_hybrid_rate_diverge
        grounds:
          - calculations.hedis_compliance_rate
          - entities.HedisMeasure.fields.method
          - entities.HedisMeasure.fields.chart_confirmed
        distinguishing_aspect: "On the HedisMeasure/Patient domain (different from visit billing), ADMINISTRATIVE rate (1/4 = 25.0) differs from HYBRID rate (2/4 = 50.0) over the same four eligible BCS_MAMMOGRAM rows because HYBRID also counts the chart_confirmed GAP row."
        test_recipe:
          setup:
            - "Four female patients age 50-74; one BCS_MAMMOGRAM measure each for year 2026: one NUMERATOR_COMPLIANT (via finalized physical), one GAP chart_confirmed=true, two GAP chart_confirmed=false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: QualityAnalyst
            - call: "POST /providers"
              payload: { npi: "1000000010", full_name: "Dr H", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "PRV01", short_description: "Preventive physical", category: "PREVENTIVE", base_fee_cents: 12000 }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "W1", last_name: "M", date_of_birth: "1966-03-10", sex: "F" }
              as: FrontDesk
              captures: { p1: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "W2", last_name: "M", date_of_birth: "1966-03-10", sex: "F" }
              as: FrontDesk
              captures: { p2: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "W3", last_name: "M", date_of_birth: "1966-03-10", sex: "F" }
              as: FrontDesk
              captures: { p3: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "W4", last_name: "M", date_of_birth: "1966-03-10", sex: "F" }
              as: FrontDesk
              captures: { p4: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${p1}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "HYBRID" }
              as: QualityAnalyst
              captures: { m1: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${p2}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "HYBRID", chart_confirmed: true }
              as: QualityAnalyst
              captures: { m2: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${p3}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "HYBRID" }
              as: QualityAnalyst
              captures: { m3: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${p4}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "HYBRID" }
              as: QualityAnalyst
              captures: { m4: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${p1}", provider_id: "${prov_id}", visit_type: "PHYSICAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T09:30:00Z" }
              as: FrontDesk
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${v1}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v1}/charge-lines"
              payload: { cpt_code: "PRV01", units: 1 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v1}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v1}/finalize"
              payload: {}
              as: Biller
          trigger:
            - call: "GET /hedis/rate?measure_type=BCS_MAMMOGRAM&measurement_year=2026&method=ADMINISTRATIVE"
              payload: { measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { admin_rate: $.data.rate_pct }
            - call: "GET /hedis/rate?measure_type=BCS_MAMMOGRAM&measurement_year=2026&method=HYBRID"
              payload: { measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "HYBRID" }
              as: QualityAnalyst
              captures: { hybrid_rate: $.data.rate_pct }
          assert:
            - "ADMINISTRATIVE response: numerator == 1, denominator == 4, rate_pct == 25.0"
            - "HYBRID response: numerator == 2, denominator == 4, rate_pct == 50.0"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: em_level_tiered_multiplier_mode_a
        grounds:
          - calculations.charge_line_amount
          - entities.ChargeLine.fields.em_level
          - entities.CptCode.fields.requires_em_level
        distinguishing_aspect: "Mode (a): charge_line_amount combines >=3 inputs (base_fee_cents, em_level tier multiplier, units) with tiered-rate selection — em_level 4 yields base*1.4*units = 10000*1.4*1 = 14000, distinct from any linear scaling."
        test_recipe:
          setup:
            - "CptCode EM10 base_fee_cents=10000 requires_em_level=true; Visit IN_PROGRESS"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000020", full_name: "Dr B", specialty: "INTERNAL_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "Two", date_of_birth: "1975-05-05", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "EM010", short_description: "Office visit EM", category: "EM", base_fee_cents: 10000, requires_em_level: true }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "EM010", units: 1, em_level: 4 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { line_amt: $.data.amount_cents }
          assert:
            - "ChargeLine.amount_cents == 14000 (10000 * 1.4 * 1)"

      - name: visit_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.visit_billed_total
          - calculations.charge_line_amount
          - state_machines.Visit.IN_PROGRESS_to_CODED
        distinguishing_aspect: "Mode (b): rounding order is pinned to round-per-line-THEN-sum. Two lines of base 8123 * 0.8 = 6498.4 each round to 6498; sum = 12996. Sum-then-round (12997) is wrong; the provisional total must be 12996."
        test_recipe:
          setup:
            - "CptCode EM2T base_fee_cents=8123 requires_em_level=true; Visit IN_PROGRESS with two ChargeLines each em_level=2 units=1"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000021", full_name: "Dr C", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "Three", date_of_birth: "1985-05-05", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "EM2TT", short_description: "Tiered rounding code", category: "EM", base_fee_cents: 8123, requires_em_level: true }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T11:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "EM2TT", units: 1, em_level: 2 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "EM2TT", units: 1, em_level: 2 }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { prov_total: $.data.billed_total_cents }
          assert:
            - "each ChargeLine.amount_cents == 6498 (round_half_up(8123*0.8))"
            - "Visit.${visit_id}.billed_total_cents == 12996 (round-per-line then sum), NOT 12997"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_code_reopen_cycle
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_CODED
          - state_machines.Visit.CODED_to_IN_PROGRESS
        distinguishing_aspect: "Visit has a revision cycle IN_PROGRESS->CODED->IN_PROGRESS (reopen); reopen resets billed_total_cents to 0, proving a non-linear (cyclic) edge, distinct from the Prescription machine."
        test_recipe:
          setup:
            - "Visit CODED with provisional billed_total_cents=8000"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000030", full_name: "Dr D", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "Four", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "EM030", short_description: "EM code", category: "EM", base_fee_cents: 8000, requires_em_level: true }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T12:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "EM030", units: 1, em_level: 3 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/reopen"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status, total: $.data.billed_total_cents }
          assert:
            - "Visit.${visit_id}.status == IN_PROGRESS after reopen"
            - "Visit.${visit_id}.billed_total_cents == 0 after reopen"

      - name: prescription_submit_revise_cycle
        grounds:
          - state_machines.Prescription.DRAFT_to_PENDING_SIGNATURE
          - state_machines.Prescription.PENDING_SIGNATURE_to_DRAFT
        distinguishing_aspect: "Prescription has a revision cycle DRAFT->PENDING_SIGNATURE->DRAFT (revise) on a different entity than Visit, demonstrating a second non-linear machine."
        test_recipe:
          setup:
            - "Prescription PENDING_SIGNATURE against an IN_PROGRESS visit"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000031", full_name: "Dr E", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "Five", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T13:00:00Z", scheduled_end: "2026-06-01T13:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_id: "${visit_id}", drug_name: "Amoxicillin", schedule: "NON_CONTROLLED" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /prescriptions/${rx_id}/revise"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          assert:
            - "Prescription.${rx_id}.status == DRAFT after revise"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_visit_depth3_cascade
        grounds:
          - state_machines.Visit.CODED_to_FINALIZED
          - calculations.patient_lifetime_charges
          - calculations.open_care_gaps
          - entities.HedisMeasure.fields.status
        distinguishing_aspect: "CHAIN-1 depth 3 from Visit finalize: (1) ChargeLine totals set billed_total_cents=12000 -> (2) Patient.lifetime_charges_cents=12000 AND a GAP CIS_FLU/PHYSICAL HedisMeasure flips to NUMERATOR_COMPLIANT -> (3) Patient.open_care_gaps drops from 1 to 0, each link caused by the prior."
        test_recipe:
          setup:
            - "Patient with one eligible GAP CIS_FLU measure (open_care_gaps=1); Visit PHYSICAL CODED with a PRV02 charge line totaling 12000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "1000000040", full_name: "Dr F", specialty: "PEDIATRICS" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Kid", last_name: "Six", date_of_birth: "2021-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "PRV02", short_description: "Preventive physical", category: "PREVENTIVE", base_fee_cents: 12000 }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${pat_id}", measure_type: "CIS_FLU", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { hm_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "PHYSICAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T09:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "PRV02", units: 1 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/finalize"
              payload: {}
              as: Biller
              captures: { final_total: $.data.billed_total_cents }
          assert:
            - "Visit.${visit_id}.billed_total_cents == 10800 (final = round(12000*0.90))"
            - "Patient.${pat_id}.lifetime_charges_cents == 10800 (link 2)"
            - "HedisMeasure.${hm_id}.status == NUMERATOR_COMPLIANT (link 2)"
            - "Patient.${pat_id}.open_care_gaps == 0 after finalize (link 3, was 1)"

      - name: dispense_prescription_depth2_cascade
        grounds:
          - state_machines.Prescription.TRANSMITTED_to_DISPENSED
          - entities.Patient.fields.active_medication_count
          - calculations.open_care_gaps
        distinguishing_aspect: "CHAIN-2 depth 2 from Prescription dispense (different trigger than finalize): (1) Patient.active_medication_count increments to 1 -> (2) GAP MED_ADHERENCE measure flips to NUMERATOR_COMPLIANT and open_care_gaps drops to 0."
        test_recipe:
          setup:
            - "Adult patient with a GAP MED_ADHERENCE measure (open_care_gaps=1); a NON_CONTROLLED prescription in TRANSMITTED against an IN_PROGRESS visit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "1000000041", full_name: "Dr G", specialty: "INTERNAL_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Adult", last_name: "Seven", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /hedis-measures"
              payload: { patient_id: "${pat_id}", measure_type: "MED_ADHERENCE", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { hm_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T10:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_id: "${visit_id}", drug_name: "Metformin", schedule: "NON_CONTROLLED" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions/${rx_id}/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions/${rx_id}/transmit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /prescriptions/${rx_id}/dispense"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          assert:
            - "Patient.${pat_id}.active_medication_count == 1 after dispense (link 1)"
            - "HedisMeasure.${hm_id}.status == NUMERATOR_COMPLIANT (link 2)"
            - "Patient.${pat_id}.open_care_gaps == 0 after dispense (link 2)"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sign_state_beats_epcs_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: "Pair state (priority 6, ERR_INVALID_STATE) vs business_safety (priority 8, ERR_EPCS_REQUIREMENTS_NOT_MET): a DRAFT controlled prescription signed without two_factor_token fails BOTH, and the lower-priority state error wins (ERR_INVALID_STATE)."
        test_recipe:
          setup:
            - "Controlled C_II prescription still in DRAFT (never submitted); prescriber NOT epcs_enrolled and no token"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000050", full_name: "Dr H", specialty: "FAMILY_MEDICINE", epcs_enrolled: false }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Pat", last_name: "Eight", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T14:00:00Z", scheduled_end: "2026-06-01T14:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_id: "${visit_id}", drug_name: "Oxycodone", schedule: "C_II" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /prescriptions/${rx_id}/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE (state priority 6 beats safety priority 8)"

      - name: vaccine_safety_beats_slot_overlap_is_distinct_pair
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: "Pair business_safety (priority 9, ERR_VACCINE_INTERVAL_VIOLATION) vs business_temporal (priority 10, ERR_SLOT_OVERLAP): a vaccination check-in that violates the dose interval is rejected by the safety error; the overlap rule is on a different endpoint/priority, so the safety check fires first on check-in."
        test_recipe:
          setup:
            - "Patient with a prior FLU vaccination visit CHECKED_IN at 2026-06-01; a second FLU visit scheduled 2026-06-10 (9 days later, < 28) now being checked in"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "1000000051", full_name: "Dr I", specialty: "PEDIATRICS" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Vax", last_name: "Nine", date_of_birth: "2021-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "VACCINATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:15:00Z", vaccine_code: "FLU" }
              as: FrontDesk
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "VACCINATION", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:15:00Z", vaccine_code: "FLU" }
              as: FrontDesk
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /visits/${v2}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_VACCINE_INTERVAL_VIOLATION (business_safety, distinct from the business_temporal overlap rule)"

  # ===================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: panel_at_capacity_ge_boundary
        grounds:
          - validations[priority=12]
          - calculations.panel_size
          - entities.Provider.fields.panel_capacity
        distinguishing_aspect: "Numeric >= boundary on POST /providers/{id}/panel: with panel_capacity=1, binding the first patient succeeds (panel_size 0->1), binding a second is rejected because panel_size(1) >= panel_capacity(1)."
        test_recipe:
          setup:
            - "Provider panel_capacity=1; two ACTIVE patients; first patient bound (panel_size=1)"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000060", full_name: "Dr J", specialty: "FAMILY_MEDICINE", panel_capacity: 1 }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "A", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat1: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "B", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat2: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat1}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
              captures: { prov_v2: $.data.version }
          trigger:
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat2}", expected_provider_version: "${prov_v2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_PANEL_AT_CAPACITY (panel_size 1 >= panel_capacity 1)"

      - name: hedis_rate_empty_denominator_zero
        grounds:
          - calculations.hedis_compliance_rate
          - validations[priority=5]
        distinguishing_aspect: "Empty-set boundary on GET /hedis/rate (different metric and endpoint than panel capacity): when zero eligible non-excluded measures exist for the (measure_type, year), denominator==0 and rate_pct==0 with no divide-by-zero."
        test_recipe:
          setup:
            - "No HedisMeasure rows exist for CBP_BP_CONTROL year 2026"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: QualityAnalyst
          trigger:
            - call: "GET /hedis/rate?measure_type=CBP_BP_CONTROL&measurement_year=2026&method=ADMINISTRATIVE"
              payload: { measure_type: "CBP_BP_CONTROL", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { num: $.data.numerator, den: $.data.denominator, rate: $.data.rate_pct }
          assert:
            - "response: denominator == 0, numerator == 0, rate_pct == 0"

  # ===================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_checkin_requires_active_provider
        grounds:
          - state_machines.Visit.SCHEDULED_to_CHECKED_IN
          - state_machines.Provider.ACTIVE_to_INACTIVE
        distinguishing_aspect: "Visit->Provider pair: a SCHEDULED visit cannot be checked in once its provider is INACTIVE; the deactivation also unbinds the patient, so check-in is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Visit SCHEDULED for a provider that is then deactivated (INACTIVE)"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000070", full_name: "Dr K", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Ten", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T15:00:00Z", scheduled_end: "2026-06-01T15:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /providers/${prov_id}/deactivate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE (provider INACTIVE blocks check-in)"

      - name: referral_authorize_requires_patient_pcp_bound
        grounds:
          - state_machines.Referral.REQUESTED_to_AUTHORIZED
          - validations[priority=11]
          - entities.Patient.fields.pcp_id
        distinguishing_aspect: "Referral->Patient pair (different from Visit->Provider): authorizing a REQUESTED referral is rejected with ERR_NO_PCP_BOUND when the referred patient's pcp_id is null."
        test_recipe:
          setup:
            - "Patient with pcp_id null; a REQUESTED referral for that patient"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000071", full_name: "Dr L", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Eleven", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_id: "${prov_id}", target_specialty: "CARDIOLOGY", priority: "ROUTINE" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_NO_PCP_BOUND (patient has no bound PCP)"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_slot_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
        distinguishing_aspect: "Half-open [start,end) overlap on the Provider schedule resource: a second visit 09:15-09:45 overlaps an existing 09:00-09:30 visit (shared interval 09:15-09:30) and is rejected; a back-to-back 09:30-10:00 visit would NOT overlap (touching endpoints excluded)."
        test_recipe:
          setup:
            - "Provider with an existing SCHEDULED visit 09:00-09:30"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000080", full_name: "Dr M", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Twelve", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat1: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Thirteen", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat2: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat1}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat2}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:15:00Z", scheduled_end: "2026-06-01T09:45:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_SLOT_OVERLAP (09:15-09:45 overlaps 09:00-09:30)"

      - name: vaccine_minimum_gap_spacing
        grounds:
          - validations[priority=9]
          - entities.Visit.fields.vaccine_code
        distinguishing_aspect: "Minimum-spacing/gap semantics on the Patient immunization resource (different interval arithmetic than half-open overlap): a second FLU dose 9 days after the first (< 28-day VACCINE_MIN_INTERVAL_DAYS) is rejected on check-in, regardless of provider schedule overlap."
        test_recipe:
          setup:
            - "Patient with a prior FLU vaccination CHECKED_IN at 2026-06-01; a second FLU visit scheduled 2026-06-10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "1000000081", full_name: "Dr N", specialty: "PEDIATRICS" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Fourteen", date_of_birth: "2021-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "VACCINATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:15:00Z", vaccine_code: "FLU" }
              as: FrontDesk
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "VACCINATION", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:15:00Z", vaccine_code: "FLU" }
              as: FrontDesk
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /visits/${v2}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_VACCINE_INTERVAL_VIOLATION (9-day gap < 28-day minimum)"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: panel_membership_conserved_on_bind_then_deactivate
        grounds:
          - calculations.panel_size
          - state_machines.Provider.ACTIVE_to_INACTIVE
          - state_machines.Patient.ACTIVE_to_INACTIVE
        distinguishing_aspect: "Conserved quantity = total active panel memberships, pinned as sum over providers of panel_size == count(Patient where status==ACTIVE and pcp_id non-null). Binding a patient (+1) then deactivating that patient (-1) leaves Provider.panel_size back at its pre-bind value (1 -> 2 -> 1)."
        test_recipe:
          setup:
            - "Provider panel_capacity=5 with one bound patient (panel_size=1); a second ACTIVE patient bound then deactivated"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000090", full_name: "Dr O", specialty: "FAMILY_MEDICINE", panel_capacity: 5 }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Fifteen", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat1: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Sixteen", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat2: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat1}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
              captures: { prov_v2: $.data.version }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat2}", expected_provider_version: "${prov_v2}" }
              as: FrontDesk
              captures: { size_after_bind: $.data.panel_size }
          trigger:
            - call: "POST /patients/${pat2}/deactivate"
              payload: {}
              as: FrontDesk
            - call: "GET /providers/${prov_id}"
              payload: {}
              as: FrontDesk
              captures: { size_after: $.data.panel_size }
          assert:
            - "Provider.${prov_id}.panel_size == 2 after second bind"
            - "Provider.${prov_id}.panel_size == 1 after pat2 deactivate (compensated back, no drift)"

      - name: patient_balance_conserved_on_finalize_then_payment
        grounds:
          - calculations.patient_lifetime_charges
          - calculations.patient_outstanding_balance
          - state_machines.Visit.CODED_to_FINALIZED
        distinguishing_aspect: "Conserved quantity = patient outstanding monetary balance, pinned as outstanding_balance_cents == lifetime_charges_cents - sum(payments). Finalizing a visit (+10800 charge) then recording a 10800 payment leaves outstanding_balance_cents back at 0 (forward charge offset by compensating payment)."
        test_recipe:
          setup:
            - "Patient with a CODED PHYSICAL visit whose final total is 10800"
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000091", full_name: "Dr P", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "P", last_name: "Seventeen", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "PRV09", short_description: "Preventive physical", category: "PREVENTIVE", base_fee_cents: 12000 }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "PHYSICAL", scheduled_start: "2026-06-01T16:00:00Z", scheduled_end: "2026-06-01T16:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "PRV09", units: 1 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${visit_id}/finalize"
              payload: {}
              as: Biller
              captures: { bal_after_finalize: $.data.billed_total_cents }
          trigger:
            - call: "POST /patients/${pat_id}/payments"
              payload: { amount_cents: 10800 }
              as: Biller
              captures: { bal_after: $.data.outstanding_balance_cents }
          assert:
            - "Patient.${pat_id}.outstanding_balance_cents == 10800 after finalize (before payment)"
            - "Patient.${pat_id}.outstanding_balance_cents == 0 after 10800 payment (compensated, no drift)"
