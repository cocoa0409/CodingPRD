            - "over_err == ERR_INSUFFICIENT_PROCEEDS (HTTP 422) at 90001"
            - "Distribution.${dist23} created 201 PENDING at exactly 90000, then approve -> PAID"
            - "after approval: SeizureCase.${kc23}.available_proceeds_cents == 0 (the exact-pool boundary drains to zero without going negative)"

