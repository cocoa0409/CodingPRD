          assert:
            - "st_draft == DRAFT"
            - "sub_by == null  (revision cleared the prior submitter)"
            - "st_submitted == SUBMITTED  (loop closed)"

      - name: contract_terminate_rejects_pending_tickets
        claim_type: side_effect_execution
        grounds: [state_machines.VendorContract.ACTIVE_to_TERMINATED, state_machines.WeightTicket.PENDING_to_REJECTED]
        distinguishing_aspect: "Terminating an ACTIVE contract cascades to its PENDING tickets (reason CONTRACT_TERMINATED) and shrinks the period's provisional totals; VALIDATED tickets are untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 PENDING net 1000; T2 VALIDATED net 2000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site TM", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "TM-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "TM-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /tickets/${t2_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: SustainabilityManager
              captures: { c_status: $.data.status }
            - call: "GET /tickets/${t1_id}"
              payload: {}
              as: CertificationOfficer
              captures: { t1_status: $.data.validation_status, t1_reason: $.data.rejection_reason }
            - call: "GET /tickets/${t2_id}"
              payload: {}
              as: CertificationOfficer
              captures: { t2_status: $.data.validation_status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { prov_total: $.data.total_waste_lbs_provisional }
          assert:
            - "c_status == TERMINATED"
            - "t1_status == REJECTED"
            - "t1_reason == CONTRACT_TERMINATED"
            - "t2_status == VALIDATED  (only PENDING tickets are cascaded)"
            - "prov_total == 2000  (provisional set lost only T1)"

      - name: vendor_reactivate_restores_contracts_not_tickets
        claim_type: side_effect_execution
        grounds: [state_machines.Vendor.SUSPENDED_to_ACTIVE, state_machines.VendorContract.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Reactivating a vendor restores its SUSPENDED contracts to ACTIVE but does NOT reopen tickets rejected during the suspension — the rejection is sticky."
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 PENDING; vendor then SUSPENDED (contract SUSPENDED, T1 REJECTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site RA", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "RA-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/set_status"
              payload: { to_status: "SUSPENDED" }
              as: CertificationOfficer
          trigger:
            - call: "POST /vendors/${vendor_id}/set_status"
              payload: { to_status: "ACTIVE" }
              as: CertificationOfficer
              captures: { v_status: $.data.status }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: CertificationOfficer
              captures: { c_status: $.data.status }
            - call: "GET /tickets/${t1_id}"
              payload: {}
              as: CertificationOfficer
              captures: { t1_status: $.data.validation_status }
          assert:
            - "v_status == ACTIVE"
            - "c_status == ACTIVE  (contract restored)"
            - "t1_status == REJECTED  (rejection is sticky; no automatic reopen)"

      - name: ticket_resubmit_cycle_corner
        claim_type: valid_transition
        grounds: [state_machines.WeightTicket.REJECTED_to_PENDING]
        excluded_because:
          difficulty_instance: ticket_reject_resubmit_cycle
          rationale: "The PENDING -> REJECTED -> PENDING -> VALIDATED cycle is asserted stepwise in the named §1.8 instance."

      - name: training_reopen_cycle_corner
        claim_type: valid_transition
        grounds: [state_machines.ContaminationEvent.TRAINING_COMPLETED_to_OPEN]
        excluded_because:
          difficulty_instance: contamination_training_reopen_cycle
          rationale: "The failed-verification reopen loop and successful re-verification are asserted in the named §1.8 instance."

      - name: vendor_suspend_cascade_corner
        claim_type: side_effect_execution
        grounds: [state_machines.Vendor.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: vendor_suspend_transitive_cascade
          rationale: "The depth-3 vendor -> contract -> ticket -> period cascade is asserted in the named §1.8 instance."

      - name: critical_event_void_cascade_corner
        claim_type: side_effect_execution
        grounds: [state_machines.WeightTicket.VALIDATED_to_VOIDED]
        excluded_because:
          difficulty_instance: critical_contamination_void_cascade
          rationale: "The CRITICAL event -> void -> period recompute cascade is asserted in the named §1.8 instance."

  # ============================================================== Calculations
  - section: calculations
    instances:
      - name: contamination_severity_boundaries
        claim_type: constants_applied
        grounds: [calculations.contamination_severity]
        distinguishing_aspect: "Severity floors are inclusive: pct 4.9 -> MINOR, pct 5.0 -> MAJOR, pct 10.0 -> CRITICAL (boundary values land on the higher band)."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site SB", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 4.9 }
              as: WasteAuditor
              captures: { sev_minor: $.data.severity }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 5.0 }
              as: WasteAuditor
              captures: { sev_major: $.data.severity }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 10.0 }
              as: WasteAuditor
              captures: { sev_critical: $.data.severity }
          assert:
            - "sev_minor == MINOR  (4.9 < 5)"
            - "sev_major == MAJOR  (5.0 inclusive floor)"
            - "sev_critical == CRITICAL  (10.0 inclusive floor)"

      - name: goal_contamination_events_at_target_achieved
        claim_type: correct_result
        grounds: [calculations.goal_evaluation]
        distinguishing_aspect: "CONTAMINATION_EVENTS uses <= : exactly one non-DISMISSED in-window event against a target of 1 evaluates ACHIEVED (boundary inclusive)."
        test_recipe:
          setup:
            - "Site; period [2026-08-01,2026-09-01) OPEN; goal CONTAMINATION_EVENTS target 1 window [2026-08-01,2026-09-01); one OPEN event with event_date 2026-08-05"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site GE", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "CONTAMINATION_EVENTS", target_value: 1, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: SustainabilityManager
              captures: { goal_id: $.data.id }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 3 }
              as: WasteAuditor
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CertificationOfficer
              captures: { goal_status: $.data.status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { ev_count: $.data.contamination_event_count }
          assert:
            - "ev_count == 1"
            - "goal_status == ACHIEVED  (1 <= 1, boundary inclusive)"

      - name: dismissed_event_excluded_from_count
        claim_type: input_set_filtering
        grounds: [calculations.goal_evaluation, entities.ScorecardPeriod.fields.contamination_event_count]
        distinguishing_aspect: "DISMISSED events are excluded from contamination_event_count: a dismissed event leaves the count at 0 and a target-0 goal evaluates ACHIEVED."
        test_recipe:
          setup:
            - "Site; period [2026-08-01,2026-09-01) OPEN; goal CONTAMINATION_EVENTS target 0; one event in window, then DISMISSED"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site DX", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "CONTAMINATION_EVENTS", target_value: 0, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: SustainabilityManager
              captures: { goal_id: $.data.id }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "MIXED_RECYCLABLES", contamination_pct: 3 }
              as: WasteAuditor
              captures: { ev_id: $.data.id }
            - call: "POST /contamination_events/${ev_id}/dismiss"
              payload: { reason: "duplicate observation" }
              as: WasteAuditor
          trigger:
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CertificationOfficer
              captures: { goal_status: $.data.status }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { ev_count: $.data.contamination_event_count }
          assert:
            - "ev_count == 0  (DISMISSED excluded)"
            - "goal_status == ACHIEVED  (0 <= 0)"

      - name: standing_watch_at_two_open_events
        claim_type: correct_result
        grounds: [calculations.program_standing]
        distinguishing_aspect: "program_standing turns WATCH at exactly 2 non-terminal non-CRITICAL events: 1 event -> GOOD_STANDING, 2 events -> WATCH (count boundary, no CRITICAL involved)."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site SW", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-05", material_stream: "CARDBOARD", contamination_pct: 3 }
              as: WasteAuditor
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CertificationOfficer
              captures: { standing_1: $.data.program_standing }
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-06", material_stream: "MIXED_RECYCLABLES", contamination_pct: 6 }
              as: WasteAuditor
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CertificationOfficer
              captures: { standing_2: $.data.program_standing }
          assert:
            - "standing_1 == GOOD_STANDING  (single non-terminal event is below the WATCH floor)"
            - "standing_2 == WATCH  (2 non-terminal events, none CRITICAL)"

      - name: tiered_rebate_formula_corner
        claim_type: correct_result
        grounds: [calculations.ticket_rebate_estimate]
        excluded_because:
          difficulty_instance: rebate_estimate_tiered_quality_factor
          rationale: "Tiered factor, penalty activation, and the LANDFILL route gate asserted with literals in the named §1.8 instance."

      - name: per_ticket_rounding_corner
        claim_type: precision
        grounds: [calculations.cost_avoidance]
        excluded_because:
          difficulty_instance: cost_avoidance_per_ticket_rounding
          rationale: "Pinned per-ticket-then-sum rounding order asserted against the sum-then-round trap in the named §1.8 instance."

      - name: threshold_boundary_approval_corner
        claim_type: correct_result
        grounds: [calculations.certification_threshold]
        excluded_because:
          difficulty_instance: zero_waste_threshold_exactly_90
          rationale: "The inclusive >= 90.0 boundary approval is asserted in the named §1.8 instance; the 89.99 rejection is covered by corner threshold_not_met_8999_rejected."

      - name: zero_validated_close_corner
        claim_type: correct_result
        grounds: [calculations.diversion_rate]
        excluded_because:
          difficulty_instance: close_period_zero_validated_tickets
          rationale: "Zero-denominator pinned behavior (0.00, zero settlements, MISSED goal) asserted in the named §1.8 instance."

  # ============================================================== Validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED"]
        distinguishing_aspect: "A request without X-User-Role fails priority-1 auth with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site AU1", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "http status == 401"

      - name: duplicate_ticket_ref_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_TICKET_REF"]
        distinguishing_aspect: "(vendor_id, external_ticket_ref) is unique: a second ticket from the same vendor with the same ref fails with ERR_DUPLICATE_TICKET_REF."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE; T1 created with external_ticket_ref DUP-1"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site DP", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "DUP-1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-06", external_ticket_ref: "DUP-1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_TICKET_REF"

      - name: invalid_weights_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WEIGHTS"]
        distinguishing_aspect: "gross_weight_lbs == tare_weight_lbs (1000 == 1000) is rejected with ERR_INVALID_WEIGHTS (422); gross must be strictly greater."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site IW", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
