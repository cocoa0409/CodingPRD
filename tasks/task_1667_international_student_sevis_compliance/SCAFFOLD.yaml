# =============================================================================
# Scaffold: International Student SEVIS Compliance (DSO office)
# =============================================================================

scenario: |
  International Student SEVIS Compliance (designated school official office):
  admission-to-I-20 issuance & financial documentation, SEVIS record
  creation/update & registration each term, full-course-load exception &
  reduced-load authorization, employment authorization (CPT/OPT) recommendation
  & tracking, address/program-change reporting deadlines, transfer-out/in &
  program extension, status violation & reinstatement, travel signature &
  re-entry

domain_name: international-student-sevis-compliance
api_prefix: /sevis

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: sevis_id, type: string, source: input, description: "SEVIS ID, format N followed by 10 digits", constraints: "unique; regex ^N[0-9]{10}$" }
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD" }
      - { name: country_of_citizenship, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: degree_level, type: enum, source: input, description: "UNDERGRADUATE | GRADUATE" }
      - { name: compliance_posture, type: enum, source: computed, default: CLEAR, description: "CLEAR | AT_RISK | VIOLATION_OPEN; derived per compliance_posture calculation" }

  - name: FinancialDocument
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student" }
      - { name: document_type, type: enum, source: input, description: "BANK_STATEMENT | SCHOLARSHIP_LETTER | SPONSOR_AFFIDAVIT" }
      - { name: amount_usd_cents, type: integer, source: input, description: "Documented funds in USD cents", constraints: ">= 0" }
      - { name: issue_date, type: string, source: input, description: "ISO date the document was issued by the institution" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: review_note, type: string, source: input, description: "Optional reviewer note", default: null }

  - name: SevisRecord
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student (1:1 with Student)" }
      - { name: program_start_date, type: string, source: input, description: "ISO date program starts" }
      - { name: program_end_date, type: string, source: input, description: "ISO date program ends; mutated by approved ProgramExtension" }
      - { name: status, type: enum, source: system, description: "DRAFT | INITIAL | ACTIVE | COMPLETED | TERMINATED | REINSTATEMENT_PENDING | TRANSFERRED_OUT" }
      - { name: termination_reason, type: string, source: input, description: "Reason recorded at termination", default: null }

  - name: I20Form
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student" }
      - { name: sevis_record_id, type: string, source: input, description: "FK -> SevisRecord.id; record this form documents" }
      - { name: program_name, type: string, source: input, description: "Program / major name printed on the form" }
      - { name: program_start_date, type: string, source: input, description: "ISO date; defaults from SevisRecord when omitted", default: null }
      - { name: program_end_date, type: string, source: input, description: "ISO date; defaults from SevisRecord when omitted", default: null }
      - { name: tuition_cents, type: integer, source: input, description: "Estimated tuition line, whole cents", constraints: ">= 0" }
      - { name: living_cents, type: integer, source: input, description: "Estimated living-expense line, whole cents", constraints: ">= 0" }
      - { name: insurance_cents, type: integer, source: input, description: "Estimated insurance line, whole cents", constraints: ">= 0" }
      - { name: other_cents, type: integer, source: input, description: "Estimated other-costs line, whole cents", constraints: ">= 0" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "tuition_cents + living_cents + insurance_cents + other_cents" }
      - { name: verified_funding_cents, type: integer, source: computed, description: "Sum of VERIFIED FinancialDocument.amount_usd_cents for student within freshness window at issue time" }
      - { name: provisional_funding_cents, type: integer, source: computed, description: "Sum of SUBMITTED + VERIFIED documents within freshness window at issue time" }
      - { name: supersedes_i20_form_id, type: string, source: input, description: "FK -> I20Form.id; prior ISSUED form this one replaces (program change / extension)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | SUPERSEDED | CANCELLED" }

  - name: TermEnrollment
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; enrolled student" }
      - { name: term_code, type: string, source: input, description: "Term identifier, e.g. 2026-FALL", constraints: "unique per (student_id, term_code)" }
      - { name: term_start_date, type: string, source: input, description: "ISO date term starts" }
      - { name: term_end_date, type: string, source: input, description: "ISO date term ends; must be > term_start_date" }
      - { name: enrolled_credits, type: integer, source: input, description: "Credits enrolled", constraints: ">= 0" }
      - { name: effective_min_credits, type: integer, source: computed, description: "Full-time floor after approved RCL, per full_time_requirement calculation" }
      - { name: status, type: enum, source: system, description: "PENDING | REGISTERED | NOT_ENROLLED | COMPLETED" }

  - name: ReducedCourseLoad
    parent: TermEnrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> TermEnrollment.id; enrollment the RCL applies to" }
      - { name: reason_category, type: enum, source: input, description: "ACADEMIC | MEDICAL | FINAL_TERM" }
      - { name: requested_credits, type: integer, source: input, description: "Planned reduced load", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED" }
      - { name: decision_note, type: string, source: input, description: "Optional note recorded at decision", default: null }

  - name: EmploymentAuthorization
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student the authorization belongs to" }
      - { name: auth_type, type: enum, source: input, description: "CPT | OPT_PRE | OPT_POST" }
      - { name: employer_name, type: string, source: input, description: "Employer name (required for CPT; optional for OPT)", default: null }
      - { name: hours_per_week, type: integer, source: input, description: "Authorized weekly hours", constraints: "> 0" }
      - { name: start_date, type: string, source: input, description: "ISO authorized start date" }
      - { name: end_date, type: string, source: input, description: "ISO authorized end date; must be > start_date" }
      - { name: uscis_receipt_number, type: string, source: input, description: "USCIS receipt recorded at FILE (OPT only)", default: null }
      - { name: unemployment_days_settled, type: integer, source: computed, default: 0, description: "OPT_POST only: elapsed days through yesterday minus covered days (settled variant)" }
      - { name: unemployment_days_as_of, type: integer, source: computed, default: 0, description: "OPT_POST only: elapsed days through today minus covered days (as-of projection variant)" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECOMMENDED | FILED | APPROVED | DENIED | CANCELLED | COMPLETED | REVOKED" }

  - name: EmploymentPeriod
    parent: EmploymentAuthorization
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: system, description: "FK -> EmploymentAuthorization.id; parent authorization" }
      - { name: employer_name, type: string, source: input, description: "Employer for this period" }
      - { name: start_date, type: string, source: input, description: "ISO period start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO period end (inclusive); null = ongoing", default: null }
      - { name: hours_per_week, type: integer, source: input, description: "Weekly hours worked", constraints: "> 0" }

  - name: TravelEndorsement
    parent: I20Form
    common_fields: true
    fields:
      - { name: i20_form_id, type: string, source: system, description: "FK -> I20Form.id; form bearing the travel signature" }
      - { name: travel_departure_date, type: string, source: input, description: "ISO intended departure date" }
      - { name: travel_return_date, type: string, source: input, description: "ISO intended return date; must be >= departure" }
      - { name: valid_until, type: string, source: computed, description: "ISO date: issue date + 12 months (record ACTIVE, no OPT_POST APPROVED) or + 6 months (any OPT_POST APPROVED)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | VOIDED" }

  - name: TransferRequest
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; transferring student" }
      - { name: direction, type: enum, source: input, description: "OUT | IN" }
      - { name: target_school_code, type: string, source: input, description: "SEVIS school code of the other institution" }
      - { name: release_date, type: string, source: input, description: "ISO date the record is released (OUT) / expected (IN)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | RELEASED | CANCELLED" }

  - name: ProgramExtension
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; student requesting extension" }
      - { name: new_program_end_date, type: string, source: input, description: "ISO requested new program end date; must be > current program_end_date" }
      - { name: reason, type: string, source: input, description: "Academic reason for extension" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED" }
      - { name: decision_note, type: string, source: input, description: "Optional note at decision", default: null }

  - name: StatusViolation
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; student in violation" }
      - { name: violation_type, type: enum, source: input, description: "FAILURE_TO_ENROLL | UNAUTHORIZED_EMPLOYMENT | UNEMPLOYMENT_LIMIT_EXCEEDED | ADDRESS_REPORT_OVERDUE | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "OPEN | REINSTATEMENT_PENDING | RESOLVED_REINSTATED | RESOLVED_DENIED | DISMISSED" }

  - name: AddressReport
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; reporting student" }
      - { name: move_date, type: string, source: input, description: "ISO date the student moved" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "US state, 2-letter code" }
      - { name: postal_code, type: string, source: input, description: "ZIP/postal code" }
      - { name: status, type: enum, source: computed, description: "REPORTED if filed within 10 days of move_date (inclusive), else FLAGGED_LATE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SevisRecord
    initial_state: DRAFT
    terminal_states: [COMPLETED, TRANSFERRED_OUT]
    transitions:
      - from: DRAFT
        to: INITIAL
        trigger: "POST /sevis/sevis-records/{id}/initialize"
        actor: DSO | PDSO
        preconditions:
          - "Record in DRAFT (ERR_RECORD_NOT_DRAFT)"
          - "An I20Form with sevis_record_id == record.id exists in ISSUED status (ERR_NO_ISSUED_I20)"
        side_effects: []

      - from: INITIAL
        to: ACTIVE
        trigger: "system (first successful POST /sevis/term-enrollments/{id}/register for this student)"
        actor: system
        preconditions:
          - "Record in INITIAL"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /sevis/sevis-records/{id}/terminate"
        actor: PDSO
        preconditions:
          - "Record in ACTIVE (ERR_RECORD_NOT_ACTIVE)"
        side_effects:
          - "Every EmploymentAuthorization of this student in DRAFT | RECOMMENDED | FILED | APPROVED transitions to REVOKED"
          - "Each such revocation recomputes Student.compliance_posture"
          - "The currently ISSUED I20Form of this record transitions to CANCELLED"
          - "Cancelling that I20Form voids each of its ACTIVE TravelEndorsements (-> VOIDED)"

      - from: TERMINATED
        to: REINSTATEMENT_PENDING
        trigger: "system (POST /sevis/status-violations/{id}/transition action=RECOMMEND_REINSTATEMENT on an OPEN violation of this student)"
        actor: system
        preconditions:
          - "Record in TERMINATED"
        side_effects: []

      - from: REINSTATEMENT_PENDING
        to: ACTIVE
        trigger: "system (POST /sevis/status-violations/{id}/transition action=RESOLVE outcome=REINSTATED)"
        actor: system
        preconditions:
          - "Record in REINSTATEMENT_PENDING"
        side_effects:
          - "Student.compliance_posture recomputed"

      - from: REINSTATEMENT_PENDING
        to: TERMINATED
        trigger: "system (POST /sevis/status-violations/{id}/transition action=RESOLVE outcome=DENIED)"
        actor: system
        preconditions:
          - "Record in REINSTATEMENT_PENDING"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (clock sweep: current_utc date > program_end_date + 60-day grace)"
        actor: system
        preconditions:
          - "Record in ACTIVE and clock date past program_end_date + 60 days"
          - "No EmploymentAuthorization of the student with auth_type == OPT_POST, status == APPROVED, and end_date >= clock date (post-completion OPT holds the record ACTIVE)"
        side_effects:
          - "Every EmploymentAuthorization in APPROVED transitions to COMPLETED"
          - "Student.compliance_posture recomputed"

      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "system (clock sweep: TransferRequest OUT for this student reaches release_date, REQUESTED -> RELEASED)"
        actor: system
        preconditions:
          - "Record in ACTIVE"
        side_effects:
          - "Each TermEnrollment of this student in PENDING transitions to NOT_ENROLLED"
          - "Each such enrollment flip recomputes Student.compliance_posture"

  - entity: I20Form
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /sevis/i20-forms/{id}/issue"
        actor: DSO | PDSO
        preconditions:
          - "Form in DRAFT (ERR_I20_NOT_DRAFT)"
          - "Parent SevisRecord status in {DRAFT, INITIAL, ACTIVE} (ERR_RECORD_NOT_ACTIVE)"
          - "verified_funding_cents >= estimated_total_cents (ERR_INSUFFICIENT_VERIFIED_FUNDING)"
          - "If supersedes_i20_form_id set, that form is currently ISSUED (ERR_I20_NOT_ISSUED)"
        side_effects:
          - "verified_funding_cents and provisional_funding_cents snapshot computed at issuance"
          - "If supersedes_i20_form_id set: prior form transitions ISSUED -> SUPERSEDED"
          - "Superseding the prior form voids each of its ACTIVE TravelEndorsements (-> VOIDED)"

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a replacement I20Form naming this form in supersedes_i20_form_id is issued, incl. extension-approval auto-issue)"
        actor: system
        preconditions: []
        side_effects:
          - "Each ACTIVE TravelEndorsement on this form transitions to VOIDED"

      - from: ISSUED
        to: CANCELLED
        trigger: "system (SevisRecord termination)"
        actor: system
        preconditions: []
        side_effects:
          - "Each ACTIVE TravelEndorsement on this form transitions to VOIDED"

  - entity: TermEnrollment
    initial_state: PENDING
    terminal_states: [NOT_ENROLLED, COMPLETED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /sevis/term-enrollments/{id}/register"
        actor: DSO | PDSO
        preconditions:
          - "Enrollment in PENDING (ERR_ENROLLMENT_NOT_REGISTERABLE)"
          - "Student's SevisRecord status in {INITIAL, ACTIVE} (ERR_RECORD_NOT_ACTIVE)"
          - "enrolled_credits >= effective_min_credits (ERR_BELOW_FULL_COURSE_LOAD)"
          - "Clock date <= term_start_date + 30 days (ERR_REGISTRATION_DEADLINE_PASSED)"
        side_effects:
          - "If SevisRecord was INITIAL, it transitions to ACTIVE"

      - from: PENDING
        to: NOT_ENROLLED
        trigger: "system (clock sweep: clock date > term_start_date + 30 days while still PENDING) OR system (record TRANSFERRED_OUT cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "On deadline sweep: a StatusViolation FAILURE_TO_ENROLL is created OPEN for the student"
          - "That violation creation recomputes Student.compliance_posture (-> VIOLATION_OPEN)"

      - from: REGISTERED
        to: COMPLETED
        trigger: "system (clock sweep: clock date > term_end_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReducedCourseLoad
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sevis/reduced-course-loads/{id}/decision decision=APPROVED"
        actor: DSO | PDSO
        preconditions:
          - "RCL in REQUESTED (ERR_RCL_NOT_REQUESTED)"
          - "Parent enrollment status in {PENDING, REGISTERED} (ERR_ENROLLMENT_NOT_REGISTERABLE)"
        side_effects:
          - "Parent enrollment.effective_min_credits recomputed per full_time_requirement"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /sevis/reduced-course-loads/{id}/decision decision=DENIED"
        actor: DSO | PDSO
        preconditions:
          - "RCL in REQUESTED (ERR_RCL_NOT_REQUESTED)"
        side_effects: []

  - entity: EmploymentAuthorization
    initial_state: DRAFT
    terminal_states: [DENIED, CANCELLED, COMPLETED, REVOKED]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=RECOMMEND"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in DRAFT (ERR_AUTH_INVALID_STATE)"
          - "Student's SevisRecord status == ACTIVE (ERR_RECORD_NOT_ACTIVE)"
          - "An I20Form for the student exists in ISSUED status (ERR_I20_NOT_ISSUED)"
          - "end_date <= SevisRecord.program_end_date for CPT and OPT_PRE (ERR_AUTH_WINDOW_INVALID)"
          - "OPT_POST start_date within [program_end_date + 1 day, program_end_date + 60 days] inclusive (ERR_OPT_WINDOW_CLOSED)"
        side_effects: []

      - from: RECOMMENDED
        to: DRAFT
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=REVISE"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in RECOMMENDED (ERR_AUTH_INVALID_STATE)"
        side_effects: []

      - from: RECOMMENDED
        to: FILED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=FILE with uscis_receipt_number"
        actor: Student
        preconditions:
          - "Authorization in RECOMMENDED (ERR_AUTH_INVALID_STATE)"
          - "auth_type in {OPT_PRE, OPT_POST} (ERR_AUTH_INVALID_STATE for CPT)"
          - "Clock date within [program_end_date - 90 days, program_end_date + 60 days] inclusive (ERR_OPT_WINDOW_CLOSED)"
          - "Acting student owns this authorization (ERR_RESOURCE_NOT_OWNED)"
        side_effects:
          - "uscis_receipt_number recorded"

      - from: RECOMMENDED
        to: APPROVED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=ADJUDICATE outcome=APPROVED (CPT only)"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in RECOMMENDED (ERR_AUTH_INVALID_STATE)"
          - "auth_type == CPT (OPT must pass through FILED) (ERR_AUTH_INVALID_STATE)"
        side_effects: []

      - from: FILED
        to: APPROVED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=ADJUDICATE outcome=APPROVED (OPT only)"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in FILED (ERR_AUTH_INVALID_STATE)"
        side_effects:
          - "OPT_POST: unemployment day counters begin accruing from start_date"

      - from: FILED
        to: DENIED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=ADJUDICATE outcome=DENIED"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in FILED (ERR_AUTH_INVALID_STATE)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=CANCEL"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in DRAFT or RECOMMENDED (ERR_AUTH_INVALID_STATE)"
        side_effects: []

      - from: RECOMMENDED
        to: CANCELLED
        trigger: "POST /sevis/employment-authorizations/{id}/transition action=CANCEL"
        actor: DSO | PDSO
        preconditions:
          - "Authorization in DRAFT or RECOMMENDED (ERR_AUTH_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: COMPLETED
        trigger: "system (clock sweep: clock date > end_date) OR system (record completion cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: REVOKED
        trigger: "system (SevisRecord termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed"

      - from: RECOMMENDED
        to: REVOKED
        trigger: "system (SevisRecord termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed"

      - from: FILED
        to: REVOKED
        trigger: "system (SevisRecord termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed"

      - from: APPROVED
        to: REVOKED
        trigger: "system (SevisRecord termination cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Student.compliance_posture recomputed"

  - entity: TransferRequest
    initial_state: REQUESTED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RELEASED
        trigger: "system (clock sweep: clock date >= release_date, direction == OUT)"
        actor: system
        preconditions: []
        side_effects:
          - "Student's SevisRecord transitions ACTIVE -> TRANSFERRED_OUT"
          - "That record transition flips each PENDING TermEnrollment to NOT_ENROLLED"
          - "Each enrollment flip recomputes Student.compliance_posture"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sevis/transfer-requests/{id}/cancel"
        actor: DSO | PDSO
        preconditions:
          - "Request in REQUESTED (ERR_TRANSFER_NOT_CANCELLABLE)"
          - "Clock date < release_date (ERR_TRANSFER_NOT_CANCELLABLE)"
        side_effects: []

  - entity: ProgramExtension
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sevis/program-extensions/{id}/decision decision=APPROVED"
        actor: DSO | PDSO
        preconditions:
          - "Extension in REQUESTED (ERR_EXTENSION_NOT_REQUESTED)"
          - "Student's SevisRecord status == ACTIVE (ERR_RECORD_NOT_ACTIVE)"
          - "Clock date <= current program_end_date (ERR_EXTENSION_WINDOW_CLOSED)"
          - "Verified funding within freshness window >= prorated extension cost (ERR_INSUFFICIENT_VERIFIED_FUNDING)"
        side_effects:
          - "SevisRecord.program_end_date = new_program_end_date; SevisRecord.version increments"
          - "A new I20Form is auto-created and ISSUED with prorated cost lines (extension_prorated_costs), supersedes_i20_form_id = previously ISSUED form"
          - "Previously ISSUED I20Form transitions to SUPERSEDED"
          - "That supersede voids each of its ACTIVE TravelEndorsements (-> VOIDED)"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /sevis/program-extensions/{id}/decision decision=DENIED"
        actor: DSO | PDSO
        preconditions:
          - "Extension in REQUESTED (ERR_EXTENSION_NOT_REQUESTED)"
        side_effects: []

  - entity: StatusViolation
    initial_state: OPEN
    terminal_states: [RESOLVED_REINSTATED, RESOLVED_DENIED, DISMISSED]
    transitions:
      - from: OPEN
        to: REINSTATEMENT_PENDING
        trigger: "POST /sevis/status-violations/{id}/transition action=RECOMMEND_REINSTATEMENT"
        actor: DSO | PDSO
        preconditions:
          - "Violation in OPEN (ERR_VIOLATION_INVALID_STATE)"
          - "Student's SevisRecord status == TERMINATED (ERR_RECORD_NOT_TERMINATED)"
        side_effects:
          - "SevisRecord transitions TERMINATED -> REINSTATEMENT_PENDING"

      - from: REINSTATEMENT_PENDING
        to: RESOLVED_REINSTATED
        trigger: "POST /sevis/status-violations/{id}/transition action=RESOLVE outcome=REINSTATED"
        actor: PDSO
        preconditions:
          - "Violation in REINSTATEMENT_PENDING (ERR_VIOLATION_INVALID_STATE)"
        side_effects:
          - "SevisRecord transitions REINSTATEMENT_PENDING -> ACTIVE"
          - "Student.compliance_posture recomputed"

      - from: REINSTATEMENT_PENDING
        to: RESOLVED_DENIED
        trigger: "POST /sevis/status-violations/{id}/transition action=RESOLVE outcome=DENIED"
        actor: PDSO
        preconditions:
          - "Violation in REINSTATEMENT_PENDING (ERR_VIOLATION_INVALID_STATE)"
        side_effects:
          - "SevisRecord transitions REINSTATEMENT_PENDING -> TERMINATED"
          - "Student.compliance_posture recomputed"

      - from: OPEN
        to: DISMISSED
        trigger: "POST /sevis/status-violations/{id}/transition action=DISMISS"
        actor: DSO | PDSO
        preconditions:
          - "Violation in OPEN (ERR_VIOLATION_INVALID_STATE)"
        side_effects:
          - "Student.compliance_posture recomputed"

  - entity: FinancialDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /sevis/financial-documents/{id}/review decision=VERIFIED"
        actor: DSO | PDSO
        preconditions:
          - "Document in SUBMITTED (ERR_DOCUMENT_ALREADY_REVIEWED)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sevis/financial-documents/{id}/review decision=REJECTED"
        actor: DSO | PDSO
        preconditions:
          - "Document in SUBMITTED (ERR_DOCUMENT_ALREADY_REVIEWED)"
        side_effects: []

  - entity: TravelEndorsement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: clock date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: VOIDED
        trigger: "system (parent I20Form SUPERSEDED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: extension-request-stale-record
    parent_entity: SevisRecord
    write_endpoint: "POST /sevis/students/{id}/program-extensions"
    occ_field: "expected_sevis_record_version"
    description: |
      Creating a ProgramExtension against a SevisRecord whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just registered an extension request (or an
      approval advanced program_end_date) and the current writer's view of the
      record is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: endorsement-issue-stale-i20
    parent_entity: I20Form
    write_endpoint: "POST /sevis/i20-forms/{id}/travel-endorsements"
    occ_field: "expected_i20_form_version"
    description: |
      Issuing a travel endorsement against an I20Form whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just issued an endorsement (which reprints
      the document) and the current writer's view of the form is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: financial_coverage
    trigger: "I20Form issuance (POST /sevis/i20-forms/{id}/issue); ProgramExtension approval funding check"
    algorithm: aggregation
    formula: |
      FRESHNESS_WINDOW_DAYS = 183
      fresh(doc) = doc.issue_date >= (clock_date - 183 days) AND doc.issue_date <= clock_date
      provisional_funding_cents = sum(amount_usd_cents) over FinancialDocuments of the student
                                  with status IN {SUBMITTED, VERIFIED} AND fresh(doc)
      verified_funding_cents    = sum(amount_usd_cents) over FinancialDocuments of the student
                                  with status == VERIFIED AND fresh(doc)
      Issuance gate: verified_funding_cents >= I20Form.estimated_total_cents
    input_set: "FinancialDocuments of the I-20's student; only documents with issue_date within [clock_date - 183 days, clock_date] are included; documents issued in the future or older than 183 days are excluded"
    constants:
      FRESHNESS_WINDOW_DAYS: 183
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "Advisory pre-check displayed on the draft form (provisional_funding_cents)"
        difference: "Includes SUBMITTED documents, so it is >= verified variant whenever unverified documents exist"
      - name: verified
        when: "Issuance gate and extension-approval funding check"
        difference: "Counts only VERIFIED documents; produces a strictly smaller total whenever any counted document is SUBMITTED"

  - name: estimated_total_cents
    trigger: "I20Form creation and issuance"
    algorithm: aggregation
    formula: |
      estimated_total_cents = tuition_cents + living_cents + insurance_cents + other_cents
    input_set: "The four cost-line fields of the I20Form"
    precision: "integer cents; no rounding"

  - name: extension_prorated_costs
    trigger: "ProgramExtension approval (auto-created replacement I20Form)"
    algorithm: tiered_pricing
    formula: |
      days_extended = new_program_end_date - current program_end_date (in days, > 0)
      months_extended = ceil(days_extended / 30)
      For EACH cost line L in {tuition, living, insurance, other} of the current ISSUED I20Form:
        annual basis = L_cents (the current form's line is the annual basis)
        prorated_line_cents(L) = round_half_up(L_cents * months_extended / 12)
      PINNED ORDER: round each line to whole cents FIRST (round_half_up), THEN sum:
      new_estimated_total_cents = sum over lines of prorated_line_cents(L)
      (Summing raw prorated values and rounding once would give a different cent
      total; the per-line-then-sum order is the contract.)
    input_set: "Cost lines of the currently ISSUED I20Form for the record; day gap between current and new program_end_date"
    constants:
      DAYS_PER_MONTH: 30
      MONTHS_PER_YEAR: 12
    precision: "per-line round_half_up to whole cents, then integer sum"

  - name: full_time_requirement
    trigger: "TermEnrollment creation; RCL approval; register/PATCH credit checks"
    algorithm: threshold
    formula: |
      base_min = 12 if student.degree_level == UNDERGRADUATE else 9
      If no APPROVED RCL exists for this enrollment:
        effective_min_credits = base_min
      Else by RCL reason_category:
        ACADEMIC:   effective_min_credits = max(3, floor(base_min / 2))
                    and requested_credits must be >= that floor at creation
        MEDICAL:    effective_min_credits = requested_credits (may be 0)
        FINAL_TERM: effective_min_credits = max(1, requested_credits)
                    and requested_credits must be < base_min at creation
      Boundary: enrolled_credits >= effective_min_credits is full-time;
      exactly effective_min_credits passes (>=, not >).
    input_set: "Student.degree_level; the enrollment's APPROVED RCL (at most one per enrollment) with reason_category and requested_credits"
    constants:
      UG_MIN: 12
      GR_MIN: 9
      ACADEMIC_FLOOR_ABSOLUTE: 3
    precision: "integer credits"

  - name: rcl_eligibility
    trigger: "ReducedCourseLoad creation (POST /sevis/reduced-course-loads)"
    algorithm: aggregation
    formula: |
      ACADEMIC: at most one APPROVED/REQUESTED ACADEMIC RCL per student across all
        enrollments (once per program level); else ERR_RCL_REASON_EXHAUSTED
      MEDICAL: cumulative months covered by APPROVED/REQUESTED MEDICAL RCLs per
        student <= 12; a request whose (term_end - term_start) months would push
        the cumulative total over 12 -> ERR_RCL_REASON_EXHAUSTED
      FINAL_TERM: the enrollment's [term_start_date, term_end_date] must contain
        SevisRecord.program_end_date; else ERR_RCL_NOT_FINAL_TERM
      Creation window: clock date <= enrollment.term_start_date + 14 days
        (add/drop close); else ERR_RCL_ADD_DROP_CLOSED
    input_set: "All REQUESTED/APPROVED RCLs of the student; the enrollment term window; SevisRecord.program_end_date; clock"
    constants:
      MEDICAL_CUMULATIVE_MONTHS_MAX: 12
      ADD_DROP_DAYS: 14
    precision: "months counted as ceil(term days / 30)"

  - name: unemployment_days
    trigger: "EmploymentPeriod create/delete; clock sweep; GET of an OPT_POST EmploymentAuthorization"
    algorithm: forward_looking
    formula: |
      Only computed for auth_type == OPT_POST in status APPROVED (or later).
      covered_days = cardinality of the union of [p.start_date, min(p.end_date, horizon)]
                     over the authorization's EmploymentPeriods (end_date null = ongoing),
                     clipped to [authorization.start_date, horizon]
      Variant settled_count:
        horizon = clock_date - 1 day (only fully elapsed days)
        elapsed = max(0, horizon - authorization.start_date + 1) when horizon >= start else 0
        unemployment_days_settled = elapsed - covered_days(horizon)
      Variant as_of_projection:
        horizon = clock_date (includes today)
        elapsed = max(0, horizon - authorization.start_date + 1) when horizon >= start else 0
        unemployment_days_as_of = elapsed - covered_days(horizon)
      Sweep: when unemployment_days_settled > 90, the system opens a
      StatusViolation UNEMPLOYMENT_LIMIT_EXCEEDED (OPEN) for the student.
      Invariant: elapsed(horizon) == covered_days(horizon) + unemployment(horizon)
      for either variant; adding then deleting a period leaves unemployment unchanged.
    input_set: "EmploymentPeriods of this authorization only; days clipped to [authorization.start_date, horizon]; periods or parts of periods outside the authorization window are excluded"
    constants:
      UNEMPLOYMENT_LIMIT_DAYS: 90
      UNEMPLOYMENT_WARNING_DAYS: 75
    precision: "integer days; calendar-day granularity"
    variants:
      - name: settled_count
        when: "Violation sweep and posture computation"
        difference: "Horizon is yesterday; an uncovered 'today' is NOT counted, so settled == as_of - 1 on any uncovered current day"
      - name: as_of_projection
        when: "Advisory display on the authorization resource"
        difference: "Horizon is today inclusive; counts the current uncovered day, producing exactly one more day than settled when today is uncovered"

  - name: travel_endorsement_validity
    trigger: "TravelEndorsement creation"
    algorithm: threshold
    formula: |
      if the student has any EmploymentAuthorization with auth_type == OPT_POST
      and status IN {APPROVED, COMPLETED}:
        valid_until = issue date (clock date at creation) + 6 months
      else:
        valid_until = issue date + 12 months
      Re-entry rule (advisory): endorsement valid for re-entry when
      clock date <= valid_until AND endorsement status == ACTIVE.
    input_set: "Student's EmploymentAuthorizations (OPT_POST in APPROVED/COMPLETED switch the constant); clock date"
    constants:
      VALIDITY_MONTHS_ENROLLED: 12
      VALIDITY_MONTHS_OPT: 6
    precision: "ISO date; month arithmetic clamps to month end"

  - name: address_report_timeliness
    trigger: "AddressReport creation"
    algorithm: threshold
    formula: |
      report_deadline = move_date + 10 days
      status = REPORTED    if clock_date <= report_deadline
             = FLAGGED_LATE otherwise
      Boundary: filing exactly on move_date + 10 days is on time (<=).
    input_set: "The new AddressReport's move_date; clock date"
    constants:
      ADDRESS_REPORT_WINDOW_DAYS: 10
    precision: "ISO date; whole-day comparison"

  - name: compliance_posture
    trigger: "Violation create/resolve/dismiss; address report FLAGGED_LATE creation; unemployment counter change; authorization revocation; enrollment NOT_ENROLLED flip"
    algorithm: aggregation
    formula: |
      if any StatusViolation of the student has status IN {OPEN, REINSTATEMENT_PENDING}:
        compliance_posture = VIOLATION_OPEN
      elif any AddressReport of the student has status == FLAGGED_LATE
           OR any OPT_POST authorization has unemployment_days_settled >= 75:
        compliance_posture = AT_RISK
      else:
        compliance_posture = CLEAR
    input_set: "All StatusViolations, AddressReports, and OPT_POST EmploymentAuthorizations of the student"
    constants:
      UNEMPLOYMENT_WARNING_DAYS: 75
    precision: "enum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted on this endpoint; Student may only act on own resources (X-User-ID == owning Student.id); on /transition endpoints the action-specific role rule applies (FILE=Student, RESOLVE=PDSO)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS | ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: "ERR_NOT_FOUND / ERR_STUDENT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: concurrency
    check: "OCC expected_*_version fields must equal the parent entity's current version (program-extensions -> SevisRecord; travel-endorsements -> I20Form)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sevis/students/{id}/program-extensions; POST /sevis/i20-forms/{id}/travel-endorsements"
    note: "Version check runs BEFORE any business validation"

  - priority: 4
    category: state
    check: "Target resource must be in the required state for this transition (record DRAFT/ACTIVE/TERMINATED as applicable; enrollment PENDING; RCL REQUESTED; authorization DRAFT/RECOMMENDED/FILED; violation OPEN/REINSTATEMENT_PENDING; I20 DRAFT; document SUBMITTED; transfer REQUESTED)"
    error_id: "ERR_RECORD_NOT_DRAFT | ERR_RECORD_NOT_ACTIVE | ERR_RECORD_NOT_TERMINATED | ERR_ENROLLMENT_NOT_REGISTERABLE | ERR_RCL_NOT_REQUESTED | ERR_AUTH_INVALID_STATE | ERR_VIOLATION_INVALID_STATE | ERR_I20_NOT_DRAFT | ERR_DOCUMENT_ALREADY_REVIEWED | ERR_TRANSFER_NOT_CANCELLABLE | ERR_EXTENSION_NOT_REQUESTED"
    http_status: 409
    applies_to: "all action/transition endpoints; also POST /sevis/reduced-course-loads (parent enrollment must be PENDING or REGISTERED -> ERR_ENROLLMENT_NOT_REGISTERABLE)"

  - priority: 5
    category: business_safety
    check: "SEVIS structural preconditions: initialize requires an ISSUED I-20 (ERR_NO_ISSUED_I20); recommend requires an ISSUED I-20 (ERR_I20_NOT_ISSUED); recommend requires record ACTIVE; register requires record INITIAL/ACTIVE; reinstatement recommendation requires record TERMINATED"
    error_id: "ERR_NO_ISSUED_I20 | ERR_I20_NOT_ISSUED | ERR_RECORD_NOT_ACTIVE | ERR_RECORD_NOT_TERMINATED"
    http_status: 409
    applies_to: "initialize, register, recommend, recommend-reinstatement"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and overlap: sevis_id unique (ERR_DUPLICATE_SEVIS_ID); one SevisRecord per student (ERR_RECORD_ALREADY_EXISTS); (student_id, term_code) unique (ERR_DUPLICATE_ENROLLMENT); EmploymentPeriods of one authorization use day-coverage semantics: two periods may not share a calendar day, and a new period starting exactly one day after an existing period's end is allowed (zero-gap adjacency permitted) (ERR_EMPLOYMENT_PERIOD_OVERLAP); TravelEndorsement travel windows of one I20Form use closed-interval semantics: any intersection counts as overlap AND touching endpoints (new departure == existing return) also count as overlap (ERR_ENDORSEMENT_WINDOW_OVERLAP); RCL per-enrollment at most one REQUESTED/APPROVED (ERR_RCL_ALREADY_OPEN)"
    error_id: "ERR_DUPLICATE_SEVIS_ID | ERR_RECORD_ALREADY_EXISTS | ERR_DUPLICATE_ENROLLMENT | ERR_EMPLOYMENT_PERIOD_OVERLAP | ERR_ENDORSEMENT_WINDOW_OVERLAP | ERR_RCL_ALREADY_OPEN"
    http_status: 409
    applies_to: "creation endpoints for students, sevis-records, term-enrollments, employment-periods, travel-endorsements, reduced-course-loads"

  - priority: 7
    category: business_temporal
    check: "Deadline and window rules: register by term_start + 30 days (ERR_REGISTRATION_DEADLINE_PASSED); RCL creation by term_start + 14 days (ERR_RCL_ADD_DROP_CLOSED); PATCH of a REGISTERED enrollment after term_start + 14 days (ERR_ADD_DROP_CLOSED); OPT FILE within [program_end - 90d, program_end + 60d] and OPT_POST start within [program_end + 1d, program_end + 60d] (ERR_OPT_WINDOW_CLOSED); CPT/OPT_PRE end_date <= program_end_date (ERR_AUTH_WINDOW_INVALID); extension approval by current program_end_date (ERR_EXTENSION_WINDOW_CLOSED); extension request new end > current end (ERR_EXTENSION_NOT_FORWARD); FINAL_TERM RCL term contains program_end_date (ERR_RCL_NOT_FINAL_TERM)"
    error_id: "ERR_REGISTRATION_DEADLINE_PASSED | ERR_RCL_ADD_DROP_CLOSED | ERR_ADD_DROP_CLOSED | ERR_OPT_WINDOW_CLOSED | ERR_AUTH_WINDOW_INVALID | ERR_EXTENSION_WINDOW_CLOSED | ERR_EXTENSION_NOT_FORWARD | ERR_RCL_NOT_FINAL_TERM"
    http_status: 409
    applies_to: "register, reduced-course-loads, transition(FILE/RECOMMEND), program-extensions, decision(approve)"

  - priority: 8
    category: business_fiscal
    check: "Funding sufficiency: I-20 issuance requires verified fresh funding >= estimated_total_cents (ERR_INSUFFICIENT_VERIFIED_FUNDING); extension approval requires verified fresh funding >= prorated extension cost"
    error_id: ERR_INSUFFICIENT_VERIFIED_FUNDING
    http_status: 402
    applies_to: "POST /sevis/i20-forms/{id}/issue; POST /sevis/program-extensions/{id}/decision"

  - priority: 9
    category: business_constraint
    check: "Credit rules: enrolled_credits >= effective_min_credits to register or to PATCH without an APPROVED RCL (ERR_BELOW_FULL_COURSE_LOAD); RCL requested_credits within category floor (ERR_RCL_CREDITS_OUT_OF_RANGE); ACADEMIC RCL once per student, MEDICAL cumulative <= 12 months (ERR_RCL_REASON_EXHAUSTED)"
    error_id: "ERR_BELOW_FULL_COURSE_LOAD | ERR_RCL_CREDITS_OUT_OF_RANGE | ERR_RCL_REASON_EXHAUSTED"
    http_status: 422
    applies_to: "register, PATCH /sevis/term-enrollments/{id}, POST /sevis/reduced-course-loads"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock. Each set runs all due sweeps in order: (1) transfer releases at release_date, (2) endorsement expiries past valid_until, (3) enrollment registration-deadline sweeps (term_start + 30d), (4) record completions past program_end_date + 60d, (5) OPT_POST unemployment-limit violation check, (6) enrollment term-end completions."
    roles: [PDSO, DSO]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, sweeps_applied: string[] }"
    side_effects: ["Runs due sweeps per description order"]

  # --- Students ---
  - method: POST
    path: "/sevis/students"
    description: "Create a student intake record"
    roles: [PDSO, DSO]
    code: 201
    input: [sevis_id, full_name, email, date_of_birth, country_of_citizenship, degree_level]
    output: Student
    side_effects: ["compliance_posture initialized to CLEAR"]

  - method: GET
    path: "/sevis/students/{id}"
    description: "Get a student"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- Financial documents ---
  - method: POST
    path: "/sevis/students/{id}/financial-documents"
    description: "Submit a financial document for a student"
    roles: [PDSO, DSO, Student]
    code: 201
    input: [document_type, amount_usd_cents, issue_date]
    output: FinancialDocument
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/sevis/students/{id}/financial-documents"
    description: "List a student's financial documents"
    roles: [PDSO, DSO, Student]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FinancialDocument[]"
    side_effects: []

  - method: POST
    path: "/sevis/financial-documents/{id}/review"
    description: "Verify or reject a submitted financial document"
    roles: [PDSO, DSO]
    code: 200
    input: [decision, "note?"]
    output: FinancialDocument
    side_effects: ["status -> VERIFIED | REJECTED"]

  # --- SEVIS records ---
  - method: POST
    path: "/sevis/students/{id}/sevis-records"
    description: "Create the student's SEVIS record (1:1; second create -> ERR_RECORD_ALREADY_EXISTS)"
    roles: [PDSO, DSO]
    code: 201
    input: [program_start_date, program_end_date]
    output: SevisRecord
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/sevis/students/{id}/sevis-records"
    description: "List the student's SEVIS records (array of 0 or 1)"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "SevisRecord[]"
    side_effects: []

  - method: POST
    path: "/sevis/sevis-records/{id}/initialize"
    description: "Move record DRAFT -> INITIAL (requires an ISSUED I-20)"
    roles: [PDSO, DSO]
    code: 200
    input: []
    output: SevisRecord
    side_effects: []

  - method: POST
    path: "/sevis/sevis-records/{id}/terminate"
    description: "Terminate an ACTIVE record (PDSO only); cascades revocation of authorizations, cancels issued I-20, voids endorsements"
    roles: [PDSO]
    code: 200
    input: [termination_reason]
    output: SevisRecord
    side_effects:
      - "EmploymentAuthorizations in DRAFT/RECOMMENDED/FILED/APPROVED -> REVOKED"
      - "ISSUED I20Form -> CANCELLED; its ACTIVE TravelEndorsements -> VOIDED"
      - "Student.compliance_posture recomputed"

  # --- I-20 forms ---
  - method: POST
    path: "/sevis/students/{id}/i20-forms"
    description: "Create a DRAFT I-20 for the student's record (program change uses supersedes_i20_form_id naming the current ISSUED form)"
    roles: [PDSO, DSO]
    code: 201
    input: [sevis_record_id, program_name, "program_start_date?", "program_end_date?", tuition_cents, living_cents, insurance_cents, other_cents, "supersedes_i20_form_id?"]
    output: I20Form
    side_effects: ["status = DRAFT", "estimated_total_cents computed"]

  - method: GET
    path: "/sevis/i20-forms"
    description: "List I-20 forms with filters"
    roles: [PDSO, DSO, Student]
    code: 200
    input: ["student_id?", "sevis_record_id?", "supersedes_i20_form_id?", "status?"]
    output: "I20Form[]"
    side_effects: []

  - method: GET
    path: "/sevis/i20-forms/{id}"
    description: "Get an I-20 form"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: I20Form
    side_effects: []

  - method: POST
    path: "/sevis/i20-forms/{id}/issue"
    description: "Issue a DRAFT I-20; snapshots funding; supersedes the named prior form and voids its endorsements"
    roles: [PDSO, DSO]
    code: 200
    input: []
    output: I20Form
    side_effects:
      - "status DRAFT -> ISSUED"
      - "verified_funding_cents / provisional_funding_cents snapshot"
      - "superseded form -> SUPERSEDED; its ACTIVE TravelEndorsements -> VOIDED"

  # --- Term enrollments ---
  - method: POST
    path: "/sevis/term-enrollments"
    description: "Create a term enrollment (unique per student+term_code)"
    roles: [PDSO, DSO]
    code: 201
    input: [student_id, term_code, term_start_date, term_end_date, enrolled_credits]
    output: TermEnrollment
    side_effects: ["status = PENDING", "effective_min_credits computed (no RCL yet)"]

  - method: GET
    path: "/sevis/term-enrollments"
    description: "List term enrollments with filters"
    roles: [PDSO, DSO, Student]
    code: 200
    input: ["student_id?", "term_code?", "status?"]
    output: "TermEnrollment[]"
    side_effects: []

  - method: GET
    path: "/sevis/term-enrollments/{id}"
    description: "Get a term enrollment"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: TermEnrollment
    side_effects: []

  - method: PATCH
    path: "/sevis/term-enrollments/{id}"
    description: "Update enrolled_credits while PENDING, or while REGISTERED up to add/drop close (term_start + 14d); dropping below effective_min without an APPROVED RCL is rejected"
    roles: [PDSO, DSO, Student]
    code: 200
    input: [enrolled_credits]
    output: TermEnrollment
    side_effects: []

  - method: POST
    path: "/sevis/term-enrollments/{id}/register"
    description: "Register the enrollment in SEVIS; first registration flips the record INITIAL -> ACTIVE"
    roles: [PDSO, DSO]
    code: 200
    input: []
    output: TermEnrollment
    side_effects: ["status PENDING -> REGISTERED", "SevisRecord INITIAL -> ACTIVE on first registration"]

  # --- Reduced course load ---
  - method: POST
    path: "/sevis/reduced-course-loads"
    description: "Request an RCL for an enrollment"
    roles: [PDSO, DSO]
    code: 201
    input: [enrollment_id, reason_category, requested_credits]
    output: ReducedCourseLoad
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/sevis/term-enrollments/{id}/reduced-course-loads"
    description: "List RCLs of an enrollment"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "ReducedCourseLoad[]"
    side_effects: []

  - method: POST
    path: "/sevis/reduced-course-loads/{id}/decision"
    description: "Approve or deny a requested RCL; approval recomputes the enrollment's effective_min_credits"
    roles: [PDSO, DSO]
    code: 200
    input: [decision, "note?"]
    output: ReducedCourseLoad
    side_effects: ["status -> APPROVED | DENIED", "on APPROVED: enrollment.effective_min_credits recomputed"]

  # --- Employment authorization ---
  - method: POST
    path: "/sevis/employment-authorizations"
    description: "Create a CPT/OPT authorization in DRAFT"
    roles: [PDSO, DSO]
    code: 201
    input: [student_id, auth_type, "employer_name?", hours_per_week, start_date, end_date]
    output: EmploymentAuthorization
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/sevis/employment-authorizations"
    description: "List employment authorizations with filters"
    roles: [PDSO, DSO, Student]
    code: 200
    input: ["student_id?", "auth_type?", "status?"]
    output: "EmploymentAuthorization[]"
    side_effects: []

  - method: GET
    path: "/sevis/employment-authorizations/{id}"
    description: "Get an employment authorization (recomputes unemployment counters for OPT_POST)"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: EmploymentAuthorization
    side_effects: []

  - method: POST
    path: "/sevis/employment-authorizations/{id}/transition"
    description: "Drive the authorization state machine. action: RECOMMEND (DSO/PDSO), REVISE (DSO/PDSO), FILE (Student owner, OPT only, requires uscis_receipt_number), ADJUDICATE (DSO/PDSO, requires outcome APPROVED|DENIED; CPT: RECOMMENDED->APPROVED directly), CANCEL (DSO/PDSO from DRAFT/RECOMMENDED)"
    roles: [PDSO, DSO, Student]
    code: 200
    input: [action, "outcome?", "uscis_receipt_number?", "note?"]
    output: EmploymentAuthorization
    side_effects: ["state transition per EmploymentAuthorization state machine"]

  # --- Employment periods ---
  - method: POST
    path: "/sevis/employment-authorizations/{id}/employment-periods"
    description: "Report an employment period under an APPROVED authorization; half-open non-overlap enforced"
    roles: [PDSO, DSO, Student]
    code: 201
    input: [employer_name, start_date, "end_date?", hours_per_week]
    output: EmploymentPeriod
    side_effects: ["authorization unemployment counters recomputed"]

  - method: GET
    path: "/sevis/employment-authorizations/{id}/employment-periods"
    description: "List employment periods of an authorization"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "EmploymentPeriod[]"
    side_effects: []

  - method: DELETE
    path: "/sevis/employment-periods/{id}"
    description: "Delete an erroneously reported employment period; recomputes unemployment counters"
    roles: [PDSO, DSO]
    code: 204
    input: []
    output: null
    side_effects: ["authorization unemployment counters recomputed"]

  # --- Travel endorsements ---
  - method: POST
    path: "/sevis/i20-forms/{id}/travel-endorsements"
    description: "Issue a travel endorsement on an ISSUED I-20 (OCC on I20Form.version); travel windows must not intersect existing ACTIVE endorsements (closed-interval semantics)"
    roles: [PDSO, DSO]
    code: 201
    input: [expected_i20_form_version, travel_departure_date, travel_return_date]
    output: TravelEndorsement
    side_effects: ["status = ACTIVE", "valid_until computed", "increments I20Form.version by 1"]

  - method: GET
    path: "/sevis/i20-forms/{id}/travel-endorsements"
    description: "List travel endorsements of an I-20"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "TravelEndorsement[]"
    side_effects: []

  # --- Transfers ---
  - method: POST
    path: "/sevis/students/{id}/transfer-requests"
    description: "Create a transfer request (OUT: requires record ACTIVE and release_date >= clock date; IN: records an incoming student's expectation)"
    roles: [PDSO, DSO]
    code: 201
    input: [direction, target_school_code, release_date]
    output: TransferRequest
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/sevis/students/{id}/transfer-requests"
    description: "List a student's transfer requests"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "TransferRequest[]"
    side_effects: []

  - method: POST
    path: "/sevis/transfer-requests/{id}/cancel"
    description: "Cancel a REQUESTED transfer before its release date"
    roles: [PDSO, DSO]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status -> CANCELLED"]

  # --- Program extensions ---
  - method: POST
    path: "/sevis/students/{id}/program-extensions"
    description: "Request a program extension (OCC on SevisRecord.version); record must be ACTIVE and new end date must be strictly later than current program_end_date"
    roles: [PDSO, DSO]
    code: 201
    input: [new_program_end_date, reason, expected_sevis_record_version]
    output: ProgramExtension
    side_effects: ["status = REQUESTED", "increments SevisRecord.version by 1"]

  - method: GET
    path: "/sevis/students/{id}/program-extensions"
    description: "List a student's program extensions"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "ProgramExtension[]"
    side_effects: []

  - method: POST
    path: "/sevis/program-extensions/{id}/decision"
    description: "Approve or deny an extension; approval moves program_end_date, auto-issues a prorated replacement I-20 superseding the current one, voiding its endorsements"
    roles: [PDSO, DSO]
    code: 200
    input: [decision, "note?"]
    output: ProgramExtension
    side_effects:
      - "on APPROVED: SevisRecord.program_end_date = new_program_end_date; SevisRecord.version + 1"
      - "new I20Form auto-created ISSUED with prorated lines; prior ISSUED form -> SUPERSEDED"
      - "prior form's ACTIVE TravelEndorsements -> VOIDED"

  # --- Status violations ---
  - method: POST
    path: "/sevis/students/{id}/status-violations"
    description: "Open a status violation for a student"
    roles: [PDSO, DSO]
    code: 201
    input: [violation_type, description]
    output: StatusViolation
    side_effects: ["status = OPEN", "Student.compliance_posture recomputed"]

  - method: GET
    path: "/sevis/students/{id}/status-violations"
    description: "List a student's status violations"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "StatusViolation[]"
    side_effects: []

  - method: POST
    path: "/sevis/status-violations/{id}/transition"
    description: "Drive violation lifecycle. action: RECOMMEND_REINSTATEMENT (DSO/PDSO, requires record TERMINATED; flips record to REINSTATEMENT_PENDING), RESOLVE (PDSO only, requires outcome REINSTATED|DENIED), DISMISS (DSO/PDSO from OPEN)"
    roles: [PDSO, DSO]
    code: 200
    input: [action, "outcome?", "note?"]
    output: StatusViolation
    side_effects: ["state transition per StatusViolation state machine", "SevisRecord side effects per transition", "Student.compliance_posture recomputed"]

  # --- Address reports ---
  - method: POST
    path: "/sevis/students/{id}/address-reports"
    description: "Report a residential address; status REPORTED if within 10 days of move_date inclusive, else FLAGGED_LATE (posture -> AT_RISK)"
    roles: [PDSO, DSO, Student]
    code: 201
    input: [move_date, address_line1, city, state_code, postal_code]
    output: AddressReport
    side_effects: ["status computed per address_report_timeliness", "Student.compliance_posture recomputed"]

  - method: GET
    path: "/sevis/students/{id}/address-reports"
    description: "List a student's address reports"
    roles: [PDSO, DSO, Student]
    code: 200
    input: []
    output: "AddressReport[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or malformed date in request body" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint or action (e.g., Student calling a DSO-only action; DSO calling terminate or RESOLVE)" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Student role acting on a resource owned by a different student" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Referenced student id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_DUPLICATE_SEVIS_ID, http: 409, condition: "A student with this sevis_id already exists" }
  - { id: ERR_RECORD_ALREADY_EXISTS, http: 409, condition: "Student already has a SevisRecord (1:1)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "An enrollment for this student_id + term_code already exists" }
  - { id: ERR_RECORD_NOT_DRAFT, http: 409, condition: "Record must be DRAFT for initialize" }
  - { id: ERR_RECORD_NOT_ACTIVE, http: 409, condition: "Record must be ACTIVE (or INITIAL where noted) for this operation" }
  - { id: ERR_RECORD_NOT_TERMINATED, http: 409, condition: "Record must be TERMINATED for reinstatement recommendation" }
  - { id: ERR_NO_ISSUED_I20, http: 409, condition: "No ISSUED I-20 exists for the record" }
  - { id: ERR_I20_NOT_ISSUED, http: 409, condition: "Operation requires an ISSUED I-20 (endorsement issue, recommend, supersede source)" }
  - { id: ERR_I20_NOT_DRAFT, http: 409, condition: "I-20 must be DRAFT to issue" }
  - { id: ERR_INSUFFICIENT_VERIFIED_FUNDING, http: 402, condition: "Verified fresh funding below required amount at issuance or extension approval" }
  - { id: ERR_ENROLLMENT_NOT_REGISTERABLE, http: 409, condition: "Enrollment not in PENDING for register, or not PENDING/REGISTERED where required" }
  - { id: ERR_REGISTRATION_DEADLINE_PASSED, http: 409, condition: "Clock date beyond term_start_date + 30 days at registration" }
  - { id: ERR_BELOW_FULL_COURSE_LOAD, http: 422, condition: "enrolled_credits below effective_min_credits without an APPROVED RCL" }
  - { id: ERR_RCL_NOT_REQUESTED, http: 409, condition: "RCL not in REQUESTED for decision" }
  - { id: ERR_RCL_ALREADY_OPEN, http: 409, condition: "Enrollment already has a REQUESTED or APPROVED RCL" }
  - { id: ERR_RCL_ADD_DROP_CLOSED, http: 409, condition: "RCL requested after term_start_date + 14 days" }
  - { id: ERR_ADD_DROP_CLOSED, http: 409, condition: "PATCH of a REGISTERED enrollment attempted after term_start_date + 14 days" }
  - { id: ERR_RCL_NOT_FINAL_TERM, http: 409, condition: "FINAL_TERM RCL term window does not contain program_end_date" }
  - { id: ERR_RCL_CREDITS_OUT_OF_RANGE, http: 422, condition: "requested_credits violates the category floor/ceiling" }
  - { id: ERR_RCL_REASON_EXHAUSTED, http: 409, condition: "ACADEMIC RCL already used, or MEDICAL cumulative months would exceed 12" }
  - { id: ERR_AUTH_INVALID_STATE, http: 409, condition: "Authorization not in the required state (or wrong auth_type) for the requested transition" }
  - { id: ERR_OPT_WINDOW_CLOSED, http: 409, condition: "OPT filing outside [program_end - 90d, program_end + 60d] or OPT_POST start outside [program_end + 1d, program_end + 60d]" }
  - { id: ERR_AUTH_WINDOW_INVALID, http: 409, condition: "CPT/OPT_PRE end_date beyond program_end_date, or CPT window not contained in any enrollment term window" }
  - { id: ERR_EMPLOYMENT_PERIOD_OVERLAP, http: 409, condition: "Employment period overlaps another period of the same authorization (half-open semantics; adjacency allowed)" }
  - { id: ERR_ENDORSEMENT_WINDOW_OVERLAP, http: 409, condition: "Travel window intersects another ACTIVE endorsement on the same I-20 (closed-interval semantics; touching endpoints overlap)" }
  - { id: ERR_TRANSFER_NOT_CANCELLABLE, http: 409, condition: "Transfer not REQUESTED, or release_date already reached" }
  - { id: ERR_EXTENSION_NOT_REQUESTED, http: 409, condition: "Extension not in REQUESTED for decision" }
  - { id: ERR_EXTENSION_NOT_FORWARD, http: 409, condition: "new_program_end_date not strictly later than current program_end_date" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "Extension approval attempted after current program_end_date" }
  - { id: ERR_VIOLATION_INVALID_STATE, http: 409, condition: "Violation not in the required state for the requested action" }
  - { id: ERR_DOCUMENT_ALREADY_REVIEWED, http: 409, condition: "Financial document already VERIFIED or REJECTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PDSO
    description: "Principal Designated School Official; hierarchical superset of DSO with exclusive authority over record termination and reinstatement resolution"
    identity: opaque
    exclusive_operations:
      - "POST /sevis/sevis-records/{id}/terminate"
      - "POST /sevis/status-violations/{id}/transition with action=RESOLVE"
    shared_operations:
      - "All DSO operations"
      - "All read endpoints"

  - name: DSO
    description: "Designated School Official; day-to-day operator for records, I-20s, registration, RCL, employment, transfers, extensions, endorsements"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /sevis/students; POST /sevis/students/{id}/financial-documents; POST /sevis/financial-documents/{id}/review"
      - "POST /sevis/students/{id}/sevis-records; POST /sevis/sevis-records/{id}/initialize"
      - "POST /sevis/students/{id}/i20-forms; POST /sevis/i20-forms/{id}/issue; POST /sevis/i20-forms/{id}/travel-endorsements"
      - "POST /sevis/term-enrollments; PATCH /sevis/term-enrollments/{id}; POST /sevis/term-enrollments/{id}/register"
      - "POST /sevis/reduced-course-loads; POST /sevis/reduced-course-loads/{id}/decision"
      - "POST /sevis/employment-authorizations; POST /sevis/employment-authorizations/{id}/transition (RECOMMEND|REVISE|ADJUDICATE|CANCEL)"
      - "POST /sevis/employment-authorizations/{id}/employment-periods; DELETE /sevis/employment-periods/{id}"
      - "POST /sevis/students/{id}/transfer-requests; POST /sevis/transfer-requests/{id}/cancel"
      - "POST /sevis/students/{id}/program-extensions; POST /sevis/program-extensions/{id}/decision"
      - "POST /sevis/students/{id}/status-violations; POST /sevis/status-violations/{id}/transition (RECOMMEND_REINSTATEMENT|DISMISS)"
      - "POST /sevis/students/{id}/address-reports; POST /_clock/set_current_utc"
      - "All read endpoints"

  - name: Student
    description: "F-1 student; submits own financial documents, address reports, employment periods, and files OPT with USCIS"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /sevis/employment-authorizations/{id}/transition with action=FILE (own authorizations only)"
    shared_operations:
      - "POST /sevis/students/{id}/financial-documents (own id only)"
      - "POST /sevis/students/{id}/address-reports (own id only)"
      - "POST /sevis/employment-authorizations/{id}/employment-periods (own authorizations only)"
      - "PATCH /sevis/term-enrollments/{id} (own enrollments only)"
      - "Read endpoints restricted to own resources"
