          Conserved quantity: the customer's monetary balance. The forward action (issuing the
          refund, which moves value from retained to refunded) paired with its compensation (the
          resolved-segment invariant refunded_cents + retained_cents == net_fee_cents) leaves no
          monetary drift when the incident is reopened for further review.
        test_recipe:
