            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u}", call_ticket_id: "${tk}", start_date: "2026-08-02T00:00:00Z", end_date: "2026-08-04T00:00:00Z", nightly_rate_cents: 10000 }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { rc: $.data.id } }
