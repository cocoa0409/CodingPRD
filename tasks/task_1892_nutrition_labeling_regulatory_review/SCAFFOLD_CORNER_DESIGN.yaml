  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: ep_list_pagination_envelope
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints.GET /api/clients/{id}/products"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more: 2 products, limit=1 -> page 1 has_more true, page 2 has_more false."
        test_recipe:
          setup: ["client with two products"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { p1: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cracker", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /api/clients/${cid}/products?limit=1&offset=0", as: PlatformAdmin, captures: { page1_first: "$.data[0].id" } }
            - { call: "GET /api/clients/${cid}/products?limit=1&offset=1", as: PlatformAdmin, captures: { page2_first: "$.data[0].id" } }
          assert:
            - "page 1 response: response_type == array, total_count == 2, has_more == true, exactly 1 item"
            - "page 2 response: total_count == 2, has_more == false, exactly 1 item"
            - "page1_first != page2_first and {page1_first, page2_first} == {p1, p2}"

      - name: ep_audit_filtered_list
        claim_type: standard_crud
        grounds: ["endpoints.GET /api/artwork-audits"]
        distinguishing_aspect: "Filtered audit list: ?product_id= returns only audits of that product; a product with no audits yields an empty list with total_count 0."
        test_recipe:
          setup: ["client with products P1 (RELEASED label + 1 audit) and P2 (no audits)"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cracker", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid2: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "GET /api/artwork-audits?product_id=${pid}", as: PlatformAdmin, captures: { hit: "$.data[0].id" } }
            - { call: "GET /api/artwork-audits?product_id=${pid2}", as: PlatformAdmin }
          assert:
            - "filtered by pid: exactly 1 audit, hit == a1, total_count == 1"
            - "filtered by pid2: empty list, total_count == 0, has_more == false"

