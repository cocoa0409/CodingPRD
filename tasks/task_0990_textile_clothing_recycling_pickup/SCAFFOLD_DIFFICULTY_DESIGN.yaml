              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Ivy Iles", email: "ivy@x.com", address: "11 Juniper Rd" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T10:00:00Z", bags_claimed: 120 }
              as: Resident
              as_user_id: "${id}"
              captures: { pa_id: $.data.id, pa_est: $.data.est_weight_kg }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T12:30:00Z", window_end: "2026-05-10T14:00:00Z", bags_claimed: 80 }
              as: Resident
              as_user_id: "${id}"
              captures: { pb_id: $.data.id, pb_est: $.data.est_weight_kg }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T15:00:00Z", window_end: "2026-05-10T16:00:00Z", bags_claimed: 1 }
              as: Resident
              as_user_id: "${id}"
              captures: { pc_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
          trigger:
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
              captures: { pb_status: $.data.status }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
              captures: { err: $.data.error_id }
          assert:
            - "est weights: PA ${id} == 480.0, PB ${id} == 320.0 (bags * 4.0)"
            - "PB route succeeds (${id} == ROUTED): day total exactly 800.0 is admitted (> rejects, not >=)"
            - "PC route rejected: ${id} == ERR_ROUTE_CAPACITY_EXCEEDED (800.0 + 4.0 = 804.0 > 800.0)"
            - "PC remains SCHEDULED after the rejection"

