              payload: {}
              as: TurnCoordinator
          assert:
            - "GET /turns?unit_id=${u} → total_count == 1 and the element's id == ${t}"
            - "GET /turns/${t}/inspections → total_count == 0 (empty array, not an error)"

      - name: vendor_overlap_error_covered
        claim_type: conditional_action
        grounds: ["errors[ERR_VENDOR_OVERLAP]"]
        excluded_because:
          difficulty_instance: vendor_calendar_half_open_adjacency_boundary
          rationale: "Both the allowed-adjacency and rejected-overlap paths are asserted there."

      - name: cure_buffer_error_covered
        claim_type: conditional_action
        grounds: ["errors[ERR_CURE_BUFFER_VIOLATION]"]
        excluded_because:
          difficulty_instance: paint_carpet_cure_buffer_semantics
          rationale: "Both the violating start and the exact buffered start are asserted there."

  # ----------------------------------------------------------------- errors
  - section: errors
