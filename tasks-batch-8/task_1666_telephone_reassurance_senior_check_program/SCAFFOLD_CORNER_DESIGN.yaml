  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: intake_paused_blocks_application_and_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTAKE_PAUSED]", state_machines.Program.OPEN_to_PAUSED]
        distinguishing_aspect: "ERR_INTAKE_PAUSED blocks both new applications and approvals while PAUSED, and resume-intake lifts it."
        test_recipe:
          setup: ["Program; one UNDER_REVIEW participant with contact; intake then paused"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
