            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - *d_lic_mission
            - *d_lic_mission_grant
            - *d_slot
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/exclusion-windows"
              payload: { scope_type: "RANGE", scope_value: "CCAFS", kind: "WEATHER", start_utc: "2026-10-15T12:00:00Z", end_utc: "2026-10-15T13:00:00Z" }
              as: RangeOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rideshare/missions/${m_id}/launch"
              payload: {}
              as: MissionOps
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T13:00:00Z" }
