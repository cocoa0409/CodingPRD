            - call: "GET /disclosure/undertakings?issue_id=${issue_id}"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${und_id}"
              captures: { list_open: "$.data[0].open_obligation_count", list_weight: "$.data[0].content_weight_bp_total", list_score: "$.data[0].disclosure_risk_score", list_tier: "$.data[0].remediation_tier", list_posture: "$.data[0].compliance_posture", list_total: "$.total_count" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
