  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: statute_window_overlap_half_open_adjacency
        grounds:
          - calculations.service_window_overlap
          - entities.JurisdictionStatute.constraints
          - errors[ERR_STATUTE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [effective_from, effective_to) semantics on the jurisdiction
          statute timeline: [2026-06-01, 2026-09-01) overlapping
          [2026-01-01, 2026-07-01) is rejected, while the exactly-adjacent
          [2026-07-01, null) is accepted — adjacency permitted.
        test_recipe:
          setup:
            - "Jurisdiction exists with statute W1 [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: "2026-07-01", estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { st1: $.data.id}
          trigger:
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-06-01", effective_to: "2026-09-01", estoppel_response_days: 12, estoppel_fee_cap_cents: 15000, estoppel_validity_days: 45 }
              as: ProviderAdmin
              captures: { err: $.data.error_id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-07-01", effective_to: null, estoppel_response_days: 12, estoppel_fee_cap_cents: 15000, estoppel_validity_days: 45 }
              as: ProviderAdmin
              captures: { st2: $.data.id}
            - call: "GET /jurisdictions/${j_id}/statutes"
              as: ProviderAdmin
              captures: { st_count: $.data}
          assert:
            - "Overlapping window [2026-06-01, 2026-09-01): error_id == ERR_STATUTE_WINDOW_OVERLAP, http 422"
            - "Adjacent window [2026-07-01, null) accepted with 201 (new.effective_from == old.effective_to is not an overlap)"
            - "Jurisdiction now has exactly 2 statutes"

      - name: parcel_service_window_closed_interval_adjacency_rejected
        grounds:
          - calculations.service_window_overlap
          - errors[ERR_DUPLICATE_ACTIVE_SEARCH]
        distinguishing_aspect: |
          CLOSED-interval semantics on the parcel resource — the opposite
          adjacency treatment from the statute timeline: a second order for the
          same parcel created ON the existing order's closing_date still
          conflicts (adjacency rejected); only after the closing date has fully
          passed (or cancellation) can the parcel be re-ordered.
        test_recipe:
          setup:
            - "Config A live; order A parcel P-900 created 2026-08-01 with closing 2026-08-20 (window [2026-08-01, 2026-08-20] closed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "9 Z St", parcel_number: "P-900", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_a: $.data.id}
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:00:00Z" }, as: ProviderAdmin }
            - call: "POST /search-orders"
              payload: { property_address: "9 Z St", parcel_number: "P-900", closing_date: "2026-09-15", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_2"
              captures: { err: $.data.error_id}
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T09:00:00Z" }, as: ProviderAdmin }
            - call: "POST /search-orders"
              payload: { property_address: "9 Z St", parcel_number: "P-900", closing_date: "2026-09-15", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_2"
              captures: { o_b: $.data.id}
          assert:
            - "Create on 2026-08-20 (== order A closing_date): error_id == ERR_DUPLICATE_ACTIVE_SEARCH, http 409 — closed interval rejects adjacency"
            - "Create on 2026-08-21 (> A.closing_date): 201, new order id captured — the parcel is free once the window has fully passed"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: complete_reopen_pair_conserves_billed_fees
        grounds:
          - calculations.order_total_fees
          - state_machines.ResearchTask.COMPLETED
          - state_machines.ResearchTask.COMPLETED_to_IN_PROGRESS
        distinguishing_aspect: |
          Conserved quantity = billed fees: completing the task adds exactly
          fee_charged_cents (5000) and the compensating reopen subtracts exactly
          the same amount, leaving SearchOrder.total_fees_cents == 0 — matching
          the reconciliation formula sum(COMPLETED task fees) + sum(estoppel
          lifetime fees) with zero drift.
        test_recipe:
          setup:
            - "Config A (single UTILITY department, fee 5000) live; order identified; task completed (total_fees 5000); pre-delivery BALANCE_MISMATCH discrepancy filed on the task and under review"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "1 F St", parcel_number: "P-F1", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id", t1v: "$.data[0].version"}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t1v}", findings: [ { finding_kind: "UNPAID_UTILITY", amount_cents: 300000 } ] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "POST /discrepancies"
              payload: { search_order_id: "${o_id}", subject_type: "RESEARCH_TASK", subject_id: "${t1}", discrepancy_type: "BALANCE_MISMATCH", claimed_amount_cents: 50000, description: "Balance wrong" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { dc_id: $.data.id}
            - { call: "POST /discrepancies/${dc_id}/start-review", payload: {}, as: QAReviewer, as_user_id: "qa_1" }
          trigger:
            - { call: "POST /discrepancies/${dc_id}/resolve", payload: { resolution_outcome: "CONFIRMED_CORRECTION" }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "GET /search-orders/${o_id}"
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { o_fees: $.data.total_fees_cents, o_payoff: $.data.total_payoff_cents}
            - call: "GET /research-tasks/${t1}"
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { t_status: $.data.status, t_v: $.data.version}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t_v}", findings: [ { finding_kind: "UNPAID_UTILITY", amount_cents: 310000 } ] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}"
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { o_fees2: $.data.total_fees_cents, o_payoff2: $.data.total_payoff_cents}
          assert:
            - "After complete: total_fees_cents was 5000; after the compensating reopen: SearchOrder.${o_id}.total_fees_cents == 0 and total_payoff_cents == 0 — the pair conserves billed fees with zero drift"
            - "ResearchTask.${t1}.status == IN_PROGRESS with fee_charged_cents == 0 after reopen"
            - "Re-completion round-trips: total_fees_cents == 5000 and total_payoff_cents == 310000 (corrected findings)"

      - name: file_reject_pair_conserves_pending_claims
        grounds:
          - calculations.missed_item_liability
          - state_machines.Discrepancy.UNDER_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity = pending claims exposure (a different quantity
          than billed fees): filing a 60000 claim adds exactly 60000 to
          SearchOrder.pending_claims_cents and the compensating REJECTED_INVALID
          resolution subtracts exactly 60000, returning exposure to 0 while
          total_liability_cents stays 0 and the delivered order is undisturbed.
        test_recipe:
          setup:
            - "Config A live; base flow delivered (single UTILITY task, balance 300000, estoppel payoff 45000; payoff 345000, fees 15000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "1 H St", parcel_number: "P-H1", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id", t1v: "$.data[0].version"}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t1v}", findings: [ { finding_kind: "UNPAID_UTILITY", amount_cents: 300000 } ] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_id: "$.data[0].id"}
            - { call: "POST /estoppel-orders/${e_id}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /estoppel-orders/${e_id}/receive", payload: { payoff_amount_cents: 45000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/submit-for-verification", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/verify-payoff", payload: { verified_payoff_total_cents: 345000 }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /deliveries"
              payload: { search_order_id: "${o_id}" }
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { d_id: $.data.id}
            - { call: "POST /deliveries/${d_id}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /discrepancies"
              payload: { search_order_id: "${o_id}", subject_type: "SEARCH_ORDER", subject_id: "${o_id}", discrepancy_type: "MISSED_ITEM", claimed_amount_cents: 60000, description: "Missed code lien" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { dc_id: $.data.id}
            - { call: "POST /discrepancies/${dc_id}/start-review", payload: {}, as: QAReviewer, as_user_id: "qa_1" }
          trigger:
            - { call: "POST /discrepancies/${dc_id}/resolve", payload: { resolution_outcome: "REJECTED_INVALID" }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "GET /search-orders/${o_id}"
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { o_pend: $.data.pending_claims_cents, o_liab: $.data.total_liability_cents, o_status: $.data.status}
          assert:
            - "Filing had moved pending_claims_cents 0 -> 60000; after the REJECTED_INVALID resolution SearchOrder.${o_id}.pending_claims_cents == 0 — the pair conserves pending claims exposure"
            - "SearchOrder.${o_id}.total_liability_cents == 0 (rejected claims accrue nothing)"
            - "SearchOrder.${o_id}.status == DELIVERED and Delivery.${d_id}.status == DELIVERED (rejection triggers no reopen)"
