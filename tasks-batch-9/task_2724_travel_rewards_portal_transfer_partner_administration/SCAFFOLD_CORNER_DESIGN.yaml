            - "PortalInventoryOffer.${o_id}.portal_price_cents == 48000 and cash_copay_cents == 4000"
            - "PortalInventoryOffer.${o_id}.parity_status == IN_PARITY"
            - "RedemptionOrder.${ro_id}.cents_per_point_applied == 1.5"
            - "RedemptionOrder.${ro_id}.points_debited == 29334"
