            - "GET /library/titles/${t_inf} shows stock_on_hand == 5997 (6000 - 3)"
            - "GET /library/titles/${t_tod} shows stock_on_hand == 6000 (no TODDLER demand)"
            - "GET /library/items?wave_id=${wave_o_id} returns 3 rows, all status MAILED, all billable == true"

      - name: reconcile_delivers_items_and_creates_draft_invoice
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/library/waves/{id}/reconcile
          - state_machines.MailingItem.MAILED_to_DELIVERED
        distinguishing_aspect: "Reconcile flips every unreturned MAILED item to DELIVERED and creates exactly one DRAFT invoice for the affiliate with billable items."
        test_recipe:
          setup: ["Full bootstrap through manifest; c1's item returned before reconcile (so 2 billable remain)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *c1
            - *c2
            - *c3
            - *wave_o
            - *wave_o_go
            - *item_o_c1
            - call: "POST /library/items/${item_o_c1}/mark-returned"
              payload: {}
              as: MailOps
          trigger:
            - *wave_o_rec
            - call: "GET /library/invoices"
              payload: { wave_id: "${wave_o_id}" }
              as: PlatformAdmin
              captures: { inv_r: "$.data[0].id" }
          assert:
            - "MailingWave.${wave_o_id}.status == RECONCILED"
            - "MailingItem.${item_o_c1}.status == RETURNED_UNDELIVERABLE and billable == false; the other two items are DELIVERED and billable"
            - "exactly 1 invoice exists for the wave: AffiliateInvoice.${inv_r}.status == DRAFT, item_count == 2, gross_cents == 448 (2 x 224)"
            - "manifested_item_count == 3 == billable (2) + returned (1): no item leaks out of the accounting"

      - name: address_change_reject_leaves_child_untouched
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AddressChange.PENDING_to_REJECTED
        distinguishing_aspect: "REJECT is side-effect-free: child address, status, and consecutive_returns are byte-identical before and after."
        test_recipe:
          setup: ["Bootstrap core; c1 registered; address change pending."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *c1
            - call: "POST /library/children/${c1_id}/address-changes"
              payload: { new_address: { line1: "1 Reject Rd", city: "Nashville", region: "TN", postal_code: "37209", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { ac_rej: $.data.id }
          trigger:
            - call: "POST /library/address-changes/${ac_rej}/decide"
              payload: { outcome: "REJECT" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          assert:
            - "AddressChange.${ac_rej}.status == REJECTED and decided_by == \"${aff_a_id}\" and resulting_child_id is null"
            - "Child.${c1_id}.mailing_address.line1 == \"1 Oak St\" (unchanged), enrollment_status == ACTIVE, consecutive_returns == 0"
            - "Affiliate.${aff_a_id}.enrolled_count == 1"

  # ===========================================================================
  - section: errors
    instances:
      - name: entity_specific_not_found_errors
        claim_type: Violation → Error
        grounds:
          - errors.ERR_TITLE_NOT_FOUND
          - errors.ERR_PRINT_ORDER_NOT_FOUND
          - errors.ERR_WAVE_NOT_FOUND
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - errors.ERR_ADDRESS_CHANGE_NOT_FOUND
          - errors.ERR_STATE_PROGRAM_NOT_FOUND
          - errors.ERR_AFFILIATE_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: "Every resource family reports its own 404 error_id (never a generic NOT_FOUND), and a body-referenced bogus FK (state_program_id on affiliate create) surfaces the same entity-specific 404."
        test_recipe:
          setup: ["Clock set; one program and one affiliate exist."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
          trigger:
            - call: "GET /library/titles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { e_title: $.data.error_id }
            - call: "GET /library/print-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { e_po: $.data.error_id }
            - call: "POST /library/waves/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/manifest"
              payload: {}
              as: MailOps
              captures: { e_wave: $.data.error_id }
            - call: "POST /library/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/mark-returned"
              payload: {}
              as: MailOps
              captures: { e_item: $.data.error_id }
            - call: "POST /library/invoices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/issue"
              payload: {}
              as: PlatformAdmin
              captures: { e_inv: $.data.error_id }
            - call: "POST /library/address-changes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide"
              payload: { outcome: "APPROVE" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
