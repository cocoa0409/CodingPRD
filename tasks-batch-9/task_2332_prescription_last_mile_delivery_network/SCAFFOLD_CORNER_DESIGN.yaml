      - name: four_level_cascade_from_one_door_step_attempt
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /deliveries/{id}/attempts]
        distinguishing_aspect: "A single attempt call propagates through delivery, allocation, grant and courier rows in one transaction."
        excluded_because:
          difficulty_instance: cold_breach_forced_outcome_cascade_depth_four
          rationale: "§1.8 walks the full depth-four chain end-to-end and asserts every level, which is exactly this layer's claim."
      - name: both_fee_variants_produce_their_own_result_and_a_correct_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.delivery_fee_subtotal.variants
        distinguishing_aspect: "PROVISIONAL and FINAL must each be computed correctly and the ledger delta on the switch must reconcile."
        excluded_because:
          difficulty_instance: delivery_fee_provisional_vs_final_diverges_after_reattempt
          rationale: "§1.8 pins both variants and the reconciliation delta with literal cent values."

