          assert:
            - "while IN_MAINTENANCE: ${err} == ERR_DRONE_NOT_FLYABLE"
            - "after release to AVAILABLE: ${asg_status} == ASSIGNED"

      - name: certify_go_requires_certified_evaluation
        grounds:
          - state_machines.ShowEvent.READY_to_GO_CERTIFIED
          - state_machines.GoNoGoEvaluation.PROVISIONAL_to_CERTIFIED
          - errors[ERR_EVALUATION_NOT_CERTIFIED]
        distinguishing_aspect: |
          Pair ShowEvent x GoNoGoEvaluation: certify-go is gated on the
          evaluation's state — PROVISIONAL rejects with
          ERR_EVALUATION_NOT_CERTIFIED; after certification the same call
          advances the show to GO_CERTIFIED.
        test_recipe:
          setup:
            - "Site A; Show S (3 drones) in READY (grid complete); GO evaluation created but PROVISIONAL; clock 2026-08-10T18:45:00Z"
          setup_api_calls:
