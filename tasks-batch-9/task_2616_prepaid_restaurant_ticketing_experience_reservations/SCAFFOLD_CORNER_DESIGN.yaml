              captures: { st4: $.data.sell_through_bp, held4: $.data.seats_held, avail4: $.data.seats_available }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T22:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res1}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { forf: $.data.forfeited_cents, refd: $.data.refunded_cents }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { st5: $.data.sell_through_bp, sold5: $.data.seats_sold, avail5: $.data.seats_available }
            - call: "GET /services/${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { covers5: $.data.covers_confirmed, refd5: $.data.refunded_cents, forf5: $.data.forfeited_cents, net5: $.data.net_settled_cents }
          assert:
            - "${st0} == 0 on the untouched class (seats_sold 0 + seats_held 0 of 20)"
            - "${st1} == 1000 == floor(10000 * (0 + 2) / 20) with ${held1} == 2 and ${avail1} == 18: a mere hold already moves the derived sell-through"
            - "${st2} == 1000 with ${sold2} == 2 and ${held2} == 0: confirming converts held to sold and must NOT move sell_through_bp a second time"
            - "${covers2} == 2, ${gross2} == 7722 and ${net2} == 7722 == 7722 - 0"
            - "${st3} == 2500 == floor(10000 * (2 + 3) / 20) with ${held3} == 3 and ${avail3} == 15"
            - "${st4} == 1000 with ${held4} == 0 and ${avail4} == 18: the swept hold's three seats are given back and the derived field is re-derived downward, exactly as it would be on a source deletion"
            - "${forf} == 4361 and ${refd} == 3361 for the cancellation at the 48 hour mark"
            - "${st5} == 0 with ${sold5} == 0 and ${avail5} == 20: the last remaining source row left the numerator, and seats_allocated 20 == 0 + 0 + 0 + 20 still holds"
            - "${covers5} == 0, ${refd5} == 3361, ${forf5} == 4361 and ${net5} == 4361 == gross 7722 - refunded 3361"
            - "at every one of the five readings seats_allocated 20 == seats_sold + seats_held + seats_released + seats_available"

      - name: derived_field_reconciliation_reservation_cash_ledger_identity
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        excluded_because:
          difficulty_instance: reservation_cash_ledger_conserved_through_forfeiture_reversal
          rationale: "That §1.8 instance replays the whole PaymentTransaction ledger and reconciles amount_paid_cents, refunded_cents and forfeited_cents against it before and after a forfeiture reversal, which is the after-create / after-update facet of this layer for the money fields."

      - name: derived_field_reconciliation_goodwill_balance_identity
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        excluded_because:
          difficulty_instance: goodwill_liability_conserved_through_partial_redeem_then_revoke
          rationale: "issued == redeemed + revoked + remaining is asserted there after a partial redemption and again after the revocation, covering the derived-balance reconciliation for GoodwillCredit."

  # ===========================================================================
  # §1.9 / section: consistency_model — complexity_profile.consistency_model is
  # `immediate`, so the guide's single row ("All changes visible in same
  # request's response") is probed from two directions: the write's own response
  # body must already carry every recomputed derived field of the entity it
  # returns, and every sibling read — single GET, filtered list, total_count —
  # must agree on the very next request with no settling period.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_write_response_already_carries_every_recomputed_field_and_siblings_agree_at_once
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/reservations/{id}/confirm
          - endpoints.POST_/reservations/{id}/cancel
          - calculations.cancellation_settlement
          - calculations.seat_pool_reconciliation
        distinguishing_aspect: "Cancel is the widest single write in the domain: it settles the forfeiture ladder, writes two ledger rows, returns seats and re-rolls four Service money fields. Under an immediate model the cancel response body must already show forfeited_cents 4361 and refunded_cents 3361 — not zeros to be filled in later — and the immediately following reads of the Reservation, the TicketClass, the Service and the ledger must return byte-identical values with no retry. An implementation that recomputes derived fields lazily on the next GET is caught by the write-response captures; one that defers the cross-entity rollup is caught by the sibling reads."
        test_recipe:
          setup:
            - "STD chain published; guest G1 books party 2 (grand 25740), pays the 7722 deposit and confirms"
            - "the clock then moves to 2026-09-08T22:00:00Z, exactly 48 hours before seating, so the STANDARD ladder retains 4361 and refunds 3361 on the DEPOSIT_BASIS"
            - "no other reservation exists on the class, so every counter reading is unambiguous"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Immediate House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "immediate@corner.test", display_name: "Immediate Guest" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { v1: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g1_id}", party_size: 2, primary_guest_name: "Immediate Guest", expected_ticket_class_version: "${v1}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/payments"
              payload: { amount_cents: 7722 }
              as: Guest
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { cff: $.data.fulfillment_status, cfrozen: $.data.deposit_frozen, cfhold: $.data.hold_expires_at_utc }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { sold_after_confirm: $.data.seats_sold, held_after_confirm: $.data.seats_held }
            - call: "GET /services/${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { covers_after_confirm: $.data.covers_confirmed }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T22:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { w_ff: $.data.fulfillment_status, w_pay: $.data.payment_status, w_forf: $.data.forfeited_cents, w_refd: $.data.refunded_cents, w_paid: $.data.amount_paid_cents, w_ver: $.data.version }
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { r_ff: $.data.fulfillment_status, r_pay: $.data.payment_status, r_forf: $.data.forfeited_cents, r_refd: $.data.refunded_cents, r_paid: $.data.amount_paid_cents, r_ver: $.data.version }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { tc_sold: $.data.seats_sold, tc_avail: $.data.seats_available, tc_st: $.data.sell_through_bp }
            - call: "GET /services/${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { s_covers: $.data.covers_confirmed, s_refd: $.data.refunded_cents, s_forf: $.data.forfeited_cents, s_net: $.data.net_settled_cents }
            - call: "GET /payment-transactions?reservation_id=${res_id}"
              payload: {}
              as: GuestServices
              as_user_id: "cs_1"
              captures: { ptx_last_kind: "$.data[2].kind" }
            - call: "GET /guests/${g1_id}"
              payload: {}
              as: GuestServices
              as_user_id: "cs_1"
              captures: { g_refd: $.data.lifetime_refunded_cents }
          assert:
            - "${cff} == CONFIRMED, ${cfrozen} == true and ${cfhold} is null in the confirm response itself — the write body is already final, not a pre-transition snapshot"
            - "${sold_after_confirm} == 2 and ${held_after_confirm} == 0 on the very next request: the cross-entity seat move is visible with no settling period"
            - "${covers_after_confirm} == 2 on the request after that: the Service rollup is immediate too"
            - "${w_ff} == CANCELLED, ${w_pay} == REFUNDED, ${w_forf} == 4361, ${w_refd} == 3361 and ${w_paid} == 7722 all read off the cancel response body"
            - "${r_ff} == ${w_ff}, ${r_pay} == ${w_pay}, ${r_forf} == ${w_forf}, ${r_refd} == ${w_refd}, ${r_paid} == ${w_paid} and ${r_ver} == ${w_ver}: the immediate re-read is byte-identical, so no field was left to a background pass"
            - "${tc_sold} == 0, ${tc_avail} == 20 and ${tc_st} == 0 immediately after the cancel"
            - "${s_covers} == 0, ${s_refd} == 3361, ${s_forf} == 4361 and ${s_net} == 4361 == 7722 - 3361 immediately after the cancel"
            - "${ptx_last_kind} == REFUND with total_count 3 (DEPOSIT_CHARGE, FORFEITURE, REFUND): both ledger rows are queryable on the next request, in created_at order"
            - "${g_refd} == 3361: even the two-hops-away Guest aggregate is current on the next request"

      - name: immediate_filtered_lists_and_total_counts_reflect_the_write_on_the_very_next_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/reservations
          - endpoints.GET_/payment-transactions
          - response_envelope.list
        distinguishing_aspect: "Immediacy is claimed for indexes and aggregates as well as for single rows. Two reservations are created and every filtered projection is read on the request immediately after the write that changes it: the service_id index, the fulfillment_status partition (which must move a row from HELD to CONFIRMED to CANCELLED with no lag), total_count under a limit that truncates the page, and the kind-filtered ledger. A cached count or an index refreshed out of band shows up as a stale total_count."
        test_recipe:
          setup:
            - "STD chain published; guests G1 and G2 exist"
            - "G1 books party 2 (deposit 7722) and G2 books party 3 (subtotal 36000, service charge 2610, grand 38610, deposit 11583)"
            - "all list assertions happen before the clock leaves 2026-09-01T00:00:00Z except the final cancellation pair, and no hold-sweep is ever run, so G2's entry stays HELD throughout"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Index House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "index1@corner.test", display_name: "Index One" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "index2@corner.test", display_name: "Index Two" }
              as: PlatformAdmin
              captures: { g2_id: $.data.id }
          trigger:
            - call: "GET /reservations?service_id=${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { v1: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g1_id}", party_size: 2, primary_guest_name: "Index One", expected_ticket_class_version: "${v1}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { res1: $.data.id }
            - call: "GET /reservations?service_id=${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { first_id: "$.data[0].id", v2: "$.data[0].version" }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g2_id}"
              captures: { v3: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g2_id}", party_size: 3, primary_guest_name: "Index Two", expected_ticket_class_version: "${v3}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { res2: $.data.id, dep2: $.data.deposit_due_cents }
            - call: "GET /reservations?service_id=${svc_id}&limit=1&offset=0"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { page_first: "$.data[0].id" }
            - call: "GET /reservations?guest_id=${g2_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { by_guest: "$.data[0].id" }
            - call: "POST /reservations/${res1}/payments"
              payload: { amount_cents: 7722 }
              as: Guest
              as_user_id: "${g1_id}"
            - call: "GET /reservations?service_id=${svc_id}&payment_status=DEPOSIT_PAID"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { dep_paid_first: "$.data[0].id" }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
            - call: "GET /reservations?service_id=${svc_id}&fulfillment_status=CONFIRMED"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { conf_first: "$.data[0].id" }
            - call: "GET /reservations?service_id=${svc_id}&fulfillment_status=HELD"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { held_first: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T22:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res1}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
            - call: "GET /reservations?service_id=${svc_id}&fulfillment_status=CANCELLED"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { canc_first: "$.data[0].id" }
            - call: "GET /reservations?service_id=${svc_id}&fulfillment_status=CONFIRMED"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /payment-transactions?reservation_id=${res1}&kind=REFUND"
              payload: {}
              as: GuestServices
              as_user_id: "cs_1"
              captures: { refund_amount: "$.data[0].amount_cents" }
          assert:
            - "the first list returns total_count 0 with has_more false and an empty data array, establishing the baseline"
            - "${first_id} == ${res1} with total_count 1 and has_more false on the request immediately after the create"
            - "${v2} == 1: the row surfaced through the index carries the same version as the create response"
            - "${dep2} == 11583 == round_half_up((36000 + 2610) * 3000 / 10000) for the party of 3"
            - "the limit=1 page returns total_count 2 with has_more true and exactly one element ${page_first} == ${res1}: the truncating page still reports the true total on the request after the second create"
            - "${by_guest} == ${res2} with total_count 1: the guest_id index picked up the new row immediately"
            - "${dep_paid_first} == ${res1} with total_count 1: the payment_status partition moved on the request right after the payment"
            - "${conf_first} == ${res1} with total_count 1 and ${held_first} == ${res2} with total_count 1: confirm relocated exactly one row between the two partitions, with no interval in which it appears in both or in neither"
            - "${canc_first} == ${res1} with total_count 1 and the CONFIRMED partition immediately drops to total_count 0 with an empty data array"
            - "${refund_amount} == 3361 with total_count 1: the kind-filtered ledger index is live on the request after the cancel"
