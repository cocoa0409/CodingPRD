        distinguishing_aspect: "immediate consistency: after appraising an asset to 800000, a subsequent GET /estates/{id} in the same chain shows inventory_total_cents == 800000 with no lag."
        test_recipe:
          setup: ["An OPEN estate with an APPOINTED PR and a LISTED asset."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "IM", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "X", asset_class: "REAL_PROPERTY", declared_value_cents: 500000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
