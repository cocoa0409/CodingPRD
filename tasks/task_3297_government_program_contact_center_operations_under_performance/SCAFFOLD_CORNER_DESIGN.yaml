      (non-PENDING), and routing with zero certified agents (course completed but valid_until in the past rejected at creation; instead: agent
      certified then deactivated... no — the pinned path is a contract whose only agent was never certified) is ERR_NO_ELIGIBLE_QUEUE.'
    test_recipe:
