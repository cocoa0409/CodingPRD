        claim_type: cascading_validation
        grounds:
          - validations[priority=65, error_id=ERR_TEST_PANEL_INCOMPLETE]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_and_partial_test_panel_block_certificate_issue
          rationale: "That instance shows the zero-test and one-test panels both refused before the certificate can be issued, so the dependent check runs only after the panel check passes."

  - section: endpoints
    instances:
      - name: patch_institution_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /institutions/{institutionId}]
          - entities.Institution.fields.accreditation_status
        distinguishing_aspect: "A PATCH carrying only accreditation_status moves ACCREDITED -> SUSPENDED and bumps version to 2 while accreditation_expires_on, holding_capacity_slots and disposition_policy_on_file keep their original values."
        test_recipe:
          setup: ["Cedar Ridge Zoo exists at version 1."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
          trigger:
            - call: "PATCH /institutions/${sender_id}"
              payload: { accreditation_status: "SUSPENDED" }
              as: AccreditationAdmin
          assert:
            - "Response status is 200"
            - "Institution.${sender_id}.accreditation_status == SUSPENDED"
            - "Institution.${sender_id}.accreditation_expires_on == 2028-12-31 and holding_capacity_slots == 40 and disposition_policy_on_file == true"
            - "Institution.${sender_id}.version == 2 and updated_at is the current logical clock"
            - "GET /institutions?accreditation_status=SUSPENDED returns total_count == 1"

      - name: on_time_studbook_submission_scores_zero_and_review_posts_nothing
        claim_type: computed_read
        grounds:
          - endpoints[POST /studbook-submissions]
          - endpoints[POST /studbook-submissions/{submissionId}/review]
          - calculations.studbook_lateness_assessment
        distinguishing_aspect: "Filed inside the grace window (reporting_period_end 2026-07-15, deadline 2026-08-14, submitted_on 2026-08-01) the submission scores days_late 0, base_points 0.00, surcharge_multiplier 0.00 and total_compliance_points 0.00, and the ACCEPT review posts nothing, leaving the institution ACCREDITED."
        test_recipe:
          setup: ["Cedar Ridge Zoo and a species program exist. Clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "BIRTH", reporting_period_end: "2026-07-15" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /studbook-submissions/${sub_id}/review"
              payload: { outcome: "ACCEPT", review_note: "clean" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
          assert:
            - "First call: status 201, StudbookSubmission.${sub_id}.submitted_on == 2026-08-01 and status == SUBMITTED"
            - "StudbookSubmission.${sub_id}.days_late == 0, base_points == 0.00, surcharge_multiplier == 0.00, surcharge_points == 0.00, total_compliance_points == 0.00"
            - "Second call: status 200, StudbookSubmission.${sub_id}.status == ACCEPTED and review_note == 'clean'"
            - "Institution.${sender_id}.compliance_points_balance == 0.00 and accreditation_status is still ACCREDITED"

      - name: duplicate_studbook_submission_is_refused_while_the_first_is_unreviewed
        claim_type: cross_reference_link
        grounds:
          - validations[priority=82, error_id=ERR_DUPLICATE_STUDBOOK_SUBMISSION]
          - endpoints[POST /studbook-submissions]
        distinguishing_aspect: "Uniqueness is over the four-part key (species_program_id, institution_id, reporting_period_end, submission_type): a second BIRTH submission for the same period is refused 422 while the same institution's TRANSFER submission for that period is accepted."
        test_recipe:
          setup: ["Cedar Ridge Zoo, a species program and one SUBMITTED BIRTH submission for period end 2026-07-15 exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "BIRTH", reporting_period_end: "2026-07-15" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { sub1_id: $.data.id }
          trigger:
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "BIRTH", reporting_period_end: "2026-07-15" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "TRANSFER", reporting_period_end: "2026-07-15" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { sub2_id: $.data.id }
          assert:
            - "First call: status 422 with data.error_id == 'ERR_DUPLICATE_STUDBOOK_SUBMISSION'"
            - "Second call: status 201 and StudbookSubmission.${sub2_id}.submission_type == TRANSFER"
            - "GET /studbook-submissions?institution_id=${sender_id} returns total_count == 2"
            - "StudbookSubmission.${sub1_id}.status is still SUBMITTED"

      - name: booking_confirm_is_allowed_only_under_its_document_and_quarantine_conditions
        claim_type: conditional_action
        grounds:
          - endpoints[POST /shipment-bookings/{bookingId}/confirm]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_confirm_gated_on_scheduled_quarantine_at_receiver
          rationale: "That instance drives the confirm both without and with the receiver's SCHEDULED quarantine occupancy, which is the conditional-action claim for this endpoint."
      - name: deliver_recomputes_the_final_credit_valuation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /shipment-bookings/{bookingId}/deliver]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_transfer_credit_points
          rationale: "That instance exercises deliver end to end and asserts the state transition, the final valuation and the ledger adjustment the endpoint's side effects declare."

