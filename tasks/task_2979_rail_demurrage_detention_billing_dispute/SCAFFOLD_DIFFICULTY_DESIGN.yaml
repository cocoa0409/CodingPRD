      - name: dispute_cycles_twice_through_under_review_with_non_monotonic_due_date
        grounds:
          - state_machines.DemurrageDispute.status
          - entities.DemurrageDispute.fields.info_request_count
          - entities.DemurrageDispute.fields.round_number
          - entities.DemurrageDispute.fields.adjudication_due_at
          - calculations.adjudication_timeline
        distinguishing_aspect: |
          The dispute graph has two distinct cycles that both re-enter
          UNDER_REVIEW, and the guard counters differ: the
          UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW loop is
          gated by info_request_count and REPLACES adjudication_due_at with an
          EARLIER date (2026-09-10 becomes 2026-09-03) which resubmit must then
          leave alone, while the DECIDED -> APPEALED -> UNDER_REVIEW -> DECIDED
          loop is gated by round_number, reverses money, and recomputes the due
          date from the appeal date ignoring evidence weight.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T10:00:00Z"
            - "one ISSUED single-charge Invoice: charge A gross 47550, dispute_deadline_at 2026-09-14T23:59:59.999Z"
            - "one DRAFT WHOLE_INVOICE dispute with grounds RAILROAD_CAUSED_DELAY, claimed_credit_cents 47550 and a single SWITCH_LIST evidence row of weight 3"
            - "two distinct adjudicator user ids exist: adj-r3i2-a and adj-r3i2-b"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
