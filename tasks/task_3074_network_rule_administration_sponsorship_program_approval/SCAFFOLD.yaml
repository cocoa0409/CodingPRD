    description: "List remediation plans; subject and cycle filters supported"
    roles: [NetworkOperator, FraudAnalyst]
    code: 200
    input: ["subject_type?", "subject_id?", "fraud_program_cycle_id?", "status?", "limit?", "offset?"]
    output: RemediationPlan[]
    side_effects: []
  - method: GET
    path: "/network/remediation-plans/{id}"
    description: "Get one remediation plan"
    roles: [NetworkOperator, FraudAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: []
  - method: POST
    path: "/network/remediation-plans/{id}/submit"
    description: "Submit an open plan before its due date"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["OPEN -> SUBMITTED; submitter X-User-ID recorded"]
  - method: POST
    path: "/network/remediation-plans/{id}/approve"
    description: "Approve a submitted plan; approver must differ from submitter"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["SUBMITTED -> APPROVED; merchant monitoring status updated"]
  - method: POST
    path: "/network/remediation-plans/{id}/complete"
    description: "Complete an approved plan before its due date"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["APPROVED -> COMPLETED; merchant EXEMPTED"]
  - method: POST
    path: "/network/remediation-plans/{id}/escalate"
    description: "Escalate an overdue plan; an ACQUIRER-subject escalation suspends the member"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["OVERDUE -> ESCALATED; conditional member suspension cascade"]

  - method: POST
    path: "/network/settlement-windows"
    description: "Schedule a settlement window"
    roles: [SettlementOperator]
    code: 201
    input: [window_date, opens_at, closes_at]
    output: SettlementWindow
    side_effects: ["Window created SCHEDULED"]
  - method: GET
    path: "/network/settlement-windows"
    description: "List settlement windows"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SettlementWindow[]
    side_effects: []
  - method: GET
    path: "/network/settlement-windows/{id}"
    description: "Get one settlement window"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: []
  - method: POST
    path: "/network/settlement-windows/{id}/open"
    description: "Open a scheduled window (only one window OPEN at a time)"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["SCHEDULED -> OPEN"]
  - method: POST
    path: "/network/settlement-windows/{id}/reconcile"
    description: "Reconcile an open window; requires no DRAFT lines remain"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["OPEN -> RECONCILED"]
  - method: POST
    path: "/network/settlement-windows/{id}/close"
    description: "Close a reconciled window"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["RECONCILED -> CLOSED"]
  - method: GET
    path: "/network/settlement-windows/{id}/lines"
    description: "List settlement lines in this window"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SettlementLine[]
    side_effects: []
  - method: GET
    path: "/network/settlement-windows/{id}/positions"
    description: "Computed read: per-member net settlement positions for this window (sums to zero)"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: []
    output: { positions: array, total_check_cents: integer }
    side_effects: []

  - method: POST
    path: "/network/settlement-lines"
    description: "Draft a funds-transfer line between two members in a window"
    roles: [SettlementOperator]
    code: 201
    input: [window_id, from_member_id, to_member_id, amount_cents, currency, reference]
    output: SettlementLine
    side_effects: ["SettlementLine created DRAFT"]
  - method: GET
    path: "/network/settlement-lines"
    description: "List settlement lines; window_id and member filters supported"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: ["window_id?", "from_member_id?", "to_member_id?", "status?", "limit?", "offset?"]
    output: SettlementLine[]
    side_effects: []
  - method: GET
    path: "/network/settlement-lines/{id}"
    description: "Get one settlement line"
    roles: [NetworkOperator, SettlementOperator]
    code: 200
    input: []
    output: SettlementLine
    side_effects: []
  - method: POST
    path: "/network/settlement-lines/{id}/commit"
    description: "Commit a draft line; debits/credits member balances and window total"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementLine
    side_effects: ["DRAFT -> COMMITTED; balance and window-total updates"]
  - method: POST
    path: "/network/settlement-lines/{id}/reverse"
    description: "Reverse a committed line; restores member balances and window total"
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementLine
    side_effects: ["COMMITTED -> REVERSED; compensating balance updates"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "Entity-backed role's X-User-ID does not match the resource's owning entity id (e.g. a Member appealing a violation where X-User-ID != subject_member_id, or acting on a dispute it is not a party to)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path or body) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition exists"
  - id: ERR_VALIDATION
    http: 422
    condition: "Structural field constraint violated (bin_prefix not 6 digits, mcc not 4 digits, both/neither of participant_id/acquirer_member_id set, sponsor wrong kind or not ACTIVE)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: rule_code+region_scope+effective_from already exists among non-RETIRED rules; window opens_at or window_date already taken"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent entity's current version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The acting user performed a prior step of the same workflow (cite/assess, assess/confirm, assess/waive, submit/approve) and is barred from this step"
  - id: ERR_WINDOW_EXPIRED
    http: 422
    condition: "Temporal window closed: evidence window past, arbitration window past, commit outside [opens_at, closes_at), or cycle evaluated before period_end"
  - id: ERR_CERTIFICATION_STALE
    http: 422
    condition: "Program approval blocked: no PASSED certification test whose evaluated_program_version equals the current Program.version"
  - id: ERR_PROGRAM_NOT_ENABLED
    http: 422
    condition: "Referenced program is not PRODUCTION_ENABLED (BIN approval), or program version drifted from approved_version (production enablement)"
  - id: ERR_RATE_NOT_FOUND
    http: 422
    condition: "No published effective interchange rate matches the qualified data tier or any lower tier for (mcc, transaction_type, region)"
  - id: ERR_SETTLEMENT_INVALID
    http: 422
    condition: "Settlement fiscal violation: amount_cents <= 0, from_member == to_member, or a party member not ACTIVE"
  - id: ERR_RULE_NOT_EFFECTIVE
    http: 422
    condition: "Violation cites a rule that is not PUBLISHED or whose effective_from is after the current logical time"
  - id: ERR_SPONSOR_INACTIVE
    http: 422
    condition: "Participant approval blocked because the sponsoring member is not ACTIVE"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "Settlement line commit/reverse attempted while the window is not OPEN, or a second window opened while one is already OPEN"
  - id: ERR_DRAFT_LINES_REMAIN
    http: 422
    condition: "Window reconciliation blocked because DRAFT settlement lines remain in the window"
  - id: ERR_MERCHANT_NOT_ACTIVE
    http: 422
    condition: "Fraud case confirmation or dispute opening references a merchant not in ACTIVE status"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing or malformed (covers missing required input fields and type errors generically)"

roles:
  - name: NetworkOperator
    description: "Network-level administrator: membership lifecycle, BIN assignment, clock control"
    identity: "opaque"
    exclusive_operations: ["member approve/suspend/reinstate/terminate", "bin-range create/approve/deactivate", "clock set"]
    shared_operations: ["read any resource"]
  - name: SponsorshipManager
    description: "Manages sponsorship of non-member participants and merchant boarding"
    identity: "opaque"
    exclusive_operations: ["participant create/approve/suspend/reinstate/terminate", "merchant boarding"]
    shared_operations: ["read participants, merchants, members"]
  - name: RulesAdministrator
    description: "Publishes network rules and enforces compliance through the violation workflow"
    identity: "opaque"
    exclusive_operations: ["rule create/publish/retire", "violation cite/assess/confirm/waive"]
    shared_operations: ["read rules, violations, members"]
  - name: DisputeAnalyst
    description: "Decides chargeback disputes and renders arbitration outcomes"
    identity: "opaque"
    exclusive_operations: ["dispute decide/arbitrate/close"]
    shared_operations: ["read disputes, evidence, merchants"]
  - name: PricingAnalyst
    description: "Maintains interchange rate tables"
    identity: "opaque"
    exclusive_operations: ["interchange-rate create/publish/retire"]
    shared_operations: ["read rates, quote"]
  - name: FraudAnalyst
    description: "Runs fraud monitoring cycles, confirms fraud cases, manages remediation plans"
    identity: "opaque"
    exclusive_operations: ["fraud-case confirm/dismiss", "cycle create/evaluate", "remediation-plan submit/approve/complete/escalate"]
    shared_operations: ["read merchants, participants, fraud cases"]
  - name: SettlementOperator
    description: "Operates clearing/settlement windows and funds-transfer lines"
    identity: "opaque"
    exclusive_operations: ["settlement-window create/open/reconcile/close", "settlement-line create/commit/reverse"]
    shared_operations: ["read windows, lines, positions, members"]
  - name: CertificationEngineer
    description: "Registers programs, runs certification tests, approves and enables products"
    identity: "opaque"
    exclusive_operations: ["program create/edit/approve/enable-production/retire", "certification-test submit/pass/fail"]
    shared_operations: ["read programs, tests, bin-ranges"]
  - name: Member
    description: "An institution member acting on its own behalf (disputes, appeals, fraud reporting, quotes)"
    identity: "entity_backed:Member"
    exclusive_operations: ["dispute open/evidence/request-arbitration (as case party)", "violation appeal (as subject)"]
    shared_operations: ["read own member record, quotes, rates"]
