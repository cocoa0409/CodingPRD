# =============================================================================
# 1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml sections 1.1-1.7
# Taxonomy: references/claim-extraction-guide.md (nine sections, per-section rows)
# Depth probe (nine Difficulty Rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corners it already covers appear here as `excluded_because:` stubs.
# Every recipe is self-contained from an empty database and drives the logical
# clock explicitly (startup default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - entities
  # ===========================================================================
  - section: entities
    instances:
      - name: petition_create_returns_declared_fields_and_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Petition
          - endpoints.POST_petitions
          - response_envelope.success
        distinguishing_aspect: |
          A freshly docketed Petition must come back with every input field echoed and every
          computed field at its declared default - case_status RECEIVED, case_posture OPEN, all
          four headcount buckets 0, certification_outcome NONE, retraining_required false - inside
          the documented success envelope with response_type "object" and version 1.
        test_recipe:
          setup:
            - "empty database; logical clock moved to 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
          trigger:
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340001", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "data.case_number == '07-RC-340001', data.petition_type == 'RC', data.claimed_employee_count == 120, data.payroll_period_end == '2026-08-14'"
            - "data.case_status == 'RECEIVED' and data.case_posture == 'OPEN'"
            - "data.total_classified_headcount == 0, data.included_headcount == 0, data.excluded_headcount == 0, data.pending_headcount == 0"
            - "data.showing_verdict == 'PENDING', data.certification_outcome == 'NONE', data.retraining_required == false"
            - "data.pending_objection_count == 0 and data.blocking_charge_count == 0"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are all present"

      - name: petition_get_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_petitions_id
          - entities.Petition
        distinguishing_aspect: |
          GET by id returns exactly the persisted row, not a re-derivation: the same version the
          create returned, the same input values, and response_type "object".
        test_recipe:
          setup:
            - "one Petition 07-RC-340002 in RECEIVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340002", petition_type: "RM", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production employees at Plant 2", claimed_employee_count: 65, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
          trigger:
            - call: "GET /labor-relations/petitions/${pet_id}"
              payload: {}
              as: EmploymentCounsel
          assert:
            - "HTTP 200, response_type == 'object', data.id == ${pet_id}"
            - "data.petition_type == 'RM' and data.claimed_employee_count == 65"
            - "data.version == 1 (a pure read never bumps version)"

      - name: classification_list_filters_by_petition_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_classifications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint must apply the petition_id filter BEFORE paginating: total_count is the
          filtered cardinality (3), not the table cardinality (4), and has_more flips to false only
          on the page that exhausts the filtered set.
        test_recipe:
          setup:
            - "petition A 07-RC-340003 with three classifications, petition B 07-RC-340004 with one"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340003", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_a: $.data.id }
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340004", petition_type: "RC", union_name: "Allied Trades Council", filed_date: "2026-08-03", proposed_unit_description: "All warehouse employees at Plant 3", claimed_employee_count: 40, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_b: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_a}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions/${pet_b}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: HRDataAnalyst
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: HRDataAnalyst
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", code: "QC", title: "Quality Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: HRDataAnalyst
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_b}", code: "WHSE", title: "Warehouse Selector", headcount: 40, avg_hourly_wage_cents: 2200, shift_code: "C", work_location: "PLANT_3", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 70, skills_overlap: 66, functional_integration: 72, interchange_rate: 55, work_conditions_overlap: 80 }
              as: HRDataAnalyst
          trigger:
            - call: "GET /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", limit: 2, offset: 0 }
              as: BoardAgent
            - call: "GET /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", limit: 2, offset: 2 }
              as: BoardAgent
            - call: "GET /labor-relations/classifications"
              payload: { petition_id: "${pet_a}", scope_ruling: "PENDING", limit: 10, offset: 0 }
              as: BoardAgent
          assert:
            - "call 1: HTTP 200, response_type == 'array', total_count == 3, has_more == true, len(data) == 2"
            - "call 2: total_count == 3, has_more == false, len(data) == 1"
            - "call 3: total_count == 3 (all three are still PENDING) and the WHSE row of the other petition never appears"
            - "every returned row has petition_id == ${pet_a}"

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_PETITION_NOT_FOUND
          - errors.ERR_CLASSIFICATION_NOT_FOUND
          - errors.ERR_ELECTION_AGREEMENT_NOT_FOUND
          - errors.ERR_VOTER_LIST_NOT_FOUND
          - errors.ERR_VOTER_LIST_ENTRY_NOT_FOUND
          - errors.ERR_SUPERVISOR_NOT_FOUND
          - errors.ERR_CAMPAIGN_COMMUNICATION_NOT_FOUND
          - errors.ERR_ELECTION_ROUND_NOT_FOUND
          - errors.ERR_POLL_SESSION_NOT_FOUND
          - errors.ERR_CHALLENGED_BALLOT_NOT_FOUND
          - errors.ERR_OBJECTION_NOT_FOUND
          - errors.ERR_ULP_CHARGE_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: |
          Priority 6 is per-entity, not a generic 404: each of the twelve GET-by-id routes must
          name its OWN entity's error id, so a wrong-collection lookup cannot be masked by a
          shared ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "empty database - no row of any entity exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: BoardAgent
          trigger:
            - call: "GET /labor-relations/petitions/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BoardAgent
              captures: { e1: "$.data.error_id" }
            - call: "GET /labor-relations/classifications/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: BoardAgent
              captures: { e2: "$.data.error_id" }
            - call: "GET /labor-relations/election-agreements/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: BoardAgent
              captures: { e3: "$.data.error_id" }
            - call: "GET /labor-relations/voter-lists/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: BoardAgent
              captures: { e4: "$.data.error_id" }
            - call: "GET /labor-relations/voter-list-entries/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: BoardAgent
              captures: { e5: "$.data.error_id" }
            - call: "GET /labor-relations/supervisors/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: BoardAgent
              captures: { e6: "$.data.error_id" }
            - call: "GET /labor-relations/campaign-communications/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: BoardAgent
              captures: { e7: "$.data.error_id" }
            - call: "GET /labor-relations/election-rounds/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: BoardAgent
              captures: { e8: "$.data.error_id" }
            - call: "GET /labor-relations/poll-sessions/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: BoardAgent
              captures: { e9: "$.data.error_id" }
            - call: "GET /labor-relations/challenged-ballots/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: BoardAgent
              captures: { e10: "$.data.error_id" }
            - call: "GET /labor-relations/objections/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: BoardAgent
              captures: { e11: "$.data.error_id" }
            - call: "GET /labor-relations/ulp-charges/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: BoardAgent
              captures: { e12: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type == 'error'"
            - "e1 == 'ERR_PETITION_NOT_FOUND', e2 == 'ERR_CLASSIFICATION_NOT_FOUND', e3 == 'ERR_ELECTION_AGREEMENT_NOT_FOUND'"
            - "e4 == 'ERR_VOTER_LIST_NOT_FOUND', e5 == 'ERR_VOTER_LIST_ENTRY_NOT_FOUND', e6 == 'ERR_SUPERVISOR_NOT_FOUND'"
            - "e7 == 'ERR_CAMPAIGN_COMMUNICATION_NOT_FOUND', e8 == 'ERR_ELECTION_ROUND_NOT_FOUND', e9 == 'ERR_POLL_SESSION_NOT_FOUND'"
            - "e10 == 'ERR_CHALLENGED_BALLOT_NOT_FOUND', e11 == 'ERR_OBJECTION_NOT_FOUND', e12 == 'ERR_ULP_CHARGE_NOT_FOUND'"

      - name: create_with_unknown_referenced_id_returns_referenced_entity_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7]
          - errors.ERR_PETITION_NOT_FOUND
          - errors.ERR_VOTER_LIST_NOT_FOUND
          - errors.ERR_ELECTION_ROUND_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so a parent is named only in the BODY. Priority 7 must therefore
          validate every body FK against its own collection and report the REFERENCED entity's
          not-found code, not the code of the entity being created.
        test_recipe:
          setup:
            - "one Petition in SCOPE_ANALYSIS exists so that only the referenced ids are unknown"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340005", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: HRDataAnalyst
              captures: { cls_prod_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "00000000-0000-4000-8000-0000000000f1", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: HRDataAnalyst
              captures: { e1: "$.data.error_id" }
            - call: "POST /labor-relations/voter-list-entries"
              payload: { voter_list_id: "00000000-0000-4000-8000-0000000000f2", classification_id: "${cls_prod_id}", full_name: "Ana Ruiz", hire_date: "2024-03-11", home_address: "12 Elm St, Flint MI", personal_email: "ana@example.com", personal_phone: "555-0101", shift_code: "A", work_location: "PLANT_1" }
              as: HRDataAnalyst
              captures: { e2: "$.data.error_id" }
            - call: "POST /labor-relations/objections"
              payload: { election_round_id: "00000000-0000-4000-8000-0000000000f3", filed_by_party: "UNION", ground_code: "POLLING_IRREGULARITY", conduct_occurred_at: "2026-09-01T10:00:00Z", alleged_affected_voter_count: 4, description: "Ballot box left unattended" }
              as: UnionRepresentative
              captures: { e3: "$.data.error_id" }
          assert:
            - "e1 == 'ERR_PETITION_NOT_FOUND' with HTTP 404 and no Classification row is written"
            - "e2 == 'ERR_VOTER_LIST_NOT_FOUND' with HTTP 404"
            - "e3 == 'ERR_ELECTION_ROUND_NOT_FOUND' with HTTP 404 and Petition.pending_objection_count stays 0"

      - name: petition_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_petitions
        distinguishing_aspect: |
          payroll_period_end has source input and no default, so omitting it is a 422 request
          error - not a null column and not a silently derived value.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
          trigger:
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340006", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120 }
              as: LaborRelationsDirector
              captures: { e1: "$.data.error_id" }
            - call: "GET /labor-relations/petitions"
              payload: { limit: 10, offset: 0 }
              as: LaborRelationsDirector
          assert:
            - "e1 == 'ERR_INVALID_REQUEST' with HTTP 422"
            - "the follow-up list returns total_count == 0 - the rejected create wrote nothing"

      - name: omitted_optional_inputs_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Classification.fields.supervisory_authority_count
          - entities.CampaignCommunication.fields.duration_minutes
          - entities.CampaignCommunication.fields.threat_statement_count
          - entities.VoterListEntry.fields.on_leave_type
        distinguishing_aspect: |
          Three different entities carry input fields with declared defaults. Omitting them must
          produce the declared default (0, 60, false, NONE), which is observably different from
          null - risk_score arithmetic and eligibility both read these fields later.
        test_recipe:
          setup:
            - "petition 07-RC-340007 in SCOPE_ANALYSIS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340007", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
          trigger:
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: HRDataAnalyst
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", channel: "EMAIL", audience_scope: "UNIT_WIDE", planned_delivery_at: "2026-08-25T12:00:00Z", message_summary: "Facts about the petition and the election process" }
              as: LaborRelationsDirector
              captures: { comm_id: $.data.id }
          assert:
            - "Classification.${cls_prod_id}.supervisory_authority_count == 0 (declared default) and scope_ruling == 'PENDING'"
            - "CampaignCommunication.${comm_id}.duration_minutes == 60, threat_statement_count == 0"
            - "CampaignCommunication.${comm_id}.contains_interrogation == false, contains_promise_of_benefit == false, contains_surveillance_reference == false, escalation_ack == false"
            - "CampaignCommunication.${comm_id}.status == 'DRAFT', risk_score == 0, revision_round == 0, accuracy_reviewed_at is null"
            - "Petition.${pet_id}.total_classified_headcount == 60 and pending_headcount == 60"

      - name: voter_list_submit_records_system_user_and_clock_fields
        claim_type: System Fields
        grounds:
          - entities.VoterList.fields.submitted_by_user_id
          - entities.VoterList.fields.submitted_at
          - endpoints.POST_voter_lists_id_submit
        distinguishing_aspect: |
          submitted_by_user_id has source system: it comes from the X-User-ID header of the submit
          call, never from the body, and submitted_at comes from the logical clock, not from the
          caller - so two different users submitting two lists leave two different attributions.
        test_recipe:
          setup:
            - "petition 07-RC-340008 with a stipulated election and a DRAFT voter list holding two complete entries"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-340008", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: HRDataAnalyst
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: HRDataAnalyst
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Integrated with production" }
              as: BoardAgent
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 40, duplicate_card_count: 3, undated_card_count: 2, stale_card_count: 2, nonunit_card_count: 3 }
              as: BoardAgent
            - call: "POST /labor-relations/election-agreements"
              payload: { petition_id: "${pet_id}", agreement_type: "STIPULATED", proposed_election_date: "2026-09-01", proposed_voting_method: "MANUAL" }
              as: LaborRelationsDirector
              captures: { agr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T15:00:00Z" }
              as: BoardAgent
            - call: "POST /labor-relations/election-agreements/${agr_id}/stipulate"
              payload: { approved_election_date: "2026-09-01", voting_method: "MANUAL", polls_open_at: "2026-09-01T06:00:00Z", polls_close_at: "2026-09-01T17:00:00Z" }
              as: BoardAgent
            - call: "GET /labor-relations/petitions/${pet_id}"
              payload: {}
              as: LaborRelationsDirector
              captures: { pet_ver: $.data.version }
            - call: "POST /labor-relations/voter-lists"
              payload: { petition_id: "${pet_id}", election_agreement_id: "${agr_id}", expected_petition_version: "${pet_ver}" }
              as: HRDataAnalyst
              captures: { vl_id: $.data.id }
            - call: "POST /labor-relations/voter-list-entries"
