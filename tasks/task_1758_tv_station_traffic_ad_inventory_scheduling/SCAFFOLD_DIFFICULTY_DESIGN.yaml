              as: TrafficManager
              captures: { prog10_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week10_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week10_id}/avail-units"
              payload: { program_id: "${prog10_id}", air_date: "2026-08-04", break_position: 1, total_seconds: 60, reserved_political_seconds: 30 }
              as: TrafficManager
              captures: { unit10_id: "$.data.id",  unit10_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv10_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order10_id: "$.data.id"}
            - call: "POST /traffic/orders/${order10_id}/lines"
              payload: { program_id: "${prog10_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order10_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order10_id}"
              payload: {}
              as: SalesRep
              captures: { order10_v: "$.data.version"}
            - call: "POST /traffic/orders/${order10_id}/approve"
              payload: { expected_order_version: "${order10_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order10_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line10_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line10_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { r10a: "$.data[0].id",  r10b: "$.data[1].id"}
            - call: "POST /traffic/spots/${r10a}/place"
              payload: { avail_unit_id: "${unit10_id}", expected_avail_unit_version: "${unit10_v0}" }
              as: TrafficManager
            - call: "GET /traffic/avail-units/${unit10_id}"
              payload: {}
              as: TrafficManager
              captures: { unit10_v1: "$.data.version"}
          trigger:
            - call: "POST /traffic/spots/${r10b}/place"
              payload: { avail_unit_id: "${unit10_id}", expected_avail_unit_version: "${unit10_v1}" }
              as: TrafficManager
              captures: { dual10_err: "$.data.error_id"}
          assert:
            - "${dual10_err} == ERR_POLITICAL_RESERVE — priority-7 safety beats priority-9 separation when both fail on one call"
            - "Spot.${r10b}.status stays PENDING_PLACEMENT"
            - "AvailUnit.${unit10_id}.booked_commercial_seconds == 30 (unchanged)"

  # ======================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: headroom_equality_accepted_overflow_by_one_spot_rejected
        grounds:
          - calculations.avail_headroom_check
          - errors[ERR_AVAIL_OVERFLOW]
        distinguishing_aspect: |
          Numeric boundary on integer seconds via POST /spots/{id}/place:
          a 60s spot into an empty 60s unit is ACCEPTED (inclusive
          equality); a further 30s spot is rejected (60 + 30 > 60). Metric
          = avail seconds.
        test_recipe:
          setup:
            - "Advertiser A11 (RETAIL), Program P11 (OVERNIGHT weekday 7 = Sunday 2026-08-09, rating 0.5)"
            - "Week W11, unit U11 (2026-08-09, total 60s, reserve 0)"
            - "Order approved with line L11a (60s x 1) and line L11b (30s x 1), both spots pending"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A11", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv11_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Sun Overnight", daypart_code: "OVERNIGHT", airs_weekday: 7, start_time_local: "02:00", duration_minutes: 60, rating_estimate: 0.5 }
              as: TrafficManager
              captures: { prog11_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week11_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week11_id}/avail-units"
              payload: { program_id: "${prog11_id}", air_date: "2026-08-09", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit11_id: "$.data.id",  unit11_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv11_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order11_id: "$.data.id"}
            - call: "POST /traffic/orders/${order11_id}/lines"
              payload: { program_id: "${prog11_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 60, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
              captures: { line11a_id: "$.data.id"}
            - call: "POST /traffic/orders/${order11_id}/lines"
              payload: { program_id: "${prog11_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 3000, guaranteed_rating: 0 }
              as: SalesRep
              captures: { line11b_id: "$.data.id"}
            - call: "POST /traffic/orders/${order11_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order11_id}"
              payload: {}
              as: SalesRep
              captures: { order11_v: "$.data.version"}
            - call: "POST /traffic/orders/${order11_id}/approve"
              payload: { expected_order_version: "${order11_v}" }
              as: TrafficManager
            - call: "GET /traffic/order-lines/${line11a_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot11a_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line11b_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot11b_id: "$.data[0].id"}
          trigger:
            - call: "POST /traffic/spots/${spot11a_id}/place"
              payload: { avail_unit_id: "${unit11_id}", expected_avail_unit_version: "${unit11_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${spot11b_id}/place"
              payload: { avail_unit_id: "${unit11_id}", expected_avail_unit_version: "${unit11_v0} + 1" }
              as: TrafficManager
              captures: { overflow_err: "$.data.error_id"}
          assert:
            - "60s into 60s: ACCEPTED — Spot.${spot11a_id}.status == SCHEDULED; AvailUnit.booked_commercial_seconds == 60 (equality accepted)"
            - "30s into remaining 0: ${overflow_err} == ERR_AVAIL_OVERFLOW (60 + 30 > 60)"
            - "boundary inclusive: d == remaining succeeds; any d > remaining fails"
      - name: reconcile_empty_scheduled_set_exact_cover
        grounds:
          - validations[priority=11]
          - errors[ERR_RECONCILE_MISMATCH]
        distinguishing_aspect: |
          Empty-collection boundary via POST /log-days/{id}/reconcile: a
          FINALIZED log day with ZERO scheduled spots reconciles with an
          empty entries list (exact cover of cardinality 0); a one-entry
          payload is ERR_RECONCILE_MISMATCH. Metric = set cardinality,
          endpoint = reconcile — distinct from the avail-seconds boundary.
        test_recipe:
          setup:
            - "Program P12 (EARLY_MORNING weekday 1, rating 1.0), week W12 (2026-08-03)"
            - "LogDay LD12 for 2026-08-03 created and finalized with NO spots scheduled on that date (copy precondition trivially satisfied by the empty set)"
            - "A stray SCHEDULED spot s12 exists on a DIFFERENT date's unit to use as an 'extra entry' probe"
          setup_api_calls:
            - call: "POST /traffic/programs"
              payload: { title: "Mon Early", daypart_code: "EARLY_MORNING", airs_weekday: 1, start_time_local: "05:00", duration_minutes: 60, rating_estimate: 1.0 }
              as: TrafficManager
              captures: { prog12_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week12_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week12_id}/log-days"
              payload: { log_date: "2026-08-03" }
              as: TrafficManager
              captures: { log12_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log12_id}/finalize"
              payload: {}
              as: TrafficManager
            - call: "POST /traffic/advertisers"
              payload: { name: "A12", product_category: "OTHER", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv12_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-10" }
              as: TrafficManager
              captures: { week12b_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week12b_id}/avail-units"
              payload: { program_id: "${prog12_id}", air_date: "2026-08-10", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit12_id: "$.data.id",  unit12_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv12_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-16" }
              as: SalesRep
              captures: { order12_id: "$.data.id"}
            - call: "POST /traffic/orders/${order12_id}/lines"
              payload: { program_id: "${prog12_id}", weeks_requested: 2, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 2000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order12_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order12_id}"
              payload: {}
              as: SalesRep
              captures: { order12_v: "$.data.version"}
            - call: "POST /traffic/orders/${order12_id}/approve"
              payload: { expected_order_version: "${order12_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order12_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line12_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line12_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot12_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot12_id}/place"
              payload: { avail_unit_id: "${unit12_id}", expected_avail_unit_version: "${unit12_v0}" }
              as: TrafficManager
          trigger:
            - call: "POST /traffic/log-days/${log12_id}/reconcile"
              payload: { entries: [ { spot_id: "${spot12_id}", aired: true, actual_rating: 1.0 } ] }
              as: BillingClerk
              captures: { rec_err: "$.data.error_id"}
            - call: "POST /traffic/log-days/${log12_id}/reconcile"
              payload: { entries: [] }
              as: BillingClerk
          assert:
            - "extra-entry probe: ${rec_err} == ERR_RECONCILE_MISMATCH (entry cites a spot not scheduled on this log date — payload is not the exact cover of the empty set)"
            - "empty entries [] IS the exact cover: second call succeeds, LogDay.${log12_id}.status == RECONCILED, zero AsRunEntry rows created"
            - "cardinality boundary: 0 scheduled spots requires exactly 0 entries"
      - name: credit_limit_equality_boundary_on_approve
        grounds:
          - validations[priority=12]
          - errors[ERR_CREDIT_LIMIT]
        distinguishing_aspect: |
          Fiscal boundary via POST /orders/{id}/approve: outstanding
          exposure + order budget exactly equal to credit_limit_cents is
          ACCEPTED (<=); one cent over is rejected. Metric = cents of
          credit headroom, endpoint = order approve — distinct metric and
          endpoint from the other two boundary instances.
        test_recipe:
          setup:
            - "Advertiser A13 (RETAIL, credit_limit_cents == 50000)"
            - "Program P13 (PRIME weekday 6, rating 5.0)"
            - "Order O13 line (30s x 1, rate 50000c, guarantee 0) submitted — approving takes exposure to exactly the limit"
            - "Order O13b (same advertiser) line (30s x 1, rate 1c) submitted — approving after O13 exceeds the limit by exactly 1 cent"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A13", product_category: "RETAIL", credit_limit_cents: 50000 }
              as: SalesRep
              captures: { adv13_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Sat Prime 13", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog13_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv13_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order13_id: "$.data.id"}
            - call: "POST /traffic/orders/${order13_id}/lines"
              payload: { program_id: "${prog13_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 50000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order13_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order13_id}"
              payload: {}
              as: SalesRep
              captures: { order13_v: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv13_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order13b_id: "$.data.id"}
            - call: "POST /traffic/orders/${order13b_id}/lines"
              payload: { program_id: "${prog13_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 1, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order13b_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order13b_id}"
              payload: {}
              as: SalesRep
              captures: { order13b_v: "$.data.version"}
          trigger:
            - call: "POST /traffic/orders/${order13_id}/approve"
              payload: { expected_order_version: "${order13_v}" }
              as: TrafficManager
            - call: "POST /traffic/orders/${order13b_id}/approve"
              payload: { expected_order_version: "${order13b_v}" }
              as: TrafficManager
              captures: { credit_err: "$.data.error_id"}
          assert:
            - "Order.${order13_id}.status == APPROVED — exposure 0 + 50000 <= 50000, equality accepted"
            - "${credit_err} == ERR_CREDIT_LIMIT — exposure 50000 + 1 > 50000, rejected by exactly one cent"
            - "Order.${order13b_id}.status stays SUBMITTED"

  # ======================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_gated_by_availweek_open
        grounds:
          - state_machines.Spot.PENDING_PLACEMENT_to_SCHEDULED
          - state_machines.AvailWeek.OPEN_to_LOCKED
        distinguishing_aspect: |
          Pair (Spot, AvailWeek): a spot cannot transition
          PENDING_PLACEMENT -> SCHEDULED once the AvailWeek owning the
          target unit is LOCKED — Spot's valid transitions depend on
          AvailWeek state.
        test_recipe:
          setup:
            - "Advertiser A14 (RETAIL), Program P14 (DAYTIME weekday 1 = Monday 2026-08-03, rating 2.0)"
            - "Week W14; unit U14 (2026-08-03, 60s); copy received"
            - "Order approved with line (30s x 2, guarantee 0): spot s14a placed BEFORE finalize; spot s14b left PENDING_PLACEMENT"
            - "LogDay LD14 for 2026-08-03 finalized -> W14 becomes LOCKED"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A14", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv14_id: "$.data.id"}
