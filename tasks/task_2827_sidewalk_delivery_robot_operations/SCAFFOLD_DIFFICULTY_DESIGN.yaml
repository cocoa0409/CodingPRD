              as: MerchantOperator
              as_user_id: "${m}"
              captures: { mi2_v: $.data.version, lid2: $.data.lid_access_code }
            - call: "POST /route-plans"
              payload: { mission_id: "${mi2}", segment_sequence: ["${s1}", "${s2}", "${s3}", "${s5}"], expected_delivery_mission_version: "${mi2_v}" }
              as: FleetDispatcher
              captures: { p2: $.data.id }
