              as_user_id: "supervisor-1"
          assert:
            - "trigger call 1: response.status == 201 with source MANUAL, status POSTED and amount_cents 4762"
            - "trigger call 1: Assessment.${asmt_id}.total_adjustments_cents == 4762, balance_due_cents == 0, collection_status == SATISFIED"
            - "trigger call 2: AssessmentAdjustment.${adj_id}.status == REVERSED"
            - "trigger call 2: Assessment.${asmt_id}.total_adjustments_cents == 0, balance_due_cents == 4762, collection_status == DUE"
            - "trigger call 2: Assessment.${asmt_id}.total_due_cents == 4762 and amount_paid_cents == 0, so balance + adjustments + paid == total_due"
            - "trigger call 2: Assessment.${asmt_id}.status == ISSUED throughout"

      - name: waiver_void_returns_every_day_it_added
        grounds:
          - calculations.statute_expiry
          - endpoints.POST /statute-waivers/{id}/void
          - entities.Audit.fields.waiver_days_added
          - state_machines.StatuteWaiver
        distinguishing_aspect: |
          Executing a waiver to 2030-06-29 moves the audit's expiry off the 2029-06-29
          base and records days_added 365; voiding it must return the expiry to exactly
          2029-06-29 and waiver_days_added to 0, with the voided waiver's own days_added
          zeroed. Implementations that subtract a re-derived interval, or that leave the
          waiver in the replay set, land on a different date.
        test_recipe:
          setup:
            - "Ridgeline Tools converted and scoped 2026-01-01..2026-06-30, so base_statute_expiry_date is 2029-06-29; the clock is left at its 2026-08-01 default."
            - "One DRAFTED waiver covering the scope end and extending to 2030-06-29."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-K2", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { tk_id: "$.data.id" }
