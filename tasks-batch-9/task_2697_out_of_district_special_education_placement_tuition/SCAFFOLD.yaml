scenario: |
  Generate task harder than expert level!

  2697. Out-of-District Special Education Placement & Tuition (district placement office):
  placement team decision documentation of least restrictive environment considerations,
  approved private school selection with rate-setting and state-approved tuition schedules,
  contract execution with related services, transportation and residential components,
  parental unilateral placement and reimbursement claim adjudication, progress monitoring,
  quarterly reporting and return-to-district planning, tuition billing verification against
  attendance and service delivery, state high-cost fund and Medicaid reimbursement claiming,
  placement termination and transition services

domain_name: out-of-district-special-education-placement-tuition
api_prefix: /ood-placements

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /ood-placements; parentage is
  # expressed only through FK body fields, never through nested URL paths. Placement
  # additionally references itself (prior_placement_id) to chain successive placements.

  state_machine_shape: cyclic
  # PlacementDecision loops TEAM_REVIEW -> RETURNED_FOR_REVISION -> TEAM_REVIEW (bounded
  # at MAX_REVISION_ROUNDS); ReimbursementClaim loops AWARDED_PARTIAL/DENIED -> REMANDED ->
  # AWARDED_* (bounded at MAX_REMAND_ROUNDS); AttendanceRecord loops DISPUTED -> SUBMITTED;
  # TuitionInvoice carries two independent dimensions (verification_status x payment_status)
  # and loops DISPUTED -> SUBMITTED on that first dimension; Placement forks
  # ACTIVE -> {TERMINATED, RETURNED_TO_DISTRICT} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The user who authors a PlacementDecision cannot be the user who approves or returns it;
  # the user who verifies a TuitionInvoice cannot be the user who approves its payment.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities, 70 endpoints, 51 error codes, 4 dual-variant calculations, 11 state
  # machines (5 non-linear), 2 OCC rules, 2 conserved-quantity invariants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: state_student_id
        type: string
        source: input
        description: Statewide unique student identifier used on state funding claims.
        constraints: "Unique across all Student rows; 1-32 chars."
      - name: full_name
        type: string
        source: input
        description: Student legal name as printed on the IEP.
      - name: district_of_residence
        type: string
        source: input
        description: Code of the district financially responsible for the placement.
      - name: disability_category
        type: enum
        source: input
        description: Primary IDEA disability category driving the placement decision.
        constraints: "One of {AUTISM, EMOTIONAL_DISABILITY, INTELLECTUAL_DISABILITY, MULTIPLE_DISABILITIES, SPECIFIC_LEARNING_DISABILITY, OTHER_HEALTH_IMPAIRMENT}."
      - name: iep_effective_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the current IEP took effect.
      - name: lre_current_setting
        type: enum
        source: input
        description: Least-restrictive-environment setting the student occupies today.
        constraints: "One of {GENERAL_ED_80_PLUS, RESOURCE_40_79, SEPARATE_CLASS_UNDER_40, SEPARATE_DAY_SCHOOL, RESIDENTIAL_FACILITY}."
      - name: medicaid_eligible
        type: boolean
        source: input
        description: True when the student is Medicaid-enrolled, gating MEDICAID FundingClaim creation.
        default: false
      - name: medicaid_consent_on_file
        type: boolean
        source: input
        description: True when signed parental consent to bill Medicaid is on file.
        default: false
      - name: placement_status
        type: enum
        source: computed
        description: Derived rollup of the student's out-of-district placement lifecycle.
        default: NONE
        constraints: "One of {NONE, DECISION_APPROVED, OOD_ACTIVE, RETURNED, TERMINATED}. NONE at creation; DECISION_APPROVED written by PlacementDecision TEAM_REVIEW->APPROVED; OOD_ACTIVE by Placement CONTRACTED->ACTIVE; RETURNED by Placement ACTIVE->RETURNED_TO_DISTRICT; TERMINATED by Placement ACTIVE->TERMINATED."
      - name: high_cost_flag
        type: boolean
        source: computed
        description: Set true by the cascade link that creates a HIGH_COST_FUND FundingClaim for any of this student's placements.
        default: false
      - name: projected_state_recovery_cents
        type: integer
        source: computed
        description: Running sum of FundingClaim.reimbursable_amount_cents over every FundingClaim whose Placement.student_id equals this Student.id and whose status is in {ELIGIBLE, SUBMITTED}.
        default: 0

  - name: ApprovedPrivateSchool
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the state-approved private special education school.
      - name: state_approval_id
        type: string
        source: input
        description: State approval registration number.
        constraints: "Unique across all ApprovedPrivateSchool rows."
      - name: approval_status
        type: enum
        source: input
        description: State approval posture; gates contract execution and activation.
        default: PROVISIONAL
        constraints: "One of {APPROVED, PROVISIONAL, REVOKED}. Settable at create and by PATCH /ood-placements/private-schools/{id}/approval-status."
      - name: residential_capable
        type: boolean
        source: input
        description: True when the school holds a residential (24-hour) programme licence.
        default: false
      - name: medicaid_provider_number
        type: string
        source: input
        description: State Medicaid provider number; null when the school cannot bill Medicaid.
        default: null
      - name: active_rate_schedule_id
        type: string
        source: computed
        description: Denormalised pointer to the TuitionRateSchedule row (TuitionRateSchedule.id) for this school whose approval_state == STATE_APPROVED and whose fiscal_year is the highest such value; null when no STATE_APPROVED schedule exists.
        default: null

  - name: TuitionRateSchedule
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> ApprovedPrivateSchool.id; the school whose rates this schedule sets.
      - name: fiscal_year
        type: integer
        source: input
        description: State fiscal year the schedule covers (FY2027 == 2026-07-01 through 2027-06-30).
        constraints: "Integer in [2020, 2100]."
      - name: day_rate_cents
        type: integer
        source: input
        description: State-approved per-instructional-day tuition rate in whole cents.
        constraints: "Integer >= 1."
      - name: residential_rate_cents
        type: integer
        source: input
        description: State-approved per-night room-and-board rate in whole cents.
        constraints: "Integer >= 0."
      - name: service_hourly_rate_cents
        type: integer
        source: input
        description: State-approved per-hour related-services rate in whole cents, pinned onto ServiceAddendum.hourly_rate_cents at authorization.
        constraints: "Integer >= 0."
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the schedule starts covering, inclusive.
      - name: effective_to
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the schedule stops covering, inclusive.
      - name: approval_state
        type: enum
        source: input
        description: Rate-setting posture of this schedule.
        default: DRAFT
        constraints: "One of {DRAFT, STATE_APPROVED, SUPERSEDED}. DRAFT and STATE_APPROVED are settable at create; SUPERSEDED is written only by the supersede side effect of a later STATE_APPROVED create for the same (school_id, fiscal_year)."
      - name: superseded_by_schedule_id
        type: string
        source: computed
        description: TuitionRateSchedule.id of the schedule that superseded this one; null while approval_state != SUPERSEDED.
        default: null

  - name: PlacementDecision
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student the placement team is deciding for.
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlacementCoordinator who created this decision; frozen at creation and compared against the reviewing TeamChair's X-User-ID for segregation of duties.
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the TeamChair who last returned or approved this decision; null until the first review action.
        default: null
      - name: lre_justification
        type: string
        source: input
        description: Narrative explaining why the least restrictive environment cannot be met in district.
        constraints: "Trimmed length >= 40 characters at submit time."
      - name: continuum_options_considered
        type: array
        source: input
        description: Array of objects {setting, rejected_reason} recording each continuum-of-alternative-placements option the team examined and rejected.
        constraints: "At submit time the array MUST contain >= MIN_CONTINUUM_OPTIONS (3) entries, each with non-empty setting and rejected_reason."
      - name: recommended_placement_type
        type: enum
        source: input
        description: Placement intensity the team recommends.
        constraints: "One of {DAY, RESIDENTIAL}."
      - name: revision_round
        type: integer
        source: computed
        description: Count of TEAM_REVIEW->RETURNED_FOR_REVISION transitions taken so far.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Placement-team decision lifecycle state.
        default: DRAFT
        constraints: "One of {DRAFT, TEAM_REVIEW, RETURNED_FOR_REVISION, APPROVED}."
      - name: submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent submit into TEAM_REVIEW; null while DRAFT.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the TEAM_REVIEW->APPROVED transition; null otherwise.
        default: null
      - name: reviewer_notes
        type: string
        source: computed
        description: Free text supplied by the TeamChair on the most recent return-for-revision or approve action.
        default: null

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the placed student.
      - name: school_id
        type: string
        source: input
        description: FK -> ApprovedPrivateSchool.id; the receiving approved private school.
      - name: decision_id
        type: string
        source: input
        description: FK -> PlacementDecision.id; the placement-team decision authorising this placement.
      - name: rate_schedule_id
        type: string
        source: input
        description: FK -> TuitionRateSchedule.id; the schedule version-pinned onto this placement at contract execution and used for every downstream invoice line.
      - name: fiscal_account_id
        type: string
        source: input
        description: FK -> DistrictFiscalAccount.id; the account this placement encumbers and disburses against.
      - name: prior_placement_id
        type: string
        source: input
        description: FK -> Placement.id; the immediately preceding placement this one succeeds, or null for a first placement.
        default: null
      - name: placement_type
        type: enum
        source: input
        description: DAY bills instructional days only; RESIDENTIAL additionally bills residential nights.
        constraints: "One of {DAY, RESIDENTIAL}."
      - name: start_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the first placement day, inclusive.
      - name: end_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the last placement day, inclusive.
        constraints: "end_date >= start_date."
      - name: contracted_instructional_days
        type: integer
        source: input
        description: Instructional days the contract commits to fund.
        constraints: "Integer in [1, 260]."
      - name: contracted_residential_nights
        type: integer
        source: input
        description: Residential nights the contract commits to fund; MUST be 0 when placement_type == DAY.
        default: 0
        constraints: "Integer in [0, 366]."
      - name: transportation_required
        type: boolean
        source: input
        description: True when the IEP requires district-funded specialised transportation.
        default: false
      - name: status
        type: enum
        source: computed
        description: Placement lifecycle state.
        default: PROPOSED
        constraints: "One of {PROPOSED, CONTRACTED, ACTIVE, TERMINATED, RETURNED_TO_DISTRICT, EXPIRED}."
      - name: transport_status
        type: enum
        source: computed
        description: Independent transportation dimension; NOT_REQUIRED while transportation_required is false, PENDING once required and unassigned, ASSIGNED/WAITLISTED/RELEASED as TransportationAssignment rows for this placement move.
        default: NOT_REQUIRED
        constraints: "One of {NOT_REQUIRED, PENDING, ASSIGNED, WAITLISTED, RELEASED}."
      - name: contract_encumbrance_cents
        type: integer
        source: computed
        description: Tuition-plus-residential base booked at PROPOSED->CONTRACTED per the placement_encumbrance calculation; zeroed by the terminate, return-to-district and expiry releases. Every TuitionInvoice settlement draws against this component only.
        default: 0
      - name: addendum_encumbrance_cents
        type: integer
        source: computed
        description: Sum of ServiceAddendum.encumbrance_cents over addenda whose placement_id equals this Placement.id and whose status == ACTIVE.
        default: 0
      - name: transport_encumbrance_cents
        type: integer
        source: computed
        description: Sum of TransportationAssignment.encumbrance_cents over assignments whose placement_id equals this Placement.id and whose status == ACTIVE.
        default: 0
      - name: encumbrance_cents
        type: integer
        source: computed
        description: "Currently-encumbered share of DistrictFiscalAccount held by this placement, defined exactly as max(0, contract_encumbrance_cents - paid_total_ytd_cents) + addendum_encumbrance_cents + transport_encumbrance_cents + transition_reserve_cents. DistrictFiscalAccount.encumbered_cents always equals the sum of this field over every Placement whose fiscal_account_id is that account."
        default: 0
      - name: released_encumbrance_cents
        type: integer
        source: computed
        description: Cumulative cents released back to DistrictFiscalAccount.available_cents by termination, return-to-district, expiry, addendum termination and transportation release.
        default: 0
      - name: paid_total_ytd_cents
        type: integer
        source: computed
        description: Running sum of TuitionInvoice.settled_amount_cents over invoices whose placement_id equals this Placement.id and whose payment_status == PAID.
        default: 0
      - name: transition_reserve_cents
        type: integer
        source: computed
        description: Cents held encumbered for post-return transition services; set to TRANSITION_SERVICES_RESERVE_CENTS when a ReturnTransitionPlan for this placement activates.
        default: 0
      - name: contract_executed_at
        type: datetime
        source: computed
        description: Logical-clock instant of PROPOSED->CONTRACTED; null before.
        default: null
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant of CONTRACTED->ACTIVE; null before.
        default: null
      - name: terminated_at
        type: datetime
        source: computed
        description: Logical-clock instant of ACTIVE->TERMINATED, ACTIVE->RETURNED_TO_DISTRICT or CONTRACTED->EXPIRED; null before.
        default: null
      - name: termination_reason
        type: string
        source: computed
        description: Reason text supplied on terminate, or the literal "ACTIVATION_GRACE_EXPIRED" written by the clock-driven CONTRACTED->EXPIRED transition.
        default: null

  - name: ServiceAddendum
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement this related-services addendum extends.
      - name: service_type
        type: enum
        source: input
        description: Related service authorised by the IEP.
        constraints: "One of {SPEECH, OT, PT, COUNSELING, BCBA}; unique per (placement_id, service_type) across addenda whose status is in {PROPOSED, ACTIVE}."
      - name: authorized_hours_per_week
        type: number
        source: input
        description: Weekly service hours the district authorises, in 0.25-hour increments.
        constraints: "Number in (0, 40]; must be an exact multiple of 0.25."
      - name: contract_weeks
        type: integer
        source: input
        description: Number of service weeks the addendum funds.
        default: 36
        constraints: "Integer in [1, 52]."
      - name: hourly_rate_cents
        type: integer
        source: computed
        description: Copy of TuitionRateSchedule.service_hourly_rate_cents taken from Placement.rate_schedule_id at the PROPOSED->ACTIVE authorization transition and frozen thereafter.
        default: 0
      - name: medicaid_billable
        type: boolean
        source: input
        description: True when hours delivered under this addendum count toward a MEDICAID FundingClaim.
        default: false
      - name: encumbrance_cents
        type: integer
        source: computed
        description: Cents encumbered by this addendum at authorization, per the service_addendum_encumbrance calculation.
        default: 0
      - name: delivered_hours_ytd
        type: number
        source: computed
        description: Running sum of hours_delivered across service_delivery_lines entries naming this addendum on AttendanceRecord rows whose status == VERIFIED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Addendum lifecycle state.
        default: PROPOSED
        constraints: "One of {PROPOSED, ACTIVE, TERMINATED, TRANSFERRED}."

  - name: TransportRoute
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: Operator route identifier.
        constraints: "Unique across all TransportRoute rows."
      - name: seat_capacity
        type: integer
        source: input
        description: Number of specialised seats the vehicle holds.
        constraints: "Integer in [1, 24]."
      - name: seats_committed
        type: integer
        source: computed
        description: Count of TransportationAssignment rows on this route whose status == ACTIVE.
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: seat_capacity - seats_committed; the conserved seat quantity asserted by the transport_seat_conservation invariant.
        default: 0
      - name: daily_rate_cents
        type: integer
        source: input
        description: Contracted per-service-day route rate in whole cents, before TRANSPORT_FUEL_INDEX.
        constraints: "Integer >= 1."
      - name: service_window_start_min
        type: integer
        source: input
        description: Earliest minute-since-midnight the route may pick up.
        constraints: "Integer in [0, 1439]."
      - name: service_window_end_min
        type: integer
        source: input
        description: Latest minute-since-midnight the route may drop off; must exceed service_window_start_min.
        constraints: "Integer in [1, 1440]."

  - name: TransportationAssignment
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being transported.
      - name: route_id
        type: string
        source: input
        description: FK -> TransportRoute.id; the route carrying the student.
      - name: pickup_window_start_min
        type: integer
        source: input
        description: Start of the requested pickup window, minutes since midnight, inclusive.
        constraints: "Integer in [0, 1439]."
      - name: pickup_window_end_min
        type: integer
        source: input
        description: End of the requested pickup window, minutes since midnight, exclusive.
        constraints: "Integer in [1, 1440]; must exceed pickup_window_start_min."
      - name: days_per_week
        type: integer
        source: input
        description: Service days per week for this assignment.
        constraints: "Integer in [1, 7]."
      - name: contract_weeks
        type: integer
        source: input
        description: Number of transport weeks the assignment funds.
        default: 36
        constraints: "Integer in [1, 52]."
      - name: encumbrance_cents
        type: integer
        source: computed
        description: Cents encumbered when this assignment becomes ACTIVE, per the transport_encumbrance calculation; 0 while REQUESTED, WAITLISTED or RELEASED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle state.
        default: REQUESTED
        constraints: "One of {REQUESTED, ACTIVE, WAITLISTED, RELEASED}."
      - name: promoted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the WAITLISTED->ACTIVE auto-promotion; null when never promoted.
        default: null

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement whose attendance this record reports.
      - name: period_start
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the first day of the billing cycle, inclusive.
      - name: period_end
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the last day of the billing cycle, inclusive; the closed interval MUST span exactly BILLING_CYCLE_DAYS (28) days.
      - name: days_enrolled
        type: integer
        source: input
        description: Days the seat was held for the student in the cycle; the ENROLLMENT-basis billable-day count.
        constraints: "Integer in [0, 28]."
      - name: days_attended
        type: integer
        source: input
        description: Days the student was physically present in the cycle.
        constraints: "Integer in [0, 28]; must be <= days_enrolled."
      - name: days_absent_unexcused
        type: integer
        source: input
        description: Unexcused absence days in the cycle; the first ABSENCE_TOLERANCE_DAYS (3) remain billable on the ATTENDANCE basis.
        constraints: "Integer in [0, 28]; days_attended + days_absent_unexcused must be <= days_enrolled."
      - name: residential_nights
        type: integer
        source: input
        description: Nights of room and board delivered in the cycle; MUST be 0 when the placement's placement_type == DAY.
        default: 0
        constraints: "Integer in [0, 28]."
      - name: service_delivery_lines
        type: array
        source: input
        description: Array of objects {service_addendum_id, hours_delivered} reporting related-service hours per ServiceAddendum. Each service_addendum_id MUST name a ServiceAddendum whose placement_id equals this record's placement_id and whose status == ACTIVE. hours_delivered is a number in 0.25 increments.
        default: []
      - name: status
        type: enum
        source: computed
        description: Attendance verification state.
        default: SUBMITTED
        constraints: "One of {SUBMITTED, VERIFIED, DISPUTED}."
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the PlacementCoordinator who last verified or disputed this record; null before the first verify.
        default: null
      - name: amendment_round
        type: integer
        source: computed
        description: Count of DISPUTED->SUBMITTED amend transitions taken so far.
        default: 0

  - name: TuitionInvoice
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being billed.
      - name: attendance_record_id
        type: string
        source: input
        description: FK -> AttendanceRecord.id; the attendance record this invoice bills against; its placement_id MUST equal this invoice's placement_id.
      - name: billing_period_start
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD); MUST equal the referenced AttendanceRecord.period_start.
      - name: billing_period_end
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD); MUST equal the referenced AttendanceRecord.period_end.
      - name: submitted_amount_cents
        type: integer
        source: input
        description: Amount the school claims for the cycle; compared against verified_amount_cents to compute variance_pct.
        constraints: "Integer >= 0."
      - name: transport_days_billed
        type: integer
        source: input
        description: Transport service days claimed for the cycle; billed at the ACTIVE TransportationAssignment's route daily_rate_cents.
        default: 0
        constraints: "Integer in [0, 28]."
      - name: verification_basis
        type: enum
        source: computed
        description: Basis selected by the FiscalOfficer at verify time and copied onto the invoice; null before verification.
        default: null
        constraints: "One of {ENROLLMENT, ATTENDANCE}."
      - name: tuition_line_cents
        type: integer
        source: computed
        description: Rounded tuition line under verification_basis, per invoice_verified_amount step L1.
        default: 0
      - name: residential_line_cents
        type: integer
        source: computed
        description: Rounded residential room-and-board line, per invoice_verified_amount step L2.
        default: 0
      - name: service_lines_total_cents
        type: integer
        source: computed
        description: Sum of the individually-rounded per-addendum related-service lines, per invoice_verified_amount step L3.
        default: 0
      - name: transport_line_cents
        type: integer
        source: computed
        description: Rounded transportation line, per invoice_verified_amount step L4.
        default: 0
      - name: gross_billable_cents
        type: integer
        source: computed
        description: tuition_line_cents + residential_line_cents + service_lines_total_cents + transport_line_cents under verification_basis.
        default: 0
      - name: volume_credit_cents
        type: integer
        source: computed
        description: Volume credit withheld, keyed on gross_billable_cents only, per invoice_net_payable step 2.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative fee added on the post-credit subtotal, per invoice_net_payable step 4.
        default: 0
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: Net payable recomputed under the ENROLLMENT basis regardless of verification_basis; always written at verify time.
        default: 0
      - name: final_amount_cents
        type: integer
        source: computed
        description: Net payable recomputed under the ATTENDANCE basis regardless of verification_basis; always written at verify time.
        default: 0
      - name: verified_amount_cents
        type: integer
        source: computed
        description: Equals provisional_amount_cents when verification_basis == ENROLLMENT and final_amount_cents when verification_basis == ATTENDANCE.
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: abs(submitted_amount_cents - verified_amount_cents) / verified_amount_cents, rounded half up to 4 decimals; drives the auto-dispute branch.
        default: 0
      - name: settled_amount_cents
        type: integer
        source: computed
        description: verified_amount_cents copied at the payment_status UNPAID->PAID transition; 0 while unpaid or voided.
        default: 0
      - name: verification_status
        type: enum
        source: computed
        description: First independent dimension of the invoice state.
        default: SUBMITTED
        constraints: "One of {SUBMITTED, VERIFIED, DISPUTED}."
      - name: payment_status
        type: enum
        source: computed
        description: Second independent dimension of the invoice state, evolving separately from verification_status.
        default: UNPAID
        constraints: "One of {UNPAID, PAID, VOIDED}."
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FiscalOfficer who verified this invoice; compared against the approver's X-User-ID for segregation of duties.
        default: null
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FiscalOfficer who approved payment; null while UNPAID.
        default: null
      - name: resubmission_round
        type: integer
        source: computed
        description: Count of DISPUTED->SUBMITTED resubmit transitions taken so far.
        default: 0

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student unilaterally placed by the parent.
      - name: superseding_placement_id
        type: string
        source: input
        description: FK -> Placement.id; the district placement offered in lieu of the unilateral placement, or null when the district made no placement offer.
        default: null
      - name: fiscal_account_id
        type: string
        source: input
        description: FK -> DistrictFiscalAccount.id; the account any award is disbursed from.
      - name: unilateral_school_name
        type: string
        source: input
        description: Name of the private school the parent enrolled the student in without district agreement.
      - name: claimed_tuition_cents
        type: integer
        source: input
        description: Tuition the parent seeks reimbursement for, in whole cents.
        constraints: "Integer >= 0."
      - name: claimed_transport_cents
        type: integer
        source: input
        description: Transportation the parent seeks reimbursement for, in whole cents.
        default: 0
        constraints: "Integer >= 0."
      - name: claimed_instructional_days
        type: integer
        source: input
        description: Instructional days claimed; multiplied by STATE_CAP_DAY_RATE_CENTS to form the statutory tuition cap.
        constraints: "Integer in [1, 260]."
      - name: notice_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the parent gave written notice of intent to remove the student; must be <= unilateral_start_date.
      - name: unilateral_start_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the unilateral placement began, inclusive.
      - name: unilateral_end_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the unilateral placement ended, inclusive; must be >= unilateral_start_date.
      - name: prior_district_offer_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the district offered a placement, or null when no offer was made.
        default: null
      - name: parent_cooperation
        type: boolean
        source: input
        description: False when the parent refused to make the student available for district evaluation, triggering NONCOOPERATION_REDUCTION_PCT.
        default: true
      - name: award_basis
        type: enum
        source: computed
        description: Basis chosen by the HearingAdjudicator at adjudication and copied onto the claim; null before the first adjudication.
        default: null
        constraints: "One of {strict_statutory, equitable_actual_cost}."
      - name: equitable_reduction_pct
        type: number
        source: computed
        description: Summed equitable reduction, capped at MAX_EQUITABLE_REDUCTION_PCT, per reimbursement_award step 2.
        default: 0
      - name: eligible_amount_cents
        type: integer
        source: computed
        description: Pre-reduction eligible amount under award_basis, per reimbursement_award step 3.
        default: 0
      - name: awarded_amount_cents
        type: integer
        source: computed
        description: Post-reduction award, per reimbursement_award step 4; reset to 0 by a remand.
        default: 0
      - name: awarded_tuition_cents
        type: integer
        source: computed
        description: First waterfall bucket of awarded_amount_cents, per reimbursement_award step 5.
        default: 0
      - name: awarded_transport_cents
        type: integer
        source: computed
        description: Second waterfall bucket of awarded_amount_cents, per reimbursement_award step 5.
        default: 0
      - name: remand_round
        type: integer
        source: computed
        description: Count of AWARDED_PARTIAL/DENIED -> REMANDED transitions taken so far.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Adjudication state.
        default: FILED
        constraints: "One of {FILED, AWARDED_FULL, AWARDED_PARTIAL, DENIED, REMANDED}."

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being progress-monitored.
      - name: fiscal_year
        type: integer
        source: input
        description: State fiscal year the report covers.
        constraints: "Integer in [2020, 2100]."
      - name: quarter
        type: integer
        source: input
        description: Reporting quarter within fiscal_year.
        constraints: "Integer in [1, 4]; unique per (placement_id, fiscal_year, quarter) across reports whose status is in {SUBMITTED, ACCEPTED}."
      - name: goals_total
        type: integer
        source: input
        description: Number of measurable IEP goals monitored in the quarter.
        constraints: "Integer >= 1."
      - name: goals_met
        type: integer
        source: input
        description: Goals met in the quarter; must be <= goals_total.
        constraints: "Integer >= 0."
      - name: goals_regressed
        type: integer
        source: input
        description: Goals that regressed in the quarter; each costs REGRESSION_PENALTY_POINTS from report_score.
        default: 0
        constraints: "Integer >= 0; goals_met + goals_regressed must be <= goals_total."
      - name: benchmark_scaled_score
        type: number
        source: input
        description: Standardised benchmark scaled score for the quarter.
        constraints: "Number in [0, 100]."
      - name: attendance_rate_pct
        type: number
        source: input
        description: Attendance rate for the quarter as a percentage.
        constraints: "Number in [0, 100]."
      - name: report_score
        type: number
        source: computed
        description: Per-report score in [0, 100] produced by the return_readiness_score per-report step, rounded half up to 2 decimals.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Report acceptance state; only ACCEPTED reports enter the readiness baseline.
        default: SUBMITTED
        constraints: "One of {SUBMITTED, ACCEPTED, REJECTED}."

  - name: ReturnTransitionPlan
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being wound down back into district.
      - name: target_return_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the student is expected to re-enter district programming.
      - name: receiving_program
        type: string
        source: input
        description: In-district programme that will receive the student.
      - name: transition_services
        type: array
        source: computed
        description: Array of strings naming the transition services committed at activation; empty while DRAFT, written verbatim from the activate call's transition_services input.
        default: []
      - name: readiness_score_at_activation
        type: number
        source: computed
        description: return_readiness_score under the activate call's readiness_variant (default trailing_two_quarter), stamped at the DRAFT->ACTIVE transition; null while DRAFT.
        default: null
      - name: reserve_cents
        type: integer
        source: computed
        description: TRANSITION_SERVICES_RESERVE_CENTS held encumbered from activation until the plan reaches COMPLETED or ABANDONED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Return-planning state.
        default: DRAFT
        constraints: "One of {DRAFT, ACTIVE, COMPLETED, ABANDONED}."

  - name: FundingClaim
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement whose district-paid costs are being reclaimed from the state or from Medicaid.
      - name: claim_type
        type: enum
        source: input
        description: Reimbursement programme being claimed against.
        constraints: "One of {HIGH_COST_FUND, MEDICAID}."
      - name: fiscal_year
        type: integer
        source: input
        description: State fiscal year the claim covers.
        constraints: "Integer in [2020, 2100]; unique per (placement_id, claim_type, fiscal_year) across claims whose status is in {ELIGIBLE, SUBMITTED}."
      - name: eligible_base_cents
        type: integer
        source: computed
        description: For HIGH_COST_FUND, Placement.paid_total_ytd_cents at claim creation; for MEDICAID, 0.
        default: 0
      - name: billable_service_hours
        type: number
        source: computed
        description: For MEDICAID, summed hours_delivered over VERIFIED AttendanceRecords of the placement for service_delivery_lines naming addenda with medicaid_billable == true; 0 for HIGH_COST_FUND.
        default: 0
      - name: tier_rate
        type: number
        source: computed
        description: Tier rate selected from HIGH_COST_TIERS by the excess band; 0 for MEDICAID.
        default: 0
      - name: reimbursable_amount_cents
        type: integer
        source: computed
        description: Claimable cents produced by the funding_claim_reimbursable calculation.
        default: 0
      - name: source
        type: enum
        source: computed
        description: AUTO_CASCADE when created by the invoice-payment cascade link, MANUAL when created by POST /ood-placements/funding-claims.
        constraints: "One of {AUTO_CASCADE, MANUAL}."
      - name: status
        type: enum
        source: computed
        description: Claim submission state.
        default: ELIGIBLE
        constraints: "One of {ELIGIBLE, SUBMITTED}."
      - name: submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the ELIGIBLE->SUBMITTED transition; null before.
        default: null
      - name: state_claim_reference
        type: string
        source: computed
        description: State-assigned claim reference supplied on submit-to-state; null while ELIGIBLE.
        default: null

  - name: DistrictFiscalAccount
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: State fiscal year the appropriation covers.
        constraints: "Integer in [2020, 2100]."
      - name: account_code
        type: string
        source: input
        description: District general-ledger account code.
        constraints: "Unique across all DistrictFiscalAccount rows."
      - name: authorized_cents
        type: integer
        source: input
        description: Total appropriation authorised for out-of-district placements this fiscal year; the conserved total of the fiscal_ledger_conservation invariant.
        constraints: "Integer >= 0."
      - name: available_cents
        type: integer
        source: computed
        description: Unencumbered, undisbursed cents; initialised to authorized_cents at creation.
        default: 0
      - name: encumbered_cents
        type: integer
        source: computed
        description: Cents committed by contracts, addenda, transportation and transition reserves but not yet paid out.
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: Cents actually paid out on settled invoices and reimbursement awards.
        default: 0

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- SM1: PlacementDecision — CYCLIC (TEAM_REVIEW <-> RETURNED_FOR_REVISION) ----
  - entity: PlacementDecision
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: TEAM_REVIEW
        trigger: "POST /ood-placements/placement-decisions/{id}/submit"
        actor: PlacementCoordinator
        preconditions:
          - "PlacementDecision.status == DRAFT"
          - "trim(lre_justification) length >= 40"
          - "len(continuum_options_considered) >= MIN_CONTINUUM_OPTIONS (3) and every entry has non-empty setting and rejected_reason"
          - "No other PlacementDecision row with the same student_id has status == TEAM_REVIEW"
        side_effects:
          - "PlacementDecision.status = TEAM_REVIEW"
          - "PlacementDecision.submitted_at = logical clock now"
          - "PlacementDecision.version += 1"
      - from: RETURNED_FOR_REVISION
        to: TEAM_REVIEW
        trigger: "POST /ood-placements/placement-decisions/{id}/submit"
        actor: PlacementCoordinator
        preconditions:
          - "PlacementDecision.status == RETURNED_FOR_REVISION"
          - "trim(lre_justification) length >= 40"
          - "len(continuum_options_considered) >= MIN_CONTINUUM_OPTIONS (3)"
        side_effects:
          - "PlacementDecision.status = TEAM_REVIEW"
          - "PlacementDecision.submitted_at = logical clock now"
          - "PlacementDecision.version += 1"
        note: "Closes the revision cycle; revision_round is NOT changed here, only by return-for-revision."
      - from: TEAM_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /ood-placements/placement-decisions/{id}/return-for-revision"
        actor: TeamChair
        preconditions:
          - "PlacementDecision.status == TEAM_REVIEW"
          - "X-User-ID != PlacementDecision.authored_by_user_id (segregation of duties)"
          - "PlacementDecision.revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "PlacementDecision.status = RETURNED_FOR_REVISION"
          - "PlacementDecision.revision_round += 1"
          - "PlacementDecision.reviewed_by_user_id = X-User-ID"
          - "PlacementDecision.reviewer_notes = request reviewer_notes"
          - "PlacementDecision.version += 1"
      - from: TEAM_REVIEW
        to: APPROVED
        trigger: "POST /ood-placements/placement-decisions/{id}/approve"
        actor: TeamChair
        preconditions:
          - "PlacementDecision.status == TEAM_REVIEW"
          - "X-User-ID != PlacementDecision.authored_by_user_id (segregation of duties)"
          - "Student.placement_status != OOD_ACTIVE for PlacementDecision.student_id"
        side_effects:
          - "PlacementDecision.status = APPROVED"
          - "PlacementDecision.decided_at = logical clock now"
          - "PlacementDecision.reviewed_by_user_id = X-User-ID"
          - "PlacementDecision.reviewer_notes = request reviewer_notes"
          - "Student.placement_status = DECISION_APPROVED for PlacementDecision.student_id"
          - "Student.version += 1"
          - "PlacementDecision.version += 1"

  # ---- SM2: Placement — BRANCHING fork ACTIVE -> {TERMINATED, RETURNED_TO_DISTRICT} ----
  - entity: Placement
    initial_state: PROPOSED
    terminal_states: [TERMINATED, RETURNED_TO_DISTRICT, EXPIRED]
    transitions:
      - from: PROPOSED
        to: CONTRACTED
        trigger: "POST /ood-placements/placements/{id}/execute-contract"
        actor: FiscalOfficer
        preconditions:
          - "Placement.status == PROPOSED"
          - "PlacementDecision(Placement.decision_id).status == APPROVED"
          - "ApprovedPrivateSchool(Placement.school_id).approval_status IN {APPROVED, PROVISIONAL}"
          - "If Placement.placement_type == RESIDENTIAL then ApprovedPrivateSchool.residential_capable == true AND ApprovedPrivateSchool.approval_status == APPROVED"
          - "TuitionRateSchedule(Placement.rate_schedule_id).approval_state == STATE_APPROVED"
          - "TuitionRateSchedule.school_id == Placement.school_id"
          - "TuitionRateSchedule.effective_from <= Placement.start_date AND TuitionRateSchedule.effective_to >= Placement.start_date"
          - "DistrictFiscalAccount(Placement.fiscal_account_id).available_cents >= placement_encumbrance(this placement)"
        side_effects:
          - "Placement.contract_encumbrance_cents = placement_encumbrance(this placement)"
          - "Placement.encumbrance_cents recomputed per its definition"
          - "Placement.status = CONTRACTED"
          - "Placement.contract_executed_at = logical clock now"
          - "Placement.transport_status = PENDING when transportation_required == true, otherwise NOT_REQUIRED"
          - "DistrictFiscalAccount.encumbered_cents += Placement.contract_encumbrance_cents"
          - "DistrictFiscalAccount.available_cents -= Placement.contract_encumbrance_cents"
          - "DistrictFiscalAccount.version += 1"
          - "Placement.version += 1"
      - from: CONTRACTED
        to: ACTIVE
        trigger: "POST /ood-placements/placements/{id}/activate"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == CONTRACTED"
          - "ApprovedPrivateSchool(Placement.school_id).approval_status != REVOKED"
          - "logical clock date >= Placement.start_date"
          - "logical clock date <= Placement.start_date + CONTRACT_ACTIVATION_GRACE_DAYS (30)"
          - "If Placement.transportation_required == true then at least one TransportationAssignment with placement_id == Placement.id has status == ACTIVE"
        side_effects:
          - "Placement.status = ACTIVE"
          - "Placement.activated_at = logical clock now"
          - "Student.placement_status = OOD_ACTIVE for Placement.student_id"
          - "Student.version += 1"
          - "Placement.version += 1"
      - from: CONTRACTED
        to: EXPIRED
        trigger: "system event: POST /_clock/set_current_utc advances the logical clock past Placement.start_date + CONTRACT_ACTIVATION_GRACE_DAYS (30) while status == CONTRACTED"
        actor: system
        preconditions:
          - "Placement.status == CONTRACTED"
          - "new logical clock date > Placement.start_date + CONTRACT_ACTIVATION_GRACE_DAYS (30)"
        side_effects:
          - "Placement.status = EXPIRED"
          - "Placement.terminated_at = logical clock now"
          - "Placement.termination_reason = \"ACTIVATION_GRACE_EXPIRED\""
          - "release_amount = Placement.contract_encumbrance_cents - Placement.paid_total_ytd_cents; DistrictFiscalAccount.encumbered_cents -= release_amount; DistrictFiscalAccount.available_cents += release_amount"
          - "Placement.released_encumbrance_cents += release_amount"
          - "Placement.contract_encumbrance_cents = Placement.paid_total_ytd_cents (remaining contract commitment driven to zero); Placement.encumbrance_cents recomputed"
          - "DistrictFiscalAccount.version += 1; Placement.version += 1"
        note: "Evaluated for every Placement with status == CONTRACTED in ascending Placement.created_at order on each clock-set call."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ood-placements/placements/{id}/terminate"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == ACTIVE"
          - "No TuitionInvoice with placement_id == Placement.id has verification_status == SUBMITTED (all submitted billing must be verified or disputed first)"
        side_effects:
          - "CASCADE-A LINK 0 (self): Placement.status = TERMINATED; Placement.terminated_at = logical clock now; Placement.termination_reason = request termination_reason; Student.placement_status = TERMINATED; Student.version += 1"
          - "CASCADE-A LINK 1 (Placement -> DistrictFiscalAccount): contract_release_cents = Placement.contract_encumbrance_cents - Placement.paid_total_ytd_cents; DistrictFiscalAccount.encumbered_cents -= contract_release_cents; DistrictFiscalAccount.available_cents += contract_release_cents; Placement.contract_encumbrance_cents = Placement.paid_total_ytd_cents; Placement.released_encumbrance_cents += contract_release_cents; DistrictFiscalAccount.version += 1"
          - "CASCADE-A LINK 2 (Placement -> ServiceAddendum): every ServiceAddendum with placement_id == Placement.id and status == ACTIVE transitions ACTIVE -> TERMINATED, processed in ascending ServiceAddendum.created_at order"
          - "CASCADE-A LINK 3 (ServiceAddendum -> DistrictFiscalAccount, caused by LINK 2): each such addendum termination releases its own commitment: DistrictFiscalAccount.encumbered_cents -= addendum.encumbrance_cents; DistrictFiscalAccount.available_cents += addendum.encumbrance_cents; Placement.addendum_encumbrance_cents -= addendum.encumbrance_cents; Placement.released_encumbrance_cents += addendum.encumbrance_cents; addendum.encumbrance_cents = 0; addendum.version += 1"
          - "CASCADE-A LINK 4 (Placement -> TransportationAssignment): every TransportationAssignment with placement_id == Placement.id and status IN {REQUESTED, ACTIVE, WAITLISTED} transitions to RELEASED, processed in ascending TransportationAssignment.created_at order; Placement.transport_status = RELEASED when at least one such assignment existed"
          - "CASCADE-A LINK 5 (TransportationAssignment -> TransportRoute, caused by LINK 4): for each assignment whose prior status was ACTIVE, TransportRoute.seats_committed -= 1; TransportRoute.seats_available += 1; TransportRoute.version += 1; and DistrictFiscalAccount.encumbered_cents -= assignment.encumbrance_cents; DistrictFiscalAccount.available_cents += assignment.encumbrance_cents; Placement.transport_encumbrance_cents -= assignment.encumbrance_cents; Placement.released_encumbrance_cents += assignment.encumbrance_cents; assignment.encumbrance_cents = 0"
          - "CASCADE-A LINK 6 (TransportRoute -> TransportationAssignment, caused by LINK 5): because TransportRoute.seats_available increased, the waitlist_promotion selector runs on that route and promotes at most one WAITLISTED assignment to ACTIVE (candidate set, ranking, tie-break and empty-set fallback pinned in calculations.waitlist_promotion)"
          - "CASCADE-A LINK 7 (TransportationAssignment -> Placement + DistrictFiscalAccount, caused by LINK 6): the promoted assignment's encumbrance_cents = transport_encumbrance(assignment); its Placement.transport_encumbrance_cents += that amount; that Placement.transport_status = ASSIGNED; DistrictFiscalAccount.available_cents -= that amount; DistrictFiscalAccount.encumbered_cents += that amount; promoted assignment.promoted_at = logical clock now; the promoted assignment's Placement.version += 1"
          - "CASCADE-A LINK 8 (Placement -> ReturnTransitionPlan): a ReturnTransitionPlan with placement_id == Placement.id and status == ACTIVE transitions ACTIVE -> ABANDONED, releasing its reserve: DistrictFiscalAccount.encumbered_cents -= plan.reserve_cents; DistrictFiscalAccount.available_cents += plan.reserve_cents; Placement.transition_reserve_cents = 0; plan.reserve_cents = 0; plan.version += 1"
          - "CASCADE-A LINK 9 (Placement -> TuitionInvoice): every TuitionInvoice with placement_id == Placement.id, verification_status == DISPUTED and payment_status == UNPAID has payment_status set to VOIDED, processed in ascending TuitionInvoice.created_at order"
          - "Placement.encumbrance_cents recomputed per its definition; Placement.version += 1"
        note: "Deepest chain is LINK 4 -> LINK 5 -> LINK 6 -> LINK 7: each hop is caused by the mutation the previous hop performed, not by the terminate call itself."
      - from: ACTIVE
        to: RETURNED_TO_DISTRICT
        trigger: "POST /ood-placements/placements/{id}/return-to-district"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == ACTIVE"
          - "A ReturnTransitionPlan with placement_id == Placement.id has status == ACTIVE"
          - "No TuitionInvoice with placement_id == Placement.id has verification_status == SUBMITTED"
        side_effects:
          - "Placement.status = RETURNED_TO_DISTRICT; Placement.terminated_at = logical clock now; Placement.termination_reason = request return_reason"
          - "Student.placement_status = RETURNED; Student.lre_current_setting = request receiving_lre_setting; Student.version += 1"
          - "contract_release_cents = Placement.contract_encumbrance_cents - Placement.paid_total_ytd_cents; DistrictFiscalAccount.encumbered_cents -= contract_release_cents; DistrictFiscalAccount.available_cents += contract_release_cents; Placement.contract_encumbrance_cents = Placement.paid_total_ytd_cents; Placement.released_encumbrance_cents += contract_release_cents"
          - "DIVERGENCE vs terminate #1: every ACTIVE ServiceAddendum of this placement transitions ACTIVE -> TRANSFERRED (not TERMINATED), and its commitment is released identically to the terminate path"
          - "DIVERGENCE vs terminate #2: the ACTIVE ReturnTransitionPlan transitions ACTIVE -> COMPLETED (not ABANDONED) and its reserve is RETAINED: DistrictFiscalAccount.encumbered_cents and Placement.transition_reserve_cents keep TRANSITION_SERVICES_RESERVE_CENTS encumbered so post-return transition services stay funded"
          - "Identical to terminate: every TransportationAssignment of this placement is RELEASED, its route's seats_committed/seats_available adjust, the waitlist_promotion selector runs on the freed route, and the promoted assignment books its transport encumbrance"
          - "DIVERGENCE vs terminate #3: DISPUTED unpaid invoices are NOT voided; they remain DISPUTED/UNPAID so the school can still resubmit"
          - "Placement.encumbrance_cents recomputed; DistrictFiscalAccount.version += 1; Placement.version += 1"
        note: "Fork sibling of ACTIVE->TERMINATED with three divergent side-effect sets (addendum terminal state, reserve retention, invoice voiding)."

  # ---- SM3: ServiceAddendum ----
  - entity: ServiceAddendum
    initial_state: PROPOSED
    terminal_states: [TERMINATED, TRANSFERRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /ood-placements/service-addenda/{id}/authorize"
        actor: FiscalOfficer
        preconditions:
          - "ServiceAddendum.status == PROPOSED"
          - "Placement(ServiceAddendum.placement_id).status IN {CONTRACTED, ACTIVE}"
          - "DistrictFiscalAccount(Placement.fiscal_account_id).available_cents >= service_addendum_encumbrance(this addendum)"
        side_effects:
          - "ServiceAddendum.hourly_rate_cents = TuitionRateSchedule(Placement.rate_schedule_id).service_hourly_rate_cents (version-pinned, frozen thereafter)"
          - "ServiceAddendum.encumbrance_cents = service_addendum_encumbrance(this addendum)"
          - "ServiceAddendum.status = ACTIVE"
          - "Placement.addendum_encumbrance_cents += ServiceAddendum.encumbrance_cents; Placement.encumbrance_cents recomputed; Placement.version += 1"
          - "DistrictFiscalAccount.available_cents -= ServiceAddendum.encumbrance_cents; DistrictFiscalAccount.encumbered_cents += ServiceAddendum.encumbrance_cents; DistrictFiscalAccount.version += 1"
          - "ServiceAddendum.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: CASCADE-A LINK 2 of Placement ACTIVE->TERMINATED"
        actor: system
        preconditions:
          - "ServiceAddendum.status == ACTIVE"
          - "Placement(ServiceAddendum.placement_id) is transitioning ACTIVE -> TERMINATED"
        side_effects:
          - "ServiceAddendum.status = TERMINATED"
          - "Commitment released per CASCADE-A LINK 3"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system event: Placement ACTIVE->RETURNED_TO_DISTRICT"
        actor: system
        preconditions:
          - "ServiceAddendum.status == ACTIVE"
          - "Placement(ServiceAddendum.placement_id) is transitioning ACTIVE -> RETURNED_TO_DISTRICT"
        side_effects:
          - "ServiceAddendum.status = TRANSFERRED (service authorisation moves with the student into the receiving in-district programme)"
          - "Commitment released identically to CASCADE-A LINK 3"

  # ---- SM4: TransportationAssignment ----
  - entity: TransportationAssignment
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /ood-placements/transportation-assignments (creation resolves immediately)"
        actor: PlacementCoordinator
        preconditions:
          - "Placement(placement_id).status IN {CONTRACTED, ACTIVE} AND Placement.transportation_required == true"
          - "TransportRoute(route_id) has no ACTIVE assignment whose buffered window collides with the requested window per validations priority 24"
          - "TransportRoute.seats_available >= 1"
          - "DistrictFiscalAccount(Placement.fiscal_account_id).available_cents >= transport_encumbrance(this assignment)"
        side_effects:
          - "TransportationAssignment.status = ACTIVE; encumbrance_cents = transport_encumbrance(this assignment)"
          - "TransportRoute.seats_committed += 1; TransportRoute.seats_available -= 1; TransportRoute.version += 1"
          - "Placement.transport_status = ASSIGNED; Placement.transport_encumbrance_cents += encumbrance_cents; Placement.encumbrance_cents recomputed; Placement.version += 1"
          - "DistrictFiscalAccount.available_cents -= encumbrance_cents; DistrictFiscalAccount.encumbered_cents += encumbrance_cents; DistrictFiscalAccount.version += 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /ood-placements/transportation-assignments (creation resolves immediately)"
        actor: PlacementCoordinator
        preconditions:
          - "Placement(placement_id).status IN {CONTRACTED, ACTIVE} AND Placement.transportation_required == true"
          - "TransportRoute(route_id) has no window collision per validations priority 24"
          - "TransportRoute.seats_available == 0"
        side_effects:
          - "TransportationAssignment.status = WAITLISTED; encumbrance_cents = 0 (no fiscal commitment while waitlisted)"
          - "Placement.transport_status = WAITLISTED; Placement.version += 1"
        note: "Aggregate seat exhaustion deliberately does NOT raise an error; it parks the request on the route waitlist."
      - from: WAITLISTED
        to: ACTIVE
        trigger: "system event: waitlist_promotion selector after a seat is freed on the route (CASCADE-A LINK 6)"
        actor: system
        preconditions:
          - "TransportationAssignment.status == WAITLISTED"
          - "TransportRoute.seats_available >= 1"
          - "This assignment is the winner of the waitlist_promotion selector for that route"
          - "Placement(placement_id).status IN {CONTRACTED, ACTIVE}"
        side_effects:
          - "TransportationAssignment.status = ACTIVE; promoted_at = logical clock now"
          - "All fiscal and seat side effects of CASCADE-A LINK 7"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /ood-placements/transportation-assignments/{id}/release, or system event CASCADE-A LINK 4"
        actor: PlacementCoordinator
        preconditions:
          - "TransportationAssignment.status == ACTIVE"
        side_effects:
          - "TransportationAssignment.status = RELEASED"
          - "TransportRoute.seats_committed -= 1; TransportRoute.seats_available += 1; TransportRoute.version += 1"
          - "DistrictFiscalAccount.encumbered_cents -= encumbrance_cents; DistrictFiscalAccount.available_cents += encumbrance_cents; Placement.transport_encumbrance_cents -= encumbrance_cents; Placement.released_encumbrance_cents += encumbrance_cents; encumbrance_cents = 0"
          - "Placement.transport_status = RELEASED when no other ACTIVE assignment remains for that placement; Placement.encumbrance_cents recomputed"
          - "waitlist_promotion selector runs on the freed route (same hop as CASCADE-A LINK 6) and, on a winner, applies CASCADE-A LINK 7"
      - from: WAITLISTED
        to: RELEASED
        trigger: "POST /ood-placements/transportation-assignments/{id}/release, or system event CASCADE-A LINK 4"
        actor: PlacementCoordinator
        preconditions:
          - "TransportationAssignment.status == WAITLISTED"
        side_effects:
          - "TransportationAssignment.status = RELEASED; no seat and no fiscal movement (it held neither)"
          - "Placement.transport_status = RELEASED when no other ACTIVE or WAITLISTED assignment remains for that placement"

  # ---- SM5: AttendanceRecord — CYCLIC (DISPUTED -> SUBMITTED) ----
  - entity: AttendanceRecord
    initial_state: SUBMITTED
    terminal_states: [VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ood-placements/attendance-records/{id}/verify with decision == ACCEPT"
        actor: PlacementCoordinator
        preconditions:
          - "AttendanceRecord.status == SUBMITTED"
          - "Placement(placement_id).status IN {ACTIVE, TERMINATED, RETURNED_TO_DISTRICT}"
        side_effects:
          - "AttendanceRecord.status = VERIFIED; verified_by_user_id = X-User-ID"
          - "For every entry in service_delivery_lines, ServiceAddendum.delivered_hours_ytd += hours_delivered; that addendum.version += 1"
          - "AttendanceRecord.version += 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /ood-placements/attendance-records/{id}/verify with decision == DISPUTE"
        actor: PlacementCoordinator
        preconditions:
          - "AttendanceRecord.status == SUBMITTED"
        side_effects:
          - "AttendanceRecord.status = DISPUTED; verified_by_user_id = X-User-ID"
          - "delivered_hours_ytd on addenda is NOT advanced"
          - "AttendanceRecord.version += 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /ood-placements/attendance-records/{id}/amend"
        actor: SchoolBillingAgent
        preconditions:
          - "AttendanceRecord.status == DISPUTED"
          - "AttendanceRecord.amendment_round < MAX_AMENDMENT_ROUNDS (2)"
          - "X-User-ID == Placement(placement_id).school_id (school scope)"
        side_effects:
          - "AttendanceRecord day counts, residential_nights and service_delivery_lines replaced by the amend payload"
          - "AttendanceRecord.status = SUBMITTED; amendment_round += 1; verified_by_user_id = null"
          - "AttendanceRecord.version += 1"

  # ---- SM6: TuitionInvoice — PARALLEL DIMENSIONS (verification_status x payment_status) ----
  - entity: TuitionInvoice
    initial_state: SUBMITTED
    terminal_states: [VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ood-placements/tuition-invoices/{id}/verify when variance_pct <= VARIANCE_TOLERANCE_PCT (0.02)"
        actor: FiscalOfficer
        preconditions:
          - "TuitionInvoice.verification_status == SUBMITTED"
          - "TuitionInvoice.payment_status == UNPAID"
          - "AttendanceRecord(attendance_record_id).status == VERIFIED"
        side_effects:
          - "All invoice_verified_amount line fields written (tuition_line_cents, residential_line_cents, service_lines_total_cents, transport_line_cents, gross_billable_cents, volume_credit_cents, admin_fee_cents)"
          - "provisional_amount_cents and final_amount_cents BOTH written (ENROLLMENT and ATTENDANCE basis respectively), regardless of the requested basis"
          - "verification_basis = request basis; verified_amount_cents = provisional_amount_cents when basis == ENROLLMENT else final_amount_cents"
          - "variance_pct = round_half_up(abs(submitted_amount_cents - verified_amount_cents) / verified_amount_cents, 4)"
          - "verification_status = VERIFIED; verified_by_user_id = X-User-ID"
          - "payment_status is UNCHANGED at UNPAID (independent dimension)"
          - "TuitionInvoice.version += 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /ood-placements/tuition-invoices/{id}/verify when variance_pct > VARIANCE_TOLERANCE_PCT (0.02)"
        actor: FiscalOfficer
        preconditions:
          - "TuitionInvoice.verification_status == SUBMITTED"
          - "TuitionInvoice.payment_status == UNPAID"
          - "AttendanceRecord(attendance_record_id).status == VERIFIED"
        side_effects:
          - "Same line and dual-variant fields written as on the VERIFIED branch"
          - "verification_status = DISPUTED; verified_by_user_id = X-User-ID"
          - "payment_status is UNCHANGED at UNPAID"
          - "TuitionInvoice.version += 1"
        note: "Auto-branch: the outcome is decided by the computed variance, not by an operator choice."
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /ood-placements/tuition-invoices/{id}/resubmit"
        actor: SchoolBillingAgent
        preconditions:
          - "TuitionInvoice.verification_status == DISPUTED"
          - "TuitionInvoice.payment_status == UNPAID"
          - "TuitionInvoice.resubmission_round < MAX_RESUBMISSION_ROUNDS (2)"
          - "X-User-ID == Placement(placement_id).school_id (school scope)"
        side_effects:
          - "submitted_amount_cents and transport_days_billed replaced by the resubmit payload"
          - "verification_status = SUBMITTED; resubmission_round += 1; verification_basis = null; verified_by_user_id = null; verified_amount_cents = 0; variance_pct = 0"
          - "TuitionInvoice.version += 1"
        note: "Closes the verification cycle on the first dimension while payment_status stays UNPAID."
      - from: UNPAID
        to: PAID
        trigger: "POST /ood-placements/tuition-invoices/{id}/approve-payment"
        actor: FiscalOfficer
        preconditions:
          - "TuitionInvoice.payment_status == UNPAID (second dimension)"
          - "TuitionInvoice.verification_status == VERIFIED (first dimension)"
          - "AttendanceRecord(attendance_record_id).status == VERIFIED"
          - "X-User-ID != TuitionInvoice.verified_by_user_id (segregation of duties)"
          - "Placement.contract_encumbrance_cents - Placement.paid_total_ytd_cents >= TuitionInvoice.verified_amount_cents"
        side_effects:
          - "CASCADE-B LINK 0 (self): payment_status = PAID; settled_amount_cents = verified_amount_cents; approved_by_user_id = X-User-ID; TuitionInvoice.version += 1"
          - "CASCADE-B LINK 1 (TuitionInvoice -> DistrictFiscalAccount): encumbered_cents -= settled_amount_cents; disbursed_cents += settled_amount_cents; DistrictFiscalAccount.version += 1"
          - "CASCADE-B LINK 2 (TuitionInvoice -> Placement): Placement.paid_total_ytd_cents += settled_amount_cents; Placement.encumbrance_cents recomputed; Placement.version += 1"
          - "CASCADE-B LINK 3 (Placement -> FundingClaim, caused by LINK 2): because Placement.paid_total_ytd_cents crossed >= HIGH_COST_TRIGGER_CENTS (4000000) and no FundingClaim exists with this placement_id, claim_type == HIGH_COST_FUND, the placement's fiscal year and status IN {ELIGIBLE, SUBMITTED}, a FundingClaim is created with source = AUTO_CASCADE, status = ELIGIBLE, eligible_base_cents = Placement.paid_total_ytd_cents and reimbursable_amount_cents = funding_claim_reimbursable(HIGH_COST_FUND)"
          - "CASCADE-B LINK 4 (FundingClaim -> Student, caused by LINK 3): Student.high_cost_flag = true; Student.projected_state_recovery_cents += FundingClaim.reimbursable_amount_cents; Student.version += 1"
        note: "LINK 2 -> LINK 3 -> LINK 4 is a genuine transitive chain: the claim exists only because the placement's YTD counter moved, and the student rollup moves only because the claim was created."
      - from: UNPAID
        to: VOIDED
        trigger: "system event: CASCADE-A LINK 9 of Placement ACTIVE->TERMINATED"
        actor: system
        preconditions:
          - "TuitionInvoice.payment_status == UNPAID"
          - "TuitionInvoice.verification_status == DISPUTED"
          - "Placement(placement_id) is transitioning ACTIVE -> TERMINATED"
        side_effects:
          - "payment_status = VOIDED; settled_amount_cents stays 0; TuitionInvoice.version += 1"
          - "verification_status is UNCHANGED at DISPUTED (dimensions move independently)"

  # ---- SM7: ReimbursementClaim — CYCLIC (AWARDED_PARTIAL/DENIED -> REMANDED -> AWARDED_*) ----
  - entity: ReimbursementClaim
    initial_state: FILED
    terminal_states: [AWARDED_FULL]
    transitions:
      - from: FILED
        to: AWARDED_FULL
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate when awarded_amount_cents == eligible_amount_cents AND eligible_amount_cents == claimed_tuition_cents + claimed_transport_cents"
        actor: HearingAdjudicator
        preconditions:
          - "ReimbursementClaim.status IN {FILED, REMANDED}"
          - "ReimbursementClaim.notice_date <= ReimbursementClaim.unilateral_start_date"
          - "No Placement with student_id == ReimbursementClaim.student_id has status == ACTIVE and a closed date interval [start_date, end_date] intersecting [unilateral_start_date, unilateral_end_date]"
          - "DistrictFiscalAccount(fiscal_account_id).available_cents >= awarded_amount_cents"
        side_effects:
          - "award_basis = request award_basis; equitable_reduction_pct, eligible_amount_cents, awarded_amount_cents, awarded_tuition_cents, awarded_transport_cents all written per reimbursement_award"
          - "status = AWARDED_FULL"
          - "DistrictFiscalAccount.available_cents -= awarded_amount_cents; DistrictFiscalAccount.disbursed_cents += awarded_amount_cents; DistrictFiscalAccount.version += 1"
          - "ReimbursementClaim.version += 1"
      - from: FILED
        to: AWARDED_PARTIAL
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate when 0 < awarded_amount_cents and (equitable_reduction_pct > 0 OR eligible_amount_cents < claimed_tuition_cents + claimed_transport_cents)"
        actor: HearingAdjudicator
        preconditions:
          - "Same preconditions as the AWARDED_FULL branch"
        side_effects:
          - "Same computed fields and fiscal disbursement as the AWARDED_FULL branch, with status = AWARDED_PARTIAL"
      - from: FILED
        to: DENIED
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate when awarded_amount_cents == 0"
        actor: HearingAdjudicator
        preconditions:
          - "Same preconditions as the AWARDED_FULL branch, except the fiscal-authority check is skipped because nothing is disbursed"
        side_effects:
          - "Computed fields written; status = DENIED; no fiscal movement"
      - from: REMANDED
        to: AWARDED_FULL
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate after a remand"
        actor: HearingAdjudicator
        preconditions:
          - "Same as the FILED->AWARDED_FULL branch"
        side_effects:
          - "Same as the FILED->AWARDED_FULL branch"
        note: "Closes the adjudication cycle; remand_round is unchanged here."
      - from: REMANDED
        to: AWARDED_PARTIAL
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate after a remand"
        actor: HearingAdjudicator
        preconditions:
          - "Same as the FILED->AWARDED_PARTIAL branch"
        side_effects:
          - "Same as the FILED->AWARDED_PARTIAL branch"
      - from: REMANDED
        to: DENIED
        trigger: "POST /ood-placements/reimbursement-claims/{id}/adjudicate after a remand"
        actor: HearingAdjudicator
        preconditions:
          - "Same as the FILED->DENIED branch"
        side_effects:
          - "Same as the FILED->DENIED branch"
      - from: AWARDED_PARTIAL
        to: REMANDED
        trigger: "POST /ood-placements/reimbursement-claims/{id}/remand"
        actor: HearingAdjudicator
        preconditions:
          - "ReimbursementClaim.status IN {AWARDED_PARTIAL, DENIED}"
          - "ReimbursementClaim.remand_round < MAX_REMAND_ROUNDS (2)"
        side_effects:
          - "COMPENSATION: DistrictFiscalAccount.disbursed_cents -= awarded_amount_cents; DistrictFiscalAccount.available_cents += awarded_amount_cents; DistrictFiscalAccount.version += 1"
          - "awarded_amount_cents = 0; awarded_tuition_cents = 0; awarded_transport_cents = 0; eligible_amount_cents = 0; equitable_reduction_pct = 0; award_basis = null"
          - "status = REMANDED; remand_round += 1; ReimbursementClaim.version += 1"
        note: "Exact compensating action for the adjudication disbursement: authorized_cents == available_cents + encumbered_cents + disbursed_cents is restored to its pre-adjudication decomposition."
      - from: DENIED
        to: REMANDED
        trigger: "POST /ood-placements/reimbursement-claims/{id}/remand"
        actor: HearingAdjudicator
        preconditions:
          - "ReimbursementClaim.status == DENIED"
          - "ReimbursementClaim.remand_round < MAX_REMAND_ROUNDS (2)"
        side_effects:
          - "No fiscal reversal (awarded_amount_cents was already 0); status = REMANDED; remand_round += 1; ReimbursementClaim.version += 1"

  # ---- SM8: ProgressReport ----
  - entity: ProgressReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ood-placements/progress-reports/{id}/accept with decision == ACCEPT"
        actor: PlacementCoordinator
        preconditions:
          - "ProgressReport.status == SUBMITTED"
          - "Placement(placement_id).status IN {ACTIVE, TERMINATED, RETURNED_TO_DISTRICT}"
        side_effects:
          - "ProgressReport.status = ACCEPTED"
          - "ProgressReport.report_score recomputed per the return_readiness_score per-report step"
          - "ProgressReport.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ood-placements/progress-reports/{id}/accept with decision == REJECT"
        actor: PlacementCoordinator
        preconditions:
          - "ProgressReport.status == SUBMITTED"
        side_effects:
          - "ProgressReport.status = REJECTED; report_score = 0 (rejected reports never enter the readiness baseline)"
          - "ProgressReport.version += 1"

  # ---- SM9: ReturnTransitionPlan ----
  - entity: ReturnTransitionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ood-placements/return-transition-plans/{id}/activate"
        actor: PlacementCoordinator
        preconditions:
          - "ReturnTransitionPlan.status == DRAFT"
          - "Placement(placement_id).status == ACTIVE"
          - "len(request transition_services) >= 1"
          - "count of ProgressReport rows with placement_id == Placement.id and status == ACCEPTED is >= MIN_ACCEPTED_REPORTS (2)"
          - "return_readiness_score(placement, variant=trailing_two_quarter) >= RETURN_READINESS_MIN (62.50)"
          - "DistrictFiscalAccount(Placement.fiscal_account_id).available_cents >= TRANSITION_SERVICES_RESERVE_CENTS (250000)"
          - "No other ReturnTransitionPlan with the same placement_id has status == ACTIVE"
        side_effects:
          - "ReturnTransitionPlan.status = ACTIVE; transition_services = request transition_services; readiness_score_at_activation = the score under the request's readiness_variant (default trailing_two_quarter); reserve_cents = TRANSITION_SERVICES_RESERVE_CENTS"
          - "Placement.transition_reserve_cents = TRANSITION_SERVICES_RESERVE_CENTS; Placement.encumbrance_cents recomputed; Placement.version += 1"
          - "DistrictFiscalAccount.available_cents -= 250000; DistrictFiscalAccount.encumbered_cents += 250000; DistrictFiscalAccount.version += 1"
          - "ReturnTransitionPlan.version += 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: Placement ACTIVE->RETURNED_TO_DISTRICT"
        actor: system
        preconditions:
          - "ReturnTransitionPlan.status == ACTIVE"
        side_effects:
          - "status = COMPLETED; reserve_cents and Placement.transition_reserve_cents RETAINED as encumbered"
          - "ReturnTransitionPlan.version += 1"
      - from: ACTIVE
        to: ABANDONED
        trigger: "system event: CASCADE-A LINK 8 of Placement ACTIVE->TERMINATED"
        actor: system
        preconditions:
          - "ReturnTransitionPlan.status == ACTIVE"
        side_effects:
          - "status = ABANDONED; reserve released per CASCADE-A LINK 8"
          - "ReturnTransitionPlan.version += 1"

  # ---- SM10: FundingClaim ----
  - entity: FundingClaim
    initial_state: ELIGIBLE
    terminal_states: [SUBMITTED]
    transitions:
      - from: ELIGIBLE
        to: SUBMITTED
        trigger: "POST /ood-placements/funding-claims/{id}/submit-to-state"
        actor: FiscalOfficer
        preconditions:
          - "FundingClaim.status == ELIGIBLE"
          - "FundingClaim.reimbursable_amount_cents >= 1"
        side_effects:
          - "status = SUBMITTED; submitted_at = logical clock now; state_claim_reference = request state_claim_reference"
          - "FundingClaim.version += 1"

  # ---- SM11: TuitionRateSchedule ----
  - entity: TuitionRateSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: STATE_APPROVED
        to: SUPERSEDED
        trigger: "system event: POST /ood-placements/tuition-rate-schedules creates a new schedule with approval_state == STATE_APPROVED for the same (school_id, fiscal_year)"
        actor: system
        preconditions:
          - "TuitionRateSchedule.approval_state == STATE_APPROVED"
          - "The incoming schedule has the same school_id and fiscal_year"
        side_effects:
          - "approval_state = SUPERSEDED; superseded_by_schedule_id = the new schedule's id"
          - "ApprovedPrivateSchool.active_rate_schedule_id repointed to the new schedule; ApprovedPrivateSchool.version += 1"
          - "Placements already CONTRACTED keep their pinned rate_schedule_id and are NOT repriced"
          - "TuitionRateSchedule.version += 1"
        note: "DRAFT schedules are never superseded; they simply remain DRAFT and are ineligible for contract execution."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-placement
    parent_entity: Placement
    write_endpoint: "POST /ood-placements/tuition-invoices"
    occ_field: "expected_placement_version"
    description: |
      Creating a TuitionInvoice against a Placement whose version has advanced since
      the client last observed it is rejected with a stale-version conflict. A new
      invoice for a billing period legitimately supersedes a prior VOIDED or DISPUTED
      invoice for the same period, so the create itself is a valid operation from an
      unchanged state; what the rule guards is the writer's stale view of the
      placement, whose rate pin, encumbrance, transport status or paid-to-date figure
      may have moved and would silently change how the invoice is later verified.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412
  - rule_id: rate-schedule-create-stale-school
    parent_entity: ApprovedPrivateSchool
    write_endpoint: "POST /ood-placements/tuition-rate-schedules"
    occ_field: "expected_school_version"
    description: |
      Creating a TuitionRateSchedule against an ApprovedPrivateSchool whose version has
      advanced since the client last observed it is rejected with a stale-version
      conflict. A STATE_APPROVED schedule create legitimately supersedes the prior
      STATE_APPROVED schedule for the same (school_id, fiscal_year), so the create is a
      valid operation from an unchanged state; the rule guards the rate-setter whose view
      of the school (its approval_status and active_rate_schedule_id pointer) is stale.
    error_id: ERR_STALE_SCHOOL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: placement_encumbrance
    trigger: "Placement PROPOSED->CONTRACTED (POST /ood-placements/placements/{id}/execute-contract); writes Placement.contract_encumbrance_cents"
    algorithm: aggregation
    formula: |
      rate = TuitionRateSchedule(placement.rate_schedule_id)
      tuition_component_cents     = placement.contracted_instructional_days * rate.day_rate_cents
      residential_component_cents = (placement.placement_type == "RESIDENTIAL")
                                    ? placement.contracted_residential_nights * rate.residential_rate_cents
                                    : 0
      contract_encumbrance_cents  = tuition_component_cents + residential_component_cents
    input_set: "Exactly the two contracted counters on the Placement row and the two rates on the pinned TuitionRateSchedule. Service addenda and transportation are NOT included here; they book their own encumbrances at their own authorization transitions."
    constants: {}
    precision: "Whole cents; both operands are integers so no rounding occurs."

  - name: service_addendum_encumbrance
    trigger: "ServiceAddendum PROPOSED->ACTIVE (POST /ood-placements/service-addenda/{id}/authorize); writes ServiceAddendum.encumbrance_cents"
    algorithm: aggregation
    formula: |
      rate_cents = TuitionRateSchedule(Placement(addendum.placement_id).rate_schedule_id).service_hourly_rate_cents
      addendum.hourly_rate_cents = rate_cents                      # version-pinned, frozen
      encumbrance_cents = round_half_up(
          addendum.authorized_hours_per_week * addendum.contract_weeks * rate_cents )
    input_set: "The addendum's own authorized_hours_per_week and contract_weeks, plus the service rate on the placement's pinned rate schedule at the moment of authorization."
    constants: {}
    precision: "round_half_up to whole cents (authorized_hours_per_week may carry .25/.5/.75 fractions)."

  - name: transport_encumbrance
    trigger: "TransportationAssignment REQUESTED->ACTIVE and WAITLISTED->ACTIVE; writes TransportationAssignment.encumbrance_cents"
    algorithm: aggregation
    formula: |
      route = TransportRoute(assignment.route_id)
      encumbrance_cents = round_half_up(
          assignment.days_per_week * assignment.contract_weeks
          * route.daily_rate_cents * TRANSPORT_FUEL_INDEX )
    input_set: "The assignment's own days_per_week and contract_weeks and the route's daily_rate_cents. WAITLISTED assignments hold 0."
    constants:
      TRANSPORT_FUEL_INDEX: 1.0325
    precision: "round_half_up to whole cents."

  - name: invoice_verified_amount
    trigger: "TuitionInvoice SUBMITTED->VERIFIED and SUBMITTED->DISPUTED (POST /ood-placements/tuition-invoices/{id}/verify); writes tuition_line_cents, residential_line_cents, service_lines_total_cents, transport_line_cents, gross_billable_cents and, via invoice_net_payable, provisional_amount_cents / final_amount_cents / verified_amount_cents / variance_pct"
    algorithm: chronological
    formula: |
      ar   = AttendanceRecord(invoice.attendance_record_id)
      rate = TuitionRateSchedule(Placement(invoice.placement_id).rate_schedule_id)

      # ---- step 1: billable-day count, the ONLY thing the two variants disagree on
      billable_days(ENROLLMENT) = ar.days_enrolled
      billable_days(ATTENDANCE) = ar.days_attended + min(ar.days_absent_unexcused, ABSENCE_TOLERANCE_DAYS)

      # ---- step 2: the four lines, EACH rounded to whole cents BEFORE any summation
      # ROUNDING ORDER IS PINNED: round per line item, then sum. Summing raw
      # products and rounding once at the end is WRONG and yields a different total.
      L1 tuition_line_cents     = billable_days * rate.day_rate_cents
      L2 residential_line_cents = (placement.placement_type == "RESIDENTIAL")
                                  ? ar.residential_nights * rate.residential_rate_cents : 0
      L3 for each entry e in ar.service_delivery_lines, in ascending
         ServiceAddendum.created_at order of e.service_addendum_id:
             addendum    = ServiceAddendum(e.service_addendum_id)
             capped_hours = min(e.hours_delivered,
                                addendum.authorized_hours_per_week * SERVICE_PERIOD_WEEKS)
             line_e_cents = round_half_up(capped_hours * addendum.hourly_rate_cents
                                          * SERVICE_TRAVEL_DIFFERENTIAL)
         service_lines_total_cents = sum of the per-entry ROUNDED line_e_cents
      L4 transport_line_cents   = (invoice.transport_days_billed == 0) ? 0 :
             round_half_up( invoice.transport_days_billed
                            * transport_route_for_invoice.daily_rate_cents
                            * TRANSPORT_FUEL_INDEX )
         where transport_route_for_invoice = TransportRoute of the TransportationAssignment
         with placement_id == invoice.placement_id and status == ACTIVE, ranked by
         created_at ASC, tie-broken by pickup_window_start_min ASC, taking the first;
         when that candidate set is empty and transport_days_billed > 0 the verify call
         fails with ERR_TRANSPORT_NOT_ASSIGNED.

      # ---- step 3
      gross_billable_cents = L1 + L2 + L3 + L4
      # ---- step 4: hand gross_billable_cents to invoice_net_payable
      net_payable_cents = invoice_net_payable(gross_billable_cents)

      # ---- step 5: both variants are ALWAYS evaluated and both stored
      provisional_amount_cents = net_payable under billable_days(ENROLLMENT)
      final_amount_cents       = net_payable under billable_days(ATTENDANCE)
      verified_amount_cents    = (request basis == "ENROLLMENT") ? provisional_amount_cents
                                                                 : final_amount_cents
      variance_pct = round_half_up(
          abs(invoice.submitted_amount_cents - verified_amount_cents)
          / verified_amount_cents, 4 )
      verification_status = (variance_pct > VARIANCE_TOLERANCE_PCT) ? DISPUTED : VERIFIED
    input_set: "Exactly one AttendanceRecord (the one named by attendance_record_id, whose status MUST be VERIFIED), the placement's pinned TuitionRateSchedule, the ServiceAddendum rows named by that record's service_delivery_lines (status == ACTIVE), and the single ACTIVE TransportationAssignment selected by the pinned ranking above. No other attendance period, addendum or assignment enters the computation."
    constants:
      ABSENCE_TOLERANCE_DAYS: 3
      SERVICE_PERIOD_WEEKS: 4
      SERVICE_TRAVEL_DIFFERENTIAL: 1.075
      TRANSPORT_FUEL_INDEX: 1.0325
      VARIANCE_TOLERANCE_PCT: 0.02
    precision: "Each of L1-L4 is an integer cent amount produced by round_half_up BEFORE summation; variance_pct is round_half_up to 4 decimals."
    variants:
      - name: provisional_enrollment_basis
        when: "verification_basis == ENROLLMENT — the reserved-seat contract basis the school bills on while the cycle is open."
        difference: "billable_days = ar.days_enrolled, so every held-seat day is billed regardless of attendance."
      - name: final_attendance_basis
        when: "verification_basis == ATTENDANCE — the settlement basis the district uses to close the cycle."
        difference: "billable_days = ar.days_attended + min(ar.days_absent_unexcused, 3), so unexcused absences beyond the 3-day tolerance are abated and the total is strictly lower whenever days_absent_unexcused > 3 or days_attended + 3 < days_enrolled."

  - name: invoice_net_payable
    trigger: "Called by invoice_verified_amount step 4, once per variant, during POST /ood-placements/tuition-invoices/{id}/verify; writes volume_credit_cents and admin_fee_cents from the verification_basis run"
    algorithm: waterfall_allocation
    formula: |
      # The dependency LOOKS circular: net_payable includes admin_fee, admin_fee is a
      # percentage of the post-credit subtotal, and the credit is tier-selected. The
      # evaluation order below is PINNED so the value is well defined. In particular
      # the tier is keyed on gross_billable_cents ONLY — never on the subtotal and
      # never on net_payable_cents.
      step 1: gross = gross_billable_cents                       (from invoice_verified_amount step 3)
      step 2: credit_rate = 0.03   if gross >= VOLUME_TIER_2_FLOOR_CENTS (1000000)
                          = 0.015  else if gross >= VOLUME_TIER_1_FLOOR_CENTS (700000)
                          = 0.0    otherwise
      step 3: volume_credit_cents = round_half_up(gross * credit_rate)
              subtotal_cents      = gross - volume_credit_cents
      step 4: admin_fee_cents     = round_half_up(subtotal_cents * ADMIN_FEE_PCT)
      step 5: net_payable_cents   = subtotal_cents + admin_fee_cents
    input_set: "A single integer gross_billable_cents. No entity state is read; the tier floors and fee percentage are constants."
    constants:
      VOLUME_TIER_1_FLOOR_CENTS: 700000
      VOLUME_TIER_2_FLOOR_CENTS: 1000000
      VOLUME_TIER_1_RATE: 0.015
      VOLUME_TIER_2_RATE: 0.03
      ADMIN_FEE_PCT: 0.0225
    precision: "round_half_up to whole cents at step 3 and step 4 independently; step 5 is integer addition. Tier floors are inclusive (>=)."

  - name: return_readiness_score
    trigger: "GET /ood-placements/return-transition-plans/{id}/readiness (computed read) and ReturnTransitionPlan DRAFT->ACTIVE (POST /ood-placements/return-transition-plans/{id}/activate); the activate transition writes readiness_score_at_activation and transition_services"
    algorithm: weighted_scoring
    formula: |
      # per-report score, identical in both variants
      report_score(r) = W_GOAL * (r.goals_met / r.goals_total * 100)
                      + W_BENCH * r.benchmark_scaled_score
                      + W_ATT   * r.attendance_rate_pct
                      - REGRESSION_PENALTY_POINTS * r.goals_regressed
      # rounded to 2 decimals per report BEFORE aggregation

      candidate set = ProgressReport rows with placement_id == plan.placement_id
                      AND status == ACCEPTED
      ordering      = fiscal_year DESC, quarter DESC, created_at DESC

      # the variant is chosen by the request's readiness_variant input (default
      # trailing_two_quarter); only the resulting score is persisted, on the plan's
      # readiness_score_at_activation field.
      variant trailing_two_quarter:
          take the first 2 rows of the ordering (if only 1 exists, take that 1)
          readiness_score = round_half_up(mean of their report_score, 2)

      variant cumulative_recency_weighted:
          for the i-th row of the ordering (i = 0 for the newest):
              weight_i = DECAY_BASE ** i
          readiness_score = round_half_up(
              sum(weight_i * report_score_i) / sum(weight_i), 2 )

      readiness_met = (readiness_score >= RETURN_READINESS_MIN)
    input_set: "Only ProgressReport rows for this plan's placement whose status == ACCEPTED. SUBMITTED and REJECTED reports are excluded from both variants; reports belonging to any other placement (including the prior_placement_id chain) are excluded."
    constants:
      W_GOAL: 0.5
      W_BENCH: 0.3
      W_ATT: 0.2
      REGRESSION_PENALTY_POINTS: 4
      DECAY_BASE: 0.7
      RETURN_READINESS_MIN: 62.50
      MIN_ACCEPTED_REPORTS: 2
    precision: "report_score is round_half_up to 2 decimals; the aggregate is round_half_up to 2 decimals. RETURN_READINESS_MIN is compared with >= so exactly 62.50 passes."
    variants:
      - name: trailing_two_quarter
        when: "request readiness_variant == trailing_two_quarter — the default statutory basis, a plain mean of the two most recent accepted quarters."
        difference: "Only the two newest accepted reports contribute, each with weight 1. Older quarters are discarded entirely, so an early bad quarter cannot depress the score."
      - name: cumulative_recency_weighted
        when: "request readiness_variant == cumulative_recency_weighted — the appeal basis used when a parent contests the trailing figure."
        difference: "EVERY accepted report contributes with geometrically decaying weight 0.7**i. A student with an early weak quarter scores strictly lower than under trailing_two_quarter, and a student with an early strong quarter scores strictly higher."

  - name: reimbursement_award
    trigger: "ReimbursementClaim FILED|REMANDED -> AWARDED_FULL|AWARDED_PARTIAL|DENIED (POST /ood-placements/reimbursement-claims/{id}/adjudicate); writes award_basis, eligible_amount_cents, equitable_reduction_pct, awarded_tuition_cents, awarded_transport_cents, awarded_amount_cents"
    algorithm: waterfall_allocation
    formula: |
      # ---- stage 1: eligible components (THE variant divergence lives here)
      statutory_cap_cents = STATE_CAP_DAY_RATE_CENTS * claim.claimed_instructional_days

      variant strict_statutory:
          eligible_tuition_cents   = min(claim.claimed_tuition_cents, statutory_cap_cents)
          eligible_transport_cents = min(claim.claimed_transport_cents, TRANSPORT_CAP_CENTS)

      variant equitable_actual_cost:
          eligible_tuition_cents   = claim.claimed_tuition_cents
          eligible_transport_cents = min(claim.claimed_transport_cents, TRANSPORT_CAP_CENTS)
          # the statutory day-rate ceiling is waived; the transport cap still binds

      eligible_amount_cents = eligible_tuition_cents + eligible_transport_cents

      # ---- stage 2: equitable reduction waterfall, applied in this PINNED order,
      #      accumulating percentages additively, then clamped ONCE at the end
      equitable_reduction_pct = 0
      (a) notice_days = claim.unilateral_start_date - claim.notice_date, in whole days
          if notice_days < NOTICE_DAYS_REQUIRED:
              equitable_reduction_pct += LATE_NOTICE_REDUCTION_PCT
      (b) if claim.parent_cooperation == false:
              equitable_reduction_pct += NONCOOPERATION_REDUCTION_PCT
      (c) if claim.prior_district_offer_date != null
              AND claim.prior_district_offer_date <= claim.notice_date:
              equitable_reduction_pct += TIMELY_OFFER_REDUCTION_PCT
      equitable_reduction_pct = min(equitable_reduction_pct, MAX_EQUITABLE_REDUCTION_PCT)

      # ---- stage 3: each component rounded to whole cents BEFORE summation
      awarded_tuition_cents   = round_half_up(eligible_tuition_cents
                                              * (1 - equitable_reduction_pct))
      awarded_transport_cents = round_half_up(eligible_transport_cents
                                              * (1 - equitable_reduction_pct))
      awarded_amount_cents    = awarded_tuition_cents + awarded_transport_cents

      status = DENIED           if awarded_amount_cents == 0
                                   OR equitable_reduction_pct >= MAX_EQUITABLE_REDUCTION_PCT
             = AWARDED_FULL     if awarded_amount_cents == claim.claimed_tuition_cents
                                                         + claim.claimed_transport_cents
             = AWARDED_PARTIAL  otherwise
      award_basis = the adjudicate call's award_basis input
    input_set: "Exactly the claim's own submitted figures (claimed_tuition_cents, claimed_transport_cents, claimed_instructional_days, notice_date, unilateral_start_date, prior_district_offer_date, parent_cooperation). No Placement, TuitionRateSchedule or AttendanceRecord row is read -- a parental unilateral placement has no district contract to read rates from, which is exactly why the statutory day-rate ceiling substitutes for one."
    constants:
      STATE_CAP_DAY_RATE_CENTS: 28000
      TRANSPORT_CAP_CENTS: 150000
      NOTICE_DAYS_REQUIRED: 10
      LATE_NOTICE_REDUCTION_PCT: 0.25
      NONCOOPERATION_REDUCTION_PCT: 0.20
      TIMELY_OFFER_REDUCTION_PCT: 0.15
      MAX_EQUITABLE_REDUCTION_PCT: 0.50
    precision: "equitable_reduction_pct is an exact sum of the listed 2-decimal constants (no rounding). round_half_up to whole cents is applied SEPARATELY to each of the two award components and then the two integers are added; rounding the combined base once would differ by a cent whenever both components round up. NOTICE_DAYS_REQUIRED uses a strict < so exactly 10 days notice is timely."
    variants:
      - name: strict_statutory
        when: "adjudicate request award_basis == strict_statutory -- the default basis; the state-approved day-rate ceiling binds the tuition component."
        difference: "eligible_tuition_cents is capped at STATE_CAP_DAY_RATE_CENTS * claimed_instructional_days, so a claim whose implied per-day cost exceeds $280 is trimmed before the reduction waterfall runs."
      - name: equitable_actual_cost
        when: "adjudicate request award_basis == equitable_actual_cost, which additionally requires a non-empty equitable_findings of >= 30 characters -- the hearing officer found the district's own offer inadequate."
        difference: "The statutory day-rate ceiling is not applied, so the full claimed tuition enters the base. The transport cap still applies and the identical reduction waterfall then runs on a larger base, producing a strictly larger award whenever claimed_tuition_cents > statutory_cap_cents."

  - name: funding_claim_reimbursable
    trigger: "POST /ood-placements/funding-claims (manual) and CASCADE-B LINK 3 (automatic HIGH_COST_FUND claim creation); writes eligible_base_cents, tier_rate, reimbursable_amount_cents"
    algorithm: threshold
    formula: |
      # ---- HIGH_COST_FUND claim_type
      eligible_base_cents = Placement(claim.placement_id).paid_total_ytd_cents
      if eligible_base_cents < HIGH_COST_TRIGGER_CENTS:
          reject with ERR_HIGH_COST_THRESHOLD_NOT_MET     # strict <; exactly 4000000 QUALIFIES
      excess_cents = eligible_base_cents - HIGH_COST_TRIGGER_CENTS
      tier_rate = 0.90  if excess_cents >= HIGH_COST_TIER_3_FLOOR_CENTS (6000000)
                = 0.75  else if excess_cents >= HIGH_COST_TIER_2_FLOOR_CENTS (2000000)
                = 0.60  otherwise
      prior_awarded_cents = sum of reimbursable_amount_cents over FundingClaim rows with the same
                            claim_type == HIGH_COST_FUND, the same
                            Placement(placement_id).student_id, the same fiscal_year, and
                            status in {ELIGIBLE, SUBMITTED}, EXCLUDING this claim
      reimbursable_amount_cents = max(0,
          min( round_half_up(excess_cents * tier_rate),
               HIGH_COST_MAX_PER_STUDENT_CENTS - prior_awarded_cents ) )

      # ---- MEDICAID claim_type
      billable_service_hours = sum over AttendanceRecord rows with
          placement_id == claim.placement_id AND status == 'VERIFIED', of the
          hours_delivered of each service_delivery_lines entry whose named
          ServiceAddendum has medicaid_billable == true. Lines naming an addendum with
          medicaid_billable == false contribute 0, and records still in SUBMITTED or
          DISPUTED contribute 0.
      eligible_base_cents = round_half_up(billable_service_hours
                                          * MEDICAID_HOURLY_RATE_CENTS)
      tier_rate = FMAP_PCT
      reimbursable_amount_cents = round_half_up(eligible_base_cents * FMAP_PCT)
      # requires Student.medicaid_consent_on_file == true, else ERR_MEDICAID_CONSENT_MISSING
    input_set: "For HIGH_COST_FUND: the referenced Placement's paid_total_ytd_cents plus the sibling FundingClaim rows for the same student/fiscal_year/claim_type in status ELIGIBLE or SUBMITTED (rows in any other status contribute 0 to prior_awarded_cents). For MEDICAID: only VERIFIED AttendanceRecord service lines naming a medicaid_billable ServiceAddendum on this placement, plus Student.medicaid_consent_on_file."
    constants:
      HIGH_COST_TRIGGER_CENTS: 4000000
      HIGH_COST_TIER_2_FLOOR_CENTS: 2000000
      HIGH_COST_TIER_3_FLOOR_CENTS: 6000000
      HIGH_COST_TIER_1_RATE: 0.60
      HIGH_COST_TIER_2_RATE: 0.75
      HIGH_COST_TIER_3_RATE: 0.90
      HIGH_COST_MAX_PER_STUDENT_CENTS: 5000000
      MEDICAID_HOURLY_RATE_CENTS: 9000
      FMAP_PCT: 0.5432
    precision: "round_half_up to whole cents, applied to the tier product BEFORE the per-student cap min() and BEFORE the max(0, ...) floor. All three thresholds are inclusive (>=); the trigger rejection uses a strict <."

  - name: waitlist_promotion
    trigger: "CASCADE-A LINK 5 and TransportationAssignment ACTIVE->RELEASED (POST /ood-placements/transportation-assignments/{id}/release) — selects at most one WAITLISTED assignment on the freed route to promote"
    algorithm: chronological
    formula: |
      # ---- eligibility filter (pinned)
      candidates = TransportationAssignment rows where
                   route_id == released_assignment.route_id
                   AND status == 'WAITLISTED'
                   AND Placement(placement_id).status in {'CONTRACTED', 'ACTIVE'}
      # ---- ranking expression (pinned)
      order by created_at ASC
      # ---- tie-break (pinned, total)
      then by pickup_window_start_min ASC, then by id ASC
      # ---- selection
      promoted = first candidate, and EXACTLY ONE candidate is promoted per released seat
                 even when route.seats_available becomes > 1
      # ---- empty-set fallback (pinned)
      if candidates is empty: no promotion occurs, route.seats_available simply
      increments, and the release call still returns 200. This is NOT an error.
    input_set: "Only WAITLISTED assignments on the same route whose parent Placement is CONTRACTED or ACTIVE. A WAITLISTED assignment whose placement has since gone TERMINATED, RETURNED_TO_DISTRICT or EXPIRED is skipped and left WAITLISTED forever."
    constants: {}
    precision: "Integer seat arithmetic only. The route invariant seat_capacity == seats_available + seats_committed holds before and after promotion."

  - name: placement_cost_projection
    trigger: "GET /ood-placements/placements/{id}/cost-projection (computed read, no writes)"
    algorithm: forward_looking
    formula: |
      variant CONTRACTED_ENCUMBRANCE:
          projected_annual_cents = placement.contract_encumbrance_cents
                                 + placement.addendum_encumbrance_cents
                                 + placement.transport_encumbrance_cents

      variant ACTUAL_RUN_RATE:
          settled = TuitionInvoice rows with placement_id == {id}
                    AND payment_status == 'PAID'
          settled_cents  = sum(settled.verified_amount_cents)
          periods_paid   = count(settled)
          projected_annual_cents = (periods_paid == 0)
              ? 0
              : round_half_up(settled_cents / periods_paid * BILLING_PERIODS_PER_YEAR)

      remaining_commitment_cents = max(0, placement.encumbrance_cents)
      variance_cents = projected_annual_cents - placement.contract_encumbrance_cents
    input_set: "For ACTUAL_RUN_RATE only TuitionInvoice rows in payment_status PAID are averaged; SUBMITTED, DISPUTED and VOIDED invoices contribute nothing, and a VOIDED invoice that was previously PAID is excluded (it is no longer PAID)."
    constants:
      BILLING_PERIODS_PER_YEAR: 13
    precision: "round_half_up to whole cents once, after the division and multiplication."

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# The ladder is TOTAL: a request that violates rules at several priorities always
# returns the error of the LOWEST-numbered violated rule. Domain ordering rationale:
# safety/compliance (p11) outranks constraint satisfaction (p12) which outranks
# fiscal capacity (p13) -- a placement that is unsafe or non-compliant must be
# refused even when money is available, and a placement that breaks a constraint
# must be refused before the district is told it is merely broke.
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and one of the seven declared roles; X-User-ID header present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The X-Role value appears in the endpoint's roles: list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every {id} path parameter resolves to an existing row, validated left-to-right in path order"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "Request body conforms to the endpoint's input contract: required fields present, enums within their declared value set, integers >= 0, dates ISO-8601 date or date-time, monetary fields integer cents (never a decimal string), and no unknown field names"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: existence
    check: "Every FK-bearing field in the request body resolves to an existing row (student_id, school_id, rate_schedule_id, decision_id, placement_id, route_id, attendance_record_id, fiscal_account_id, prior_placement_id, superseding_placement_id, service_addendum_id inside service_delivery_lines)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints with FK inputs"

  - priority: 6
    category: auth
    check: "Entity-backed role scope: a SchoolBillingAgent whose identity resolves to school S may only read or write rows whose resolved ApprovedPrivateSchool is S; a ParentGuardian whose identity resolves to student U may only read or write rows whose resolved Student is U"
    error_id: ERR_OUT_OF_SCOPE
    http_status: 403
    applies_to: "all endpoints reachable by SchoolBillingAgent or ParentGuardian"

  - priority: 7
    category: state
    check: "expected_placement_version equals Placement.version (POST /tuition-invoices); expected_school_version equals ApprovedPrivateSchool.version (POST /tuition-rate-schedules)"
    error_id: "ERR_STALE_PLACEMENT_VERSION | ERR_STALE_SCHOOL_VERSION"
    http_status: 412
    applies_to: "POST /ood-placements/tuition-invoices, POST /ood-placements/tuition-rate-schedules"

  - priority: 8
    category: state
    check: "The target row's current status permits the requested transition per §1.2 (including terminal-state lockdown and idempotent re-invocation of a transition already taken)"
    error_id: "ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: business_referential
    check: "Invoice linkage consistency: AttendanceRecord(attendance_record_id).placement_id MUST equal the request's placement_id"
    error_id: ERR_ATTENDANCE_PLACEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /ood-placements/tuition-invoices"

  - priority: 9
    category: business_referential
    check: "Placement linkage consistency: PlacementDecision(decision_id).student_id MUST equal the request's student_id, and TuitionRateSchedule(rate_schedule_id).school_id MUST equal the request's school_id"
    error_id: ERR_PLACEMENT_LINKAGE_MISMATCH
    http_status: 409
    applies_to: "POST /ood-placements/placements"

  - priority: 9
    category: business_referential
    check: "Each service_delivery_lines entry names a ServiceAddendum whose placement_id equals the request's placement_id"
    error_id: ERR_ADDENDUM_PLACEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /ood-placements/attendance-records"

  - priority: 9
    category: business_referential
    check: "Funding-claim linkage: the request fiscal_year MUST equal TuitionRateSchedule(Placement(placement_id).rate_schedule_id).fiscal_year, and the placement MUST have had its contract executed (contract_executed_at is not null)"
    error_id: ERR_FUNDING_CLAIM_LINKAGE_MISMATCH
    http_status: 409
    applies_to: "POST /ood-placements/funding-claims"

  - priority: 10
    category: business_temporal
    check: "Attendance period shape: period_end MUST equal period_start + BILLING_CYCLE_DAYS - 1 (a 28-day cycle), and days_enrolled + days_absent_unexcused MUST be <= BILLING_CYCLE_DAYS"
    error_id: ERR_BILLING_PERIOD_SHAPE
    http_status: 409
    applies_to: "POST /ood-placements/attendance-records"

  - priority: 10
    category: business_temporal
    check: "Attendance period must fall entirely within the placement's contracted window: period_start >= Placement.start_date AND period_end <= Placement.end_date"
    error_id: ERR_PERIOD_OUTSIDE_PLACEMENT
    http_status: 409
    applies_to: "POST /ood-placements/attendance-records"

  - priority: 10
    category: business_temporal
    check: "No two AttendanceRecord rows for the same placement may share a period_start, and their [period_start, period_end] closed intervals may not overlap, counting rows in status SUBMITTED, VERIFIED and DISPUTED"
    error_id: ERR_DUPLICATE_BILLING_PERIOD
    http_status: 409
    applies_to: "POST /ood-placements/attendance-records"

  - priority: 10
    category: business_temporal
    check: "Rate-schedule effectivity: TuitionRateSchedule(rate_schedule_id).approval_state MUST be STATE_APPROVED and Placement.start_date MUST fall within [effective_from, effective_to]"
    error_id: ERR_RATE_SCHEDULE_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /ood-placements/placements, POST /ood-placements/placements/{id}/execute-contract"

  - priority: 10
    category: business_temporal
    check: "Placement window sanity: end_date > start_date, and start_date >= the current logical clock date"
    error_id: ERR_INVALID_PLACEMENT_WINDOW
    http_status: 409
    applies_to: "POST /ood-placements/placements"

  - priority: 10
    category: business_temporal
    check: "Progress-report period: (fiscal_year, quarter) must be unique per placement across statuses SUBMITTED and ACCEPTED, and quarter must be 1..4"
    error_id: ERR_DUPLICATE_PROGRESS_PERIOD
    http_status: 409
    applies_to: "POST /ood-placements/progress-reports"

  - priority: 11
    category: business_safety
    check: "LRE documentation completeness: trim(lre_justification) length >= 40 characters AND len(continuum_options_considered) >= MIN_CONTINUUM_OPTIONS (3) with every entry carrying a non-empty setting and rejected_reason AND recommended_placement_type set, before a decision may leave DRAFT"
    error_id: ERR_LRE_DOCUMENTATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /ood-placements/placement-decisions/{id}/submit"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the approver's X-User-ID MUST differ from PlacementDecision.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /ood-placements/placement-decisions/{id}/approve"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the payment approver's X-User-ID MUST differ from TuitionInvoice.verified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /ood-placements/tuition-invoices/{id}/approve-payment"

  - priority: 11
    category: business_safety
    check: "Residential authorization: a Placement with placement_type == RESIDENTIAL requires PlacementDecision(decision_id).recommended_placement_type == RESIDENTIAL and ApprovedPrivateSchool(school_id).residential_capable == true"
    error_id: ERR_RESIDENTIAL_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /ood-placements/placements, POST /ood-placements/placements/{id}/execute-contract"

  - priority: 11
    category: business_safety
    check: "Medicaid consent: a MEDICAID FundingClaim requires Student.medicaid_eligible == true AND Student.medicaid_consent_on_file == true, checked at both create and submit-to-state"
    error_id: ERR_MEDICAID_CONSENT_MISSING
    http_status: 409
    applies_to: "POST /ood-placements/funding-claims, POST /ood-placements/funding-claims/{id}/submit-to-state"

  - priority: 11
    category: business_safety
    check: "Attendance must be verified before money moves: TuitionInvoice verification requires AttendanceRecord.status == VERIFIED, and payment approval requires it to still be VERIFIED"
    error_id: ERR_ATTENDANCE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /ood-placements/tuition-invoices/{id}/verify, POST /ood-placements/tuition-invoices/{id}/approve-payment"

  - priority: 11
    category: business_safety
    check: "School approval standing: activating a Placement requires ApprovedPrivateSchool.approval_status == APPROVED (PROVISIONAL and REVOKED both block activation)"
    error_id: ERR_SCHOOL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ood-placements/placements/{id}/activate"

  - priority: 11
    category: business_safety
    check: "Transition-services continuity: a ReturnTransitionPlan may not be activated unless the activate call supplies a transition_services array with >= 1 non-empty entry and the plan's target_return_date is on or after the current logical clock date"
    error_id: ERR_TRANSITION_SERVICES_INCOMPLETE
    http_status: 409
    applies_to: "POST /ood-placements/return-transition-plans/{id}/activate"

  - priority: 12
    category: business_constraint
    check: "Student placement exclusivity: the new Placement's CLOSED interval [start_date, end_date] may not intersect the closed interval of any other Placement for the same student in status PROPOSED, CONTRACTED or ACTIVE. Adjacency is allowed only when prior.end_date < new.start_date (no buffer)."
    error_id: ERR_PLACEMENT_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /ood-placements/placements"

  - priority: 12
    category: business_constraint
    check: "Transport window exclusivity: within one TransportRoute, the HALF-OPEN interval [pickup_window_start_min, pickup_window_end_min + TURNAROUND_BUFFER_MIN) of an assignment being made ACTIVE may not intersect the half-open interval of any other ACTIVE assignment on that route. The buffer expands only the END side, so a gap of exactly TURNAROUND_BUFFER_MIN (10) minutes is permitted."
    error_id: ERR_TRANSPORT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ood-placements/transportation-assignments, POST /ood-placements/transportation-assignments/{id}/release"

  - priority: 12
    category: business_constraint
    check: "Readiness gate: activating a ReturnTransitionPlan requires at least MIN_ACCEPTED_REPORTS (2) ACCEPTED ProgressReport rows on the placement AND a score >= RETURN_READINESS_MIN (62.50) under the activate call's readiness_variant"
    error_id: ERR_RETURN_READINESS_NOT_MET
    http_status: 409
    applies_to: "POST /ood-placements/return-transition-plans/{id}/activate"

  - priority: 12
    category: business_constraint
    check: "Round caps: revision_round < MAX_REVISION_ROUNDS (3) to return a decision for revision; amendment_round < MAX_AMENDMENT_ROUNDS (2) to amend an attendance record; resubmission_round < MAX_RESUBMISSION_ROUNDS (2) to resubmit an invoice; remand_round < MAX_REMAND_ROUNDS (2) to remand a claim"
    error_id: ERR_MAX_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST .../placement-decisions/{id}/return-for-revision, POST .../attendance-records/{id}/amend, POST .../tuition-invoices/{id}/resubmit, POST .../reimbursement-claims/{id}/remand"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: one non-terminal (DRAFT or ACTIVE) ReturnTransitionPlan per placement; one FundingClaim per (placement_id, claim_type, fiscal_year) in status ELIGIBLE or SUBMITTED; one TuitionInvoice per attendance_record_id whose verification_status is SUBMITTED or VERIFIED and whose payment_status is not VOIDED"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /ood-placements/return-transition-plans, POST /ood-placements/funding-claims, POST /ood-placements/tuition-invoices"

  - priority: 12
    category: business_constraint
    check: "High-cost eligibility: Placement.paid_total_ytd_cents >= HIGH_COST_TRIGGER_CENTS (4000000) for a HIGH_COST_FUND claim; exactly 4000000 qualifies"
    error_id: ERR_HIGH_COST_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /ood-placements/funding-claims"

  - priority: 12
    category: business_constraint
    check: "Concurrent-placement bar on reimbursement: a ReimbursementClaim may not be adjudicated while any Placement for the same student is in status ACTIVE whose closed [start_date, end_date] interval intersects the claim's closed [unilateral_start_date, unilateral_end_date] interval"
    error_id: ERR_CONCURRENT_DISTRICT_PLACEMENT
    http_status: 409
    applies_to: "POST /ood-placements/reimbursement-claims/{id}/adjudicate"

  - priority: 12
    category: business_constraint
    check: "Equitable basis gate: award_basis == equitable_actual_cost requires the adjudicate call to carry equitable_findings whose trimmed length is >= 30 characters; strict_statutory ignores the field entirely"
    error_id: ERR_EQUITABLE_FINDINGS_REQUIRED
    http_status: 409
    applies_to: "POST /ood-placements/reimbursement-claims/{id}/adjudicate"

  - priority: 12
    category: business_constraint
    check: "Transport billing linkage: invoice.transport_days_billed > 0 requires at least one ACTIVE TransportationAssignment on the invoice's placement at verification time"
    error_id: ERR_TRANSPORT_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /ood-placements/tuition-invoices/{id}/verify"

  - priority: 13
    category: business_fiscal
    check: "Fiscal authority: DistrictFiscalAccount.available_cents >= the encumbrance about to be booked (contract, addendum, transport or transition reserve)"
    error_id: ERR_INSUFFICIENT_FISCAL_AUTHORITY
    http_status: 402
    applies_to: "POST .../placements/{id}/execute-contract, POST .../service-addenda/{id}/authorize, POST .../transportation-assignments, POST .../return-transition-plans/{id}/activate"

  - priority: 13
    category: business_fiscal
    check: "Encumbrance sufficiency: (Placement.contract_encumbrance_cents - Placement.paid_total_ytd_cents) >= TuitionInvoice.verified_amount_cents before payment is approved"
    error_id: ERR_ENCUMBRANCE_EXCEEDED
    http_status: 402
    applies_to: "POST /ood-placements/tuition-invoices/{id}/approve-payment"

  - priority: 13
    category: business_fiscal
    check: "Award disbursement authority: DistrictFiscalAccount.available_cents >= awarded_cents before a reimbursement award is booked"
    error_id: ERR_INSUFFICIENT_FISCAL_AUTHORITY
    http_status: 402
    applies_to: "POST /ood-placements/reimbursement-claims/{id}/adjudicate"

  - priority: 13
    category: business_fiscal
    check: "Per-student high-cost cap: reimbursable_amount_cents may not push the student's fiscal-year HIGH_COST_FUND total above HIGH_COST_MAX_PER_STUDENT_CENTS (5000000); the excess is trimmed rather than rejected, and a claim computing to 0 after the trim is rejected"
    error_id: ERR_HIGH_COST_CAP_EXHAUSTED
    http_status: 402
    applies_to: "POST /ood-placements/funding-claims"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Read surface: 15 single-resource GETs (one per entity, also the canonical
# collection-segment declaration), 15 filtered list GETs (covering every FK in
# §1.1 for reverse reachability), 2 computed reads. All reads are open to all
# seven roles; the entity-backed roles are narrowed at validation priority 6
# (ERR_OUT_OF_SCOPE) rather than by role exclusion, so a SchoolBillingAgent may
# call GET /placements/{id} but only for placements at its own school.
endpoints:

  # ---------------------------------------------------------------- reads: single
  - method: GET
    path: "/ood-placements/fiscal-accounts/{id}"
    description: "Fetch one district fiscal account with its authorized/available/encumbered/disbursed ledger columns."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: DistrictFiscalAccount
    side_effects: []

  - method: GET
    path: "/ood-placements/students/{id}"
    description: "Fetch one student record including high_cost_flag and projected_state_recovery_cents."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/ood-placements/private-schools/{id}"
    description: "Fetch one approved private school including approval_status and version."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: ApprovedPrivateSchool
    side_effects: []

  - method: GET
    path: "/ood-placements/tuition-rate-schedules/{id}"
    description: "Fetch one state-approved tuition rate schedule."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: TuitionRateSchedule
    side_effects: []

  - method: GET
    path: "/ood-placements/placement-decisions/{id}"
    description: "Fetch one placement-team decision record with its LRE documentation and revision_round."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: PlacementDecision
    side_effects: []

  - method: GET
    path: "/ood-placements/placements/{id}"
    description: "Fetch one placement with all four encumbrance components, paid_total_ytd_cents and version."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/ood-placements/service-addenda/{id}"
    description: "Fetch one related-services addendum with its pinned hourly_rate_cents."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: ServiceAddendum
    side_effects: []

  - method: GET
    path: "/ood-placements/transport-routes/{id}"
    description: "Fetch one transport route with seat_capacity, seats_available and seats_committed."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: TransportRoute
    side_effects: []

  - method: GET
    path: "/ood-placements/transportation-assignments/{id}"
    description: "Fetch one transportation assignment with its pickup window and status."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: TransportationAssignment
    side_effects: []

  - method: GET
    path: "/ood-placements/attendance-records/{id}"
    description: "Fetch one 28-day attendance and service-delivery record."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  - method: GET
    path: "/ood-placements/tuition-invoices/{id}"
    description: "Fetch one tuition invoice with both dual-variant amounts, all four billing lines and both status dimensions."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects: []

  - method: GET
    path: "/ood-placements/reimbursement-claims/{id}"
    description: "Fetch one parental unilateral-placement reimbursement claim with eligible/reduction/award columns."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: GET
    path: "/ood-placements/progress-reports/{id}"
    description: "Fetch one quarterly progress-monitoring report."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: ProgressReport
    side_effects: []

  - method: GET
    path: "/ood-placements/return-transition-plans/{id}"
    description: "Fetch one return-to-district transition plan with its stored readiness_score and readiness_variant."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: ReturnTransitionPlan
    side_effects: []

  - method: GET
    path: "/ood-placements/funding-claims/{id}"
    description: "Fetch one state high-cost-fund or Medicaid reimbursement claim."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: FundingClaim
    side_effects: []

  # ------------------------------------------------------------------ reads: lists
  - method: GET
    path: "/ood-placements/fiscal-accounts"
    description: "List district fiscal accounts, ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: DistrictFiscalAccount[]
    side_effects: []

  - method: GET
    path: "/ood-placements/students"
    description: "List students, ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["high_cost_flag?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: GET
    path: "/ood-placements/private-schools"
    description: "List approved private schools, ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["approval_status?", "limit?", "offset?"]
    output: ApprovedPrivateSchool[]
    side_effects: []

  - method: GET
    path: "/ood-placements/tuition-rate-schedules"
    description: "List tuition rate schedules; filter by school_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["school_id?", "fiscal_year?", "approval_state?", "limit?", "offset?"]
    output: TuitionRateSchedule[]
    side_effects: []

  - method: GET
    path: "/ood-placements/placement-decisions"
    description: "List placement-team decisions; filter by student_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: PlacementDecision[]
    side_effects: []

  - method: GET
    path: "/ood-placements/placements"
    description: "List placements; filter by any of student_id, school_id, decision_id, rate_schedule_id, fiscal_account_id or prior_placement_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["student_id?", "school_id?", "decision_id?", "rate_schedule_id?", "fiscal_account_id?", "prior_placement_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: GET
    path: "/ood-placements/service-addenda"
    description: "List related-services addenda; filter by placement_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "status?", "limit?", "offset?"]
    output: ServiceAddendum[]
    side_effects: []

  - method: GET
    path: "/ood-placements/transport-routes"
    description: "List transport routes, ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TransportRoute[]
    side_effects: []

  - method: GET
    path: "/ood-placements/transportation-assignments"
    description: "List transportation assignments; filter by placement_id or route_id for FK reverse lookup. Ordered created_at ASC — this is the only channel through which a waitlist-promoted assignment can be discovered."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "route_id?", "status?", "limit?", "offset?"]
    output: TransportationAssignment[]
    side_effects: []

  - method: GET
    path: "/ood-placements/attendance-records"
    description: "List attendance records; filter by placement_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "status?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []

  - method: GET
    path: "/ood-placements/tuition-invoices"
    description: "List tuition invoices; filter by placement_id or attendance_record_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "attendance_record_id?", "verification_status?", "payment_status?", "limit?", "offset?"]
    output: TuitionInvoice[]
    side_effects: []

  - method: GET
    path: "/ood-placements/reimbursement-claims"
    description: "List reimbursement claims; filter by student_id, superseding_placement_id or fiscal_account_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["student_id?", "superseding_placement_id?", "fiscal_account_id?", "status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: GET
    path: "/ood-placements/progress-reports"
    description: "List quarterly progress reports; filter by placement_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: ProgressReport[]
    side_effects: []

  - method: GET
    path: "/ood-placements/return-transition-plans"
    description: "List return-to-district transition plans; filter by placement_id for FK reverse lookup. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "status?", "limit?", "offset?"]
    output: ReturnTransitionPlan[]
    side_effects: []

  - method: GET
    path: "/ood-placements/funding-claims"
    description: "List state high-cost-fund and Medicaid claims; filter by placement_id for FK reverse lookup. This is the only channel through which the FundingClaim auto-created by CASCADE-B LINK 3 can be discovered. Ordered created_at ASC."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["placement_id?", "claim_type?", "status?", "fiscal_year?", "source?", "limit?", "offset?"]
    output: FundingClaim[]
    side_effects: []

  # --------------------------------------------------------------- reads: computed
  - method: GET
    path: "/ood-placements/placements/{id}/cost-projection"
    description: "Computed read. Projects the annual cost of a placement under the requested variant; defaults to CONTRACTED_ENCUMBRANCE when variant is omitted."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["variant?"]
    output:
      placement_id: string
      variant: string
      projected_annual_cents: integer
      remaining_commitment_cents: integer
      variance_cents: integer
      periods_paid: integer
    side_effects: []

  - method: GET
    path: "/ood-placements/return-transition-plans/{id}/readiness"
    description: "Computed read. Evaluates return_readiness_score under the requested variant without mutating the plan; defaults to trailing_two_quarter when variant is omitted."
    roles: [PlacementCoordinator, TeamChair, FiscalOfficer, SchoolBillingAgent, ParentGuardian, HearingAdjudicator, SystemAdmin]
    code: 200
    input: ["variant?"]
    output:
      plan_id: string
      variant: string
      readiness_score: number
      accepted_report_count: integer
      readiness_met: boolean
      report_scores: array
    side_effects: []

  # ------------------------------------------------------------- writes: test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to an arbitrary instant so contract-activation grace expiry, billing-window rules and notice-day arithmetic are deterministic. MANDATORY STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock past Placement.start_date + CONTRACT_ACTIVATION_GRACE_DAYS (30) while a placement is CONTRACTED drives that placement to EXPIRED as a system transition."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Placement CONTRACTED->EXPIRED for every placement whose activation grace window has elapsed, releasing its encumbrances back to DistrictFiscalAccount.available_cents"]

  # ----------------------------------------------------------------- writes: setup
  - method: POST
    path: "/ood-placements/fiscal-accounts"
    description: "Open a district fiscal account for a fiscal year with an authorized appropriation."
    roles: [FiscalOfficer, SystemAdmin]
    code: 201
    input: [fiscal_year, account_code, authorized_cents]
    output: DistrictFiscalAccount
    side_effects: ["available_cents = authorized_cents; encumbered_cents = 0; disbursed_cents = 0"]

  - method: POST
    path: "/ood-placements/students"
    description: "Register a student with an active IEP as a candidate for out-of-district placement."
    roles: [PlacementCoordinator, SystemAdmin]
    code: 201
    input: ["state_student_id", "full_name", "district_of_residence", "disability_category", "iep_effective_date", "lre_current_setting", "medicaid_eligible?", "medicaid_consent_on_file?"]
    output: Student
    side_effects: ["placement_status = NONE; high_cost_flag = false; projected_state_recovery_cents = 0"]

  - method: PATCH
    path: "/ood-placements/students/{id}/medicaid-consent"
    description: "Record or withdraw the parent's Medicaid billing consent. Withdrawing consent does not retroact against FundingClaim rows already SUBMITTED."
    roles: [ParentGuardian, PlacementCoordinator, SystemAdmin]
    code: 200
    input: [medicaid_eligible, medicaid_consent_on_file]
    output: Student
    side_effects: ["Student.version += 1"]

  - method: POST
    path: "/ood-placements/private-schools"
    description: "Register an approved private special-education school. approval_status defaults to PROVISIONAL when omitted."
    roles: [SystemAdmin]
    code: 201
    input: ["name", "state_approval_id", "approval_status?", "residential_capable?", "medicaid_provider_number?"]
    output: ApprovedPrivateSchool
    side_effects: ["active_rate_schedule_id = null"]

  - method: PATCH
    path: "/ood-placements/private-schools/{id}/approval-status"
    description: "Move a school between PROVISIONAL, APPROVED and REVOKED. REVOKED blocks Placement activation at validation priority 11 but does NOT retroactively terminate placements already ACTIVE."
    roles: [SystemAdmin]
    code: 200
    input: [approval_status]
    output: ApprovedPrivateSchool
    side_effects: ["ApprovedPrivateSchool.version += 1 (which invalidates any in-flight expected_school_version)"]

  - method: POST
    path: "/ood-placements/tuition-rate-schedules"
    description: "Publish a tuition rate schedule for a school and fiscal year. Creating one with approval_state == STATE_APPROVED supersedes the school's prior STATE_APPROVED schedule for the same fiscal year (SM11) and repoints active_rate_schedule_id. Guarded by OCC on the school's version."
    roles: [FiscalOfficer, SystemAdmin]
    code: 201
    input: [school_id, fiscal_year, day_rate_cents, residential_rate_cents, service_hourly_rate_cents, effective_from, effective_to, approval_state, expected_school_version]
    output: TuitionRateSchedule
    side_effects:
      - "prior STATE_APPROVED schedule for the same (school_id, fiscal_year) -> SUPERSEDED with superseded_by_schedule_id set"
      - "ApprovedPrivateSchool.active_rate_schedule_id repointed; ApprovedPrivateSchool.version += 1"
      - "Already-CONTRACTED placements keep their pinned rate_schedule_id and are not repriced"

  - method: POST
    path: "/ood-placements/transport-routes"
    description: "Create a transport route with a fixed seat capacity and daily rate."
    roles: [PlacementCoordinator, SystemAdmin]
    code: 201
    input: [route_code, seat_capacity, daily_rate_cents, service_window_start_min, service_window_end_min]
    output: TransportRoute
    side_effects: ["seats_available = seat_capacity; seats_committed = 0 (the invariant seat_capacity == seats_available + seats_committed holds from creation)"]

  # ---------------------------------------------------- writes: decision & placement
  - method: POST
    path: "/ood-placements/placement-decisions"
    description: "Open a placement-team decision record in DRAFT. authored_by_user_id is captured from X-User-ID and is immutable thereafter, which is what makes the approve-step segregation of duties enforceable."
    roles: [PlacementCoordinator, TeamChair]
    code: 201
    input: [student_id, lre_justification, continuum_options_considered, recommended_placement_type]
    output: PlacementDecision
    side_effects: ["status = DRAFT; authored_by_user_id = X-User-ID; revision_round = 0"]

  - method: PATCH
    path: "/ood-placements/placement-decisions/{id}"
    description: "Revise the LRE documentation on a decision in DRAFT or RETURNED_FOR_REVISION. Rejected from TEAM_REVIEW and from the terminal APPROVED state."
    roles: [PlacementCoordinator, TeamChair]
    code: 200
    input: ["lre_justification?", "continuum_options_considered?", "recommended_placement_type?"]
    output: PlacementDecision
    side_effects: ["PlacementDecision.version += 1"]

  - method: POST
    path: "/ood-placements/placement-decisions/{id}/submit"
    description: "Submit a DRAFT or RETURNED_FOR_REVISION decision for team review. Enforces LRE documentation completeness."
    roles: [PlacementCoordinator, TeamChair]
    code: 200
    input: []
    output: PlacementDecision
    side_effects: ["status = TEAM_REVIEW; submitted_at = logical clock now"]

  - method: POST
    path: "/ood-placements/placement-decisions/{id}/return-for-revision"
    description: "Send a decision under TEAM_REVIEW back for revision, incrementing revision_round. The cycle is bounded by MAX_REVISION_ROUNDS (3)."
    roles: [TeamChair]
    code: 200
    input: [reviewer_notes]
    output: PlacementDecision
    side_effects: ["status = RETURNED_FOR_REVISION; revision_round += 1; reviewer_notes stored"]

  - method: POST
    path: "/ood-placements/placement-decisions/{id}/approve"
    description: "Approve a decision under TEAM_REVIEW. Terminal. Requires X-User-ID != authored_by_user_id."
    roles: [TeamChair]
    code: 200
    input: ["reviewer_notes?"]
    output: PlacementDecision
    side_effects: ["status = APPROVED; reviewed_by_user_id = X-User-ID; decided_at = logical clock now"]

  - method: POST
    path: "/ood-placements/placements"
    description: "Propose an out-of-district placement against an APPROVED decision and a STATE_APPROVED rate schedule. prior_placement_id, when supplied, links this placement to the one it replaces (self-referential chain)."
    roles: [PlacementCoordinator]
    code: 201
    input: ["student_id", "school_id", "decision_id", "rate_schedule_id", "fiscal_account_id", "prior_placement_id?", "placement_type", "start_date", "end_date", "contracted_instructional_days", "contracted_residential_nights?", "transportation_required?"]
    output: Placement
    side_effects: ["status = PROPOSED; all four encumbrance components = 0; paid_total_ytd_cents = 0; transport_status = NOT_REQUIRED (PROPOSED->CONTRACTED flips it to PENDING when transportation_required == true)"]

  - method: POST
    path: "/ood-placements/placements/{id}/execute-contract"
    description: "Execute the tuition contract, booking the placement's contract encumbrance against the district fiscal account. Fails with ERR_INSUFFICIENT_FISCAL_AUTHORITY (402) when the account cannot cover it -- but only after every state, safety and constraint check has passed."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "placement_encumbrance calculation runs; contract_encumbrance_cents written"
      - "encumbrance_cents recomputed; status = CONTRACTED; contract_executed_at = logical clock now"
      - "DistrictFiscalAccount.available_cents -= contract_encumbrance_cents; encumbered_cents += contract_encumbrance_cents; version += 1"
      - "Placement.version += 1 (which invalidates any in-flight expected_placement_version)"

  - method: POST
    path: "/ood-placements/placements/{id}/activate"
    description: "Activate a CONTRACTED placement on or after its start_date. Requires the school to be APPROVED at this instant, so a school REVOKED between contract execution and activation blocks the transition."
    roles: [PlacementCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["status = ACTIVE; activated_at = logical clock now; Student.placement_status = OOD_ACTIVE; Student.version += 1; Placement.version += 1"]

  - method: POST
    path: "/ood-placements/placements/{id}/terminate"
    description: "Terminate an ACTIVE placement. Fires CASCADE-A: addenda TERMINATED, transportation released with waitlist promotion on the freed route, transition plan ABANDONED, unpaid invoices VOIDED, and every encumbrance released back to the fiscal account."
    roles: [PlacementCoordinator]
    code: 200
    input: [termination_reason]
    output: Placement
    side_effects:
      - "CASCADE-A LINK 0..LINK 9 exactly as enumerated in SM2"
      - "released_encumbrance_cents recorded; contract_encumbrance_cents = paid_total_ytd_cents so remaining commitment reaches exactly zero"
      - "DistrictFiscalAccount identity authorized_cents == available_cents + encumbered_cents + disbursed_cents preserved"

  - method: POST
    path: "/ood-placements/placements/{id}/return-to-district"
    description: "Close an ACTIVE placement by returning the student to district. Requires an ACTIVE ReturnTransitionPlan. The fork sibling of terminate: addenda go TRANSFERRED not TERMINATED, the transition plan COMPLETES and retains its reserve, and DISPUTED unpaid invoices are NOT voided."
    roles: [PlacementCoordinator]
    code: 200
    input: [return_reason, receiving_lre_setting]
    output: Placement
    side_effects:
      - "status = RETURNED_TO_DISTRICT; ServiceAddendum ACTIVE -> TRANSFERRED; ReturnTransitionPlan ACTIVE -> COMPLETED with reserve RETAINED"
      - "Student.placement_status = RETURNED and Student.lre_current_setting = request receiving_lre_setting; unpaid DISPUTED invoices left standing for later settlement"

  # ------------------------------------------- writes: services, transport, billing
  - method: POST
    path: "/ood-placements/service-addenda"
    description: "Propose a related-services addendum (speech, OT, PT, counselling, 1:1 aide) on a placement. The rate is NOT pinned until authorization."
    roles: [PlacementCoordinator]
    code: 201
    input: ["placement_id", "service_type", "authorized_hours_per_week", "contract_weeks", "medicaid_billable?"]
    output: ServiceAddendum
    side_effects: ["status = PROPOSED; hourly_rate_cents = 0; encumbrance_cents = 0"]

  - method: POST
    path: "/ood-placements/service-addenda/{id}/authorize"
    description: "Authorize a PROPOSED addendum, pinning hourly_rate_cents from the placement's rate schedule and booking its encumbrance."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: ServiceAddendum
    side_effects:
      - "service_addendum_encumbrance calculation runs; hourly_rate_cents pinned; status = ACTIVE"
      - "Placement.addendum_encumbrance_cents += encumbrance_cents; Placement.encumbrance_cents recomputed; Placement.version += 1"
      - "DistrictFiscalAccount.available_cents -= encumbrance_cents; encumbered_cents += encumbrance_cents; version += 1"

  - method: POST
    path: "/ood-placements/transportation-assignments"
    description: "Request transportation for a placement on a route. Resolves immediately to ACTIVE when a seat is free and the pickup window does not collide, or to WAITLISTED when the route has no seat left. Seat exhaustion waitlists rather than erroring; a window collision on an ACTIVE seat is a hard 409."
    roles: [PlacementCoordinator]
    code: 201
    input: [placement_id, route_id, pickup_window_start_min, pickup_window_end_min, days_per_week, contract_weeks]
    output: TransportationAssignment
    side_effects:
      - "when a seat is free: status = ACTIVE, transport_encumbrance calculation runs, TransportRoute.seats_committed += 1 and seats_available -= 1, Placement.transport_encumbrance_cents and transport_status updated, fiscal account encumbered"
      - "when no seat is free: status = WAITLISTED, encumbrance_cents = 0, no seat and no money move"

  - method: POST
    path: "/ood-placements/transportation-assignments/{id}/release"
    description: "Release an ACTIVE or WAITLISTED assignment. Releasing an ACTIVE seat frees it and runs the waitlist_promotion selector, which promotes at most one WAITLISTED assignment on that route -- or none at all, with a 200, when the candidate set is empty."
    roles: [PlacementCoordinator]
    code: 200
    input: []
    output: TransportationAssignment
    side_effects:
      - "status = RELEASED; encumbrance released from Placement.transport_encumbrance_cents and the fiscal account"
      - "TransportRoute.seats_committed -= 1 and seats_available += 1 (ACTIVE only)"
      - "waitlist_promotion selector runs; the promoted assignment goes WAITLISTED -> ACTIVE with promoted_at set, books its own encumbrance, and re-consumes the seat"

  - method: POST
    path: "/ood-placements/attendance-records"
    description: "Submit a 28-day attendance and service-delivery record for an ACTIVE placement. This is the school's assertion of days enrolled, days attended and related-service hours delivered; it is the sole factual input to invoice verification."
    roles: [SchoolBillingAgent, PlacementCoordinator]
    code: 201
    input: ["placement_id", "period_start", "period_end", "days_enrolled", "days_attended", "days_absent_unexcused", "residential_nights?", "service_delivery_lines?"]
    output: AttendanceRecord
    side_effects: ["status = SUBMITTED; amendment_round = 0"]

  - method: POST
    path: "/ood-placements/attendance-records/{id}/verify"
    description: "District verification of a SUBMITTED attendance record. decision == ACCEPT moves it to the terminal VERIFIED state and rolls delivered_hours_ytd forward on every named addendum; decision == DISPUTE moves it to DISPUTED for amendment."
    roles: [PlacementCoordinator]
    code: 200
    input: ["decision", "dispute_reason?"]
    output: AttendanceRecord
    side_effects:
      - "ACCEPT: status = VERIFIED, verified_by_user_id = X-User-ID, each named ServiceAddendum.delivered_hours_ytd += that line's hours_delivered and version += 1"
      - "DISPUTE: status = DISPUTED, no delivered_hours_ytd movement"

  - method: POST
    path: "/ood-placements/attendance-records/{id}/amend"
    description: "School amends a DISPUTED record, returning it to SUBMITTED and incrementing amendment_round. Bounded by MAX_AMENDMENT_ROUNDS (2)."
    roles: [SchoolBillingAgent]
    code: 200
    input: ["days_enrolled", "days_attended", "days_absent_unexcused", "residential_nights?", "service_delivery_lines?"]
    output: AttendanceRecord
    side_effects: ["status = SUBMITTED; amendment_round += 1; the same period-shape and overlap validations re-run"]

  - method: POST
    path: "/ood-placements/tuition-invoices"
    description: "School submits a tuition invoice for a verified billing period. Guarded by OCC on the placement's version, because the placement's rate pin, transport status and paid-to-date figure all change how the invoice will later be verified."
    roles: [SchoolBillingAgent, FiscalOfficer]
    code: 201
    input: ["placement_id", "attendance_record_id", "billing_period_start", "billing_period_end", "submitted_amount_cents", "transport_days_billed?", "expected_placement_version"]
    output: TuitionInvoice
    side_effects: ["verification_status = SUBMITTED; payment_status = UNPAID; resubmission_round = 0; all computed line and amount fields = 0 until verification"]

  - method: POST
    path: "/ood-placements/tuition-invoices/{id}/verify"
    description: "Verify a SUBMITTED invoice against the attendance record. Runs invoice_verified_amount under BOTH bases and stores both provisional_amount_cents and final_amount_cents; the basis input selects which becomes verified_amount_cents. Auto-branches to DISPUTED when variance_pct exceeds VARIANCE_TOLERANCE_PCT (0.02)."
    roles: [PlacementCoordinator, FiscalOfficer]
    code: 200
    input: [basis]
    output: TuitionInvoice
    side_effects:
      - "verification_basis = basis; all four line fields, gross_billable_cents, volume_credit_cents, admin_fee_cents, provisional_amount_cents, final_amount_cents, verified_amount_cents and variance_pct written"
      - "verification_status = VERIFIED (terminal for dimension 1) or DISPUTED; verified_by_user_id = X-User-ID on the VERIFIED branch"

  - method: POST
    path: "/ood-placements/tuition-invoices/{id}/resubmit"
    description: "School corrects a DISPUTED invoice, returning it to SUBMITTED and incrementing resubmission_round. Bounded by MAX_RESUBMISSION_ROUNDS (2)."
    roles: [SchoolBillingAgent]
    code: 200
    input: ["submitted_amount_cents", "transport_days_billed?"]
    output: TuitionInvoice
    side_effects: ["verification_status = SUBMITTED; resubmission_round += 1; verified_by_user_id cleared"]

  - method: POST
    path: "/ood-placements/tuition-invoices/{id}/approve-payment"
    description: "Approve payment on a VERIFIED, UNPAID invoice. Fires CASCADE-B: fiscal account disbursement, placement paid-to-date rollup, automatic HIGH_COST_FUND FundingClaim when the cumulative threshold is crossed, and the student's high_cost_flag. Requires X-User-ID != verified_by_user_id."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects:
      - "CASCADE-B LINK 0..LINK 4 exactly as enumerated in SM6"
      - "payment_status = PAID; settled_amount_cents = verified_amount_cents; approved_by_user_id = X-User-ID"
      - "DistrictFiscalAccount.encumbered_cents -= settled_amount_cents and disbursed_cents += settled_amount_cents (available_cents unchanged, so the fiscal identity holds)"

  # -------------------------------- writes: reimbursement, progress, return, funding
  - method: POST
    path: "/ood-placements/reimbursement-claims"
    description: "Parent files a reimbursement claim for a unilateral private placement. superseding_placement_id, when supplied, names the district placement the parent rejected."
    roles: [ParentGuardian, PlacementCoordinator]
    code: 201
    input: ["student_id", "fiscal_account_id", "superseding_placement_id?", "unilateral_school_name", "claimed_tuition_cents", "claimed_transport_cents", "claimed_instructional_days", "notice_date", "unilateral_start_date", "unilateral_end_date", "prior_district_offer_date?", "parent_cooperation?"]
    output: ReimbursementClaim
    side_effects: ["status = FILED; remand_round = 0; parent_cooperation defaults to true when omitted"]

  - method: POST
    path: "/ood-placements/reimbursement-claims/{id}/adjudicate"
    description: "Hearing officer adjudicates a FILED or REMANDED claim. award_basis selects strict_statutory (day-rate ceiling binds) or equitable_actual_cost (ceiling waived, requires equitable_findings >= 30 characters). Blocked while a concurrent ACTIVE district placement overlaps the claimed window."
    roles: [HearingAdjudicator]
    code: 200
    input: ["award_basis", "equitable_findings?"]
    output: ReimbursementClaim
    side_effects:
      - "reimbursement_award calculation runs; award_basis, eligible_amount_cents, equitable_reduction_pct, awarded_tuition_cents, awarded_transport_cents and awarded_amount_cents written"
      - "status = AWARDED_FULL | AWARDED_PARTIAL | DENIED"
      - "on any award > 0: DistrictFiscalAccount.available_cents -= awarded_amount_cents and disbursed_cents += awarded_amount_cents; version += 1"

  - method: POST
    path: "/ood-placements/reimbursement-claims/{id}/remand"
    description: "Remand an AWARDED_PARTIAL or DENIED claim for re-adjudication, incrementing remand_round. The exact compensating action: any prior award is reversed cent-for-cent on the fiscal account so the conservation identity is restored. Bounded by MAX_REMAND_ROUNDS (2)."
    roles: [HearingAdjudicator]
    code: 200
    input: [remand_reason]
    output: ReimbursementClaim
    side_effects:
      - "status = REMANDED; remand_round += 1; all award columns reset to 0 and award_basis cleared"
      - "DistrictFiscalAccount.disbursed_cents -= the reversed awarded_amount_cents and available_cents += the same figure; version += 1"

  - method: POST
    path: "/ood-placements/progress-reports"
    description: "School submits a quarterly progress-monitoring report against the student's IEP goals. report_score is computed at submission but only ACCEPTED reports feed return_readiness_score."
    roles: [SchoolBillingAgent, PlacementCoordinator]
    code: 201
    input: [placement_id, fiscal_year, quarter, goals_total, goals_met, goals_regressed, benchmark_scaled_score, attendance_rate_pct]
    output: ProgressReport
    side_effects: ["status = SUBMITTED; report_score computed by the return_readiness_score per-report step"]

  - method: POST
    path: "/ood-placements/progress-reports/{id}/accept"
    description: "District accepts or rejects a SUBMITTED progress report. decision == ACCEPT admits it to the readiness input set; decision == REJECT permanently excludes it."
    roles: [PlacementCoordinator, TeamChair]
    code: 200
    input: [decision]
    output: ProgressReport
    side_effects: ["status = ACCEPTED or REJECTED (both terminal); the placement's readiness computation changes on the ACCEPT branch only"]

  - method: POST
    path: "/ood-placements/return-transition-plans"
    description: "Draft a return-to-district transition plan for an ACTIVE placement. Only one non-terminal plan may exist per placement."
    roles: [PlacementCoordinator, TeamChair]
    code: 201
    input: [placement_id, target_return_date, receiving_program]
    output: ReturnTransitionPlan
    side_effects: ["status = DRAFT; transition_services = []; reserve_cents = 0; readiness_score_at_activation = null"]

  - method: POST
    path: "/ood-placements/return-transition-plans/{id}/activate"
    description: "Activate a DRAFT plan, committing transition services and reserving TRANSITION_SERVICES_RESERVE_CENTS (250000). Gated by both the safety check (transition_services non-empty, target_return_date not in the past) at priority 11 and the readiness gate (>= 2 ACCEPTED reports and score >= 62.50 under readiness_variant) at priority 12, in that order."
    roles: [TeamChair]
    code: 200
    input: ["transition_services", "readiness_variant?"]
    output: ReturnTransitionPlan
    side_effects:
      - "return_readiness_score calculation runs under readiness_variant (default trailing_two_quarter); readiness_score_at_activation written"
      - "status = ACTIVE; transition_services stored verbatim; reserve_cents = TRANSITION_SERVICES_RESERVE_CENTS"
      - "Placement.transition_reserve_cents += reserve_cents; Placement.encumbrance_cents recomputed; Placement.version += 1"
      - "DistrictFiscalAccount.available_cents -= reserve_cents; encumbered_cents += reserve_cents; version += 1"

  - method: POST
    path: "/ood-placements/funding-claims"
    description: "File a state high-cost-fund or Medicaid reimbursement claim against a placement. HIGH_COST_FUND requires paid_total_ytd_cents >= HIGH_COST_TRIGGER_CENTS (4000000) -- exactly 4000000 qualifies. MEDICAID derives its hours from VERIFIED attendance service lines on medicaid_billable addenda and requires parental consent."
    roles: [FiscalOfficer]
    code: 201
    input: [placement_id, claim_type, fiscal_year]
    output: FundingClaim
    side_effects:
      - "funding_claim_reimbursable calculation runs; eligible_base_cents, billable_service_hours, tier_rate and reimbursable_amount_cents written"
      - "status = ELIGIBLE; source = MANUAL (CASCADE-B-created claims carry source = AUTO_CASCADE instead)"
      - "Student.projected_state_recovery_cents += reimbursable_amount_cents; Student.version += 1"

  - method: POST
    path: "/ood-placements/funding-claims/{id}/submit-to-state"
    description: "Submit an ELIGIBLE funding claim to the state, recording the state's claim reference. Terminal. Re-checks Medicaid consent at submission time."
    roles: [FiscalOfficer]
    code: 200
    input: [state_claim_reference]
    output: FundingClaim
    side_effects: ["status = SUBMITTED; submitted_at = logical clock now; state_claim_reference stored"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth (priority 1-2, 6)
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role or X-User-ID header missing, empty, or X-Role not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting X-Role is not listed in the target endpoint's roles."
  - id: ERR_OUT_OF_SCOPE
    http: 403
    condition: "A SchoolBillingAgent addressed a row belonging to a different ApprovedPrivateSchool, or a ParentGuardian addressed a row belonging to a different Student."

  # ---- existence (priority 3, 5)
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in path or body names no Student."
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school_id in path or body names no ApprovedPrivateSchool."
  - id: ERR_RATE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "rate_schedule_id in path or body names no TuitionRateSchedule."
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "decision_id in path or body names no PlacementDecision."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id, prior_placement_id or superseding_placement_id names no Placement."
  - id: ERR_ADDENDUM_NOT_FOUND
    http: 404
    condition: "An addendum id in the path, or a service_addendum_id inside service_delivery_lines, names no ServiceAddendum."
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route_id names no TransportRoute."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The path id names no TransportationAssignment."
  - id: ERR_ATTENDANCE_RECORD_NOT_FOUND
    http: 404
    condition: "attendance_record_id in path or body names no AttendanceRecord."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "The path id names no TuitionInvoice."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The path id names no ReimbursementClaim."
  - id: ERR_PROGRESS_REPORT_NOT_FOUND
    http: 404
    condition: "The path id names no ProgressReport."
  - id: ERR_TRANSITION_PLAN_NOT_FOUND
    http: 404
    condition: "The path id names no ReturnTransitionPlan."
  - id: ERR_FUNDING_CLAIM_NOT_FOUND
    http: 404
    condition: "The path id names no FundingClaim."
  - id: ERR_FISCAL_ACCOUNT_NOT_FOUND
    http: 404
    condition: "fiscal_account_id in path or body names no DistrictFiscalAccount."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, enum value outside its declared set, negative integer where >= 0 required, malformed date, monetary amount supplied as a decimal string instead of integer cents, or hours_delivered not in 0.25 increments."

  # ---- concurrency (priority 7)
  - id: ERR_STALE_PLACEMENT_VERSION
    http: 412
    condition: "expected_placement_version on POST /ood-placements/tuition-invoices does not equal the placement's current version."
  - id: ERR_STALE_SCHOOL_VERSION
    http: 412
    condition: "expected_school_version on POST /ood-placements/tuition-rate-schedules does not equal the school's current version."

  # ---- state (priority 8)
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the row's current state in §1.2, including any attempt from a terminal state and any second invocation of a transition already taken."

  # ---- business_referential (priority 9)
  - id: ERR_ATTENDANCE_PLACEMENT_MISMATCH
    http: 409
    condition: "The named AttendanceRecord's placement_id differs from the invoice's placement_id."
  - id: ERR_PLACEMENT_LINKAGE_MISMATCH
    http: 409
    condition: "The named PlacementDecision belongs to a different student, or the named TuitionRateSchedule belongs to a different school, than the placement being created."
  - id: ERR_ADDENDUM_PLACEMENT_MISMATCH
    http: 409
    condition: "A service_delivery_lines entry names a ServiceAddendum on a different placement, or one whose status is not ACTIVE."
  - id: ERR_FUNDING_CLAIM_LINKAGE_MISMATCH
    http: 409
    condition: "The funding claim's fiscal_year differs from the fiscal_year of the placement's pinned rate schedule, or the placement's contract was never executed."

  # ---- business_temporal (priority 10)
  - id: ERR_BILLING_PERIOD_SHAPE
    http: 409
    condition: "period_end is not period_start + BILLING_CYCLE_DAYS - 1, or days_enrolled + days_absent_unexcused exceeds BILLING_CYCLE_DAYS, or residential_nights exceeds BILLING_CYCLE_DAYS, or days_attended exceeds days_enrolled."
  - id: ERR_PERIOD_OUTSIDE_PLACEMENT
    http: 409
    condition: "The attendance period is not entirely inside the placement's [start_date, end_date] window."
  - id: ERR_DUPLICATE_BILLING_PERIOD
    http: 409
    condition: "Another AttendanceRecord for the same placement in status SUBMITTED, VERIFIED or DISPUTED shares the period_start or overlaps the closed period interval."
  - id: ERR_RATE_SCHEDULE_NOT_EFFECTIVE
    http: 409
    condition: "The pinned rate schedule is not STATE_APPROVED, or the placement's start_date falls outside [effective_from, effective_to]."
  - id: ERR_INVALID_PLACEMENT_WINDOW
    http: 409
    condition: "end_date is not after start_date, or start_date precedes the current logical clock date."
  - id: ERR_DUPLICATE_PROGRESS_PERIOD
    http: 409
    condition: "A ProgressReport for the same placement, fiscal_year and quarter already exists in status SUBMITTED or ACCEPTED, or quarter is outside 1..4."

  # ---- business_safety (priority 11)
  - id: ERR_LRE_DOCUMENTATION_INCOMPLETE
    http: 409
    condition: "At submit time the LRE justification is shorter than 40 trimmed characters, fewer than MIN_CONTINUUM_OPTIONS (3) continuum options are recorded, an option is missing its setting or rejected_reason, or recommended_placement_type is unset."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The approving X-User-ID equals the decision's authored_by_user_id, or the payment-approving X-User-ID equals the invoice's verified_by_user_id."
  - id: ERR_RESIDENTIAL_NOT_AUTHORIZED
    http: 409
    condition: "A RESIDENTIAL placement whose decision did not recommend RESIDENTIAL, or whose school is not residential_capable."
  - id: ERR_MEDICAID_CONSENT_MISSING
    http: 409
    condition: "A MEDICAID funding claim on a student who is not medicaid_eligible or has no medicaid_consent_on_file, at create or at submit-to-state."
  - id: ERR_ATTENDANCE_NOT_VERIFIED
    http: 409
    condition: "Invoice verification or payment approval attempted while the linked AttendanceRecord is SUBMITTED or DISPUTED rather than VERIFIED."
  - id: ERR_SCHOOL_NOT_APPROVED
    http: 409
    condition: "Placement activation attempted while the school's approval_status is PROVISIONAL or REVOKED."
  - id: ERR_TRANSITION_SERVICES_INCOMPLETE
    http: 409
    condition: "Plan activation attempted with an empty transition_services array, an entry that is blank, or a target_return_date before the current logical clock date."

  # ---- business_constraint (priority 12)
  - id: ERR_PLACEMENT_DATE_OVERLAP
    http: 409
    condition: "The new placement's closed [start_date, end_date] interval intersects that of another PROPOSED, CONTRACTED or ACTIVE placement for the same student."
  - id: ERR_TRANSPORT_WINDOW_OVERLAP
    http: 409
    condition: "The assignment's half-open [pickup_window_start_min, pickup_window_end_min + TURNAROUND_BUFFER_MIN) interval intersects that of another ACTIVE assignment on the same route, or the window falls outside the route's service window."
  - id: ERR_RETURN_READINESS_NOT_MET
    http: 409
    condition: "Fewer than MIN_ACCEPTED_REPORTS (2) ACCEPTED progress reports on the placement, or a readiness score below RETURN_READINESS_MIN (62.50) under the requested variant."
  - id: ERR_MAX_ROUNDS_EXCEEDED
    http: 409
    condition: "revision_round, amendment_round, resubmission_round or remand_round has already reached its bound, so the cyclic transition may not be taken again."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A second non-terminal ReturnTransitionPlan on a placement, a second FundingClaim for the same (placement_id, claim_type, fiscal_year) in ELIGIBLE or SUBMITTED, or a second live TuitionInvoice for the same attendance_record_id."
  - id: ERR_HIGH_COST_THRESHOLD_NOT_MET
    http: 409
    condition: "A HIGH_COST_FUND claim on a placement whose paid_total_ytd_cents is strictly below HIGH_COST_TRIGGER_CENTS (4000000)."
  - id: ERR_CONCURRENT_DISTRICT_PLACEMENT
    http: 409
    condition: "Adjudication attempted while an ACTIVE district placement for the same student overlaps the claimed unilateral window."
  - id: ERR_EQUITABLE_FINDINGS_REQUIRED
    http: 409
    condition: "award_basis == equitable_actual_cost supplied without equitable_findings of at least 30 trimmed characters."
  - id: ERR_TRANSPORT_NOT_ASSIGNED
    http: 409
    condition: "Invoice verification with transport_days_billed > 0 while the placement has no ACTIVE TransportationAssignment."

  # ---- business_fiscal (priority 13)
  - id: ERR_INSUFFICIENT_FISCAL_AUTHORITY
    http: 402
    condition: "DistrictFiscalAccount.available_cents cannot cover the encumbrance or award about to be booked."
  - id: ERR_ENCUMBRANCE_EXCEEDED
    http: 402
    condition: "The invoice's verified_amount_cents exceeds the placement's remaining commitment (contract_encumbrance_cents - paid_total_ytd_cents)."
  - id: ERR_HIGH_COST_CAP_EXHAUSTED
    http: 402
    condition: "The student's fiscal-year HIGH_COST_FUND recoveries already sit at HIGH_COST_MAX_PER_STUDENT_CENTS (5000000), so the new claim computes to zero after the cap trim."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# Role model: segregation_of_duties. Two independent SOD pairs are enforced by
# X-User-ID comparison rather than by role: (a) authoring vs approving a
# placement decision, (b) verifying vs approving payment on a tuition invoice.
# Both pairs are performed by a SINGLE role (TeamChair, FiscalOfficer), so the
# constraint cannot be satisfied by role separation alone -- a second human
# holding the same role is required.
roles:
  - name: PlacementCoordinator
    description: "District placement-office case manager. Owns the operational lifecycle: students, decisions in draft, placements, service addenda, transportation, attendance verification, progress-report acceptance and transition-plan drafting."
    identity: opaque
    exclusive_operations:
      - "POST /ood-placements/placements"
      - "POST /ood-placements/placements/{id}/activate"
      - "POST /ood-placements/placements/{id}/terminate"
      - "POST /ood-placements/placements/{id}/return-to-district"
      - "POST /ood-placements/service-addenda"
      - "POST /ood-placements/transportation-assignments"
      - "POST /ood-placements/transportation-assignments/{id}/release"
      - "POST /ood-placements/attendance-records/{id}/verify"
    shared_operations:
      - "POST /ood-placements/students (with SystemAdmin)"
      - "PATCH /ood-placements/students/{id}/medicaid-consent (with ParentGuardian, SystemAdmin)"
      - "POST /ood-placements/placement-decisions (with TeamChair)"
      - "PATCH /ood-placements/placement-decisions/{id} (with TeamChair)"
      - "POST /ood-placements/placement-decisions/{id}/submit (with TeamChair)"
      - "POST /ood-placements/transport-routes (with SystemAdmin)"
      - "POST /ood-placements/attendance-records (with SchoolBillingAgent)"
      - "POST /ood-placements/tuition-invoices/{id}/verify (with FiscalOfficer)"
      - "POST /ood-placements/reimbursement-claims (with ParentGuardian)"
      - "POST /ood-placements/progress-reports (with SchoolBillingAgent)"
      - "POST /ood-placements/progress-reports/{id}/accept (with TeamChair)"
      - "POST /ood-placements/return-transition-plans (with TeamChair)"
      - "all GET endpoints"

  - name: TeamChair
    description: "Chair of the IEP placement team. Reviews and approves placement decisions and activates return-to-district transition plans. Cannot approve a decision authored under its own X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /ood-placements/placement-decisions/{id}/return-for-revision"
      - "POST /ood-placements/placement-decisions/{id}/approve"
      - "POST /ood-placements/return-transition-plans/{id}/activate"
    shared_operations:
      - "POST /ood-placements/placement-decisions (with PlacementCoordinator)"
      - "PATCH /ood-placements/placement-decisions/{id} (with PlacementCoordinator)"
      - "POST /ood-placements/placement-decisions/{id}/submit (with PlacementCoordinator)"
      - "POST /ood-placements/progress-reports/{id}/accept (with PlacementCoordinator)"
      - "POST /ood-placements/return-transition-plans (with PlacementCoordinator)"
      - "all GET endpoints"

  - name: FiscalOfficer
    description: "District business-office officer. Owns every movement of money: contract execution, addendum authorization, invoice payment approval and state/Medicaid funding claims. Cannot approve payment on an invoice it verified itself."
    identity: opaque
    exclusive_operations:
      - "POST /ood-placements/placements/{id}/execute-contract"
      - "POST /ood-placements/service-addenda/{id}/authorize"
      - "POST /ood-placements/tuition-invoices/{id}/approve-payment"
      - "POST /ood-placements/funding-claims"
      - "POST /ood-placements/funding-claims/{id}/submit-to-state"
    shared_operations:
      - "POST /ood-placements/fiscal-accounts (with SystemAdmin)"
      - "POST /ood-placements/tuition-rate-schedules (with SystemAdmin)"
      - "POST /ood-placements/tuition-invoices (with SchoolBillingAgent)"
      - "POST /ood-placements/tuition-invoices/{id}/verify (with PlacementCoordinator)"
      - "all GET endpoints"

  - name: SchoolBillingAgent
    description: "Billing contact at an approved private school. X-User-ID is the id of the ApprovedPrivateSchool it acts for, and every read or write is narrowed to rows resolving to that school at validation priority 6."
    identity: "entity_backed:ApprovedPrivateSchool"
    exclusive_operations:
      - "POST /ood-placements/attendance-records/{id}/amend"
      - "POST /ood-placements/tuition-invoices/{id}/resubmit"
    shared_operations:
      - "POST /ood-placements/attendance-records (with PlacementCoordinator)"
      - "POST /ood-placements/tuition-invoices (with FiscalOfficer)"
      - "POST /ood-placements/progress-reports (with PlacementCoordinator)"
      - "all GET endpoints, narrowed to its own school's rows"

  - name: ParentGuardian
    description: "Parent or guardian of a student. X-User-ID is the id of the Student, and every read or write is narrowed to that student's rows at validation priority 6. Files unilateral-placement reimbursement claims and controls Medicaid consent."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /ood-placements/reimbursement-claims (with PlacementCoordinator)"
      - "PATCH /ood-placements/students/{id}/medicaid-consent (with PlacementCoordinator, SystemAdmin)"
      - "all GET endpoints, narrowed to its own student's rows"

  - name: HearingAdjudicator
    description: "Independent hearing officer. The only role that may adjudicate or remand a parental reimbursement claim, and the only role that may invoke the equitable_actual_cost basis."
    identity: opaque
    exclusive_operations:
      - "POST /ood-placements/reimbursement-claims/{id}/adjudicate"
      - "POST /ood-placements/reimbursement-claims/{id}/remand"
    shared_operations:
      - "all GET endpoints"

  - name: SystemAdmin
    description: "Platform operator. Manages reference data (schools, routes, fiscal accounts, rate schedules) and the logical clock. Deliberately holds NO authority over placements, invoices, decisions or claims, so it cannot be used to sidestep either segregation-of-duties pair."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ood-placements/private-schools"
      - "PATCH /ood-placements/private-schools/{id}/approval-status"
    shared_operations:
      - "POST /ood-placements/fiscal-accounts (with FiscalOfficer)"
      - "POST /ood-placements/students (with PlacementCoordinator)"
      - "PATCH /ood-placements/students/{id}/medicaid-consent (with ParentGuardian, PlacementCoordinator)"
      - "POST /ood-placements/tuition-rate-schedules (with FiscalOfficer)"
      - "POST /ood-placements/transport-routes (with PlacementCoordinator)"
      - "all GET endpoints"
