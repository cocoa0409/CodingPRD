      - name: delivery_requires_active_assignment_and_open_pool
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_ASSIGNMENT_NOT_ACTIVE]", "errors[ERR_POOL_NOT_ACCEPTING]"]
        distinguishing_aspect: "Two referential gates on receiving: a SCHEDULED (never started) assignment rejects with ERR_ASSIGNMENT_NOT_ACTIVE; an IN_PROGRESS assignment whose week has no OPEN pool rejects with ERR_POOL_NOT_ACCEPTING."
        test_recipe:
          setup:
            - "Grove A with maturity + crew; assignment AA never started; pool exists for wk 2026-07-27"
            - "Grove B (VALENCIA) with maturity + crew; assignment BB IN_PROGRESS (window covers clock); NO pool for VALENCIA wk 2026-07-27"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-V10", display_name: "Referential Groves" }, as: PackinghouseAdmin, captures: { v10_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${v10_g}", block_code: "H1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { v10_gh: "$.data.id", v10_gh_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${v10_gh}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${v10_gh_v}" }, as: QualityInspector, as_user_id: "qi_v10" }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${v10_g}", block_code: "V1", variety: VALENCIA, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { v10_gv: "$.data.id", v10_gv_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${v10_gv}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${v10_gv_v}" }, as: QualityInspector, as_user_id: "qi_v10" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-V10", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { v10_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${v10_c}", grove_id: "${v10_gh}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T06:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { v10_aa: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${v10_c}", grove_id: "${v10_gv}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { v10_ab: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${v10_ab}/start", payload: {}, as: FieldSupervisor }
          trigger:
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${v10_gh}", assignment_id: "${v10_aa}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { v10_e1: "$.data.error_id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${v10_gv}", assignment_id: "${v10_ab}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { v10_e2: "$.data.error_id" } }
          assert:
            - "SCHEDULED assignment: ${v10_e1} == ERR_ASSIGNMENT_NOT_ACTIVE"
            - "IN_PROGRESS but no OPEN pool for VALENCIA week: ${v10_e2} == ERR_POOL_NOT_ACCEPTING"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more: 3 growers, limit 2 -> page 1 has 2 rows + has_more true; offset 2 -> 1 row + has_more false."
        test_recipe:
          setup: ["Three growers created"]
          setup_api_calls:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PG1", display_name: "P1" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PG2", display_name: "P2" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PG3", display_name: "P3" }, as: PackinghouseAdmin }
          trigger:
            - { call: "GET /packinghouse/growers", payload: { limit: 2, offset: 0 }, as: PackinghouseAdmin }
            - { call: "GET /packinghouse/growers", payload: { limit: 2, offset: 2 }, as: PackinghouseAdmin }
          assert:
            - "Page 1: response_type == array, 2 rows, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 row, total_count == 3, has_more == false"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: error_envelope_shape
        claim_type: not_found
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type 'error' and data.{error_id, message}."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "GET /packinghouse/pools/00000000-0000-0000-0000-000000000000", payload: {}, as: PoolAccountant, captures: { ep_err: "$.data.error_id", ep_msg: "$.data.message" } }
          assert:
            - "${ep_err} == ERR_NOT_FOUND and ${ep_msg} is a non-empty message string; envelope response_type == error"

      - name: settlement_statements_read
        claim_type: computed_read
        grounds: [calculations.settlement_waterfall]
        excluded_because:
          difficulty_instance: settlement_offset_recoup_evaluation_order
          rationale: "The per-grower statement fields (share/offset/recouped/paid) are asserted verbatim in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: field_supervisor_cannot_manage_pools
        claim_type: rbac_denial
        grounds: [roles.PoolAccountant, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Pool management is PoolAccountant-exclusive: FieldSupervisor gets 403 on create, and the denial precedes any body validation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: FieldSupervisor, captures: { rb1_err: "$.data.error_id" } }
          assert:
            - "${rb1_err} == ERR_FORBIDDEN_ROLE (403); no pool persisted"

      - name: grower_cannot_touch_other_growers_invoice
        claim_type: rbac_denial
        grounds: [roles.Grower, "validations[priority=3]", "errors[ERR_GROWER_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Ownership scoping: Grower B paying Grower A's invoice fails with ERR_GROWER_OWNERSHIP_MISMATCH (403), which is distinct from role denial — the role is allowed, the identity is wrong."
        test_recipe:
          setup: ["Growers A and B; A has an ISSUED invoice (MOW 11.111 acres line, total 20000)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-RB2A", display_name: "Owner A" }, as: PackinghouseAdmin, captures: { rb2_ga: "$.data.id" } }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-RB2B", display_name: "Owner B" }, as: PackinghouseAdmin, captures: { rb2_gb: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${rb2_ga}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { rb2_gr: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${rb2_gr}", service_type: MOW, service_date: "2026-08-01", acres_treated: 11.111 }, as: FieldSupervisor, captures: { rb2_o: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${rb2_o}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${rb2_o}/complete", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-invoices", payload: { grower_id: "${rb2_ga}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PoolAccountant, captures: { rb2_inv: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${rb2_inv}/issue", payload: {}, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/caretaking-invoices/${rb2_inv}/payments", payload: { amount_cents: 1000 }, as: Grower, as_user_id: "${rb2_gb}", captures: { rb2_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${rb2_inv}/payments", payload: { amount_cents: 1000 }, as: Grower, as_user_id: "${rb2_ga}" }
          assert:
            - "Grower B pays A's invoice: ${rb2_err} == ERR_GROWER_OWNERSHIP_MISMATCH (403)"
            - "Grower A pays own invoice: accepted; invoice paid_cents == 1000, PARTIALLY_PAID"

      - name: grower_self_service_advance_request
        claim_type: rbac_allow
        grounds: [roles.Grower, state_machines.AdvancePayment]
        distinguishing_aspect: "Grower CAN create an advance for its own grower_id (REQUESTED), but an advance naming another grower is an ownership violation."
        test_recipe:
          setup: ["Grower A; pool HAMLIN wk 2026-07-27 OPEN; grower B exists"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-RB3A", display_name: "Adv A" }, as: PackinghouseAdmin, captures: { rb3_ga: "$.data.id" } }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-RB3B", display_name: "Adv B" }, as: PackinghouseAdmin, captures: { rb3_gb: "$.data.id" } }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { rb3_p: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/advances", payload: { grower_id: "${rb3_ga}", pool_id: "${rb3_p}", amount_cents: 5000 }, as: Grower, as_user_id: "${rb3_ga}", captures: { rb3_adv: "$.data.id" } }
            - { call: "POST /packinghouse/advances", payload: { grower_id: "${rb3_gb}", pool_id: "${rb3_p}", amount_cents: 5000 }, as: Grower, as_user_id: "${rb3_ga}", captures: { rb3_err: "$.data.error_id" } }
          assert:
            - "Own advance: 201, AdvancePayment.${rb3_adv}.status == REQUESTED, recoup_policy defaulted to NEXT_SETTLEMENT_FULL"
            - "Advance naming another grower: ${rb3_err} == ERR_GROWER_OWNERSHIP_MISMATCH"

      - name: non_admin_cannot_set_clock
        claim_type: rbac_denial
        grounds: [roles.PackinghouseAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "The logical clock is PackinghouseAdmin-exclusive; ComplianceOfficer gets 403."
        test_recipe:
          setup: ["Empty DB (clock at default)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_rb4", captures: { rb4_err: "$.data.error_id" } }
          assert:
            - "${rb4_err} == ERR_FORBIDDEN_ROLE (403); clock remains 2026-08-01T00:00:00Z"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_maturity_supersede_stale_grove_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[maturity-test-create-stale-grove]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "MaturityTest create supersedes the grove's CURRENT test and bumps grove.version; a create carrying the pre-supersede version is rejected 412, and replaying with the fresh version succeeds."
        test_recipe:
          setup: ["Grower + HAMLIN grove (version 1 at creation)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-OC1", display_name: "OCC Groves" }, as: PackinghouseAdmin, captures: { oc1_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${oc1_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { oc1_gr: "$.data.id", oc1_gr_v: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/groves/${oc1_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${oc1_gr_v}" }, as: QualityInspector, as_user_id: "qi_oc1", captures: { oc1_t1: "$.data.id" } }
            - { call: "POST /packinghouse/groves/${oc1_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T12:00:00Z", brix: 9.2, acid_pct: 1.0, juice_pct: 46.0, expected_grove_version: "${oc1_gr_v}" }, as: QualityInspector, as_user_id: "qi_oc1", captures: { oc1_err: "$.data.error_id" } }
            - { call: "GET /packinghouse/groves/${oc1_gr}", payload: {}, as: QualityInspector, captures: { oc1_gr_v2: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${oc1_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T12:00:00Z", brix: 9.2, acid_pct: 1.0, juice_pct: 46.0, expected_grove_version: "${oc1_gr_v2}" }, as: QualityInspector, as_user_id: "qi_oc1", captures: { oc1_t2: "$.data.id" } }
          assert:
            - "First create OK; second create with the SAME (now stale) expected version: ${oc1_err} == ERR_STALE_VERSION (412)"
            - "Retry with fresh version succeeds: ${oc1_t2} CURRENT; ${oc1_t1} SUPERSEDED"
            - "Grove.${oc1_gr}.version advanced by exactly 1 per successful create"

      - name: occ_sort_run_recreate_stale_delivery_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sort-run-create-stale-delivery]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "SortRun create is OCC-gated on delivery.version: after the first run's create bumped the delivery, a create replaying the pre-create version is 412 even though no other sort run is active."
        test_recipe:
          setup: ["Delivery 10 net (HAMLIN); SR1 created (delivery version bumped), then VOIDED — delivery free for recreation"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-OC2", display_name: "OCC Delivery Groves" }, as: PackinghouseAdmin, captures: { oc2_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${oc2_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { oc2_gr: "$.data.id", oc2_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${oc2_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${oc2_gr_v}" }, as: QualityInspector, as_user_id: "qi_oc2" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-OC2", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { oc2_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${oc2_c}", grove_id: "${oc2_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { oc2_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${oc2_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${oc2_gr}", assignment_id: "${oc2_a}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { oc2_d: "$.data.id", oc2_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${oc2_d}", fancy_boxes: 10, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${oc2_d_v}" }, as: LineOperator, as_user_id: "op_oc2", captures: { oc2_sr1: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${oc2_sr1}/void", payload: {}, as: LineOperator, as_user_id: "op_oc2" }
          trigger:
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${oc2_d}", fancy_boxes: 10, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${oc2_d_v}" }, as: LineOperator, as_user_id: "op_oc2", captures: { oc2_err: "$.data.error_id" } }
            - { call: "GET /packinghouse/deliveries/${oc2_d}", payload: {}, as: LineOperator, captures: { oc2_d_v2: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${oc2_d}", fancy_boxes: 10, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${oc2_d_v2}" }, as: LineOperator, as_user_id: "op_oc2", captures: { oc2_sr2: "$.data.id" } }
          assert:
            - "Recreate with stale pre-create version: ${oc2_err} == ERR_STALE_VERSION (412)"
            - "Recreate with current version: 201, SortRun.${oc2_sr2} OPEN (voided SR1 no longer blocks)"

      - name: occ_pool_reprice_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pool-set-price-stale-pool]", "errors[ERR_STALE_VERSION]", state_machines.Pool.PRICED_to_PRICED]
        distinguishing_aspect: "set-price is legitimate from PRICED (re-price) but OCC-gated: replaying the pre-pricing version is 412; the PRICED->PRICED self-loop bumps the version each time."
        test_recipe:
          setup: ["Pool INTAKE_CLOSED (empty pool: no deliveries) at version 2 (create + close-intake)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { oc3_p: "$.data.id", oc3_p_v: "$.data.version" } }
            - { call: "POST /packinghouse/pools/${oc3_p}/close-intake", payload: {}, as: PoolAccountant }
            - { call: "GET /packinghouse/pools/${oc3_p}", payload: {}, as: PoolAccountant, captures: { oc3_p_v2: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/pools/${oc3_p}/set-price", payload: { expected_pool_version: "${oc3_p_v2}" }, as: PoolAccountant }
            - { call: "POST /packinghouse/pools/${oc3_p}/set-price", payload: { expected_pool_version: "${oc3_p_v2}" }, as: PoolAccountant, captures: { oc3_err: "$.data.error_id" } }
            - { call: "GET /packinghouse/pools/${oc3_p}", payload: {}, as: PoolAccountant, captures: { oc3_p_v3: "$.data.version" } }
            - { call: "POST /packinghouse/pools/${oc3_p}/set-price", payload: { expected_pool_version: "${oc3_p_v3}" }, as: PoolAccountant }
          assert:
            - "First set-price OK (INTAKE_CLOSED -> PRICED); empty pool prices at 0 (proceeds 0, max(ge,1) guard)"
            - "Re-price replaying the stale version: ${oc3_err} == ERR_STALE_VERSION"
            - "Re-price with the fresh version succeeds (PRICED -> PRICED) and bumps version again"

      - name: cascading_side_effects_quarantine
        claim_type: cascading_side_effects
        grounds: [state_machines.QuarantineOrder]
        excluded_because:
          difficulty_instance: quarantine_activation_cascade
          rationale: "The N-level quarantine cascade (posture -> assignments -> crew capacity, plus delivery holds) is asserted end-to-end in the named §1.8 instance."

      - name: dual_variant_coverage_marker
        claim_type: dual_variant_calculation
        grounds: [calculations.pool_provisional_price, calculations.settlement_waterfall]
        excluded_because:
          difficulty_instance: pool_price_provisional_vs_final
          rationale: "Both dual-variant pairs (pool price; advance recoup policy) are asserted by §1.8 dual_variant_calc instances."

      - name: derived_field_reconciliation_under_reversal
        claim_type: derived_field_reconciliation
        grounds: [entities.Pool.fields.posted_ge_boxes, entities.AllocationChannel.fields.remaining_boxes]
        excluded_because:
          difficulty_instance: pool_totals_conserved_under_post_and_reverse
          rationale: "Derived fields returning exactly to pre-post values after reverse is the conserved-quantity assertion of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_post
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.SortRun.VERIFIED_to_POSTED]
        distinguishing_aspect: "Consistency is immediate: the post response itself carries the allocation, and a subsequent GET of the pool/channel/delivery in the same logical instant shows every derived field already updated (no lag, no recomputation endpoint)."
        test_recipe:
          setup: ["Delivery 10 net VALENCIA; DOM 10@600 rank1 [FANCY]; JUICE @220; sort run 10F VERIFIED"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CM1", display_name: "Consistency Groves" }, as: PackinghouseAdmin, captures: { cm_g: "$.data.id" } }
