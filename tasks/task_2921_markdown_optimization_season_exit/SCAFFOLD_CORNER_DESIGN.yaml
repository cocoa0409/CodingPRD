      - name: min_sample_weeks_and_an_empty_pool_are_rejected_distinctly
        claim_type: Constants Applied
        grounds:
          - calculations.elasticity_coefficient_estimation.constants.MIN_SAMPLE_WEEKS
          - validations[priority=34]
          - errors[ERR_INSUFFICIENT_PRICE_HISTORY]
          - errors[ERR_EMPTY_PEER_POOL]
        distinguishing_aspect: |
          MIN_SAMPLE_WEEKS is 4, so three weeks fail own_history_ok even with two distinct prices: an explicit
          OWN_HISTORY request is rejected with ERR_INSUFFICIENT_PRICE_HISTORY while the same item under AUTO
          falls through to the pooled branch and is rejected with ERR_EMPTY_PEER_POOL - two errors, one cause.
        test_recipe:
          setup:
            - "Season SS27-FOOTWEAR is ACTIVE and holds exactly one item, G-7007 (cluster CL-W9), with 300 units received"
            - "Only three sales weeks are posted for G-7007 and they carry two distinct ticket prices"
            - "No other item in the season has a CERTIFIED estimate, so the pooled peer set is empty"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "SS27-FOOTWEAR", category: "FOOTWEAR", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 500, sell_through_target_pct: 80.0, clearance_space_units: 400 }
