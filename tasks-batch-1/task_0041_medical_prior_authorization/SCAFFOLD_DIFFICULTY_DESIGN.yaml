  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_expire_conserves_active_auth_count
        grounds:
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.AuthorizationRequest.APPROVED_to_EXPIRED
          - entities.Member.fields.active_authorization_count
        distinguishing_aspect: "Conserved quantity = Member.active_authorization_count. Forward action APPROVE (+1) paired with compensating action EXPIRE (-1) leaves Member.active_authorization_count exactly equal to its pre-approval value (0). Invariant: active_authorization_count == count of APPROVED, non-expired requests for the member."
        test_recipe:
          setup:
            - "Member M with active_authorization_count = 0; one request that will be approved then expired."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "PRIMARY_CARE" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "PRIMARY_CARE" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-INV", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "MEDICATION_HISTORY", line_item_cost_cents: 0, uri: "s3://inv1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "APPROVE", approved_units: 1, rationale: "OK" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: Payer
          trigger:
            - call: "POST /authorization-requests/${req_id}/expire"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "Member.${member_id}.active_authorization_count == 0"
            - "active_authorization_count equals its pre-approval value; the +1 from APPROVE and -1 from EXPIRE net to zero drift"
      - name: pend_then_resume_conserves_clock_paused_hours_ledger
        grounds:
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PENDED
          - state_machines.AuthorizationRequest.PENDED_to_UNDER_REVIEW
          - calculations.sla_due_at
          - entities.AuthorizationRequest.fields.clock_paused_hours
        distinguishing_aspect: "Different conserved quantity = clock_paused_hours ledger. Forward action PEND (start pause) paired with compensating RESUME (close pause) credits exactly the wall-clock paused interval to clock_paused_hours and no more; invariant: sla_due_at - review_started_at == base_hours + clock_paused_hours at all times. Pend from 2026-06-02T00:00:00Z to 2026-06-03T00:00:00Z credits exactly 24h."
        test_recipe:
          setup:
            - "A standard UNDER_REVIEW request (review_started_at 2026-06-01T00:00:00Z, base 168h), PENDED at 2026-06-02T00:00:00Z, new evidence added, then resumed at 2026-06-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", standard_sla_hours: 168, expedited_sla_hours: 72 }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
