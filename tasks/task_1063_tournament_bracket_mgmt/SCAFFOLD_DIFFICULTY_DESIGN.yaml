          - entities.Tournament.fields.eliminated_count
          - state_machines.Match.CONFIRMED_to_VOIDED
        distinguishing_aspect: "Conserved quantity = participant headcount (a different quantity than money): confirm eliminates exactly one competitor (alive--/eliminated++), and the compensating UPHELD-dispute void un-eliminates exactly one (alive++/eliminated--), so alive_count + eliminated_count == checked_in_count (2) holds before and after."
        test_recipe:
          setup:
            - "2-player SINGLE_ELIM IN_PROGRESS; final CONFIRMED (P2 eliminated: alive_count=1, eliminated_count=1, checked_in_count=2); P2 raises a dispute on the CONFIRMED final."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "19 Oak", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1n@x.com", rating: 1500 }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2n@x.com", rating: 1200 }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Head", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 4, seeding_method: "RATING", prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
            - call: "POST /matches/${m_id}/report"
              payload: { home_score: 2, away_score: 0 }
              as: Player
              as_user_id: "${p1}"
              captures: { m_ver1: $.data.version }
            - call: "POST /matches/${m_id}/confirm"
              payload: { expected_match_version: "${m_ver1}" }
              as: Referee
              as_user_id: "ref-1"
            - call: "POST /disputes"
              payload: { match_id: "${m_id}", raised_by_registration_id: "${r2}", reason: "review" }
              as: Player
              as_user_id: "${p2}"
              captures: { d_id: $.data.id }
            - call: "GET /matches/${m_id}"
              payload: {}
              as: Public
              captures: { m_ver2: $.data.version }
          trigger:
            - call: "POST /disputes/${d_id}/resolve"
              payload: { outcome: "UPHELD", resolution_note: "restore", expected_match_version: "${m_ver2}" }
              as: Referee
              as_user_id: "ref-9"
          assert:
            - "Before the dispute void: Tournament.${t_id}.alive_count == 1, eliminated_count == 1 (sum 2 == checked_in_count)."
            - "After the UPHELD void: Tournament.${t_id}.alive_count == 2, eliminated_count == 0 (sum still 2 == checked_in_count)."
            - "Registration.${r2}.eliminated == false after the compensating void."
