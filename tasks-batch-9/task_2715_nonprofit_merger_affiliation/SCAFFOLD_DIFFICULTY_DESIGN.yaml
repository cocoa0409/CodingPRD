          setup:
            - "A Restructuring in status REGULATORY_REVIEW with combined_board_seats 15, reserved_seat_pool 0, round_no 1, an EXECUTED LetterOfIntent with exclusivity_status ACTIVE, and two CERTIFIED BoardApprovals holding 8 and 7 seats"
