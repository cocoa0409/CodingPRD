  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_venue_requires_amenity_open
        grounds:
          - state_machines.CommunityEvent.PROPOSED_to_SCHEDULED
          - state_machines.Amenity
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair CommunityEvent -> Amenity (distinct from LotClosing -> LotPurchaseAgreement):
          scheduling a CLUBHOUSE-venue event is gated on the mapped amenity being OPEN; the same
          request succeeds after the amenity opens, proving the dependency is on live amenity state.
        test_recipe:
          setup:
            - "Active community; CLUBHOUSE amenity advanced COMMITTED -> IN_DESIGN only (scheduling requires UNDER_CONSTRUCTION or OPEN)"
            - "PROPOSED event at venue CLUBHOUSE [2026-06-01T10:00Z, 2026-06-01T12:00Z), capacity 20, cost 0 (lead time satisfied at the default clock)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Amenity Acres", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/amenities"
              payload: { community_id: "${c_id}", amenity_type: "CLUBHOUSE", hard_deadline_date: "2027-12-31T00:00:00Z", budgeted_cost_cents: 1000000 }
              as: DeclarantExecutive
              captures: { am_id: $.data.id }
            - call: "POST /mpc/amenities/${am_id}/start-design"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Clubhouse Gala", venue: "CLUBHOUSE", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z", capacity: 20 }
              as: LifestyleCoordinator
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /mpc/events/${ev_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /mpc/amenities/${am_id}/start-construction"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/events/${ev_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
              captures: { final_status: $.data.status }
          assert:
            - "first schedule attempt: ${err} == ERR_AMENITY_NOT_OPEN (http 409) while the amenity is IN_DESIGN"
            - "after start-construction (UNDER_CONSTRUCTION): second attempt -> ${final_status} == SCHEDULED"

      - name: closing_requires_agreement_active_and_lot_offered
        grounds:
          - state_machines.LotClosing.PENDING_to_CLOSED
          - state_machines.LotPurchaseAgreement
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pairs LotClosing -> LotPurchaseAgreement and LotClosing -> Lot (distinct from
          CommunityEvent -> Amenity): escrow creation is rejected while the agreement is EXECUTED
          (not yet ACTIVE), and a second escrow on an already UNDER_CONTRACT lot is rejected
          ERR_LOT_NOT_OFFERED after the agreement reaches ACTIVE.
        test_recipe:
          setup:
            - "Active community; phase SALES_OPEN; builder; agreement EXECUTED but not commenced (1 lot committed; tranche due 2026-06-30)"
            - "Lot L1 OFFERED"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Gated Grove", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
