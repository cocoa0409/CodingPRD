# ===========================================================================
# §1.8 Scaffold Difficulty Design - Test Targeting Index
# Task 2636 - Nonprofit Newsroom Membership & Grant Funding
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. The logical clock of
# a fresh server is exactly 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc
# in §1.5); recipes that need a later instant move it forward explicitly.
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# ===========================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_recognized_vs_pipeline_diverge_on_hhi_top_source_and_reserve_target
        grounds:
          - calculations.revenue_diversification_index
          - calculations.reserve_policy_posture
          - entities.FiscalPeriod.fields.concentration_hhi
          - entities.FiscalPeriod.fields.top_source_share_bps
          - entities.FiscalPeriod.fields.reserve_months_target
          - entities.GrantProposal.fields.award_probability_bps
          - state_machines.GrantProposal.SUBMITTED_to_AWARDED
        distinguishing_aspect: |
          The two variants of revenue_diversification_index read the SAME stored rows and disagree on
          three persisted-vs-projected outputs at once: RECOGNIZED counts only the AWARDED grant plus
          SETTLED cash (total 1000000, concentration_hhi 5450, top_source_share_bps 3500), while
          PIPELINE folds in funder B's SUBMITTED proposal at award_probability_bps 5000 (total 1100000,
          concentration_hhi 5165, top_source_share_bps 3182). Because 3500 >= TOP_SOURCE_ESCALATION and
          3182 < TOP_SOURCE_ESCALATION, the downstream reserve_policy_posture reports
          reserve_months_target 5 / operating_reserve_target_cents 1000000 on the recognized basis and
          4 / 800000 on the pipeline basis from one identical database.
        test_recipe:
          setup:
            - "Logical clock at its fresh-server default 2026-08-01T00:00:00Z."
            - "One OPEN FiscalPeriod FY2027 (2026-08-01..2027-07-31), monthly_expense_base_cents 200000, reserve_balance_cents 500000."
            - "Funder A (FOUNDATION, unaffiliated, no advocacy attestation) CLEARED with independence_risk_score 10; its UNRESTRICTED proposal is AWARDED at 350000 with reporting_cadence NONE."
            - "Funder B (FOUNDATION, unaffiliated) CLEARED; its UNRESTRICTED proposal of 200000 sits in SUBMITTED with award_probability_bps 5000, so it contributes 100000 to the pipeline basis only."
            - "One EVENTS contribution of 650000 in settlement_status SETTLED; no MEMBERSHIP, MAJOR_GIFT or SYNDICATION revenue at all."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Cascade Foundation", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { fa_id: "$.data.id" }
            - call: "POST /funders/${fa_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED", reason: "No advocacy footprint, no affiliated beat." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /grant-proposals"
              payload: { funder_id: "${fa_id}", fiscal_period_id: "${fp_id}", title: "General operating support", requested_amount_cents: 350000, restriction_type: "UNRESTRICTED", reporting_cadence: "NONE", award_probability_bps: 8000 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { gpa_id: "$.data.id" }
            - call: "POST /grant-proposals/${gpa_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /grant-proposals/${gpa_id}/internal-review"
              payload: { decision: "CLEAR", review_note: "No editorial strings attached." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "POST /grant-proposals/${gpa_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /grant-proposals/${gpa_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350000, award_date: "2026-08-15" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /funders"
              payload: { legal_name: "Ridgeline Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { fb_id: "$.data.id" }
            - call: "POST /funders/${fb_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /grant-proposals"
              payload: { funder_id: "${fb_id}", fiscal_period_id: "${fp_id}", title: "Statehouse accountability desk", requested_amount_cents: 200000, restriction_type: "UNRESTRICTED", reporting_cadence: "NONE", award_probability_bps: 5000 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { gpb_id: "$.data.id" }
            - call: "POST /grant-proposals/${gpb_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /grant-proposals/${gpb_id}/internal-review"
              payload: { decision: "CLEAR" }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "POST /grant-proposals/${gpb_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "EVENTS", amount_cents: 650000, received_date: "2026-08-10", source_label: "Annual benefit dinner" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { ev_c_id: "$.data.id" }
            - call: "POST /contributions/${ev_c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
          trigger:
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: { basis: "RECOGNIZED" }
              as: FinanceController
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: { basis: "PIPELINE" }
              as: FinanceController
          assert:
            - "trigger[0] (RECOGNIZED): recognized_revenue_cents == 1000000"
            - "trigger[0] (RECOGNIZED): grants_share_bps == 3500 and events_share_bps == 6500 and membership_share_bps == 0 and major_gift_share_bps == 0 and syndication_share_bps == 0"
            - "trigger[0] (RECOGNIZED): concentration_hhi == 5450"
            - "trigger[0] (RECOGNIZED): top_source_share_bps == 3500"
            - "trigger[0] (RECOGNIZED): reserve_months_target == 5 and operating_reserve_target_cents == 1000000"
            - "trigger[0] (RECOGNIZED): reserve_months_ratio_bps == 25000 and sustainability_posture == WATCH and restricted_release_cap_pct_bps == 6000"
            - "trigger[1] (PIPELINE): recognized_revenue_cents == 1100000"
            - "trigger[1] (PIPELINE): grants_share_bps == 4091 and events_share_bps == 5909"
            - "trigger[1] (PIPELINE): concentration_hhi == 5165"
            - "trigger[1] (PIPELINE): top_source_share_bps == 3182"
            - "trigger[1] (PIPELINE): reserve_months_target == 4 and operating_reserve_target_cents == 800000"
            - "FiscalPeriod.${fp_id}.concentration_hhi == 5450 and FiscalPeriod.${fp_id}.top_source_share_bps == 3500 and FiscalPeriod.${fp_id}.reserve_months_target == 5 - the PIPELINE read persisted nothing"
            - "GrantProposal.${gpb_id}.status == SUBMITTED and GrantProposal.${gpb_id}.awarded_amount_cents == 0"

      - name: dv_funder_risk_self_attested_32_vs_audited_48_crosses_disclosure_floor
        grounds:
          - calculations.funder_independence_risk
          - entities.Funder.fields.risk_basis
          - entities.Funder.fields.independence_risk_score
          - entities.Funder.fields.audited_advocacy_index
          - state_machines.Funder.PROSPECT_to_CLEARED
          - validations[priority=22]
        distinguishing_aspect: |
          One unchanged Funder row (FOUNDATION, affiliated_coverage_area_id set, self_attested_advocacy
          true) scores independence_risk_score 32 under the self_attested variant, which pins
          advocacy_index at the SELF_ATTESTED_ADVOCACY_INDEX constant 3, and 48 under the audited
          variant, which reads audited_advocacy_index 7 verbatim; 32 sits below RISK_DISCLOSURE_FLOOR
          and 48 sits above it, so the variant switch alone flips the funder from "no disclosure
          needed" to "clearance is only legal because an ACTIVE disclosure already covers the pair".
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "CoverageArea HOUSING exists with publication_gate OPEN."
            - "Funder created by user-dev-1 as FOUNDATION affiliated to HOUSING with self_attested_advocacy true: risk_basis SELF_ATTESTED, independence_risk_score 32, status PROSPECT."
            - "An ACTIVE FirewallDisclosure for (funder, HOUSING) attested by user-ed-1, filed against the funder version observed at creation."
          setup_api_calls:
            - call: "POST /coverage-areas"
              payload: { area_code: "HOUSING", name: "Housing and homelessness", editorial_lead_user_id: "user-ed-9" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Wexler Family Foundation", funder_type: "FOUNDATION", affiliated_coverage_area_id: "${ca_id}", self_attested_advocacy: true }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { f_id: "$.data.id", f_score_created: "$.data.independence_risk_score", f_v0: "$.data.version" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Wexler funds housing coverage; assignments, sourcing and publication decisions rest solely with the housing desk editor.", expected_funder_version: "${f_v0}" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { fd_id: "$.data.id" }
          trigger:
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "AUDITED", audited_advocacy_index: 7, reason: "Independent audit measured sustained advocacy on the funded beat." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { f_score_audited: "$.data.independence_risk_score" }
          assert:
            - "before the trigger: Funder.${f_id}.independence_risk_score == 32 and Funder.${f_id}.risk_basis == SELF_ATTESTED"
            - "after the trigger: Funder.${f_id}.independence_risk_score == 48 and Funder.${f_id}.risk_basis == AUDITED"
            - "Funder.${f_id}.audited_advocacy_index == 7 and Funder.${f_id}.self_attested_advocacy == true - the self-attestation is retained but ignored by the audited variant"
            - "Funder.${f_id}.status == CLEARED and Funder.${f_id}.cleared_by_user_id == user-ed-1"
            - "48 - 32 == 16 == ADVOCACY_WEIGHT * (7 - SELF_ATTESTED_ADVOCACY_INDEX); no other term moved"
            - "FirewallDisclosure.${fd_id}.status == ACTIVE - the clearance was legal only because the score crossed RISK_DISCLOSURE_FLOOR with the pair already disclosed"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_tier_quid_pro_quo_rounds_each_benefit_before_summing
        grounds:
          - calculations.tier_quid_pro_quo_value
          - calculations.contribution_deductible_split
          - entities.MembershipTier.fields.quid_pro_quo_per_period_cents
          - entities.MembershipTier.fields.insubstantial_benefit_codes
          - entities.MembershipTier.fields.insubstantial_threshold_cents
          - entities.Contribution.fields.deductible_cents
        distinguishing_aspect: |
          A MONTHLY tier at 2500 cents with three 1000-cent annual benefits plus one 480-cent benefit
          forces the pinned rounding ORDER to be observable: rounding each benefit first gives
          83 + 83 + 83 = 249 while summing the annual values and dividing once gives
          round_half_up(3000/12) = 250, so quid_pro_quo_per_period_cents must be 249 and the enrolling
          contribution's deductible_cents must be 2251, not 2250.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one OPEN FiscalPeriod FY2027 (2026-08-01..2027-07-31)."
            - "MembershipTier SUSTAINER, renewal_cadence MONTHLY, contribution_amount_cents 2500, grace_period_days 30, four benefits with annual fair market values 1000, 1000, 1000 and 480 cents."
            - "The tier is PUBLISHED (legal because 249 < 2500) and one Member is enrolled on it in status PENDING."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload:
                tier_code: "SUSTAINER"
                name: "Monthly Sustainer"
                renewal_cadence: "MONTHLY"
                contribution_amount_cents: 2500
                grace_period_days: 30
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 1000 }
                  - { benefit_code: "EVENT", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 1000 }
                  - { benefit_code: "BOOK", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 1000 }
                  - { benefit_code: "NEWSLETTER", fulfillment_type: "CONTENT_ACCESS", annual_fair_market_value_cents: 480 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { tier_id: "$.data.id", tier_quid: "$.data.quid_pro_quo_per_period_cents" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "avery@example.org", full_name: "Avery Nunez" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", member_id: "${m_id}", amount_cents: 2500, received_date: "2026-08-10" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { c_id: "$.data.id", c_quid: "$.data.quid_pro_quo_cents", c_deductible: "$.data.deductible_cents" }
            - call: "POST /contributions/${c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
          assert:
            - "MembershipTier.${tier_id}.insubstantial_threshold_cents == 50"
            - "MembershipTier.${tier_id}.quid_pro_quo_per_period_cents == 249 (NOT 250)"
            - "MembershipTier.${tier_id}.insubstantial_benefit_codes == [NEWSLETTER] - its per-period value 40 is at or below 50, the other three at 83 are not"
            - "MembershipTier.${tier_id}.benefit_count == 4"
            - "MembershipTier.${tier_id}.status == PUBLISHED"
            - "trigger[0]: Contribution.${c_id}.quid_pro_quo_cents == 249 and Contribution.${c_id}.deductible_cents == 2251"
            - "after trigger[1]: Contribution.${c_id}.settlement_status == SETTLED and Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.lifetime_giving_cents == 2500 and Member.${m_id}.is_major_donor == false"

      - name: cf_collaboration_largest_remainder_split_conserves_total_cost
        grounds:
          - calculations.collaboration_cost_split
          - entities.CollaborationPartner.fields.cost_owed_cents
          - entities.CollaborationPartner.fields.remainder_rank
          - entities.Collaboration.fields.allocated_cost_cents
          - state_machines.Collaboration.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          With total_cost_cents 100002 apportioned 3334/3333/3333 bps the exact shares are
          33340.6668 / 33330.6666 / 33330.6666, so independent round_half_up would emit
          33341 + 33331 + 33331 = 100003 - one cent MORE than the collaboration actually costs;
          the largest-remainder rule must instead emit 33341 / 33331 / 33330 and must break the exact
          remainder tie between the two partners by created_at ASC, giving the earlier partner
          remainder_rank 2 and the later one remainder_rank 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one OPEN FiscalPeriod FY2027 (2026-08-01..2027-07-31)."
            - "CoverageArea CLIMATE with publication_gate OPEN and no funders attached."
            - "Collaboration in DRAFT on CLIMATE, window 2026-09-01T00:00:00Z..2026-10-01T00:00:00Z, total_cost_cents 100002, lead_credit_bps 3334, lead_cost_share_bps 3334."
            - "Two CONFIRMED partners created in a fixed order, each at credit_share_bps 3333 and cost_share_bps 3333, so both bps columns close at exactly 10000."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate and energy", editorial_lead_user_id: "user-ed-7" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_id: "$.data.id" }
            - call: "POST /collaborations"
              payload: { coverage_area_id: "${ca_id}", fiscal_period_id: "${fp_id}", title: "Heat island investigation", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", total_cost_cents: 100002, lead_credit_bps: 3334, lead_cost_share_bps: 3334 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { col_id: "$.data.id" }
            - call: "POST /collaborations/${col_id}/partners"
              payload: { partner_org_name: "Delta River Report", credit_share_bps: 3333, cost_share_bps: 3333 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /collaborations/${col_id}/partners"
              payload: { partner_org_name: "Harbor Light News", credit_share_bps: 3333, cost_share_bps: 3333 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "POST /collaborations/${col_id}/status-actions"
              payload: { action: "ACTIVATE" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { col_allocated: "$.data.allocated_cost_cents", col_lead_cost: "$.data.lead_cost_cents" }
          assert:
            - "Collaboration.${col_id}.status == ACTIVE and Collaboration.${col_id}.partner_count == 2"
            - "Collaboration.${col_id}.lead_cost_cents == 33341"
            - "CollaborationPartner.${p1_id}.cost_owed_cents == 33331 and CollaborationPartner.${p1_id}.remainder_rank == 2"
            - "CollaborationPartner.${p2_id}.cost_owed_cents == 33330 and CollaborationPartner.${p2_id}.remainder_rank == 3"
            - "Collaboration.${col_id}.allocated_cost_cents == 100002 == total_cost_cents (independent round_half_up would have produced 100003)"
            - "33341 + 33331 + 33330 == 100002 - exactly two participants received the leftover cent"
            - "Collaboration.${col_id}.syndication_revenue_cents == 0"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_gift_offer_conditions_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.GiftOffer.INDEPENDENCE_REVIEW_to_CONDITIONS_REQUESTED
          - state_machines.GiftOffer.CONDITIONS_REQUESTED_to_INDEPENDENCE_REVIEW
          - entities.GiftOffer.fields.conditions_round_count
          - validations[priority=26]
          - validations[priority=25]
        distinguishing_aspect: |
          The offer re-enters INDEPENDENCE_REVIEW three separate times and the cycle counter only ever
          advances on the CONDITIONS_REQUESTED edge, so after two negotiation rounds a third
          REQUEST_CONDITIONS is refused with ERR_CONDITION_ROUNDS_EXHAUSTED while conditions_round_count
          stays pinned at 2 and the status stays INDEPENDENCE_REVIEW; the only remaining forward exit is
          a donor resubmission that drops donor_conditions, which then makes CLEAR legal under
          validations[priority=25].
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one OPEN FiscalPeriod FY2027."
            - "Funder (FOUNDATION, unaffiliated) CLEARED with independence_risk_score 10, cultivated by user-dev-1."
            - "GiftOffer of 500000 cents, designation UNRESTRICTED (so no coverage area or disclosure is in play), solicited by user-dev-1, carrying donor_conditions from the start."
            - "Two full negotiation rounds already consumed: the offer sits in CONDITIONS_REQUESTED with conditions_round_count == 2 and non-empty donor_conditions."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Bellweather Fund", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { f_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /gift-offers"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", offered_amount_cents: 500000, designation: "UNRESTRICTED", donor_conditions: "Donor asks to preview the housing series before publication." }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { go_id: "$.data.id" }
            - call: "POST /gift-offers/${go_id}/submit-for-review"
              payload: { donor_conditions: "Donor asks to preview the housing series before publication." }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /gift-offers/${go_id}/independence-review"
              payload: { decision: "REQUEST_CONDITIONS", review_note: "Round 1: preview rights are incompatible with the firewall; please withdraw them." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "POST /gift-offers/${go_id}/submit-for-review"
              payload: { donor_conditions: "Donor will accept a courtesy notice one hour before publication." }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /gift-offers/${go_id}/independence-review"
              payload: { decision: "REQUEST_CONDITIONS", review_note: "Round 2: advance notice is still a condition; it must go." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
          trigger:
            - call: "POST /gift-offers/${go_id}/submit-for-review"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /gift-offers/${go_id}/independence-review"
              payload: { decision: "REQUEST_CONDITIONS", review_note: "Round 3: one more clarification." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "POST /gift-offers/${go_id}/independence-review"
              payload: { decision: "CLEAR", review_note: "Conditions withdrawn; gift may be accepted." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
          assert:
            - "at the end of setup: GiftOffer.${go_id}.status == CONDITIONS_REQUESTED and conditions_round_count == 2"
            - "trigger[0] -> 200: GiftOffer.${go_id}.status == INDEPENDENCE_REVIEW (third entry into the same state) and donor_conditions == null"
            - "trigger[0]: stewardship_fee_cents == 0 and net_acceptable_amount_cents == 500000 and board_ratification_required == false - the netting is recomputed on every re-entry from the unchanged gross 500000"
            - "trigger[1] -> 409 ERR_CONDITION_ROUNDS_EXHAUSTED"
            - "after trigger[1]: GiftOffer.${go_id}.status is still INDEPENDENCE_REVIEW and conditions_round_count is still 2 and donor_conditions is still null - the rejected round left no trace"
            - "trigger[2] -> 200: GiftOffer.${go_id}.status == CLEARED and acceptance_gate_score == 10 and cleared_by_user_id == user-ed-2"
            - "conditions_round_count == 2 after the whole sequence - the counter advanced only on the two CONDITIONS_REQUESTED edges, never on a re-submission"

      - name: nl_grant_report_returned_resubmission_recomputes_variance
        grounds:
          - state_machines.GrantReport.SUBMITTED_to_RETURNED
          - state_machines.GrantReport.RETURNED_to_SUBMITTED
          - entities.GrantReport.fields.variance_bps
          - validations[priority=33]
          - calculations.restricted_release_waterfall
        distinguishing_aspect: |
          The report reaches SUBMITTED twice with different spend figures and the second visit is not a
          replay: RETURN wipes spend_reported_cents and variance_bps back to null, so the resubmission
          recomputes variance_bps as -476 from consumed_release_cents 210000 rather than adjusting the
          earlier -2857, and the ACCEPT that was refused at -2857 succeeds at -476 while
          consumed_release_cents stays 210000 throughout.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; one OPEN FiscalPeriod FY2027 with monthly_expense_base_cents 200000 and reserve_balance_cents 500000."
            - "CoverageArea HOUSING (publication_gate OPEN) and a CLEARED FOUNDATION funder with an ACTIVE FirewallDisclosure for (funder, HOUSING)."
            - "A PROGRAM_RESTRICTED proposal restricted to 2026-09-01..2027-02-28 with reporting_cadence SEMIANNUAL is AWARDED at 350000, producing exactly one GrantReport (sequence_no 1, period_end 2027-02-28, due_date 2027-04-14, allocated_release_cents 350000)."
            - "The FinanceController releases 210000 (the WATCH cap of 6000 bps on 350000), so the report's consumed_release_cents is 210000."
            - "The clock is then moved to 2027-03-01T00:00:00Z, past period_end but before due_date, so the report is submittable and not yet overdue."
