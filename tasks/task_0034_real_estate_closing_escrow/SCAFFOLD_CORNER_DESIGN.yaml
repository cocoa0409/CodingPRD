      - name: cascading_side_effects_terminate_under_contract_with_material_defect
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.PurchaseAgreement.UNDER_CONTRACT_to_TERMINATED"
        distinguishing_aspect: |
          Terminating from UNDER_CONTRACT (with a TitleSearch carrying material defect)
          cascades: CONFIRMED EMDs -> REFUNDED, EARNEST_REFUND Disbursement emitted per deposit,
          EscrowAccount -> CLOSED, PurchaseAgreement -> TERMINATED. Conserved earnest sum
          preserved.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Agreement UNDER_CONTRACT; one CONFIRMED EMD of 1000000; TitleSearch in COMPLETED with one MATERIAL defect (has_material_defect=true); BUYER WireInstruction LOCKED."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
