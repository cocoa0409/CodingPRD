  - rule_id: compensating_invariant
    instances:
      - name: stop_reversal_conserves_run_loaded_meals
        grounds:
          - calculations.run_meal_conservation
          - state_machines.DistributionStop.DELIVERED_to_FAILED
          - entities.DistributionRun.fields.loaded_meals
          - entities.DistributionSite.fields.received_meals_total
        distinguishing_aspect: |
          Reversing a DELIVERED stop to FAILED moves exactly its delivered meal count out of
          delivered_meals and into returned_meals, so DistributionRun.loaded_meals is bit-identical
          before and after (100 == 40 + 60) and the receiving site's received_meals_total drops back to
          zero - a reversal that left loaded_meals at 100 but returned_meals at 25 would drift.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is OPERATIONAL"
            - "DistributionRun ${run_id} is DELIVERING with loaded_meals 100 and two stops: ${st1} DELIVERED 40 meals at ${s1}, ${st2} DELIVERED 60 meals at ${s2}"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
