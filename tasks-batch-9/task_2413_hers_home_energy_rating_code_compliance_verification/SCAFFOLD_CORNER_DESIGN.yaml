          - concurrency_rules[document-package-draft-stale-rating]
          - validations[priority=10]
          - errors[ERR_STALE_RATING_VERSION]
        distinguishing_aspect: "Reusing the version captured before the first draft returns 412 ERR_STALE_RATING_VERSION and creates no third package; re-reading the rating and retrying with the current version succeeds, and each accepted write moves Rating.version by exactly one."
        test_recipe:
          setup:
            - "Home L-7501 has a CONFIRMED PASSING rating; the version observed at confirmation is captured, and one TAX_CREDIT_45L draft has already consumed that version"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Bristol Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { y_b1: $.data.id }
            - call: "POST /subdivisions"
