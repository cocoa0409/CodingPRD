- rule_id: resource_temporal_overlap
  instances:
  - name: report_period_half_open_adjacency_admitted_and_interior_conflict_detected
    grounds:
    - validations priority 68 -> ERR_REPORT_PERIOD_OVERLAP (409), zero buffer, half-open, adjacency ALLOWED
    - validations priority 23 -> ERR_STALE_CENTER_VERSION (kept satisfied so it cannot mask the overlap rule)
    - state_machines.CertificationReport DRAFT -> SUPERSEDED
    - endpoints.POST /stroke-network/certification-reports
    distinguishing_aspect: 'RESOURCE: the StrokeCenter''s reporting calendar. INTERVAL SEMANTICS: zero buffer, half-open [period_start, period_end), so touching endpoints do NOT conflict — adjacency is ADMITTED on both sides. The exclusion set is also state-filtered: a SUPERSEDED report stops reserving its interval, so the same calendar slot behaves differently depending on another report''s status. Every create carries a freshly re-read expected_center_version so that the higher-priority OCC rule can never be what rejects a request.'
    test_recipe:
      setup:
      - Clock set to 2026-10-05T00:00:00Z; a HUB_PRIMARY centre and a SPOKE centre (reports are filed for the spoke).
      - One CertificationReport for the spoke covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), left in DRAFT. No cases or abstractions exist, so every rate is 0.00 and no arithmetic interferes with the interval logic.
      - The centre version is re-read immediately before every create, so expected_center_version is always current.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-10-05T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
