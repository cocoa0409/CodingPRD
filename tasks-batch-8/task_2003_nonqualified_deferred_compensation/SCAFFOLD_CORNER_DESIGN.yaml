      - name: income_inclusion_credit_before_interest_order
        claim_type: correct_result
        grounds: ["calculations.income_inclusion", "entities.OperationalFailureCase"]
        distinguishing_aspect: "Pinned evaluation order: the 200000 correction credit reduces the base BEFORE interest and 20% tax. base=300000; interest=round_half_up(300000*800*197/3650000)=12953; tax=60000; total=372953. The forbidden gross-first order yields 500000+21589+100000-200000=421589 — a different number, so the order is observable."
        test_recipe:
          setup: ["ACTIVE plan; participant; account (unfunded is fine); failure LATE_PAYMENT amount 500000 dated 2026-01-15; quantify runs at the default clock 2026-08-01 (197 days outstanding)"]
