              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub2_id: $.data.id }
          assert:
            - "Second purchase while CANCEL_SCHEDULED returned HTTP 409 with error_id == ERR_DUPLICATE_ACTIVE_SUBSCRIPTION"
            - "Subscription.${sub1_id}.lifecycle_status == CANCELLED after clock reached 2026-10-01"
            - "Retry purchase returns HTTP 201"
            - "Subscription.${sub2_id}.lifecycle_status == ACTIVE"

      - name: retention_redemption_duration_overlap_gate
        grounds:
          - calculations.retention_eligibility
          - state_machines.RetentionRedemption.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Resource: the subscription's discount slot. Interval semantics:
          duration measured in whole renewal STEPS (months_remaining counting
          down per successful renewal), NOT wall-clock — a fundamentally
          different interval arithmetic from the half-open period windows of
          the sibling instance. While the first redemption occupies the slot
          (ACTIVE), a second redemption — even of a DIFFERENT offer — is
          rejected; exactly at the renewal where months_remaining hits 0 the
          slot frees and the new redemption succeeds.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS subscription; offer SMALL100 (100c, duration 1, max 5, PLATFORM, STANDALONE) redeemed; offer OTHER50 (50c, duration 2, max 5, PLATFORM, STANDALONE) exists; second redemption attempted while first ACTIVE (rejected); renewal at 2026-10-01 SUCCEEDED expires the first; redemption retried (accepted)"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/retention-offers"
              payload: { offer_code: "SMALL100", discount_cents: 100, duration_months: 1, max_redemptions_per_account: 5, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
            - call: "POST /streaming/retention-offers"
              payload: { offer_code: "OTHER50", discount_cents: 50, duration_months: 2, max_redemptions_per_account: 5, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ov2@x.com", full_name: "OV Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "SMALL100" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { red1_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "OTHER50" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "OTHER50" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { red2_id: $.data.id }
          assert:
            - "Second redemption while SMALL100 ACTIVE returned HTTP 422 with error_id == ERR_RETENTION_NOT_ELIGIBLE"
            - "RetentionRedemption.${red1_id}.redemption_status == EXPIRED after the renewal"
            - "Retry redemption returns HTTP 201"
            - "RetentionRedemption.${red2_id}.months_remaining == 2"
            - "Subscription.${sub_id}.price_cents == 749"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: migration_credit_conserved_through_renewal
        grounds:
          - calculations.migration_proration
          - calculations.renewal_collection
          - entities.SubscriberAccount.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity: account credit value in cents. Confirming the
          migration posts credit C=532 (forward action); the subsequent
          renewal consumes exactly min(C, gross)=min(532,1999)=532 of it
          (compensating action); the invariant sum(account_credit_cents) +
          sum(invoice.credit_applied_cents over post-migration invoices) ==
          532 holds, and account_credit_cents == 0 with the renewal invoice
          net == 1999-532 == 1467 — no drift.
        test_recipe:
          setup:
            - "PLATFORM subscriber migrates DPLUS_ADS -> DUO_PREMIUM confirmed at 2026-09-11 (credit 532c posted); clock advanced to 2026-10-01 (billing period end of the SHARED BillingAccount) and renewal run SUCCEEDED for the bundle subscription"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ci1@x.com", full_name: "CI One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_from: $.data.id }
            - call: "POST /streaming/migrations"
              payload: { from_subscription_id: "${sub_from}", target_plan_code: "DUO_PREMIUM" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { mig_id: $.data.id, mig_v: $.data.version }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/migrations/${mig_id}/confirm"
              payload: { expected_migration_version: "${mig_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { inv_id: $.data.invoice_id }
          trigger:
            - call: "GET /streaming/invoices/${inv_id}"
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "SubscriberAccount.${sa_id}.account_credit_cents == 0"
            - "Invoice.${inv_id}.gross_cents == 1999"
            - "Invoice.${inv_id}.credit_applied_cents == 532"
            - "Invoice.${inv_id}.net_cents == 1467"
            - "Invariant: account_credit_cents(0) + sum(post-migration credit_applied_cents)(532) == 532 (the posted proration)"

      - name: revenue_allocation_sum_invariant_under_retry
        grounds:
          - calculations.revenue_allocation
          - state_machines.Invoice.FAILED_to_PAID
          - entities.RevenueAllocation.fields.allocated_cents
        distinguishing_aspect: |
          Conserved quantity: allocated revenue cents. A renewal that FAILS
          then is recovered via retry-payment (forward + compensating pair)
          must leave sum(RevenueAllocation.allocated_cents) == invoice.net_cents
          with EXACTLY one allocation row-set per invoice (no double
          allocation from the failure leg) — distinct conserved quantity
          (allocated revenue vs account credit) from the sibling instance.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DUO_ADS bundle (1099c); renewal at 2026-10-01 FAILED then recovered by retry-payment; the renewal invoice net 1099c"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_ADS", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 1099, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "ci2@x.com", full_name: "CI Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DUO_ADS", dplus_service_profile_id: "${prof_dplus}", hulu_service_profile_id: "${prof_hulu}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { inv_id: $.data.invoice_id }
            - call: "POST /streaming/invoices/${inv_id}/retry-payment"
              as: Subscriber
              as_user_id: "${sa_id}"
          trigger:
            - call: "GET /streaming/invoices/${inv_id}/revenue-allocations"
              as: PlatformAdmin
          assert:
            - "Invoice.${inv_id}.invoice_status == PAID"
            - "count of RevenueAllocation rows for ${inv_id} == 2"
            - "RevenueAllocation DPLUS row allocated_cents == 495"
            - "RevenueAllocation HULU row allocated_cents == 604"
            - "sum(allocated_cents) == Invoice.${inv_id}.net_cents == 1099 (no double allocation across the failure leg)"
