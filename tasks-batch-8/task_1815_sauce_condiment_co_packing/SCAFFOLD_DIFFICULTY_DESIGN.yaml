            - "PackagingComponent.${bx}.available_units == 0"
            - "ProductionRun.${r1}.estimated_charge_cents == 445000 (2000*200 + 15000 + 0.1*2000*50 + 2000*10)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_formula_approved
        grounds:
          - state_machines.ProductionRun.PLANNED_to_CONFIRMED
          - "errors[ERR_FORMULA_NOT_APPROVED]"
        distinguishing_aspect: |
          Entity pair ProductionRun -> Formula: a run may be created from a
          TRIAL_PASSED formula but confirm requires the formula to be APPROVED;
          with the letter submitted but not activated, confirm is rejected.
        test_recipe:
          setup:
            - "Customer c1; ACIDIFIED formula f1 advanced to TRIAL_PASSED (trial passed, letter l1 created but NOT activated); kettle k1; run r1 created from TRIAL_PASSED formula (PLANNED, revision pinned 1)"
          setup_api_calls:
