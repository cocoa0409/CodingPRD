              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_EDITION_CAPACITY_EXCEEDED"
            - "response.http_status == 409"
            - "Notice.${y_id}.status == PROOF_APPROVED"

      - name: insertion_consecutive_week_adjacency_violation
        grounds:
          - validations[priority=8]
          - entities.Insertion.fields.scheduled_date
          - errors[ERR_INSERTION_SPACING_VIOLATION]
        distinguishing_aspect: |
          Interval semantics = EXACT 7-DAY ADJACENCY on the NOTICE's own run (different resource and
          different geometry than aggregate capacity): a manually added insertion on 2026-03-22 sits
          14 days from the nearest existing insertion (2026-03-08), breaking consecutive-week
          adjacency -> ERR_INSERTION_SPACING_VIOLATION. Rejection is by gap distance, not by summed
          occupancy.
        test_recipe:
          setup:
