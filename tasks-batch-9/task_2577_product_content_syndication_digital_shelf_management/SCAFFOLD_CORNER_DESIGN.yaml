  - section: errors
    instances:
      - name: every_unknown_id_returns_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTENT_VERSION_NOT_FOUND]
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_REJECTION_ERROR_NOT_FOUND]
          - errors[ERR_DEPLOYMENT_NOT_FOUND]
          - errors[ERR_ALERT_NOT_FOUND]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: "Each collection reports its own 404 error id rather than a shared generic one, and the id lookup happens before any state or role rule on the same call, so an unknown rejection-error id returns ERR_REJECTION_ERROR_NOT_FOUND and not ERR_REJECTION_ERROR_ALREADY_CLOSED."
        test_recipe:
          setup:
            - "the store is empty apart from the logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "GET /digital-shelf/content-versions/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ContentAuthor
              captures: { e_cv: $.data.error_id }
            - call: "GET /digital-shelf/retailer-listings/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: ContentAuthor
              captures: { e_li: $.data.error_id }
            - call: "POST /digital-shelf/rejection-errors/55555555-5555-4555-8555-555555555555/resolve"
              payload: { resolution_mode: "FIX", resolution_note: "no such row" }
              as: SyndicationOperator
              captures: { e_re: $.data.error_id }
            - call: "GET /digital-shelf/enhanced-deployments/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: ContentAuthor
              captures: { e_dp: $.data.error_id }
            - call: "POST /digital-shelf/shelf-alerts/77777777-7777-4777-8777-777777777777/acknowledge"
              payload: {}
              as: AccountTeamLead
              captures: { e_al: $.data.error_id }
          assert:
            - "every call returns HTTP 404"
            - "${e_cv} == \"ERR_CONTENT_VERSION_NOT_FOUND\""
            - "${e_li} == \"ERR_LISTING_NOT_FOUND\""
            - "${e_re} == \"ERR_REJECTION_ERROR_NOT_FOUND\""
            - "${e_dp} == \"ERR_DEPLOYMENT_NOT_FOUND\""
            - "${e_al} == \"ERR_ALERT_NOT_FOUND\""
            - "every response carries the envelope keys error_id and message and no data payload beyond them"

      - name: pagination_bounds_are_rejected_and_the_upper_limit_is_inclusive
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - validations[priority=7]
        distinguishing_aspect: "limit must sit in 1..100 inclusive and offset must be non-negative: limit 0, limit 101 and offset -1 each return ERR_INVALID_PAGINATION, while limit 100 is accepted, which an exclusive upper bound would have refused."
        test_recipe:
          setup:
            - "exactly one Retailer exists and the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "PageMart", retailer_code: "RETP", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 4, max_concurrent_feed_windows: 1, enhanced_content_requires_approval: false }
              as: ShelfAdmin
              captures: { rp_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/retailers?limit=0&offset=0"
              payload: { limit: 0, offset: 0 }
              as: ShelfAdmin
              captures: { e_p1: $.data.error_id }
            - call: "GET /digital-shelf/retailers?limit=101&offset=0"
              payload: { limit: 101, offset: 0 }
              as: ShelfAdmin
              captures: { e_p2: $.data.error_id }
            - call: "GET /digital-shelf/retailers?limit=10&offset=-1"
              payload: { limit: 10, offset: -1 }
              as: ShelfAdmin
              captures: { e_p3: $.data.error_id }
            - call: "GET /digital-shelf/retailers?limit=100&offset=0"
              payload: { limit: 100, offset: 0 }
              as: ShelfAdmin
          assert:
            - "the first three calls return HTTP 400 with ${e_p1} == ${e_p2} == ${e_p3} == \"ERR_INVALID_PAGINATION\""
            - "the fourth call returns HTTP 200 with meta.total_count == 1, meta.has_more == false and data[0].id == ${rp_id}"

