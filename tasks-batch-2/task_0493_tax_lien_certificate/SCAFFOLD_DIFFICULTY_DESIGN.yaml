        distinguishing_aspect: "Certificate's ACTIVE->FORECLOSURE_PENDING transition depends on the Certificate's own redeem_deadline_at vs the clock (Certificate<->clock pair): before the deadline the transition is forbidden (ERR_REDEMPTION_PERIOD_OPEN)."
        test_recipe:
          setup:
            - "Certificate ACTIVE issued 2026-03-01, redemption 365d. Holder I1 escrow 400000. Clock at 2027-02-01 (before 2027-03-01 deadline)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "CE County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, premium_bidding_enabled: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "CE-1", owner_name: "Owner CE", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
              as: CountyTreasurer
              captures: { parcel_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Investor One", tax_id: "TIN-CE1" }
              as: Investor
              captures: { i1_id: $.data.id }
            - call: "POST /investors/${i1_id}/deposits"
              payload: { amount_cents: 400000 }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "CE Sale", scheduled_at: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /counties/${county_id}/sales/${sale_id}/open"
              payload: {}
              as: CountyTreasurer
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings/${listing_id}/bids"
              payload: { investor_id: "${i1_id}", rate_bps: 1200, expected_listing_version: "${listing_v}" }
              as: Investor
              as_user_id: "${i1_id}"
            - call: "POST /counties/${county_id}/sales/${sale_id}/close"
              payload: {}
              as: CountyTreasurer
            - call: "GET /counties/${county_id}/certificates"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: CountyTreasurer
          trigger:
            - call: "POST /counties/${county_id}/certificates/${cert_id}/deed-applications"
              payload: { applicant_investor_id: "${i1_id}", deed_cost_cents: 30000 }
              as: Investor
              as_user_id: "${i1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_REDEMPTION_PERIOD_OPEN"
            - "Certificate.${cert_id}.status == ACTIVE"

      - name: listing_creation_depends_on_parcel_status
        grounds:
          - state_machines.SaleListing.LISTED_to_WITHDRAWN
          - entities.Parcel.fields.status
          - validations[priority=7]
        distinguishing_aspect: "A SaleListing can only be created from a Parcel whose status is DELINQUENT (SaleListing<->Parcel pair); a parcel already ON_SALE on another LISTED listing cannot be re-listed — a different entity pair than Certificate<->clock."
        test_recipe:
          setup:
            - "Parcel already ON_SALE because it is attached as a LISTED listing on sale S1 (DRAFT). A second listing attempt for the same parcel must be rejected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "CE2 County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, premium_bidding_enabled: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "CE2-1", owner_name: "Owner CE2", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
