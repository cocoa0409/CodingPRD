  - method: POST
    path: "/api/work-orders/{workOrderId}/reschedule"
    description: "Move a WEATHER_HOLD work order to a new sheet/date; OCC on WorkOrder.version"
    roles: [Dispatcher]
    code: 200
    input: [route_sheet_id, scheduled_date, window_start_hour, window_end_hour, drive_minutes_est, expected_work_order_version]
    output: WorkOrder
    side_effects: ["old booking + reservation released; new booking + reservation applied", "DisplacementPlan window recomputed and reset to NOTICE_PENDING", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/start"
    description: "Crew starts a SCHEDULED work order on its service date"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status -> IN_PROGRESS; started_at set"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/finish-application"
    description: "Record actuals and gallons; enters cure"
    roles: [CrewLead]
    code: 200
    input: [actual_area_sqft, actual_crack_ft, actual_pothole_area_sqft, actual_stripe_ft, gallons_used]
    output: WorkOrder
    side_effects: ["execution_status -> CURING; finished_at/cure_until set", "lot reservation consumed", "DisplacementPlan.access_block_end := cure_until"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/complete"
    description: "Complete after cure; generates Invoice (DRAFT) and WarrantyRecord (ACTIVE); updates property seal cycle"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status -> COMPLETED", "Invoice created DRAFT (final pricing)", "WarrantyRecord created ACTIVE", "Property seal-cycle dates updated when applicable"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/cancel"
    description: "Cancel a non-started work order; compensating releases"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status -> CANCELLED", "sheet booking released", "lot reservation released + reorder recompute", "DisplacementPlan -> CANCELLED"]

  # --- DisplacementPlan ---
  - method: GET
    path: "/api/displacement-plans"
    description: "List displacement plans, filterable by work_order_id (1:1 -> array of 0-1)"
    roles: [OfficeAdmin, Dispatcher, CrewLead, Customer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: "DisplacementPlan[]"
    side_effects: []
  - method: GET
    path: "/api/displacement-plans/{planId}"
    description: "Get one displacement plan"
    roles: [OfficeAdmin, Dispatcher, CrewLead, Customer]
    code: 200
    input: []
    output: DisplacementPlan
    side_effects: []
  - method: POST
    path: "/api/displacement-plans/{planId}/send-notice"
    description: "Send (or re-send) the vehicle-displacement notice; enforces 48h lead time"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DisplacementPlan
    side_effects: ["status NOTICE_PENDING|STALE -> NOTICE_SENT; notice_sent_at set"]
  - method: POST
    path: "/api/displacement-plans/{planId}/confirm-cleared"
    description: "Confirm vehicles cleared and access free"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DisplacementPlan
    side_effects: ["status NOTICE_SENT -> CLEARED"]

  # --- Striping (parallel dimension on WorkOrder) ---
  - method: POST
    path: "/api/work-orders/{workOrderId}/striping/plan"
    description: "Submit stall count; computes ADA stalls and striping footage"
    roles: [Estimator]
    code: 200
    input: [stall_count]
    output: WorkOrder
    side_effects: ["striping_status PLANNING -> PLANNED; ada_stalls_required and stripe_linear_ft_computed computed"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/striping/approve"
    description: "Approve the striping layout"
    roles: [Estimator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["striping_status PLANNED -> APPROVED"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/striping/mark-applied"
    description: "Crew marks striping applied (requires CURING or COMPLETED execution)"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["striping_status APPROVED -> APPLIED"]
  - method: POST
    path: "/api/work-orders/{workOrderId}/striping/verify"
    description: "Estimator verifies applied striping"
    roles: [Estimator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["striping_status APPLIED -> VERIFIED"]

  # --- Invoice ---
  - method: GET
    path: "/api/invoices"
    description: "List invoices, filterable by work_order_id and status"
    roles: [OfficeAdmin, Customer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/api/invoices/{invoiceId}"
    description: "Get one invoice"
    roles: [OfficeAdmin, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/api/invoices/{invoiceId}/issue"
    description: "Issue a DRAFT invoice to the customer"
    roles: [OfficeAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> ISSUED; WorkOrder.billing_status -> INVOICED"]
  - method: POST
    path: "/api/invoices/{invoiceId}/pay"
    description: "Pay an ISSUED invoice in full"
    roles: [OfficeAdmin, Customer]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["status -> PAID; WorkOrder.billing_status -> PAID; COMPLETED work order -> CLOSED"]

  # --- Warranty ---
  - method: GET
    path: "/api/warranty-records"
    description: "List warranty records, filterable by work_order_id and property_id"
    roles: [OfficeAdmin, Dispatcher, Customer]
    code: 200
    input: ["work_order_id?", "property_id?", "status?", "limit?", "offset?"]
    output: "WarrantyRecord[]"
    side_effects: []
  - method: GET
    path: "/api/warranty-records/{recordId}"
    description: "Get one warranty record"
    roles: [OfficeAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: WarrantyRecord
    side_effects: []
  - method: POST
    path: "/api/warranty-claims"
    description: "Customer files a claim against an ACTIVE, unexpired warranty"
    roles: [Customer]
    code: 201
    input: [warranty_record_id, claim_type, description]
    output: WarrantyClaim
    side_effects: ["WarrantyRecord ACTIVE -> CLAIM_OPEN"]
  - method: GET
    path: "/api/warranty-claims"
    description: "List claims, filterable by warranty_record_id and status"
    roles: [OfficeAdmin, Dispatcher, Customer]
    code: 200
    input: ["warranty_record_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/api/warranty-claims/{claimId}"
    description: "Get one claim"
    roles: [OfficeAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/api/warranty-claims/{claimId}/investigate"
    description: "Open investigation; records the investigating admin"
    roles: [OfficeAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status OPEN -> INVESTIGATING; investigated_by set"]
  - method: POST
    path: "/api/warranty-claims/{claimId}/approve"
    description: "Approve a claim (different admin than investigator); creates warranty-repair WorkOrder"
    roles: [OfficeAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> APPROVED; repair WorkOrder created (PENDING); repair_work_order_id set"]
  - method: POST
    path: "/api/warranty-claims/{claimId}/deny"
    description: "Deny a claim (different admin than investigator); warranty returns to ACTIVE"
    roles: [OfficeAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> DENIED; WarrantyRecord CLAIM_OPEN -> ACTIVE"]

  # --- Weather ---
  - method: POST
    path: "/api/weather-snapshots"
    description: "Post a forecast/observation; a failing snapshot that is the latest for its target_date cascades matching PUBLISHED route sheets into WEATHER_HOLD"
    roles: [OfficeAdmin, Dispatcher]
    code: 201
    input: [target_date, min_temp_f, max_temp_f, precip_probability_pct, precipitation_mm, source]
    output: WeatherSnapshot
    side_effects: ["cascade: PUBLISHED sheets on target_date -> WEATHER_HOLD when precip_probability_pct > 60 or min_temp_f < 40; their SCHEDULED work orders -> WEATHER_HOLD; their NOTICE_SENT/CLEARED displacement plans -> STALE"]
  - method: GET
    path: "/api/weather-snapshots"
    description: "List weather snapshots, filterable by target_date"
    roles: [OfficeAdmin, Dispatcher, CrewLead]
    code: 200
    input: ["target_date?", "limit?", "offset?"]
    output: "WeatherSnapshot[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a resource owned by a different customer" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, invalid enum, or out-of-range scalar (e.g., discount_pct > 0.30, window hours outside 6..20)" }
  - { id: ERR_INVALID_WINDOW_HOURS, http: 400, condition: "window_end_hour <= window_start_hour or hours outside 6..20" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment id does not exist" }
  - { id: ERR_MATERIAL_NOT_FOUND, http: 404, condition: "Material id does not exist" }
  - { id: ERR_MATERIAL_LOT_NOT_FOUND, http: 404, condition: "Material lot id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Crew id does not exist" }
  - { id: ERR_ROUTE_SHEET_NOT_FOUND, http: 404, condition: "Route sheet id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "Quote id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "Work order id does not exist" }
  - { id: ERR_DISPLACEMENT_PLAN_NOT_FOUND, http: 404, condition: "Displacement plan id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_WARRANTY_RECORD_NOT_FOUND, http: 404, condition: "Warranty record id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "Warranty claim id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_ASSESSMENT_NOT_SUBMITTABLE, http: 409, condition: "submit requires a DRAFT assessment" }
  - { id: ERR_ASSESSMENT_NOT_USABLE, http: 422, condition: "Quote send requires the pinned assessment to still be SUBMITTED" }
  - { id: ERR_ASSESSMENT_EXPIRED, http: 422, condition: "Assessment older than 30 days flips to EXPIRED when referenced" }
  - { id: ERR_ASSESSMENT_PROPERTY_MISMATCH, http: 422, condition: "assessment_id belongs to a different property than property_id" }
  - { id: ERR_QUOTE_NOT_EDITABLE, http: 409, condition: "PATCH requires quote in DRAFT or REVISION_REQUESTED" }
  - { id: ERR_QUOTE_NOT_SENDABLE, http: 409, condition: "send requires quote in DRAFT" }
  - { id: ERR_QUOTE_NOT_ACCEPTABLE, http: 409, condition: "accept/decline/request-revision requires quote in SENT" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote past expires_on flips to EXPIRED when acted upon" }
  - { id: ERR_STRIPING_COMMERCIAL_ONLY, http: 422, condition: "Striping scope or striping plan on a RESIDENTIAL_DRIVEWAY property" }
  - { id: ERR_STRIPING_NOT_PLANNABLE, http: 409, condition: "Striping action requires the matching striping_status" }
  - { id: ERR_STRIPING_NOT_VERIFIED, http: 409, condition: "complete requires VERIFIED striping when include_striping" }
  - { id: ERR_PRICE_BELOW_COST_FLOOR, http: 422, condition: "Discounted quote total below material-cost + labor floor" }
  - { id: ERR_WEATHER_DATA_MISSING, http: 422, condition: "No weather snapshot exists for the service date" }
  - { id: ERR_WEATHER_WINDOW_VIOLATION, http: 422, condition: "Latest snapshot for the service date fails the material's temperature/precipitation thresholds" }
  - { id: ERR_OUTSIDE_SEASON, http: 422, condition: "scheduled_date falls outside [04-01, 10-31]" }
  - { id: ERR_DATE_IN_PAST, http: 422, condition: "scheduled_date before current clock date, or start attempted on a date other than scheduled_date" }
  - { id: ERR_RESEAL_INTERVAL_NOT_MET, http: 422, condition: "Non-warranty seal job scheduled before Property.next_seal_eligible_on" }
  - { id: ERR_ROUTE_SHEET_NOT_SCHEDULABLE, http: 409, condition: "Sheet not OPEN/PUBLISHED, crew inactive, or service_date mismatch" }
  - { id: ERR_ROUTE_SHEET_NOT_PUBLISHABLE, http: 409, condition: "publish requires OPEN or WEATHER_HOLD" }
  - { id: ERR_ROUTE_SHEET_NOT_CANCELLABLE, http: 409, condition: "cancel requires OPEN/PUBLISHED/WEATHER_HOLD with no non-terminal work orders" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "booked_sqft + candidate area > capacity_sqft" }
  - { id: ERR_ROUTE_DRIVE_LIMIT_EXCEEDED, http: 409, condition: "total_drive_minutes + candidate drive > 180" }
  - { id: ERR_CREW_WINDOW_OVERLAP, http: 409, condition: "Half-open work-window collision with another work order on the same sheet" }
  - { id: ERR_ACCESS_WINDOW_OVERLAP, http: 409, condition: "Cure-buffered access-block collision with another work order on the same property" }
  - { id: ERR_MATERIAL_LOT_UNAVAILABLE, http: 409, condition: "Lot QUARANTINED or DEPLETED when referenced" }
  - { id: ERR_MATERIAL_LOT_IN_USE, http: 409, condition: "Quarantine attempted with reserved_gallons > 0" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 422, condition: "on_hand_gallons below required gallons at schedule, or gallons_used above the reservation at finish" }
  - { id: ERR_WORK_ORDER_NOT_SCHEDULABLE, http: 409, condition: "schedule/reschedule requires PENDING or WEATHER_HOLD respectively" }
  - { id: ERR_WORK_ORDER_NOT_STARTABLE, http: 409, condition: "start requires SCHEDULED" }
  - { id: ERR_WORK_ORDER_NOT_FINISHABLE, http: 409, condition: "finish-application requires IN_PROGRESS; complete requires CURING; mark-applied requires CURING/COMPLETED execution" }
  - { id: ERR_WORK_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires PENDING, SCHEDULED, or WEATHER_HOLD" }
  - { id: ERR_DISPLACEMENT_NOT_CLEARED, http: 409, condition: "start requires DisplacementPlan in CLEARED" }
  - { id: ERR_PLAN_NOT_NOTIFIABLE, http: 409, condition: "send-notice requires NOTICE_PENDING or STALE" }
  - { id: ERR_PLAN_NOT_NOTICED, http: 409, condition: "confirm-cleared requires NOTICE_SENT" }
  - { id: ERR_NOTICE_LEAD_TIME_SHORT, http: 422, condition: "Notice sent less than 48h before access_block_start" }
  - { id: ERR_CURE_INCOMPLETE, http: 422, condition: "complete attempted before cure_until" }
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "issue requires DRAFT" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "pay requires ISSUED" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "amount_cents differs from invoice total_cents" }
  - { id: ERR_WARRANTY_NOT_ACTIVE, http: 409, condition: "Claim requires WarrantyRecord in ACTIVE" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Claim after expires_on flips the record to EXPIRED" }
  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "investigate requires OPEN; approve/deny require INVESTIGATING" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/denier must differ from the claim's investigator" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OfficeAdmin
    description: "Back-office administrator: customers, properties, materials, lots, crews, invoices, warranty adjudication, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/properties"
      - "POST /api/materials"
      - "POST /api/material-lots and /quarantine and /record-waste"
      - "POST /api/crews"
      - "POST /api/invoices/{id}/issue"
      - "POST /api/warranty-claims/{id}/investigate, /approve, /deny"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET lists/details across all resources"
      - "POST /api/weather-snapshots (shared with Dispatcher)"
      - "POST /api/invoices/{id}/pay (shared with Customer)"
  - name: Estimator
    description: "Field estimator: site assessments, quotes, striping plans and verification"
    identity: opaque
    exclusive_operations:
      - "POST /api/assessments and /submit"
      - "POST /api/quotes, PATCH /api/quotes/{id}, POST /api/quotes/{id}/send"
      - "POST /api/work-orders/{id}/striping/plan, /approve, /verify"
    shared_operations:
      - "GET customers/properties/assessments/materials/quotes/work-orders"
  - name: Dispatcher
    description: "Operations dispatcher: route sheets, scheduling, displacement notices, weather postings"
    identity: opaque
    exclusive_operations:
      - "POST /api/route-sheets and /publish and /cancel"
      - "POST /api/work-orders/{id}/schedule, /reschedule, /cancel"
      - "POST /api/displacement-plans/{id}/send-notice, /confirm-cleared"
    shared_operations:
      - "GET crews/route-sheets/work-orders/material-lots/utilization"
      - "POST /api/weather-snapshots (shared with OfficeAdmin)"
  - name: CrewLead
    description: "Crew leader on site: starts work, records actuals, completes jobs, marks striping applied"
    identity: opaque
    exclusive_operations:
      - "POST /api/work-orders/{id}/start, /finish-application, /complete"
      - "POST /api/work-orders/{id}/striping/mark-applied"
    shared_operations:
      - "GET properties/assessments/route-sheets/work-orders/displacement-plans/weather-snapshots"
  - name: Customer
    description: "Property-owning customer: accepts/declines quotes, files warranty claims, pays invoices"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /api/quotes/{id}/accept, /decline, /request-revision (own property only)"
      - "POST /api/warranty-claims (own property's warranty only)"
    shared_operations:
      - "POST /api/invoices/{id}/pay (own invoice; shared with OfficeAdmin)"
      - "GET own properties, quotes, work orders, displacement plans, invoices, warranty records/claims"
