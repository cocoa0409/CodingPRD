  - rule_id: transitive_cascade
    instances:
      - name: reject_series_rate_posture_blocks_acquisition_depth3
        grounds:
          - state_machines.ImageSeries.CAPTURING_to_REPEATED
          - calculations.repeat_reject_rate
          - calculations.posture_derivation
          - state_machines.ImagingExam.CHECKED_IN_to_ACQUIRING
        distinguishing_aspect: |
          Depth ≥3 cascade triggered by a series finalize: finalize(REPEATED) mutates center
          counters -> counters push repeat_reject_rate_pct to 8.33 (>= 8.0) -> posture flips to
          QUALITY_HOLD -> a different exam's start-acquisition is rejected ERR_CENTER_QUALITY_HOLD.
          Each hop is caused by the prior hop, not the original finalize.
        test_recipe:
          setup:
            - "Center C threshold 8.0. One XRAY modality, two XRAY rooms, one tech credentialed XRAY, plus nurse+rad."
            - "Exam E1 acquiring with 11 ACCEPTED series finalized and 1 still CAPTURING; a second order E2 booked, checked-in, ready to start-acquisition."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 8.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
