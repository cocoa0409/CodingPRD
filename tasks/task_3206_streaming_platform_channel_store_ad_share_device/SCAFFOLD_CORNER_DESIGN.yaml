        distinguishing_aspect: "With spent 8000 of a 10000 budget, a batch costing 3000 (3000 impressions at cpm 1000) would overshoot and fails with 422 ERR_BUDGET_EXHAUSTED; a 2000 batch lands exactly on the budget and completes the campaign."
        test_recipe:
          setup:
            - "Publisher P, channel PUBLISHED, campaign K ACTIVE with budget 10000 and 8000 already spent."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Bud Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Bud Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 10000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 8000, cpm_cents: 1000 }
              as: AdOps
          trigger:
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 3000, cpm_cents: 1000 }
              as: AdOps
              captures: { err: $.data.error_id }
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 2000, cpm_cents: 1000 }
              as: AdOps
          assert:
            - "err == ERR_BUDGET_EXHAUSTED with http 422 and spent_cents still == 8000 (the failed batch applied nothing)"
            - "After the exact-fit batch: spent_cents == 10000 and status == COMPLETED"

      - name: campaign_start_outside_flight_rejected
        claim_type: violation_to_error
        grounds:
