            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "PARTIAL", exchange_amount_cents: 10000000, new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "PARTIAL", exchange_amount_cents: 9999999, new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "Case A: HTTP 409 with error_id == ERR_PARTIAL_AMOUNT_INVALID (amount == value is FULL semantics, not PARTIAL)"
            - "Case A remains DRAFT"
