        distinguishing_aspect: "After the clock sweep expires the lot (now >= expires_at), allocation fails with ERR_LOT_INVALID_STATE — a state error, not the temporal shelf-life error (the lot already left ACTIVE)."
        test_recipe:
          setup: ["Lot landed 2026-08-01T06:00:00Z, fresh 72h (expires 2026-08-04T06:00:00Z); order CONFIRMED with 10.00 kg line; clock then advanced to 2026-08-05T00:00:00Z"]
