              captures: { pubX: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubX}", title: "ShowX", category: "NEWS" }
              as: Publisher
              as_user_id: "${pubX}"
              captures: { showX: $.data.id }
            - call: "POST /shows/${showX}/activate"
