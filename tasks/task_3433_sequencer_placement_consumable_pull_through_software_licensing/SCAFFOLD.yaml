# =============================================================================
# Scaffold: Sequencer Placement, Consumable Pull-Through & Software Licensing
# Difficulty target: beyond-Expert (dense coupling, 13 entities, 48 endpoints)
# =============================================================================

scenario: |
  Sequencer Placement, Consumable Pull-Through & Software Licensing (Illumina): instrument
  sales and placement programs including reagent commitments that subsidize hardware,
  consumable kit configuration by run type with flow cell and chemistry versions determining
  sequencing capacity, instrument installed base management with software updates that unlock
  new run modes and workflows, service and support contracts with uptime commitments and
  reagent guarantee provisions, informatics software licensing with sample-based pricing and
  cloud analysis credits, customer transition programs when a new instrument generation
  obsoletes existing chemistry with trade-in offers, regulatory versions of instruments and
  assays for clinical use with separate quality systems, supply forecasting for reagents with
  cold chain and lot-to-lot consistency.

domain_name: sequencer-placement
api_prefix: /genomics

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # reagent commitment pools, FEFO lot allocation, cold-chain weekly capacity
  secondary_archetype: compliance_audit      # RUO vs CLINICAL regulatory gating with segregation of duties on approvals
  complexity_layers:
    - optimistic_concurrency                 # OCC on PlacementProgram.version (amendments) and SupplyForecast.version (freeze)
    - cascading_side_effects                 # lot QC failure -> order backorder -> program pipeline; trade-in -> decommission -> contract termination -> credit
    - dual_variant_calculation               # trade-in provisional vs final; commitment accrual vs final; coverage optimistic vs conservative
    - version_pinning_on_approval            # program pins kit price book at approval; license pins sample rates at activation
    - rate_threshold_triggers                # uptime credit tiers, sample pricing tiers, subsidy cap
  entity_topology: flat                      # all resources top-level under /genomics, FK references in bodies
  state_machine_shape: cyclic                # amendment cycle, service cycle, suspend/resume cycle; plus branching elsewhere
  relationship_patterns:
    - one_to_many                            # Account -> Instruments/Orders/Programs/...
    - cross_aggregate                        # RunRecord references Instrument + ReagentLot + SoftwareLicense
  role_model: peer_roles                     # per-resource ownership; segregation_of_duties constraints on approve/appraise steps
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution display name" }
      - { name: regulatory_class, type: enum, source: input, description: "RUO | CLINICAL — governs which instruments/kits the account may operate" }
      - { name: region, type: string, source: input, description: "Free-form region code" }
      - { name: credit_hold, type: boolean, source: computed, description: "true iff the account has at least one PlacementProgram in BREACHED state; blocks reagent order submission" }
      - { name: credit_balance_cents, type: integer, source: system, description: "Promotional/service/trade-in credit balance; starts at 0; credited by uptime reconciliations, trade-in completion, and order returns", default: 0 }

  - name: InstrumentModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique catalog model code", constraints: "unique across InstrumentModel" }
      - { name: generation, type: integer, source: input, description: "Instrument generation number, >= 1; drives trade-in gap and compatibility gates" }
      - { name: base_price_cents, type: integer, source: input, description: "Catalog list price of the instrument" }
      - { name: supported_chemistry_versions, type: array, source: input, description: "Array of chemistry versions the model can run: members of V1|V2|V3" }
      - { name: base_run_modes, type: array, source: input, description: "Run modes unlocked at factory: members of STD_SHORT|STD_LONG|HIGH_OUTPUT" }
      - { name: support_status, type: enum, source: input, description: "CURRENT | SUNSET | OBSOLETE; OBSOLETE models reject new instrument registration", default: "CURRENT" }

  - name: ReagentKit
    parent: null
    common_fields: true
    fields:
      - { name: kit_code, type: string, source: input, description: "Unique catalog kit code", constraints: "unique across ReagentKit" }
      - { name: run_type, type: enum, source: input, description: "STD_SHORT | STD_LONG | HIGH_OUTPUT — must equal a run record's run_mode" }
      - { name: flow_cell_version, type: enum, source: input, description: "FC_LOW | FC_MID | FC_HIGH — capacity base factor" }
      - { name: chemistry_version, type: enum, source: input, description: "V1 | V2 | V3 — capacity multiplier and instrument compatibility" }
      - { name: regulatory_clearance, type: enum, source: input, description: "RUO_ONLY | IVD — IVD required for runs on CLINICAL instruments" }
      - { name: shelf_life_days, type: integer, source: input, description: "Shelf life; lot expiry_date = manufacture_date + shelf_life_days" }
      - { name: cold_chain_class, type: enum, source: input, description: "FROZEN_20 | REFRIGERATED_4 — weekly forecast capacity bucket" }
      - { name: price_cents, type: integer, source: input, description: "Current catalog unit price; mutable via PATCH; placement programs pin a snapshot at approval" }
      - { name: samples_per_kit, type: integer, source: input, description: "Nominal samples processable per kit unit; feeds license provisional billing" }
      - { name: min_model_generation, type: integer, source: input, description: "Minimum instrument generation that may consume this kit" }
      - { name: capacity_gb, type: number, source: computed, description: "Sequencing capacity = FLOW_CELL_BASE_GB[flow_cell_version] * CHEMISTRY_THROUGHPUT_MULT[chemistry_version], 1 decimal" }

  - name: SoftwareUpdate
    parent: null
    common_fields: true
    fields:
      - { name: update_version, type: string, source: input, description: "Unique software version string", constraints: "unique across SoftwareUpdate" }
      - { name: min_model_generation, type: integer, source: input, description: "Minimum instrument generation the update may be applied to" }
      - { name: unlocks_run_modes, type: array, source: input, description: "Run modes unlocked on application: members of STD_SHORT|STD_LONG|HIGH_OUTPUT" }
      - { name: clinical_validation_status, type: enum, source: input, description: "VALIDATED | NOT_VALIDATED — CLINICAL instruments require VALIDATED" }
      - { name: release_state, type: enum, source: system, description: "RELEASED | WITHDRAWN; initial RELEASED", default: "RELEASED" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: model_id, type: string, source: input, description: "FK -> InstrumentModel.id" }
      - { name: serial_number, type: string, source: input, description: "Hardware serial number", constraints: "unique across Instrument" }
      - { name: regulatory_mode, type: enum, source: input, description: "RUO | CLINICAL; CLINICAL accounts may only register CLINICAL instruments" }
      - { name: installed_at, type: datetime, source: input, description: "Optional install timestamp for installed-base registration; if omitted, set to logical clock at INSTALL", default: null }
      - { name: install_state, type: enum, source: system, description: "ORDERED | SHIPPED | INSTALLED | OPERATIONAL | DOWN_FOR_SERVICE | DECOMMISSIONED; initial ORDERED", default: "ORDERED" }
      - { name: software_version, type: string, source: system, description: "Currently applied software version; starts at 1.0.0", default: "1.0.0" }
      - { name: applied_update_ids, type: array, source: system, description: "SoftwareUpdate ids applied, in application order" }
      - { name: unlocked_run_modes, type: array, source: computed, description: "model.base_run_modes UNION unlocks_run_modes of applied updates whose release_state is RELEASED" }
      - { name: service_windows, type: array, source: system, description: "Array of {opened_at, closed_at} downtime windows written by SERVICE_OPEN/SERVICE_CLOSE; closed_at null while open" }
      - { name: decommissioned_at, type: datetime, source: system, description: "Set on DECOMMISSION; null otherwise", default: null }

  - name: PlacementProgram
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: term_months, type: integer, source: input, description: "Program term: one of 12 | 24 | 36" }
      - { name: committed_annual_reagent_cents, type: integer, source: input, description: "Customer's committed annual reagent spend" }
      - { name: subsidy_pct, type: number, source: input, description: "Hardware subsidy fraction in (0, 1]" }
      - { name: hardware_lines, type: array, source: input, description: "Array of {description, quantity, unit_price_cents} the subsidy applies to" }
      - { name: program_state, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | ACTIVE | UNDER_AMENDMENT | COMPLETED | BREACHED; initial DRAFT", default: "DRAFT" }
      - { name: subsidy_pool_cents, type: integer, source: computed, description: "Computed at review SUBMIT via subsidy_pool_calc (per-line round, then sum)" }
      - { name: pinned_kit_prices, type: object, source: system, description: "Snapshot {kit_code: price_cents} of the whole kit catalog taken at review APPROVE; attributed orders bill at pinned prices" }
      - { name: committed_total_cents, type: integer, source: computed, description: "committed_annual_reagent_cents * term_months / 12" }
      - { name: delivered_spend_cents, type: integer, source: system, description: "Attributed spend of DELIVERED orders minus RETURNED; maintained by order transitions", default: 0 }
      - { name: pipeline_spend_cents, type: integer, source: system, description: "Attributed spend of orders currently ALLOCATED or SHIPPED; released on backorder/cancel", default: 0 }
      - { name: shortfall_flag, type: boolean, source: computed, description: "Set by commitment_reconciliation_calc at close-period (accrual variant)", default: false }
      - { name: penalty_cents, type: integer, source: system, description: "Shortfall penalty posted at final period close", default: 0 }
      - { name: period_index, type: integer, source: system, description: "Current open period (1-based); increments on close-period", default: 1 }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the AccountManager who created the program (segregation of duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAdmin who approved; null until APPROVE", default: null }
      - { name: pending_amendment, type: object, source: system, description: "While UNDER_AMENDMENT: {new_committed_annual_reagent_cents, new_subsidy_pct, created_by_user_id}; null otherwise", default: null }

  - name: ReagentLot
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> ReagentKit.id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number (lot-to-lot identity)" }
      - { name: manufacture_date, type: datetime, source: input, description: "Manufacture timestamp" }
      - { name: quantity_units, type: integer, source: input, description: "Total kit units in the lot" }
      - { name: qc_status, type: enum, source: system, description: "PENDING_QC | QC_PASSED | QC_FAILED | EXPIRED; initial PENDING_QC", default: "PENDING_QC" }
      - { name: cold_chain_status, type: enum, source: system, description: "INTACT | BREACHED; initial INTACT", default: "INTACT" }
      - { name: expiry_date, type: datetime, source: computed, description: "manufacture_date + kit.shelf_life_days" }
      - { name: reserved_units, type: integer, source: system, description: "Units reserved by ALLOCATED orders", default: 0 }
      - { name: consumed_units, type: integer, source: system, description: "Units consumed by delivered orders and run records", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "quantity_units - reserved_units - consumed_units" }

  - name: ReagentOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; must equal LabOperator X-User-ID" }
      - { name: program_id, type: string, source: input, description: "FK -> PlacementProgram.id; optional; when present the order attributes spend to the program at pinned prices", default: null }
      - { name: lines, type: array, source: input, description: "Array of {kit_code, quantity}; quantity >= 1" }
      - { name: order_state, type: enum, source: system, description: "DRAFT | ALLOCATED | BACKORDERED | SHIPPED | DELIVERED | CANCELLED | RETURNED; initial DRAFT", default: "DRAFT" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over lines of quantity * unit price (pinned program price when program_id set, else current kit price); computed at SUBMIT" }
      - { name: attributed_total_cents, type: integer, source: computed, description: "Portion attributed to the placement program; equals total_cents when program_id set, else 0" }
      - { name: line_reservations, type: array, source: system, description: "Array of {kit_code, lot_id, quantity} produced by FEFO allocation at SUBMIT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at SUBMIT", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Logical clock at DELIVER; determines forecast-variance ISO week", default: null }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; coverage attaches to exactly one instrument" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage window end (exclusive) — half-open [start, end) semantics" }
      - { name: committed_uptime_percent, type: number, source: input, description: "Committed uptime, e.g. 99.90; credit triggers when measured uptime is strictly below" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly service fee; credit base" }
      - { name: annual_credit_cap_cents, type: integer, source: input, description: "Cap on total uptime credits issued per coverage year" }
      - { name: reagent_guarantee, type: boolean, source: input, description: "Whether the contract carries the reagent supply guarantee provision", default: false }
      - { name: contract_state, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED; initial DRAFT", default: "DRAFT" }
      - { name: credits_issued_ytd_cents, type: integer, source: system, description: "Uptime credits issued so far in the current coverage year", default: 0 }
      - { name: last_reconciliation_end, type: datetime, source: system, description: "End of the last reconciled measurement period; null until first reconciliation", default: null }
      - { name: terminated_reason, type: enum, source: system, description: "AUTO_DECOMMISSION when terminated by instrument decommission cascade; null otherwise", default: null }

  - name: SoftwareLicense
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: license_state, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED; initial DRAFT", default: "DRAFT" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock at ACTIVATE; anchors 30-day billing periods", default: null }
      - { name: pinned_sample_rate_cents, type: object, source: system, description: "{T1: 250, T2: 200, T3: 150} snapshot taken at ACTIVATE from the catalog rate constants" }
      - { name: credit_ledger, type: array, source: system, description: "Append-only entries {entry_type: GRANT|PURCHASE|CONSUMPTION|OFFSET|EXPIRY, credits (signed int), granted_on (date, grant entries only), created_at}" }
      - { name: credits_balance, type: integer, source: computed, description: "Sum of credit_ledger entry credits; never negative" }
      - { name: samples_this_period, type: integer, source: system, description: "Billable samples accumulated in the open billing period", default: 0 }
      - { name: period_index, type: integer, source: system, description: "Current open billing period (1-based)", default: 1 }

  - name: RunRecord
    parent: null
    common_fields: false
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the lot the run consumes one kit unit from" }
      - { name: license_id, type: string, source: input, description: "FK -> SoftwareLicense.id the run bills samples and cloud credits to" }
      - { name: run_at, type: datetime, source: input, description: "Run timestamp; billing-close filters by run_at within the period window [activated_at + (period_index-1)*30d, +30d)" }
      - { name: run_mode, type: enum, source: input, description: "STD_SHORT | STD_LONG | HIGH_OUTPUT; must be in instrument.unlocked_run_modes and equal the lot kit's run_type" }
      - { name: analysis_mode, type: enum, source: input, description: "LOCAL | CLOUD_STANDARD | CLOUD_DEEP; cloud modes consume credits" }
      - { name: samples_count, type: integer, source: input, description: "Samples on the run; >= 0" }
      - { name: output_gb, type: number, source: input, description: "Reported output; informational" }
      - { name: outcome, type: enum, source: input, description: "SUCCESS | PARTIAL | FAILED; FAILED consumes the lot unit but bills 0 samples and 0 credits" }
      - { name: credits_consumed, type: integer, source: system, description: "Cloud credits debited for this run (0 for LOCAL or FAILED)", default: 0 }

  - name: TransitionProgram
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: old_instrument_id, type: string, source: input, description: "FK -> Instrument.id; the instrument traded in" }
      - { name: new_model_id, type: string, source: input, description: "FK -> InstrumentModel.id; the new-generation model being moved to" }
      - { name: enrollment_window_end, type: datetime, source: input, description: "Enrollment must occur at or before this instant" }
      - { name: program_state, type: enum, source: system, description: "ENROLLED | APPRAISED | COMPLETED | EXPIRED; initial ENROLLED", default: "ENROLLED" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Trade-in credit quoted at enrollment via tradein_credit_calc provisional variant" }
      - { name: condition_flags, type: array, source: input, description: "Appraisal findings: members of COSMETIC_DAMAGE | FUNCTIONAL_DEFECT | MISSING_ACCESSORIES" }
      - { name: final_credit_cents, type: integer, source: system, description: "Trade-in credit after appraisal via tradein_credit_calc final variant; null until APPRAISE", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the AccountManager who enrolled (segregation of duties anchor)" }
      - { name: appraised_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAdmin who appraised", default: null }
      - { name: appraised_at, type: datetime, source: system, description: "Logical clock at APPRAISE; APPRAISED programs expire 30 days later", default: null }

  - name: SupplyForecast
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: lines, type: array, source: input, description: "Array of {kit_code, week_start, quantity}; week_start must be a Monday 00:00:00Z within the 26-week horizon" }
      - { name: forecast_state, type: enum, source: system, description: "DRAFT | SUBMITTED | FROZEN | SUPERSEDED; initial DRAFT", default: "DRAFT" }
      - { name: variance_lines, type: array, source: computed, description: "Computed on single-read when include_variance=true via forecast_variance_calc; entries {kit_code, week_start, forecast_quantity, actual_delivered_units, variance, coverage_optimistic_units, coverage_conservative_units}; empty array otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Instrument
    initial_state: ORDERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ORDERED
        to: SHIPPED
        trigger: "POST /genomics/instruments/{id}/events {action: SHIP}"
        actor: FieldServiceEngineer
        preconditions: ["install_state == ORDERED"]
        side_effects: ["increments Instrument.version by 1"]
      - from: SHIPPED
        to: INSTALLED
        trigger: "POST /genomics/instruments/{id}/events {action: INSTALL}"
        actor: FieldServiceEngineer
        preconditions: ["install_state == SHIPPED"]
        side_effects: ["if installed_at is null, set installed_at = current logical clock", "increments Instrument.version by 1"]
      - from: INSTALLED
        to: OPERATIONAL
        trigger: "POST /genomics/instruments/{id}/events {action: COMMISSION}"
        actor: FieldServiceEngineer
        preconditions: ["install_state == INSTALLED"]
        side_effects: ["increments Instrument.version by 1"]
      - from: OPERATIONAL
        to: DOWN_FOR_SERVICE
        trigger: "POST /genomics/instruments/{id}/events {action: SERVICE_OPEN}"
        actor: FieldServiceEngineer
        preconditions: ["install_state == OPERATIONAL"]
        side_effects: ["append service_windows entry {opened_at: current logical clock, closed_at: null}", "increments Instrument.version by 1"]
      - from: DOWN_FOR_SERVICE
        to: OPERATIONAL
        trigger: "POST /genomics/instruments/{id}/events {action: SERVICE_CLOSE}"
        actor: FieldServiceEngineer
        preconditions: ["install_state == DOWN_FOR_SERVICE", "an open service window (closed_at null) exists"]
        side_effects: ["set closed_at = current logical clock on the latest open service window", "increments Instrument.version by 1"]
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /genomics/instruments/{id}/events {action: DECOMMISSION} or transition-program COMPLETE cascade"
        actor: AccountManager
        preconditions: ["install_state in {OPERATIONAL, DOWN_FOR_SERVICE}"]
        side_effects:
          - "set decommissioned_at = current logical clock; close any open service window at the same instant"
          - "CASCADE hop 2: every ServiceContract with instrument_id == this instrument and contract_state == ACTIVE transitions to TERMINATED with terminated_reason = AUTO_DECOMMISSION"
          - "CASCADE hop 3: each so-terminated contract runs a final uptime_credit_calc over [max(coverage_start, last_reconciliation_end), decommission instant); the resulting credit is added to that contract.credits_issued_ytd_cents AND to Account.credit_balance_cents of the contract's account"
          - "increments Instrument.version by 1"
      - from: DOWN_FOR_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /genomics/instruments/{id}/events {action: DECOMMISSION} or transition-program COMPLETE cascade"
        actor: AccountManager
        preconditions: ["install_state in {OPERATIONAL, DOWN_FOR_SERVICE}"]
        side_effects: ["same cascade as OPERATIONAL -> DECOMMISSIONED"]

  - entity: PlacementProgram
    initial_state: DRAFT
    terminal_states: [COMPLETED, BREACHED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /genomics/placement-programs/{id}/review {action: SUBMIT}"
        actor: AccountManager
        preconditions: ["program_state == DRAFT", "subsidy_pool_calc result <= SUBSIDY_CAP_PCT * committed_annual_reagent_cents (else ERR_SUBSIDY_CAP_EXCEEDED)"]
        side_effects: ["recompute subsidy_pool_cents via subsidy_pool_calc", "increments PlacementProgram.version by 1"]
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /genomics/placement-programs/{id}/review {action: APPROVE}"
        actor: FinanceAdmin
        preconditions: ["program_state == PENDING_APPROVAL", "approver X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["snapshot pinned_kit_prices = current price_cents of every ReagentKit", "set approved_by_user_id", "increments PlacementProgram.version by 1"]
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /genomics/placement-programs/{id}/review {action: REJECT}"
        actor: FinanceAdmin
        preconditions: ["program_state == PENDING_APPROVAL"]
        side_effects: ["increments PlacementProgram.version by 1"]
      - from: ACTIVE
        to: UNDER_AMENDMENT
        trigger: "POST /genomics/placement-programs/{id}/amendments {action: CREATE}"
        actor: AccountManager
        preconditions: ["program_state == ACTIVE", "expected_program_version == current version (else ERR_STALE_VERSION 412)"]
        side_effects: ["store pending_amendment = {new_committed_annual_reagent_cents, new_subsidy_pct, created_by_user_id}", "increments PlacementProgram.version by 1"]
      - from: UNDER_AMENDMENT
        to: ACTIVE
        trigger: "POST /genomics/placement-programs/{id}/amendments {action: APPROVE}"
        actor: FinanceAdmin
        preconditions: ["program_state == UNDER_AMENDMENT", "approver X-User-ID != pending_amendment.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["apply pending_amendment values to committed_annual_reagent_cents and/or subsidy_pct", "clear pending_amendment to null", "recompute subsidy_pool_cents via subsidy_pool_calc", "increments PlacementProgram.version by 1"]
      - from: UNDER_AMENDMENT
        to: ACTIVE
        trigger: "POST /genomics/placement-programs/{id}/amendments {action: REJECT}"
        actor: FinanceAdmin
        preconditions: ["program_state == UNDER_AMENDMENT"]
        side_effects: ["clear pending_amendment to null without applying", "increments PlacementProgram.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: on ReagentOrder DELIVER side effect when program.delivered_spend_cents >= committed_total_cents"
        actor: system
        preconditions: ["program_state == ACTIVE", "delivered_spend_cents >= committed_total_cents after the delivery posts"]
        side_effects: ["program_state -> COMPLETED; further orders referencing this program are rejected at SUBMIT with ERR_PROGRAM_NOT_ACTIVE"]
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /genomics/placement-programs/{id}/close-period when period_index == term_months (final close)"
        actor: FinanceAdmin
        preconditions: ["program_state == ACTIVE", "commitment_reconciliation_calc FINAL variant shortfall_cents > 0"]
        side_effects: ["post penalty_cents = round_half_up(shortfall_cents * 0.10, 0)", "CASCADE: Account.credit_hold of program's account becomes true", "increments PlacementProgram.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /genomics/placement-programs/{id}/close-period when period_index < term_months (interim close)"
        actor: FinanceAdmin
        preconditions: ["program_state == ACTIVE"]
        side_effects: ["run commitment_reconciliation_calc ACCRUAL variant; set shortfall_flag", "increment period_index by 1", "increments PlacementProgram.version by 1"]
        note: "Final close with shortfall_cents == 0 transitions ACTIVE -> COMPLETED instead of BREACHED"

  - entity: ReagentLot
    initial_state: PENDING_QC
    terminal_states: [QC_FAILED, EXPIRED]
    transitions:
      - from: PENDING_QC
        to: QC_PASSED
        trigger: "POST /genomics/reagent-lots/{id}/qc {outcome: PASSED}"
        actor: SupplyPlanner
        preconditions: ["qc_status == PENDING_QC"]
        side_effects:
          - "auto re-allocation sweep: BACKORDERED orders whose lines can now be fully satisfied from usable lots are re-allocated in created_at ASC order (FEFO per line), transitioning each re-allocated order BACKORDERED -> ALLOCATED and adding its attributed_total_cents back to its program's pipeline_spend_cents"
          - "increments ReagentLot.version by 1"
      - from: PENDING_QC
        to: QC_FAILED
        trigger: "POST /genomics/reagent-lots/{id}/qc {outcome: FAILED}"
        actor: SupplyPlanner
        preconditions: ["qc_status == PENDING_QC"]
        side_effects: ["increments ReagentLot.version by 1"]
      - from: QC_PASSED
        to: QC_FAILED
        trigger: "POST /genomics/reagent-lots/{id}/qc {outcome: FAILED} (field corrective action on a released lot)"
        actor: SupplyPlanner
        preconditions: ["qc_status == QC_PASSED"]
        side_effects:
          - "CASCADE hop 1: release every reservation on this lot (line_reservations entries removed, reserved_units -= quantity)"
          - "CASCADE hop 2: each ReagentOrder that held a reservation on this lot and cannot be fully re-allocated from remaining usable lots transitions ALLOCATED -> BACKORDERED and its attributed_total_cents is subtracted from its program's pipeline_spend_cents (hop 3 touches PlacementProgram)"
          - "increments ReagentLot.version by 1"
      - from: PENDING_QC
        to: PENDING_QC
        trigger: "POST /genomics/reagent-lots/{id}/qc {outcome: COLD_CHAIN_BREACH}"
        actor: SupplyPlanner
        preconditions: ["qc_status in {PENDING_QC, QC_PASSED}"]
        side_effects: ["set cold_chain_status = BREACHED; qc_status unchanged; existing reservations are NOT released (shipment is blocked at SHIP instead)", "increments ReagentLot.version by 1"]
        note: "Self-transition records the breach without changing qc_status"
      - from: QC_PASSED
        to: QC_PASSED
        trigger: "POST /genomics/reagent-lots/{id}/qc {outcome: COLD_CHAIN_BREACH}"
        actor: SupplyPlanner
        preconditions: ["qc_status in {PENDING_QC, QC_PASSED}"]
        side_effects: ["set cold_chain_status = BREACHED; qc_status unchanged; existing reservations are NOT released", "increments ReagentLot.version by 1"]
      - from: QC_PASSED
        to: EXPIRED
        trigger: "system: clock sweep on POST /genomics/_clock/set_current_utc when expiry_date <= new clock value"
        actor: system
        preconditions: ["qc_status == QC_PASSED", "expiry_date <= current logical clock"]
        side_effects: ["same release-and-backorder cascade as QC_FAILED from QC_PASSED", "increments ReagentLot.version by 1"]

  - entity: ReagentOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, RETURNED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: SUBMIT}"
        actor: LabOperator
        preconditions:
          - "order_state == DRAFT"
          - "if program_id is set: that PlacementProgram.program_state == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "account credit_hold == false (else ERR_CREDIT_HOLD)"
          - "lot_allocation_calc can fully satisfy every line (else ERR_ALLOCATION_IMPOSSIBLE; no partial reservation retained)"
        side_effects:
          - "price each line: pinned_kit_prices of the referenced program when program_id set, else current ReagentKit.price_cents; set total_cents and attributed_total_cents"
          - "reserve units via lot_allocation_calc (FEFO); write line_reservations; lot.reserved_units += quantity per reservation"
          - "if program_id set: program.pipeline_spend_cents += attributed_total_cents"
          - "set submitted_at; increments ReagentOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: SHIP}"
        actor: SupplyPlanner
        preconditions:
          - "order_state == ALLOCATED"
          - "every reserved lot has cold_chain_status == INTACT (else ERR_COLD_CHAIN_BREACHED)"
          - "every reserved lot has expiry_date > current logical clock (else ERR_LOT_EXPIRED)"
        side_effects: ["increments ReagentOrder.version by 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: DELIVER}"
        actor: SupplyPlanner
        preconditions: ["order_state == SHIPPED"]
        side_effects:
          - "set delivered_at = current logical clock"
          - "per reservation: lot.reserved_units -= quantity and lot.consumed_units += quantity"
          - "if program_id set: program.pipeline_spend_cents -= attributed_total_cents; program.delivered_spend_cents += attributed_total_cents; then PlacementProgram auto-completes when delivered_spend_cents >= committed_total_cents"
          - "increments ReagentOrder.version by 1"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system: lot QC_FAILED / lot EXPIRED cascade releases this order's reservations and full re-allocation is impossible"
        actor: system
        preconditions: ["order_state == ALLOCATED"]
        side_effects: ["all line_reservations released", "if program_id set: program.pipeline_spend_cents -= attributed_total_cents", "increments ReagentOrder.version by 1"]
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system: re-allocation sweep on a lot QC_PASSED event, processed in created_at ASC order"
        actor: system
        preconditions: ["order_state == BACKORDERED", "lines fully satisfiable from usable lots"]
        side_effects: ["re-run lot_allocation_calc; write line_reservations", "if program_id set: program.pipeline_spend_cents += attributed_total_cents", "increments ReagentOrder.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: CANCEL}"
        actor: LabOperator
        preconditions: ["order_state in {DRAFT, ALLOCATED, BACKORDERED}"]
        side_effects: ["increments ReagentOrder.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: CANCEL}"
        actor: LabOperator
        preconditions: ["order_state in {DRAFT, ALLOCATED, BACKORDERED}"]
        side_effects: ["release all line_reservations (lot.reserved_units -= quantity)", "if program_id set: program.pipeline_spend_cents -= attributed_total_cents", "increments ReagentOrder.version by 1"]
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: CANCEL}"
        actor: LabOperator
        preconditions: ["order_state in {DRAFT, ALLOCATED, BACKORDERED}"]
        side_effects: ["increments ReagentOrder.version by 1"]
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /genomics/reagent-orders/{id}/advance {action: RETURN}"
        actor: LabOperator
        preconditions: ["order_state == DELIVERED"]
        side_effects:
          - "if program_id set: program.delivered_spend_cents -= attributed_total_cents (compensating invariant: deliver+return leaves delivered_spend_cents unchanged)"
          - "Account.credit_balance_cents += total_cents (refund as account credit)"
          - "returned units are NOT restocked to any lot"
          - "increments ReagentOrder.version by 1"

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /genomics/service-contracts/{id}/activate"
        actor: FinanceAdmin
        preconditions:
          - "contract_state == DRAFT"
          - "coverage_end > coverage_start (else ERR_CONTRACT_WINDOW_INVALID)"
          - "instrument install_state != DECOMMISSIONED (else ERR_INVALID_STATE)"
          - "no other ACTIVE contract on the same instrument with overlapping half-open [coverage_start, coverage_end) window (else ERR_CONTRACT_WINDOW_OVERLAP); adjacency (new start == existing end) is allowed"
        side_effects: ["increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock sweep on POST /genomics/_clock/set_current_utc when coverage_end <= new clock value"
        actor: system
        preconditions: ["contract_state == ACTIVE", "coverage_end <= current logical clock"]
        side_effects: ["increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: instrument DECOMMISSION cascade"
        actor: system
        preconditions: ["contract_state == ACTIVE"]
        side_effects: ["set terminated_reason = AUTO_DECOMMISSION", "run final uptime_credit_calc and post credit (see Instrument DECOMMISSION cascade hop 3)", "increments ServiceContract.version by 1"]

  - entity: SoftwareLicense
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /genomics/software-licenses/{id}/status {action: ACTIVATE}"
        actor: FinanceAdmin
        preconditions: ["license_state == DRAFT"]
        side_effects: ["set activated_at = current logical clock", "snapshot pinned_sample_rate_cents = {T1: 250, T2: 200, T3: 150}", "increments SoftwareLicense.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /genomics/software-licenses/{id}/status {action: SUSPEND}"
        actor: FinanceAdmin
        preconditions: ["license_state == ACTIVE"]
        side_effects: ["increments SoftwareLicense.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /genomics/software-licenses/{id}/status {action: REINSTATE}"
        actor: FinanceAdmin
        preconditions: ["license_state == SUSPENDED"]
        side_effects: ["increments SoftwareLicense.version by 1"]

  - entity: SoftwareUpdate
    initial_state: RELEASED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /genomics/software-updates/{id}/withdraw"
        actor: PlatformAdmin
        preconditions: ["release_state == RELEASED"]
        side_effects:
          - "instruments that already applied the update KEEP its unlocked run modes (no retroactive lock)"
          - "increments SoftwareUpdate.version by 1"

  - entity: TransitionProgram
    initial_state: ENROLLED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: APPRAISED
        trigger: "POST /genomics/transition-programs/{id}/advance {action: APPRAISE}"
        actor: FinanceAdmin
        preconditions: ["program_state == ENROLLED", "appraiser X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["compute final_credit_cents via tradein_credit_calc FINAL variant using condition_flags and instrument age at appraisal instant", "set appraised_by_user_id and appraised_at", "increments TransitionProgram.version by 1"]
      - from: APPRAISED
        to: COMPLETED
        trigger: "POST /genomics/transition-programs/{id}/advance {action: COMPLETE}"
        actor: FinanceAdmin
        preconditions: ["program_state == APPRAISED"]
        side_effects:
          - "CASCADE hop 1: old Instrument transitions to DECOMMISSIONED (install_state must be OPERATIONAL or DOWN_FOR_SERVICE, else ERR_INVALID_STATE and the whole COMPLETE is rejected)"
          - "CASCADE hop 2-3: the instrument decommission cascade runs (contract TERMINATED with final uptime credit posted to account)"
          - "CASCADE hop 4: Account.credit_balance_cents += final_credit_cents"
          - "increments TransitionProgram.version by 1"
      - from: ENROLLED
        to: EXPIRED
        trigger: "system: clock sweep when current logical clock > enrollment_window_end"
        actor: system
        preconditions: ["program_state == ENROLLED"]
        side_effects: ["increments TransitionProgram.version by 1"]
      - from: APPRAISED
        to: EXPIRED
        trigger: "system: clock sweep when current logical clock > appraised_at + 30 days"
        actor: system
        preconditions: ["program_state == APPRAISED"]
        side_effects: ["increments TransitionProgram.version by 1"]

  - entity: SupplyForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /genomics/supply-forecasts/{id}/advance {action: SUBMIT}"
        actor: SupplyPlanner
        preconditions:
          - "forecast_state == DRAFT"
          - "every line week_start is a Monday 00:00:00Z within 26 weeks of the current logical clock (else ERR_FORECAST_HORIZON_INVALID)"
          - "cold_chain_capacity_calc: for every (ISO week, cold_chain_class) bucket, aggregate quantity across this forecast plus all other SUBMITTED or FROZEN forecasts does not exceed the class capacity (else ERR_CAPACITY_EXCEEDED)"
        side_effects: ["increments SupplyForecast.version by 1"]
      - from: SUBMITTED
        to: FROZEN
        trigger: "POST /genomics/supply-forecasts/{id}/advance {action: FREEZE}"
        actor: SupplyPlanner
        preconditions: ["forecast_state == SUBMITTED", "expected_forecast_version == current version (else ERR_STALE_VERSION 412)"]
        side_effects: ["CASCADE: every other FROZEN SupplyForecast of the same account transitions FROZEN -> SUPERSEDED", "increments SupplyForecast.version by 1"]
      - from: FROZEN
        to: SUPERSEDED
        trigger: "system: another forecast of the same account is frozen"
        actor: system
        preconditions: ["forecast_state == FROZEN"]
        side_effects: ["increments SupplyForecast.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: program-amendment-stale-version
    parent_entity: PlacementProgram
    write_endpoint: "POST /genomics/placement-programs/{id}/amendments"
    occ_field: expected_program_version
    description: |
      Creating an amendment (action CREATE) against a PlacementProgram whose
      version has advanced since the client last observed it is rejected with
      412. Each amendment CREATE legitimately moves the program ACTIVE ->
      UNDER_AMENDMENT and advances version, so a writer holding an older
      version is working from a stale program view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: forecast-freeze-stale-version
    parent_entity: SupplyForecast
    write_endpoint: "POST /genomics/supply-forecasts/{id}/advance"
    occ_field: expected_forecast_version
    description: |
      Freezing a forecast (action FREEZE) whose version has advanced since the
      client last observed it is rejected with 412. A freeze legitimately
      supersedes the account's prior FROZEN forecast and advances version, so
      a writer holding an older version is working from a stale forecast view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kit_capacity_calc
    trigger: "ReagentKit creation (capacity_gb is computed and stored)"
    algorithm: constraint_propagation
    formula: |
      capacity_gb = FLOW_CELL_BASE_GB[flow_cell_version] * CHEMISTRY_THROUGHPUT_MULT[chemistry_version]
      Result rounded to 1 decimal place, round_half_up.
    input_set: "the kit's own flow_cell_version and chemistry_version"
    constants:
      FLOW_CELL_BASE_GB: { FC_LOW: 50, FC_MID: 120, FC_HIGH: 300 }
      CHEMISTRY_THROUGHPUT_MULT: { V1: 1.0, V2: 1.5, V3: 2.2 }
    precision: "1 decimal place, round_half_up"

  - name: subsidy_pool_calc
    trigger: "PlacementProgram review SUBMIT and amendment APPROVE"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: per hardware line FIRST, then sum.
      for each line i in hardware_lines:
          line_subsidy_i = round_half_up(quantity_i * unit_price_cents_i * subsidy_pct, 0)
      subsidy_pool_cents = sum(line_subsidy_i)
      # The alternative order round_half_up(sum(quantity_i * unit_price_cents_i * subsidy_pct), 0)
      # produces different cents and is FORBIDDEN.
    input_set: "the program's hardware_lines and subsidy_pct at trigger time"
    constants:
      SUBSIDY_CAP_PCT: 0.40
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: lot_allocation_calc
    trigger: "ReagentOrder advance SUBMIT; re-allocation sweep on lot QC_PASSED"
    algorithm: waterfall_allocation
    formula: |
      For each order line (kit_code K, quantity Q), in line order:
        candidate lots = ReagentLot where kit.kit_code == K
          AND qc_status == QC_PASSED AND cold_chain_status == INTACT
          AND expiry_date > current logical clock
          AND available_units > 0
        sort: expiry_date ASC, tie-break created_at ASC (NEVER id)
        walk the sorted list, taking take_i = min(remaining_need, lot.available_units)
        from each lot until remaining_need == 0; each take is one reservation.
      If ANY line cannot be fully satisfied, the whole SUBMIT fails with
      ERR_ALLOCATION_IMPOSSIBLE and NO reservation is retained (all-or-nothing).
    input_set: "usable lots per line (QC_PASSED, INTACT, unexpired, available > 0)"
    constants: {}
    precision: "integer units"

  - name: uptime_credit_calc
    trigger: "POST /genomics/service-contracts/{id}/uptime-reconciliations; final reconciliation on instrument DECOMMISSION cascade"
    algorithm: threshold
    formula: |
      period_minutes = (period_end - period_start) in minutes
      downtime_minutes = sum over the instrument's service_windows w of
        max(0, min(w.closed_at or current clock, period_end) - max(w.opened_at, period_start)) in minutes
        (half-open intersection; open windows clamp at the current logical clock)
      uptime_percent = round_half_up(100 * (period_minutes - downtime_minutes) / period_minutes, 2)
      if uptime_percent >= committed_uptime_percent: credit_cents = 0      # exact threshold => NO credit
      else:
        deficit = round_half_up(committed_uptime_percent - uptime_percent, 2)
        rate = 0.05 if deficit < 1.0 else (0.10 if deficit < 3.0 else 0.25)   # deficit exactly 1.0 takes the 0.10 tier
        raw_credit = round_half_up(monthly_fee_cents * rate, 0)
        credit_cents = max(0, min(raw_credit, annual_credit_cap_cents - credits_issued_ytd_cents))
    input_set: "the contract's instrument service_windows overlapping [period_start, period_end)"
    constants:
      TIER1_MAX_DEFICIT: 1.0
      TIER1_RATE: 0.05
      TIER2_MAX_DEFICIT: 3.0
      TIER2_RATE: 0.10
      TIER3_RATE: 0.25
    precision: "uptime 2 decimals round_half_up; credit integer cents round_half_up"

  - name: sample_billing_calc
    trigger: "POST /genomics/software-licenses/{id}/billing-close"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking dependency made explicit):
      # samples -> tier -> gross -> credit expiry -> credit offset -> net.
      Step 1: billable_samples = sum(samples_count) over RunRecords with license_id == this license
              AND outcome in {SUCCESS, PARTIAL} AND period_start <= run_at < period_end,
              where the period window is [activated_at + (period_index-1)*30 days, +30 days).
      Step 2: tier = T1 if billable_samples < 1000; T2 if 1000 <= billable_samples < 5000; T3 if >= 5000.
      Step 3: gross_cents = billable_samples * pinned_sample_rate_cents[tier]  (average rate over ALL samples).
      Step 4: credit expiry FIRST: append EXPIRY entries for grant (GRANT/PURCHASE) credits whose
              granted_on is older than 365 days at the billing-close instant and not yet consumed;
              credits_balance recomputed.
      Step 5: offset_credits = min(credits_balance, floor(gross_cents * 0.5 / CREDIT_VALUE_CENTS));
              offset_cents = offset_credits * CREDIT_VALUE_CENTS; append OFFSET entry (-offset_credits).
      Step 6: net_cents = gross_cents - offset_cents.
      Aftermath: samples_this_period reset to 0; period_index += 1.
      # Applying offset before expiry would let expiring credits offset the invoice; FORBIDDEN order.
    input_set: "RunRecords of the license in the current period window; the license credit_ledger"
    constants:
      SAMPLE_TIER_T2_MIN: 1000
      SAMPLE_TIER_T3_MIN: 5000
      SAMPLE_RATE_CENTS: { T1: 250, T2: 200, T3: 150 }
      CREDIT_VALUE_CENTS: 100
      CREDIT_OFFSET_MAX_PCT: 0.5
      CREDIT_EXPIRY_DAYS: 365
    precision: "integer cents and credits; floor for the offset division"
    variants:
      - name: provisional
        when: "provisional figures reported on the billing-close response"
        difference: "provisional_samples = sum over the account's SUBMITTED or FROZEN forecast lines whose week intersects the period window of quantity * kit.samples_per_kit; provisional_gross_cents = provisional_samples * pinned_sample_rate_cents[tier(provisional_samples)]; the final gross uses actual run records and MAY land in a different tier"

  - name: cloud_credit_ledger_calc
    trigger: "RunRecord creation (CONSUMPTION), credit-grants (GRANT/PURCHASE), billing-close (EXPIRY/OFFSET)"
    algorithm: aggregation
    formula: |
      credits_balance = sum(entry.credits) over credit_ledger   # signed entries
      Invariant: credits_balance >= 0 at all times; a run whose cloud credit cost exceeds the
      current balance is rejected with ERR_INSUFFICIENT_CREDITS. Cost is FLAT PER RUN by
      analysis_mode: LOCAL 0, CLOUD_STANDARD 10, CLOUD_DEEP 25. Only SUCCESS and PARTIAL runs
      consume credits; FAILED runs consume the lot unit but zero credits and zero billable samples.
    input_set: "the license's own credit_ledger"
    constants:
      CLOUD_CREDIT_COST: { LOCAL: 0, CLOUD_STANDARD: 10, CLOUD_DEEP: 25 }
    precision: "integer credits"

  - name: tradein_credit_calc
    trigger: "TransitionProgram creation (provisional) and advance APPRAISE (final)"
    algorithm: tiered_pricing
    formula: |
      generation_gap = new_model.generation - old_model.generation   # must be >= 1 (validated)
      provisional_pct = 0.20 if gap == 1; 0.35 if gap == 2; 0.50 if gap >= 3
      provisional_credit_cents = round_half_up(old_model.base_price_cents * provisional_pct, 0)
      # FINAL variant at appraisal:
      condition_deduction_pct = 0.05 * has(COSMETIC_DAMAGE) + 0.20 * has(FUNCTIONAL_DEFECT) + 0.10 * has(MISSING_ACCESSORIES)
      years_in_service = floor((appraisal instant - instrument.installed_at) / 365 days)
      age_deduction_pct = 0.02 * max(0, years_in_service - 3)
      deduction_cents = round_half_up(provisional_credit_cents * (condition_deduction_pct + age_deduction_pct), 0)
      floor_cents = round_half_up(old_model.base_price_cents * 0.05, 0)
      final_credit_cents = clamp(provisional_credit_cents - deduction_cents, floor_cents, provisional_credit_cents)
    input_set: "old instrument's model (base price, generation) and installed_at; new model generation; condition_flags"
    constants:
      TRADEIN_PCT: { GAP_1: 0.20, GAP_2: 0.35, GAP_3_PLUS: 0.50 }
      CONDITION_DEDUCTION_PCT: { COSMETIC_DAMAGE: 0.05, FUNCTIONAL_DEFECT: 0.20, MISSING_ACCESSORIES: 0.10 }
      AGE_FREE_YEARS: 3
      AGE_DEDUCTION_PCT_PER_YEAR: 0.02
      TRADEIN_FLOOR_PCT: 0.05
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at enrollment"
        difference: "list-based percentage of the old model base price by generation gap; ignores instrument condition and age — same instrument yields a different (higher or equal) number than final"
      - name: final
        when: "at appraisal"
        difference: "provisional minus condition and age deductions, clamped to [floor, provisional]"

  - name: commitment_reconciliation_calc
    trigger: "POST /genomics/placement-programs/{id}/close-period"
    algorithm: threshold
    formula: |
      periods_total = term_months
      # ACCRUAL variant (interim closes, period_index < term_months):
      expected_to_date_cents = round_half_up(committed_annual_reagent_cents * period_index / 12, 0)
      shortfall_flag = delivered_spend_cents < expected_to_date_cents    # strictly below => flagged
      # FINAL variant (period_index == term_months):
      committed_total_cents = committed_annual_reagent_cents * term_months / 12
      shortfall_cents = max(0, committed_total_cents - delivered_spend_cents)
      if shortfall_cents == 0: transition to COMPLETED
      else: penalty_cents = round_half_up(shortfall_cents * 0.10, 0); transition to BREACHED
    input_set: "the program's own delivered_spend_cents, committed_annual_reagent_cents, term_months, period_index"
    constants:
      SHORTFALL_PENALTY_RATE: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: accrual
        when: "interim period closes"
        difference: "pro-rata expected spend to date; only sets shortfall_flag; no penalty, no state change"
      - name: final
        when: "final period close"
        difference: "compares against full-term commitment; posts penalty and drives BREACHED/COMPLETED"

  - name: forecast_variance_calc
    trigger: "GET /genomics/supply-forecasts/{id} with include_variance=true"
    algorithm: aggregation
    formula: |
      For each forecast line (kit_code K, week_start W, quantity Q):
        actual_delivered_units = sum over DELIVERED ReagentOrders of this account of reserved units of K
          whose delivered_at falls inside the ISO week [W, W + 7 days)  (closed-open)
        variance = actual_delivered_units - Q
        coverage_conservative_units = sum(available_units) over lots of K with qc_status == QC_PASSED,
          cold_chain_status == INTACT, expiry_date > current clock
        coverage_optimistic_units  = conservative + sum(available_units) over lots of K with
          qc_status == PENDING_QC, cold_chain_status == INTACT, expiry_date > current clock
      # The two coverage variants differ whenever usable PENDING_QC lots of K exist.
    input_set: "forecast lines; DELIVERED orders of the account; lots of each referenced kit"
    constants: {}
    precision: "integer units"
    variants:
      - name: coverage_optimistic
        when: "reported alongside conservative on the variance read"
        difference: "counts PENDING_QC lots as incoming supply; conservative counts QC_PASSED only — same data, different coverage numbers"
      - name: coverage_conservative
        when: "reported alongside optimistic on the variance read"
        difference: "counts QC_PASSED lots only"

  - name: cold_chain_capacity_calc
    trigger: "SupplyForecast advance SUBMIT"
    algorithm: aggregation
    formula: |
      For every ISO week W touched by the forecast and every cold_chain_class C:
        demand(W, C) = sum of quantity over this forecast's lines whose kit.cold_chain_class == C and week_start == W
                     + sum of quantity over lines of every OTHER forecast (any account) in state SUBMITTED or FROZEN
                       whose kit.cold_chain_class == C and week_start == W
      Reject with ERR_CAPACITY_EXCEEDED if demand(W, C) > COLD_CHAIN_WEEKLY_CAPACITY[C] for any bucket.
      Aggregate semantics: two forecasts touching the same week ALWAYS aggregate; demand exactly equal
      to capacity is allowed (<=). Buckets are whole ISO weeks (Monday 00:00:00Z, closed-open [W, W+7d)).
    input_set: "all SupplyForecasts in state SUBMITTED or FROZEN, plus the submitting forecast"
    constants:
      COLD_CHAIN_WEEKLY_CAPACITY: { FROZEN_20: 500, REFRIGERATED_4: 1000 }
      FORECAST_HORIZON_WEEKS: 26
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list (endpoint-level RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Per-action role gate on multi-action endpoints: instruments/{id}/events DECOMMISSION requires AccountManager (other actions FieldServiceEngineer); placement-programs review SUBMIT requires AccountManager while APPROVE/REJECT require FinanceAdmin; amendments CREATE requires AccountManager while APPROVE/REJECT require FinanceAdmin; reagent-orders advance SUBMIT/CANCEL/RETURN require LabOperator while SHIP/DELIVER require SupplyPlanner"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /genomics/instruments/{id}/events, POST /genomics/placement-programs/{id}/review, POST /genomics/placement-programs/{id}/amendments, POST /genomics/reagent-orders/{id}/advance"
  - priority: 4
    category: auth
    check: "LabOperator ownership: X-User-ID must equal the Account.id that owns the target resource (order account_id, instrument's account_id for run-records, list filters are auto-scoped to the caller's account)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "LabOperator endpoints"
  - priority: 5
    category: existence
    check: "Every path id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: existence
    check: "Every body-supplied reference resolves: model_id, program_id, kit_code inside lines, update_id, old_instrument_id, new_model_id, instrument_id, lot_id, license_id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 7
    category: existence
    check: "Request shape: required fields present, types and enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: state
    check: "State-machine from-state matches the attempted trigger (generic catch-all for undefined transitions and terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "ReagentOrder SUBMIT: referenced PlacementProgram.program_state == ACTIVE"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /genomics/reagent-orders/{id}/advance"
  - priority: 10
    category: state
    check: "Instrument software-updates: an ACTIVE ServiceContract covers this instrument"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /genomics/instruments/{id}/software-updates"
  - priority: 11
    category: state
    check: "RunRecord: instrument.install_state == OPERATIONAL"
    error_id: ERR_INSTRUMENT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /genomics/run-records"
  - priority: 12
    category: state
    check: "RunRecord and billing-close: license.license_state == ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /genomics/run-records, POST /genomics/software-licenses/{id}/billing-close, POST /genomics/software-licenses/{id}/credit-grants"
  - priority: 13
    category: state
    check: "Instrument software-updates: update.release_state == RELEASED"
    error_id: ERR_UPDATE_WITHDRAWN
    http_status: 409
    applies_to: "POST /genomics/instruments/{id}/software-updates"
  - priority: 14
    category: state
    check: "RunRecord: lot.qc_status == QC_PASSED"
    error_id: ERR_LOT_NOT_USABLE
    http_status: 409
    applies_to: "POST /genomics/run-records"
  - priority: 15
    category: state
    check: "RunRecord: lot.available_units >= 1"
    error_id: ERR_LOT_DEPLETED
    http_status: 409
    applies_to: "POST /genomics/run-records"
  - priority: 16
    category: business_safety
    check: "Instrument registration: account.regulatory_class == CLINICAL requires instrument regulatory_mode == CLINICAL"
    error_id: ERR_REGULATORY_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /genomics/instruments"
  - priority: 17
    category: business_safety
    check: "Software update application to a CLINICAL instrument requires update.clinical_validation_status == VALIDATED"
    error_id: ERR_UPDATE_NOT_VALIDATED_CLINICAL
    http_status: 422
    applies_to: "POST /genomics/instruments/{id}/software-updates"
  - priority: 18
    category: business_safety
    check: "RunRecord on a CLINICAL instrument requires the lot's kit.regulatory_clearance == IVD"
    error_id: ERR_CHEMISTRY_NOT_CLEARED_FOR_CLINICAL
    http_status: 422
    applies_to: "POST /genomics/run-records"
  - priority: 19
    category: business_safety
    check: "Order SHIP: every reserved lot has cold_chain_status == INTACT"
    error_id: ERR_COLD_CHAIN_BREACHED
    http_status: 422
    applies_to: "POST /genomics/reagent-orders/{id}/advance"
  - priority: 20
    category: business_safety
    check: "RunRecord and order SHIP: lot expiry_date > current logical clock"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /genomics/run-records, POST /genomics/reagent-orders/{id}/advance"
  - priority: 21
    category: business_constraint
    check: "Instrument serial_number unique across all instruments"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /genomics/instruments"
  - priority: 22
    category: business_constraint
    check: "Instrument registration: model.support_status != OBSOLETE"
    error_id: ERR_MODEL_OBSOLETE
    http_status: 422
    applies_to: "POST /genomics/instruments"
  - priority: 23
    category: business_constraint
    check: "ServiceContract activate: no other ACTIVE contract on the same instrument with overlapping half-open [coverage_start, coverage_end) window; adjacency allowed"
    error_id: ERR_CONTRACT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /genomics/service-contracts/{id}/activate"
  - priority: 24
    category: business_constraint
    check: "Software update: update.min_model_generation <= instrument model.generation"
    error_id: ERR_UPDATE_MODEL_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /genomics/instruments/{id}/software-updates"
  - priority: 25
    category: business_constraint
    check: "RunRecord: run_mode is in instrument.unlocked_run_modes"
    error_id: ERR_RUN_MODE_LOCKED
    http_status: 422
    applies_to: "POST /genomics/run-records"
  - priority: 26
    category: business_constraint
    check: "RunRecord: lot kit.run_type == run_mode"
    error_id: ERR_KIT_RUN_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /genomics/run-records"
  - priority: 27
    category: business_constraint
    check: "RunRecord: lot kit.chemistry_version is in instrument model.supported_chemistry_versions"
    error_id: ERR_CHEMISTRY_UNSUPPORTED
    http_status: 422
    applies_to: "POST /genomics/run-records"
  - priority: 28
    category: business_constraint
    check: "RunRecord: lot kit.min_model_generation <= instrument model.generation"
    error_id: ERR_KIT_MODEL_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /genomics/run-records"
  - priority: 29
    category: business_constraint
    check: "Segregation of duties: placement-program review APPROVE X-User-ID != program.created_by_user_id; amendments APPROVE X-User-ID != pending_amendment.created_by_user_id; transition APPRAISE X-User-ID != transition.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /genomics/placement-programs/{id}/review, POST /genomics/placement-programs/{id}/amendments, POST /genomics/transition-programs/{id}/advance"
  - priority: 30
    category: business_constraint
    check: "OCC: amendments CREATE expected_program_version == program.version; forecast FREEZE expected_forecast_version == forecast.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /genomics/placement-programs/{id}/amendments, POST /genomics/supply-forecasts/{id}/advance"
  - priority: 31
    category: business_temporal
    check: "ServiceContract create: coverage_end > coverage_start"
    error_id: ERR_CONTRACT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /genomics/service-contracts"
  - priority: 32
    category: business_temporal
    check: "TransitionProgram create: current logical clock <= enrollment_window_end; also new_model.generation > old instrument's model.generation (gap >= 1) else same error"
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /genomics/transition-programs"
  - priority: 33
    category: business_temporal
    check: "SupplyForecast create/submit: every line week_start is a Monday 00:00:00Z, not before the current week, and within 26 weeks of the current logical clock"
    error_id: ERR_FORECAST_HORIZON_INVALID
    http_status: 422
    applies_to: "POST /genomics/supply-forecasts, POST /genomics/supply-forecasts/{id}/advance"
  - priority: 34
    category: business_temporal
    check: "uptime-reconciliations: period_start < period_end; period_end <= current logical clock; period_start >= last_reconciliation_end when set (no overlapping or future reconciliation windows)"
    error_id: ERR_RECONCILIATION_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /genomics/service-contracts/{id}/uptime-reconciliations"
  - priority: 35
    category: business_temporal
    check: "Clock: set_current_utc to_iso8601 must be strictly greater than the current logical clock (monotonic)"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /genomics/_clock/set_current_utc"
  - priority: 36
    category: business_fiscal
    check: "ReagentOrder SUBMIT: account.credit_hold == false"
    error_id: ERR_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /genomics/reagent-orders/{id}/advance"
  - priority: 37
    category: business_fiscal
    check: "RunRecord with analysis_mode CLOUD_STANDARD/CLOUD_DEEP and outcome != FAILED: license.credits_balance >= CLOUD_CREDIT_COST[analysis_mode]"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /genomics/run-records"
  - priority: 38
    category: business_fiscal
    check: "PlacementProgram review SUBMIT: subsidy_pool_cents <= 0.40 * committed_annual_reagent_cents"
    error_id: ERR_SUBSIDY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /genomics/placement-programs/{id}/review"
  - priority: 39
    category: business_fiscal
    check: "ReagentOrder SUBMIT: lot_allocation_calc can fully satisfy every line (all-or-nothing)"
    error_id: ERR_ALLOCATION_IMPOSSIBLE
    http_status: 422
    applies_to: "POST /genomics/reagent-orders/{id}/advance"

# =============================================================================
# §1.5 API Endpoint Table (all paths under api_prefix /genomics)
# =============================================================================
endpoints:
  - method: POST
    path: "/genomics/accounts"
    description: "Register a customer account"
    roles: [AccountManager]
    code: 201
    input: [name, regulatory_class, region]
    output: Account
    side_effects: ["credit_hold false", "credit_balance_cents 0", "version 1"]
  - method: GET
    path: "/genomics/accounts/{id}"
    description: "Read one account (LabOperator restricted to own account id)"
    roles: [AccountManager, FinanceAdmin, SupplyPlanner, FieldServiceEngineer, LabOperator]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/genomics/instrument-models"
    description: "Create an instrument model catalog entry"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, generation, base_price_cents, supported_chemistry_versions, base_run_modes, 'support_status?']
    output: InstrumentModel
    side_effects: []
  - method: POST
    path: "/genomics/reagent-kits"
    description: "Create a reagent kit catalog entry; capacity_gb computed via kit_capacity_calc"
    roles: [PlatformAdmin]
    code: 201
    input: [kit_code, run_type, flow_cell_version, chemistry_version, regulatory_clearance, shelf_life_days, cold_chain_class, price_cents, samples_per_kit, min_model_generation]
    output: ReagentKit
    side_effects: ["capacity_gb computed and stored"]
  - method: PATCH
    path: "/genomics/reagent-kits/{id}"
    description: "Update a kit's current price_cents (version-pinning probe: programs pinned at approval keep the old price)"
    roles: [PlatformAdmin]
    code: 200
    input: [price_cents]
    output: ReagentKit
    side_effects: ["increments ReagentKit.version by 1", "refreshes updated_at"]
  - method: POST
    path: "/genomics/software-updates"
    description: "Publish a software update release"
    roles: [PlatformAdmin]
    code: 201
    input: [update_version, min_model_generation, unlocks_run_modes, clinical_validation_status]
    output: SoftwareUpdate
    side_effects: ["release_state RELEASED"]
  - method: POST
    path: "/genomics/software-updates/{id}/withdraw"
    description: "Withdraw a released update (already-applied instruments keep unlocked modes)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SoftwareUpdate
    side_effects: ["release_state -> WITHDRAWN", "increments SoftwareUpdate.version by 1"]

  - method: POST
    path: "/genomics/instruments"
    description: "Register an instrument into the installed base (optionally with installed_at for pre-existing installs)"
    roles: [AccountManager]
    code: 201
    input: [account_id, model_id, serial_number, regulatory_mode, 'installed_at?']
    output: Instrument
    side_effects: ["install_state ORDERED", "software_version 1.0.0"]
  - method: GET
    path: "/genomics/instruments/{id}"
    description: "Read one instrument"
    roles: [AccountManager, FieldServiceEngineer, FinanceAdmin, LabOperator]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: GET
    path: "/genomics/instruments"
    description: "List instruments with filters"
    roles: [AccountManager, FieldServiceEngineer, SupplyPlanner, FinanceAdmin]
    code: 200
    input: ['account_id?', 'model_id?', 'install_state?', 'limit?', 'offset?']
    output: "Instrument[]"
    side_effects: []
  - method: POST
    path: "/genomics/instruments/{id}/events"
    description: "Lifecycle and service events. action: SHIP|INSTALL|COMMISSION|SERVICE_OPEN|SERVICE_CLOSE (FieldServiceEngineer) or DECOMMISSION (AccountManager). DECOMMISSION runs the contract-termination cascade."
    roles: [FieldServiceEngineer, AccountManager]
    code: 200
    input: [action]
    output: Instrument
    side_effects: ["state transition per Instrument machine", "DECOMMISSION: contract terminate + final uptime credit cascade"]
  - method: POST
    path: "/genomics/instruments/{id}/software-updates"
    description: "Apply a software update: gates on active service contract, release state, clinical validation, and model generation; unlocks run modes"
    roles: [FieldServiceEngineer]
    code: 200
    input: [update_id]
    output: Instrument
    side_effects: ["software_version = update.update_version", "append applied_update_ids", "recompute unlocked_run_modes", "increments Instrument.version by 1"]

  - method: POST
    path: "/genomics/placement-programs"
    description: "Create a placement program (reagent commitment subsidizing hardware)"
    roles: [AccountManager]
    code: 201
    input: [account_id, term_months, committed_annual_reagent_cents, subsidy_pct, hardware_lines]
    output: PlacementProgram
    side_effects: ["program_state DRAFT", "records created_by_user_id"]
  - method: GET
    path: "/genomics/placement-programs/{id}"
    description: "Read one placement program"
    roles: [AccountManager, FinanceAdmin, LabOperator]
    code: 200
    input: []
    output: PlacementProgram
    side_effects: []
  - method: GET
    path: "/genomics/placement-programs"
    description: "List placement programs with filters"
    roles: [AccountManager, FinanceAdmin]
    code: 200
    input: ['account_id?', 'program_state?', 'limit?', 'offset?']
    output: "PlacementProgram[]"
    side_effects: []
  - method: POST
    path: "/genomics/placement-programs/{id}/review"
    description: "action: SUBMIT (AccountManager; computes subsidy_pool, enforces cap) | APPROVE (FinanceAdmin; pins kit price book; segregation of duties) | REJECT (FinanceAdmin)"
    roles: [AccountManager, FinanceAdmin]
    code: 200
    input: [action]
    output: PlacementProgram
    side_effects: ["SUBMIT: subsidy_pool_cents via subsidy_pool_calc", "APPROVE: pinned_kit_prices snapshot", "increments PlacementProgram.version by 1"]
  - method: POST
    path: "/genomics/placement-programs/{id}/amendments"
    description: "action: CREATE (AccountManager; OCC expected_program_version required; ACTIVE->UNDER_AMENDMENT) | APPROVE (FinanceAdmin; applies pending values; segregation of duties) | REJECT (FinanceAdmin; discards)"
    roles: [AccountManager, FinanceAdmin]
    code: 200
    input: [action, 'expected_program_version?', 'new_committed_annual_reagent_cents?', 'new_subsidy_pct?']
    output: PlacementProgram
    side_effects: ["CREATE: stores pending_amendment", "APPROVE: applies and recomputes subsidy_pool_cents", "increments PlacementProgram.version by 1"]
  - method: POST
    path: "/genomics/placement-programs/{id}/close-period"
    description: "Close the current commitment period: accrual variant interim, final variant at term end (BREACHED/COMPLETED + penalty)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: PlacementProgram
    side_effects: ["commitment_reconciliation_calc", "period_index += 1 on interim closes", "final close: penalty_cents and state outcome; BREACHED sets account credit_hold"]

  - method: POST
    path: "/genomics/reagent-lots"
    description: "Register a physical reagent lot"
    roles: [SupplyPlanner]
    code: 201
    input: [kit_id, lot_number, manufacture_date, quantity_units]
    output: ReagentLot
    side_effects: ["qc_status PENDING_QC", "expiry_date computed = manufacture_date + kit.shelf_life_days"]
  - method: GET
    path: "/genomics/reagent-lots/{id}"
    description: "Read one reagent lot"
    roles: [SupplyPlanner, LabOperator]
    code: 200
    input: []
    output: ReagentLot
    side_effects: []
  - method: GET
    path: "/genomics/reagent-lots"
    description: "List reagent lots with filters"
    roles: [SupplyPlanner, LabOperator]
    code: 200
    input: ['kit_id?', 'qc_status?', 'limit?', 'offset?']
    output: "ReagentLot[]"
    side_effects: []
  - method: POST
    path: "/genomics/reagent-lots/{id}/qc"
    description: "QC verdict. outcome: PASSED | FAILED | COLD_CHAIN_BREACH. FAILED from QC_PASSED runs the release-and-backorder cascade; PASSED runs the re-allocation sweep; COLD_CHAIN_BREACH only sets cold_chain_status."
    roles: [SupplyPlanner]
    code: 200
    input: [outcome]
    output: ReagentLot
    side_effects: ["per ReagentLot machine", "increments ReagentLot.version by 1"]

  - method: POST
    path: "/genomics/reagent-orders"
    description: "Create a reagent order in DRAFT (LabOperator; account_id must equal X-User-ID)"
    roles: [LabOperator]
    code: 201
    input: [account_id, lines, 'program_id?']
    output: ReagentOrder
    side_effects: ["order_state DRAFT"]
  - method: GET
    path: "/genomics/reagent-orders/{id}"
    description: "Read one reagent order"
    roles: [LabOperator, AccountManager, SupplyPlanner]
    code: 200
    input: []
    output: ReagentOrder
    side_effects: []
  - method: GET
    path: "/genomics/reagent-orders"
    description: "List reagent orders with filters (LabOperator auto-scoped to own account)"
    roles: [LabOperator, AccountManager, SupplyPlanner]
    code: 200
    input: ['account_id?', 'program_id?', 'order_state?', 'limit?', 'offset?']
    output: "ReagentOrder[]"
    side_effects: []
  - method: POST
    path: "/genomics/reagent-orders/{id}/advance"
    description: "action: SUBMIT (LabOperator; prices lines, FEFO allocation, program pipeline) | SHIP (SupplyPlanner; cold-chain and expiry gates) | DELIVER (SupplyPlanner; attribution, auto-complete check) | CANCEL (LabOperator; releases reservations) | RETURN (LabOperator; de-attributes, refunds to account credit)"
    roles: [LabOperator, SupplyPlanner]
    code: 200
    input: [action]
    output: ReagentOrder
    side_effects: ["per ReagentOrder machine", "increments ReagentOrder.version by 1"]

  - method: POST
    path: "/genomics/service-contracts"
    description: "Create a service contract in DRAFT (uptime commitment + optional reagent guarantee)"
    roles: [FinanceAdmin]
    code: 201
    input: [account_id, instrument_id, coverage_start, coverage_end, committed_uptime_percent, monthly_fee_cents, annual_credit_cap_cents, 'reagent_guarantee?']
    output: ServiceContract
    side_effects: ["contract_state DRAFT"]
  - method: GET
    path: "/genomics/service-contracts/{id}"
    description: "Read one service contract"
    roles: [FinanceAdmin, AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/genomics/service-contracts"
    description: "List service contracts with filters"
    roles: [FinanceAdmin, AccountManager]
    code: 200
    input: ['account_id?', 'instrument_id?', 'contract_state?', 'limit?', 'offset?']
    output: "ServiceContract[]"
    side_effects: []
  - method: POST
    path: "/genomics/service-contracts/{id}/activate"
    description: "Activate a contract: half-open window overlap check per instrument"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["contract_state ACTIVE", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/genomics/service-contracts/{id}/uptime-reconciliations"
    description: "Close a measurement period and post the uptime service credit via uptime_credit_calc"
    roles: [FinanceAdmin]
    code: 201
    input: [period_start, period_end]
    output: "{ downtime_minutes: integer, uptime_percent: number, credit_cents: integer, credits_issued_ytd_cents: integer }"
    side_effects: ["credit added to credits_issued_ytd_cents", "Account.credit_balance_cents += credit_cents", "last_reconciliation_end = period_end", "increments ServiceContract.version by 1"]

  - method: POST
    path: "/genomics/software-licenses"
    description: "Create an informatics software license in DRAFT"
    roles: [FinanceAdmin]
    code: 201
    input: [account_id]
    output: SoftwareLicense
    side_effects: ["license_state DRAFT"]
  - method: GET
    path: "/genomics/software-licenses/{id}"
    description: "Read one software license (credits_balance, samples_this_period, pinned rates)"
    roles: [FinanceAdmin, LabOperator]
    code: 200
    input: []
    output: SoftwareLicense
    side_effects: []
  - method: GET
    path: "/genomics/software-licenses"
    description: "List software licenses with filters"
    roles: [FinanceAdmin]
    code: 200
    input: ['account_id?', 'license_state?', 'limit?', 'offset?']
    output: "SoftwareLicense[]"
    side_effects: []
  - method: POST
    path: "/genomics/software-licenses/{id}/status"
    description: "action: ACTIVATE (DRAFT->ACTIVE; pins sample rates, anchors billing periods) | SUSPEND (ACTIVE->SUSPENDED) | REINSTATE (SUSPENDED->ACTIVE)"
    roles: [FinanceAdmin]
    code: 200
    input: [action]
    output: SoftwareLicense
    side_effects: ["per SoftwareLicense machine", "increments SoftwareLicense.version by 1"]
  - method: POST
    path: "/genomics/software-licenses/{id}/credit-grants"
    description: "Grant or sell cloud analysis credits; appends a GRANT or PURCHASE ledger entry"
    roles: [FinanceAdmin]
    code: 201
    input: [credits, grant_type, 'granted_on?']
    output: SoftwareLicense
    side_effects: ["append credit_ledger entry (granted_on defaults to current clock date)", "credits_balance recomputed", "increments SoftwareLicense.version by 1"]
  - method: POST
    path: "/genomics/software-licenses/{id}/billing-close"
    description: "Close the current billing period: sample_billing_calc (samples -> tier -> gross -> expiry -> offset -> net) plus provisional forecast-based figures"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: "{ billable_samples: integer, tier: string, gross_cents: integer, expired_credits: integer, offset_credits: integer, offset_cents: integer, net_cents: integer, credits_balance: integer, provisional_samples: integer, provisional_gross_cents: integer }"
    side_effects: ["EXPIRY and OFFSET ledger entries appended", "samples_this_period reset to 0", "period_index += 1", "increments SoftwareLicense.version by 1"]

  - method: POST
    path: "/genomics/run-records"
    description: "Record a sequencing run: consumes one lot unit, bills samples to the license (non-FAILED), debits cloud credits by analysis_mode (non-FAILED)"
    roles: [LabOperator]
    code: 201
    input: [instrument_id, lot_id, license_id, run_at, run_mode, analysis_mode, samples_count, output_gb, outcome]
    output: RunRecord
    side_effects: ["lot.consumed_units += 1 (always)", "license.samples_this_period += samples_count when outcome != FAILED", "credit_ledger CONSUMPTION entry when analysis_mode != LOCAL and outcome != FAILED", "recompute lot available_units and license credits_balance"]
  - method: GET
    path: "/genomics/run-records/{id}"
    description: "Read one run record"
    roles: [LabOperator, SupplyPlanner, FinanceAdmin]
    code: 200
    input: []
    output: RunRecord
    side_effects: []
  - method: GET
    path: "/genomics/run-records"
    description: "List run records with filters (LabOperator auto-scoped to own account's instruments)"
    roles: [LabOperator, SupplyPlanner, FinanceAdmin]
    code: 200
    input: ['instrument_id?', 'lot_id?', 'license_id?', 'limit?', 'offset?']
    output: "RunRecord[]"
    side_effects: []

  - method: POST
    path: "/genomics/transition-programs"
    description: "Enroll an old instrument into a new-generation transition program; provisional trade-in credit computed"
    roles: [AccountManager]
    code: 201
    input: [account_id, old_instrument_id, new_model_id, enrollment_window_end]
    output: TransitionProgram
    side_effects: ["program_state ENROLLED", "provisional_credit_cents via tradein_credit_calc", "records created_by_user_id"]
  - method: GET
    path: "/genomics/transition-programs/{id}"
    description: "Read one transition program"
    roles: [AccountManager, FinanceAdmin, LabOperator]
    code: 200
    input: []
    output: TransitionProgram
    side_effects: []
  - method: GET
    path: "/genomics/transition-programs"
    description: "List transition programs with filters"
    roles: [AccountManager, FinanceAdmin]
    code: 200
    input: ['account_id?', 'program_state?', 'old_instrument_id?', 'new_model_id?', 'limit?', 'offset?']
    output: "TransitionProgram[]"
    side_effects: []
  - method: POST
    path: "/genomics/transition-programs/{id}/advance"
    description: "action: APPRAISE (sets final credit; segregation of duties vs creator) | COMPLETE (decommissions old instrument, terminates its contracts with final uptime credit, posts trade-in credit to account)"
    roles: [FinanceAdmin]
    code: 200
    input: [action, 'condition_flags?']
    output: TransitionProgram
    side_effects: ["per TransitionProgram machine", "COMPLETE runs the decommission cascade and credits the account", "increments TransitionProgram.version by 1"]

  - method: POST
    path: "/genomics/supply-forecasts"
    description: "Create a reagent supply forecast in DRAFT"
    roles: [SupplyPlanner]
    code: 201
    input: [account_id, lines]
    output: SupplyForecast
    side_effects: ["forecast_state DRAFT"]
  - method: GET
    path: "/genomics/supply-forecasts/{id}"
    description: "Read one forecast; with include_variance=true the data object also carries variance_lines via forecast_variance_calc (optimistic and conservative coverage)"
    roles: [SupplyPlanner, AccountManager]
    code: 200
    input: ['include_variance?']
    output: SupplyForecast
    side_effects: []
  - method: GET
    path: "/genomics/supply-forecasts"
    description: "List supply forecasts with filters"
    roles: [SupplyPlanner]
    code: 200
    input: ['account_id?', 'forecast_state?', 'limit?', 'offset?']
    output: "SupplyForecast[]"
    side_effects: []
  - method: POST
    path: "/genomics/supply-forecasts/{id}/advance"
    description: "action: SUBMIT (horizon + cold-chain weekly capacity checks) | FREEZE (OCC expected_forecast_version required; supersedes the account's other FROZEN forecasts)"
    roles: [SupplyPlanner]
    code: 200
    input: [action, 'expected_forecast_version?']
    output: SupplyForecast
    side_effects: ["SUBMIT: cold_chain_capacity_calc", "FREEZE: prior FROZEN forecasts of the account -> SUPERSEDED", "increments SupplyForecast.version by 1"]

  - method: POST
    path: "/genomics/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Setting is monotonic (strictly increasing). Side-effect sweeps: QC_PASSED lots with expiry_date <= now become EXPIRED (release-and-backorder cascade); ACTIVE contracts with coverage_end <= now become EXPIRED; ENROLLED transition programs past enrollment_window_end and APPRAISED programs past appraised_at + 30 days become EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, lots_expired: integer, contracts_expired: integer, transitions_expired: integer }"
    side_effects: ["advance logical clock", "expiry sweeps per description"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or unknown role value" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint or action; LabOperator acting on another account's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state mismatch (undefined transition or terminal-state lockdown)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "ReagentOrder SUBMIT references a PlacementProgram not in ACTIVE state" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Software update application requires an ACTIVE ServiceContract covering the instrument" }
  - { id: ERR_INSTRUMENT_NOT_OPERATIONAL, http: 409, condition: "RunRecord or software update requires instrument install_state == OPERATIONAL" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "RunRecord, credit-grants, or billing-close requires license_state == ACTIVE" }
  - { id: ERR_UPDATE_WITHDRAWN, http: 409, condition: "Applying a SoftwareUpdate whose release_state is WITHDRAWN" }
  - { id: ERR_LOT_NOT_USABLE, http: 409, condition: "RunRecord references a lot whose qc_status is not QC_PASSED" }
  - { id: ERR_LOT_DEPLETED, http: 409, condition: "RunRecord references a lot with available_units < 1" }
  - { id: ERR_REGULATORY_MODE_MISMATCH, http: 422, condition: "CLINICAL account registering a non-CLINICAL instrument" }
  - { id: ERR_UPDATE_NOT_VALIDATED_CLINICAL, http: 422, condition: "Applying a NOT_VALIDATED update to a CLINICAL instrument" }
  - { id: ERR_CHEMISTRY_NOT_CLEARED_FOR_CLINICAL, http: 422, condition: "Run on a CLINICAL instrument consumes a RUO_ONLY kit" }
  - { id: ERR_COLD_CHAIN_BREACHED, http: 422, condition: "Order SHIP or RunRecord references a lot with cold_chain_status BREACHED" }
  - { id: ERR_LOT_EXPIRED, http: 422, condition: "Order SHIP or RunRecord references a lot whose expiry_date is not after the current logical clock" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Instrument serial_number already exists" }
  - { id: ERR_MODEL_OBSOLETE, http: 422, condition: "Registering an instrument of an OBSOLETE model" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Activating a contract whose half-open window overlaps another ACTIVE contract on the same instrument" }
  - { id: ERR_UPDATE_MODEL_INCOMPATIBLE, http: 422, condition: "Update min_model_generation exceeds the instrument model generation" }
  - { id: ERR_RUN_MODE_LOCKED, http: 422, condition: "run_mode not in the instrument's unlocked_run_modes" }
  - { id: ERR_KIT_RUN_TYPE_MISMATCH, http: 422, condition: "Lot kit run_type differs from the run_mode" }
  - { id: ERR_CHEMISTRY_UNSUPPORTED, http: 422, condition: "Lot kit chemistry_version not in the instrument model's supported_chemistry_versions" }
  - { id: ERR_KIT_MODEL_INCOMPATIBLE, http: 422, condition: "Lot kit min_model_generation exceeds the instrument model generation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver/appraiser X-User-ID equals the creator's X-User-ID on an approval-gated transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 422, condition: "Contract coverage_end not after coverage_start" }
  - { id: ERR_ENROLLMENT_WINDOW_CLOSED, http: 422, condition: "Transition enrollment after enrollment_window_end, or new model generation not greater than old" }
  - { id: ERR_FORECAST_HORIZON_INVALID, http: 422, condition: "Forecast line week_start not a Monday 00:00:00Z, before the current week, or beyond the 26-week horizon" }
  - { id: ERR_RECONCILIATION_PERIOD_INVALID, http: 422, condition: "Uptime reconciliation window empty, in the future, or overlapping an already-reconciled period" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc with a timestamp not strictly greater than the current logical clock" }
  - { id: ERR_CREDIT_HOLD, http: 402, condition: "ReagentOrder SUBMIT while the account is on credit hold" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "Cloud analysis run cost exceeds the license credits_balance" }
  - { id: ERR_SUBSIDY_CAP_EXCEEDED, http: 422, condition: "Placement program subsidy pool exceeds 40% of committed annual reagent spend at SUBMIT" }
  - { id: ERR_ALLOCATION_IMPOSSIBLE, http: 422, condition: "FEFO allocation cannot fully satisfy every order line from usable lots; no partial reservation retained" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Forecast submission would push a (ISO week, cold_chain_class) bucket above its weekly aggregate capacity" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Vendor-side catalog and test-clock operator"
    identity: opaque
    exclusive_operations:
      - "POST /genomics/instrument-models"
      - "POST /genomics/reagent-kits and PATCH /genomics/reagent-kits/{id}"
      - "POST /genomics/software-updates and withdraw"
      - "POST /genomics/_clock/set_current_utc"
    shared_operations: []
  - name: AccountManager
    description: "Vendor-side sales/placement owner; manages accounts, instruments, placement and transition programs (creation side)"
    identity: opaque
    exclusive_operations:
      - "POST /genomics/accounts"
      - "POST /genomics/instruments"
      - "POST /genomics/placement-programs; review SUBMIT; amendments CREATE"
      - "POST /genomics/transition-programs"
      - "instruments/{id}/events action DECOMMISSION"
    shared_operations:
      - "GET reads on accounts, instruments, programs, contracts, orders, transitions, forecasts"
  - name: FinanceAdmin
    description: "Vendor-side contracts/billing owner; approves programs and appraisals (segregation of duties vs creator)"
    identity: opaque
    exclusive_operations:
      - "placement-programs review APPROVE/REJECT; amendments APPROVE/REJECT; close-period"
      - "POST /genomics/service-contracts; activate; uptime-reconciliations"
      - "POST /genomics/software-licenses; status; credit-grants; billing-close"
      - "transition-programs advance APPRAISE/COMPLETE"
    shared_operations:
      - "GET reads on accounts, instruments, programs, contracts, licenses, run-records, transitions"
  - name: FieldServiceEngineer
    description: "Vendor-side field engineer; installs, services, and updates instruments"
    identity: opaque
    exclusive_operations:
      - "instruments/{id}/events actions SHIP/INSTALL/COMMISSION/SERVICE_OPEN/SERVICE_CLOSE"
      - "POST /genomics/instruments/{id}/software-updates"
    shared_operations:
      - "GET reads on accounts and instruments"
  - name: SupplyPlanner
    description: "Vendor-side supply chain; manages lots, QC, order fulfillment legs, and forecasts"
    identity: opaque
    exclusive_operations:
      - "POST /genomics/reagent-lots and qc"
      - "reagent-orders advance actions SHIP/DELIVER"
      - "POST /genomics/supply-forecasts and advance SUBMIT/FREEZE"
    shared_operations:
      - "GET reads on accounts, instruments, lots, orders, run-records"
  - name: LabOperator
    description: "Customer-side lab operator acting as their Account; creates/submits/cancels/returns own orders and records runs"
    identity: entity_backed:Account
    exclusive_operations:
      - "POST /genomics/reagent-orders; advance actions SUBMIT/CANCEL/RETURN (own account only)"
      - "POST /genomics/run-records (instrument must belong to own account)"
    shared_operations:
      - "GET reads on own account, its instruments, orders, programs, lots, licenses, transitions, run-records"
