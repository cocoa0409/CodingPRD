            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "Film X", runtime_minutes: 100, worldwide_release_date: "2026-09-05T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_x_id: $.data.id } }
