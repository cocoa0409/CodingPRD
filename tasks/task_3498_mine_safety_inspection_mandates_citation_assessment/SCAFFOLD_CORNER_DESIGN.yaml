            - "mine_id + contest_status=UNCONTESTED returns exactly 2 rows"
            - "mine_id + abatement_status=OPEN returns 3 rows with total_count == 3"

      - name: assessment_subresource_returns_singleton
        claim_type: Computed read
        grounds:
