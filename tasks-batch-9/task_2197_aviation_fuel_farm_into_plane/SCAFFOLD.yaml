scenario: "2197. Aviation Fuel Farm & Into-Plane Fueling (airport fuel consortium): fuel receipt & quality control testing chain, tank inventory & reconciliation with meter tickets, into-plane fueling order by flight & uplift record, fuel release/contract-fuel authorization codes, quality assurance sampling & filter change, spill response & environmental permit, invoicing by uplift with taxes & fees, hydrant vs truck operations"
domain_name: "aviation-fuel-farm-into-plane"
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # StorageTank, FuelingAsset, HydrantPit, Flight, FuelAuthorization and AirlineAccount are
  # peer aggregates joined by FK edges; FuelingOrder is a 5-way join node (flight,
  # authorization, tank, asset, pit) and QualitySample is polymorphic over three parents,
  # so the reference structure is a graph rather than a single ownership tree.

  state_machine_shape: parallel
  # StorageTank carries two independent state dimensions (service_status x quality_status)
  # that evolve separately on the same row; FuelReceipt and Invoice add revision cycles;
  # SpillIncident adds a branching fork; FuelFarm.posture is a derived posture field.

  relationship_patterns:
    - one_to_many          # FuelFarm -> StorageTank / FuelingAsset / HydrantPit
    - polymorphic          # QualitySample.fuel_receipt_id | storage_tank_id | fueling_asset_id
    - cross_aggregate      # FuelingOrder references StorageTank and AirlineAccount aggregates
    - self_referential     # Invoice.replaces_invoice_id -> Invoice.id

  role_model: segregation_of_duties
  # The QualityInspector who draws a QualitySample may not sign the release verdict for the
  # same FuelReceipt; the BillingClerk who issues an Invoice may not resolve its dispute.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: FuelFarm
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: Airport IATA code the farm serves
        constraints: exactly 3 uppercase letters; unique across FuelFarm
      - name: name
        type: string
        source: input
        description: Consortium farm name
      - name: hydrant_system_available
        type: boolean
        source: input
        description: Whether the farm has a pressurised hydrant loop (enables HYDRANT delivery_mode)
        default: false
      - name: unpumpable_bottom_liters
        type: number
        source: input
        description: Volume per tank below the suction point that can never be issued
        default: 500.0
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: Derived operational posture gating all child operations; recomputed by calculations.farm_posture on every mutation of a child tank, asset, spill or permit
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: active_permit_throughput_used_liters
        type: number
        source: computed
        description: Net liters counted against the active EnvironmentalPermit for the logical-clock UTC day; see calculations.permit_daily_throughput_used
        default: 0.0
      - name: in_service_asset_count
        type: integer
        source: computed
        description: Count of child FuelingAsset rows with status == IN_SERVICE
        default: 0
      - name: open_spill_count
        type: integer
        source: computed
        description: Count of child SpillIncident rows with status IN {REPORTED, ESCALATED}
        default: 0

  - name: EnvironmentalPermit
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; the farm this discharge/storage permit covers"
      - name: permit_number
        type: string
        source: input
        description: Regulator-issued permit number
        constraints: unique across EnvironmentalPermit
      - name: valid_from_utc
        type: datetime
        source: input
        description: Inclusive start of permit validity
      - name: valid_until_utc
        type: datetime
        source: input
        description: Exclusive end of permit validity; the permit is expired once clock_now >= valid_until_utc
      - name: max_daily_throughput_liters
        type: number
        source: input
        description: Permitted net liters of movement (receipts released plus uplifts posted) per UTC day
        constraints: "> 0"
      - name: max_reportable_spill_liters
        type: number
        source: input
        description: Spill volume at or above which the incident must be escalated to the regulator
        default: 20.0
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, EXPIRED"
      - name: suspension_reason
        type: string
        source: input
        description: Free text recorded when an EnvironmentalOfficer suspends the permit
        default: null

  - name: StorageTank
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; owning farm"
      - name: tank_code
        type: string
        source: input
        description: Tank designator
        constraints: unique per fuel_farm_id
      - name: capacity_liters
        type: number
        source: input
        description: Nominal shell capacity
        constraints: "> 0"
      - name: safe_fill_liters
        type: number
        source: input
        description: Maximum book volume permitted after any receipt release
        constraints: "> 0 and <= capacity_liters"
      - name: density_kg_per_m3
        type: number
        source: input
        description: Certificated product density at 15 C for this tank's parcel; selects the volume-correction band in calculations.receipt_net_volume_at_15c
        constraints: ">= 750 and <= 850"
      - name: opening_volume_liters
        type: number
        source: input
        description: Net liters at 15 C present in the tank when it is registered; the ledger baseline
        default: 0.0
        constraints: ">= 0 and <= safe_fill_liters"
      - name: book_volume_liters
        type: number
        source: computed
        description: Ledger volume from calculations.tank_book_inventory (opening plus released receipts minus posted uplifts plus posted reconciliation adjustments)
        default: 0.0
      - name: reserved_volume_liters
        type: number
        source: computed
        description: Sum of requested_uplift_liters over child FuelingOrder rows with status IN {AUTHORIZED, ASSIGNED, FUELING}
        default: 0.0
      - name: available_volume_liters
        type: number
        source: computed
        description: "book_volume_liters - reserved_volume_liters - FuelFarm.unpumpable_bottom_liters, floored at 0.0"
        default: 0.0
      - name: service_status
        type: enum
        source: system
        description: Mechanical availability dimension; evolves independently of quality_status
        default: IN_SERVICE
        constraints: "one of IN_SERVICE, ISOLATED, OUT_OF_SERVICE"
      - name: quality_status
        type: enum
        source: system
        description: Product-quality dimension; evolves independently of service_status
        default: ON_TEST
        constraints: "one of ON_TEST, RELEASED, QUARANTINED"
      - name: isolation_window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the currently booked isolation window (set when service_status becomes ISOLATED)
        default: null
      - name: isolation_window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the currently booked isolation window
        default: null
      - name: last_gauge_volume_liters
        type: number
        source: input
        description: Net liters at 15 C from the most recent manual gauge measurement
        default: null
      - name: last_gauge_at_utc
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent gauge measurement
        default: null
      - name: water_bottom_mm
        type: number
        source: input
        description: Free water depth on the tank bottom from the latest gauge; >= 25.0 forces quarantine
        default: 0.0

  - name: FuelReceipt
    parent: StorageTank
    common_fields: true
    fields:
      - name: storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; destination tank of the parcel"
      - name: delivery_mode
        type: enum
        source: input
        description: How the parcel arrived; selects the governing gross-volume basis
        constraints: "one of PIPELINE, TRUCK"
      - name: supplier_name
        type: string
        source: input
        description: Delivering supplier
      - name: meter_ticket_number
        type: string
        source: input
        description: Supplier meter ticket identifier
        constraints: unique across FuelReceipt
      - name: meter_ticket_gross_liters
        type: number
        source: input
        description: Gross liters printed on the supplier meter ticket
        constraints: "> 0"
      - name: tank_opening_gauge_liters
        type: number
        source: input
        description: Tank gauge reading before the parcel landed
        constraints: ">= 0"
      - name: tank_closing_gauge_liters
        type: number
        source: input
        description: Tank gauge reading after the parcel landed
        constraints: "> tank_opening_gauge_liters"
      - name: temperature_c
        type: number
        source: input
        description: Observed parcel temperature in Celsius at receipt
        constraints: ">= -20 and <= 60"
      - name: certificate_density_kg_per_m3
        type: number
        source: input
        description: Density at 15 C from the supplier's refinery certificate of quality
        constraints: ">= 750 and <= 850"
      - name: measured_water_liters
        type: number
        source: input
        description: Free water drained from the parcel before deduction capping
        default: 0.0
        constraints: ">= 0"
      - name: governing_gross_liters
        type: number
        source: computed
        description: Gross basis picked by delivery_mode per calculations.receipt_net_volume_at_15c (TRUCK -> meter ticket, PIPELINE -> gauge delta)
        default: null
      - name: advisory_gross_liters
        type: number
        source: computed
        description: The non-governing gross basis retained for the reconciliation audit trail
        default: null
      - name: net_volume_liters
        type: number
        source: computed
        description: Governing net liters at 15 C after volume correction and water capping; added to the tank ledger only on RELEASED
        default: null
      - name: advisory_net_volume_liters
        type: number
        source: computed
        description: Net liters at 15 C computed from advisory_gross_liters with the same correction; never enters the ledger
        default: null
      - name: status
        type: enum
        source: system
        description: Quality-control chain state
        default: RECORDED
        constraints: "one of RECORDED, SAMPLED, UNDER_TEST, RELEASED, QUARANTINED, REJECTED"
      - name: sampled_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who drew the most recent QualitySample for this receipt
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who signed the release or quarantine verdict
        default: null
      - name: released_at_utc
        type: datetime
        source: system
        description: Logical-clock timestamp at which status became RELEASED; the permit-day window key
        default: null
      - name: retest_round
        type: integer
        source: system
        description: Number of times this receipt has re-entered SAMPLED from QUARANTINED
        default: 0

  - name: QualitySample
    parent: null
    common_fields: true
    fields:
      - name: fuel_receipt_id
        type: string
        source: input
        description: "FK -> FuelReceipt.id; set when the sample belongs to a receipt QC chain, else null"
        default: null
      - name: storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; set for periodic tank QA sampling, else null"
        default: null
      - name: fueling_asset_id
        type: string
        source: input
        description: "FK -> FuelingAsset.id; set for post-filter-change membrane sampling, else null"
        default: null
      - name: sample_purpose
        type: enum
        source: input
        description: Why the sample was drawn
        constraints: "one of RECEIPT_QC, PERIODIC_TANK_QA, POST_FILTER_CHANGE"
      - name: drawn_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who drew the sample
      - name: tested_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who posted the test results
        default: null
      - name: water_reaction_rating
        type: integer
        source: input
        description: ASTM D1094 interface rating; passes when <= 1
        default: null
        constraints: ">= 1 and <= 3"
      - name: particulate_mg_per_l
        type: number
        source: input
        description: Membrane particulate contamination; passes when <= 1.0
        default: null
        constraints: ">= 0"
      - name: conductivity_ps_per_m
        type: number
        source: input
        description: Static dissipator conductivity; passes when >= 50 and <= 600 (both bounds inclusive)
        default: null
        constraints: ">= 0"
      - name: observed_density_kg_per_m3
        type: number
        source: input
        description: Density at 15 C measured on the sample; passes when within 3.0 of the comparison density
        default: null
      - name: flash_point_c
        type: number
        source: input
        description: Flash point in Celsius; passes when >= 38.0
        default: null
      - name: verdict
        type: enum
        source: computed
        description: Overall verdict from calculations.sample_verdict; PASS only when every posted metric passes
        default: null
        constraints: "one of PASS, FAIL"
      - name: failed_metrics
        type: array
        source: computed
        description: Names of the metric fields that failed, ordered as water_reaction_rating, particulate_mg_per_l, conductivity_ps_per_m, observed_density_kg_per_m3, flash_point_c
        default: []
      - name: status
        type: enum
        source: system
        description: Sample lifecycle state
        default: DRAWN
        constraints: "one of DRAWN, TESTED"

  - name: FuelingAsset
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; owning farm"
      - name: asset_code
        type: string
        source: input
        description: Asset designator
        constraints: unique per fuel_farm_id
      - name: asset_type
        type: enum
        source: input
        description: TRUCK refuellers carry product; HYDRANT_CART only meters product from the hydrant loop
        constraints: "one of TRUCK, HYDRANT_CART"
      - name: tank_capacity_liters
        type: number
        source: input
        description: On-board tank capacity; must be 0 for HYDRANT_CART
        default: 0.0
        constraints: ">= 0"
      - name: onboard_volume_liters
        type: number
        source: computed
        description: "Net liters at 15 C drawn from the farm ledger but not yet closed out: sum of UpliftRecord.net_liters with status == POSTED whose parent FuelingOrder has status == FUELING, delivery_mode == TRUCK and fueling_asset_id == this asset. Always 0.0 for HYDRANT_CART."
        default: 0.0
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Mandatory gap after a booked fueling window before the asset can take the next order
        default: 15
        constraints: ">= 0"
      - name: liters_since_filter_change
        type: number
        source: computed
        description: Net liters metered through the asset since the most recent FilterChange (or since registration)
        default: 0.0
      - name: last_filter_change_at_utc
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent FilterChange; defaults to the registration time
        default: null
      - name: differential_pressure_kpa
        type: number
        source: input
        description: Latest measured filter differential pressure
        default: 0.0
        constraints: ">= 0"
      - name: element_life_pct
        type: number
        source: computed
        description: Worst-of-three element consumption from calculations.filter_element_life_pct
        default: 0.0
      - name: reliability_score
        type: integer
        source: computed
        description: Spill-attribution score from calculations.asset_reliability_score; starts at 100
        default: 100
      - name: status
        type: enum
        source: system
        description: Asset availability state
        default: IN_SERVICE
        constraints: "one of IN_SERVICE, FILTER_DUE, DOWN_FOR_FILTER, DOWN_MAINTENANCE"

  - name: FilterChange
    parent: FuelingAsset
    common_fields: false
    fields:
      - name: fueling_asset_id
        type: string
        source: input
        description: "FK -> FuelingAsset.id; asset whose filter elements were replaced"
      - name: element_lot_number
        type: string
        source: input
        description: Filter element lot identifier
      - name: element_count
        type: integer
        source: input
        description: Number of elements replaced
        constraints: ">= 1"
      - name: liters_at_change
        type: number
        source: system
        description: Value of FuelingAsset.liters_since_filter_change captured immediately before the reset
      - name: differential_pressure_before_kpa
        type: number
        source: system
        description: Value of FuelingAsset.differential_pressure_kpa captured immediately before the reset
      - name: changed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who performed the change
      - name: changed_at_utc
        type: datetime
        source: system
        description: Logical-clock timestamp of the change

  - name: HydrantPit
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; owning farm; the farm must have hydrant_system_available == true"
      - name: pit_code
        type: string
        source: input
        description: Pit designator
        constraints: unique per fuel_farm_id
      - name: stand_code
        type: string
        source: input
        description: Aircraft stand the pit serves
      - name: source_storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; the tank whose product the hydrant loop feeds through this pit"
      - name: status
        type: enum
        source: system
        description: Pit availability state
        default: AVAILABLE
        constraints: "one of AVAILABLE, LOCKED_OUT"

  - name: AirlineAccount
    parent: null
    common_fields: true
    fields:
      - name: airline_iata_code
        type: string
        source: input
        description: Two-character airline IATA designator used as the authorization-code prefix
        constraints: exactly 2 uppercase alphanumeric characters; unique across AirlineAccount
      - name: legal_name
        type: string
        source: input
        description: Airline legal entity name
      - name: contract_type
        type: enum
        source: input
        description: CONTRACT_FUEL airlines buy at the consortium contract price; INTO_PLANE_ONLY airlines supply their own fuel and pay handling only
        constraints: "one of CONTRACT_FUEL, INTO_PLANE_ONLY"
      - name: base_price_cents_per_liter
        type: number
        source: input
        description: Contract base product price in cents per liter; 0 for INTO_PLANE_ONLY accounts
        constraints: ">= 0"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum permitted accrual-basis exposure in cents
        constraints: ">= 0"
      - name: tax_exempt
        type: boolean
        source: input
        description: True when a valid federal excise and state sales tax exemption certificate is on file
        default: false
      - name: invoiced_exposure_cents
        type: integer
        source: computed
        description: Invoiced-basis exposure from calculations.airline_credit_exposure variant invoiced_basis
        default: 0
      - name: accrual_exposure_cents
        type: integer
        source: computed
        description: Accrual-basis exposure from calculations.airline_credit_exposure variant accrual_basis; governs order authorization
        default: 0
      - name: status
        type: enum
        source: system
        description: Account standing
        default: ACTIVE
        constraints: "one of ACTIVE, CREDIT_HOLD"

  - name: Flight
    parent: AirlineAccount
    common_fields: true
    fields:
      - name: airline_account_id
        type: string
        source: input
        description: "FK -> AirlineAccount.id; owning airline account"
      - name: flight_number
        type: string
        source: input
        description: Commercial flight number
        constraints: unique per airline_account_id and scheduled_departure_utc
      - name: tail_number
        type: string
        source: input
        description: Aircraft registration
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: Scheduled off-block time; the authorization-code date component and the fueling-window anchor
      - name: stand_code
        type: string
        source: input
        description: Aircraft stand; must match HydrantPit.stand_code for HYDRANT delivery
      - name: status
        type: enum
        source: system
        description: Flight lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, DEPARTED, CANCELLED"

  - name: FuelAuthorization
    parent: AirlineAccount
    common_fields: true
    fields:
      - name: airline_account_id
        type: string
        source: input
        description: "FK -> AirlineAccount.id; account that will be billed against this authorization"
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id; the single flight this authorization may be redeemed for"
      - name: authorization_code
        type: string
        source: computed
        description: Deterministic release code from calculations.authorization_code; the into-plane agent must quote it verbatim
        constraints: 14 characters; unique across FuelAuthorization
      - name: day_sequence
        type: integer
        source: computed
        description: Per-airline per-flight-departure-day issuance sequence starting at 1, ordered by created_at ASC
      - name: max_authorized_liters
        type: number
        source: input
        description: Ceiling on total posted uplift net liters redeemable under this authorization
        constraints: "> 0"
      - name: expires_at_utc
        type: datetime
        source: computed
        description: Flight.scheduled_departure_utc plus 2 hours; the authorization is expired once clock_now >= this value
      - name: status
        type: enum
        source: system
        description: Authorization lifecycle state
        default: ISSUED
        constraints: "one of ISSUED, REDEEMED, VOIDED, EXPIRED"
      - name: voided_reason
        type: enum
        source: system
        description: Why the authorization was voided
        default: null
        constraints: "one of MANUAL, ORDER_CANCELLED, FARM_FROZEN"

  - name: FuelingOrder
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id; the flight to be fuelled"
      - name: fuel_authorization_id
        type: string
        source: input
        description: "FK -> FuelAuthorization.id; the authorization quoted on the order"
      - name: storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; the tank the product is drawn from"
      - name: fueling_asset_id
        type: string
        source: input
        description: "FK -> FuelingAsset.id; assigned refueller or hydrant cart; null until ASSIGNED"
        default: null
      - name: hydrant_pit_id
        type: string
        source: input
        description: "FK -> HydrantPit.id; occupied pit for HYDRANT delivery; null for TRUCK delivery"
        default: null
      - name: delivery_mode
        type: enum
        source: input
        description: HYDRANT occupies a pit and requires a HYDRANT_CART; TRUCK requires a TRUCK asset and no pit
        constraints: "one of HYDRANT, TRUCK"
      - name: requested_uplift_liters
        type: number
        source: input
        description: Net liters at 15 C the airline requests; the reservation quantity against the tank
        constraints: "> 0"
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the booked fueling window
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the booked fueling window
        constraints: "> window_start_utc"
      - name: quoted_authorization_code
        type: string
        source: input
        description: Code the requester quotes; must equal FuelAuthorization.authorization_code character for character
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: Estimated billable value of requested_uplift_liters at authorization time; the accrual-basis reservation
        default: 0
      - name: posted_net_liters
        type: number
        source: computed
        description: Sum of net_liters over child UpliftRecord rows with status == POSTED
        default: 0.0
      - name: status
        type: enum
        source: system
        description: Into-plane order lifecycle state
        default: REQUESTED
        constraints: "one of REQUESTED, AUTHORIZED, ASSIGNED, FUELING, COMPLETED, CANCELLED, ABORTED"
      - name: unassign_count
        type: integer
        source: system
        description: Number of times the order has cycled ASSIGNED -> AUTHORIZED via unassign
        default: 0
      - name: abort_reason
        type: enum
        source: system
        description: Why fuelling was aborted
        default: null
        constraints: "one of SPILL, QUALITY_HOLD, AIRCRAFT_RELEASE, EQUIPMENT_FAILURE"

  - name: UpliftRecord
    parent: FuelingOrder
    common_fields: true
    fields:
      - name: fueling_order_id
        type: string
        source: input
        description: "FK -> FuelingOrder.id; the order this uplift ticket belongs to"
      - name: storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; copied from the order at creation so the ledger hop is explicit"
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; set when the uplift is swept onto a draft invoice, else null"
        default: null
      - name: ticket_number
        type: string
        source: input
        description: Into-plane delivery ticket number
        constraints: unique across UpliftRecord
      - name: meter_start_liters
        type: number
        source: input
        description: Totaliser reading before fuelling
        constraints: ">= 0"
      - name: meter_end_liters
        type: number
        source: input
        description: Totaliser reading after fuelling
        constraints: "> meter_start_liters"
      - name: temperature_c
        type: number
        source: input
        description: Product temperature at the wing in Celsius
        constraints: ">= -20 and <= 60"
      - name: gross_liters
        type: number
        source: computed
        description: "meter_end_liters - meter_start_liters"
        default: null
      - name: net_liters
        type: number
        source: computed
        description: Volume-corrected net liters at 15 C from calculations.uplift_net_liters
        default: null
      - name: billed_line_cents
        type: integer
        source: computed
        description: Total billable cents for this uplift from calculations.uplift_invoice_line_amount; frozen when the invoice is issued
        default: null
      - name: fuel_component_cents
        type: integer
        source: computed
        description: Product-only component of billed_line_cents, used by the invoice volume rebate
        default: null
      - name: volume_tier_diff_cents_per_liter
        type: number
        source: computed
        description: Differential rate selected by the airline's month-to-date cumulative net liters including this uplift
        default: null
      - name: status
        type: enum
        source: system
        description: Uplift ticket state
        default: POSTED
        constraints: "one of POSTED, VOIDED, BILLED"
      - name: voided_reason
        type: enum
        source: system
        description: Why the ticket was voided
        default: null
        constraints: "one of ORDER_ABORTED, INVOICE_VOIDED"

  - name: SpillIncident
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; farm where the release occurred"
      - name: fueling_asset_id
        type: string
        source: input
        description: "FK -> FuelingAsset.id; asset attributed with the release, else null"
        default: null
      - name: storage_tank_id
        type: string
        source: input
        description: "FK -> StorageTank.id; tank attributed with the release, else null"
        default: null
      - name: spilled_volume_liters
        type: number
        source: input
        description: Estimated released volume; compared against EnvironmentalPermit.max_reportable_spill_liters
        constraints: "> 0"
      - name: contained_volume_liters
        type: number
        source: input
        description: Volume recovered into containment; set on the CONTAINED transition
        default: null
      - name: surface
        type: enum
        source: input
        description: Where the product landed
        constraints: "one of APRON, TANK_BUND, UNSEALED_GROUND, STORM_DRAIN"
      - name: regulator_reference
        type: string
        source: input
        description: Regulator notification reference; required on the ESCALATED transition
        default: null
      - name: status
        type: enum
        source: system
        description: Spill response state
        default: REPORTED
        constraints: "one of REPORTED, ESCALATED, CONTAINED, REMEDIATED, CLOSED"
      - name: reported_at_utc
        type: datetime
        source: system
        description: Logical-clock timestamp when the incident was reported

  - name: ReconciliationRun
    parent: FuelFarm
    common_fields: true
    fields:
      - name: fuel_farm_id
        type: string
        source: input
        description: "FK -> FuelFarm.id; farm being reconciled"
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive start of the reconciliation period
      - name: period_end_utc
        type: datetime
        source: input
        description: Exclusive end of the reconciliation period
        constraints: "> period_start_utc"
      - name: tank_measurements
        type: array
        source: input
        description: Array of objects { storage_tank_id, measured_volume_liters, temperature_c } posted by the measure endpoint, one per IN_SERVICE or ISOLATED tank at the farm
        default: []
      - name: receipts_net_liters
        type: number
        source: computed
        description: Sum of FuelReceipt.net_volume_liters for receipts at the farm with status == RELEASED and released_at_utc in [period_start_utc, period_end_utc)
        default: 0.0
      - name: uplifts_net_liters
        type: number
        source: computed
        description: Sum of UpliftRecord.net_liters for tickets drawn from the farm's tanks with status IN {POSTED, BILLED} and created_at in [period_start_utc, period_end_utc)
        default: 0.0
      - name: throughput_liters
        type: number
        source: computed
        description: "receipts_net_liters + uplifts_net_liters; the governing variance denominator"
        default: 0.0
      - name: variance_liters
        type: number
        source: computed
        description: Signed measured-minus-book variance from calculations.reconciliation_gain_loss
        default: null
      - name: variance_pct_throughput_basis
        type: number
        source: computed
        description: Governing variance percentage on the throughput denominator
        default: null
      - name: variance_pct_opening_stock_basis
        type: number
        source: computed
        description: Advisory variance percentage on the opening-book-volume denominator
        default: null
      - name: adjustment_liters
        type: number
        source: computed
        description: Ledger adjustment written to each tank when the run is POSTED; equals the per-tank signed variance
        default: null
      - name: status
        type: enum
        source: system
        description: Reconciliation run state
        default: OPEN
        constraints: "one of OPEN, MEASURED, VARIANCE_HOLD, POSTED"
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConsortiumAdmin who posted the run
        default: null

  - name: Invoice
    parent: AirlineAccount
    common_fields: true
    fields:
      - name: airline_account_id
        type: string
        source: input
        description: "FK -> AirlineAccount.id; billed account"
      - name: replaces_invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; set on a reissue that supersedes a VOIDED invoice, else null"
        default: null
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive start of the billing period sweep
      - name: period_end_utc
        type: datetime
        source: input
        description: Exclusive end of the billing period sweep
        constraints: "> period_start_utc"
      - name: swept_net_liters
        type: number
        source: computed
        description: Sum of net_liters over the UpliftRecord rows swept onto this invoice
        default: 0.0
      - name: fuel_component_cents
        type: integer
        source: computed
        description: Sum of UpliftRecord.fuel_component_cents over swept tickets; the rebate base
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of UpliftRecord.billed_line_cents over swept tickets, each already rounded to whole cents
        default: 0
      - name: volume_rebate_cents
        type: integer
        source: computed
        description: Rebate from calculations.invoice_total_with_fees step 2
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Consortium administration fee from calculations.invoice_total_with_fees step 3
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: Final payable amount from calculations.invoice_total_with_fees step 4
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Sum of recorded payment amounts
        default: 0
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, DISPUTED, PAID, VOIDED"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the BillingClerk who issued the invoice
        default: null
      - name: dispute_resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BillingClerk who resolved the dispute; must differ from issued_by_user_id
        default: null
      - name: dispute_round
        type: integer
        source: system
        description: Number of completed ISSUED -> DISPUTED -> ISSUED cycles
        default: 0

state_machines:
  - entity: FuelReceipt
    initial_state: RECORDED
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: RECORDED
        to: SAMPLED
        trigger: "POST /fuel-receipts/{id}/samples"
        actor: QualityInspector
        preconditions:
          - "FuelFarm.posture of the receipt's tank's farm != FROZEN"
          - "StorageTank.service_status != OUT_OF_SERVICE"
        side_effects:
          - "creates a QualitySample with sample_purpose == RECEIPT_QC, status DRAWN, fuel_receipt_id == this receipt"
          - "sets FuelReceipt.sampled_by_user_id to the X-User-ID header value"
          - "increments FuelReceipt.version by 1"
      - from: SAMPLED
        to: UNDER_TEST
        trigger: "POST /quality-samples/{id}/test-results (system transition on the parent receipt)"
        actor: QualityInspector
        preconditions:
          - "the QualitySample referenced has status == DRAWN and fuel_receipt_id == this receipt"
        side_effects:
          - "sets QualitySample.status to TESTED and computes QualitySample.verdict and failed_metrics via calculations.sample_verdict"
          - "sets QualitySample.tested_by_user_id to the X-User-ID header value"
          - "increments FuelReceipt.version by 1"
      - from: UNDER_TEST
        to: RELEASED
        trigger: "POST /fuel-receipts/{id}/verdict with decision == RELEASE"
        actor: QualityInspector
        preconditions:
          - "the latest QualitySample for this receipt has status == TESTED and verdict == PASS"
          - "X-User-ID != FuelReceipt.sampled_by_user_id (segregation of duties)"
          - "StorageTank.book_volume_liters + FuelReceipt.net_volume_liters <= StorageTank.safe_fill_liters"
          - "FuelFarm.active_permit_throughput_used_liters + FuelReceipt.net_volume_liters <= EnvironmentalPermit.max_daily_throughput_liters"
          - "the farm's EnvironmentalPermit with status == ACTIVE covers clock_now"
        side_effects:
          - "sets released_at_utc to clock_now and released_by_user_id to the X-User-ID header value"
          - "adds FuelReceipt.net_volume_liters to the ledger, recomputing StorageTank.book_volume_liters, reserved_volume_liters and available_volume_liters"
          - "recomputes FuelFarm.active_permit_throughput_used_liters (calculations.permit_daily_throughput_used)"
          - "recomputes FuelFarm.posture (calculations.farm_posture) which may become RESTRICTED at the 90 percent permit-utilisation boundary"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
      - from: UNDER_TEST
        to: QUARANTINED
        trigger: "POST /fuel-receipts/{id}/verdict with decision == QUARANTINE"
        actor: QualityInspector
        preconditions:
          - "the latest QualitySample for this receipt has status == TESTED"
          - "X-User-ID != FuelReceipt.sampled_by_user_id (segregation of duties)"
        side_effects:
          - "CASCADE HOP 1: sets StorageTank.quality_status to QUARANTINED for the destination tank (the tank's own transition RELEASED_to_QUARANTINED or ON_TEST_to_QUARANTINED)"
          - "CASCADE HOP 2: caused by hop 1, every FuelingOrder with storage_tank_id == this tank and status == ASSIGNED is driven ASSIGNED -> AUTHORIZED (unassign), releasing its fueling_asset_id and hydrant_pit_id and incrementing unassign_count; every such order with status == FUELING is driven FUELING -> ABORTED with abort_reason == QUALITY_HOLD"
          - "CASCADE HOP 3: caused by hop 2, each unassigned or aborted order's pit occupancy ends, each ABORTED order's POSTED UpliftRecord rows become VOIDED with voided_reason == ORDER_ABORTED and their net_liters are credited back to StorageTank.book_volume_liters, each affected FuelAuthorization is VOIDED, and FuelFarm.posture is recomputed to RESTRICTED"
          - "sets released_by_user_id to the X-User-ID header value"
          - "increments FuelReceipt.version, StorageTank.version and FuelFarm.version by 1 each"
        note: "Branch sibling of UNDER_TEST -> RELEASED with a disjoint side-effect set; this is the depth-3 quality cascade."
      - from: QUARANTINED
        to: SAMPLED
        trigger: "POST /fuel-receipts/{id}/samples (re-sample round)"
        actor: QualityInspector
        preconditions:
          - "FuelReceipt.retest_round <= 1 (a receipt may be re-sampled at most twice)"
          - "FuelFarm.posture != FROZEN"
        side_effects:
          - "increments FuelReceipt.retest_round by 1"
          - "creates a new QualitySample with sample_purpose == RECEIPT_QC and status DRAWN"
          - "sets FuelReceipt.sampled_by_user_id to the X-User-ID header value"
          - "increments FuelReceipt.version by 1"
        note: "Revision cycle QUARANTINED -> SAMPLED -> UNDER_TEST -> {RELEASED, QUARANTINED}."
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /fuel-receipts/{id}/reject"
        actor: FarmOperator
        preconditions:
          - "FuelReceipt.status == QUARANTINED"
        side_effects:
          - "the parcel is returned to the supplier: no ledger volume is added and FuelFarm.active_permit_throughput_used_liters is left unchanged (conservation invariant permit_throughput_conservation)"
          - "if no other FuelReceipt with status == QUARANTINED targets the tank and the tank's latest PERIODIC_TANK_QA sample verdict is PASS, sets StorageTank.quality_status back to RELEASED"
          - "recomputes FuelFarm.posture"
          - "increments FuelReceipt.version and StorageTank.version by 1 each"

  - entity: StorageTank
    initial_state: "service_status=IN_SERVICE + quality_status=ON_TEST"
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: IN_SERVICE
        to: ISOLATED
        trigger: "POST /storage-tanks/{id}/service-status with to_status == ISOLATED"
        actor: FarmOperator
        preconditions:
          - "no FuelingOrder with storage_tank_id == this tank has status IN {ASSIGNED, FUELING}"
          - "the requested isolation window [isolation_window_start_utc, isolation_window_end_utc) does not overlap the isolation window of any other tank at the same farm whose service_status == ISOLATED, and the count of already-ISOLATED tanks at the farm whose window overlaps is 0 (aggregate concurrency capacity 1 per farm)"
        side_effects:
          - "stores isolation_window_start_utc and isolation_window_end_utc on the tank"
          - "recomputes StorageTank.available_volume_liters to 0.0 while ISOLATED"
          - "recomputes FuelFarm.posture"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
        note: "service_status dimension; independent of quality_status."
      - from: ISOLATED
        to: IN_SERVICE
        trigger: "POST /storage-tanks/{id}/service-status with to_status == IN_SERVICE"
        actor: FarmOperator
        preconditions:
          - "StorageTank.quality_status != QUARANTINED"
          - "StorageTank.water_bottom_mm < 25.0"
        side_effects:
          - "clears isolation_window_start_utc and isolation_window_end_utc to null"
          - "recomputes StorageTank.available_volume_liters and FuelFarm.posture"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
        note: "Cycle IN_SERVICE -> ISOLATED -> IN_SERVICE on the service dimension."
      - from: ISOLATED
        to: OUT_OF_SERVICE
        trigger: "POST /storage-tanks/{id}/service-status with to_status == OUT_OF_SERVICE"
        actor: ConsortiumAdmin
        preconditions:
          - "StorageTank.book_volume_liters <= FuelFarm.unpumpable_bottom_liters"
        side_effects:
          - "every HydrantPit with source_storage_tank_id == this tank becomes LOCKED_OUT"
          - "recomputes FuelFarm.posture"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
      - from: ON_TEST
        to: RELEASED
        trigger: "POST /storage-tanks/{id}/quality-release"
        actor: QualityInspector
        preconditions:
          - "a QualitySample with storage_tank_id == this tank, sample_purpose == PERIODIC_TANK_QA, status == TESTED and verdict == PASS exists whose created_at is the latest for this tank"
          - "X-User-ID != QualitySample.drawn_by_user_id of that sample (segregation of duties)"
          - "StorageTank.water_bottom_mm < 25.0"
        side_effects:
          - "sets quality_status to RELEASED, making the tank eligible as a FuelingOrder source"
          - "recomputes FuelFarm.posture"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
        note: "quality_status dimension; a tank may be RELEASED while service_status == ISOLATED."
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /storage-tanks/{id}/quarantine, or system cascade hop 1 from FuelReceipt UNDER_TEST -> QUARANTINED, or gauge measurement with water_bottom_mm >= 25.0"
        actor: QualityInspector
        preconditions:
          - "StorageTank.quality_status == RELEASED"
        side_effects:
          - "CASCADE HOP 2: every FuelingOrder on this tank with status == ASSIGNED is unassigned to AUTHORIZED and every order with status == FUELING is ABORTED with abort_reason == QUALITY_HOLD"
          - "CASCADE HOP 3: caused by hop 2, the freed orders' pit occupancy ends, aborted orders' POSTED uplifts become VOIDED and their net_liters are credited back to book_volume_liters, their FuelAuthorization rows are VOIDED, and FuelFarm.posture becomes RESTRICTED"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
      - from: QUARANTINED
        to: ON_TEST
        trigger: "POST /storage-tanks/{id}/samples with sample_purpose == PERIODIC_TANK_QA"
        actor: QualityInspector
        preconditions:
          - "no FuelReceipt targeting this tank has status == QUARANTINED"
        side_effects:
          - "creates a QualitySample with status DRAWN for the tank"
          - "recomputes FuelFarm.posture"
          - "increments StorageTank.version and FuelFarm.version by 1 each"
        note: "Cycle ON_TEST -> RELEASED -> QUARANTINED -> ON_TEST on the quality dimension."

  - entity: FuelingOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, ABORTED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /fueling-orders/{id}/authorize"
        actor: IntoPlaneAgent
        preconditions:
          - "FuelAuthorization.status == ISSUED and clock_now < FuelAuthorization.expires_at_utc"
          - "FuelingOrder.quoted_authorization_code == FuelAuthorization.authorization_code"
          - "AirlineAccount.status == ACTIVE"
          - "calculations.airline_credit_exposure variant accrual_basis, including this order's reserved_amount_cents, is <= AirlineAccount.credit_limit_cents"
          - "StorageTank.quality_status == RELEASED and StorageTank.service_status == IN_SERVICE"
          - "StorageTank.available_volume_liters >= FuelingOrder.requested_uplift_liters"
          - "FuelFarm.posture != FROZEN"
        side_effects:
          - "computes FuelingOrder.reserved_amount_cents via calculations.airline_credit_exposure reservation term"
          - "adds requested_uplift_liters to StorageTank.reserved_volume_liters and lowers available_volume_liters by the same amount"
          - "recomputes AirlineAccount.accrual_exposure_cents"
          - "increments FuelingOrder.version, StorageTank.version and AirlineAccount.version by 1 each"
      - from: AUTHORIZED
        to: ASSIGNED
        trigger: "POST /fueling-orders/{id}/assign"
        actor: IntoPlaneAgent
        preconditions:
          - "delivery_mode == TRUCK requires asset_type == TRUCK and hydrant_pit_id == null; delivery_mode == HYDRANT requires asset_type == HYDRANT_CART and a hydrant_pit_id whose HydrantPit.stand_code == Flight.stand_code"
          - "FuelingAsset.status == IN_SERVICE"
          - "FuelingAsset has no other order with status IN {ASSIGNED, FUELING} whose closed window [window_start_utc, window_end_utc + turnaround_buffer_minutes] intersects this order's closed window"
          - "for HYDRANT: HydrantPit.status == AVAILABLE and no other order with status IN {ASSIGNED, FUELING} on the same pit whose half-open window [window_start_utc, window_end_utc) intersects this order's half-open window"
          - "for TRUCK: FuelingAsset.onboard_volume_liters >= requested_uplift_liters OR the truck's source tank has available_volume_liters >= requested_uplift_liters"
          - "FuelFarm.posture != FROZEN"
        side_effects:
          - "stores fueling_asset_id and, for HYDRANT, hydrant_pit_id"
          - "records the pit occupancy for the order's window; HydrantPit.status is NOT changed (LOCKED_OUT is reserved for administrative lockout when the source tank goes OUT_OF_SERVICE)"
          - "increments FuelingOrder.version and FuelingAsset.version by 1 each; for HYDRANT also HydrantPit.version"
      - from: ASSIGNED
        to: AUTHORIZED
        trigger: "POST /fueling-orders/{id}/unassign, or system cascade hop 2 from a tank quarantine"
        actor: IntoPlaneAgent
        preconditions:
          - "FuelingOrder.status == ASSIGNED"
        side_effects:
          - "clears fueling_asset_id and hydrant_pit_id to null and increments unassign_count by 1"
          - "clears hydrant_pit_id, which ends the order's pit occupancy for its window"
          - "leaves StorageTank.reserved_volume_liters unchanged (the reservation belongs to AUTHORIZED, not ASSIGNED)"
          - "increments FuelingOrder.version and FuelingAsset.version by 1 each"
        note: "Cycle AUTHORIZED -> ASSIGNED -> AUTHORIZED; re-assignment to a different asset is permitted."
      - from: ASSIGNED
        to: FUELING
        trigger: "POST /fueling-orders/{id}/start"
        actor: IntoPlaneAgent
        preconditions:
          - "clock_now >= FuelingOrder.window_start_utc and clock_now < FuelingOrder.window_end_utc"
          - "FuelingAsset.status == IN_SERVICE and FuelingAsset.element_life_pct < 100.0"
          - "StorageTank.quality_status == RELEASED"
          - "Flight.status == SCHEDULED"
          - "FuelFarm.posture == OPEN or (FuelFarm.posture == RESTRICTED and the order's tank is not QUARANTINED)"
        side_effects:
          - "increments FuelingOrder.version by 1"
      - from: FUELING
        to: COMPLETED
        trigger: "POST /fueling-orders/{id}/complete"
        actor: IntoPlaneAgent
        preconditions:
          - "at least one UpliftRecord with status == POSTED exists for this order"
          - "FuelingOrder.posted_net_liters <= FuelAuthorization.max_authorized_liters"
        side_effects:
          - "drives FuelAuthorization ISSUED -> REDEEMED"
          - "releases the reservation: subtracts requested_uplift_liters from StorageTank.reserved_volume_liters (the posted uplifts have already debited book_volume_liters), recomputing available_volume_liters"
          - "ends the order's pit occupancy (the order leaves the {ASSIGNED, FUELING} set) and leaves the TRUCK asset IN_SERVICE unless calculations.filter_element_life_pct has reached 100.0, in which case the asset transitions IN_SERVICE -> FILTER_DUE"
          - "recomputes AirlineAccount.accrual_exposure_cents (reservation term drops out, uncollected-uplift term enters)"
          - "increments FuelingOrder.version, FuelAuthorization.version, StorageTank.version, FuelingAsset.version and AirlineAccount.version by 1 each"
      - from: FUELING
        to: ABORTED
        trigger: "POST /fueling-orders/{id}/abort, or system cascade hop 2 from a tank quarantine, or system cascade hop 2 from a farm FROZEN posture"
        actor: IntoPlaneAgent
        preconditions:
          - "FuelingOrder.status == FUELING"
        side_effects:
          - "every UpliftRecord for this order with status == POSTED becomes VOIDED with voided_reason == ORDER_ABORTED and its net_liters are credited back to StorageTank.book_volume_liters"
          - "subtracts requested_uplift_liters from StorageTank.reserved_volume_liters"
          - "for TRUCK delivery, FuelingAsset.onboard_volume_liters recomputes to 0.0 because the voided tickets leave the POSTED set, so StorageTank.book_volume_liters + FuelingAsset.onboard_volume_liters is identical to its value before fuelling started (conservation invariant fuel_volume_conservation)"
          - "drives FuelAuthorization ISSUED -> VOIDED with voided_reason == ORDER_CANCELLED"
          - "ends the order's pit occupancy (the order leaves the {ASSIGNED, FUELING} set)"
          - "recomputes AirlineAccount.accrual_exposure_cents back to its pre-authorization value"
          - "increments FuelingOrder.version, StorageTank.version, FuelingAsset.version, FuelAuthorization.version and AirlineAccount.version by 1 each"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /fueling-orders/{id}/cancel"
        actor: AirlineRep
        preconditions:
          - "FuelingOrder.status == REQUESTED"
        side_effects:
          - "drives FuelAuthorization ISSUED -> VOIDED with voided_reason == ORDER_CANCELLED"
          - "increments FuelingOrder.version and FuelAuthorization.version by 1 each"
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /fueling-orders/{id}/cancel, or system cascade hop 2 from a farm FROZEN posture"
        actor: AirlineRep
        preconditions:
          - "FuelingOrder.status == AUTHORIZED"
        side_effects:
          - "subtracts requested_uplift_liters from StorageTank.reserved_volume_liters and restores available_volume_liters"
          - "drives FuelAuthorization ISSUED -> VOIDED with voided_reason == ORDER_CANCELLED (or FARM_FROZEN when the cascade drove it)"
          - "recomputes AirlineAccount.accrual_exposure_cents to its pre-authorization value"
          - "increments FuelingOrder.version, StorageTank.version, FuelAuthorization.version and AirlineAccount.version by 1 each"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /fueling-orders/{id}/cancel"
        actor: AirlineRep
        preconditions:
          - "FuelingOrder.status == ASSIGNED"
        side_effects:
          - "ends the order's pit occupancy and clears fueling_asset_id"
          - "subtracts requested_uplift_liters from StorageTank.reserved_volume_liters"
          - "drives FuelAuthorization ISSUED -> VOIDED with voided_reason == ORDER_CANCELLED"
          - "recomputes AirlineAccount.accrual_exposure_cents to its pre-authorization value"
          - "increments FuelingOrder.version, StorageTank.version, HydrantPit.version, FuelAuthorization.version and AirlineAccount.version by 1 each"

  - entity: FuelAuthorization
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOIDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "system, on FuelingOrder FUELING -> COMPLETED"
        actor: system
        preconditions:
          - "the completing order's posted_net_liters <= max_authorized_liters"
        side_effects:
          - "increments FuelAuthorization.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /fuel-authorizations/{id}/void, or system on FuelingOrder cancel/abort, or system cascade hop 3 from a farm FROZEN posture"
        actor: BillingClerk
        preconditions:
          - "FuelAuthorization.status == ISSUED"
          - "no FuelingOrder referencing this authorization has status IN {ASSIGNED, FUELING} when the trigger is the manual void endpoint"
        side_effects:
          - "sets voided_reason to MANUAL, ORDER_CANCELLED or FARM_FROZEN according to the trigger"
          - "increments FuelAuthorization.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system, evaluated whenever the authorization is read or referenced after POST /_clock/set_current_utc advances clock_now to or past expires_at_utc"
        actor: system
        preconditions:
          - "clock_now >= FuelAuthorization.expires_at_utc"
        side_effects:
          - "increments FuelAuthorization.version by 1"
        note: "Auto-transition; an EXPIRED authorization can no longer authorize an order."

  - entity: FuelingAsset
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: FILTER_DUE
        trigger: "system, when calculations.filter_element_life_pct reaches 100.0 after an uplift is posted or an order completes"
        actor: system
        preconditions:
          - "FuelingAsset.element_life_pct >= 100.0 and FuelingAsset.differential_pressure_kpa < 103.0"
        side_effects:
          - "blocks further AUTHORIZED -> ASSIGNED transitions for this asset"
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture (posture becomes RESTRICTED when the count reaches 0)"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"
      - from: FILTER_DUE
        to: DOWN_FOR_FILTER
        trigger: "POST /fueling-assets/{id}/status with to_status == DOWN_FOR_FILTER"
        actor: FarmOperator
        preconditions:
          - "no FuelingOrder on this asset has status IN {ASSIGNED, FUELING}"
        side_effects:
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"
      - from: IN_SERVICE
        to: DOWN_FOR_FILTER
        trigger: "system, when a gauge of differential_pressure_kpa >= 103.0 is posted with the filter change endpoint's pre-read, or POST /fueling-assets/{id}/status with to_status == DOWN_FOR_FILTER"
        actor: FarmOperator
        preconditions:
          - "no FuelingOrder on this asset has status IN {ASSIGNED, FUELING}"
        side_effects:
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"
      - from: DOWN_FOR_FILTER
        to: IN_SERVICE
        trigger: "POST /fueling-assets/{id}/filter-changes"
        actor: QualityInspector
        preconditions:
          - "FuelingAsset.status IN {DOWN_FOR_FILTER, FILTER_DUE}"
          - "FuelFarm.posture != FROZEN"
        side_effects:
          - "creates a FilterChange capturing liters_at_change and differential_pressure_before_kpa"
          - "resets liters_since_filter_change to 0.0, differential_pressure_kpa to the posted post_change_differential_pressure_kpa, last_filter_change_at_utc to clock_now and element_life_pct to its recomputed value"
          - "creates a QualitySample with sample_purpose == POST_FILTER_CHANGE and status DRAWN for the asset"
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"
        note: "Cycle IN_SERVICE -> FILTER_DUE -> DOWN_FOR_FILTER -> IN_SERVICE."
      - from: IN_SERVICE
        to: DOWN_MAINTENANCE
        trigger: "system, when calculations.asset_reliability_score falls below 60 after a spill attribution, or system cascade hop 2 from a farm FROZEN posture, or POST /fueling-assets/{id}/status with to_status == DOWN_MAINTENANCE"
        actor: system
        preconditions:
          - "FuelingAsset.status IN {IN_SERVICE, FILTER_DUE}"
        side_effects:
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"
      - from: DOWN_MAINTENANCE
        to: IN_SERVICE
        trigger: "POST /fueling-assets/{id}/status with to_status == IN_SERVICE"
        actor: ConsortiumAdmin
        preconditions:
          - "FuelingAsset.reliability_score >= 60"
          - "FuelingAsset.element_life_pct < 100.0"
          - "FuelFarm.posture != FROZEN"
        side_effects:
          - "recomputes FuelFarm.in_service_asset_count and FuelFarm.posture"
          - "increments FuelingAsset.version and FuelFarm.version by 1 each"

  - entity: SpillIncident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ESCALATED
        trigger: "POST /spill-incidents/{id}/escalate"
        actor: EnvironmentalOfficer
        preconditions:
          - "SpillIncident.spilled_volume_liters >= EnvironmentalPermit.max_reportable_spill_liters of the farm's ACTIVE permit"
          - "regulator_reference is supplied and non-empty"
        side_effects:
          - "CASCADE HOP 1: recomputes FuelFarm.posture, which becomes FROZEN because an incident with status == ESCALATED now exists at the farm"
          - "CASCADE HOP 2: caused by hop 1, every FuelingOrder at the farm with status == AUTHORIZED is driven AUTHORIZED -> CANCELLED and every order with status == FUELING is driven FUELING -> ABORTED with abort_reason == SPILL; every FuelingAsset at the farm with status IN {IN_SERVICE, FILTER_DUE} is driven to DOWN_MAINTENANCE"
          - "CASCADE HOP 3: caused by hop 2, each cancelled or aborted order drives its FuelAuthorization ISSUED -> VOIDED with voided_reason == FARM_FROZEN, releases its StorageTank reservation and recomputes AirlineAccount.accrual_exposure_cents; aborted orders additionally void their POSTED UpliftRecord rows and credit the net_liters back to StorageTank.book_volume_liters"
          - "increments SpillIncident.version and FuelFarm.version by 1 each"
        note: "Branch sibling of REPORTED -> CONTAINED with a disjoint side-effect set; this is the depth-3 environmental cascade."
      - from: REPORTED
        to: CONTAINED
        trigger: "POST /spill-incidents/{id}/contain"
        actor: EnvironmentalOfficer
        preconditions:
          - "SpillIncident.spilled_volume_liters < EnvironmentalPermit.max_reportable_spill_liters of the farm's ACTIVE permit"
          - "contained_volume_liters is supplied and <= spilled_volume_liters"
        side_effects:
          - "applies calculations.asset_reliability_score to the attributed FuelingAsset when fueling_asset_id is set, which may drive that asset IN_SERVICE -> DOWN_MAINTENANCE"
          - "recomputes FuelFarm.open_spill_count and FuelFarm.posture"
          - "increments SpillIncident.version, FuelFarm.version and, when attributed, FuelingAsset.version by 1 each"
        note: "Non-reportable spills skip escalation entirely; the two branches have disjoint side effects."
      - from: ESCALATED
        to: CONTAINED
        trigger: "POST /spill-incidents/{id}/contain"
        actor: EnvironmentalOfficer
        preconditions:
          - "contained_volume_liters is supplied and <= spilled_volume_liters"
        side_effects:
          - "applies calculations.asset_reliability_score to the attributed FuelingAsset"
          - "recomputes FuelFarm.open_spill_count and FuelFarm.posture; the farm leaves FROZEN once no ESCALATED incident remains and the permit is ACTIVE and unexpired, landing on RESTRICTED while any REPORTED incident is still open"
          - "increments SpillIncident.version and FuelFarm.version by 1 each"
      - from: CONTAINED
        to: REMEDIATED
        trigger: "POST /spill-incidents/{id}/remediate"
        actor: EnvironmentalOfficer
        preconditions:
          - "SpillIncident.status == CONTAINED"
        side_effects:
          - "increments SpillIncident.version by 1"
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /spill-incidents/{id}/close"
        actor: EnvironmentalOfficer
        preconditions:
          - "SpillIncident.status == REMEDIATED"
          - "surface != STORM_DRAIN or regulator_reference is non-empty"
        side_effects:
          - "recomputes FuelFarm.posture"
          - "increments SpillIncident.version and FuelFarm.version by 1 each"

  - entity: ReconciliationRun
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: MEASURED
        trigger: "POST /reconciliation-runs/{id}/measure"
        actor: FarmOperator
        preconditions:
          - "tank_measurements contains exactly one entry for every StorageTank at the farm whose service_status IN {IN_SERVICE, ISOLATED}"
          - "clock_now >= ReconciliationRun.period_end_utc"
        side_effects:
          - "computes receipts_net_liters, uplifts_net_liters, throughput_liters, variance_liters, variance_pct_throughput_basis and variance_pct_opening_stock_basis via calculations.reconciliation_gain_loss"
          - "writes last_gauge_volume_liters and last_gauge_at_utc onto each measured StorageTank"
          - "increments ReconciliationRun.version and each measured StorageTank.version by 1"
      - from: MEASURED
        to: VARIANCE_HOLD
        trigger: "system, on the same request that computed the variance"
        actor: system
        preconditions:
          - "abs(variance_pct_throughput_basis) > 0.50"
        side_effects:
          - "blocks POST /reconciliation-runs/{id}/post until a ConsortiumAdmin supplies variance_override_reason"
          - "increments ReconciliationRun.version by 1"
        note: "Auto-transition; exactly 0.50 percent does NOT hold the run."
      - from: MEASURED
        to: POSTED
        trigger: "POST /reconciliation-runs/{id}/post"
        actor: ConsortiumAdmin
        preconditions:
          - "ReconciliationRun.status == MEASURED"
          - "no StorageTank at the farm has quality_status == QUARANTINED"
        side_effects:
          - "writes the signed per-tank adjustment into the ledger so each StorageTank.book_volume_liters equals its measured_volume_liters"
          - "sets posted_by_user_id to the X-User-ID header value"
          - "recomputes StorageTank.available_volume_liters and FuelFarm.posture"
          - "increments ReconciliationRun.version, each StorageTank.version and FuelFarm.version by 1"
      - from: VARIANCE_HOLD
        to: POSTED
        trigger: "POST /reconciliation-runs/{id}/post with variance_override_reason supplied"
        actor: ConsortiumAdmin
        preconditions:
          - "variance_override_reason is supplied and non-empty"
          - "no StorageTank at the farm has quality_status == QUARANTINED"
        side_effects:
          - "writes the signed per-tank adjustment into the ledger as in MEASURED -> POSTED"
          - "sets posted_by_user_id to the X-User-ID header value"
          - "increments ReconciliationRun.version, each StorageTank.version and FuelFarm.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.subtotal_cents > 0 (at least one uplift was swept)"
          - "no swept UpliftRecord has status == VOIDED"
        side_effects:
          - "flips every swept UpliftRecord from POSTED to BILLED and freezes its billed_line_cents"
          - "sets issued_by_user_id to the X-User-ID header value"
          - "recomputes AirlineAccount.invoiced_exposure_cents and accrual_exposure_cents; the uncollected-uplift term is replaced by the invoiced-invoice term, which additionally carries the admin fee and the rebate"
          - "increments Invoice.version, AirlineAccount.version and each swept UpliftRecord.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: AirlineRep
        preconditions:
          - "X-User-ID == Invoice.airline_account_id (the disputing rep owns the account)"
          - "Invoice.amount_paid_cents == 0"
          - "Invoice.dispute_round <= 1 (an invoice may be disputed at most twice)"
        side_effects:
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /invoices/{id}/resolve-dispute"
        actor: BillingClerk
        preconditions:
          - "X-User-ID != Invoice.issued_by_user_id (segregation of duties)"
        side_effects:
          - "increments dispute_round by 1 and sets dispute_resolved_by_user_id to the X-User-ID header value"
          - "increments Invoice.version by 1"
        note: "Cycle ISSUED -> DISPUTED -> ISSUED, bounded at two rounds."
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: BillingClerk
        preconditions:
          - "the cumulative amount_paid_cents after this payment >= Invoice.total_cents"
        side_effects:
          - "recomputes AirlineAccount.invoiced_exposure_cents and accrual_exposure_cents downward by total_cents"
          - "increments Invoice.version and AirlineAccount.version by 1 each"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.amount_paid_cents == 0"
        side_effects:
          - "flips every swept UpliftRecord from BILLED back to POSTED with invoice_id cleared to null so a reissue can sweep it again (voided_reason INVOICE_VOIDED is recorded only when the ticket is retired for good)"
          - "recomputes AirlineAccount.invoiced_exposure_cents and accrual_exposure_cents; accrual returns to exactly its pre-issue value (conservation invariant airline_exposure_conservation)"
          - "increments Invoice.version, AirlineAccount.version and each swept UpliftRecord.version by 1"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.amount_paid_cents == 0"
        side_effects:
          - "identical to the ISSUED -> VOIDED side-effect set"
          - "increments Invoice.version, AirlineAccount.version and each swept UpliftRecord.version by 1"

  - entity: FuelFarm
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, recomputed by calculations.farm_posture after any mutation of a child tank, asset, spill, permit or receipt release"
        actor: system
        preconditions:
          - "no FROZEN condition holds, and at least one RESTRICTED condition holds: a tank with quality_status == QUARANTINED, an open SpillIncident with status == REPORTED, active_permit_throughput_used_liters >= 0.90 * EnvironmentalPermit.max_daily_throughput_liters, or in_service_asset_count == 0"
        side_effects:
          - "blocks FuelingOrder AUTHORIZED -> ASSIGNED and ASSIGNED -> FUELING for orders drawing on QUARANTINED tanks"
          - "increments FuelFarm.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, recomputed by calculations.farm_posture"
        actor: system
        preconditions:
          - "no FROZEN and no RESTRICTED condition holds"
        side_effects:
          - "increments FuelFarm.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system, recomputed by calculations.farm_posture after a spill escalation, permit suspension or permit expiry"
        actor: system
        preconditions:
          - "a SpillIncident at the farm has status == ESCALATED, or the farm has no EnvironmentalPermit with status == ACTIVE covering clock_now"
        side_effects:
          - "cascade hops 2 and 3 described on SpillIncident REPORTED -> ESCALATED fire"
          - "increments FuelFarm.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system, recomputed by calculations.farm_posture"
        actor: system
        preconditions:
          - "same FROZEN conditions as RESTRICTED -> FROZEN"
        side_effects:
          - "cascade hops 2 and 3 described on SpillIncident REPORTED -> ESCALATED fire"
          - "increments FuelFarm.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system, recomputed by calculations.farm_posture after the last open spill is CONTAINED or the permit is reinstated"
        actor: system
        preconditions:
          - "no FROZEN condition holds and at least one RESTRICTED condition holds"
        side_effects:
          - "increments FuelFarm.version by 1"
        note: "Assets driven to DOWN_MAINTENANCE by the freeze are NOT auto-restored; a ConsortiumAdmin must return each one to IN_SERVICE."
      - from: FROZEN
        to: OPEN
        trigger: "system, recomputed by calculations.farm_posture"
        actor: system
        preconditions:
          - "no FROZEN and no RESTRICTED condition holds"
        side_effects:
          - "increments FuelFarm.version by 1"

  - entity: EnvironmentalPermit
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /environmental-permits/{id}/suspend"
        actor: EnvironmentalOfficer
        preconditions:
          - "EnvironmentalPermit.status == ACTIVE"
          - "suspension_reason is supplied and non-empty"
        side_effects:
          - "recomputes FuelFarm.posture to FROZEN because the farm no longer has an ACTIVE permit"
          - "the FROZEN cascade hops 2 and 3 fire"
          - "increments EnvironmentalPermit.version and FuelFarm.version by 1 each"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /environmental-permits/{id}/reinstate"
        actor: EnvironmentalOfficer
        preconditions:
          - "clock_now < EnvironmentalPermit.valid_until_utc"
        side_effects:
          - "recomputes FuelFarm.posture"
          - "increments EnvironmentalPermit.version and FuelFarm.version by 1 each"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, evaluated whenever the permit or its farm is read or a child mutation recomputes posture after POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clock_now >= EnvironmentalPermit.valid_until_utc"
        side_effects:
          - "recomputes FuelFarm.posture to FROZEN"
          - "increments EnvironmentalPermit.version and FuelFarm.version by 1 each"

concurrency_rules:
  - rule_id: uplift-post-stale-order
    parent_entity: FuelingOrder
    write_endpoint: "POST /fueling-orders/{id}/uplift-records"
    occ_field: "expected_fueling_order_version"
    description: |
      Posting an uplift ticket against a FuelingOrder whose version has advanced since the
      into-plane agent last read the order is rejected as stale. A second uplift ticket on the
      same order is legitimate product behaviour (a top-up after a first partial ticket, each
      with its own ticket_number), so the request cannot be rejected on state grounds alone;
      the stale-version check is what distinguishes a deliberate second ticket from one written
      against an out-of-date view of the order's posted volume and reservation.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: invoice-create-stale-account
    parent_entity: AirlineAccount
    write_endpoint: "POST /invoices"
    occ_field: "expected_airline_account_version"
    description: |
      Creating an Invoice for an AirlineAccount whose version has advanced since the billing
      clerk last read the account is rejected as stale. Creating a second draft invoice over an
      overlapping period is legitimate product behaviour because the later draft supersedes the
      earlier sweep, so no state precondition rejects it; the stale-version check captures the
      case where the account's exposure figures moved (a completed order, an issued or voided
      invoice) after the clerk computed the sweep.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: receipt_net_volume_at_15c
    trigger: "on POST /fuel-receipts (creation), recomputed never afterwards; the frozen result is what FuelReceipt UNDER_TEST -> RELEASED adds to the tank ledger"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - select the thermal expansion coefficient by certificate density band (tiered selection)
      if certificate_density_kg_per_m3 >= 800.0:      alpha = 0.000850
      elif certificate_density_kg_per_m3 >= 780.0:    alpha = 0.000900
      else:                                          alpha = 0.000950
      # Step 2 - volume correction factor, rounded to 5 decimals BEFORE it multiplies anything
      vcf = round(1 - alpha * (temperature_c - 15.0), 5)        # round_half_up
      # Step 3 - pick the governing and advisory gross bases from delivery_mode
      gauge_delta      = round(tank_closing_gauge_liters - tank_opening_gauge_liters, 2)
      meter_gross      = meter_ticket_gross_liters
      if delivery_mode == "TRUCK":
          governing_gross_liters = meter_gross;   advisory_gross_liters = gauge_delta
      else:  # PIPELINE
          governing_gross_liters = gauge_delta;   advisory_gross_liters = meter_gross
      # Step 4 - corrected volume, rounded to 2 decimals BEFORE the water deduction
      corrected = round(governing_gross_liters * vcf, 2)
      # Step 5 - water deduction is capped at 0.5 percent of the GOVERNING GROSS (not of corrected)
      water_cap = round(governing_gross_liters * 0.005, 2)
      water_deduction = min(measured_water_liters, water_cap)
      # Step 6 - final net, rounded again to 2 decimals
      net_volume_liters = round(corrected - water_deduction, 2)
      # Step 7 - the advisory figure repeats steps 4-6 on advisory_gross_liters
      advisory_net_volume_liters = round(round(advisory_gross_liters * vcf, 2)
                                        - min(measured_water_liters, round(advisory_gross_liters * 0.005, 2)), 2)
    input_set: "A single FuelReceipt row's own input fields; no other entity participates. delivery_mode alone decides which gross basis governs the ledger."
    constants:
      ALPHA_HEAVY_BAND_MIN_DENSITY: 800.0
      ALPHA_HEAVY: 0.000850
      ALPHA_MID_BAND_MIN_DENSITY: 780.0
      ALPHA_MID: 0.000900
      ALPHA_LIGHT: 0.000950
      REFERENCE_TEMPERATURE_C: 15.0
      WATER_DEDUCTION_CAP_FRACTION: 0.005
    precision: "vcf 5 decimal places round_half_up; all volumes 2 decimal places round_half_up; rounding applied at steps 2, 4, 5 and 6 in that order"
    variants:
      - name: meter_ticket_basis
        when: "delivery_mode == TRUCK"
        difference: "governing_gross_liters is the supplier meter ticket reading; the tank gauge delta becomes advisory. Because road tankers are metered warm and gauged after settling, the two bases differ and the ledger moves by the meter figure."
      - name: gauge_delta_basis
        when: "delivery_mode == PIPELINE"
        difference: "governing_gross_liters is tank_closing_gauge_liters - tank_opening_gauge_liters; the pipeline meter ticket becomes advisory. Identical input rows with different delivery_mode therefore write different net_volume_liters into the same tank ledger."

  - name: sample_verdict
    trigger: "on POST /quality-samples/{id}/test-results"
    algorithm: threshold
    formula: |
      failed = []
      if water_reaction_rating is not null and water_reaction_rating > 1:            failed.append("water_reaction_rating")
      if particulate_mg_per_l is not null and particulate_mg_per_l > 1.0:            failed.append("particulate_mg_per_l")
      if conductivity_ps_per_m is not null and not (50.0 <= conductivity_ps_per_m <= 600.0):
                                                                                    failed.append("conductivity_ps_per_m")
      comparison_density = FuelReceipt.certificate_density_kg_per_m3 when sample_purpose == RECEIPT_QC
                           else StorageTank.density_kg_per_m3
      if observed_density_kg_per_m3 is not null and abs(observed_density_kg_per_m3 - comparison_density) > 3.0:
                                                                                    failed.append("observed_density_kg_per_m3")
      if flash_point_c is not null and flash_point_c < 38.0:                         failed.append("flash_point_c")
      failed_metrics = failed ordered as [water_reaction_rating, particulate_mg_per_l,
                       conductivity_ps_per_m, observed_density_kg_per_m3, flash_point_c]
      verdict = "PASS" if len(failed) == 0 else "FAIL"
    input_set: "The QualitySample's own posted metrics; null metrics are skipped and cannot fail. At least one metric must be non-null (enforced by validations priority 22)."
    constants:
      WATER_REACTION_MAX_PASS: 1
      PARTICULATE_MAX_MG_PER_L: 1.0
      CONDUCTIVITY_MIN_PS_PER_M: 50.0
      CONDUCTIVITY_MAX_PS_PER_M: 600.0
      DENSITY_TOLERANCE_KG_PER_M3: 3.0
      FLASH_POINT_MIN_C: 38.0
    precision: "comparisons on the posted values as given; conductivity bounds are inclusive on both ends, flash point is inclusive at 38.0, particulate is inclusive at 1.0"

  - name: tank_book_inventory
    trigger: "on FuelReceipt UNDER_TEST -> RELEASED, on UpliftRecord creation, on UpliftRecord void, on FuelingOrder FUELING -> ABORTED, and on ReconciliationRun -> POSTED"
    algorithm: aggregation
    formula: |
      book_volume_liters = round(
            StorageTank.opening_volume_liters
          + sum(FuelReceipt.net_volume_liters for receipts where storage_tank_id == tank.id
                and status == "RELEASED")
          - sum(UpliftRecord.net_liters for tickets where storage_tank_id == tank.id
                and status IN {"POSTED", "BILLED"})
          + sum(ReconciliationRun.adjustment_liters for the tank across runs where status == "POSTED")
        , 2)
      reserved_volume_liters = round(sum(FuelingOrder.requested_uplift_liters
            for orders where storage_tank_id == tank.id
            and status IN {"AUTHORIZED", "ASSIGNED", "FUELING"}), 2)
      available_volume_liters = max(0.0, round(book_volume_liters - reserved_volume_liters
                                              - FuelFarm.unpumpable_bottom_liters, 2))
    input_set: "RELEASED receipts only (RECORDED / SAMPLED / UNDER_TEST / QUARANTINED / REJECTED receipts contribute nothing); POSTED and BILLED uplifts only (VOIDED uplifts contribute nothing); POSTED reconciliation adjustments only. Full recompute from the source rows on every trigger, never an incremental delta."
    constants: {}
    precision: "2 decimal places, round_half_up; available_volume_liters floored at 0.0"

  - name: uplift_net_liters
    trigger: "on POST /fueling-orders/{id}/uplift-records"
    algorithm: tiered_pricing
    formula: |
      gross_liters = round(meter_end_liters - meter_start_liters, 2)
      # the alpha band comes from the SOURCE TANK's certificated density, not from the receipt
      if StorageTank.density_kg_per_m3 >= 800.0:    alpha = 0.000850
      elif StorageTank.density_kg_per_m3 >= 780.0:  alpha = 0.000900
      else:                                        alpha = 0.000950
      vcf = round(1 - alpha * (temperature_c - 15.0), 5)
      net_liters = round(gross_liters * vcf, 2)
    input_set: "One UpliftRecord's own meter readings and temperature plus the source StorageTank.density_kg_per_m3 as of the moment the ticket is posted."
    constants:
      REFERENCE_TEMPERATURE_C: 15.0
    precision: "vcf 5 decimals round_half_up; liters 2 decimals round_half_up; no water deduction applies at the wing"

  - name: uplift_invoice_line_amount
    trigger: "on POST /fueling-orders/{id}/uplift-records (provisional) and refrozen on Invoice DRAFT -> ISSUED (final)"
    algorithm: tiered_pricing
    formula: |
      # month_to_date_liters = sum of net_liters over UpliftRecord rows of THIS airline account
      #   with status IN {POSTED, BILLED} whose created_at falls in
      #   [first instant of the calendar UTC month of this ticket's created_at, this ticket's created_at],
      #   INCLUDING this ticket itself. Ordering is created_at ASC; ties broken by created_at then by
      #   the order in which the tickets were posted (no id is consulted).
      cumulative = month_to_date_liters                      # includes this ticket
      if cumulative >= 500000.0:   diff = 1.60
      elif cumulative >= 100000.0: diff = 2.40
      else:                        diff = 3.20               # cents per liter, whole-line rate
      fuel_component_cents = round(net_liters * (AirlineAccount.base_price_cents_per_liter + diff), 0)
      into_plane_fee_cents = max(2500, round(net_liters * 0.45, 0))
      flowage_fee_cents    = round(net_liters * 0.12, 0)
      if AirlineAccount.tax_exempt:
          excise_cents = 0
          sales_tax_cents = 0
      else:
          excise_cents = round(net_liters * 1.14, 0)
          sales_tax_cents = round((fuel_component_cents + into_plane_fee_cents) * 0.0725, 0)
      # ROUNDING ORDER IS PINNED: every component above is rounded to whole cents FIRST,
      # then the five rounded components are summed. Summing unrounded components and rounding
      # the sum once is explicitly NOT the rule and yields a different line total.
      billed_line_cents = fuel_component_cents + into_plane_fee_cents + flowage_fee_cents
                          + excise_cents + sales_tax_cents
      # INTO_PLANE_ONLY accounts have base_price_cents_per_liter == 0 and diff is not applied:
      if AirlineAccount.contract_type == "INTO_PLANE_ONLY":
          fuel_component_cents = 0
          billed_line_cents = into_plane_fee_cents + flowage_fee_cents
    input_set: "The single UpliftRecord being priced, its AirlineAccount contract fields, and the month-to-date net liters of POSTED and BILLED tickets of the same account including this one. VOIDED tickets are excluded from the cumulative and therefore can move a later ticket into a cheaper tier."
    constants:
      TIER_2_MIN_LITERS: 100000.0
      TIER_3_MIN_LITERS: 500000.0
      DIFF_TIER_1_CENTS_PER_LITER: 3.20
      DIFF_TIER_2_CENTS_PER_LITER: 2.40
      DIFF_TIER_3_CENTS_PER_LITER: 1.60
      INTO_PLANE_RATE_CENTS_PER_LITER: 0.45
      INTO_PLANE_MINIMUM_CENTS: 2500
      FLOWAGE_RATE_CENTS_PER_LITER: 0.12
      FEDERAL_EXCISE_CENTS_PER_LITER: 1.14
      STATE_SALES_TAX_RATE: 0.0725
    precision: "each component rounded to 0 decimals (whole cents) round_half_up, then summed; the tier rate applies to the whole line, not marginally"

  - name: invoice_total_with_fees
    trigger: "on POST /invoices (draft sweep) and recomputed on Invoice DRAFT -> ISSUED"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The rebate tier is keyed on LITERS while the admin fee is
      # keyed on the POST-REBATE money total, so the two look mutually dependent; they are not,
      # because the steps run strictly 1 -> 2 -> 3 -> 4.
      # Step 1 - sweep and sum the already-rounded line totals
      swept = UpliftRecord rows where airline_account_id of the parent order's flight == invoice.airline_account_id
              and status == "POSTED" and invoice_id is null
              and created_at in [period_start_utc, period_end_utc)
              ordered by created_at ASC
      swept_net_liters   = round(sum(net_liters over swept), 2)
      fuel_component_cents = sum(fuel_component_cents over swept)
      subtotal_cents       = sum(billed_line_cents over swept)
      # Step 2 - volume rebate, keyed on LITERS, applied to the FUEL COMPONENT ONLY
      if swept_net_liters >= 250000.0:   rebate_rate = 0.015
      elif swept_net_liters >= 100000.0: rebate_rate = 0.0075
      else:                              rebate_rate = 0.0
      volume_rebate_cents = round(fuel_component_cents * rebate_rate, 0)
      # Step 3 - consortium admin fee on the POST-REBATE subtotal, capped
      admin_fee_cents = min(50000, round((subtotal_cents - volume_rebate_cents) * 0.004, 0))
      # Step 4 - payable total
      total_cents = subtotal_cents - volume_rebate_cents + admin_fee_cents
    input_set: "POSTED UpliftRecord rows of the account with invoice_id == null whose created_at falls in the half-open period window [period_start_utc, period_end_utc), swept in created_at ASC order. BILLED and VOIDED tickets are never swept, so a void-and-reissue re-sweeps exactly the same tickets."
    constants:
      REBATE_TIER_2_MIN_LITERS: 100000.0
      REBATE_TIER_3_MIN_LITERS: 250000.0
      REBATE_RATE_TIER_2: 0.0075
      REBATE_RATE_TIER_3: 0.015
      ADMIN_FEE_RATE: 0.004
      ADMIN_FEE_CAP_CENTS: 50000
    precision: "cents are integers throughout; rebate and admin fee each rounded to 0 decimals round_half_up; steps evaluated in the order 1, 2, 3, 4"

  - name: airline_credit_exposure
    trigger: "on FuelingOrder REQUESTED -> AUTHORIZED, on FuelingOrder FUELING -> COMPLETED, on FuelingOrder cancel/abort, on Invoice DRAFT -> ISSUED, on Invoice void, and on payment"
    algorithm: aggregation
    formula: |
      # invoiced_basis
      invoiced_exposure_cents = sum(Invoice.total_cents - Invoice.amount_paid_cents
            for invoices of this account where status IN {"ISSUED", "DISPUTED"})
      # accrual_basis = invoiced_basis + uncollected uplifts + open reservations
      uncollected_cents = sum(UpliftRecord.billed_line_cents
            for tickets of this account where status == "POSTED")
      reservation_cents = sum(FuelingOrder.reserved_amount_cents
            for orders of this account where status IN {"AUTHORIZED", "ASSIGNED", "FUELING"})
      accrual_exposure_cents = invoiced_exposure_cents + uncollected_cents + reservation_cents
      # the reservation term for a single order, computed once on authorization:
      #   tier diff selected from the account's month-to-date liters PLUS requested_uplift_liters
      reserved_amount_cents = round(requested_uplift_liters
            * (AirlineAccount.base_price_cents_per_liter + diff_from_uplift_invoice_line_amount_tiers), 0)
            + max(2500, round(requested_uplift_liters * 0.45, 0))
    input_set: "Invoices with status ISSUED or DISPUTED (DRAFT, PAID and VOIDED excluded); UpliftRecord rows with status POSTED only (BILLED tickets are already inside an issued invoice, VOIDED tickets are excluded); FuelingOrder rows with status AUTHORIZED, ASSIGNED or FUELING only."
    constants:
      INTO_PLANE_RATE_CENTS_PER_LITER: 0.45
      INTO_PLANE_MINIMUM_CENTS: 2500
    precision: "integer cents; reservation rounded to 0 decimals round_half_up"
    variants:
      - name: accrual_basis
        when: "the credit check on FuelingOrder REQUESTED -> AUTHORIZED (validations priority 30)"
        difference: "Counts invoiced debt plus not-yet-invoiced POSTED uplifts plus open order reservations, so an airline with no issued invoice at all can still be refused authorization."
      - name: invoiced_basis
        when: "reported on GET /airline-accounts/{id} and used by the CREDIT_HOLD decision on Invoice issuance (validations priority 31)"
        difference: "Counts only ISSUED and DISPUTED invoice balances, so for the same account at the same instant it returns a strictly smaller number than accrual_basis whenever any POSTED uplift or open reservation exists."

  - name: reconciliation_gain_loss
    trigger: "on POST /reconciliation-runs/{id}/measure"
    algorithm: chronological
    formula: |
      # Per tank, then aggregated for the run, tanks processed in created_at ASC order.
      per_tank_measured = round(measured_volume_liters * round(1 - alpha_from(StorageTank.density_kg_per_m3)
                                * (temperature_c - 15.0), 5), 2)
      per_tank_book     = StorageTank.book_volume_liters                 # ledger value at measure time
      per_tank_variance = round(per_tank_measured - per_tank_book, 2)    # positive = gain, negative = loss
      variance_liters   = round(sum(per_tank_variance over the run's tank_measurements), 2)
      receipts_net_liters = sum(FuelReceipt.net_volume_liters for receipts at the farm with
            status == "RELEASED" and released_at_utc in [period_start_utc, period_end_utc))
      uplifts_net_liters  = sum(UpliftRecord.net_liters for tickets on the farm's tanks with
            status IN {"POSTED", "BILLED"} and created_at in [period_start_utc, period_end_utc))
      throughput_liters   = round(receipts_net_liters + uplifts_net_liters, 2)
      opening_stock_liters = round(sum(per_tank_book over measured tanks) - receipts_net_liters
                                   + uplifts_net_liters, 2)
      variance_pct_throughput_basis    = round(abs(variance_liters) / max(throughput_liters, 1.0) * 100, 4)
      variance_pct_opening_stock_basis = round(abs(variance_liters) / max(opening_stock_liters, 1.0) * 100, 4)
      # GOVERNING basis is throughput. VARIANCE_HOLD fires when
      #   variance_pct_throughput_basis > 0.50   (strictly greater; exactly 0.5000 posts clean)
      adjustment_liters (per tank) = per_tank_variance
    input_set: "One measurement per StorageTank at the farm whose service_status is IN_SERVICE or ISOLATED (OUT_OF_SERVICE tanks are excluded and contribute no variance); RELEASED receipts and POSTED/BILLED uplifts inside the half-open period window."
    constants:
      VARIANCE_TOLERANCE_PCT: 0.50
    precision: "volumes 2 decimals round_half_up; percentages 4 decimals round_half_up; tanks processed created_at ASC"
    variants:
      - name: throughput_basis
        when: "the VARIANCE_HOLD decision and the posted run record"
        difference: "Denominator is receipts_net_liters + uplifts_net_liters for the period, so a quiet period with little movement makes even a small absolute variance breach the 0.50 percent tolerance."
      - name: opening_stock_basis
        when: "reported on the run for the auditor's report field variance_pct_opening_stock_basis"
        difference: "Denominator is the derived opening book stock, which for a busy farm is much larger than throughput; the same variance_liters therefore yields a percentage that can sit under tolerance while the governing basis breaches it."

  - name: permit_daily_throughput_used
    trigger: "on FuelReceipt UNDER_TEST -> RELEASED, on UpliftRecord creation, on UpliftRecord void, and whenever farm_posture is recomputed"
    algorithm: aggregation
    formula: |
      day_start = the instant clock_now truncated to 00:00:00.000 UTC
      day_end   = day_start + 24 hours
      active_permit_throughput_used_liters = round(
            sum(FuelReceipt.net_volume_liters for receipts at this farm where status == "RELEASED"
                and released_at_utc >= day_start and released_at_utc < day_end)
          + sum(UpliftRecord.net_liters for tickets on this farm's tanks where status IN {"POSTED","BILLED"}
                and created_at >= day_start and created_at < day_end)
        , 2)
    input_set: "Half-open UTC-day window [day_start, day_end) keyed on the logical clock at recompute time. RELEASED receipts count at released_at_utc, not at created_at; REJECTED and QUARANTINED receipts never count, which is what makes the reject path leave the counter untouched."
    constants:
      DAY_LENGTH_HOURS: 24
    precision: "2 decimal places round_half_up; window start inclusive, window end exclusive"

  - name: farm_posture
    trigger: "on every mutation of a child StorageTank, FuelingAsset, SpillIncident, EnvironmentalPermit or FuelReceipt release, and on POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      permit = the farm's EnvironmentalPermit with the latest valid_from_utc
      permit_ok = permit is not null and permit.status == "ACTIVE"
                  and permit.valid_from_utc <= clock_now < permit.valid_until_utc
      frozen = (not permit_ok) or exists SpillIncident at the farm with status == "ESCALATED"
      restricted = exists StorageTank at the farm with quality_status == "QUARANTINED"
                or exists SpillIncident at the farm with status == "REPORTED"
                or active_permit_throughput_used_liters >= 0.90 * permit.max_daily_throughput_liters
                or in_service_asset_count == 0
      posture = "FROZEN" if frozen else ("RESTRICTED" if restricted else "OPEN")
      open_spill_count = count of SpillIncident at the farm with status IN {"REPORTED","ESCALATED"}
      in_service_asset_count = count of FuelingAsset at the farm with status == "IN_SERVICE"
    input_set: "All child tanks, assets, spills and the single latest-valid_from_utc permit of the farm. When several permits exist the one with the latest valid_from_utc governs; ties on valid_from_utc are broken by created_at ASC (the earliest-created wins)."
    constants:
      RESTRICTED_PERMIT_UTILISATION_FRACTION: 0.90
    precision: "the utilisation comparison is >= (exactly 90.00 percent is RESTRICTED); the spill comparison is >= (exactly the reportable volume freezes the farm)"

  - name: filter_element_life_pct
    trigger: "on POST /fueling-orders/{id}/uplift-records, on FuelingOrder FUELING -> COMPLETED, on POST /fueling-assets/{id}/filter-changes, and on POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      throughput_pct = round(liters_since_filter_change / 4000000.0 * 100, 4)
      days_since     = (clock_now - last_filter_change_at_utc) in whole days, floor
      days_pct       = round(days_since / 365.0 * 100, 4)
      dp_pct         = round(differential_pressure_kpa / 103.0 * 100, 4)
      element_life_pct = max(throughput_pct, days_pct, dp_pct)
      # FILTER_DUE at element_life_pct >= 100.0; an immediate DOWN_FOR_FILTER when
      # differential_pressure_kpa >= 103.0 regardless of the other two legs.
    input_set: "The asset's own counters. liters_since_filter_change accumulates UpliftRecord.net_liters of POSTED and BILLED tickets metered by the asset since last_filter_change_at_utc; VOIDED tickets are subtracted back out."
    constants:
      ELEMENT_LITERS_LIFE: 4000000.0
      ELEMENT_DAYS_LIFE: 365
      ELEMENT_MAX_DP_KPA: 103.0
      FILTER_DUE_PCT: 100.0
    precision: "4 decimal places round_half_up on each leg; days floored to whole days; the FILTER_DUE comparison is >= 100.0"

  - name: asset_reliability_score
    trigger: "on SpillIncident REPORTED -> CONTAINED and ESCALATED -> CONTAINED when fueling_asset_id is set"
    algorithm: weighted_scoring
    formula: |
      severity_points = min(40, ceil(SpillIncident.spilled_volume_liters / 10.0) * 5)
      surface_multiplier = 2 if SpillIncident.surface IN {"STORM_DRAIN", "UNSEALED_GROUND"} else 1
      penalty = min(40, severity_points * surface_multiplier)
      reliability_score = max(0, previous_reliability_score - penalty)
      # asset is driven IN_SERVICE -> DOWN_MAINTENANCE when reliability_score < 60
    input_set: "Every SpillIncident with fueling_asset_id == asset.id that has reached CONTAINED, applied in reported_at_utc ASC order; ties on reported_at_utc broken by created_at ASC. Incidents still in REPORTED or ESCALATED have not yet been applied."
    constants:
      SEVERITY_LITERS_PER_STEP: 10.0
      SEVERITY_POINTS_PER_STEP: 5
      PENALTY_CAP: 40
      SENSITIVE_SURFACE_MULTIPLIER: 2
      DOWN_MAINTENANCE_THRESHOLD: 60
      INITIAL_SCORE: 100
    precision: "integer arithmetic; severity_points capped at 40 BEFORE the surface multiplier and the product capped at 40 again AFTER it; score floored at 0"

  - name: authorization_code
    trigger: "on POST /fuel-authorizations"
    algorithm: projection
    formula: |
      prefix = AirlineAccount.airline_iata_code                       # 2 chars
      date_part = Flight.scheduled_departure_utc formatted "YYMMDD"   # 6 chars, UTC
      day_sequence = 1 + count(FuelAuthorization rows for the same airline_account_id whose
                     Flight.scheduled_departure_utc falls on the same UTC calendar day,
                     counted in created_at ASC order, regardless of status)
      seq_part = day_sequence zero-padded to 4 digits                 # 4 chars
      body = prefix + date_part + seq_part                            # 12 chars
      check = (sum of the ASCII code points of body's 12 characters) mod 97, zero-padded to 2 digits
      authorization_code = body + check                               # 14 chars
      expires_at_utc = Flight.scheduled_departure_utc + 2 hours
    input_set: "All FuelAuthorization rows of the same airline account whose flight departs on the same UTC calendar day, including VOIDED and EXPIRED ones, so a sequence number is never reused."
    constants:
      CHECK_MODULUS: 97
      AUTHORIZATION_TTL_HOURS: 2
    precision: "exact string arithmetic; no random component participates, so the code is fully reproducible from the account, the flight and the issuance order"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when X-User-Role == AirlineRep, X-User-ID equals the AirlineAccount.id that owns the Flight, FuelAuthorization, FuelingOrder or Invoice being acted on"
    error_id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /flights, POST /fuel-authorizations, POST /fueling-orders, POST /fueling-orders/{id}/cancel, POST /invoices/{id}/dispute"
  - priority: 4
    category: existence
    check: "every path-templated resource id resolves to an existing row, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 6
    category: existence
    check: "the FK targets supplied together belong to the same aggregate: the FuelAuthorization's flight_id equals the order's flight_id, the HydrantPit's fuel_farm_id equals the StorageTank's fuel_farm_id, and the FuelingAsset's fuel_farm_id equals the StorageTank's fuel_farm_id"
    error_id: ERR_CROSS_FARM_REFERENCE
    http_status: 422
    applies_to: "POST /fueling-orders, POST /fueling-orders/{id}/assign"
  - priority: 7
    category: business_constraint
    check: "all required input fields for the endpoint are present and every value matches its declared type"
    error_id: ERR_INVALID_PAYLOAD
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: business_constraint
    check: "numeric and enum field values satisfy the constraints declared on the entity field (ranges, enum membership, closing gauge greater than opening gauge, meter_end greater than meter_start, window_end after window_start, safe_fill <= capacity)"
    error_id: ERR_FIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 9
    category: business_constraint
    check: "scoped uniqueness holds: FuelFarm.iata_code, EnvironmentalPermit.permit_number, FuelReceipt.meter_ticket_number, UpliftRecord.ticket_number, AirlineAccount.airline_iata_code globally; StorageTank.tank_code, FuelingAsset.asset_code and HydrantPit.pit_code per fuel_farm_id"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /fuel-farms, POST /fuel-farms/{id}/environmental-permits, POST /fuel-farms/{id}/storage-tanks, POST /fuel-farms/{id}/fueling-assets, POST /fuel-farms/{id}/hydrant-pits, POST /fuel-receipts, POST /airline-accounts, POST /fueling-orders/{id}/uplift-records"
  - priority: 10
    category: state
    check: "expected_fueling_order_version equals the current FuelingOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /fueling-orders/{id}/uplift-records"
  - priority: 11
    category: state
    check: "expected_airline_account_version equals the current AirlineAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /invoices"
  - priority: 12
    category: state
    check: "the target row is not already in a terminal state for its machine (FuelReceipt RELEASED/REJECTED, FuelingOrder COMPLETED/CANCELLED/ABORTED, FuelAuthorization REDEEMED/VOIDED/EXPIRED, SpillIncident CLOSED, Invoice PAID/VOIDED, ReconciliationRun POSTED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 13
    category: state
    check: "FuelReceipt.status is a declared from-state for the requested receipt transition"
    error_id: ERR_INVALID_RECEIPT_STATE
    http_status: 409
    applies_to: "POST /fuel-receipts/{id}/samples, POST /fuel-receipts/{id}/verdict, POST /fuel-receipts/{id}/reject"
  - priority: 14
    category: state
    check: "FuelingOrder.status is a declared from-state for the requested order transition"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/authorize, /assign, /unassign, /start, /uplift-records, /complete, /abort, /cancel"
  - priority: 15
    category: state
    check: "StorageTank.service_status and quality_status are declared from-states for the requested tank transition"
    error_id: ERR_INVALID_TANK_STATE
    http_status: 409
    applies_to: "POST /storage-tanks/{id}/service-status, /quality-release, /quarantine, /samples"
  - priority: 16
    category: state
    check: "FuelingAsset.status is a declared from-state for the requested asset transition"
    error_id: ERR_INVALID_ASSET_STATE
    http_status: 409
    applies_to: "POST /fueling-assets/{id}/status, POST /fueling-assets/{id}/filter-changes"
  - priority: 17
    category: state
    check: "SpillIncident.status is a declared from-state for the requested spill transition"
    error_id: ERR_INVALID_SPILL_STATE
    http_status: 409
    applies_to: "POST /spill-incidents/{id}/escalate, /contain, /remediate, /close"
  - priority: 18
    category: state
    check: "Invoice.status is a declared from-state for the requested invoice transition"
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: "POST /invoices/{id}/issue, /dispute, /resolve-dispute, /void, /payments"
  - priority: 19
    category: state
    check: "ReconciliationRun.status is a declared from-state for the requested run transition"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    applies_to: "POST /reconciliation-runs/{id}/measure, POST /reconciliation-runs/{id}/post"
  - priority: 20
    category: business_safety
    check: "the governing FuelFarm.posture is not FROZEN"
    error_id: ERR_FARM_FROZEN
    http_status: 409
    applies_to: "POST /fuel-receipts, POST /fuel-receipts/{id}/samples, POST /fuel-receipts/{id}/verdict, POST /storage-tanks/{id}/samples, POST /fueling-orders, POST /fueling-orders/{id}/authorize, /assign, /start, /uplift-records, POST /fueling-assets/{id}/filter-changes, POST /fueling-assets/{id}/status"
  - priority: 21
    category: business_safety
    check: "the farm has an EnvironmentalPermit with status == ACTIVE whose valid_from_utc <= clock_now < valid_until_utc"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fuel-receipts, POST /fuel-receipts/{id}/verdict, POST /fueling-orders/{id}/authorize, POST /fueling-orders/{id}/uplift-records"
  - priority: 22
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded for the preceding step of the same workflow: FuelReceipt.sampled_by_user_id on the release/quarantine verdict, QualitySample.drawn_by_user_id on a tank quality-release, Invoice.issued_by_user_id on dispute resolution"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fuel-receipts/{id}/verdict, POST /storage-tanks/{id}/quality-release, POST /invoices/{id}/resolve-dispute"
  - priority: 23
    category: business_safety
    check: "the source StorageTank.quality_status is RELEASED (not ON_TEST and not QUARANTINED)"
    error_id: ERR_TANK_QUARANTINED
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/authorize, POST /fueling-orders/{id}/start, POST /fueling-orders/{id}/uplift-records"
  - priority: 24
    category: business_safety
    check: "the latest TESTED QualitySample for the receipt has verdict == PASS when decision == RELEASE, and a TESTED sample exists at all for either decision"
    error_id: ERR_SAMPLE_VERDICT_FAIL
    http_status: 409
    applies_to: "POST /fuel-receipts/{id}/verdict"
  - priority: 25
    category: business_safety
    check: "StorageTank.water_bottom_mm < 25.0 before a tank quality-release or a return to IN_SERVICE"
    error_id: ERR_WATER_BOTTOM_EXCEEDED
    http_status: 409
    applies_to: "POST /storage-tanks/{id}/quality-release, POST /storage-tanks/{id}/service-status"
  - priority: 26
    category: business_safety
    check: "FuelReceipt.retest_round <= 1 when a re-sample is requested from QUARANTINED"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /fuel-receipts/{id}/samples"
  - priority: 27
    category: business_safety
    check: "the assigned FuelingAsset.status == IN_SERVICE and its element_life_pct < 100.0"
    error_id: ERR_ASSET_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/assign, POST /fueling-orders/{id}/start, POST /fueling-orders/{id}/uplift-records"
  - priority: 28
    category: business_safety
    check: "SpillIncident.spilled_volume_liters >= the farm's ACTIVE permit max_reportable_spill_liters when escalating, and regulator_reference is supplied and non-empty"
    error_id: ERR_SPILL_NOT_REPORTABLE
    http_status: 422
    applies_to: "POST /spill-incidents/{id}/escalate"
  - priority: 29
    category: business_safety
    check: "a QualitySample posts at least one non-null metric among water_reaction_rating, particulate_mg_per_l, conductivity_ps_per_m, observed_density_kg_per_m3 and flash_point_c"
    error_id: ERR_EMPTY_TEST_RESULT_SET
    http_status: 422
    applies_to: "POST /quality-samples/{id}/test-results"
  - priority: 30
    category: business_referential
    check: "FuelingOrder.quoted_authorization_code equals FuelAuthorization.authorization_code character for character"
    error_id: ERR_AUTH_CODE_MISMATCH
    http_status: 422
    applies_to: "POST /fueling-orders, POST /fueling-orders/{id}/authorize"
  - priority: 31
    category: business_referential
    check: "the FuelAuthorization has status == ISSUED and clock_now < expires_at_utc"
    error_id: ERR_AUTHORIZATION_NOT_REDEEMABLE
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/authorize"
  - priority: 32
    category: business_constraint
    check: "delivery_mode HYDRANT requires the farm's hydrant_system_available == true, an asset with asset_type == HYDRANT_CART, a hydrant_pit_id whose HydrantPit.status == AVAILABLE and whose stand_code equals Flight.stand_code; delivery_mode TRUCK requires asset_type == TRUCK and hydrant_pit_id == null"
    error_id: ERR_DELIVERY_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /fueling-orders, POST /fueling-orders/{id}/assign"
  - priority: 33
    category: business_temporal
    check: "no other FuelingOrder with status IN {ASSIGNED, FUELING} occupies the requested HydrantPit over an intersecting half-open window [window_start_utc, window_end_utc); back-to-back windows that merely touch at an endpoint do NOT intersect"
    error_id: ERR_PIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/assign"
  - priority: 34
    category: business_temporal
    check: "no other FuelingOrder with status IN {ASSIGNED, FUELING} occupies the requested FuelingAsset over an intersecting closed window [window_start_utc, window_end_utc + turnaround_buffer_minutes]; touching endpoints DO intersect and the buffer is part of the occupied interval"
    error_id: ERR_ASSET_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/assign"
  - priority: 35
    category: business_temporal
    check: "the requested tank isolation window does not intersect the isolation window of any other tank at the same farm whose service_status == ISOLATED (aggregate capacity of one isolated tank per farm at any instant, half-open windows)"
    error_id: ERR_TANK_ISOLATION_CONFLICT
    http_status: 409
    applies_to: "POST /storage-tanks/{id}/service-status"
  - priority: 36
    category: business_temporal
    check: "clock_now >= FuelingOrder.window_start_utc and clock_now < FuelingOrder.window_end_utc when starting fuelling or posting an uplift"
    error_id: ERR_OUTSIDE_FUELING_WINDOW
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/start, POST /fueling-orders/{id}/uplift-records"
  - priority: 37
    category: business_temporal
    check: "clock_now >= ReconciliationRun.period_end_utc before measurements may be posted"
    error_id: ERR_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /reconciliation-runs/{id}/measure"
  - priority: 38
    category: business_constraint
    check: "tank_measurements contains exactly one entry for each StorageTank at the farm whose service_status IN {IN_SERVICE, ISOLATED} and no entry for any other tank"
    error_id: ERR_MEASUREMENT_SET_INCOMPLETE
    http_status: 422
    applies_to: "POST /reconciliation-runs/{id}/measure"
  - priority: 39
    category: business_constraint
    check: "variance_override_reason is supplied and non-empty when the run status is VARIANCE_HOLD"
    error_id: ERR_VARIANCE_OVERRIDE_REQUIRED
    http_status: 409
    applies_to: "POST /reconciliation-runs/{id}/post"
  - priority: 40
    category: business_constraint
    check: "at least one UpliftRecord with status == POSTED exists for the order before it may be completed"
    error_id: ERR_NO_UPLIFT_RECORDED
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/complete"
  - priority: 41
    category: business_constraint
    check: "the sweep found at least one POSTED UpliftRecord with invoice_id == null in the half-open period window"
    error_id: ERR_NOTHING_TO_SWEEP
    http_status: 422
    applies_to: "POST /invoices"
  - priority: 42
    category: business_constraint
    check: "Invoice.dispute_round <= 1 when a dispute is raised"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /invoices/{id}/dispute"
  - priority: 43
    category: business_fiscal
    check: "StorageTank.book_volume_liters + FuelReceipt.net_volume_liters <= StorageTank.safe_fill_liters on release"
    error_id: ERR_SAFE_FILL_EXCEEDED
    http_status: 409
    applies_to: "POST /fuel-receipts/{id}/verdict"
  - priority: 44
    category: business_fiscal
    check: "FuelFarm.active_permit_throughput_used_liters + the volume being moved <= EnvironmentalPermit.max_daily_throughput_liters"
    error_id: ERR_PERMIT_THROUGHPUT_EXCEEDED
    http_status: 409
    applies_to: "POST /fuel-receipts/{id}/verdict, POST /fueling-orders/{id}/uplift-records"
  - priority: 45
    category: business_fiscal
    check: "StorageTank.available_volume_liters >= FuelingOrder.requested_uplift_liters at authorization, and the tank's book_volume_liters minus FuelFarm.unpumpable_bottom_liters >= the uplift's net_liters when a ticket is posted"
    error_id: ERR_INSUFFICIENT_TANK_VOLUME
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/authorize, POST /fueling-orders/{id}/uplift-records"
  - priority: 46
    category: business_fiscal
    check: "the accrual-basis exposure including this order's reserved_amount_cents <= AirlineAccount.credit_limit_cents, and AirlineAccount.status == ACTIVE"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /fueling-orders/{id}/authorize"
  - priority: 47
    category: business_fiscal
    check: "FuelingOrder.posted_net_liters after this ticket <= FuelAuthorization.max_authorized_liters * 1.05 when posting, and <= max_authorized_liters when completing"
    error_id: ERR_UPLIFT_EXCEEDS_AUTHORIZATION
    http_status: 409
    applies_to: "POST /fueling-orders/{id}/uplift-records, POST /fueling-orders/{id}/complete"
  - priority: 48
    category: business_fiscal
    check: "the payment amount_cents is > 0 and the cumulative amount_paid_cents after it does not exceed Invoice.total_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every entity's created_at and updated_at, every released_at_utc, reported_at_utc, last_gauge_at_utc and last_filter_change_at_utc is stamped from this logical clock, never from real wall-clock time. The startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to real wall-clock time; every deadline, permit window, fueling window and expiry rule reads this logical clock. Advancing the clock re-evaluates FuelAuthorization expiry, EnvironmentalPermit expiry, filter element life and farm posture."
    roles: [ConsortiumAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["re-evaluates FuelAuthorization ISSUED -> EXPIRED", "re-evaluates EnvironmentalPermit ACTIVE -> EXPIRED", "recomputes calculations.filter_element_life_pct on every asset", "recomputes calculations.farm_posture on every farm"]
  - method: POST
    path: "/fuel-farms"
    description: "Registers a consortium fuel farm."
    roles: [ConsortiumAdmin]
    code: 201
    input: [iata_code, name, "hydrant_system_available?", "unpumpable_bottom_liters?"]
    output: FuelFarm
    side_effects: ["posture initialised to FROZEN until an ACTIVE permit covering clock_now exists"]
  - method: GET
    path: "/fuel-farms/{id}"
    description: "Reads a farm with its derived posture, permit utilisation, in-service asset count and open spill count."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector, IntoPlaneAgent, AirlineRep, EnvironmentalOfficer, BillingClerk]
    code: 200
    input: []
    output: FuelFarm
    side_effects: ["recomputes calculations.farm_posture before responding"]
  - method: POST
    path: "/fuel-farms/{id}/environmental-permits"
    description: "Issues a discharge and storage permit for the farm."
    roles: [ConsortiumAdmin]
    code: 201
    input: [permit_number, valid_from_utc, valid_until_utc, max_daily_throughput_liters, "max_reportable_spill_liters?"]
    output: EnvironmentalPermit
    side_effects: ["recomputes calculations.farm_posture, which may leave FROZEN"]
  - method: GET
    path: "/fuel-farms/{id}/environmental-permits"
    description: "Lists the farm's permits."
    roles: [ConsortiumAdmin, FarmOperator, EnvironmentalOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnvironmentalPermit[]
    side_effects: []
  - method: POST
    path: "/environmental-permits/{id}/suspend"
    description: "Suspends the permit, freezing the farm."
    roles: [EnvironmentalOfficer]
    code: 200
    input: [suspension_reason]
    output: EnvironmentalPermit
    side_effects: ["FuelFarm.posture becomes FROZEN and the FROZEN cascade hops 2 and 3 fire"]
  - method: POST
    path: "/environmental-permits/{id}/reinstate"
    description: "Reinstates a suspended permit."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: EnvironmentalPermit
    side_effects: ["recomputes calculations.farm_posture"]
  - method: POST
    path: "/fuel-farms/{id}/storage-tanks"
    description: "Registers a storage tank with its ledger baseline."
    roles: [ConsortiumAdmin]
    code: 201
    input: [tank_code, capacity_liters, safe_fill_liters, density_kg_per_m3, "opening_volume_liters?"]
    output: StorageTank
    side_effects: ["book_volume_liters set from calculations.tank_book_inventory", "quality_status initialised to ON_TEST", "recomputes calculations.farm_posture"]
  - method: GET
    path: "/fuel-farms/{id}/storage-tanks"
    description: "Lists the farm's tanks with derived ledger figures."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector, IntoPlaneAgent]
    code: 200
    input: ["service_status?", "quality_status?", "limit?", "offset?"]
    output: StorageTank[]
    side_effects: []
  - method: GET
    path: "/storage-tanks/{id}"
    description: "Reads a tank with book, reserved and available volumes."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector, IntoPlaneAgent]
    code: 200
    input: []
    output: StorageTank
    side_effects: ["recomputes calculations.tank_book_inventory before responding"]
  - method: POST
    path: "/storage-tanks/{id}/service-status"
    description: "Moves the tank on its service_status dimension. ISOLATED requires an isolation window and competes for the farm's single isolation slot."
    roles: [FarmOperator, ConsortiumAdmin]
    code: 200
    input: [to_status, "isolation_window_start_utc?", "isolation_window_end_utc?"]
    output: StorageTank
    side_effects: ["stores or clears the isolation window", "recomputes available_volume_liters and calculations.farm_posture", "OUT_OF_SERVICE locks out every HydrantPit fed by the tank"]
  - method: POST
    path: "/storage-tanks/{id}/samples"
    description: "Draws a periodic tank QA sample; from QUARANTINED this returns the tank to ON_TEST."
    roles: [QualityInspector]
    code: 201
    input: [sample_purpose]
    output: QualitySample
    side_effects: ["creates a QualitySample with status DRAWN", "StorageTank QUARANTINED -> ON_TEST when applicable", "recomputes calculations.farm_posture"]
  - method: POST
    path: "/storage-tanks/{id}/quality-release"
    description: "Signs the tank's quality release on the strength of a PASSing periodic sample drawn by a different inspector."
    roles: [QualityInspector]
    code: 200
    input: []
    output: StorageTank
    side_effects: ["quality_status becomes RELEASED", "recomputes calculations.farm_posture"]
  - method: POST
    path: "/storage-tanks/{id}/quarantine"
    description: "Quarantines the tank on quality grounds, firing cascade hops 2 and 3."
    roles: [QualityInspector]
    code: 200
    input: ["reason?"]
    output: StorageTank
    side_effects: ["unassigns ASSIGNED orders and aborts FUELING orders on the tank", "ends the freed orders' pit occupancy, voids POSTED uplifts and credits their net_liters back to book_volume_liters", "FuelFarm.posture becomes RESTRICTED"]
  - method: POST
    path: "/storage-tanks/{id}/gauge-measurements"
    description: "Records a manual dip: net volume at 15 C, temperature and water bottom depth."
    roles: [FarmOperator]
    code: 200
    input: [measured_volume_liters, temperature_c, water_bottom_mm]
    output: StorageTank
    side_effects: ["sets last_gauge_volume_liters, last_gauge_at_utc and water_bottom_mm", "water_bottom_mm >= 25.0 drives quality_status RELEASED -> QUARANTINED with cascade hops 2 and 3", "recomputes calculations.farm_posture"]
  - method: POST
    path: "/fuel-receipts"
    description: "Records an inbound parcel and freezes its corrected volumes; both the governing and the advisory basis are computed and stored."
    roles: [FarmOperator]
    code: 201
    input: [storage_tank_id, delivery_mode, supplier_name, meter_ticket_number, meter_ticket_gross_liters, tank_opening_gauge_liters, tank_closing_gauge_liters, temperature_c, certificate_density_kg_per_m3, "measured_water_liters?"]
    output: FuelReceipt
    side_effects: ["computes governing_gross_liters, advisory_gross_liters, net_volume_liters and advisory_net_volume_liters via calculations.receipt_net_volume_at_15c", "nothing is added to the tank ledger until the release verdict"]
  - method: GET
    path: "/fuel-receipts"
    description: "Lists receipts, filterable by destination tank and status."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector]
    code: 200
    input: ["storage_tank_id?", "status?", "limit?", "offset?"]
    output: FuelReceipt[]
    side_effects: []
  - method: GET
    path: "/fuel-receipts/{id}"
    description: "Reads a receipt with its frozen governing and advisory volumes."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector]
    code: 200
    input: []
    output: FuelReceipt
    side_effects: []
  - method: POST
    path: "/fuel-receipts/{id}/samples"
    description: "Draws the receipt QC sample; from QUARANTINED this starts a re-test round."
    roles: [QualityInspector]
    code: 201
    input: []
    output: QualitySample
    side_effects: ["FuelReceipt RECORDED -> SAMPLED or QUARANTINED -> SAMPLED", "records sampled_by_user_id", "increments retest_round on a re-sample"]
  - method: POST
    path: "/quality-samples/{id}/test-results"
    description: "Posts laboratory metrics and computes the sample verdict; drives the parent receipt SAMPLED -> UNDER_TEST."
    roles: [QualityInspector]
    code: 200
    input: ["water_reaction_rating?", "particulate_mg_per_l?", "conductivity_ps_per_m?", "observed_density_kg_per_m3?", "flash_point_c?"]
    output: QualitySample
    side_effects: ["computes verdict and failed_metrics via calculations.sample_verdict", "records tested_by_user_id", "FuelReceipt SAMPLED -> UNDER_TEST when the sample belongs to a receipt"]
  - method: GET
    path: "/quality-samples"
    description: "Lists samples, filterable by receipt, tank, asset and status."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector]
    code: 200
    input: ["fuel_receipt_id?", "storage_tank_id?", "fueling_asset_id?", "status?", "limit?", "offset?"]
    output: QualitySample[]
    side_effects: []
  - method: POST
    path: "/fuel-receipts/{id}/verdict"
    description: "Signs the release or quarantine verdict on a tested receipt; the signer must differ from the sampler."
    roles: [QualityInspector]
    code: 200
    input: [decision]
    output: FuelReceipt
    side_effects: ["RELEASE adds net_volume_liters to the tank ledger, stamps released_at_utc and recomputes permit utilisation and posture", "QUARANTINE fires the depth-3 quality cascade"]
  - method: POST
    path: "/fuel-receipts/{id}/reject"
    description: "Returns a quarantined parcel to the supplier without any ledger or permit-throughput effect."
    roles: [FarmOperator]
    code: 200
    input: ["reason?"]
    output: FuelReceipt
    side_effects: ["leaves book_volume_liters and active_permit_throughput_used_liters unchanged", "may return the tank's quality_status to RELEASED", "recomputes calculations.farm_posture"]
  - method: POST
    path: "/fuel-farms/{id}/fueling-assets"
    description: "Registers a refueller truck or hydrant cart."
    roles: [ConsortiumAdmin]
    code: 201
    input: [asset_code, asset_type, "tank_capacity_liters?", "turnaround_buffer_minutes?", "differential_pressure_kpa?"]
    output: FuelingAsset
    side_effects: ["last_filter_change_at_utc set to clock_now", "element_life_pct computed", "recomputes FuelFarm.in_service_asset_count and posture"]
  - method: GET
    path: "/fueling-assets"
    description: "Lists assets, filterable by farm, type and status."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector, IntoPlaneAgent]
    code: 200
    input: ["fuel_farm_id?", "asset_type?", "status?", "limit?", "offset?"]
    output: FuelingAsset[]
    side_effects: []
  - method: GET
    path: "/fueling-assets/{id}"
    description: "Reads an asset with its element life, reliability score and onboard volume."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector, IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingAsset
    side_effects: ["recomputes calculations.filter_element_life_pct before responding"]
  - method: POST
    path: "/fueling-assets/{id}/status"
    description: "Moves an asset between IN_SERVICE, DOWN_FOR_FILTER and DOWN_MAINTENANCE."
    roles: [FarmOperator, ConsortiumAdmin]
    code: 200
    input: [to_status]
    output: FuelingAsset
    side_effects: ["recomputes FuelFarm.in_service_asset_count and calculations.farm_posture"]
  - method: POST
    path: "/fueling-assets/{id}/filter-changes"
    description: "Records a filter element change, resetting the element counters and drawing a post-change membrane sample."
    roles: [QualityInspector]
    code: 201
    input: [element_lot_number, element_count, post_change_differential_pressure_kpa]
    output: FilterChange
    side_effects: ["captures liters_at_change and differential_pressure_before_kpa", "resets liters_since_filter_change to 0.0 and last_filter_change_at_utc to clock_now", "asset returns to IN_SERVICE", "creates a POST_FILTER_CHANGE QualitySample"]
  - method: GET
    path: "/fueling-assets/{id}/filter-changes"
    description: "Lists the asset's filter change history."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: FilterChange[]
    side_effects: []
  - method: POST
    path: "/fuel-farms/{id}/hydrant-pits"
    description: "Registers a hydrant pit against a stand and a source tank."
    roles: [ConsortiumAdmin]
    code: 201
    input: [pit_code, stand_code, source_storage_tank_id]
    output: HydrantPit
    side_effects: []
  - method: GET
    path: "/fuel-farms/{id}/hydrant-pits"
    description: "Lists the farm's hydrant pits."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HydrantPit[]
    side_effects: []
  - method: GET
    path: "/hydrant-pits"
    description: "Lists hydrant pits, filterable by farm and source tank."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent]
    code: 200
    input: ["fuel_farm_id?", "source_storage_tank_id?", "status?", "limit?", "offset?"]
    output: HydrantPit[]
    side_effects: []
  - method: POST
    path: "/airline-accounts"
    description: "Opens an airline account with its contract price and credit limit."
    roles: [ConsortiumAdmin]
    code: 201
    input: [airline_iata_code, legal_name, contract_type, base_price_cents_per_liter, credit_limit_cents, "tax_exempt?"]
    output: AirlineAccount
    side_effects: []
  - method: GET
    path: "/airline-accounts/{id}"
    description: "Reads an account with both exposure figures side by side."
    roles: [ConsortiumAdmin, BillingClerk, AirlineRep]
    code: 200
    input: []
    output: AirlineAccount
    side_effects: ["recomputes both calculations.airline_credit_exposure variants before responding"]
  - method: POST
    path: "/flights"
    description: "Registers a flight to be fuelled."
    roles: [AirlineRep, ConsortiumAdmin]
    code: 201
    input: [airline_account_id, flight_number, tail_number, scheduled_departure_utc, stand_code]
    output: Flight
    side_effects: []
  - method: GET
    path: "/flights"
    description: "Lists flights, filterable by account and status."
    roles: [ConsortiumAdmin, AirlineRep, IntoPlaneAgent, BillingClerk]
    code: 200
    input: ["airline_account_id?", "status?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []
  - method: POST
    path: "/fuel-authorizations"
    description: "Issues a contract-fuel release authorization and mints its deterministic 14-character code."
    roles: [AirlineRep, BillingClerk]
    code: 201
    input: [airline_account_id, flight_id, max_authorized_liters]
    output: FuelAuthorization
    side_effects: ["computes authorization_code, day_sequence and expires_at_utc via calculations.authorization_code"]
  - method: GET
    path: "/fuel-authorizations"
    description: "Lists authorizations, filterable by account, flight and status."
    roles: [ConsortiumAdmin, AirlineRep, IntoPlaneAgent, BillingClerk]
    code: 200
    input: ["airline_account_id?", "flight_id?", "status?", "limit?", "offset?"]
    output: FuelAuthorization[]
    side_effects: ["re-evaluates ISSUED -> EXPIRED against clock_now"]
  - method: POST
    path: "/fuel-authorizations/{id}/void"
    description: "Voids an unredeemed authorization."
    roles: [BillingClerk]
    code: 200
    input: []
    output: FuelAuthorization
    side_effects: ["sets voided_reason to MANUAL"]
  - method: POST
    path: "/fueling-orders"
    description: "Raises an into-plane fueling order for a flight against an authorization code."
    roles: [IntoPlaneAgent, AirlineRep]
    code: 201
    input: [flight_id, fuel_authorization_id, storage_tank_id, delivery_mode, requested_uplift_liters, window_start_utc, window_end_utc, quoted_authorization_code]
    output: FuelingOrder
    side_effects: ["order created in REQUESTED; no reservation is taken until authorization"]
  - method: GET
    path: "/fueling-orders"
    description: "Lists orders, filterable by flight, authorization, tank, asset, pit and status."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent, AirlineRep, BillingClerk]
    code: 200
    input: ["flight_id?", "fuel_authorization_id?", "storage_tank_id?", "fueling_asset_id?", "hydrant_pit_id?", "status?", "limit?", "offset?"]
    output: FuelingOrder[]
    side_effects: []
  - method: GET
    path: "/fueling-orders/{id}"
    description: "Reads an order with its reservation amount and posted volume."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent, AirlineRep, BillingClerk]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: []
  - method: POST
    path: "/fueling-orders/{id}/authorize"
    description: "Validates the quoted code, runs the accrual-basis credit check and takes the tank reservation."
    roles: [IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: ["computes reserved_amount_cents", "raises StorageTank.reserved_volume_liters", "recomputes AirlineAccount.accrual_exposure_cents"]
  - method: POST
    path: "/fueling-orders/{id}/assign"
    description: "Assigns a refueller or hydrant cart, checking the two different interval geometries (pit half-open, asset closed plus turnaround buffer)."
    roles: [IntoPlaneAgent]
    code: 200
    input: [fueling_asset_id, "hydrant_pit_id?"]
    output: FuelingOrder
    side_effects: ["records the order's pit occupancy for its window; HydrantPit.status is unchanged"]
  - method: POST
    path: "/fueling-orders/{id}/unassign"
    description: "Releases the assigned asset and pit and returns the order to AUTHORIZED without touching the tank reservation."
    roles: [IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: ["increments unassign_count", "ends the order's pit occupancy"]
  - method: POST
    path: "/fueling-orders/{id}/start"
    description: "Begins fuelling inside the booked window."
    roles: [IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: []
  - method: POST
    path: "/fueling-orders/{id}/uplift-records"
    description: "Posts an into-plane delivery ticket. Optimistic concurrency on the order's version guards against tickets written from a stale view."
    roles: [IntoPlaneAgent]
    code: 201
    input: [ticket_number, meter_start_liters, meter_end_liters, temperature_c, expected_fueling_order_version]
    output: UpliftRecord
    side_effects: ["computes gross_liters and net_liters via calculations.uplift_net_liters", "computes billed_line_cents, fuel_component_cents and volume_tier_diff_cents_per_liter via calculations.uplift_invoice_line_amount", "debits StorageTank.book_volume_liters", "raises FuelingAsset.liters_since_filter_change and recomputes element_life_pct", "recomputes FuelFarm.active_permit_throughput_used_liters and posture", "recomputes AirlineAccount.accrual_exposure_cents", "increments FuelingOrder.version by 1"]
  - method: GET
    path: "/uplift-records"
    description: "Lists uplift tickets, filterable by order, tank, invoice and status."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent, AirlineRep, BillingClerk]
    code: 200
    input: ["fueling_order_id?", "storage_tank_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: UpliftRecord[]
    side_effects: []
  - method: POST
    path: "/fueling-orders/{id}/complete"
    description: "Closes the order, redeems the authorization and releases the reservation."
    roles: [IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: ["FuelAuthorization ISSUED -> REDEEMED", "releases StorageTank.reserved_volume_liters", "ends the order's pit occupancy", "may drive the asset IN_SERVICE -> FILTER_DUE", "recomputes AirlineAccount.accrual_exposure_cents"]
  - method: POST
    path: "/fueling-orders/{id}/abort"
    description: "Aborts fuelling and compensates every side effect so the conserved volume and exposure quantities return to their pre-order values."
    roles: [IntoPlaneAgent]
    code: 200
    input: [abort_reason]
    output: FuelingOrder
    side_effects: ["voids POSTED uplifts and credits their net_liters back to StorageTank.book_volume_liters", "releases the reservation", "FuelAuthorization ISSUED -> VOIDED", "ends the order's pit occupancy", "recomputes AirlineAccount.accrual_exposure_cents"]
  - method: POST
    path: "/fueling-orders/{id}/cancel"
    description: "Cancels an order that has not started."
    roles: [AirlineRep, IntoPlaneAgent]
    code: 200
    input: []
    output: FuelingOrder
    side_effects: ["releases any reservation", "FuelAuthorization ISSUED -> VOIDED", "ends the order's pit occupancy", "recomputes AirlineAccount.accrual_exposure_cents"]
  - method: POST
    path: "/spill-incidents"
    description: "Reports a product release at a farm."
    roles: [EnvironmentalOfficer, IntoPlaneAgent]
    code: 201
    input: [fuel_farm_id, spilled_volume_liters, surface, "fueling_asset_id?", "storage_tank_id?"]
    output: SpillIncident
    side_effects: ["stamps reported_at_utc from the logical clock", "recomputes FuelFarm.open_spill_count and calculations.farm_posture, which becomes RESTRICTED while the incident is open (FROZEN only on escalation)"]
  - method: GET
    path: "/spill-incidents"
    description: "Lists incidents, filterable by farm, asset, tank and status."
    roles: [ConsortiumAdmin, FarmOperator, EnvironmentalOfficer, IntoPlaneAgent]
    code: 200
    input: ["fuel_farm_id?", "fueling_asset_id?", "storage_tank_id?", "status?", "limit?", "offset?"]
    output: SpillIncident[]
    side_effects: []
  - method: POST
    path: "/spill-incidents/{id}/escalate"
    description: "Notifies the regulator, firing the depth-3 environmental cascade."
    roles: [EnvironmentalOfficer]
    code: 200
    input: [regulator_reference]
    output: SpillIncident
    side_effects: ["FuelFarm.posture becomes FROZEN", "cancels AUTHORIZED orders, aborts FUELING orders and downs every serviceable asset at the farm", "voids the affected authorizations and releases reservations"]
  - method: POST
    path: "/spill-incidents/{id}/contain"
    description: "Records containment and applies the asset reliability penalty."
    roles: [EnvironmentalOfficer]
    code: 200
    input: [contained_volume_liters]
    output: SpillIncident
    side_effects: ["applies calculations.asset_reliability_score to the attributed asset", "recomputes FuelFarm.open_spill_count and posture"]
  - method: POST
    path: "/spill-incidents/{id}/remediate"
    description: "Records completed remediation."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: []
  - method: POST
    path: "/spill-incidents/{id}/close"
    description: "Closes the incident file."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: ["recomputes calculations.farm_posture"]
  - method: POST
    path: "/fuel-farms/{id}/reconciliation-runs"
    description: "Opens a stock reconciliation run over a half-open period."
    roles: [FarmOperator]
    code: 201
    input: [period_start_utc, period_end_utc]
    output: ReconciliationRun
    side_effects: []
  - method: GET
    path: "/fuel-farms/{id}/reconciliation-runs"
    description: "Lists the farm's reconciliation runs."
    roles: [ConsortiumAdmin, FarmOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []
  - method: POST
    path: "/reconciliation-runs/{id}/measure"
    description: "Posts one gauge measurement per in-service or isolated tank and computes both variance bases."
    roles: [FarmOperator]
    code: 200
    input: [tank_measurements]
    output: ReconciliationRun
    side_effects: ["computes variance_liters, variance_pct_throughput_basis and variance_pct_opening_stock_basis via calculations.reconciliation_gain_loss", "auto-transitions MEASURED -> VARIANCE_HOLD above tolerance", "writes last_gauge_volume_liters onto each measured tank"]
  - method: POST
    path: "/reconciliation-runs/{id}/post"
    description: "Posts the run, writing the signed per-tank adjustment into the ledger."
    roles: [ConsortiumAdmin]
    code: 200
    input: ["variance_override_reason?"]
    output: ReconciliationRun
    side_effects: ["each tank's book_volume_liters is set equal to its measured volume", "recomputes available_volume_liters and calculations.farm_posture"]
  - method: POST
    path: "/invoices"
    description: "Creates a draft invoice by sweeping the account's unbilled POSTED uplift tickets in the period. Optimistic concurrency on the account's version guards against a sweep computed from a stale view."
    roles: [BillingClerk]
    code: 201
    input: [airline_account_id, period_start_utc, period_end_utc, expected_airline_account_version, "replaces_invoice_id?"]
    output: Invoice
    side_effects: ["sweeps tickets and sets invoice_id on each", "computes swept_net_liters, fuel_component_cents, subtotal_cents, volume_rebate_cents, admin_fee_cents and total_cents via calculations.invoice_total_with_fees", "increments AirlineAccount.version by 1"]
  - method: GET
    path: "/invoices"
    description: "Lists invoices, filterable by account, superseded invoice and status."
    roles: [ConsortiumAdmin, BillingClerk, AirlineRep]
    code: 200
    input: ["airline_account_id?", "replaces_invoice_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Reads an invoice with its rebate, admin fee and payable total."
    roles: [ConsortiumAdmin, BillingClerk, AirlineRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/quality-samples/{id}"
    description: "Reads one sample with its verdict and failed metric list."
    roles: [ConsortiumAdmin, FarmOperator, QualityInspector]
    code: 200
    input: []
    output: QualitySample
    side_effects: []
  - method: GET
    path: "/hydrant-pits/{id}"
    description: "Reads one hydrant pit with its status and source tank."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent]
    code: 200
    input: []
    output: HydrantPit
    side_effects: []
  - method: GET
    path: "/flights/{id}"
    description: "Reads one flight with its stand and scheduled departure."
    roles: [ConsortiumAdmin, AirlineRep, IntoPlaneAgent, BillingClerk]
    code: 200
    input: []
    output: Flight
    side_effects: []
  - method: GET
    path: "/fuel-authorizations/{id}"
    description: "Reads one authorization with its code, day sequence and expiry."
    roles: [ConsortiumAdmin, AirlineRep, IntoPlaneAgent, BillingClerk]
    code: 200
    input: []
    output: FuelAuthorization
    side_effects: ["re-evaluates ISSUED -> EXPIRED against clock_now"]
  - method: GET
    path: "/uplift-records/{id}"
    description: "Reads one uplift ticket with its net liters and billed line amount."
    roles: [ConsortiumAdmin, FarmOperator, IntoPlaneAgent, AirlineRep, BillingClerk]
    code: 200
    input: []
    output: UpliftRecord
    side_effects: []
  - method: GET
    path: "/spill-incidents/{id}"
    description: "Reads one spill incident with its containment and regulator reference."
    roles: [ConsortiumAdmin, FarmOperator, EnvironmentalOfficer, IntoPlaneAgent]
    code: 200
    input: []
    output: SpillIncident
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issues the invoice, flipping its swept tickets to BILLED."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["swept UpliftRecord rows POSTED -> BILLED", "records issued_by_user_id", "recomputes both AirlineAccount exposure figures"]
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "The airline disputes an issued invoice."
    roles: [AirlineRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/resolve-dispute"
    description: "A different billing clerk resolves the dispute and returns the invoice to ISSUED."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments dispute_round", "records dispute_resolved_by_user_id"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Voids an unpaid invoice and returns its tickets to POSTED so a reissue can sweep them again."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["swept UpliftRecord rows BILLED -> POSTED with invoice_id cleared", "recomputes both AirlineAccount exposure figures back to their pre-issue values"]
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Records a payment against an issued invoice."
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["raises amount_paid_cents", "ISSUED -> PAID once the cumulative payment reaches total_cents", "recomputes both AirlineAccount exposure figures"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http: 403
    condition: "an AirlineRep acts on a flight, authorization, order or invoice belonging to a different AirlineAccount than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the user who performed the preceding step of the same workflow (sampler signing its own release, drawer releasing its own tank, issuer resolving its own dispute)"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path-templated resource id does not resolve"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign-key id supplied in the request body does not resolve"
  - id: ERR_CROSS_FARM_REFERENCE
    http: 422
    condition: "the supplied tank, asset, pit, flight and authorization do not belong to the same farm or the same flight"
  - id: ERR_INVALID_PAYLOAD
    http: 400
    condition: "a required input field is missing or has the wrong type"
  - id: ERR_FIELD_OUT_OF_RANGE
    http: 422
    condition: "a numeric or enum value violates the declared field constraint"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a globally or farm-scoped unique key (iata_code, permit_number, meter_ticket_number, ticket_number, airline_iata_code, tank_code, asset_code, pit_code) is already taken"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_fueling_order_version does not equal the order's current version"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_airline_account_version does not equal the account's current version"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target row is already in a terminal state for its machine"
  - id: ERR_INVALID_RECEIPT_STATE
    http: 409
    condition: "the receipt's status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the order's status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_TANK_STATE
    http: 409
    condition: "the tank's service_status or quality_status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_ASSET_STATE
    http: 409
    condition: "the asset's status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_SPILL_STATE
    http: 409
    condition: "the incident's status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "the invoice's status is not a declared from-state for the requested transition"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "the reconciliation run's status is not a declared from-state for the requested transition"
  - id: ERR_FARM_FROZEN
    http: 409
    condition: "the governing FuelFarm.posture is FROZEN"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "the farm has no EnvironmentalPermit with status ACTIVE covering the logical clock"
  - id: ERR_TANK_QUARANTINED
    http: 409
    condition: "the source tank's quality_status is not RELEASED"
  - id: ERR_SAMPLE_VERDICT_FAIL
    http: 409
    condition: "a release verdict is requested but the latest TESTED sample verdict is FAIL, or no TESTED sample exists"
  - id: ERR_WATER_BOTTOM_EXCEEDED
    http: 409
    condition: "water_bottom_mm is 25.0 or greater when a tank release or return to service is attempted"
  - id: ERR_RETEST_LIMIT_REACHED
    http: 409
    condition: "a third re-sample is requested on a receipt whose retest_round is already 2"
  - id: ERR_ASSET_NOT_SERVICEABLE
    http: 409
    condition: "the asset is not IN_SERVICE or its element_life_pct has reached 100.0"
  - id: ERR_SPILL_NOT_REPORTABLE
    http: 422
    condition: "escalation is requested for a spill below the permit's reportable volume, or regulator_reference is missing"
  - id: ERR_EMPTY_TEST_RESULT_SET
    http: 422
    condition: "test results are posted with every metric null"
  - id: ERR_AUTH_CODE_MISMATCH
    http: 422
    condition: "the quoted authorization code does not equal the authorization's minted code"
  - id: ERR_AUTHORIZATION_NOT_REDEEMABLE
    http: 409
    condition: "the authorization is not ISSUED or the logical clock has reached its expires_at_utc"
  - id: ERR_DELIVERY_MODE_MISMATCH
    http: 422
    condition: "the delivery mode does not match the farm's hydrant capability, the asset type, the pit availability or the flight's stand"
  - id: ERR_PIT_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open fueling window intersects another live order's window on the same hydrant pit"
  - id: ERR_ASSET_WINDOW_CONFLICT
    http: 409
    condition: "the requested window, extended by the asset's turnaround buffer and treated as closed, intersects another live order's window on the same asset"
  - id: ERR_TANK_ISOLATION_CONFLICT
    http: 409
    condition: "another tank at the same farm already holds an intersecting isolation window"
  - id: ERR_OUTSIDE_FUELING_WINDOW
    http: 409
    condition: "the logical clock sits outside the order's half-open fueling window"
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 409
    condition: "measurements are posted before the reconciliation period has elapsed"
  - id: ERR_MEASUREMENT_SET_INCOMPLETE
    http: 422
    condition: "the measurement set does not cover exactly the farm's IN_SERVICE and ISOLATED tanks"
  - id: ERR_VARIANCE_OVERRIDE_REQUIRED
    http: 409
    condition: "a run in VARIANCE_HOLD is posted without variance_override_reason"
  - id: ERR_NO_UPLIFT_RECORDED
    http: 409
    condition: "completion is requested with no POSTED uplift ticket on the order"
  - id: ERR_NOTHING_TO_SWEEP
    http: 422
    condition: "the invoice sweep finds no unbilled POSTED ticket in the period"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "a third dispute is raised on an invoice whose dispute_round is already 2"
  - id: ERR_SAFE_FILL_EXCEEDED
    http: 409
    condition: "releasing the receipt would push the tank's book volume above its safe fill"
  - id: ERR_PERMIT_THROUGHPUT_EXCEEDED
    http: 409
    condition: "the movement would push the farm's permit-day throughput above the permitted daily maximum"
  - id: ERR_INSUFFICIENT_TANK_VOLUME
    http: 409
    condition: "the tank's available volume cannot cover the requested reservation or the posted ticket"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "the accrual-basis exposure including the new reservation exceeds the account's credit limit, or the account is on CREDIT_HOLD"
  - id: ERR_UPLIFT_EXCEEDS_AUTHORIZATION
    http: 409
    condition: "the posted volume breaches the authorization ceiling (5 percent tolerance when posting, no tolerance when completing)"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "the payment is not positive or would exceed the invoice total"

roles:
  - name: ConsortiumAdmin
    description: "Consortium operations manager: registers farms, permits, tanks, assets, pits and airline accounts, posts reconciliation runs and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /fuel-farms"
      - "POST /fuel-farms/{id}/environmental-permits"
      - "POST /fuel-farms/{id}/storage-tanks"
      - "POST /fuel-farms/{id}/fueling-assets"
      - "POST /fuel-farms/{id}/hydrant-pits"
      - "POST /airline-accounts"
      - "POST /reconciliation-runs/{id}/post"
    shared_operations:
      - "POST /storage-tanks/{id}/service-status (with FarmOperator)"
      - "POST /fueling-assets/{id}/status (with FarmOperator)"
      - "POST /flights (with AirlineRep)"
      - "all GET endpoints"
  - name: FarmOperator
    description: "Fuel farm operator: records receipts, gauges and isolates tanks, opens reconciliation runs and posts measurements."
    identity: "opaque"
    exclusive_operations:
      - "POST /fuel-receipts"
      - "POST /fuel-receipts/{id}/reject"
      - "POST /storage-tanks/{id}/gauge-measurements"
      - "POST /fuel-farms/{id}/reconciliation-runs"
      - "POST /reconciliation-runs/{id}/measure"
    shared_operations:
      - "POST /storage-tanks/{id}/service-status (with ConsortiumAdmin)"
      - "POST /fueling-assets/{id}/status (with ConsortiumAdmin)"
      - "GET endpoints on farms, tanks, receipts, samples, assets, pits, orders, uplifts and runs"
  - name: QualityInspector
    description: "Fuel quality inspector: draws samples, posts laboratory results, signs receipt and tank release verdicts and performs filter changes. Segregation of duties forbids signing a release for a sample the same inspector drew."
    identity: "opaque"
    exclusive_operations:
      - "POST /fuel-receipts/{id}/samples"
      - "POST /storage-tanks/{id}/samples"
      - "POST /quality-samples/{id}/test-results"
      - "POST /fuel-receipts/{id}/verdict"
      - "POST /storage-tanks/{id}/quality-release"
      - "POST /storage-tanks/{id}/quarantine"
      - "POST /fueling-assets/{id}/filter-changes"
    shared_operations:
      - "GET endpoints on farms, tanks, receipts, samples, assets and filter changes"
  - name: IntoPlaneAgent
    description: "Into-plane fueling agent: raises and drives fueling orders, posts uplift tickets and reports spills observed on the ramp."
    identity: "opaque"
    exclusive_operations:
      - "POST /fueling-orders/{id}/authorize"
      - "POST /fueling-orders/{id}/assign"
      - "POST /fueling-orders/{id}/unassign"
      - "POST /fueling-orders/{id}/start"
      - "POST /fueling-orders/{id}/uplift-records"
      - "POST /fueling-orders/{id}/complete"
      - "POST /fueling-orders/{id}/abort"
    shared_operations:
      - "POST /fueling-orders (with AirlineRep)"
      - "POST /fueling-orders/{id}/cancel (with AirlineRep)"
      - "POST /spill-incidents (with EnvironmentalOfficer)"
      - "GET endpoints on farms, tanks, assets, pits, flights, authorizations, orders, uplifts and spills"
  - name: AirlineRep
    description: "Airline fuel desk representative acting for one airline account; X-User-ID is that account's id."
    identity: "entity_backed:AirlineAccount"
    exclusive_operations:
      - "POST /invoices/{id}/dispute"
    shared_operations:
      - "POST /flights (with ConsortiumAdmin)"
      - "POST /fuel-authorizations (with BillingClerk)"
      - "POST /fueling-orders (with IntoPlaneAgent)"
      - "POST /fueling-orders/{id}/cancel (with IntoPlaneAgent)"
      - "GET endpoints on its own account, flights, authorizations, orders, uplifts and invoices"
  - name: EnvironmentalOfficer
    description: "Environmental compliance officer: suspends and reinstates permits and runs the spill response chain."
    identity: "opaque"
    exclusive_operations:
      - "POST /environmental-permits/{id}/suspend"
      - "POST /environmental-permits/{id}/reinstate"
      - "POST /spill-incidents/{id}/escalate"
      - "POST /spill-incidents/{id}/contain"
      - "POST /spill-incidents/{id}/remediate"
