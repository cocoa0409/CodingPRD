scenario: |
  2877. Build-to-Rent Community Development & Lease-Up (build-to-rent developer): site selection and
  product mix between detached homes, cottages and townhome configurations, entitlement and platting
  decisions preserving single-ownership operation, construction phasing to allow leasing of completed
  sections during ongoing construction, lease-up pacing, concession strategy and rent growth modeling
  against absorption, amenity delivery timing and resident experience during construction, property
  management transition, maintenance staffing and turn processes for detached product, homeowner
  association or community services structure, portfolio financing and stabilization-based valuation
domain_name: build-to-rent-leaseup
# Flat topology: every entity is addressed from its own root collection and linked by FK fields in
# request bodies, so the API prefix is the server root.
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # Phase.predecessor_phase_id -> Phase.id
    - cross_aggregate       # Lease reaches Community through Homesite -> Phase -> Community
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    The community's derived `posture` (OPEN / RESTRICTED / FROZEN) is recomputed from its children
    after every mutation and gates all leasing and inventory operations. Layered on top: a pricing
    engine (absorption-indexed rent growth + concession amortization with two competing
    amortization modes), OCC on Community.version for the two create-with-supersede writes
    (concession programs, rent schedules), and cyclic state machines on Homesite (turn loop) and
    Community (plat revision loop) plus parallel state dimensions on Lease.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Community trade name
        constraints: 1..120 chars, non-blank
      - name: market_code
        type: string
        source: input
        description: Submarket code used for reporting
        constraints: 2..8 uppercase chars
      - name: total_planned_units
        type: integer
        source: input
        description: Total planned rental homes across all housing phases
        constraints: ">= 1"
      - name: product_mix
        type: object
        source: input
        description: "Planned unit count per product type: {DETACHED: n, COTTAGE: n, TOWNHOME: n}"
        constraints: all three keys required, each >= 0, values MUST sum to total_planned_units
      - name: single_ownership_covenant
        type: boolean
        source: input
        description: True when the plat keeps every home under one owner (no fee-simple lot sales)
        default: true
      - name: concession_budget_cents
        type: integer
        source: input
        description: Lifetime concession budget for the community in cents
        constraints: ">= 0"
      - name: facility_commitment_cents
        type: integer
        source: input
        description: Committed principal of the portfolio construction facility in cents
        constraints: ">= 0"
      - name: maintenance_tech_headcount
        type: integer
        source: input
        description: Maintenance technicians staffed for turns; caps concurrent turn labour
        default: 2
        constraints: ">= 1"
      - name: plat_status
        type: enum
        source: system
        description: Entitlement/platting dimension of the community
        default: DRAFT
        constraints: DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED
      - name: plat_revision_round
        type: integer
        source: system
        description: Count of REQUEST_REVISION decisions already issued on the plat
        default: 0
        constraints: 0..2; a third REQUEST_REVISION is rejected
      - name: plat_submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the DeveloperPrincipal who submitted the current plat package
        default: null
      - name: plat_package_reference
        type: string
        source: system
        description: Reference of the most recently submitted plat package, recorded from the submission request
        default: null
      - name: lifecycle_status
        type: enum
        source: system
        description: Development lifecycle dimension
        default: PLANNING
        constraints: PLANNING | CONSTRUCTION | LEASE_UP | STABILIZED
      - name: management_mode
        type: enum
        source: system
        description: Property-management dimension (developer-managed vs third-party PM)
        default: DEVELOPER_SELF_MANAGED
        constraints: DEVELOPER_SELF_MANAGED | PM_TRANSITION_PENDING | PM_MANAGED
      - name: pm_company_name
        type: string
        source: system
        description: Name of the incoming property manager, set by the PM transition
        default: null
      - name: pm_effective_from
        type: datetime
        source: system
        description: Instant at which management_mode flips to PM_MANAGED (ISO 8601 UTC, 3 fractional digits)
        default: null
      - name: facility_status
        type: enum
        source: system
        description: Portfolio financing dimension
        default: CONSTRUCTION_DRAW
        constraints: CONSTRUCTION_DRAW | ADVANCE_ELIGIBLE | CONVERSION_PENDING | PERM_CONVERTED
      - name: posture
        type: enum
        source: computed
        description: Derived gate over all child operations, recomputed after every mutation that touches the community or any of its phases, homesites or leases
        default: FROZEN
        constraints: OPEN | RESTRICTED | FROZEN
      - name: released_unit_count
        type: integer
        source: computed
        description: Count of homesites in this community with released_at != null
        default: 0
      - name: available_unit_count
        type: integer
        source: computed
        description: Count of homesites in this community with status == AVAILABLE
        default: 0
      - name: leased_unit_count
        type: integer
        source: computed
        description: Count of homesites in this community with status IN {LEASED, NOTICE_GIVEN}
        default: 0
      - name: occupancy_ratio
        type: number
        source: computed
        description: leased_unit_count / total_planned_units, round_half_up to 4 decimals
        default: 0.0
      - name: amenity_delivery_ratio
        type: number
        source: computed
        description: Delivered amenity weight over planned amenity weight, round_half_up to 4 decimals; exactly 1.0 when the community has no AMENITY phase
        default: 1.0
      - name: committed_concession_cents
        type: integer
        source: computed
        description: Sum of Lease.concession_remaining_cents over leases whose concession_status IN {APPROVED, AMORTIZING}
        default: 0
      - name: construction_impact_credit_cents
        type: integer
        source: computed
        description: Cumulative resident-experience credits accrued while the community was RESTRICTED or FROZEN
        default: 0

  - name: Phase
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; owning community
      - name: predecessor_phase_id
        type: string
        source: input
        description: FK -> Phase.id; self-referential dependency, this phase may not start until its predecessor has reached SECTIONS_RELEASED or COMPLETE
        default: null
      - name: sequence_index
        type: integer
        source: input
        description: Delivery order within the community
        constraints: ">= 1, unique per community_id"
      - name: kind
        type: enum
        source: input
        description: HOUSING phases deliver rentable homesites; AMENITY phases deliver shared amenities
        constraints: HOUSING | AMENITY
      - name: planned_unit_count
        type: integer
        source: input
        description: Homesites planned in this phase; MUST be 0 when kind == AMENITY and >= 1 when kind == HOUSING
        default: 0
      - name: amenity_weight
        type: integer
        source: input
        description: Weight of this amenity in the community's amenity_delivery_ratio; MUST be 0 when kind == HOUSING and >= 1 when kind == AMENITY
        default: 0
      - name: construction_window_start
        type: datetime
        source: input
        description: Start of the closed construction window (ISO 8601 UTC, 3 fractional digits)
      - name: construction_window_end
        type: datetime
        source: input
        description: End of the closed construction window, inclusive; MUST be strictly after construction_window_start
      - name: status
        type: enum
        source: system
        description: Construction state of the phase
        default: PLANNED
        constraints: PLANNED | UNDER_CONSTRUCTION | SECTIONS_RELEASED | CONSTRUCTION_HALTED | COMPLETE
      - name: halt_count
        type: integer
        source: system
        description: Number of halts applied to this phase
        default: 0
      - name: pre_halt_status
        type: enum
        source: system
        description: Status the phase held immediately before its current halt; used to restore on resume
        default: null
        constraints: null | UNDER_CONSTRUCTION | SECTIONS_RELEASED
      - name: released_homesite_count
        type: integer
        source: computed
        description: Count of homesites in this phase with released_at != null
        default: 0
      - name: leased_homesite_count
        type: integer
        source: computed
        description: Count of homesites in this phase with status IN {LEASED, NOTICE_GIVEN}
        default: 0

  - name: Homesite
    parent: null
    common_fields: true
    fields:
      - name: phase_id
        type: string
        source: input
        description: FK -> Phase.id; the HOUSING phase that delivers this home
      - name: lot_number
        type: string
        source: input
        description: Plat lot label
        constraints: 1..12 chars, unique per phase_id
      - name: product_type
        type: enum
        source: input
        description: Product configuration of the home
        constraints: DETACHED | COTTAGE | TOWNHOME
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count
        constraints: 1..5
      - name: square_feet
        type: integer
        source: input
        description: Conditioned area
        constraints: 400..4000
      - name: status
        type: enum
        source: system
        description: Inventory state of the home
        default: PLANNED
        constraints: PLANNED | AVAILABLE | LEASED | NOTICE_GIVEN | IN_TURN | OFF_MARKET
      - name: off_market_reason
        type: enum
        source: system
        description: Why the home was delisted; POSTURE_FREEZE homes are relisted when the freeze clears
        default: null
        constraints: null | POSTURE_FREEZE
      - name: occupancy_certificate_number
        type: string
        source: system
        description: Certificate of occupancy identifier issued by the entitlement authority
        default: null
      - name: occupancy_certificate_issued_at
        type: datetime
        source: system
        description: Instant the certificate of occupancy was issued (ISO 8601 UTC, 3 fractional digits)
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Instant this home was first released to leasing (ISO 8601 UTC, 3 fractional digits)
        default: null
      - name: turn_cycle_count
        type: integer
        source: system
        description: Completed turn cycles on this home
        default: 0
      - name: last_turn_ready_at
        type: datetime
        source: system
        description: Instant the home last returned to AVAILABLE from IN_TURN
        default: null

  - name: MarketRentSchedule
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; community the schedule prices
      - name: product_type
        type: enum
        source: input
        description: Product configuration priced by this schedule
        constraints: DETACHED | COTTAGE | TOWNHOME
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which this schedule may price new leases (ISO 8601 UTC, 3 fractional digits)
      - name: repricing_mode
        type: enum
        source: input
        description: MANUAL takes asking_rent_cents from the request; ABSORPTION_INDEXED derives it from the prior schedule and the latest absorption review
        constraints: MANUAL | ABSORPTION_INDEXED
      - name: asking_rent_cents
        type: integer
        source: computed
        description: Published asking rent; equal to the request value when repricing_mode == MANUAL, otherwise derived by rent_growth_repricing
        constraints: ">= 1"
      - name: applied_growth_bps
        type: integer
        source: computed
        description: Growth applied versus the superseded schedule in basis points; 0 for MANUAL publications
        default: 0
      - name: status
        type: enum
        source: system
        description: PUBLISHED until a later schedule for the same community and product type supersedes it
        default: PUBLISHED
        constraints: PUBLISHED | SUPERSEDED
      - name: superseded_at
        type: datetime
        source: system
        description: Instant this schedule was superseded
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the AssetManager who published the schedule

  - name: ConcessionProgram
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; community the program applies to
      - name: program_code
        type: string
        source: input
        description: Operator-facing program label
        constraints: 2..24 chars, unique per community_id
      - name: tier
        type: enum
        source: input
        description: Concession aggressiveness label recorded on the program; informational and not cross-checked against absorption reviews
        constraints: NONE | LIGHT | MODERATE | AGGRESSIVE
      - name: free_weeks
        type: integer
        source: input
        description: Weeks of gross charge granted as concession
        constraints: 0..12
      - name: amortization_mode
        type: enum
        source: input
        description: STRAIGHT_LINE_NET_EFFECTIVE spreads the concession evenly across the term; UPFRONT_FREE_RENT consumes it in the earliest periods
        constraints: STRAIGHT_LINE_NET_EFFECTIVE | UPFRONT_FREE_RENT
      - name: eligible_product_types
        type: array
        source: input
        description: Product configurations this program may be attached to
        constraints: non-empty subset of [DETACHED, COTTAGE, TOWNHOME]
      - name: restricted_posture_eligible
        type: boolean
        source: input
        description: When true, leases carrying this program may still be signed while the community posture is RESTRICTED
        default: false
      - name: max_budget_cents
        type: integer
        source: input
        description: Program-level concession cap in cents
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of Lease.concession_remaining_cents over leases with this concession_program_id whose concession_status IN {APPROVED, AMORTIZING}
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE until a later program for the same community supersedes it
        default: ACTIVE
        constraints: ACTIVE | SUPERSEDED
      - name: superseded_at
        type: datetime
        source: system
        description: Instant this program was superseded
        default: null

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: primary_applicant_name
        type: string
        source: input
        description: Name of the lease-holding applicant
        constraints: 1..120 chars
      - name: email
        type: string
        source: input
        description: Contact email, globally unique
        constraints: contains '@', unique across households
      - name: household_size
        type: integer
        source: input
        description: Occupant count
        constraints: 1..8
      - name: monthly_income_cents
        type: integer
        source: input
        description: Verified combined monthly household income in cents
        constraints: ">= 0"
      - name: credit_tier
        type: enum
        source: input
        description: Underwriting tier
        constraints: A | B | C
      - name: active_lease_count
        type: integer
        source: computed
        description: Count of leases for this household with lease_status IN {DRAFT, PENDING_SIGNATURE, EXECUTED, ACTIVE, ENDING}
        default: 0

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: homesite_id
        type: string
        source: input
        description: FK -> Homesite.id; home being leased
      - name: household_id
        type: string
        source: input
        description: FK -> Household.id; leaseholder; equals X-User-ID when the Household role acts on this lease
      - name: concession_program_id
        type: string
        source: system
        description: FK -> ConcessionProgram.id; program attached by the concession request, null until then
        default: null
      - name: priced_by_schedule_id
        type: string
        source: system
        description: FK -> MarketRentSchedule.id; schedule selected by base_rent_selection at lease creation
      - name: term_months
        type: integer
        source: input
        description: Lease term in months
        constraints: one of 12, 18, 24
      - name: start_date
        type: datetime
        source: input
        description: Lease commencement instant (ISO 8601 UTC, 3 fractional digits)
      - name: end_date
        type: datetime
        source: computed
        description: start_date plus term_months calendar months
      - name: base_rent_cents
        type: integer
        source: computed
        description: asking_rent_cents of the schedule chosen by base_rent_selection, frozen at lease creation
      - name: community_services_fee_cents
        type: integer
        source: computed
        description: Monthly community-services (HOA-substitute) fee produced by community_services_fee
      - name: gross_monthly_charge_cents
        type: integer
        source: computed
        description: base_rent_cents + community_services_fee_cents
      - name: total_concession_cents
        type: integer
        source: computed
        description: Total concession granted, produced by concession_amortization at concession request time
        default: 0
      - name: concession_schedule
        type: array
        source: computed
        description: "Ordered periods produced by concession_amortization: [{period_index, credit_cents}]"
        default: []
      - name: monthly_concession_credit_cents
        type: integer
        source: computed
        description: credit_cents of period 1 of concession_schedule
        default: 0
      - name: first_period_charge_cents
        type: integer
        source: computed
        description: gross_monthly_charge_cents minus period 1 credit_cents, floored at 0
        default: 0
      - name: net_effective_rent_cents
        type: integer
        source: computed
        description: round_half_up((gross_monthly_charge_cents * term_months - total_concession_cents) / term_months); mode-independent
        default: 0
      - name: concession_applied_cents
        type: integer
        source: computed
        description: Sum of credit_cents already applied by concession credit applications
        default: 0
      - name: concession_remaining_cents
        type: integer
        source: computed
        description: total_concession_cents - concession_applied_cents
        default: 0
      - name: credits_applied_count
        type: integer
        source: system
        description: Number of concession credit applications posted
        default: 0
      - name: lease_status
        type: enum
        source: system
        description: Contract dimension of the lease
        default: DRAFT
        constraints: DRAFT | PENDING_SIGNATURE | EXECUTED | ACTIVE | ENDING | ENDED | CANCELLED
      - name: concession_status
        type: enum
        source: system
        description: Concession dimension of the lease, evolving independently of lease_status
        default: NONE
        constraints: NONE | REQUESTED | APPROVED | AMORTIZING | EXHAUSTED | REJECTED | REVOKED
      - name: concession_requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeasingAgent who requested the concession
        default: null
      - name: concession_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AssetManager who decided the concession
        default: null
      - name: cancellation_reason
        type: enum
        source: system
        description: Why the lease was cancelled
        default: null
        constraints: null | POSTURE_FREEZE | APPLICANT_WITHDREW | OPERATOR_CANCELLED
      - name: signed_by_name
        type: string
        source: system
        description: Signature name captured at execution
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Instant the lease was signed (ISO 8601 UTC, 3 fractional digits)
        default: null
      - name: notice_date
        type: datetime
        source: system
        description: Instant the resident gave notice
        default: null
      - name: move_out_date
        type: datetime
        source: system
        description: Planned move-out instant supplied with the notice
        default: null
      - name: construction_impact_credit_cents
        type: integer
        source: computed
        description: Resident-experience credits accrued on this lease while the community was RESTRICTED or FROZEN
        default: 0

  - name: TurnWorkOrder
    parent: null
    common_fields: true
    fields:
      - name: homesite_id
        type: string
        source: input
        description: FK -> Homesite.id; home being turned
      - name: window_start
        type: datetime
        source: input
        description: Start of the half-open occupation window [window_start, window_end)
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the occupation window; MUST be strictly after window_start and a whole number of hours from it
      - name: scope
        type: enum
        source: input
        description: Work scope; sets the hourly labour rate
        constraints: MAKE_READY | DETACHED_YARD_RESTORE | MAJOR_REHAB
      - name: tech_count
        type: integer
        source: input
        description: Technicians assigned for the whole window
        constraints: 1..3
      - name: material_cost_cents
        type: integer
        source: input
        description: Estimated materials in cents
        constraints: ">= 0"
      - name: window_hours
        type: integer
        source: computed
        description: (window_end - window_start) in whole hours
      - name: labor_cost_cents
        type: integer
        source: computed
        description: tech_count * window_hours * scope rate
      - name: total_turn_cost_cents
        type: integer
        source: computed
        description: labor_cost_cents + material_cost_cents
      - name: tenant_recoverable_cents
        type: integer
        source: computed
        description: Bucket 1 of turn_cost_allocation
        default: 0
      - name: community_opex_cents
        type: integer
        source: computed
        description: Bucket 2 of turn_cost_allocation
        default: 0
      - name: capital_reserve_cents
        type: integer
        source: computed
        description: Bucket 3 of turn_cost_allocation, absorbs the remainder
        default: 0
      - name: status
        type: enum
        source: system
        description: Work-order state
        default: SCHEDULED
        constraints: SCHEDULED | COMPLETED
      - name: completed_at
        type: datetime
        source: system
        description: Instant the work order was completed
        default: null

  - name: AbsorptionReview
    parent: null
    common_fields: false
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; community under review
      - name: product_type
        type: enum
        source: input
        description: Product configuration under review
        constraints: DETACHED | COTTAGE | TOWNHOME
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the half-open measurement window [window_start, window_end)
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the measurement window; the span MUST be a positive whole multiple of 7 days
      - name: planned_absorption_units
        type: integer
        source: input
        description: Business-plan absorption target for the window
        constraints: ">= 1"
      - name: actual_absorption_units
        type: integer
        source: computed
        description: Count of leases for this community and product_type whose executed_at falls in [window_start, window_end) and whose lease_status IN {EXECUTED, ACTIVE, ENDING}
      - name: available_supply_units
        type: integer
        source: computed
        description: Count of homesites of this product_type in the community with status == AVAILABLE at review creation
      - name: posture_at_review
        type: enum
        source: computed
        description: Community.posture observed at review creation, an input to the pacing index
        constraints: OPEN | RESTRICTED | FROZEN
      - name: pacing_index
        type: number
        source: computed
        description: Output of absorption_pacing_index, 4 decimals
      - name: concession_tier
        type: enum
        source: computed
        description: Tier selected from pacing_index
        constraints: NONE | LIGHT | MODERATE | AGGRESSIVE
      - name: recommended_growth_bps
        type: integer
        source: computed
        description: Rent growth in basis points recommended for the next repricing
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the AssetManager who ran the review

# Community carries four independent state dimensions on one row (parallel dimensions). Each block
# below is one dimension; state names are unique across dimensions so a transition is addressable as
# state_machines.Community.<FROM>_to_<TO>.
state_machines:
  - entity: Community
    dimension: plat
    state_field: plat_status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /communities/{id}/plat-submissions"
        actor: DeveloperPrincipal
        preconditions:
          - "plat_status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "plat_status := SUBMITTED"
          - "plat_package_reference := request plat_package_reference"
          - "plat_submitted_by_user_id := X-User-ID"
          - "posture recomputed (stays FROZEN while plat_status != APPROVED)"
          - "increments Community.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /communities/{id}/plat-submissions (resubmission after a revision request)"
        actor: DeveloperPrincipal
        preconditions:
          - "plat_status == REVISION_REQUESTED"
          - "plat_revision_round <= 2"
        side_effects:
          - "plat_status := SUBMITTED"
          - "plat_submitted_by_user_id := X-User-ID"
          - "increments Community.version by 1"
        note: "Closes the revision loop; plat_revision_round is not reset by resubmission."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /communities/{id}/plat-decisions with decision == APPROVE"
        actor: EntitlementOfficer
        preconditions:
          - "plat_status == SUBMITTED"
          - "X-User-ID != community.plat_submitted_by_user_id"
          - "community.single_ownership_covenant == true"
        side_effects:
          - "plat_status := APPROVED"
          - "posture recomputed: FROZEN clears to OPEN when no housing phase is halted and amenity gate passes"
          - "increments Community.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /communities/{id}/plat-decisions with decision == REQUEST_REVISION"
        actor: EntitlementOfficer
        preconditions:
          - "plat_status == SUBMITTED"
          - "X-User-ID != community.plat_submitted_by_user_id"
          - "plat_revision_round <= 1 (a third revision request is rejected with ERR_PLAT_REVISION_LIMIT)"
        side_effects:
          - "plat_status := REVISION_REQUESTED"
          - "plat_revision_round := plat_revision_round + 1"
          - "increments Community.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /communities/{id}/plat-decisions with decision == REJECT"
        actor: EntitlementOfficer
        preconditions:
          - "plat_status == SUBMITTED"
          - "X-User-ID != community.plat_submitted_by_user_id"
        side_effects:
          - "plat_status := REJECTED (terminal)"
          - "posture := FROZEN permanently"
          - "increments Community.version by 1"

  - entity: Community
    dimension: lifecycle
    state_field: lifecycle_status
    initial_state: PLANNING
    terminal_states: []
    shape: branching_with_revert
    transitions:
      - from: PLANNING
        to: CONSTRUCTION
        trigger: "system: first POST /phases/{id}/construction-start in this community"
        actor: system
        preconditions:
          - "lifecycle_status == PLANNING"
        side_effects:
          - "lifecycle_status := CONSTRUCTION"
          - "increments Community.version by 1"
      - from: CONSTRUCTION
        to: LEASE_UP
        trigger: "system: first POST /phases/{id}/section-releases in this community"
        actor: system
        preconditions:
          - "lifecycle_status == CONSTRUCTION"
        side_effects:
          - "lifecycle_status := LEASE_UP"
          - "facility_status := ADVANCE_ELIGIBLE (from CONSTRUCTION_DRAW)"
          - "increments Community.version by 1"
      - from: LEASE_UP
        to: STABILIZED
        trigger: "system: cascade hop 3 of POST /leases/{id}/signature"
        actor: system
        preconditions:
          - "lifecycle_status == LEASE_UP"
          - "occupancy_ratio >= 0.7500 after the recompute caused by the homesite status change"
        side_effects:
          - "lifecycle_status := STABILIZED"
          - "cascade hop 4: facility_status ADVANCE_ELIGIBLE -> CONVERSION_PENDING"
          - "increments Community.version by 1"
      - from: STABILIZED
        to: LEASE_UP
        trigger: "system: cascade of POST /leases/{id}/cancellation returning the home to AVAILABLE, or cascade of POST /turn-work-orders moving the home from NOTICE_GIVEN to IN_TURN"
        actor: system
        preconditions:
          - "lifecycle_status == STABILIZED"
          - "occupancy_ratio < 0.7500 after the recompute"
        side_effects:
          - "lifecycle_status := LEASE_UP"
          - "facility_status CONVERSION_PENDING -> ADVANCE_ELIGIBLE; PERM_CONVERTED is never reverted"
          - "increments Community.version by 1"

  - entity: Community
    dimension: management
    state_field: management_mode
    initial_state: DEVELOPER_SELF_MANAGED
    terminal_states: [PM_MANAGED]
    shape: linear_scheduled
    transitions:
      - from: DEVELOPER_SELF_MANAGED
        to: PM_TRANSITION_PENDING
        trigger: "POST /communities/{id}/pm-transitions with effective_from > logical clock"
        actor: DeveloperPrincipal
        preconditions:
          - "lifecycle_status IN {LEASE_UP, STABILIZED}"
          - "occupancy_ratio >= 0.5000"
          - "posture != FROZEN"
        side_effects:
          - "management_mode := PM_TRANSITION_PENDING"
          - "pm_company_name := request pm_company_name"
          - "pm_effective_from := request effective_from"
          - "increments Community.version by 1"
      - from: PM_TRANSITION_PENDING
        to: PM_MANAGED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to or past pm_effective_from"
        actor: system
        preconditions:
          - "management_mode == PM_TRANSITION_PENDING"
          - "logical clock >= pm_effective_from"
        side_effects:
          - "management_mode := PM_MANAGED"
          - "increments Community.version by 1"
      - from: DEVELOPER_SELF_MANAGED
        to: PM_MANAGED
        trigger: "POST /communities/{id}/pm-transitions with effective_from <= logical clock"
        actor: DeveloperPrincipal
        preconditions:
          - "lifecycle_status IN {LEASE_UP, STABILIZED}"
          - "occupancy_ratio >= 0.5000"
          - "posture != FROZEN"
        side_effects:
          - "management_mode := PM_MANAGED immediately"
          - "pm_company_name, pm_effective_from set from the request"
          - "increments Community.version by 1"

  - entity: Community
    dimension: facility
    state_field: facility_status
    initial_state: CONSTRUCTION_DRAW
    terminal_states: [PERM_CONVERTED]
    shape: linear_with_revert
    transitions:
      - from: CONSTRUCTION_DRAW
        to: ADVANCE_ELIGIBLE
        trigger: "system: first section release in the community (see lifecycle CONSTRUCTION -> LEASE_UP)"
        actor: system
        preconditions: ["facility_status == CONSTRUCTION_DRAW"]
        side_effects: ["facility_status := ADVANCE_ELIGIBLE"]
      - from: ADVANCE_ELIGIBLE
        to: CONVERSION_PENDING
        trigger: "system: cascade hop 4 triggered by lifecycle_status becoming STABILIZED"
        actor: system
        preconditions: ["facility_status == ADVANCE_ELIGIBLE", "lifecycle_status == STABILIZED"]
        side_effects: ["facility_status := CONVERSION_PENDING"]
      - from: CONVERSION_PENDING
        to: PERM_CONVERTED
        trigger: "POST /communities/{id}/facility-conversions"
        actor: AssetManager
        preconditions:
          - "lifecycle_status == STABILIZED"
          - "facility_status == CONVERSION_PENDING"
          - "management_mode == PM_MANAGED"
          - "loan_to_value_bps under the TRAILING_ACTUAL basis <= 6500"
        side_effects:
          - "facility_status := PERM_CONVERTED (terminal)"
          - "increments Community.version by 1"
      - from: CONVERSION_PENDING
        to: ADVANCE_ELIGIBLE
        trigger: "system: cascade of POST /leases/{id}/cancellation that drops occupancy_ratio below 0.7500"
        actor: system
        preconditions: ["facility_status == CONVERSION_PENDING"]
        side_effects: ["facility_status := ADVANCE_ELIGIBLE"]

  - entity: Phase
    dimension: construction
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    shape: branching_cyclic
    transitions:
      - from: PLANNED
        to: UNDER_CONSTRUCTION
        trigger: "POST /phases/{id}/construction-start"
        actor: ConstructionManager
        preconditions:
          - "status == PLANNED"
          - "community.plat_status == APPROVED"
          - "community.posture != FROZEN"
          - "predecessor_phase_id IS NULL OR predecessor.status IN {SECTIONS_RELEASED, COMPLETE}"
          - "at most 1 other phase of the same community whose status IN {UNDER_CONSTRUCTION, SECTIONS_RELEASED, CONSTRUCTION_HALTED} has a construction window overlapping this phase's closed window (aggregate cap MAX_CONCURRENT_CONSTRUCTION_PHASES = 2)"
          - "every non-overlapping phase of the SAME kind in the community is separated from this window by >= 48 hours (MIN_SAME_KIND_GAP_HOURS)"
        side_effects:
          - "status := UNDER_CONSTRUCTION"
          - "community.lifecycle_status PLANNING -> CONSTRUCTION on the first start in the community"
          - "community.posture recomputed"
      - from: UNDER_CONSTRUCTION
        to: SECTIONS_RELEASED
        trigger: "POST /phases/{id}/section-releases (kind == HOUSING branch)"
        actor: ConstructionManager
        preconditions:
          - "kind == HOUSING"
          - "status == UNDER_CONSTRUCTION"
          - "community.posture != FROZEN"
          - "every homesite_id in the request belongs to this phase and has status == PLANNED"
          - "every homesite_id in the request has occupancy_certificate_issued_at != null"
          - "for every distinct product_type in the request the community has a MarketRentSchedule with status == PUBLISHED"
        side_effects:
          - "each listed homesite PLANNED -> AVAILABLE with released_at := logical clock, in request order"
          - "status := SECTIONS_RELEASED"
          - "released_homesite_count recomputed"
          - "community.released_unit_count / available_unit_count recomputed"
          - "community.lifecycle_status CONSTRUCTION -> LEASE_UP and facility_status CONSTRUCTION_DRAW -> ADVANCE_ELIGIBLE on the first release in the community"
          - "community.posture recomputed: OPEN -> RESTRICTED when amenity_delivery_ratio < 0.5000 and released_unit_count >= 1"
      - from: SECTIONS_RELEASED
        to: SECTIONS_RELEASED
        trigger: "POST /phases/{id}/section-releases (incremental release of a later section)"
        actor: ConstructionManager
        preconditions:
          - "kind == HOUSING"
          - "status == SECTIONS_RELEASED"
          - "same per-homesite and rent-schedule preconditions as the first release"
        side_effects:
          - "each listed homesite PLANNED -> AVAILABLE with released_at := logical clock"
          - "released_homesite_count, community counters and community.posture recomputed"
        note: "Self-loop: leasing of finished sections proceeds while later sections are still being built."
      - from: SECTIONS_RELEASED
        to: COMPLETE
        trigger: "POST /phases/{id}/completion (kind == HOUSING branch)"
        actor: ConstructionManager
        preconditions:
          - "kind == HOUSING"
          - "status == SECTIONS_RELEASED"
          - "released_homesite_count == planned_unit_count"
        side_effects:
          - "status := COMPLETE (terminal)"
          - "community.posture recomputed (amenity ratio unchanged by a housing completion)"
      - from: UNDER_CONSTRUCTION
        to: COMPLETE
        trigger: "POST /phases/{id}/completion (kind == AMENITY branch)"
        actor: ConstructionManager
        preconditions:
          - "kind == AMENITY"
          - "status == UNDER_CONSTRUCTION"
        side_effects:
          - "status := COMPLETE (terminal)"
          - "community.amenity_delivery_ratio recomputed upward"
          - "community.posture recomputed: RESTRICTED -> OPEN once amenity_delivery_ratio >= 0.5000"
        note: "Divergent branch: amenity completion moves the amenity gate; housing completion does not."
      - from: UNDER_CONSTRUCTION
        to: CONSTRUCTION_HALTED
        trigger: "POST /phases/{id}/halt"
        actor: ConstructionManager
        preconditions:
          - "status IN {UNDER_CONSTRUCTION, SECTIONS_RELEASED}"
        side_effects:
          - "cascade hop 0: status := CONSTRUCTION_HALTED, pre_halt_status := UNDER_CONSTRUCTION, halt_count := halt_count + 1"
          - "cascade hop 1 (caused by hop 0): community.posture recomputed -> FROZEN when kind == HOUSING, -> RESTRICTED when kind == AMENITY; each ACTIVE lease in the community accrues construction_impact_credit_cents += 7500 and community.construction_impact_credit_cents += 7500 per such lease"
          - "cascade hop 2 (caused by the posture becoming FROZEN in hop 1): every homesite of the community with status == AVAILABLE, in created_at ASC order, -> OFF_MARKET with off_market_reason := POSTURE_FREEZE"
          - "cascade hop 3 (caused by hop 2): every lease on a just-delisted homesite whose lease_status IN {DRAFT, PENDING_SIGNATURE}, in created_at ASC order, -> CANCELLED with cancellation_reason := POSTURE_FREEZE; its concession_status IN {REQUESTED, APPROVED} -> REVOKED and community.committed_concession_cents -= lease.concession_remaining_cents"
          - "cascade hop 4 (caused by hop 3): each affected ConcessionProgram.committed_cents recomputed downward and its version incremented"
      - from: SECTIONS_RELEASED
        to: CONSTRUCTION_HALTED
        trigger: "POST /phases/{id}/halt on a phase that already released sections"
        actor: ConstructionManager
        preconditions:
          - "status == SECTIONS_RELEASED"
        side_effects:
          - "identical cascade hops 0-4 as UNDER_CONSTRUCTION -> CONSTRUCTION_HALTED, with pre_halt_status := SECTIONS_RELEASED"
      - from: CONSTRUCTION_HALTED
        to: UNDER_CONSTRUCTION
        trigger: "POST /phases/{id}/resume where pre_halt_status == UNDER_CONSTRUCTION"
        actor: ConstructionManager
        preconditions:
          - "status == CONSTRUCTION_HALTED"
          - "community.plat_status == APPROVED"
        side_effects:
          - "status := pre_halt_status (UNDER_CONSTRUCTION), pre_halt_status := null"
          - "community.posture recomputed; if no housing phase of the community remains CONSTRUCTION_HALTED the freeze clears"
          - "compensation: every homesite of the community with status == OFF_MARKET and off_market_reason == POSTURE_FREEZE returns to AVAILABLE with off_market_reason := null, in created_at ASC order, only when the recomputed posture != FROZEN; released_at is never rewritten so community.released_unit_count is unchanged by halt or resume"
      - from: CONSTRUCTION_HALTED
        to: SECTIONS_RELEASED
        trigger: "POST /phases/{id}/resume where pre_halt_status == SECTIONS_RELEASED"
        actor: ConstructionManager
        preconditions:
          - "status == CONSTRUCTION_HALTED"
          - "community.plat_status == APPROVED"
        side_effects:
          - "status := SECTIONS_RELEASED, pre_halt_status := null"
          - "same posture recompute and POSTURE_FREEZE relisting compensation as the other resume branch"

  - entity: Homesite
    dimension: inventory
    state_field: status
    initial_state: PLANNED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PLANNED
        to: AVAILABLE
        trigger: "POST /phases/{id}/section-releases listing this homesite"
        actor: ConstructionManager
        preconditions:
          - "status == PLANNED"
          - "occupancy_certificate_issued_at != null"
          - "phase.status IN {UNDER_CONSTRUCTION, SECTIONS_RELEASED}"
        side_effects:
          - "status := AVAILABLE, released_at := logical clock"
          - "phase.released_homesite_count and community counters recomputed"
      - from: AVAILABLE
        to: LEASED
        trigger: "POST /leases/{id}/signature (cascade hop 1)"
        actor: system
        preconditions:
          - "status == AVAILABLE"
        side_effects:
          - "status := LEASED"
          - "cascade hop 2 (caused by this change): phase.leased_homesite_count, community.leased_unit_count and community.occupancy_ratio recomputed"
      - from: LEASED
        to: AVAILABLE
        trigger: "POST /leases/{id}/cancellation on an EXECUTED lease (compensating action)"
        actor: system
        preconditions:
          - "status == LEASED"
          - "the cancelled lease is the lease that took the home"
        side_effects:
          - "status := AVAILABLE (released_at unchanged)"
          - "phase and community occupancy counters recomputed; community.lifecycle_status may revert STABILIZED -> LEASE_UP"
      - from: LEASED
        to: NOTICE_GIVEN
        trigger: "POST /leases/{id}/notices"
        actor: Household
        preconditions:
          - "status == LEASED"
          - "lease.lease_status == ACTIVE"
        side_effects:
          - "status := NOTICE_GIVEN"
          - "community.leased_unit_count unchanged (NOTICE_GIVEN still counts as occupied)"
      - from: NOTICE_GIVEN
        to: IN_TURN
        trigger: "POST /turn-work-orders for this homesite"
        actor: PropertyManager
        preconditions:
          - "status == NOTICE_GIVEN"
        side_effects:
          - "status := IN_TURN"
          - "cascade: the ENDING lease on this homesite -> ENDED; community.leased_unit_count and occupancy_ratio recomputed"
      - from: IN_TURN
        to: AVAILABLE
        trigger: "POST /turn-work-orders/{id}/completion when no other SCHEDULED work order remains on the homesite"
        actor: PropertyManager
        preconditions:
          - "status == IN_TURN"
          - "no other TurnWorkOrder on this homesite has status == SCHEDULED"
        side_effects:
          - "status := AVAILABLE, turn_cycle_count := turn_cycle_count + 1, last_turn_ready_at := logical clock"
          - "community.available_unit_count recomputed; posture recomputed"
        note: "Closes the turn loop AVAILABLE -> LEASED -> NOTICE_GIVEN -> IN_TURN -> AVAILABLE."
      - from: AVAILABLE
        to: OFF_MARKET
        trigger: "system: posture became FROZEN (cascade hop 2 of a housing-phase halt)"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "community.posture == FROZEN"
        side_effects:
          - "status := OFF_MARKET, off_market_reason := POSTURE_FREEZE"
          - "cascade hop 3: DRAFT and PENDING_SIGNATURE leases on this homesite are cancelled"
      - from: OFF_MARKET
        to: AVAILABLE
        trigger: "system: POST /phases/{id}/resume clears the freeze"
        actor: system
        preconditions:
          - "status == OFF_MARKET"
          - "off_market_reason == POSTURE_FREEZE"
          - "recomputed community.posture != FROZEN"
        side_effects:
          - "status := AVAILABLE, off_market_reason := null"
          - "community.available_unit_count restored to its pre-halt value; released_unit_count never changed"

  - entity: Lease
    dimension: contract
    state_field: lease_status
    initial_state: DRAFT
    terminal_states: [ENDED, CANCELLED]
    shape: parallel
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /leases/{id}/submissions"
        actor: LeasingAgent
        preconditions:
          - "lease_status == DRAFT"
          - "community.posture != FROZEN"
          - "homesite.status == AVAILABLE"
        side_effects:
          - "lease_status := PENDING_SIGNATURE"
      - from: PENDING_SIGNATURE
        to: EXECUTED
        trigger: "POST /leases/{id}/signature"
        actor: Household
        preconditions:
          - "lease_status == PENDING_SIGNATURE"
          - "X-User-ID == lease.household_id"
          - "community.posture != FROZEN"
          - "if community.posture == RESTRICTED then concession_status == APPROVED and the attached ConcessionProgram.restricted_posture_eligible == true"
          - "homesite.status == AVAILABLE"
        side_effects:
          - "cascade hop 0: lease_status := EXECUTED, executed_at := logical clock, signed_by_name := the request signed_by_name"
          - "cascade hop 1 (caused by hop 0): homesite.status AVAILABLE -> LEASED"
          - "cascade hop 2 (caused by hop 1): phase.leased_homesite_count, community.leased_unit_count and community.occupancy_ratio recomputed"
          - "cascade hop 3 (caused by hop 2): community.lifecycle_status LEASE_UP -> STABILIZED when the recomputed occupancy_ratio >= 0.7500"
          - "cascade hop 4 (caused by hop 3): community.facility_status ADVANCE_ELIGIBLE -> CONVERSION_PENDING"
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /leases/{id}/activation"
        actor: PropertyManager
        preconditions:
          - "lease_status == EXECUTED"
          - "logical clock >= start_date"
        side_effects:
          - "lease_status := ACTIVE"
          - "concession_status APPROVED -> AMORTIZING when a concession is attached"
          - "when community.posture IN {RESTRICTED, FROZEN}: construction_impact_credit_cents += 7500 on this lease and on community.construction_impact_credit_cents"
      - from: ACTIVE
        to: ENDING
        trigger: "POST /leases/{id}/notices"
        actor: Household
        preconditions:
          - "lease_status == ACTIVE"
          - "X-User-ID == lease.household_id"
          - "request move_out_date > request notice_date"
        side_effects:
          - "lease_status := ENDING, notice_date and move_out_date recorded"
          - "homesite.status LEASED -> NOTICE_GIVEN"
      - from: ENDING
        to: ENDED
        trigger: "system: POST /turn-work-orders opened on the homesite (move-out)"
        actor: system
        preconditions:
          - "lease_status == ENDING"
          - "homesite.status becomes IN_TURN"
        side_effects:
          - "lease_status := ENDED (terminal)"
          - "community.leased_unit_count and occupancy_ratio recomputed; lifecycle_status may revert STABILIZED -> LEASE_UP"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /leases/{id}/cancellation, or cascade hop 3 of a housing-phase halt"
        actor: AssetManager
        preconditions:
          - "lease_status IN {DRAFT, PENDING_SIGNATURE, EXECUTED}"
        side_effects:
          - "lease_status := CANCELLED (terminal), cancellation_reason recorded"
          - "concession_status IN {REQUESTED, APPROVED, AMORTIZING} -> REVOKED; community.committed_concession_cents -= concession_remaining_cents; program.committed_cents -= concession_remaining_cents"
      - from: PENDING_SIGNATURE
        to: CANCELLED
        trigger: "POST /leases/{id}/cancellation, or cascade hop 3 of a housing-phase halt"
        actor: AssetManager
        preconditions:
          - "lease_status == PENDING_SIGNATURE"
        side_effects:
          - "same as DRAFT -> CANCELLED"
      - from: EXECUTED
        to: CANCELLED
        trigger: "POST /leases/{id}/cancellation"
        actor: AssetManager
        preconditions:
          - "lease_status == EXECUTED"
        side_effects:
          - "same concession compensation as DRAFT -> CANCELLED"
          - "homesite.status LEASED -> AVAILABLE; community occupancy counters recomputed; lifecycle_status may revert STABILIZED -> LEASE_UP and facility_status CONVERSION_PENDING -> ADVANCE_ELIGIBLE"

  - entity: Lease
    dimension: concession
    state_field: concession_status
    initial_state: NONE
    terminal_states: [EXHAUSTED]
    shape: cyclic
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /leases/{id}/concession-requests"
        actor: LeasingAgent
        preconditions:
          - "concession_status IN {NONE, REJECTED, REVOKED}"
          - "lease_status IN {DRAFT, PENDING_SIGNATURE}"
          - "the referenced ConcessionProgram has status == ACTIVE and belongs to the lease's community"
        side_effects:
          - "concession_status := REQUESTED, concession_program_id and concession_requested_by_user_id set"
          - "total_concession_cents, concession_schedule, monthly_concession_credit_cents, first_period_charge_cents, net_effective_rent_cents and concession_remaining_cents computed by concession_amortization"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /leases/{id}/concession-requests after a rejection (re-request loop)"
        actor: LeasingAgent
        preconditions:
          - "concession_status == REJECTED"
          - "lease_status IN {DRAFT, PENDING_SIGNATURE}"
        side_effects:
          - "same as NONE -> REQUESTED; concession_decided_by_user_id reset to null"
      - from: REVOKED
        to: REQUESTED
        trigger: "POST /leases/{id}/concession-requests after a revocation"
        actor: LeasingAgent
        preconditions:
          - "concession_status == REVOKED"
          - "lease_status IN {DRAFT, PENDING_SIGNATURE}"
        side_effects:
          - "same as NONE -> REQUESTED"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /leases/{id}/concession-decisions with decision == APPROVE"
        actor: AssetManager
        preconditions:
          - "concession_status == REQUESTED"
          - "X-User-ID != concession_requested_by_user_id"
          - "program.committed_cents + total_concession_cents <= program.max_budget_cents"
          - "community.committed_concession_cents + total_concession_cents <= community.concession_budget_cents"
        side_effects:
          - "concession_status := APPROVED, concession_decided_by_user_id := X-User-ID"
          - "community.committed_concession_cents += total_concession_cents"
          - "program.committed_cents += total_concession_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /leases/{id}/concession-decisions with decision == REJECT"
        actor: AssetManager
        preconditions:
          - "concession_status == REQUESTED"
          - "X-User-ID != concession_requested_by_user_id"
        side_effects:
          - "concession_status := REJECTED, concession_decided_by_user_id := X-User-ID"
          - "total_concession_cents, concession_schedule, monthly_concession_credit_cents, first_period_charge_cents and concession_remaining_cents reset to 0 / []"
      - from: APPROVED
        to: AMORTIZING
        trigger: "POST /leases/{id}/activation"
        actor: PropertyManager
        preconditions:
          - "concession_status == APPROVED"
          - "lease_status becomes ACTIVE in the same request"
        side_effects:
          - "concession_status := AMORTIZING"
      - from: AMORTIZING
        to: EXHAUSTED
        trigger: "POST /leases/{id}/concession-credit-applications that consumes the last scheduled period"
        actor: PropertyManager
        preconditions:
          - "concession_status == AMORTIZING"
          - "concession_remaining_cents becomes 0 after this application"
        side_effects:
          - "concession_status := EXHAUSTED (terminal)"
          - "community.committed_concession_cents and program.committed_cents both reach 0 contribution from this lease"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /leases/{id}/cancellation, or cascade hop 3 of a housing-phase halt"
        actor: AssetManager
        preconditions:
          - "concession_status IN {REQUESTED, APPROVED}"
        side_effects:
          - "concession_status := REVOKED"
          - "community.committed_concession_cents -= concession_remaining_cents and program.committed_cents -= concession_remaining_cents (the applied portion is never clawed back)"

  - entity: TurnWorkOrder
    dimension: work
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    shape: linear
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /turn-work-orders/{id}/completion"
        actor: PropertyManager
        preconditions:
          - "status == SCHEDULED"
          - "logical clock >= window_start"
        side_effects:
          - "status := COMPLETED, completed_at := logical clock"
          - "labor_cost_cents, total_turn_cost_cents and the three turn_cost_allocation buckets recomputed against the recoverable cap in force at completion"
          - "when no other SCHEDULED work order remains on the homesite: homesite IN_TURN -> AVAILABLE, turn_cycle_count += 1, community counters and posture recomputed"

concurrency_rules:
  - rule_id: concession-program-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /concession-programs"
    occ_field: "expected_community_version"
    description: |
      Creating a ConcessionProgram against a Community whose version has advanced since the client
      last read it is rejected. The new program legitimately supersedes the community's current
      ACTIVE program, so a writer holding a stale view would retire a program it never observed and
      publish a tier derived from an absorption review it never saw.
    error_id: ERR_STALE_COMMUNITY_VERSION
    http_status: 412
  - rule_id: rent-schedule-publish-stale-community
    parent_entity: Community
    write_endpoint: "POST /market-rent-schedules"
    occ_field: "expected_community_version"
    description: |
      Publishing a MarketRentSchedule against a Community whose version has advanced since the
      client last read it is rejected. Publication supersedes the prior PUBLISHED schedule for the
      same product type, and an ABSORPTION_INDEXED publication derives its asking rent from the
      prior schedule, so a stale view silently reprices from a superseded baseline.
    error_id: ERR_STALE_COMMUNITY_VERSION
    http_status: 412

calculations:
  - name: base_rent_selection
    trigger: "POST /leases — freezes Lease.base_rent_cents and Lease.priced_by_schedule_id at creation"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter
      candidates = MarketRentSchedule where
                     community_id == homesite.phase.community_id
                     AND product_type == homesite.product_type
                     AND status == 'PUBLISHED'
                     AND effective_from <= lease.start_date
      # (b) ranking expression
      rank by effective_from DESC
      # (c) tie-break when two schedules share effective_from
      then by created_at DESC
      # (d) empty-candidate fallback
      if candidates is empty: reject with ERR_NO_PUBLISHED_RENT_SCHEDULE (409)
      base_rent_cents = winner.asking_rent_cents
      priced_by_schedule_id = winner.id
    input_set: "Only PUBLISHED schedules; SUPERSEDED schedules are excluded even when their effective_from is later."
    constants: {}
    precision: "integer cents"

  - name: community_services_fee
    trigger: "POST /leases — sets Lease.community_services_fee_cents and Lease.gross_monthly_charge_cents"
    algorithm: tiered_pricing
    formula: |
      # Mode (c) combinatorial case: the fee is a component of the gross charge, and the fee tier
      # LOOKS like it should be keyed on the gross charge — which would be circular. Evaluation
      # order is pinned as 1 -> 2 -> 3 -> 4 and MUST NOT be iterated to a fixed point.
      # 1. base_rent_cents comes from base_rent_selection
      # 2. tier is selected from base_rent_cents ALONE (never from gross_monthly_charge_cents)
      if   base_rent_cents <  200000: rate_bps = 350
      elif base_rent_cents <  320000: rate_bps = 300
      else:                           rate_bps = 250
      # 3. fee
      community_services_fee_cents = round_half_up(base_rent_cents * rate_bps / 10000)
                                     + PRODUCT_SURCHARGE_CENTS[homesite.product_type]
      # 4. gross, computed last and never fed back into step 2
      gross_monthly_charge_cents = base_rent_cents + community_services_fee_cents
    input_set: "The single Lease under creation; the homesite's product_type supplies the surcharge."
    constants:
      SERVICES_RATE_BPS_LOW: 350
      SERVICES_RATE_BPS_MID: 300
      SERVICES_RATE_BPS_HIGH: 250
      SERVICES_TIER_BREAK_1_CENTS: 200000
      SERVICES_TIER_BREAK_2_CENTS: 320000
      PRODUCT_SURCHARGE_CENTS: { DETACHED: 4500, COTTAGE: 3000, TOWNHOME: 2000 }
    precision: "integer cents, round_half_up"
    note: "Boundary is inclusive-lower/exclusive-upper: base_rent_cents == 200000 uses 300 bps, 199999 uses 350 bps."

  - name: concession_amortization
    trigger: "POST /leases/{id}/concession-requests — sets Lease.total_concession_cents, concession_schedule, monthly_concession_credit_cents, first_period_charge_cents, net_effective_rent_cents, concession_remaining_cents"
    algorithm: waterfall_allocation
    formula: |
      # Mode (b) combinatorial case: rounding order is pinned. The concession is rounded ONCE at the
      # total, then the per-period credit is rounded, and the FINAL period absorbs the residual so
      # that sum(schedule) == total_concession_cents exactly. Rounding every period independently
      # and summing (or summing exact per-period values and rounding at the end) is WRONG.
      total_concession_cents =
          round_half_up(gross_monthly_charge_cents * program.free_weeks * 12 / 52)
      if program.amortization_mode == 'STRAIGHT_LINE_NET_EFFECTIVE':
          per_period = round_half_up(total_concession_cents / lease.term_months)
          schedule   = [per_period] * (term_months - 1)
                       + [total_concession_cents - per_period * (term_months - 1)]   # residual period
      else:   # UPFRONT_FREE_RENT
          schedule = []
          remaining = total_concession_cents
          while remaining > 0:                       # ordered buckets of one month of gross charge
              credit = min(gross_monthly_charge_cents, remaining)
              schedule.append(credit)
              remaining -= credit
      concession_schedule            = [{period_index: i+1, credit_cents: schedule[i]}]
      monthly_concession_credit_cents = schedule[0] if schedule else 0
      first_period_charge_cents       = max(0, gross_monthly_charge_cents - monthly_concession_credit_cents)
      net_effective_rent_cents        = round_half_up(
          (gross_monthly_charge_cents * term_months - total_concession_cents) / term_months)
      concession_remaining_cents      = total_concession_cents
      concession_applied_cents        = 0
    input_set: "The lease's own gross_monthly_charge_cents and term_months plus the ACTIVE program's free_weeks and amortization_mode. No other lease participates."
    constants:
      WEEKS_PER_MONTH_NUMERATOR: 12
      WEEKS_PER_MONTH_DENOMINATOR: 52
    precision: "integer cents, round_half_up; sum(concession_schedule.credit_cents) == total_concession_cents exactly"
    variants:
      - name: STRAIGHT_LINE_NET_EFFECTIVE
        when: "program.amortization_mode == 'STRAIGHT_LINE_NET_EFFECTIVE'"
        difference: "term_months periods of an equal credit with the residual in the last period; monthly_concession_credit_cents is small and first_period_charge_cents stays close to gross."
      - name: UPFRONT_FREE_RENT
        when: "program.amortization_mode == 'UPFRONT_FREE_RENT'"
        difference: "ceil(total / gross) periods that consume a whole month of gross charge each until the concession is exhausted; monthly_concession_credit_cents equals a full month of gross and first_period_charge_cents is 0."

  - name: concession_credit_application
    trigger: "POST /leases/{id}/concession-credit-applications — advances the ledger and preserves the concession invariant"
    algorithm: aggregation
    formula: |
      credit = concession_schedule[period_index - 1].credit_cents
      lease.concession_applied_cents   += credit
      lease.concession_remaining_cents  = total_concession_cents - concession_applied_cents
      lease.credits_applied_count      += 1
      community.committed_concession_cents -= credit
      program.committed_cents              -= credit
      # invariant that MUST hold after every forward and compensating action:
      # community.committed_concession_cents ==
      #     SUM(lease.concession_remaining_cents) over leases of the community
      #     whose concession_status IN {APPROVED, AMORTIZING}
    input_set: "Exactly one scheduled period per request, applied strictly in ascending period_index order."
    constants: {}
    precision: "integer cents; no rounding occurs at application time"

  - name: absorption_pacing_index
    trigger: "POST /communities/{id}/absorption-reviews — sets AbsorptionReview.pacing_index, concession_tier, recommended_growth_bps"
    algorithm: weighted_scoring
    formula: |
      # Mode (a) combinatorial case: four inputs interacting non-linearly through a clamped ratio
      # and a branch on the community's derived posture.
      actual_absorption_units = COUNT(Lease L where
            L.homesite.phase.community_id == community.id
        AND L.homesite.product_type == review.product_type
        AND L.executed_at >= window_start AND L.executed_at < window_end     # half-open
        AND L.lease_status IN {EXECUTED, ACTIVE, ENDING})
      available_supply_units  = COUNT(Homesite H where H.phase.community_id == community.id
                                      AND H.product_type == review.product_type
                                      AND H.status == 'AVAILABLE')
      posture_at_review = community.posture
      if actual_absorption_units == 0:
          pacing_index = 0.0000                     # empty-absorption rule, no division attempted
      else:
          raw_pace      = actual_absorption_units / planned_absorption_units
          supply_factor = min(1.25, max(0.75, available_supply_units / max(1, planned_absorption_units)))
          posture_penalty = 0.90 if posture_at_review == 'RESTRICTED' else 1.00
          pacing_index  = round_half_up(raw_pace * supply_factor * posture_penalty, 4)
      # tier + growth selection, inclusive lower bounds
      if   pacing_index >= 1.2000: concession_tier, recommended_growth_bps = 'NONE',       250
      elif pacing_index >= 1.0000: concession_tier, recommended_growth_bps = 'LIGHT',      125
      elif pacing_index >= 0.8000: concession_tier, recommended_growth_bps = 'MODERATE',     0
      else:                        concession_tier, recommended_growth_bps = 'AGGRESSIVE', -150
    input_set: "Leases whose executed_at falls inside the half-open window and whose lease_status IN {EXECUTED, ACTIVE, ENDING}; CANCELLED and ENDED leases never count. Supply is measured at review creation, not at window_end."
    constants:
      SUPPLY_FACTOR_FLOOR: 0.75
      SUPPLY_FACTOR_CEILING: 1.25
      RESTRICTED_POSTURE_PENALTY: 0.90
      TIER_BREAK_NONE: 1.2000
      TIER_BREAK_LIGHT: 1.0000
      TIER_BREAK_MODERATE: 0.8000
    precision: "pacing_index at 4 decimals, round_half_up; boundaries are >= (1.0000 is LIGHT, 0.9999 is MODERATE)"

  - name: rent_growth_repricing
    trigger: "POST /market-rent-schedules with repricing_mode == ABSORPTION_INDEXED — sets MarketRentSchedule.asking_rent_cents and applied_growth_bps"
    algorithm: threshold
    formula: |
      baseline = the MarketRentSchedule of (community_id, product_type) ranked by
                 effective_from DESC, then created_at DESC
                 (none exists at all -> ERR_RENT_SCHEDULE_NOT_FOUND)
      if baseline.status != 'PUBLISHED': reject with ERR_SCHEDULE_ALREADY_SUPERSEDED (409)
              # An out-of-order MANUAL publication can leave the latest-dated schedule
              # SUPERSEDED while an earlier-dated one is PUBLISHED; indexing off that
              # stale baseline is refused rather than silently repriced.
      prior = baseline
      review = AbsorptionReview of (community_id, product_type) ranked by window_end DESC,
               then created_at DESC (absent -> ERR_ABSORPTION_REVIEW_NOT_FOUND)
      bps  = review.recommended_growth_bps
      step = round_half_up(prior.asking_rent_cents * bps / 10000)
      step = max(-MAX_STEP_CENTS, min(MAX_STEP_CENTS, step))
      asking_rent_cents = prior.asking_rent_cents + step
      applied_growth_bps = bps
      if asking_rent_cents < 1: reject with ERR_INVALID_REQUEST
    input_set: "The latest-dated schedule for the (community, product_type) — which must be the PUBLISHED one — and the latest absorption review for the same pair."
    constants:
      MAX_STEP_CENTS: 20000
    precision: "integer cents, round_half_up applied to the step before clamping"

  - name: community_posture
    trigger: "system: recomputed at the end of every request that mutates the community, any of its phases, homesites or leases"
    algorithm: constraint_propagation
    formula: |
      if community.plat_status != 'APPROVED'
         OR community.single_ownership_covenant == false
         OR EXISTS Phase p (p.community_id == community.id AND p.kind == 'HOUSING'
                            AND p.status == 'CONSTRUCTION_HALTED'):
          posture = 'FROZEN'
      elif (community.released_unit_count >= 1 AND community.amenity_delivery_ratio < 0.5000)
           OR EXISTS Phase p (p.community_id == community.id AND p.kind == 'AMENITY'
                              AND p.status == 'CONSTRUCTION_HALTED'):
          posture = 'RESTRICTED'
      else:
          posture = 'OPEN'
      # aggregates feeding the decision
      released_unit_count   = COUNT(Homesite H of community WHERE H.released_at IS NOT NULL)
      available_unit_count  = COUNT(Homesite H of community WHERE H.status == 'AVAILABLE')
      leased_unit_count     = COUNT(Homesite H of community WHERE H.status IN {'LEASED','NOTICE_GIVEN'})
      occupancy_ratio       = round_half_up(leased_unit_count / total_planned_units, 4)
      amenity_delivery_ratio = 1.0000 if no AMENITY phase exists for the community else
          round_half_up(SUM(p.amenity_weight WHERE p.kind=='AMENITY' AND p.status=='COMPLETE')
                        / SUM(p.amenity_weight WHERE p.kind=='AMENITY'), 4)
    input_set: "All phases and homesites of the community regardless of phase status; leases do not feed posture directly."
    constants:
      AMENITY_GATE_RATIO: 0.5000
      STABILIZATION_OCCUPANCY_RATIO: 0.7500
    precision: "ratios at 4 decimals, round_half_up; the amenity gate is a strict < comparison"

  - name: stabilized_valuation
    trigger: "GET /communities/{id}/valuation — computes the basis-specific value and loan_to_value_bps"
    algorithm: forward_looking
    formula: |
      if basis == 'TRAILING_ACTUAL':
          in_place_monthly_cents = SUM(L.gross_monthly_charge_cents - L.monthly_concession_credit_cents)
                                   over leases of the community with lease_status == 'ACTIVE'
          pro_forma_monthly_cents = 0
          annual_gross_cents = (in_place_monthly_cents + pro_forma_monthly_cents) * 12
          vacancy_deduction_cents = 0                        # actuals carry their own vacancy
          egi_cents = annual_gross_cents - community.construction_impact_credit_cents
      else:   # FORWARD_STABILIZED
          in_place_monthly_cents = SUM(L.gross_monthly_charge_cents)
                                   over leases with lease_status IN {'EXECUTED','ACTIVE'}
                                   (concession credits are NOT deducted on this basis)
          blended_market_rent_cents = round_half_up(
              SUM over product types T with product_mix[T] > 0 of
                  product_mix[T] * latest_published_asking_rent_cents(T)
              / total_planned_units)
              # latest_published_asking_rent_cents(T) = asking_rent_cents of the (community, T)
              # schedule with status == 'PUBLISHED'; if any T with product_mix[T] > 0 has none,
              # reject with ERR_NO_PUBLISHED_RENT_SCHEDULE
          pro_forma_monthly_cents = (total_planned_units - leased_unit_count) * blended_market_rent_cents
          annual_gross_cents = (in_place_monthly_cents + pro_forma_monthly_cents) * 12
          vacancy_deduction_cents = round_half_up(annual_gross_cents * STABILIZED_VACANCY_BPS / 10000)
          egi_cents = annual_gross_cents - vacancy_deduction_cents
      opex_cents = round_half_up(egi_cents * OPEX_RATIO_BPS / 10000)
      noi_cents  = egi_cents - opex_cents
      value_cents = round_half_up(noi_cents * 10000 / CAP_RATE_BPS)
      loan_to_value_bps = round_half_up(community.facility_commitment_cents * 10000 / value_cents)
    input_set: "TRAILING_ACTUAL sees only ACTIVE leases and subtracts community construction-impact credits; FORWARD_STABILIZED sees EXECUTED and ACTIVE leases at unburdened gross plus pro-forma rent for every unleased planned unit."
    constants:
      CAP_RATE_BPS: 525
      STABILIZED_VACANCY_BPS: 500
      OPEX_RATIO_BPS: 3400
      MAX_LTV_BPS: 6500
    precision: "integer cents, round_half_up at each named step in the order written; no intermediate truncation"
    variants:
      - name: TRAILING_ACTUAL
        when: "basis == 'TRAILING_ACTUAL'; also the basis the facility covenant is tested against"
        difference: "Concession-burdened, in-place only, zero pro-forma and zero vacancy deduction, minus resident-experience credits — the conservative lender view."
      - name: FORWARD_STABILIZED
        when: "basis == 'FORWARD_STABILIZED'"
        difference: "Unburdened gross for EXECUTED plus ACTIVE leases, pro-forma market rent for every unleased planned unit, and a 5% stabilized vacancy deduction — the sponsor view; produces a materially higher value from identical stored data."

  - name: turn_cost_allocation
    trigger: "POST /turn-work-orders and POST /turn-work-orders/{id}/completion — set labor_cost_cents, total_turn_cost_cents and the three buckets"
    algorithm: waterfall_allocation
    formula: |
      window_hours = (window_end - window_start) / 1 hour        # MUST be a positive whole number
      labor_cost_cents = tech_count * window_hours * SCOPE_RATE_CENTS_PER_HOUR[scope]
      total_turn_cost_cents = labor_cost_cents + material_cost_cents
      # ordered buckets; each fills before the next receives anything
      last_lease = the lease of this homesite with lease_status IN {'ENDING','ENDED'} ranked by
                   executed_at DESC, then created_at DESC; recoverable_cap = 0 when none exists
      recoverable_cap        = last_lease.gross_monthly_charge_cents
      tenant_recoverable_cents = min(total_turn_cost_cents, recoverable_cap)
      remainder              = total_turn_cost_cents - tenant_recoverable_cents
      community_opex_cents   = min(remainder, TURN_OPEX_CAP_CENTS)
      capital_reserve_cents  = remainder - community_opex_cents      # absorbs everything left
      # invariant: tenant_recoverable_cents + community_opex_cents + capital_reserve_cents
      #            == total_turn_cost_cents
    input_set: "One work order at a time; the recoverable cap comes from the most recent ENDING/ENDED lease on the same homesite."
    constants:
      SCOPE_RATE_CENTS_PER_HOUR: { MAKE_READY: 6500, DETACHED_YARD_RESTORE: 8000, MAJOR_REHAB: 11000 }
      TURN_OPEX_CAP_CENTS: 80000
    precision: "integer cents; no rounding is required because every factor is an integer"
  - name: construction_impact_credit
    trigger: "POST /leases/{id}/activation — sets Lease.construction_impact_credit_cents and Community.construction_impact_credit_cents"
    algorithm: aggregation
    formula: |
      # Resident experience during ongoing construction: a household that moves in while the
      # community is not OPEN earns a one-time monthly-charge credit that also reduces the
      # community's TRAILING_ACTUAL effective gross income.
      if community.posture IN {'RESTRICTED', 'FROZEN'}:
          lease.construction_impact_credit_cents      += CONSTRUCTION_IMPACT_CREDIT_CENTS
          community.construction_impact_credit_cents  += CONSTRUCTION_IMPACT_CREDIT_CENTS
      else:
          no credit accrues and both fields keep their prior values
    input_set: "The community's posture at the instant of activation only; later posture changes never retroactively grant or remove a credit."
    constants:
      CONSTRUCTION_IMPACT_CREDIT_CENTS: 7500
    precision: "integer cents; no rounding"


validations:
  - priority: 10
    rule: "The X-User-Role header is present and names a role in the catalog; when the role is Household the X-User-ID header is also present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint"
  - priority: 20
    rule: "The caller's role is permitted to invoke this endpoint per the RBAC table."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: authz
    applies_to: "every endpoint"
  - priority: 22
    rule: "A Household caller may only read or act on a Lease whose household_id equals its own X-User-ID."
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    category: authz
    applies_to: "GET /leases/{id}, POST /leases/{id}/signature, POST /leases/{id}/notices"
  - priority: 25
    rule: "The X-User-ID that requested a concession (Lease.concession_requested_by_user_id) must not be the X-User-ID that decides it; the X-User-ID that submitted a plat (Community.plat_submitted_by_user_id) must not be the X-User-ID that decides it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: authz
    applies_to: "POST /leases/{id}/concession-decisions, POST /communities/{id}/plat-decisions"
  - priority: 30
    rule: "The path {id} resolves to an existing entity of the addressed collection."
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_HOMESITE_NOT_FOUND | ERR_RENT_SCHEDULE_NOT_FOUND | ERR_CONCESSION_PROGRAM_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_TURN_WORK_ORDER_NOT_FOUND | ERR_ABSORPTION_REVIEW_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every endpoint with a path parameter"
  - priority: 32
    rule: "Every foreign key in the request body resolves to an existing parent entity."
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_HOMESITE_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_CONCESSION_PROGRAM_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "POST /phases, POST /homesites, POST /market-rent-schedules, POST /concession-programs, POST /leases, POST /turn-work-orders"
  - priority: 35
    rule: "The request body parses, every required field is present and non-null, every enum value is a declared member, every *_cents and *_count field is a non-negative integer (recommended_growth_bps and applied_growth_bps may be negative), every *_at field is an RFC 3339 UTC instant, term_months is one of 12, 18 or 24, free_weeks is between 0 and 12 inclusive, and the phase product_mix keys are a subset of {DETACHED, COTTAGE, TOWNHOME}."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: schema
    applies_to: "every POST endpoint"
  - priority: 38
    rule: "When the endpoint carries expected_community_version, the submitted value equals the parent Community's current version."
    error_id: ERR_STALE_COMMUNITY_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /market-rent-schedules, POST /concession-programs"
  - priority: 40
    rule: "The addressed entity is in a state from which the requested transition is declared in §1.2."
    error_id: "ERR_INVALID_PLAT_STATE | ERR_INVALID_PHASE_STATE | ERR_INVALID_HOMESITE_STATE | ERR_INVALID_LEASE_STATE | ERR_INVALID_CONCESSION_STATE | ERR_INVALID_TURN_STATE | ERR_INVALID_LIFECYCLE_STATE | ERR_INVALID_FACILITY_STATE | ERR_INVALID_MANAGEMENT_STATE | ERR_SCHEDULE_ALREADY_SUPERSEDED"
    http_status: 409
    category: state
    applies_to: "every transition endpoint"
  - priority: 45
    rule: "When the owning Community's derived posture is FROZEN, no leasing, pricing, concession or release write may proceed; when the posture is RESTRICTED, lease submission and signature are still allowed but concession programs may not be created and section releases are blocked."
    error_id: ERR_COMMUNITY_POSTURE_FROZEN
    http_status: 409
    category: state
    applies_to: "POST /phases/{id}/section-releases, POST /market-rent-schedules, POST /concession-programs, POST /leases, POST /leases/{id}/submissions, POST /leases/{id}/signature"
  - priority: 46
    rule: "When the owning Community's derived posture is RESTRICTED, POST /concession-programs and POST /phases/{id}/section-releases are rejected."
    error_id: ERR_COMMUNITY_POSTURE_RESTRICTED
    http_status: 409
    category: state
    applies_to: "POST /concession-programs, POST /phases/{id}/section-releases"
  - priority: 50
    rule: "A Lease may only be created against a Homesite whose status is AVAILABLE and whose Phase status is SECTIONS_RELEASED or COMPLETE; the Homesite's Community lifecycle_status must be LEASE_UP or STABILIZED."
    error_id: ERR_HOMESITE_NOT_LEASABLE
    http_status: 409
    category: cross_entity_state
    applies_to: "POST /leases"
  - priority: 51
    rule: "A concession request may only be raised against a Lease whose lease_status is DRAFT or PENDING_SIGNATURE and whose ConcessionProgram.status is ACTIVE."
    error_id: ERR_CONCESSION_PROGRAM_NOT_ACTIVE
    http_status: 409
    category: cross_entity_state
    applies_to: "POST /leases/{id}/concession-requests"
  - priority: 52
    rule: "A turn work order may only be opened on a Homesite whose status is NOTICE_GIVEN or IN_TURN."
    error_id: ERR_HOMESITE_NOT_IN_TURN
    http_status: 409
    category: cross_entity_state
    applies_to: "POST /turn-work-orders"
  - priority: 55
    rule: "A Homesite may not be released for leasing unless its occupancy_certificate_issued_at is set and its own status is PLANNED; the Phase must be in status UNDER_CONSTRUCTION or SECTIONS_RELEASED."
    error_id: ERR_OCCUPANCY_CERTIFICATE_REQUIRED
    http_status: 409
    category: business_safety
    applies_to: "POST /phases/{id}/section-releases"
  - priority: 56
    rule: "A plat may not be approved while Community.single_ownership_covenant is false — platting must preserve single-ownership operation of the whole community."
    error_id: ERR_SINGLE_OWNERSHIP_COVENANT_REQUIRED
    http_status: 409
    category: business_safety
    applies_to: "POST /communities/{id}/plat-decisions"
  - priority: 57
    rule: "Property-management transition may not be scheduled unless the Community lifecycle_status is LEASE_UP or STABILIZED and maintenance_tech_headcount >= 1."
    error_id: ERR_MAINTENANCE_STAFFING_REQUIRED
    http_status: 409
    category: business_safety
    applies_to: "POST /communities/{id}/pm-transitions"
  - priority: 58
    rule: "Property-management transition may not be scheduled unless Community.occupancy_ratio is at least PM_TRANSITION_OCCUPANCY_RATIO = 0.5000."
    error_id: ERR_LEASE_UP_THRESHOLD_NOT_MET
    http_status: 409
    category: business_safety
    applies_to: "POST /communities/{id}/pm-transitions"
  - priority: 59
    rule: "A third REQUEST_REVISION decision on the same plat is refused: the decision is rejected once plat_revision_round has already reached MAX_PLAT_REVISION_ROUNDS = 2."
    error_id: ERR_PLAT_REVISION_LIMIT
    http_status: 409
    category: business_constraint
    applies_to: "POST /communities/{id}/plat-decisions"
  - priority: 60
    rule: "(community_id, product_type, effective_from) is unique across MarketRentSchedule; (phase_id, lot_number) is unique across Homesite; (name, market_code) is unique across Community."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    category: business_constraint
    applies_to: "POST /communities, POST /homesites, POST /market-rent-schedules"
  - priority: 61
    rule: "A Household may hold at most one Lease with lease_status IN {DRAFT, PENDING_SIGNATURE, EXECUTED, ACTIVE} across the whole system."
    error_id: ERR_HOUSEHOLD_ALREADY_LEASED
    http_status: 409
    category: business_constraint
    applies_to: "POST /leases"
  - priority: 62
    rule: "A Homesite's product_type must be a key of its Community's product_mix whose planned count is >= 1, the count of homesites of that product_type across the community must not exceed that planned count, and the count of homesites in the phase must not exceed the phase's planned_unit_count."
    error_id: ERR_PRODUCT_MIX_EXCEEDED
    http_status: 409
    category: business_constraint
    applies_to: "POST /homesites"
  - priority: 63
    rule: "A Phase may not name itself as predecessor_phase_id, and the predecessor must belong to the same Community."
    error_id: ERR_INVALID_PHASE_PREDECESSOR
    http_status: 409
    category: business_constraint
    applies_to: "POST /phases"
  - priority: 64
    rule: "Two turn work orders for the same Homesite may not have overlapping [window_start, window_end) windows; windows are half-open so one ending exactly when the next begins is allowed."
    error_id: ERR_TURN_WINDOW_OVERLAP
    http_status: 409
    category: business_temporal
    applies_to: "POST /turn-work-orders"
  - priority: 65
    rule: "A Phase may not start construction while its predecessor_phase_id phase is not in status SECTIONS_RELEASED or COMPLETE, and no more than MAX_CONCURRENT_CONSTRUCTION_PHASES = 2 phases of the community may have overlapping construction windows while in status UNDER_CONSTRUCTION, SECTIONS_RELEASED or CONSTRUCTION_HALTED."
    error_id: ERR_PHASE_CONCURRENCY_LIMIT
    http_status: 409
    category: business_temporal
    applies_to: "POST /phases/{id}/construction-start"
  - priority: 66
    rule: "window_start must be strictly before window_end, window_end - window_start must be a positive whole number of hours not exceeding 240, and window_start must be at or after the logical clock's current instant."
    error_id: ERR_INVALID_TURN_WINDOW
    http_status: 409
    category: business_temporal
    applies_to: "POST /turn-work-orders"
  - priority: 67
    rule: "A new turn work order of the same scope on the same Homesite may not begin within TURN_REWORK_BUFFER_HOURS = 48 of a prior order's window_end for that scope."
    error_id: ERR_TURN_REWORK_BUFFER
    http_status: 409
    category: business_temporal
    applies_to: "POST /turn-work-orders"
  - priority: 68
    rule: "The absorption review window must be half-open with window_start strictly before window_end, and window_end must not be after the logical clock's current instant."
    error_id: ERR_INVALID_REVIEW_WINDOW
    http_status: 409
    category: business_temporal
    applies_to: "POST /communities/{id}/absorption-reviews"
  - priority: 69
    rule: "The logical clock may only move forward: the submitted current_utc must be strictly after the stored clock value."
    error_id: ERR_CLOCK_REWIND
    http_status: 409
    category: business_temporal
    applies_to: "POST /_clock/set_current_utc"
  - priority: 69.5
    rule: "Two phases of the same Community with the same kind whose construction windows do not overlap must still be separated by at least MIN_SAME_KIND_GAP_HOURS = 48; a gap of exactly 48 hours is allowed."
    error_id: ERR_PHASE_GAP_VIOLATION
    http_status: 409
    category: business_temporal
    applies_to: "POST /phases/{id}/construction-start"
  - priority: 70
    rule: "The sum of open turn work orders assigned across a Community must not require more technicians than Community.maintenance_tech_headcount at any hour covered by the requested window."
    error_id: ERR_TURN_CAPACITY_EXCEEDED
    http_status: 409
    category: aggregate_capacity
    applies_to: "POST /turn-work-orders"
  - priority: 72
    rule: "A Lease requires exactly one eligible PUBLISHED MarketRentSchedule for its community and the homesite's product_type effective on or before the lease start_date."
    error_id: ERR_NO_PUBLISHED_RENT_SCHEDULE
    http_status: 409
    category: business_referential
    applies_to: "POST /leases, GET /communities/{id}/valuation"
  - priority: 73
    rule: "A ConcessionProgram may only be attached to a Lease whose homesite product_type is listed in the program's eligible_product_types."
    error_id: ERR_PRODUCT_TYPE_NOT_ELIGIBLE
    http_status: 409
    category: business_referential
    applies_to: "POST /leases/{id}/concession-requests"
  - priority: 74
    rule: "A concession credit may only be applied for the next unapplied period_index, i.e. period_index must equal credits_applied_count + 1 and must not exceed the length of concession_schedule."
    error_id: ERR_CONCESSION_PERIOD_OUT_OF_ORDER
    http_status: 409
    category: business_referential
    applies_to: "POST /leases/{id}/concession-credit-applications"
  - priority: 80
    rule: "Approving a concession must not push Community.committed_concession_cents above Community.concession_budget_cents."
    error_id: ERR_CONCESSION_BUDGET_EXCEEDED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /leases/{id}/concession-decisions"
  - priority: 81
    rule: "A Lease may only be executed when the Household's monthly_income_cents is at least INCOME_MULTIPLE = 3 times the lease's gross_monthly_charge_cents."
    error_id: ERR_INCOME_QUALIFICATION_FAILED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /leases/{id}/signature"
  - priority: 82
    rule: "A facility commitment increase or a permanent conversion must keep loan_to_value_bps computed on the TRAILING_ACTUAL basis at or below MAX_LTV_BPS = 6500."
    error_id: ERR_LTV_COVENANT_BREACH
    http_status: 409
    category: business_fiscal
    applies_to: "POST /communities/{id}/facility-commitments, POST /communities/{id}/facility-conversions"

endpoints:
  # ---------------------------------------------------------------- reads
  - method: GET
    path: "/communities"
    description: "List communities with pagination; supports filtering by lifecycle_status and posture."
    roles: [DeveloperPrincipal, EntitlementOfficer, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["lifecycle_status?", "posture?", "limit?", "offset?"]
    output: Community[]
    side_effects: []
  - method: GET
    path: "/communities/{id}"
    description: "Fetch one community including its derived posture, aggregate counters and version (the value used for expected_community_version)."
    roles: [DeveloperPrincipal, EntitlementOfficer, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: Community
    side_effects: []
  - method: GET
    path: "/communities/{id}/valuation"
    description: "Computed read: stabilization-based valuation on the requested basis, plus the loan-to-value test against the financing facility."
    roles: [DeveloperPrincipal, AssetManager]
    code: 200
    input: [basis]
    output:
      basis: string
      in_place_monthly_cents: integer
      pro_forma_monthly_cents: integer
      annual_gross_cents: integer
      vacancy_deduction_cents: integer
      egi_cents: integer
      opex_cents: integer
      noi_cents: integer
      value_cents: integer
      loan_to_value_bps: integer
      covenant_satisfied: boolean
    side_effects: []
  - method: GET
    path: "/phases"
    description: "List phases; filter by community_id or by predecessor_phase_id to walk the phasing chain."
    roles: [DeveloperPrincipal, EntitlementOfficer, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["community_id?", "predecessor_phase_id?", "status?", "kind?", "limit?", "offset?"]
    output: Phase[]
    side_effects: []
  - method: GET
    path: "/phases/{id}"
    description: "Fetch one phase with its release counters and completion state."
    roles: [DeveloperPrincipal, EntitlementOfficer, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: Phase
    side_effects: []
  - method: GET
    path: "/homesites"
    description: "List homesites; filter by phase_id, product_type or status."
    roles: [DeveloperPrincipal, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["phase_id?", "product_type?", "status?", "limit?", "offset?"]
    output: Homesite[]
    side_effects: []
  - method: GET
    path: "/homesites/{id}"
    description: "Fetch one homesite with its certificate-of-occupancy and release timestamps."
    roles: [DeveloperPrincipal, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: Homesite
    side_effects: []
  - method: GET
    path: "/market-rent-schedules"
    description: "List market rent schedules; filter by community_id, product_type or status to find the PUBLISHED one."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["community_id?", "product_type?", "status?", "limit?", "offset?"]
    output: MarketRentSchedule[]
    side_effects: []
  - method: GET
    path: "/market-rent-schedules/{id}"
    description: "Fetch one market rent schedule including applied_growth_bps and supersession state."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: MarketRentSchedule
    side_effects: []
  - method: GET
    path: "/concession-programs"
    description: "List concession programs; filter by community_id or status."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["community_id?", "status?", "limit?", "offset?"]
    output: ConcessionProgram[]
    side_effects: []
  - method: GET
    path: "/concession-programs/{id}"
    description: "Fetch one concession program including committed_cents."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: ConcessionProgram
    side_effects: []
  - method: GET
    path: "/households"
    description: "List households with pagination."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Household[]
    side_effects: []
  - method: GET
    path: "/households/{id}"
    description: "Fetch one household including monthly_income_cents used by the income-qualification rule."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager, Household]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/leases"
    description: "List leases; filter by any of the lease foreign keys or by lease_status / concession_status."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["homesite_id?", "household_id?", "concession_program_id?", "priced_by_schedule_id?", "lease_status?", "concession_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/leases/{id}"
    description: "Fetch one lease including its pricing, concession schedule and ledger counters. A Household caller may only read its own lease."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager, Household]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/turn-work-orders"
    description: "List turn work orders; filter by homesite_id, scope or status."
    roles: [DeveloperPrincipal, ConstructionManager, AssetManager, PropertyManager]
    code: 200
    input: ["homesite_id?", "scope?", "status?", "limit?", "offset?"]
    output: TurnWorkOrder[]
    side_effects: []
  - method: GET
    path: "/turn-work-orders/{id}"
    description: "Fetch one turn work order with its labour, material and bucket allocations."
    roles: [DeveloperPrincipal, ConstructionManager, AssetManager, PropertyManager]
    code: 200
    input: []
    output: TurnWorkOrder
    side_effects: []
  - method: GET
    path: "/absorption-reviews"
    description: "List absorption reviews; filter by community_id or product_type to find the latest pacing verdict."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: ["community_id?", "product_type?", "limit?", "offset?"]
    output: AbsorptionReview[]
    side_effects: []
  - method: GET
    path: "/absorption-reviews/{id}"
    description: "Fetch one absorption review including pacing_index, concession_tier and recommended_growth_bps."
    roles: [DeveloperPrincipal, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: []
    output: AbsorptionReview
    side_effects: []

  # ---------------------------------------------------------------- community writes
  - method: POST
    path: "/communities"
    description: "Create a build-to-rent community: site, planned product mix, concession budget, facility commitment and maintenance staffing. plat_status starts DRAFT, lifecycle_status PLANNING, management_mode DEVELOPER_SELF_MANAGED, facility_status CONSTRUCTION_DRAW and posture FROZEN."
    roles: [DeveloperPrincipal]
    code: 201
    input: [name, market_code, total_planned_units, product_mix, "single_ownership_covenant?", concession_budget_cents, facility_commitment_cents, "maintenance_tech_headcount?"]
    output: Community
    side_effects: ["posture computed as FROZEN because plat_status != APPROVED", "version := 1"]
  - method: POST
    path: "/communities/{id}/plat-submissions"
    description: "Submit the plat/entitlement package for review; records the submitting X-User-ID for the segregation-of-duties rule. Also used to resubmit after a revision request."
    roles: [DeveloperPrincipal]
    code: 201
    input: [plat_package_reference]
    output: Community
    side_effects: ["plat_status DRAFT|REVISION_REQUESTED -> SUBMITTED", "plat_submitted_by_user_id := X-User-ID", "version incremented"]
  - method: POST
    path: "/communities/{id}/plat-decisions"
    description: "Entitlement decision on a submitted plat: APPROVE, REQUEST_REVISION or REJECT. The decider's X-User-ID must differ from plat_submitted_by_user_id."
    roles: [EntitlementOfficer]
    code: 201
    input: [decision, "decision_note?"]
    output: Community
    side_effects: ["plat_status -> APPROVED | REVISION_REQUESTED | REJECTED", "plat_revision_round incremented on REQUEST_REVISION", "posture recomputed (FROZEN -> OPEN or RESTRICTED on APPROVE)", "version incremented"]
  - method: POST
    path: "/communities/{id}/absorption-reviews"
    description: "Record a lease-up pacing review for one product type over a half-open window; computes pacing_index, concession_tier and recommended_growth_bps."
    roles: [AssetManager]
    code: 201
    input: [product_type, window_start, window_end, planned_absorption_units]
    output: AbsorptionReview
    side_effects: ["absorption_pacing_index computed and frozen on the review", "posture_at_review snapshotted"]
  - method: POST
    path: "/communities/{id}/pm-transitions"
    description: "Schedule or execute the developer-to-property-manager transition. An effective_from after the logical clock parks the community in PM_TRANSITION_PENDING; an effective_from at or before the clock converts straight to PM_MANAGED."
    roles: [DeveloperPrincipal]
    code: 201
    input: [pm_company_name, effective_from]
    output: Community
    side_effects: ["management_mode -> PM_TRANSITION_PENDING or PM_MANAGED", "pm_company_name and pm_effective_from recorded", "version incremented"]
  - method: POST
    path: "/communities/{id}/facility-commitments"
    description: "Resize the portfolio financing commitment. The new commitment must keep loan_to_value_bps on the TRAILING_ACTUAL basis at or below 6500."
    roles: [AssetManager]
    code: 201
    input: [facility_commitment_cents]
    output: Community
    side_effects: ["facility_commitment_cents updated", "version incremented"]
  - method: POST
    path: "/communities/{id}/facility-conversions"
    description: "Convert the construction facility to permanent financing once the community is stabilized, PM-managed and inside the LTV covenant."
    roles: [AssetManager]
    code: 201
    input: []
    output: Community
    side_effects: ["facility_status CONVERSION_PENDING -> PERM_CONVERTED (terminal)", "version incremented"]

  # ---------------------------------------------------------------- phase and inventory writes
  - method: POST
    path: "/phases"
    description: "Create a construction phase. kind HOUSING carries planned_unit_count >= 1 and amenity_weight 0; kind AMENITY carries amenity_weight >= 1 and planned_unit_count 0. Both default to 0. predecessor_phase_id models the phasing chain."
    roles: [DeveloperPrincipal]
    code: 201
    input: [community_id, "predecessor_phase_id?", sequence_index, kind, "planned_unit_count?", "amenity_weight?", construction_window_start, construction_window_end]
    output: Phase
    side_effects: ["status := PLANNED", "community.amenity_delivery_ratio and posture recomputed when kind == AMENITY"]
  - method: POST
    path: "/phases/{id}/construction-start"
    description: "Begin construction on a planned phase, subject to the predecessor gate, the two-phase overlapping-window cap and the 48-hour same-kind gap."
    roles: [ConstructionManager]
    code: 201
    input: []
    output: Phase
    side_effects: ["status PLANNED -> UNDER_CONSTRUCTION", "community.lifecycle_status PLANNING -> CONSTRUCTION on the first start", "community.posture recomputed"]
  - method: POST
    path: "/homesites"
    description: "Create a homesite inside a housing phase. Its product_type must be a positive key of the phase product_mix and must not exceed the planned count for that type."
    roles: [DeveloperPrincipal, ConstructionManager]
    code: 201
    input: [phase_id, lot_number, product_type, bedrooms, square_feet]
    output: Homesite
    side_effects: ["status := PLANNED"]
  - method: POST
    path: "/homesites/{id}/occupancy-certificates"
    description: "Record the municipal certificate of occupancy for a homesite; this is the safety gate a section release checks. The homesite stays PLANNED."
    roles: [ConstructionManager]
    code: 201
    input: [occupancy_certificate_number, issued_at]
    output: Homesite
    side_effects: ["occupancy_certificate_number and occupancy_certificate_issued_at recorded"]
  - method: POST
    path: "/phases/{id}/section-releases"
    description: "Release a completed section for leasing while later sections remain under construction. Each listed homesite moves PLANNED -> AVAILABLE in request order."
    roles: [ConstructionManager]
    code: 201
    input: [homesite_ids]
    output: Phase
    side_effects: ["listed homesites PLANNED -> AVAILABLE with released_at set", "status UNDER_CONSTRUCTION -> SECTIONS_RELEASED, or SECTIONS_RELEASED self-loop", "community.released_unit_count / available_unit_count recomputed", "community.lifecycle_status CONSTRUCTION -> LEASE_UP and facility_status CONSTRUCTION_DRAW -> ADVANCE_ELIGIBLE on the first release", "community.posture recomputed (may become RESTRICTED on the amenity gate)"]
  - method: POST
    path: "/phases/{id}/completion"
    description: "Complete a phase. A HOUSING phase requires every planned homesite released; an AMENITY phase completes straight from UNDER_CONSTRUCTION and moves the amenity delivery gate."
    roles: [ConstructionManager]
    code: 201
    input: []
    output: Phase
    side_effects: ["status -> COMPLETE (terminal)", "community.amenity_delivery_ratio recomputed for AMENITY phases", "community.posture recomputed (RESTRICTED -> OPEN once the amenity ratio reaches 0.5000)"]
  - method: POST
    path: "/phases/{id}/halt"
    description: "Halt construction on a phase. Halting a HOUSING phase freezes the whole community and cascades through its homesites and pending leases; halting an AMENITY phase only restricts it."
    roles: [ConstructionManager]
    code: 201
    input: [halt_reason]
    output: Phase
    side_effects: ["pre_halt_status recorded, status -> CONSTRUCTION_HALTED, halt_count incremented", "cascade hop 1: community.posture -> FROZEN (HOUSING) or RESTRICTED (AMENITY)", "cascade hop 2: AVAILABLE homesites of the phase -> OFF_MARKET", "cascade hop 3: DRAFT and PENDING_SIGNATURE leases on those homesites -> CANCELLED with concession_status -> REVOKED", "cascade hop 4: ConcessionProgram.committed_cents and community.committed_concession_cents released"]
  - method: POST
    path: "/phases/{id}/resume"
    description: "Resume a halted phase back to its pre_halt_status, restoring OFF_MARKET homesites that were parked by the halt."
    roles: [ConstructionManager]
    code: 201
    input: []
    output: Phase
    side_effects: ["status -> pre_halt_status, pre_halt_status cleared", "OFF_MARKET homesites with off_market_reason == POSTURE_FREEZE -> AVAILABLE", "community.posture recomputed"]

  # ---------------------------------------------------------------- pricing writes
  - method: POST
    path: "/market-rent-schedules"
    description: "Publish a market rent schedule for one product type. repricing_mode MANUAL takes asking_rent_cents from the request; ABSORPTION_INDEXED derives it from the prior published schedule and the latest absorption review. Publishing supersedes the previous PUBLISHED schedule for the same (community, product_type). Carries OCC on the parent community."
    roles: [AssetManager]
    code: 201
    input: [community_id, product_type, effective_from, repricing_mode, "asking_rent_cents?", expected_community_version]
    output: MarketRentSchedule
    side_effects: ["status := PUBLISHED", "rent_growth_repricing computed when repricing_mode == ABSORPTION_INDEXED", "prior PUBLISHED schedule for the same (community, product_type) -> SUPERSEDED with superseded_at set", "community.version incremented"]
  - method: POST
    path: "/concession-programs"
    description: "Create a concession program for the community with a free-week allowance, an amortization mode and a budget. Rejected while the community posture is RESTRICTED or FROZEN. Carries OCC on the parent community."
    roles: [AssetManager]
    code: 201
    input: [community_id, program_code, tier, free_weeks, amortization_mode, eligible_product_types, "restricted_posture_eligible?", max_budget_cents, expected_community_version]
    output: ConcessionProgram
    side_effects: ["status := ACTIVE with committed_cents := 0", "the prior ACTIVE program of the same community -> SUPERSEDED with superseded_at set", "community.version incremented"]

  # ---------------------------------------------------------------- leasing writes
  - method: POST
    path: "/households"
    description: "Register a prospective household. The returned id is the value a Household caller sends as X-User-ID."
    roles: [LeasingAgent]
    code: 201
    input: [primary_applicant_name, email, household_size, monthly_income_cents, credit_tier]
    output: Household
    side_effects: ["active_lease_count := 0"]
  - method: POST
    path: "/leases"
    description: "Draft a lease on an available homesite. Freezes base_rent_cents from the eligible PUBLISHED rent schedule and computes the community services fee and gross monthly charge at creation."
    roles: [LeasingAgent]
    code: 201
    input: [homesite_id, household_id, term_months, start_date]
    output: Lease
    side_effects: ["lease_status := DRAFT, concession_status := NONE", "base_rent_selection sets base_rent_cents and priced_by_schedule_id", "community_services_fee sets community_services_fee_cents and gross_monthly_charge_cents", "end_date derived from start_date + term_months"]
  - method: POST
    path: "/leases/{id}/concession-requests"
    description: "Attach a concession program to a draft lease and build its amortization schedule. Also used to re-request after a rejection or revocation."
    roles: [LeasingAgent]
    code: 201
    input: [concession_program_id]
    output: Lease
    side_effects: ["concession_status NONE|REJECTED|REVOKED -> REQUESTED", "concession_requested_by_user_id := X-User-ID", "concession_amortization sets total_concession_cents, concession_schedule, monthly_concession_credit_cents, first_period_charge_cents, net_effective_rent_cents and concession_remaining_cents"]
  - method: POST
    path: "/leases/{id}/concession-decisions"
    description: "Approve or reject a requested concession. The decider's X-User-ID must differ from concession_requested_by_user_id, and approval must fit inside the community concession budget."
    roles: [AssetManager]
    code: 201
    input: [decision, "decision_note?"]
    output: Lease
    side_effects: ["concession_status REQUESTED -> APPROVED or REJECTED", "concession_decided_by_user_id := X-User-ID", "on APPROVE: community.committed_concession_cents and program.committed_cents increase by total_concession_cents"]
  - method: POST
    path: "/leases/{id}/submissions"
    description: "Move a draft lease to PENDING_SIGNATURE once its concession position is settled."
    roles: [LeasingAgent]
    code: 201
    input: []
    output: Lease
    side_effects: ["lease_status DRAFT -> PENDING_SIGNATURE"]
  - method: POST
    path: "/leases/{id}/signature"
    description: "Household signs the lease. Runs the income qualification test and starts the four-hop signature cascade through the homesite, the community counters, the lifecycle and the financing facility."
    roles: [Household]
    code: 201
    input: [signed_by_name]
    output: Lease
    side_effects: ["lease_status PENDING_SIGNATURE -> EXECUTED with executed_at set", "household.active_lease_count incremented", "cascade hop 1: homesite AVAILABLE -> LEASED", "cascade hop 2: phase.leased_homesite_count, community.leased_unit_count and occupancy_ratio recomputed", "cascade hop 3: community.lifecycle_status LEASE_UP -> STABILIZED at occupancy_ratio >= 0.7500", "cascade hop 4: community.facility_status ADVANCE_ELIGIBLE -> CONVERSION_PENDING"]
  - method: POST
    path: "/leases/{id}/activation"
    description: "Activate an executed lease on or after its start_date; starts concession amortization and accrues a resident-experience credit when the community is not OPEN."
    roles: [PropertyManager]
    code: 201
    input: []
    output: Lease
    side_effects: ["lease_status EXECUTED -> ACTIVE", "concession_status APPROVED -> AMORTIZING", "construction_impact_credit accrues 7500 on the lease and the community when posture is RESTRICTED or FROZEN"]
  - method: POST
    path: "/leases/{id}/concession-credit-applications"
    description: "Apply the next scheduled concession credit period, in strict ascending period_index order."
    roles: [PropertyManager]
    code: 201
    input: [period_index]
    output: Lease
    side_effects: ["concession_applied_cents, concession_remaining_cents and credits_applied_count advanced", "community.committed_concession_cents and program.committed_cents released by the applied credit", "concession_status AMORTIZING -> EXHAUSTED when the last scheduled period is consumed"]
  - method: POST
    path: "/leases/{id}/notices"
    description: "Household gives notice to vacate; moves the lease to ENDING and the homesite to NOTICE_GIVEN."
    roles: [Household]
    code: 201
    input: [notice_date, move_out_date]
    output: Lease
    side_effects: ["lease_status ACTIVE -> ENDING with notice_date and move_out_date recorded", "homesite.status LEASED -> NOTICE_GIVEN", "community.lifecycle_status may revert STABILIZED -> LEASE_UP"]
  - method: POST
    path: "/leases/{id}/cancellation"
    description: "Compensating action: cancel a lease that has not yet activated. Reverses every side effect of the signature cascade and revokes any committed concession."
    roles: [AssetManager]
    code: 201
    input: [cancellation_reason]
    output: Lease
    side_effects: ["lease_status DRAFT|PENDING_SIGNATURE|EXECUTED -> CANCELLED", "concession_status -> REVOKED and committed_cents released on both the program and the community", "homesite LEASED -> AVAILABLE when the lease was EXECUTED", "household.active_lease_count decremented", "community counters, occupancy_ratio, lifecycle_status and facility_status reverted"]

  # ---------------------------------------------------------------- turn writes
  - method: POST
    path: "/turn-work-orders"
    description: "Schedule turn work on a homesite that is on notice or already in turn, over a half-open [window_start, window_end) window. Computes labour cost and the three-bucket cost allocation, and closes out the outgoing lease."
    roles: [PropertyManager]
    code: 201
    input: [homesite_id, window_start, window_end, scope, tech_count, material_cost_cents]
    output: TurnWorkOrder
    side_effects: ["status := SCHEDULED", "turn_cost_allocation sets window_hours, labor_cost_cents, total_turn_cost_cents, tenant_recoverable_cents, community_opex_cents and capital_reserve_cents", "homesite NOTICE_GIVEN -> IN_TURN", "the outgoing ENDING lease -> ENDED", "community.leased_unit_count and occupancy_ratio recomputed; lifecycle_status may revert STABILIZED -> LEASE_UP"]
  - method: POST
    path: "/turn-work-orders/{id}/completion"
    description: "Complete a turn work order. When no other SCHEDULED order remains on the homesite it returns to AVAILABLE and its turn_cycle_count increments."
    roles: [PropertyManager]
    code: 201
    input: []
    output: TurnWorkOrder
    side_effects: ["status SCHEDULED -> COMPLETED with completed_at set", "homesite IN_TURN -> AVAILABLE with turn_cycle_count incremented and last_turn_ready_at set when no other SCHEDULED order remains", "community.available_unit_count and posture recomputed"]

  # ---------------------------------------------------------------- test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, used by every window, effective-date and activation rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock may only move forward."
    roles: [DeveloperPrincipal, EntitlementOfficer, ConstructionManager, LeasingAgent, AssetManager, PropertyManager]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects: ["logical clock advanced; scheduled PM transitions whose pm_effective_from is now in the past become eligible for PM_MANAGED"]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing or malformed"
    triggered_by: "X-User-Role absent/blank, or X-User-ID absent/blank for a Household caller"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role is not permitted to perform this operation"
    triggered_by: "Any endpoint invoked with a role outside its roles list"
  - error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    message: "Household may only act on its own lease"
    triggered_by: "Household caller whose X-User-ID differs from lease.household_id"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The requesting user may not also decide this item"
    triggered_by: "Concession or plat decision made by the same X-User-ID that raised it"
  - error_id: ERR_COMMUNITY_NOT_FOUND
    http_status: 404
    message: "Community not found"
    triggered_by: "Unknown community id in the path or in community_id"
  - error_id: ERR_PHASE_NOT_FOUND
    http_status: 404
    message: "Phase not found"
    triggered_by: "Unknown phase id in the path, in phase_id, or in predecessor_phase_id"
  - error_id: ERR_HOMESITE_NOT_FOUND
    http_status: 404
    message: "Homesite not found"
    triggered_by: "Unknown homesite id in the path, in homesite_id, or in homesite_ids"
  - error_id: ERR_RENT_SCHEDULE_NOT_FOUND
    http_status: 404
    message: "Market rent schedule not found"
    triggered_by: "Unknown schedule id in the path, or ABSORPTION_INDEXED repricing with no prior PUBLISHED schedule"
  - error_id: ERR_CONCESSION_PROGRAM_NOT_FOUND
    http_status: 404
    message: "Concession program not found"
    triggered_by: "Unknown concession_program_id"
  - error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    message: "Household not found"
    triggered_by: "Unknown household id in the path or in household_id"
  - error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    message: "Lease not found"
    triggered_by: "Unknown lease id in the path"
  - error_id: ERR_TURN_WORK_ORDER_NOT_FOUND
    http_status: 404
    message: "Turn work order not found"
    triggered_by: "Unknown turn work order id in the path"
  - error_id: ERR_ABSORPTION_REVIEW_NOT_FOUND
    http_status: 404
    message: "Absorption review not found"
    triggered_by: "Unknown review id in the path, or ABSORPTION_INDEXED repricing with no review for the (community, product_type)"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body failed schema validation"
    triggered_by: "Missing required field, unknown enum member, negative cents/count, malformed instant, term_months outside 6..24, free_weeks outside 0..12, product_mix key outside the product enum, or a repriced asking rent below 1 cent"
  - error_id: ERR_STALE_COMMUNITY_VERSION
    http_status: 412
    message: "expected_community_version does not match the community's current version"
    triggered_by: "POST /market-rent-schedules or POST /concession-programs carrying a version captured before another write bumped it"
  - error_id: ERR_INVALID_PLAT_STATE
    http_status: 409
    message: "Plat is not in a state that allows this operation"
    triggered_by: "Submitting a plat that is SUBMITTED or APPROVED, or deciding a plat that is not SUBMITTED"
  - error_id: ERR_INVALID_PHASE_STATE
    http_status: 409
    message: "Phase is not in a state that allows this operation"
    triggered_by: "Starting a phase that is not PLANNED, releasing from PLANNED or COMPLETE, completing a housing phase that is not SECTIONS_RELEASED, halting a COMPLETE phase, resuming a phase that is not CONSTRUCTION_HALTED"
  - error_id: ERR_INVALID_HOMESITE_STATE
    http_status: 409
    message: "Homesite is not in a state that allows this operation"
    triggered_by: "Releasing a homesite that is not PLANNED, or issuing a certificate on a homesite that has left PLANNED"
  - error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    message: "Lease is not in a state that allows this operation"
    triggered_by: "Submitting a non-DRAFT lease, signing a lease that is not PENDING_SIGNATURE, activating a lease that is not EXECUTED, noticing a lease that is not ACTIVE, cancelling an ACTIVE, ENDING, ENDED or CANCELLED lease"
  - error_id: ERR_INVALID_CONCESSION_STATE
    http_status: 409
    message: "Concession is not in a state that allows this operation"
    triggered_by: "Deciding a concession that is not REQUESTED, re-requesting while REQUESTED or APPROVED, or applying a credit while the concession is not AMORTIZING"
  - error_id: ERR_INVALID_TURN_STATE
    http_status: 409
    message: "Turn work order is not in a state that allows this operation"
    triggered_by: "Completing a work order that is already COMPLETED"
  - error_id: ERR_INVALID_LIFECYCLE_STATE
    http_status: 409
    message: "Community lifecycle does not allow this operation"
    triggered_by: "Leasing against a community still in PLANNING or CONSTRUCTION"
  - error_id: ERR_INVALID_FACILITY_STATE
    http_status: 409
    message: "Financing facility is not in a state that allows this operation"
    triggered_by: "Converting a facility that is not CONVERSION_PENDING, or resizing a PERM_CONVERTED facility"
  - error_id: ERR_INVALID_MANAGEMENT_STATE
    http_status: 409
    message: "Management mode does not allow this operation"
    triggered_by: "A second pm-transition once management_mode is PM_TRANSITION_PENDING or PM_MANAGED, or converting a facility while the community is not PM_MANAGED"
  - error_id: ERR_SCHEDULE_ALREADY_SUPERSEDED
    http_status: 409
    message: "Market rent schedule has already been superseded"
    triggered_by: "ABSORPTION_INDEXED repricing when the latest-dated schedule for the (community, product_type) is SUPERSEDED rather than PUBLISHED"
  - error_id: ERR_COMMUNITY_POSTURE_FROZEN
    http_status: 409
    message: "Community posture is FROZEN; leasing and inventory operations are blocked"
    triggered_by: "Any gated write while plat_status != APPROVED, single_ownership_covenant is false, or a HOUSING phase is CONSTRUCTION_HALTED"
  - error_id: ERR_COMMUNITY_POSTURE_RESTRICTED
    http_status: 409
    message: "Community posture is RESTRICTED; this operation requires an OPEN posture"
    triggered_by: "Creating a concession program or releasing a section while amenity_delivery_ratio < 0.5000 or an AMENITY phase is halted"
  - error_id: ERR_HOMESITE_NOT_LEASABLE
    http_status: 409
    message: "Homesite is not available for leasing"
    triggered_by: "Drafting a lease on a homesite that is PLANNED, LEASED, NOTICE_GIVEN, IN_TURN or OFF_MARKET"
  - error_id: ERR_CONCESSION_PROGRAM_NOT_ACTIVE
    http_status: 409
    message: "Concession program is not active"
    triggered_by: "Requesting a concession from a program whose status is SUPERSEDED"
  - error_id: ERR_HOMESITE_NOT_IN_TURN
    http_status: 409
    message: "Homesite is not on notice or in turn"
    triggered_by: "Opening a turn work order on a homesite that is AVAILABLE, PLANNED, LEASED or OFF_MARKET"
  - error_id: ERR_OCCUPANCY_CERTIFICATE_REQUIRED
    http_status: 409
    message: "Homesite has no certificate of occupancy"
    triggered_by: "Releasing a section containing a homesite whose occupancy_certificate_issued_at is null"
  - error_id: ERR_SINGLE_OWNERSHIP_COVENANT_REQUIRED
    http_status: 409
    message: "Plat approval requires the single-ownership covenant"
    triggered_by: "APPROVE decision on a community whose single_ownership_covenant is false"
  - error_id: ERR_MAINTENANCE_STAFFING_REQUIRED
    http_status: 409
    message: "Community has no maintenance technicians assigned"
    triggered_by: "Scheduling the PM transition while maintenance_tech_headcount is 0"
  - error_id: ERR_LEASE_UP_THRESHOLD_NOT_MET
    http_status: 409
    message: "Community has not reached the lease-up threshold for a management transition"
    triggered_by: "PM transition requested while occupancy_ratio < 0.5000"
  - error_id: ERR_PLAT_REVISION_LIMIT
    http_status: 409
    message: "Plat revision limit reached"
    triggered_by: "A third REQUEST_REVISION decision on the same community"
  - error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    message: "A resource with this natural key already exists"
    triggered_by: "Duplicate community name, duplicate (phase_id, lot_number), or duplicate (community_id, product_type, effective_from)"
  - error_id: ERR_HOUSEHOLD_ALREADY_LEASED
    http_status: 409
    message: "Household already holds an open lease"
    triggered_by: "Second lease drafted for a household with a DRAFT, PENDING_SIGNATURE, EXECUTED or ACTIVE lease"
  - error_id: ERR_PRODUCT_MIX_EXCEEDED
    http_status: 409
    message: "Homesite exceeds the community's planned product mix or the phase unit count"
    triggered_by: "Creating a homesite of a product_type whose Community.product_mix count is 0, beyond that planned count, or beyond the phase's planned_unit_count"
  - error_id: ERR_INVALID_PHASE_PREDECESSOR
    http_status: 409
    message: "Phase predecessor is invalid"
    triggered_by: "predecessor_phase_id equal to the phase itself or belonging to another community"
  - error_id: ERR_TURN_WINDOW_OVERLAP
    http_status: 409
    message: "Turn window overlaps an existing work order on this homesite"
    triggered_by: "A second work order whose [window_start, window_end) intersects an existing one"
  - error_id: ERR_PHASE_CONCURRENCY_LIMIT
    http_status: 409
    message: "Phase cannot start: predecessor incomplete or concurrency cap reached"
    triggered_by: "Predecessor not SECTIONS_RELEASED/COMPLETE, or a third overlapping construction window in the community"
  - error_id: ERR_INVALID_TURN_WINDOW
    http_status: 409
    message: "Turn window is not a valid whole-hour future window"
    triggered_by: "window_start >= window_end, a non-integral or zero hour span, a span above 240 hours, or a window_start before the logical clock"
  - error_id: ERR_TURN_REWORK_BUFFER
    http_status: 409
    message: "Turn window violates the 48-hour same-scope rework buffer"
    triggered_by: "A same-scope work order starting less than 48 hours after a prior order's window_end on the same homesite"
  - error_id: ERR_PHASE_GAP_VIOLATION
    http_status: 409
    message: "Same-kind phase windows are closer than the 48-hour minimum gap"
    triggered_by: "Starting a phase whose non-overlapping window sits within 48 hours of another same-kind phase window"
  - error_id: ERR_INVALID_REVIEW_WINDOW
    http_status: 409
    message: "Absorption review window is invalid"
    triggered_by: "window_start >= window_end, or window_end after the logical clock"
  - error_id: ERR_CLOCK_REWIND
    http_status: 409
    message: "The logical clock may only move forward"
    triggered_by: "current_utc at or before the stored clock value"
  - error_id: ERR_TURN_CAPACITY_EXCEEDED
    http_status: 409
    message: "Turn work exceeds the community's maintenance technician capacity"
    triggered_by: "Overlapping hours whose combined tech_count across SCHEDULED work orders in the community exceeds maintenance_tech_headcount"
  - error_id: ERR_NO_PUBLISHED_RENT_SCHEDULE
    http_status: 409
    message: "No published market rent schedule is effective for this product type"
    triggered_by: "Drafting a lease, releasing a section, or valuing a community on the FORWARD_STABILIZED basis with no eligible PUBLISHED schedule"
  - error_id: ERR_PRODUCT_TYPE_NOT_ELIGIBLE
    http_status: 409
    message: "Homesite product type is not eligible for this concession program"
    triggered_by: "Concession request whose homesite product_type is absent from eligible_product_types"
  - error_id: ERR_CONCESSION_PERIOD_OUT_OF_ORDER
    http_status: 409
    message: "Concession credit period is out of order or beyond the schedule"
    triggered_by: "period_index different from credits_applied_count + 1, or greater than the schedule length"
  - error_id: ERR_CONCESSION_BUDGET_EXCEEDED
    http_status: 409
    message: "Approving this concession would exceed the community concession budget"
    triggered_by: "committed_concession_cents + total_concession_cents above concession_budget_cents"
  - error_id: ERR_INCOME_QUALIFICATION_FAILED
    http_status: 409
    message: "Household income does not meet the 3x gross monthly charge requirement"
    triggered_by: "Signature attempt where monthly_income_cents < 3 * gross_monthly_charge_cents"
  - error_id: ERR_LTV_COVENANT_BREACH
    http_status: 409
    message: "Operation would breach the 6500 bps loan-to-value covenant"
    triggered_by: "Facility commitment increase or permanent conversion whose TRAILING_ACTUAL loan_to_value_bps exceeds 6500"

roles:
  - name: DeveloperPrincipal
    identity: opaque
    description: "Owner-developer of the build-to-rent community; controls site setup, platting submissions, phase creation, inventory and the property-management transition."
    exclusive_operations:
      - "POST /communities"
      - "POST /communities/{id}/plat-submissions"
      - "POST /communities/{id}/pm-transitions"
      - "POST /phases"
    shared_operations:
      - "POST /homesites (with ConstructionManager)"
      - "all GET reads"
  - name: EntitlementOfficer
    identity: opaque
    description: "Municipal/entitlement reviewer who decides plats; must not be the submitter."
    exclusive_operations:
      - "POST /communities/{id}/plat-decisions"
    shared_operations:
      - "GET /communities, GET /communities/{id}, GET /phases, GET /phases/{id}"
  - name: ConstructionManager
    identity: opaque
    description: "Runs construction phasing, occupancy certificates, incremental section releases, halts and resumes."
    exclusive_operations:
      - "POST /phases/{id}/construction-start"
      - "POST /phases/{id}/section-releases"
      - "POST /phases/{id}/completion"
      - "POST /phases/{id}/halt"
      - "POST /phases/{id}/resume"
      - "POST /homesites/{id}/occupancy-certificates"
    shared_operations:
      - "POST /homesites (with DeveloperPrincipal)"
      - "GET reads on communities, phases, homesites and turn work orders"
  - name: LeasingAgent
    identity: opaque
    description: "Registers households, drafts and submits leases and requests concessions; may never decide a concession."
    exclusive_operations:
      - "POST /households"
      - "POST /leases"
      - "POST /leases/{id}/concession-requests"
      - "POST /leases/{id}/submissions"
    shared_operations:
      - "GET reads on communities, phases, homesites, rent schedules, concession programs, households, leases and absorption reviews"
  - name: AssetManager
    identity: opaque
    description: "Owns pricing, absorption reviews, concession decisions, lease cancellations and portfolio financing."
    exclusive_operations:
      - "POST /communities/{id}/absorption-reviews"
      - "POST /communities/{id}/facility-commitments"
      - "POST /communities/{id}/facility-conversions"
      - "POST /market-rent-schedules"
      - "POST /concession-programs"
      - "POST /leases/{id}/concession-decisions"
      - "POST /leases/{id}/cancellation"
      - "GET /communities/{id}/valuation (with DeveloperPrincipal)"
    shared_operations:
      - "all GET reads"
  - name: PropertyManager
    identity: opaque
    description: "Post-transition operator: activates leases, applies concession credits and runs the turn process."
    exclusive_operations:
      - "POST /leases/{id}/activation"
      - "POST /leases/{id}/concession-credit-applications"
      - "POST /turn-work-orders"
      - "POST /turn-work-orders/{id}/completion"
    shared_operations:
      - "GET reads on communities, phases, homesites, rent schedules, concession programs, households, leases, turn work orders and absorption reviews"
  - name: Household
    identity: entity_backed:Household
    description: "Resident-side actor identified by X-User-ID equal to its Household.id; may only sign, notice and read its own lease."
    exclusive_operations:
      - "POST /leases/{id}/signature"
      - "POST /leases/{id}/notices"
    shared_operations:
      - "GET /leases/{id} and GET /households/{id} restricted to its own records"
