              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /modular/modules/${m1}/close-connections"
              payload: { field_scope_signed_off: true, connected_note: "attempt from the wrong state" }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_MODULE_NOT_SET' with HTTP 409"
            - "GET /modular/modules/${m1} reports site_status == 'AT_FACTORY', connected_at == null and version unchanged at 1"

      - name: cancel_a_delivered_shipment_is_rejected
        claim_type: Terminal State Lockdown
        grounds:
