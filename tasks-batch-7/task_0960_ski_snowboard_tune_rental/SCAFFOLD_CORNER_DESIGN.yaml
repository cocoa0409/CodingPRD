          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /shop/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FrontDesk, captures: { err: "$.data.error_id" } }
          assert: ["With auth headers stripped: ${err} == ERR_UNAUTHENTICATED; HTTP 401 (auth beats NOT_FOUND at priority 1 vs 4)"]

