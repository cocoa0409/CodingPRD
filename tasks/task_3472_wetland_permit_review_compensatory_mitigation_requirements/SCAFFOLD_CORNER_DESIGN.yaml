  - section: endpoints
    instances:
      - name: corner_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /wetland-permits/sites"]
        distinguishing_aspect: "Pagination contract: limit=2 over 3 sites returns total_count 3, has_more true, 2 rows; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One applicant with three sites"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Tract A", state_code: "VA", watershed_code: "18020101", total_acres: 10.0, resource_types_present: ["STREAM"] }, as: SystemAdmin }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Tract B", state_code: "VA", watershed_code: "18020102", total_acres: 11.0, resource_types_present: ["STREAM"] }, as: SystemAdmin }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Tract C", state_code: "VA", watershed_code: "18020103", total_acres: 12.0, resource_types_present: ["STREAM"] }, as: SystemAdmin }
          trigger:
            - { call: "GET /wetland-permits/sites?limit=2&offset=0", as: Reviewer, as_user_id: "rev-1", captures: { first_len: "$.data" } }
            - { call: "GET /wetland-permits/sites?limit=2&offset=2", as: Reviewer, as_user_id: "rev-1", captures: { second_len: "$.data" } }
          assert:
            - "First page: data has exactly 2 rows, total_count == 3, has_more == true"
            - "Second page: data has exactly 1 row, total_count == 3, has_more == false"
            - "Rows are ordered by created_at ascending (Tract A, Tract B, then Tract C)"

