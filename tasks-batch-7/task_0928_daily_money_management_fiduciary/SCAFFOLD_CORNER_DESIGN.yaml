              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C045" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/reconciliation-periods"
              payload: { account_id: "${acct_id}", period_month: "2026-06" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_id: $.data.id }
            - call: "POST /dmm/accounts/${acct_id}/adjustments"
              payload: { adjustment_type: "DEPOSIT", amount_cents: 250000, value_date: "2026-06-01", memo: "Pension deposit." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "GET /dmm/ledger-entries"
              payload: { account_id: "${acct_id}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { entry_id: "$.data[0].id" }
            - call: "POST /dmm/reconciliation-periods/${per_id}/statement-lines"
              payload: { external_ref: "BK-0001", amount_cents: 100000, line_date: "2026-06-01", line_description: "Unidentified credit" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { line_id: $.data.id }
            - call: "GET /dmm/reconciliation-periods/${per_id}"
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_v: $.data.version }
          trigger:
            - call: "POST /dmm/statement-lines/${line_id}/disposition"
              payload: { action: "MATCH", expected_period_version: "${per_v}", ledger_entry_id: "${entry_id}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_match: $.data.error_id }
            - call: "POST /dmm/statement-lines/${line_id}/disposition"
              payload: { action: "FLAG_EXCEPTION", expected_period_version: "${per_v}", exception_note: "No matching ledger entry for this credit." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/reconciliation-periods/${per_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/reconciliation-periods/${per_id}/status"
              payload: { to_status: "CLOSED" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { err_close: $.data.error_id }
          assert:
            - "the MATCH attempt returns HTTP 422 with error_id ERR_REFERENCE_MISMATCH"
            - "StatementLine.${line_id}.match_status == EXCEPTION after the FLAG_EXCEPTION call"
            - "ReconciliationPeriod.${per_id}.open_exception_count == 1"
            - "the close attempt returns HTTP 409 with error_id ERR_OPEN_EXCEPTIONS"
            - "ReconciliationPeriod.${per_id}.status == IN_REVIEW"

