        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the commission-review response itself carries status APPROVED_WITH_CONDITIONS, approved_snapshot_id set, and the bumped version — no re-read needed; a follow-up GET returns identical values."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P UNDER_REVIEW with reliability-met preferred portfolio (SOLAR 1150 vs load 400)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP IC", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
