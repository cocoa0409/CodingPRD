  - rule_id: non_linear_state_machine
    instances:

      - name: request_return_resubmit_cycle_then_revision_limit
        grounds:
          - state_machines.ApplicationRequest.SUBMITTED_to_RETURNED
          - state_machines.ApplicationRequest.RETURNED_to_SUBMITTED
          - entities.ApplicationRequest.fields.revision_round
          - validations[priority=36]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          ApplicationRequest is the CYCLIC machine: SUBMITTED -> RETURNED -> SUBMITTED
          is traversable twice and the loop is bounded by a counter, not by a state.
          revision_round increments only on the RETURNED -> SUBMITTED edge (never on the
          first DRAFT -> SUBMITTED edge), so the third resubmit is refused with
          ERR_REVISION_LIMIT_EXCEEDED while the row stays parked in RETURNED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor, one application, one teacher, one analyst."
            - "The request has already gone round the loop twice: submit, RETURN, submit (revision_round 1), RETURN, submit (revision_round 2), RETURN. It now sits in RETURNED with revision_round 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
