# =============================================================================
# §1.9 Scaffold Corner Design — task_1974 Medical Transcription
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx = 65 non-whitespace chars (substituted with exact string before use).
# Logical clock default: 2026-08-01T00:00:00Z ("T0").
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities ====
  - section: entities
    instances:
      - name: clinic_create_applies_config_defaults
        claim_type: defaults
        grounds:
          - entities.ClinicAccount.fields.unsigned_report_threshold
          - entities.ClinicAccount.fields.aging_tier1_hours
          - entities.ClinicAccount.fields.aging_tier2_hours
          - entities.ClinicAccount.fields.payment_grace_days
        distinguishing_aspect: "Omitting all optional config yields threshold 3, tiers 24/72h, grace 14d, billing_hold false, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id, thr: $.data.unsigned_report_threshold, t1: $.data.aging_tier1_hours, t2: $.data.aging_tier2_hours, grace: $.data.payment_grace_days, hold: $.data.billing_hold } }
          assert:
            - "unsigned_report_threshold == 3, aging_tier1_hours == 24, aging_tier2_hours == 72, payment_grace_days == 14"
            - "billing_hold == false and suspended_provider_count == 0 and version == 1"

      - name: provider_create_missing_required_clinic_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Provider.fields.clinic_account_id
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /providers without clinic_account_id fails 400 before any existence check on other fields."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /providers", payload: { full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: provider_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_PROVIDER_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown provider id returns ERR_PROVIDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /providers/00000000-0000-4000-8000-000000000000", payload: {}, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROVIDER_NOT_FOUND and http status == 404"

      - name: job_create_invalid_priority_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DictationJob.fields.priority
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "priority 'MEGA' is not in {STAT, URGENT, ROUTINE} -> 400; similarly audio_duration_seconds 0 -> 400."
        test_recipe:
          setup:
            - "Clinic C with ROUTINE SLA; provider P"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: MEGA, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { err1: $.data.error_id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 0 }, as: Provider, as_user_id: "${p}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (bad enum)"
            - "err2 == ERR_INVALID_REQUEST (audio_duration_seconds must be > 0)"

      - name: job_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.DictationJob.fields.workflow_status
          - entities.DictationJob.fields.escalation_level
        distinguishing_aspect: "Client-supplied system fields (workflow_status, escalation_level) are ignored: job lands in QUEUED / NONE regardless."
        test_recipe:
          setup:
            - "Clinic C with STAT SLA; provider P"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: STAT, audio_duration_seconds: 90, workflow_status: DELIVERED, escalation_level: CRITICAL }, as: Provider, as_user_id: "${p}", captures: { st: $.data.workflow_status, esc: $.data.escalation_level } }
          assert:
            - "workflow_status == QUEUED and escalation_level == NONE (client input ignored)"

      - name: dictation_jobs_list_pagination_and_filter
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - "endpoints[GET /dictation-jobs]"
        distinguishing_aspect: "Filter + paginate: two jobs for provider P; limit=1 returns 1 item with total_count 2 and has_more true; offset=1 returns the other job (created_at ASC order, creations clock-separated)."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, two ROUTINE jobs J_A (created T0) and J_B (created T0+1s)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { ja: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { jb: $.data.id } }
          trigger:
            - { call: "GET /dictation-jobs?provider_id=${p}&limit=1", payload: {}, as: VendorAdmin, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /dictation-jobs?provider_id=${p}&limit=1&offset=1", payload: {}, as: VendorAdmin, captures: { second_id: "$.data[0].id" } }
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true, item id == J_A (created_at ASC)"
            - "page 2: item id == J_B, has_more == false"
            - "envelope carries meta.api_request_id and meta.api_request_timestamp on every response"

      - name: transcript_whitespace_excluded_from_visible_chars
        claim_type: computed_fields
        grounds:
          - calculations.visible_chars_and_line_count
          - entities.Transcript.fields.visible_char_count
        distinguishing_aspect: "Whitespace (spaces, tabs, newlines) never bills: 'ab cd\\nef gh' -> visible_char_count 8, line_count 1."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J claimed at T0"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "ab cd\nef gh" }, as: Editor, as_user_id: "${e}" }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin, captures: { vc: "$.data[0].visible_char_count", lc: "$.data[0].line_count" } }
          assert:
            - "visible_char_count == 8 (only 'abcdefgh' counts)"
            - "line_count == 1"

  # ====================================================== state_machines ====
  - section: state_machines
    instances:
      - name: job_initial_state_queued_with_computed_due_at
        claim_type: initial_state
        grounds:
          - state_machines.DictationJob
          - calculations.due_at_assignment
          - entities.DictationJob.fields.due_at
        distinguishing_aspect: "STAT job created at T0 lands in QUEUED with escalation NONE and due_at exactly T0 + 120 min."
        test_recipe:
          setup:
            - "Clinic C with STAT SLA (tat 120); provider P"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: STAT, audio_duration_seconds: 90 }, as: Provider, as_user_id: "${p}", captures: { st: $.data.workflow_status, esc: $.data.escalation_level, due: $.data.due_at, est: $.data.asr_char_estimate } }
          assert:
            - "workflow_status == QUEUED, escalation_level == NONE, claimed_by_editor_id == null"
            - "due_at == 2026-08-01T02:00:00Z (created_at 2026-08-01T00:00:00Z + 120 min)"
            - "asr_char_estimate == 180 (90s * 2 chars/s)"

      - name: submit_from_queued_returns_job_not_editing
        claim_type: invalid_transition
        grounds:
          - state_machines.DictationJob.EDITING_to_SUBMITTED
          - "errors[ERR_JOB_NOT_EDITING]"
        distinguishing_aspect: "Submit on a never-claimed QUEUED job fails; no transcript is created."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E; job J QUEUED (never claimed)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin }
          assert:
            - "error_id == ERR_JOB_NOT_EDITING (409)"
            - "GET /transcripts?dictation_job_id returns 0 items"

      - name: claim_cancelled_job_returns_not_queued
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DictationJob.QUEUED_to_CANCELLED
          - "errors[ERR_JOB_NOT_QUEUED]"
        distinguishing_aspect: "CANCELLED is terminal: after provider-owner cancel, a claim attempt fails with ERR_JOB_NOT_QUEUED and no editor counter moves."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J created then cancelled by P"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/cancel", payload: {}, as: Provider, as_user_id: "${p}", captures: { st: $.data.workflow_status } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
            - { call: "GET /editors/${e}", payload: {}, as: VendorAdmin, captures: { active: $.data.active_claim_count } }
          assert:
            - "cancel response workflow_status == CANCELLED"
            - "claim error_id == ERR_JOB_NOT_QUEUED (409)"
            - "Editor.active_claim_count == 0 (no side effects from the rejected claim)"

      - name: qa_on_editing_job_returns_not_submitted
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DictationJob
          - "errors[ERR_JOB_NOT_SUBMITTED]"
        distinguishing_aspect: "QA review requires SUBMITTED; on an EDITING job the review is rejected and no QAReview is recorded."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J claimed (EDITING)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01", captures: { err: $.data.error_id } }
            - { call: "GET /dictation-jobs/${j}/qa-reviews", payload: {}, as: VendorAdmin }
          assert:
            - "error_id == ERR_JOB_NOT_SUBMITTED (409)"
            - "GET /dictation-jobs/{J}/qa-reviews returns 0 items; Editor.qa_review_count unchanged (0)"

      - name: sign_submitted_transcript_returns_not_delivered
        claim_type: invalid_transition
        grounds:
          - state_machines.Transcript.DELIVERED_to_SIGNED
          - "errors[ERR_TRANSCRIPT_NOT_DELIVERED]"
        distinguishing_aspect: "A transcript still in SUBMITTED (awaiting QA) cannot be signed — signature queue entry requires DELIVERED."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J claimed and submitted (transcript T SUBMITTED)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin, captures: { t: "$.data[0].id" } }
          trigger:
            - { call: "POST /transcripts/${t}/sign", payload: {}, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSCRIPT_NOT_DELIVERED (409); transcript stays SUBMITTED, signed_at null"

      - name: addend_delivered_transcript_returns_not_signed
        claim_type: invalid_transition
        grounds:
          - state_machines.Transcript.SIGNED_to_AMENDED
          - "errors[ERR_TRANSCRIPT_NOT_SIGNED]"
        distinguishing_aspect: "Addendum requires SIGNED; on a merely DELIVERED transcript it fails."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J fully delivered (transcript T DELIVERED)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin, captures: { t: "$.data[0].id" } }
          trigger:
            - { call: "POST /transcripts/${t}/addend", payload: { addendum_text: "correction" }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSCRIPT_NOT_SIGNED (409); transcript remains DELIVERED"

      - name: provider_return_reopens_job_to_original_editor
        claim_type: side_effect_execution
        grounds:
          - state_machines.Transcript.DELIVERED_to_RETURNED
          - state_machines.DictationJob.DELIVERED_to_EDITING
        distinguishing_aspect: "Return is a cross-entity reopen: transcript RETURNED (terminal), job back to EDITING with rework_count +1 and re-claimed to the SAME editor (bypassing capacity/window), burning a new transcript version on resubmission."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J delivered at T0 (transcript v1 DELIVERED); E.active_claim_count == 0 after delivery"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
