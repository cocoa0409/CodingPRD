              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "GET /apprentices/${app_id}"
              as: TrustAdmin
              captures: { step_2000: $.data.current_wage_step, rate_2000: $.data.current_wage_rate_cents }
          assert:
            - "step_1999 == 1 (one hour below the threshold)"
            - "rate_1999 == 2000"
            - "step_2000 == 2 (exactly at the threshold; >= semantics)"
            - "rate_2000 == 2400"

      - name: boundary_class_capacity_full_at_capacity
        grounds:
          - "entities.TrainingClass.fields.enrolled_count"
          - "errors[ERR_CLASS_FULL]"
          - "validations[priority=8]"
        distinguishing_aspect: |
          Count-metric boundary via the enrollment endpoint (different metric and
          endpoint than the wage-step boundary): a capacity-1 class accepts the
          first enrollment (count 0 < 1) and rejects the second at count == 1.
        test_recipe:
          setup:
            - "Class C capacity 1; apprentices A and B both INDENTURED + REGISTERED."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
