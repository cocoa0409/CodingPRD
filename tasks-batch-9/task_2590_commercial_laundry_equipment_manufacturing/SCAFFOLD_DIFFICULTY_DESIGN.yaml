# §1.8 Scaffold Difficulty Design (Test Targeting Index) for task 2590 —
# commercial laundry equipment manufacturing. Nine rule_ids x 2 instances = 18 instances.
# Every literal in every `assert:` was computed against the SCAFFOLD.yaml §1.3 formulas with
# Decimal / ROUND_HALF_UP arithmetic before being written here.
# The logical clock is never set in these chains, so every server-stamped instant is the mandatory
# startup default 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_coverage_full_vs_pro_rata_same_claim_data
        grounds:
          - calculations.warranty_coverage
          - entities.WarrantyClaim.fields.coverage_variant
          - entities.WarrantyClaim.fields.effective_rated_cycles
          - entities.WarrantyClaim.fields.covered_amount_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          One claim's inputs (failure_cycle_count 8000, in_service_months 8, STANDARD duty on an ON_PREMISES
          model, part rated 30000 cycles / 36 months / 42000 cents) satisfy the FULL_REPLACEMENT selector, so the
          settlement is the whole 42000 cents; feeding the identical inputs through the PRO_RATA branch instead
          yields 30800 cents, and an implementation that runs the wrong branch is caught by the 11200-cent gap.
        test_recipe:
          setup:
            - "MachineModel OPL-60-A (ON_PREMISES, 60 lb, AISI_304, list 1250000) certified via a two-dimension dossier review"
            - "Three assembly stations, a floor technician certified for all three station types, and a QA inspector certified for QA_SIGNOFF"
            - "BuildOrder SN-0001 driven all the way to ACCEPTED with rework_count 0"
            - "Distributor D-01 AUTHORIZED with two trained technicians; technician T-201 certified for DIAGNOSTICS_TOOL"
            - "ServicePart BRG-2040 (rated 30000 cycles, 36 warranty months, 42000 cents, reorder point 2) stocked to on_hand_qty 3"
            - "One WarrantyClaim in SUBMITTED against SN-0001 for BRG-2040"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000, max_rework_cycles: 2, min_first_pass_yield_pct: 80.00 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "DRUM-01", station_type: "DRUM_FAB", parallel_capacity: 1, changeover_buffer_minutes: 30, supported_product_lines: ["ON_PREMISES", "VENDED"] }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { st_drum: $.data.id }
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "BRG-01", station_type: "BEARING_INSTALL", parallel_capacity: 1, changeover_buffer_minutes: 15, supported_product_lines: ["ON_PREMISES", "VENDED"] }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { st_brg: $.data.id }
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "CTL-01", station_type: "CONTROL_INTEGRATION", parallel_capacity: 1, changeover_buffer_minutes: 10, supported_product_lines: ["ON_PREMISES", "VENDED"] }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { st_ctl: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
            - call: "POST /clm/technicians/${t1}/certification-actions"
              payload: { action: "GRANT", scopes: ["DRUM_FAB", "BEARING_INSTALL", "CONTROL_INTEGRATION"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-900", full_name: "Ken Ono", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { tq: $.data.id }
            - call: "POST /clm/technicians/${tq}/certification-actions"
              payload: { action: "GRANT", scopes: ["QA_SIGNOFF"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/build-orders"
              payload: { model_id: "${m1}", serial_number: "SN-0001", planned_start_at: "2026-08-01T07:00:00Z" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { b1: $.data.id }
            - call: "POST /clm/build-orders/${b1}/release-to-floor"
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "POST /clm/build-orders/${b1}/station-logs"
              payload: { station_id: "${st_drum}", station_type: "DRUM_FAB", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", outcome: "PASS" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /clm/build-orders/${b1}/station-logs"
              payload: { station_id: "${st_brg}", station_type: "BEARING_INSTALL", started_at: "2026-08-01T09:00:00Z", completed_at: "2026-08-01T10:00:00Z", outcome: "PASS", bearing_preload_micron: 24.00 }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /clm/build-orders/${b1}/station-logs"
              payload: { station_id: "${st_ctl}", station_type: "CONTROL_INTEGRATION", started_at: "2026-08-01T10:00:00Z", completed_at: "2026-08-01T11:00:00Z", outcome: "PASS" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /clm/build-orders/${b1}/qa-signoff"
              payload: { decision: "APPROVE" }
              as: QualityInspector
              as_user_id: "${tq}"
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-202", full_name: "Sam Poe", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t202: $.data.id }
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/technicians/${t201}/certification-actions"
              payload: { action: "GRANT", scopes: ["DIAGNOSTICS_TOOL"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p1: $.data.id }
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: 3, reason: "RECEIPT" }
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "POST /clm/warranty-claims"
              payload: { build_order_id: "${b1}", part_id: "${p1}", distributor_id: "${dist}", reported_by_technician_id: "${t201}", failure_cycle_count: 8000, in_service_months: 8, duty_cycle_class: "STANDARD", diagnostics_code: "DX-BRG-07" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { c1: $.data.id }
            - call: "GET /clm/service-parts/${p1}"
              as: WarrantyAnalyst
              as_user_id: "u-wa-01"
              captures: { p1_v: $.data.version }
          trigger:
            - call: "POST /clm/warranty-claims/${c1}/adjudicate"
              payload: { decision: "APPROVE", expected_part_version: "${p1_v}" }
              as: WarrantyAnalyst
              as_user_id: "u-wa-01"
          assert:
            - "WarrantyClaim.${c1}.effective_rated_cycles == 30000"
            - "WarrantyClaim.${c1}.coverage_variant == FULL_REPLACEMENT"
            - "WarrantyClaim.${c1}.covered_amount_cents == 42000"
            - "WarrantyClaim.${c1}.covered_amount_cents != 30800 (the PRO_RATA branch answer on identical inputs)"
            - "WarrantyClaim.${c1}.claim_state == APPROVED"
            - "ServicePart.${p1}.on_hand_qty == 2"
            - "ServicePart.${p1}.reserved_qty == 1"
            - "ServicePart.${p1}.stock_state == LOW"
            - "Distributor.${dist}.warranty_credit_cents == 42000"
            - "Distributor.${dist}.open_claim_count == 0"

      - name: financing_apr_provisional_vs_final_on_quote_approval
        grounds:
          - calculations.financing_terms
          - entities.PackageQuote.fields.provisional_apr_bp
          - entities.PackageQuote.fields.provisional_monthly_payment_cents
          - entities.PackageQuote.fields.final_apr_bp
          - entities.PackageQuote.fields.monthly_payment_cents
          - state_machines.PackageQuote.DRAFT_to_SUBMITTED
          - state_machines.PackageQuote.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The provisional variant keys the APR adjustment on stated_credit_score 715 (-100 bp -> 1590 bp ->
          123114 cents/month) while the final variant keys it on verified_credit_score 668 (0 bp -> 1690 bp ->
          125823 cents/month) over the identical financed principal 5073750, so the same quote carries two
          different APRs and two different payments that must both survive on the row.
        test_recipe:
          setup:
            - "MachineModel OPL-60-A with list_price_cents 1250000"
            - "Distributor D-01 AUTHORIZED (two technicians, INSTALLATION and PAYMENT_SYSTEMS recorded)"
            - "PackageQuote in DRAFT for TERM_60 with down_payment_cents 500000, package_discount_pct 0.00, freight_cents 450000, stated_credit_score 715"
            - "One line: 4 units of OPL-60-A with payment_module NONE and no line discount -> total_cents 5450000"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-202", full_name: "Sam Poe", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t202: $.data.id }
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Wash Barn LLC", laundromat_site_code: "SITE-88", stated_credit_score: 715, financing_program: "TERM_60", down_payment_cents: 500000, package_discount_pct: 0.00, freight_cents: 450000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q2: $.data.id, q2_v0: $.data.version }
            - call: "POST /clm/quotes/${q2}/lines"
              payload: { model_id: "${m1}", quantity: 4, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q2_v0}" }
              as: Distributor
              as_user_id: "${dist}"
          trigger:
            - call: "POST /clm/quotes/${q2}/submit"
              as: Distributor
              as_user_id: "${dist}"
            - call: "POST /clm/quotes/${q2}/decision"
              payload: { decision: "APPROVE", verified_credit_score: 668 }
              as: ChannelManager
              as_user_id: "u-cm-01"
          assert:
            - "PackageQuote.${q2}.total_cents == 5450000"
            - "PackageQuote.${q2}.origination_fee_cents == 123750"
            - "PackageQuote.${q2}.financed_principal_cents == 5073750"
            - "PackageQuote.${q2}.provisional_apr_bp == 1590"
            - "PackageQuote.${q2}.provisional_monthly_payment_cents == 123114"
            - "PackageQuote.${q2}.final_apr_bp == 1690"
            - "PackageQuote.${q2}.monthly_payment_cents == 125823"
            - "PackageQuote.${q2}.verified_credit_score == 668"
            - "PackageQuote.${q2}.quote_state == APPROVED"
            - "PackageQuote.${q2}.decided_by_user_id == u-cm-01"

  - rule_id: combinatorial_formula
    instances:
      - name: quote_line_rounding_order_pinned_per_line_then_sum
        grounds:
          - calculations.quote_line_total
          - calculations.quote_money_rollup
          - entities.QuoteLine.fields.payment_surcharge_cents
          - entities.QuoteLine.fields.line_total_cents
          - entities.PackageQuote.fields.line_subtotal_cents
          - concurrency_rules[quote-line-create-stale-quote]
        distinguishing_aspect: |
          Mode (b) — order of operations: (780000 + 12500) * 3 * 0.9750 = 2318062.5 rounds once to 2318063, while
          rounding the discounted unit price first (772687.5 -> 772688) and then multiplying by 3 gives 2318064;
          the surcharge must also sit inside the quantity multiplication rather than being added after it.
        test_recipe:
          setup:
            - "MachineModel VND-40-C (VENDED, 40 lb, payment_module_options COIN/CARD/MOBILE, list 780000)"
            - "MachineModel OPL-60-A (ON_PREMISES, payment_module_options empty, list 1250000)"
            - "Distributor D-01 in PENDING_TRAINING (quote drafting does not require authorization)"
            - "PackageQuote in DRAFT with package_discount_pct 5.00 and freight_cents 250000"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-40-C", product_line: "VENDED", capacity_rating_lb: 40, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN", "CARD", "MOBILE"], list_price_cents: 780000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m2: $.data.id }
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "TERM_60", down_payment_cents: 0, package_discount_pct: 5.00, freight_cents: 250000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1: $.data.id, q1_v0: $.data.version }
          trigger:
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m2}", quantity: 3, payment_module: "CARD", line_discount_pct: 2.50, expected_quote_version: "${q1_v0}" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { ln1: $.data.id }
            - call: "GET /clm/quotes/${q1}"
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1_v1: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m1}", quantity: 2, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q1_v1}" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { ln2: $.data.id }
          assert:
            - "QuoteLine.${ln1}.unit_price_cents == 780000"
            - "QuoteLine.${ln1}.payment_surcharge_cents == 12500"
            - "QuoteLine.${ln1}.line_total_cents == 2318063"
            - "QuoteLine.${ln1}.line_total_cents != 2318064 (per-unit rounding order)"
            - "QuoteLine.${ln2}.payment_surcharge_cents == 0"
            - "QuoteLine.${ln2}.line_total_cents == 2500000"
            - "PackageQuote.${q1}.line_count == 2"
            - "PackageQuote.${q1}.line_subtotal_cents == 4818063"
            - "PackageQuote.${q1}.discount_cents == 240903"
            - "PackageQuote.${q1}.total_cents == 4827160"

      - name: financing_origination_fee_tier_keyed_on_pre_fee_principal
        grounds:
          - calculations.financing_terms
          - entities.PackageQuote.fields.origination_fee_cents
          - entities.PackageQuote.fields.financed_principal_cents
          - state_machines.PackageQuote.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — which input drives the tier selection: the 2.50% tier is chosen from pre_fee_principal_cents
          4950000 (<= 5000000) giving fee 123750 and financed 5073750, whereas keying the tier on the resulting
          financed principal 5073750 (> 5000000 -> 1.75%) would give 86625 / 5036625; the fee never re-tiers on
          the number it produces.
        test_recipe:
          setup:
            - "Distributor D-01 AUTHORIZED"
            - "PackageQuote in DRAFT, TERM_60, down_payment_cents 500000, freight_cents 450000, one line of 4 x OPL-60-A -> total_cents 5450000"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-202", full_name: "Sam Poe", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t202: $.data.id }
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Wash Barn LLC", laundromat_site_code: "SITE-88", stated_credit_score: 715, financing_program: "TERM_60", down_payment_cents: 500000, package_discount_pct: 0.00, freight_cents: 450000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q2: $.data.id, q2_v0: $.data.version }
            - call: "POST /clm/quotes/${q2}/lines"
              payload: { model_id: "${m1}", quantity: 4, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q2_v0}" }
              as: Distributor
              as_user_id: "${dist}"
          trigger:
            - call: "POST /clm/quotes/${q2}/submit"
              as: Distributor
              as_user_id: "${dist}"
          assert:
            - "PackageQuote.${q2}.line_subtotal_cents == 5000000"
            - "PackageQuote.${q2}.discount_cents == 0"
            - "PackageQuote.${q2}.total_cents == 5450000"
            - "PackageQuote.${q2}.origination_fee_cents == 123750"
            - "PackageQuote.${q2}.origination_fee_cents != 86625 (tier keyed on the post-fee principal)"
            - "PackageQuote.${q2}.financed_principal_cents == 5073750"
            - "PackageQuote.${q2}.provisional_apr_bp == 1590"
            - "PackageQuote.${q2}.provisional_monthly_payment_cents == 123114"
            - "PackageQuote.${q2}.quote_state == SUBMITTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: build_order_rework_cycle_returns_to_on_floor
        grounds:
          - state_machines.BuildOrder.QA_HOLD_to_REWORK
