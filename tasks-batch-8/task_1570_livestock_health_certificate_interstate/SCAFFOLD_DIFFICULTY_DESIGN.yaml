              as: StateVetOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CERTIFICATE_NOT_PENDING_REVIEW' (state, priority 6)"
            - "error_id != 'ERR_PREMISES_DISEASE_HOLD' even though the premises is QUARANTINE_HOLD (priority 7 loses)"

      - name: referential_mismatch_beats_temporal_expiry
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair business_referential-vs-business_temporal (a different category
          pair from the state/safety instance): a certificate citing another
          premises' test that is ALSO past its validity window must surface
          ERR_TEST_RECORD_MISMATCH (priority 8), not ERR_TEST_VALIDITY_EXPIRED
          (priority 9).
        test_recipe:
          setup:
            - "Premises A (Yolo, certificate origin) and premises B (Fresno); matrix row validity 30d"
            - "NEGATIVE test on premises B with test_date 2026-06-26 (45 days before inspection 2026-08-10 -> expired)"
            - "Certificate on premises A cites premises B's test record"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch A", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
