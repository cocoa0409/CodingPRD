  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: run_completion_storage_activation_cascade
        grounds:
          - state_machines.DryerRun.IN_PROGRESS_to_COMPLETED
          - state_machines.GrainLot.DRYING_to_STORED
          - state_machines.StorageAgreement.RESERVED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /dryer-runs/{id}/complete:
          (1) run completion mutates the lot (final weights, DRYING->DRIED
          weight state); (2) the lot's mutation activates the RESERVED
          agreement (baseline_bushels 161.61, start_date = completion date);
          (3) the agreement's activation moves the lot to STORED. Each link is
          caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Customer, tariff, unit, clock; lot tested and QUEUED; StorageAgreement created while lot QUEUED -> RESERVED"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/storage-agreements", payload: { lot_id: "${lot}", daily_rate_cents_per_bu: 0.15, min_days: 7 }, as: ElevatorManager, captures: { agmt: $.data.id, agmt_st: $.data.status } }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lot}", queue_ticket_id: "${tick}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { run: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${run}/start", payload: { meter_start_therms: 1200.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ElevatorManager }
          trigger:
            - { call: "POST /grain-drying/dryer-runs/${run}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, meter_end_therms: 1265.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "GET /grain-drying/storage-agreements/${agmt}", as: ElevatorManager, captures: { agmt_st2: $.data.status, agmt_bu: $.data.baseline_bushels, agmt_start: $.data.start_date } }
            - { call: "GET /grain-drying/grain-lots/${lot}", as: ElevatorManager, captures: { lot_st: $.data.status, lot_dw: $.data.final_dry_weight_lbs } }
            - { call: "GET /grain-drying/queue-tickets/${tick}", as: ElevatorManager, captures: { tick_st: $.data.status } }
          assert:
            - "StorageAgreement.${agmt}.status before completion == RESERVED"
            - "DryerRun.${run}.status == COMPLETED"
            - "StorageAgreement.${agmt}.status after completion == ACTIVE (link 2 caused by link 1)"
            - "StorageAgreement.${agmt}.baseline_bushels == 161.61 (round_half_up(9050/56, 2))"
            - "StorageAgreement.${agmt}.start_date == 2026-09-05"
            - "GrainLot.${lot}.status == STORED (link 3 caused by link 2)"
            - "GrainLot.${lot}.final_dry_weight_lbs == 9050"
            - "QueueTicket.${tick}.status == CONSUMED"

