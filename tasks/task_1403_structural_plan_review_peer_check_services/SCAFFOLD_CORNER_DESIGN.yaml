            - "${err} == ERR_INSUFFICIENT_PERMISSIONS"
            - "ReviewRecord.${rec_id}.status == DRAFT"

      - name: chief_reviewer_waive_success
        claim_type: role_exclusive_positive
        grounds: ["roles[ChiefReviewer]", state_machines.DeficiencyComment.OPEN_to_WAIVED]
        distinguishing_aspect: "The ChiefReviewer exclusive operation succeeds when the chief is NOT the reviewer of record: MINOR OPEN comment -> WAIVED, unresolved count drops to 0, justification stored implicitly via the transition."
        test_recipe:
          setup: ["cycle IN_REVIEW with one MINOR OPEN comment; chief is a different reviewer entity"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Of Record", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE42", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Chief", licenses: [{ state_code: "CA", license_type: "SE", license_number: "SE7", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { chief_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Waive OK", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://wv-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc}", code_section_ref: "1603.1", reference_edition: "IBC_2021", severity: "MINOR", category: "DETAILING", comment_text: "sheet note wording" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com: $.data.id }
          trigger:
            - call: "POST /plan-review/comments/${com}/waive"
              payload: { justification: "editorial comment, no code impact" }
              as: ChiefReviewer
              as_user_id: "${chief_id}"
          assert:
            - "DeficiencyComment.${com}.status == WAIVED"
            - "Engagement.${eng_id}.unresolved_comment_count == 0"

      - name: applicant_opens_resubmittal_cycle
        claim_type: role_shared_positive
        grounds: ["roles[Applicant]", "endpoints[POST /plan-review/cycles]"]
        distinguishing_aspect: "Covered by a §1.8 instance whose trigger opens the revision cycle as Applicant."
        excluded_because:
          difficulty_instance: engagement_revision_loop_in_progress_approved_in_progress
          rationale: "That instance's first trigger call is POST /plan-review/cycles as Applicant — the shared-permission positive path is asserted there."

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: assignment_create_stale_cycle_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-cycle]", "errors[ERR_STALE_CYCLE_VERSION]"]
        distinguishing_aspect: "OCC on ReviewCycle.version: after a first assignment bumps the version to 2, a second create carrying the stale captured version is rejected 412 with no side effects (no reassignment, no count change)."
        test_recipe:
          setup: ["cycle OPEN at version 1 (captured at creation); two licensed reviewers available"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "OCC One", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE43", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev1: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "OCC Two", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE44", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev2: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "OCC", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev1}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://occ-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev1}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
              captures: { asg1: $.data.id }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev2}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /plan-review/cycles/${cyc}"
              payload: {}
              as: ReviewCoordinator
              captures: { cyc_after_v: $.data.version }
            - call: "GET /plan-review/reviewers/${rev2}"
              payload: {}
              as: ReviewCoordinator
              captures: { rev2_load: $.data.active_assignment_count }
          assert:
            - "first assignment succeeded and bumped the cycle: ${cyc_after_v} == 2"
            - "${err} == ERR_STALE_CYCLE_VERSION (412)"
            - "${rev2_load} == 0 (loser's side effects did not run: no assignment, no release of ${asg1})"
            - "ReviewAssignment.${asg1}.status == ACTIVE (the legitimate assignment is untouched)"

      - name: jurisdiction_update_does_not_repin_existing_engagements
        claim_type: version_pinning_on_approval
        grounds: [entities.Engagement.fields.pinned_ibc_edition, "endpoints[PUT /plan-review/jurisdictions/{id}]"]
        distinguishing_aspect: "Version-pinning: after the jurisdiction moves to IBC_2024, the pre-existing engagement still pins IBC_2021 (and accepts IBC_2021 comments), while a newly created engagement pins IBC_2024 and rejects IBC_2021 citations."
        test_recipe:
          setup: ["jurisdiction created on IBC_2021; engagement E1 created before the update; jurisdiction updated to IBC_2024; engagement E2 created after; both with IN_REVIEW cycles"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Pin Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE45", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Old Pin", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng1: $.data.id }
            - call: "PUT /plan-review/jurisdictions/${jur_id}"
              payload: { ibc_edition: "IBC_2024" }
              as: PlatformAdmin
            - call: "POST /plan-review/engagements"
              payload: { project_name: "New Pin", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng2: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng1}", documents_ref: "s3://pin-old" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng2}", documents_ref: "s3://pin-new" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "old edition citation on old engagement" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com_old: $.data.id }
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc2}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "old edition citation on new engagement" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Engagement.${eng1}.pinned_ibc_edition == IBC_2021 (snapshot survives the jurisdiction update)"
            - "Engagement.${eng2}.pinned_ibc_edition == IBC_2024"
            - "${com_old} created with status OPEN (pinned edition still governs E1)"
            - "${err} == ERR_CODE_EDITION_MISMATCH (E2 requires IBC_2024 citations)"

      - name: cascade_approve_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.ReviewCycle.IN_REVIEW_to_APPROVED]
        distinguishing_aspect: "Covered by the §1.8 approve cascade instance."
        excluded_because:
          difficulty_instance: approve_cascade_cycle_to_engagement_to_record
          rationale: "Depth-3 approve chain asserted there end to end."
      - name: cascade_cancel_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Engagement.IN_PROGRESS_to_CANCELLED]
        distinguishing_aspect: "Covered by the §1.8 cancel cascade instance."
        excluded_because:
          difficulty_instance: cancel_cascade_engagement_to_cycle_to_assignment
          rationale: "Depth-3 cancel chain asserted there end to end."
      - name: capacity_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.reviewer_active_load]
        distinguishing_aspect: "Covered by the §1.8 capacity boundary instance."
        excluded_because:
          difficulty_instance: capacity_rejects_exactly_at_max
          rationale: "The >= boundary is asserted there at max-1 and max."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutations_immediately_visible_in_reads
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a comment creation is visible in the engagement's computed count on the very next GET, and an approval is visible in both the cycle and the auto-created record without any reconciliation delay."
        test_recipe:
          setup: ["cycle IN_REVIEW with zero comments"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Consistency Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE46", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Consistency", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://con-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "immediate check" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com: $.data.id }
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { count_now: $.data.unresolved_comment_count }
          assert:
            - "${count_now} == 1 (the write is visible in the computed field on the immediate next read)"
            - "DeficiencyComment.${com}.raised_by_reviewer_id == ${rev_id} (system attribution stored atomically with the create)"
            - "Engagement.${eng_id}.updated_at advanced past its creation timestamp (mutation refreshes common fields)"
