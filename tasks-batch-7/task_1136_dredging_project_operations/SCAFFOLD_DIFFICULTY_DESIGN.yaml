  - rule_id: transitive_cascade
    instances:
      - name: species_sighting_cascade_depth4
        grounds:
          - state_machines.SpeciesSighting.transitions
          - state_machines.DredgeEvent.ACTIVE_to_SHUTDOWN
          - calculations.compliance_posture
          - entities.DredgeEvent.fields.shutdown_accumulated_hours
        distinguishing_aspect: |
          Depth-4 chain from sighting creation: sighting ACTIVE mutates Project.compliance_posture to SUSPENDED
          (link 1); the posture mutation flips every ACTIVE DredgeEvent to SHUTDOWN with reason SPECIES (link 2);
          each shutdown opens an accruing shutdown interval (link 3); the accumulated hours make a SPECIES_SHUTDOWN
          StandbyClaim approvable for exactly 6.0 payable hours (link 4). Trigger differs from the sibling's
          ticket-confirm origin.
