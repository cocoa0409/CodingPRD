  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: upgrade_paid_installment_count_exactly_twelve_vs_eleven
        grounds:
          - calculations.upgrade_eligibility_ratio
          - calculations.payment_waterfall_allocation
          - validations.priority_100_ERR_UPGRADE_THRESHOLD_NOT_MET
          - entities.UpgradeRequest.fields.eligibility_ratio_bps
          - endpoints.POST_/upgrade-requests
        distinguishing_aspect: |
          Boundary on the metric paid_installment_count / eligibility_ratio_bps against
          UPGRADE_PAID_RATIO_BPS 5000, reached through POST /upgrade-requests. The fixture is
          one cent short of the twelfth installment: a PAYMENT of 56939 leaves installment 12
          PARTIALLY_PAID at 4744 of 4745, so paid_installment_count is 11 and
          floor(11 * 10000 / 24) == 4583 < 5000 and the request must be refused; a further
          PAYMENT of exactly 1 flips installment 12 to PAID, making the ratio exactly 5000,
          and the identical request must now be accepted. Any implementation that counts
          partial installments, uses money-paid over money-owed (56939/113876 == 5000 bps
          also, which would wrongly pass), or compares with a strict > instead of >=, gets
          one of the two calls wrong.
        test_recipe:
          setup:
            - "PRIME customer with an ACTIVE Handset B loan originated 2026-08-01 (monthly_installment_cents 4745), handset ACTIVATED, and a single PAYMENT of 56939 posted."
            - "Clock advanced to 2027-06-27, exactly upgrade_window_opens_at; Handset A has capacity 2 and no reservations."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
