# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections/claim_types from
# references/claim-extraction-guide.md. excluded_because stubs cite §1.8 instances.
# Same seven-point per-instance contract and §1.5 lint gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_work_order_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.WorkOrder.fields.status
          - entities.WorkOrder.fields.version
          - endpoints
        distinguishing_aspect: "POST /work-orders with all required fields → 201; status=DRAFT, version=1, hazard_level=LOW, requires_permit=false, ledgers=0."
        test_recipe:
          setup:
            - "A service area exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "1 Oak St", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
          assert:
            - "HTTP 201"
            - "WorkOrder.${wo}.status == DRAFT"
            - "WorkOrder.${wo}.version == 1"
            - "WorkOrder.${wo}.hazard_level == LOW"
            - "WorkOrder.${wo}.requires_permit == false"
            - "WorkOrder.${wo}.labor_cost_accrued_cents == 0"
            - "WorkOrder.${wo}.disposal_cost_accrued_cents == 0"

      - name: get_work_order_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints
          - entities.WorkOrder.fields.site_address
        distinguishing_aspect: "GET /work-orders/{id} returns the stored work order with matching site_address and pricing_mode."
        test_recipe:
          setup:
            - "A work order exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "9 Maple Ave", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Client
              captures: { addr: $.data.site_address }
          assert:
            - "HTTP 200"
            - "WorkOrder.${wo}.site_address == '9 Maple Ave'"
            - "WorkOrder.${wo}.pricing_mode == HOURLY"

      - name: list_work_orders_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /work-orders returns array envelope with total_count and has_more; limit=1 paginates."
        test_recipe:
          setup:
            - "Two work orders exist in one area."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "A", pricing_mode: "PER_JOB" }
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "B", pricing_mode: "PER_JOB" }
              as: Dispatcher
          trigger:
            - call: "GET /work-orders?limit=1&offset=0"
              payload: {}
              as: Dispatcher
          assert:
            - "HTTP 200, response_type == array"
            - "data length == 1, total_count == 2, has_more == true"

      - name: get_work_order_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_WORK_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /work-orders/{random-uuid} → ERR_WORK_ORDER_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_WORK_ORDER_NOT_FOUND"

      - name: create_work_order_missing_required_field
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /work-orders missing pricing_mode → ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "A service area exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_work_order_invalid_pricing_mode_enum
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_ENUM]
          - entities.WorkOrder.fields.pricing_mode
        distinguishing_aspect: "POST /work-orders with pricing_mode='WEEKLY' (not in enum) → ERR_INVALID_ENUM 400."
        test_recipe:
          setup:
            - "A service area exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "WEEKLY" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_ENUM"

      - name: create_work_order_default_is_emergency_false
        claim_type: Defaults
        grounds:
          - entities.WorkOrder.fields.is_emergency
        distinguishing_aspect: "Omitting is_emergency → default false applied on the work order."
        test_recipe:
          setup:
            - "A service area exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
          assert:
            - "WorkOrder.${wo}.is_emergency == false"

      - name: computed_hazard_score_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.TreeAsset.fields.hazard_score
          - calculations.tree_hazard_score
        distinguishing_aspect: "hazard_score is source=computed; any client-supplied hazard_score in the tree create body is ignored and the server computes 10 for a small low-hazard tree."
        test_recipe:
          setup:
            - "A DRAFT work order exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Dogwood", dbh_inches: 10 }
              as: Arborist
              captures: { tree: $.data.id }
          assert:
            - "TreeAsset.${tree}.hazard_score == 10"
            - "TreeAsset.${tree}.hazard_tier == LOW"

      - name: create_tree_invalid_dbh_zero
        claim_type: Type Constraints
        grounds:
          - entities.TreeAsset.fields.dbh_inches
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST tree with dbh_inches=0 (constraint > 0) → ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "A DRAFT work order exists."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 0 }
              as: Arborist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_crew_bad_service_area_fk
        claim_type: Parent Relationships
        grounds:
          - entities.Crew.fields.service_area_id
          - errors[ERR_SERVICE_AREA_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "POST /crews with non-existent service_area_id → ERR_SERVICE_AREA_NOT_FOUND 404 (cross-reference integrity for flat topology)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /crews"
              payload: { service_area_id: "00000000-0000-4000-8000-000000000000", name: "Ghost", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_SERVICE_AREA_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: assess_with_no_trees_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WorkOrder.DRAFT_to_ASSESSED
          - errors[ERR_NO_TREES_ASSESSED]
          - validations[priority=8]
        distinguishing_aspect: "POST /assess on a DRAFT work order with zero trees → ERR_NO_TREES_ASSESSED 409; status stays DRAFT."
        test_recipe:
          setup:
            - "A DRAFT work order with no trees."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_NO_TREES_ASSESSED"
            - "WorkOrder.${wo}.status == DRAFT"

      - name: issue_empty_estimate_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Estimate.DRAFT_to_ISSUED
          - errors[ERR_ESTIMATE_EMPTY]
          - validations[priority=8]
        distinguishing_aspect: "POST /issue on an estimate with zero line items → ERR_ESTIMATE_EMPTY 409."
        test_recipe:
          setup:
            - "ASSESSED work order with a DRAFT estimate that has no line items."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 12 }
              as: Arborist
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_ESTIMATE_EMPTY"

      - name: cancel_already_completed_returns_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - errors[ERR_WORK_ORDER_TERMINAL]
          - validations[priority=7]
        distinguishing_aspect: "Cancelling a COMPLETED work order → ERR_WORK_ORDER_TERMINAL 409; no side effects fire."
        test_recipe:
          setup:
            - "A COMPLETED HOURLY work order (no bookings/tickets open at complete)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 12 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /work-orders/${wo}/complete"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_WORK_ORDER_TERMINAL"
            - "WorkOrder.${wo}.status == COMPLETED"

      - name: accept_estimate_not_issued_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Estimate.ISSUED_to_ACCEPTED
          - errors[ERR_ESTIMATE_NOT_ISSUED]
          - validations[priority=7]
        distinguishing_aspect: "Accept on a DRAFT (never-issued) estimate → ERR_ESTIMATE_NOT_ISSUED 409."
        test_recipe:
          setup:
            - "ASSESSED work order with a DRAFT estimate carrying one line item but not yet issued; no permit required (tree not protected)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 12 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
          trigger:
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_ESTIMATE_NOT_ISSUED"

      - name: permit_submit_when_not_required_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Permit.DRAFT_to_UNDER_REVIEW
          - errors[ERR_PERMIT_NOT_REQUIRED]
        distinguishing_aspect: "Submitting a permit on a work order whose requires_permit is false (no protected tree) → ERR_PERMIT_NOT_REQUIRED 409."
        test_recipe:
          setup:
            - "ASSESSED work order with only a non-protected tree (requires_permit false); a DRAFT permit was created."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000, requires_permit_authority: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 12 }
              as: Arborist
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/permits"
              payload: { authority_ref: "PRM-X" }
              as: Arborist
              captures: { permit: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/permits/${permit}/submit"
              payload: {}
              as: Arborist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_PERMIT_NOT_REQUIRED"

      - name: permit_deny_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_DENIED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=7]
        distinguishing_aspect: "request-changes on a DENIED (terminal) permit → ERR_INVALID_STATE_TRANSITION 409."
        test_recipe:
          setup:
            - "Permit on a protected-tree work order driven to DENIED."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000, requires_permit_authority: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Oak", dbh_inches: 30, is_protected: true }
              as: Arborist
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/permits"
              payload: { authority_ref: "PRM-D" }
              as: Arborist
              captures: { permit: $.data.id }
            - call: "POST /work-orders/${wo}/permits/${permit}/submit"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/permits/${permit}/decide"
              payload: { decision: "DENY" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo}/permits/${permit}/request-changes"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "Permit.${permit}.status == DENIED"

      - name: complete_with_open_reserved_booking_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
          - errors[ERR_OPEN_BOOKINGS]
        distinguishing_aspect: "Completing a SCHEDULED work order while a RESERVED booking remains → ERR_OPEN_BOOKINGS 409; status stays SCHEDULED."
        test_recipe:
          setup:
            - "SCHEDULED HOURLY work order with one RESERVED crew booking (never finalized/released)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /crews"
              payload: { service_area_id: "${area_id}", name: "Crew A", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Pine", dbh_inches: 12 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v_sched: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "CREW", crew_id: "${crew_id}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T12:00:00Z", expected_work_order_version: "${v_sched}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_OPEN_BOOKINGS"
            - "WorkOrder.${wo}.status == SCHEDULED"

      - name: accept_supersedes_sibling_issued_estimate
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Estimate.ISSUED_to_ACCEPTED
          - state_machines.Estimate.ISSUED_to_SUPERSEDED
        distinguishing_aspect: "Accepting one ISSUED estimate sets the sibling ISSUED estimate to SUPERSEDED and pins WorkOrder.accepted_estimate_id."
        test_recipe:
          setup:
            - "QUOTED work order (no permit required) with TWO ISSUED estimates E1 and E2 (work order stays QUOTED across multiple issues)."
          setup_api_calls:
            - call: "POST /service-areas"
