              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/authority/suspend"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W2", notice_mailed_on: "2026-02-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice_n1: $.data.id }
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v_susp: "$.data[0].version" }
          trigger:
            - call: "POST /cca/enrollment-notices/${notice_n1}/issue"
