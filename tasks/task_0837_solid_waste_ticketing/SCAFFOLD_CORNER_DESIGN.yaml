  - section: cross_cutting
    instances:
      - name: occ_stale_facility_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ticket-post-stale-facility]", "errors[ERR_STALE_FACILITY_VERSION]"]
        distinguishing_aspect: "Two INSPECTED tickets; posting the first advances Facility.version, so posting the second still carrying the pre-advance version (${fac_v_pre}) is rejected 412 ERR_STALE_FACILITY_VERSION."
        test_recipe:
          setup: ["Facility (airspace 500, one large cell) with two INSPECTED CONSTRUCTION_DEBRIS tickets and fac_v_pre captured before any post."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t1: $.data.id }
            - call: "POST /landfill/tickets/${t1}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t1}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t2: $.data.id }
            - call: "POST /landfill/tickets/${t2}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t2}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
