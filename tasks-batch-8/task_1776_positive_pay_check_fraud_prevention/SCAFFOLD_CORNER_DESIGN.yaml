      - name: monthly_billing_current_period_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_NOT_CLOSED]"]
        distinguishing_aspect: "Billing requires the period fully elapsed: billing 2026-08 while the clock is still in August fails."
