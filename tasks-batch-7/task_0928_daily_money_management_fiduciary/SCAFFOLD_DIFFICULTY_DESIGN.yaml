  # =======================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:

      - name: fraud_confirm_freezes_account_stops_payment_and_reopens_period
        grounds:
          - state_machines.FraudAlert.ACKNOWLEDGED_to_CONFIRMED_FRAUD
          - state_machines.ClientAccount.NORMAL_to_FROZEN
          - state_machines.Payment.settlement_status.IN_FLIGHT_to_STOPPED
          - state_machines.ReconciliationPeriod.IN_REVIEW_to_OPEN
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          A five-link chain where every link is caused by the previous one and
          not by the original request - confirming the alert freezes the
          account, the FREEZE alone stops the in-flight payment, the STOP alone
          appends the stop-payment-fee ledger entry, that ENTRY alone raises
          the period's unreconciled_entry_count, and that COUNTER alone reverts
          the period from IN_REVIEW back to OPEN. Trigger is a fraud
          adjudication.
