        grounds: ["errors[ERR_CAMPAIGN_NOT_OPEN]", "validations[priority=7]"]
        distinguishing_aspect: "Placing a preorder against a DRAFT campaign rejects with ERR_CAMPAIGN_NOT_OPEN before any deposit math."
