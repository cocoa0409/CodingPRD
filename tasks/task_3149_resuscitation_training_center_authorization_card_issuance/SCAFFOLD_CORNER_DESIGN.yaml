            - "GET /aha/training-centers/${center_id}/course-sessions returns 0 rows"

      - name: instructor_cannot_certify_candidate_returns_forbidden
        claim_type: rbac_denial
        grounds:
          - roles.Instructor
          - roles.TCAdmin.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Certification decisions belong to TCAdmin; even the session-lead Instructor role cannot certify, receiving 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center, legacy faculty, and a MONITORED candidate with two evaluations."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - call: "POST /aha/instructors"
              payload: { full_name: "Carl Candidate", email: "carl@x.example", discipline: "BLS", home_training_center_id: "${center_id}" }
              as: NationalAdmin
              captures: { cand_id: $.data.id }
            - call: "POST /aha/instructors/${cand_id}/monitor"
              payload: { monitored_at: "2026-09-05T00:00:00Z", course_type_observed: "BLS_PROVIDER", outcome: "SATISFACTORY" }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 5, notes: "Strong." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 5, notes: "Strong again." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
          trigger:
            - call: "POST /aha/instructors/${cand_id}/certify"
              payload: {}
              as: Instructor
              as_user_id: "${faculty_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "Instructor.${cand_id}.status is still MONITORED"

      - name: national_admin_bootstraps_legacy_certified_instructor
        claim_type: rbac_grant
        grounds:
          - roles.NationalAdmin.exclusive_operations
          - entities.Instructor.fields.legacy_certified
        distinguishing_aspect: "The legacy_certified bootstrap is NationalAdmin-only and produces a CERTIFIED instructor with certified_since == clock and renewal_due_at == clock + 24 months without any monitoring or evaluations."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One training center."
          setup_api_calls:
            - *c_clock
            - *c_center
          trigger:
