          - entities.Solicitation.fields.reopen_round
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The solicitation machine is cyclic: REOPEN takes EVALUATING back to OPEN, bumps
          reopen_round to 1, replaces bid_due_at with new_bid_due_at, and leaves already recorded
          responsiveness untouched so a late bidder can join the same evaluation round.
