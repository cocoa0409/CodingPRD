# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Medicaid MCO Encounter Reporting
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_created_with_documented_defaults
        claim_type: defaults
        grounds: [entities.Program.fields.completeness_threshold, entities.Program.fields.posture]
        distinguishing_aspect: "Omitting every optional threshold yields the documented defaults and derived initial state."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-DEF", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "GET /programs/${prog_id}", as: StateAgency }
          assert:
            - "completeness_threshold == 0.98, accuracy_threshold == 0.95, provider_yellow_threshold == 0.02, provider_red_threshold == 0.05, penalty_cap_percent == 0.1"
            - "posture == OPEN, penalties_outstanding_cents == 0, version == 1"

      - name: program_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Program, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the envelope error ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: StateAgency, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: member_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member.fields.aid_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs/members without aid_category is rejected before any persistence."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-REQ", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
            - "GET /programs/members?program_id=${prog_id} returns total_count == 0"

      - name: encounter_attributed_cycle_is_server_computed
        claim_type: computed_fields
        grounds: [entities.Encounter.fields.attributed_cycle_id]
        distinguishing_aspect: "attributed_cycle_id is computed from service_from_date against cycle windows, never taken from input."
        test_recipe:
          setup: ["Program; August cycle; member; provider"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-ATTR", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-31", service_to_date: "2026-08-31", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 5000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 5000, paid_amount_cents: 5000 }] }, as: McoEncounterOps, captures: { e1: $.data.id, attr: $.data.attributed_cycle_id } }
          assert:
            - "Encounter.${e1}.attributed_cycle_id == ${cyc_id} (service date 2026-08-31 is inside the half-open window)"
            - "Encounter.${e1}.status == RECEIVED and correction_sequence == 0 and validation_run_seq == 0"

      - name: cycle_effective_deadline_defaults_to_submission_deadline
        claim_type: computed_fields
        grounds: [entities.SubmissionCycle.fields.effective_deadline_at, entities.SubmissionCycle.fields.extension_status]
        distinguishing_aspect: "Before any extension action, effective_deadline_at mirrors submission_deadline_at and extension_status is NONE."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-EFF", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
          assert:
            - "SubmissionCycle.${cyc_id}.effective_deadline_at == 2026-09-15T00:00:00Z"
            - "SubmissionCycle.${cyc_id}.extension_status == NONE and status == OPEN"

      - name: encounter_lines_reverse_reachable_and_immutable
        claim_type: immutability
        grounds: [entities.EncounterLine, entities.EncounterLine.fields.encounter_id]
        distinguishing_aspect: "Lines are readable via the encounter sub-resource and carry no version/updated_at (common_fields false)."
        test_recipe:
          setup: ["Program; August cycle; member; provider; one encounter with one line"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-LINE", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 7000, lines: [{ line_number: 1, procedure_code: "99213", units: 2, billed_amount_cents: 7000, paid_amount_cents: 7000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
          trigger:
            - { call: "GET /programs/encounters/${e1}/lines", as: McoEncounterOps }
          assert:
            - "response contains exactly 1 line with procedure_code == 99213, units == 2, paid_amount_cents == 7000"
            - "line objects have id and created_at but no version field (immutable child rows)"

      - name: providers_list_scoped_by_program_with_pagination_envelope
        claim_type: listing
        grounds: [entities.Provider.fields.program_id, response_envelope]
        distinguishing_aspect: "List endpoint filters by program_id and always returns the fixed pagination fields."
        test_recipe:
          setup: ["Two programs A and B; one provider in each"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-LA", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { pa: $.data.id } }
            - { call: "POST /programs", payload: { name: "P-LB", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { pb: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${pa}", npi: "1111111111", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_a: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${pb}", npi: "2222222222", taxonomy_code: "207Q00000X" }, as: McoEncounterOps }
          trigger:
            - { call: "GET /programs/providers?program_id=${pa}", as: McoEncounterOps }
          assert:
            - "total_count == 1 and the single row is ${prov_a}"
            - "response carries limit, offset, total_count, has_more and has_more == false"

  - section: state_machines
    instances:
      - name: validate_from_validated_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Encounter.RECEIVED_to_VALIDATED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "validate is only legal from RECEIVED; re-validating a VALIDATED encounter fails and records no new run."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 VALIDATED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409)"
            - "Encounter.${e1}.validation_run_seq remains 1 and status remains VALIDATED"

      - name: void_from_validated_returns_not_voidable
        claim_type: precondition_enforcement
        grounds: [state_machines.Encounter.ACKNOWLEDGED_to_VOIDED, "errors[ERR_ENCOUNTER_NOT_VOIDABLE]"]
        distinguishing_aspect: "Void is gated to ACKNOWLEDGED; a VALIDATED encounter cannot be voided."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 VALIDATED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/encounters/${e1}/void", payload: { void_reason: "duplicate" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENCOUNTER_NOT_VOIDABLE"
            - "Encounter.${e1}.status remains VALIDATED"

      - name: replace_from_received_returns_not_replaceable
        claim_type: precondition_enforcement
        grounds: [state_machines.Encounter.DENIED_to_SUPERSEDED, "errors[ERR_ENCOUNTER_NOT_REPLACEABLE]"]
        distinguishing_aspect: "Replace is legal only from DENIED or ACKNOWLEDGED; a fresh RECEIVED encounter rejects it."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 in RECEIVED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM3", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters/${e1}/replace", payload: { encounter_ref: "E1R", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENCOUNTER_NOT_REPLACEABLE"
            - "Encounter.${e1}.status remains RECEIVED"

      - name: terminal_voided_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Encounter.ACKNOWLEDGED_to_VOIDED]
        distinguishing_aspect: "VOIDED is terminal: a second void and a validate both fail on a voided encounter."
        test_recipe:
          setup: ["Full pipeline: e1 ACKNOWLEDGED then VOIDED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM4", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/encounters/${e1}/void", payload: { void_reason: "submitted in error" }, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/encounters/${e1}/void", payload: { void_reason: "again" }, as: McoEncounterOps, captures: { err1: $.data.error_id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps, captures: { err2: $.data.error_id } }
            - { call: "GET /programs/cycles/${cyc_id}", as: StateAgency, captures: { net_n: $.data.net_accepted_encounter_count, net_p: $.data.net_accepted_paid_cents } }
          assert:
            - "second void fails with ERR_ENCOUNTER_NOT_VOIDABLE"
            - "validate on VOIDED fails with ERR_INVALID_STATE_TRANSITION"
            - "cycle nets after the void: net_accepted_encounter_count == 0 and net_accepted_paid_cents == 0"

      - name: seal_empty_batch_returns_empty_batch
        claim_type: precondition_enforcement
        grounds: [state_machines.SubmissionBatch.DRAFT_to_SEALED, "validations[priority=26]", "errors[ERR_EMPTY_BATCH]"]
        distinguishing_aspect: "Seal requires encounter_count >= 1; sealing a fresh DRAFT fails with ERR_EMPTY_BATCH."
        test_recipe:
          setup: ["Program; cycle; empty DRAFT batch"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM5", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMPTY_BATCH"
            - "SubmissionBatch.${b_id}.status remains DRAFT and sealed_encounter_count is null"

      - name: unseal_reverts_seal_and_clears_snapshot
        claim_type: valid_transition
        grounds: [state_machines.SubmissionBatch.SEALED_to_DRAFT, calculations.batch_seal_totals]
        distinguishing_aspect: "SEALED -> DRAFT revert keeps encounters staged but nulls the frozen seal snapshot so staging can resume."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 VALIDATED staged; batch sealed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-SM6", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 4000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 4000, paid_amount_cents: 4000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
