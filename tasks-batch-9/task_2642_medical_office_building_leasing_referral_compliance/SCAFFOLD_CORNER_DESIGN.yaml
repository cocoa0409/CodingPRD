              captures: { y3_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${y3_b_id}", suite_id: "${y3_s_id}", tenant_id: "${y3_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { y3_l_id: $.data.id }
            - call: "POST /leases/${y3_l_id}/ti-projects"
              payload: { suite_id: "${y3_s_id}", target_suite_class: "PROCEDURE", power_amps_requested: 120, medical_gas_requested: false, authorized_allowance_total: 100000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { y3_p_id: $.data.id, y3_v1: $.data.version }
          trigger:
            - call: "POST /ti-projects/${y3_p_id}/line-items"
              payload: { expected_ti_project_version: "${y3_v1}", description: "Procedure room casework", category: "FINISHES", cost_amount: 50000.00 }
              as: LeasingAgent
            - call: "GET /ti-projects/${y3_p_id}"
              payload: {}
              as: LeasingAgent
              captures: { y3_v2: $.data.version }
            - call: "POST /ti-projects/${y3_p_id}/line-items"
              payload: { expected_ti_project_version: "${y3_v1}", description: "Replay of a stale read", category: "POWER", cost_amount: 50000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${y3_p_id}/line-items"
              payload: { expected_ti_project_version: "${y3_v2}", description: "Panel upgrade", category: "POWER", cost_amount: 50000.00 }
              as: LeasingAgent
              captures: { y3_v3: $.data.version }
            - call: "POST /ti-projects/${y3_p_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Design set complete" }
              as: LeasingAgent
            - call: "POST /ti-projects/${y3_p_id}/line-items"
              payload: { expected_ti_project_version: "${y3_v3}", description: "Late scope with a stale read", category: "PLUMBING", cost_amount: 5000.00 }
              as: LeasingAgent
            - call: "GET /ti-projects/${y3_p_id}"
              payload: {}
              as: LeasingAgent
              captures: { y3_v4: $.data.version }
            - call: "POST /ti-projects/${y3_p_id}/line-items"
              payload: { expected_ti_project_version: "${y3_v4}", description: "Late scope with a current read", category: "PLUMBING", cost_amount: 5000.00 }
              as: LeasingAgent
            - call: "GET /ti-projects/${y3_p_id}/line-items"
              payload: {}
              as: LeasingAgent
          assert:
            - "${y3_v1} == 1; the first line item returns 201 and the project reads back at version 2 (${y3_v2} == 2) with line_item_count == 1, landlord_committed_amount == 30000.00 and allowance_remaining == 70000.00"
            - "Replaying ${y3_v1} returns 412 with data.error_id == 'ERR_STALE_TI_PROJECT_VERSION' and line_item_count stays 1"
            - "The line item carrying ${y3_v2} returns 201; ${y3_v3} == 3, line_item_count == 2, landlord_committed_amount == 60000.00, tenant_committed_amount == 40000.00, allowance_remaining == 40000.00"
            - "SUBMIT_REVIEWS returns 200 with status == IN_REVIEW, shielding_review_status == PENDING, utility_review_status == PENDING and version 4 (${y3_v4} == 4)"
            - "The line item carrying the now-stale ${y3_v3} returns 412 ERR_STALE_TI_PROJECT_VERSION — priority 12 answers first and the caller never learns the project has left DESIGN"
            - "The identical line item carrying the current ${y3_v4} returns 409 with data.error_id == 'ERR_INVALID_TI_STATE'"
            - "GET /ti-projects/${y3_p_id}/line-items returns meta.total_count == 2 with sequence_no 1 and 2 — neither refused append was persisted and no sequence number was consumed"

      - name: cancelling_a_project_zeroes_the_rollups_but_keeps_the_line_items
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines[TenantImprovementProject].transitions[IN_REVIEW -> CANCELLED].side_effects
          - state_machines[TenantImprovementProject].transitions[DESIGN -> CANCELLED].side_effects
          - entities.TenantImprovementProject.fields.allowance_remaining
          - entities.TILineItem
        distinguishing_aspect: "Cancellation resets the three money rollups to their zero state and hands the amperage back to the suite, yet line_item_count and the immutable TILineItem rows — with their originally resolved landlord_share_amount values — survive untouched, so the project's own derived totals no longer equal the sum of its children."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite carrying 200 available amps, one tenant and one DRAFT lease."
            - "One PROCEDURE TI project, allowance 100000.00 at a 0.60 landlord share, requesting 120 amps and no medical gas."
            - "Two line items — 40000.00 FINISHES and 30000.00 POWER — then SUBMIT_REVIEWS and a UTILITY approval, leaving shielding PENDING so the project sits in IN_REVIEW."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { y4_b_id: $.data.id }
            - call: "POST /buildings/${y4_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { y4_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568621" }
              as: PortfolioAdmin
              captures: { y4_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${y4_b_id}", suite_id: "${y4_s_id}", tenant_id: "${y4_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { y4_l_id: $.data.id }
            - call: "POST /leases/${y4_l_id}/ti-projects"
              payload: { suite_id: "${y4_s_id}", target_suite_class: "PROCEDURE", power_amps_requested: 120, medical_gas_requested: false, authorized_allowance_total: 100000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { y4_p_id: $.data.id, y4_v1: $.data.version }
            - call: "POST /ti-projects/${y4_p_id}/line-items"
              payload: { expected_ti_project_version: "${y4_v1}", description: "Procedure room casework", category: "FINISHES", cost_amount: 40000.00 }
              as: LeasingAgent
              captures: { y4_li1_id: $.data.id }
            - call: "GET /ti-projects/${y4_p_id}"
              payload: {}
              as: LeasingAgent
              captures: { y4_pv2: $.data.version }
            - call: "POST /ti-projects/${y4_p_id}/line-items"
              payload: { expected_ti_project_version: "${y4_pv2}", description: "Sub-panel and feeders", category: "POWER", cost_amount: 30000.00 }
              as: LeasingAgent
              captures: { y4_li2_id: $.data.id }
            - call: "POST /ti-projects/${y4_p_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Design set complete" }
              as: LeasingAgent
            - call: "POST /ti-projects/${y4_p_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "120 amps available and reserved" }
              as: FacilitiesEngineer
          trigger:
            - call: "GET /ti-projects/${y4_p_id}"
              payload: {}
              as: LeasingAgent
            - call: "GET /suites/${y4_s_id}"
              payload: {}
              as: LeasingAgent
            - call: "POST /ti-projects/${y4_p_id}/transitions"
              payload: { action: "CANCEL", note: "Tenant withdrew the scope" }
              as: LeasingAgent
            - call: "GET /ti-projects/${y4_p_id}"
              payload: {}
              as: LeasingAgent
            - call: "GET /suites/${y4_s_id}"
              payload: {}
              as: LeasingAgent
            - call: "GET /ti-projects/${y4_p_id}/line-items"
              payload: {}
              as: LeasingAgent
          assert:
            - "Before the cancellation: status == IN_REVIEW, utility_review_status == APPROVED, shielding_review_status == PENDING, line_item_count == 2, landlord_committed_amount == 42000.00, tenant_committed_amount == 28000.00, allowance_remaining == 58000.00, power_amps_drawn == 120"
            - "Before the cancellation Suite.${y4_s_id}.power_amps_available == 80 — 200 minus the 120 the utility approval reserved"
            - "The CANCEL returns 200 with status == CANCELLED"
            - "After the cancellation landlord_committed_amount == 0.00, tenant_committed_amount == 0.00 and allowance_remaining == 100000.00 — restored to authorized_allowance_total, not to 58000.00"
            - "After the cancellation power_amps_drawn == 0 and Suite.${y4_s_id}.power_amps_available == 200 — the reservation is compensated back to the pool"
            - "Suite.${y4_s_id}.suite_class is still STANDARD_EXAM and shielding_certified is still false: only a completion re-classes the suite, and the shielding branch never approved"
            - "line_item_count is still 2 and GET /ti-projects/${y4_p_id}/line-items returns meta.total_count == 2 with TILineItem.${y4_li1_id}.landlord_share_amount == 24000.00 and TILineItem.${y4_li2_id}.landlord_share_amount == 18000.00 — the children keep their resolved shares while the parent's rollups read 0.00"
            - "The rollups therefore no longer equal the sum of the children (0.00 versus 42000.00), which is the declared reset semantics and not a recomputation"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines[Lease].transitions[ACTIVE -> TERMINATED].side_effects
          - state_machines[RentInvoice].transitions[ISSUED -> DELINQUENT].side_effects
        excluded_because:
          difficulty_instance: lease_termination_cascades_through_building_posture_to_peer_lease_and_ti_hold
          rationale: "Both multi-hop cascades are asserted hop by hop there and in daily_close_delinquency_cascades_to_watch_case_concession_lock_and_booking_cancellation."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.effective_base_rent
          - calculations.referral_compliance_risk_score
        excluded_because:
          difficulty_instance: lease_rent_provisional_published_versus_certified_appraisal_divergence
          rationale: "Both variant pairs are asserted at a divergent input there and in tenant_risk_rolling_window_versus_strict_cumulative_divergence."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: writes_are_immediately_visible_and_the_clock_alone_changes_nothing
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /leases/{id}/execute]
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /_ops/run-daily-close]
        distinguishing_aspect: "Two halves of the same contract: a write's own response body already carries every field its cascade recomputed — no re-read, no settling delay, and a repeat GET returns identical values — while advancing the logical clock across a term start, a due date and a grace expiry changes nothing at all until run-daily-close is called explicitly."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite, one tenant and one FMV_CERTIFIED lease running 2026-09-01..2029-08-31 at 30.00 psf."
            - "The clock starts at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { z1_b_id: $.data.id }
            - call: "POST /buildings/${z1_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { z1_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568631" }
              as: PortfolioAdmin
              captures: { z1_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${z1_b_id}", suite_id: "${z1_s_id}", tenant_id: "${z1_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { z1_l_id: $.data.id }
            - call: "POST /leases/${z1_l_id}/compliance-attestations"
              payload: { attestation_type: "SIGNED_LEASE", on_file: true, document_reference: "LSE-2642-0090" }
              as: LeasingAgent
            - call: "POST /leases/${z1_l_id}/submit-fmv-review"
              payload: { submission_note: "Standard submission" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${z1_l_id}/certify-fmv"
              payload: { certification_note: "Within published band" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          trigger:
            - call: "POST /leases/${z1_l_id}/execute"
              payload: { execution_note: "Countersigned" }
              as: LeasingAgent
            - call: "GET /suites/${z1_s_id}"
              payload: {}
              as: LeasingAgent
            - call: "GET /buildings/${z1_b_id}"
              payload: {}
              as: LeasingAgent
            - call: "GET /buildings/${z1_b_id}"
              payload: {}
              as: LeasingAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "GET /leases/${z1_l_id}"
              payload: {}
              as: LeasingAgent
            - call: "POST /leases/${z1_l_id}/commence"
              payload: { commencement_note: "Keys delivered" }
              as: PropertyManager
            - call: "POST /leases/${z1_l_id}/rent-invoices"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", due_date: "2026-09-05" }
              as: PropertyManager
              captures: { z1_i_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PortfolioAdmin
            - call: "GET /leases/${z1_l_id}/rent-invoices"
              payload: {}
              as: PropertyManager
            - call: "GET /tenants/${z1_t_id}"
              payload: {}
              as: PropertyManager
            - call: "POST /_ops/run-daily-close"
              payload: { close_note: "Explicit close" }
              as: PortfolioAdmin
            - call: "GET /leases/${z1_l_id}/rent-invoices"
              payload: {}
              as: PropertyManager
            - call: "GET /tenants/${z1_t_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "The execute response body itself already reports status == EXECUTED — the caller needs no follow-up read to see its own write"
            - "The GET immediately after execute shows Suite.${z1_s_id}.occupancy_status == RESERVED with no intervening call"
            - "The GET immediately after execute shows Building.${z1_b_id}.leased_rentable_sf == 5000, vacant_rentable_sf == 95000, independent_rentable_sf == 5000, anchor_rentable_sf == 0, anchor_share_pct == 0.0000 and tenant_mix_posture == BALANCED"
            - "The second, identical GET /buildings returns the same version and the same six derived values — reads do not recompute or converge"
            - "Advancing the clock to 2026-09-01T00:00:00Z leaves Lease.${z1_l_id}.status == EXECUTED: passing term_start does not commence a lease, an explicit PropertyManager act does"
            - "Advancing the clock to 2026-09-20T00:00:00Z — 15 days past the 2026-09-05 due date and 5 days past the 10-day grace — leaves RentInvoice.${z1_i_id}.status == ISSUED with days_past_due_at_flag == null, and Tenant.${z1_t_id}.compliance_watch_status == CLEAR with referral_compliance_risk_score == 0"
            - "Only after POST /_ops/run-daily-close does the invoice read DELINQUENT with days_past_due_at_flag == 15 and delinquency_tier_weight == 15, and the tenant read referral_compliance_risk_score == 15 with compliance_watch_status == CLEAR (15 < the 45 watch threshold)"
            - "Every one of those post-close values is visible on the first read after the close returns, so the cascade is synchronous with the request that triggered it"
