            - call: "POST /agreements"
              payload: { territory_id: "00000000-0000-4000-8000-000000000001", distributor_id: "00000000-0000-4000-8000-000000000002", bakery_id: "${bakery_id}", purchase_price_cents: 1000000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2026-09-01", end_date: "2027-09-01" }
