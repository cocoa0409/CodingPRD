              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { st: $.data.status, occ: "$.data.lane_occupancy.A" }
            - call: "GET /orders/${order_id}"
