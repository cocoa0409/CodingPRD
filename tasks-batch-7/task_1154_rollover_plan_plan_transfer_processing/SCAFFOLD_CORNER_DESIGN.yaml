        grounds: ["calculations.vested_balance"]
        distinguishing_aspect: "Per-row floor before summing: an EMPLOYER_PRETAX row of 333,333 at 50% contributes floor(166,666.5) == 166,666 (not 166,667) — rounding-order pinned per row, never sum-then-round."
        test_recipe:
          setup: ["Plan A, P1, account with a single EMPLOYER_PRETAX 333,333 @ 50% row"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Vest Ing", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "EMPLOYER_PRETAX", balance_cents: 333333, basis_cents: 0, vested_pct: 50 } ] }, as: PlanSponsorAdmin, captures: { vested: "$.data.vested_balance_cents", tot: "$.data.total_balance_cents" } }
          assert:
            - "vested_balance_cents == 166666 (${vested}) — per-row floor, while total_balance_cents == 333333 (${tot})"

