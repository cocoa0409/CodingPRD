  - rule_id: non_linear_state_machine
    instances:

      - name: deployment_parallel_rollout_and_health_dimensions
        grounds:
          - state_machines.Deployment_rollout_state
          - state_machines.Deployment_health_state
          - state_machines.Deployment_rollout_state.RAMPING_to_HELD
          - state_machines.Deployment_rollout_state.HELD_to_RAMPING
          - state_machines.Deployment_health_state.HEALTHY_to_DEGRADED
          - state_machines.Deployment_health_state.DEGRADED_to_HEALTHY
          - calculations.traffic_ramp_step_plan
          - calculations.composite_health_score
        distinguishing_aspect: |
          Deployment carries TWO INDEPENDENT state dimensions that advance on different triggers
          and are read jointly by the ramp planner: rollout_state (PENDING -> RAMPING -self-loop-
          -> HELD -> RAMPING -> LIVE) and health_state (HEALTHY <-> DEGRADED -> CRITICAL). The
          non-linearity is that the RAMPING self-loop's arithmetic depends on the OTHER dimension
          (a DEGRADED ramp grants floor_2(raw/2) and does not advance the index), and that
          health recovers through a completely different endpoint (window close) than the one
          that moves the rollout dimension.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED ModelVersion on 'fs-v1' with baseline_accuracy 0.82, baseline_positive_rate 0.30, baseline_p95_latency_ms 200"
            - "one OPEN ServingEndpoint max_traffic_pct 100.00 and one REALTIME Deployment serve [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z)"
            - "the deployment ramped twice, so rollout_state RAMPING, traffic_pct 15.00, ramp_step_index 2, health_state HEALTHY"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
