  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: carrier_schedule_halfopen_pickup_window_overlap
        grounds:
          - validations[priority=11]
          - state_machines.ShipmentOrder.LISTED_to_DISPATCHED
          - entities.Assignment.fields.status
        distinguishing_aspect: |
          Carrier resource, HALF-OPEN pickup-window semantics: a carrier already
          DISPATCHED on order1 (window Jun1-Jun5) is rejected from a second dispatch
          on order2 (window Jun3-Jun7, interiors overlap) with ERR_CARRIER_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "One OPEN carrier dispatched to order1 (window Jun1-Jun5); order2 (window Jun3-Jun7) LISTED with a PENDING offer from the same carrier."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s15@x.com", full_name: "S Fifteen" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Ovl Carrier", mc_number: "MC-1515", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /shipment-orders/${order1_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order1_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { o1_vq: $.data.version }
            - call: "POST /shipment-orders/${order1_id}/quotes"
              payload: { expected_order_version: "${o1_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /shipment-orders/${order1_id}/quotes/${q1_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order1_id}/ledger-entries"
