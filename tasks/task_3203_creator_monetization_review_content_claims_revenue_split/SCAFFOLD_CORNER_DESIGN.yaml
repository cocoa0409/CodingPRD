          assert:
            - "RevenueRouting.${r_sup}.creator_share_cents == 700"
            - "RevenueRouting.${r_sup}.partner_share_cents == 300"
            - "creator_share_cents + partner_share_cents == 1000"

      - name: ad_share_rounds_half_up_on_the_half_cent
        claim_type: Precision
        grounds:
          - calculations.royalty_share_split
        distinguishing_aspect: "An AD routing of 1001 gross produces 550.55 cents, which rounds half-up to creator_share_cents 551 (not 550), so the creator receives the odd cent."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel approved with a reviewed item."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
