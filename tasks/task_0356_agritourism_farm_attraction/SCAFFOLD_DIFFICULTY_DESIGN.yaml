# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Agritourism & Farm Attraction — Expert difficulty.
# Cross-references §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves to SCAFFOLD.yaml.
#
# Shared pricing fixture used by most recipes (cents unless noted):
#   adult_admission_cents=2000  child_admission_cents=1200
#   hayride_pass_cents=800  maze_pass_cents=600  upick_pass_cents=1000
#   pumpkin_per_lb_cents=150  pumpkin_flat_each_cents=2500  heavy_pumpkin_lb=20
#   group_rate_min_headcount=15  group_discount_pct=0.20  school_discount_pct=0.35
#   season_pass_price_cents=8000  Farm.parking_fee_cents=1000  DEPOSIT_PCT=0.25
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: Reservation domain (provisional vs settled admission) ---
      - name: admission_provisional_vs_settled_diverge_on_group_confirm
        grounds:
          - calculations.admission_charge
          - entities.Reservation.fields.admission_charge_cents
          - entities.Reservation.fields.settled_charge_cents
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          On the Reservation entity domain, admission_charge_cents (provisional, computed at create
          before the group was CONFIRMED) is 5200 while settled_charge_cents (recomputed at check-in
          after the group reached CONFIRMED with 20% group discount) is 4160 — same participant counts,
          two variants, divergent results.
        test_recipe:
          setup:
            - "Farm OPEN with ACTIVE pricing policy; window capacity 40 (clock 2026-10-10T12:00Z)."
            - "GroupLeader has a FIELD_TRIP GroupBooking on the window, still QUOTED at reservation create."
            - "A Visitor reservation (2 adults, 1 child) is created linked to that group while it is still QUOTED (no discount -> provisional 5200)."
            - "The group is then CONFIRMED, the reservation CONFIRMED, a waiver signed for all 3, then checked in (settled recomputes with 20% group discount -> 4160)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Harvest Hollow", parking_fee_cents: 1000, window_buffer_minutes: 30 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20, group_rate_min_headcount: 15, group_discount_pct: 0.20, school_discount_pct: 0.35 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 40 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "leader@x.com", full_name: "Glenda Leader" }
              as: FarmManager
              captures: { leader_id: $.data.id }
            - call: "POST /visitors"
              payload: { email: "vera@x.com", full_name: "Vera Visitor" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "FIELD_TRIP", adult_count: 6, child_count: 12 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 2, child_count: 1, expected_window_version: "${win_v0}", group_booking_id: "${group_id}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id, prov_charge: $.data.admission_charge_cents }
            - call: "GET /admission-windows/${window_id}"
              payload: {}
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { win_v1: $.data.version }
            - call: "POST /group-bookings/${group_id}/confirm"
              payload: { expected_window_version: "${win_v1}" }
              as: GroupLeader
              as_user_id: "${leader_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Adult One" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Adult Two" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Child One", is_minor: true, guardian_name: "Adult One" }
              as: Visitor
              as_user_id: "${visitor_id}"
          trigger:
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
              captures: { settled_charge: $.data.settled_charge_cents, prov_after: $.data.admission_charge_cents }
          assert:
            - "Reservation.${res_id}.admission_charge_cents == 5200"
            - "Reservation.${res_id}.settled_charge_cents == 4160"
            - "Reservation.${res_id}.settled_charge_cents != Reservation.${res_id}.admission_charge_cents"

      # --- Instance 2: PumpkinPurchase domain (estimate vs scale) ---
      - name: pumpkin_estimate_vs_scale_diverge_across_breakpoint
        grounds:
          - calculations.pumpkin_charge
          - entities.PumpkinPurchase.fields.charge_cents
          - entities.PumpkinPurchase.fields.scale_weight_lb
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          On the PumpkinPurchase entity domain (different from the Reservation admission domain),
          the estimate variant bills 18 lb at per-lb = 2700 cents, while the scale variant weighs the
          same pumpkin at 21 lb (crossing the 20 lb breakpoint) and bills flat-each = 2500 cents.
        test_recipe:
          setup:
            - "Farm OPEN with ACTIVE policy; window capacity 10; a CONFIRMED, CHECKED_IN reservation owned by a visitor."
            - "Visitor adds one pumpkin estimated at 18 lb (provisional per-lb charge 2700)."
            - "GateAgent weighs it at 21 lb at weigh-out (>= 20 breakpoint -> flat-each 2500)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Patch Farm", parking_fee_cents: 1000 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "pk@x.com", full_name: "Pat Picker" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Pat Picker" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 18 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk_id: $.data.id, est_charge: $.data.charge_cents }
          trigger:
            - call: "POST /pumpkin-purchases/${pk_id}/weigh-out"
              payload: { scale_weight_lb: 21 }
              as: GateAgent
              captures: { scale_charge: $.data.charge_cents }
          assert:
            - "PumpkinPurchase.${pk_id}.charge_cents == 2500"
            - "PumpkinPurchase.${pk_id}.status == WEIGHED"
            - "PumpkinPurchase.${pk_id}.charge_cents != 2700"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1 (mode a): group_quote with tier-select + nested branch ---
      - name: group_quote_school_tier_select_above_threshold
        grounds:
          - calculations.group_quote
          - entities.GroupBooking.fields.quoted_total_cents
          - entities.GroupBooking.fields.kind
        distinguishing_aspect: |
          Mode (a): group_quote takes >=3 inputs (adult_count, child_count, kind, headcount-vs-threshold)
          with a nested conditional (qualifies? headcount>=15) feeding a tier-selected rate (SCHOOL->0.35
          vs group->0.20); a SCHOOL group of 30 with per-head base 40000 quotes 26000 cents.
        test_recipe:
          setup:
            - "Farm OPEN with ACTIVE policy; a SCHOOL GroupBooking of 5 adults + 25 children (headcount 30 >= 15)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "School Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, group_rate_min_headcount: 15, group_discount_pct: 0.20, school_discount_pct: 0.35 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 50 }
              as: FarmManager
              captures: { window_id: $.data.id }
            - call: "POST /visitors"
              payload: { email: "principal@x.com", full_name: "Pat Principal" }
              as: FarmManager
              captures: { leader_id: $.data.id }
          trigger:
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "SCHOOL", adult_count: 5, child_count: 25 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id, quote: $.data.quoted_total_cents }
          assert:
            - "GroupBooking.${group_id}.headcount == 30"
            - "GroupBooking.${group_id}.quoted_total_cents == 26000"

      # --- Instance 2 (mode c): reservation_grand_total pinned evaluation order ---
      - name: reservation_grand_total_pinned_order_with_wallet_last
        grounds:
          - calculations.reservation_grand_total
          - entities.Reservation.fields.settled_charge_cents
          - entities.Visitor.fields.wallet_credit_cents
          - state_machines.Reservation.CHECKED_IN_to_SETTLED
        distinguishing_aspect: |
          Mode (c): the grand total looks circular (net depends on gross, gross depends on which admission
          variant which depends on status) but evaluation order is pinned step1(settled admission)..step4
          then wallet-last; gross = 5200+2200+4000+5000 = 16400 and net = 16400 (wallet 0).
        test_recipe:
          setup:
            - "CHECKED_IN reservation (1 adult 1 child individual, settled admission 5200), 2 hayride + 1 maze passes (2200),"
            - "2 pumpkins weighed (21 lb flat 2500 + 10 lb per-lb 1500 = 4000), concession food 3000 + 2 vehicles parking 2000 (5000); visitor wallet 0."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Total Farm", parking_fee_cents: 1000 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "tot@x.com", full_name: "Tom Total" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 1, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/activity-passes"
              payload: { activity: "HAYRIDE", quantity: 2 }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/activity-passes"
              payload: { activity: "MAZE", quantity: 1 }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/concession-orders"
              payload: { food_cents: 3000, vehicle_count: 2 }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Tom Total" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Tina Total" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 21 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk1: $.data.id }
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 10 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk2: $.data.id }
            - call: "POST /pumpkin-purchases/${pk1}/weigh-out"
              payload: { scale_weight_lb: 21 }
              as: GateAgent
            - call: "POST /pumpkin-purchases/${pk2}/weigh-out"
              payload: { scale_weight_lb: 10 }
              as: GateAgent
          trigger:
            - call: "GET /reservations/${res_id}/total"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { net_due: $.data.net_due_cents }
          assert:
            - "Reservation.${res_id}.net_due_cents == 16400"
            - "Reservation.${res_id}.settled_charge_cents == 5200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: Reservation branching fork-join (join at SETTLED) ---
      - name: reservation_forkjoin_settle_requires_both_legs
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_SETTLED
          - entities.Reservation.fields.checkout_finalized
          - entities.Reservation.fields.waiver_satisfied
        distinguishing_aspect: |
          On Reservation: CHECKED_IN forks into two independent finalize legs (pumpkin weigh-out leg and
          waiver leg) that JOIN at SETTLED; settle while a pumpkin is still ESTIMATED (one leg open) is
          rejected ERR_CHECKOUT_NOT_FINALIZED, and only succeeds once both checkout_finalized and
          waiver_satisfied are true.
        test_recipe:
          setup:
            - "CHECKED_IN reservation with waiver satisfied but one pumpkin still ESTIMATED (weigh-out leg not finalized)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Fork Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "fork@x.com", full_name: "Fay Fork" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Fay Fork" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 12 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/settle"
              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CHECKOUT_NOT_FINALIZED"
            - "Reservation.${res_id}.status == CHECKED_IN"

      # --- Instance 2: GroupBooking cyclic revise loop ---
      - name: group_booking_cyclic_revise_requote_loop
        grounds:
          - state_machines.GroupBooking.QUOTED_to_REVISING
          - state_machines.GroupBooking.REVISING_to_QUOTED
          - entities.GroupBooking.fields.quoted_total_cents
        distinguishing_aspect: |
          On GroupBooking (a different entity from Reservation): the status cycles QUOTED -> REVISING ->
          QUOTED any number of rounds; after revising headcount up to 30 (>=15) and requoting, a FIELD_TRIP
          group's quoted_total_cents recomputes from 17600 (no discount, 12 head) to 32000 (20% off, 30 head).
        test_recipe:
          setup:
            - "A FIELD_TRIP GroupBooking quoted at 12 headcount (4 adult 8 child, below threshold, quote 17600)."
            - "Leader revises headcount to 5 adult 25 child (30, >=15), requotes (base 40000 * 0.8 = 32000)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Cycle Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, group_rate_min_headcount: 15, group_discount_pct: 0.20, school_discount_pct: 0.35 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 50 }
              as: FarmManager
              captures: { window_id: $.data.id }
            - call: "POST /visitors"
              payload: { email: "cyc@x.com", full_name: "Cy Cycle" }
              as: FarmManager
              captures: { leader_id: $.data.id }
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "FIELD_TRIP", adult_count: 4, child_count: 8 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id, quote0: $.data.quoted_total_cents }
            - call: "POST /group-bookings/${group_id}/revise"
              payload: {}
              as: GroupLeader
              as_user_id: "${leader_id}"
            - call: "PATCH /group-bookings/${group_id}"
              payload: { adult_count: 5, child_count: 25 }
              as: GroupLeader
              as_user_id: "${leader_id}"
          trigger:
            - call: "POST /group-bookings/${group_id}/requote"
              payload: {}
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { quote1: $.data.quoted_total_cents, status1: $.data.status }
          assert:
            - "GroupBooking.${group_id}.quoted_total_cents == 32000"
            - "GroupBooking.${group_id}.status == QUOTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1: depth-3 closure cascade ---
      - name: closure_cascade_depth3_farm_window_reservation_wallet
        grounds:
          - state_machines.Farm.OPEN_to_CLOSED
          - state_machines.AdmissionWindow.SCHEDULED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Visitor.fields.wallet_credit_cents
          - entities.Farm.fields.refunds_issued_cents
        distinguishing_aspect: |
          Depth-3: POST CLOSURE weather-event (L1) cancels the in-span window; the window CANCELLED (L2)
          cancels its CONFIRMED reservation; that reservation cancel by closure cause (L3) credits the
          visitor wallet by admission 5200 and bumps Farm.refunds_issued_cents by 5200 — each hop caused
          by the previous, not by the original POST.
        test_recipe:
          setup:
            - "Farm OPEN; ACTIVE policy; window capacity 10."
            - "A reservation (2 adult 1 child = participant 3) WITHOUT pass (admission 5200) is CONFIRMED on the window."
            - "Clock at 2026-10-10T12:00Z; window starts 2026-10-11T14:00Z within the CLOSURE affected span."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Storm Farm", parking_fee_cents: 1000 }
              as: FarmManager
