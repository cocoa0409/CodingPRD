              as: Customer
              as_user_id: "${c_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REBOOKING_NOT_ELIGIBLE"
            - "LaunchContract.${ct_id}.target_mission_id is still null and rebookings_remaining == 1"

      - name: assign_against_draft_contract_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_CONTRACT_NOT_SIGNED
          - state_machines.LaunchContract
        distinguishing_aspect: "A DRAFT contract's payloads exist but the contract is not yet SIGNED, so assignment creation is 409 ERR_CONTRACT_NOT_SIGNED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract-1pl exists in DRAFT (never signed); PL1 known; mission and DSP-A ready."
          setup_api_calls:
