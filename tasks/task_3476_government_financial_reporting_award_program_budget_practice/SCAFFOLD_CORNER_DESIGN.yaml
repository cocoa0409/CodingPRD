          rationale: "Asserted as the winning error of the state-vs-fiscal priority instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: reviewer_cannot_decide_forbidden
        claim_type: role_denial
        grounds:
          - roles.Reviewer
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Segregation of duties at the role level: a Reviewer (even one assigned to the submission) cannot call decide — that is AwardsDirector-only."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED; rev1 exists."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err: $.data.error_id }
          assert:
            - "decide as Reviewer returns 403 ERR_FORBIDDEN_ROLE"

      - name: government_contact_cannot_assign_forbidden
        claim_type: role_denial
        grounds:
          - roles.GovernmentContact
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The submitting government can never run blind assignment on its own application (or any): POST /gfoa/review-assignments as GovernmentContact is 403."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
          trigger:
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "assign as GovernmentContact returns 403 ERR_FORBIDDEN_ROLE"

      - name: member_cannot_resolve_comment_forbidden
        claim_type: role_denial
        grounds:
          - roles.Member
          - roles.CommitteeMember
        distinguishing_aspect: "Comment resolution is a committee privilege: the comment's own author (role Member) gets 403 on resolve even though they can read the comment."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication in RESOLUTION with one PENDING comment authored by cm."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/members"
              payload: { full_name: "Commenter Kim", email: "kim@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { cm: $.data.id }
            - call: "POST /gfoa/member-comments"
              payload: { publication_id: "${pub}", body: "Please clarify the escalation matrix." }
              as: Member
              as_user_id: "${cm}"
              captures: { cmt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
          trigger:
            - call: "POST /gfoa/member-comments/${cmt}/resolve"
              payload: { resolution: "ACCEPTED" }
              as: Member
              as_user_id: "${cm}"
              captures: { err: $.data.error_id }
          assert:
            - "resolve as the comment author (role Member) returns 403 ERR_FORBIDDEN_ROLE"
            - "MemberComment.${cmt}.resolution remains PENDING"

      - name: publish_requires_chair_not_plain_member
        claim_type: role_denial
        grounds:
          - roles.CommitteeMember
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Inside the committee the chair is privileged: a non-chair member of member_ids passing all role checks still fails publish with ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication in RESOLUTION (creator creatorM, chair chairM), zero comments."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_v: $.data.version }
          trigger:
            - call: "POST /gfoa/publications/${pub}/publish"
              payload: { expected_publication_version: "${pub_v}" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { err: $.data.error_id }
          assert:
            - "publish by non-chair committee member returns 403 ERR_NOT_RESOURCE_OWNER"
            - "BestPracticePublication.${pub}.status remains RESOLUTION"

      - name: committee_outsider_cannot_open_comment_period
        claim_type: role_denial
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - entities.BestPracticePublication.fields.member_ids
        distinguishing_aspect: "Committee membership is per-publication: a CommitteeMember whose id is not in member_ids cannot open the comment period, even with the correct role."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication exists (creator creatorM); outsider member om exists."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/members"
              payload: { full_name: "Outsider Ola", email: "ola@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { om: $.data.id }
          trigger:
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${om}"
              captures: { err: $.data.error_id }
          assert:
            - "open-comment-period by an outsider returns 403 ERR_NOT_RESOURCE_OWNER"
            - "BestPracticePublication.${pub}.status remains DRAFTING"

      - name: reviewer_cannot_accept_others_assignment
        claim_type: role_denial
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - entities.ReviewAssignment.fields.reviewer_id
        distinguishing_aspect: "Assignment ownership binds to reviewer_id: rev2 calling accept on rev1's assignment is 403, not a state error — ownership is checked before the OFFERED gate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission UNDER_REVIEW; assignment OFFERED to rev1; rev2 also ELIGIBLE."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_m2
            - *c_e2
            - *c_rev2
            - *c_train2
            - *c_att2
            - *c_asg1
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev2}"
              captures: { err: $.data.error_id }
          assert:
            - "accept by rev2 returns 403 ERR_NOT_RESOURCE_OWNER"
            - "ReviewAssignment.${asg1}.status remains OFFERED"

      - name: member_cannot_apply_reviewer_for_other_member
        claim_type: role_denial
        grounds:
          - roles.Member
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Reviewer recruitment is self-service: member_id must equal X-User-ID, so a member cannot enroll someone else."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; members m1 and m2 exist; employer government e1 exists."
          setup_api_calls:
            - *c_clock
            - *c_m1
            - *c_e1
            - *c_m2
          trigger:
            - call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m2}", employer_government_id: "${e1}" }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "create with member_id != X-User-ID returns 403 ERR_NOT_RESOURCE_OWNER"
            - "no ReviewerProfile row exists for ${m2}"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: scholarship_allocate_stale_version_occ
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scholarship-allocate-stale-fund]
          - errors.ERR_STALE_FUND_VERSION
        distinguishing_aspect: "OCC on ScholarshipFund.version: after a first allocation advances the fund to version 2, a second allocate carrying the stale version 1 is rejected 412 while a retry at the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FLAT_CAP fund pool 100000 cap 100000 (version 1). Two SMALL-government applications, 40000 each."
          setup_api_calls:
            - *c_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t1: $.data.id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Small", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t2: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 100000, allocation_policy: "FLAT_CAP" }
              as: PlatformAdmin
              captures: { fund: $.data.id, fund_v: $.data.version }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund}", government_id: "${gov_t1}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 40000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_1: $.data.id }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund}", government_id: "${gov_t2}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 40000 }
              as: GovernmentContact
              as_user_id: "${gov_t2}"
              captures: { app_2: $.data.id }
            - call: "POST /gfoa/scholarship-applications/${app_1}/allocate"
              payload: { expected_fund_version: "${fund_v}" }
              as: AwardsDirector
          trigger:
            - call: "POST /gfoa/scholarship-applications/${app_2}/allocate"
              payload: { expected_fund_version: "${fund_v}" }
              as: AwardsDirector
              captures: { err: $.data.error_id }
            - call: "POST /gfoa/scholarship-applications/${app_2}/allocate"
              payload: { expected_fund_version: "${fund_v} + 1" }
              as: AwardsDirector
              captures: { grant_2: $.data.granted_cents }
            - call: "GET /gfoa/scholarship-funds/${fund}"
              payload: {}
              as: AwardsDirector
              captures: { fund_after: "$.data.remaining_cents" }
          assert:
            - "allocate with the stale version (1, when the fund is at 2) returns 412 ERR_STALE_FUND_VERSION"
            - "retry with the current version succeeds: app_2.granted_cents == 40000 and status == GRANTED"
            - "ScholarshipFund.${fund}.remaining_cents == 20000 (both grants debited exactly once)"

      - name: publication_publish_stale_version_occ
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[publication-publish-stale-version]
          - errors.ERR_STALE_PUBLICATION_VERSION
        distinguishing_aspect: "OCC on BestPracticePublication.version: the version observed at open-comment (2) is stale after close-comment (3); publish with the stale version is 412, and with the current version it publishes."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication (creator creatorM, chair chairM) advanced through MEMBER_COMMENT to RESOLUTION; version captured at open time is now stale."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_v_open: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
          trigger:
            - call: "POST /gfoa/publications/${pub}/publish"
              payload: { expected_publication_version: "${pub_v_open}" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { err: $.data.error_id }
            - call: "POST /gfoa/publications/${pub}/publish"
              payload: { expected_publication_version: "${pub_v_open} + 1" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { pub_status: $.data.status }
          assert:
            - "publish with the stale open-time version returns 412 ERR_STALE_PUBLICATION_VERSION"
            - "publish with the current version returns 200 and status == PUBLISHED with published_at == 2026-09-21T00:00:00Z"

      - name: blind_assignment_selector_ranking_order
        claim_type: selector_policy
        grounds:
          - calculations.blind_reviewer_selection
        distinguishing_aspect: "The selector's ranking is observable: with rev1 holding one open assignment and rev2 holding none, the next assignment goes to rev2 (open ASC beats trained_at ASC); once both hold one, the earlier-trained rev1 wins the tie."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Two SUBMITTED submissions (gov_s, gov_b) in the FR cycle. rev1 trained before rev2; both ELIGIBLE. rev1 already holds one OFFERED assignment on submission A."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Boundary", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_b: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_b}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /gfoa/report-submissions/${sub_b}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_b}"
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_m2
            - *c_e2
            - *c_rev2
            - *c_train2
            - *c_att2
            - *c_asg1
          trigger:
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_b}" }
              as: AwardsDirector
              captures: { asg_b1: $.data.id, asg_b1_rev: $.data.reviewer_id }
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_b}" }
              as: AwardsDirector
              captures: { asg_b2: $.data.id, asg_b2_rev: $.data.reviewer_id }
          assert:
            - "first assignment on submission B goes to ${rev2} (open_assignment_count 0 beats rev1's 1 despite rev1 training earlier)"
            - "second assignment on submission B goes to ${rev1} (open counts tie at 1; completed tie at 0; trained_at ASC breaks the tie)"
            - "aliases on submission B are R1-1 and R1-2 (round-scoped sequence)"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: finding_submit_depth3_cascade
          rationale: "The depth-3 finding cascade and the depth-2 standards cascade are both difficulty instances."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: decide_response_immediately_reflects_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile
        excluded_because:
          difficulty_instance: award_score_variants_diverge_across_programs
