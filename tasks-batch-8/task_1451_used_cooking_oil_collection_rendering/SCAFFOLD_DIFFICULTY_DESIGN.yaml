  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_term_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_CONTRACT_TERM_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on Contract: a successor contract whose term_start equals the
          incumbent's term_end (2026-07-01) is adjacent, not overlapping, and is accepted; a contract
          starting one day earlier (2026-06-30) overlaps [2026-01-01, 2026-07-01) and is rejected.
        test_recipe:
          setup:
            - "Customer with contract1 term [2026-01-01, 2026-07-01), activated at clock 2026-02-01"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Overlap House", site_address: "16 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-01-01", term_end: "2026-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con1: $.data.id }
            - { call: "POST /api/contracts/${con1}/activate", payload: {}, as: FieldOpsManager }
          trigger:
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-01-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con2: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-06-30", term_end: "2026-12-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "contract with term_start == 2026-07-01 (== incumbent term_end) is created with status DRAFT (adjacency allowed under half-open semantics)"
            - "contract with term_start == 2026-06-30 fails with error_id == ERR_CONTRACT_TERM_OVERLAP"

      - name: truck_service_date_point_uniqueness
        grounds:
          - validations[priority=14]
          - errors[ERR_MANIFEST_DATE_CONFLICT]
        distinguishing_aspect: |
          Date-point uniqueness semantics on RouteManifest (different interval semantics than the
          half-open contract windows): a second manifest for the same truck on the same service_date is
          rejected outright — there is no adjacency notion — while the next calendar date is free.
        test_recipe:
          setup:
            - "Customer ACTIVE with contract and container; truck registered; manifest m1 for truck on 2026-08-10 created"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Point House", site_address: "17 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKPT" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-13", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-10", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man1: $.data.id }
          trigger:
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-2", service_date: "2026-08-10", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-11", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man2: $.data.id }
          assert:
            - "second manifest for truck ${trk} on 2026-08-10 fails with error_id == ERR_MANIFEST_DATE_CONFLICT"
            - "manifest for the same truck on 2026-08-11 is created (date-point, not interval, semantics)"

  - rule_id: compensating_invariant
    instances:
      - name: tank_mass_conservation_with_void
        grounds:
          - calculations.tank_conservation_check
          - state_machines.PickupVisit.COMPLETED_to_VOID
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity is tank gallons: the forward complete actions and the compensating void
          leave end_level == start_level + collected(non-VOID) - spill exactly; reconcile at 291 (1.0 gal
          drift, beyond the 0.5 tolerance) fails and reconcile at 290 passes after the void.
        test_recipe:
          setup:
            - "Customer ACTIVE with contract; containers c1,c2; truck cap 2000; manifest 2026-08-05 dispatched with start_level 100"
            - "v1 completed pump 200.00, v2 completed pump 300.00 (field moisture 5.0); manifest COMPLETED with collected 500"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Mass House", site_address: "18 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 400, est_fill_rate_gal_per_week: 200, lock_code: "LKM1" }
              as: FieldOpsManager
              captures: { c1: $.data.id }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 400, est_fill_rate_gal_per_week: 200, lock_code: "LKM2" }
              as: FieldOpsManager
              captures: { c2: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-14", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${c1}", "${c2}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 100 }, as: RouteDispatcher }
            - call: "GET /api/containers/${c1}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - call: "GET /api/containers/${c2}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v2: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 200.00, field_moisture_pct: 5.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v2}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v2}/complete", payload: { pump_gallons: 300.00, field_moisture_pct: 5.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/route-manifests/${man}/complete", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /api/pickup-visits/${v2}/void", payload: { reason: "meter ticket lost" }, as: RouteDispatcher }
            - call: "POST /api/route-manifests/${man}/reconcile"
              payload: { end_level_gallons: 291, spill_loss_gallons: 10 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
            - call: "POST /api/route-manifests/${man}/reconcile"
              payload: { end_level_gallons: 290, spill_loss_gallons: 10 }
              as: RouteDispatcher
              captures: { st: $.data.status, collected: $.data.collected_gallons }
          assert:
            - "RouteManifest.${man}.collected_gallons == 200 after the void (300-gallon visit compensated out)"
            - "first reconcile fails with error_id == ERR_TANK_IMBALANCE (|291 - (100 + 200 - 10)| = 1.0 > 0.5 tolerance)"
            - "second reconcile succeeds with status RECONCILED: end_level 290 == start 100 + collected 200 - spill 10 — the complete/void pair conserves tank mass"

      - name: rebate_ledger_finalize_pay_void_invariant
        grounds:
          - calculations.rebate_ledger_balance
          - state_machines.Settlement.PROVISIONAL_to_FINALIZED
          - state_machines.Settlement.FINALIZED_to_PAID
          - state_machines.Settlement.FINALIZED_to_VOID
        distinguishing_aspect: |
          Conserved quantity is rebate cents (different quantity than tank gallons): balance ==
          sum(final_total_cents over FINALIZED settlements) at every step — finalize posts 13230, pay
          disburses it back to 0, and the finalize->void pair on a second settlement (6840) returns the
          balance to 0 with no drift.
        test_recipe:
          setup:
            - "Customer ACTIVE with REBATE contract (floor 50, cap 150)"
            - "Settlement S1 over [2026-08-01, 2026-08-15): pickup 2026-08-05 pump 200.00 field 8.0, lab 16.0/1.0 (C); quotes w07-27 @140, w08-03 @100, w08-10 @110 published; finalized at clock 2026-08-15 -> final 13230"
            - "Pickup P2 on 2026-08-20 pump 100.00 field 5.0, lab 5.0/1.0 (B); quote w08-17 @80 published"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Ledger House", site_address: "19 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 1200, est_fill_rate_gal_per_week: 200, lock_code: "LKL1" }
              as: FieldOpsManager
              captures: { ctn1: $.data.id }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKL2" }
              as: FieldOpsManager
              captures: { ctn2: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-15", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn1}"] }
              as: RouteDispatcher
              captures: { man1: $.data.id }
            - { call: "POST /api/route-manifests/${man1}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man1}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 200.00, field_moisture_pct: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/pickup-visits/${v1}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smp1: $.data.id }
            - { call: "POST /api/quality-samples/${smp1}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smp1}/grade", payload: { lab_moisture_pct: 16.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-07-27", price_cents_per_gal: 140 }
              as: BillingAnalyst
              captures: { q0: $.data.id }
            - { call: "POST /api/market-index-quotes/${q0}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-03", price_cents_per_gal: 100 }
              as: BillingAnalyst
              captures: { q1: $.data.id }
            - { call: "POST /api/market-index-quotes/${q1}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-10", price_cents_per_gal: 110 }
              as: BillingAnalyst
              captures: { q2: $.data.id }
            - { call: "POST /api/market-index-quotes/${q2}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stl1: $.data.id }
            - { call: "POST /api/settlements/${stl1}/finalize", payload: {}, as: BillingAnalyst }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: BillingAnalyst
              captures: { bal_after_finalize: $.data.rebate_balance_cents }
          trigger:
            - { call: "POST /api/settlements/${stl1}/pay", payload: {}, as: BillingAnalyst }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: BillingAnalyst
              captures: { bal_after_pay: $.data.rebate_balance_cents }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-20", container_ids: ["${ctn2}"] }
              as: RouteDispatcher
              captures: { man2: $.data.id }
            - { call: "POST /api/route-manifests/${man2}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man2}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v2: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v2}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v2}/complete", payload: { pump_gallons: 100.00, field_moisture_pct: 5.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/pickup-visits/${v2}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smp2: $.data.id }
            - { call: "POST /api/quality-samples/${smp2}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smp2}/grade", payload: { lab_moisture_pct: 5.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-17", price_cents_per_gal: 80 }
              as: BillingAnalyst
              captures: { q3: $.data.id }
            - { call: "POST /api/market-index-quotes/${q3}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-15", period_end: "2026-09-01" }
              as: BillingAnalyst
              captures: { stl2: $.data.id }
            - { call: "POST /api/settlements/${stl2}/finalize", payload: {}, as: BillingAnalyst }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: BillingAnalyst
              captures: { bal_after_finalize2: $.data.rebate_balance_cents }
            - { call: "POST /api/settlements/${stl2}/void", payload: { reason: "posted to wrong account" }, as: BillingAnalyst }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: BillingAnalyst
              captures: { bal_after_void: $.data.rebate_balance_cents }
          assert:
            - "Customer.${cust}.rebate_balance_cents == 13230 after S1 finalize (168.00 x 78.75)"
            - "rebate_balance_cents == 0 after pay and Settlement.${stl1}.status == PAID with paid_at set"
            - "rebate_balance_cents == 6840 after S2 finalize (95.00 gal x rate 72 = 80 x 0.90 grade B)"
            - "rebate_balance_cents == 0 after S2 void and Settlement.${stl2}.status == VOID — finalize/void pair conserves the ledger"
            - "at every observation, rebate_balance_cents == sum of final_total_cents over settlements currently in FINALIZED"
