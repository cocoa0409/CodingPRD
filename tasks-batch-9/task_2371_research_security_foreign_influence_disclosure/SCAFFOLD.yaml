      - { name: disclosure_id, type: string, source: input, description: "FK -> Disclosure.id; nullable when the incident is not tied to a disclosure", default: null }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; nullable when no award is implicated", default: null }
