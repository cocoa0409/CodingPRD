      - After the rescind (mid-setup) offering_status regressed to "OFFERING" with capital_raised_cents == 60000000
      - 'After the trigger: offering_status == "FULLY_SUBSCRIBED", capital_raised_cents == 120000000, escrow_balance_cents == 120000000'
      - operating_status == "PRE_PRODUCTION" throughout (independent axis, never advanced by offering activity)
      - recoupment_status == "UNRECOUPED" throughout
