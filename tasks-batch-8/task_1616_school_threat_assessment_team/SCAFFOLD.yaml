# =============================================================================
# PRD Benchmark Seed Tables — School Threat Assessment Team
# =============================================================================

scenario: |
  School Threat Assessment Team (district behavioral threat assessment team): report intake (tip line/staff referral) & triage, initial screening & interview protocol, risk-level determination & management plan, law enforcement & mental-health referral coordination, monitoring cadence & plan modification, re-entry conditions after removal, documentation, confidentiality & records retention, case review & annual data reporting

domain_name: school-threat-assessment
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency      # OCC on ThreatCase.version for plan activation (supersede)
    - cascading_side_effects      # finalize(IMMINENT) -> case -> auto-referral -> escalation -> plan review
    - scheduled_actions           # logical clock drives check-in MISS + referral SLA breach
    - rate_threshold_triggers     # risk-level tiers, consecutive-miss escalation, retention eligibility
  entity_topology: flat           # peer entities with FK references, no URL nesting for writes
  state_machine_shape: cyclic     # ThreatCase close/reopen loop + RiskAssessment submit/return loop + CheckIn miss/reschedule loop
  relationship_patterns:
    - one_to_many                 # ThreatCase -> Interview / RiskAssessment / ManagementPlan / Referral / MonitoringCheckIn / ReEntryPlan / CaseDocument / AuditEvent
  role_model: segregation_of_duties  # assessor who drafts cannot finalize; re-entry proposer cannot approve
  consistency_model: immediate

# Global list-ordering contract: every list endpoint returns items ordered by
# created_at ASC. Tests disambiguate same-timestamp ties via status filters
# (single-element filtered lists) rather than positional indexes.
list_ordering: "created_at ASC"

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School display name" }
      - { name: school_code, type: string, source: input, description: "Unique district school code (case-sensitive); duplicate rejected with ERR_DUPLICATE_SCHOOL_CODE" }
      - { name: enrollment_count, type: integer, source: input, description: "Current enrollment headcount", constraints: ">= 0" }
      - { name: retention_days, type: integer, source: input, default: 365, description: "Days a CLOSED case's documents are retained before purge eligibility", constraints: ">= 30" }

  - name: ThreatCase
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; school where the subject is enrolled" }
      - { name: subject_alias, type: string, source: input, description: "Pseudonymous subject reference (e.g. STU-4821); never a real name; overwritten with PURGED on purge" }
      - { name: reporter_channel, type: enum, source: input, description: "TIP_LINE | STAFF_REFERRAL" }
      - { name: summary, type: string, source: input, description: "Intake narrative of the reported concern" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | TRIAGED | UNDER_ASSESSMENT | PLAN_ACTIVE | REMOVED | CLOSED_NO_THREAT | CLOSED_MANAGED | PURGED" }
      - { name: triage_priority, type: enum, source: system, description: "ROUTINE | URGENT | EMERGENT; set by triage; null before" }
      - { name: screening_score, type: integer, source: computed, description: "Count of true screening factors (0-6); null until screening recorded" }
      - { name: screening_outcome, type: enum, source: computed, description: "SUBSTANTIVE when screening_score >= 3 else NON_SUBSTANTIVE; null until screening recorded" }
      - { name: risk_level, type: enum, source: computed, description: "LOW | MODERATE | HIGH | IMMINENT; copied from latest FINALIZED RiskAssessment; null until first finalization" }
      - { name: monitoring_cadence_days, type: integer, source: computed, description: "Cadence copied from the ACTIVE ManagementPlan; null until plan activation" }
      - { name: consecutive_missed_count, type: integer, source: system, default: 0, description: "MISSED check-in transitions since the last COMPLETED check-in; reschedule does not reset" }
      - { name: escalation_flag, type: boolean, source: system, default: false, description: "Set by 2nd consecutive miss / URGENT auto-referral / CONCERNS_ESCALATED outcome / SLA breach; cleared only by ManagementPlan activation" }
      - { name: removal_type, type: enum, source: system, description: "EMERGENCY_REMOVAL | DISCIPLINARY_EXCLUSION; set by remove action; null otherwise" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of closure; null while open; cleared on reopen" }
      - { name: retention_purge_after, type: string, source: computed, description: "Date (YYYY-MM-DD) = closed date + School.retention_days; null while open; cleared on reopen" }
      - { name: purged_at, type: datetime, source: system, description: "Set when records-retention purge scrubs the case; null until purged" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id" }
      - { name: interviewee_type, type: enum, source: input, description: "SUBJECT | WITNESS | PARENT | REPORTER" }
      - { name: starts_at, type: datetime, source: input, description: "Interview start (ISO8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Interview end (ISO8601 UTC); must be strictly after starts_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: findings_score, type: integer, source: input, description: "0-10 assessor rating recorded at completion; null until completed", constraints: "0..10" }
      - { name: summary, type: string, source: input, description: "Interview summary recorded at completion; null until completed" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until completed" }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id" }
      - { name: variant, type: enum, source: input, description: "STANDARD | EXPEDITED scoring algorithm (see calculations.assessment_risk_score)" }
      - { name: factors, type: array, source: input, description: "Array of {factor_code, severity}; factor_code in WEAPON_ACCESS|PLAN_SPECIFICITY|GRIEVANCE_HISTORY|PEER_REPORTS|BEHAVIORAL_ESCALATION|SUPERVISION_GAP; severity integer 0..3; absent codes contribute 0" }
      - { name: raw_score, type: integer, source: computed, description: "Variant-dependent score, clamped 0..100 (see calculations.assessment_risk_score)" }
      - { name: risk_level, type: enum, source: computed, description: "LOW < 20 <= MODERATE < 40 <= HIGH < 60 <= IMMINENT (score thresholds)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | FINALIZED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ThreatAssessor (SoD reference)" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalization; null until finalized" }
      - { name: superseded_at, type: datetime, source: system, description: "Set when a newer assessment for the same case finalizes; null otherwise" }

  - name: ManagementPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id" }
      - { name: cadence_mode, type: enum, source: input, description: "FROM_COMPLETION | FIXED_ANCHOR (see calculations.monitoring_next_due_date)" }
      - { name: cadence_days, type: integer, source: input, description: "Days between check-ins; optional - default by risk level {IMMINENT:3, HIGH:7, MODERATE:14, LOW:30}; must not exceed max {IMMINENT:7, HIGH:14, MODERATE:30, LOW:60}" }
      - { name: conditions, type: array, source: input, description: "Array of management-condition description strings (non-empty)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | CLOSED" }
      - { name: needs_review, type: boolean, source: system, default: false, description: "Set when an IMMINENT finalization cascade hits an ACTIVE plan; cleared when a newer plan activates" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ThreatAssessor" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until activated" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id" }
      - { name: referral_type, type: enum, source: input, description: "LAW_ENFORCEMENT | MENTAL_HEALTH" }
      - { name: agency_name, type: string, source: input, description: "Receiving agency display name" }
      - { name: urgency, type: enum, source: input, description: "ROUTINE | URGENT; drives SLA (ROUTINE 240h, URGENT 72h)" }
      - { name: status, type: enum, source: system, default: SENT, description: "SENT | ACKNOWLEDGED | DECLINED | WITHDRAWN; creation IS the send" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when created by the EMERGENT-triage or IMMINENT-finalize cascade" }
      - { name: sla_due_at, type: datetime, source: computed, description: "sent timestamp + 72h (URGENT) or +240h (ROUTINE)" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Set true by clock advance when status==SENT and clock passes sla_due_at" }
      - { name: decline_reason, type: string, source: input, description: "Required on decline; null otherwise" }

  - name: MonitoringCheckIn
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ThreatCase.id" }
      - { name: due_date, type: string, source: input, description: "Calendar date YYYY-MM-DD the check-in is due; completable through end of that day" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | MISSED | CANCELLED (CANCELLED only via case-close cascade)" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when created by plan activation / completion chaining / re-entry" }
      - { name: outcome, type: enum, source: input, description: "ON_TRACK | CONCERNS_ESCALATED; required at completion; null until completed" }
      - { name: notes, type: string, source: input, description: "Completion notes; null until completed" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until completed" }

  - name: ReEntryPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id" }
      - { name: conditions, type: array, source: input, description: "Array of condition description strings (non-empty); server stores [{description, status: UNMET, evidence_note: null}]" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | DENIED | REENTERED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the proposing ThreatAssessor (SoD reference)" }
      - { name: denial_reason, type: string, source: input, description: "Required on deny; null otherwise" }

  - name: CaseDocument
    parent: null
    common_fields: false   # append-only documentation log: id + created_at only, no update/delete
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ThreatCase.id" }
      - { name: doc_type, type: enum, source: input, description: "INTAKE_NOTE | INTERVIEW_SUMMARY | PLAN_DOCUMENT | LEGAL_HOLD | OTHER" }
      - { name: body, type: string, source: input, description: "Document text; set to null by retention purge" }
      - { name: sealed, type: boolean, source: input, default: false, description: "Sealed documents are excluded from list responses for IntakeCoordinator and ThreatAssessor" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating user" }
      - { name: purged, type: boolean, source: system, default: false, description: "True after retention purge scrubbed the body" }

  - name: AuditEvent
    parent: null
    common_fields: false   # immutable, tamper-evident: id + created_at only; no update/delete endpoints
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ThreatCase.id; every audit event is case-scoped" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for automatic transitions" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor; 'system' for automatic transitions" }
      - { name: action, type: enum, source: system, description: "CASE_CREATED | CASE_TRIAGED | CASE_SCREENED | CASE_REMOVED | CASE_CLOSED | CASE_REOPENED | CASE_PURGED | ASSESSMENT_FINALIZED | PLAN_ACTIVATED | PLAN_SUPERSEDED | REFERRAL_SENT | REFERRAL_AUTO_CREATED | REFERRAL_ACKNOWLEDGED | REFERRAL_DECLINED | REFERRAL_WITHDRAWN | REFERRAL_SLA_BREACHED | CHECKIN_COMPLETED | CHECKIN_MISSED | CHECKIN_RESCHEDULED | ESCALATION_RAISED | REENTRY_PROPOSED | REENTRY_APPROVED | REENTRY_DENIED | REENTRY_COMPLETED" }
      - { name: detail, type: string, source: system, description: "Human-readable description of the mutation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ThreatCase
    initial_state: INTAKE
    terminal_states: [PURGED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /threat-cases/{id}/triage"
        actor: IntakeCoordinator
        preconditions:
          - "Case status == INTAKE (ERR_CASE_NOT_IN_INTAKE)"
          - "triage_priority in {ROUTINE, URGENT, EMERGENT} (ERR_INVALID_REQUEST)"
        side_effects:
          - "triage_priority set; AuditEvent CASE_TRIAGED"
          - "If triage_priority == EMERGENT: auto-create Referral(case_id, LAW_ENFORCEMENT, agency 'DISTRICT_SRT', URGENT, status SENT, auto_created=true, sla_due_at=now+72h) + AuditEvent REFERRAL_AUTO_CREATED"

      - from: TRIAGED
        to: UNDER_ASSESSMENT
        trigger: "POST /threat-cases/{id}/screening with screening_score >= 3"
        actor: ThreatAssessor
        preconditions:
          - "Case status == TRIAGED (ERR_CASE_NOT_TRIAGED)"
        side_effects:
          - "screening_score and screening_outcome=SUBSTANTIVE recorded; AuditEvent CASE_SCREENED"

      - from: TRIAGED
        to: CLOSED_NO_THREAT
        trigger: "POST /threat-cases/{id}/screening with screening_score <= 2"
        actor: ThreatAssessor
        preconditions:
          - "Case status == TRIAGED (ERR_CASE_NOT_TRIAGED)"
        side_effects:
          - "screening_score and screening_outcome=NON_SUBSTANTIVE recorded; AuditEvent CASE_SCREENED"
          - "closed_at=now; retention_purge_after = current date + School.retention_days"

      - from: UNDER_ASSESSMENT
        to: PLAN_ACTIVE
        trigger: "POST /management-plans/{id}/activate (see ManagementPlan machine)"
        actor: TeamLead
        preconditions: []
        side_effects:
          - "monitoring_cadence_days copied from activated plan"

      - from: UNDER_ASSESSMENT
        to: REMOVED
        trigger: "POST /threat-cases/{id}/remove"
        actor: TeamLead
        preconditions:
          - "Case status in {UNDER_ASSESSMENT, PLAN_ACTIVE} (ERR_CASE_NOT_REMOVABLE)"
          - "removal_type in {EMERGENCY_REMOVAL, DISCIPLINARY_EXCLUSION} (ERR_INVALID_REQUEST)"
        side_effects:
          - "removal_type set; AuditEvent CASE_REMOVED; open check-ins and referrals are NOT cancelled (monitoring continues during removal)"

      - from: PLAN_ACTIVE
        to: REMOVED
        trigger: "POST /threat-cases/{id}/remove"
        actor: TeamLead
        preconditions:
          - "Case status in {UNDER_ASSESSMENT, PLAN_ACTIVE} (ERR_CASE_NOT_REMOVABLE)"
        side_effects:
          - "removal_type set; AuditEvent CASE_REMOVED; ACTIVE ManagementPlan remains ACTIVE"

      - from: REMOVED
        to: PLAN_ACTIVE
        trigger: "POST /re-entry-plans/{id}/complete-re-entry when the case has an ACTIVE ManagementPlan"
        actor: TeamLead
        preconditions:
          - "Case status == REMOVED (ERR_CASE_NOT_REMOVED)"
        side_effects:
          - "removal_type cleared to null; AuditEvent CASE_REOPENED"
          - "Auto-create MonitoringCheckIn (auto_created=true) due current date + 30 days (re-entry monitoring cadence)"

      - from: REMOVED
        to: UNDER_ASSESSMENT
        trigger: "POST /re-entry-plans/{id}/complete-re-entry when the case has no ACTIVE ManagementPlan"
        actor: TeamLead
        preconditions:
          - "Case status == REMOVED (ERR_CASE_NOT_REMOVED)"
        side_effects:
          - "removal_type cleared to null; AuditEvent CASE_REOPENED"

      - from: PLAN_ACTIVE
        to: CLOSED_MANAGED
        trigger: "POST /threat-cases/{id}/close"
        actor: TeamLead
        preconditions:
          - "Case status == PLAN_ACTIVE (ERR_CASE_NOT_CLOSABLE)"
          - "No MonitoringCheckIn for the case in MISSED status (ERR_OPEN_CHECKINS_EXIST)"
          - "No Referral for the case in SENT status (ERR_OPEN_REFERRALS_EXIST)"
          - "escalation_flag == false (ERR_ESCALATION_UNRESOLVED)"
        side_effects:
          - "closed_at=now; retention_purge_after = current date + School.retention_days"
          - "ACTIVE ManagementPlan -> CLOSED; DRAFT ManagementPlans -> CLOSED (cascade down)"
          - "SCHEDULED MonitoringCheckIns for the case -> CANCELLED (cascade down)"
          - "AuditEvent CASE_CLOSED"

      - from: CLOSED_NO_THREAT
        to: TRIAGED
        trigger: "POST /threat-cases/{id}/reopen"
        actor: IntakeCoordinator
        preconditions:
          - "Case status in {CLOSED_NO_THREAT, CLOSED_MANAGED} (ERR_CASE_NOT_REOPENABLE)"
        side_effects:
          - "closed_at=null; retention_purge_after=null; consecutive_missed_count=0; escalation_flag=false; triage_priority preserved"
          - "AuditEvent CASE_REOPENED"

      - from: CLOSED_MANAGED
        to: TRIAGED
        trigger: "POST /threat-cases/{id}/reopen"
        actor: IntakeCoordinator
        preconditions:
          - "Case status in {CLOSED_NO_THREAT, CLOSED_MANAGED} (ERR_CASE_NOT_REOPENABLE)"
        side_effects:
          - "closed_at=null; retention_purge_after=null; consecutive_missed_count=0; escalation_flag=false"
          - "AuditEvent CASE_REOPENED"

      - from: CLOSED_NO_THREAT
        to: PURGED
        trigger: "POST /records-retention/purge (system, when current date >= retention_purge_after)"
        actor: system
        preconditions:
          - "Case status in {CLOSED_NO_THREAT, CLOSED_MANAGED} and retention_purge_after <= current logical date and purged_at is null"
        side_effects:
          - "purged_at=now; subject_alias='PURGED'; every CaseDocument of the case gets body=null, purged=true; AuditEvent CASE_PURGED"

      - from: CLOSED_MANAGED
        to: PURGED
        trigger: "POST /records-retention/purge (system, when current date >= retention_purge_after)"
        actor: system
        preconditions:
          - "Case status in {CLOSED_NO_THREAT, CLOSED_MANAGED} and retention_purge_after <= current logical date and purged_at is null"
        side_effects:
          - "purged_at=now; subject_alias='PURGED'; every CaseDocument of the case gets body=null, purged=true; AuditEvent CASE_PURGED"

  - entity: RiskAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /risk-assessments/{id}/submit"
        actor: ThreatAssessor
        preconditions:
          - "Assessment status == DRAFT (ERR_ASSESSMENT_NOT_DRAFT)"
        side_effects: []

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /risk-assessments/{id}/return"
        actor: TeamLead
        preconditions:
          - "Assessment status == SUBMITTED (ERR_ASSESSMENT_NOT_SUBMITTED)"
        side_effects:
          - "return_reason recorded in AuditEvent detail"

      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /risk-assessments/{id}/finalize"
        actor: TeamLead
        preconditions:
          - "Assessment status == SUBMITTED (ERR_ASSESSMENT_NOT_SUBMITTED)"
          - "X-User-ID != assessment.created_by_user_id (ERR_SOD_SELF_APPROVAL - segregation of duties)"
        side_effects:
          - "finalized_at=now; ThreatCase.risk_level = assessment.risk_level; ThreatCase.version += 1; AuditEvent ASSESSMENT_FINALIZED"
          - "Any other FINALIZED RiskAssessment for the same case -> SUPERSEDED (superseded_at=now)"
          - "IMMINENT cascade: if risk_level == IMMINENT and no Referral with referral_type=LAW_ENFORCEMENT in {SENT, ACKNOWLEDGED} exists for the case, auto-create one (URGENT, agency 'DISTRICT_SRT', auto_created=true) + AuditEvent REFERRAL_AUTO_CREATED; the auto-referral sets ThreatCase.escalation_flag=true + AuditEvent ESCALATION_RAISED; the escalation then sets needs_review=true on the case's ACTIVE ManagementPlan if one exists"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (automatic when a newer RiskAssessment for the same case is finalized)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_at=now"

  - entity: ManagementPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /management-plans/{id}/activate"
        actor: TeamLead
        preconditions:
          - "Plan status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "OCC: expected_threat_case_version == ThreatCase.version (ERR_STALE_CASE_VERSION, checked before business rules)"
          - "Case status in {UNDER_ASSESSMENT, PLAN_ACTIVE} (ERR_CASE_NOT_PLANNABLE)"
          - "A FINALIZED RiskAssessment exists for the case (ERR_NO_FINALIZED_ASSESSMENT)"
          - "If case.risk_level in {HIGH, IMMINENT}: a LAW_ENFORCEMENT Referral in ACKNOWLEDGED status exists for the case (ERR_LE_REFERRAL_REQUIRED)"
        side_effects:
          - "activated_at=now; ThreatCase.version += 1; AuditEvent PLAN_ACTIVATED"
          - "Prior ACTIVE ManagementPlan for the case -> SUPERSEDED + AuditEvent PLAN_SUPERSEDED"
          - "Case status -> PLAN_ACTIVE; case.monitoring_cadence_days = plan.cadence_days; case.escalation_flag=false"
          - "Auto-create first MonitoringCheckIn (auto_created=true) due current date + cadence_days, unless a check-in with status IN {SCHEDULED, MISSED} already exists for that case and calendar day"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another plan for the same case activates)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "system (cascade from ThreatCase close)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CLOSED
        trigger: "system (cascade from ThreatCase close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Referral
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, DECLINED, WITHDRAWN]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /referrals/{id}/acknowledge"
        actor: ThreatAssessor | TeamLead
        preconditions:
          - "Referral status == SENT (ERR_REFERRAL_NOT_SENT)"
        side_effects:
          - "AuditEvent REFERRAL_ACKNOWLEDGED"

      - from: SENT
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: ThreatAssessor | TeamLead
        preconditions:
          - "Referral status == SENT (ERR_REFERRAL_NOT_SENT)"
          - "decline_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "AuditEvent REFERRAL_DECLINED"

      - from: SENT
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: ThreatAssessor | TeamLead
        preconditions:
          - "Referral status == SENT (ERR_REFERRAL_NOT_SENT)"
        side_effects:
          - "AuditEvent REFERRAL_WITHDRAWN (compensates the send: count of SENT referrals for the case returns to its pre-send value)"

  - entity: MonitoringCheckIn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /monitoring-check-ins/{id}/complete"
        actor: ThreatAssessor
        preconditions:
          - "Check-in status == SCHEDULED (ERR_CHECKIN_NOT_SCHEDULED)"
          - "outcome in {ON_TRACK, CONCERNS_ESCALATED} (ERR_INVALID_REQUEST)"
        side_effects:
          - "completed_at=now; ThreatCase.consecutive_missed_count = 0; AuditEvent CHECKIN_COMPLETED"
          - "Auto-create next MonitoringCheckIn per the ACTIVE plan's cadence (see calculations.monitoring_next_due_date), unless a check-in with status IN {SCHEDULED, MISSED} already exists for that case and calendar day (COMPLETED/CANCELLED check-ins do not block)"
          - "If outcome == CONCERNS_ESCALATED: ThreatCase.escalation_flag=true + AuditEvent ESCALATION_RAISED"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (POST /_clock/set_current_utc advances the clock past due_date: current UTC date > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "ThreatCase.consecutive_missed_count += 1; AuditEvent CHECKIN_MISSED"
          - "If consecutive_missed_count reaches >= 2: ThreatCase.escalation_flag=true + AuditEvent ESCALATION_RAISED"

      - from: MISSED
        to: SCHEDULED
        trigger: "POST /monitoring-check-ins/{id}/reschedule"
        actor: ThreatAssessor
        preconditions:
          - "Check-in status == MISSED (ERR_CHECKIN_NOT_MISSED)"
          - "new_due_date >= current logical date (ERR_INVALID_DUE_DATE)"
          - "No other check-in with status IN {SCHEDULED, MISSED} for the case on new_due_date (ERR_CHECKIN_DAY_CONFLICT)"
        side_effects:
          - "due_date = new_due_date; consecutive_missed_count NOT reset (history preserved); AuditEvent CHECKIN_RESCHEDULED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from ThreatCase close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interviews/{id}/complete"
        actor: ThreatAssessor
        preconditions:
          - "Interview status == SCHEDULED (ERR_INTERVIEW_NOT_SCHEDULED)"
          - "findings_score in 0..10 and summary non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "completed_at=now; findings_score and summary recorded"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interviews/{id}/cancel"
        actor: ThreatAssessor
        preconditions:
          - "Interview status == SCHEDULED (ERR_INTERVIEW_NOT_SCHEDULED)"
        side_effects:
          - "Cancellation frees the case interview schedule and the per-case interview quota (CANCELLED interviews count toward neither)"

  - entity: ReEntryPlan
    initial_state: PROPOSED
    terminal_states: [DENIED, REENTERED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /re-entry-plans/{id}/approve"
        actor: TeamLead
        preconditions:
          - "Plan status == PROPOSED (ERR_REENTRY_NOT_PROPOSED)"
          - "X-User-ID != plan.created_by_user_id (ERR_SOD_SELF_APPROVAL - segregation of duties)"
          - "Case status == REMOVED (ERR_CASE_NOT_REMOVED)"
        side_effects:
          - "AuditEvent REENTRY_APPROVED"

      - from: PROPOSED
        to: DENIED
        trigger: "POST /re-entry-plans/{id}/deny"
        actor: TeamLead
        preconditions:
          - "Plan status == PROPOSED (ERR_REENTRY_NOT_PROPOSED)"
          - "denial_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "AuditEvent REENTRY_DENIED"

      - from: APPROVED
        to: REENTERED
        trigger: "POST /re-entry-plans/{id}/complete-re-entry"
        actor: TeamLead
        preconditions:
          - "Plan status == APPROVED (ERR_REENTRY_NOT_APPROVED)"
          - "Case status == REMOVED (ERR_CASE_NOT_REMOVED)"
          - "Every condition status == MET (ERR_REENTRY_CONDITIONS_UNMET)"
        side_effects:
          - "Case REMOVED -> PLAN_ACTIVE if an ACTIVE ManagementPlan exists, else REMOVED -> UNDER_ASSESSMENT"
          - "AuditEvent REENTRY_COMPLETED"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-activate-stale-case
    parent_entity: ThreatCase
    write_endpoint: "POST /management-plans/{id}/activate"
    occ_field: expected_threat_case_version
    description: |
      Activating a ManagementPlan against a ThreatCase whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just activated a plan on the
      same case (which legitimately supersedes the prior ACTIVE plan under
      the plan state machine) and the current writer's view of the case is
      therefore stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_score
    trigger: "POST /threat-cases/{id}/screening"
    algorithm: aggregation
    formula: |
      screening_score = count of the six boolean factors that are true:
        threat_of_violence, weapon_mention, target_identified,
        plan_described, prior_incidents, current_distress
      screening_outcome = SUBSTANTIVE if screening_score >= 3 else NON_SUBSTANTIVE
    input_set: "The six factor booleans in the request body; missing keys count as false"
    constants:
      SUBSTANTIVE_THRESHOLD: 3
    precision: "integer count"

  - name: assessment_risk_score
    trigger: "RiskAssessment creation and PUT update while DRAFT"
    algorithm: weighted_scoring
    formula: |
      factor weights: WEAPON_ACCESS=20, PLAN_SPECIFICITY=15, GRIEVANCE_HISTORY=10,
                      PEER_REPORTS=5, BEHAVIORAL_ESCALATION=10, SUPERVISION_GAP=8
      base = SUM(weight[code] * severity) over submitted factors (absent codes contribute 0)
      if any severity == 3: base += CRITICAL_BONUS
      raw_score = clamp(base, 0, 100)
      risk_level: LOW if raw_score < 20; MODERATE if 20 <= raw_score < 40;
                  HIGH if 40 <= raw_score < 60; IMMINENT if raw_score >= 60
    input_set: "The assessment's factors array"
    constants:
      CRITICAL_BONUS_STANDARD: 10
      CRITICAL_BONUS_EXPEDITED: 15
      EXPEDITED_MULTIPLIER: 1.5
    precision: "integer; EXPEDITED multiplication rounded half-up to integer BEFORE bonus and clamp"
    variants:
      - name: STANDARD
        when: "variant == STANDARD"
        difference: "All six factors count at 1x weight; CRITICAL_BONUS = 10"
      - name: EXPEDITED
        when: "variant == EXPEDITED"
        difference: "Only WEAPON_ACCESS and PLAN_SPECIFICITY count; their weighted sum is multiplied by 1.5 (round_half_up to integer) before adding CRITICAL_BONUS = 15 if any submitted factor (counted or not) has severity 3"

  - name: monitoring_next_due_date
    trigger: "MonitoringCheckIn completion (auto-create successor) and plan activation (first check-in = current date + cadence_days for both variants)"
    algorithm: forward_looking
    formula: |
      Let completion_date = UTC date of the completing request,
          anchor_date = UTC date of plan activation, cadence = plan.cadence_days.
      FROM_COMPLETION: next_due = completion_date + cadence days
      FIXED_ANCHOR:    next_due = anchor_date + k * cadence days for the
                       smallest integer k such that anchor_date + k*cadence > completion_date
    input_set: "The ACTIVE ManagementPlan of the case and the completing MonitoringCheckIn"
    precision: "calendar dates (YYYY-MM-DD), no time-of-day"
    variants:
      - name: FROM_COMPLETION
        when: "plan.cadence_mode == FROM_COMPLETION"
        difference: "Rolling schedule: late completion pushes the next due date out by the full cadence from the actual completion date"
      - name: FIXED_ANCHOR
        when: "plan.cadence_mode == FIXED_ANCHOR"
        difference: "Anchored schedule: due dates stay on the activation-date grid; a late completion does NOT shift the grid"

  - name: district_annual_report
    trigger: "GET /annual-reports/district?school_year=YYYY-YYYY"
    algorithm: aggregation
    formula: |
      School year window: [YYYY-08-01T00:00:00Z, (YYYY+1)-08-01T00:00:00Z) half-open.
      For each school with >= 1 ThreatCase whose created_at falls in the window:
        school_total = count of such cases (any status, including PURGED)
        school_substantiated = count of such cases with screening_outcome == SUBSTANTIVE
        school_rate = round_half_up(100 * school_substantiated / school_total, 2)
      district_substantiation_rate =
        round_half_up( SUM(school_rate over included schools) / count(included schools), 2 )
      ROUNDING ORDER IS PINNED: per-school rates are rounded to 2 decimals FIRST,
      then averaged and rounded again. Aggregating raw counts first is NOT equivalent.
      Schools with zero cases in the window are excluded from per_school AND from the mean.
      total_cases and substantiated_cases at district level are raw sums (not rates).
    input_set: "All ThreatCase rows (any status) with created_at in the school-year window"
    constants:
      SCHOOL_YEAR_START_MONTH: 8   # August 1
    precision: "rates: 2 decimal places, round_half_up; counts: integers"

  - name: referral_sla_due
    trigger: "Referral creation (manual or auto)"
    algorithm: threshold
    formula: |
      sla_due_at = sent_timestamp + 72 hours if urgency == URGENT
                 = sent_timestamp + 240 hours if urgency == ROUTINE
      sla_breached becomes true on clock advance when status == SENT and clock > sla_due_at;
      the breach also sets ThreatCase.escalation_flag = true and writes AuditEvent REFERRAL_SLA_BREACHED
    input_set: "The new Referral"
    constants:
      URGENT_SLA_HOURS: 72
      ROUTINE_SLA_HOURS: 240
    precision: "datetimes to the second"

  - name: retention_purge_eligibility
    trigger: "ThreatCase closure (computes retention_purge_after) and POST /records-retention/purge (selects purge set)"
    algorithm: threshold
    formula: |
      At closure: retention_purge_after = closed UTC date + School.retention_days (date arithmetic)
      Purge set: cases with status in {CLOSED_NO_THREAT, CLOSED_MANAGED},
                 purged_at IS NULL, and retention_purge_after <= current logical date
      BOUNDARY: a case whose retention_purge_after equals the current date IS purged (>= semantics)
    input_set: "All CLOSED_* ThreatCase rows and their school's retention_days"
    precision: "calendar dates (YYYY-MM-DD)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 2.5
    category: format
    check: "Request body schema: required fields present, types correct, enum values valid, non-empty constraints (conditions, decline_reason, denial_reason, summary) satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints with a body"

  - priority: 3
    category: existence
    check: "Path resource IDs exist, validated left-to-right"
    error_id: "ERR_CASE_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 3.5
    category: concurrency
    check: "expected_threat_case_version matches current ThreatCase.version (OCC; checked BEFORE state and business rules)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /management-plans/{id}/activate"

  - priority: 3.6
    category: existence
    check: "Body-referenced entities exist (school_id on case creation; case_id on interview/assessment/plan/referral/check-in/re-entry creation)"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /threat-cases, POST /interviews, POST /risk-assessments, POST /management-plans, POST /referrals, POST /monitoring-check-ins, POST /re-entry-plans"

  - priority: 4
    category: state
    check: "State precondition for the requested transition (per §1.2), covering BOTH the path-target resource AND the body-referenced case: case in INTAKE/TRIAGED/UNDER_ASSESSMENT/etc. for case actions; referenced case in UNDER_ASSESSMENT for interviews, in UNDER_ASSESSMENT|PLAN_ACTIVE for assessments/plans, in PLAN_ACTIVE for manual check-ins, in REMOVED for re-entry, non-terminal for referrals, non-PURGED for documents; assessment DRAFT/SUBMITTED; plan DRAFT; referral SENT; check-in SCHEDULED/MISSED; interview SCHEDULED; re-entry plan PROPOSED/APPROVED"
    error_id: "ERR_CASE_NOT_IN_INTAKE | ERR_CASE_NOT_TRIAGED | ERR_CASE_NOT_UNDER_ASSESSMENT | ERR_CASE_NOT_ASSESSABLE | ERR_CASE_NOT_PLANNABLE | ERR_CASE_NOT_PLAN_ACTIVE | ERR_CASE_NOT_REMOVABLE | ERR_CASE_NOT_CLOSABLE | ERR_CASE_NOT_REOPENABLE | ERR_CASE_NOT_REMOVED | ERR_CASE_NOT_OPEN | ERR_CASE_PURGED | ERR_ASSESSMENT_NOT_DRAFT | ERR_ASSESSMENT_NOT_SUBMITTED | ERR_PLAN_NOT_DRAFT | ERR_REFERRAL_NOT_SENT | ERR_CHECKIN_NOT_SCHEDULED | ERR_CHECKIN_NOT_MISSED | ERR_INTERVIEW_NOT_SCHEDULED | ERR_REENTRY_NOT_PROPOSED | ERR_REENTRY_NOT_APPROVED"
    http_status: 409
    applies_to: "all state-transition endpoints and child-creation endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: finalizer/approver X-User-ID must differ from creator X-User-ID"
    error_id: ERR_SOD_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /risk-assessments/{id}/finalize, POST /re-entry-plans/{id}/approve"

  - priority: 5.1
    category: business_safety
    check: "SUBJECT interview requires at least one COMPLETED non-SUBJECT interview for the case"
    error_id: ERR_SUBJECT_INTERVIEW_TOO_EARLY
    http_status: 409
    applies_to: "POST /interviews (interviewee_type=SUBJECT)"

  - priority: 5.2
    category: business_safety
    check: "Plan activation on HIGH/IMMINENT case requires an ACKNOWLEDGED LAW_ENFORCEMENT referral"
    error_id: ERR_LE_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /management-plans/{id}/activate"

  - priority: 5.3
    category: business_safety
    check: "Case close blocked by open obligations: SCHEDULED/MISSED check-ins, SENT referrals, unresolved escalation"
    error_id: "ERR_OPEN_CHECKINS_EXIST | ERR_OPEN_REFERRALS_EXIST | ERR_ESCALATION_UNRESOLVED"
    http_status: 409
    applies_to: "POST /threat-cases/{id}/close"

  - priority: 5.4
    category: business_safety
    check: "Re-entry completion requires every condition MET"
    error_id: ERR_REENTRY_CONDITIONS_UNMET
    http_status: 409
    applies_to: "POST /re-entry-plans/{id}/complete-re-entry"

  - priority: 6
    category: business_constraint
    check: "Uniqueness/quota: one open (DRAFT/SUBMITTED) assessment per case; one open (PROPOSED/APPROVED) re-entry plan per case; at most 8 non-CANCELLED interviews per case; school_code unique; condition index exists"
    error_id: "ERR_OPEN_ASSESSMENT_EXISTS | ERR_OPEN_REENTRY_PLAN_EXISTS | ERR_MAX_INTERVIEWS_EXCEEDED | ERR_DUPLICATE_SCHOOL_CODE | ERR_CONDITION_NOT_FOUND"
    http_status: 409
    applies_to: "POST /risk-assessments, POST /re-entry-plans, POST /interviews, POST /schools, POST /re-entry-plans/{id}/conditions/{conditionIndex}/verify"
    note: "ERR_CONDITION_NOT_FOUND is http 404 (existence within the plan's conditions array)"

  - priority: 6.1
    category: business_constraint
    check: "cadence_days must not exceed the maximum for the case's risk level {IMMINENT:7, HIGH:14, MODERATE:30, LOW:60}"
    error_id: ERR_CADENCE_TOO_LONG
    http_status: 422
    applies_to: "POST /management-plans"

  - priority: 7
    category: business_temporal
    check: "Interview half-open interval overlap per case (adjacency allowed); one check-in per case per calendar day; due_date not in the past; ends_at strictly after starts_at"
    error_id: "ERR_INTERVIEW_OVERLAP | ERR_CHECKIN_DAY_CONFLICT | ERR_INVALID_DUE_DATE | ERR_INVALID_TIME_RANGE"
    http_status: 409
    applies_to: "POST /interviews, POST /monitoring-check-ins, POST /monitoring-check-ins/{id}/reschedule"
    note: "ERR_INVALID_TIME_RANGE and ERR_INVALID_DUE_DATE are http 400; overlap conflicts are 409"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Admin / configuration ---
  - method: POST
    path: "/schools"
    description: "Create a school"
    roles: [DistrictAdministrator]
    code: 201
    input: [name, school_code, enrollment_count, "retention_days?"]
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}"
    description: "Get a school"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; before any call the logical clock reads this default and never falls back to wall-clock time. All server-stamped timestamps (created_at, closed_at, sla_due_at, etc.) use this logical clock. Advancing the clock applies pending automatic transitions: SCHEDULED check-ins whose due_date is before the new current date become MISSED (with cascades), and SENT referrals past sla_due_at get sla_breached=true + case escalation. to_iso8601 must be >= the current logical time (else ERR_INVALID_REQUEST)."
    roles: [DistrictAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["check-in MISS sweep + consecutive-miss cascade + AuditEvent CHECKIN_MISSED/ESCALATION_RAISED", "referral SLA breach sweep: sla_breached=true + AuditEvent REFERRAL_SLA_BREACHED + case escalation_flag=true"]

  - method: POST
    path: "/records-retention/purge"
    description: "Purge all retention-eligible CLOSED cases (see calculations.retention_purge_eligibility)"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: { purged_count: integer, purged_case_ids: array }
    side_effects: ["eligible cases -> PURGED; their CaseDocuments scrubbed (body=null, purged=true)"]

  - method: GET
    path: "/annual-reports/district"
    description: "Computed district-level annual data report for a school year (see calculations.district_annual_report)"
    roles: [TeamLead, DistrictAdministrator]
    code: 200
    input: [school_year]
    output: { school_year: string, total_cases: integer, substantiated_cases: integer, per_school: array, district_substantiation_rate: number }
    side_effects: []

  # --- Threat cases ---
  - method: POST
    path: "/threat-cases"
    description: "Intake: create a threat case from a tip-line or staff referral"
    roles: [IntakeCoordinator]
    code: 201
    input: [school_id, subject_alias, reporter_channel, summary]
    output: ThreatCase
    side_effects: ["status=INTAKE; AuditEvent CASE_CREATED"]

  - method: GET
    path: "/threat-cases"
    description: "List threat cases with filters and pagination"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["school_id?", "status?", "risk_level?", "limit?", "offset?"]
    output: "ThreatCase[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}"
    description: "Get a threat case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: []
    output: ThreatCase
    side_effects: []

  - method: POST
    path: "/threat-cases/{id}/triage"
    description: "Triage an INTAKE case"
    roles: [IntakeCoordinator]
    code: 200
    input: [triage_priority, triage_notes]
    output: ThreatCase
    side_effects: ["INTAKE->TRIAGED", "EMERGENT: auto-create URGENT LAW_ENFORCEMENT referral"]

  - method: POST
    path: "/threat-cases/{id}/screening"
    description: "Record the initial screening for a TRIAGED case; outcome auto-computed from the six factors"
    roles: [ThreatAssessor]
    code: 200
    input: [threat_of_violence, weapon_mention, target_identified, plan_described, prior_incidents, current_distress]
    output: ThreatCase
    side_effects: ["screening_score/outcome recorded", "TRIAGED->UNDER_ASSESSMENT (SUBSTANTIVE) or TRIAGED->CLOSED_NO_THREAT (NON_SUBSTANTIVE with closed_at + retention_purge_after)"]

  - method: POST
    path: "/threat-cases/{id}/remove"
    description: "Remove the subject from campus (emergency removal or disciplinary exclusion)"
    roles: [TeamLead]
    code: 200
    input: [removal_type, removal_reason]
    output: ThreatCase
    side_effects: ["UNDER_ASSESSMENT|PLAN_ACTIVE -> REMOVED", "AuditEvent CASE_REMOVED"]

  - method: POST
    path: "/threat-cases/{id}/close"
    description: "Close a PLAN_ACTIVE case as managed"
    roles: [TeamLead]
    code: 200
    input: []
    output: ThreatCase
    side_effects: ["PLAN_ACTIVE->CLOSED_MANAGED", "closed_at + retention_purge_after set", "ACTIVE/DRAFT plans -> CLOSED"]

  - method: POST
    path: "/threat-cases/{id}/reopen"
    description: "Reopen a closed case on a new report"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ThreatCase
    side_effects: ["CLOSED_*->TRIAGED", "closure fields cleared, missed counter and escalation reset"]

  # --- Case sub-resource reads (FK reverse reachability) ---
  - method: GET
    path: "/threat-cases/{id}/interviews"
    description: "List interviews for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Interview[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/risk-assessments"
    description: "List risk assessments for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RiskAssessment[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/management-plans"
    description: "List management plans for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ManagementPlan[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/referrals"
    description: "List referrals for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["referral_type?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/monitoring-check-ins"
    description: "List monitoring check-ins for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MonitoringCheckIn[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/re-entry-plans"
    description: "List re-entry plans for a case"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReEntryPlan[]"
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/documents"
    description: "List case documents; sealed documents are EXCLUDED from the response for IntakeCoordinator and ThreatAssessor (visible to TeamLead and DistrictAdministrator)"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead, DistrictAdministrator]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: "CaseDocument[]"
    side_effects: []

  - method: POST
    path: "/threat-cases/{id}/documents"
    description: "Append a case document (append-only; allowed on any case whose status != PURGED)"
    roles: [IntakeCoordinator, ThreatAssessor, TeamLead]
    code: 201
    input: [doc_type, body, "sealed?"]
    output: CaseDocument
    side_effects: []

  - method: GET
    path: "/threat-cases/{id}/audit-events"
    description: "List the case's tamper-evident audit trail (confidential)"
    roles: [TeamLead, DistrictAdministrator]
    code: 200
    input: ["action?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Interviews ---
  - method: POST
    path: "/interviews"
    description: "Schedule an interview for a case in UNDER_ASSESSMENT"
    roles: [ThreatAssessor]
    code: 201
    input: [case_id, interviewee_type, starts_at, ends_at]
    output: Interview
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/interviews/{id}/complete"
    description: "Complete a scheduled interview with findings"
    roles: [ThreatAssessor]
    code: 200
    input: [findings_score, summary]
    output: Interview
    side_effects: ["SCHEDULED->COMPLETED", "completed_at=now"]

  - method: POST
    path: "/interviews/{id}/cancel"
    description: "Cancel a scheduled interview (frees schedule and per-case quota)"
    roles: [ThreatAssessor]
    code: 200
    input: []
    output: Interview
    side_effects: ["SCHEDULED->CANCELLED"]

  # --- Risk assessments ---
  - method: POST
    path: "/risk-assessments"
    description: "Create a DRAFT risk assessment (scores computed immediately)"
    roles: [ThreatAssessor]
    code: 201
    input: [case_id, variant, factors]
    output: RiskAssessment
    side_effects: ["raw_score and risk_level computed per variant", "status=DRAFT", "created_by_user_id = X-User-ID"]

  - method: PUT
    path: "/risk-assessments/{id}"
    description: "Replace factors/variant of a DRAFT assessment; scores recomputed"
    roles: [ThreatAssessor]
    code: 200
    input: ["variant?", "factors?"]
    output: RiskAssessment
    side_effects: ["raw_score and risk_level recomputed"]

  - method: POST
    path: "/risk-assessments/{id}/submit"
    description: "Submit a DRAFT assessment for team-lead review"
    roles: [ThreatAssessor]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: ["DRAFT->SUBMITTED"]

  - method: POST
    path: "/risk-assessments/{id}/return"
    description: "Return a SUBMITTED assessment to DRAFT for revision"
    roles: [TeamLead]
    code: 200
    input: [return_reason]
    output: RiskAssessment
    side_effects: ["SUBMITTED->DRAFT"]

  - method: POST
    path: "/risk-assessments/{id}/finalize"
    description: "Finalize a SUBMITTED assessment (SoD: finalizer != creator); sets case risk level and fires the IMMINENT cascade"
    roles: [TeamLead]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: ["SUBMITTED->FINALIZED", "case.risk_level updated", "prior FINALIZED assessment -> SUPERSEDED", "IMMINENT cascade (auto LE referral -> escalation -> plan needs_review)"]

  # --- Management plans ---
  - method: POST
    path: "/management-plans"
    description: "Draft a management plan for a case with a FINALIZED assessment"
    roles: [ThreatAssessor]
    code: 201
    input: [case_id, cadence_mode, "cadence_days?", conditions]
    output: ManagementPlan
    side_effects: ["status=DRAFT", "cadence_days defaulted by risk level when omitted"]

  - method: POST
    path: "/management-plans/{id}/activate"
    description: "Activate a DRAFT plan (OCC-guarded; supersedes the prior ACTIVE plan)"
    roles: [TeamLead]
    code: 200
    input: [expected_threat_case_version]
    output: ManagementPlan
    side_effects: ["DRAFT->ACTIVE", "increments ThreatCase.version by 1", "prior ACTIVE plan -> SUPERSEDED", "case -> PLAN_ACTIVE with cadence copied and escalation cleared", "first check-in auto-created"]

  # --- Referrals ---
  - method: POST
    path: "/referrals"
    description: "Create and send a law-enforcement or mental-health referral (creation IS the send)"
    roles: [ThreatAssessor, TeamLead]
    code: 201
    input: [case_id, referral_type, agency_name, urgency]
    output: Referral
    side_effects: ["status=SENT", "sla_due_at computed", "AuditEvent REFERRAL_SENT"]

  - method: POST
    path: "/referrals/{id}/acknowledge"
    description: "Mark a SENT referral acknowledged by the receiving agency"
    roles: [ThreatAssessor, TeamLead]
    code: 200
    input: []
    output: Referral
    side_effects: ["SENT->ACKNOWLEDGED"]

  - method: POST
    path: "/referrals/{id}/decline"
    description: "Mark a SENT referral declined"
    roles: [ThreatAssessor, TeamLead]
    code: 200
    input: [decline_reason]
    output: Referral
    side_effects: ["SENT->DECLINED"]

  - method: POST
    path: "/referrals/{id}/withdraw"
    description: "Withdraw a SENT referral (compensating action for the send)"
    roles: [ThreatAssessor, TeamLead]
    code: 200
    input: []
    output: Referral
    side_effects: ["SENT->WITHDRAWN"]

  # --- Monitoring check-ins ---
  - method: POST
    path: "/monitoring-check-ins"
    description: "Manually schedule a check-in for a PLAN_ACTIVE case"
    roles: [ThreatAssessor]
    code: 201
    input: [case_id, due_date]
    output: MonitoringCheckIn
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/monitoring-check-ins/{id}/complete"
    description: "Complete a scheduled check-in; chains the next check-in per the active plan's cadence mode"
    roles: [ThreatAssessor]
    code: 200
    input: [outcome, notes]
    output: MonitoringCheckIn
    side_effects: ["SCHEDULED->COMPLETED", "consecutive_missed_count=0", "next check-in auto-created per cadence", "CONCERNS_ESCALATED sets case escalation_flag"]

  - method: POST
    path: "/monitoring-check-ins/{id}/reschedule"
    description: "Reschedule a MISSED check-in to a new due date"
    roles: [ThreatAssessor]
    code: 200
    input: [new_due_date]
    output: MonitoringCheckIn
    side_effects: ["MISSED->SCHEDULED", "due_date updated; missed history preserved"]

  # --- Re-entry ---
  - method: POST
    path: "/re-entry-plans"
    description: "Propose re-entry conditions for a REMOVED case"
    roles: [ThreatAssessor]
    code: 201
    input: [case_id, conditions]
    output: ReEntryPlan
    side_effects: ["status=PROPOSED", "conditions stored with status UNMET", "AuditEvent REENTRY_PROPOSED"]

  - method: POST
    path: "/re-entry-plans/{id}/approve"
    description: "Approve a PROPOSED re-entry plan (SoD: approver != proposer)"
    roles: [TeamLead]
    code: 200
    input: []
    output: ReEntryPlan
    side_effects: ["PROPOSED->APPROVED"]

  - method: POST
    path: "/re-entry-plans/{id}/deny"
    description: "Deny a PROPOSED re-entry plan"
    roles: [TeamLead]
    code: 200
    input: [denial_reason]
    output: ReEntryPlan
    side_effects: ["PROPOSED->DENIED"]

  - method: POST
    path: "/re-entry-plans/{id}/conditions/{conditionIndex}/verify"
    description: "Mark one condition (zero-based index) MET with evidence; allowed while PROPOSED or APPROVED"
    roles: [ThreatAssessor]
    code: 200
    input: [evidence_note]
    output: ReEntryPlan
    side_effects: ["conditions[conditionIndex].status = MET"]

  - method: POST
    path: "/re-entry-plans/{id}/complete-re-entry"
    description: "Complete re-entry: all conditions MET, case returns to PLAN_ACTIVE (active plan) or UNDER_ASSESSMENT"
    roles: [TeamLead]
    code: 200
    input: []
    output: ReEntryPlan
    side_effects: ["APPROVED->REENTERED", "case REMOVED->PLAN_ACTIVE|UNDER_ASSESSMENT", "re-entry check-in auto-created (due in 30 days) when returning to PLAN_ACTIVE"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, or empty required string/array" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "ends_at is not strictly after starts_at" }
  - { id: ERR_INVALID_DUE_DATE, http: 400, condition: "due_date/new_due_date is before the current logical date" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource (other than a threat case / school / re-entry condition) does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Threat case does not exist (path or body case_id)" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "school_id references a non-existent school" }
  - { id: ERR_CONDITION_NOT_FOUND, http: 404, condition: "conditionIndex out of range for the plan's conditions array" }

  # --- OCC ---
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_threat_case_version does not match the case's current version" }

  # --- Case state ---
  - { id: ERR_CASE_NOT_IN_INTAKE, http: 409, condition: "Triage requires status INTAKE" }
  - { id: ERR_CASE_NOT_TRIAGED, http: 409, condition: "Screening requires status TRIAGED" }
  - { id: ERR_CASE_NOT_UNDER_ASSESSMENT, http: 409, condition: "Interview scheduling requires status UNDER_ASSESSMENT" }
  - { id: ERR_CASE_NOT_ASSESSABLE, http: 409, condition: "Risk assessment creation requires status UNDER_ASSESSMENT or PLAN_ACTIVE" }
  - { id: ERR_CASE_NOT_PLANNABLE, http: 409, condition: "Plan creation/activation requires status UNDER_ASSESSMENT or PLAN_ACTIVE" }
  - { id: ERR_CASE_NOT_PLAN_ACTIVE, http: 409, condition: "Manual check-in scheduling requires status PLAN_ACTIVE" }
  - { id: ERR_CASE_NOT_REMOVABLE, http: 409, condition: "Removal requires status UNDER_ASSESSMENT or PLAN_ACTIVE" }
  - { id: ERR_CASE_NOT_CLOSABLE, http: 409, condition: "Close requires status PLAN_ACTIVE" }
  - { id: ERR_CASE_NOT_REOPENABLE, http: 409, condition: "Reopen requires status CLOSED_NO_THREAT or CLOSED_MANAGED" }
  - { id: ERR_CASE_NOT_REMOVED, http: 409, condition: "Re-entry plan creation/approval/completion requires status REMOVED" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Referral creation requires a non-terminal case status (TRIAGED, UNDER_ASSESSMENT, PLAN_ACTIVE, or REMOVED)" }
  - { id: ERR_CASE_PURGED, http: 409, condition: "Operation not allowed on a PURGED case (e.g., adding documents)" }

  # --- Resource state ---
  - { id: ERR_ASSESSMENT_NOT_DRAFT, http: 409, condition: "Submit/PUT requires assessment status DRAFT" }
  - { id: ERR_ASSESSMENT_NOT_SUBMITTED, http: 409, condition: "Finalize/return requires assessment status SUBMITTED" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Activation requires plan status DRAFT" }
  - { id: ERR_REFERRAL_NOT_SENT, http: 409, condition: "Acknowledge/decline/withdraw requires referral status SENT" }
  - { id: ERR_CHECKIN_NOT_SCHEDULED, http: 409, condition: "Completion requires check-in status SCHEDULED" }
  - { id: ERR_CHECKIN_NOT_MISSED, http: 409, condition: "Reschedule requires check-in status MISSED" }
  - { id: ERR_INTERVIEW_NOT_SCHEDULED, http: 409, condition: "Complete/cancel requires interview status SCHEDULED" }
  - { id: ERR_REENTRY_NOT_PROPOSED, http: 409, condition: "Approve/deny requires re-entry plan status PROPOSED" }
  - { id: ERR_REENTRY_NOT_APPROVED, http: 409, condition: "Complete-re-entry requires plan status APPROVED" }

  # --- Business safety / compliance ---
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "Segregation of duties: finalizer/approver X-User-ID equals the creator's X-User-ID" }
  - { id: ERR_SUBJECT_INTERVIEW_TOO_EARLY, http: 409, condition: "SUBJECT interview scheduled before any non-SUBJECT interview is COMPLETED for the case" }
  - { id: ERR_LE_REFERRAL_REQUIRED, http: 409, condition: "HIGH/IMMINENT case plan activation lacks an ACKNOWLEDGED LAW_ENFORCEMENT referral" }
  - { id: ERR_OPEN_CHECKINS_EXIST, http: 409, condition: "Close blocked: MISSED check-ins exist (SCHEDULED ones are auto-CANCELLED by the close cascade)" }
  - { id: ERR_OPEN_REFERRALS_EXIST, http: 409, condition: "Close blocked: SENT referrals exist" }
  - { id: ERR_ESCALATION_UNRESOLVED, http: 409, condition: "Close blocked: case escalation_flag is true" }
  - { id: ERR_REENTRY_CONDITIONS_UNMET, http: 409, condition: "Complete-re-entry blocked: at least one condition is UNMET" }

  # --- Business constraint ---
  - { id: ERR_OPEN_ASSESSMENT_EXISTS, http: 409, condition: "Case already has a DRAFT or SUBMITTED assessment" }
  - { id: ERR_OPEN_REENTRY_PLAN_EXISTS, http: 409, condition: "Case already has a PROPOSED or APPROVED re-entry plan" }
  - { id: ERR_MAX_INTERVIEWS_EXCEEDED, http: 409, condition: "Case already has 8 non-CANCELLED interviews" }
  - { id: ERR_DUPLICATE_SCHOOL_CODE, http: 409, condition: "school_code already in use" }
  - { id: ERR_NO_FINALIZED_ASSESSMENT, http: 409, condition: "Plan creation/activation requires a FINALIZED risk assessment for the case" }
  - { id: ERR_CADENCE_TOO_LONG, http: 422, condition: "cadence_days exceeds the maximum for the case's risk level" }

  # --- Temporal ---
  - { id: ERR_INTERVIEW_OVERLAP, http: 409, condition: "New interview overlaps a SCHEDULED interview for the same case (half-open intervals; adjacency allowed)" }
  - { id: ERR_CHECKIN_DAY_CONFLICT, http: 409, condition: "Another check-in with status IN {SCHEDULED, MISSED} already exists for the case on that calendar day" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Tip-line / front-office intake staff; owns report intake, triage, and reopening closed cases"
    identity: opaque
    exclusive_operations:
      - "POST /threat-cases — case intake"
      - "POST /threat-cases/{id}/triage — triage decision"
      - "POST /threat-cases/{id}/reopen — reopen closed case"
    shared_operations:
      - "GET reads on schools, cases, and case sub-resources (except audit-events)"
      - "POST /threat-cases/{id}/documents — append case documentation"

  - name: ThreatAssessor
    description: "Behavioral threat assessment team member (psychologist/counselor); conducts screenings, interviews, assessments, drafts plans, coordinates referrals, runs monitoring"
    identity: opaque
    exclusive_operations:
      - "POST /threat-cases/{id}/screening — record initial screening"
      - "POST /interviews + complete/cancel — interview protocol"
      - "POST /risk-assessments, PUT /risk-assessments/{id}, POST .../submit — draft assessments"
      - "POST /management-plans — draft management plans"
      - "POST /monitoring-check-ins + complete/reschedule — monitoring cadence execution"
      - "POST /re-entry-plans — propose re-entry conditions"
      - "POST /re-entry-plans/{id}/conditions/{conditionIndex}/verify — verify conditions"
    shared_operations:
      - "POST /referrals + acknowledge/decline/withdraw (shared with TeamLead)"
      - "GET reads on schools, cases, and case sub-resources (except audit-events)"
      - "POST /threat-cases/{id}/documents — append case documentation"

  - name: TeamLead
    description: "Threat assessment team chair; finalizes assessments, activates plans, decides removals/closures, approves re-entry; reads confidential records"
    identity: opaque
    exclusive_operations:
      - "POST /risk-assessments/{id}/return + finalize — assessment adjudication"
      - "POST /management-plans/{id}/activate — plan activation"
      - "POST /threat-cases/{id}/remove — subject removal"
      - "POST /threat-cases/{id}/close — case closure"
      - "POST /re-entry-plans/{id}/approve + deny + complete-re-entry — re-entry adjudication"
    shared_operations:
      - "POST /referrals + acknowledge/decline/withdraw (shared with ThreatAssessor)"
      - "GET /annual-reports/district (shared with DistrictAdministrator)"
      - "GET /threat-cases/{id}/audit-events (shared with DistrictAdministrator)"
      - "GET reads including sealed documents"
      - "POST /threat-cases/{id}/documents — append case documentation"

  - name: DistrictAdministrator
    description: "District operations administrator; manages schools, the logical clock, records-retention purges, and district reporting"
    identity: opaque
    exclusive_operations:
      - "POST /schools — school configuration"
      - "POST /_clock/set_current_utc — logical clock"
      - "POST /records-retention/purge — retention purge"
    shared_operations:
      - "GET /annual-reports/district (shared with TeamLead)"
      - "GET /threat-cases/{id}/audit-events (shared with TeamLead)"
      - "GET reads on schools, cases, and case sub-resources including sealed documents"
