scenario: "desgin task harder than expert level.!!!!2181. Athlete Endorsement & Appearance Booking (athlete marketing agency): opportunity intake & brand-fit screening, availability & travel logistics, appearance fee, usage rights & morals clause negotiation, exclusivity conflicts across categories, deliverable tracking (posts/appearances/shoots) & approval workflow, disclosure compliance for paid promotion, payment & commission distribution, contract renewal & performance bonus"
domain_name: athlete-endorsement-booking
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Agency-side booking desk. Brands file endorsement opportunities against a rostered athlete;
    compliance screens brand fit; the agent and the brand trade TermSheet rounds (cyclic
    SUBMITTED -> COUNTERED -> SUBMITTED) over fee, usage rights, morals-clause tier and category
    exclusivity; acceptance mints an Engagement carrying two INDEPENDENT status dimensions
    (contract_status x settlement_status). Appearance logistics occupy the athlete's calendar with
    travel buffers (closed intervals), shoots occupy a ProductionSlot (half-open intervals with
    aggregate capacity), and category exclusivity occupies an inclusive day-range register.
    Money is conserved through an append-only LedgerEntry stream; exclusivity slots are conserved
    through Athlete.active_exclusivity_count.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Athlete legal name."
      - name: sport
        type: string
        source: input
        description: "Sport discipline, free text (e.g. BASKETBALL)."
      - name: market_tier
        type: enum
        source: input
        description: "Commercial reach band; drives tier_weight in brand_fit_score and market_escalator in renewal pricing."
        constraints: "One of GLOBAL, NATIONAL, REGIONAL."
      - name: base_appearance_rate_cents
        type: integer
        source: input
        description: "Card rate for one appearance day, in cents; base of expected_fee_cents, exclusivity uplift and travel component."
        constraints: "integer >= 1"
      - name: commission_pct
        type: number
        source: input
        description: "Agency commission fraction applied per payout line."
        constraints: "0 < commission_pct <= 0.50"
      - name: home_market
        type: string
        source: input
        description: "Home market code, informational only."
        default: "US"
      - name: status
        type: enum
        source: system
        description: "Roster status gating negotiation and booking."
        default: "ACTIVE"
        constraints: "One of ACTIVE, SUSPENDED, RETIRED."
      - name: active_exclusivity_count
        type: integer
        source: computed
        description: "Conserved quantity: count of ExclusivityGrant rows for this athlete whose status == ACTIVE."
        default: 0
      - name: exposure_risk_snapshot_score
        type: integer
        source: computed
        description: "Denormalized ROSTER_SNAPSHOT variant of athlete_exposure_risk_score, recomputed whenever active_exclusivity_count, an owned Engagement contract_status, or a DisclosureRecord ruling changes."
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: "Count of AppearanceBooking rows for this athlete whose outcome == NO_SHOW."
        default: 0

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Brand trading name."
      - name: category
        type: enum
        source: input
        description: "Endorsement category the brand competes in; exclusivity conflicts are evaluated per category."
        constraints: "One of BEVERAGE, FOOTWEAR, FINANCIAL, AUTOMOTIVE, GAMING, NUTRITION."
      - name: legal_entity_name
        type: string
        source: input
        description: "Contracting legal entity."
      - name: compliance_rating
        type: integer
        source: input
        description: "Third-party brand compliance rating, weight 0.40 in brand_fit_score."
        constraints: "integer 0..100"
      - name: sanctioned
        type: boolean
        source: system
        description: "True once compliance flags the brand; blocks TermSheet acceptance."
        default: false
      - name: sanction_reason
        type: string
        source: system
        description: "Free-text reason captured by the last sanction call; null while sanctioned == false."
        default: null

  - name: Opportunity
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; must equal X-User-ID when the caller is a BrandRep."
      - name: athlete_id
        type: string
        source: input
        description: "FK -> Athlete.id; the athlete the brand wants to book."
      - name: requested_start_date
        type: string
        source: input
        description: "Inclusive first day of the requested engagement term, ISO date (YYYY-MM-DD)."
      - name: requested_end_date
        type: string
        source: input
        description: "Inclusive last day of the requested engagement term, ISO date; must be >= requested_start_date."
      - name: proposed_fee_cents
        type: integer
        source: input
        description: "Brand's opening fee offer in cents; numerator of fee_alignment."
        constraints: "integer >= 0"
      - name: planned_posts
        type: integer
        source: input
        description: "Planned SOCIAL_POST deliverable count; workload weight 1 each."
        constraints: "integer >= 0"
      - name: planned_appearances
        type: integer
        source: input
        description: "Planned APPEARANCE deliverable count; workload weight 4 each."
        constraints: "integer >= 0"
      - name: planned_shoots
        type: integer
        source: input
        description: "Planned SHOOT deliverable count; workload weight 2 each."
        constraints: "integer >= 0"
      - name: exclusivity_category
        type: enum
        source: input
        description: "Category the brand wants locked on the athlete."
        constraints: "One of BEVERAGE, FOOTWEAR, FINANCIAL, AUTOMOTIVE, GAMING, NUTRITION."
      - name: exclusivity_months
        type: integer
        source: input
        description: "Requested exclusivity length in whole months; drives exclusivity_penalty and the grant end_date."
        constraints: "integer 0..36"
      - name: territory
        type: enum
        source: input
        description: "Rights territory; drives territory_multiplier."
        constraints: "One of DOMESTIC, NORTH_AMERICA, GLOBAL."
      - name: usage_rights_tier
        type: enum
        source: input
        description: "Requested usage rights; drives usage_multiplier."
        constraints: "One of SOCIAL_ONLY, BROADCAST, PERPETUAL."
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle state."
        default: "INTAKE"
        constraints: "One of INTAKE, SCREENED, REJECTED_FIT, CONTRACTED, CLOSED_LOST."
      - name: expected_fee_cents
        type: integer
        source: computed
        description: "Card-rate value of the requested workload; set by the screen call."
        default: null
      - name: brand_fit_score
        type: integer
        source: computed
        description: "0..100 screening score; >= 60 screens in."
        default: null
      - name: screened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who screened this opportunity; the segregation-of-duties key."
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: "Logical-clock instant of screening."
        default: null

  - name: TermSheet
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: "FK -> Opportunity.id; the screened opportunity this paper covers."
      - name: round_number
        type: integer
        source: system
        description: "Negotiation round; starts at 1 and increments on every revise."
        default: 1
      - name: counter_count
        type: integer
        source: system
        description: "Number of brand counters received; capped by MAX_COUNTER_ROUNDS."
        default: 0
      - name: fee_cents
        type: integer
        source: input
        description: "Negotiated headline fee in cents (base of the appearance-fee engine)."
        constraints: "integer >= 1"
      - name: usage_rights_tier
        type: enum
        source: input
        description: "Usage rights currently on the table."
        constraints: "One of SOCIAL_ONLY, BROADCAST, PERPETUAL."
      - name: usage_term_months
        type: integer
        source: input
        description: "Months the usage licence runs for; informational for pricing, carried onto the Engagement."
        constraints: "integer 1..60"
      - name: territory
        type: enum
        source: input
        description: "Rights territory currently on the table."
        constraints: "One of DOMESTIC, NORTH_AMERICA, GLOBAL."
      - name: morals_clause_tier
        type: enum
        source: input
        description: "Strictness of the morals clause the athlete accepts; TIER_A strictest, TIER_C loosest."
        constraints: "One of TIER_A, TIER_B, TIER_C."
      - name: exclusivity_category
        type: enum
        source: system
        description: "Copied verbatim from the parent Opportunity at creation; not client-settable."
      - name: exclusivity_months
        type: integer
        source: input
        description: "Exclusivity length currently on the table."
        constraints: "integer 0..36"
      - name: appearance_days
        type: integer
        source: input
        description: "Appearance days the agent commits to in this round; recorded on the Engagement."
        constraints: "integer >= 0"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of appearance_fee_engine, recomputed on every submit and revise."
        default: null
      - name: offer_expires_at
        type: datetime
        source: system
        description: "Logical-clock instant + OFFER_VALID_DAYS, stamped on every submit; acceptance after it expires the paper."
        default: null
      - name: last_counter_morals_tier
        type: enum
        source: system
        description: "Morals tier demanded by the most recent brand counter; a revise may not propose a looser tier."
        default: null
      - name: status
        type: enum
        source: system
        description: "Negotiation state."
        default: "DRAFT"
        constraints: "One of DRAFT, SUBMITTED, COUNTERED, ACCEPTED, WITHDRAWN, EXPIRED."

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: term_sheet_id
        type: string
        source: system
        description: "FK -> TermSheet.id; the accepted paper."
      - name: opportunity_id
        type: string
        source: system
        description: "FK -> Opportunity.id; carried through for the segregation-of-duties lookup."
      - name: athlete_id
        type: string
        source: system
        description: "FK -> Athlete.id; copied from the opportunity."
      - name: brand_id
        type: string
        source: system
        description: "FK -> Brand.id; copied from the opportunity."
      - name: contract_status
        type: enum
        source: system
        description: "Contract dimension of the parallel state machine."
        default: "PENDING_COUNTERSIGN"
        constraints: "One of PENDING_COUNTERSIGN, ACTIVE, COMPLETED, TERMINATED."
      - name: settlement_status
        type: enum
        source: system
        description: "Money dimension of the parallel state machine; advances independently of contract_status."
        default: "UNBILLED"
        constraints: "One of UNBILLED, BILLABLE, INVOICED, SETTLED."
      - name: base_fee_cents
        type: integer
        source: system
        description: "TermSheet.fee_cents at acceptance."
      - name: usage_rights_tier
        type: enum
        source: system
        description: "Copied from the accepted TermSheet."
        constraints: "One of SOCIAL_ONLY, BROADCAST, PERPETUAL."
      - name: morals_clause_tier
        type: enum
        source: system
        description: "Copied from the accepted TermSheet; weight 3/2/1 for TIER_A/TIER_B/TIER_C in exposure risk."
        constraints: "One of TIER_A, TIER_B, TIER_C."
      - name: territory
        type: enum
        source: system
        description: "Copied from the accepted TermSheet."
        constraints: "One of DOMESTIC, NORTH_AMERICA, GLOBAL."
      - name: exclusivity_category
        type: enum
        source: system
        description: "Copied from the accepted TermSheet."
      - name: exclusivity_months
        type: integer
        source: system
        description: "Copied from the accepted TermSheet."
      - name: term_start_date
        type: string
        source: system
        description: "Opportunity.requested_start_date; inclusive first day bookings may fall on."
      - name: term_end_date
        type: string
        source: system
        description: "Opportunity.requested_end_date; inclusive last day bookings may fall on."
      - name: provisional_fee_cents
        type: integer
        source: system
        description: "TermSheet.provisional_fee_cents frozen at acceptance."
      - name: binding_fee_cents
        type: integer
        source: computed
        description: "BINDING variant of appearance_fee_engine; null until countersign, then frozen."
        default: null
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "Conserved money quantity: sum of LedgerEntry.amount_cents for this engagement whose entry_type IN {TRAVEL_ACCRUAL, REVERSAL, PENALTY, BONUS}."
        default: 0
      - name: gross_settled_cents
        type: integer
        source: computed
        description: "Sum of PayoutStatement.gross_amount_cents over this engagement's statements whose status == DISBURSED."
        default: 0
      - name: required_deliverable_count
        type: integer
        source: system
        description: "planned_posts + planned_appearances + planned_shoots from the opportunity, frozen at acceptance."
      - name: approved_deliverable_count
        type: integer
        source: computed
        description: "Count of this engagement's Deliverable rows whose status == APPROVED."
        default: 0
      - name: appearance_days_committed
        type: integer
        source: system
        description: "TermSheet.appearance_days at acceptance."
      - name: countersigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceManager who countersigned."
        default: null
      - name: countersigned_at
        type: datetime
        source: system
        description: "Logical-clock instant of countersignature."
        default: null
      - name: terminated_reason_code
        type: string
        source: system
        description: "Reason code recorded by the terminate call."
        default: null

  - name: ExclusivityGrant
    parent: null
    common_fields: true
    fields:
      - name: athlete_id
        type: string
        source: system
        description: "FK -> Athlete.id; the athlete whose category slot is occupied."
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement holding the slot."
      - name: category
        type: enum
        source: system
        description: "Locked category."
        constraints: "One of BEVERAGE, FOOTWEAR, FINANCIAL, AUTOMOTIVE, GAMING, NUTRITION."
      - name: start_date
        type: string
        source: system
        description: "Inclusive first locked day = Engagement.term_start_date."
      - name: end_date
        type: string
        source: system
        description: "Inclusive last locked day = start_date + exclusivity_months months - 1 day."
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle; PENDING and ACTIVE both occupy the register for conflict detection."
        default: "PENDING"
        constraints: "One of PENDING, ACTIVE, RELEASED."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the slot was released."
        default: null

  - name: AppearanceBooking
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement the appearance is billed to."
      - name: city
        type: string
        source: input
        description: "Appearance city, informational."
      - name: start_at
        type: datetime
        source: input
        description: "Appearance start instant (UTC, ISO 8601)."
      - name: end_at
        type: datetime
        source: input
        description: "Appearance end instant (UTC, ISO 8601); must be strictly after start_at."
      - name: travel_buffer_hours
        type: integer
        source: input
        description: "Hours of travel padding applied to BOTH sides of the interval for conflict detection and travel-day counting."
        constraints: "integer 0..72"
      - name: travel_cost_cents
        type: integer
        source: system
        description: "Reimbursable travel cost captured at confirm; 0 while the booking is on HOLD."
        default: 0
      - name: travel_days
        type: integer
        source: computed
        description: "ceil((end_at - start_at + 2 * travel_buffer_hours) / 24h), computed at confirm."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle."
        default: "HOLD"
        constraints: "One of HOLD, CONFIRMED, COMPLETED, NO_SHOW, CANCELLED."
      - name: outcome
        type: enum
        source: system
        description: "Close outcome written by the close call."
        default: null
        constraints: "One of COMPLETED, NO_SHOW, or null."
      - name: cancel_reason_code
        type: string
        source: system
        description: "Reason code recorded by the cancel call or by a terminate cascade (AUTO_TERMINATION)."
        default: null

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Studio / crew slot label."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of SHOOT deliverables whose half-open reservation windows may overlap at any instant."
        constraints: "integer >= 1"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive earliest instant a reservation may start."
      - name: window_end_at
        type: datetime
        source: input
        description: "Inclusive latest instant a reservation may end; must be strictly after window_start_at."
      - name: reserved_count
        type: integer
        source: computed
        description: "Count of Deliverable rows referencing this slot whose status != VOIDED."
        default: 0

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this deliverable belongs to."
      - name: type
        type: enum
        source: input
        description: "Deliverable kind; drives the payout weight (SOCIAL_POST 1, APPEARANCE 4, SHOOT 2)."
        constraints: "One of SOCIAL_POST, APPEARANCE, SHOOT."
      - name: due_date
        type: string
        source: input
        description: "ISO date the asset is due."
      - name: booking_id
        type: string
        source: input
        description: "FK -> AppearanceBooking.id; required for type == APPEARANCE, must be null otherwise."
        default: null
      - name: production_slot_id
        type: string
        source: input
        description: "FK -> ProductionSlot.id; required for type == SHOOT, must be null otherwise."
        default: null
      - name: shoot_start_at
        type: datetime
        source: input
        description: "Inclusive start of the half-open slot reservation; required for type == SHOOT."
        default: null
      - name: shoot_end_at
        type: datetime
        source: input
        description: "Exclusive end of the half-open slot reservation; required for type == SHOOT."
        default: null
      - name: disclosure_required
        type: boolean
        source: input
        description: "When true the deliverable cannot be APPROVED without a COMPLIANT DisclosureRecord."
        default: true
      - name: asset_url
        type: string
        source: system
        description: "Asset location captured at submit."
        default: null
      - name: weight
        type: integer
        source: computed
        description: "Payout weight derived from type: SOCIAL_POST 1, APPEARANCE 4, SHOOT 2."
      - name: line_value_cents
        type: integer
        source: computed
        description: "Rounded payout line value written by the most recent DRAFT PayoutStatement build; null until then."
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REVISION_REQUESTED rulings received."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Approval workflow state."
        default: "PENDING"
        constraints: "One of PENDING, SUBMITTED, REVISION_REQUESTED, APPROVED, VOIDED."

  - name: DisclosureRecord
    parent: null
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; the paid-promotion asset being disclosed."
      - name: platform
        type: enum
        source: input
        description: "Publication platform."
        constraints: "One of INSTAGRAM, X, TIKTOK, YOUTUBE, BROADCAST."
      - name: disclosure_tag
        type: string
        source: input
        description: "Disclosure marker actually used; a COMPLIANT ruling is only permitted when it is a member of ACCEPTED_DISCLOSURE_TAGS = {\"#ad\", \"#sponsored\", \"#paidpartnership\"} (exact, case-sensitive match)."
      - name: posted_at
        type: datetime
        source: input
        description: "Publication instant, UTC ISO 8601."
      - name: ruled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who issued the current ruling."
        default: null
      - name: finding_note
        type: string
        source: system
        description: "Free-text finding recorded with the ruling."
        default: null
      - name: remediation_count
        type: integer
        source: computed
        description: "Number of times the record was re-tagged after a NON_COMPLIANT ruling."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Compliance review state."
        default: "PENDING_REVIEW"
        constraints: "One of PENDING_REVIEW, COMPLIANT, NON_COMPLIANT."

  - name: PayoutStatement
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being settled."
      - name: line_count
        type: integer
        source: computed
        description: "Number of APPROVED deliverables that entered the statement."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Sum of the per-line rounded line values (round per line, then sum)."
      - name: agency_commission_cents
        type: integer
        source: computed
        description: "Sum of the per-line rounded commissions."
      - name: penalty_cents
        type: integer
        source: computed
        description: "Absolute value of the sum of this engagement's PENALTY ledger entries."
        default: 0
      - name: athlete_net_cents
        type: integer
        source: computed
        description: "gross_amount_cents - agency_commission_cents - penalty_cents."
      - name: status
        type: enum
        source: system
        description: "Statement lifecycle."
        default: "DRAFT"
        constraints: "One of DRAFT, DISBURSED, VOIDED."
      - name: disbursed_at
        type: datetime
        source: system
        description: "Logical-clock instant of disbursement."
        default: null

  - name: RenewalOption
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the completed engagement being renewed."
      - name: option_deadline_date
        type: string
        source: input
        description: "Inclusive last ISO date on which the brand may decide; a decision after it lapses the option."
      - name: proposed_base_fee_cents
        type: integer
        source: input
        description: "Headline fee proposed for the renewal term, before the multiplier."
        constraints: "integer >= 1"
      - name: base_value_cents
        type: integer
        source: computed
        description: "Engagement.binding_fee_cents, frozen at option creation; the tier key (bonus is NOT folded back in)."
      - name: approval_rate
        type: number
        source: computed
        description: "Engagement.approved_deliverable_count / Engagement.required_deliverable_count, 4 decimal places."
      - name: bonus_tier
        type: enum
        source: computed
        description: "Performance bonus tier selected from base_value_cents and approval_rate."
        constraints: "One of TIER_1, TIER_2, TIER_3, NONE."
      - name: bonus_cents
        type: integer
        source: computed
        description: "round_half_up(base_value_cents * bonus_pct(bonus_tier))."
      - name: total_engagement_value_cents
        type: integer
        source: computed
        description: "base_value_cents + bonus_cents; reported only, never fed back into tier selection."
      - name: renewal_fee_cents
        type: integer
        source: computed
        description: "round_half_up(proposed_base_fee_cents * renewal_multiplier)."
      - name: status
        type: enum
        source: system
        description: "Option lifecycle."
        default: "OPEN"
        constraints: "One of OPEN, EXERCISED, DECLINED, LAPSED."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decide call."
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement the movement belongs to."
      - name: entry_type
        type: enum
        source: system
        description: "Movement kind; TRAVEL_ACCRUAL, REVERSAL, PENALTY and BONUS make up accrued_fee_cents, DISBURSEMENT does not."
        constraints: "One of TRAVEL_ACCRUAL, REVERSAL, PENALTY, BONUS, DISBURSEMENT."
      - name: amount_cents
        type: integer
        source: system
        description: "Signed movement in cents; credits positive, debits negative."
      - name: memo
        type: string
        source: system
        description: "Human-readable movement note."
      - name: source_entity
        type: string
        source: system
        description: "Polymorphic source label: AppearanceBooking, Deliverable, PayoutStatement or RenewalOption."
      - name: source_id
        type: string
        source: system
        description: "Identifier of the source row named by source_entity; polymorphic, not a declared foreign key."

state_machines:
  - entity: Opportunity
    dimension: status
    initial_state: INTAKE
    terminal_states: [REJECTED_FIT, CONTRACTED, CLOSED_LOST]
    transitions:
      - from: INTAKE
        to: SCREENED
        trigger: "POST /opportunities/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "opportunity.status == INTAKE"
          - "brand_fit_score computed by calculations.brand_fit_score is >= FIT_PASS_SCORE (60)"
        side_effects:
          - "sets Opportunity.expected_fee_cents and Opportunity.brand_fit_score (calculations.brand_fit_score)"
          - "sets Opportunity.screened_by_user_id = X-User-ID and Opportunity.screened_at = logical clock"
      - from: INTAKE
        to: REJECTED_FIT
        trigger: "POST /opportunities/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "opportunity.status == INTAKE"
          - "brand_fit_score computed by calculations.brand_fit_score is < FIT_PASS_SCORE (60)"
        side_effects:
          - "sets Opportunity.expected_fee_cents, Opportunity.brand_fit_score, screened_by_user_id, screened_at"
          - "no TermSheet may be created against the opportunity from this state"
        note: "Branching fork on one trigger; the branch is chosen by an exact >= comparison on an integer score."
      - from: SCREENED
        to: CONTRACTED
        trigger: "POST /term-sheets/{id}/accept (cascade)"
        actor: system
        preconditions:
          - "the accepted TermSheet.opportunity_id == this opportunity"
        side_effects:
          - "all sibling TermSheet rows of this opportunity whose status IN {DRAFT, SUBMITTED, COUNTERED} move to WITHDRAWN"
      - from: SCREENED
        to: CLOSED_LOST
        trigger: "POST /term-sheets/{id}/withdraw (cascade)"
        actor: system
        preconditions:
          - "after the withdrawal, no TermSheet of this opportunity has status IN {DRAFT, SUBMITTED, COUNTERED}"
        side_effects:
          - "opportunity accepts no further TermSheet creation"

  - entity: TermSheet
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /term-sheets/{id}/submit"
        actor: TalentAgent
        preconditions:
          - "term_sheet.status == DRAFT"
          - "Athlete.status == ACTIVE for the opportunity's athlete (cross-entity guard)"
        side_effects:
          - "recomputes TermSheet.provisional_fee_cents via calculations.appearance_fee_engine variant PROVISIONAL"
          - "sets TermSheet.offer_expires_at = logical_clock + OFFER_VALID_DAYS (14 days)"
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /term-sheets/{id}/counter"
        actor: BrandRep
        preconditions:
          - "term_sheet.status == SUBMITTED"
          - "term_sheet.counter_count < MAX_COUNTER_ROUNDS (3)"
          - "X-User-ID == Opportunity.brand_id"
        side_effects:
          - "overwrites fee_cents, usage_rights_tier, morals_clause_tier, exclusivity_months with the counter values"
          - "increments TermSheet.counter_count by 1"
          - "sets TermSheet.last_counter_morals_tier to the countered tier"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /term-sheets/{id}/revise"
        actor: TalentAgent
        preconditions:
          - "term_sheet.status == COUNTERED"
          - "Athlete.status == ACTIVE for the opportunity's athlete"
          - "morals_tier_strictness(payload.morals_clause_tier) >= morals_tier_strictness(term_sheet.last_counter_morals_tier)"
        side_effects:
          - "increments TermSheet.round_number by 1"
          - "recomputes TermSheet.provisional_fee_cents via calculations.appearance_fee_engine variant PROVISIONAL"
          - "re-stamps TermSheet.offer_expires_at = logical_clock + OFFER_VALID_DAYS"
        note: "Cycle edge: SUBMITTED -> COUNTERED -> SUBMITTED, bounded by MAX_COUNTER_ROUNDS."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /term-sheets/{id}/accept"
        actor: BrandRep
        preconditions:
          - "term_sheet.status == SUBMITTED"
          - "logical_clock <= term_sheet.offer_expires_at"
          - "Brand.sanctioned == false"
          - "term_sheet.fee_cents <= Athlete.base_appearance_rate_cents * FEE_CAP_MULTIPLE (8)"
          - "no ExclusivityGrant with the same athlete_id and category and status IN {PENDING, ACTIVE} overlaps the new grant's inclusive day range"
        side_effects:
          - "creates Engagement with contract_status = PENDING_COUNTERSIGN and settlement_status = UNBILLED, copying fee/rights/morals/territory/exclusivity/term dates and freezing provisional_fee_cents and required_deliverable_count"
          - "creates ExclusivityGrant with status = PENDING for (athlete, category) over [term_start_date, term_start_date + exclusivity_months months - 1 day]"
          - "moves the parent Opportunity SCREENED -> CONTRACTED, which in turn WITHDRAWs every sibling TermSheet still in DRAFT/SUBMITTED/COUNTERED"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /term-sheets/{id}/accept evaluated after offer_expires_at"
        actor: system
        preconditions:
          - "term_sheet.status == SUBMITTED"
          - "logical_clock > term_sheet.offer_expires_at"
        side_effects:
          - "sets status = EXPIRED and rejects the acceptance with ERR_OFFER_EXPIRED; no Engagement is created"
        note: "Lazy expiry: the state change is a side effect of the rejected acceptance attempt."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /term-sheets/{id}/withdraw"
        actor: TalentAgent
        preconditions: ["term_sheet.status IN {DRAFT, SUBMITTED, COUNTERED}"]
        side_effects:
          - "if no sibling TermSheet of the opportunity remains in DRAFT/SUBMITTED/COUNTERED, the Opportunity moves SCREENED -> CLOSED_LOST"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /term-sheets/{id}/withdraw"
        actor: TalentAgent
        preconditions: ["term_sheet.status == SUBMITTED"]
        side_effects:
          - "if no sibling TermSheet of the opportunity remains in DRAFT/SUBMITTED/COUNTERED, the Opportunity moves SCREENED -> CLOSED_LOST"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /term-sheets/{id}/withdraw"
        actor: TalentAgent
        preconditions: ["term_sheet.status == COUNTERED"]
        side_effects:
          - "if no sibling TermSheet of the opportunity remains in DRAFT/SUBMITTED/COUNTERED, the Opportunity moves SCREENED -> CLOSED_LOST"

  - entity: Engagement
    dimension: contract_status
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /engagements/{id}/countersign"
        actor: FinanceManager
        preconditions:
          - "engagement.contract_status == PENDING_COUNTERSIGN"
          - "Brand.sanctioned == false"
        side_effects:
          - "computes Engagement.binding_fee_cents via calculations.appearance_fee_engine variant BINDING (counts AppearanceBooking rows with status IN {CONFIRMED, COMPLETED})"
          - "sets countersigned_by_user_id = X-User-ID and countersigned_at = logical clock"
          - "moves the engagement's ExclusivityGrant PENDING -> ACTIVE; because that grant became ACTIVE, Athlete.active_exclusivity_count increments by 1; because that counter changed, Athlete.exposure_risk_snapshot_score is recomputed"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /deliverables/{id}/review with decision = APPROVE (cascade)"
        actor: system
        preconditions:
          - "engagement.approved_deliverable_count == engagement.required_deliverable_count after the increment"
        side_effects:
          - "because contract_status became COMPLETED, settlement_status moves UNBILLED -> BILLABLE"
        note: "Bubble-up: parent state derived from the children's approval count."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /engagements/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "engagement.contract_status IN {PENDING_COUNTERSIGN, ACTIVE}"
        side_effects:
          - "sets terminated_reason_code"
          - "because the engagement became TERMINATED, every ExclusivityGrant of this engagement with status IN {PENDING, ACTIVE} moves to RELEASED with released_at = logical clock; because a grant left ACTIVE, Athlete.active_exclusivity_count decrements by 1; because that counter changed, Athlete.exposure_risk_snapshot_score is recomputed"
          - "because the engagement became TERMINATED, every AppearanceBooking of this engagement with status IN {HOLD, CONFIRMED} moves to CANCELLED with cancel_reason_code = 'AUTO_TERMINATION'; because a CONFIRMED booking was cancelled, a LedgerEntry REVERSAL of -travel_cost_cents is appended; because that entry was appended, Engagement.accrued_fee_cents decreases by the same amount"
          - "because the engagement became TERMINATED, every Deliverable of this engagement with status IN {PENDING, SUBMITTED, REVISION_REQUESTED} moves to VOIDED; because a SHOOT deliverable was voided, its ProductionSlot.reserved_count decrements by 1"
          - "because the engagement became TERMINATED, settlement_status moves UNBILLED -> BILLABLE so the accrued portion can still be settled"
      - from: PENDING_COUNTERSIGN
        to: TERMINATED
        trigger: "POST /engagements/{id}/terminate"
        actor: ComplianceOfficer
        preconditions: ["engagement.contract_status == PENDING_COUNTERSIGN"]
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED; the PENDING ExclusivityGrant moves to RELEASED and, since it never became ACTIVE, Athlete.active_exclusivity_count is unchanged"

  - entity: Engagement
    dimension: settlement_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: BILLABLE
        trigger: "contract_status entering COMPLETED or TERMINATED (cascade)"
        actor: system
        preconditions: ["engagement.settlement_status == UNBILLED"]
        side_effects: ["POST /payout-statements becomes reachable for this engagement"]
      - from: BILLABLE
        to: INVOICED
        trigger: "POST /payout-statements"
        actor: FinanceManager
        preconditions:
          - "engagement.settlement_status IN {BILLABLE, INVOICED}"
          - "at least one Deliverable of the engagement has status == APPROVED"
        side_effects:
          - "creates PayoutStatement in DRAFT with the calculations.payout_distribution outputs"
          - "increments Engagement.version by 1"
      - from: INVOICED
        to: INVOICED
        trigger: "POST /payout-statements (supersede)"
        actor: FinanceManager
        preconditions:
          - "engagement.settlement_status == INVOICED"
          - "the existing PayoutStatement of this engagement has status == DRAFT"
        side_effects:
          - "the existing DRAFT statement moves to VOIDED and the new statement is created in DRAFT"
          - "increments Engagement.version by 1"
        note: "Self-loop on the money dimension; this is the legitimate supersede that makes concurrency_rules[payout-create-stale-engagement] a true race rather than a state precondition."
      - from: INVOICED
        to: SETTLED
        trigger: "POST /payout-statements/{id}/disburse"
        actor: FinanceManager
        preconditions:
          - "statement.status == DRAFT"
          - "engagement.settlement_status == INVOICED"
        side_effects:
          - "statement moves DRAFT -> DISBURSED and disbursed_at is stamped"
          - "appends LedgerEntry DISBURSEMENT with amount_cents = -athlete_net_cents"
          - "increases Engagement.gross_settled_cents by statement.gross_amount_cents"

  - entity: ExclusivityGrant
    dimension: status
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /engagements/{id}/countersign (cascade)"
        actor: system
        preconditions: ["grant.status == PENDING"]
        side_effects:
          - "increments Athlete.active_exclusivity_count by 1, which in turn triggers recomputation of Athlete.exposure_risk_snapshot_score"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /engagements/{id}/terminate (cascade)"
        actor: system
        preconditions: ["grant.status == ACTIVE"]
        side_effects:
          - "sets released_at; decrements Athlete.active_exclusivity_count by 1, which in turn triggers recomputation of Athlete.exposure_risk_snapshot_score"
      - from: PENDING
        to: RELEASED
        trigger: "POST /engagements/{id}/terminate (cascade)"
        actor: system
        preconditions: ["grant.status == PENDING"]
        side_effects:
          - "sets released_at; Athlete.active_exclusivity_count is unchanged because the slot was never counted"

  - entity: AppearanceBooking
    dimension: status
    initial_state: HOLD
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /appearance-bookings/{id}/confirm"
        actor: TalentAgent
        preconditions:
          - "booking.status == HOLD"
          - "Engagement.contract_status IN {PENDING_COUNTERSIGN, ACTIVE}"
        side_effects:
          - "sets travel_cost_cents from the payload and computes travel_days = ceil((end_at - start_at + 2 * travel_buffer_hours) / 24h)"
          - "appends LedgerEntry TRAVEL_ACCRUAL with amount_cents = +travel_cost_cents; because that entry was appended, Engagement.accrued_fee_cents increases by the same amount"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appearance-bookings/{id}/close with outcome = COMPLETED"
        actor: TalentAgent
        preconditions:
          - "booking.status == CONFIRMED"
        side_effects:
          - "sets outcome = COMPLETED; no ledger movement"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appearance-bookings/{id}/close with outcome = NO_SHOW"
        actor: TalentAgent
        preconditions:
          - "booking.status == CONFIRMED"
        side_effects:
          - "sets outcome = NO_SHOW; increments Athlete.no_show_count by 1"
          - "appends LedgerEntry PENALTY with amount_cents = -round_half_up(Engagement.binding_fee_cents * NO_SHOW_PENALTY_PCT (0.10)); because that entry was appended, Engagement.accrued_fee_cents decreases by the same amount"
        note: "Branch fork with divergent side-effect sets: COMPLETED writes nothing, NO_SHOW writes a penalty and a counter."
      - from: HOLD
        to: CANCELLED
        trigger: "POST /appearance-bookings/{id}/cancel"
        actor: TalentAgent | BrandRep
        preconditions: ["booking.status == HOLD"]
        side_effects:
          - "sets cancel_reason_code; no ledger movement because nothing was accrued on HOLD"
          - "any Deliverable of type APPEARANCE referencing this booking whose status IN {PENDING, SUBMITTED, REVISION_REQUESTED} moves to VOIDED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appearance-bookings/{id}/cancel"
        actor: TalentAgent | BrandRep
        preconditions: ["booking.status == CONFIRMED"]
        side_effects:
          - "appends the compensating LedgerEntry REVERSAL with amount_cents = -travel_cost_cents; because that entry was appended, Engagement.accrued_fee_cents returns to its pre-confirm value"
          - "any Deliverable of type APPEARANCE referencing this booking whose status IN {PENDING, SUBMITTED, REVISION_REQUESTED} moves to VOIDED"

  - entity: Deliverable
    dimension: status
    initial_state: PENDING
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit"
        actor: Athlete
        preconditions:
          - "deliverable.status IN {PENDING, REVISION_REQUESTED}"
          - "Engagement.contract_status == ACTIVE"
          - "X-User-ID == Engagement.athlete_id"
        side_effects: ["stores asset_url"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit"
        actor: Athlete
        preconditions:
          - "deliverable.status == REVISION_REQUESTED"
          - "Engagement.contract_status == ACTIVE"
        side_effects: ["overwrites asset_url"]
        note: "Cycle edge SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deliverables/{id}/review with decision = APPROVE"
        actor: BrandRep
        preconditions:
          - "deliverable.status == SUBMITTED"
          - "if deliverable.disclosure_required == true, at least one DisclosureRecord of this deliverable has status == COMPLIANT"
          - "X-User-ID == Engagement.brand_id"
        side_effects:
          - "because the deliverable became APPROVED, Engagement.approved_deliverable_count increments by 1; because that counter reached required_deliverable_count, Engagement.contract_status moves ACTIVE -> COMPLETED; because contract_status became COMPLETED, Engagement.settlement_status moves UNBILLED -> BILLABLE"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /deliverables/{id}/review with decision = REQUEST_REVISION"
        actor: BrandRep
        preconditions:
          - "deliverable.status == SUBMITTED"
          - "X-User-ID == Engagement.brand_id"
        side_effects:
          - "increments revision_count by 1; Engagement.approved_deliverable_count is unchanged and no bubble-up fires"
        note: "Branch fork with divergent side-effect sets on one endpoint."
      - from: PENDING
        to: VOIDED
        trigger: "engagement terminate or booking cancel (cascade)"
        actor: system
        preconditions: ["deliverable.status IN {PENDING, SUBMITTED, REVISION_REQUESTED}"]
        side_effects:
          - "if type == SHOOT, decrements ProductionSlot.reserved_count by 1 and frees the half-open reservation window"
      - from: SUBMITTED
        to: VOIDED
        trigger: "engagement terminate or booking cancel (cascade)"
        actor: system
        preconditions: ["deliverable.status == SUBMITTED"]
        side_effects:
          - "if type == SHOOT, decrements ProductionSlot.reserved_count by 1"

  - entity: DisclosureRecord
    dimension: status
    initial_state: PENDING_REVIEW
    terminal_states: [COMPLIANT]
    transitions:
      - from: PENDING_REVIEW
        to: COMPLIANT
        trigger: "POST /disclosure-records/{id}/rule with ruling = COMPLIANT"
        actor: ComplianceOfficer
        preconditions:
          - "record.status == PENDING_REVIEW"
          - "X-User-ID != Opportunity.screened_by_user_id for the opportunity behind this deliverable's engagement"
          - "record.disclosure_tag IN ACCEPTED_DISCLOSURE_TAGS = {\"#ad\", \"#sponsored\", \"#paidpartnership\"}; otherwise the ruling is refused with ERR_DISCLOSURE_NOT_COMPLIANT"
        side_effects:
          - "sets ruled_by_user_id; unblocks approval of the parent Deliverable"
      - from: PENDING_REVIEW
        to: NON_COMPLIANT
        trigger: "POST /disclosure-records/{id}/rule with ruling = NON_COMPLIANT"
        actor: ComplianceOfficer
        preconditions:
          - "record.status == PENDING_REVIEW"
          - "X-User-ID != Opportunity.screened_by_user_id for the opportunity behind this deliverable's engagement"
        side_effects:
          - "sets ruled_by_user_id and finding_note; triggers recomputation of Athlete.exposure_risk_snapshot_score (noncompliance_hits grew by 1)"
      - from: NON_COMPLIANT
        to: PENDING_REVIEW
        trigger: "POST /disclosure-records/{id}/remediate"
        actor: Athlete
        preconditions:
          - "record.status == NON_COMPLIANT"
          - "X-User-ID == Engagement.athlete_id"
        side_effects:
          - "overwrites disclosure_tag and posted_at, increments remediation_count by 1, clears ruled_by_user_id"
          - "triggers recomputation of Athlete.exposure_risk_snapshot_score (noncompliance_hits shrank by 1)"
        note: "Cycle edge PENDING_REVIEW -> NON_COMPLIANT -> PENDING_REVIEW."

  - entity: PayoutStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: [DISBURSED, VOIDED]
    transitions:
      - from: DRAFT
        to: DISBURSED
        trigger: "POST /payout-statements/{id}/disburse"
        actor: FinanceManager
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "stamps disbursed_at, appends LedgerEntry DISBURSEMENT (-athlete_net_cents), raises Engagement.gross_settled_cents, moves Engagement.settlement_status INVOICED -> SETTLED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /payout-statements (supersede cascade)"
        actor: system
        preconditions:
          - "a newer statement is being created for the same engagement"
        side_effects:
          - "the voided statement no longer counts toward Engagement.gross_settled_cents"

  - entity: RenewalOption
    dimension: status
    initial_state: OPEN
    terminal_states: [EXERCISED, DECLINED, LAPSED]
    transitions:
      - from: OPEN
        to: EXERCISED
        trigger: "POST /renewal-options/{id}/decide with decision = EXERCISE"
        actor: BrandRep
        preconditions:
          - "option.status == OPEN"
          - "date(logical_clock) <= option.option_deadline_date"
          - "X-User-ID == Engagement.brand_id"
        side_effects:
          - "stamps decided_at; appends LedgerEntry BONUS with amount_cents = +bonus_cents; because that entry was appended, Engagement.accrued_fee_cents increases by bonus_cents"
      - from: OPEN
        to: DECLINED
        trigger: "POST /renewal-options/{id}/decide with decision = DECLINE"
        actor: BrandRep
        preconditions:
          - "option.status == OPEN"
          - "date(logical_clock) <= option.option_deadline_date"
        side_effects:
          - "stamps decided_at; no ledger movement, so no bonus is ever accrued"
      - from: OPEN
        to: LAPSED
        trigger: "POST /renewal-options/{id}/decide evaluated after option_deadline_date"
        actor: system
        preconditions:
          - "option.status == OPEN"
          - "date(logical_clock) > option.option_deadline_date"
        side_effects:
          - "sets status = LAPSED and rejects the decision with ERR_RENEWAL_WINDOW_CLOSED"
        note: "Lazy lapse, mirroring the TermSheet lazy expiry."

concurrency_rules:
  - rule_id: payout-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /payout-statements"
    occ_field: "expected_engagement_version"
    description: |
      Creating a PayoutStatement for an Engagement whose version has advanced since the client last
      observed it is rejected. A newer statement legitimately supersedes an existing DRAFT statement
      (the prior DRAFT is VOIDED per the settlement self-loop), so the writer must prove its view of
      the engagement's settlement figures is current before restating them.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: booking-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /appearance-bookings"
    occ_field: "expected_engagement_version"
    description: |
      Creating an AppearanceBooking against an Engagement whose version has advanced since the client
      last observed it is rejected. Additional bookings against the same engagement are legitimate, so
      the rejection cannot come from a state precondition; it comes from the writer holding a stale view
      of the engagement's accrual and committed-day fields.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

calculations:
  - name: brand_fit_score
    trigger: "POST /opportunities/{id}/screen (Opportunity INTAKE -> SCREENED | REJECTED_FIT)"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - card-rate value of the requested workload (integer cents)
      workload_units      = 4 * opportunity.planned_appearances + 2 * opportunity.planned_shoots + 1 * opportunity.planned_posts
      expected_fee_cents  = round_half_up(athlete.base_appearance_rate_cents * workload_units / 4)
      # Step 2 - fee alignment, capped at 100 (over-paying never scores above par)
      if expected_fee_cents == 0:
          fee_alignment = 100.0
      else:
          fee_alignment = 100.0 * min(1.0, opportunity.proposed_fee_cents / expected_fee_cents)
      # Step 3 - reach weight
      tier_weight = TIER_WEIGHT[athlete.market_tier]          # GLOBAL 1.00, NATIONAL 0.85, REGIONAL 0.70
      # Step 4 - exclusivity burden, capped
      exclusivity_penalty = min(EXCLUSIVITY_PENALTY_CAP, EXCLUSIVITY_PENALTY_PER_MONTH * opportunity.exclusivity_months)
      # Step 5 - single round at the very end, then clamp
      raw_score = 0.40 * brand.compliance_rating
                + 0.30 * (100.0 * tier_weight)
                + 0.30 * fee_alignment
                - exclusivity_penalty
      brand_fit_score = max(0, min(100, round_half_up(raw_score, 0)))
      # Step 6 - branch
      status = SCREENED if brand_fit_score >= FIT_PASS_SCORE else REJECTED_FIT
    input_set: "Exactly one Opportunity in status INTAKE plus its Brand and Athlete rows; no other opportunity contributes."
    constants:
      TIER_WEIGHT: { GLOBAL: 1.00, NATIONAL: 0.85, REGIONAL: 0.70 }
      EXCLUSIVITY_PENALTY_PER_MONTH: 1.5
      EXCLUSIVITY_PENALTY_CAP: 20
      FIT_PASS_SCORE: 60
    precision: "expected_fee_cents in whole cents, round_half_up; brand_fit_score is an integer, round_half_up applied once to raw_score (never to the intermediate weighted terms)."

  - name: appearance_fee_engine
    trigger: "PROVISIONAL on POST /term-sheets/{id}/submit and POST /term-sheets/{id}/revise (writes TermSheet.provisional_fee_cents); BINDING on POST /engagements/{id}/countersign (writes Engagement.binding_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      usage_multiplier     = USAGE_MULTIPLIER[tier]        # SOCIAL_ONLY 1.00, BROADCAST 1.35, PERPETUAL 1.80
      morals_multiplier    = MORALS_MULTIPLIER[tier]       # TIER_A 1.15, TIER_B 1.05, TIER_C 1.00
      territory_multiplier = TERRITORY_MULTIPLIER[terr]    # DOMESTIC 1.00, NORTH_AMERICA 1.20, GLOBAL 1.45
      # ONE rounding, applied to the whole multiplier product - never per multiplier
      rights_component_cents = round_half_up(fee_cents * usage_multiplier * morals_multiplier * territory_multiplier)
      exclusivity_uplift_cents = round_half_up(
          athlete.base_appearance_rate_cents * EXCLUSIVITY_UPLIFT_PCT_PER_MONTH
          * min(exclusivity_months, EXCLUSIVITY_UPLIFT_MONTH_CAP))
      # travel_component_cents is the ONLY difference between the two variants
      raw_value = rights_component_cents + exclusivity_uplift_cents + travel_component_cents
      value_cap = round_half_up(fee_cents * CONTRACT_VALUE_CAP_MULTIPLE)
      result    = min(raw_value, value_cap)
    input_set: "The TermSheet's own negotiated fields plus the Athlete card rate. The BINDING variant additionally reads the engagement's AppearanceBooking rows whose status IN {CONFIRMED, COMPLETED}, ordered by created_at ASC; bookings in HOLD, CANCELLED or NO_SHOW are excluded."
    constants:
      USAGE_MULTIPLIER: { SOCIAL_ONLY: 1.00, BROADCAST: 1.35, PERPETUAL: 1.80 }
      MORALS_MULTIPLIER: { TIER_A: 1.15, TIER_B: 1.05, TIER_C: 1.00 }
      TERRITORY_MULTIPLIER: { DOMESTIC: 1.00, NORTH_AMERICA: 1.20, GLOBAL: 1.45 }
      EXCLUSIVITY_UPLIFT_PCT_PER_MONTH: 0.05
      EXCLUSIVITY_UPLIFT_MONTH_CAP: 24
      TRAVEL_DAY_RATE_PCT: 0.25
      CONTRACT_VALUE_CAP_MULTIPLE: 2.5
    precision: "whole cents, round_half_up; the multiplier product is rounded once, the uplift is rounded once, the travel day component is rounded once, and the three rounded parts are then summed."
    variants:
      - name: PROVISIONAL
        when: "TermSheet submit / revise, before any booking is counted"
        difference: "travel_component_cents = 0 unconditionally, even when CONFIRMED bookings already exist on a sibling engagement. Forward-looking estimate of the paper's value."
      - name: BINDING
        when: "Engagement countersign"
        difference: |
          travel_component_cents = round_half_up(sum over AppearanceBooking b of the engagement with
              b.status IN {CONFIRMED, COMPLETED} of b.travel_cost_cents)
            + round_half_up(athlete.base_appearance_rate_cents * TRAVEL_DAY_RATE_PCT * total_travel_days)
          where total_travel_days = sum over the same bookings of
              ceil((b.end_at - b.start_at + 2 * b.travel_buffer_hours) / 24 hours).
          With zero qualifying bookings BINDING equals PROVISIONAL exactly; with one or more it exceeds it.

  - name: payout_distribution
    trigger: "POST /payout-statements (Engagement settlement_status BILLABLE -> INVOICED, or the INVOICED self-loop)"
    algorithm: waterfall_allocation
    formula: |
      # Billable set: APPROVED deliverables only, ordered by created_at ASC (deterministic, id never consulted)
      lines        = [d for d in engagement.deliverables if d.status == APPROVED] sorted by created_at ASC
      total_weight = sum(DELIVERABLE_WEIGHT[d.type] for d in lines)
      # PINNED ORDER: round EACH line to whole cents first, THEN sum. Never sum raw shares and round once.
      for d in lines:
          d.line_value_cents = round_half_up(engagement.binding_fee_cents * DELIVERABLE_WEIGHT[d.type] / total_weight)
      gross_amount_cents = sum(d.line_value_cents for d in lines)
      # Commission is likewise rounded per line and then summed
      agency_commission_cents = sum(round_half_up(d.line_value_cents * athlete.commission_pct) for d in lines)
      penalty_cents      = abs(sum(e.amount_cents for e in engagement.ledger_entries if e.entry_type == PENALTY))
      athlete_net_cents  = gross_amount_cents - agency_commission_cents - penalty_cents
      line_count         = len(lines)
    input_set: "Deliverable rows of exactly one Engagement whose status == APPROVED at call time; PENDING, SUBMITTED, REVISION_REQUESTED and VOIDED deliverables are excluded. Ledger entries of entry_type PENALTY over the same engagement, with no time window filter."
    constants:
      DELIVERABLE_WEIGHT: { SOCIAL_POST: 1, APPEARANCE: 4, SHOOT: 2 }
    precision: "whole cents, round_half_up, applied per line before summation; the residue between gross_amount_cents and binding_fee_cents is NOT redistributed and is expected to be non-zero."

  - name: athlete_exposure_risk_score
    trigger: "GET /athletes/{id}/exposure-summary (both variants on demand); the ROSTER_SNAPSHOT value is also written to Athlete.exposure_risk_snapshot_score whenever active_exclusivity_count changes, an owned Engagement changes contract_status, or a DisclosureRecord ruling changes"
    algorithm: weighted_scoring
    formula: |
      category_load      = count(ExclusivityGrant g : g.athlete_id == athlete.id AND g.status == ACTIVE)
      morals_exposure    = sum(MORALS_WEIGHT[e.morals_clause_tier]
                               for Engagement e : e.athlete_id == athlete.id AND e.contract_status == ACTIVE)
      noncompliance_hits = count(DisclosureRecord r : r.status == NON_COMPLIANT
                               AND r.deliverable -> engagement.athlete_id == athlete.id)
      score = min(100, RISK_CATEGORY_WEIGHT * category_load
                     + RISK_MORALS_WEIGHT   * morals_exposure
                     + RISK_DISCLOSURE_WEIGHT * noncompliance_hits)
    input_set: "Rows owned by exactly one athlete. ROSTER_SNAPSHOT counts only committed rows (ExclusivityGrant ACTIVE, Engagement ACTIVE). PIPELINE_PROJECTED additionally counts in-flight rows as listed under its variant."
    constants:
      MORALS_WEIGHT: { TIER_A: 3, TIER_B: 2, TIER_C: 1 }
      RISK_CATEGORY_WEIGHT: 12
      RISK_MORALS_WEIGHT: 8
      RISK_DISCLOSURE_WEIGHT: 15
    precision: "integer arithmetic throughout; the min(100, ...) ceiling is applied once at the end."
    variants:
      - name: ROSTER_SNAPSHOT
        when: "GET /athletes/{id}/exposure-summary?variant=ROSTER_SNAPSHOT (default when variant is omitted) and for the denormalized Athlete.exposure_risk_snapshot_score"
        difference: "Counts only ExclusivityGrant rows with status == ACTIVE and Engagement rows with contract_status == ACTIVE."
      - name: PIPELINE_PROJECTED
        when: "GET /athletes/{id}/exposure-summary?variant=PIPELINE_PROJECTED"
        difference: |
          category_load also counts ExclusivityGrant rows with status == PENDING;
          morals_exposure also adds MORALS_WEIGHT for every Engagement with contract_status == PENDING_COUNTERSIGN
          and for every TermSheet with status IN {SUBMITTED, COUNTERED} whose opportunity.athlete_id == athlete.id
          (using the term sheet's current morals_clause_tier);
          noncompliance_hits is identical in both variants.

  - name: performance_bonus_and_renewal
    trigger: "POST /renewal-options (writes base_value_cents, approval_rate, bonus_tier, bonus_cents, total_engagement_value_cents, renewal_fee_cents)"
    algorithm: threshold
    formula: |
      # The tier key looks circular - total value contains the bonus, the bonus is picked from the value tier.
      # PINNED EVALUATION ORDER (steps run exactly once, in this order, no fixed-point iteration):
      # Step 1: base_value_cents = engagement.binding_fee_cents            (bonus EXCLUDED by construction)
      # Step 2: approval_rate    = round_half_up(engagement.approved_deliverable_count
      #                                          / engagement.required_deliverable_count, 4)
      # Step 3: bonus_tier selected from (base_value_cents, approval_rate) - FIRST match wins:
      #           TIER_1 if approval_rate >= 1.0000 and base_value_cents >= BONUS_TIER1_VALUE_FLOOR
      #           TIER_2 if approval_rate >= 0.8000 and base_value_cents >= BONUS_TIER2_VALUE_FLOOR
      #           TIER_3 if approval_rate >= 0.5000
      #           NONE   otherwise
      # Step 4: bonus_cents = round_half_up(base_value_cents * BONUS_PCT[bonus_tier])
      # Step 5: total_engagement_value_cents = base_value_cents + bonus_cents   (REPORTED ONLY -
      #         it MUST NOT be re-fed into Step 3, even when it crosses a higher tier floor)
      # Step 6: renewal_multiplier = 1.00
      #                            + (0.10 if bonus_tier == TIER_1 else 0.05 if bonus_tier == TIER_2 else 0.00)
      #                            + MARKET_ESCALATOR[athlete.market_tier]
      #         renewal_fee_cents = round_half_up(proposed_base_fee_cents * renewal_multiplier)
    input_set: "Exactly one Engagement with contract_status == COMPLETED or TERMINATED and binding_fee_cents non-null, plus its Athlete. Deliverables are read only through the frozen approved/required counters."
    constants:
      BONUS_TIER1_VALUE_FLOOR: 3000000
      BONUS_TIER2_VALUE_FLOOR: 1500000
      BONUS_PCT: { TIER_1: 0.12, TIER_2: 0.07, TIER_3: 0.03, NONE: 0.00 }
      MARKET_ESCALATOR: { GLOBAL: 0.03, NATIONAL: 0.015, REGIONAL: 0.00 }
    precision: "approval_rate to 4 decimal places, round_half_up; bonus_cents and renewal_fee_cents to whole cents, round_half_up, each rounded exactly once."

  - name: booking_travel_days
    trigger: "POST /appearance-bookings/{id}/confirm (writes AppearanceBooking.travel_days)"
    algorithm: interval_merge
    formula: |
      inflated_span_hours = (end_at - start_at) in hours + 2 * travel_buffer_hours
      travel_days = ceil(inflated_span_hours / 24)
    input_set: "One AppearanceBooking row; no other booking contributes (spans are never merged across bookings)."
    constants: {}
    precision: "ceiling to whole days; a span of exactly 24.0 hours yields 1 day, 24.01 hours yields 2."

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The caller's role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: existence
    check: "Path athlete id resolves to an Athlete."
    error_id: ERR_ATHLETE_NOT_FOUND
    http_status: 404
    applies_to: "GET /athletes/{id}, POST /athletes/{id}/status, GET /athletes/{id}/exposure-summary, GET /athletes/{id}/exclusivity-grants"
  - priority: 31
    category: existence
    check: "Path brand id resolves to a Brand."
    error_id: ERR_BRAND_NOT_FOUND
    http_status: 404
    applies_to: "GET /brands/{id}, POST /brands/{id}/sanction"
  - priority: 32
    category: existence
    check: "Path opportunity id resolves to an Opportunity."
    error_id: ERR_OPPORTUNITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /opportunities/{id}, POST /opportunities/{id}/screen"
  - priority: 33
    category: existence
    check: "Path term sheet id resolves to a TermSheet."
    error_id: ERR_TERM_SHEET_NOT_FOUND
    http_status: 404
    applies_to: "GET /term-sheets/{id}, POST /term-sheets/{id}/submit, POST /term-sheets/{id}/counter, POST /term-sheets/{id}/revise, POST /term-sheets/{id}/accept, POST /term-sheets/{id}/withdraw"
  - priority: 34
    category: existence
    check: "Path engagement id resolves to an Engagement."
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /engagements/{id} and every /engagements/{id}/... endpoint"
  - priority: 35
    category: existence
    check: "Path booking id resolves to an AppearanceBooking."
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /appearance-bookings/{id}, POST /appearance-bookings/{id}/confirm, POST /appearance-bookings/{id}/close, POST /appearance-bookings/{id}/cancel"
  - priority: 36
    category: existence
    check: "Path deliverable id resolves to a Deliverable."
    error_id: ERR_DELIVERABLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /deliverables/{id}, POST /deliverables/{id}/submit, POST /deliverables/{id}/review, GET /deliverables/{id}/disclosure-records"
  - priority: 37
    category: existence
    check: "Path disclosure record id resolves to a DisclosureRecord."
    error_id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "POST /disclosure-records/{id}/rule, POST /disclosure-records/{id}/remediate"
  - priority: 38
    category: existence
    check: "Path production slot id resolves to a ProductionSlot."
    error_id: ERR_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /production-slots/{id}"
  - priority: 39
    category: existence
    check: "Path payout statement id resolves to a PayoutStatement; path renewal option id resolves to a RenewalOption."
    error_id: ERR_PAYOUT_NOT_FOUND
    http_status: 404
    applies_to: "POST /payout-statements/{id}/disburse"
  - priority: 40
    category: existence
    check: "Path renewal option id resolves to a RenewalOption."
    error_id: ERR_RENEWAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /renewal-options/{id}/decide"
  - priority: 42
    category: business_constraint
    check: "Request body is schema-valid: required fields present, enums within their declared member set, integers non-negative where constrained, end instants strictly after start instants, ISO date/datetime well formed, limit within 1..100."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint accepting limit/offset"
  - priority: 44
    category: business_referential
    check: "Every foreign key carried in the request body resolves: athlete_id, brand_id, opportunity_id, engagement_id, booking_id, production_slot_id, deliverable_id."
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /opportunities, POST /term-sheets, POST /appearance-bookings, POST /deliverables, POST /disclosure-records, POST /payout-statements, POST /renewal-options — each body FK reports its own entity's not-found code (ERR_ATHLETE_NOT_FOUND, ERR_BRAND_NOT_FOUND, ERR_OPPORTUNITY_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_DELIVERABLE_NOT_FOUND), checked left-to-right in the order the fields are listed in the endpoint's input"
  - priority: 46
    category: auth
    check: "Entity-backed ownership: a BrandRep's X-User-ID equals the Brand id behind the resource (Opportunity.brand_id / Engagement.brand_id); an Athlete's X-User-ID equals the Athlete id behind the resource (Engagement.athlete_id)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /opportunities, POST /term-sheets/{id}/counter, POST /term-sheets/{id}/accept, POST /deliverables/{id}/submit, POST /deliverables/{id}/review, POST /disclosure-records, POST /disclosure-records/{id}/remediate, POST /renewal-options/{id}/decide"
  - priority: 48
    category: state
    check: "expected_engagement_version equals the Engagement's current version (optimistic concurrency, §1.2.1)."
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /appearance-bookings, POST /payout-statements"
  - priority: 50
    category: state
    check: "The athlete behind the resource has status == ACTIVE (SUSPENDED or RETIRED athletes cannot be negotiated for or booked)."
    error_id: ERR_ATHLETE_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /term-sheets/{id}/submit, POST /term-sheets/{id}/revise, POST /appearance-bookings"
  - priority: 51
    category: state
    check: "Opportunity.status == SCREENED when a TermSheet is created against it."
    error_id: ERR_OPPORTUNITY_NOT_SCREENED
    http_status: 409
    applies_to: "POST /term-sheets"
  - priority: 52
    category: state
    check: "TermSheet is in the from-state the transition requires (DRAFT for submit; SUBMITTED for counter and accept; COUNTERED for revise; DRAFT/SUBMITTED/COUNTERED for withdraw)."
    error_id: ERR_TERM_SHEET_INVALID_STATE
    http_status: 409
    applies_to: "POST /term-sheets/{id}/submit, POST /term-sheets/{id}/counter, POST /term-sheets/{id}/revise, POST /term-sheets/{id}/accept, POST /term-sheets/{id}/withdraw"
  - priority: 53
    category: business_temporal
    check: "logical_clock <= TermSheet.offer_expires_at; otherwise the paper is moved to EXPIRED and the acceptance is refused."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /term-sheets/{id}/accept"
  - priority: 54
    category: state
    check: "Engagement.contract_status is in the set the operation requires: {PENDING_COUNTERSIGN, ACTIVE} to create or confirm bookings and to create deliverables; ACTIVE to submit or review deliverables; COMPLETED or TERMINATED to open a renewal option."
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /appearance-bookings, POST /appearance-bookings/{id}/confirm, POST /deliverables, POST /deliverables/{id}/submit, POST /deliverables/{id}/review, POST /renewal-options"
  - priority: 55
    category: state
    check: "Engagement.contract_status == PENDING_COUNTERSIGN when countersigning, and IN {PENDING_COUNTERSIGN, ACTIVE} when terminating; any other contract_status (already countersigned, COMPLETED or TERMINATED) is refused."
    error_id: ERR_ENGAGEMENT_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /engagements/{id}/countersign, POST /engagements/{id}/terminate"
  - priority: 56
    category: state
    check: "AppearanceBooking is in the from-state the transition requires (HOLD for confirm; CONFIRMED for close; HOLD or CONFIRMED for cancel)."
    error_id: ERR_BOOKING_INVALID_STATE
    http_status: 409
    applies_to: "POST /appearance-bookings/{id}/confirm, POST /appearance-bookings/{id}/close, POST /appearance-bookings/{id}/cancel"
  - priority: 57
    category: state
    check: "Deliverable is in the from-state the transition requires (PENDING or REVISION_REQUESTED for submit; SUBMITTED for review)."
    error_id: ERR_DELIVERABLE_INVALID_STATE
    http_status: 409
    applies_to: "POST /deliverables/{id}/submit, POST /deliverables/{id}/review"
  - priority: 58
    category: state
    check: "DisclosureRecord is in the from-state the transition requires (PENDING_REVIEW for rule; NON_COMPLIANT for remediate)."
    error_id: ERR_DISCLOSURE_INVALID_STATE
    http_status: 409
    applies_to: "POST /disclosure-records/{id}/rule, POST /disclosure-records/{id}/remediate"
  - priority: 59
    category: state
    check: "Engagement.settlement_status IN {BILLABLE, INVOICED} when a PayoutStatement is created (SETTLED and UNBILLED both refuse)."
    error_id: ERR_SETTLEMENT_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /payout-statements"
  - priority: 60
    category: state
    check: "PayoutStatement.status == DRAFT when disbursing."
    error_id: ERR_PAYOUT_INVALID_STATE
    http_status: 409
    applies_to: "POST /payout-statements/{id}/disburse"
  - priority: 61
    category: business_temporal
    check: "date(logical_clock) <= RenewalOption.option_deadline_date and option.status == OPEN; a later decision lapses the option and is refused."
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /renewal-options/{id}/decide"
  - priority: 64
    category: business_safety
    check: "The ComplianceOfficer ruling on a disclosure is not the same X-User-ID that screened the opportunity behind the deliverable's engagement (segregation of duties)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disclosure-records/{id}/rule"
  - priority: 65
    category: business_safety
    check: "Brand.sanctioned == false."
    error_id: ERR_BRAND_SANCTIONED
    http_status: 422
    applies_to: "POST /term-sheets/{id}/accept, POST /engagements/{id}/countersign"
  - priority: 66
    category: business_safety
    check: "Two clauses, same error: (a) on POST /deliverables/{id}/review with decision APPROVE, when Deliverable.disclosure_required == true, at least one DisclosureRecord of the deliverable must have status == COMPLIANT; (b) on POST /disclosure-records/{id}/rule with ruling COMPLIANT, record.disclosure_tag must be a member of ACCEPTED_DISCLOSURE_TAGS = {\"#ad\", \"#sponsored\", \"#paidpartnership\"}."
    error_id: ERR_DISCLOSURE_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /deliverables/{id}/review, POST /disclosure-records/{id}/rule"
  - priority: 67
    category: business_safety
    check: "A revision may not weaken the morals clause below the tier demanded by the brand's most recent counter (strictness TIER_A > TIER_B > TIER_C)."
    error_id: ERR_MORALS_TIER_DOWNGRADE_FORBIDDEN
    http_status: 422
    applies_to: "POST /term-sheets/{id}/revise"
  - priority: 70
    category: business_referential
    check: "A Deliverable of type APPEARANCE references a booking whose engagement_id equals the deliverable's engagement_id; type SHOOT carries production_slot_id + shoot window and no booking_id; type SOCIAL_POST carries neither."
    error_id: ERR_BOOKING_ENGAGEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /deliverables"
  - priority: 71
    category: business_referential
    check: "A SHOOT reservation lies inside its slot: shoot_start_at >= slot.window_start_at and shoot_end_at <= slot.window_end_at."
    error_id: ERR_SLOT_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /deliverables"
  - priority: 75
    category: business_temporal
    check: |
      Athlete calendar occupation, CLOSED intervals with per-booking travel padding: the new booking's
      [start_at - travel_buffer_hours, end_at + travel_buffer_hours] must not intersect the same
      interval of ANY other AppearanceBooking of the SAME athlete (across all of that athlete's
      engagements) whose status IN {HOLD, CONFIRMED}. Touching endpoints count as an intersection
      (new_inflated_start <= other_inflated_end AND new_inflated_end >= other_inflated_start).
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /appearance-bookings"
  - priority: 76
    category: business_temporal
    check: |
      ProductionSlot occupation, HALF-OPEN intervals with aggregate capacity: for a SHOOT deliverable
      reserving [shoot_start_at, shoot_end_at) on a slot, the maximum number of same-slot reservations
      (Deliverable rows with status != VOIDED) covering any single instant must not exceed
      ProductionSlot.capacity. Adjacent reservations (previous end == next start) do not overlap.
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deliverables"
  - priority: 77
    category: business_temporal
    check: "date(start_at) >= Engagement.term_start_date and date(end_at) <= Engagement.term_end_date (both inclusive)."
    error_id: ERR_BOOKING_WINDOW_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /appearance-bookings"
  - priority: 80
    category: business_constraint
    check: |
      Category exclusivity register, INCLUSIVE day intervals: the new grant's [start_date, end_date]
      must not intersect any other ExclusivityGrant of the same athlete_id and the same category whose
      status IN {PENDING, ACTIVE}. Adjacency is allowed (new.start_date == other.end_date + 1 day is
      clean; new.start_date == other.end_date conflicts).
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /term-sheets/{id}/accept"
  - priority: 81
    category: business_constraint
    check: "TermSheet.counter_count < MAX_COUNTER_ROUNDS (3) before a counter is recorded."
    error_id: ERR_COUNTER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /term-sheets/{id}/counter"
  - priority: 82
    category: business_constraint
    check: "A deliverable has at most one DisclosureRecord whose status IN {PENDING_REVIEW, COMPLIANT}."
    error_id: ERR_DUPLICATE_DISCLOSURE
    http_status: 409
    applies_to: "POST /disclosure-records"
  - priority: 85
    category: business_fiscal
    check: "TermSheet.fee_cents <= Athlete.base_appearance_rate_cents * FEE_CAP_MULTIPLE (8)."
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /term-sheets/{id}/accept"
  - priority: 86
    category: business_fiscal
    check: "At least one Deliverable of the engagement has status == APPROVED (the billable set is non-empty)."
    error_id: ERR_NO_BILLABLE_DELIVERABLES
    http_status: 422
    applies_to: "POST /payout-statements"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pins the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every offer expiry, renewal deadline and *_at stamp is derived from this clock."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock; no entity is mutated"]

  - method: POST
    path: "/athletes"
    description: "Register an athlete on the agency roster."
    roles: [TalentAgent]
    code: 201
    input: ["full_name", "sport", "market_tier", "base_appearance_rate_cents", "commission_pct", "home_market?"]
    output: Athlete
    side_effects: ["status = ACTIVE, active_exclusivity_count = 0, exposure_risk_snapshot_score = 0, no_show_count = 0"]
  - method: GET
    path: "/athletes/{id}"
    description: "Read one athlete including the denormalized exposure snapshot."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: Athlete
    side_effects: []
  - method: POST
    path: "/athletes/{id}/status"
    description: "Compliance sets roster status (ACTIVE, SUSPENDED or RETIRED)."
    roles: [ComplianceOfficer]
    code: 200
    input: ["status", "reason?"]
    output: Athlete
    side_effects: ["Athlete.status is replaced; SUSPENDED/RETIRED athletes fail validations[priority=50]"]
  - method: GET
    path: "/athletes/{id}/exposure-summary"
    description: "Computed read of calculations.athlete_exposure_risk_score. variant defaults to ROSTER_SNAPSHOT."
    roles: [TalentAgent, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["variant?"]
    output: { athlete_id: string, variant: string, category_load: integer, morals_exposure: integer, noncompliance_hits: integer, score: integer }
    side_effects: []
  - method: GET
    path: "/athletes/{id}/exclusivity-grants"
    description: "Every exclusivity grant held against this athlete (reverse reachability for ExclusivityGrant.athlete_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects: []

  - method: POST
    path: "/brands"
    description: "Register a brand. The response id is the X-User-ID a BrandRep acts under."
    roles: [BrandRep]
    code: 201
    input: ["name", "category", "legal_entity_name", "compliance_rating"]
    output: Brand
    side_effects: ["sanctioned = false"]
  - method: GET
    path: "/brands/{id}"
    description: "Read one brand."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: POST
    path: "/brands/{id}/sanction"
    description: "Compliance raises or clears the sanction flag on a brand."
    roles: [ComplianceOfficer]
    code: 200
    input: ["sanctioned", "reason?"]
    output: Brand
    side_effects: ["Brand.sanctioned and sanction_reason are replaced; blocks acceptance and countersignature while true"]

  - method: POST
    path: "/opportunities"
    description: "Brand files an endorsement opportunity against a rostered athlete."
    roles: [BrandRep]
    code: 201
    input: ["athlete_id", "brand_id", "requested_start_date", "requested_end_date", "proposed_fee_cents", "planned_posts", "planned_appearances", "planned_shoots", "exclusivity_category", "exclusivity_months", "territory", "usage_rights_tier"]
    output: Opportunity
    side_effects: ["status = INTAKE; brand_fit_score and expected_fee_cents stay null until screening"]
  - method: GET
    path: "/opportunities/{id}"
    description: "Read one opportunity including the screening outputs."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: Opportunity
    side_effects: []
  - method: GET
    path: "/opportunities"
    description: "Filtered, paginated opportunity list (reverse reachability for Opportunity.athlete_id and Opportunity.brand_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["athlete_id?", "brand_id?", "status?", "limit?", "offset?"]
    output: Opportunity[]
    side_effects: []
  - method: POST
    path: "/opportunities/{id}/screen"
    description: "Compliance screens brand fit; runs calculations.brand_fit_score and branches INTAKE -> SCREENED or INTAKE -> REJECTED_FIT."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["writes expected_fee_cents, brand_fit_score, screened_by_user_id (the segregation-of-duties key) and screened_at"]

  - method: POST
    path: "/term-sheets"
    description: "Agent drafts round 1 of a term sheet against a SCREENED opportunity."
    roles: [TalentAgent]
    code: 201
    input: ["opportunity_id", "fee_cents", "usage_rights_tier", "usage_term_months", "territory", "morals_clause_tier", "exclusivity_months", "appearance_days"]
    output: TermSheet
    side_effects: ["status = DRAFT, round_number = 1, counter_count = 0; exclusivity_category is copied from the opportunity"]
  - method: GET
    path: "/term-sheets/{id}"
    description: "Read one term sheet including provisional_fee_cents and offer_expires_at."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: TermSheet
    side_effects: []
  - method: GET
    path: "/term-sheets"
    description: "Filtered, paginated term-sheet list (reverse reachability for TermSheet.opportunity_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["opportunity_id?", "status?", "limit?", "offset?"]
    output: TermSheet[]
    side_effects: []
  - method: POST
    path: "/term-sheets/{id}/submit"
    description: "Agent submits the paper to the brand (DRAFT -> SUBMITTED)."
    roles: [TalentAgent]
    code: 200
    input: []
    output: TermSheet
    side_effects: ["recomputes provisional_fee_cents (PROVISIONAL variant); stamps offer_expires_at = clock + 14 days"]
  - method: POST
    path: "/term-sheets/{id}/counter"
    description: "Brand counters the paper (SUBMITTED -> COUNTERED), overwriting the negotiated terms."
    roles: [BrandRep]
    code: 200
    input: ["counter_fee_cents", "counter_usage_rights_tier", "counter_morals_clause_tier", "counter_exclusivity_months", "note?"]
    output: TermSheet
    side_effects: ["overwrites fee_cents/usage_rights_tier/morals_clause_tier/exclusivity_months; counter_count += 1; last_counter_morals_tier is recorded"]
  - method: POST
    path: "/term-sheets/{id}/revise"
    description: "Agent answers the counter (COUNTERED -> SUBMITTED), closing the negotiation cycle."
    roles: [TalentAgent]
    code: 200
    input: ["fee_cents", "usage_rights_tier", "usage_term_months", "morals_clause_tier", "exclusivity_months", "appearance_days"]
    output: TermSheet
    side_effects: ["round_number += 1; recomputes provisional_fee_cents; re-stamps offer_expires_at"]
  - method: POST
    path: "/term-sheets/{id}/accept"
    description: "Brand accepts the paper; mints the Engagement and the PENDING exclusivity grant."
    roles: [BrandRep]
    code: 201
    input: []
    output: Engagement
    side_effects: ["TermSheet -> ACCEPTED; Opportunity -> CONTRACTED; sibling term sheets -> WITHDRAWN; Engagement created (PENDING_COUNTERSIGN / UNBILLED); ExclusivityGrant created PENDING"]
  - method: POST
    path: "/term-sheets/{id}/withdraw"
    description: "Agent pulls the paper off the table."
    roles: [TalentAgent]
    code: 200
    input: ["reason?"]
    output: TermSheet
    side_effects: ["status -> WITHDRAWN; if no live sibling remains, Opportunity -> CLOSED_LOST"]

  - method: GET
    path: "/engagements/{id}"
    description: "Read one engagement, both status dimensions, the fee variants and the derived counters."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/engagements"
    description: "Filtered, paginated engagement list (reverse reachability for term_sheet_id, opportunity_id, athlete_id and brand_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["athlete_id?", "brand_id?", "term_sheet_id?", "opportunity_id?", "contract_status?", "settlement_status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/engagements/{id}/countersign"
    description: "Finance countersigns (PENDING_COUNTERSIGN -> ACTIVE) and freezes binding_fee_cents."
    roles: [FinanceManager]
    code: 200
    input: ["signed_by_reference"]
    output: Engagement
    side_effects: ["computes binding_fee_cents (BINDING variant); grant PENDING -> ACTIVE; Athlete.active_exclusivity_count += 1; Athlete.exposure_risk_snapshot_score recomputed"]
  - method: POST
    path: "/engagements/{id}/terminate"
    description: "Compliance terminates the engagement and runs the four-hop unwind cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason_code"]
    output: Engagement
    side_effects: ["contract_status -> TERMINATED; grants RELEASED; Athlete counter and snapshot score updated; live bookings CANCELLED with REVERSAL ledger entries; live deliverables VOIDED; slot reserved_count decremented; settlement_status UNBILLED -> BILLABLE"]
  - method: GET
    path: "/engagements/{id}/ledger-entries"
    description: "Append-only money movements of one engagement (reverse reachability for LedgerEntry.engagement_id), ordered by created_at ASC."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/engagements/{id}/exclusivity-grants"
    description: "Exclusivity grants held by one engagement (reverse reachability for ExclusivityGrant.engagement_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects: []
  - method: GET
    path: "/engagements/{id}/payout-statements"
    description: "Payout statements of one engagement, newest last (reverse reachability for PayoutStatement.engagement_id)."
    roles: [TalentAgent, ComplianceOfficer, FinanceManager, Athlete]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayoutStatement[]
    side_effects: []
  - method: GET
    path: "/engagements/{id}/renewal-options"
    description: "Renewal options of one engagement (reverse reachability for RenewalOption.engagement_id)."
    roles: [TalentAgent, BrandRep, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenewalOption[]
    side_effects: []

  - method: POST
    path: "/appearance-bookings"
    description: "Agent places an appearance hold on the athlete's calendar. Guarded by OCC on the engagement version."
    roles: [TalentAgent]
    code: 201
    input: ["engagement_id", "city", "start_at", "end_at", "travel_buffer_hours", "expected_engagement_version"]
    output: AppearanceBooking
    side_effects: ["status = HOLD; increments Engagement.version by 1; runs the closed-interval athlete calendar check (validations[priority=75])"]
  - method: GET
    path: "/appearance-bookings/{id}"
    description: "Read one booking."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: AppearanceBooking
    side_effects: []
  - method: GET
    path: "/appearance-bookings"
    description: "Filtered, paginated booking list (reverse reachability for AppearanceBooking.engagement_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: AppearanceBooking[]
    side_effects: []
  - method: POST
    path: "/appearance-bookings/{id}/confirm"
    description: "Agent confirms the hold and books travel (HOLD -> CONFIRMED)."
    roles: [TalentAgent]
    code: 200
    input: ["travel_cost_cents"]
    output: AppearanceBooking
    side_effects: ["computes travel_days; appends LedgerEntry TRAVEL_ACCRUAL (+travel_cost_cents); Engagement.accrued_fee_cents increases"]
  - method: POST
    path: "/appearance-bookings/{id}/close"
    description: "Agent closes a confirmed booking with outcome COMPLETED or NO_SHOW (divergent side-effect branches)."
    roles: [TalentAgent]
    code: 200
    input: ["outcome"]
    output: AppearanceBooking
    side_effects: ["COMPLETED: outcome only. NO_SHOW: Athlete.no_show_count += 1 and a PENALTY ledger entry of -10% of binding_fee_cents, lowering Engagement.accrued_fee_cents"]
  - method: POST
    path: "/appearance-bookings/{id}/cancel"
    description: "Cancel a hold or a confirmed booking; a confirmed cancel writes the compensating REVERSAL entry."
    roles: [TalentAgent, BrandRep]
    code: 200
    input: ["reason_code"]
    output: AppearanceBooking
    side_effects: ["status -> CANCELLED; from CONFIRMED appends LedgerEntry REVERSAL (-travel_cost_cents) restoring Engagement.accrued_fee_cents; linked live APPEARANCE deliverables -> VOIDED"]

  - method: POST
    path: "/production-slots"
    description: "Agency opens a studio/crew slot with an aggregate capacity."
    roles: [TalentAgent]
    code: 201
    input: ["name", "capacity", "window_start_at", "window_end_at"]
    output: ProductionSlot
    side_effects: ["reserved_count = 0"]
  - method: GET
    path: "/production-slots/{id}"
    description: "Read one production slot including reserved_count."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: []

  - method: POST
    path: "/deliverables"
    description: "Agent schedules a deliverable; SHOOT rows reserve a half-open window on a production slot."
    roles: [TalentAgent]
    code: 201
    input: ["engagement_id", "type", "due_date", "disclosure_required?", "booking_id?", "production_slot_id?", "shoot_start_at?", "shoot_end_at?"]
    output: Deliverable
    side_effects: ["status = PENDING; weight derived from type; for SHOOT rows ProductionSlot.reserved_count += 1 after the half-open capacity check (validations[priority=76])"]
  - method: GET
    path: "/deliverables/{id}"
    description: "Read one deliverable."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/deliverables"
    description: "Filtered, paginated deliverable list (reverse reachability for engagement_id, booking_id and production_slot_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["engagement_id?", "booking_id?", "production_slot_id?", "status?", "type?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/submit"
    description: "Athlete submits the asset (PENDING or REVISION_REQUESTED -> SUBMITTED)."
    roles: [Athlete]
    code: 200
    input: ["asset_url"]
    output: Deliverable
    side_effects: ["stores asset_url"]
  - method: POST
    path: "/deliverables/{id}/review"
    description: "Brand approves or bounces the asset; APPROVE runs the four-hop completion cascade."
    roles: [BrandRep]
    code: 200
    input: ["decision", "revision_note?"]
    output: Deliverable
    side_effects: ["APPROVE: Engagement.approved_deliverable_count += 1, which on reaching required_deliverable_count moves contract_status ACTIVE -> COMPLETED, which moves settlement_status UNBILLED -> BILLABLE. REQUEST_REVISION: revision_count += 1 only"]
  - method: GET
    path: "/deliverables/{id}/disclosure-records"
    description: "Disclosure records filed against one deliverable (reverse reachability for DisclosureRecord.deliverable_id)."
    roles: [TalentAgent, BrandRep, Athlete, ComplianceOfficer, FinanceManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DisclosureRecord[]
    side_effects: []

  - method: POST
    path: "/disclosure-records"
    description: "Athlete files the paid-promotion disclosure for a deliverable."
    roles: [Athlete]
    code: 201
    input: ["deliverable_id", "platform", "disclosure_tag", "posted_at"]
    output: DisclosureRecord
    side_effects: ["status = PENDING_REVIEW"]
  - method: POST
    path: "/disclosure-records/{id}/rule"
    description: "Compliance rules COMPLIANT or NON_COMPLIANT. A COMPLIANT ruling requires disclosure_tag IN {\"#ad\", \"#sponsored\", \"#paidpartnership\"}, and the ruling officer may not be the officer who screened the opportunity."
    roles: [ComplianceOfficer]
    code: 200
    input: ["ruling", "finding_note?"]
    output: DisclosureRecord
    side_effects: ["records ruled_by_user_id; NON_COMPLIANT raises noncompliance_hits and recomputes Athlete.exposure_risk_snapshot_score"]
  - method: POST
    path: "/disclosure-records/{id}/remediate"
    description: "Athlete re-tags a non-compliant disclosure, returning it to review (cycle edge)."
    roles: [Athlete]
    code: 200
    input: ["disclosure_tag", "posted_at"]
    output: DisclosureRecord
    side_effects: ["status -> PENDING_REVIEW; remediation_count += 1; ruled_by_user_id cleared; Athlete.exposure_risk_snapshot_score recomputed"]

  - method: POST
    path: "/payout-statements"
    description: "Finance builds the settlement statement. Guarded by OCC on the engagement version; a second create supersedes the standing DRAFT."
    roles: [FinanceManager]
    code: 201
    input: ["engagement_id", "expected_engagement_version"]
    output: PayoutStatement
    side_effects: ["runs calculations.payout_distribution; settlement_status BILLABLE -> INVOICED (or self-loop, voiding the prior DRAFT); increments Engagement.version by 1; writes Deliverable.line_value_cents on every billed line"]
  - method: POST
    path: "/payout-statements/{id}/disburse"
    description: "Finance disburses the statement (DRAFT -> DISBURSED)."
    roles: [FinanceManager]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: ["stamps disbursed_at; appends LedgerEntry DISBURSEMENT (-athlete_net_cents); Engagement.gross_settled_cents += gross_amount_cents; settlement_status INVOICED -> SETTLED"]

  - method: POST
    path: "/renewal-options"
    description: "Agent opens a renewal option; runs calculations.performance_bonus_and_renewal at creation."
    roles: [TalentAgent]
    code: 201
    input: ["engagement_id", "option_deadline_date", "proposed_base_fee_cents"]
    output: RenewalOption
    side_effects: ["writes base_value_cents, approval_rate, bonus_tier, bonus_cents, total_engagement_value_cents and renewal_fee_cents; status = OPEN"]
  - method: POST
    path: "/renewal-options/{id}/decide"
    description: "Brand exercises or declines the option; a decision past the deadline lapses it."
    roles: [BrandRep]
    code: 200
    input: ["decision"]
    output: RenewalOption
    side_effects: ["EXERCISE: appends LedgerEntry BONUS (+bonus_cents), raising Engagement.accrued_fee_cents. DECLINE: no ledger movement. Past deadline: status -> LAPSED and the call is refused"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, blank, or naming an undeclared role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed caller (BrandRep or Athlete) acts on a resource whose brand_id / athlete_id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ComplianceOfficer ruling on a disclosure is the same X-User-ID recorded in Opportunity.screened_by_user_id for that engagement's opportunity."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, enum value outside its member set, negative amount, end instant not after start instant, limit outside 1..100."
  - id: ERR_ATHLETE_NOT_FOUND
    http: 404
    condition: "Athlete id in the path or in a request body does not resolve."
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "Brand id in the path or in a request body does not resolve."
  - id: ERR_OPPORTUNITY_NOT_FOUND
    http: 404
    condition: "Opportunity id in the path or in a request body does not resolve."
  - id: ERR_TERM_SHEET_NOT_FOUND
    http: 404
    condition: "TermSheet id in the path does not resolve."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "Engagement id in the path or in a request body does not resolve."
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "AppearanceBooking id in the path or in a request body does not resolve."
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "Deliverable id in the path or in a request body does not resolve."
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "DisclosureRecord id in the path does not resolve."
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "ProductionSlot id in the path or in a request body does not resolve."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "PayoutStatement id in the path does not resolve."
  - id: ERR_RENEWAL_NOT_FOUND
    http: 404
    condition: "RenewalOption id in the path does not resolve."
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the Engagement's current version on POST /appearance-bookings or POST /payout-statements."
  - id: ERR_ATHLETE_NOT_BOOKABLE
    http: 409
    condition: "The athlete behind the resource has status SUSPENDED or RETIRED."
  - id: ERR_OPPORTUNITY_NOT_SCREENED
    http: 409
    condition: "A TermSheet is created against an Opportunity whose status is not SCREENED."
  - id: ERR_TERM_SHEET_INVALID_STATE
    http: 409
    condition: "The term sheet is not in the from-state the requested negotiation transition needs."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Acceptance is attempted after TermSheet.offer_expires_at; the paper is moved to EXPIRED."
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: "The engagement's contract_status is outside the set the operation requires (e.g. booking or reviewing against a TERMINATED or COMPLETED engagement, or opening a renewal option on an ACTIVE one)."
  - id: ERR_ENGAGEMENT_ALREADY_TERMINAL
    http: 409
    condition: "Countersign is attempted on an engagement that already left PENDING_COUNTERSIGN, or terminate is attempted on an engagement already COMPLETED or TERMINATED."
  - id: ERR_BOOKING_INVALID_STATE
    http: 409
    condition: "Confirm from a non-HOLD booking, close from a non-CONFIRMED booking, or cancel from a terminal booking."
  - id: ERR_DELIVERABLE_INVALID_STATE
    http: 409
    condition: "Submit from a status outside {PENDING, REVISION_REQUESTED} or review from a status other than SUBMITTED."
  - id: ERR_DISCLOSURE_INVALID_STATE
    http: 409
    condition: "Rule on a record that is not PENDING_REVIEW, or remediate a record that is not NON_COMPLIANT."
  - id: ERR_SETTLEMENT_NOT_BILLABLE
    http: 409
    condition: "A payout statement is requested while settlement_status is UNBILLED or SETTLED."
  - id: ERR_PAYOUT_INVALID_STATE
    http: 409
    condition: "Disburse is attempted on a statement that is not DRAFT."
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 409
    condition: "A decision arrives after option_deadline_date, or the option is no longer OPEN; the option is moved to LAPSED."
  - id: ERR_BRAND_SANCTIONED
    http: 422
    condition: "Acceptance or countersignature is attempted while Brand.sanctioned == true."
  - id: ERR_DISCLOSURE_NOT_COMPLIANT
    http: 422
    condition: "APPROVE is requested for a deliverable with disclosure_required == true that has no COMPLIANT DisclosureRecord, or a COMPLIANT ruling is requested for a record whose disclosure_tag is outside ACCEPTED_DISCLOSURE_TAGS."
  - id: ERR_MORALS_TIER_DOWNGRADE_FORBIDDEN
    http: 422
    condition: "A revise proposes a morals tier looser than TermSheet.last_counter_morals_tier."
  - id: ERR_BOOKING_ENGAGEMENT_MISMATCH
    http: 422
    condition: "Deliverable type and its references disagree: APPEARANCE without a booking of the same engagement, SHOOT without a slot and window, SOCIAL_POST carrying either."
  - id: ERR_SLOT_WINDOW_VIOLATION
    http: 422
    condition: "A SHOOT reservation falls outside the slot's [window_start_at, window_end_at]."
  - id: ERR_BOOKING_OVERLAP
    http: 409
    condition: "The new booking's travel-padded closed interval intersects another HOLD/CONFIRMED booking of the same athlete."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "A SHOOT reservation would push the number of overlapping half-open reservations on the slot above ProductionSlot.capacity."
  - id: ERR_BOOKING_WINDOW_OUTSIDE_TERM
    http: 422
    condition: "The booking's dates fall outside the engagement's inclusive [term_start_date, term_end_date]."
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "The grant that acceptance would mint intersects a PENDING/ACTIVE grant of the same athlete and category on inclusive day boundaries."
  - id: ERR_COUNTER_LIMIT_EXCEEDED
    http: 422
    condition: "A fourth counter is attempted on a term sheet that already has counter_count == 3."
  - id: ERR_DUPLICATE_DISCLOSURE
    http: 409
    condition: "A second DisclosureRecord is filed for a deliverable that already has one in PENDING_REVIEW or COMPLIANT."
  - id: ERR_FEE_CAP_EXCEEDED
    http: 422
    condition: "The accepted fee exceeds Athlete.base_appearance_rate_cents * 8."
  - id: ERR_NO_BILLABLE_DELIVERABLES
    http: 422
    condition: "A payout statement is requested for an engagement whose APPROVED deliverable set is empty."

roles:
  - name: TalentAgent
    description: "Agency-side booking agent: builds the roster, papers the deal, runs appearance logistics and opens renewal options."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletes"
      - "POST /term-sheets"
      - "POST /term-sheets/{id}/submit"
      - "POST /term-sheets/{id}/revise"
      - "POST /term-sheets/{id}/withdraw"
      - "POST /appearance-bookings"
      - "POST /appearance-bookings/{id}/confirm"
      - "POST /appearance-bookings/{id}/close"
      - "POST /production-slots"
      - "POST /deliverables"
      - "POST /renewal-options"
    shared_operations:
      - "POST /appearance-bookings/{id}/cancel (with BrandRep)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads"
  - name: BrandRep
    description: "Advertiser-side representative; acts as the Brand entity it registered."
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /opportunities"
      - "POST /term-sheets/{id}/counter"
      - "POST /term-sheets/{id}/accept"
      - "POST /deliverables/{id}/review"
      - "POST /renewal-options/{id}/decide"
      - "POST /brands"
    shared_operations:
      - "POST /appearance-bookings/{id}/cancel (with TalentAgent)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads except GET /athletes/{id}/exposure-summary and GET /engagements/{id}/payout-statements"
  - name: Athlete
    description: "The talent; acts as the Athlete entity the agent rostered."
    identity: "entity_backed:Athlete"
    exclusive_operations:
      - "POST /deliverables/{id}/submit"
      - "POST /disclosure-records"
      - "POST /disclosure-records/{id}/remediate"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of own resources"
  - name: ComplianceOfficer
    description: "Independent compliance desk: brand-fit screening, sanctions, roster status, disclosure rulings and terminations. Segregation of duties forbids the officer who screened an opportunity from ruling on that engagement's disclosures."
    identity: "opaque"
    exclusive_operations:
      - "POST /opportunities/{id}/screen"
      - "POST /brands/{id}/sanction"
      - "POST /athletes/{id}/status"
      - "POST /disclosure-records/{id}/rule"
      - "POST /engagements/{id}/terminate"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads"
  - name: FinanceManager
    description: "Agency finance: countersigns contracts, builds and disburses payout statements."
    identity: "opaque"
    exclusive_operations:
      - "POST /engagements/{id}/countersign"
      - "POST /payout-statements"
      - "POST /payout-statements/{id}/disburse"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads"
