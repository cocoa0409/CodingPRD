              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "PULL_STATION", serial_no: "PS-I1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Ivy Check", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "NONCRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { def_id: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/deficiencies/${def_id}/attest-correction"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dl_before: $.data.correction_deadline }
          trigger:
            - call: "POST /fire-compliance/deficiencies/${def_id}/reject-correction"
              payload: {}
              as: FireMarshal
          assert:
            - "Deficiency.${def_id}.status == OPEN"
            - "Deficiency.${def_id}.corrected_at == null"
            - "Deficiency.${def_id}.correction_deadline == captured dl_before == 2026-09-02 (invariant: deadline conserved across attest+reject pair)"
      - name: false_alarm_waive_restores_fee_pool_invariant
        grounds:
          - state_machines.FalseAlarmCase.ASSESSED_to_WAIVED
          - calculations.false_alarm_fee
          - entities.FalseAlarmCase.fields.fee_cents
        distinguishing_aspect: |
          Conserved quantity: the property's rolling-window assessed-fee total.
          Assess then waive must return the property's outstanding assessed fee
          sum to its pre-assess value (waive zeroes fee_cents), and a WAIVED
          case must be excluded from future sequence_number counts — a
          different conserved quantity (monetary pool) than the deadline date.
        test_recipe:
          setup:
            - "BUSINESS property with 2 prior assessed chargeable alarms; 3rd alarm assessed at 15000 then waived"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
