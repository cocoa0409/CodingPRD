              captures: { bay_status: $.data.status }
          assert:
            - "WorkOrder.${wo_a}.service_status == COMPLETED"
            - "QueueTicket.${tkt_b}.status == ASSIGNED (promoted by the bay freeing, not by complete directly)"
            - "QueueTicket.${tkt_b}.work_order_id != null (new DRAFT order created at promotion)"
            - "Bay.${bay_id}.status == OCCUPIED (re-occupied by the promoted ticket — net open_bay_count unchanged)"

      - name: cancel_voids_lines_and_payment_and_frees_bay
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_CANCELLED
          - state_machines.WorkOrder.AUTHORIZED_to_VOIDED
          - state_machines.Bay.OCCUPIED_to_OPEN
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (cancel, not complete): cancelling an
          AUTHORIZED order voids its Payment (AUTHORIZED->VOIDED) which itself releases the
          fleet reserved credit; and independently frees the bay. The payment-void link is
