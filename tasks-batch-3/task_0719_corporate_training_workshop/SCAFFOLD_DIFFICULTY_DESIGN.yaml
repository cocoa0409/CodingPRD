              captures: { sr: $.data.seats_reserved, sc: $.data.seats_confirmed, sw: $.data.seats_waitlisted }
          assert:
            - "Registration ${regW1}.status == WITHDRAWN"
            - "Registration ${regW2}.status == ENROLLED (promoted from WAITLISTED as a consequence of the freed seat)"
            - "Cohort.seats_confirmed == 0, seats_reserved == 1, seats_waitlisted == 0"

