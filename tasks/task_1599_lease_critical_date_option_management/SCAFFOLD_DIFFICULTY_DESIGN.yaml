            - "Lease.${lid}.status remains ACTIVE; Amendment.${aid}.status remains AGREED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exercise_window_closed_closed_membership
        grounds:
          - calculations.notice_window_membership
          - validations[priority=6]
          - errors[ERR_NOTICE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics: CLOSED-CLOSED membership on the Option resource's
          notice window — a notice delivered exactly ON notice_window_close_date
          is timely (inclusive bound), while one day later is rejected; the
          geometric treatment is inclusive-at-both-ends.
        test_recipe:
          setup:
            - "Portfolio P, AM contact; lease L ACTIVE; option O window [2026-08-01, 2026-09-30]"
            - "Clock at exactly 2026-09-30 (the close date)"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P15", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Fifteen", email: "am15@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "OF-15", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id, l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "EXPANSION", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-09-30T00:00:00Z", target_commencement_date: "2027-01-01T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "EMAIL_IF_PERMITTED", expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid: $.data.id }
          assert:
            - "notice created on the closing day succeeds (201) — window close is INCLUSIVE"
            - "Option.${oid}.status == NOTICE_SENT"

      - name: single_open_negotiation_per_lease_aggregate_capacity
        grounds:
          - validations[priority=8]
          - errors[ERR_NEGOTIATION_ALREADY_OPEN]
          - state_machines.Amendment.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the Lease
          resource admits at most ONE amendment in the open-negotiation interval
          {PROPOSED, COUNTERED, AGREED} — an aggregate-capacity occupancy rule
          (capacity 1 over a state set), not a date-window membership rule; a
          second propose collides even though its dates do not overlap any
          calendar interval.
        test_recipe:
          setup:
            - "Portfolio P with AM, LC; lease L ACTIVE"
            - "Amendment A1 PROPOSED; Amendment A2 DRAFT on the same lease"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P16", region: "EAST", laddering_max_pct_per_year: 40 }
