              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-04T00:00:00Z", window_end: "2026-11-20T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_WINDOW_OUTSIDE_SEASON (temporal priority 6 beats constraint priority 7)"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (score threshold vs barrel quota; different endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grade_color_exactly_at_grade_a_threshold
        grounds:
          - calculations.delivery_grade_assignment
          - endpoints["POST /coop/deliveries/{id}/grade"]
        distinguishing_aspect: |
          Metric = color score: exactly 8.0/8.0/2.0 must be grade A (inclusive
