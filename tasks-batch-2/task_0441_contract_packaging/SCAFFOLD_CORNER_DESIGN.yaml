            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
