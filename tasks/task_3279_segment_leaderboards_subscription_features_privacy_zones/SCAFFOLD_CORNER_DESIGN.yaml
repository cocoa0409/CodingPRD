          assert:
            - "export.profile.email == ex_e@x.com"
            - "export.activities contains activity ${act_ex}"
            - "export.safety_contacts has length 1"
            - "export keys include efforts, segments, memberships, participations, rsvps, privacy_zones, subscriptions"

      - name: segments_list_filter_and_pagination
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /v1/segments?sport_type=RIDE&limit=1 paginates with the envelope fields total_count and has_more and filters by sport_type."
        test_recipe:
          setup: ["Athlete PG created two RIDE segments and one RUN segment"]
