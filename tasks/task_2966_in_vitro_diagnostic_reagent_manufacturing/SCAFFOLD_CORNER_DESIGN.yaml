            - call: "POST /bridging-studies/${bs_id}/decision"
              payload: { decision: "APPROVE", rationale: "Bias within programme limits." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "at study creation the per-code paired biases are ACTIVITY round_half_up(|101.0 - 100.0| / 100.0 * 100, 2) == 1.00 and SENSITIVITY round_half_up(|105.0 - 100.0| / 100.0 * 100, 2) == 5.00"
            - "max_bias_pct is 5.00, exactly MAX_BIAS_MAX_PCT, and mean_bias_pct is round_half_up((1.00 + 5.00) / 2, 2) == 3.00, exactly MEAN_BIAS_MAX_PCT — equivalence_verdict is EQUIVALENT because BOTH comparisons are <=, not <"
            - "the candidate's own release bias figures of 1.00 and 5.00 both remain PASS against the product's max_reference_bias_pct of 10.0, so nothing else in the fixture is perturbed"
            - "recording a newer candidate ACTIVITY result of 101.1 at 2026-08-07T00:00:00Z re-derives the study from the LATEST result per code: mean_bias_pct becomes round_half_up((1.10 + 5.00) / 2, 2) == 3.05 while max_bias_pct is unchanged at 5.00"
            - "3.05 > 3.0 alone flips equivalence_verdict to NOT_EQUIVALENT, so the mean limit is enforced independently of the max limit"
            - "the subsequent APPROVE returns HTTP 409 ERR_NOT_EQUIVALENT and the study stays in DRAFT"

      - name: reagent_lot_expiry_clamps_the_day_of_month_and_keeps_the_time_of_day
        claim_type: Precision
        grounds:
          - calculations.reagent_lot_expiry
