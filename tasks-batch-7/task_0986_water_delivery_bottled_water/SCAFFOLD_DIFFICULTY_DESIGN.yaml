              as: OpsAdmin
              captures: { cust_a: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "RB", billing_email: "b@rb.example", service_address: "11 B", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 2, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_b: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-15", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r2: '$.data.id' }
            - call: "POST /api/v1/routes/${r2}/stops"
              payload: { customer_id: "${cust_a}", sequence_index: 1 }
              as: Dispatcher
              captures: { s_a: '$.data.id' }
            - call: "POST /api/v1/routes/${r2}/stops"
              payload: { customer_id: "${cust_b}", sequence_index: 2 }
              as: Dispatcher
              captures: { s_b: '$.data.id' }
            - call: "POST /api/v1/routes/${r2}/publish"
