        claim_type: temporal_validation
        grounds:
          - validations[priority=40]
          - state_machines.Demand.SETTLED_to_OFFER_OUTSTANDING
          - state_machines.ReviewCase.DECIDED_to_DELIBERATION
        distinguishing_aspect: "Both windows are closed intervals measured from the stored instant: a rescission at exactly settled_at + 168h and an appeal at exactly decided_at + 14 days both succeed, while the same call one second later is refused."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for the whole setup, so settled_at and decided_at are all exactly 2026-08-01T00:00:00Z."
