  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: equipment_buffer_rejects_29_minute_gap_and_admits_exactly_30
        grounds:
          - calculations.equipment_window_conflict
          - entities.EquipmentReservation.fields.buffer_minutes
          - validations[priority=27]
          - validations[priority=26]
          - errors[ERR_EQUIPMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          One EquipmentUnit is a capacity-1 resource whose stored interval
          [window_start_utc, window_end_utc) is padded by
          SANITATION_BUFFER_MINUTES 30 on both sides before comparison, and the
          comparison uses strict <. With a HELD reservation ending at 13:30Z, a
          second reservation starting at 13:59Z is 29 minutes clear and must be
          refused, while the very next attempt starting at 14:00Z is exactly 30
          minutes clear and must be accepted. Both candidate windows
          independently satisfy validations[priority=26] (start no later than
          14:15Z, end no earlier than 19:00Z), so the sole difference between
          the two outcomes is one minute against the buffer, and an
          implementation using <= or forgetting to pad the OLD interval's end
          gets the pair backwards.
        test_recipe:
          setup:
            - "Club C with one EquipmentUnit U of equipment_type TV_CART, sanitation_status SANITIZED."
            - "NON_FOOD product P (category ELECTRONICS, weekly_sample_case_pool 30) so no food certification or station accounting is involved."
            - "DemoEvent E1 on 2026-09-14 MORNING (event window 09:00Z-13:00Z, occupation shift 08:15Z-14:15Z) and DemoEvent E2 on 2026-09-14 AFTERNOON (event window 15:00Z-19:00Z, occupation shift 14:15Z-20:15Z), each requested_sample_cases 2 and each driven to CONFIRMED."
            - "E1 holds U on [08:00Z, 13:30Z) in reservation_status HELD, never activated or released, so it stays inside the conflict scope."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Norsted Audio", billing_email: "ap@norsted.example", program_tier: "STANDARD", credit_limit_cents: 4000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5516", name: "Norsted Club 5516", region_code: "W", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 1, health_permit_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "NA-SND-516", name: "Compact Soundbar", category: "ELECTRONICS", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 8900, samples_per_case: 2, weekly_sample_case_pool: 30 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /equipment-units"
              payload: { club_id: "${club_id}", asset_tag: "EQ-5516-TV1", equipment_type: "TV_CART" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { equip_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e1_id: "$.data.id" }
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "AFTERNOON", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e2_id: "$.data.id" }
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /equipment-reservations"
              payload: { equipment_unit_id: "${equip_id}", demo_event_id: "${e1_id}", window_start_utc: "2026-09-14T08:00:00Z", window_end_utc: "2026-09-14T13:30:00Z" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { r1_id: "$.data.id", r1_buffer: "$.data.buffer_minutes", r1_state: "$.data.reservation_status" }
          trigger:
            - call: "POST /equipment-reservations"
              payload: { equipment_unit_id: "${equip_id}", demo_event_id: "${e2_id}", window_start_utc: "2026-09-14T13:59:00Z", window_end_utc: "2026-09-14T19:30:00Z" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_29: "$.data.error_id" }
            - call: "POST /equipment-reservations"
              payload: { equipment_unit_id: "${equip_id}", demo_event_id: "${e2_id}", window_start_utc: "2026-09-14T14:00:00Z", window_end_utc: "2026-09-14T19:30:00Z" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { r2_id: "$.data.id", r2_state: "$.data.reservation_status" }
            - call: "GET /equipment-reservations?equipment_unit_id=${equip_id}"
              payload: { equipment_unit_id: "${equip_id}" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { listed_second_start: "$.data[1].window_start_utc" }
          assert:
            - "${r1_buffer} == 30"
            - "${r1_state} == HELD"
            - "${err_29} == ERR_EQUIPMENT_WINDOW_CONFLICT"
            - "the 13:59Z reservation responds with HTTP 409"
            - "${r2_state} == HELD"
            - "the 14:00Z reservation responds with HTTP 201"
            - "EquipmentReservation.${r2_id}.window_start_utc == 2026-09-14T14:00:00Z"
            - "EquipmentReservation.${r2_id}.buffer_minutes == 30"
            - "GET /equipment-reservations?equipment_unit_id=${equip_id} -> data has exactly 2 rows, ordered by created_at ASC"
            - "${listed_second_start} == 2026-09-14T14:00:00Z"
            - "EquipmentUnit.${equip_id}.sanitation_status == SANITIZED"
            - "EquipmentReservation.${r1_id}.reservation_status == HELD"

      - name: demonstrator_closed_geometry_rejects_touching_shift_endpoints
        grounds:
          - calculations.demonstrator_schedule_conflict
          - calculations.event_window_and_shift_derivation
          - validations[priority=28]
          - entities.EventAssignment.fields.scheduled_start_utc
          - errors[ERR_DEMONSTRATOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          The asymmetric pads (SETUP_LEAD_MINUTES 45 before, TEARDOWN_MINUTES
          75 after) make a MORNING shift end at 14:15Z at exactly the instant
          an AFTERNOON shift starts, so the two shifts share a single endpoint
          and nothing more. The demonstrator's geometry is CLOSED with zero
          buffer (new.start <= old.end AND old.start <= new.end), so that bare
          touch must be rejected — the direct opposite of the equipment unit,
          which accepts a 30-minute separation on the same pair of events. A
          second demonstrator then takes the AFTERNOON slot successfully and
          its scheduled_start_utc of 14:15:00Z proves the two intervals really
          did touch rather than merely being near. The daily cap is not in
          play: same_day is 1 against MAX_ASSIGNMENTS_PER_DEMONSTRATOR_PER_DAY
          2, so only the overlap arithmetic can produce the rejection.
        test_recipe:
          setup:
            - "NON_FOOD product P (category APPAREL) so no certification gate can pre-empt the overlap check."
            - "DemoEvent E1 on 2026-09-14 MORNING and DemoEvent E2 on 2026-09-14 AFTERNOON, each requested_sample_cases 2, both CONFIRMED at the same club."
            - "Demonstrator D1 homed at that club, ACTIVE, max_weekly_events 5. Demonstrator D2 likewise, used as the control."
            - "D1 is assigned LEAD on E1, giving it the shift [2026-09-14T08:15:00Z, 2026-09-14T14:15:00Z] in assignment_status ASSIGNED — inside the held scope."
