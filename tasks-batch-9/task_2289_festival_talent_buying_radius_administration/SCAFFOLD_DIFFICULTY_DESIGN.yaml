      - name: state_over_fiscal_on_offer_revise
        grounds:
          - validations[priority=30]
          - validations[priority=73]
          - errors.ERR_OFFER_NOT_NEGOTIABLE
          - errors.ERR_GUARANTEE_CEILING_EXCEEDED
        distinguishing_aspect: |
          Category pair (state, business_fiscal) on POST /offers/{id}/revise: priority 30 beats
          priority 73 by 43 places. The control offer proves the masked check is genuinely
          reachable — the identical body against a COUNTERED offer returns 422
          ERR_GUARANTEE_CEILING_EXCEEDED, so the 409 on the ACCEPTED offer is ordering and not
          an unreachable rule.
        test_recipe:
          setup:
            - "Single-tier Harbor Lights fixture (allocation_cents 9500000)."
            - "Two JAZZ_SOUL acts with draw_score 20, so each guarantee ceiling is min(tier_headroom, festival_headroom, floor(max(500000, 500000) * 1.00)) == 500000."
            - "Offer X issued at 400000 and then accepted, so its status is ACCEPTED. Offer Y issued at 400000 and countered by its artist, so its status is COUNTERED."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
