              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/allocation-lines/${l1_id}/ship"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/allocation-lines/${l3_id}/ship"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/allocation-lines/${l4_id}/ship"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/allocation-lines/${l1_id}/confirm-receipt"
              payload: {}
              as: StoreOperator
              as_user_id: "${s1_id}"
            - call: "POST /allocation/allocation-lines/${l3_id}/confirm-receipt"
              payload: {}
              as: StoreOperator
              as_user_id: "${s3_id}"
            - call: "POST /allocation/allocation-lines/${l4_id}/confirm-receipt"
              payload: {}
              as: StoreOperator
              as_user_id: "${s4_id}"
            - call: "POST /allocation/performance-snapshots"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", basis: "UNIT_WEIGHTED" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { sn1_id: $.data.id }
            - call: "POST /allocation/performance-snapshots"
              payload: { program_id: "${prog_id}", cluster_code: "SUBURBAN", basis: "UNIT_WEIGHTED" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { sn2_id: $.data.id }
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/programs/${prog_id}"
              payload: {}
              as: PlanningAdmin
          assert:
            - "Propose creates exactly 3 AllocationLines, not 4: GET /allocation/allocation-lines?run_id=${run_id} has total_count == 3 and the zero-need store 0102 gets no line at all"
            - "AllocationLine.${l1_id}.units_proposed == 26 with size_breakdown == [{S:5},{M:10},{L:8},{XL:3}], ${l3_id} == 10 with [{S:2},{M:4},{L:3},{XL:1}] and ${l4_id} == 8 with [{S:1},{M:3},{L:3},{XL:1}]"
            - "AllocationRun.${run_id}.units_proposed == 44 and unallocated_remainder_units == 0 - the pool is consumed exactly, so rung 31 (total need > 0) and rung 30 (non-empty candidate set) are both satisfied with the tightest possible margin"
            - "The commit returns 200: sum(units_proposed) 44 == receipt.units_unallocated 44, so rung 35 passes at equality rather than by slack"
            - "Rung 13 passes on every line: 6 + 0 + 26 = 32 >= pmin 12 at 0101, 2 + 10 = 12 >= 8 at 0103, and 0 + 0 + 8 = 8 >= pmin 6 at 0104 - the emptiest door clears its floor by exactly 2 units"
            - "Rung 14 passes on every line: 32 <= capacity 48, 12 <= 20 and 8 <= 20"
            - "Rung 12 passes because the committing X-User-ID u-mgr-1 differs from the proposing u-alloc-1, and rung 25 passes because each of the three stores has exactly one shelf plan whose half-open interval contains 2026-08-01"
            - "After the commit Receipt.${rcpt_id}.status == ALLOCATED with units_committed == 44 and units_unallocated == 0, and all three lines are PENDING with units_allocated == units_proposed"
            - "The three ships move units into flight without touching the floor: in_transit_units becomes 26 / 10 / 8 while on_hand_units stays 6 / 2 / 0"
            - "Each confirm-receipt is sent as StoreOperator with X-User-ID equal to its own line store, so rung 3 passes: the three calls return 200 and the lines reach RECEIVED"
            - "StorePosition.${p1_id}.on_hand_units == 32 with size_on_hand == [{S:5},{M:14},{L:10},{XL:3}], ${p3_id} == 12 with [{S:2},{M:5},{L:4},{XL:1}] and ${p4_id} == 8 with [{S:1},{M:3},{L:3},{XL:1}]; every one has in_transit_units == 0"
            - "All four positions are now COMPLETE and IN_STOCK, so Item.${item_id}.broken_store_count falls from 3 to 0, size_out_store_count == 0 and lifecycle_state re-derives BROKEN -> ACTIVE"
            - "PerformanceSnapshot.${sn1_id} (URBAN, UNIT_WEIGHTED): store_count == 2, included_position_count == 2, in_stock_pct_bp == 10000 (covered 12 + 8 over min 12 + 8), sell_through_pct_bp == 4693 (FLOOR(46 x 10000 / 98)) and allocation_accuracy_bp == 5653 (deviation |26-30| + |0-16| = 20 over sold 46)"
            - "The zero-need store 0102 still weighs on its cluster: its 16 trailing sales with 0 units allocated contribute 16 of the 20 deviation units, which is why URBAN scores worse on accuracy than it does on in-stock"
            - "PerformanceSnapshot.${sn2_id} (SUBURBAN, UNIT_WEIGHTED): in_stock_pct_bp == 10000, sell_through_pct_bp == 3548 (FLOOR(11 x 10000 / 31)) and allocation_accuracy_bp == 3637 (deviation 4 + 3 = 7 over sold 11)"
            - "AllocationProgram.${prog_id}.total_units_received == 44, total_units_committed == 44 and open_reserve_units == 0 - nothing is left on the DC floor and nothing was double-counted"
      - name: every_violation_maps_to_its_declared_code_and_status
        claim_type: violation_to_error
        grounds:
          - validations[priority:13]
          - validations[priority:14]
          - errors.ERR_PRESENTATION_MIN_NOT_MET
          - errors.ERR_FIXTURE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: presentation_minimum_safety_beats_fixture_capacity_constraint
          rationale: "Both rungs are violated by the same commit there and each is shown resolving to its own declared code and 409 status, with the run left PROPOSED and no line booked - the mapping from violation to error is asserted at the point where two candidate errors compete."
      - name: writes_must_stay_inside_one_program
        claim_type: cross_entity_validation
        grounds:
          - validations[priority:7]
          - errors.ERR_CROSS_PROGRAM_REFERENCE
        excluded_because:
          difficulty_instance: presentation_minimum_safety_beats_fixture_capacity_constraint
          rationale: "The cross-entity coupling between a line, its position and the store fixture plan is exercised there, and the program-membership arm of the same rung is already walked by the ladder instance above; a separate instance would only re-list the five write endpoints from validations[priority:7]."
      - name: temporal_windows_are_evaluated_against_the_logical_clock
        claim_type: temporal_validation
        grounds:
          - validations[priority:24]
          - validations[priority:22]
          - validations[priority:23]
        excluded_because:
          difficulty_instance: transfer_expiry_temporal_beats_insufficient_donor_units_fiscal
          rationale: "That instance pins the strict-before comparison at expires_at against a competing fiscal failure, and its two siblings cover the half-open fixture intervals and the buffered closed promo windows - all three read the same logical clock."
      - name: pool_ceilings_are_checked_against_an_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority:35]
          - calculations.receipt_unit_ledger_invariant
          - errors.ERR_RECEIPT_UNITS_EXCEEDED
        excluded_because:
          difficulty_instance: receipt_unit_ledger_survives_commit_recall_recommit_with_zero_drift
          rationale: "The aggregate form sum(line.units_proposed) <= receipt.units_unallocated is asserted there across a commit / recall / re-commit cycle, including the case where a second run alone fits but the two runs together do not."
      - name: two_rules_violated_at_once_always_answers_the_lower_priority_number
        claim_type: priority_conflict
        grounds:
          - validations[priority:9]
          - validations[priority:34]
          - validations[priority:13]
          - validations[priority:14]
          - validations[priority:24]
          - validations[priority:33]
        excluded_because:
          difficulty_instance: program_locked_state_beats_benefit_ratio_fiscal_gate
          rationale: "The P versus P+N form is the whole subject of three §1.8 instances: state beats fiscal (9 before 34), safety beats capacity (13 before 14) and temporal beats fiscal (24 before 33). Each one arranges a single call that genuinely violates BOTH rules, asserts the lower number wins, then repairs only the lower violation and asserts the higher code appears - the pairing this section would otherwise test with a weaker two-rung version."
      - name: one_parent_state_check_covers_a_whole_endpoint_family
        claim_type: cascading_validation
        grounds:
          - validations[priority:9]
          - errors.ERR_PROGRAM_LOCKED
        excluded_because:
          difficulty_instance: locked_program_blocks_decisions_but_not_line_ship_or_confirm_receipt
          rationale: "The inherited rule is applied there across the full twelve-endpoint decision family and shown NOT to reach the three logistics endpoints, which is the whole content of a cascading validation on this surface."
  # section 1.5 endpoints: CRUD, actions, sweeps and computed reads
  - section: endpoints
    instances:
      - name: detection_sweep_is_idempotent_per_position_and_re_arms_after_a_cancel
        claim_type: bulk_action
        grounds:
          - endpoints.POST /allocation/_run-assortment-detection
          - entities.AssortmentAction.fields.status
          - entities.Store.fields.status
        distinguishing_aspect: |
          A sweep endpoint is not a create endpoint: it walks every position of the program, decides for
          itself which ones to act on, and returns an array. Three consecutive sweeps over an unchanged
          dataset must therefore produce 2, 0 and 1 actions - the second is empty because both degraded
          positions already carry a PENDING action for the same (item, store), and the third re-arms only
          the pair whose action was cancelled, proving the skip is keyed on the PENDING action rather than on
          a permanent flag. The store-status filter is a second axis: the REMODEL store IS scanned and does
          raise an action, while the CLOSING store is skipped entirely, so 'eligible to be scanned' and
          'eligible to be a target' are different predicates. The sweep is also the only endpoint on this
          surface open to both Allocator and AllocationManager, and it must behave identically for each.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A, URBAN), 0102(B, URBAN), 0103(C, SUBURBAN) and 0104(D, SUBURBAN)"
            - "Shelf plans give 0101 and 0102 capacity 48 (pmin 12), 0103 capacity 20 (pmin 8) and 0104 capacity 20 (pmin 6)"
            - "SKU-1001 SEASONAL on TOP-4SZ (S 2000 / M 3500 / L 3000 / XL 1500), all four sizes core"
            - "Position 0101 holds 4 units (M 3 / L 1) -> 2 core sizes out, BROKEN"
            - "Position 0102 holds 20 units of all four sizes -> COMPLETE with headroom 48 - 20 = 28, the only eligible consolidation target"
            - "Position 0103 holds 2 units (M 2) -> 3 core sizes out, BROKEN; the store was then moved to REMODEL"
            - "Position 0104 holds 3 units (S 1 / M 1 / L 1) -> 1 core size out, SIZE_OUT_RISK; the store was then moved to CLOSING"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s3_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s4_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 4, size_on_hand: [{ size_code: "M", units: 3 }, { size_code: "L", units: 1 }], min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 48, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "M", units: 2 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p3_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s4_id}", item_id: "${item_id}", on_hand_units: 3, size_on_hand: [{ size_code: "S", units: 1 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }], min_units: 6, max_units: 20, weekly_forecast_units: 2, trailing_4wk_sales_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p4_id: $.data.id }
            - call: "POST /allocation/stores/${s3_id}/status"
              payload: { target_status: "REMODEL" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/stores/${s4_id}/status"
              payload: { target_status: "CLOSING" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
          trigger:
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/assortment-actions"
              payload: { store_id: "${s1_id}" }
              as: AllocationManager
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /allocation/assortment-actions"
              payload: { store_id: "${s3_id}" }
              as: AllocationManager
              captures: { a2_id: "$.data[0].id" }
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/assortment-actions"
              payload: { item_id: "${item_id}" }
              as: Allocator
            - call: "POST /allocation/assortment-actions/${a1_id}/cancel"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/assortment-actions"
              payload: { item_id: "${item_id}", status: "PENDING" }
              as: Allocator
            - call: "GET /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
          assert:
            - "Sweep 1 returns an array of exactly 2 AssortmentActions, ordered by (store_code ASC, sku_code ASC): the 0101 action first, then the 0103 action"
            - "The REMODEL store 0103 IS scanned and does raise an action - only ACTIVE and REMODEL positions are visited, so REMODEL is scannable even though it can never be a consolidation target"
            - "The CLOSING store 0104 raises NOTHING even though its position has a broken core size, so the array has no third element"
            - "Both actions are CONSOLIDATION with consolidation_target_store_id = 0102 (the only COMPLETE position in an ACTIVE store with enough headroom), units_at_detection 4 and 2, and broken_size_count 2 and 3"
            - "Sweep 2, run as Allocator instead of AllocationManager, returns 200 with an EMPTY array: both degraded positions already have a PENDING action for the same (item, store) pair"
            - "Sweep 2 created nothing at all - GET /allocation/assortment-actions?item_id=${item_id} still has total_count == 2 and neither existing action changed its version"
            - "After cancelling the 0101 action (status CANCELLED), sweep 3 returns exactly 1 action - a NEW row for (SKU-1001, 0101), while 0103 is still skipped because its own action is still PENDING"
            - "The skip is keyed on PENDING, not on history: the cancelled action remains CANCELLED alongside the new PENDING one, so total_count is 3 with 2 PENDING"
            - "No sweep created a TransferRecommendation: GET /allocation/transfer-recommendations?program_id=${prog_id} has total_count == 0 - detection recommends, execution moves units"
            - "The COMPLETE position at 0102 is never touched by any sweep: it has no action in any of the three responses"
            - "Item.${item_id}.lifecycle_state == BROKEN throughout - the sweep reads assortment health, it does not create it"
      - name: reads_expose_the_same_derived_values_singly_listed_and_paginated
        claim_type: computed_read
        grounds:
          - entities.StorePosition.fields.available_units
          - entities.StorePosition.fields.in_transit_units
          - entities.AllocationLine.fields.presentation_gap_units
          - endpoints.GET /allocation/store-positions
          - endpoints.GET /allocation/allocation-lines
          - complexity_profile.pagination_defaults
        distinguishing_aspect: |
          Every derived field on this surface is read-only output, and the read path is where the derivation
          rules become visible - especially the ones that are counter-intuitive. available_units subtracts
          reserved_out but NOT in_transit, so shipping 26 units to a store leaves its available_units at 6
          and its stock_status at LOW: the units are on a truck, not on the shelf. The single read, the
          filtered list read, the StoreOperator's scoped read and the paginated page must all report exactly
          the same numbers for the same row, and no GET may bump a version. presentation_gap_units is the
          other half of the point: it is frozen at propose time, so it still reads 0 after a ship that
          changed in_transit_units.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE; store 0101 has capacity 48 / pmin 12 and store 0102 has capacity 24 / pmin 8"
            - "SKU-1001 SEASONAL on TOP-4SZ; position 0101 holds 6 units (M 4 / L 2) with on_order 4, min 12, max 48, forecast 9; position 0102 holds 2 units (M 1 / L 1) with min 8, max 24, forecast 3"
            - "Needs are 9 x 4 - (6 + 0 + 4) = 26 at 0101 and 3 x 4 - 2 = 10 at 0102, and receipt ASN-E201 carries exactly 36 units"
            - "The run was proposed and committed, then ONLY the 0101 line was shipped"
            - "Pagination defaults are limit 10 (max 100, min 1) and offset 0, with total_count and has_more in the envelope"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
