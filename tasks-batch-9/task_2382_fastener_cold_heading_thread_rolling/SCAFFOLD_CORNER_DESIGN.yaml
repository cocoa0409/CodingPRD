              captures: { wire_v_read: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /production-lots"
              payload: { lot_code: "L-OCC1", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T08:00:00Z", planned_pieces: 1000, expected_wire_lot_version: "${wire_v_read}" }
              as: ProcessEngineer
              captures: { lot_1: $.data.id }
          trigger:
            - call: "POST /production-lots"
              payload: { lot_code: "L-OCC2", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T07:00:00Z", press_window_end_at: "2026-09-01T09:00:00Z", planned_pieces: 1000, expected_wire_lot_version: "${wire_v_read}" }
              as: ProcessEngineer
              captures: { stale_err: $.data.error_id }
            - call: "GET /wire-lots/${wire_id}"
              payload: {}
              as: ProcessEngineer
              captures: { wire_v_fresh: $.data.version }
            - call: "POST /production-lots"
              payload: { lot_code: "L-OCC2", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T07:00:00Z", press_window_end_at: "2026-09-01T09:00:00Z", planned_pieces: 1000, expected_wire_lot_version: "${wire_v_fresh}" }
