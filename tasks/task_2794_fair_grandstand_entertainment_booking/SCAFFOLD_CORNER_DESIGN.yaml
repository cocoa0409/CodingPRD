      - name: every_absent_parent_id_yields_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FAIR_EDITION_NOT_FOUND
          - errors.ERR_STAGE_NOT_FOUND
          - errors.ERR_TALENT_AGENT_NOT_FOUND
          - errors.ERR_ARTIST_NOT_FOUND
          - errors.ERR_OFFER_NOT_FOUND
          - errors.ERR_SHOW_BOOKING_NOT_FOUND
          - errors.ERR_TICKET_SCALE_NOT_FOUND
          - errors.ERR_PRODUCTION_ADVANCE_NOT_FOUND
          - errors.ERR_RIDER_ITEM_NOT_FOUND
          - errors.ERR_SPONSOR_NOT_FOUND
          - errors.ERR_ACTIVATION_NOT_FOUND
          - errors.ERR_SETTLEMENT_NOT_FOUND
        distinguishing_aspect: |
          All twelve declared 404 codes are separately triggerable, each on an endpoint
          its own validation row actually governs, and each returns its OWN code rather
          than a generic not-found: twelve probes, twelve distinct error_id values, all
          against an otherwise empty database.
        test_recipe:
          setup:
            - "The database is empty apart from the clock; every probe passes a syntactically valid but unissued UUID, so only the existence layer can fire."
            - "Each probe deliberately uses an endpoint listed in that error's own validation applies_to: the report path for the edition, POST /grandstand/artists for the agent, GET ?sponsor_id= for the sponsor, POST /rider-items/{id}/rule for the rider item."
