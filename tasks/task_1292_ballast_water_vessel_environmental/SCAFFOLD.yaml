  - method: POST
    path: "/vessels/{vessel_id}/drills/{drill_id}/cancel"
    description: "Cancel a scheduled drill"
    roles: [VesselMaster]
    code: 200
    input: []
    output: CrewTrainingDrill
    side_effects: ["completion_status SCHEDULED -> CANCELLED"]

  # --- Enforcement ---
  - method: GET
    path: "/vessels/{vessel_id}/enforcement-cases"
    description: "List enforcement cases"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: EnforcementCase[]
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/enforcement-cases/{case_id}/submit-response"
    description: "Operator submits response"
    roles: [ShoreComplianceOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["case.status ACTIVE -> UNDER_REVIEW", "vessel.version increments"]

  - method: POST
    path: "/vessels/{vessel_id}/enforcement-cases/{case_id}/close"
    description: "Close case (compliant or penalty)"
    roles: [FlagSurveyor]
    code: 200
    input: [penalty_assessed]
    output: EnforcementCase
    side_effects: ["case.status UNDER_REVIEW -> CLOSED_COMPLIANT or CLOSED_PENALTY", "vessel.active_enforcement_case_id = null", "vessel.compliance_posture recomputed"]

  - method: POST
    path: "/vessels/{vessel_id}/enforcement-cases/{case_id}/withdraw"
    description: "Withdraw an active case"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["case.status ACTIVE -> WITHDRAWN", "vessel.active_enforcement_case_id = null", "vessel.compliance_posture recomputed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or unrecognized"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the requested endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id does not resolve or does not belong to the ancestor chain"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity's current state does not permit the requested transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "same X-User-ID attempting both claim and verify (or record and evaluate) on the same entity"

  - id: ERR_VESSEL_FROZEN
    http: 409
    condition: "vessel.compliance_posture == FROZEN; mutating operation blocked by enforcement hold"

  - id: ERR_EVENT_OUT_OF_WINDOW
    http: 422
    condition: "BallastWaterEvent.occurred_at outside voyage window or in the future"

  - id: ERR_DISCHARGE_WITHOUT_UPTAKE
    http: 422
    condition: "DISCHARGE on tank_id with no prior UPTAKE on same tank"

  - id: ERR_EXCHANGE_TOO_CLOSE
    http: 422
    condition: "EXCHANGE_COMPLETE.distance_from_shore_nm < 3"

  - id: ERR_PLAN_REVISION_REGRESSION
    http: 422
    condition: "plan_revision not strictly greater than existing revisions for the vessel"

  - id: ERR_MULTIPLE_APPROVED_PLANS
    http: 409
    condition: "approving a plan when another is already APPROVED for the vessel without superseding"

  - id: ERR_DUPLICATE_VOYAGE_NUMBER
    http: 409
    condition: "voyage_number already in use for the vessel"

  - id: ERR_BOOK_SEALED
    http: 409
    condition: "operation targets a RecordBook with status == SEALED"

  - id: ERR_ENTRY_KIND_MISMATCH
    http: 422
    condition: "entry_kind not allowed for the book's book_kind"

  - id: ERR_TANK_BALANCE_NEGATIVE
    http: 422
    condition: "chronological per-tank balance would go negative"

  - id: ERR_VOLUME_EXCEEDS_CAPACITY
    http: 422
    condition: "BallastWaterEvent.volume_m3 exceeds vessel.ballast_capacity_m3"

  - id: ERR_SULFUR_OUT_OF_RANGE
    http: 422
    condition: "sulfur_content_pct outside [0, 5.0]"

  - id: ERR_OFFICER_REQUIRED
    http: 422
    condition: "BWMS_OPERATION drill completion requires officer_present == true"

  - id: ERR_VALIDATION
    http: 400
    condition: "generic request-body validation failure (missing required field, bad type, bad enum)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Test/operations administrator; owns test-driving endpoints only"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"

  - name: ShoreComplianceOfficer
    description: "Shore-side compliance officer; manages plans, responds to noncompliance, evaluates emissions"
    identity: "opaque"
    exclusive_operations:
      - "POST /vessels"
      - "POST /vessels/{vid}/plans* (create, submit, withdraw)"
      - "POST /vessels/{vid}/voyages/{voyage_id}/noncompliance/{id}/respond"
      - "POST /vessels/{vid}/voyages/{voyage_id}/emissions/{id}/evaluate"
      - "POST /vessels/{vid}/enforcement-cases/{id}/submit-response"
      - "POST /vessels/{vid}/voyages/{voyage_id}/determinations/recompute"
    shared_operations:
      - "POST /vessels/{vid}/voyages"
      - "POST /vessels/{vid}/record-books"
      - "POST /vessels/{vid}/drills"
      - "GET read endpoints"

  - name: VesselMaster
    description: "Ship's master; records ballast events, submits reports, claims rectifications, completes drills"
    identity: "opaque"
    exclusive_operations:
      - "POST /vessels/{vid}/voyages/{voyage_id}/depart"
      - "POST /vessels/{vid}/voyages/{voyage_id}/arrive"
      - "POST /vessels/{vid}/voyages/{voyage_id}/ballast-events"
      - "POST /vessels/{vid}/voyages/{voyage_id}/reports/{rid}/submit"
      - "POST /vessels/{vid}/deficiencies/{did}/begin-rectification"
      - "POST /vessels/{vid}/deficiencies/{did}/claim-rectified"
      - "POST /vessels/{vid}/record-books/{bid}/entries"
      - "POST /vessels/{vid}/record-books/{bid}/seal"
      - "POST /vessels/{vid}/voyages/{vid}/emissions"
      - "POST /vessels/{vid}/drills/{did}/complete"
      - "POST /vessels/{vid}/drills/{did}/cancel"
    shared_operations:
      - "POST /vessels/{vid}/voyages"
      - "POST /vessels/{vid}/record-books"
      - "POST /vessels/{vid}/drills"
      - "GET read endpoints"

  - name: FlagSurveyor
    description: "Flag-state surveyor; approves plans, acknowledges/rejects reports, evaluates and closes inspections, closes enforcement cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /vessels/{vid}/plans/{pid}/approve"
      - "POST /vessels/{vid}/voyages/{voyage_id}/reports/{rid}/acknowledge"
      - "POST /vessels/{vid}/voyages/{voyage_id}/reports/{rid}/reject"
      - "POST /vessels/{vid}/voyages/{voyage_id}/inspections/{iid}/evaluate"
      - "POST /vessels/{vid}/voyages/{voyage_id}/inspections/{iid}/close"
      - "POST /vessels/{vid}/voyages/{voyage_id}/inspections/{iid}/reopen"
      - "POST /vessels/{vid}/voyages/{voyage_id}/noncompliance/{nid}/close"
      - "POST /vessels/{vid}/enforcement-cases/{cid}/close"
      - "POST /vessels/{vid}/enforcement-cases/{cid}/withdraw"
    shared_operations:
      - "POST /vessels/{vid}/voyages/{voyage_id}/inspections (record)"
      - "POST /vessels/{vid}/voyages/{voyage_id}/determinations/recompute"
      - "GET read endpoints"

  - name: PSCOfficer
    description: "Port State Control officer; records PSC inspections, verifies/rejects deficiency rectification"
    identity: "opaque"
    exclusive_operations:
      - "POST /vessels/{vid}/deficiencies/{did}/verify"
      - "POST /vessels/{vid}/deficiencies/{did}/reject-verification"
    shared_operations:
      - "POST /vessels/{vid}/voyages/{voyage_id}/inspections (record)"
      - "GET read endpoints"
