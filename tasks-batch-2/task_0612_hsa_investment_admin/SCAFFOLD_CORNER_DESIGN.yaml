      - name: substantiate_receipt_underfunded
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_RECEIPT_UNDERFUNDED]"]
        distinguishing_aspect: "Substantiating a 50000 distribution with a 40000 VAULTED receipt returns ERR_RECEIPT_UNDERFUNDED (receipt < distribution amount)."
