              as_user_id: "u_aud_1"
          assert:
            - "${fit} == \"RETURNED\" — the incumbent dispense is in a terminal fit state before the duplicate attempt"
            - "Call 1 returns HTTP 409 with error.id == \"ERR_DUPLICATE_PLAN_CODE\""
            - "Call 2 returns HTTP 409 with error.id == \"ERR_DUPLICATE_MRN\""
            - "Call 3 returns HTTP 409 with error.id == \"ERR_DUPLICATE_SCOPE_SERIAL\" — even though the incumbent scope is a live READY row, the rule is declared to cover RETIRED rows too"
            - "Call 4 returns HTTP 409 with error.id == \"ERR_DUPLICATE_LOT_NUMBER\" — uniqueness is on lot_number alone, not on (item_type, lot_number)"
            - "Call 5 returns HTTP 409 with error.id == \"ERR_DUPLICATE_DEVICE_SERIAL\" — the RETURNED dispense still owns the serial"
            - "No new rows exist: a repeat GET /supply-lots/${lot_id} still reports item_type \"HEARING_AID\" and quantity_received 5"

