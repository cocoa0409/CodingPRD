            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000, for_sale: true, list_price_cents: 250000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "aa01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Salt Flat", medium_category: "PHOTOGRAPHY", width_cm: 100, height_cm: 70, depth_cm: 4, weight_kg: 5, year_created: 2026, declared_value_cents: 300000, for_sale: true, list_price_cents: 180000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_b_id: $.data.id } }
            - { call: "POST /artworks/${aw_b_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-16T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "aa02" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}" }
