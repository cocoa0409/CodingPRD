      - name: cass_foreign_country_forces_unmailable_despite_confirmed_dpv
        claim_type: Correct Result
        grounds: [calculations.cass_deliverability_tier, state_machines.ListRecord.cass_status.PENDING_to_UNMAILABLE]
        distinguishing_aspect: "A record with country_code 'CA' and dpv_confirmation_code 'Y' still lands UNMAILABLE, because the country clause is evaluated before the DPV mapping."
