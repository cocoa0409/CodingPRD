  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_review_version_blocks_a_second_commitment_author
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[commitment-create-stale-review]
          - errors[ERR_STALE_REVIEW_VERSION]
          - endpoints[POST /data-element-commitments]
          - entities.DataPracticeReview.fields.version
        distinguishing_aspect: |
          Authoring a commitment bumps the PARENT review's version, so a second author
          holding the version they read before the first write must be rejected with 412
          ERR_STALE_REVIEW_VERSION even though the two commitments cover different
          element_codes and could not possibly supersede each other. The retry with the
          re-read token then succeeds, and the review's version walks 1 -> 2 -> 3 with no
          increment on the refused call.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V, ASSESSMENT Application A, Teacher T, analyst AN1."
            - "Request R is triaged and review REV is created, so REV.version == 1 and the liaison reads that token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Meridian Practice Labs", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Meridian Practice", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Dana Reyes", employee_number: "EMP-7134", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_ID", "GRADE_LEVEL"], student_count_estimate: 300, grade_band_low: 6, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA", "PPRA", "STATE_ADDENDUM"], estimated_minutes: 180 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: VendorLiaison
              as_user_id: "${v_id}"
