            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "TWENTY_FIVE_PERCENT_TEST", designated_business_line: "advisory cash sweep", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 4000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /deposit-classifications"
