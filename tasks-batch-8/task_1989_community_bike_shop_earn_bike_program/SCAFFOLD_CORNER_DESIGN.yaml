            - { call: "POST /usage-logs/${u1}/void", payload: { reason: "wrong part" }, as: ProgramDirector, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /usage-logs/${u1}/void", payload: { reason: "again" }, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "GET /parts/${pt}", as: ShopCoordinator, captures: { q: $.data.quantity_on_hand } }
          assert:
            - "second void -> error_id ERR_USAGE_NOT_COMMITTED"
            - "Part.${pt}.quantity_on_hand == 5 (restored exactly once)"

