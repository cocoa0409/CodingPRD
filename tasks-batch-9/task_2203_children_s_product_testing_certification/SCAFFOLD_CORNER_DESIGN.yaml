scaffold_corner_design:

  # ===========================================================================
  # 1. ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: corner_entities_creation_applicable_rule_echoes_every_input_field
        claim_type: creation
        grounds:
          - entities.ApplicableRule
          - endpoints "POST /compliance/applicable-rules"
        distinguishing_aspect: "Plain creation semantics for the root reference entity: HTTP 201, a server-assigned id, and every submitted input field echoed back unchanged in the response body. No calculation, no state machine and no cascade participates."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/applicable-rules with rule_code LEAD-CONTENT-100, hazard_class LEAD_CONTENT, test_method_code CPSC-CH-E1002-08, limit_value 100, limit_unit PPM, limit_comparator AT_OR_BELOW, periodic_interval_months 12, base_method_fee_cents 18700, component_reliance_allowed true, severity_weight 9, as ComplianceAdministrator."
          assert:
            - "The response is HTTP 201 with success true and a non-null data.id."
            - "data.rule_code == \"LEAD-CONTENT-100\", data.hazard_class == \"LEAD_CONTENT\", data.test_method_code == \"CPSC-CH-E1002-08\", data.limit_value == 100, data.limit_unit == \"PPM\", data.periodic_interval_months == 12, data.base_method_fee_cents == 18700, data.severity_weight == 9."
            - "data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\" — both stamped from the logical clock, not from wall time."
            - "data.version == 1 on a freshly created row."

      - name: corner_entities_retrieval_single_resource_read_matches_creation_response
        claim_type: retrieval
        grounds:
          - endpoints "GET /compliance/applicable-rules/{rule_id}"
          - endpoints "GET /compliance/product-categories/{category_id}"
        distinguishing_aspect: "Read-after-write on the single-resource path: the GET body is field-for-field identical to the POST body, and the read performs no mutation (version and updated_at are unchanged after two consecutive reads)."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and create one ApplicableRule."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
          trigger:
            - "GET /compliance/applicable-rules/${rule_lead_id} as TestCoordinator, then the identical GET a second time."
          assert:
            - "Both reads return HTTP 200 with data.id == ${rule_lead_id} and every scalar field equal to the creation response."
            - "data.version == 1 on both reads and data.updated_at is unchanged: a GET is not a mutation."
            - "The read succeeds for TestCoordinator, which holds this path as a shared operation, so retrieval is not administrator-only."

      - name: corner_entities_listing_applicable_rules_pagination_and_filter_envelope
        claim_type: listing
        grounds:
          - endpoints "GET /compliance/applicable-rules"
          - response_envelope
        distinguishing_aspect: "List semantics rather than single-resource semantics: the paginated envelope keys (total_count, limit, offset, has_more) plus the hazard_class filter, exercised with three rules so that limit 2 / offset 0 and limit 2 / offset 2 partition the collection with no overlap and no gap."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Create three rules: LEAD-CONTENT-100 (LEAD_CONTENT), PHTHALATE-1000 (PHTHALATES) and SMALL-PARTS-01 (MECHANICAL_HAZARD)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "PHTHALATE-1000"
                hazard_class: "PHTHALATES"
                test_method_code: "CPSC-CH-C1001-09-4"
                limit_value: 1000
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 6
                base_method_fee_cents: 24000
                component_reliance_allowed: true
                severity_weight: 7
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "SMALL-PARTS-01"
                hazard_class: "MECHANICAL_HAZARD"
                test_method_code: "16CFR1501-SMALL-PARTS"
                limit_value: 0
                limit_unit: "COUNT"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 9500
                component_reliance_allowed: false
                severity_weight: 8
              as: ComplianceAdministrator
          trigger:
            - "GET /compliance/applicable-rules with limit 2 and offset 0 as TestCoordinator."
            - "GET /compliance/applicable-rules with limit 2 and offset 2 as TestCoordinator."
            - "GET /compliance/applicable-rules with hazard_class PHTHALATES as TestCoordinator."
          assert:
            - "The first page returns HTTP 200 with exactly 2 items, total_count == 3, limit == 2, offset == 0 and has_more == true."
            - "The second page returns exactly 1 item, total_count == 3, offset == 2 and has_more == false."
            - "The two pages together contain three distinct ids covering the whole collection: no row appears twice and none is skipped."
            - "The hazard_class PHTHALATES filter returns total_count == 1 with the single item's rule_code == \"PHTHALATE-1000\"."
            - "total_count reports the size of the filtered collection, not the size of the returned page."

      - name: corner_entities_required_fields_missing_and_unknown_enum_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - endpoints "POST /compliance/applicable-rules"
          - endpoints "POST /compliance/products"
        distinguishing_aspect: "Request-shape rejection, which sits above every business rule: a payload missing a non-optional field and a payload carrying a value outside a closed enum both fail with ERR_INVALID_REQUEST at HTTP 400 before any existence or state check runs."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/applicable-rules omitting rule_code entirely, as ComplianceAdministrator."
            - "POST /compliance/applicable-rules with hazard_class RADIOLOGICAL, a value outside the enum, as ComplianceAdministrator."
            - "POST /compliance/products with category_id set to a syntactically valid but nonexistent id AND projected_annual_units omitted, as ComplianceAdministrator."
          assert:
            - "The missing rule_code request returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" and creates no row."
            - "The out-of-enum hazard_class request returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\", proving hazard_class is a closed enum rather than free text."
            - "The malformed product request returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" and NOT 404 with \"ERR_CATEGORY_NOT_FOUND\": request-shape validation outranks existence lookup."
            - "GET /compliance/applicable-rules afterwards returns total_count == 0."

      - name: corner_entities_defaults_applied_across_eleven_optional_inputs
        claim_type: defaults
        grounds:
          - entities.ApplicableRule.fields.limit_comparator
          - entities.ProductCategory.fields.durable_infant_product
          - entities.Product.fields.testing_budget_cents
          - entities.ComponentPart.fields.accessible_to_child
          - entities.SamplingPlan.fields.resample_grace_days
          - entities.ProductionBatch.fields.label_on_product
        distinguishing_aspect: "Every optional input across six entities is omitted in one sweep, so the declared default must appear in the response rather than null. This is the only instance that asserts the default VALUES themselves; other instances always supply the fields explicitly."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/applicable-rules omitting limit_comparator and component_reliance_allowed, as ComplianceAdministrator."
            - "POST /compliance/product-categories omitting durable_infant_product, as ComplianceAdministrator."
            - "POST /compliance/products omitting testing_budget_cents, as ComplianceAdministrator."
            - "POST /compliance/products/{product_id}/component-parts omitting accessible_to_child and small_part_when_detached, as ComplianceAdministrator."
            - "POST /compliance/products/{product_id}/sampling-plans omitting resample_grace_days and baseline_units_produced, as TestCoordinator."
            - "POST /compliance/test-orders omitting expedite_requested, as TestCoordinator."
          assert:
            - "The rule reports limit_comparator == \"AT_OR_BELOW\" and component_reliance_allowed == true."
            - "The category reports durable_infant_product == false."
            - "The product reports testing_budget_cents == 2000000, certification_state == \"DRAFT\", compliance_posture == \"UNSCOPED\", required_rule_ids == [] and risk_weighted_gap_score == 0."
            - "The component part reports accessible_to_child == true and small_part_when_detached == false, and reliance_status == \"PENDING\"."
            - "The sampling plan reports resample_grace_days == 30, baseline_units_produced == 0, plan_state == \"DRAFT\" and resample_trigger == \"NONE\"."
            - "The test order reports expedite_requested == false, is_retest == false and order_state == \"SCHEDULED\"."
            - "A production batch created without the three label flags reports label_on_product == false, label_on_packaging == false, label_batch_code_printed == false and tracking_label_compliant == false."
            - "A supplier created without reliance_agreement_state reports \"NOT_ON_FILE\", and a laboratory reports operational_state \"ACTIVE\" with influence_attestation_state \"MISSING\"."

      - name: corner_entities_computed_fields_are_server_owned_and_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.Supplier.fields.certificates_issued_count
          - entities.LabAccreditation.fields.test_method_code
          - entities.ComponentPartCertificate.fields.supplier_id
          - entities.Product.fields.required_rule_ids
        distinguishing_aspect: "Computed fields specifically — values the server derives from other rows. Two flavours are separated: fields copied from a parent at creation time (LabAccreditation.test_method_code from the rule, ComponentPartCertificate.supplier_id from the part) and fields aggregated over children (Supplier.certificates_issued_count). Neither appears in any endpoint's input list, so a client-supplied value must be ignored rather than stored."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Create a lead rule with test_method_code CPSC-CH-E1002-08, a supplier, an INDEPENDENT laboratory with a current attestation, a category with an ALWAYS mapping, a product with one painted part, and scope the product onto COMPONENT_RELIANCE."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/laboratories"
              payload:
                lab_name: "Meridian Test Labs"
                accreditation_body_code: "ILAC-MRA"
                independence_class: "INDEPENDENT"
                concurrent_slot_capacity: 4
              as: ComplianceAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_lead_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 0
              as: ComplianceAdministrator
              captures: { accreditation_id: "$.data.id" }
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
          trigger:
            - "GET /compliance/lab-accreditations/${accreditation_id} as ComplianceAdministrator."
            - "GET /compliance/suppliers/${supplier_id} as ComplianceAdministrator, before and after a supplier certificate is submitted."
          assert:
            - "LabAccreditation.test_method_code == \"CPSC-CH-E1002-08\" — copied from the referenced rule even though the creation input carried only rule_id."
            - "Supplier.certificates_issued_count == 0 immediately after creation and 1 after one ComponentPartCertificate naming a part of that supplier is submitted."
            - "The submitted ComponentPartCertificate reports supplier_id equal to the owning part's supplier_id, which the SupplierUser never sent in the payload."
            - "Product.required_rule_ids is [] while the product is DRAFT and becomes a non-empty array only after submit-for-certification recomputes it."

      - name: corner_entities_system_fields_are_stamped_from_the_logical_clock_and_request_identity
        claim_type: system_fields
        grounds:
          - entities.TestOrder.fields.ordered_by_user_id
          - entities.TestOrder.fields.reported_at
          - entities.SamplingPlan.fields.activated_at
          - entities.MaterialChangeEvent.fields.occurred_at
        distinguishing_aspect: "System fields as distinct from computed fields: these are stamped from request context — the logical clock and the X-User-ID header — rather than derived from other rows. The clock is moved between two writes so that two timestamps on the same aggregate differ by a known amount, which no wall-clock implementation could reproduce."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z, then build the canonical single-rule product with an active INITIAL plan, booking the plan activation at that instant."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/laboratories"
              payload:
                lab_name: "Meridian Test Labs"
                accreditation_body_code: "ILAC-MRA"
                independence_class: "INDEPENDENT"
                concurrent_slot_capacity: 4
              as: ComplianceAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "POST /compliance/laboratories/${lab_id}/independence-attestations"
              payload: { attestation_valid_through: "2027-01-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_lead_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 0
              as: ComplianceAdministrator
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "FULL_PRODUCT_TEST" }
              as: TestCoordinator
            - call: "POST /compliance/products/${product_id}/sampling-plans"
              payload: { plan_type: "INITIAL" }
              as: TestCoordinator
              captures: { plan_id: "$.data.id" }
            - call: "POST /compliance/sampling-plans/${plan_id}/activate"
              payload: {}
              as: TestCoordinator
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_lead_id}"
                sample_count: 1
                window_start: "2026-08-02T00:00:00Z"
                window_end: "2026-08-09T00:00:00Z"
              as: TestCoordinator
              as_user_id: "coordinator-ibarra"
              captures: { order_id: "$.data.id" }
          trigger:
            - "Advance the clock: POST /compliance/_clock/set_current_utc to 2026-08-03T00:00:00Z as ComplianceAdministrator."
            - "POST /compliance/test-orders/${order_id}/start-testing as LaboratoryUser (user lab-user-meridian), then POST /compliance/test-orders/${order_id}/report-result with measured_value 40 as the same user."
            - "POST /compliance/material-change-events with subject_type PRODUCT and change_kind PACKAGING_ONLY as ComplianceAdministrator (user admin-oyelaran)."
          assert:
            - "SamplingPlan.activated_at == \"2026-08-01T00:00:00Z\" — the clock instant at activation, not at plan creation and not the later clock value."
            - "TestOrder.ordered_by_user_id == \"coordinator-ibarra\", taken from the X-User-ID header of the creation request and never from the payload."
            - "TestOrder.reported_at == \"2026-08-03T00:00:00Z\" and reported_by_user_id == \"lab-user-meridian\"; reported_at is strictly later than SamplingPlan.activated_at by exactly two days."
            - "MaterialChangeEvent.occurred_at == \"2026-08-03T00:00:00Z\" and recorded_by_user_id == \"admin-oyelaran\"."
            - "No system field is settable from the request body: sending order_state, reported_at or occurred_at in a payload leaves the server-stamped value in place."

      - name: corner_entities_type_constraints_enum_closure_and_non_negative_integers
        claim_type: type_constraints
        grounds:
          - entities.ApplicableRule.fields.severity_weight
          - entities.ProductionBatch.fields.quantity
          - entities.TestOrder.fields.sample_count
          - entities.ChildrensProductCertificate.fields.manufacture_date_month
        distinguishing_aspect: "Field-level type and range constraints as opposed to missing-field checks: a negative integer where the domain requires a positive count, a zero sample_count, and a manufacture_date_month that is not YYYY-MM. Each is a well-formed JSON value of the right primitive type that still violates the declared constraint."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and create a rule, a category and a product."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
          trigger:
            - "POST /compliance/applicable-rules with severity_weight -3, as ComplianceAdministrator."
            - "POST /compliance/product-categories with sampling_floor_units -1, as ComplianceAdministrator."
            - "POST /compliance/test-orders with sample_count 0, as TestCoordinator."
            - "POST /compliance/products/{product_id}/certificates with manufacture_date_month \"August 2026\", as CertificationOfficer."
          assert:
            - "Every one of the four requests returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\"."
            - "None of them creates a row: the respective list endpoints report total_count unchanged."
            - "A severity_weight of 0 is accepted where -3 is refused, so the constraint is non-negativity rather than a blanket positivity rule on the field."
            - "manufacture_date_month \"2026-08\" is accepted by the same endpoint, isolating the format as the cause of the rejection."

      - name: corner_entities_material_change_event_is_append_only_with_no_version_column
        claim_type: immutability
        grounds:
          - entities.MaterialChangeEvent
          - endpoints "GET /compliance/material-change-events/{event_id}"
        distinguishing_aspect: "The only entity in the model declared with common_fields false: MaterialChangeEvent carries id and created_at but NO updated_at and NO version, and the endpoint catalogue exposes no mutator for it. Every other entity has a version that some endpoint increments, so this is the one row shape where absence of a field is the claim."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build a product with one component part."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
              captures: { part_id: "$.data.id" }
          trigger:
            - "POST /compliance/material-change-events with product_id ${product_id}, subject_type PRODUCT, change_kind PACKAGING_ONLY and a description, as ComplianceAdministrator."
            - "POST /compliance/material-change-events a second time with the identical payload, as ComplianceAdministrator."
            - "GET /compliance/material-change-events filtered by product_id ${product_id} as ComplianceAdministrator."
          assert:
            - "Each creation returns HTTP 201 with a distinct data.id and data.created_at == \"2026-08-01T00:00:00Z\"."
            - "Neither response carries a version field or an updated_at field — the row shape is id plus created_at plus the declared columns."
            - "The identical second payload is stored as a SECOND row rather than deduplicated or updating the first: the list reports total_count == 2."
            - "Product.material_change_count == 2, so the append-only log and the parent counter stay in step."
            - "No endpoint in the catalogue accepts a material-change-event id for mutation: the only paths are the POST collection, the single-resource GET and the list GET."

      - name: corner_entities_parent_relationships_child_creation_is_scoped_by_path_parent
        claim_type: parent_relationships
        grounds:
          - entities.ComponentPart.fields.product_id
          - entities.SamplingPlan.fields.product_id
          - endpoints "POST /compliance/products/{product_id}/component-parts"
          - endpoints "GET /compliance/component-parts"
        distinguishing_aspect: "Sub-resource creation semantics: the parent id comes from the URL path and is never a payload field, so the child's FK is set from the route. Two sibling products prove the scoping — each product's list shows only its own parts — and the reverse-reachability path for the FK is the filtered list, not a nested collection GET."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; create one category, one supplier and TWO products under that category."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_alpha_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 95"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_beta_id: "$.data.id" }
          trigger:
            - "POST /compliance/products/${product_alpha_id}/component-parts twice (shell and grip) as ComplianceAdministrator."
            - "POST /compliance/products/${product_beta_id}/component-parts once (shell) as ComplianceAdministrator."
            - "GET /compliance/component-parts filtered by product_id ${product_alpha_id}, then by product_id ${product_beta_id}, then by supplier_id ${supplier_id}, as ComplianceAdministrator."
          assert:
            - "Each created part reports product_id equal to the id in the request path, which never appeared in the payload."
            - "The list filtered by product_id ${product_alpha_id} reports total_count == 2 and the list filtered by ${product_beta_id} reports total_count == 1."
            - "The list filtered by supplier_id ${supplier_id} reports total_count == 3, so the same child is reachable from either of its two FK parents."
            - "GET /compliance/products filtered by category_id ${category_id} reports total_count == 2, closing the reverse path from ProductCategory to Product."

      - name: corner_entities_category_rule_mapping_is_a_junction_row_unique_on_its_pair
        claim_type: many_to_many_junction_entities
        grounds:
          - entities.CategoryRuleMapping
          - errors.ERR_MAPPING_DUPLICATE
          - endpoints "GET /compliance/category-rule-mappings"
        distinguishing_aspect: "The graph topology's junction entity: CategoryRuleMapping carries no business payload beyond its two FKs plus an applicability predicate, and the (category_id, rule_id) pair is unique while each side may repeat freely. Traversal works in both directions from the same list endpoint, which is what makes the relationship many-to-many rather than two independent one-to-many links."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; create two rules (lead, phthalate) and two categories (ride-on toy, full-size crib)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "PHTHALATE-1000"
                hazard_class: "PHTHALATES"
                test_method_code: "CPSC-CH-C1001-09-4"
                limit_value: 1000
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 6
                base_method_fee_cents: 24000
                component_reliance_allowed: true
                severity_weight: 7
              as: ComplianceAdministrator
              captures: { rule_phthalate_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_toy_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "CRIB-FULL"
                display_name: "Full-size crib"
                durable_infant_product: true
                intended_age_max_months: 24
                sampling_floor_units: 4
              as: ComplianceAdministrator
              captures: { category_crib_id: "$.data.id" }
          trigger:
            - "Create three mappings as ComplianceAdministrator: (toy, lead, ALWAYS), (toy, phthalate, IF_PLASTICIZED_PART) and (crib, lead, ALWAYS)."
            - "Attempt a fourth mapping repeating (toy, lead) with applicability_condition IF_PAINTED_SURFACE, as ComplianceAdministrator."
            - "GET /compliance/category-rule-mappings filtered by category_id ${category_toy_id}, then by rule_id ${rule_lead_id}, as ComplianceAdministrator."
          assert:
            - "The three distinct pairs are created with HTTP 201 and mapping_state == \"ACTIVE\" by default."
            - "The repeated (toy, lead) pair returns HTTP 409 with error_id == \"ERR_MAPPING_DUPLICATE\" even though the applicability_condition differs — uniqueness is on the pair, not on the whole row."
            - "The list filtered by category_id ${category_toy_id} reports total_count == 2 (one category, two rules)."
            - "The list filtered by rule_id ${rule_lead_id} reports total_count == 2 (one rule, two categories), so the junction is traversable from both ends."
            - "Each mapping row exposes exactly the two FKs plus applicability_condition, effective_from and mapping_state — it holds no product-level data."

      - name: corner_entities_certificate_supersession_chain_is_a_single_parent_acyclic_link
        claim_type: cycle_constraints
        grounds:
          - entities.ChildrensProductCertificate.fields.supersedes_certificate_id
          - endpoints "GET /compliance/certificates"
        distinguishing_aspect: "The one self-referential edge in the model. supersedes_certificate_id is computed rather than client-supplied, points only at the immediately previous ISSUED certificate of the same product, and is null on the first certificate — so the structure is a chain with no cycle and no forward pointer. A client cannot introduce a cycle because the field is not in any input list."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED certificate, then void it and issue a replacement, so a two-link supersession chain exists on one product."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read both certificates via GET /compliance/certificates filtered by product_id, as CertificationOfficer."
            - "Read the replacement via GET /compliance/certificates filtered by supersedes_certificate_id set to the first certificate's id, as CertificationOfficer."
          assert:
            - "The first certificate reports supersedes_certificate_id == null."
            - "The replacement certificate reports supersedes_certificate_id equal to the first certificate's id."
            - "The first certificate's own supersedes_certificate_id is still null after the replacement exists: the link is set on the newer row only and the chain never points forward."
            - "The list filtered by supersedes_certificate_id returns total_count == 1, giving the reverse traversal of the self-referential FK."
            - "supersedes_certificate_id appears in no endpoint input list, so no request can point a certificate at itself or close a cycle."

      - name: corner_entities_material_change_event_polymorphic_subject_requires_matching_part
        claim_type: polymorphic_reference
        grounds:
          - entities.MaterialChangeEvent.fields.subject_type
          - entities.MaterialChangeEvent.fields.component_part_id
          - errors.ERR_PART_SUBJECT_MISMATCH
        distinguishing_aspect: "The model's polymorphic reference: subject_type discriminates whether component_part_id must be present. Both directions of the pairing are wrong in a different way — COMPONENT_PART without a part id, and PRODUCT with a part id supplied — and a third case is a part that belongs to a different product than the named product_id."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; create a category, a supplier and TWO products, each with one component part."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_alpha_id: "$.data.id" }
            - call: "POST /compliance/products/${product_alpha_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
              captures: { part_alpha_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 95"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_beta_id: "$.data.id" }
            - call: "POST /compliance/products/${product_beta_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
              captures: { part_beta_id: "$.data.id" }
          trigger:
            - "POST /compliance/material-change-events with product_id ${product_alpha_id}, subject_type COMPONENT_PART, change_kind SUPPLIER_SUBSTITUTION and NO component_part_id, as ComplianceAdministrator."
            - "POST /compliance/material-change-events with product_id ${product_alpha_id}, subject_type COMPONENT_PART, change_kind SUPPLIER_SUBSTITUTION and component_part_id ${part_beta_id} — a part of the other product — as ComplianceAdministrator."
            - "POST /compliance/material-change-events with product_id ${product_alpha_id}, subject_type PRODUCT, change_kind PACKAGING_ONLY and component_part_id ${part_alpha_id} supplied anyway, as ComplianceAdministrator."
            - "POST /compliance/material-change-events with product_id ${product_alpha_id}, subject_type COMPONENT_PART, change_kind SUPPLIER_SUBSTITUTION and component_part_id ${part_alpha_id}, as ComplianceAdministrator."
          assert:
            - "The COMPONENT_PART event with no component_part_id returns HTTP 422 with error_id == \"ERR_PART_SUBJECT_MISMATCH\"."
            - "The COMPONENT_PART event naming ${part_beta_id} returns HTTP 422 with error_id == \"ERR_PART_SUBJECT_MISMATCH\": the part must belong to the named product, so the discriminator is checked against the FK graph and not merely for presence."
            - "The PRODUCT-subject event that also supplies a component_part_id returns HTTP 422 with error_id == \"ERR_PART_SUBJECT_MISMATCH\", so the pairing is exact in both directions."
            - "The well-formed COMPONENT_PART event returns HTTP 201 with subject_type == \"COMPONENT_PART\" and component_part_id == ${part_alpha_id}."
            - "Product.material_change_count == 1 at the end: the three rejected requests appended nothing to the immutable log."

      - name: corner_entities_not_found_returns_the_entity_specific_code_for_each_read_path
        claim_type: not_found
        grounds:
          - errors.ERR_RULE_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_TEST_ORDER_NOT_FOUND
          - errors.ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND
        distinguishing_aspect: "Existence lookup on the READ paths specifically, and the fact that the catalogue carries a distinct code per entity rather than one generic 404. A single unknown id is submitted to four different single-resource GETs and each returns its own entity's code, so a shared ERR_NOT_FOUND implementation would fail."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z. Create no business rows at all, so every id is unknown."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "GET /compliance/applicable-rules/00000000-0000-0000-0000-0000000000ff as ComplianceAdministrator."
            - "GET /compliance/products/00000000-0000-0000-0000-0000000000ff as ComplianceAdministrator."
            - "GET /compliance/test-orders/00000000-0000-0000-0000-0000000000ff as ComplianceAdministrator."
            - "GET /compliance/material-change-events/00000000-0000-0000-0000-0000000000ff as ComplianceAdministrator."
          assert:
            - "All four responses are HTTP 404 with success false and a null data payload."
            - "The error_id values are respectively \"ERR_RULE_NOT_FOUND\", \"ERR_PRODUCT_NOT_FOUND\", \"ERR_TEST_ORDER_NOT_FOUND\" and \"ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND\" — four distinct codes for the same shape of mistake."
            - "The corresponding list endpoints return HTTP 200 with total_count == 0 rather than 404: an empty collection is not a not-found condition."

  # ===========================================================================
  # 2. STATE MACHINES
  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_state_machines_initial_states_of_all_nine_machines_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.Product
          - state_machines.TestOrder
          - state_machines.ChildrensProductCertificate
          - state_machines.SamplingPlan
          - state_machines.ProductionBatch
          - state_machines.LabAccreditation
          - state_machines.ComponentPartCertificate
          - state_machines.ComponentPart
          - state_machines.NoncomplianceCase
        distinguishing_aspect: "Only the declared initial state of every machine, read off the creation response before any transition is attempted. The certificate is the interesting case because it starts in a PAIR of states (issuance_status DRAFT and accompaniment_status NOT_FURNISHED) and the noncompliance case is the interesting case because it has no creation endpoint at all — it is born OPEN from a failing report."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build the canonical single-rule product through to a first certificate and a first production batch, plus one supplier certificate on the reliance path of a second product."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read the creation response of each entity as it is created, and read the NoncomplianceCase created by a failing report via GET /compliance/noncompliance-cases."
          assert:
            - "Product.certification_state == \"DRAFT\" on creation, with compliance_posture == \"UNSCOPED\"."
            - "TestOrder.order_state == \"SCHEDULED\" on creation — a booked order is not IN_TESTING until the laboratory starts it."
            - "ChildrensProductCertificate reports issuance_status == \"DRAFT\" AND accompaniment_status == \"NOT_FURNISHED\" on creation: both axes start together."
            - "SamplingPlan.plan_state == \"DRAFT\", ProductionBatch.distribution_state == \"HELD\", LabAccreditation.accreditation_state == \"ACCREDITED\", ComponentPartCertificate.reliance_state == \"SUBMITTED\", ComponentPart.reliance_status == \"PENDING\"."
            - "NoncomplianceCase.case_state == \"OPEN\" with retest_round_count == 0 and scope_variant == \"BATCH_SCOPED\" on the row created by the failing report; no endpoint creates a case directly."

      - name: corner_state_machines_valid_transition_walks_the_full_product_lifecycle_to_certified
        claim_type: valid_transition
        grounds:
          - state_machines.Product.DRAFT_to_SCOPED
          - state_machines.Product.SCOPED_to_FULL_TEST_PROGRAM
          - state_machines.Product.FULL_TEST_PROGRAM_to_EVIDENCE_COMPLETE
          - state_machines.Product.EVIDENCE_COMPLETE_to_CERTIFIED
        distinguishing_aspect: "The forward happy path only, asserting each intermediate state in order rather than just the end state. The SCOPED -> FULL_TEST_PROGRAM hop is a system event with no endpoint of its own, so the assertion is that submit-for-certification lands the product two states forward in one request."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build the canonical single-rule product with one painted part, an active INITIAL plan and an accredited independent laboratory."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/products/{product_id}/submit-for-certification with evidence_path FULL_PRODUCT_TEST as TestCoordinator."
            - "Book, start and report PASS on one order covering the single required rule."
            - "Create and then POST /compliance/certificates/{certificate_id}/issue as CertificationOfficer (user officer-vale)."
          assert:
            - "Immediately after submit-for-certification the product reports certification_state == \"FULL_TEST_PROGRAM\", not \"SCOPED\": the guarded system hop runs inside the same request."
            - "required_rule_ids is non-empty at that point and compliance_posture == \"RESTRICTED\" because the gap score is above zero."
            - "After the PASS report the product reports certification_state == \"EVIDENCE_COMPLETE\", risk_weighted_gap_score == 0 and compliance_posture == \"CLEARED\"."
            - "After issuance the product reports certification_state == \"CERTIFIED\" and the certificate reports issuance_status == \"ISSUED\" with a non-null issued_at equal to the logical clock."
            - "Product.version has increased on each of the three transitions, so every hop is a real write."

      - name: corner_state_machines_invalid_transitions_rejected_with_the_entity_state_error
        claim_type: invalid_transitions
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_ORDER_STATE_INVALID
        distinguishing_aspect: "Backward and out-of-order hops on five different machines in one sweep, each rejected with that entity's own state error rather than a shared conflict code: report-result before start-testing, activate an already-active plan, rescind a batch that was never released, close a case that is still OPEN, and furnish a certificate that has not been issued."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build the canonical product with an active plan, one SCHEDULED order, one DRAFT certificate, one HELD batch and one OPEN noncompliance case."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/test-orders/{order_id}/report-result with measured_value 40 as LaboratoryUser while the order is still SCHEDULED."
            - "POST /compliance/sampling-plans/{plan_id}/activate as TestCoordinator on an already ACTIVE plan."
            - "POST /compliance/production-batches/{batch_id}/rescind-release as DistributionManager on a HELD batch."
            - "POST /compliance/noncompliance-cases/{case_id}/close as CertificationOfficer while the case is OPEN."
            - "POST /compliance/certificates/{certificate_id}/furnish as DistributionManager while issuance_status is DRAFT."
          assert:
            - "The premature report returns HTTP 409 with error_id == \"ERR_ORDER_STATE_INVALID\" and the order stays SCHEDULED with measured_value null."
            - "The repeated activation returns HTTP 409 with error_id == \"ERR_PLAN_STATE_INVALID\"."
            - "The rescind on a held batch returns HTTP 409 with error_id == \"ERR_BATCH_STATE_INVALID\" and release_rescind_count stays 0."
            - "The premature close returns HTTP 409 with error_id == \"ERR_CASE_STATE_INVALID\" and closed_by_user_id stays null."
            - "The premature furnish returns HTTP 409 with error_id == \"ERR_CERTIFICATE_STATE_INVALID\" and accompaniment_status stays \"NOT_FURNISHED\"."
            - "Every rejected request leaves the target row's version unchanged."

      - name: corner_state_machines_precondition_enforcement_on_certificate_issuance
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ChildrensProductCertificate.DRAFT_to_ISSUED
          - validations[priority=23]
          - validations[priority=24]
          - errors.ERR_CERTIFICATE_CONTENT_INCOMPLETE
        distinguishing_aspect: "Preconditions that are NOT about the mover's own state: issuance is refused while required certificate content is incomplete and while the owning product's posture is not CLEARED, even though issuance_status is a perfectly legal DRAFT. This separates the state check (priority 12) from the substantive gates (priorities 23 and 24) on the same transition."
        test_recipe:
          setup:
            - "Reach an EVIDENCE_COMPLETE product with a DRAFT certificate created with all seven content slots, and a second product whose certificate is created while a noncompliance case is open."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Attempt POST /compliance/products/{product_id}/certificates omitting testing_place, as CertificationOfficer."
            - "POST /compliance/certificates/{certificate_id}/issue on a certificate whose product has an OPEN noncompliance case, as CertificationOfficer (user officer-vale)."
            - "POST /compliance/certificates/{certificate_id}/issue on the complete certificate of the CLEARED product, as CertificationOfficer (user officer-vale)."
          assert:
            - "The certificate created without testing_place either fails request-shape validation with \"ERR_INVALID_REQUEST\", or, if accepted, reports content_completeness_pct == 85 and its issuance returns HTTP 422 with error_id == \"ERR_CERTIFICATE_CONTENT_INCOMPLETE\"."
            - "Issuance against a product with an OPEN case returns HTTP 422 with error_id == \"ERR_PRODUCT_POSTURE_NOT_CLEARED\" — the certificate's own axis state was legal."
            - "The issuance on the CLEARED product with content_completeness_pct == 100 returns HTTP 200 with issuance_status == \"ISSUED\"."
            - "Each refusal leaves issuance_status == \"DRAFT\" and issued_at null."

      - name: corner_state_machines_side_effect_execution_on_plan_activation_stamps_and_sizes
        claim_type: side_effect_execution
        grounds:
          - state_machines.SamplingPlan.DRAFT_to_ACTIVE
          - calculations.sampling_plan_required_sample_size
          - calculations.periodic_retest_due_date
        distinguishing_aspect: "One transition's complete side-effect set asserted field by field: activation stamps activated_at, runs the sizing calculation into units_authorized and units_available, computes periodic_due_at, and increments version — four writes from one request, none of which the client supplied."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build a product with projected_annual_units 2000 in a non-durable category with sampling_floor_units 1 and one ALWAYS-mapped rule with periodic_interval_months 12; scope onto FULL_PRODUCT_TEST and create a DRAFT INITIAL plan."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/sampling-plans/{plan_id}/activate as TestCoordinator."
          assert:
            - "The response reports plan_state == \"ACTIVE\" and activated_at == \"2026-08-01T00:00:00Z\"."
            - "units_authorized == 4 (base 3 plus ceil(2000/2500) = 1, one rule, non-durable), units_committed == 0 and units_available == 4."
            - "periodic_due_at == \"2027-08-01T00:00:00Z\" — the activation instant plus the strictest periodic_interval_months of 12."
            - "version has incremented from 1 to 2, and no other plan of the product changed."
            - "The DRAFT plan before activation reported units_authorized == 0 and periodic_due_at == null, so all four values are products of the transition rather than of creation."

      - name: corner_state_machines_terminal_state_lockdown_archived_product_and_finished_orders
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Product.CERTIFIED_to_ARCHIVED
          - errors.ERR_PRODUCT_ARCHIVED
          - state_machines.TestOrder
        distinguishing_aspect: "Terminal states specifically: ARCHIVED is the Product machine's only terminal state and every subsequent write against that aggregate is refused with a dedicated code, while the TestOrder machine has FOUR terminal states and a CANCELLED order refuses even the operation that would normally be legal from its predecessor state."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED and FURNISHED certificate, one CANCELLED order and one REPORTED_PASS order."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/products/{product_id}/archive as ComplianceAdministrator."
            - "POST /compliance/products/{product_id}/sampling-plans as TestCoordinator after archiving."
            - "POST /compliance/products/{product_id}/production-batches as DistributionManager after archiving."
            - "POST /compliance/test-orders/{cancelled_order_id}/start-testing as LaboratoryUser, and POST /compliance/test-orders/{passed_order_id}/cancel as TestCoordinator."
          assert:
            - "Archiving returns HTTP 200 with certification_state == \"ARCHIVED\" and compliance_posture == \"UNSCOPED\" by branch 1 of product_compliance_posture."
            - "Both post-archive writes on the product return HTTP 409 with error_id == \"ERR_PRODUCT_ARCHIVED\"."
            - "A second POST /compliance/products/{product_id}/archive also returns HTTP 409 with error_id == \"ERR_PRODUCT_ARCHIVED\": there is no transition out of the terminal state, including to itself."
            - "start-testing on the CANCELLED order returns HTTP 409 with error_id == \"ERR_ORDER_STATE_INVALID\"."
            - "cancel on the REPORTED_PASS order returns HTTP 409 with error_id == \"ERR_ORDER_STATE_INVALID\", so a completed order cannot be walked back to release its sample units."
            - "GET /compliance/products/{product_id} still succeeds after archiving: reads are never locked down, only writes."

      - name: corner_state_machines_idempotency_repeated_action_requests_do_not_double_apply
        claim_type: idempotency
        grounds:
          - state_machines.ChildrensProductCertificate.DRAFT_to_ISSUED
          - state_machines.ProductionBatch.HELD_to_RELEASED
          - errors.ERR_BATCH_STATE_INVALID
        distinguishing_aspect: "Repeat-submission behaviour on action endpoints that have already fired: the second call is refused by the state guard rather than silently succeeding, and — the load-bearing part — no side effect runs a second time, so issued_at is not restamped and the distribution ledger does not double-count."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED, FURNISHED certificate and one RELEASED batch of 300 units, all at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Advance the clock to 2026-08-10T00:00:00Z."
            - "POST /compliance/certificates/{certificate_id}/issue a second time as CertificationOfficer (user officer-vale)."
            - "POST /compliance/production-batches/{batch_id}/release a second time as DistributionManager."
            - "POST /compliance/certificates/{certificate_id}/furnish a second time as DistributionManager."
          assert:
            - "The repeated issue returns HTTP 409 with error_id == \"ERR_CERTIFICATE_STATE_INVALID\" and issued_at is STILL \"2026-08-01T00:00:00Z\", not restamped to the advanced clock."
            - "The repeated release returns HTTP 409 with error_id == \"ERR_BATCH_STATE_INVALID\", and Product.units_released is still 300 rather than 600."
            - "The repeated furnish returns HTTP 409 with error_id == \"ERR_CERTIFICATE_STATE_INVALID\" and accompaniment_status stays \"FURNISHED\"."
            - "Each target row's version is unchanged by the repeated call, so a refused repeat is not a write."

      - name: corner_state_machines_cyclic_batch_hold_release_stop_loop_terminates_in_destroyed
        claim_type: cyclic_loop_termination
        grounds:
          - state_machines.ProductionBatch.RELEASED_to_HELD
          - state_machines.ProductionBatch.STOP_DISTRIBUTION_to_HELD
          - state_machines.ProductionBatch.HELD_to_DESTROYED
        distinguishing_aspect: "The ProductionBatch machine's cycle, which is a different loop from the NoncomplianceCase retest cycle covered in the difficulty design: HELD -> RELEASED -> HELD is one loop and HELD -> STOP_DISTRIBUTION -> HELD is another, both re-entering the same node from different neighbours. The claim is that the loop can be traversed more than once, that the loop counter release_rescind_count is monotonic, and that the only exit is the terminal DESTROYED node reached by case escalation."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED and FURNISHED certificate, one batch of 300 units, and a noncompliance case that can be driven to escalation on a second product rule."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Traverse the release loop twice: release, rescind-release, release, rescind-release, all as DistributionManager."
            - "Enter the stop loop: open a case from a failing retest, POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution with scope_variant BATCH_SCOPED as DistributionManager, then drive the case to CORRECTIVE_ACTION_APPROVED and POST /compliance/noncompliance-cases/{case_id}/close as CertificationOfficer."
            - "Escalate a later case past MAX_RETEST_ROUNDS so the batch reaches DESTROYED."
          assert:
            - "After the two release/rescind loops the batch reports distribution_state == \"HELD\" and release_rescind_count == 2 — the node is re-entered but the counter never resets."
            - "issue-stop-distribution moves the batch to \"STOP_DISTRIBUTION\" and case closure returns it to \"HELD\", so HELD is reachable from two different predecessors."
            - "Release is legal again after the stop loop closes, proving the cycle did not latch the batch out of the release path."
            - "Once the batch reaches \"DESTROYED\", release, rescind-release and tracking-label all return HTTP 409 with error_id == \"ERR_BATCH_STATE_INVALID\": the loop has exactly one exit and it is terminal."
            - "At every observation the four Product unit buckets still sum to the total produced quantity."

      - name: corner_state_machines_guarded_fork_evidence_path_selects_one_of_two_successor_states
        claim_type: guarded_transitions
        grounds:
          - state_machines.Product.SCOPED_to_EVIDENCE_RELIANCE
          - state_machines.Product.SCOPED_to_FULL_TEST_PROGRAM
          - entities.Product.fields.evidence_path
          - errors.ERR_EVIDENCE_PATH_MISMATCH
        distinguishing_aspect: "A guard rather than a cascade: two transitions share the same source state and the same trigger, and the evidence_path submitted at submit-for-certification decides which one fires. The guard is then shown to be sticky — the unchosen branch's operations are refused afterwards with ERR_EVIDENCE_PATH_MISMATCH — so the fork is a commitment and not a hint."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build TWO products under the same category, each with one painted part from a supplier whose reliance_agreement_state is ON_FILE."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/products/{product_alpha_id}/submit-for-certification with evidence_path COMPONENT_RELIANCE as TestCoordinator."
            - "POST /compliance/products/{product_beta_id}/submit-for-certification with evidence_path FULL_PRODUCT_TEST as TestCoordinator."
            - "On the beta product, submit a supplier certificate and attempt POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation with reliance_decision RELY as CertificationOfficer."
          assert:
            - "The alpha product reports certification_state == \"EVIDENCE_RELIANCE\" and the beta product reports \"FULL_TEST_PROGRAM\" — same source state, same trigger, different successors selected purely by the guard."
            - "Both products report the same required_rule_ids, so the fork is driven by evidence_path and not by rule identification."
            - "Recording reliance on the FULL_PRODUCT_TEST product returns HTTP 422 with error_id == \"ERR_EVIDENCE_PATH_MISMATCH\"."
            - "The alpha product's parts can reach reliance_status \"VALID\" while the beta product's parts stay \"PENDING\" for its whole lifecycle."

      - name: corner_state_machines_side_effect_bubbles_up_from_report_to_plan_and_product
        claim_type: side_effect_execution
        grounds:
          - state_machines.TestOrder.IN_TESTING_to_REPORTED_PASS
          - state_machines.SamplingPlan.RESAMPLE_DUE_to_ACTIVE
          - calculations.product_risk_weighted_gap_score
        distinguishing_aspect: "A bubble-UP side effect rather than a cascade DOWN: one write on a leaf TestOrder updates its SamplingPlan parent (RESAMPLE_DUE back to ACTIVE, last_verified_at restamped, periodic_due_at recomputed) and its Product grandparent (gap score and posture), with no write addressed to either. This is the upward direction of the same trigger the difficulty design exercises downward."
        test_recipe:
          setup:
            - "Build the canonical single-rule product with an ACTIVE plan; drive the plan to RESAMPLE_DUE by advancing the clock past periodic_due_at and running a periodic review."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book, start and report PASS at measured_value 40 on one order under the RESAMPLE_DUE plan, as TestCoordinator then LaboratoryUser (user lab-user-meridian)."
          assert:
            - "The order response reports order_state == \"REPORTED_PASS\" and result == \"PASS\"."
            - "Without any request naming the plan, SamplingPlan.plan_state has returned to \"ACTIVE\", resample_trigger is back to \"NONE\", and last_verified_at equals the report instant."
            - "SamplingPlan.periodic_due_at has been recomputed forward from the new last_verified_at rather than left at its earlier value."
            - "Product.risk_weighted_gap_score == 0 and compliance_posture == \"CLEARED\" without any request naming the product."
            - "SamplingPlan.version and Product.version both incremented, confirming the parents were genuinely written."

      - name: corner_state_machines_supersession_side_effects_retire_the_previous_plan_and_certificate
        claim_type: side_effect_execution
        grounds:
          - state_machines.SamplingPlan.ACTIVE_to_SUPERSEDED
          - state_machines.ChildrensProductCertificate.ISSUED_to_SUPERSEDED
          - entities.ChildrensProductCertificate.fields.supersedes_certificate_id
        distinguishing_aspect: "Cross-entity side effects of the same shape on two different machines: activating a newer plan of the same product and plan_type retires the older plan, and issuing a newer certificate retires the older one and links the two rows. In both cases the retiring write targets the NEW row and the OLD row changes state as a consequence, which is the opposite direction from a parent-to-child cascade."
        test_recipe:
          setup:
            - "Build the canonical product with an ACTIVE INITIAL plan and an ISSUED certificate."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Create a second INITIAL plan on the same product and POST /compliance/sampling-plans/{new_plan_id}/activate as TestCoordinator."
            - "Void or withdraw the first certificate's successor path as required, then create and issue a second certificate on the same product as CertificationOfficer (user officer-vale)."
          assert:
            - "After the second activation the first plan reports plan_state == \"SUPERSEDED\" and the second reports \"ACTIVE\"; only one ACTIVE plan per (product_id, plan_type) exists."
            - "GET /compliance/sampling-plans filtered by product_id and plan_state ACTIVE returns total_count == 1."
            - "After the second issuance the first certificate reports issuance_status == \"SUPERSEDED\" and the second reports \"ISSUED\"."
            - "The second certificate's supersedes_certificate_id equals the first certificate's id, and the first certificate's own supersedes_certificate_id is unchanged."
            - "A SUPERSEDED plan refuses periodic-review with HTTP 409 and error_id == \"ERR_PLAN_STATE_INVALID\", and a SUPERSEDED certificate refuses furnish with \"ERR_CERTIFICATE_STATE_INVALID\"."

      - name: corner_state_machines_accreditation_suspend_endpoint_branches_to_suspended_or_expired
        claim_type: guarded_transitions
        grounds:
          - state_machines.LabAccreditation.ACCREDITED_to_SUSPENDED
          - state_machines.LabAccreditation.ACCREDITED_to_EXPIRED
          - endpoints "POST /compliance/lab-accreditations/{accreditation_id}/suspend"
        distinguishing_aspect: "A second guarded fork with a different guard type: here the discriminator is a combination of the submitted suspension_reason and the logical clock's position relative to valid_through, so the SAME endpoint on two identically shaped rows produces two different terminal states. Both targets are terminal, which distinguishes this from the Product fork where both targets continue."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register one rule and one laboratory with two accreditations — one valid 2026-01-01..2027-01-01 and one valid 2026-01-01..2026-06-01, the latter already past its coverage."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/lab-accreditations/{current_accreditation_id}/suspend with suspension_reason \"WITNESS_AUDIT_FINDING\" as ComplianceAdministrator."
            - "POST /compliance/lab-accreditations/{elapsed_accreditation_id}/suspend with suspension_reason \"COVERAGE_ELAPSED\" as ComplianceAdministrator."
          assert:
            - "The in-coverage accreditation reports accreditation_state == \"SUSPENDED\" with suspension_reason == \"WITNESS_AUDIT_FINDING\"."
            - "The elapsed accreditation reports accreditation_state == \"EXPIRED\", a different terminal state reached through the same endpoint."
            - "A second suspend on either row returns HTTP 409 with error_id == \"ERR_ACCREDITATION_STATE_INVALID\" — not \"ERR_ACCREDITATION_NOT_FOUND\", since the row exists and the refusal is a state conflict."
            - "A test order booked against the suspended method afterwards returns HTTP 422 with error_id == \"ERR_LAB_METHOD_NOT_ACCREDITED\"."

      - name: corner_state_machines_parallel_axes_of_the_certificate_advance_independently
        claim_type: parallel_independent_dimensions
        grounds:
          - state_machines.ChildrensProductCertificate
        distinguishing_aspect: "The two-axis certificate machine is the model's only parallel-shaped machine, and the independence of issuance_status from accompaniment_status is asserted in full in the difficulty design."
        excluded_because:
          difficulty_instance: non_linear_certificate_parallel_dimensions_issuance_and_accompaniment_advance_independently
          rationale: "That instance already walks both axes in both orders and asserts that a move on one dimension leaves the other's value and its timestamps untouched, which is exactly the parallel-independence claim."

      - name: corner_state_machines_cascade_down_from_failing_report_to_batches
        claim_type: side_effect_cascade_down
        grounds:
          - state_machines.TestOrder.IN_TESTING_to_REPORTED_FAIL
          - state_machines.Product.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: "The downward four-hop cascade from a failing laboratory report is the head of the difficulty design's depth-four instance."
        excluded_because:
          difficulty_instance: transitive_cascade_failing_result_suspends_product_withdraws_certificate_stops_batch
          rationale: "That instance asserts every hop of the cascade in order, including the negative control that a batch already released keeps its released_at, so re-testing the cascade here would only duplicate it."

      - name: corner_state_machines_conditional_cascade_suppressed_by_packaging_only_change
        claim_type: side_effect_conditional_cascade
        grounds:
          - calculations.material_change_resample_decision
          - state_machines.ComponentPart.VALID_to_SUPERSEDED
        distinguishing_aspect: "The conditional cascade whose whole point is the branch that does nothing (change_kind PACKAGING_ONLY) is asserted alongside the branch that fires."
        excluded_because:
          difficulty_instance: transitive_cascade_material_change_supersedes_part_voids_reliance_then_forces_resample_and_restricts_posture
          rationale: "That instance runs the five-hop firing cascade and then the PACKAGING_ONLY negative control on the same product, asserting that no part, certificate, plan or posture row moves."

  # ===========================================================================
  # 3. CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_calculations_rule_set_derivation_orders_by_severity_then_code_and_evaluates_predicates
        claim_type: correct_result
        grounds:
          - calculations.applicable_rule_set_derivation
          - entities.CategoryRuleMapping.fields.applicability_condition
          - entities.Product.fields.required_rule_ids
        distinguishing_aspect: "The topological derivation's own output: which rules land in required_rule_ids and in what ORDER. All five applicability_condition values are exercised against one product's part list, and the result order is asserted as an exact array, so an implementation that returns a set or sorts by creation order fails. Rule codes are unique, so no identifier tie-break is ever needed."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register five rules: LEAD-CONTENT-100 (severity 9), SMALL-PARTS-01 (severity 8), PHTHALATE-1000 (severity 7), METAL-COATING-04 (severity 7) and SURFACE-PAINT-02 (severity 5)."
            - "Register a non-durable category and map all five: lead ALWAYS, small-parts IF_SMALL_PART_PRESENT, phthalate IF_PLASTICIZED_PART, metal-coating IF_ACCESSIBLE_METAL, surface-paint IF_PAINTED_SURFACE."
            - "Register a product with exactly two parts: a PAINTED_COATING shell that is accessible and not a small part, and a PLASTICIZED_PLASTIC grip that is accessible and IS a small part when detached. No ACCESSIBLE_METAL part exists."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/products/{product_id}/submit-for-certification with evidence_path FULL_PRODUCT_TEST as TestCoordinator."
          assert:
            - "required_rule_ids contains exactly four ids: the lead rule (ALWAYS), the small-parts rule (a small part exists), the phthalate rule (a plasticized part exists) and the surface-paint rule (a painted part exists)."
            - "The metal-coating rule is ABSENT: IF_ACCESSIBLE_METAL found no ACCESSIBLE_METAL part, so the predicate is evaluated against the part list rather than assumed true."
            - "The array order is exactly [lead (9), small-parts (8), phthalate (7), surface-paint (5)] — severity_weight descending."
            - "Adding a second product whose only difference is that the phthalate rule and the metal rule both apply at severity 7 yields the order [PHTHALATE-1000, METAL-COATING-04] between them: equal severity is broken by rule_code ascending, never by id or created_at."
            - "GET /compliance/products/{product_id}/compliance-summary reports the same four ids in required_rule_ids and all four in uncovered_rule_ids."

      - name: corner_calculations_rule_set_derivation_input_set_excludes_future_and_retired_mappings
        claim_type: input_set_filtering
        grounds:
          - calculations.applicable_rule_set_derivation
          - entities.CategoryRuleMapping.fields.effective_from
          - endpoints.POST_/compliance/category-rule-mappings/{mapping_id}/retire
        distinguishing_aspect: "The derivation's input FILTER rather than its output ordering: a mapping whose effective_from is after the logical clock and a mapping already RETIRED are both excluded, while a mapping whose effective_from equals the clock exactly is included because the bound is inclusive. Three mappings differing only in these two dimensions isolate the filter from the predicate logic."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register three rules (lead severity 9, phthalate severity 7, small-parts severity 8) and one non-durable category."
            - "Map lead ALWAYS with effective_from 2026-08-01T00:00:00Z (exactly the clock), phthalate ALWAYS with effective_from 2026-09-01T00:00:00Z (future), small-parts ALWAYS with effective_from 2026-01-01T00:00:00Z and then retire that mapping."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/category-rule-mappings/{small_parts_mapping_id}/retire as ComplianceAdministrator."
            - "POST /compliance/products/{product_id}/submit-for-certification with evidence_path FULL_PRODUCT_TEST as TestCoordinator."
            - "Advance the clock to 2026-09-01T00:00:00Z and scope a SECOND product in the same category."
          assert:
            - "The retire call returns HTTP 200 with mapping_state == \"RETIRED\"."
            - "The first product's required_rule_ids contains exactly one id, the lead rule: the equal-instant mapping is IN (inclusive bound), the future mapping is OUT and the retired mapping is OUT."
            - "The second product, scoped at 2026-09-01T00:00:00Z, has required_rule_ids of exactly [lead, phthalate]: the previously future mapping is now effective, and the retired one is still excluded."
            - "The first product's required_rule_ids is UNCHANGED after the clock advance — the snapshot belongs to the scoping instant and is not silently re-derived."
            - "A new ACTIVE mapping for the retired (category, small-parts) pair can be created without ERR_MAPPING_DUPLICATE, because retirement freed the pair."

      - name: corner_calculations_sampling_size_constants_floor_and_cap_dominate_the_raw_figure
        claim_type: constants_applied
        grounds:
          - calculations.sampling_plan_required_sample_size
          - entities.ProductCategory.fields.sampling_floor_units
        distinguishing_aspect: "The named constants and the outer clamp rather than the variant split: the durable-infant multiplier of 2, the category floor overriding a smaller raw figure, and MAX_SAMPLE_UNITS 40 capping a larger one. Three products with deliberately extreme projected volumes make each constant the decisive term in turn."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and register one ALWAYS-mapped rule."
            - "Register three categories: a non-durable category with sampling_floor_units 10, a durable infant category with sampling_floor_units 4, and a non-durable category with sampling_floor_units 1."
            - "Register one product per category with projected_annual_units 100, 6000 and 100000 respectively; scope each onto FULL_PRODUCT_TEST and create plus activate an INITIAL plan on each."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read each activated plan's units_authorized."
          assert:
            - "The floor case: raw is (3 + ceil(100/2500)) * 1 == 4, but sampling_floor_units is 10, so units_authorized == 10."
            - "The durable case: raw is (3 + ceil(6000/2500)) * 1 == 6, doubled by DURABLE_INFANT_MULTIPLIER to 12, and 12 exceeds the floor of 4, so units_authorized == 12."
            - "The cap case: raw is (3 + ceil(100000/2500)) * 1 == 43, above MAX_SAMPLE_UNITS, so units_authorized == 40 exactly."
            - "The clamp order matters: the durable multiplier is applied BEFORE the floor and cap, so the durable case is 12 rather than 6 with a doubled floor."
            - "In every case units_committed == 0 and units_available == units_authorized immediately after activation."

      - name: corner_calculations_sampling_size_variant_selection_follows_plan_type_not_volume
        claim_type: variant_selection
        grounds:
          - calculations.sampling_plan_required_sample_size
          - entities.SamplingPlan.fields.plan_type
          - entities.SamplingPlan.fields.baseline_units_produced
        distinguishing_aspect: "WHICH variant is chosen, as distinct from how far apart the two variants' outputs sit. The selector is plan_type alone: an INITIAL plan ignores baseline_units_produced entirely and a PERIODIC plan ignores projected_annual_units entirely, which is proved by giving one product a large projection and a zero baseline and its sibling the reverse."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; one ALWAYS-mapped rule and a non-durable category with sampling_floor_units 1."
            - "Register product ALPHA with projected_annual_units 6000 and product BETA with projected_annual_units 100; scope both onto FULL_PRODUCT_TEST."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "On ALPHA create an INITIAL plan with baseline_units_produced 40000 supplied anyway, and activate it, as TestCoordinator."
            - "On BETA create a PERIODIC plan with baseline_units_produced 20000, and activate it, as TestCoordinator."
          assert:
            - "ALPHA's INITIAL plan reports units_authorized == 6 — computed from ceil(6000/2500) plus base 3, with the supplied baseline_units_produced of 40000 having no effect whatsoever."
            - "BETA's PERIODIC plan reports units_authorized == 5 — computed from floor(20000/5000) plus base 1, with projected_annual_units of 100 having no effect."
            - "The two plans differ in which INPUT they consulted, not merely in the constants applied: swapping the plan_type values would swap the answers."
            - "Both plans report plan_type echoed back exactly as submitted."

      - name: corner_calculations_sampling_size_variant_divergence_between_initial_and_periodic
        claim_type: variant_divergence
        grounds:
          - calculations.sampling_plan_required_sample_size
        distinguishing_aspect: "The magnitude of the gap between the forward-looking and chronological variants on identical volume data."
        excluded_because:
          difficulty_instance: dual_variant_sampling_size_initial_forward_looking_versus_periodic_chronological
          rationale: "That instance holds the volume figure constant across both variants and asserts the two outputs and their exact delta, which is the divergence claim in full."

      - name: corner_calculations_invoice_expedite_tier_boundaries_are_regressive_at_the_edge
        claim_type: boundary_condition_tiered_pricing
        grounds:
          - calculations.test_order_invoice_total_cents
          - entities.TestOrder.fields.expedite_requested
        distinguishing_aspect: "The tier EDGES of the expedite waterfall, which no difficulty instance pins down: a subtotal of exactly EXPEDITE_TIER_1_MAX_CENTS stays in tier 1 while one cent more drops to tier 2. Because tier 2's rate is lower, the invoice total actually FALLS as the subtotal rises by one cent — a regressive step that an implementation using > instead of >= would place one cent away."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register rule EDGE-A with base_method_fee_cents 25000 and rule EDGE-B with base_method_fee_cents 16667, both ALWAYS-mapped onto a non-durable category with sampling_floor_units 1, both with an accreditation at fee_surcharge_basis_points 0 on an INDEPENDENT laboratory with concurrent_slot_capacity 4."
            - "Register a product with projected_annual_units 20000 (INITIAL plan authorizes (3+8)*2 == 22 units) on the FULL_PRODUCT_TEST path so no reliance discount can apply, and activate the plan."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book an expedited order for EDGE-A with sample_count 2 (subtotal 50000 exactly), as TestCoordinator."
            - "Book an expedited order for EDGE-B with sample_count 3 (subtotal 50001), as TestCoordinator."
            - "Book a non-expedited order for EDGE-A with sample_count 2, as TestCoordinator."
          assert:
            - "The 50000 order reports line_fee_cents == 50000 and invoice_total_cents == 57500: subtotal <= 50000 keeps EXPEDITE_RATE_BP_TIER_1 at 1500 bp, giving a 7500 fee."
            - "The 50001 order reports line_fee_cents == 50001 and invoice_total_cents == 55001: one cent past the tier-1 ceiling switches to EXPEDITE_RATE_BP_TIER_2 at 1000 bp, giving a 5000 fee."
            - "The larger subtotal therefore produces the SMALLER invoice total, 55001 < 57500 — the tier boundary is regressive and must not be smoothed."
            - "The non-expedited EDGE-A order reports invoice_total_cents == 50000: with expedite_requested false the rate is 0 regardless of tier."
            - "No reliance discount is applied to any of the three, because the product's evidence_path is FULL_PRODUCT_TEST."

      - name: corner_calculations_invoice_reliance_discount_thresholds_use_inclusive_comparisons
        claim_type: constants_applied
        grounds:
          - calculations.test_order_invoice_total_cents
          - entities.Product.fields.evidence_path
        distinguishing_aspect: "The second tier ladder in the same waterfall, keyed on the post-expedite total rather than the subtotal, and checked at both of its thresholds: exactly 60000 earns the 800 bp band, one cent below earns nothing, and exactly 120000 earns the 1200 bp band. The high band must be evaluated before the standard band, otherwise a 120000 total would receive 800 bp."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register rules with base_method_fee_cents 20000, 59999 and 40000, all ALWAYS-mapped, all accredited at fee_surcharge_basis_points 0 on an INDEPENDENT laboratory with concurrent_slot_capacity 6."
            - "Register a product on the COMPONENT_RELIANCE path with projected_annual_units 40000 so the plan authorizes ample units, and activate the plan. No ComponentPartCertificate has reached RELIED_UPON for any of the three rules, so product-level orders for them are still permitted by validation 34."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book a non-expedited order at base 20000 with sample_count 3 (total_before_discount 60000), as TestCoordinator."
            - "Book a non-expedited order at base 59999 with sample_count 1 (total_before_discount 59999), as TestCoordinator."
            - "Book a non-expedited order at base 40000 with sample_count 3 (total_before_discount 120000), as TestCoordinator."
          assert:
            - "The 60000 order reports invoice_total_cents == 55200: at exactly RELIANCE_DISCOUNT_THRESHOLD_CENTS the 800 bp band applies, giving a 4800 discount."
            - "The 59999 order reports invoice_total_cents == 59999: one cent below the threshold earns a zero discount, not a prorated one."
            - "The 120000 order reports invoice_total_cents == 105600: at exactly RELIANCE_DISCOUNT_HIGH_THRESHOLD_CENTS the 1200 bp band applies, giving a 14400 discount — NOT 9600, which is what the 800 bp band would have produced."
            - "An identical set of orders on a FULL_PRODUCT_TEST product receives no discount at all, so evidence_path is the gate and the total is only the band selector."

      - name: corner_calculations_gap_score_percentage_rounds_half_up_before_penalties
        claim_type: precision
        grounds:
          - calculations.product_risk_weighted_gap_score
          - entities.ApplicableRule.fields.severity_weight
        distinguishing_aspect: "The rounding step in isolation, with no penalty terms in play: severity weights 9 and 7 make the uncovered percentage land exactly on 43.75 and 56.25, the two values where round-half-up and truncation disagree. The difficulty design covers the clamp AFTER penalties; this instance covers the rounding BEFORE them."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register a lead rule with severity_weight 9 and a phthalate rule with severity_weight 7, both ALWAYS-mapped onto a non-durable category with sampling_floor_units 1."
            - "Register two products, each with one painted and one plasticized part, both on FULL_PRODUCT_TEST with an active plan and an accredited independent laboratory."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "On product ALPHA report PASS for the lead rule only, leaving the phthalate rule uncovered."
            - "On product BETA report PASS for the phthalate rule only, leaving the lead rule uncovered."
          assert:
            - "ALPHA reports risk_weighted_gap_score == 44: uncovered weight 7 of total 16 is 43.75, rounded half up to 44 rather than truncated to 43."
            - "BETA reports risk_weighted_gap_score == 56: uncovered weight 9 of total 16 is 56.25, rounded half up to 56 — the same rule produces a DOWNWARD-looking result here, so the behaviour is round-half-up and not ceiling."
            - "Neither product has an open case or a RESAMPLE_DUE plan, so no penalty term is present and the asserted values are the pure rounded percentage."
            - "Both products report compliance_posture == \"RESTRICTED\" by branch 5, since the score is non-zero but nothing is suspended."
            - "GET /compliance/products/{product_id}/compliance-summary reports covered_rule_ids and uncovered_rule_ids of length 1 each on both products."

      - name: corner_calculations_posture_branch_order_puts_suspension_ahead_of_a_zero_gap_score
        claim_type: boundary_condition_threshold
        grounds:
          - calculations.product_compliance_posture
          - state_machines.SamplingPlan.RESAMPLE_DUE_to_LAPSED
        distinguishing_aspect: "The ordered-branch semantics of the posture threshold: a single product can satisfy both branch 3 (a LAPSED plan) and branch 4 (a zero gap score), and the earlier branch must win. The formula's own note calls this out, and it is the only place where two branches of one calculation are both true."
        test_recipe:
          setup:
            - "Build the canonical single-rule product, report PASS so risk_weighted_gap_score reaches 0 and posture is CLEARED."
            - "Advance the clock past periodic_due_at plus resample_grace_days and run periodic-review twice so the plan reaches LAPSED."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read GET /compliance/products/{product_id}/compliance-summary before the lapse and after it, as ComplianceAdministrator."
          assert:
            - "Before the lapse: risk_weighted_gap_score == 0 and compliance_posture == \"CLEARED\"."
            - "After the lapse: compliance_posture == \"SUSPENDED\" while risk_weighted_gap_score is still 0 — branch 3 outranks branch 4."
            - "The posture is NOT \"RESTRICTED\": branch 5 is the fallback and is only reached when no earlier branch matches."
            - "A batch release attempted at that point returns HTTP 422 with error_id == \"ERR_PRODUCT_POSTURE_NOT_CLEARED\", so the branch order has a real gate behind it."
            - "Archiving the product afterwards reports compliance_posture == \"UNSCOPED\" by branch 1, which outranks even the suspension branches."

      - name: corner_calculations_corrective_scope_falls_back_to_product_created_at_when_no_prior_pass
        claim_type: boundary_condition_chronological
        grounds:
          - calculations.noncompliance_corrective_scope_units
          - entities.Product.fields.created_at
        distinguishing_aspect: "The empty-set fallback of the chronological cutoff, which the difficulty instance does not reach because it always has a prior passing test: on the LOT_TRACEBACK variant with no REPORTED_PASS order for the rule at all, the cutoff becomes Product.created_at — a timestamp, never an identifier — so every batch ever produced is in scope. The inclusive lower bound is also probed with a batch produced at exactly the cutoff instant."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and create the product at that instant, so Product.created_at == 2026-08-01T00:00:00Z."
            - "Reach a certificate issued from a first rule while a SECOND rule has never been tested; produce three batches of 100 units each at 2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z and 2026-08-20T00:00:00Z."
            - "Report FAIL on the second rule so a case opens with no prior passing order for that rule."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution with scope_variant LOT_TRACEBACK as DistributionManager."
          assert:
            - "The case reports scope_units == 300: with no REPORTED_PASS order for the failed rule, the cutoff falls back to Product.created_at and all three batches are in scope."
            - "The batch produced at exactly 2026-08-01T00:00:00Z — equal to the cutoff — IS included, confirming the >= lower bound."
            - "The selection consulted no identifier: the fallback is the product's created_at timestamp, so an implementation ordering by id would be indistinguishable only by accident and must not be relied on."
            - "All three batches report distribution_state == \"STOP_DISTRIBUTION\" and Product.units_stopped == 300."
            - "The same case with scope_variant BATCH_SCOPED would have used the failing order's window_start instead, which is strictly after Product.created_at."

      - name: corner_calculations_periodic_due_date_selects_the_strictest_interval_across_all_required_rules
        claim_type: input_set_filtering
        grounds:
          - calculations.periodic_retest_due_date
          - entities.ApplicableRule.fields.periodic_interval_months
        distinguishing_aspect: "Aggregate selection precision on the due-date input set: the minimum periodic_interval_months across EVERY rule in required_rule_ids wins, not the first rule, not the highest-severity rule, and not the product's own category. A rule that is mapped but not applicable to this product must not influence the result, which separates the input set from the whole rule catalogue."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register three rules: lead with periodic_interval_months 12 and severity 9, phthalate with 6 and severity 7, and a metal rule with 3 and severity 8 mapped IF_ACCESSIBLE_METAL."
            - "Register a non-durable category and map all three: lead ALWAYS, phthalate ALWAYS, metal IF_ACCESSIBLE_METAL."
            - "Register a product with one PAINTED_COATING part and NO accessible metal part, scope onto FULL_PRODUCT_TEST, then create and activate an INITIAL plan."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read the activated plan's periodic_due_at."
          assert:
            - "periodic_due_at == \"2027-02-01T00:00:00Z\": the strictest interval among the product's required rules is the phthalate rule's 6 months."
            - "It is NOT \"2026-11-01T00:00:00Z\": the 3-month metal rule is mapped to the category but is not in required_rule_ids, so it is outside the input set."
            - "It is NOT \"2027-08-01T00:00:00Z\": the highest-severity rule's 12-month interval does not win merely because it sorts first in required_rule_ids."
            - "A product whose required_rule_ids is empty would report periodic_due_at == null rather than an arbitrary far-future instant."
            - "After a REPORTED_PASS order the baseline moves to the new last_verified_at and periodic_due_at is recomputed six months forward from that instant."

      - name: corner_calculations_certificate_content_completeness_counts_seven_slots_including_evidence_coverage
        claim_type: correct_result
        grounds:
          - calculations.certificate_content_completeness
          - entities.ChildrensProductCertificate.fields.cited_rule_ids
          - entities.ChildrensProductCertificate.fields.cited_evidence_count
        distinguishing_aspect: "The seven-slot completeness count, whose last two slots are not content fields at all but relationships: slot 6 requires cited_rule_ids to equal required_rule_ids as a SET, and slot 7 requires at least as many evidence rows as cited rules. A certificate with five perfect text fields but mismatched citations therefore scores 85, not 100, and the floor division makes six of seven exactly 85."
        test_recipe:
          setup:
            - "Reach an EVIDENCE_COMPLETE two-rule product where both rules have a REPORTED_PASS order, and a second EVIDENCE_COMPLETE product where only one of two rules is covered by a passing order but the product is otherwise ready."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Create a certificate with all five content fields well formed on the fully covered product, as CertificationOfficer (user officer-vale)."
            - "Create a certificate with certifier_contact_email set to \"compliance.rover-juvenile.example\" (no @) on the same product, as CertificationOfficer (user officer-vale)."
          assert:
            - "The well-formed certificate reports content_completeness_pct == 100, cited_rule_ids equal to the product's required_rule_ids as a set, and cited_evidence_count >= length(cited_rule_ids)."
            - "The certificate whose email lacks an @ reports content_completeness_pct == 85 — floor(100 * 6 / 7) — and its issuance returns HTTP 422 with error_id == \"ERR_CERTIFICATE_CONTENT_INCOMPLETE\"."
            - "85 is asserted exactly: floor is used, so six of seven is not 86 and not 85.7 rounded up."
            - "cited_rule_ids is a computed snapshot taken at creation: it does not change when a later rule mapping is retired."

      - name: corner_calculations_tracking_label_flag_requires_all_five_conjuncts_including_batch_code_format
        claim_type: correct_result
        grounds:
          - calculations.tracking_label_compliance_flag
          - entities.ProductionBatch.fields.batch_code
          - errors.ERR_TRACKING_LABEL_NONCOMPLIANT
        distinguishing_aspect: "A five-way boolean conjunction where each conjunct is knocked out in turn, including the two that are easy to miss: the batch_code must match the declared pattern, and the owning product's manufacture_site_code must be non-empty. Label presence on the product alone or the packaging alone is explicitly not compliant, which is the scenario's 'on the product and packaging' requirement."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED and FURNISHED certificate at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Create batch RVR090-000201 with label_on_product true, label_on_packaging false, label_batch_code_printed true, as DistributionManager, and attempt release."
            - "POST /compliance/production-batches/{batch_id}/tracking-label with all three flags true, as DistributionManager, and attempt release again."
            - "Create batch \"rvr-1\" with all three flags true, as DistributionManager, and attempt release."
          assert:
            - "The batch missing packaging reports tracking_label_compliant == false and its release returns HTTP 422 with error_id == \"ERR_TRACKING_LABEL_NONCOMPLIANT\"."
            - "After the tracking-label update sets all three flags, the same batch reports tracking_label_compliant == true and releases with HTTP 200."
            - "The batch coded \"rvr-1\" reports tracking_label_compliant == false even with all three flags true, because the code does not match the required format, and its release is refused with the same error."
            - "Flipping any single flag back to false via the tracking-label endpoint returns tracking_label_compliant to false, so the conjunction is re-evaluated on every edit rather than latched."

      - name: corner_calculations_material_change_and_retest_threshold_decisions_cover_their_enums
        claim_type: correct_result
        grounds:
          - calculations.material_change_resample_decision
          - calculations.retest_round_threshold_decision
        distinguishing_aspect: "Two small threshold decisions asserted across their complete input domains rather than at a single point: every change_kind value is submitted so that PACKAGING_ONLY is shown to be the ONLY non-triggering kind, and the retest counter is walked 0, 1, 2, 3 so that MAX_RETEST_ROUNDS is shown to escalate at exactly 3 under a >= comparison."
        test_recipe:
          setup:
            - "Build a product with one component part and one applicable rule; separately drive a noncompliance case through repeated failing retests."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Record one material change event per change_kind value, as ComplianceAdministrator."
            - "Order retests on the case at retest_round_count 0, 1, 2 and 3, failing each one, as TestCoordinator."
          assert:
            - "The PACKAGING_ONLY event reports triggers_resample == false; every other change_kind reports triggers_resample == true."
            - "No change_kind value is left unexercised: the enum is closed and each member's outcome is asserted."
            - "The retests ordered at retest_round_count 0, 1 and 2 all land the case in \"RETEST_ORDERED\", leaving the counter at 1, 2 and 3."
            - "The retest ordered while retest_round_count is exactly 3 lands the case in \"ESCALATED_RECALL\", so the comparison is >= 3 and not > 3."
            - "The escalation is terminal: a further order-retest returns HTTP 409 with error_id == \"ERR_CASE_STATE_INVALID\"."

      - name: corner_calculations_overlap_checks_exclude_released_intervals_from_their_input_sets
        claim_type: input_set_filtering
        grounds:
          - calculations.laboratory_slot_overlap_check
          - calculations.component_certificate_coverage_overlap_check
        distinguishing_aspect: "The status filters that decide which existing intervals occupy a resource."
        excluded_because:
          difficulty_instance: temporal_overlap_laboratory_slots_half_open_aggregate_capacity_two_with_adjacency_allowed
          rationale: "That instance cancels an order and shows the freed window immediately admits a previously rejected candidate, and its companion instance does the same with a REJECTED component certificate, which together assert both input-set filters."

      - name: corner_calculations_three_ledgers_reconcile_in_the_computed_compliance_summary
        claim_type: reconciliation
        grounds:
          - calculations.sample_unit_ledger
          - calculations.distribution_unit_ledger
          - calculations.laboratory_fee_ledger
        distinguishing_aspect: "The reconciliation READ rather than the compensating write path: the computed compliance-summary endpoint reports the four distribution buckets, the derived total and an explicit ledger_balanced boolean, so the invariant is observable in one response instead of being reassembled by the client from several rows."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with an ISSUED and FURNISHED certificate, two batches (300 and 200 units), one released, one held, and one cancelled plus one passing test order."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "GET /compliance/products/{product_id}/compliance-summary as ComplianceAdministrator."
          assert:
            - "The response reports units_total_produced == 500 with units_held == 200, units_released == 300, units_stopped == 0, units_destroyed == 0 and ledger_balanced == true."
            - "The four bucket values in the summary equal the same four fields read from GET /compliance/products/{product_id}, so the computed read is a projection and not a second source of truth."
            - "open_case_count and resample_due_plan_count in the summary equal the counts used as penalty terms by product_risk_weighted_gap_score, and risk_weighted_gap_score in the summary equals the product's own field."
            - "required_rule_ids equals covered_rule_ids concatenated with uncovered_rule_ids as a set, with no id appearing in both."

  # ===========================================================================
  # 4. VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:

      - name: corner_validations_undue_influence_family_each_guard_produces_its_own_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=20]
          - errors.ERR_LAB_BARRED
          - errors.ERR_UNDUE_INFLUENCE_ATTESTATION_MISSING
          - errors.ERR_MANUFACTURER_OWNED_LAB_FORBIDDEN
        distinguishing_aspect: "Three separate undue-influence guards that all fire on laboratory selection but must not be collapsed into one code: a BARRED laboratory, a laboratory whose standing attestation is MISSING or EXPIRED, and a MANUFACTURER_OWNED laboratory receiving a retest. Each is provoked while the other two are satisfied, so a single generic 'lab ineligible' error fails the instance."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register one ALWAYS-mapped rule, a non-durable category with sampling_floor_units 1, a product on FULL_PRODUCT_TEST with an active plan of ample units and a generous testing_budget_cents."
            - "Register laboratory BARRED-LAB (INDEPENDENT, attestation valid through 2027-01-01, accredited for the rule) and then set its operational_state to BARRED."
            - "Register laboratory NO-ATTEST (INDEPENDENT, accredited for the rule, NO independence attestation ever filed, so influence_attestation_state is MISSING)."
            - "Register laboratory STALE-ATTEST (INDEPENDENT, accredited, attestation_valid_through 2026-07-31T00:00:00Z, already behind the clock)."
            - "Register laboratory OWNED-LAB (MANUFACTURER_OWNED, current attestation, accredited for the rule)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${barred_lab_id}/operational-state"
              payload: { operational_state: "BARRED" }
              as: ComplianceAdministrator
          trigger:
            - "Book an order against BARRED-LAB, then against NO-ATTEST, then against STALE-ATTEST, then against OWNED-LAB, each as TestCoordinator."
            - "Open a noncompliance case from a failing order and order a retest against OWNED-LAB, as TestCoordinator."
          assert:
            - "BARRED-LAB returns HTTP 422 with error_id == \"ERR_LAB_BARRED\"."
            - "NO-ATTEST returns HTTP 422 with error_id == \"ERR_UNDUE_INFLUENCE_ATTESTATION_MISSING\", and so does STALE-ATTEST — an expired attestation is treated exactly like a missing one, and validation 19 compares influence_attestation_valid_through against the logical clock."
            - "OWNED-LAB accepts the ordinary order with HTTP 201: manufacturer ownership is permitted for initial testing."
            - "The retest against OWNED-LAB returns HTTP 422 with error_id == \"ERR_MANUFACTURER_OWNED_LAB_FORBIDDEN\" — the restriction is specific to is_retest true."
            - "Filing a fresh attestation on STALE-ATTEST with attestation_valid_through 2027-01-01T00:00:00Z moves influence_attestation_state to CURRENT and the same order then succeeds, so the guard is stateful rather than a permanent bar."

      - name: corner_validations_accreditation_match_is_a_four_way_cross_entity_tuple
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=21]
          - entities.LabAccreditation.fields.test_method_code
          - entities.LabAccreditation.fields.accreditation_state
          - errors.ERR_LAB_METHOD_NOT_ACCREDITED
        distinguishing_aspect: "A validation whose satisfaction requires four attributes of a row in a THIRD entity to agree at once — laboratory, test method, state and clock coverage — which is the scenario's per-test-method accreditation verification. Each of the four is broken in isolation while the other three hold, so an implementation checking only 'this lab has some accreditation' fails three of the four probes."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register rule LEAD (test_method_code CPSC-CH-E1002-08) and rule PHTH (test_method_code CPSC-CH-C1001-09), both ALWAYS-mapped, and a product on FULL_PRODUCT_TEST with an active plan."
            - "Register four INDEPENDENT laboratories, each with a current attestation: MATCH (accredited for CPSC-CH-E1002-08, 2026-01-01..2027-01-01), WRONG-METHOD (accredited only for CPSC-CH-C1001-09), EXPIRED-WINDOW (accredited for CPSC-CH-E1002-08 but 2025-01-01..2026-07-31) and SUSPENDED-ROW (accredited for CPSC-CH-E1002-08 over a covering window, then suspended)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/lab-accreditations/${suspended_accreditation_id}/suspend"
              payload: { suspension_reason: "Proficiency testing lapse" }
              as: ComplianceAdministrator
          trigger:
            - "Book an order for rule LEAD against each of the four laboratories in turn, as TestCoordinator."
          assert:
            - "MATCH returns HTTP 201."
            - "WRONG-METHOD returns HTTP 422 with error_id == \"ERR_LAB_METHOD_NOT_ACCREDITED\": accreditation is per test method, not per laboratory."
            - "EXPIRED-WINDOW returns the same error: valid_through 2026-07-31 does not cover the clock instant 2026-08-01."
            - "SUSPENDED-ROW returns the same error: accreditation_state must be ACCREDITED, so a suspended row does not count even though its window covers the clock."
            - "An accreditation whose valid_from is exactly 2026-08-01T00:00:00Z is accepted, because the coverage comparison is valid_from <= clock <= valid_through at both ends."
            - "The same four probes on POST /compliance/component-parts/{part_id}/certificates behave identically, so the guard is shared by the supplier evidence route."

      - name: corner_validations_temporal_window_shapes_reject_equality_and_backdating
        claim_type: temporal_validation
        grounds:
          - validations[priority=27]
          - validations[priority=30]
          - errors.ERR_WINDOW_INVALID
          - errors.ERR_PERIODIC_REVIEW_NOT_DUE
        distinguishing_aspect: "Two temporal guards with OPPOSITE strictness on the same kind of comparison, asserted side by side: a booking window is refused when its end EQUALS its start (strictly-after), while a periodic review is accepted when the clock EQUALS periodic_due_at (at-or-after). Getting either comparator wrong flips exactly one of the two probes, so they cannot both pass by accident."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build the canonical single-rule product on FULL_PRODUCT_TEST with an active plan whose periodic_due_at is 2027-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book an order with window_start 2026-08-10T00:00:00Z and window_end 2026-08-10T00:00:00Z, as TestCoordinator."
            - "Book an order with window_start 2026-07-31T00:00:00Z and window_end 2026-08-10T00:00:00Z, as TestCoordinator."
            - "Book an order with window_start exactly 2026-08-01T00:00:00Z and window_end 2026-08-02T00:00:00Z, as TestCoordinator."
            - "Run periodic-review at clock 2027-07-31T23:59:59Z, then at exactly 2027-08-01T00:00:00Z, as TestCoordinator."
          assert:
            - "The zero-length window returns HTTP 422 with error_id == \"ERR_WINDOW_INVALID\": window_end must be STRICTLY after window_start."
            - "The backdated window returns the same error: window_start must be at or after the logical clock."
            - "The window starting exactly at the clock returns HTTP 201 — equality is allowed on that bound."
            - "The review at 2027-07-31T23:59:59Z returns HTTP 409 with error_id == \"ERR_PERIODIC_REVIEW_NOT_DUE\" and leaves plan_state ACTIVE."
            - "The review at exactly 2027-08-01T00:00:00Z returns HTTP 200 and moves plan_state to RESAMPLE_DUE with resample_trigger PERIODIC_INTERVAL — equality means due."
            - "A component part certificate with coverage_through equal to coverage_from, and an accreditation with valid_through equal to valid_from, both return ERR_WINDOW_INVALID, so all three window shapes share the guard."

      - name: corner_validations_budget_aggregate_sums_only_the_live_order_states
        claim_type: aggregate_validation
        grounds:
          - validations[priority=42]
          - errors.ERR_PRODUCT_TESTING_BUDGET_EXCEEDED
          - entities.Product.fields.testing_budget_cents
        distinguishing_aspect: "An aggregate guard whose input set is defined by a status filter and which includes the CANDIDATE row in the sum before the row exists. A cancelled order must drop out of the sum while a REPORTED_FAIL order must stay in it, and the boundary is inclusive: a sum landing exactly on the budget is admitted and one cent more is refused with the unusual 402 status."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register a rule with base_method_fee_cents 20000, ALWAYS-mapped, on an INDEPENDENT accredited laboratory with fee_surcharge_basis_points 0 and concurrent_slot_capacity 8."
            - "Register a product on FULL_PRODUCT_TEST with testing_budget_cents exactly 60000 and a plan authorizing at least 8 units; activate it."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book order ONE with sample_count 2 (40000), start it, report a FAIL result, as TestCoordinator then LaboratoryUser."
            - "Book order TWO with sample_count 1 (20000), as TestCoordinator."
            - "Book order THREE with sample_count 1 (20000), as TestCoordinator."
            - "Cancel order TWO, then re-book an identical order FOUR, as TestCoordinator."
          assert:
            - "Order ONE and order TWO both succeed: the running sum reaches exactly 60000, equal to testing_budget_cents, and the check is <=."
            - "Order THREE returns HTTP 402 with error_id == \"ERR_PRODUCT_TESTING_BUDGET_EXCEEDED\" — a payment-required status, not 422, and the candidate's own invoice_total_cents was included in the sum before any row was written."
            - "Order ONE remains in the sum despite being REPORTED_FAIL: the filter admits SCHEDULED, IN_TESTING, REPORTED_PASS and REPORTED_FAIL."
            - "After order TWO is cancelled the identical order FOUR succeeds, proving CANCELLED rows leave the input set."
            - "Product.testing_budget_cents is never mutated by any of these calls; the guard is a recomputed aggregate, not a decrementing balance."

      - name: corner_validations_material_change_subject_type_drives_a_conditional_referential_check
        claim_type: conditional_validation
        grounds:
          - validations[priority=36]
          - errors.ERR_PART_SUBJECT_MISMATCH
          - entities.MaterialChangeEvent.fields.subject_type
        distinguishing_aspect: "A validation that is conditional in BOTH directions on a discriminator: when subject_type is COMPONENT_PART the part id is required AND must belong to the named product, and when subject_type is PRODUCT the part id must be absent. The cross-product probe — a real part belonging to a different product — is the case a naive presence check would let through."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register two products in the same category, each with one component part."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Record an event with subject_type COMPONENT_PART naming product ALPHA and ALPHA's part, as ComplianceAdministrator."
            - "Record an event with subject_type COMPONENT_PART naming product ALPHA and BETA's part."
            - "Record an event with subject_type COMPONENT_PART naming product ALPHA and no component_part_id."
            - "Record an event with subject_type PRODUCT naming product ALPHA and ALPHA's part id anyway."
            - "Record an event with subject_type PRODUCT naming product ALPHA and no part id."
          assert:
            - "The matching pair returns HTTP 201 and stamps occurred_at from the logical clock."
            - "The cross-product pair returns HTTP 422 with error_id == \"ERR_PART_SUBJECT_MISMATCH\" — the part exists, so this is not a 404."
            - "The COMPONENT_PART event with no part id returns HTTP 422 with the same error, because the discriminator makes the field required."
            - "The PRODUCT event carrying a part id returns HTTP 422 with the same error: the field must be absent or null on that branch."
            - "The clean PRODUCT event returns HTTP 201, and Product.material_change_count has advanced by exactly the number of accepted events (2), never by the rejected ones."

      - name: corner_validations_empty_collection_boundaries_block_scoping_in_two_distinct_ways
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - validations[priority=38]
          - errors.ERR_NO_COMPONENT_PARTS
          - errors.ERR_NO_APPLICABLE_RULES
        distinguishing_aspect: "Two empty-set boundaries reached on the SAME endpoint from opposite directions: no component parts at all, and parts present but every applicability predicate evaluating false so the derived rule set is empty. The second case is the one that distinguishes 'the category has no mappings' from 'the mappings do not apply', and both must be refused rather than yielding a product with an empty required_rule_ids."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register a category with one mapping whose applicability_condition is IF_ACCESSIBLE_METAL, and a second category with NO mappings at all."
            - "Register product NOPARTS in the first category with no component parts."
            - "Register product NOMATCH in the first category with a single TEXTILE part that is not accessible and not a small part."
            - "Register product NOMAP in the second category with one PAINTED_COATING part."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Submit each of the three products for certification with evidence_path FULL_PRODUCT_TEST, as TestCoordinator."
          assert:
            - "NOPARTS returns HTTP 422 with error_id == \"ERR_NO_COMPONENT_PARTS\" and stays in certification_state DRAFT."
            - "NOMATCH returns HTTP 422 with error_id == \"ERR_NO_APPLICABLE_RULES\": the mapping is ACTIVE and effective, but IF_ACCESSIBLE_METAL matched no part, so the derived set is empty."
            - "NOMAP returns the same ERR_NO_APPLICABLE_RULES, so the two routes to an empty set share one code while the missing-parts route has its own."
            - "Priority 37 is checked before 38: adding an ACCESSIBLE_METAL part to NOPARTS is not enough to change its error, because it has no parts to add one to until the part is created — and once created, the submission succeeds outright."
            - "None of the three failed submissions wrote required_rule_ids: all three still report an empty array and compliance_posture UNSCOPED."

      - name: corner_validations_uniqueness_scopes_differ_between_mapping_pairs_and_batch_codes
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - validations[priority=41]
          - errors.ERR_MAPPING_DUPLICATE
          - errors.ERR_BATCH_CODE_DUPLICATE
        distinguishing_aspect: "Two uniqueness constraints with different SCOPES and different state sensitivities: the mapping pair is unique only among ACTIVE rows so retirement frees it, while the batch code is unique per product so the identical code is legal on a different product. Both return 409, and each is probed with the case the other's rule would get wrong."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one rule and one category with an ACTIVE mapping between them."
            - "Reach two CERTIFIED products, each with an ISSUED and FURNISHED certificate."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Create a second mapping for the same (category_id, rule_id) pair, as ComplianceAdministrator."
            - "Retire the first mapping and create the pair again."
            - "Create batch RVR090-000501 on product ALPHA, then the same code again on ALPHA, then the same code on product BETA, as DistributionManager."
          assert:
            - "The duplicate ACTIVE mapping returns HTTP 409 with error_id == \"ERR_MAPPING_DUPLICATE\"."
            - "After retirement the same pair is accepted with HTTP 201, because the uniqueness scope is 'mapping_state == ACTIVE' and not 'ever existed'."
            - "The repeated batch code on ALPHA returns HTTP 409 with error_id == \"ERR_BATCH_CODE_DUPLICATE\"."
            - "The same batch code on BETA returns HTTP 201, because batch codes are unique per product_id, not globally."
            - "Neither 409 leaves a partial row: ALPHA still has exactly one batch with that code, and the category still has exactly one ACTIVE mapping for the pair."

      - name: corner_validations_reliance_referential_guards_separate_rule_scope_from_rule_policy
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=22]
          - errors.ERR_RULE_NOT_APPLICABLE_TO_PRODUCT
          - errors.ERR_COMPONENT_RELIANCE_NOT_ALLOWED
          - errors.ERR_RELIANCE_AGREEMENT_MISSING
        distinguishing_aspect: "Three different reasons a supplier's component part certificate may not be relied upon, provoked one at a time on the same endpoint: the rule is not in the product's scope at all, the rule forbids component reliance as a matter of policy, and the supplier has no reliance agreement on file. The scenario's 'reliance documentation' requirement is exactly this three-way distinction."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register rule LEAD (component_reliance_allowed true, ALWAYS-mapped), rule MECH (component_reliance_allowed false, ALWAYS-mapped) and rule FLAM (component_reliance_allowed true, NOT mapped to the category)."
            - "Register supplier ONFILE with reliance_agreement_state ON_FILE and supplier NOAGREEMENT left at NOT_ON_FILE."
            - "Register a product on COMPONENT_RELIANCE with one PAINTED_COATING part from ONFILE and one from NOAGREEMENT; submit for certification."
            - "Have each supplier file a component part certificate for the relevant rule, as SupplierUser."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Record reliance with reliance_decision RELY on the FLAM certificate, as CertificationOfficer."
            - "Record reliance with reliance_decision RELY on the MECH certificate."
            - "Record reliance with reliance_decision RELY on the NOAGREEMENT supplier's LEAD certificate."
            - "Record reliance with reliance_decision RELY on the ONFILE supplier's LEAD certificate."
          assert:
            - "The FLAM attempt returns HTTP 422 with error_id == \"ERR_RULE_NOT_APPLICABLE_TO_PRODUCT\": the rule is not in required_rule_ids."
            - "The MECH attempt returns HTTP 422 with error_id == \"ERR_COMPONENT_RELIANCE_NOT_ALLOWED\": the rule is in scope but must be tested on the finished product."
            - "The NOAGREEMENT attempt returns HTTP 422 with error_id == \"ERR_RELIANCE_AGREEMENT_MISSING\": the certificate and rule are both fine, only the supplier paperwork is absent."
            - "The clean attempt returns HTTP 200 with reliance_state == \"RELIED_UPON\" and stamps reliance_recorded_by_user_id."
            - "A reliance_decision of REJECT on the MECH certificate succeeds with reliance_state == \"REJECTED\": the policy guards only apply to RELY, so rejecting an unusable certificate is always possible."
            - "Recording reliance on a product whose evidence_path is FULL_PRODUCT_TEST returns HTTP 422 with error_id == \"ERR_EVIDENCE_PATH_MISMATCH\", which is the fourth and last reason on this endpoint."

      - name: corner_validations_sampling_floor_can_exceed_the_cap_and_blocks_activation
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - calculations.sampling_plan_required_sample_size
          - errors.ERR_SAMPLING_FLOOR_NOT_MET
        distinguishing_aspect: "The one configuration where the sample-size clamp and the activation guard disagree: a category floor above MAX_SAMPLE_UNITS makes units_authorized cap out below the floor, so activation must be refused rather than silently activating an under-sampled plan. This is the only route to ERR_SAMPLING_FLOOR_NOT_MET and it is invisible unless the floor is set above 40."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register one ALWAYS-mapped rule."
            - "Register category HIGH-FLOOR with sampling_floor_units 45 and category NORMAL-FLOOR with sampling_floor_units 40."
            - "Register one product in each with projected_annual_units 100000, scope both onto FULL_PRODUCT_TEST and create an INITIAL plan on each."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Activate both plans, as TestCoordinator."
          assert:
            - "The HIGH-FLOOR plan's activation returns HTTP 422 with error_id == \"ERR_SAMPLING_FLOOR_NOT_MET\": units_authorized is 40 after the cap while sampling_floor_units is 45."
            - "The plan stays in plan_state DRAFT with activated_at null and periodic_due_at null, so a refused activation has no side effects."
            - "The NORMAL-FLOOR plan activates with HTTP 200: units_authorized 40 equals sampling_floor_units 40 and the comparison is >=."
            - "No TestOrder can be booked against the DRAFT plan: the attempt returns HTTP 409 with error_id == \"ERR_PLAN_STATE_INVALID\"."

      - name: corner_validations_posture_gate_cascades_from_an_open_case_to_two_downstream_endpoints
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - calculations.product_compliance_posture
          - errors.ERR_PRODUCT_POSTURE_NOT_CLEARED
        distinguishing_aspect: "One validation reading a COMPUTED field that is itself derived from a third entity's state, enforced on two unrelated endpoints at once. The cascade is validation-side rather than side-effect-side: opening a case never touches the certificate or the batch, yet both operations start failing, and both start succeeding again when the case closes."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product with compliance_posture CLEARED, an ISSUED and FURNISHED certificate, one HELD compliant batch, and a second EVIDENCE_COMPLETE-stage DRAFT certificate awaiting issue."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Report a FAIL on a fresh order for one of the product's rules so a NoncomplianceCase opens, as LaboratoryUser."
            - "Attempt to issue the DRAFT certificate as CertificationOfficer, and attempt to release the HELD batch as DistributionManager."
            - "Drive the case through stop-distribution, a passing retest, approved corrective actions and closure, then retry both operations."
          assert:
            - "Immediately after the FAIL the product reports compliance_posture == \"SUSPENDED\" with risk_weighted_gap_score increased by the 15-point open-case penalty."
            - "The issue attempt returns HTTP 422 with error_id == \"ERR_PRODUCT_POSTURE_NOT_CLEARED\", and the release attempt returns the same status and code — one computed field, two endpoints."
            - "Neither refusal moved the certificate's issuance_status off DRAFT nor the batch's distribution_state off HELD."
            - "After the case reaches CLOSED the posture returns to CLEARED and both operations succeed, so the gate is derived live and not latched at first failure."

      - name: corner_validations_authentication_and_shape_checks_outrank_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: "The top of the priority ladder, where three guards of DIFFERENT categories all outrank existence: a request with no identity, a request from a role that may not call the endpoint, and a request with a malformed body all report their own error even though the path names a resource that does not exist. This is the ordering that decides whether an unauthenticated caller can probe for valid ids."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z. No product with id 'prd-does-not-exist' is ever created."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Call POST /compliance/products/prd-does-not-exist/sampling-plans with no identity headers."
            - "Call the same path as SupplierUser, a role the endpoint does not list."
            - "Call the same path as TestCoordinator with plan_type set to \"ANNUAL\", which is outside the enum."
            - "Call the same path as TestCoordinator with plan_type INITIAL."
          assert:
            - "The anonymous call returns HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\", not 404 — priority 1 outranks priority 6."
            - "The wrong-role call returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\", not 404 — priority 2 outranks priority 6, so role membership is decided before any lookup."
            - "The malformed-enum call returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\", not 404 — priority 5 outranks priority 6."
            - "Only the well-formed authorized call reaches the lookup and returns HTTP 404 with error_id == \"ERR_PRODUCT_NOT_FOUND\"."
            - "Every response body carries the fixed envelope with data null and a non-empty message on the error paths."

      - name: corner_validations_existence_precedes_state_and_state_precedes_business_rules
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: "The middle of the ladder: the archived-product lock at priority 8 outranks every operation-specific state check and every business rule, so an ARCHIVED product reports ERR_PRODUCT_ARCHIVED rather than the more specific error its request would otherwise earn. A missing child id still wins over both, which pins existence above the terminal-state lock."
        test_recipe:
          setup:
            - "Reach a CERTIFIED product, then archive it so certification_state is ARCHIVED. Keep a reference to its ACTIVE plan and its ISSUED certificate."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Attempt to book a TestOrder on the archived product naming a laboratory id that does not exist, as TestCoordinator."
            - "Attempt to book a well-formed TestOrder on the archived product."
            - "Attempt to submit the archived product for certification again."
            - "Attempt to create a production batch on the archived product, as DistributionManager."
          assert:
            - "The order naming a nonexistent laboratory returns HTTP 404 with error_id == \"ERR_LABORATORY_NOT_FOUND\": existence at priority 6 outranks the archive lock at priority 8."
            - "The well-formed order returns HTTP 409 with error_id == \"ERR_PRODUCT_ARCHIVED\", NOT \"ERR_PRODUCT_STATE_INVALID\" — priority 8 outranks priority 9 even though ARCHIVED is also an illegal from-state for that operation."
            - "The repeated submit-for-certification returns ERR_PRODUCT_ARCHIVED as well, again in preference to the operation-specific state error."
            - "The batch creation returns ERR_PRODUCT_ARCHIVED, so the lock reaches children of the product and not only the product row."
            - "Reads are unaffected: GET on the product and on its certificate both return HTTP 200."

      - name: corner_validations_state_guard_outranks_the_business_safety_guard_on_one_endpoint
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=21]
        distinguishing_aspect: "A state-versus-business-safety ordering probe on a single endpoint where both guards are violated at once."
        excluded_because:
          difficulty_instance: priority_conflict_state_plan_not_active_outranks_business_safety_lab_not_accredited
          rationale: "That instance violates the plan-state guard and the accreditation guard in the same request and asserts that the 409 state error is returned rather than the 422, then fixes the state and re-runs to see the 422."

      - name: corner_validations_full_gate_stack_satisfied_yields_the_success_path
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - validations[priority=26]
          - validations[priority=12]
        distinguishing_aspect: "The positive counterpart to the whole validation table on the most heavily guarded endpoint in the domain: certificate issuance passes only when the content is 100 percent complete, the posture is CLEARED, the issuing user is not the ordering user, and the issuance axis is DRAFT. All four are satisfied at once and the success response is asserted field by field, which prevents an implementation from earning its error tests by refusing everything."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and reach an EVIDENCE_COMPLETE product whose single rule has a REPORTED_PASS order ordered by user coordinator-imri, with compliance_posture CLEARED."
            - "Create a DRAFT certificate with all five content fields well formed, as CertificationOfficer user officer-vale."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/certificates/{certificate_id}/issue as CertificationOfficer with X-User-ID officer-vale."
          assert:
            - "The response is HTTP 200 with issuance_status == \"ISSUED\", issued_by_user_id == \"officer-vale\" and issued_at == \"2026-08-01T00:00:00Z\" taken from the logical clock."
            - "content_completeness_pct == 100 and cited_evidence_count >= length(cited_rule_ids), so the content guard was satisfied rather than skipped."
            - "The product's certification_state has advanced to CERTIFIED in the same response cycle, and a subsequent GET on the product confirms it."
            - "accompaniment_status is still \"NOT_FURNISHED\": issuance does not furnish, and the second axis must be advanced by its own call."
            - "A second issue call on the same certificate returns HTTP 409 with error_id == \"ERR_CERTIFICATE_STATE_INVALID\", so the success is idempotency-safe in the sense that it cannot be replayed."

  # ===========================================================================
  # 5. ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_endpoints_status_codes_split_creation_from_action_and_read
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/compliance/applicable-rules
          - endpoints.POST_/compliance/products/{product_id}/sampling-plans
          - endpoints.POST_/compliance/sampling-plans/{plan_id}/activate
          - endpoints.GET_/compliance/sampling-plans/{plan_id}
        distinguishing_aspect: "The declared status-code contract as a whole: every row-creating POST answers 201 while every state-advancing POST and every GET answers 200, including the two POSTs that update an existing row through a sub-path (independence-attestations and operational-state return 200 with the Laboratory, not 201). An implementation that returns 201 from all POSTs fails on the action endpoints."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Walk one full creation chain: applicable-rules, product-categories, category-rule-mappings, suppliers, laboratories, independence-attestations, operational-state, accreditations, products, component-parts, submit-for-certification, sampling-plans, activate; then read each row back."
          assert:
            - "POST /compliance/applicable-rules, /product-categories, /category-rule-mappings, /suppliers, /laboratories, /laboratories/{laboratory_id}/accreditations, /products, /products/{product_id}/component-parts, /products/{product_id}/sampling-plans, /compliance/test-orders, /compliance/products/{product_id}/certificates, /compliance/products/{product_id}/production-batches, /compliance/component-parts/{part_id}/certificates and /compliance/material-change-events all answer HTTP 201."
            - "POST /compliance/laboratories/{laboratory_id}/independence-attestations and /operational-state answer HTTP 200 and return the mutated Laboratory row, with version incremented, rather than a new row."
            - "Every action POST — submit-for-certification, activate, periodic-review, start-testing, report-result, cancel, issue, void, furnish, recall-accompaniment, tracking-label, release, rescind-release, retire, suspend, archive, issue-stop-distribution, order-retest, corrective-actions, close, reliance-documentation — answers HTTP 200."
            - "Every GET answers HTTP 200, and each single-resource GET returns exactly the row the creating call returned, including id, created_at, updated_at and version."
            - "Every response carries meta.api_request_id and meta.api_request_timestamp, with response_type \"object\" for single rows and \"array\" for lists."

      - name: corner_endpoints_action_endpoint_with_empty_input_still_mutates_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/compliance/sampling-plans/{plan_id}/activate
          - endpoints.POST_/compliance/products/{product_id}/archive
          - entities.SamplingPlan.fields.activated_at
        distinguishing_aspect: "Action endpoints whose `input:` is empty: the entire effect comes from the path and the logical clock, so the request body is irrelevant and an extra field in it must not change the outcome. The response must nevertheless show every declared side effect at once — state, stamped timestamp, computed sizes and the version bump."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a DRAFT INITIAL plan on a scoped product with projected_annual_units 6000 in a non-durable category with sampling_floor_units 1."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/sampling-plans/{plan_id}/activate with an empty body, as TestCoordinator."
            - "Re-read the plan and the product."
          assert:
            - "The response is HTTP 200 with plan_state \"ACTIVE\", activated_at \"2026-08-01T00:00:00Z\", units_authorized 6, units_committed 0, units_available 6, periodic_due_at \"2027-08-01T00:00:00Z\" and resample_trigger \"NONE\"."
            - "version has advanced from 1 to 2 on the plan row, and updated_at equals the logical clock."
            - "The GET of the plan returns byte-identical field values to the action's response, so no side effect is deferred past the response."
            - "The owning product moved to certification_state \"FULL_TEST_PROGRAM\" in the same cycle."
            - "Sending the same call again returns HTTP 409 with error_id == \"ERR_PLAN_STATE_INVALID\" and leaves activated_at unchanged."

      - name: corner_endpoints_computed_read_is_derived_and_never_stored
        claim_type: computed_read
        grounds:
          - endpoints.GET_/compliance/products/{product_id}/compliance-summary
          - calculations.product_risk_weighted_gap_score
          - calculations.product_compliance_posture
        distinguishing_aspect: "A read whose output shape is not an entity: fourteen derived fields with no id, no version and no updated_at, recomputed on every call. The proof that it is derived rather than stored is that its values change after a write to a DIFFERENT entity (a test order result, a case opening) with no write to the product's own row by the client."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build a two-rule product on FULL_PRODUCT_TEST with an active plan, both rules uncovered."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "GET the summary; report PASS on the first rule; GET the summary again; report FAIL on the second rule; GET the summary a third time."
          assert:
            - "The first read reports covered_rule_ids empty, uncovered_rule_ids of length 2, risk_weighted_gap_score 100 and compliance_posture \"RESTRICTED\"."
            - "The second read reports covered_rule_ids of length 1 and a strictly lower risk_weighted_gap_score, with no client write to the product between the two reads."
            - "The third read reports open_case_count 1 and compliance_posture \"SUSPENDED\", again with no write to the product row."
            - "The response body contains no id, no version, no created_at and no updated_at: it is a projection, and there is no endpoint that writes it."
            - "All four opaque roles receive the same values from the endpoint; LaboratoryUser and SupplierUser receive HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\"."

      - name: corner_endpoints_filtered_list_combines_filters_conjunctively_and_paginates
        claim_type: filtered_list
        grounds:
          - endpoints.GET_/compliance/test-orders
          - endpoints.GET_/compliance/production-batches
        distinguishing_aspect: "List semantics that no other instance touches: multiple optional filters combine with AND, an unknown filter VALUE inside an enum-typed filter is a 400 rather than an empty page, and limit/offset walk a deterministic order with total_count reported against the FILTERED set rather than the whole table."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build one product with two rules and two laboratories, then create six test orders: three against laboratory ONE (two SCHEDULED, one CANCELLED) and three against laboratory TWO (all SCHEDULED, one of them a retest)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "GET /compliance/test-orders with laboratory_id set to ONE and order_state SCHEDULED, as TestCoordinator."
            - "GET /compliance/test-orders with is_retest true."
            - "GET /compliance/test-orders with limit 2 and offset 0, then limit 2 and offset 2, then limit 2 and offset 4."
            - "GET /compliance/test-orders with order_state \"PENDING\"."
            - "GET /compliance/test-orders with limit 0, and again with limit 101."
          assert:
            - "The conjunctive filter returns exactly the two SCHEDULED orders of laboratory ONE and reports total_count 2, not 6 and not 3 — the count follows the filter."
            - "The is_retest filter returns exactly one row, and it is the order created through the case endpoint."
            - "The three pages return disjoint id sets whose union is all six orders, with has_more true on the first two pages and false on the third."
            - "An omitted limit defaults to 10 and an omitted offset to 0, so the unfiltered first page returns all six rows with has_more false."
            - "order_state \"PENDING\" returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\": the filter is enum-typed and closed, not a free-text match."
            - "limit 0 and limit 101 both return HTTP 400 with error_id == \"ERR_INVALID_REQUEST\", since the declared range is 1..100."

      - name: corner_endpoints_cross_reference_links_resolve_every_child_collection
        claim_type: cross_reference
        grounds:
          - endpoints.GET_/compliance/component-part-certificates
          - endpoints.GET_/compliance/lab-accreditations
          - endpoints.GET_/compliance/certificates
          - endpoints.GET_/compliance/material-change-events
        distinguishing_aspect: "Reverse navigation from every parent to its children, including the two relationships that are easy to leave unreachable: the self-referential certificate chain, reached by filtering certificates on supersedes_certificate_id, and the append-only material change log, reached by filtering on component_part_id. Each filter is proved to be scoped by returning rows of a sibling parent that must NOT appear."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build two products, each with one part, one supplier certificate, one accreditation on a shared laboratory, one issued then superseded product certificate, and one material change event on the part."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "For each parent, call its child list filter: component-parts?product_id, component-parts?supplier_id, component-part-certificates?component_part_id, component-part-certificates?laboratory_id, lab-accreditations?laboratory_id, lab-accreditations?rule_id, sampling-plans?product_id, test-orders?sampling_plan_id, certificates?product_id, certificates?supersedes_certificate_id, production-batches?certificate_id, noncompliance-cases?triggering_test_order_id, material-change-events?component_part_id, category-rule-mappings?category_id."
          assert:
            - "Every filtered list returns exactly the children of the named parent and none of the sibling product's rows."
            - "certificates?supersedes_certificate_id returns exactly the one successor certificate whose supersedes_certificate_id equals the superseded row's id, which is the only route from a certificate to its successor."
            - "material-change-events?component_part_id returns the append-only event rows for that part, and those rows carry created_at but no version field."
            - "noncompliance-cases?triggering_test_order_id returns the single case opened by the failing order, linking a case back to its trigger without scanning."
            - "Filtering with an id that exists but belongs to another entity type returns an empty page with total_count 0, not a 404."

      - name: corner_endpoints_clock_endpoint_default_and_stamping
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/compliance/_clock/set_current_utc
          - entities.Product.fields.created_at
        distinguishing_aspect: "The logical clock itself: before any set call the clock reads 2026-08-01T00:00:00Z, so a run that never touches it still produces deterministic timestamps, and every system-stamped field in the domain takes its value from the clock rather than from wall time. Only ComplianceAdministrator may move it."
        test_recipe:
          setup:
            - "Start from an empty database and do NOT call the clock endpoint."
          setup_api_calls: []
          trigger:
            - "Create a rule, a category, a mapping and a product without touching the clock, as ComplianceAdministrator."
            - "POST /compliance/_clock/set_current_utc with to_iso8601 2026-09-15T12:00:00Z, then create a second product."
            - "Call the clock endpoint as TestCoordinator."
          assert:
            - "Every row created before the clock was set reports created_at == \"2026-08-01T00:00:00Z\" and updated_at == \"2026-08-01T00:00:00Z\", which is the mandated default."
            - "The set call returns HTTP 200 with current_utc == \"2026-09-15T12:00:00Z\"."
            - "The second product reports created_at == \"2026-09-15T12:00:00Z\", so the clock is the single source of now."
            - "The clock call as TestCoordinator returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\"."
            - "A to_iso8601 value that is not an ISO-8601 instant returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\"."

      - name: corner_endpoints_conditional_action_release_requires_four_independent_preconditions
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/compliance/production-batches/{batch_id}/release
          - validations[priority=13]
          - validations[priority=24]
          - validations[priority=25]
          - validations[priority=12]
        distinguishing_aspect: "The most heavily conditioned action in the domain, with each of its four preconditions failed in isolation on a separate batch so that four different error codes come out of ONE endpoint: batch state, product posture, tracking-label completeness and the certificate's two axes. The fifth call satisfies all four and succeeds."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a CERTIFIED product with compliance_posture CLEARED and an ISSUED and FURNISHED certificate, plus a second certificate that is ISSUED but NOT_FURNISHED."
            - "Create four batches: one already RELEASED, one referencing the not-furnished certificate, one with label_on_packaging false, and one fully clean."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Attempt to release each of the four batches, as DistributionManager."
            - "Open a case on the product so posture leaves CLEARED, then attempt to release the clean batch again."
          assert:
            - "The already-released batch returns HTTP 409 with error_id == \"ERR_BATCH_STATE_INVALID\"."
            - "The batch on the not-furnished certificate returns HTTP 409 with error_id == \"ERR_CERTIFICATE_STATE_INVALID\", because both axes are required at once."
            - "The unlabelled batch returns HTTP 422 with error_id == \"ERR_TRACKING_LABEL_NONCOMPLIANT\"."
            - "The clean batch returns HTTP 200 with distribution_state \"RELEASED\" and released_at equal to the logical clock, and the product's units_released rises by the batch quantity while units_held falls by the same amount."
            - "After the case opens, the clean batch's sibling returns HTTP 422 with error_id == \"ERR_PRODUCT_POSTURE_NOT_CLEARED\", so the same endpoint yields a fourth distinct code."

      - name: corner_endpoints_entity_backed_write_endpoints_derive_the_actor_from_identity
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/compliance/test-orders/{order_id}/report-result
          - endpoints.POST_/compliance/component-parts/{part_id}/certificates
          - entities.ComponentPartCertificate.fields.supplier_id
        distinguishing_aspect: "Two write endpoints whose most important field is never in the request: the supplier of a component part certificate is COMPUTED from the calling identity's backing Supplier, and the reporting user of a result is stamped from the header. A client cannot name a different supplier, because there is no field in which to name one."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build a product with one part supplied by supplier NORTHWIND, an accredited laboratory MERIDIAN with a current attestation, and a SCHEDULED order on MERIDIAN taken into testing."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/component-parts/{part_id}/certificates as SupplierUser with X-User-ID supplier-user-northwind."
            - "POST /compliance/test-orders/{order_id}/report-result with measured_value 42 as LaboratoryUser with X-User-ID lab-user-meridian."
          assert:
            - "The component part certificate reports supplier_id equal to NORTHWIND's id, taken from the calling identity and not from the body — the endpoint's input list contains no supplier_id at all."
            - "Supplier.certificates_issued_count for NORTHWIND has risen by 1."
            - "The reported order carries reported_by_user_id == \"lab-user-meridian\", reported_at equal to the logical clock, measured_value 42 and a computed result field."
            - "measured_value is declared system-sourced on TestOrder and input-sourced only on this endpoint, so a client cannot set it through any create call."

      - name: corner_endpoints_reads_never_mutate_and_refused_writes_leave_no_trace
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/compliance/products/{product_id}
          - endpoints.GET_/compliance/products/{product_id}/compliance-summary
          - endpoints.POST_/compliance/production-batches/{batch_id}/release
        distinguishing_aspect: "The read/write boundary asserted from both sides: no GET ever advances version or updated_at on any row, and a POST that is refused by any validation leaves version, updated_at and every computed field exactly where they were. This is the claim that catches an implementation which bumps the version before running its guards."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a CERTIFIED product with one HELD batch whose label_on_packaging is false, so release will be refused."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Read the product, its certificate, the batch and the compliance summary; then advance the clock to 2026-09-01T00:00:00Z and read all four again."
            - "Attempt to release the unlabelled batch three times, as DistributionManager, then read the batch and the product."
          assert:
            - "Every row's version and updated_at are identical across the two rounds of reads, even though the clock moved between them: reads do not stamp."
            - "The three refused releases all return HTTP 422 with error_id == \"ERR_TRACKING_LABEL_NONCOMPLIANT\"."
            - "After the three refusals the batch still reports distribution_state \"HELD\", released_at null, release_rescind_count 0 and the same version it had before, and the product's units_held and units_released are unchanged."
            - "The compliance summary is likewise unchanged, so no partial side effect leaked from the refused writes."

  # ===========================================================================
  # 6. ERRORS
  # ===========================================================================
  - section: errors
    instances:

      - name: corner_errors_fifteen_not_found_codes_are_one_per_entity_and_never_interchangeable
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors.ERR_RULE_NOT_FOUND
          - errors.ERR_CATEGORY_NOT_FOUND
          - errors.ERR_MAPPING_NOT_FOUND
          - errors.ERR_SUPPLIER_NOT_FOUND
          - errors.ERR_LABORATORY_NOT_FOUND
          - errors.ERR_ACCREDITATION_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_COMPONENT_PART_NOT_FOUND
          - errors.ERR_PART_CERTIFICATE_NOT_FOUND
          - errors.ERR_SAMPLING_PLAN_NOT_FOUND
          - errors.ERR_TEST_ORDER_NOT_FOUND
          - errors.ERR_CERTIFICATE_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND
        distinguishing_aspect: "All fifteen existence codes triggered individually, including the three that are only reachable through their own path parameter (mapping retire, accreditation suspend, part certificate reliance) and the four that are reachable only through a BODY foreign key (supplier_id on part creation, sampling_plan_id on order booking, certificate_id on batch creation, component_part_id on a material change event). A single generic ERR_NOT_FOUND fails fifteen assertions."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build one fully certified product so that every entity type has at least one real row to contrast against."
            - "Fix the literal id 'zzz-missing' as the nonexistent reference used in every probe."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "GET each single-resource path with the missing id: applicable-rules, product-categories, category-rule-mappings, suppliers, laboratories, lab-accreditations, products, component-parts, component-part-certificates, sampling-plans, test-orders, certificates, production-batches, noncompliance-cases, material-change-events."
            - "POST /compliance/category-rule-mappings/zzz-missing/retire, POST /compliance/lab-accreditations/zzz-missing/suspend and POST /compliance/component-part-certificates/zzz-missing/reliance-documentation."
            - "POST /compliance/products/{product_id}/component-parts with supplier_id zzz-missing; POST /compliance/test-orders with sampling_plan_id zzz-missing; POST /compliance/products/{product_id}/production-batches with certificate_id zzz-missing; POST /compliance/material-change-events with subject_type COMPONENT_PART and component_part_id zzz-missing."
          assert:
            - "Each of the fifteen GETs returns HTTP 404 with the code named for its own entity: ERR_RULE_NOT_FOUND, ERR_CATEGORY_NOT_FOUND, ERR_MAPPING_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_LABORATORY_NOT_FOUND, ERR_ACCREDITATION_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_COMPONENT_PART_NOT_FOUND, ERR_PART_CERTIFICATE_NOT_FOUND, ERR_SAMPLING_PLAN_NOT_FOUND, ERR_TEST_ORDER_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_CASE_NOT_FOUND and ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND respectively."
            - "The three action probes return ERR_MAPPING_NOT_FOUND, ERR_ACCREDITATION_NOT_FOUND and ERR_PART_CERTIFICATE_NOT_FOUND — a mapping is not reported as a missing category, an accreditation is not reported as a missing laboratory and a part certificate is not reported as a missing part."
            - "The four body-reference probes return ERR_SUPPLIER_NOT_FOUND, ERR_SAMPLING_PLAN_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND and ERR_COMPONENT_PART_NOT_FOUND, so existence is checked on foreign keys and not only on path segments."
            - "A request whose path names two missing resources reports the LEFTMOST one: POST /compliance/products/zzz-missing/production-batches with certificate_id zzz-missing returns ERR_PRODUCT_NOT_FOUND."
            - "Every 404 body carries response_type \"error\" with a non-empty message and no partial data."

      - name: corner_errors_nine_state_conflict_codes_are_one_per_entity_lifecycle
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PRODUCT_ARCHIVED
          - errors.ERR_PRODUCT_STATE_INVALID
          - errors.ERR_ORDER_STATE_INVALID
          - errors.ERR_PLAN_STATE_INVALID
          - errors.ERR_CERTIFICATE_STATE_INVALID
          - errors.ERR_BATCH_STATE_INVALID
          - errors.ERR_CASE_STATE_INVALID
          - errors.ERR_PART_CERTIFICATE_STATE_INVALID
          - errors.ERR_ACCREDITATION_STATE_INVALID
        distinguishing_aspect: "Every entity with a lifecycle owns its own 409 code, and each is provoked from a legal-looking but wrong from-state, with the archived-product lock kept distinct from the ordinary product state error. Nine codes, nine entities, one endpoint each — the set that proves state guards are not funnelled into a single conflict code."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build a fully exercised product: an ACTIVE plan, a SCHEDULED order, a DRAFT certificate, a HELD batch, an OPEN case, a RELIED_UPON component part certificate, a SUSPENDED accreditation and a second product left in DRAFT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Archive the CERTIFIED product, then attempt to book an order on it."
            - "Attempt to archive the second product while it is still DRAFT."
            - "Attempt report-result on the SCHEDULED order."
            - "Attempt to activate the already ACTIVE plan."
            - "Attempt to furnish the DRAFT certificate."
            - "Attempt to rescind-release the HELD batch."
            - "Attempt to close the OPEN case."
            - "Attempt reliance-documentation on the RELIED_UPON component part certificate."
            - "Attempt to suspend the already SUSPENDED accreditation."
          assert:
            - "The order on the archived product returns HTTP 409 ERR_PRODUCT_ARCHIVED."
            - "Archiving the DRAFT product returns HTTP 409 ERR_PRODUCT_STATE_INVALID, a different code from the archive lock."
            - "report-result on a SCHEDULED order returns HTTP 409 ERR_ORDER_STATE_INVALID: start-testing must come first."
            - "The repeat activation returns HTTP 409 ERR_PLAN_STATE_INVALID."
            - "Furnishing a DRAFT certificate returns HTTP 409 ERR_CERTIFICATE_STATE_INVALID: the accompaniment axis cannot move before issuance."
            - "Rescinding a HELD batch returns HTTP 409 ERR_BATCH_STATE_INVALID."
            - "Closing an OPEN case returns HTTP 409 ERR_CASE_STATE_INVALID."
            - "A second reliance decision returns HTTP 409 ERR_PART_CERTIFICATE_STATE_INVALID, because only SUBMITTED accepts one."
            - "The second suspension returns HTTP 409 ERR_ACCREDITATION_STATE_INVALID."
            - "All nine responses leave their subject rows untouched, with the same version as before the attempt."

      - name: corner_errors_status_code_discipline_across_the_five_non_404_families
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_PRODUCT_TESTING_BUDGET_EXCEEDED
          - errors.ERR_STALE_PRODUCT_VERSION
          - errors.ERR_MAPPING_DUPLICATE
          - errors.ERR_BATCH_OUTSIDE_CERTIFICATE_COVERAGE
        distinguishing_aspect: "One probe per HTTP status the domain uses, asserted as a set so the statuses cannot drift into one another: 400 for a malformed shape, 402 for the fiscal ceiling, 409 for a uniqueness clash, 412 for a stale version and 422 for a semantically well-formed request that the domain refuses. The 402 and 412 choices are the two that a generic implementation gets wrong."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build a product with testing_budget_cents 20000 whose first order already consumes it, an existing ACTIVE category-rule mapping, and an ISSUED certificate whose manufacture_date_month is 2026-08."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/products with projected_annual_units 0, which is below the declared minimum."
            - "Book a second order that would push the summed invoice past testing_budget_cents."
            - "POST /compliance/products/{product_id}/certificates with expected_product_version one below the product's current version."
            - "POST /compliance/category-rule-mappings for the pair that already has an ACTIVE mapping."
            - "POST /compliance/products/{product_id}/production-batches with produced_on 2026-09-15T00:00:00Z against the 2026-08 certificate."
          assert:
            - "The malformed create returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\"."
            - "The over-budget order returns HTTP 402 with error_id == \"ERR_PRODUCT_TESTING_BUDGET_EXCEEDED\" — the only 402 in the domain, and not a 422."
            - "The stale certificate create returns HTTP 412 with error_id == \"ERR_STALE_PRODUCT_VERSION\" — a precondition-failed, not a 409."
            - "The duplicate mapping returns HTTP 409 with error_id == \"ERR_MAPPING_DUPLICATE\"."
            - "The out-of-month batch returns HTTP 422 with error_id == \"ERR_BATCH_OUTSIDE_CERTIFICATE_COVERAGE\": the request is well formed and every reference exists, so it is neither 400 nor 404 nor 409."
            - "Each of the five bodies carries exactly one error_id and no data payload."

      - name: corner_errors_invalid_request_covers_every_shape_rule_declared_on_the_inputs
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - entities.ApplicableRule.fields.severity_weight
          - entities.ProductionBatch.fields.batch_code
        distinguishing_aspect: "The single 400 code driven from six structurally different violations — missing required field, unknown enum member, regex mismatch, numeric range, out-of-range pagination and wrong JSON type — so the shape check is proved to cover constraints rather than only presence. Each probe is otherwise a request that would have succeeded."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build the canonical certified product so that every other guard would pass."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/applicable-rules omitting periodic_interval_months."
            - "POST /compliance/applicable-rules with hazard_class \"SHARP_EDGE\"."
            - "POST /compliance/applicable-rules with severity_weight 11."
            - "POST /compliance/products/{product_id}/production-batches with batch_code \"RVR090_000601\" (underscore instead of hyphen)."
            - "POST /compliance/products with projected_annual_units \"6000\" as a string."
            - "GET /compliance/products with offset -1."
          assert:
            - "All six return HTTP 400 with error_id == \"ERR_INVALID_REQUEST\"."
            - "The severity_weight probe is refused at 11 while 10 is accepted, so the declared 1..10 range is enforced at its upper bound."
            - "The batch_code probe is refused for the underscore while \"RVR090-000601\" is accepted, so the declared pattern is enforced rather than merely the length."
            - "The offset probe is refused at -1 while 0 is accepted, and limit is refused at 0 and at 101 while accepted at 1 and 100."
            - "No row is created by any of the six calls: a follow-up list shows the same total_count as before."

      - name: corner_errors_business_safety_codes_each_have_a_distinct_provocation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATE_CONTENT_INCOMPLETE
          - errors.ERR_PRODUCT_POSTURE_NOT_CLEARED
          - errors.ERR_TRACKING_LABEL_NONCOMPLIANT
          - errors.ERR_MANUFACTURER_OWNED_LAB_FORBIDDEN
          - errors.ERR_LAB_BARRED
        distinguishing_aspect: "The 422 safety family reached one code at a time on the certification and distribution endpoints, with the other four guards satisfied in each probe. Together with the referential and constraint instances in the validations section, this closes the 422 family so that no business code is left unreachable."
        excluded_because:
          difficulty_instance: cross_entity_test_order_start_blocked_by_laboratory_operational_state_and_by_attestation_expiry
          rationale: "The barred-laboratory and attestation codes are asserted by that cross-entity instance, and the content, posture and tracking-label codes are each provoked in isolation by the conditional-action release instance and the full-gate-stack issuance instance of this same design, so a further recipe would restate literals already pinned elsewhere."

      - name: corner_errors_temporal_and_capacity_codes_are_distinct_from_state_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LAB_SLOT_CAPACITY_EXCEEDED
          - errors.ERR_COMPONENT_COVERAGE_OVERLAP
          - errors.ERR_PERIODIC_REVIEW_NOT_DUE
          - errors.ERR_WINDOW_INVALID
        distinguishing_aspect: "Four temporal codes that share the 409/422 space with the state family but mean something entirely different."
        excluded_because:
          difficulty_instance: temporal_overlap_laboratory_slots_half_open_aggregate_capacity_two_with_adjacency_allowed
          rationale: "That instance and its component-coverage companion assert ERR_LAB_SLOT_CAPACITY_EXCEEDED and ERR_COMPONENT_COVERAGE_OVERLAP at their exact interval boundaries, and the temporal-window instance in this file's validations section asserts ERR_WINDOW_INVALID and ERR_PERIODIC_REVIEW_NOT_DUE with their opposite comparators."

      - name: corner_errors_error_envelope_is_identical_across_every_status
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "The envelope contract on the error path, which no other instance asserts structurally: whatever the status, the body carries meta with an api_request_id and an api_request_timestamp, response_type \"error\", and a data object holding exactly error_id and message. The success envelope by contrast carries response_type \"object\" or \"array\"."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and reach a noncompliance case in RETEST_PASSED with a recorded corrective action, so a stale-version probe is available."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Call GET /compliance/products/{product_id} with no identity headers, then as SupplierUser, then with a missing id as ComplianceAdministrator."
            - "POST /compliance/noncompliance-cases/{case_id}/corrective-actions with a stale expected_case_version, as CertificationOfficer."
          assert:
            - "The four responses are HTTP 401 ERR_UNAUTHENTICATED, HTTP 403 ERR_ROLE_NOT_PERMITTED, HTTP 404 ERR_PRODUCT_NOT_FOUND and HTTP 412 ERR_STALE_CASE_VERSION."
            - "All four bodies have response_type \"error\" and a data object whose keys are exactly error_id and message, with message non-empty."
            - "All four bodies carry meta.api_request_id and meta.api_request_timestamp, and the timestamps are ISO-8601."
            - "api_request_id differs between the four responses, so it is per-request and is never used as a business identifier."
            - "A successful GET of the same product returns response_type \"object\" with the row in data and no error_id key anywhere."

  # ===========================================================================
  # 7. RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_rbac_compliance_administrator_owns_reference_data_and_nothing_operational
        claim_type: role_permission
        grounds:
          - roles.ComplianceAdministrator
        distinguishing_aspect: "The reference-data role's boundary in both directions: it is the only role that may register rules, categories, mappings, suppliers, laboratories, attestations, accreditations, products, parts and material change events, and it is barred from every operational act — booking tests, recording reliance, issuing certificates and moving inventory. The negative half is what stops the design collapsing into a single super-role."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and build a certified product with an ACTIVE plan, a DRAFT certificate, a SUBMITTED component part certificate and a HELD batch."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Call each of the fourteen ComplianceAdministrator-exclusive operations as ComplianceAdministrator, then as TestCoordinator, then as CertificationOfficer, then as DistributionManager, then as LaboratoryUser, then as SupplierUser."
            - "As ComplianceAdministrator call POST /compliance/test-orders, POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation, POST /compliance/certificates/{certificate_id}/issue, POST /compliance/production-batches/{batch_id}/release and POST /compliance/products/{product_id}/submit-for-certification."
          assert:
            - "Every exclusive operation succeeds for ComplianceAdministrator and returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\" for each of the other five roles."
            - "All five operational calls made as ComplianceAdministrator return HTTP 403 ERR_ROLE_NOT_PERMITTED."
            - "The 403s are decided before existence and before state: the same calls against a nonexistent id and against a wrong-state row still return 403."
            - "ComplianceAdministrator can read every GET in the domain, including the compliance summary, so the restriction is on writes only."

      - name: corner_rbac_four_opaque_roles_partition_the_write_surface_with_no_overlap
        claim_type: role_permission
        grounds:
          - roles.TestCoordinator
          - roles.CertificationOfficer
          - roles.DistributionManager
          - roles.ComplianceAdministrator
        distinguishing_aspect: "The write surface as a PARTITION: every mutating endpoint in the domain belongs to exactly one role's exclusive list, and the matrix is asserted cell by cell rather than role by role. The interesting cells are the adjacent ones — the coordinator books a retest but the manager issues the stop-distribution that precedes it, and the officer approves corrective actions on the same case."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a product with a failing order so a case exists in OPEN, plus an ACTIVE plan, a DRAFT certificate and a HELD batch."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Attempt each of the four case endpoints (issue-stop-distribution, order-retest, corrective-actions, close) as all four opaque roles."
            - "Attempt submit-for-certification, sampling plan create, activate, periodic-review, test-order create and cancel as all four opaque roles."
            - "Attempt reliance-documentation, certificate create, issue and void as all four opaque roles."
            - "Attempt furnish, recall-accompaniment, batch create, tracking-label, release and rescind-release as all four opaque roles."
          assert:
            - "issue-stop-distribution succeeds only as DistributionManager; order-retest only as TestCoordinator; corrective-actions and close only as CertificationOfficer — three roles on one case, in that order."
            - "Every plan and order endpoint succeeds only as TestCoordinator; every reliance and certificate-issuance endpoint only as CertificationOfficer; every accompaniment and inventory endpoint only as DistributionManager."
            - "No endpoint succeeds for two different roles: each of the twenty-odd probes yields exactly one 2xx and three 403 ERR_ROLE_NOT_PERMITTED."
            - "The certificate lifecycle is deliberately split across two roles — issue and void are the officer's, furnish and recall-accompaniment are the manager's — so a single actor can never take a certificate from draft to shipped."

      - name: corner_rbac_laboratory_identity_is_scoped_to_its_own_orders
        claim_type: entity_scoped_access
        grounds:
          - roles.LaboratoryUser
          - errors.ERR_LAB_NOT_ASSIGNED
        distinguishing_aspect: "An entity-backed identity whose scope check is distinct from its role check: a LaboratoryUser holds the right role for start-testing and report-result but may only touch orders whose laboratory_id matches the laboratory behind the caller, which yields 403 ERR_LAB_NOT_ASSIGNED rather than ERR_ROLE_NOT_PERMITTED. The distinction is invisible with only one laboratory in the fixture, so two are required."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register two accredited INDEPENDENT laboratories, MERIDIAN (backing user lab-user-meridian) and ALTAIR (backing user lab-user-altair), both with current attestations."
            - "Book one order against each laboratory on the same product and plan."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST start-testing on MERIDIAN's order as LaboratoryUser lab-user-altair."
            - "POST start-testing on MERIDIAN's order as LaboratoryUser lab-user-meridian, then report-result on it as lab-user-altair."
            - "POST report-result on MERIDIAN's order as lab-user-meridian."
            - "POST start-testing on MERIDIAN's order as TestCoordinator."
          assert:
            - "The cross-laboratory start-testing returns HTTP 403 with error_id == \"ERR_LAB_NOT_ASSIGNED\", NOT ERR_ROLE_NOT_PERMITTED: the role is right and the assignment is wrong."
            - "The cross-laboratory report-result returns the same code, so the scope is enforced on every write and not only at intake."
            - "The matching calls succeed, and the order carries reported_by_user_id == \"lab-user-meridian\"."
            - "The TestCoordinator attempt returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\", proving the two 403 codes are decided by different checks in the declared order (priority 2 before priority 3)."
            - "GET /compliance/test-orders as lab-user-altair with laboratory_id set to MERIDIAN returns HTTP 200 with an empty page rather than a 403: reads are scoped by filtering, writes by refusal."

      - name: corner_rbac_supplier_identity_is_scoped_to_the_parts_it_supplies
        claim_type: entity_scoped_access
        grounds:
          - roles.SupplierUser
          - errors.ERR_SUPPLIER_NOT_PART_OWNER
        distinguishing_aspect: "The second entity-backed identity, whose scope is resolved through a DIFFERENT relationship: the caller's Supplier must equal ComponentPart.supplier_id, one hop away from the endpoint's path parameter, and the supplier's only write in the whole domain is filing a component part certificate. The two entity-backed roles therefore have different scope codes and different join paths."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; register suppliers NORTHWIND (backing supplier-user-northwind) and CASCADE (backing supplier-user-cascade), both with reliance_agreement_state ON_FILE."
            - "Register a product with one part supplied by NORTHWIND and one supplied by CASCADE, and an accredited laboratory."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/component-parts/{northwind_part_id}/certificates as SupplierUser supplier-user-cascade."
            - "POST /compliance/component-parts/{northwind_part_id}/certificates as SupplierUser supplier-user-northwind."
            - "POST /compliance/component-parts/{northwind_part_id}/certificates as ComplianceAdministrator."
            - "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation as SupplierUser supplier-user-northwind."
          assert:
            - "The cross-supplier filing returns HTTP 403 with error_id == \"ERR_SUPPLIER_NOT_PART_OWNER\"."
            - "The owner's filing returns HTTP 201 with supplier_id equal to NORTHWIND's id, computed from the identity."
            - "The administrator's attempt returns HTTP 403 ERR_ROLE_NOT_PERMITTED: filing supplier evidence is the supplier's exclusive operation, which keeps the reliance chain attributable."
            - "The supplier's attempt to record reliance on its own certificate returns HTTP 403 ERR_ROLE_NOT_PERMITTED — the decision to rely belongs to the CertificationOfficer, which is the heart of the reliance-documentation requirement."
            - "supplier-user-cascade can still GET the NORTHWIND part, so the scope restriction is on the write path."

      - name: corner_rbac_segregation_of_duties_compares_user_ids_not_roles
        claim_type: role_permission
        grounds:
          - validations[priority=26]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "A restriction that no role assignment can satisfy: two callers with the SAME role are treated differently because the check compares X-User-ID against a stored user id on another row. It is enforced at two unrelated places — certificate issuance against the ordering coordinator, and case closure against the opening user — and it is the only 403 that a correctly-roled, correctly-scoped caller can receive."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Reach an EVIDENCE_COMPLETE product whose single passing order was booked by TestCoordinator user coordinator-imri, and whose DRAFT certificate has content_completeness_pct 100."
            - "Reach a case in CORRECTIVE_ACTION_APPROVED that was opened by user coordinator-imri, with a compliant HELD batch on the product."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/certificates/{certificate_id}/issue as CertificationOfficer with X-User-ID coordinator-imri."
            - "POST /compliance/certificates/{certificate_id}/issue as CertificationOfficer with X-User-ID officer-vale."
            - "POST /compliance/noncompliance-cases/{case_id}/close as CertificationOfficer with X-User-ID coordinator-imri."
            - "POST /compliance/noncompliance-cases/{case_id}/close as CertificationOfficer with X-User-ID officer-vale."
          assert:
            - "The issuance by coordinator-imri returns HTTP 403 with error_id == \"ERR_SEGREGATION_OF_DUTIES\", even though that user holds the CertificationOfficer role for the call — the refusal comes from TestOrder.ordered_by_user_id."
            - "The issuance by officer-vale returns HTTP 200 with issued_by_user_id == \"officer-vale\"."
            - "The closure by coordinator-imri returns HTTP 403 with the same code, sourced from NoncomplianceCase.opened_by_user_id, so one code covers two different stored ids."
            - "The closure by officer-vale returns HTTP 200 with closed_by_user_id == \"officer-vale\", and issued_by_user_id and closed_by_user_id are stored separately so an audit can distinguish the two acts."
            - "The check is per evidence row: if ANY test order cited by the certificate was booked by the issuing user the issuance is refused, so adding a second order booked by coordinator-imri re-triggers the 403 for officer-vale only if officer-vale booked one."

      - name: corner_rbac_unauthenticated_requests_are_refused_before_any_role_lookup
        claim_type: role_permission
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "The identity requirement itself, applied uniformly to reads as well as writes: there is no public endpoint in the domain, not even the reference-data lists, and a request carrying a role header with no user id is as unauthenticated as one carrying nothing."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and create one rule, one product and one batch."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Call GET /compliance/applicable-rules, GET /compliance/products/{product_id}, GET /compliance/products/{product_id}/compliance-summary, POST /compliance/products and POST /compliance/_clock/set_current_utc with no identity headers at all."
            - "Call the same five with a role header but no user id, and with a user id but no role."
          assert:
            - "All five headerless calls return HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\", including the two GETs on reference and product data."
            - "The partial-header variants also return HTTP 401: both halves of the identity are required."
            - "No 401 response reveals whether the named product exists: the same status and code come back for a nonexistent id."
            - "Supplying both headers with a role that exists turns the same calls into 200, 200, 200, 201 and 200 respectively for ComplianceAdministrator."

  # ===========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_layers_optimistic_concurrency_certificate_create_guards_the_supersession_pointer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certificate-create-stale-product]
          - entities.ChildrensProductCertificate.fields.supersedes_certificate_id
          - entities.ChildrensProductCertificate.fields.expected_product_version_seen
          - errors.ERR_STALE_PRODUCT_VERSION
        distinguishing_aspect: "The full mechanical contract of the first version guard: the field is required, a matching value succeeds and records what it saw, a value one behind is refused with 412, the guarded write itself bumps the parent version so a replay of the same value fails, and a re-read plus retry succeeds. The reason the guard exists is the supersession pointer — a writer working from an old view of the product would pin the wrong predecessor certificate and the wrong cited_rule_ids snapshot."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z and reach an EVIDENCE_COMPLETE product with a passing order for its single rule and compliance_posture CLEARED."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "GET /compliance/products/${product_id}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "officer-vale"
              captures:
                product_version_before: "$.data.version"
            - call: "POST /compliance/products/${product_id}/certificates"
              payload:
                expected_product_version: "${product_version_before}"
                certifier_legal_name: "Rover Juvenile Products LLC"
                certifier_contact_email: "compliance@rover-juvenile.example"
                manufacture_place: "Ho Chi Minh City, VN"
                manufacture_date_month: "2026-08"
                testing_place: "Portland, OR, US"
              as: CertificationOfficer
              as_user_id: "officer-vale"
              captures:
                first_certificate_id: "$.data.id"
          trigger:
            - "Re-submit the same certificate create with expected_product_version still set to ${product_version_before}, as CertificationOfficer officer-vale."
            - "Re-read the product, then submit again with the freshly read version."
          assert:
            - "The setup create returned HTTP 201 with expected_product_version_seen equal to ${product_version_before} and supersedes_certificate_id null, since no prior certificate existed."
            - "That create incremented Product.version by exactly 1, so the product no longer matches the value the client held."
            - "The replay with the stale value returns HTTP 412 with error_id == \"ERR_STALE_PRODUCT_VERSION\" and creates no row."
            - "After re-reading the product, the retry returns HTTP 201 and the new certificate's supersedes_certificate_id equals ${first_certificate_id}, while the first certificate's issuance_status has moved to SUPERSEDED."
            - "Omitting expected_product_version entirely returns HTTP 400 with error_id == \"ERR_INVALID_REQUEST\": the field is required, not advisory."
            - "A value ABOVE the current version is also refused with HTTP 412, so the check is equality and not a lower bound."

      - name: corner_layers_optimistic_concurrency_corrective_action_guards_the_revision_counter
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[corrective-action-supersede-stale-case]
          - entities.NoncomplianceCase.fields.corrective_action_revision
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "The second version guard, on a DIFFERENT parent and protecting a different thing: a monotonically rising revision counter rather than a supersession pointer, and its parent is bumped by several unrelated endpoints (stop-distribution, retest ordering) so a client's view goes stale without anyone touching the corrective action at all. That is what separates this instance from the certificate guard."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a NoncomplianceCase in RETEST_PASSED after one failing order, one stop-distribution and one passing retest."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "GET /compliance/noncompliance-cases/${case_id}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "officer-vale"
              captures:
                case_version_before: "$.data.version"
            - call: "POST /compliance/noncompliance-cases/${case_id}/corrective-actions"
              payload:
                expected_case_version: "${case_version_before}"
                corrective_action_ref: "CAP-2026-0041"
              as: CertificationOfficer
              as_user_id: "officer-vale"
              captures:
                revision_after_first: "$.data.corrective_action_revision"
          trigger:
            - "Submit a second corrective action with corrective_action_ref CAP-2026-0042 while still holding ${case_version_before}."
            - "Re-read the case and submit CAP-2026-0042 with the fresh version."
          assert:
            - "The first recorded plan returned HTTP 200 with corrective_action_ref \"CAP-2026-0041\", corrective_action_revision 1 and case_state CORRECTIVE_ACTION_APPROVED."
            - "The stale second submission returns HTTP 412 with error_id == \"ERR_STALE_CASE_VERSION\", leaves corrective_action_ref at \"CAP-2026-0041\" and leaves corrective_action_revision at 1."
            - "After the re-read the retry returns HTTP 200 with corrective_action_ref \"CAP-2026-0042\" and corrective_action_revision 2, so the counter rises only on accepted writes."
            - "The 412 uses the case's own version field and its own error code, distinct from the product guard's ERR_STALE_PRODUCT_VERSION — the two guards never share a code."
            - "Any earlier case-mutating call (issue-stop-distribution or order-retest) also advances NoncomplianceCase.version, so a client that read the case before those calls is refused here even though no corrective action existed yet."

      - name: corner_layers_cascading_side_effects_reach_three_entities_from_one_report
        claim_type: complexity_layer
        grounds:
          - state_machines.TestOrder.IN_TESTING_to_REPORTED_FAIL
          - calculations.product_compliance_posture
        distinguishing_aspect: "The declared cascading_side_effects layer, seen from the layer's own perspective."
        excluded_because:
          difficulty_instance: transitive_cascade_failing_result_suspends_product_withdraws_certificate_stops_batch
          rationale: "That instance walks the four-hop chain from a single report-result call through case creation, product suspension, certificate withdrawal and batch stop-distribution, asserting each hop's row state and the ledger totals, which is the layer in full."

      - name: corner_layers_dual_variant_calculation_appears_in_two_unrelated_formulas
        claim_type: complexity_layer
        grounds:
          - calculations.sampling_plan_required_sample_size
          - calculations.noncompliance_corrective_scope_units
        distinguishing_aspect: "The declared dual_variant_calculation layer, which the design realises twice on purpose."
        excluded_because:
          difficulty_instance: dual_variant_sampling_size_initial_forward_looking_versus_periodic_chronological
          rationale: "That instance and its corrective-scope counterpart each pin both variants of one formula with computed literals and assert the divergence, and the variant-selection instance in this file's calculations section pins the selector."

      - name: corner_layers_rate_threshold_triggers_stack_two_ladders_on_one_invoice
        claim_type: complexity_layer
        grounds:
          - calculations.test_order_invoice_total_cents
          - calculations.lab_test_line_fee_cents
        distinguishing_aspect: "The declared rate_threshold_triggers layer: basis-point rates selected by tiered thresholds, appearing twice in the same waterfall plus a third time as an independence multiplier."
        excluded_because:
          difficulty_instance: combinatorial_mode_c_pinned_evaluation_order_expedite_tier_before_reliance_discount
          rationale: "That instance pins both ladders and their evaluation order on one invoice with exact cent literals, and the two boundary instances in this file's calculations section pin all four thresholds at their edges."

      - name: corner_layers_computed_fields_recompute_rather_than_accumulate
        claim_type: complexity_layer
        grounds:
          - entities.Product.fields.risk_weighted_gap_score
          - entities.Product.fields.units_held
          - entities.Laboratory.fields.billed_fee_cents_total
          - entities.Supplier.fields.certificates_issued_count
        distinguishing_aspect: "The boundary between the two kinds of derived state this design uses, which no single-formula instance can show: gap score, posture, coverage arrays and the unit buckets are RECOMPUTED from their input sets on every read, while the laboratory fee totals, the supplier certificate count, the material change count and the rescind counter are MONOTONIC accumulators that never fall on their own. Mixing the two up produces a system that either loses history or double-counts it."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a CERTIFIED product with two supplier certificates, three test orders (one cancelled), two batches (one released) and two recorded material change events."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Cancel one more order, rescind the release of the released batch, and read every affected parent row."
          assert:
            - "Product.units_held and units_released moved in opposite directions by the batch quantity, and their sum with units_stopped and units_destroyed still equals units_total_produced."
            - "ProductionBatch.release_rescind_count rose to 1 and never falls, while distribution_state returned to HELD — the counter records history that the state no longer shows."
            - "Laboratory.billed_fee_cents_total is unchanged by the cancellations; only credited_fee_cents_total rose, so the billed figure is an accumulator and the net is a derived difference."
            - "Supplier.certificates_issued_count is unchanged by a later REJECTED reliance decision: it counts filings, not acceptances."
            - "Product.material_change_count equals the number of MaterialChangeEvent rows for the product, and reading the product twice with no writes in between returns identical values for every computed field."

  # ===========================================================================
  # 9. CONSISTENCY MODEL
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: corner_consistency_every_cascade_hop_is_visible_in_the_triggering_response
        claim_type: immediate_visibility
        grounds:
          - state_machines.TestOrder.IN_TESTING_to_REPORTED_FAIL
          - state_machines.ChildrensProductCertificate.ISSUED_to_WITHDRAWN
          - state_machines.ProductionBatch.RELEASED_to_STOP_DISTRIBUTION
        distinguishing_aspect: "The declared immediate consistency model asserted as a TIMING claim rather than a correctness claim: the deepest cascade in the domain completes inside the request that triggers it, so a read issued immediately after the response — with no intervening write, no clock advance and no second call to any worker endpoint — already shows every hop. An implementation that queues the cascade would pass every state-machine instance and fail this one."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; reach a CERTIFIED product with an ISSUED and FURNISHED certificate, one RELEASED compliant batch of 300 units, and a fresh order for the same rule taken into testing."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "POST /compliance/test-orders/{order_id}/report-result with a measured_value that fails the rule, as LaboratoryUser, and inspect the response body."
            - "Immediately read the product, the certificate, the batch, the case list and the compliance summary, with no other call in between."
          assert:
            - "The report-result response itself shows order_state \"REPORTED_FAIL\" with result \"FAIL\" and reported_at equal to the logical clock."
            - "The immediately following read of the product shows certification_state \"SUSPENDED\" and compliance_posture \"SUSPENDED\" — no second call was needed to propagate it."
            - "The certificate read shows issuance_status \"WITHDRAWN\" and the batch read shows distribution_state \"STOP_DISTRIBUTION\", both without any further request."
            - "The case list contains exactly one OPEN case whose triggering_test_order_id is the reported order."
            - "The compliance summary reports open_case_count 1, units_stopped 300 and units_released 0 in the same read, so the ledger moved with the cascade rather than after it."
            - "Advancing the clock afterwards changes none of these values, confirming nothing was left pending on a timer."

      - name: corner_consistency_reads_are_monotonic_and_no_write_is_partially_visible
        claim_type: immediate_visibility
        grounds:
          - calculations.sample_unit_ledger
          - calculations.laboratory_fee_ledger
          - entities.SamplingPlan.fields.units_available
        distinguishing_aspect: "The all-or-nothing half of immediate consistency: a write that touches several rows at once is visible in all of them or in none. The probe pairs an ACCEPTED multi-row write with a REFUSED one on the same endpoint, so an implementation that applies the plan ledger before running the budget guard is caught by the refused case."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z; build a product on FULL_PRODUCT_TEST with an ACTIVE plan of 6 authorized units, an accredited INDEPENDENT laboratory with concurrent_slot_capacity 4, and testing_budget_cents sized so that the second booking below is over budget."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
          trigger:
            - "Book an affordable order for 2 samples, then read the plan and the laboratory."
            - "Book an unaffordable order for 2 samples, then read the plan and the laboratory again."
          assert:
            - "The accepted booking's own response reports the new order, and the immediately following plan read shows units_committed 2 and units_available 4 while the laboratory read shows billed_fee_cents_total equal to that order's invoice_total_cents."
            - "The refused booking returns HTTP 402 with error_id == \"ERR_PRODUCT_TESTING_BUDGET_EXCEEDED\"."
            - "After the refusal the plan still shows units_committed 2 and units_available 4, and the laboratory's billed_fee_cents_total is unchanged: none of the three rows the write would have touched moved."
            - "No TestOrder row exists for the refused booking, so GET /compliance/test-orders reports total_count 1 for the product."
            - "The two reads of the plan taken before and after the refusal are byte-identical apart from nothing at all — same version, same updated_at."
