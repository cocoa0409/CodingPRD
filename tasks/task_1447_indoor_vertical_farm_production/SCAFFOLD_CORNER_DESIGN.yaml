- section: validations
  instances:
  - name: request_missing_auth_header_returns_400
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_CONTEXT_HEADER]
    distinguishing_aspect: Requests without X-User-ID / X-User-Role headers are rejected before anything else; the test sends no role header at all.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          err: $.data.error_id
      assert:
      - the request is sent with X-User-Role and X-User-Id headers omitted -> error_id == ERR_MISSING_CONTEXT_HEADER (400)
  - name: forbidden_role_precedes_existence_and_state
    claim_type: priority_ordering
    grounds:
    - validations[priority=2]
    - validations[priority=4]
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: 'Authorization (p2) outranks existence (p4): a Grower calling a FarmManager-only endpoint with a bogus path id still gets 403, proving order.'
    test_recipe:
      setup:
      - one crop exists
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
      trigger:
      - call: POST /farm/crops/00000000-0000-4000-8000-000000000000/retire
        as: Grower
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE (403) even though the crop id does not exist (role check runs first)
  - name: not_found_validated_path_left_to_right
    claim_type: violation_to_error
    grounds:
    - validations[priority=4]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: A bogus parent id 404s before any child segment logic; also bogus batch id on an action endpoint 404s (not 409).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /farm/batches/00000000-0000-4000-8000-000000000000/allocations
        as: FarmManager
        captures:
          err1: $.data.error_id
      - call: POST /farm/batches/00000000-0000-4000-8000-000000000000/seed
        as: Grower
        captures:
          err2: $.data.error_id
      assert:
      - GET nested under a missing batch -> error_id == ERR_NOT_FOUND (404)
      - action on a missing batch -> error_id == ERR_NOT_FOUND (404), not a state error
  - name: body_fk_reference_not_found_returns_404
    claim_type: violation_to_error
    grounds:
    - validations[priority=4]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: A non-existent crop_id in the recipe create body is a 404 existence failure, not a 400 validation failure.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/recipes
        payload:
          crop_id: 00000000-0000-4000-8000-000000000000
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND (404)
  - name: rack_not_operating_blocks_batch_create
    claim_type: violation_to_error
    grounds:
