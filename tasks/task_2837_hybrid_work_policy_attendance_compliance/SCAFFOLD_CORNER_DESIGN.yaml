              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { rev_c2: $.data.id }
          assert:
            - "Call 1: HTTP 409 ERR_DUPLICATE_CYCLE_LABEL - cycle_label is global, so a different date range does not make the label reusable"
            - "Call 2: HTTP 409 ERR_DUPLICATE_TEAM_CODE"
            - "Call 3: HTTP 201 - the SAME team_code T-A is accepted in cycle C2, proving the key is cycle-scoped and not global"
