  path: /potato-shed/_clock/set_current_utc
  description: 'Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock).
    Advancing applies all due system transitions: contract season-settle (FULFILLED/SHORTFALLED) for windows now closed.'
  roles:
  - ShedAdmin
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
  - contract auto-settle sweep
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or malformed
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: role not permitted for this operation, or Grower acting on another grower's settlement
- id: ERR_GROWER_NOT_FOUND
  http: 404
  condition: grower id in path does not exist
- id: ERR_SHED_NOT_FOUND
  http: 404
  condition: shed id in path or body does not exist
- id: ERR_BIN_NOT_FOUND
  http: 404
  condition: bin_id reference does not exist
- id: ERR_FIELD_LOT_NOT_FOUND
  http: 404
  condition: lot id in path does not exist
- id: ERR_CONTRACT_NOT_FOUND
  http: 404
  condition: contract_id reference does not exist
- id: ERR_PACK_ORDER_NOT_FOUND
  http: 404
  condition: order id in path does not exist
- id: ERR_PACK_RUN_NOT_FOUND
  http: 404
  condition: run id in path does not exist
- id: ERR_AUDIT_NOT_FOUND
  http: 404
  condition: audit id in path does not exist
- id: ERR_SETTLEMENT_NOT_FOUND
  http: 404
  condition: settlement id in path does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: missing/invalid required field, invalid enum, unknown field, conditional field absent (contract_id for CONTRACT
    / market price for OPEN_MARKET / diversion_channel for CONDEMNED), contract variety mismatch, scheduled_end <= scheduled_start,
    delivery window inverted
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_*_version does not match the parent entity's current version (OCC)
- id: ERR_LOT_INVALID_STATE
  http: 409
  condition: lot not in required storage/quality state (assign when not INTAKE, assess when not BINNED, condemn when not ON_HOLD,
    close when CLOSED, etc.)
- id: ERR_ORDER_INVALID_STATE
  http: 409
  condition: order not in required state (allocate when not REQUESTED/ALLOCATED, run when not ALLOCATED, cancel when PACKING/SHIPPED/CANCELLED)
- id: ERR_RUN_INVALID_STATE
  http: 409
  condition: run not SCHEDULED when closed
- id: ERR_CONTRACT_INVALID_STATE
  http: 409
  condition: contract not ACTIVE when an allocation references it
- id: ERR_SETTLEMENT_INVALID_STATE
  http: 409
  condition: settlement not in required state (finalize non-PROVISIONAL/DISPUTED, dispute non-FINALIZED, pay non-FINALIZED)
- id: ERR_AUDIT_INVALID_STATE
  http: 409
  condition: audit not FIELD_WORK when closed
- id: ERR_SHED_QUARANTINED
  http: 409
  condition: shed posture QUARANTINED blocks bin-assignment, pack-run creation, and ON_HOLD release
- id: ERR_SHED_RESTRICTED
  http: 409
  condition: shed posture RESTRICTED blocks new bin-assignment (intake gate)
- id: ERR_LOT_QUALITY_HOLD
  http: 409
  condition: sprout-inhibitor application attempted on an ON_HOLD lot
- id: ERR_WASH_CHECK_STALE
  http: 409
  condition: no PASS wash check within the validity window (12h NORMAL / 4h RESTRICTED) at pack-run creation
- id: ERR_RETREAT_WINDOW_VIOLATION
  http: 409
  condition: sprout-inhibitor application earlier than 21 days after the previous application (exactly 21 days allowed)
- id: ERR_LINE_SCHEDULE_CONFLICT
  http: 409
  condition: 'pack-line window overlaps another SCHEDULED run on the same shed: half-open [start,end) overlap with a 1-hour
    sanitation buffer when varieties differ, no buffer for same variety (adjacent allowed)'
- id: ERR_BIN_VARIETY_MISMATCH
  http: 409
  condition: bin.variety_lock set and differs from the lot's variety
- id: ERR_BIN_CAPACITY_EXCEEDED
  http: 422
  condition: bin.occupied_cwt + lot.available_cwt > bin.capacity_cwt (exact fit allowed)
- id: ERR_GRADE_PERCENT_SUM_INVALID
  http: 422
  condition: us1_pct + us2_pct + cull_pct != 100.00 on an assessment
- id: ERR_SHRINK_INVALID
  http: 422
  condition: cumulative_shrink_cwt below the previous assessment's cumulative value or above original - packed - cull - condemned
- id: ERR_RUN_DRAW_IMBALANCE
  http: 422
  condition: draw violates raw == packed + cull or us1 + us2 == packed, duplicate lot in one run, or empty draws on COMPLETED
    close
- id: ERR_RUN_DRAW_EXCEEDS_RESERVATION
  http: 422
  condition: draw references a lot without an active reservation on this order, or raw_drawn_cwt > reserved raw_cwt
- id: ERR_GRADE_SPEC_NOT_MET
  http: 422
  condition: aggregate us1 share across a completing run's draws < order.grade_min_us1_pct
- id: ERR_LOT_REMNANT_TOO_LARGE
  http: 409
  condition: manual lot close with available_cwt > 5.0 (exactly 5.0 allowed)
- id: ERR_COMMITMENT_EXCEEDED
  http: 402
  condition: CONTRACT order requested_packed_cwt > contract.remaining_committed_cwt (equality allowed)
- id: ERR_OPEN_MARKET_CAP_EXCEEDED
  http: 422
  condition: OPEN_MARKET order requested_packed_cwt > open-market cap (equality allowed)
- id: ERR_INSUFFICIENT_ALLOCATION_POOL
  http: 422
  condition: eligible lot pool cannot cover the allocation need; no reservations written (atomic)
- id: ERR_SETTLEMENT_LOTS_NOT_CLOSED
  http: 409
  condition: finalize attempted while any of the grower's lots is not CLOSED
- id: ERR_SOD_REFINALIZE_CLERK
  http: 403
  condition: re-finalize of a DISPUTED settlement attempted by the same clerk id recorded in finalized_by_clerk_id
- id: ERR_SETTLEMENT_SEASON_CONFLICT
  http: 409
  condition: settlement create for a (grower, season_label) that already has a FINALIZED, DISPUTED, or PAID settlement
roles:
- name: ShedAdmin
  description: Cooperative operator admin; owns configuration resources and the logical clock
  identity: opaque
  exclusive_operations:
  - POST /growers
  - POST /sheds
  - POST /sheds/{id}/bins
  - POST /_clock/set_current_utc
  shared_operations:
  - read endpoints
- name: IntakeClerk
  description: Receives field lots and assigns bins
  identity: opaque
  exclusive_operations:
  - POST /growers/{id}/field-lots
  - POST /field-lots/{id}/bin-assignment
  shared_operations:
  - read endpoints
- name: StorageManager
  description: 'Manages in-storage lots: grade-out assessments, sprout-inhibitor applications, lot close-out'
  identity: opaque
  exclusive_operations:
  - POST /field-lots/{id}/assessments
  - POST /field-lots/{id}/sprout-inhibitor-applications
  - POST /field-lots/{id}/close
  shared_operations:
  - read endpoints
- name: QualityAssuranceManager
  description: 'Food-safety authority: wash-water checks, audits, quality holds/condemns. Segregated from PackLineSupervisor
    (may not run the line) and from intake'
  identity: opaque
  exclusive_operations:
  - POST /sheds/{id}/wash-water-checks
  - POST /sheds/{id}/audits
  - POST /audits/{id}/close
  - POST /field-lots/{id}/quality-transition
  shared_operations:
  - read endpoints
- name: SalesManager
  description: Owns contracts, pack orders, and allocation
  identity: opaque
  exclusive_operations:
  - POST /contracts
  - POST /pack-orders
  - POST /pack-orders/{id}/allocate
  - POST /pack-orders/{id}/cancel
  shared_operations:
  - read endpoints
- name: PackLineSupervisor
  description: Schedules and closes pack runs; relies on wash checks recorded by QualityAssuranceManager (segregation of duties)
  identity: opaque
  exclusive_operations:
  - POST /pack-orders/{id}/pack-runs
  - POST /pack-runs/{id}/close
  shared_operations:
  - read endpoints
- name: SettlementClerk
  description: Computes, finalizes, and pays grower settlements; re-finalizing a DISPUTED settlement requires a different
    clerk id than finalized_by_clerk_id
  identity: opaque
  exclusive_operations:
  - POST /growers/{id}/settlements
  - POST /settlements/{id}/finalize
  - POST /settlements/{id}/pay
  shared_operations:
  - read endpoints
- name: Grower
  description: The farming customer; reads own lots/settlements and disputes own FINALIZED settlements
  identity: entity_backed:Grower
  exclusive_operations:
  - POST /settlements/{id}/dispute
  shared_operations:
  - GET /growers/{id}
  - GET /field-lots
  - GET /field-lots/{id}
  - GET /growers/{id}/settlements
  - GET /settlements/{id}
