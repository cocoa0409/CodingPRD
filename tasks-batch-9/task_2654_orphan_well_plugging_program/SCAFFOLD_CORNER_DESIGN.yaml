              as: DeterminationReviewer
              as_user_id: "u_rev"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_INVALID_STATE_TRANSITION"
            - "OrphanDetermination.${det_id}.status == DRAFT and decided_by_user_id == null and decided_at == null"
            - "OrphanDetermination.${det_id}.snapshot_screening_score == null"
            - "Well.${w_id}.status == INACTIVE and orphan_confirmed_at == null"
            - "Operator.${op_id}.orphan_candidate_count == 0"

      - name: second_submit_on_an_already_submitted_determination_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.OrphanDetermination.transitions.SUBMITTED
          - validations[priority 40]
        distinguishing_aspect: |
          SUBMITTED has no submit edge out of it (only REVISION_REQUESTED does), so repeating the
          same submit call fails rather than silently re-snapshotting: submitted_at keeps its first
          value and the well does not re-enter ORPHAN_CANDIDATE a second time.
