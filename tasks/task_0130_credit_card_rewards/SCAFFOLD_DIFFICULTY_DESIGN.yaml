scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_earn_on_transaction
        grounds:
          - calculations.calc_points_provisional
          - calculations.calc_points_final
          - state_machines.Account.STANDARD_to_GOLD
          - entities.Transaction.fields.points_provisional
          - entities.Transaction.fields.points_final
        distinguishing_aspect: |
          Operates on the Transaction entity domain (a posted purchase). The two variants take
          the SAME monthly purchase set and produce DIFFERENT total points: the provisional
          variant uses the tier at posted_at, while the forward_looking final variant re-rates
          ALL same-calendar-month POSTED transactions (including those posted before the
          upgrade instant) using the post-upgrade tier.
        test_recipe:
          setup:
            - "Open Account A at 2026-01-02T00:00:00Z (signup deadline 2026-04-02T00:00:00Z)."
            - "Register CashbackCategory GROCERY with category_type=FIXED_BONUS, base_rate_bps=500."
            - "Account A at STANDARD tier (ytd=0)."
          trigger:
            - "POST /transactions: account=A, category=GROCERY, PURCHASE, amount_cents=100000 at 2026-01-05 (T1)."
            - "POST /transactions: account=A, category=GROCERY, PURCHASE, amount_cents=500000 at 2026-01-20 (T2). This brings ytd to 600000 and triggers STANDARD->GOLD."
            - "GET /transactions/{T1}"
            - "GET /transactions/{T2}"
          assert:
            - "After T1 only, GET T1 returns points_provisional == 5000 and points_final == 0."
            - "After T2 posts (which causes the STANDARD->GOLD upgrade as a side effect), GET T1 returns points_provisional == 5000 AND points_final == 6250 (forward_looking re-rates T1 under GOLD)."
            - "After T2 posts, GET T2 returns points_provisional == 25000 (computed at STANDARD per read-then-write: tier is read at posted_at BEFORE the upgrade side effect fires) AND points_final == 31250 (backfilled under GOLD)."
            - "An EARN_ADJUST PointsLedgerEntry with delta_points == 1250 (= 6250 - 5000) appears on the ledger sourced from T1.id."
            - "An EARN_ADJUST PointsLedgerEntry with delta_points == 6250 (= 31250 - 25000) appears on the ledger sourced from T2.id."
            - "Account.points_balance == 5000 + 1250 + 25000 + 6250 == 37500."

      - name: points_first_vs_amount_first_redemption
        grounds:
          - calculations.calc_statement_credit_redemption
          - entities.StatementCredit.fields.points_debited
          - entities.StatementCredit.fields.credit_amount_cents
          - entities.StatementCredit.fields.redemption_mode
        distinguishing_aspect: |
          Operates on the StatementCredit entity domain (different domain than Transaction).
          The two variants take seemingly equivalent inputs and produce DIFFERENT outputs
          due to opposing rounding directions: POINTS_FIRST floors cents, AMOUNT_FIRST ceils
          points. On PLATINUM tier, $30.49 AMOUNT_FIRST costs 2440 points; redeeming those
          same 2440 points POINTS_FIRST yields $30.50 — proving the modes are NOT inverse.
        test_recipe:
          setup:
            - "Account A on PLATINUM tier with points_balance >= 10000 (seed via direct ledger or admin grant flow per implementation)."
          trigger:
            - "POST /statement-credits: account=A, redemption_mode=AMOUNT_FIRST, requested_amount_cents=3049 -> credit C1."
            - "POST /statement-credits: account=A, redemption_mode=POINTS_FIRST, requested_points=2440 -> credit C2."
          assert:
            - "GET C1 -> points_debited == 2440, credit_amount_cents == 3049."
            - "GET C2 -> points_debited == 2440, credit_amount_cents == 3050."
            - "C1.credit_amount_cents != C2.credit_amount_cents (3049 != 3050) for identical points_debited."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (need 2 of {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_category_activation_combined_rate
        # Mode (a): formula with >=3 inputs and non-linear interaction
        grounds:
          - calculations.calc_points_provisional
          - entities.Account.fields.spending_tier
          - entities.CashbackCategory.fields.category_type
          - state_machines.QuarterlyActivation.ACTIVATED_to_EXPIRED
        distinguishing_aspect: |
          Mode (a): the earn-rate formula combines THREE independent inputs — category type
          (BASELINE/FIXED_BONUS/ROTATING_QUARTERLY), tier multiplier (STANDARD/GOLD/PLATINUM),
          and per-quarter activation existence (yes/no/expired) — via nested conditionals.
          ROTATING + not-activated falls back to BASE_BPS=100; ROTATING + activated uses
          category.base_rate_bps; the tier multiplier then layers on top with floor.
        test_recipe:
          setup:
            - "Account A on GOLD tier (tier_mult=12500)."
            - "CashbackCategory ROT_DINING: ROTATING_QUARTERLY, base_rate_bps=500."
            - "Clock at 2026-04-15."
          trigger:
            - "POST /transactions: PURCHASE, ROT_DINING, amount_cents=20000 (T_unactivated)."
            - "POST /accounts/{A}/activate-category: ROT_DINING, quarter_label='2026Q2'."
            - "POST /transactions: PURCHASE, ROT_DINING, amount_cents=20000 (T_activated)."
          assert:
            - "T_unactivated.points_provisional == 250  (combined_bps = floor(100*12500/10000)=125; points = floor(20000*125/10000) = 250)."
            - "T_activated.points_provisional == 1250  (combined_bps = floor(500*12500/10000)=625; points = floor(20000*625/10000) = 1250)."
            - "Differs across 3 inputs simultaneously (category state, activation existence, tier multiplier)."

      - name: nested_floor_order_in_combined_bps_then_points
        # Mode (b): nested rounding where order matters
        grounds:
          - calculations.calc_points_provisional
          - calculations.calc_points_provisional.precision
        distinguishing_aspect: |
          Mode (b): the formula pins TWO floor operations in a specific order — first floor
          when collapsing category_rate_bps * tier_multiplier_bps / 10000 into combined_bps,
          then floor again when applying combined_bps to amount_cents / 10000. Reversing the
          order ("multiply all then floor once") yields different points for unaligned values.
          Concrete case: PLATINUM (15000), category 333 bps, amount 19999 cents.
          Pinned order: combined_bps = floor(333*15000/10000) = floor(499.5) = 499;
                         points = floor(19999*499/10000) = floor(997.9501) = 997.
          Forbidden alternative: floor(19999*333*15000 / 100000000) = floor(998.95...) = 998.
          The 997 vs 998 difference distinguishes the two rounding orders.
        test_recipe:
          setup:
            - "Account A on PLATINUM tier."
            - "CashbackCategory ODD_RATE: FIXED_BONUS, base_rate_bps=333."
          trigger:
            - "POST /transactions: PURCHASE, ODD_RATE, amount_cents=19999."
          assert:
            - "Transaction.points_provisional == 997 (pinned floor-then-floor order)."
            - "Transaction.points_provisional != 998 (rejects the single-floor alternative)."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_delinquency_cycle
        grounds:
          - state_machines.Account.ACTIVE_to_DELINQUENT
          - state_machines.Account.DELINQUENT_to_ACTIVE
        distinguishing_aspect: |
          Cyclic shape on entity Account.lifecycle_state: ACTIVE -> DELINQUENT -> ACTIVE.
          The cycle differs from a linear A->B->C pipeline because the same state (ACTIVE)
          is re-entered after a side-effect-bearing detour through DELINQUENT (which
          reversed PENDING transfers); re-entry does NOT undo those reversals.
        test_recipe:
          setup:
            - "Account A ACTIVE, points_balance=10000."
            - "POST /points-transfers: account=A, partner=P, requested_partner_units=5000 (debits 10000 points; status=PENDING)."
          trigger:
            - "POST /accounts/{A}/mark-delinquent."
            - "POST /accounts/{A}/clear-delinquency."
          assert:
            - "After mark-delinquent, the PointsTransfer.status == REVERSED."
            - "After mark-delinquent, Account.points_balance == 10000 (restored by TRANSFER_REVERSE)."
            - "After clear-delinquency, Account.lifecycle_state == ACTIVE again."
            - "The reversed transfer is NOT re-issued (it stays REVERSED across the cycle); ledger contains TRANSFER_DEBIT(-10000) followed by TRANSFER_REVERSE(+10000)."

      - name: account_parallel_lifecycle_and_tier_dimensions
        grounds:
          - state_machines.Account.ACTIVE_to_DELINQUENT
          - state_machines.Account.STANDARD_to_GOLD
          - entities.Account.fields.lifecycle_state
          - entities.Account.fields.spending_tier
        distinguishing_aspect: |
          Parallel state dimensions on the SAME entity (Account): lifecycle_state and
          spending_tier evolve INDEPENDENTLY. A DELINQUENT account does not lose its tier;
          a tier upgrade does not change lifecycle_state. This distinguishes it from a
          single-dimension linear machine on Account.
        test_recipe:
          setup:
            - "Account A ACTIVE, STANDARD tier, ytd=0."
            - "Post purchases totaling 600000 cents (categories with base_rate_bps=500) to drive ytd to threshold."
          trigger:
            - "Last purchase post triggers STANDARD->GOLD (tier dimension)."
            - "POST /accounts/{A}/mark-delinquent (lifecycle dimension)."
          assert:
            - "Account.lifecycle_state == DELINQUENT AND Account.spending_tier == GOLD simultaneously."
            - "The mark-delinquent did not reset spending_tier; the tier upgrade did not change lifecycle_state."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_account_three_hop_cascade
        # Depth 3: close -> forfeit ledger -> balance recompute -> signup_bonus_state mutate
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - entities.Account.fields.points_balance
          - entities.Account.fields.signup_bonus_state
          - entities.PointsLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Triggered by POST /accounts/{id}/close. Hop 1: close mutates Account.lifecycle_state.
          Hop 2: lifecycle_state := CLOSED causes a FORFEIT PointsLedgerEntry to be appended
          (mutation on PointsLedgerEntry caused by hop 1). Hop 3: appearance of the FORFEIT
          ledger entry causes Account.points_balance to recompute to 0 AND Account.
          signup_bonus_state (if not AWARDED) to transition to FORFEITED. Each link is
          caused by the previous, not directly by the original /close call. Depth >= 3.
        test_recipe:
          setup:
            - "Account A ACTIVE, points_balance=7500, signup_bonus_state=PENDING."
          trigger:
            - "POST /accounts/{A}/close."
          assert:
            - "Hop 1: Account.lifecycle_state == CLOSED."
            - "Hop 2: GET /accounts/{A}/ledger returns a PointsLedgerEntry with entry_type=FORFEIT, delta_points=-7500."
            - "Hop 3: Account.points_balance == 0 AND Account.signup_bonus_state == FORFEITED."

      - name: tier_upgrade_two_hop_backfill_cascade
        # Depth 2: tier upgrade -> EARN_ADJUST entries -> balance recompute
        grounds:
          - state_machines.Account.STANDARD_to_GOLD
          - calculations.calc_points_final
          - entities.PointsLedgerEntry.fields.entry_type
          - entities.Account.fields.points_balance
        distinguishing_aspect: |
          Triggered by POST /transactions whose post crosses TIER_GOLD_THRESHOLD_CENTS.
          Hop 1: Account.spending_tier := GOLD. Hop 2 (caused by hop 1): calc_points_final
          backfills same-calendar-month POSTED transactions, appending EARN_ADJUST
          PointsLedgerEntry rows. Hop 3 (caused by hop 2): Account.points_balance recomputes
          to include the new EARN_ADJUST deltas. Different trigger from the close cascade.
        test_recipe:
          setup:
            - "Account A ACTIVE, STANDARD, ytd=0, current month 2026-01."
            - "POST /transactions: PURCHASE, GROCERY (500 bps), amount=100000 cents (T1)."
          trigger:
            - "POST /transactions: PURCHASE, GROCERY, amount=500000 cents (T2) -- pushes ytd to 600000."
          assert:
            - "Hop 1: Account.spending_tier == GOLD."
            - "Hop 2: ledger contains EARN_ADJUST entry with source_entity_id == T1.id, delta_points == 1250 (= T1.points_final 6250 - T1.points_provisional 5000)."
            - "Hop 3: Account.points_balance == 37500 (T1 EARN 5000 + T1 EARN_ADJUST 1250 + T2 EARN 25000 + T2 EARN_ADJUST 6250)."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_close_then_insufficient
        # Categories: state (ERR_ACCOUNT_CLOSED) vs business_fiscal (ERR_INSUFFICIENT_POINTS)
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors.ERR_ACCOUNT_CLOSED
          - errors.ERR_INSUFFICIENT_POINTS
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_ACCOUNT_CLOSED) vs business_fiscal (priority 15,
          ERR_INSUFFICIENT_POINTS). When a Cardholder attempts POST /statement-credits on
          a CLOSED account with insufficient points, both checks would fail; the scaffold
          PINS that the state error wins because state precedes fiscal in priority order.
        test_recipe:
          setup:
            - "Account A CLOSED with points_balance=0 (forfeited at close)."
          trigger:
            - "POST /statement-credits: account=A, redemption_mode=POINTS_FIRST, requested_points=100000."
          assert:
            - "HTTP 409, error_id == ERR_ACCOUNT_CLOSED (state wins over fiscal)."

      - name: referential_vs_constraint_refund_mismatch_and_partial
        # Categories: business_referential (priority 16 ERR_REFUND_MISMATCH) vs business_constraint (priority 17 ERR_PARTIAL_REFUND_DISALLOWED)
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - errors.ERR_REFUND_MISMATCH
          - errors.ERR_PARTIAL_REFUND_DISALLOWED
        distinguishing_aspect: |
          Pair: business_referential (priority 16, ERR_REFUND_MISMATCH) vs business_constraint
          (priority 17, ERR_PARTIAL_REFUND_DISALLOWED). When a REFUND simultaneously points
          to a Transaction belonging to a DIFFERENT account AND has the wrong amount, both
          would fail; the scaffold PINS that referential wins (priority 16 < 17).
        test_recipe:
          setup:
            - "Account A and Account B, both ACTIVE."
            - "POST a PURCHASE T_orig on Account B for 50000 cents."
          trigger:
            - "POST /transactions on Account A: REFUND, original_transaction_id=T_orig.id, amount_cents=12345 (mismatched amount AND wrong account)."
          assert:
            - "HTTP 422, error_id == ERR_REFUND_MISMATCH (referential precedes constraint)."
            - "Distinct from instance 1: different category PAIR (referential/constraint vs state/fiscal)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: signup_bonus_exact_min_spend_boundary
        grounds:
          - calculations.calc_signup_bonus_qualification
          - calculations.calc_signup_bonus_qualification.constants.SIGNUP_MIN_SPEND_CENTS
          - entities.Account.fields.signup_bonus_state
        distinguishing_aspect: |
          Numeric-threshold boundary on the signup-bonus metric, reachable through
          POST /transactions. Tests both exact-equal (300000 cents -> qualifies) and
          one-under (299999 cents -> does NOT qualify). The boundary is >= per
          calc_signup_bonus_qualification.
        test_recipe:
          setup:
            - "Account A opened at 2026-01-01T00:00:00Z; signup deadline 2026-04-01T00:00:00Z."
            - "Account B opened at 2026-01-01T00:00:00Z; signup deadline 2026-04-01T00:00:00Z."
          trigger:
            - "POST /transactions on A: PURCHASE, BASE category, amount_cents=299999 at 2026-02-01."
            - "POST /transactions on B: PURCHASE, BASE category, amount_cents=300000 at 2026-02-01."
          assert:
            - "Account A.signup_bonus_state == PENDING; no SIGNUP_BONUS ledger entry."
            - "Account B.signup_bonus_state == AWARDED; SIGNUP_BONUS PointsLedgerEntry with delta_points == 60000 exists."

      - name: transfer_increment_zero_and_partial_multiple_boundary
        grounds:
          - validations[priority=11]
          - calculations.calc_transfer_partner_units
          - entities.TransferPartner.fields.min_transfer_increment
        distinguishing_aspect: |
          Different metric (transfer-increment multiple), different endpoint (POST
          /points-transfers). Tests zero-quantity edge (requested_partner_units=0)
          and partial-multiple edge (requested=1500 when min_increment=1000) — both
          reject; and exact-multiple boundary (1000 and 2000) succeed.
        test_recipe:
          setup:
            - "Account A ACTIVE with points_balance >= 100000."
            - "TransferPartner P: conversion=10, min_transfer_increment=1000."
          trigger:
            - "POST /points-transfers: account=A, partner=P, requested_partner_units=0."
            - "POST /points-transfers: account=A, partner=P, requested_partner_units=1500."
            - "POST /points-transfers: account=A, partner=P, requested_partner_units=1000."
            - "POST /points-transfers: account=A, partner=P, requested_partner_units=2000."
          assert:
            - "First call -> HTTP 422 ERR_INVALID_TRANSFER_INCREMENT (zero edge)."
            - "Second call -> HTTP 422 ERR_INVALID_TRANSFER_INCREMENT (1500 % 1000 != 0)."
            - "Third call -> 201, points_debited == 10000."
            - "Fourth call -> 201, points_debited == 20000."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: points_transfer_blocked_by_account_lifecycle
        # Pair: PointsTransfer <- Account
        grounds:
          - state_machines.PointsTransfer.PENDING_to_COMPLETED
          - validations[priority=6]
          - entities.Account.fields.lifecycle_state
        distinguishing_aspect: |
          Entity pair: PointsTransfer depends on Account.lifecycle_state. A transfer that
          is in PENDING cannot be confirmed if its Account is no longer ACTIVE; new
          transfers are rejected entirely. The dependency is across a different pair than
          the redemption case.
        test_recipe:
          setup:
            - "Account A ACTIVE, points_balance=20000."
            - "POST /points-transfers: account=A, partner=P, requested=1000 (1 increment, conversion=10) -> T1 PENDING."
            - "POST /accounts/{A}/mark-delinquent (Account.lifecycle_state := DELINQUENT)."
          trigger:
            - "POST /points-transfers/{T1}/confirm (attempt to confirm previously-PENDING transfer)."
          assert:
            - "T1 was already auto-reversed by the mark-delinquent cascade; confirm returns HTTP 409 ERR_INVALID_STATE."
            - "T1.status == REVERSED (cross-entity: PointsTransfer state hinges on Account.lifecycle_state transition)."

      - name: quarterly_activation_blocked_by_category_type
        # Pair: QuarterlyActivation <- CashbackCategory
        grounds:
          - validations[priority=8]
          - entities.CashbackCategory.fields.category_type
          - entities.QuarterlyActivation
        distinguishing_aspect: |
          Different entity pair: QuarterlyActivation depends on CashbackCategory.category_type.
          Activation is only valid when category_type == ROTATING_QUARTERLY. Activation
          against a FIXED_BONUS or BASELINE category is rejected. Distinct pair from the
          PointsTransfer/Account dependency.
        test_recipe:
          setup:
            - "Account A ACTIVE."
            - "CashbackCategory GROCERY with category_type=FIXED_BONUS."
            - "Clock at 2026-04-15 (within 2026Q2)."
          trigger:
            - "POST /accounts/{A}/activate-category: category_id=GROCERY.id, quarter_label='2026Q2'."
          assert:
            - "HTTP 422 ERR_CATEGORY_NOT_ACTIVATABLE."
            - "No QuarterlyActivation row created."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: signup_window_half_open_at_deadline
        # Interval semantics: half-open [opened_at, signup_bonus_deadline_at) — exact-instant exclusion
        grounds:
          - calculations.calc_signup_bonus_qualification
          - entities.Account.fields.signup_bonus_deadline_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN window [opened_at, signup_bonus_deadline_at). A
          purchase posted at EXACTLY signup_bonus_deadline_at does NOT count toward the
          bonus, while a purchase posted one nanosecond earlier DOES. The resource being
          guarded is the Account.signup_bonus_state; semantic is "exact-instant exclusion
          at upper bound."
        test_recipe:
          setup:
            - "Account A opened at 2026-01-01T00:00:00Z. signup_bonus_deadline_at == 2026-04-01T00:00:00Z."
          trigger:
            - "POST /transactions: PURCHASE, BASE, amount_cents=300000 at posted_at=2026-04-01T00:00:00Z (EXACTLY the deadline)."
            - "Account B opened at 2026-01-01T00:00:00Z; POST /transactions on B: PURCHASE, BASE, amount_cents=300000 at 2026-03-31T23:59:59.999Z."
          assert:
            - "Account A.signup_bonus_qualifying_spend_cents == 0 (the post at deadline is excluded)."
            - "Account A.signup_bonus_state == PENDING (or EXPIRED after sweep)."
            - "Account B.signup_bonus_state == AWARDED (the post one ms earlier qualifies)."

      - name: quarterly_activation_uniqueness_per_quarter
        # Interval semantics: closed-disjoint-quarter buckets — no two activations may
        # cover the same (account, category, quarter_label) bucket
        grounds:
          - validations[priority=10]
          - concurrency_rules[activation_already_exists]
          - entities.QuarterlyActivation.fields.quarter_label
        distinguishing_aspect: |
          Different interval semantics: discrete CLOSED quarter buckets. Two activations
          per (account, category) on different quarter_labels MAY coexist (2026Q2 and
          2026Q3), but two on the same quarter_label MAY NOT. The geometric treatment is
          "discrete partition by quarter," not a continuous half-open window.
        test_recipe:
          setup:
            - "Account A ACTIVE."
            - "CashbackCategory ROT (ROTATING_QUARTERLY, base_rate_bps=500)."
            - "Clock at 2026-04-15."
          trigger:
            - "POST /accounts/{A}/activate-category: category=ROT, quarter_label='2026Q2' (call 1)."
            - "POST /accounts/{A}/activate-category: category=ROT, quarter_label='2026Q3' (call 2)."
            - "POST /accounts/{A}/activate-category: category=ROT, quarter_label='2026Q2' (call 3)."
          assert:
            - "Call 1 -> 201."
            - "Call 2 -> 201 (different quarter bucket, allowed)."
            - "Call 3 -> 409 ERR_ACTIVATION_ALREADY_EXISTS (same bucket, rejected)."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_preserves_net_points_invariant
        # Conserved quantity: net points awarded for a (purchase, refund) pair == 0
        grounds:
          - state_machines.Transaction.POSTED_to_REVERSED
          - entities.PointsLedgerEntry
          - calculations.calc_points_provisional
        distinguishing_aspect: |
          Named conserved quantity: SUM(PointsLedgerEntry.delta_points where source_entity_id
          in {T_purchase.id, T_refund_adjust on T_purchase}) == 0. The full-refund REFUND
          transition appends an EARN_ADJUST entry of exactly -T_purchase.points_provisional,
          so the net delta across the (EARN, EARN_ADJUST) pair on T_purchase is zero, with
          no drift even if tier changed in between (the refund netting is symmetric).
        test_recipe:
          setup:
            - "Account A ACTIVE, STANDARD."
            - "POST /transactions: PURCHASE, BASE (100 bps), amount=50000 -> T1 (points_provisional == 500)."
          trigger:
            - "POST /transactions: REFUND, original_transaction_id=T1.id, amount=50000 -> T_refund."
          assert:
            - "Sum of delta_points for ledger entries with source_entity_id in {T1.id, T_refund.id} == 0."
            - "Concretely: one EARN entry of +500 (from T1) plus one EARN_ADJUST entry of -500 (from refund) -> net 0."
            - "Account.points_balance is unchanged from the pre-purchase baseline (delta == 0)."

      - name: transfer_reverse_preserves_balance_invariant
        # Conserved quantity: net points-balance change across (DEBIT, REVERSE) pair == 0
        grounds:
          - state_machines.PointsTransfer.PENDING_to_REVERSED
          - entities.PointsLedgerEntry.fields.entry_type
          - entities.Account.fields.points_balance
        distinguishing_aspect: |
          Different conserved quantity (Account.points_balance, not the per-transaction
          earned-points ledger). The TRANSFER_DEBIT(-X) + TRANSFER_REVERSE(+X) pair MUST
          leave Account.points_balance equal to its pre-transfer value, with no drift
          regardless of intervening earn or redeem activity on the same account.
        test_recipe:
          setup:
            - "Account A ACTIVE, points_balance=20000."
          trigger:
            - "POST /points-transfers: account=A, partner=P (conversion=10, increment=1000), requested=1000 (debits 10000) -> T."
            - "POST /points-transfers/{T}/reverse."
          assert:
            - "After debit: Account.points_balance == 10000."
            - "After reverse: Account.points_balance == 20000 (returned to pre-transfer value)."
            - "Ledger contains TRANSFER_DEBIT(delta=-10000) followed by TRANSFER_REVERSE(delta=+10000); sum == 0."
