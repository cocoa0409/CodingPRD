  - rule_id: cross_entity_state_dependency
    instances:

      - name: letter_start_blocked_when_application_not_draft
        grounds:
          - state_machines.RecommendationLetter.transitions.REQUESTED_to_IN_PROGRESS
          - state_machines.Application.transitions.DRAFT_to_SUBMITTED
          - entities.Application.fields.status
          - entities.RecommendationLetter.fields.status
        distinguishing_aspect: |
          Cross-entity pair = RecommendationLetter ↔ Application. The letter's
          REQUESTED→IN_PROGRESS transition requires Application.status == DRAFT.
          Once the Application is SUBMITTED, the same letter trigger is rejected — the
          letter machine cannot advance independently of its parent Application's state.
        test_recipe:
          setup:
            - "Applicant with READY profile"
            - "Application in SUBMITTED status with a SUBMITTED letter (so submission was valid)"
            - "A SECOND Recommender + a SECOND RecommendationLetter exists for the SAME Application, in REQUESTED status, whose Recommender has invite_status=ACCEPTED"
