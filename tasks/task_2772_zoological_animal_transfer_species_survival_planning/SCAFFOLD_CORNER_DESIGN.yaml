            - "GET /animals?holding_institution_id=${sender_id} returns total_count == 1"
            - "Animal.${m1_id}.sex is still MALE and version == 1"
            - "Institution.${sender_id}.occupied_slots == 1"

      - name: same_local_id_at_a_different_holder_is_accepted
