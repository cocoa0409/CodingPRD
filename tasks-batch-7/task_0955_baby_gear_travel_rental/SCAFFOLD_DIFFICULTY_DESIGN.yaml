            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-L2", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "14 Koa Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust1}", captures: { res1: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "15 Koa Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust2}", captures: { res2: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust1}" }
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust2}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res1}", stop_type: "DELIVERY_SETUP", address: "14 Koa Rd", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T09:00:00Z" }, as: OperationsAdmin, captures: { stop_d1: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res2}", stop_type: "DELIVERY_SETUP", address: "15 Koa Rd", time_window_start: "2026-06-10T09:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d2: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T08:30:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d1}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d2}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res1}", stop_type: "PICKUP", address: "14 Koa Rd", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T03:00:00Z" }, as: OperationsAdmin, captures: { stop_p1: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res2}", stop_type: "PICKUP", address: "15 Koa Rd", time_window_start: "2026-06-13T03:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p2: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p1}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:01:00Z" }, as: OperationsAdmin }
