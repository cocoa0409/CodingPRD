  - rule_id: boundary_precision_check
    instances:
      - name: concentration_cap_rounds_to_two_decimals_before_the_strict_comparison
        grounds:
          - calculations.supplier_concentration
          - validations[priority=25]
          - entities.BuyerProgram.fields.concentration_cap_pct
          - endpoints POST /discount-offers/{id}/accept
          - rounding_convention
        distinguishing_aspect: |
          Metric: the supplier concentration percentage on POST /discount-offers/{id}/accept. Three
          portfolios that differ by four cents straddle the 60.00 cap: 60000/100000 is exactly 60.00
          and passes because the comparison is strict >; 60001/100000 is 60.001 which round_half_up
          to 2 decimals turns into 60.00 and STILL passes; 60005/100000 is 60.005 which rounds up to
          60.01 and fails. The rounding therefore happens before the comparison, and half-up (not
          half-even, which would give 60.00) decides the third case.
