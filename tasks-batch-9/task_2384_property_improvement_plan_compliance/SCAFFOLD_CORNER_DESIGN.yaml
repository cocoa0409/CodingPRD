          - errors[ERR_INSUFFICIENT_RESERVE]
        distinguishing_aspect: "Availability is the corpus minus the retention floor minus what earlier draws already encumber, and the boundary is inclusive: a draw that consumes the last available cent is admitted and walks all the way to disbursement, while a draw of one cent more answers ERR_INSUFFICIENT_RESERVE."
        test_recipe:
          setup:
            - "One property with reserve 50000000 and minimum_retention 5000000, so availability is 45000000."
