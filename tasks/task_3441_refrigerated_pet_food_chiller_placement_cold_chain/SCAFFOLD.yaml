scenario: |
  Refrigerated Pet Food Chiller Placement & Cold Chain Retail Program (Freshpet): branded refrigerator placement in retail stores with company-owned assets, placement agreements and store-level footprint negotiation, chiller manufacturing, installation and service network with temperature monitoring and repair dispatch, store selection and placement prioritization based on demographic and velocity modeling with payback analysis, cold chain distribution from plant to store with dedicated refrigerated logistics and delivery frequency, product shelf life and rotation with in-store date checking and removal, capacity expansion in manufacturing to support placement growth with sequencing decisions, consumer education and trial programs to build a new category behavior, chiller relocation and removal when a store underperforms

domain_name: refrigerated-pet-food-cold-chain
api_prefix: /cold-chain

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Retail store display name."
      - name: region
        type: string
        source: input
        description: "Free-form region label (e.g. 'US-SOUTHWEST')."
      - name: demographic_index
        type: integer
        source: input
        description: "Trade-area demographic fit index; integer 0..100 inclusive."
        constraints: "0 <= demographic_index <= 100"
      - name: weekly_category_velocity_index
        type: integer
        source: input
        description: "Category velocity index for the trade area; integer 0..100 inclusive."
        constraints: "0 <= weekly_category_velocity_index <= 100"
      - name: competitor_density_index
        type: integer
        source: input
        description: "Competitor refrigerator density nearby; integer 0..100 inclusive; subtracts from site score."
        constraints: "0 <= competitor_density_index <= 100"
      - name: available_sqft
        type: integer
        source: input
        description: "Total floor square footage the store could conceivably allocate; integer > 0."
        constraints: "available_sqft > 0"
      - name: distance_miles_from_plant
        type: number
        source: input
        description: "Road miles from the manufacturing plant; >= 0; used in installation quote."
        constraints: "distance_miles_from_plant >= 0"

  - name: SiteEvaluation
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; evaluated store (path parameter)."
      - name: model_variant
        type: enum
        source: input
        description: "Scoring weight variant."
        constraints: "enum: DEMOGRAPHIC_LED | VELOCITY_LED"
      - name: chiller_model
        type: enum
        source: input
        description: "Chiller model assumed by the quote and footprint math."
        constraints: "enum: STANDARD | COMPACT"
      - name: forecast_weekly_units
        type: number
        source: input
        description: "Forecast weekly unit sales at this store; > 0; one decimal allowed."
        constraints: "forecast_weekly_units > 0"
      - name: allocated_sqft
        type: integer
        source: input
        description: "Proposed floor footprint for the chiller in square feet; > 0."
        constraints: "allocated_sqft > 0"
      - name: footprint_score
        type: number
        source: computed
        description: "min(100, round_half_up(100 * allocated_sqft / FOOTPRINT_REFERENCE_SQFT)); FOOTPRINT_REFERENCE_SQFT = 32."
      - name: composite_score
        type: number
        source: computed
        description: "Weighted score per calculations.site_selection_score; 2 decimals."
      - name: install_quote_cents
        type: integer
        source: computed
        description: "Installation quote per calculations.installation_quote; whole cents."
      - name: payback_months
        type: number
        source: computed
        description: "Pro-forma payback per calculations.payback_estimate (variant PRO_FORMA); 2 decimals."
      - name: verdict
        type: enum
        source: computed
        description: "ELIGIBLE iff composite_score >= 60.0 AND payback_months <= 36.0; else INELIGIBLE. Boundaries inclusive."
        constraints: "enum: ELIGIBLE | INELIGIBLE"

  - name: PlacementAgreement
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; counterparty store (path parameter)."
      - name: allocated_sqft
        type: integer
        source: input
        description: "Negotiated floor footprint; > 0."
        constraints: "allocated_sqft > 0"
      - name: max_capex_cents
        type: integer
        source: input
        description: "Maximum all-in placement capex the program will spend under this agreement; > 0."
        constraints: "max_capex_cents > 0"
      - name: term_months
        type: integer
        source: input
        description: "Agreement term in months; 1..120."
        constraints: "1 <= term_months <= 120"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.PlacementAgreement."
        constraints: "enum: PROPOSED | SIGNED | ACTIVE | TERMINATED"
        default: PROPOSED
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of SIGNED transition; null before signing."
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of TERMINATED transition; null until terminated."
        default: null

  - name: Chiller
    parent: null
    common_fields: true
    fields:
      - name: model
        type: enum
        source: input
        description: "Chiller model."
        constraints: "enum: STANDARD | COMPACT"
      - name: serial_no
        type: string
        source: system
        description: "Serial minted as serial_prefix + '-' + 4-digit zero-padded sequence; sequence starts at serial_start_seq when given, else next free for the prefix (e.g. FP-0007). Unique across fleet."
      - name: capacity_units
        type: integer
        source: computed
        description: "Unit capacity by model: STANDARD = 240, COMPACT = 120."
      - name: footprint_sqft
        type: integer
        source: computed
        description: "Floor footprint by model: STANDARD = 8, COMPACT = 5."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.Chiller."
        constraints: "enum: IN_STOCK | INSTALLED | ACTIVE | NEEDS_REPAIR | DECOMMISSIONED"
        default: IN_STOCK
      - name: excursion_minutes_24h
        type: integer
        source: computed
        description: "Sum of duration_minutes over excursion readings with recorded_at within [now-24h, now] AND recorded_at > last_repair_at; reset to 0 when a repair resolves."
      - name: last_repair_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent NEEDS_REPAIR -> ACTIVE repair resolution; null until first repair."
        default: null

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; host store."
      - name: chiller_id
        type: string
        source: input
        description: "FK -> Chiller.id; installed unit."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PlacementAgreement.id; governing agreement."
      - name: status
        type: enum
        source: system
        description: "Lifecycle dimension per state_machines.Placement."
        constraints: "enum: ACTIVE | RETIRED"
        default: ACTIVE
      - name: performance_status
        type: enum
        source: system
        description: "Parallel dimension: velocity-driven. Evolves independently of operational_status."
        constraints: "enum: PENDING | PERFORMING | UNDERPERFORMING"
        default: PENDING
      - name: operational_status
        type: enum
        source: system
        description: "Parallel dimension: chiller-health-driven. Evolves independently of performance_status."
        constraints: "enum: OK | SUSPENDED"
        default: OK
      - name: underperforming_streak
        type: integer
        source: system
        description: "Consecutive evaluate-performance calls whose verdict was UNDERPERFORMING; resets to 0 on PERFORMING."
        default: 0
      - name: standing_deliveries_per_week
        type: integer
        source: computed
        description: "Tiered delivery frequency per calculations.delivery_frequency_plan; initialized from the governing SiteEvaluation forecast at install, recomputed on each evaluate-performance."
      - name: safety_stock_units
        type: integer
        source: computed
        description: "min(chiller.capacity_units, round_half_up(velocity * SHELF_LIFE_DAYS / 7 * SAFETY_STOCK_FACTOR)); SAFETY_STOCK_FACTOR = 1.25, SHELF_LIFE_DAYS = 45."
      - name: installed_quote_cents
        type: integer
        source: computed
        description: "Snapshot of calculations.installation_quote at install time (chiller model + agreement.allocated_sqft + store.distance_miles_from_plant)."
      - name: last_reported_weekly_units
        type: integer
        source: system
        description: "trailing_weekly_units from the most recent evaluate-performance call; null before first evaluation."
        default: null
      - name: payback_actuals_months
        type: number
        source: computed
        description: "ACTUALS-variant payback per calculations.payback_estimate after each evaluation; null when rounded monthly units == 0."
        default: null
      - name: retired_reason
        type: enum
        source: system
        description: "Null while ACTIVE; set when RETIRED."
        constraints: "enum: UNDERPERFORMANCE_REMOVAL | AGREEMENT_TERMINATION | RELOCATION"
        default: null
      - name: relocated_to_placement_id
        type: string
        source: system
        description: "FK -> Placement.id; on a RELOCATION retirement, the successor placement id; null otherwise."
        default: null

  - name: TemperatureReading
    parent: Chiller
    common_fields: false
    fields:
      - name: chiller_id
        type: string
        source: input
        description: "FK -> Chiller.id; reporting unit (path parameter)."
      - name: recorded_at
        type: datetime
        source: input
        description: "Timestamp the reading was taken; must be <= current logical time. Late-arriving readings (recorded_at earlier than previously posted readings) are accepted and counted by recorded_at window."
      - name: temp_c
        type: number
        source: input
        description: "Cabinet temperature in Celsius; sensor-plausible range -40.0..60.0 inclusive."
        constraints: "-40.0 <= temp_c <= 60.0"
      - name: duration_minutes
        type: integer
        source: input
        description: "Minutes this reading represents; 1..1440."
        constraints: "1 <= duration_minutes <= 1440"
      - name: is_excursion
        type: boolean
        source: computed
        description: "true iff temp_c < 0.0 OR temp_c > 4.0 (inclusive safe band CHILLER_TEMP_MIN_C = 0.0, CHILLER_TEMP_MAX_C = 4.0)."

  - name: ServiceTicket
    parent: Chiller
    common_fields: true
    fields:
      - name: chiller_id
        type: string
        source: input
        description: "FK -> Chiller.id; unit needing service."
      - name: origin
        type: enum
        source: system
        description: "MANUAL when opened via POST /service-tickets; AUTO_EXCURSION when minted by the severe-excursion cascade."
        constraints: "enum: MANUAL | AUTO_EXCURSION"
      - name: issue_summary
        type: string
        source: input
        description: "Free-text issue description (required on manual open; system-filled on auto open)."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.ServiceTicket."
        constraints: "enum: OPEN | DISPATCHED | RESOLVED | CANCELLED"
        default: OPEN
      - name: window_start
        type: datetime
        source: system
        description: "Dispatch window start (half-open interval start); null until dispatched."
        default: null
      - name: window_end
        type: datetime
        source: system
        description: "Dispatch window end (half-open interval end, exclusive); null until dispatched."
        default: null
      - name: resolution_note
        type: string
        source: system
        description: "Technician note captured at resolve; null until resolved."
        default: null

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; destination store."
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductLot.id; source lot."
      - name: quantity_units
        type: integer
        source: input
        description: "Units loaded onto the refrigerated truck; > 0."
        constraints: "quantity_units > 0"
      - name: departed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at creation (truck departs immediately on create)."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.Shipment."
        constraints: "enum: IN_TRANSIT | DELIVERED | SPOILED"
        default: IN_TRANSIT
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of delivery reconciliation; null until delivered."
        default: null
      - name: accepted_units
        type: integer
        source: system
        description: "Units accepted at the dock (deliver input); null until delivered."
        default: null
      - name: rejected_units
        type: integer
        source: system
        description: "Units rejected at the dock (deliver input); counted immediately as spoiled; null until delivered."
        default: null

  - name: ProductLot
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Product SKU code."
      - name: produced_at
        type: datetime
        source: input
        description: "Production timestamp; must be <= current logical time."
      - name: quantity_units
        type: integer
        source: input
        description: "Units produced in this lot; > 0."
        constraints: "quantity_units > 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.ProductLot. EXPIRED materializes lazily: a QUARANTINE or RELEASED lot reads as EXPIRED once now > expires_at."
        constraints: "enum: QUARANTINE | RELEASED | REJECTED | EXPIRED"
        default: QUARANTINE
      - name: expires_at
        type: datetime
        source: computed
        description: "produced_at + SHELF_LIFE_DAYS * 24h; SHELF_LIFE_DAYS = 45."
      - name: unshipped_qty
        type: integer
        source: computed
        description: "Units still at plant; initialized to quantity_units; debited on shipment create."
      - name: in_transit_qty
        type: integer
        source: computed
        description: "Units on trucks; credited on shipment create, debited on deliver/spoil."
      - name: in_store_qty
        type: integer
        source: computed
        description: "Units accepted into store inventory; credited on deliver, debited on sweep removal."
      - name: removed_qty
        type: integer
        source: computed
        description: "Units removed from store inventory by date-check sweep."
      - name: spoiled_qty
        type: integer
        source: computed
        description: "Units rejected at dock or spoiled in transit (window exceeded)."
      - name: conservation_invariant
        type: string
        source: computed
        description: "Documentation field: at all times quantity_units == unshipped_qty + in_transit_qty + in_store_qty + removed_qty + spoiled_qty (calculations.lot_unit_conservation)."

  - name: InventoryPosition
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; holding store (taken from the delivering shipment)."
      - name: lot_id
        type: string
        source: system
        description: "FK -> ProductLot.id; source lot (taken from the delivering shipment)."
      - name: qty_on_hand
        type: integer
        source: system
        description: "Units currently on hand. At most one non-REMOVED position per (store_id, lot_id): a delivery into an existing SELLABLE position for the same store+lot merges (qty_on_hand += accepted_units)."
      - name: expiry_date
        type: datetime
        source: computed
        description: "Copied from lot.expires_at at delivery."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.InventoryPosition."
        constraints: "enum: SELLABLE | QUARANTINED | REMOVED"
        default: SELLABLE
      - name: removal_reason
        type: enum
        source: system
        description: "Null until REMOVED. Sweep evaluation order is EXPIRED first, then COLD_CHAIN_BREACH, then NEAR_EXPIRY."
        constraints: "enum: NEAR_EXPIRY | EXPIRED | COLD_CHAIN_BREACH"
        default: null

  - name: CapacityProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Project label."
      - name: capacity_delta_units
        type: integer
        source: input
        description: "Additional chiller-manufacturing slots this project adds when commissioned; > 0."
        constraints: "capacity_delta_units > 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state per state_machines.CapacityProject."
        constraints: "enum: PROPOSED | APPROVED | COMMISSIONED"
        default: PROPOSED
      - name: sequence_no
        type: integer
        source: system
        description: "Assigned at approval: 1 + max(sequence_no) over all projects with non-null sequence_no (1 if none). Immutable once set."
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creator; the approver must be a different X-User-ID (segregation of duties)."

  - name: TrialCampaign
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; host store (path parameter)."
      - name: name
        type: string
        source: input
        description: "Campaign label."
      - name: start_date
        type: datetime
        source: input
        description: "First day of the consumer-trial window (date at 00:00:00Z). Closed interval start."
      - name: end_date
        type: datetime
        source: input
        description: "Last day of the window (date at 00:00:00Z). Closed interval end; must be >= start_date."
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; COMPLETED materializes lazily once now > end_date + 1 day."
        constraints: "enum: ACTIVE | COMPLETED"
        default: ACTIVE

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: PlacementAgreement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /cold-chain/placement-agreements/{id}/revise"
        actor: PlacementManager
        preconditions:
          - "agreement.status == PROPOSED"
          - "expected_agreement_version == agreement.version (OCC, else ERR_STALE_VERSION 412)"
        side_effects:
          - "apply provided term changes (allocated_sqft, max_capex_cents, term_months); unspecified fields keep prior values"
          - "increments PlacementAgreement.version by 1"
        note: "Cyclic self-loop: negotiation rounds rewrite commercial terms in place; OCC serializes editors."
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /cold-chain/placement-agreements/{id}/sign"
        actor: PlacementManager
        preconditions:
          - "agreement.status == PROPOSED"
        side_effects:
          - "signed_at := logical now"
          - "increments PlacementAgreement.version by 1"
      - from: SIGNED
        to: ACTIVE
        trigger: "system: first POST /cold-chain/placements that names this agreement succeeds"
        actor: system
        preconditions:
          - "agreement.status == SIGNED"
        side_effects:
          - "increments PlacementAgreement.version by 1"
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /cold-chain/placement-agreements/{id}/terminate"
        actor: PlacementManager
        preconditions:
          - "agreement.status == PROPOSED"
        side_effects:
          - "terminated_at := logical now"
          - "increments PlacementAgreement.version by 1"
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /cold-chain/placement-agreements/{id}/terminate"
        actor: PlacementManager
        preconditions:
          - "agreement.status == SIGNED"
        side_effects:
          - "terminated_at := logical now"
          - "increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cold-chain/placement-agreements/{id}/terminate"
        actor: PlacementManager
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "terminated_at := logical now"
          - "CASCADE hop 1: every Placement with agreement_id == this.id and status == ACTIVE becomes RETIRED with retired_reason = AGREEMENT_TERMINATION (Placement.version +1)"
          - "CASCADE hop 2 (caused by hop 1): each such placement's Chiller transitions INSTALLED|ACTIVE|NEEDS_REPAIR -> IN_STOCK (Chiller.version +1)"
          - "CASCADE hop 3 (caused by hop 2): every ServiceTicket with chiller_id == that chiller and status in {OPEN, DISPATCHED} becomes CANCELLED (ServiceTicket.version +1)"
          - "increments PlacementAgreement.version by 1"

  - entity: Chiller
    initial_state: IN_STOCK
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_STOCK
        to: INSTALLED
        trigger: "POST /cold-chain/placements (the placement's chiller_id)"
        actor: PlacementManager
        preconditions:
          - "chiller.status == IN_STOCK (else ERR_CHILLER_NOT_IN_STOCK 409)"
        side_effects:
          - "increments Chiller.version by 1"
      - from: INSTALLED
        to: ACTIVE
        trigger: "system: first TemperatureReading with is_excursion == false posted to this chiller"
        actor: system
        preconditions:
          - "chiller.status == INSTALLED"
          - "reading.is_excursion == false"
        side_effects:
          - "increments Chiller.version by 1"
      - from: INSTALLED
        to: NEEDS_REPAIR
        trigger: "system: a posted TemperatureReading makes excursion_minutes_24h >= EXCURSION_SEVERE_MINUTES (120)"
        actor: system
        preconditions:
          - "chiller.status == INSTALLED"
          - "recomputed excursion_minutes_24h >= 120"
        side_effects:
          - "CASCADE hop 1: Placement with chiller_id == this.id and status == ACTIVE has operational_status -> SUSPENDED (Placement.version +1)"
          - "CASCADE hop 2 (caused by hop 1): every InventoryPosition at that placement's store with status == SELLABLE becomes QUARANTINED (InventoryPosition.version +1)"
          - "CASCADE hop 3 (sibling of hop 1): a ServiceTicket is minted with chiller_id == this.id, origin = AUTO_EXCURSION, status = OPEN, issue_summary = 'AUTO: severe temperature excursion'"
          - "increments Chiller.version by 1"
      - from: ACTIVE
        to: NEEDS_REPAIR
        trigger: "system: a posted TemperatureReading makes excursion_minutes_24h >= EXCURSION_SEVERE_MINUTES (120)"
        actor: system
        preconditions:
          - "chiller.status == ACTIVE"
          - "recomputed excursion_minutes_24h >= 120"
        side_effects:
          - "CASCADE hop 1: Placement with chiller_id == this.id and status == ACTIVE has operational_status -> SUSPENDED (Placement.version +1)"
          - "CASCADE hop 2 (caused by hop 1): every InventoryPosition at that placement's store with status == SELLABLE becomes QUARANTINED (InventoryPosition.version +1)"
          - "CASCADE hop 3 (sibling of hop 1): a ServiceTicket is minted with chiller_id == this.id, origin = AUTO_EXCURSION, status = OPEN, issue_summary = 'AUTO: severe temperature excursion'"
          - "increments Chiller.version by 1"
      - from: NEEDS_REPAIR
        to: ACTIVE
        trigger: "POST /cold-chain/service-tickets/{id}/resolve on any OPEN or DISPATCHED ticket naming this chiller"
        actor: FieldTechnician
        preconditions:
          - "chiller.status == NEEDS_REPAIR"
          - "ticket.status in {OPEN, DISPATCHED} (dispatch state of the ticket governs which transition fires; see ServiceTicket)"
        side_effects:
          - "last_repair_at := logical now; excursion_minutes_24h recomputes to 0 (window excludes readings at or before last_repair_at)"
          - "CASCADE: Placement with chiller_id == this.id and status == ACTIVE has operational_status SUSPENDED -> OK (Placement.version +1); quarantined InventoryPositions are NOT auto-restored (they await the date-check sweep)"
          - "increments Chiller.version by 1"
      - from: INSTALLED
        to: IN_STOCK
        trigger: "system: the placement using this chiller is RETIRED (POST /placements/{id}/retire, agreement terminate cascade, or relocate hop)"
        actor: system
        preconditions:
          - "the Placement with chiller_id == this.id transitions to RETIRED"
        side_effects:
          - "every ServiceTicket with chiller_id == this.id and status in {OPEN, DISPATCHED} becomes CANCELLED (ServiceTicket.version +1)"
          - "increments Chiller.version by 1"
      - from: ACTIVE
        to: IN_STOCK
        trigger: "system: the placement using this chiller is RETIRED"
        actor: system
        preconditions:
          - "the Placement with chiller_id == this.id transitions to RETIRED"
        side_effects:
          - "every ServiceTicket with chiller_id == this.id and status in {OPEN, DISPATCHED} becomes CANCELLED (ServiceTicket.version +1)"
          - "increments Chiller.version by 1"
      - from: NEEDS_REPAIR
        to: IN_STOCK
        trigger: "system: the placement using this chiller is RETIRED"
        actor: system
        preconditions:
          - "the Placement with chiller_id == this.id transitions to RETIRED"
        side_effects:
          - "every ServiceTicket with chiller_id == this.id and status in {OPEN, DISPATCHED} becomes CANCELLED (ServiceTicket.version +1)"
          - "increments Chiller.version by 1"
      - from: IN_STOCK
        to: DECOMMISSIONED
        trigger: "POST /cold-chain/chillers/{id}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "chiller.status == IN_STOCK (else ERR_INVALID_STATE 409)"
        side_effects:
          - "increments Chiller.version by 1"

  - entity: Placement
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: "Parallel state dimensions: status (lifecycle) x performance_status (velocity) x operational_status (chiller health). performance and operational transitions never gate each other; only status gates them."
    transitions:
      - from: "ACTIVE / performance PENDING"
        to: "ACTIVE / performance PERFORMING"
        trigger: "POST /cold-chain/placements/{id}/evaluate-performance"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE (else ERR_PLACEMENT_NOT_ACTIVE 409)"
          - "trailing_weekly_units >= VELOCITY_FLOOR_UNITS_PER_WEEK (40; boundary inclusive)"
        side_effects:
          - "performance_status := PERFORMING; underperforming_streak := 0"
          - "recompute standing_deliveries_per_week and safety_stock_units from trailing_weekly_units (calculations.delivery_frequency_plan)"
          - "recompute payback_actuals_months (calculations.payback_estimate variant ACTUALS)"
          - "increments Placement.version by 1"
      - from: "ACTIVE / performance PENDING"
        to: "ACTIVE / performance UNDERPERFORMING"
        trigger: "POST /cold-chain/placements/{id}/evaluate-performance"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE"
          - "trailing_weekly_units < 40"
        side_effects:
          - "performance_status := UNDERPERFORMING; underperforming_streak += 1"
          - "recompute standing_deliveries_per_week, safety_stock_units, payback_actuals_months"
          - "increments Placement.version by 1"
      - from: "ACTIVE / performance PERFORMING"
        to: "ACTIVE / performance UNDERPERFORMING"
        trigger: "POST /cold-chain/placements/{id}/evaluate-performance"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE"
          - "trailing_weekly_units < 40"
        side_effects:
          - "performance_status := UNDERPERFORMING; underperforming_streak := 1"
          - "recompute standing_deliveries_per_week, safety_stock_units, payback_actuals_months"
          - "increments Placement.version by 1"
      - from: "ACTIVE / performance UNDERPERFORMING"
        to: "ACTIVE / performance PERFORMING"
        trigger: "POST /cold-chain/placements/{id}/evaluate-performance"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE"
          - "trailing_weekly_units >= 40"
        side_effects:
          - "performance_status := PERFORMING; underperforming_streak := 0 (streak reset)"
          - "recompute standing_deliveries_per_week, safety_stock_units, payback_actuals_months"
          - "increments Placement.version by 1"
      - from: "ACTIVE / operational OK"
        to: "ACTIVE / operational SUSPENDED"
        trigger: "system: cascade hop 1 of Chiller -> NEEDS_REPAIR"
        actor: system
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.chiller_id == the degraded chiller"
        side_effects:
          - "cascade hop 2: store InventoryPositions SELLABLE -> QUARANTINED (see Chiller machine)"
      - from: "ACTIVE / operational SUSPENDED"
        to: "ACTIVE / operational OK"
        trigger: "system: cascade of ServiceTicket resolve (Chiller NEEDS_REPAIR -> ACTIVE)"
        actor: system
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.chiller_id == the repaired chiller"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cold-chain/placements/{id}/retire with mode = REMOVE"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE"
          - "if removal_reason == UNDERPERFORMANCE_REMOVAL: performance_status == UNDERPERFORMING AND underperforming_streak >= 2 (else ERR_UNDERPERFORMANCE_STREAK_INSUFFICIENT 409)"
        side_effects:
          - "retired_reason := removal_reason"
          - "CASCADE hop 1: chiller INSTALLED|ACTIVE|NEEDS_REPAIR -> IN_STOCK (Chiller.version +1)"
          - "CASCADE hop 2 (caused by hop 1): OPEN/DISPATCHED ServiceTickets for that chiller -> CANCELLED"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cold-chain/placements/{id}/retire with mode = RELOCATE"
        actor: PlacementManager
        preconditions:
          - "placement.status == ACTIVE"
          - "target agreement exists, has status == SIGNED, and belongs to target_store_id"
          - "target_store_id != placement.store_id (else ERR_RETIRE_TARGET_INVALID 422)"
          - "chiller.footprint_sqft <= target agreement.allocated_sqft (else ERR_STORE_FOOTPRINT_INSUFFICIENT 422)"
          - "target store's latest SiteEvaluation is ELIGIBLE and not stale (else ERR_PAYBACK_INELIGIBLE / ERR_EVALUATION_STALE)"
        side_effects:
          - "retired_reason := RELOCATION"
          - "a NEW Placement is created at target store with same chiller_id, status ACTIVE, performance PENDING, operational OK; relocated_to_placement_id := new placement id"
          - "target agreement SIGNED -> ACTIVE (PlacementAgreement.version +1)"
          - "chiller INSTALLED|ACTIVE|NEEDS_REPAIR -> INSTALLED at target (passes through IN_STOCK logically; single net Chiller.version +1)"
          - "OPEN/DISPATCHED ServiceTickets for that chiller -> CANCELLED"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: cascade hop 1 of PlacementAgreement terminate"
        actor: system
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.agreement_id == the terminated agreement"
        side_effects:
          - "retired_reason := AGREEMENT_TERMINATION; chiller -> IN_STOCK; its open tickets -> CANCELLED"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /cold-chain/service-tickets/{id}/dispatch"
        actor: ServiceDispatcher
        preconditions:
          - "ticket.status == OPEN (else ERR_INVALID_STATE 409)"
          - "window_end > window_start (else ERR_WINDOW_INVALID 400)"
          - "no other DISPATCHED ticket for the same chiller has a window overlapping [window_start, window_end); half-open semantics: existing.window_end == new.window_start or new.window_end == existing.window_start is NOT an overlap (else ERR_SERVICE_WINDOW_OVERLAP 409)"
        side_effects:
          - "window_start / window_end recorded"
          - "increments ServiceTicket.version by 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /cold-chain/service-tickets/{id}/resolve"
        actor: FieldTechnician
        preconditions:
          - "ticket.status == DISPATCHED"
        side_effects:
          - "resolution_note recorded"
          - "if ticket.chiller.status == NEEDS_REPAIR: chiller NEEDS_REPAIR -> ACTIVE with its cascade (last_repair_at reset, placement operational SUSPENDED -> OK)"
          - "increments ServiceTicket.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /cold-chain/service-tickets/{id}/resolve"
        actor: FieldTechnician
        preconditions:
          - "ticket.status == OPEN"
        side_effects:
          - "resolution_note recorded"
          - "if ticket.chiller.status == NEEDS_REPAIR: chiller NEEDS_REPAIR -> ACTIVE with its cascade"
          - "increments ServiceTicket.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "system: cascade of chiller returning to IN_STOCK (placement retire / agreement terminate / relocate)"
        actor: system
        preconditions:
          - "ticket.status == OPEN"
        side_effects:
          - "increments ServiceTicket.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "system: cascade of chiller returning to IN_STOCK"
        actor: system
        preconditions:
          - "ticket.status == DISPATCHED"
        side_effects:
          - "increments ServiceTicket.version by 1"

  - entity: Shipment
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED, SPOILED]
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /cold-chain/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == IN_TRANSIT (else ERR_INVALID_STATE 409)"
          - "shipment.lot.status != EXPIRED (business_safety, else ERR_LOT_EXPIRED 422)"
          - "logical now <= departed_at + MAX_TRANSIT_HOURS(48) inclusive (business_temporal, else ERR_TRANSIT_WINDOW_EXCEEDED 422)"
          - "accepted_units + rejected_units == quantity_units (else ERR_SHIPMENT_RECONCILE_MISMATCH 422)"
        side_effects:
          - "delivered_at := logical now"
          - "lot buckets: in_transit_qty -= quantity_units; in_store_qty += accepted_units; spoiled_qty += rejected_units"
          - "if accepted_units > 0: create or merge InventoryPosition (store_id, lot_id) with qty_on_hand += accepted_units, status SELLABLE, expiry_date := lot.expires_at"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: SPOILED
        trigger: "system: a deliver attempt arrives with logical now > departed_at + 48h, or any read observes logical now > departed_at + 48h (lazy materialization)"
        actor: system
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "logical now > departed_at + 48h"
        side_effects:
          - "lot buckets: in_transit_qty -= quantity_units; spoiled_qty += quantity_units"
          - "increments Shipment.version by 1"
        note: "The deliver call that trips this transition responds 422 ERR_TRANSIT_WINDOW_EXCEEDED after persisting SPOILED."

  - entity: ProductLot
    initial_state: QUARANTINE
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /cold-chain/product-lots/{id}/release with qc_passed = true"
        actor: ProductionPlanner
        preconditions:
          - "lot.status == QUARANTINE (else ERR_INVALID_STATE 409)"
          - "qc_passed == true"
        side_effects:
          - "increments ProductLot.version by 1"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /cold-chain/product-lots/{id}/release with qc_passed = false"
        actor: ProductionPlanner
        preconditions:
          - "lot.status == QUARANTINE"
          - "qc_passed == false"
        side_effects:
          - "increments ProductLot.version by 1"
      - from: QUARANTINE
        to: EXPIRED
        trigger: "system: lazy materialization when logical now > expires_at, applied on any read or use of the lot"
        actor: system
        preconditions:
          - "lot.status == QUARANTINE"
          - "logical now > lot.expires_at"
        side_effects:
          - "increments ProductLot.version by 1"
      - from: RELEASED
        to: EXPIRED
        trigger: "system: lazy materialization when logical now > expires_at"
        actor: system
        preconditions:
          - "lot.status == RELEASED"
          - "logical now > lot.expires_at"
        side_effects:
          - "increments ProductLot.version by 1"

  - entity: InventoryPosition
    initial_state: SELLABLE
    terminal_states: [REMOVED]
    transitions:
      - from: SELLABLE
        to: QUARANTINED
        trigger: "system: cascade hop 2 of Chiller -> NEEDS_REPAIR (cold-chain breach at the store)"
        actor: system
        preconditions:
          - "position.status == SELLABLE"
          - "position.store_id == the store whose placement's chiller degraded"
        side_effects:
          - "increments InventoryPosition.version by 1"
      - from: SELLABLE
        to: REMOVED
        trigger: "POST /cold-chain/stores/{id}/inventory/date-check-sweep"
        actor: StoreOperator
        preconditions:
          - "position.status == SELLABLE"
          - "now > position.expiry_date (reason EXPIRED) OR floor((expiry_date - now)/86400s) <= REMOVAL_LEAD_DAYS(7) (reason NEAR_EXPIRY)"
        side_effects:
          - "removal_reason := EXPIRED if expired else NEAR_EXPIRY"
          - "lot buckets: in_store_qty -= qty_on_hand; removed_qty += qty_on_hand"
          - "increments InventoryPosition.version by 1"
      - from: QUARANTINED
        to: REMOVED
        trigger: "POST /cold-chain/stores/{id}/inventory/date-check-sweep"
        actor: StoreOperator
        preconditions:
          - "position.status == QUARANTINED"
        side_effects:
          - "removal_reason := EXPIRED if now > expiry_date else COLD_CHAIN_BREACH (evaluation order: EXPIRED first, then COLD_CHAIN_BREACH, then NEAR_EXPIRY)"
          - "lot buckets: in_store_qty -= qty_on_hand; removed_qty += qty_on_hand"
          - "increments InventoryPosition.version by 1"

  - entity: CapacityProject
    initial_state: PROPOSED
    terminal_states: [COMMISSIONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /cold-chain/capacity-projects/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "project.status == PROPOSED (else ERR_INVALID_STATE 409)"
          - "X-User-ID != project.created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES 403)"
        side_effects:
          - "sequence_no := 1 + max(sequence_no over all projects with non-null sequence_no); 1 if none"
          - "increments CapacityProject.version by 1"
      - from: APPROVED
        to: COMMISSIONED
        trigger: "POST /cold-chain/capacity-projects/{id}/commission"
        actor: PlatformAdmin
        preconditions:
          - "project.status == APPROVED (else ERR_INVALID_STATE 409)"
          - "no other project has status == APPROVED with a strictly smaller sequence_no (commission strictly in approval order, else ERR_EXPANSION_SEQUENCE_VIOLATION 409)"
        side_effects:
          - "manufacturing capacity ledger: total_capacity_units = BASE_MANUFACTURING_CAPACITY_UNITS(200) + sum(capacity_delta_units of COMMISSIONED projects) (calculations.expansion_capacity_ledger)"
          - "increments CapacityProject.version by 1"

  - entity: TrialCampaign
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: lazy materialization when logical now > end_date + 1 day, applied on any read of the campaign"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
          - "logical now > campaign.end_date + 1 day"
        side_effects:
          - "increments TrialCampaign.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-revise-stale-version
    parent_entity: PlacementAgreement
    write_endpoint: "POST /cold-chain/placement-agreements/{id}/revise"
    occ_field: expected_agreement_version
    description: |
      Revising a PlacementAgreement whose version has advanced past the
      caller's last observed version is rejected. This captures the case where
      another editor has just revised the terms (a revise supersedes the prior
      commercial terms under the agreement state machine) and the current
      caller's view of the agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: placement-install-stale-agreement
    parent_entity: PlacementAgreement
    write_endpoint: "POST /cold-chain/placements"
    occ_field: expected_agreement_version
    description: |
      Installing a chiller against a PlacementAgreement whose version has
      advanced past the caller's last observed version is rejected: the terms
      the caller priced the installation against may have been superseded by a
      revision. The caller must re-read the agreement and resubmit with the
      current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: site_selection_score
    description: "Composite placement-priority score for a SiteEvaluation."
    trigger: "POST /cold-chain/stores/{id}/site-evaluations (computed at creation, immutable afterwards)"
    inputs: ["store.demographic_index", "store.weekly_category_velocity_index", "store.competitor_density_index", "footprint_score", "model_variant"]
    algorithm: weighted_scoring
    formula: |
      footprint_score = min(100, round_half_up(100 * allocated_sqft / FOOTPRINT_REFERENCE_SQFT))
      composite_score = W_D * demographic_index
                      + W_V * weekly_category_velocity_index
                      + W_F * footprint_score
                      - W_C * competitor_density_index
      composite_score rounded to 2 decimals, round_half_up.
    input_set: "Exactly the Store fields and the evaluation's own inputs; no other entities."
    constants:
      FOOTPRINT_REFERENCE_SQFT: 32
      W_D_DEMOGRAPHIC_LED: 0.45
      W_V_DEMOGRAPHIC_LED: 0.25
      W_F_DEMOGRAPHIC_LED: 0.20
      W_C_DEMOGRAPHIC_LED: 0.10
      W_D_VELOCITY_LED: 0.20
      W_V_VELOCITY_LED: 0.55
      W_F_VELOCITY_LED: 0.15
      W_C_VELOCITY_LED: 0.10
      SCORE_ELIGIBILITY_MIN: 60.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: DEMOGRAPHIC_LED
        when: "SiteEvaluation.model_variant == DEMOGRAPHIC_LED"
        difference: "Uses the DEMOGRAPHIC_LED weight row; weights demographic fit over velocity."
      - name: VELOCITY_LED
        when: "SiteEvaluation.model_variant == VELOCITY_LED"
        difference: "Uses the VELOCITY_LED weight row; identical store inputs produce a different composite_score than DEMOGRAPHIC_LED (e.g. demo 80 / velocity 90 / footprint 50 / competitor 20 yields 66.50 DEMOGRAPHIC_LED vs 71.00 VELOCITY_LED)."

  - name: installation_quote
    description: "All-in placement capex quote in whole cents."
    trigger: "SiteEvaluation creation (stored as install_quote_cents) and Placement creation (stored as installed_quote_cents, recomputed from chiller.model + agreement.allocated_sqft + store.distance_miles_from_plant)"
    inputs: ["chiller_model", "allocated_sqft", "store.distance_miles_from_plant"]
    algorithm: aggregation
    formula: |
      unit_cost   = CHILLER_STANDARD_UNIT_CENTS if model == STANDARD else CHILLER_COMPACT_UNIT_CENTS
      sqft_cost   = round_half_up(allocated_sqft * RATE_PER_SQFT_CENTS)
      mile_cost   = round_half_up(distance_miles_from_plant * RATE_PER_MILE_CENTS)
      quote_cents = unit_cost + INSTALL_FEE_CENTS + sqft_cost + mile_cost
      PINNED ROUNDING ORDER: each cost component is rounded to whole cents
      individually (round_half_up) BEFORE summation. Summing unrounded
      components and rounding once at the end is a different, non-conformant
      algorithm.
    input_set: "Single evaluation or placement context."
    constants:
      CHILLER_STANDARD_UNIT_CENTS: 325000
      CHILLER_COMPACT_UNIT_CENTS: 218000
      INSTALL_FEE_CENTS: 45000
      RATE_PER_SQFT_CENTS: 1250
      RATE_PER_MILE_CENTS: 925
    precision: "whole cents; per-component round_half_up then sum"

  - name: payback_estimate
    description: "Placement payback in months; two variants over the same placement economics."
    trigger: "PRO_FORMA at SiteEvaluation creation (uses forecast_weekly_units and install_quote_cents); ACTUALS at each evaluate-performance (uses trailing_weekly_units and placement.installed_quote_cents)"
    inputs: ["weekly_units (forecast or trailing)", "total_cost_cents"]
    algorithm: forward_looking
    formula: |
      monthly_units = round_half_up(weekly_units * 13 / 3)   # integer units, rounded FIRST
      monthly_margin_cents = monthly_units * UNIT_MARGIN_CENTS
      if monthly_units == 0: payback_months = null           # zero-velocity guard
      else: payback_months = round_half_up(total_cost_cents / monthly_margin_cents, 2)
      PINNED EVALUATION/ROUNDING ORDER: round weekly->monthly units to an
      integer FIRST, then multiply by margin, then divide and round the final
      ratio to 2 decimals. Carrying the fractional monthly units into the
      margin multiplication is a different, non-conformant algorithm (e.g.
      cost 291600, weekly 10.4: pinned order gives 36.00; unrounded-monthly
      gives 35.95).
    input_set: "PRO_FORMA: the evaluation's forecast_weekly_units + install_quote_cents. ACTUALS: the evaluate-performance trailing_weekly_units + placement.installed_quote_cents."
    constants:
      UNIT_MARGIN_CENTS: 180
      WEEKS_PER_MONTH_NUM: 13
      WEEKS_PER_MONTH_DEN: 3
      PAYBACK_MAX_MONTHS: 36.0
    precision: "2 decimal places, round_half_up; intermediate monthly_units integer"
    variants:
      - name: PRO_FORMA
        when: "SiteEvaluation context"
        difference: "Uses forecast weekly units and evaluation quote; drives verdict eligibility (payback_months <= 36.0 inclusive)."
      - name: ACTUALS
        when: "Placement evaluate-performance context"
        difference: "Uses reported trailing weekly units and the placement's snapshot quote; identical cost inputs with different velocity produce a different payback (e.g. cost 399000: forecast 200/wk -> 2.56 months; actuals 100/wk -> 5.12 months)."

  - name: delivery_frequency_plan
    description: "Standing delivery frequency tier and safety-stock ceiling for a Placement."
    trigger: "Placement creation (velocity := governing evaluation's forecast_weekly_units) and every evaluate-performance (velocity := trailing_weekly_units)"
    inputs: ["velocity_units_per_week", "chiller.capacity_units", "SHELF_LIFE_DAYS", "SAFETY_STOCK_FACTOR"]
    algorithm: threshold
    formula: |
      deliveries_per_week =
          5 if velocity >= 300
      else 3 if velocity >= 150
      else 2 if velocity >= 60
      else 1 if velocity >= 25
      else 0
      (tier boundaries inclusive on the lower bound)
      safety_stock_units = min(chiller.capacity_units,
                               round_half_up(velocity * SHELF_LIFE_DAYS / 7 * SAFETY_STOCK_FACTOR))
    input_set: "The placement's own velocity figure and its chiller's capacity."
    constants:
      SHELF_LIFE_DAYS: 45
      SAFETY_STOCK_FACTOR: 1.25
    precision: "integer units, round_half_up"

  - name: excursion_severity_accumulator
    description: "Rolling severe-excursion detector per chiller."
    trigger: "Every POST /cold-chain/chillers/{id}/temperature-readings"
    inputs: ["all TemperatureReadings of the chiller", "logical now", "chiller.last_repair_at"]
    algorithm: chronological
    formula: |
      is_excursion(reading) = reading.temp_c < CHILLER_TEMP_MIN_C OR reading.temp_c > CHILLER_TEMP_MAX_C
      excursion_minutes_24h = sum(reading.duration_minutes)
          over readings where is_excursion(reading)
            AND reading.recorded_at within [now - 24h, now]   (by recorded_at, inclusive both ends)
            AND (last_repair_at is null OR reading.recorded_at > last_repair_at)
      Severe iff excursion_minutes_24h >= EXCURSION_SEVERE_MINUTES (boundary inclusive).
      Late-arriving readings count by their recorded_at regardless of posting
      order. The 24h window slides with the logical clock.
    input_set: "Readings of this chiller only, filtered by excursion flag, 24h recorded_at window, and post-repair cutoff."
    constants:
      CHILLER_TEMP_MIN_C: 0.0
      CHILLER_TEMP_MAX_C: 4.0
      EXCURSION_SEVERE_MINUTES: 120
    precision: "integer minutes"

  - name: lot_unit_conservation
    description: "Conservation of product units across the cold chain for each ProductLot."
    trigger: "Invariant maintained by shipment create, shipment deliver, shipment spoil, and date-check sweep"
    inputs: ["lot buckets"]
    algorithm: aggregation
    formula: |
      INVARIANT: quantity_units == unshipped_qty + in_transit_qty + in_store_qty + removed_qty + spoiled_qty
      shipment create (q):    unshipped_qty -= q;      in_transit_qty += q
      deliver (a accepted, r rejected, a + r == q):
                              in_transit_qty -= q;     in_store_qty += a;  spoiled_qty += r
      spoil of IN_TRANSIT (q): in_transit_qty -= q;    spoiled_qty += q
      sweep removal (u):      in_store_qty  -= u;      removed_qty  += u
      shrink_rate = round_half_up(removed_qty + spoiled_qty, 0) / quantity_units  (derived; 4 decimals)
    input_set: "Exactly one ProductLot's five buckets."
    constants: {}
    precision: "integer units; shrink_rate 4 decimals round_half_up"

  - name: expansion_capacity_ledger
    description: "Manufacturing capacity ledger and expansion sequencing."
    trigger: "Chiller registration (capacity check) and CapacityProject commission (ledger update)"
    inputs: ["count of all registered Chiller rows", "COMMISSIONED projects' capacity_delta_units", "SIGNED|ACTIVE agreements lacking an ACTIVE placement"]
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (dependency chain — compute top-down, never
      reorder):
        (1) commissioned_capacity = sum(capacity_delta_units) over projects
            with status == COMMISSIONED, taken in ascending sequence_no
        (2) total_capacity_units  = BASE_MANUFACTURING_CAPACITY_UNITS + commissioned_capacity
        (3) registered_units      = count of all Chiller rows ever created
            (any status, including DECOMMISSIONED)
        (4) headroom              = total_capacity_units - registered_units
        (5) placement_backlog     = count of PlacementAgreements with status in
            {SIGNED, ACTIVE} that have no Placement with status == ACTIVE
        (6) expansion_priority    = placement_backlog * 100 / max(headroom, 1)
            (reported for information; 2 decimals, round_half_up)
      Chiller registration of a batch of size q requires q <= headroom
      evaluated at registration time (else ERR_CAPACITY_EXCEEDED, whole batch
      rejected atomically).
    input_set: "All Chiller rows; all CapacityProjects; all PlacementAgreements and Placements for the backlog term."
    constants:
      BASE_MANUFACTURING_CAPACITY_UNITS: 200
    precision: "integer units; expansion_priority 2 decimals round_half_up"

  - name: underperformance_tracker
    description: "Consecutive-underperformance streak driving removal eligibility."
    trigger: "POST /cold-chain/placements/{id}/evaluate-performance"
    inputs: ["trailing_weekly_units", "placement.performance_status", "placement.underperforming_streak"]
    algorithm: chronological
    formula: |
      verdict = PERFORMING if trailing_weekly_units >= VELOCITY_FLOOR_UNITS_PER_WEEK else UNDERPERFORMING
      if verdict == PERFORMING:    underperforming_streak := 0
      if verdict == UNDERPERFORMING:
          streak := (1 if previous performance_status == PERFORMING|PENDING-with-zero-streak else previous streak + 1)
      Equivalently: UNDERPERFORMING increments the streak, PERFORMING resets it to 0.
      Retire with reason UNDERPERFORMANCE_REMOVAL requires streak >= UNDERPERFORMING_STREAK_REMOVAL_MIN.
    input_set: "The placement's own evaluation history, strictly ordered by evaluation call order."
    constants:
      VELOCITY_FLOOR_UNITS_PER_WEEK: 40
      UNDERPERFORMING_STREAK_REMOVAL_MIN: 2
    precision: "integer streak"

  - name: fleet_capacity_conservation
    description: "Conservation of chiller fleet size and installed capacity across placement operations."
    trigger: "Invariant maintained by placement install, retire (REMOVE/RELOCATE), terminate cascade, and decommission"
    inputs: ["all Chiller rows", "all Placement rows"]
    algorithm: aggregation
    formula: |
      INVARIANT 1 (fleet size): count(Chiller rows) changes ONLY via
      POST /cold-chain/chillers (+quantity) and never via placement install,
      retire, relocate, or agreement termination. Decommission changes status,
      not the count.
      INVARIANT 2 (status partition): for every chiller at every moment,
      status is exactly one of IN_STOCK | INSTALLED | ACTIVE | NEEDS_REPAIR |
      DECOMMISSIONED, so sum over statuses == fleet size.
      INVARIANT 3 (installed capacity): FLEET_INSTALLED_CAPACITY_UNITS =
      sum(capacity_units) over chillers with status in {INSTALLED, ACTIVE,
      NEEDS_REPAIR}. A RELOCATE (forward) paired with a later re-install of
      the same chiller (compensating) leaves FLEET_INSTALLED_CAPACITY_UNITS
      unchanged net-net; a REMOVE followed by re-install of the same chiller
      likewise restores it exactly (240 -> 0 -> 240 for a STANDARD unit).
    input_set: "The whole Chiller fleet; placements only to identify which chiller is installed where."
    constants: {}
    precision: "integer units"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role; request body well-formed; no undeclared payload fields; declared field types/ranges honored (e.g. quantity_units > 0, temp_c within -40..60, end_date >= start_date)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Missing/blank headers -> 401 ERR_UNAUTHENTICATED. Malformed body, unknown fields, missing required fields, and scalar range violations -> 400 ERR_VALIDATION (same priority tier, request-shape errors)."
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list; ownership: StoreOperator's X-User-ID must equal the store scope of the action (readings: the store of the chiller's ACTIVE placement; sweep: the path store id); segregation of duties: capacity approve X-User-ID must differ from created_by_user_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    description: "Role not listed -> 403 ERR_FORBIDDEN_ROLE. StoreOperator scope mismatch -> 403 ERR_STORE_OWNERSHIP_MISMATCH. SoD violation -> 403 ERR_SEGREGATION_OF_DUTIES."
  - priority: 3
    category: existence
    check: "Path parameters and body foreign keys resolve to existing rows, validated left-to-right (path first, then body in field order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "State-machine preconditions of the target transition (agreement SIGNED for install, chiller IN_STOCK for install, placement ACTIVE for evaluate/retire, lot RELEASED for shipment, ticket OPEN for dispatch, project status for approve/commission, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    description: "Machine-specific codes in this tier: ERR_AGREEMENT_NOT_SIGNED, ERR_CHILLER_NOT_IN_STOCK, ERR_PLACEMENT_NOT_ACTIVE, ERR_PLACEMENT_NOT_OPERATIONAL, ERR_DUPLICATE_ACTIVE_PLACEMENT, ERR_LOT_NOT_RELEASED, ERR_DELIVERY_ROUTE_INACTIVE, ERR_UNDERPERFORMANCE_STREAK_INSUFFICIENT, ERR_EXPANSION_SEQUENCE_VIOLATION, ERR_SERIAL_NOT_UNIQUE; generic fallthrough ERR_INVALID_STATE. OCC failures are NOT state errors: stale expected_*_version -> 412 ERR_STALE_VERSION evaluated in this tier after state preconditions."
  - priority: 5
    category: business_safety
    check: "Cold-chain safety: lot not EXPIRED at shipment create/deliver; qc gate honored"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /cold-chain/shipments, POST /cold-chain/shipments/{id}/deliver"
  - priority: 6
    category: business_temporal
    check: "Temporal windows: deliver within MAX_TRANSIT_HOURS of departure; install requires a non-stale SiteEvaluation (created_at within EVALUATION_STALENESS_DAYS = 90 days of logical now); trial campaign interval rules (closed-interval overlap checked BEFORE the 14-day gap rule)"
    error_id: ERR_TRANSIT_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /cold-chain/shipments/{id}/deliver, POST /cold-chain/placements, POST /cold-chain/placements/{id}/retire, POST /cold-chain/stores/{id}/trial-campaigns"
    description: "Tier codes: ERR_TRANSIT_WINDOW_EXCEEDED (deliver), ERR_EVALUATION_STALE (install/relocate), ERR_TRIAL_WINDOW_OVERLAP 409 (trials), ERR_TRIAL_GAP_VIOLATION 422 (trials). Intra-tier order for trials: overlap first, gap second."
  - priority: 7
    category: business_constraint
    check: "Constraint satisfaction: chiller service-calendar overlap (half-open), footprint fit, shipment quantity vs lot availability and safety stock, manufacturing capacity headroom, serial uniqueness, reconcile sum"
    error_id: ERR_SERVICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "dispatch/install/shipment/chiller-create/deliver endpoints"
    description: "Tier codes: ERR_SERVICE_WINDOW_OVERLAP 409, ERR_STORE_FOOTPRINT_INSUFFICIENT 422, ERR_SHIPMENT_QUANTITY_EXCEEDS 422, ERR_CAPACITY_EXCEEDED 422, ERR_SHIPMENT_RECONCILE_MISMATCH 422."
  - priority: 8
    category: business_referential
    check: "Cross-reference coherence: placement.store_id must equal agreement.store_id; retire RELOCATE target store must differ from current store and target agreement must belong to target store"
    error_id: ERR_AGREEMENT_STORE_MISMATCH
    http_status: 422
    applies_to: "POST /cold-chain/placements, POST /cold-chain/placements/{id}/retire"
    description: "Tier codes: ERR_AGREEMENT_STORE_MISMATCH, ERR_RETIRE_TARGET_INVALID."
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates: installed_quote_cents <= agreement.max_capex_cents; latest SiteEvaluation verdict == ELIGIBLE"
    error_id: ERR_CAPEX_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /cold-chain/placements, POST /cold-chain/placements/{id}/retire (relocate)"
    description: "Tier codes: ERR_CAPEX_BUDGET_EXCEEDED, ERR_PAYBACK_INELIGIBLE."

# =============================================================================
# Table 1.5: API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock (UNPREFIXED platform endpoint, outside api_prefix). Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock. Forward-only: to_iso8601 must be strictly greater than the current logical time (else 400 ERR_CLOCK_REGRESSION)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["lazy time-based transitions (lot EXPIRED, shipment SPOILED, trial COMPLETED) materialize on subsequent reads/writes"]
  - method: POST
    path: /cold-chain/stores
    description: "Register a retail store candidate."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, demographic_index, weekly_category_velocity_index, competitor_density_index, available_sqft, distance_miles_from_plant]
    output: Store
    side_effects: []
  - method: GET
    path: /cold-chain/stores/{id}
    description: "Fetch one store."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: /cold-chain/stores/{id}/site-evaluations
    description: "Create a SiteEvaluation; computes footprint_score, composite_score, install_quote_cents, payback_months (PRO_FORMA), verdict."
    roles: [PlacementManager]
    code: 201
    input: [model_variant, chiller_model, forecast_weekly_units, allocated_sqft]
    output: SiteEvaluation
    side_effects: ["runs calculations.site_selection_score, calculations.installation_quote, calculations.payback_estimate (PRO_FORMA)"]
  - method: GET
    path: /cold-chain/stores/{id}/site-evaluations
    description: "List evaluations for a store, ordered by created_at ASC."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['limit?', 'offset?']
    output: SiteEvaluation[]
    side_effects: []
  - method: POST
    path: /cold-chain/stores/{id}/placement-agreements
    description: "Open a placement agreement with a store; created in PROPOSED."
    roles: [PlacementManager]
    code: 201
    input: [allocated_sqft, max_capex_cents, term_months]
    output: PlacementAgreement
    side_effects: []
  - method: GET
    path: /cold-chain/stores/{id}/placement-agreements
    description: "List agreements for a store, ordered by created_at ASC."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['limit?', 'offset?']
    output: PlacementAgreement[]
    side_effects: []
  - method: POST
    path: /cold-chain/placement-agreements/{id}/revise
    description: "Revise commercial terms of a PROPOSED agreement (negotiation round). OCC-guarded."
    roles: [PlacementManager]
    code: 200
    input: [expected_agreement_version, 'allocated_sqft?', 'max_capex_cents?', 'term_months?']
    output: PlacementAgreement
    side_effects: ["increments PlacementAgreement.version by 1"]
  - method: POST
    path: /cold-chain/placement-agreements/{id}/sign
    description: "Sign a PROPOSED agreement."
    roles: [PlacementManager]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["signed_at := now", "increments PlacementAgreement.version by 1"]
  - method: POST
    path: /cold-chain/placement-agreements/{id}/terminate
    description: "Terminate an agreement in any non-terminal state; cascade retires ACTIVE placements, returns chillers to stock, cancels their open tickets."
    roles: [PlacementManager]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["cascade hops per state_machines.PlacementAgreement ACTIVE->TERMINATED", "increments PlacementAgreement.version by 1"]
  - method: POST
    path: /cold-chain/chillers
    description: "Register a manufactured batch of identical chillers; mints serial_no values as serial_prefix + '-' + zero-padded 4-digit sequence (e.g. FP-0007). Sequence starts at serial_start_seq when given, else the next free sequence for that prefix. Any serial collision across the fleet rejects the whole batch. Atomic: whole batch also rejected when it would exceed manufacturing headroom."
    roles: [ProductionPlanner]
    code: 201
    input: [model, serial_prefix, quantity, 'serial_start_seq?']
    output: Chiller[]
    side_effects: ["checks calculations.expansion_capacity_ledger headroom", "quantity >= 1 (else 400 ERR_VALIDATION)"]
  - method: GET
    path: /cold-chain/chillers
    description: "Fleet list with optional filters; pagination envelope total_count is the fleet-size observable."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['status?', 'model?', 'limit?', 'offset?']
    output: Chiller[]
    side_effects: []
  - method: GET
    path: /cold-chain/chillers/{id}
    description: "Fetch one chiller including computed excursion_minutes_24h."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: Chiller
    side_effects: []
  - method: POST
    path: /cold-chain/chillers/{id}/decommission
    description: "Decommission an IN_STOCK chiller."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Chiller
    side_effects: ["increments Chiller.version by 1"]
  - method: POST
    path: /cold-chain/chillers/{id}/temperature-readings
    description: "Post a telemetry reading for an INSTALLED/ACTIVE/NEEDS_REPAIR chiller (else 409 ERR_INVALID_STATE). recorded_at must be <= logical now (else 400 ERR_VALIDATION). StoreOperator callers must own the store of the chiller's ACTIVE placement (else 403 ERR_STORE_OWNERSHIP_MISMATCH). Recomputes excursion accumulator; may trigger the severe-excursion cascade and the INSTALLED->ACTIVE activation."
    roles: [StoreOperator, PlatformAdmin]
    code: 201
    input: [recorded_at, temp_c, duration_minutes]
    output: TemperatureReading
    side_effects: ["runs calculations.excursion_severity_accumulator", "Chiller INSTALLED->ACTIVE on first in-range reading", "Chiller ->NEEDS_REPAIR cascade at >= 120 excursion minutes (placement SUSPENDED, positions QUARANTINED, AUTO_EXCURSION ticket minted)"]
  - method: GET
    path: /cold-chain/chillers/{id}/temperature-readings
    description: "List readings for a chiller, ordered by recorded_at ASC (arrival order irrelevant to ordering)."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['limit?', 'offset?']
    output: TemperatureReading[]
    side_effects: []
  - method: POST
    path: /cold-chain/placements
    description: "Install a chiller: creates Placement (ACTIVE / PENDING / OK), moves chiller IN_STOCK->INSTALLED, agreement SIGNED->ACTIVE. OCC-guarded on the agreement. Requires: agreement SIGNED; agreement.store_id == store_id; chiller IN_STOCK; chiller.footprint_sqft <= agreement.allocated_sqft; latest SiteEvaluation for the store ELIGIBLE and created within 90 days; installed_quote_cents <= agreement.max_capex_cents; no other ACTIVE placement at the store."
    roles: [PlacementManager]
    code: 201
    input: [store_id, agreement_id, chiller_id, expected_agreement_version]
    output: Placement
    side_effects: ["Chiller IN_STOCK -> INSTALLED (version +1)", "PlacementAgreement SIGNED -> ACTIVE (version +1)", "initializes standing_deliveries_per_week and safety_stock_units from the governing evaluation forecast (calculations.delivery_frequency_plan)", "snapshots installed_quote_cents (calculations.installation_quote)"]
  - method: GET
    path: /cold-chain/placements
    description: "Placement list with optional filters covering all placement FKs."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['store_id?', 'chiller_id?', 'agreement_id?', 'status?', 'relocated_to_placement_id?', 'limit?', 'offset?']
    output: Placement[]
    side_effects: []
  - method: GET
    path: /cold-chain/placements/{id}
    description: "Fetch one placement including computed plan fields."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: POST
    path: /cold-chain/placements/{id}/evaluate-performance
    description: "Report trailing 13-week average weekly unit velocity; drives performance_status, streak, delivery plan, and ACTUALS payback."
    roles: [PlacementManager]
    code: 200
    input: [trailing_weekly_units]
    output: Placement
    side_effects: ["runs calculations.underperformance_tracker", "runs calculations.delivery_frequency_plan", "runs calculations.payback_estimate (ACTUALS)", "increments Placement.version by 1"]
  - method: POST
    path: /cold-chain/placements/{id}/retire
    description: "Retire a placement. mode REMOVE requires removal_reason; UNDERPERFORMANCE_REMOVAL requires streak >= 2. mode RELOCATE requires target_store_id + target_agreement_id and re-installs the same chiller at the target store under a SIGNED agreement."
    roles: [PlacementManager]
    code: 200
    input: [mode, 'removal_reason?', 'target_store_id?', 'target_agreement_id?']
    output: Placement
    side_effects: ["retire cascades per state_machines.Placement (chiller to IN_STOCK, tickets CANCELLED)", "RELOCATE creates successor Placement and activates target agreement"]
  - method: POST
    path: /cold-chain/service-tickets
    description: "Manually open a service ticket for a chiller (store-reported issue)."
    roles: [ServiceDispatcher, StoreOperator]
    code: 201
    input: [chiller_id, issue_summary]
    output: ServiceTicket
    side_effects: ["origin := MANUAL"]
  - method: GET
    path: /cold-chain/chillers/{id}/service-tickets
    description: "List tickets for a chiller, ordered by created_at ASC."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['status?', 'limit?', 'offset?']
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: /cold-chain/service-tickets/{id}/dispatch
    description: "Dispatch an OPEN ticket into a service window on the chiller's calendar; half-open interval [window_start, window_end); overlap with another DISPATCHED window for the same chiller rejected; touching endpoints allowed."
    roles: [ServiceDispatcher]
    code: 200
    input: [window_start, window_end]
    output: ServiceTicket
    side_effects: ["increments ServiceTicket.version by 1"]
  - method: POST
    path: /cold-chain/service-tickets/{id}/resolve
    description: "Resolve an OPEN or DISPATCHED ticket; if the chiller is NEEDS_REPAIR this performs the repair (chiller -> ACTIVE, accumulator reset, placement operational OK)."
    roles: [FieldTechnician]
    code: 200
    input: [resolution_note]
    output: ServiceTicket
    side_effects: ["repair cascade per state_machines.Chiller NEEDS_REPAIR->ACTIVE when applicable", "increments ServiceTicket.version by 1"]
  - method: POST
    path: /cold-chain/shipments
    description: "Dispatch a refrigerated shipment: departs immediately (departed_at := logical now). Requires destination store to have a Placement with status ACTIVE and operational_status OK and standing_deliveries_per_week > 0; lot RELEASED and not EXPIRED; quantity_units <= lot.unshipped_qty and <= placement.safety_stock_units."
    roles: [LogisticsCoordinator]
    code: 201
    input: [store_id, lot_id, quantity_units]
    output: Shipment
    side_effects: ["lot buckets: unshipped_qty -= quantity_units; in_transit_qty += quantity_units"]
  - method: GET
    path: /cold-chain/shipments
    description: "Shipment list with optional filters covering both shipment FKs."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['store_id?', 'lot_id?', 'status?', 'limit?', 'offset?']
    output: Shipment[]
    side_effects: []
  - method: GET
    path: /cold-chain/shipments/{id}
    description: "Fetch one shipment (lazy SPOILED materialization applies on read)."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["lazy SPOILED transition when now > departed_at + 48h"]
  - method: POST
    path: /cold-chain/shipments/{id}/deliver
    description: "Dock reconciliation of an IN_TRANSIT shipment. Safety (lot not EXPIRED) is checked before the transit window. On window violation the shipment is persisted SPOILED and 422 is returned. accepted_units + rejected_units must equal quantity_units."
    roles: [LogisticsCoordinator]
    code: 200
    input: [accepted_units, rejected_units]
    output: Shipment
    side_effects: ["lot buckets per state_machines.Shipment DELIVERED/SPOILED", "creates/merges InventoryPosition when accepted_units > 0", "increments Shipment.version by 1"]
  - method: POST
    path: /cold-chain/product-lots
    description: "Register a produced lot (enters QUARANTINE). produced_at must be <= logical now."
    roles: [ProductionPlanner]
    code: 201
    input: [sku, produced_at, quantity_units]
    output: ProductLot
    side_effects: ["initializes buckets: unshipped_qty := quantity_units, others 0", "computes expires_at := produced_at + 45 days"]
  - method: GET
    path: /cold-chain/product-lots/{id}
    description: "Fetch one lot including conservation buckets (lazy EXPIRED materialization applies on read)."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["lazy EXPIRED transition when now > expires_at"]
  - method: POST
    path: /cold-chain/product-lots/{id}/release
    description: "Quality gate: qc_passed true releases the lot for distribution; false rejects it terminally."
    roles: [ProductionPlanner]
    code: 200
    input: [qc_passed]
    output: ProductLot
    side_effects: ["increments ProductLot.version by 1"]
  - method: GET
    path: /cold-chain/inventory-positions
    description: "Inventory position list with optional filters covering all position FKs."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['store_id?', 'lot_id?', 'status?', 'limit?', 'offset?']
    output: InventoryPosition[]
    side_effects: []
  - method: GET
    path: /cold-chain/inventory-positions/{id}
    description: "Fetch one inventory position."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: []
    output: InventoryPosition
    side_effects: []
  - method: POST
    path: /cold-chain/stores/{id}/inventory/date-check-sweep
    description: "In-store date checking and removal: removes expired positions (reason EXPIRED), quarantined positions (COLD_CHAIN_BREACH), and positions within REMOVAL_LEAD_DAYS = 7 days of expiry (NEAR_EXPIRY); evaluation order EXPIRED > COLD_CHAIN_BREACH > NEAR_EXPIRY. StoreOperator must own the path store."
    roles: [StoreOperator, PlacementManager]
    code: 200
    input: []
    output: { positions_removed: integer, units_removed: integer, expired_units: integer, cold_chain_breach_units: integer, near_expiry_units: integer }
    side_effects: ["position transitions per state_machines.InventoryPosition", "lot buckets: in_store_qty -> removed_qty"]
  - method: POST
    path: /cold-chain/capacity-projects
    description: "Propose a manufacturing-capacity expansion project."
    roles: [ProductionPlanner]
    code: 201
    input: [name, capacity_delta_units]
    output: CapacityProject
    side_effects: ["records created_by_user_id from X-User-ID"]
  - method: POST
    path: /cold-chain/capacity-projects/{id}/approve
    description: "Approve a PROPOSED project; pins sequence_no. Approver must differ from creator (segregation of duties)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CapacityProject
    side_effects: ["sequence_no := max(existing sequence_no) + 1", "increments CapacityProject.version by 1"]
  - method: POST
    path: /cold-chain/capacity-projects/{id}/commission
    description: "Commission an APPROVED project; only the lowest-sequence APPROVED project may commission (strict approval order)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CapacityProject
    side_effects: ["updates calculations.expansion_capacity_ledger commissioned_capacity", "increments CapacityProject.version by 1"]
  - method: POST
    path: /cold-chain/stores/{id}/trial-campaigns
    description: "Launch a consumer trial campaign (ACTIVE immediately). Requires the store to have at least one ACTIVE placement. Closed-interval windows at the same store must not overlap and must keep TRIAL_MIN_GAP_DAYS = 14 days clear between one campaign's end_date and the next start_date (gap boundary inclusive: start exactly 14 days after a prior end_date is allowed)."
    roles: [PlacementManager]
    code: 201
    input: [name, start_date, end_date]
    output: TrialCampaign
    side_effects: []
  - method: GET
    path: /cold-chain/stores/{id}/trial-campaigns
    description: "List trial campaigns for a store (lazy COMPLETED materialization applies on read), ordered by start_date ASC."
    roles: [PlatformAdmin, PlacementManager, StoreOperator, ServiceDispatcher, FieldTechnician, LogisticsCoordinator, ProductionPlanner]
    code: 200
    input: ['limit?', 'offset?']
    output: TrialCampaign[]
    side_effects: ["lazy COMPLETED transition when now > end_date + 1 day"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/blank, or role not a declared role."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, undeclared field, missing required field, or scalar range violation (quantity <= 0, temp_c outside -40..60, end_date < start_date, recorded_at in the future, produced_at in the future, enum outside declared set)."
  - id: ERR_CLOCK_REGRESSION
    http: 400
    condition: "POST /_clock/set_current_utc with to_iso8601 <= current logical time."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not in the endpoint's roles list."
  - id: ERR_STORE_OWNERSHIP_MISMATCH
    http: 403
    condition: "StoreOperator X-User-ID does not equal the store scope of the action (reading chiller's placement store; sweep path store)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Capacity-project approver X-User-ID equals created_by_user_id."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Any path id or body foreign key does not resolve to an existing row."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine precondition failure without a more specific code (e.g. sign a non-PROPOSED agreement, dispatch a non-OPEN ticket, resolve a terminal ticket, decommission a non-IN_STOCK chiller, release a non-QUARANTINE lot, deliver a non-IN_TRANSIT shipment, approve/commission from wrong project state, readings for an IN_STOCK or DECOMMISSIONED chiller)."
  - id: ERR_AGREEMENT_NOT_SIGNED
    http: 409
    condition: "POST /placements with an agreement whose status is not SIGNED."
  - id: ERR_CHILLER_NOT_IN_STOCK
    http: 409
    condition: "POST /placements with a chiller whose status is not IN_STOCK."
  - id: ERR_PLACEMENT_NOT_ACTIVE
    http: 409
    condition: "evaluate-performance / retire / shipment-create / trial-create requires a placement with status ACTIVE (for shipments/trials: at least one ACTIVE placement at the store)."
  - id: ERR_PLACEMENT_NOT_OPERATIONAL
    http: 409
    condition: "POST /shipments to a store whose ACTIVE placement has operational_status == SUSPENDED."
  - id: ERR_DUPLICATE_ACTIVE_PLACEMENT
    http: 409
    condition: "POST /placements for a store that already has a placement with status ACTIVE."
  - id: ERR_LOT_NOT_RELEASED
    http: 409
    condition: "POST /shipments with a lot in QUARANTINE or REJECTED."
  - id: ERR_DELIVERY_ROUTE_INACTIVE
    http: 409
    condition: "POST /shipments to a store whose placement has standing_deliveries_per_week == 0."
  - id: ERR_UNDERPERFORMANCE_STREAK_INSUFFICIENT
    http: 409
    condition: "retire REMOVE with removal_reason UNDERPERFORMANCE_REMOVAL while performance_status != UNDERPERFORMING or underperforming_streak < 2."
  - id: ERR_EXPANSION_SEQUENCE_VIOLATION
    http: 409
    condition: "commission while another APPROVED project holds a strictly smaller sequence_no."
  - id: ERR_SERIAL_NOT_UNIQUE
    http: 409
    condition: "chiller batch serial_prefix would mint a serial_no that already exists in the fleet."
  - id: ERR_SERVICE_WINDOW_OVERLAP
    http: 409
    condition: "dispatch window [window_start, window_end) overlaps another DISPATCHED ticket's window on the same chiller (half-open: touching endpoints are not overlap)."
  - id: ERR_TRIAL_WINDOW_OVERLAP
    http: 409
    condition: "trial campaign closed-interval window intersects another campaign's window at the same store (shared start/end date counts as overlap)."
  - id: ERR_TRIAL_GAP_VIOLATION
    http: 422
    condition: "trial campaign starts fewer than 14 days after another campaign's end_date at the same store, or ends fewer than 14 days before another campaign's start_date (gap boundary: exactly 14 days is allowed)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agreement_version does not match the agreement's current version (OCC on revise and on placement install)."
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "Shipment create or deliver references a lot whose status has materialized EXPIRED (business_safety)."
  - id: ERR_TRANSIT_WINDOW_EXCEEDED
    http: 422
    condition: "deliver attempted with logical now > departed_at + 48h; shipment persisted SPOILED."
  - id: ERR_EVALUATION_STALE
    http: 422
    condition: "install/relocate when the store's latest SiteEvaluation was created more than 90 days before logical now."
  - id: ERR_STORE_FOOTPRINT_INSUFFICIENT
    http: 422
    condition: "chiller.footprint_sqft exceeds the (target) agreement's allocated_sqft."
  - id: ERR_SHIPMENT_QUANTITY_EXCEEDS
    http: 422
    condition: "quantity_units > lot.unshipped_qty or > placement.safety_stock_units."
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "chiller batch quantity exceeds current manufacturing headroom (total_capacity_units - registered_units); whole batch rejected atomically."
  - id: ERR_SHIPMENT_RECONCILE_MISMATCH
    http: 422
    condition: "accepted_units + rejected_units != quantity_units at deliver."
  - id: ERR_AGREEMENT_STORE_MISMATCH
    http: 422
    condition: "placement.store_id != agreement.store_id, or relocate target agreement does not belong to target store."
  - id: ERR_RETIRE_TARGET_INVALID
    http: 422
    condition: "retire RELOCATE with target_store_id equal to current store, or missing target fields; also retire REMOVE with missing removal_reason."
  - id: ERR_CAPEX_BUDGET_EXCEEDED
    http: 422
    condition: "installed_quote_cents > agreement.max_capex_cents at install/relocate."
  - id: ERR_PAYBACK_INELIGIBLE
    http: 422
    condition: "install/relocate when the (target) store's latest SiteEvaluation verdict is INELIGIBLE."
  - id: ERR_WINDOW_INVALID
    http: 400
    condition: "dispatch with window_end <= window_start."

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Program operator: stores, fleet decommission, capacity approval/commission, logical clock, telemetry override."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/stores", "POST /cold-chain/chillers/{id}/decommission", "POST /cold-chain/capacity-projects/{id}/approve", "POST /cold-chain/capacity-projects/{id}/commission", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /cold-chain/chillers/{id}/temperature-readings", "all GET endpoints"]
  - name: PlacementManager
    description: "Field-placement analyst: site evaluations, agreements, placements, evaluations, retire/relocate, trial campaigns."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/stores/{id}/site-evaluations", "POST /cold-chain/stores/{id}/placement-agreements", "POST /cold-chain/placement-agreements/{id}/revise", "POST /cold-chain/placement-agreements/{id}/sign", "POST /cold-chain/placement-agreements/{id}/terminate", "POST /cold-chain/placements", "POST /cold-chain/placements/{id}/evaluate-performance", "POST /cold-chain/placements/{id}/retire", "POST /cold-chain/stores/{id}/trial-campaigns"]
    shared_operations: ["POST /cold-chain/stores/{id}/inventory/date-check-sweep", "all GET endpoints"]
  - name: StoreOperator
    description: "Store-side operator; X-User-ID equals the Store.id they operate."
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations: ["POST /cold-chain/chillers/{id}/temperature-readings (own store's chillers)", "POST /cold-chain/stores/{id}/inventory/date-check-sweep (own store)", "POST /cold-chain/service-tickets", "all GET endpoints"]
  - name: ServiceDispatcher
    description: "Service-network dispatcher: opens and schedules repair work."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/service-tickets/{id}/dispatch"]
    shared_operations: ["POST /cold-chain/service-tickets", "all GET endpoints"]
  - name: FieldTechnician
    description: "Repair technician: resolves tickets (performs the repair)."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/service-tickets/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: LogisticsCoordinator
    description: "Cold-chain logistics: shipment dispatch and dock reconciliation."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/shipments", "POST /cold-chain/shipments/{id}/deliver"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionPlanner
    description: "Plant planner: chiller registration, lot creation/release, capacity project proposals (may not approve own proposals)."
    identity: opaque
    exclusive_operations: ["POST /cold-chain/chillers", "POST /cold-chain/product-lots", "POST /cold-chain/product-lots/{id}/release", "POST /cold-chain/capacity-projects"]
    shared_operations: ["all GET endpoints"]
