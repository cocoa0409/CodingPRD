  # ===========================================================================
  - section: rbac
    instances:
      - name: intake_write_endpoints_admit_only_their_owning_role
        claim_type: role_exclusive_operation
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.Seller.exclusive_operations
          - roles.TitleOfficer.exclusive_operations
          - roles.Trustee.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The four intake writers are mutually exclusive: only PlatformAdmin may onboard a seller, only Seller may create a listing or file disclosures, only TitleOfficer may record clearance and only Trustee may open or confirm a statutory sale — every cross-role attempt is ERR_FORBIDDEN_ROLE (403) and leaves no row behind."
        test_recipe:
          setup:
            - "One seller with one DISCLOSURE_READY listing and one PENDING trustee sale in CA-ALAMEDA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Role Intake Bank", seller_type: "BANK", contact_email: "r@roleintake.example", settlement_account_ref: "ACH-ROLE" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id, seller_type: $.data.seller_type }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Roleintake Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "TENANT", title_condition: "JUNIOR_LIENS" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_status: $.data.listing_status }
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "JUNIOR_LIENS", title_report_reference: "TR-ROLE-1" }
              as: TitleOfficer
              captures: { title_axis: $.data.title_clearance_status }
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { org_name: "Ops Cannot Onboard", seller_type: "BANK", contact_email: "x@roleintake.example", settlement_account_ref: "ACH-XXXX" }
              as: AuctionOps
              captures: { err_seller: $.data.error_id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "9 Roleintake Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: PlatformAdmin
              captures: { err_listing: $.data.error_id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: AuctionOps
              captures: { err_disclosure: $.data.error_id }
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "DEFECTIVE", verified_title_condition: "CLOUDED", title_report_reference: "TR-ROLE-BAD" }
              as: Trustee
              captures: { err_title: $.data.error_id }
            - call: "POST /trustee-sales/${sale_id}/confirm"
              payload: {}
              as: TitleOfficer
              captures: { err_confirm: $.data.error_id }
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-16T18:00:00Z" }
              as: Anonymous
              captures: { err_sale: $.data.error_id }
          assert:
            - "${seller_type} == BANK, ${listing_status} == DISCLOSURE_READY and ${title_axis} == CLEARED (each owning role's own call succeeded)"
            - "All six triggers: HTTP 403 with ${err_seller} == ${err_listing} == ${err_disclosure} == ${err_title} == ${err_confirm} == ${err_sale} == ERR_FORBIDDEN_ROLE"
            - "GET /asset-listings?seller_id=${seller_id} returns total_count == 1 (the PlatformAdmin attempt created nothing)"
            - "AssetListing.${listing_id}.occupancy_status == TENANT and title_clearance_status == CLEARED (the refused calls overwrote nothing)"
            - "GET /asset-listings/${listing_id}/trustee-sales returns total_count == 1 and TrusteeSale.${sale_id}.status == PENDING"

      - name: auction_and_compliance_writes_are_closed_to_the_other_operator_roles
        claim_type: role_exclusive_operation
        grounds:
