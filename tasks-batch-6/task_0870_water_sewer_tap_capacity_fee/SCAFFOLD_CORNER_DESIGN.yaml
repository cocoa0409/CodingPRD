scaffold_corner_design:
  # ------------------------------------------------------------------
  # Entities
  # ------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_application_minimal_returns_201
        claim_type: Creation
        grounds: [entities.ConnectionApplication, endpoints]
        distinguishing_aspect: "POST /connection-applications with the required fields returns 201, status DRAFT, applicant_user_id set from X-User-ID, and system id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-1", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { a1: "$.data.id" }
          assert:
            - "response status == 201"
            - "ConnectionApplication.${a1}.status == DRAFT"
            - "ConnectionApplication.${a1}.applicant_user_id == appl-1"
            - "ConnectionApplication.${a1}.version == 1"

      - name: create_application_missing_service_type_rejected
        claim_type: Required Fields
        grounds: [entities.ConnectionApplication.fields.service_type, "validations[priority=21]"]
        distinguishing_aspect: "POST /connection-applications without service_type returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-1", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: get_application_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /connection-applications/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /connection-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: application_defaults_applied
        claim_type: Defaults
        grounds: [entities.ConnectionApplication.fields.requires_pavement_cut, entities.ConnectionApplication.fields.assessment_basis, entities.ConnectionApplication.fields.prior_credit_eru]
        distinguishing_aspect: "Omitting requires_pavement_cut/assessment_basis/prior_credit_eru applies defaults false/NEW/0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-2", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { a2: "$.data.id" }
          assert:
            - "ConnectionApplication.${a2}.requires_pavement_cut == false"
            - "ConnectionApplication.${a2}.assessment_basis == NEW"
            - "ConnectionApplication.${a2}.prior_credit_eru == 0"

      - name: invalid_enum_service_type_rejected
        claim_type: Type Constraints
        grounds: [entities.ConnectionApplication.fields.service_type, "validations[priority=21]"]
        distinguishing_aspect: "POST /connection-applications with service_type=GAS (not in enum) returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-3", service_type: "GAS", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

  # ------------------------------------------------------------------
  # State Machines
  # ------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ConnectionApplication.UNDER_REVIEW_to_APPROVED, "validations[priority=6]"]
        distinguishing_aspect: "POST /connection-applications/{id}/approve on a DRAFT application returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT application exists."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-D1", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { ad: "$.data.id" }
          trigger:
            - call: "POST /connection-applications/${ad}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: withdraw_from_denied_terminal_invalid
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ConnectionApplication.UNDER_REVIEW_to_DENIED, "validations[priority=6]"]
        distinguishing_aspect: "A DENIED application is terminal; POST /withdraw returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An application driven to DENIED."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-DN", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { adn: "$.data.id" }
            - call: "POST /connection-applications/${adn}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${adn}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /connection-applications/${adn}/deny"
              payload: { reason: "out of area" }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${adn}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: meterset_complete_install_from_pending_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.MeterSet.SCHEDULED_to_SET, "validations[priority=6]"]
        distinguishing_aspect: "complete-install on a PENDING (never scheduled) meter-set returns 409 ERR_INVALID_STATE (state precedes the tap-inspection business check)."
        test_recipe:
          setup: ["A PENDING meter-set exists."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-MS", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { ams: "$.data.id" }
            - call: "POST /meter-crews"
              payload: { name: "Crew MS" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { crew_ms: "$.data.id" }
            - call: "POST /meter-sets"
              payload: { application_id: "${ams}", crew_id: "${crew_ms}", appointment_start: "2026-06-03T09:00:00Z", appointment_end: "2026-06-03T10:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-ms"
              captures: { ms: "$.data.id" }
          trigger:
            - call: "POST /meter-sets/${ms}/complete-install"
              payload: {}
              as: FieldInspector
              as_user_id: "insp-ms"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: backflow_install_certify_flow
        claim_type: Valid Transition
        grounds: [state_machines.BackflowAssembly.REQUIRED_to_INSTALLED, state_machines.BackflowAssembly.INSTALLED_to_CERTIFIED, state_machines.Inspection.IN_PROGRESS_to_PASSED]
        distinguishing_aspect: "A COMMERCIAL approval creates BackflowAssembly REQUIRED; install then a passing BACKFLOW inspection cascades it REQUIRED->INSTALLED->CERTIFIED."
        test_recipe:
          setup: ["A COMMERCIAL application approved (backflow_required true, assembly REQUIRED)."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-BF", service_type: "WATER", meter_size: "ONE", use_type: "COMMERCIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { abf: "$.data.id" }
            - call: "POST /connection-applications/${abf}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${abf}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${abf}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /connection-applications/${abf}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
            - call: "GET /backflow-assemblies?application_id=${abf}"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
              captures: { bf: "$.data[0].id" }
            - call: "POST /backflow-assemblies/${bf}/install"
              payload: { serial_number: "BF-123" }
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /inspectors"
              payload: { name: "Insp BF" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_bf: "$.data.id" }
            - call: "POST /inspections"
              payload: { application_id: "${abf}", inspector_id: "${insp_bf}", inspection_type: "BACKFLOW", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_bf}"
              captures: { bf_insp: "$.data.id" }
            - call: "POST /inspections/${bf_insp}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_bf}"
            - call: "POST /inspections/${bf_insp}/start"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_bf}"
          trigger:
            - call: "POST /inspections/${bf_insp}/pass"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_bf}"
          assert:
            - "BackflowAssembly.${bf}.status == CERTIFIED"

  # ------------------------------------------------------------------
  # Calculations
  # ------------------------------------------------------------------
  - section: calculations
    instances:
      - name: tap_fee_with_pavement_cut_surcharge
        claim_type: Constants Applied
        grounds: [calculations.tap_installation_fee, entities.FeeSchedule.fields.pavement_cut_surcharge_cents]
        distinguishing_aspect: "meter_size ONE (tap 250000) with requires_pavement_cut true adds the 80000 surcharge -> tap_fee_cents 330000."
        test_recipe:
          setup: ["MeterSizeSchedule ONE + FeeSchedule; app WATER/ONE/RESIDENTIAL with requires_pavement_cut true, approved."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-PV", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL", requires_pavement_cut: true }
              as: Applicant
              as_user_id: "appl-1"
              captures: { apv: "$.data.id" }
            - call: "POST /connection-applications/${apv}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${apv}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${apv}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${apv}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { tap_pv: "$.data.tap_fee_cents" }
          assert:
            - "ConnectionApplication.${apv}.tap_fee_cents == 330000"

      - name: capacity_fee_water_only_service_branch
        claim_type: Input Set Filtering
        grounds: [calculations.capacity_fee, entities.ConnectionApplication.fields.service_type]
        distinguishing_aspect: "service_type WATER (FIVE_EIGHTH, eru 1.0, RESIDENTIAL) charges only the water component: 400000*1.0*1.0 = 400000; total_fees_due 566500 (admin 16500, no discount)."
        test_recipe:
          setup: ["MeterSizeSchedule FIVE_EIGHTH (eru 1.0, tap 150000) + FeeSchedule; WATER/FIVE_EIGHTH/RESIDENTIAL app approved."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "FIVE_EIGHTH", eru_factor: 1.0, tap_install_fee_cents: 150000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-W", service_type: "WATER", meter_size: "FIVE_EIGHTH", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { aw: "$.data.id" }
            - call: "POST /connection-applications/${aw}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${aw}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${aw}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${aw}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { cap_w: "$.data.capacity_fee_cents", total_w: "$.data.total_fees_due_cents" }
          assert:
            - "ConnectionApplication.${aw}.capacity_fee_cents == 400000"
            - "ConnectionApplication.${aw}.total_fees_due_cents == 566500"

      - name: redevelopment_credit_zero_floor
        claim_type: Correct Result
        grounds: [calculations.capacity_fee, entities.ConnectionApplication.fields.prior_credit_eru]
        distinguishing_aspect: "REDEVELOPMENT with prior_credit_eru (1.0) >= base_eru (FIVE_EIGHTH=1.0) floors net_eru at 0 -> capacity_fee_cents 0 (never negative)."
        test_recipe:
          setup: ["MeterSizeSchedule FIVE_EIGHTH + FeeSchedule; WATER/FIVE_EIGHTH/RESIDENTIAL REDEVELOPMENT prior_credit_eru 1.0 approved."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "FIVE_EIGHTH", eru_factor: 1.0, tap_install_fee_cents: 150000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-RD", service_type: "WATER", meter_size: "FIVE_EIGHTH", use_type: "RESIDENTIAL", assessment_basis: "REDEVELOPMENT", prior_credit_eru: 1.0 }
              as: Applicant
              as_user_id: "appl-1"
              captures: { ard: "$.data.id" }
            - call: "POST /connection-applications/${ard}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${ard}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${ard}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${ard}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { cap_rd: "$.data.capacity_fee_cents" }
          assert:
            - "ConnectionApplication.${ard}.capacity_fee_cents == 0"

      - name: capacity_fee_new_vs_redevelopment_covered
        claim_type: Variant Divergence
        grounds: [calculations.capacity_fee]
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_fee_new_vs_redevelopment
          rationale: "NEW-vs-REDEVELOPMENT divergence is the named §1.8 dual-variant instance."

  # ------------------------------------------------------------------
  # Validations
  # ------------------------------------------------------------------
  - section: validations
    instances:
      - name: submit_unknown_meter_size_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=5]", "errors[ERR_METER_SIZE_UNKNOWN]"]
        distinguishing_aspect: "Submitting an application whose meter_size has no MeterSizeSchedule row returns 422 ERR_METER_SIZE_UNKNOWN."
        test_recipe:
          setup: ["No schedule row for meter_size TWO; a DRAFT app requesting TWO."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-U", service_type: "WATER", meter_size: "TWO", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { au: "$.data.id" }
          trigger:
            - call: "POST /connection-applications/${au}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_METER_SIZE_UNKNOWN"

      - name: approve_without_determination_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=8]", "errors[ERR_DETERMINATION_MISSING]"]
        distinguishing_aspect: "Approve with no AvailabilityDetermination returns 422 ERR_DETERMINATION_MISSING (priority 8 precedes the service-availability check)."
        test_recipe:
          setup: ["App under review, no determination recorded."]
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-ND", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { and2: "$.data.id" }
            - call: "POST /connection-applications/${and2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${and2}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${and2}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_DETERMINATION_MISSING"

      - name: execute_before_escrow_funded_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=16]", state_machines.DeveloperAgreement.PENDING_ESCROW_to_EXECUTED]
        distinguishing_aspect: "execute with escrow_held_cents (0) < required_escrow_cents returns 422 ERR_ESCROW_INSUFFICIENT."
        test_recipe:
          setup: ["Agreement offered (required 4,000,000) but no deposit."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-EX", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { aex: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${aex}", developer_user_id: "dev-1", length_ft: 400, estimated_cost_cents: 4000000, total_assessable_front_ft: 400, total_assessable_area_sqft: 80000, reimbursement_cap_cents: 5000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { pex: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${pex}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { gex: "$.data.id" }
            - call: "POST /developer-agreements/${gex}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /developer-agreements/${gex}/execute"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_ESCROW_INSUFFICIENT"

      - name: latecomer_against_unaccepted_project_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=19]", "errors[ERR_PROJECT_NOT_ACCEPTED]"]
        distinguishing_aspect: "Assessing a latecomer against a PROPOSED (not ACCEPTED) project returns 422 ERR_PROJECT_NOT_ACCEPTED."
        test_recipe:
          setup: ["A PROPOSED project and a benefiting application."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-PA", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
