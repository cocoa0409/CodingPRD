# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Domain: academic-program-review-discontinuation   api_prefix: /provost
#
# Breadth probe over §1.1-§1.7. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; nothing else is invented. Corners that a
# §1.8 instance already asserts appear as `excluded_because:` stubs naming that
# instance. Every one of the 65 error ids in §1.6 is triggered by at least one
# instance here or by a named §1.8 instance.
#
# Fixture A (used wherever a NONVIABLE band is needed) = three snapshots on one
# UNDERGRADUATE program: (t1 hc30 / ch300 / cost 12000000 / comp 4 / dem 42),
# (t2 hc24 / ch240 / cost 11000000 / comp 3 / dem 40), (t3 hc20 / ch200 /
# cost 11000000 / comp 2 / dem 42) -> rolling cph 45946, latest cph 55000,
# composite 29.06, band NONVIABLE, severance cap 5100000.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: program_create_returns_full_envelope_with_initial_derived_fields
        claim_type: creation
        grounds:
          - endpoints["POST /provost/academic-programs"]
          - entities.AcademicProgram
          - response_envelope.success
        distinguishing_aspect: |
          A create with every required field returns 201 and the whole entity,
          including the derived fields that have no inputs yet: composite_score
          is null and viability_band is INSUFFICIENT_DATA (not 0.00 and not
          NONVIABLE), and every fte aggregate starts at 0.00 rather than null.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 3 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          assert:
            - "the response status is 201 and response_type == object, with meta.api_request_id and meta.api_request_timestamp present"
            - "data.code == HIST-BA, name == History BA, degree_level == UNDERGRADUATE, department_code == HIST, host_capacity_per_day == 3"
            - "data.id is a bare UUID with no type prefix, and data.version == 1"
            - "data.lifecycle_state == ACTIVE and data.catalog_status == LISTED and data.catalog_status_pre_decision == null"
            - "data.snapshot_count == 0, cost_per_credit_hour_rolling_cents == null, cost_per_credit_hour_latest_cents == null"
            - "data.composite_score == null and data.viability_band == INSUFFICIENT_DATA"
            - "data.faculty_fte_baseline == 0.00, active_fte_total == 0.00, reassigned_fte_total == 0.00, separated_fte_total == 0.00, assigned_pool_fte == 0.00, retained_teach_out_fte == 0.00, reducible_fte == 0.00, deferred_fte == 0.00, staffing_liability_cents == 0"
            - "data.discontinuation_override == false and data.consolidated_into_program_id == null"

      - name: program_get_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints["GET /provost/academic-programs/{id}"]
        distinguishing_aspect: |
          A read-only GET returns exactly what the create stored and does NOT
          bump version or updated_at — a re-read is not a mutation.
        test_recipe:
          setup:
            - "One program HIST-BA created at 2026-08-01T00:00:00Z with host_capacity_per_day 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 3 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Provost
          assert:
            - "the response status is 200 and response_type == object"
            - "data.id == ${prog_id}, code == HIST-BA, degree_level == UNDERGRADUATE, host_capacity_per_day == 3"
            - "data.version == 1 — the GET did not mutate the row"
            - "data.created_at == 2026-08-01T00:00:00.000Z and data.updated_at == data.created_at"

      - name: program_list_applies_filter_then_pagination_window
        claim_type: listing
        grounds:
          - endpoints["GET /provost/academic-programs"]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          total_count reports the size of the FILTERED set (2 HIST programs),
          not the size of the table (3 rows), and has_more is computed against
          that filtered count with limit 1.
        test_recipe:
          setup:
            - "Three programs: HIST-BA and HIST-MA in department HIST, PHIL-BA in department PHIL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-MA", name: "History MA", degree_level: "GRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /provost/academic-programs"
              payload: { department_code: "HIST", limit: 1, offset: 0 }
              as: ReviewCoordinator
              captures: { first_id: "$.data[0].id" }
            - call: "GET /provost/academic-programs"
              payload: { department_code: "HIST", limit: 1, offset: 1 }
              as: ReviewCoordinator
          assert:
            - "the first trigger returns 200 with response_type == array, exactly 1 row, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "the second trigger returns 1 row with total_count == 2 and has_more == false"
            - "the two pages together return ${p1_id} and ${p2_id}; PHIL-BA (${p3_id}) appears on neither page"
            - "GET /provost/academic-programs with no filter and no pagination input returns total_count == 3 with limit == 10 and offset == 0 applied as defaults"

      - name: program_get_unknown_uuid_returns_program_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: |
          A well-formed but unknown UUID is a 404 with the entity-specific
          error id, not a 400 and not a generic ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty database — no programs exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "GET /provost/academic-programs/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: Provost
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 404 with response_type == error and data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: program_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=9]
          - errors[ERR_VALIDATION]
          - endpoints["POST /provost/academic-programs"]
        distinguishing_aspect: |
          Each of code, name, degree_level and department_code is required (no
          default declared in §1.1), so omitting any one of them is a 422
          ERR_VALIDATION and nothing is persisted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "each of the three trigger calls returns 422 with data.error_id == ERR_VALIDATION"
            - "GET /provost/academic-programs afterwards returns total_count == 0 — no partial row was written"

      - name: program_and_reviewer_defaults_applied_when_field_omitted
        claim_type: defaults
        grounds:
          - entities.AcademicProgram.fields.host_capacity_per_day
          - entities.ExternalReviewer.fields.travel_buffer_hours
          - entities.ExternalReviewer.fields.conflict_program_codes
        distinguishing_aspect: |
          The two declared input defaults are non-zero and non-empty
          (host_capacity_per_day 2, travel_buffer_hours 48), so an
          implementation that falls back to 0 or null is detectable. The array
          default is the empty list, not null.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
          assert:
            - "the program is created with host_capacity_per_day == 2"
            - "the reviewer is created with travel_buffer_hours == 48 and conflict_program_codes == [] (an empty array, not null)"
            - "ExternalReviewer.${rev_id}.visit_count == 0"

      - name: program_create_mints_system_fields_server_side
        claim_type: system_fields
        grounds:
          - entities.AcademicProgram.fields.lifecycle_state
          - entities.AcademicProgram.fields.catalog_status
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server, and
          the two state axes start at their declared initial values regardless
          of what the caller wants — the create endpoint's input list in §1.5
          contains no state field at all, so ACTIVE / LISTED are the only
          possible starting values.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          assert:
            - "data.id is a server-minted bare UUID (36 characters, no type prefix such as prog_)"
            - "data.created_at == 2026-08-01T00:00:00.000Z with exactly three fractional digits, and data.updated_at == data.created_at"
            - "data.version == 1"
            - "data.lifecycle_state == ACTIVE and data.catalog_status == LISTED — the §1.2 initial states"
            - "§1.5 declares no input field on POST /provost/academic-programs by which lifecycle_state, catalog_status, id or version could be supplied"

      - name: metric_snapshot_is_immutable_and_append_only
        claim_type: immutability
        grounds:
          - entities.ViabilityMetricSnapshot
          - endpoints["GET /provost/academic-programs/{id}/metric-snapshots"]
        distinguishing_aspect: |
          ViabilityMetricSnapshot declares common_fields false, so it carries id
          and created_at but no version and no updated_at, and §1.5 offers no
          PATCH or DELETE for it. Correcting history is only possible by
          appending a later term_index, which is what makes the rolling window
          in §1.3 well defined.
        test_recipe:
          setup:
            - "Program HIST-BA with the Fixture A snapshot for term 1 only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { snap_id: $.data.id }
          trigger:
            - call: "GET /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { limit: 10, offset: 0 }
              as: ReviewCoordinator
              captures: { row_id: "$.data[0].id" }
          assert:
            - "the trigger returns 200 with exactly 1 row and total_count == 1"
            - "the row carries id and created_at but no version and no updated_at field"
            - "the row's id == ${snap_id}"
            - "§1.5 declares no PATCH and no DELETE on any /metric-snapshots path — the only write is the POST append"
            - "AcademicProgram.${prog_id}.snapshot_count == 1"

      - name: snapshot_per_term_cost_is_computed_and_never_feeds_program_rollup
        claim_type: computed_fields
        grounds:
          - entities.ViabilityMetricSnapshot.fields.cost_per_credit_hour_cents
          - calculations.program_cost_per_credit_hour
        distinguishing_aspect: |
          Each snapshot carries its own per-term diagnostic quotient, computed
          with the same round_half_up rule (40000, 45833, 55000). Those three
          per-term values must NOT be averaged into the program rollup: their
          mean 46944 differs from the mandated sum-then-divide value 45946.
        test_recipe:
          setup:
            - "Program HIST-BA carrying all three Fixture A snapshots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { snap3_id: $.data.id }
          assert:
            - "the trigger returns 201 with data.cost_per_credit_hour_cents == 55000 (11000000 / 200)"
            - "the term-1 row has cost_per_credit_hour_cents == 40000 and the term-2 row has 45833 (11000000 / 240 = 45833.33 rounded half up)"
            - "AcademicProgram.${prog_id}.cost_per_credit_hour_rolling_cents == 45946 — NOT 46944, the mean of the three per-term diagnostics"
            - "AcademicProgram.${prog_id}.cost_per_credit_hour_latest_cents == 55000 and snapshot_count == 3"

      - name: enum_and_range_constraints_rejected_across_entities
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - entities.AcademicProgram.fields.degree_level
          - entities.ViabilityMetricSnapshot.fields.market_demand_index
          - entities.FacultyAppointment.fields.fte
          - entities.ReviewerVisit.fields.window_end_at
        distinguishing_aspect: |
          Every declared constraint class is probed in one place: an unknown
          enum member, a bounded integer one past its ceiling, a decimal outside
          (0, 1], and an ordering constraint between two datetime inputs. All
          four are the same 422 ERR_VALIDATION, not four different ids.
        test_recipe:
          setup:
            - "Program HIST-BA exists, with an accepted self-study on its cycle and one external reviewer, so the reviewer-visit call reaches the field validation at priority 9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "MASTERS", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { err_enum: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 101 }
              as: ReviewCoordinator
              captures: { err_range: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 1.50, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { err_fte: $.data.error_id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-22T17:00:00Z", window_end_at: "2026-08-20T09:00:00Z" }
              as: ReviewCoordinator
              captures: { err_order: $.data.error_id }
          assert:
            - "all four trigger calls return 422 with data.error_id == ERR_VALIDATION"
            - "no PHIL-BA program, no snapshot, no appointment and no visit was created — GET /provost/academic-programs returns total_count == 1 and AcademicProgram.${prog_id}.snapshot_count == 0"
            - "ReviewCycle.${cycle_id}.state is still SELF_STUDY_ACCEPTED — the rejected visit did not cascade"

      - name: child_creation_under_unknown_parent_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_REVIEWER_NOT_FOUND]
        distinguishing_aspect: |
          Path parents (priority 7) and body foreign keys (priority 8) are both
          existence-checked, and each reports the id of the MISSING entity:
          a bad path program id gives ERR_PROGRAM_NOT_FOUND, a bad body
          reviewer_id on a valid cycle gives ERR_REVIEWER_NOT_FOUND.
        test_recipe:
          setup:
            - "One program HIST-BA with a cycle whose self-study is ACCEPTED, so the reviewer-visit path is otherwise open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/11111111-2222-4333-8444-555555555555/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { err_prog: $.data.error_id }
            - call: "POST /provost/review-cycles/11111111-2222-4333-8444-555555555555/self-studies"
              payload: { narrative: "Orphan self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { err_cycle: $.data.error_id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "11111111-2222-4333-8444-555555555555", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { err_rev: $.data.error_id }
          assert:
            - "the first trigger returns 404 with data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "the second trigger returns 404 with data.error_id == ERR_CYCLE_NOT_FOUND"
            - "the third trigger returns 404 with data.error_id == ERR_REVIEWER_NOT_FOUND — the cycle in the body is valid, the reviewer is not"
            - "ReviewCycle.${cycle_id}.state is still SELF_STUDY_ACCEPTED and GET /provost/reviewer-visits returns total_count == 0"

      - name: reviewer_visit_associates_cycle_and_reviewer_across_the_hierarchy
        claim_type: cross_cutting_associations
        grounds:
          - entities.ReviewerVisit.fields.cycle_id
          - entities.ReviewerVisit.fields.reviewer_id
          - endpoints["GET /provost/reviewer-visits"]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The hybrid topology's one cross-cutting edge: ReviewerVisit hangs off
          ReviewCycle in the program hierarchy while also pointing at the flat
          ExternalReviewer registry. Both directions must be queryable from the
          same filtered list endpoint, and the reviewer-side derived counter
          must move when a visit is booked under a completely different program.
        test_recipe:
          setup:
            - "Two programs HIST-BA and PHIL-BA, each with an ACCEPTED self-study on its own cycle."
            - "One external reviewer with travel_buffer_hours 0 so windows in different weeks never conflict."
            - "One visit for that reviewer on the HIST-BA cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /provost/academic-programs/${p1_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /provost/review-cycles/${c1_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${p1_id}"
              captures: { ss1_id: $.data.id }
            - call: "POST /provost/self-studies/${ss1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${p1_id}"
            - call: "POST /provost/self-studies/${ss1_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /provost/academic-programs/${p2_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /provost/review-cycles/${c2_id}/self-studies"
              payload: { narrative: "Philosophy self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${p2_id}"
              captures: { ss2_id: $.data.id }
            - call: "POST /provost/self-studies/${ss2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${p2_id}"
            - call: "POST /provost/self-studies/${ss2_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HUM", travel_buffer_hours: 0 }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${c1_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${c2_id}", reviewer_id: "${rev_id}", window_start_at: "2026-09-10T09:00:00Z", window_end_at: "2026-09-11T17:00:00Z" }
              as: ReviewCoordinator
              captures: { v2_id: $.data.id }
          assert:
            - "the trigger returns 201 with data.cycle_id == ${c2_id} and data.reviewer_id == ${rev_id}"
            - "GET /provost/reviewer-visits with cycle_id ${c1_id} returns exactly 1 row (${v1_id}) — the hierarchy side of the association"
            - "GET /provost/reviewer-visits with reviewer_id ${rev_id} returns exactly 2 rows (${v1_id}, ${v2_id}) — the registry side"
            - "ExternalReviewer.${rev_id}.visit_count == 2, counting visits under two different programs"
            - "ReviewCycle.${c1_id}.state == VISIT_SCHEDULED and ReviewCycle.${c2_id}.state == VISIT_SCHEDULED"
            - "AcademicProgram.${p1_id}.lifecycle_state == UNDER_REVIEW and AcademicProgram.${p2_id}.lifecycle_state == UNDER_REVIEW"

  - section: state_machines
    instances:
      - name: review_cycle_and_self_study_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ReviewCycle.initial_state
          - state_machines.SelfStudy.initial_state
          - state_machines.AcademicProgram.ACTIVE_to_UNDER_REVIEW
        distinguishing_aspect: |
          Opening a cycle is the only client-driven way onto the program's
          lifecycle axis: the cycle itself starts at SELF_STUDY_OPEN with
          addendum_round 0, its self-study starts at DRAFT with revision_round
          0, and the same request moves the program ACTIVE -> UNDER_REVIEW while
          leaving the catalog axis at LISTED.
        test_recipe:
          setup:
            - "One program HIST-BA, no cycle yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1", "S2"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Draft narrative", section_codes: [] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
          assert:
            - "the cycle is created 201 with state == SELF_STUDY_OPEN, addendum_round == 0, response_concurrence == null, decided_at == null, compliance_posture == NOT_APPLICABLE, version == 1"
            - "AcademicProgram.${prog_id}.lifecycle_state == UNDER_REVIEW and catalog_status == LISTED — only the lifecycle axis moved"
            - "AcademicProgram.${prog_id}.version == 2 (the cascade bumped it once)"
            - "the self-study is created 201 with state == DRAFT, revision_round == 0, submitted_at == null, accepted_at == null"
            - "SelfStudy.${ss_id}.missing_section_codes == [S1, S2] — an empty section_codes list is legal at creation and the shortfall is reported immediately"

      - name: self_study_accept_cascades_cycle_to_self_study_accepted
        claim_type: side_effect_execution
        grounds:
          - state_machines.SelfStudy.SUBMITTED_to_ACCEPTED
          - state_machines.ReviewCycle.SELF_STUDY_OPEN_to_SELF_STUDY_ACCEPTED
        distinguishing_aspect: |
          ACCEPT stamps accepted_at on the self-study AND cascades the parent
          cycle. SUBMIT alone must not move the cycle — the two-step ladder is
          observable between the calls.
        test_recipe:
          setup:
            - "Program HIST-BA with a cycle requiring section S1 and a DRAFT self-study covering S1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
          trigger:
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
          assert:
            - "after SUBMIT: SelfStudy.${ss_id}.state == SUBMITTED, submitted_at == 2026-08-01T00:00:00.000Z, accepted_at == null"
            - "after SUBMIT: ReviewCycle.${cycle_id}.state is still SELF_STUDY_OPEN — SUBMIT does not cascade"
            - "after ACCEPT: SelfStudy.${ss_id}.state == ACCEPTED and accepted_at == 2026-08-01T00:00:00.000Z"
            - "after ACCEPT: ReviewCycle.${cycle_id}.state == SELF_STUDY_ACCEPTED"
            - "SelfStudy.${ss_id}.revision_round == 0 and missing_section_codes == []"

      - name: visit_complete_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=24]
          - errors[ERR_VISIT_WINDOW_NOT_ELAPSED]
          - state_machines.ReviewerVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The completion precondition is `clock >= window_end_at`, so one second
          before the end instant is refused and the end instant itself succeeds.
          The refusal must leave the visit SCHEDULED and the cycle in
          VISIT_SCHEDULED.
        test_recipe:
          setup:
            - "Program HIST-BA with an ACCEPTED self-study and one SCHEDULED visit whose window ends 2026-08-22T17:00:00Z."
            - "The clock is moved to 2026-08-22T16:59:59Z, one second before the window ends."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T16:59:59Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_VISIT_WINDOW_NOT_ELAPSED"
            - "after the refusal ReviewerVisit.${visit_id}.state == SCHEDULED, completed_at == null, and ReviewCycle.${cycle_id}.state == VISIT_SCHEDULED"
            - "the third trigger call, at exactly window_end_at, returns 200 with state == COMPLETED and completed_at == 2026-08-22T17:00:00.000Z"
            - "ReviewCycle.${cycle_id}.state == VISIT_COMPLETED after the successful completion"

      - name: visit_complete_twice_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=12]
          - errors[ERR_VISIT_NOT_SCHEDULED]
          - state_machines.ReviewerVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The completion action is not idempotent: replaying it from COMPLETED
          is a 409, and completed_at keeps its ORIGINAL stamp even though the
          logical clock has since advanced — a re-stamp would be silent
          corruption.
        test_recipe:
          setup:
            - "Program HIST-BA with an ACCEPTED self-study and a visit already COMPLETED at 2026-08-23T00:00:00Z."
            - "The clock is then advanced to 2026-08-24T00:00:00Z so a re-stamp would be visible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Alice Reyes", institution: "Northfield University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 409 with data.error_id == ERR_VISIT_NOT_SCHEDULED"
            - "ReviewerVisit.${visit_id}.state == COMPLETED and completed_at == 2026-08-23T00:00:00.000Z — not re-stamped to the current clock"
            - "ReviewCycle.${cycle_id}.state == VISIT_COMPLETED (unchanged by the replay)"
            - "ReviewerVisit.${visit_id}.report_count == 0"

      - name: decision_effectuate_from_proposed_rejected
        claim_type: invalid_transitions
        grounds:
