          - errors.ERR_DEPLOYMENT_MISSING
        distinguishing_aspect: |
          Entity pair Order -> StaffingDeployment: an order's
          ACCEPTED->IN_PRODUCTION transition is gated on a DIFFERENT entity —
          a StaffingDeployment for the order's line being PUBLISHED or LOCKED
          for the current business day. With only a DRAFT deployment the
          transition is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL, stock, window."
            - "A StaffingDeployment exists but is only DRAFT (never published)."
            - "One IN_STORE order in ACCEPTED."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
