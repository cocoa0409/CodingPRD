          assert:
            - "The first trigger returns HTTP 409 with error_id ERR_DEPLOYMENT_WINDOW_CONFLICT"
            - "The second trigger returns HTTP 201 and Deployment.${dep3_id}.window_start_at == 2026-08-10T04:30:00Z"
            - "Deployment.${dep3_id}.delivery_state == SCHEDULED"
            - "GET /deployments filtered by environment_id returns total_count == 2"
            - "Environment.${env_id}.active_deployment_count == 0"

      - name: stabilization_capacity_closed_interval_rejects_touching_endpoint
        grounds:
          - validations[priority=34]
          - errors[ERR_STABILIZATION_CAPACITY_EXCEEDED]
          - entities.ReleaseTrain.fields.max_concurrent_stabilizing
          - entities.Release.fields.stabilization_end_at
          - state_machines.Release.OPEN_to_CUT
        distinguishing_aspect: |
          A different entity and interval convention than the other instance in this rule: stabilization
          windows are CLOSED, so a release whose cut_at equals the incumbent's stabilization_end_at
          (2026-08-13T00:00:00Z) is rejected with ERR_STABILIZATION_CAPACITY_EXCEEDED at capacity 1,
          while a cut one second later is admitted.
        test_recipe:
          setup:
            - "Train core-train: code_freeze_lead_hours 48, stabilization_hours 72, max_concurrent_stabilizing 1."
            - "Release A 2026.08.1 cut_at 2026-08-10T00:00:00Z => stabilization interval [2026-08-10T00:00:00Z, 2026-08-13T00:00:00Z]."
            - "Release B 2026.08.2 cut_at 2026-08-13T00:00:00Z => interval starts exactly at A's end."
            - "Release C 2026.08.3 cut_at 2026-08-13T00:00:01Z => interval starts one second after A's end."
            - "Clock advanced to 2026-08-13T00:00:01Z, at or after every freeze_at, and Release A is already CUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_a: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.2", cut_at: "2026-08-13T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_b: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.3", cut_at: "2026-08-13T00:00:01Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_a}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { a_end: $.data.stabilization_end_at }
          trigger:
            - call: "POST /releases/${rel_b}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { capacity_error: $.data.error_id }
            - call: "POST /releases/${rel_c}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { c_phase: $.data.phase }
          assert:
            - "Release.${rel_a}.stabilization_end_at == 2026-08-13T00:00:00Z and Release.${rel_a}.phase == CUT"
            - "The first trigger returns HTTP 409 with error_id ERR_STABILIZATION_CAPACITY_EXCEEDED"
            - "Release.${rel_b}.phase == OPEN"
            - "The second trigger returns HTTP 200 and Release.${rel_c}.phase == CUT"
            - "Release.${rel_c}.stabilization_end_at == 2026-08-16T00:00:01Z"
            - "ReleaseTrain.${train_id}.open_release_count == 1"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rollout_step_abort_restores_flag_exposure_and_leaves_applied_count
        grounds:
          - state_machines.FlagRolloutStep.SOAKING_to_ABORTED
          - state_machines.Deployment.CANARY_SOAK_to_ABORTED
          - calculations.canary_health_verdict
          - calculations.rollout_step_ladder
          - entities.FlagRolloutStep.fields.previous_exposure_pct
          - entities.FeatureFlag.fields.current_exposure_pct
        distinguishing_aspect: |
          The exposure ledger is the compensated quantity: the abort restores
          FeatureFlag.current_exposure_pct to the SOAKING step's captured previous_exposure_pct 5 and
          leaves applied_step_count at 1, so the flag returns exactly to its pre-soak exposure while the
          already-APPLIED step1 keeps its effect.
        test_recipe:
          setup:
            - "Environment prod-us: window hours 2..6, cooldown_minutes 30."
            - "Release 2026.08.1 cut at clock 2026-08-08T00:00:00Z; CANARY deployment (abort_error_rate_pct 25.0, abort_latency_p95_ms 800, min_sample_count 5) window 2026-08-10T02:00Z..04:00Z started at 02:05Z."
            - "FeatureFlag search-rerank owned by u-eng-1 with no change links: step1 (target 5, soak 30) soaked from 02:05Z and was APPLIED at 02:35Z, so current_exposure_pct 5 and applied_step_count 1."
            - "step2 (target 15, soak 60, deployment_id = that CANARY deployment) started soaking at 02:35Z with previous_exposure_pct 5."
            - "One CANARY HealthSignal at 02:40Z: 10 requests, 4 errors, p95 300 ms. Clock at 02:45Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30, requires_compliance_evidence: false }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "CANARY", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800, canary_pct: 10, min_sample_count: 5 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /deployments/${dep_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /feature-flags"
              payload: { key: "search-rerank", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id, flag_v0: $.data.version }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1_id: $.data.id }
            - call: "POST /flag-rollout-steps/${step1_id}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:35:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /flag-rollout-steps/${step1_id}/apply"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "GET /feature-flags/${flag_id}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_v1: $.data.version, exposure_before: $.data.current_exposure_pct }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 15, soak_minutes: 60, expected_feature_flag_version: "${flag_v1}", deployment_id: "${dep_id}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step2_id: $.data.id }
            - call: "POST /flag-rollout-steps/${step2_id}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step2_prev: $.data.previous_exposure_pct }
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:40:00Z", cohort: "CANARY", request_count: 10, error_count: 4, latency_p95_ms: 300 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:45:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /deployments/${dep_id}/canary-evaluations"
              payload: { window_start_at: "2026-08-10T02:30:00Z", window_end_at: "2026-08-10T02:45:00Z" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { eval_verdict: $.data.verdict, eval_score: $.data.weighted_health_score }
          assert:
            - "current_exposure_pct captured before the abort == 5 and step2 previous_exposure_pct == 5"
            - "CanaryEvaluation.sample_count == 10"
            - "CanaryEvaluation.error_rate_pct_rounded == 40.0"
            - "CanaryEvaluation.weighted_health_score == 36.4"
            - "CanaryEvaluation.verdict == FAIL and CanaryEvaluation.abort_triggered == true"
            - "Deployment.${dep_id}.delivery_state == ABORTED and Deployment.${dep_id}.verification_state == FAILING"
            - "Deployment.${dep_id}.health_score == 36.4"
            - "FlagRolloutStep.${step2_id}.state == ABORTED"
            - "FlagRolloutStep.${step1_id}.state == APPLIED"
            - "FeatureFlag.${flag_id}.current_exposure_pct == 5 (restored to step2.previous_exposure_pct, not 15 and not 0)"
            - "FeatureFlag.${flag_id}.applied_step_count == 1 (unchanged by the abort)"
            - "FeatureFlag.${flag_id}.state == PAUSED and FeatureFlag.${flag_id}.kill_switch_engaged == true"
            - "Environment.${env_id}.active_deployment_count == 0"
            - "Release.${rel_id}.phase == STABILIZING (an abort does not roll the release back)"

      - name: change_withdraw_restores_release_risk_budget_and_committed_count
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_WITHDRAWN
          - state_machines.ChangeRequest.APPROVED_to_BLOCKED_BY_DEPENDENCY
          - entities.Release.fields.risk_budget_consumed_points
          - entities.Release.fields.committed_change_count
          - calculations.change_risk_score
          - calculations.release_readiness_score
        distinguishing_aspect: |
          The compensated quantity here is the fiscal risk-budget ledger rather than flag exposure:
          withdrawing the prerequisite unwinds its own 33 points AND transitively unwinds the dependent's
          38 points via APPROVED -> BLOCKED_BY_DEPENDENCY, returning risk_budget_consumed_points from 71
          to exactly 0 and committed_change_count from 2 to 0.
        test_recipe:
          setup:
            - "Train core-train (risk_budget_points 120), Release 2026.08.1 OPEN, clock 2026-08-01T00:00:00Z."
            - "CR_W: lines_changed 300, touched_subsystem_count 2, SINGLE_TENANT => 33 MEDIUM, no prerequisites, final score 33."
            - "CR_E: same inputs, but with ChangeDependency CR_E -> CR_W giving dependency_depth 1, so its final score at approval is 38."
            - "Both changes carry one TECHNICAL approval and are APPROVED: committed_change_count 2, risk_budget_consumed_points 71."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Extract retry helper", summary_internal: "Prerequisite helper extraction", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_w: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Adopt retry helper", summary_internal: "Consumer migration onto the helper", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_e: $.data.id }
            - call: "POST /change-requests/${cr_w}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_e}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_e}/dependencies"
              payload: { to_change_id: "${cr_w}" }
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_w}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
            - call: "POST /change-requests/${cr_e}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { budget_before: $.data.risk_budget_consumed_points, committed_before: $.data.committed_change_count, projected_before: $.data.readiness_score_projected }
          trigger:
            - call: "POST /change-requests/${cr_w}/withdraw"
              payload: { reason: "design reverted after review" }
              as: Engineer
              as_user_id: "u-eng-1"
          assert:
            - "risk_budget_consumed_points captured before the withdraw == 71"
            - "committed_change_count captured before the withdraw == 2"
            - "readiness_score_projected captured before the withdraw == 100"
            - "ChangeRequest.${cr_w}.risk_score_final == 33 and ChangeRequest.${cr_e}.risk_score_final == 38"
            - "ChangeRequest.${cr_w}.state == WITHDRAWN"
            - "ChangeRequest.${cr_e}.state == BLOCKED_BY_DEPENDENCY"
            - "Release.${rel_id}.risk_budget_consumed_points == 0"
            - "Release.${rel_id}.committed_change_count == 0"
            - "Release.${rel_id}.readiness_score_projected == 95"
            - "ChangeRequest.${cr_e}.risk_score_final == 38 (retained through the block, not cleared)"
