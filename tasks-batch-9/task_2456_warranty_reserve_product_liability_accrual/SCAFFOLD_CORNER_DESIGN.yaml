          assert:
            - "After the first trigger call: SupplierRecovery.${rec_rz1_id}.status == SETTLED, valuation_variant == CONTRACTUAL_FLOOR, recognized_recovery_cents == 3000000, settled_period_id == \"${p_rz_id}\""
