            - call: "POST /violation-cases"
              payload: { developer_id: "${d1_id}", category: "RATE_ABUSE", severity: "MEDIUM", summary: "Sustained request rate above the provisioned ceiling for three consecutive hours." }
              as: TrustAndSafetyOfficer
              as_user_id: "tso-1"
              captures: { c1_id: $.data.id }
            - call: "POST /support-cases"
              payload: { kind: "PLATFORM_INCIDENT", api_product_id: "${p1_id}", severity: "S3", title: "Elevated catalog read latency", started_at: "2026-08-01T00:00:00Z" }
              as: PartnerSupportAgent
