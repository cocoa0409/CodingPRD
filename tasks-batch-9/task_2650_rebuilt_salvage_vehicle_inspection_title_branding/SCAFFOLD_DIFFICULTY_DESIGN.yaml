    instances:
      - name: damage_ratio_exactly_at_salvage_threshold_brands_but_one_ten_thousandth_below_does_not
        grounds:
          - calculations.damage_threshold_evaluation
          - entities.InsurerDamageReport.fields.damage_ratio
          - entities.TitleRecord.fields.brand_code
        distinguishing_aspect: |
          Metric under test is damage_ratio at 4-decimal precision on POST /v1/damage-reports:
          750000/1000000 == 0.7500 is >= SALVAGE_RATIO_THRESHOLD and brands SALVAGE, while
          749900/1000000 == 0.7499 is one ten-thousandth below and brands NONE.
        test_recipe:
          setup:
            - "two registered SEDAN vehicles with identical acv_cents of 1000000"
