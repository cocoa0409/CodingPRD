          trigger:
            - { call: "GET /gifted/screening-cycles/${cyc}/disproportionality-report?variant=INTERIM", as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b5}/committee-reviews", payload: { review_kind: "BAND_REVIEW", grounds: "band review" }, as: GiftedCoordinator, captures: { rev: $.data.id } }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "DENY" }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "DENY" }, as: CommitteeMember, as_user_id: "cm-2" }
