            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Long Haul 15 social", channel: "SOCIAL", aspect_ratio: "9:16", target_duration_seconds: 15, caption_requirement: "BURNED_IN", usage_rights_months: 24, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
