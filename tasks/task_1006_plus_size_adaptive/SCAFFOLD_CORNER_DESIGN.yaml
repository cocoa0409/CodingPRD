            - call: "POST /orders"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: fitspecialist_can_curate_box_shipment
        claim_type: peer_roles
        grounds:
          - roles.FitSpecialist
