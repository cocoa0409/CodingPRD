          - "Trigger response: data.error_id != \"ERR_INVENTORY_POOL_NOT_FOUND\" (the NEO/M/OPEN pool exists)"
          - "GET /fit-exchanges with device_order_id == ${ord} returns exactly 0 rows"
          - "GET /device-orders/${ord}: data.version == ${ord_v} (the rejected request incremented nothing) and data.dome_size == \"M\" and data.tip_type == \"OPEN\""
          - "GET /inventory-pools with sku == \"NEO-M-OPEN\": on_hand_units 4, reserved_units 0, dispatched_units 1, total_units_received 5"
          - "GET /inventory-pools with sku == \"NEO-L-CLOSED\": on_hand_units 3, reserved_units 0, dispatched_units 0, total_units_received 3"

  # =======================================================================
  # 0.5 rule 6: boundary_precision_check
  # Three DIFFERENT metrics, each reached through a DISTINCT endpoint:
  #   booked minutes vs capacity  -> POST /remote-fitting-sessions
  #   trial seconds -> whole days -> POST /return-authorizations/{id}/inspect
  #   advisory weight sum         -> POST /screening-sessions/{id}/submit
  # =======================================================================
  boundary_precision_check:

    - name: provider_capacity_exact_equality_accepted_then_one_over_rejected
      grounds:
        - "calculations.provider_daily_capacity"
        - "validations[priority=50]"
        - "entities.Provider.fields.daily_capacity_minutes"
        - "entities.Provider.fields.utilization_pct"
      distinguishing_aspect: >-
        METRIC: booked_minutes_on_focus_date + candidate.duration_minutes against
        Provider.daily_capacity_minutes, reached through POST /remote-fitting-sessions.
        Exact equality (60 + 60 == 120) is ACCEPTED and drives utilization_pct to
        100.0; a further 15-minute request on the same UTC date (120 + 15) is
        REJECTED with ERR_PROVIDER_CAPACITY_EXCEEDED; and the same 15-minute request
        one calendar day later is ACCEPTED because the aggregate is per focus date.
        A strict "<" gate loses the second booking; a capacity counter that is not
        keyed on date_utc(scheduled_start_utc) loses the third.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with telehealth_fitting_permitted true."
          - "One TELECARE_FITTER Provider licensed in CA with daily_capacity_minutes 120 and buffer_minutes 0, so slot-overlap never masks the capacity gate."
          - "Patient age 62 in REGISTERED status (TROUBLESHOOT sessions need no screening or order)."
          - "One 60-minute TROUBLESHOOT session already booked for 2026-08-10T09:00:00Z-10:00:00Z, leaving booked_minutes_on_focus_date 60 and utilization_pct 50.0."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "TELECARE_FITTER", npi: "1760488321", full_name: "Cap Tester", licensed_state_codes: ["CA"], daily_capacity_minutes: 120, buffer_minutes: 0 }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { prov: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "cap@example.com", full_name: "Cara Pace", age_years: 62 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T09:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z", provider_id: "${prov}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { s1: "$.data.id" }
        trigger:
          - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T11:00:00Z", scheduled_end_utc: "2026-08-10T12:00:00Z", provider_id: "${prov}" }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T13:00:00Z", scheduled_end_utc: "2026-08-10T13:15:00Z", provider_id: "${prov}" }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-11T09:00:00Z", scheduled_end_utc: "2026-08-11T09:15:00Z", provider_id: "${prov}" }, as: Patient, as_user_id: "${pat}" }
          - { call: "GET /providers/${prov}", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        assert:
          - "After the setup booking, GET /providers/${prov}: data.booked_minutes_on_focus_date == 60 and data.utilization_pct == 50.0"
          - "Trigger call 1 (60 + 60 == 120, exactly the capacity): HTTP 201 with data.status == \"SCHEDULED\" and data.duration_minutes == 60"
          - "After trigger call 1, GET /providers/${prov}: data.booked_minutes_on_focus_date == 120 and data.utilization_pct == 100.0"
          - "Trigger call 2 (120 + 15 == 135 > 120): HTTP 409 with data.error_id == \"ERR_PROVIDER_CAPACITY_EXCEEDED\""
          - "After trigger call 2, GET /providers/${prov}: data.booked_minutes_on_focus_date == 120 and data.utilization_pct == 100.0 (the rejected request changed nothing)"
          - "After trigger call 2, GET /remote-fitting-sessions with provider_id == ${prov} and status == \"SCHEDULED\" returns exactly 2 rows"
          - "Trigger call 3 (same 15 minutes but on 2026-08-11): HTTP 201 with data.status == \"SCHEDULED\" and data.duration_minutes == 15"
          - "Trigger call 4, GET /providers/${prov}: data.booked_minutes_on_focus_date == 15 and data.utilization_pct == 12.5 (the focus date moved to 2026-08-11)"

    - name: zero_day_return_waives_restocking_but_not_damage_surcharge
      grounds:
        - "calculations.trial_days_used"
        - "calculations.return_refund_settlement"
        - "entities.ReturnAuthorization.fields.days_used_at_issue"
        - "state_machines.ReturnAuthorization.RECEIVED_to_INSPECTED"
      distinguishing_aspect: >-
        METRIC: elapsed trial seconds floored into whole days, reached through
        POST /return-authorizations/{id}/inspect. The return is issued at
        2026-08-01T23:59:59Z, exactly 86399 seconds after started_at, so
        days_used_at_issue is 0 (not 1) and the variant flips to WAIVED even though
        pinned_restocking_mode is FLAT_PCT. The DAMAGED surcharge component
        nevertheless survives the waiver at round_half_up(190000 * 0.15) == 28500,
        giving restocking_fee_cents 28500 and refund_amount_cents 180101. Rounding
        86399/86400 up yields the FLAT_PCT branch and 47725/160876 instead; dropping
        the surcharge on a WAIVED variant yields 0/208601.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.1000, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
          - "One InventoryPool NEO/M/OPEN with 5 units and one IN_STOCK NEO device."
          - "Patient age 74 screens clean; order 199900/9900/4500/1495 -> total_cents 210096, captured_cents 210096."
          - "DELIVERED at exactly 2026-08-01T00:00:00Z, so TrialPeriod.started_at is that instant."
          - "Clock advanced to 2026-08-01T23:59:59Z (86399 seconds later) and the return authorization issued there, then picked up and received."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-ZD-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "zd@example.com", full_name: "Zoe Dane", age_years: 74 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:59:59Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "GET /trial-periods"
            payload: { device_order_id: "${ord}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { trial: "$.data[0].id", trial_v: "$.data[0].version" }
          - call: "POST /trial-periods/${trial}/return-authorizations"
            payload: { expected_trial_period_version: "${trial_v}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { ra: "$.data.id" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "RETURN_PICKED_UP" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /return-authorizations/${ra}/receive", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        trigger:
          - { call: "POST /return-authorizations/${ra}/inspect", payload: { inspection_grade: "DAMAGED" }, as: CareOpsAgent, as_user_id: "ops_1" }
        assert:
          - "GET /trial-periods/${trial}: data.started_at == \"2026-08-01T00:00:00Z\" and data.days_used == 0 (86399 seconds is 0 whole days)"
          - "GET /return-authorizations/${ra}: data.days_used_at_issue == 0"
          - "GET /return-authorizations/${ra}: data.restocking_variant == \"WAIVED\" while GET /device-orders/${ord} shows data.pinned_restocking_mode == \"FLAT_PCT\""
          - "GET /return-authorizations/${ra}: data.restocking_fee_cents == 28500 (damage surcharge only; device and accessory restocking are 0)"
          - "GET /return-authorizations/${ra}: data.restocking_fee_cents != 47725 (the FLAT_PCT branch) and != 0 (dropping the surcharge on a waived variant)"
          - "GET /return-authorizations/${ra}: data.non_refundable_shipping_cents == 1495 and data.refund_amount_cents == 180101"
          - "GET /return-authorizations/${ra}: data.return_deadline_utc == \"2026-08-15T23:59:59Z\" and data.status == \"INSPECTED\""

    - name: advisory_referral_threshold_inclusive_at_two_point_five
      grounds:
        - "calculations.red_flag_referral_trigger"
        - "entities.ScreeningSession.fields.screening_outcome"
        - "entities.Patient.fields.advisory_weight_total"
        - "state_machines.ScreeningSession.SUBMITTED_to_SCORED"
      distinguishing_aspect: >-
        METRIC: the advisory weight sum against the INCLUSIVE
        ADVISORY_REFERRAL_THRESHOLD 2.5, reached through
        POST /screening-sessions/{id}/submit. Patient A reports PAIN (1.5) plus WAX
        (1.0) for advisory_sum exactly 2.5 and must land on RED_FLAG with a referral
        opened and NO provisional candidacy score; Patient B reports WAX (1.0) plus
        TINNITUS_ONE_EAR (1.0) for 2.0 and must land on ADVISORY_PASS with
        candidacy_risk_score 41.5 and no referral. An exclusive ">" comparison
        misclassifies A as ADVISORY_PASS and silently lets the order proceed.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with min_age_years 18 and referral_validity_days 180; both patients are 65 so AGE_BELOW_MINIMUM never fires."
          - "Both screenings carry pure_tone_avg_db 45.0 (below the 71.0 SEVERE_LOSS_DB edge) and asymmetry_db 5.0 (below the 15.0 ASYMMETRY_DB edge), so no MANDATORY_REFERRAL finding can be emitted and the outcome is decided purely by the advisory sum."
          - "Patient A: symptom_codes ['PAIN', 'WAX'] -> EAR_PAIN 1.5 + IMPACTED_CERUMEN 1.0 = 2.5."
          - "Patient B: symptom_codes ['WAX', 'TINNITUS_ONE_EAR'] -> IMPACTED_CERUMEN 1.0 + UNILATERAL_TINNITUS 1.0 = 2.0."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "adv_a@example.com", full_name: "Ada Aster", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_a: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "adv_b@example.com", full_name: "Bo Birch", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_b: "$.data.id" }
          - call: "POST /patients/${pat_a}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_a}"
            captures: { scr_a: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_a}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["PAIN", "WAX"] }, as: Patient, as_user_id: "${pat_a}" }
          - call: "POST /patients/${pat_b}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_b}"
            captures: { scr_b: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_b}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["WAX", "TINNITUS_ONE_EAR"] }, as: Patient, as_user_id: "${pat_b}" }
        trigger:
          - { call: "POST /screening-sessions/${scr_a}/submit", payload: {}, as: Patient, as_user_id: "${pat_a}" }
          - { call: "POST /screening-sessions/${scr_b}/submit", payload: {}, as: Patient, as_user_id: "${pat_b}" }
        assert:
          - "GET /screening-sessions/${scr_a}: data.status == \"SCORED\" and data.screening_outcome == \"RED_FLAG\" (2.5 >= 2.5 is inclusive)"
          - "GET /screening-sessions/${scr_a}/red-flag-findings returns exactly 2 rows: data[0].code == \"EAR_PAIN\" with severity \"ADVISORY\" and weight 1.5, data[1].code == \"IMPACTED_CERUMEN\" with severity \"ADVISORY\" and weight 1.0 (detection-table order)"
          - "GET /patients/${pat_a}: data.status == \"REFERRAL_REQUIRED\" and data.advisory_weight_total == 2.5 and data.open_mandatory_flag_count == 0 and data.candidacy_risk_score == 0.0"
          - "GET /provider-referrals with patient_id == ${pat_a} returns exactly 1 row with data[0].status == \"OPEN\", data[0].reason_codes == [\"EAR_PAIN\", \"IMPACTED_CERUMEN\"] and data[0].expires_at == \"2027-01-28T00:00:00Z\""
          - "GET /screening-sessions/${scr_b}: data.screening_outcome == \"ADVISORY_PASS\" (2.0 < 2.5)"
          - "GET /patients/${pat_b}: data.status == \"CANDIDATE_APPROVED\" and data.advisory_weight_total == 2.0"
          - "GET /patients/${pat_b}: data.candidacy_risk_score == 41.5 and data.candidacy_risk_variant == \"PROVISIONAL_SELF_REPORTED\" and data.candidacy_risk_band == \"MODERATE\""
          - "GET /provider-referrals with patient_id == ${pat_b} returns exactly 0 rows"

  # =======================================================================
  # 0.5 rule 7: cross_entity_state_dependency
  # Three DIFFERENT entity pairs, all mediated by validations[priority=24]
  # (ERR_DEPENDENT_STATE_NOT_READY, 409):
  #   (RemoteFittingSession, DeviceOrder)
  #   (CarePlanSubscription, TrialPeriod)
  #   (FirmwareRollout,      CarePlanSubscription)
  # =======================================================================
  cross_entity_state_dependency:

    - name: initial_fit_start_requires_linked_order_delivered
      grounds:
        - "validations[priority=24]"
        - "state_machines.RemoteFittingSession.SCHEDULED_to_IN_PROGRESS"
        - "state_machines.DeviceOrder.SHIPPED_to_DELIVERED"
        - "entities.DeviceOrder.fields.fulfillment_status"
      distinguishing_aspect: >-
        ENTITY PAIR (RemoteFittingSession, DeviceOrder). An INITIAL_FIT session
        inside its scheduled window still cannot start while the linked DeviceOrder
        is only SHIPPED - the transition additionally requires
        fulfillment_status == DELIVERED - so the first
        POST /remote-fitting-sessions/{id}/start returns 409
        ERR_DEPENDENT_STATE_NOT_READY. The identical call succeeds after a delivery
        scan with no change to the clock or to the session itself, proving the gate
        is the sibling entity's state and not a temporal window.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with telehealth_fitting_permitted true and trial_period_days 30."
          - "One TELECARE_FITTER Provider licensed in CA (daily_capacity_minutes 480, buffer_minutes 10)."
          - "One InventoryPool NEO/M/OPEN with 5 units and one IN_STOCK NEO device."
          - "Patient age 66 screens clean and orders; the order is authorized, fit-confirmed and SHIPPED but NOT scanned DELIVERED."
          - "An INITIAL_FIT session linked to that order is booked for 2026-08-10T10:00:00Z-11:00:00Z and the clock is moved to exactly 2026-08-10T10:00:00Z, so the scheduled window is satisfied."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "TELECARE_FITTER", npi: "1093859302", full_name: "Fit Starter", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 10 }
