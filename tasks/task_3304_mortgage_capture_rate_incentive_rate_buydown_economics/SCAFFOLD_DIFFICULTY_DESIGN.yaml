  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_creation_gated_on_home_site_available
        grounds:
          - validations[priority=5]
          - errors[ERR_HOME_SITE_NOT_AVAILABLE]
          - state_machines.HomeSite.AVAILABLE_to_UNDER_CONTRACT
          - entities.HomeSite.fields.home_site_status
          - endpoints.POST /housing/home-sites/{id}/contracts
        distinguishing_aspect: |
          The crossed pair is (HomeSite, HomeSaleContract): the home site's own status is what
          decides whether a contract may be written, so once the first contract flips the site
          to UNDER_CONTRACT a second contract on the same site is rejected even though every
          contract-side field is valid.
        test_recipe:
          setup:
            - "community cm1 with one AVAILABLE home site hs1 and one buyer b1"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
