            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Piedmont Regional U17", division: "U17", tier: "REGIONAL", start_date: "2026-10-15", end_date: "2026-10-16", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-10-01T00:00:00Z", withdrawal_deadline_at: "2026-10-10T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t2_id: $.data.id } }
