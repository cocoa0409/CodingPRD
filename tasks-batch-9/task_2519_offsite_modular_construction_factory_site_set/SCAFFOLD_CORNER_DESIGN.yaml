        excluded_because:
          difficulty_instance: resource_temporal_overlap / factory_line_half_open_slot_windows_with_aggregate_capacity_two
          rationale: "The half-open boundary (a slot starting exactly at another's line_slot_end is not concurrent) and the aggregate capacity rejection are both asserted there."

      - name: draw_amount_waterfall_rounding_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.draw_certification_amount
        excluded_because:
          difficulty_instance: combinatorial_formula / mode_b_draw_amount_three_stage_rounding_order
          rationale: "Per-module rounding before summation, then the deposit rate, then retainage — including the 1-cent remainder that distinguishes the orders — is that instance's whole subject."

      - name: draw_basis_variant_divergence_on_identical_module_state
        claim_type: Variant Divergence
        grounds:
