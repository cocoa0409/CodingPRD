      - name: corner_insured_exposure_charge_then_release_conserves_limit_identity
        claim_type: aggregation
        grounds:
          - calculations.insured_exposure_ledger
          - state_machines.ExportOrder.settlement.transitions.LC_ACCEPTED_to_UNSECURED
          - entities.CreditInsurancePolicy.fields.available_limit_usd
          - entities.ForeignBuyer.fields.aggregate_exposure_usd
