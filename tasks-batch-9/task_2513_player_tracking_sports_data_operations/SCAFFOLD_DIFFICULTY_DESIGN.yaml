  # =========================================================================
  # RULE 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rights_window_closed_interval_with_broadcast_buffer
        grounds:
          - validations[priority=60]
          - errors[ERR_RIGHTS_WINDOW_OVERLAP]
          - entities.RightsWindow.fields.window_start_utc
          - entities.RightsWindow.fields.territory
          - calculations.rights_allocation_ledger
        distinguishing_aspect: |
          CLOSED-interval pairwise collision with a symmetric 300-second broadcast buffer on the
          Game resource: a second BROADCAST_LIVE US window starting at 21:10:00 collides because
          the expanded intervals touch at exactly 21:05:00, while 21:10:01 - one second later -
          is admitted. Endpoint contact counts as a collision here, the exact opposite of the
          half-open feed-session geometry.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue registered; Game with licensable_minutes 240 (net pool 204)"
            - "one ACTIVE BROADCAST_LIVE window, territory US, 18:00:00-21:00:00 (180 allocated minutes, remaining 24)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
