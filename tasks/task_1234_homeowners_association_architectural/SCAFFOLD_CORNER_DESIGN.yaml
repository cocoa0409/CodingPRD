      - name: list_owners_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /arc/associations/{id}/owners"]
        distinguishing_aspect: "With 3 owners, limit=2 returns exactly 2 rows with total_count == 3 and has_more == true; offset=2 returns the final row with has_more == false."
        test_recipe:
          setup: ["Association with exactly 3 owners"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Page HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
