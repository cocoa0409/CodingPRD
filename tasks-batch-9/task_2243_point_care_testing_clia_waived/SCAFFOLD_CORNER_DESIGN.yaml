              as: ProgramAdmin
              captures: { cov_wv: $.data.id, snap_wv: $.data.permitted_complexity_snapshot }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T09:00:00Z" }
