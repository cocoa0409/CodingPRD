scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: create_merchant_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Merchant, endpoints]
        distinguishing_aspect: "POST /merchants with all required fields returns 201 and a Merchant whose status defaults to ACTIVE and version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "New Co", ein: "200000001", state_code: "CA", monthly_revenue_cents: 1500000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
          assert:
            - "response status code == 201"
            - "Merchant.${merch_id}.status == ACTIVE"
            - "Merchant.${merch_id}.version == 1"
            - "Merchant.${merch_id}.legal_name == New Co"

      - name: get_merchant_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Merchant, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /merchants/{id} with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
          assert:
            - "response status code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_merchant_missing_ein_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Merchant.fields.ein, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST /merchants omitting the required ein field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "No EIN Co", state_code: "CA", monthly_revenue_cents: 1500000 }
              as: Underwriter
              as_user_id: "uw_1"
          assert:
            - "response status code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: draw_principal_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Draw.fields.principal_cents, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST a draw with principal_cents == 0 violates the >0 constraint and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An ACTIVE CreditLine (limit 1000000)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "ZeroDraw Co", ein: "200000002", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 0 }
              as: Servicer
              as_user_id: "sv_1"
          assert:
            - "response status code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: draw_fee_computed_on_create_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Draw.fields.fee_cents, calculations.draw_fee]
        distinguishing_aspect: "Draw.fee_cents is computed as round(principal*fee_factor_bps/10000); a 300000 draw on a TIER_A (800bps) line yields fee_cents == 24000 even though fee_cents is not a client input."
        test_recipe:
          setup: ["A TIER_A ACTIVE CreditLine (fee_factor 800, limit 1000000)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "FeeCalc Co", ein: "200000003", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 300000 }
              as: Servicer
              as_user_id: "sv_1"
              captures: { draw_id: $.data.id }
          assert:
            - "Draw.${draw_id}.fee_cents == 24000"
            - "Draw.${draw_id}.principal_repaid_cents == 0"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry is common_fields:false (id + created_at only); the only way to read it is the line ledger list, and entries carry no version/update endpoint."
        test_recipe:
          setup: ["A TIER_A ACTIVE CreditLine with one draw 100000 (fee 8000), producing DRAW_PRINCIPAL + DRAW_FEE ledger entries."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Ledger Co", ein: "200000004", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 100000 }
              as: Servicer
              as_user_id: "sv_1"
          trigger:
            - call: "GET /credit-lines/${line_id}/ledger-entries"
              payload: {}
              as: Servicer
              as_user_id: "sv_1"
          assert:
            - "GET /credit-lines/${line_id}/ledger-entries returns exactly 2 entries"
            - "GET /credit-lines/${line_id}/ledger-entries with entry_type=DRAW_PRINCIPAL returns total amount_cents == 100000"
            - "GET /credit-lines/${line_id}/ledger-entries with entry_type=DRAW_FEE returns total amount_cents == 8000"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: approve_application_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_APPROVED, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an Application in DRAFT (no SUBMITTED->APPROVED edge from DRAFT) returns ERR_INVALID_STATE (409); status stays DRAFT."
        test_recipe:
          setup: ["A DRAFT Application against a FRESH feed."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "DraftApprove Co", ein: "200000005", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Application.${app_id}.status == DRAFT"

      - name: charge_off_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CreditLine.DEFAULTED_to_CHARGED_OFF, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Charge-off requires DEFAULTED; calling it on an ACTIVE line returns ERR_INVALID_STATE (409) before the OCC check."
        test_recipe:
          setup: ["A fresh ACTIVE CreditLine (limit 1000000)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "ActiveCO Co", ein: "200000006", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-04-28T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "GET /credit-lines/${line_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "POST /credit-lines/${line_id}/charge-off"
              payload: { expected_credit_line_version: "${line_ver}" }
              as: CreditOfficer
              as_user_id: "co_2"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "CreditLine.${line_id}.status == ACTIVE"

      - name: settle_already_settled_remittance_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Remittance.SCHEDULED_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a remittance a second time (already SETTLED, terminal) returns ERR_INVALID_STATE (409); no second allocation occurs."
        test_recipe:
          setup: ["A DAILY ACTIVE CreditLine with one draw 500000 and a remittance SETTLED at 2026-05-20T00:00:00Z (amount 10800)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-18T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "DblSettle Co", ein: "200000007", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-05-17T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 500000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-20T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { remit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${remit_id}/settle"
              payload: { outcome: "SUCCESS" }
              as: Servicer
              as_user_id: "sv_1"
          trigger:
            - call: "POST /remittances/${remit_id}/settle"
              payload: { outcome: "SUCCESS" }
              as: Servicer
              as_user_id: "sv_1"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Remittance.${remit_id}.status == SETTLED"
            - "Remittance.${remit_id}.amount_cents == 10800"

      - name: declare_default_cancels_scheduled_remittances_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.CreditLine.DELINQUENT_to_DEFAULTED, state_machines.Remittance.SCHEDULED_to_CANCELLED, entities.CreditLine.fields.defaulted_by_user_id]
        distinguishing_aspect: "Declaring DEFAULT cancels the line's SCHEDULED remittances (the auto-spawned retry from the last NSF) to CANCELLED and stamps defaulted_by_user_id."
        test_recipe:
          setup: ["A DELINQUENT CreditLine driven to nsf_strike_count 5 with a SCHEDULED retry remittance still pending."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "DefCancel Co", ein: "200000008", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-05-12T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 200000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r1}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r2: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r2}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r3: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-19T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r3}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r4: $.data.next_retry_remittance_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r4}/settle"
              payload: { outcome: "NSF" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r5: $.data.next_retry_remittance_id }
            - call: "GET /credit-lines/${line_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "POST /credit-lines/${line_id}/declare-default"
              payload: { expected_credit_line_version: "${line_ver}" }
              as: CreditOfficer
              as_user_id: "co_default"
          assert:
            - "CreditLine.${line_id}.status == DEFAULTED"
            - "CreditLine.${line_id}.defaulted_by_user_id == co_default"
            - "Remittance.${r5}.status == CANCELLED"
            - "GET /credit-lines/${line_id}/remittances with status=SCHEDULED returns exactly 0 remittances"

      - name: terminal_charged_off_line_rejects_close
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CreditLine.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CHARGED_OFF line is terminal; calling close on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CHARGED_OFF CreditLine (reached via default+charge-off on an unrepaid 200000 draw)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /merchants"
              payload: { legal_name: "TermCO Co", ein: "200000009", state_code: "CA", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "p1", pulled_at: "2026-05-12T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
            - call: "POST /credit-lines"
              payload: { application_id: "${app_id}", remittance_cadence: "DAILY" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { line_id: $.data.id }
            - call: "POST /credit-lines/${line_id}/draws"
              payload: { principal_cents: 200000 }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /credit-lines/${line_id}/remittances"
              payload: { scheduled_for: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Servicer
              as_user_id: "sv_1"
            - call: "POST /remittances/${r1}/settle"
              payload: { outcome: "NSF" }
