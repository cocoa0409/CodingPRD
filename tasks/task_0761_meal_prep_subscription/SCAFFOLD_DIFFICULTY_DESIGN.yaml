            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/skip"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
