# =============================================================================
# Industrial Hygiene Monitoring & Exposure Assessment — scaffold seed tables
# =============================================================================

scenario: |
  Industrial Hygiene Monitoring & Exposure Assessment (certified industrial hygienist firm): similar-exposure group definition, sampling plan & pump calibration, lab analysis & detection-limit handling, exposure vs PEL/TLV comparison & statistics, control recommendation & re-sampling trigger, respirator fit-test & medical clearance linkage, employee notification requirement, recordkeeping retention

domain_name: industrial-hygiene-monitoring
api_prefix: /ih

complexity_profile:
  primary_archetype: compliance_audit        # regulatory gates, SoD, retention, notification deadlines
  secondary_archetype: workflow_orchestration # plan -> field -> lab -> assessment -> control pipeline
  complexity_layers:
    - optimistic_concurrency        # OCC on SEG.version (assessment supersede) and SamplingPlan.version (revise)
    - cascading_side_effects        # blank contamination chain; control-implemented spawns verification plan
    - dual_variant_calculation      # censored substitution (LabResult) + unsampled-time rule (FieldSample)
    - rate_threshold_triggers       # drift >5%, UCL/LCL vs PEL/action-level, 15-working-day notification deadline
    - soft_delete                   # assessment archival after retention; include_archived filter
  entity_topology: flat             # all resources top-level under /ih; FK links in bodies
  state_machine_shape: parallel     # ExposureAssessment: review_status x exposure_class; plus cyclic SamplingPlan
  relationship_patterns:
    - many_to_many                  # SEGMembership junction (Employee <-> SEG)
    - self_referential              # ExposureAssessment.supersedes_assessment_id
    - cross_aggregate               # FieldSample -> Pump/PumpCalibration; RespiratorFitTest -> MedicalClearance
  role_model: segregation_of_duties # plan creator != approver; sample collector != lab analyst; preparer != signer
  consistency_model: immediate      # all side effects atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All timestamps are logical-clock driven. Every mutation of an entity row
# (including cascaded writes to computed fields) increments that row's version.
# =============================================================================
entities:
  - name: ClientSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: industry_code, type: string, source: input, description: "NAICS-like industry code" }
      - { name: retention_years, type: integer, source: input, default: 30, description: "Years exposure records must be retained before archival is permitted", constraints: ">= 1" }

  - name: Employee
    parent: ClientSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> ClientSite.id; employing site" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: external_ref, type: string, source: input, description: "Client-side employee number; unique per site" }
      - { name: job_title, type: string, source: input, description: "Job title used for SEG rationale" }

  - name: ExposureLimit
    parent: null
    common_fields: true
    fields:
      - { name: analyte_code, type: string, source: input, description: "Analyte identifier, e.g. PB for lead" }
      - { name: basis, type: enum, source: input, description: "OSHA_PEL | ACGIH_TLV" }
      - { name: limit_type, type: enum, source: input, description: "TWA8 | CEILING" }
      - { name: limit_mg_m3, type: number, source: input, description: "Limit concentration in mg/m3", constraints: "> 0" }
      - { name: action_fraction, type: number, source: input, default: 0.1, description: "Fraction of limit defining the action level", constraints: "> 0 and < 1" }
      - { name: uniqueness, type: string, source: system, description: "Unique on (analyte_code, basis, limit_type); duplicates rejected with ERR_DUPLICATE_LIMIT" }

  - name: SimilarExposureGroup
    parent: ClientSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> ClientSite.id; owning site" }
      - { name: name, type: string, source: input, description: "SEG name" }
      - { name: analyte_code, type: string, source: input, description: "Analyte monitored; must equal the linked limit's analyte_code" }
      - { name: exposure_limit_id, type: string, source: input, description: "FK -> ExposureLimit.id; governing limit" }
      - { name: task_description, type: string, source: input, description: "Task/process defining the exposure group" }
      - { name: headcount, type: integer, source: computed, default: 0, description: "Count of SEGMembership rows pointing at this SEG; maintained on membership create/transfer" }
      - { name: current_class, type: enum, source: system, default: NONE, description: "NONE | BELOW_ACTION | BELOW_PEL_MONITOR | UNCERTAIN | ABOVE_PEL; set from the latest SIGNED assessment" }
      - { name: next_sample_due_date, type: string, source: computed, description: "ISO date of next required sampling; null until first SIGNED assessment; min() with control verification due" }

  - name: SEGMembership
    parent: SimilarExposureGroup
    common_fields: true
    fields:
      - { name: seg_id, type: string, source: input, description: "FK -> SimilarExposureGroup.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: is_primary, type: boolean, source: input, default: false, description: "Whether this is the employee's primary SEG" }
      - { name: uniqueness, type: string, source: system, description: "Unique on (seg_id, employee_id); duplicates rejected with ERR_DUPLICATE_MEMBERSHIP" }

  - name: SamplingPlan
    parent: SimilarExposureGroup
    common_fields: true
    fields:
      - { name: seg_id, type: string, source: input, description: "FK -> SimilarExposureGroup.id" }
      - { name: purpose, type: enum, source: input, default: INITIAL, description: "INITIAL | FOLLOWUP | VERIFICATION" }
      - { name: planned_start_date, type: string, source: input, description: "First allowed collection_date (inclusive)" }
      - { name: planned_end_date, type: string, source: input, description: "Last allowed collection_date (inclusive); must be >= planned_start_date" }
      - { name: unsampled_time_rule, type: enum, source: input, default: ZERO_FILL, description: "ZERO_FILL | WORST_CASE; governs sample_twa for short samples" }
      - { name: volume_basis, type: enum, source: input, default: MEAN_FLOW, description: "MEAN_FLOW | PRE_FLOW; governs air_volume_liters" }
      - { name: required_sample_count, type: integer, source: computed, description: "Per required_sample_count calculation; computed at creation and on PUT while DRAFT" }
      - { name: active_sample_count, type: integer, source: computed, default: 0, description: "Count of PERSONAL FieldSamples with status in {COLLECTED, SEALED, ANALYZED}" }
      - { name: analyzed_valid_count, type: integer, source: computed, default: 0, description: "Count of PERSONAL FieldSamples with status ANALYZED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD vs approver)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | FIELD_COMPLETE | LAB_COMPLETE" }

  - name: Pump
    parent: ClientSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> ClientSite.id; owning site" }
      - { name: serial_number, type: string, source: input, description: "Pump serial; unique per site (ERR_DUPLICATE_PUMP_SERIAL)" }

  - name: PumpCalibration
    parent: Pump
    common_fields: true
    fields:
      - { name: pump_id, type: string, source: input, description: "FK -> Pump.id; calibrated pump" }
      - { name: pre_flow_lpm, type: number, source: input, description: "Pre-sampling flow rate L/min", constraints: "> 0" }
      - { name: post_flow_lpm, type: number, source: system, description: "Post-sampling flow rate; null until record-post" }
      - { name: drift_pct, type: number, source: computed, description: "= round_half_up(|post-pre|/pre*100, 2dp); null until record-post" }
      - { name: result, type: enum, source: system, description: "PENDING | VALID | INVALID; INVALID iff drift_pct > 5.00" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the calibrating technician" }
      - { name: linked_sample_id, type: string, source: system, description: "FieldSample currently referencing this calibration; null until linked; at most one non-INVALIDATED sample" }

  - name: FieldSample
    parent: SamplingPlan
    common_fields: true
    fields:
      - { name: sampling_plan_id, type: string, source: input, description: "FK -> SamplingPlan.id" }
      - { name: sample_type, type: enum, source: input, description: "PERSONAL | FIELD_BLANK" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; required iff PERSONAL, forbidden for FIELD_BLANK" }
      - { name: pump_id, type: string, source: input, description: "FK -> Pump.id; required iff PERSONAL, forbidden for FIELD_BLANK" }
      - { name: pre_calibration_id, type: string, source: input, description: "FK -> PumpCalibration.id; required iff PERSONAL, forbidden for FIELD_BLANK" }
      - { name: collection_date, type: string, source: input, description: "ISO date; must be within plan window inclusive" }
      - { name: start_minute, type: integer, source: input, description: "Minutes after midnight, 0..1439" }
      - { name: duration_minutes, type: integer, source: input, description: "Sampled duration", constraints: "1..960" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of collector (SoD vs lab analyst)" }
      - { name: status, type: enum, source: system, description: "COLLECTED | SEALED | ANALYZED | INVALIDATED" }
      - { name: invalidate_reason, type: string, source: system, description: "MANUAL | PUMP_DRIFT | BLANK_CONTAMINATION; null unless INVALIDATED" }
      - { name: air_volume_liters, type: number, source: computed, description: "Per air_volume_concentration calc; null until ANALYZED" }
      - { name: concentration_mg_m3, type: number, source: computed, description: "Per air_volume_concentration calc; null until ANALYZED" }
      - { name: sample_twa_mg_m3, type: number, source: computed, description: "Per sample_twa calc (8h basis); null until ANALYZED" }
      - { name: is_detect, type: boolean, source: computed, description: "mass_ug >= batch.lod_ug; null until ANALYZED" }

  - name: LabBatch
    parent: ClientSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: analyte_code, type: string, source: input, description: "Analyte this batch analyzes; must match sample plan analyte" }
      - { name: lod_ug, type: number, source: input, description: "Limit of detection, micrograms", constraints: "> 0" }
      - { name: loq_ug, type: number, source: input, description: "Limit of quantitation, micrograms", constraints: ">= lod_ug" }
      - { name: window_start_date, type: string, source: input, description: "First date results may be entered (inclusive)" }
      - { name: window_end_date, type: string, source: input, description: "Last date results may be entered (INCLUSIVE both ends)" }
      - { name: max_capacity, type: integer, source: input, description: "Maximum number of LabResults accepted", constraints: ">= 1" }
      - { name: intake_count, type: integer, source: computed, default: 0, description: "Count of LabResults in this batch" }
      - { name: contaminated, type: boolean, source: computed, default: false, description: "Set true when a FIELD_BLANK result has mass_ug >= lod_ug; closes intake" }

  - name: LabResult
    parent: FieldSample
    common_fields: true
    fields:
      - { name: field_sample_id, type: string, source: input, description: "FK -> FieldSample.id; one result per sample (ERR_RESULT_ALREADY_EXISTS)" }
      - { name: lab_batch_id, type: string, source: input, description: "FK -> LabBatch.id" }
      - { name: mass_ug, type: number, source: input, description: "Measured mass in micrograms", constraints: ">= 0" }
      - { name: entered_by_user_id, type: string, source: system, description: "X-User-ID of lab analyst (SoD vs collector)" }
      - { name: reported_at, type: string, source: system, description: "Logical timestamp at entry" }
      - { name: is_detect, type: boolean, source: computed, description: "mass_ug >= batch.lod_ug" }
      - { name: is_quantifiable, type: boolean, source: computed, description: "mass_ug >= batch.loq_ug" }

  - name: ExposureAssessment
    parent: SamplingPlan
    common_fields: true
    fields:
      - { name: seg_id, type: string, source: system, description: "FK -> SimilarExposureGroup.id; copied from plan" }
      - { name: sampling_plan_id, type: string, source: input, description: "FK -> SamplingPlan.id; must be LAB_COMPLETE" }
      - { name: supersedes_assessment_id, type: string, source: system, description: "FK -> ExposureAssessment.id; prior SIGNED current assessment superseded at creation; null if none (self-referential)" }
      - { name: n_valid, type: integer, source: computed, description: "Count of PERSONAL ANALYZED samples in plan (statistics input set size)" }
      - { name: substitution_rule, type: enum, source: computed, description: "SQRT2 | HALF; per censored_substitution selection rule" }
      - { name: geo_mean, type: number, source: computed, description: "Geometric mean of input TWAs (4dp), null for CEILING limits" }
      - { name: gsd, type: number, source: computed, description: "Geometric standard deviation (4dp), null for CEILING limits" }
      - { name: ucl95, type: number, source: computed, description: "95% upper confidence limit (4dp), null for CEILING limits" }
      - { name: lcl95, type: number, source: computed, description: "95% lower confidence limit (4dp), null for CEILING limits" }
      - { name: exposure_class, type: enum, source: computed, description: "BELOW_ACTION | BELOW_PEL_MONITOR | UNCERTAIN | ABOVE_PEL; classification uses UNROUNDED ucl/lcl" }
      - { name: adjusted_class, type: enum, source: computed, description: "APF-adjusted class per apf_adjusted_class calc; null when no ACCEPTED+ PPE control with apf exists at sign time" }
      - { name: review_status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | SIGNED | SUPERSEDED | VOID | ARCHIVED" }
      - { name: is_current, type: boolean, source: computed, default: false, description: "True for the latest SIGNED, non-superseded, non-archived assessment of the SEG" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD vs signer)" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of signer; null until SIGNED" }
      - { name: signed_at, type: string, source: system, description: "Logical timestamp of signature; null until SIGNED" }
      - { name: retention_until, type: string, source: computed, description: "signed date + site.retention_years calendar years; null until SIGNED" }
      - { name: legal_hold, type: boolean, source: input, default: false, description: "True blocks archival (ERR_LEGAL_HOLD_ACTIVE); mutable via PUT" }

  - name: ControlRecommendation
    parent: ExposureAssessment
    common_fields: true
    fields:
      - { name: exposure_assessment_id, type: string, source: input, description: "FK -> ExposureAssessment.id" }
      - { name: control_type, type: enum, source: input, description: "ENGINEERING | ADMINISTRATIVE | PPE_RESPIRATOR" }
      - { name: description, type: string, source: input, description: "Control description" }
      - { name: priority, type: enum, source: input, description: "HIGH | MEDIUM | LOW" }
      - { name: assigned_protection_factor, type: number, source: input, description: "APF; required iff control_type == PPE_RESPIRATOR, forbidden otherwise", constraints: "> 1" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when auto-drafted by an ABOVE_PEL signature" }
      - { name: verification_plan_id, type: string, source: system, description: "FK -> SamplingPlan.id; verification plan spawned on implement; null until IMPLEMENTED" }
      - { name: implemented_at, type: string, source: system, description: "Logical timestamp of implement; null until IMPLEMENTED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | IMPLEMENTED | VERIFIED" }

  - name: EmployeeNotification
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; one per SEG member at sign time" }
      - { name: exposure_assessment_id, type: string, source: system, description: "FK -> ExposureAssessment.id" }
      - { name: due_date, type: string, source: computed, description: "15 working days (Mon-Fri) after signed date; count starts the next calendar day" }
      - { name: status, type: enum, source: system, description: "PENDING | SENT | OVERDUE | ACKNOWLEDGED" }
      - { name: sent_at, type: string, source: system, description: "Logical timestamp of send; null until SENT" }
      - { name: sent_by_user_id, type: string, source: system, description: "X-User-ID of sender; null until SENT" }
      - { name: acknowledged_at, type: string, source: system, description: "Logical timestamp of acknowledgment; null until ACKNOWLEDGED" }

  - name: MedicalClearance
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CLEARED | DENIED | EXPIRED" }
      - { name: decided_at, type: string, source: system, description: "Logical timestamp of decision; null until decided" }
      - { name: expiry_date, type: string, source: computed, description: "date(decided_at) + 365 days; set only when CLEARED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of decider; null until decided" }

  - name: RespiratorFitTest
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: medical_clearance_id, type: string, source: input, description: "FK -> MedicalClearance.id; must belong to the same employee" }
      - { name: respirator_model, type: string, source: input, description: "Respirator make/model tested" }
      - { name: test_date, type: string, source: input, description: "ISO date the fit test was performed" }
      - { name: expiry_date, type: string, source: computed, description: "test_date + 365 days" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | EXPIRED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID recording the result; null until recorded" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SamplingPlan
    initial_state: DRAFT
    terminal_states: [LAB_COMPLETE]
    shape_note: "Cyclic: reject loop PENDING_APPROVAL->DRAFT; invalidation regress loops FIELD_COMPLETE->APPROVED and LAB_COMPLETE->APPROVED"
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /ih/sampling-plans/{id}/submit"
        actor: IndustrialHygienist
        preconditions: ["plan.status == DRAFT (else ERR_PLAN_INVALID_STATE)"]
        side_effects: ["plan.version += 1"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /ih/sampling-plans/{id}/approve"
        actor: CIHDirector
        preconditions:
          - "plan.status == PENDING_APPROVAL (else ERR_PLAN_INVALID_STATE)"
          - "X-User-ID != plan.created_by_user_id (else ERR_SOD_PLAN_APPROVER)"
        side_effects: ["plan.approved_by_user_id = X-User-ID", "plan.version += 1"]
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /ih/sampling-plans/{id}/reject"
        actor: CIHDirector
        preconditions: ["plan.status == PENDING_APPROVAL (else ERR_PLAN_INVALID_STATE)"]
        side_effects: ["plan.version += 1", "required_sample_count recomputed on next PUT while DRAFT"]
        note: "Revision loop: DRAFT -> PENDING_APPROVAL -> DRAFT is allowed repeatedly"
      - from: APPROVED
        to: FIELD_COMPLETE
        trigger: "POST /ih/sampling-plans/{id}/complete-field"
        actor: IndustrialHygienist
        preconditions:
          - "plan.status == APPROVED (else ERR_PLAN_INVALID_STATE)"
          - "plan.active_sample_count >= plan.required_sample_count (else ERR_INSUFFICIENT_VALID_SAMPLES)"
        side_effects: ["plan.version += 1"]
      - from: FIELD_COMPLETE
        to: LAB_COMPLETE
        trigger: "system (after each POST /ih/lab-results, when every active PERSONAL sample is ANALYZED and analyzed_valid_count >= required_sample_count)"
        actor: system
        preconditions: ["plan.status == FIELD_COMPLETE", "all PERSONAL samples with status in {COLLECTED,SEALED,ANALYZED} are ANALYZED", "analyzed_valid_count >= required_sample_count"]
        side_effects: ["plan.version += 1"]
      - from: FIELD_COMPLETE
        to: APPROVED
        trigger: "system (a sample invalidation drops active_sample_count below required_sample_count)"
        actor: system
        preconditions: ["plan.status == FIELD_COMPLETE", "after invalidation active_sample_count < required_sample_count"]
        side_effects: ["plan.version += 1"]
        note: "Regress loop: field work reopens so replacement samples can be collected"
      - from: LAB_COMPLETE
        to: APPROVED
        trigger: "system (blank contamination invalidates ANALYZED samples dropping analyzed_valid_count below required_sample_count)"
        actor: system
        preconditions: ["plan.status == LAB_COMPLETE", "after invalidation analyzed_valid_count < required_sample_count"]
        side_effects:
          - "plan.version += 1"
          - "any ExposureAssessment of this plan with review_status in {DRAFT, UNDER_REVIEW} transitions to VOID (cascade hop 4)"
        note: "Regress loop out of LAB_COMPLETE; a SIGNED assessment is NOT voided (records are immutable once signed)"

  - entity: FieldSample
    initial_state: COLLECTED
    terminal_states: [ANALYZED, INVALIDATED]
    shape_note: "Branching: manual invalidate only from COLLECTED/SEALED; system invalidate (drift, contamination) also from ANALYZED"
    transitions:
      - from: COLLECTED
        to: SEALED
        trigger: "POST /ih/field-samples/{id}/seal"
        actor: FieldTechnician
        preconditions: ["sample.status == COLLECTED (else ERR_SAMPLE_INVALID_STATE)"]
        side_effects: ["sample.version += 1"]
      - from: SEALED
        to: ANALYZED
        trigger: "system (cascade from successful POST /ih/lab-results referencing this sample)"
        actor: system
        preconditions: []
        side_effects:
          - "air_volume_liters, concentration_mg_m3, sample_twa_mg_m3, is_detect computed and stored"
          - "plan.analyzed_valid_count recomputed (PERSONAL only); plan.version unchanged by recompute unless status flips"
          - "if plan now satisfies LAB_COMPLETE rule: plan FIELD_COMPLETE -> LAB_COMPLETE (cascade hop 3)"
      - from: COLLECTED
        to: INVALIDATED
        trigger: "POST /ih/field-samples/{id}/invalidate OR system (PUMP_DRIFT / BLANK_CONTAMINATION)"
        actor: "IndustrialHygienist | system"
        preconditions: ["manual: sample.status in {COLLECTED, SEALED} (else ERR_SAMPLE_INVALID_STATE)"]
        side_effects:
          - "invalidate_reason set (MANUAL | PUMP_DRIFT | BLANK_CONTAMINATION)"
          - "plan.active_sample_count / analyzed_valid_count recomputed; pump-calibration link released (calibration.linked_sample_id = null)"
          - "if plan.status in {FIELD_COMPLETE, LAB_COMPLETE} and counts fall below required: plan regresses to APPROVED (cascade hop 3)"
          - "sample.version += 1"
      - from: SEALED
        to: INVALIDATED
        trigger: "POST /ih/field-samples/{id}/invalidate OR system"
        actor: "IndustrialHygienist | system"
        preconditions: ["manual: sample.status in {COLLECTED, SEALED} (else ERR_SAMPLE_INVALID_STATE)"]
        side_effects: ["same as COLLECTED -> INVALIDATED"]
      - from: ANALYZED
        to: INVALIDATED
        trigger: "system only (BLANK_CONTAMINATION cascade from a contaminated LabBatch)"
        actor: system
        preconditions: ["triggered solely by the blank-contamination cascade"]
        side_effects: ["same invalidation side effects; may regress plan from LAB_COMPLETE"]

  - entity: PumpCalibration
    initial_state: PENDING
    terminal_states: [VALID, INVALID]
    transitions:
      - from: PENDING
        to: VALID
        trigger: "POST /ih/pump-calibrations/{id}/record-post with drift_pct <= 5.00"
        actor: FieldTechnician
        preconditions: ["calibration.result == PENDING (else ERR_CALIBRATION_ALREADY_RECORDED)"]
        side_effects: ["post_flow_lpm, drift_pct stored; calibration.version += 1"]
      - from: PENDING
        to: INVALID
        trigger: "POST /ih/pump-calibrations/{id}/record-post with drift_pct > 5.00"
        actor: FieldTechnician
        preconditions: ["calibration.result == PENDING (else ERR_CALIBRATION_ALREADY_RECORDED)"]
        side_effects:
          - "post_flow_lpm, drift_pct stored"
          - "linked FieldSample (if any, status COLLECTED or SEALED) -> INVALIDATED with reason PUMP_DRIFT (cascade hop 2), which may regress its plan (cascade hop 3)"
          - "calibration.version += 1"

  - entity: ExposureAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID, ARCHIVED]
    shape_note: "PARALLEL DIMENSIONS: review_status (this machine) evolves independently of the computed exposure_class axis; exposure_class is computed at creation, recomputed never, and frozen read-only once SIGNED. Review axis is CYCLIC via reject-review."
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /ih/exposure-assessments/{id}/submit-review"
        actor: IndustrialHygienist
        preconditions: ["review_status == DRAFT (else ERR_ASSESSMENT_INVALID_STATE)"]
        side_effects: ["assessment.version += 1"]
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /ih/exposure-assessments/{id}/reject-review"
        actor: CIHDirector
        preconditions: ["review_status == UNDER_REVIEW (else ERR_ASSESSMENT_INVALID_STATE)"]
        side_effects: ["assessment.version += 1"]
        note: "Review loop: DRAFT -> UNDER_REVIEW -> DRAFT allowed repeatedly; exposure_class unchanged"
      - from: UNDER_REVIEW
        to: SIGNED
        trigger: "POST /ih/exposure-assessments/{id}/sign"
        actor: CIHDirector
        preconditions:
          - "review_status == UNDER_REVIEW (else ERR_ASSESSMENT_INVALID_STATE)"
          - "X-User-ID != assessment.prepared_by_user_id (else ERR_SOD_ASSESSMENT_SIGNER)"
        side_effects:
          - "signed_at = logical now; signed_by_user_id = X-User-ID; retention_until = date(signed_at) + site.retention_years years"
          - "is_current = true; SEG.current_class = exposure_class; SEG.next_sample_due_date = date(signed_at) + RESAMPLE_INTERVAL_DAYS[exposure_class]; SEG.version += 1"
          - "one EmployeeNotification PENDING per current SEGMembership of the SEG, due_date = 15 working days after signed date (cascade hop 2 fan-out)"
          - "if exposure_class == ABOVE_PEL: auto-create ControlRecommendation (PROPOSED, ENGINEERING, HIGH, auto_created = true) (cascade hop 2)"
          - "adjusted_class computed per apf_adjusted_class (after raw class is fixed)"
          - "assessment.version += 1"
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system (a new ExposureAssessment is created for the same SEG via POST /ih/exposure-assessments)"
        actor: system
        preconditions: []
        side_effects: ["is_current = false", "assessment.version += 1"]
      - from: DRAFT
        to: VOID
        trigger: "system (source plan regresses from LAB_COMPLETE due to blank contamination)"
        actor: system
        preconditions: []
        side_effects: ["assessment.version += 1"]
      - from: UNDER_REVIEW
        to: VOID
        trigger: "system (source plan regresses from LAB_COMPLETE due to blank contamination)"
        actor: system
        preconditions: []
        side_effects: ["assessment.version += 1"]
      - from: SIGNED
        to: ARCHIVED
        trigger: "POST /ih/exposure-assessments/{id}/archive"
        actor: FirmAdmin
        preconditions:
          - "review_status == SIGNED (else ERR_ASSESSMENT_INVALID_STATE)"
          - "legal_hold == false (else ERR_LEGAL_HOLD_ACTIVE)"
          - "current logical date >= retention_until (else ERR_RETENTION_NOT_MET)"
        side_effects: ["is_current = false", "assessment.version += 1", "excluded from GET /ih/exposure-assessments unless include_archived=true"]
      - from: SUPERSEDED
        to: ARCHIVED
        trigger: "POST /ih/exposure-assessments/{id}/archive"
        actor: FirmAdmin
        preconditions:
          - "review_status == SUPERSEDED (else ERR_ASSESSMENT_INVALID_STATE)"
          - "legal_hold == false (else ERR_LEGAL_HOLD_ACTIVE)"
          - "current logical date >= retention_until (else ERR_RETENTION_NOT_MET)"
        side_effects: ["assessment.version += 1", "excluded from default list"]

  - entity: ControlRecommendation
    initial_state: PROPOSED
    terminal_states: [REJECTED, VERIFIED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /ih/control-recommendations/{id}/accept"
        actor: SiteSafetyManager
        preconditions:
          - "status == PROPOSED (else ERR_CONTROL_INVALID_STATE)"
          - "if control_type == PPE_RESPIRATOR: every employee holding a current SEGMembership in the parent SEG has >= 1 RespiratorFitTest with status PASSED and expiry_date >= current date AND >= 1 MedicalClearance with status CLEARED and expiry_date >= current date (else ERR_FIT_TEST_MISSING_FOR_PPE)"
        side_effects: ["control.version += 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ih/control-recommendations/{id}/reject"
        actor: SiteSafetyManager
        preconditions: ["status == PROPOSED (else ERR_CONTROL_INVALID_STATE)"]
        side_effects: ["control.version += 1"]
      - from: ACCEPTED
        to: IMPLEMENTED
        trigger: "POST /ih/control-recommendations/{id}/implement"
        actor: SiteSafetyManager
        preconditions:
          - "status == ACCEPTED (else ERR_CONTROL_INVALID_STATE)"
          - "parent ExposureAssessment review_status == SIGNED (else ERR_ASSESSMENT_NOT_SIGNED)"
        side_effects:
          - "implemented_at = logical now"
          - "auto-create verification SamplingPlan: same seg_id, purpose = VERIFICATION, planned_start_date = date(now)+1, planned_end_date = date(now)+30, status = DRAFT, created_by_user_id = X-User-ID, required_sample_count = 3 (cascade hop 2)"
          - "control.verification_plan_id = new plan id"
          - "SEG.next_sample_due_date = min(existing next_sample_due_date, date(now) + 14 days); SEG.version += 1 (cascade hop 3)"
          - "control.version += 1"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /ih/control-recommendations/{id}/verify"
        actor: CIHDirector
        preconditions:
          - "status == IMPLEMENTED (else ERR_CONTROL_INVALID_STATE)"
          - "the verification plan (control.verification_plan_id) has an assessment with is_current == true, review_status == SIGNED, and exposure_class in {BELOW_ACTION, BELOW_PEL_MONITOR} (else ERR_VERIFICATION_NOT_CLEAN)"
        side_effects: ["control.version += 1"]

  - entity: EmployeeNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    shape_note: "Branching fork-join: PENDING -> {SENT, OVERDUE}; OVERDUE -> SENT; SENT -> ACKNOWLEDGED"
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /ih/notifications/{id}/send"
        actor: "IndustrialHygienist | SiteSafetyManager"
        preconditions: ["status in {PENDING, OVERDUE} (else ERR_NOTIFICATION_INVALID_STATE)"]
        side_effects: ["sent_at = logical now; sent_by_user_id = X-User-ID; notification.version += 1"]
      - from: OVERDUE
        to: SENT
        trigger: "POST /ih/notifications/{id}/send"
        actor: "IndustrialHygienist | SiteSafetyManager"
        preconditions: ["status in {PENDING, OVERDUE} (else ERR_NOTIFICATION_INVALID_STATE)"]
        side_effects: ["sent_at = logical now; sent_by_user_id = X-User-ID; notification.version += 1"]
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /ih/notifications/{id}/acknowledge"
        actor: Employee
        preconditions:
          - "status == SENT (else ERR_NOTIFICATION_INVALID_STATE)"
          - "X-User-ID == notification.employee_id (else ERR_ACK_FORBIDDEN)"
        side_effects: ["acknowledged_at = logical now; notification.version += 1"]
      - from: PENDING
        to: OVERDUE
        trigger: "system (clock sweep: current logical date > due_date, strictly greater)"
        actor: system
        preconditions: ["status == PENDING", "current date > due_date"]
        side_effects: ["notification.version += 1"]
        note: "On the due date itself the notification remains PENDING"

  - entity: MedicalClearance
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: CLEARED
        trigger: "POST /ih/medical-clearances/{id}/decide with decision=CLEARED"
        actor: CIHDirector
        preconditions: ["status == REQUESTED (else ERR_CLEARANCE_INVALID_STATE)"]
        side_effects: ["decided_at = logical now; expiry_date = date(now) + 365 days; decided_by_user_id = X-User-ID; clearance.version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /ih/medical-clearances/{id}/decide with decision=DENIED"
        actor: CIHDirector
        preconditions: ["status == REQUESTED (else ERR_CLEARANCE_INVALID_STATE)"]
        side_effects: ["decided_at = logical now; decided_by_user_id = X-User-ID; clearance.version += 1"]
      - from: CLEARED
        to: EXPIRED
        trigger: "system (clock sweep: current logical date > expiry_date, strictly greater)"
        actor: system
        preconditions: ["status == CLEARED", "current date > expiry_date"]
        side_effects:
          - "every RespiratorFitTest with medical_clearance_id == this clearance and status == PASSED transitions to EXPIRED (cascade hop 2)"
          - "clearance.version += 1"

  - entity: RespiratorFitTest
    initial_state: SCHEDULED
    terminal_states: [FAILED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /ih/fit-tests/{id}/record-result with result=PASS"
        actor: FieldTechnician
        preconditions:
          - "status == SCHEDULED (else ERR_FIT_TEST_NOT_RECORDABLE)"
          - "linked MedicalClearance status == CLEARED AND current logical date <= clearance.expiry_date (else ERR_MEDICAL_CLEARANCE_NOT_CURRENT)"
        side_effects: ["expiry_date = test_date + 365 days; recorded_by_user_id = X-User-ID; fit_test.version += 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /ih/fit-tests/{id}/record-result with result=FAIL"
        actor: FieldTechnician
        preconditions:
          - "status == SCHEDULED (else ERR_FIT_TEST_NOT_RECORDABLE)"
          - "clearance currency check also applies to FAIL recording (else ERR_MEDICAL_CLEARANCE_NOT_CURRENT)"
        side_effects: ["recorded_by_user_id = X-User-ID; fit_test.version += 1"]
      - from: PASSED
        to: EXPIRED
        trigger: "system (clock sweep: current logical date > expiry_date, strictly greater; OR linked clearance EXPIRED cascade)"
        actor: system
        preconditions: ["status == PASSED", "current date > expiry_date OR linked clearance transitioned to EXPIRED"]
        side_effects: ["fit_test.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other write conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-seg
    parent_entity: SimilarExposureGroup
    write_endpoint: "POST /ih/exposure-assessments"
    occ_field: "expected_seg_version"
    description: |
      Creating an ExposureAssessment against a SEG whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an assessment (which legitimately
      supersedes the prior SIGNED assessment) or signed one (which mutates
      SEG.current_class / next_sample_due_date), making the caller's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-revise-stale-version
    parent_entity: SamplingPlan
    write_endpoint: "PUT /ih/sampling-plans/{id}"
    occ_field: "expected_plan_version"
    description: |
      Revising a DRAFT SamplingPlan whose version has advanced since the client
      last observed it is rejected; the revision would otherwise silently
      overwrite another hygienist's edits (both revisions are legitimate
      last-write-wins candidates, so OCC arbitrates).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# Decimal arithmetic throughout; round_half_up unless stated. "rN(x)" means
# round_half_up to N decimal places.
# =============================================================================
calculations:
  - name: air_volume_concentration
    trigger: "FieldSample SEALED -> ANALYZED (on successful LabResult creation)"
    algorithm: chained_rounding
    formula: |
      PINNED STEP ORDER (rounding at EVERY step; end-to-end single-rounding is WRONG):
        1. flow_used = (volume_basis == MEAN_FLOW) ? r3((pre_flow_lpm + post_flow_lpm) / 2)
                                                   : pre_flow_lpm            (PRE_FLOW: unrounded input)
        2. air_volume_liters = r1(flow_used * duration_minutes)
        3. concentration_mg_m3 = r4(mass_ug / air_volume_liters)   [ug/L == mg/m3]
      Worked trap: pre=1.5, post=1.5, t=60, mass=5 -> flow 1.5, vol 90.0, conc 0.0556;
      pinned twa (next calc) 0.0070 whereas end-to-end rounding yields 0.0069.
    input_set: "the ANALYZED FieldSample, its PumpCalibration (pre/post flows), its LabResult mass_ug, its plan's volume_basis"
    precision: "r3 flow, r1 volume, r4 concentration, round_half_up at each step"
    variants:
      - name: MEAN_FLOW
        when: "plan.volume_basis == MEAN_FLOW (default; OSHA convention)"
        difference: "flow_used = mean of pre/post flows, rounded to 3dp before volume"
      - name: PRE_FLOW
        when: "plan.volume_basis == PRE_FLOW (method-specified conservative basis)"
        difference: "flow_used = pre_flow_lpm exactly as input (no averaging); e.g. pre 2.000/post 1.900, t=200, mass 25 -> MEAN_FLOW twa 0.0267 vs PRE_FLOW twa 0.0260"

  - name: sample_twa
    trigger: "immediately after air_volume_concentration on the same sample"
    algorithm: threshold
    formula: |
      FULL_SHIFT_MIN = 420.
      if duration_minutes >= FULL_SHIFT_MIN:
        sample_twa_mg_m3 = r4(concentration_mg_m3 * duration_minutes / 480)
      else (short sample):
        ZERO_FILL:   sample_twa_mg_m3 = r4(concentration_mg_m3 * duration_minutes / 480)   [unsampled time = 0 exposure]
        WORST_CASE:  sample_twa_mg_m3 = concentration_mg_m3                                 [whole shift at measured conc]
      Divergence example: conc 0.0833, t=120 -> ZERO_FILL 0.0208 vs WORST_CASE 0.0833.
    input_set: "the same FieldSample; variant chosen by plan.unsampled_time_rule"
    constants:
      FULL_SHIFT_MIN: 420
      SHIFT_BASIS_MIN: 480
    precision: "4 decimal places, round_half_up"
    variants:
      - name: ZERO_FILL
        when: "plan.unsampled_time_rule == ZERO_FILL (default; OSHA convention)"
        difference: "short samples diluted over the full 480-minute shift basis"
      - name: WORST_CASE
        when: "plan.unsampled_time_rule == WORST_CASE (screening campaigns)"
        difference: "short samples assigned the full measured concentration"

  - name: pump_drift
    trigger: "POST /ih/pump-calibrations/{id}/record-post"
    algorithm: threshold
    formula: |
      drift_pct = r2(abs(post_flow_lpm - pre_flow_lpm) / pre_flow_lpm * 100)
      result = INVALID iff drift_pct > 5.00, else VALID
      Boundary: drift_pct == 5.00 exactly -> VALID (strictly-greater rule).
    input_set: "the PumpCalibration row"
    constants:
      DRIFT_LIMIT_PCT: 5.00
    precision: "2 decimal places, round_half_up"

  - name: censored_substitution
    trigger: "POST /ih/exposure-assessments (at statistics input-set preparation)"
    algorithm: dual_variant_substitution
    formula: |
      Let E = plan's PERSONAL FieldSamples with status == ANALYZED (input set S).
      n = |E|; detects = count(s in E where s.is_detect).
      Rule selection (stored on assessment.substitution_rule):
        if n >= 3 AND detects / n >= 0.5  -> SQRT2
        else                              -> HALF
      For each non-detect sample s (is_detect == false):
        lod_twa_s   = r4( r4(lod_ug / air_volume_liters_s) * duration_minutes_s / 480 )
        x_s (SQRT2) = r4(lod_twa_s / sqrt(2))
        x_s (HALF)  = r4(lod_twa_s / 2)
      For detect samples: x_s = s.sample_twa_mg_m3 (the stored, rounded value).
      Statistics operate on the x_s values exactly as substituted/rounded here.
    input_set: "plan PERSONAL samples with status ANALYZED; excludes FIELD_BLANK and INVALIDATED"
    constants:
      DETECTION_RATIO_MIN: 0.5
      MIN_N_FOR_SQRT2: 3
    precision: "4 decimal places, round_half_up at each substitution step"
    variants:
      - name: SQRT2
        when: "detection ratio >= 0.5 and n >= 3 (lognormal assumption defensible)"
        difference: "non-detects enter at LOD-equivalent TWA / sqrt(2); e.g. lod_twa 0.0052 -> 0.0037"
      - name: HALF
        when: "detection ratio < 0.5 or n < 3 (simple substitution)"
        difference: "non-detects enter at LOD-equivalent TWA / 2; e.g. lod_twa 0.0052 -> 0.0026 (yields different GM/UCL)"

  - name: assessment_statistics
    trigger: "POST /ih/exposure-assessments (immediately after censored_substitution)"
    algorithm: weighted_scoring
    formula: |
      Input values x_1..x_n from censored_substitution (n = n_valid >= 1).
      TWA8 limits:
        y_i = ln(x_i);  ybar = mean(y_i);  s = sqrt( sum((y_i - ybar)^2) / (n - 1) )   [sample sd, n-1]
        df = min(n - 1, 10);  t = T95[df]
        UCL95 = exp(ybar + t * s / sqrt(n));  LCL95 = exp(ybar - t * s / sqrt(n))
        geo_mean = exp(ybar);  gsd = exp(s)
        Stored fields are r4(...) of each; CLASSIFICATION USES UNROUNDED values.
        Classification (L = limit.limit_mg_m3, A = L * limit.action_fraction), strict '>' throughout:
          1. LCL95 >  L  -> ABOVE_PEL          (statistically certain exceedance)
          2. UCL95 >  L  -> UNCERTAIN          (possible exceedance; mandatory re-sampling interval)
          3. UCL95 >  A  -> BELOW_PEL_MONITOR  (controlled, periodic monitoring)
          4. else        -> BELOW_ACTION
        Boundary: UCL95 == L exactly lands in rule 3/4, NOT UNCERTAIN; UCL95 == A exactly -> BELOW_ACTION.
        Edge: all x_i equal -> s = 0 -> UCL95 = LCL95 = GM (no division hazard).
        n == 1: s undefined; pin: treat s = 0 (UCL = LCL = GM).
      CEILING limits (limit_type == CEILING): no statistics; let cmax = max(concentration_mg_m3 over input set);
        geo_mean/gsd/ucl95/lcl95 = null; class = ABOVE_PEL iff cmax > L, BELOW_PEL_MONITOR iff A < cmax <= L, else BELOW_ACTION.
    input_set: "substituted x_s values for the plan (see censored_substitution)"
    constants:
      T95: { 1: 6.314, 2: 2.920, 3: 2.353, 4: 2.132, 5: 2.015, 6: 1.943, 7: 1.895, 8: 1.860, 9: 1.833, 10: 1.812 }
    precision: "store 4 decimal places round_half_up; classify on unrounded values"

  - name: required_sample_count
    trigger: "SamplingPlan creation; recomputed on PUT /ih/sampling-plans/{id} while DRAFT"
    algorithm: tiered_lookup
    formula: |
      inputs: H = SEG.headcount, P = SEG.current_class, purpose = plan.purpose
      if purpose == VERIFICATION: n = 3                      (flat; skips table AND adjustment)
      else:
        base = TABLE(H):
          H<=7 -> H | 8-9 -> 7 | 10 -> 8 | 11-12 -> 9 | 13-14 -> 10 | 15-17 -> 11 |
          18-20 -> 12 | 21-24 -> 13 | 25-29 -> 14 | 30-37 -> 15 | 38-49 -> 16 | H>=50 -> 17
        adj = +3 if P in {UNCERTAIN, ABOVE_PEL} else 0
        n = max(3, base + adj)
      Examples: H=3,P=NONE,INITIAL -> 3;  H=3,P=UNCERTAIN,FOLLOWUP -> 6;  H=25,VERIFICATION -> 3.
    input_set: "SEG headcount and current_class at computation time; plan purpose"
    constants:
      MIN_SAMPLES: 3
      FOLLOWUP_ADJUSTMENT: 3
      VERIFICATION_FLAT: 3
    precision: "integer"

  - name: reassessment_due_date
    trigger: "POST /ih/exposure-assessments/{id}/sign; POST /ih/control-recommendations/{id}/implement"
    algorithm: threshold
    formula: |
      On sign:    next_sample_due_date = date(signed_at) + RESAMPLE_INTERVAL_DAYS[exposure_class]
      On implement: candidate = date(now) + VERIFICATION_DUE_DAYS;
                    next_sample_due_date = min(existing next_sample_due_date, candidate)
                    (existing may be null -> candidate wins)
    input_set: "SEG row, assessment exposure_class, logical clock"
    constants:
      RESAMPLE_INTERVAL_DAYS: { ABOVE_PEL: 30, UNCERTAIN: 90, BELOW_PEL_MONITOR: 180, BELOW_ACTION: 360 }
      VERIFICATION_DUE_DAYS: 14
    precision: "whole days, ISO date"

  - name: notification_due_date
    trigger: "assessment sign (fan-out of EmployeeNotification PENDING per SEG member)"
    algorithm: chronological
    formula: |
      Working days are Monday-Friday (no holiday calendar).
      due_date = the date D such that exactly 15 working days fall in (signed_date, D],
      i.e. counting starts the calendar day AFTER signed_date and includes D.
      Example: signed Monday 2026-08-10 -> due Monday 2026-08-31.
      Sweep rule: PENDING -> OVERDUE when current_date > due_date (strictly greater).
    input_set: "assessment signed_at date"
    constants:
      NOTIFICATION_WORKING_DAYS: 15
    precision: "whole days, ISO date"

  - name: retention_until
    trigger: "assessment sign"
    algorithm: chronological
    formula: |
      retention_until = signed calendar date + site.retention_years calendar years (same month/day).
      Archive gate: current logical date >= retention_until (inclusive) AND legal_hold == false.
      Example: signed 2026-08-10, retention_years 30 -> retention_until 2056-08-10; archive allowed ON 2056-08-10.
    input_set: "assessment signed_at, site.retention_years"
    precision: "ISO date"

  - name: apf_adjusted_class
    trigger: "assessment sign, AFTER raw exposure_class is fixed (pinned evaluation order)"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER (pinned; breaks the apparent respirator-requirement loop):
        (1) compute raw statistics and exposure_class; (2) all regulatory behavior
            (SEG.current_class, next_sample_due_date, notifications, auto ABOVE_PEL control)
            keys off the RAW class; (3) only then compute adjusted_class.
      If at sign time the SEG has at least one ControlRecommendation on THIS assessment with
      control_type == PPE_RESPIRATOR and status in {ACCEPTED, IMPLEMENTED, VERIFIED}:
        F = that control's assigned_protection_factor (if several qualify, use the one with
            latest created_at; tie-break: never needed, creation is sequential)
        UCL' = r4(UCL95_unrounded / F); LCL' = r4(LCL95_unrounded / F)
        adjusted_class = classification(UCL', LCL') with the same thresholds as assessment_statistics
      Else adjusted_class = null.
      adjusted_class is informational only; it never changes SEG.current_class.
    input_set: "assessment stats, PPE controls of this assessment"
    precision: "4 decimal places, round_half_up after division"

  - name: plan_sample_accounting
    trigger: "FieldSample create / invalidate / ANALYZED transition"
    algorithm: aggregation
    formula: |
      active_sample_count   = count of the plan's PERSONAL samples with status in {COLLECTED, SEALED, ANALYZED}
      analyzed_valid_count  = count of the plan's PERSONAL samples with status == ANALYZED
      FIELD_BLANK samples never enter either counter.
      Invariant (compensating pair): manual/system invalidate (-1 active) followed by creating a
      replacement sample (+1 active) leaves active_sample_count unchanged.
    input_set: "FieldSample rows of the plan"
    precision: "integer"

  - name: seg_headcount
    trigger: "SEGMembership create; SEGMembership transfer"
    algorithm: aggregation
    formula: |
      seg.headcount = count of SEGMembership rows with seg_id == seg.id
      Transfer A->B: A.headcount -1 and B.headcount +1; the site-wide sum of headcounts is conserved.
    input_set: "SEGMembership rows"
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present (including conditional rules: PERSONAL sample requires employee_id+pump_id+pre_calibration_id and forbids them on FIELD_BLANK; PPE_RESPIRATOR control requires assigned_protection_factor and forbids it otherwise); enum values valid; numeric ranges respected; planned_end_date >= planned_start_date and window_end_date >= window_start_date"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: "all POST/PUT endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right), then body FK ids in declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ih/exposure-assessments; PUT /ih/sampling-plans/{id}"
    note: "Checked after existence, before any state or business rule"
  - priority: 6
    category: state
    check: "Target entity is in a state permitting the operation (plan transitions, sample seal/invalidate, calibration record-post, assessment review actions/archive, control actions, clearance decide, fit-test record-result, notification send/acknowledge)"
    error_id: "ERR_PLAN_INVALID_STATE | ERR_PLAN_NOT_OPEN_FOR_SAMPLING | ERR_PLAN_NOT_READY_FOR_ASSESSMENT | ERR_SAMPLE_INVALID_STATE | ERR_CALIBRATION_ALREADY_RECORDED | ERR_ASSESSMENT_INVALID_STATE | ERR_CONTROL_INVALID_STATE | ERR_CLEARANCE_INVALID_STATE | ERR_FIT_TEST_NOT_RECORDABLE | ERR_NOTIFICATION_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity coherence: sampled employee holds a SEGMembership in the plan's SEG (ERR_EMPLOYEE_NOT_SEG_MEMBER); calibration.pump_id == sample.pump_id (ERR_CALIBRATION_PUMP_MISMATCH); batch.analyte_code == plan's SEG analyte_code (ERR_ANALYTE_MISMATCH); fit test's medical_clearance_id belongs to the same employee (ERR_CLEARANCE_EMPLOYEE_MISMATCH)"
    error_id: "ERR_EMPLOYEE_NOT_SEG_MEMBER | ERR_CALIBRATION_PUMP_MISMATCH | ERR_ANALYTE_MISMATCH | ERR_CLEARANCE_EMPLOYEE_MISMATCH"
    http_status: 422
    applies_to: "POST /ih/field-samples; POST /ih/lab-results; POST /ih/fit-tests"
  - priority: 8
    category: business_safety
    check: "Segregation of duties and safety gates: plan approver != plan creator (ERR_SOD_PLAN_APPROVER); lab result enterer != sample collector (ERR_SOD_CHAIN_OF_CUSTODY); assessment signer != assessment preparer (ERR_SOD_ASSESSMENT_SIGNER); sample calibration result == VALID before lab result entry (ERR_CALIBRATION_NOT_VALID); linked clearance CLEARED and unexpired before fit-test result (ERR_MEDICAL_CLEARANCE_NOT_CURRENT); PPE_RESPIRATOR accept requires every SEG member fit-tested and cleared (ERR_FIT_TEST_MISSING_FOR_PPE); archive blocked by legal hold (ERR_LEGAL_HOLD_ACTIVE)"
    error_id: "ERR_SOD_PLAN_APPROVER | ERR_SOD_CHAIN_OF_CUSTODY | ERR_SOD_ASSESSMENT_SIGNER | ERR_CALIBRATION_NOT_VALID | ERR_MEDICAL_CLEARANCE_NOT_CURRENT | ERR_FIT_TEST_MISSING_FOR_PPE | ERR_LEGAL_HOLD_ACTIVE"
    http_status: 403
    applies_to: "approve / lab-results / sign / record-post-gated-result / fit-tests record-result / control accept / archive"
    note: "SoD errors are 403; calibration/clearance/fit gates are 422; legal hold is 409 (see errors table for exact codes)"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: sample collection_date within [planned_start_date, planned_end_date] inclusive (ERR_SAMPLE_OUTSIDE_PLAN_WINDOW); lab result current logical date within [window_start_date, window_end_date] INCLUSIVE both ends (ERR_BATCH_WINDOW_CLOSED); archive current date >= retention_until (ERR_RETENTION_NOT_MET)"
    error_id: "ERR_SAMPLE_OUTSIDE_PLAN_WINDOW | ERR_BATCH_WINDOW_CLOSED | ERR_RETENTION_NOT_MET"
    http_status: 422
    applies_to: "POST /ih/field-samples; POST /ih/lab-results; POST /ih/exposure-assessments/{id}/archive"
    note: "RETENTION_NOT_MET is 409; the two window errors are 422 (see errors table)"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and capacity: duplicate limit key (ERR_DUPLICATE_LIMIT); duplicate pump serial per site (ERR_DUPLICATE_PUMP_SERIAL); duplicate membership (ERR_DUPLICATE_MEMBERSHIP); pump half-open interval double-booking on the same collection_date (ERR_PUMP_DOUBLE_BOOKED); calibration already linked to another non-INVALIDATED sample (ERR_CALIBRATION_IN_USE); batch intake_count == max_capacity (ERR_BATCH_CAPACITY_FULL); batch contaminated (ERR_BATCH_NOT_ACCEPTING); one LabResult per sample (ERR_RESULT_ALREADY_EXISTS); at most one assessment with review_status in {DRAFT, UNDER_REVIEW} per SEG (ERR_ASSESSMENT_ALREADY_OPEN); complete-field count gate (ERR_INSUFFICIENT_VALID_SAMPLES)"
    error_id: "ERR_DUPLICATE_LIMIT | ERR_DUPLICATE_PUMP_SERIAL | ERR_DUPLICATE_MEMBERSHIP | ERR_PUMP_DOUBLE_BOOKED | ERR_CALIBRATION_IN_USE | ERR_BATCH_CAPACITY_FULL | ERR_BATCH_NOT_ACCEPTING | ERR_RESULT_ALREADY_EXISTS | ERR_ASSESSMENT_ALREADY_OPEN | ERR_INSUFFICIENT_VALID_SAMPLES"
    http_status: 409
    applies_to: "create/action endpoints as listed"

# =============================================================================
# 1.5 API Endpoint Table
# GET list endpoints additionally accept pagination params limit?/offset? per 1.0.
# =============================================================================
endpoints:
  # --- Sites ---
  - { method: POST, path: "/ih/sites", description: "Create a client site", roles: [FirmAdmin], code: 201, input: [name, industry_code, "retention_years?"], output: ClientSite, side_effects: [] }
  - { method: GET, path: "/ih/sites", description: "List sites", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["limit?", "offset?"], output: "ClientSite[]", side_effects: [] }
  - { method: GET, path: "/ih/sites/{id}", description: "Get a site", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: ClientSite, side_effects: [] }

  # --- Employees ---
  - { method: POST, path: "/ih/employees", description: "Register an employee at a site", roles: [FirmAdmin], code: 201, input: [site_id, full_name, external_ref, job_title], output: Employee, side_effects: [] }
  - { method: GET, path: "/ih/employees", description: "List employees (filterable by site)", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["site_id?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/ih/employees/{id}", description: "Get an employee", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: Employee, side_effects: [] }

  # --- Exposure limits ---
  - { method: POST, path: "/ih/exposure-limits", description: "Register a PEL/TLV limit; unique (analyte_code, basis, limit_type)", roles: [FirmAdmin], code: 201, input: [analyte_code, basis, limit_type, limit_mg_m3, "action_fraction?"], output: ExposureLimit, side_effects: [] }
  - { method: GET, path: "/ih/exposure-limits", description: "List limits", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["analyte_code?", "limit?", "offset?"], output: "ExposureLimit[]", side_effects: [] }
  - { method: GET, path: "/ih/exposure-limits/{id}", description: "Get a limit", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: ExposureLimit, side_effects: [] }

  # --- Pumps ---
  - { method: POST, path: "/ih/pumps", description: "Register a sampling pump; serial unique per site", roles: [FirmAdmin], code: 201, input: [site_id, serial_number], output: Pump, side_effects: [] }
  - { method: GET, path: "/ih/pumps", description: "List pumps", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["site_id?", "limit?", "offset?"], output: "Pump[]", side_effects: [] }
  - { method: GET, path: "/ih/pumps/{id}", description: "Get a pump", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: Pump, side_effects: [] }

  # --- SEGs ---
  - { method: POST, path: "/ih/segs", description: "Define a similar-exposure group; analyte_code must equal the linked limit's analyte_code", roles: [IndustrialHygienist], code: 201, input: [site_id, name, analyte_code, exposure_limit_id, task_description], output: SimilarExposureGroup, side_effects: ["headcount = 0; current_class = NONE"] }
  - { method: GET, path: "/ih/segs", description: "List SEGs", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["site_id?", "exposure_limit_id?", "limit?", "offset?"], output: "SimilarExposureGroup[]", side_effects: [] }
  - { method: GET, path: "/ih/segs/{id}", description: "Get a SEG (headcount, current_class, next_sample_due_date, version)", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: SimilarExposureGroup, side_effects: [] }

  # --- SEG memberships ---
  - { method: POST, path: "/ih/seg-memberships", description: "Add an employee to a SEG", roles: [IndustrialHygienist], code: 201, input: [seg_id, employee_id, "is_primary?"], output: SEGMembership, side_effects: ["seg.headcount += 1; seg.version += 1"] }
  - { method: GET, path: "/ih/seg-memberships", description: "List memberships", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["seg_id?", "employee_id?", "limit?", "offset?"], output: "SEGMembership[]", side_effects: [] }
  - { method: GET, path: "/ih/seg-memberships/{id}", description: "Get a membership", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: SEGMembership, side_effects: [] }
  - { method: POST, path: "/ih/seg-memberships/{id}/transfer", description: "Move the membership to another SEG of the same site", roles: [IndustrialHygienist], code: 200, input: [target_seg_id], output: SEGMembership, side_effects: ["old seg.headcount -= 1 and version += 1; new seg.headcount += 1 and version += 1; membership.version += 1; target SEG must belong to the same site (else ERR_INVALID_REQUEST)"] }

  # --- Sampling plans ---
  - { method: POST, path: "/ih/sampling-plans", description: "Create a sampling plan (DRAFT); required_sample_count computed from SEG headcount/current_class and purpose", roles: [IndustrialHygienist], code: 201, input: [seg_id, purpose, planned_start_date, planned_end_date, "unsampled_time_rule?", "volume_basis?"], output: SamplingPlan, side_effects: ["required_sample_count computed; created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/ih/sampling-plans", description: "List plans", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["seg_id?", "limit?", "offset?"], output: "SamplingPlan[]", side_effects: [] }
  - { method: GET, path: "/ih/sampling-plans/{id}", description: "Get a plan", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: SamplingPlan, side_effects: [] }
  - { method: PUT, path: "/ih/sampling-plans/{id}", description: "Revise a DRAFT plan (OCC-guarded); recomputes required_sample_count", roles: [IndustrialHygienist], code: 200, input: ["planned_start_date?", "planned_end_date?", "unsampled_time_rule?", "volume_basis?", expected_plan_version], output: SamplingPlan, side_effects: ["increments SamplingPlan.version by 1", "required_sample_count recomputed"] }
  - { method: POST, path: "/ih/sampling-plans/{id}/submit", description: "DRAFT -> PENDING_APPROVAL", roles: [IndustrialHygienist], code: 200, input: [], output: SamplingPlan, side_effects: ["increments SamplingPlan.version by 1"] }
  - { method: POST, path: "/ih/sampling-plans/{id}/approve", description: "PENDING_APPROVAL -> APPROVED; approver must differ from creator (SoD)", roles: [CIHDirector], code: 200, input: [], output: SamplingPlan, side_effects: ["increments SamplingPlan.version by 1"] }
  - { method: POST, path: "/ih/sampling-plans/{id}/reject", description: "PENDING_APPROVAL -> DRAFT (revision loop)", roles: [CIHDirector], code: 200, input: [], output: SamplingPlan, side_effects: ["increments SamplingPlan.version by 1"] }
  - { method: POST, path: "/ih/sampling-plans/{id}/complete-field", description: "APPROVED -> FIELD_COMPLETE when active_sample_count >= required_sample_count", roles: [IndustrialHygienist], code: 200, input: [], output: SamplingPlan, side_effects: ["increments SamplingPlan.version by 1"] }

  # --- Pump calibrations ---
  - { method: POST, path: "/ih/pump-calibrations", description: "Record pre-sampling flow (PENDING)", roles: [FieldTechnician], code: 201, input: [pump_id, pre_flow_lpm], output: PumpCalibration, side_effects: ["performed_by_user_id = X-User-ID"] }
  - { method: GET, path: "/ih/pump-calibrations", description: "List calibrations", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["pump_id?", "limit?", "offset?"], output: "PumpCalibration[]", side_effects: [] }
  - { method: GET, path: "/ih/pump-calibrations/{id}", description: "Get a calibration", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: PumpCalibration, side_effects: [] }
  - { method: POST, path: "/ih/pump-calibrations/{id}/record-post", description: "Record post-sampling flow; computes drift_pct; INVALID iff drift > 5.00; INVALID cascades sample invalidation", roles: [FieldTechnician], code: 200, input: [post_flow_lpm], output: PumpCalibration, side_effects: ["drift_pct computed; result VALID|INVALID", "if INVALID: linked sample -> INVALIDATED (PUMP_DRIFT) and plan may regress"] }

  # --- Field samples ---
  - { method: POST, path: "/ih/field-samples", description: "Log a collected sample against an APPROVED plan; PERSONAL requires employee+pump+calibration; pump half-open interval conflict rejected", roles: [FieldTechnician], code: 201, input: [sampling_plan_id, sample_type, "employee_id?", "pump_id?", "pre_calibration_id?", collection_date, start_minute, duration_minutes], output: FieldSample, side_effects: ["status = COLLECTED; collected_by_user_id = X-User-ID", "PERSONAL: plan.active_sample_count += 1; calibration.linked_sample_id set; plan.version unchanged"] }
  - { method: GET, path: "/ih/field-samples", description: "List samples", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["sampling_plan_id?", "employee_id?", "pump_id?", "pre_calibration_id?", "limit?", "offset?"], output: "FieldSample[]", side_effects: [] }
  - { method: GET, path: "/ih/field-samples/{id}", description: "Get a sample", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: FieldSample, side_effects: [] }
  - { method: POST, path: "/ih/field-samples/{id}/seal", description: "COLLECTED -> SEALED (chain of custody)", roles: [FieldTechnician], code: 200, input: [], output: FieldSample, side_effects: ["increments FieldSample.version by 1"] }
  - { method: POST, path: "/ih/field-samples/{id}/invalidate", description: "Manual invalidate from COLLECTED/SEALED; recomputes plan counts and may regress plan", roles: [IndustrialHygienist], code: 200, input: ["reason?"], output: FieldSample, side_effects: ["invalidate_reason = MANUAL", "plan counts recomputed; plan regresses to APPROVED if below required"] }

  # --- Lab batches & results ---
  - { method: POST, path: "/ih/lab-batches", description: "Open a lab analysis batch with LOD/LOQ and an inclusive intake window", roles: [LabAnalyst], code: 201, input: [site_id, analyte_code, lod_ug, loq_ug, window_start_date, window_end_date, max_capacity], output: LabBatch, side_effects: [] }
  - { method: GET, path: "/ih/lab-batches", description: "List batches", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["site_id?", "limit?", "offset?"], output: "LabBatch[]", side_effects: [] }
  - { method: GET, path: "/ih/lab-batches/{id}", description: "Get a batch", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: LabBatch, side_effects: [] }
  - { method: POST, path: "/ih/lab-results", description: "Enter a lab result; sample SEALED -> ANALYZED; computes volume/concentration/TWA; contaminated blank triggers cascade; plan may auto-advance to LAB_COMPLETE", roles: [LabAnalyst], code: 201, input: [field_sample_id, lab_batch_id, mass_ug], output: LabResult, side_effects: ["sample -> ANALYZED; computed fields stored", "batch.intake_count += 1", "if sample_type == FIELD_BLANK and mass_ug >= batch.lod_ug: batch.contaminated = true; all sibling ANALYZED samples in the batch -> INVALIDATED (BLANK_CONTAMINATION); affected plans may regress LAB_COMPLETE -> APPROVED and their DRAFT/UNDER_REVIEW assessments -> VOID", "if plan complete: plan FIELD_COMPLETE -> LAB_COMPLETE"] }
  - { method: GET, path: "/ih/lab-results", description: "List lab results", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["field_sample_id?", "lab_batch_id?", "limit?", "offset?"], output: "LabResult[]", side_effects: [] }
  - { method: GET, path: "/ih/lab-results/{id}", description: "Get a lab result", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: LabResult, side_effects: [] }

  # --- Exposure assessments ---
  - { method: POST, path: "/ih/exposure-assessments", description: "Create an assessment for a LAB_COMPLETE plan (else ERR_PLAN_NOT_READY_FOR_ASSESSMENT; OCC-guarded on SEG.version); supersedes the SEG's current SIGNED assessment; computes substitution rule, statistics, exposure_class", roles: [IndustrialHygienist], code: 201, input: [sampling_plan_id, expected_seg_version], output: ExposureAssessment, side_effects: ["increments SimilarExposureGroup.version by 1", "prior SIGNED current assessment -> SUPERSEDED", "stats computed per assessment_statistics; review_status = DRAFT; prepared_by_user_id = X-User-ID"] }
  - { method: GET, path: "/ih/exposure-assessments", description: "List assessments; archived excluded unless include_archived=true", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["seg_id?", "sampling_plan_id?", "supersedes_assessment_id?", "include_archived?", "limit?", "offset?"], output: "ExposureAssessment[]", side_effects: [] }
  - { method: GET, path: "/ih/exposure-assessments/{id}", description: "Get an assessment (archived still retrievable by id)", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: ExposureAssessment, side_effects: [] }
  - { method: POST, path: "/ih/exposure-assessments/{id}/submit-review", description: "DRAFT -> UNDER_REVIEW", roles: [IndustrialHygienist], code: 200, input: [], output: ExposureAssessment, side_effects: ["increments ExposureAssessment.version by 1"] }
  - { method: POST, path: "/ih/exposure-assessments/{id}/sign", description: "UNDER_REVIEW -> SIGNED; signer != preparer (SoD); fires SEG class/due-date update, notification fan-out, ABOVE_PEL auto-control, adjusted_class", roles: [CIHDirector], code: 200, input: [], output: ExposureAssessment, side_effects: ["see state machine sign transition", "increments ExposureAssessment.version by 1 and SimilarExposureGroup.version by 1"] }
  - { method: POST, path: "/ih/exposure-assessments/{id}/reject-review", description: "UNDER_REVIEW -> DRAFT (review loop; class unchanged)", roles: [CIHDirector], code: 200, input: [], output: ExposureAssessment, side_effects: ["increments ExposureAssessment.version by 1"] }
  - { method: PUT, path: "/ih/exposure-assessments/{id}", description: "Toggle legal_hold (CIH only)", roles: [CIHDirector], code: 200, input: [legal_hold], output: ExposureAssessment, side_effects: ["increments ExposureAssessment.version by 1"] }
  - { method: POST, path: "/ih/exposure-assessments/{id}/archive", description: "SIGNED|SUPERSEDED -> ARCHIVED when current date >= retention_until and no legal hold", roles: [FirmAdmin], code: 200, input: [], output: ExposureAssessment, side_effects: ["is_current = false; excluded from default list"] }

  # --- Control recommendations ---
  - { method: POST, path: "/ih/control-recommendations", description: "Propose a control on an assessment; assigned_protection_factor required iff PPE_RESPIRATOR", roles: [IndustrialHygienist], code: 201, input: [exposure_assessment_id, control_type, description, priority, "assigned_protection_factor?"], output: ControlRecommendation, side_effects: [] }
  - { method: GET, path: "/ih/control-recommendations", description: "List controls", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["exposure_assessment_id?", "verification_plan_id?", "limit?", "offset?"], output: "ControlRecommendation[]", side_effects: [] }
  - { method: GET, path: "/ih/control-recommendations/{id}", description: "Get a control", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: ControlRecommendation, side_effects: [] }
  - { method: POST, path: "/ih/control-recommendations/{id}/accept", description: "PROPOSED -> ACCEPTED; PPE type requires every SEG member fit-tested and medically cleared", roles: [SiteSafetyManager], code: 200, input: [], output: ControlRecommendation, side_effects: ["increments ControlRecommendation.version by 1"] }
  - { method: POST, path: "/ih/control-recommendations/{id}/reject", description: "PROPOSED -> REJECTED", roles: [SiteSafetyManager], code: 200, input: [], output: ControlRecommendation, side_effects: ["increments ControlRecommendation.version by 1"] }
  - { method: POST, path: "/ih/control-recommendations/{id}/implement", description: "ACCEPTED -> IMPLEMENTED; requires parent assessment SIGNED; spawns verification plan and pulls SEG.next_sample_due_date forward", roles: [SiteSafetyManager], code: 200, input: [], output: ControlRecommendation, side_effects: ["verification SamplingPlan auto-created (VERIFICATION, DRAFT, required 3)", "SEG.next_sample_due_date = min(existing, now + 14d); SEG.version += 1"] }
  - { method: POST, path: "/ih/control-recommendations/{id}/verify", description: "IMPLEMENTED -> VERIFIED when the verification plan has a current SIGNED assessment with a clean class", roles: [CIHDirector], code: 200, input: [], output: ControlRecommendation, side_effects: ["increments ControlRecommendation.version by 1"] }

  # --- Medical clearances ---
  - { method: POST, path: "/ih/medical-clearances", description: "Request a medical clearance (REQUESTED)", roles: [SiteSafetyManager], code: 201, input: [employee_id], output: MedicalClearance, side_effects: [] }
  - { method: GET, path: "/ih/medical-clearances", description: "List clearances", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["employee_id?", "limit?", "offset?"], output: "MedicalClearance[]", side_effects: [] }
  - { method: GET, path: "/ih/medical-clearances/{id}", description: "Get a clearance", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: MedicalClearance, side_effects: [] }
  - { method: POST, path: "/ih/medical-clearances/{id}/decide", description: "REQUESTED -> CLEARED | DENIED", roles: [CIHDirector], code: 200, input: [decision], output: MedicalClearance, side_effects: ["if CLEARED: expiry_date = date(now) + 365 days"] }

  # --- Respirator fit tests ---
  - { method: POST, path: "/ih/fit-tests", description: "Schedule a fit test against a specific medical clearance (same employee)", roles: [SiteSafetyManager], code: 201, input: [employee_id, medical_clearance_id, respirator_model, test_date], output: RespiratorFitTest, side_effects: ["expiry_date = test_date + 365 days"] }
  - { method: GET, path: "/ih/fit-tests", description: "List fit tests", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["employee_id?", "medical_clearance_id?", "limit?", "offset?"], output: "RespiratorFitTest[]", side_effects: [] }
  - { method: GET, path: "/ih/fit-tests/{id}", description: "Get a fit test", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: RespiratorFitTest, side_effects: [] }
  - { method: POST, path: "/ih/fit-tests/{id}/record-result", description: "SCHEDULED -> PASSED | FAILED; requires linked clearance CLEARED and unexpired", roles: [FieldTechnician], code: 200, input: [result], output: RespiratorFitTest, side_effects: ["recorded_by_user_id = X-User-ID"] }

  # --- Employee notifications ---
  - { method: GET, path: "/ih/notifications", description: "List notifications", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: ["employee_id?", "exposure_assessment_id?", "limit?", "offset?"], output: "EmployeeNotification[]", side_effects: [] }
  - { method: GET, path: "/ih/notifications/{id}", description: "Get a notification", roles: [FirmAdmin, IndustrialHygienist, CIHDirector, FieldTechnician, LabAnalyst, SiteSafetyManager, Employee], code: 200, input: [], output: EmployeeNotification, side_effects: [] }
  - { method: POST, path: "/ih/notifications/{id}/send", description: "PENDING|OVERDUE -> SENT", roles: [IndustrialHygienist, SiteSafetyManager], code: 200, input: [], output: EmployeeNotification, side_effects: ["sent_at/sent_by_user_id set; increments EmployeeNotification.version by 1"] }
  - { method: POST, path: "/ih/notifications/{id}/acknowledge", description: "SENT -> ACKNOWLEDGED; only the addressed employee (X-User-ID == employee_id)", roles: [Employee], code: 200, input: [], output: EmployeeNotification, side_effects: ["acknowledged_at set; increments EmployeeNotification.version by 1"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/ih/_clock/set_current_utc", description: "Set the logical clock. STARTUP DEFAULT: 2026-08-01T00:00:00Z; the server never falls back to wall-clock. Setting the clock sweeps: clearances CLEARED->EXPIRED (date > expiry_date) cascading to fit tests PASSED->EXPIRED; fit tests PASSED->EXPIRED on own expiry; notifications PENDING->OVERDUE (date > due_date)", roles: [FirmAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["clock sweeps as described"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, violated conditional-required rule (PERSONAL vs FIELD_BLANK fields; PPE APF), invalid enum value, or out-of-range numeric" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end date precedes start date on plan window or batch window" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Plan transition attempted from a state where it is not defined; also gates lab-result entry (plan must be FIELD_COMPLETE)" }
  - { id: ERR_PLAN_NOT_OPEN_FOR_SAMPLING, http: 409, condition: "Field sample creation requires plan.status == APPROVED" }
  - { id: ERR_SAMPLE_INVALID_STATE, http: 409, condition: "Seal/invalidate/result attempted from a sample state where it is not defined (result requires SEALED; manual invalidate requires COLLECTED or SEALED)" }
  - { id: ERR_CALIBRATION_ALREADY_RECORDED, http: 409, condition: "record-post on a calibration whose result is already VALID or INVALID" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "Assessment review/archive action attempted from a review_status where it is not defined" }
  - { id: ERR_ASSESSMENT_ALREADY_OPEN, http: 409, condition: "An assessment with review_status DRAFT or UNDER_REVIEW already exists for the SEG" }
  - { id: ERR_PLAN_NOT_READY_FOR_ASSESSMENT, http: 409, condition: "Assessment creation requires the plan to be LAB_COMPLETE" }
  - { id: ERR_ASSESSMENT_NOT_SIGNED, http: 409, condition: "Control implement requires the parent assessment to be SIGNED" }
  - { id: ERR_CONTROL_INVALID_STATE, http: 409, condition: "Control action attempted from a status where it is not defined" }
  - { id: ERR_VERIFICATION_NOT_CLEAN, http: 409, condition: "Control verify requires the verification plan to hold a current SIGNED assessment whose exposure_class is in {BELOW_ACTION, BELOW_PEL_MONITOR}" }
  - { id: ERR_CLEARANCE_INVALID_STATE, http: 409, condition: "Decide attempted on a clearance not in REQUESTED" }
  - { id: ERR_FIT_TEST_NOT_RECORDABLE, http: 409, condition: "record-result on a fit test not in SCHEDULED" }
  - { id: ERR_NOTIFICATION_INVALID_STATE, http: 409, condition: "Send requires PENDING or OVERDUE; acknowledge requires SENT" }
  - { id: ERR_EMPLOYEE_NOT_SEG_MEMBER, http: 422, condition: "Sampled employee holds no SEGMembership in the plan's SEG" }
  - { id: ERR_CALIBRATION_PUMP_MISMATCH, http: 422, condition: "pre_calibration_id references a calibration whose pump_id differs from the sample's pump_id" }
  - { id: ERR_ANALYTE_MISMATCH, http: 422, condition: "Lab batch analyte_code differs from the plan's SEG analyte_code; also SEG analyte vs its ExposureLimit analyte at SEG creation" }
  - { id: ERR_CLEARANCE_EMPLOYEE_MISMATCH, http: 422, condition: "Fit test's medical_clearance_id belongs to a different employee" }
  - { id: ERR_SOD_PLAN_APPROVER, http: 403, condition: "Plan approver X-User-ID equals plan.created_by_user_id" }
  - { id: ERR_SOD_CHAIN_OF_CUSTODY, http: 403, condition: "Lab result enterer X-User-ID equals sample.collected_by_user_id" }
  - { id: ERR_SOD_ASSESSMENT_SIGNER, http: 403, condition: "Assessment signer X-User-ID equals assessment.prepared_by_user_id" }
  - { id: ERR_CALIBRATION_NOT_VALID, http: 409, condition: "Lab result entry requires the sample's calibration result == VALID (post-flow recorded, drift within limit)" }
  - { id: ERR_MEDICAL_CLEARANCE_NOT_CURRENT, http: 422, condition: "Linked clearance is not CLEARED or current logical date is past clearance.expiry_date" }
  - { id: ERR_FIT_TEST_MISSING_FOR_PPE, http: 422, condition: "PPE_RESPIRATOR accept: at least one SEG member lacks a current PASSED fit test or a current CLEARED clearance" }
  - { id: ERR_LEGAL_HOLD_ACTIVE, http: 409, condition: "Archive attempted while assessment.legal_hold is true" }
  - { id: ERR_SAMPLE_OUTSIDE_PLAN_WINDOW, http: 422, condition: "collection_date outside [planned_start_date, planned_end_date] inclusive" }
  - { id: ERR_BATCH_WINDOW_CLOSED, http: 422, condition: "Current logical date outside batch [window_start_date, window_end_date] inclusive" }
  - { id: ERR_RETENTION_NOT_MET, http: 409, condition: "Archive attempted before retention_until" }
  - { id: ERR_DUPLICATE_LIMIT, http: 409, condition: "ExposureLimit with same (analyte_code, basis, limit_type) exists" }
  - { id: ERR_DUPLICATE_PUMP_SERIAL, http: 409, condition: "Pump serial_number already registered at the site" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "SEGMembership with same (seg_id, employee_id) exists" }
  - { id: ERR_PUMP_DOUBLE_BOOKED, http: 409, condition: "Pump already assigned to a non-INVALIDATED sample on the same collection_date with overlapping half-open interval [start_minute, start_minute+duration_minutes); touching endpoints allowed" }
  - { id: ERR_CALIBRATION_IN_USE, http: 409, condition: "pre_calibration_id already linked to another non-INVALIDATED sample" }
  - { id: ERR_BATCH_CAPACITY_FULL, http: 409, condition: "Lab batch intake_count == max_capacity" }
  - { id: ERR_BATCH_NOT_ACCEPTING, http: 409, condition: "Lab batch is contaminated (intake closed)" }
  - { id: ERR_RESULT_ALREADY_EXISTS, http: 409, condition: "Sample already has a LabResult" }
  - { id: ERR_INSUFFICIENT_VALID_SAMPLES, http: 409, condition: "complete-field requires active_sample_count >= required_sample_count" }
  - { id: ERR_ACK_FORBIDDEN, http: 403, condition: "Notification acknowledge by an X-User-ID other than the addressed employee" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "CIH firm administrator; owns reference data (sites, employees, limits, pumps) and record retention archival"
    identity: opaque
    exclusive_operations:
      - "POST /ih/sites"
      - "POST /ih/employees"
      - "POST /ih/exposure-limits"
      - "POST /ih/pumps"
      - "POST /ih/exposure-assessments/{id}/archive"
      - "POST /ih/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: IndustrialHygienist
    description: "IH staff; defines SEGs and memberships, owns sampling plans, prepares assessments, proposes controls, sends notifications"
    identity: opaque
    exclusive_operations:
      - "POST /ih/segs"
      - "POST /ih/seg-memberships"
      - "POST /ih/seg-memberships/{id}/transfer"
      - "POST /ih/sampling-plans"
      - "PUT /ih/sampling-plans/{id}"
      - "POST /ih/sampling-plans/{id}/submit"
      - "POST /ih/sampling-plans/{id}/complete-field"
      - "POST /ih/field-samples/{id}/invalidate"
      - "POST /ih/exposure-assessments"
      - "POST /ih/exposure-assessments/{id}/submit-review"
      - "POST /ih/control-recommendations"
    shared_operations: ["POST /ih/notifications/{id}/send (shared with SiteSafetyManager)", "all GET endpoints"]
  - name: CIHDirector
    description: "Certified industrial hygienist; approves plans, signs assessments, decides clearances, verifies controls, holds legal-hold power"
    identity: opaque
    exclusive_operations:
      - "POST /ih/sampling-plans/{id}/approve"
      - "POST /ih/sampling-plans/{id}/reject"
      - "POST /ih/exposure-assessments/{id}/sign"
      - "POST /ih/exposure-assessments/{id}/reject-review"
      - "PUT /ih/exposure-assessments/{id}"
      - "POST /ih/control-recommendations/{id}/verify"
      - "POST /ih/medical-clearances/{id}/decide"
    shared_operations: ["all GET endpoints"]
  - name: FieldTechnician
    description: "Field sampling technician; calibrates pumps, collects and seals samples, records fit-test results"
    identity: opaque
    exclusive_operations:
      - "POST /ih/pump-calibrations"
      - "POST /ih/pump-calibrations/{id}/record-post"
      - "POST /ih/field-samples"
      - "POST /ih/field-samples/{id}/seal"
      - "POST /ih/fit-tests/{id}/record-result"
    shared_operations: ["all GET endpoints"]
  - name: LabAnalyst
    description: "Laboratory analyst; opens analysis batches and enters results (never for samples they collected)"
    identity: opaque
    exclusive_operations:
      - "POST /ih/lab-batches"
      - "POST /ih/lab-results"
    shared_operations: ["all GET endpoints"]
  - name: SiteSafetyManager
    description: "Client-side safety manager; accepts/implements controls, requests clearances, schedules fit tests, sends notifications"
    identity: opaque
    exclusive_operations:
      - "POST /ih/control-recommendations/{id}/accept"
      - "POST /ih/control-recommendations/{id}/reject"
      - "POST /ih/control-recommendations/{id}/implement"
      - "POST /ih/medical-clearances"
      - "POST /ih/fit-tests"
    shared_operations: ["POST /ih/notifications/{id}/send (shared with IndustrialHygienist)", "all GET endpoints"]
  - name: Employee
    description: "Monitored worker; acknowledges own exposure notifications (X-User-ID must equal the notification's employee_id)"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /ih/notifications/{id}/acknowledge"
    shared_operations: ["all GET endpoints"]
