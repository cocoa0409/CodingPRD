      - name: record_decision_rejected_missing_reason_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "outcome REJECTED without rejection_reason fails the conditional requirement (ERR_INVALID_REQUEST 400) before the state transition is applied."
        test_recipe:
