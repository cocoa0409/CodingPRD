# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over claim-extraction-guide sections; complements §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_returns_all_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with full_name/phone/email returns 201 with id, created_at, version=1 and the three input fields echoed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Cora Cust", phone: "555-100", email: "cora@x.com" }
              as: ServiceAdvisor
              captures: { cid: $.data.id, cver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Customer.full_name == 'Cora Cust'"
            - "Customer.version == 1; Customer.id is a server-minted UUID"

      - name: vehicle_missing_required_vin_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Vehicle.fields.vin, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /vehicles omitting required vin -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Vi Owner", phone: "555-101", email: "vi@x.com" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", make: "Ford", model: "Focus", model_year: 2015, odometer_miles: 10000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: vehicle_duplicate_vin_returns_error
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.vin, "errors[ERR_DUPLICATE_VIN]"]
        distinguishing_aspect: "Creating a second vehicle with an existing vin -> ERR_DUPLICATE_VIN (409)."
        test_recipe:
          setup: ["a customer and a vehicle with vin DUPVIN already exist"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Du Owner", phone: "555-102", email: "du@x.com" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "DUPVIN", make: "Ford", model: "Edge", model_year: 2016, odometer_miles: 12000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "DUPVIN", make: "Ford", model: "Edge", model_year: 2017, odometer_miles: 13000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_VIN"
            - "HTTP status == 409"

      - name: repair_order_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.RepairOrder, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /repair-orders/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /repair-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: technician_skill_level_default_b_applied
        claim_type: Defaults
        grounds: [entities.Technician.fields.skill_level]
        distinguishing_aspect: "POST /technicians without skill_level defaults skill_level to 'B'."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /technicians"
              payload: { full_name: "Def Tech" }
              as: ShopManager
              captures: { tid: $.data.id, lvl: $.data.skill_level }
          assert:
            - "Technician.skill_level == 'B'"

      - name: labor_line_book_hours_is_snapshot_computed_not_input
        claim_type: Computed Fields
        grounds: [entities.LaborLine.fields.book_hours, calculations.labor_charge]
        distinguishing_aspect: "LaborLine.book_hours is snapshotted from LaborOperation (3.0), not client-supplied; book_hours is not an accepted input field."
        test_recipe:
          setup: ["op SNAP book_hours=3.0; customer+vehicle+RO ESTIMATE"]
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "SNAP", description: "Brake job", book_hours: 3.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Sn Owner", phone: "555-103", email: "sn@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINSNAP", make: "Mini", model: "Cooper", model_year: 2014, odometer_miles: 22000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}" }
              as: ShopManager
              captures: { ll_id: $.data.id, bh: $.data.book_hours }
          assert:
            - "LaborLine.${ll_id}.book_hours == 3.0 (snapshotted from operation)"

      - name: repair_order_list_paginated_envelope
        claim_type: Listing
        grounds: [entities.RepairOrder, endpoints]
        distinguishing_aspect: "GET /repair-orders returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["one customer, one vehicle, one RO"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Li Owner", phone: "555-104", email: "li@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINLIST", make: "Acura", model: "TLX", model_year: 2019, odometer_miles: 33000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
          trigger:
            - call: "GET /repair-orders"
              payload: { customer_id: "${cid}" }
              as: ShopManager
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == array; meta.api_request_id present"
            - "data contains the RO; total_count >= 1; has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: transition_start_from_estimate_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairOrder.APPROVED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "START requires APPROVED; issuing START on an ESTIMATE RO -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a customer+vehicle+RO in ESTIMATE"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "St Owner", phone: "555-105", email: "st@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINSTRT", make: "Lexus", model: "ES", model_year: 2018, odometer_miles: 44000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "START" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "RepairOrder.${ro_id}.status == ESTIMATE (unchanged)"

      - name: inspection_review_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Inspection.SUBMITTED_to_REVIEWED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVIEW requires SUBMITTED; reviewing a DRAFT inspection -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["RO + DRAFT inspection (no submit)"]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "In Tech" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Iv Owner", phone: "555-106", email: "iv@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VININSP", make: "Mazda", model: "CX5", model_year: 2020, odometer_miles: 8000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/inspections"
              payload: { technician_id: "${tid}" }
              as: Technician
              as_user_id: "${tid}"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/review"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Inspection.${insp_id}.status == DRAFT (unchanged)"

      - name: inspection_submit_empty_returns_inspection_empty
        claim_type: precondition_enforcement
        grounds: [state_machines.Inspection.DRAFT_to_SUBMITTED, "errors[ERR_INSPECTION_EMPTY]"]
        distinguishing_aspect: "Submitting a DRAFT inspection with zero items -> ERR_INSPECTION_EMPTY (409)."
        test_recipe:
          setup: ["RO + DRAFT inspection with no items"]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Em Tech" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ep Owner", phone: "555-107", email: "ep@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINEMPT", make: "Kia", model: "Soul", model_year: 2021, odometer_miles: 3000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/inspections"
              payload: { technician_id: "${tid}" }
              as: Technician
              as_user_id: "${tid}"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTION_EMPTY"

      - name: core_charge_return_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.CoreCharge.CHARGED_to_CORE_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CoreCharge already CORE_RETURNED rejects a second return with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["RO with a cored part -> CoreCharge CHARGED; first return succeeds (CORE_RETURNED)"]
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Co Owner", phone: "555-108", email: "co@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINCORE", make: "Ram", model: "1500", model_year: 2019, odometer_miles: 55000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "CR-1", description: "Alt", quantity: 1, unit_cost_cents: 8000, markup_mode: "FLAT_BRACKET", has_core: true, core_deposit_cents: 5000 }
              as: PartsManager
            - call: "GET /core-charges"
              payload: { repair_order_id: "${ro_id}" }
              as: PartsManager
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /core-charges/${cc_id}/return"
              payload: {}
              as: PartsManager
          trigger:
            - call: "POST /core-charges/${cc_id}/return"
              payload: {}
              as: PartsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (already CORE_RETURNED)"

      - name: repair_order_initial_state_is_estimate
        claim_type: initial_state
        grounds: [state_machines.RepairOrder, entities.RepairOrder.fields.status]
        distinguishing_aspect: "A newly created RepairOrder starts in status ESTIMATE with zeroed computed totals."
        test_recipe:
          setup: ["a customer + vehicle"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Is Owner", phone: "555-109", email: "is@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VININIT", make: "Honda", model: "CRV", model_year: 2022, odometer_miles: 1000 }
              as: ShopManager
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id, st: $.data.status, gt: $.data.grand_total_cents }
          assert:
            - "RepairOrder.${ro_id}.status == ESTIMATE"
            - "RepairOrder.${ro_id}.grand_total_cents == 0; version == 1"

      - name: labor_line_complete_with_open_session_returns_open_time_entry
        claim_type: precondition_enforcement
        grounds: [state_machines.LaborLine.IN_PROGRESS_to_COMPLETED, "errors[ERR_OPEN_TIME_ENTRY]"]
        distinguishing_aspect: "Completing a labor line while its clock session is still open -> ERR_OPEN_TIME_ENTRY (409)."
        test_recipe:
          setup: ["RO started; labor line clocked in (open session), not clocked out"]
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "OPN", description: "Tune", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Op Tech" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Op Owner", phone: "555-110", email: "op@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINOPEN", make: "Buick", model: "Encore", model_year: 2017, odometer_miles: 60000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-OPN" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id, ro_v0: $.data.version }
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}", technician_id: "${tid}" }
              as: ShopManager
              captures: { ll_id: $.data.id }
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { ro_id_ver1: $.data.version }
            - call: "POST /repair-orders/${ro_id}/authorize"
              payload: { expected_repair_order_version: "${ro_id_ver1}" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /repair-orders/${ro_id}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-06-09T08:00:00Z", scheduled_end: "2026-06-09T12:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "START" }
              as: ShopManager
            - call: "POST /labor-lines/${ll_id}/clock-in"
              payload: { technician_id: "${tid}", clock_in: "2026-06-09T09:00:00Z" }
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /labor-lines/${ll_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_TIME_ENTRY"
            - "LaborLine.${ll_id}.status == IN_PROGRESS (unchanged)"

      - name: ro_cancel_forfeits_charged_cores
        claim_type: side_effect_execution
        grounds: [state_machines.RepairOrder.APPROVED_to_CANCELLED, state_machines.CoreCharge.CHARGED_to_FORFEITED]
        distinguishing_aspect: "Cancelling an RO with a CHARGED CoreCharge flips that core to FORFEITED (conditional cascade)."
        test_recipe:
          setup: ["RO ESTIMATE with one cored part (CoreCharge CHARGED)"]
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Fo Owner", phone: "555-111", email: "fo@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINFORF", make: "GMC", model: "Sierra", model_year: 2016, odometer_miles: 70000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "FF-1", description: "Compressor", quantity: 1, unit_cost_cents: 9000, markup_mode: "FLAT_BRACKET", has_core: true, core_deposit_cents: 4000 }
              as: PartsManager
            - call: "GET /core-charges"
              payload: { repair_order_id: "${ro_id}" }
              as: PartsManager
              captures: { cc_id: "$.data[0].id" }
          trigger:
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "CANCEL" }
              as: ServiceAdvisor
            - call: "GET /core-charges/${cc_id}"
              payload: {}
              as: PartsManager
              captures: { st: $.data.status }
          assert:
            - "RepairOrder.${ro_id}.status == CANCELLED"
            - "CoreCharge.${cc_id}.status == FORFEITED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: warranty_part_line_billed_zero
        claim_type: Correct Result
        grounds: [calculations.parts_markup, entities.PartLine.fields.is_warranty, entities.PartLine.fields.extended_charge_cents]
        distinguishing_aspect: "An is_warranty PartLine on a within-warranty comeback bills extended_charge_cents == 0 regardless of cost/markup."
        test_recipe:
          setup:
            - "Clock 2026-01-01; original RO closed (odometer 40000); comeback RO created within window at 2026-02-01"
            - "Markup tier covers 9000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T08:00:00Z" }
              as: ShopManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /labor-operations"
              payload: { op_code: "WPL", description: "AC", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Wp Tech" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Wp Owner", phone: "555-112", email: "wp@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINWPL1", make: "Chevy", model: "Malibu", model_year: 2018, odometer_miles: 40000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-WPL" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_o: $.data.id, ro_o_v0: $.data.version }
            - call: "POST /repair-orders/${ro_o}/labor-lines"
              payload: { labor_operation_id: "${op_id}", technician_id: "${tid}" }
              as: ShopManager
              captures: { ll_o: $.data.id }
            - call: "GET /repair-orders/${ro_o}"
              payload: {}
              as: ShopManager
              captures: { ro_o_ver2: $.data.version }
            - call: "POST /repair-orders/${ro_o}/authorize"
              payload: { expected_repair_order_version: "${ro_o_ver2}" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /repair-orders/${ro_o}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-01-01T09:00:00Z", scheduled_end: "2026-01-01T12:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders/${ro_o}/transition"
              payload: { action: "START" }
              as: ShopManager
            - call: "POST /labor-lines/${ll_o}/clock-in"
              payload: { technician_id: "${tid}", clock_in: "2026-01-01T09:00:00Z" }
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /labor-lines/${ll_o}/clock-out"
              payload: { clock_out: "2026-01-01T10:00:00Z" }
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /labor-lines/${ll_o}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /repair-orders/${ro_o}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /repair-orders/${ro_o}/transition"
              payload: { action: "INVOICE" }
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_o}/transition"
              payload: { action: "CLOSE" }
              as: ServiceAdvisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders"
