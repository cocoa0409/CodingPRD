    instances:
      - name: unit_reservation_half_open_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_UNIT_RESERVED_CONFLICT]
          - entities.RentalLine.fields.equipment_unit_id
        distinguishing_aspect: |
          Half-open interval semantics on EquipmentUnit: contract window
          [start_date, expected_offhire_date) permits exact adjacency (a new
          reservation starting 2026-09-08 against one ending 2026-09-08) but
          rejects true overlap — distinct from the buffered-technician
          semantics of the sibling instance.
        test_recipe:
          setup:
            - "Customer C1 (GOOD), Site S1 (TX-TCEQ), Unit U1"
            - "Contract KA holds U1 via PENDING line, window [2026-09-01, 2026-09-08)"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
