  # ------------------------------------------------------------------------
  - section: errors
    instances:
      - name: missing_auth_headers_returns_auth_missing
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_AUTH_MISSING]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID header (or unknown role) returns ERR_AUTH_MISSING (401)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /resorts"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_AUTH_MISSING"
            - "http_status == 401"

      - name: stale_pass_version_on_refund_approve_returns_stale
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[refund-approve-stale-pass]
          - validations[priority=11]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Approving a refund with an expected_pass_version older than the current Pass.version (bumped by an intervening GRANTED scan) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "FULL_EPIC ACTIVE pass, scan-light. Client observes pass.version, then a GRANTED scan bumps it; a PENDING refund request exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 6000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Stale Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Stale Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { stale_ver: $.data.version }
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${stale_ver}" }
              as: RefundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

  # ------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: resort_ops_cannot_create_resort
        claim_type: rbac_denial
        grounds:
          - roles.ResortOps
          - roles.NetworkAdmin
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - endpoints.POST_/resorts
        distinguishing_aspect: "POST /resorts as ResortOps (a NetworkAdmin-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /resorts"
              payload: { name: "Sneaky Resort", home_network: "EPIC" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
            - "http_status == 403"

      - name: resort_ops_cannot_approve_refund
        claim_type: rbac_denial
        grounds:
