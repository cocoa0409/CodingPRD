            - "One RentalContract (COMPETITIVE_BID_SINGLE_PAYMENT, cap 36) in (billing ACCRUING, service IN_SERVICE) after a passing setup on 2026-08-01, monthly_allowable_cents 5590, first_service_month 2026-08."
