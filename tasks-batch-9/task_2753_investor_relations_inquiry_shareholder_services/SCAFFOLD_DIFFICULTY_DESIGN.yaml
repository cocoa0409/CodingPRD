            - "link 3: MeetingRequest.${mr2_id}.status == ALLOCATED and promoted_from_waitlist == true and allocated_at == 2026-08-01T00:00:00.000Z"
            - "MeetingRequest.${mr1_id}.final_priority_score == 99.60 and MeetingRequest.${mr2_id}.final_priority_score == 67.20"
