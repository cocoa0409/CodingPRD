  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_completed_training
        grounds:
          - state_machines.TreasuryEnrollment.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.TrainingSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Pair TreasuryEnrollment x TrainingSession: the enrollment's first
          activation is gated on a DIFFERENT entity reaching COMPLETED; without it
          activation fails, with it activation succeeds.
        test_recipe:
          setup:
            - "Enrollment in PENDING_ACTIVATION with a user but no training activity"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "GateCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
          trigger:
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager, captures: { err1: $.data.error_id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager, captures: { err2: $.data.error_id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager, captures: { st: $.data.status } }
          assert:
            - "No sessions at all: err1 == ERR_ENROLLMENT_NOT_ACTIVATABLE"
            - "Session SCHEDULED but not COMPLETED: err2 == ERR_ENROLLMENT_NOT_ACTIVATABLE"
            - "After completion: st == ACTIVE"

      - name: decision_blocked_while_enrollment_suspended
        grounds:
          - state_machines.ExceptionItem.OPEN_to_DECISIONED_PAY
          - state_machines.TreasuryEnrollment.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair ExceptionItem x TreasuryEnrollment: the exception's own state is
          OPEN and its deadline is in the future, yet the decision is rejected
          purely because the PARENT enrollment is SUSPENDED.
        test_recipe:
          setup:
            - "ACTIVE REVERSE-tier enrollment with one OPEN exception whose deadline is hours away; enrollment then suspended"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "GateCo2", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "990004" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
            - { call: "POST /treasury/enrollments/${enr}/suspend", payload: {}, as: BankTreasuryManager }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { err: $.data.error_id } }
            - { call: "GET /treasury/exceptions/${ex}", payload: {}, as: BankOps, captures: { st: $.data.status } }
          assert:
            - "err == ERR_ENROLLMENT_NOT_ACTIVE even though the exception itself is decisionable"
            - "Exception unchanged: st == OPEN (suspension blocks, does not resolve)"

      - name: upload_blocked_when_account_closed
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - calculations.issue_file_row_validation
        distinguishing_aspect: |
          Pair IssueFileUpload x Account: file upload validity depends on the
          referenced Account's lifecycle state — a well-formed file for a CLOSED
          account is rejected before any row is processed.
        test_recipe:
          setup:
            - "ACTIVE PAYEE enrollment; its only account is CLOSED"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "CloseCo", tier: "PAYEE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "990005" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/accounts/${acct}/close", payload: {}, as: BankTreasuryManager, captures: { cl: $.data.status } }
          trigger:
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-CLOSED", rows: [ { check_number: "1", amount_cents: 100, payee_name: "P", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert:
            - "cl == CLOSED"
            - "err == ERR_ACCOUNT_NOT_ACTIVE and no IssueFileUpload is created"

  - rule_id: resource_temporal_overlap
    instances:
      - name: ach_rule_half_open_window_overlap
        grounds:
          - entities.AchDebitRule.fields.effective_start_date
          - errors[ERR_ACH_RULE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          AchDebitRule uses HALF-OPEN [start, end) semantics: a rule starting
          exactly when another ends (end == start) is legal adjacency, while a
          one-day-earlier start collides; open-ended (null end) windows overlap
          everything at-or-after their start.
        test_recipe:
          setup:
            - "ACTIVE POSITIVE_PAY enrollment with account; rule A occupies [2026-08-01, 2026-08-10) for scope (acct, ORG1, CCD)"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "WinCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "990006" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG1", sec_code: "CCD", effective_start_date: "2026-08-01", effective_end_date: "2026-08-10" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rA: $.data.id } }
          trigger:
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "FILTER", originator_company_id: "ORG1", sec_code: "CCD", max_amount_cents: 5000, effective_start_date: "2026-08-10", effective_end_date: "2026-08-20" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rB: $.data.id } }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG1", sec_code: "CCD", effective_start_date: "2026-08-09", effective_end_date: "2026-08-15" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { errC: $.data.error_id } }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG2", sec_code: "CCD", effective_start_date: "2026-08-01", effective_end_date: "2026-08-10" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rD: $.data.id } }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG1", sec_code: "CCD", effective_start_date: "2026-08-20", effective_end_date: null }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rE: $.data.id } }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG1", sec_code: "CCD", effective_start_date: "2026-09-01", effective_end_date: "2026-09-05" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { errF: $.data.error_id } }
          assert:
            - "Adjacency allowed: B [08-10, 08-20) created after A [08-01, 08-10) — rB is a valid id"
            - "Overlap rejected: C starting 08-09 -> errC == ERR_ACH_RULE_WINDOW_OVERLAP"
            - "Different originator scope is independent: rD created"
            - "Open-ended rule E [08-20, null) created (adjacent to B's end)"
            - "Open-ended E swallows the future: F [09-01, 09-05) -> errF == ERR_ACH_RULE_WINDOW_OVERLAP"

      - name: training_session_buffered_window_conflict
        grounds:
          - errors[ERR_TRAINING_SCHEDULE_CONFLICT]
          - state_machines.TrainingSession
        distinguishing_aspect: |
          TrainingSession uses BUFFER-AUGMENTED interval semantics — windows are
          padded by 30 minutes on both sides before overlap testing, so raw
          adjacency (end == start) CONFLICTS here, whereas the ACH rule in the
          sibling instance treats exact adjacency as legal. Different resource,
          different interval geometry.
        test_recipe:
          setup:
            - "Enrollment exists; trainer 'tr-x' holds a SCHEDULED session 2026-08-10T10:00:00Z..11:00:00Z"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "TrainCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-x", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: BankOps, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-x", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: BankOps, captures: { err2: $.data.error_id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-y", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: BankOps, captures: { s3: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-x", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: BankOps, captures: { s4: $.data.id } }
          assert:
            - "Same trainer, raw-adjacent start (11:00 == prior end): err2 == ERR_TRAINING_SCHEDULE_CONFLICT (buffered windows [09:30,11:30) and [10:30,12:30) intersect)"
            - "Different trainer at the same clock time: s3 created (conflict scope is per-trainer)"
            - "Same trainer at 12:00: s4 created — buffered [09:30,11:30) vs [11:30,13:30) are exactly adjacent, and adjacency of BUFFERED half-open windows is legal"

  - rule_id: compensating_invariant
    instances:
      - name: pay_reverse_pair_preserves_net_settled
        grounds:
          - calculations.account_settlement_ledger
          - state_machines.PresentedItem.PAID_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: Account.net_settled_cents (cash). A pay event of X
          followed by its compensating reversal leaves net_settled_cents exactly
          at its pre-payment value, while cumulative_paid_cents and
          cumulative_reversed_cents both strictly increase — gross counters grow,
          the net invariant holds.
        test_recipe:
          setup:
            - "ACTIVE POSITIVE_PAY enrollment; issued check 901 amount 7000; account starts with all ledgers at 0"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "NetCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "990007" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-NET", rows: [ { check_number: "901", amount_cents: 7000, payee_name: "THETA CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "901", amount_cents: 7000, payee_name_raw: "THETA CO", channel: "CLEARING", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it: $.data.id, it_st: $.data.status } }
            - { call: "GET /treasury/accounts/${acct}", payload: {}, as: BankOps, captures: { p1: $.data.cumulative_paid_cents, r1: $.data.cumulative_reversed_cents, n1: $.data.net_settled_cents } }
            - { call: "POST /treasury/presented-items/${it}/reverse", payload: { reason: "posting error" }, as: BankTreasuryManager, captures: { it_st2: $.data.status } }
            - { call: "GET /treasury/accounts/${acct}", payload: {}, as: BankOps, captures: { p2: $.data.cumulative_paid_cents, r2: $.data.cumulative_reversed_cents, n2: $.data.net_settled_cents } }
          assert:
            - "After pay: it_st == PAID; p1 == 7000, r1 == 0, n1 == 7000"
            - "After compensating reversal: it_st2 == REVERSED; p2 == 7000, r2 == 7000"
            - "INVARIANT: n2 == 0 == pre-payment baseline (net_settled_cents unchanged by the pay+reverse pair)"

      - name: waive_reinstate_pair_preserves_period_gross_fees
        grounds:
          - calculations.monthly_statement
          - state_machines.FeeLedgerEntry.BILLED_to_WAIVED
          - state_machines.FeeLedgerEntry.WAIVED_to_BILLED
        distinguishing_aspect: |
          Conserved quantity: period gross fee mass (sum of amount_cents over ALL
          of the period's entries regardless of status) — a different conserved
          quantity from cash settlement. Waive and reinstate mutate only status;
          the gross sum and every entry amount are bit-identical before and after
          the pair, and net_due returns to its pre-waive value.
        test_recipe:
          setup:
            - "REVERSE-tier enrollment; 2 exceptions (400 cents provisional) + one RETURN decision (500 cents); period 2026-08 billed (topup 4100, net 5000)"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "GrossCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "990008" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "P1", channel: "TELLER" }, as: BankOps, captures: { ex1: $.data.exception_id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "2", amount_cents: 100, payee_name_raw: "P2", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/exceptions/${ex1}/decision", payload: { decision: "RETURN" }, as: CustomerDecisionMaker, as_user_id: "${dm}" }
            - { call: "GET /treasury/fee-entries", payload: { exception_id: "${ex1}", fee_type: "RETURN_FEE" }, as: BankOps, captures: { rfee: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "MONTHLY_BILLING", enrollment_id: "${enr}", period: "2026-08" }, as: BankOps, captures: { top: $.data.minimum_topup_cents } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { g1_exc: $.data.exception_fees_cents, g1_ret: $.data.return_fees_cents, g1_net: $.data.net_due_cents, g1_wv: $.data.waived_cents } }
          trigger:
            - { call: "POST /treasury/fee-entries/${rfee}/waive", payload: { reason: "goodwill" }, as: BankOps, captures: { w_st: $.data.status, w_from: $.data.waived_from_status } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { g2_exc: $.data.exception_fees_cents, g2_ret: $.data.return_fees_cents, g2_net: $.data.net_due_cents, g2_wv: $.data.waived_cents } }
            - { call: "POST /treasury/fee-entries/${rfee}/reinstate", payload: {}, as: BankTreasuryManager, captures: { r_st: $.data.status } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { g3_exc: $.data.exception_fees_cents, g3_ret: $.data.return_fees_cents, g3_net: $.data.net_due_cents, g3_wv: $.data.waived_cents } }
          assert:
            - "Baseline after billing: top == 4100; g1_exc == 400, g1_ret == 500, g1_wv == 0, g1_net == 5000"
            - "Waive: w_st == WAIVED, w_from == BILLED; g2_net == 4500, g2_wv == 500; gross unchanged: g2_exc == 400 and g2_ret == 500"
            - "Reinstate returns to the recorded prior status: r_st == BILLED"
            - "INVARIANT: g3_exc == 400, g3_ret == 500, g3_wv == 0, g3_net == 5000 — the waive+reinstate pair leaves period gross (900) and net (5000) exactly conserved"
