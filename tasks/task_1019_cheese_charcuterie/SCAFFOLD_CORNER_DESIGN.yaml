        grounds: [entities.Lot.fields.cave_id]
        distinguishing_aspect: "GET /api/lots?cave_id={cave} returns only lots in that cave (reverse-reachability for Lot.cave_id) with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Product min_aging 0; one cave with two lots received."]
          setup_api_calls:
            - { call: "POST /api/products", payload: { name: "LF Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
