  - rule_id: compensating_invariant
    instances:
      - name: caseload_points_conserved_across_transfer_round_trip
        grounds:
          - state_machines.Enrollment.ACTIVE_to_ACTIVE_transfer
          - calculations.caseload_weight_points
          - concurrency_rules[transfer-stale-enrollment]
          - entities.CareManager.fields.assigned_caseload_points
        distinguishing_aspect: |
          Conserved quantity one is caseload points: the named invariant
          sum(CareManager.assigned_caseload_points) == sum(Enrollment.acuity_weight_points over
          enrollment_status IN {PENDING, ACTIVE} with a non-null care_manager_id) must read 4.0
          before the transfer, 4.0 between the two transfers and 4.0 after the compensating transfer
          back, with manager A back at exactly 4.0 and manager B at exactly 0.0 - no drift.
