      - name: order_worklist_filters_compose_with_limit_and_offset
        claim_type: listing_semantics
        grounds:
          - endpoints[GET /bone-density/scan-orders]
          - response_envelope.pagination
        distinguishing_aspect: "Filtering, ordering and pagination are computed against each other rather than independently: with four orders across two patients, patient_id narrows total_count to 3, adding indication narrows it to 2, and limit 2 with offset 0 then 2 returns the created_at ASC pages 2+1 with has_more true then false while total_count stays 3 in both responses."
        test_recipe:
          setup:
