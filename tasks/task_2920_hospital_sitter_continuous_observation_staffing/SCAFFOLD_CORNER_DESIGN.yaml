          assert:
            - "Probe 1 (incoming watch belongs to order ${hob}): HTTP 422 with data.error_id == ERR_HANDOFF_ORDER_MISMATCH"
            - "Probe 2 (outgoing named as its own successor): HTTP 422 with data.error_id == ERR_HANDOFF_ORDER_MISMATCH — the two ids must differ even though the order matches"
            - "After both failures SitterAssignment.${ha_out}.documentation_status is still PENDING and GET /observation/sitter-assignments/${ha_out}/handoffs returns 0 rows"
            - "Probe 3: HTTP 201 with documentation_state == DRAFTED, countersigned_by_staff_id == null, countersigned_at == null"
            - "SitterAssignment.${ha_out}.documentation_status == HANDOFF_DRAFTED while its watch_status is still SCHEDULED"
            - "GET /observation/handoffs/${hrec} returns outgoing_assignment_id ${ha_out} and incoming_assignment_id ${ha_in}"

      - name: individually_affordable_watches_collectively_exhaust_the_unit_budget
        claim_type: aggregate
        grounds:
          - validations[priority=28]
          - state_machines.Unit
        distinguishing_aspect: "Every candidate is affordable in isolation; only the running head makes the second one illegal. The third probe lands the head exactly on the budget, which priority 28 accepts (strictly greater is rejected) and which is simultaneously the trigger that flips the unit OPEN -> RESTRICTED."
        test_recipe:
          setup:
            - "Unit UNIT-C31 with a deliberately small budget of 30000 cents, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Three INTERNAL_FLOAT sitters at 2000 cents/hour, all ADVANCED with unexpired certifications, so only the fiscal rule can bite."
            - "Windows are disjoint per staff member; each staff member has exactly one candidate."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C31", name: "Corner Unit Thirtyone", observation_cost_budget_cents: 30000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u31: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u31}", mrn: "MRN-C3101", full_name: "Budget Patient", age_years: 60 }
              as: NurseManager
              captures: { gp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u31}", full_name: "Budget Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { gs1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u31}", full_name: "Budget Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { gs2: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u31}", full_name: "Budget Sitter Three", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { gs3: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${gp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Budget-constrained fall watch" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { go: $.data.id, go_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${go}", staff_id: "${gs1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${go_v1}" }
              as: StaffingCoordinator
              captures: { ga1: $.data.id }
            - call: "GET /observation/orders/${go}"
              payload: {}
              as: StaffingCoordinator
              captures: { go_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${go}", staff_id: "${gs2}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${go_v2}" }
              as: StaffingCoordinator
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${go}", staff_id: "${gs3}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-01T23:00:00Z", expected_order_version: "${go_v2}" }
              as: StaffingCoordinator
              captures: { ga3: $.data.id }
          assert:
            - "Probe 1: HTTP 201, provisional_cost_cents == 16000; Unit.${u31}.observed_cost_to_date_cents == 16000 and status == OPEN (16000 < 30000)"
            - "Probe 2 (a second 8-hour watch, candidate 16000): HTTP 402 with data.error_id == ERR_UNIT_BUDGET_EXCEEDED because 16000 + 16000 == 32000 > 30000, even though 16000 alone fits"
            - "Probe 2 wrote nothing: the unit head is still 16000, GET /observation/units/${u31}/cost-entries returns 1 row, and ObservationOrder.${go}.version is still ${go_v2}"
            - "Probe 3 (a 7-hour watch, candidate 14000): HTTP 201 — 16000 + 14000 == 30000 is equal to the budget and equality is accepted"
            - "SitterAssignment.${ga3}.scheduled_minutes == 420 and provisional_cost_cents == 14000"
            - "Unit.${u31}.observed_cost_to_date_cents == 30000 and status == RESTRICTED — reaching the budget flips the unit in the same request that posted the charge"
            - "SitterAssignment.${ga1}.watch_status is still SCHEDULED and nothing about it changed"

      - name: restricted_unit_refuses_agency_labor_but_still_accepts_internal_float
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - state_machines.Unit
        distinguishing_aspect: "Priority 29 is reached only when the unit is RESTRICTED for a non-fiscal reason, so the restriction is produced here by a lapsed order rather than by spending: the head is 0 and the budget is 250000, which keeps priority 28 silent and lets 29 be the sole reason for the 402. The very next create, identical except for source_pool, succeeds."
        test_recipe:
          setup:
            - "Unit UNIT-C32 budget 250000, video disabled; two admitted patients age 60, each with an ACTIVE FALL-only order (OL to be lapsed, OS to survive)."
            - "One AGENCY sitter at 2500 and one INTERNAL_FLOAT sitter at 2000, both ADVANCED with unexpired certifications."
            - "Both orders score 1.5 at admission, giving interval 24 and next_reassessment_due_at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C32", name: "Corner Unit Thirtytwo", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u32: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u32}", mrn: "MRN-C3201", full_name: "Lapsing Patient", age_years: 60 }
              as: NurseManager
              captures: { lpx: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u32}", mrn: "MRN-C3202", full_name: "Surviving Patient", age_years: 60 }
              as: NurseManager
              captures: { spx: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u32}", full_name: "Restricted Agency Sitter", source_pool: "AGENCY", hourly_rate_cents: 2500, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { rag: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u32}", full_name: "Restricted Float Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { rfl: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${lpx}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Order that will lapse" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { ol: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${spx}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Order that will be reassessed on time" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { os1: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/orders/${os1}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T06:00:01Z" }
              as: SystemAdmin
            - call: "GET /observation/orders/${os1}"
              payload: {}
              as: StaffingCoordinator
              captures: { os1_v: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${os1}", staff_id: "${rag}", shift_start_at: "2026-08-02T08:00:00Z", shift_end_at: "2026-08-02T16:00:00Z", expected_order_version: "${os1_v}" }
              as: StaffingCoordinator
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${os1}", staff_id: "${rfl}", shift_start_at: "2026-08-02T08:00:00Z", shift_end_at: "2026-08-02T16:00:00Z", expected_order_version: "${os1_v}" }
              as: StaffingCoordinator
              captures: { rfa: $.data.id }
          assert:
            - "The 2026-08-02T00:00:00Z advance reported orders_marked_reassessment_due == 2 and orders_lapsed == 0"
            - "The 2026-08-02T06:00:01Z advance reported orders_lapsed == 1 and orders_marked_reassessment_due == 0; ObservationOrder.${ol}.status == LAPSED and ObservationOrder.${os1}.status == ACTIVE"
            - "Unit.${u32}.status == RESTRICTED with restriction_reason == OBSERVATION_ORDER_LAPSED while observed_cost_to_date_cents == 0"
            - "Probe 1 (AGENCY, candidate 29000): HTTP 402 with data.error_id == ERR_UNIT_RESTRICTED_AGENCY_BLOCKED — not ERR_UNIT_BUDGET_EXCEEDED, since 0 + 29000 is far below the 250000 budget"
            - "Probe 2 (INTERNAL_FLOAT, same order, same window, same expected_order_version ${os1_v} because probe 1 bumped nothing): HTTP 201 with provisional_cost_cents == 16000"
            - "Unit.${u32}.observed_cost_to_date_cents == 16000 and status is still RESTRICTED — a post never clears a restriction"
            - "GET /observation/orders/${os1}/sitter-assignments returns exactly 1 row, ${rfa}"

      - name: unresolvable_order_fk_short_circuits_the_competency_check
        claim_type: cascading
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: "The competency check at priority 11 is defined against the order's risk_categories, so it cannot even be evaluated until the body FK resolves at priority 5. One request violates 5, 7 and 11 at once — unknown order_id, absurd expected_order_version and a NOT_TRAINED sitter — and the response must be the 404, proving the checks run in dependency order rather than in whichever order is cheapest."
        test_recipe:
          setup:
            - "Unit UNIT-C33 budget 250000, video disabled; one NOT_TRAINED sitter with an unexpired certification (so only competency, not cert expiry, is in play)."
            - "A decoy SELF_HARM order exists on another patient purely so the request can carry a real, well-formed order version; the order_id in the request names an order that exists nowhere."
            - "Because the named order cannot be loaded, the supplied version can match nothing, so priority 7 is violated as well."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C33", name: "Corner Unit Thirtythree", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u33: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u33}", full_name: "Untrained Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "NOT_TRAINED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { us1: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u33}", mrn: "MRN-C3301", full_name: "Decoy Patient", age_years: 60 }
              as: NurseManager
              captures: { dp33: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${dp33}", ordering_provider_user_id: "prov-1", risk_categories: ["SELF_HARM"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Decoy order supplying a live version token" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { do33: $.data.id, do33_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "00000000-0000-0000-0000-0000000000ff", staff_id: "${us1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${do33_v1}" }
              as: StaffingCoordinator
          assert:
            - "HTTP 404 with data.error_id == ERR_ORDER_NOT_FOUND"
            - "Not 412 ERR_STALE_ORDER_VERSION and not 422 ERR_COMPETENCY_INSUFFICIENT: the version belongs to ${do33}, not to the named order, and the NOT_TRAINED sitter would fail priority 11 the moment the order's risk_categories could be read"
            - "The error envelope carries response_type == error with meta.api_request_id and meta.api_request_timestamp present"
            - "Unit.${u33}.observed_cost_to_date_cents == 0 and GET /observation/units/${u33}/cost-entries returns 0 rows"
            - "Staff.${us1} is unchanged: status AVAILABLE, last_shift_end_at null, version unchanged"

      - name: higher_priority_state_gate_wins_over_the_fiscal_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / discontinued_order_state_beats_unit_budget_exceeded"
          rationale: "That instance drives one request that violates both the state gate and the budget gate and pins the 409 plus an unchanged ledger head."

      - name: certification_gate_outranks_the_float_authorization_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / expired_deescalation_cert_beats_missing_float_authorization"
          rationale: "That instance violates a business_safety rule and a business_referential rule in one create and pins the 422 ERR_DEESCALATION_CERT_EXPIRED."

      - name: shift_overlap_is_checked_before_the_rest_buffer
        claim_type: temporal
        grounds:
          - validations[priority=17]
          - validations[priority=18]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / staff_pairwise_half_open_overlap_then_exact_480_minute_rest_buffer"
          rationale: "That instance runs three probes against one prior shift and separates the half-open overlap error from the 480-minute rest-buffer error, including the exactly-480 pass."

      - name: span_of_control_is_an_aggregate_over_overlapping_feeds
        claim_type: aggregate
        grounds:
          - validations[priority=22]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / station_aggregate_capacity_with_limit_shrinking_under_acuity_weight"
          rationale: "That instance admits feeds that are each individually legal until the acuity-weighted limit shrinks below the occupancy count and the next admission is refused."

      - name: start_watch_validity_depends_on_the_sitters_duty_posture
        claim_type: cross_entity
        grounds:
          - validations[priority=9]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / start_watch_depends_on_staff_duty_posture_set_by_a_console_feed"
          rationale: "That instance makes the same start-watch call fail and then succeed purely by changing the Staff row from another entity's transition."

      - name: video_modality_gate_is_strict_below_six_point_zero
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
        excluded_because:
          difficulty_instance: "boundary_precision_check / video_gate_strict_less_than_six_point_zero_on_feed_admission"
          rationale: "That instance admits a 5.0 order and refuses an exactly-6.0 order on the same console, which is the whole content of the gate."

      - name: discontinuation_is_blocked_by_a_safety_event_inside_the_window
        claim_type: temporal
        grounds:
          - validations[priority=15]
        excluded_because:
          difficulty_instance: "boundary_precision_check / discontinuation_safety_window_inclusive_at_exactly_twenty_four_hours"
          rationale: "That instance pins the inclusive 24h edge, one second either side, on the same order and event."

  - section: endpoints
    instances:
      - name: unit_patient_list_pages_filters_and_rejects_bad_windows
        claim_type: standard_crud
        grounds:
          - endpoints.GET_observation_units__id_patients
          - api_envelope.pagination_defaults
        distinguishing_aspect: "One list endpoint carries three separate contracts: the page window (limit/offset with total_count and has_more), the status filter (which must also narrow total_count, not just the rows), and the declared bounds limit >= 1, limit <= 100 and offset >= 0, each of which is a 400 at the shape gate rather than a clamped success."
        test_recipe:
          setup:
            - "Unit UNIT-C34 budget 250000, video disabled, holding three admitted patients age 60; the third is discharged immediately and has no orders, so the discharge cascade is a no-op."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C34", name: "Corner Unit Thirtyfour", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u34: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u34}", mrn: "MRN-C3401", full_name: "Page Patient One", age_years: 60 }
              as: NurseManager
              captures: { pg1: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u34}", mrn: "MRN-C3402", full_name: "Page Patient Two", age_years: 60 }
              as: NurseManager
              captures: { pg2: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u34}", mrn: "MRN-C3403", full_name: "Page Patient Three", age_years: 60 }
              as: NurseManager
              captures: { pg3: $.data.id }
            - call: "POST /observation/patients/${pg3}/discharge"
              payload: {}
              as: NurseManager
          trigger:
            - call: "GET /observation/units/${u34}/patients"
              payload: { limit: 2, offset: 0 }
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: { limit: 2, offset: 2 }
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: { status: "DISCHARGED" }
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: {}
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: { limit: 0 }
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: { limit: 101 }
              as: StaffingCoordinator
            - call: "GET /observation/units/${u34}/patients"
              payload: { offset: -1 }
              as: StaffingCoordinator
          assert:
            - "Probe 1: HTTP 200, response_type == array, 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Probe 2: 1 row, limit == 2, offset == 2, total_count == 3, has_more == false; the two pages together cover ${pg1}, ${pg2} and ${pg3} with no id appearing twice"
            - "Probe 3: 1 row (${pg3} with status DISCHARGED), total_count == 1 and has_more == false — the filter narrows total_count too, not just the page"
            - "Probe 4: 3 rows with the defaults limit == 10 and offset == 0 echoed back"
            - "Probe 5 (limit 0, below the declared min of 1): HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Probe 6 (limit 101, above the declared max of 100): HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Probe 7 (offset -1): HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp, and the error bodies carry data.error_id"

      - name: observer_station_and_feed_reverse_lookups_resolve_from_both_ends
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_observation_staff__id_monitoring_stations
          - endpoints.GET_observation_monitoring_stations__id_video_feeds
          - endpoints.GET_observation_orders__id_video_feeds
        distinguishing_aspect: "A VideoFeed is the join of a station and an order, so the same row must be reachable from three directions — the observer's station list, the station's feed list and the order's feed list — and the two stations of one observer must not bleed into each other's feed lists."
        test_recipe:
          setup:
            - "Unit UNIT-C35 with video_monitoring_enabled true, budget 250000; admitted patient age 60 with an ACTIVE FALL-only order (score 1.5, so the video gate passes) whose required_modality is VIDEO_MONITORING."
            - "One ADVANCED remote observer with an unexpired certification, staffing two consoles: console A declared_max_span 3 and console B declared_max_span 2."
            - "Exactly one feed is admitted, onto console A."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C35", name: "Corner Unit Thirtyfive", observation_cost_budget_cents: 250000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { u35: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u35}", mrn: "MRN-C3501", full_name: "Feed Link Patient", age_years: 60 }
              as: NurseManager
              captures: { flp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u35}", full_name: "Link Observer", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2200, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { lob: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${flp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Fall risk suitable for continuous video observation" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { flo: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${lob}", station_label: "CONSOLE-A", declared_max_span: 3 }
              as: StaffingCoordinator
              captures: { csa: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${lob}", station_label: "CONSOLE-B", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { csb: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${csa}", order_id: "${flo}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T16:00:00Z" }
              as: RemoteObserver
              as_user_id: "${lob}"
              captures: { lfd: $.data.id }
          trigger:
            - call: "GET /observation/staff/${lob}/monitoring-stations"
              payload: {}
              as: NurseManager
            - call: "GET /observation/monitoring-stations/${csa}/video-feeds"
              payload: { status: "ACTIVE" }
              as: NurseManager
            - call: "GET /observation/monitoring-stations/${csb}/video-feeds"
              payload: {}
              as: NurseManager
            - call: "GET /observation/orders/${flo}/video-feeds"
              payload: {}
              as: NurseManager
            - call: "GET /observation/video-feeds/${lfd}"
              payload: {}
              as: NurseManager
          assert:
            - "Probe 1: 2 rows, total_count == 2 — ${csa} with status ACTIVE_MONITORING and ${csb} with status IDLE, both carrying observer_staff_id ${lob}"
            - "${csa} reports active_feed_count == 1, active_acuity_weight == 1.0 and effective_span_limit == 3; ${csb} reports 0, 0.0 and 2"
            - "Probe 2: exactly 1 row, ${lfd}, total_count == 1"
            - "Probe 3: 0 rows, total_count == 0 — the observer's second console shares no feeds with the first"
            - "Probe 4: exactly 1 row, ${lfd}, reachable from the order side as well"
            - "Probe 5: station_id == ${csa}, order_id == ${flo}, status == ACTIVE, acuity_weight == 1.0, release_reason == null, released_at == null"
            - "Staff.${lob}.status == ON_ASSIGNMENT (the first admitted feed took the observer on duty)"

      - name: clock_advance_reports_its_sweep_counters_inline_and_refuses_a_rewind
        claim_type: computed_read
        grounds:
          - endpoints.POST_observation__clock_set_current_utc
          - state_machines.ObservationOrder
        distinguishing_aspect: "The clock endpoint's response is itself the derived read: the two counters must describe only the transitions that this call performed. A no-op advance to the same instant reports zeros, a rewind is refused outright, the due sweep reports 2/0 and the lapse sweep on the next call reports 0/2 — proving at most one transition per order per call."
        test_recipe:
          setup:
            - "Unit UNIT-C36 budget 250000, video disabled; two admitted patients age 60, each with an ACTIVE FALL-only order scoring 1.5, interval 24 and next_reassessment_due_at 2026-08-02T00:00:00Z."
            - "The startup clock is the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C36", name: "Corner Unit Thirtysix", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u36: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u36}", mrn: "MRN-C3601", full_name: "Sweep Patient One", age_years: 60 }
              as: NurseManager
              captures: { sw1: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u36}", mrn: "MRN-C3602", full_name: "Sweep Patient Two", age_years: 60 }
              as: NurseManager
              captures: { sw2: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${sw1}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Sweep order one" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { so1: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${sw2}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Sweep order two" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { so2: $.data.id }
          trigger:
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:59:59Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T06:00:01Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T23:00:00Z" }
              as: SystemAdmin
          assert:
            - "Probe 1: HTTP 200 with current_utc == 2026-08-01T12:00:00Z, orders_marked_reassessment_due == 0, orders_lapsed == 0 — nothing is due yet"
            - "Probe 2 (the same instant again): HTTP 200 with the same current_utc and both counters 0; equality is allowed because the new value need only be >= the current clock"
            - "Probe 3 (one second earlier): HTTP 400 with data.error_id == ERR_INVALID_REQUEST, and a follow-up read shows the clock is still 2026-08-01T12:00:00Z"
            - "Probe 4: orders_marked_reassessment_due == 2 and orders_lapsed == 0; both ${so1} and ${so2} are REASSESSMENT_DUE — an order cannot move twice in one call, so neither lapses here"
            - "Probe 5 (past due + 6h): orders_marked_reassessment_due == 0 and orders_lapsed == 2; both orders are LAPSED"
            - "Unit.${u36}.status == RESTRICTED with restriction_reason == OBSERVATION_ORDER_LAPSED after probe 5"
            - "Probe 6: both counters are 0 — LAPSED is terminal, so a later advance sweeps nothing, and Unit.${u36} stays RESTRICTED"

      - name: cost_close_with_a_budget_increase_is_the_only_lift_out_of_restricted
        claim_type: conditional_action
        grounds:
          - endpoints.POST_observation_units__id_cost_close
          - state_machines.Unit
        distinguishing_aspect: "The RESTRICTED -> OPEN move is conditional on head < budget evaluated AFTER the optional budget_increase_cents is applied, so the identical close is a no-op on the first probe and the lift on the second, with a single cent of headroom deciding it. Both probes return the same derived charge, and neither touches a CostEntry row."
        test_recipe:
          setup:
            - "Unit UNIT-C37 with budget 30000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Two INTERNAL_FLOAT sitters at 2000 cents/hour: an 8-hour watch (16000) and a 7-hour watch (14000), both PROVISIONAL and POSTED at 2026-08-01T00:00:00Z, taking the head to exactly 30000 and flipping the unit to RESTRICTED."
            - "The clock is then advanced to 2026-08-01T06:00:00Z so a close through that instant strictly includes both entries."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C37", name: "Corner Unit Thirtyseven", observation_cost_budget_cents: 30000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u37: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u37}", mrn: "MRN-C3701", full_name: "Close Patient", age_years: 60 }
              as: NurseManager
              captures: { cp37: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u37}", full_name: "Close Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cs37a: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u37}", full_name: "Close Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cs37b: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${cp37}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall watch on a tight budget" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { co37: $.data.id, co37_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${co37}", staff_id: "${cs37a}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${co37_v1}" }
              as: StaffingCoordinator
              captures: { ca37a: $.data.id }
            - call: "GET /observation/orders/${co37}"
              payload: {}
              as: StaffingCoordinator
              captures: { co37_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${co37}", staff_id: "${cs37b}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-01T23:00:00Z", expected_order_version: "${co37_v2}" }
              as: StaffingCoordinator
              captures: { ca37b: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/units/${u37}/cost-close"
              payload: { close_through_utc: "2026-08-01T06:00:00Z" }
              as: StaffingCoordinator
              as_user_id: "coord-1"
            - call: "POST /observation/units/${u37}/cost-close"
              payload: { close_through_utc: "2026-08-01T06:00:00Z", budget_increase_cents: 1 }
              as: StaffingCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before the triggers: Unit.${u37}.observed_cost_to_date_cents == 30000, observation_cost_budget_cents == 30000, status == RESTRICTED"
            - "Probe 1: HTTP 200 with subtotal_cents == 30000 (16000 + 14000, both posted_at 2026-08-01T00:00:00Z < the cutoff), coverage_surcharge_pct == 0.04, coverage_surcharge_cents == 1200, charge_total_cents == 31200"
            - "Probe 1 reports unit_status == RESTRICTED — 30000 < 30000 is false, so head == budget does not lift the restriction"
            - "Probe 2: identical subtotal 30000, pct 0.04, surcharge 1200 and total 31200, but unit_status == OPEN because the budget became 30001 BEFORE the precondition was evaluated"
            - "Unit.${u37}.observation_cost_budget_cents == 30001, restriction_reason == null, and unit_version advanced by exactly 1 per probe (probe 2's unit_version == probe 1's unit_version + 1)"
            - "GET /observation/units/${u37}/cost-entries still returns exactly 2 rows, both PROVISIONAL and POSTED at 2026-08-01T00:00:00Z with amounts 16000 and 14000 — the close creates, mutates and reverses nothing"
            - "Unit.${u37}.observed_cost_to_date_cents is still 30000 after both closes"

      - name: escalation_endpoints_drive_the_order_state_machine
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_observation_safety_events
          - endpoints.POST_observation_safety_events__id_escalate_response
        excluded_because:
          difficulty_instance: "non_linear_state_machine / observation_order_cycles_active_escalated_active_twice"
          rationale: "That instance drives report -> escalate-response -> close twice over and asserts the order's re-entry into ACTIVE plus the re-scored interval each time round."

      - name: discharge_is_the_bulk_action_over_a_patients_whole_observation_footprint
        claim_type: bulk_action
        grounds:
          - endpoints.POST_observation_patients__id_discharge
        excluded_because:
          difficulty_instance: "transitive_cascade / patient_discharge_order_to_assignment_to_ledger_depth_three"
          rationale: "That instance asserts the full fan of the discharge cascade — orders, watches, documentation, both ledger legs and the unit re-evaluation — from a single call."

      - name: station_offline_is_a_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints.POST_observation_monitoring_stations__id_offline
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / station_offline_depends_on_whether_any_feed_is_still_active"
          rationale: "That instance refuses the offline while a feed is ACTIVE, releases the feed, then completes the same call and shows the terminal lockdown afterwards."

  - section: errors
    instances:
      - name: every_not_found_code_is_reachable_from_its_own_read
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNIT_NOT_FOUND
          - errors.ERR_PATIENT_NOT_FOUND
          - errors.ERR_STAFF_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_STATION_NOT_FOUND
          - errors.ERR_FEED_NOT_FOUND
          - errors.ERR_HANDOFF_NOT_FOUND
          - errors.ERR_SAFETY_EVENT_NOT_FOUND
          - errors.ERR_REASSESSMENT_NOT_FOUND
          - errors.ERR_COST_ENTRY_NOT_FOUND
        distinguishing_aspect: "Eleven entity types share one 404 shape but must not share one 404 code: each read resolves a path id against its own table and names that table in data.error_id. A single generic ERR_NOT_FOUND, or one table's code leaking onto another's read, fails this instance."
        test_recipe:
          setup:
            - "Empty database; no ids of any kind have been created, so every probe id is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /observation/units/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: NurseManager
            - call: "GET /observation/patients/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: NurseManager
            - call: "GET /observation/staff/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: NurseManager
            - call: "GET /observation/orders/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: NurseManager
            - call: "GET /observation/sitter-assignments/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: NurseManager
            - call: "GET /observation/monitoring-stations/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: NurseManager
            - call: "GET /observation/video-feeds/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: NurseManager
            - call: "GET /observation/handoffs/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: NurseManager
            - call: "GET /observation/safety-events/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: NurseManager
            - call: "GET /observation/reassessments/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              payload: {}
              as: NurseManager
            - call: "GET /observation/cost-entries/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: NurseManager
          assert:
            - "All eleven probes return HTTP 404 with response_type == error and a populated data.error_id"
            - "The codes in order are ERR_UNIT_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_FEED_NOT_FOUND, ERR_HANDOFF_NOT_FOUND, ERR_SAFETY_EVENT_NOT_FOUND, ERR_REASSESSMENT_NOT_FOUND, ERR_COST_ENTRY_NOT_FOUND"
            - "Each error body carries meta.api_request_id and meta.api_request_timestamp like any other response"

      - name: duplicate_unit_code_and_duplicate_mrn_are_distinct_conflicts
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_IDENTIFIER
          - validations[priority=25]
        distinguishing_aspect: "Priority 25 guards two different tables with one code, and both must fire: a repeated unit_code and a repeated mrn. The recipe also shows the scope is global rather than per-parent by reusing the mrn in a second unit, and confirms the losing create wrote no row."
        test_recipe:
          setup:
            - "Two units, UNIT-C38 and UNIT-C39, each budget 250000 and video disabled; UNIT-C38 holds one admitted patient with mrn MRN-C3801."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C38", name: "Corner Unit Thirtyeight", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u38: $.data.id }
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C39", name: "Corner Unit Thirtynine", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u39: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u38}", mrn: "MRN-C3801", full_name: "Duplicate Probe Patient", age_years: 60 }
              as: NurseManager
              captures: { dpp: $.data.id }
          trigger:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C38", name: "Impostor Unit", observation_cost_budget_cents: 100000, video_monitoring_enabled: true }
              as: NurseManager
            - call: "POST /observation/patients"
              payload: { unit_id: "${u38}", mrn: "MRN-C3801", full_name: "Impostor Patient Same Unit", age_years: 71 }
              as: NurseManager
            - call: "POST /observation/patients"
              payload: { unit_id: "${u39}", mrn: "MRN-C3801", full_name: "Impostor Patient Other Unit", age_years: 71 }
              as: NurseManager
          assert:
            - "Probe 1: HTTP 409 with data.error_id == ERR_DUPLICATE_IDENTIFIER"
            - "Probe 2: HTTP 409 with data.error_id == ERR_DUPLICATE_IDENTIFIER"
            - "Probe 3: HTTP 409 with data.error_id == ERR_DUPLICATE_IDENTIFIER — mrn uniqueness is global, not scoped to the unit"
            - "GET /observation/units with no filters returns exactly 2 units and UNIT-C38 still reports name Corner Unit Thirtyeight, observation_cost_budget_cents 250000 and video_monitoring_enabled false"
            - "GET /observation/units/${u38}/patients returns exactly 1 row, ${dpp}, with age_years 60; GET /observation/units/${u39}/patients returns 0 rows"

      - name: a_discharged_patient_accepts_no_further_observation_order
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PATIENT_DISCHARGED
          - validations[priority=8]
        distinguishing_aspect: "ERR_PATIENT_DISCHARGED is the patient-scoped member of the priority 8 state gate, and the only way to reach it is a fresh order write: the discharge cascade terminates every existing order, so no non-terminal order of a discharged patient can survive to raise it on a reassessment. The probe is therefore POST /observation/orders on a DISCHARGED patient."
        test_recipe:
          setup:
            - "Unit UNIT-C40 budget 250000, video disabled; one admitted patient age 60 with an ACTIVE FALL-only order, then discharged (the cascade discontinues that order)."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C40", name: "Corner Unit Forty", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u40: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u40}", mrn: "MRN-C4001", full_name: "Discharged Patient", age_years: 60 }
              as: NurseManager
              captures: { dchp: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${dchp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions before discharge" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { dcho: $.data.id }
            - call: "POST /observation/patients/${dchp}/discharge"
              payload: {}
              as: NurseManager
          trigger:
            - call: "POST /observation/orders"
              payload: { patient_id: "${dchp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Attempt to reopen observation after discharge" }
              as: AttendingProvider
              as_user_id: "prov-1"
          assert:
            - "HTTP 409 with data.error_id == ERR_PATIENT_DISCHARGED"
            - "Patient.${dchp}.status == DISCHARGED with discharged_at == 2026-08-01T00:00:00Z and ObservationOrder.${dcho}.status == DISCONTINUED"
            - "GET /observation/patients/${dchp}/orders returns exactly 1 row, ${dcho} — the rejected write created nothing"
            - "Unit.${u40}.open_order_count == 0 and its version did not move for the rejected write"

      - name: shift_window_sanity_and_the_start_watch_grace_are_separate_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_SHIFT_WINDOW
          - errors.ERR_OUTSIDE_SHIFT_WINDOW
          - validations[priority=19]
          - validations[priority=20]
        distinguishing_aspect: "Two temporal codes guard the same watch from opposite ends: priority 19 rejects the shape of the declared window at scheduling time (721 minutes, and a zero-length window), while priority 20 rejects the moment of the start-watch call (16 minutes early fails, exactly 15 minutes early passes, and the clock standing exactly on shift_end_at fails because that bound is strict)."
        test_recipe:
          setup:
            - "Unit UNIT-C41 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Two INTERNAL_FLOAT sitters at 2000 cents/hour, both ADVANCED with unexpired certifications; each takes one 12:00-20:00 watch, so the per-staff overlap and rest-buffer rules never engage."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C41", name: "Corner Unit Fortyone", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u41: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u41}", mrn: "MRN-C4101", full_name: "Window Probe Patient", age_years: 60 }
              as: NurseManager
              captures: { wpp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u41}", full_name: "Window Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { wsa: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u41}", full_name: "Window Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { wsb: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${wpp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, afternoon watch" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { wo41: $.data.id, wo41_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${wo41}", staff_id: "${wsa}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T20:01:00Z", expected_order_version: "${wo41_v1}" }
              as: StaffingCoordinator
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${wo41}", staff_id: "${wsa}", shift_start_at: "2026-08-01T12:00:00Z", shift_end_at: "2026-08-01T12:00:00Z", expected_order_version: "${wo41_v1}" }
              as: StaffingCoordinator
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${wo41}", staff_id: "${wsa}", shift_start_at: "2026-08-01T12:00:00Z", shift_end_at: "2026-08-01T20:00:00Z", expected_order_version: "${wo41_v1}" }
              as: StaffingCoordinator
              captures: { wa41a: $.data.id }
            - call: "GET /observation/orders/${wo41}"
              payload: {}
              as: StaffingCoordinator
              captures: { wo41_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${wo41}", staff_id: "${wsb}", shift_start_at: "2026-08-01T12:00:00Z", shift_end_at: "2026-08-01T20:00:00Z", expected_order_version: "${wo41_v2}" }
              as: StaffingCoordinator
              captures: { wa41b: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:44:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${wa41a}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${wsa}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:45:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${wa41a}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${wsa}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T20:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${wa41b}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${wsb}"
          assert:
            - "Probe 1 (721 whole minutes, one over MAX_SHIFT_MINUTES 720): HTTP 422 with data.error_id == ERR_INVALID_SHIFT_WINDOW"
            - "Probe 2 (shift_end_at == shift_start_at): HTTP 422 with data.error_id == ERR_INVALID_SHIFT_WINDOW"
            - "Probe 3 (exactly 480 minutes): HTTP 201 with scheduled_minutes == 480 and provisional_cost_cents == 16000; ObservationOrder.${wo41}.version becomes ${wo41_v2}, proving probes 1 and 2 bumped nothing"
            - "Probe 4: HTTP 201; Unit.${u41}.observed_cost_to_date_cents == 32000 and status == OPEN"
            - "Probe 5 (clock 11:44, sixteen minutes before shift_start_at): HTTP 422 with data.error_id == ERR_OUTSIDE_SHIFT_WINDOW; SitterAssignment.${wa41a}.watch_status stays SCHEDULED and Staff.${wsa}.status stays AVAILABLE"
            - "Probe 6 (clock 11:45, exactly the 15-minute grace): HTTP 200 with watch_status == ON_WATCH, current_segment_started_at == 2026-08-01T11:45:00Z, Staff.${wsa}.status == ON_ASSIGNMENT"
            - "Probe 7 (clock exactly 20:00, equal to shift_end_at): HTTP 422 with data.error_id == ERR_OUTSIDE_SHIFT_WINDOW because the upper bound is strict; SitterAssignment.${wa41b} is still SCHEDULED and Staff.${wsb}.status is still AVAILABLE"
            - "No CostEntry beyond the two PROVISIONAL rows exists — start-watch never bills"

      - name: incident_review_suspends_the_sitter_and_demands_findings_at_close
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STAFF_SUSPENDED
          - errors.ERR_REVIEW_FINDINGS_REQUIRED
          - validations[priority=12]
          - endpoints.POST_observation_safety_events__id_open_incident_review
        distinguishing_aspect: "Both codes hang off the incident-review branch and neither is reachable any other way: SUSPENDED is only ever entered by open-incident-review, and review_findings is mandatory only when the event being closed is in INCIDENT_REVIEW. The recipe raises each once and then closes the event properly, leaving the sitter suspended because closing an event is not a recertification."
        test_recipe:
          setup:
            - "Unit UNIT-C42 budget 250000, video disabled; two admitted patients age 60, each with an ACTIVE FALL-only order (O1 under watch, O2 untouched)."
            - "One INTERNAL_FLOAT sitter at 2000, ADVANCED, certification valid to 2027-01-01, on watch against O1 from 08:00Z."
            - "At 09:00Z the sitter reports a FALL_WITH_INJURY naming the assignment, and the safety officer safety-1 opens the incident review, which suspends the sitter."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C42", name: "Corner Unit Fortytwo", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u42: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u42}", mrn: "MRN-C4201", full_name: "Incident Patient", age_years: 60 }
              as: NurseManager
              captures: { ip42: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u42}", mrn: "MRN-C4202", full_name: "Second Order Patient", age_years: 60 }
              as: NurseManager
              captures: { sp42: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u42}", full_name: "Incident Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { is42: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${ip42}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, one-to-one" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { io42: $.data.id, io42_v1: $.data.version }
            - call: "POST /observation/orders"
              payload: { patient_id: "${sp42}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Second order awaiting a sitter" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { so42: $.data.id, so42_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${io42}", staff_id: "${is42}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${io42_v1}" }
              as: StaffingCoordinator
              captures: { ia42: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ia42}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${is42}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/safety-events"
              payload: { order_id: "${io42}", event_kind: "FALL_WITH_INJURY", narrative: "Unwitnessed fall from bed with a scalp laceration", assignment_id: "${ia42}" }
              as: Sitter
              as_user_id: "${is42}"
              captures: { iev42: $.data.id }
            - call: "POST /observation/safety-events/${iev42}/open-incident-review"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${so42}", staff_id: "${is42}", shift_start_at: "2026-08-02T08:00:00Z", shift_end_at: "2026-08-02T16:00:00Z", expected_order_version: "${so42_v1}" }
              as: StaffingCoordinator
            - call: "POST /observation/safety-events/${iev42}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
            - call: "POST /observation/safety-events/${iev42}/close"
              payload: { resolution: "CONTINUE_OBSERVATION", review_findings: "Bed alarm was disabled; sitter re-education ordered" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          assert:
            - "After the setup: SafetyEvent.${iev42}.status == INCIDENT_REVIEW with review_opened_by_user_id == safety-1; Staff.${is42}.status == SUSPENDED with suspension_reason == INCIDENT_REVIEW_OPENED"
            - "ObservationOrder.${io42}.elopement_risk_score == 3.5 (1.5 baseline + 2.0 for the all-time FALL_WITH_INJURY), reassessment_interval_hours == 12, risk_score_variant == ROLLING_EVENT_WEIGHTED"
            - "Probe 1 (scheduling the suspended sitter on ${so42}, 960 minutes clear of the earlier shift so priorities 17 and 18 pass): HTTP 422 with data.error_id == ERR_STAFF_SUSPENDED"
            - "Probe 1 wrote nothing: GET /observation/orders/${so42}/sitter-assignments returns 0 rows, ObservationOrder.${so42}.version is still ${so42_v1}, and Unit.${u42}.observed_cost_to_date_cents is still 16000"
            - "Probe 2 (close with no review_findings on an INCIDENT_REVIEW event): HTTP 422 with data.error_id == ERR_REVIEW_FINDINGS_REQUIRED; the event stays INCIDENT_REVIEW"
            - "Probe 3: HTTP 200 with status == CLOSED, resolution == CONTINUE_OBSERVATION, closed_by_user_id == safety-2 and review_findings persisted"
            - "Staff.${is42}.status is still SUSPENDED after the close — only POST /observation/staff/{id}/certifications clears it"
            - "SitterAssignment.${ia42}.watch_status is still ON_WATCH and no FINAL_SEGMENT CostEntry has been written"

      - name: discontinuation_review_needs_one_reassessment_on_the_record
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REASSESSMENT_REQUIRED_BEFORE_REVIEW
          - endpoints.POST_observation_orders__id_discontinuation_review
        distinguishing_aspect: "The gate is reassessment_count == 0, not the age of the order, so a brand-new order cannot be walked straight into discontinuation. The same call succeeds immediately after one reassessment, and the order it produces is then immune to the clock sweep."
        test_recipe:
          setup:
            - "Unit UNIT-C43 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order at reassessment_count 0, interval 24 and due 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C43", name: "Corner Unit Fortythree", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u43: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u43}", mrn: "MRN-C4301", full_name: "Review Gate Patient", age_years: 60 }
              as: NurseManager
              captures: { rgp: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${rgp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions pending review" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { rgo: $.data.id, rgo_v1: $.data.version }
          trigger:
            - call: "POST /observation/orders/${rgo}/discontinuation-review"
              payload: { recommendation: "DISCONTINUE" }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${rgo}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { rgr: $.data.id }
            - call: "POST /observation/orders/${rgo}/discontinuation-review"
              payload: { recommendation: "DISCONTINUE" }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "Probe 1: HTTP 422 with data.error_id == ERR_REASSESSMENT_REQUIRED_BEFORE_REVIEW; the order stays ACTIVE at version ${rgo_v1} with discontinuation_recommendation == null"
            - "Probe 2: HTTP 201 with Reassessment ${rgr} carrying score_before == 1.5, score_after == 1.5 and interval_hours_after == 24; the order's reassessment_count becomes 1 and next_reassessment_due_at rebases to 2026-08-02T00:00:00Z"
            - "Probe 3: HTTP 200 with status == DISCONTINUATION_REVIEW, discontinuation_recommendation == DISCONTINUE and discontinuation_review_opened_by_user_id == prov-1"
            - "Probe 4 (an advance well past due + 6h): orders_marked_reassessment_due == 0 and orders_lapsed == 0 — a DISCONTINUATION_REVIEW order is immune to the sweep"
            - "ObservationOrder.${rgo}.status is still DISCONTINUATION_REVIEW and next_reassessment_due_at is still 2026-08-02T00:00:00Z"

      - name: an_order_may_hold_only_one_active_feed_across_all_consoles
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_ACTIVE_FEED
          - validations[priority=24]
        distinguishing_aspect: "The duplicate-feed rule is scoped to the order, not to the console, so a second admission is refused even on an empty station with spare span — priority 22 passes (occupancy 1 of a limit of 2) and 24 is the sole reason for the 409. Releasing the first feed makes the identical second admission legal."
        test_recipe:
          setup:
            - "Unit UNIT-C44 with video_monitoring_enabled true, budget 250000; admitted patient age 60 with an ACTIVE FALL-only order (score 1.5) whose required_modality is VIDEO_MONITORING."
            - "One ADVANCED remote observer, certification valid to 2027, staffing console A (declared_max_span 3) and console B (declared_max_span 2)."
            - "One ACTIVE feed for the order sits on console A."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C44", name: "Corner Unit Fortyfour", observation_cost_budget_cents: 250000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { u44: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u44}", mrn: "MRN-C4401", full_name: "Duplicate Feed Patient", age_years: 60 }
              as: NurseManager
              captures: { dfp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u44}", full_name: "Duplicate Feed Observer", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2200, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { dfo: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${dfp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Fall risk on continuous video observation" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { dfd: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${dfo}", station_label: "CONSOLE-D44A", declared_max_span: 3 }
              as: StaffingCoordinator
              captures: { d44a: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${dfo}", station_label: "CONSOLE-D44B", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { d44b: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${d44a}", order_id: "${dfd}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T16:00:00Z" }
              as: RemoteObserver
              as_user_id: "${dfo}"
              captures: { dff1: $.data.id }
          trigger:
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${d44b}", order_id: "${dfd}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T16:00:00Z" }
              as: RemoteObserver
              as_user_id: "${dfo}"
            - call: "POST /observation/video-feeds/${dff1}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${dfo}"
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${d44b}", order_id: "${dfd}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T16:00:00Z" }
              as: RemoteObserver
              as_user_id: "${dfo}"
              captures: { dff2: $.data.id }
          assert:
            - "Probe 1: HTTP 409 with data.error_id == ERR_DUPLICATE_ACTIVE_FEED — not ERR_SPAN_OF_CONTROL_EXCEEDED, since console B's pre-candidate effective_span_limit is 2 and the occupancy including the candidate is only 1"
            - "Probe 1 wrote nothing: MonitoringStation.${d44b}.active_feed_count == 0, active_acuity_weight == 0.0, status == IDLE and its version did not move"
            - "Probe 2: HTTP 200 with status == RELEASED, release_reason == OBSERVER_RELEASE; MonitoringStation.${d44a}.active_feed_count == 0, active_acuity_weight == 0.0, effective_span_limit == 3, status == IDLE; Staff.${dfo}.status == AVAILABLE"
            - "Probe 3: HTTP 201 with the same payload that failed as probe 1 — the order no longer holds an ACTIVE feed"
            - "MonitoringStation.${d44b}.active_feed_count == 1, active_acuity_weight == 1.0, effective_span_limit == 2, status == ACTIVE_MONITORING; Staff.${dfo}.status == ON_ASSIGNMENT again"
            - "GET /observation/orders/${dfd}/video-feeds returns 2 rows: ${dff1} RELEASED and ${dff2} ACTIVE"

      - name: handoff_documentation_cannot_be_drafted_twice_or_signed_twice
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_HANDOFF_STATE
          - endpoints.POST_observation_handoffs
          - endpoints.POST_observation_handoffs__id_countersign
        distinguishing_aspect: "ERR_INVALID_HANDOFF_STATE has two distinct triggers on two different endpoints — drafting against an outgoing watch whose documentation_status has already left PENDING, and countersigning a record that is already SIGNED — and both are exercised here on one record so the shared code is proved reachable from both sides."
        test_recipe:
          setup:
            - "Unit UNIT-C45 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Two INTERNAL_FLOAT sitters at 2000, ADVANCED with unexpired certifications: OUT holds 08:00-16:00 and IN holds 16:00-24:00 on the same order."
            - "OUT drafts the handoff naming IN, which moves OUT's documentation_status PENDING -> HANDOFF_DRAFTED."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C45", name: "Corner Unit Fortyfive", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u45: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u45}", mrn: "MRN-C4501", full_name: "Handoff State Patient", age_years: 60 }
              as: NurseManager
              captures: { hsp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u45}", full_name: "State Sitter Out", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { hso: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u45}", full_name: "State Sitter In", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { hsi: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${hsp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Two-shift fall watch" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { hso45: $.data.id, hso45_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${hso45}", staff_id: "${hso}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${hso45_v1}" }
              as: StaffingCoordinator
              captures: { hsa_out: $.data.id }
            - call: "GET /observation/orders/${hso45}"
              payload: {}
              as: StaffingCoordinator
              captures: { hso45_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${hso45}", staff_id: "${hsi}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${hso45_v2}" }
              as: StaffingCoordinator
              captures: { hsa_in: $.data.id }
            - call: "POST /observation/handoffs"
              payload: { outgoing_assignment_id: "${hsa_out}", incoming_assignment_id: "${hsa_in}", behavior_summary: "Restless but redirectable", interventions_used: ["VERBAL_REDIRECTION", "BED_ALARM"] }
              as: Sitter
              as_user_id: "${hso}"
              captures: { hrec45: $.data.id }
          trigger:
            - call: "POST /observation/handoffs"
              payload: { outgoing_assignment_id: "${hsa_out}", incoming_assignment_id: "${hsa_in}", behavior_summary: "Second draft attempt", interventions_used: ["VERBAL_REDIRECTION"] }
              as: Sitter
              as_user_id: "${hso}"
            - call: "POST /observation/handoffs/${hrec45}/countersign"
              payload: {}
              as: Sitter
              as_user_id: "${hsi}"
            - call: "POST /observation/handoffs/${hrec45}/countersign"
              payload: {}
              as: Sitter
              as_user_id: "${hsi}"
          assert:
            - "Probe 1: HTTP 409 with data.error_id == ERR_INVALID_HANDOFF_STATE because SitterAssignment.${hsa_out}.documentation_status is HANDOFF_DRAFTED, not PENDING"
            - "Probe 1 created no second record: GET /observation/sitter-assignments/${hsa_out}/handoffs returns exactly 1 row, ${hrec45}, still DRAFTED"
            - "Probe 2: HTTP 200 with documentation_state == SIGNED, countersigned_by_staff_id == ${hsi} and countersigned_at == 2026-08-01T00:00:00Z (the logical clock)"
            - "SitterAssignment.${hsa_out}.documentation_status == HANDOFF_SIGNED while its watch_status is still SCHEDULED"
            - "Probe 3: HTTP 409 with data.error_id == ERR_INVALID_HANDOFF_STATE because the record is already SIGNED; countersigned_by_staff_id, countersigned_at and HandoffRecord.version are all unchanged from probe 2"
            - "Unit.${u45}.observed_cost_to_date_cents == 32000 throughout — documentation never touches the ledger"

  - section: rbac
    instances:
      - name: every_exclusive_write_rejects_the_roles_that_do_not_own_it
        claim_type: role_restriction
        grounds:
          - roles.AttendingProvider.exclusive_operations
          - roles.NurseManager.exclusive_operations
          - roles.StaffingCoordinator.exclusive_operations
          - roles.Sitter.exclusive_operations
          - roles.RemoteObserver.exclusive_operations
          - roles.SafetyOfficer.exclusive_operations
          - roles.SystemAdmin.exclusive_operations
        distinguishing_aspect: "The write surface is partitioned, so each probe sends a fully well-formed body as the wrong role and must still be refused at priority 2 — ahead of shape, path and FK resolution, which is why unknown path ids in these probes never surface a 404. The last probe is the inverse case: SystemAdmin, which may otherwise write anything, is refused POST /observation/safety-events because reported_by_staff_id has to be a real Staff.id."
        test_recipe:
          setup:
            - "Unit UNIT-C46 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order; one INTERNAL_FLOAT sitter, ADVANCED, certification valid to 2027."
            - "Every probe below is a legal payload sent under an illegal role."
