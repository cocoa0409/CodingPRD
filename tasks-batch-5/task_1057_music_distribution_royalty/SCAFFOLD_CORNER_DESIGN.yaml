            - call: "POST /api/royalty-statements/${stmt_id}/reconcile"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-2"
            - call: "GET /api/payouts"
              payload: { collaborator_id: "${c1}" }
              as: FinanceOps
              as_user_id: "fin-3"
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-3"
          trigger:
            - call: "POST /api/payouts/${payout_id}/pay"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-3"
              captures: { err: $.data.error_id }
            - call: "POST /api/payouts/${payout_id}/pay"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-4"
              captures: { err2: $.data.error_id }
          assert:
            - "RoyaltyStatement.${stmt_id}.commission_cents == 50 and net_cents == 1999"
            - "Payout.${payout_id}.net_cents == 1999, auto_approved == false, approved_by_user_id == fin-3"
            - "The fin-3 pay returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "The fin-4 pay returns HTTP 422 with data.error_id == ERR_PAYOUT_BELOW_THRESHOLD"
            - "Payout.${payout_id}.status == APPROVED"
            - "Collaborator.${c1}.lifetime_paid_cents == 0"

  # =====================================================================
  # Cross-cutting complexity layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:

      - name: split_sheet_create_with_stale_track_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[split-sheet-create-stale-track]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=8]"
        distinguishing_aspect: "Creating a second SplitSheet while still carrying the Track version observed before the first create returns 412 ERR_STALE_VERSION; re-reading the track and using the fresh version succeeds."
        test_recipe:
          setup: ["Artist CEPHEUS on an ACTIVE PRO subscription with a DRAFT release and one track at version 1."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Cepheus", legal_name: "Cepheus LLC", country_code: "US", email: "cepheus@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-cepheus-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "King", release_date: "2026-09-01T00:00:00Z", primary_genre: "Pop", label_name: "Cepheus Rec" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Crown", duration_seconds: 175, track_number: 1, isrc: "USCEP2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id, track_v1: $.data.version }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_v1}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_a: $.data.id }
          trigger:
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-02-01T00:00:00Z", expected_track_version: "${track_v1}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/tracks/${track_a}"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_v2: $.data.version }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-02-01T00:00:00Z", expected_track_version: "${track_v2}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_b: $.data.id }
          assert:
            - "The stale create returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "GET /api/split-sheets?track_id=${track_a} returns exactly 1 row after the stale create"
            - "The retried create with the fresh version returns HTTP 201"
            - "GET /api/split-sheets?track_id=${track_a} returns exactly 2 rows afterwards"
            - "Track.${track_a}.version increased by exactly 1 per successful split-sheet create"

      - name: royalty_ingest_with_stale_statement_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[royalty-ingest-stale-statement]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=8]"
        distinguishing_aspect: "Replaying an ingest batch with the statement version observed before the first batch returns 412 ERR_STALE_VERSION and does not append duplicate lines, keeping line_count at 1 and gross_cents at 500."
        test_recipe:
          setup: ["Artist LACERTA2 with one track and an OPEN statement over [2026-05-01, 2026-06-01)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Lacerta2", legal_name: "Lac2 LLC", country_code: "US", email: "lac2@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-lac2-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Feed", release_date: "2026-09-01T00:00:00Z", primary_genre: "Pop", label_name: "Lac2 Rec" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Batch", duration_seconds: 155, track_number: 1, isrc: "USLC22600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id }
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id, stmt_v1: $.data.version }
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v1}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 100, gross_cents: 500, source: "STREAMING", reported_at: "2026-05-05T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_v2: $.data.version }
          trigger:
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v1}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 100, gross_cents: 500, source: "STREAMING", reported_at: "2026-05-05T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response data.error_id == ERR_STALE_VERSION"
            - "RoyaltyStatement.${stmt_id}.line_count == 1"
            - "RoyaltyStatement.${stmt_id}.gross_cents == 500"
            - "${stmt_v2} == ${stmt_v1} + 1"

      - name: cascading_side_effects_depth_three_and_four
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Release.LIVE_to_TAKEN_DOWN"
        excluded_because:
          difficulty_instance: confirm_takedown_depth_four_cascade_to_subscription_slots
          rationale: "The four-hop chain and its per-hop assertions live in that §1.8 instance."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.collaborator_withholding_bps"
        excluded_because:
          difficulty_instance: collaborator_treaty_vs_statutory_withholding_divergence
          rationale: "Treaty-versus-statutory divergence on identical gross is asserted there."

      - name: rate_threshold_trigger_at_payout_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=28]"
        excluded_because:
          difficulty_instance: payout_pay_at_exactly_2000_cents_versus_1999
          rationale: "The 2000/1999 boundary pair is the whole content of that §1.8 instance."

  # =====================================================================
  # Consistency model
  # =====================================================================
  - section: consistency_model
    instances:

      - name: close_response_body_already_reflects_all_cascaded_state
