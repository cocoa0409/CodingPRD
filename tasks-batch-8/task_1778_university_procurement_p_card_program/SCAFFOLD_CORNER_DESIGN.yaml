  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_requisition_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules", "requisition", "edit", "stale", "version", "errors", "ERR_STALE_VERSION"]
        distinguishing_aspect: "OCC on Requisition.version via two strictly sequential requests: after a return-step bumps the version, a PATCH carrying the pre-return version is rejected 412, and the same PATCH with the fresh version succeeds and bumps the version again."
        test_recipe:
          setup: ["Department; vendor; requisition 600,000 submitted then RETURNED (version 3 captured at the return response)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "OCC1", cost_center: "CC-5300", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "OccCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "OCC", description: "widget", quantity: 1, unit_price_cents: 600000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/return-step"
              payload: { reason: "revise" }
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
              captures: { r_v: $.data.version }
          trigger:
            - call: "PATCH /requisitions/${r_id}"
              payload: { expected_requisition_version: "${r_v} - 1", sole_source_justification: "stale write" }
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
            - call: "PATCH /requisitions/${r_id}"
              payload: { expected_requisition_version: "${r_v}", sole_source_justification: "fresh write" }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_v2: $.data.version }
          assert:
            - "stale PATCH (expected version one behind): err == ERR_STALE_VERSION (412)"
            - "fresh PATCH: succeeds and version == captured version + 1 (4)"

