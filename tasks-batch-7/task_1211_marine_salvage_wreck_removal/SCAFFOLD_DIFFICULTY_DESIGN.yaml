          assert:
            - "First activation attempt: error_id == ERR_PERMIT_MISSING (ENV_AGENCY absent while COAST_GUARD GRANTED)"
            - "OperationPhase.${ph_id}.status stays PLANNED after the rejection"
            - "After granting ENV_AGENCY: second activation succeeds, status == ACTIVE"

      - name: arbitration_blocked_until_all_lots_terminal
        grounds:
          - state_machines.SalvageAward.COMPUTED_to_IN_ARBITRATION
          - state_machines.RecoveredProperty.SALVED_to_SECURED_ASHORE
          - "errors[ERR_PROPERTIES_NOT_DISPOSED]"
        distinguishing_aspect: |
          Entity pair SalvageAward -> RecoveredProperty: submit-arbitration is
