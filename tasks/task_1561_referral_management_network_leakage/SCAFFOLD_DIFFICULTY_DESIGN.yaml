            - call: "POST /referrals/${r}/accept"
              as: ReferralCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59Z" }
              as: NetworkAdmin
            - call: "POST /referrals/aging-sweep"
              as: ReferralCoordinator
              captures: { n1: $.data.expired_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /referrals/aging-sweep"
              as: ReferralCoordinator
              captures: { n2: $.data.expired_count }
          assert:
            - "Referral.${r}.sla_due_at == \"2026-08-31T00:00:00Z\""
            - "first sweep expired_count == 0 and Referral.${r}.status == ACCEPTED (one second before boundary)"
            - "second sweep expired_count == 1 and Referral.${r}.status == EXPIRED (exactly at boundary, inclusive)"
            - "GET /referrals/${r}/leakage-records shows 1 row with category == EXPIRED_UNRESOLVED"

