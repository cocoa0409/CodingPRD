        claim_type: Violation to Error
        grounds:
          - "errors[ERR_TANK_TIME_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_tank_buffer_overlap
          rationale: "ERR_TANK_TIME_CONFLICT is the asserted outcome of the tank buffer-overlap difficulty instance."

      - name: error_attendant_time_conflict
        claim_type: Violation to Error
        grounds:
          - "errors[ERR_ATTENDANT_TIME_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_attendant_no_buffer_overlap
          rationale: "ERR_ATTENDANT_TIME_CONFLICT is the asserted outcome of the attendant-overlap difficulty instance."

      - name: error_stale_version_on_renew
        claim_type: Violation to Error
        grounds:
          - "errors[ERR_STALE_VERSION]"
          - "concurrency_rules[membership-renew-stale-version]"
        distinguishing_aspect: "Renewing with a stale expected_membership_version (one less than current) -> ERR_STALE_VERSION 412; cycle not advanced."
        test_recipe:
          setup: ["an ACTIVE membership; one successful renew already advanced its version"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sv@x.com", full_name: "S V" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { v_act: $.data.version }
            - call: "POST /memberships/${ship_id}/renew"
              payload: { expected_membership_version: "${v_act}" }
              as: FrontDesk
              captures: { v_after: $.data.version }
          trigger:
            - call: "POST /memberships/${ship_id}/renew"
              payload: { expected_membership_version: "${v_act}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "error_id == ERR_STALE_VERSION"

