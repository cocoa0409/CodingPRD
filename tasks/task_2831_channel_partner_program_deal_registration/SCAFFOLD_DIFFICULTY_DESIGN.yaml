  # =========================================================================
  # Rule 8 - resource/temporal overlap under two different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusivity_half_open_single_occupant_with_renewal_exemption
        grounds:
          - calculations.exclusivity_window
          - validations[priority=30]
          - validations[priority=44]
          - state_machines.DealRegistration.APPROVED_to_SUPERSEDED
          - state_machines.Account.CHANNEL_PROTECTED_to_CHANNEL_PROTECTED
        distinguishing_aspect: |
          Resource = the (Account, product_line) exclusivity slot; interval semantics = HALF-OPEN
          [start, end) with a SINGLE occupant and never a union: while the incumbent window is
          live a rival's submit is refused, but the incumbent's own renewal (supersedes_
          registration_id) is exempt and, once approved, REPLACES the window
          ([2026-04-15, 2026-05-15) - not [2026-04-01, 2026-05-15)) leaving the account
          CHANNEL_PROTECTED throughout.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two RESELLER partners each with one TECH_ASSOCIATE certification and marketing_commitment_cents = 0."
