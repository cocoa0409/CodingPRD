            - "after trigger[0]: ElevatorCar.${z1_id}.compliance_state == \"CERTIFIED\""
            - "after trigger[1]: ElevatorCar.${z1_id}.compliance_state == \"CERTIFICATE_EXPIRED\""
            - "after trigger[1]: ElevatorCar.${z1_id}.availability_state == \"OUT_OF_SERVICE\""
            - "after trigger[1]: StateInspection.${iz_id}.certificate_state == \"EXPIRED\""
            - "after trigger[1]: StateInspection.${iz_id}.status == \"COMPLETED\""
