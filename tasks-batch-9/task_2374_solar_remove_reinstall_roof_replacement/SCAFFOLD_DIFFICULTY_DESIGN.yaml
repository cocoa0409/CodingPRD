              captures: { permit2_id: $.data.id }
            - call: "POST /reroof/permit-applications/${permit2_id}/submission"
              payload: {}
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/permit-applications/${permit1_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-12", window_start_utc: "2026-08-12T08:00:00Z", window_end_utc: "2026-08-12T12:00:00Z" }
              as: ProjectCoordinator
              captures: { insp1: $.data.id }
            - call: "POST /reroof/permit-applications/${permit2_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-12", window_start_utc: "2026-08-12T12:00:00Z", window_end_utc: "2026-08-12T16:00:00Z" }
              as: ProjectCoordinator
              captures: { insp2: $.data.id }
            - call: "POST /reroof/permit-applications/${permit1_id}/inspections"
              payload: { inspection_type: "MOUNTING", slot_date: "2026-08-12", window_start_utc: "2026-08-12T18:00:00Z", window_end_utc: "2026-08-12T20:00:00Z" }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /reroof/inspections/${insp1}/result"
              payload: { result: "PASS", result_note: "Deck approved" }
              as: AHJInspector
              as_user_id: "${juris_id}"
            - call: "POST /reroof/permit-applications/${permit1_id}/inspections"
              payload: { inspection_type: "MOUNTING", slot_date: "2026-08-12", window_start_utc: "2026-08-12T18:00:00Z", window_end_utc: "2026-08-12T20:00:00Z" }
              as: ProjectCoordinator
              captures: { insp3: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 201 and Inspection.${insp1}.status == SCHEDULED"
            - "trigger call 2 returns HTTP 201 and Inspection.${insp2}.status == SCHEDULED"
            - "trigger call 3 returns HTTP 409"
            - "${err_id} == ERR_INSPECTION_SLOT_FULL"
            - "after trigger call 4, Inspection.${insp1}.status == PASSED"
            - "Inspection.${insp1}.inspected_at == 2026-08-10T00:00:00.000Z"
            - "trigger call 5 returns HTTP 201 and Inspection.${insp3}.status == SCHEDULED"
            - "Inspection.${insp3}.slot_date == 2026-08-12"
            - "Inspection.${insp3}.attempt_number == 1"

  - rule_id: compensating_invariant
    instances:
      - name: credit_ledger_identity_survives_the_veto_release_of_reserved_downtime_credit
        grounds:
          - state_machines.ReroofProject.DEENERGIZED_to_APPROVALS_OPEN
          - validations[priority=31]
          - entities.ReroofProject.fields.credit_authorized_cents
          - endpoints["GET /reroof/projects/{id}/downtime-summary"]
          - calculations.downtime_production_loss_credit
        distinguishing_aspect: |
          Conserved quantity: money - credit_authorized_cents == credit_reserved_cents +
          credit_settled_cents + credit_released_cents. The veto moves the whole 5261-cent reservation
          into released without changing the authorized total, so the identity holds both before and
          after the compensating edge and the computed read reports ledger_balanced true on both sides.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then 2026-08-03T09:00:00Z for de-energization."
            - "A LEASE project with baseline_daily_kwh 41.75 and downtime_days_estimated 9, consented by all three parties."
            - "Its only circuit is de-energized, so provisional_credit_cents == 5261 is authorized and reserved."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 12, dc_kw: 4.92 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
          trigger:
            - call: "GET /reroof/projects/${proj_id}/downtime-summary"
              as: ProjectCoordinator
              captures: { before_authorized: $.data.credit_authorized_cents, before_reserved: $.data.credit_reserved_cents, before_balanced: $.data.ledger_balanced }
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "REQUEST_CHANGES", decision_note: "Credit rider unresolved" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "GET /reroof/projects/${proj_id}/downtime-summary"
              as: ProjectCoordinator
              captures: { after_authorized: $.data.credit_authorized_cents, after_reserved: $.data.credit_reserved_cents, after_released: $.data.credit_released_cents, after_balanced: $.data.ledger_balanced }
          assert:
            - "${before_authorized} == 5261"
            - "${before_reserved} == 5261"
            - "${before_balanced} == true"
            - "${after_authorized} == 5261"
            - "${after_reserved} == 0"
            - "${after_released} == 5261"
            - "${after_balanced} == true"
            - "ReroofProject.${proj_id}.credit_settled_cents == 0"
            - "ReroofProject.${proj_id}.provisional_credit_cents == 5261"
            - "ReroofProject.${proj_id}.phase == APPROVALS_OPEN"

      - name: unit_population_identity_holds_when_a_stored_panel_is_scrapped_and_frees_its_slot
        grounds:
          - calculations.storage_bin_occupancy
          - state_machines.HardwareUnit.STORED_to_SCRAPPED
          - state_machines.HardwareUnit.REMOVED_to_STORED
          - entities.ReroofProject.fields.registered_unit_count
          - entities.StorageBin.fields.occupied_slots
        distinguishing_aspect: |
          Conserved quantity: the unit population, not money - registered_unit_count always equals
          the sum of the five handling buckets, and the sum of bin occupied_slots always equals the
          count of STORED units. The forward step stores a third panel (occupied 2 -> 3) and the
          compensating step scraps it (occupied 3 -> 2) while registered_unit_count stays 3 and the
          scrapped unit keeps storage_bin_id and storage_label as provenance without holding a slot.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project consented by roofer and solar owner, one circuit S1, one bin BIN-A with capacity_slots 4."
            - "Three panels u1, u2, u3 are registered on S1; the circuit is de-energized and all three are removed."
            - "u1 and u2 are stored and graded SERVICEABLE, so BIN-A.occupied_slots == 2 and registered_unit_count == 3."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 3, dc_kw: 1.23 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/storage-bins"
              payload: { bin_label: "BIN-A", capacity_slots: 4, climate_controlled: true }
              as: ProjectCoordinator
              captures: { bin_a: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0002", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u2: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0003", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u3: $.data.id }
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u3}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/condition-grade"
              payload: { condition_grade: "SERVICEABLE", disposition: "RETAIN" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/condition-grade"
              payload: { condition_grade: "SERVICEABLE", disposition: "RETAIN" }
              as: SolarContractor
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /reroof/hardware-units/${u3}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u3}/condition-grade"
              payload: { condition_grade: "DAMAGED", disposition: "SCRAP", damage_note: "Shattered glass, unsalvageable" }
              as: SolarContractor
              as_user_id: "${crew_id}"
          assert:
            - "after trigger call 1, StorageBin.${bin_a}.occupied_slots == 3"
            - "after trigger call 1, HardwareUnit.${u3}.storage_label == BIN-A-3"
            - "after trigger call 1, ReroofProject.${proj_id}.stored_unit_count == 3"
            - "after trigger call 2, StorageBin.${bin_a}.occupied_slots == 2"
            - "after trigger call 2, HardwareUnit.${u3}.handling_status == SCRAPPED"
            - "after trigger call 2, HardwareUnit.${u3}.condition_grade == DAMAGED"
            - "after trigger call 2, HardwareUnit.${u3}.storage_bin_id == ${bin_a}"
            - "after trigger call 2, HardwareUnit.${u3}.storage_label == BIN-A-3"
            - "ReroofProject.${proj_id}.registered_unit_count == 3"
            - "ReroofProject.${proj_id}.stored_unit_count == 2"
            - "ReroofProject.${proj_id}.scrapped_unit_count == 1"
            - "ReroofProject.${proj_id}.damaged_unit_count == 1"
