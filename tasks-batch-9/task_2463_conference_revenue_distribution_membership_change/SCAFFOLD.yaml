    input: ["member_id?", "status?", "limit?", "offset?"]
    output: DistributionLine[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_DISTRIBUTION_RUN_NOT_FOUND, ERR_INVALID_PAGINATION]

  - method: GET
    path: /distribution-runs/{id}/reconciliation
    description: "Return the cent-conservation identity for a run: the net pool minus the reserve draw and every line-level component must be exactly zero."
    roles: [Commissioner, FinanceOfficer, Treasurer, Auditor, PlatformAdmin]
    input: []
    output: "{ distribution_run_id: string, net_pool_cents: integer, reserve_draw_cents: integer, total_net_payable_cents: integer, total_withheld_cents: integer, total_governance_fee_cents: integer, total_gor_offset_cents: integer, reconciliation_delta_cents: integer }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_DISTRIBUTION_RUN_NOT_FOUND]

  - method: POST
    path: /distribution-runs/{id}/post
    description: "Post a COMPUTED run to the members. A different user from the one who computed it must post it, and a FINAL_AUDITED run additionally requires an ISSUED audit report."
    roles: [Treasurer]
    input: []
    output: DistributionRun
    side_effects:
      - "sets status POSTED and records posted_by_user_id from X-User-ID"
      - "adds the run's total_withheld_cents to Conference.escrow_balance_cents and its reserve_draw_cents to Conference.reserve_balance_cents, then re-derives reserve_posture"
      - "adds the sum of DistributionLine.governance_fee_cents to Conference.governance_fee_revenue_cents"
      - "advances Member.exit_settlement_paid_cents by each line's gor_offset_cents"
      - "for a FINAL_AUDITED MEDIA_RIGHTS run, writes each line's gross_share_cents to Member.last_full_annual_distribution_cents"
      - "increments Conference version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_DISTRIBUTION_RUN_NOT_FOUND, ERR_RUN_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES, ERR_AUDIT_REPORT_NOT_ISSUED]

  - method: POST
    path: /distribution-runs/{id}/reverse
    description: "Reverse a POSTED run, restoring every conference-level counter it moved and voiding its lines."
    roles: [Treasurer]
    input: ["reason"]
    output: DistributionRun
    side_effects:
      - "sets status REVERSED and sets every ACTIVE line to VOIDED"
      - "subtracts the run's total_withheld_cents from Conference.escrow_balance_cents and its reserve_draw_cents from Conference.reserve_balance_cents, then re-derives reserve_posture"
      - "subtracts the sum of DistributionLine.governance_fee_cents from Conference.governance_fee_revenue_cents"
      - "rolls back Member.exit_settlement_paid_cents by each line's gor_offset_cents"
      - "increments Conference version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_DISTRIBUTION_RUN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_RUN_STATE_INVALID]

