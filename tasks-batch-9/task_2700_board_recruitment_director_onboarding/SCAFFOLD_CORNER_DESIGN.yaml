            - call: "GET /governance/skill-ratings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { rating_nf: $.data.error_id }
            - call: "GET /governance/screens/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { screen_nf: $.data.error_id }
            - call: "GET /governance/external-directorships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { directorship_nf: $.data.error_id }
            - call: "GET /governance/interviews/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { interview_nf: $.data.error_id }
            - call: "GET /governance/committees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { committee_nf: $.data.error_id }
            - call: "GET /governance/assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { assignment_nf: $.data.error_id }
            - call: "GET /governance/slates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { slate_nf: $.data.error_id }
            - call: "GET /governance/slate-nominees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { nominee_nf: $.data.error_id }
            - call: "GET /governance/votes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { vote_nf: $.data.error_id }
            - call: "GET /governance/onboarding-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { item_nf: $.data.error_id }
            - call: "GET /governance/comp-awards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { award_nf: $.data.error_id }
            - call: "POST /governance/directors/${dir_id}/skill-ratings"
              payload: { skill_category_id: "00000000-0000-4000-8000-000000000000", self_rating: 4 }
              as: GovernanceStaff
              captures: { category_nf: $.data.error_id }
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "00000000-0000-4000-8000-000000000000", start_on: "2026-01-01", director_id: "${dir_id}", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { company_nf: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with response_type == \"error\""
            - "The path-id calls return, in order, ERR_POLICY_NOT_FOUND, ERR_SEARCH_FIRM_NOT_FOUND, ERR_DIRECTOR_NOT_FOUND, ERR_SKILL_RATING_NOT_FOUND, ERR_SCREEN_NOT_FOUND, ERR_DIRECTORSHIP_NOT_FOUND, ERR_INTERVIEW_NOT_FOUND, ERR_COMMITTEE_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_SLATE_NOT_FOUND, ERR_NOMINEE_NOT_FOUND, ERR_VOTE_NOT_FOUND, ERR_ONBOARDING_ITEM_NOT_FOUND and ERR_COMP_AWARD_NOT_FOUND"
            - "The body-id calls return ERR_SKILL_CATEGORY_NOT_FOUND and ERR_EXTERNAL_COMPANY_NOT_FOUND, proving priority 21 resolves ids inside the body as well"
            - "No row is created by either create call: GET /governance/skill-ratings and GET /governance/external-directorships both return 0 rows"

      - name: overboarding_error_is_exercised_by_the_off_by_one_boundary
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OVERBOARDING_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / overboarding_limit_off_by_one_three_boards_admitted_four_boards_rejected
          rationale: "The error is raised there on both the nominee-add and the external-directorship endpoints, with the admitted side asserted as well."

      - name: assignment_term_overlap_and_seat_exhaustion_errors_are_exercised_together
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSIGNMENT_TERM_OVERLAP]
          - errors[ERR_COMMITTEE_SEATS_EXHAUSTED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / committee_assignment_closed_term_overlap_then_seat_capacity_exhaustion
          rationale: "That instance walks the closed-interval overlap rejection and then fills the committee to its authorized seats to raise the exhaustion error."

      - name: interviewer_double_booking_error_is_exercised_by_the_half_open_calendar
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INTERVIEWER_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / interviewer_calendar_half_open_adjacency_allowed_but_overlap_rejected
          rationale: "Adjacent-allowed and overlapping-rejected are both asserted there against the same interviewer calendar."

      - name: interlock_and_fee_budget_errors_are_exercised_by_the_priority_pair
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INTERLOCK_LIMIT_EXCEEDED]
          - errors[ERR_SEARCH_FEE_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / interlock_safety_error_wins_over_search_fee_budget_error_on_nominee_add
          rationale: "Both errors are provoked there - the interlock error as the winner of the conflicting pair and the budget error on its own once the interlock is cleared."

      - name: onboarding_incomplete_and_not_seatable_errors_are_exercised_by_the_seating_gate
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ONBOARDING_INCOMPLETE]
          - errors[ERR_DIRECTOR_NOT_SEATABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / seating_a_director_requires_every_required_onboarding_item_complete
          rationale: "The seating gate raises ERR_ONBOARDING_INCOMPLETE there, and the companion renomination instance raises ERR_DIRECTOR_NOT_SEATABLE on the nominee-add path."

      - name: independence_shortfall_error_is_exercised_by_the_cascade_that_voids_a_nominee
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INDEPENDENCE_SHORTFALL]
        excluded_because:
          difficulty_instance: transitive_cascade / supplemental_rescreen_not_independent_cascades_screen_to_candidate_to_nominee_to_slate_to_ballots
          rationale: "After the cascade voids the independent nominee the slate falls below the floor and re-submission raises the error there."

  - section: rbac
    instances:
      - name: staff_and_members_cannot_reach_secretary_or_chair_exclusive_operations
        claim_type: exclusive_operation_denied
        grounds:
          - roles.CorporateSecretary.exclusive_operations
          - roles.CommitteeChair.exclusive_operations
          - validations.priority_2.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Priority 2 rejects a role that is not in the endpoint's roles list before any state or payload check
          runs, so GovernanceStaff cannot adopt a policy or determine a screen and a CommitteeMember cannot
          decide a slate - each returns 403 ERR_UNAUTHORIZED rather than the state error the same call would
          otherwise hit.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SEATED chair director, one candidate with a DRAFT screen and one DRAFT slate for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Sam Sourced", email: "sam@cand.example", birth_date: "1974-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/candidates/${cand_id}/screens"
              payload: { payments_to_company_cents: 0, recipient_gross_revenue_cents: 0, family_member_employed: false, auditor_affiliation: false, charitable_contributions_cents: 0, company_gross_revenue_cents: 0 }
              as: GovernanceStaff
              captures: { screen_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id }
          trigger:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2027, effective_from: "2027-01-01T00:00:00Z" }
              as: GovernanceStaff
              captures: { policy_role_error_id: $.data.error_id }
            - call: "POST /governance/screens/${screen_id}/determine"
              payload: {}
              as: GovernanceStaff
              captures: { determine_role_error_id: $.data.error_id }
            - call: "POST /governance/slates/${slate_id}/decide"
              payload: { decision: "APPROVE", rationale: "Member overreach" }
              as: CommitteeMember
              as_user_id: "${chair_id}"
              captures: { decide_role_error_id: $.data.error_id }
          assert:
            - "All three calls return HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "The determine attempt does NOT return \"ERR_SCREEN_STATE_INVALID\", even though the screen is only DRAFT"
            - "The decide attempt does NOT return \"ERR_SLATE_STATE_INVALID\", even though the slate is only DRAFT"
            - "Exactly one GovernancePolicy row exists, IndependenceScreen.${screen_id}.status is still \"DRAFT\" and NominationSlate.${slate_id}.status is still \"DRAFT\""

      - name: the_secretary_and_the_chair_can_each_run_their_own_exclusive_operations
        claim_type: exclusive_operation_allowed
        grounds:
          - roles.CorporateSecretary.exclusive_operations
          - roles.CommitteeChair.exclusive_operations
          - endpoints.POST_/governance/skill-ratings/{rating_id}/validate
        distinguishing_aspect: |
          The positive half of the RBAC matrix: the same four calls that fail for other roles succeed for
          their owners - the secretary charters a committee and the chair both determines a screen and
          validates a skill rating - and each returns its declared success code with the declared side
          effects applied.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SkillCategory CYBER, one SEATED chair director with an UNVALIDATED rating on CYBER, and one candidate with a SUBMITTED screen."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER", name: "Cybersecurity Oversight", strategic_weight: 0.80, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
