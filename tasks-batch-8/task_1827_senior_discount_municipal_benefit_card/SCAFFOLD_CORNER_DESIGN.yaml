        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[card-issue-stale-cardholder]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Cardholder.version: a first REPLACEMENT with the observed version succeeds and advances the version by 1; replaying the same expected_cardholder_version now fails 412 ERR_STALE_VERSION — deterministic, sequential, no parallelism."
