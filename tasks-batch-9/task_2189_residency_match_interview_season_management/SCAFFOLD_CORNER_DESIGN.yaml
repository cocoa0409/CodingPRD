              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /programs"
              payload: { name: "Metro Pathology", nrmp_program_code: "1140140M0", specialty_code: "PATH", quota_positions: 1 }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 409 with data.error_id == 'ERR_DUPLICATE_RESOURCE'"
            - "GET /programs reports total_count == 1"
            - "Program.${prog_id}.name is still 'Metro Internal Medicine'"

