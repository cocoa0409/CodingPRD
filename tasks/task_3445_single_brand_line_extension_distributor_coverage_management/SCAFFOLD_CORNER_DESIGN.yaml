            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: false, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
