            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_ROUTE_NOT_DISPATCHED"
            - "ServiceStop.${del_stop}.status == ASSIGNED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_same_day_route_collision
        grounds:
          - entities.Route.fields.truck_code
          - entities.Route.fields.service_date
          - validations[priority=15]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Interval semantics: same-day point collision on the Route resource — a
          truck_code may run at most one route per service_date, so a second route with
          the same (truck_code, service_date) is rejected with ERR_DUPLICATE_RESOURCE;
          changing either the date or the truck removes the collision.
        test_recipe:
          setup:
            - "One PLANNING route truck_code=TRKP on 2026-06-01"
          setup_api_calls:
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKP", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKP", capacity_stops: 5 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: permit_window_closed_interval_overlap
        grounds:
          - state_machines.StreetPermit.REQUESTED_to_APPROVED
          - entities.StreetPermit.fields.valid_from
          - entities.StreetPermit.fields.valid_until
          - validations[priority=11]
          - errors[ERR_PERMIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: closed-interval [valid_from, valid_until] range overlap on
          the StreetPermit resource (different geometry than the Route same-day point
          collision). For one order, an APPROVED permit 2026-06-01..2026-06-10 blocks
          approving a second permit 2026-06-10..2026-06-15 because they share the
          boundary day 2026-06-10; ERR_PERMIT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "current_date 2026-05-15 so both windows are still approvable"
            - "Order with two REQUESTED permits whose closed windows touch at 2026-06-10; first approved"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-05-15" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Perm", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "15 Oak", requested_delivery_date: "2026-06-05", requires_street_permit: true }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /street-permits"
              payload: { order_id: "${ord}", municipality: "Town", permit_fee_cents: 10000, valid_from: "2026-06-01", valid_until: "2026-06-10" }
              as: PermitOfficer
              captures: { p1: $.data.id }
            - call: "POST /street-permits"
              payload: { order_id: "${ord}", municipality: "Town", permit_fee_cents: 10000, valid_from: "2026-06-10", valid_until: "2026-06-15" }
              as: PermitOfficer
              captures: { p2: $.data.id }
            - call: "POST /street-permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /street-permits/${p2}/approve"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_PERMIT_WINDOW_OVERLAP"
            - "StreetPermit.${p2}.status == REQUESTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispatch_then_cancel_conserves_inyard_count
        grounds:
          - state_machines.RentalOrder.BOOKED_to_SCHEDULED
          - state_machines.RentalOrder.SCHEDULED_to_CANCELLED
          - state_machines.Container.IN_YARD_to_ASSIGNED
          - entities.Container.fields.status
          - entities.Container.fields.current_order_id
        distinguishing_aspect: |
          Conserved quantity: count(Container where status==IN_YARD AND
          container_type_id==ct). dispatch-delivery moves the can IN_YARD->ASSIGNED
          (count 1->0); the compensating cancel on the SCHEDULED order moves it back
          ASSIGNED->IN_YARD (count 0->1), so the IN_YARD count of that type is unchanged
          at 1 across the forward+compensating pair, with current_order_id back to null.
        test_recipe:
          setup:
            - "Exactly one IN_YARD container of type ct; order BOOKED then dispatched (SCHEDULED)"
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Cons1", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-CN1", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "16 Oak", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /rental-orders/${ord}/cancel"
              payload: {}
              as: Contractor
              as_user_id: "${acct}"
          assert:
            - "Container.${cont}.status == IN_YARD"
            - "Container.${cont}.current_order_id == null"
            - "count of containers with container_type_id ${ct} and status IN_YARD == 1"

      - name: invoice_void_conserves_account_outstanding
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.account_outstanding
          - entities.ContractorAccount.fields.outstanding_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity (different kind: money, not container count):
          ContractorAccount.outstanding_cents. Issuing the invoice on finalize raises
          outstanding 0->74300; the compensating void returns it to 0, so outstanding
          equals its pre-issue value across the issue+void pair.
        test_recipe:
          setup:
            - "Fully completed YD30 order (net 6200, no contamination/permit) whose Invoice (total 74300) is ISSUED, account outstanding == 74300"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Cons2", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-CN2", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "17 Oak", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKQ", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-10" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 5000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-10", truck_code: "TRKR", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 16200, tare_weight_lbs: 10000 }
              as: ScaleOperator
            - call: "POST /service-stops/${pu_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "GET /invoices?order_id=${ord}"
              payload: {}
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv}/void"
              payload: {}
              as: BillingClerk
              captures: { inv_status: $.data.status }
          assert:
            - "Invoice.${inv}.status == VOID"
            - "ContractorAccount.${acct}.outstanding_cents == 0"
            - "ContractorAccount.${acct}.available_credit_cents == 500000"
