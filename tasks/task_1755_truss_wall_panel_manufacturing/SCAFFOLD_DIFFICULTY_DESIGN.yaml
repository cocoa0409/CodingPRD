      - name: crane_buffer_exact_30_minutes
        grounds:
          - calculations.crane_slot_feasibility
          - validations[priority=21]
        distinguishing_aspect: |
          Metric: minutes of gap between half-open crane slots. A slot starting exactly
          at prev_end + 30 min is accepted (>= buffer), at prev_end + 29 min rejected;
          symmetrically a slot ending exactly 30 min before next start is accepted, at
          29 min rejected. Reachable only via POST /plant/crane-slots.
        test_recipe:
          setup:
            - "Crane CR-B ACTIVE (version tracked via GETs); existing slot 2026-08-12 10:00-12:00 BOOKED"
          setup_api_calls:
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-B", capacity_lbs: 4000, crane_class: "LIGHT", hourly_rate_cents: 10000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
