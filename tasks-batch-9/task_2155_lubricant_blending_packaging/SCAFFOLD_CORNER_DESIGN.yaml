              payload: { tank_code: "TK-01", capacity_l: 5000.0 }
              as: PlatformAdmin
              captures: { tank1: $.data.id }
          trigger:
            - call: "POST /blend-tanks"
              payload: { tank_code: "TK-01", capacity_l: 9000.0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_DUPLICATE_CODE"
            - "GET /blend-tanks returns total_count 1"
            - "BlendTank.${tank1}.capacity_l == 5000.0"

