            - "after trigger[0]: ProductListing.${lst_id}.listing_status is still DRAFT and Facility.${fac_id}.listed_product_count == 0"
            - "trigger[1] and trigger[2] SUCCEED: substantiation and review-item creation are not listed in validations[priority=21].applies_to, so a frozen parent does not block dossier assembly"
            - "trigger[3] returns ERR_FACILITY_POSTURE_FROZEN with http 409: the same parent state that permitted assembly refuses the submit"
            - "after trigger[3]: SafetySubstantiation.${sub_id}.status is still DRAFT and ProductListing.${lst_id}.safety_status is still UNSUBSTANTIATED"
            - "ProductListing.${lst_id}.marketable == false throughout (a frozen parent alone suffices)"

      - name: delist_gated_by_open_recall_then_permitted_after_effective_closure
        grounds:
          - validations[priority=48]
          - calculations.withdrawal_recovery_rate
          - state_machines.RecallAction.EXECUTING_to_CLOSED_EFFECTIVE
          - state_machines.ProductListing.LISTED_to_DELISTED
          - entities.ProductListing.fields.open_recall_count
        distinguishing_aspect: |
          A DIFFERENT entity pair — ProductListing -> RecallAction — and the dependency runs the other
          way round the hierarchy: the parent listing's own transition is blocked by the state of its
          CHILD recall. The identical delist request is refused while open_recall_count is 1 and
          accepted, byte-for-byte, once a VERIFIED_BASIS effectiveness check at exactly 90.00 (900 of
          900 outstanding on a 1000-unit shipment, provisional 90.00 -> credit tier 0 -> denominator
          unchanged) drives the recall to CLOSED_EFFECTIVE.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one LISTED + SUBSTANTIATED listing with lot_authorized_units 1000"
            - "one DistributionRecord of 1000 units, one VOLUNTARY_NOTICE / CLASS_I RecallAction whose plan was ACCEPTED by OFF-1, an EXECUTING recall, an OPEN withdrawal created by OFF-2 with the record produced, and one VERIFIED_RETURN of 900 units"
            - "no effectiveness check has run yet, so open_recall_count is 1"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Larkspur Labs", owner_operator_name: "Larkspur Inc", facility_type: "BOTH", country_code: "US", state_or_province: "CO" }
