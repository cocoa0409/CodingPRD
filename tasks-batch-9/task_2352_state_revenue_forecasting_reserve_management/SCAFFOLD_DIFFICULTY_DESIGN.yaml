  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two DIFFERENT resources with two DIFFERENT interval semantics:
  #   RevenueSource policy windows — half-open [start, end), adjacency legal
  #   ReserveFund cooling-off      — closed boundary, plus a fiscal-year aggregate
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_windows_are_half_open_so_adjacency_is_legal_per_category
        grounds:
          - validations[priority 31 ERR_POLICY_WINDOW_OVERLAP]
          - validations[priority 30 ERR_INVALID_EFFECTIVE_WINDOW]
          - entities.PolicyChangeAdjustment.fields.policy_category
          - endpoints[POST /revenue-sources/{id}/policy-adjustments]
        distinguishing_aspect: |
          The contested resource is one RevenueSource's policy calendar and the interval semantics are
          half-open: a RATE_CHANGE window starting exactly on 2027-01-01, the end date of the
          incumbent [2026-07-01, 2027-01-01) window, is accepted, while one starting a single day
          earlier on 2026-12-31 is rejected with ERR_POLICY_WINDOW_OVERLAP — and the same 2026-12-31
          start is accepted again under the CREDIT category, because the exclusion is scoped per
          policy_category, not per source.
        test_recipe:
          setup:
            - "One ACTIVE revenue source (PIT) with no adjustments yet."
            - "No forecast cycle is needed — the overlap rule is evaluated on the source's own calendar."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2026-101", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 10000000, effective_start_date: "2026-07-01", effective_end_date: "2027-01-01", phase_in_type: "FULL", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { adj_a: $.data.id }
          trigger:
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2026-102", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 6000000, effective_start_date: "2027-01-01", phase_in_type: "FULL", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { adj_b: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2026-103", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 4000000, effective_start_date: "2026-12-31", phase_in_type: "FULL", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2026-104", policy_category: "CREDIT", adjustment_kind: "DECREASE", annualized_amount_cents: 3000000, effective_start_date: "2026-12-31", phase_in_type: "FULL", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { adj_d: $.data.id }
          assert:
            - "adjacency at the boundary: the 2027-01-01 start returns 201 and PolicyChangeAdjustment.${adj_b}.status == ACTIVE, because ${adj_a}'s window is [2026-07-01, 2027-01-01) and excludes its own end date"
            - "one day of true overlap: the 2026-12-31 RATE_CHANGE returns 409 with error_id ERR_POLICY_WINDOW_OVERLAP"
            - "that rejection did not mint a row: GET /revenue-sources/${src_pit}/policy-adjustments returns 2 rows at that point, ${adj_a} and ${adj_b}"
            - "category scoping: the identical 2026-12-31 start under CREDIT returns 201 and PolicyChangeAdjustment.${adj_d}.status == ACTIVE, so the final list holds 3 ACTIVE rows"
            - "GET /revenue-sources/${src_pit}/policy-adjustments returns ${adj_a}, ${adj_b}, ${adj_d} ordered by created_at ASC"
            - "the rejection was ERR_POLICY_WINDOW_OVERLAP (409), not ERR_INVALID_EFFECTIVE_WINDOW (422) — the request's own window is well formed; the conflict is with a sibling row"

      - name: cooling_off_window_is_closed_at_its_boundary_and_fy_cap_aggregates
        grounds:
          - validations[priority 28 ERR_COOLING_OFF_ACTIVE]
          - validations[priority 56 ERR_ANNUAL_CAP_EXCEEDED]
          - entities.ReserveFund.fields.cooling_off_until
          - entities.ReserveFund.fields.fy_withdrawn_cents
          - calculations.withdrawal_authorization
        distinguishing_aspect: |
          A different resource with the opposite boundary convention: the fund's cooling-off window is
          CLOSED at its far end, so an execute attempted at exactly cooling_off_until
          2026-08-31T00:00:00Z is rejected (the rule demands clock strictly greater), and once the
          clock passes it the same call fails for a different reason — 10000000 already withdrawn plus
          15000000 authorized exceeds the 15000000 fiscal-year aggregate cap even though the fund
          holds 61958137, showing the cap is an aggregate over the year, not a per-request test.
        test_recipe:
          setup:
            - "CERTIFIED FY2027 cycle with shortfall_gap_cents 49083727."
            - "One fund, opening 50000000, balance 71958137 after the certification deposit, cooling_off_days 30, fy_opening_balance_cents 50000000 so annual_withdrawal_cap_cents == 15000000."
            - "Request R1: SHORTFALL_TRIGGER for 10000000, APPROVED with authorized_amount_cents 10000000."
