            - "${n_sm} == ERR_SERVICE_MEMBER_NOT_FOUND and ${n_app} == ERR_APPLICATION_NOT_FOUND"
            - "${n_lease} == ERR_LEASE_NOT_FOUND and ${n_insp} == ERR_INSPECTION_NOT_FOUND"
            - "${n_wo} == ERR_WORK_ORDER_NOT_FOUND and ${n_hz} == ERR_HAZARD_CASE_NOT_FOUND"
