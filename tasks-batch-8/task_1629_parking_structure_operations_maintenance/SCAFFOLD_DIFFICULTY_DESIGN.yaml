      - RepairProject.${rp}.project_status == FUNDED and funded_amount_cents == 240
      - Facility.capital_reserve_cents == 0 after funding exactly the balance (== boundary allowed)
- rule_id: resource_temporal_overlap
  instances:
  - name: maintenance_window_buffer_exclusion
    grounds:
    - validations[priority=19]
    - entities.MaintenanceWindow.fields.start_at
    - errors[ERR_WINDOW_OVERLAP]
    distinguishing_aspect: 'Buffer-exclusion semantics on the facility+level resource: windows are

      half-open but a 30-minute buffer applies — adjacent (gap 0) is a conflict,

      gap exactly 30 minutes is allowed, and full overlap on a DIFFERENT level is

      allowed.

      '
    test_recipe:
      setup:
      - Facility with window w1 on L1 SCHEDULED 2026-08-05T06:00-08:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Win Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/maintenance-windows
        payload:
          facility_id: ${fac}
          level: L1
          window_type: SWEEPING
          start_at: '2026-08-05T06:00:00Z'
          end_at: '2026-08-05T08:00:00Z'
        as: MaintenanceSupervisor
        captures:
          w1: $.data.id
      trigger:
      - call: POST /ops/maintenance-windows
        payload:
          facility_id: ${fac}
          level: L1
          window_type: DRAIN_FLUSH
          start_at: '2026-08-05T08:00:00Z'
          end_at: '2026-08-05T09:00:00Z'
        as: MaintenanceSupervisor
        captures:
          err_adjacent: $.data.error_id
      - call: POST /ops/maintenance-windows
        payload:
          facility_id: ${fac}
          level: L1
          window_type: DRAIN_FLUSH
          start_at: '2026-08-05T08:30:00Z'
          end_at: '2026-08-05T09:30:00Z'
        as: MaintenanceSupervisor
        captures:
          w3: $.data.id
          w3st: $.data.window_status
      - call: POST /ops/maintenance-windows
        payload:
          facility_id: ${fac}
          level: L2
          window_type: LIGHTING_REPAIR
          start_at: '2026-08-05T07:00:00Z'
          end_at: '2026-08-05T09:00:00Z'
        as: MaintenanceSupervisor
        captures:
          w4: $.data.id
          w4st: $.data.window_status
      assert:
      - Adjacent window at exactly w1.end (gap 0 < 30 min buffer) rejected with ERR_WINDOW_OVERLAP
      - 'Window at gap exactly 30 minutes (08:30 start) succeeds: window_status == SCHEDULED (boundary is inclusive-allowed)'
      - Fully overlapping window on level L2 succeeds (buffer rule is per facility+level resource)
  - name: event_pool_aggregate_capacity
    grounds:
    - calculations.event_pool_allocation
    - validations[priority=20]
    - errors[ERR_EVENT_POOL_EXCEEDED]
    distinguishing_aspect: 'Aggregate-capacity semantics (different from buffer exclusion): overlapping

      events SHARE a pool — combined presale exactly == event_pool_spaces confirms,

      +1 exceeds; and a touching (end == start) event does not overlap at all.

      Resource: the facility event pool, not a level.

      '
    test_recipe:
      setup:
      - Facility event_pool_spaces 40; e1 18:00-23:00 presale 25 CONFIRMED; e2 20:00-23:00 presale 15 CONFIRMED (combined exactly 40)
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: PoolEvt Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: E1
          start_at: '2026-08-14T18:00:00Z'
          end_at: '2026-08-14T23:00:00Z'
          presale_allocation: 25
          min_staff: 0
        as: FacilityManager
        captures:
          e1: $.data.id
      - call: POST /ops/event-bookings/${e1}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: E2
          start_at: '2026-08-14T20:00:00Z'
          end_at: '2026-08-14T23:00:00Z'
          presale_allocation: 15
          min_staff: 0
        as: FacilityManager
        captures:
          e2: $.data.id
      - call: POST /ops/event-bookings/${e2}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
        captures:
          e2st: $.data.booking_status
      trigger:
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: E3
          start_at: '2026-08-14T21:00:00Z'
          end_at: '2026-08-14T22:00:00Z'
          presale_allocation: 1
          min_staff: 0
        as: FacilityManager
        captures:
          e3: $.data.id
      - call: POST /ops/event-bookings/${e3}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
        captures:
          err: $.data.error_id
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: E4
          start_at: '2026-08-14T23:00:00Z'
          end_at: '2026-08-14T23:59:00Z'
          presale_allocation: 40
          min_staff: 0
        as: FacilityManager
        captures:
          e4: $.data.id
      - call: POST /ops/event-bookings/${e4}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
        captures:
          e4st: $.data.booking_status
      assert:
      - e2 CONFIRMED with combined presale 25 + 15 == 40 == event_pool_spaces (inclusive boundary allowed)
      - e3 confirm rejected with ERR_EVENT_POOL_EXCEEDED (41 > 40)
      - 'e4 CONFIRMED: start 23:00 == e1/e2 end 23:00 is a touching half-open boundary, NOT an overlap, so only its own 40 <= 40 applies'
- rule_id: compensating_invariant
  instances:
  - name: cash_pay_then_refund_conserves_collected
    grounds:
    - state_machines.ParkingSession.SETTLED_to_REFUNDED
    - calculations.shift_expected_cash
    - entities.Facility.fields.cumulative_collected_cents
    distinguishing_aspect: 'Conserved quantity MONEY: settle CASH 500 then refund 500 leaves

      Facility.cumulative_collected_cents == 0 (its pre-settle baseline) and the

      shift''s expected_cash_cents == opening float 10000 — forward + compensating

      actions produce zero drift in both ledgers.

      '
    test_recipe:
      setup:
      - Facility with published tariff, ONLINE gate, OPEN shift float 10000
      - Session entered 10:00, settled CASH 500 at 11:00
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Inv1 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: I
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/shifts
        payload:
          facility_id: ${fac}
          opening_float_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          sh: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: INV-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T11:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${sess}/pay
        payload:
          tender_type: CASH
          shift_id: ${sh}
        as: ParkingAttendant
        as_user_id: att-1
      trigger:
      - call: POST /ops/parking-sessions/${sess}/refund
        payload:
          amount_cents: 500
          reason: chargeback avoidance
        as: RevenueAuditor
        as_user_id: aud-1
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          cum: $.data.cumulative_collected_cents
      - call: GET /ops/shifts/${sh}
        as: RevenueAuditor
        captures:
          exp: $.data.expected_cash_cents
      assert:
      - 'Mid-state (observable after pay): cumulative_collected_cents == 500 and expected_cash_cents == 10500'
      - 'After refund: Facility.${fac}.cumulative_collected_cents == 0 (invariant restored exactly)'
      - 'After refund: AttendantShift.${sh}.expected_cash_cents == 10000 (float restored; refund applied because shift not RECONCILED)'
  - name: repair_start_closeout_conserves_spaces
    grounds:
    - state_machines.RepairProject.SCHEDULED_to_IN_PROGRESS
    - state_machines.RepairProject.IN_PROGRESS_to_CLOSED_OUT
    - entities.Facility.fields.closed_spaces
    distinguishing_aspect: 'Conserved quantity PHYSICAL SPACES (different type than money): start closes

      30 spaces, close-out reopens exactly 30 — closed_spaces returns to 0 and

      total_spaces is never mutated; a different invariant than cash.

      '
    test_recipe:
      setup:
      - Facility total_spaces 100; reserve built to 240 via one CARD settle 2400 + close-of-business
      - Repair project (no inspection) with closed_space_count 30, FUNDED 240, SCHEDULED
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Inv2 Fac
          total_spaces: 100
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: I2
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: INV-2
        as: GateDevice
        as_user_id: ${dev}
        captures:
          s1: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T19:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${s1}/pay
        payload:
          tender_type: CARD
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T23:00:00Z'
        as: FacilityManager
      - call: POST /ops/facilities/${fac}/close-of-business
        as: FacilityManager
      - call: POST /ops/repair-projects
        payload:
          facility_id: ${fac}
          title: Deck sealing
          level_scope: L3
          estimated_cost_cents: 240
          closed_space_count: 30
        as: MaintenanceSupervisor
        captures:
          rp: $.data.id
      - call: POST /ops/repair-projects/${rp}/fund
        payload:
          amount_cents: 240
        as: FacilityManager
      - call: POST /ops/repair-projects/${rp}/schedule
        payload:
          start_at: '2026-08-05T06:00:00Z'
          end_at: '2026-08-07T18:00:00Z'
        as: MaintenanceSupervisor
      trigger:
      - call: POST /ops/repair-projects/${rp}/start
        as: MaintenanceSupervisor
        captures:
          pst1: $.data.project_status
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          closed_mid: $.data.closed_spaces
          total_mid: $.data.total_spaces
      - call: POST /ops/repair-projects/${rp}/close-out
        as: MaintenanceSupervisor
        captures:
          pst2: $.data.project_status
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          closed_end: $.data.closed_spaces
          total_end: $.data.total_spaces
      assert:
      - 'While IN_PROGRESS: closed_spaces == 30 and total_spaces == 100'
      - 'After close-out: closed_spaces == 0 (invariant restored) and total_spaces == 100'
      - project_status == CLOSED_OUT and capital_reserve_cents == 0 (240 levy - 240 draw)
  - name: credential_issue_then_return_conserves_deposit_liability
    grounds:
    - state_machines.Credential.ACTIVE_to_RETURNED
    - entities.Facility.fields.deposit_liability_cents
    - entities.Credential.fields.deposit_cents
    distinguishing_aspect: 'Conserved quantity DEPOSIT LIABILITY (third distinct quantity): issuing a

      5000-deposit credential then returning it leaves deposit_liability_cents == 0;

      and replace (REPLACED + successor) holds liability constant mid-cycle.

      '
    test_recipe:
      setup:
      - Facility monthly_capacity 50; APPROVED agreement
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Inv3 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: Dep One
          email: dep@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          pk: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${pk}
          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          agr: $.data.id
      trigger:
      - call: POST /ops/credentials
        payload:
          agreement_id: ${agr}
          credential_type: BADGE
          deposit_cents: 5000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          c1: $.data.id
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          liab1: $.data.deposit_liability_cents
      - call: POST /ops/credentials/${c1}/replace
        payload:
          credential_type: TRANSPONDER
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          c2: $.data.id
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          liab2: $.data.deposit_liability_cents
      - call: POST /ops/credentials/${c2}/return
        as: ParkingAttendant
        as_user_id: att-1
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          liab3: $.data.deposit_liability_cents
      assert:
      - 'After issue: deposit_liability_cents == 5000'
      - 'After replace: deposit_liability_cents == 5000 (deposit carried to successor; old credential REPLACED)'
      - 'After return of the successor: deposit_liability_cents == 0 (issue + return conserve the liability)'
