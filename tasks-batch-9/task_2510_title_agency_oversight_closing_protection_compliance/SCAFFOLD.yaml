# =============================================================================
# task_2510 — Title Agency Oversight & Closing Protection Compliance
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2510. Title Agency Oversight & Closing Protection Compliance (title insurance
  underwriter agency management): agency appointment with licensing,
  errors-and-omissions coverage and financial review, closing protection letter
  issuance rules and coverage scope by state, escrow account audit with
  three-way reconciliation and unidentified funds review, policy issuance
  timeliness, remittance of premium splits and unreported policy detection,
  defalcation risk indicators and surprise audits, underwriting authority limits
  with referral requirements for complex titles, claims arising from agency error
  with recourse and indemnity, agency termination and file transfer

domain_name: title-agency-oversight

# Flat topology: every collection is a root-level resource path and children
# carry explicit foreign keys in the request body. Concatenation-safe empty
# prefix — full paths are exactly the `path:` values in §1.5.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many        # AgencyAppointment is the Agency × StateProgram junction
    - self_referential    # EscrowAudit.follow_up_of_audit_id, Agency.transferee_agency_id
    - cross_aggregate     # RemittanceLine spans RemittanceStatement and PolicyFile
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Difficulty density, not surface volume: 11 entities carry four independent
    ledgers (CPL exposure, unremitted premium, escrow three-way variance,
    defalcation score) that are recomputed by cascade from five different
    triggers. PolicyFile carries three independent status dimensions
    (issuance × remittance × transfer) that are advanced by three different
    actors. Two segregation-of-duties rules compare X-User-ID against a
    persisted actor id rather than against a role name.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered name of the title agency" }
      - { name: tax_id, type: string, source: input, description: "Federal tax identifier", constraints: "unique across Agency" }
      - { name: underwriting_authority_limit_cents, type: integer, source: input, description: "Per-file liability the agency may bind without underwriter referral", constraints: ">= 0" }
      - { name: appointment_status, type: enum, source: system, description: "PENDING_REVIEW | APPOINTED | SUSPENDED | TERMINATED", default: PENDING_REVIEW }
      - { name: financial_review_status, type: enum, source: system, description: "NOT_SUBMITTED | SUBMITTED | ACCEPTED | DEFICIENT — independent dimension from appointment_status", default: NOT_SUBMITTED }
      - { name: submitted_eo_policy_limit_cents, type: integer, source: input, description: "E&O limit on the pending financial review submission", default: 0 }
      - { name: submitted_eo_expires_on, type: string, source: input, description: "E&O expiry date (YYYY-MM-DD) on the pending financial review submission", default: null }
      - { name: submitted_net_worth_cents, type: integer, source: input, description: "Audited net worth on the pending financial review submission", default: 0 }
      - { name: submitted_fidelity_bond_cents, type: integer, source: input, description: "Fidelity bond amount on the pending financial review submission", default: 0 }
      - { name: eo_policy_limit_cents, type: integer, source: computed, description: "Effective E&O limit — mirrored from the submitted value when a financial review is ACCEPTED", default: 0 }
      - { name: eo_expires_on, type: string, source: computed, description: "Effective E&O expiry date (YYYY-MM-DD) — mirrored on ACCEPT", default: null }
      - { name: net_worth_cents, type: integer, source: computed, description: "Effective audited net worth — mirrored on ACCEPT", default: 0 }
      - { name: fidelity_bond_cents, type: integer, source: computed, description: "Effective fidelity bond — mirrored on ACCEPT", default: 0 }
      - { name: escrow_standing, type: enum, source: computed, description: "COMPLIANT | WATCH | DEFALCATION_RISK — derived from defalcation_score per calculations.agency_defalcation_score", default: COMPLIANT }
      - { name: defalcation_score, type: integer, source: computed, description: "0–100 weighted defalcation risk score", default: 0 }
      - { name: oversight_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — gates CPL and policy operations per calculations.agency_oversight_posture", default: RESTRICTED }
      - { name: open_critical_finding_count, type: integer, source: computed, description: "Count of AuditFinding rows for this agency with severity == CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}", default: 0 }
      - { name: unreported_policy_count, type: integer, source: computed, description: "unreported_policy_count of this agency's most recently reconciled RemittanceStatement (ties broken by created_at ASC, last wins); 0 when none reconciled", default: 0 }
      - { name: cpl_outstanding_exposure_cents, type: integer, source: computed, description: "Conserved ledger: sum of approved_coverage_cents over this agency's ClosingProtectionLetter rows with status == ISSUED", default: 0 }
      - { name: unremitted_premium_cents, type: integer, source: computed, description: "Conserved ledger: sum of gross_premium_cents over this agency's PolicyFile rows with issuance_status IN {ISSUED, LATE_ISSUED} and remittance_status IN {UNREPORTED, REPORTED, DISPUTED}", default: 0 }
      - { name: last_remittance_period_end, type: string, source: computed, description: "period_end (YYYY-MM-DD) of this agency's RemittanceStatement with the greatest period_end among rows with status IN {DRAFT, SUBMITTED, RECONCILED, SETTLED}; null when none", default: null }
      - { name: termination_reason, type: enum, source: system, description: "FOR_CAUSE | VOLUNTARY | NON_RENEWAL — set only on transition to TERMINATED", default: null }
      - { name: transferee_agency_id, type: string, source: system, description: "FK -> Agency.id; set only on transition to TERMINATED; receives this agency's in-force files", default: null }
      - { name: pending_transfer_count, type: integer, source: computed, description: "Count of this agency's PolicyFile rows with transfer_status IN {PENDING_TRANSFER, TRANSFER_EXCEPTION}", default: 0 }

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "unique across StateProgram" }
      - { name: cpl_permitted, type: boolean, source: input, description: "Whether closing protection letters may be issued in this state" }
      - { name: cpl_coverage_cap_cents, type: integer, source: input, description: "Statutory maximum CPL coverage before scope factor is applied", constraints: ">= 0" }
      - { name: cpl_scope_allowed, type: enum, source: input, description: "LENDER_ONLY | LENDER_AND_BUYER | LENDER_BUYER_SELLER — widest scope the state permits" }
      - { name: premium_split_agency_pct, type: number, source: input, description: "Agency retention fraction of gross premium; underwriter factor is (1 - premium_split_agency_pct)", constraints: "0 < value < 1, at most 3 decimal places" }
      - { name: policy_issuance_deadline_days, type: integer, source: input, description: "Whole days after closing_date within which a policy may be issued on time", constraints: ">= 1" }
      - { name: three_way_tolerance_cents, type: integer, source: input, description: "Escrow reconciliation variance at or below which no THREE_WAY_VARIANCE finding is raised", constraints: ">= 0" }
      - { name: counsel_referral_threshold_cents, type: integer, source: input, description: "Per-file liability above which underwriting counsel referral is mandatory regardless of agency authority", constraints: ">= 0" }

  - name: AgencyAppointment
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the appointed agency" }
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id; the state this appointment authorizes" }
      - { name: license_number, type: string, source: input, description: "Title agent license number as claimed by the agency" }
      - { name: license_expires_on, type: string, source: input, description: "Claimed license expiry date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "PENDING_LICENSE_VERIFICATION | ACTIVE | LAPSED | WITHDRAWN", default: PENDING_LICENSE_VERIFICATION }
      - { name: verified_license_number, type: string, source: system, description: "License number confirmed against the state registry", default: null }
      - { name: verified_expires_on, type: string, source: system, description: "Expiry date confirmed against the state registry (YYYY-MM-DD)", default: null }
      - { name: appointed_on, type: string, source: system, description: "Date (YYYY-MM-DD) of the first transition to ACTIVE", default: null }

  - name: ClosingProtectionLetter
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; agency requesting the letter" }
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id; state whose CPL rules govern this letter" }
      - { name: transaction_ref, type: string, source: input, description: "Closing transaction reference supplied by the agency" }
      - { name: coverage_scope, type: enum, source: input, description: "LENDER_ONLY | LENDER_AND_BUYER | LENDER_BUYER_SELLER — parties protected" }
      - { name: requested_coverage_cents, type: integer, source: input, description: "Coverage amount requested", constraints: "> 0" }
      - { name: closing_date, type: string, source: input, description: "Scheduled closing date (YYYY-MM-DD)" }
      - { name: lender_name, type: string, source: input, description: "Protected lender" }
      - { name: complex_title_flag, type: boolean, source: input, description: "Agency-declared marker for a complex title requiring counsel review", default: false }
      - { name: status, type: enum, source: system, description: "REQUESTED | REFERRED | ISSUED | DECLINED | VOIDED — initial state branches per calculations.cpl_referral_routing" }
      - { name: referral_reason, type: enum, source: system, description: "COVERAGE_ABOVE_AGENCY_AUTHORITY | COMPLEX_TITLE_FLAGGED | AGENCY_POSTURE_RESTRICTED — set when the initial state is REFERRED", default: null }
      - { name: approved_coverage_cents, type: integer, source: computed, description: "Coverage bound on issuance per calculations.cpl_approved_coverage; 0 until status == ISSUED and reset to 0 on VOIDED", default: 0 }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the actor who moved the letter to ISSUED or DECLINED", default: null }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock instant of transition to ISSUED", default: null }
      - { name: void_reason, type: string, source: system, description: "Reason recorded on transition to VOIDED", default: null }

  - name: PolicyFile
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; issuing agency" }
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id; state whose deadline and split govern this file" }
      - { name: cpl_id, type: string, source: input, description: "FK -> ClosingProtectionLetter.id; optional letter covering this closing", default: null }
      - { name: order_number, type: string, source: input, description: "Agency title order number" }
      - { name: closing_date, type: string, source: input, description: "Actual closing date (YYYY-MM-DD)" }
      - { name: liability_amount_cents, type: integer, source: input, description: "Policy liability amount requested", constraints: "> 0" }
      - { name: gross_premium_cents, type: integer, source: input, description: "Gross premium collected by the agency", constraints: "> 0" }
      - { name: complex_title_flag, type: boolean, source: input, description: "Agency-declared complex-title marker forcing referral", default: false }
      - { name: policy_number, type: string, source: input, description: "Policy number assigned at issuance", default: null, constraints: "unique per agency_id among PolicyFile rows with issuance_status IN {ISSUED, LATE_ISSUED}" }
      - { name: approved_liability_cents, type: integer, source: computed, description: "Liability the underwriter allows to be bound: equals liability_amount_cents when no referral is required, otherwise the value supplied by the referral decision", default: 0 }
      - { name: issuance_status, type: enum, source: system, description: "PENDING | PENDING_REFERRAL | ISSUED | LATE_ISSUED | ISSUANCE_DECLINED | VOIDED — dimension 1" }
      - { name: remittance_status, type: enum, source: system, description: "UNREPORTED | REPORTED | DISPUTED | REMITTED — dimension 2, advanced only by RemittanceStatement transitions", default: UNREPORTED }
      - { name: transfer_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING_TRANSFER | TRANSFERRED | TRANSFER_EXCEPTION — dimension 3, advanced only after the agency is TERMINATED", default: NOT_REQUIRED }
      - { name: transferee_agency_id, type: string, source: system, description: "FK -> Agency.id; agency this file was transferred to", default: null }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock instant of issuance", default: null }
      - { name: issuance_elapsed_days, type: integer, source: computed, description: "Whole days from closing_date to date(issued_at) per calculations.policy_issuance_timeliness", default: null }
      - { name: referral_decided_by_user_id, type: string, source: system, description: "X-User-ID of the counsel who approved or declined the referral — segregation-of-duties anchor for claim adjudication", default: null }

  - name: RemittanceStatement
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; remitting agency" }
      - { name: period_start, type: string, source: input, description: "First day of the remittance period (YYYY-MM-DD), inclusive" }
      - { name: period_end, type: string, source: input, description: "Last day of the remittance period (YYYY-MM-DD), inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RECONCILED | SETTLED", default: DRAFT }
      - { name: reported_gross_premium_cents, type: integer, source: computed, description: "Sum of reported_gross_premium_cents over this statement's RemittanceLine rows", default: 0 }
      - { name: underwriter_share_cents, type: integer, source: computed, description: "Sum of per-line underwriter_share_cents (rounded per line, then summed) per calculations.remittance_premium_split", default: 0 }
      - { name: agency_retention_cents, type: integer, source: computed, description: "reported_gross_premium_cents - underwriter_share_cents", default: 0 }
      - { name: expected_gross_premium_cents, type: integer, source: computed, description: "Sum of gross_premium_cents over the reconciliation expected set per calculations.remittance_reconciliation; 0 until status RECONCILED is reached", default: 0 }
      - { name: variance_cents, type: integer, source: computed, description: "expected_gross_premium_cents - reported_gross_premium_cents, computed at reconciliation", default: 0 }
      - { name: unreported_policy_count, type: integer, source: computed, description: "Count of expected-set PolicyFile rows not referenced by any line of this statement, computed at reconciliation", default: 0 }
      - { name: unreported_premium_cents, type: integer, source: computed, description: "Sum of gross_premium_cents over the unreported expected-set PolicyFile rows, computed at reconciliation and reset to 0 on reopen", default: 0 }
      - { name: late_fee_cents, type: integer, source: computed, description: "filing_fee_cents + penalty_cents computed at reconciliation per calculations.remittance_reconciliation", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock instant of the most recent transition to SUBMITTED", default: null }
      - { name: reconciled_at, type: datetime, source: system, description: "Logical clock instant of the most recent transition to RECONCILED", default: null }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock instant of transition to SETTLED", default: null }
      - { name: settled_amount_cents, type: integer, source: input, description: "Cash settled by the agency on the SETTLED transition", default: 0 }
      - { name: reopen_count, type: integer, source: computed, description: "Number of times this statement has been reopened to DRAFT", default: 0 }
      - { name: reopen_reason, type: string, source: input, description: "Reason recorded on the most recent reopen", default: null }

  - name: RemittanceLine
    parent: RemittanceStatement
    common_fields: true
    fields:
      - { name: remittance_statement_id, type: string, source: input, description: "FK -> RemittanceStatement.id; statement this line belongs to" }
      - { name: policy_file_id, type: string, source: input, description: "FK -> PolicyFile.id; policy being remitted" }
      - { name: reported_gross_premium_cents, type: integer, source: input, description: "Gross premium the agency reports for this policy", constraints: "> 0" }
      - { name: underwriter_share_cents, type: integer, source: computed, description: "round_half_up(reported_gross_premium_cents * (1 - state_program.premium_split_agency_pct)) of the line's PolicyFile state program" }
      - { name: agency_retention_cents, type: integer, source: computed, description: "reported_gross_premium_cents - underwriter_share_cents" }
      - { name: premium_mismatch, type: boolean, source: computed, description: "true when reported_gross_premium_cents != PolicyFile.gross_premium_cents", default: false }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owner of the trust account" }
      - { name: bank_name, type: string, source: input, description: "Depository institution" }
      - { name: account_ref, type: string, source: input, description: "Masked account reference", constraints: "unique per agency_id" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED — mirrors the owning agency's oversight_posture cascade", default: OPEN }
      - { name: book_balance_cents, type: integer, source: input, description: "Trust ledger book balance from the latest balance snapshot", default: 0 }
      - { name: bank_balance_cents, type: integer, source: input, description: "Bank statement balance from the latest balance snapshot", default: 0 }
      - { name: outstanding_items_cents, type: integer, source: input, description: "Outstanding checks and deposits in transit from the latest balance snapshot", default: 0 }
      - { name: trial_balance_cents, type: integer, source: input, description: "Sum of open file ledger balances from the latest balance snapshot", default: 0 }
      - { name: unidentified_funds_cents, type: integer, source: input, description: "Receipts not yet attributed to a file", default: 0 }
      - { name: aged_unidentified_over_90_cents, type: integer, source: input, description: "Portion of unidentified_funds_cents held more than 90 days", default: 0 }
      - { name: snapshot_as_of, type: string, source: input, description: "Date (YYYY-MM-DD) of the latest balance snapshot; null until a snapshot is posted", default: null }
      - { name: adjusted_bank_balance_cents, type: integer, source: computed, description: "bank_balance_cents - outstanding_items_cents", default: 0 }

  - name: EscrowAudit
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; audited agency" }
      - { name: escrow_account_id, type: string, source: input, description: "FK -> EscrowAccount.id; audited trust account" }
      - { name: follow_up_of_audit_id, type: string, source: input, description: "FK -> EscrowAudit.id; predecessor audit whose findings this audit re-tests", default: null }
      - { name: audit_type, type: enum, source: input, description: "SCHEDULED | SURPRISE" }
      - { name: as_of_date, type: string, source: input, description: "Reconciliation cut-off date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REMEDIATION_REQUIRED | CLOSED_CLEAN | CLOSED_ADVERSE", default: DRAFT }
      - { name: conducted_by_user_id, type: string, source: system, description: "X-User-ID of the auditor who created the audit — segregation-of-duties anchor for closing", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the actor who closed the audit", default: null }
      - { name: variance_method, type: enum, source: computed, description: "STRICT_THREE_WAY | BANK_TO_TRIAL — selected by audit_type per calculations.escrow_three_way_variance", default: null }
      - { name: reconciliation_variance_cents, type: integer, source: computed, description: "Variance computed on every transition into SUBMITTED per calculations.escrow_three_way_variance", default: 0 }
      - { name: unidentified_funds_reviewed_cents, type: integer, source: computed, description: "EscrowAccount.unidentified_funds_cents captured at the most recent transition into SUBMITTED", default: 0 }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | ELEVATED | HIGH | CRITICAL — highest severity among this audit's findings, LOW when none", default: LOW }
      - { name: open_finding_count, type: integer, source: computed, description: "Count of this audit's AuditFinding rows with status IN {OPEN, REMEDIATION_SUBMITTED}", default: 0 }
      - { name: critical_finding_count, type: integer, source: computed, description: "Count of this audit's AuditFinding rows with severity == CRITICAL", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock instant of the most recent transition into SUBMITTED", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock instant of transition to CLOSED_CLEAN or CLOSED_ADVERSE", default: null }

  - name: AuditFinding
    parent: EscrowAudit
    common_fields: true
    fields:
      - { name: escrow_audit_id, type: string, source: input, description: "FK -> EscrowAudit.id; audit that raised the finding" }
      - { name: code, type: enum, source: input, description: "THREE_WAY_VARIANCE | UNIDENTIFIED_FUNDS_AGED | NEGATIVE_FILE_BALANCE | MISSING_RECONCILIATION | COMMINGLING" }
      - { name: exposure_cents, type: integer, source: input, description: "Trust dollars exposed by the finding", constraints: ">= 0" }
      - { name: narrative, type: string, source: input, description: "Auditor narrative" }
      - { name: base_severity, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL from code and exposure_cents per calculations.audit_finding_severity" }
      - { name: is_repeat, type: boolean, source: computed, description: "true when the audit's follow_up_of_audit_id predecessor holds a finding with the same code and status != CLEARED", default: false }
      - { name: severity, type: enum, source: computed, description: "base_severity escalated one level when is_repeat is true, capped at CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | REMEDIATION_SUBMITTED | CLEARED | ESCALATED", default: OPEN }
      - { name: remediation_note, type: string, source: input, description: "Agency narrative supplied on the REMEDIATION_SUBMITTED transition", default: null }
      - { name: cleared_amount_cents, type: integer, source: input, description: "Trust dollars the agency restored, supplied on the REMEDIATION_SUBMITTED transition", default: 0 }
      - { name: disposition_note, type: string, source: input, description: "Reviewer note recorded on the CLEARED or ESCALATED transition", default: null }

  - name: AgencyClaim
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; agency whose conduct produced the loss" }
      - { name: policy_file_id, type: string, source: input, description: "FK -> PolicyFile.id; policy under which the loss is claimed" }
      - { name: cpl_id, type: string, source: input, description: "FK -> ClosingProtectionLetter.id; letter invoked by the claimant, when any", default: null }
      - { name: cause_code, type: enum, source: input, description: "AGENCY_ERROR | SEARCH_DEFECT | ESCROW_DEFALCATION | UNDERWRITING_BREACH" }
      - { name: loss_amount_cents, type: integer, source: input, description: "Gross loss paid or reserved by the underwriter", constraints: "> 0" }
      - { name: notice_date, type: string, source: input, description: "Date the claim was noticed (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "INVESTIGATING | RECOURSE_DEMANDED | ABSORBED | RECOVERED | WRITTEN_OFF", default: INVESTIGATING }
      - { name: recourse_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 — pinned from gross loss versus agency authority per calculations.claim_recourse_and_indemnity", default: null }
      - { name: indemnity_offset_cents, type: integer, source: computed, description: "E&O-backed indemnity applied before recourse", default: 0 }
      - { name: recourse_amount_cents, type: integer, source: computed, description: "Amount demanded from the agency", default: 0 }
      - { name: net_underwriter_exposure_cents, type: integer, source: computed, description: "loss_amount_cents - indemnity_offset_cents per calculations.claim_recourse_and_indemnity step 4; further reduced by recovered_amount_cents on RECOURSE_DEMANDED -> RECOVERED", default: 0 }
      - { name: recovered_amount_cents, type: integer, source: input, description: "Cash actually recovered from the agency on the RECOVERED transition", default: 0 }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the actor who set RECOURSE_DEMANDED or ABSORBED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Agency: two independent dimensions (appointment_status × financial_review_status),
  #      appointment_status carrying a SUSPENDED -> APPOINTED revision cycle.
  - entity: Agency
    dimension: appointment_status
    initial_state: PENDING_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_REVIEW
        to: APPOINTED
        trigger: "POST /agencies/{id}/appointment-decision with decision=APPOINT"
        actor: LicensingAnalyst
        preconditions:
          - "Agency.financial_review_status == ACCEPTED (else ERR_FINANCIAL_REVIEW_NOT_ACCEPTED)"
          - "At least one AgencyAppointment with agency_id == this agency and status == ACTIVE (else ERR_NO_ACTIVE_APPOINTMENT_IN_STATE)"
        side_effects:
          - "Agency.oversight_posture recomputed per calculations.agency_oversight_posture"
          - "Agency.version incremented by 1"
      - from: APPOINTED
        to: SUSPENDED
        trigger: "POST /agencies/{id}/appointment-decision with decision=SUSPEND"
        actor: LicensingAnalyst
        preconditions: []
        side_effects:
          - "Agency.oversight_posture recomputed -> FROZEN (appointment_status IN {SUSPENDED, TERMINATED} is a FROZEN condition)"
          - "Because oversight_posture became FROZEN, every EscrowAccount with agency_id == this agency and status == OPEN moves to RESTRICTED"
          - "Agency.version incremented by 1"
      - from: SUSPENDED
        to: APPOINTED
        trigger: "POST /agencies/{id}/appointment-decision with decision=REINSTATE"
        actor: LicensingAnalyst
        preconditions:
          - "Agency.escrow_standing != DEFALCATION_RISK (else ERR_REINSTATEMENT_BLOCKED_BY_ESCROW_STANDING)"
          - "Agency.open_critical_finding_count == 0 (else ERR_REINSTATEMENT_BLOCKED_BY_ESCROW_STANDING)"
        side_effects:
          - "Agency.oversight_posture recomputed per calculations.agency_oversight_posture"
          - "Because oversight_posture left FROZEN, every EscrowAccount with agency_id == this agency and status == RESTRICTED moves to OPEN"
          - "Agency.version incremented by 1"
        note: "Revision cycle APPOINTED -> SUSPENDED -> APPOINTED; reinstatement is blocked while escrow risk indicators persist."
      - from: APPOINTED
        to: TERMINATED
        trigger: "POST /agencies/{id}/appointment-decision with decision=TERMINATE"
        actor: ComplianceOfficer
        preconditions:
          - "termination_reason present in the request body (else ERR_TERMINATION_REASON_REQUIRED)"
          - "Acting role is ComplianceOfficer (else ERR_TRANSITION_ROLE_NOT_PERMITTED)"
          - "When transferee_agency_id is supplied it must reference an Agency with appointment_status == APPOINTED and oversight_posture != FROZEN (else ERR_TRANSFEREE_NOT_ELIGIBLE)"
        side_effects:
          - "CASCADE-B hop 1: Agency.appointment_status -> TERMINATED; termination_reason and transferee_agency_id persisted"
          - "CASCADE-B hop 2: because appointment_status became TERMINATED, Agency.oversight_posture -> FROZEN"
          - "CASCADE-B hop 3: because appointment_status became TERMINATED, every AgencyAppointment with agency_id == this agency and status IN {PENDING_LICENSE_VERIFICATION, ACTIVE, LAPSED} moves to WITHDRAWN, processed in created_at ASC order"
          - "CASCADE-B hop 4: because those appointments became WITHDRAWN, every ClosingProtectionLetter with agency_id == this agency, status IN {REQUESTED, REFERRED} and state_program_id equal to a withdrawn appointment's state_program_id moves to DECLINED with decided_by_user_id = 'SYSTEM', processed in created_at ASC order"
          - "CASCADE-B hop 5: because those letters became DECLINED, every PolicyFile whose cpl_id equals one of them and whose issuance_status IN {PENDING, PENDING_REFERRAL} moves to VOIDED"
          - "Also caused by hop 1: every PolicyFile with agency_id == this agency, issuance_status IN {ISSUED, LATE_ISSUED} and transfer_status == NOT_REQUIRED moves to PENDING_TRANSFER with transferee_agency_id copied from Agency.transferee_agency_id; then Agency.pending_transfer_count is recomputed"
          - "Also caused by hop 1: every EscrowAccount with agency_id == this agency and status IN {OPEN, RESTRICTED} moves to CLOSED"
          - "Agency.version incremented by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agencies/{id}/appointment-decision with decision=TERMINATE"
        actor: ComplianceOfficer
        preconditions:
          - "Same preconditions as APPOINTED -> TERMINATED"
        side_effects:
          - "Identical CASCADE-B side-effect chain as APPOINTED -> TERMINATED"

  - entity: Agency
    dimension: financial_review_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    transitions:
      - from: NOT_SUBMITTED
        to: SUBMITTED
        trigger: "POST /agencies/{id}/financial-review"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == agency_id (else ERR_AGENCY_OWNERSHIP_REQUIRED)"
          - "Agency.appointment_status != TERMINATED (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_eo_policy_limit_cents, submitted_eo_expires_on, submitted_net_worth_cents, submitted_fidelity_bond_cents persisted from the request; effective eo_* / net_worth_cents / fidelity_bond_cents are NOT touched"
          - "Agency.oversight_posture recomputed (financial_review_status == SUBMITTED is a RESTRICTED condition)"
          - "Agency.version incremented by 1"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /agencies/{id}/financial-review"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == agency_id"
        side_effects:
          - "Same as NOT_SUBMITTED -> SUBMITTED; resubmission cycle after a deficiency"
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /agencies/{id}/financial-review"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == agency_id"
        side_effects:
          - "Same as NOT_SUBMITTED -> SUBMITTED; annual renewal cycle. Effective eo_* values remain in force until the renewal is ACCEPTED, so oversight_posture becomes RESTRICTED while the renewal is pending"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /agencies/{id}/financial-review-decision with decision=ACCEPT"
        actor: LicensingAnalyst
        preconditions:
          - "submitted_eo_policy_limit_cents >= MIN_EO_LIMIT_CENTS (else ERR_EO_LIMIT_BELOW_MINIMUM)"
          - "submitted_net_worth_cents >= MIN_NET_WORTH_CENTS (else ERR_NET_WORTH_BELOW_MINIMUM)"
        side_effects:
          - "eo_policy_limit_cents, eo_expires_on, net_worth_cents, fidelity_bond_cents mirrored from the submitted_* fields (derived-field reconciliation)"
          - "Agency.oversight_posture recomputed per calculations.agency_oversight_posture"
          - "Agency.version incremented by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /agencies/{id}/financial-review-decision with decision=DEFICIENT"
        actor: LicensingAnalyst
        preconditions: []
        side_effects:
          - "Effective eo_* / net_worth_cents / fidelity_bond_cents left unchanged"
          - "Agency.oversight_posture recomputed (financial_review_status == DEFICIENT is a RESTRICTED condition)"
          - "Agency.version incremented by 1"

  - entity: AgencyAppointment
    initial_state: PENDING_LICENSE_VERIFICATION
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_LICENSE_VERIFICATION
        to: ACTIVE
        trigger: "POST /agency-appointments/{id}/license-verification with decision=VERIFY"
        actor: LicensingAnalyst
        preconditions:
          - "verified_expires_on > date(current_utc) (else ERR_LICENSE_EXPIRED)"
          - "Agency.financial_review_status == ACCEPTED (else ERR_FINANCIAL_REVIEW_NOT_ACCEPTED)"
        side_effects:
          - "verified_license_number and verified_expires_on persisted; appointed_on set to date(current_utc) when null"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /agency-appointments/{id}/license-verification with decision=LAPSE"
        actor: LicensingAnalyst
        preconditions: []
        side_effects:
          - "Because the appointment left ACTIVE, subsequent CPL requests and policy issuances for this (agency_id, state_program_id) pair fail with ERR_NO_ACTIVE_APPOINTMENT_IN_STATE"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /agency-appointments/{id}/license-verification with decision=VERIFY"
        actor: LicensingAnalyst
        preconditions:
          - "verified_expires_on > date(current_utc) (else ERR_LICENSE_EXPIRED)"
          - "Agency.financial_review_status == ACCEPTED"
        side_effects:
          - "verified_license_number and verified_expires_on overwritten with the renewed values"
        note: "Renewal cycle LAPSED -> ACTIVE."
      - from: PENDING_LICENSE_VERIFICATION
        to: WITHDRAWN
        trigger: "system — CASCADE-B hop 3 of Agency APPOINTED/SUSPENDED -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system — CASCADE-B hop 3 of Agency APPOINTED/SUSPENDED -> TERMINATED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE-B hop 4 fires from this withdrawal"
      - from: LAPSED
        to: WITHDRAWN
        trigger: "system — CASCADE-B hop 3 of Agency APPOINTED/SUSPENDED -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []

  # ---- ClosingProtectionLetter: branching fork (REQUESTED | REFERRED) -> join at
  #      ISSUED/DECLINED with divergent side-effect sets per branch.
  - entity: ClosingProtectionLetter
    initial_state: "REQUESTED or REFERRED — selected at creation by calculations.cpl_referral_routing"
    terminal_states: [DECLINED, VOIDED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /closing-protection-letters/{id}/state with to_state=ISSUED"
        actor: ComplianceOfficer
        preconditions:
          - "StateProgram.cpl_permitted == true (else ERR_CPL_NOT_PERMITTED_IN_STATE)"
          - "An AgencyAppointment exists for (agency_id, state_program_id) with status == ACTIVE (else ERR_NO_ACTIVE_APPOINTMENT_IN_STATE)"
          - "Agency.eo_expires_on is not null and Agency.eo_expires_on >= date(current_utc) (else ERR_EO_COVERAGE_LAPSED)"
          - "Agency.oversight_posture != FROZEN (else ERR_AGENCY_POSTURE_FROZEN)"
        side_effects:
          - "approved_coverage_cents computed per calculations.cpl_approved_coverage; issued_at = current_utc; decided_by_user_id = X-User-ID"
          - "Agency.cpl_outstanding_exposure_cents recomputed per calculations.cpl_exposure_ledger (increases by approved_coverage_cents)"
          - "Agency.version incremented by 1"
      - from: REFERRED
        to: ISSUED
        trigger: "POST /closing-protection-letters/{id}/state with to_state=ISSUED"
        actor: UnderwritingCounsel
        preconditions:
          - "Acting role is UnderwritingCounsel (else ERR_TRANSITION_ROLE_NOT_PERMITTED) — a referred letter may only be released by counsel"
          - "Same four preconditions as REQUESTED -> ISSUED"
        side_effects:
          - "Identical to REQUESTED -> ISSUED, plus referral_reason retained for audit"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /closing-protection-letters/{id}/state with to_state=DECLINED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decided_by_user_id = X-User-ID; approved_coverage_cents remains 0; Agency.cpl_outstanding_exposure_cents unchanged"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /closing-protection-letters/{id}/state with to_state=DECLINED"
        actor: UnderwritingCounsel
        preconditions:
          - "Acting role is UnderwritingCounsel (else ERR_TRANSITION_ROLE_NOT_PERMITTED)"
        side_effects:
          - "decided_by_user_id = X-User-ID; approved_coverage_cents remains 0"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /closing-protection-letters/{id}/state with to_state=VOIDED"
        actor: ComplianceOfficer
        preconditions:
          - "No PolicyFile with cpl_id == this letter has issuance_status IN {ISSUED, LATE_ISSUED} (else ERR_CPL_HAS_ISSUED_POLICY)"
        side_effects:
          - "void_reason persisted; approved_coverage_cents reset to 0"
          - "Agency.cpl_outstanding_exposure_cents recomputed — the compensating action of issuance, restoring the ledger to its pre-issuance value"
          - "Agency.version incremented by 1"
      - from: REQUESTED
        to: DECLINED
        trigger: "system — CASCADE-A hop 4 (posture FROZEN) or CASCADE-B hop 4 (appointment withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_by_user_id = 'SYSTEM'"
      - from: REFERRED
        to: DECLINED
        trigger: "system — CASCADE-A hop 4 (posture FROZEN) or CASCADE-B hop 4 (appointment withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_by_user_id = 'SYSTEM'; CASCADE-B hop 5 fires from this decline"

  # ---- PolicyFile: three independent dimensions on one row.
  - entity: PolicyFile
    dimension: issuance_status
    initial_state: "PENDING or PENDING_REFERRAL — selected at creation by calculations.policy_referral_routing"
    terminal_states: [ISSUANCE_DECLINED, VOIDED]
    transitions:
      - from: PENDING_REFERRAL
        to: PENDING
        trigger: "POST /policy-files/{id}/issuance-state with to_state=REFERRAL_APPROVED"
        actor: UnderwritingCounsel
        preconditions:
          - "approved_liability_cents present in the request body and > 0 (else ERR_INVALID_REQUEST)"
          - "approved_liability_cents <= liability_amount_cents (else ERR_APPROVED_LIABILITY_ABOVE_REQUEST)"
        side_effects:
          - "approved_liability_cents persisted; referral_decided_by_user_id = X-User-ID (segregation-of-duties anchor consumed later by AgencyClaim adjudication)"
      - from: PENDING_REFERRAL
        to: ISSUANCE_DECLINED
        trigger: "POST /policy-files/{id}/issuance-state with to_state=ISSUANCE_DECLINED"
        actor: UnderwritingCounsel
        preconditions: []
        side_effects:
          - "referral_decided_by_user_id = X-User-ID; approved_liability_cents stays 0"
      - from: PENDING
        to: ISSUED
        trigger: "POST /policy-files/{id}/issuance-state with to_state=ISSUED"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == agency_id (else ERR_AGENCY_OWNERSHIP_REQUIRED)"
          - "policy_number present in the request body (else ERR_INVALID_REQUEST) and unique among this agency's PolicyFile rows with issuance_status IN {ISSUED, LATE_ISSUED} (else ERR_DUPLICATE_POLICY_NUMBER)"
          - "Agency.eo_expires_on is not null and Agency.eo_expires_on >= date(current_utc) (else ERR_EO_COVERAGE_LAPSED)"
          - "An AgencyAppointment exists for (agency_id, state_program_id) with status == ACTIVE (else ERR_NO_ACTIVE_APPOINTMENT_IN_STATE)"
          - "Agency.oversight_posture != FROZEN (else ERR_AGENCY_POSTURE_FROZEN)"
          - "approved_liability_cents <= Agency.underwriting_authority_limit_cents OR referral_decided_by_user_id is not null (else ERR_UNDERWRITING_AUTHORITY_EXCEEDED)"
          - "When cpl_id is not null, that ClosingProtectionLetter.status == ISSUED (else ERR_CPL_NOT_ISSUED)"
        side_effects:
          - "issued_at = current_utc; issuance_elapsed_days computed; issuance_status resolves to ISSUED when issuance_elapsed_days <= StateProgram.policy_issuance_deadline_days"
          - "Agency.unremitted_premium_cents recomputed per calculations.unremitted_premium_ledger (increases by gross_premium_cents)"
          - "Agency.version incremented by 1"
      - from: PENDING
        to: LATE_ISSUED
        trigger: "POST /policy-files/{id}/issuance-state with to_state=ISSUED"
        actor: AgencyPrincipal
        preconditions:
          - "Same preconditions as PENDING -> ISSUED"
        side_effects:
          - "Same side effects as PENDING -> ISSUED; issuance_status resolves to LATE_ISSUED when issuance_elapsed_days > StateProgram.policy_issuance_deadline_days"
        note: "Same trigger and same to_state input as PENDING -> ISSUED; the boundary in calculations.policy_issuance_timeliness picks the landing state."
      - from: PENDING
        to: VOIDED
        trigger: "system — CASCADE-B hop 5 of Agency -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_REFERRAL
        to: VOIDED
        trigger: "system — CASCADE-B hop 5 of Agency -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PolicyFile
    dimension: remittance_status
    initial_state: UNREPORTED
    terminal_states: []
    transitions:
      - from: UNREPORTED
        to: REPORTED
        trigger: "system — RemittanceStatement SUBMITTED -> RECONCILED, for each line whose premium_mismatch == false"
        actor: system
        preconditions:
          - "PolicyFile.issuance_status IN {ISSUED, LATE_ISSUED}"
        side_effects: []
      - from: UNREPORTED
        to: DISPUTED
        trigger: "system — RemittanceStatement SUBMITTED -> RECONCILED, for each line whose premium_mismatch == true"
        actor: system
        preconditions: []
        side_effects:
          - "The policy's gross_premium_cents stays inside Agency.unremitted_premium_cents"
      - from: REPORTED
        to: REMITTED
        trigger: "system — CASCADE-C hop 2 of RemittanceStatement RECONCILED -> SETTLED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE-C hop 3 fires: Agency.unremitted_premium_cents recomputed"
      - from: REMITTED
        to: REPORTED
        trigger: "system — RemittanceStatement SETTLED -> DRAFT (reopen)"
        actor: system
        preconditions: []
        side_effects:
          - "Agency.unremitted_premium_cents recomputed — compensating action restoring the ledger to its pre-settlement value"
      - from: REPORTED
        to: UNREPORTED
        trigger: "system — RemittanceStatement RECONCILED -> DRAFT (reopen)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: UNREPORTED
        trigger: "system — RemittanceStatement RECONCILED -> DRAFT or SETTLED -> DRAFT (reopen)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PolicyFile
    dimension: transfer_status
    initial_state: NOT_REQUIRED
    terminal_states: [TRANSFERRED]
    transitions:
      - from: NOT_REQUIRED
        to: PENDING_TRANSFER
        trigger: "system — Agency -> TERMINATED, for files with issuance_status IN {ISSUED, LATE_ISSUED}"
        actor: system
        preconditions: []
        side_effects:
          - "transferee_agency_id copied from Agency.transferee_agency_id; Agency.pending_transfer_count recomputed"
      - from: PENDING_TRANSFER
        to: TRANSFERRED
        trigger: "POST /policy-files/{id}/transfer-state with to_state=TRANSFERRED"
        actor: ComplianceOfficer
        preconditions:
          - "PolicyFile.transferee_agency_id is not null (else ERR_TRANSFEREE_NOT_ELIGIBLE)"
          - "The transferee Agency has appointment_status == APPOINTED and oversight_posture != FROZEN (else ERR_TRANSFEREE_NOT_ELIGIBLE)"
        side_effects:
          - "Agency.pending_transfer_count recomputed on the terminated agency"
      - from: PENDING_TRANSFER
        to: TRANSFER_EXCEPTION
        trigger: "POST /policy-files/{id}/transfer-state with to_state=TRANSFER_EXCEPTION"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "note persisted in the audit trail; Agency.pending_transfer_count unchanged (exceptions still count as pending)"
      - from: TRANSFER_EXCEPTION
        to: TRANSFERRED
        trigger: "POST /policy-files/{id}/transfer-state with to_state=TRANSFERRED"
        actor: ComplianceOfficer
        preconditions:
          - "Same preconditions as PENDING_TRANSFER -> TRANSFERRED"
        side_effects:
          - "Agency.pending_transfer_count recomputed"
        note: "Exception-retry cycle PENDING_TRANSFER -> TRANSFER_EXCEPTION -> TRANSFERRED."

  # ---- RemittanceStatement: forward pipeline with a reopen cycle back to DRAFT.
  - entity: RemittanceStatement
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /remittance-statements/{id}/state with to_state=SUBMITTED"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == agency_id (else ERR_AGENCY_OWNERSHIP_REQUIRED)"
          - "At least one RemittanceLine references this statement (else ERR_STATEMENT_HAS_NO_LINES)"
          - "Agency.appointment_status != TERMINATED (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at = current_utc; reported_gross_premium_cents and underwriter_share_cents recomputed per calculations.remittance_premium_split"
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /remittance-statements/{id}/state with to_state=RECONCILED"
        actor: ComplianceOfficer
        preconditions:
          - "Acting role is ComplianceOfficer (else ERR_TRANSITION_ROLE_NOT_PERMITTED)"
        side_effects:
          - "expected_gross_premium_cents, variance_cents, unreported_policy_count, unreported_premium_cents and late_fee_cents computed per calculations.remittance_reconciliation; reconciled_at = current_utc"
          - "Each referenced PolicyFile with premium_mismatch == false moves UNREPORTED -> REPORTED; each with premium_mismatch == true moves UNREPORTED -> DISPUTED"
          - "Agency.unreported_policy_count mirrored from this statement, then Agency.oversight_posture recomputed (unreported_policy_count >= 3 is a RESTRICTED condition)"
          - "Agency.version incremented by 1"
      - from: RECONCILED
        to: SETTLED
        trigger: "POST /remittance-statements/{id}/state with to_state=SETTLED"
        actor: ComplianceOfficer
        preconditions:
          - "settled_amount_cents present in the request body (else ERR_INVALID_REQUEST)"
          - "settled_amount_cents == underwriter_share_cents + late_fee_cents (else ERR_SETTLEMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "CASCADE-C hop 1: status -> SETTLED; settled_at = current_utc; settled_amount_cents persisted"
          - "CASCADE-C hop 2: because the statement became SETTLED, every referenced PolicyFile with remittance_status == REPORTED moves to REMITTED (DISPUTED files are left untouched)"
          - "CASCADE-C hop 3: because those files became REMITTED, Agency.unremitted_premium_cents is recomputed per calculations.unremitted_premium_ledger"
          - "CASCADE-C hop 4: because Agency.unremitted_premium_cents and Agency.unreported_policy_count changed, Agency.oversight_posture is recomputed"
          - "CASCADE-C hop 5: when oversight_posture leaves FROZEN or RESTRICTED for OPEN, every EscrowAccount with agency_id == this agency and status == RESTRICTED moves to OPEN"
          - "Agency.version incremented by 1"
      - from: SETTLED
        to: DRAFT
        trigger: "POST /remittance-statements/{id}/state with to_state=DRAFT"
        actor: ComplianceOfficer
        preconditions:
          - "reopen_reason present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reopen_count incremented by 1; reopen_reason persisted; settled_at, reconciled_at and submitted_at reset to null; expected_gross_premium_cents, variance_cents, unreported_policy_count, unreported_premium_cents and late_fee_cents reset to 0"
          - "Every referenced PolicyFile with remittance_status == REMITTED moves to REPORTED; every one with DISPUTED moves to UNREPORTED"
          - "Agency.unremitted_premium_cents recomputed — compensating action of CASCADE-C, restoring the ledger to its pre-settlement value"
          - "Agency.unreported_policy_count recomputed from the agency's most recently reconciled statement (0 when none remains reconciled), then oversight_posture recomputed"
          - "Agency.version incremented by 1"
        note: "Reopen cycle: SETTLED -> DRAFT -> SUBMITTED -> RECONCILED -> SETTLED may run repeatedly."
      - from: RECONCILED
        to: DRAFT
        trigger: "POST /remittance-statements/{id}/state with to_state=DRAFT"
        actor: ComplianceOfficer
        preconditions:
          - "reopen_reason present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reopen_count incremented by 1; every referenced PolicyFile with remittance_status IN {REPORTED, DISPUTED} moves to UNREPORTED; reconciliation outputs reset to 0"
          - "Agency.unreported_policy_count and oversight_posture recomputed; Agency.version incremented by 1"

  # ---- EscrowAudit: cyclic review loop UNDER_REVIEW -> REMEDIATION_REQUIRED -> SUBMITTED.
  - entity: EscrowAudit
    initial_state: DRAFT
    terminal_states: [CLOSED_CLEAN, CLOSED_ADVERSE]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /escrow-audits/{id}/state with to_state=SUBMITTED"
        actor: EscrowAuditor
        preconditions:
          - "The linked EscrowAccount.snapshot_as_of is not null (else ERR_BALANCE_SNAPSHOT_REQUIRED)"
          - "The linked EscrowAccount.status != CLOSED (else ERR_ESCROW_ACCOUNT_CLOSED)"
        side_effects:
          - "variance_method and reconciliation_variance_cents computed per calculations.escrow_three_way_variance; unidentified_funds_reviewed_cents captured; submitted_at = current_utc"
          - "When reconciliation_variance_cents > StateProgram.three_way_tolerance_cents of the state program of the agency's oldest ACTIVE appointment (created_at ASC), a THREE_WAY_VARIANCE AuditFinding is created with exposure_cents = reconciliation_variance_cents"
          - "When EscrowAccount.aged_unidentified_over_90_cents > 0, an UNIDENTIFIED_FUNDS_AGED AuditFinding is created with exposure_cents = aged_unidentified_over_90_cents"
          - "risk_tier, open_finding_count and critical_finding_count recomputed; Agency.open_critical_finding_count recomputed, then Agency.oversight_posture recomputed"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /escrow-audits/{id}/state with to_state=UNDER_REVIEW"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REMEDIATION_REQUIRED
        trigger: "POST /escrow-audits/{id}/state with to_state=REMEDIATION_REQUIRED"
        actor: ComplianceOfficer
        preconditions:
          - "At least one AuditFinding of this audit has status IN {OPEN, REMEDIATION_SUBMITTED} (else ERR_NO_OPEN_FINDING)"
        side_effects: []
      - from: REMEDIATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /escrow-audits/{id}/state with to_state=SUBMITTED"
        actor: EscrowAuditor
        preconditions:
          - "The linked EscrowAccount.snapshot_as_of is not null"
          - "The linked EscrowAccount.status != CLOSED"
        side_effects:
          - "reconciliation_variance_cents recomputed against the account's CURRENT snapshot (a re-snapshot between loops changes the value); submitted_at refreshed"
          - "New auto-findings are created only for conditions that do not already have a finding with status IN {OPEN, REMEDIATION_SUBMITTED} on this audit"
        note: "Revision cycle: UNDER_REVIEW -> REMEDIATION_REQUIRED -> SUBMITTED -> UNDER_REVIEW may repeat."
      - from: UNDER_REVIEW
        to: CLOSED_CLEAN
        trigger: "POST /escrow-audits/{id}/state with to_state=CLOSED_CLEAN"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != conducted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Every AuditFinding of this audit has status == CLEARED (else ERR_UNREMEDIATED_FINDING_PRESENT)"
        side_effects:
          - "closed_by_user_id = X-User-ID; closed_at = current_utc"
          - "Agency.defalcation_score recomputed under variant rolling_window_365, then Agency.escrow_standing and Agency.oversight_posture recomputed"
          - "Agency.version incremented by 1"
      - from: UNDER_REVIEW
        to: CLOSED_ADVERSE
        trigger: "POST /escrow-audits/{id}/state with to_state=CLOSED_ADVERSE"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != conducted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "At least one AuditFinding of this audit has status == ESCALATED (else ERR_NO_ESCALATED_FINDING)"
        side_effects:
          - "CASCADE-A hop 1: status -> CLOSED_ADVERSE; closed_by_user_id = X-User-ID; closed_at = current_utc; Agency.defalcation_score recomputed under variant rolling_window_365"
          - "CASCADE-A hop 2: because the recomputed defalcation_score >= DEFALCATION_RISK_THRESHOLD, Agency.escrow_standing -> DEFALCATION_RISK"
          - "CASCADE-A hop 3: because escrow_standing became DEFALCATION_RISK, Agency.oversight_posture -> FROZEN"
          - "CASCADE-A hop 4: because oversight_posture became FROZEN, every EscrowAccount with agency_id == this agency and status == OPEN moves to RESTRICTED, and every ClosingProtectionLetter with agency_id == this agency and status IN {REQUESTED, REFERRED} moves to DECLINED (created_at ASC order)"
          - "CASCADE-A hop 5: because oversight_posture became FROZEN, a successor EscrowAudit is auto-created for the same escrow_account_id with audit_type = SURPRISE, status = DRAFT, as_of_date = date(current_utc), follow_up_of_audit_id = this audit's id and conducted_by_user_id = 'SYSTEM'; this system-created audit does NOT recompute Agency.defalcation_score"
          - "Agency.version incremented by 1"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CLEARED, ESCALATED]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /audit-findings/{id}/state with to_state=REMEDIATION_SUBMITTED"
        actor: AgencyPrincipal
        preconditions:
          - "X-User-ID == the agency_id of the parent EscrowAudit (else ERR_AGENCY_OWNERSHIP_REQUIRED)"
          - "remediation_note present in the request body (else ERR_INVALID_REQUEST)"
          - "Parent EscrowAudit.status IN {SUBMITTED, UNDER_REVIEW, REMEDIATION_REQUIRED} (else ERR_INVALID_STATE)"
        side_effects:
          - "remediation_note and cleared_amount_cents persisted; parent EscrowAudit.open_finding_count unchanged (REMEDIATION_SUBMITTED still counts as open)"
      - from: REMEDIATION_SUBMITTED
        to: CLEARED
        trigger: "POST /audit-findings/{id}/state with to_state=CLEARED"
        actor: EscrowAuditor
        preconditions:
          - "Acting role IN {EscrowAuditor, ComplianceOfficer} (else ERR_TRANSITION_ROLE_NOT_PERMITTED)"
        side_effects:
          - "Parent EscrowAudit.open_finding_count and risk_tier recomputed"
          - "Agency.open_critical_finding_count recomputed, then Agency.oversight_posture recomputed"
      - from: REMEDIATION_SUBMITTED
        to: ESCALATED
        trigger: "POST /audit-findings/{id}/state with to_state=ESCALATED"
        actor: EscrowAuditor
        preconditions:
          - "Acting role IN {EscrowAuditor, ComplianceOfficer}"
        side_effects:
          - "Parent EscrowAudit.open_finding_count recomputed"
          - "Agency.open_critical_finding_count recomputed; because that count changed, Agency.oversight_posture is recomputed (open_critical_finding_count >= 1 is a RESTRICTED condition); because the posture changed, every EscrowAccount of the agency with status == OPEN moves to RESTRICTED only when the posture landed on FROZEN"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /audit-findings/{id}/state with to_state=ESCALATED"
        actor: EscrowAuditor
        preconditions:
          - "Acting role IN {EscrowAuditor, ComplianceOfficer}"
        side_effects:
          - "Same as REMEDIATION_SUBMITTED -> ESCALATED — the branch skipping remediation"

  - entity: AgencyClaim
    initial_state: INVESTIGATING
    terminal_states: [ABSORBED, RECOVERED, WRITTEN_OFF]
    transitions:
      - from: INVESTIGATING
        to: RECOURSE_DEMANDED
        trigger: "POST /agency-claims/{id}/state with to_state=RECOURSE_DEMANDED"
        actor: UnderwritingCounsel
        preconditions:
          - "X-User-ID != the linked PolicyFile.referral_decided_by_user_id (else ERR_SEGREGATION_OF_DUTIES) — the counsel who approved the referral may not adjudicate recourse on the same file"
          - "Agency.eo_policy_limit_cents > 0 (else ERR_EO_COVERAGE_LAPSED)"
        side_effects:
          - "recourse_tier, indemnity_offset_cents, recourse_amount_cents and net_underwriter_exposure_cents computed per calculations.claim_recourse_and_indemnity; decided_by_user_id = X-User-ID"
          - "When cause_code == ESCROW_DEFALCATION, Agency.escrow_standing -> DEFALCATION_RISK; because escrow_standing changed, Agency.oversight_posture -> FROZEN; because the posture became FROZEN, every EscrowAccount of the agency with status == OPEN moves to RESTRICTED and every ClosingProtectionLetter with status IN {REQUESTED, REFERRED} moves to DECLINED"
          - "Agency.version incremented by 1"
      - from: INVESTIGATING
        to: ABSORBED
        trigger: "POST /agency-claims/{id}/state with to_state=ABSORBED"
        actor: UnderwritingCounsel
        preconditions:
          - "X-User-ID != the linked PolicyFile.referral_decided_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "indemnity_offset_cents = 0; recourse_amount_cents = 0; net_underwriter_exposure_cents = loss_amount_cents; recourse_tier still computed and stored; decided_by_user_id = X-User-ID"
          - "No escrow_standing or posture change on this branch — the divergent side-effect set versus RECOURSE_DEMANDED"
      - from: RECOURSE_DEMANDED
        to: RECOVERED
        trigger: "POST /agency-claims/{id}/state with to_state=RECOVERED"
        actor: ComplianceOfficer
        preconditions:
          - "recovered_amount_cents present in the request body (else ERR_INVALID_REQUEST)"
          - "recovered_amount_cents <= recourse_amount_cents (else ERR_RECOVERY_EXCEEDS_RECOURSE)"
        side_effects:
          - "recovered_amount_cents persisted; net_underwriter_exposure_cents recomputed as loss_amount_cents - indemnity_offset_cents - recovered_amount_cents"
      - from: RECOURSE_DEMANDED
        to: WRITTEN_OFF
        trigger: "POST /agency-claims/{id}/state with to_state=WRITTEN_OFF"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recovered_amount_cents stays 0; net_underwriter_exposure_cents recomputed as loss_amount_cents - indemnity_offset_cents"

  - entity: EscrowAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system — any transition that drives Agency.oversight_posture to FROZEN"
        actor: system
        preconditions: []
        side_effects:
          - "Balance snapshots are still accepted while RESTRICTED; audit submission is not blocked"
      - from: RESTRICTED
        to: OPEN
        trigger: "system — any transition that drives Agency.oversight_posture out of FROZEN"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system — Agency -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTRICTED
        to: CLOSED
        trigger: "system — Agency -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Agency.version only
# =============================================================================
concurrency_rules:
  - rule_id: cpl-request-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /closing-protection-letters"
    occ_field: "expected_agency_version"
    description: |
      A closing protection letter request carries the Agency.version the
      requester last observed. Requesting against a stale version is rejected,
      because the routing decision recorded on the new letter (REQUESTED versus
      REFERRED) is derived from Agency.oversight_posture and
      Agency.underwriting_authority_limit_cents as of that observation; a
      version that has since advanced means the request was routed against an
      agency profile that no longer holds.
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412
  - rule_id: policy-file-create-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /policy-files"
    occ_field: "expected_agency_version"
    description: |
      A policy file creation carries the Agency.version the agency last
      observed. Creating against a stale version is rejected, because the
      referral routing stamped on the new file is derived from
      Agency.underwriting_authority_limit_cents at that version.
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412
  - rule_id: remittance-statement-create-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /remittance-statements"
    occ_field: "expected_agency_version"
    description: |
      A remittance statement creation carries the Agency.version the agency
      last observed. A new statement legitimately supersedes the agency's prior
      remittance baseline (Agency.last_remittance_period_end), so a creation
      carrying a version that has since advanced is rejected as a stale-baseline
      write rather than accepted on top of an unseen period.
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# All money is integer cents. Every rounding step is round_half_up on the exact
# rational product (never banker's rounding, never float truncation).
# =============================================================================
calculations:
  - name: escrow_three_way_variance
    description: |
      Reconciliation variance between the escrow bank account, the book balance
      and the trial balance of individual file ledgers. Two variants: a surprise
      audit must reconcile all three legs against each other, a scheduled audit
      only compares the adjusted bank balance to the trial balance.
    trigger: "EscrowAudit DRAFT -> SUBMITTED and REMEDIATION_REQUIRED -> SUBMITTED"
    inputs:
      - "EscrowAccount.book_balance_cents"
      - "EscrowAccount.bank_balance_cents"
      - "EscrowAccount.outstanding_items_cents"
      - "EscrowAccount.trial_balance_cents"
      - "EscrowAccount.adjusted_bank_balance_cents"
      - "EscrowAudit.audit_type"
    algorithm: threshold
    formula: |
      adjusted_bank = bank_balance_cents - outstanding_items_cents
        (persisted on EscrowAccount.adjusted_bank_balance_cents by
         POST /escrow-accounts/{id}/balance-snapshot)

      variant STRICT_THREE_WAY:
        reconciliation_variance_cents = max(
            abs(adjusted_bank - book_balance_cents),
            abs(adjusted_bank - trial_balance_cents),
            abs(book_balance_cents - trial_balance_cents))

      variant BANK_TO_TRIAL:
        reconciliation_variance_cents = abs(adjusted_bank - trial_balance_cents)

      variance_method is persisted on the audit as the variant name.

      Worked example — book 10000000, bank 10120000, outstanding 100000,
      trial 10015000 => adjusted_bank = 10020000.
        STRICT_THREE_WAY: max(20000, 5000, 15000) = 20000
        BANK_TO_TRIAL:    abs(10020000 - 10015000) = 5000
    constants: {}
    precision: "integer cents; no rounding required (all inputs are integers)"
    variants:
      - name: STRICT_THREE_WAY
        when: "EscrowAudit.audit_type == SURPRISE"
        difference: "Takes the maximum of all three pairwise absolute differences, so a book-to-trial break is caught even when the bank leg happens to agree with the trial balance."
      - name: BANK_TO_TRIAL
        when: "EscrowAudit.audit_type == SCHEDULED"
        difference: "Compares only the adjusted bank balance with the trial balance; a book-to-trial break invisible in that pair is not reported."

  - name: audit_finding_severity
    description: |
      Severity of an escrow audit finding: a base severity from the finding code
      and its exposure, escalated one rung when the same code has been raised on
      an earlier audit of the same escrow account.
    trigger: "AuditFinding creation (POST /escrow-audits/{id}/findings, and system auto-findings raised on audit submission)"
    inputs:
      - "AuditFinding.code"
      - "AuditFinding.exposure_cents"
      - "prior AuditFinding rows whose parent EscrowAudit has the same escrow_account_id and an earlier created_at"
    algorithm: threshold
    formula: |
      base_severity by code:
        THREE_WAY_VARIANCE:
          exposure_cents <= 100000    -> LOW
          exposure_cents <= 1000000   -> MEDIUM
          exposure_cents <= 5000000   -> HIGH
          exposure_cents >  5000000   -> CRITICAL
        UNIDENTIFIED_FUNDS_AGED:
          exposure_cents <= 500000    -> MEDIUM
          exposure_cents >  500000    -> HIGH
        NEGATIVE_FILE_BALANCE  -> HIGH
        MISSING_RECONCILIATION -> MEDIUM
        COMMINGLING            -> CRITICAL

      is_repeat = true when at least one AuditFinding exists with the same
        code whose parent EscrowAudit has the same escrow_account_id, a
        different id, and created_at strictly earlier than this finding's
        parent audit's created_at.

      severity = base_severity when is_repeat == false
      severity = next rung up the ladder LOW -> MEDIUM -> HIGH -> CRITICAL
                 when is_repeat == true (CRITICAL is the ceiling and does not
                 escalate further)

      Worked example — THREE_WAY_VARIANCE with exposure_cents = 100000 on a
      first audit: base LOW, is_repeat false, severity LOW. The same code with
      exposure_cents = 100000 on a later audit of the same account: base LOW,
      is_repeat true, severity MEDIUM.
    constants:
      THREE_WAY_LOW_MAX_CENTS: 100000
      THREE_WAY_MEDIUM_MAX_CENTS: 1000000
      THREE_WAY_HIGH_MAX_CENTS: 5000000
      UNIDENTIFIED_MEDIUM_MAX_CENTS: 500000
    precision: "n/a (enum output)"

  - name: escrow_audit_risk_tier
    description: "Risk tier of an escrow audit, derived from the severities of its non-cleared findings."
    trigger: "AuditFinding creation and every AuditFinding status change"
    inputs:
      - "AuditFinding.severity for all findings of the audit"
      - "AuditFinding.status for all findings of the audit"
    algorithm: aggregation
    formula: |
      open_finding_count    = count(findings with status IN {OPEN, REMEDIATION_SUBMITTED})
      critical_finding_count = count(findings with severity == CRITICAL and status != CLEARED)

      risk_tier =
        CRITICAL when any finding has severity == CRITICAL and status != CLEARED
        HIGH     else when any finding has severity == HIGH and status != CLEARED
        MEDIUM   else when open_finding_count >= 1
        LOW      otherwise (no findings, or every finding CLEARED)
    constants: {}
    precision: "n/a (enum output)"

  - name: agency_defalcation_score
    description: |
      Weighted defalcation risk score for an agency, from escrow finding
      severities, adverse audit closures and defalcation claims. Two variants
      differ in which historical rows are in scope.
    trigger: "EscrowAudit UNDER_REVIEW -> CLOSED_CLEAN / CLOSED_ADVERSE (variant rolling_window_365); actor-initiated POST /escrow-audits (variant lifetime_uncleared)"
    inputs:
      - "AuditFinding.severity and AuditFinding.status across all audits of the agency"
      - "EscrowAudit.status and EscrowAudit.as_of_date across all audits of the agency"
      - "AgencyClaim.cause_code, AgencyClaim.status and AgencyClaim.notice_date"
      - "current_utc"
    algorithm: weighted_scoring
    formula: |
      Scope sets (variant-dependent, see variants below):
        C = count of in-scope AuditFinding rows with severity == CRITICAL
        H = count of in-scope AuditFinding rows with severity == HIGH
        A = count of in-scope EscrowAudit rows with status == CLOSED_ADVERSE
        U = count of in-scope AgencyClaim rows with cause_code == ESCROW_DEFALCATION
            and status != INVESTIGATING

      raw   = 25*C + 12*H + 8*A + 15*U
      score = min(SCORE_CAP, raw)              -> Agency.defalcation_score

      escrow_standing =
        DEFALCATION_RISK when score >= DEFALCATION_RISK_THRESHOLD
        WATCH            else when score >= ESCROW_WATCH_THRESHOLD
        COMPLIANT        otherwise

      Worked example — an agency whose in-scope counts are C=0, H=1, A=1, U=0
      under rolling_window_365: raw = 12 + 8 = 20, score 20, standing COMPLIANT.
      The same agency under lifetime_uncleared with C=1, H=1, A=2, U=0:
      raw = 25 + 12 + 16 = 53, score 53, standing WATCH.
    constants:
      WEIGHT_CRITICAL_FINDING: 25
      WEIGHT_HIGH_FINDING: 12
      WEIGHT_ADVERSE_CLOSURE: 8
      WEIGHT_DEFALCATION_CLAIM: 15
      SCORE_CAP: 100
      DEFALCATION_RISK_THRESHOLD: 60
      ESCROW_WATCH_THRESHOLD: 30
    precision: "integer score, capped at SCORE_CAP"
    variants:
      - name: rolling_window_365
        when: "The score is recomputed by an EscrowAudit closure (CLOSED_CLEAN or CLOSED_ADVERSE)"
        difference: "In scope are only rows dated on or after date(current_utc) - 365 days (AuditFinding via its parent audit's as_of_date, EscrowAudit via as_of_date, AgencyClaim via notice_date). Finding status is ignored: cleared findings inside the window still score."
      - name: lifetime_uncleared
        when: "The score is recomputed by an actor-initiated POST /escrow-audits (any audit_type). System-created successor audits from CASCADE-A hop 5 do NOT recompute the score."
        difference: "No date window — the agency's entire history is in scope — but AuditFinding rows with status == CLEARED are excluded. An old uncleared critical finding scores here and not in rolling_window_365; a recently cleared finding scores in rolling_window_365 and not here."

  - name: agency_oversight_posture
    description: |
      Gating posture of an agency, recomputed after every change to its
      appointment, financial review, escrow standing, finding counts or
      remittance ledgers. FROZEN blocks all new coverage; RESTRICTED halves the
      closing protection coverage cap and forces counsel referral.
    trigger: "Every transition or ledger recomputation that touches Agency.appointment_status, financial_review_status, escrow_standing, open_critical_finding_count, unreported_policy_count or unremitted_premium_cents"
    inputs:
      - "Agency.appointment_status"
      - "Agency.financial_review_status"
      - "Agency.escrow_standing"
      - "Agency.open_critical_finding_count"
      - "Agency.unreported_policy_count"
      - "Agency.unremitted_premium_cents"
    algorithm: constraint_propagation
    formula: |
      FROZEN when any of:
        appointment_status IN {SUSPENDED, TERMINATED}
        escrow_standing == DEFALCATION_RISK

      else RESTRICTED when any of:
        appointment_status == PENDING_REVIEW
        financial_review_status != ACCEPTED
        escrow_standing == WATCH
        open_critical_finding_count >= 1
        unreported_policy_count >= UNREPORTED_POLICY_RESTRICT_THRESHOLD
        unremitted_premium_cents > UNREMITTED_TOLERANCE_CENTS

      else OPEN.

      A freshly created agency is PENDING_REVIEW + NOT_SUBMITTED, so its posture
      is RESTRICTED, matching the Agency.oversight_posture default.

      Note: an expired E&O policy (eo_expires_on < date(current_utc)) does NOT
      change the posture. It is enforced as its own business_safety validation
      so that ERR_EO_COVERAGE_LAPSED stays reachable instead of being masked by
      the higher-priority ERR_AGENCY_POSTURE_FROZEN.
    constants:
      UNREPORTED_POLICY_RESTRICT_THRESHOLD: 3
      UNREMITTED_TOLERANCE_CENTS: 50000000
    precision: "n/a (enum output)"

  - name: cpl_referral_routing
    description: "Landing state of a newly requested closing protection letter, and the referral reason recorded on it."
    trigger: "POST /closing-protection-letters"
    inputs:
      - "ClosingProtectionLetter.complex_title_flag"
      - "ClosingProtectionLetter.requested_coverage_cents"
      - "StateProgram.counsel_referral_threshold_cents"
      - "Agency.underwriting_authority_limit_cents"
      - "Agency.oversight_posture"
    algorithm: threshold
    formula: |
      Evaluate the four referral conditions in this fixed order and stop at the
      first match; referral_reason is that condition's label:
        1. complex_title_flag == true                                    -> COMPLEX_TITLE
        2. requested_coverage_cents > StateProgram.counsel_referral_threshold_cents -> STATE_REFERRAL_THRESHOLD
        3. requested_coverage_cents > Agency.underwriting_authority_limit_cents     -> AUTHORITY_LIMIT
        4. Agency.oversight_posture == RESTRICTED                        -> RESTRICTED_POSTURE

      status = REFERRED with that referral_reason when any condition matched,
      otherwise status = REQUESTED with referral_reason = null.
    constants: {}
    precision: "n/a (enum output)"

  - name: cpl_approved_coverage
    description: |
      Approved coverage of a closing protection letter: the smallest of four
      independent caps — the amount requested, the state coverage cap scaled by
      the coverage scope, the posture cap, and the E&O sublimit.
    trigger: "ClosingProtectionLetter REQUESTED/REFERRED -> ISSUED"
    inputs:
      - "ClosingProtectionLetter.requested_coverage_cents"
      - "ClosingProtectionLetter.coverage_scope"
      - "StateProgram.cpl_coverage_cap_cents"
      - "Agency.oversight_posture"
      - "Agency.eo_policy_limit_cents"
    algorithm: threshold
    formula: |
      scope_factor = { FULL_SETTLEMENT: 1.00, LENDER_ONLY: 0.80, SELLER_PROCEEDS: 0.60 }[coverage_scope]

      state_cap   = floor(StateProgram.cpl_coverage_cap_cents * scope_factor)
      posture_cap = state_cap                                   when Agency.oversight_posture == OPEN
                  = floor(state_cap * RESTRICTED_POSTURE_CAP_FACTOR)
                                                                when Agency.oversight_posture == RESTRICTED
                  (FROZEN never reaches this calculation — ERR_AGENCY_POSTURE_FROZEN fires first)
      eo_sublimit = floor(Agency.eo_policy_limit_cents * EO_SUBLIMIT_FACTOR)

      approved_coverage_cents = min(requested_coverage_cents, state_cap, posture_cap, eo_sublimit)

      Worked examples — requested 90000000, coverage_scope LENDER_ONLY,
      StateProgram.cpl_coverage_cap_cents 100000000:
        state_cap = 80000000
        (a) posture OPEN, eo_policy_limit_cents 200000000 -> eo_sublimit 100000000
            approved = min(90000000, 80000000, 80000000, 100000000) = 80000000  (state cap binds)
        (b) posture RESTRICTED, eo_policy_limit_cents 200000000 -> posture_cap 40000000
            approved = min(90000000, 80000000, 40000000, 100000000) = 40000000  (posture cap binds)
        (c) posture OPEN, eo_policy_limit_cents 100000000 -> eo_sublimit 50000000
            approved = min(90000000, 80000000, 80000000, 50000000) = 50000000   (E&O sublimit binds)
    constants:
      SCOPE_FACTOR_FULL_SETTLEMENT: 1.00
      SCOPE_FACTOR_LENDER_ONLY: 0.80
      SCOPE_FACTOR_SELLER_PROCEEDS: 0.60
      RESTRICTED_POSTURE_CAP_FACTOR: 0.50
      EO_SUBLIMIT_FACTOR: 0.50
    precision: "integer cents; each cap floored before the min is taken"

  - name: policy_referral_routing
    description: "Landing issuance_status of a newly created policy file, and its initial approved liability."
    trigger: "POST /policy-files"
    inputs:
      - "PolicyFile.complex_title_flag"
      - "PolicyFile.liability_amount_cents"
      - "Agency.underwriting_authority_limit_cents"
      - "StateProgram.counsel_referral_threshold_cents"
    algorithm: threshold
    formula: |
      referral_required = complex_title_flag == true
                          OR liability_amount_cents > Agency.underwriting_authority_limit_cents
                          OR liability_amount_cents > StateProgram.counsel_referral_threshold_cents

      issuance_status          = PENDING_REFERRAL when referral_required else PENDING
      approved_liability_cents = 0 when referral_required else liability_amount_cents

      Note the comparisons are strict: a liability exactly equal to
      Agency.underwriting_authority_limit_cents is within authority and lands
      on PENDING.
    constants: {}
    precision: "integer cents"

  - name: policy_issuance_timeliness
    description: "Whether a policy was issued inside the state's issuance deadline, measured from the closing date."
    trigger: "PolicyFile PENDING -> ISSUED / LATE_ISSUED"
    inputs:
      - "PolicyFile.closing_date"
      - "current_utc"
      - "StateProgram.policy_issuance_deadline_days"
    algorithm: chronological
    formula: |
      issuance_elapsed_days = date(current_utc) - PolicyFile.closing_date, in whole days
      issuance_status = ISSUED       when issuance_elapsed_days <= StateProgram.policy_issuance_deadline_days
                      = LATE_ISSUED  when issuance_elapsed_days >  StateProgram.policy_issuance_deadline_days

      Worked example with policy_issuance_deadline_days = 30 and
      current_utc = 2026-08-01T00:00:00Z:
        closing_date 2026-07-02 -> 30 elapsed days -> ISSUED (boundary is inclusive)
        closing_date 2026-07-01 -> 31 elapsed days -> LATE_ISSUED
    constants: {}
    precision: "whole days; the comparison is <= (only a strictly greater elapsed count is late)"

  - name: remittance_premium_split
    description: |
      Split of reported premium between the agency's retention and the
      underwriter's share. The split percentage comes from the state program of
      each individual policy, so the statement total must be built by rounding
      every line and then summing the lines.
    trigger: "RemittanceLine creation (POST /remittance-statements/{id}/lines) and RemittanceStatement DRAFT -> SUBMITTED"
    inputs:
      - "RemittanceLine.reported_gross_premium_cents"
      - "StateProgram.premium_split_agency_pct of the line's PolicyFile.state_program_id"
    algorithm: aggregation
    formula: |
      Per line, in this order:
        line.agency_retention_cents  = round_half_up(line.reported_gross_premium_cents
                                                     * StateProgram.premium_split_agency_pct)
        line.underwriter_share_cents = line.reported_gross_premium_cents - line.agency_retention_cents

      Statement totals are sums of the already-rounded line values:
        statement.reported_gross_premium_cents = sum(line.reported_gross_premium_cents)
        statement.agency_retention_cents       = sum(line.agency_retention_cents)
        statement.underwriter_share_cents      = sum(line.underwriter_share_cents)

      FORBIDDEN order of operations: computing
      round_half_up(sum(line.reported_gross_premium_cents) * pct) at the
      statement level. With three lines of 33333 cents at pct 0.80 the correct
      per-line-then-sum result is agency_retention 26666 per line (79998 total)
      and underwriter_share 6667 per line (20001 total); the forbidden
      sum-then-round order yields 79999 and 20000.

      Half-up example: reported_gross_premium_cents 12012 at pct 0.875 gives
      the exact product 10510.5, which rounds half-up to 10511 (banker's
      rounding would give 10510), leaving underwriter_share_cents 1501.
    constants: {}
    precision: "integer cents; round_half_up applied once per line, never to a statement-level product"

  - name: remittance_reconciliation
    description: |
      Reconciliation of a submitted statement against the policies the agency
      actually issued in the period: expected premium, variance, unreported
      policy detection, and the late-filing plus unreported-premium penalty.
    trigger: "RemittanceStatement SUBMITTED -> RECONCILED"
    inputs:
      - "RemittanceStatement.period_start, period_end, submitted_at, reported_gross_premium_cents"
      - "PolicyFile.gross_premium_cents, closing_date, issuance_status, agency_id"
      - "RemittanceLine.policy_file_id and RemittanceLine.reported_gross_premium_cents of this statement"
    algorithm: aggregation
    formula: |
      in_period = every PolicyFile with agency_id == statement.agency_id,
                  issuance_status IN {ISSUED, LATE_ISSUED} and
                  period_start <= closing_date <= period_end (both bounds inclusive)

      expected_gross_premium_cents = sum(gross_premium_cents over in_period)
      variance_cents               = expected_gross_premium_cents - statement.reported_gross_premium_cents
      unreported = in_period rows not referenced by any RemittanceLine of this statement
      unreported_policy_count      = count(unreported)
      unreported_premium_cents     = sum(gross_premium_cents over unreported)

      filing_fee_cents  = LATE_FILING_FEE_CENTS when
                          date(statement.submitted_at) > period_end + REMITTANCE_GRACE_DAYS
                          else 0
      penalty_cents     = round_half_up(unreported_premium_cents * UNREPORTED_PENALTY_PCT)
      late_fee_cents    = filing_fee_cents + penalty_cents

      Per line: premium_mismatch = line.reported_gross_premium_cents !=
                                   the referenced PolicyFile.gross_premium_cents

      Worked example — period 2026-07-01..2026-07-31; issued policies P1/P2/P3
      of 33333 cents each (all reported on lines) and P4 of 500000 cents with no
      line; submitted_at 2026-08-20T00:00:00Z:
        expected_gross_premium_cents = 599999
        reported_gross_premium_cents = 99999
        variance_cents = 500000
        unreported_policy_count = 1
        filing_fee_cents = 25000 (2026-08-20 > 2026-07-31 + 15 days = 2026-08-15)
        penalty_cents = round_half_up(500000 * 0.10) = 50000
        late_fee_cents = 75000

      Empty-set boundary — when every in-period policy appears on a line,
      unreported_policy_count = 0, unreported_premium_cents = 0 and
      penalty_cents = 0; when submitted_at is exactly period_end +
      REMITTANCE_GRACE_DAYS, filing_fee_cents = 0 (the comparison is strict).
    constants:
      REMITTANCE_GRACE_DAYS: 15
      LATE_FILING_FEE_CENTS: 25000
      UNREPORTED_PENALTY_PCT: 0.10
    precision: "integer cents; round_half_up on the penalty product"

  - name: claim_recourse_and_indemnity
    description: |
      Recourse and indemnity split of a claim arising from agency error. The
      recourse tier is pinned from the GROSS loss against the agency's E&O
      limit; the indemnity obligation and then the recourse demand are derived
      from that pinned tier, never re-derived from the net-of-indemnity loss.
    trigger: "AgencyClaim INVESTIGATING -> RECOURSE_DEMANDED"
    inputs:
      - "AgencyClaim.loss_amount_cents"
      - "AgencyClaim.cause_code"
      - "Agency.eo_policy_limit_cents"
    algorithm: waterfall_allocation
    formula: |
      Step 1 — tier, pinned from the GROSS loss:
        gross_ratio = loss_amount_cents / Agency.eo_policy_limit_cents   (exact rational)
        recourse_tier = TIER_1 when gross_ratio <= 0.25
                      = TIER_2 when gross_ratio <= 0.60
                      = TIER_3 otherwise

      Step 2 — indemnity obligation from the pinned tier:
        participation = { TIER_1: 0.50, TIER_2: 0.75, TIER_3: 1.00 }[recourse_tier]
        indemnity_offset_cents = min(round_half_up(loss_amount_cents * participation),
                                     Agency.eo_policy_limit_cents)

      Step 3 — recourse demand, scaled by cause culpability:
        cause_factor = { AGENCY_ERROR: 0.60, SEARCH_DEFECT: 0.40,
                         UNDERWRITING_BREACH: 0.80, ESCROW_DEFALCATION: 1.00 }[cause_code]
        recourse_amount_cents = round_half_up(indemnity_offset_cents * cause_factor)

      Step 4 — exposure:
        net_underwriter_exposure_cents = loss_amount_cents - indemnity_offset_cents
        (later reduced by recovered_amount_cents on RECOURSE_DEMANDED -> RECOVERED)

      Step 1 must not be re-run on the net figure. Worked example with
      Agency.eo_policy_limit_cents 100000000, loss_amount_cents 40000000,
      cause_code AGENCY_ERROR:
        gross_ratio 0.40 -> TIER_2 -> indemnity 30000000
        recourse = round_half_up(30000000 * 0.60) = 18000000
        exposure = 40000000 - 30000000 = 10000000
      Re-deriving the tier from the exposure (10000000 / 100000000 = 0.10 ->
      TIER_1) would wrongly produce indemnity 20000000, recourse 12000000 and
      exposure 20000000.

      Boundary pair at the TIER_1/TIER_2 edge with eo_policy_limit_cents
      100000000:
        loss 25000000 -> ratio exactly 0.25 -> TIER_1 -> indemnity 12500000,
          SEARCH_DEFECT recourse round_half_up(5000000.0) = 5000000, exposure 12500000
        loss 25000001 -> ratio just above 0.25 -> TIER_2 ->
          indemnity round_half_up(18750000.75) = 18750001,
          SEARCH_DEFECT recourse round_half_up(7500000.4) = 7500000,
          exposure 25000001 - 18750001 = 6250000
    constants:
      TIER_1_MAX_RATIO: 0.25
      TIER_2_MAX_RATIO: 0.60
      PARTICIPATION_TIER_1: 0.50
      PARTICIPATION_TIER_2: 0.75
      PARTICIPATION_TIER_3: 1.00
      CAUSE_FACTOR_AGENCY_ERROR: 0.60
      CAUSE_FACTOR_SEARCH_DEFECT: 0.40
      CAUSE_FACTOR_UNDERWRITING_BREACH: 0.80
      CAUSE_FACTOR_ESCROW_DEFALCATION: 1.00
    precision: "integer cents; round_half_up at step 2 and step 3 independently"

  - name: cpl_exposure_ledger
    description: "Agency-level outstanding closing protection exposure — a conserved quantity restored exactly when an issued letter is voided."
    trigger: "ClosingProtectionLetter -> ISSUED and ClosingProtectionLetter ISSUED -> VOIDED"
    inputs:
      - "ClosingProtectionLetter.approved_coverage_cents and status for every letter of the agency"
    algorithm: aggregation
    formula: |
      Agency.cpl_outstanding_exposure_cents =
        sum(approved_coverage_cents over ClosingProtectionLetter rows with
            agency_id == this agency and status == ISSUED)

      Issuance increases the ledger by the new letter's approved_coverage_cents;
      voiding resets that letter's approved_coverage_cents to 0 and removes it
      from the ISSUED set, restoring the ledger to its exact pre-issuance value.
    constants: {}
    precision: "integer cents"

  - name: unremitted_premium_ledger
    description: "Agency-level premium not yet remitted to the underwriter — a conserved quantity restored exactly when a settled statement is reopened."
    trigger: "PolicyFile -> ISSUED / LATE_ISSUED, RemittanceStatement RECONCILED -> SETTLED, and RemittanceStatement SETTLED -> DRAFT"
    inputs:
      - "PolicyFile.gross_premium_cents, issuance_status and remittance_status for every policy of the agency"
    algorithm: aggregation
    formula: |
      Agency.unremitted_premium_cents =
        sum(gross_premium_cents over PolicyFile rows with agency_id == this
            agency, issuance_status IN {ISSUED, LATE_ISSUED} and
            remittance_status IN {UNREPORTED, REPORTED, DISPUTED})

      Settlement moves REPORTED policies to REMITTED and so decreases the
      ledger; reopening a settled statement moves them back to REPORTED and
      restores the ledger to its exact pre-settlement value.
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
#
# Ladder: 10 auth -> 20 role -> 30 request shape -> 40 path existence ->
#         45 body-FK existence -> 50 ownership -> 55 transition role ->
#         60 segregation of duties -> 70 optimistic concurrency ->
#         80 state -> 100 business_safety -> 110 business_referential ->
#         120 business_constraint / business_temporal -> 130 business_fiscal
#
# Two designed priority conflicts:
#   P1  state (80) ERR_AGENCY_POSTURE_FROZEN  vs  business_fiscal (130)
#       ERR_CPL_COVERAGE_CAP_EXCEEDED  on POST /closing-protection-letters
#   P2  business_safety (100) ERR_EO_COVERAGE_LAPSED  vs
#       business_referential (110) ERR_NO_ACTIVE_APPOINTMENT_IN_STATE
#       on POST /policy-files/{id}/issuance-state
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "Every required body field of the endpoint is present, of the declared type, non-negative for *_cents and *_days integers, within the declared enum domain for enum fields, and ISO-8601 for date/datetime fields; unknown fields are ignored; source: computed and source: system fields supplied by the client are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 30
    category: existence
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 30
    category: existence
    check: "period_start <= period_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /remittance-statements"

  - priority: 30
    category: existence
    check: "premium_split_agency_pct is a number in [0, 1]; cpl_scope_allowed is a non-empty array of {FULL_SETTLEMENT, LENDER_ONLY, SELLER_PROCEEDS}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /state-programs"

  - priority: 30
    category: existence
    check: "termination_reason is present when decision == TERMINATE"
    error_id: ERR_TERMINATION_REASON_REQUIRED
    http_status: 400
    applies_to: "POST /agencies/{id}/appointment-decision"

  - priority: 40
    category: existence
    check: "The agency_id path segment resolves to an existing Agency"
    error_id: ERR_AGENCY_NOT_FOUND
    http_status: 404
    applies_to: "all /agencies/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The state_program_id path segment resolves to an existing StateProgram"
    error_id: ERR_STATE_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /state-programs/{id}"

  - priority: 40
    category: existence
    check: "The agency_appointment_id path segment resolves to an existing AgencyAppointment"
    error_id: ERR_AGENCY_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /agency-appointments/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The cpl_id path segment resolves to an existing ClosingProtectionLetter"
    error_id: ERR_CPL_NOT_FOUND
    http_status: 404
    applies_to: "all /closing-protection-letters/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The policy_file_id path segment resolves to an existing PolicyFile"
    error_id: ERR_POLICY_FILE_NOT_FOUND
    http_status: 404
    applies_to: "all /policy-files/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The remittance_statement_id path segment resolves to an existing RemittanceStatement"
    error_id: ERR_REMITTANCE_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /remittance-statements/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The escrow_account_id path segment resolves to an existing EscrowAccount"
    error_id: ERR_ESCROW_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all /escrow-accounts/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The escrow_audit_id path segment resolves to an existing EscrowAudit"
    error_id: ERR_ESCROW_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "all /escrow-audits/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The audit_finding_id path segment resolves to an existing AuditFinding"
    error_id: ERR_AUDIT_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "all /audit-findings/{id}/... endpoints"

  - priority: 40
    category: existence
    check: "The agency_claim_id path segment resolves to an existing AgencyClaim"
    error_id: ERR_AGENCY_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all /agency-claims/{id}/... endpoints"

  - priority: 45
    category: existence
    check: "Body foreign keys are resolved left to right in declaration order: agency_id, then state_program_id, then escrow_account_id, then policy_file_id, then cpl_id, then follow_up_of_audit_id, then transferee_agency_id; each must reference an existing row"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_STATE_PROGRAM_NOT_FOUND | ERR_ESCROW_ACCOUNT_NOT_FOUND | ERR_POLICY_FILE_NOT_FOUND | ERR_CPL_NOT_FOUND | ERR_ESCROW_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /agency-appointments, POST /closing-protection-letters, POST /policy-files, POST /remittance-statements, POST /remittance-statements/{id}/lines, POST /escrow-accounts, POST /escrow-audits, POST /agency-claims, POST /agencies/{id}/appointment-decision"

  - priority: 50
    category: auth
    check: "When X-User-Role == AgencyPrincipal, X-User-ID equals the agency_id of the target resource (for RemittanceLine, EscrowAccount snapshots and AuditFinding remediation this is the agency_id of the parent statement / account / audit)"
    error_id: ERR_AGENCY_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /agencies/{id}/financial-review, POST /closing-protection-letters, POST /policy-files, POST /policy-files/{id}/issuance-state, POST /remittance-statements, POST /remittance-statements/{id}/lines, POST /remittance-statements/{id}/state, POST /escrow-accounts, POST /escrow-accounts/{id}/balance-snapshot, POST /audit-findings/{id}/state"

  - priority: 55
    category: auth
    check: "The acting role is permitted for the specific requested transition, not merely for the endpoint: only ComplianceOfficer may TERMINATE an agency; only UnderwritingCounsel may move a REFERRED letter to ISSUED or DECLINED; only UnderwritingCounsel may resolve a PENDING_REFERRAL policy file; only AgencyPrincipal may move a PENDING policy file to ISSUED; only ComplianceOfficer may move a statement out of SUBMITTED, RECONCILED or SETTLED; only AgencyPrincipal may submit a DRAFT statement; only EscrowAuditor may submit an audit; only ComplianceOfficer may review or close an audit; only AgencyPrincipal may submit finding remediation; only EscrowAuditor or ComplianceOfficer may clear or escalate a finding; only UnderwritingCounsel may adjudicate a claim out of INVESTIGATING; only ComplianceOfficer may resolve a RECOURSE_DEMANDED claim"
    error_id: ERR_TRANSITION_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /agencies/{id}/appointment-decision, POST /closing-protection-letters/{id}/state, POST /policy-files/{id}/issuance-state, POST /remittance-statements/{id}/state, POST /escrow-audits/{id}/state, POST /audit-findings/{id}/state, POST /agency-claims/{id}/state"

  - priority: 60
    category: auth
    check: "SoD-1 — the X-User-ID closing an escrow audit differs from EscrowAudit.conducted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /escrow-audits/{id}/state with to_state IN {CLOSED_CLEAN, CLOSED_ADVERSE}"

  - priority: 60
    category: auth
    check: "SoD-2 — the X-User-ID adjudicating a claim out of INVESTIGATING differs from the linked PolicyFile.referral_decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /agency-claims/{id}/state with to_state IN {RECOURSE_DEMANDED, ABSORBED}"

  - priority: 70
    category: state
    check: "expected_agency_version equals the current Agency.version (see §1.2.1)"
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412
    applies_to: "POST /closing-protection-letters, POST /policy-files, POST /remittance-statements"

  - priority: 80
    category: state
    check: "The requested transition exists in the §1.2 transition table for the resource's current state on the addressed dimension"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 80
    category: state
    check: "The resource is not already in a terminal state of the addressed dimension"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 80
    category: state
    check: "Agency.oversight_posture != FROZEN"
    error_id: ERR_AGENCY_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /closing-protection-letters, POST /closing-protection-letters/{id}/state with to_state=ISSUED, POST /policy-files/{id}/issuance-state with to_state=ISSUED"
    description: "P1 conflict partner: this state check outranks the fiscal coverage-cap check at priority 130 on POST /closing-protection-letters."

  - priority: 80
    category: state
    check: "The linked EscrowAccount.status != CLOSED"
    error_id: ERR_ESCROW_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "POST /escrow-accounts/{id}/balance-snapshot, POST /escrow-audits, POST /escrow-audits/{id}/state with to_state=SUBMITTED"

  - priority: 80
    category: state
    check: "The linked EscrowAccount.snapshot_as_of is not null (a balance snapshot has been recorded)"
    error_id: ERR_BALANCE_SNAPSHOT_REQUIRED
    http_status: 409
    applies_to: "POST /escrow-audits/{id}/state with to_state=SUBMITTED"

  - priority: 80
    category: state
    check: "The statement has at least one RemittanceLine"
    error_id: ERR_STATEMENT_HAS_NO_LINES
    http_status: 409
    applies_to: "POST /remittance-statements/{id}/state with to_state=SUBMITTED"

  - priority: 80
    category: state
    check: "At least one AuditFinding of the audit has status IN {OPEN, REMEDIATION_SUBMITTED}"
    error_id: ERR_NO_OPEN_FINDING
    http_status: 409
    applies_to: "POST /escrow-audits/{id}/state with to_state=REMEDIATION_REQUIRED"

  - priority: 80
    category: state
    check: "Every AuditFinding of the audit has status == CLEARED"
    error_id: ERR_UNREMEDIATED_FINDING_PRESENT
    http_status: 409
    applies_to: "POST /escrow-audits/{id}/state with to_state=CLOSED_CLEAN"

  - priority: 80
    category: state
    check: "At least one AuditFinding of the audit has status == ESCALATED"
    error_id: ERR_NO_ESCALATED_FINDING
    http_status: 409
    applies_to: "POST /escrow-audits/{id}/state with to_state=CLOSED_ADVERSE"

  - priority: 80
    category: state
    check: "No PolicyFile with cpl_id == this letter has issuance_status IN {ISSUED, LATE_ISSUED}"
    error_id: ERR_CPL_HAS_ISSUED_POLICY
    http_status: 409
    applies_to: "POST /closing-protection-letters/{id}/state with to_state=VOIDED"

  - priority: 80
    category: state
    check: "Agency.escrow_standing != DEFALCATION_RISK and Agency.open_critical_finding_count == 0"
    error_id: ERR_REINSTATEMENT_BLOCKED_BY_ESCROW_STANDING
    http_status: 409
    applies_to: "POST /agencies/{id}/appointment-decision with decision=REINSTATE"

  - priority: 80
    category: state
    check: "The parent EscrowAudit.status IN {SUBMITTED, UNDER_REVIEW, REMEDIATION_REQUIRED} (a closed audit's findings are frozen)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /escrow-audits/{id}/findings, POST /audit-findings/{id}/state"

  - priority: 100
    category: business_safety
    check: "Agency.eo_expires_on is not null and Agency.eo_expires_on >= date(current_utc)"
    error_id: ERR_EO_COVERAGE_LAPSED
    http_status: 422
    applies_to: "POST /closing-protection-letters, POST /closing-protection-letters/{id}/state with to_state=ISSUED, POST /policy-files/{id}/issuance-state with to_state=ISSUED, POST /agency-claims/{id}/state with to_state IN {RECOURSE_DEMANDED, ABSORBED}"
    description: "P2 conflict partner: this safety check outranks the referential active-appointment check at priority 110 on POST /policy-files/{id}/issuance-state."

  - priority: 100
    category: business_safety
    check: "submitted_eo_policy_limit_cents >= MIN_EO_LIMIT_CENTS (25000000)"
    error_id: ERR_EO_LIMIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /agencies/{id}/financial-review-decision with decision=ACCEPT"

  - priority: 100
    category: business_safety
    check: "submitted_net_worth_cents >= MIN_NET_WORTH_CENTS (5000000)"
    error_id: ERR_NET_WORTH_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /agencies/{id}/financial-review-decision with decision=ACCEPT"

  - priority: 100
    category: business_safety
    check: "Agency.financial_review_status == ACCEPTED"
    error_id: ERR_FINANCIAL_REVIEW_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /agency-appointments/{id}/license-verification with decision=VERIFY, POST /agencies/{id}/appointment-decision with decision=APPOINT"

  - priority: 100
    category: business_safety
    check: "verified_expires_on > date(current_utc)"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /agency-appointments/{id}/license-verification with decision=VERIFY"

  - priority: 110
    category: business_referential
    check: "An AgencyAppointment exists for (agency_id, state_program_id) with status == ACTIVE"
    error_id: ERR_NO_ACTIVE_APPOINTMENT_IN_STATE
    http_status: 422
    applies_to: "POST /closing-protection-letters, POST /closing-protection-letters/{id}/state with to_state=ISSUED, POST /policy-files, POST /policy-files/{id}/issuance-state with to_state=ISSUED, POST /agencies/{id}/appointment-decision with decision=APPOINT"

  - priority: 110
    category: business_referential
    check: "StateProgram.cpl_permitted == true"
    error_id: ERR_CPL_NOT_PERMITTED_IN_STATE
    http_status: 422
    applies_to: "POST /closing-protection-letters, POST /closing-protection-letters/{id}/state with to_state=ISSUED"

  - priority: 110
    category: business_referential
    check: "coverage_scope is a member of StateProgram.cpl_scope_allowed"
    error_id: ERR_CPL_SCOPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /closing-protection-letters"

  - priority: 110
    category: business_referential
    check: "When PolicyFile.cpl_id is not null, that ClosingProtectionLetter.status == ISSUED"
    error_id: ERR_CPL_NOT_ISSUED
    http_status: 422
    applies_to: "POST /policy-files/{id}/issuance-state with to_state=ISSUED"

  - priority: 110
    category: business_referential
    check: "The line's PolicyFile.agency_id equals the statement's agency_id and its issuance_status IN {ISSUED, LATE_ISSUED}"
    error_id: ERR_LINE_POLICY_NOT_ISSUED
    http_status: 422
    applies_to: "POST /remittance-statements/{id}/lines"

  - priority: 110
    category: business_referential
    check: "The line's PolicyFile.closing_date is inside [statement.period_start, statement.period_end] inclusive"
    error_id: ERR_POLICY_NOT_IN_PERIOD
    http_status: 422
    applies_to: "POST /remittance-statements/{id}/lines"

  - priority: 110
    category: business_referential
    check: "The claim's PolicyFile.agency_id equals the claim's agency_id, its issuance_status IN {ISSUED, LATE_ISSUED}, and when cpl_id is supplied it equals that PolicyFile.cpl_id"
    error_id: ERR_CLAIM_POLICY_MISMATCH
    http_status: 422
    applies_to: "POST /agency-claims"

  - priority: 110
    category: business_referential
    check: "The transferee Agency exists, has appointment_status == APPOINTED, oversight_posture != FROZEN, and is not the terminated agency itself"
    error_id: ERR_TRANSFEREE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /agencies/{id}/appointment-decision with decision=TERMINATE, POST /policy-files/{id}/transfer-state with to_state=TRANSFERRED"

  - priority: 120
    category: business_constraint
    check: "tax_id is unique across Agency rows"
    error_id: ERR_DUPLICATE_TAX_ID
    http_status: 409
    applies_to: "POST /agencies"

  - priority: 120
    category: business_constraint
    check: "state_code is unique across StateProgram rows"
    error_id: ERR_DUPLICATE_STATE_CODE
    http_status: 409
    applies_to: "POST /state-programs"

  - priority: 120
    category: business_constraint
    check: "No AgencyAppointment with the same (agency_id, state_program_id) and status IN {PENDING_LICENSE_VERIFICATION, ACTIVE, LAPSED} already exists"
    error_id: ERR_DUPLICATE_APPOINTMENT
    http_status: 409
    applies_to: "POST /agency-appointments"

  - priority: 120
    category: business_constraint
    check: "account_ref is unique among the agency's EscrowAccount rows with status != CLOSED"
    error_id: ERR_DUPLICATE_ESCROW_ACCOUNT_REF
    http_status: 409
    applies_to: "POST /escrow-accounts"

  - priority: 120
    category: business_constraint
    check: "policy_number is unique among the agency's PolicyFile rows with issuance_status IN {ISSUED, LATE_ISSUED}"
    error_id: ERR_DUPLICATE_POLICY_NUMBER
    http_status: 409
    applies_to: "POST /policy-files/{id}/issuance-state with to_state=ISSUED"

  - priority: 120
    category: business_constraint
    check: "No existing RemittanceLine of this statement already references the same policy_file_id"
    error_id: ERR_POLICY_ALREADY_ON_STATEMENT
    http_status: 409
    applies_to: "POST /remittance-statements/{id}/lines"

  - priority: 120
    category: business_temporal
    check: "The new [period_start, period_end] closed interval does not overlap the interval of any existing RemittanceStatement of the same agency, in any status. Overlap means new.period_start <= existing.period_end AND existing.period_start <= new.period_end; a period starting exactly one day after an existing period_end is accepted"
    error_id: ERR_REMITTANCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /remittance-statements"

  - priority: 120
    category: business_temporal
    check: "For a SCHEDULED audit, abs(as_of_date - as_of_date of every existing SCHEDULED EscrowAudit of the same escrow_account_id) >= AUDIT_SPACING_DAYS (90); a gap of exactly 90 days is accepted"
    error_id: ERR_AUDIT_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /escrow-audits"

  - priority: 120
    category: business_temporal
    check: "For a SURPRISE audit, no other EscrowAudit of the same escrow_account_id with audit_type == SURPRISE is in a non-terminal status (DRAFT, SUBMITTED, UNDER_REVIEW or REMEDIATION_REQUIRED)"
    error_id: ERR_SURPRISE_AUDIT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /escrow-audits"

  - priority: 130
    category: business_fiscal
    check: "requested_coverage_cents <= StateProgram.cpl_coverage_cap_cents"
    error_id: ERR_CPL_COVERAGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /closing-protection-letters"
    description: "P1 conflict partner: outranked by ERR_AGENCY_POSTURE_FROZEN at priority 80."

  - priority: 130
    category: business_fiscal
    check: "approved_liability_cents <= Agency.underwriting_authority_limit_cents OR PolicyFile.referral_decided_by_user_id is not null (counsel referral lifts the authority limit)"
    error_id: ERR_UNDERWRITING_AUTHORITY_EXCEEDED
    http_status: 422
    applies_to: "POST /policy-files/{id}/issuance-state with to_state=ISSUED"

  - priority: 130
    category: business_fiscal
    check: "approved_liability_cents <= PolicyFile.liability_amount_cents"
    error_id: ERR_APPROVED_LIABILITY_ABOVE_REQUEST
    http_status: 422
    applies_to: "POST /policy-files/{id}/issuance-state with to_state=REFERRAL_APPROVED"

  - priority: 130
    category: business_fiscal
    check: "settled_amount_cents == RemittanceStatement.underwriter_share_cents + RemittanceStatement.late_fee_cents"
    error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /remittance-statements/{id}/state with to_state=SETTLED"

  - priority: 130
    category: business_fiscal
    check: "recovered_amount_cents <= AgencyClaim.recourse_amount_cents"
    error_id: ERR_RECOVERY_EXCEEDS_RECOURSE
    http_status: 422
    applies_to: "POST /agency-claims/{id}/state with to_state=RECOVERED"

# =============================================================================
# §1.5 API Endpoint Table
#
# Paths are root-relative (api_prefix is empty). Reads are open to all five
# roles and are never ownership-scoped; every ownership rule in §1.4 applies to
# writes only.
# =============================================================================
endpoints:
  # ---- Agency -------------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: "Register a title agency for appointment review."
    roles: [ComplianceOfficer, LicensingAnalyst]
    code: 201
    input: [legal_name, tax_id, underwriting_authority_limit_cents]
    output: Agency
    side_effects:
      - "appointment_status = PENDING_REVIEW, financial_review_status = NOT_SUBMITTED"
      - "escrow_standing = COMPLIANT, defalcation_score = 0, oversight_posture = RESTRICTED per calculations.agency_oversight_posture"
      - "All counters and ledgers (open_critical_finding_count, unreported_policy_count, cpl_outstanding_exposure_cents, unremitted_premium_cents, pending_transfer_count) start at 0"
  - method: GET
    path: "/agencies/{id}"
    description: "Read one agency, including its posture, standing, score and ledgers."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/agencies"
    description: "List agencies. transferee_agency_id reverses the Agency self-FK: it returns the agencies designated to receive a terminated agency's files."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["appointment_status?", "financial_review_status?", "oversight_posture?", "escrow_standing?", "transferee_agency_id?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []
  - method: POST
    path: "/agencies/{id}/financial-review"
    description: "Agency submits its E&O coverage, net worth and fidelity bond figures for review. The values land on the submitted_* staging fields only."
    roles: [AgencyPrincipal]
    code: 200
    input: [submitted_eo_policy_limit_cents, submitted_eo_expires_on, submitted_net_worth_cents, submitted_fidelity_bond_cents]
    output: Agency
    side_effects:
      - "financial_review_status -> SUBMITTED (from NOT_SUBMITTED, DEFICIENT or ACCEPTED)"
      - "Effective eo_policy_limit_cents / eo_expires_on / net_worth_cents / fidelity_bond_cents untouched"
      - "oversight_posture recomputed; Agency.version incremented by 1"
  - method: POST
    path: "/agencies/{id}/financial-review-decision"
    description: "Licensing accepts or rejects the submitted financial review. Acceptance mirrors the submitted_* values onto the effective fields."
    roles: [LicensingAnalyst]
    code: 200
    input: [decision, "note?"]
    output: Agency
    side_effects:
      - "financial_review_status -> ACCEPTED or DEFICIENT"
      - "On ACCEPT: effective eo_policy_limit_cents, eo_expires_on, net_worth_cents, fidelity_bond_cents mirrored from submitted_*"
      - "oversight_posture recomputed; Agency.version incremented by 1"
  - method: POST
    path: "/agencies/{id}/appointment-decision"
    description: "Appoint, suspend, reinstate or terminate an agency. TERMINATE drives CASCADE-B and is restricted to ComplianceOfficer."
    roles: [LicensingAnalyst, ComplianceOfficer]
    code: 200
    input: [decision, "reason?", "termination_reason?", "transferee_agency_id?"]
    output: Agency
    side_effects:
      - "appointment_status transitions per §1.2; oversight_posture recomputed"
      - "On SUSPEND / TERMINATE: EscrowAccount rows move to RESTRICTED / CLOSED"
      - "On TERMINATE: CASCADE-B hops 3-5 (appointments WITHDRAWN, letters DECLINED, pending policy files VOIDED) plus in-force policy files to PENDING_TRANSFER and pending_transfer_count recomputed"
      - "On REINSTATE: RESTRICTED escrow accounts move back to OPEN"
      - "Agency.version incremented by 1"

  # ---- StateProgram -------------------------------------------------------
  - method: POST
    path: "/state-programs"
    description: "Define a state's closing protection rules, premium split, issuance deadline, reconciliation tolerance and counsel referral threshold."
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, cpl_permitted, cpl_coverage_cap_cents, cpl_scope_allowed, premium_split_agency_pct, policy_issuance_deadline_days, three_way_tolerance_cents, counsel_referral_threshold_cents]
    output: StateProgram
    side_effects: []
  - method: GET
    path: "/state-programs/{id}"
    description: "Read one state program."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  # ---- AgencyAppointment --------------------------------------------------
  - method: POST
    path: "/agency-appointments"
    description: "Create a state appointment for an agency, pending license verification."
    roles: [LicensingAnalyst]
    code: 201
    input: [agency_id, state_program_id, license_number, license_expires_on]
    output: AgencyAppointment
    side_effects:
      - "status = PENDING_LICENSE_VERIFICATION"
  - method: GET
    path: "/agency-appointments/{id}"
    description: "Read one agency appointment."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: AgencyAppointment
    side_effects: []
  - method: GET
    path: "/agency-appointments"
    description: "List appointments; reverses AgencyAppointment.agency_id and AgencyAppointment.state_program_id."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "state_program_id?", "status?", "limit?", "offset?"]
    output: AgencyAppointment[]
    side_effects: []
  - method: POST
    path: "/agency-appointments/{id}/license-verification"
    description: "Verify or lapse the appointment's license. VERIFY requires an unexpired license and an ACCEPTED financial review."
    roles: [LicensingAnalyst]
    code: 200
    input: [decision, "verified_license_number?", "verified_expires_on?"]
    output: AgencyAppointment
    side_effects:
      - "status -> ACTIVE (VERIFY) or LAPSED (LAPSE)"
      - "On VERIFY: verified_license_number, verified_expires_on and appointed_on persisted"

  # ---- ClosingProtectionLetter -------------------------------------------
  - method: POST
    path: "/closing-protection-letters"
    description: "Request a closing protection letter. Carries expected_agency_version (OCC rule cpl-request-stale-agency). The landing state is chosen by calculations.cpl_referral_routing."
    roles: [AgencyPrincipal]
    code: 201
    input: [agency_id, state_program_id, transaction_ref, coverage_scope, requested_coverage_cents, closing_date, lender_name, "complex_title_flag?", expected_agency_version]
    output: ClosingProtectionLetter
    side_effects:
      - "status = REQUESTED or REFERRED with referral_reason per calculations.cpl_referral_routing; approved_coverage_cents = 0"
      - "The request is recorded against the agency's oversight file: Agency.version incremented by 1"
  - method: GET
    path: "/closing-protection-letters/{id}"
    description: "Read one closing protection letter."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: ClosingProtectionLetter
    side_effects: []
  - method: GET
    path: "/closing-protection-letters"
    description: "List letters; reverses ClosingProtectionLetter.agency_id and .state_program_id, and is the discovery channel for letters DECLINED by CASCADE-A / CASCADE-B."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "state_program_id?", "status?", "complex_title_flag?", "limit?", "offset?"]
    output: ClosingProtectionLetter[]
    side_effects: []
  - method: POST
    path: "/closing-protection-letters/{id}/state"
    description: "Issue, decline or void a letter. A REFERRED letter may only be released or declined by UnderwritingCounsel."
    roles: [ComplianceOfficer, UnderwritingCounsel]
    code: 200
    input: [to_state, "rationale?", "void_reason?"]
    output: ClosingProtectionLetter
    side_effects:
      - "On ISSUED: approved_coverage_cents per calculations.cpl_approved_coverage; issued_at and decided_by_user_id set; Agency.cpl_outstanding_exposure_cents recomputed per calculations.cpl_exposure_ledger"
      - "On VOIDED: approved_coverage_cents reset to 0 and the exposure ledger restored to its pre-issuance value"
      - "Agency.version incremented by 1"

  # ---- PolicyFile ---------------------------------------------------------
  - method: POST
    path: "/policy-files"
    description: "Open a policy file for a closing. Carries expected_agency_version (OCC rule policy-file-create-stale-agency). Referral routing is stamped at creation."
    roles: [AgencyPrincipal]
    code: 201
    input: [agency_id, state_program_id, "cpl_id?", order_number, closing_date, liability_amount_cents, gross_premium_cents, "complex_title_flag?", expected_agency_version]
    output: PolicyFile
    side_effects:
      - "issuance_status and approved_liability_cents per calculations.policy_referral_routing; remittance_status = UNREPORTED; transfer_status = NOT_REQUIRED"
      - "Agency.version incremented by 1"
  - method: GET
    path: "/policy-files/{id}"
    description: "Read one policy file, including all three status dimensions."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: PolicyFile
    side_effects: []
  - method: GET
    path: "/policy-files"
    description: "List policy files; reverses PolicyFile.agency_id, .state_program_id, .cpl_id and .transferee_agency_id, and is the discovery channel for files VOIDED or moved to PENDING_TRANSFER by CASCADE-B."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "state_program_id?", "cpl_id?", "transferee_agency_id?", "issuance_status?", "remittance_status?", "transfer_status?", "closing_date_from?", "closing_date_to?", "limit?", "offset?"]
    output: PolicyFile[]
    side_effects: []
  - method: POST
    path: "/policy-files/{id}/issuance-state"
    description: "Resolve a counsel referral (REFERRAL_APPROVED / ISSUANCE_DECLINED) or issue the policy (ISSUED). Timeliness decides whether issuance lands on ISSUED or LATE_ISSUED."
    roles: [UnderwritingCounsel, AgencyPrincipal]
    code: 200
    input: [to_state, "approved_liability_cents?", "policy_number?", "rationale?"]
    output: PolicyFile
    side_effects:
      - "On REFERRAL_APPROVED: approved_liability_cents persisted and referral_decided_by_user_id = X-User-ID (SoD-2 anchor)"
      - "On ISSUED: policy_number, issued_at and issuance_elapsed_days persisted; issuance_status resolved by calculations.policy_issuance_timeliness; Agency.unremitted_premium_cents recomputed per calculations.unremitted_premium_ledger; Agency.version incremented by 1"
  - method: POST
    path: "/policy-files/{id}/transfer-state"
    description: "Complete or except the transfer of an in-force file away from a terminated agency."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_state, "note?"]
    output: PolicyFile
    side_effects:
      - "transfer_status -> TRANSFERRED or TRANSFER_EXCEPTION; Agency.pending_transfer_count recomputed on TRANSFERRED"

  # ---- RemittanceStatement / RemittanceLine ------------------------------
  - method: POST
    path: "/remittance-statements"
    description: "Open a remittance statement for a closed period. Carries expected_agency_version (OCC rule remittance-statement-create-stale-agency). Periods may not overlap."
    roles: [AgencyPrincipal]
    code: 201
    input: [agency_id, period_start, period_end, expected_agency_version]
    output: RemittanceStatement
    side_effects:
      - "status = DRAFT; all money fields and counters 0; reopen_count = 0"
      - "Agency.last_remittance_period_end set to period_end when it is later than the current value; Agency.version incremented by 1"
  - method: GET
    path: "/remittance-statements/{id}"
    description: "Read one remittance statement, including reconciliation outputs."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: RemittanceStatement
    side_effects: []
  - method: GET
    path: "/remittance-statements"
    description: "List remittance statements; reverses RemittanceStatement.agency_id."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: RemittanceStatement[]
    side_effects: []
  - method: POST
    path: "/remittance-statements/{id}/lines"
    description: "Report one issued policy's premium on the statement. The split is computed per line at creation."
    roles: [AgencyPrincipal]
    code: 201
    input: [policy_file_id, reported_gross_premium_cents]
    output: RemittanceLine
    side_effects:
      - "agency_retention_cents and underwriter_share_cents computed per calculations.remittance_premium_split; premium_mismatch evaluated against the policy's gross_premium_cents"
      - "Statement totals recomputed as sums of the already-rounded line values"
  - method: GET
    path: "/remittance-statements/{id}/lines"
    description: "List the lines of a statement; reverses RemittanceLine.remittance_statement_id."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["premium_mismatch?", "limit?", "offset?"]
    output: RemittanceLine[]
    side_effects: []
  - method: GET
    path: "/policy-files/{id}/remittance-lines"
    description: "List every statement line that reported this policy; reverses RemittanceLine.policy_file_id."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RemittanceLine[]
    side_effects: []
  - method: POST
    path: "/remittance-statements/{id}/state"
    description: "Submit, reconcile, settle or reopen a statement. Settlement drives CASCADE-C; reopening is its compensating action."
    roles: [AgencyPrincipal, ComplianceOfficer]
    code: 200
    input: [to_state, "settled_amount_cents?", "reopen_reason?"]
    output: RemittanceStatement
    side_effects:
      - "On SUBMITTED: submitted_at set; statement split totals refreshed"
      - "On RECONCILED: calculations.remittance_reconciliation outputs persisted; lines' policies move to REPORTED or DISPUTED; Agency.unreported_policy_count mirrored and oversight_posture recomputed"
      - "On SETTLED: CASCADE-C hops 1-5 (policies REMITTED, unremitted ledger recomputed, posture recomputed, RESTRICTED escrow accounts reopened)"
      - "On DRAFT: reopen_count incremented, policies rolled back, ledgers and counters restored, posture recomputed"
      - "Agency.version incremented by 1 on RECONCILED, SETTLED and DRAFT"

  # ---- EscrowAccount ------------------------------------------------------
  - method: POST
    path: "/escrow-accounts"
    description: "Register an escrow trust account for the agency."
    roles: [AgencyPrincipal]
    code: 201
    input: [agency_id, bank_name, account_ref]
    output: EscrowAccount
    side_effects:
      - "status = OPEN; all balances 0; snapshot_as_of = null"
  - method: GET
    path: "/escrow-accounts/{id}"
    description: "Read one escrow account, including the latest snapshot balances."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []
  - method: GET
    path: "/escrow-accounts"
    description: "List escrow accounts; reverses EscrowAccount.agency_id and is the discovery channel for accounts RESTRICTED or CLOSED by cascades."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: EscrowAccount[]
    side_effects: []
  - method: POST
    path: "/escrow-accounts/{id}/balance-snapshot"
    description: "Record the account's book, bank, outstanding-item, trial and unidentified-funds balances as of a date. Required before an audit can be submitted."
    roles: [AgencyPrincipal]
    code: 200
    input: [book_balance_cents, bank_balance_cents, outstanding_items_cents, trial_balance_cents, unidentified_funds_cents, aged_unidentified_over_90_cents, snapshot_as_of]
    output: EscrowAccount
    side_effects:
      - "adjusted_bank_balance_cents = bank_balance_cents - outstanding_items_cents"
      - "snapshot_as_of persisted; a later snapshot overwrites the previous one"

  # ---- EscrowAudit / AuditFinding ----------------------------------------
  - method: POST
    path: "/escrow-audits"
    description: "Open a scheduled or surprise escrow audit. conducted_by_user_id is taken from X-User-ID and anchors SoD-1. An actor-initiated creation recomputes Agency.defalcation_score under variant lifetime_uncleared."
    roles: [EscrowAuditor, ComplianceOfficer]
    code: 201
    input: [agency_id, escrow_account_id, audit_type, as_of_date, "follow_up_of_audit_id?"]
    output: EscrowAudit
    side_effects:
      - "status = DRAFT; conducted_by_user_id = X-User-ID; risk_tier = LOW; finding counters 0"
      - "Agency.defalcation_score recomputed under variant lifetime_uncleared, then escrow_standing and oversight_posture recomputed; Agency.version incremented by 1"
  - method: GET
    path: "/escrow-audits/{id}"
    description: "Read one escrow audit, including variance method, variance, risk tier and finding counters."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: EscrowAudit
    side_effects: []
  - method: GET
    path: "/escrow-audits"
    description: "List escrow audits; reverses EscrowAudit.agency_id, .escrow_account_id and the self-FK .follow_up_of_audit_id, and is the discovery channel for the successor SURPRISE audit created by CASCADE-A hop 5."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "escrow_account_id?", "follow_up_of_audit_id?", "audit_type?", "status?", "limit?", "offset?"]
    output: EscrowAudit[]
    side_effects: []
  - method: POST
    path: "/escrow-audits/{id}/findings"
    description: "Raise a finding on an open audit. Severity is derived from the code, the exposure and whether the same code was raised on an earlier audit of the same account."
    roles: [EscrowAuditor]
    code: 201
    input: [code, exposure_cents, narrative]
    output: AuditFinding
    side_effects:
      - "base_severity, is_repeat and severity per calculations.audit_finding_severity; status = OPEN"
      - "Parent audit's open_finding_count, critical_finding_count and risk_tier recomputed per calculations.escrow_audit_risk_tier"
      - "Agency.open_critical_finding_count recomputed, then oversight_posture recomputed"
  - method: GET
    path: "/escrow-audits/{id}/findings"
    description: "List the findings of an audit; reverses AuditFinding.escrow_audit_id and is the only discovery channel for auto-raised findings."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["code?", "severity?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/escrow-audits/{id}/state"
    description: "Submit, review, require remediation on, or close an audit. CLOSED_ADVERSE drives CASCADE-A. Closing requires an X-User-ID different from conducted_by_user_id."
    roles: [EscrowAuditor, ComplianceOfficer]
    code: 200
    input: [to_state, "note?"]
    output: EscrowAudit
    side_effects:
      - "On SUBMITTED: variance_method and reconciliation_variance_cents per calculations.escrow_three_way_variance; auto-findings raised for variance over tolerance and aged unidentified funds"
      - "On CLOSED_CLEAN / CLOSED_ADVERSE: closed_by_user_id and closed_at set; Agency.defalcation_score recomputed under variant rolling_window_365; escrow_standing and oversight_posture recomputed; Agency.version incremented by 1"
      - "On CLOSED_ADVERSE: CASCADE-A hops 2-5 (standing DEFALCATION_RISK, posture FROZEN, accounts RESTRICTED and letters DECLINED, successor SURPRISE audit auto-created)"
  - method: GET
    path: "/audit-findings/{id}"
    description: "Read one audit finding."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: POST
    path: "/audit-findings/{id}/state"
    description: "Submit remediation for a finding (agency), or clear or escalate it (auditor / compliance)."
    roles: [AgencyPrincipal, EscrowAuditor, ComplianceOfficer]
    code: 200
    input: [to_state, "remediation_note?", "cleared_amount_cents?", "disposition_note?"]
    output: AuditFinding
    side_effects:
      - "Parent audit's open_finding_count, critical_finding_count and risk_tier recomputed"
      - "Agency.open_critical_finding_count recomputed, then oversight_posture recomputed; escrow accounts move to RESTRICTED only when the posture lands on FROZEN"

  # ---- AgencyClaim --------------------------------------------------------
  - method: POST
    path: "/agency-claims"
    description: "Record a claim arising from agency conduct against an issued policy file."
    roles: [ComplianceOfficer, UnderwritingCounsel]
    code: 201
    input: [agency_id, policy_file_id, "cpl_id?", cause_code, loss_amount_cents, notice_date]
    output: AgencyClaim
    side_effects:
      - "status = INVESTIGATING; recourse_tier = null; all money outputs 0"
  - method: GET
    path: "/agency-claims/{id}"
    description: "Read one claim, including tier, indemnity offset, recourse and net exposure."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: AgencyClaim
    side_effects: []
  - method: GET
    path: "/agency-claims"
    description: "List claims; reverses AgencyClaim.agency_id, .policy_file_id and .cpl_id."
    roles: [AgencyPrincipal, LicensingAnalyst, EscrowAuditor, UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "policy_file_id?", "cpl_id?", "status?", "cause_code?", "limit?", "offset?"]
    output: AgencyClaim[]
    side_effects: []
  - method: POST
    path: "/agency-claims/{id}/state"
    description: "Adjudicate a claim: demand recourse, absorb it, or resolve a demand as recovered or written off. Adjudication out of INVESTIGATING enforces SoD-2."
    roles: [UnderwritingCounsel, ComplianceOfficer]
    code: 200
    input: [to_state, "recovered_amount_cents?", "note?"]
    output: AgencyClaim
    side_effects:
      - "On RECOURSE_DEMANDED: recourse_tier, indemnity_offset_cents, recourse_amount_cents and net_underwriter_exposure_cents per calculations.claim_recourse_and_indemnity; an ESCROW_DEFALCATION cause drives escrow_standing to DEFALCATION_RISK, posture to FROZEN, accounts to RESTRICTED and open letters to DECLINED; Agency.version incremented by 1"
      - "On ABSORBED: indemnity and recourse 0, net exposure = loss_amount_cents, no standing or posture change"
      - "On RECOVERED / WRITTEN_OFF: net_underwriter_exposure_cents recomputed"

  # ---- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every date and deadline rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed server startup default); it never falls back to real wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "All subsequent date(current_utc) evaluations (E&O expiry, license expiry, issuance elapsed days, remittance grace period, rolling 365-day score window) use the new value"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth / authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the target endpoint's roles" }
  - { id: ERR_AGENCY_OWNERSHIP_REQUIRED, http: 403, condition: "An AgencyPrincipal acts on a resource whose agency_id differs from X-User-ID" }
  - { id: ERR_TRANSITION_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is permitted for the endpoint but not for the specific requested transition (for example a ComplianceOfficer releasing a REFERRED letter, or a LicensingAnalyst terminating an agency)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID equals EscrowAudit.conducted_by_user_id when closing that audit, or equals PolicyFile.referral_decided_by_user_id when adjudicating a claim on that file" }
  # -- request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is missing, a field has the wrong type, an enum value is outside its domain, a *_cents or *_days value is negative, premium_split_agency_pct is outside [0,1], period_start > period_end, or a required conditional field (approved_liability_cents, policy_number, settled_amount_cents, reopen_reason, remediation_note) is absent for the requested transition" }
  - { id: ERR_TERMINATION_REASON_REQUIRED, http: 400, condition: "decision == TERMINATE without termination_reason" }
  # -- existence
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "agency_id (path or body, including transferee_agency_id) does not resolve to an Agency" }
  - { id: ERR_STATE_PROGRAM_NOT_FOUND, http: 404, condition: "state_program_id does not resolve to a StateProgram" }
  - { id: ERR_AGENCY_APPOINTMENT_NOT_FOUND, http: 404, condition: "agency_appointment_id does not resolve to an AgencyAppointment" }
  - { id: ERR_CPL_NOT_FOUND, http: 404, condition: "cpl_id does not resolve to a ClosingProtectionLetter" }
  - { id: ERR_POLICY_FILE_NOT_FOUND, http: 404, condition: "policy_file_id does not resolve to a PolicyFile" }
  - { id: ERR_REMITTANCE_STATEMENT_NOT_FOUND, http: 404, condition: "remittance_statement_id does not resolve to a RemittanceStatement" }
  - { id: ERR_ESCROW_ACCOUNT_NOT_FOUND, http: 404, condition: "escrow_account_id does not resolve to an EscrowAccount" }
  - { id: ERR_ESCROW_AUDIT_NOT_FOUND, http: 404, condition: "escrow_audit_id or follow_up_of_audit_id does not resolve to an EscrowAudit" }
  - { id: ERR_AUDIT_FINDING_NOT_FOUND, http: 404, condition: "audit_finding_id does not resolve to an AuditFinding" }
  - { id: ERR_AGENCY_CLAIM_NOT_FOUND, http: 404, condition: "agency_claim_id does not resolve to an AgencyClaim" }
  # -- concurrency
  - { id: ERR_STALE_AGENCY_VERSION, http: 412, condition: "expected_agency_version differs from the current Agency.version on any of the three OCC-guarded creates (§1.2.1)" }
  # -- state
  - { id: ERR_INVALID_STATE, http: 409, condition: "The requested transition does not exist from the resource's current state on the addressed dimension, or a finding is written against an audit that is already closed" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "The addressed dimension is already in one of its terminal states" }
  - { id: ERR_AGENCY_POSTURE_FROZEN, http: 409, condition: "New coverage is requested or issued while Agency.oversight_posture == FROZEN" }
  - { id: ERR_ESCROW_ACCOUNT_CLOSED, http: 409, condition: "A snapshot or audit is attempted against an EscrowAccount with status == CLOSED" }
  - { id: ERR_BALANCE_SNAPSHOT_REQUIRED, http: 409, condition: "An audit is submitted while the linked EscrowAccount has snapshot_as_of == null" }
  - { id: ERR_STATEMENT_HAS_NO_LINES, http: 409, condition: "A statement with no RemittanceLine rows is submitted" }
  - { id: ERR_NO_OPEN_FINDING, http: 409, condition: "REMEDIATION_REQUIRED is requested on an audit with no finding in OPEN or REMEDIATION_SUBMITTED" }
  - { id: ERR_UNREMEDIATED_FINDING_PRESENT, http: 409, condition: "CLOSED_CLEAN is requested while at least one finding is not CLEARED" }
  - { id: ERR_NO_ESCALATED_FINDING, http: 409, condition: "CLOSED_ADVERSE is requested while no finding is ESCALATED" }
  - { id: ERR_CPL_HAS_ISSUED_POLICY, http: 409, condition: "VOIDED is requested on a letter that already backs an ISSUED or LATE_ISSUED policy file" }
  - { id: ERR_REINSTATEMENT_BLOCKED_BY_ESCROW_STANDING, http: 409, condition: "REINSTATE is requested while escrow_standing == DEFALCATION_RISK or open_critical_finding_count >= 1" }
  # -- business safety / compliance
  - { id: ERR_EO_COVERAGE_LAPSED, http: 422, condition: "The agency's effective E&O coverage is absent or expired as of date(current_utc) when coverage is requested, issued, or a claim is adjudicated" }
  - { id: ERR_EO_LIMIT_BELOW_MINIMUM, http: 422, condition: "A financial review is accepted with submitted_eo_policy_limit_cents below MIN_EO_LIMIT_CENTS (25000000)" }
  - { id: ERR_NET_WORTH_BELOW_MINIMUM, http: 422, condition: "A financial review is accepted with submitted_net_worth_cents below MIN_NET_WORTH_CENTS (5000000)" }
  - { id: ERR_FINANCIAL_REVIEW_NOT_ACCEPTED, http: 422, condition: "A license is verified or an agency is appointed while financial_review_status != ACCEPTED" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "A license is verified with verified_expires_on on or before date(current_utc)" }
  # -- business referential
  - { id: ERR_NO_ACTIVE_APPOINTMENT_IN_STATE, http: 422, condition: "No ACTIVE AgencyAppointment exists for the (agency, state program) pair the operation depends on" }
  - { id: ERR_CPL_NOT_PERMITTED_IN_STATE, http: 422, condition: "A closing protection letter is requested or issued in a state whose cpl_permitted == false" }
  - { id: ERR_CPL_SCOPE_NOT_ALLOWED, http: 422, condition: "coverage_scope is not a member of StateProgram.cpl_scope_allowed" }
  - { id: ERR_CPL_NOT_ISSUED, http: 422, condition: "A policy file linked to a letter is issued while that letter's status != ISSUED" }
  - { id: ERR_LINE_POLICY_NOT_ISSUED, http: 422, condition: "A statement line references a policy of another agency, or one whose issuance_status is not ISSUED or LATE_ISSUED" }
  - { id: ERR_POLICY_NOT_IN_PERIOD, http: 422, condition: "A statement line references a policy whose closing_date falls outside the statement period" }
  - { id: ERR_CLAIM_POLICY_MISMATCH, http: 422, condition: "The claim's policy belongs to another agency, is not issued, or the supplied cpl_id differs from the policy's cpl_id" }
  - { id: ERR_TRANSFEREE_NOT_ELIGIBLE, http: 422, condition: "The designated transferee agency is missing, is the terminated agency itself, is not APPOINTED, or is FROZEN" }
  # -- business constraint / temporal
  - { id: ERR_DUPLICATE_TAX_ID, http: 409, condition: "An agency is registered with an already-used tax_id" }
  - { id: ERR_DUPLICATE_STATE_CODE, http: 409, condition: "A state program is created for an already-defined state_code" }
  - { id: ERR_DUPLICATE_APPOINTMENT, http: 409, condition: "A non-withdrawn appointment already exists for the (agency, state program) pair" }
  - { id: ERR_DUPLICATE_ESCROW_ACCOUNT_REF, http: 409, condition: "An account_ref is reused among the agency's non-closed escrow accounts" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "A policy_number is reused among the agency's ISSUED or LATE_ISSUED policy files" }
  - { id: ERR_POLICY_ALREADY_ON_STATEMENT, http: 409, condition: "The same policy_file_id is reported twice on one statement" }
  - { id: ERR_REMITTANCE_PERIOD_OVERLAP, http: 409, condition: "The new statement period overlaps an existing period of the same agency" }
  - { id: ERR_AUDIT_SPACING_VIOLATION, http: 409, condition: "A SCHEDULED audit is opened fewer than AUDIT_SPACING_DAYS (90) days from another SCHEDULED audit of the same escrow account" }
  - { id: ERR_SURPRISE_AUDIT_IN_PROGRESS, http: 409, condition: "A SURPRISE audit is opened while another SURPRISE audit of the same escrow account is still non-terminal" }
  # -- business fiscal
  - { id: ERR_CPL_COVERAGE_CAP_EXCEEDED, http: 422, condition: "requested_coverage_cents exceeds StateProgram.cpl_coverage_cap_cents" }
  - { id: ERR_UNDERWRITING_AUTHORITY_EXCEEDED, http: 422, condition: "A policy is issued with approved_liability_cents above the agency's underwriting_authority_limit_cents without a counsel referral decision on the file" }
  - { id: ERR_APPROVED_LIABILITY_ABOVE_REQUEST, http: 422, condition: "A referral approval sets approved_liability_cents above the file's liability_amount_cents" }
  - { id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http: 422, condition: "settled_amount_cents differs from underwriter_share_cents + late_fee_cents" }
  - { id: ERR_RECOVERY_EXCEEDS_RECOURSE, http: 422, condition: "recovered_amount_cents exceeds the claim's recourse_amount_cents" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: AgencyPrincipal
    description: "The title agency itself. Submits financial reviews, requests closing protection letters, opens and issues policy files, files remittance statements, maintains escrow accounts and answers audit findings."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /agencies/{id}/financial-review"
      - "POST /closing-protection-letters"
      - "POST /policy-files"
      - "POST /remittance-statements"
      - "POST /remittance-statements/{id}/lines"
      - "POST /escrow-accounts"
      - "POST /escrow-accounts/{id}/balance-snapshot"
      - "POST /policy-files/{id}/issuance-state with to_state=ISSUED"
      - "POST /remittance-statements/{id}/state with to_state=SUBMITTED"
      - "POST /audit-findings/{id}/state with to_state=REMEDIATION_SUBMITTED"
    shared_operations:
      - "All GET endpoints"
    note: "X-User-ID equals the Agency.id being acted for; every write above is ownership-checked at priority 50."

  - name: LicensingAnalyst
    description: "Underwriter licensing desk. Registers agencies, decides financial reviews, creates appointments, verifies licenses, and appoints, suspends or reinstates agencies."
    identity: opaque
    exclusive_operations:
      - "POST /agencies/{id}/financial-review-decision"
      - "POST /agency-appointments"
      - "POST /agency-appointments/{id}/license-verification"
      - "POST /agencies/{id}/appointment-decision with decision IN {APPOINT, SUSPEND, REINSTATE}"
    shared_operations:
      - "POST /agencies"
      - "All GET endpoints"

  - name: EscrowAuditor
    description: "Escrow audit examiner. Opens scheduled and surprise audits, submits them for review, raises findings and clears or escalates remediation."
    identity: opaque
    exclusive_operations:
      - "POST /escrow-audits/{id}/findings"
      - "POST /escrow-audits/{id}/state with to_state=SUBMITTED"
    shared_operations:
      - "POST /escrow-audits"
      - "POST /audit-findings/{id}/state with to_state IN {CLEARED, ESCALATED}"
      - "All GET endpoints"
    note: "The X-User-ID that opens an audit is stored as EscrowAudit.conducted_by_user_id and is barred from closing it (SoD-1)."

  - name: UnderwritingCounsel
    description: "Underwriting counsel for complex titles. Resolves referrals on policy files, releases or declines referred closing protection letters, and adjudicates claims out of investigation."
    identity: opaque
    exclusive_operations:
      - "POST /policy-files/{id}/issuance-state with to_state IN {REFERRAL_APPROVED, ISSUANCE_DECLINED}"
      - "POST /closing-protection-letters/{id}/state on a REFERRED letter"
      - "POST /agency-claims/{id}/state with to_state IN {RECOURSE_DEMANDED, ABSORBED}"
    shared_operations:
      - "POST /agency-claims"
      - "All GET endpoints"
    note: "The X-User-ID that approves a referral is stored as PolicyFile.referral_decided_by_user_id and is barred from adjudicating a claim on that file (SoD-2)."

  - name: ComplianceOfficer
    description: "Underwriter compliance and oversight. Defines state programs, decides requested letters, reconciles and settles remittances, reviews and closes audits, resolves recourse demands, executes file transfers, terminates agencies and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /state-programs"
      - "POST /agencies/{id}/appointment-decision with decision=TERMINATE"
      - "POST /policy-files/{id}/transfer-state"
      - "POST /remittance-statements/{id}/state with to_state IN {RECONCILED, SETTLED, DRAFT}"
      - "POST /escrow-audits/{id}/state with to_state IN {UNDER_REVIEW, REMEDIATION_REQUIRED, CLOSED_CLEAN, CLOSED_ADVERSE}"
      - "POST /agency-claims/{id}/state with to_state IN {RECOVERED, WRITTEN_OFF}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /agencies"
      - "POST /escrow-audits"
      - "POST /closing-protection-letters/{id}/state on a REQUESTED letter"
      - "POST /agency-claims"
      - "POST /audit-findings/{id}/state with to_state IN {CLEARED, ESCALATED}"
      - "All GET endpoints"
