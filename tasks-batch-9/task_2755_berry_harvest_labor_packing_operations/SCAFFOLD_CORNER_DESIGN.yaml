        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cooling-start-stale-tunnel
          - validations[priority=23]
          - errors[ERR_STALE_TUNNEL_VERSION]
          - calculations.tunnel_occupancy
        distinguishing_aspect: |
          The tunnel's version is the OCC token even though the capacity check
          would have passed: after lot 1 takes a slot the tunnel is at version 2,
          so lot 2 submitted with the version 1 the caller read at registration is
          412 ERR_STALE_TUNNEL_VERSION - not 409 and not 422 - and the refusal
          leaves committed_slots at 1. Re-reading the tunnel and resubmitting with
          version 2 succeeds, ending at committed_slots 2 and version 3.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one RECRUITING crew; one PLANNED window over 2026-08-03; one 4-slot tunnel whose version is captured at registration."
            - "Two PACKED grade-A lots of 50 clamshells each; lot 1 is already pushed into the tunnel with the registration-time version, so the tunnel is at version 2 with committed_slots 1."
