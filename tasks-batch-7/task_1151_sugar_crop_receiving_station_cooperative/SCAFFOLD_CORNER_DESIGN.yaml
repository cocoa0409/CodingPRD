  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any other check (here: before the 404 the path id would otherwise produce)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/campaigns/00000000-0000-0000-0000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (priority 1 fires before existence priority 4)"

      - name: weigh_outside_slot_window_then_at_window_edge
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WEIGH_WINDOW_CLOSED]"]
        distinguishing_aspect: "Weigh window [slot_start - 1800s, slot_end + 3600s] inclusive: clock 06:00 for a 08:00-10:00 slot fails ERR_WEIGH_WINDOW_CLOSED; clock exactly 07:30:00 (slot_start - 1800s) succeeds."
        test_recipe:
          setup: ["campaign, member, station; booking slot 2026-10-01T08:00:00Z-10:00:00Z CONFIRMED; ticket created"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T06:00:00Z" }, as: COOP_ADMIN }
          trigger:
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T07:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR, captures: { t_status: $.data.status, t_net: $.data.net_weight_lbs } }
          assert:
            - "err == ERR_WEIGH_WINDOW_CLOSED at 06:00"
            - "t_status == WEIGHED and t_net == 28000 at exactly 07:30:00 (inclusive lower bound)"

      - name: weigh_invalid_weights_return_error
        claim_type: violation_to_error
