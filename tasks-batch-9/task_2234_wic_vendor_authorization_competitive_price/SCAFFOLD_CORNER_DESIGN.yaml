          DENIED is terminal for every trigger of the Vendor machine — including
          submit-application, which would otherwise be the re-entry path — and the
          deny transition from IN_REVIEW leaves member_count untouched because an
          IN_REVIEW vendor was never counted as a member.
        test_recipe:
          setup:
