  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: filing_pay_reduces_outstanding
        claim_type: Computed read
        grounds: [endpoints, entities.TierIIFiling.fields.fee_paid_cents, entities.Facility.fields.total_outstanding_fee_cents]
        distinguishing_aspect: "Paying 10000 against a SUBMITTED filing (assessed 10000) sets fee_paid_cents=10000 and Facility.total_outstanding_fee_cents=0."
        test_recipe:
          setup: ["Facility with reportable EHS inventory + SDS; filing submitted (assessed 10000, outstanding 10000)."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "PayF", epa_facility_id: "CN-0022", state_code: "TX", county: "Harris", operator_name: "PayOp" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 5000, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://cl", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/pay"
              payload: { amount_cents: 10000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { paid: $.data.fee_paid_cents }
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { outstanding: $.data.total_outstanding_fee_cents }
          assert:
            - "TierIIFiling.${fil_id}.fee_paid_cents == 10000"
            - "Facility.${fac_id}.total_outstanding_fee_cents == 0"

      - name: lepc_notice_create_and_acknowledge
        claim_type: Action endpoint
        grounds: [endpoints, entities.LEPCNotice.fields.acknowledged, state_machines]
        distinguishing_aspect: "A LEPC notice created by the operator is acknowledged by the LEPCCoordinator, setting acknowledged=true."
        test_recipe:
          setup: ["Facility, chemical, a below-RQ release, and a VERBAL LEPC notice to LEPC."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "LepcF", epa_facility_id: "CN-0023", state_code: "TX", county: "Harris", operator_name: "LepcOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-23", name: "Acrolein", is_ehs: false, rq_lbs: 5000, hazard_weight: 0.2, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-14T00:00:00Z", quantity_released_lbs: 10, medium: "AIR" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id }
            - call: "POST /epcra/lepc-notices"
              payload: { release_id: "${rel_id}", notice_type: "VERBAL", recipient: "LEPC" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /epcra/lepc-notices/${notice_id}/acknowledge"
              payload: {}
              as: LEPCCoordinator
              captures: { ack: $.data.acknowledged }
          assert:
            - "LEPCNotice.${notice_id}.acknowledged == true"

      - name: emergency_response_plan_sets_active
        claim_type: Action endpoint
        grounds: [endpoints, entities.Facility.fields.erp_status]
        distinguishing_aspect: "POST /epcra/facilities/{id}/emergency-response-plan sets erp_status=ACTIVE and bumps Facility.version from 1 to 2."
        test_recipe:
          setup: ["A facility exists (version 1, erp_status NONE)."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "ErpSetF", epa_facility_id: "CN-0024", state_code: "TX", county: "Harris", operator_name: "ErpSetOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /epcra/facilities/${fac_id}/emergency-response-plan"
              payload: { contact_name: "Jane Doe", contact_phone: "555-0100", plan_ref: "erp://v1", linked_lepc_district: "Harris-LEPC" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { erp: $.data.erp_status, ver: $.data.version }
          assert:
            - "Facility.${fac_id}.erp_status == ACTIVE"
            - "Facility.${fac_id}.version == 2"

      - name: rmp_resubmit_from_overdue_returns_active
        claim_type: Conditional action
        grounds: [endpoints, state_machines.RiskManagementPlan.OVERDUE_to_ACTIVE, entities.RiskManagementPlan.fields.status]
        distinguishing_aspect: "An RMP whose next_due_date (2025-01-01) is past the default clock (2026-03-01) is OVERDUE; resubmit returns it to ACTIVE with a new next_due_date 2031-03-01."
        test_recipe:
          setup: ["Facility with an RMP submitted 2020-01-01 (next_due 2025-01-01, now OVERDUE at clock 2026-03-01)."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "RmpResF", epa_facility_id: "CN-0025", state_code: "TX", county: "Harris", operator_name: "RmpResOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/risk-management-plans"
              payload: { facility_id: "${fac_id}", program_level: 3, submitted_date: "2020-01-01T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rmp_id: $.data.id }
          trigger:
            - call: "POST /epcra/risk-management-plans/${rmp_id}/resubmit"
              payload: { submitted_date: "2026-03-01T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { st: $.data.status, due: $.data.next_due_date }
          assert:
            - "RiskManagementPlan.${rmp_id}.status == ACTIVE"
            - "RiskManagementPlan.${rmp_id}.next_due_date == 2031-03-01T00:00:00Z"

