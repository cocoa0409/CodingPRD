      - name: unrecognised_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request presenting a role name that is not a declared §1.7 role is rejected at priority 1 with ERR_UNAUTHENTICATED rather than reaching any business validation."
        test_recipe:
          setup:
            - 'Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /private-student-loans/schools"
              payload: { name: "Ghost College", school_code: "009994", state_code: "OH", certification_capacity_per_period_cents: 1000 }
              as: LoanShark
              captures: { err_auth: $.data.error_id }
          assert:
            - '${err_auth} == ERR_UNAUTHENTICATED at 401'
            - 'GET /private-student-loans/schools reports total_count 0'
      - name: clock_rejects_a_malformed_instant
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_CLOCK]
          - validations[priority=12]
        distinguishing_aspect: "Any instant earlier than the fixed server default 2026-09-01T00:00:00Z is refused, which is what makes every deadline rule deterministic rather than wall-clock dependent."
        test_recipe:
          setup:
            - 'Empty database; the clock is at its fixed server default.'
          setup_api_calls: []
          trigger:
            - call: "POST /private-student-loans/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_clock: $.data.error_id }
          assert:
            - '${err_clock} == ERR_INVALID_CLOCK at 400 - the instant predates the server default'
            - 'the clock still reads 2026-09-01T00:00:00Z on the next read'
