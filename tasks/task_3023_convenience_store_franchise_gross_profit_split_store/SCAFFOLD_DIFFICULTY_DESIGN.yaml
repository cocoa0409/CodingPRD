            - "Settlement.${setL_id}.eligible_split_pct == 0.52 because the >= comparison at 20000000 awards the 0.02 bonus"
            - "Settlement.${setL_id}.franchisee_split_cents == 10400000.00"
            - "Settlement.${setL_id}.franchisor_share_cents == 9600000.00"
            - "a second settlement whose gross_profit_cents is 19999999 pays Settlement.eligible_split_pct == 0.51 and franchisee_split_cents == 10199999.49"

      - name: delivery_window_capacity_boundary_is_inclusive_and_order_quantity_one_over_is_rejected
        grounds:
          - validations[priority=10]
          - entities.DeliveryWindow.fields.capacity_units
          - entities.DeliveryWindow.fields.reserved_units
          - errors[ERR_WINDOW_CAPACITY_EXCEEDED]
          - endpoints.POST_/franchise/fresh-orders
        distinguishing_aspect: |
          A zero/exact-capacity boundary on a different metric and endpoint from the settlement tier
          boundary: reserved_units may reach capacity_units exactly (400 reserved + 100 ordered == 500
          on a 500-unit window is accepted), but ordering one more unit is rejected with
          ERR_WINDOW_CAPACITY_EXCEEDED — the comparison is `>=` on the post-add total, not `>`.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one cold-chain-certified ACTIVE store, one SCHEDULED delivery window with capacity_units 500 already carrying a PLACED order of 400 units on the same delivery_window_id, and one invoice-free extra sku available."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Piedmont Pantry LLC", owner_name: "Owen Baptiste", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fM_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fM_id}", store_number: "NC-3300", state_code: "NC", format: "SUBURBAN", opened_on: "2023-08-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stM_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stM_id}", commissary_code: "COMM-NC-1", day_of_week: "FRI", window_start: "2026-09-11T06:00:00Z", window_end: "2026-09-11T10:00:00Z", capacity_units: 500 }
              as: FranchisorAdmin
              captures: { dwM_id: $.data.id, dwM_v1: $.data.version }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stM_id}", delivery_window_id: "${dwM_id}", sku_code: "SKU-M1", ordered_units: 400, unit_cost_cents: 199 }
              as: Franchisee
              as_user_id: "${fM_id}"
              captures: { foM_id: $.data.id, dwM_v2: $.data.version }
          trigger:
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stM_id}", delivery_window_id: "${dwM_id}", sku_code: "SKU-M2", ordered_units: 100, unit_cost_cents: 149 }
              as: Franchisee
              as_user_id: "${fM_id}"
              captures: { fo_exact_id: $.data.id }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stM_id}", delivery_window_id: "${dwM_id}", sku_code: "SKU-M3", ordered_units: 1, unit_cost_cents: 99 }
              as: Franchisee
              as_user_id: "${fM_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the 100-unit order at exactly the remaining capacity succeeds with status 201 and FreshOrder.${fo_exact_id}.status == PLACED"
            - "GET /delivery-windows/${dwM_id} reports reserved_units == 500 == capacity_units"
            - "the 1-unit order returns 409 and err_id == ERR_WINDOW_CAPACITY_EXCEEDED"
            - "GET /fresh-orders?delivery_window_id=${dwM_id} returns exactly 2 rows — the rejected order was not persisted"
            - "DeliveryWindow.${dwM_id}.reserved_units remains 500"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agreement_activate_requires_the_covering_store_to_be_active
        grounds:
          - state_machines.FranchiseAgreement.DRAFT_to_ACTIVE
          - state_machines.Store.ACTIVE_to_TERMINATED
          - validations[priority=32]
          - errors[ERR_STORE_NOT_ACTIVE]
        distinguishing_aspect: |
          The FranchiseAgreement → Store entity pair: a DRAFT agreement's DRAFT→ACTIVE transition is
          gated on Store.status, so an agreement covering a TERMINATED store cannot activate even when
          the franchisee's net worth clears the floor. The second Store→FranchiseAgreement dependency
          (transfer approval terminating incumbents) is a different direction entirely.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee stating 20000000 cents, whose store was cascaded to TERMINATED by terminating a co-franchisee-free path, and a fresh DRAFT agreement on that terminated store with minimum_net_worth_cents 10000000."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Cascadia Stores LLC", owner_name: "Mira Vance", entity_type: "LLC", stated_net_worth_cents: 20000000 }
              as: FranchisorAdmin
              captures: { fN_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fN_id}", store_number: "OR-1200", state_code: "OR", format: "RURAL", opened_on: "2023-03-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stN_id: $.data.id }
            - call: "POST /franchise/franchisees/${fN_id}/suspend"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fN_id}", store_id: "${stN_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2026-09-01T00:00:00Z", term_end: "2031-09-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agN_id: $.data.id }
          trigger:
            - call: "POST /franchise/agreements/${agN_id}/activate"
              payload: {}
              as: FranchisorAdmin
              captures: { err_id: $.data.id }
          assert:
            - "the activate response returns 409 ERR_STORE_NOT_ACTIVE"
            - "FranchiseAgreement.${agN_id}.status is still DRAFT"
            - "Store.${stN_id}.status == TERMINATED because the suspend cascade ran"
            - "the franchisee's stated_net_worth_cents 20000000 clears the 10000000 agreement floor, so the only failing precondition was the store's state"

      - name: fresh_order_confirm_and_deliver_gate_on_the_bound_window_state
        grounds:
          - state_machines.FreshOrder.PLACED_to_CONFIRMED
          - state_machines.FreshOrder.CONFIRMED_to_DELIVERED
          - state_machines.DeliveryWindow.SCHEDULED_to_LOCKED
          - errors[ERR_WINDOW_LOCKED]
          - errors[ERR_WINDOW_NOT_LOCKED]
        distinguishing_aspect: |
          The FreshOrder → DeliveryWindow pair, a different entity pair from the agreement/store pair:
          confirm requires the window be SCHEDULED (and returns ERR_WINDOW_LOCKED once it is LOCKED),
          while deliver requires the window be LOCKED (and returns 409 while it is still SCHEDULED), so
          the same child's two forward transitions read opposite requirements off the parent's one field.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one cold-chain-certified ACTIVE store, one SCHEDULED delivery window with capacity 600, and one PLACED fresh order of 200 units, plus a second PLACED fresh order of 100 units on the same window."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Tidewater Retail LLC", owner_name: "Sam Okonkwo", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fO_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fO_id}", store_number: "VA-2600", state_code: "VA", format: "SUBURBAN", opened_on: "2022-11-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stO_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stO_id}", commissary_code: "COMM-VA-1", day_of_week: "MON", window_start: "2026-09-14T06:00:00Z", window_end: "2026-09-14T10:00:00Z", capacity_units: 600 }
              as: FranchisorAdmin
              captures: { dwO_id: $.data.id }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stO_id}", delivery_window_id: "${dwO_id}", sku_code: "SKU-O1", ordered_units: 200, unit_cost_cents: 299 }
              as: Franchisee
              as_user_id: "${fO_id}"
              captures: { foO_a: $.data.id }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stO_id}", delivery_window_id: "${dwO_id}", sku_code: "SKU-O2", ordered_units: 100, unit_cost_cents: 399 }
              as: Franchisee
              as_user_id: "${fO_id}"
              captures: { foO_b: $.data.id }
          trigger:
            - call: "POST /franchise/fresh-orders/${foO_a}/deliver"
              payload: { delivered_units: 200 }
              as: Commissary
              captures: { err_pre: $.data.error_id }
            - call: "POST /franchise/fresh-orders/${foO_a}/confirm"
              payload: {}
              as: Commissary
            - call: "POST /franchise/delivery-windows/${dwO_id}/lock"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${foO_b}/confirm"
              payload: {}
              as: Commissary
              captures: { err_post: $.data.error_id }
          assert:
            - "delivering while the window is SCHEDULED returns 409 ERR_WINDOW_NOT_LOCKED"
            - "confirming while the window is SCHEDULED succeeds and FreshOrder.${foO_a}.status == CONFIRMED"
            - "after the lock DeliveryWindow.${dwO_id}.status == LOCKED"
            - "confirming the second order after the lock returns 409 ERR_WINDOW_LOCKED"
            - "FreshOrder.${foO_b}.status is still PLACED"
            - "GET /fresh-orders?delivery_window_id=${dwO_id} returns 2 rows with statuses CONFIRMED and PLACED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: delivery_window_handling_buffer_rejects_abutting_windows
        grounds:
          - validations[priority=39]
          - entities.DeliveryWindow.fields.window_start
          - entities.DeliveryWindow.fields.window_end
          - errors[ERR_WINDOW_HANDLING_OVERLAP]
          - endpoints.POST_/franchise/delivery-windows
        distinguishing_aspect: |
          Buffered-adjacency semantics on the DeliveryWindow resource: a window that starts 15 minutes
          after another window's end is rejected with ERR_WINDOW_HANDLING_OVERLAP, while one that starts
          exactly 30 minutes after the end is accepted — so abutting intervals are NOT allowable and the
          buffer boundary itself is inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee and one ACTIVE store, with a SCHEDULED delivery window W1 for commissary COMM-TX-9 running 2026-09-08T06:00:00Z to 2026-09-08T10:00:00Z."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Cross Timbers LLC", owner_name: "Bea Lockhart", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fP_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fP_id}", store_number: "TX-8100", state_code: "TX", format: "SUBURBAN", opened_on: "2022-06-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stP_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stP_id}", commissary_code: "COMM-TX-9", day_of_week: "TUE", window_start: "2026-09-08T06:00:00Z", window_end: "2026-09-08T10:00:00Z", capacity_units: 500 }
              as: FranchisorAdmin
              captures: { dwP1_id: $.data.id }
          trigger:
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stP_id}", commissary_code: "COMM-TX-9", day_of_week: "TUE", window_start: "2026-09-08T10:15:00Z", window_end: "2026-09-08T14:00:00Z", capacity_units: 400 }
              as: FranchisorAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stP_id}", commissary_code: "COMM-TX-9", day_of_week: "TUE", window_start: "2026-09-08T10:30:00Z", window_end: "2026-09-08T14:00:00Z", capacity_units: 400 }
              as: FranchisorAdmin
              captures: { dwP2_id: $.data.id }
          assert:
            - "the 15-minute-gap window returns 409 and err_id == ERR_WINDOW_HANDLING_OVERLAP"
            - "the exactly-30-minute-gap window returns 201 and DeliveryWindow.${dwP2_id}.status == SCHEDULED"
            - "GET /delivery-windows?store_id=${stP_id} returns exactly 2 rows — the rejected window was not persisted"
            - "the buffer boundary is inclusive: 10:30:00Z passes, 10:15:00Z fails"

      - name: shrink_audit_half_open_adjacency_is_allowed_but_true_overlap_is_not
        grounds:
          - validations[priority=38]
          - entities.ShrinkAudit.fields.period_start
          - entities.ShrinkAudit.fields.period_end
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
          - endpoints.POST_/franchise/shrink-audits
        distinguishing_aspect: |
          Half-open interval semantics on a different resource, the ShrinkAudit: a period starting exactly
          on an existing audit's period_end is ACCEPTED because periods are half-open, while a period
          starting inside the existing one is rejected with ERR_AUDIT_PERIOD_OVERLAP. This is the opposite
          adjacency treatment from the buffered delivery window, which rejects abutting intervals.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement, and a SCHEDULED shrink audit A1 covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Cumberland Operator LLC", owner_name: "Yusuf Karim", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fQ_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fQ_id}", store_number: "TN-4900", state_code: "TN", format: "SUBURBAN", opened_on: "2022-04-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stQ_id: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fQ_id}", store_id: "${stQ_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agQ_id: $.data.id }
            - call: "POST /franchise/agreements/${agQ_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stQ_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", book_inventory_cents: 8000000 }
              as: FranchisorAdmin
              captures: { saQ1_id: $.data.id }
          trigger:
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stQ_id}", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", book_inventory_cents: 7000000 }
              as: FranchisorAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stQ_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", book_inventory_cents: 7500000 }
              as: FranchisorAdmin
              captures: { saQ2_id: $.data.id }
          assert:
            - "the overlapping period returns 409 and err_id == ERR_AUDIT_PERIOD_OVERLAP"
            - "the abutting period starting exactly at the prior period_end returns 201 and ShrinkAudit.${saQ2_id}.status == SCHEDULED"
            - "GET /shrink-audits?store_id=${stQ_id} returns exactly 2 rows — the rejected audit was not persisted"
            - "ShrinkAudit.${saQ1_id}.status is still SCHEDULED and was not disturbed"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: window_reserved_units_returns_to_zero_by_cancel_and_by_reconcile
        grounds:
          - state_machines.FreshOrder.CONFIRMED_to_CANCELLED
          - state_machines.FreshOrder.PLACED_to_CANCELLED
          - state_machines.FreshOrder.DELIVERED_to_RECONCILED
          - entities.DeliveryWindow.fields.reserved_units
          - endpoints.POST_/franchise/fresh-orders/{id}/reconcile
        distinguishing_aspect: |
          Conserved quantity: DeliveryWindow.reserved_units, a physical capacity counter. Both
          compensating actions restore it exactly — a PLACED order cancelled subtracts its ordered_units
          (300 → 0), and a DELIVERED order reconciled also subtracts its ordered_units (250 → 0) — so
          reserved_units after either pair equals its pre-reservation value of 0 with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one cold-chain-certified ACTIVE store, and a SCHEDULED delivery window of capacity_units 1000 starting 2026-09-08T06:00:00Z with reserved_units 0."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Sabine Retail LLC", owner_name: "Dalia Perron", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fR_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fR_id}", store_number: "TX-9500", state_code: "TX", format: "URBAN", opened_on: "2022-02-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stR_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stR_id}", commissary_code: "COMM-TX-4", day_of_week: "TUE", window_start: "2026-09-08T06:00:00Z", window_end: "2026-09-08T10:00:00Z", capacity_units: 1000 }
              as: FranchisorAdmin
              captures: { dwR_id: $.data.id }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stR_id}", delivery_window_id: "${dwR_id}", sku_code: "SKU-R1", ordered_units: 300, unit_cost_cents: 249 }
              as: Franchisee
              as_user_id: "${fR_id}"
              captures: { foR_x: $.data.id }
          trigger:
            - call: "POST /franchise/fresh-orders/${foR_x}/cancel"
              payload: {}
              as: Franchisee
              as_user_id: "${fR_id}"
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stR_id}", delivery_window_id: "${dwR_id}", sku_code: "SKU-R2", ordered_units: 250, unit_cost_cents: 349 }
              as: Franchisee
              as_user_id: "${fR_id}"
              captures: { foR_y: $.data.id }
            - call: "POST /franchise/fresh-orders/${foR_y}/confirm"
              payload: {}
              as: Commissary
            - call: "POST /franchise/delivery-windows/${dwR_id}/lock"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T07:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${foR_y}/deliver"
              payload: { delivered_units: 250 }
              as: Commissary
            - call: "POST /franchise/fresh-orders/${foR_y}/reconcile"
              payload: { waste_units: 0 }
              as: FranchisorAdmin
          assert:
            - "immediately after the order the window read reserved_units == 300"
            - "after the cancellation FreshOrder.${foR_x}.status == CANCELLED and the window reads reserved_units == 0 — exactly its pre-reservation value"
            - "immediately after the second order the window read reserved_units == 250"
            - "after the reconciliation FreshOrder.${foR_y}.status == RECONCILED and the window reads reserved_units == 0"
            - "both compensating actions restored the same conserved quantity to its starting value with zero drift"
            - "GET /fresh-orders?delivery_window_id=${dwR_id} returns 2 rows with statuses CANCELLED and RECONCILED"

      - name: franchisee_draw_outstanding_cents_restored_by_reversal_and_guarded_after_recovery
        grounds:
          - state_machines.DrawAdvance.ISSUED_to_REVERSED
          - state_machines.DrawAdvance.PARTIALLY_RECOVERED_to_REVERSED
          - calculations.franchisee_net_worth
          - entities.Franchisee.fields.draw_outstanding_cents
          - errors[ERR_DRAW_PARTIALLY_RECOVERED]
        distinguishing_aspect: |
          Conserved quantity: Franchisee.draw_outstanding_cents, a money ledger rather than a capacity
          counter. A forward draw of 4000000 paired with its reversal returns draw_outstanding_cents to
          exactly 0, and the scaffold blocks the reverse of a PARTIALLY_RECOVERED draw with
          ERR_DRAW_PARTIALLY_RECOVERED precisely so that a reversal can never leave the ledger short by
          an un-refunded recovered amount.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee stating 30000000 cents, one ACTIVE store, one ACTIVE agreement at rebate_pass_pct 1.0 and split_pct 0.50."
            - "One settlement for [2026-09-01, 2026-09-08) carrying a single SERVICES line 1000000/600000, so its frozen net settlement is 200000.00."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Gulf Horizon LLC", owner_name: "Rafael Ibarra", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fS_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fS_id}", store_number: "TX-1010", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stS_id: $.data.id, stS_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fS_id}", store_id: "${stS_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agS_id: $.data.id }
            - call: "POST /franchise/agreements/${agS_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stS_id}", franchisee_id: "${fS_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stS_v}" }
              as: FranchisorAdmin
              captures: { setS_id: $.data.id, setS_v1: $.data.version }
            - call: "POST /franchise/settlements/${setS_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 1000000, cost_of_goods_cents: 600000, expected_settlement_version: "${setS_v1}" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/draws"
              payload: { franchisee_id: "${fS_id}", store_id: "${stS_id}", amount_cents: 4000000, drawn_on: "2026-09-02T00:00:00Z" }
              as: FranchisorAdmin
              captures: { drS_x: $.data.id }
            - call: "POST /franchise/draws/${drS_x}/reverse"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/draws"
              payload: { franchisee_id: "${fS_id}", store_id: "${stS_id}", amount_cents: 2500000, drawn_on: "2026-09-03T00:00:00Z" }
              as: FranchisorAdmin
              captures: { drS_y: $.data.id }
            - call: "POST /franchise/settlements/${setS_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setS_id}/finalize"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/draws/${drS_y}/reverse"
              payload: {}
              as: FranchisorAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "after the first draw Franchisee.${fS_id}.draw_outstanding_cents == 4000000.00"
            - "after its reversal DrawAdvance.${drS_x}.status == REVERSED and Franchisee.${fS_id}.draw_outstanding_cents == 0.00 — exactly the starting value"
            - "after the second draw Franchisee.${fS_id}.draw_outstanding_cents == 2500000.00"
            - "after the settlement finalizes DrawAdvance.${drS_y}.status == PARTIALLY_RECOVERED and DrawAdvance.${drS_y}.recovered_cents == 200000.00"
            - "Franchisee.${fS_id}.draw_outstanding_cents == 2300000.00"
            - "the attempted reversal of the partially recovered draw returns 409 and err_id == ERR_DRAW_PARTIALLY_RECOVERED"
            - "Franchisee.${fS_id}.draw_outstanding_cents is still exactly 2300000.00 — the rejected reversal left the ledger untouched"