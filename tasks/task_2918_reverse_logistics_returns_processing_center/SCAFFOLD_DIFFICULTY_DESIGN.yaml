      - name: mandatory_recall_cascades_through_refurb_abandon_to_shrink_ledger
        grounds:
          - endpoints[POST /catalog-items/{catalog_item_id}/recall]
          - state_machines.ReturnLine.DISPOSITION_ASSIGNED_to_DISPOSITION_ASSIGNED
          - state_machines.RefurbWorkOrder.IN_TEST_to_ABANDONED
          - calculations.refurb_total_cost
          - calculations.shrink_ledger_entry_amount
          - entities.Client.fields.settlement_balance_cents
        distinguishing_aspect: |
          One recall call produces a four-link chain in which each link is caused by the previous
          one: (1) CatalogItem.recall_status becomes MANDATORY, which (2) force-dispositions the
          in-refurb ReturnLine to DESTROY, which (3) makes its still-IN_TEST RefurbWorkOrder
          non-viable so it is ABANDONED and stamps total_cost_cents 3278, which (4) appends a
          REFURB_COST entry of -3278 and drives Client.settlement_balance_cents to -3278. The
          other transitive_cascade instance originates from a disposition execute, a different
          trigger, and conserves a different set of entities.
        test_recipe:
          setup:
            - "Client CLRECALL: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000."
            - "CatalogItem RECALL-1: declared_value_cents 20000, unit_weight_grams 1200, refurb_eligible true, hazard_class NONE, recall_status NONE at receipt so grading needs no quarantine."
            - "ProcessingBay BAY-G2 of bay_type GENERAL with buffer_minutes 30."
            - "One received line graded C (disposition REFURBISH), whose RefurbWorkOrder has been through two failed test cycles totalling 30 labour minutes and is currently IN_TEST on its third cycle."
