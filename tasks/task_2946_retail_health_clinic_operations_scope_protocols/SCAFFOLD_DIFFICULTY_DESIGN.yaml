              as: ClinicAdmin
              captures: { clinic_q_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Pike", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_p2_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Pike", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_q_id}", supervising_physician_id: "${phys_p2_id}" }
              as: ClinicAdmin
              captures: { clin_q_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_q_id}", clinician_id: "${clin_q_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${phys_p2_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Nine Oclock", date_of_birth: "1980-01-01" }
              as: FrontDeskAgent
              captures: { pat_a9_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Nine Thirtyfive", date_of_birth: "1980-02-01" }
              as: FrontDeskAgent
              captures: { pat_b9_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ten Oclock", date_of_birth: "1980-03-01" }
              as: FrontDeskAgent
              captures: { pat_c10_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ten Twentyfive", date_of_birth: "1980-04-01" }
              as: FrontDeskAgent
              captures: { pat_d10_id: $.data.id }
          trigger:
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_q_id}", patient_id: "${pat_a9_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T09:00:00Z" }
              as: FrontDeskAgent
              captures: { appt_0900_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_q_id}", patient_id: "${pat_b9_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T09:35:00Z" }
              as: FrontDeskAgent
              captures: { err_cap: $.data.error_id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_q_id}", patient_id: "${pat_c10_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T10:00:00Z" }
              as: FrontDeskAgent
              captures: { appt_1000_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_q_id}", patient_id: "${pat_d10_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T10:25:00Z" }
              as: FrontDeskAgent
              captures: { err_buffer: $.data.error_id }
          assert:
