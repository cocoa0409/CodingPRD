  - rule_id: non_linear_state_machine
    instances:

      - name: order_revision_loop_returns_to_draft_then_blocks_returning_reviewer
        grounds:
          - state_machines.CommodityOrder.SUBMITTED_to_DRAFT
          - state_machines.CommodityOrder.DRAFT_to_SUBMITTED
          - state_machines.CommodityOrder.SUBMITTED_to_APPROVED
          - entities.CommodityOrder.fields.revision_count
          - entities.CommodityOrder.fields.last_returned_by_user_id
          - validations.priority_16_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "CommodityOrder is the cyclic entity: DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED re-enters a previously occupied state, and the second pass is not equivalent to the first because revision_count 1 plus last_returned_by_user_id now bars the returning reviewer from approving."
