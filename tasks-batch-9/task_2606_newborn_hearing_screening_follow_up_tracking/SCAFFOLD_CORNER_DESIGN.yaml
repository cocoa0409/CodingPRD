        distinguishing_aspect: "An explicitly named navigator at max_open_tasks is 409 ERR_NAVIGATOR_AT_CAPACITY on both the create and the assign path, while re-assigning an OPEN task or re-closing a COMPLETED one is 409 ERR_TASK_INVALID_STATE — and a rejected create debits no budget."
