# =============================================================================
# SCAFFOLD.yaml — ASL/CART Deaf-Interpreting & Scheduling platform
# Difficulty target: beyond Expert (dense coupling across scheduling, travel,
# per-hour billing, ADA credential gating, no-show strikes, credit waterfalls).
# =============================================================================

scenario: "977. ASL/CART Deaf-Interpreting & Scheduling: request & modality (ASL/CART/VRI), interpreter certification & match, assignment & travel, no-show/cancellation, encounter & per-hour billing, quality/complaint, ADA-mandated (medical/legal/education), reporting"

domain_name: asl-cart-deaf-interpreting
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency      # OCC on InterpretingRequest.version (offer supersede) and RequestingOrg.version (credit memo issue)
    - cascading_side_effects      # no-show -> strike -> suspension -> assignment cancels -> request re-match
    - dual_variant_calculation    # estimate vs final billing; provisional vs final quality score
    - scheduled_actions           # offer expiry, encounter auto-verify, request UNFILLED sweep via logical clock
  entity_topology: flat           # peer resources with FK links; sub-resource GETs only for reverse reachability
  state_machine_shape: cyclic     # request re-match loop; invoice carries parallel payment x dispute dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # requester files, QualityReviewer adjudicates, BillingClerk settles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RequestingOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization display name" }
      - { name: org_type, type: enum, source: input, description: "MEDICAL | LEGAL | EDUCATION | GENERAL — primary ADA service context of the org" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED blocks all org write actions (submit/cancel/verify/dispute/complaint)" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding_balance_cents + new estimated commitment; fiscal gate at offer/confirm" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Read-time aggregation: SUM(amount_due_cents) over own Invoices with issue_status == ISSUED AND payment_status != PAID. Never stored; recomputed on every read." }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: modality, type: enum, source: input, description: "ASL_ONSITE | CART_ONSITE | VRI" }
      - { name: ada_context, type: enum, source: input, description: "MEDICAL | LEGAL | EDUCATION | GENERAL" }
      - { name: credential_level, type: enum, source: input, description: "SCREENED | CERTIFIED | SPECIALIST — credential level this card prices" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor rate per hour in cents; billed per minute as round_half_up(minutes * hourly_rate_cents / 60)" }
      - { name: minimum_billable_minutes, type: integer, source: input, description: "Minimum billed labor minutes per encounter (e.g. 120 onsite, 30 VRI)" }
      - { name: travel_rate_cents_per_hour, type: integer, source: input, description: "Interpreter travel-time reimbursement per hour; 0 for VRI cards" }
      - { name: mileage_rate_cents_per_mile, type: integer, source: input, description: "Mileage reimbursement per mile; 0 for VRI cards" }
      - { name: vri_platform_fee_cents_per_min, type: integer, source: input, description: "VRI platform fee per ACTUAL minute (not billable minutes); 0 for onsite cards" }
      - { name: cancel_full_refund_notice_hours, type: integer, source: input, description: "Notice >= this many hours before scheduled_start -> cancellation fee 0" }
      - { name: cancel_partial_notice_hours, type: integer, source: input, description: "Notice >= this and < full-refund window -> fee = late_cancel_fee_pct of minimum charge" }
      - { name: late_cancel_fee_pct, type: number, source: input, description: "Fraction (0..1) of the minimum charge billed when cancel notice is inside the partial window; below the partial window the fee is 100% of the minimum charge" }
      - { name: effective_from, type: datetime, source: input, description: "Card is selectable only when effective_from <= current logical time" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED cards are excluded from new selection; pinned snapshots on Assignments are unaffected" }

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Interpreter display name" }
      - { name: modalities_offered, type: array, source: input, description: "Non-empty subset of [ASL_ONSITE, CART_ONSITE, VRI] the interpreter will service" }
      - { name: home_zip, type: string, source: input, description: "Home base ZIP used for travel context" }
      - { name: vri_platform_certified, type: boolean, source: input, default: false, description: "Required true for any VRI assignment offer" }
      - { name: status, type: enum, source: system, default: PENDING_ONBOARD, description: "PENDING_ONBOARD | ACTIVE | SUSPENDED — activation requires >= 1 verified Certification; auto-suspends at 3 rolling active strikes" }
      - { name: active_strike_count, type: integer, source: computed, description: "COUNT of StrikeRecord rows for this interpreter with status == ACTIVE and occurred_at >= now - 365 days (inclusive boundary)" }
      - { name: quality_score, type: integer, source: computed, default: 100, description: "max(0, 100 - SUM(penalty_points of SUBSTANTIATED complaints)). Final variant: pending complaints excluded." }
      - { name: quality_score_provisional, type: integer, source: computed, default: 100, description: "max(0, 100 - SUM(penalty_points of complaints in {FILED, UNDER_REVIEW, SUBSTANTIATED})). Provisional variant: assumes worst on pending complaints." }

  - name: Certification
    parent: Interpreter
    common_fields: true
    fields:
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; owning interpreter (path-scoped)" }
      - { name: credential, type: enum, source: input, description: "RID_NIC | RID_CI_CT | STATE_QA | CART_CRR | NAD_V | LEGAL_SCL" }
      - { name: level, type: enum, source: input, description: "SCREENED | CERTIFIED | SPECIALIST — ordering SCREENED < CERTIFIED < SPECIALIST" }
      - { name: issued_on, type: datetime, source: input, description: "Issue date of the credential" }
      - { name: expires_on, type: datetime, source: input, description: "Credential must satisfy expires_on >= assignment scheduled_start to count for eligibility" }
      - { name: verified, type: boolean, source: system, default: false, description: "Set true only by POST .../certifications/{certId}/verify (PlatformAdmin)" }

  - name: AvailabilityWindow
    parent: Interpreter
    common_fields: true
    fields:
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; owning interpreter (path-scoped)" }
      - { name: start_at, type: datetime, source: input, description: "Window start (half-open interval [start_at, end_at))" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); must be > start_at" }
      - { name: modalities, type: array, source: input, description: "Non-empty subset of [ASL_ONSITE, CART_ONSITE, VRI] coverable in this window" }

  - name: InterpretingRequest
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> RequestingOrg.id; requesting organization (must equal X-User-ID for OrgRequester)" }
      - { name: consumer_name, type: string, source: input, description: "Name of the deaf/hard-of-hearing consumer" }
      - { name: modality, type: enum, source: input, description: "ASL_ONSITE | CART_ONSITE | VRI" }
      - { name: ada_context, type: enum, source: input, default: GENERAL, description: "MEDICAL | LEGAL | EDUCATION | GENERAL — drives required_credential_level" }
      - { name: scheduled_start, type: datetime, source: input, description: "Service start; must be >= now + 2h at submit time" }
      - { name: scheduled_end, type: datetime, source: input, description: "Service end; must be > scheduled_start" }
      - { name: onsite_address, type: string, source: input, description: "Required iff modality in {ASL_ONSITE, CART_ONSITE}; forbidden to be required for VRI" , constraints: "conditional required" }
      - { name: estimated_mileage, type: number, source: input, default: 0, description: "Estimated round-trip miles; used only in the provisional cost estimate" }
      - { name: required_credential_level, type: enum, source: computed, description: "Derived mapping: LEGAL -> SPECIALIST; MEDICAL -> CERTIFIED; EDUCATION -> CERTIFIED; GENERAL -> SCREENED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | MATCHING | OFFERED | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED | UNFILLED | CLOSED" }
      - { name: offer_attempt_count, type: integer, source: system, default: 0, description: "Increments by 1 on every successful offer creation; offers blocked at count >= 3 (ERR_MAX_OFFER_ATTEMPTS_REACHED)" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Set when request is CANCELLED from CONFIRMED; 0 for fee-free cancels; null otherwise", default: null }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Set on transition to CANCELLED" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Set on transition to CLOSED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> InterpretingRequest.id; the request this offer/assignment services" }
      - { name: interpreter_id, type: string, source: input, description: "FK -> Interpreter.id; interpreter the offer is extended to" }
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id; card selected and pinned at offer creation" }
      - { name: rate_card_version, type: integer, source: system, description: "Version of the RateCard at pin time (audit trail for the snapshot)" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | CONFIRMED | EN_ROUTE | ON_SITE | COMPLETED | DECLINED | EXPIRED | CANCELLED | NO_SHOW" }
      - { name: offered_at, type: datetime, source: system, description: "Logical time of offer creation" }
      - { name: response_deadline, type: datetime, source: system, description: "min(scheduled_start, offered_at + 24h); accept at or after deadline auto-expires the offer" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Set on accept" }
      - { name: pinned_hourly_rate_cents, type: integer, source: system, description: "Snapshot of RateCard.hourly_rate_cents at offer time; immune to later card edits/retirement" }
      - { name: pinned_minimum_billable_minutes, type: integer, source: system, description: "Snapshot of RateCard.minimum_billable_minutes" }
      - { name: pinned_travel_rate_cents_per_hour, type: integer, source: system, description: "Snapshot of RateCard.travel_rate_cents_per_hour" }
      - { name: pinned_mileage_rate_cents_per_mile, type: integer, source: system, description: "Snapshot of RateCard.mileage_rate_cents_per_mile" }
      - { name: pinned_vri_platform_fee_cents_per_min, type: integer, source: system, description: "Snapshot of RateCard.vri_platform_fee_cents_per_min" }
      - { name: pinned_cancel_full_refund_notice_hours, type: integer, source: system, description: "Snapshot of RateCard.cancel_full_refund_notice_hours" }
      - { name: pinned_cancel_partial_notice_hours, type: integer, source: system, description: "Snapshot of RateCard.cancel_partial_notice_hours" }
      - { name: pinned_late_cancel_fee_pct, type: number, source: system, description: "Snapshot of RateCard.late_cancel_fee_pct" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional estimate computed at offer creation (see calculations.estimated_cost)" }
      - { name: cancelled_by, type: enum, source: system, default: null, description: "REQUESTER | PLATFORM | INTERPRETER | SYSTEM — set on CANCELLED" }
      - { name: cancel_notice_hours, type: number, source: computed, default: null, description: "(scheduled_start - cancel time) / 3600 seconds, in hours, set on REQUESTER/PLATFORM cancel" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: null, description: "Tiered fee per calculations.cancellation_fee; null unless cancelled from ACCEPTED/CONFIRMED/EN_ROUTE" }
      - { name: no_show_marked_at, type: datetime, source: system, default: null, description: "Set on mark-no-show" }
      - { name: travel_minutes_claimed, type: integer, source: input, default: 0, description: "Interpreter-claimed one-way+return travel minutes, supplied at check-out (>= 0)" }
      - { name: mileage_claimed, type: number, source: input, default: 0, description: "Interpreter-claimed round-trip miles, supplied at check-out (>= 0)" }

  - name: Encounter
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; exactly one Encounter per Assignment (created at check-in)" }
      - { name: modality_delivered, type: enum, source: system, description: "Modality actually delivered; equals the request modality at check-in" }
      - { name: actual_start, type: datetime, source: system, description: "Logical time of check-in" }
      - { name: actual_end, type: datetime, source: system, default: null, description: "Logical time of check-out; null while ON_SITE" }
      - { name: actual_minutes, type: integer, source: computed, description: "ceil((actual_end - actual_start) / 60 seconds); null until check-out" , default: null }
      - { name: billable_minutes, type: integer, source: computed, description: "max(actual_minutes, pinned_minimum_billable_minutes of the assignment); recomputed if verify supplies corrected times" , default: null }
      - { name: verified, type: boolean, source: system, default: false, description: "True after requester verify or auto-verify sweep" }
      - { name: verify_deadline, type: datetime, source: system, description: "actual_end + 72h; clock sweep at/after deadline auto-verifies" , default: null }
      - { name: verified_by, type: enum, source: system, default: null, description: "ORG | SYSTEM" }
      - { name: corrected_start, type: datetime, source: input, default: null, description: "Optional requester-corrected start supplied at verify; must be < corrected_end" }
      - { name: corrected_end, type: datetime, source: input, default: null, description: "Optional requester-corrected end supplied at verify; must be > corrected_start and <= now" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> RequestingOrg.id; billed organization (from the request)" }
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; exactly one Invoice per Assignment (ERR_INVOICE_ALREADY_EXISTS on second generate)" }
      - { name: encounter_id, type: string, source: system, default: null, description: "FK -> Encounter.id; null for cancellation-fee-only invoices" }
      - { name: issue_status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | VOID — parallel dimension 1" }
      - { name: dispute_status, type: enum, source: system, default: NONE, description: "NONE | OPEN | RESOLVED_UPHELD | RESOLVED_OVERTURNED — parallel dimension 2, independent of payment_status" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | PARTIALLY_PAID | PAID — parallel dimension 3, derived from amount_due_cents vs subtotal" }
      - { name: line_items, type: array, source: computed, description: "Array of {kind, quantity, unit_rate_cents, amount_cents}; kind in {LABOR, TRAVEL_TIME, MILEAGE, PLATFORM_FEE, CANCELLATION_FEE, ADJUSTMENT}; each amount_cents is round_half_up per line BEFORE summing (pinned rounding order)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "SUM of per-line rounded amount_cents (round-per-line-then-sum, never sum-then-round)" }
      - { name: credits_applied_cents, type: integer, source: computed, description: "SUM of CreditMemo applications to this invoice (net of voided/invoice-voided reversals)" }
      - { name: payments_applied_cents, type: integer, source: computed, description: "SUM of recorded payments" }
      - { name: amount_due_cents, type: integer, source: computed, description: "max(0, subtotal_cents - credits_applied_cents - payments_applied_cents) — invariant must hold at all times" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Set on issue; drives waterfall ordering and report inclusion windows" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Reason text supplied on dispute" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> RequestingOrg.id; filing organization (must equal X-User-ID)" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; complained-about assignment (must belong to org; status COMPLETED or NO_SHOW)" }
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; denormalized from assignment at filing time" }
      - { name: category, type: enum, source: input, description: "QUALITY | LATENESS | PROFESSIONALISM | BILLING | ACCESS" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: narrative, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | SUBSTANTIATED | DISMISSED" }
      - { name: penalty_points, type: integer, source: computed, default: null, description: "Set at adjudication: MINOR 5, MAJOR 15, CRITICAL 30; null while pending or DISMISSED" }
      - { name: credit_pct, type: number, source: computed, default: null, description: "Set at SUBSTANTIATED adjudication: default MINOR 0.10, MAJOR 0.25, CRITICAL 0.50; credit_pct_override replaces the default" }
      - { name: credit_amount_cents, type: integer, source: computed, default: null, description: "round_half_up(credit_pct * base) where base = subtotal_cents of the assignment's ISSUED invoice if one exists, else assignment.estimated_cost_cents" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Increments on reopen; reopen blocked at >= 1 (ERR_COMPLAINT_ALREADY_REOPENED)" }

  - name: CreditMemo
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> RequestingOrg.id; org receiving the credit" }
      - { name: complaint_id, type: string, source: input, default: null, description: "FK -> Complaint.id; originating complaint for auto-created memos, null for manual goodwill credits" }
      - { name: amount_cents, type: integer, source: input, description: "Total credit amount (> 0). For adjudication-created memos the server sets this from the complaint's credit_amount_cents." }
      - { name: remaining_cents, type: integer, source: computed, description: "amount_cents - SUM(applications.amount_cents) net of reversals" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | EXHAUSTED | VOID — EXHAUSTED when remaining_cents == 0; VOID reverses all applications" }
      - { name: applications, type: array, source: computed, description: "Array of {invoice_id, amount_cents} in waterfall application order (issued_at ASC, then created_at ASC)" }

  - name: StrikeRecord
    parent: Interpreter
    common_fields: false
    fields:
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; struck interpreter" }
      - { name: assignment_id, type: string, source: input, default: null, description: "FK -> Assignment.id; the no-showed assignment, or null for manually documented external no-shows" }
      - { name: occurred_at, type: datetime, source: input, description: "When the no-show occurred; for mark-no-show the server sets this to the assignment's scheduled_start; rolling-window membership uses occurred_at >= now - 365 days (inclusive)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RESCINDED" }
      - { name: rescinded_at, type: datetime, source: system, default: null, description: "Set on rescind" }

  - name: ReportingSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, default: null, description: "FK -> RequestingOrg.id; null means a platform-wide snapshot across all orgs" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive window start [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive window end; must be > window_start" }
      - { name: generated_at, type: datetime, source: system, description: "Logical generation time" }
      - { name: total_requests, type: integer, source: computed, description: "Requests (of the org, or all if platform-wide) with scheduled_start in [window_start, window_end)" }
      - { name: filled_count, type: integer, source: computed, description: "Included requests whose status in {CONFIRMED, IN_PROGRESS, COMPLETED, CLOSED}" }
      - { name: unfilled_count, type: integer, source: computed, description: "Included requests with status UNFILLED" }
      - { name: cancelled_count, type: integer, source: computed, description: "Included requests with status CANCELLED" }
      - { name: fulfillment_rate, type: number, source: computed, description: "round_half_up(filled_count / (total_requests - cancelled_count), 4 decimals); 0.0 when denominator == 0" }
      - { name: no_show_count, type: integer, source: computed, description: "Assignments with status NO_SHOW whose request's scheduled_start is in the window (scoped to org when org_id set)" }
      - { name: avg_response_minutes, type: number, source: computed, description: "Mean over assignments with accepted_at set and offered_at in window of (accepted_at - offered_at)/60s; round_half_up 2 decimals; 0.0 when no such assignments" }
      - { name: total_billed_cents, type: integer, source: computed, description: "SUM(subtotal_cents) over invoices with issue_status in {ISSUED, VOID? no — ISSUED only} and issued_at in window" }
      - { name: complaint_count, type: integer, source: computed, description: "Complaints with created_at in window" }
      - { name: substantiated_count, type: integer, source: computed, description: "Included complaints with status SUBSTANTIATED" }
      - { name: ada_context_mix, type: object, source: computed, description: "{MEDICAL: n, LEGAL: n, EDUCATION: n, GENERAL: n} counts over included requests" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InterpretingRequest
    initial_state: DRAFT
    terminal_states: [CANCELLED, UNFILLED, CLOSED]
    transitions:
      - from: DRAFT
        to: MATCHING
        trigger: "POST /requests/{id}/submit"
        actor: OrgRequester
        preconditions:
          - "OrgRequester owns the request (request.org_id == X-User-ID)"
          - "RequestingOrg.status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "scheduled_end > scheduled_start AND scheduled_start >= now + 2h (ERR_INVALID_SCHEDULE)"
        side_effects:
          - "increments InterpretingRequest.version by 1"

      - from: MATCHING
        to: OFFERED
        trigger: "POST /requests/{id}/offers (offer creation)"
        actor: PlatformAdmin
        preconditions:
          - "request.status in {MATCHING, OFFERED} (ERR_REQUEST_NOT_OFFERABLE); an existing OFFERED assignment is superseded (CANCELLED by SYSTEM, no fee)"
          - "offer_attempt_count < 3 (ERR_MAX_OFFER_ATTEMPTS_REACHED)"
          - "expected_request_version == request.version (ERR_STALE_REQUEST_VERSION, 412)"
          - "Interpreter eligible: status ACTIVE, modality in modalities_offered, vri_platform_certified when VRI, verified non-expired Certification with level >= request.required_credential_level, quality_score >= 40, availability coverage (see validations)"
          - "Fiscal: org.outstanding_balance_cents + estimated_cost_cents <= org.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Assignment created OFFERED with pinned rate-card snapshot and estimated_cost_cents"
          - "offer_attempt_count += 1"
          - "increments InterpretingRequest.version by 1"

      - from: OFFERED
        to: MATCHING
        trigger: "system (outstanding offer DECLINED or EXPIRED, and offer_attempt_count < 3)"
        actor: system
        preconditions: ["offer_attempt_count < 3"]
        side_effects:
          - "increments InterpretingRequest.version by 1"

      - from: OFFERED
        to: UNFILLED
        trigger: "system (outstanding offer DECLINED or EXPIRED, and offer_attempt_count >= 3)"
        actor: system
        preconditions: ["offer_attempt_count >= 3"]
        side_effects: []

      - from: MATCHING
        to: UNFILLED
        trigger: "system (clock sweep: now >= scheduled_start while still MATCHING)"
        actor: system
        preconditions: ["now >= scheduled_start"]
        side_effects: []

      - from: OFFERED
        to: UNFILLED
        trigger: "system (clock sweep: now >= scheduled_start while still OFFERED; outstanding offer -> EXPIRED)"
        actor: system
        preconditions: ["now >= scheduled_start"]
        side_effects:
          - "outstanding OFFERED Assignment -> EXPIRED"

      - from: OFFERED
        to: CONFIRMED
        trigger: "system (bubble-up: assignment CONFIRMED via POST /assignments/{id}/confirm)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InterpretingRequest.version by 1"

      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system (bubble-up: assignment check-in)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (bubble-up: assignment COMPLETED AND linked Encounter.verified == true)"
        actor: system
        preconditions:
          - "Assignment.status == COMPLETED"
          - "Encounter.verified == true (cross-entity gate; ERR_ENCOUNTER_NOT_VERIFIED blocks invoice generation until then)"
        side_effects:
          - "increments InterpretingRequest.version by 1"

      - from: COMPLETED
        to: CLOSED
        trigger: "system (bubble-up: the assignment's Invoice.payment_status becomes PAID)"
        actor: system
        preconditions: ["Invoice.payment_status == PAID"]
        side_effects:
          - "closed_at set"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /requests/{id}/cancel"
        actor: OrgRequester
        preconditions: ["OrgRequester owns the request", "RequestingOrg.status == ACTIVE"]
        side_effects: ["cancellation_fee_cents = 0", "cancelled_at set"]

      - from: MATCHING
        to: CANCELLED
        trigger: "POST /requests/{id}/cancel"
        actor: OrgRequester
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["cancellation_fee_cents = 0", "cancelled_at set"]

      - from: OFFERED
        to: CANCELLED
        trigger: "POST /requests/{id}/cancel"
        actor: OrgRequester
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects:
          - "outstanding OFFERED Assignment -> CANCELLED (cancelled_by REQUESTER, no fee)"
          - "cancellation_fee_cents = 0"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /requests/{id}/cancel"
        actor: OrgRequester
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects:
          - "CONFIRMED/EN_ROUTE Assignment -> CANCELLED (cancelled_by REQUESTER) with tiered cancellation_fee_cents"
          - "request.cancellation_fee_cents = assignment.cancellation_fee_cents"
          - "if fee > 0: a CANCELLATION_FEE-only Invoice is created in DRAFT (encounter_id null)"

      - from: CONFIRMED
        to: MATCHING
        trigger: "system (assignment cancelled by PLATFORM, INTERPRETER-suspension cascade, or NO_SHOW re-match; offer_attempt_count < 3)"
        actor: system
        preconditions: ["offer_attempt_count < 3"]
        side_effects:
          - "increments InterpretingRequest.version by 1"

      - from: CONFIRMED
        to: UNFILLED
        trigger: "system (same triggers as CONFIRMED -> MATCHING but offer_attempt_count >= 3)"
        actor: system
        preconditions: ["offer_attempt_count >= 3"]
        side_effects: []

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, CANCELLED, NO_SHOW, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Interpreter
        preconditions:
          - "acting interpreter owns the assignment (assignment.interpreter_id == X-User-ID, ERR_FORBIDDEN_OWNERSHIP)"
          - "status == OFFERED (ERR_ASSIGNMENT_NOT_OFFERED)"
          - "Interpreter.status == ACTIVE (ERR_INTERPRETER_NOT_ACTIVE)"
          - "now < response_deadline; at/after deadline the offer is auto-EXPIRED and the accept is rejected ERR_ASSIGNMENT_NOT_OFFERED"
        side_effects:
          - "accepted_at set"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: Interpreter
        preconditions:
          - "ownership as accept"
          - "status == OFFERED (ERR_ASSIGNMENT_NOT_OFFERED)"
        side_effects:
          - "Request: OFFERED -> MATCHING if offer_attempt_count < 3 else -> UNFILLED (cascade to request machine)"

      - from: OFFERED
        to: EXPIRED
        trigger: "system (clock sweep or lazy on access when now >= response_deadline)"
        actor: system
        preconditions: ["now >= response_deadline"]
        side_effects:
          - "Request: OFFERED -> MATCHING if offer_attempt_count < 3 else -> UNFILLED"

      - from: OFFERED
        to: CANCELLED
        trigger: "system (superseded by a newer offer, or request cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "cancelled_by = SYSTEM | REQUESTER; no cancellation fee from OFFERED"

      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: PlatformAdmin
        preconditions:
          - "status == ACCEPTED (ERR_ASSIGNMENT_NOT_ACCEPTED)"
          - "Interpreter.status == ACTIVE (ERR_INTERPRETER_NOT_ACTIVE)"
          - "No buffered double-booking (calculations.double_booking_buffer_check, ERR_INTERPRETER_DOUBLE_BOOKED)"
          - "VRI capacity (calculations.vri_capacity_check, ERR_VRI_CAPACITY_EXCEEDED) when modality == VRI"
          - "Fiscal re-check: org.outstanding_balance_cents + estimated_cost_cents <= org.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Request: OFFERED -> CONFIRMED (bubble-up)"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: [OrgRequester, PlatformAdmin]
        preconditions:
          - "OrgRequester actor must own the assignment's org (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "tiered cancellation_fee_cents computed from pinned windows (calculations.cancellation_fee)"
          - "cancelled_by = REQUESTER | PLATFORM"
          - "REQUESTER cancel: Request -> CANCELLED (fee invoice if fee > 0). PLATFORM cancel: Request -> MATCHING if attempts < 3 else UNFILLED"

      - from: CONFIRMED
        to: EN_ROUTE
        trigger: "POST /assignments/{id}/depart"
        actor: Interpreter
        preconditions:
          - "ownership; status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "modality in {ASL_ONSITE, CART_ONSITE}; VRI rejects depart with ERR_INVALID_REQUEST"
        side_effects: []

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /assignments/{id}/check-in"
        actor: Interpreter
        preconditions:
          - "ownership; status in {CONFIRMED (VRI only), EN_ROUTE (onsite)} (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "check-in window: scheduled_start - 30min <= now <= scheduled_end (ERR_CHECK_IN_WINDOW_VIOLATION)"
        side_effects:
          - "Encounter created (actual_start = now, modality_delivered = request modality)"
          - "Request: CONFIRMED -> IN_PROGRESS (bubble-up)"

      - from: CONFIRMED
        to: ON_SITE
        trigger: "POST /assignments/{id}/check-in (VRI direct join)"
        actor: Interpreter
        preconditions: ["same as EN_ROUTE -> ON_SITE"]
        side_effects: ["same as EN_ROUTE -> ON_SITE"]

      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /assignments/{id}/check-out"
        actor: Interpreter
        preconditions:
          - "ownership; status == ON_SITE (ERR_ASSIGNMENT_NOT_ON_SITE)"
          - "travel_minutes_claimed/mileage_claimed optional, >= 0"
        side_effects:
          - "Encounter.actual_end = now; actual_minutes, billable_minutes computed; verify_deadline = actual_end + 72h"
          - "Request stays IN_PROGRESS until Encounter verified"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: [OrgRequester, PlatformAdmin]
        preconditions: ["same as ACCEPTED -> CANCELLED"]
        side_effects: ["same as ACCEPTED -> CANCELLED"]

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: [OrgRequester, PlatformAdmin]
        preconditions: ["same as ACCEPTED -> CANCELLED"]
        side_effects: ["same as ACCEPTED -> CANCELLED"]

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/mark-no-show"
        actor: PlatformAdmin
        preconditions:
          - "status in {CONFIRMED, EN_ROUTE} (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "now >= scheduled_start + 15min grace (ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "no_show_marked_at = now"
          - "StrikeRecord created (status ACTIVE, occurred_at = assignment.scheduled_start) -> Interpreter.active_strike_count recomputed (link 2 of cascade)"
          - "if active_strike_count >= 3: Interpreter -> SUSPENDED (link 3), which itself cancels the interpreter's other OFFERED/ACCEPTED/CONFIRMED assignments (SYSTEM) and re-matches their requests (link 4)"
          - "Request: CONFIRMED -> MATCHING if offer_attempt_count < 3 else -> UNFILLED"

      - from: EN_ROUTE
        to: NO_SHOW
        trigger: "POST /assignments/{id}/mark-no-show"
        actor: PlatformAdmin
        preconditions: ["same as CONFIRMED -> NO_SHOW"]
        side_effects: ["same as CONFIRMED -> NO_SHOW"]

  - entity: Interpreter
    initial_state: PENDING_ONBOARD
    terminal_states: []
    transitions:
      - from: PENDING_ONBOARD
        to: ACTIVE
        trigger: "POST /interpreters/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - ">= 1 Certification with verified == true (ERR_CREDENTIAL_INSUFFICIENT)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /interpreters/{id}/suspend OR system auto-suspend when active_strike_count reaches >= 3"
        actor: [PlatformAdmin, system]
        preconditions: []
        side_effects:
          - "All interpreter's assignments in {OFFERED, ACCEPTED, CONFIRMED} -> CANCELLED (cancelled_by SYSTEM, no fee)"
          - "Each affected request: OFFERED/CONFIRMED -> MATCHING if offer_attempt_count < 3 else UNFILLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /interpreters/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "active_strike_count < 3 (ERR_ACTIVE_STRIKES_AT_LIMIT)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT  # issue_status; dispute_status=NONE, payment_status=UNPAID at creation
    terminal_states: [VOID]  # issue_status terminal; PAID+!OPEN is a soft-terminal
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions: ["issue_status == DRAFT (ERR_INVOICE_NOT_DRAFT)"]
        side_effects:
          - "issued_at = now; becomes eligible for credit waterfall and org outstanding aggregation"

      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "issue_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "payments_applied_cents == 0 AND dispute_status != OPEN (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "All CreditMemo applications to this invoice are reversed (memo.remaining_cents += applied; EXHAUSTED -> OPEN)"

      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects: []

      - from: NONE
        to: OPEN
        trigger: "POST /invoices/{id}/dispute (dispute_status dimension)"
        actor: OrgRequester
        preconditions:
          - "issue_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "OrgRequester owns invoice.org_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "dispute_status == NONE (ERR_INVOICE_NOT_DISPUTED is NOT used here; re-dispute of RESOLVED is allowed only from RESOLVED_UPHELD? no — dispute requires dispute_status == NONE, else ERR_INVALID_REQUEST)"
        side_effects: ["dispute_reason recorded"]

      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /invoices/{id}/resolve-dispute with outcome == UPHELD"
        actor: BillingClerk
        preconditions: ["dispute_status == OPEN (ERR_INVOICE_NOT_DISPUTED)"]
        side_effects: []

      - from: OPEN
        to: RESOLVED_OVERTURNED
        trigger: "POST /invoices/{id}/resolve-dispute with outcome == OVERTURNED"
        actor: BillingClerk
        preconditions:
          - "dispute_status == OPEN (ERR_INVOICE_NOT_DISPUTED)"
          - "adjustment_cents required, > 0, <= amount_due_cents + credits_applied_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "An ADJUSTMENT line item with amount_cents == -adjustment_cents is appended; subtotal_cents and amount_due_cents recomputed (round-per-line-then-sum preserved)"
          - "payment_status recomputed: PAID when amount_due_cents == 0 (may bubble request COMPLETED -> CLOSED)"

      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with amount_cents < amount_due_cents (payment_status dimension)"
        actor: BillingClerk
        preconditions:
          - "issue_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "amount_cents > 0 AND <= amount_due_cents (ERR_PAYMENT_EXCEEDS_AMOUNT_DUE)"
        side_effects: ["payments_applied_cents += amount_cents; amount_due_cents recomputed"]

      - from: UNPAID
        to: PAID
        trigger: "POST /invoices/{id}/payments with amount_cents == amount_due_cents, or credit waterfall covering the full due"
        actor: [BillingClerk, system]
        preconditions: ["same payment preconditions when via payments endpoint"]
        side_effects:
          - "Request (COMPLETED) -> CLOSED bubble-up when this invoice belongs to a completed assignment"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "payment or credit application reducing amount_due_cents to 0"
        actor: [BillingClerk, system]
        preconditions: ["same payment preconditions when via payments endpoint"]
        side_effects: ["same CLOSED bubble-up"]

  - entity: Complaint
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /complaints/{id}/begin-review"
        actor: QualityReviewer
        preconditions: ["status == FILED (ERR_COMPLAINT_INVALID_STATE)"]
        side_effects: []

      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/adjudicate with outcome == SUBSTANTIATED"
        actor: QualityReviewer
        preconditions: ["status == UNDER_REVIEW (ERR_COMPLAINT_INVALID_STATE)"]
        side_effects:
          - "penalty_points set (MINOR 5 / MAJOR 15 / CRITICAL 30); Interpreter quality_score and quality_score_provisional recomputed"
          - "credit_pct set (default by severity or credit_pct_override); credit_amount_cents computed"
          - "CreditMemo auto-created on the org (amount = credit_amount_cents, complaint_id = this complaint) -> waterfall-applies to outstanding invoices (link 2 of cascade), which may flip an invoice payment_status to PAID and bubble its request to CLOSED (link 3+)"
          - "increments RequestingOrg.version by 1"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /complaints/{id}/adjudicate with outcome == DISMISSED"
        actor: QualityReviewer
        preconditions: ["status == UNDER_REVIEW (ERR_COMPLAINT_INVALID_STATE)"]
        side_effects: ["pending complaint leaves provisional quality scope; both quality scores recomputed"]

      - from: DISMISSED
        to: UNDER_REVIEW
        trigger: "POST /complaints/{id}/reopen"
        actor: OrgRequester
        preconditions:
          - "status == DISMISSED (ERR_COMPLAINT_INVALID_STATE)"
          - "reopen_count < 1 (ERR_COMPLAINT_ALREADY_REOPENED)"
          - "OrgRequester owns complaint.org_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["reopen_count += 1; quality scores recomputed (pending again)"]

  - entity: CreditMemo
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (waterfall application brings remaining_cents to 0)"
        actor: system
        preconditions: ["remaining_cents == 0"]
        side_effects: []

      - from: OPEN
        to: VOID
        trigger: "POST /credit-memos/{id}/void"
        actor: BillingClerk
        preconditions: ["status == OPEN (ERR_CREDIT_MEMO_NOT_OPEN)"]
        side_effects:
          - "Every application is reversed on its invoice (credits_applied_cents -= applied; amount_due_cents recomputed; payment_status recomputed, PAID may revert to PARTIALLY_PAID/UNPAID)"
          - "RequestingOrg.version += 1"

      - from: EXHAUSTED
        to: VOID
        trigger: "POST /credit-memos/{id}/void"
        actor: BillingClerk
        preconditions: ["status in {OPEN, EXHAUSTED} (ERR_CREDIT_MEMO_NOT_OPEN otherwise)"]
        side_effects: ["same reversal as OPEN -> VOID (no-op when applications empty)"]

  - entity: StrikeRecord
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    transitions:
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /strikes/{id}/rescind"
        actor: PlatformAdmin
        preconditions: ["status == ACTIVE (ERR_STRIKE_NOT_ACTIVE)"]
        side_effects:
          - "rescinded_at = now; Interpreter.active_strike_count recomputed (decrements by 1 when inside the rolling window)"
          - "NO automatic reinstatement: a SUSPENDED interpreter stays SUSPENDED until POST .../reinstate"

  - entity: RateCard
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /rate-cards/{id}/retire"
        actor: PlatformAdmin
        preconditions: ["status == ACTIVE (ERR_RATE_CARD_ALREADY_RETIRED)"]
        side_effects:
          - "Excluded from future rate-card selection; existing pinned Assignment snapshots unchanged"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-request
    parent_entity: InterpretingRequest
    write_endpoint: "POST /requests/{id}/offers"
    occ_field: expected_request_version
    description: |
      Creating an offer against an InterpretingRequest whose version has advanced
      since the client last observed it is rejected. Creating an offer legitimately
      supersedes a still-outstanding OFFERED assignment (it becomes CANCELLED by
      SYSTEM) and bumps request.version, so a client holding an older version is
      acting on a stale view of the matching state.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

  - rule_id: credit-issue-stale-org
    parent_entity: RequestingOrg
    write_endpoint: "POST /credit-memos"
    occ_field: expected_org_version
    description: |
      Creating a CreditMemo against a RequestingOrg whose version has advanced
      since the client last observed it is rejected. Memo creation waterfall-applies
      to outstanding invoices and bumps org.version, so a client holding an older
      version computed its expectation against a stale outstanding-balance view.
    error_id: ERR_STALE_ORG_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_credential_mapping
    trigger: "InterpretingRequest creation"
    algorithm: constraint_propagation
    formula: |
      required_credential_level = { LEGAL: SPECIALIST, MEDICAL: CERTIFIED,
                                    EDUCATION: CERTIFIED, GENERAL: SCREENED }[ada_context]
    input_set: "the request being created"
    constants: {}
    precision: "exact enum mapping"

  - name: rate_card_selection
    trigger: "POST /requests/{id}/offers (before estimate)"
    algorithm: weighted_scoring
    formula: |
      eligible = RateCard WHERE status == ACTIVE
                 AND modality == request.modality
                 AND ada_context == request.ada_context
                 AND credential_level == request.required_credential_level
                 AND effective_from <= now
      if eligible empty -> ERR_RATE_CARD_NOT_FOUND (404)
      winner = ORDER BY effective_from DESC, created_at ASC LIMIT 1
      (selector determinism: latest effective card wins; ties broken by earliest created_at; id never used)
    input_set: "all RateCard rows"
    constants: {}
    precision: "selector only"

  - name: estimated_cost
    trigger: "offer creation (POST /requests/{id}/offers)"
    algorithm: forward_looking
    formula: |
      sched_minutes = ceil((scheduled_end - scheduled_start) / 60 seconds)
      est_billable  = max(sched_minutes, pinned_minimum_billable_minutes)
      labor_est     = round_half_up(est_billable * pinned_hourly_rate_cents / 60)
      travel_est    = (modality == VRI) ? 0 : round_half_up(60 * pinned_travel_rate_cents_per_hour / 60)   # flat 60 estimated travel minutes, onsite only
      mileage_est   = (modality == VRI) ? 0 : round_half_up(min(estimated_mileage, MILEAGE_CAP_MILES) * pinned_mileage_rate_cents_per_mile)
      platform_est  = (modality == VRI) ? sched_minutes * pinned_vri_platform_fee_cents_per_min : 0        # estimate uses SCHEDULED minutes
      estimated_cost_cents = labor_est + travel_est + mileage_est + platform_est
    input_set: "the request + pinned rate card snapshot"
    constants:
      ESTIMATED_TRAVEL_MINUTES_ONSITE: 60
      MILEAGE_CAP_MILES: 200
    precision: "integer cents; per-component round_half_up before summing"
    variants:
      - name: provisional
        when: "at offer creation"
        difference: "uses scheduled duration, flat 60-min travel estimate and estimated_mileage; VRI platform fee uses scheduled minutes"

  - name: travel_mileage_reimbursement
    trigger: "encounter check-out finalization (invoked by final_invoice_billing) and estimated_cost (flat 60-min estimate branch)"
    algorithm: constraint_propagation
    formula: |
      # Nested-min capping with modality gating (3+ inputs, non-linear):
      travel_minutes = (modality == VRI) ? 0 : min(travel_minutes_claimed, TRAVEL_TIME_CAP_MIN)
      TRAVEL_TIME amount = round_half_up(travel_minutes * pinned_travel_rate_cents_per_hour / 60)
      miles          = (modality == VRI) ? 0 : min(mileage_claimed, MILEAGE_CAP_MILES)
      MILEAGE amount     = round_half_up(miles * pinned_mileage_rate_cents_per_mile)
      # Mode (a) combinatorial: modality gate + two independent min() caps + per-line rounding.
    input_set: "assignment claims + pinned snapshot + modality"
    constants:
      TRAVEL_TIME_CAP_MIN: 240
      MILEAGE_CAP_MILES: 200
    precision: "integer cents; round_half_up per component"

  - name: final_invoice_billing
    trigger: "POST /invoices/generate (encounter-based) or requester cancel from CONFIRMED (fee-only)"
    algorithm: chronological
    formula: |
      # Encounter-based invoice:
      actual_minutes   = encounter.actual_minutes  (or recomputed from corrected times)
      billable_minutes = max(actual_minutes, pinned_minimum_billable_minutes)
      LABOR:        quantity = billable_minutes
                    amount   = round_half_up(billable_minutes * pinned_hourly_rate_cents / 60)
      TRAVEL_TIME / MILEAGE: per calculations.travel_mileage_reimbursement (capped components)
      PLATFORM_FEE: (VRI only) amount = actual_minutes * pinned_vri_platform_fee_cents_per_min
                    # TRAP: platform fee uses ACTUAL minutes, NOT billable_minutes
      Zero-amount lines are OMITTED from line_items (LABOR always present; PLATFORM_FEE present whenever amount > 0).
      subtotal_cents = SUM of the per-line rounded amount_cents values
      # PINNED ROUNDING ORDER (mode b): round each line to integer cents FIRST, then sum.
      #   sum-then-round of the same inputs can differ by cents; this scaffold pins round-per-line-then-sum.
      # Cancellation-fee-only invoice: single CANCELLATION_FEE line = assignment.cancellation_fee_cents.
      amount_due_cents = max(0, subtotal_cents - credits_applied_cents - payments_applied_cents)
    input_set: "the verified Encounter + pinned Assignment snapshot + claims"
    constants: {}
    precision: "integer cents; round_half_up per line; sum of rounded lines"
    variants:
      - name: final
        when: "after encounter verify / at cancellation"
        difference: "uses actual times and claimed travel/mileage with caps; diverges from provisional estimate whenever actuals differ from schedule/estimates"

  - name: cancellation_fee
    trigger: "POST /assignments/{id}/cancel and POST /requests/{id}/cancel from ACCEPTED/CONFIRMED/EN_ROUTE states"
    algorithm: threshold
    formula: |
      notice_seconds     = scheduled_start - now   (exact seconds, no float hours)
      minimum_charge     = round_half_up(pinned_minimum_billable_minutes * pinned_hourly_rate_cents / 60)
      if notice_seconds >= pinned_cancel_full_refund_notice_hours * 3600:    fee = 0
      elif notice_seconds >= pinned_cancel_partial_notice_hours * 3600:      fee = round_half_up(pinned_late_cancel_fee_pct * minimum_charge)
      else:                                                                   fee = minimum_charge
      # Boundary precision: exactly 48h notice -> 0 (>=, inclusive); exactly 24h -> partial fee; 23:59:59 -> full minimum charge.
    input_set: "the assignment being cancelled + pinned snapshot + logical now"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: strike_rolling_window_count
    trigger: "StrikeRecord create (mark-no-show or POST /strikes) and rescind"
    algorithm: threshold
    formula: |
      window_start = now - 365 days
      active_strike_count = COUNT(StrikeRecord WHERE interpreter_id == X
                                  AND status == ACTIVE
                                  AND occurred_at >= window_start)   # inclusive: a strike exactly 365 days old still counts
      if active_strike_count >= STRIKE_SUSPENSION_THRESHOLD and interpreter.status == ACTIVE:
          interpreter.status = SUSPENDED  (+ suspension cascade per state machine)
    input_set: "all StrikeRecord rows of the interpreter"
    constants:
      STRIKE_WINDOW_DAYS: 365
      STRIKE_SUSPENSION_THRESHOLD: 3
    precision: "exact integer count; inclusive >= boundary on both window edge and threshold"

  - name: quality_score_aggregation
    trigger: "complaint file, adjudicate, reopen"
    algorithm: weighted_scoring
    formula: |
      penalty(severity) = { MINOR: 5, MAJOR: 15, CRITICAL: 30 }
      quality_score             = max(0, 100 - SUM(penalty over complaints with status == SUBSTANTIATED))
      quality_score_provisional = max(0, 100 - SUM(penalty over complaints with status in {FILED, UNDER_REVIEW, SUBSTANTIATED}))
    input_set: "all Complaints with interpreter_id == X"
    constants:
      PENALTY_MINOR: 5
      PENALTY_MAJOR: 15
      PENALTY_CRITICAL: 30
      QUALITY_FLOOR: 0
      QUALITY_OFFER_GATE: 40
    precision: "integer; floor at 0; ceiling 100 by construction"
    variants:
      - name: provisional
        when: "gating/reporting contexts that assume worst on pending complaints"
        difference: "includes FILED and UNDER_REVIEW complaints; final variant excludes them, so a single pending CRITICAL complaint splits the two scores by 30 points"

  - name: credit_waterfall_allocation
    trigger: "CreditMemo creation (manual or adjudication-driven)"
    algorithm: waterfall_allocation
    formula: |
      eligible = Invoice WHERE org_id == memo.org_id
                 AND issue_status == ISSUED AND payment_status != PAID
      order: issued_at ASC, tie-break created_at ASC   (id never used)
      remaining = memo.amount_cents
      for each invoice in order while remaining > 0:
          applied = min(remaining, invoice.amount_due_cents)
          invoice.credits_applied_cents += applied; amount_due_cents recomputed
          if amount_due_cents == 0: payment_status = PAID (request CLOSED bubble-up)
          elif payments_applied_cents > 0 or credits_applied_cents > 0: payment_status stays/→ PARTIALLY_PAID when 0 < amount_due < subtotal
          memo.applications.append({invoice_id, amount_cents: applied}); remaining -= applied
      memo.remaining_cents = remaining; status = EXHAUSTED when remaining == 0
    input_set: "org's invoices at memo creation time"
    constants: {}
    precision: "integer cents; partial application to the oldest invoice only when memo is smaller than its due"

  - name: availability_coverage_check
    trigger: "offer creation eligibility"
    algorithm: interval_merge
    formula: |
      windows = AvailabilityWindow WHERE interpreter_id == X AND request.modality IN modalities
      merge windows as half-open [start_at, end_at) intervals
      require: merged union fully covers [request.scheduled_start, request.scheduled_end)
      gap or missing coverage -> ERR_NO_AVAILABILITY_COVERAGE
    input_set: "the interpreter's availability windows"
    constants: {}
    precision: "half-open intervals: a window ending exactly at scheduled_start does NOT cover; one ending exactly at scheduled_end DOES cover the tail"

  - name: double_booking_buffer_check
    trigger: "POST /assignments/{id}/confirm"
    algorithm: interval_merge
    formula: |
      for each OTHER assignment of the same interpreter with status in {CONFIRMED, EN_ROUTE, ON_SITE}:
          buffered_other = [other.scheduled_start - 30min, other.scheduled_end + 30min)
          buffered_new   = [new.scheduled_start  - 30min, new.scheduled_end  + 30min)
          conflict iff buffered_new.start < buffered_other.end AND buffered_new.end > buffered_other.start
      any conflict -> ERR_INTERPRETER_DOUBLE_BOOKED
      # Half-open on BUFFERED intervals: a new assignment starting exactly 30 min after the other's end is ALLOWED.
    input_set: "interpreter's active assignments"
    constants:
      TRAVEL_BUFFER_MIN: 30
    precision: "half-open buffered intervals"

  - name: vri_capacity_check
    trigger: "POST /assignments/{id}/confirm when request.modality == VRI"
    algorithm: interval_merge
    formula: |
      overlapping = COUNT(Assignment A JOIN request R WHERE R.modality == VRI
                          AND A.status in {CONFIRMED, EN_ROUTE, ON_SITE}
                          AND A.request.scheduled_start < new.scheduled_end
                          AND A.request.scheduled_end   > new.scheduled_start)   # half-open overlap
      if overlapping >= VRI_MAX_CONCURRENT_SESSIONS -> ERR_VRI_CAPACITY_EXCEEDED
      # Aggregate-capacity semantics: 3 overlapping VRI sessions allowed; the 4th is rejected.
    input_set: "all VRI assignments platform-wide"
    constants:
      VRI_MAX_CONCURRENT_SESSIONS: 3
    precision: "half-open overlap; >= boundary at capacity 3"

  - name: org_outstanding_balance
    trigger: "read of RequestingOrg; fiscal gates at offer/confirm"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = SUM(amount_due_cents) OVER Invoice
        WHERE org_id == X AND issue_status == ISSUED AND payment_status != PAID
      fiscal gate at offer/confirm: outstanding_balance_cents + estimated_cost_cents <= credit_limit_cents
      (equality allowed; strictly greater rejects with ERR_CREDIT_LIMIT_EXCEEDED)
    input_set: "org's invoices"
    constants: {}
    precision: "integer cents; read-time recompute (immediate consistency)"

  - name: report_metrics
    trigger: "POST /reports/generate"
    algorithm: aggregation
    formula: |
      scope = requests (org-scoped when org_id given, else all) with scheduled_start IN [window_start, window_end)   # half-open
      total_requests   = COUNT(scope)
      filled_count     = COUNT(scope status in {CONFIRMED, IN_PROGRESS, COMPLETED, CLOSED})
      unfilled_count   = COUNT(scope status == UNFILLED); cancelled_count = COUNT(scope status == CANCELLED)
      fulfillment_rate = round_half_up(filled_count / (total_requests - cancelled_count), 4) or 0.0 when denominator == 0
      no_show_count    = COUNT(assignments of scope requests with status == NO_SHOW)
      avg_response_minutes = round_half_up(MEAN((accepted_at - offered_at)/60s) over assignments with accepted_at set AND offered_at in window, 2) or 0.0
      total_billed_cents   = SUM(subtotal_cents) over invoices (scope org) with issue_status == ISSUED AND issued_at in [window_start, window_end)
      complaint_count / substantiated_count: complaints (scope org) with created_at in window; substantiated subset
      ada_context_mix  = per-context counts over scope
    input_set: "requests/assignments/invoices/complaints in window"
    constants: {}
    precision: "rates round_half_up to 4 decimals; minutes to 2; cents exact integers"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: business_constraint
    check: "Request schema: required fields present, types valid, enum values in domain, unknown fields rejected, numeric ranges (amount_cents > 0, claims >= 0, end > start). Conditional required: onsite_address when modality in {ASL_ONSITE, CART_ONSITE}."
    error_id: "ERR_INVALID_REQUEST | ERR_ONSITE_ADDRESS_REQUIRED"
    http_status: 400
    applies_to: all endpoints with a body

  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "Entity-backed ownership: OrgRequester X-User-ID == resource org_id (payload or owning request/invoice/complaint/encounter); Interpreter X-User-ID == assignment.interpreter_id or path interpreterId (self-scope)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "ownership-scoped endpoints (requests create/submit/cancel, assignment accept/decline/depart/check-in/check-out/cancel, certifications create as Interpreter, availability create/delete, encounter verify, invoice dispute, complaint create/reopen)"

  - priority: 5
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right; FK targets must exist (interpreter_id on offer, assignment_id on generate/complaints, org_id, invoice_id in dispute target, complaint_id on manual memo when supplied, strike id on rescind)"
    error_id: "ERR_ORG_NOT_FOUND | ERR_RATE_CARD_NOT_FOUND | ERR_INTERPRETER_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_AVAILABILITY_WINDOW_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_CREDIT_MEMO_NOT_FOUND | ERR_STRIKE_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 6
    category: state
    check: "OCC stale version: expected_request_version == request.version on POST /requests/{id}/offers; expected_org_version == org.version on POST /credit-memos"
    error_id: "ERR_STALE_REQUEST_VERSION | ERR_STALE_ORG_VERSION"
    http_status: 412
    applies_to: "POST /requests/{id}/offers, POST /credit-memos"

  - priority: 7
    category: state
    check: "Parent/referenced entity posture: org ACTIVE for request submit/cancel/verify/dispute/complaint filing (ERR_ORG_NOT_ACTIVE); interpreter ACTIVE for offer/accept (ERR_INTERPRETER_NOT_ACTIVE)"
    error_id: "ERR_ORG_NOT_ACTIVE | ERR_INTERPRETER_NOT_ACTIVE"
    http_status: 409
    applies_to: "submit/cancel request, verify, dispute, complaint create, offer create, accept"

  - priority: 8
    category: state
    check: "Resource from-state preconditions per §1.2 (request DRAFT for submit; cancellable states; offerable states; assignment OFFERED/ACCEPTED/CONFIRMED/ON_SITE; encounter unverified; invoice DRAFT/ISSUED/OPEN-dispute; complaint FILED/UNDER_REVIEW; credit memo OPEN/EXHAUSTED; strike ACTIVE; rate card ACTIVE)"
    error_id: "ERR_REQUEST_NOT_DRAFT | ERR_REQUEST_NOT_CANCELLABLE | ERR_REQUEST_NOT_OFFERABLE | ERR_ASSIGNMENT_NOT_OFFERED | ERR_ASSIGNMENT_NOT_ACCEPTED | ERR_ASSIGNMENT_NOT_CONFIRMED | ERR_ASSIGNMENT_NOT_ON_SITE | ERR_ENCOUNTER_ALREADY_VERIFIED | ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_NOT_ISSUED | ERR_INVOICE_NOT_DISPUTED | ERR_COMPLAINT_INVALID_STATE | ERR_COMPLAINT_ALREADY_REOPENED | ERR_CREDIT_MEMO_NOT_OPEN | ERR_STRIKE_NOT_ACTIVE | ERR_RATE_CARD_ALREADY_RETIRED | ERR_ACTIVE_STRIKES_AT_LIMIT"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 9
    category: business_safety
    check: "ADA credential/match gate on offer, in this sub-order: (1) modality in interpreter.modalities_offered (ERR_MODALITY_NOT_OFFERED); (2) VRI requires vri_platform_certified (ERR_VRI_CERTIFICATION_REQUIRED); (3) verified Certification with level >= required_credential_level AND expires_on >= scheduled_start (ERR_CREDENTIAL_INSUFFICIENT); (4) quality_score >= 40 (ERR_QUALITY_BELOW_THRESHOLD)"
    error_id: "ERR_MODALITY_NOT_OFFERED | ERR_VRI_CERTIFICATION_REQUIRED | ERR_CREDENTIAL_INSUFFICIENT | ERR_QUALITY_BELOW_THRESHOLD"
    http_status: 422
    applies_to: "POST /requests/{id}/offers (ERR_CREDENTIAL_INSUFFICIENT also on interpreter activate)"

  - priority: 10
    category: business_temporal
    check: "Temporal rules: submit lead time >= 2h and end > start (ERR_INVALID_SCHEDULE); check-in window [scheduled_start - 30min, scheduled_end] (ERR_CHECK_IN_WINDOW_VIOLATION); mark-no-show grace now >= scheduled_start + 15min (ERR_NO_SHOW_TOO_EARLY); strike occurred_at <= now (ERR_INVALID_REQUEST)"
    error_id: "ERR_INVALID_SCHEDULE | ERR_CHECK_IN_WINDOW_VIOLATION | ERR_NO_SHOW_TOO_EARLY"
    http_status: 422
    applies_to: "submit, check-in, mark-no-show, POST /strikes"

  - priority: 11
    category: business_constraint
    check: "Structural constraints: offer_attempt_count < 3 (ERR_MAX_OFFER_ATTEMPTS_REACHED); availability coverage (ERR_NO_AVAILABILITY_COVERAGE); availability window half-open overlap (ERR_AVAILABILITY_WINDOW_OVERLAP); buffered double-booking at confirm (ERR_INTERPRETER_DOUBLE_BOOKED); VRI aggregate capacity at confirm (ERR_VRI_CAPACITY_EXCEEDED); one invoice per assignment (ERR_INVOICE_ALREADY_EXISTS); assignment COMPLETED before generate (ERR_INVALID_REQUEST) and encounter verified (ERR_ENCOUNTER_NOT_VERIFIED); complaint requires assignment COMPLETED or NO_SHOW (ERR_COMPLAINT_INVALID_STATE)"
    error_id: "ERR_MAX_OFFER_ATTEMPTS_REACHED | ERR_NO_AVAILABILITY_COVERAGE | ERR_AVAILABILITY_WINDOW_OVERLAP | ERR_INTERPRETER_DOUBLE_BOOKED | ERR_VRI_CAPACITY_EXCEEDED | ERR_INVOICE_ALREADY_EXISTS | ERR_ENCOUNTER_NOT_VERIFIED"
    http_status: 409
    applies_to: "offers, availability-windows, confirm, invoices/generate, complaints"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates LAST: outstanding + estimate <= credit_limit at offer/confirm (ERR_CREDIT_LIMIT_EXCEEDED, 402); payment amount_cents <= amount_due_cents (ERR_PAYMENT_EXCEEDS_AMOUNT_DUE)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_EXCEEDS_AMOUNT_DUE"
    http_status: 402
    applies_to: "offers, confirm, payments"

# =============================================================================
# 1.5 API Endpoint Table (67 endpoints)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock. Setting the clock runs the deferred sweep in order: (1) expire OFFERED assignments past response_deadline (request -> MATCHING/UNFILLED), (2) auto-verify Encounters at/past verify_deadline (verified_by SYSTEM; may bubble request IN_PROGRESS -> COMPLETED), (3) mark MATCHING/OFFERED requests UNFILLED at/past scheduled_start (outstanding offer -> EXPIRED)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_offer_count: integer, auto_verified_encounter_count: integer, unfilled_request_count: integer }"
    side_effects: ["deferred sweeps (offer expiry, encounter auto-verify, UNFILLED)"]

  # --- RequestingOrg ---
  - method: POST
    path: "/orgs"
    description: "Create a requesting organization"
    roles: [PlatformAdmin]
    code: 201
    input: [name, org_type, credit_limit_cents]
    output: RequestingOrg
    side_effects: ["status ACTIVE, version 1"]

  - method: GET
    path: "/orgs/{id}"
    description: "Get an org (outstanding_balance_cents recomputed on read)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: RequestingOrg
    side_effects: []

  - method: POST
    path: "/orgs/{id}/suspend"
    description: "Suspend an org (credit hold); blocks org write actions"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RequestingOrg
    side_effects: ["status -> SUSPENDED; version += 1"]

  - method: POST
    path: "/orgs/{id}/reinstate"
    description: "Reinstate a suspended org"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RequestingOrg
    side_effects: ["status -> ACTIVE; version += 1"]

  - method: GET
    path: "/orgs/{id}/complaints"
    description: "List complaints filed by an org (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/orgs/{id}/credit-memos"
    description: "List credit memos of an org (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CreditMemo[]"
    side_effects: []

  # --- RateCard ---
  - method: POST
    path: "/rate-cards"
    description: "Create a rate card (one row per modality x ada_context x credential_level)"
    roles: [PlatformAdmin]
    code: 201
    input: [modality, ada_context, credential_level, hourly_rate_cents, minimum_billable_minutes, travel_rate_cents_per_hour, mileage_rate_cents_per_mile, vri_platform_fee_cents_per_min, cancel_full_refund_notice_hours, cancel_partial_notice_hours, late_cancel_fee_pct, effective_from]
    output: RateCard
    side_effects: ["status ACTIVE, version 1"]

  - method: GET
    path: "/rate-cards/{id}"
    description: "Get a rate card"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: POST
    path: "/rate-cards/{id}/retire"
    description: "Retire a rate card; pinned assignment snapshots are unaffected"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RateCard
    side_effects: ["status -> RETIRED; version += 1"]

  # --- Interpreter ---
  - method: POST
    path: "/interpreters"
    description: "Create an interpreter profile (PENDING_ONBOARD)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, modalities_offered, home_zip, "vri_platform_certified?"]
    output: Interpreter
    side_effects: ["quality scores 100, active_strike_count 0"]

  - method: GET
    path: "/interpreters/{id}"
    description: "Get an interpreter (quality scores and active_strike_count recomputed on read)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: Interpreter
    side_effects: []

  - method: POST
    path: "/interpreters/{id}/activate"
    description: "Activate an interpreter; requires >= 1 verified certification"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Interpreter
    side_effects: ["status -> ACTIVE; version += 1"]

  - method: POST
    path: "/interpreters/{id}/suspend"
    description: "Manually suspend an interpreter; cascades to non-terminal assignments"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Interpreter
    side_effects: ["status -> SUSPENDED; OFFERED/ACCEPTED/CONFIRMED assignments -> CANCELLED (SYSTEM); their requests -> MATCHING/UNFILLED; version += 1"]

  - method: POST
    path: "/interpreters/{id}/reinstate"
    description: "Reinstate a suspended interpreter; requires active_strike_count < 3"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Interpreter
    side_effects: ["status -> ACTIVE; version += 1"]

  - method: POST
    path: "/interpreters/{id}/certifications"
    description: "Submit a certification (Interpreter self or PlatformAdmin); created unverified"
    roles: [PlatformAdmin, Interpreter]
    code: 201
    input: [credential, level, issued_on, expires_on]
    output: Certification
    side_effects: ["verified = false"]

  - method: GET
    path: "/interpreters/{id}/certifications"
    description: "List an interpreter's certifications"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Certification[]"
    side_effects: []

  - method: POST
    path: "/interpreters/{id}/certifications/{certId}/verify"
    description: "Verify a certification"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["verified = true"]

  - method: POST
    path: "/interpreters/{id}/availability-windows"
    description: "Create an availability window (self); half-open overlap with existing windows rejected"
    roles: [Interpreter]
    code: 201
    input: [start_at, end_at, modalities]
    output: AvailabilityWindow
    side_effects: []

  - method: GET
    path: "/interpreters/{id}/availability-windows"
    description: "List availability windows"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "AvailabilityWindow[]"
    side_effects: []

  - method: DELETE
    path: "/interpreters/{id}/availability-windows/{windowId}"
    description: "Delete an availability window (self); deleted windows no longer count for overlap or coverage"
    roles: [Interpreter]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: GET
    path: "/interpreters/{id}/strikes"
    description: "List an interpreter's strike records (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "StrikeRecord[]"
    side_effects: []

  - method: GET
    path: "/interpreters/{id}/complaints"
    description: "List complaints against an interpreter (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Complaint[]"
    side_effects: []

  # --- InterpretingRequest ---
  - method: POST
    path: "/requests"
    description: "Create an interpreting request (DRAFT); onsite_address required for onsite modalities"
    roles: [OrgRequester]
    code: 201
    input: [org_id, consumer_name, modality, scheduled_start, scheduled_end, "ada_context?", "onsite_address?", "estimated_mileage?"]
    output: InterpretingRequest
    side_effects: ["required_credential_level computed; status DRAFT; version 1"]

  - method: GET
    path: "/requests"
    description: "List requests with filters + pagination (FK reverse reachability for org_id)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["org_id?", "status?", "modality?", "ada_context?", "limit?", "offset?"]
    output: "InterpretingRequest[]"
    side_effects: []

  - method: GET
    path: "/requests/{id}"
    description: "Get a request"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: InterpretingRequest
    side_effects: []

  - method: POST
    path: "/requests/{id}/submit"
    description: "Submit a DRAFT request for matching"
    roles: [OrgRequester]
    code: 200
    input: []
    output: InterpretingRequest
    side_effects: ["status DRAFT -> MATCHING; version += 1"]

  - method: POST
    path: "/requests/{id}/cancel"
    description: "Cancel a request; from CONFIRMED computes tiered fee and may create a fee-only DRAFT invoice"
    roles: [OrgRequester, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: InterpretingRequest
    side_effects: ["status -> CANCELLED; assignment cascade; cancellation_fee_cents; fee-only Invoice when fee > 0; version += 1"]

  - method: POST
    path: "/requests/{id}/offers"
    description: "Create an assignment offer (OCC on request version; supersedes an outstanding OFFERED assignment)"
    roles: [PlatformAdmin]
    code: 201
    input: [interpreter_id, expected_request_version]
    output: Assignment
    side_effects: ["rate card selected + snapshot pinned; estimated_cost_cents computed; offer_attempt_count += 1; request MATCHING/OFFERED -> OFFERED; increments InterpretingRequest.version by 1; superseded offer -> CANCELLED (SYSTEM)"]

  - method: GET
    path: "/requests/{id}/offers"
    description: "List assignments (offers) for a request (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Assignment[]"
    side_effects: []

  # --- Assignment ---
  - method: GET
    path: "/assignments"
    description: "List assignments with filters (FK reverse reachability for interpreter_id / rate_card_id)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["request_id?", "interpreter_id?", "rate_card_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Interpreter accepts an offer (before response_deadline)"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> ACCEPTED; accepted_at set"]

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Interpreter declines an offer; request returns to MATCHING or goes UNFILLED"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> DECLINED; request OFFERED -> MATCHING (<3 attempts) else UNFILLED"]

  - method: POST
    path: "/assignments/{id}/confirm"
    description: "PlatformAdmin confirms an accepted assignment (double-booking, VRI capacity, fiscal re-check)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> CONFIRMED; request OFFERED -> CONFIRMED"]

  - method: POST
    path: "/assignments/{id}/depart"
    description: "Interpreter departs (onsite modalities only)"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status CONFIRMED -> EN_ROUTE"]

  - method: POST
    path: "/assignments/{id}/check-in"
    description: "Interpreter checks in within [scheduled_start - 30min, scheduled_end]; creates the Encounter"
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> ON_SITE; Encounter created (actual_start = now); request -> IN_PROGRESS"]

  - method: POST
    path: "/assignments/{id}/check-out"
    description: "Interpreter checks out with travel/mileage claims; computes billable minutes"
    roles: [Interpreter]
    code: 200
    input: ["travel_minutes_claimed?", "mileage_claimed?"]
    output: Assignment
    side_effects: ["status -> COMPLETED; encounter actual_end/actual_minutes/billable_minutes/verify_deadline set"]

  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Cancel an ACCEPTED/CONFIRMED/EN_ROUTE assignment with tiered fee; REQUESTER cancel also cancels the request"
    roles: [OrgRequester, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects: ["status -> CANCELLED; cancellation_fee_cents computed; request -> CANCELLED (REQUESTER, fee invoice when fee > 0) or MATCHING/UNFILLED (PLATFORM)"]

  - method: POST
    path: "/assignments/{id}/mark-no-show"
    description: "Mark interpreter no-show after grace; creates strike and may auto-suspend (depth-4 cascade)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> NO_SHOW; StrikeRecord created; strike count recompute; >= 3 -> SUSPENDED + suspension cascade; request -> MATCHING/UNFILLED"]

  - method: GET
    path: "/assignments/{id}/encounters"
    description: "Get the encounter for an assignment (array of 0-1; FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/invoices"
    description: "Get invoices for an assignment (array of 0-1; FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/complaints"
    description: "List complaints for an assignment (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/strikes"
    description: "List strikes linked to an assignment (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: "StrikeRecord[]"
    side_effects: []

  # --- Encounter ---
  - method: POST
    path: "/encounters/{id}/verify"
    description: "Requester verifies (optionally with corrected times); bubbles request to COMPLETED"
    roles: [OrgRequester]
    code: 200
    input: ["corrected_start?", "corrected_end?"]
    output: Encounter
    side_effects: ["verified = true; verified_by ORG; corrections recompute actual/billable minutes; request IN_PROGRESS -> COMPLETED"]

  # --- Invoice ---
  - method: POST
    path: "/invoices/generate"
    description: "Generate a DRAFT invoice for a COMPLETED assignment whose encounter is verified"
    roles: [BillingClerk]
    code: 201
    input: [assignment_id]
    output: Invoice
    side_effects: ["line items computed per final_invoice_billing; subtotal/amount_due set"]

  - method: GET
    path: "/invoices"
    description: "List invoices with filters (FK reverse reachability for org_id / encounter_id)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["org_id?", "encounter_id?", "issue_status?", "payment_status?", "dispute_status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice (sets issued_at; enters waterfall + outstanding balance)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["issue_status -> ISSUED; issued_at = now"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a DRAFT or unpaid/non-disputed ISSUED invoice; reverses credit applications"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["issue_status -> VOID; credit memo applications reversed"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Org disputes an ISSUED invoice (dispute_status NONE -> OPEN)"
    roles: [OrgRequester]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["dispute_status -> OPEN; dispute_reason recorded"]

  - method: POST
    path: "/invoices/{id}/resolve-dispute"
    description: "BillingClerk resolves an OPEN dispute; OVERTURNED appends a negative ADJUSTMENT line"
    roles: [BillingClerk]
    code: 200
    input: [outcome, "adjustment_cents?"]
    output: Invoice
    side_effects: ["dispute_status -> RESOLVED_UPHELD | RESOLVED_OVERTURNED; adjustment line + recompute on OVERTURNED; may flip payment_status to PAID and bubble request to CLOSED"]

  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record a payment (partial allowed; capped at amount_due_cents)"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["payments_applied_cents += amount; amount_due recomputed; payment_status -> PARTIALLY_PAID | PAID; PAID bubbles request -> CLOSED"]

  # --- Complaint ---
  - method: POST
    path: "/complaints"
    description: "File a complaint against a COMPLETED or NO_SHOW assignment"
    roles: [OrgRequester]
    code: 201
    input: [org_id, assignment_id, category, severity, narrative]
    output: Complaint
    side_effects: ["status FILED; interpreter_id denormalized; provisional quality score recomputed"]

  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{id}/begin-review"
    description: "QualityReviewer opens review"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/complaints/{id}/adjudicate"
    description: "QualityReviewer substantiates or dismisses; SUBSTANTIATED cascades to quality score + credit memo + waterfall"
    roles: [QualityReviewer]
    code: 200
    input: [outcome, "credit_pct_override?"]
    output: Complaint
    side_effects: ["status -> SUBSTANTIATED | DISMISSED; penalty points; auto CreditMemo + waterfall on SUBSTANTIATED; org.version += 1 on SUBSTANTIATED"]

  - method: POST
    path: "/complaints/{id}/reopen"
    description: "Org reopens a DISMISSED complaint (once)"
    roles: [OrgRequester]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status DISMISSED -> UNDER_REVIEW; reopen_count += 1"]

  - method: GET
    path: "/complaints/{id}/credit-memos"
    description: "List credit memos originating from a complaint (FK reverse reachability)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: "CreditMemo[]"
    side_effects: []

  # --- CreditMemo ---
  - method: POST
    path: "/credit-memos"
    description: "Create a manual credit memo (OCC on org version); waterfall-applies to outstanding invoices"
    roles: [QualityReviewer, BillingClerk]
    code: 201
    input: [org_id, amount_cents, expected_org_version, "complaint_id?"]
    output: CreditMemo
    side_effects: ["waterfall allocation to org's ISSUED unpaid invoices; increments RequestingOrg.version by 1"]

  - method: GET
    path: "/credit-memos/{id}"
    description: "Get a credit memo (including applications array)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []

  - method: POST
    path: "/credit-memos/{id}/void"
    description: "Void an OPEN/EXHAUSTED memo; reverses every application (compensating action)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["status -> VOID; invoice credits/due/payment_status recomputed; org.version += 1"]

  # --- StrikeRecord ---
  - method: POST
    path: "/strikes"
    description: "Manually record a documented no-show strike (assignment_id optional); may auto-suspend at 3 rolling strikes"
    roles: [PlatformAdmin]
    code: 201
    input: [interpreter_id, occurred_at, "assignment_id?"]
    output: StrikeRecord
    side_effects: ["active_strike_count recompute; >= 3 -> interpreter SUSPENDED + cascade"]

  - method: POST
    path: "/strikes/{id}/rescind"
    description: "Rescind an ACTIVE strike (compensating action); no automatic reinstatement"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StrikeRecord
    side_effects: ["status -> RESCINDED; active_strike_count recompute"]

  # --- ReportingSnapshot ---
  - method: POST
    path: "/reports/generate"
    description: "Generate a compliance/utilization snapshot over [window_start, window_end) for one org or platform-wide"
    roles: [PlatformAdmin]
    code: 201
    input: [window_start, window_end, "org_id?"]
    output: ReportingSnapshot
    side_effects: ["all metrics computed per calculations.report_metrics"]

  - method: GET
    path: "/reports"
    description: "List snapshots (FK reverse reachability for org_id)"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: "ReportingSnapshot[]"
    side_effects: []

  - method: GET
    path: "/reports/{id}"
    description: "Get a snapshot"
    roles: [Any, PlatformAdmin, OrgRequester, Interpreter, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: ReportingSnapshot
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / input ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/unknown/malformed field, bad enum value, range violation (amount_cents <= 0, negative claims, end <= start), VRI depart attempt, re-dispute when dispute_status != NONE, void of paid/disputed invoice, missing adjustment_cents on OVERTURNED, strike occurred_at in the future" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed actor does not own the target resource (wrong org_id or interpreter_id)" }

  # --- Existence ---
  - { id: ERR_ORG_NOT_FOUND, http: 404, condition: "org id does not exist" }
  - { id: ERR_RATE_CARD_NOT_FOUND, http: 404, condition: "rate card id does not exist, OR no ACTIVE card matches (modality, ada_context, required credential level) with effective_from <= now at offer time" }
  - { id: ERR_INTERPRETER_NOT_FOUND, http: 404, condition: "interpreter id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id does not exist under the interpreter" }
  - { id: ERR_AVAILABILITY_WINDOW_NOT_FOUND, http: 404, condition: "availability window id does not exist under the interpreter" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "request id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not exist" }
  - { id: ERR_ENCOUNTER_NOT_FOUND, http: 404, condition: "encounter id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaint id does not exist" }
  - { id: ERR_CREDIT_MEMO_NOT_FOUND, http: 404, condition: "credit memo id does not exist" }
  - { id: ERR_STRIKE_NOT_FOUND, http: 404, condition: "strike id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report snapshot id does not exist" }

  # --- State ---
  - { id: ERR_ORG_NOT_ACTIVE, http: 409, condition: "Org write action while RequestingOrg.status == SUSPENDED" }
  - { id: ERR_INTERPRETER_NOT_ACTIVE, http: 409, condition: "Offer/accept requires Interpreter.status == ACTIVE" }
  - { id: ERR_RATE_CARD_ALREADY_RETIRED, http: 409, condition: "Retire on an already-RETIRED rate card" }
  - { id: ERR_REQUEST_NOT_DRAFT, http: 409, condition: "submit requires request.status == DRAFT" }
  - { id: ERR_REQUEST_NOT_CANCELLABLE, http: 409, condition: "cancel requires status in {DRAFT, MATCHING, OFFERED, CONFIRMED}" }
  - { id: ERR_REQUEST_NOT_OFFERABLE, http: 409, condition: "offer requires status in {MATCHING, OFFERED}" }
  - { id: ERR_MAX_OFFER_ATTEMPTS_REACHED, http: 409, condition: "offer attempted when offer_attempt_count >= 3" }
  - { id: ERR_ASSIGNMENT_NOT_OFFERED, http: 409, condition: "accept/decline requires OFFERED (also when the offer has expired at/after response_deadline)" }
  - { id: ERR_ASSIGNMENT_NOT_ACCEPTED, http: 409, condition: "confirm requires ACCEPTED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMED, http: 409, condition: "depart/check-in require CONFIRMED (or EN_ROUTE for onsite check-in); mark-no-show requires CONFIRMED or EN_ROUTE" }
  - { id: ERR_ASSIGNMENT_NOT_ON_SITE, http: 409, condition: "check-out requires ON_SITE" }
  - { id: ERR_ENCOUNTER_ALREADY_VERIFIED, http: 409, condition: "verify on an already-verified encounter" }
  - { id: ERR_ENCOUNTER_NOT_VERIFIED, http: 409, condition: "invoice generate while encounter.verified == false" }
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "issue requires issue_status == DRAFT" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "dispute/void/payment require issue_status == ISSUED" }
  - { id: ERR_INVOICE_NOT_DISPUTED, http: 409, condition: "resolve-dispute requires dispute_status == OPEN" }
  - { id: ERR_COMPLAINT_INVALID_STATE, http: 409, condition: "begin-review requires FILED; adjudicate requires UNDER_REVIEW; reopen requires DISMISSED; filing requires assignment COMPLETED or NO_SHOW" }
  - { id: ERR_COMPLAINT_ALREADY_REOPENED, http: 409, condition: "reopen when reopen_count >= 1" }
  - { id: ERR_CREDIT_MEMO_NOT_OPEN, http: 409, condition: "void requires status in {OPEN, EXHAUSTED}" }
  - { id: ERR_STRIKE_NOT_ACTIVE, http: 409, condition: "rescind requires strike status == ACTIVE" }
  - { id: ERR_ACTIVE_STRIKES_AT_LIMIT, http: 409, condition: "reinstate blocked while active_strike_count >= 3" }

  # --- Business safety (ADA credential/match) ---
  - { id: ERR_MODALITY_NOT_OFFERED, http: 422, condition: "Request modality not in interpreter.modalities_offered" }
  - { id: ERR_VRI_CERTIFICATION_REQUIRED, http: 422, condition: "VRI request offered to interpreter with vri_platform_certified == false" }
  - { id: ERR_CREDENTIAL_INSUFFICIENT, http: 422, condition: "No verified Certification with level >= required_credential_level and expires_on >= scheduled_start; also interpreter activate without any verified certification" }
  - { id: ERR_QUALITY_BELOW_THRESHOLD, http: 422, condition: "Offer to interpreter with quality_score < 40" }

  # --- Business temporal / constraint ---
  - { id: ERR_INVALID_SCHEDULE, http: 422, condition: "scheduled_end <= scheduled_start or scheduled_start < now + 2h at submit" }
  - { id: ERR_ONSITE_ADDRESS_REQUIRED, http: 400, condition: "modality in {ASL_ONSITE, CART_ONSITE} without onsite_address" }
  - { id: ERR_CHECK_IN_WINDOW_VIOLATION, http: 422, condition: "check-in outside [scheduled_start - 30min, scheduled_end]" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 422, condition: "mark-no-show before scheduled_start + 15min grace" }
  - { id: ERR_NO_AVAILABILITY_COVERAGE, http: 422, condition: "Interpreter's modality-matched availability windows do not fully cover [scheduled_start, scheduled_end)" }
  - { id: ERR_AVAILABILITY_WINDOW_OVERLAP, http: 409, condition: "New window overlaps an existing window of the same interpreter (half-open; touching endpoints allowed)" }
  - { id: ERR_INTERPRETER_DOUBLE_BOOKED, http: 409, condition: "Confirm would overlap another CONFIRMED/EN_ROUTE/ON_SITE assignment of the interpreter within a 30-minute travel buffer on each side" }
  - { id: ERR_VRI_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would create a 4th concurrently-overlapping VRI session platform-wide (capacity 3)" }
  - { id: ERR_INVOICE_ALREADY_EXISTS, http: 409, condition: "Second invoice generate for the same assignment" }

  # --- Fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding_balance_cents + estimated_cost_cents > credit_limit_cents at offer/confirm (equality allowed)" }
  - { id: ERR_PAYMENT_EXCEEDS_AMOUNT_DUE, http: 422, condition: "payment amount_cents > amount_due_cents" }

  # --- OCC ---
  - { id: ERR_STALE_REQUEST_VERSION, http: 412, condition: "expected_request_version != current request.version on offer creation" }
  - { id: ERR_STALE_ORG_VERSION, http: 412, condition: "expected_org_version != current org.version on credit memo creation" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: rate cards, interpreter onboarding/suspension, dispatch (offers/confirms), no-show marking, strikes, clock, reports"
    identity: opaque
    exclusive_operations:
      - "POST /orgs, POST /orgs/{id}/suspend, POST /orgs/{id}/reinstate"
      - "POST /rate-cards, POST /rate-cards/{id}/retire"
      - "POST /interpreters, POST /interpreters/{id}/activate, suspend, reinstate"
      - "POST /interpreters/{id}/certifications/{certId}/verify"
      - "POST /requests/{id}/offers"
      - "POST /assignments/{id}/confirm, POST /assignments/{id}/mark-no-show"
      - "POST /strikes, POST /strikes/{id}/rescind"
      - "POST /_clock/set_current_utc, POST /reports/generate"
    shared_operations:
      - "POST /interpreters/{id}/certifications (with Interpreter)"
      - "POST /requests/{id}/cancel, POST /assignments/{id}/cancel (with OrgRequester)"
      - "All GET endpoints (as Any)"

  - name: OrgRequester
    description: "Coordinator at a requesting organization; owns its org's requests, verifications, disputes, complaints"
    identity: "entity_backed:RequestingOrg"
    exclusive_operations:
      - "POST /requests, POST /requests/{id}/submit"
      - "POST /encounters/{id}/verify"
      - "POST /invoices/{id}/dispute"
      - "POST /complaints, POST /complaints/{id}/reopen"
    shared_operations:
      - "POST /requests/{id}/cancel, POST /assignments/{id}/cancel (with PlatformAdmin)"
      - "All GET endpoints (as Any)"

  - name: Interpreter
    description: "ASL interpreter / CART captioner; acts only on own assignments, certifications, availability"
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /assignments/{id}/accept, decline, depart, check-in, check-out"
      - "POST /interpreters/{id}/availability-windows, DELETE .../availability-windows/{windowId}"
    shared_operations:
      - "POST /interpreters/{id}/certifications (with PlatformAdmin)"
      - "All GET endpoints (as Any)"

  - name: QualityReviewer
    description: "Adjudicates complaints and issues credits; segregation of duties: cannot file complaints or settle invoices"
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/begin-review, POST /complaints/{id}/adjudicate"
    shared_operations:
      - "POST /credit-memos (with BillingClerk)"
      - "All GET endpoints (as Any)"

  - name: BillingClerk
    description: "Generates, issues, voids, and settles invoices; resolves disputes; voids credits; cannot adjudicate complaints or dispatch assignments"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/generate, issue, void, resolve-dispute, payments"
      - "POST /credit-memos/{id}/void"
    shared_operations:
      - "POST /credit-memos (with QualityReviewer)"
      - "All GET endpoints (as Any)"

  - name: Any
    description: "Any authenticated declared role may perform read operations"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
