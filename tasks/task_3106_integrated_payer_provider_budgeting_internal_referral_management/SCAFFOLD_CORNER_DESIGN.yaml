              captures: { r2: $.data.id }
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "POST /regions/${r2}/care-sites"
              payload: { site_name: "Other Medical Office", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 10.0, facility_investment_budget_cents: 2000000 }
              as: RegionalFinanceOfficer
              captures: { cs2: $.data.id }
            - call: "POST /care-sites/${cs2}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d2: $.data.id }
            - call: "POST /care-sites/${cs2}/providers"
              payload: { provider_name: "Dr Other", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 1250000, panel_size_target: 1000 }
              as: RegionalFinanceOfficer
              captures: { p2: $.data.id }
            - call: "POST /regions/${r2}/members"
              payload: { member_ref: "M-T-9", attributed_provider_id: "${p2}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m9: $.data.id, m9_v: $.data.version }
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Region A Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id }
            - call: "POST /regions/${r2}/outside-service-claims"
              payload: { member_id: "${m9}", vendor_name: "Region B Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 300000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m9_v}" }
              as: RegionalFinanceOfficer
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /regions/${r1}/outside-service-claims"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "GET /regions/${r2}/outside-service-claims"
              payload: {}
              as: RegionalFinanceOfficer
          assert:
            - "GET /regions/${r1}/outside-service-claims returns exactly 1 row, the claim ${c1}"
            - "GET /regions/${r2}/outside-service-claims returns exactly 1 row, the claim ${c2}"
            - "the two region-scoped lists share no row"
            - "GET /outside-service-claims with no filter returns both rows"

      - name: pagination_with_filtering_interacts_with_status_and_type_filters
        claim_type: Pagination with filtering
        grounds:
          - endpoints.GET_/regions/{id}/outside-service-claims
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter and page interact correctly: total_count counts the filtered set and has_more reflects the filtered remainder."
        test_recipe:
          setup:
            - "Logical clock default; one region with a provider, member, approved budget and three claims of mixed types."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Vendor One", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 100000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id }
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Vendor Two", service_code: "RADIOLOGY", claim_type: "EMERGENCY", emergency_flag: true, billed_amount_cents: 200000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "EMERGENCY", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c2: $.data.id }
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Vendor Three", service_code: "RADIOLOGY", claim_type: "EMERGENCY", emergency_flag: true, billed_amount_cents: 300000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "EMERGENCY", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /regions/${r1}/outside-service-claims"
              payload: { limit: 2, offset: 0 }
              as: RegionalFinanceOfficer
            - call: "GET /regions/${r1}/outside-service-claims"
              payload: { claim_type: "EMERGENCY", limit: 1, offset: 0 }
              as: RegionalFinanceOfficer
          assert:
            - "the unfiltered first page returns 2 rows with total_count == 3 and has_more == true"
            - "GET /regions/${r1}/outside-service-claims?limit=2&offset=2 returns 1 row with has_more == false"
            - "the claim_type filter returns total_count == 2 with has_more == true at limit 1"
            - "has_more reflects the filtered remainder rather than the unfiltered total"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_region_margin_in_the_same_response
        claim_type: immediate
        grounds:
          - endpoints.POST_/outside-service-claims/{id}/adjudicate
          - entities.Region.fields.operating_margin_cents
          - state_machines.Region.OPEN_to_RESTRICTED
        distinguishing_aspect: "Under the immediate model the region's recomputed margin and posture are visible in the very response to the mutating call, with no separate read required."
        test_recipe:
          setup:
            - "Logical clock default; one region with a site, department, provider, member and an approved budget."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
          trigger:
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Test Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id, c1_status: $.data.status }
            - call: "POST /outside-service-claims/${c1}/adjudicate"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { c1_final: $.data.final_liability_cents }
          assert:
            - "OutsideServiceClaim.${c1}.status == ADJUDICATED and final_liability_cents == 56000 in the same response"
            - "the adjudication response's claim carries its pinned liability with no follow-up read"
            - "GET /regions/${r1} immediately reports outside_services_spend_cents == 56000"

      - name: immediate_visibility_department_committed_slots_in_the_booking_response
        claim_type: immediate
        grounds:
          - endpoints.POST_/appointments
          - entities.Department.fields.appointment_slots_committed
        distinguishing_aspect: "The department's recomputed committed-slot count is written atomically with the booking, so a booking followed by a read never observes the pre-booking count."
        test_recipe:
          setup:
            - "Logical clock default; one region with a site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
            - call: "GET /departments/${d1}"
              payload: {}
              as: AccessScheduler
              captures: { committed: $.data.appointment_slots_committed }
          assert:
            - "the booking response is status 201 with fulfillment_status SCHEDULED"
            - "Department.${d1}.appointment_slots_committed == 1 immediately after the booking"
            - "no intermediate state with 0 committed slots is observable after the 201 returns"
            - "Department.status moves OPEN -> CONSTRAINED only when committed reaches the 200 budgeted slots"

  # ===========================================================================
  # Excluded corners: already exercised by a named §1.8 instance.
  # ===========================================================================
  - section: validations
    instances:

      - name: region_posture_frozen_blocks_child_mutation
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REGION_POSTURE_FROZEN
          - validations[priority=12]
        excluded_because:
          difficulty_instance: priority_state_vs_business_constraint_on_claim_adjudication
          rationale: "The FROZEN posture gate is asserted as the rejected competing error in that §1.8 priority instance."

      - name: department_capacity_exhausted_on_over_booking
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DEPARTMENT_CAPACITY_EXHAUSTED
          - validations[priority=13]
        excluded_because:
          difficulty_instance: boundary_department_supply_rejects_the_committed_plus_one_booking
          rationale: "The committed-plus-one rejection is the boundary §1.8 instance for that error."

      - name: provider_schedule_overlap_on_intersecting_slots
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PROVIDER_SCHEDULE_OVERLAP
          - validations[priority=12b]
        excluded_because:
          difficulty_instance: overlap_provider_schedule_intersection_semantics
          rationale: "The provider overlap rejection is the interval-semantics §1.8 instance for that error."

      - name: referral_not_authorized_on_specialty_booking
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REFERRAL_NOT_AUTHORIZED
          - validations[priority=8a]
        excluded_because:
          difficulty_instance: priority_business_safety_vs_business_fiscal_on_appointment_booking
          rationale: "ERR_REFERRAL_NOT_AUTHORIZED is the winning error in that §1.8 priority instance."

      - name: stale_member_version_on_transfer_create
        claim_type: Violation → Error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[transfer-create-stale-member]
        excluded_because:
          difficulty_instance: invariant_region_premium_revenue_conserved_on_transfer_cancellation
          rationale: "The transfer OCC contract is exercised through the transfer chain in that §1.8 invariant instance."

  - section: calculations
    instances:

      - name: capitation_blind_average_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.capitation_rate_cents.variants.blind_average
        excluded_because:
          difficulty_instance: dual_capitation_blind_average_vs_risk_adjusted_clamped
          rationale: "Variant divergence for capitation is the §1.8 dual-variant instance."

      - name: claim_provisional_vs_final_variant_divergence
        claim_type: Reconciliation
        grounds:
          - calculations.outside_services_liability.variants.final_deductible_chronological
        excluded_because:
          difficulty_instance: dual_claim_provisional_pct_vs_final_deductible
          rationale: "The provisional-to-final reconciliation is the §1.8 dual-variant instance."

      - name: access_wait_days_threshold_equality
        claim_type: Precision
        grounds:
          - calculations.access_wait_metric
