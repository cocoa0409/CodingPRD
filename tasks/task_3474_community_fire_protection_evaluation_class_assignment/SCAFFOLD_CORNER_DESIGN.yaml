            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-02T00:00:00Z" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/reevaluation-requests", payload: { community_id: "${c_id}", justification: "first", evidence_items: [{ doc_type: "R1", uri: "s3://a.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { rq1: $.data.id } }
          trigger:
            - { call: "POST /ppc/reevaluation-requests", payload: { community_id: "${c_id}", justification: "second", evidence_items: [{ doc_type: "R2", uri: "s3://b.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 ERR_DUPLICATE_ACTIVE_REQUEST while ${rq1} is non-terminal"

      - name: duplicate_active_appeal_returns_conflict_and_disputes_cycle
        claim_type: violation_to_error
        grounds: ["validations[priority=46]", state_machines.EvaluationCycle.PUBLISHED_to_DISPUTED]
        distinguishing_aspect: "The first appeal flips the cycle PUBLISHED -> DISPUTED; a second appeal on the same classification is rejected 409 ERR_DUPLICATE_ACTIVE_APPEAL."
        test_recipe:
          setup: ["PUBLISHED classification; one FILED appeal"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "DupAppeal", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/appeals", payload: { classification_id: "${cl1}", community_id: "${c_id}", grounds: "DATA_ERROR", evidence_items: [{ doc_type: "E1", uri: "s3://e1.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst }
            - { call: "POST /ppc/appeals", payload: { classification_id: "${cl1}", community_id: "${c_id}", grounds: "PROCEDURAL_ERROR", evidence_items: [{ doc_type: "E2", uri: "s3://e2.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "EvaluationCycle.${cy_id}.status == DISPUTED after the first appeal"
            - "second appeal returns 409 ERR_DUPLICATE_ACTIVE_APPEAL"

      - name: cycle_create_on_under_evaluation_community_returns_community_invalid_state
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_COMMUNITY_INVALID_STATE]"]
        distinguishing_aspect: "A second cycle for a community already UNDER_EVALUATION is rejected at the community state gate."
        test_recipe:
          setup: ["community with one non-terminal cycle"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "BusyTown", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator }
          trigger:
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-2", scheduled_open_date: "2027-01-01", data_freeze_date: "2027-03-01" }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 ERR_COMMUNITY_INVALID_STATE"

      - name: alternate_supply_insufficient_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=47]", "errors[ERR_ALTERNATE_SUPPLY_INSUFFICIENT]"]
        distinguishing_aspect: "verify-alternate-supply with zero shuttle capacity and zero sites is rejected 422."
        test_recipe:
          setup: ["community in FIELD_VERIFICATION; alternate fields left at defaults"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "NoAlt", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 80, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
