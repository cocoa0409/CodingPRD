            - "in all three responses data[0].id == ${s1_id}"
            - "Selection.${s1_id}.status == DRAFT"

  # =====================================================================
  # state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: suspend_active_foundry_moves_to_suspended
        claim_type: valid_transition
        grounds:
          - state_machines.Foundry.transitions.ACTIVE_to_SUSPENDED
          - endpoints["POST /foundries/{id}/suspend"]
        distinguishing_aspect: |
          The single declared Foundry transition: ACTIVE plus a suspension_reason lands on SUSPENDED,
          records the reason verbatim and bumps version to 2.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH exists and is ACTIVE with suspension_reason null."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /foundries/${f1_id}/suspend"
              payload: { suspension_reason: "failed annual alloy audit" }
              as: PlatformAdmin
          assert:
            - "HTTP status is 200"
            - "Foundry.${f1_id}.status == SUSPENDED"
            - "Foundry.${f1_id}.suspension_reason == failed annual alloy audit"
            - "Foundry.${f1_id}.version == 2"
      - name: second_suspend_on_suspended_foundry_returns_foundry_suspended
        claim_type: idempotency
        grounds:
          - validations[priority=31]
          - errors[ERR_FOUNDRY_SUSPENDED]
          - state_machines.Foundry.terminal_states
        distinguishing_aspect: |
          Suspending twice is not idempotent-success: SUSPENDED is terminal, so the second suspend must
          return 409 ERR_FOUNDRY_SUSPENDED, must not overwrite the first reason and must not bump version
          again.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH already SUSPENDED with reason failed annual alloy audit and version 2."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /foundries/${f1_id}/suspend"
              payload: { suspension_reason: "failed annual alloy audit" }
              as: PlatformAdmin
          trigger:
            - call: "POST /foundries/${f1_id}/suspend"
              payload: { suspension_reason: "second attempt" }
              as: PlatformAdmin
          assert:
            - "HTTP status is 409 with error_id ERR_FOUNDRY_SUSPENDED"
            - "Foundry.${f1_id}.suspension_reason is still failed annual alloy audit"
            - "Foundry.${f1_id}.version is still 2"
      - name: new_casting_lot_starts_poured_with_full_piece_ledger
        claim_type: initial_state
        grounds:
          - state_machines.CastingLot.initial_state
          - calculations.casting_yield_ledger
          - endpoints["POST /casting-lots"]
        distinguishing_aspect: |
          A freshly poured lot must start in POURED with the whole heat provisionally good: qty_accepted
          equals qty_poured 4 while qty_scrapped, qty_rework_pending and committed_build_count are all 0,
          so the ledger only ever moves downward from a full count.
        test_recipe:
          setup:
            - "PatternAsset PAT-HSC14-A is QUALIFIED at FDY-NORTH; alloy CI_GG25 is on the foundry approval list."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "CastingLot.${l1_id}.status == POURED"
            - "CastingLot.${l1_id}.qty_poured == 4 and qty_accepted == 4"
            - "CastingLot.${l1_id}.qty_scrapped == 0 and qty_rework_pending == 0 and committed_build_count == 0"
            - "PatternAsset.${p1_id}.pours_since_refurb == 1 and wear_index == 1 and status == QUALIFIED"
      - name: use_as_is_disposition_by_the_reporting_user_returns_segregation_of_duties
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CastingDefect.transitions.REPORTED_to_DISPOSITIONED_USE_AS_IS
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The REPORTED to DISPOSITIONED_USE_AS_IS transition carries a precondition that X-User-ID differs
          from reported_by_user_id; the same inspector who logged the defect must be refused with 409 even
          though the role itself is authorised, while a second inspector succeeds.
        test_recipe:
          setup:
            - "Lot H-9001 is POURED and carries one REPORTED MINOR defect reported by QualityInspector qi-301."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DEF-001", defect_type: "POROSITY", severity: "MINOR", affected_qty: 1 }
              as: QualityInspector
              as_user_id: "qi-301"
              captures: { df1_id: $.data.id }
          trigger:
            - call: "POST /casting-defects/${df1_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-defects/${df1_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityInspector
              as_user_id: "qi-302"
          assert:
            - "the first call returns 409 with error_id ERR_SEGREGATION_OF_DUTIES and CastingDefect.${df1_id}.status is still REPORTED"
            - "the second call returns 200 and CastingDefect.${df1_id}.status == DISPOSITIONED_USE_AS_IS"
            - "CastingDefect.${df1_id}.dispositioned_by_user_id == qi-302"
            - "CastingLot.${l1_id}.qty_accepted is still 4 because USE_AS_IS contributes zero to both loss buckets"
      - name: certify_test_run_while_run_state_open_returns_test_run_invalid_state
