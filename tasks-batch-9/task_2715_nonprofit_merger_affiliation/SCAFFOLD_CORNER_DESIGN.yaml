      - name: letter_of_intent_returns_to_issued_after_a_revision
        claim_type: cyclic
        grounds:
          - state_machines.LetterOfIntent.COUNTERED_to_ISSUED
          - endpoints.POST_/letters-of-intent/{id}/revise
        excluded_because:
          difficulty_instance: letter_of_intent_counter_revise_cycle_preserves_exclusivity_dimension
          rationale: "That §1.8 instance walks the ISSUED -> COUNTERED -> ISSUED cycle twice, asserting counter_round_count 1 then 2, the revised board_seat_split_initiator, and that exclusivity_start_date, exclusivity_end_date and exclusivity_status ACTIVE survive every hop - a strict superset of the plain cyclic claim."

      - name: critical_escalation_cascade_supersedes_the_letter_and_the_approvals
        claim_type: cascade_down
        grounds:
          - state_machines.Restructuring.DILIGENCE_to_LOI_NEGOTIATION
          - endpoints.POST_/diligence-requests/{id}/escalate
        excluded_because:
          difficulty_instance: critical_escalation_five_hop_cascade_unwinds_letter_approvals_and_seats
          rationale: "The §1.8 instance asserts all five hops of the same cascade from a REGULATORY_REVIEW deal - status reversal, round_no increment, letter SUPERSEDED with RELEASED exclusivity, both approvals SUPERSEDED, and the seat ledger returning to a full reserved_seat_pool with governance_seats zeroed on both organizations."

      - name: restricted_fund_unwind_returns_to_the_basis_specific_state
        claim_type: compensation
        grounds:
          - state_machines.RestrictedFund.TRANSFERRED_to_CONSENT_GRANTED
          - endpoints.POST_/restricted-funds/{id}/unwind
        excluded_because:
          difficulty_instance: restricted_fund_petition_branch_returns_to_modified_not_consent_granted
          rationale: "The §1.8 instance unwinds two funds side by side - one transferred on DONOR_CONSENT and one on JUDICIAL_MODIFICATION - and asserts that the compensating hop is basis-conditional, landing on CONSENT_GRANTED and MODIFIED respectively, which subsumes the single-branch compensation claim."

      - name: program_continuity_task_created_held_while_assets_are_unresolved
        claim_type: initial_state
        grounds:
          - state_machines.IntegrationTask.note_conditional_initial_state
          - endpoints.POST_/integration-tasks
        excluded_because:
          difficulty_instance: integration_task_initial_state_branches_on_the_deal_restricted_posture
          rationale: "The §1.8 instance creates four tasks against the same deal - PROGRAM_CONTINUITY and STAFFING, before and after the posture clears - and asserts HELD with held_reason RESTRICTED_ASSETS_UNRESOLVED only for the one combination that qualifies, which covers the conditional initial state completely."

      - name: certified_seats_return_to_the_pool_on_rescission
        claim_type: ledger_sync
        grounds:
          - state_machines.BoardApproval.CERTIFIED_to_RESCINDED
          - calculations.governance_seat_allocation
        excluded_because:
          difficulty_instance: certify_then_rescind_conserves_the_seat_ledger_total
          rationale: "The §1.8 instance asserts seat_ledger_total == combined_board_seats after each of certify, certify, rescind and re-certify, together with the Organization.governance_seats mirror and the REGULATORY_REVIEW -> BOARD_APPROVAL reversal, so the ledger-sync claim is fully exercised there."

      - name: transfer_clears_the_posture_and_releases_the_held_continuity_task
        claim_type: conditional_cascade
        grounds:
          - state_machines.RestrictedFund.MODIFIED_to_TRANSFERRED
          - state_machines.IntegrationTask.HELD_to_PLANNED
        excluded_because:
          difficulty_instance: restricted_fund_transfer_four_hop_cascade_releases_held_continuity_task
          rationale: "The §1.8 instance drives the same four-hop conditional cascade with two funds so that the first transfer does NOT release the HELD task (one fund still unresolved) and the second does, which is the only way to show the cascade is conditional rather than unconditional."

  - section: calculations
