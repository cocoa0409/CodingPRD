      - name: every_family_list_endpoint_filters_by_its_own_foreign_key_and_status_and_paginates_independently
        claim_type: listing
        grounds:
          - endpoints[GET /volume-cap-allocations]
          - endpoints[GET /bond-issues]
          - endpoints[GET /draw-requests]
          - endpoints[GET /regulatory-agreements]
          - endpoints[GET /cost-certifications]
          - endpoints[GET /credit-allocations]
          - endpoints[GET /physical-inspections]
          - complexity_profile.pagination
        distinguishing_aspect: |
          Seven list endpoints each declare a different foreign key as their filter -
          draws hang off bond_issue_id, credit allocations off project_id or
          cost_certification_id, bond issues off project_id or
          volume_cap_allocation_id - and the status filter is checked against the
          family's own enum, not a shared one. Two projects are financed off the same
          pool so that every unfiltered list would return two rows and every filtered
          one exactly one: a filter that is silently ignored produces the same
          total_count as no filter at all and would pass a single-project fixture. The
