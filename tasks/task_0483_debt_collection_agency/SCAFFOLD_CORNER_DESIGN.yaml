  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_recall_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[recall-stale-account]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Recalling with expected_account_version one behind the current version (after a payment bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "WORKING account; client read version v_pre, then a payment posted (account.version advanced)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Creditor
              captures: { v_pre: $.data.version }
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 10000 }
              as: Collector
          trigger:
            - call: "POST /accounts/${acct}/recall"
              payload: { expected_account_version: "${v_pre}" }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "${err} == ERR_STALE_VERSION"
            - "Account.${acct}.work_status == WORKING (recall rejected, not RECALLED)"

      - name: occ_stale_account_version_on_reverse_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[reverse-stale-account]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Reversing a payment with expected_account_version one behind current (a later payment advanced it) -> ERR_STALE_VERSION (412); a second concurrency rule on the same parent via a different write_endpoint."
        test_recipe:
          setup:
            - "WORKING account; payment P1 posted (capture v after P1), then payment P2 posted (version advanced past v)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 10000 }
              as: Collector
              captures: { p1: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Collector
              captures: { v_after_p1: $.data.version }
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 5000 }
              as: Collector
          trigger:
            - call: "POST /payments/${p1}/reverse"
              payload: { expected_account_version: "${v_after_p1}" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "${err} == ERR_STALE_VERSION"
            - "Payment.${p1}.status == POSTED (reverse rejected)"

      - name: dispute_deleted_cascades_account_close_and_furnishing_delete
        claim_type: cascading_side_effects
        grounds: [state_machines.Dispute.INVESTIGATING_to_RESOLVED, state_machines.Account.WORKING_to_CLOSED_UNCOLLECTIBLE, entities.BureauFurnishing.fields.status]
        distinguishing_aspect: "Resolving a dispute DELETED auto-closes the account CLOSED_UNCOLLECTIBLE and marks its open furnishings DELETED — a cross-entity cascade from a single resolve."
        test_recipe:
          setup:
            - "WORKING account with an INVESTIGATING ACCURACY dispute and one furnished EQUIFAX tradeline (REPORTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /bureau-furnishings"
              payload: { account_id: "${acct}", bureau: "EQUIFAX" }
              as: ComplianceOfficer
              captures: { furn: $.data.id }
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "ACCURACY" }
              as: ComplianceOfficer
              captures: { disp: $.data.id }
            - call: "POST /disputes/${disp}/investigate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /disputes/${disp}/resolve"
              payload: { resolution: "DELETED" }
              as: ComplianceOfficer
          assert:
            - "Account.${acct}.work_status == CLOSED_UNCOLLECTIBLE"
            - "BureauFurnishing.${furn}.status == DELETED"

      - name: time_barred_recomputed_on_clock_advance
        claim_type: derived_field_reconciliation
        grounds: [calculations.sol_status, entities.Account.fields.time_barred]
        distinguishing_aspect: "An account not yet time-barred becomes time_barred==true after the clock advances past the CHARGE_OFF + sol_years expiry instant (derived field reconciled on read)."
        test_recipe:
          setup:
            - "Account charge_off 2022-01-01, sol_years 4 (CHARGE_OFF basis), expiry 2026-01-01."
            - "Clock first at 2025-12-31T23:59:59Z (not barred), then advanced to 2026-01-01T00:00:00Z (barred, >= expiry)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-31T23:59:59Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2022-01-01T00:00:00Z", sol_years: 4, sol_anchor_basis: "CHARGE_OFF" }
              as: Creditor
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Collector
              captures: { tb: $.data.time_barred }
          assert:
            - "before advance, time_barred == false at 2025-12-31T23:59:59Z"
            - "${tb} == true"
            - "Account.${acct}.time_barred == true"

