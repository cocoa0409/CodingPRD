      - name: corner_occ_stale_project_version_on_proof
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[proof-generate-stale-project]", entities.Project.version, "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "Generating a second proof with an expected_project_version that predates the first proof's version bump is rejected with ERR_STALE_PROJECT_VERSION (412); the second uses the pre-bump ${pv}."
        test_recipe:
          setup: ["A LAID_OUT project; its version captured BEFORE the first proof generation."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof1: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "second proof generation with the stale ${pv} -> error_id == ERR_STALE_PROJECT_VERSION, http 412"

      - name: corner_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Project.version, "endpoints.POST_/projects/{id}/photos"]
        distinguishing_aspect: "Each photo upload increments Project.version by exactly 1 (v1 at create, v2 after one photo, v3 after two)."
        test_recipe:
          setup: ["A freshly created project (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id, v0: $.data.version }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { v1: $.data.version }
          assert:
            - "Project.${proj}.version == 2 after one photo upload (was 1 at creation)"

      - name: corner_cancel_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.cancel_fulfillment_to_CANCELLED]
        excluded_because:
          difficulty_instance: cancel_cascade_order_job_shipment_void
          rationale: "The full Order->Job->Shipment cascade is verified end-to-end by the transitive-cascade difficulty instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: corner_immediate_pay_response_reflects_state
        claim_type: immediate
        grounds: [state_machines.Order.pay_UNPAID_to_PAID, entities.Order.payment_status]
        distinguishing_aspect: "The POST /orders/{id}/pay response body itself shows payment_status==PAID and fulfillment_status==IN_PRODUCTION in the same request (immediate consistency)."
        test_recipe:
          setup: ["An approved, unpaid order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
          trigger:
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
