              as_user_id: "u_rev_1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-01T12:00:00Z", expected_profile_version: "${pv1}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
            - call: "GET /ca/certificate-profiles/${prof_id}"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { pv2: $.data.version }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T11:30:00Z", next_update: "2026-08-01T23:30:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
          assert:
            - "before any publication the invariant holds in its charged form: total_crl_entries_published (0) + pending_crl_entry_count (2) == revoked_certificate_count (2)"
            - "the first publication reports crl_number == 1, entry_count == 2 and revoked_serials in revoked_at ASC / serial_number ASC order, i.e. [Certificate.${cert1_id}.serial_number, Certificate.${cert2_id}.serial_number]"
            - "after it the invariant holds in its drained form: total_crl_entries_published (2) + pending_crl_entry_count (0) == revoked_certificate_count (2)"
            - "both certificates carry crl_published_at == 2026-08-01T00:30:00Z and crl_number == 1"
            - "the second publication has an empty drain: entry_count == 0, revoked_serials == [], crl_number == 2, and no certificate's crl_published_at or crl_number is rewritten"
            - "the invariant is unchanged by the empty publication (2 + 0 == 2), proving nothing is double-counted"
            - "CertificateProfile.${prof_id}.status_service_posture == NOMINAL throughout (2 < crl_trigger_threshold 100)"
      - name: subscriber_balance_conservation_on_superseded_preissuance_refund
        grounds:
          - state_machines.RevocationRequest.REQUESTED_to_EXECUTED
          - entities.Subscriber.fields.outstanding_balance_cents
          - entities.Certificate.fields.refunded_at
          - entities.Certificate.fields.charged_amount_cents
          - calculations.issuance_charge_settlement
        distinguishing_aspect: |
          A different conserved quantity - MONEY - and a compensating (undo) path rather
          than a hand-off between two buckets: outstanding_balance_cents must always equal
          the sum of charged_amount_cents over that subscriber's certificates whose
          refunded_at is null. Revoking a PREISSUANCE certificate as SUPERSEDED credits the
          charge back exactly once; the refund must not be replayable and must not drift.
        test_recipe:
          setup:
            - "An ACTIVE DV profile with base_fee_cents 8000 (DV multiplier 1.0, one domain, no expedite, so the charge is exactly 8000)."
            - "One subscriber with credit_limit_cents 1000000 and a zero opening balance."
            - "One certificate issued at 2026-08-01T00:30:00Z, still PREISSUANCE (never activated), plus one open SUPERSEDED-reason revocation request."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "dv-money-1", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 8000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
