        grounds:
          - entities.SwimTeamRegistration.fields.squad
          - validations[priority=11]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: |
          The enum gate at priority 11 must outrank every business rule that reads the same field:
          the request below also names a membership whose season is correct and a swimmer inside the
          age range, so the only defect is the squad token. A case-insensitive or free-text squad
          would create a registration whose SQUAD_CAPACITY bucket does not exist.
        test_recipe:
