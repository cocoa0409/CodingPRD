      - name: val_schema_check_precedes_path_existence_returns_invalid_request
        claim_type: cascading_validation
        grounds:
          - validations.request-schema-valid
          - validations.path-entity-exists
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A malformed body addressed to an election that does not exist returns 400, not 404: the schema gate (priority 30) runs before the path-existence gate (priority 40), so the response never reveals whether the addressed id exists. Three different schema faults - a missing required field, an out-of-range integer and an enum outside its declared set - all collapse to the same error id."
        test_recipe:
          setup:
