scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: session_billing_floor_diverges_on_short_session
        grounds:
          - calculations.warehouse_credit_burn
          - calculations.warehouse_credit_burn.variants.METERED
          - calculations.warehouse_credit_burn.variants.BILLED_FLOOR
          - entities.WarehouseSession.fields.metered_credits
          - entities.WarehouseSession.fields.billed_credits
          - entities.VirtualWarehouse.fields.auto_suspend_seconds
        distinguishing_aspect: "METERED and BILLED_FLOOR are two valid readings of the same session and disagree on a 47-second MEDIUM session, because BILLED_FLOOR raises the elapsed seconds to the warehouse's 60-second auto_suspend floor while METERED does not."
        test_recipe:
          setup:
            - "one account, one MEDIUM warehouse with auto_suspend_seconds 60"
            - "one session closed after exactly 47 logical-clock seconds"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Meter Short", account_locator: "ms1234", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ms: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_ms}", name: "WH_MS", size: "MEDIUM", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_ms: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_ms}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_ms}" }
              as: DataEngineer
              captures: { ses_ms: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:47Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_ms}"
              payload: {}
              as: DataEngineer
              captures: { wh_ms_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_ms}/close"
              payload: { expected_warehouse_version: "${wh_ms_v}" }
              as: DataEngineer
              captures: { ses_ms_state: $.data.state }
          assert:
            - "WarehouseSession.${ses_ms}.elapsed_seconds == 47"
            - "WarehouseSession.${ses_ms}.metered_credits == 0.052222"
            - "WarehouseSession.${ses_ms}.billed_seconds == 60"
            - "WarehouseSession.${ses_ms}.billed_credits == 0.066667"
            - "WarehouseSession.${ses_ms}.billed_credits != WarehouseSession.${ses_ms}.metered_credits"
      - name: storage_cost_rounding_order_changes_the_cents
        grounds:
          - calculations.storage_billing_time_travel_fail_safe
          - calculations.storage_billing_time_travel_fail_safe.variants.PER_COMPONENT
          - calculations.storage_billing_time_travel_fail_safe.variants.SUM_THEN_ROUND
          - entities.StorageUsageRecord.fields.storage_cost_dollars
        distinguishing_aspect: "The same three component volumes price to 402.28 dollars under PER_COMPONENT and 402.27 dollars under SUM_THEN_ROUND, so the ledger value and the reporting value for one snapshot differ by a cent purely because of when the rounding happens."
        test_recipe:
          setup:
            - "one storage snapshot with active_tb 12.47, time_travel_tb 3.33, time_travel_days 30, fail_safe_tb 1.0"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Store Round", account_locator: "sr2345", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_sr: $.data.id }
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_sr}", usage_date: "2026-09-01T00:00:00Z", active_tb: 12.47, time_travel_tb: 3.33, fail_safe_tb: 1.0, time_travel_days: 30 }
              as: DataEngineer
              captures: { sur_r: $.data.id }
          trigger:
            - call: "GET /v1/storage-usage-records/${sur_r}/billing-summary"
              payload: {}
              as: FinanceController
              captures: { sur_r_stored: $.data.storage_cost_dollars_stored }
          assert:
            - "StorageUsageRecord.${sur_r}.storage_cost_dollars == 402.28"
            - "GET billing-summary data.storage_cost_dollars_reported == 402.27"
            - "${sur_r_stored} == 402.28"
            - "GET billing-summary data.per_component.ACTIVE == 288.06 and data.per_component.TIME_TRAVEL == 83.92 and data.per_component.FAIL_SAFE == 30.30"
            - "StorageUsageRecord.${sur_r}.storage_cost_dollars != GET billing-summary data.storage_cost_dollars_reported"
  - rule_id: combinatorial_formula
    instances:
      - name: cluster_scaling_evaluation_order_min_floor_reapplied
        grounds:
          - calculations.warehouse_cluster_scaling
          - calculations.warehouse_cluster_scaling.variants.DEMAND_ONLY
          - calculations.warehouse_cluster_scaling.variants.BUDGET_BOUND
          - entities.VirtualWarehouse.fields.multi_cluster_queued_queries
        distinguishing_aspect: "The pinned order is demand, clamp, budget shrink, budget floor, so a request of clusters 1 with 19 queued queries and remaining_credits 100 resolves to 3 clusters rather than the requested 1 — reordering the min-floor step to the front would yield 2 and putting it after the shrink would yield 1."
        test_recipe:
          setup:
            - "one LARGE warehouse with clusters_min 1 and clusters_max 3"
            - "one ACTIVE capacity contract with remaining_credits 100 and overage_rate_per_credit 3.00"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Scale Order", account_locator: "so3456", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_so: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_so}", name: "WH_SO", size: "LARGE", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 3, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_so: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_so}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_so: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_so}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /v1/warehouses/${wh_so}/resume"
              payload: {}
              as: DataEngineer
            - call: "GET /v1/warehouses/${wh_so}"
              payload: {}
              as: DataEngineer
              captures: { wh_so_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouses/${wh_so}/cluster-scaling"
              payload: { clusters: 1, queued_queries: 19, expected_warehouse_version: "${wh_so_v}" }
              as: DataEngineer
          assert:
            - "VirtualWarehouse.${wh_so}.cluster_count == 3"
            - "VirtualWarehouse.${wh_so}.multi_cluster_queued_queries == 19"
            - "projected burn at 3 clusters for 900 seconds would be 6.00, which is strictly below contract.remaining_credits 100.00"
            - "contract.remaining_credits is unchanged at 100.00 because scaling alone draws nothing"
      - name: contract_overage_waterfall_segment_order
        grounds:
          - calculations.contract_credit_drawdown
          - calculations.contract_credit_drawdown.variants.OVER_ALLOWANCE
          - entities.CreditDrawdown.fields.outcome
          - entities.CreditDrawdown.fields.overage_usd
        distinguishing_aspect: "The BASE then ROLLOVER then OVERAGE segmentation order decides the outcome label and the dollar figure, so a 1200-credit drawdown against a contract with base 1000 and no rollover settles as OVERAGE with exactly 600.00 dollars of overage rather than being clipped, split, or priced average-rate."
        test_recipe:
          setup:
            - "one ACTIVE contract with base_credits 1000, overage_rate_per_credit 3.00 and no rollover credits"
            - "one warehouse to bind the drawdown to"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Waterfall", account_locator: "wf4567", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_wf: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_wf}", name: "WH_WF", size: "SMALL", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_wf: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_wf}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_wf: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_wf}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_wf}"
              payload: {}
              as: FinanceController
              captures: { ct_wf_v: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_wf}", warehouse_id: "${wh_wf}", amount_credits: 1000, source_kind: "SESSION", idempotency_key: "wf-1000-1", expected_contract_version: "${ct_wf_v}" }
              as: DataEngineer
              captures: { dd_wf_1: $.data.id }
            - call: "GET /v1/capacity-contracts/${ct_wf}"
              payload: {}
              as: FinanceController
              captures: { ct_wf_v2: $.data.version }
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_wf}", warehouse_id: "${wh_wf}", amount_credits: 200, source_kind: "SESSION", idempotency_key: "wf-1000-2", expected_contract_version: "${ct_wf_v2}" }
              as: DataEngineer
              captures: { dd_wf_2: $.data.id }
          assert:
            - "CreditDrawdown.${dd_wf_1}.outcome == BASE"
            - "CreditDrawdown.${dd_wf_1}.overage_usd == 0.00"
            - "CreditDrawdown.${dd_wf_2}.outcome == OVERAGE"
            - "CreditDrawdown.${dd_wf_2}.overage_usd == 600.00"
            - "CapacityContract.${ct_wf}.status == EXHAUSTED"
            - "CapacityContract.${ct_wf}.remaining_credits == 0.0"
      - name: replication_transfer_cost_four_input_product
        grounds:
          - calculations.replication_transfer_cost
          - entities.ReplicationConfiguration.fields.transfer_cost_dollars
          - entities.ReplicationConfiguration.fields.target_region
          - entities.ReplicationConfiguration.fields.target_cloud
        distinguishing_aspect: "Replication price is a four-input non-linear product of volume, per-terabyte rate and two independent factors, so 4.5 TB to us-west-2 across clouds is 33.41 dollars and not the 27.00 a same-cloud us-east-1 transfer would cost."
        test_recipe:
          setup:
            - "one account whose own region is us-east-1"
            - "one replication configuration targeting us-west-2 with a cross-cloud destination and 4.5 TB to transfer"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Repl Cost", account_locator: "rc5678", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rc: $.data.id }
            - call: "POST /v1/replication-configurations"
              payload: { account_id: "${acct_rc}", name: "REPL_RC", target_region: "us-west-2", target_cloud: "CROSS_CLOUD", replicated_tb: 4.5 }
              as: DataEngineer
              captures: { repl_rc: $.data.id }
          trigger:
            - call: "POST /v1/replication-configurations/${repl_rc}/refresh"
              payload: {}
              as: DataEngineer
              captures: { repl_rc_state: $.data.replication_state }
          assert:
            - "ReplicationConfiguration.${repl_rc}.replication_state == REFRESHED"
            - "ReplicationConfiguration.${repl_rc}.refresh_count == 1"
            - "ReplicationConfiguration.${repl_rc}.transfer_cost_dollars == 33.41"
            - "ReplicationConfiguration.${repl_rc}.transfer_cost_dollars != 27.00"
  - rule_id: non_linear_state_machine
    instances:
      - name: warehouse_parallel_status_and_cluster_dimensions
        grounds:
          - state_machines.VirtualWarehouse
          - state_machines.VirtualWarehouse.transitions.RUNNING_to_RESIZING
          - state_machines.VirtualWarehouse.transitions.RESIZING_to_RUNNING
          - entities.VirtualWarehouse.fields.cluster_count
        distinguishing_aspect: "VirtualWarehouse carries two independent axes on the same row — the lifecycle status and a separate cluster_count — so cluster_count can move between 1 and 3 while status stays RUNNING, which no single linear pipeline permits."
        test_recipe:
          setup:
            - "one running LARGE warehouse with clusters_min 1 and clusters_max 3"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Parallel Axes", account_locator: "pa6789", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_pa: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_pa}", name: "WH_PA", size: "LARGE", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 3, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_pa: $.data.id }
            - call: "POST /v1/warehouses/${wh_pa}/resume"
              payload: {}
              as: DataEngineer
              captures: { wh_pa_status_1: $.data.status }
            - call: "GET /v1/warehouses/${wh_pa}"
              payload: {}
              as: DataEngineer
              captures: { wh_pa_v1: $.data.version }
            - call: "POST /v1/warehouses/${wh_pa}/cluster-scaling"
              payload: { clusters: 3, queued_queries: 24, expected_warehouse_version: "${wh_pa_v1}" }
              as: DataEngineer
              captures: { wh_pa_cc_1: $.data.cluster_count }
            - call: "GET /v1/warehouses/${wh_pa}"
              payload: {}
              as: DataEngineer
              captures: { wh_pa_v2: $.data.version }
          trigger:
            - call: "POST /v1/warehouses/${wh_pa}/cluster-scaling"
              payload: { clusters: 1, queued_queries: 0, expected_warehouse_version: "${wh_pa_v2}" }
              as: DataEngineer
              captures: { wh_pa_cc_2: $.data.cluster_count }
          assert:
            - "${wh_pa_status_1} == RUNNING"
            - "${wh_pa_cc_1} == 3"
            - "${wh_pa_cc_2} == 1"
            - "VirtualWarehouse.${wh_pa}.status == RUNNING"
            - "VirtualWarehouse.${wh_pa}.cluster_count changed from 3 to 1 while status never left RUNNING"
      - name: contract_term_cycle_renewal_rounds
        grounds:
          - state_machines.CapacityContract
          - state_machines.CapacityContract.transitions.EXPIRED_to_ACTIVE
          - state_machines.CapacityContract.transitions.ACTIVE_to_EXPIRED
          - calculations.contract_rollover_utilization
        distinguishing_aspect: "CapacityContract runs a genuine cycle ACTIVE to EXPIRED to ACTIVE that can repeat without bound, so the same contract can be renewed twice and each round re-books rollover from the frozen term-end basis instead of terminating."
        test_recipe:
          setup:
            - "one ACTIVE contract with base_credits 1000, rollover_cap_credits 200 and 150 credits left"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Cycle Terms", account_locator: "cy7890", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cy: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cy}", name: "WH_CY", size: "LARGE", auto_suspend_seconds: 3600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_cy: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_cy}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_cy: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_cy}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_cy}"
              payload: {}
              as: FinanceController
              captures: { ct_cy_v: $.data.version }
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_cy}", warehouse_id: "${wh_cy}", amount_credits: 850, source_kind: "SESSION", idempotency_key: "cy-850", expected_contract_version: "${ct_cy_v}" }
              as: DataEngineer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/capacity-contracts/${ct_cy}/renew"
              payload: { new_term_start: "2026-10-01T00:00:00Z", new_term_end: "2026-11-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00 }
              as: FinanceController
          assert:
            - "CapacityContract.${ct_cy}.term_end_remaining_credits == 150.0"
            - "CapacityContract.${ct_cy}.rolled_over_credits == 150.0"
            - "CapacityContract.${ct_cy}.remaining_credits == 1150.0"
            - "CapacityContract.${ct_cy}.drawdown_count == 0"
            - "CapacityContract.${ct_cy}.status == ACTIVE and the cycle can be run again from the new term_end 2026-11-01T00:00:00Z"
  - rule_id: transitive_cascade
    instances:
      - name: session_close_cascade_three_hops_to_monitor_suspend
        grounds:
          - state_machines.WarehouseSession.transitions.CLOSING_to_CLOSED
          - state_machines.ResourceMonitor.transitions.OK_to_SUSPENDED
          - state_machines.VirtualWarehouse.transitions.RUNNING_to_DRAINING
          - calculations.account_posture_derivation
        distinguishing_aspect: "Depth-three chain from one session close: the CLOSED posting raises the account's interval consumption, which is what tips the monitor over its quota, and the monitor's own suspension is what drains the sibling warehouse — removing the monitor hop leaves the sibling warehouse RUNNING."
        test_recipe:
          setup:
            - "one account with two LARGE warehouses, a MONTHLY SUSPEND monitor with credit_quota 1000, and a first session of 1800 seconds"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Cascade Depth", account_locator: "cd8901", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cd: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cd}", name: "WH_CD_A", size: "LARGE", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_cd_a: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cd}", name: "WH_CD_B", size: "LARGE", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_cd_b: $.data.id }
            - call: "POST /v1/resource-monitors"
              payload: { account_id: "${acct_cd}", name: "MON_CD", credit_quota: 1000, interval: "MONTHLY", action: "SUSPEND" }
              as: FinanceController
              captures: { mon_cd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_cd_a}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouses/${wh_cd_b}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_cd_a}" }
              as: DataEngineer
              captures: { ses_cd_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:30:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_cd_a}"
              payload: {}
              as: DataEngineer
              captures: { wh_cd_a_v1: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_cd_1}/close"
              payload: { expected_warehouse_version: "${wh_cd_a_v1}" }
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_cd_a}" }
              as: DataEngineer
              captures: { ses_cd_2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_cd_a}"
              payload: {}
              as: DataEngineer
              captures: { wh_cd_a_v2: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_cd_2}/close"
              payload: { expected_warehouse_version: "${wh_cd_a_v2}" }
              as: DataEngineer
              captures: { ses_cd_2_credits: $.data.billed_credits }
          assert:
            - "${ses_cd_2_credits} == 4.000000"
            - "Account.${acct_cd}.posted_consumption_credits_reconciled == 8.0"
            - "Account.${acct_cd}.account_state == DRAINING"
            - "ResourceMonitor.${mon_cd}.monitor_state == SUSPENDED"
            - "ResourceMonitor.${mon_cd}.used_pct == 0.8"
            - "VirtualWarehouse.${wh_cd_b}.status == DRAINING"
            - "VirtualWarehouse.${wh_cd_a}.status == DRAINING"
      - name: commit_contract_cascade_withdraw_freezes_frozen_price
        grounds:
          - state_machines.DataShare.transitions.PUBLISHED_to_DRAFT
          - state_machines.Listing.transitions.PUBLISHED_to_WITHDRAWN
          - state_machines.PaidShareUsage.transitions.PENDING_to_SETTLED
          - calculations.provider_payout_split
        distinguishing_aspect: "Depth-two chain on the provider side: settling payment freezes the listing price, and a later share revoke cascades into withdrawing that listing through the same frozen-price path, so the revoke hop is what stops further accrual rather than stopping the payout."
        test_recipe:
          setup:
            - "a provider account, a consumer account, one published share naming the consumer and one published usage-based listing at 0.50 dollars per credit"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Provider CW", account_locator: "pc9001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_prov: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Consumer CW", account_locator: "cc9002", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cons: $.data.id }
            - call: "POST /v1/data-shares"
              payload: { provider_account_id: "${acct_prov}", name: "SHARE_CW", objects_exposed: 5, consumer_account_ids: ["${acct_cons}"] }
              as: ShareAdmin
              as_user_id: "${acct_prov}"
              captures: { share_cw: $.data.id }
            - call: "POST /v1/data-shares/${share_cw}/publish"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_prov}"
            - call: "POST /v1/listings"
