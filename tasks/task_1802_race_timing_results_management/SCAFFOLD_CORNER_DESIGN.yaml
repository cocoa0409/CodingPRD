# =============================================================================
# Task 1802 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests, §1.9)
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Stubs mark §1.8-covered corners.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: race_creation_sets_initial_state_and_defaults
        claim_type: creation
        grounds: [entities.Race, state_machines.Race]
        distinguishing_aspect: "POST /races with required fields returns 201; status DRAFT, amendment_count 0, qualifying_standard_ms null when omitted, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /race-timing/races"
              payload: { name: "Defaults 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id, race_v: $.data.version }
          assert:
            - "Race.status == DRAFT (initial state)"
            - "Race.amendment_count == 0 and qualifying_standard_ms == null (defaults applied)"
            - "Race.version == 1 and id is a type-prefix-free UUID; created_at has three fractional digits"
            - "Input-supplied id/version fields, if any, are ignored (system fields)"
      - name: race_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.Race.fields.course_time_limit_minutes, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required course_time_limit_minutes fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /race-timing/races", payload: { name: "Bad", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE }, as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"
      - name: get_unknown_id_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /race-timing/races/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: chip_code_uniqueness_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=17]", "errors[ERR_CHIP_CODE_TAKEN]"]
        distinguishing_aspect: "Second chip with the same chip_code is rejected ERR_CHIP_CODE_TAKEN (fleet-wide uniqueness)."
        test_recipe:
          setup: ["chip CHIP-DUP exists"]
          setup_api_calls:
            - { call: "POST /race-timing/chips", payload: { chip_code: "CHIP-DUP" }, as: RegistrationClerk }
          trigger:
            - { call: "POST /race-timing/chips", payload: { chip_code: "CHIP-DUP" }, as: RegistrationClerk, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CHIP_CODE_TAKEN (409)"
      - name: wave_index_unique_returns_409
        claim_type: type_constraints
        grounds: ["validations[priority=15]", "errors[ERR_WAVE_INDEX_TAKEN]"]
        distinguishing_aspect: "Reusing wave_index with a non-conflicting start time isolates the uniqueness check: ERR_WAVE_INDEX_TAKEN (no spacing violation in play)."
        test_recipe:
          setup: ["race with wave index 1 at 07:00"]
          setup_api_calls:
            - call: "POST /race-timing/races"
              payload: { name: "Idx 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/waves", payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }, as: RaceDirector }
          trigger:
            - { call: "POST /race-timing/waves", payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:30:00Z", max_capacity: 10 }, as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAVE_INDEX_TAKEN (409)"
      - name: timing_read_immutable_no_version
        claim_type: immutability
        grounds: [entities.TimingRead]
        distinguishing_aspect: "TimingRead has common_fields false: GET response carries id and created_at but no version/updated_at; the API exposes no PUT/PATCH/DELETE for reads (mutations only via corrections)."
        test_recipe:
          setup: ["race IN_PROGRESS with one CHECKED_IN registration and chip; one SCORED START read ingested"]
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Immutable 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-I1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 5.0, device_id: "MAT-I2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-IM" }
              as: RegistrationClerk
              captures: { chip1: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "810", participant_name: "Imm Utable", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg1: $.data.id }
            - { call: "POST /race-timing/registrations/${reg1}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg1}/confirm", as: RegistrationClerk }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/registrations/${reg1}/assign-chip", payload: { chip_id: "${chip1}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave1}/start", as: TimingOperator }
            - call: "POST /race-timing/timing-reads"
              payload: { timing_point_id: "${tp_start}", chip_id: "${chip1}", read_timestamp: "2026-08-01T07:00:05.000Z" }
              as: TimingOperator
              captures: { read1: $.data.id }
          trigger:
            - { call: "GET /race-timing/timing-reads/${read1}", as: TimingOperator }
          assert:
            - "Response data has id and created_at but no version and no updated_at keys (common_fields false)"
            - "TimingRead.status == SCORED; reject_reason == null; adjusted_by_correction_id == null"
      - name: registration_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, entities.Registration]
        distinguishing_aspect: "List endpoint honors envelope pagination: 11 registrations -> default page limit 10, total_count 11, has_more true; offset 10 returns the 11th row with has_more false."
        test_recipe:
          setup: ["race REGISTRATION_OPEN, wave capacity 20; 11 registrations bibs 900-910"]
          setup_api_calls:
            - call: "POST /race-timing/races"
              payload: { name: "Page 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 20 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "900", participant_name: "P900", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "901", participant_name: "P901", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "902", participant_name: "P902", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "903", participant_name: "P903", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "904", participant_name: "P904", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "905", participant_name: "P905", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "906", participant_name: "P906", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "907", participant_name: "P907", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "908", participant_name: "P908", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "909", participant_name: "P909", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations", payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "910", participant_name: "P910", birth_date: "1990-01-01", gender: M }, as: RegistrationClerk }
          trigger:
            - { call: "GET /race-timing/registrations", payload: { race_id: "${race_id}" }, as: RegistrationClerk }
            - { call: "GET /race-timing/registrations", payload: { race_id: "${race_id}", limit: 10, offset: 10 }, as: RegistrationClerk }
          assert:
            - "First page: data length 10, total_count == 11, has_more == true (default limit 10)"
            - "Second page (offset 10): data length 1, total_count == 11, has_more == false"
      - name: registration_computed_age_fields
        claim_type: computed_fields
        grounds: [entities.Registration.fields.age_on_race_day, entities.Registration.fields.age_group]
        excluded_because:
          difficulty_instance: age_bracket_boundary_categorization
          rationale: "Age/bracket computation asserted with boundary literals in the named §1.8 instance."

  - section: state_machines
    instances:
      - name: lock_timing_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Race, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Race in DRAFT cannot skip REGISTRATION_OPEN: lock-timing -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["race in DRAFT"]
          setup_api_calls:
            - call: "POST /race-timing/races"
              payload: { name: "Skip 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
          trigger:
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (409); Race.status stays DRAFT"
      - name: publish_before_cutoff_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=9]", "errors[ERR_RACE_CUTOFF_NOT_REACHED]", calculations.dnf_detection]
        distinguishing_aspect: "Publish at first-wave-start + cutoff - 1s is rejected ERR_RACE_CUTOFF_NOT_REACHED; the inclusive cutoff boundary is what makes 09:00:00 legal elsewhere."
        test_recipe:
          setup:
            - "10km race IN_PROGRESS: wave started 07:00:00, cutoff 120min; clock 08:59:59 (1s before cutoff)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Cutoff 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-C1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 10.0, device_id: "MAT-C2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave1}/start", as: TimingOperator }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:59:59Z" }, as: RaceDirector }
          trigger:
            - { call: "GET /race-timing/races/${race_id}", as: RaceDirector, captures: { race_v: $.data.version } }
            - { call: "POST /race-timing/races/${race_id}/publish-results", payload: { expected_race_version: "${race_v}" }, as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RACE_CUTOFF_NOT_REACHED (409); Race.status stays IN_PROGRESS"
      - name: finalize_window_open_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=8]", "errors[ERR_PROTEST_WINDOW_OPEN]"]
        distinguishing_aspect: "Finalize 15 minutes into the 30-minute protest window is rejected ERR_PROTEST_WINDOW_OPEN even with zero protests and zero flags."
        test_recipe:
          setup:
            - "Race with no registrations published at 09:00:00 (empty result set); clock 09:15:00"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Early Finalize 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-F1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 10.0, device_id: "MAT-F2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave1}/start", as: TimingOperator }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: RaceDirector }
            - { call: "GET /race-timing/races/${race_id}", as: RaceDirector, captures: { race_v: $.data.version } }
            - { call: "POST /race-timing/races/${race_id}/publish-results", payload: { expected_race_version: "${race_v}" }, as: RaceDirector }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:15:00Z" }, as: RaceDirector }
          trigger:
            - { call: "POST /race-timing/races/${race_id}/finalize-results", as: RaceDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROTEST_WINDOW_OPEN (409); Race.status stays PROVISIONAL_PUBLISHED"
      - name: finalize_with_raised_dnf_blocked_then_cleared
        claim_type: side_effect_execution
        grounds: [calculations.dnf_detection, "validations[priority=24]", state_machines.ResultFlag.RAISED_to_DISMISSED]
        distinguishing_aspect: "Publish raises AUTO DNF for the non-finisher; finalize is blocked ERR_FLAGS_OUTSTANDING while the flag is RAISED; after DISMISSED, finalize succeeds and the non-finisher result stays unranked (chip_time_ms null) without EXCLUDED status."
        test_recipe:
          setup:
            - "10km race, two CHECKED_IN registrations K1 (finishes) and K2 (no finish read)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "DNF 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-D1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 10.0, device_id: "MAT-D2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-K1" }
              as: RegistrationClerk
              captures: { chip_k1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-K2" }
              as: RegistrationClerk
              captures: { chip_k2: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "701", participant_name: "K One", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_k1: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_k1}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_k1}/confirm", as: RegistrationClerk }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "702", participant_name: "K Two", birth_date: "1991-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_k2: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_k2}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_k2}/confirm", as: RegistrationClerk }
