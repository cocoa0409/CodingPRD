# =====================================================================
# §1.9 Scaffold Corner Design — task 2556 Senior Games & Masters Competition
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# this scaffold's §1.1-§1.7 surface. `section:` values are the guide's nine
# sections; `claim_type:` values are the guide's per-section rows.
#
# Shared conventions used by every chain below:
#   * The default logical clock is 2026-08-01T00:00:00Z. POST /_clock/set_current_utc
#     is the only way to move it; no chain waits on wall-clock time.
#   * The STANDARD EDITION fixture is: competition_start_date 2026-09-10,
#     competition_end_date 2026-09-20, age_reference_date 2026-12-31,
#     registration_deadline_utc 2026-08-25T23:59:59Z, host_state_code IL,
#     age_basis defaulted to REFERENCE_DATE. Its village window is
#     2026-09-08 .. 2026-09-22.
#   * GamesEdition DRAFT -> REGISTRATION_OPEN requires at least one OPEN
#     SportEvent to exist first, so every chain creates the Sport and the
#     SportEvent BEFORE calling open-registration.
#   * An athlete born 1966-03-02 is 60 at the reference date and lands in the
#     60-64 band under either age basis; that DOB is the default fixture body.
#   * A screening of systolic_bp 128 / resting_hr 70 / prior_cardiac_event false
#     on a 60-year-old with no HIGH-contact entries scores 7.5 -> CLEARED.
#   * A 0-entry athlete owes 9500; a 1-entry athlete on a 6000-cent event owes
#     15500; a 2-entry athlete on two 6000-cent events owes 20425.
# =====================================================================
scaffold_corner_design:

  # ===================================================================
  # SECTION 1 — ENTITIES
  # ===================================================================
  - section: entities
    instances:
      - name: corner_entity_creation_games_edition_returns_declared_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.GamesEdition
          - endpoints[POST /games-editions]
          - response_envelope.success
        distinguishing_aspect: "POST /games-editions with only the required fields returns 201, echoes every input field, and stamps every declared default exactly once: status DRAFT, age_basis REFERENCE_DATE, municipal_support_cents 0, ops_epoch 0, sponsorship_recognized_cents 0, provisional_impact_cents 0, final_impact_cents null."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "GET /senior-games/games-editions"
              payload: { limit: 10, offset: 0 }
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "GamesEdition.${ed_id}.name == \"Prairie Senior Games 2026\", host_city == \"Springfield\", host_state_code == \"IL\""
            - "GamesEdition.${ed_id}.competition_start_date == \"2026-09-10\", competition_end_date == \"2026-09-20\", age_reference_date == \"2026-12-31\", registration_deadline_utc == \"2026-08-25T23:59:59Z\""
            - "GamesEdition.${ed_id}.status == \"DRAFT\" and age_basis == \"REFERENCE_DATE\" and municipal_support_cents == 0"
            - "GamesEdition.${ed_id}.ops_epoch == 0, sponsorship_recognized_cents == 0, provisional_impact_cents == 0 and final_impact_cents is null"
            - "GamesEdition.${ed_id}.id, created_at, updated_at and version are all present, and version == 1"
            - "the pre-trigger list GET returned total_count == 0 and has_more == false"

      - name: corner_entity_retrieval_sport_event_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.SportEvent
          - endpoints[GET /sport-events/{sport_event_id}]
        distinguishing_aspect: "GET /sport-events/{id} returns exactly the row POST created, including the computed available_slots seeded from capacity and the omitted-optional default min_entries_to_stage == 3."
        test_recipe:
          setup:
            - "One DRAFT GamesEdition on the standard fixture and one LOW-contact TRACK sport."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: RegistrationOfficer
          assert:
            - "HTTP 200 with SportEvent.${ev_id}.sport_id == ${sp_track_id} and games_edition_id == ${ed_id}"
            - "SportEvent.${ev_id}.event_code == \"T100M\", age_group_code == \"60-64\", gender_division == \"MEN\", entry_fee_cents == 6000, capacity == 8"
            - "SportEvent.${ev_id}.min_entries_to_stage == 3 because the optional field was omitted and its declared default applied"
            - "SportEvent.${ev_id}.status == \"OPEN\", accepted_entry_count == 0, available_slots == 8, current_record_id is null, seeded_at_utc is null"
            - "SportEvent.${ev_id}.national_qualifying_standard is null"

      - name: corner_entity_listing_athletes_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /athletes]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /athletes with limit 2 over three rows returns 2 items with total_count 3 and has_more true; the second page at offset 2 returns 1 item with has_more false, and total_count stays 3 on both pages."
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN on the standard fixture, one TRACK sport, one 60-64 T100M event."
            - "Three athletes Ada, Ben and Cleo, all born 1966-03-02 and resident in IL, created in that order."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_ada_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ben Orsi", email: "ben.orsi@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_ben_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Cleo Marsh", email: "cleo.marsh@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_cleo_id: $.data.id }
          trigger:
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", limit: 2, offset: 0 }
              as: GamesAdmin
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", limit: 2, offset: 2 }
              as: GamesAdmin
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", registration_status: "REGISTERED", limit: 10, offset: 0 }
              as: GamesAdmin
          assert:
            - "page one returns HTTP 200, response_type == \"array\", exactly 2 items, total_count == 3 and has_more == true"
            - "page two returns exactly 1 item, total_count == 3 and has_more == false"
            - "the union of page one and page two is exactly {${ath_ada_id}, ${ath_ben_id}, ${ath_cleo_id}} with no row appearing twice"
            - "the registration_status == REGISTERED filter returns 0 items with total_count == 0 and has_more == false, because all three athletes are still PENDING_PAYMENT"

      - name: corner_entity_not_found_athlete_unknown_uuid_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_ATHLETE_NOT_FOUND]
          - validations[priority=14]
          - response_envelope.error
        distinguishing_aspect: "A GET on a well-formed but absent athlete id returns HTTP 404 with error_id ERR_ATHLETE_NOT_FOUND and the error envelope shape, not an empty 200."
        test_recipe:
          setup:
            - "Empty database; no Athlete row has ever been created."
          setup_api_calls:
            - call: "GET /senior-games/athletes"
              payload: { limit: 10, offset: 0 }
              as: GamesAdmin
          trigger:
            - call: "GET /senior-games/athletes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GamesAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_nf} == \"ERR_ATHLETE_NOT_FOUND\""
            - "the body is the error envelope: response_type == \"error\" and data carries exactly error_id and message"
            - "the preceding list GET returned total_count == 0, confirming the id genuinely does not exist rather than being filtered out"

      - name: corner_entity_missing_required_date_of_birth_rejected
        claim_type: Required Fields
        grounds:
          - entities.Athlete.fields.date_of_birth
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting date_of_birth from POST /athletes returns HTTP 400 ERR_INVALID_REQUEST at priority 10, before any age-band or deadline rule can run, and no Athlete row is created."
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN on the standard fixture, one TRACK sport, one 60-64 T100M event."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_req} == \"ERR_INVALID_REQUEST\""
            - "GET /senior-games/athletes with games_edition_id == ${ed_id} returns total_count == 0, so the rejected request persisted nothing"
            - "the message names the offending field date_of_birth"

      - name: corner_entity_defaults_applied_when_optional_inputs_omitted
        claim_type: Defaults
        grounds:
          - entities.GamesEdition.fields.age_basis
          - entities.SportEvent.fields.min_entries_to_stage
          - entities.Sport.fields.min_age
          - entities.SessionSlot.fields.teardown_buffer_minutes
          - entities.SessionSlot.fields.required_official_count
          - entities.Venue.fields.has_onsite_medical_bay
          - entities.Personnel.fields.certification_level
          - entities.AccommodationBlock.fields.accessible_units
        distinguishing_aspect: "Every declared default fires when its optional input is omitted: age_basis REFERENCE_DATE, Sport.min_age 50, Sport.equipment_profile {}, Sport.format_modifications {}, SportEvent.min_entries_to_stage 3, SessionSlot.teardown_buffer_minutes 15, SessionSlot.required_official_count 2, Venue.has_onsite_medical_bay false, Personnel.certification_level 0, Personnel.certified_sport_codes [], AccommodationBlock.accessible_units 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
          trigger:
            - call: "POST /senior-games/sports"
              payload: { sport_code: "SWIM", name: "Swimming", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 1 }
              as: GamesAdmin
              captures: { sp_swim_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_swim_id}", games_edition_id: "${ed_id}", event_code: "S50FREE", age_group_code: "60-64", gender_division: "WOMEN", entry_fee_cents: 5000, capacity: 6 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "Municipal Natatorium", competition_area_count: 3, spectator_capacity: 250, emergency_protocol_code: "EP_ADVANCED" }
              as: GamesAdmin
              captures: { vn_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z" }
              as: GamesAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /senior-games/personnel"
              payload: { games_edition_id: "${ed_id}", full_name: "Iris Vale", personnel_type: "VOLUNTEER" }
              as: GamesAdmin
              captures: { pers_id: $.data.id }
            - call: "POST /senior-games/accommodation-blocks"
              payload: { games_edition_id: "${ed_id}", name: "Birch Hall", bed_capacity: 4, nightly_rate_cents: 11000 }
              as: GamesAdmin
              captures: { blk_id: $.data.id }
          assert:
            - "GamesEdition.${ed_id}.age_basis == \"REFERENCE_DATE\" and municipal_support_cents == 0"
            - "Sport.${sp_swim_id}.min_age == 50, equipment_profile == {} and format_modifications == {}"
            - "SportEvent.${ev_id}.min_entries_to_stage == 3 and national_qualifying_standard is null"
            - "Venue.${vn_id}.has_onsite_medical_bay == false"
            - "SessionSlot.${slot_id}.teardown_buffer_minutes == 15 and required_official_count == 2"
            - "Personnel.${pers_id}.certification_level == 0 and certified_sport_codes == []"
            - "AccommodationBlock.${blk_id}.accessible_units == 0"
            - "the slot was accepted even though Venue.${vn_id}.has_onsite_medical_bay is false, because Sport.${sp_swim_id}.contact_class is LOW and priority 52 only gates HIGH-contact events"

      - name: corner_entity_computed_counters_start_at_zero_on_create
        claim_type: Computed Fields
        grounds:
          - entities.SportEvent.fields.accepted_entry_count
          - entities.SportEvent.fields.available_slots
          - entities.Personnel.fields.assigned_minutes_total
          - entities.Personnel.fields.no_show_count
          - entities.AccommodationBlock.fields.reserved_bed_nights
          - entities.SessionSlot.fields.confirmed_official_count
          - entities.Athlete.fields.fee_total_cents
        distinguishing_aspect: "Computed ledger fields are never client-supplied: they are absent from every §1.5 input list and read back at their declared zero-state immediately after creation — available_slots equals capacity, not zero."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "North Oval", competition_area_count: 4, spectator_capacity: 500, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_id: $.data.id }
          trigger:
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/personnel"
              payload: { games_edition_id: "${ed_id}", full_name: "Dana Reyes", personnel_type: "OFFICIAL", certification_level: 3, certified_sport_codes: ["TRACK"] }
              as: GamesAdmin
              captures: { pers_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /senior-games/accommodation-blocks"
              payload: { games_edition_id: "${ed_id}", name: "Birch Hall", bed_capacity: 4, nightly_rate_cents: 11000 }
              as: GamesAdmin
              captures: { blk_id: $.data.id }
          assert:
            - "SportEvent.${ev_id}.accepted_entry_count == 0 and available_slots == 8, i.e. available_slots was seeded from capacity rather than from zero"
            - "Athlete.${ath_id}.fee_total_cents == 0, fee_paid_cents == 0 and fee_breakdown == {}, because the fee is only computed at pay-fees time"
            - "Athlete.${ath_id}.age_at_reference == 60, age_at_first_day == 60 and age_group_code == \"60-64\", all computed from date_of_birth alone"
            - "Personnel.${pers_id}.assigned_minutes_total == 0 and no_show_count == 0"
            - "SessionSlot.${slot_id}.confirmed_official_count == 0"
            - "AccommodationBlock.${blk_id}.reserved_bed_nights == 0"
            - "none of accepted_entry_count, available_slots, assigned_minutes_total, no_show_count, confirmed_official_count, reserved_bed_nights, fee_total_cents, fee_paid_cents or fee_breakdown appears in any §1.5 `input:` list"

      - name: corner_entity_system_fields_stamped_on_sport_create
        claim_type: System Fields
        grounds:
          - entities.Sport
          - endpoints[POST /sports]
        distinguishing_aspect: "The server mints id, created_at, updated_at and version == 1 on a common_fields entity; version reaches 2 only after a write that its state machine declares, and a plain read never bumps it."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id, ed_v1: $.data.version }
          trigger:
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id, sp_v1: $.data.version }
            - call: "GET /senior-games/sports/${sp_track_id}"
              payload: {}
              as: SportOfficial
              captures: { sp_v2: $.data.version }
          assert:
            - "Sport.${sp_track_id}.id is a server-minted identifier that appeared in no request payload"
            - "Sport.${sp_track_id}.created_at and updated_at are both populated ISO8601 instants"
            - "${sp_v1} == 1 on the create response"
            - "${sp_v2} == ${sp_v1}, so the read did not bump version"
            - "${ed_v1} == 1 as well, confirming version starts at 1 for every common_fields entity rather than at 0"

      - name: corner_entity_invalid_enum_personnel_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Personnel.fields.personnel_type
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A personnel_type outside {OFFICIAL, VOLUNTEER} and a certification_level outside 0..4 are both rejected at priority 10 with ERR_INVALID_REQUEST and HTTP 400, and no Personnel row is created."
        test_recipe:
          setup:
            - "One DRAFT GamesEdition on the standard fixture."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
