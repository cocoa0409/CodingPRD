      - name: one_officer_cannot_both_score_and_underwrite_the_same_household
        claim_type: segregation_of_duties
        grounds: ["validations[priority=18]", errors.ERR_SEGREGATION_OF_DUTIES, rbac.MortgageOfficer, "endpoints.POST /homeownership/mortgage-applications/{id}/approve"]
        excluded_because:
          difficulty_instance: segregation_priority_18_beats_subsidy_exhaustion_priority_38
          rationale: "That difficulty instance already drives the priority-18 identity check on all three of its declared endpoints and, on top of the plain refusal, proves it outranks the subsidy-exhaustion rule at priority 38, so a separate breadth probe of the same rule would add no distinct coverage."

  # ===========================================================================
  # SECTION 8 — From Cross-Cutting Complexity Layers
  # Only the three declared layers get rows. optimistic_concurrency is expanded
  # once per §1.2.1 rule; the other two layers are already carried in depth by
  # difficulty instances.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_mortgage_create_rejects_a_household_version_spent_by_a_credit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[mortgage-create-stale-household]", errors.ERR_STALE_HOUSEHOLD_VERSION, "validations[priority=9]", "endpoints.POST /homeownership/mortgage-applications", entities.ApplicantHousehold.fields.sweat_equity_credited_hours]
        distinguishing_aspect: "The household version guarding origination is spent by a write on a DIFFERENT aggregate — crediting a sweat equity entry bumps the parent household — so an officer holding the pre-credit version is refused with the rule's own 412 id, and the identical body succeeds after a fresh read. The refusal must not consume the version either: the retry uses the very next value."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household (composite 91.0) and a READY_TO_BUILD site appraised at 15000000. The household's single adult APPLICANT has one CLAIMED 6-hour CONSTRUCTION entry awaiting verification, and the household ledger is still at 0 credited hours."
