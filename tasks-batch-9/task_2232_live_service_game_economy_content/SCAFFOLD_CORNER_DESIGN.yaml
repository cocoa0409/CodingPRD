            - "Offer.${offer_id}.approval_status == IN_REVIEW"
            - "Player.${px_id}.spend_state == UNRESTRICTED"

      - name: corner_rbac_player_scoped_to_own_resources
        claim_type: Cannot perform other roles' exclusive_operations → ERR_UNAUTHORIZED
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Player
        distinguishing_aspect: |
          The Player role is owner-scoped by X-User-ID: reading another player's pacing or
          currency accounts and buying on another player's behalf all return
          ERR_NOT_RESOURCE_OWNER (403) at priority 6, ahead of the priority-7 concurrency check,
          while the same three calls against its own id succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer OWN_PACK (LIMITED_TIME, list 300, declared 400, HARD_GEM) is APPROVED and LIVE."
