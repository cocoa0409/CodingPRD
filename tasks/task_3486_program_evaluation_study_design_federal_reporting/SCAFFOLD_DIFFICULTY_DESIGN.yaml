  - rule_id: resource_temporal_overlap
    instances:
      - name: site_visit_gap_buffer_semantics
        grounds:
          - validations[priority=7]
          - errors[ERR_VISIT_WINDOW_CONFLICT]
          - entities.DataCollectionWave.fields.site_id
        distinguishing_aspect: |
          Buffered-gap interval semantics on the Site resource: two SITE_VISIT windows at
          the same site must neither overlap nor sit closer than SITE_VISIT_MIN_GAP_DAYS = 7
          days — a 5-day gap is rejected while an exactly-7-day gap passes (adjacency alone
          is NOT sufficient here, unlike the IRB sibling).
        test_recipe:
          setup:
            - "Study in RECRUITMENT with a LOCKED plan and site A RECRUITED"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
