  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: test_window_half_open_adjacency_versus_one_second_intersection
        grounds:
          - "§1.6 ERR_TEST_WINDOW_OVERLAP (409): 'POST /test-events whose half-open [window_start_at, window_end_at) intersects another non-FAILED_UNFILED test window of the same station'"
          - "§1.5 POST /test-events side effect 'half-open overlap check against the station's other non-FAILED_UNFILED test windows'"
          - "§1.1 TestEvent.window_start_at 'Inclusive start' and window_end_at 'Exclusive end ... for overlap arithmetic'"
          - "§1.4 priority 10 clock-relative window validation"
        distinguishing_aspect: "Overlap is decided on the half-open interval and scoped per station, so back-to-back windows that share an endpoint (…T00:00:00Z end == next start, and an earlier window ending exactly at te1's start) are BOTH accepted, while a window that intersects te1 by a single second and a window strictly inside te1 are both 409 — and the identical colliding window is accepted for a second station."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z so every candidate window is in the future."
            - "Plan KS 2026-R1 activated; two stations KWEA and KWEB on that plan."
            - "te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z) on KWEA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_a: "$.data.id" }
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEB", service_type: "FM", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_b: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_a}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
          trigger:
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_a}", test_type: "WEEKLY", window_start_at: "2026-08-11T23:00:00Z", window_end_at: "2026-08-12T00:00:00Z" }
              captures: { te_abuts_start: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_a}", test_type: "WEEKLY", window_start_at: "2026-08-12T01:00:00Z", window_end_at: "2026-08-12T02:00:00Z" }
              captures: { te_abuts_end: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_a}", test_type: "MONTHLY", window_start_at: "2026-08-12T00:59:59Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { err_one_second: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_a}", test_type: "MONTHLY", window_start_at: "2026-08-12T00:10:00Z", window_end_at: "2026-08-12T00:20:00Z" }
              captures: { err_contained: "$.data.error_id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_b}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te_other_station: "$.data.id" }
            - call: "GET /test-events/${te_abuts_end}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "te_abuts_start returns 201: its exclusive end 2026-08-12T00:00:00Z equals te1's inclusive start, so [23:00:00, 00:00:00) and [00:00:00, 01:00:00) do not intersect"
            - "te_abuts_end returns 201: its inclusive start 2026-08-12T01:00:00Z equals te1's EXCLUSIVE end, so the shared instant belongs to neither window"
            - "${err_one_second} == 'ERR_TEST_WINDOW_OVERLAP' with HTTP 409 — [00:59:59, 01:00:00) shares exactly the one second 00:59:59 with te1"
            - "${err_contained} == 'ERR_TEST_WINDOW_OVERLAP' with HTTP 409 — full containment is detected, not just endpoint touching"
            - "te_other_station returns 201 with the window that collides byte-for-byte with te1's — the check is scoped to the station"
            - "both accepted KWEA windows carry status == SCHEDULED and filing_deadline_at == window_end_at + 5 d: te_abuts_start -> 2026-08-17T00:00:00Z, te_abuts_end -> 2026-08-17T02:00:00Z"
            - "GET /test-events/${te_abuts_end} confirms filing_deadline_at == 2026-08-17T02:00:00Z and version == 1"

      - name: wea_phase_b_closed_buffered_window_and_fips_intersection_gate
        grounds:
          - "§1.3 calculations.duplicate_suppression_window PHASE B: 'window_B = [w.wea_sent_at - WEA_BUFFER_SECONDS, w.wea_sent_at + WEA_MATCH_SECONDS + WEA_BUFFER_SECONDS]  # both bounds inclusive' with 'a non-empty FIPS intersection is additionally required'"
          - "§1.3 constants WEA_MATCH_SECONDS 1800, WEA_BUFFER_SECONDS 120; precision 'whole-second timestamp comparison'"
          - "§1.1 AlertEvent.suppression_source {NONE, STATION_REPEAT, WIRELESS_NOTICE} and suppression_reference_alert_id"
          - "§1.5 POST /alert-events side effect 'calculations.relay_rule_selection (skipped when suppressed)'"
        distinguishing_aspect: "Phase B's window is CLOSED on both ends and buffered on both ends, so an alert at exactly wea_sent_at + 1800 + 120 and one at exactly wea_sent_at - 120 are both suppressed while one-second-outside probes are not, and a probe deep inside the window with a disjoint FIPS set is NOT suppressed — proving the interval test and the geographic test are conjunctive; every suppressed probe also carries suppression_reference_alert_id == null (unlike phase A) and skips the relay selector."
