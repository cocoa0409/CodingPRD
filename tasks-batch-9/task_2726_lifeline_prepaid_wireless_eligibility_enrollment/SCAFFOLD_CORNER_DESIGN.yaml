          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_AUDIT_SAMPLE_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: |
          Seven reads against an empty database with the SAME syntactically valid UUID prove
          the NOT_FOUND family is keyed on the addressed entity rather than a single generic
          code: the identical path id yields seven different error_ids, all 404, and none of
          them leaks the generic ERR_INVALID_REQUEST.
