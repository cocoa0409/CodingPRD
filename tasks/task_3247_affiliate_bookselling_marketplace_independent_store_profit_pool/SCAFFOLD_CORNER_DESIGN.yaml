# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3247_affiliate_bookselling_marketplace_independent_store_profit_pool
#
# Breadth probe over §1.1-§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Customer identity is an opaque literal handle (X-User-ID == order.customer_id).
# Priced lines are referenced by line_index. List/pool/ticket state is observed
# via action responses (no single-GET for BookList / ProfitPoolDistribution /
# Promotion / ServiceTicket).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: publisher_create_returns_declared_fields_and_active_default
        claim_type: Creation
        grounds:
          - "entities.Publisher"
          - "endpoints.POST_/bookshop/publishers"
        distinguishing_aspect: "POST with the five required fields returns 201 with status ACTIVE default, version 1, and system id/created_at/updated_at; status is never client-supplied."
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - &c_clock
              call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/publishers"
              payload: { name: "Corner Press", discount_pct: 0.45, returns_allowed: true, return_window_days: 60, return_credit_pct: 1.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
          assert:
            - "status 201, response_type object"
            - "Publisher.${pub_id}.status == ACTIVE and version == 1"
            - "discount_pct == 0.45, return_window_days == 60, return_credit_pct == 1.0"
            - "id, created_at, updated_at present and non-null; meta.api_request_id present"

      - name: store_create_applies_defaults_and_pending_onboarding_initial_state
        claim_type: Defaults
        grounds:
          - "entities.AffiliateStore"
          - "state_machines.AffiliateStore"
        distinguishing_aspect: "Omitting pool_opt_in and payout_threshold_cents applies defaults true and 2500; status starts PENDING_ONBOARDING, accrued_balance_cents 0, activated_at null."
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Default Books", slug: "default-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "AffiliateStore.${store_id}.pool_opt_in == true and payout_threshold_cents == 2500"
            - "status == PENDING_ONBOARDING, activated_at is null, accrued_balance_cents == 0, version == 1"

      - name: ebook_requires_rev_share_and_print_rejects_it
        claim_type: Type Constraints
        grounds:
          - "entities.Book.fields.ebook_partner_rev_share_pct"
          - "entities.Book.fields.format"
        distinguishing_aspect: "EBOOK without ebook_partner_rev_share_pct fails ERR_VALIDATION; PRINT carrying a non-null ebook_partner_rev_share_pct fails ERR_VALIDATION; format outside the enum fails ERR_VALIDATION."
        test_recipe:
          setup:
            - "Publisher exists."
          setup_api_calls:
            - *c_clock
            - &c_pub
              call: "POST /bookshop/publishers"
              payload: { name: "Corner Press", discount_pct: 0.45, returns_allowed: true, return_window_days: 60, return_credit_pct: 1.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001000", title: "NoShare", format: "EBOOK", list_price_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001001", title: "WrongShare", format: "PRINT", list_price_cents: 1000, ebook_partner_rev_share_pct: 0.25 }
              as: PlatformAdmin
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001002", title: "BadFormat", format: "HARDCOVER", list_price_cents: 1000 }
              as: PlatformAdmin
          assert:
            - "all three requests fail with 400 ERR_VALIDATION"
            - "no Book rows are created (GET /bookshop/publishers/${pub_id}/books returns an empty array)"

      - name: unknown_store_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.POST_/bookshop/stores/{id}/actions"
          - "errors.ERR_NOT_FOUND"
          - "validations[priority=4]"
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path produces 404 ERR_NOT_FOUND, not a state error and not 400."
        test_recipe:
          setup:
            - "Empty database; logical clock default."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /bookshop/stores/00000000-0000-0000-0000-000000000000/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
          assert:
            - "status 404 with error_id ERR_NOT_FOUND"

      - name: body_fk_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=5]"
          - "errors.ERR_REFERENCE_NOT_FOUND"
        distinguishing_aspect: "POST /bookshop/books with a publisher_id that does not exist returns 404 ERR_REFERENCE_NOT_FOUND (body FK), distinguishable from path 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /bookshop/books"
              payload: { publisher_id: "00000000-0000-0000-0000-000000000000", isbn: "9780000001003", title: "Orphan", format: "PRINT", list_price_cents: 1000 }
              as: PlatformAdmin
          assert:
            - "status 404 with error_id ERR_REFERENCE_NOT_FOUND"

      - name: ledger_entries_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET_/bookshop/ledger-entries"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "With three ledger entries (two orders + one pool distribution), limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; kind filter narrows the set."
        test_recipe:
          setup:
            - "Store created and ACTIVATED 2026-08-01 (so it is pool-eligible for the Aug 1..15 period); two placed orders (two ORDER_ACCRUAL entries); one distributed pool (one POOL_DISTRIBUTION entry)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_pub
            - &c_printbook
              call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001021", title: "Pipe Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - &c_store
              call: "POST /bookshop/stores"
              payload: { shop_name: "State Books", slug: "state-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_order1
              call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c1"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c1"
              captures: { order2_id: $.data.id }
            - call: "POST /bookshop/orders/${order2_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", pool_cents: 5000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { dist_v: $.data.version }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_v}" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "distribute" }
              as: FinanceOps
          trigger:
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}", limit: 2, offset: 0 }
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}", limit: 2, offset: 2 }
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}", kind: "POOL_DISTRIBUTION" }
              as: FinanceOps
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "kind=POOL_DISTRIBUTION filter returns exactly 1 row of 5000 (the store was 14 days ACTIVE in Aug 1..15, eligible, sole store)"
            - "default pagination: no limit/offset returns 3 rows with limit defaulting to 10 and offset 0"

      - name: priced_lines_computed_snapshot_ignores_client_supplied_prices
        claim_type: Computed Fields
        grounds:
          - "entities.BookOrder.fields.priced_lines"
          - "entities.BookOrder.fields.gross_cents"
        distinguishing_aspect: "The client cannot smuggle prices: the order create payload carries only {book_id, quantity} per line, and the placed order's priced_lines carry server-computed unit_price_cents from the catalog (100000), not anything client-influenced."
        test_recipe:
          setup:
            - "ACTIVE store, print book at 100000."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "place response priced_lines[0].unit_price_cents == 100000 (catalog price), line_total_cents == 100000, wholesale_unit_cents == 55000 (floor(100000*0.55) with the 0.45 Corner Press discount)"
            - "priced_lines[0].returned_quantity == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: store_activate_from_active_is_invalid
        claim_type: invalid_transition
        grounds:
          - "state_machines.AffiliateStore"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "activate on an already-ACTIVE store fails 409 ERR_INVALID_STATE; no version bump, activated_at unchanged."
        test_recipe:
          setup:
            - "ACTIVE store (activated once)."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "409 ERR_INVALID_STATE"
            - "store remains ACTIVE with version == 2 (create 1 + first activate 2)"

      - name: deactivated_store_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.AffiliateStore.terminal_states"
        distinguishing_aspect: "DEACTIVATED rejects activate/suspend/reactivate/deactivate with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "ACTIVE store with zero balance deactivated."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "deactivate" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "reactivate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "suspend" }
              as: PlatformAdmin
          assert:
            - "both attempts fail 409 ERR_INVALID_STATE; store stays DEACTIVATED"

      - name: partner_reject_is_terminal_and_approve_after_reject_fails
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.AffiliatePartner"
        distinguishing_aspect: "REJECTED partner cannot be approved or activated; only APPLIED can move to APPROVED or REJECTED."
        test_recipe:
          setup:
            - "APPLIED partner rejected."
          setup_api_calls:
            - *c_clock
            - &c_partner
              call: "POST /bookshop/partners"
              payload: { display_name: "Terminal Author", partner_kind: "AUTHOR", commission_pct: 0.10 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "reject" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
          assert:
            - "both fail 409 ERR_INVALID_STATE; partner stays REJECTED"

      - name: approved_partner_cannot_be_attributed_until_active
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AffiliatePartner"
          - "validations[priority=9]"
        distinguishing_aspect: "APPROVED (not yet ACTIVE) partner attribution fails place with 422 ERR_AFFILIATE_NOT_ACTIVE — APPROVED and ACTIVE are distinct gate states."
        test_recipe:
          setup:
            - "Partner APPROVED only. Ebook, DRAFT order attributed to the partner."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - &c_ebook
              call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001020", title: "Gate Ebook", format: "EBOOK", list_price_cents: 20000, ebook_partner_rev_share_pct: 0.25 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - *c_partner
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c2"
                attributed_partner_id: "${partner_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c2"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c2"
          assert:
            - "422 ERR_AFFILIATE_NOT_ACTIVE; order remains DRAFT / PENDING"

      - name: order_dispatch_requires_placed_and_ship_requires_dispatch
        claim_type: invalid_transition
        grounds:
          - "state_machines.BookOrder"
        distinguishing_aspect: "Skipping the pipeline fails at each hop: dispatch on DRAFT, ship on PLACED, deliver on SENT_TO_WHOLESALER all 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "ACTIVE store, print book, DRAFT order (never placed)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
          assert:
            - "all three fail 409 ERR_INVALID_STATE (order is DRAFT)"
            - "order remains DRAFT / PENDING"

      - name: list_archive_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.BookList"
        distinguishing_aspect: "ARCHIVED is terminal: publish/unpublish/archive from ARCHIVED all fail 409."
        test_recipe:
          setup:
            - "ACTIVE store owns a DRAFT list with one item; list archived from DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - &c_list
              call: "POST /bookshop/lists"
              payload:
                owner_store_id: "${store_id}"
                title: "Archived Picks"
                items:
                  - book_id: "${book_id}"
                    position: 1
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { list_id: $.data.id }
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "archive" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "unpublish" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "both fail 409 ERR_INVALID_STATE; list stays ARCHIVED with publish_count == 0"

      - name: return_reject_terminal_then_receive_or_credit_fails
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.ReturnRequest"
        distinguishing_aspect: "REJECTED return cannot be received or credited; the order's refunded/retained amounts stay untouched."
        test_recipe:
          setup:
            - "Delivered order; return REQUESTED then REJECTED."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "UNWANTED" }
              as: Customer
              as_user_id: "cust-c1"
              captures: { return_id: $.data.id }
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "reject" }
              as: CustomerService
          trigger:
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "receive" }
              as: WholesalerOps
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "credit" }
              as: FinanceOps
            - call: "GET /bookshop/orders/${order_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "both fail 409 ERR_INVALID_STATE; return stays REJECTED"
            - "order refunded_cents stays 0 and retained_cents stays 100000"

      - name: pool_void_terminal_and_double_distribute_fails
        claim_type: idempotency
        grounds:
          - "state_machines.ProfitPoolDistribution"
        distinguishing_aspect: "VOID distribution rejects calculate; a DISTRIBUTED distribution rejects a second distribute — no double ledger writes."
        test_recipe:
          setup:
            - "Two DRAFT distributions for disjoint periods; one voided, one carried to DISTRIBUTED."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_v: $.data.id }
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-08-31T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_d: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_v}/actions"
              payload: { action: "void" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_d}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { dist_ver: $.data.version }
            - call: "POST /bookshop/pool-distributions/${dist_d}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_ver}" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_d}/actions"
              payload: { action: "distribute" }
              as: FinanceOps
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_v}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_d}/actions"
              payload: { action: "distribute" }
              as: FinanceOps
          assert:
            - "calculate on VOID fails 409 ERR_INVALID_STATE"
            - "second distribute on DISTRIBUTED fails 409 ERR_INVALID_STATE"
            - "GET /bookshop/ledger-entries?pool_distribution_id=${dist_v} returns zero rows"

      - name: ticket_reopen_window_boundary
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceTicket.RESOLVED_to_REOPENED"
          - "errors.ERR_WINDOW_NOT_SATISFIED"
        distinguishing_aspect: "reopen at resolved_at + 14 days exactly succeeds (<= boundary); at +15 days fails 422 ERR_WINDOW_NOT_SATISFIED."
        test_recipe:
          setup:
            - "Placed order (no delivery needed for tickets) with a RESOLVED ticket at 2026-09-01; second ticket resolved the same day for the expired-arm probe."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/tickets"
              payload: { order_id: "${order_id}", opened_by_customer_id: "cust-c1", issue_kind: "BILLING" }
              as: Customer
              as_user_id: "cust-c1"
              captures: { ticket_ok: $.data.id }
            - call: "POST /bookshop/tickets"
              payload: { order_id: "${order_id}", opened_by_customer_id: "cust-c1", issue_kind: "LATE_SHIPMENT" }
              as: Customer
              as_user_id: "cust-c1"
              captures: { ticket_late: $.data.id }
            - call: "POST /bookshop/tickets/${ticket_ok}/actions"
              payload: { action: "assign" }
              as: CustomerService
            - call: "POST /bookshop/tickets/${ticket_ok}/actions"
              payload: { action: "resolve", resolution_note: "credited" }
              as: CustomerService
            - call: "POST /bookshop/tickets/${ticket_late}/actions"
              payload: { action: "assign" }
              as: CustomerService
            - call: "POST /bookshop/tickets/${ticket_late}/actions"
              payload: { action: "resolve", resolution_note: "apologized" }
              as: CustomerService
          trigger:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/tickets/${ticket_ok}/actions"
              payload: { action: "reopen" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/tickets/${ticket_late}/actions"
              payload: { action: "reopen" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "reopen at exactly resolved_at + 14 days (Sep 15) succeeds: 200, status REOPENED"
            - "reopen at +15 days (Sep 16) fails 422 ERR_WINDOW_NOT_SATISFIED; ticket stays RESOLVED"

      - name: promotion_clock_transitions_observed_through_pricing
        claim_type: valid_transition
        grounds:
          - "state_machines.Promotion"
        distinguishing_aspect: "Promotion state is observable through line pricing: an order placed while the promotion is SCHEDULED (clock before window_start) pays full price; after the clock enters the window the same book prices at the discount; after window_end it reverts to full price."
        test_recipe:
          setup:
            - "ACTIVE store, 10000-cent print book, promotion Sep 5..Sep 10 at 10%. Clock starts Sep 1 (promo SCHEDULED). Three identical orders placed at Sep 1, Sep 5, Sep 11."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001030", title: "PB1", format: "PRINT", list_price_cents: 10000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000001030", discount_pct: 0.10, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { promo1: $.data.id }
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c1"
              captures: { order2_id: $.data.id }
            - call: "POST /bookshop/orders/${order2_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c1"
              captures: { order3_id: $.data.id }
          trigger:
            - call: "POST /bookshop/orders/${order3_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "promotion create response (clock Sep 1) showed status SCHEDULED"
            - "order 1 (placed Sep 1): priced_lines[0].unit_price_cents == 10000 (promo SCHEDULED, not applied)"
            - "order 2 (placed Sep 5): priced_lines[0].unit_price_cents == 9000 (promo ACTIVE, floor(10000*0.10)=1000 off)"
            - "order 3 (placed Sep 11): priced_lines[0].unit_price_cents == 10000 (promo ENDED after window_end)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: digital_commission_uses_rev_share_not_wholesale_discount
        claim_type: constants_applied
        grounds:
          - "calculations.order_commission_accrual"
          - "calculations.line_pricing"
        distinguishing_aspect: "EBOOK leg: platform_keeps floor(20000*0.25)=5000, commission floor(15000*0.30)=4500 for a store, wholesale cost basis floor(20000*0.30)=6000 — the publisher discount_pct (0.50) does NOT apply to digital lines."
        test_recipe:
          setup:
            - "Publisher with discount_pct 0.50 (would halve a PRINT price). Ebook 20000 rev share 0.25. ACTIVE store commission 0.30, threshold 20000 (no payout). Order of 1 ebook."
          setup_api_calls:
            - *c_clock
            - call: "POST /bookshop/publishers"
              payload: { name: "Half Press", discount_pct: 0.50, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - *c_ebook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "place response priced_lines[0].wholesale_unit_cents == 6000 (0.30 cost basis, NOT 10000 from the 0.50 publisher discount)"
            - "commission_cents == 4500 (store rate on post-share net)"
            - "platform_margin_cents == 20000 - 5000 - 4500 == 10500"

      - name: pool_weighted_zero_total_weight_falls_back_to_equal_split
        claim_type: input_set_filtering
        grounds:
          - "calculations.pool_share"
        distinguishing_aspect: "SALES_WEIGHTED with no DELIVERED orders in the period (total_weight == 0) falls back to EQUAL_SPLIT arithmetic — the fallback branch, not an error."
        test_recipe:
          setup:
            - "Two stores activated 2026-09-01, no orders at all. SALES_WEIGHTED pool 40001 for the elapsed Sep 1..Sep 15 period."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Second Books", slug: "second-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /bookshop/stores/${store2_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", pool_cents: 40001, share_mode: "SALES_WEIGHTED" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { share_lines: $.data.share_lines, remainder: $.data.remainder_cents }
          assert:
            - "both stores eligible (14 whole ACTIVE days: Sep 1..14)"
            - "total_weight == 0 triggers EQUAL_SPLIT fallback: floor(40001/2) == 20000 each, remainder 1 to earliest-created store"
            - "earliest store (State Books) share_cents == 20001, other == 20000, remainder_cents == 1"

      - name: pool_excludes_opted_out_and_deactivated_stores_from_candidate_set
        claim_type: input_set_filtering
        grounds:
          - "calculations.pool_eligibility"
          - "entities.AffiliateStore.fields.pool_opt_in"
        distinguishing_aspect: "Stores with pool_opt_in false and DEACTIVATED stores produce NO share-line entries at all — excluded from the candidate set, not merely marked ineligible."
        test_recipe:
          setup:
            - "Store IN (opted in, activated Sep 1), store OUT (pool_opt_in false, activated Sep 1), store GONE (activated Sep 1, deactivated with zero balance). Elapsed Sep 1..Sep 15 period, EQUAL_SPLIT 28000."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Out Books", slug: "out-books", commission_pct: 0.20, pool_opt_in: false }
              as: PlatformAdmin
              captures: { store_out: $.data.id }
            - call: "POST /bookshop/stores/${store_out}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Gone Books", slug: "gone-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store_gone: $.data.id }
            - call: "POST /bookshop/stores/${store_gone}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_gone}/actions"
              payload: { action: "deactivate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", pool_cents: 28000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { share_lines: $.data.share_lines, eligible_count: $.data.eligible_store_count }
          assert:
            - "share_lines has exactly 1 entry: store IN with share_cents == 28000, eligible == true"
            - "no entries for store OUT or store GONE"
            - "eligible_store_count == 1"

      - name: suspended_days_do_not_count_toward_pool_eligibility
        claim_type: correct_result
        grounds:
          - "calculations.pool_eligibility"
        distinguishing_aspect: "A store activated Sep 1, suspended Sep 8, reactivated Sep 15 has only 7 whole ACTIVE days in Sep 1..Sep 15 and is ineligible despite being ACTIVE at calculate time."
        test_recipe:
          setup:
            - "Store activated 2026-09-01T00:00:00Z, suspended 2026-09-08T00:00:00Z, reactivated 2026-09-15T00:00:00Z. Period Sep 1..Sep 15."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "suspend" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "reactivate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { share_lines: $.data.share_lines, eligible_count: $.data.eligible_store_count }
          assert:
            - "the store's share line has eligible == false and share_cents == 0 (only Sep 1-7 count: 7 < 14)"
            - "eligible_store_count == 0 and remainder_cents == 0"

  # ===========================================================================
  - section: validations
    instances:

      - name: attribution_xor_both_set_and_neither_set
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors.ERR_ATTRIBUTION_AMBIGUOUS"
        distinguishing_aspect: "Order with both attributed_store_id and attributed_partner_id, or with neither, fails 422 ERR_ATTRIBUTION_AMBIGUOUS."
        test_recipe:
          setup:
            - "ACTIVE store, ACTIVE partner, print book."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_partner
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c3"
                attributed_store_id: "${store_id}"
                attributed_partner_id: "${partner_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c3"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c3"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c3"
          assert:
            - "both requests fail 422 ERR_ATTRIBUTION_AMBIGUOUS"
            - "GET /bookshop/orders?customer_id=cust-c3 returns zero rows"

      - name: list_attribution_requires_published_and_owned
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors.ERR_LIST_ATTRIBUTION_MISMATCH"
        distinguishing_aspect: "source_list_id fails when (a) the list is DRAFT, (b) the list is PUBLISHED but owned by a different store, or (c) the order is partner-attributed."
        test_recipe:
          setup:
            - "Stores A and B ACTIVE; A owns DRAFT list L1 and B owns PUBLISHED list L2; ACTIVE partner."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Other Books", slug: "other-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store_b: $.data.id }
            - call: "POST /bookshop/stores/${store_b}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_list
            - call: "POST /bookshop/lists"
              payload:
                owner_store_id: "${store_b}"
                title: "Other Picks"
                items:
                  - book_id: "${book_id}"
                    position: 1
              as: StoreManager
              as_user_id: "${store_b}"
              captures: { list_b: $.data.id }
            - call: "POST /bookshop/lists/${list_b}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_b}"
            - *c_partner
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c4"
                attributed_store_id: "${store_id}"
                source_list_id: "${list_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c4"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c4"
                attributed_store_id: "${store_id}"
                source_list_id: "${list_b}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c4"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c4"
                attributed_partner_id: "${partner_id}"
                source_list_id: "${list_b}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c4"
          assert:
            - "order via DRAFT list L1: 422 ERR_LIST_ATTRIBUTION_MISMATCH (not PUBLISHED)"
            - "order via B's published list L2 attributed to A: 422 ERR_LIST_ATTRIBUTION_MISMATCH (owner mismatch)"
            - "partner-attributed order with any source_list: 422 ERR_LIST_ATTRIBUTION_MISMATCH"

      - name: commercial_terms_band_enforcement
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
          - "errors.ERR_COMMERCIAL_TERMS_INVALID"
        distinguishing_aspect: "Store commission 0.31 (> 0.30) and partner commission 0.04 (< 0.05) rejected; partner threshold 999 below the 1000 floor rejected; pool_cents 0 rejected — all 422 ERR_COMMERCIAL_TERMS_INVALID."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Greedy Books", slug: "greedy-books", commission_pct: 0.31 }
              as: PlatformAdmin
            - call: "POST /bookshop/partners"
              payload: { display_name: "Cheap Author", partner_kind: "AUTHOR", commission_pct: 0.04 }
              as: PlatformAdmin
            - call: "POST /bookshop/partners"
              payload: { display_name: "Low Floor", partner_kind: "AUTHOR", commission_pct: 0.10, payout_threshold_cents: 999 }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 0, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
          assert:
            - "all four requests fail 422 ERR_COMMERCIAL_TERMS_INVALID"

      - name: store_deactivate_blocked_by_outstanding_balance
        claim_type: violation_to_error
        grounds:
          - "validations[priority=19]"
          - "errors.ERR_STORE_SETTLEMENT_OUTSTANDING"
        distinguishing_aspect: "Store with accrued_balance > 0 cannot deactivate (422 ERR_STORE_SETTLEMENT_OUTSTANDING); after the payout is marked paid and balance returns to 0, deactivate succeeds."
        test_recipe:
          setup:
            - "ACTIVE store (default threshold 2500) with 13800 accrued from a placed order; payout PENDING 13800."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Settle Books", slug: "settle-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
              captures: { payout_id: "$.data[0].id" }
          trigger:
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "deactivate" }
              as: PlatformAdmin
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "mark-paid" }
              as: FinanceOps
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "deactivate" }
              as: PlatformAdmin
          assert:
            - "first deactivate: 422 ERR_STORE_SETTLEMENT_OUTSTANDING (balance 13800 and PENDING payout)"
            - "after mark-paid: balance == 0 and second deactivate succeeds (200, status DEACTIVATED)"

      - name: return_quantity_exceeds_unreturned_balance
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "errors.ERR_RETURN_QUANTITY_EXCEEDED"
        distinguishing_aspect: "Line quantity 2 with 1 already credited: a return of 2 more fails 422 ERR_RETURN_QUANTITY_EXCEEDED; a return of exactly 1 succeeds."
        test_recipe:
          setup:
            - "Delivered order quantity 2; one return of 1 already CREDITED. Publisher window 60 days."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c5"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 2
              as: Customer
              as_user_id: "cust-c5"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c5"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-c5"
              captures: { return1: $.data.id }
            - call: "POST /bookshop/returns/${return1}/actions"
              payload: { action: "approve" }
              as: CustomerService
            - call: "POST /bookshop/returns/${return1}/actions"
              payload: { action: "receive" }
              as: WholesalerOps
            - call: "POST /bookshop/returns/${return1}/actions"
              payload: { action: "credit" }
              as: FinanceOps
          trigger:
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 2, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-c5"
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-c5"
              captures: { return2: $.data.id }
          assert:
            - "quantity 2 rejected: 422 ERR_RETURN_QUANTITY_EXCEEDED (unreturned balance is 1)"
            - "quantity 1 accepted: 201, ReturnRequest.${return2}.status == REQUESTED"

      - name: digital_unwanted_return_rejected_outright
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors.ERR_RETURN_WINDOW_CLOSED"
        distinguishing_aspect: "EBOOK return with reason UNWANTED fails 422 ERR_RETURN_WINDOW_CLOSED even one minute after delivery; DAMAGED on the same ebook succeeds."
        test_recipe:
          setup:
            - "Delivered ebook order (quantity 2). Clock 1 minute after delivered_at."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_ebook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c6"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 2
              as: Customer
              as_user_id: "cust-c6"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c6"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "UNWANTED" }
              as: Customer
              as_user_id: "cust-c6"
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-c6"
              captures: { return_ok: $.data.id }
          assert:
            - "UNWANTED ebook return: 422 ERR_RETURN_WINDOW_CLOSED (digital formats have no change-of-mind returns)"
            - "DAMAGED ebook return: 201 REQUESTED"

      - name: pool_calculate_before_period_end_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors.ERR_WINDOW_NOT_SATISFIED"
        distinguishing_aspect: "calculate while logical clock < period_end fails 422; at exactly period_end it succeeds (inclusive boundary)."
        test_recipe:
          setup:
            - "DRAFT distribution for period Aug 1..Aug 15; clock at Aug 14 (too early), then exactly Aug 15."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
          assert:
            - "first calculate (clock Aug 14 < period_end Aug 15): 422 ERR_WINDOW_NOT_SATISFIED"
            - "second calculate (clock == period_end exactly): 200 CALCULATED (inclusive boundary)"

      - name: uniqueness_conflicts_isbn_slug
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors.ERR_VALIDATION"
        distinguishing_aspect: "Duplicate ISBN and duplicate store slug each fail 400 ERR_VALIDATION; slug comparison is lowercase-normalized."
        test_recipe:
          setup:
            - "One book with ISBN 9780000001040, one store slug unique-books."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001040", title: "First", format: "PRINT", list_price_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Unique Books", slug: "unique-books", commission_pct: 0.20 }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001040", title: "Second", format: "PRINT", list_price_cents: 2000 }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Other Shop", slug: "Unique-Books", commission_pct: 0.20 }
              as: PlatformAdmin
          assert:
            - "both fail 400 ERR_VALIDATION (duplicate ISBN; slug conflict after lowercase normalization)"

      - name: occ_stale_version_on_pool_approve
        claim_type: priority_ordering
        grounds:
          - "validations[priority=8]"
          - "concurrency_rules[pool-approve-stale-version]"
          - "errors.ERR_STALE_VERSION"
        distinguishing_aspect: "approve carrying expected_distribution_version one behind the current version returns 412 ERR_STALE_VERSION; the current version succeeds. OCC payloads always carry a captured version, never a literal."
        test_recipe:
          setup:
            - "One store created and activated 2026-08-01 (exactly 14 whole ACTIVE days in Aug 1..15, eligible). DRAFT distribution for the elapsed period, calculated once (version now 2; single eligible store takes the full 10000 so the sum invariant holds)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "OCC Books", slug: "occ-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id, dist_v1: $.data.version }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { dist_v2: $.data.version }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_v1}" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_v2}" }
              as: FinanceOps
          assert:
            - "stale approve (version 1 vs current 2): 412 ERR_STALE_VERSION"
            - "fresh approve (version 2): 200 APPROVED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_default_is_fixed_startup_time
        claim_type: conditional_action
        grounds:
          - "endpoints.POST_/bookshop/_clock/set_current_utc"
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a promotion whose window starts at that instant is ACTIVE on its own create response without any clock call."
        test_recipe:
          setup:
            - "Empty database; no clock call ever made."
          setup_api_calls:
            - *c_pub
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000001050", title: "Clock Book", format: "PRINT", list_price_cents: 5000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000001050", discount_pct: 0.10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { promo_id: $.data.id }
          assert:
            - "Promotion.${promo_id}.status == ACTIVE on the create response (default clock 2026-09-01T00:00:00Z is inside the closed window) — no set_current_utc was ever called"

      - name: payout_actions_by_non_finance_roles_rejected
        claim_type: conditional_action
        grounds:
          - "endpoints.POST_/bookshop/payouts/{id}/actions"
        distinguishing_aspect: "Only FinanceOps may run payout actions; CustomerService and PlatformAdmin both get 403 ERR_UNAUTHORIZED on process."
        test_recipe:
          setup:
            - "Store with a PENDING payout from a placed order (default threshold 2500)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Rolemap Books", slug: "rolemap-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
              captures: { payout_id: "$.data[0].id" }
          trigger:
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: CustomerService
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: PlatformAdmin
          assert:
            - "both fail 403 ERR_UNAUTHORIZED"
            - "GET /bookshop/payouts/${payout_id} shows status PENDING"

      - name: return_receive_and_credit_role_map
        claim_type: conditional_action
        grounds:
          - "endpoints.POST_/bookshop/returns/{id}/actions"
        distinguishing_aspect: "receive is WholesalerOps-only and credit is FinanceOps-only: cross-role attempts fail 403 even when the state precondition would pass."
        test_recipe:
          setup:
            - "APPROVED return on a delivered order."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-c1"
              captures: { return_id: $.data.id }
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "approve" }
              as: CustomerService
          trigger:
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "receive" }
              as: FinanceOps
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "receive" }
              as: WholesalerOps
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "credit" }
              as: WholesalerOps
          assert:
            - "receive as FinanceOps: 403 ERR_UNAUTHORIZED"
            - "receive as WholesalerOps: 200 RECEIVED"
            - "credit as WholesalerOps: 403 ERR_UNAUTHORIZED (return stays RECEIVED)"

      - name: order_dispatch_by_non_wholesaler_roles_rejected
        claim_type: conditional_action
        grounds:
          - "endpoints.POST_/bookshop/orders/{id}/actions"
        distinguishing_aspect: "The same endpoint serves three role lanes: place (owning Customer), cancel (Customer or CustomerService), dispatch/ship/deliver (WholesalerOps). A StoreManager dispatch and a Customer dispatch both fail 403."
        test_recipe:
          setup:
            - "Placed order owned by cust-c1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "both fail 403 ERR_UNAUTHORIZED (role map: dispatch is WholesalerOps-only)"
            - "order stays PLACED"

  # ===========================================================================
  - section: errors
    instances:

      - name: err_invalid_state_on_terminal_entities
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_INVALID_STATE"
        excluded_because:
          difficulty_instance: "non_linear_state_machine / booklist_publish_unpublish_republish_cycle_increments_publish_count"
          rationale: "Terminal and from-state rejections are exercised across the §1.8 state-machine instances and the corner invalid_transition / terminal_lockdown probes above."

      - name: err_affiliate_not_active_on_payout_process
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_AFFILIATE_NOT_ACTIVE"
          - "state_machines.Payout.PENDING_to_PROCESSING"
        distinguishing_aspect: "A payout whose affiliate was suspended after the payout opened cannot enter PROCESSING: 422 ERR_AFFILIATE_NOT_ACTIVE; after reactivation the same payout processes."
        test_recipe:
          setup:
            - "ACTIVE store with a PENDING payout of 13800; store then suspended."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Suspend Books", slug: "suspend-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "suspend" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "reactivate" }
              as: PlatformAdmin
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
          assert:
            - "process while store SUSPENDED: 422 ERR_AFFILIATE_NOT_ACTIVE; payout stays PENDING"
            - "after reactivation: process succeeds (200 PROCESSING)"

      - name: err_list_not_publishable_on_empty_list
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_LIST_NOT_PUBLISHABLE"
          - "validations[priority=20]"
        distinguishing_aspect: "A DRAFT list with zero items cannot publish: 422 ERR_LIST_NOT_PUBLISHABLE."
        test_recipe:
          setup:
            - "ACTIVE store owns an empty DRAFT list."
          setup_api_calls:
            - *c_clock
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/lists"
              payload: { owner_store_id: "${store_id}", title: "Empty Picks", items: [] }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { list_id: $.data.id }
          trigger:
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "422 ERR_LIST_NOT_PUBLISHABLE; list stays DRAFT with publish_count == 0"

      - name: err_pool_sum_mismatch_when_no_eligible_stores
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_POOL_SUM_MISMATCH"
          - "validations[priority=18]"
        distinguishing_aspect: "With zero eligible stores, EQUAL_SPLIT produces share_cents summing to 0 != pool_cents; approve fails 422 ERR_POOL_SUM_MISMATCH even with the correct OCC version."
        test_recipe:
          setup:
            - "One pool_opt_in=false store only. Calculated distribution for an elapsed period."
          setup_api_calls:
            - *c_clock
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Opted Out", slug: "opted-out", commission_pct: 0.20, pool_opt_in: false }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { dist_v: $.data.version }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_v}" }
              as: FinanceOps
          assert:
            - "422 ERR_POOL_SUM_MISMATCH (share_lines empty, sum 0 != 10000)"
            - "distribution stays CALCULATED"

  # ===========================================================================
  - section: rbac
    instances:

      - name: store_manager_cannot_touch_other_stores_list
        claim_type: rbac_denial
        grounds:
          - "roles.StoreManager"
          - "validations[priority=3]"
          - "errors.ERR_FORBIDDEN_OWNER_MISMATCH"
        distinguishing_aspect: "StoreManager of store A gets 403 ERR_FORBIDDEN_OWNER_MISMATCH when publishing a list owned by store B (entity_backed identity check), distinct from 403 ERR_UNAUTHORIZED role gating."
        test_recipe:
          setup:
            - "Stores A and B ACTIVE; B owns a DRAFT list with one item."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Other Books", slug: "other-books", commission_pct: 0.20 }
              as: PlatformAdmin
              captures: { store_b: $.data.id }
            - call: "POST /bookshop/stores/${store_b}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/lists"
              payload:
                owner_store_id: "${store_b}"
                title: "B Picks"
                items:
                  - book_id: "${book_id}"
                    position: 1
              as: StoreManager
              as_user_id: "${store_b}"
              captures: { list_b: $.data.id }
          trigger:
            - call: "POST /bookshop/lists/${list_b}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "403 ERR_FORBIDDEN_OWNER_MISMATCH (X-User-ID store A != owner store B)"
            - "list stays DRAFT"

      - name: customer_cannot_open_return_on_another_customers_order
        claim_type: rbac_denial
        grounds:
          - "roles.Customer"
          - "validations[priority=3]"
        distinguishing_aspect: "Customer cust-x opening a return against cust-c1's delivered order fails 403 ERR_FORBIDDEN_OWNER_MISMATCH (opaque-handle ownership: X-User-ID must equal order.customer_id)."
        test_recipe:
          setup:
            - "Delivered order belonging to cust-c1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
          trigger:
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-x"
          assert:
            - "403 ERR_FORBIDDEN_OWNER_MISMATCH"
            - "GET /bookshop/orders/${order_id}/returns returns zero rows"

      - name: missing_role_header_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors.ERR_UNAUTHENTICATED"
        distinguishing_aspect: "A request with no X-User-Role header fails 401 ERR_UNAUTHENTICATED, taking priority over every other check including 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /bookshop/stores/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: null
          assert:
            - "401 ERR_UNAUTHENTICATED (auth check precedes the 404 existence check)"

      - name: partner_and_customer_cannot_write_admin_resources
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "validations[priority=2]"
        distinguishing_aspect: "Partner cannot create stores (403), Customer cannot create publishers (403), StoreManager cannot dispatch orders (403) — role gating at priority 2 precedes existence checks."
        test_recipe:
          setup:
            - "One partner and one store exist."
          setup_api_calls:
            - *c_clock
            - *c_partner
            - *c_store
          trigger:
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Illegal", slug: "illegal", commission_pct: 0.20 }
              as: Partner
              as_user_id: "${partner_id}"
            - call: "POST /bookshop/publishers"
              payload: { name: "Illegal Press", discount_pct: 0.40, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: Customer
              as_user_id: "cust-c9"
          assert:
            - "both fail 403 ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: derived_balance_reconciles_after_clawback
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.AffiliateStore.fields.accrued_balance_cents"
        excluded_because:
          difficulty_instance: "transitive_cascade / return_credit_cascades_line_order_ledger_balance"
          rationale: "Balance reconciliation after clawback is the terminal assert of the named §1.8 cascade instance."

      - name: payout_no_duplicate_open_per_affiliate
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.payout_release"
        distinguishing_aspect: "A second accrual while a payout is PENDING does NOT open a second payout; the affiliate carries at most one PENDING/PROCESSING payout at a time."
        test_recipe:
          setup:
            - "Store with default threshold 2500. Order 1 placed (balance 13800, payout P1 opened). Order 2 placed (balance 27600)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Dup Books", slug: "dup-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-c1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-c1"
              captures: { order2_id: $.data.id }
          trigger:
            - call: "POST /bookshop/orders/${order2_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "exactly ONE payout exists for the store, amount frozen at 13800 (opened by the first accrual)"
            - "store accrued_balance_cents == 27600 (the second accrual stacks on top while the payout is open)"

      - name: immediate_consistency_on_action_response
        claim_type: consistency_immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "The place response itself carries the updated payment_status PAID, fulfillment PLACED, and computed gross/commission fields — no re-read needed (immediate consistency)."
        test_recipe:
          setup:
            - "ACTIVE store, print book 100000 (publisher discount 0.45), DRAFT order."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_printbook
            - *c_store
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - *c_order1
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-c1"
          assert:
            - "the 200 response body shows payment_status == PAID, fulfillment_status == PLACED"
            - "gross_cents == 100000, wholesale_cost_cents == 55000, commission_cents == floor((100000-55000)*0.30) == 13500, platform_margin_cents == 31500 in the same response"
