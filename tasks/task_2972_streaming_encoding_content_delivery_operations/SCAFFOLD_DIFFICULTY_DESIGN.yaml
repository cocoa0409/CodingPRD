            - "Title.${t_id}.readiness_score_provisional == 70.00"

  - rule_id: resource_temporal_overlap
    instances:

      - name: live_reservation_buffer_closed_interval_capacity
        grounds:
          - calculations.vendor_capacity_availability
          - entities.LiveEventReservation.fields.buffer_minutes
          - validations[priority=19]
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Reservation intervals are CLOSED and inflated by buffer_minutes on both ends, so a request
          starting at 22:30 with a 15-minute buffer TOUCHES the incumbent's inflated end at 22:15 and is
          aggregated against it (rejected), while starting one minute later at 22:31 does not touch it
          and is accepted. This is interval geometry A on CdnVendor capacity; the sibling instance uses
          half-open geometry B on AvailabilityWindow.
        test_recipe:
          setup:
            - "Vendor ALPHA serves US with committed_gbps 60.00."
            - "Title TTL-BUFFER-01 has content_type LIVE_EVENT and a SCHEDULED US window covering 2026-09-01 to 2026-11-01."
            - "An incumbent reservation holds ALPHA's entire 60.00 Gbps over 2026-09-10T18:00:00Z..22:00:00Z with buffer_minutes 15, so its inflated interval is 17:45..22:15."
          setup_api_calls:
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0250 }
              as: PlatformAdmin
              captures: { v_alpha_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-BUFFER-01", title_name: "Buffer Geometry Event", content_type: "LIVE_EVENT", studio_code: "NOVASPORT" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T18:00:00Z", window_end_at: "2026-09-10T22:00:00Z", reserved_gbps: 60.00, buffer_minutes: 15 }
              as: DeliveryEngineer
              captures: { r_incumbent_id: $.data.id }
          trigger:
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T22:30:00Z", window_end_at: "2026-09-11T00:30:00Z", reserved_gbps: 20.00, buffer_minutes: 15 }
              as: DeliveryEngineer
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", window_start_at: "2026-09-10T22:31:00Z", window_end_at: "2026-09-11T00:31:00Z", reserved_gbps: 20.00, buffer_minutes: 15 }
              as: DeliveryEngineer
              captures: { r_ok_id: $.data.id }
          assert:
            - "the first trigger call returns 422 with error_id ERR_VENDOR_CAPACITY_EXCEEDED because the inflated intervals touch at exactly 2026-09-10T22:15:00Z"
            - "after the first trigger call CdnVendor.${v_alpha_id}.reserved_gbps == 60.00"
            - "the second trigger call returns 201 and LiveEventReservation.${r_ok_id}.reserved_gbps == 20.00"
            - "LiveEventReservation.${r_ok_id}.buffer_minutes == 15 and LiveEventReservation.${r_ok_id}.state == RESERVED"
            - "CdnVendor.${v_alpha_id}.reserved_gbps == 80.00, which legitimately exceeds committed_gbps 60.00 because the two holds occupy disjoint inflated intervals"
            - "LiveEventReservation.${r_incumbent_id}.state == RESERVED and LiveEventReservation.${r_incumbent_id}.reserved_gbps == 60.00"

      - name: availability_window_half_open_adjacency
        grounds:
          - calculations.availability_window_overlap
          - validations[priority=16]
          - errors.ERR_WINDOW_OVERLAP
          - state_machines.AvailabilityWindow.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          AvailabilityWindow intervals are HALF-OPEN and buffer-free, so [Sep 1, Oct 1) followed by
          [Oct 1, Nov 1) in the same region is accepted while [Sep 15, Oct 15) is rejected outright, the
          same interval in a different region is accepted, and cancelling a window frees its interval for
          immediate reuse. Rejection is absolute here rather than aggregated against a ceiling.
        test_recipe:
          setup:
            - "Title TTL-WINDOW-01 (MOVIE) already owns one SCHEDULED US window covering [2026-09-01, 2026-10-01)."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, so every window below starts in the future."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-WINDOW-01", title_name: "Window Geometry Subject", content_type: "SERIES", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-10-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
              captures: { w2_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-15T00:00:00Z", window_end_at: "2026-10-15T00:00:00Z", license_tier: "PREMIUM" }
              as: ContentOps
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "CA", window_start_at: "2026-09-15T00:00:00Z", window_end_at: "2026-10-15T00:00:00Z", license_tier: "PREMIUM" }
              as: ContentOps
              captures: { w4_id: $.data.id }
            - call: "POST /availability-windows/${w1_id}/cancel"
              payload: {}
              as: ContentOps
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-20T00:00:00Z", license_tier: "BASIC" }
              as: ContentOps
              captures: { w5_id: $.data.id }
          assert:
            - "the first trigger call returns 201 (abutting at 2026-10-01T00:00:00Z is not an overlap) and AvailabilityWindow.${w2_id}.state == SCHEDULED"
            - "the second trigger call returns 409 with error_id ERR_WINDOW_OVERLAP"
            - "the third trigger call returns 201 and AvailabilityWindow.${w4_id}.region_code == CA"
            - "the fourth trigger call returns 200 and AvailabilityWindow.${w1_id}.state == CANCELLED"
            - "the fifth trigger call returns 201 and AvailabilityWindow.${w5_id}.state == SCHEDULED, proving the cancelled interval was freed"
            - "Title.${t_id}.availability_state == SCHEDULED"
            - "GET /titles/${t_id}/availability-windows returns 4 windows of which exactly 1 has state CANCELLED"

  - rule_id: compensating_invariant
    instances:

      - name: bandwidth_conserved_across_failover
        grounds:
          - calculations.vendor_reserved_ledger
          - state_machines.LiveEventReservation.ARMED_to_FAILED_OVER
          - entities.CdnVendor.fields.reserved_gbps
          - entities.LiveEventReservation.fields.failover_at
        distinguishing_aspect: |
          A failover is the compensating action for the primary-side hold: 30.00 Gbps is debited from
          ALPHA and credited to BRAVO in the same request, so GLOBAL_HELD_GBPS is 30.00 before and
          30.00 after while the per-vendor split inverts. The conserved quantity is bandwidth; the
          sibling instance conserves money.
        test_recipe:
          setup:
            - "One MOBILE_HIGH device profile, vendor ALPHA (US, committed 100.00) and vendor BRAVO (US, committed 80.00) exist."
            - "Title TTL-FAILOVER-01 (LIVE_EVENT) has a SCHEDULED US window covering 2026-09-01 to 2026-11-01, one QC_PASSED asset, a LOCKED HEVC ladder and a PACKAGED DrmPackage."
            - "An ACTIVE US routing policy exists, and an ARMED reservation holds 30.00 Gbps on ALPHA over 2026-09-10T00:00:00Z..04:00:00Z with BRAVO named as failover vendor."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0250 }
              as: PlatformAdmin
              captures: { v_alpha_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "BRAVO", regions: ["US"], committed_gbps: 80.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_bravo_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-FAILOVER-01", title_name: "Failover Ledger Event", content_type: "LIVE_EVENT", studio_code: "NOVASPORT" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/failover-01.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novasport.example/v1", persistent_license_allowed: false }
              as: DrmOperator
              captures: { p_id: $.data.id }
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "US", subscription_tier: "ANY", device_class_scope: "ALL", max_concurrent_streams: 2, max_playback_height_px: 1080, hdcp_level: "TYPE_0", offline_playback_allowed: false, priority: 60 }
              as: DrmOperator
            - call: "POST /drm-packages/${p_id}/package"
              payload: {}
              as: DrmOperator
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "US", steering_mode: "COST" }
              as: DeliveryEngineer
              captures: { pol_id: $.data.id }
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_alpha_id}", failover_vendor_id: "${v_bravo_id}", window_start_at: "2026-09-10T00:00:00Z", window_end_at: "2026-09-10T04:00:00Z", reserved_gbps: 30.00 }
              as: DeliveryEngineer
              captures: { r_id: $.data.id }
            - call: "POST /live-reservations/${r_id}/arm"
              payload: {}
              as: DeliveryEngineer
          trigger:
            - call: "POST /live-reservations/${r_id}/failover"
              payload: {}
              as: DeliveryEngineer
            - call: "GET /cdn-vendors/${v_alpha_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /cdn-vendors/${v_bravo_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "before the failover CdnVendor.${v_alpha_id}.reserved_gbps == 30.00 and CdnVendor.${v_bravo_id}.reserved_gbps == 0.00"
            - "the first trigger call returns 200 and LiveEventReservation.${r_id}.state == FAILED_OVER"
            - "LiveEventReservation.${r_id}.active_vendor_id == ${v_bravo_id}"
            - "LiveEventReservation.${r_id}.failover_at == 2026-08-01T00:00:00Z"
            - "LiveEventReservation.${r_id}.reserved_gbps == 30.00 and LiveEventReservation.${r_id}.released_gbps == 0.00"
            - "after the failover CdnVendor.${v_alpha_id}.reserved_gbps == 0.00 and CdnVendor.${v_bravo_id}.reserved_gbps == 30.00"
            - "the conserved quantity holds with zero drift: 30.00 + 0.00 before equals 0.00 + 30.00 after"

      - name: encode_budget_conserved_across_abort
        grounds:
          - calculations.encode_budget_ledger
          - state_machines.ReprocessJob.QUEUED_to_RUNNING
          - state_machines.ReprocessJob.RUNNING_to_ABORTED
          - entities.Title.fields.encode_budget_remaining_usd
          - entities.ReprocessJob.fields.committed_usd
        distinguishing_aspect: |
          Running the job debits exactly 48.62 from a 5000.00 budget, leaving 4951.38, and the abort
          restores 5000.00 with committed_usd back to 0.00 — the money identity
          remaining + sum(committed) == encode_budget_usd holds at every step with zero drift. The
          conserved quantity is money on a Title, not bandwidth on a vendor.
        test_recipe:
          setup:
            - "MOBILE_HIGH and SET_TOP_LEGACY device profiles exist."
            - "Title TTL-BUDGET-01 (MOVIE) keeps the default encode_budget_usd 5000.00, owns one QC_PASSED 6000-second asset and one LOCKED H264 ladder with rungs 1150 / 2350 / 4850 / 9650 kbps."
            - "One QUEUED HEVC reprocess job with cost_estimate_usd 48.62 already exists."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 720, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 3000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 25.00, quality_normalization_factor: 0.75 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-BUDGET-01", title_name: "Budget Ledger Subject", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/budget-01.mxf", duration_seconds: 6000, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "360p", height_px: 360, bitrate_kbps: 1150 }, { label: "540p", height_px: 540, bitrate_kbps: 2350 }, { label: "720p", height_px: 720, bitrate_kbps: 4850 }, { label: "1080p", height_px: 1080, bitrate_kbps: 9650 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: EncodingEngineer
              captures: { t_ver2: $.data.version }
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "HEVC", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /reprocess-jobs/${j_id}/run"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: EncodingEngineer
            - call: "POST /reprocess-jobs/${j_id}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: EncodingEngineer
          assert:
            - "before the run Title.${t_id}.encode_budget_remaining_usd == 5000.00 and ReprocessJob.${j_id}.committed_usd == 0.00"
            - "after the run ReprocessJob.${j_id}.state == RUNNING and ReprocessJob.${j_id}.committed_usd == 48.62"
            - "after the run Title.${t_id}.encode_budget_remaining_usd == 4951.38"
            - "after the abort ReprocessJob.${j_id}.state == ABORTED and ReprocessJob.${j_id}.abort_reason == OPERATOR_ABORT"
            - "after the abort ReprocessJob.${j_id}.committed_usd == 0.00"
            - "after the abort Title.${t_id}.encode_budget_remaining_usd == 5000.00 with zero drift"
            - "ReprocessJob.${j_id}.cost_estimate_usd == 48.62 is unchanged by both transitions"
