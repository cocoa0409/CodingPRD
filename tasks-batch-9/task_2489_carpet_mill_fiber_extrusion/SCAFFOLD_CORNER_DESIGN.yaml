          - errors[ERR_PILE_HEIGHT_SPEC_DEVIATION]
          - errors[ERR_PATTERN_REPEAT_MISMATCH]
        distinguishing_aspect: |
          Four load-setup attempts on one run peel the chain apart in declared order: a payload that
          violates gauge *and* pattern repeat reports the gauge error; fixing the gauge exposes the
          0.6 mm pile deviation (PILE_HEIGHT_SPEC_TOLERANCE_MM 0.5); at exactly 8.5 mm the deviation
          check passes and the pattern-repeat error surfaces; only the fully correct payload tufts.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 with gauge_code G_1_10, pile_height_mm 8.0 and pattern_repeat_mm 300.0."
