              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Ledger 1", serial_number: "SN-LED-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-LED", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-05-02T09:00:00Z", planned_end: "2026-05-02T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.64, launch_longitude: -122.37 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { started: $.data.actual_start }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { recency_before: $.data.last_completed_flight_end, expiry_before: $.data.currency_expires_at }
          trigger:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:07:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-05-02T10:07:00Z", max_altitude_reached_ft: 300, incident_occurred: false }
              as: Pilot
              as_user_id: "${pid}"
              captures: { minutes: $.data.logged_minutes, exceeded: $.data.altitude_exceedance }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { recency_after: $.data.last_completed_flight_end, expiry_after: $.data.currency_expires_at, risk_after: $.data.risk_score }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:30:00Z" }
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}/flight-summary"
              payload: {}
              as: ComplianceOfficer
              captures: { count: $.data.completed_flight_count, avg: $.data.average_duration_minutes }
          assert:
            - "${started} == \"2026-05-02T09:00:00Z\" - actual_start is the launch instant, never the planned_start echo"
            - "${minutes} == 67 == floor(10:07:00 - 09:00:00 in minutes) and ${exceeded} == false (300 <= the 400 ft effective ceiling)"
            - "${recency_before} == null and ${expiry_before} == \"2026-07-30T00:00:00Z\" (2026-05-01 + 90 days)"
            - "${recency_after} == \"2026-05-02T10:07:00Z\" and ${expiry_after} == \"2026-07-31T10:07:00Z\" == min(2028-05-01T00:00:00Z, 2026-05-02T10:07:00Z + 90 days)"
            - "${risk_after} == 0 - raw score -5 (one clean flight decay) is clamped up to SCORE_FLOOR, never negative"
            - "${count} == 1 and ${avg} == 67.0 - the default summary window [pilot.created_at, current_utc) is read with the clock advanced to 10:30 so the exclusive upper bound does not drop the 10:07 row"

      - name: suspension_cascade_reaches_only_flights_whose_authorization_was_revoked
        claim_type: conditional_cascade
        grounds:
          - state_machines.Pilot
          - state_machines.Aircraft
          - state_machines.AirspaceAuthorization
          - endpoints.POST_/drone-ops/pilots/{id}/suspend
          - entities.Flight.fields.cancellation_reason
        distinguishing_aspect: |
          The depth-4 suspension cascade is conditional at its last link: it cancels a Flight
          only because that flight's AirspaceAuthorization was revoked. A sibling flight of the
          same pilot on the same grounded airframe in an uncontrolled class G zone cites no
          authorization, so it must survive in PLANNED - even though the airframe it names is
          now GROUNDED. An implementation that cancels every non-terminal flight of a suspended
          pilot fails here; one that cancels none fails on the controlled-zone flight.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-05-10T00:00:00Z with an ACTIVE indemnified policy of 2000000 cents and one REGISTERED 249 g airframe (max_altitude_ft 900)."
