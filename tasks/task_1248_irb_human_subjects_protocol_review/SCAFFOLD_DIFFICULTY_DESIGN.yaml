# =============================================================================
# Task 1248: IRB Human Subjects Protocol Review — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7; every test_recipe
# chain replays against §1.5 from empty-DB.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Protocol fee vs
  # Investigator compliance score)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_settled_divergence_on_level_mismatch
        grounds:
          - calculations.review_fee
          - entities.Protocol.fields.provisional_fee_cents
          - entities.Protocol.fields.settled_fee_cents
          - entities.Protocol.fields.fee_delta_cents
          - state_machines.Protocol.DRAFT_to_SUBMITTED
          - state_machines.Protocol.SUBMITTED_to_UNDER_EXPEDITED_REVIEW
        distinguishing_aspect: |
          Protocol-domain dual variant: the provisional variant prices the
          claimed_review_level at first submit (round(250000*1.5)=375000) while
          the settled variant prices the determined_review_level at
          determination (round(150000*1.5)=225000); identical protocol data,
          delta -150000 driven purely by the variant's level source.
        test_recipe:
          setup:
            - "Investigator with training valid past the default clock (2026-05-01T00:00:00Z)"
            - "Chair member for consent approval"
            - "Industry-sponsored protocol, claimed FULL_BOARD, risk GREATER_THAN_MINIMAL, one APPROVED consent document, submitted once"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Fee", email: "fee@univ.edu", department: "Medicine", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair One", email: "chair1@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Fee Study", claimed_review_level: "FULL_BOARD", risk_level: "GREATER_THAN_MINIMAL", is_industry_sponsored: true }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
          assert:
            - "Protocol.${proto_id}.provisional_fee_cents == 375000"
            - "Protocol.${proto_id}.settled_fee_cents == 225000"
            - "Protocol.${proto_id}.fee_delta_cents == -150000"
            - "Protocol.${proto_id}.status == UNDER_EXPEDITED_REVIEW"
            - "Protocol.${proto_id}.determined_review_level == EXPEDITED"

      - name: compliance_score_provisional_gate_vs_final_adjudication
        grounds:
          - calculations.compliance_score
          - entities.Investigator.fields.provisional_compliance_score
          - entities.Investigator.fields.final_compliance_score
          - validations[priority=5]
        distinguishing_aspect: |
          Investigator-domain dual variant (different domain from the Protocol
          fee instance): the same case/AE data yields provisional 47 (deducts 2
          confirmed findings, 1 open case, 1 late-unfiled report) but final 60
          (confirmed findings only); the submission gate consumes the
          provisional variant, so the investigator is blocked while remaining
          ACTIVE (final not below 60).
        test_recipe:
          setup:
            - "Investigator I with an APPROVED protocol P (expedited track, MINIMAL risk)"
            - "Two MANUAL non-compliance cases on P investigated to FINDING_CONFIRMED (P is SUSPENDED after the first)"
            - "A third MANUAL case left OPENED"
            - "One late SERIOUS_ADVERSE_EVENT left in FILED (never triaged): occurred 2026-05-10T00:00:00Z, reported at clock 2026-06-01T00:00:00Z (deadline 2026-05-15T00:00:00Z)"
            - "A second DRAFT protocol P2 of the same investigator with one consent document"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Score", email: "score@univ.edu", department: "Psychology", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair Two", email: "chair2@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev A", email: "reva@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev_a: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev B", email: "revb@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { rev_b: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Score Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p1: $.data.id }
            - call: "POST /irb/protocols/${p1}/consent-documents"
              payload: { file_ref: "s3://consent/score-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd1: $.data.id }
            - call: "POST /irb/consent-documents/${cd1}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${p1}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p1}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${p1}/review-assignments"
              payload: { reviewer_id: "${rev_a}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { asg_a: $.data.id }
            - call: "POST /irb/protocols/${p1}/review-assignments"
              payload: { reviewer_id: "${rev_b}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_b: $.data.id }
            - call: "POST /irb/review-assignments/${asg_a}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_a}"
            - call: "POST /irb/review-assignments/${asg_b}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_b}"
            - call: "POST /irb/review-assignments/${asg_a}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_a}"
            - call: "POST /irb/review-assignments/${asg_b}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_b}"
            - call: "POST /irb/protocols/${p1}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${p1}/non-compliance-cases"
              payload: { reason: "audit finding one" }
              as: ComplianceOfficer
              captures: { case1: $.data.id }
            - call: "POST /irb/non-compliance-cases/${case1}/open-investigation"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /irb/non-compliance-cases/${case1}/issue-finding"
              payload: { finding: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /irb/protocols/${p1}/non-compliance-cases"
              payload: { reason: "audit finding two" }
              as: ComplianceOfficer
              captures: { case2: $.data.id }
            - call: "POST /irb/non-compliance-cases/${case2}/open-investigation"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /irb/non-compliance-cases/${case2}/issue-finding"
              payload: { finding: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /irb/protocols/${p1}/non-compliance-cases"
              payload: { reason: "audit open three" }
              as: ComplianceOfficer
              captures: { case3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IrbAdmin
            - call: "POST /irb/protocols/${p1}/adverse-events"
              payload: { event_type: "SERIOUS_ADVERSE_EVENT", occurred_at: "2026-05-10T00:00:00Z", description: "late SAE" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { ae1: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Score Study 2", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p2: $.data.id }
            - call: "POST /irb/protocols/${p2}/consent-documents"
              payload: { file_ref: "s3://consent/score2-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /irb/protocols/${p2}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { submit_err: $.data.error_id }
          assert:
            - "submit of P2 rejected with error_id ERR_COMPLIANCE_SCORE_TOO_LOW (http 422)"
            - "Investigator.${inv_id}.final_compliance_score == 60"
            - "Investigator.${inv_id}.provisional_compliance_score == 47"
            - "Investigator.${inv_id}.status == ACTIVE"
            - "Protocol.${p2}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) quorum composition vs mode (b)
  # nested rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quorum_composition_prisoner_representative_branch
        grounds:
          - calculations.quorum_determination
          - state_machines.BoardMeeting.SCHEDULED_to_CONVENED
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): the quorum formula combines >=3 inputs with a conditional
          branch — active-member count (5 -> threshold 3), the attendee
          category multiset (NON_SCIENTIST and UNAFFILIATED present), and the
          agenda's prisoner flag; count and base composition pass with 4
          attendees, yet the prisoner-research agenda item forces the
          PRISONER_REPRESENTATIVE branch, which fails until a prisoner
          representative joins the roster.
        test_recipe:
          setup:
            - "5 ACTIVE members: chair(SCIENTIST), sci2(SCIENTIST), nonsci(NON_SCIENTIST), unaff(UNAFFILIATED), pris(PRISONER_REPRESENTATIVE)"
            - "Prisoner-research protocol P AWAITING_FULL_BOARD (claimed and determined FULL_BOARD, involves_prisoners true)"
            - "Meeting M room R-PRIS at 2026-06-01T10:00:00Z with P as its only LISTED agenda item"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Prison", email: "prison@univ.edu", department: "Criminology", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair P", email: "chairp@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Sci Two", email: "sci2@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { sci2: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "NonSci", email: "nonsci@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { nonsci: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Unaff", email: "unaff@univ.edu", member_category: "UNAFFILIATED" }
              as: IrbAdmin
              captures: { unaff: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "PrisRep", email: "pris@univ.edu", member_category: "PRISONER_REPRESENTATIVE" }
              as: IrbAdmin
              captures: { pris: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Prison Study", claimed_review_level: "FULL_BOARD", risk_level: "GREATER_THAN_MINIMAL", involves_prisoners: true }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/prison-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "FULL_BOARD" }
              as: IrbCoordinator
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-PRIS", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 120 }
              as: IrbCoordinator
              captures: { mtg: $.data.id, mtg_v: $.data.version }
            - call: "POST /irb/board-meetings/${mtg}/agenda-items"
              payload: { protocol_id: "${proto_id}", expected_meeting_version: "${mtg_v}" }
              as: IrbCoordinator
              captures: { item: $.data.id }
          trigger:
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${sci2}", "${nonsci}", "${unaff}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
              captures: { convene_err: $.data.error_id }
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}", "${unaff}", "${pris}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
          assert:
            - "First convene rejected with error_id ERR_QUORUM_COMPOSITION_MISSING (http 422) despite 4 >= threshold 3 with NON_SCIENTIST and UNAFFILIATED present"
            - "Second convene succeeds: BoardMeeting.${mtg}.status == CONVENED"
            - "BoardMeeting.${mtg}.quorum_threshold == 3"

      - name: fee_per_line_rounding_order_pinned
        grounds:
          - calculations.review_fee
          - entities.Protocol.fields.settled_fee_cents
          - state_machines.RelianceAgreement.PROPOSED_to_EXECUTED
        distinguishing_aspect: |
          Mode (b): nested rounding with a pinned order — each reliance
          surcharge line is rounded half-up AFTER the 1.5 industry multiplier
          (round(74999*1.5)=112499) and lines are then summed
          (225000+112499+112499=449998); the rejected sum-then-round order
          yields 449997, so the two orders differ by one cent and the scaffold
          pins per-line rounding.
        test_recipe:
          setup:
            - "Industry-sponsored protocol P, claimed EXPEDITED, MINIMAL risk, approved via the expedited track (2 recommendations, APPROVED consent)"
            - "settled_fee_cents == 225000 after determination (round(150000*1.5))"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Round", email: "round@univ.edu", department: "Engineering", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair R", email: "chairr@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev C", email: "revc@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev_c: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev D", email: "revd@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { rev_d: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Rounding Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL", is_industry_sponsored: true }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/round-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_c}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { asg_c: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_d}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_d: $.data.id }
            - call: "POST /irb/review-assignments/${asg_c}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_c}"
            - call: "POST /irb/review-assignments/${asg_d}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_d}"
            - call: "POST /irb/review-assignments/${asg_c}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_c}"
            - call: "POST /irb/review-assignments/${asg_d}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_d}"
            - call: "POST /irb/protocols/${proto_id}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/reliance-agreements"
              payload: { protocol_id: "${proto_id}", ceding_institution_code: "INST_A", reviewing_institution_code: "UNIV", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: IrbAdmin
              captures: { rel_a: $.data.id }
            - call: "POST /irb/reliance-agreements"
              payload: { protocol_id: "${proto_id}", ceding_institution_code: "INST_B", reviewing_institution_code: "UNIV", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: IrbAdmin
              captures: { rel_b: $.data.id }
          trigger:
            - call: "POST /irb/reliance-agreements/${rel_a}/execute"
              payload: {}
              as: IrbAdmin
            - call: "POST /irb/reliance-agreements/${rel_b}/execute"
              payload: {}
              as: IrbAdmin
          assert:
            - "Protocol.${proto_id}.settled_fee_cents == 449998"
            - "Protocol.${proto_id}.provisional_fee_cents == 225000"
            - "Protocol.${proto_id}.fee_delta_cents == 224998"
            - "RelianceAgreement.${rel_a}.status == EXECUTED"
            - "RelianceAgreement.${rel_b}.status == EXECUTED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (Protocol cyclic vs BoardMeeting cyclic)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: protocol_revision_loop_and_suspension_cycle
        grounds:
          - state_machines.Protocol.SUBMITTED_to_RETURNED
          - state_machines.Protocol.RETURNED_to_SUBMITTED
          - state_machines.Protocol.UNDER_EXPEDITED_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Protocol.CHANGES_REQUESTED_to_UNDER_EXPEDITED_REVIEW
          - state_machines.Protocol.APPROVED_to_SUSPENDED
          - state_machines.Protocol.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          Protocol machine is cyclic with two distinct loops exercised in one
          lifecycle: SUBMITTED->RETURNED->SUBMITTED (completeness loop),
          UNDER_EXPEDITED_REVIEW->CHANGES_REQUESTED->UNDER_EXPEDITED_REVIEW
          (revision loop), and APPROVED->SUSPENDED->APPROVED (suspension loop);
          the protocol ends APPROVED after traversing APPROVED twice.
        test_recipe:
          setup:
            - "Investigator, chair, and two reviewers exist"
            - "Protocol P with APPROVED consent document, submitted once"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Cycle", email: "cycle@univ.edu", department: "Biology", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair C", email: "chairc@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev E", email: "reve@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { rev_e: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev F", email: "revf@univ.edu", member_category: "UNAFFILIATED" }
              as: IrbAdmin
              captures: { rev_f: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Cycle Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id, proto_v0: $.data.version }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/cycle-v1.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /irb/consent-documents/${cd_id}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /irb/protocols/${proto_id}/return"
              payload: { reason: "missing recruitment plan" }
              as: IrbCoordinator
