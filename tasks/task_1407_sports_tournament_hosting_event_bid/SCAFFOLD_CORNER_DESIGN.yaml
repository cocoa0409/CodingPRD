        grounds: [entities.Division.fields.entered_team_count]
        excluded_because:
          difficulty_instance: division_entered_count_withdraw_promote_invariant
          rationale: "Withdraw/promote reconciliation of entered_team_count is asserted as the conserved quantity of the named §1.8 instance."

