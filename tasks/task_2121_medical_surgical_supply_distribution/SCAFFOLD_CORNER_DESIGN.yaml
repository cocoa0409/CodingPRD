          - entities.GpoContract.fields.effective_from
        distinguishing_aspect: "Two ACTIVE ACUTE contracts from DIFFERENT manufacturers both price item X, at 3000 and at 2800, with fully overlapping effective periods that validation priority 17 permits. The selector's primary sort key tier_price_cents ASC pins 2800, never 3000."
        test_recipe:
