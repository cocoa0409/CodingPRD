- section: rbac
  instances:
  - name: provider_rep_scoped_read_own_ok_other_forbidden
    claim_type: role_scope
    grounds:
    - roles[ProviderRep]
    - validations[priority=4]
    - errors[ERR_FORBIDDEN_OWNERSHIP]
    distinguishing_aspect: 'ProviderRep (entity_backed: Provider) reads its own contract chain; reading another provider''s contract is rejected 403 ERR_FORBIDDEN_OWNERSHIP.'
    test_recipe:
      setup:
      - two providers P1 (tin TIN-1) and P2 (tin TIN-2); P1 has a contract
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-1
          npi: NPI-1
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov B
          tin: TIN-2
          npi: NPI-2
          locality_code: L02
        as: PlanAdmin
        captures:
          prov2_id: $.data.id
      trigger:
      - call: GET /contracts/${ct_id}
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          ok: $.data.id
      - call: GET /contracts/${ct_id}
        as: ProviderRep
        as_user_id: ${prov2_id}
        captures:
          err: $.data.error_id
      assert:
      - ok == ${ct_id} (own chain readable)
      - err == ERR_FORBIDDEN_OWNERSHIP (other provider's contract hidden)
  - name: legal_cannot_create_entry_unauthorized
    claim_type: role_denial
    grounds:
    - roles[ContractLegal]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: Entry creation is ConfigurationAnalyst-exclusive; ContractLegal is denied at priority 3 (before existence), so even an unknown version id yields ERR_UNAUTHORIZED_ROLE.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /contract-versions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/fee-schedule-entries
        payload:
          hcpcs_code: '99213'
          service_category: OFFICE_VISIT
          rate_type: FLAT_RATE
          flat_rate_cents: 5000
        as: ContractLegal
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_UNAUTHORIZED_ROLE
  - name: analyst_cannot_settle_adjustment_unauthorized
    claim_type: role_denial
    grounds:
    - roles[ConfigurationAnalyst]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: Adjustment settle is PaymentIntegrityAnalyst-exclusive; ConfigurationAnalyst is denied at priority 3 (before existence).
    test_recipe:
      setup:
