        claim_type: Correct Result
        grounds:
          - calculations.public_comment_minute_allocation
          - state_machines.PublicComment.REQUESTED_to_DENIED
          - entities.PublicComment.fields.denial_reason
        distinguishing_aspect: "Waterfall behaviour on a 5-minute SPECIAL budget with three cards each asking 3 minutes: the first takes min(3, 3, 5) = 3, the second takes min(3, 3, 2) = 2, and the third can only be offered 0 which is below MIN_MINUTES_PER_SPEAKER, so it is DENIED with BUDGET_EXHAUSTED and remaining lands on 0."
