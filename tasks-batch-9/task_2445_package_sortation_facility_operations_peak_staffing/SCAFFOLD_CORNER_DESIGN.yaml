      - name: injury_close_thaws_frozen_center_to_open
        claim_type: Valid Transition
        grounds:
          - state_machines.SortCenter.FROZEN_to_OPEN
          - state_machines.InjuryReport.OPEN_to_CLOSED
          - calculations.ops_posture_derivation
        distinguishing_aspect: "The center's posture is derived, not set: filing a SERIOUS injury drives OPEN -> FROZEN and closing that same report with no other trigger outstanding drives FROZEN -> OPEN in the same derivation, bumping the center version each time."
