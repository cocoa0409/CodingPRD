            - "presentation_gap_units == 0 and capacity_capped_units == 0 on all three lines"
      - name: promo_lift_input_set_excludes_five_kinds_of_ineligible_event
        claim_type: input_set_filtering
        grounds:
          - calculations.promo_lift_factor_bp
          - calculations.promo_lift_factor_bp.input_set
          - calculations.store_need_units.variants[FORWARD_LOOKING]
          - state_machines[PromoEvent].transitions[SCHEDULED->ACTIVE]
          - entities.AllocationLine.fields.need_units
        distinguishing_aspect: |
          Seven events sit in the database and exactly one of them may feed each store's need. Six are
          excluded, each for a DIFFERENT reason, and every one of them carries a bigger lift than the winner so
          that any leak is visible as a bigger need: a DRAFT event with the identical window and target (status
          filter), a CLUSTER event on the store's own cluster (loses on specificity, not eligibility), a
          PROGRAM event (same), an event on the other store (target filter), an APPAREL_BOTTOM event (class
          filter), and an ACTIVE event whose window starts a week after the clock (window filter). The second
          store then proves the selection is per store rather than per run: it is in a different cluster, so
          the cluster event never applies to it and its own STORE event wins over the program-wide one.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE; store 0101 is grade A cluster URBAN (capacity 48 / pmin 12), store 0102 is grade B cluster SUBURBAN (capacity 24 / pmin 8)"
            - "SKU-1001 is SEASONAL APPAREL_TOP on TOP-4SZ, so the run method is DEMAND_DRIVEN with need_basis FORWARD_LOOKING"
            - "Positions: 0101 on_hand 10 / forecast 9 / min 12 / max 48, 0102 on_hand 6 / forecast 5 / min 8 / max 24, on_order 0 for both"
            - "Seven PromoEvents: EV-STORE-A (STORE 0101, APPAREL_TOP, 07-28..08-05, lift 13000, ACTIVE), EV-DRAFT (STORE 0101, APPAREL_TOP, identical window, lift 30000, left DRAFT - it was created before EV-STORE-A was scheduled, so no window conflict was raised), EV-CLUSTER (CLUSTER URBAN, 07-20..08-20, lift 18000, ACTIVE), EV-PROGRAM (PROGRAM, item_class null, 07-01..08-31, lift 25000, ACTIVE), EV-STORE-B (STORE 0102, 07-28..08-05, lift 20000, ACTIVE), EV-BOTTOM (STORE 0101, APPAREL_BOTTOM, identical window, lift 22000, ACTIVE), EV-FUTURE (STORE 0101, APPAREL_TOP, 08-08..08-12, lift 40000, ACTIVE)"
            - "The logical clock is 2026-08-01T00:00:00Z and the receipt holds 40 units (S 8 / M 14 / L 12 / XL 6)"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "SUBURBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
