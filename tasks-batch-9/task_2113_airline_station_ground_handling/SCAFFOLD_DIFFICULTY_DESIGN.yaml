          Certification.expires_at, reached through POST /turn-resources. The bound is exclusive,
          so window_start exactly equal to expires_at is rejected with ERR_CERT_NOT_CURRENT while
          window_start one minute earlier is accepted.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER; the logical clock reads 2026-04-01T00:00:00Z."
            - "FlightBank AM1 is DRAFT with one TOWING_ONLY turn scheduled 06:00-06:20 on 2026-04-10 (publication is not required to commit resources)."
            - "Agent E001 holds a RAMP_SAFETY endorsement at ZRH valid from 2026-01-01 and expiring at exactly 2026-04-10T05:50:00Z."
