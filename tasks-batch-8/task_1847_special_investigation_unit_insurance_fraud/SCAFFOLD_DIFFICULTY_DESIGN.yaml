  # =========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_recovered_plus_outstanding_equals_target
        grounds:
          - state_machines.RecoveryPayment.transitions
          - entities.RestitutionLedger.fields.outstanding_amount_cents
        distinguishing_aspect: |
          Conserved quantity: RestitutionLedger.target_amount_cents ==
          recovered_amount_cents + outstanding_amount_cents. Forward: clear
          payment; compensating: reverse payment. After both operations the
          invariant MUST hold exactly.
        test_recipe:
          setup:
            - "RestitutionLedger L with target_amount_cents = 35000000, recovered=0"
            - "RecoveryPayment P1 amount=20000000"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
