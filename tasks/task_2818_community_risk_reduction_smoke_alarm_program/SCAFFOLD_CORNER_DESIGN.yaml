      - name: parallel_axes_terminating_in_either_order
        claim_type: parallel
        excluded_because:
          difficulty_instance: visit_install_and_education_axes_terminate_in_either_order
          rationale: "That §1.8 non_linear_state_machine instance already drives the two visit axes to terminal values in both orders on two separate visits and asserts the derived visit_status at every rung, which is exactly the parallel-shape claim."

      - name: submitted_to_draft_revision_cycle
        claim_type: cyclic
        excluded_because:
          difficulty_instance: grant_report_returns_to_draft_and_resubmits_on_revision_cycle
          rationale: "The §1.8 non_linear_state_machine instance already traverses DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED -> ACCEPTED, asserting revision_no, the cleared submitted_by_user_id and the second submitter's segregation-of-duties eligibility."

      - name: cascade_down_and_ledger_sync_through_the_visit_completion_chain
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: visit_cancel_cascades_installation_then_lot_then_grant
          rationale: "The §1.8 transitive_cascade instance already walks visit -> installation -> DeviceLot -> PartnerGrant and reconciles both the unit ledger and the money ledger before and after, covering the cascade-down and ledger-sync side-effect patterns."

      - name: compensation_reverses_every_original_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: device_units_conserved_when_a_reserved_installation_is_voided
          rationale: "The §1.8 compensating_invariant instances (this one for units, grant_money_conserved_when_a_committed_installation_is_voided for money) already assert that the void path restores every quantity the reservation and commit moved, with no drift."

