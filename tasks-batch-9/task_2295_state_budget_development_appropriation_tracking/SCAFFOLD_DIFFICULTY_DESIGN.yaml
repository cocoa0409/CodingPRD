              as: StateController
          assert:
            - "after release: Appropriation.${appr_id}.cash_status == PARTIALLY_RELEASED and authority_status == ENACTED"
            - "after freeze-cash: Appropriation.${appr_id}.cash_status == FROZEN, pre_freeze_cash_status == PARTIALLY_RELEASED, authority_status == ENACTED"
            - "after unfreeze-cash: Appropriation.${appr_id}.cash_status == PARTIALLY_RELEASED (recomputed from released_cents == 400000000, not restored from pre_freeze_cash_status)"
            - "after recall: Appropriation.${appr_id}.cash_status == UNRELEASED and released_cents == 0"
            - "after recall: Appropriation.${appr_id}.authority_status == ENACTED and available_authority_cents == 2000000000"
            - "Allotment.${allot_id}.status == RECALLED and released_cents == 0"
            - "Appropriation.${appr_id}.enacted_amount_cents == 2000000000 unchanged across all four cash transitions"

