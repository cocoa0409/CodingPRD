  - section: consistency_model
    instances:
      - name: training_completion_authorization_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /clm/distributors/{id}/training-completions]
          - entities.Distributor.fields.distributor_state
        distinguishing_aspect: "The write that crosses the threshold returns the post-cascade Distributor row itself, so the new state, the recomputed counter and the derived installation_training_state are all readable from the 200 body — an immediately following GET must be byte-identical, leaving no window in which the authorization has happened but is not yet visible."
        test_recipe:
          setup: ["Distributor D-01 in PENDING_TRAINING with T-201 already credited for INSTALLATION and technician T-202 created"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-202", full_name: "Sam Poe", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t202: $.data.id }
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
          trigger:
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { state_now: $.data.distributor_state, count_now: $.data.trained_technician_count, v_now: $.data.version }
            - call: "GET /clm/distributors/${dist}"
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { state_after: $.data.distributor_state, v_after: $.data.version }
          assert:
            - "${state_now} == AUTHORIZED (the transition is reported by the writing call, not by a later read)"
            - "${count_now} == 2"
            - "${state_after} == ${state_now} and ${v_after} == ${v_now}"
            - "the GET reports installation_training_state == COMPLETE and completed_training_keys with 2 entries"
            - "GET /clm/distributors?distributor_state=AUTHORIZED returns 1 item immediately after the write"

      - name: stock_adjustment_state_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /clm/service-parts/{id}/stock-adjustments]
          - calculations.part_stock_projection
        distinguishing_aspect: "part_stock_projection is recomputed inside the adjusting write rather than lazily at read time: the adjustment that drops on-hand to the reorder point returns stock_state LOW in its own body, and the identical value is read back with no intervening recompute."
        test_recipe:
          setup: ["Part BRG-2040 with reorder_point_qty 2, received to 3 units"]
          setup_api_calls:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p1: $.data.id }
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: 3, reason: "RECEIPT" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { state_in: $.data.stock_state }
          trigger:
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: -1, reason: "SHRINKAGE" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { qty_now: $.data.on_hand_qty, state_now: $.data.stock_state, v_now: $.data.version }
            - call: "GET /clm/service-parts/${p1}"
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { qty_after: $.data.on_hand_qty, state_after: $.data.stock_state, v_after: $.data.version }
          assert:
            - "${state_in} == IN_STOCK (3 units is above the reorder point of 2)"
            - "${qty_now} == 2 and ${state_now} == LOW (the reorder point is inclusive and is applied by the write itself)"
            - "${qty_after} == ${qty_now} and ${state_after} == ${state_now} and ${v_after} == ${v_now}"
            - "${v_now} == 3 (create, receipt, shrinkage)"
            - "GET /clm/service-parts?stock_state=LOW returns 1 item immediately after the write"
