# =============================================================================
# PRD Benchmark Seed Tables — task_3308
# Multi-Brand Home Services Franchise Umbrella & Territory Administration
# =============================================================================

scenario: |
  Multi-Brand Home Services Franchise Umbrella & Territory Administration (Neighborly): brand portfolio with distinct trades operating under a shared franchisor with common systems, franchise territory definition by household counts with protected areas and expansion rights, cross-brand referral flows where one brand's technician surfaces work for a sister brand with attribution and fees, national accounts and property manager programs assigning work to local franchisees with service level obligations, shared call center and lead generation with lead cost allocation, multi-brand ownership by a single franchisee with combined reporting and staffing, brand standards audits and mystery shopping with remediation, franchise resale, transfer and territory reallocation

domain_name: franchise-umbrella-territory
api_prefix: /franchise

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: brand_code, type: string, source: input, description: "Franchisor-unique brand code", constraints: "unique per franchisor; matches ^[A-Z0-9-]{3,12}$" }
      - { name: display_name, type: string, source: input, description: "Customer-facing brand name" }
      - { name: trade, type: enum, source: input, description: "Primary trade the brand operates in", constraints: "PLUMBING | ELECTRICAL | HVAC | RESTORATION | CLEANING | PEST | APPLIANCE" }
      - { name: royalty_rate, type: number, source: input, description: "Default royalty rate applied to statement gross revenue", constraints: "0 <= x <= 1" }
      - { name: national_ad_fund_rate, type: number, source: input, description: "Default national advertising fund rate applied to statement gross revenue", constraints: "0 <= x <= 1" }
      - { name: min_certification_level, type: enum, source: input, description: "Lowest certification tier an agreement may hold to dispatch work under this brand", constraints: "APPRENTICE | JOURNEYMAN | MASTER" }
      - { name: cross_brand_fee_table, type: object, source: input, description: "Tiered cross-brand referral fee table keyed by '<receiving brand_code>' with value bands", constraints: "may be empty; keys must be brand codes" }
      - { name: audit_cycle_months, type: integer, source: input, description: "Months allowed between published standards audits before the agreement's audit_due_iso is exceeded", constraints: ">= 1" }

  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal operating company name" }
      - { name: principal_name, type: string, source: input, description: "Controlling principal individual" }
      - { name: entity_type, type: enum, source: input, description: "Legal form of the operating company", constraints: "LLC | CORPORATION | SOLE_PROPRIETOR | PARTNERSHIP" }
      - { name: shared_services_enrolled, type: boolean, source: input, default: false, description: "Whether the franchisee participates in the shared call center and national lead pool" }
      - { name: status, type: enum, source: system, description: "Franchisee standing", constraints: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: active_brand_count, type: integer, source: computed, description: "Count of distinct brand_id over this franchisee's FranchiseAgreement rows in lifecycle_status IN {ACTIVE, RENEWAL_PENDING, TRANSFER_PENDING}" }
      - { name: active_agreement_count, type: integer, source: computed, description: "Count of this franchisee's FranchiseAgreement rows in lifecycle_status IN {ACTIVE, RENEWAL_PENDING, TRANSFER_PENDING}" }
      - { name: allocated_households, type: integer, source: computed, description: "Maintained counter: incremented by household_count on award and on expansion request, decremented on reclaim, suspend and expiry. It MUST reconcile to the sum of household_count over this franchisee's Territory rows in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED}; drift is a defect." }
      - { name: lead_cost_balance_cents, type: integer, source: computed, description: "Maintained running balance: incremented by lead_cost_cents at allocation and decremented by the same amount at release. It MUST reconcile to (sum of lead_cost_cents over ALLOCATED leads) minus (the recorded release amounts)" }
      - { name: standards_score, type: number, source: computed, description: "Trailing brand standards score; the variant that produced it is recorded in standards_score_basis" }
      - { name: standards_score_basis, type: string, source: computed, description: "Which variant produced standards_score: AUDIT_BASED when exactly one agreement is held, TRAILING_WINDOW otherwise" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: territory_code, type: string, source: input, description: "Franchisor-unique territory code", constraints: "unique per franchisor" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; the brand whose trade this territory protects" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the holding franchisee, null while status IN {DEFINED, OFFERED, RECLAIMED}", constraints: "may be null" }
      - { name: parent_territory_id, type: string, source: input, description: "FK -> Territory.id; the territory this row was carved out of by a reallocation, null for a root territory", constraints: "may be null" }
      - { name: source_of_reallocation_id, type: string, source: system, description: "FK -> Territory.id; the territory whose reallocate action synthesized this row, null when the row was created directly", constraints: "may be null" }
      - { name: household_count, type: integer, source: input, description: "Households inside the protected area", constraints: "> 0" }
      - { name: postal_codes, type: array, source: input, description: "Postal codes forming the protected area", constraints: "non-empty; a postal code belongs to at most one Territory row per brand_id whose status is not RECLAIMED" }
      - { name: protected, type: boolean, source: input, default: true, description: "Whether the territory carries protected-area exclusivity" }
      - { name: expansion_right_households, type: integer, source: input, description: "Household threshold at which the holder qualifies for expansion rights", constraints: ">= 0" }
      - { name: allocated_households, type: integer, source: computed, description: "Maintained counter set to household_count at award and reset to 0 at reclaim; it MUST equal household_count while status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED} and 0 otherwise" }
      - { name: status, type: enum, source: system, description: "Territory lifecycle", constraints: "DEFINED | OFFERED | AWARDED | ACTIVE | EXPANSION_REQUESTED | PENDING_REALLOCATION | RECLAIMED" }

  - name: FranchiseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_number, type: string, source: input, description: "Franchisor-unique agreement number", constraints: "unique per franchisor" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the operating franchisee" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the territory this agreement operates" }
      - { name: signed_on, type: datetime, source: input, description: "Signature instant of the current term" }
      - { name: initial_term_months, type: integer, source: input, description: "Contracted initial term length in months", constraints: ">= 12" }
      - { name: expires_on, type: datetime, source: computed, description: "signed_on advanced by initial_term_months calendar months" }
      - { name: certification_level, type: enum, source: input, description: "Certification tier held by this agreement's technicians", constraints: "APPRENTICE | JOURNEYMAN | MASTER" }
      - { name: royalty_rate_override, type: number, source: input, description: "Agreement-specific royalty rate; when null the brand's royalty_rate applies", constraints: "may be null; 0 <= x <= 1" }
      - { name: lifecycle_status, type: enum, source: system, description: "Dimension A — commercial lifecycle", constraints: "DRAFT | OFFERED | ACTIVE | RENEWAL_PENDING | TRANSFER_PENDING | TERMINATED | EXPIRED" }
      - { name: standards_status, type: enum, source: system, description: "Dimension B — brand standards posture derived from published audits and open remediations", constraints: "COMPLIANT | WATCH | REMEDIATION_REQUIRED | DEFAULT" }
      - { name: effective_royalty_rate, type: number, source: computed, description: "royalty_rate_override when non-null, otherwise the Brand royalty_rate" }
      - { name: cumulative_royalty_cents, type: integer, source: computed, description: "Maintained running total: increased by royalty_cents at statement ISSUE and decreased by it at VOID. It MUST reconcile to the sum of royalty_cents over this agreement's RoyaltyStatement rows in status IN {ISSUED, PAID}" }
      - { name: cumulative_referral_net_cents, type: integer, source: computed, description: "Maintained running total: increased by referral_fee_cents when this agreement is the originator of a settling referral and decreased by it when it is the receiver. Across any pair it MUST stay exactly opposite." }
      - { name: open_remediation_count, type: integer, source: computed, description: "Count of BrandStandardsAudit rows for this agreement whose remediation_status IN {OPEN, SUBMITTED, RE_VERIFICATION, ESCALATED}" }
      - { name: audit_due_iso, type: datetime, source: computed, description: "conducted_iso of the latest BrandStandardsAudit for this agreement in audit_status IN {PUBLISHED, SUPERSEDED} advanced by the brand's audit_cycle_months; null when no audit has been published" }
      - { name: renewal_clock_iso, type: datetime, source: system, description: "Logical-clock instant renew was accepted; null until then", constraints: "may be null" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referral_code, type: string, source: input, description: "Franchisor-unique referral code", constraints: "unique per franchisor" }
      - { name: originating_agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the agreement whose technician surfaced the work" }
      - { name: receiving_agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the sister-brand agreement that performs the work" }
      - { name: customer_household_ref, type: string, source: input, description: "Opaque customer household reference" }
      - { name: job_description, type: string, source: input, description: "Work surfaced by the originating technician" }
      - { name: estimated_job_value_cents, type: integer, source: input, description: "Estimated value of the referred work", constraints: ">= 0" }
      - { name: settled_job_value_cents, type: integer, source: input, description: "Actual job value recorded when the receiving agreement completes the referral", constraints: ">= 0" }
      - { name: referral_fee_rate, type: number, source: input, description: "Contractual share of the referred work owed to the originating brand under the flat-rate variant", constraints: "0 <= x <= 1" }
      - { name: referral_fee_cents, type: integer, source: computed, description: "Fee owed to the originating agreement, produced by the referral_fee_calculation variant active at settlement" }
      - { name: fee_variant, type: string, source: computed, description: "Which variant produced referral_fee_cents: FLAT_RATE or TIERED_BRAND_PAIR" }
      - { name: accepted_clock_iso, type: datetime, source: system, description: "Logical-clock instant the receiving agreement accepted; null until accepted", constraints: "may be null" }
      - { name: expires_clock_iso, type: datetime, source: computed, description: "created_at advanced by REFERRAL_EXPIRY_HOURS; after this instant the referral may no longer be accepted" }
      - { name: settled_clock_iso, type: datetime, source: system, description: "Logical-clock instant the referral settled; null until settled", constraints: "may be null" }
      - { name: dispute_reason, type: string, source: input, description: "Reason supplied when the referral is disputed", constraints: "may be null" }
      - { name: status, type: enum, source: system, description: "Referral lifecycle", constraints: "PENDING | ACCEPTED | DECLINED | COMPLETED | DISPUTED | SETTLED" }

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; the brand the lead was generated for" }
      - { name: source, type: enum, source: input, description: "Lead origin", constraints: "CALL_CENTER | WEB | NATIONAL_ACCOUNT" }
      - { name: household_income_band, type: enum, source: input, description: "Shared call center income band used for lead pricing", constraints: "BAND_1 | BAND_2 | BAND_3 | BAND_4" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Estimated job value used to price the lead", constraints: ">= 0" }
      - { name: allocated_agreement_id, type: string, source: system, description: "FK -> FranchiseAgreement.id; the agreement the lead was allocated to, null while status IN {RECEIVED, EXPIRED}", constraints: "may be null" }
      - { name: received_clock_iso, type: datetime, source: system, description: "Logical-clock instant the lead entered the shared pool" }
      - { name: allocated_clock_iso, type: datetime, source: system, description: "Logical-clock instant the lead was allocated; null until allocated", constraints: "may be null" }
      - { name: allocation_hold_until_iso, type: datetime, source: computed, description: "allocated_clock_iso advanced by ALLOCATION_HOLD_HOURS; null until allocated" }
      - { name: released_clock_iso, type: datetime, source: system, description: "Logical-clock instant the allocation was released; null unless released", constraints: "may be null" }
      - { name: lead_cost_cents, type: integer, source: computed, description: "Cost charged to the receiving agreement, resolved against the band tier and the franchisee's multi-brand status" }
      - { name: status, type: enum, source: system, description: "Lead lifecycle", constraints: "RECEIVED | ALLOCATED | CONVERTED | RELEASED | EXPIRED" }

  - name: NationalAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Program customer name" }
      - { name: account_type, type: enum, source: input, description: "Program class", constraints: "NATIONAL_ACCOUNT | PROPERTY_MANAGER" }
      - { name: contracted_brands, type: array, source: input, description: "Brand ids the program may dispatch work to", constraints: "non-empty" }
      - { name: service_level_hours, type: integer, source: input, description: "Hours from dispatch to completion allowed by the program", constraints: ">= 1" }
      - { name: sla_credit_per_breach_cents, type: integer, source: input, description: "Credit owed to the program per completed-late work order", constraints: ">= 0" }
      - { name: breach_tolerance, type: integer, source: input, description: "Number of breaches the program absorbs before it is auto-suspended", constraints: ">= 1" }
      - { name: annual_commitment_cents, type: integer, source: input, description: "Contracted annual spend floor", constraints: ">= 0" }
      - { name: open_breach_count, type: integer, source: computed, description: "Count of this program's WorkOrder rows in status SLA_BREACHED" }
      - { name: sla_credit_accrued_cents, type: integer, source: computed, description: "Sum of sla_credit_per_breach_cents over this program's breached work orders, less any waived breaches" }
      - { name: accumulated_revenue_cents, type: integer, source: computed, description: "Sum of revenue_cents over this program's WorkOrder rows in status COMPLETED or SLA_BREACHED" }
      - { name: commitment_attainment_pct, type: number, source: computed, description: "accumulated_revenue_cents divided by annual_commitment_cents, rounded to 4 decimal places" }
      - { name: status, type: enum, source: system, description: "Program standing", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the performing agreement" }
      - { name: source, type: enum, source: input, description: "How the work arrived", constraints: "NATIONAL_ACCOUNT | PROPERTY_MANAGER | CALL_CENTER_LEAD | CROSS_BRAND_REFERRAL | DIRECT" }
      - { name: national_account_id, type: string, source: input, description: "FK -> NationalAccount.id; required when source IN {NATIONAL_ACCOUNT, PROPERTY_MANAGER}, else null", constraints: "may be null" }
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id; required when source is CALL_CENTER_LEAD, else null", constraints: "may be null" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; required when source is CROSS_BRAND_REFERRAL, else null", constraints: "may be null" }
      - { name: priority, type: enum, source: input, description: "Dispatch priority", constraints: "EMERGENCY | URGENT | STANDARD" }
      - { name: service_level_hours, type: integer, source: input, description: "Hours allowed from dispatch to completion; must not exceed the program's when a program applies", constraints: ">= 1" }
      - { name: parts_cents, type: integer, source: input, default: 0, description: "Parts billed on the work order", constraints: ">= 0" }
      - { name: dispatched_clock_iso, type: datetime, source: system, description: "Logical-clock instant the work order was dispatched" }
      - { name: sla_due_iso, type: datetime, source: computed, description: "dispatched_clock_iso advanced by the priority-scaled service_level_hours" }
      - { name: closed_clock_iso, type: datetime, source: system, description: "Logical-clock instant the work order reached a terminal state; null until then", constraints: "may be null" }
      - { name: labor_cents, type: integer, source: computed, description: "Priority- and source-scaled labor charge, computed on completion" }
      - { name: revenue_cents, type: integer, source: computed, description: "labor_cents + parts_cents, computed on completion" }
      - { name: status, type: enum, source: system, description: "Work order lifecycle", constraints: "CREATED | DISPATCHED | IN_PROGRESS | COMPLETED | SLA_BREACHED" }

  - name: BrandStandardsAudit
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the agreement audited" }
      - { name: auditor_operator_id, type: string, source: input, description: "Opaque id of the franchisor operator who conducted the audit; may be assigned at creation or supplied on conduct", constraints: "may be null until conduct" }
      - { name: audit_kind, type: enum, source: input, description: "Audit channel that sets the scoring weight", constraints: "ANNOUNCED | MYSTERY_SHOP" }
      - { name: conducted_iso, type: datetime, source: input, description: "Instant the audit was conducted" }
      - { name: raw_score, type: number, source: input, description: "Unweighted audit score", constraints: "0 <= x <= 100" }
      - { name: findings_count, type: integer, source: input, description: "Total findings recorded", constraints: ">= 0" }
      - { name: critical_findings_count, type: integer, source: input, default: 0, description: "Findings classified critical", constraints: ">= 0 and <= findings_count" }
      - { name: weighted_score, type: number, source: computed, description: "raw_score adjusted by the audit_kind weight and the critical-finding penalty, floored at 0 and capped at 100" }
      - { name: outcome, type: enum, source: computed, description: "Derived band of weighted_score", constraints: "PASS | WATCH | FAIL" }
      - { name: audit_status, type: enum, source: system, description: "Dimension A — audit pipeline", constraints: "SCHEDULED | CONDUCTED | PUBLISHED | SUPERSEDED" }
      - { name: remediation_status, type: enum, source: system, description: "Dimension B — remediation pipeline, independent of audit_status", constraints: "NONE | OPEN | SUBMITTED | RE_VERIFICATION | RESOLVED | ESCALATED | DEFAULTED" }
      - { name: remediation_owner_operator_id, type: string, source: system, description: "Opaque id of the franchisee-side operator who owns the remediation; null unless remediation_status != NONE", constraints: "may be null" }
      - { name: remediation_verifier_operator_id, type: string, source: input, description: "Opaque id of the franchisor operator who acknowledges and resolves; must differ from the owner", constraints: "may be null" }
      - { name: verification_audit_id, type: string, source: input, description: "FK -> BrandStandardsAudit.id; the re-verification audit submitted against this remediation", constraints: "may be null; must not equal this row's own id" }
      - { name: remediation_due_iso, type: datetime, source: computed, description: "remediation_opened_clock_iso advanced by STANDARDS_REMEDIATION_HOURS; null unless a remediation was opened" }
      - { name: remediation_opened_clock_iso, type: datetime, source: system, description: "Logical-clock instant the remediation was opened; null unless opened", constraints: "may be null" }
      - { name: remediation_resolved_clock_iso, type: datetime, source: system, description: "Logical-clock instant the remediation resolved; null until resolved", constraints: "may be null" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id" }
      - { name: period_start, type: datetime, source: input, description: "Statement period start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Statement period end, exclusive" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Reported gross revenue for the period", constraints: ">= 0" }
      - { name: royalty_cents, type: integer, source: computed, description: "Royalty accrual for the period, resolved by the royalty_accrual_calculation variant" }
      - { name: ad_fund_cents, type: integer, source: computed, description: "National advertising fund accrual for the period" }
      - { name: referral_offset_cents, type: integer, source: computed, description: "Referral fees earned on referrals SETTLED inside the period touching this agreement, netted against fees owed" }
      - { name: net_remittance_cents, type: integer, source: computed, description: "Amount remitted to the franchisor: royalty_cents + ad_fund_cents - referral_offset_cents" }
      - { name: accrual_variant, type: string, source: computed, description: "Which variant produced royalty_cents: DRAFT_PROPORTIONAL or FINAL_NETTED" }
      - { name: issued_clock_iso, type: datetime, source: system, description: "Logical-clock instant the statement was issued; null while DRAFT", constraints: "may be null" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", constraints: "DRAFT | ISSUED | PAID | VOIDED" }
  - name: TerritoryAssignment
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the territory whose holding this row records" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the holding franchisee" }
      - { name: source_agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the agreement under which the territory is held" }
      - { name: assignment_kind, type: enum, source: input, description: "How the territory moved", constraints: "INITIAL_AWARD | RESALE | TRANSFER | TERRITORY_REALLOCATION" }
      - { name: assigned_on, type: datetime, source: system, description: "Logical-clock instant the assignment takes effect" }
      - { name: released_on, type: datetime, source: system, description: "Logical-clock instant the assignment ends; null while the assignment is live", constraints: "may be null" }
      - { name: active, type: boolean, source: computed, description: "True while released_on is null" }

  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; the agreement being resold, transferred or reallocated" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the territory in scope" }
      - { name: applicant_franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the incoming operator" }
      - { name: transfer_kind, type: enum, source: input, description: "Disposition type", constraints: "RESALE | TRANSFER | TERRITORY_REALLOCATION" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Consideration for the disposition", constraints: ">= 0" }
      - { name: target_territory_ids, type: array, source: input, default: [], description: "Territory ids carved out or merged during a TERRITORY_REALLOCATION; empty for RESALE and TRANSFER", constraints: "may be empty" }
      - { name: transfer_fee_cents, type: integer, source: computed, default: 0, description: "Franchisor transfer fee, computed from purchase_price_cents and transfer_kind at APPROVED" }
      - { name: reviewer_operator_id, type: string, source: system, description: "Opaque id of the franchisor operator who reviews; null until begin-review", constraints: "may be null" }
      - { name: approval_operator_id, type: string, source: system, description: "Opaque id of the franchisor operator who approves; null until approved and must differ from the reviewer", constraints: "may be null" }
      - { name: reason, type: string, source: system, description: "Reason recorded on a revision request or rejection; null otherwise", constraints: "may be null" }
      - { name: status, type: enum, source: system, description: "Application lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | CLOSED" }

notes:
  - "REFERRAL_EXPIRY_HOURS is 168, so a referral expires exactly seven logical days after it is created."
  - "ALLOCATION_HOLD_HOURS is 26, so a lead allocation is releasable exactly 26 logical hours after it is allocated."
  - "STANDARDS_REMEDIATION_HOURS is 168, so a remediation is due exactly seven logical days after it is opened."
  - "The franchisor protected-household cap is 250000 per franchisee, applied across all brands."
  - "Where two records of the same entity share a created_at instant, the entity's human-readable key ascending (brand_code, legal_name, territory_code, agreement_number, referral_code) is the tie-break for every order-sensitive rule. Random identifiers never decide an observable result."
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Territory: quota/allocation ladder with a self-referential carve-out ----
  - entity: Territory
    initial_state: DEFINED
    terminal_states: [RECLAIMED]
    transitions:
      - from: DEFINED
        to: OFFERED
        trigger: "POST /franchise/territories/{id}/offer"
        actor: FranchiseAdmin
        preconditions:
          - "territory.franchisee_id is not null"
          - "No Territory row with the same brand_id whose status is not RECLAIMED shares any member of postal_codes (ERR_TERRITORY_POSTAL_OVERLAP)"
        side_effects: []

      - from: OFFERED
        to: AWARDED
        trigger: "POST /franchise/territories/{id}/award"
        actor: FranchiseAdmin
        preconditions:
          - "territory.franchisee_id is not null"
          - "Sum of household_count over the franchisee's Territory rows in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED}, plus this territory.household_count, <= 250000 (ERR_HOUSEHOLD_CAP_EXCEEDED)"
          - "No Territory row with the same brand_id whose status is not RECLAIMED shares any member of postal_codes (ERR_TERRITORY_POSTAL_OVERLAP)"
          - "A FranchiseAgreement row exists with franchisee_id, brand_id and territory_id matching and lifecycle_status IN {OFFERED, ACTIVE} (ERR_AGREEMENT_REQUIRED_FOR_AWARD)"
        side_effects:
          - "territory.allocated_households := territory.household_count"
          - "franchisee.allocated_households recomputed as the sum of household_count over Territory rows in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED}"

      - from: AWARDED
        to: ACTIVE
        trigger: "system (automatic when the bound FranchiseAgreement lifecycle_status becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "franchisee.active_agreement_count recomputed"
          - "franchisee.active_brand_count recomputed as the count of distinct brand_id over that franchisee's FranchiseAgreement rows in lifecycle_status IN {ACTIVE, RENEWAL_PENDING, TRANSFER_PENDING}"

      - from: ACTIVE
        to: EXPANSION_REQUESTED
        trigger: "POST /franchise/territories/{id}/request-expansion"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee_id equals territory.franchisee_id"
          - "territory.protected is true"
          - "territory.expansion_right_households > 0"
          - "territory.household_count >= territory.expansion_right_households (ERR_EXPANSION_THRESHOLD_NOT_MET; the comparison is >=, so a household_count exactly equal to the threshold qualifies)"
        side_effects: ["The territory keeps its full household_count against the franchisee cap while the expansion is pending"]

      - from: EXPANSION_REQUESTED
        to: ACTIVE
        trigger: "POST /franchise/territories/{id}/withdraw-expansion"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee_id equals territory.franchisee_id"
        side_effects: []

      - from: EXPANSION_REQUESTED
        to: PENDING_REALLOCATION
        trigger: "POST /franchise/territories/{id}/reallocate"
        actor: FranchiseAdmin
        preconditions:
          - "The acting territory has a non-empty protected postal set to divide (ERR_TARGET_TERRITORY_INVALID when postal_codes is empty)"
          - "Every id in target_territory_ids names a Territory row of the same brand_id with status DEFINED whose postal_codes is empty — the row is a placeholder for the carved area, not an already-protected territory (ERR_TARGET_TERRITORY_INVALID)"
          - "len(target_territory_ids) <= len(this territory's postal_codes) (ERR_TARGET_TERRITORY_INVALID)"
          - "The postal_codes are assigned to targets in ascending territory_code order, each target receiving at least one code"
        side_effects:
          - "The child Territory rows named by target_territory_ids have their postal_codes filled from this territory's postal_codes in ascending territory_code order, and their parent_territory_id and source_of_reallocation_id both set to this territory's id"
          - "This territory.postal_codes := [] and this territory.status := PENDING_REALLOCATION"

      - from: PENDING_REALLOCATION
        to: RECLAIMED
        trigger: "POST /franchise/territories/{id}/reclaim"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "territory.franchisee_id := null and territory.allocated_households := 0"
          - "franchisee.allocated_households recomputed"
          - "Every Territory child row whose parent_territory_id or source_of_reallocation_id equals this territory's id moves to status RECLAIMED and stamps allocated_households := 0"

  # --- FranchiseAgreement: parallel dimensions (commercial x standards) ------
  - entity: FranchiseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /franchise/agreements/{id}/offer"
        actor: FranchiseAdmin
        preconditions:
          - "expires_on > signed_on"
        side_effects: []

      - from: OFFERED
        to: ACTIVE
        trigger: "POST /franchise/agreements/{id}/activate"
        actor: FranchiseAdmin
        preconditions:
          - "The bound Territory row has status AWARDED (ERR_AGREEMENT_TERRITORY_NOT_AWARDED)"
          - "No other FranchiseAgreement row for the same territory_id has lifecycle_status IN {ACTIVE, RENEWAL_PENDING, TRANSFER_PENDING} (ERR_TERRITORY_ALREADY_AGREED)"
        side_effects:
          - "The bound Territory row (AWARDED) moves to ACTIVE via its system transition"
          - "franchisee.status := ACTIVE when it was PROSPECT"
          - "A TerritoryAssignment row is synthesized with assignment_kind INITIAL_AWARD, assigned_on := logical clock, released_on null"

      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /franchise/agreements/{id}/renew"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee_id equals the agreement's franchisee_id"
          - "expires_on is strictly before (logical clock + 90 days) (ERR_RENEWAL_WINDOW_CLOSED)"
          - "The agreement's standards_status is not DEFAULT (ERR_STANDARDS_DEFAULTED)"
        side_effects: ["agreement.renewal_clock_iso := logical clock"]

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /franchise/agreements/{id}/activate-renewal"
        actor: FranchiseAdmin
        preconditions:
          - "The agreement's open_remediation_count is 0 (ERR_OPEN_REMEDIATION)"
          - "The agreement's standards_status is not DEFAULT (ERR_STANDARDS_DEFAULTED)"
        side_effects:
          - "A TerritoryAssignment row is synthesized with assignment_kind INITIAL_AWARD and released_on null"
          - "franchisee.active_agreement_count recomputed"

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /franchise/transfer-applications/{id}/withdraw"
        actor: FranchiseeOperator
        preconditions: ["The acting franchisee_id equals the withdrawing application's applicant franchisee_id"]
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /franchise/agreements/{id}/suspend"
        actor: FranchiseAdmin
        preconditions:
          - "lifecycle_status is ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "The bound Territory row moves from AWARDED or ACTIVE to PENDING_REALLOCATION, retaining its franchisee_id and allocated_households until the reclaim actually fires"
          - "franchisee.active_agreement_count recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /franchise/agreements/{id}/reinstate"
        actor: FranchiseAdmin
        preconditions: ["The bound Territory row has status PENDING_REALLOCATION"]
        side_effects:
          - "The bound Territory row moves back to ACTIVE"
          - "franchisee.active_agreement_count recomputed"

      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /franchise/transfer-applications"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee_id equals the agreement's franchisee_id"
          - "lifecycle_status is ACTIVE (ERR_INVALID_STATE)"
          - "No other TransferApplication row for this agreement_id has status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED} (ERR_TRANSFER_ALREADY_PENDING)"
        side_effects: ["This agreement becomes the agreement_id of the newly created TransferApplication"]

      - from: TRANSFER_PENDING
        to: TERMINATED
        trigger: "POST /franchise/transfer-applications/{id}/close"
        actor: FranchiseAdmin
        preconditions:
          - "The application's approval_operator_id is non-null and differs from its reviewer_operator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "The agreement's open_remediation_count is 0 (ERR_OPEN_REMEDIATION)"
        side_effects:
          - "This agreement.lifecycle_status := TERMINATED"
          - "franchisee.active_agreement_count recomputed for both the outgoing and incoming franchisees"

      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /franchise/transfer-applications/{id}/reject"
        actor: FranchiseAdmin
        preconditions: ["reason is non-empty (ERR_INVALID_REQUEST)"]
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic during POST /_ops/run_sweep when the logical clock is at or past expires_on)"
        actor: system
        preconditions:
          - "logical clock >= expires_on (ERR_AGREEMENT_NOT_EXPIRABLE when the clock is strictly before expires_on)"
        side_effects:
          - "franchisee.active_agreement_count recomputed"
          - "When the recomputed count reaches 0, franchisee.status := TERMINATED"
          - "The bound Territory row's franchisee_id := null, status := PENDING_REALLOCATION, allocated_households := 0"
          - "franchisee.allocated_households recomputed, so the expiring territory no longer counts against that franchisee's cap"

  # --- Referral: cyclic accept/reject/dispute loop + settlement --------------
  - entity: Referral
    initial_state: PENDING
    terminal_states: [DECLINED, SETTLED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /franchise/referrals/{id}/accept"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the receiving agreement's franchisee_id (ERR_NOT_RECEIVING_FRANCHISEE)"
          - "logical clock is strictly before referral.expires_clock_iso (ERR_REFERRAL_EXPIRED)"
        side_effects: ["referral.accepted_clock_iso := logical clock"]

      - from: PENDING
        to: DECLINED
        trigger: "POST /franchise/referrals/{id}/decline"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the receiving agreement's franchisee_id (ERR_NOT_RECEIVING_FRANCHISEE)"
        side_effects: []

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /franchise/referrals/{id}/complete"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the receiving agreement's franchisee_id (ERR_NOT_RECEIVING_FRANCHISEE)"
        side_effects:
          - "referral.settled_job_value_cents := settled_job_value_cents from the request body"
          - "A WorkOrder row is synthesized with source CROSS_BRAND_REFERRAL, agreement_id := receiving_agreement_id, referral_id bound, status CREATED"

      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /franchise/referrals/{id}/dispute"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals one of the two agreements' franchisee_id (ERR_NOT_REFERRAL_PARTY)"
          - "dispute_reason is non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["referral.dispute_reason := dispute_reason from the request body"]

      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /franchise/referrals/{id}/resolve-dispute"
        actor: FranchiseAdmin
        preconditions: []
        side_effects: []

      - from: COMPLETED
        to: SETTLED
        trigger: "POST /franchise/referrals/{id}/settle"
        actor: FranchiseAdmin
        preconditions:
          - "No open dispute on this referral (ERR_REFERRAL_DISPUTED)"
        side_effects:
          - "referral.referral_fee_cents := the value produced by the referral_fee_calculation variant active at settlement"
          - "referral.fee_variant := the variant name that produced it"
          - "referral.settled_clock_iso := logical clock"
          - "originating agreement.cumulative_referral_net_cents += referral_fee_cents"
          - "receiving agreement.cumulative_referral_net_cents -= referral_fee_cents"

  # --- Lead: allocation hold with selector + release -------------------------
  - entity: Lead
    initial_state: RECEIVED
    terminal_states: [CONVERTED, EXPIRED]
    transitions:
      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /franchise/leads/{id}/allocate"
        actor: FranchiseAdmin
        preconditions:
          - "lead.source is CALL_CENTER and lead.brand_id matches the target agreement's brand_id (ERR_LEAD_BRAND_MISMATCH)"
          - "No Lead row with the same brand_id and status ALLOCATED has an allocation_hold_until_iso strictly after the logical clock (ERR_LEAD_POOL_EMPTY)"
          - "The receiving agreement's franchisee has shared_services_enrolled true (ERR_SHARED_SERVICES_REQUIRED)"
        side_effects:
          - "lead.status := ALLOCATED"
          - "lead.allocated_agreement_id := the agreement selected by recipient_selection_calculation"
          - "lead.allocated_clock_iso := logical clock"
          - "lead.allocation_hold_until_iso := logical clock + ALLOCATION_HOLD_HOURS"
          - "lead.lead_cost_cents := lead_cost_calculation output for the resolved band tier and the receiving franchisee's multi-brand status"
          - "The receiving franchisee.lead_cost_balance_cents += lead_cost_cents"

      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /franchise/leads/{id}/release"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the allocated agreement's franchisee_id (ERR_NOT_RECEIVING_FRANCHISEE)"
          - "logical clock is strictly after lead.allocation_hold_until_iso (ERR_HOLD_WINDOW_ACTIVE)"
        side_effects:
          - "lead.released_clock_iso := logical clock"
          - "The receiving franchisee.lead_cost_balance_cents -= lead.lead_cost_cents"
          - "lead.lead_cost_cents := 0"

      - from: ALLOCATED
        to: CONVERTED
        trigger: "POST /franchise/leads/{id}/convert"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "A WorkOrder row is synthesized with source CALL_CENTER_LEAD, lead_id bound, agreement_id := allocated_agreement_id, status CREATED"

  # --- WorkOrder: SLA threshold breach + national-account cascade ------------
  - entity: WorkOrder
    initial_state: CREATED
    terminal_states: [COMPLETED, SLA_BREACHED]
    transitions:
      - from: CREATED
        to: DISPATCHED
        trigger: "POST /franchise/work-orders/{id}/dispatch"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the performing agreement's franchisee_id (ERR_NOT_PERFORMING_FRANCHISEE)"
          - "The performing agreement's certification_level is at least the brand's min_certification_level, ranked APPRENTICE < JOURNEYMAN < MASTER (ERR_CERTIFICATION_TOO_LOW)"
          - "When source IN {NATIONAL_ACCOUNT, PROPERTY_MANAGER}, national_account_id is set and the performing agreement's brand_id is a member of that program's contracted_brands (ERR_ACCOUNT_BRAND_NOT_CONTRACTED)"
          - "When source IN {NATIONAL_ACCOUNT, PROPERTY_MANAGER}, service_level_hours <= the program's service_level_hours (ERR_SLA_WINDOW_EXCEEDS_PROGRAM)"
        side_effects:
          - "workorder.dispatched_clock_iso := logical clock"
          - "workorder.sla_due_iso := logical clock + priority-scaled service_level_hours, where the scale is EMERGENCY 0.5, URGENT 0.75, STANDARD 1.0 and the result is rounded up to whole hours"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /franchise/work-orders/{id}/start"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the performing agreement's franchisee_id (ERR_NOT_PERFORMING_FRANCHISEE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /franchise/work-orders/{id}/complete"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee's id equals the performing agreement's franchisee_id (ERR_NOT_PERFORMING_FRANCHISEE)"
        side_effects:
          - "workorder.closed_clock_iso := logical clock"
          - "workorder.labor_cents := labor_charge_calculation output"
          - "workorder.revenue_cents := labor_cents + parts_cents"

      - from: DISPATCHED
        to: SLA_BREACHED
        trigger: "system (automatic during POST /_ops/run_sweep when the logical clock is at or past sla_due_iso)"
        actor: system
        preconditions:
          - "logical clock >= workorder.sla_due_iso (ERR_SLA_NOT_BREACHED when the clock is strictly before it)"
        side_effects:
          - "workorder.closed_clock_iso := logical clock"
          - "workorder.labor_cents := labor_charge_calculation output computed at breach"
          - "workorder.revenue_cents := labor_cents + parts_cents"
          - "When national_account_id is set: national_account.open_breach_count += 1"
          - "When national_account_id is set: national_account.sla_credit_accrued_cents += the program's sla_credit_per_breach_cents"
          - "When national_account_id is set and the recomputed open_breach_count > the program's breach_tolerance: national_account.status := SUSPENDED"
          - "When workorder.referral_id is set and that Referral row has status ACCEPTED: the referral moves to COMPLETED"

      - from: IN_PROGRESS
        to: SLA_BREACHED
        trigger: "POST /franchise/work-orders/{id}/breach"
        actor: FranchiseAdmin
        preconditions:
          - "logical clock >= workorder.sla_due_iso (ERR_SLA_NOT_BREACHED)"
        side_effects:
          - "workorder.closed_clock_iso := logical clock"
          - "When national_account_id is set: national_account.open_breach_count += 1"
          - "When national_account_id is set: national_account.sla_credit_accrued_cents += the program's sla_credit_per_breach_cents"
          - "When national_account_id is set and the recomputed open_breach_count > the program's breach_tolerance: national_account.status := SUSPENDED"

  # --- BrandStandardsAudit: parallel dimensions (audit x remediation) --------
  - entity: BrandStandardsAudit
    initial_state: SCHEDULED
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /franchise/brand-standards-audits/{id}/conduct"
        actor: FranchiseAdmin
        preconditions:
          - "auditor_operator_id is non-empty (ERR_AUDITOR_REQUIRED)"
          - "critical_findings_count <= findings_count (ERR_INVALID_REQUEST)"
        side_effects:
          - "audit.weighted_score := standards_audit_score_calculation output"
          - "audit.outcome := PASS when weighted_score >= 85.0, WATCH when 70.0 <= weighted_score < 85.0, FAIL when weighted_score < 70.0"

      - from: CONDUCTED
        to: PUBLISHED
        trigger: "POST /franchise/brand-standards-audits/{id}/publish"
        actor: FranchiseAdmin
        preconditions:
          - "The agreement's audit_due_iso is null, or this audit's conducted_iso is strictly before it (ERR_AUDIT_CYCLE_EXCEEDED)"
        side_effects:
          - "The agreement's audit_due_iso := this audit's conducted_iso advanced by the brand's audit_cycle_months"
          - "Every earlier BrandStandardsAudit row for the same agreement_id with audit_status PUBLISHED moves to SUPERSEDED"
          - "When audit.outcome is FAIL: audit.remediation_status := OPEN, audit.remediation_owner_operator_id := the agreement franchisee's principal operator id, audit.remediation_opened_clock_iso := logical clock, audit.remediation_due_iso := logical clock + STANDARDS_REMEDIATION_HOURS"
          - "The agreement's open_remediation_count recomputed"
          - "The agreement's standards_status is recomputed as the worst posture over its audits: DEFAULT if any open remediation's remediation_status is DEFAULTED, else REMEDIATION_REQUIRED if any audit's remediation_status IN {OPEN, SUBMITTED, RE_VERIFICATION, ESCALATED} or any published outcome is FAIL, else WATCH if the latest published outcome is WATCH, else COMPLIANT"

      - from: PUBLISHED
        to: CONDUCTED
        trigger: POST /franchise/brand-standards-audits/{id}/reopen
        actor: FranchiseAdmin
        preconditions:
          - "The audit was published within the last 24 logical hours, i.e. logical clock is strictly before (conducted_iso + 24 hours) (ERR_REOPEN_WINDOW_CLOSED)"
        side_effects:
          - "audit.remediation_status := NONE and audit.remediation_opened_clock_iso := null"
          - "The agreement's open_remediation_count recomputed"
          - "The agreement's standards_status recomputed"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a later BrandStandardsAudit row for the same agreement_id reaches status PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []

  # --- RoyaltyStatement: dual-variant accrual -------------------------------
  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /franchise/royalty-statements/{id}/issue"
        actor: FranchiseAdmin
        preconditions:
          - "period_end > period_start (ERR_INVALID_PERIOD)"
        side_effects:
          - "statement.royalty_cents := royalty_accrual_calculation output under the FINAL_NETTED variant"
          - "statement.ad_fund_cents := royalty_accrual_calculation output for the national ad fund component"
          - "statement.referral_offset_cents := referral_offset_calculation output"
          - "statement.net_remittance_cents := royalty_cents + ad_fund_cents - referral_offset_cents"
          - "statement.accrual_variant := FINAL_NETTED"
          - "statement.issued_clock_iso := logical clock"
          - "The agreement's cumulative_royalty_cents += royalty_cents"

      - from: ISSUED
        to: PAID
        trigger: "POST /franchise/royalty-statements/{id}/pay"
        actor: FranchiseAdmin
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOIDED
        trigger: "POST /franchise/royalty-statements/{id}/void"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "The agreement's cumulative_royalty_cents -= royalty_cents"

# --- BrandStandardsAudit (second dimension): remediation pipeline ---------
  # Governs the entity's `remediation_status` field. It evolves INDEPENDENTLY
  # of `audit_status`, which the machine above governs — a published audit can
  # be re-opened while its remediation is escalated, and vice versa.
  - entity: BrandStandardsAudit
    dimension: remediation_status
    initial_state: NONE
    terminal_states: [RESOLVED, DEFAULTED]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "system (automatic at CONDUCTED -> PUBLISHED when the audit outcome is FAIL)"
        actor: system
        preconditions:
          - "audit.outcome == FAIL"
        side_effects:
          - "remediation_owner_operator_id := the agreement franchisee's principal operator id"
          - "remediation_opened_clock_iso := logical clock"
          - "remediation_due_iso := logical clock + STANDARDS_REMEDIATION_HOURS"
          - "The agreement's open_remediation_count recomputed"
          - "The agreement's standards_status recomputed"

      - from: OPEN
        to: SUBMITTED
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action SUBMIT"
        actor: FranchiseeOperator
        preconditions:
          - "verification_audit_id names a BrandStandardsAudit row for the same agreement_id (ERR_VERIFICATION_AUDIT_NOT_FOUND)"
          - "That verification audit's conducted_iso is at or before remediation_due_iso (ERR_REMEDIATION_WINDOW_CLOSED)"
        side_effects:
          - "audit.verification_audit_id := the supplied audit"
          - "The agreement's open_remediation_count recomputed"

      - from: OPEN
        to: ESCALATED
        trigger: "system (automatic during POST /_ops/run_sweep when the logical clock is at or past remediation_due_iso while remediation_status is OPEN)"
        actor: system
        preconditions:
          - "logical clock >= audit.remediation_due_iso"
        side_effects: ["The agreement's standards_status := REMEDIATION_REQUIRED"]

      - from: SUBMITTED
        to: RE_VERIFICATION
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action ACKNOWLEDGE"
        actor: FranchiseAdmin
        preconditions:
          - "verifier_operator_id is non-empty (ERR_INVALID_REQUEST)"
          - "verifier_operator_id != remediation_owner_operator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["audit.remediation_verifier_operator_id := the supplied operator"]

      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action ESCALATE"
        actor: FranchiseAdmin
        preconditions:
          - "logical clock >= audit.remediation_due_iso (ERR_REMEDIATION_NOT_OVERDUE; the comparison is >=, so escalating exactly at the due instant is allowed)"
          - "remediation_status is not DEFAULTED (ERR_ALREADY_TERMINAL)"
        side_effects: []
        note: "Reaching ESCALATED while audit_status is PUBLISHED is the ordinary path; the two dimensions do not gate each other, so an escalated remediation can still be reopened away by the audit_status machine."

      - from: RE_VERIFICATION
        to: RESOLVED
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action RESOLVE"
        actor: FranchiseAdmin
        preconditions:
          - "verifier_operator_id != remediation_owner_operator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "The verification audit's weighted_score >= 85.0 (ERR_REMEDIATION_FAILED)"
        side_effects:
          - "audit.remediation_resolved_clock_iso := logical clock"
          - "The agreement's open_remediation_count recomputed"
          - "The agreement's standards_status recomputed"

      - from: RE_VERIFICATION
        to: OPEN
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action REJECT"
        actor: FranchiseAdmin
        preconditions:
          - "verifier_operator_id != remediation_owner_operator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "audit.verification_audit_id := null"
          - "The agreement's open_remediation_count recomputed"

      - from: ESCALATED
        to: DEFAULTED
        trigger: "POST /franchise/brand-standards-audits/{id}/remediation-transitions action DEFAULT"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "The agreement's standards_status := DEFAULT"
          - "The agreement's open_remediation_count recomputed"
          - "The agreement's franchisee.status := SUSPENDED"

  # --- TransferApplication: branching fork with a revision loop -------------
  - entity: TransferApplication
    initial_state: SUBMITTED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /franchise/transfer-applications/{id}/begin-review"
        actor: FranchiseAdmin
        preconditions:
          - "reviewer_operator_id is non-empty (ERR_INVALID_REQUEST)"
          - "reviewer_operator_id differs from the submitting franchisee's principal operator (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["transfer_application.reviewer_operator_id := the supplied operator"]

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /franchise/transfer-applications/{id}/request-revision"
        actor: FranchiseAdmin
        preconditions:
          - "reason is non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["transfer_application.reason := the supplied reason"]

      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /franchise/transfer-applications/{id}/revise"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee equals the submitting franchisee (ERR_UNAUTHORIZED)"
          - "purchase_price_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects: ["transfer_application.purchase_price_cents := the supplied value", "transfer_application.reason := null"]

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /franchise/transfer-applications/{id}/approve"
        actor: FranchiseAdmin
        preconditions:
          - "approval_operator_id is non-empty (ERR_APPROVER_REQUIRED)"
          - "approval_operator_id != reviewer_operator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "The target agreement's open_remediation_count is 0 (ERR_OPEN_REMEDIATION)"
          - "The target agreement's standards_status is not DEFAULT (ERR_STANDARDS_DEFAULTED)"
        side_effects:
          - "transfer_application.approval_operator_id := the supplied operator"
          - "transfer_application.transfer_fee_cents := transfer_fee_calculation output"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /franchise/transfer-applications/{id}/reject"
        actor: FranchiseAdmin
        preconditions:
          - "reason is non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "transfer_application.reason := the supplied reason"
          - "The target FranchiseAgreement lifecycle_status reverts to ACTIVE"

      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /franchise/transfer-applications/{id}/withdraw"
        actor: FranchiseeOperator
        preconditions:
          - "The acting franchisee equals the submitting franchisee (ERR_UNAUTHORIZED)"
        side_effects: ["The target FranchiseAgreement lifecycle_status reverts to ACTIVE"]

      - from: APPROVED
        to: CLOSED
        trigger: "POST /franchise/transfer-applications/{id}/close"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "The in-scope Territory row's franchisee_id := applicant_franchisee_id"
          - "The target FranchiseAgreement lifecycle_status := TERMINATED"
          - "Every TerritoryAssignment row for that territory with released_on null has released_on stamped and active := false"
          - "A new TerritoryAssignment row is synthesized for the applicant with assignment_kind := transfer_kind and released_on null"
          - "When transfer_kind is TERRITORY_REALLOCATION, each id in target_territory_ids has franchisee_id := applicant_franchisee_id and status := AWARDED"
          - "franchisee.active_agreement_count recomputed for both the outgoing and incoming franchisees"# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: territory-award-stale-territory
    parent_entity: Territory
    write_endpoint: "POST /franchise/territories/{id}/award"
    occ_field: "expected_territory_version"
    description: |
      Awarding a Territory whose version has advanced since the operator last
      observed it is rejected. This captures the case where another writer has
      just reshaped the same territory — an offer, a reallocation carve-out, or
      a reclaim — so the current writer's view of the territory is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: referral-settle-stale-agreement
    parent_entity: FranchiseAgreement
    write_endpoint: "POST /franchise/referrals/{id}/settle"
    occ_field: "expected_agreement_version"
    description: |
      Settling a Referral against an originating agreement whose version has
      advanced since the settler last observed it is rejected, because a
      settlement moves cumulative_referral_net_cents on both agreements and
      would otherwise apply the fee to a stale view of the originator.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: audit-publish-stale-agreement
    parent_entity: FranchiseAgreement
    write_endpoint: "POST /franchise/brand-standards-audits/{id}/publish"
    occ_field: "expected_agreement_version"
    description: |
      Publishing a BrandStandardsAudit against an agreement whose version has
      advanced since the auditor last observed it is rejected, because a
      publish advances audit_due_iso, supersedes prior audits, and would
      otherwise write a stale standards_status computation onto the agreement.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: standards_audit_score_calculation
    trigger: "BrandStandardsAudit SCHEDULED -> CONDUCTED (POST /franchise/brand-standards-audits/{id}/conduct)"
    algorithm: weighted_scoring
    formula: |
      kind_weight = ANNOUNCED_WEIGHT      if audit.audit_kind == ANNOUNCED
                  = MYSTERY_SHOP_WEIGHT   if audit.audit_kind == MYSTERY_SHOP

      pre_clamp = (audit.raw_score * kind_weight)
                  - (CRITICAL_PENALTY_PER_FINDING * audit.critical_findings_count)

      weighted_score = round_half_up( min(100.0, max(0.0, pre_clamp)) , 1 )

      outcome = PASS   if weighted_score >= PASS_MIN     (>=, not >)
              = WATCH  if weighted_score >= WATCH_MIN and weighted_score < PASS_MIN
              = FAIL   if weighted_score <  WATCH_MIN
    input_set: "The single BrandStandardsAudit row being conducted. critical_findings_count participates as supplied; when the caller omits it the stored default of 0 applies."
    constants:
      ANNOUNCED_WEIGHT: 1.00
      MYSTERY_SHOP_WEIGHT: 0.80
      CRITICAL_PENALTY_PER_FINDING: 7.5
      PASS_MIN: 85.0
      WATCH_MIN: 70.0
    precision: "1 decimal place, round_half_up. Clamp to [0.0, 100.0] before rounding, not after."
    variants:
      - name: announced_audit
        when: "audit_kind == ANNOUNCED"
        difference: "Full raw_score weight of 1.00 — an announced audit cannot be discounted for channel."
      - name: mystery_shop_audit
        when: "audit_kind == MYSTERY_SHOP"
        difference: "raw_score is scaled by 0.80, so the same raw_score of 100.0 with zero critical findings yields weighted_score 80.0 (WATCH) rather than 100.0 (PASS)."

  - name: labor_charge_calculation
    trigger: "WorkOrder IN_PROGRESS -> COMPLETED (POST /franchise/work-orders/{id}/complete) and WorkOrder -> SLA_BREACHED (system or POST /franchise/work-orders/{id}/breach)"
    algorithm: tiered_pricing
    formula: |
      step_1_hours = max(1, ceil( workorder.service_level_hours * PRIORITY_HOURS_SCALE[workorder.priority] ))
      step_2_base  = step_1_hours * HOURLY_RATE_CENTS[workorder.priority]
      step_3_adj   = step_2_base * SOURCE_MULTIPLIER[workorder.source]
      labor_cents  = round_half_up(step_3_adj)

      # The scaffold PINS this order: hours are ceiled to a whole hour BEFORE the
      # hourly rate is applied, and the source multiplier is applied AFTER the
      # integer hour/rate product. A reader who instead computes
      #   round(rate * hours_fractional * multiplier)
      # gets a different number for any work order whose scaled hours are
      # fractional — see the pinned worked example below.
    input_set: "The single WorkOrder row being closed. service_level_hours is the value stored on the work order, which the dispatch precondition already capped at the program's window when a program applies."
    constants:
      HOURLY_RATE_CENTS: { EMERGENCY: 18500, URGENT: 18500, STANDARD: 14500 }
      PRIORITY_HOURS_SCALE: { EMERGENCY: 0.5, URGENT: 0.75, STANDARD: 1.0 }
      SOURCE_MULTIPLIER: { NATIONAL_ACCOUNT: 0.90, PROPERTY_MANAGER: 0.95, CALL_CENTER_LEAD: 1.00, CROSS_BRAND_REFERRAL: 0.85, DIRECT: 1.00 }
    precision: "Integer cents. round_half_up is applied once, at step 3, after the multiplier. step_1_hours and step_2_base are exact integers."
    variants:
      - name: emergency_rate
        when: "priority == EMERGENCY"
        difference: "Half-hour hours scaling with the EMERGENCY hourly rate: 6 service_level_hours becomes ceil(3.0)=3 billable hours."
      - name: standard_rate
        when: "priority == STANDARD"
        difference: "Unscaled hours at the STANDARD hourly rate: 6 service_level_hours stays 6 billable hours, so the same window costs 14500*6 rather than 18500*3 before the source multiplier."

  - name: lead_cost_calculation
    trigger: "Lead RECEIVED -> ALLOCATED (POST /franchise/leads/{id}/allocate)"
    algorithm: tiered_pricing
    formula: |
      value_units     = ceil( lead.estimated_value_cents / VALUE_UNIT_CENTS )
      value_surcharge = value_units * VALUE_UNIT_RATE_CENTS
      subtotal        = BAND_BASE_CENTS[lead.household_income_band] + value_surcharge

      if receiving_franchisee.active_brand_count >= MULTI_BRAND_MIN:
          lead_cost_cents = round_half_up( subtotal * MULTI_BRAND_DISCOUNT )
      else:
          lead_cost_cents = subtotal

      # evaluation order is pinned: the band base and value surcharge are summed
      # first, and the multi-brand portfolio discount is applied to that subtotal
      # last. Applying the discount to the value surcharge alone would understate
      # the portfolio credit.
    input_set: "The single Lead row being allocated plus the receiving FranchiseAgreement's Franchisee. The band is read from the lead, the multi-brand tier from the receiving franchisee, so two leads with identical band and value can price differently."
    constants:
      BAND_BASE_CENTS: { BAND_1: 2500, BAND_2: 4000, BAND_3: 6500, BAND_4: 9000 }
      VALUE_UNIT_CENTS: 100000
      VALUE_UNIT_RATE_CENTS: 250
      MULTI_BRAND_MIN: 3
      MULTI_BRAND_DISCOUNT: 0.85
    precision: "Integer cents. value_units uses ceiling division; the discount multiplication uses round_half_up."

  - name: referral_fee_calculation
    trigger: "Referral COMPLETED -> SETTLED (POST /franchise/referrals/{id}/settle)"
    algorithm: tiered_pricing
    formula: |
      receiving_brand   = Brand[ agreement(referral.receiving_agreement_id).brand_id ]
      originating_brand = Brand[ agreement(referral.originating_agreement_id).brand_id ]

      if receiving_brand.cross_brand_fee_table contains a key equal to originating_brand.brand_code:
          rate = receiving_brand.cross_brand_fee_table[ originating_brand.brand_code ].rate
          referral_fee_cents = round_half_up( rate * referral.settled_job_value_cents )
          fee_variant = TIERED_BRAND_PAIR
      else:
          referral_fee_cents = round_half_up( referral.referral_fee_rate * referral.settled_job_value_cents )
          fee_variant = FLAT_RATE
    input_set: "The single Referral row being settled, plus the two Brand rows reachable through its originating_agreement_id and receiving_agreement_id. Only settled_job_value_cents participates — estimated_job_value_cents is never read at settlement."
    constants: {}
    precision: "Integer cents, round_half_up."
    variants:
      - name: flat_rate
        when: "The receiving brand's cross_brand_fee_table has no key matching the originating brand's brand_code"
        difference: "Referral.referral_fee_cents is referral_fee_rate * settled_job_value_cents."
      - name: tiered_brand_pair
        when: "The receiving brand's cross_brand_fee_table HAS a key matching the originating brand's brand_code"
        difference: "The table's rate replaces referral_fee_rate entirely, so a referral carrying referral_fee_rate 0.10 settles at the table rate instead — identical inputs, different referral_fee_cents and a different fee_variant."

  - name: royalty_accrual_calculation
    trigger: "RoyaltyStatement DRAFT -> ISSUED (POST /franchise/royalty-statements/{id}/issue). The DRAFT_PROPORTIONAL variant is also read by GET /franchise/royalty-statements/{id}/preview while the row is DRAFT."
    algorithm: aggregation
    formula: |
      royalty_component = round_half_up( statement.gross_revenue_cents * agreement.effective_royalty_rate )
      ad_fund_component = round_half_up( statement.gross_revenue_cents * brand.national_ad_fund_rate )

      # DRAFT_PROPORTIONAL — provisional, reported by the preview read
      royalty_cents         = max(0, royalty_component)
      referral_offset_cents = 0
      net_remittance_cents  = royalty_cents + ad_fund_cents

      # FINAL_NETTED — final, written at ISSUE
      referral_offset_cents = referral_offset_calculation(agreement, period_start, period_end)
      royalty_cents         = max(0, royalty_component)
      net_remittance_cents  = max(0, royalty_cents + ad_fund_cents - referral_offset_cents)

      # evaluation order is pinned: referral offsets are read from the set of
      # referrals that were ALREADY SETTLED when the statement is ISSUED; the
      # statement never recomputes a settled referral's fee, and the floor at 0
      # is applied last, after the subtraction.
    input_set: "The single RoyaltyStatement row plus its FranchiseAgreement (for effective_royalty_rate), that agreement's Brand (for national_ad_fund_rate), and the Referral rows in status SETTLED with settled_clock_iso in [period_start, period_end) touching the agreement."
    constants: {}
    precision: "Integer cents. Each component is rounded with round_half_up independently BEFORE the subtraction; the max(0, ...) floor is applied after the subtraction, never to the components."
    variants:
      - name: draft_proportional
        when: "The statement is still DRAFT and read through GET /franchise/royalty-statements/{id}/preview"
        difference: "referral_offset_cents is 0, so net_remittance_cents == royalty_cents + ad_fund_cents."
      - name: final_netted
        when: "The statement is ISSUED"
        difference: "referral_offset_cents carries the net settled-referral position for the period, so net_remittance_cents is lower than the draft figure by exactly referral_offset_cents (floored at 0) on identical gross revenue."

  - name: referral_offset_calculation
    trigger: "Read by royalty_accrual_calculation at RoyaltyStatement ISSUE, and written onto RoyaltyStatement.referral_offset_cents"
    algorithm: aggregation
    formula: |
      earned = sum( r.referral_fee_cents
                    for r in Referral
                    where r.status == SETTLED
                      and r.originating_agreement_id == agreement.id
                      and r.settled_clock_iso >= period_start     # inclusive
                      and r.settled_clock_iso <  period_end )     # exclusive

      owed   = sum( r.referral_fee_cents
                    for r in Referral
                    where r.status == SETTLED
                      and r.receiving_agreement_id == agreement.id
                      and r.settled_clock_iso >= period_start     # inclusive
                      and r.settled_clock_iso <  period_end )     # exclusive

      referral_offset_cents = earned - owed        # may be negative; NOT clamped here
    input_set: "Referral rows in status SETTLED only. DISPUTED and COMPLETED referrals do not enter the sweep even when their settled_job_value_cents is known. The window is half-open [period_start, period_end)."
    constants: {}
    precision: "Integer cents; exact sum of integer fee fields, no rounding."

  - name: recipient_selection_calculation
    trigger: "Lead RECEIVED -> ALLOCATED (POST /franchise/leads/{id}/allocate) when the request does not pin allocated_agreement_id"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter — the candidate set is an explicit predicate
      candidate_set = { a in FranchiseAgreement
          where a.brand_id == lead.brand_id
            and a.lifecycle_status == ACTIVE
            and Franchisee[a.franchisee_id].status == ACTIVE
            and Franchisee[a.franchisee_id].shared_services_enrolled == true
            and not exists L2 in Lead where
                  L2.allocated_agreement_id == a.id
                  and L2.status == ALLOCATED
                  and L2.allocation_hold_until_iso > logical_clock }

      # (b) ranking expression — least-loaded first, over entity fields only
      ranking_key(a) = count( L3 in Lead where
                              L3.allocated_agreement_id == a.id
                              and L3.status == ALLOCATED )
                       # ascending; lower count wins

      # (c) tie-break — no random field participates
      tie_break(a) = a.created_at     # ascending; the earlier agreement wins

      # (d) empty-pool fallback
      if candidate_set is empty: reject with ERR_LEAD_POOL_EMPTY (409)

      selected = argmin over ranking_key, then argmin over tie_break
    input_set: "The Lead row being allocated plus every FranchiseAgreement row in the system, filtered by the explicit predicate above. The lead's own brand_id, its Franchisee enrollment flag, and live allocation holds decide membership."
    constants: {}
    precision: "Integer ranking key; no rounding."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and name a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc, which still requires an authenticated FranchiseAdmin"

  - priority: 2
    category: auth
    check: "The authenticated role is listed in the endpoint's roles list, and for entity_backed roles the acting identity either owns the resource the operation acts on or is a party to it"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    note: "ERR_NOT_RECEIVING_FRANCHISEE, ERR_NOT_PERFORMING_FRANCHISEE and ERR_NOT_REFERRAL_PARTY (all 403) share this ownership row and are selected before any priority-3 or higher check runs."

  - priority: 3
    category: business_constraint
    check: "Required body fields are present, every supplied enum member is declared, no body field outside the endpoint's input list is supplied, and conditionally-required fields are present on the transition that requires them"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"
    note: "ERR_AUDITOR_REQUIRED and ERR_APPROVER_REQUIRED (both 400) share this row for fields that are required only on a specific transition."

  - priority: 4
    category: business_safety
    check: "Segregation of duties: the operator performing the second step of a two-step control differs from the operator who performed the first (reviewer vs approver on a TransferApplication; remediation owner vs verification operator)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /franchise/transfer-applications/{id}/approve", "POST /franchise/brand-standards-audits/{id}/remediation-transitions"]

  - priority: 5
    category: existence
    check: "Every referenced resource exists, checked left-to-right along the path and then in the order the endpoint's input list declares body foreign keys"
    error_id: ERR_BRAND_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path or input names a foreign key"
    note: "ERR_FRANCHISEE_NOT_FOUND, ERR_TERRITORY_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_LEAD_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND and ERR_VERIFICATION_AUDIT_NOT_FOUND share this priority row and are selected by whichever reference fails first."

  - priority: 6
    category: state
    check: "The target resource is in a state from which the requested transition is declared, has not reached a terminal state, and — where a concurrency rule guards the write — its stored version equals the supplied expected version"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: "ERR_ALREADY_TERMINAL and ERR_REFERRAL_DISPUTED (both 409) share this row. ERR_STALE_VERSION (412) is raised by the same priority-6 check when a concurrency_rules entry's expected version does not match the stored version."

  - priority: 7
    category: business_safety
    check: "Trade-qualification checks: the performing agreement's certification_level is at least the brand's min_certification_level; the performing brand is a member of the program's contracted_brands; the receiving franchisee has shared_services_enrolled true"
    error_id: ERR_CERTIFICATION_TOO_LOW
    http_status: 422
    applies_to: ["POST /franchise/work-orders/{id}/dispatch", "POST /franchise/leads/{id}/allocate"]
    note: "ERR_ACCOUNT_BRAND_NOT_CONTRACTED and ERR_SHARED_SERVICES_REQUIRED (both 422) share this priority row and are selected before any priority-8 or higher check runs."

  - priority: 8
    category: business_referential
    check: "Cross-entity linkage prerequisites hold: an agreement exists for the territory being awarded, the territory is AWARDED before its agreement activates, the agreement has no open remediation, the agreement is not standards-defaulted, the national account is ACTIVE, and the re-verification audit passes"
    error_id: ERR_AGREEMENT_REQUIRED_FOR_AWARD
    http_status: 409
    applies_to: ["POST /franchise/territories/{id}/award", "POST /franchise/agreements/{id}/activate", "POST /franchise/agreements/{id}/activate-renewal", "POST /franchise/transfer-applications/{id}/approve", "POST /franchise/work-orders/{id}/dispatch", "POST /franchise/brand-standards-audits/{id}/remediation-transitions"]
    note: "ERR_AGREEMENT_TERRITORY_NOT_AWARDED, ERR_OPEN_REMEDIATION, ERR_STANDARDS_DEFAULTED, ERR_ACCOUNT_SUSPENDED and ERR_REMEDIATION_FAILED (all 409) share this priority row."
    note_422: "ERR_REMEDIATION_FAILED is 422, not 409 — it reports that the re-verification audit scored below PASS_MIN."

  - priority: 9
    category: business_constraint
    check: "Uniqueness, set and threshold constraints: brand_code, territory_code, agreement_number and referral_code are franchisor-unique; a postal code belongs to at most one non-reclaimed territory per brand; one agreement per territory; a lead's brand matches the receiving agreement's brand; the candidate pool for lead allocation is non-empty; the expansion household threshold is met; the target territory set is valid"
    error_id: ERR_TERRITORY_POSTAL_OVERLAP
    http_status: 409
    applies_to: ["POST /franchise/brands", "POST /franchise/territories", "POST /franchise/territories/{id}/offer", "POST /franchise/territories/{id}/award", "POST /franchise/territories/{id}/request-expansion", "POST /franchise/territories/{id}/reallocate", "POST /franchise/agreements", "POST /franchise/agreements/{id}/activate", "POST /franchise/referrals", "POST /franchise/leads/{id}/allocate", "POST /franchise/transfer-applications"]
    note: "ERR_DUPLICATE_BRAND_CODE, ERR_DUPLICATE_TERRITORY_CODE, ERR_DUPLICATE_AGREEMENT_NUMBER, ERR_DUPLICATE_REFERRAL_CODE, ERR_TERRITORY_ALREADY_AGREED, ERR_LEAD_BRAND_MISMATCH, ERR_TARGET_TERRITORY_INVALID, ERR_TRANSFER_ALREADY_PENDING, ERR_EXPANSION_THRESHOLD_NOT_MET and ERR_LEAD_POOL_EMPTY (all 409) share this priority row."

  - priority: 10
    category: business_temporal
    check: "Logical-clock windows are respected: SLA windows against the program, the 90-day renewal window, the audit cycle window, the remediation window, the allocation hold window, the referral expiry window, the audit reopen window, and the two boundary-crossing triggers (SLA breach, agreement expiry, remediation overdue)"
    error_id: ERR_SLA_WINDOW_EXCEEDS_PROGRAM
    http_status: 422
    applies_to: ["POST /franchise/work-orders/{id}/dispatch", "POST /franchise/work-orders/{id}/breach", "POST /franchise/agreements/{id}/renew", "POST /franchise/agreements/{id}/expire", "POST /franchise/brand-standards-audits/{id}/publish", "POST /franchise/brand-standards-audits/{id}/remediation-transitions", "POST /franchise/brand-standards-audits/{id}/reopen", "POST /franchise/leads/{id}/release", "POST /franchise/referrals/{id}/accept", "POST /franchise/royalty-statements"]
    note: "ERR_RENEWAL_WINDOW_CLOSED, ERR_AUDIT_CYCLE_EXCEEDED, ERR_REMEDIATION_WINDOW_CLOSED, ERR_HOLD_WINDOW_ACTIVE, ERR_REFERRAL_EXPIRED, ERR_REOPEN_WINDOW_CLOSED and ERR_REMEDIATION_NOT_OVERDUE share this row at 409. ERR_AGREEMENT_NOT_EXPIRABLE and ERR_SLA_NOT_BREACHED share it at 422. ERR_INVALID_PERIOD shares it at 400."

  - priority: 11
    category: business_fiscal
    check: "Capacity and commitment checks, run last: the franchisee's cumulative protected household_count stays within the franchisor cap, and a statement period does not overlap an existing non-voided statement for the same agreement"
    error_id: ERR_HOUSEHOLD_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /franchise/territories/{id}/award", "POST /franchise/royalty-statements"]
    note: "ERR_STATEMENT_PERIOD_OVERLAP (422) shares this priority row."# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Brand ---------------------------------------------------------------
  - method: POST
    path: "/franchise/brands"
    description: "Create a Brand in the portfolio"
    roles: [FranchiseAdmin]
    code: 201
    input: [brand_code, display_name, trade, royalty_rate, national_ad_fund_rate, min_certification_level, audit_cycle_months, "cross_brand_fee_table?"]
    output: Brand
    side_effects: ["status := ACTIVE"]
  - method: GET
    path: "/franchise/brands/{id}"
    description: "Read one Brand"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: GET
    path: "/franchise/brands"
    description: "List Brands, optionally filtered"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["trade?", "brand_code?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []

  # --- Franchisee ----------------------------------------------------------
  - method: POST
    path: "/franchise/franchisees"
    description: "Create a Franchisee"
    roles: [FranchiseAdmin]
    code: 201
    input: [legal_name, principal_name, entity_type, "shared_services_enrolled?"]
    output: Franchisee
    side_effects: ["status := PROSPECT", "active_brand_count := 0", "active_agreement_count := 0", "allocated_households := 0", "lead_cost_balance_cents := 0"]
  - method: GET
    path: "/franchise/franchisees/{id}"
    description: "Read one Franchisee"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: Franchisee
    side_effects: []
  - method: GET
    path: "/franchise/franchisees"
    description: "List Franchisees, optionally filtered"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["status?", "shared_services_enrolled?", "limit?", "offset?"]
    output: Franchisee[]
    side_effects: []
  - method: POST
    path: "/franchise/franchisees/{id}/suspend"
    description: "Suspend a Franchisee and stand down its territories"
    roles: [FranchiseAdmin]
    code: 200
    input: [reason]
    output: Franchisee
    side_effects:
      - "status := SUSPENDED"
      - "Every Territory row held by this franchisee in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED} moves to PENDING_REALLOCATION; each retains its franchisee_id and allocated_households until a reclaim fires"

  # --- Territory -----------------------------------------------------------
  - method: POST
    path: "/franchise/territories"
    description: "Define a Territory with its protected area and expansion threshold"
    roles: [FranchiseAdmin]
    code: 201
    input: [territory_code, brand_id, household_count, postal_codes, expansion_right_households, "protected?", "franchisee_id?", "parent_territory_id?"]
    output: Territory
    side_effects: ["status := DEFINED", "allocated_households := 0"]
  - method: GET
    path: "/franchise/territories/{id}"
    description: "Read one Territory"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: Territory
    side_effects: []
  - method: GET
    path: "/franchise/territories"
    description: "List Territories with reverse-reachability filters for brand, holder and reallocation lineage"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: ["brand_id?", "franchisee_id?", "parent_territory_id?", "source_of_reallocation_id?", "status?", "postal_code?", "limit?", "offset?"]
    output: Territory[]
    side_effects: []
  - method: POST
    path: "/franchise/territories/{id}/offer"
    description: "Offer a defined Territory to a franchisee"
    roles: [FranchiseAdmin]
    code: 200
    input: [franchisee_id]
    output: Territory
    side_effects: ["status := OFFERED", "franchisee_id := the supplied franchisee_id"]
  - method: POST
    path: "/franchise/territories/{id}/award"
    description: "Award an offered Territory, consuming households against the franchisee cap"
    roles: [FranchiseAdmin]
    code: 200
    input: [expected_territory_version]
    output: Territory
    side_effects:
      - "status := AWARDED"
      - "allocated_households := household_count"
      - "franchisee.allocated_households += this territory's household_count"
      - "increments Territory.version by 1"
  - method: POST
    path: "/franchise/territories/{id}/request-expansion"
    description: "Request expansion rights once the household threshold is met"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: Territory
    side_effects: ["status := EXPANSION_REQUESTED"]
  - method: POST
    path: "/franchise/territories/{id}/withdraw-expansion"
    description: "Withdraw a pending expansion request"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: Territory
    side_effects: ["status := ACTIVE"]
  - method: POST
    path: "/franchise/territories/{id}/reallocate"
    description: "Carve an oversized protected area into the placeholder territories named by target_territory_ids"
    roles: [FranchiseAdmin]
    code: 201
    input: [target_territory_ids]
    output: { reallocated_territory_ids: "string[]" }
    side_effects:
      - "Each target Territory row has its postal_codes filled from this territory's postal_codes in ascending territory_code order, and its parent_territory_id and source_of_reallocation_id both set to this territory's id"
      - "This territory.postal_codes := [] and status := PENDING_REALLOCATION"
  - method: POST
    path: "/franchise/territories/{id}/reclaim"
    description: "Reclaim a territory being reallocated, cascading to its carved children"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: Territory
    side_effects:
      - "status := RECLAIMED, franchisee_id := null, allocated_households := 0"
      - "franchisee.allocated_households -= this territory's household_count"
      - "Every child Territory row with parent_territory_id or source_of_reallocation_id equal to this id moves to RECLAIMED with allocated_households := 0 and franchisee_id := null"

  # --- FranchiseAgreement --------------------------------------------------
  - method: POST
    path: "/franchise/agreements"
    description: "Create a FranchiseAgreement"
    roles: [FranchiseAdmin]
    code: 201
    input: [agreement_number, franchisee_id, brand_id, territory_id, signed_on, initial_term_months, certification_level, "royalty_rate_override?"]
    output: FranchiseAgreement
    side_effects: ["lifecycle_status := DRAFT", "standards_status := COMPLIANT", "cumulative_royalty_cents := 0", "cumulative_referral_net_cents := 0", "open_remediation_count := 0", "audit_due_iso := null", "expires_on := signed_on advanced by initial_term_months months"]
  - method: GET
    path: "/franchise/agreements/{id}"
    description: "Read one FranchiseAgreement"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: []
  - method: GET
    path: "/franchise/agreements"
    description: "List FranchiseAgreements, the multi-brand ownership surface"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: ["brand_id?", "franchisee_id?", "territory_id?", "lifecycle_status?", "standards_status?", "limit?", "offset?"]
    output: FranchiseAgreement[]
    side_effects: []
  - method: POST
    path: "/franchise/agreements/{id}/offer"
    description: "Offer a draft agreement"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["lifecycle_status := OFFERED"]
  - method: POST
    path: "/franchise/agreements/{id}/activate"
    description: "Activate an offered agreement, which activates its territory and opens its first term"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects:
      - "lifecycle_status := ACTIVE"
      - "Territory (AWARDED) moves to ACTIVE"
      - "franchisee.status := ACTIVE when PROSPECT"
      - "franchisee.active_agreement_count recomputed"
  - method: POST
    path: "/franchise/agreements/{id}/renew"
    description: "Open a renewal inside the 90-day window"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["lifecycle_status := RENEWAL_PENDING", "renewal_clock_iso := logical clock"]
  - method: POST
    path: "/franchise/agreements/{id}/activate-renewal"
    description: "Activate a pending renewal after remediation is clear"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["lifecycle_status := ACTIVE", "renewal_clock_iso := null", "franchisee.active_agreement_count recomputed"]
  - method: POST
    path: "/franchise/agreements/{id}/suspend"
    description: "Suspend an active agreement and stand its territory down"
    roles: [FranchiseAdmin]
    code: 200
    input: ["reason?"]
    output: FranchiseAgreement
    side_effects:
      - "lifecycle_status := SUSPENDED"
      - "Territory moves from AWARDED or ACTIVE to PENDING_REALLOCATION"
      - "franchisee.active_agreement_count recomputed"
  - method: POST
    path: "/franchise/agreements/{id}/reinstate"
    description: "Reinstate a suspended agreement"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["lifecycle_status := ACTIVE", "Territory moves back to ACTIVE", "franchisee.active_agreement_count recomputed"]
  - method: POST
    path: "/franchise/agreements/{id}/expire"
    description: "Cross the agreement's term end on the logical clock, cascading to territory and franchisee"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects:
      - "lifecycle_status := EXPIRED"
      - "franchisee.active_agreement_count recomputed; franchisee.status := TERMINATED when it reaches 0"
      - "Territory franchisee_id := null, status := PENDING_REALLOCATION, allocated_households := 0"

  # --- TransferApplication -------------------------------------------------
  - method: POST
    path: "/franchise/transfer-applications"
    description: "Submit a resale, transfer or territory-reallocation application"
    roles: [FranchiseeOperator]
    code: 201
    input: [agreement_id, territory_id, applicant_franchisee_id, transfer_kind, purchase_price_cents, "target_territory_ids?"]
    output: TransferApplication
    side_effects:
      - "status := SUBMITTED"
      - "Agreement (ACTIVE) moves to TRANSFER_PENDING"
  - method: GET
    path: "/franchise/transfer-applications/{id}"
    description: "Read one TransferApplication"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: TransferApplication
    side_effects: []
  - method: GET
    path: "/franchise/transfer-applications"
    description: "List TransferApplications, optionally filtered"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "applicant_franchisee_id?", "territory_id?", "status?", "limit?", "offset?"]
    output: TransferApplication[]
    side_effects: []
  - method: POST
    path: "/franchise/transfer-applications/{id}/begin-review"
    description: "Open review by a franchisor operator"
    roles: [FranchiseAdmin]
    code: 200
    input: [reviewer_operator_id]
    output: TransferApplication
    side_effects: ["status := UNDER_REVIEW", "reviewer_operator_id := the supplied operator"]
  - method: POST
    path: "/franchise/transfer-applications/{id}/request-revision"
    description: "Send the application back to the applicant for revision"
    roles: [FranchiseAdmin]
    code: 200
    input: [reason]
    output: TransferApplication
    side_effects: ["status := REVISION_REQUESTED", "reason recorded"]
  - method: POST
    path: "/franchise/transfer-applications/{id}/revise"
    description: "Resubmit a revised application, returning it to review"
    roles: [FranchiseeOperator]
    code: 200
    input: [purchase_price_cents]
    output: TransferApplication
    side_effects: ["status := UNDER_REVIEW", "purchase_price_cents updated"]
  - method: POST
    path: "/franchise/transfer-applications/{id}/approve"
    description: "Record franchisor approval by a second operator"
    roles: [FranchiseAdmin]
    code: 200
    input: [approval_operator_id]
    output: TransferApplication
    side_effects: ["status := APPROVED", "approval_operator_id := the supplied operator", "transfer_fee_cents := transfer_fee_calculation output"]
  - method: POST
    path: "/franchise/transfer-applications/{id}/reject"
    description: "Reject an application under review"
    roles: [FranchiseAdmin]
    code: 200
    input: [reason]
    output: TransferApplication
    side_effects: ["status := REJECTED", "Agreement (TRANSFER_PENDING) reverts to ACTIVE"]
  - method: POST
    path: "/franchise/transfer-applications/{id}/close"
    description: "Settle an approved disposition, moving territory and assignment"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "status := CLOSED"
      - "Territory.franchisee_id := applicant_franchisee_id"
      - "Agreement (TRANSFER_PENDING) moves to TERMINATED"
      - "Every live TerritoryAssignment row on the territory has released_on stamped and active := false"
      - "A new TerritoryAssignment row synthesized for the applicant with assignment_kind := transfer_kind and released_on null"
      - "When transfer_kind is TERRITORY_REALLOCATION, each id in target_territory_ids has franchisee_id := applicant_franchisee_id and status := AWARDED"
      - "franchisee.active_agreement_count recomputed for both franchisees"
  - method: POST
    path: "/franchise/transfer-applications/{id}/withdraw"
    description: "Withdraw a submitted application, reverting the agreement"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: TransferApplication
    side_effects: ["status := CLOSED", "Agreement reverts to ACTIVE when it was TRANSFER_PENDING or RENEWAL_PENDING"]

  # --- Referral ------------------------------------------------------------
  - method: POST
    path: "/franchise/referrals"
    description: "Surface cross-brand work from one agreement to a sister brand's agreement"
    roles: [FranchiseeOperator]
    code: 201
    input: [referral_code, originating_agreement_id, receiving_agreement_id, customer_household_ref, job_description, estimated_job_value_cents, referral_fee_rate]
    output: Referral
    side_effects: ["status := PENDING", "expires_clock_iso := created_at advanced by REFERRAL_EXPIRY_HOURS", "referral_fee_cents := 0"]
  - method: GET
    path: "/franchise/referrals/{id}"
    description: "Read one Referral"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/franchise/referrals"
    description: "List Referrals, the cross-brand attribution ledger"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: ["originating_agreement_id?", "receiving_agreement_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/franchise/referrals/{id}/accept"
    description: "Accept a pending referral inside its expiry window"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status := ACCEPTED", "accepted_clock_iso := logical clock"]
  - method: POST
    path: "/franchise/referrals/{id}/decline"
    description: "Decline a pending referral"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status := DECLINED"]
  - method: POST
    path: "/franchise/referrals/{id}/complete"
    description: "Record the actual job value and spin off the performing work order"
    roles: [FranchiseeOperator]
    code: 200
    input: [settled_job_value_cents]
    output: Referral
    side_effects:
      - "status := COMPLETED"
      - "settled_job_value_cents recorded"
      - "A WorkOrder row synthesized with source CROSS_BRAND_REFERRAL, agreement_id := receiving_agreement_id, referral_id bound, status CREATED"
  - method: POST
    path: "/franchise/referrals/{id}/dispute"
    description: "Dispute a completed referral"
    roles: [FranchiseeOperator]
    code: 200
    input: [dispute_reason]
    output: Referral
    side_effects: ["status := DISPUTED", "dispute_reason recorded"]
  - method: POST
    path: "/franchise/referrals/{id}/resolve-dispute"
    description: "Clear a dispute so the referral can be settled"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["status := COMPLETED", "dispute_reason := null"]
  - method: POST
    path: "/franchise/referrals/{id}/settle"
    description: "Settle the referral fee and post it to both agreements"
    roles: [FranchiseAdmin]
    code: 200
    input: [expected_agreement_version]
    output: Referral
    side_effects:
      - "status := SETTLED"
      - "referral_fee_cents := referral_fee_calculation output; fee_variant recorded"
      - "settled_clock_iso := logical clock"
      - "originating agreement.cumulative_referral_net_cents += referral_fee_cents"
      - "receiving agreement.cumulative_referral_net_cents -= referral_fee_cents"

  # --- Lead ----------------------------------------------------------------
  - method: POST
    path: "/franchise/leads"
    description: "Receive a shared-call-center lead into the pool"
    roles: [FranchiseAdmin]
    code: 201
    input: [brand_id, source, household_income_band, estimated_value_cents]
    output: Lead
    side_effects: ["status := RECEIVED", "received_clock_iso := logical clock", "lead_cost_cents := 0"]
  - method: GET
    path: "/franchise/leads/{id}"
    description: "Read one Lead"
    roles: [FranchiseAdmin, FranchiseeOperator]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: GET
    path: "/franchise/leads"
    description: "List Leads with the allocation filters used by the selector"
    roles: [FranchiseAdmin, FranchiseeOperator]
    code: 200
    input: ["brand_id?", "allocated_agreement_id?", "status?", "household_income_band?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []
  - method: GET
    path: "/franchise/leads/{id}/recipients"
    description: "Preview the ranked eligible recipients for a lead without allocating it"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: { selected_agreement_id: string, candidate_agreement_ids: "string[]", ranking_keys: "integer[]" }
    side_effects: []
  - method: POST
    path: "/franchise/leads/{id}/allocate"
    description: "Allocate a lead to a ranked recipient agreement and charge the lead cost"
    roles: [FranchiseAdmin]
    code: 200
    input: [expected_franchisee_version, "allocated_agreement_id?"]
    output: Lead
    side_effects:
      - "status := ALLOCATED"
      - "allocated_agreement_id := supplied id, or recipient_selection_calculation output when omitted"
      - "allocated_clock_iso := logical clock"
      - "allocation_hold_until_iso := logical clock + ALLOCATION_HOLD_HOURS"
      - "lead_cost_cents := lead_cost_calculation output"
      - "receiving franchisee.lead_cost_balance_cents += lead_cost_cents"
  - method: POST
    path: "/franchise/leads/{id}/release"
    description: "Release an allocation after the hold window and credit the cost back"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: Lead
    side_effects:
      - "status := RELEASED"
      - "released_clock_iso := logical clock"
      - "receiving franchisee.lead_cost_balance_cents -= lead_cost_cents"
      - "lead_cost_cents := 0"
  - method: POST
    path: "/franchise/leads/{id}/convert"
    description: "Convert an allocated lead into a performing work order"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: Lead
    side_effects:
      - "status := CONVERTED"
      - "A WorkOrder row synthesized with source CALL_CENTER_LEAD, agreement_id := allocated_agreement_id, lead_id bound, status CREATED"

  # --- NationalAccount -----------------------------------------------------
  - method: POST
    path: "/franchise/national-accounts"
