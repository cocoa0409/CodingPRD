            - call: "POST /re-underwriting/ic-memos/${memo_id}/vote"
              payload: { vote: "YES", comment: "ok2" }
              as: IC_Member
              as_user_id: "u-ic-2"
          assert:
            - "After 2nd YES vote, ICMemo.${memo_id}.status == APPROVED (auto cascade)"
            - "Deal.${deal_id}.status == APPROVED (3rd link in cascade)"
            - "Deal.${deal_id}.approved_at is not null"

      - name: no_vote_cascades_deal_rejected
        grounds:
          - state_machines.ICMemo.UNDER_VOTE_to_REJECTED
          - state_machines.Deal.IC_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Depth-2 cascade: a single NO vote -> ICMemo UNDER_VOTE -> REJECTED ->
          Deal IC_REVIEW -> REJECTED. Different triggering transition (NO vote
          vs YES quorum), so this captures a different propagation pattern than
          the quorum cascade above.
        test_recipe:
