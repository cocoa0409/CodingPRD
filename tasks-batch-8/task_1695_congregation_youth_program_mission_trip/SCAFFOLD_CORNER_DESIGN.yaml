# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every §1.1–§1.7 claim not
# already exercised by §1.8. claim_type values come from the claim-extraction
# guide's per-section tables. Stubs mark claims already covered by named §1.8
# instances.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: program_create_applies_policy_defaults
        claim_type: defaults
        grounds:
          - "entities.Program.fields.max_award_pct_bp"
          - "entities.Program.fields.per_registration_cap_cents"
          - "entities.Program.fields.default_chaperone_ratio"
        distinguishing_aspect: "Omitting the three optional policy fields yields 5000 bp / 150000 cents / ratio 5; fund triple initializes to reserved 0, disbursed 0, available == total."
        test_recipe:
          setup: ["empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 250000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id, bp: $.data.max_award_pct_bp, cap: $.data.per_registration_cap_cents, ratio: $.data.default_chaperone_ratio, res: $.data.scholarship_reserved_cents, dis: $.data.scholarship_disbursed_cents, av: $.data.scholarship_available_cents} }
          assert:
            - "bp == 5000 and cap == 150000 and ratio == 5 (documented defaults)"
            - "res == 0 and dis == 0 and av == 250000"

      - name: participant_grade_and_bounds_enforced
        claim_type: type_constraints
        grounds:
          - "entities.Participant.fields.grade"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "grade is constrained to 6..12; 5 and 13 are rejected while 6 and 12 are accepted."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "A", last_name: "B", birth_date: "2012-01-01", grade: 5, annual_income_bracket: "BAND_B", household_size: 3}, as: ProgramDirector, captures: {err5: $.data.error_id} }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "A", last_name: "B", birth_date: "2012-01-01", grade: 13, annual_income_bracket: "BAND_B", household_size: 3}, as: ProgramDirector, captures: {err13: $.data.error_id} }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "A", last_name: "B", birth_date: "2012-01-01", grade: 6, annual_income_bracket: "BAND_B", household_size: 3}, as: ProgramDirector, captures: {p6: $.data.id} }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "A", last_name: "C", birth_date: "2012-01-01", grade: 12, annual_income_bracket: "BAND_B", household_size: 3}, as: ProgramDirector, captures: {p12: $.data.id} }
          assert:
            - "err5 == ERR_INVALID_REQUEST and err13 == ERR_INVALID_REQUEST (400)"
            - "p6 and p12 created (201) at the inclusive bounds"

      - name: not_found_for_every_resource_kind
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_TRIP_NOT_FOUND]"
          - "errors[ERR_REGISTRATION_NOT_FOUND]"
          - "errors[ERR_PROGRAM_NOT_FOUND]"
          - "errors[ERR_CONSENT_FORM_NOT_FOUND]"
          - "errors[ERR_PAYMENT_NOT_FOUND]"
          - "errors[ERR_DONATION_NOT_FOUND]"
          - "errors[ERR_CHAPERONE_NOT_FOUND]"
          - "errors[ERR_BACKGROUND_CHECK_NOT_FOUND]"
          - "errors[ERR_SCHOLARSHIP_APPLICATION_NOT_FOUND]"
          - "errors[ERR_CHAPERONE_ASSIGNMENT_NOT_FOUND]"
          - "errors[ERR_LODGING_RESERVATION_NOT_FOUND]"
          - "errors[ERR_PARTICIPANT_NOT_FOUND]"
          - "errors[ERR_FUNDRAISING_ACCOUNT_NOT_FOUND]"
        distinguishing_aspect: "Each of the 14 resource kinds returns its own typed 404 error_id; probed with a well-formed but nonexistent UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /youth-ministry/programs/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_program: $.data.error_id} }
            - { call: "GET /youth-ministry/trips/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_trip: $.data.error_id} }
            - { call: "GET /youth-ministry/participants/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_participant: $.data.error_id} }
            - { call: "GET /youth-ministry/registrations/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_registration: $.data.error_id} }
            - { call: "POST /youth-ministry/consent-forms/11111111-1111-4111-8111-111111111111/review", payload: {decision: "VERIFY"}, as: ProgramDirector, captures: {e_consent: $.data.error_id} }
            - { call: "POST /youth-ministry/payments/11111111-1111-4111-8111-111111111111/refund", payload: {}, as: Treasurer, captures: {e_payment: $.data.error_id} }
            - { call: "POST /youth-ministry/donations/11111111-1111-4111-8111-111111111111/refund", payload: {}, as: Treasurer, captures: {e_donation: $.data.error_id} }
            - { call: "GET /youth-ministry/chaperones/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_chaperone: $.data.error_id} }
            - { call: "POST /youth-ministry/background-checks/11111111-1111-4111-8111-111111111111/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector, captures: {e_check: $.data.error_id} }
            - { call: "GET /youth-ministry/scholarship-applications/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_application: $.data.error_id} }
            - { call: "GET /youth-ministry/chaperone-assignments/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {e_assignment: $.data.error_id} }
            - { call: "POST /youth-ministry/lodging-reservations/11111111-1111-4111-8111-111111111111/cancel", payload: {}, as: TripLeader, captures: {e_lodging: $.data.error_id} }
            - { call: "GET /youth-ministry/fundraising-accounts/11111111-1111-4111-8111-111111111111", as: Treasurer, captures: {e_account: $.data.error_id} }
          assert:
            - "e_program == ERR_PROGRAM_NOT_FOUND; e_trip == ERR_TRIP_NOT_FOUND; e_participant == ERR_PARTICIPANT_NOT_FOUND; e_registration == ERR_REGISTRATION_NOT_FOUND"
            - "e_consent == ERR_CONSENT_FORM_NOT_FOUND; e_payment == ERR_PAYMENT_NOT_FOUND; e_donation == ERR_DONATION_NOT_FOUND"
            - "e_chaperone == ERR_CHAPERONE_NOT_FOUND; e_check == ERR_BACKGROUND_CHECK_NOT_FOUND; e_application == ERR_SCHOLARSHIP_APPLICATION_NOT_FOUND"
            - "e_assignment == ERR_CHAPERONE_ASSIGNMENT_NOT_FOUND; e_lodging == ERR_LODGING_RESERVATION_NOT_FOUND; e_account == ERR_FUNDRAISING_ACCOUNT_NOT_FOUND"
            - "all responses http 404 with the standard error envelope"

      - name: server_minted_system_fields_on_create
        claim_type: system_fields
        grounds:
          - "entities.Program"
        distinguishing_aspect: "Create responses carry server-minted id (typeless UUID), created_at/updated_at with three fractional digits, version == 1; client cannot set them (extra body fields are rejected)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 1000, code_of_conduct_text: "CoC", discipline_policy_text: "DP", version: 99}, as: ProgramDirector, captures: {bad: $.data.error_id} }
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 1000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {id: $.data.id, v: $.data.version, ca: $.data.created_at, ua: $.data.updated_at} }
          assert:
            - "bad == ERR_INVALID_REQUEST (client-supplied version rejected as unknown field)"
            - "id matches the typeless UUID shape (no entity prefix); v == 1; ca == ua == 2026-08-01T00:00:00.000Z-style timestamp with three fractional digits taken from the logical clock"

      - name: trip_required_insurance_tier_derived_from_destination_type
        claim_type: computed_fields
        grounds:
          - "entities.Trip.fields.required_insurance_tier"
        distinguishing_aspect: "required_insurance_tier is computed, never accepted as input: IN_STATE -> NONE, OUT_OF_STATE -> DOMESTIC, INTERNATIONAL -> INTERNATIONAL."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T-in", destination_name: "Local", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {tier_in: $.data.required_insurance_tier} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T-out", destination_name: "Dallas", destination_type: "OUT_OF_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {tier_out: $.data.required_insurance_tier} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T-intl", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {tier_intl: $.data.required_insurance_tier} }
          assert:
            - "tier_in == NONE and tier_out == DOMESTIC and tier_intl == INTERNATIONAL"

      - name: fundraising_account_auto_created_one_to_one
        claim_type: parent_relationships
        grounds:
          - "entities.FundraisingAccount.fields.registration_id"
          - "endpoints.POST_/youth-ministry/registrations"
        distinguishing_aspect: "Creating a registration auto-creates exactly one FundraisingAccount (OPEN, goal copied from fundraising_goal_cents, all rollups 0); the sub-resource GET returns an array of length 1."
        test_recipe:
          setup: ["Trip Alpha REGISTRATION_OPEN"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "DOMESTIC", fundraising_goal_cents: 7500}, as: Guardian, as_user_id: "guardian-1", captures: {reg: $.data.id} }
          trigger:
            - { call: "GET /youth-ministry/registrations/${reg}/fundraising-account", as: Treasurer, captures: {acct_status: "$.data[0].status", acct_goal: "$.data[0].goal_cents", acct_gross: "$.data[0].raised_gross_cents", acct_avail: "$.data[0].available_credit_cents", acct_goal_met: "$.data[0].goal_met"} }
          assert:
            - "array length == 1; acct_status == OPEN; acct_goal == 7500"
            - "acct_gross == 0 and acct_avail == 0 and acct_goal_met == false"

      - name: list_pagination_limit_offset_has_more
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "limit/offset/has_more/total_count behave per the fixed envelope: default limit 10; limit=2 pages a 3-trip list into 2+1 with correct has_more flags."
        test_recipe:
          setup: ["program with 3 trips"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T1", destination_name: "A", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T2", destination_name: "B", destination_type: "IN_STATE", start_date: "2027-06-17", end_date: "2027-06-18", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T3", destination_name: "C", destination_type: "IN_STATE", start_date: "2027-06-19", end_date: "2027-06-20", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector }
          trigger:
            - { call: "GET /youth-ministry/trips?limit=2&offset=0", as: ProgramDirector }
            - { call: "GET /youth-ministry/trips?limit=2&offset=2", as: ProgramDirector }
          assert:
            - "page 1: data length 2, total_count == 3, has_more == true"
            - "page 2: data length 1, total_count == 3, has_more == false"
            - "omitting limit/offset uses defaults limit=10 offset=0 (all 3 returned, has_more false)"

      - name: duplicate_registration_blocked_until_terminal_then_allowed
        claim_type: type_constraints
        grounds:
          - "errors[ERR_DUPLICATE_REGISTRATION]"
          - "entities.Registration.fields.registration_status"
        distinguishing_aspect: "One non-terminal registration per (trip, participant): a second create while DRAFT fails; after withdrawal (terminal) a fresh registration succeeds."
        test_recipe:
          setup: ["Trip Alpha REGISTRATION_OPEN; participant p1; reg1 DRAFT"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "DOMESTIC", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {dup_err: $.data.error_id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/withdraw", payload: {}, as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "DOMESTIC", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg2: $.data.id} }
          assert:
            - "dup_err == ERR_DUPLICATE_REGISTRATION (409)"
            - "reg2 created (201) after the first reached terminal WITHDRAWN"

  - section: state_machines
    instances:
      - name: trip_initial_state_and_invalid_from_transitions
        claim_type: invalid_transition
        grounds:
          - state_machines.Trip
          - errors[ERR_TRIP_STATE_FORBIDS_ACTION]
        distinguishing_aspect: "A new trip starts in DRAFT; start/lock-roster/close-registration/debrief from DRAFT are each rejected, and only open-registration is legal."
        test_recipe:
          setup: ["program; trip in DRAFT"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T", destination_name: "A", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {trip: $.data.id, st: $.data.status} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip}/start", as: ProgramDirector, captures: {e_start: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/lock-roster", as: ProgramDirector, captures: {e_lock: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/close-registration", as: ProgramDirector, captures: {e_close: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/debrief", payload: {debrief_summary: "x", debrief_actual_participant_count: 0, debrief_incident_count: 0, debrief_lessons_learned: "x"}, as: ProgramDirector, captures: {e_debrief: $.data.error_id} }
          assert:
            - "st == DRAFT (initial state)"
            - "e_start == e_lock == e_close == e_debrief == ERR_TRIP_STATE_FORBIDS_ACTION (409)"

      - name: trip_terminal_states_locked
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Trip
        distinguishing_aspect: "CANCELLED (from DRAFT) is terminal: every further transition fails; the DRAFT cancel branch performs NO cascade (contrast with the difficulty instance trip_cancel_depth3_registration_scholarship_program)."
        test_recipe:
          setup: ["trip in DRAFT"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T", destination_name: "A", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {trip: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip}/cancel", payload: {reason: "scouting failed"}, as: ProgramDirector, captures: {st: $.data.status} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector, captures: {e1: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/cancel", payload: {}, as: ProgramDirector, captures: {e2: $.data.error_id} }
          assert:
            - "st == CANCELLED"
            - "e1 == ERR_TRIP_STATE_FORBIDS_ACTION and e2 == ERR_TRIP_STATE_FORBIDS_ACTION (terminal lockdown; cancel is NOT idempotent)"
            - "Program.${prog}.scholarship_available_cents == 0-fund unchanged and no registration cascade ran (DRAFT branch has empty side effects)"

      - name: registration_double_submit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Registration.DRAFT_to_SUBMITTED
          - errors[ERR_REGISTRATION_STATE_FORBIDS_ACTION]
