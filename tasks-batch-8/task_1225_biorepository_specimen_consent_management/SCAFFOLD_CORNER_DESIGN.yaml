        claim_type: computed_read
        grounds:
          - "endpoints[POST /biobank/sweeps/process-due]"
        distinguishing_aspect: "The sweep response reports per-category counts: one due withdrawal plus one expired kit yields withdrawals_finalized == 1 and kits_expired == 1."
        test_recipe:
          setup: ["consent withdrawn at default clock; kit with expires_at 2026-05-02; clock at 2026-05-04T00:00:00Z (both due)"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-EP5" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
