scaffold_corner_design:

  # =========================================================================
  # SECTION 1 -- From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: athlete_creation_returns_all_declared_fields_with_system_defaults
        claim_type: Creation
        claim: "POST /athletes with all required fields returns 201 and every declared Athlete field, with membership_status PENDING_INTAKE, training_clearance SCREEN_PENDING, screen_count 0, readiness_index 50.00, age_years derived from date_of_birth, and version 1"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
          action:
            - call: "POST /athletes"
              payload: { full_name: "Iris Nakamura", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "guardian.nakamura@example.com" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
          assertions:
            - "status 201"
            - "$.data.full_name == 'Iris Nakamura'"
            - "$.data.sport == 'BASKETBALL' and $.data.position == 'GUARD'"
            - "$.data.membership_status == 'PENDING_INTAKE'"
            - "$.data.training_clearance == 'SCREEN_PENDING'"
            - "$.data.screen_count == 0"
            - "$.data.injury_risk_score == null"
            - "$.data.readiness_index == 50.00"
            - "$.data.age_years == 16"
            - "$.data.attended_count == 0 and $.data.no_show_count == 0 and $.data.no_show_strikes == 0"
            - "$.data.team_contract_id == null and $.data.next_test_due_on == null"
            - "$.data.version == 1"
            - "$.data.id is a UUID and $.data.created_at is present"

      - name: athlete_retrieval_returns_stored_entity
        claim_type: Retrieval
        claim: "GET /athletes/{athlete_id} returns the stored Athlete unchanged"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "Dana Whitfield", date_of_birth: "2009-03-02", sport: "SOCCER", position: "MIDFIELDER" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
          action:
            - call: "GET /athletes/${athlete_id}"
              as: Coach
          assertions:
            - "status 200"
            - "$.data.id == '${athlete_id}'"
            - "$.data.full_name == 'Dana Whitfield'"
            - "$.data.sport == 'SOCCER'"
            - "$.data.guardian_email == null"
            - "$.data.version == 1"

      - name: athlete_listing_filters_by_sport_and_paginates
        claim_type: Listing
        claim: "GET /athletes with sport filter plus limit/offset returns only matching rows and reports total_count over the filtered set with has_more true when more remain"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "Hoop One", date_of_birth: "2009-05-05", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
            - call: "POST /athletes"
              payload: { full_name: "Hoop Two", date_of_birth: "2009-06-06", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
            - call: "POST /athletes"
              payload: { full_name: "Pitch One", date_of_birth: "2009-07-07", sport: "SOCCER", position: "MIDFIELDER" }
              as: FrontDesk
          action:
            - call: "GET /athletes?sport=BASKETBALL&limit=1&offset=0"
              as: PerformanceDirector
              captures: { first_id: "$.data[0].id" }
          assertions:
            - "status 200"
            - "$.data has exactly 1 element"
            - "$.data[0].sport == 'BASKETBALL'"
            - "$.meta or envelope reports total_count == 2, limit == 1, offset == 0, has_more == true"
            - "the SOCCER athlete is absent from $.data"

      - name: group_session_not_found_returns_group_session_not_found
        claim_type: Not Found
        claim: "GET /group-sessions/{group_session_id} for a syntactically valid but unknown UUID returns ERR_GROUP_SESSION_NOT_FOUND (404)"
        test_recipe:
          setup: []
          action:
            - call: "GET /group-sessions/6f1c1a52-0000-4000-8000-000000000abc"
              as: PerformanceDirector
              captures: { err: $.data.error_id }
          assertions:
            - "status 404"
            - "$.data.error_id == 'ERR_GROUP_SESSION_NOT_FOUND'"
            - "$.data.message is a non-empty string"

      - name: test_session_creation_missing_required_battery_type_returns_invalid_request
        claim_type: Required Fields
        claim: "POST /test-sessions without the required battery_type field returns ERR_INVALID_REQUEST (422) and creates nothing"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "Missing Field Athlete", date_of_birth: "2009-01-01", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
          action:
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}" }
              as: Coach
              captures: { err: $.data.error_id }
          assertions:
            - "status 422"
            - "$.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: enrollment_funding_preference_defaults_to_any
        claim_type: Defaults
        claim: "POST /enrollments omitting funding_preference stores the declared default ANY, and request_waitlist omitted behaves as false"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Default Funding Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 4, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
          action:
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_id: $.data.id }
          assertions:
            - "status 201"
            - "$.data.funding_preference == 'ANY'"
            - "$.data.status == 'RESERVED'"
            - "$.data.promoted_from_waitlist == false"
            - "$.data.funding_source == 'DROP_IN' and $.data.charge_cents == 4500"

      - name: athlete_computed_counters_input_ignored_on_create
        claim_type: Computed Fields
        claim: "Computed Athlete fields supplied in the create payload are ignored: age_years is derived from date_of_birth and readiness_index/screen_count/no_show_strikes take their computed or default values"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
          action:
            - call: "POST /athletes"
              payload: { full_name: "Injected Computed", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", age_years: 99, readiness_index: 100.00, screen_count: 7, no_show_strikes: 5, injury_risk_score: 0.00 }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
          assertions:
            - "status 201"
            - "$.data.age_years == 16 (floor of days since 2010-01-15 divided by 365.25), not 99"
            - "$.data.readiness_index == 50.00, not 100.00"
            - "$.data.screen_count == 0, not 7"
            - "$.data.no_show_strikes == 0, not 5"
            - "$.data.injury_risk_score == null (no screen finalized yet)"

      - name: test_session_system_fields_input_ignored_on_create
        claim_type: System Fields
        claim: "TestSession system fields are generated server-side: id/created_at/version are assigned and administered_by_staff_id is taken from the X-User-ID header, never from the payload"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "System Field Athlete", date_of_birth: "2009-04-04", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Coach Sysfield", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
          action:
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN", id: "11111111-1111-4111-8111-111111111111", administered_by_staff_id: "22222222-2222-4222-8222-222222222222", status: "FINALIZED", composite_percentile: 99.0 }
              as: Coach
              as_user_id: ${coach_id}
              captures: { test_session_id: $.data.id }
          assertions:
            - "status 201"
            - "$.data.id != '11111111-1111-4111-8111-111111111111'"
            - "$.data.administered_by_staff_id == '${coach_id}' (from X-User-ID), not the injected UUID"
            - "$.data.status == 'DRAFT', not FINALIZED"
            - "$.data.composite_percentile == null"
            - "$.data.result_count == 0 and $.data.version == 1"

      - name: group_session_invalid_enum_and_reversed_interval_rejected
        claim_type: Type Constraints
        claim: "GroupSession enum fields reject unknown values and the schema layer rejects an interval whose end_at is not strictly after start_at as well as out-of-range station_count"
        test_recipe:
          setup: []
          action:
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ROOFTOP", station_count: 4, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { err_enum: $.data.error_id }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T17:00:00Z", end_at: "2026-08-20T16:00:00Z", site_code: "ONSITE", station_count: 4, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { err_interval: $.data.error_id }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 13, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { err_range: $.data.error_id }
          assertions:
            - "all three calls return status 422 with $.data.error_id == 'ERR_INVALID_REQUEST'"
            - "no GroupSession row is created by any of the three calls"

      - name: program_block_creation_against_missing_program_returns_not_found
        claim_type: Parent Relationships
        claim: "ProgramBlock is a child of TrainingProgram: appending a block under an unknown training_program_id returns ERR_TRAINING_PROGRAM_NOT_FOUND before any body validation"
        test_recipe:
          setup: []
          action:
            - call: "POST /training-programs/7c2b1a52-0000-4000-8000-0000000000ff/blocks"
              payload: { expected_training_program_version: 1, phase: "GENERAL_PREP", start_week: 1, end_week: 4, target_intensity_pct: 60, weekly_volume_units: 20.00 }
              as: PerformanceDirector
              captures: { err: $.data.error_id }
          assertions:
            - "status 404"
            - "$.data.error_id == 'ERR_TRAINING_PROGRAM_NOT_FOUND'"
            - "path existence (priority 3) is checked before OCC (priority 7), so no ERR_STALE_VERSION is returned"

      - name: enrollment_creation_with_unknown_athlete_fk_returns_not_found
        claim_type: flat topology foreign key integrity
        claim: "In the flat entity topology, body foreign keys are validated for existence: POST /enrollments with an unknown athlete_id but a valid group_session_id returns ERR_ATHLETE_NOT_FOUND"
        test_recipe:
          setup:
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-21T16:00:00Z", end_at: "2026-08-21T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
          action:
            - call: "POST /enrollments"
              payload: { athlete_id: "9d3e1a52-0000-4000-8000-0000000000aa", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assertions:
            - "status 404"
            - "$.data.error_id == 'ERR_ATHLETE_NOT_FOUND'"
            - "no Enrollment row is created and the GroupSession reserved_count stays 0"

      - name: athlete_immutability_not_applicable_all_entities_carry_common_fields
        claim_type: Immutability
        excluded_because:
          difficulty_instance: package_credit_ledger_conserved_across_reserve_deplete_refund_and_consume
          rationale: "Every entity in §1.1 declares common_fields: true, so there is no immutable entity and no missing update endpoint to assert. The presence and behaviour of the common fields under repeated mutation is exercised by the cited §1.8 instance, and entity_version_increments_by_one_on_every_mutation in the cross_cutting_layers section of this file asserts the version counter directly."

  # =========================================================================
  # SECTION 2 -- From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: second_program_activation_archives_the_previously_active_program
        claim_type: Valid Transition
        claim: "TrainingProgram DRAFT -> ACTIVE on activate, and activating a second program for the same athlete drives the first ACTIVE -> ARCHIVED"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Two Program Athlete", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "g.twoprog@example.com" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2026-11-01", competition_end_date: "2027-02-01" }
              as: PerformanceDirector
              captures: { program_a: $.data.id }
            - call: "POST /training-programs/${program_a}/blocks"
              payload: { expected_training_program_version: 1, phase: "GENERAL_PREP", start_week: 1, end_week: 4, target_intensity_pct: 60, weekly_volume_units: 20.00 }
              as: PerformanceDirector
            - call: "POST /training-programs/${program_a}/activate"
              as: PerformanceDirector
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2027-03-01", competition_end_date: "2027-06-01" }
              as: PerformanceDirector
              captures: { program_b: $.data.id }
            - call: "POST /training-programs/${program_b}/blocks"
              payload: { expected_training_program_version: 1, phase: "SPECIFIC_PREP", start_week: 1, end_week: 3, target_intensity_pct: 75, weekly_volume_units: 18.00 }
              as: PerformanceDirector
          action:
            - call: "POST /training-programs/${program_b}/activate"
              as: PerformanceDirector
              captures: { status_b: $.data.status }
          assertions:
            - "status 200"
            - "$.data.status == 'ACTIVE' and $.data.activated_at is non-null"
            - "$.data.pinned_block_versions lists the single block of program_b"
            - "GET /training-programs/${program_a} now reports status 'ARCHIVED'"
            - "every ProgramBlock of program_b is PINNED (GET /program-blocks/{id} on the captured block)"

      - name: enrollment_attend_precondition_requires_session_in_progress
        claim_type: Precondition Enforcement
        claim: "Enrollment RESERVED -> ATTENDED requires the GroupSession to be IN_PROGRESS; marking attendance while the session is still SCHEDULED violates the precondition and returns ERR_INVALID_STATE"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Early Attend Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_id: $.data.id }
          action:
            - call: "POST /enrollments/${enrollment_id}/attend"
              as: Coach
              captures: { err: $.data.error_id }
          assertions:
            - "status 409"
            - "$.data.error_id == 'ERR_INVALID_STATE'"
            - "the Enrollment remains RESERVED and Athlete.attended_count stays 0"

      - name: group_session_completion_side_effects_sweep_reserved_rows_to_no_show
        claim_type: Side Effect Execution
        claim: "GroupSession IN_PROGRESS -> COMPLETED applies its declared side effects: remaining RESERVED enrollments are swept to NO_SHOW with a fee, the athlete counters move, and delivered_slots_at_completion is snapshotted"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Sweep", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Sweep Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: 1 }
              as: PerformanceDirector
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_id: $.data.id }
            - call: "POST /group-sessions/${session_id}/lock-roster"
              as: PerformanceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T16:00:00Z" }
              as: PerformanceDirector
            - call: "POST /group-sessions/${session_id}/start"
              as: Coach
          action:
            - call: "POST /group-sessions/${session_id}/complete"
              as: Coach
              captures: { session_status: $.data.session_status }
          assertions:
            - "status 200"
            - "$.data.session_status == 'COMPLETED'"
            - "$.data.no_show_count == 1 and $.data.attended_count == 0"
            - "$.data.delivered_slots_at_completion == 0 (no ATTENDED rows)"
            - "GET the Enrollment shows status 'NO_SHOW', strike_index_at_no_show == 1 and no_show_fee_cents == 1238 (round_half_up(4500 * 0.275 * 1.0))"
            - "GET /athletes/${athlete_id} shows no_show_count == 1 and no_show_strikes == 1 with membership_status still ACTIVE (below the suspension threshold of 3)"

      - name: membership_package_unfreeze_from_active_rejected
        claim_type: Invalid Transitions
        claim: "From MembershipPackage state ACTIVE the unfreeze trigger is not in the transition list, so it returns ERR_INVALID_STATE and leaves the package untouched"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Unfreeze Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /membership-packages"
              payload: { athlete_id: "${athlete_id}", sessions_purchased: 5, price_cents: 20000, expires_on: "2026-12-31" }
              as: FrontDesk
              captures: { package_id: $.data.id }
          action:
            - call: "POST /membership-packages/${package_id}/unfreeze"
              as: FrontDesk
              captures: { err: $.data.error_id }
          assertions:
            - "status 409"
            - "$.data.error_id == 'ERR_INVALID_STATE'"
            - "the package remains ACTIVE with frozen_at null, frozen_days_total 0 and effective_expires_on still 2026-12-31"

      - name: clearance_document_initial_state_is_pending
        claim_type: Initial State
        claim: "A newly created ClearanceDocument starts in its declared initial_state PENDING with signed_at and provider_license_id null"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
