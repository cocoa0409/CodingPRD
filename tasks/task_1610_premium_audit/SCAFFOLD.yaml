    path: "/auditors/{id}/appointments"
    description: "List appointments of an auditor (FK reverse reachability)"
    roles: [Auditor, AuditManager]
    code: 200
    input: []
    output: AuditAppointment[]
    side_effects: []

  # --- ClassificationCode ---
  - method: POST
    path: "/classification-codes"
    description: "Create a classification code with rate"
    roles: [Underwriter]
    code: 201
    input: [code, description, state_code, coverage_line, rate_per_100_cents, "high_hazard?", effective_from, effective_to]
    output: ClassificationCode
    side_effects: []
  - method: GET
    path: "/classification-codes"
    description: "List classification codes"
    roles: [Insured, Auditor, AuditManager, Underwriter, BillingClerk]
    code: 200
