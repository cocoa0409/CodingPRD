            - "err2 == ERR_UNAUTHORIZED_ROLE    # agents may not e-sign — Applicant exclusive"
            - "after the correct applicant signs: Lease.${l1_id}.status == SIGNED_BY_APPLICANT and signed_at == 2026-08-01T00:00:00Z"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-create-stale-application]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Application.version: lease generation with the version observed before a successful generation (v2) fails 412 ERR_STALE_VERSION after the application advanced to v3; re-reading and resubmitting with v3 succeeds and supersedes the first lease. Every successful generation increments Application.version by 1."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units; application APPROVED (version v2 captured from the decide response)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "OCC Oaks", code: "OC1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "OcA", email: "oca@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "OC", contact_email: "oc@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "OC App", applicant_email: "oc@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v2: $.data.version }
          trigger:
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v2}" }
              as: PropertyManager
              captures: { l1_id: $.data.id }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v2}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "GET /leasing/applications/${app_id}"
              as: PropertyManager
              captures: { app_v3: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v3}" }
              as: PropertyManager
              captures: { l2_id: $.data.id }
          assert:
            - "first generation succeeds with the observed version: Lease.${l1_id}.status == ISSUED"
            - "err == ERR_STALE_VERSION and HTTP status == 412   # same version replayed after the application advanced"
            - "GET shows Application.${app_id}.version advanced by exactly 1 per successful generation (app_v3 == app_v2 + 1)"
            - "fresh-version retry succeeds: Lease.${l2_id}.status == ISSUED and Lease.${l1_id}.status == SUPERSEDED"

      # NOTE: the scheduled_actions layer (logical-clock sweeps) is exercised by
