  # ===========================================================================
  - section: calculations
    instances:
      - name: posture_normal_when_stock_above_watch
        claim_type: correct_result
        grounds:
          - "calculations.bucket_physical_posture"
        distinguishing_aspect: "usable > watch_threshold reads NORMAL — the ladder's top rung (complements the inclusive-threshold difficulty instance)."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; policy RBC:O:NEG (watch 1, shortage 0, critical 0, min_shelf 4h); two AVAILABLE units"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 1, shortage_threshold: 0, critical_threshold: 0, min_shelf_life_hours: 4 }
              as: BloodBankSupervisor
