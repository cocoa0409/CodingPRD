  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_parallel_dimensions_independent_progress
        grounds:
          - state_machines.CarrierInvoice
          - entities.CarrierInvoice.fields.audit_status
          - entities.CarrierInvoice.fields.payment_status
        distinguishing_aspect: |
          CarrierInvoice carries two independent state dimensions: audit_status cycles
          RATED -> EXCEPTION -> RATED -> CLEARED while payment_status remains UNPAID
          throughout, and payment scheduling is gated on audit CLEARED — progress on one
          axis neither advances nor regresses the other except at the declared gate.
        test_recipe:
          setup:
            - "Client ACTIVE (tolerance 500/200bp); carrier ACTIVE; contract C1 ACTIVE (LTL 150/kg, fuel 10%, LIFTGATE 5000 cap 20%, min 20000)"
            - "Shipment PRO-1001; invoice INV-0004 billed 91000 (lines 78000/7800/5200) rated to variance 3500 -> EXCEPTION with RATE_MISMATCH"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
