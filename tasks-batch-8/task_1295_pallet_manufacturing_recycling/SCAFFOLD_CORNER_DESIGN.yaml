      - name: double_confirm_rejected_not_draft
        claim_type: conditional_action
        grounds: [state_machines.SalesOrder, "errors[ERR_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "Confirming an order already in CONFIRMED fails with ERR_ORDER_NOT_DRAFT — confirm is a one-shot DRAFT-gated transition, not an idempotent re-entry."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; CONFIRMED order"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
