      - name: average_agreement_credit_stages_with_floor_cap_on_gross
        grounds:
          - calculations.average_agreement_credit
          - entities.AverageAgreement.fields.credit_days_earned
          - entities.AverageAgreement.fields.debit_days_incurred
          - entities.AverageAgreement.fields.net_days
          - entities.AverageAgreement.fields.agreement_credit_cents
          - entities.Invoice.fields.agreement_credit_cents
        distinguishing_aspect: |
          Eight pinned stages that cannot be reordered: earned days, debit days,
          net days, available days as min(earned, debit), the month's per-day
          rate ladder, a most-expensive-day-first valuation, a FLOOR cap on
          30 percent of total_gross_cents, and only then the posting. The
          available-days stage is min(2, 3) == 2 even though net_days is -1, the
          valuation picks 22450 + 12550 == 35000 rather than the two cheapest
          days, and the FLOOR cap chops that to 14265 — three different stages
          each of which a plausible implementation gets wrong on its own.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T00:00:00Z"
            - "one OPEN AverageAgreement for 2026-08 with credit_cap_ratio 0.30"
            - "Cycle P released early: CP 2026-08-03T08:00:00Z, EDI notice 09:00:00Z, AP 2026-08-04T10:00:00Z, released 2026-08-04T15:00:00Z, free time expiring 2026-08-06T23:59:59.999Z, so 0 chargeable days and 2 early_release_days"
            - "Cycle A held long: CP 2026-08-03T08:00:00Z, EDI notice 09:00:00Z, AP 2026-08-05T10:00:00Z, released 2026-08-10T16:00:00Z, 3 chargeable days on the railroad ladder 12550/12550/22450 for a gross of 47550"
