              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/records/${chair7_id}/mark-deceased"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "AlumniRecord.${chair7_id}.status == DECEASED"
            - "CommitteeMembership.${mem7_id}.status == ENDED"
            - "CommitteeMembership.${mem7_id}.ended_reason == ALUMNUS_DECEASED"
            - "ReunionEvent.${ev7_id}.committee_count == 0"
            - "ReunionEvent.${ev7_id}.posture == GATED (0 < quorum 1)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_payment_state_vs_fiscal_priority
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TIER_SOLD_OUT]
        distinguishing_aspect: |
          Category pair state (P5) vs business_fiscal (P10): a confirm-payment on
          a registration whose event is no longer OPEN_FOR_REGISTRATION AND whose
          tier is also sold out must surface ERR_INVALID_STATE (state, P5), not
          ERR_TIER_SOLD_OUT (fiscal, P10).
