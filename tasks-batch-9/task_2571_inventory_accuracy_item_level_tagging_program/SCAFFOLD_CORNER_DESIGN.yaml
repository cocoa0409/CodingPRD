              as_user_id: "u_admin_1"
              captures: { item_pan: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_pan}", baseline_on_hand_units: 40, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_pan: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_pan}", counted_units: 40, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_ITEM_CATEGORY_MISMATCH\""
            - "GET /inventory-integrity/count-tasks/${task1} still reads counted_line_count 0 and in_scope_position_count 1 — only the APPAREL position was ever in scope"
            - "an unstocked APPAREL item instead returns \"ERR_ITEM_NOT_STOCKED_AT_STORE\", showing the two cross-entity checks are distinct rules"
            - "the same call with ${item_tee1} returns 201"

      - name: duplicate_stock_position_for_same_store_and_item_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_76_ERR_DUPLICATE_STOCK_POSITION
        distinguishing_aspect: "The (store_id, item_id) pair is the natural key of a stock position, so a second open attempt for the same pair is rejected even when the baseline quantity differs."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001 and one existing stock position for (S100, TEE-001) with 100 units."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 7, reserved_units: 0 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_DUPLICATE_STOCK_POSITION\""
            - "GET /inventory-integrity/stock-positions?store_id=${store_s100}&item_id=${item_tee1} returns total_count 1"
            - "GET /inventory-integrity/stock-positions/${pos_tee1} still reads on_hand_units 100 and version unchanged"
            - "the same item at a different store is accepted, since the uniqueness is on the pair and not on the item alone"

      - name: state_check_precedes_referential_check_on_count_line_create
        claim_type: priority_ordering
        grounds:
          - validations.priority_40_ERR_COUNT_TASK_INVALID_STATE
          - validations.priority_63_ERR_ITEM_NOT_STOCKED_AT_STORE
        distinguishing_aspect: "A line submitted to a COUNTED task for an unstocked item violates both rules; the priority-40 state check must win."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_referential_on_count_line_after_submit"
          rationale: "§1.8 rule priority_pair_validation_conflict already constructs the double violation and asserts ERR_COUNT_TASK_INVALID_STATE together with the single-violation controls that prove each rule fires on its own."

      - name: segregation_of_duties_precedes_supervisor_cap_on_approve
        claim_type: priority_ordering
        grounds:
          - validations.priority_50_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_100_ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP
        distinguishing_aspect: "A supervisor approving their own above-cap adjustment violates both rules; the priority-50 duties rule must win."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / sod_beats_supervisor_cap_on_adjustment_approve"
          rationale: "The named §1.8 instance already pins ERR_SEGREGATION_OF_DUTIES over ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP with both single-violation controls."

      - name: reader_mode_check_precedes_window_due_check_on_task_create
        claim_type: priority_ordering
        grounds:
          - validations.priority_70_ERR_READER_MODE_UNSUPPORTED
          - validations.priority_90_ERR_COUNT_WINDOW_NOT_DUE
        distinguishing_aspect: "An OVERHEAD task on a HANDHELD_ONLY store with a not-yet-due window violates both rules; the priority-70 hardware rule must win."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / reader_mode_beats_window_not_due_on_count_task_create"
          rationale: "The named §1.8 instance already asserts ERR_READER_MODE_UNSUPPORTED ahead of ERR_COUNT_WINDOW_NOT_DUE and includes both isolating controls."

  # ==========================================================================
  - section: endpoints
    instances:

      - name: integrity_scan_on_a_clean_position_is_a_no_op
        claim_type: conditional_action
        grounds:
          - endpoints.POST_stock_positions_integrity_scan
          - calculations.integrity_scan_corrections
        distinguishing_aspect: "Neither rule fires on a never-counted, non-negative position: R1 needs on_hand < 0 and R2 needs last_counted_at not null, so the scan reports zero corrections and mints no Adjustment — while still bumping the position version, because the endpoint's version side effect is unconditional."
        test_recipe:
          setup:
            - "Category APPAREL with auto_correct_negative true, Store S100, Vendor VEND1, Item TEE-001."
            - "One stock position at S100 for TEE-001 with 10 units, reserved 0, never counted."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 10, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id", pos_v1: "$.data.version" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/integrity-scan"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 200, data.corrections_applied == 0, data.negative_corrected_units == 0 and data.phantom_zeroed_units == 0"
            - "response data.auto_posted_adjustment_ids == [] and data.pending_adjustment_ids == []"
            - "response data.resulting_on_hand_units == 10, data.resulting_phantom_units == 0, data.tag_integrity_hold == false and data.resulting_promising_state == \"PROMISABLE\""
            - "GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1} returns total_count 0"
            - "GET /inventory-integrity/stock-positions/${pos_tee1} reads version ${pos_v1} + 1 — the scan is a write even when it changes nothing"

      - name: integrity_scan_splits_small_negative_auto_post_from_large_negative_approval
        claim_type: conditional_action
        grounds:
          - calculations.integrity_scan_corrections
          - global_constants.NEGATIVE_AUTO_CORRECT_MAX_UNITS
        distinguishing_aspect: "NEGATIVE_AUTO_CORRECT_MAX_UNITS 5 splits the two branches on the same category: a -4 on-hand is auto-corrected to 0 with a POSTED threshold-exempt adjustment, while a -6 on-hand is routed to approval, leaves on_hand at -6 and sets tag_integrity_hold, blocking promising."
        test_recipe:
          setup:
            - "Category APPAREL with auto_correct_negative true (tolerance value 20000 cents, so the authority threshold is 20000 and neither test adjustment needs approval)."
            - "Store S100, Vendor VEND1, Items TEE-004 at 900 cents and TEE-003 at 1800 cents."
            - "Position A: TEE-004 at S100 with 1 unit, driven to -4 by a posted -5 adjustment (value impact 4500 < 20000, so NOT_REQUIRED)."
            - "Position B: TEE-003 at S100 with 1 unit, driven to -6 by a posted -7 adjustment (value impact 12600 < 20000)."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-004", description: "Pocket tee", unit_cost_cents: 900, retail_price_cents: 1999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee4: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-003", description: "Long-sleeve tee", unit_cost_cents: 1800, retail_price_cents: 3499, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee3: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee4}", baseline_on_hand_units: 1, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_a: "$.data.id", pos_a_v1: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee3}", baseline_on_hand_units: 1, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_b: "$.data.id", pos_b_v1: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_a}/adjustments"
              payload: { delta_units: -5, reason_code: "PROCESS_ERROR", expected_stock_position_version: "${pos_a_v1}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj_a: "$.data.id" }
            - call: "POST /inventory-integrity/adjustments/${adj_a}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/stock-positions/${pos_b}/adjustments"
              payload: { delta_units: -7, reason_code: "PROCESS_ERROR", expected_stock_position_version: "${pos_b_v1}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj_b: "$.data.id" }
            - call: "POST /inventory-integrity/adjustments/${adj_b}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          trigger:
            - call: "POST /inventory-integrity/stock-positions/${pos_a}/integrity-scan"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 200, data.corrections_applied == 1, data.negative_corrected_units == 4 and data.phantom_zeroed_units == 0"
            - "response data.auto_posted_adjustment_ids has exactly 1 entry, data.pending_adjustment_ids == [], data.resulting_on_hand_units == 0 and data.tag_integrity_hold == false"
            - "that auto-posted adjustment reads delta_units 4, reason_code \"NEGATIVE_CORRECTION\", authority_threshold_cents 0, approval_state \"NOT_REQUIRED\" and posting_state \"POSTED\", and requested_by_user_id \"system\""
            - "GET /inventory-integrity/stock-positions/${pos_a} reads on_hand_units 0, negative_correction_count 1 and promising_state \"PROMISABLE\""
            - "POST /inventory-integrity/stock-positions/${pos_b}/integrity-scan instead reports corrections_applied 1 with pending_adjustment_ids of length 1, auto_posted_adjustment_ids [], resulting_on_hand_units -6, tag_integrity_hold true and resulting_promising_state \"BLOCKED\""
            - "that pending adjustment reads delta_units 6, approval_state \"PENDING\" and posting_state \"UNPOSTED\", so no units moved"
            - "re-scanning position A a second time reports corrections_applied 0 and mints nothing — the scan is idempotent in effect"

      - name: integrity_scan_phantom_clear_reads_the_logical_clock
        claim_type: conditional_action
        grounds:
          - calculations.integrity_scan_corrections
          - endpoints.POST_clock_set_current_utc
        distinguishing_aspect: "Phantom detection is purely clock-driven: a 2-unit position last counted on 2026-06-01 is untouched while the clock reads 2026-06-01, and the very same position is auto-zeroed once the clock is advanced to 2026-08-01, because 61 days is at or beyond PHANTOM_STALE_DAYS 45."
        test_recipe:
          setup:
            - "The logical clock is set to 2026-06-01T00:00:00Z before the count so last_counted_at lands in the past."
            - "Category APPAREL with auto_correct_negative true, Store S100, Vendor VEND1, Item TEE-004 at 900 cents."
            - "One stock position at S100 for TEE-004 with 2 units and reserved 0 — the only APPAREL position, so coverage reaches 100.00."
            - "An OPEN ShrinkPeriod for S100 covering 2026-05-01..2026-06-30 and a HANDHELD count that counts 2 against 2, stamping last_counted_at at 2026-06-01."
            - "The clock is then advanced to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-004", description: "Pocket tee", unit_cost_cents: 900, retail_price_cents: 1999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee4: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee4}", baseline_on_hand_units: 2, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_a: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-05-01", period_end: "2026-06-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
