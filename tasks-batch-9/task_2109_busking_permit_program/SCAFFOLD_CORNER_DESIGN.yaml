              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "APPROVED", decision_note: "Approved on the papers" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
          assert:
            - 'GET /busking/permits?application_id=${app_a} returns total_count 1'
            - 'Permit.${permit_a}.lifecycle_status == "PENDING_FEE" and Permit.${permit_a}.compliance_status == "CLEAR"'
            - 'Permit.${permit_a}.performer_id == "${perf_a}" and Permit.${permit_a}.season_year == 2026'
            - 'Permit.${permit_a}.permit_number matches the pattern BP-2026-0001'
            - 'GET /busking/permits/${permit_a}/fee-invoices returns total_count 1'
            - 'FeeInvoice.${inv_a}.invoice_kind == "INITIAL" and FeeInvoice.${inv_a}.status == "PENDING"'
            - 'FeeInvoice.${inv_a}.amount_due_cents == 5400'
            - 'PermitApplication.${app_a}.assessed_fee_cents == 5400'
            - 'PermitApplication.${app_a}.status == "APPROVED"'


