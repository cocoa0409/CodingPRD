  # ==========================================================================
  # §1.9 Section 6 — Errors (Table 6)
  # Every code in §1.6 must be triggerable. Codes already asserted by a §1.8
  # instance appear here as excluded_because stubs; the rest get real triggers.
  # ==========================================================================
  - section: errors
    instances:

      - name: errors_all_seventeen_not_found_codes_triggerable_by_unknown_id
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_RETENTION_SCHEDULE_NOT_FOUND]
          - errors[ERR_RECORD_SERIES_NOT_FOUND]
          - errors[ERR_LEGAL_HOLD_NOT_FOUND]
          - errors[ERR_APPRAISAL_NOT_FOUND]
          - errors[ERR_ACCESSION_NOT_FOUND]
          - errors[ERR_ARCHIVAL_ITEM_NOT_FOUND]
          - errors[ERR_STORAGE_ZONE_NOT_FOUND]
          - errors[ERR_FINDING_AID_NOT_FOUND]
          - errors[ERR_PRESERVATION_PLAN_NOT_FOUND]
          - errors[ERR_MIGRATION_JOB_NOT_FOUND]
          - errors[ERR_REQUESTER_NOT_FOUND]
          - errors[ERR_ACCESS_REQUEST_NOT_FOUND]
          - errors[ERR_SCREENING_NOT_FOUND]
          - errors[ERR_INTERVIEW_NOT_FOUND]
          - errors[ERR_EVIDENCE_PACKAGE_NOT_FOUND]
          - errors[ERR_EXHIBIT_LOAN_NOT_FOUND]
          - errors[ERR_DEACCESSION_PROPOSAL_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: "One instance sweeps all seventeen NOT_FOUND codes through the seventeen single-row GET endpoints with the same never-existing id, proving each resource type reports its own code (not a shared generic 404) and that the priority-5 path-id resolution check fires before any role or payload work. ArchivesDirector is in the roles list of every one of these reads, so a single actor can drive the whole sweep."
        setup_notes: "No fixtures at all are required: an empty database is the strongest form of 'unknown id'."
