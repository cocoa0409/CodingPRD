      - name: family_allowance_lands_exactly_on_the_cap_then_refuses
        claim_type: aggregate_validation
        grounds: ["validations[priority=24]", calculations.sweat_equity_credit_allocation, errors.ERR_FAMILY_CREDIT_CAP_REACHED, entities.ApplicantHousehold.fields.family_member_credited_hours, entities.ApplicantHousehold.fields.sweat_equity_required_hours]
        distinguishing_aspect: "Each entry is individually legal — 6.00 and then 2.00 hours by an adult EXTENDED_FAMILY member in an uncapped category — but the aggregate allowance floor(0.50 * 12) == 6 is a household-wide bucket. Landing exactly ON the cap is accepted; the next entry finds zero room and is refused with the FAMILY error rather than the category error, because CONSTRUCTION carries no per-category ceiling."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household (composite 91.0) whose members are one adult APPLICANT and one adult EXTENDED_FAMILY member born 1995-02-02 with is_adult_occupant omitted, so adult_occupant_count stayed 1 and sweat_equity_required_hours froze at 12.0. Two CONSTRUCTION entries for the EXTENDED_FAMILY member, of 6 and 2 hours, are claimed by fsc-1 and VERIFIED by cm-1."
