      - name: compliance_sweep_flags_only_the_overdue_notification_and_is_a_no_op_when_rerun
        claim_type: Bulk action
        grounds:
          - endpoints[POST /product-safety/recalls/{id}/compliance-sweep]
          - state_machines[RetailerNotification].transitions[ISSUED -> DELINQUENT]
          - state_machines[Recall].transitions[IN_PROGRESS -> DEFICIENT]
        distinguishing_aspect: |
          A batch verb with per-row eligibility: two notifications issued at the same
          instant, one already acknowledged, and a clock past ack_due_at. Exactly one
          row may flip, the acknowledged retailer's counters must be untouched, and
          a second sweep must return 200 while changing nothing — a best-effort
          bulk action, not a transaction that fails because part of the batch is
          ineligible, and not a counter that double-increments on replay.
        test_recipe:
          setup:
            - "fixture chain F1 to an APPROVED recall with TWO retailers, each holding one notification issued at 2026-03-13T00:00:00Z with ack_due_at 2026-03-16T00:00:00Z"
