            - "after the dispute StoreDay.${day_id}.retail_sales_cents == 6071 and StoreDay.${day_id}.retail_sales_per_guest_cents == 43 — round_half_up(6071 / 142)"
            - "the restaurant guest count stays 142 throughout, so the denominator did not move"
            - "StoreDay.${day_id}.retail_transaction_count drops from 2 to 1"
            - "the provisional variant uses a different denominator: with 35 waiting-area shoppers the provisional figure is round_half_up(6071 / 35) == 173, not 43"# Part B — validations, endpoints, errors.

  # ===========================================================================
  - section: validations
    instances:

      - name: eligibility_gate_restricted_refuses_new_backroom_load
        claim_type: Conditional validation
        grounds:
          - validations[priority=24]
          - validations[priority=8]
          - errors[ERR_STORE_DAY_GATE_RESTRICTED]
          - entities.StoreDay.fields.conversion_gate
        distinguishing_aspect: "The gate rule is conditional on the gate's value: GATED_RESTRICTED admits a sales-floor ring but refuses a backroom receive with its own error id, while a SUSPENDED gate outranks it and reports the priority-8 id instead."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Transfer TR-1 is IN_TRANSIT with declared_units 60 at store 1042, which has 30 food-storage corridor units."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 60, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 140, restaurant_sales_cents: 1400000, waiting_area_shopper_count: 30, waiting_area_converted_count: 15 }
              as: BoutiqueManager
              captures: { gate: $.data.conversion_gate }
          trigger:
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 60 }
              as: RetailLead
              captures: { restricted_error: $.data.error_id }
          assert:
            - "the guest count of 140 drives StoreDay.${day_id}.conversion_gate to GATED_RESTRICTED"
            - "the receive returns 409 ERR_STORE_DAY_GATE_RESTRICTED — the restricted gate refuses backroom load but not sales-floor writes"
            - "a sales-floor ring on the same restricted day still succeeds: POST /retail-ops/receipts returns 201, so the restriction is conditional on the operation class"
            - "the same receive on a day whose gate is SUSPENDED returns 409 ERR_STORE_DAY_GATE_SUSPENDED instead, because that rule sits at priority 8 and this one at 24"
            - "Transfer.${tr_id}.status == IN_TRANSIT unchanged after both rejected attempts"

      - name: clearance_create_missing_end_date_returns_invalid_request_and_present_fields_succeed
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/retail-ops/clearance-schedules
        distinguishing_aspect: "Omitting the required end_date yields 400 ERR_INVALID_REQUEST with no row created, and supplying the full field set yields 201 — the violating and satisfying halves of the same rule."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 and ITM-BOAT-6400 exist."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
          trigger:
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-09-25T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and the error_id is ERR_INVALID_REQUEST"
            - "GET /retail-ops/clearance-schedules?item_id=${item_a_id} returns 0 rows"
            - "the satisfying counterpart returns 201 with status DRAFT and stage S1: the same call with end_date 2026-10-25T00:00:00Z succeeds"
            - "the satisfying counterpart's ClearanceSchedule.markdown_pct == 0 and ClearanceSchedule.remaining_units == 0, so nothing is priced until activation"

      - name: receipt_ring_priority_puts_state_ahead_of_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ITEM_NOT_FOUND]
        distinguishing_aspect: "A ring on a closed store day whose line also names an unallocated item violates the priority-7 state row and the priority-9 existence row, and the state error wins by the numeric ordering alone."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 has been closed with no receipts on it."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/store-days/${day_id}/close"
              payload: { expected_store_day_version: "${day_v}" }
              as: BoutiqueManager
              captures: { closed: $.data.day_status }
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0071", lines: [{ item_id: "00000000-0000-4000-8000-000000000000", quantity: 1, unit_price_cents: 100, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { error_id: $.data.error_id }
          assert:
            - "StoreDay.${day_id}.day_status == CLOSED after the close call"
            - "the ring returns 409 ERR_INVALID_STATE, not 404 ERR_ITEM_NOT_FOUND"
            - "the ordering is decided by the numeric priority alone: the state row is 7 and the existence row is 9"
            - "on an OPEN store day the same unallocated-item payload returns 404 ERR_ITEM_NOT_FOUND, so the winner flips with the day's state"

      - name: brand_invalid_recognition_policy_returns_invalid_request
        claim_type: Violation to Error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Brand.fields.retail_recognition_policy
        distinguishing_aspect: "A recognition policy outside the declared enum is a malformed body and is rejected with 400 rather than silently defaulting."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-9001", legal_name: "Bad Policy Co", retail_recognition_policy: "MAYBE_LATER", fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and the error_id is ERR_INVALID_REQUEST"
            - "no brand was created: GET /retail-ops/brands?brand_code=BR-9001 returns 0 rows"
            - "the two legal values both succeed: FINAL_ONLY and PROVISIONAL_THEN_FINAL each return 201"
            - "an out-of-range transfer_variance_tolerance_bps of 20000 is also rejected with 400, because it must be at most 10000"

      - name: transfer_declared_units_above_remaining_capacity_returns_over_capacity
        claim_type: Aggregate validation
        grounds:
          - validations[priority=17]
          - errors[ERR_BACKROOM_OVER_CAPACITY]
          - entities.Location.fields.staging_free_units
        distinguishing_aspect: "The check is aggregate: 3950 units is a legal declared quantity on its own, but once the 310-unit food corridor is subtracted the projected free units go negative and the receive is refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 has backroom_capacity_units 4000 and a 310-unit food corridor; two transfers are IN_TRANSIT with declared 3950 and 3000."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 3950, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_big_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_big_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 3000, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_ok_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_ok_id}/dispatch"
              payload: {}
              as: RetailLead
          trigger:
            - call: "POST /retail-ops/transfers/${tr_big_id}/receive"
              payload: { received_units: 3950 }
              as: RetailLead
              captures: { error_id: $.data.error_id }
            - call: "POST /retail-ops/transfers/${tr_ok_id}/receive"
              payload: { received_units: 3000 }
              as: RetailLead
              captures: { ok_status: $.data.status }
          assert:
            - "the oversized receive returns 409 ERR_BACKROOM_OVER_CAPACITY"
            - "the projected free units for the rejected attempt are 4000 - 3950 - 0 - 310 == -260"
            - "Transfer.${tr_big_id}.status == IN_TRANSIT unchanged and no capacity reading was appended"
            - "the 3000-unit receive succeeds: Transfer.${tr_ok_id}.status == RECEIVED and the projected free units are 4000 - 3000 - 0 - 310 == 690"
            - "both declared quantities satisfy the dispatch precondition, so the failure is an aggregate capacity check and not a per-transfer bound"

      - name: routing_a_retail_transfer_into_food_storage_is_refused
        claim_type: Violation to Error
        grounds:
          - validations[priority=6]
          - errors[ERR_FOOD_STORAGE_ZONE_FORBIDDEN]
          - entities.Transfer.fields.receiving_zone
        distinguishing_aspect: "The shared backroom rule refuses a retail transfer routed into the food-storage zone at creation time, and the refusal is 409 rather than a 400 because the payload is well formed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN and ITM-BOAT-6400 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 20, received_units: 20, receiving_zone: "FOOD_STORAGE" }
              as: RetailLead
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_FOOD_STORAGE_ZONE_FORBIDDEN"
            - "no transfer was created: GET /retail-ops/transfers?store_day_id=${day_id} returns 0 rows"
            - "the same transfer routed to BACKROOM returns 201 with status PLANNED"
            - "the rule is at priority 6, ahead of the state row at 7, so it is reported even when the store day is also in a bad state"

      - name: clearance_activation_beyond_the_store_slot_cap_is_refused
        claim_type: Violation to Error
        grounds:
          - validations[priority=14]
          - errors[ERR_CLEARANCE_SLOT_LIMIT]
          - entities.Location.fields.active_clearance_count
        distinguishing_aspect: "The store's maximum of one concurrently ACTIVE clearance is a capacity check: the second activation is well formed and inside its own window, but the store is already carrying one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T15:00:00Z. Store 1042 has clearance_max_active 1. ClearanceSchedule CS-A on ITM-BOAT-6400 covers 2026-09-01 to 2026-09-30 and is ACTIVE. ClearanceSchedule CS-B on ITM-DECOR-1300 covers 2026-10-02 to 2026-10-20 and is DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-1300", name: "Porch Sign", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 1300, unit_cost_cents: 500, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_b_id: $.data.id, item_b_v: $.data.version }
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 4, received_units: 4, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_a_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_a_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_a_id}/receive"
              payload: { received_units: 4 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { cs_a_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_a_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { count_after_a: $.data.stage }
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_b_id}", start_date: "2026-10-02T00:00:00Z", end_date: "2026-10-20T00:00:00Z", expected_item_version: "${item_b_v}" }
              as: BoutiqueManager
              captures: { cs_b_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/clearance-schedules/${cs_b_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the second schedule clears the buffer rule: its start 2026-10-02 is 48 hours after the first window's 2026-09-30 end, above the 24-hour requirement"
            - "the activation returns 409 ERR_CLEARANCE_SLOT_LIMIT because Location.${loc_id}.active_clearance_count is already 1 and clearance_max_active is 1"
            - "ClearanceSchedule.${cs_b_id}.status == DRAFT unchanged and its stage is still S1"
            - "a third item's schedule would also be refused, so the cap is per location rather than per item"

      - name: liquidating_before_the_final_stage_returns_clearance_not_final
        claim_type: Cascading validation
        grounds:
          - validations[priority=15]
          - errors[ERR_CLEARANCE_NOT_FINAL]
          - state_machines.ClearanceSchedule.ACTIVE_to_LIQUIDATED
        distinguishing_aspect: "The liquidation guard reads the schedule's stage and the item's status, so a schedule that has not walked the cadence to S4 is refused even though every other precondition holds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. ClearanceSchedule CS-1 on ITM-BOAT-6400 is ACTIVE at stage S1 with four remaining units."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 4, received_units: 4, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 4 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { stage_now: $.data.stage }
          trigger:
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/liquidate"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the activation leaves ClearanceSchedule.${cs_id}.stage == S1"
            - "the liquidation returns 409 ERR_CLEARANCE_NOT_FINAL"
            - "no side effect fired: Item.${item_a_id}.on_hand_units is still 4 and Item.${item_a_id}.status is still CLEARANCE"
            - "walking four full weeks of cadence with POST /transfers/${tr_id}/advance first takes the stage to S4 and the same liquidation then succeeds with 200"
            - "the guard also fires on Item.status: a schedule whose item was moved out of CLEARANCE by a second liquidation reports the same error id"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: planogram_version_delete_removes_a_draft_and_its_slots
        claim_type: Standard CRUD
        grounds:
          - endpoints.DELETE_/retail-ops/planogram-versions/{id}
          - errors[ERR_PLANOGRAM_NOT_FOUND]
        distinguishing_aspect: "DELETE removes a DRAFT version and its PLANNED slots with a 204, and every later read of either reports not-found."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A DRAFT planogram version for store 1042 exists with one PLANNED slot."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-01T00:00:00Z" }
              as: AssortmentPlanner
              captures: { pog_id: $.data.id }
            - call: "POST /retail-ops/planogram-slots"
              payload: { planogram_version_id: "${pog_id}", item_id: "${item_a_id}", slot_position: 1, facings: 2, min_presentation_units: 1 }
              as: AssortmentPlanner
              captures: { slot_id: $.data.id }
          trigger:
            - call: "DELETE /retail-ops/planogram-versions/${pog_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { deleted: $.data }
          assert:
            - "the response status is 204 with an empty body"
            - "GET /retail-ops/planogram-versions/${pog_id} returns 404 ERR_PLANOGRAM_NOT_FOUND"
            - "GET /retail-ops/planogram-slots/${slot_id} returns 404 ERR_PLANOGRAM_NOT_FOUND"
            - "GET /retail-ops/planogram-versions?location_id=${loc_id} returns 0 rows"
            - "Location.${loc_id}.active_planogram_version_id is still null, because the deleted version was never published"

      - name: tip_recompute_helper_makes_the_tip_eligible_query_observable
        claim_type: Computed read
        grounds:
          - endpoints.GET_/retail-ops/guest-checks
          - calculations.derive_tip_eligibility
          - entities.GuestCheck.fields.tip_eligible
        distinguishing_aspect: "The per-check eligibility read is reachable only by filtering the check list on tip_eligible, and it must agree with the shift-side derivation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T12:00:00Z. Two FINALIZED checks exist, one hosted by a 240-minute CASHIER shift and one hosted by a 180-minute SERVER shift."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-501", start_utc: "2026-09-21T08:00:00Z", end_utc: "2026-09-21T12:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { long_shift_id: $.data.id }
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-502", start_utc: "2026-09-21T08:00:00Z", end_utc: "2026-09-21T11:00:00Z", workcode: "SERVER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { short_shift_id: $.data.id }
            - call: "POST /retail-ops/staff-shifts/${long_shift_id}/start"
              payload: {}
              as: BoutiqueManager
            - call: "POST /retail-ops/staff-shifts/${short_shift_id}/start"
              payload: {}
              as: BoutiqueManager
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "11", restaurant_guest_count: 2, restaurant_subtotal_cents: 5000, presented_shift_id: "${long_shift_id}" }
              as: Server
              as_user_id: "${long_shift_id}"
              captures: { check_long_id: $.data.id }
            - call: "POST /retail-ops/guest-checks/${check_long_id}/tips"
              payload: { tip_cents: 900 }
              as: Cashier
              as_user_id: "${long_shift_id}"
            - call: "POST /retail-ops/guest-checks/${check_long_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${long_shift_id}"
              captures: { long_tip_eligible: $.data.tip_eligible }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "12", restaurant_guest_count: 2, restaurant_subtotal_cents: 5000, presented_shift_id: "${short_shift_id}" }
              as: Server
              as_user_id: "${short_shift_id}"
              captures: { check_short_id: $.data.id }
            - call: "POST /retail-ops/guest-checks/${check_short_id}/tips"
              payload: { tip_cents: 900 }
              as: Cashier
              as_user_id: "${short_shift_id}"
            - call: "POST /retail-ops/guest-checks/${check_short_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${short_shift_id}"
              captures: { short_tip_eligible: $.data.tip_eligible }
          trigger:
            - call: "GET /retail-ops/guest-checks"
              payload: { store_day_id: "${day_id}", tip_eligible: true }
              as: BoutiqueManager
              captures: { eligible_rows: "$.data[0].id" }
          assert:
            - "GuestCheck.${check_long_id}.tip_eligible == true because its host shift is 240 minutes"
            - "GuestCheck.${check_short_id}.tip_eligible == false because its host shift is only 180 minutes"
            - "the filtered read returns exactly 1 row, the long-shift check — the row count is the length of the returned array, since total_count is an envelope field and not a GuestCheck field"
            - "GuestCheck.${check_long_id}.tip_cents == 900 and GuestCheck.${check_long_id}.tip_pct == 0.18"
            - "the derivation agrees with the shift side: GET /retail-ops/staff-shifts?tip_eligible=true&location_id=${loc_id} returns exactly 1 row"

      - name: finalize_is_refused_on_an_already_finalized_check
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/retail-ops/guest-checks/{id}/finalize
          - errors[ERR_CHECK_ALREADY_FINALIZED]
          - state_machines.GuestCheck.PENDING_to_FINALIZED
        distinguishing_aspect: "Finalizing is a one-way conditional action: the second call reports the check-specific error id rather than recomputing the fee."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T12:00:00Z. GuestCheck C-1 is FINALIZED with restaurant_subtotal_cents 9000."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-601", start_utc: "2026-09-21T08:00:00Z", end_utc: "2026-09-21T12:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "14", restaurant_guest_count: 3, restaurant_subtotal_cents: 9000, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id }
            - call: "POST /retail-ops/guest-checks/${check_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee_first: $.data.service_fee_cents, total_first: $.data.total_cents }
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first finalize returns 200 with GuestCheck.${check_id}.check_status == FINALIZED"
            - "the second finalize returns 409 ERR_CHECK_ALREADY_FINALIZED"
            - "the fee is not doubled: GuestCheck.${check_id}.service_fee_cents == 1520 and GuestCheck.${check_id}.total_cents == 10520 as reconstructed from the 9000 basis with no tip"
            - "attaching a further receipt to the finalized check also fails, so finalization freezes the retail side too"

      - name: stale_store_day_version_returns_412_on_the_guest_count_write
        claim_type: Cross-reference link
        grounds:
          - concurrency_rules[guest-count-stale-store-day-version]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/retail-ops/store-days/{id}/guest-counts
        distinguishing_aspect: "The OCC guard on the store day rejects a count posted against a version the client has already superseded, with 412 rather than 409."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN at version 1; the client reads version 1, and another writer then posts a count that advances the day to version 2."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 40, restaurant_sales_cents: 400000, waiting_area_shopper_count: 10, waiting_area_converted_count: 5 }
              as: BoutiqueManager
              captures: { v_supersede: $.data.version }
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 60, restaurant_sales_cents: 600000, waiting_area_shopper_count: 12, waiting_area_converted_count: 6 }
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the second write carries the now-stale version ${day_v}, and the day has already advanced to version ${v_supersede}"
            - "the response status is 412 and the error_id is ERR_STALE_VERSION, not 409"
            - "StoreDay.${day_id}.restaurant_guest_count is still 40, so the stale write changed nothing"
            - "re-sending the same count with the current version ${v_supersede} succeeds with 200 and leaves restaurant_guest_count at 60"

      - name: brand_close_and_reopen_the_fiscal_period_gates_revenue_recognition
        claim_type: Conditional action
        grounds:
          - endpoints.PUT_/retail-ops/brands/{brandId}
          - errors[ERR_FISCAL_PERIOD_CLOSED]
          - entities.Brand.fields.fiscal_period_status
        distinguishing_aspect: "Revenue recognition is conditional on the brand period's status: the close is an ordinary configuration write, but it turns every reconcile into a 422 until the period is reopened."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A DRAFT receipt exists for store 1042 and the brand period 2026-Q3 is still OPEN."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0081", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "PUT /retail-ops/brands/${brand_id}"
              payload: { fiscal_period_status: "CLOSED" }
              as: PlatformAdmin
              captures: { period_status: $.data.fiscal_period_status }
          trigger:
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { closed_error: $.data.error_id }
          assert:
            - "the configuration write succeeds and Brand.${brand_id}.fiscal_period_status == CLOSED"
            - "the reconcile returns 422 ERR_FISCAL_PERIOD_CLOSED, so the recognition step is gated on the period"
            - "Receipt.${receipt_id}.status == DRAFT unchanged and Brand.${brand_id}.recognized_retail_revenue_cents is still 0"
            - "reopening with fiscal_period_status OPEN lets the same reconcile succeed with 200 and status RECONCILED"
            - "the store-day close is gated by the same status, so it also reports 422 while the period is closed"

      - name: item_order_deadline_check_recomputes_the_flag_from_the_clock
        claim_type: Computed read
        grounds:
          - endpoints.POST_/retail-ops/items/{id}/order-deadline-check
          - endpoints.GET_/retail-ops/items/{id}/import-plan
          - calculations.project_import_need
        distinguishing_aspect: "The deadline flag is time-dependent, so the same item reports it false in early September and true once the clock moves near the season window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Item ITM-LANTERN-1200 has theme WINTER_HOLIDAY and a 60-day import lead."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-LANTERN-1200", name: "Tin Lantern Ornament", theme_code: "WINTER_HOLIDAY", nostalgia_flag: false, unit_retail_cents: 1200, unit_cost_cents: 400, import_lead_time_days: 60 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/items/${item_id}/order-deadline-check"
              payload: {}
              as: AssortmentPlanner
              captures: { late_flag: $.data.order_deadline_reached }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/items/${item_id}/order-deadline-check"
              payload: {}
              as: AssortmentPlanner
              captures: { late_flag_2: $.data.order_deadline_reached }
          assert:
            - "at week 39 the WINTER_HOLIDAY window opens in week 40, so 1 week of lead time remains against a 60-day import lead and the first call reports true"
            - "at week 47 the window has already opened, so the lead no longer fits and the second call also reports true"
            - "the flag is recomputed on every call rather than stored, so no repository write is needed to move it"
            - "the margin floor is round_half_up(400 * 1.30) == 520 and the unit margin is 800, so the conjunction does not zero the need"
            - "GET /retail-ops/items/${item_id}/import-plan reports the same order_deadline_reached value as the trigger call"

      - name: store_day_close_runs_the_clearance_extension_only_below_the_trigger
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/retail-ops/store-days/{id}/close
          - entities.Brand.fields.liquidation_trigger_rpg_cents
          - state_machines.ClearanceSchedule.ACTIVE_to_EXTENDED
        distinguishing_aspect: "The close's extension branch is conditional on the day's retail sales per guest landing below the brand threshold, so the same close call extends a schedule on one day and leaves it untouched on another."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Two store days exist, 2026-09-21 with 200 guests and 50000 cents of settled retail, and 2026-09-22 with 200 guests and 100000 cents of settled retail; a clearance schedule covering both days is ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-2400", name: "Harvest Wall Plaque", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 2400, unit_cost_cents: 900, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_decor_id: $.data.id, item_decor_v: $.data.version }
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_decor_id}", declared_units: 8, received_units: 8, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 8 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_decor_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-20T00:00:00Z", expected_item_version: "${item_decor_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { stage: $.data.stage }
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/close"
              payload: { expected_store_day_version: "${day_v}" }
              as: BoutiqueManager
              captures: { rpg_low: $.data.retail_sales_per_guest_cents, closed: $.data.day_status }
          assert:
            - "the day closes with StoreDay.${day_id}.retail_sales_per_guest_cents == 250 for 50000 cents over 200 guests"
            - "250 is below the brand's 700-cent trigger, so ClearanceSchedule.${cs_id}.status == EXTENDED with extension_count == 1"
            - "the window also moves: ClearanceSchedule.${cs_id}.end_date advances by 14 days past the clock"
            - "a day above the trigger leaves the schedule ACTIVE: with 100000 cents over 200 guests the metric reads 500, which is still below 700, so the threshold would need 140000 cents to suppress the branch"
            - "Location.${loc_id}.active_clearance_count is unchanged at 1, because EXTENDED still occupies a slot"

      - name: transfer_discrepancy_read_reports_the_variance_against_tolerance
        claim_type: Computed read
        grounds:
          - endpoints.GET_/retail-ops/transfers/{id}/discrepancy
          - entities.Brand.fields.transfer_variance_tolerance_bps
        distinguishing_aspect: "The discrepancy read derives within_tolerance by comparing the transfer's basis-point variance against the brand's tolerance, and exposes the conserved backroom quantity alongside it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Transfer TR-D has been received with declared 100 and received 95, giving a 500 basis-point variance against a 200 basis-point tolerance."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 100, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 95 }
              as: RetailLead
              captures: { variance_bps: $.data.variance_bps }
          trigger:
            - call: "GET /retail-ops/transfers/${tr_id}/discrepancy"
              payload: {}
              as: BoutiqueManager
              captures: { variance_units: $.data.variance_units, tolerance: $.data.tolerance_bps, within: $.data.within_tolerance, conserved: $.data.conserved_backroom_units }
          assert:
            - "variance_units == -5 and variance_bps == 500"
            - "tolerance_bps == 200 echoes the brand's transfer_variance_tolerance_bps"
            - "within_tolerance == false, so the read agrees with the void-receiving guard"
            - "conserved_backroom_units == 95, the occupancy plus committed sum after the receiving"
            - "the read is idempotent: calling it again returns the same four values without mutating the transfer"

  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_request_returns_401_before_anything_else
        claim_type: Violation to Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A missing role header returns 401 ERR_UNAUTHENTICATED even when the body is also invalid and the target does not exist, because authentication is the first priority row."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and the error_id is ERR_UNAUTHENTICATED"
            - "the empty body and the unknown store day are not reported, because the auth row is priority 1"
            - "the same request with a valid role but a malformed body returns 400 ERR_INVALID_REQUEST instead"
            - "the error envelope still carries meta.api_request_id and meta.api_request_timestamp"

      - name: role_outside_the_endpoint_roles_returns_403
        claim_type: Violation to Error
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
          - roles.AssortmentPlanner
        distinguishing_aspect: "AssortmentPlanner owns items but not store-day closure, so the same well-formed request is refused with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN at store 1042."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/close"
              payload: { expected_store_day_version: "${day_v}" }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and the error_id is ERR_UNAUTHORIZED"
            - "the same call as BoutiqueManager returns 200, so the refusal is about the role and not the request"
            - "StoreDay.${day_id}.day_status == OPEN unchanged after the refused call"
            - "the role split is peer-to-peer rather than hierarchical: BoutiqueManager cannot publish a planogram either, and that call reports the same error id"

      - name: unknown_item_on_a_clearance_create_returns_404
        claim_type: Violation to Error
        grounds:
          - errors[ERR_ITEM_NOT_FOUND]
          - validations[priority=9]
        distinguishing_aspect: "An unallocated item id on the clearance-create body produces the entity-specific 404 rather than a generic not-found, and it outranks the state row that would otherwise fire."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 exists and no item has been created."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
          trigger:
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "00000000-0000-4000-8000-000000000000", start_date: "2026-09-25T00:00:00Z", end_date: "2026-10-25T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the OCC version field carries a real observed item version, so the failure cannot be blamed on a stale-version comparison; the response is 404 ERR_ITEM_NOT_FOUND"
            - "the existence row at priority 9 fires ahead of the stale-version check, so the reported error is not ERR_STALE_VERSION"
            - "no schedule was created: GET /retail-ops/clearance-schedules?location_id=${loc_id} returns 0 rows"
            - "with a real item but a stale expected_item_version the same call reports 412 ERR_STALE_VERSION instead"

      - name: unknown_transfer_id_on_a_path_segment_returns_transfer_not_found
        claim_type: Violation to Error
        grounds:
          - errors[ERR_TRANSFER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "The path-segment resolution order is left to right, and an unallocated transfer id is reported with the transfer-specific id rather than the location's."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 exists and has never had a transfer."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
          trigger:
            - call: "GET /retail-ops/transfers/00000000-0000-4000-8000-000000000000/discrepancy"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and the error_id is ERR_TRANSFER_NOT_FOUND"
            - "the sub-resource read resolves the transfer segment before running the computed discrepancy"
            - "GET /retail-ops/transfers returns 0 rows for this location, confirming nothing was created"
            - "an unallocated store day id on the capacity-readings sub-resource reports ERR_STORE_DAY_NOT_FOUND instead, so the id is entity-specific per segment"

      - name: posting_a_tip_above_the_check_cap_returns_check_total_exceeded
        claim_type: Boundary error
        grounds:
          - errors[ERR_CHECK_TOTAL_EXCEEDED]
          - validations[priority=16]
          - entities.Brand.fields.max_check_total_cents
        distinguishing_aspect: "The cap is on the combined total including the fee, so a tip that pushes the check over the 50000-cent cap is rejected at the tip endpoint even though the food subtotal is well inside it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. GuestCheck C-1 is PENDING with restaurant_subtotal_cents 40000; the brand cap is 50000."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-701", start_utc: "2026-09-21T08:00:00Z", end_utc: "2026-09-21T12:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "16", restaurant_guest_count: 6, restaurant_subtotal_cents: 40000, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_id}/tips"
              payload: { tip_cents: 8000 }
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /retail-ops/guest-checks/${check_id}/tips"
              payload: { tip_cents: 2000 }
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { accepted_total: $.data.total_cents }
          assert:
            - "the 8000-cent tip would make the provisional total 40000 + 0 + 8000 == 48000, which selects the 0.20 band, and the marginal fee is round_half_up(4000*0.15) + round_half_up(4000*0.18) + round_half_up(32000*0.20) == 6920, so the combined total reaches 54920 and exceeds the 50000 cap"
            - "the oversized tip returns 422 ERR_CHECK_TOTAL_EXCEEDED"
            - "GuestCheck.${check_id}.tip_cents was not changed by the rejected call"
            - "the 2000-cent tip is accepted: the provisional total 42000 still selects the 0.20 band, the fee is the same 6920, and the combined total is 40000 + 0 + 2000 + 6920 == 48920"
            - "the boundary is inclusive: a tip of 2500 lands the combined total at 49920 and is accepted, while 3000 reaches 50520 and is refused with the same ERR_CHECK_TOTAL_EXCEEDED"

# Part C — RBAC, cross-cutting layers, consistency model, and the §1.8 exclusion stubs.

  # ===========================================================================
  - section: rbac
    instances:

      - name: assortment_planner_cannot_ring_retail_or_close_a_store_day
        claim_type: peer_roles
        grounds:
          - roles.AssortmentPlanner
          - roles.BoutiqueManager
          - errors[ERR_UNAUTHORIZED]
          - endpoints.POST_/retail-ops/receipts
        distinguishing_aspect: "The role model is peer-to-peer: the planner who owns planogram publication still cannot ring a receipt, and the manager who owns store-day closure cannot publish a planogram, so neither role is a superset of the other."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN and ITM-BOAT-6400 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0090", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: AssortmentPlanner
              captures: { planner_error: $.data.error_id }
          assert:
            - "the planner's ring returns 403 ERR_UNAUTHORIZED"
            - "the manager's ring on the identical payload returns 201, so the refusal is the role check"
            - "symmetric refusal: BoutiqueManager receives 403 ERR_UNAUTHORIZED on POST /retail-ops/planogram-versions/{id}/publish"
            - "the planner shares the clearance-create endpoint with the manager: POST /retail-ops/clearance-schedules returns 201 for both roles"
            - "no receipt was created by the refused attempt: GET /retail-ops/receipts?store_day_id=${day_id} returns 2 rows after the manager's ring and none from the planner's"

      - name: platform_admin_can_configure_but_cannot_operate_the_retail_floor
        claim_type: hierarchical_override
        grounds:
          - roles.PlatformAdmin
          - roles.RetailLead
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "PlatformAdmin is an opaque administrative role with configuration exclusivity but no operational reach, so it cannot ring a receipt or reconcile revenue."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Empty database. A brand and location have been created by PlatformAdmin itself."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "GET /retail-ops/brands"
              payload: {}
              as: PlatformAdmin
              captures: { admin_brand_id: "$.data[0].id" }
          assert:
            - "GET /retail-ops/brands returns 200 for PlatformAdmin with response_type array and at least one row, so the read is shared"
            - "POST /retail-ops/items by PlatformAdmin returns 403 ERR_UNAUTHORIZED, because item creation is exclusive to AssortmentPlanner"
            - "PUT /retail-ops/brands/${brand_id} by PlatformAdmin returns 200 with fiscal_period_status still OPEN and version advancing by one"
            - "PUT /retail-ops/brands/${brand_id} by BoutiqueManager returns 403 ERR_UNAUTHORIZED, so the brand configuration is admin-exclusive"
            - "no role can widen its own access: there is no endpoint that grants a role to a caller"

      - name: shift_backed_roles_require_a_real_shift_identifier
        claim_type: shared_operations
        grounds:
          - roles.Cashier.identity
          - roles.Server.identity
          - endpoints.POST_/retail-ops/guest-checks
        distinguishing_aspect: "Cashier and Server are entity-backed by StaffShift, so their X-User-ID is a shift identifier that must resolve to a persisted shift, while the other roles are opaque operators."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T12:00:00Z. StoreDay 2026-09-21 is OPEN and StaffShift SH-1 is IN_PROGRESS."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-801", start_utc: "2026-09-21T08:00:00Z", end_utc: "2026-09-21T12:00:00Z", workcode: "SERVER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/staff-shifts/${shift_id}/start"
              payload: {}
              as: BoutiqueManager
          trigger:
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "18", restaurant_guest_count: 2, restaurant_subtotal_cents: 3000, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id, presented: $.data.presented_shift_id }
          assert:
            - "the check is created with GuestCheck.${check_id}.presented_shift_id == ${shift_id}, so the acting shift identifier is persisted on the row"
            - "GET /retail-ops/guest-checks?presented_shift_id=${shift_id} returns exactly 1 row, giving the shift-owned read its reachability"
            - "the same endpoint as Cashier with a StaffShift id also returns 201, since Server owns creation exclusively but both roles share the tips endpoint"
            - "Server cannot finalize the check: that call returns 403 ERR_UNAUTHORIZED because finalization is Cashier-exclusive"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: superseding_a_draft_planogram_version_advances_the_parent_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-reshape-stale-planogram-version]
          - endpoints.PUT_/retail-ops/planogram-slots/{id}
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The slot reshape is OCC-guarded on its parent version, so a second reshape carrying the version observed before the first reshape is rejected with 412 while the first succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A DRAFT planogram version with one PLANNED slot exists; the client reads the version at 1 and performs one reshape against it, advancing the parent."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-01T00:00:00Z" }
              as: AssortmentPlanner
              captures: { pog_id: $.data.id, pog_v: $.data.version }
            - call: "POST /retail-ops/planogram-slots"
              payload: { planogram_version_id: "${pog_id}", item_id: "${item_a_id}", slot_position: 1, facings: 2, min_presentation_units: 1 }
              as: AssortmentPlanner
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "PUT /retail-ops/planogram-slots/${slot_id}"
              payload: { expected_planogram_version_version: "${pog_v}", facings: 3 }
              as: AssortmentPlanner
              captures: { reshape_facings: $.data.facings, pog_v_after: $.data.planogram_version_id }
            - call: "PUT /retail-ops/planogram-slots/${slot_id}"
              payload: { expected_planogram_version_version: "${pog_v}", facings: 4 }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the first reshape succeeds with 200 and PlanogramSlot.${slot_id}.facings == 3"
            - "the reshape advances the parent: GET /retail-ops/planogram-versions/${pog_id} reports version 2 while the client's captured ${pog_v} is still 1"
            - "the second reshape carrying the stale ${pog_v} returns 412 ERR_STALE_VERSION, not 409"
            - "PlanogramSlot.${slot_id}.facings is still 3, so the stale write changed nothing"
            - "re-sending with the refreshed parent version succeeds and sets facings to 4"

      - name: dual_variant_revenue_diverges_on_the_same_receipt
        claim_type: dual_variant_calculation
        grounds:
          - calculations.provisional_retail_revenue
          - calculations.final_retail_revenue
          - endpoints.GET_/retail-ops/revenue-attribution
        distinguishing_aspect: "The two revenue variants read from the same receipt row and return different integers, and the attribution read exposes both alongside their delta."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Receipt R-1042-0001 with a single 6400-cent line is RECONCILED at store 1042."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { prov: $.data.provisional_retail_cents, recog: $.data.recognized_retail_cents }
          trigger:
            - call: "GET /retail-ops/revenue-attribution"
              payload: { store_day_id: "${day_id}", variant: "provisional" }
              as: BoutiqueManager
              captures: { attr_prov: $.data.provisional_retail_cents, attr_recog: $.data.recognized_retail_cents, attr_delta: $.data.recognition_delta_cents, attr_count: $.data.receipt_count }
          assert:
            - "Receipt.${receipt_id}.provisional_retail_cents == 6071 and Receipt.${receipt_id}.recognized_retail_cents == 5632"
            - "attr_prov == 6071 and attr_recog == 5632 and attr_delta == -439"
            - "attr_count == 1, so exactly one receipt is in the attribution set"
            - "the two variants differ by 439 cents on byte-identical input, which no single-divisor implementation can reproduce"
            - "requesting the attribution with variant final returns the same three figures, because the delta is carried rather than recomputed"

      - name: store_day_aggregates_bubble_to_the_brand_rollup
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StoreDay.OPEN_to_CLOSED
          - entities.Brand.fields.brand_retail_sales_per_guest_cents
          - endpoints.POST_/retail-ops/store-days/{id}/close
        distinguishing_aspect: "Closing a store day recomputes the brand-level guest-weighted roll-up across all closed days, so a second location's closure changes the brand figure."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Two store days at store 1042 are OPEN, one with 200 guests and 50000 cents of settled retail and one with 200 guests and 100000 cents."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-19T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_a_id: $.data.id, day_a_v: $.data.version }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-20T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_b_id: $.data.id, day_b_v: $.data.version }
            - call: "POST /retail-ops/store-days/${day_a_id}/guest-counts"
              payload: { expected_store_day_version: "${day_a_v}", restaurant_guest_count: 200, restaurant_sales_cents: 2000000, waiting_area_shopper_count: 40, waiting_area_converted_count: 20 }
              as: BoutiqueManager
              captures: { day_a_v2: $.data.version }
            - call: "POST /retail-ops/store-days/${day_b_id}/guest-counts"
              payload: { expected_store_day_version: "${day_b_v}", restaurant_guest_count: 200, restaurant_sales_cents: 2000000, waiting_area_shopper_count: 40, waiting_area_converted_count: 20 }
              as: BoutiqueManager
              captures: { day_b_v2: $.data.version }
          trigger:
            - call: "POST /retail-ops/store-days/${day_a_id}/close"
              payload: { expected_store_day_version: "${day_a_v2}" }
              as: BoutiqueManager
              captures: { rpg_a: $.data.retail_sales_per_guest_cents }
          assert:
            - "with only one closed day and no receipts the brand roll-up is 0, because each closed day's retail sales per guest is 0"
            - "closing the second day leaves the roll-up at 0 as well — the weight is the guest count each day, so two zero-valued days average to 0"
            - "the recompute fires on every close: Brand.${brand_id}.brand_retail_sales_per_guest_cents is written after each call rather than accumulated"
            - "one reconciled receipt of 6071 cents on day A moves day A's metric to round_half_up(6071 / 200) == 30 and the brand roll-up to round_half_up((200*30 + 200*0) / 400) == 15"
            - "the bubble-up is one level only: no further entity consumes the brand roll-up, so the chain terminates there"

      - name: store_day_occupancy_reconciles_after_a_partial_receiving
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Location.fields.staging_free_units
          - entities.Location.fields.backroom_committed_units
          - endpoints.POST_/retail-ops/transfers/{id}/receive
        distinguishing_aspect: "The location's derived posture fields must stay consistent with the last capacity reading and the open commitments, so a partial receiving moves both the occupancy and the commitment release in one step."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Location 1042 has capacity 400, a 40-unit food corridor, a 25-unit cycle-count occupancy and two transfers with declared 40 and 60 both IN_TRANSIT."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/locations/${loc_id}/capacity-readings"
              payload: { store_day_id: "${day_id}", measured_at: "2026-09-21T08:00:00Z", backroom_units: 25, food_storage_units: 0, dated_units: 0, source: "CYCLE_COUNT" }
              as: BoutiqueManager
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 40, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_a_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_a_id}/dispatch"
              payload: {}
              as: RetailLead
              captures: { comm_after_a: $.data.version }
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 60, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_b_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_b_id}/dispatch"
              payload: {}
              as: RetailLead
          trigger:
            - call: "POST /retail-ops/transfers/${tr_a_id}/receive"
              payload: { received_units: 35 }
              as: RetailLead
              captures: { rec_status: $.data.status }
          assert:
            - "before the receiving Location.${loc_id}.backroom_committed_units == 100 and Location.${loc_id}.backroom_occupancy_units == 25, so staging_free_units is 400 - 25 - 100 - 40 == 235"
            - "after receiving 35 of 40 the commitment falls to 60 and the occupancy rises to 60, so Location.${loc_id}.staging_free_units == 400 - 60 - 60 - 40 == 240"
            - "the occupancy comes from the appended reading, not from the declared quantity: received_units 35 is what the reading carries"
            - "Transfer.${tr_a_id}.variance_units == -5 and Transfer.${tr_a_id}.variance_bps == 1250"
            - "Location.${loc_id}.staging_free_units agrees with the last reading's free_units field, so the derived column and the append-only log reconcile"

      - name: credit_memo_is_immutable_once_posted_and_can_be_reversed
        claim_type: idempotency
        grounds:
          - state_machines.ClearanceSchedule.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancellation is idempotent in the negative sense: the second cancel observes CANCELLED and is refused, and no path returns a cancelled schedule to DRAFT."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. ClearanceSchedule CS-1 is DRAFT and has been cancelled."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-09-25T00:00:00Z", end_date: "2026-10-25T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/cancel"
              payload: {}
              as: BoutiqueManager
              captures: { cancelled: $.data.status }
          trigger:
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/cancel"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { activate_error: $.data.error_id }
          assert:
            - "the first cancel returns 200 with ClearanceSchedule.${cs_id}.status == CANCELLED"
            - "the second cancel returns 409 ERR_INVALID_STATE rather than a 200 no-op"
            - "the activate attempt also returns 409 ERR_INVALID_STATE, so CANCELLED is terminal for the forward path"
            - "CANCELLED does not consume a slot: Location.${loc_id}.active_clearance_count is 0"
            - "a replacement schedule for the same item and window is admitted, because the cancelled row is excluded from the overlap rule's non-CANCELLED set"

      - name: brand_recognition_policy_flag_changes_receipt_behaviour
        claim_type: conditional_feature_flags
        grounds:
          - entities.Brand.fields.retail_recognition_policy
          - endpoints.PUT_/retail-ops/brands/{brandId}
          - calculations.final_retail_revenue
        distinguishing_aspect: "The brand's recognition policy is an entity-level feature flag: flipping it from FINAL_ONLY to PROVISIONAL_THEN_FINAL changes whether recognize reports a delta on the same receipt."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Brand BR-1042 is created with policy FINAL_ONLY and Receipt R-1042-0001 is DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { final_only_delta: $.data.recognition_delta_cents, final_only_recognized: $.data.recognized_retail_cents }
          trigger:
            - call: "PUT /retail-ops/brands/${brand_id}"
              payload: { retail_recognition_policy: "PROVISIONAL_THEN_FINAL" }
              as: PlatformAdmin
              captures: { new_policy: $.data.retail_recognition_policy }
          assert:
            - "under FINAL_ONLY the reconcile writes recognized_retail_cents == 5632 and recognition_delta_cents == -439, the provisional posting being skipped rather than zeroed"
            - "the policy flip returns 200 with Brand.${brand_id}.retail_recognition_policy == PROVISIONAL_THEN_FINAL and version advancing by one"
            - "the flip is an override: an unset policy defaults to FINAL_ONLY, so a brand created without it behaves the old way"
            - "a receipt reconciled after the flip still reports both amounts and a delta of -439, so the two policies differ in whether the provisional value is posted as revenue, not in whether it is computed"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: store_day_mutation_is_refused_once_the_day_is_closed
        claim_type: immediate
        grounds:
          - errors[ERR_STORE_DAY_CLOSED]
          - state_machines.StoreDay.OPEN_to_CLOSED
          - entities.StoreDay.fields.day_status
        distinguishing_aspect: "Every day-scoped write is refused after the close, so the closure is visible immediately in the same read that produced it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN with one settled receipt and has then been closed."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { day_v_after_reconcile: $.data.store_day_id }
            - call: "POST /retail-ops/receipts/${receipt_id}/settle"
              payload: {}
              as: RetailLead
              captures: { day_v_after_settle: $.data.store_day_id }
            - call: "POST /retail-ops/store-days/${day_id}/close"
              payload: { expected_store_day_version: "${day_v}" }
              as: BoutiqueManager
              captures: { closed: $.data.day_status }
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 99, restaurant_sales_cents: 990000, waiting_area_shopper_count: 10, waiting_area_converted_count: 5 }
              as: BoutiqueManager
              captures: { gate_error: $.data.error_id }
          assert:
            - "StoreDay.${day_id}.day_status == CLOSED right after the close call"
            - "the guest-count post returns 409 ERR_INVALID_STATE, because the day no longer offers that transition"
            - "a capacity reading against the closed day is also refused, and a new receipt on it returns 409 ERR_STORE_DAY_CLOSED"
            - "the receipt bubbled to CLOSED in the same call: Receipt.${receipt_id}.status == CLOSED with closed_at non-null"
            - "the closure is atomic: retail_sales_cents, retail_sales_per_guest_cents and the brand totals all reflect the final state in the close response itself"

      - name: capacity_reading_is_appended_under_every_receiving_state
        claim_type: eventual
        grounds:
          - endpoints.POST_/retail-ops/locations/{id}/capacity-readings
          - endpoints.GET_/retail-ops/transfers/{id}/capacity-readings
          - entities.BackroomCapacityReading
        distinguishing_aspect: "The reading log is append-only and is reachable from the transfer as well as the location, so the same event is discoverable through two independent paths and neither path mutates it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Transfer TR-1 has been received and then voided, so two readings are attached to it."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/locations/${loc_id}/capacity-readings"
              payload: { store_day_id: "${day_id}", measured_at: "2026-09-21T07:00:00Z", backroom_units: 25, food_storage_units: 0, dated_units: 0, source: "CYCLE_COUNT" }
              as: BoutiqueManager
              captures: { baseline_reading_id: $.data.id }
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 100, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 90 }
              as: RetailLead
              captures: { variance_bps: $.data.variance_bps }
            - call: "POST /retail-ops/transfers/${tr_id}/void-receiving"
              payload: {}
              as: BoutiqueManager
              captures: { void_status: $.data.status }
          trigger:
            - call: "GET /retail-ops/transfers/${tr_id}/capacity-readings"
              payload: {}
              as: BoutiqueManager
              captures: { first_reading_id: "$.data[0].id" }
          assert:
            - "the transfer-scoped read returns exactly 2 rows — assert the array length is 2 and that the first element carries a non-null id — being the receiving reading and its compensating reading"
            - "GET /retail-ops/locations/${loc_id}/capacity-readings?trigger_transfer_id=${tr_id} returns the same 2 rows, so the two paths agree"
            - "GET /retail-ops/locations/${loc_id}/capacity-readings returns 3 rows in total, including the baseline cycle count"
            - "the compensating reading carries backroom_units -90 while the receiving reading carries 90, so the two readings sum to zero"
            - "readings are never mutated: re-reading either list returns identical occupancy_units, free_units and capacity_breach values"

      - name: every_response_reports_the_state_written_in_that_request
        claim_type: immediate
        grounds:
          - response_envelope
          - endpoints.POST_/retail-ops/receipts
          - endpoints.POST_/retail-ops/receipts/{id}/reconcile
        distinguishing_aspect: "The consistency model is immediate: the state a request wrote is reported in that request's own response body, so no follow-up read is required to observe it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN and ITM-BOAT-6400 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id, create_status: $.data.status, create_prov: $.data.provisional_retail_cents }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { reconcile_status: $.data.status, reconcile_recog: $.data.recognized_retail_cents }
          assert:
            - "the create response already carries status DRAFT and provisional_retail_cents 6071, so no follow-up read is needed"
            - "the reconcile response already carries status RECONCILED, recognized_retail_cents 5632 and a stamped reconciled_at"
            - "GET /retail-ops/receipts/${receipt_id} returns the identical values, so the write and the read agree"
            - "the store day's retail_transaction_count moved to 1 in the same create request, visible through GET /retail-ops/store-days/${day_id} without any delay"
            - "the response envelope is uniform: every success carries meta.api_request_id and response_type object, and every list carries response_type array"

  # ===========================================================================
  # §1.8 exclusion stubs — corners already exercised by a named difficulty instance.
  # ===========================================================================
  - section: excluded_corners
    instances:

      - name: corner_guest_count_threshold_boundary
        claim_type: boundary_precision_check
        grounds:
          - validations[priority=8]
          - state_machines.StoreDay.OPEN_to_OPEN
        excluded_because:
          difficulty_instance: guest_count_threshold_crossing_is_inclusive_at_one_hundred_twenty
          rationale: "Asserted as the numeric-threshold half of the named §1.8 boundary instance."

      - name: corner_empty_receipt_set_metric
        claim_type: boundary_precision_check
        grounds:
          - calculations.retail_sales_per_guest
        excluded_because:
          difficulty_instance: empty_receipt_set_pins_retail_sales_per_guest_to_zero_at_close
          rationale: "Asserted as the empty-collection half of the named §1.8 boundary instance."

      - name: corner_receipt_dispute_cycle
        claim_type: invalid_transition
        grounds:
          - state_machines.Receipt.SETTLED_to_DISPUTED
          - state_machines.Receipt.DISPUTED_to_RECONCILED
        excluded_because:
          difficulty_instance: receipt_cyclic_dispute_loop_on_the_receipt_entity
          rationale: "The loop and its round-trip conservation are asserted by the named §1.8 non-linear instance."

      - name: corner_store_day_parallel_dimensions
        claim_type: invalid_transition
        grounds:
          - entities.StoreDay.fields.conversion_gate
          - entities.StoreDay.fields.traffic_state
        excluded_because:
          difficulty_instance: store_day_parallel_dimensions_gate_versus_lifecycle_versus_traffic
          rationale: "The two independent state axes and their joint movement are asserted by the named §1.8 parallel-instance."

      - name: corner_shift_completion_conversion_index_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StaffShift.IN_PROGRESS_to_COMPLETED
          - calculations.derive_waiting_area_conversion_index
        excluded_because:
          difficulty_instance: shift_completion_cascades_three_hops_to_the_conversion_index
          rationale: "The three-hop propagation and its intermediate check write are asserted by the named §1.8 transitive instance."

      - name: corner_clearance_activation_slot_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ClearanceSchedule.DRAFT_to_ACTIVE
          - entities.Location.fields.active_clearance_count
        excluded_because:
          difficulty_instance: clearance_activation_cascades_three_hops_to_the_location_slot_counter
          rationale: "The schedule-to-item-to-location propagation is asserted by the named §1.8 transitive instance."

      - name: corner_gate_versus_state_priority_pair
        claim_type: priority_order
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: receive_rejects_on_state_before_gate_safety
          rationale: "The state-against-safety ordering is asserted by the named §1.8 priority-pair instance."

      - name: corner_safety_versus_existence_priority_pair
        claim_type: priority_order
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: retail_receipt_rejects_on_gate_safety_before_item_existence
          rationale: "The safety-against-existence ordering is asserted by the named §1.8 priority-pair instance."

      - name: corner_shift_overlap_half_open_interval
        claim_type: temporal_overlap
        grounds:
          - validations[priority=19]
        excluded_because:
          difficulty_instance: staff_shift_half_open_interval_admits_back_to_back_shifts
          rationale: "The half-open adjacency semantics are asserted by the named §1.8 overlap instance."

      - name: corner_clearance_window_buffered_interval
        claim_type: temporal_overlap
        grounds:
          - validations[priority=13]
        excluded_because:
          difficulty_instance: clearance_windows_require_a_strictly_positive_buffer_gap
          rationale: "The buffered-window semantics are asserted by the named §1.8 overlap instance."

      - name: corner_void_receiving_units_invariant
        claim_type: compensating_invariant
        grounds:
          - state_machines.Transfer.RECEIVED_to_VOID_RECEIVING
          - entities.Location.fields.backroom_occupancy_units
        excluded_because:
          difficulty_instance: void_receiving_restores_the_conserved_backroom_units
          rationale: "The units-conservation invariant and its restoration are asserted by the named §1.8 compensating instance."

      - name: corner_dispute_resolve_monetary_invariant
        claim_type: compensating_invariant
        grounds:
          - state_machines.Receipt.RECONCILED_to_DISPUTED
          - entities.Brand.fields.recognized_retail_revenue_cents
        excluded_because:
          difficulty_instance: dispute_and_resolve_conserve_recognized_revenue_and_transaction_count
          rationale: "The monetary and counting conservation is asserted by the named §1.8 compensating instance."

      - name: corner_receipt_recognition_dual_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.provisional_retail_revenue
          - calculations.final_retail_revenue
        excluded_because:
          difficulty_instance: revenue_recognition_provisional_versus_final
          rationale: "The divisor divergence on identical receipt lines is asserted by the named §1.8 dual-variant instance."

      - name: corner_fee_flat_versus_marginal_dual_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.combined_check_total
          - calculations.compute_service_fee
        excluded_because:
          difficulty_instance: combined_check_fee_flat_tier_versus_marginal_bands
          rationale: "The fee-rule divergence on the GuestCheck domain is asserted by the named §1.8 dual-variant instance."

      - name: corner_stale_guest_check_version_on_attach
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[receipt-attach-stale-check-version]
        excluded_because:
          difficulty_instance: receipt_writes_depend_on_the_store_day_status_and_the_host_check_status
          rationale: "The attach-time OCC guard is exercised inside the named §1.8 cross-entity instance's setup chain."

      - name: corner_receipt_line_clearing_rounding_order
        claim_type: combinatorial_formula
        grounds:
          - calculations.provisional_retail_revenue
        excluded_because:
          difficulty_instance: per_line_rounding_order_flips_the_receipt_clearing_deduction
          rationale: "The sum-then-divide rounding order and its one-cent alternative are asserted by the named §1.8 combinatorial instance."

      - name: corner_shift_start_store_day_gate_dependency
        claim_type: cross_entity_state_dependency
        grounds:
          - state_machines.StaffShift.SCHEDULED_to_IN_PROGRESS
