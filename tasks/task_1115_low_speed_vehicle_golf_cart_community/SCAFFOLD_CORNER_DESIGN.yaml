  # ===========================================================================
  - section: rbac
    instances:
      - name: inspector_cannot_uphold_violation_forbidden
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer-role isolation: Inspector (owns inspections) cannot uphold a violation — ERR_FORBIDDEN 403; the violation stays FILED."
        test_recipe:
          setup: ["holder + FILED violation"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-RB1" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H RB1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "OFF_ROUTE", points_assessed: 3, fine_cents: 2000, occurred_at: "2026-04-15T00:00:00Z" }, as: EnforcementOfficer, captures: { vio_id: $.data.id } }
          trigger:
            - { call: "POST /api/violations/${vio_id}/uphold", payload: {}, as: Inspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"
            - "violation status remains FILED; holder points_balance remains 0"

      - name: enforcement_officer_cannot_finalize_inspection_forbidden
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer-role isolation in the other direction: EnforcementOfficer (owns violations) cannot finalize an inspection — ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["DRAFT registration with a SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-RB2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H RB2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: EnforcementOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"
            - "inspection remains SCHEDULED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_community_patch_stale_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[community-config-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: a PATCH carrying the pre-update version (captured at creation) succeeds once, then the SAME captured version is stale and the second PATCH is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["community created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-OCC1" }, as: PlatformAdmin, captures: { comm_id: $.data.id, comm_v: $.data.version } }
          trigger:
            - { call: "PATCH /api/communities/${comm_id}", payload: { expected_community_version: "${comm_v}", min_driver_age: 17 }, as: PlatformAdmin, captures: { v2: $.data.version, age2: $.data.min_driver_age } }
            - { call: "PATCH /api/communities/${comm_id}", payload: { expected_community_version: "${comm_v}", min_driver_age: 18 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeds: v2 == 2 and age2 == 17"
            - "err == ERR_STALE_VERSION with http 412 on the replayed stale version"
            - "min_driver_age remains 17 after the rejected PATCH"

      - name: occ_wallet_deposit_stale_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[wallet-deposit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer on PermitHolder.version: deposit with the version captured at verify-eligibility succeeds and bumps the version; replaying the same captured version on a second deposit is rejected ERR_STALE_VERSION 412 and no funds move."
        test_recipe:
          setup: ["ELIGIBLE holder; version captured at verify-eligibility response"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-OCC2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H OCC2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
          trigger:
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 5000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}", captures: { w1: $.data.wallet_balance_cents } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 5000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "w1 == 5000 after the first deposit"
            - "err == ERR_STALE_VERSION with http 412 on the second deposit"
            - "wallet_balance_cents remains 5000 (no double credit)"

      - name: cascade_coverage_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Violation.FILED_to_UPHELD, state_machines.ChargingStation.ONLINE_to_OFFLINE]
        excluded_because:
          difficulty_instance: violation_uphold_cascade_to_route_pass_revocation
          rationale: "N-level cascade chains (violation->points->standing->registration->pass; station->reservation->wallet) are asserted hop-by-hop in the named §1.8 instances."

      - name: dual_variant_coverage_covered
        claim_type: variant_divergence
        grounds: [calculations.annual_registration_fee, calculations.renewal_compliance_score]
        excluded_because:
          difficulty_instance: registration_fee_provisional_vs_finalized_fleet_discount
          rationale: "Variant divergence, variant selection context, and reconciliation deltas are asserted with exact literals in the named §1.8 dual_variant instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: activation_visible_immediately_in_response
        claim_type: satisfaction_pass
        grounds: [complexity_profile.consistency_model, state_machines.VehicleRegistration.DRAFT_to_ACTIVE]
        distinguishing_aspect: "immediate consistency: the activate response itself shows status ACTIVE, paid_cents 19000, valid_from/expiry_date set, and a follow-up read of the holder shows the 81000 wallet — no lag, no recompute endpoint."
        test_recipe:
          setup: ["activation-ready DRAFT registration; wallet 100000"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CONS", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CONS", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CONS", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { st: $.data.status, paid: $.data.paid_cents, vf: $.data.valid_from, exp: $.data.expiry_date } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet: $.data.wallet_balance_cents } }
          assert:
            - "st == ACTIVE and paid == 19000 in the activate response itself"
            - "vf == 2026-05-01T00:00:00Z and exp == 2027-05-01T00:00:00Z (logical clock)"
            - "wallet == 81000 immediately on the follow-up read"
