          - entities.EducationAward.fields.use_deadline_at
          - errors.ERR_AWARD_USE_DEADLINE_PASSED
        distinguishing_aspect: "Metric: timestamp (not minutes). A use at exactly use_deadline_at (2033-10-02T00:00:00Z) is allowed (<= semantics); the same use one second later (2033-10-02T00:00:01Z) is rejected with ERR_AWARD_USE_DEADLINE_PASSED and flips the award to EXPIRED."
        test_recipe:
          setup:
            - "Member A exited SUCCESSFUL at clock 2026-10-02T00:00:00Z -> EducationAward issued_amount 739500, use_deadline_at 2033-10-02T00:00:00Z, version 1."
