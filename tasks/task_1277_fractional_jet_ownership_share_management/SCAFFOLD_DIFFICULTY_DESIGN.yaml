            - "HTTP status 409"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency: different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_gated_by_owner_standing
        grounds:
          - state_machines.BookingRequest.REQUESTED_to_CONFIRMED
          - state_machines.Owner.GOOD_to_DELINQUENT
          - validations[priority=6]
        distinguishing_aspect: |
          Pair BookingRequest→Owner: confirm is valid only when Owner.standing
          == GOOD. DELINQUENT owner (via PAST_DUE invoice) blocks confirm with
          ERR_OWNER_STANDING_BLOCKS even though the booking itself is in a
          valid REQUESTED state and hours suffice.
        test_recipe:
          setup:
            - "Owner DELINQUENT via unpaid issued invoice swept past due; share ACTIVE with 100.00h; booking REQUESTED est 1.00h"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CE1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
