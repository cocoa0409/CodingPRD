      - CodeStrokeCase.${am_id}.status == ELIGIBILITY_DETERMINED (self-loop) with disposition back to PENDING, and CodeStrokeCase.${am_id}.thrombolytic_window_class == WITHIN_3H re-evaluated at 08:30:00Z (40 minutes from last_known_well_at)
- rule_id: transitive_cascade
  instances:
  - name: center_suspension_cascades_agreement_consult_and_neurologist_release
    grounds:
    - 'state_machines.StrokeCenter: PROVISIONAL -> SUSPENDED (four-hop cascade)'
    - 'state_machines.SpokeAgreement: ACTIVE -> SUSPENDED'
    - 'state_machines.TelestrokeConsult: IN_SESSION -> CANCELLED'
    - 'state_machines.Neurologist: IN_CONSULT -> ON_CALL'
    - calculations.ems_routing_posture
    - endpoints.POST /stroke-network/stroke-centers/{id}/suspend
    distinguishing_aspect: 'DEPTH 4, triggered by StrokeCenter PROVISIONAL -> SUSPENDED, and every link is CAUSED BY the previous one rather than by the original request: hop 1 flips the hub''s ems_routing_posture to BYPASS, which removes the hub from the servable set; hop 2 is the SpokeAgreement ACTIVE -> SUSPENDED that follows from an unservable hub; hop 3 is the live TelestrokeConsult IN_SESSION -> CANCELLED that follows from the suspended agreement; hop 4 is the assigned Neurologist''s IN_CONSULT -> ON_CALL release plus the SYSTEM_DETECTED CONSULT_UNFILLED deviation that follows from the cancellation. None of hops 2-4 mentions the hub at all.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; a HUB_PRIMARY centre (certification_status PROVISIONAL, both readiness flags true, ems_routing_posture ROUTINE), a SPOKE centre and an ACTIVE TIER_1_FULL agreement hub -> spoke.
      - One board-certified Neurologist at the hub, ON_CALL, with a GRANTED CONSULT_AND_THROMBOLYSIS proxy credential on that agreement.
      - A CodeStrokeCase at the spoke with imaging complete and one TelestrokeConsult accepted at 08:15:00Z, so the consult is IN_SESSION and the neurologist is IN_CONSULT with active_consult_count 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
