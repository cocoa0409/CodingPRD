  - rule_id: compensating_invariant
    instances:
      - name: page_custody_preserved_by_exclusion_reinstatement
        grounds:
          - calculations.cumulative_file_completeness
          - state_machines.FileComponent.CERTIFIED_to_EXCLUDED
          - state_machines.FileComponent.EXCLUDED_to_COLLECTED
          - entities.CumulativeFile.fields.total_page_count
          - entities.CumulativeFile.fields.included_page_count
          - entities.CumulativeFile.fields.excluded_page_count
          - entities.CumulativeFile.fields.disclosable_page_count
        distinguishing_aspect: |
          Conserved quantity: PAGES. total_page_count == included_page_count + excluded_page_count
          holds at 172 before, during and after the exclusion/reinstatement pair, and the
          reinstatement restores the exact pre-exclusion split 172 / 0 / 166 with exclusion_reason
          cleared — no page drifts into the excluded bucket permanently. An implementation that
          subtracts pages on exclusion instead of moving them leaves total_page_count at 154.
        test_recipe:
          setup:
            - "CA rule; SEND01 in CA; one student with has_iep false."
            - "All three components collected and certified with (120,0), (34,4), (18,2): total_page_count 172, included_page_count 172, excluded_page_count 0, disclosable_page_count 166."
            - "The DISCIPLINE component (18 pages, 2 redacted) is then EXCLUDED with reason OTHER_STUDENT_INFO, moving 18 pages into the excluded bucket."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Vera", last_name: "Nakashima", dob: "2012-01-20", grade_level: 8, has_iep: false, guardian_user_id: "guardian-vera" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/components"
              payload: {}
              as: RecordsOfficer
              captures: { comp_academic_id: "$.data[0].id", comp_health_id: "$.data[1].id", comp_discipline_id: "$.data[2].id" }
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_academic_id}"
              payload: { status: "COLLECTED", page_count: 120, redacted_page_count: 0 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_academic_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_health_id}"
              payload: { status: "COLLECTED", page_count: 34, redacted_page_count: 4 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_health_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "COLLECTED", page_count: 18, redacted_page_count: 2 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "EXCLUDED", exclusion_reason: "OTHER_STUDENT_INFO" }
              as: RecordsOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "COLLECTED" }
              as: RecordsClerk
          assert:
            - "while the component was EXCLUDED, CumulativeFile.${file_id}.total_page_count == 172, included_page_count == 154, excluded_page_count == 18 and disclosable_page_count == 150"
            - "while the component was EXCLUDED, CumulativeFile.${file_id}.certified_component_count == 2 and completeness_pct == 66.7"
            - "after the trigger CumulativeFile.${file_id}.total_page_count == 172"
            - "after the trigger CumulativeFile.${file_id}.included_page_count == 172"
            - "after the trigger CumulativeFile.${file_id}.excluded_page_count == 0"
            - "after the trigger CumulativeFile.${file_id}.disclosable_page_count == 166"
            - "CumulativeFile.${file_id}.total_page_count == CumulativeFile.${file_id}.included_page_count + CumulativeFile.${file_id}.excluded_page_count"
            - "FileComponent.${comp_discipline_id}.status == \"COLLECTED\""
            - "FileComponent.${comp_discipline_id}.page_count == 18"
            - "FileComponent.${comp_discipline_id}.redacted_page_count == 2"
            - "FileComponent.${comp_discipline_id}.exclusion_reason == null"
            - "FileComponent.${comp_discipline_id}.certified_at == null"
            - "CumulativeFile.${file_id}.assembly_status == \"IN_ASSEMBLY\""
            - "CumulativeFile.${file_id}.completeness_pct == 66.7"

      - name: fee_custody_preserved_by_payment_and_waiver
        grounds:
          - validations.priority_87_fee_custody_conserved
          - calculations.inspection_fee_assessment
          - entities.InspectionRequest.fields.fee_collected_cents
          - entities.InspectionRequest.fields.fee_waived_cents
          - entities.InspectionRequest.fields.fee_outstanding_cents
          - errors.ERR_FEE_OVERPAYMENT
        distinguishing_aspect: |
          Conserved quantity: CENTS, a different ledger from the page-custody instance. A 1000-cent
          payment plus a 2878-cent hardship waiver exactly retire a 3878-cent assessment, keeping
          fee_assessed_cents == collected + waived + outstanding after every step, and the next
          single cent is refused with ERR_FEE_OVERPAYMENT rather than driving
          fee_outstanding_cents negative or inflating fee_assessed_cents.
        test_recipe:
          setup:
            - "CA rule; SEND01 in CA; one student with has_iep true whose four components are COLLECTED with (120,0), (34,4), (18,2), (260,10)."
            - "The parent requests copies of all four categories, so fee_assessed_cents is 3878 (base 3378 + certification 500)."
            - "A 1000-cent PAYMENT and a 2878-cent WAIVER are recorded in that order."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
