              payload: { account_id: "${acct_id}", address_line: "8 Treatment", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 4 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
