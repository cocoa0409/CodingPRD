              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_eli_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_dee_id}", term_code: "2026FA", essay_ref: "E-DEE" }
