              as: PermitOfficer
              captures: { perf_b: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_b}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "AMPLIFIED_MUSIC", amplification_requested: true }
              as: Performer
              as_user_id: "${perf_b}"
              captures: { app_b: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_b}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_b}"
            - call: "POST /busking/permit-applications/${app_b}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/auditions"
              payload: { application_id: "${app_b}", scheduled_for: "2026-08-06T10:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { aud_b: "$.data.id" }
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 9, suitability_score: 8, safety_score: 8 }
              as: AuditionPanelist
              as_user_id: "panelist-1"
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 8, suitability_score: 8, safety_score: 7 }
              as: AuditionPanelist
              as_user_id: "panelist-2"
            - call: "POST /busking/auditions/${aud_b}/scores"
              payload: { technical_score: 7, suitability_score: 8, safety_score: 8 }
              as: AuditionPanelist
              as_user_id: "panelist-3"
          trigger:
            - call: "POST /busking/permit-applications/${app_b}/decision"
              payload: { outcome: "APPROVED", decision_note: "Premature approval attempt" }
              as: PermitOfficer
              as_user_id: "officer-beta"
              captures: { err_aud: "$.data.error_id" }
            - call: "POST /busking/auditions/${aud_b}/finalize"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_b}/decision"
              payload: { outcome: "APPROVED", decision_note: "Panel passed" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_b}"
              as: PermitOfficer
              captures: { permit_b: "$.data[0].id" }
          assert:
            - 'The first decision call returns HTTP 409 with data.error_id == "ERR_AUDITION_REQUIRED"'
            - 'At that point PermitApplication.${app_b}.status == "AUDITION_SCHEDULED" and Audition.${aud_b}.status == "SCHEDULED"'
            - 'After finalize: Audition.${aud_b}.status == "PASSED" and Audition.${aud_b}.panel_score == 7.90'
            - 'After finalize: PermitApplication.${app_b}.status == "AUDITION_PASSED"'
            - 'The second decision call returns HTTP 200 with PermitApplication.${app_b}.status == "APPROVED"'
            - 'Permit.${permit_b}.lifecycle_status == "PENDING_FEE"'
            - 'Permit.${permit_b}.amplification_endorsed == true'

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pitch_changeover_buffer_rejects_back_to_back_sessions
        grounds:
          - calculations.pitch_slot_conflict
          - validations[priority=75]
          - errors[ERR_PITCH_SLOT_OVERLAP]
          - entities.Pitch.fields.daily_session_cap
        distinguishing_aspect: |
          Interval semantics A on the PITCH resource: half-open [start_at, end_at) EXPANDED by a
          15-minute changeover buffer on both sides. A booking starting exactly at the previous
          booking's end_at (11:00:00Z) is REJECTED because 11:00 < 11:00 + 15min, while the same
          request shifted to 11:15:00Z is admitted — the seam itself is the occupied space.
        test_recipe:
          setup:
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit with the 5400-cent invoice paid."
            - "Pitch RP-01 has daily_session_cap 3 and max_session_minutes 120 and already holds one RESERVED booking from 2026-08-25T10:00:00Z to 11:00:00Z, so season_minutes_used is 60."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82, amplification_allowed: true, max_session_minutes: 120, daily_session_cap: 3, premium_slots_per_draw: 1 }
              as: PermitOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_a}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "APPROVED", decision_note: "Acoustic act approved" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_a}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
              captures: { pv1: "$.data.version" }
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-25T10:00:00Z", end_at: "2026-08-25T11:00:00Z", expected_permit_version: "${pv1}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { bk1: "$.data.id" }
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
              captures: { pv2: "$.data.version" }
          trigger:
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-25T11:00:00Z", end_at: "2026-08-25T12:00:00Z", expected_permit_version: "${pv2}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { err_adjacent: "$.data.error_id" }
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-25T11:15:00Z", end_at: "2026-08-25T12:15:00Z", expected_permit_version: "${pv2}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { bk2: "$.data.id" }
          assert:
            - 'The 11:00-12:00 request returns HTTP 409 with data.error_id == "ERR_PITCH_SLOT_OVERLAP"'
            - 'The 11:15-12:15 request returns HTTP 201 with SessionBooking.${bk2}.status == "RESERVED"'
            - 'SessionBooking.${bk2}.duration_minutes == 60'
            - 'Permit.${permit_a}.season_minutes_used == 120'
            - 'GET /busking/session-bookings?pitch_id=${p1} returns total_count 2'

      - name: zone_closure_closed_intervals_exhaust_concurrent_capacity
        grounds:
          - calculations.zone_closure_capacity
          - validations[priority=76]
          - errors[ERR_CLOSURE_WINDOW_CONFLICT]
          - entities.Zone.fields.max_concurrent_closures
          - entities.Zone.fields.active_closure_count
          - state_machines.ClosureOrder.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics B on a DIFFERENT resource, the ZONE: CLOSED intervals [starts_at,
          ends_at] with NO buffer and an aggregate capacity of 2. Endpoint-touching closures
          (08:00-12:00 and 12:00-16:00) DO intersect and are both admitted because 1 < 2, and only
          the third order spanning 10:00-14:00 is refused because it intersects both, so 2 is not < 2.
        test_recipe:
          setup:
            - "Zone OT has max_concurrent_closures 2 and holds a single pitch OT-01 with no bookings."
            - "Closure C1 covering 2026-08-10T08:00:00Z to 12:00:00Z is ACTIVE."
            - "Closure C2 covering 2026-08-10T12:00:00Z to 16:00:00Z is ACTIVE — it touches C1 at exactly 12:00:00Z and, because the intervals are closed, counts as intersecting."
            - "Closure C3 covering 2026-08-10T10:00:00Z to 14:00:00Z sits in DRAFT."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Old Town", code: "OT", base_noise_cap_db: 72, evening_start_minute: 1020, quiet_hours_start_minute: 1260, quiet_hours_end_minute: 480, weekend_noise_bonus_db: 0, evening_penalty_db: 8, max_concurrent_closures: 2 }
              as: PermitOfficer
              captures: { z2: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z2}", code: "OT-01", tier: "STANDARD", noise_cap_db: 70, amplification_allowed: false, max_session_minutes: 120, daily_session_cap: 2, premium_slots_per_draw: 1 }
              as: PermitOfficer
              captures: { p4: "$.data.id" }
            - call: "POST /busking/closure-orders"
              payload: { zone_id: "${z2}", reason: "SPECIAL_EVENT", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { c1: "$.data.id" }
            - call: "POST /busking/closure-orders/${c1}/activate"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/closure-orders"
              payload: { zone_id: "${z2}", reason: "PARADE", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T16:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { c2: "$.data.id" }
            - call: "POST /busking/closure-orders/${c2}/activate"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/closure-orders"
              payload: { zone_id: "${z2}", reason: "CONSTRUCTION", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T14:00:00Z" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { c3: "$.data.id" }
          trigger:
            - call: "POST /busking/closure-orders/${c3}/activate"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
              captures: { err_cap: "$.data.error_id" }
          assert:
            - 'ClosureOrder.${c1}.status == "ACTIVE"'
            - 'ClosureOrder.${c2}.status == "ACTIVE"'
            - 'The C3 activation returns HTTP 409 with data.error_id == "ERR_CLOSURE_WINDOW_CONFLICT"'
            - 'ClosureOrder.${c3}.status == "DRAFT"'
            - 'Zone.${z2}.active_closure_count == 2'
            - 'Pitch.${p4}.availability_status == "CLOSED"'

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancel_restores_permit_season_minutes_to_pre_booking_value
        grounds:
          - calculations.permit_minute_ledger
          - state_machines.SessionBooking.RESERVED_to_CANCELLED_BY_PERFORMER
          - entities.Permit.fields.season_minutes_used
          - entities.SessionBooking.fields.duration_minutes
        distinguishing_aspect: |
          Conserved quantity 1 is TIME: Permit.season_minutes_used must equal
          SUM(SessionBooking.duration_minutes) over statuses {RESERVED, RELOCATED, COMPLETED}. The
          forward create debits exactly 90 and the compensating cancel credits exactly 90, returning
          the field to its pre-booking value of 0 with zero drift.
        test_recipe:
          setup:
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit with the 5400-cent invoice paid and season_minutes_used 0."
            - "Pitch RP-01 is open and free for 2026-08-25."
            - "The clock sits at the 2026-08-01T00:00:00Z default, well before the booking start."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/pitches"
              payload: { zone_id: "${z1}", code: "RP-01", tier: "STANDARD", noise_cap_db: 82, amplification_allowed: true, max_session_minutes: 120, daily_session_cap: 3, premium_slots_per_draw: 1 }
              as: PermitOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_a}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "APPROVED", decision_note: "Acoustic act approved" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_a}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
              captures: { pv1: "$.data.version" }
          trigger:
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p1}", start_at: "2026-08-25T10:00:00Z", end_at: "2026-08-25T11:30:00Z", expected_permit_version: "${pv1}", amplification_planned: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { bk1: "$.data.id" }
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
            - call: "POST /busking/session-bookings/${bk1}/cancel"
              payload: { reason: "Act pulled out of the festival" }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
          assert:
            - 'SessionBooking.${bk1}.duration_minutes == 90'
            - 'Immediately after the create: Permit.${permit_a}.season_minutes_used == 90'
            - 'SessionBooking.${bk1}.status == "CANCELLED_BY_PERFORMER"'
            - 'Immediately after the cancel: Permit.${permit_a}.season_minutes_used == 0'
            - 'Permit.${permit_a}.closure_credit_minutes == 0'
            - 'Permit.${permit_a}.lifecycle_status == "ACTIVE"'
            - 'Permit.${permit_a}.compliance_status == "CLEAR"'

      - name: full_refund_on_revocation_restores_net_fees_paid_to_zero
        grounds:
          - calculations.revocation_refund
          - calculations.permit_money_ledger
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.FeeInvoice.PAID_to_REFUNDED
          - entities.Permit.fields.net_fees_paid_cents
          - entities.FeeInvoice.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity 2 is MONEY, a different type from the minute ledger:
          Permit.net_fees_paid_cents must equal SUM(amount_paid_cents) - SUM(refunded_cents). The
          forward payment moves it 0 -> 5400 and the compensating FULL_REFUND revocation moves it
          5400 -> 0, leaving amount_paid_cents 5400 and refunded_cents 5400 on the invoice with no
          rounding drift.
        test_recipe:
          setup:
            - "Performer Ada's 2026 application is approved at the 2026-08-01T00:00:00Z default clock, minting a PRORATED INITIAL invoice of 5400 cents (months_covered 5, coverage_start_month 8)."
            - "The invoice has been paid in full, so the permit is ACTIVE and net_fees_paid_cents is 5400."
            - "The clock has moved to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
              captures: { z1: "$.data.id" }
            - call: "POST /busking/performers"
              payload: { legal_name: "Ada Vance", stage_name: "Ada V", email: "ada@example.org", act_type: "ACOUSTIC_MUSIC" }
              as: PermitOfficer
              captures: { perf_a: "$.data.id" }
            - call: "POST /busking/permit-applications"
              payload: { performer_id: "${perf_a}", requested_zone_id: "${z1}", season_year: 2026, requested_act_type: "ACOUSTIC_MUSIC", amplification_requested: false }
              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "POST /busking/permit-applications/${app_a}/decision"
              payload: { outcome: "APPROVED", decision_note: "Acoustic act approved" }
              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_a}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PermitOfficer
          trigger:
            - call: "POST /busking/permits/${permit_a}/revoke"
              payload: { reason: "Permit surrendered by the holder", refund_mode: "FULL_REFUND" }
              as: PermitOfficer
              as_user_id: "officer-alpha"
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
          assert:
            - 'Before the revoke: Permit.${permit_a}.net_fees_paid_cents == 5400'
            - 'FeeInvoice.${inv_a}.amount_due_cents == 5400'
            - 'FeeInvoice.${inv_a}.amount_paid_cents == 5400'
            - 'FeeInvoice.${inv_a}.months_covered == 5'
            - 'FeeInvoice.${inv_a}.coverage_start_month == 8'
            - 'After the revoke: FeeInvoice.${inv_a}.refunded_cents == 5400'
            - 'After the revoke: FeeInvoice.${inv_a}.status == "REFUNDED"'
            - 'After the revoke: Permit.${permit_a}.net_fees_paid_cents == 0'
            - 'After the revoke: Permit.${permit_a}.lifecycle_status == "REVOKED"'
