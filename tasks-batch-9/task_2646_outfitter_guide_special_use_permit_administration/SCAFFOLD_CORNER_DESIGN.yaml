            - call: "POST /osup/prospectuses/${p1}/award"
              payload: { expected_use_area_version: "${ua_ver}" }
              as: AuthorizedOfficer
            - call: "POST /osup/prospectuses/${p1}/close-submissions"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/prospectuses/${p1}/responses"
              payload: { application_id: "${app_a}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/prospectuses/${p1}/award"
              payload: { expected_use_area_version: "${ua_ver}" }
