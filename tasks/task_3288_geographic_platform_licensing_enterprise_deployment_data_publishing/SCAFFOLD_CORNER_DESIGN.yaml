  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: grant_transition_occ_roundtrip
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[grant-activate-stale-org]"]
        distinguishing_aspect: "OCC roundtrip on the grant transition endpoint: activate with the version observed at creation succeeds (org v1) and increments Organization.version to 2; a suspend replaying the SAME observed version is 412, and a suspend with the fresh version succeeds."
        test_recipe:
          setup: ["Base chain through org activation; grant PENDING_ACTIVATION; org version captured at creation."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org]
          trigger:
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "SUSPENDED", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
              captures: { err_stale: $.data.error_id }
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: LicenseAdmin
              captures: { org_v_fresh: $.data.version }
            - call: "POST /geo-orgs/license-grants/${grant_named_id}/transition"
              payload: { target_status: "SUSPENDED", expected_organization_version: "${org_v_fresh}" }
              as: LicenseAdmin
          assert:
            - "activate succeeds; Organization.version becomes ${org_v0} + 1"
            - "err_stale == ERR_STALE_VERSION (412)"
            - "the fresh-version suspend succeeds and status == SUSPENDED"

      - name: duplicate_username_within_org_rejected
        claim_type: multi_tenancy
        grounds: ["validations[priority=29]", errors.ERR_DUPLICATE_VALUE]
        distinguishing_aspect: "Tenant-scoped uniqueness: username 'ada' is rejected in the same org but accepted in a different org — uniqueness is per-tenant, not global."
