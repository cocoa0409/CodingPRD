              captures: { lic_s2_v1: $.data.version }
            - call: "POST /licensing/licensees/${lic_s2}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_s2_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_s2: $.data.id }
