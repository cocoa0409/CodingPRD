            - call: "POST /slate/production-slots/${slot}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/titles/${t1}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 3, min_minutes_between_airings: 1440 }
              as: ProgrammingExec
              captures: { block_id: $.data.id }
            - call: "POST /slate/program-blocks/${block_id}/publish"
              payload: {}
              as: ProgrammingExec
              captures: { bv: $.data.version }
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${t1}", air_start: "2027-11-05T00:00:00Z", kind: "PREMIERE", expected_block_version: "${bv}" }
              as: ProgrammingExec
              captures: { air1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/air-slots/${air1}/mark-aired"
              payload: {}
              as: ProgrammingExec
            - call: "POST /slate/sponsorships"
              payload: { season_id: "${season_id}", advertiser: "BigBrand", season_cpm_cents: 2000, viewership_thousands: 20 }
              as: AdSalesRep
              captures: { s_big: $.data.id }
            - call: "POST /slate/sponsorships"
              payload: { season_id: "${season_id}", advertiser: "SmallBrand", season_cpm_cents: 1000, viewership_thousands: 10 }
              as: AdSalesRep
              captures: { s_small: $.data.id }
            - call: "POST /slate/seasons/${season_id}/archive"
              payload: {}
              as: ProgrammingExec
          trigger:
            - call: "POST /slate/sponsorships/${s_big}/reconcile"
              payload: {}
              as: AdSalesRep
              captures: { err_big: $.data.error_id }
            - call: "POST /slate/sponsorships/${s_small}/reconcile"
              payload: {}
              as: AdSalesRep
          assert:
            - "err_big == ERR_AD_BUDGET_EXCEEDED with http 402 (actual 42000 > budget 30000)"
            - "after the failed reconcile: Studio.${studio_id}.ad_budget_cents == 30000 and Sponsorship.${s_big}.status == BOOKED (failed action conserves the budget)"
            - "after the small reconcile: Sponsorship.${s_small}.status == RECONCILED, actual_cost_cents == 11000 (1000*(10+1 premieres))"
            - "Studio.${studio_id}.ad_budget_cents == 30000 - 11000 == 19000 (budget_before - sum(reconciled actuals))"
