            - { call: "GET /servicer-notifications", payload: {}, as: Servicer, as_user_id: "SVC-100", captures: { s_total: "$.meta.total_count", s_ref: "$.data[0].servicer_ref" } }
            - { call: "GET /servicer-notifications", payload: {}, as: ClearinghouseOps, captures: { ops_total: "$.meta.total_count" } }
          assert:
            - "captured s_total == 1 and s_ref == SVC-100"
            - "captured ops_total == 2"

      - name: rbac_analyst_list_scoped_to_own_datasets
        claim_type: role_scoping
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "GET /institutions/{id}/research-datasets as a ResearchAnalyst returns only datasets created by that analyst id: analyst-a sees DS1 but not analyst-b's DS2."
        test_recipe:
          setup:
            - "One institution; DS1 created by analyst-a, DS2 by analyst-b"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
            - { call: "POST /research-datasets", payload: { scope_institution_id: "${inst_id}", cohort_term_start: "2026-09-01", cohort_term_end: "2026-12-15" }, as: ResearchAnalyst, as_user_id: "analyst-a", captures: { ds_a: "$.data.id" } }
            - { call: "POST /research-datasets", payload: { scope_institution_id: "${inst_id}", cohort_term_start: "2026-09-01", cohort_term_end: "2026-12-15" }, as: ResearchAnalyst, as_user_id: "analyst-b", captures: { ds_b: "$.data.id" } }
          trigger:
            - { call: "GET /institutions/${inst_id}/research-datasets", payload: {}, as: ResearchAnalyst, as_user_id: "analyst-a", captures: { a_total: "$.meta.total_count", a_first: "$.data[0].id" } }
            - { call: "GET /institutions/${inst_id}/research-datasets", payload: {}, as: ClearinghouseOps, captures: { ops_total: "$.meta.total_count" } }
          assert:
            - "captured a_total == 1 and a_first == ${ds_a}"
            - "captured ops_total == 2"

  # ---------------------------------------------------------------------------
  # Section: complexity_layers — optimistic_concurrency, scheduled_actions;
  # cascading_side_effects and dual_variant_calculation are §1.8-covered (stubs)
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_stale_student_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[directive-create-stale-student]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential directive creates carrying the same observed student version: the first succeeds (version 1 -> 2), the second with the now-stale expected_student_version 1 fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Compliant institution, OPEN period, student S1 at version 1"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v: "$.data.version" } }
          trigger:
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "FULL_BLOCK", effective_from: "2026-01-01", expected_student_version: "${st_v}" }, as: ClearinghouseOps, captures: { d1: "$.data.id", d1_status: "$.data.status" } }
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "RESEARCH_OPT_OUT", effective_from: "2026-01-01", expected_student_version: "${st_v}" }, as: ClearinghouseOps, captures: { err: "$.data.error_id" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v2: "$.data.version" } }
          assert:
            - "captured st_v == 1 and d1_status == ACTIVE (correct version succeeds)"
            - "captured err == ERR_STALE_VERSION (reused version 1 after the first write bumped it to 2)"
            - "captured st_v2 == 2 (exactly one mutation landed)"

      - name: occ_stale_period_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[file-upload-stale-period]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Upload bumps the period's upload_count (hence version): a second upload still carrying the pre-upload expected_reporting_period_version fails with 412 ERR_STALE_VERSION, and succeeds once the client re-reads the current version."
        test_recipe:
          setup:
            - "Compliant institution, Fall period OPEN at 2026-11-15 (version 2); F1 uploaded with expected version 2"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { f1: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S2", full_name: "Second Student", date_of_birth: "2004-06-01", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { err: "$.data.error_id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v2: "$.data[0].version", p_uploads: "$.data[0].upload_count" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v2}", rows: [ { student_ref: "S2", full_name: "Second Student", date_of_birth: "2004-06-01", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { f2: "$.data.id" } }
          assert:
            - "captured period_v == 2 (1 at create + 1 on SCHEDULED->OPEN)"
            - "captured err == ERR_STALE_VERSION (version advanced to 3 when F1 was uploaded)"
            - "captured period_v2 == 3 and p_uploads == 1"
            - "f2 create with the refreshed version succeeds (201)"

      - name: scheduled_default_clock_is_pinned
        claim_type: scheduled_action
        grounds:
          - entities.ParticipationAgreement.fields.status
          - entities.ReportingPeriod.fields.status
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: an agreement with effective_from 2026-09-01 is created ACTIVE and a period with submission_opens_at 2026-09-01 is created OPEN."
        test_recipe:
          setup:
            - "Empty database; no clock call is ever made"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
          trigger:
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-09-01", effective_to: "2027-06-30" }, as: ClearinghouseOps, captures: { ag_status: "$.data.status" } }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-09-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { p_status: "$.data.status" } }
          assert:
            - "captured ag_status == ACTIVE (effective_from 2026-09-01 <= default now < effective_to)"
            - "captured p_status == OPEN (default now >= submission_opens_at 2026-09-01)"

      - name: cascade_correction_to_servicer_feed
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CorrectionCase.FILED_to_APPLIED
        excluded_because:
          difficulty_instance: correction_apply_cascades_to_servicer_feed_and_standing
          rationale: "The depth-3 correction cascade (entry supersede -> notification supersede/generate -> standing rewrite) is asserted hop-by-hop by the named §1.8 instance."

      - name: cascade_agreement_expiry_to_refunds
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ParticipationAgreement.ACTIVE_to_EXPIRED
        excluded_because:
          difficulty_instance: agreement_expiry_cascades_suspension_and_request_cancellation
          rationale: "The clock-driven expiry cascade (institution suspension -> request cancellation -> balance refund) is asserted hop-by-hop by the named §1.8 instance; the ops-triggered variant is covered here by ops_suspend_cancels_quoted_and_paid_requests."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.enrollment_status_determination
          - calculations.research_cohort_metrics
        excluded_because:
          difficulty_instance: enrollment_status_census_vs_report_date
          rationale: "Both dual-variant domains (entry status codes and research cohort rates) are covered by the named §1.8 instance and research_cohort_census_vs_adjusted_denominator."

  # ---------------------------------------------------------------------------
  # Section: consistency_model — immediate visibility of mutations
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds:
          - state_machines.EnrollmentFile.UPLOADED_to_CERTIFIED
          - entities.ReportingPeriod.fields.outcome
        distinguishing_aspect: "Immediate consistency: the certify RESPONSE already carries status CERTIFIED with certified_at 2026-11-15T00:00:00Z and late_submission false, and a subsequent GET returns identical values; the period's outcome is already ON_TIME in the same instant (no lag)."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall period, one uploaded file at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}", captures: { r_status: "$.data.status", r_cert: "$.data.certified_at", r_late: "$.data.late_submission" } }
            - { call: "GET /enrollment-files/${file_id}", payload: {}, as: ClearinghouseOps, captures: { g_status: "$.data.status", g_cert: "$.data.certified_at", g_late: "$.data.late_submission" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { p_outcome: "$.data[0].outcome" } }
          assert:
            - "captured r_status == CERTIFIED and r_cert == 2026-11-15T00:00:00Z and r_late == false (mutation visible in the same response)"
            - "captured g_status == CERTIFIED and g_cert == 2026-11-15T00:00:00Z and g_late == false (immediate read agrees)"
            - "captured p_outcome == ON_TIME (certification side effect applied synchronously)"
