  - rule_id: resource_temporal_overlap
    instances:
      - name: event_window_half_open_adjacency
        grounds:
          - "validations[priority=11]"
          - entities.EarlyAccessEvent.fields.starts_at
          - "errors[ERR_EVENT_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Half-open interval semantics on EarlyAccessEvent (resource: the lot's
          event calendar): a new event whose starts_at equals the prior event's
          ends_at is accepted (touching allowed), while a one-minute-overlap
          start is rejected.
        test_recipe:
          setup:
            - "Lot PRICED (events require PRICED or ON_SALE)"
            - "Event A [2026-09-02T10:00, 2026-09-02T12:00) already scheduled"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
