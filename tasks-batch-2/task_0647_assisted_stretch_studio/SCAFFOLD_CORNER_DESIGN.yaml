# =============================================================================
# task_0647_assisted_stretch_studio — §1.9 Scaffold Corner Design
# Breadth probe over claim-extraction-guide sections against this scaffold's
# §1.1-§1.7 surface. Structured setup_api_calls; literals locked; clock default
# 2026-04-01T00:00:00Z. excluded_because stubs cite §1.8 instance names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_location_returns_defaults
        claim_type: Defaults
        grounds:
          - entities.Location.fields.no_show_fee_cents
          - entities.Location.fields.cancel_window_hours
          - entities.Location.fields.status
        distinguishing_aspect: "POST /locations with only name applies defaults: status=OPEN, no_show_fee_cents=5000, late_cancel_pct=0.50, cancel_window_hours=12, flexologist_buffer_minutes=15, open=540, close=1260."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { name: "Defaults" }
              as: StudioManager
              captures: { loc: $.data.id, st: $.data.status, fee: $.data.no_show_fee_cents }
          assert:
            - "Location.${loc}.status == OPEN"
            - "Location.${loc}.no_show_fee_cents == 5000"
            - "Location.${loc}.cancel_window_hours == 12"
            - "Location.${loc}.flexologist_buffer_minutes == 15"

      - name: get_member_not_found_404
        claim_type: Not Found
        grounds:
          - entities.Member.fields.id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /members/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_service_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Service.fields.kind
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /services omitting required 'kind' returns ERR_VALIDATION (400); no Service is created."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L" }
              as: StudioManager
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Bad", duration_minutes: 50, credit_cost: 1, list_price_cents: 6000 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_service_invalid_enum_kind
        claim_type: Type Constraints
        grounds:
          - entities.Service.fields.kind
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /services with kind='MASSAGE' (not in {ASSISTED_STRETCH,RECOVERY,INTRO}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L2" }
              as: StudioManager
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "X", kind: "MASSAGE", duration_minutes: 50, credit_cost: 1, list_price_cents: 6000 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: member_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Member.fields.id
          - entities.Member.fields.strike_score
          - entities.Member.fields.intro_completed
        distinguishing_aspect: "POST /members ignores any client-sent id/strike_score; server sets status=ACTIVE, intro_completed=false, mobility_tier=null, strike_score=0, and a fresh UUID id."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L3" }
              as: StudioManager
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "New", email: "new@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id, ic: $.data.intro_completed, ss: $.data.strike_score }
          assert:
            - "Member.${mem}.intro_completed == false"
            - "Member.${mem}.strike_score == 0"
            - "Member.${mem}.mobility_tier == null"
            - "Member.${mem}.status == ACTIVE"

      - name: addon_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AddOn.fields.id
          - entities.AddOn.fields.voided
        distinguishing_aspect: "AddOn has common_fields:false — it carries only id+created_at (no version) and has no update endpoint; it is only mutated by cascade (voided=true)."
        test_recipe:
          setup: ["A booking in REQUESTED state with one attached add-on."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Ad", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "F", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "50m", kind: "ASSISTED_STRETCH", duration_minutes: 50, credit_cost: 1, list_price_cents: 6000 }
              as: StudioManager
              captures: { svc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Ad", email: "ad@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 10, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T08:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T08:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-20T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/add-ons"
              payload: { kind: "PERCUSSION", price_cents: 1500 }
              as: FrontDesk
              captures: { addon: $.data.id, vd: $.data.voided }
          assert:
            - "AddOn.${addon}.voided == false"
            - "AddOn.${addon}.kind == PERCUSSION"

  # ===========================================================================
