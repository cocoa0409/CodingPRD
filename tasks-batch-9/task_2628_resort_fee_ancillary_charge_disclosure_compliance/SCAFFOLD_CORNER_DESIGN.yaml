          - roles.ComplianceOfficer.shared_operations
          - endpoints[POST /fee-programs/{id}/fees]
        distinguishing_aspect: "A shared operation must produce a byte-identical row whichever of the two permitted roles calls it — the fee inventory records no author on the Fee itself, so the only place a role difference could surface is the parent program's authored_by_user_id, which the fee create never touches."
