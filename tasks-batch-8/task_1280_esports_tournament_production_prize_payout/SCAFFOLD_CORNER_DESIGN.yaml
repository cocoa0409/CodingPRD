# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Esports Tournament Production & Prize Payout
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: player_create_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.Player", "endpoints.POST_/api/players"]
        distinguishing_aspect: "POST /api/players with required inputs returns 201; system fields id (prefix-free UUID), created_at, updated_at, version==1 are server-minted; eligibility_status defaults to ELIGIBLE; active_strike_count computes to 0; ac_strike_events defaults to []."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/players", payload: { handle: "solo", date_of_birth: "1999-12-31", region: EU }, as: OrganizerAdmin, captures: { p: $.data.id } }
          assert:
            - "status 201; Player.${p}.eligibility_status == ELIGIBLE, active_strike_count == 0, ac_strike_events == [], version == 1"
            - "Player.${p}.id matches UUID format with no type prefix; created_at has three fractional digits and equals the logical clock 2026-08-01T00:00:00.000Z"

      - name: player_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Player.fields.region", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input region is rejected with ERR_VALIDATION (400) and no player is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/players", payload: { handle: "solo", date_of_birth: "1999-12-31" }, as: OrganizerAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION with http 400"

      - name: player_duplicate_handle_returns_handle_taken
        claim_type: type_constraints
        grounds: ["validations[priority=8]", "errors[ERR_HANDLE_TAKEN]"]
        distinguishing_aspect: "Second player with an identical handle is rejected with ERR_HANDLE_TAKEN (409); uniqueness is global across players."
        test_recipe:
          setup: ["player 'solo' exists"]
          setup_api_calls:
            - { call: "POST /api/players", payload: { handle: "solo", date_of_birth: "1999-12-31", region: EU }, as: OrganizerAdmin }
          trigger:
            - { call: "POST /api/players", payload: { handle: "solo", date_of_birth: "2001-01-01", region: NA }, as: OrganizerAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HANDLE_TAKEN with http 409"

      - name: registration_create_with_bad_tournament_fk_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Registration.fields.tournament_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a registration whose tournament_id does not exist fails with ERR_NOT_FOUND (404) — FK integrity is enforced on body references."
        test_recipe:
          setup: ["one player p1 exists"]
          setup_api_calls:
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/registrations", payload: { tournament_id: "00000000-0000-0000-0000-000000000000", team_name: "Ghost", manager_contact_email: "g@x.gg", region_rank_points: 1, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: match_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/api/matches/{id}"]
        distinguishing_aspect: "Reading a match by a non-existent UUID returns ERR_NOT_FOUND (404), not a 500 or empty body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/matches/00000000-0000-0000-0000-000000000000", as: TournamentDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: roster_slot_lock_computes_age_and_minor_flag
        claim_type: computed_fields
        grounds: ["calculations.roster_lock_age", "entities.RosterSlot.fields.is_minor"]
        distinguishing_aspect: "RosterSlot.age_at_lock_years and is_minor are null before the tournament lock and are computed at lock: a player born 2010-06-15 is 16 and minor at the 2026-08-10 lock; client-supplied values for these fields are ignored."
        test_recipe:
          setup:
            - "2-team tournament with both registrations APPROVED; r1's starter p1 born 2010-06-15"
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Age Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2010-06-15", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}", captures: { slot1: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
          trigger:
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
          assert:
            - "RosterSlot.${slot1}: age_at_lock_years was null before lock and == 16 after; is_minor == true"
            - "Registration.${r1}.status == LOCKED"

  - section: state_machines
    instances:
      - name: registration_appeal_cycle_completes_once
        claim_type: valid_transition
        grounds: ["state_machines.Registration.REJECTED_to_APPEALED", "state_machines.Registration.APPEALED_to_APPROVED"]
        distinguishing_aspect: "The cyclic appeal loop works end-to-end: SUBMITTED -> REJECTED -> APPEALED -> APPROVED, with appeal_used flipped true on the cycle entry."
        test_recipe:
          setup: ["tournament REGISTRATION_OPEN; registration r1 SUBMITTED with valid roster"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Appeal Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/registrations/${r1}/review", payload: { action: REJECT, reason: "incomplete eligibility paperwork" }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r1}/appeal", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
          assert:
            - "status sequence: SUBMITTED -> REJECTED -> APPEALED -> APPROVED"
            - "Registration.${r1}.appeal_used == true after the appeal"
            - "Registration.${r1}.version increments by 1 on each transition (4 total mutations after creation: submit, reject, appeal, approve)"

      - name: registration_second_appeal_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=8]", "errors[ERR_APPEAL_EXHAUSTED]"]
        distinguishing_aspect: "After the appeal cycle completes with a second REJECTED, appeal_used == true blocks any further appeal with ERR_APPEAL_EXHAUSTED — the cycle is single-shot."
        test_recipe:
          setup: ["registration r1 REJECTED after having already consumed its appeal (APPEALED -> REJECTED)"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Appeal2 Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: REJECT }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r1}/appeal", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: REJECT }, as: TournamentDirector }
          trigger:
            - { call: "POST /api/registrations/${r1}/appeal", payload: {}, as: TeamManager, as_user_id: "${r1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPEAL_EXHAUSTED; Registration.${r1}.status == REJECTED"

      - name: registration_unreviewed_at_lock_auto_rejected
        claim_type: side_effect_execution
        grounds: ["state_machines.Registration.SUBMITTED_to_REJECTED", "state_machines.Tournament.REGISTRATION_OPEN_to_REGISTRATION_LOCKED"]
        distinguishing_aspect: "The lock cascade is conditional on child state: APPROVED registrations become LOCKED while still-SUBMITTED ones are auto-REJECTED (not locked, not left behind)."
        test_recipe:
          setup: ["tournament REGISTRATION_OPEN; r1 APPROVED; r2 SUBMITTED but never reviewed; clock at 2026-08-10 (closes_at reached)"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Lock Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
          trigger:
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
          assert:
            - "Registration.${r1}.status == LOCKED"
            - "Registration.${r2}.status == REJECTED (unreviewed at lock)"

      - name: match_confirm_before_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Match", "errors[ERR_INVALID_MATCH_STATUS]"]
        distinguishing_aspect: "confirm-result against a SCHEDULED match (result not yet reported) is rejected with ERR_INVALID_MATCH_STATUS; the transition set is strictly ordered."
        test_recipe:
          setup: ["2-team tournament SEEDED; final mf SCHEDULED on server s1"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Order Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/fund", payload: { amount_cents: 100000 }, as: OrganizerAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: TournamentDirector, captures: { tv: $.data.version } }
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector }
            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: NA }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { mf: "$.data[0].id" } }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T10:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
          trigger:
            - { call: "POST /api/matches/${mf}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_MATCH_STATUS; Match.${mf}.status == SCHEDULED and confirmed_by_user_id == null"

      - name: match_terminal_lockdown_report_on_confirmed
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Match", "errors[ERR_INVALID_MATCH_STATUS]"]
        distinguishing_aspect: "CONFIRMED is terminal for result flow: a second report-result on a CONFIRMED match is rejected with ERR_INVALID_MATCH_STATUS and scores are unchanged."
        test_recipe:
          setup: ["2-team tournament IN_PROGRESS; final mf CONFIRMED 13-7"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Lockdown Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/fund", payload: { amount_cents: 100000 }, as: OrganizerAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: TournamentDirector, captures: { tv: $.data.version } }
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector }
            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: NA }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { mf: "$.data[0].id" } }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T10:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: IN_PROGRESS }, as: TournamentDirector }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: OPEN_LOBBY }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: START }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/report-result", payload: { home_score: 13, away_score: 7 }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2" }
          trigger:
