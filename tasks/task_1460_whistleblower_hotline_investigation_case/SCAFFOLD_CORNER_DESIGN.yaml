          rationale: "Closed-interval touch vs one-second-disjoint pair asserted by the named §1.8 instance."

      - name: legal_hold_freeze_gate_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_LEGAL_HOLD_FREEZE]'
        excluded_because:
          difficulty_instance: closure_entry_gated_by_active_legal_hold
          rationale: "Freeze gate on CLOSURE_READY entry asserted by the named §1.8 instance."

      - name: sod_triager_override_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_SOD_TRIAGER_INELIGIBLE]'
        excluded_because:
          difficulty_instance: assignment_freeze_vs_sod_priority
          rationale: "Triager-override SoD participates as the shadowed error in the named §1.8 priority instance; its direct assertion would duplicate the same setup."

  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: reporter_cannot_list_cases
        claim_type: role_denial
        grounds:
          - 'roles[HotlineReporter]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "HotlineReporter is excluded from every staff list endpoint."
        test_recipe:
          setup: ["one case exists"]
          setup_api_calls:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-rb", captures: { key1: $.data.reporter_access_key } }
          trigger:
            - { call: "GET /hotline/cases", as: HotlineReporter, as_user_id: "${key1}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: investigator_cannot_triage
        claim_type: role_denial
        grounds:
          - 'roles[Investigator]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "Triage is IntakeSpecialist-exclusive; an Investigator role call is denied at priority 2."
        test_recipe:
          setup: ["inv staff; one RECEIVED case"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-it", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: intake_cannot_review_determination
        claim_type: role_denial
        grounds:
          - 'roles[IntakeSpecialist]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "Determination review is ComplianceOfficer-exclusive (approval-chain step separation)."
        test_recipe:
          setup: ["intake staff; attempt review on a placeholder id — role check fires before existence"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
          trigger:
            - { call: "POST /hotline/determinations/33333333-3333-3333-3333-333333333333/review", payload: { decision: APPROVE, review_notes: "Role probe review.", notice_summary: "Case closed with no findings disclosed." }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INSUFFICIENT_PERMISSIONS (role gate at priority 2 precedes existence at priority 5)"

      - name: acm_can_list_reports_but_cannot_create
        claim_type: role_denial
        grounds:
          - 'roles[AuditCommitteeMember]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "AuditCommitteeMember has read/present access only: GET reports succeeds (200), POST reports is denied (403)."
        test_recipe:
          setup: ["officer staff creates one DRAFT report"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/audit-committee-reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off}" }
          trigger:
            - { call: "GET /hotline/audit-committee-reports", as: AuditCommitteeMember }
            - { call: "POST /hotline/audit-committee-reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: AuditCommitteeMember, captures: { err_id: "$.data.error_id" } }
          assert:
            - "GET returns 200 with 1 report (shared read)"
            - "POST: err_id == ERR_INSUFFICIENT_PERMISSIONS (create is officer-exclusive)"

      - name: admin_cannot_triage
        claim_type: role_denial
        grounds:
          - 'roles[EthicsPlatformAdmin]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "EthicsPlatformAdmin is operational-only (staff registry, clock) and has no case-workflow permissions."
        test_recipe:
          setup: ["one RECEIVED case"]
          setup_api_calls:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-at", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: EthicsPlatformAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: segregation_of_duties_model
        claim_type: role_model
        grounds:
          - 'complexity_profile.role_model'
        excluded_because:
          difficulty_instance: assignment_freeze_vs_sod_priority
          rationale: "SoD constraint behavior is exercised by §1.8 (shadowed rule) and by the seven live SoD error instances in the errors section (self-screen, self-waiver, self-review, self-verify, hold-release) plus the waiver-fork positive path."

  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: selector_tiebreak_created_at_order
        claim_type: selector_determinism
        grounds:
          - 'calculations.routing_selector'
        distinguishing_aspect: "Two eligible investigators with equal weighted_caseload (0) and equal active_case_count (0) tie-break on StaffMember.created_at ASC: the earlier-registered investigator wins."
        test_recipe:
          setup: ["intake; invOld created first, invNew created second; case TRIAGED"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olive Old", email: "old@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_old: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ned New", email: "new@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_new: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-tb", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { asg_inv: $.data.investigator_id } }
          assert:
            - "asg_inv == ${s_old} (weighted 0 == 0, count 0 == 0, created_at of ${s_old} < created_at of ${s_new})"
            - "id never participates in the tie-break"

      - name: posture_recomputed_on_hold_place_and_release
        claim_type: derived_field_reconciliation
        grounds:
          - 'entities.HotlineCase.fields.posture'
          - 'state_machines.LegalHold.ACTIVE_to_RELEASED'
        distinguishing_aspect: "The derived posture field flips FROZEN on hold placement and back to NORMAL on release — both directions of reconciliation observable via GET."
        test_recipe:
          setup: ["off1, off2 staff; case RECEIVED (NORMAL)"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-pp", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z", reason: "Pending litigation review" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { h1: $.data.id } }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { po1: $.data.posture } }
            - { call: "POST /hotline/legal-holds/${h1}/release", as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { po2: $.data.posture } }
          assert:
            - "po1 == FROZEN after placement; po2 == NORMAL after release by the second officer"

      - name: occ_layer_coverage
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[assignment-propose-stale-case]'
          - 'concurrency_rules[determination-draft-stale-case]'
        excluded_because:
          difficulty_instance: routing_workload_count_vs_weighted_selector
          rationale: "OCC happy-path version references are exercised by every §1.8 assignment/determination chain; stale-version rejection is asserted by the two live validations-section instances occ_assignment_propose_stale_version_returns_412 and occ_determination_draft_stale_version_returns_412."

      - name: cascade_layer_coverage
        claim_type: cascading_side_effects
        grounds:
          - 'complexity_profile.complexity_layers'
        excluded_because:
          difficulty_instance: retaliation_reopen_cascade_depth3
          rationale: "Depth-3 retaliation cascade and depth-2 verify cascade are asserted by the two named §1.8 transitive_cascade instances."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds:
          - 'complexity_profile.consistency_model'
        distinguishing_aspect: "All mutations are atomic in-request: the triage response itself carries the computed severity, and an immediate re-read shows identical values (no eventual lag)."
        test_recipe:
          setup: ["intake staff; one RECEIVED case"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-iv", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: EXECUTIVE, financial_exposure_band: HIGH_1M, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sev1: $.data.severity, sla1: $.data.sla_days } }
            - { call: "GET /hotline/cases/${c1}", as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sev2: $.data.severity, sla2: $.data.sla_days } }
          assert:
            - "sev1 == CRITICAL and sla1 == 30 in the mutation response itself"
            - "sev2 == sev1 and sla2 == sla1 on immediate re-read (no reconciliation lag)"
