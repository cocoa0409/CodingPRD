        distinguishing_aspect: |
          A different entity pair (QualificationRequest -> SourceDocument) and a different dependency
          direction from the statement/publication instance: the child's creation is refused because
          a SIBLING evidence entity sits in PURGED, even though the request's own attested criteria
          would score a full 100. The subscriber's version must be left untouched by the rejection.
        test_recipe:
          setup:
            - "publication with source_doc_retention_months 1 and all three qualification rules"
            - "an UNQUALIFIED recipient at version 1 with one source document captured 2026-07-15"
            - "clock moved to 2026-08-20 and the document purged"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Short Retention Gazette", frequency: "MONTHLY", industry_code: "MANUFACTURING", source_doc_retention_months: 1 }
              as: CirculationManager
