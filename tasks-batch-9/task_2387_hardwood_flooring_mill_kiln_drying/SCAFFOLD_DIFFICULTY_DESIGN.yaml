          assert:
            - "First load: status 409 with data.error_id == \"ERR_CHAMBER_STATE_INVALID\"; the charge is unchanged (GET shows status \"SCHEDULED\", charged_green_bf 5800) and receipt R1 is still \"ALLOCATED\"."
