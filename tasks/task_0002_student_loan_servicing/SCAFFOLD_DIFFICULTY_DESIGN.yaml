scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: plan_monthly_payment_idr_save_vs_ibr_divergence
        grounds:
          - calculations.plan_monthly_payment
          - calculations.plan_monthly_payment.variants.idr_with_standard_cap
          - calculations.plan_monthly_payment.variants.idr_uncapped_save
          - entities.RepaymentPlan.fields.plan_type
          - entities.RepaymentPlan.fields.monthly_payment_cents
        distinguishing_aspect: |
          Operates on RepaymentPlan (loan-product entity domain). On identical inputs
          (P=$30,000, rate=6.00%, AGI=$60,000, family_size=2, CONTIGUOUS), the three
          IDR variants produce three different monthly_payment_cents values:
          IBR=33306 (cap-bound to standard), PAYE=24575 (uncapped under standard),
          SAVE=5931 (225% threshold + 5%, no cap).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "One Borrower with two Loans: loan_a (DIRECT_UNSUBSIDIZED, principal $30,000, rate 6.00%) and loan_b (clone with same params for PAYE test) and loan_c (clone for SAVE test)."
            - "Each loan in REPAYMENT (advance through IN_SCHOOL→GRACE→REPAYMENT)."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1234", full_name: "Alice Test", date_of_birth: "1990-01-01", email: "alice@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 3000000, interest_rate_bps: 600, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_a_id: $.data.id, loan_a_v: $.data.version }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 3000000, interest_rate_bps: 600, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_b_id: $.data.id, loan_b_v: $.data.version }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 3000000, interest_rate_bps: 600, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_c_id: $.data.id, loan_c_v: $.data.version }
            - call: "POST /v1/loans/${loan_a_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_a_v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_b_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_b_v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_c_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_c_v2: $.data.loan_version }
          trigger:
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_a_id}", plan_type: "IBR", agi_cents: 6000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${loan_a_v2}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_a_id: $.data.id, plan_a_pay: $.data.monthly_payment_cents }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_b_id}", plan_type: "PAYE", agi_cents: 6000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${loan_b_v2}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_b_id: $.data.id, plan_b_pay: $.data.monthly_payment_cents }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_c_id}", plan_type: "SAVE", agi_cents: 6000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${loan_c_v2}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_c_id: $.data.id, plan_c_pay: $.data.monthly_payment_cents }
          assert:
            - "RepaymentPlan.${plan_a_id}.monthly_payment_cents == 33306"
            - "RepaymentPlan.${plan_b_id}.monthly_payment_cents == 24575"
            - "RepaymentPlan.${plan_c_id}.monthly_payment_cents == 5931"
            - "RepaymentPlan.${plan_a_id}.monthly_payment_cents != RepaymentPlan.${plan_b_id}.monthly_payment_cents"
            - "RepaymentPlan.${plan_b_id}.monthly_payment_cents != RepaymentPlan.${plan_c_id}.monthly_payment_cents"

      - name: pslf_qualifying_payment_strict_vs_relaxed_lookback
        grounds:
          - calculations.pslf_qualifying_payment
          - calculations.pslf_qualifying_payment.variants.per_payment_strict_match
          - calculations.pslf_qualifying_payment.variants.per_payment_lookback_relaxed
          - entities.PSLFTracker.fields.qualifying_payment_count
          - entities.EmploymentCertification.fields.pslf_qualifying_employer
        distinguishing_aspect: |
          Operates on PSLFTracker (forgiveness-tracking entity domain — different from
          RepaymentPlan). With two POSTED Payments preceding any EmploymentCertification
          approval, then a single APPROVED certification whose period covers both
          posted_on dates, the relaxed-lookback variant (pinned official) yields
          qualifying_payment_count=2 while strict-at-POSTED would yield 0.
        test_recipe:
          setup:
            - "Clock at 2027-01-15T00:00:00Z."
            - "Borrower with one $20k DIRECT_UNSUBSIDIZED loan @ 5.33%, REPAYMENT (REPAYMENT_BEGIN on 2026-10-15), on STANDARD_10YR plan (monthly_payment_cents=21537)."
            - "PSLFTracker exists for borrower (status=TRACKING)."
            - "Two POSTED Payments on 2026-11-15 and 2026-12-15 each of amount 21537 cents (each on the scheduled due_date)."
            - "Then ONE EmploymentCertification submitted and APPROVED with period 2026-10-01 → 2099-12-31, employer_type=GOVERNMENT_FEDERAL, weekly_hours=40 — its approval triggers a tracker recount that picks up both prior payments under the relaxed-lookback variant."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "5678", full_name: "Bob Vet", date_of_birth: "1988-03-03", email: "bob@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2026-02-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-02-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-10-15", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${loan_v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_id: $.data.id }
            - call: "POST /v1/pslf-trackers"
              payload: { borrower_id: "${brw_id}" }
              as: PSLFAdjudicator
              as_user_id: "adj-1"
              captures: { tracker_id: $.data.id }
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 21537, posted_on: "2026-11-15", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { pay1_id: $.data.id }
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 21537, posted_on: "2026-12-15", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { pay2_id: $.data.id }
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/employment-certifications"
              payload: { borrower_id: "${brw_id}", employer_ein: "123456789", employer_type: "GOVERNMENT_FEDERAL", period_start_on: "2026-10-01", period_end_on: "2099-12-31", weekly_hours: 40 }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /v1/employment-certifications/${cert_id}/approve"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "GET /v1/pslf-trackers/${tracker_id}"
              payload: {}
              as: PSLFAdjudicator
              as_user_id: "adj-1"
              captures: { final_count: $.data.qualifying_payment_count }
          assert:
            - "PSLFTracker.${tracker_id}.qualifying_payment_count == 2"
            - "Payment.${pay1_id}.pslf_qualifying == true"
            - "Payment.${pay2_id}.pslf_qualifying == true"
            - "PSLFTracker.${tracker_id}.last_recount_on == '2027-01-15'"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: idr_payment_three_input_nonlinear_tiered_pricing  # mode (a)
        grounds:
          - calculations.plan_monthly_payment
          - entities.RepaymentPlan.fields.agi_cents
          - entities.RepaymentPlan.fields.family_size
          - entities.RepaymentPlan.fields.state_of_residence
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (agi_cents, family_size, state_of_residence,
          loan principal+rate) and non-linear interaction (tiered POVERTY_LINES_BY_STATE
          lookup nested inside max(0, agi - threshold_pct*poverty/100), then min() of
          IDR-formula and standard amortization cap). For AGI=$60,000, family_size=2,
          state CONTIGUOUS, loan $30k @ 6.00%: IBR cap binds (raw IBR 36863 > std 33306)
          → 33306. For AGI=$60,000, family_size=2, state AK (different poverty table):
          discretionary changes (pov_AK[2]=$25,420), so the same formula yields a
          different output, demonstrating the tiered table dependency.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Two Borrowers with identical loans ($30k @ 6.00%, DIRECT_UNSUBSIDIZED) in REPAYMENT, identical AGI=$60,000 and family_size=2."
            - "One borrower on IBR with state_of_residence=CONTIGUOUS; the other on IBR with state_of_residence=AK."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1111", full_name: "C One", date_of_birth: "1990-01-01", email: "c1@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw1_id: $.data.id }
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "2222", full_name: "C Two", date_of_birth: "1990-01-01", email: "c2@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw2_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw1_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 3000000, interest_rate_bps: 600, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan1_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw2_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 3000000, interest_rate_bps: 600, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan2_id: $.data.id }
            - call: "POST /v1/loans/${loan1_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan1_v: $.data.loan_version }
            - call: "POST /v1/loans/${loan2_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan2_v: $.data.loan_version }
          trigger:
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan1_id}", plan_type: "IBR", agi_cents: 6000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${loan1_v}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan1_id: $.data.id, p1_pay: $.data.monthly_payment_cents }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan2_id}", plan_type: "IBR", agi_cents: 6000000, family_size: 2, state_of_residence: "AK", expected_loan_version: "${loan2_v}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan2_id: $.data.id, p2_pay: $.data.monthly_payment_cents }
          assert:
            - "RepaymentPlan.${plan1_id}.monthly_payment_cents == 33306"
            - "RepaymentPlan.${plan2_id}.monthly_payment_cents == 27338"
            - "RepaymentPlan.${plan1_id}.monthly_payment_cents != RepaymentPlan.${plan2_id}.monthly_payment_cents"

      - name: capitalization_pinned_order_circular_dependency  # mode (c)
        grounds:
          - calculations.capitalization_amount
          - state_machines.Loan.transitions.FORBEARANCE_to_REPAYMENT
          - entities.Loan.fields.outstanding_principal_cents
          - entities.Loan.fields.accrued_interest_cents
          - entities.Loan.fields.capitalized_interest_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. Daily interest accrual reads
          outstanding_principal_cents; capitalization writes outstanding_principal_cents
          from accrued_interest_cents; the next day's accrual reads the higher principal.
          The scaffold PINS the order: (1) daily accrual runs through the day BEFORE
          effective_on, (2) THEN capitalization adds accrued_interest_cents to
          outstanding_principal_cents, (3) THEN accrued_interest_cents := 0, (4) THEN
          version bumps. Reversing steps 2 and 3 would zero out the capitalization
          target. The well-defined outcome is observable: after a forbearance ending
          with $20,000 principal @ 5.33% and 30 days of accrual (8760 cents accrued),
          REPAYMENT-resume capitalization yields outstanding_principal_cents = 2008760
          and accrued_interest_cents = 0.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Borrower with one $20,000 DIRECT_UNSUBSIDIZED loan @ 5.33%, ACTIVE STANDARD_10YR plan, currently in FORBEARANCE."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "3333", full_name: "Cap Ord", date_of_birth: "1990-01-01", email: "capord@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { lv2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { lv3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${lv3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-01", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_END", effective_on: "2026-07-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "Loan.${loan_id}.outstanding_principal_cents == 2008760"
            - "Loan.${loan_id}.accrued_interest_cents == 0"
            - "Loan.${loan_id}.capitalized_interest_cents == 8760"
            - "Loan.${loan_id}.status == REPAYMENT"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_cyclic_repayment_forbearance_repayment
        grounds:
          - state_machines.Loan
          - state_machines.Loan.transitions.REPAYMENT_to_FORBEARANCE
          - state_machines.Loan.transitions.FORBEARANCE_to_REPAYMENT
          - state_machines.Loan.transitions.REPAYMENT_to_DEFERMENT
          - state_machines.Loan.transitions.DEFERMENT_to_REPAYMENT
        distinguishing_aspect: |
          Loan machine is cyclic: REPAYMENT→FORBEARANCE→REPAYMENT (and REPAYMENT→
          DEFERMENT→REPAYMENT) loops are explicitly allowed. The same loan can
          legally transition into and back out of FORBEARANCE multiple times — not a
          linear A→B→C→D pipeline. After REPAYMENT→FORBEARANCE→REPAYMENT→
          FORBEARANCE→REPAYMENT, the loan ends in REPAYMENT with two capitalization
          events recorded in its servicing history (one per FORBEARANCE_END).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Borrower with one $20k DIRECT_UNSUBSIDIZED loan @ 5.33%, ACTIVE STANDARD_10YR plan, in REPAYMENT."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "4444", full_name: "Cyc Ler", date_of_birth: "1990-01-01", email: "cyc@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-01", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_END", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-01", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_END", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "GET /v1/loans/${loan_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "Loan.${loan_id}.status == REPAYMENT"

      - name: discharge_application_branching_review_paths
        grounds:
          - state_machines.DischargeApplication
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          DischargeApplication machine is branching (diamond/fork): from UNDER_REVIEW
          the application can fork to APPROVED (cascades all Loans to DISCHARGED,
          set total_discharged_principal_cents, may also set PSLFTracker.FORGIVEN)
          OR to DENIED (no cascade, no field updates beyond status). Different entity
          from Loan, and the two branches carry distinct side-effect sets. With two
          applications on the same borrower, one approved and one denied, the
          approved one's side effects fire and the denied one's do not.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Veteran borrower (military_status=VETERAN) with two DischargeApplications of discharge_type=VETERAN_TOTAL_PERMANENT_DISABILITY both UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "5555", full_name: "Vet Br", date_of_birth: "1985-01-01", email: "vet@example.com", military_status: "VETERAN" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/discharge-applications"
              payload: { borrower_id: "${brw_id}", discharge_type: "VETERAN_TOTAL_PERMANENT_DISABILITY", va_certification_doc_id: "VA-DOC-001", filed_on: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { app_a_id: $.data.id }
            - call: "POST /v1/discharge-applications"
              payload: { borrower_id: "${brw_id}", discharge_type: "VETERAN_TOTAL_PERMANENT_DISABILITY", va_certification_doc_id: "VA-DOC-002", filed_on: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { app_b_id: $.data.id }
            - call: "POST /v1/discharge-applications/${app_a_id}/begin-review"
              payload: {}
              as: VADischargeOfficer
              as_user_id: "vad-1"
            - call: "POST /v1/discharge-applications/${app_b_id}/begin-review"
              payload: {}
              as: VADischargeOfficer
              as_user_id: "vad-1"
          trigger:
            - call: "POST /v1/discharge-applications/${app_a_id}/approve"
              payload: { expected_loan_version_by_loan_id: {} }
              as: VADischargeOfficer
              as_user_id: "vad-1"
            - call: "POST /v1/discharge-applications/${app_b_id}/deny"
              payload: {}
              as: VADischargeOfficer
              as_user_id: "vad-1"
          assert:
            - "DischargeApplication.${app_a_id}.status == APPROVED"
            - "DischargeApplication.${app_a_id}.approved_by_user_id == 'vad-1'"
            - "DischargeApplication.${app_b_id}.status == DENIED"
            - "DischargeApplication.${app_b_id}.approved_by_user_id == null"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pslf_discharge_approval_three_hop_cascade  # depth 3
        grounds:
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.PSLFTracker.transitions.ELIGIBLE_FOR_FORGIVENESS_to_FORGIVEN
          - state_machines.Loan.transitions.REPAYMENT_to_DISCHARGED
          - state_machines.RepaymentPlan.transitions.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Triggered by POST /discharge-applications/{id}/approve (PSLF_FORGIVENESS).
          Depth-3+ cascade where each link is CAUSED by the previous link, not by
          the original trigger:
          Hop 1: DischargeApplication SUBMITTED→APPROVED →
          Hop 2: that approval flips PSLFTracker ELIGIBLE_FOR_FORGIVENESS → FORGIVEN →
          Hop 3: tracker becoming FORGIVEN causes each non-terminal Loan to transition
          REPAYMENT → DISCHARGED →
          Hop 4: each Loan becoming DISCHARGED causes its ACTIVE RepaymentPlan to
          transition ACTIVE → EXPIRED.
          Each hop's mutation triggers the next hop's mutation.
        test_recipe:
          setup:
            - "Clock at 2030-01-01T00:00:00Z."
            - "Borrower with one $20k DIRECT_UNSUBSIDIZED loan @ 5.33%, ACTIVE STANDARD_10YR plan."
            - "PSLFTracker with qualifying_payment_count=120 (set ELIGIBLE_FOR_FORGIVENESS via 120 qualifying payments — we use \"required_payment_count: 120\" with a pre-loaded EmploymentCertification covering the period)."
            - "DischargeApplication discharge_type=PSLF_FORGIVENESS in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "7777", full_name: "Pslf Br", date_of_birth: "1990-01-01", email: "pslfbr@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-02-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "IBR", agi_cents: 3000000, family_size: 4, state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_id: $.data.id }
            - call: "POST /v1/pslf-trackers"
              payload: { borrower_id: "${brw_id}" }
              as: PSLFAdjudicator
              as_user_id: "adj-2"
              captures: { tracker_id: $.data.id }
            - call: "POST /v1/_pslf-trackers/${tracker_id}/force-state"
              payload: { qualifying_payment_count: 120, status: "ELIGIBLE_FOR_FORGIVENESS" }
              as: PSLFAdjudicator
              as_user_id: "adj-2"
            - call: "POST /v1/discharge-applications"
              payload: { borrower_id: "${brw_id}", discharge_type: "PSLF_FORGIVENESS", filed_on: "2030-01-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { app_id: $.data.id }
            - call: "POST /v1/discharge-applications/${app_id}/begin-review"
              payload: {}
              as: PSLFAdjudicator
              as_user_id: "adj-2"
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2030-01-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "GET /v1/loans/${loan_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { latest_lv: $.data.version }
          trigger:
            - call: "POST /v1/discharge-applications/${app_id}/approve"
              payload: { expected_loan_version_by_loan_id: { "${loan_id}": "${latest_lv}" } }
              as: PSLFAdjudicator
              as_user_id: "adj-2"
          assert:
            - "DischargeApplication.${app_id}.status == APPROVED"
            - "PSLFTracker.${tracker_id}.status == FORGIVEN"
            - "Loan.${loan_id}.status == DISCHARGED"
            - "RepaymentPlan.${plan_id}.status == EXPIRED"

      - name: missed_payment_delinquency_then_default_two_hop  # depth 2
        grounds:
          - state_machines.Loan.transitions.REPAYMENT_to_DELINQUENT
          - state_machines.Loan.transitions.DELINQUENT_to_DEFAULT
          - state_machines.RepaymentPlan.transitions.ACTIVE_to_EXPIRED
          - endpoints["/v1/_clock/advance"]
        distinguishing_aspect: |
          Triggered by POST /_clock/advance (different origin from the PSLF cascade).
          Depth-2 cascade where each link causes the next: clock-advance past a
          missed due date causes REPAYMENT→DELINQUENT (Hop 1, opens a
          DelinquencyRecord); the new DelinquencyRecord's cumulative_days
          eventually crossing 270 then causes DELINQUENT→DEFAULT (Hop 2, which
          itself causes RepaymentPlan ACTIVE→EXPIRED — Hop 3 if we count
          the plan expiry). Each hop is the consequence of the prior hop's
          state change, NOT of the original clock-advance.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Borrower with one $20k DIRECT_UNSUBSIDIZED loan @ 5.33% in REPAYMENT with ACTIVE STANDARD_10YR plan (monthly_payment_cents=21537)."
            - "No payments have been made and the scheduled first due_date is 2026-07-01."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "8888", full_name: "Del Br", date_of_birth: "1990-01-01", email: "del@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2027-04-28T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "Loan.${loan_id}.status == DEFAULT"
            - "RepaymentPlan.${plan_id}.status == EXPIRED"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_payment_overpay_on_paidoff_loan
        grounds:
          - validations[priority=21]   # state
          - validations[priority=27]   # business_fiscal
        distinguishing_aspect: |
          Pair: state (priority 21) vs business_fiscal (priority 27).
          A POST /payments request that BOTH (a) targets a Loan currently in PAID_OFF
          (state precondition forbids payments to PAID_OFF — but ERR_BORROWER_DISCHARGED
          covers DISCHARGED specifically; for PAID_OFF the state-precondition check at
          priority 21 fires) AND (b) carries amount_cents larger than would fit
          (overpay), MUST return the state error (priority 21), not the fiscal error
          (priority 27). Concretely: ERR_INVALID_STATE wins over ERR_PAYMENT_EXCEEDS_BALANCE.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z."
            - "Borrower with one DIRECT_UNSUBSIDIZED loan that has already been paid off (status=PAID_OFF, outstanding_principal_cents=0, accrued_interest_cents=0)."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1010", full_name: "Po Br", date_of_birth: "1990-01-01", email: "po@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 100000, interest_rate_bps: 0, disbursement_date: "2025-12-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-12-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 100000, posted_on: "2026-06-15", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 999999999, posted_on: "2026-06-15", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "Loan.${loan_id}.status == PAID_OFF"
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: business_safety_vs_state_pslf_approval_sod_vs_stale_version
        grounds:
          - validations[priority=12]   # business_safety (SoD)
          - validations[priority=40]   # state (OCC stale version)
        distinguishing_aspect: |
          Pair: business_safety (priority 12, SoD) vs state (priority 40, OCC stale
          version) — DIFFERENT pair from the state-vs-business_fiscal pair above. A
          single POST /discharge-applications/{id}/approve request triggers BOTH
          (a) SoD violation (acting X-User-ID 'svc-shared' previously recorded a
          contributing qualifying Payment) AND (b) stale expected_loan_version (the
          client's loan.version snapshot is older than the actual version after a
          forbearance event bumped it). Because priority 12 < priority 40, the
          server returns ERR_SOD_VIOLATION (403), NOT ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "Clock at 2027-01-15T00:00:00Z."
            - "Borrower with one DIRECT_UNSUBSIDIZED loan @ 5.33%, REPAYMENT (REPAYMENT_BEGIN 2026-10-15), ACTIVE STANDARD_10YR plan, monthly_payment_cents=21537."
            - "APPROVED EmploymentCertification for borrower, GOVERNMENT_FEDERAL, period 2026-10-01 → 2099-12-31, weekly_hours=40."
            - "One qualifying Payment recorded by X-User-ID 'svc-shared' on 2026-11-15 (amount 21537, posted_on=due_date → pslf_qualifying=true)."
            - "PSLFTracker.qualifying_payment_count forced to 120 with status ELIGIBLE_FOR_FORGIVENESS (the recorded qualifying payment is among the contributing set)."
            - "DischargeApplication discharge_type=PSLF_FORGIVENESS in UNDER_REVIEW (created without va_certification_doc_id, correctly)."
            - "Acting PSLFAdjudicator is X-User-ID 'svc-shared' (SAME id that recorded the qualifying payment — SoD violation)."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-shared"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "2020", full_name: "SoD Br", date_of_birth: "1990-01-01", email: "sod@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2026-02-01" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-02-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-10-15", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-shared"
            - call: "POST /v1/employment-certifications"
              payload: { borrower_id: "${brw_id}", employer_ein: "111222333", employer_type: "GOVERNMENT_FEDERAL", period_start_on: "2026-10-01", period_end_on: "2099-12-31", weekly_hours: 40 }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { cert_id: $.data.id }
            - call: "POST /v1/employment-certifications/${cert_id}/approve"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-shared"
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-shared"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 21537, posted_on: "2026-11-15", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { pay_id: $.data.id }
            - call: "POST /v1/pslf-trackers"
              payload: { borrower_id: "${brw_id}" }
              as: PSLFAdjudicator
              as_user_id: "adj-clean"
              captures: { tracker_id: $.data.id }
            - call: "POST /v1/_pslf-trackers/${tracker_id}/force-state"
              payload: { qualifying_payment_count: 120, status: "ELIGIBLE_FOR_FORGIVENESS" }
              as: PSLFAdjudicator
              as_user_id: "adj-clean"
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-shared"
            - call: "POST /v1/discharge-applications"
              payload: { borrower_id: "${brw_id}", discharge_type: "PSLF_FORGIVENESS", filed_on: "2027-01-15" }
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { app_id: $.data.id }
            - call: "POST /v1/discharge-applications/${app_id}/begin-review"
              payload: {}
              as: PSLFAdjudicator
              as_user_id: "svc-shared"
            - call: "GET /v1/loans/${loan_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-shared"
              captures: { stale_lv: $.data.version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2027-01-15", reason_code: "ADMIN_FORBEARANCE" }
              as: LoanServicer
              as_user_id: "svc-shared"
          trigger:
            - call: "POST /v1/discharge-applications/${app_id}/approve"
              payload: { expected_loan_version_by_loan_id: { "${loan_id}": "${stale_lv}" } }
              as: PSLFAdjudicator
              as_user_id: "svc-shared"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SOD_VIOLATION"
            - "response.http_status == 403"
            - "DischargeApplication.${app_id}.status == UNDER_REVIEW"
            - "Payment.${pay_id}.pslf_qualifying == true"
            - "Payment.${pay_id}.recorded_by_user_id == 'svc-shared'"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: default_threshold_270_days_exact_boundary
        grounds:
          - validations[priority=30]
          - state_machines.Loan.transitions.DELINQUENT_to_DEFAULT
          - entities.DelinquencyRecord.fields.cumulative_days
        distinguishing_aspect: |
          Numeric-threshold boundary on Loan.DEFAULT_DECLARED. Per validation priority 30:
          cumulative_days >= 270 succeeds; cumulative_days == 269 returns
          ERR_DEFAULT_THRESHOLD_NOT_MET (409). Endpoint:
          POST /loans/{id}/servicing-events with event_type=DEFAULT_DECLARED.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Loan in DELINQUENT with DelinquencyRecord opened_on=2026-06-01."
