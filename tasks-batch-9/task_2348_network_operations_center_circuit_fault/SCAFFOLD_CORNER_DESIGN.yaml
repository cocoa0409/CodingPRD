          - errors.ERR_ALARM_ALREADY_CLEARED
          - endpoints["POST /alarms/{id}/clear"]
        distinguishing_aspect: "Clearing is not idempotent by design: the second clear on the same alarm must be refused so a stale monitoring replay cannot re-run the up-cascade or move cleared_at."
        test_recipe:
          setup:
            - "Carrier PFT with one MONITORED circuit and one BRONZE single-leg path."
