            - "GET /pressure-injury-cases?patient_id=${p1_id} returns total_count == 2, one per assessment, both still status == OPEN"

      - name: certification_eligibility_score_applies_monthly_recency_decay
        claim_type: Correct Result
        grounds:
          - calculations.certification_eligibility_score
          - global_constants.ELIGIBILITY_SCORE_FLOOR
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Recency decays in whole MONTH_HOURS steps measured from last_competency_signoff_at to the logical clock, and last_competency_signoff_at tracks the payload signed_off_at rather than the clock — so back-dating a signoff two months later leaves the decay in place instead of resetting the curve."
        test_recipe:
          setup:
            - "Unit 3E exists. Nurse Nina has ce_credits 30 and two signoffs, both signed_off_at 2026-08-01T00:00:00Z, taken at the default logical clock."
            - "The logical clock is then advanced to 2026-10-01T00:00:00Z, which is 1464 hours later."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 0 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "RCA" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-10-01T00:00:00Z" }
              as: WocProgramDirector
          assert:
            - "At the pre-advance checkpoint (clock 2026-08-01T00:00:00Z): WocNurse.${n1_id}.certification_eligibility_score == 64.00, from 0.4 * (RECENCY_BASE 100 - 5 * 0 months) + 0.4 * min(60, 2 * 30) + 0.2 * 0"
            - "After the third signoff at clock 2026-10-01T00:00:00Z: HTTP 200, competency_signoff_count == 3, last_competency_signoff_at == 2026-08-01T00:00:00Z"
            - "WocNurse.${n1_id}.certification_eligibility_score == 60.00"
            - "Derivation: months_since = floor(1464 / MONTH_HOURS 720) == 2; recency_component = 100 - RECENCY_DECAY_PER_MONTH 5 * 2 == 90; 0.4 * 90 + 0.4 * 60 + 0.2 * 0 == 60.00"
            - "The score is NOT 64.00 — the clock moved even though the signoff instant did not — and NOT 57.66 (which floor-dividing 1464 by 730 would give)"
            - "advance returns HTTP 200 with certification_status == CANDIDATE and max_consult_load == 3"
            - "certify returns HTTP 200 because 60.00 >= ELIGIBILITY_SCORE_FLOOR 55.00, ce_credits 30 >= CE_CREDIT_FLOOR 30 and competency_signoff_count 3 >= SIGNOFF_FLOOR 2; certification_status == CERTIFIED with max_consult_load == 8"

      - name: certification_credit_component_capped_at_sixty_points
        claim_type: Constants Applied
        grounds:
          - calculations.certification_eligibility_score.constants
          - validations[priority=62]
          - errors[ERR_CERTIFICATION_NOT_ELIGIBLE]
        distinguishing_aspect: "CREDIT_COMPONENT_CAP flattens the credit term at 30 credits, so 30 and 200 credits score identically at 64.00 while 29 credits scores 63.20 — and the 29-credit nurse is refused certification by the INDEPENDENT hard gate CE_CREDIT_FLOOR even though her score clears ELIGIBILITY_SCORE_FLOOR. Folding the credit floor into the score would let her through."
        test_recipe:
          setup:
            - "Unit 3E exists with three nurses created at the default logical clock: Nina with ce_credits 30, Otto with ce_credits 200, Pia with ce_credits 29."
            - "Each nurse receives two signoffs dated 2026-08-01T00:00:00Z, so every recency term is at RECENCY_BASE and every mentored term is 0."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 0 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Otto Credit", home_unit_id: "${u1_id}", ce_credits: 200 }
              as: WocProgramDirector
              captures: { n2_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Pia Short", home_unit_id: "${u1_id}", ce_credits: 29 }
              as: WocProgramDirector
              captures: { n3_id: "$.data.id" }
          trigger:
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n3_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n3_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n3_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n3_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
              captures: { err_id: "$.data.error_id" }
          assert:
            - "WocNurse.${n1_id}.certification_eligibility_score == 64.00 — 0.4 * 100 + 0.4 * min(CREDIT_COMPONENT_CAP 60, CREDIT_POINTS_PER_UNIT 2 * 30 = 60) + 0.2 * 0"
            - "WocNurse.${n2_id}.certification_eligibility_score == 64.00 as well, even though 2 * 200 == 400 raw credit points, proving the cap"
            - "Without the cap Otto would have scored 0.4 * 100 + 0.4 * 400 == 200.00, which is not even representable in the field's 0.00-100.00 range"
            - "WocNurse.${n3_id}.certification_eligibility_score == 63.20 — 0.4 * 100 + 0.4 * (2 * 29 = 58) == 40.00 + 23.20; one credit below the cap is visible in the score"
            - "The three components are not individually rounded: 23.20 is carried at full precision into the single round_half_up of the weighted sum"
            - "Pia's advance returns HTTP 200 (competency_signoff_count 2 >= 1) with certification_status == CANDIDATE"
            - "Pia's certify returns HTTP 422 with data.error_id == ERR_CERTIFICATION_NOT_ELIGIBLE, because ce_credits 29 < CE_CREDIT_FLOOR 30 despite 63.20 >= ELIGIBILITY_SCORE_FLOOR 55.00"
            - "WocNurse.${n3_id}.certification_status is still CANDIDATE and cert_expires_at is still null"

      - name: dressing_protocol_non_formulary_surcharge_and_floor_applied
        claim_type: aggregation
        grounds:
          - calculations.dressing_protocol_weekly_cost
          - global_constants.HOURS_PER_WEEK
          - validations[priority=56]
        distinguishing_aspect: "Two protocols with byte-identical frequency, units and unit cost differ only in the product's formulary_tier, which isolates NON_FORMULARY_SURCHARGE_PCT from every other term. The shared frequency of 20 hours also pins the floor: 168 / 20 is 8.4 changes, which must floor to 8 rather than round to 8 by luck or ceil to 9."
