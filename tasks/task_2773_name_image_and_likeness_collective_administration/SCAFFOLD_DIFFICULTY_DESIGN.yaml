              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${ic_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${ic_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${ic_id}/deliverables"
              payload: { deliverable_kind: "SOCIAL_POST", unit_value_cents: 200000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
