              payload: { tank_project_id: "${proj_id}", variant: "PRELIMINARY_ESTIMATE", claimed_costs_cents: 200000, expected_project_version: "${pv1}" }
              as: ComplianceOfficer
              captures: { claim_id: $.data.id, elig: $.data.eligible_amount_cents, admin: $.data.admin_fee_cents }
          trigger:
            - call: "POST /trust-fund-claims/${claim_id}/submit"
              as: ComplianceOfficer
              captures: { st: $.data.status, submitted: $.data.submitted_at }
          assert:
            - "${admin} == 7000"
            - "${elig} == 143000"
            - "HTTP status == 200"
            - "${st} == SUBMITTED"
            - "${submitted} == 2026-08-06T13:00:00Z"
            - "TankProject.${proj_id}.contamination_disclosure_required == false"

      - name: work_order_with_override_reason_passes_the_method_divergence_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=62]
          - endpoints[POST /work-orders]
        distinguishing_aspect: "recommended_method is REMOVAL, so booking ABANDONMENT_IN_PLACE diverges — but because method_override_reason is supplied the create returns 201 and the work order stores the overriding method."
        test_recipe:
          setup: ["One NJ project at SURVEYED with method_score 36.00 and recommended_method REMOVAL, plus one Crew."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "25 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Yan Hope", homeowner_email: "yan@example.com", insurance_carrier_code: "CARR-C-25" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
              captures: { rec: $.data.recommended_method }
            - call: "POST /crews"
              payload: { crew_name: "Crew Override OK", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "ABANDONMENT_IN_PLACE", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z", method_override_reason: "municipal engineer requires the slab to stay intact" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id, m: $.data.method, fs: $.data.field_status }
          assert:
            - "${rec} == REMOVAL"
            - "HTTP status == 201"
            - "${m} == ABANDONMENT_IN_PLACE"
            - "${fs} == SCHEDULED"
            - "DecommissionWorkOrder.${wo_id}.billing_status == UNBILLED"
            - "TankProject.${proj_id}.decommission_method == null"

      - name: project_state_versus_excavation_limit_precedence
        claim_type: priority_ordering
        grounds:
          - validations[priority=40]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_state_beats_excavation_limit_on_change_order_approval
          rationale: "That §1.8 instance violates both rules in one request and asserts that the priority-40 state error wins over the priority-70 aggregate error."

      - name: resource_ownership_versus_disclosure_expiry_precedence
        claim_type: priority_ordering
        grounds:
          - validations[priority=25]
          - validations[priority=53]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / resource_ownership_beats_disclosure_expiry_on_respond
          rationale: "That §1.8 instance has the wrong homeowner respond to an already-expired disclosure and asserts the priority-25 ownership error wins."

      - name: stale_version_versus_supersede_target_precedence
        claim_type: priority_ordering
        grounds:
          - validations[priority=38]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_project_version_beats_invalid_supersede_target_on_change_order_create
          rationale: "That §1.8 instance sends a stale expected_project_version together with an invalid supersedes_change_order_id and asserts the priority-38 OCC error wins."

