  - section: consistency_model
    instances:
      - name: activation_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - endpoints["POST /body-art/establishments/{establishment_id}/activate"]
          - calculations.operating_posture
          - calculations.sterilization_compliance_status
          - entities.Establishment.fields.permit_expires_on
        distinguishing_aspect: "The consistency model is immediate: the activate response itself already shows permit_issued_on, permit_expires_on, the recomputed sterilization verdict, risk_score and operating_posture, and a follow-up GET returns byte-identical values with no second recomputation."
        test_recipe:
          setup:
            - "One Establishment in PENDING_INSPECTION with a PASSED PREOPENING inspection and no sterilization records."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Immediate Ink", street_address: "56 Fiftysixth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-IM", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
          trigger:
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { r_status: $.data.permit_status, r_issued: $.data.permit_issued_on, r_expires: $.data.permit_expires_on, r_posture: $.data.operating_posture, r_risk: $.data.risk_score, r_ster: $.data.sterilization_compliance_status }
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { g_status: $.data.permit_status, g_expires: $.data.permit_expires_on, g_posture: $.data.operating_posture, g_risk: $.data.risk_score }
          assert:
            - "${r_status} == ACTIVE"
            - "${r_issued} == 2026-05-01T00:00:00.000Z"
            - "${r_expires} == 2027-05-01T00:00:00.000Z"
            - "${r_posture} == OPEN"
            - "${r_risk} == 25"
            - "${r_ster} == NONCOMPLIANT"
            - "${g_status} == ${r_status} and ${g_expires} == ${r_expires} and ${g_posture} == ${r_posture} and ${g_risk} == ${r_risk}"
