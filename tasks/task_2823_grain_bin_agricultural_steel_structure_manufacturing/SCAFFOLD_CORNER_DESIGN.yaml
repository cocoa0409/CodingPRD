      - name: installation_defect_decertifies_the_crew_and_blocks_only_its_live_orders
        claim_type: conditional_cascade
        grounds:
          - state_machines[InstallationCrew].transitions
          - state_machines[DealerOrder].transitions
          - errors[ERR_CREW_NOT_CERTIFIED]
          - calculations.failure_root_cause_determination
        distinguishing_aspect: "One determination branch drives two different crew outcomes selected by certification_tier: a T3 crew is downgraded to T2 and put on PROBATION with max_diameter_m recomputed 30.0 -> 15.5, while a T1 crew has no lower tier and is REVOKED with max_diameter_m left at 9.5. The order cascade is conditional on the order, not on the crew: assigned orders whose production_status is CANCELLED or SHIPPED keep installation_readiness ASSIGNED, so a blanket UPDATE over installation_crew_id is wrong. ANCHOR_PULLOUT reaches INSTALLATION_DEFECT through branch 3b regardless of either verdict, so neither observed_load_kpa nor measured_coating_loss_pct can influence the outcome."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, Dealer Alpha, engineer PE-1001."
            - "BinDesign D1 at diameter 12.0 m and BinDesign D_SMALL at diameter 6.0 m, both DRAFT."
            - "Crew CREW_T3 (tier T3, max_diameter_m 30.0) with two orders assigned: O1 on D1 (live) and O2 on D1 which is then CANCELLED."
            - "Crew CREW_T1 (tier T1, max_diameter_m 9.5) with order O4 on D_SMALL assigned."
            - "A third order O3 on D1 is left UNASSIGNED for the post-cascade assignment probe."
            - "Two FieldFailures, one on O1 and one on O4, both with failure_mode ANCHOR_PULLOUT, are created and taken through start-analysis."
