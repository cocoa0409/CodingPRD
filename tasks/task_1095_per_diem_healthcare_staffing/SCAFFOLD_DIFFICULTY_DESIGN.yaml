            - call: "POST /staffing/facilities"
              payload: { name: "Stonegate", unit_name: "ICU", unit_capacity: 1, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T19:00:00Z", scheduled_end: "2026-06-08T23:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNIT_CAPACITY_EXCEEDED with HTTP 409"
            - "${err} != ERR_HEADCOUNT_EXCEEDED"
            - "StaffingOrder.${ord_id}.shift_count == 1"
            - "StaffingOrder.${ord_id}.open_count == 1"
            - "GET /staffing/orders/${ord_id}/shifts returns exactly 1 item"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: award_then_cancel_restores_order_slot_partition
        grounds:
          - calculations.order_fill_posture
          - state_machines.Shift.OPEN_to_ASSIGNED
          - state_machines.Shift.ASSIGNED_to_OPEN
          - state_machines.StaffingOrder.PARTIALLY_FILLED_to_OPEN
          - state_machines.Assignment.PENDING_CONFIRMATION_to_CANCELLED_BY_CLINICIAN
          - entities.StaffingOrder.fields.open_count
          - entities.StaffingOrder.fields.filled_count
        distinguishing_aspect: |
          Conserved quantity #1 is a SLOT COUNT, pinned as
          StaffingOrder.shift_count == open_count + filled_count + cancelled_count. Award moves
          one unit from open_count to filled_count; the compensating cancel moves it back, and
          the partition reads 2 == 2 + 0 + 0 exactly as it did before the award, with zero drift.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Ashfield (unit_capacity 2) requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Pia Larsen with a VERIFIED RN_LICENSE."
            - "StaffingOrder headcount 2 with Shift S1 2026-06-08T07:00Z..19:00Z and Shift S2 2026-06-09T07:00Z..15:00Z, both OPEN, so the partition reads 2 == 2 + 0 + 0."
            - "Pia has claimed S1 and been awarded it, so the order is PARTIALLY_FILLED with open_count 1 and filled_count 1."
            - "The cancellation happens 168 hours before the shift starts, i.e. well above CANCELLATION_FREE_HOURS, so no ReliabilityEvent is appended."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
