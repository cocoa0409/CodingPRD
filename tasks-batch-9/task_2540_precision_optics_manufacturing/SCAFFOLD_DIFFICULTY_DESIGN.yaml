              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-B", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 1, declared_index_homogeneity_grade: "H5", declared_striae_grade: "D" }
              as: ProcurementOfficer
              captures: { gb: $.data.id }
            - call: "POST /optics/glass-lots/${gb}/certification"
              payload: { measured_index_homogeneity_grade: "H5", measured_striae_grade: "D", certificate_reference: "CERT-2540-B" }
              as: ProcurementOfficer
              captures: { gbv: $.data.version }
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-G", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 1, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
