            - { call: "POST /grants/awards/${award_a}/modifications", payload: { type: "NO_COST_EXTENSION", new_end_date: "2028-12-31T00:00:00Z", reason: "second extension" }, as: Applicant, as_user_id: "${pi_a}", captures: { nce2: $.data.id, nce2_st: $.data.status, nce2_auto: $.data.auto_approved } }
            - { call: "POST /grants/award-modifications/${nce2}/adjudicate", payload: { decision: "APPROVE" }, as: GrantsOfficer, captures: { nce2_fin: $.data.status } }
            - { call: "GET /grants/awards/${award_a}", payload: {}, as: GrantsOfficer, captures: { end_final: $.data.end_date } }
          assert:
            - "AwardModification.${nce1}.status == AUTO_APPROVED (first NCE, 182 days <= 365)"
            - "AwardModification.${nce1}.auto_approved == true"
            - "AwardModification.${nce2}.status == PENDING_APPROVAL before adjudication (second NCE never auto-approves)"
            - "AwardModification.${nce2}.auto_approved == false"
            - "AwardModification.${nce2}.status == APPROVED after adjudicate APPROVE"
            - "Award.${award_a}.end_date == 2028-12-31T00:00:00Z (extensions adjoined: 2028-01-01 -> 2028-07-01 -> 2028-12-31, no gap, no overlap)"
            - "Award.${award_a}.total_awarded_cents == 30000000 (NCE adds time, never funds)"

  - rule_id: compensating_invariant
    instances:
      - name: institute_funds_conserved_across_issue_disbursal_termination
        grounds:
          - state_machines.Award.ACTIVE_to_TERMINATED
          - state_machines.ProgressReport.SUBMITTED_to_ACCEPTED
          - calculations.award_budget_build
        distinguishing_aspect: |
          Conserved quantity: the institute ledger — appropriation - reserve - committed - disbursed
          is invariant across the forward action (award issue 30000000, report acceptance disbursing
          12000000) and its compensating action (TERMINATION modification returning the undisbursed
          18000000 to available): committed ends at 0, disbursed at 12000000, headroom at 83000000.
        test_recipe:
          setup:
            - "Funded ACTIVE award (total 30000000) under an institute with appropriation 100000000, reserve 5000000; one progress report (actual 12000000) accepted"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
            - { call: "POST /grants/institutes", payload: { name: "National Test Institute", appropriation_cents: 100000000, reserve_cents: 5000000, indirect_cost_rate: 0.5, select_pay_cap_pct: 0.10, select_pay_extension_percentile: 5.0 }, as: ProgramOfficer, captures: { insti_id: $.data.id, insti_v: $.data.version } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-118", title: "R01 Ledger FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section L", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Ledger app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 1", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r1: $.data.id } }
            - { call: "POST /grants/reviewers/${r1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 2", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r2: $.data.id } }
            - { call: "POST /grants/reviewers/${r2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { a_1: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { a_2: $.data.id } }
            - { call: "POST /grants/assignments/${a_1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${a_2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/study-sections/${sec_id}/convene", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/assignments/${a_1}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${a_2}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/study-sections/${sec_id}/release-scores", payload: {}, as: ScientificReviewOfficer }
