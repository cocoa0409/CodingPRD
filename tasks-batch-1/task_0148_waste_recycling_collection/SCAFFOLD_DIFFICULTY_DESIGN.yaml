          assert:
            - "DiversionPeriod.${dp_id}.total_weight_lbs == 0"
            - "DiversionPeriod.${dp_id}.diversion_rate_pct == 0"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activate_requires_matching_cart_plan_to_cart
        grounds:
          - state_machines.ServicePlan.DRAFT_to_ACTIVE
          - validations[priority=12]
          - errors[ERR_NO_MATCHING_CART]
        distinguishing_aspect: "ServicePlan->Cart pair: a ServicePlan can move DRAFT->ACTIVE only if the account owns a Cart of the same stream in {ASSIGNED, ACTIVE}; with no matching cart the activation fails ERR_NO_MATCHING_CART (409)."
        test_recipe:
          setup:
            - "Account with a DRAFT RECYCLE plan but only a TRASH cart (no RECYCLE cart)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "25 Beech St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "RECYCLE", frequency: "BIWEEKLY", base_monthly_fee_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_MATCHING_CART"
            - "ServicePlan.${plan_id}.status == DRAFT"
      - name: pickup_complete_requires_route_in_progress_pickup_to_route
        grounds:
          - state_machines.Pickup.SCHEDULED_to_COMPLETED
          - entities.Route.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pickup->Route pair (different from ServicePlan->Cart): a Pickup may move SCHEDULED->COMPLETED only when its stop's Route is IN_PROGRESS; completing a pickup whose route is still DISPATCHED fails ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DISPATCHED (not started) route with a SCHEDULED pickup on an ACTIVE cart."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "27 Larch St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-18T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-9" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Pickup.${pk_id}.outcome == SCHEDULED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: diversion_period_half_open_overlap_rejected
        grounds:
          - validations[priority=15]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.DiversionPeriod.fields.period_start
        distinguishing_aspect: "DiversionPeriod interval semantics: half-open [start,end) windows on the same account — a new period [2026-05-15, 2026-06-15) that overlaps an existing [2026-05-01, 2026-06-01) is rejected ERR_PERIOD_OVERLAP, while touching at a shared endpoint is permitted (tested separately in corner design)."
        test_recipe:
          setup:
            - "Account with an existing OPEN DiversionPeriod [2026-05-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "29 Cherry St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/diversion-periods"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: Billing
              captures: { dp1_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/diversion-periods"
              payload: { period_start: "2026-05-15T00:00:00Z", period_end: "2026-06-15T00:00:00Z" }
              as: Billing
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PERIOD_OVERLAP"
      - name: pickup_slot_taken_per_cart_per_stop_rejected
        grounds:
          - validations[priority=16]
          - errors[ERR_PICKUP_SLOT_TAKEN]
          - entities.Pickup.fields.cart_id
        distinguishing_aspect: "Pickup interval semantics differ: not a time interval but a per-cart-per-stop occupancy slot — a second non-CANCELLED Pickup for the same cart at the same stop is rejected ERR_PICKUP_SLOT_TAKEN; the resource is the (Stop, Cart) slot, not a calendar window."
        test_recipe:
          setup:
            - "A PLANNED route with one stop already holding a SCHEDULED pickup for cart C."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "31 Walnut St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /routes"
              payload: { service_date: "2026-05-19T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-10" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
          trigger:
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PICKUP_SLOT_TAKEN"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_issue_then_void_releases_credit_balance_invariant
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.MissedPickupCredit.APPLIED_to_PENDING
        distinguishing_aspect: "Conserved quantity = count of PENDING MissedPickupCredits for the account: issuing an invoice applies a PENDING credit (APPLIED, count of PENDING drops by 1); voiding the same invoice releases it back to PENDING, so the PENDING-credit count returns to its pre-issue value of 1."
        test_recipe:
          setup:
            - "ACTIVE account with one ACTIVE TRASH plan base 0; one PENDING MissedPickupCredit (from a carrier-fault missed pickup, amount 1500); a DRAFT invoice for the period."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "33 Poplar St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 0 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /routes"
              payload: { service_date: "2026-05-20T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-11" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/miss"
              payload: { miss_reason: "TRUCK_FULL" }
              as: Driver
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Billing
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: Billing
          assert:
            - "after void, exactly one MissedPickupCredit for account ${acct_id} is in status PENDING with applied_invoice_id == null"
            - "no MissedPickupCredit for account ${acct_id} remains in status APPLIED"
            - "Invoice.${inv_id}.status == VOID and Invoice.${inv_id}.balance_cents == 0"
      - name: special_schedule_cancel_credit_conserves_account_balance
        grounds:
          - state_machines.SpecialPickup.APPROVED_to_CANCELLED
          - calculations.missed_pickup_credit_amount
          - entities.ServiceAccount.fields.account_balance_cents
        distinguishing_aspect: "Different conserved quantity = ServiceAccount.account_balance_cents: cancelling a SCHEDULED special pickup creates a PENDING credit (1750 for a 3500 bulk quote) but a PENDING credit is NOT in the APPLIED set, so account_balance_cents stays 0 — the credit only changes the balance once an invoice applies it, never on creation."
        test_recipe:
          setup:
            - "ACTIVE account with no issued invoices; an APPROVED+SCHEDULED BULK special pickup (quoted 3500); account_balance_cents == 0."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "35 Sequoia St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/special-pickups"
              payload: { kind: "BULK", requested_date: "2026-05-22T00:00:00Z" }
              as: ResidentAccount
              as_user_id: "${acct_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /special-pickups/${sp_id}/approve"
              payload: {}
              as: Dispatcher
            - call: "POST /special-pickups/${sp_id}/schedule"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /special-pickups/${sp_id}/cancel"
              payload: {}
              as: ResidentAccount
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Billing
              captures: { bal: $.data.account_balance_cents }
          assert:
            - "exactly one MissedPickupCredit exists with source_special_pickup_id == ${sp_id}, amount_cents == 1750, status == PENDING"
            - "ServiceAccount.${acct_id}.account_balance_cents == 0"
