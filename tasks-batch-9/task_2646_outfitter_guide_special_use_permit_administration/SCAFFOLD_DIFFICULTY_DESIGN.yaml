      - name: deduction_cap_floor_boundary
        grounds:
          - validations.priority_12.ERR_DEDUCTIONS_EXCEED_CAP
          - calculations.permit_fee_assessment.constants.DEDUCTION_CAP_PCT
          - entities.TripUseReport.fields.adjusted_gross_revenue_cents
        distinguishing_aspect: |
          METRIC: allowable_deductions_cents against floor(gross_revenue_cents * 0.15) — a floored
          percentage of money, not a day count and not a cumulative tier. ENDPOINT:
          POST /osup/permits/{id}/trip-use-reports, distinct from the screen and amend endpoints
          used by the other boundary instances. Gross revenue of 1000001 cents makes the exact
          product 150000.15, so the cap is 150000: rounding instead of flooring, or comparing with
          the unfloored product, wrongly admits 150001 minus nothing at all. The pass case must
          also show adjusted_gross_revenue_cents computed as the difference, proving the accepted
          value flows into the fee basis.
