          assert:
            - "POST /plants as PlantAdmin answers 201 - PlantAdmin is the ONLY role in that endpoint's roles list, and it is an opaque role so no as_user_id is required or consulted."
            - "POST /cell-designs as DesignEngineer with as_user_id Ada answers 201 with approval_state \"DRAFT\" and revision 1."
            - "POST /production-lots as ProductionSupervisor with as_user_id Cara answers 201 with process_state \"PLANNED\" - Cara is PRODUCTION class, but note that lot creation has NO job-class gate at all: the gate list for this endpoint stops at the acting-worker existence and removal checks."
            - "POST /battery-assemblies/{id}/verifications as QualityInspector with as_user_id Dana answers 200 with torque_status \"PASS\" and certification_status still \"PENDING\" (the insulation axis is untouched)."
            - "POST /workers/{Cara}/exposure-samples as SafetyOfficer with as_user_id Sam answers 201 - the SUBJECT of the sample is a PRODUCTION worker while the ACTOR is the SAFETY worker; the job-class gate applies to the actor only, and triggered_removal is false because the resulting index is far below 100.00."
            - "POST /chargers as FleetEngineer answers 201 with charger_status \"AVAILABLE\" - FleetEngineer is opaque, so no worker row backs it and no job class is checked."
            - "GET /battery-units as WarrantyAdministrator answers 200 with total_count 0 - a shared read is granted to the role even when the collection is empty, and no shipped unit exists in this world."
            - "All seven calls succeed in one session, so no role's success depends on another role's absence."

      - name: shared_reads_are_permitted_to_their_whole_role_list_and_denied_outside_it
        claim_type: shared operation permitted
        grounds:
          - endpoints[GET /production-lots]
          - endpoints[GET /plants/{id}]
          - rbac[FleetEngineer]
        distinguishing_aspect: "GET /production-lots is shared by six of the seven roles and denied to exactly one (FleetEngineer), while GET /plants/{id} is shared by all seven. An implementation that models RBAC as a per-entity read/write matrix - 'production data is readable by production roles' - will either leak the lot list to FleetEngineer or wrongly deny the plant read to it; only the per-endpoint role list gets both right."
