  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: harvest_batch_gated_by_field_maturity_and_quality
        grounds:
          - state_machines.HarvestBatch
          - state_machines.FieldMaturity
          - validations[priority=11]
          - calculations.maturity_classification
        distinguishing_aspect: |
          Entity pair HarvestBatch x Field: batch creation is legal only when
          the FIELD's derived maturity is READY/MATURE and its quality gate
          passes. Same field config, two maturity positions: GROWING (age 60) ->
          ERR_FIELD_NOT_HARVESTABLE; READY (age 61 boundary crossed via planting
          one day earlier) -> 201. A quality-gate flip (moisture 60) on the READY
          field -> ERR_FIELD_QUALITY_GATE.
        test_recipe:
          setup:
            - "Variety with default windows (GROWING <= 60, READY <= 150)"
            - "Field G: last_planted_at 2026-06-02 -> age 60 at clock 2026-08-01 -> GROWING"
            - "Field R: last_planted_at 2026-06-01 -> age 61 -> READY, quality passing; later PATCHed to soil_moisture_pct 60 (outside [35,55])"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
