        distinguishing_aspect: "Notice lead of exactly 72h (notice posted 2026-05-29T18:00:00Z, start 2026-06-01T18:00:00Z) is compliant under the >= boundary for REGULAR; convene succeeds. Metric = hours; endpoint = convene."
