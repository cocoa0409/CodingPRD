        claim_type: cascading_validation
        grounds:
          - validations[priority=6].ERR_<RESOURCE>_NOT_FOUND
          - validations[priority=10].ERR_STALE_VERSION
          - concurrency_rules.booking-create-stale-order
          - endpoints[POST /slot-bookings]
        distinguishing_aspect: "Priority 6 must run to completion before priority 10 is even evaluated, and it resolves body foreign keys in the declared input order: with a bogus delivery_slot_id AND a bogus customer_order_id AND a stale expected_order_version in one request, the answer is ERR_SLOT_NOT_FOUND (404) -- not ERR_ORDER_NOT_FOUND and not ERR_STALE_VERSION (412). Repairing only the ids exposes the stale version, and repairing the version too finally books."
