        distinguishing_aspect: "Effective windows use half-open overlap: a card overlapping an existing one is rejected, while a card starting exactly at another's end is accepted; rejected creations consume no card_version."
        test_recipe:
          setup: ["Card RC1 effective [2026-01-01, 2026-07-01)"]
          setup_api_calls:
            - call: "POST /api/rate-cards"
              payload: { effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z", cold_held_fmv_cents_per_lb: 300, cold_held_basis_cents_per_lb: 100, hot_held_fmv_cents_per_lb: 250, hot_held_basis_cents_per_lb: 90, produce_fmv_cents_per_lb: 180, produce_basis_cents_per_lb: 60, shelf_stable_fmv_cents_per_lb: 120, shelf_stable_basis_cents_per_lb: 50 }
              as: DispatchAdmin
              captures: { rc1_ver: "$.data.card_version" }
          trigger:
            - call: "POST /api/rate-cards"
              payload: { effective_start: "2026-06-15T00:00:00Z", effective_end: "2026-08-01T00:00:00Z", cold_held_fmv_cents_per_lb: 310, cold_held_basis_cents_per_lb: 100, hot_held_fmv_cents_per_lb: 250, hot_held_basis_cents_per_lb: 90, produce_fmv_cents_per_lb: 180, produce_basis_cents_per_lb: 60, shelf_stable_fmv_cents_per_lb: 120, shelf_stable_basis_cents_per_lb: 50 }
              as: DispatchAdmin
              captures: { e_overlap: $.data.error_id }
            - call: "POST /api/rate-cards"
              payload: { effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", cold_held_fmv_cents_per_lb: 310, cold_held_basis_cents_per_lb: 100, hot_held_fmv_cents_per_lb: 250, hot_held_basis_cents_per_lb: 90, produce_fmv_cents_per_lb: 180, produce_basis_cents_per_lb: 60, shelf_stable_fmv_cents_per_lb: 120, shelf_stable_basis_cents_per_lb: 50 }
              as: DispatchAdmin
              captures: { rc2_ver: "$.data.card_version" }
          assert:
            - "rc1_ver == 1"
            - "e_overlap == ERR_RATE_CARD_WINDOW_OVERLAP ([2026-06-15, 2026-08-01) intersects RC1)"
            - "rc2_ver == 2 (adjacent start == RC1.end allowed; the rejected creation consumed no version)"

