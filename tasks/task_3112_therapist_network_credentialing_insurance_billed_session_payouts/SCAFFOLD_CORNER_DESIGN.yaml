              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "PATCH /network/payers/${payer_id}"
              payload: { status: "SUSPENDED_AT_PAYER" }
              as: OpsAdmin
              captures: { status_in_response: $.data.status }
            - call: "GET /network/payers/${payer_id}"
              payload: {}
              as: OpsAdmin
              captures: { status_on_read: $.data.status }
            - call: "POST /network/payer-enrollments/${enrollment_id}/reinstate"
              payload: {}
              as: OpsAdmin
              captures: { reinstate_error: $.data.error_id }
          assert:
            - "the patch response itself carries ${status_in_response} == SUSPENDED_AT_PAYER"
            - "the follow-up read returns ${status_on_read} == SUSPENDED_AT_PAYER, agreeing with the response"
            - "PayerEnrollment.${enrollment_id}.status == SUSPENDED, so the cascade was applied within the same request"
            - "Clinician.${clinician_id}.billing_posture == FROZEN, also within the same request"
            - "the reinstate is refused with ${reinstate_error} == ERR_INVALID_STATE, because a suspended enrollment cannot return to EFFECTIVE while its payer is suspended"

      - name: payer_termination_is_a_saga_that_denies_claims_and_adjusts_the_payout_line
        claim_type: consistency_model_saga
        grounds:
