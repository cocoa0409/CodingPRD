      - name: clock_rewind_rejected_while_equal_timestamp_is_accepted
        claim_type: temporal
        grounds:
          - validations[priority=35]
          - errors[ERR_CLOCK_REWIND]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The logical clock is monotonic but not strictly increasing: a request one day earlier than the
          stored clock is refused with 409 ERR_CLOCK_REWIND, while re-setting the clock to exactly the
          stored value is accepted as a forward no-op.
        test_recipe:
          setup:
            - "The logical clock has been set once to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T00:00:00Z" }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "the first call returns HTTP 409 with data.error_id == ERR_CLOCK_REWIND"
            - "the second call returns HTTP 200 with data.current_utc == 2026-08-01T00:00:00Z"
            - "the stored clock is still 2026-08-01T00:00:00Z"

      - name: duplicate_reviewer_email_rejected
