    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: Contract
    side_effects: ["resolves the open AlarmReductionAction of type SERVICE_REQUIRED", "re-provisions the monitoring account to PROVISIONED", "increments Contract.version by 1 and MonitoringAccount.version by 1"]
