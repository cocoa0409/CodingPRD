              payload: {}
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /repair-orders/${ro_b_id}/cancel"
              payload: { cancel_reason: "customer declined the second rework quote" }
              as: PlantManager
          assert:
            - "ApprovedPart.${part_id}.received_qty == 10"
            - "ApprovedPart.${part_id}.on_hand_qty == 6"
            - "ApprovedPart.${part_id}.reserved_qty == 0"
            - "ApprovedPart.${part_id}.consumed_qty == 4"
            - "ApprovedPart.${part_id}.on_hand_qty + ApprovedPart.${part_id}.reserved_qty + ApprovedPart.${part_id}.consumed_qty == 10"
            - "RepairOrder.${ro_b_id}.status == CANCELLED"
            - "RepairOrder.${ro_b_id}.reserved_parts_cents == 0"
            - "RepairOrder.${ro_b_id}.installed_parts_cents == 0"
            - "RepairOrder.${ro_a_id}.status == INSTALLED"
            - "RepairOrder.${ro_a_id}.installed_parts_cents == 18000"
            - "EquipmentUnit.${u1_id}.recon_status == REPAIR_PENDING"

