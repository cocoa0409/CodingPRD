      - name: the_same_noise_figure_passes_or_fails_depending_only_on_the_closure_flag
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_84
          - validations.priority_85
          - errors.ERR_NOISE_LIMIT_EXCEEDED
          - errors.ERR_ZONE_CLOSED_FOR_WORK
        distinguishing_aspect: |
          This is a conditional validation whose predicate is a request field, not a
          stored one: 95 dBA against a 85 dBA zone ceiling is fatal for an open
          gallery and perfectly legal once the gallery is closed, because with no
          visitors present the ceiling does not exist. The two windows are otherwise
          identical - same zone, same work class, same instants - so nothing but
          requires_gallery_closure can explain the different outcomes. The second
          pair inverts the asymmetry: setting the flag is not free, because a zone
          with closure_allowed == false refuses the closure at priority 85 even
          though its noise figure of 50 dBA is comfortably under the same ceiling.
          The cancel in between also proves a REQUESTED window occupies the zone
          calendar until it is cancelled.
