scenario: "2156. Accessory Dwelling Unit Design-Build (California ADU builder): feasibility screening (zoning/setback/utility capacity), design package & permit submittal by jurisdiction, financing option guidance & appraisal challenges, utility separation vs shared metering decision, construction sequencing on occupied property, inspection scheduling & final certificate, rental readiness & short-term rental restriction check, homeowner change orders — difficulty: harder than expert level"
domain_name: adu-design-build
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer collections joined by explicit foreign keys, plus two self-referential
  # edges (ChangeOrder.supersedes_change_order_id, ConstructionPhase.depends_on_phase_id)
  # and cross-aggregate edges (InspectionAppointment -> Inspector, which lives under
  # Jurisdiction, not under AduProject). No nesting deeper than one level in URL paths.

  state_machine_shape: cyclic
  # PermitSubmittal loops UNDER_PLAN_CHECK -> CORRECTIONS_REQUIRED -> UNDER_PLAN_CHECK
  # (plan-check correction rounds); ChangeOrder loops DRAFT -> SUBMITTED ->
  # REVISION_REQUESTED -> DRAFT; AduProject carries two independent state axes
  # (status x financing_state) that advance on unrelated triggers.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The Inspector who recorded a phase inspection result may not record the FINAL
  # inspection on the same project; the Homeowner authors change orders but may
  # never decide them; the ProjectManager decides them but may never author them.

  consistency_model: immediate

  difficulty_calibration: |
    Explicitly calibrated ABOVE the Expert band of §0.4 at the user's request
    ("harder than expert level"): 13 entities, 51 endpoints, 49 error codes,
    6 calculations (two of them dual-variant across different entity domains,
    three combinatorial across all three §0.5 Rule-2 modes), 7 state machines
    (three non-linear: two cyclic + one parallel-dimension), a depth-4 cascade
    and a depth-3 cascade from different triggers, two overlap regimes with
    different interval semantics on different resource entities, and three
    OCC-guarded create endpoints on two different parent entities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the permitting jurisdiction (city or county).
      - name: code
        type: string
        source: input
        description: Short jurisdiction code; unique across all Jurisdiction rows.
        constraints: "2-8 characters, uppercase A-Z and digits only; UNIQUE"
      - name: local_max_detached_sqft
        type: integer
        source: input
        description: Maximum detached-ADU floor area the local ordinance allows.
        constraints: ">= 150"
      - name: local_rear_setback_ft
        type: number
        source: input
        description: Rear setback the local ordinance requires, in feet.
        constraints: ">= 0"
      - name: local_side_setback_ft
        type: number
        source: input
        description: Side setback the local ordinance requires, in feet.
        constraints: ">= 0"
      - name: local_max_height_ft
        type: number
        source: input
        description: Maximum ADU height the local ordinance allows, in feet.
        constraints: "> 0"
      - name: correction_response_days
        type: integer
        source: input
        description: Calendar days an applicant has to resubmit after a corrections letter.
        default: 60
        constraints: ">= 1"
      - name: plan_check_base_fee_cents
        type: integer
        source: input
        description: Flat plan-check fee component, in cents.
        constraints: ">= 0"
      - name: plan_check_rate_per_sqft_cents
        type: integer
        source: input
        description: Per-square-foot plan-check rate, in cents.
        constraints: ">= 0"
      - name: impact_fee_per_sqft_cents
        type: integer
        source: input
        description: Per-square-foot development impact fee rate, in cents.
        constraints: ">= 0"
      - name: utility_capacity_fee_cents
        type: integer
        source: input
        description: Jurisdiction charge for a new separate utility service connection, in cents.
        constraints: ">= 0"
      - name: separate_meter_required
        type: boolean
        source: input
        description: True when the ordinance forbids shared metering for new detached ADUs.
        default: false
      - name: str_min_lease_days
        type: integer
        source: input
        description: Minimum lease term in days the ordinance imposes on ADU rentals.
        default: 30
        constraints: ">= 1"
      - name: str_prohibited
        type: boolean
        source: input
        description: True when the ordinance bars short-term rental of ADUs outright.
        default: false

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction that employs this inspector."
      - name: full_name
        type: string
        source: input
        description: Inspector's name as printed on inspection cards.
      - name: certifications
        type: array
        source: input
        description: Disciplines this inspector may sign off.
        constraints: "non-empty array; members drawn from {STRUCTURAL, ELECTRICAL, PLUMBING, ENVELOPE, FINAL}"
      - name: daily_capacity
        type: integer
        source: input
        description: Maximum inspection appointments this inspector may hold on one calendar date.
        default: 4
        constraints: ">= 1 and <= 12"
      - name: status
        type: enum
        source: input
        description: Whether the inspector may take new appointments.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction the parcel sits in."
      - name: address_line
        type: string
        source: input
        description: Street address of the parcel.
      - name: lot_sqft
        type: integer
        source: input
        description: Total lot area in square feet.
        constraints: "> 0"
      - name: existing_dwelling_sqft
        type: integer
        source: input
        description: Floor area of the existing primary dwelling, in square feet.
        constraints: "> 0"
      - name: occupied
        type: boolean
        source: input
        description: True when the primary dwelling is occupied during construction.
        default: true
      - name: in_str_overlay
        type: boolean
        source: input
        description: True when the parcel sits in a short-term-rental restriction overlay.
        default: false
      - name: electrical_service_amps
        type: integer
        source: input
        description: Existing main electrical service size in amps.
        constraints: "one of {100, 125, 150, 200, 400}"
      - name: existing_water_meter_size_in
        type: number
        source: input
        description: Existing domestic water meter size in inches.
        constraints: "one of {0.625, 0.75, 1.0, 1.5}"
      - name: pre_adu_value_cents
        type: integer
        source: input
        description: Appraised value of the property before the ADU, in cents.
        constraints: "> 0"
      - name: existing_mortgage_balance_cents
        type: integer
        source: input
        description: Outstanding first-lien balance, in cents.
        default: 0
        constraints: ">= 0"

  - name: AduProject
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel this ADU is being built on."
      - name: unit_type
        type: enum
        source: input
        description: Construction type of the accessory unit.
        constraints: "one of {DETACHED_NEW, ATTACHED, CONVERSION, JADU}"
      - name: proposed_sqft
        type: integer
        source: input
        description: Proposed conditioned floor area of the ADU, in square feet.
        constraints: ">= 150 and <= 1200"
      - name: proposed_height_ft
        type: number
        source: input
        description: Proposed ridge height above grade, in feet.
        constraints: "> 0 and <= 35"
      - name: rear_setback_ft
        type: number
        source: input
        description: Proposed rear setback, in feet.
        constraints: ">= 0"
      - name: side_setback_ft
        type: number
        source: input
        description: Proposed side setback, in feet.
        constraints: ">= 0"
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count of the proposed unit.
        constraints: ">= 0 and <= 4"
      - name: contract_base_price_cents
        type: integer
        source: input
        description: Signed design-build contract price before any change order, in cents.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle axis of the project.
        default: INTAKE
        constraints: "one of {INTAKE, FEASIBILITY_CLEARED, PERMITTING, DESIGN_REVISION, PERMITTED, UNDER_CONSTRUCTION, FINALED}"
      - name: financing_state
        type: enum
        source: system
        description: Funding axis of the project; advances independently of `status`.
        default: UNFUNDED
        constraints: "one of {UNFUNDED, PRE_QUALIFIED, COMMITTED, SHORTFALL}"
      - name: approved_pathway
        type: enum
        source: system
        description: Feasibility pathway locked in at pathway selection; null until then.
        default: null
        constraints: "null or one of {STATUTORY_MINISTERIAL, LOCAL_ORDINANCE}"
      - name: max_allowed_sqft
        type: integer
        source: computed
        description: Maximum floor area permitted under `approved_pathway`; copied from the selected FeasibilityScreening.
        default: 0
      - name: contract_price_current_cents
        type: integer
        source: computed
        description: Contract price after all APPROVED change orders; see calculations.change_order_price_reconciliation.
        default: 0
      - name: approved_change_days
        type: integer
        source: computed
        description: Sum of schedule_delta_days over ChangeOrder rows of this project with status == APPROVED.
        default: 0
      - name: approved_change_order_count
        type: integer
        source: computed
        description: Count of ChangeOrder rows of this project with status == APPROVED.
        default: 0
      - name: total_permit_fee_cents
        type: integer
        source: computed
        description: total_permit_fee_cents of the project's most recently APPROVED PermitSubmittal (created_at DESC among APPROVED rows, first row); 0 until the first approval.
        default: 0

  - name: FeasibilityScreening
    parent: AduProject
    common_fields: false
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project this screening was run against."
      - name: pathway
        type: enum
        source: input
        description: Which rule set the screening was evaluated under.
        constraints: "one of {STATUTORY_MINISTERIAL, LOCAL_ORDINANCE}"
      - name: max_allowed_sqft
        type: integer
        source: computed
        description: Floor-area ceiling under `pathway`; see calculations.feasibility_screening.
      - name: required_rear_setback_ft
        type: number
        source: computed
        description: Rear setback the chosen pathway demands, in feet.
      - name: required_side_setback_ft
        type: number
        source: computed
        description: Side setback the chosen pathway demands, in feet.
      - name: required_height_ft
        type: number
        source: computed
        description: Height ceiling the chosen pathway demands, in feet.
      - name: required_service_amps
        type: integer
        source: computed
        description: Electrical service the ADU load requires, from the sqft tier table.
      - name: zoning_ok
        type: boolean
        source: computed
        description: True when proposed_sqft <= max_allowed_sqft.
      - name: setback_ok
        type: boolean
        source: computed
        description: True when both proposed setbacks meet the pathway's requirements.
      - name: height_ok
        type: boolean
        source: computed
        description: True when proposed_height_ft <= required_height_ft.
      - name: utility_capacity_ok
        type: boolean
        source: computed
        description: True when the parcel's existing electrical and water service can carry the ADU load.
      - name: verdict
        type: enum
        source: computed
        description: Screening outcome.
        constraints: "one of {PASS, PASS_WITH_CONDITIONS, FAIL}"
      - name: deficiency_codes
        type: array
        source: computed
        description: Sorted list of failed-check codes; members drawn from {ZONING, SETBACK, HEIGHT, UTILITY_CAPACITY}.

  - name: UtilityConnection
    parent: AduProject
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project this service connection belongs to."
      - name: service_type
        type: enum
        source: input
        description: Which utility service this row governs; unique per project.
        constraints: "one of {WATER, SEWER, ELECTRIC}; UNIQUE per (adu_project_id, service_type)"
      - name: status
        type: enum
        source: system
        description: Connection lifecycle.
        default: PENDING_DECISION
        constraints: "one of {PENDING_DECISION, SEPARATE_APPROVED, SHARED_APPROVED, ENERGIZED}"
      - name: decision
        type: enum
        source: computed
        description: Separate service versus shared metering; null until the decide action runs.
        default: null
        constraints: "null or one of {SEPARATE, SHARED}"
      - name: separation_score
        type: integer
        source: computed
        description: Score from calculations.utility_separation_decision; 0 before the decide action runs.
        default: 0
      - name: separation_cost_cents
        type: integer
        source: computed
        description: Cost of the chosen metering arrangement, in cents; 0 before the decide action runs.
        default: 0
      - name: override_decision
        type: enum
        source: input
        description: Operator override supplied on the decide action; when present it replaces the scored decision.
        default: null
        constraints: "null or one of {SEPARATE, SHARED}"
      - name: energized_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) on which the connection was energized; null before then.
        default: null

  - name: PermitSubmittal
    parent: AduProject
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project whose design package this submittal carries."
      - name: design_sheet_count
        type: integer
        source: input
        description: Number of sheets in the design package submitted to the jurisdiction.
        constraints: ">= 1"
      - name: title24_compliant
        type: boolean
        source: input
        description: True when the package includes a passing Title 24 energy compliance report.
      - name: design_revision
        type: integer
        source: system
        description: Design package revision number; starts at 1 and increments on every resubmit.
        default: 1
      - name: status
        type: enum
        source: system
        description: Plan-check lifecycle of this submittal.
        default: PREPARED
        constraints: "one of {PREPARED, UNDER_PLAN_CHECK, CORRECTIONS_REQUIRED, APPROVED, EXPIRED}"
      - name: cycle_number
        type: integer
        source: system
        description: Number of plan-check rounds this submittal has entered; 0 while PREPARED.
        default: 0
      - name: submitted_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) of the first submit; null while PREPARED.
        default: null
      - name: correction_deadline_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) by which a resubmit must occur; null unless status == CORRECTIONS_REQUIRED.
        default: null
      - name: plan_check_component_cents
        type: integer
        source: computed
        description: Rounded plan-check fee component, in cents.
      - name: impact_component_cents
        type: integer
        source: computed
        description: Rounded development impact fee component, in cents.
      - name: school_component_cents
        type: integer
        source: computed
        description: Rounded school facilities fee component, in cents.
      - name: utility_component_cents
        type: integer
        source: computed
        description: Sum of separation_cost_cents over the project's decided UtilityConnection rows, in cents.
      - name: total_permit_fee_cents
        type: integer
        source: computed
        description: Sum of the four rounded fee components, in cents.
      - name: approved_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) the permit was approved; null otherwise.
        default: null

  - name: CorrectionItem
    parent: PermitSubmittal
    common_fields: true
    fields:
      - name: permit_submittal_id
        type: string
        source: input
        description: "FK -> PermitSubmittal.id; the submittal this correction belongs to."
      - name: discipline
        type: enum
        source: input
        description: Plan-check discipline that raised the correction.
        constraints: "one of {STRUCTURAL, ENERGY, FIRE, PLANNING, UTILITY}"
      - name: severity
        type: enum
        source: input
        description: BLOCKING corrections must be resolved before a resubmit; ADVISORY ones need not be.
        constraints: "one of {BLOCKING, ADVISORY}"
      - name: description
        type: string
        source: input
        description: Plan checker's correction text.
      - name: status
        type: enum
        source: system
        description: Whether the correction has been addressed.
        default: OPEN
        constraints: "one of {OPEN, RESOLVED}"
      - name: resolved_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) the correction was resolved; null while OPEN.
        default: null

  - name: FinancingScenario
    parent: AduProject
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project being financed."
      - name: product_type
        type: enum
        source: input
        description: Loan product under consideration.
        constraints: "one of {HELOC, CASH_OUT_REFI, RENOVATION_LOAN, CONSTRUCTION_LOAN}"
      - name: appraisal_approach
        type: enum
        source: input
        description: Valuation approach the appraiser used for the as-completed value.
        constraints: "one of {SALES_COMPARISON, INCOME_CAPITALIZATION}"
      - name: comparable_adjustment_cents
        type: integer
        source: input
        description: Contributory value the appraiser assigned to the ADU under the sales-comparison approach, in cents.
        constraints: ">= 0"
      - name: projected_monthly_rent_cents
        type: integer
        source: input
        description: Projected market rent for the completed ADU, in cents per month.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Scenario lifecycle; creating a new scenario supersedes the prior ACTIVE one.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, COMMITTED}"
      - name: as_completed_value_cents
        type: integer
        source: computed
        description: As-completed property value under `appraisal_approach`, in cents.
      - name: max_loan_cents
        type: integer
        source: computed
        description: Maximum lendable amount at the platform LTV ceiling, in cents.
      - name: available_cents
        type: integer
        source: computed
        description: max_loan_cents minus the property's existing first-lien balance, in cents.
      - name: required_funds_cents
        type: integer
        source: computed
        description: Contract price plus permit fees plus soft-cost contingency, in cents.
      - name: funding_gap_cents
        type: integer
        source: computed
        description: Shortfall between required_funds_cents and available_cents, floored at 0, in cents.
      - name: appraisal_shortfall
        type: boolean
        source: computed
        description: True when the as-completed value fails to cover the pre-ADU value plus required funds.

  - name: ChangeOrder
    parent: AduProject
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project whose contract this change order amends."
      - name: supersedes_change_order_id
        type: string
        source: input
        description: "FK -> ChangeOrder.id; the earlier change order this one replaces, or null."
        default: null
      - name: title
        type: string
        source: input
        description: Short label for the requested change.
      - name: scope_items
        type: array
        source: input
        description: Free-text scope lines the homeowner is adding or removing.
        constraints: "array of strings"
      - name: cost_delta_cents
        type: integer
        source: input
        description: Signed change in hard cost, in cents; negative values are credits.
      - name: schedule_delta_days
        type: integer
        source: input
        description: Signed change in construction duration, in days.
        constraints: ">= -30 and <= 120"
      - name: status
        type: enum
        source: system
        description: Change-order lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, REJECTED, VOIDED}"
      - name: builder_fee_cents
        type: integer
        source: computed
        description: Builder markup on cost_delta_cents at the tier in force when the change order was approved; 0 unless status == APPROVED.
        default: 0
      - name: cumulative_change_pct_before
        type: number
        source: computed
        description: Cumulative change percentage against contract_base_price_cents measured immediately before this approval; 0 unless approved.
        default: 0
      - name: cumulative_change_pct_after
        type: number
        source: computed
        description: Cumulative change percentage against contract_base_price_cents immediately after this approval; 0 unless approved.
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the Homeowner who created the change order.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectManager who decided the change order; null while undecided.
        default: null

  - name: ConstructionPhase
    parent: AduProject
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project this phase belongs to."
      - name: depends_on_phase_id
        type: string
        source: input
        description: "FK -> ConstructionPhase.id; the phase that must reach COMPLETE before this one may start, or null."
        default: null
      - name: phase_code
        type: enum
        source: input
        description: Which construction phase this row represents.
        constraints: "one of {SITE_PREP, FOUNDATION, FRAMING, ROUGH_MEP, UTILITY_TIE_IN, INSULATION_DRYWALL, FINISHES}"
      - name: disruption_class
        type: enum
        source: input
        description: How disruptive the phase is to an occupied primary dwelling.
        constraints: "one of {NON_INVASIVE, INVASIVE, UTILITY_SHUTOFF}"
      - name: sequence_index
        type: integer
        source: input
        description: Builder's intended ordering index within the project.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Phase lifecycle.
        default: PLANNED
        constraints: "one of {PLANNED, SCHEDULED, BLOCKED, IN_PROGRESS, COMPLETE}"
      - name: window_start_date
        type: string
        source: system
        description: Inclusive first date (YYYY-MM-DD) of the occupancy-disrupting window; null unless SCHEDULED, IN_PROGRESS or COMPLETE.
        default: null
      - name: window_end_date
        type: string
        source: system
        description: Inclusive last date (YYYY-MM-DD) of the window; null unless SCHEDULED, IN_PROGRESS or COMPLETE.
        default: null
      - name: started_on_date
        type: string
        source: system
        description: Logical-clock date the phase started; null before then.
        default: null
      - name: completed_on_date
        type: string
        source: system
        description: Logical-clock date the phase completed; null before then.
        default: null

  - name: InspectionAppointment
    parent: ConstructionPhase
    common_fields: true
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; denormalized project pointer copied from the phase at creation."
      - name: construction_phase_id
        type: string
        source: input
        description: "FK -> ConstructionPhase.id; the phase being inspected."
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; the jurisdiction inspector holding the slot."
      - name: inspection_type
        type: enum
        source: input
        description: Which inspection this appointment covers.
        constraints: "one of {FOUNDATION, FRAMING, ROUGH_MEP, INSULATION, FINAL}"
      - name: slot_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the slot; must equal the date part of slot_start.
      - name: slot_start
        type: datetime
        source: input
        description: Inclusive start of the half-open appointment interval, ISO 8601 UTC.
      - name: slot_end
        type: datetime
        source: input
        description: Exclusive end of the half-open appointment interval, ISO 8601 UTC.
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PARTIAL, PASSED, FAILED, CANCELLED}"
      - name: result_notes
        type: string
        source: system
        description: Inspector's note recorded with the result; null while SCHEDULED.
        default: null
      - name: recorded_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the inspector who recorded the result, taken from X-User-ID; null while SCHEDULED."
        default: null

  - name: OccupancyCertificate
    parent: AduProject
    common_fields: false
    fields:
      - name: adu_project_id
        type: string
        source: input
        description: "FK -> AduProject.id; the project being finaled."
      - name: certificate_number
        type: string
        source: system
        description: 'Jurisdiction.code, a hyphen, and the issue sequence within that jurisdiction: the count of OccupancyCertificate rows already issued whose project sits in the same Jurisdiction, plus 1 — e.g. "SNVL-1" for the first.'
      - name: issued_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) the certificate was issued.
      - name: final_inspection_passed_at
        type: datetime
        source: system
        description: slot_end of the FINAL InspectionAppointment whose status is PASSED, in ISO 8601 UTC.
      - name: rental_classification
        type: enum
        source: computed
        description: Rental posture of the finished unit; see calculations.rental_readiness_check.
        constraints: "one of {LONG_TERM_ONLY, SHORT_TERM_PERMITTED, RENTAL_PROHIBITED}"
      - name: min_lease_days
        type: integer
        source: computed
        description: Shortest lease term the unit may legally be rented for.
      - name: rental_ready
        type: boolean
        source: computed
        description: True when the unit may be advertised for rent immediately.
      - name: blocking_reasons
        type: array
        source: computed
        description: Sorted list of readiness blockers; members drawn from {JADU_OWNER_OCCUPANCY_REQUIRED, OPEN_CHANGE_ORDERS, STR_OVERLAY_RESTRICTED}.

state_machines:
  # ---------------------------------------------------------------------
  # AduProject carries TWO independent state axes on the same row:
  #   `status`          — design/permit/build lifecycle
  #   `financing_state` — funding lifecycle
  # They advance on unrelated triggers and never gate each other except
  # where a transition's preconditions say so explicitly.
  # ---------------------------------------------------------------------
  - entity: AduProject
    dimension: status
    initial_state: INTAKE
    terminal_states: [FINALED]
    transitions:
      - from: INTAKE
        to: FEASIBILITY_CLEARED
        trigger: "POST /adu-projects/{id}/select-pathway"
        actor: DesignLead
        preconditions:
          - "AduProject.status == INTAKE"
          - "the FeasibilityScreening named by screening_id has adu_project_id == this project"
          - "that screening's verdict IN {PASS, PASS_WITH_CONDITIONS} (a FAIL screening is rejected with ERR_FEASIBILITY_FAILED)"
        side_effects:
          - "sets AduProject.approved_pathway = screening.pathway"
          - "sets AduProject.max_allowed_sqft = screening.max_allowed_sqft"
          - "increments AduProject.version by 1"
      - from: FEASIBILITY_CLEARED
        to: PERMITTING
        trigger: "system, caused by PermitSubmittal PREPARED -> UNDER_PLAN_CHECK (POST /permit-submittals/{id}/submit)"
        actor: system
        preconditions:
          - "AduProject.status == FEASIBILITY_CLEARED"
        side_effects:
          - "increments AduProject.version by 1"
      - from: PERMITTED
        to: PERMITTING
        trigger: "system, caused by a later PermitSubmittal PREPARED -> UNDER_PLAN_CHECK (a deferred-submittal or permit-revision package filed after the original permit issued)"
        actor: system
        preconditions:
          - "AduProject.status == PERMITTED"
        side_effects:
          - "increments AduProject.version by 1"
        note: "Closes the permit cycle PERMITTED -> PERMITTING -> PERMITTED; already-SCHEDULED construction phases stay scheduled until a corrections letter blocks them."
      - from: UNDER_CONSTRUCTION
        to: PERMITTING
        trigger: "system, caused by a later PermitSubmittal PREPARED -> UNDER_PLAN_CHECK while the build is running"
        actor: system
        preconditions:
          - "AduProject.status == UNDER_CONSTRUCTION"
        side_effects:
          - "increments AduProject.version by 1"
      - from: PERMITTING
        to: DESIGN_REVISION
        trigger: "system, caused by PermitSubmittal UNDER_PLAN_CHECK -> CORRECTIONS_REQUIRED (cascade link 2 of transitive_cascade.plan_check_corrections_chain)"
        actor: system
        preconditions:
          - "AduProject.status == PERMITTING"
        side_effects:
          - "because the project left PERMITTING, every ConstructionPhase of this project with status == SCHEDULED transitions SCHEDULED -> BLOCKED, processed in created_at ASC order (cascade link 3)"
          - "increments AduProject.version by 1"
      - from: DESIGN_REVISION
        to: PERMITTING
        trigger: "system, caused by PermitSubmittal CORRECTIONS_REQUIRED -> UNDER_PLAN_CHECK (POST /permit-submittals/{id}/resubmit)"
        actor: system
        preconditions:
          - "AduProject.status == DESIGN_REVISION"
        side_effects:
          - "increments AduProject.version by 1"
        note: "This is the cycle: PERMITTING -> DESIGN_REVISION -> PERMITTING repeats once per plan-check correction round."
      - from: PERMITTING
        to: PERMITTED
        trigger: "system, caused by PermitSubmittal UNDER_PLAN_CHECK -> APPROVED (POST /permit-submittals/{id}/plan-check-result with outcome APPROVED)"
        actor: system
        preconditions:
          - "AduProject.status == PERMITTING"
        side_effects:
          - "sets AduProject.total_permit_fee_cents = the approved submittal's total_permit_fee_cents"
          - "increments AduProject.version by 1"
      - from: PERMITTED
        to: UNDER_CONSTRUCTION
        trigger: "system, caused by the project's first ConstructionPhase SCHEDULED -> IN_PROGRESS (POST /construction-phases/{id}/start)"
        actor: system
        preconditions:
          - "AduProject.status == PERMITTED"
        side_effects:
          - "increments AduProject.version by 1"
      - from: UNDER_CONSTRUCTION
        to: FINALED
        trigger: "system, caused by OccupancyCertificate creation (POST /adu-projects/{id}/occupancy-certificate)"
        actor: system
        preconditions:
          - "AduProject.status == UNDER_CONSTRUCTION"
        side_effects:
          - "increments AduProject.version by 1"

  - entity: AduProject
    dimension: financing_state
    initial_state: UNFUNDED
    terminal_states: []
    transitions:
      - from: UNFUNDED
        to: PRE_QUALIFIED
        trigger: "POST /adu-projects/{id}/financing-scenarios"
        actor: FinanceAdvisor
        preconditions:
          - "expected_adu_project_version equals AduProject.version"
        side_effects:
          - "any existing FinancingScenario of this project with status == ACTIVE moves to SUPERSEDED"
          - "the new FinancingScenario is created with status ACTIVE and its calculations.financing_capacity outputs stamped"
          - "increments AduProject.version by 1"
        note: "Only fires when financing_state == UNFUNDED; from PRE_QUALIFIED, COMMITTED or SHORTFALL the axis is left unchanged by scenario creation."
      - from: PRE_QUALIFIED
        to: COMMITTED
        trigger: "POST /financing-scenarios/{id}/commit"
        actor: FinanceAdvisor
        preconditions:
          - "FinancingScenario.status == ACTIVE (else ERR_SCENARIO_STATE_INVALID)"
          - "FinancingScenario.funding_gap_cents == 0 (else ERR_FUNDING_GAP_OPEN)"
        side_effects:
          - "any other FinancingScenario of this project with status == COMMITTED moves to SUPERSEDED, so a project holds AT MOST ONE COMMITTED scenario at any time"
          - "sets FinancingScenario.status = COMMITTED"
          - "increments FinancingScenario.version by 1 and AduProject.version by 1"
      - from: SHORTFALL
        to: COMMITTED
        trigger: "POST /financing-scenarios/{id}/commit on a newly priced scenario"
        actor: FinanceAdvisor
        preconditions:
          - "FinancingScenario.status == ACTIVE (else ERR_SCENARIO_STATE_INVALID)"
          - "FinancingScenario.funding_gap_cents == 0 (else ERR_FUNDING_GAP_OPEN)"
        side_effects:
          - "the project's previously COMMITTED scenario moves to SUPERSEDED; the newly committed one becomes the project's single COMMITTED scenario"
          - "sets FinancingScenario.status = COMMITTED"
          - "increments FinancingScenario.version by 1 and AduProject.version by 1"
        note: "A homeowner who re-shops the loan after a change order pushed the project into SHORTFALL closes the gap this way, rather than by voiding the change order."
      - from: COMMITTED
        to: SHORTFALL
        trigger: "system, caused by AduProject.contract_price_current_cents changing on ChangeOrder SUBMITTED -> APPROVED (cascade link 3 of transitive_cascade.change_order_funding_chain)"
        actor: system
        preconditions:
          - "AduProject.financing_state == COMMITTED"
          - "the project's single FinancingScenario with status == COMMITTED (at most one exists per project) recomputes funding_gap_cents > 0"
        side_effects:
          - "rewrites that scenario's required_funds_cents and funding_gap_cents"
          - "increments AduProject.version by 1"
      - from: SHORTFALL
        to: COMMITTED
        trigger: "system, caused by AduProject.contract_price_current_cents changing on ChangeOrder APPROVED -> VOIDED (POST /change-orders/{id}/void)"
        actor: system
        preconditions:
          - "AduProject.financing_state == SHORTFALL"
          - "the project's single FinancingScenario with status == COMMITTED (at most one exists per project) recomputes funding_gap_cents == 0"
        side_effects:
          - "rewrites that scenario's required_funds_cents and funding_gap_cents"
          - "increments AduProject.version by 1"
        note: "This closes the financing cycle COMMITTED -> SHORTFALL -> COMMITTED."

  - entity: PermitSubmittal
    initial_state: PREPARED
    terminal_states: [APPROVED, EXPIRED]
    transitions:
      - from: PREPARED
        to: UNDER_PLAN_CHECK
        trigger: "POST /permit-submittals/{id}/submit"
        actor: DesignLead
        preconditions:
          - "PermitSubmittal.status == PREPARED"
          - "PermitSubmittal.title24_compliant == true (else ERR_TITLE24_MISSING)"
          - "AduProject.status IN {FEASIBILITY_CLEARED, PERMITTED, UNDER_CONSTRUCTION} (else ERR_PROJECT_PHASE_INVALID)"
          - "every UtilityConnection of the project has status != PENDING_DECISION (else ERR_UTILITY_DECISION_PENDING)"
        side_effects:
          - "sets cycle_number = 1 and submitted_on_date = the logical clock date"
          - "advances AduProject.status FEASIBILITY_CLEARED -> PERMITTING"
          - "increments PermitSubmittal.version by 1"
      - from: UNDER_PLAN_CHECK
        to: CORRECTIONS_REQUIRED
        trigger: "POST /permit-submittals/{id}/plan-check-result with outcome == CORRECTIONS_REQUIRED"
        actor: PlanChecker
        preconditions:
          - "PermitSubmittal.status == UNDER_PLAN_CHECK"
          - "the correction_items array in the request body is present and holds at least one element (else ERR_NO_CORRECTIONS_ON_RECORD) — a corrections letter carrying zero corrections is not a corrections letter"
        side_effects:
          - "cascade link 1: creates one CorrectionItem row (status OPEN) per element of correction_items, in request order"
          - "sets correction_deadline_date = logical clock date + Jurisdiction.correction_response_days"
          - "cascade link 2: because this submittal entered CORRECTIONS_REQUIRED, AduProject.status PERMITTING -> DESIGN_REVISION"
          - "cascade link 3: because the project left PERMITTING, every ConstructionPhase of the project with status == SCHEDULED moves SCHEDULED -> BLOCKED and has window_start_date and window_end_date set to null, processed in created_at ASC order"
          - "cascade link 4: because each of those phases entered BLOCKED, every InspectionAppointment linked to it with status IN {SCHEDULED, PARTIAL} moves to CANCELLED, releasing that inspector's slot on slot_date, processed in created_at ASC order"
          - "increments PermitSubmittal.version by 1"
      - from: CORRECTIONS_REQUIRED
        to: UNDER_PLAN_CHECK
        trigger: "POST /permit-submittals/{id}/resubmit"
        actor: DesignLead
        preconditions:
          - "PermitSubmittal.status == CORRECTIONS_REQUIRED"
          - "the logical clock date <= correction_deadline_date (else the submittal auto-transitions to EXPIRED and the call is rejected with ERR_CORRECTION_WINDOW_EXPIRED)"
          - "no CorrectionItem of this submittal has severity == BLOCKING and status == OPEN (else ERR_BLOCKING_CORRECTIONS_OPEN)"
        side_effects:
          - "increments cycle_number by 1 and design_revision by 1"
          - "sets correction_deadline_date = null"
          - "advances AduProject.status DESIGN_REVISION -> PERMITTING"
          - "increments PermitSubmittal.version by 1"
        note: "The plan-check cycle: UNDER_PLAN_CHECK -> CORRECTIONS_REQUIRED -> UNDER_PLAN_CHECK, once per correction round."
      - from: CORRECTIONS_REQUIRED
        to: EXPIRED
        trigger: "system, evaluated lazily at the start of POST /permit-submittals/{id}/resubmit when the logical clock date > correction_deadline_date"
        actor: system
        preconditions:
          - "PermitSubmittal.status == CORRECTIONS_REQUIRED"
          - "logical clock date > correction_deadline_date"
        side_effects:
          - "sets status = EXPIRED and correction_deadline_date = null"
          - "increments PermitSubmittal.version by 1"
          - "the triggering resubmit call is then rejected with ERR_CORRECTION_WINDOW_EXPIRED (409)"
      - from: UNDER_PLAN_CHECK
        to: APPROVED
        trigger: "POST /permit-submittals/{id}/plan-check-result with outcome == APPROVED"
        actor: PlanChecker
        preconditions:
          - "PermitSubmittal.status == UNDER_PLAN_CHECK"
          - "no CorrectionItem of this submittal has severity == BLOCKING and status == OPEN (else ERR_BLOCKING_CORRECTIONS_OPEN)"
        side_effects:
          - "sets approved_on_date = the logical clock date"
          - "advances AduProject.status PERMITTING -> PERMITTED and copies total_permit_fee_cents onto the project"
          - "increments PermitSubmittal.version by 1"

  - entity: CorrectionItem
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /correction-items/{id}/resolve"
        actor: DesignLead
        preconditions:
          - "CorrectionItem.status == OPEN"
          - "the parent PermitSubmittal.status == CORRECTIONS_REQUIRED (else ERR_SUBMITTAL_STATE_INVALID)"
        side_effects:
          - "sets resolved_on_date = the logical clock date"
          - "increments CorrectionItem.version by 1"

  - entity: UtilityConnection
    initial_state: PENDING_DECISION
    terminal_states: [ENERGIZED]
    transitions:
      - from: PENDING_DECISION
        to: SEPARATE_APPROVED
        trigger: "POST /utility-connections/{id}/decide, when the resolved decision is SEPARATE"
        actor: DesignLead
        preconditions:
          - "UtilityConnection.status == PENDING_DECISION"
          - "AduProject.approved_pathway is not null (else ERR_PATHWAY_NOT_SELECTED)"
        side_effects:
          - "stamps separation_score and separation_cost_cents from calculations.utility_separation_decision"
          - "sets decision = SEPARATE"
          - "increments UtilityConnection.version by 1"
      - from: PENDING_DECISION
        to: SHARED_APPROVED
        trigger: "POST /utility-connections/{id}/decide, when the resolved decision is SHARED"
        actor: DesignLead
        preconditions:
          - "UtilityConnection.status == PENDING_DECISION"
          - "AduProject.approved_pathway is not null (else ERR_PATHWAY_NOT_SELECTED)"
        side_effects:
          - "stamps separation_score and separation_cost_cents from calculations.utility_separation_decision"
          - "sets decision = SHARED"
          - "increments UtilityConnection.version by 1"
        note: "Fork: the two branches carry different separation_cost_cents and therefore different permit-fee utility components."
      - from: SEPARATE_APPROVED
        to: PENDING_DECISION
        trigger: "system, caused by ChangeOrder SUBMITTED -> APPROVED whose cost_delta_cents != 0 on a project whose approved_change_order_count was 0 before that approval"
        actor: system
        preconditions:
          - "UtilityConnection.status == SEPARATE_APPROVED"
        side_effects:
          - "resets decision = null, separation_score = 0, separation_cost_cents = 0"
          - "increments UtilityConnection.version by 1"
        note: "The first approved change order invalidates the metering study, so the SEPARATE decision reverts and must be re-run."
      - from: SEPARATE_APPROVED
        to: ENERGIZED
        trigger: "POST /utility-connections/{id}/energize"
        actor: ProjectManager
        preconditions:
          - "UtilityConnection.status IN {SEPARATE_APPROVED, SHARED_APPROVED}"
          - "the project's most recently created PermitSubmittal has status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
        side_effects:
          - "sets energized_on_date = the logical clock date"
          - "increments UtilityConnection.version by 1"
      - from: SHARED_APPROVED
        to: ENERGIZED
        trigger: "POST /utility-connections/{id}/energize"
        actor: ProjectManager
        preconditions:
          - "UtilityConnection.status IN {SEPARATE_APPROVED, SHARED_APPROVED}"
          - "the project's most recently created PermitSubmittal has status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
        side_effects:
          - "sets energized_on_date = the logical clock date"
          - "increments UtilityConnection.version by 1"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit"
        actor: Homeowner
        preconditions:
          - "ChangeOrder.status == DRAFT"
          - "X-User-ID == AduProject.property_id of the change order's project (else ERR_NOT_PROJECT_OWNER)"
        side_effects:
          - "increments ChangeOrder.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /change-orders/{id}/decide with decision == REQUEST_REVISION"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "increments ChangeOrder.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /change-orders/{id}/submit"
        actor: Homeowner
        preconditions:
          - "ChangeOrder.status == REVISION_REQUESTED"
          - "X-User-ID == AduProject.property_id of the change order's project"
        side_effects:
          - "clears decided_by_user_id back to null"
          - "increments ChangeOrder.version by 1"
        note: "Cycle: DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT. The same submit endpoint moves REVISION_REQUESTED back to DRAFT rather than forward."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/decide with decision == REJECT"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "leaves AduProject.contract_price_current_cents, approved_change_days and approved_change_order_count untouched"
          - "increments ChangeOrder.version by 1"
        note: "Branch with no fiscal side effects — contrast with the APPROVED branch below."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/decide with decision == APPROVE"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
          - "AduProject.status IN {PERMITTED, UNDER_CONSTRUCTION} (else ERR_PROJECT_PHASE_INVALID)"
          - "calculations.change_order_price_reconciliation yields cumulative_change_pct_after <= CHANGE_ORDER_CAP_PCT (else ERR_CHANGE_CAP_EXCEEDED)"
        side_effects:
          - "cascade link 1: stamps builder_fee_cents, cumulative_change_pct_before, cumulative_change_pct_after and decided_by_user_id on this ChangeOrder"
          - "cascade link 2: because this change order became APPROVED, AduProject.contract_price_current_cents is recomputed, approved_change_days grows by schedule_delta_days and approved_change_order_count grows by 1"
          - "cascade link 3: because contract_price_current_cents changed, the project's single FinancingScenario with status == COMMITTED has required_funds_cents and funding_gap_cents recomputed; when the recomputed funding_gap_cents > 0 the project's financing_state moves COMMITTED -> SHORTFALL"
          - "when approved_change_order_count was 0 before this approval and cost_delta_cents != 0, every UtilityConnection of the project with status == SEPARATE_APPROVED reverts to PENDING_DECISION"
          - "increments ChangeOrder.version by 1 and AduProject.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /change-orders/{id}/void"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == APPROVED"
          - "AduProject.status != FINALED (else ERR_PROJECT_PHASE_INVALID)"
        side_effects:
          - "resets builder_fee_cents, cumulative_change_pct_before and cumulative_change_pct_after to 0"
          - "recomputes AduProject.contract_price_current_cents over the remaining APPROVED change orders, decrements approved_change_days by schedule_delta_days and approved_change_order_count by 1"
          - "recomputes required_funds_cents and funding_gap_cents on the project's single COMMITTED FinancingScenario; when the recomputed gap is 0 the project's financing_state moves SHORTFALL -> COMMITTED"
          - "increments ChangeOrder.version by 1 and AduProject.version by 1"
        note: "Compensating action for the APPROVE branch; see compensating_invariant.contract_price_ledger_conserved."

  - entity: ConstructionPhase
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /construction-phases/{id}/schedule"
        actor: ProjectManager
        preconditions:
          - "ConstructionPhase.status IN {PLANNED, BLOCKED}"
          - "AduProject.status IN {PERMITTED, UNDER_CONSTRUCTION} (else ERR_PROJECT_PHASE_INVALID)"
          - "window_end_date >= window_start_date"
          - "habitability rule: not (Property.occupied AND disruption_class == UTILITY_SHUTOFF AND window length in days > MAX_SHUTOFF_DAYS_OCCUPIED) (else ERR_OCCUPIED_HABITABILITY_VIOLATION)"
          - "no property-window overlap per validations priority 66 (else ERR_PHASE_WINDOW_CONFLICT)"
        side_effects:
          - "sets window_start_date and window_end_date"
          - "increments ConstructionPhase.version by 1"
      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /construction-phases/{id}/schedule"
        actor: ProjectManager
        preconditions:
          - "ConstructionPhase.status IN {PLANNED, BLOCKED}"
          - "AduProject.status IN {PERMITTED, UNDER_CONSTRUCTION}"
          - "the same habitability and overlap checks as the PLANNED -> SCHEDULED transition"
        side_effects:
          - "sets window_start_date and window_end_date"
          - "increments ConstructionPhase.version by 1"
        note: "Cycle: SCHEDULED -> BLOCKED -> SCHEDULED, driven by plan-check corrections and re-scheduling."
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system, cascade link 3 of transitive_cascade.plan_check_corrections_chain"
        actor: system
        preconditions:
          - "ConstructionPhase.status == SCHEDULED"
          - "the owning AduProject just left PERMITTING for DESIGN_REVISION"
        side_effects:
          - "sets window_start_date = null and window_end_date = null, releasing the property window"
          - "cascade link 4: every InspectionAppointment of this phase with status IN {SCHEDULED, PARTIAL} moves to CANCELLED"
          - "increments ConstructionPhase.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /construction-phases/{id}/start"
        actor: ProjectManager
        preconditions:
          - "ConstructionPhase.status == SCHEDULED"
          - "the project's most recently created PermitSubmittal has status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
          - "depends_on_phase_id is null OR that phase has status == COMPLETE (else ERR_PHASE_DEPENDENCY_INCOMPLETE)"
        side_effects:
          - "sets started_on_date = the logical clock date"
          - "when AduProject.status == PERMITTED it advances to UNDER_CONSTRUCTION"
          - "increments ConstructionPhase.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /construction-phases/{id}/complete"
        actor: ProjectManager
        preconditions:
          - "ConstructionPhase.status == IN_PROGRESS"
          - "no InspectionAppointment of this phase has status IN {SCHEDULED, PARTIAL} (else ERR_OPEN_INSPECTIONS_REMAIN)"
        side_effects:
          - "sets completed_on_date = the logical clock date"
          - "increments ConstructionPhase.version by 1"

  - entity: InspectionAppointment
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspection-appointments/{id}/result with outcome == PASS"
        actor: BuildingInspector
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
          - "X-User-ID == InspectionAppointment.inspector_id (else ERR_NOT_ASSIGNED_INSPECTOR)"
          - "for inspection_type == FINAL: no other InspectionAppointment of the same adu_project_id whose recorded_by_inspector_id equals X-User-ID exists (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets recorded_by_inspector_id = X-User-ID and result_notes"
          - "increments InspectionAppointment.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspection-appointments/{id}/result with outcome == FAIL"
        actor: BuildingInspector
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
          - "X-User-ID == InspectionAppointment.inspector_id"
        side_effects:
          - "sets recorded_by_inspector_id = X-User-ID and result_notes"
          - "increments InspectionAppointment.version by 1"
        note: "Branch: a FAILED inspection is terminal for this appointment; the builder books a re-inspection as a new appointment."
      - from: SCHEDULED
        to: PARTIAL
        trigger: "POST /inspection-appointments/{id}/result with outcome == PARTIAL"
        actor: BuildingInspector
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
          - "X-User-ID == InspectionAppointment.inspector_id"
        side_effects:
          - "sets recorded_by_inspector_id = X-User-ID and result_notes"
          - "the appointment keeps holding its inspector slot on slot_date"
          - "increments InspectionAppointment.version by 1"
      - from: PARTIAL
        to: PASSED
        trigger: "POST /inspection-appointments/{id}/result with outcome == PASS"
        actor: BuildingInspector
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
          - "X-User-ID == InspectionAppointment.inspector_id"
        side_effects:
          - "overwrites recorded_by_inspector_id and result_notes"
          - "releases the inspector's slot on slot_date"
          - "increments InspectionAppointment.version by 1"
      - from: PARTIAL
        to: FAILED
        trigger: "POST /inspection-appointments/{id}/result with outcome == FAIL"
        actor: BuildingInspector
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
          - "X-User-ID == InspectionAppointment.inspector_id"
        side_effects:
          - "overwrites recorded_by_inspector_id and result_notes"
          - "releases the inspector's slot on slot_date"
          - "increments InspectionAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspection-appointments/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
        side_effects:
          - "releases the inspector's slot on slot_date, restoring remaining_slots to its pre-booking value"
          - "increments InspectionAppointment.version by 1"
        note: "Compensating action for booking; see compensating_invariant.inspector_slot_capacity_conserved."
      - from: PARTIAL
        to: CANCELLED
        trigger: "POST /inspection-appointments/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "InspectionAppointment.status IN {SCHEDULED, PARTIAL}"
        side_effects:
          - "releases the inspector's slot on slot_date"
          - "increments InspectionAppointment.version by 1"

concurrency_rules:
  - rule_id: project-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /adu-projects"
    occ_field: "expected_property_version"
    description: |
      Creating an AduProject against a Property whose version has advanced since
      the client last observed it is rejected. A parcel may legitimately carry a
      redesigned project that supersedes an earlier one, so the create itself is
      valid from any Property state; the stale-version check is what stops a
      writer working from an outdated view of the parcel's project set.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

  - rule_id: financing-scenario-create-stale-project
    parent_entity: AduProject
    write_endpoint: "POST /adu-projects/{id}/financing-scenarios"
    occ_field: "expected_adu_project_version"
    description: |
      Creating a FinancingScenario supersedes the project's prior ACTIVE scenario,
      so a second create is legitimate from any project state. The stale-version
      check rejects the writer whose observed AduProject.version predates the
      supersede that already happened.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: change-order-create-stale-project
    parent_entity: AduProject
    write_endpoint: "POST /adu-projects/{id}/change-orders"
    occ_field: "expected_adu_project_version"
    description: |
      Creating a ChangeOrder is legitimate from any non-FINALED project state and
      may supersede an earlier change order, so the create cannot be rejected on
      state alone. The stale-version check rejects a homeowner whose observed
      AduProject.version predates a price-moving approval or supersede.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

calculations:
  - name: feasibility_screening
    trigger: "POST /adu-projects/{id}/feasibility-screenings — evaluated once at screening creation and frozen on the immutable FeasibilityScreening row"
    algorithm: threshold
    formula: |
      # --- pathway-dependent requirement set -------------------------------
      if pathway == 'LOCAL_ORDINANCE':
          max_allowed_sqft       = Jurisdiction.local_max_detached_sqft
          required_rear_setback_ft = Jurisdiction.local_rear_setback_ft
          required_side_setback_ft = Jurisdiction.local_side_setback_ft
          required_height_ft       = Jurisdiction.local_max_height_ft
      else:  # pathway == 'STATUTORY_MINISTERIAL'
          max_allowed_sqft       = max(STATUTORY_ALWAYS_ALLOWED_SQFT,
                                       Jurisdiction.local_max_detached_sqft)
          if AduProject.unit_type in ('CONVERSION', 'JADU'):
              required_rear_setback_ft = 0.0
              required_side_setback_ft = 0.0
          else:
              required_rear_setback_ft = STATUTORY_SETBACK_FT
              required_side_setback_ft = STATUTORY_SETBACK_FT
          required_height_ft     = STATUTORY_MAX_HEIGHT_FT

      # --- electrical / water capacity -------------------------------------
      if   AduProject.proposed_sqft <= AMP_TIER_1_MAX_SQFT: required_service_amps = 100
      elif AduProject.proposed_sqft <= AMP_TIER_2_MAX_SQFT: required_service_amps = 125
      else:                                                 required_service_amps = 200

      min_meter_in = (WATER_METER_MIN_IN_LARGE
                      if AduProject.proposed_sqft >= STATUTORY_ALWAYS_ALLOWED_SQFT
                      else WATER_METER_MIN_IN_SMALL)

      # --- the four checks --------------------------------------------------
      zoning_ok  = AduProject.proposed_sqft      <= max_allowed_sqft
      setback_ok = (AduProject.rear_setback_ft >= required_rear_setback_ft and
                    AduProject.side_setback_ft >= required_side_setback_ft)
      height_ok  = AduProject.proposed_height_ft <= required_height_ft
      utility_capacity_ok = (
          Property.electrical_service_amps >= required_service_amps + EXISTING_DWELLING_LOAD_AMPS
          and Property.existing_water_meter_size_in >= min_meter_in)

      deficiency_codes = sorted([c for c, ok in
          [('HEIGHT', height_ok), ('SETBACK', setback_ok),
           ('UTILITY_CAPACITY', utility_capacity_ok), ('ZONING', zoning_ok)] if not ok])

      if not (zoning_ok and setback_ok and height_ok):  verdict = 'FAIL'
      elif not utility_capacity_ok:                     verdict = 'PASS_WITH_CONDITIONS'
      else:                                             verdict = 'PASS'
    input_set: "Exactly one AduProject row, its Property (via AduProject.property_id) and that Property's Jurisdiction (via Property.jurisdiction_id). No other screenings are consulted; each screening is independent."
    constants:
      STATUTORY_ALWAYS_ALLOWED_SQFT: 800
      STATUTORY_SETBACK_FT: 4.0
      STATUTORY_MAX_HEIGHT_FT: 16.0
      AMP_TIER_1_MAX_SQFT: 750
      AMP_TIER_2_MAX_SQFT: 1000
      EXISTING_DWELLING_LOAD_AMPS: 100
      WATER_METER_MIN_IN_SMALL: 0.625
      WATER_METER_MIN_IN_LARGE: 0.75
    precision: "Setback and height comparisons use exact decimal values as supplied; all comparisons are inclusive (>= and <=). deficiency_codes is sorted ascending by ASCII."
    variants:
      - name: LOCAL_ORDINANCE
        when: "pathway == 'LOCAL_ORDINANCE' — the homeowner accepts the city's discretionary ADU ordinance limits."
        difference: "Floor-area ceiling, setbacks and height come straight from the Jurisdiction row, so a parcel in a restrictive city can FAIL on ZONING and SETBACK."
      - name: STATUTORY_MINISTERIAL
        when: "pathway == 'STATUTORY_MINISTERIAL' — the homeowner invokes the state ministerial pathway."
        difference: "Floor-area ceiling is lifted to at least 800 sqft, setbacks drop to a flat 4.0 ft (0.0 ft for CONVERSION and JADU) and height is capped at a flat 16.0 ft. The SAME AduProject row can therefore return verdict FAIL under LOCAL_ORDINANCE and verdict PASS under STATUTORY_MINISTERIAL."

  - name: utility_separation_decision
    trigger: "POST /utility-connections/{id}/decide — stamps separation_score, decision and separation_cost_cents on the UtilityConnection"
    algorithm: weighted_scoring
    formula: |
      if   AduProject.proposed_sqft <= AMP_TIER_1_MAX_SQFT: required_service_amps = 100
      elif AduProject.proposed_sqft <= AMP_TIER_2_MAX_SQFT: required_service_amps = 125
      else:                                                 required_service_amps = 200

      headroom_amps  = (Property.electrical_service_amps
                        - required_service_amps - EXISTING_DWELLING_LOAD_AMPS)
      water_headroom = 1 if Property.existing_water_meter_size_in >= 1.0 else 0

      raw = (40 * (1 if Jurisdiction.separate_meter_required else 0)
           + 25 * (1 if headroom_amps < 0 else 0)
           + 20 * (1 if AduProject.unit_type == 'DETACHED_NEW' else 0)
           + 15 * (1 if AduProject.bedrooms >= 2 else 0)
           - 10 * water_headroom)
      separation_score = max(0, min(100, raw))

      if override_decision is not None:
          decision = override_decision           # operator override wins outright
      else:
          decision = 'SEPARATE' if separation_score >= SEPARATION_THRESHOLD else 'SHARED'

      separation_cost_cents = (Jurisdiction.utility_capacity_fee_cents + SEPARATE_METER_BASE_CENTS
                               if decision == 'SEPARATE' else SHARED_SUBMETER_CENTS)
    input_set: "One UtilityConnection row, its AduProject, that project's Property and the Property's Jurisdiction. separation_score is always stamped from the scored expression, even when override_decision replaces the resolved decision."
    constants:
      SEPARATION_THRESHOLD: 50
      SEPARATE_METER_BASE_CENTS: 850000
      SHARED_SUBMETER_CENTS: 220000
      AMP_TIER_1_MAX_SQFT: 750
      AMP_TIER_2_MAX_SQFT: 1000
      EXISTING_DWELLING_LOAD_AMPS: 100
    precision: "separation_score is an integer clamped to [0, 100]; the SEPARATE branch is taken at separation_score >= 50 exactly (a score of 50 resolves to SEPARATE, 49 resolves to SHARED). Costs are whole cents."

  - name: permit_fee_schedule
    trigger: "POST /adu-projects/{id}/permit-submittals — stamps the four fee components and total_permit_fee_cents on the new PermitSubmittal"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: each rate-driven component is rounded to whole
      # cents FIRST and the rounded components are then summed. Summing the
      # unrounded reals and rounding once at the end is WRONG.
      plan_check_component_cents = round_half_up(
          (Jurisdiction.plan_check_base_fee_cents
           + Jurisdiction.plan_check_rate_per_sqft_cents * AduProject.proposed_sqft)
          * (1 + TECH_SURCHARGE_PCT))

      if AduProject.proposed_sqft < IMPACT_FEE_EXEMPT_SQFT:
          impact_component_cents = 0
      else:
          impact_component_cents = round_half_up(
              Jurisdiction.impact_fee_per_sqft_cents * AduProject.proposed_sqft
              * min(1.0, AduProject.proposed_sqft / Property.existing_dwelling_sqft))

      if AduProject.proposed_sqft < SCHOOL_FEE_MIN_SQFT:
          school_component_cents = 0
      else:
          school_component_cents = round_half_up(
              SCHOOL_FEE_RATE_PER_SQFT_CENTS * AduProject.proposed_sqft
              * (1 + TECH_SURCHARGE_PCT))

      utility_component_cents = sum(uc.separation_cost_cents
          for uc in UtilityConnection
          where uc.adu_project_id == AduProject.id
            and uc.status in ('SEPARATE_APPROVED', 'SHARED_APPROVED', 'ENERGIZED')
          ordered by uc.created_at ASC)

      total_permit_fee_cents = (plan_check_component_cents + impact_component_cents
                                + school_component_cents + utility_component_cents)
    input_set: "The AduProject, its Property, that Property's Jurisdiction, and every UtilityConnection of the project whose status is one of SEPARATE_APPROVED, SHARED_APPROVED, ENERGIZED (rows still in PENDING_DECISION contribute nothing), enumerated in created_at ASC order."
    constants:
      TECH_SURCHARGE_PCT: 0.075
      IMPACT_FEE_EXEMPT_SQFT: 750
      SCHOOL_FEE_MIN_SQFT: 500
      SCHOOL_FEE_RATE_PER_SQFT_CENTS: 452
    precision: "round_half_up = round half away from zero to whole cents, applied INDEPENDENTLY to each of plan_check_component_cents, impact_component_cents and school_component_cents before summation. The impact fee is exempt strictly below 750 sqft and charged at exactly 750 sqft."

  - name: change_order_price_reconciliation
    trigger: "ChangeOrder SUBMITTED -> APPROVED (POST /change-orders/{id}/decide with decision APPROVE); the same formula re-runs over the remaining APPROVED rows on ChangeOrder APPROVED -> VOIDED"
    algorithm: constraint_propagation
    formula: |
      # The markup tier LOOKS circular: the fee feeds the contract price and the
      # tier is keyed on a change percentage. Evaluation order is PINNED so the
      # value is well defined. The percentage is ALWAYS measured against
      # contract_base_price_cents, never against contract_price_current_cents.
      #
      # step 1 — cumulative prior, over already-APPROVED rows only
      cumulative_prior_cents = sum(co.cost_delta_cents + co.builder_fee_cents
          for co in ChangeOrder
          where co.adu_project_id == AduProject.id and co.status == 'APPROVED'
            and co.id != this.id
          ordered by co.created_at ASC)

      # step 2 — the "before" percentage, on the BASE price
      cumulative_change_pct_before = round_half_up_2(
          100.0 * cumulative_prior_cents / AduProject.contract_base_price_cents)

      # step 3 — tier selection reads the BEFORE percentage
      if   cumulative_change_pct_before <  MARKUP_TIER_1_MAX_PCT: markup_rate = MARKUP_RATE_TIER_1
      elif cumulative_change_pct_before <  MARKUP_TIER_2_MAX_PCT: markup_rate = MARKUP_RATE_TIER_2
      else:                                                       markup_rate = MARKUP_RATE_TIER_3

      # step 4 — fee, rounded once
      builder_fee_cents = round_half_up(this.cost_delta_cents * markup_rate)

      # step 5 — the new contract price
      AduProject.contract_price_current_cents = (AduProject.contract_base_price_cents
          + cumulative_prior_cents + this.cost_delta_cents + builder_fee_cents)

      # step 6 — the "after" percentage, again on the BASE price
      cumulative_change_pct_after = round_half_up_2(
          100.0 * (cumulative_prior_cents + this.cost_delta_cents + builder_fee_cents)
          / AduProject.contract_base_price_cents)

      # step 7 — cap check, AFTER the fee is known
      if cumulative_change_pct_after > CHANGE_ORDER_CAP_PCT:
          reject with ERR_CHANGE_CAP_EXCEEDED and persist nothing
    input_set: "The ChangeOrder being decided plus every ChangeOrder of the same AduProject with status == APPROVED (DRAFT, SUBMITTED, REVISION_REQUESTED, REJECTED and VOIDED rows are excluded), enumerated in created_at ASC order."
    constants:
      MARKUP_TIER_1_MAX_PCT: 5.0
      MARKUP_TIER_2_MAX_PCT: 15.0
      MARKUP_RATE_TIER_1: 0.10
      MARKUP_RATE_TIER_2: 0.15
      MARKUP_RATE_TIER_3: 0.20
      CHANGE_ORDER_CAP_PCT: 25.0
    precision: "round_half_up = round half away from zero to whole cents (so a -1250.5 fee on a credit rounds to -1251). round_half_up_2 = round half away from zero to 2 decimal places on the percentage. Tier boundaries are strict: a cumulative_change_pct_before of exactly 5.00 selects MARKUP_RATE_TIER_2, and exactly 15.00 selects MARKUP_RATE_TIER_3. The cap rejects only when cumulative_change_pct_after is strictly greater than 25.00."

  - name: financing_capacity
    trigger: "POST /adu-projects/{id}/financing-scenarios (initial stamp), and re-run on the project's COMMITTED FinancingScenario whenever AduProject.contract_price_current_cents changes through ChangeOrder approval or void"
    algorithm: forward_looking
    formula: |
      if appraisal_approach == 'SALES_COMPARISON':
          as_completed_value_cents = (Property.pre_adu_value_cents
                                      + this.comparable_adjustment_cents)
      else:  # 'INCOME_CAPITALIZATION'
          as_completed_value_cents = Property.pre_adu_value_cents + round_half_up(
              (this.projected_monthly_rent_cents * 12 * VACANCY_FACTOR
               * (1 - EXPENSE_RATIO)) / CAP_RATE)

      max_loan_cents   = floor(as_completed_value_cents * MAX_LTV_PCT)
      available_cents  = max_loan_cents - Property.existing_mortgage_balance_cents

      required_funds_cents = (AduProject.contract_price_current_cents
          + AduProject.total_permit_fee_cents
          + round_half_up(AduProject.contract_price_current_cents
                          * SOFT_COST_CONTINGENCY_PCT))

      funding_gap_cents = max(0, required_funds_cents - available_cents)

      appraisal_shortfall = (as_completed_value_cents - Property.pre_adu_value_cents
                             < required_funds_cents)
    input_set: "One FinancingScenario row, the AduProject it belongs to (reading contract_price_current_cents and total_permit_fee_cents as they stand at evaluation time) and that project's Property. Other scenarios on the same project — ACTIVE or SUPERSEDED — never contribute."
    constants:
      MAX_LTV_PCT: 0.80
      CAP_RATE: 0.055
      VACANCY_FACTOR: 0.92
      EXPENSE_RATIO: 0.35
      SOFT_COST_CONTINGENCY_PCT: 0.10
    precision: "max_loan_cents uses floor (truncation toward zero on a positive product), NOT round_half_up. round_half_up applies to the capitalized income term and to the soft-cost contingency, each computed once. funding_gap_cents is floored at 0."
    variants:
      - name: SALES_COMPARISON
        when: "appraisal_approach == 'SALES_COMPARISON' — the appraiser found ADU comparables and assigned a contributory value."
        difference: "as_completed_value_cents adds only comparable_adjustment_cents, which in most California submarkets lands far below construction cost and produces a positive funding_gap_cents plus appraisal_shortfall == true."
      - name: INCOME_CAPITALIZATION
        when: "appraisal_approach == 'INCOME_CAPITALIZATION' — the appraiser capitalized projected ADU rent."
        difference: "as_completed_value_cents adds the capitalized net rent, which for the SAME property and the SAME project cost can exceed the sales-comparison adjustment by a large multiple, flipping funding_gap_cents to 0 and appraisal_shortfall to false."

  - name: rental_readiness_check
    trigger: "POST /adu-projects/{id}/occupancy-certificate — stamps rental_classification, min_lease_days, rental_ready and blocking_reasons on the immutable OccupancyCertificate"
    algorithm: aggregation
    formula: |
      blocking = []
      if AduProject.unit_type == 'JADU' and Property.occupied == False:
          blocking.append('JADU_OWNER_OCCUPANCY_REQUIRED')
      if count(co for co in ChangeOrder
               where co.adu_project_id == AduProject.id
                 and co.status in ('DRAFT', 'SUBMITTED', 'REVISION_REQUESTED')) > 0:
          blocking.append('OPEN_CHANGE_ORDERS')
      if Property.in_str_overlay or Jurisdiction.str_prohibited:
          blocking.append('STR_OVERLAY_RESTRICTED')
      blocking_reasons = sorted(blocking)

      if 'JADU_OWNER_OCCUPANCY_REQUIRED' in blocking_reasons:
          rental_classification = 'RENTAL_PROHIBITED'
          min_lease_days = max(STATE_MIN_ADU_LEASE_DAYS, Jurisdiction.str_min_lease_days)
      elif 'STR_OVERLAY_RESTRICTED' in blocking_reasons:
          rental_classification = 'LONG_TERM_ONLY'
          min_lease_days = max(STATE_MIN_ADU_LEASE_DAYS, Jurisdiction.str_min_lease_days)
      elif Jurisdiction.str_min_lease_days <= STR_PERMITTED_MAX_LEASE_DAYS:
          rental_classification = 'SHORT_TERM_PERMITTED'
          min_lease_days = Jurisdiction.str_min_lease_days
      else:
          rental_classification = 'LONG_TERM_ONLY'
          min_lease_days = max(STATE_MIN_ADU_LEASE_DAYS, Jurisdiction.str_min_lease_days)

      rental_ready = (rental_classification != 'RENTAL_PROHIBITED'
                      and len(blocking_reasons) == 0)
    input_set: "The AduProject, its Property, that Property's Jurisdiction, and every ChangeOrder of the project whose status is one of DRAFT, SUBMITTED, REVISION_REQUESTED (APPROVED, REJECTED and VOIDED rows never block readiness)."
    constants:
      STATE_MIN_ADU_LEASE_DAYS: 30
      STR_PERMITTED_MAX_LEASE_DAYS: 7
    precision: "blocking_reasons is sorted ascending by ASCII, so JADU_OWNER_OCCUPANCY_REQUIRED precedes OPEN_CHANGE_ORDERS, which precedes STR_OVERLAY_RESTRICTED. min_lease_days is a whole number of days."

validations:
  # ---- 1-3 authentication / authorization ------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the seven roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's `roles` list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  # ---- 10-11 existence --------------------------------------------------
  - priority: 10
    category: existence
    check: "Every id appearing in the URL path resolves to a stored row, validated left to right; the first unresolved segment decides the error."
    error_id: "entity-specific: ERR_JURISDICTION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND | ERR_CORRECTION_ITEM_NOT_FOUND | ERR_UTILITY_CONNECTION_NOT_FOUND | ERR_FINANCING_SCENARIO_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 11
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row: jurisdiction_id, property_id, screening_id, inspector_id, depends_on_phase_id, supersedes_change_order_id."
    error_id: "entity-specific NOT_FOUND, as at priority 10 plus ERR_SCREENING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /properties, POST /inspectors, POST /adu-projects, POST /adu-projects/{id}/select-pathway, POST /adu-projects/{id}/construction-phases, POST /adu-projects/{id}/change-orders, POST /construction-phases/{id}/inspection-appointments"
  # ---- 20-21 identity-bound authorization -------------------------------
  - priority: 20
    category: auth
    check: "When X-User-Role is Homeowner, X-User-ID equals AduProject.property_id of the project the request touches."
    error_id: ERR_NOT_PROJECT_OWNER
    http_status: 403
    applies_to: "POST /adu-projects/{id}/change-orders, POST /change-orders/{id}/submit"
  - priority: 21
    category: auth
    check: "When X-User-Role is BuildingInspector, X-User-ID equals InspectionAppointment.inspector_id of the appointment being acted on."
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    applies_to: "POST /inspection-appointments/{id}/result"
  # ---- 25-28 request-shape validation -----------------------------------
  - priority: 25
    category: business_constraint
    check: "Every required input field declared for the endpoint is present and carries the declared JSON type."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 26
    category: business_constraint
    check: "Every enum-typed input field carries a member of its declared enum set."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 27
    category: business_constraint
    check: "Numeric and format domain constraints hold: proposed_sqft in [150, 1200], proposed_height_ft in (0, 35], bedrooms in [0, 4], schedule_delta_days in [-30, 120], daily_capacity in [1, 12], jurisdiction code matches ^[A-Z0-9]{2,8}$, dates match YYYY-MM-DD, slot_date equals the UTC date part of slot_start, slot_end > slot_start."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 28
    category: business_constraint
    check: "Pagination parameters satisfy 1 <= limit <= 100 and offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all GET list endpoints"
  # ---- 30 optimistic concurrency ----------------------------------------
  - priority: 30
    category: state
    check: "The supplied expected_property_version / expected_adu_project_version equals the parent row's current version."
    error_id: "ERR_STALE_PROPERTY_VERSION on POST /adu-projects; ERR_STALE_PROJECT_VERSION on the two AduProject-parented creates"
    http_status: 412
    applies_to: "POST /adu-projects, POST /adu-projects/{id}/financing-scenarios, POST /adu-projects/{id}/change-orders"
  # ---- 40-43 state preconditions ----------------------------------------
  - priority: 40
    category: state
    check: "The target resource is in a state from which this action has a declared transition."
    error_id: "ERR_PROJECT_PHASE_INVALID | ERR_SUBMITTAL_STATE_INVALID | ERR_CORRECTION_ITEM_STATE_INVALID | ERR_UTILITY_STATE_INVALID | ERR_SCENARIO_STATE_INVALID | ERR_CHANGE_ORDER_STATE_INVALID | ERR_PHASE_STATE_INVALID | ERR_APPOINTMENT_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"
  - priority: 41
    category: state
    check: "AduProject.approved_pathway is not null before any UtilityConnection decision is taken."
    error_id: ERR_PATHWAY_NOT_SELECTED
    http_status: 409
    applies_to: "POST /utility-connections/{id}/decide"
  - priority: 42
    category: state
    check: "The FeasibilityScreening named by screening_id has verdict IN {PASS, PASS_WITH_CONDITIONS}."
    error_id: ERR_FEASIBILITY_FAILED
    http_status: 409
    applies_to: "POST /adu-projects/{id}/select-pathway"
  - priority: 43
    category: state
    check: "The project's most recently created PermitSubmittal (created_at DESC, first row) has status == APPROVED."
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /construction-phases/{id}/start, POST /utility-connections/{id}/energize"
  # ---- 50-52 safety / compliance ----------------------------------------
  - priority: 50
    category: business_safety
    check: "For inspection_type == FINAL, no other InspectionAppointment of the same adu_project_id already carries recorded_by_inspector_id equal to the acting X-User-ID."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspection-appointments/{id}/result"
  - priority: 51
    category: business_safety
    check: "The Inspector's certifications array covers the appointment's inspection_type: FOUNDATION and FRAMING require STRUCTURAL, ROUGH_MEP requires both ELECTRICAL and PLUMBING, INSULATION requires ENVELOPE, FINAL requires FINAL."
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /construction-phases/{id}/inspection-appointments"
  - priority: 52
    category: business_safety
    check: "Inspector.status == ACTIVE."
    error_id: ERR_INSPECTOR_INACTIVE
    http_status: 409
    applies_to: "POST /construction-phases/{id}/inspection-appointments"
  - priority: 60
    category: business_safety
    check: "Habitability on an occupied parcel: reject when Property.occupied is true AND ConstructionPhase.disruption_class == UTILITY_SHUTOFF AND the requested window spans more than MAX_SHUTOFF_DAYS_OCCUPIED (1) calendar day, counting both endpoints."
    error_id: ERR_OCCUPIED_HABITABILITY_VIOLATION
    http_status: 409
    applies_to: "POST /construction-phases/{id}/schedule"
  # ---- 62-65 referential / uniqueness constraints ------------------------
  - priority: 62
    category: business_referential
    check: "ConstructionPhase.depends_on_phase_id is null OR the referenced phase has status == COMPLETE."
    error_id: ERR_PHASE_DEPENDENCY_INCOMPLETE
    http_status: 409
    applies_to: "POST /construction-phases/{id}/start"
  - priority: 63
    category: business_referential
    check: "No InspectionAppointment of this phase has status IN {SCHEDULED, PARTIAL}."
    error_id: ERR_OPEN_INSPECTIONS_REMAIN
    http_status: 409
    applies_to: "POST /construction-phases/{id}/complete"
  - priority: 64
    category: business_constraint
    check: "Jurisdiction.code is unique across all Jurisdiction rows."
    error_id: ERR_DUPLICATE_JURISDICTION_CODE
    http_status: 409
    applies_to: "POST /jurisdictions"
  - priority: 65
    category: business_constraint
    check: "At most one UtilityConnection per (adu_project_id, service_type) pair."
    error_id: ERR_DUPLICATE_UTILITY_SERVICE
    http_status: 409
    applies_to: "POST /adu-projects/{id}/utility-connections"
  # ---- 66-69 temporal conflicts -----------------------------------------
  - priority: 66
    category: business_temporal
    check: "Property window occupancy — CLOSED intervals with a habitability buffer. Let B = HABITABILITY_BUFFER_DAYS (2) when Property.occupied is true, else 0. Reject when any other ConstructionPhase P2 whose project shares this Property has status IN {SCHEDULED, IN_PROGRESS} and satisfies new.window_start_date <= P2.window_end_date + B days AND P2.window_start_date <= new.window_end_date + B days. Touching endpoints therefore collide even at B = 0."
    error_id: ERR_PHASE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /construction-phases/{id}/schedule"
  - priority: 67
    category: business_temporal
    check: "Inspector slot occupancy — HALF-OPEN intervals [slot_start, slot_end), no buffer. Reject when any other InspectionAppointment on the same inspector_id with status IN {SCHEDULED, PARTIAL} satisfies new.slot_start < existing.slot_end AND existing.slot_start < new.slot_end. Back-to-back slots where new.slot_start == existing.slot_end are ACCEPTED."
    error_id: ERR_INSPECTOR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /construction-phases/{id}/inspection-appointments"
  - priority: 68
    category: business_temporal
    check: "Inspector daily aggregate capacity — count of InspectionAppointment rows on the same inspector_id and slot_date with status IN {SCHEDULED, PARTIAL} must be strictly less than Inspector.daily_capacity before the new booking is written."
    error_id: ERR_INSPECTOR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /construction-phases/{id}/inspection-appointments"
  - priority: 69
    category: business_temporal
    check: "The logical clock date is <= PermitSubmittal.correction_deadline_date; when it is later the submittal first auto-transitions to EXPIRED and the call is then rejected."
    error_id: ERR_CORRECTION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /permit-submittals/{id}/resubmit"
  # ---- 70-76 business constraints and fiscal checks ----------------------
  - priority: 70
    category: business_constraint
    check: "Empty-collection edge on a corrections letter: when outcome == CORRECTIONS_REQUIRED, correction_items must be present and hold at least one element. An omitted key or an empty array is rejected rather than vacuously accepted as a zero-correction corrections letter."
    error_id: ERR_NO_CORRECTIONS_ON_RECORD
    http_status: 409
    applies_to: "POST /permit-submittals/{id}/plan-check-result with outcome CORRECTIONS_REQUIRED"
  - priority: 71
    category: business_constraint
    check: "No CorrectionItem of the submittal has severity == BLOCKING and status == OPEN. On a submittal that carries only ADVISORY corrections the check passes with none resolved."
    error_id: ERR_BLOCKING_CORRECTIONS_OPEN
    http_status: 409
    applies_to: "POST /permit-submittals/{id}/resubmit, POST /permit-submittals/{id}/plan-check-result with outcome APPROVED"
  - priority: 72
    category: business_fiscal
    check: "calculations.change_order_price_reconciliation yields cumulative_change_pct_after <= CHANGE_ORDER_CAP_PCT (25.0); a value strictly above the cap is rejected and nothing is persisted."
    error_id: ERR_CHANGE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /change-orders/{id}/decide with decision APPROVE"
  - priority: 73
    category: business_fiscal
    check: "A change order must carry substance: reject when scope_items is an empty array AND cost_delta_cents == 0 AND schedule_delta_days == 0."
    error_id: ERR_EMPTY_CHANGE_ORDER
    http_status: 422
    applies_to: "POST /adu-projects/{id}/change-orders"
  - priority: 74
    category: business_fiscal
    check: "FinancingScenario.funding_gap_cents == 0."
    error_id: ERR_FUNDING_GAP_OPEN
    http_status: 409
    applies_to: "POST /financing-scenarios/{id}/commit"
  - priority: 75
    category: business_constraint
    check: "Every UtilityConnection of the project has status != PENDING_DECISION."
    error_id: ERR_UTILITY_DECISION_PENDING
    http_status: 409
    applies_to: "POST /permit-submittals/{id}/submit"
  - priority: 76
    category: business_constraint
    check: "PermitSubmittal.title24_compliant == true."
    error_id: ERR_TITLE24_MISSING
    http_status: 409
    applies_to: "POST /permit-submittals/{id}/submit"
  # ---- 80-83 final certificate gates -------------------------------------
  - priority: 80
    category: business_constraint
    check: "No OccupancyCertificate already exists for this AduProject."
    error_id: ERR_CERTIFICATE_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /adu-projects/{id}/occupancy-certificate"
  - priority: 81
    category: business_referential
    check: "Every UtilityConnection of the project has status == ENERGIZED."
    error_id: ERR_UTILITY_NOT_ENERGIZED
    http_status: 409
    applies_to: "POST /adu-projects/{id}/occupancy-certificate"
  - priority: 82
    category: business_referential
    check: "Every ConstructionPhase of the project has status == COMPLETE."
    error_id: ERR_PHASES_INCOMPLETE
    http_status: 409
    applies_to: "POST /adu-projects/{id}/occupancy-certificate"
  - priority: 83
    category: business_referential
    check: "At least one InspectionAppointment of the project has inspection_type == FINAL and status == PASSED; the one with the latest slot_end (ties broken by created_at ASC) supplies final_inspection_passed_at."
    error_id: ERR_FINAL_INSPECTION_MISSING
    http_status: 409
    applies_to: "POST /adu-projects/{id}/occupancy-certificate"

endpoints:
  # ---------------- configuration & operator surface ----------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every date this API stamps (submitted_on_date, correction_deadline_date, resolved_on_date, energized_on_date, started_on_date, completed_on_date, issued_on_date) is derived from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; no stored row is mutated"]

  - method: POST
    path: "/jurisdictions"
    description: "Registers a permitting jurisdiction and its ADU ordinance parameters."
    roles: [PlatformAdmin]
    code: 201
    input: [name, code, local_max_detached_sqft, local_rear_setback_ft, local_side_setback_ft, local_max_height_ft, plan_check_base_fee_cents, plan_check_rate_per_sqft_cents, impact_fee_per_sqft_cents, utility_capacity_fee_cents, "correction_response_days?", "separate_meter_required?", "str_min_lease_days?", "str_prohibited?"]
    output: Jurisdiction
    side_effects: ["none beyond row creation"]

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Reads one jurisdiction's ordinance parameters."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/inspectors"
    description: "Registers a jurisdiction building inspector and their daily slot capacity."
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, full_name, certifications, "daily_capacity?", "status?"]
    output: Inspector
    side_effects: ["none beyond row creation"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Reads one inspector."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: GET
    path: "/inspectors"
    description: "Lists inspectors, optionally filtered by employing jurisdiction and status."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  - method: GET
    path: "/inspectors/{id}/availability"
    description: "Reports the inspector's booked and remaining slot count on one calendar date, counting only appointments with status IN {SCHEDULED, PARTIAL}."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: [slot_date]
    output: { inspector_id: string, slot_date: string, daily_capacity: integer, booked_count: integer, remaining_slots: integer }
    side_effects: []

  # ---------------- property & project ------------------------------------
  - method: POST
    path: "/properties"
    description: "Registers a parcel. The created Property's id doubles as the Homeowner identity: a Homeowner acts with X-User-ID equal to this row's id."
    roles: [PlatformAdmin, DesignLead]
    code: 201
    input: [jurisdiction_id, address_line, lot_sqft, existing_dwelling_sqft, electrical_service_amps, existing_water_meter_size_in, pre_adu_value_cents, "occupied?", "in_str_overlay?", "existing_mortgage_balance_cents?"]
    output: Property
    side_effects: ["none beyond row creation"]

  - method: GET
    path: "/properties/{id}"
    description: "Reads one parcel."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "Lists parcels, optionally filtered by jurisdiction."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/adu-projects"
    description: "Opens an ADU design-build project on a parcel. OCC-guarded on the parcel: a new project legitimately supersedes an earlier design on the same parcel, so the write is gated on the client's observed Property.version rather than on project state."
    roles: [DesignLead]
    code: 201
    input: [property_id, expected_property_version, unit_type, proposed_sqft, proposed_height_ft, rear_setback_ft, side_setback_ft, bedrooms, contract_base_price_cents]
    output: AduProject
    side_effects:
      - "creates the project with status INTAKE, financing_state UNFUNDED, approved_pathway null"
      - "sets contract_price_current_cents = contract_base_price_cents"
      - "increments Property.version by 1"

  - method: GET
    path: "/adu-projects/{id}"
    description: "Reads one project, including both state axes and every derived contract field."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: AduProject
    side_effects: []

  - method: GET
    path: "/adu-projects"
    description: "Lists projects, optionally filtered by parcel and lifecycle status."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: AduProject[]
    side_effects: []

  # ---------------- feasibility -------------------------------------------
  - method: POST
    path: "/adu-projects/{id}/feasibility-screenings"
    description: "Runs a feasibility screening against one rule set and freezes the result. The same project may be screened under both pathways."
    roles: [DesignLead]
    code: 201
    input: [pathway]
    output: FeasibilityScreening
    side_effects: ["stamps every computed field via calculations.feasibility_screening; the project row is not mutated"]

  - method: GET
    path: "/adu-projects/{id}/feasibility-screenings"
    description: "Lists the screenings run against one project, oldest first."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["pathway?", "limit?", "offset?"]
    output: FeasibilityScreening[]
    side_effects: []

  - method: POST
    path: "/adu-projects/{id}/select-pathway"
    description: "Locks the project onto one screened pathway and clears it out of intake."
    roles: [DesignLead]
    code: 200
    input: [screening_id]
    output: AduProject
    side_effects:
      - "AduProject.status INTAKE -> FEASIBILITY_CLEARED"
      - "sets approved_pathway and max_allowed_sqft from the named screening"
      - "increments AduProject.version by 1"

  # ---------------- utility separation ------------------------------------
  - method: POST
    path: "/adu-projects/{id}/utility-connections"
    description: "Opens a utility service record for the project, one per service type."
    roles: [DesignLead]
    code: 201
    input: [service_type]
    output: UtilityConnection
    side_effects: ["creates the row with status PENDING_DECISION, decision null, separation_score 0, separation_cost_cents 0"]

  - method: GET
    path: "/adu-projects/{id}/utility-connections"
    description: "Lists the project's utility service records, oldest first."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["service_type?", "status?", "limit?", "offset?"]
    output: UtilityConnection[]
    side_effects: []

  - method: POST
    path: "/utility-connections/{id}/decide"
    description: "Runs the separate-service versus shared-metering study and records the outcome. An override_decision replaces the scored decision but never the score."
    roles: [DesignLead]
    code: 200
    input: ["override_decision?"]
    output: UtilityConnection
    side_effects:
      - "stamps separation_score, decision and separation_cost_cents via calculations.utility_separation_decision"
      - "UtilityConnection.status PENDING_DECISION -> SEPARATE_APPROVED or SHARED_APPROVED"
      - "increments UtilityConnection.version by 1"

  - method: POST
    path: "/utility-connections/{id}/energize"
    description: "Records that the service has been energized by the utility."
    roles: [ProjectManager]
    code: 200
    input: []
    output: UtilityConnection
    side_effects:
      - "UtilityConnection.status -> ENERGIZED and energized_on_date = logical clock date"
      - "increments UtilityConnection.version by 1"

  # ---------------- permit submittal & plan check --------------------------
  - method: POST
    path: "/adu-projects/{id}/permit-submittals"
    description: "Prepares a design package and permit submittal for the jurisdiction and prices the permit fee."
    roles: [DesignLead]
    code: 201
    input: [design_sheet_count, title24_compliant]
    output: PermitSubmittal
    side_effects: ["stamps the four fee components and total_permit_fee_cents via calculations.permit_fee_schedule; creates the row with status PREPARED, cycle_number 0, design_revision 1"]

  - method: GET
    path: "/adu-projects/{id}/permit-submittals"
    description: "Lists the project's permit submittals, oldest first."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PermitSubmittal[]
    side_effects: []

  - method: GET
    path: "/permit-submittals/{id}"
    description: "Reads one permit submittal including its fee breakdown and correction deadline."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: PermitSubmittal
    side_effects: []

  - method: POST
    path: "/permit-submittals/{id}/submit"
    description: "Files the submittal with the jurisdiction and opens plan check."
    roles: [DesignLead]
    code: 200
    input: []
    output: PermitSubmittal
    side_effects:
      - "PermitSubmittal.status PREPARED -> UNDER_PLAN_CHECK, cycle_number 1, submitted_on_date stamped"
      - "AduProject.status FEASIBILITY_CLEARED, PERMITTED or UNDER_CONSTRUCTION -> PERMITTING"
      - "increments PermitSubmittal.version by 1 and AduProject.version by 1"

  - method: POST
    path: "/permit-submittals/{id}/plan-check-result"
    description: "Records the jurisdiction's plan-check outcome. outcome APPROVED closes the permit; outcome CORRECTIONS_REQUIRED opens a correction round and requires a correction_items array holding at least one element. Each element is an object with discipline, severity and description."
    roles: [PlanChecker]
    code: 200
    input: [outcome, "correction_items?"]
    output: PermitSubmittal
    side_effects:
      - "outcome APPROVED: status -> APPROVED, approved_on_date stamped, AduProject.status PERMITTING -> PERMITTED, AduProject.total_permit_fee_cents copied"
      - "outcome CORRECTIONS_REQUIRED: status -> CORRECTIONS_REQUIRED, one CorrectionItem per array element, correction_deadline_date stamped, then the four-link cascade documented on that transition"
      - "increments PermitSubmittal.version by 1 and AduProject.version by 1"

  - method: POST
    path: "/permit-submittals/{id}/resubmit"
    description: "Returns a corrected design package to plan check. Rejects when the correction window has lapsed or when a BLOCKING correction is still OPEN."
    roles: [DesignLead]
    code: 200
    input: []
    output: PermitSubmittal
    side_effects:
      - "PermitSubmittal.status CORRECTIONS_REQUIRED -> UNDER_PLAN_CHECK, cycle_number and design_revision each +1, correction_deadline_date cleared"
      - "AduProject.status DESIGN_REVISION -> PERMITTING"
      - "on a lapsed window: PermitSubmittal.status CORRECTIONS_REQUIRED -> EXPIRED is persisted and the call is rejected with ERR_CORRECTION_WINDOW_EXPIRED"
      - "increments PermitSubmittal.version by 1"

  - method: GET
    path: "/permit-submittals/{id}/correction-items"
    description: "Lists the corrections raised against one submittal, oldest first."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["severity?", "status?", "limit?", "offset?"]
    output: CorrectionItem[]
    side_effects: []

  - method: POST
    path: "/correction-items/{id}/resolve"
    description: "Marks one plan-check correction as addressed."
    roles: [DesignLead]
    code: 200
    input: []
    output: CorrectionItem
    side_effects:
      - "CorrectionItem.status OPEN -> RESOLVED, resolved_on_date stamped"
      - "increments CorrectionItem.version by 1"

  # ---------------- financing ---------------------------------------------
  - method: POST
    path: "/adu-projects/{id}/financing-scenarios"
    description: "Prices a loan option against one appraisal approach. OCC-guarded on the project because the new scenario supersedes the prior ACTIVE one."
    roles: [FinanceAdvisor]
    code: 201
    input: [expected_adu_project_version, product_type, appraisal_approach, comparable_adjustment_cents, projected_monthly_rent_cents]
    output: FinancingScenario
    side_effects:
      - "any prior FinancingScenario of this project with status == ACTIVE moves to SUPERSEDED"
      - "stamps every computed field via calculations.financing_capacity"
      - "AduProject.financing_state UNFUNDED -> PRE_QUALIFIED when it was UNFUNDED"
      - "increments AduProject.version by 1"

  - method: GET
    path: "/adu-projects/{id}/financing-scenarios"
    description: "Lists the project's financing scenarios, oldest first."
    roles: [PlatformAdmin, DesignLead, ProjectManager, FinanceAdvisor, Homeowner]
    code: 200
    input: ["status?", "appraisal_approach?", "limit?", "offset?"]
    output: FinancingScenario[]
    side_effects: []

  - method: GET
    path: "/financing-scenarios/{id}"
    description: "Reads one financing scenario including its as-completed value and funding gap."
    roles: [PlatformAdmin, ProjectManager, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: FinancingScenario
    side_effects: []

  - method: POST
    path: "/financing-scenarios/{id}/commit"
    description: "Commits the project to this loan option; only a scenario with a zero funding gap may be committed."
    roles: [FinanceAdvisor]
    code: 200
    input: []
    output: FinancingScenario
    side_effects:
      - "FinancingScenario.status ACTIVE -> COMMITTED"
      - "any other FinancingScenario of the project already in COMMITTED moves to SUPERSEDED, keeping exactly one COMMITTED scenario per project"
      - "AduProject.financing_state PRE_QUALIFIED -> COMMITTED, or SHORTFALL -> COMMITTED"
      - "increments FinancingScenario.version by 1 and AduProject.version by 1"

  # ---------------- change orders ------------------------------------------
  - method: POST
    path: "/adu-projects/{id}/change-orders"
    description: "Homeowner raises a change order against the signed contract. OCC-guarded on the project because a change order may supersede an earlier one and the project's price may have moved."
    roles: [Homeowner]
    code: 201
    input: [expected_adu_project_version, title, scope_items, cost_delta_cents, schedule_delta_days, "supersedes_change_order_id?"]
    output: ChangeOrder
    side_effects:
      - "creates the row with status DRAFT, builder_fee_cents 0, authored_by_user_id = X-User-ID"
      - "increments AduProject.version by 1"

  - method: GET
    path: "/change-orders"
    description: "Lists change orders, optionally filtered by project, by the change order they supersede, or by status."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, FinanceAdvisor, Homeowner]
    code: 200
    input: ["adu_project_id?", "supersedes_change_order_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders/{id}"
    description: "Reads one change order including its markup tier percentages."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Homeowner sends a change order for decision; the same call returns a REVISION_REQUESTED change order to DRAFT."
    roles: [Homeowner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "ChangeOrder.status DRAFT -> SUBMITTED, or REVISION_REQUESTED -> DRAFT with decided_by_user_id cleared"
      - "increments ChangeOrder.version by 1"

  - method: POST
    path: "/change-orders/{id}/decide"
    description: "Project manager approves, rejects, or bounces a change order back for revision. Approval alone moves money."
    roles: [ProjectManager]
    code: 200
    input: [decision]
    output: ChangeOrder
    side_effects:
      - "APPROVE: runs calculations.change_order_price_reconciliation and the three-link funding cascade"
      - "REJECT: terminal, no fiscal side effects"
      - "REQUEST_REVISION: status -> REVISION_REQUESTED, no fiscal side effects"
      - "increments ChangeOrder.version by 1; on APPROVE also increments AduProject.version by 1"

  - method: POST
    path: "/change-orders/{id}/void"
    description: "Reverses an approved change order and restores the contract ledger exactly."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "ChangeOrder.status APPROVED -> VOIDED, builder_fee_cents and both percentages reset to 0"
      - "AduProject.contract_price_current_cents, approved_change_days and approved_change_order_count recomputed over the remaining APPROVED rows"
      - "the project's COMMITTED FinancingScenario is repriced; financing_state SHORTFALL -> COMMITTED when the gap closes"
      - "increments ChangeOrder.version by 1 and AduProject.version by 1"

  # ---------------- construction sequencing --------------------------------
  - method: POST
    path: "/adu-projects/{id}/construction-phases"
    description: "Adds a construction phase to the project's sequence, optionally behind a predecessor phase."
    roles: [ProjectManager]
    code: 201
    input: [phase_code, disruption_class, sequence_index, "depends_on_phase_id?"]
    output: ConstructionPhase
    side_effects: ["creates the row with status PLANNED and null window dates"]

  - method: GET
    path: "/construction-phases"
    description: "Lists construction phases, optionally filtered by project, by predecessor phase, or by status."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["adu_project_id?", "depends_on_phase_id?", "status?", "limit?", "offset?"]
    output: ConstructionPhase[]
    side_effects: []

  - method: GET
    path: "/construction-phases/{id}"
    description: "Reads one construction phase including its occupancy window."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects: []

  - method: POST
    path: "/construction-phases/{id}/schedule"
    description: "Books the phase's disruption window on the parcel. Windows are CLOSED intervals and, on an occupied parcel, must stay clear of every other booked window by the habitability buffer."
    roles: [ProjectManager]
    code: 200
    input: [window_start_date, window_end_date]
    output: ConstructionPhase
    side_effects:
      - "ConstructionPhase.status PLANNED or BLOCKED -> SCHEDULED, window dates stamped"
      - "increments ConstructionPhase.version by 1"

  - method: POST
    path: "/construction-phases/{id}/start"
    description: "Starts work on a scheduled phase; requires an approved permit and a completed predecessor."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects:
      - "ConstructionPhase.status SCHEDULED -> IN_PROGRESS, started_on_date stamped"
      - "AduProject.status PERMITTED -> UNDER_CONSTRUCTION on the project's first start"
      - "increments ConstructionPhase.version by 1"

  - method: POST
    path: "/construction-phases/{id}/complete"
    description: "Closes out a phase; every inspection on the phase must already be resolved."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects:
      - "ConstructionPhase.status IN_PROGRESS -> COMPLETE, completed_on_date stamped"
      - "increments ConstructionPhase.version by 1"

  # ---------------- inspections --------------------------------------------
  - method: POST
    path: "/construction-phases/{id}/inspection-appointments"
    description: "Books a jurisdiction inspection slot. Slots are HALF-OPEN intervals, so back-to-back bookings are allowed, but the inspector's per-day aggregate capacity still applies."
    roles: [ProjectManager]
    code: 201
    input: [inspector_id, inspection_type, slot_date, slot_start, slot_end]
    output: InspectionAppointment
    side_effects:
      - "creates the row with status SCHEDULED and adu_project_id copied from the phase"
      - "consumes one of the inspector's slots on slot_date"

  - method: GET
    path: "/inspection-appointments"
    description: "Lists inspection appointments, optionally filtered by project, phase, booked inspector, recording inspector, date, or status."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["adu_project_id?", "construction_phase_id?", "inspector_id?", "recorded_by_inspector_id?", "slot_date?", "status?", "limit?", "offset?"]
    output: InspectionAppointment[]
    side_effects: []

  - method: GET
    path: "/inspection-appointments/{id}"
    description: "Reads one inspection appointment."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: []
    output: InspectionAppointment
    side_effects: []

  - method: POST
    path: "/inspection-appointments/{id}/result"
    description: "The assigned inspector records the outcome. A FINAL inspection may not be signed by an inspector who has already recorded any other result on the same project."
    roles: [BuildingInspector]
    code: 200
    input: [outcome, "result_notes?"]
    output: InspectionAppointment
    side_effects:
      - "status -> PASSED, FAILED or PARTIAL; recorded_by_inspector_id = X-User-ID"
      - "PASSED and FAILED release the inspector's slot on slot_date; PARTIAL keeps holding it"
      - "increments InspectionAppointment.version by 1"

  - method: POST
    path: "/inspection-appointments/{id}/cancel"
    description: "Cancels a booked inspection and returns the slot to the inspector's day."
    roles: [ProjectManager]
    code: 200
    input: []
    output: InspectionAppointment
    side_effects:
      - "status -> CANCELLED and the inspector's slot on slot_date is released"
      - "increments InspectionAppointment.version by 1"

  # ---------------- final certificate & rental readiness --------------------
  - method: POST
    path: "/adu-projects/{id}/occupancy-certificate"
    description: "Issues the certificate of occupancy and runs the rental-readiness and short-term-rental restriction check."
    roles: [PlanChecker]
    code: 201
    input: []
    output: OccupancyCertificate
    side_effects:
      - "creates the immutable certificate with certificate_number, issued_on_date and final_inspection_passed_at stamped"
      - "stamps rental_classification, min_lease_days, rental_ready and blocking_reasons via calculations.rental_readiness_check"
      - "AduProject.status UNDER_CONSTRUCTION -> FINALED"
      - "increments AduProject.version by 1"

  - method: GET
    path: "/adu-projects/{id}/occupancy-certificates"
    description: "Lists the project's occupancy certificates; the array is length 0 before issuance and length 1 afterwards."
    roles: [PlatformAdmin, DesignLead, ProjectManager, PlanChecker, BuildingInspector, FinanceAdvisor, Homeowner]
    code: 200
    input: ["limit?", "offset?"]
    output: OccupancyCertificate[]
    side_effects: []

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the RBAC matrix."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_PROJECT_OWNER
    http: 403
    condition: "A Homeowner acts on a project whose property_id differs from the acting X-User-ID."
  - id: ERR_NOT_ASSIGNED_INSPECTOR
    http: 403
    condition: "A BuildingInspector records a result on an appointment whose inspector_id differs from the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "An inspector who already recorded a result on the project attempts to record the FINAL inspection result."
  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 422
    condition: "A required field is missing, a type is wrong, an enum value is unknown, a numeric range or date format is violated, or a pagination bound is exceeded."
  - id: ERR_EMPTY_CHANGE_ORDER
    http: 422
    condition: "A change order carries an empty scope_items array together with cost_delta_cents == 0 and schedule_delta_days == 0."
  # ---- existence ----
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No Jurisdiction row matches the supplied id."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "No Inspector row matches the supplied id."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "No Property row matches the supplied id."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No AduProject row matches the supplied id."
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "No FeasibilityScreening row matches screening_id, or it belongs to a different project."
  - id: ERR_SUBMITTAL_NOT_FOUND
    http: 404
    condition: "No PermitSubmittal row matches the supplied id."
  - id: ERR_CORRECTION_ITEM_NOT_FOUND
    http: 404
    condition: "No CorrectionItem row matches the supplied id."
  - id: ERR_UTILITY_CONNECTION_NOT_FOUND
    http: 404
    condition: "No UtilityConnection row matches the supplied id."
  - id: ERR_FINANCING_SCENARIO_NOT_FOUND
    http: 404
    condition: "No FinancingScenario row matches the supplied id."
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "No ChangeOrder row matches the supplied id, including supersedes_change_order_id."
  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "No ConstructionPhase row matches the supplied id, including depends_on_phase_id."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No InspectionAppointment row matches the supplied id."
  # ---- optimistic concurrency ----
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version differs from the parcel's current version."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_adu_project_version differs from the project's current version."
  # ---- state preconditions ----
  - id: ERR_PROJECT_PHASE_INVALID
    http: 409
    condition: "AduProject.status forbids the requested operation (submitting from a project outside FEASIBILITY_CLEARED, PERMITTED and UNDER_CONSTRUCTION, approving a change order outside PERMITTED and UNDER_CONSTRUCTION, scheduling a phase outside PERMITTED and UNDER_CONSTRUCTION, voiding on a FINALED project, or selecting a pathway twice)."
  - id: ERR_SUBMITTAL_STATE_INVALID
    http: 409
    condition: "The permit submittal is not in a state from which the requested action has a declared transition."
  - id: ERR_CORRECTION_ITEM_STATE_INVALID
    http: 409
    condition: "The correction item is already RESOLVED."
  - id: ERR_UTILITY_STATE_INVALID
    http: 409
    condition: "The utility connection is not in a state from which the requested action has a declared transition."
  - id: ERR_SCENARIO_STATE_INVALID
    http: 409
    condition: "The financing scenario is SUPERSEDED or already COMMITTED."
  - id: ERR_CHANGE_ORDER_STATE_INVALID
    http: 409
    condition: "The change order is not in a state from which the requested action has a declared transition."
  - id: ERR_PHASE_STATE_INVALID
    http: 409
    condition: "The construction phase is not in a state from which the requested action has a declared transition."
  - id: ERR_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "The inspection appointment is already PASSED, FAILED or CANCELLED."
  - id: ERR_PATHWAY_NOT_SELECTED
    http: 409
    condition: "A utility decision is requested before the project has an approved_pathway."
  - id: ERR_FEASIBILITY_FAILED
    http: 409
    condition: "The screening named in select-pathway has verdict FAIL."
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "The project's most recently created permit submittal is not APPROVED."
  # ---- safety / compliance ----
  - id: ERR_INSPECTOR_NOT_CERTIFIED
    http: 409
    condition: "The inspector's certifications do not cover the requested inspection_type."
  - id: ERR_INSPECTOR_INACTIVE
    http: 409
    condition: "The inspector's status is INACTIVE."
  - id: ERR_OCCUPIED_HABITABILITY_VIOLATION
    http: 409
    condition: "A UTILITY_SHUTOFF phase on an occupied parcel is scheduled for a window longer than one calendar day."
  # ---- referential / uniqueness ----
  - id: ERR_PHASE_DEPENDENCY_INCOMPLETE
    http: 409
    condition: "The phase named by depends_on_phase_id has not reached COMPLETE."
  - id: ERR_OPEN_INSPECTIONS_REMAIN
    http: 409
    condition: "A phase is being completed while an inspection on it is still SCHEDULED or PARTIAL."
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "Another Jurisdiction already uses this code."
  - id: ERR_DUPLICATE_UTILITY_SERVICE
    http: 409
    condition: "The project already has a utility connection for this service_type."
  # ---- temporal conflicts ----
  - id: ERR_PHASE_WINDOW_CONFLICT
    http: 409
    condition: "The requested closed window collides with another SCHEDULED or IN_PROGRESS phase window on the same parcel once the habitability buffer is applied."
  - id: ERR_INSPECTOR_SLOT_CONFLICT
    http: 409
    condition: "The requested half-open slot overlaps a SCHEDULED or PARTIAL appointment already held by the same inspector."
  - id: ERR_INSPECTOR_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "The inspector already holds daily_capacity appointments on that slot_date."
  - id: ERR_CORRECTION_WINDOW_EXPIRED
    http: 409
    condition: "A resubmit is attempted after correction_deadline_date; the submittal is moved to EXPIRED first."
  # ---- business constraints ----
  - id: ERR_NO_CORRECTIONS_ON_RECORD
    http: 409
    condition: "A CORRECTIONS_REQUIRED plan-check result is recorded with correction_items omitted or empty."
  - id: ERR_BLOCKING_CORRECTIONS_OPEN
    http: 409
    condition: "A resubmit or a plan-check approval is attempted while a BLOCKING correction is still OPEN."
  - id: ERR_UTILITY_DECISION_PENDING
    http: 409
    condition: "A permit submittal is filed while some utility connection is still PENDING_DECISION."
  - id: ERR_TITLE24_MISSING
    http: 409
    condition: "A permit submittal without a passing Title 24 report is filed."
  # ---- fiscal ----
  - id: ERR_CHANGE_CAP_EXCEEDED
    http: 409
    condition: "Approving the change order would push cumulative_change_pct_after strictly above 25.00 percent of the base contract price."
  - id: ERR_FUNDING_GAP_OPEN
    http: 409
    condition: "A financing scenario with a non-zero funding_gap_cents is committed."
  # ---- final certificate gates ----
  - id: ERR_CERTIFICATE_ALREADY_ISSUED
    http: 409
    condition: "The project already has an occupancy certificate."
  - id: ERR_UTILITY_NOT_ENERGIZED
    http: 409
    condition: "A certificate is requested while some utility connection is not ENERGIZED."
  - id: ERR_PHASES_INCOMPLETE
    http: 409
    condition: "A certificate is requested while some construction phase is not COMPLETE."
  - id: ERR_FINAL_INSPECTION_MISSING
    http: 409
    condition: "A certificate is requested with no PASSED FINAL inspection on the project."

roles:
  - name: PlatformAdmin
    description: "Builder-platform operator: registers jurisdictions and inspectors and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /inspectors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /properties (shared with DesignLead)"
      - "all GET reads except GET /financing-scenarios/{id} scope, which it also holds"

  - name: DesignLead
    description: "The builder's designer of record: runs feasibility, decides metering, prepares and files permit submittals, and clears corrections."
    identity: opaque
    exclusive_operations:
      - "POST /adu-projects"
      - "POST /adu-projects/{id}/feasibility-screenings"
      - "POST /adu-projects/{id}/select-pathway"
      - "POST /adu-projects/{id}/utility-connections"
      - "POST /utility-connections/{id}/decide"
      - "POST /adu-projects/{id}/permit-submittals"
      - "POST /permit-submittals/{id}/submit"
      - "POST /permit-submittals/{id}/resubmit"
      - "POST /correction-items/{id}/resolve"
    shared_operations:
      - "POST /properties (shared with PlatformAdmin)"
      - "GET reads across the project surface"

  - name: PlanChecker
    description: "Jurisdiction plan-check staff: records plan-check outcomes and issues the certificate of occupancy. Never touches contract money."
    identity: opaque
    exclusive_operations:
      - "POST /permit-submittals/{id}/plan-check-result"
      - "POST /adu-projects/{id}/occupancy-certificate"
    shared_operations:
      - "GET reads across the project surface except financing scenarios"

  - name: ProjectManager
    description: "The builder's construction manager: sequences phases, books inspections, energizes services, and decides change orders. Segregation of duties forbids this role from authoring change orders."
    identity: opaque
    exclusive_operations:
      - "POST /utility-connections/{id}/energize"
      - "POST /adu-projects/{id}/construction-phases"
      - "POST /construction-phases/{id}/schedule"
      - "POST /construction-phases/{id}/start"
      - "POST /construction-phases/{id}/complete"
      - "POST /construction-phases/{id}/inspection-appointments"
      - "POST /inspection-appointments/{id}/cancel"
      - "POST /change-orders/{id}/decide"
      - "POST /change-orders/{id}/void"
    shared_operations:
      - "GET reads across the project surface including financing scenarios"

  - name: Homeowner
    description: "The property owner. X-User-ID is the id of the Property they own, so ownership of a project resolves through AduProject.property_id. Authors change orders but may never decide one."
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /adu-projects/{id}/change-orders"
      - "POST /change-orders/{id}/submit"
    shared_operations:
      - "GET reads across their project surface including financing scenarios"

  - name: BuildingInspector
    description: "Jurisdiction field inspector. X-User-ID is the id of the Inspector row. Records inspection outcomes only on appointments booked to them, and may not sign the FINAL inspection on a project where they already recorded any other result."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection-appointments/{id}/result"
    shared_operations:
      - "GET reads across the project surface except financing scenarios"

  - name: FinanceAdvisor
    description: "Loan and appraisal advisor: prices financing scenarios and commits the project to one."
    identity: opaque
    exclusive_operations:
      - "POST /adu-projects/{id}/financing-scenarios"
      - "POST /financing-scenarios/{id}/commit"
    shared_operations:
      - "GET reads across the project surface including financing scenarios"
