      - name: minimum_discrepancy_fee_floors_a_zero_raw_cost_only_when_a_code_is_recorded
        claim_type: threshold
        grounds:
          - calculations.return_discrepancy_cost
          - calculations.return_discrepancy_cost.constants.MIN_DISCREPANCY_FEE_CENTS
          - state_machines.ReturnCondition[PENDING_INSPECTION -> CLEARED]
          - state_machines.ReturnCondition[PENDING_INSPECTION -> DISCREPANCIES_OPEN]
        distinguishing_aspect: |
          Both sides of the `raw == 0 and no codes` gate on identical airframe readings that are
          inside every ceiling (280.00 <= 300.00, 100 <= 120, 4200 >= 4000, so raw is exactly 0).
          With one code recorded the floor bites: cost 250,000, fully absorbed by the deposit, and
          the record lands in DISCREPANCIES_OPEN even though nothing measurable was over. With the
          code list emptied the very same readings cost 0, the record CLEARS, and the deposit is
          restored to the full 500,000 - proving the floor is keyed on the code list and that the
          waterfall is recomputed rather than accumulated.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Lease TERMINATING with ceilings 300.00 h / 120 cycles / 4000 kg, cap 900000, deposit 500000."
            - "Its ReturnCondition is PENDING_INSPECTION."
