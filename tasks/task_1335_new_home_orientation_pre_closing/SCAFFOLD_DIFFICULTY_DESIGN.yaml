            - { call: "POST /api/appointments/${a3}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a3}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a3}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at3: "$.data.id" } }
            - { call: "POST /api/attendees/${at3}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a3}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a3}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/feedback-surveys?home_id=${h2}&status=ISSUED", payload: {}, as: CustomerCareManager, captures: { s3: "$.data[0].id" } }
            - { call: "POST /api/feedback-surveys/${s3}/submit", payload: { overall_rating: 4, systems_demo_rating: 4, timeliness_rating: 4, would_recommend: true }, as: Homebuyer, as_user_id: "${b1}" }
          trigger:
