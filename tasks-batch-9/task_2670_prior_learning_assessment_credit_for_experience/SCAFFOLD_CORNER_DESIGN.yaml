            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu1_id}"
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "GET /pla-claims/${claim_id}"
              as: Student
              as_user_id: "${stu2_id}"
              captures: { err1: "$.data.error_id" }
          assert:
            - "the trigger returns status 403 with data.error_id == ERR_FORBIDDEN_STUDENT_SCOPE"
            - "GET /portfolios/${pf_id}, GET /artifacts/${a1_id} and GET /students/${stu1_id}/graduation-audit as S-1002 all return 403 ERR_FORBIDDEN_STUDENT_SCOPE"
            - "POST /pla-claims/${claim_id}/submit and POST /pla-claims/${claim_id}/withdraw as S-1002 both return 403 ERR_FORBIDDEN_STUDENT_SCOPE"
