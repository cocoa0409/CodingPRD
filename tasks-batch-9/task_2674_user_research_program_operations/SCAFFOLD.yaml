scenario: |
  Generate task harder than expert level!

  2674. User Research Program Operations (product user research team): research request intake with
  question framing, method selection and prioritization against roadmap decisions, participant
  recruitment across customer lists and panels with screening criteria and incentive administration,
  consent and privacy handling for recordings, transcripts and personally identifiable information
  with retention limits, study execution across interviews, usability tests, diary studies and
  surveys with moderator guides, analysis with tagging, theme development and evidence linkage to
  findings, research repository management with searchable insights and reuse across teams,
  stakeholder readouts with decision recommendations and follow-up tracking, research operations
  metrics on cycle time and study impact

domain_name: user-research-program-operations
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  # Study/Finding/Theme/ResearchArtifact form a many-to-many evidence graph through
  # EvidenceLink; Theme is self-referential (parent_theme_id) with a bounded depth.
  state_machine_shape: parallel
  # Study carries two independent state dimensions (execution_status x recruitment_status);
  # Recruitment carries (status x incentive_state). ResearchRequest and RoadmapDecision are
  # cyclic (NEEDS_REFRAMING -> SUBMITTED, LOCKED -> OPEN).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The user id that authored a Finding may never be the user id that publishes it; the
  # ResearchLead role is allowed to author findings, which makes the constraint observable.
  consistency_model: immediate

entities:
  - name: RoadmapDecision
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Product decision the research program is expected to inform.
        constraints: non-empty, max 200 chars
      - name: decision_deadline
        type: datetime
        source: input
        description: ISO 8601 UTC instant by which the decision must be made; drives the urgency tier of request_priority_score.
      - name: reversibility
        type: enum
        source: input
        description: How costly the decision is to undo; sets the decision weight in request_priority_score.
        constraints: "IRREVERSIBLE | REVERSIBLE"
      - name: impacted_user_count
        type: integer
        source: input
        description: Number of end users the decision touches; drives the reach tier of request_priority_score.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: OPEN accepts new fielding; LOCKED means the decision is frozen against further study fielding.
        default: OPEN
        constraints: "OPEN | LOCKED"
      - name: evidence_confidence
        type: number
        source: computed
        description: Aggregate confidence contributed by ACCEPTED readouts; recomputed by decision_evidence_confidence.
        default: 0.00
        constraints: 2 decimal places, 0.00..1.00
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent OPEN -> LOCKED transition; null while OPEN.
        default: null

  - name: ResearchRequest
    parent: null
    common_fields: true
    fields:
      - name: roadmap_decision_id
        type: string
        source: input
        description: FK -> RoadmapDecision.id; the decision this request claims to inform.
      - name: requester_user_id
        type: string
        source: system
        description: X-User-ID of the Stakeholder that created the request; opaque operator id, never an entity id.
      - name: question
        type: string
        source: input
        description: Framed research question under test; overwritten verbatim on every resubmit.
        constraints: non-empty, max 500 chars
      - name: question_type
        type: enum
        source: input
        description: Shape of the question; drives the recommended_method decision table.
        constraints: "DISCOVERY | EVALUATIVE | BEHAVIORAL_LONGITUDINAL | MEASUREMENT"
      - name: evidence_gap
        type: enum
        source: input
        description: How much existing evidence is missing; contributes gap points to request_priority_score.
        constraints: "NONE | PARTIAL | FULL"
      - name: status
        type: enum
        source: system
        description: Intake lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | NEEDS_REFRAMING | REJECTED | IN_STUDY | CLOSED"
      - name: priority_score
        type: number
        source: computed
        description: Output of request_priority_score, stamped on every triage; null before first triage.
        default: null
        constraints: 2 decimal places, 0.00..100.00
      - name: recommended_method
        type: enum
        source: computed
        description: Output of method_recommendation; null before first triage.
        default: null
        constraints: "INTERVIEW | USABILITY_TEST | DIARY_STUDY | SURVEY"
      - name: approved_method
        type: enum
        source: computed
        description: Method a Study on this request must use; equals method_override when triage supplied one, else recommended_method.
        default: null
        constraints: "INTERVIEW | USABILITY_TEST | DIARY_STUDY | SURVEY"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed reframing loops; incremented by resubmit.
        default: 0
        constraints: "0..2"
      - name: triage_reason
        type: string
        source: system
        description: Reason recorded by the most recent triage or by the automatic revision-limit rejection.
        default: null
      - name: triaged_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent triage.
        default: null

  - name: ParticipantPool
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label for the recruitment source.
        constraints: non-empty, unique
      - name: pool_type
        type: enum
        source: input
        description: Recruitment source class.
        constraints: "CUSTOMER_LIST | EXTERNAL_PANEL | INTERNAL_DOGFOOD"
      - name: contact_cap_per_window
        type: integer
        source: input
        description: Maximum recruitments a single Participant of this pool may receive inside contact_window_days.
        constraints: ">= 1"
      - name: contact_window_days
        type: integer
        source: input
        description: Length in days of the rolling contact-fatigue window.
        constraints: ">= 1"
      - name: incentive_budget_cents
        type: integer
        source: input
        description: Total incentive budget of the pool in cents; conserved quantity of the incentive ledger invariant.
        constraints: ">= 0"
      - name: incentive_reserved_cents
        type: integer
        source: computed
        description: Sum of Recruitment.reserved_cents over recruitments of this pool's participants whose incentive_state == RESERVED.
        default: 0
      - name: incentive_paid_cents
        type: integer
        source: computed
        description: Sum of Recruitment.paid_cents over recruitments of this pool's participants whose incentive_state == PAID.
        default: 0
      - name: incentive_available_cents
        type: integer
        source: computed
        description: incentive_budget_cents - incentive_reserved_cents - incentive_paid_cents.
        default: 0
      - name: last_estimate_cents
        type: integer
        source: system
        description: Result of the most recent FORWARD_ESTIMATE settlement run; advisory only, never moves money.
        default: null
      - name: settled_study_ids
        type: array
        source: system
        description: Ids of Study rows already settled in CHRONOLOGICAL_ACTUAL mode against this pool; blocks a second binding run.
        default: []
      - name: status
        type: enum
        source: computed
        description: Budget posture derived by pool_posture; gates recruitment endpoints.
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: participant_count
        type: integer
        source: computed
        description: Count of Participant rows with pool_id == this pool.
        default: 0
      - name: suppressed_participant_count
        type: integer
        source: computed
        description: Count of Participant rows with pool_id == this pool and status == SUPPRESSED.
        default: 0

  - name: Participant
    parent: ParticipantPool
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: input
        description: FK -> ParticipantPool.id; taken from the creation path segment.
      - name: external_ref
        type: string
        source: input
        description: Pseudonymous handle of the person in the source system.
        constraints: non-empty, unique within pool_id
      - name: segment
        type: string
        source: input
        description: Behavioural segment label matched against Study.screening_criteria.required_segment.
        constraints: non-empty
      - name: locale
        type: string
        source: input
        description: BCP-47 locale matched against Study.screening_criteria.required_locale.
        constraints: non-empty
      - name: pii_on_file
        type: boolean
        source: input
        description: Whether directly identifying data is held for this person.
        default: true
      - name: last_contacted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent recruitment created for this participant.
        default: null
      - name: contacts_in_window
        type: integer
        source: computed
        description: Count of Recruitment rows for this participant with created_at > clock_now - pool.contact_window_days days (lower bound exclusive).
        default: 0
      - name: no_show_strikes
        type: integer
        source: system
        description: Count of NO_SHOW recruitments; two strikes suppress the participant.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Contact eligibility posture derived by participant_eligibility.
        default: ELIGIBLE
        constraints: "ELIGIBLE | COOLDOWN | SUPPRESSED"

  - name: Study
    parent: ResearchRequest
    common_fields: true
    fields:
      - name: research_request_id
        type: string
        source: input
        description: FK -> ResearchRequest.id; the approved request this study executes.
      - name: participant_pool_id
        type: string
        source: input
        description: FK -> ParticipantPool.id; the single pool this study recruits from.
      - name: lead_user_id
        type: string
        source: system
        description: X-User-ID of the ResearchLead that created the study; opaque operator id, never an entity id.
      - name: method
        type: enum
        source: input
        description: Execution method; must equal ResearchRequest.approved_method.
        constraints: "INTERVIEW | USABILITY_TEST | DIARY_STUDY | SURVEY"
      - name: target_participant_count
        type: integer
        source: input
        description: Completed-session target; reaching it flips recruitment_status to QUOTA_MET.
        constraints: ">= 1"
      - name: screening_criteria
        type: object
        source: input
        description: "Screening rubric with exactly these keys: required_segment (string), required_locale (string), target_answers (array of string), disqualifying_answers (array of string)."
      - name: incentive_amount_cents
        type: integer
        source: input
        description: Base per-participant incentive in cents before the scarcity surcharge.
        constraints: ">= 0"
      - name: fielding_start
        type: datetime
        source: input
        description: Inclusive start of the fielding window; session scheduling and pool-window overlap use it.
      - name: fielding_end
        type: datetime
        source: input
        description: Inclusive end of the fielding window; must be strictly after fielding_start.
      - name: guide_version_label
        type: string
        source: system
        description: Label of the current moderator-guide draft; set by the guide upsert.
        default: null
      - name: guide_question_count
        type: integer
        source: system
        description: Question count of the current moderator-guide draft.
        default: null
      - name: guide_status
        type: enum
        source: system
        description: Moderator-guide approval state.
        default: NONE
        constraints: "NONE | DRAFT | APPROVED"
      - name: guide_version_pinned
        type: string
        source: system
        description: guide_version_label frozen at guide approval; copied onto every Recruitment at scheduling.
        default: null
      - name: execution_status
        type: enum
        source: system
        description: First state dimension - study execution progress.
        default: PLANNED
        constraints: "PLANNED | GUIDE_APPROVED | FIELDING | ANALYSIS | REPORTED | CLOSED"
      - name: recruitment_status
        type: enum
        source: system
        description: Second state dimension - recruitment progress, evolving independently of execution_status.
        default: NOT_STARTED
        constraints: "NOT_STARTED | RECRUITING | QUOTA_MET | RECRUITMENT_FAILED"
      - name: invited_count
        type: integer
        source: computed
        description: Count of Recruitment rows with study_id == this study (any status).
        default: 0
      - name: screened_in_count
        type: integer
        source: computed
        description: Count of Recruitment rows with study_id == this study and status IN {SCREENED_IN, SCHEDULED, COMPLETED, NO_SHOW}.
        default: 0
      - name: completed_count
        type: integer
        source: computed
        description: Count of Recruitment rows with study_id == this study and status == COMPLETED.
        default: 0
      - name: fielded_at
        type: datetime
        source: system
        description: Logical-clock instant of the GUIDE_APPROVED -> FIELDING transition.
        default: null
      - name: fielding_closed_at
        type: datetime
        source: system
        description: Logical-clock instant of the FIELDING -> ANALYSIS transition.
        default: null

  - name: Recruitment
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> Study.id; taken from the creation path segment.
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the invited person.
      - name: screening_answers
        type: object
        source: input
        description: "Screener submission with exactly these keys: segment (string), locale (string), answers (array of string)."
      - name: screen_score
        type: number
        source: computed
        description: Output of screen_score; null until the screen action runs.
        default: null
        constraints: 2 decimal places, 0.00..100.00
      - name: status
        type: enum
        source: system
        description: First state dimension - recruitment lifecycle.
        default: INVITED
        constraints: "INVITED | SCREENED_IN | SCREENED_OUT | SCHEDULED | COMPLETED | NO_SHOW | WITHDRAWN"
      - name: incentive_state
        type: enum
        source: system
        description: Second state dimension - money lifecycle, evolving independently of status.
        default: RESERVED
        constraints: "RESERVED | PAID | FORFEITED | RELEASED"
      - name: reserved_cents
        type: integer
        source: computed
        description: Output of incentive_reservation at invitation time; the exact amount released or paid later.
      - name: paid_cents
        type: integer
        source: computed
        description: Amount actually paid by the CHRONOLOGICAL_ACTUAL settlement; 0 until then.
        default: 0
      - name: scheduled_start
        type: datetime
        source: system
        description: Session start set by the schedule action; null before scheduling.
        default: null
      - name: scheduled_end
        type: datetime
        source: system
        description: Session end set by the schedule action; null before scheduling.
        default: null
      - name: moderator_user_id
        type: string
        source: system
        description: X-User-ID recorded as session moderator at scheduling; opaque operator id, never an entity id.
        default: null
      - name: guide_version_pinned
        type: string
        source: system
        description: Study.guide_version_pinned copied at scheduling time so a later guide edit cannot rewrite history.
        default: null
      - name: actual_duration_min
        type: integer
        source: system
        description: Duration reported by the complete action.
        default: null
      - name: reschedule_count
        type: integer
        source: system
        description: Number of SCHEDULED -> SCHEDULED loops performed on this recruitment.
        default: 0
      - name: closure_reason
        type: string
        source: system
        description: Free-text reason recorded by the withdraw or no-show action.
        default: null

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the person granting consent.
      - name: study_id
        type: string
        source: input
        description: FK -> Study.id; consent is always scoped to one study.
      - name: scopes
        type: array
        source: input
        description: "Granted scopes, non-empty subset of {RECORDING, TRANSCRIPT, PII_QUOTE}; each artifact type requires its matching scope."
        constraints: non-empty, no duplicates
      - name: retention_days
        type: integer
        source: input
        description: Requested retention period; capped per scope by retention_horizon.
        constraints: ">= 1"
      - name: granted_at
        type: datetime
        source: system
        description: Logical-clock instant at creation.
      - name: retention_until
        type: datetime
        source: computed
        description: Output of retention_horizon; the sweep expires the record at or after this instant.
      - name: status
        type: enum
        source: system
        description: Consent lifecycle state.
        default: GRANTED
        constraints: "GRANTED | REVOKED | EXPIRED"
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of the GRANTED -> REVOKED transition.
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: The reason supplied to POST /consent-records/{id}/revoke; stays null on a GRANTED -> EXPIRED retention expiry.
        default: null

  - name: ResearchArtifact
    parent: Recruitment
    common_fields: true
    fields:
      - name: recruitment_id
        type: string
        source: input
        description: FK -> Recruitment.id; taken from the creation path segment.
      - name: artifact_type
        type: enum
        source: input
        description: "Artifact class; requires the matching consent scope (RECORDING->RECORDING, TRANSCRIPT->TRANSCRIPT, PII_NOTE->PII_QUOTE)."
        constraints: "RECORDING | TRANSCRIPT | PII_NOTE"
      - name: contains_pii
        type: boolean
        source: input
        description: Whether the artifact body holds directly identifying data.
      - name: retention_until
        type: datetime
        source: computed
        description: Copied from the ConsentRecord that authorised this artifact type at creation time.
      - name: lifecycle_state
        type: enum
        source: system
        description: RETAINED while the authorising consent stands; PURGED once revoked or expired.
        default: RETAINED
        constraints: "RETAINED | PURGED"
      - name: purged_at
        type: datetime
        source: system
        description: Logical-clock instant of the RETAINED -> PURGED transition.
        default: null
      - name: purge_reason
        type: enum
        source: system
        description: Which consent event purged the artifact.
        default: null
        constraints: "CONSENT_REVOKED | RETENTION_EXPIRED"

  - name: Theme
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Repository-wide theme label.
        constraints: non-empty, unique across all themes
      - name: parent_theme_id
        type: string
        source: input
        description: FK -> Theme.id; null for a root theme. Self-referential edge of the insight repository tree.
        default: null
      - name: depth
        type: integer
        source: computed
        description: 1 for a root theme, parent.depth + 1 otherwise; capped at THEME_MAX_DEPTH.
        default: 1
      - name: own_evidence_weight
        type: number
        source: computed
        description: Weight contributed by PUBLISHED findings whose theme_id is this theme; see theme_evidence_weight.
        default: 0.00
      - name: evidence_weight
        type: number
        source: computed
        description: own_evidence_weight plus the evidence_weight of every child theme; drives status.
        default: 0.00
      - name: reuse_count
        type: integer
        source: computed
        description: Count of ACCEPTED Readout rows whose cited_finding_ids include a Finding of this theme or of any descendant theme.
        default: 0
      - name: status
        type: enum
        source: computed
        description: ESTABLISHED once evidence_weight >= THEME_ESTABLISH_MIN, EMERGING otherwise.
        default: EMERGING
        constraints: "EMERGING | ESTABLISHED"

  - name: Finding
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> Study.id; the study that produced the finding.
      - name: theme_id
        type: string
        source: input
        description: FK -> Theme.id; the repository theme this finding rolls up into.
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator; the publisher must differ from it. Opaque operator id, never an entity id.
      - name: statement
        type: string
        source: input
        description: One-sentence claim the evidence supports.
        constraints: non-empty, max 500 chars
      - name: severity
        type: enum
        source: input
        description: Product severity; multiplies the theme weight contribution.
        constraints: "LOW | MEDIUM | HIGH"
      - name: evidence_strength
        type: number
        source: computed
        description: Output of evidence_strength under the variant selected by status.
        default: 0.00
        constraints: 2 decimal places, 0.00..1.00
      - name: strength_variant
        type: enum
        source: computed
        description: Which evidence_strength variant produced the stored value.
        default: PROVISIONAL
        constraints: "PROVISIONAL | CORROBORATED"
      - name: admissible_link_count
        type: integer
        source: computed
        description: Count of EvidenceLink rows with finding_id == this finding and is_admissible == true.
        default: 0
      - name: distinct_participant_count
        type: integer
        source: computed
        description: Count of distinct Recruitment.participant_id values reachable from admissible links via ResearchArtifact.recruitment_id.
        default: 0
      - name: status
        type: enum
        source: system
        description: Analysis lifecycle state; adding an evidence link to an EVIDENCE_LOCKED finding drops it back to DRAFT.
        default: DRAFT
        constraints: "DRAFT | EVIDENCE_LOCKED | PUBLISHED | RETRACTED"
      - name: retraction_reason
        type: enum
        source: system
        description: Why the finding was retracted by the evidence-withdrawal cascade.
        default: null
        constraints: "EVIDENCE_WITHDRAWN"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the EVIDENCE_LOCKED -> PUBLISHED transition.
        default: null

  - name: EvidenceLink
    parent: Finding
    common_fields: true
    fields:
      - name: finding_id
        type: string
        source: input
        description: FK -> Finding.id; taken from the creation path segment.
      - name: artifact_id
        type: string
        source: input
        description: FK -> ResearchArtifact.id; the evidence being cited.
      - name: excerpt_ref
        type: string
        source: input
        description: Stable pointer into the artifact (timecode or paragraph anchor).
        constraints: non-empty
      - name: weight_class
        type: enum
        source: input
        description: Epistemic class of the excerpt; sets CLASS_WEIGHT in evidence_strength.
        constraints: "DIRECT_QUOTE | OBSERVED_BEHAVIOR | SELF_REPORT"
      - name: contribution
        type: number
        source: computed
        description: "round(CLASS_WEIGHT[weight_class] * METHOD_MULT[study.method], 2) - the per-link rounded term of evidence_strength."
        constraints: 2 decimal places
      - name: is_admissible
        type: boolean
        source: computed
        description: true while the cited artifact is RETAINED; flipped to false by the evidence-withdrawal cascade.
        default: true
      - name: inadmissible_reason
        type: enum
        source: system
        description: Why the link stopped counting.
        default: null
        constraints: "ARTIFACT_PURGED"

  - name: Readout
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> Study.id; taken from the creation path segment.
      - name: roadmap_decision_id
        type: string
        source: input
        description: FK -> RoadmapDecision.id; the decision this readout feeds.
      - name: recommendation
        type: string
        source: input
        description: Narrative recommendation shown to stakeholders.
        constraints: non-empty, max 1000 chars
      - name: recommended_action
        type: enum
        source: input
        description: Machine-readable recommendation.
        constraints: "PROCEED | PIVOT | HOLD"
      - name: cited_finding_ids
        type: array
        source: input
        description: Ids of Finding rows cited by this readout; every element MUST reference a Finding whose study_id equals this readout's study_id.
        constraints: non-empty, no duplicates
      - name: status
        type: enum
        source: system
        description: Readout lifecycle state; SUPERSEDED is set on prior DRAFT readouts when a newer draft is created.
        default: DRAFT
        constraints: "DRAFT | SUPERSEDED | DELIVERED | ACCEPTED | DEFERRED"
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT -> DELIVERED transition.
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the DELIVERED -> ACCEPTED or DELIVERED -> DEFERRED transition.
        default: null
      - name: response_note
        type: string
        source: system
        description: Stakeholder note recorded with the response.
        default: null
      - name: decision_confidence_before
        type: number
        source: computed
        description: RoadmapDecision.evidence_confidence captured immediately before this readout was accepted.
        default: null
      - name: decision_confidence_after
        type: number
        source: computed
        description: RoadmapDecision.evidence_confidence recomputed immediately after this readout was accepted.
        default: null

  - name: FollowUp
    parent: Readout
    common_fields: true
    fields:
      - name: readout_id
        type: string
        source: input
        description: FK -> Readout.id; taken from the creation path segment.
      - name: owner_user_id
        type: string
        source: input
        description: X-User-ID of the Stakeholder accountable for the action; opaque operator id, never an entity id.
        constraints: non-empty
      - name: description
        type: string
        source: input
        description: Action item text.
        constraints: non-empty, max 500 chars
      - name: due_date
        type: datetime
        source: input
        description: Instant after which the retention sweep marks the item OVERDUE.
      - name: status
        type: enum
        source: system
        description: Follow-up tracking state.
        default: OPEN
        constraints: "OPEN | OVERDUE | DONE"
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into DONE.
        default: null

state_machines:
  - entity: RoadmapDecision
    initial_state: OPEN
    terminal_states: []
    note: Cyclic - a decision that loses evidence confidence returns to OPEN.
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /roadmap-decisions/{id}/lock"
        actor: Stakeholder
        preconditions:
          - "decision.status == OPEN"
          - "decision_evidence_confidence(decision) >= LOCK_MIN_CONFIDENCE (0.60), else ERR_CONFIDENCE_BELOW_LOCK_THRESHOLD"
        side_effects:
          - "evidence_confidence recomputed by decision_evidence_confidence and stored"
          - "locked_at set to the logical clock instant"
          - "no Study whose research_request.roadmap_decision_id == this decision may enter FIELDING while LOCKED"
      - from: LOCKED
        to: OPEN
        trigger: "system: evidence-withdrawal cascade hop 5 (see ConsentRecord GRANTED -> REVOKED and GRANTED -> EXPIRED)"
        actor: system
        preconditions:
          - "decision.status == LOCKED"
          - "decision_evidence_confidence(decision) < LOCK_MIN_CONFIDENCE (0.60) after the recompute triggered by a Finding PUBLISHED -> RETRACTED hop"
        side_effects:
          - "evidence_confidence overwritten with the recomputed value"
          - "locked_at cleared to null"

  - entity: ResearchRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CLOSED]
    note: Cyclic - NEEDS_REFRAMING returns to SUBMITTED at most MAX_REVISION_ROUNDS (2) times.
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /research-requests/{id}/triage with outcome == APPROVED"
        actor: ResearchLead
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "priority_score recomputed by request_priority_score and stored"
          - "recommended_method recomputed by method_recommendation and stored"
          - "approved_method set to method_override when supplied, else to recommended_method"
          - "triaged_at set to the logical clock instant; triage_reason set to the supplied reason or null"
      - from: SUBMITTED
        to: NEEDS_REFRAMING
        trigger: "POST /research-requests/{id}/triage with outcome == NEEDS_REFRAMING"
        actor: ResearchLead
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "priority_score and recommended_method recomputed and stored"
          - "approved_method left null"
          - "triage_reason set to the supplied reason; triaged_at set to the logical clock instant"
      - from: NEEDS_REFRAMING
        to: REJECTED
        trigger: "POST /research-requests/{id}/triage with outcome == REJECTED"
        actor: ResearchLead
        preconditions:
          - "request.status == NEEDS_REFRAMING"
        side_effects:
          - "priority_score and recommended_method recomputed and stored"
          - "triage_reason set to the supplied reason; triaged_at set to the logical clock instant"
          - "the reframing cycle is closed off: a request whose revision_round has reached MAX_REVISION_ROUNDS (2) can only leave NEEDS_REFRAMING through this transition"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /research-requests/{id}/triage with outcome == REJECTED"
        actor: ResearchLead
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "priority_score and recommended_method recomputed and stored"
          - "triage_reason set to the supplied reason; triaged_at set to the logical clock instant"
      - from: NEEDS_REFRAMING
        to: SUBMITTED
        trigger: "POST /research-requests/{id}/resubmit"
        actor: Stakeholder
        preconditions:
          - "request.status == NEEDS_REFRAMING"
          - "X-User-ID == request.requester_user_id, else ERR_OWNERSHIP_REQUIRED"
          - "request.revision_round < MAX_REVISION_ROUNDS (2), else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "question, question_type and evidence_gap overwritten with the submitted values"
          - "revision_round incremented by 1"
          - "priority_score, recommended_method and approved_method cleared to null"
      - from: APPROVED
        to: IN_STUDY
        trigger: "POST /studies (creation of the first Study for this request)"
        actor: system
        preconditions:
          - "request.status == APPROVED"
        side_effects:
          - "no further Study may be created for this request while status == IN_STUDY"
      - from: IN_STUDY
        to: CLOSED
        trigger: "system: POST /readouts/{id}/respond with outcome == ACCEPTED on a readout of this request's study"
        actor: system
        preconditions:
          - "request.status == IN_STUDY"
        side_effects:
          - "request becomes terminal; resubmit and triage are both rejected afterwards"

  - entity: ParticipantPool
    initial_state: OPEN
    terminal_states: []
    note: Derived budget posture; every transition is a recompute of pool_posture, never a direct client action.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: pool_posture recompute after any change to incentive_reserved_cents / incentive_paid_cents / suppressed_participant_count"
        actor: system
        preconditions:
          - "0.80 <= utilization < 0.95 where utilization = (incentive_reserved_cents + incentive_paid_cents) / incentive_budget_cents"
        side_effects:
          - "auto-invite is rejected with ERR_POOL_RESTRICTED while RESTRICTED; single-participant invitation still allowed"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system: pool_posture recompute"
        actor: system
        preconditions:
          - "utilization >= 0.95"
        side_effects:
          - "every recruitment-creating endpoint is rejected with ERR_POOL_CLOSED while CLOSED"
      - from: OPEN
        to: CLOSED
        trigger: "system: pool_posture recompute"
        actor: system
        preconditions:
          - "utilization >= 0.95 with no intervening recompute at the RESTRICTED band"
        side_effects:
          - "every recruitment-creating endpoint is rejected with ERR_POOL_CLOSED while CLOSED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: pool_posture recompute after a release (withdraw, no-show or settlement)"
        actor: system
        preconditions:
          - "utilization < 0.80 and suppressed_participant_count / participant_count <= 0.50"
        side_effects:
          - "auto-invite becomes available again"
      - from: CLOSED
        to: RESTRICTED
        trigger: "system: pool_posture recompute after a release"
        actor: system
        preconditions:
          - "0.80 <= utilization < 0.95"
        side_effects:
          - "single-participant invitation becomes available again"

  - entity: Participant
    initial_state: ELIGIBLE
    terminal_states: [SUPPRESSED]
    note: Derived contact posture; SUPPRESSED is absorbing.
    transitions:
      - from: ELIGIBLE
        to: COOLDOWN
        trigger: "system: participant_eligibility recompute after POST /studies/{id}/recruitments or POST /studies/{id}/recruitments/auto-invite"
        actor: system
        preconditions:
          - "participant.contacts_in_window >= pool.contact_cap_per_window"
          - "participant.no_show_strikes < NO_SHOW_SUPPRESSION_STRIKES (2)"
        side_effects:
          - "participant is excluded from the auto-invite candidate set"
          - "single-participant invitation is rejected with ERR_CONTACT_CAP_EXCEEDED"
      - from: COOLDOWN
        to: ELIGIBLE
        trigger: "system: participant_eligibility recompute during POST /_ops/retention-sweep"
        actor: system
        preconditions:
          - "participant.contacts_in_window < pool.contact_cap_per_window after the logical clock advanced past the rolling window"
          - "participant.no_show_strikes < NO_SHOW_SUPPRESSION_STRIKES (2)"
        side_effects:
          - "participant re-enters the auto-invite candidate set"
      - from: ELIGIBLE
        to: SUPPRESSED
        trigger: "system: no-show cascade hop 3 (see Recruitment SCHEDULED -> NO_SHOW)"
        actor: system
        preconditions:
          - "participant.no_show_strikes >= NO_SHOW_SUPPRESSION_STRIKES (2)"
        side_effects:
          - "pool.suppressed_participant_count incremented, then pool_posture recomputed"
          - "every future invitation for this participant is rejected with ERR_PARTICIPANT_SUPPRESSED"
      - from: COOLDOWN
        to: SUPPRESSED
        trigger: "system: no-show cascade hop 3 (see Recruitment SCHEDULED -> NO_SHOW)"
        actor: system
        preconditions:
          - "participant.no_show_strikes >= NO_SHOW_SUPPRESSION_STRIKES (2)"
        side_effects:
          - "pool.suppressed_participant_count incremented, then pool_posture recomputed"

  - entity: Study
    dimension: execution_status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    note: First of two independent state dimensions on Study; evolves without constraining recruitment_status.
    transitions:
      - from: PLANNED
        to: GUIDE_APPROVED
        trigger: "POST /studies/{id}/guide/approve"
        actor: ResearchLead
        preconditions:
          - "study.execution_status == PLANNED"
          - "study.guide_status == DRAFT, else ERR_GUIDE_NOT_APPROVED"
        side_effects:
          - "guide_status set to APPROVED"
          - "guide_version_pinned set to the current guide_version_label (version pinning at approval)"
      - from: GUIDE_APPROVED
        to: GUIDE_APPROVED
        trigger: "POST /studies/{id}/guide/approve (re-approval after a guide rewrite)"
        actor: ResearchLead
        preconditions:
          - "study.execution_status == GUIDE_APPROVED"
          - "study.guide_status == DRAFT - i.e. PUT /studies/{id}/guide has reset it since the last approval; approving an already APPROVED guide is refused with ERR_GUIDE_NOT_APPROVED"
        side_effects:
          - "guide_status set back to APPROVED"
          - "guide_version_pinned re-pinned to the current guide_version_label"
          - "execution_status unchanged - the self-loop is the only way back to a fieldable guide after a rewrite"
      - from: GUIDE_APPROVED
        to: FIELDING
        trigger: "POST /studies/{id}/field"
        actor: ResearchLead
        preconditions:
          - "study.execution_status == GUIDE_APPROVED"
          - "the RoadmapDecision reached through study.research_request_id -> ResearchRequest.roadmap_decision_id has status == OPEN, else ERR_DECISION_LOCKED"
          - "FEWER THAN POOL_MAX_CONCURRENT_FIELDING (2) other studies with participant_pool_id == study.participant_pool_id and execution_status == FIELDING have a fielding window that overlaps this study's window on closed-interval arithmetic - so at most 2 studies of one pool may share any instant in the field - else ERR_POOL_FIELDING_CAPACITY"
        side_effects:
          - "fielded_at set to the logical clock instant"
          - "recruitment endpoints for this study become available"
      - from: FIELDING
        to: ANALYSIS
        trigger: "POST /studies/{id}/close-fielding"
        actor: ResearchLead
        preconditions:
          - "study.execution_status == FIELDING"
          - "no Recruitment of this study has status == SCHEDULED, else ERR_INVALID_STATE"
        side_effects:
          - "fielding_closed_at set to the logical clock instant"
          - "recruitment_status set to RECRUITMENT_FAILED when completed_count == 0 (see the recruitment dimension)"
          - "findings may now be locked; CHRONOLOGICAL_ACTUAL settlement becomes permitted"
      - from: ANALYSIS
        to: REPORTED
        trigger: "POST /readouts/{id}/deliver on a readout of this study"
        actor: ResearchLead
        preconditions:
          - "study.execution_status == ANALYSIS"
        side_effects:
          - "study.version incremented by 1"
      - from: REPORTED
        to: CLOSED
        trigger: "POST /readouts/{id}/respond with outcome == ACCEPTED on a readout of this study"
        actor: system
        preconditions:
          - "study.execution_status == REPORTED"
        side_effects:
          - "the study's ResearchRequest transitions IN_STUDY -> CLOSED"
          - "study.version incremented by 1"

  - entity: Study
    dimension: recruitment_status
    initial_state: NOT_STARTED
    terminal_states: [RECRUITMENT_FAILED]
    note: Second independent state dimension on Study; cycles between RECRUITING and QUOTA_MET as sessions fill and fall through.
    transitions:
      - from: NOT_STARTED
        to: RECRUITING
        trigger: "POST /studies/{id}/recruitments or POST /studies/{id}/recruitments/auto-invite creating the first Recruitment"
        actor: system
        preconditions:
          - "study.execution_status == FIELDING"
          - "count of Recruitment rows with study_id == study.id was 0 before this call"
        side_effects:
          - "invited_count recomputed"
      - from: RECRUITING
        to: QUOTA_MET
        trigger: "system: recompute after POST /recruitments/{id}/schedule or POST /recruitments/{id}/complete"
        actor: system
        preconditions:
          - "count of Recruitment rows with study_id == study.id and status IN {SCHEDULED, COMPLETED} >= study.target_participant_count"
        side_effects:
          - "further invitations are rejected with ERR_RECRUITMENT_CLOSED"
      - from: QUOTA_MET
        to: RECRUITING
        trigger: "system: recompute after POST /recruitments/{id}/no-show or POST /recruitments/{id}/withdraw"
        actor: system
        preconditions:
          - "count of Recruitment rows with study_id == study.id and status IN {SCHEDULED, COMPLETED} < study.target_participant_count"
        side_effects:
          - "invitations become available again"
      - from: RECRUITING
        to: RECRUITMENT_FAILED
        trigger: "POST /studies/{id}/close-fielding"
        actor: system
        preconditions:
          - "study.completed_count == 0 at the moment fielding closes"
        side_effects:
          - "the study's impact_score loses the recruitment-efficiency term (recruitment_efficiency == 0.0)"
      - from: NOT_STARTED
        to: RECRUITMENT_FAILED
        trigger: "POST /studies/{id}/close-fielding"
        actor: system
        preconditions:
          - "study.invited_count == 0 at the moment fielding closes"
        side_effects:
          - "the study's impact_score loses the recruitment-efficiency term (recruitment_efficiency == 0.0)"

  - entity: Recruitment
    dimension: status
    initial_state: INVITED
    terminal_states: [SCREENED_OUT, COMPLETED, NO_SHOW, WITHDRAWN]
    note: First of two independent state dimensions on Recruitment; SCHEDULED -> SCHEDULED is the reschedule loop.
    transitions:
      - from: INVITED
        to: SCREENED_IN
        trigger: "POST /recruitments/{id}/screen"
        actor: Researcher
        preconditions:
          - "recruitment.status == INVITED"
          - "study.execution_status == FIELDING"
          - "screen_score(recruitment) >= SCREEN_IN_MIN (60.00)"
        side_effects:
          - "screen_score stored"
          - "study.screened_in_count recomputed"
      - from: INVITED
        to: SCREENED_OUT
        trigger: "POST /recruitments/{id}/screen"
        actor: Researcher
        preconditions:
          - "recruitment.status == INVITED"
          - "study.execution_status == FIELDING"
          - "screen_score(recruitment) < SCREEN_IN_MIN (60.00), which includes the hard-gate score of 0.00 produced by a disqualifying answer"
        side_effects:
          - "screen_score stored"
          - "incentive_state stays RESERVED so the settlement can pay the SCREENOUT_STIPEND_CENTS (200)"
      - from: SCREENED_IN
        to: SCHEDULED
        trigger: "POST /recruitments/{id}/schedule"
        actor: Researcher
        preconditions:
          - "recruitment.status == SCREENED_IN"
          - "study.execution_status == FIELDING"
          - "a ConsentRecord with participant_id == recruitment.participant_id AND study_id == recruitment.study_id AND status == GRANTED exists, else ERR_CONSENT_MISSING"
          - "[scheduled_start, scheduled_end) lies inside [study.fielding_start, study.fielding_end + 1 day) , else ERR_SESSION_WINDOW_OUTSIDE_FIELDING"
          - "no other Recruitment of the same participant_id with status == SCHEDULED has a session interval that intersects [scheduled_start - 30 min, scheduled_end + 30 min) , else ERR_PARTICIPANT_SESSION_CONFLICT"
        side_effects:
          - "scheduled_start, scheduled_end and moderator_user_id stored"
          - "guide_version_pinned copied from study.guide_version_pinned"
          - "study.recruitment_status recomputed (may reach QUOTA_MET)"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /recruitments/{id}/schedule (reschedule loop)"
        actor: Researcher
        preconditions:
          - "recruitment.status == SCHEDULED"
          - "recruitment.reschedule_count < RESCHEDULE_LIMIT (2), else ERR_INVALID_STATE"
          - "the same window, consent and participant-overlap checks as SCREENED_IN -> SCHEDULED, evaluated with this recruitment's own current interval excluded from the candidate set"
        side_effects:
          - "scheduled_start, scheduled_end and moderator_user_id overwritten"
          - "reschedule_count incremented by 1"
          - "guide_version_pinned left at its original value - a rescheduled session keeps the guide version pinned at first scheduling"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /recruitments/{id}/complete"
        actor: Researcher
        preconditions:
          - "recruitment.status == SCHEDULED"
          - "study.execution_status == FIELDING"
        side_effects:
          - "actual_duration_min stored"
          - "study.completed_count recomputed; study.recruitment_status recomputed"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /recruitments/{id}/no-show"
        actor: Researcher
        preconditions:
          - "recruitment.status == SCHEDULED"
          - "study.execution_status == FIELDING"
        side_effects:
          - "closure_reason stored"
          - "no-show cascade hop 1: incentive_state RESERVED -> FORFEITED and participant.no_show_strikes incremented by 1"
          - "no-show cascade hop 2: the FORFEITED transition releases reserved_cents from pool.incentive_reserved_cents, which triggers a pool_posture recompute on ParticipantPool"
          - "no-show cascade hop 3: the incremented no_show_strikes triggers participant_eligibility, which moves the participant to SUPPRESSED once no_show_strikes >= 2; that in turn increments pool.suppressed_participant_count and re-runs pool_posture"
          - "study.recruitment_status recomputed (QUOTA_MET may revert to RECRUITING)"
      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /recruitments/{id}/withdraw"
        actor: Researcher | ResearchLead | ResearchOpsAdmin
        preconditions:
          - "recruitment.status == INVITED"
        side_effects:
          - "closure_reason stored"
          - "incentive_state RESERVED -> RELEASED, returning exactly reserved_cents to pool.incentive_available_cents"
          - "pool_posture recomputed"
      - from: SCREENED_IN
        to: WITHDRAWN
        trigger: "POST /recruitments/{id}/withdraw"
        actor: Researcher | ResearchLead | ResearchOpsAdmin
        preconditions:
          - "recruitment.status == SCREENED_IN"
        side_effects:
          - "closure_reason stored"
          - "incentive_state RESERVED -> RELEASED, returning exactly reserved_cents to pool.incentive_available_cents"
          - "pool_posture recomputed; study.recruitment_status recomputed"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /recruitments/{id}/withdraw"
        actor: Researcher | ResearchLead | ResearchOpsAdmin
        preconditions:
          - "recruitment.status == SCHEDULED"
        side_effects:
          - "closure_reason stored"
          - "incentive_state RESERVED -> RELEASED, returning exactly reserved_cents to pool.incentive_available_cents"
          - "pool_posture recomputed; study.recruitment_status recomputed (QUOTA_MET may revert to RECRUITING)"

  - entity: Recruitment
    dimension: incentive_state
    initial_state: RESERVED
    terminal_states: [PAID, FORFEITED, RELEASED]
    note: Second independent state dimension on Recruitment; money moves on its own axis, driven by settlement and by closure actions.
    transitions:
      - from: RESERVED
        to: PAID
        trigger: "POST /participant-pools/{id}/incentive-settlements with mode == CHRONOLOGICAL_ACTUAL"
        actor: ResearchOpsAdmin
        preconditions:
          - "recruitment.incentive_state == RESERVED"
          - "recruitment.status IN {COMPLETED, SCREENED_OUT}"
        side_effects:
          - "paid_cents set to reserved_cents for COMPLETED, or to SCREENOUT_STIPEND_CENTS (200) for SCREENED_OUT"
          - "pool.incentive_reserved_cents decreased by reserved_cents and pool.incentive_paid_cents increased by paid_cents"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /recruitments/{id}/withdraw, or POST /participant-pools/{id}/incentive-settlements with mode == CHRONOLOGICAL_ACTUAL on an unfielded recruitment"
        actor: Researcher | ResearchLead | ResearchOpsAdmin
        preconditions:
          - "recruitment.incentive_state == RESERVED"
          - "recruitment.status IN {INVITED, SCREENED_IN, SCHEDULED, WITHDRAWN}"
        side_effects:
          - "paid_cents left at 0"
          - "pool.incentive_reserved_cents decreased by exactly reserved_cents; pool.incentive_available_cents increased by the same amount"
      - from: RESERVED
        to: FORFEITED
        trigger: "POST /recruitments/{id}/no-show"
        actor: system
        preconditions:
          - "recruitment.incentive_state == RESERVED"
          - "recruitment.status transitions to NO_SHOW in the same request"
        side_effects:
          - "paid_cents left at 0"
          - "pool.incentive_reserved_cents decreased by exactly reserved_cents"

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    note: Origin of the five-hop evidence-withdrawal cascade.
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consent-records/{id}/revoke"
        actor: PrivacyOfficer
        preconditions:
          - "consent.status == GRANTED"
        side_effects:
          - "revoked_at set to the logical clock instant; revocation_reason set to the supplied reason"
          - "cascade hop 1: every ResearchArtifact whose recruitment_id belongs to a Recruitment with participant_id == consent.participant_id AND study_id == consent.study_id, whose artifact_type maps into consent.scopes, and whose lifecycle_state == RETAINED, moves to PURGED with purge_reason CONSENT_REVOKED and purged_at set to the clock instant"
          - "cascade hop 2: each artifact that just became PURGED flips every EvidenceLink with artifact_id == that artifact and is_admissible == true to is_admissible false with inadmissible_reason ARTIFACT_PURGED"
          - "cascade hop 3: each Finding that just lost an admissible link is recomputed by evidence_strength under its own variant; a Finding with status == PUBLISHED whose recomputed evidence_strength < MIN_PUBLISH_STRENGTH (0.45) OR whose distinct_participant_count < MIN_DISTINCT_PARTICIPANTS (3) moves PUBLISHED -> RETRACTED with retraction_reason EVIDENCE_WITHDRAWN"
          - "cascade hop 4: each Theme referenced by a Finding that just retracted is recomputed by theme_evidence_weight (own weight first, then the rollup up the parent_theme_id chain), which may move ESTABLISHED -> EMERGING"
          - "cascade hop 5: each RoadmapDecision reachable through an ACCEPTED Readout of a study whose Finding just retracted is recomputed by decision_evidence_confidence; a decision with status == LOCKED whose recomputed evidence_confidence < LOCK_MIN_CONFIDENCE (0.60) moves LOCKED -> OPEN"
      - from: GRANTED
        to: EXPIRED
        trigger: "POST /_ops/retention-sweep"
        actor: system
        preconditions:
          - "consent.status == GRANTED"
          - "consent.retention_until <= logical clock now"
        side_effects:
          - "cascade hops 1 to 5 identical to GRANTED -> REVOKED, except purge_reason is RETENTION_EXPIRED and revoked_at stays null"

  - entity: ResearchArtifact
    initial_state: RETAINED
    terminal_states: [PURGED]
    transitions:
      - from: RETAINED
        to: PURGED
        trigger: "system: evidence-withdrawal cascade hop 1 (ConsentRecord GRANTED -> REVOKED or GRANTED -> EXPIRED)"
        actor: system
        preconditions:
          - "artifact.lifecycle_state == RETAINED"
          - "the authorising ConsentRecord left GRANTED in this request"
        side_effects:
          - "purged_at and purge_reason set"
          - "every EvidenceLink citing this artifact becomes inadmissible (cascade hop 2)"
          - "new evidence links citing this artifact are rejected with ERR_ARTIFACT_PURGED"

  - entity: Theme
    initial_state: EMERGING
    terminal_states: []
    note: Derived repository posture; recomputed bottom-up along parent_theme_id.
    transitions:
      - from: EMERGING
        to: ESTABLISHED
        trigger: "system: theme_evidence_weight recompute after a Finding reaches PUBLISHED"
        actor: system
        preconditions:
          - "theme.evidence_weight >= THEME_ESTABLISH_MIN (1.20)"
        side_effects:
          - "the parent theme, if any, is recomputed next, up to the root"
      - from: ESTABLISHED
        to: EMERGING
        trigger: "system: theme_evidence_weight recompute after a Finding leaves PUBLISHED (evidence-withdrawal cascade hop 4)"
        actor: system
        preconditions:
          - "theme.evidence_weight < THEME_ESTABLISH_MIN (1.20)"
        side_effects:
          - "the parent theme, if any, is recomputed next, up to the root"

  - entity: Finding
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    note: Cyclic - EVIDENCE_LOCKED returns to DRAFT whenever new evidence arrives.
    transitions:
      - from: DRAFT
        to: EVIDENCE_LOCKED
        trigger: "POST /findings/{id}/lock"
        actor: Researcher | ResearchLead
        preconditions:
          - "finding.status == DRAFT"
          - "study.execution_status IN {ANALYSIS, REPORTED, CLOSED}, else ERR_INVALID_STATE"
          - "finding.admissible_link_count >= 1, else ERR_NO_ADMISSIBLE_EVIDENCE"
          - "finding.distinct_participant_count >= MIN_DISTINCT_PARTICIPANTS (3), else ERR_INSUFFICIENT_CORROBORATION"
        side_effects:
          - "strength_variant set to CORROBORATED and evidence_strength recomputed under that variant"
          - "theme_evidence_weight is NOT re-run - only PUBLISHED findings contribute weight"
      - from: EVIDENCE_LOCKED
        to: DRAFT
        trigger: "POST /findings/{id}/evidence-links (adding evidence to a locked finding unlocks it)"
        actor: Researcher | ResearchLead
        preconditions:
          - "finding.status == EVIDENCE_LOCKED"
        side_effects:
          - "strength_variant set back to PROVISIONAL and evidence_strength recomputed under that variant"
      - from: EVIDENCE_LOCKED
        to: PUBLISHED
        trigger: "POST /findings/{id}/publish"
        actor: ResearchLead
        preconditions:
          - "finding.status == EVIDENCE_LOCKED"
          - "X-User-ID != finding.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "finding.evidence_strength >= MIN_PUBLISH_STRENGTH (0.45), else ERR_EVIDENCE_TOO_WEAK"
        side_effects:
          - "published_at set to the logical clock instant"
          - "theme_evidence_weight recomputed for finding.theme_id and every ancestor theme"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "system: evidence-withdrawal cascade hop 3"
        actor: system
        preconditions:
          - "finding.status == PUBLISHED"
          - "recomputed evidence_strength < MIN_PUBLISH_STRENGTH (0.45) OR distinct_participant_count < MIN_DISTINCT_PARTICIPANTS (3)"
        side_effects:
          - "retraction_reason set to EVIDENCE_WITHDRAWN"
          - "theme_evidence_weight recomputed for finding.theme_id and every ancestor theme (cascade hop 4)"
          - "decision_evidence_confidence recomputed for every RoadmapDecision reached through an ACCEPTED Readout of this study (cascade hop 5)"

  - entity: Readout
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ACCEPTED, DEFERRED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /studies/{id}/readouts creating a newer DRAFT readout for the same study"
        actor: system
        preconditions:
          - "readout.status == DRAFT"
          - "the incoming create passed the OCC check on Study.version"
        side_effects:
          - "the superseded readout can no longer be delivered"
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /readouts/{id}/deliver"
        actor: ResearchLead
        preconditions:
          - "readout.status == DRAFT"
          - "study.execution_status == ANALYSIS, else ERR_INVALID_STATE"
          - "every id in readout.cited_finding_ids references a Finding with status == PUBLISHED, and the list is non-empty, else ERR_NO_PUBLISHED_FINDINGS"
        side_effects:
          - "delivered_at set to the logical clock instant"
          - "study.execution_status ANALYSIS -> REPORTED"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /readouts/{id}/respond with outcome == ACCEPTED"
        actor: Stakeholder
        preconditions:
          - "readout.status == DELIVERED"
          - "X-User-ID == the requester_user_id of the ResearchRequest reached through study.research_request_id, else ERR_OWNERSHIP_REQUIRED"
          - "the RoadmapDecision referenced by readout.roadmap_decision_id has status == OPEN, else ERR_DECISION_LOCKED"
        side_effects:
          - "responded_at and response_note stored"
          - "decision_confidence_before captured, then decision_evidence_confidence recomputed for readout.roadmap_decision_id and stored into decision_confidence_after"
          - "reuse_count incremented for every Theme referenced by a cited Finding and for each of its ancestors"
          - "study.execution_status REPORTED -> CLOSED and the study's ResearchRequest IN_STUDY -> CLOSED"
      - from: DELIVERED
        to: DEFERRED
        trigger: "POST /readouts/{id}/respond with outcome == DEFERRED"
        actor: Stakeholder
        preconditions:
          - "readout.status == DELIVERED"
          - "X-User-ID == the requester_user_id of the ResearchRequest reached through study.research_request_id, else ERR_OWNERSHIP_REQUIRED"
        side_effects:
          - "responded_at and response_note stored"
          - "decision_evidence_confidence is NOT recomputed - only ACCEPTED readouts contribute confidence"
          - "study.execution_status stays REPORTED, so a fresh DRAFT readout may be created against the study"

  - entity: FollowUp
    initial_state: OPEN
    terminal_states: [DONE]
    transitions:
      - from: OPEN
        to: DONE
        trigger: "POST /follow-ups/{id}/complete"
        actor: Stakeholder
        preconditions:
          - "follow_up.status == OPEN"
          - "X-User-ID == follow_up.owner_user_id, else ERR_OWNERSHIP_REQUIRED"
        side_effects:
          - "completed_at set to the logical clock instant"
          - "the parent study's impact_score gains the follow-up completion term once every follow-up of the readout is DONE"
      - from: OPEN
        to: OVERDUE
        trigger: "POST /_ops/retention-sweep"
        actor: system
        preconditions:
          - "follow_up.status == OPEN"
          - "follow_up.due_date < logical clock now"
        side_effects:
          - "the follow-up stays actionable; only the label changes"
      - from: OVERDUE
        to: DONE
        trigger: "POST /follow-ups/{id}/complete"
        actor: Stakeholder
        preconditions:
          - "follow_up.status == OVERDUE"
          - "X-User-ID == follow_up.owner_user_id, else ERR_OWNERSHIP_REQUIRED"
        side_effects:
          - "completed_at set to the logical clock instant"

concurrency_rules:
  - rule_id: readout-create-stale-study
    parent_entity: Study
    write_endpoint: "POST /studies/{id}/readouts"
    occ_field: "expected_study_version"
    description: |
      Creating a Readout against a Study whose version has advanced since the client
      last observed it is rejected. A new DRAFT readout legitimately supersedes any
      prior DRAFT readout of the same study, so the write cannot be blocked by a state
      precondition; the stale-version check is what stops a writer whose view of the
      study (its findings, its counts, its prior draft) is out of date.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

  - rule_id: settlement-run-stale-pool
    parent_entity: ParticipantPool
    write_endpoint: "POST /participant-pools/{id}/incentive-settlements"
    occ_field: "expected_pool_version"
    description: |
      Running an incentive settlement against a ParticipantPool whose version has
      advanced since the client last observed it is rejected. Settlements for different
      studies draw on the same pool budget and each one legitimately succeeds on its
      own, so no state precondition covers the case; the stale-version check stops a
      settlement computed against an out-of-date view of the pool ledger.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

calculations:
  - name: request_priority_score
    trigger: "POST /research-requests/{id}/triage - every outcome, including NEEDS_REFRAMING and REJECTED (see ResearchRequest SUBMITTED -> * side_effects)"
    algorithm: weighted_scoring
    formula: |
      # (a) three independent inputs with a tiered reach term and a tiered urgency multiplier
      decision_points = DECISION_WEIGHT[decision.reversibility]
      gap_points      = GAP_POINTS[request.evidence_gap]
      reach_points    = min(30.0, ceil(decision.impacted_user_count / 10000) * 5.0)
      base            = decision_points + gap_points + reach_points
      days_to_deadline = floor((decision.decision_deadline - clock_now) / 86400 seconds)
      if days_to_deadline <= 14: urgency_multiplier = 1.30
      elif days_to_deadline <= 45: urgency_multiplier = 1.15
      else: urgency_multiplier = 1.00
      priority_score = round(min(100.0, base * urgency_multiplier), 2)
      # Evaluation order is pinned: reach tier first, then base sum, then the multiplier,
      # then the 100.00 cap, then the 2-decimal rounding. Rounding happens exactly once.
    input_set: "The single RoadmapDecision referenced by request.roadmap_decision_id (any status) plus the request's own evidence_gap. Nothing else enters the score."
    constants:
      DECISION_WEIGHT: { IRREVERSIBLE: 40.0, REVERSIBLE: 22.0 }
      GAP_POINTS: { NONE: 0.0, PARTIAL: 12.0, FULL: 25.0 }
      REACH_BUCKET_USERS: 10000
      REACH_POINTS_PER_BUCKET: 5.0
      REACH_POINTS_CAP: 30.0
      URGENCY_TIER_1_DAYS: 14
      URGENCY_TIER_2_DAYS: 45
      SCORE_CAP: 100.0
    precision: "2 decimal places, round_half_up; days_to_deadline is a floored whole-day count"

  - name: method_recommendation
    trigger: "POST /research-requests/{id}/triage - same call as request_priority_score"
    algorithm: constraint_propagation
    formula: |
      recommended = METHOD_TABLE[request.question_type]
      # single override: a measurement question over too small an audience is under-powered
      if request.question_type == MEASUREMENT and decision.impacted_user_count < SURVEY_MIN_AUDIENCE:
          recommended = INTERVIEW
      recommended_method = recommended
      approved_method = method_override if the triage call supplied one else recommended
    input_set: "request.question_type plus decision.impacted_user_count of the referenced RoadmapDecision."
    constants:
      METHOD_TABLE: { DISCOVERY: INTERVIEW, EVALUATIVE: USABILITY_TEST, BEHAVIORAL_LONGITUDINAL: DIARY_STUDY, MEASUREMENT: SURVEY }
      SURVEY_MIN_AUDIENCE: 5000
    precision: "enumeration, no rounding"

  - name: screen_score
    trigger: "POST /recruitments/{id}/screen (see Recruitment INVITED -> SCREENED_IN and INVITED -> SCREENED_OUT side_effects)"
    algorithm: weighted_scoring
    formula: |
      answers = recruitment.screening_answers
      crit    = study.screening_criteria
      # hard gate evaluated first and short-circuits the rest
      if any(a in crit.disqualifying_answers for a in answers.answers):
          screen_score = 0.00
      else:
          segment_points = 40.0 if answers.segment == crit.required_segment else 0.0
          locale_points  = 20.0 if answers.locale  == crit.required_locale  else 0.0
          target_hits    = count of elements of answers.answers that appear in crit.target_answers
          target_points  = min(40.0, target_hits * 15.0)
          screen_score   = round(segment_points + locale_points + target_points, 2)
      status = SCREENED_IN if screen_score >= SCREEN_IN_MIN else SCREENED_OUT
    input_set: "Only the recruitment's own screening_answers and the study's screening_criteria; the Participant row's segment/locale fields are NOT consulted here."
    constants:
      SEGMENT_POINTS: 40.0
      LOCALE_POINTS: 20.0
      TARGET_POINTS_PER_HIT: 15.0
      TARGET_POINTS_CAP: 40.0
      SCREEN_IN_MIN: 60.0
    precision: "2 decimal places, round_half_up"

  - name: incentive_reservation
    trigger: "POST /studies/{id}/recruitments and POST /studies/{id}/recruitments/auto-invite, once per Recruitment created"
    algorithm: threshold
    formula: |
      # (c) circular-looking dependency, resolved by a pinned evaluation order:
      # the surcharge depends on pool utilization, and this very reservation changes
      # utilization. PINNED: utilization is read from the pool state BEFORE this
      # reservation is applied, and each reservation inside an auto-invite batch is
      # applied one at a time in candidate rank order, so candidate N+1 sees the
      # utilization that already includes candidate N.
      pre_utilization = (pool.incentive_reserved_cents + pool.incentive_paid_cents) / pool.incentive_budget_cents
      if pre_utilization < 0.50:   surcharge_pct = 0.00
      elif pre_utilization < 0.80: surcharge_pct = 0.05
      else:                        surcharge_pct = 0.10
      reserved_cents = study.incentive_amount_cents + ceil(study.incentive_amount_cents * surcharge_pct)
      # fiscal gate, evaluated against the same pre-state
      if reserved_cents > pool.incentive_available_cents: reject with ERR_INCENTIVE_BUDGET_EXCEEDED
      pool.incentive_reserved_cents += reserved_cents
      pool.incentive_available_cents = pool.incentive_budget_cents - pool.incentive_reserved_cents - pool.incentive_paid_cents
    input_set: "The pool's own three ledger fields in their pre-call state and the study's incentive_amount_cents. Recruitments of other studies against the same pool are already folded into incentive_reserved_cents."
    constants:
      SURCHARGE_TIER_1_UTIL: 0.50
      SURCHARGE_TIER_2_UTIL: 0.80
      SURCHARGE_TIER_1_PCT: 0.05
      SURCHARGE_TIER_2_PCT: 0.10
    precision: "integer cents; the surcharge term is rounded up with ceil before being added"

  - name: incentive_settlement
    trigger: "POST /participant-pools/{id}/incentive-settlements"
    algorithm: waterfall_allocation
    formula: |
      # Same pool, same recruitments, two modes that return different numbers.
      # Mode FORWARD_ESTIMATE (advisory, moves no money):
      #   include Recruitment rows with participant of this pool, study_id == payload.study_id,
      #   incentive_state == RESERVED and status IN {INVITED, SCREENED_IN, SCHEDULED, COMPLETED}
      #   estimate_cents = sum(r.reserved_cents over the included set)
      #   pool.last_estimate_cents = estimate_cents ; no Recruitment row is mutated
      # Mode CHRONOLOGICAL_ACTUAL (binding):
      #   include Recruitment rows with participant of this pool, study_id == payload.study_id
      #   and incentive_state == RESERVED (any status)
      #   process them ordered by created_at ASC, tie-break participant.external_ref ASC
      #   for each recruitment r, in that order:
      #     release: pool.incentive_reserved_cents -= r.reserved_cents
      #     gross = r.reserved_cents            if r.status == COMPLETED
      #           = SCREENOUT_STIPEND_CENTS     if r.status == SCREENED_OUT
      #           = 0                           if r.status IN {INVITED, SCREENED_IN, SCHEDULED, WITHDRAWN}
      #     pay = min(gross, pool.incentive_available_cents after the release)
      #     if pay > 0: r.paid_cents = pay ; r.incentive_state = PAID ; pool.incentive_paid_cents += pay
      #     else:       r.paid_cents = 0   ; r.incentive_state = RELEASED
      #   pool.settled_study_ids append payload.study_id
      # Invariant that both modes must preserve:
      #   incentive_available_cents + incentive_reserved_cents + incentive_paid_cents == incentive_budget_cents
    input_set: "Recruitment rows of the named study whose participant belongs to this pool. FORWARD_ESTIMATE additionally requires incentive_state == RESERVED and status IN {INVITED, SCREENED_IN, SCHEDULED, COMPLETED}; CHRONOLOGICAL_ACTUAL requires only incentive_state == RESERVED, so SCREENED_OUT rows enter the binding run but never the estimate."
    constants:
      SCREENOUT_STIPEND_CENTS: 200
    precision: "integer cents; no rounding needed"
    variants:
      - name: FORWARD_ESTIMATE
        when: "Requested at any time, including while the study is still FIELDING; permitted from any study execution_status."
        difference: "Assumes every open recruitment completes at its full reserved amount, ignores SCREENED_OUT rows entirely, mutates nothing except pool.last_estimate_cents, and may be run repeatedly."
      - name: CHRONOLOGICAL_ACTUAL
        when: "Requires study.execution_status IN {ANALYSIS, REPORTED, CLOSED} (else ERR_SETTLEMENT_NOT_PERMITTED) and study_id not already in pool.settled_study_ids (else ERR_ALREADY_SETTLED)."
        difference: "Walks recruitments in created_at ASC order, pays only COMPLETED (full) and SCREENED_OUT (stipend) rows, releases the rest, and permanently moves cents from reserved to paid."

  - name: evidence_strength
    trigger: "POST /findings/{id}/evidence-links, DELETE /evidence-links/{id}, POST /findings/{id}/lock, and evidence-withdrawal cascade hop 3"
    algorithm: weighted_scoring
    formula: |
      # (b) nested rounding whose ORDER changes the cents-equivalent result.
      # PINNED ORDER: round each link's contribution to 2 decimals FIRST, then sum.
      # ("sum the unrounded products, then round" is explicitly NOT the rule.)
      for each EvidenceLink l with finding_id == finding.id and is_admissible == true:
          l.contribution = round(CLASS_WEIGHT[l.weight_class] * METHOD_MULT[study.method], 2)
      raw = sum(l.contribution over admissible links)          # sum of already-rounded terms
      admissible_link_count = count(admissible links)
      distinct_participant_count = count of distinct Recruitment.participant_id values reached
          by admissible link -> ResearchArtifact.recruitment_id -> Recruitment.participant_id
      if finding.status == DRAFT:                       # variant PROVISIONAL
          evidence_strength = round(min(1.00, raw / PROVISIONAL_DIVISOR), 2)
      else:                                             # variant CORROBORATED
          density = round(min(1.00, raw / CORROBORATED_DIVISOR), 4)
          corroboration_factor = round(min(1.00, distinct_participant_count / CORROBORATION_TARGET), 2)
          evidence_strength = round(density * corroboration_factor, 2)
    input_set: "Only EvidenceLink rows of this finding with is_admissible == true. Links whose artifact is PURGED are excluded, and so are the participants reachable only through them."
    constants:
      CLASS_WEIGHT: { DIRECT_QUOTE: 1.00, OBSERVED_BEHAVIOR: 0.85, SELF_REPORT: 0.50 }
      METHOD_MULT: { USABILITY_TEST: 1.20, DIARY_STUDY: 1.10, INTERVIEW: 1.00, SURVEY: 0.70 }
      PROVISIONAL_DIVISOR: 4.00
      CORROBORATED_DIVISOR: 3.00
      CORROBORATION_TARGET: 5
      MIN_DISTINCT_PARTICIPANTS: 3
      MIN_PUBLISH_STRENGTH: 0.45
    precision: "per-link contribution 2 decimals round_half_up; density 4 decimals; final strength 2 decimals round_half_up"
    variants:
      - name: PROVISIONAL
        when: "finding.status == DRAFT - the working estimate a researcher sees while curating evidence."
        difference: "Divides by 4.00 and applies no corroboration factor, so a thin single-participant body of evidence still scores."
      - name: CORROBORATED
        when: "finding.status IN {EVIDENCE_LOCKED, PUBLISHED, RETRACTED} - the auditable value."
        difference: "Divides by the tighter 3.00 and multiplies by a participant-breadth factor capped at 5 distinct participants, so the same links yield a different number than PROVISIONAL."

  - name: theme_evidence_weight
    trigger: "Finding EVIDENCE_LOCKED -> PUBLISHED, Finding PUBLISHED -> RETRACTED (cascade hop 4)"
    algorithm: topological
    formula: |
      own_evidence_weight(t) = sum over Finding f with f.theme_id == t.id and f.status == PUBLISHED
                               of round(f.evidence_strength * SEVERITY_MULT[f.severity], 2)
      evidence_weight(t) = round(own_evidence_weight(t)
                                 + sum over child themes c with c.parent_theme_id == t.id
                                   of evidence_weight(c), 2)
      # Evaluation order is pinned: children are evaluated before parents (post-order walk
      # of the parent_theme_id tree), then the affected theme's ancestors are refreshed
      # from the theme upward to the root, one level at a time.
      status(t) = ESTABLISHED if evidence_weight(t) >= THEME_ESTABLISH_MIN else EMERGING
      reuse_count(t) = count of Readout rows with status == ACCEPTED whose cited_finding_ids
                       contain at least one Finding whose theme_id is t.id or any descendant of t
    input_set: "Findings with status == PUBLISHED only. DRAFT, EVIDENCE_LOCKED and RETRACTED findings contribute 0.00."
    constants:
      SEVERITY_MULT: { HIGH: 1.50, MEDIUM: 1.00, LOW: 0.60 }
      THEME_ESTABLISH_MIN: 1.20
      THEME_MAX_DEPTH: 3
    precision: "2 decimal places, round_half_up at both the per-finding term and the rollup sum"

  - name: decision_evidence_confidence
    trigger: "POST /roadmap-decisions/{id}/lock, Readout DELIVERED -> ACCEPTED, and evidence-withdrawal cascade hop 5"
    algorithm: aggregation
    formula: |
      for each Readout r with r.roadmap_decision_id == decision.id and r.status == ACCEPTED,
      taken in r.created_at ASC order:
          published = Findings f with f.study_id == r.study_id and f.status == PUBLISHED
          if published is empty: contribution(r) = 0.00
          else:
              mean_strength   = round(sum(f.evidence_strength over published) / count(published), 4)
              contribution(r) = round(mean_strength * METHOD_MULT[study(r).method], 2)
      evidence_confidence = round(min(1.00, sum(contribution over ACCEPTED readouts) / CONFIDENCE_DIVISOR), 2)
    input_set: "Only Readout rows with status == ACCEPTED for this decision, and inside each, only Findings of that readout's study with status == PUBLISHED. DELIVERED, DEFERRED, DRAFT and SUPERSEDED readouts contribute nothing."
    constants:
      CONFIDENCE_DIVISOR: 1.00
      LOCK_MIN_CONFIDENCE: 0.60
      METHOD_MULT: { USABILITY_TEST: 1.20, DIARY_STUDY: 1.10, INTERVIEW: 1.00, SURVEY: 0.70 }
    precision: "mean 4 decimals, contribution and final confidence 2 decimals, round_half_up"

  - name: retention_horizon
    trigger: "POST /consent-records (sets ConsentRecord.retention_until) and POST /recruitments/{id}/artifacts (copies it onto the artifact)"
    algorithm: threshold
    formula: |
      scope_cap_days = min(MAX_RETENTION_DAYS[s] for s in consent.scopes)
      effective_days = min(consent.retention_days, scope_cap_days)
      consent.retention_until = consent.granted_at + effective_days days
      # An artifact inherits the horizon of the consent record that authorised its type:
      artifact.retention_until = retention_until of the GRANTED ConsentRecord with
          participant_id == recruitment.participant_id, study_id == recruitment.study_id
          and ARTIFACT_SCOPE[artifact.artifact_type] in scopes
    input_set: "The single GRANTED ConsentRecord for the (participant, study) pair whose scopes contain the artifact's required scope. If none exists the artifact creation is rejected with ERR_CONSENT_SCOPE_MISSING."
    constants:
      MAX_RETENTION_DAYS: { RECORDING: 180, TRANSCRIPT: 365, PII_QUOTE: 90 }
      ARTIFACT_SCOPE: { RECORDING: RECORDING, TRANSCRIPT: TRANSCRIPT, PII_NOTE: PII_QUOTE }
    precision: "whole days added to an ISO 8601 UTC instant with millisecond precision preserved"

  - name: pool_posture
    trigger: "Every mutation of ParticipantPool.incentive_reserved_cents / incentive_paid_cents / suppressed_participant_count (invite, auto-invite, withdraw, no-show, settlement, participant suppression)"
    algorithm: threshold
    formula: |
      utilization = (incentive_reserved_cents + incentive_paid_cents) / incentive_budget_cents
      suppressed_ratio = suppressed_participant_count / participant_count  (0.0 when participant_count == 0)
      if utilization >= POSTURE_CLOSED_UTIL:                              status = CLOSED
      elif utilization >= POSTURE_RESTRICTED_UTIL or suppressed_ratio > POSTURE_SUPPRESSED_RATIO: status = RESTRICTED
      else:                                                              status = OPEN
      incentive_available_cents = incentive_budget_cents - incentive_reserved_cents - incentive_paid_cents
    input_set: "The pool's own ledger fields plus its Participant rows, counted across all studies that share the pool."
    constants:
      POSTURE_CLOSED_UTIL: 0.95
      POSTURE_RESTRICTED_UTIL: 0.80
      POSTURE_SUPPRESSED_RATIO: 0.50
    precision: "utilization compared as an exact rational of integer cents; no intermediate rounding"

  - name: participant_eligibility
    trigger: "POST /studies/{id}/recruitments, POST /studies/{id}/recruitments/auto-invite, POST /recruitments/{id}/no-show, POST /_ops/retention-sweep"
    algorithm: threshold
    formula: |
      contacts_in_window = count of Recruitment rows with participant_id == participant.id
          and created_at > clock_now - pool.contact_window_days days
          # lower bound EXCLUSIVE: a recruitment created exactly window_days ago has left the window
      if participant.no_show_strikes >= NO_SHOW_SUPPRESSION_STRIKES: status = SUPPRESSED
      elif contacts_in_window >= pool.contact_cap_per_window:        status = COOLDOWN
      else:                                                          status = ELIGIBLE
    input_set: "All Recruitment rows of the participant regardless of status - a withdrawn invitation still consumes contact budget for the length of the window."
    constants:
      NO_SHOW_SUPPRESSION_STRIKES: 2
    precision: "integer counts; the window boundary is half-open (lower bound exclusive, upper bound is clock_now inclusive)"

  - name: auto_invite_selection
    trigger: "POST /studies/{id}/recruitments/auto-invite"
    algorithm: chronological
    formula: |
      # (1) eligibility filter - candidate set is fully explicit
      candidates = Participant rows where
          pool_id == study.participant_pool_id
          AND status == ELIGIBLE
          AND segment == study.screening_criteria.required_segment
          AND no_show_strikes < NO_SHOW_SUPPRESSION_STRIKES
          AND contacts_in_window < pool.contact_cap_per_window
          AND no Recruitment row exists with study_id == study.id and this participant_id
      # (2) ranking expression (all keys are entity fields, none random)
      order by contacts_in_window ASC, then no_show_strikes ASC, then created_at ASC
      # (3) tie-break: created_at ASC is the final key and is unique per participant row
      # (4) empty-set fallback: if candidates is empty -> ERR_NO_ELIGIBLE_PARTICIPANTS (422)
      # Batch semantics: walk the ranked list, creating one Recruitment at a time via
      # incentive_reservation, until payload.count rows are created or the list is exhausted
      # (partial batch is a success). Stop early when the next reservation would exceed
      # pool.incentive_available_cents; if zero rows were created for that reason the whole
      # call fails with ERR_INCENTIVE_BUDGET_EXCEEDED.
    input_set: "Participant rows of the study's pool only. Participants in COOLDOWN or SUPPRESSED, and participants already recruited into this study, are excluded."
    constants:
      NO_SHOW_SUPPRESSION_STRIKES: 2
    precision: "integer ordering keys; created_at compared at millisecond precision"

  - name: study_metrics
    trigger: "GET /studies/{id}/metrics"
    algorithm: aggregation
    formula: |
      first_delivered = the Readout of this study with status IN {DELIVERED, ACCEPTED, DEFERRED}
                        having the smallest delivered_at (tie-break created_at ASC)
      cycle_time_days = floor((first_delivered.delivered_at - study.created_at) / 86400 seconds)
                        or null when no readout of this study has ever been delivered
      fielding_days   = floor((study.fielding_closed_at - study.fielded_at) / 86400 seconds)
                        or null while execution_status IN {PLANNED, GUIDE_APPROVED, FIELDING}
      recruitment_efficiency = round(study.completed_count / study.invited_count, 4)
                               (0.0000 when invited_count == 0)
      published_findings = count of Finding rows with study_id == study.id and status == PUBLISHED
      accepted_term  = 40.0 if any Readout of this study has status == ACCEPTED else 0.0
      findings_term  = round(30.0 * min(1.0, published_findings / IMPACT_FINDINGS_TARGET), 2)
      recruit_term   = round(20.0 * recruitment_efficiency, 2)
      followup_term  = 10.0 if the study has at least one FollowUp and every FollowUp of every
                       Readout of this study has status == DONE else 0.0
      impact_score   = round(accepted_term + findings_term + recruit_term + followup_term, 2)
    input_set: "Readouts, Findings, Recruitments and FollowUps of this study only; RETRACTED findings and SUPERSEDED readouts are excluded from their respective terms."
    constants:
      IMPACT_FINDINGS_TARGET: 3
      IMPACT_ACCEPTED_POINTS: 40.0
      IMPACT_FINDINGS_POINTS: 30.0
      IMPACT_RECRUIT_POINTS: 20.0
      IMPACT_FOLLOWUP_POINTS: 10.0
    precision: "each term rounded to 2 decimals before summing, then the sum rounded to 2 decimals, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: on POST /research-requests/{id}/resubmit X-User-ID == request.requester_user_id; on POST /readouts/{id}/respond X-User-ID == the requester_user_id of the readout's study's ResearchRequest; on POST /follow-ups/{id}/complete X-User-ID == follow_up.owner_user_id"
    error_id: ERR_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /research-requests/{id}/resubmit, POST /readouts/{id}/respond, POST /follow-ups/{id}/complete"
  - priority: 4
    category: auth
    check: "Segregation of duties: X-User-ID != finding.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /findings/{id}/publish"
  - priority: 5
    category: existence
    check: "RoadmapDecision in the path or in roadmap_decision_id exists"
    error_id: ERR_DECISION_NOT_FOUND
    http_status: 404
    applies_to: "POST /roadmap-decisions/{id}/lock, GET /roadmap-decisions/{id}, GET /roadmap-decisions/{id}/research-requests, POST /research-requests, POST /studies/{id}/readouts, GET /readouts"
  - priority: 6
    category: existence
    check: "ResearchRequest in the path or in research_request_id exists"
    error_id: ERR_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /research-requests/{id}/triage, POST /research-requests/{id}/resubmit, GET /research-requests/{id}, POST /studies, GET /studies"
  - priority: 7
    category: existence
    check: "ParticipantPool in the path or in participant_pool_id exists"
    error_id: ERR_POOL_NOT_FOUND
    http_status: 404
    applies_to: "POST /participant-pools/{id}/participants, POST /participant-pools/{id}/incentive-settlements, GET /participant-pools/{id}, GET /participant-pools/{id}/participants, POST /studies, GET /studies"
  - priority: 8
    category: existence
    check: "Participant in the path or in participant_id exists"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /participants/{id}, POST /studies/{id}/recruitments, POST /consent-records, GET /recruitments, GET /consent-records"
  - priority: 9
    category: existence
    check: "Study in the path or in study_id exists"
    error_id: ERR_STUDY_NOT_FOUND
    http_status: 404
    applies_to: "all /studies/{id}/* endpoints, GET /studies/{id}, GET /studies/{id}/metrics, POST /consent-records, POST /findings, POST /participant-pools/{id}/incentive-settlements, GET /recruitments, GET /findings, GET /readouts"
  - priority: 10
    category: existence
    check: "Recruitment in the path exists"
    error_id: ERR_RECRUITMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /recruitments/{id}/* endpoints, GET /recruitments/{id}, GET /recruitments/{id}/artifacts"
  - priority: 11
    category: existence
    check: "ConsentRecord in the path exists"
    error_id: ERR_CONSENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /consent-records/{id}/revoke, GET /consent-records/{id}"
  - priority: 12
    category: existence
    check: "ResearchArtifact in the path or in artifact_id exists"
    error_id: ERR_ARTIFACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /artifacts/{id}, GET /artifacts/{id}/evidence-links, POST /findings/{id}/evidence-links"
  - priority: 13
    category: existence
    check: "Theme in the path, in theme_id, or in parent_theme_id exists"
    error_id: ERR_THEME_NOT_FOUND
    http_status: 404
    applies_to: "GET /themes/{id}, GET /themes, POST /themes, POST /findings"
  - priority: 14
    category: existence
    check: "Finding in the path or in cited_finding_ids exists"
    error_id: ERR_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "all /findings/{id}/* endpoints, GET /findings/{id}, POST /studies/{id}/readouts"
  - priority: 15
    category: existence
    check: "EvidenceLink in the path exists"
    error_id: ERR_EVIDENCE_LINK_NOT_FOUND
    http_status: 404
    applies_to: "DELETE /evidence-links/{id}"
  - priority: 16
    category: existence
    check: "Readout in the path exists"
    error_id: ERR_READOUT_NOT_FOUND
    http_status: 404
    applies_to: "POST /readouts/{id}/deliver, POST /readouts/{id}/respond, POST /readouts/{id}/follow-ups, GET /readouts/{id}, GET /readouts/{id}/follow-ups"
  - priority: 17
    category: existence
    check: "FollowUp in the path exists"
    error_id: ERR_FOLLOW_UP_NOT_FOUND
    http_status: 404
    applies_to: "POST /follow-ups/{id}/complete"
  - priority: 18
    category: business_constraint
    check: "Required body fields are present, enums hold declared members, integers are non-negative where constrained, fielding_end > fielding_start, scheduled_end > scheduled_start, screening_criteria and screening_answers carry exactly their declared keys, scopes is a non-empty duplicate-free subset of {RECORDING, TRANSCRIPT, PII_QUOTE}, count >= 1 on auto-invite, and limit/offset stay inside 1..100 / >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 19
    category: state
    check: "The requested transition exists from the resource's current state in its state machine (covers every from-state not listed for the trigger, reschedule beyond RESCHEDULE_LIMIT, close-fielding while a Recruitment is SCHEDULED, creating a second Study for a request already IN_STUDY, and evidence-link writes on a PUBLISHED or RETRACTED finding)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 20
    category: state
    check: "study.guide_status == DRAFT when approving the guide, and == APPROVED for any endpoint that requires an approved guide"
    error_id: ERR_GUIDE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /studies/{id}/guide/approve, POST /studies/{id}/field"
  - priority: 21
    category: state
    check: "The governing RoadmapDecision has status == OPEN"
    error_id: ERR_DECISION_LOCKED
    http_status: 409
    applies_to: "POST /studies/{id}/field, POST /readouts/{id}/respond"
  - priority: 22
    category: state
    check: "request.revision_round < MAX_REVISION_ROUNDS (2) when resubmitting"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /research-requests/{id}/resubmit"
  - priority: 23
    category: state
    check: "study.recruitment_status != QUOTA_MET and study.execution_status == FIELDING when creating recruitments"
    error_id: ERR_RECRUITMENT_CLOSED
    http_status: 409
    applies_to: "POST /studies/{id}/recruitments, POST /studies/{id}/recruitments/auto-invite"
  - priority: 24
    category: state
    check: "pool.status != CLOSED when creating recruitments against that pool"
    error_id: ERR_POOL_CLOSED
    http_status: 409
    applies_to: "POST /studies/{id}/recruitments, POST /studies/{id}/recruitments/auto-invite"
  - priority: 25
    category: state
    check: "pool.status == OPEN when running the batch selector (RESTRICTED permits single-participant invitation only)"
    error_id: ERR_POOL_RESTRICTED
    http_status: 409
    applies_to: "POST /studies/{id}/recruitments/auto-invite"
  - priority: 26
    category: state
    check: "mode == CHRONOLOGICAL_ACTUAL requires study.execution_status IN {ANALYSIS, REPORTED, CLOSED}"
    error_id: ERR_SETTLEMENT_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /participant-pools/{id}/incentive-settlements"
  - priority: 27
    category: state
    check: "study_id is absent from pool.settled_study_ids when mode == CHRONOLOGICAL_ACTUAL"
    error_id: ERR_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /participant-pools/{id}/incentive-settlements"
  - priority: 28
    category: state
    check: "readout.cited_finding_ids is non-empty and every cited Finding has status == PUBLISHED at delivery time"
    error_id: ERR_NO_PUBLISHED_FINDINGS
    http_status: 409
    applies_to: "POST /readouts/{id}/deliver"
  - priority: 29
    category: state
    check: "expected_study_version == study.version"
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    applies_to: "POST /studies/{id}/readouts"
  - priority: 30
    category: state
    check: "expected_pool_version == pool.version"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /participant-pools/{id}/incentive-settlements"
  - priority: 31
    category: business_safety
    check: "A ConsentRecord with status == GRANTED exists for the (participant, study) pair"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /recruitments/{id}/schedule"
  - priority: 32
    category: business_safety
    check: "The GRANTED ConsentRecord for the (participant, study) pair includes ARTIFACT_SCOPE[artifact_type] in its scopes"
    error_id: ERR_CONSENT_SCOPE_MISSING
    http_status: 422
    applies_to: "POST /recruitments/{id}/artifacts"
  - priority: 33
    category: business_safety
    check: "The cited ResearchArtifact has lifecycle_state == RETAINED"
    error_id: ERR_ARTIFACT_PURGED
    http_status: 422
    applies_to: "POST /findings/{id}/evidence-links"
  - priority: 34
    category: business_temporal
    check: "[scheduled_start, scheduled_end) lies inside [study.fielding_start, study.fielding_end + 1 day)"
    error_id: ERR_SESSION_WINDOW_OUTSIDE_FIELDING
    http_status: 422
    applies_to: "POST /recruitments/{id}/schedule"
  - priority: 35
    category: business_temporal
    check: "No other Recruitment of the same participant with status == SCHEDULED occupies an interval intersecting [scheduled_start - 30 min, scheduled_end + 30 min) - half-open arithmetic, buffer applied on both sides of the incoming request"
    error_id: ERR_PARTICIPANT_SESSION_CONFLICT
    http_status: 409
    applies_to: "POST /recruitments/{id}/schedule"
  - priority: 36
    category: business_temporal
    check: "Fewer than POOL_MAX_CONCURRENT_FIELDING (2) other studies of the same pool with execution_status == FIELDING have a fielding window overlapping this study's window on closed-interval arithmetic, where a single shared endpoint day already counts as an overlap"
    error_id: ERR_POOL_FIELDING_CAPACITY
    http_status: 409
    applies_to: "POST /studies/{id}/field"
  - priority: 37
    category: business_constraint
    check: "No Recruitment already exists for this (study, participant) pair"
    error_id: ERR_DUPLICATE_RECRUITMENT
    http_status: 409
    applies_to: "POST /studies/{id}/recruitments"
  - priority: 38
    category: business_constraint
    check: "participant.status != SUPPRESSED"
    error_id: ERR_PARTICIPANT_SUPPRESSED
    http_status: 422
    applies_to: "POST /studies/{id}/recruitments"
  - priority: 39
    category: business_constraint
    check: "participant.contacts_in_window < pool.contact_cap_per_window"
    error_id: ERR_CONTACT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /studies/{id}/recruitments"
  - priority: 40
    category: business_constraint
    check: "study.method == request.approved_method and request.status == APPROVED"
    error_id: ERR_METHOD_NOT_APPROVED
    http_status: 422
    applies_to: "POST /studies"
  - priority: 41
    category: business_constraint
    check: "parent_theme_id chain depth + 1 <= THEME_MAX_DEPTH (3)"
    error_id: ERR_THEME_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /themes"
  - priority: 42
    category: business_constraint
    check: "The auto_invite_selection candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http_status: 422
    applies_to: "POST /studies/{id}/recruitments/auto-invite"
  - priority: 43
    category: business_referential
    check: "The cited artifact resolves to the same study as the finding: artifact -> Recruitment.study_id == finding.study_id"
    error_id: ERR_EVIDENCE_STUDY_MISMATCH
    http_status: 422
    applies_to: "POST /findings/{id}/evidence-links"
  - priority: 44
    category: business_referential
    check: "Every id in cited_finding_ids belongs to a Finding whose study_id equals the readout's study_id"
    error_id: ERR_CITATION_STUDY_MISMATCH
    http_status: 422
    applies_to: "POST /studies/{id}/readouts"
  - priority: 45
    category: business_constraint
    check: "finding.admissible_link_count >= 1 when locking"
    error_id: ERR_NO_ADMISSIBLE_EVIDENCE
    http_status: 422
    applies_to: "POST /findings/{id}/lock"
  - priority: 46
    category: business_constraint
    check: "finding.distinct_participant_count >= MIN_DISTINCT_PARTICIPANTS (3) when locking"
    error_id: ERR_INSUFFICIENT_CORROBORATION
    http_status: 422
    applies_to: "POST /findings/{id}/lock"
  - priority: 47
    category: business_constraint
    check: "finding.evidence_strength >= MIN_PUBLISH_STRENGTH (0.45) when publishing"
    error_id: ERR_EVIDENCE_TOO_WEAK
    http_status: 422
    applies_to: "POST /findings/{id}/publish"
  - priority: 48
    category: business_constraint
    check: "decision_evidence_confidence(decision) >= LOCK_MIN_CONFIDENCE (0.60) when locking a decision"
    error_id: ERR_CONFIDENCE_BELOW_LOCK_THRESHOLD
    http_status: 422
    applies_to: "POST /roadmap-decisions/{id}/lock"
  - priority: 49
    category: business_fiscal
    check: "The reservation computed by incentive_reservation is <= pool.incentive_available_cents in the pool's pre-call state; on auto-invite this is evaluated per candidate and only a zero-row batch is rejected"
    error_id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /studies/{id}/recruitments, POST /studies/{id}/recruitments/auto-invite"
  - priority: 50
    category: business_constraint
    check: "external_ref is unique inside the pool"
    error_id: ERR_DUPLICATE_EXTERNAL_REF
    http_status: 409
    applies_to: "POST /participant-pools/{id}/participants"
  - priority: 51
    category: business_constraint
    check: "Theme label is unique across the repository, and pool name is unique across pools"
    error_id: ERR_DUPLICATE_LABEL
    http_status: 409
    applies_to: "POST /themes, POST /participant-pools"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. The logical clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every deadline, retention horizon, contact window and cycle-time computation reads this clock."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets logical now; does not itself expire consent or purge artifacts - POST /_ops/retention-sweep applies time-driven transitions"]
  - method: POST
    path: "/_ops/retention-sweep"
    description: "Test-driving endpoint: applies every time-driven transition that is due at the current logical clock - ConsentRecord GRANTED -> EXPIRED when retention_until <= now, ResearchArtifact RETAINED -> PURGED when retention_until <= now, FollowUp OPEN -> OVERDUE when due_date < now - and runs the resulting cascades to completion."
    roles: [ResearchOpsAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: { expired_consent_count: integer, purged_artifact_count: integer, inadmissible_link_count: integer, retracted_finding_count: integer, overdue_follow_up_count: integer, unlocked_decision_count: integer }
    side_effects: ["consent expiry cascade", "artifact purge cascade", "evidence_strength recompute", "theme_evidence_weight recompute", "decision_evidence_confidence recompute", "follow-up overdue marking"]
  - method: POST
    path: "/roadmap-decisions"
    description: "Registers a roadmap decision that research evidence will inform."
    roles: [Stakeholder, ResearchOpsAdmin]
    code: 201
    input: [title, reversibility, decision_deadline, impacted_user_count]
    output: RoadmapDecision
    side_effects: ["status = OPEN", "evidence_confidence = 0.00"]
  - method: POST
    path: "/roadmap-decisions/{id}/lock"
    description: "Locks a decision once accepted research evidence clears the confidence bar; a later retraction can force it back to OPEN."
    roles: [Stakeholder]
    code: 200
    input: []
    output: RoadmapDecision
    side_effects: ["decision_evidence_confidence recomputed and compared against LOCK_MIN_CONFIDENCE", "status = LOCKED", "locked_at = now"]
  - method: GET
    path: "/roadmap-decisions/{id}"
    description: "Reads a roadmap decision with its derived evidence_confidence."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: RoadmapDecision
    side_effects: []
  - method: GET
    path: "/roadmap-decisions/{id}/research-requests"
    description: "Lists the research requests raised against a decision, ordered by priority_score DESC then created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ResearchRequest[]
    side_effects: []
  - method: POST
    path: "/research-requests"
    description: "Intake of a research request: frames the question, names the decision it serves, and receives a priority score plus a recommended method."
    roles: [Stakeholder, Researcher, ResearchLead]
    code: 201
    input: [roadmap_decision_id, question, question_type, evidence_gap]
    output: ResearchRequest
    side_effects: ["request_priority_score", "method_recommendation", "status = SUBMITTED", "requester_user_id = X-User-ID", "revision_round = 0"]
  - method: POST
    path: "/research-requests/{id}/triage"
    description: "Research lead triage. outcome is one of APPROVED (optionally overriding the recommended method with method_override), NEEDS_REFRAMING (sends the request back to its requester) or REJECTED. Every outcome recomputes priority_score and recommended_method against the current clock."
    roles: [ResearchLead]
    code: 200
    input: [outcome, "reason?", "method_override?"]
    output: ResearchRequest
    side_effects: ["status = APPROVED | NEEDS_REFRAMING | REJECTED", "request_priority_score", "method_recommendation", "approved_method set on APPROVED (method_override wins over recommended_method)", "triage_reason and triaged_at set"]
  - method: POST
    path: "/research-requests/{id}/resubmit"
    description: "Requester reframes a NEEDS_REFRAMING request and returns it to SUBMITTED. At most MAX_REVISION_ROUNDS (2) reframings are permitted; the third attempt is refused with ERR_REVISION_LIMIT_REACHED and the request can then only be closed by a triage REJECTED."
    roles: [Stakeholder, Researcher, ResearchLead]
    code: 200
    input: [question, question_type, evidence_gap]
    output: ResearchRequest
    side_effects: ["revision_round += 1", "status = SUBMITTED", "question, question_type and evidence_gap overwritten", "priority_score, recommended_method and approved_method cleared to null"]
  - method: GET
    path: "/research-requests/{id}"
    description: "Reads a research request with its derived priority_score and recommended_method."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: ResearchRequest
    side_effects: []
  - method: POST
    path: "/participant-pools"
    description: "Creates a participant pool with its contact-frequency cap and incentive budget."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [name, pool_type, contact_cap_per_window, contact_window_days, incentive_budget_cents]
    output: ParticipantPool
    side_effects: ["incentive_available_cents = incentive_budget_cents", "incentive_reserved_cents = 0", "incentive_paid_cents = 0", "status = OPEN", "settled_study_ids = []"]
  - method: POST
    path: "/participant-pools/{id}/participants"
    description: "Enrolls a participant into a pool with segment, locale and PII flag."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [external_ref, segment, locale, pii_on_file]
    output: Participant
    side_effects: ["status = ELIGIBLE", "contacts_in_window = 0", "no_show_strikes = 0", "pool.participant_count += 1", "pool_posture re-derived"]
  - method: POST
    path: "/participant-pools/{id}/incentive-settlements"
    description: "Settles a study's incentives against the pool. mode = FORWARD_ESTIMATE reports the reservation-based projection without moving money; mode = CHRONOLOGICAL_ACTUAL walks the study's recruitments in created_at ASC order and converts reservations into payments, forfeitures and releases."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [study_id, mode, expected_pool_version]
    output: ParticipantPool
    side_effects: ["incentive_settlement", "on CHRONOLOGICAL_ACTUAL: Recruitment.incentive_state PAID | FORFEITED | RELEASED, paid_cents set, pool.incentive_paid_cents / incentive_reserved_cents / incentive_available_cents updated, study_id appended to pool.settled_study_ids", "pool_posture re-derived", "increments ParticipantPool.version by 1"]
  - method: GET
    path: "/participant-pools/{id}"
    description: "Reads a pool with its derived posture and incentive ledger."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: ParticipantPool
    side_effects: []
  - method: GET
    path: "/participant-pools/{id}/participants"
    description: "Lists a pool's participants, ordered by created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["status?", "segment?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: "Reads a participant with contact-window counters and no-show strikes."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/studies"
    description: "Opens a study for an APPROVED request against a pool, with screening criteria, incentive amount and the intended fielding window."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [research_request_id, participant_pool_id, method, target_participant_count, screening_criteria, incentive_amount_cents, fielding_start, fielding_end]
    output: Study
    side_effects: ["execution_status = PLANNED", "recruitment_status = NOT_STARTED", "guide_status = NONE", "lead_user_id = X-User-ID", "request.status = IN_STUDY"]
  - method: PUT
    path: "/studies/{id}/guide"
    description: "Writes or rewrites the moderator guide of a study whose execution_status is PLANNED or GUIDE_APPROVED; a rewrite resets guide_status to DRAFT and unpins the version, so the guide must be approved again before the study can be fielded. Rejected with ERR_INVALID_STATE from FIELDING onward."
    roles: [Researcher, ResearchLead]
    code: 200
    input: [guide_version_label, guide_question_count]
    output: Study
    side_effects: ["guide_status = DRAFT", "guide_version_pinned = null"]
  - method: POST
    path: "/studies/{id}/guide/approve"
    description: "Research lead approves the moderator guide and pins its version label for every session that follows."
    roles: [ResearchLead]
    code: 200
    input: []
    output: Study
    side_effects: ["guide_status = APPROVED", "guide_version_pinned = guide_version_label", "execution_status = GUIDE_APPROVED"]
  - method: POST
    path: "/studies/{id}/field"
    description: "Puts an approved study into the field, subject to the governing decision still being OPEN and the pool's concurrent-fielding capacity."
    roles: [Researcher, ResearchLead]
    code: 200
    input: []
    output: Study
    side_effects: ["execution_status = FIELDING", "recruitment_status = RECRUITING", "fielded_at = now"]
  - method: POST
    path: "/studies/{id}/close-fielding"
    description: "Closes fielding and moves the study into analysis; refused while any recruitment is still SCHEDULED."
    roles: [Researcher, ResearchLead]
    code: 200
    input: []
    output: Study
    side_effects: ["execution_status = ANALYSIS", "fielding_closed_at = now", "recruitment_status = RECRUITMENT_FAILED when completed_count == 0, otherwise left exactly where the recruitment dimension already stands (RECRUITING or QUOTA_MET)", "study_metrics recomputed"]
  - method: POST
    path: "/studies/{id}/recruitments"
    description: "Invites one named participant into the study, reserving incentive money against the pool at the surcharge tier implied by the pool's pre-call utilization."
    roles: [Researcher, ResearchLead, ResearchOpsAdmin]
    code: 201
    input: [participant_id, screening_answers]
    output: Recruitment
    side_effects: ["status = INVITED", "incentive_reservation", "incentive_state = RESERVED", "reserved_cents set", "pool.incentive_reserved_cents += reserved_cents", "pool.incentive_available_cents -= reserved_cents", "pool_posture re-derived", "participant.contacts_in_window += 1", "participant.last_contacted_at = now", "participant_eligibility re-derived", "study.invited_count += 1", "guide_version_pinned = study.guide_version_pinned"]
  - method: POST
    path: "/studies/{id}/recruitments/auto-invite"
    description: "Selector: invites up to count participants chosen by auto_invite_selection from the study's pool. A short batch is a success (201 with fewer rows than count) when the candidate list runs out or the next reservation would breach the pool budget; the call fails only when zero rows could be created - ERR_NO_ELIGIBLE_PARTICIPANTS when the candidate set was empty, ERR_INCENTIVE_BUDGET_EXCEEDED when the first candidate was unaffordable."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [count]
    output: Recruitment[]
    side_effects: ["auto_invite_selection", "one Recruitment per selected participant with the same side effects as the single-participant invite, applied one at a time in selection order so each reservation sees the utilization left by the previous one", "partial batch: rows already created stay committed when the walk stops early on an exhausted candidate list or an unaffordable next reservation"]
  - method: GET
    path: "/studies/{id}"
    description: "Reads a study with both of its state dimensions and its recruitment counters."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Study
    side_effects: []
  - method: GET
    path: "/studies"
    description: "Lists studies, ordered by created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["research_request_id?", "participant_pool_id?", "execution_status?", "recruitment_status?", "limit?", "offset?"]
    output: Study[]
    side_effects: []
  - method: GET
    path: "/studies/{id}/metrics"
    description: "Computed read: research-operations metrics for one study - cycle time, fielding duration, recruitment efficiency, published findings and impact score."
    roles: [Stakeholder, Researcher, ResearchLead, ResearchOpsAdmin]
    code: 200
    input: []
    output: { cycle_time_days: integer, fielding_days: integer, recruitment_efficiency: number, published_findings: integer, impact_score: number }
    side_effects: ["study_metrics"]
  - method: POST
    path: "/recruitments/{id}/screen"
    description: "Scores the participant's screening answers against the study's criteria and admits or rejects them."
    roles: [Researcher, ResearchLead, ResearchOpsAdmin]
    code: 200
    input: []
    output: Recruitment
    side_effects: ["screen_score", "status = SCREENED_IN or SCREENED_OUT", "study.screened_in_count += 1 on admission", "incentive_state stays RESERVED and reserved_cents is untouched on both outcomes - a SCREENED_OUT row keeps its reservation until settlement converts it to the screen-out stipend"]
  - method: POST
    path: "/recruitments/{id}/schedule"
    description: "Books a session for a screened-in participant, subject to consent being on file, the window sitting inside the study's fielding window, and the participant's other sessions plus their buffer."
    roles: [Researcher, ResearchLead]
    code: 200
    input: [scheduled_start, scheduled_end, moderator_user_id]
    output: Recruitment
    side_effects: ["status = SCHEDULED", "reschedule_count += 1 when rescheduling an already SCHEDULED recruitment", "moderator_user_id set"]
  - method: POST
    path: "/recruitments/{id}/complete"
    description: "Records a completed session."
    roles: [Researcher, ResearchLead]
    code: 200
    input: [actual_duration_min]
    output: Recruitment
    side_effects: ["status = COMPLETED", "study.completed_count += 1", "recruitment_status = QUOTA_MET when completed_count reaches target_participant_count", "participant.contacts_in_window unchanged", "study_metrics recomputed"]
  - method: POST
    path: "/recruitments/{id}/no-show"
    description: "Records a no-show, forfeiting the reservation and adding a strike that can suppress the participant and restrict the pool."
    roles: [Researcher, ResearchLead]
    code: 200
    input: [reason]
    output: Recruitment
    side_effects: ["status = NO_SHOW", "incentive_state = FORFEITED", "reserved_cents released to pool.incentive_available_cents", "participant.no_show_strikes += 1", "participant_eligibility re-derived (SUPPRESSED at NO_SHOW_SUPPRESSION_STRIKES)", "pool.suppressed_participant_count updated", "pool_posture re-derived"]
  - method: POST
    path: "/recruitments/{id}/withdraw"
    description: "Withdraws a participant before their session, releasing the reservation in full."
    roles: [Researcher, ResearchLead, ResearchOpsAdmin]
    code: 200
    input: [reason]
    output: Recruitment
    side_effects: ["status = WITHDRAWN", "incentive_state = RELEASED", "reserved_cents = 0", "pool.incentive_reserved_cents -= released amount", "pool.incentive_available_cents += released amount", "participant.contacts_in_window -= 1", "closure_reason = reason", "pool_posture re-derived"]
  - method: POST
    path: "/recruitments/{id}/artifacts"
    description: "Registers a recording, transcript or PII note produced by a session; the consent scope on file decides whether it may exist and how long it may be kept."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [artifact_type, contains_pii]
    output: ResearchArtifact
    side_effects: ["retention_horizon", "lifecycle_state = RETAINED", "retention_until set from the consent record and the artifact type's cap"]
  - method: GET
    path: "/recruitments/{id}"
    description: "Reads a recruitment with both its workflow status and its incentive state."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Recruitment
    side_effects: []
  - method: GET
    path: "/recruitments"
    description: "Lists recruitments, ordered by created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["study_id?", "participant_id?", "status?", "incentive_state?", "limit?", "offset?"]
    output: Recruitment[]
    side_effects: []
  - method: GET
    path: "/recruitments/{id}/artifacts"
    description: "Lists the artifacts captured for one recruitment, ordered by created_at ASC."
    roles: [Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["artifact_type?", "lifecycle_state?", "limit?", "offset?"]
    output: ResearchArtifact[]
    side_effects: []
  - method: GET
    path: "/artifacts/{id}"
    description: "Reads an artifact with its retention horizon and lifecycle state."
    roles: [Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: ResearchArtifact
    side_effects: []
  - method: GET
    path: "/artifacts/{id}/evidence-links"
    description: "Lists the evidence links citing one artifact, ordered by created_at ASC."
    roles: [Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["is_admissible?", "limit?", "offset?"]
    output: EvidenceLink[]
    side_effects: []
  - method: POST
    path: "/consent-records"
    description: "Records a participant's consent for one study: which artifact scopes are permitted and for how long."
    roles: [Researcher, ResearchLead, PrivacyOfficer]
    code: 201
    input: [participant_id, study_id, scopes, retention_days]
    output: ConsentRecord
    side_effects: ["status = GRANTED", "granted_at = now", "retention_horizon: retention_until = granted_at + min(retention_days, tightest MAX_RETENTION_DAYS across scopes)"]
  - method: POST
    path: "/consent-records/{id}/revoke"
    description: "Revokes consent and runs the privacy cascade: artifacts purge, evidence links go inadmissible, findings re-score and may retract, themes re-weigh and decisions may unlock."
    roles: [PrivacyOfficer]
    code: 200
    input: [reason]
    output: ConsentRecord
    side_effects: ["status = REVOKED", "revoked_at = now", "revocation_reason = reason", "every RETAINED artifact of that participant for that study -> PURGED with purge_reason = CONSENT_REVOKED", "citing EvidenceLink.is_admissible = false with inadmissible_reason = ARTIFACT_PURGED", "evidence_strength recomputed", "Finding -> RETRACTED when it loses all admissible evidence or drops below the publish bar", "theme_evidence_weight recomputed", "decision_evidence_confidence recomputed and LOCKED -> OPEN when it falls under LOCK_MIN_CONFIDENCE"]
  - method: GET
    path: "/consent-records/{id}"
    description: "Reads a consent record with its computed retention_until."
    roles: [Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records"
    description: "Lists consent records, ordered by created_at ASC."
    roles: [Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["participant_id?", "study_id?", "status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: POST
    path: "/themes"
    description: "Creates a repository theme, optionally nested under a parent theme up to THEME_MAX_DEPTH."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [label, "parent_theme_id?"]
    output: Theme
    side_effects: ["depth = parent.depth + 1 or 1", "status = EMERGING", "own_evidence_weight = 0.00", "evidence_weight = 0.00", "reuse_count = 0"]
  - method: GET
    path: "/themes/{id}"
    description: "Reads a theme with its rolled-up evidence weight and reuse count."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Theme
    side_effects: []
  - method: GET
    path: "/themes"
    description: "Searchable repository index: lists themes ordered by evidence_weight DESC then created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["parent_theme_id?", "status?", "label_contains?", "limit?", "offset?"]
    output: Theme[]
    side_effects: []
  - method: POST
    path: "/findings"
    description: "Drafts a finding for a study under a repository theme."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [study_id, theme_id, statement, severity]
    output: Finding
    side_effects: ["status = DRAFT", "authored_by_user_id = X-User-ID", "strength_variant = PROVISIONAL", "evidence_strength = 0.00", "admissible_link_count = 0", "distinct_participant_count = 0", "theme.reuse_count is NOT touched here - it counts ACCEPTED readouts per theme_evidence_weight"]
  - method: POST
    path: "/findings/{id}/evidence-links"
    description: "Links a session artifact to a finding as evidence, weighted by how directly it supports the claim."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [artifact_id, excerpt_ref, weight_class]
    output: EvidenceLink
    side_effects: ["is_admissible = true", "contribution computed per weight_class and the study's method multiplier", "finding.admissible_link_count and distinct_participant_count recomputed", "evidence_strength recomputed under the finding's current variant"]
  - method: DELETE
    path: "/evidence-links/{id}"
    description: "Removes an evidence link from a DRAFT finding, reversing its contribution exactly."
    roles: [Researcher, ResearchLead]
    code: 204
    input: []
    output: null
    side_effects: ["link deleted", "finding.admissible_link_count and distinct_participant_count recomputed", "evidence_strength recomputed to exactly the value it held before the link was added"]
  - method: POST
    path: "/findings/{id}/lock"
    description: "Locks a finding's evidence set once it carries admissible links from enough distinct participants, switching it to the corroborated strength variant."
    roles: [Researcher, ResearchLead]
    code: 200
    input: []
    output: Finding
    side_effects: ["status = EVIDENCE_LOCKED", "strength_variant = CORROBORATED", "evidence_strength recomputed under the CORROBORATED variant"]
  - method: POST
    path: "/findings/{id}/publish"
    description: "Publishes a locked finding into the repository; the publisher must not be its author."
    roles: [ResearchLead, ResearchOpsAdmin]
    code: 200
    input: []
    output: Finding
    side_effects: ["status = PUBLISHED", "published_at = now", "theme_evidence_weight recomputed for the theme and its ancestors", "theme.status = ESTABLISHED at THEME_ESTABLISH_MIN"]
  - method: GET
    path: "/findings/{id}"
    description: "Reads a finding with its variant, evidence strength and admissible-link counters."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: GET
    path: "/findings"
    description: "Lists findings, ordered by evidence_strength DESC then created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["study_id?", "theme_id?", "status?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: GET
    path: "/findings/{id}/evidence-links"
    description: "Lists a finding's evidence links, ordered by created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["is_admissible?", "limit?", "offset?"]
    output: EvidenceLink[]
    side_effects: []
  - method: POST
    path: "/studies/{id}/readouts"
    description: "Drafts a stakeholder readout for a study against the decision it informs, citing the findings that carry the recommendation. Requires the study's current version."
    roles: [Researcher, ResearchLead]
    code: 201
    input: [roadmap_decision_id, recommendation, recommended_action, cited_finding_ids, expected_study_version]
    output: Readout
    side_effects: ["status = DRAFT", "decision_confidence_before = decision.evidence_confidence", "any earlier DRAFT or DELIVERED readout for the same (study, decision) pair -> SUPERSEDED", "increments Study.version by 1"]
  - method: POST
    path: "/readouts/{id}/deliver"
    description: "Delivers the readout to stakeholders; refused unless every cited finding is still PUBLISHED."
    roles: [Researcher, ResearchLead]
    code: 200
    input: []
    output: Readout
    side_effects: ["status = DELIVERED", "delivered_at = now", "study.execution_status = REPORTED", "study_metrics recomputed"]
  - method: POST
    path: "/readouts/{id}/respond"
    description: "Stakeholder accepts or defers the readout's recommendation. Acceptance feeds the cited evidence into the decision's confidence."
    roles: [Stakeholder]
    code: 200
    input: [outcome, "note?"]
    output: Readout
    side_effects: ["status = ACCEPTED or DEFERRED", "responded_at = now", "response_note = note", "on ACCEPTED: decision_evidence_confidence recomputed, decision_confidence_after set, study.execution_status = CLOSED, request.status = CLOSED"]
  - method: POST
    path: "/readouts/{id}/follow-ups"
    description: "Opens a follow-up action item owned by a named user against an accepted readout."
    roles: [Stakeholder, ResearchLead, ResearchOpsAdmin]
    code: 201
    input: [owner_user_id, description, due_date]
    output: FollowUp
    side_effects: ["status = OPEN"]
  - method: POST
    path: "/follow-ups/{id}/complete"
    description: "The owner closes a follow-up, whether it is OPEN or already OVERDUE."
    roles: [Stakeholder, ResearchLead, ResearchOpsAdmin]
    code: 200
    input: []
    output: FollowUp
    side_effects: ["status = DONE", "completed_at = now"]
  - method: GET
    path: "/readouts/{id}"
    description: "Reads a readout with its citations and the decision confidence before and after."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: []
    output: Readout
    side_effects: []
  - method: GET
    path: "/readouts"
    description: "Lists readouts, ordered by created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["study_id?", "roadmap_decision_id?", "status?", "limit?", "offset?"]
    output: Readout[]
    side_effects: []
  - method: GET
    path: "/readouts/{id}/follow-ups"
    description: "Lists a readout's follow-ups, ordered by due_date ASC then created_at ASC."
    roles: [Stakeholder, Researcher, ResearchLead, PrivacyOfficer, ResearchOpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FollowUp[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not among the endpoint's permitted roles"
  - id: ERR_OWNERSHIP_REQUIRED
    http: 403
    condition: "The acting operator is not the requester of the research request, not the requester behind the readout, or not the owner of the follow-up"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The operator publishing a finding is the same operator who authored it"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "No RoadmapDecision with the given id"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "No ResearchRequest with the given id"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "No ParticipantPool with the given id"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant with the given id"
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "No Study with the given id"
  - id: ERR_RECRUITMENT_NOT_FOUND
    http: 404
    condition: "No Recruitment with the given id"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "No ConsentRecord with the given id"
  - id: ERR_ARTIFACT_NOT_FOUND
    http: 404
    condition: "No ResearchArtifact with the given id"
  - id: ERR_THEME_NOT_FOUND
    http: 404
    condition: "No Theme with the given id, including a parent_theme_id that resolves to nothing"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No Finding with the given id, including an id inside cited_finding_ids that resolves to nothing"
  - id: ERR_EVIDENCE_LINK_NOT_FOUND
    http: 404
    condition: "No EvidenceLink with the given id"
  - id: ERR_READOUT_NOT_FOUND
    http: 404
    condition: "No Readout with the given id"
  - id: ERR_FOLLOW_UP_NOT_FOUND
    http: 404
    condition: "No FollowUp with the given id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, negative or zero where a positive integer is required, inverted time window, malformed screening object, empty or duplicated consent scopes, or out-of-range limit/offset"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition does not exist from the resource's current state, including reschedule beyond RESCHEDULE_LIMIT, close-fielding with a SCHEDULED recruitment outstanding, a second study for a request already IN_STUDY, and evidence writes on a PUBLISHED or RETRACTED finding"
  - id: ERR_GUIDE_NOT_APPROVED
    http: 409
    condition: "The study's moderator guide is not in the state the operation requires - approving a guide that is not DRAFT, or fielding a study whose guide is not APPROVED"
  - id: ERR_DECISION_LOCKED
    http: 409
    condition: "The governing RoadmapDecision is LOCKED, so no further study may be fielded against it and no readout response may move it"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A resubmit was attempted on a request whose revision_round has already reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_RECRUITMENT_CLOSED
    http: 409
    condition: "The study is not FIELDING, or its recruitment_status is already QUOTA_MET"
  - id: ERR_POOL_CLOSED
    http: 409
    condition: "The participant pool's derived posture is CLOSED"
  - id: ERR_POOL_RESTRICTED
    http: 409
    condition: "The batch selector was invoked on a pool whose derived posture is RESTRICTED"
  - id: ERR_SETTLEMENT_NOT_PERMITTED
    http: 409
    condition: "A CHRONOLOGICAL_ACTUAL settlement was requested for a study that has not reached ANALYSIS"
  - id: ERR_ALREADY_SETTLED
    http: 409
    condition: "The study already appears in the pool's settled_study_ids"
  - id: ERR_NO_PUBLISHED_FINDINGS
    http: 409
    condition: "The readout cites no findings, or at least one cited finding is no longer PUBLISHED at delivery time"
  - id: ERR_STALE_STUDY_VERSION
    http: 412
    condition: "expected_study_version does not match the study's current version"
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_pool_version does not match the pool's current version"
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "No GRANTED ConsentRecord exists for the participant and study of the session being booked"
  - id: ERR_CONSENT_SCOPE_MISSING
    http: 422
    condition: "The GRANTED consent record does not carry the scope required by the artifact type being registered"
  - id: ERR_ARTIFACT_PURGED
    http: 422
    condition: "The cited artifact has lifecycle_state PURGED and can no longer be used as evidence"
  - id: ERR_SESSION_WINDOW_OUTSIDE_FIELDING
    http: 422
    condition: "The requested session window falls outside the study's fielding window"
  - id: ERR_PARTICIPANT_SESSION_CONFLICT
    http: 409
    condition: "The participant already has a SCHEDULED session whose interval, widened by the 30-minute buffer, intersects the requested window"
  - id: ERR_POOL_FIELDING_CAPACITY
    http: 409
    condition: "Fielding this study would put more than POOL_MAX_CONCURRENT_FIELDING (2) studies of the same pool in fielding windows that share at least one instant"
  - id: ERR_DUPLICATE_RECRUITMENT
    http: 409
    condition: "A Recruitment already exists for this study and participant"
  - id: ERR_PARTICIPANT_SUPPRESSED
    http: 422
    condition: "The participant's derived eligibility is SUPPRESSED"
  - id: ERR_CONTACT_CAP_EXCEEDED
    http: 422
    condition: "The participant has already been contacted contact_cap_per_window times inside the pool's contact window"
  - id: ERR_METHOD_NOT_APPROVED
    http: 422
    condition: "The study's method differs from the request's approved_method, or the request is not APPROVED"
  - id: ERR_THEME_DEPTH_EXCEEDED
    http: 422
    condition: "Nesting the theme would exceed THEME_MAX_DEPTH"
  - id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http: 422
    condition: "The selector found fewer eligible, uninvited participants than the requested count"
  - id: ERR_EVIDENCE_STUDY_MISMATCH
    http: 422
    condition: "The cited artifact belongs to a recruitment of a different study than the finding"
  - id: ERR_CITATION_STUDY_MISMATCH
    http: 422
    condition: "A cited finding belongs to a different study than the readout"
  - id: ERR_NO_ADMISSIBLE_EVIDENCE
    http: 422
    condition: "The finding carries no admissible evidence link at lock time"
  - id: ERR_INSUFFICIENT_CORROBORATION
    http: 422
    condition: "The finding's admissible evidence spans fewer than MIN_DISTINCT_PARTICIPANTS participants at lock time"
  - id: ERR_EVIDENCE_TOO_WEAK
    http: 422
    condition: "The finding's evidence_strength is below MIN_PUBLISH_STRENGTH at publish time"
  - id: ERR_CONFIDENCE_BELOW_LOCK_THRESHOLD
    http: 422
    condition: "The decision's derived evidence_confidence is below LOCK_MIN_CONFIDENCE at lock time"
  - id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http: 422
    condition: "The reservation including its surcharge exceeds the pool's available incentive budget"
  - id: ERR_DUPLICATE_EXTERNAL_REF
    http: 409
    condition: "Another participant in the same pool already carries this external_ref"
  - id: ERR_DUPLICATE_LABEL
    http: 409
    condition: "Another theme already carries this label, or another pool already carries this name"

roles:
  - name: Stakeholder
    description: "Product or design partner who owns roadmap decisions, raises research requests, responds to readouts and opens follow-ups."
    identity: opaque
    exclusive_operations:
      - "POST /roadmap-decisions/{id}/lock"
      - "POST /readouts/{id}/respond"
    shared_operations:
      - "POST /roadmap-decisions"
      - "POST /research-requests"
      - "POST /research-requests/{id}/resubmit"
      - "POST /readouts/{id}/follow-ups"
      - "POST /follow-ups/{id}/complete"
      - "all GET endpoints except GET /artifacts/{id}, GET /artifacts/{id}/evidence-links, GET /recruitments/{id}/artifacts, GET /consent-records/{id} and GET /consent-records, which carry participant-level personal data"
  - name: Researcher
    description: "Runs studies end to end: writes guides, recruits, screens, schedules, moderates sessions, registers artifacts, drafts findings and readouts."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /research-requests"
      - "POST /research-requests/{id}/resubmit"
      - "POST /studies"
      - "PUT /studies/{id}/guide"
      - "POST /studies/{id}/field"
      - "POST /studies/{id}/close-fielding"
      - "POST /studies/{id}/recruitments"
      - "POST /recruitments/{id}/screen"
      - "POST /recruitments/{id}/schedule"
      - "POST /recruitments/{id}/complete"
      - "POST /recruitments/{id}/no-show"
      - "POST /recruitments/{id}/withdraw"
      - "POST /recruitments/{id}/artifacts"
      - "POST /consent-records"
      - "POST /themes"
      - "POST /findings"
      - "POST /findings/{id}/evidence-links"
      - "DELETE /evidence-links/{id}"
      - "POST /findings/{id}/lock"
      - "POST /studies/{id}/readouts"
      - "POST /readouts/{id}/deliver"
      - "all GET endpoints"
  - name: ResearchLead
    description: "Triages intake, approves moderator guides and publishes findings. May also author findings, which is exactly why publication carries a segregation-of-duties check against the author."
    identity: opaque
    exclusive_operations:
      - "POST /research-requests/{id}/triage"
      - "POST /studies/{id}/guide/approve"
    shared_operations:
      - "every operation shared with Researcher"
      - "POST /findings/{id}/publish"
      - "POST /readouts/{id}/follow-ups"
      - "POST /follow-ups/{id}/complete"
      - "all GET endpoints"
  - name: PrivacyOfficer
    description: "Owns consent and retention: grants and revokes consent, runs retention sweeps, and reads every artifact and evidence link."
    identity: opaque
    exclusive_operations:
      - "POST /consent-records/{id}/revoke"
    shared_operations:
      - "POST /consent-records"
      - "POST /_ops/retention-sweep"
      - "all GET endpoints except GET /studies/{id}/metrics"
  - name: ResearchOpsAdmin
    description: "Research operations: pools, panel enrollment, the batch invite selector, incentive settlement, the logical clock and the retention sweep."
    identity: opaque
    exclusive_operations:
      - "POST /participant-pools"
      - "POST /participant-pools/{id}/participants"
      - "POST /participant-pools/{id}/incentive-settlements"
      - "POST /studies/{id}/recruitments/auto-invite"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /roadmap-decisions"
      - "POST /studies/{id}/recruitments"
      - "POST /recruitments/{id}/screen"
      - "POST /recruitments/{id}/withdraw"
      - "POST /findings/{id}/publish"
      - "POST /readouts/{id}/follow-ups"
      - "POST /follow-ups/{id}/complete"
      - "POST /_ops/retention-sweep"
      - "all GET endpoints"
