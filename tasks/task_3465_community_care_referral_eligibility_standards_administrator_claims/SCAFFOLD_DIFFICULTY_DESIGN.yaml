              as: ProviderRep
              as_user_id: "${p_id}"
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /community-care/claims"
              payload: { referral_authorization_id: "${ra_id}", service_date: "2026-09-06", service_lines: [{ service_code: "GEN1", service_category: "PRIMARY_CARE", units: 1, unit_billed_cents: 1000 }] }
