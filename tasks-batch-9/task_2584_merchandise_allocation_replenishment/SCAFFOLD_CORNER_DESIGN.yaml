              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l1_id: "$.data[0].id" }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-A", scope: "PROGRAM", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { pe_id: $.data.id }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s2_id}", to_store_id: "${s1_id}", item_id: "${item_id}", units: 6, expected_from_position_version: "${p2_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { t1_id: $.data.id }
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/assortment-actions"
              payload: { item_id: "${item_id}", store_id: "${s1_id}" }
              as: AllocationManager
              captures: { a1_id: "$.data[0].id" }
          assert:
            - "AllocationProgram is created with status == PLANNING (it reaches ACTIVE only on the later activate call)"
            - "Store 0101 and 0102 are both created with status == ACTIVE"
            - "Item SKU-1001 is created with lifecycle_state == ACTIVE; it is the LATER creation of the broken 0101 position that re-derives it to BROKEN, not the creation itself"
            - "Receipt ASN-8001 is created with status == STAGED"
            - "AllocationRun is created with status == DRAFT, units_proposed 0 and eligible_store_count 0"
            - "The propose produces exactly ONE AllocationLine, for store 0101, with fulfillment_status == PENDING, need_units == 32 (target 9 x 4 = 36 minus pipeline 4), units_proposed == 20, size_breakdown == [{S:4},{M:7},{L:6},{XL:3}], capacity_capped_units == 0 and presentation_gap_units == 0; store 0102 has need 0 and gets no line at all"
            - "AllocationRun.${run_id}.eligible_store_count == 1 and unallocated_remainder_units == 0 after the propose"
            - "PromoEvent BTS-A is created with status == DRAFT"
            - "TransferRecommendation is created with status == PROPOSED, expires_at == 2026-08-08T00:00:00Z, source_reason == REBALANCE and size_split == [{S:4},{XL:2}]"
            - "The detection sweep creates exactly one AssortmentAction, for (SKU-1001, 0101), with status == PENDING, trigger_reason == BROKEN_ASSORTMENT, action_type == MARKDOWN, markdown_pct_bp == 3000 (broken_ratio 2 of 4 = 5000bp), broken_size_count == 2, units_at_detection == 4 and detected_at == 2026-08-01T00:00:00Z"
            - "The two StorePosition dimensions have no initial state to speak of: 0101 is created straight into LOW + BROKEN and 0102 into OVERSTOCK + COMPLETE"
      - name: program_lifecycle_walks_every_declared_transition_and_closes_with_a_cascade
        claim_type: valid_transition
        grounds:
          - state_machines[AllocationProgram].transitions[PLANNING->ACTIVE]
          - state_machines[AllocationProgram].transitions[ACTIVE->LOCKED]
          - state_machines[AllocationProgram].transitions[LOCKED->ACTIVE]
          - state_machines[AllocationProgram].transitions[LOCKED->CLOSED]
          - entities.AllocationProgram.fields.locked_at
          - entities.AllocationProgram.fields.lock_reason
        distinguishing_aspect: |
          All five declared AllocationProgram transitions are walked in one chain - PLANNING -> ACTIVE ->
          LOCKED -> ACTIVE -> LOCKED -> CLOSED - and each must land on the target state, bump version by
          exactly one and apply its own side effects. lock stamps locked_at from the logical clock and stores
          the reason; unlock must CLEAR both back to null rather than leaving the stale stamp behind; a second
          lock must re-stamp them with the new reason. close is reached from LOCKED (not only from ACTIVE) and
          must cascade to the open receipt and the pending assortment action.
        test_recipe:
          setup:
            - "Program FA26 is ACTIVE (version 2) with store 0101, a shelf plan capacity 24 / pmin 8, SizeProfile TOP-4SZ (all four sizes CORE) and SKU-1001"
            - "Position 0101 is empty, so all four CORE sizes are missing -> broken_size_count 4, BROKEN, and the item is BROKEN"
            - "A 10-unit receipt ASN-8002 is STAGED and one detection sweep has raised a PENDING MARKDOWN action for (SKU-1001, 0101)"
            - "No allocation run and no transfer exists, so the close preconditions are satisfied"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], min_units: 6, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 10 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-8002", units_received: 10, size_received: [{ size_code: "S", units: 2 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }, { size_code: "XL", units: 1 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/assortment-actions"
              payload: { item_id: "${item_id}", store_id: "${s1_id}" }
              as: AllocationManager
              captures: { a1_id: "$.data[0].id" }
          trigger:
            - call: "POST /allocation/programs/${prog_id}/lock"
              payload: { reason: "month-end freeze" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/programs/${prog_id}/unlock"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/programs/${prog_id}/lock"
              payload: { reason: "quarter close" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
