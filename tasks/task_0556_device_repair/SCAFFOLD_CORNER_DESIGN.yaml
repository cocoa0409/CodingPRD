# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Electronics Trade-In & Device Repair Storefront — Expert
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: create_customer_returns_201_and_envelope
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with required fields returns 201, response_type object, a server-minted UUID id, and store_credit_balance_cents defaulted to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Al", email: "al@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
          assert:
            - "response http status == 201"
            - "response response_type == object"
            - "Customer.${cust}.store_credit_balance_cents == 0"
            - "Customer.${cust}.version == 1"

      - name: list_repair_tickets_pagination_shape
        claim_type: Listing
        grounds: [endpoints, entities.RepairTicket]
        distinguishing_aspect: "GET /repair-tickets honors limit and returns pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two customers each with a ticket already created."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "P1", email: "p1@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { c1: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${c1}", category: "PHONE", brand: "A", model: "m", serial_number: "s1", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { d1: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${d1}", customer_id: "${c1}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 1000 }
              as: ServiceAdvisor
            - call: "POST /devices"
              payload: { customer_id: "${c1}", category: "PHONE", brand: "A", model: "m", serial_number: "s2", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { d2: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${d2}", customer_id: "${c1}", intake_channel: "MAIL_IN", reported_issue: "y", spend_cap_cents: 1000 }
              as: ServiceAdvisor
          trigger:
            - call: "GET /repair-tickets?limit=1&offset=0"
              payload: {}
              as: StoreManager
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "response data array length == 1"

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_device_missing_required_market_value_returns_validation
        claim_type: Required Fields
        grounds: [entities.Device.fields.market_value_cents]
        distinguishing_aspect: "Omitting the required market_value_cents on POST /devices returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mv", email: "mv@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http status == 422"

      - name: create_device_invalid_enum_category_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Device.fields.category]
        distinguishing_aspect: "A category value outside {PHONE,LAPTOP,TABLET,WEARABLE} on POST /devices returns ERR_VALIDATION."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "En", email: "en@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "SPACESHIP", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_device_nonexistent_customer_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Device.fields.customer_id]
        distinguishing_aspect: "POST /devices with a customer_id that resolves to no Customer returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /devices"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUSTOMER_NOT_FOUND"
            - "response http status == 404"

      - name: get_repair_ticket_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.RepairTicket", "errors[ERR_TICKET_NOT_FOUND]"]
        distinguishing_aspect: "GET /repair-tickets/{id} for a non-existent UUID returns ERR_TICKET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /repair-tickets/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TICKET_NOT_FOUND"

      - name: create_ticket_default_is_under_warranty_false
        claim_type: Defaults
        grounds: [entities.RepairTicket.fields.is_under_warranty]
        distinguishing_aspect: "Omitting is_under_warranty on POST /repair-tickets applies the default false; is_callback defaults false."
        test_recipe:
          setup: ["Customer and device exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Df", email: "df@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 1000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
          assert:
            - "RepairTicket.${tkt}.is_under_warranty == false"
            - "RepairTicket.${tkt}.is_callback == false"
            - "RepairTicket.${tkt}.status == INTAKE"

      - name: part_available_qty_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.Part.fields.available_qty, calculations.part_availability]
        distinguishing_aspect: "On POST /parts, available_qty is computed as on_hand_qty - reserved_qty = 5 - 0 = 5 regardless of any client-sent value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "P1", name: "Screen", unit_price_cents: 6000, on_hand_qty: 5 }
              as: StoreManager
              captures: { part: $.data.id }
          assert:
            - "Part.${part}.available_qty == 5"
            - "Part.${part}.reserved_qty == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: create_customer_missing_auth_header_returns_missing_user_context
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers returns ERR_MISSING_USER_CONTEXT (400) before any other check."
        test_recipe:
          setup: ["Empty DB; the request is issued with the auth headers omitted."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Nh", email: "nh@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_USER_CONTEXT"
            - "response http status == 400"

      - name: diagnose_invalid_interval_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_INTERVAL]"]
        distinguishing_aspect: "POST diagnose with scheduled_end_at <= scheduled_start_at returns ERR_INVALID_INTERVAL (422)."
        test_recipe:
          setup: ["Ticket at INTAKE with a technician and a bay available."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Iv", email: "iv@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tiv", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BV" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 1000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
          trigger:
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T11:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_INTERVAL"

      - name: part_order_zero_quantity_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_QUANTITY]", "entities.PartOrder.fields.quantity"]
        distinguishing_aspect: "POST part-order with quantity 0 returns ERR_INVALID_QUANTITY — a zero-count boundary distinct from the repair-vs-replace and warranty boundaries."
        test_recipe:
          setup: ["Ticket diagnosed; a part exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Zq", email: "zq@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tzq", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BZ" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P1", name: "Screen", unit_price_cents: 6000, on_hand_qty: 10 }
              as: StoreManager
              captures: { part: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${part}", quantity: 0 }
              as: Technician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"

      - name: approve_estimate_exceeds_spend_cap_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_SPEND_CAP_EXCEEDED]"]
        distinguishing_aspect: "With the estimate in SENT state (state check passes), a provisional_total 20000 above spend_cap 5000 returns ERR_SPEND_CAP_EXCEEDED (402) as the winning fiscal error."
        test_recipe:
          setup: ["Ticket AWAITING_APPROVAL with a SENT estimate whose provisional_total 20000 exceeds spend_cap 5000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sc", email: "sc@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 40000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tsc", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BSC" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 5000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv: $.data.version }
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est: $.data.id }
          trigger:
            - call: "POST /repair-tickets/${tkt}/estimates/${est}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SPEND_CAP_EXCEEDED"
            - "response http status == 402"
            - "RepairTicket.${tkt}.status == AWAITING_APPROVAL"

      - name: restock_out_of_stock_returns_part_out_of_stock
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_PART_OUT_OF_STOCK]", "state_machines.PartOrder.REQUESTED_to_BACKORDERED"]
        distinguishing_aspect: "A part order created BACKORDERED (on_hand 0) cannot be restocked while available_qty (0) < quantity (1); returns ERR_PART_OUT_OF_STOCK."
        test_recipe:
          setup: ["Ticket diagnosed; part with on_hand 0; a part order qty1 that became BACKORDERED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Os", email: "os@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tos", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BOS" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /parts"
              payload: { sku: "P0", name: "Screen", unit_price_cents: 6000, on_hand_qty: 0 }
              as: StoreManager
              captures: { part: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-tickets/${tkt}/part-orders"
              payload: { part_id: "${part}", quantity: 1 }
              as: Technician
              as_user_id: "${tech}"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /part-orders/${po}/restock"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "PartOrder.${po}.status == BACKORDERED before restock"
            - "response error_id == ERR_PART_OUT_OF_STOCK"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: diagnose_twice_returns_409_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RepairTicket.INTAKE_to_DIAGNOSING", "errors[ERR_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "A second diagnose on a ticket already in DIAGNOSING (not INTAKE) returns ERR_TICKET_INVALID_STATE (409)."
        test_recipe:
          setup: ["Ticket already diagnosed (DIAGNOSING)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dt", email: "dt@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 1000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tdt", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BDT" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 1000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T13:00:00Z", scheduled_end_at: "2026-05-02T14:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TICKET_INVALID_STATE"

      - name: cancel_completed_ticket_from_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.RepairTicket.DIAGNOSING_to_CANCELLED", "errors[ERR_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a ticket already in the terminal COMPLETED state returns ERR_TICKET_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["Ticket completed (COMPLETED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ct", email: "ct@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 40000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tct", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /repair-bays"
              payload: { bay_name: "BCT" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /repair-tickets"
              payload: { device_id: "${dev}", customer_id: "${cust}", intake_channel: "WALK_IN", reported_issue: "x", spend_cap_cents: 100000 }
              as: ServiceAdvisor
              captures: { tkt: $.data.id }
            - call: "POST /repair-tickets/${tkt}/diagnose"
              payload: { assigned_technician_id: "${tech}", assigned_bay_id: "${bay}", scheduled_start_at: "2026-05-02T10:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Technician
              as_user_id: "${tech}"
              captures: { rtv: $.data.version }
            - call: "POST /repair-tickets/${tkt}/estimates"
              payload: { labor_hours: 2, expected_repair_ticket_version: "${rtv}" }
              as: Technician
              as_user_id: "${tech}"
              captures: { est: $.data.id }
            - call: "POST /repair-tickets/${tkt}/estimates/${est}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /repair-tickets/${tkt}/complete"
              payload: { actual_labor_hours: 2 }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /repair-tickets/${tkt}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TICKET_INVALID_STATE"
            - "RepairTicket.${tkt}.status == COMPLETED"

      - name: accept_trade_in_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.TradeIn.OFFER_MADE_to_ACCEPTED", "errors[ERR_TRADE_IN_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a trade-in still in SUBMITTED (no offer made) returns ERR_TRADE_IN_INVALID_STATE; store credit unchanged."
        test_recipe:
          setup: ["Trade-in SUBMITTED (no offer)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "At", email: "at@x.com", phone: "5" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "A", model: "m", serial_number: "s", market_value_cents: 50000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust}", device_id: "${dev}", declared_grade: "A" }
              as: ServiceAdvisor
              captures: { ti: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRADE_IN_INVALID_STATE"
            - "Customer.${cust}.store_credit_balance_cents == 0"

      - name: restock_reserved_part_order_returns_part_order_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.PartOrder.BACKORDERED_to_RESERVED", "errors[ERR_PART_ORDER_INVALID_STATE]"]
