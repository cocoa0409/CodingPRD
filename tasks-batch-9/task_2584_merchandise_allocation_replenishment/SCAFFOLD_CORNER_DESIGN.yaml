      - name: markdown_depth_tiers_at_every_lower_inclusive_edge
        claim_type: tiered_pricing
        grounds:
          - calculations.markdown_depth_bp
          - calculations.markdown_depth_bp.constants
          - entities.SizeProfile.fields.core_size_count
          - entities.AssortmentAction.fields.markdown_pct_bp
          - endpoints.POST /allocation/_run-assortment-detection
        distinguishing_aspect: |
          One sweep produces five actions whose broken ratios land exactly on the tier edges - 2500, 5000 and
          7500 - plus one deliberately below the first edge. Because the tiers are lower-inclusive and
          upper-exclusive, a strict-greater reading pushes each edge case down a tier and is caught three
          times. The ratio denominator is core_size_count, not size_count, which is why the 6-size curve
          (four core sizes, XS at 800bp and XXL at 300bp below the 1500bp core cut) gives 2500 rather than
          1666, and why a position missing ONLY its two non-core sizes stays COMPLETE and raises no action at
          all. The 5-size curve supplies the sub-tier case: one core size out of five is 2000bp of ratio, so
          the depth is 0 - present as an integer, not null, because null is reserved for CONSOLIDATION.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A), 0102(B), 0103(C) and 0104(D), all with a shelf plan in effect at the clock"
            - "Three size profiles, all APPAREL_TOP: TOP-4SZ (S 2000 / M 3500 / L 3000 / XL 1500, 4 core sizes), TOP-6SZ (XS 800 / S 2000 / M 3000 / L 2400 / XL 1500 / XXL 300, so size_count 6 but core_size_count 4) and TOP-5SZ (five sizes at 2000 each, 5 core sizes)"
            - "SKU-1001 is on TOP-4SZ, SKU-2001 on TOP-6SZ, SKU-3001 on TOP-5SZ; every profile keeps the default core_size_min_share_bp 1500"
            - "Positions of SKU-1001: 0101 holds M 4 / L 3 / XL 2 (S out), 0102 holds M 4 / L 3 (S and XL out), 0103 holds M 4 (S, L and XL out)"
            - "Positions of SKU-2001: 0103 holds XS 1 / M 2 / L 2 / XL 1 (core S out, non-core XXL out), 0104 holds S 2 / M 2 / L 2 / XL 1 (only the non-core XS and XXL out) on a 6-unit shelf"
            - "Position of SKU-3001: 0102 holds S 2 / M 2 / L 2 / XL 2 (only XXL out)"
            - "No position of any item is COMPLETE with enough headroom to be a consolidation target, so every raised action resolves to MARKDOWN"
            - "The logical clock is 2026-08-01T00:00:00Z"
