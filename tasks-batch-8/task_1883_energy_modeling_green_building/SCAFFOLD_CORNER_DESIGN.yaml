          setup: ["A DOCUMENTATION member exists"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_spec: $.data.id } }
          trigger:
            - { call: "POST /review-comments/00000000-0000-0000-0000-000000000000/respond", payload: { response_text: "x" }, as: DocumentationSpecialist, as_user_id: "${m_spec}", captures: { err: $.data.error_id } }
