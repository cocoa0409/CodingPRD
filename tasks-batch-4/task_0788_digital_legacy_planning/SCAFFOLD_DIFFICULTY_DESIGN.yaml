              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 1, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 50, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Two", relationship: "child", allocation_pct: 30, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Three", relationship: "child", allocation_pct: 20, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b3_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "APPROVE" }
              as: Deputy
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /legacy/release-requests/${rr_id}/grant"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Beneficiary.${b1_id}.allocated_value_cents == 5000"
            - "Beneficiary.${b2_id}.allocated_value_cents == 3000"
            - "Beneficiary.${b3_id}.allocated_value_cents == 1999"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: directive_revision_cycle
        grounds:
          - state_machines.Directive.ACTIVE_to_UNDER_REVISION
          - state_machines.Directive.UNDER_REVISION_to_ACTIVE
          - entities.Directive.fields.version_number
        distinguishing_aspect: |
          The Directive entity exhibits a cycle ACTIVE -> UNDER_REVISION -> ACTIVE on the same row
          (non-linear), returning to ACTIVE with version_number bumped to 2.
        test_recipe:
          setup:
            - "A plan with one MEDICAL directive activated (ACTIVE, plan version bumped to 2), then revised (UNDER_REVISION, version_number 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /legacy/directives"
              payload: { plan_id: "${plan_id}", directive_type: "MEDICAL", content: "v1" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /legacy/directives/${dir_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/directives/${dir_id}/revise"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "GET /legacy/plans/${plan_id}"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /legacy/directives/${dir_id}/activate"
              payload: { expected_plan_version: "${plan_v2}" }
              as: Owner
              as_user_id: "${plan_id}"
          assert:
            - "Directive.${dir_id}.status == ACTIVE"
            - "Directive.${dir_id}.version_number == 2"

      - name: release_request_verified_branch_to_denied
        grounds:
          - state_machines.ReleaseRequest.VERIFIED_to_APPROVED
          - state_machines.ReleaseRequest.VERIFIED_to_DENIED
          - entities.ReleaseRequest.fields.approval_count
        distinguishing_aspect: |
          The ReleaseRequest entity forks at VERIFIED into {APPROVED, DENIED} with divergent side effects;
          a single REJECT vote takes the DENIED branch (approval_count stays 0, no items released) — a
          different entity than the Directive cycle.
        test_recipe:
          setup:
            - "A deceased plan with one ACCEPTED deputy and a VERIFIED release request (required_approvals 1, approval_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ASSET"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "REJECT" }
              as: Deputy
              as_user_id: "${d1_id}"
          assert:
            - "ReleaseRequest.${rr_id}.status == DENIED"
            - "ReleaseRequest.${rr_id}.approval_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: grant_releases_item_then_vests_beneficiary_depth3
        grounds:
          - state_machines.ReleaseRequest.APPROVED_to_GRANTED
          - state_machines.VaultItem.SEALED_to_RELEASED
          - state_machines.Beneficiary.NOMINATED_to_VESTED
        distinguishing_aspect: |
          Depth-3 chain from the grant transition: ReleaseRequest.GRANTED -> VaultItem.RELEASED (caused by
          grant) -> Beneficiary.VESTED (caused by the item's release), each hop caused by the previous one.
        test_recipe:
          setup:
            - "Deceased plan, SEALED ASSET (gross 10000, liability 1, NET) with one linked NOMINATED beneficiary (100%), approved ON_DEATH release for scope ASSET."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ASSET"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 1, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 100, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "APPROVE" }
              as: Deputy
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /legacy/release-requests/${rr_id}/grant"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ReleaseRequest.${rr_id}.status == GRANTED"
            - "VaultItem.${item_id}.status == RELEASED"
            - "Beneficiary.${b1_id}.status == VESTED"
            - "Beneficiary.${b1_id}.allocated_value_cents == 9999"

      - name: deputy_revoke_denies_pending_request_depth2
        grounds:
          - state_machines.Deputy.ACCEPTED_to_REVOKED
          - state_machines.ReleaseRequest.PENDING_to_DENIED
          - entities.ReleaseRequest.fields.requested_by_deputy_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (deputy revoke): Deputy.REVOKED -> its PENDING
          ReleaseRequest is DENIED (caused by the revoke) — a distinct propagation pattern from the grant cascade.
        test_recipe:
          setup:
            - "Deceased plan with one ACCEPTED deputy who has filed a PENDING release request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
