# =============================================================================
# Task 1750: Building Energy Benchmarking & Disclosure Compliance
# City benchmarking ordinance: covered-building lists, whole-building data
# aggregation with tenant consent, annual filing deadlines with penalty
# accrual, third-party data verification with anomaly flags, energy-score
# computation and labeling, performance-standard trajectory fines,
# exemption/extension requests, and public disclosure publication.
# =============================================================================

scenario: |
  Building Energy Benchmarking & Disclosure Compliance (city benchmarking ordinance): covered-building list & jurisdiction thresholds, whole-building data aggregation & tenant consent, annual submission deadline & penalty tracking, data verification & anomaly flag, energy-score computation & label, performance-standard trajectory & fine exposure, exemption/extension request, public disclosure publication

domain_name: building-energy-benchmarking
api_prefix: /v1

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers        # coverage threshold, completeness >= 90, YoY > 25%, correction tolerance > 5%, owner restriction > 100000
    - cascading_side_effects         # usage void -> report recompute -> downgrade -> disclosure supersede -> new draft
    - derived_field_reconciliation   # report aggregates, owner outstanding_fines_cents, completeness recomputes
    - optimistic_concurrency         # OCC on Building.version and ReportingCycle.version
  entity_topology: flat              # peer entities joined by FK references; nested paths used only as creation context
  state_machine_shape: cyclic        # report FLAGGED->SUBMITTED revision loop; exemption DENIED->APPEALED->UNDER_REVIEW loop; plus branching terminals
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential               # UsageRecord.replaces_usage_record_id
  role_model: segregation_of_duties  # cycle creator may not certify reports in that cycle; verifier is a distinct entity-backed role
  consistency_model: immediate       # all side effects visible in the triggering request's response and subsequent reads

  entity_count: 14
  state_machine_count: 10
  calculation_count: 11
  endpoint_count: 63
  error_code_count: 32
  role_count: 5
  difficulty_note: |
    Deliberately at/above the Expert band ceiling. Difficulty is carried by
    dense, order-sensitive calculations (per-record rounding, pinned baseline
    evaluation order, dual-variant scoring and fine accrual), deep cyclic
    state machines with auto-transitions, and 3+-link cascade chains, not by
    CRUD volume.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Owner legal name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email" }
      - { name: standing, type: enum, source: computed, default: NORMAL, description: "NORMAL | RESTRICTED; RESTRICTED when outstanding_fines_cents > OWNER_RESTRICTION_THRESHOLD_CENTS (100000)", constraints: "NORMAL | RESTRICTED" }
      - { name: outstanding_fines_cents, type: integer, source: computed, default: 0, description: "Sum over this owner's buildings' FineAssessments: final_amount_cents when status == NOTICED, provisional_amount_cents when status == ASSESSED; PAID and WAIVED excluded" }

  - name: Verifier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Verifier name" }
      - { name: license_number, type: string, source: input, description: "Verifier license number", constraints: "unique across Verifier" }
      - { name: accredited, type: boolean, source: input, default: true, description: "Whether the verifier is currently accredited" }

  - name: ReportingCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_year, type: integer, source: input, description: "Calendar year whose usage is reported (coverage window [cycle_year-01-01, (cycle_year+1)-01-01) )", constraints: "unique" }
      - { name: filing_deadline_at, type: datetime, source: input, description: "Filing deadline; submissions with submitted_at <= filing_deadline_at are on time (lateness uses strict >)" }
      - { name: covered_floor_area_threshold_sqft, type: integer, source: input, description: "Buildings with gross_floor_area_sqft >= threshold are covered (inclusive)" }
      - { name: covered_property_types, type: array, source: input, description: "Property types covered by the ordinance for this cycle" }
      - { name: late_fine_daily_rate_cents, type: integer, source: input, description: "Per-calendar-day late filing fine rate" }
      - { name: late_fine_cap_days, type: integer, source: input, description: "Maximum chargeable late days (cap applied to days_late)" }
      - { name: non_compliance_fine_cents, type: integer, source: input, description: "Flat fine for a covered building with no VERIFIED/CERTIFIED report at close-filing" }
      - { name: data_completeness_min_pct, type: number, source: input, default: 90, description: "Minimum whole-building data completeness percent required to submit (inclusive >=)" }
      - { name: correction_tolerance_pct, type: number, source: input, default: 5, description: "Post-verification usage correction reopens the report only when EUI delta pct is strictly greater than this" }
      - { name: anomaly_yoy_threshold_pct, type: number, source: input, default: 25, description: "Auto-flag CONSUMPTION_SPIKE when YoY aggregated kBtu delta pct is strictly greater than this" }
      - { name: weather_adjustment_factor, type: number, source: input, default: 1.0, description: "Cycle-level weather normalization multiplier applied to site_eui for the WEATHER_NORMALIZED score variant" }
      - { name: performance_standards, type: array, source: input, description: "Array of per-property-type objects: { property_type, median_eui, score_slope, baseline_eui_default, annual_reduction_pct, shortfall_tolerance_pct, fine_rate_cents_per_sqft, performance_fine_cap_cents }" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | FILING_CLOSED | PUBLISHED", constraints: "SCHEDULED | OPEN | FILING_CLOSED | PUBLISHED" }
      - { name: created_by_officer_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the cycle (drives segregation-of-duties on certify)" }
      - { name: published_at, type: datetime, source: system, description: "When the cycle first reached PUBLISHED; null until then" }

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; set from X-User-ID when created by BuildingOwner, or from owner_id input when created by ComplianceOfficer" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: gross_floor_area_sqft, type: integer, source: input, description: "Gross floor area", constraints: "> 0" }
      - { name: property_type, type: enum, source: input, description: "Building property type", constraints: "OFFICE | MULTIFAMILY | RETAIL | HOTEL | INDUSTRIAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "ACTIVE | ARCHIVED" }

  - name: TenantUnit
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id" }
      - { name: unit_label, type: string, source: input, description: "Unit identifier within the building" }
      - { name: floor_area_sqft, type: integer, source: input, description: "Unit floor area", constraints: "> 0" }
      - { name: space_type, type: enum, source: input, description: "Space usage type", constraints: "OFFICE | RETAIL | RESIDENTIAL | COMMON | OTHER" }
      - { name: occupied, type: boolean, source: input, default: true, description: "Whether the unit is occupied" }

  - name: ConsentGrant
    parent: TenantUnit
    common_fields: true
    fields:
      - { name: tenant_unit_id, type: string, source: system, description: "FK -> TenantUnit.id" }
      - { name: scope, type: enum, source: system, default: WHOLE_BUILDING_AGGREGATION, description: "Consent scope; fixed WHOLE_BUILDING_AGGREGATION", constraints: "WHOLE_BUILDING_AGGREGATION" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED | REVOKED | EXPIRED", constraints: "REQUESTED | GRANTED | DENIED | REVOKED | EXPIRED" }
      - { name: valid_from, type: string, source: input, description: "Inclusive window start date (YYYY-MM-DD), set at grant time; closed-interval semantics" }
      - { name: valid_to, type: string, source: input, description: "Inclusive window end date (YYYY-MM-DD), set at grant time; closed-interval semantics" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of grant/deny decision; null while REQUESTED" }

  - name: UtilityAccount
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id" }
      - { name: account_number, type: string, source: input, description: "Utility account number", constraints: "unique per building_id" }
      - { name: commodity, type: enum, source: input, description: "Metered commodity", constraints: "ELECTRICITY | NATURAL_GAS | DISTRICT_STEAM | FUEL_OIL" }

  - name: UsageRecord
    parent: UtilityAccount
    common_fields: true
    fields:
      - { name: utility_account_id, type: string, source: system, description: "FK -> UtilityAccount.id" }
      - { name: period_start, type: datetime, source: input, description: "Half-open period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Half-open period end (exclusive); must be > period_start" }
      - { name: consumption_value, type: number, source: input, description: "Consumption in the account commodity's native unit (kWh, therm, klb, gallon)", constraints: "> 0" }
      - { name: commodity, type: enum, source: system, description: "Copied from UtilityAccount.commodity at creation" }
      - { name: kbtu, type: integer, source: computed, description: "consumption_value * COMMODITY_KBTU_FACTOR[commodity], rounded per-record to integer kBtu, round_half_up" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", constraints: "ACTIVE | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void; null while ACTIVE" }
      - { name: replaces_usage_record_id, type: string, source: system, description: "FK -> UsageRecord.id; set on the replacement record created by a void-with-replacement; null otherwise" }

  - name: BenchmarkReport
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FLAGGED | VERIFIED | CERTIFIED", constraints: "DRAFT | SUBMITTED | FLAGGED | VERIFIED | CERTIFIED" }
      - { name: revision_number, type: integer, source: system, default: 0, description: "Increments by 1 on every FLAGGED -> SUBMITTED resubmission" }
      - { name: aggregated_kbtu, type: integer, source: computed, description: "Sum of per-record kbtu for ACTIVE UsageRecords fully contained in the cycle year, across all of the building's accounts" }
      - { name: site_eui, type: number, source: computed, description: "aggregated_kbtu / gross_floor_area_sqft, 2 decimals round_half_up" }
      - { name: data_completeness_pct, type: number, source: computed, description: "100 * (common_area + consented unit area) / gross_floor_area_sqft, 2 decimals round_half_up" }
      - { name: score_as_reported, type: integer, source: computed, description: "1-100 score from site_eui; null until verification; suppressed to null when completeness < SCORE_MIN_COMPLETENESS_PCT (75)" }
      - { name: score_weather_normalized, type: integer, source: computed, description: "1-100 score from weather-normalized EUI variant; null until verification and suppressed together with score_as_reported" }
      - { name: label_grade, type: enum, source: computed, description: "A | B | C | D | E | INSUFFICIENT_DATA; null until verification", constraints: "A | B | C | D | E | INSUFFICIENT_DATA" }
      - { name: target_eui, type: number, source: computed, description: "Performance-standard trajectory target EUI computed at verification; null until then" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of the most recent successful submit; null before first submit" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp of verification sign-off; null until VERIFIED" }
      - { name: verified_site_eui, type: number, source: system, description: "Snapshot of site_eui frozen at sign-off; baseline for the post-verification correction tolerance check; null until VERIFIED" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "True exactly when days_late > 0 (so a submit inside the first 24h past the deadline is not late)" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "max(0, floor((submitted_at - effective_deadline_at) / 86400 seconds))" }

  - name: VerificationRecord
    parent: BenchmarkReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> BenchmarkReport.id" }
      - { name: verifier_id, type: string, source: input, description: "FK -> Verifier.id; assigned by the building owner" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED_OFF | REJECTED", constraints: "PENDING | SIGNED_OFF | REJECTED" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of sign-off or rejection; null while PENDING" }
      - { name: rejection_reason, type: string, source: system, description: "Reason given on reject; null otherwise" }

  - name: AnomalyFlag
    parent: BenchmarkReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> BenchmarkReport.id" }
      - { name: anomaly_type, type: enum, source: system, description: "CONSUMPTION_SPIKE (auto YoY) | VERIFICATION_REOPENED (auto post-verification correction) | VERIFICATION_FAILED (verifier reject) | MANUAL_REVIEW (officer)", constraints: "CONSUMPTION_SPIKE | VERIFICATION_REOPENED | VERIFICATION_FAILED | MANUAL_REVIEW" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | WAIVED", constraints: "OPEN | RESOLVED | WAIVED" }
      - { name: detail, type: string, source: system, description: "Human-readable detail (officer-provided for MANUAL_REVIEW, system-generated otherwise)" }
      - { name: resolution_note, type: string, source: system, description: "Owner-provided note recorded on resolve (>= 20 chars); null otherwise" }
      - { name: waive_reason, type: string, source: system, description: "Officer-provided reason recorded on waive; null otherwise" }

  - name: FineAssessment
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> ReportingCycle.id" }
      - { name: fine_type, type: enum, source: system, description: "LATE_SUBMISSION | NON_COMPLIANCE | PERFORMANCE_SHORTFALL", constraints: "LATE_SUBMISSION | NON_COMPLIANCE | PERFORMANCE_SHORTFALL" }
      - { name: status, type: enum, source: system, description: "ASSESSED | NOTICED | PAID | WAIVED", constraints: "ASSESSED | NOTICED | PAID | WAIVED" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Amount computed at assessment time (LATE_SUBMISSION: days_late-at-submit * daily rate; NON_COMPLIANCE / PERFORMANCE_SHORTFALL: full computed amount)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Authoritative amount recomputed at notice (LATE_SUBMISSION: days to verification-or-notice * daily rate, day-capped); null while ASSESSED" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "LATE_SUBMISSION: uncapped days late recorded at assessment; 0 for other types" }
      - { name: assessed_at, type: datetime, source: system, description: "Assessment timestamp" }
      - { name: noticed_at, type: datetime, source: system, description: "Notice timestamp; null while ASSESSED" }
      - { name: paid_at, type: datetime, source: system, description: "Payment timestamp; null until PAID" }
      - { name: waive_reason, type: string, source: system, description: "Reason on waive (AUTO_EXTENSION_APPROVED for the extension cascade); null otherwise" }

  - name: ExemptionRequest
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id (from path)" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id" }
      - { name: request_type, type: enum, source: input, description: "EXEMPTION (excluded from coverage for the cycle) | EXTENSION (filing deadline moved)", constraints: "EXEMPTION | EXTENSION" }
      - { name: reason, type: string, source: input, description: "Justification (>= 10 chars)" }
      - { name: requested_extension_days, type: integer, source: input, description: "Required when request_type == EXTENSION; 1..90; ignored otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | APPEALED | DENIED_FINAL", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | APPEALED | DENIED_FINAL" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "Set true when the owner appeals a DENIED request; a second DENIED decision becomes DENIED_FINAL" }
      - { name: decision_note, type: string, source: system, description: "Officer note recorded at decide; null until decided" }
      - { name: extended_deadline_at, type: datetime, source: computed, description: "Set on APPROVED EXTENSION: filing_deadline_at + requested_extension_days days; null otherwise" }

  - name: DisclosurePublication
    parent: ReportingCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> ReportingCycle.id" }
      - { name: publication_version, type: integer, source: system, description: "1 for the first publication of a cycle; supersede cascade creates the next DRAFT with version + 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", constraints: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: included_report_count, type: integer, source: computed, default: 0, description: "Count of reports in VERIFIED or CERTIFIED status for the cycle, frozen at publish time" }
      - { name: published_at, type: datetime, source: system, description: "Publish timestamp; null while DRAFT" }
      - { name: superseded_at, type: datetime, source: system, description: "Supersede timestamp; null until SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ReportingCycle
    initial_state: SCHEDULED
    terminal_states: [PUBLISHED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /v1/reporting-cycles/{id}/open"
        actor: ComplianceOfficer
        preconditions:
          - "Cycle is SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> OPEN"
      - from: OPEN
        to: FILING_CLOSED
        trigger: "POST /v1/reporting-cycles/{id}/close-filing"
        actor: ComplianceOfficer
        preconditions:
          - "Cycle is OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "current_utc > filing_deadline_at, strict comparison (ERR_CYCLE_NOT_CLOSABLE)"
        side_effects:
          - "status -> FILING_CLOSED"
          - "Cascade link 1: for every covered building (per coverage_determination) with no report in VERIFIED or CERTIFIED for this cycle, create a FineAssessment(fine_type=NON_COMPLIANCE, status=ASSESSED, provisional_amount_cents = non_compliance_fine_cents)"
          - "Cascade link 1: for every covered building WITH a report in VERIFIED or CERTIFIED, run performance_shortfall_fine; when the shortfall test trips, create FineAssessment(fine_type=PERFORMANCE_SHORTFALL, status=ASSESSED)"
          - "Cascade link 2: each created fine recomputes owner_fine_exposure for the building's owner; owner.standing flips to RESTRICTED when outstanding_fines_cents crosses above OWNER_RESTRICTION_THRESHOLD_CENTS"
      - from: FILING_CLOSED
        to: PUBLISHED
        trigger: "system (side effect of POST /v1/disclosure-publications/{id}/publish on this cycle's DRAFT publication)"
        actor: system
        preconditions:
          - "A DisclosurePublication of this cycle just transitioned DRAFT -> PUBLISHED"
        side_effects:
          - "status -> PUBLISHED; published_at set"

  - entity: Building
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /v1/buildings/{id}/archive"
        actor: ComplianceOfficer
        preconditions:
          - "Building is ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "No FineAssessment for this building in ASSESSED or NOTICED (ERR_OPEN_FINES_EXIST)"
          - "No BenchmarkReport for this building in DRAFT, SUBMITTED, or FLAGGED (ERR_OPEN_REPORTS_EXIST)"
        side_effects:
          - "status -> ARCHIVED"

  - entity: ConsentGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /v1/consent-grants/{id}/grant"
        actor: TenantRep
        preconditions:
          - "Grant is REQUESTED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller is the tenant of this unit: X-User-ID == tenant_unit_id (ERR_NOT_RESOURCE_OWNER)"
          - "valid_from <= valid_to as dates (ERR_INVALID_DATE_RANGE)"
          - "Closed-interval overlap: no other GRANTED grant on the same unit with [valid_from, valid_to] intersecting the new window; two closed intervals overlap iff new.valid_from <= existing.valid_to AND existing.valid_from <= new.valid_to (ERR_CONSENT_WINDOW_OVERLAP)"
        side_effects:
          - "status -> GRANTED; decided_at set"
          - "Recompute data_completeness_pct on the building's reports in DRAFT, FLAGGED, or SUBMITTED for cycles whose year the window covers"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /v1/consent-grants/{id}/deny"
        actor: TenantRep
        preconditions:
          - "Grant is REQUESTED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller is the tenant of this unit (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status -> DENIED; decided_at set"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /v1/consent-grants/{id}/revoke"
        actor: TenantRep
        preconditions:
          - "Grant is GRANTED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller is the tenant of this unit (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status -> REVOKED"
          - "Recompute data_completeness_pct on ALL of the building's reports for affected cycles regardless of status (DRAFT, FLAGGED, SUBMITTED, VERIFIED, CERTIFIED)"
          - "Cascade: for VERIFIED or CERTIFIED reports whose recomputed completeness < SCORE_MIN_COMPLETENESS_PCT (75): score_as_reported = null, score_weather_normalized = null, label_grade = INSUFFICIENT_DATA (status unchanged); if such a report is included in a PUBLISHED DisclosurePublication, that publication -> SUPERSEDED and a replacement DRAFT with publication_version + 1 is created"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (lazy: when current_utc's date > valid_to, evaluated on grant reads and on completeness recomputation; no background job)"
        actor: system
        preconditions:
          - "current date strictly greater than valid_to"
        side_effects:
          - "status reads as EXPIRED and the grant is excluded from data_completeness_ratio"

  - entity: UsageRecord
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /v1/usage-records/{id}/void"
        actor: UtilityAgent
        preconditions:
          - "Record is ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "If any replacement_* field is present, all three must be present (ERR_INVALID_REQUEST)"
          - "Replacement period must satisfy period_start < period_end (ERR_INVALID_DATE_RANGE) and the half-open overlap rule against other ACTIVE records of the same account, excluding the record being voided (ERR_USAGE_PERIOD_OVERLAP)"
        side_effects:
          - "status -> VOIDED; void_reason recorded"
          - "If replacement fields given: create a new ACTIVE UsageRecord on the same account with replaces_usage_record_id = this record's id and its own computed kbtu"
          - "Cascade link 1: recompute aggregated_kbtu, site_eui on the building's report for the matching cycle year (any status); reports in DRAFT or FLAGGED recompute data_completeness_pct as well"
          - "Cascade link 2 (only when report is VERIFIED or CERTIFIED): run correction_delta_evaluation; if eui delta pct > correction_tolerance_pct: report -> FLAGGED and an AnomalyFlag(VERIFICATION_REOPENED, OPEN) is created"
          - "Cascade link 3: if that report was included in a PUBLISHED DisclosurePublication, the publication -> SUPERSEDED and a replacement DRAFT with publication_version + 1 is created"

  - entity: BenchmarkReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/benchmark-reports/{id}/submit"
        actor: BuildingOwner
        preconditions:
          - "Report is DRAFT or FLAGGED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller owns the building (ERR_NOT_RESOURCE_OWNER)"
          - "Cycle is OPEN (ERR_FILING_CLOSED when FILING_CLOSED or PUBLISHED; ERR_CYCLE_NOT_OPEN when SCHEDULED)"
          - "No AnomalyFlag with status OPEN on this report (ERR_OPEN_ANOMALIES_EXIST)"
          - "data_completeness_pct >= cycle.data_completeness_min_pct, inclusive (ERR_DATA_COMPLETENESS_BELOW_THRESHOLD)"
          - "Building's owner standing != RESTRICTED (ERR_OWNER_RESTRICTED)"
        side_effects:
          - "status -> SUBMITTED; submitted_at = current_utc"
          - "Recompute aggregated_kbtu, site_eui, data_completeness_pct at submit time"
          - "is_late and days_late computed against the effective deadline (approved EXTENSION's extended_deadline_at wins over cycle.filing_deadline_at)"
          - "If days_late > 0: create FineAssessment(LATE_SUBMISSION, ASSESSED, provisional per late_submission_fine provisional variant) and recompute owner_fine_exposure; when days_late == 0 no fine is created"
          - "Run yoy_anomaly_detection; on trip (and no CONSUMPTION_SPIKE flag has ever existed on this report): create AnomalyFlag(CONSUMPTION_SPIKE, OPEN) and report -> FLAGGED (the submit still succeeds; the response shows FLAGGED)"
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /v1/benchmark-reports/{id}/submit"
        actor: BuildingOwner
        preconditions:
          - "Same as DRAFT -> SUBMITTED"
        side_effects:
          - "Same as DRAFT -> SUBMITTED, plus revision_number += 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "system (side effect of POST /v1/verification-records/{id}/sign-off on this report's PENDING record)"
        actor: system
        preconditions:
          - "Report is SUBMITTED (ERR_INVALID_STATE_TRANSITION on the sign-off call)"
          - "Cycle performance_standards contains an entry for the building's property_type (ERR_STANDARD_NOT_DEFINED)"
        side_effects:
          - "status -> VERIFIED; verified_at = current_utc; verified_site_eui = site_eui snapshot"
          - "Recompute aggregated_kbtu, site_eui, data_completeness_pct at verification time, then compute and store score_as_reported, score_weather_normalized, label_grade (energy_score_labeling) and target_eui (trajectory_target_eui)"
      - from: VERIFIED
        to: CERTIFIED
        trigger: "POST /v1/benchmark-reports/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "Report is VERIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "Cycle status is OPEN or FILING_CLOSED (ERR_INVALID_STATE_TRANSITION)"
          - "Segregation of duties: X-User-ID != cycle.created_by_officer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> CERTIFIED"
      - from: SUBMITTED
        to: FLAGGED
        trigger: "system (YoY anomaly trip at submit) | POST /v1/verification-records/{id}/reject | POST /v1/benchmark-reports/{id}/anomaly-flags"
        actor: "system | DataVerifier | ComplianceOfficer"
        preconditions:
          - "Report is SUBMITTED (officer flag also allowed from VERIFIED or CERTIFIED)"
        side_effects:
          - "status -> FLAGGED"
          - "AnomalyFlag(OPEN) created with the matching anomaly_type"
      - from: VERIFIED
        to: FLAGGED
        trigger: "system (usage-void correction cascade, delta > tolerance) | POST /v1/benchmark-reports/{id}/anomaly-flags"
        actor: "system | ComplianceOfficer"
        preconditions: []
        side_effects:
          - "status -> FLAGGED; AnomalyFlag(OPEN) created"
          - "If the report is included in a PUBLISHED DisclosurePublication: publication -> SUPERSEDED and replacement DRAFT created"
      - from: CERTIFIED
        to: FLAGGED
        trigger: "system (usage-void correction cascade, delta > tolerance) | POST /v1/benchmark-reports/{id}/anomaly-flags"
        actor: "system | ComplianceOfficer"
        preconditions: []
        side_effects:
          - "status -> FLAGGED; AnomalyFlag(OPEN) created"
          - "If the report is included in a PUBLISHED DisclosurePublication: publication -> SUPERSEDED and replacement DRAFT created"

  - entity: VerificationRecord
    initial_state: PENDING
    terminal_states: [SIGNED_OFF, REJECTED]
    transitions:
      - from: PENDING
        to: SIGNED_OFF
        trigger: "POST /v1/verification-records/{id}/sign-off"
        actor: DataVerifier
        preconditions:
          - "Record is PENDING (ERR_INVALID_STATE_TRANSITION)"
          - "Caller is the assigned verifier: X-User-ID == verifier_id (ERR_NOT_RESOURCE_OWNER)"
          - "Report is SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
          - "Cycle performance_standards covers the building's property_type (ERR_STANDARD_NOT_DEFINED)"
        side_effects:
          - "status -> SIGNED_OFF; decided_at set"
          - "Report -> VERIFIED with the verification-time computations (see BenchmarkReport SUBMITTED -> VERIFIED)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /v1/verification-records/{id}/reject"
        actor: DataVerifier
        preconditions:
          - "Record is PENDING (ERR_INVALID_STATE_TRANSITION)"
          - "Caller is the assigned verifier (ERR_NOT_RESOURCE_OWNER)"
          - "rejection_reason present, >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> REJECTED; decided_at, rejection_reason recorded"
          - "Report -> FLAGGED; AnomalyFlag(VERIFICATION_FAILED, OPEN) created"

  - entity: AnomalyFlag
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /v1/anomaly-flags/{id}/resolve"
        actor: BuildingOwner
        preconditions:
          - "Flag is OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "Caller owns the report's building (ERR_NOT_RESOURCE_OWNER)"
          - "resolution_note present, >= 20 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> RESOLVED; resolution_note recorded"
      - from: OPEN
        to: WAIVED
        trigger: "POST /v1/anomaly-flags/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "Flag is OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "waive_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> WAIVED; waive_reason recorded"

  - entity: FineAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: NOTICED
        trigger: "POST /v1/fine-assessments/{id}/notice"
        actor: ComplianceOfficer
        preconditions:
          - "Fine is ASSESSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> NOTICED; noticed_at set"
          - "final_amount_cents computed (late_submission_fine FINAL variant; other types copy provisional_amount_cents)"
          - "Recompute owner_fine_exposure for the building's owner"
      - from: NOTICED
        to: PAID
        trigger: "POST /v1/fine-assessments/{id}/pay"
        actor: BuildingOwner
        preconditions:
          - "Fine is NOTICED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller owns the fine's building (ERR_NOT_RESOURCE_OWNER)"
          - "paid_amount_cents == final_amount_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "status -> PAID; paid_at set"
          - "Recompute owner_fine_exposure (may flip standing RESTRICTED -> NORMAL at/below threshold)"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /v1/fine-assessments/{id}/waive | system (EXTENSION approval cascade, waive_reason=AUTO_EXTENSION_APPROVED)"
        actor: "ComplianceOfficer | system"
        preconditions:
          - "Fine is ASSESSED or NOTICED (ERR_INVALID_STATE_TRANSITION)"
          - "Manual waive requires waive_reason (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> WAIVED; waive_reason recorded"
          - "Recompute owner_fine_exposure"
      - from: NOTICED
        to: WAIVED
        trigger: "POST /v1/fine-assessments/{id}/waive | system (EXTENSION approval cascade)"
        actor: "ComplianceOfficer | system"
        preconditions:
          - "Fine is ASSESSED or NOTICED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> WAIVED; waive_reason recorded"
          - "Recompute owner_fine_exposure"

  - entity: ExemptionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED_FINAL]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /v1/exemption-requests/{id}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "Request is SUBMITTED or APPEALED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> UNDER_REVIEW"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /v1/exemption-requests/{id}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "Request is SUBMITTED or APPEALED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/exemption-requests/{id}/decide with decision=APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_INVALID_STATE_TRANSITION)"
          - "decision in {APPROVED, DENIED} (ERR_INVALID_REQUEST)"
          - "EXTENSION: no other APPROVED EXTENSION exists for the same building+cycle (ERR_EXTENSION_ALREADY_GRANTED)"
        side_effects:
          - "status -> APPROVED; decision_note recorded"
          - "EXEMPTION: building excluded from coverage_determination for this cycle"
          - "EXTENSION: extended_deadline_at = cycle.filing_deadline_at + requested_extension_days days; cascade: every LATE_SUBMISSION fine for this building+cycle in ASSESSED or NOTICED -> WAIVED with waive_reason=AUTO_EXTENSION_APPROVED, then owner_fine_exposure recomputed"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /v1/exemption-requests/{id}/decide with decision=DENIED and appeal_used == false"
        actor: ComplianceOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> DENIED; decision_note recorded"
      - from: UNDER_REVIEW
        to: DENIED_FINAL
        trigger: "POST /v1/exemption-requests/{id}/decide with decision=DENIED and appeal_used == true"
        actor: ComplianceOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> DENIED_FINAL (terminal); decision_note recorded"
      - from: DENIED
        to: APPEALED
        trigger: "POST /v1/exemption-requests/{id}/appeal"
        actor: BuildingOwner
        preconditions:
          - "Request is DENIED (ERR_INVALID_STATE_TRANSITION)"
          - "Caller owns the building (ERR_NOT_RESOURCE_OWNER)"
          - "appeal_used == false (ERR_INVALID_STATE_TRANSITION)"
          - "appeal_note present, >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> APPEALED; appeal_used = true"

  - entity: DisclosurePublication
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /v1/disclosure-publications/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "Publication is DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "Cycle status is FILING_CLOSED or PUBLISHED (ERR_CYCLE_NOT_CLOSED)"
        side_effects:
          - "status -> PUBLISHED; published_at set"
          - "included_report_count = count of the cycle's reports in VERIFIED or CERTIFIED, frozen"
          - "If cycle is FILING_CLOSED: cycle -> PUBLISHED (published_at set)"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (an included report dropped to FLAGGED via correction cascade, or an included VERIFIED/CERTIFIED report's label was suppressed via consent-revoke cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED; superseded_at set"
          - "A replacement DisclosurePublication(status=DRAFT, publication_version = this version + 1) is created for the same cycle"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: building-update-stale-version
    parent_entity: Building
    write_endpoint: "PATCH /v1/buildings/{id}"
    occ_field: expected_building_version
    description: |
      Updating a Building whose version has advanced since the client last
      observed it is rejected. A prior successful PATCH (or any cascade that
      mutated the building) has already incremented version, so the stale
      writer's expected_building_version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cycle-update-stale-version
    parent_entity: ReportingCycle
    write_endpoint: "PATCH /v1/reporting-cycles/{id}"
    occ_field: expected_cycle_version
    description: |
      Updating a ReportingCycle whose version has advanced since the client
      last observed it is rejected; mid-cycle configuration edits must
      acknowledge the version they build on so threshold/rate changes are
      never based on a stale read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: coverage_determination
    description: "Whether a building is on the covered-building list for a cycle"
    trigger: "GET /v1/buildings?covered_in_cycle_id=..., GET /v1/buildings/{id}/compliance-summary, POST /v1/benchmark-reports, close-filing sweep"
    algorithm: threshold
    formula: |
      covered(building, cycle) =
          building.status == ACTIVE
          AND building.gross_floor_area_sqft >= cycle.covered_floor_area_threshold_sqft   # inclusive
          AND building.property_type IN cycle.covered_property_types
          AND NOT EXISTS ExemptionRequest(building_id=building.id, cycle_id=cycle.id,
                                          request_type=EXEMPTION, status=APPROVED)
    input_set: "The building, the cycle, and APPROVED EXEMPTION requests for the pair"
    constants:
      COVERAGE_COMPARATOR: ">="
    precision: "integer sqft comparison, exact"

  - name: whole_building_kbtu_aggregation
    description: "Whole-building weather-unadjusted energy total for a cycle year"
    trigger: "report create, report submit, usage-record create, usage-record void (any replacement), consent-affecting recompute does NOT change kBtu"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode b): convert-then-round PER RECORD, then sum.
      # Never sum raw consumption first.
      included = UsageRecords r where
          r.utility_account_id IN accounts_of(building)
          AND r.status == ACTIVE
          AND r.period_start >= datetime(cycle.cycle_year, 1, 1)            # fully contained
          AND r.period_end   <= datetime(cycle.cycle_year + 1, 1, 1)        # straddling records excluded entirely
      for each r:  r.kbtu = round_half_up(r.consumption_value * COMMODITY_KBTU_FACTOR[r.commodity], 0)
      aggregated_kbtu = sum(r.kbtu)
    input_set: "ACTIVE UsageRecords of all UtilityAccounts of the building whose half-open period is fully contained in [cycle_year-01-01T00:00:00Z, (cycle_year+1)-01-01T00:00:00Z); VOIDED and straddling records excluded"
    constants:
      COMMODITY_KBTU_FACTOR: { ELECTRICITY: 3.412, NATURAL_GAS: 100, DISTRICT_STEAM: 1194, FUEL_OIL: 138.5 }
    precision: "per-record integer kBtu, round_half_up; sum of integers"

  - name: site_eui
    description: "Site energy use intensity"
    trigger: "whenever aggregated_kbtu is recomputed"
    algorithm: aggregation
    formula: |
      site_eui = round_half_up(aggregated_kbtu / building.gross_floor_area_sqft, 2)
    input_set: "The report's aggregated_kbtu and the building's current gross_floor_area_sqft"
    precision: "2 decimals, round_half_up"

  - name: data_completeness_ratio
    description: "Share of gross floor area backed by tenant consent (or owner-controlled common area)"
    trigger: "report create, report submit, verification sign-off, consent grant, consent revoke, tenant-unit floor-area patch, and lazily on report GET when a consent's window has newly lapsed (expiry re-evaluated against the logical clock)"
    algorithm: aggregation
    formula: |
      unit_area_total   = sum(floor_area_sqft of all TenantUnits of the building)
      common_area_sqft  = max(gross_floor_area_sqft - unit_area_total, 0)   # owner-controlled, always counted
      consented_sqft    = sum(floor_area_sqft of TenantUnits having at least one ConsentGrant
                              with status == GRANTED (lazy EXPIRED applied)
                              AND valid_from <= date(cycle.cycle_year, 1, 1)
                              AND valid_to   >= date(cycle.cycle_year, 12, 31))   # window must cover the whole cycle year, closed dates
      data_completeness_pct = round_half_up(100 * (common_area_sqft + consented_sqft) / gross_floor_area_sqft, 2)
    input_set: "TenantUnits of the building; ConsentGrants per unit (GRANTED, non-expired, window covering the cycle year)"
    precision: "2 decimals, round_half_up"

  - name: energy_score_labeling
    description: "1-100 energy score and A-E label; computed at verification sign-off"
    trigger: "verification sign-off (BenchmarkReport SUBMITTED -> VERIFIED)"
    algorithm: weighted_scoring
    formula: |
      std = cycle.performance_standards entry matching building.property_type   # missing -> ERR_STANDARD_NOT_DEFINED
      # Mode (a): >= 3 inputs with non-linear interaction (conditional branch + nested clamp + band lookup)
      if data_completeness_pct < SCORE_MIN_COMPLETENESS_PCT:
          score_as_reported = null; score_weather_normalized = null; label_grade = INSUFFICIENT_DATA
      else:
          raw            = SCORE_BASE + (std.median_eui - site_eui) * std.score_slope
          score_as_reported = clamp(round_half_up(raw, 0), SCORE_MIN, SCORE_MAX)
          normalized_eui = round_half_up(site_eui * cycle.weather_adjustment_factor, 2)
          raw_wn         = SCORE_BASE + (std.median_eui - normalized_eui) * std.score_slope
          score_weather_normalized = clamp(round_half_up(raw_wn, 0), SCORE_MIN, SCORE_MAX)
          label_grade    = A if score_as_reported >= 90 else B if >= 75 else C if >= 50 else D if >= 25 else E
      # Label ALWAYS follows the AS_REPORTED variant.
    input_set: "report site_eui, report data_completeness_pct, cycle.performance_standards entry, cycle.weather_adjustment_factor"
    constants:
      SCORE_BASE: 50
      SCORE_MIN: 1
      SCORE_MAX: 100
      SCORE_MIN_COMPLETENESS_PCT: 75
      LABEL_BANDS: { A: ">= 90", B: ">= 75", C: ">= 50", D: ">= 25", E: ">= 1" }
    precision: "score integer round_half_up then clamp; EUI intermediates 2 decimals round_half_up"
    variants:
      - name: as_reported
        when: "always computed; drives label_grade and disclosure"
        difference: "uses raw site_eui"
      - name: weather_normalized
        when: "always computed alongside; published on disclosure for context"
        difference: "uses site_eui * cycle.weather_adjustment_factor; identical inputs produce a different score whenever weather_adjustment_factor != 1.0"

  - name: trajectory_target_eui
    description: "Performance-standard trajectory target for the report's cycle"
    trigger: "verification sign-off (stored as report.target_eui); read again at close-filing for performance_shortfall_fine"
    algorithm: constraint_propagation
    formula: |
      # Mode (c): circular-looking dependency, PINNED evaluation order.
      # A report's target may depend on earlier verified reports of the same building,
      # but never on the current report itself. Evaluate strictly in this order:
      # (1) baseline selection: among this building's reports with status VERIFIED or
      #     CERTIFIED belonging to cycles with cycle_year < current cycle_year, pick the
      #     one with the LOWEST cycle_year; tie-break by report.created_at ASC.
      #     baseline_eui = that report's verified_site_eui; baseline_year = its cycle_year.
      # (2) if no such report exists: baseline_eui = std.baseline_eui_default and
      #     years_elapsed is pinned to 1 (default baseline is treated as one year back).
      # (3) years_elapsed = cycle.cycle_year - baseline_year when (1) applied.
      # (4) target_eui = round_half_up(baseline_eui * (1 - std.annual_reduction_pct/100)^years_elapsed, 2)
      # (5) only now read the current report's site_eui for any shortfall comparison.
      std = cycle.performance_standards entry matching building.property_type
    input_set: "building's VERIFIED|CERTIFIED reports in strictly earlier cycles; cycle performance_standards entry"
    precision: "2 decimals, round_half_up"

  - name: performance_shortfall_fine
    description: "Fine for missing the trajectory target at close-filing"
    trigger: "close-filing sweep, for each covered building whose report is VERIFIED or CERTIFIED"
    algorithm: threshold
    formula: |
      std = cycle.performance_standards entry matching building.property_type   # missing -> building skipped, no fine
      target = report.target_eui   # computed at verification
      threshold_eui = round_half_up(target * (1 + std.shortfall_tolerance_pct/100), 2)   # rounded FIRST, then compared
      if site_eui_now > threshold_eui:                                         # strict >; at exactly the threshold no fine
          shortfall_pct = round_half_up((site_eui_now - threshold_eui) / target * 100, 2)
          fine_cents    = min(round_half_up(building.gross_floor_area_sqft * std.fine_rate_cents_per_sqft * shortfall_pct, 0),
                              std.performance_fine_cap_cents)
          create FineAssessment(PERFORMANCE_SHORTFALL, ASSESSED, provisional_amount_cents = fine_cents)
      # site_eui_now = the report's CURRENT stored site_eui (post any corrections)
    input_set: "covered buildings of the cycle with a VERIFIED or CERTIFIED report"
    precision: "shortfall_pct 2 decimals round_half_up BEFORE the money multiply; fine integer cents round_half_up; cap applied last"

  - name: late_submission_fine
    description: "Late filing penalty with provisional (assessment-time) and final (notice-time) variants"
    trigger: "provisional: successful submit with is_late == true; final: fine notice"
    algorithm: chronological
    formula: |
      effective_deadline = exemption.extended_deadline_at if an APPROVED EXTENSION exists for (building, cycle)
                           else cycle.filing_deadline_at
      days_late = max(0, floor((submitted_at - effective_deadline) / 86400 seconds))
      # PROVISIONAL (at assessment, i.e. at submit):
      provisional_amount_cents = min(days_late, cycle.late_fine_cap_days) * cycle.late_fine_daily_rate_cents
      # FINAL (at notice):
      final_days = max(0, floor((coalesce(report.verified_at, fine.noticed_at) - effective_deadline) / 86400))
      final_amount_cents = min(final_days, cycle.late_fine_cap_days) * cycle.late_fine_daily_rate_cents
    input_set: "the late report, its cycle, any APPROVED EXTENSION for the pair"
    precision: "integer cents; day counts by whole 86400-second floors"
    variants:
      - name: provisional
        when: "computed when the LATE_SUBMISSION FineAssessment is created at submit"
        difference: "measures days from deadline to SUBMISSION; frozen on the fine"
      - name: final
        when: "computed when the fine is NOTICED"
        difference: "measures days from deadline to VERIFICATION (or to notice if still unverified); identical inputs produce a larger amount whenever verification lands after submission"

  - name: yoy_anomaly_detection
    description: "Automatic consumption-spike anomaly check at submit"
    trigger: "successful submit (after aggregates recompute)"
    algorithm: threshold
    formula: |
      prior = this building's report with status VERIFIED or CERTIFIED in the cycle with the
              largest cycle_year < current cycle_year; ties impossible (one report per building+cycle)
      if prior exists AND prior.aggregated_kbtu > 0:
          delta_pct = round_half_up(abs(current.aggregated_kbtu - prior.aggregated_kbtu) / prior.aggregated_kbtu * 100, 2)
          if delta_pct > cycle.anomaly_yoy_threshold_pct            # strict >; exactly at threshold does NOT flag
              AND no AnomalyFlag(anomaly_type=CONSUMPTION_SPIKE) has ever existed on this report:
              create AnomalyFlag(CONSUMPTION_SPIKE, OPEN); report -> FLAGGED
    input_set: "current report aggregates; the building's most recent prior-cycle VERIFIED|CERTIFIED report"
    precision: "2 decimals, round_half_up"

  - name: correction_delta_evaluation
    description: "Post-verification correction tolerance check"
    trigger: "usage-record void (with or without replacement) when the building's report for that cycle year is VERIFIED or CERTIFIED"
    algorithm: threshold
    formula: |
      delta_pct = round_half_up(abs(new_site_eui - report.verified_site_eui) / report.verified_site_eui * 100, 2)
      if delta_pct > cycle.correction_tolerance_pct:                 # strict >; exactly at tolerance does NOT reopen
          report -> FLAGGED; create AnomalyFlag(VERIFICATION_REOPENED, OPEN)
          if report included in a PUBLISHED DisclosurePublication:
              publication -> SUPERSEDED; create replacement DRAFT with publication_version + 1
    input_set: "the affected report and its cycle"
    precision: "2 decimals, round_half_up; uses the ROUNDED stored site_eui values on both sides"

  - name: owner_fine_exposure
    description: "Owner standing and the two exposure reads on compliance-summary"
    trigger: "fine creation, notice, pay, waive (incl. auto-waive cascade)"
    algorithm: aggregation
    formula: |
      outstanding_fines_cents(owner) =
          sum over FineAssessments f of buildings owned by owner:
              f.final_amount_cents        when f.status == NOTICED
              f.provisional_amount_cents  when f.status == ASSESSED
              0                           when f.status IN {PAID, WAIVED}
      owner.standing = RESTRICTED when outstanding_fines_cents > OWNER_RESTRICTION_THRESHOLD_CENTS else NORMAL   # strict >; exactly at threshold stays NORMAL
      compliance-summary exposes:
          settled_exposure_cents   = sum(final_amount_cents over NOTICED fines)                       # enforceable now
          projected_exposure_cents = settled_exposure_cents + sum(provisional_amount_cents over ASSESSED fines)   # worst case
    input_set: "FineAssessments of all buildings owned by the owner"
    constants:
      OWNER_RESTRICTION_THRESHOLD_CENTS: 100000
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
# Priority order: auth(1) -> role(2) -> ownership(3) -> existence(4) -> OCC(5)
# -> input semantics(6) -> state(7) -> temporal(8) -> safety/compliance(9)
# -> constraint(10) -> fiscal(11). A request failing several checks reports the
# LOWEST-priority-number error.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The caller's role must be listed in the endpoint's roles (Any = any authenticated role, reads only)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: BuildingOwner must own the building acted on (Owner.id == X-User-ID); TenantRep must act on own unit (X-User-ID == tenant_unit_id); DataVerifier must be the assigned verifier (X-User-ID == verifier_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner/tenant/verifier-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources must exist, validated left-to-right (building, cycle, unit, grant, account, usage record, report, verification record, anomaly flag, fine, exemption request, publication)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /v1/buildings/{id}, PATCH /v1/reporting-cycles/{id}"
    note: "Version check runs after existence, before all business logic"
  - priority: 6
    category: business_constraint
    check: "Input semantics: required fields present; enums valid; integers positive; valid_from <= valid_to; period_start < period_end; requested_extension_days in 1..90 for EXTENSION; rejection_reason >= 10 chars; resolution_note >= 20 chars; exemption reason >= 10 chars"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 7
    category: state
    check: "State-machine from-state preconditions for the requested transition (report submittable, cycle SCHEDULED for open, fine payable, grant actionable, record ACTIVE, etc.)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_temporal
    check: "Cycle/deadline gates: report create requires cycle OPEN (ERR_CYCLE_NOT_OPEN); submit requires cycle OPEN (ERR_FILING_CLOSED once closed/published); close-filing requires current_utc > filing_deadline_at (ERR_CYCLE_NOT_CLOSABLE); cycle PATCH only while SCHEDULED or OPEN (ERR_CYCLE_NOT_EDITABLE); publication create requires cycle FILING_CLOSED or PUBLISHED (ERR_CYCLE_NOT_CLOSED)"
    error_id: "ERR_CYCLE_NOT_OPEN / ERR_FILING_CLOSED / ERR_CYCLE_NOT_CLOSABLE / ERR_CYCLE_NOT_EDITABLE / ERR_CYCLE_NOT_CLOSED"
    http_status: 409
    applies_to: "cycle-gated endpoints"
  - priority: 9
    category: business_safety
    check: "Compliance gates: certify requires X-User-ID != cycle.created_by_officer_id (ERR_SEGREGATION_OF_DUTIES); submit requires zero OPEN anomaly flags (ERR_OPEN_ANOMALIES_EXIST); at most one PENDING VerificationRecord per report (ERR_VERIFIER_ALREADY_ASSIGNED); EXEMPTION request requires no report in SUBMITTED/VERIFIED/CERTIFIED for the cycle (ERR_REPORT_ALREADY_FILED)"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_OPEN_ANOMALIES_EXIST / ERR_VERIFIER_ALREADY_ASSIGNED / ERR_REPORT_ALREADY_FILED"
    http_status: 403
    applies_to: "submit, certify, verification-record create, exemption create"
    note: "ERR_SEGREGATION_OF_DUTIES is 403; ERR_OPEN_ANOMALIES_EXIST, ERR_VERIFIER_ALREADY_ASSIGNED, ERR_REPORT_ALREADY_FILED are 409"
  - priority: 10
    category: business_constraint
    check: "Constraint gates: completeness >= cycle minimum (ERR_DATA_COMPLETENESS_BELOW_THRESHOLD); consent closed-interval overlap (ERR_CONSENT_WINDOW_OVERLAP); usage half-open overlap per account (ERR_USAGE_PERIOD_OVERLAP); one report per building+cycle (ERR_DUPLICATE_REPORT); account_number unique per building (ERR_DUPLICATE_ACCOUNT); at most one REQUESTED consent per unit (ERR_CONSENT_REQUEST_OPEN); at most one open (SUBMITTED/UNDER_REVIEW/APPEALED) exemption request per building+cycle (ERR_EXEMPTION_REQUEST_OPEN); at most one APPROVED EXTENSION per building+cycle (ERR_EXTENSION_ALREADY_GRANTED); building covered for cycle (ERR_BUILDING_NOT_COVERED); performance standard defined for property type (ERR_STANDARD_NOT_DEFINED); no existing DRAFT publication for cycle (ERR_DRAFT_PUBLICATION_EXISTS); archive guards (ERR_OPEN_FINES_EXIST, ERR_OPEN_REPORTS_EXIST)"
    error_id: "ERR_DATA_COMPLETENESS_BELOW_THRESHOLD / ERR_CONSENT_WINDOW_OVERLAP / ERR_USAGE_PERIOD_OVERLAP / ERR_DUPLICATE_REPORT / ERR_DUPLICATE_ACCOUNT / ERR_CONSENT_REQUEST_OPEN / ERR_EXEMPTION_REQUEST_OPEN / ERR_EXTENSION_ALREADY_GRANTED / ERR_BUILDING_NOT_COVERED / ERR_STANDARD_NOT_DEFINED / ERR_DRAFT_PUBLICATION_EXISTS / ERR_OPEN_FINES_EXIST / ERR_OPEN_REPORTS_EXIST"
    http_status: 409
    applies_to: "constraint-bearing endpoints"
    note: "ERR_DATA_COMPLETENESS_BELOW_THRESHOLD, ERR_BUILDING_NOT_COVERED, ERR_STANDARD_NOT_DEFINED are 422; the rest are 409"
  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: submit blocked while owner standing == RESTRICTED (ERR_OWNER_RESTRICTED); fine payment requires paid_amount_cents == final_amount_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
    error_id: "ERR_OWNER_RESTRICTED / ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 403
    applies_to: "submit, fine pay"
    note: "ERR_OWNER_RESTRICTED is 403; ERR_PAYMENT_AMOUNT_MISMATCH is 422"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Registry ---
  - method: POST
    path: "/v1/owners"
    description: "Register a building owner"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, contact_email]
    output: Owner
    side_effects: ["standing=NORMAL, outstanding_fines_cents=0"]

  - method: GET
    path: "/v1/owners/{id}"
    description: "Get an owner (standing, outstanding_fines_cents)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: POST
    path: "/v1/verifiers"
    description: "Register an accredited data verifier"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, license_number, "accredited?"]
    output: Verifier
    side_effects: []

  - method: GET
    path: "/v1/verifiers/{id}"
    description: "Get a verifier"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Verifier
    side_effects: []

  # --- Reporting cycles ---
  - method: POST
    path: "/v1/reporting-cycles"
    description: "Create a reporting cycle with its thresholds, fine rates, and per-property-type performance standards"
    roles: [ComplianceOfficer]
    code: 201
    input: [cycle_year, filing_deadline_at, covered_floor_area_threshold_sqft, covered_property_types, late_fine_daily_rate_cents, late_fine_cap_days, non_compliance_fine_cents, performance_standards, "data_completeness_min_pct?", "correction_tolerance_pct?", "anomaly_yoy_threshold_pct?", "weather_adjustment_factor?"]
    output: ReportingCycle
    side_effects: ["status=SCHEDULED; created_by_officer_id := X-User-ID"]

  - method: GET
    path: "/v1/reporting-cycles/{id}"
    description: "Get a reporting cycle"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ReportingCycle
    side_effects: []

  - method: PATCH
    path: "/v1/reporting-cycles/{id}"
    description: "Edit cycle configuration while SCHEDULED or OPEN (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_cycle_version, "filing_deadline_at?", "late_fine_daily_rate_cents?", "late_fine_cap_days?", "non_compliance_fine_cents?", "weather_adjustment_factor?", "performance_standards?", "data_completeness_min_pct?", "correction_tolerance_pct?", "anomaly_yoy_threshold_pct?"]
    output: ReportingCycle
    side_effects: ["increments ReportingCycle.version by 1"]

  - method: POST
    path: "/v1/reporting-cycles/{id}/open"
    description: "Open a cycle for filings (SCHEDULED -> OPEN)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReportingCycle
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/v1/reporting-cycles/{id}/close-filing"
    description: "Close filing once current_utc is strictly past the deadline; sweeps NON_COMPLIANCE and PERFORMANCE_SHORTFALL fines and recomputes owner standing"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReportingCycle
    side_effects:
      - "status -> FILING_CLOSED"
      - "Creates NON_COMPLIANCE fines for covered buildings lacking a VERIFIED|CERTIFIED report"
      - "Runs performance_shortfall_fine for covered buildings with a VERIFIED|CERTIFIED report"
      - "Each fine creation recomputes owner_fine_exposure (owner may flip to RESTRICTED)"

  # --- Buildings ---
  - method: POST
    path: "/v1/buildings"
    description: "Register a building; owner_id taken from X-User-ID for BuildingOwner, required in body for ComplianceOfficer"
    roles: [BuildingOwner, ComplianceOfficer]
    code: 201
    input: [address, gross_floor_area_sqft, property_type, "owner_id?"]
    output: Building
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/buildings/{id}"
    description: "Get a building"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: GET
    path: "/v1/buildings"
    description: "List buildings; covered_in_cycle_id applies coverage_determination for that cycle (the covered-building list)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["owner_id?", "property_type?", "covered_in_cycle_id?", "limit?", "offset?"]
    output: "Building[]"
    side_effects: []

  - method: PATCH
    path: "/v1/buildings/{id}"
    description: "Update building attributes (OCC-guarded)"
    roles: [BuildingOwner, ComplianceOfficer]
    code: 200
    input: [expected_building_version, "address?", "gross_floor_area_sqft?", "property_type?"]
    output: Building
    side_effects: ["increments Building.version by 1", "recomputes site_eui on the building's DRAFT|FLAGGED reports when gross_floor_area_sqft changes"]

  - method: POST
    path: "/v1/buildings/{id}/archive"
    description: "Archive a building (guarded by open fines/reports)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Building
    side_effects: ["status -> ARCHIVED"]

  - method: GET
    path: "/v1/buildings/{id}/compliance-summary"
    description: "Computed per-cycle compliance read: coverage, report status, fine exposure (settled vs projected), latest score/label, effective deadline"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: [cycle_id]
    output: "{ covered: boolean, report_status: string|null, outstanding_fines_cents: integer, settled_exposure_cents: integer, projected_exposure_cents: integer, latest_score_as_reported: integer|null, latest_label_grade: string|null, effective_deadline_at: string }"
    side_effects: []

  # --- Tenant units ---
  - method: POST
    path: "/v1/buildings/{id}/tenant-units"
    description: "Add a tenant unit to an owned building"
    roles: [BuildingOwner]
    code: 201
    input: [unit_label, floor_area_sqft, space_type, "occupied?"]
    output: TenantUnit
    side_effects: []

  - method: GET
    path: "/v1/tenant-units"
    description: "List tenant units (filterable by building_id)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["building_id?", "limit?", "offset?"]
    output: "TenantUnit[]"
    side_effects: []

  - method: GET
    path: "/v1/tenant-units/{id}"
    description: "Get a tenant unit"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: TenantUnit
    side_effects: []

  - method: PATCH
    path: "/v1/tenant-units/{id}"
    description: "Update a unit's floor area or occupancy; recomputes completeness on the building's DRAFT|FLAGGED reports"
    roles: [BuildingOwner]
    code: 200
    input: ["floor_area_sqft?", "occupied?"]
    output: TenantUnit
    side_effects: ["recomputes data_completeness_pct on affected DRAFT|FLAGGED reports"]

  # --- Consent grants ---
  - method: POST
    path: "/v1/tenant-units/{id}/consent-grants"
    description: "Owner requests whole-building-aggregation consent for a unit (creates REQUESTED grant)"
    roles: [BuildingOwner]
    code: 201
    input: []
    output: ConsentGrant
    side_effects: ["status=REQUESTED"]

  - method: POST
    path: "/v1/consent-grants/{id}/grant"
    description: "Tenant grants consent with a closed [valid_from, valid_to] window; overlapping GRANTED windows on the unit are rejected"
    roles: [TenantRep]
    code: 200
    input: [valid_from, valid_to]
    output: ConsentGrant
    side_effects: ["status -> GRANTED; decided_at set; completeness recompute on affected reports"]

  - method: POST
    path: "/v1/consent-grants/{id}/deny"
    description: "Tenant denies a consent request"
    roles: [TenantRep]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: ["status -> DENIED; decided_at set"]

  - method: POST
    path: "/v1/consent-grants/{id}/revoke"
    description: "Tenant revokes a granted consent; recomputes completeness and may suppress scores on VERIFIED|CERTIFIED reports"
    roles: [TenantRep]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: ["status -> REVOKED; completeness recompute; score suppression + disclosure supersede cascade when completeness < 75 on a verified report"]

  - method: GET
    path: "/v1/consent-grants"
    description: "List consent grants (filterable by tenant_unit_id, status); lazy expiry applied"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["tenant_unit_id?", "status?", "limit?", "offset?"]
    output: "ConsentGrant[]"
    side_effects: []

  - method: GET
    path: "/v1/consent-grants/{id}"
    description: "Get a consent grant; lazy expiry applied"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: []

  # --- Utility accounts ---
  - method: POST
    path: "/v1/buildings/{id}/utility-accounts"
    description: "Register a utility account on a building"
    roles: [BuildingOwner, ComplianceOfficer]
    code: 201
    input: [account_number, commodity]
    output: UtilityAccount
    side_effects: []

  - method: GET
    path: "/v1/utility-accounts"
    description: "List utility accounts (filterable by building_id, commodity)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["building_id?", "commodity?", "limit?", "offset?"]
    output: "UtilityAccount[]"
    side_effects: []

  - method: GET
    path: "/v1/utility-accounts/{id}"
    description: "Get a utility account"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: UtilityAccount
    side_effects: []

  # --- Usage records ---
  - method: POST
    path: "/v1/utility-accounts/{id}/usage-records"
    description: "Upload a usage record; half-open [period_start, period_end) overlap against ACTIVE records of the same account is rejected; kbtu computed per record"
    roles: [UtilityAgent]
    code: 201
    input: [period_start, period_end, consumption_value]
    output: UsageRecord
    side_effects: ["kbtu computed (per-record rounding)", "recomputes aggregated_kbtu/site_eui on the building's DRAFT|FLAGGED report for the matching cycle year"]

  - method: POST
    path: "/v1/usage-records/{id}/void"
    description: "Void a usage record, optionally with an atomic replacement (correction); drives the post-verification correction cascade"
    roles: [UtilityAgent]
    code: 200
    input: [reason, "replacement_period_start?", "replacement_period_end?", "replacement_consumption_value?"]
    output: UsageRecord
    side_effects:
      - "status -> VOIDED; void_reason recorded"
      - "Optional replacement UsageRecord created ACTIVE with replaces_usage_record_id set"
      - "Recompute cascade on the building's report; VERIFIED|CERTIFIED reports with EUI delta > tolerance -> FLAGGED + VERIFICATION_REOPENED anomaly + disclosure supersede"

  - method: GET
    path: "/v1/usage-records"
    description: "List usage records (filterable by utility_account_id, status, replaces_usage_record_id)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["utility_account_id?", "status?", "replaces_usage_record_id?", "limit?", "offset?"]
    output: "UsageRecord[]"
    side_effects: []

  - method: GET
    path: "/v1/usage-records/{id}"
    description: "Get a usage record"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  # --- Benchmark reports ---
  - method: POST
    path: "/v1/benchmark-reports"
    description: "Create a DRAFT benchmark report for a covered building and an OPEN cycle (one per building+cycle)"
    roles: [BuildingOwner]
    code: 201
    input: [building_id, cycle_id]
    output: BenchmarkReport
    side_effects: ["status=DRAFT", "computes aggregated_kbtu, site_eui, data_completeness_pct"]

  - method: GET
    path: "/v1/benchmark-reports/{id}"
    description: "Get a benchmark report"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects: []

  - method: GET
    path: "/v1/benchmark-reports"
    description: "List benchmark reports (filterable by building_id, cycle_id, status)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["building_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: "BenchmarkReport[]"
    side_effects: []

  - method: POST
    path: "/v1/benchmark-reports/{id}/submit"
    description: "Submit a DRAFT or FLAGGED report; computes lateness, accrues the provisional late fine, runs the YoY anomaly auto-check"
    roles: [BuildingOwner]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects:
      - "status -> SUBMITTED (or FLAGGED when the YoY auto-check trips); submitted_at set; revision_number += 1 when resubmitting from FLAGGED"
      - "is_late / days_late computed against the effective deadline"
      - "LATE_SUBMISSION FineAssessment (ASSESSED, provisional) created when is_late; owner exposure recomputed"
      - "YoY anomaly auto-check may create AnomalyFlag(CONSUMPTION_SPIKE, OPEN)"

  - method: POST
    path: "/v1/benchmark-reports/{id}/certify"
    description: "Officer certifies a VERIFIED report; forbidden for the officer who created the cycle (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects: ["status -> CERTIFIED"]

  # --- Verification records ---
  - method: POST
    path: "/v1/benchmark-reports/{id}/verification-records"
    description: "Owner assigns a verifier to a SUBMITTED report (at most one PENDING record per report)"
    roles: [BuildingOwner]
    code: 201
    input: [verifier_id]
    output: VerificationRecord
    side_effects: ["status=PENDING"]

  - method: POST
    path: "/v1/verification-records/{id}/sign-off"
    description: "Assigned verifier signs off; report becomes VERIFIED and scores/label/target are computed"
    roles: [DataVerifier]
    code: 200
    input: []
    output: VerificationRecord
    side_effects: ["status -> SIGNED_OFF; decided_at set", "report -> VERIFIED; score_as_reported, score_weather_normalized, label_grade, target_eui computed; verified_at and verified_site_eui set"]

  - method: POST
    path: "/v1/verification-records/{id}/reject"
    description: "Assigned verifier rejects; report falls to FLAGGED with a VERIFICATION_FAILED anomaly"
    roles: [DataVerifier]
    code: 200
    input: [rejection_reason]
    output: VerificationRecord
    side_effects: ["status -> REJECTED; decided_at set", "report -> FLAGGED; AnomalyFlag(VERIFICATION_FAILED, OPEN) created"]

  - method: GET
    path: "/v1/verification-records"
    description: "List verification records (filterable by report_id, verifier_id)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["report_id?", "verifier_id?", "limit?", "offset?"]
    output: "VerificationRecord[]"
    side_effects: []

  - method: GET
    path: "/v1/verification-records/{id}"
    description: "Get a verification record"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: VerificationRecord
    side_effects: []

  # --- Anomaly flags ---
  - method: POST
    path: "/v1/benchmark-reports/{id}/anomaly-flags"
    description: "Officer raises a MANUAL_REVIEW anomaly on a SUBMITTED, VERIFIED, or CERTIFIED report; the report falls to FLAGGED"
    roles: [ComplianceOfficer]
    code: 201
    input: [detail]
    output: AnomalyFlag
    side_effects: ["AnomalyFlag(MANUAL_REVIEW, OPEN)", "report -> FLAGGED (from SUBMITTED, VERIFIED, or CERTIFIED)", "disclosure supersede cascade when a PUBLISHED publication included the report"]

  - method: GET
    path: "/v1/anomaly-flags"
    description: "List anomaly flags (filterable by report_id, status)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["report_id?", "status?", "limit?", "offset?"]
    output: "AnomalyFlag[]"
    side_effects: []

  - method: GET
    path: "/v1/anomaly-flags/{id}"
    description: "Get an anomaly flag"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AnomalyFlag
    side_effects: []

  - method: POST
    path: "/v1/anomaly-flags/{id}/resolve"
    description: "Owner resolves an OPEN anomaly (report must be FLAGGED)"
    roles: [BuildingOwner]
    code: 200
    input: [resolution_note]
    output: AnomalyFlag
    side_effects: ["status -> RESOLVED; resolution_note recorded"]

  - method: POST
    path: "/v1/anomaly-flags/{id}/waive"
    description: "Officer waives an OPEN anomaly"
    roles: [ComplianceOfficer]
    code: 200
    input: [waive_reason]
    output: AnomalyFlag
    side_effects: ["status -> WAIVED; waive_reason recorded"]

  # --- Fine assessments ---
  - method: GET
    path: "/v1/fine-assessments"
    description: "List fine assessments (filterable by building_id, cycle_id, status, fine_type)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["building_id?", "cycle_id?", "status?", "fine_type?", "limit?", "offset?"]
    output: "FineAssessment[]"
    side_effects: []

  - method: GET
    path: "/v1/fine-assessments/{id}"
    description: "Get a fine assessment"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: FineAssessment
    side_effects: []

  - method: POST
    path: "/v1/fine-assessments/{id}/notice"
    description: "Issue notice on an ASSESSED fine; computes the FINAL variant amount"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FineAssessment
    side_effects: ["status -> NOTICED; noticed_at set; final_amount_cents computed", "owner exposure recomputed"]

  - method: POST
    path: "/v1/fine-assessments/{id}/pay"
    description: "Owner pays a NOTICED fine; amount must equal final_amount_cents exactly"
    roles: [BuildingOwner]
    code: 200
    input: [paid_amount_cents]
    output: FineAssessment
    side_effects: ["status -> PAID; paid_at set", "owner exposure recomputed (standing may flip back to NORMAL)"]

  - method: POST
    path: "/v1/fine-assessments/{id}/waive"
    description: "Officer waives an ASSESSED or NOTICED fine"
    roles: [ComplianceOfficer]
    code: 200
    input: [waive_reason]
    output: FineAssessment
    side_effects: ["status -> WAIVED; waive_reason recorded", "owner exposure recomputed"]

  # --- Exemption requests ---
  - method: POST
    path: "/v1/buildings/{id}/exemption-requests"
    description: "Owner files an EXEMPTION or EXTENSION request for a building+cycle"
    roles: [BuildingOwner]
    code: 201
    input: [cycle_id, request_type, reason, "requested_extension_days?"]
    output: ExemptionRequest
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/v1/exemption-requests"
    description: "List exemption requests (filterable by building_id, cycle_id, status)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["building_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: "ExemptionRequest[]"
    side_effects: []

  - method: GET
    path: "/v1/exemption-requests/{id}"
    description: "Get an exemption request"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionRequest
    side_effects: []

  - method: POST
    path: "/v1/exemption-requests/{id}/start-review"
    description: "Officer starts (or restarts after appeal) review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionRequest
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/v1/exemption-requests/{id}/decide"
    description: "Officer decides an UNDER_REVIEW request; DENIED becomes DENIED_FINAL when the appeal was already used"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, decision_note]
    output: ExemptionRequest
    side_effects:
      - "status -> APPROVED | DENIED | DENIED_FINAL"
      - "EXEMPTION approval excludes the building from coverage for the cycle"
      - "EXTENSION approval sets extended_deadline_at and auto-waives ASSESSED|NOTICED LATE_SUBMISSION fines for the pair (AUTO_EXTENSION_APPROVED), recomputing owner exposure"

  - method: POST
    path: "/v1/exemption-requests/{id}/appeal"
    description: "Owner appeals a DENIED request (once only)"
    roles: [BuildingOwner]
    code: 200
    input: [appeal_note]
    output: ExemptionRequest
    side_effects: ["status -> APPEALED; appeal_used = true"]

  # --- Disclosure publications ---
  - method: POST
    path: "/v1/reporting-cycles/{id}/disclosure-publications"
    description: "Create a DRAFT disclosure publication for a cycle whose filing is closed (one DRAFT at a time)"
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: DisclosurePublication
    side_effects: ["status=DRAFT; publication_version = max(existing versions for cycle) + 1, or 1"]

  - method: POST
    path: "/v1/disclosure-publications/{id}/publish"
    description: "Publish a DRAFT publication; freezes included_report_count and moves the cycle FILING_CLOSED -> PUBLISHED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisclosurePublication
    side_effects: ["status -> PUBLISHED; published_at set; included_report_count frozen", "cycle FILING_CLOSED -> PUBLISHED"]

  - method: GET
    path: "/v1/disclosure-publications"
    description: "List disclosure publications (filterable by cycle_id, status)"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: "DisclosurePublication[]"
    side_effects: []

  - method: GET
    path: "/v1/disclosure-publications/{id}"
    description: "Get a disclosure publication"
    roles: [BuildingOwner, TenantRep, DataVerifier, UtilityAgent, ComplianceOfficer]
    code: 200
    input: []
    output: DisclosurePublication
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all deadline, expiry, and window rules read this clock."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; lazy consent expiry is evaluated against this clock on subsequent reads/recomputes"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's role list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed identity mismatch: BuildingOwner does not own the building, TenantRep is not the consent's unit, or DataVerifier is not the record's assigned verifier" }

  # --- Existence / input ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive number, string length violation, or partial replacement_* field set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "valid_from > valid_to (consent) or period_start >= period_end (usage)" }

  # --- State / concurrency ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource's current state does not allow the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }

  # --- Temporal / cycle gates ---
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Report creation requires the cycle to be OPEN (cycle is SCHEDULED)" }
  - { id: ERR_FILING_CLOSED, http: 409, condition: "Submission requires the cycle to be OPEN; filing is closed or the cycle is published" }
  - { id: ERR_CYCLE_NOT_CLOSABLE, http: 409, condition: "close-filing requires current_utc strictly greater than filing_deadline_at" }
  - { id: ERR_CYCLE_NOT_EDITABLE, http: 409, condition: "Cycle configuration may only be patched while SCHEDULED or OPEN" }
  - { id: ERR_CYCLE_NOT_CLOSED, http: 409, condition: "Disclosure publication create/publish requires the cycle to be FILING_CLOSED (or PUBLISHED for republication)" }

  # --- Safety / compliance ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certify forbidden for the ComplianceOfficer whose X-User-ID created the cycle" }
  - { id: ERR_OPEN_ANOMALIES_EXIST, http: 409, condition: "Submit requires zero AnomalyFlags with status OPEN on the report" }
  - { id: ERR_VERIFIER_ALREADY_ASSIGNED, http: 409, condition: "A PENDING VerificationRecord already exists for this report" }
  - { id: ERR_REPORT_ALREADY_FILED, http: 409, condition: "EXEMPTION request blocked: a report in SUBMITTED, VERIFIED, or CERTIFIED already exists for the building+cycle" }

  # --- Constraints ---
  - { id: ERR_DATA_COMPLETENESS_BELOW_THRESHOLD, http: 422, condition: "data_completeness_pct < cycle.data_completeness_min_pct at submit" }
  - { id: ERR_CONSENT_WINDOW_OVERLAP, http: 409, condition: "New GRANTED consent window (closed dates) intersects an existing GRANTED window on the same unit" }
  - { id: ERR_USAGE_PERIOD_OVERLAP, http: 409, condition: "New usage period (half-open) intersects an ACTIVE record on the same account" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A BenchmarkReport already exists for this building_id + cycle_id" }
  - { id: ERR_DUPLICATE_ACCOUNT, http: 409, condition: "account_number already exists on this building" }
  - { id: ERR_CONSENT_REQUEST_OPEN, http: 409, condition: "A REQUESTED consent grant already exists for this unit" }
  - { id: ERR_EXEMPTION_REQUEST_OPEN, http: 409, condition: "An exemption request in SUBMITTED, UNDER_REVIEW, or APPEALED already exists for this building+cycle" }
  - { id: ERR_EXTENSION_ALREADY_GRANTED, http: 409, condition: "An APPROVED EXTENSION already exists for this building+cycle" }
  - { id: ERR_BUILDING_NOT_COVERED, http: 422, condition: "Building is not on the covered list for the cycle (below threshold, property type not covered, archived, or exempted)" }
  - { id: ERR_STANDARD_NOT_DEFINED, http: 422, condition: "Cycle performance_standards has no entry for the building's property_type (required at verification)" }
  - { id: ERR_DRAFT_PUBLICATION_EXISTS, http: 409, condition: "A DRAFT DisclosurePublication already exists for this cycle" }
  - { id: ERR_OPEN_FINES_EXIST, http: 409, condition: "Building archive blocked by fines in ASSESSED or NOTICED" }
  - { id: ERR_OPEN_REPORTS_EXIST, http: 409, condition: "Building archive blocked by reports in DRAFT, SUBMITTED, or FLAGGED" }

  # --- Fiscal ---
  - { id: ERR_OWNER_RESTRICTED, http: 403, condition: "Owner standing is RESTRICTED (outstanding fines above threshold); new submissions blocked" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "paid_amount_cents must equal final_amount_cents exactly" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: BuildingOwner
    description: "Registered building owner; manages own buildings, units, accounts, reports, consent requests, fines, exemption requests"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /v1/tenant-units (via /v1/buildings/{id}/tenant-units) — add unit to own building"
      - "PATCH /v1/tenant-units/{id} — update own building's unit"
      - "POST /v1/tenant-units/{id}/consent-grants — request consent"
      - "POST /v1/benchmark-reports — create report for own building"
      - "POST /v1/benchmark-reports/{id}/submit — submit own report"
      - "POST /v1/benchmark-reports/{id}/verification-records — assign verifier"
      - "POST /v1/anomaly-flags/{id}/resolve — resolve anomaly on own report"
      - "POST /v1/fine-assessments/{id}/pay — pay own fine"
      - "POST /v1/buildings/{id}/exemption-requests — file exemption/extension"
      - "POST /v1/exemption-requests/{id}/appeal — appeal a denial"
    shared_operations:
      - "POST /v1/buildings — create building (shared with ComplianceOfficer; owner_id self-assigned)"
      - "PATCH /v1/buildings/{id} — update own building (shared with ComplianceOfficer)"
      - "POST /v1/buildings/{id}/utility-accounts — register account (shared with ComplianceOfficer)"
      - "All GET endpoints (open read surface)"

  - name: TenantRep
    description: "Tenant representative of a single unit; decides consent for that unit"
    identity: "entity_backed:TenantUnit"
    exclusive_operations:
      - "POST /v1/consent-grants/{id}/grant — grant consent (own unit only)"
      - "POST /v1/consent-grants/{id}/deny — deny consent (own unit only)"
      - "POST /v1/consent-grants/{id}/revoke — revoke consent (own unit only)"
    shared_operations:
      - "All GET endpoints (open read surface)"

  - name: DataVerifier
    description: "Accredited third-party verifier; signs off or rejects assigned verification records"
    identity: "entity_backed:Verifier"
    exclusive_operations:
      - "POST /v1/verification-records/{id}/sign-off — sign off assigned record"
      - "POST /v1/verification-records/{id}/reject — reject assigned record"
    shared_operations:
      - "All GET endpoints (open read surface)"

  - name: UtilityAgent
    description: "Utility data feed operator; uploads and corrects usage records (city-authorized, not tied to a persisted entity)"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/utility-accounts/{id}/usage-records — upload usage"
      - "POST /v1/usage-records/{id}/void — void/correct usage"
    shared_operations:
      - "All GET endpoints (open read surface)"

  - name: ComplianceOfficer
    description: "City compliance officer; administers registry, cycles, anomalies, fines, exemptions, disclosure, certification, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/owners, POST /v1/verifiers — registry"
      - "POST /v1/reporting-cycles, PATCH /v1/reporting-cycles/{id}, POST .../open, POST .../close-filing — cycle administration"
      - "POST /v1/buildings/{id}/archive — archive buildings"
      - "POST /v1/benchmark-reports/{id}/certify — certify VERIFIED reports (segregated from cycle creator)"
      - "POST /v1/benchmark-reports/{id}/anomaly-flags, POST /v1/anomaly-flags/{id}/waive — anomaly administration"
      - "POST /v1/fine-assessments/{id}/notice, POST /v1/fine-assessments/{id}/waive — fine administration"
      - "POST /v1/exemption-requests/{id}/start-review, POST /v1/exemption-requests/{id}/decide — exemption adjudication"
      - "POST /v1/reporting-cycles/{id}/disclosure-publications, POST /v1/disclosure-publications/{id}/publish — disclosure"
      - "POST /v1/_clock/set_current_utc — logical clock"
    shared_operations:
      - "POST /v1/buildings — create building for an owner (owner_id required)"
      - "PATCH /v1/buildings/{id}, POST /v1/buildings/{id}/utility-accounts — shared with BuildingOwner"
      - "All GET endpoints (open read surface)"
