            - "${e_nurse_reviews} == 'ERR_UNAUTHORIZED' with HTTP 403 — the reporter cannot open the review of her own event"
            - "${e_nurse_closes} == 'ERR_UNAUTHORIZED' — nor close it, so no single actor spans report and disposition"
            - "${e_md_reports} == 'ERR_UNAUTHORIZED' — the split is symmetric: governance cannot record a bedside event either"
            - "${ae1_reviewing} == 'UNDER_REVIEW' and ${ae1_closed} == 'CLOSED' with ${ae1_v3} == 3 — the two refused nurse calls left the version untouched"
