# =============================================================================
# SCAFFOLD.yaml — Driveway Sealcoating & Asphalt Maintenance Service
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Driveway Sealcoating & Asphalt Maintenance Service (sealcoating contractor):
  site measurement & condition assessment (crack/pothole), service scope
  (crack fill/patch/seal) & pricing per square foot, weather window & cure time
  scheduling, material selection & application rate, vehicle displacement &
  access coordination, striping & marking for commercial lots, warranty &
  re-application cycle, route density & seasonal capacity.

domain_name: driveway-sealcoating
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing      # weather windows, cure windows, access-block intervals
  secondary_archetype: pricing_engine        # tiered per-sqft pricing, multi-scope quotes, surcharge
  complexity_layers:
    - optimistic_concurrency                 # OCC on Property.version (quote supersede) and WorkOrder.version (reschedule)
    - cascading_side_effects                 # weather-snapshot hold cascade; completion cascade; cancel compensation
    - dual_variant_calculation               # provisional vs final pricing; projected vs realized utilization
    - rate_threshold_triggers                # tiered rates, ADA stall tiers, reorder thresholds, weather thresholds
  entity_topology: flat                      # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: parallel              # WorkOrder carries execution × billing × striping dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # warranty claim investigator cannot approve the same claim
  consistency_model: immediate               # every mutation is atomic and visible in its response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer full name or company name" }
      - { name: customer_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: address, type: string, source: input, description: "Site street address" }
      - { name: lot_kind, type: enum, source: input, description: "RESIDENTIAL_DRIVEWAY | COMMERCIAL_LOT" }
      - { name: current_area_sqft, type: number, source: computed, description: "Area from the property's latest SUBMITTED SiteAssessment; null until one exists" }
      - { name: open_quote_id, type: string, source: computed, description: "Id of the property's single non-terminal Quote (DRAFT, SENT, or REVISION_REQUESTED); null when none" }
      - { name: last_completed_seal_on, type: datetime, source: computed, description: "Completion timestamp of the most recent COMPLETED seal WorkOrder (include_seal=true, warranty_claim_id null); null until one completes" }
      - { name: next_seal_eligible_on, type: datetime, source: computed, description: "last_completed_seal_on + that job's material reapplication_months; null until a seal completes" }

  - name: SiteAssessment
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; assessed property" }
      - { name: measured_area_sqft, type: number, source: input, description: "Measured sealable area; must be > 0" }
      - { name: crack_linear_ft, type: number, source: input, description: "Total linear feet of cracks; >= 0" }
      - { name: pothole_count, type: integer, source: input, description: "Number of potholes; >= 0" }
      - { name: pothole_area_sqft, type: number, source: input, description: "Combined pothole surface area; >= 0" }
      - { name: oil_spot_area_sqft, type: number, source: input, description: "Oil-contaminated area needing primer; >= 0" }
      - { name: slope_severity, type: enum, source: input, description: "NONE | MODERATE | STEEP" }
      - { name: pavement_condition_index, type: integer, source: computed, description: "0-100 condition score per calculations.pavement_condition_index" }
      - { name: submitted_at, type: datetime, source: system, description: "Set when transitions DRAFT -> SUBMITTED; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SUPERSEDED | EXPIRED" }

  - name: Material
    parent: null
    common_fields: true
    fields:
      - { name: product_name, type: string, source: input, description: "Sealer product name" }
      - { name: grade, type: enum, source: input, description: "STANDARD | PREMIUM | ECO; drives grade price factor" }
      - { name: coverage_sqft_per_gallon, type: number, source: input, description: "Coverage rate used by material_gallons_required; > 0" }
      - { name: min_apply_temp_f, type: number, source: input, description: "Minimum ambient temperature (F) for application" }
      - { name: max_precip_probability_pct, type: integer, source: input, description: "Maximum allowed forecast precipitation probability, 0-100" }
      - { name: cure_hours_vehicle, type: integer, source: input, description: "Base vehicle-traffic cure hours; > 0" }
      - { name: reapplication_months, type: integer, source: input, description: "Months before the same property may be re-sealed; > 0" }
      - { name: warranty_months, type: integer, source: input, description: "Base warranty months granted on completion; > 0" }
      - { name: price_per_gallon_cents, type: integer, source: input, description: "Material unit cost used in the price-floor check; > 0" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; product stocked in this lot" }
      - { name: delivered_gallons, type: number, source: input, description: "Gallons delivered into the lot; > 0" }
      - { name: reserved_gallons, type: number, source: computed, default: 0, description: "Sum of reservations held by WorkOrders in SCHEDULED/WEATHER_HOLD/IN_PROGRESS" }
      - { name: consumed_gallons, type: number, source: computed, default: 0, description: "Sum of gallons_used recorded by finish-application on WorkOrders reserved against this lot" }
      - { name: wasted_gallons, type: number, source: system, default: 0, description: "Accumulated waste recorded via record-waste" }
      - { name: on_hand_gallons, type: number, source: computed, description: "= delivered_gallons - reserved_gallons - consumed_gallons - wasted_gallons" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Purchase cost per gallon for this lot" }
      - { name: received_on, type: string, source: input, description: "Date (YYYY-MM-DD) the lot was received" }
      - { name: reorder_threshold_gallons, type: number, source: input, description: "Reorder flag threshold; >= 0" }
      - { name: reorder_flag, type: boolean, source: computed, default: false, description: "true iff on_hand_gallons <= reorder_threshold_gallons" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_USE | DEPLETED | QUARANTINED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Crew display name" }
      - { name: home_zone, type: string, source: input, description: "Home dispatch zone" }
      - { name: daily_capacity_sqft, type: integer, source: input, description: "Default daily sealing capacity in sqft; > 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive crews cannot receive new RouteSheets" }

  - name: RouteSheet
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; crew running this route day" }
      - { name: service_date, type: string, source: input, description: "Route date YYYY-MM-DD; one RouteSheet per (crew_id, service_date)" }
      - { name: capacity_sqft, type: integer, source: input, description: "Day capacity; defaults to crew.daily_capacity_sqft when omitted" }
      - { name: booked_sqft, type: integer, source: computed, default: 0, description: "Sum of quoted_area_sqft of WorkOrders on this sheet in SCHEDULED | WEATHER_HOLD | IN_PROGRESS | CURING | COMPLETED" }
      - { name: total_drive_minutes, type: integer, source: computed, default: 0, description: "Sum of drive_minutes_est of WorkOrders on this sheet in the same included status set as booked_sqft" }
      - { name: open_capacity_sqft, type: integer, source: computed, description: "= capacity_sqft - booked_sqft" }
      - { name: status, type: enum, source: system, description: "OPEN | PUBLISHED | WEATHER_HOLD | COMPLETED | CANCELLED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property being quoted" }
      - { name: assessment_id, type: string, source: input, description: "FK -> SiteAssessment.id; pinned assessment supplying measurements" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; selected sealer product" }
      - { name: include_crack_fill, type: boolean, source: input, description: "Scope flag: crack filling" }
      - { name: include_patch, type: boolean, source: input, description: "Scope flag: pothole patching" }
      - { name: include_seal, type: boolean, source: input, description: "Scope flag: sealcoating" }
      - { name: include_striping, type: boolean, source: input, description: "Scope flag: striping; COMMERCIAL_LOT only" }
      - { name: coats, type: integer, source: input, description: "Seal coats, 1 or 2", default: 1 }
      - { name: stripe_linear_ft, type: number, source: input, description: "Planned striping linear feet; required iff include_striping" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Negotiated discount fraction, 0..0.30 inclusive" }
      - { name: area_sqft_snapshot, type: number, source: system, description: "Assessment measured_area_sqft pinned at creation (revise re-pins)" }
      - { name: crack_ft_snapshot, type: number, source: system, description: "Assessment crack_linear_ft pinned at creation" }
      - { name: pothole_area_snapshot, type: number, source: system, description: "Assessment pothole_area_sqft pinned at creation" }
      - { name: seal_line_cents, type: integer, source: computed, description: "Per-line rounded seal charge per calculations.job_pricing" }
      - { name: crack_line_cents, type: integer, source: computed, description: "Per-line rounded crack-fill charge" }
      - { name: patch_line_cents, type: integer, source: computed, description: "Per-line rounded patch charge" }
      - { name: striping_line_cents, type: integer, source: computed, description: "Per-line rounded striping charge (0 when excluded)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of the four per-line-rounded lines" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * discount_pct)" }
      - { name: mobilization_fee_cents, type: integer, source: computed, description: "7500 when (subtotal_cents - discount_cents) < 200000, else 0" }
      - { name: total_cents, type: integer, source: computed, description: "max(subtotal - discount + mobilization_fee, 25000)" }
      - { name: sent_at, type: datetime, source: system, description: "Set on DRAFT -> SENT; null while DRAFT" }
      - { name: expires_on, type: string, source: computed, description: "Calendar date 14 days after sent_at's date; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | REVISION_REQUESTED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; copied from the accepted Quote" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; originating accepted Quote" }
      - { name: warranty_claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; set only on warranty-repair WorkOrders, else null" }
      - { name: route_sheet_id, type: string, source: input, description: "FK -> RouteSheet.id; assigned at schedule/reschedule, null while PENDING" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; reserved at schedule/reschedule, null while PENDING" }
      - { name: include_crack_fill, type: boolean, source: system, description: "Scope snapshot from the Quote" }
      - { name: include_patch, type: boolean, source: system, description: "Scope snapshot from the Quote" }
      - { name: include_seal, type: boolean, source: system, description: "Scope snapshot from the Quote" }
      - { name: include_striping, type: boolean, source: system, description: "Scope snapshot from the Quote" }
      - { name: coats, type: integer, source: system, description: "Coat count snapshot from the Quote" }
      - { name: material_grade, type: enum, source: system, description: "STANDARD | PREMIUM | ECO snapshot from the Quote's Material" }
      - { name: quoted_area_sqft, type: number, source: system, description: "Area basis for capacity booking: Quote.area_sqft_snapshot; on warranty-repair WorkOrders, the original WorkOrder's actual_area_sqft" }
      - { name: quoted_total_cents, type: integer, source: system, description: "Frozen Quote.total_cents (0 on warranty-repair WorkOrders)" }
      - { name: scheduled_date, type: string, source: input, description: "Service date YYYY-MM-DD; set at schedule/reschedule" }
      - { name: window_start_hour, type: integer, source: input, description: "Work window start hour, 6..19" }
      - { name: window_end_hour, type: integer, source: input, description: "Work window end hour, 7..20, strictly greater than window_start_hour" }
      - { name: drive_minutes_est, type: integer, source: input, description: "Estimated one-route drive minutes attributed to this stop; >= 0" }
      - { name: vehicles_to_move, type: integer, source: input, description: "Vehicles requiring displacement notice; >= 0; seeds the DisplacementPlan" }
      - { name: reserved_gallons, type: number, source: computed, description: "Gallons reserved on the lot per calculations.material_gallons_required; 0 until scheduled, released on cancel/consume" }
      - { name: execution_status, type: enum, source: system, description: "PENDING | SCHEDULED | WEATHER_HOLD | IN_PROGRESS | CURING | COMPLETED | CLOSED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNINVOICED | INVOICED | PAID (parallel dimension)" }
      - { name: striping_status, type: enum, source: system, description: "NOT_REQUIRED | PLANNING | PLANNED | APPROVED | APPLIED | VERIFIED (parallel dimension)" }
      - { name: stall_count, type: integer, source: input, description: "Commercial stall count from striping/plan; null when striping not required" }
      - { name: ada_stalls_required, type: integer, source: computed, description: "Accessible stalls per calculations.ada_stall_requirement" }
      - { name: stripe_linear_ft_computed, type: number, source: computed, description: "stall_count * 18 + ada_stalls_required * 40" }
      - { name: actual_area_sqft, type: number, source: input, description: "Crew-measured area recorded at finish-application" }
      - { name: actual_crack_ft, type: number, source: input, description: "Crew-measured crack feet recorded at finish-application" }
      - { name: actual_pothole_area_sqft, type: number, source: input, description: "Crew-measured pothole area recorded at finish-application" }
      - { name: actual_stripe_ft, type: number, source: input, description: "Crew-measured striping feet recorded at finish-application" }
      - { name: gallons_used, type: number, source: input, description: "Actual gallons drawn from the reserved lot at finish-application" }
      - { name: started_at, type: datetime, source: system, description: "Set at start" }
      - { name: finished_at, type: datetime, source: system, description: "Set at finish-application" }
      - { name: cure_until, type: datetime, source: computed, description: "finished_at + adjusted cure hours per calculations.cure_window_projection" }
      - { name: completed_at, type: datetime, source: system, description: "Set at complete" }

  - name: DisplacementPlan
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; 1:1 with the WorkOrder, created at schedule" }
      - { name: vehicles_to_move, type: integer, source: system, description: "Copied from the WorkOrder schedule input" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Set on each successful send-notice; null until first notice" }
      - { name: access_block_start, type: datetime, source: system, description: "scheduled_date at window_start_hour :00 UTC; recomputed at reschedule" }
      - { name: access_block_end, type: datetime, source: system, description: "Provisional: scheduled_date at window_end_hour + provisional cure hours; finalized to WorkOrder.cure_until at finish-application" }
      - { name: status, type: enum, source: system, description: "NOTICE_PENDING | NOTICE_SENT | STALE | CLEARED | CANCELLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; 1:1, created DRAFT at WorkOrder completion" }
      - { name: line_items, type: array, source: computed, description: "Final-priced lines [{label, amount_cents}] each round_half_up, per calculations.invoice_settlement" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of rounded line amounts plus mobilization fee (pinned order)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * tier pct), tier keyed on the rounded subtotal_cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + fuel_surcharge_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Set at issue; null while DRAFT" }
      - { name: paid_at, type: datetime, source: system, description: "Set at pay; null until PAID" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID" }

  - name: WarrantyRecord
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; 1:1 with the completed WorkOrder" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; copied for property-level warranty queries" }
      - { name: warranty_months, type: integer, source: system, description: "Material.warranty_months snapshot + 6 when coats == 2" }
      - { name: started_on, type: string, source: system, description: "Completion date (YYYY-MM-DD)" }
      - { name: expires_on, type: string, source: computed, description: "started_on + warranty_months (calendar months)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLAIM_OPEN | EXPIRED | EXHAUSTED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: warranty_record_id, type: string, source: input, description: "FK -> WarrantyRecord.id; claimed warranty" }
      - { name: claim_type, type: enum, source: input, description: "CRACK_RECURRENCE | PEELING | FADE" }
      - { name: description, type: string, source: input, description: "Claim narrative" }
      - { name: investigated_by, type: string, source: system, description: "Opaque X-User-ID of the OfficeAdmin who moved the claim to INVESTIGATING" }
      - { name: repair_work_order_id, type: string, source: system, description: "Id of the warranty-repair WorkOrder created at approve; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | APPROVED | DENIED | REPAIR_SCHEDULED | RESOLVED" }

  - name: WeatherSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: target_date, type: string, source: input, description: "Forecast/observation date YYYY-MM-DD" }
      - { name: min_temp_f, type: number, source: input, description: "Forecast/observed minimum temperature (F)" }
      - { name: max_temp_f, type: number, source: input, description: "Forecast/observed maximum temperature (F)" }
      - { name: precip_probability_pct, type: integer, source: input, description: "Precipitation probability 0-100" }
      - { name: precipitation_mm, type: number, source: input, description: "Precipitation amount in millimeters; >= 0" }
      - { name: source, type: enum, source: input, description: "FORECAST | OBSERVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SiteAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/assessments/{assessmentId}/submit"
        actor: Estimator
        preconditions:
          - "Assessment is DRAFT (else ERR_ASSESSMENT_NOT_SUBMITTABLE)"
        side_effects:
          - "submitted_at = current clock"
          - "Any other SUBMITTED SiteAssessment with the same property_id -> SUPERSEDED (supersede cascade)"
          - "Property.current_area_sqft := this assessment's measured_area_sqft; increments Property.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (cascade when another assessment for the same property is submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "Quotes pinning this assessment keep their pinned snapshots (version pinning); no quote totals change"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (lazy: evaluated whenever the assessment is loaded by quote create or quote send and current clock date > submitted_at date + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "The referencing operation fails with ERR_ASSESSMENT_EXPIRED"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /api/quotes/{quoteId}/send"
        actor: Estimator
        preconditions:
          - "Quote is DRAFT (else ERR_QUOTE_NOT_SENDABLE)"
          - "Pinned assessment is still SUBMITTED (else ERR_ASSESSMENT_NOT_USABLE; EXPIRED flip via ERR_ASSESSMENT_EXPIRED)"
        side_effects:
          - "sent_at = current clock; expires_on = sent date + 14 days"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /api/quotes/{quoteId}/accept"
        actor: Customer
        preconditions:
          - "Acting customer owns the quote's property (else ERR_NOT_RESOURCE_OWNER)"
          - "Quote is SENT (else ERR_QUOTE_NOT_ACCEPTABLE)"
          - "Current clock date <= expires_on (else quote flips to EXPIRED and the call fails with ERR_QUOTE_EXPIRED)"
        side_effects:
          - "Create WorkOrder: execution_status=PENDING, billing_status=UNINVOICED, striping_status=PLANNING iff include_striping else NOT_REQUIRED, scope/coats/material_grade/quoted_area_sqft/quoted_total_cents snapshotted from the quote"
          - "Any other DRAFT/SENT/REVISION_REQUESTED Quote on the same property -> SUPERSEDED"
          - "Property.open_quote_id := null; increments Property.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /api/quotes/{quoteId}/decline"
        actor: Customer
        preconditions:
          - "Acting customer owns the quote's property"
          - "Quote is SENT (else ERR_QUOTE_NOT_ACCEPTABLE)"
        side_effects:
          - "Property.open_quote_id := null; increments Property.version by 1"
      - from: SENT
        to: REVISION_REQUESTED
        trigger: "POST /api/quotes/{quoteId}/request-revision"
        actor: Customer
        preconditions:
          - "Acting customer owns the quote's property"
          - "Quote is SENT (else ERR_QUOTE_NOT_ACCEPTABLE)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /api/quotes/{quoteId}"
        actor: Estimator
        preconditions:
          - "Quote is DRAFT or REVISION_REQUESTED (else ERR_QUOTE_NOT_EDITABLE)"
        side_effects:
          - "All pricing fields recomputed per calculations.job_pricing (provisional variant)"
          - "Expires_on/sent_at cleared to null (cycle restarts at send)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade when a new Quote is created for the same property)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "system (cascade when a new Quote is created for the same property)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system (cascade when a new Quote is created for the same property)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: EXPIRED
        trigger: "system (lazy: evaluated on accept/decline/request-revision when current clock date > expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Property.open_quote_id := null if it pointed at this quote; the triggering call fails with ERR_QUOTE_EXPIRED"

  - entity: WorkOrder
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /api/work-orders/{workOrderId}/schedule"
        actor: Dispatcher
        preconditions:
          - "execution_status == PENDING (else ERR_WORK_ORDER_NOT_SCHEDULABLE)"
          - "RouteSheet exists, status in {OPEN, PUBLISHED}, service_date == scheduled_date (else ERR_ROUTE_SHEET_NOT_SCHEDULABLE)"
          - "RouteSheet.crew is active (else ERR_ROUTE_SHEET_NOT_SCHEDULABLE)"
          - "Weather gate: latest WeatherSnapshot for scheduled_date exists (else ERR_WEATHER_DATA_MISSING) and passes material thresholds (else ERR_WEATHER_WINDOW_VIOLATION)"
          - "Season gate: scheduled_date month-day within [04-01, 10-31] (else ERR_OUTSIDE_SEASON); scheduled_date >= current clock date (else ERR_DATE_IN_PAST)"
          - "Re-application gate: if include_seal and warranty_claim_id is null and Property.next_seal_eligible_on is set, scheduled_date >= next_seal_eligible_on's date (else ERR_RESEAL_INTERVAL_NOT_MET)"
          - "Capacity gate: sheet.booked_sqft + quoted_area_sqft <= sheet.capacity_sqft (else ERR_ROUTE_CAPACITY_EXCEEDED)"
          - "Drive gate: sheet.total_drive_minutes + drive_minutes_est <= 180 (else ERR_ROUTE_DRIVE_LIMIT_EXCEEDED)"
          - "Crew window gate: [window_start_hour, window_end_hour) overlaps no other non-cancelled WorkOrder window on the same sheet (else ERR_CREW_WINDOW_OVERLAP)"
          - "Property access gate: blocked interval [access_block_start, provisional access_block_end] overlaps no other non-cancelled WorkOrder blocked interval on the same property (else ERR_ACCESS_WINDOW_OVERLAP)"
          - "MaterialLot status in {RECEIVED, IN_USE} (else ERR_MATERIAL_LOT_UNAVAILABLE) and lot.material_id == quote's material and on_hand_gallons >= gallons_required (else ERR_INSUFFICIENT_MATERIAL)"
        side_effects:
          - "execution_status := SCHEDULED; increments WorkOrder.version by 1"
          - "reserved_gallons := calculations.material_gallons_required(quoted_area_sqft, coats, material coverage)"
          - "Cascade link 1: MaterialLot.reserved_gallons += reserved_gallons; if lot was RECEIVED -> IN_USE"
          - "Cascade link 2: recompute MaterialLot.on_hand_gallons and reorder_flag (true iff on_hand <= reorder_threshold)"
          - "RouteSheet.booked_sqft += quoted_area_sqft; total_drive_minutes += drive_minutes_est; recompute open_capacity_sqft; increments RouteSheet.version by 1"
          - "Create DisplacementPlan (NOTICE_PENDING): vehicles_to_move copied; access_block_start = scheduled_date at window_start_hour UTC; access_block_end = scheduled_date at window_end_hour UTC + provisional cure hours (calculations.cure_window_projection, forecast variant)"
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "system (cascade when the WorkOrder's RouteSheet enters WEATHER_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "execution_status := WEATHER_HOLD (material reservation and route booking are RETAINED)"
          - "Cascade: this WorkOrder's DisplacementPlan in NOTICE_SENT or CLEARED -> STALE"
      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /api/work-orders/{workOrderId}/reschedule"
        actor: Dispatcher
        preconditions:
          - "execution_status == WEATHER_HOLD (else ERR_WORK_ORDER_NOT_SCHEDULABLE)"
          - "OCC: expected_work_order_version == WorkOrder.version (else ERR_STALE_VERSION)"
          - "All schedule gates re-run against the new route_sheet_id/scheduled_date (same error set as schedule)"
        side_effects:
          - "Release old RouteSheet booked_sqft/total_drive_minutes; release old MaterialLot reservation (cascade link 2 recompute)"
          - "Apply new booking + reservation on the new sheet/lot (same cascades as schedule)"
          - "DisplacementPlan.access_block_start/end recomputed; plan in NOTICE_SENT/CLEARED/STALE -> NOTICE_PENDING with notice_sent_at cleared"
          - "execution_status := SCHEDULED; increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/work-orders/{workOrderId}/start"
        actor: CrewLead
        preconditions:
          - "execution_status == SCHEDULED (else ERR_WORK_ORDER_NOT_STARTABLE)"
          - "Current clock date == scheduled_date (else ERR_DATE_IN_PAST)"
          - "DisplacementPlan.status == CLEARED (else ERR_DISPLACEMENT_NOT_CLEARED)"
          - "Weather gate re-run with the latest WeatherSnapshot for today (missing -> ERR_WEATHER_DATA_MISSING; failing -> ERR_WEATHER_WINDOW_VIOLATION)"
          - "MaterialLot still in {RECEIVED, IN_USE} (else ERR_MATERIAL_LOT_UNAVAILABLE)"
        side_effects:
          - "execution_status := IN_PROGRESS; started_at = current clock"
      - from: IN_PROGRESS
        to: CURING
        trigger: "POST /api/work-orders/{workOrderId}/finish-application"
        actor: CrewLead
        preconditions:
          - "execution_status == IN_PROGRESS (else ERR_WORK_ORDER_NOT_FINISHABLE)"
          - "gallons_used <= WorkOrder.reserved_gallons (else ERR_INSUFFICIENT_MATERIAL)"
        side_effects:
          - "Record actual_area_sqft/actual_crack_ft/actual_pothole_area_sqft/actual_stripe_ft/gallons_used"
          - "finished_at = current clock; cure_until computed per calculations.cure_window_projection (observed variant)"
          - "DisplacementPlan.access_block_end := cure_until"
          - "MaterialLot.reserved_gallons -= WorkOrder.reserved_gallons; consumed_gallons += gallons_used; WorkOrder.reserved_gallons := 0; recompute on_hand + reorder_flag"
      - from: CURING
        to: COMPLETED
        trigger: "POST /api/work-orders/{workOrderId}/complete"
        actor: CrewLead
        preconditions:
          - "execution_status == CURING (else ERR_WORK_ORDER_NOT_FINISHABLE)"
          - "Current clock >= cure_until (else ERR_CURE_INCOMPLETE)"
          - "If include_striping then striping_status == VERIFIED (else ERR_STRIPING_NOT_VERIFIED)"
        side_effects:
          - "execution_status := COMPLETED; completed_at = current clock"
          - "Create Invoice (DRAFT): when warranty_claim_id is null, priced per calculations.invoice_settlement on ACTUAL measurements (final variant of job_pricing rates); when set (warranty repair), every line is zeroed so total_cents == 0"
          - "Create WarrantyRecord ACTIVE only when warranty_claim_id is null: started_on = completion date; warranty_months = material warranty_months (+6 when coats==2); expires_on computed"
          - "If include_seal and warranty_claim_id is null: Property.last_completed_seal_on := completed_at; next_seal_eligible_on := completed_at + material reapplication_months; increments Property.version by 1"
          - "If warranty_claim_id is set: that WarrantyClaim -> RESOLVED (if REPAIR_SCHEDULED); its WarrantyRecord CLAIM_OPEN -> EXHAUSTED"
      - from: COMPLETED
        to: CLOSED
        trigger: "system (automatic when billing_status becomes PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Dispatcher
        preconditions:
          - "execution_status in {PENDING, SCHEDULED, WEATHER_HOLD} (else ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If scheduled: release RouteSheet booked_sqft/total_drive_minutes (recompute open_capacity)"
          - "Cascade link 1: MaterialLot.reserved_gallons -= reserved_gallons; WorkOrder.reserved_gallons := 0"
          - "Cascade link 2: recompute MaterialLot.on_hand_gallons and reorder_flag (release may clear the flag)"
          - "If lot IN_USE with reserved_gallons == 0 and consumed_gallons == 0: lot -> RECEIVED"
          - "DisplacementPlan (if any) -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Dispatcher
        preconditions:
          - "execution_status in {PENDING, SCHEDULED, WEATHER_HOLD}"
        side_effects:
          - "Same compensation cascade as PENDING -> CANCELLED"
      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /api/work-orders/{workOrderId}/cancel"
        actor: Dispatcher
        preconditions:
          - "execution_status in {PENDING, SCHEDULED, WEATHER_HOLD}"
        side_effects:
          - "Same compensation cascade as PENDING -> CANCELLED"

  - entity: WorkOrderBilling
    note: "Parallel billing dimension stored on WorkOrder.billing_status; driven by Invoice transitions"
    initial_state: UNINVOICED
    terminal_states: [PAID]
    transitions:
      - from: UNINVOICED
        to: INVOICED
        trigger: "system (when the WorkOrder's Invoice transitions DRAFT -> ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: PAID
        trigger: "system (when the WorkOrder's Invoice transitions ISSUED -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "If execution_status == COMPLETED: execution_status -> CLOSED"

  - entity: WorkOrderStriping
    note: "Parallel striping dimension stored on WorkOrder.striping_status"
    initial_state: "PLANNING when include_striping else NOT_REQUIRED"
    terminal_states: [VERIFIED, NOT_REQUIRED]
    transitions:
      - from: PLANNING
        to: PLANNED
        trigger: "POST /api/work-orders/{workOrderId}/striping/plan"
        actor: Estimator
        preconditions:
          - "WorkOrder include_striping == true and striping_status == PLANNING (else ERR_STRIPING_NOT_PLANNABLE)"
          - "Property.lot_kind == COMMERCIAL_LOT (else ERR_STRIPING_COMMERCIAL_ONLY)"
        side_effects:
          - "ada_stalls_required and stripe_linear_ft_computed computed per calculations.ada_stall_requirement"
      - from: PLANNED
        to: APPROVED
        trigger: "POST /api/work-orders/{workOrderId}/striping/approve"
        actor: Estimator
        preconditions:
          - "striping_status == PLANNED (else ERR_STRIPING_NOT_PLANNABLE)"
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /api/work-orders/{workOrderId}/striping/mark-applied"
        actor: CrewLead
        preconditions:
          - "striping_status == APPROVED (else ERR_STRIPING_NOT_PLANNABLE)"
          - "execution_status in {CURING, COMPLETED} (else ERR_WORK_ORDER_NOT_FINISHABLE)"
        side_effects: []
      - from: APPLIED
        to: VERIFIED
        trigger: "POST /api/work-orders/{workOrderId}/striping/verify"
        actor: Estimator
        preconditions:
          - "striping_status == APPLIED (else ERR_STRIPING_NOT_PLANNABLE)"
        side_effects: []

  - entity: RouteSheet
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: PUBLISHED
        trigger: "POST /api/route-sheets/{routeSheetId}/publish"
        actor: Dispatcher
        preconditions:
          - "status == OPEN (else ERR_ROUTE_SHEET_NOT_PUBLISHABLE)"
        side_effects: []
      - from: WEATHER_HOLD
        to: PUBLISHED
        trigger: "POST /api/route-sheets/{routeSheetId}/publish"
        actor: Dispatcher
        preconditions:
          - "status in {OPEN, WEATHER_HOLD} (else ERR_ROUTE_SHEET_NOT_PUBLISHABLE)"
        side_effects:
          - "Re-publishing a held sheet does NOT auto-return its WorkOrders; they stay WEATHER_HOLD until individually rescheduled"
      - from: PUBLISHED
        to: WEATHER_HOLD
        trigger: "system (cascade: POST /api/weather-snapshots whose target_date == service_date and failing SHEET_HOLD thresholds, when this snapshot is the latest for that date)"
        actor: system
        preconditions:
          - "Snapshot precip_probability_pct > 60 OR min_temp_f < 40"
        side_effects:
          - "Cascade link 2: every WorkOrder on this sheet with execution_status == SCHEDULED -> WEATHER_HOLD"
          - "Cascade link 3: each such WorkOrder's DisplacementPlan in NOTICE_SENT or CLEARED -> STALE"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/route-sheets/{routeSheetId}/cancel"
        actor: Dispatcher
        preconditions:
          - "status in {OPEN, PUBLISHED, WEATHER_HOLD} (else ERR_ROUTE_SHEET_NOT_CANCELLABLE)"
          - "No WorkOrder on the sheet in {SCHEDULED, WEATHER_HOLD, IN_PROGRESS, CURING} (else ERR_ROUTE_SHEET_NOT_CANCELLABLE)"
        side_effects: []
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/route-sheets/{routeSheetId}/cancel"
        actor: Dispatcher
        preconditions:
          - "status in {OPEN, PUBLISHED, WEATHER_HOLD}"
          - "No non-terminal WorkOrders remain on the sheet"
        side_effects: []
      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /api/route-sheets/{routeSheetId}/cancel"
        actor: Dispatcher
        preconditions:
          - "status in {OPEN, PUBLISHED, WEATHER_HOLD}"
          - "No non-terminal WorkOrders remain on the sheet"
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "system (lazy: when read or written and current clock date > service_date and no WorkOrder on the sheet is in SCHEDULED | WEATHER_HOLD | IN_PROGRESS | CURING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system (lazy, same condition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DisplacementPlan
    initial_state: NOTICE_PENDING
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: NOTICE_PENDING
        to: NOTICE_SENT
        trigger: "POST /api/displacement-plans/{planId}/send-notice"
        actor: Dispatcher
        preconditions:
          - "status in {NOTICE_PENDING, STALE} (else ERR_PLAN_NOT_NOTIFIABLE)"
          - "Current clock + 48h <= access_block_start (else ERR_NOTICE_LEAD_TIME_SHORT)"
        side_effects:
          - "notice_sent_at = current clock"
      - from: STALE
        to: NOTICE_SENT
        trigger: "POST /api/displacement-plans/{planId}/send-notice"
        actor: Dispatcher
        preconditions:
          - "status in {NOTICE_PENDING, STALE}"
          - "Lead-time rule re-checked against the current access_block_start"
        side_effects:
          - "notice_sent_at = current clock"
      - from: NOTICE_SENT
        to: CLEARED
        trigger: "POST /api/displacement-plans/{planId}/confirm-cleared"
        actor: Dispatcher
        preconditions:
          - "status == NOTICE_SENT (else ERR_PLAN_NOT_NOTICED)"
        side_effects: []
      - from: NOTICE_SENT
        to: STALE
        trigger: "system (cascade: owning WorkOrder enters WEATHER_HOLD, or is rescheduled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: STALE
        trigger: "system (cascade: owning WorkOrder enters WEATHER_HOLD, or is rescheduled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_PENDING
        to: CANCELLED
        trigger: "system (cascade: owning WorkOrder is cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_SENT
        to: CANCELLED
        trigger: "system (cascade: owning WorkOrder is cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STALE
        to: CANCELLED
        trigger: "system (cascade: owning WorkOrder is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaterialLot
    initial_state: RECEIVED
    terminal_states: [DEPLETED, QUARANTINED]
    transitions:
      - from: RECEIVED
        to: IN_USE
        trigger: "system (first WorkOrder reservation lands on the lot)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: RECEIVED
        trigger: "system (reserved_gallons returns to 0 AND consumed_gallons == 0, via cancel/reschedule release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: DEPLETED
        trigger: "system (when on_hand_gallons == 0 after record-waste)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: DEPLETED
        trigger: "system (when on_hand_gallons == 0 after consumption or record-waste and reserved_gallons == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /api/material-lots/{lotId}/quarantine"
        actor: OfficeAdmin
        preconditions:
          - "status in {RECEIVED, IN_USE} (else ERR_MATERIAL_LOT_UNAVAILABLE)"
        side_effects: []
      - from: IN_USE
        to: QUARANTINED
        trigger: "POST /api/material-lots/{lotId}/quarantine"
        actor: OfficeAdmin
        preconditions:
          - "status in {RECEIVED, IN_USE}"
          - "reserved_gallons == 0 (else ERR_MATERIAL_LOT_IN_USE)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{invoiceId}/issue"
        actor: OfficeAdmin
        preconditions:
          - "status == DRAFT (else ERR_INVOICE_NOT_ISSUABLE)"
        side_effects:
          - "issued_at = current clock; WorkOrder.billing_status UNINVOICED -> INVOICED"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{invoiceId}/pay"
        actor: Customer
        preconditions:
          - "status == ISSUED (else ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents == total_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "Acting customer owns the invoice's property (when called as Customer; else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "paid_at = current clock; WorkOrder.billing_status INVOICED -> PAID"
          - "If WorkOrder.execution_status == COMPLETED: execution_status -> CLOSED"

  - entity: WarrantyRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: CLAIM_OPEN
        trigger: "POST /api/warranty-claims (creation of a WarrantyClaim against this record)"
        actor: Customer
        preconditions:
          - "status == ACTIVE (else ERR_WARRANTY_NOT_ACTIVE)"
          - "Current clock date <= expires_on (else record flips EXPIRED and the call fails with ERR_WARRANTY_EXPIRED)"
          - "Acting customer owns the warranty's property (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: CLAIM_OPEN
        to: ACTIVE
        trigger: "system (when the open WarrantyClaim is DENIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLAIM_OPEN
        to: EXHAUSTED
        trigger: "system (when the open WarrantyClaim reaches RESOLVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated at claim creation when current clock date > expires_on)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /api/warranty-claims/{claimId}/investigate"
        actor: OfficeAdmin
        preconditions:
          - "status == OPEN (else ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "investigated_by = acting X-User-ID"
      - from: INVESTIGATING
        to: APPROVED
        trigger: "POST /api/warranty-claims/{claimId}/approve"
        actor: OfficeAdmin
        preconditions:
          - "status == INVESTIGATING (else ERR_CLAIM_NOT_OPEN)"
          - "Acting X-User-ID != investigated_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Create warranty-repair WorkOrder: execution_status=PENDING, warranty_claim_id = this claim, quoted_area_sqft = original WorkOrder.actual_area_sqft, quoted_total_cents = 0, include_* copied from original, coats = 1, striping_status = NOT_REQUIRED"
          - "repair_work_order_id := new WorkOrder id"
      - from: INVESTIGATING
        to: DENIED
        trigger: "POST /api/warranty-claims/{claimId}/deny"
        actor: OfficeAdmin
        preconditions:
          - "status == INVESTIGATING (else ERR_CLAIM_NOT_OPEN)"
          - "Acting X-User-ID != investigated_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "WarrantyRecord CLAIM_OPEN -> ACTIVE"
      - from: APPROVED
        to: REPAIR_SCHEDULED
        trigger: "system (when the repair WorkOrder is scheduled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPAIR_SCHEDULED
        to: RESOLVED
        trigger: "system (when the repair WorkOrder reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "WarrantyRecord CLAIM_OPEN -> EXHAUSTED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /api/quotes"
    occ_field: expected_property_version
    description: |
      Creating a Quote for a Property whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a quote (which legitimately supersedes the
      property's prior open quote) or accepted a quote, and the current
      writer's view of the property is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workorder-reschedule-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /api/work-orders/{workOrderId}/reschedule"
    occ_field: expected_work_order_version
    description: |
      Rescheduling a WorkOrder whose version has advanced since the client
      last observed it is rejected. Re-rescheduling is legitimate product
      behavior (repeated rain-outs), so a writer operating on a stale view is
      stopped by the version check rather than by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pavement_condition_index
    trigger: "SiteAssessment creation (and recompute is never needed afterwards; assessments are immutable once created)"
    algorithm: weighted_scoring
    formula: |
      D_crack   = min(40, round_half_up(crack_linear_ft / measured_area_sqft * 400))
      D_pothole = min(35, round_half_up(pothole_area_sqft / measured_area_sqft * 700))
      D_oil     = min(15, round_half_up(oil_spot_area_sqft / measured_area_sqft * 300))
      D_slope   = 10 if slope_severity == STEEP; 5 if MODERATE; 0 if NONE
      pavement_condition_index = max(0, 100 - D_crack - D_pothole - D_oil - D_slope)
    input_set: "The single SiteAssessment being created"
    constants:
      CRACK_WEIGHT: 400
      POTHOLE_WEIGHT: 700
      OIL_WEIGHT: 300
      CRACK_CAP: 40
      POTHOLE_CAP: 35
      OIL_CAP: 15
    precision: "integer score; each deduction rounded half-up to integer before subtraction"

  - name: job_pricing
    trigger: "Quote create, Quote PATCH (provisional variant); WorkOrder completion feeds the same rate structure into invoice_settlement (final variant)"
    algorithm: tiered_pricing
    formula: |
      Tier selection on TOTAL area (average-rate style, NOT marginal brackets):
        area <= 1000            -> seal_rate = 30 cents/sqft
        1000 < area <= 5000     -> seal_rate = 24 cents/sqft
        area > 5000             -> seal_rate = 18 cents/sqft
      Boundary: exactly 1000 sqft is tier 1; exactly 5000 is tier 2.
      grade_factor: STANDARD 1.00 | PREMIUM 1.35 | ECO 1.15
      seal_line_cents     = include_seal       ? round_half_up(area * seal_rate * grade_factor * coats) : 0
      crack_line_cents    = include_crack_fill ? round_half_up(crack_ft * 150) : 0
      patch_line_cents    = include_patch      ? round_half_up(pothole_area * 800) : 0
      striping_line_cents = include_striping   ? round_half_up(stripe_linear_ft * 90) : 0
      PINNED ROUNDING ORDER: round each line to integer cents FIRST, then sum.
      subtotal_cents = seal_line + crack_line + patch_line + striping_line
      discount_cents = round_half_up(subtotal_cents * discount_pct)
      mobilization_fee_cents = (subtotal_cents - discount_cents) < 200000 ? 7500 : 0
      total_cents = max(subtotal_cents - discount_cents + mobilization_fee_cents, 25000)
      Cost floor (validation): estimated material cost + labor floor =
        (include_seal ? material_gallons_required(area, coats, coverage) * material.price_per_gallon_cents : 0)
        + round_half_up(area * 5); total_cents below this floor is rejected (ERR_PRICE_BELOW_COST_FLOOR).
    input_set: "Provisional variant: Quote's pinned assessment snapshots + scope flags + material grade. Final variant: WorkOrder actual_* fields recorded at finish-application, same scope flags and coats."
    constants:
      TIER1_MAX_SQFT: 1000
      TIER1_RATE_CENTS: 30
      TIER2_MAX_SQFT: 5000
      TIER2_RATE_CENTS: 24
      TIER3_RATE_CENTS: 18
      CRACK_RATE_CENTS_PER_FT: 150
      PATCH_RATE_CENTS_PER_SQFT: 800
      STRIPE_RATE_CENTS_PER_FT: 90
      MOBILIZATION_FEE_CENTS: 7500
      MOBILIZATION_WAIVER_SUBTOTAL_CENTS: 200000
      MINIMUM_CHARGE_CENTS: 25000
      LABOR_FLOOR_CENTS_PER_SQFT: 5
    precision: "integer cents; round_half_up per line before summing"
    variants:
      - name: provisional_quote
        when: "Quote creation and revision; measurements come from the pinned assessment snapshots"
        difference: "Uses assessment-snapshot area/crack/pothole figures; stored on Quote.*_line_cents and total_cents"
      - name: final_invoice
        when: "WorkOrder completion; measurements come from crew-recorded actuals"
        difference: "Same rate structure but inputs are actual_area_sqft / actual_crack_ft / actual_pothole_area_sqft / actual_stripe_ft; results land on Invoice.line_items and typically differ from the quote whenever actuals differ from estimates"

  - name: invoice_settlement
    trigger: "WorkOrder CURING -> COMPLETED (Invoice DRAFT creation)"
    algorithm: aggregation
    formula: |
      1. Recompute the four scope lines with the job_pricing rate structure on ACTUAL
         measurements (round_half_up per line first, integer cents).
      2. mobilization line: 7500 if the sum of the four rounded lines < 200000 else 0
         (no discount on invoices; negotiated discount already lived on the quote).
      3. subtotal_cents = sum of rounded lines + mobilization line.
      4. Fuel surcharge: tier keyed on the ROUNDED subtotal_cents:
           subtotal < 100000              -> 6%
           100000 <= subtotal < 500000    -> 4%
           subtotal >= 500000             -> 2%
         fuel_surcharge_cents = round_half_up(subtotal_cents * pct)
      5. total_cents = subtotal_cents + fuel_surcharge_cents
      PINNED EVALUATION ORDER: per-line rounding -> sum -> tier lookup on the rounded
      subtotal -> surcharge rounding -> total. Implementations that sum unrounded
      line floats and round once, or key the surcharge tier on the unrounded sum,
      produce different cents and are non-conformant.
    input_set: "The completing WorkOrder's actual_* fields, scope flags, coats, and material grade"
    constants:
      SURCHARGE_TIER1_MAX_CENTS: 100000
      SURCHARGE_TIER1_PCT: 0.06
      SURCHARGE_TIER2_MAX_CENTS: 500000
      SURCHARGE_TIER2_PCT: 0.04
      SURCHARGE_TIER3_PCT: 0.02
    precision: "integer cents; round_half_up at each pinned step"

  - name: material_gallons_required
    trigger: "WorkOrder schedule (reservation), quote pricing floor (estimate), reschedule (re-reservation)"
    algorithm: threshold
    formula: |
      When include_seal is false: gallons_required = 0 (no sealer drawn).
      Otherwise:
      gallons_required = ceil(area_sqft * coats * WASTE_FACTOR / material.coverage_sqft_per_gallon)
      Reservation unit is whole gallons (ceil). The same formula is used for the
      quote cost-floor estimate and for the lot reservation.
    input_set: "Area basis (quote snapshot or reschedule quoted area), coats, material coverage"
    constants:
      WASTE_FACTOR: 1.10
    precision: "whole gallons, round up (ceil)"

  - name: cure_window_projection
    trigger: "WorkOrder schedule (provisional, forecast variant) and finish-application (final, observed variant)"
    algorithm: threshold
    formula: |
      base_hours = material.cure_hours_vehicle
      Look at the latest WeatherSnapshot for the relevant date (scheduled_date for the
      provisional variant; the finish date for the observed variant), selected by
      created_at DESC with source OBSERVED preferred over FORECAST on ties:
        if snapshot.min_temp_f < 55: hours = ceil(base_hours * 1.5)
        else: hours = base_hours
        if snapshot.precipitation_mm > 0: hours = hours + 12
      If no snapshot exists for the date, use base_hours unadjusted.
      Provisional access_block_end = scheduled_date at window_end_hour UTC + hours
      Final cure_until = finished_at + hours
    input_set: "Material cure hours, latest weather snapshot for the relevant date"
    constants:
      COLD_CURE_THRESHOLD_F: 55
      COLD_CURE_MULTIPLIER: 1.5
      WET_CURE_EXTENSION_HOURS: 12
    precision: "whole hours (ceil after multiplication)"

  - name: ada_stall_requirement
    trigger: "POST /api/work-orders/{workOrderId}/striping/plan"
    algorithm: threshold
    formula: |
      n = stall_count
      n <= 25    -> ada = 1
      26..50     -> ada = 2
      51..75     -> ada = 3
      76..100    -> ada = 4
      n > 100    -> ada = 4 + ceil((n - 100) / 50)
      Boundary: exactly 100 stalls -> 4 (the >100 formula starts at 101).
      stripe_linear_ft_computed = stall_count * 18 + ada_stalls_required * 40
    input_set: "WorkOrder.stall_count input"
    constants:
      STALL_LINE_FT: 18
      ADA_MARKING_FT: 40
    precision: "integer stalls (ceil for the >100 overflow term); linear feet integer"

  - name: route_density_gate
    trigger: "WorkOrder schedule and reschedule"
    algorithm: aggregation
    formula: |
      Included WorkOrders on the sheet: execution_status in
      {SCHEDULED, WEATHER_HOLD, IN_PROGRESS, CURING, COMPLETED} (CANCELLED excluded;
      PENDING excluded because PENDING WorkOrders have no route_sheet_id).
      booked_sqft        = sum(quoted_area_sqft)
      total_drive_minutes = sum(drive_minutes_est)
      Gates for the candidate WorkOrder (evaluated BEFORE mutation):
        booked_sqft + candidate.quoted_area_sqft <= capacity_sqft   (equality allowed)
        total_drive_minutes + candidate.drive_minutes_est <= 180    (equality allowed)
      open_capacity_sqft = capacity_sqft - booked_sqft (recomputed on every mutation)
    input_set: "RouteSheet's WorkOrders in the included status set plus the candidate"
    constants:
      MAX_ROUTE_DRIVE_MINUTES: 180
    precision: "integer sqft and minutes"

  - name: crew_utilization
    trigger: "GET /api/crews/{crewId}/utilization?month=YYYY-MM"
    algorithm: forward_looking
    formula: |
      Sheets in scope: RouteSheets of this crew whose service_date falls in the
      requested calendar month and whose status != CANCELLED.
      capacity_sqft_month = sum(sheet.capacity_sqft); if 0, both percentages are 0.0.
      PROJECTED variant (forward-looking): sum of quoted_area_sqft over WorkOrders
        on in-scope sheets with execution_status in
        {SCHEDULED, WEATHER_HOLD, IN_PROGRESS, CURING, COMPLETED}.
      REALIZED variant: sum of actual_area_sqft over WorkOrders on in-scope sheets
        with execution_status in {COMPLETED, CLOSED} (actuals only).
      projected_utilization_pct = round_half_up(projected / capacity_sqft_month * 100, 1 decimal)
      realized_utilization_pct  = round_half_up(realized  / capacity_sqft_month * 100, 1 decimal)
    input_set: "Crew's RouteSheets in the month (excluding CANCELLED) and their WorkOrders, status-filtered per variant"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: projected
        when: "Always returned; forward-looking booked demand"
        difference: "Counts quoted_area_sqft of in-flight and completed work; includes jobs that have not run yet"
      - name: realized
        when: "Always returned alongside projected"
        difference: "Counts actual_area_sqft of COMPLETED/CLOSED work only; a month of scheduled-but-unfinished work shows projected > realized"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: when acting as Customer, X-User-ID must equal the customer_id owning the target resource (quote/property/work order/invoice/warranty)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-accessible endpoints acting on owned resources (quote accept/decline/request-revision, warranty claim create, invoice pay, owned GETs)"
  - priority: 4
    category: existence
    check: "Every id in path and every *  -id FK in the body exists (path validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target resource state permits the requested transition (per state machine preconditions; includes quote expiry flip and warranty expiry flip)"
    error_id: "state-specific: ERR_QUOTE_NOT_EDITABLE | ERR_QUOTE_NOT_SENDABLE | ERR_QUOTE_NOT_ACCEPTABLE | ERR_QUOTE_EXPIRED | ERR_ASSESSMENT_NOT_SUBMITTABLE | ERR_WORK_ORDER_NOT_SCHEDULABLE | ERR_WORK_ORDER_NOT_STARTABLE | ERR_WORK_ORDER_NOT_FINISHABLE | ERR_WORK_ORDER_NOT_CANCELLABLE | ERR_ROUTE_SHEET_NOT_PUBLISHABLE | ERR_ROUTE_SHEET_NOT_CANCELLABLE | ERR_PLAN_NOT_NOTIFIABLE | ERR_PLAN_NOT_NOTICED | ERR_INVOICE_NOT_ISSUABLE | ERR_INVOICE_NOT_PAYABLE | ERR_WARRANTY_NOT_ACTIVE | ERR_WARRANTY_EXPIRED | ERR_CLAIM_NOT_OPEN | ERR_STRIPING_NOT_PLANNABLE"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: business_safety
    check: "Weather gate: latest snapshot for the service date exists and passes material thresholds (min_temp_f >= material.min_apply_temp_f AND precip_probability_pct <= material.max_precip_probability_pct)"
    error_id: "ERR_WEATHER_DATA_MISSING | ERR_WEATHER_WINDOW_VIOLATION"
    http_status: 422
    applies_to: "POST /api/work-orders/{id}/schedule, POST /api/work-orders/{id}/reschedule, POST /api/work-orders/{id}/start"
  - priority: 7
    category: business_referential
    check: "Referenced configuration is usable: assessment SUBMITTED and property-matched; material lot in {RECEIVED, IN_USE} with matching material and sufficient on_hand gallons"
    error_id: "ERR_ASSESSMENT_NOT_USABLE | ERR_ASSESSMENT_EXPIRED | ERR_ASSESSMENT_PROPERTY_MISMATCH | ERR_MATERIAL_LOT_UNAVAILABLE | ERR_INSUFFICIENT_MATERIAL"
    http_status: 422
    applies_to: "quote create/PATCH/send; work order schedule/reschedule/start; finish-application"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: season window, not-in-past dates, notice lead time (48h), cure completion, re-application interval"
    error_id: "ERR_OUTSIDE_SEASON | ERR_DATE_IN_PAST | ERR_NOTICE_LEAD_TIME_SHORT | ERR_CURE_INCOMPLETE | ERR_RESEAL_INTERVAL_NOT_MET"
    http_status: 422
    applies_to: "schedule, reschedule, start, send-notice, complete"
  - priority: 9
    category: business_constraint
    check: "Structural conflicts: crew window overlap (half-open), property access overlap (cure-buffered), route capacity, route drive limit, striping commercial-only, window hour sanity, segregation of duties"
    error_id: "ERR_CREW_WINDOW_OVERLAP | ERR_ACCESS_WINDOW_OVERLAP | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_ROUTE_DRIVE_LIMIT_EXCEEDED | ERR_STRIPING_COMMERCIAL_ONLY | ERR_INVALID_WINDOW_HOURS | ERR_SEGREGATION_OF_DUTIES | ERR_MATERIAL_LOT_IN_USE"
    http_status: 409
    applies_to: "schedule, reschedule, striping/plan, warranty approve/deny, material-lot quarantine"
  - priority: 10
    category: business_fiscal
    check: "Money rules: discount within 0..0.30, total above cost floor, payment amount equals invoice total exactly"
    error_id: "ERR_INVALID_REQUEST | ERR_PRICE_BELOW_COST_FLOOR | ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 422
    applies_to: "quote create/PATCH; invoice pay"
  - priority: 11
    category: business_constraint
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/quotes, POST /api/work-orders/{id}/reschedule"

