  - rule_id: transitive_cascade
    instances:
      - name: replacement_award_cascade_releases_the_hold_in_predecessor
        grounds:
          - state_machines.ServiceAgreement
          - state_machines.TerminationPetition
          - state_machines.Community
          - calculations.agreement_obligation_ledger
          - endpoints.POST_/eas/solicitations/{id}/selection-order
        chain_depth: 5
        chain: "POST /eas/solicitations/{id}/selection-order on the REPLACEMENT solicitation -> winning Proposal UNDER_EVALUATION -> SELECTED and the Solicitation CLOSED -> AWARDED -> a successor ServiceAgreement is booked ACTIVE with predecessor_agreement_id resolved to the HOLD_IN agreement -> the predecessor moves HOLD_IN -> TERMINATED and its unspent obligation is released -> its TerminationPetition moves GRANTED_WITH_HOLD_IN -> CLOSED and the Community moves HOLD_IN -> SUBSIDIZED"
        distinguishing_aspect: |
          This cascade travels *upstream* along an existing chain: it closes out a predecessor
          agreement, a petition and a community state that were all created by an earlier cascade.
          The hold-in grant cascade below travels downstream from a decision, and the performance
          review cascade below originates in a calculation outcome rather than an operator action.
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under agreement A1 (Prairie Air, 1600000.00, term 24, total_committed 3200000.00)."
            - "A1's 2026-08 period is PAID with net_payment_usd 115096.03 already disbursed."
            - "A granted hold-in petition has moved A1 to HOLD_IN and the Community to HOLD_IN, opening a REPLACEMENT solicitation with closes_at 2026-09-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
