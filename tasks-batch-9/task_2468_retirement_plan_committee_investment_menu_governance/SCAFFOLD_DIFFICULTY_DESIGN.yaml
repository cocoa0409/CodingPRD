              as: PlanSponsorAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Ugo Marchetti", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
