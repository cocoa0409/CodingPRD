      - name: a_retro_downgrade_larger_than_the_period_earnings_blocks_the_prepare
        claim_type: error_triggerable
        grounds:
          - validations[priority=55]
          - errors[ERR_NEGATIVE_NET_PAY]
          - calculations.retro_correction_delta
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - entities.RetroCorrection.fields.delta_gross_cents
        distinguishing_aspect: |
          A re-grade from PRACTICAL 780 to HHG 250 turns 46080 of already-paid linehaul into 14500, a
          delta_gross_cents of -31580, which is under RETRO_HOLD_THRESHOLD so it raises no settlement hold and is
          freely swept into the next DRAFT period. That period has no loads of its own, so the swept correction
          is the only line and net pay would be -31580: prepare must reject with ERR_NEGATIVE_NET_PAY at 422
          rather than store a negative settlement or clamp the total to zero. The correction stays APPLIED to a
          DRAFT settlement that never left DRAFT.
