      - name: missing_or_unknown_identity_headers_return_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - global_conventions.actor_identity
        distinguishing_aspect: "Priorities 1 and 2 sit above everything: a request with NO X-User-Role header, with an empty X-User-ID, or with a role string outside the five declared roles returns 401 ERR_UNAUTHENTICATED — never 403 and never a 404, even when the path id is also unknown. The `as:` value below names the role the request WOULD have carried; the recipe's point is that the header is absent or malformed."
        test_recipe:
          setup:
            - "One CERTIFIED CDE exists so the target path is otherwise resolvable."
            - "Header variants exercised, all against GET /nmtc/cdes/{id}: (a) X-User-Role header omitted entirely, (b) X-User-ID present but empty, (c) X-User-Role set to the undeclared value \"Auditor\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-129", service_area_scope: "STATEWIDE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
          trigger:
            - call: "GET /nmtc/cdes/${cde_id}"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/cdes/00000000-0000-4000-8000-0000000000e1"
              payload: {}
              as: CertifyingAgency
          assert:
            - "BASELINE — with both headers present and valid, GET /nmtc/cdes/${cde_id} returns 200 with certification_status == \"CERTIFIED\""
            - "VARIANT (a) — the same GET re-issued with the X-User-Role header OMITTED returns HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\""
            - "VARIANT (b) — the same GET re-issued with X-User-ID set to the empty string returns HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\""
            - "VARIANT (c) — the same GET re-issued with X-User-Role == \"Auditor\" returns HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\" (priority 2), NOT 403 ERR_ROLE_NOT_PERMITTED"
            - "PRECEDENCE — the second trigger's UNKNOWN cde id returns 404 ERR_CDE_NOT_FOUND when the headers are valid, but returns 401 ERR_UNAUTHENTICATED when re-issued with the role header omitted: authentication at priority 1 outranks path resolution at priority 6"

      - name: a_cde_sponsor_cannot_act_on_another_cdes_award
        claim_type: not_resource_owner
        grounds:
          - validations[priority=8]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.CDESponsor
        distinguishing_aspect: "CDESponsor identity is entity_backed:CDE, so ownership is a data comparison, not a role comparison: a second CDE holding its own award carries the correct role for every CDESponsor exclusive but is refused with 403 ERR_NOT_RESOURCE_OWNER on the first CDE's award — and ownership reaches transitively through QEI -> award -> cde."
        test_recipe:
          setup:
            - "Two CERTIFIED CDEs, each with its own ACTIVE award of 5,000,000,000 cents."
            - "CDE one has issued a QEI of 100,000,000 cents from its own funded fund."
          setup_api_calls:
