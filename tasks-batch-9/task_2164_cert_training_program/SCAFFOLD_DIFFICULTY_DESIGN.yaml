          setup:
            - "Tara GRADUATED with all three core modules PASSED, earned_contact_hours 10.0, passed_core_count 3"
            - "Credential minted and ACTIVE; Cohort C-2026A sitting in GRADUATION_REVIEW with graduation_reviewer_user_id coord-review-1"
            - "Program.pending_graduation_count is 1"
