  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: clawback_conserves_cycle_pool
        grounds:
          - state_machines.ComplianceAudit.FINDINGS_ISSUED_to_ESCALATED
          - entities.GrantCycle.fields.competitive_committed_cents
          - entities.GrantAward.fields.disbursed_cents
        distinguishing_aspect: |
          Conserved quantity: cycle headroom. Escalation with disallowance D
          credits D back to the cycle pools (competitive first, then formula)
          exactly as it debits award.disbursed_cents by D — invariant:
          (pools_committed - pools_released) + sum(award disbursed) is
          unchanged by the forward disburse + compensating clawback pair.
        test_recipe:
          setup:
            - "CHARTERED member m1, ACTIVE award aw1 (formula 60000 + competitive 40000 from score-80 application on request 50000), 80000 disbursed via one POSTED tranche, one SUBMITTED report"
