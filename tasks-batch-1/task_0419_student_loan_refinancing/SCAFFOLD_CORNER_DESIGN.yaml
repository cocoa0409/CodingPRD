scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (creation, retrieval, listing, required/default/
  # computed/system fields, type constraints, immutability, FK integrity)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_borrower_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST /borrowers
          - entities.Borrower.fields.member_tier
        distinguishing_aspect: "POST /borrowers with all required fields returns 201 and a Borrower whose member_tier defaults to NONE and version == 1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /borrowers"
              payload: { email: "corner.b1@x.com", full_name: "Corner B1", annual_income_cents: 9000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Borrower.${cb1_id}.member_tier == NONE"
            - "Borrower.${cb1_id}.version == 1"
            - "response data includes email, full_name, annual_income_cents, fico_band, id, created_at, updated_at"

      - name: get_borrower_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET /borrowers/{id}
          - entities.Borrower.fields.email
        distinguishing_aspect: "GET /borrowers/{id} returns the same email and full_name that were stored at creation."
        test_recipe:
          setup:
            - "A registered borrower."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b2@x.com", full_name: "Corner B2", annual_income_cents: 5000000, fico_band: "NEAR_PRIME" }
              as: Borrower
              captures: { cb2_id: $.data.id }
          trigger:
            - call: "GET /borrowers/${cb2_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP status == 200"
            - "Borrower.${cb2_id}.email == corner.b2@x.com"
            - "Borrower.${cb2_id}.full_name == Corner B2"

      - name: list_rate_grid_entries_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET /rate-grid-entries
        distinguishing_aspect: "GET /rate-grid-entries returns an array response_type with pagination fields total_count and has_more; two grid cells created yields total_count == 2."
        test_recipe:
          setup:
            - "Two rate grid cells created."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 700, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "VARIABLE", term_months: 84, min_fico_band: "PRIME", base_apr_bps: 500, index_apr_bps: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /rate-grid-entries"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "response_type == array"
            - "response meta.total_count == 2"
            - "response has_more == false"

      - name: get_borrower_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET /borrowers/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /borrowers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB except an admin actor."
          setup_api_calls: []
          trigger:
            - call: "GET /borrowers/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_application_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST /applications
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applications omitting required requested_principal_cents returns ERR_INVALID_REQUEST (400), no Application created."
        test_recipe:
          setup:
            - "A registered borrower."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b3@x.com", full_name: "Corner B3", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb3_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "${cb3_id}", requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_application_non_positive_principal_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST /applications
          - validations[priority=16]
          - entities.Application.fields.requested_principal_cents
        distinguishing_aspect: "POST /applications with requested_principal_cents == 0 violates the >0 constraint and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A registered borrower."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b4@x.com", full_name: "Corner B4", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb4_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "${cb4_id}", requested_principal_cents: 0, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb4_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_application_invalid_enum_term_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST /applications
          - validations[priority=16]
          - entities.Application.fields.requested_term_months
        distinguishing_aspect: "POST /applications with requested_term_months == 72 (not in {60,84,120,180,240}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A registered borrower."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b5@x.com", full_name: "Corner B5", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb5_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "${cb5_id}", requested_principal_cents: 4000000, requested_term_months: 72, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb5_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: rate_grid_entry_index_apr_default_zero_when_omitted
        claim_type: Defaults
        grounds:
          - endpoints.POST /rate-grid-entries
          - entities.RateGridEntry.fields.index_apr_bps
        distinguishing_aspect: "POST /rate-grid-entries omitting index_apr_bps applies the declared default 0."
        test_recipe:
          setup:
            - "Empty DB except an admin actor."
          setup_api_calls: []
          trigger:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "PRIME", base_apr_bps: 600 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rg_id: $.data.id }
          assert:
            - "RateGridEntry.${rg_id}.index_apr_bps == 0 (default applied)"

      - name: abs_pool_system_fields_committed_zero_status_open
        claim_type: System Fields
        grounds:
          - endpoints.POST /abs-pools
          - entities.AbsPool.fields.committed_principal_cents
          - entities.AbsPool.fields.status
        distinguishing_aspect: "POST /abs-pools initializes committed_principal_cents to 0 and status to OPEN regardless of any client-supplied values for those system/computed fields."
        test_recipe:
          setup:
            - "Empty DB except an admin actor."
          setup_api_calls: []
          trigger:
            - call: "POST /abs-pools"
              payload: { pool_code: "CORNER-POOL-1", max_principal_cents: 10000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { pool_id: $.data.id }
          assert:
            - "AbsPool.${pool_id}.committed_principal_cents == 0"
            - "AbsPool.${pool_id}.status == OPEN"

      - name: rate_grid_entry_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.RateGridEntry
        distinguishing_aspect: "RateGridEntry has common_fields:false — its create response carries id and created_at but no version field, and §1.5 declares no update endpoint for it."
        test_recipe:
          setup:
            - "Empty DB except an admin actor."
          setup_api_calls: []
          trigger:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 180, min_fico_band: "NEAR_PRIME", base_apr_bps: 800, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rg2_id: $.data.id }
          assert:
            - "RateGridEntry.${rg2_id} response includes id and created_at"
            - "RateGridEntry.${rg2_id} response has no version field"

      - name: application_borrower_fk_nonexistent_returns_404
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST /applications
          - entities.Application.fields.borrower_id
          - validations[priority=3]
        distinguishing_aspect: "POST /applications with a borrower_id FK that resolves to no Borrower returns ERR_NOT_FOUND (404) (flat-topology FK integrity)."
        test_recipe:
          setup:
            - "Empty DB except a borrower actor."
          setup_api_calls: []
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "00000000-0000-4000-8000-0000000000bb", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "00000000-0000-4000-8000-0000000000bb"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: cosigner_consent_status_initial_invited
        claim_type: Computed Fields
        grounds:
          - endpoints.POST /cosigners
          - entities.Cosigner.fields.consent_status
          - entities.Cosigner.fields.on_time_streak
        distinguishing_aspect: "A freshly invited Cosigner is created with consent_status INVITED and on_time_streak 0 (system-initialized), regardless of any client input for those fields."
        test_recipe:
          setup:
            - "A DRAFT application owned by a borrower."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b6@x.com", full_name: "Corner B6", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb6_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb6_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb6_id}"
              captures: { capp6_id: $.data.id }
          trigger:
            - call: "POST /cosigners"
              payload: { application_id: "${capp6_id}", cosigner_email: "corner.c6@x.com", cosigner_annual_income_cents: 3000000 }
              as: Borrower
              as_user_id: "${cb6_id}"
              captures: { ccos6_id: $.data.id }
          assert:
            - "Cosigner.${ccos6_id}.consent_status == INVITED"
            - "Cosigner.${ccos6_id}.on_time_streak == 0"

  # ===========================================================================
  # SECTION 2 — State Machines (valid transitions, invalid-from rejection,
  # initial/terminal lockdown, idempotency, parallel dimensions)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: prequalify_from_draft_moves_to_prequalified
        claim_type: Valid Transition
        grounds:
          - state_machines.Application.DRAFT_to_PREQUALIFIED
          - endpoints.POST /applications/{id}/prequalify
        distinguishing_aspect: "POST /applications/{id}/prequalify on a DRAFT application sets status to PREQUALIFIED and sets soft_pull_fico_band from the soft pull."
        test_recipe:
          setup:
            - "A DRAFT application; a matching FIXED 60-month grid cell exists so prequalify can mint an offer."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b7@x.com", full_name: "Corner B7", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb7_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb7_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb7_id}"
              captures: { capp7_id: $.data.id }
          trigger:
            - call: "POST /applications/${capp7_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb7_id}"
          assert:
            - "Application.${capp7_id}.status == PREQUALIFIED"
            - "Application.${capp7_id}.soft_pull_fico_band == NEAR_PRIME (PRIME corrected one notch toward center)"

      - name: prequalify_from_draft_twice_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Application.DRAFT_to_PREQUALIFIED
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling prequalify a second time on an already-PREQUALIFIED application returns ERR_INVALID_STATE (409); status precondition rejects the duplicate."
        test_recipe:
          setup:
            - "A PREQUALIFIED application (one prequalify already applied)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b8@x.com", full_name: "Corner B8", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb8_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb8_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb8_id}"
              captures: { capp8_id: $.data.id }
            - call: "POST /applications/${capp8_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb8_id}"
          trigger:
            - call: "POST /applications/${capp8_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb8_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: approve_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /applications/{id}/approve on a DRAFT application (approve is only defined from UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFT application that was never prequalified or locked."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "corner.b9@x.com", full_name: "Corner B9", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb9_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb9_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb9_id}"
              captures: { capp9_id: $.data.id }
          trigger:
            - call: "POST /applications/${capp9_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-corner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: withdraw_from_approved_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdraw is only defined from {DRAFT, PREQUALIFIED, UNDER_REVIEW}; withdrawing an APPROVED application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An APPROVED application (locked offer, approved by an underwriter)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b10@x.com", full_name: "Corner B10", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb10_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb10_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb10_id}"
              captures: { capp10_id: $.data.id, capp10_ver: $.data.version }
            - call: "POST /applications/${capp10_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb10_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp10_id}" }
              as: Borrower
              as_user_id: "${cb10_id}"
              captures: { coffer10_id: "$.data[0].id" }
            - call: "POST /offers/${coffer10_id}/lock"
              payload: { expected_application_version: "${capp10_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb10_id}"
            - call: "POST /applications/${capp10_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-corner-2"
          trigger:
            - call: "POST /applications/${capp10_id}/withdraw"
              payload: {}
              as: Borrower
              as_user_id: "${cb10_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cosigner_consent_from_declined_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Cosigner.INVITED_to_DECLINED
          - state_machines.Cosigner.INVITED_to_CONSENTED
          - validations[priority=4]
        distinguishing_aspect: "DECLINED is a terminal Cosigner state; POST /cosigners/{id}/consent on a DECLINED cosigner returns ERR_INVALID_STATE (409), no transition out of terminal."
        test_recipe:
          setup:
            - "A Cosigner already DECLINED on a prequalified application."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b11@x.com", full_name: "Corner B11", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb11_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb11_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb11_id}"
              captures: { capp11_id: $.data.id }
            - call: "POST /cosigners"
              payload: { application_id: "${capp11_id}", cosigner_email: "corner.c11@x.com", cosigner_annual_income_cents: 2000000 }
              as: Borrower
              as_user_id: "${cb11_id}"
              captures: { ccos11_id: $.data.id }
            - call: "POST /cosigners/${ccos11_id}/decline"
              payload: {}
              as: Cosigner
              as_user_id: "${ccos11_id}"
          trigger:
            - call: "POST /cosigners/${ccos11_id}/consent"
              payload: {}
              as: Cosigner
              as_user_id: "${ccos11_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: disbursement_confirm_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Disbursement.SENT_to_CONFIRMED
          - validations[priority=4]
        distinguishing_aspect: "confirm is only defined from SENT; POST /disbursements/{id}/confirm on a SCHEDULED disbursement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A SCHEDULED disbursement on a funded loan (never sent)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /abs-pools"
              payload: { pool_code: "CORNER-POOL-CFM", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b12@x.com", full_name: "Corner B12", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { cb12_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb12_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb12_id}"
              captures: { capp12_id: $.data.id, capp12_ver: $.data.version }
            - call: "POST /applications/${capp12_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb12_id}"
            - call: "GET /offers"
              payload: { application_id: "${capp12_id}" }
              as: Borrower
              as_user_id: "${cb12_id}"
              captures: { coffer12_id: "$.data[0].id" }
            - call: "POST /offers/${coffer12_id}/lock"
              payload: { expected_application_version: "${capp12_ver}", autopay_elected: false }
              as: Borrower
              as_user_id: "${cb12_id}"
            - call: "POST /applications/${capp12_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-corner-3"
            - call: "POST /applications/${capp12_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-corner-3"
              captures: { cloan12_id: $.data.id }
            - call: "POST /disbursements"
