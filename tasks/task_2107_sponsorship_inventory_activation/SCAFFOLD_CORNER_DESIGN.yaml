              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "North LED Ribbon", asset_class: "DIGITAL_BOARD", capacity_units: 6 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { asset_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { sponsor_id: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${sponsor_id}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", exclusivity_scope: "CATEGORY" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/entitlements"
              payload: { inventory_asset_id: "${asset_id}", clause_ref: "4.2(a)", promised_units: 10 }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { ent_id: $.data.id }
            - call: "POST /contracts/${contract_id}/submit"
              payload: {}
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "GET /properties/${prop_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { prop_v: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/countersign"
              payload: { expected_property_version: "${prop_v}" }
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { r_gross: $.data.gross_entitlement_value_cents, r_cash: $.data.cash_value_cents, r_total: $.data.total_recognized_value_cents, r_card: $.data.rate_card_id }
            - call: "GET /contracts/${contract_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { g_gross: $.data.gross_entitlement_value_cents, g_cash: $.data.cash_value_cents, g_total: $.data.total_recognized_value_cents, g_card: $.data.rate_card_id }
            - call: "GET /properties/${prop_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { p_committed: $.data.committed_gross_value_cents, p_v_after: $.data.version }
            - call: "GET /entitlements/${ent_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { e_unit: $.data.unit_value_cents }
          assert:
            - "${r_gross} == 3375000"
            - "${r_cash} == 3105000"
            - "${r_total} == 3105000"
            - "${r_card} == ${rc_id}"
            - "${g_gross} == ${r_gross}"
            - "${g_cash} == ${r_cash}"
            - "${g_total} == ${r_total}"
            - "${g_card} == ${r_card}"
            - "${p_committed} == 3105000"
            - "${e_unit} == 337500"
            - "${p_v_after} > ${prop_v}"
