          setup:
            - "domestic registry, capacity-1 center, donor D1, patient; case CLEARED, PBSC method, conditioning SCHEDULED 2026-10-05 then STARTED, booking 2026-10-11T08:00:00Z CONFIRMED"
            - "clock walked 2026-09-11T08:00:00Z -> 2026-10-05T06:00:00Z -> 2026-10-11T13:00:00Z"
