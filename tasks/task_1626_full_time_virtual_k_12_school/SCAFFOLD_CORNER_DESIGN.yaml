  - section: endpoints
    instances:
      - name: enrollment_term_created_on_enroll
        claim_type: side_effect_execution
        grounds:
          - endpoints."POST /vks/students/{id}/enroll"
          - state_machines.Student.ELIGIBLE_to_ENROLLED
        distinguishing_aspect: "POST /vks/students/{id}/enroll creates a new EnrollmentTerm with term_start_date = clock date and term_status=ACTIVE"
        test_recipe:
          setup: ["Student S ELIGIBLE"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-140", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "ET", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "GET /vks/students/${student_id}/enrollment-terms"
              payload: {}
              as: EnrollmentOfficer
          assert:
            - "exactly one EnrollmentTerm exists for the student"
            - "EnrollmentTerm.term_status == ACTIVE"
            - "EnrollmentTerm.term_start_date == 2026-08-03"
      - name: assessment_window_list_filter_by_status
        claim_type: listing
        grounds:
          - endpoints."GET /vks/assessment-windows"
        distinguishing_aspect: "GET /vks/assessment-windows?window_status=SCHEDULED filters correctly"
        test_recipe:
          setup: ["Two windows created; clock is before both window_starts"]
          setup_api_calls:
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/assessment-windows"
              payload: { assessment_name: "W1", subject: "ELA", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: ProctorCoordinator
            - call: "POST /vks/assessment-windows"
              payload: { assessment_name: "W2", subject: "MATH", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-17T17:00:00Z" }
              as: ProctorCoordinator
          trigger:
            - call: "GET /vks/assessment-windows"
              payload: { window_status: "SCHEDULED" }
              as: ProctorCoordinator
          assert:
            - "all returned rows have window_status == SCHEDULED"
      - name: withdraw_sets_term_end_date_to_day_before
        claim_type: side_effect_execution
        grounds:
          - endpoints."POST /vks/students/{id}/withdraw"
          - state_machines.Student.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: "on withdraw, term_end_date is set to current clock date minus 1 day (exclusive of withdraw day)"
        test_recipe:
          setup: ["Student S enrolled on 2026-08-03; clock advanced to 2026-08-10"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-141", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
