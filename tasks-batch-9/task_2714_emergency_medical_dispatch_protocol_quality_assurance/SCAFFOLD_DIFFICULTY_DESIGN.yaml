            - call: "POST /protocol-versions/${pv1_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.1", effective_from: "2026-09-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
