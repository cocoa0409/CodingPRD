      - name: withdrawal_branching_fork_join_paths
        claim_type: branching
        grounds:
          - state_machines.WithdrawalRequest.DRAFT_to_APPROVED
          - state_machines.WithdrawalRequest.DRAFT_to_VOTE_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / withdrawal_request_forks_into_two_approval_branches_with_disjoint_effects
          rationale: "Both forks of the WithdrawalRequest machine, their disjoint side-effect sets and their divergent authorized_amount_cents are asserted by the named §1.8 instance."

      - name: consensus_round_open_guarded_by_cycle_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.ForecastCycle.INPUTS_LOCKED_to_IN_CONSENSUS
          - validations[priority 10 ERR_CYCLE_NOT_LOCKED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / consensus_round_open_depends_on_forecast_cycle_being_locked
          rationale: "The cross-entity guard (round creation legal only once the cycle left DRAFT) is asserted in both directions by the named §1.8 instance."

      - name: certification_cascades_down_to_fund_and_briefings
        claim_type: cascade_down
        grounds:
          - state_machines.ForecastCycle.CONSENSUS_REACHED_to_CERTIFIED
          - state_machines.RatingAgencyBriefing.PUBLISHED_to_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / certification_cascades_deposit_then_cap_posture_then_briefing_staleness
          rationale: "The four-link certification cascade and its ordering are asserted end-to-end by the named §1.8 instance."

      - name: withdrawal_reversal_compensates_original_side_effects
        claim_type: compensation
        grounds:
          - endpoints[POST /reserve-transactions/{id}/reverse]
          - entities.ReserveFund.fields.fy_withdrawn_cents
        excluded_because:
          difficulty_instance: compensating_invariant / fund_ledger_identity_conserved_across_withdrawal_and_reversal
          rationale: "The compensation path (balance restored, fy_withdrawn_cents released, no drift) is asserted by the named §1.8 instance."

  # ===========================================================================
  # SECTION 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: shortfall_below_150_bps_rejects_verify_shortfall
        claim_type: threshold
        grounds:
          - calculations.shortfall_trigger
          - validations[priority 34 ERR_SHORTFALL_NOT_TRIGGERED]
          - endpoints[POST /withdrawal-requests/{id}/verify-shortfall]
        distinguishing_aspect: |
          shortfall_pct_bps is FLOORed, so the FULL chain against an enacted appropriation of
          1625295708 measures 149 bps (gap 24379435) — one bp under the 150 bps statutory trigger —
          and verify-shortfall returns ERR_SHORTFALL_NOT_TRIGGERED 422 with the request still DRAFT
          and authorized_amount_cents null.
        test_recipe:
          setup:
            - "FULL chain certified, but with enacted_appropriation_cents 1625295708 instead of 1650000000: certified_total_cents 1600916273 gives shortfall_gap_cents 24379435 and shortfall_pct_bps floor(243794350000 / 1625295708) = 149."
            - "One GROWTH_ABOVE_TREND fund (opening 0) and one DRAFT SHORTFALL_TRIGGER withdrawal request against the certified cycle."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
