          assert:
            - "RoyaltyStatement.${st_id}.total_sales_cents == 100000"
            - "RoyaltyStatement.${st_id}.total_royalty_cents == 20000 (base tier: day_gross >= 100000 but not > 250000; per-line round_half_up of 2000 and 18000)"

      - name: callup_readiness_circular_evaluation_order
        grounds:
          - calculations.callup_readiness_score
          - calculations.wellness_score_accrual
          - entities.CallUpDecision.fields.readiness_score
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the readiness score consumes
          wellness_score, which is itself mutated by the same fulfilled bookings
          that feed the score's W_FULFILLED term — the scaffold pins evaluation
          order (bookings counted first, wellness read after accrual), yielding
          score 42 = 3*4 + round_half_up(59.00*0.5).
        test_recipe:
          setup:
            - "DEVELOPMENTAL talent T with exactly three FULFILLED house-show bookings in the trailing 90 days and no no-shows (wellness 50.00 + 3*3.00 == 59.00)"
            - "Logical clock at 2026-09-10 so all three shows fall inside the trailing window"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Dev Kid", legal_name: "Dev Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/arenas"
