            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv_draft: "$.data.version" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv_draft}" }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
