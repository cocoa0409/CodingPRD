            - "the 09:00-10:00 request returns HTTP 409 with ${error_id} == ERR_ASSET_CAPACITY_EXCEEDED because 09:00 <= 09:00 and 08:00 <= 10:00 on closed intervals with capacity 1"
            - "that refused leg would have projected only 285 minutes, far inside the 1080 limit, so CIT is not the gate"
            - "Organ.${organ2_id}.transport_asset_id was still null after the refusal"
            - "the 09:01-11:00 request returns HTTP 200 with ${leg2_projection} == 345 and ${leg2_margin} == 735"
            - "Organ.${organ2_id}.transport_asset_id == ${asset_id} and status == RECOVERED"

  - rule_id: compensating_invariant
    instances:
      - name: recovery_team_or_minutes_ledger_returns_to_zero_on_cancel
        grounds:
          - state_machines.RecoveryOperation.SCHEDULED_to_CANCELLED
          - entities.RecoveryTeam.fields.booked_or_minutes
          - entities.RecoveryTeam.fields.scheduled_operation_count
          - endpoints[POST /opo/recovery-operations/{id}/cancel]
        distinguishing_aspect: |
          Conserved quantity 1 - the RecoveryTeam OR-minutes ledger: booking moves booked_or_minutes
          0 -> 240 and scheduled_operation_count 0 -> 1, and the compensating cancel returns both to
          exactly 0 with no drift, so the ledger always equals the sum of or_minutes over the team's
          non-CANCELLED operations.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-27T07:00:00Z."
            - "An AUTHORIZED DonorCase with one ACCEPTED LIVER organ and an ABDOMINAL team whose ledger is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T07:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "ABD-5", specialty: "ABDOMINAL", turnaround_buffer_minutes: 90 }
              as: OpoAdmin
              captures: { team_id: $.data.id, ledger_start: $.data.booked_or_minutes }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-9101", age_years: 39, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-27T06:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["BLOOD_TRANSFUSION_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-9101" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-9101" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v: $.data.version }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v}", primary_offer_slots: 1, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "POST /opo/match-runs/${run_id}/offers/${offer_id}/respond"
              payload: { decision: "ACCEPT" }
              as: AllocationSpecialist
              as_user_id: "alloc-1"
          trigger:
            - call: "POST /opo/donor-cases/${case_id}/recovery-operations"
              payload: { recovery_team_id: "${team_id}", or_start_at: "2026-08-27T08:00:00Z", or_end_at: "2026-08-27T12:00:00Z" }
              as: RecoveryLogistics
              captures: { op_id: $.data.id, op_minutes: $.data.or_minutes }
            - call: "GET /opo/recovery-teams/${team_id}"
              payload: {}
              as: OpoAdmin
              captures: { ledger_booked: $.data.booked_or_minutes, count_booked: $.data.scheduled_operation_count }
            - call: "POST /opo/recovery-operations/${op_id}/cancel"
              payload: {}
              as: RecoveryLogistics
              captures: { op_state: $.data.status, op_reason: $.data.cancelled_reason }
            - call: "GET /opo/recovery-teams/${team_id}"
              payload: {}
              as: OpoAdmin
              captures: { ledger_end: $.data.booked_or_minutes, count_end: $.data.scheduled_operation_count }
          assert:
            - "${ledger_start} == 0 and ${op_minutes} == 240"
            - "${ledger_booked} == 240 and ${count_booked} == 1"
            - "${op_state} == CANCELLED and ${op_reason} == LOGISTICS_WITHDRAWN"
            - "${ledger_end} == 0 and ${count_end} == 0 - the compensation is exact, not approximate"
            - "Organ.${organ_id}.status == ACCEPTED and DonorCase.${case_id}.allocation_status == ALLOCATED: the cancel touched only the OR ledger"
            - "booked_or_minutes equals the sum of or_minutes over the team's non-CANCELLED operations (0) at both ends"

      - name: allocation_slot_conservation_across_acceptance_withdrawal
        grounds:
          - calculations.offer_promotion_selector
          - state_machines.OrganOffer.ACCEPTED_to_WITHDRAWN
          - state_machines.OrganOffer.BYPASSED_to_QUEUED
          - state_machines.MatchRun.CLOSED_to_OPEN
          - entities.MatchRun.fields.slots_free
        distinguishing_aspect: |
          A different conserved quantity on a different entity - the allocation slot ledger
          pending_offer_count + slots_free == primary_offer_slots (2) - holds after the initial fill
          (2 + 0), after the acceptance that bypasses the peers (0 + 2) and after the compensating
          WITHDRAW_ACCEPTANCE that restores the PEER_ACCEPTED bypasses to QUEUED and re-promotes them
          (2 + 0), with organs_accepted_count returning to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-28T09:00:00Z."
            - "An AUTHORIZED DonorCase with a LIVER organ OFFERING on an OPEN match run of three candidates and primary_offer_slots 2."
