          - errors[ERR_CASE_OUTSIDE_BLOCK_WINDOW]
        distinguishing_aspect: "Containment is checked against both ends of the half-open block window: a case starting inside the block but ending 30 minutes after block_end is refused, while a case ending exactly at block_end is accepted."
