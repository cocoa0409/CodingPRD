              captures: { f_id: "$.data.id" }
          trigger:
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-01", member_id: "${m_id}", funder_id: "${f_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MAJOR_GIFT", amount_cents: 250000, received_date: "2026-08-01", member_id: "${m_id}", funder_id: "${f_id}" }
