            - "Trip Alpha variant base 80000 deposit 50000 capacity 30 (provisional share 80000, no lodging); reg1 APPROVED with deposit 50000 paid; clock advanced past deposit_due (no delinquency: deposit covered), then past final_payment_due with 30000 outstanding"
