  - section: calculations
    instances:
      - name: green_to_dry_shrink_constant_per_density_class
        claim_type: constants_applied
        grounds: ["calculations.dry_yield_conversion.constants.GREEN_TO_DRY_SHRINK_PCT", "entities.SpeciesProfile.green_to_dry_shrink_pct"]
        distinguishing_aspect: "The three density classes pick 7.5, 6.0 and 5.0 percent respectively; the field is a lookup on density_class alone and never on the shrinkage coefficient."
        test_recipe:
          setup: ["Empty database with the logical clock pinned."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "WHITE_ASH", common_name: "White Ash", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.150, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin }
