          - errors[ERR_NO_PREFERRED_PORTFOLIO]
        distinguishing_aspect: "submit-for-review with all portfolios non-preferred fails ERR_NO_PREFERRED_PORTFOLIO (422) even after the comment window has closed."
        test_recipe:
