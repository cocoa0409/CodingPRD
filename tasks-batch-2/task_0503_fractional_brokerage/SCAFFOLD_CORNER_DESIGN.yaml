              as: AccountHolder
              as_user_id: "${acc_own}"
              captures: { err_own: $.data.error_id }
          assert:
            - "Response status 403 and data.error_id == ERR_FORBIDDEN (acting holder ${acc_own} != target account ${acc_other})"

