              payload: { production_run_id: "${r2}" }
              as: QualityManager
              as_user_id: "qual-001"
              captures: { lc_grade: "$.data[0].grade", lc_cdi: "$.data[0].position_cdi", lc_color: "$.data[0].color_index", lc_status: "$.data[0].status" }
