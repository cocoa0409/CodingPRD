      - name: final_denial_cascade_unfunds_episode_and_terminates_enrollment
        grounds:
          - state_machines.Authorization.SUBMITTED_to_DENIED
          - state_machines.TherapyEpisode.funding_state.PENDING_AUTH_to_UNFUNDED
          - state_machines.AssistanceEnrollment.ACTIVE_to_TERMINATED
          - entities.PayerPlan.fields.appeal_rounds_allowed
        distinguishing_aspect: |
          Depth 3 and a different triggering transition (Authorization SUBMITTED -> DENIED rather
          than a monitoring-lab POST). Link 1: the third determination denies the authorization at
          appeal_round 2. Link 2 is caused by link 1 reaching the plan's appeal_rounds_allowed
          ceiling — only then does TherapyEpisode.funding_state move PENDING_AUTH -> UNFUNDED
          (the two earlier denials left it at PENDING_AUTH, so the cascade is provably driven by
          the ceiling and not by the DENIED decision itself). Link 3 is caused by link 2: an
          UNFUNDED episode terminates its non-TERMINATED enrollments with termination_reason
          FUNDING_DENIED.
        test_recipe:
