# =============================================================================
# Task 1892: Nutrition Labeling & Regulatory Review — scaffold seed tables
# =============================================================================

scenario: |
  1892. Nutrition Labeling & Regulatory Review (food labeling consultancy): recipe-to-nutrient database calculation vs lab analysis, serving size (RACC) determination, claim eligibility (low/high/free) verification, allergen & ingredient statement ordering, format compliance by package size, state/foreign market variant, label change control & version release, audit of on-pack vs approved artwork

domain_name: nutrition-labeling-regulatory-review
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Product.version for label draft supersede + release
    - cascading_side_effects        # lab-validation and recipe-lock cascades span 4 entity types
    - dual_variant_calculation      # DATABASE vs LAB panels; US_FDA vs CA_CFIA serving rounding; BINARY vs WEIGHTED audit scoring
    - version_pinning_on_approval   # LabelVersion pins panel snapshot + RACC assignment at submit-review; staleness flips content_status
  entity_topology: flat             # peer entities linked by FK fields; creation via parent-scoped POSTs, reads flat
  state_machine_shape: parallel     # LabelVersion carries review_status x release_status; other machines cyclic/branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # ArtworkAudit references Client + Product + LabelVersion
  role_model: segregation_of_duties # label approver must differ from preparing analyst
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client (food manufacturer) display name" }
      - { name: home_market_code, type: enum, source: input, description: "Primary market: US_FDA | CA_CFIA" }

  - name: Product
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (path-scoped)" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: product_category, type: enum, source: input, description: "BAKED_GOOD | BEVERAGE | CEREAL | SNACK | DAIRY | SAUCE | CONFECTION | FROZEN_DESSERT — drives RACC lookup" }
      - { name: net_weight_g, type: number, source: input, description: "Net contents in grams; > 0" }
      - { name: household_unit_name, type: string, source: input, required: false, description: "Household measure unit (e.g., piece, tbsp); required for US_FDA serving computation" }
      - { name: household_unit_weight_g, type: number, source: input, required: false, description: "Gram weight of one household unit; > 0; required for US_FDA serving computation" }
      - { name: total_surface_area_sq_in, type: number, source: input, description: "Total package surface area; > 0; drives format tier" }
      - { name: pdp_area_sq_in, type: number, source: input, description: "Principal display panel area; > 0; drives minimum type size" }

  - name: Ingredient
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (path-scoped)" }
      - { name: name, type: string, source: input, description: "Ingredient declaration name" }
      - { name: allergen_tags, type: array, source: input, default: [], description: "Subset of MILK | EGGS | FISH | SHELLFISH | TREE_NUTS | PEANUTS | WHEAT | SOYBEAN | SESAME" }
      - { name: kcal_per_100g, type: number, source: input, required: false, description: "Database calories per 100g; null => profile incomplete" }
      - { name: fat_g_per_100g, type: number, source: input, required: false, description: "Database total fat g per 100g; null => profile incomplete" }
      - { name: satfat_g_per_100g, type: number, source: input, required: false, description: "Database saturated fat g per 100g; null => profile incomplete" }
      - { name: chol_mg_per_100g, type: number, source: input, required: false, description: "Database cholesterol mg per 100g; null => profile incomplete" }
      - { name: sodium_mg_per_100g, type: number, source: input, required: false, description: "Database sodium mg per 100g; null => profile incomplete" }
      - { name: carb_g_per_100g, type: number, source: input, required: false, description: "Database total carbohydrate g per 100g; null => profile incomplete" }
      - { name: fiber_g_per_100g, type: number, source: input, required: false, description: "Database dietary fiber g per 100g; null => profile incomplete" }
      - { name: sugar_g_per_100g, type: number, source: input, required: false, description: "Database total sugars g per 100g; null => profile incomplete" }
      - { name: protein_g_per_100g, type: number, source: input, required: false, description: "Database protein g per 100g; null => profile incomplete" }

  - name: Recipe
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; parent product (path-scoped)" }
      - { name: name, type: string, source: input, description: "Formulation label (e.g., v3-reduced-sugar)" }
      - { name: yield_factor, type: number, source: input, default: 1.0, description: "Cooked/finished mass divided by raw mass; 0 < y <= 1.2" }
      - { name: lines, type: array, source: input, description: "Formulation lines: [{ingredient_id, quantity_g}]; quantity_g > 0; at least 1 line; ingredient_ids distinct" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | SUPERSEDED" }
      - { name: latest_validated_lab_analysis_id, type: string, source: system, required: false, description: "FK -> LabAnalysis.id; most recent VALIDATED lab analysis (null until first validation)" }

  - name: LabAnalysis
    parent: Recipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: system, description: "FK -> Recipe.id; parent recipe (path-scoped)" }
      - { name: lab_report_ref, type: string, source: input, description: "External lab report reference" }
      - { name: kcal_per_100g, type: number, source: input, description: "Lab-measured calories per 100g (up to 3 decimal places)" }
      - { name: fat_g_per_100g, type: number, source: input, description: "Lab-measured total fat g per 100g" }
      - { name: satfat_g_per_100g, type: number, source: input, description: "Lab-measured saturated fat g per 100g" }
      - { name: chol_mg_per_100g, type: number, source: input, description: "Lab-measured cholesterol mg per 100g" }
      - { name: sodium_mg_per_100g, type: number, source: input, description: "Lab-measured sodium mg per 100g" }
      - { name: carb_g_per_100g, type: number, source: input, description: "Lab-measured carbohydrate g per 100g" }
      - { name: fiber_g_per_100g, type: number, source: input, description: "Lab-measured fiber g per 100g" }
      - { name: sugar_g_per_100g, type: number, source: input, description: "Lab-measured total sugars g per 100g" }
      - { name: protein_g_per_100g, type: number, source: input, description: "Lab-measured protein g per 100g" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | REJECTED | SUPERSEDED" }
      - { name: reviewed_by, type: string, source: system, required: false, description: "X-User-ID of reviewing RegulatoryReviewer" }

  - name: NutrientPanel
    parent: Recipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: system, description: "FK -> Recipe.id; parent recipe (path-scoped)" }
      - { name: method, type: enum, source: input, description: "DATABASE (recipe-to-nutrient-db) | LAB (latest VALIDATED lab analysis)" }
      - { name: status, type: enum, source: system, description: "CURRENT | STALE" }
      - { name: basis_lab_analysis_id, type: string, source: system, required: false, description: "FK -> LabAnalysis.id; set when method=LAB" }
      - { name: kcal_per_100g, type: number, source: computed, description: "2dp round_half_up per-100g declared calories" }
      - { name: fat_g_per_100g, type: number, source: computed, description: "2dp declared fat per 100g" }
      - { name: satfat_g_per_100g, type: number, source: computed, description: "2dp declared saturated fat per 100g" }
      - { name: chol_mg_per_100g, type: number, source: computed, description: "2dp declared cholesterol per 100g" }
      - { name: sodium_mg_per_100g, type: number, source: computed, description: "2dp declared sodium per 100g" }
      - { name: carb_g_per_100g, type: number, source: computed, description: "2dp declared carbohydrate per 100g" }
      - { name: fiber_g_per_100g, type: number, source: computed, description: "2dp declared fiber per 100g" }
      - { name: sugar_g_per_100g, type: number, source: computed, description: "2dp declared sugars per 100g" }
      - { name: protein_g_per_100g, type: number, source: computed, description: "2dp declared protein per 100g" }

  - name: RaccAssignment
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; parent product (path-scoped)" }
      - { name: market_code, type: enum, source: input, description: "US_FDA | CA_CFIA — selects RACC table + rounding variant" }
      - { name: racc_g, type: number, source: computed, description: "Reference amount customarily consumed, grams, from market RACC table by product_category" }
      - { name: label_mode, type: enum, source: computed, description: "SINGLE_SERVING | DUAL_COLUMN | STANDARD from net_weight_g / racc_g ratio" }
      - { name: serving_size_g, type: number, source: computed, description: "Declared serving size in grams after market rounding variant" }
      - { name: serving_household_units, type: number, source: computed, description: "Household units per serving (US_FDA: 0.5-step rounding)" }
      - { name: servings_per_container, type: number, source: computed, description: "Declared servings per container after FDA-style count rounding" }

  - name: LabelVersion
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; parent product (path-scoped)" }
      - { name: market_code, type: enum, source: input, description: "US_FDA | CA_CFIA — market this label artwork targets" }
      - { name: nutrient_basis, type: enum, source: input, description: "DATABASE | LAB — which panel method this label declares" }
      - { name: racc_assignment_id, type: string, source: input, description: "FK -> RaccAssignment.id; pinned serving-size determination (market must match)" }
      - { name: declared_format, type: enum, source: input, description: "STANDARD_VERTICAL | SIMPLIFIED | TABULAR | LINEAR — nutrition panel format on artwork" }
      - { name: declared_type_size_in, type: number, source: input, description: "Smallest nutrient type size on artwork, inches; > 0" }
      - { name: ingredient_statement_text, type: string, source: input, description: "Drafted descending-weight ingredient statement; validated at submit-review" }
      - { name: contains_text, type: string, source: input, description: "Drafted allergen Contains statement (e.g., 'Contains: Milk, Wheat.'); validated at submit-review" }
      - { name: review_status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | WITHDRAWN (parallel dimension 1)" }
      - { name: release_status, type: enum, source: system, description: "NOT_RELEASED | RELEASED | WITHDRAWN | SUPERSEDED (parallel dimension 2)" }
      - { name: content_status, type: enum, source: computed, description: "READY | NEEDS_REVISION — derived: NEEDS_REVISION when any claim SUSPENDED, or the product's LOCKED recipe changed (pinned basis superseded), or pinned panel STALE; FormatCheck failures do NOT affect content_status (they gate release via ERR_FORMAT_CHECK_FAILED)" }
      - { name: panel_snapshot_id, type: string, source: system, required: false, description: "FK -> NutrientPanel.id; panel pinned at submit-review" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Increments by 1 on each submit-review" }
      - { name: prepared_by, type: string, source: system, description: "X-User-ID of creating LabelAnalyst (segregation-of-duties anchor)" }
      - { name: approved_by, type: string, source: system, required: false, description: "X-User-ID of approving RegulatoryReviewer" }
      - { name: superseded_by_id, type: string, source: system, required: false, description: "FK -> LabelVersion.id; on SUPERSEDED release, the release that displaced it" }

  - name: ClaimAssessment
    parent: LabelVersion
    common_fields: true
    fields:
      - { name: label_version_id, type: string, source: system, description: "FK -> LabelVersion.id; parent label version (path-scoped)" }
      - { name: claim_type, type: enum, source: input, description: "LOW_FAT | FAT_FREE | LOW_SODIUM | HIGH_FIBER | SUGAR_FREE | LOW_CALORIE" }
      - { name: status, type: enum, source: system, description: "PENDING | ELIGIBLE | INELIGIBLE | NOT_REQUIRED | SUSPENDED" }
      - { name: evaluated_value_per_racc, type: number, source: computed, required: false, description: "Nutrient value per RACC (2dp half_up) used in threshold comparison; null when NOT_REQUIRED" }
      - { name: threshold_value, type: number, source: computed, required: false, description: "Threshold applied (per claim type constants); null when NOT_REQUIRED" }
      - { name: disqualified_by, type: enum, source: computed, required: false, description: "NONE | FAT | SATFAT | CHOL | SODIUM — first disqualifier hit per pinned order; null when NOT_REQUIRED" }
      - { name: basis_panel_id, type: string, source: system, required: false, description: "FK -> NutrientPanel.id; panel used for the latest evaluation" }

  - name: MarketVariant
    parent: LabelVersion
    common_fields: true
    fields:
      - { name: label_version_id, type: string, source: system, description: "FK -> LabelVersion.id; base label version (path-scoped)" }
      - { name: market_code, type: enum, source: input, description: "Target market US_FDA | CA_CFIA; must differ from base label's market_code" }
      - { name: effective_start, type: datetime, source: input, description: "Window start (inclusive), ISO8601 UTC" }
      - { name: effective_end, type: datetime, source: input, required: false, description: "Window end (exclusive), ISO8601 UTC; null = open-ended" }
      - { name: translated_contains_text, type: string, source: input, required: false, description: "Localized allergen statement for the target market" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: FormatCheck
    parent: LabelVersion
    common_fields: true
    fields:
      - { name: label_version_id, type: string, source: system, description: "FK -> LabelVersion.id; label evaluated (system-created at submit-review)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL" }
      - { name: violations, type: array, source: computed, description: "Subset of FORMAT_NOT_ALLOWED_FOR_PACKAGE | TYPE_SIZE_BELOW_MIN" }
      - { name: allowed_formats, type: array, source: computed, description: "Formats allowed by total_surface_area_sq_in tier" }
      - { name: min_type_size_in, type: number, source: computed, description: "Minimum type size from pdp_area_sq_in tier" }

  - name: ArtworkAudit
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; audited client (path-scoped)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product audited (must belong to client)" }
      - { name: label_version_id, type: string, source: input, description: "FK -> LabelVersion.id; approved artwork baseline (must belong to product and be RELEASED)" }
      - { name: facility_code, type: string, source: input, description: "Facility where on-pack sampling occurs; scheduling-conflict resource" }
      - { name: scheduled_start, type: datetime, source: input, description: "Audit window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Audit window end (inclusive); must be after start" }
      - { name: scoring_method, type: enum, source: input, default: WEIGHTED, description: "BINARY | WEIGHTED conformance scoring variant" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | FINDINGS_LOGGED | CLOSED" }
      - { name: conformance_score, type: number, source: computed, required: false, description: "Computed at close per scoring_method; null until CLOSED" }
      - { name: result, type: enum, source: computed, required: false, description: "PASS | FAIL; null until CLOSED" }

  - name: AuditFinding
    parent: ArtworkAudit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> ArtworkAudit.id; parent audit (path-scoped)" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: field_ref, type: enum, source: input, description: "INGREDIENT_LIST | CONTAINS_STATEMENT | NUTRITION_VALUES | SERVING_SIZE | CLAIM_TEXT | FORMAT" }
      - { name: on_pack_text, type: string, source: input, description: "Text observed on physical pack" }
      - { name: approved_text, type: string, source: input, description: "Text on the approved LabelVersion baseline" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /api/recipes/{id}/lock"
        actor: ClientRep
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "lines non-empty and every line ingredient exists and belongs to recipe's client (else ERR_NUTRIENT_PROFILE_INCOMPLETE not raised here; missing ingredient -> ERR_NOT_FOUND at create)"
        side_effects:
          - "Any sibling Recipe of same product_id currently LOCKED -> SUPERSEDED (system)"
          - "That superseded recipe's CURRENT NutrientPanels -> STALE (system)"
          - "ClaimAssessments on LabelVersions whose product_id matches and whose basis panel went STALE -> SUSPENDED (system)"
          - "Those LabelVersions' content_status recomputed -> NEEDS_REVISION (system)"
          - "increments Recipe.version by 1"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (a newer sibling Recipe of the same product is locked)"
        actor: system
        preconditions: []
        side_effects:
          - "This recipe's CURRENT NutrientPanels -> STALE"
          - "Dependent ClaimAssessments -> SUSPENDED; LabelVersions content_status recomputed"

  - entity: LabAnalysis
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /api/lab-analyses/{id}/review with outcome=VALIDATED"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_LAB_REVIEW_ALREADY_DECIDED)"
          - "parent Recipe status == LOCKED (else ERR_RECIPE_NOT_LOCKED)"
        side_effects:
          - "reviewed_by = X-User-ID"
          - "Recipe.latest_validated_lab_analysis_id = this analysis (Recipe mutated)"
          - "Any other VALIDATED LabAnalysis of same recipe -> SUPERSEDED (system)"
          - "That superseded analysis's derived NutrientPanels (method=LAB, basis_lab_analysis_id = superseded analysis) -> STALE (system)"
          - "ClaimAssessments whose basis_panel_id went STALE -> SUSPENDED (system)"
          - "LabelVersions with any newly SUSPENDED claim: content_status -> NEEDS_REVISION (system)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/lab-analyses/{id}/review with outcome=REJECTED"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_LAB_REVIEW_ALREADY_DECIDED)"
        side_effects:
          - "reviewed_by = X-User-ID"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system (another LabAnalysis of the same recipe is VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "NutrientPanels with basis_lab_analysis_id = this analysis -> STALE"

  - entity: NutrientPanel
    initial_state: CURRENT
    terminal_states: [STALE]
    transitions:
      - from: CURRENT
        to: STALE
        trigger: "system (basis lab analysis SUPERSEDED, or parent recipe SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "ClaimAssessments with basis_panel_id = this panel -> SUSPENDED"
          - "LabelVersions with panel_snapshot_id = this panel: content_status -> NEEDS_REVISION"

  - entity: ClaimAssessment
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system (synchronous evaluation at POST /api/label-versions/{id}/claims)"
        actor: system
        preconditions: ["market recognizes claim_type", "no disqualifier over limit", "evaluated_value_per_racc meets threshold"]
        side_effects: ["LabelVersion content_status recomputed"]
      - from: PENDING
        to: INELIGIBLE
        trigger: "system (synchronous evaluation at claim creation)"
        actor: system
        preconditions: ["market recognizes claim_type", "disqualifier over limit OR threshold not met"]
        side_effects: ["LabelVersion content_status recomputed"]
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "system (synchronous evaluation at claim creation)"
        actor: system
        preconditions: ["claim_type not regulated in label's market (CA_CFIA: SUGAR_FREE, LOW_CALORIE)"]
        side_effects: []
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system (basis panel went STALE via lab-validation or recipe-lock cascade)"
        actor: system
        preconditions: []
        side_effects: ["LabelVersion content_status -> NEEDS_REVISION"]
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "system (a new CURRENT NutrientPanel for the label's recipe + nutrient_basis is computed and evaluation passes)"
        actor: system
        preconditions: []
        side_effects:
          - "basis_panel_id updated to new panel"
          - "LabelVersion content_status recomputed (READY when no claim SUSPENDED, recipe not SUPERSEDED, pinned panel not STALE)"
      - from: SUSPENDED
        to: INELIGIBLE
        trigger: "system (re-evaluation on new CURRENT panel fails)"
        actor: system
        preconditions: []
        side_effects: ["LabelVersion content_status recomputed"]

  - entity: LabelVersion
    initial_state: "review_status=DRAFT, release_status=NOT_RELEASED"
    terminal_states: ["review_status=WITHDRAWN", "release_status=WITHDRAWN"]
    note: "Two parallel state dimensions on one entity. review_status: DRAFT | IN_REVIEW | APPROVED | WITHDRAWN. release_status: NOT_RELEASED | RELEASED | SUPERSEDED | WITHDRAWN. Gates couple the dimensions: release requires review_status=APPROVED and release_status=NOT_RELEASED."
    transitions:
      - from: "review_status=DRAFT"
        to: "review_status=IN_REVIEW"
        trigger: "POST /api/label-versions/{id}/submit-review"
        actor: LabelAnalyst
        preconditions:
          - "review_status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "parent Recipe (LabelVersion.product's recipe chosen at creation? no — the product's currently LOCKED recipe) status == LOCKED (else ERR_RECIPE_NOT_LOCKED)"
          - "a CURRENT NutrientPanel exists for the LOCKED recipe with method == nutrient_basis (else ERR_PANEL_NOT_CURRENT)"
          - "contains_text covers every allergen_tag present in the LOCKED recipe's lines (else ERR_ALLERGEN_STATEMENT_INCOMPLETE)"
          - "ingredient_statement_text equals canonical descending-weight ordering (else ERR_INGREDIENT_ORDER_VIOLATION)"
        side_effects:
          - "panel_snapshot_id = latest CURRENT NutrientPanel of recipe with method == nutrient_basis (latest by created_at)"
          - "review_round += 1"
          - "FormatCheck auto-created for this label version (format_compliance_evaluation)"
          - "content_status recomputed"
          - "increments LabelVersion.version by 1"
      - from: "review_status=IN_REVIEW"
        to: "review_status=APPROVED"
        trigger: "POST /api/label-versions/{id}/approve"
        actor: RegulatoryReviewer
        preconditions:
          - "review_status == IN_REVIEW (else ERR_LABEL_NOT_IN_REVIEW)"
          - "X-User-ID != prepared_by (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "content_status == READY (else ERR_CONTENT_REVISION_REQUIRED)"
        side_effects:
          - "approved_by = X-User-ID"
          - "increments LabelVersion.version by 1"
      - from: "review_status=IN_REVIEW"
        to: "review_status=DRAFT"
        trigger: "POST /api/label-versions/{id}/reject"
        actor: RegulatoryReviewer
        preconditions:
          - "review_status == IN_REVIEW (else ERR_LABEL_NOT_IN_REVIEW)"
        side_effects:
          - "approved_by cleared; panel_snapshot_id retained"
          - "declared fields (ingredient_statement_text, contains_text, declared_format, declared_type_size_in, panel_snapshot_id) unchanged — compensating pair with submit-review"
          - "increments LabelVersion.version by 1"
      - from: "review_status=DRAFT"
        to: "review_status=WITHDRAWN"
        trigger: "system (a newer DRAFT LabelVersion is created for the same product_id + market_code)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "release_status=NOT_RELEASED (with review_status=APPROVED)"
        to: "release_status=RELEASED"
        trigger: "POST /api/label-versions/{id}/release"
        actor: QualityManager
        preconditions:
          - "release_status == NOT_RELEASED and review_status == APPROVED (else ERR_LABEL_NOT_APPROVED)"
          - "content_status == READY (else ERR_CONTENT_REVISION_REQUIRED)"
          - "every ClaimAssessment of this label in {ELIGIBLE, NOT_REQUIRED} (else ERR_CLAIMS_NOT_RESOLVED)"
          - "latest FormatCheck (by created_at) result == PASS (else ERR_FORMAT_CHECK_FAILED)"
          - "OCC: expected_product_version == Product.version (else ERR_STALE_VERSION)"
        side_effects:
          - "any other LabelVersion of same product_id + market_code with release_status == RELEASED -> SUPERSEDED, its superseded_by_id = this id (system)"
          - "increments Product.version by 1"
          - "increments LabelVersion.version by 1"
      - from: "release_status=RELEASED"
        to: "release_status=WITHDRAWN"
        trigger: "POST /api/label-versions/{id}/withdraw"
        actor: QualityManager
        preconditions:
          - "release_status == RELEASED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "the LabelVersion whose superseded_by_id == this id returns to RELEASED (system) — compensating action for release"
          - "increments Product.version by 1"
          - "increments LabelVersion.version by 1"
      - from: "release_status=RELEASED"
        to: "release_status=SUPERSEDED"
        trigger: "system (another LabelVersion of same product_id + market_code is released)"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_id = newly released LabelVersion id"]

  - entity: MarketVariant
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/market-variants/{id}/activate"
        actor: QualityManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "base LabelVersion review_status == APPROVED (else ERR_LABEL_NOT_APPROVED)"
          - "effective_start <= current logical clock < effective_end (or end null) (else ERR_VARIANT_NOT_IN_WINDOW)"
          - "window overlap re-checked against non-RETIRED MarketVariants of same product + market_code (else ERR_MARKET_WINDOW_OVERLAP)"
        side_effects: ["increments MarketVariant.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/market-variants/{id}/retire"
        actor: QualityManager
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["increments MarketVariant.version by 1"]

  - entity: ArtworkAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FINDINGS_LOGGED
        trigger: "POST /api/artwork-audits/{id}/findings (first finding posted)"
        actor: ComplianceAuditor
        preconditions:
          - "status == SCHEDULED (findings may also be posted while FINDINGS_LOGGED)"
        side_effects:
          - "increments ArtworkAudit.version by 1"
      - from: FINDINGS_LOGGED
        to: CLOSED
        trigger: "POST /api/artwork-audits/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "status == FINDINGS_LOGGED (else ERR_INVALID_STATE_TRANSITION; closing from SCHEDULED with zero findings is rejected)"
        side_effects:
          - "conformance_score and result computed per scoring_method (audit_conformance_scoring)"
          - "increments ArtworkAudit.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: label-draft-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /api/products/{id}/label-versions"
    occ_field: "expected_product_version"
    description: |
      Creating a LabelVersion draft against a Product whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a draft for the same product + market (which
      legitimately withdraws the prior DRAFT) and the current writer's view of the
      product is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: label-release-stale-product
    parent_entity: Product
    write_endpoint: "POST /api/label-versions/{id}/release"
    occ_field: "expected_product_version"
    description: |
      Releasing a LabelVersion against a Product whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just released a different LabelVersion for the same product +
      market (which legitimately supersedes the prior release) and the current
      writer's view of the product is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: nutrient_panel_computation
    trigger: "POST /api/recipes/{id}/nutrient-panels"
    algorithm: aggregation
    formula: |
      DATABASE variant:
        for each recipe line: contribution[n] = ingredient.<n>_per_100g * line.quantity_g / 100
        raw_sum[n] = sum over lines of contribution[n]
        final_mass_g = sum(line.quantity_g) * recipe.yield_factor
        raw_per_100g[n] = raw_sum[n] / final_mass_g * 100
      LAB variant:
        a = recipe.latest_validated_lab_analysis_id (must be non-null and VALIDATED, else ERR_NO_VALIDATED_LAB_ANALYSIS)
        raw_per_100g[n] = a.<n>_per_100g   (exactly as measured; may carry 3 decimals)
      BOTH variants: declared <n>_per_100g = round_half_up(raw_per_100g[n], 2)
      NESTED ROUNDING ORDER (pinned): all downstream values (per-RACC claim inputs,
      per-serving declarations) are computed from raw_per_100g (UNROUNDED), never
      from the 2dp declared per-100g values.
    input_set: "DATABASE: all lines of the recipe; every line ingredient MUST have all 9 nutrient fields non-null (else ERR_NUTRIENT_PROFILE_INCOMPLETE). LAB: the single latest VALIDATED LabAnalysis of the recipe. Recipe must be LOCKED (else ERR_RECIPE_NOT_LOCKED)."
    constants:
      ROUNDING: "round_half_up, 2 decimal places"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: DATABASE
        when: "method == DATABASE"
        difference: "Weighted recipe-line aggregation over ingredient database profiles, yield-adjusted"
      - name: LAB
        when: "method == LAB"
        difference: "Direct adoption of latest VALIDATED lab assay vector; identical recipe yields different panel numbers than DATABASE"

  - name: serving_size_determination
    trigger: "POST /api/products/{id}/racc-assignments"
    algorithm: threshold
    formula: |
      EVALUATION ORDER (pinned, circular-looking dependency resolved):
        (1) racc_g = RACC_TABLE[market_code][product.product_category] (else ERR_RACC_CATEGORY_UNKNOWN)
        (2) package_ratio r = product.net_weight_g / racc_g  — computed against RACC, NOT against serving size
        (3) label_mode: r < 2.0 -> SINGLE_SERVING; 2.0 <= r <= 3.0 -> DUAL_COLUMN; r > 3.0 -> STANDARD
        (4) serving_size_g:
            SINGLE_SERVING -> serving_size_g = product.net_weight_g; serving_household_units = 1
            otherwise US_FDA variant -> units_raw = racc_g / product.household_unit_weight_g (missing/zero -> ERR_SERVING_SIZE_UNRESOLVABLE);
                       serving_household_units = floor(units_raw * 2 + 0.5) / 2  (nearest 0.5, half_up);
                       serving_size_g = round_half_up(serving_household_units * household_unit_weight_g, 2)
            otherwise CA_CFIA variant -> serving_size_g = (racc_g >= 50 ? nearest 5g half_up : nearest 1g half_up);
                       serving_household_units = round_half_up(serving_size_g / household_unit_weight_g, 2) (unit weight missing/zero -> ERR_SERVING_SIZE_UNRESOLVABLE)
        (5) servings_per_container: SINGLE_SERVING -> 1;
            otherwise n = net_weight_g / serving_size_g;
            n < 2 -> 1; 2 <= n <= 5 -> nearest 0.5 half_up; n > 5 -> nearest 1 half_up
      Only one RaccAssignment per (product_id, market_code) may exist (else ERR_RACC_ALREADY_ASSIGNED).
    input_set: "Product fields + market RACC table constants"
    constants:
      RACC_US: { BAKED_GOOD: 55, BEVERAGE: 240, CEREAL: 40, SNACK: 30, DAIRY: 170, SAUCE: 30, CONFECTION: 40, FROZEN_DESSERT: 90 }
      RACC_CA: { BAKED_GOOD: 55, BEVERAGE: 240, CEREAL: 40, SNACK: 30, DAIRY: 170, SAUCE: 30, FROZEN_DESSERT: 90 }
      DUAL_COLUMN_MIN_RATIO: 2.0
      DUAL_COLUMN_MAX_RATIO: 3.0
    precision: "serving_size_g 2 decimal places round_half_up; ratios compared exactly"
    variants:
      - name: US_FDA
        when: "market_code == US_FDA"
        difference: "Household-measure-first rounding to nearest 0.5 unit, then grams derived from units"
      - name: CA_CFIA
        when: "market_code == CA_CFIA"
        difference: "Metric-first rounding (nearest 5g if racc >= 50 else nearest 1g), then household units derived — same product can yield different serving_size_g and servings_per_container"

  - name: claim_eligibility_evaluation
    trigger: "POST /api/label-versions/{id}/claims (synchronous) and system re-evaluation when a new CURRENT NutrientPanel appears for the label's recipe + nutrient_basis"
    algorithm: threshold
    formula: |
      Inputs: panel raw_per_100g vector (from latest CURRENT NutrientPanel of the label's LOCKED
      recipe with method == label.nutrient_basis), racc_g and serving_size_g from the pinned
      RaccAssignment, claim_type, market rule set.
      value_per_racc[n]  = round_half_up(raw_per_100g[n] * racc_g / 100, 2)
      value_per_serving[n] = round_half_up(raw_per_100g[n] * serving_size_g / 100, 2)
      EVALUATION ORDER (pinned):
        (1) market recognition: CA_CFIA treats SUGAR_FREE and LOW_CALORIE as unregulated -> NOT_REQUIRED
        (2) disqualifiers on value_per_serving, checked in fixed order FAT, SATFAT, CHOL, SODIUM;
            first hit wins disqualified_by:
            fat > 13.0 | satfat > 4.0 | chol > 60.0 | sodium > 480.0  (strictly greater)
            any hit -> INELIGIBLE
        (3) claim threshold on value_per_racc (US_FDA and CA_CFIA identical where regulated):
            FAT_FREE:     fat    <  0.5
            LOW_FAT:      fat    <= 3.0
            SUGAR_FREE:   sugar  <  0.5
            LOW_SODIUM:   sodium <= 140
            HIGH_FIBER:   fiber  >= 5.0
            LOW_CALORIE:  kcal   <= 40
            pass -> ELIGIBLE else INELIGIBLE (disqualified_by = NONE when no disqualifier)
      Stores evaluated_value_per_racc, threshold_value, disqualified_by, basis_panel_id.
    input_set: "Latest CURRENT NutrientPanel of the label's recipe with method == nutrient_basis (recipe must be LOCKED, else ERR_RECIPE_NOT_LOCKED); pinned RaccAssignment"
    constants:
      DISQUALIFY_FAT_G_PER_SERVING: 13.0
      DISQUALIFY_SATFAT_G_PER_SERVING: 4.0
      DISQUALIFY_CHOL_MG_PER_SERVING: 60.0
      DISQUALIFY_SODIUM_MG_PER_SERVING: 480.0
      CA_UNREGULATED_CLAIMS: [SUGAR_FREE, LOW_CALORIE]
    precision: "2 decimal places round_half_up for compared values"

  - name: label_declaration_rounding
    trigger: "inside claim_eligibility_evaluation and panel per-serving declarations"
    algorithm: threshold
    formula: |
      Declared per-serving values are computed from raw_per_100g (UNROUNDED per-100g) scaled by
      serving_size_g/100, then tier-rounded per nutrient:
        kcal:   v < 5 -> 0;  v <= 50 -> nearest 5 (half_up);  v > 50 -> nearest 10 (half_up)
        sodium: v < 5 -> 0;  v <= 140 -> nearest 5 (half_up); v > 140 -> nearest 10 (half_up)
        fat, fiber, sugar: v < 0.5 -> 0; v < 5 -> nearest 0.5 (half_up); v >= 5 -> nearest 1 (half_up)
      nearest X half_up(v) = floor(v / X + 0.5) * X
      PINNED ORDER: scale raw -> tier-round. Tier-rounding the 2dp-rounded per-100g value instead
      can flip results (e.g., raw sodium 579.999 mg/100g at a 25g single-serving: raw path
      144.99975 -> 140; rounded-first path 145.0 -> 150). The raw path is authoritative.
    input_set: "raw_per_100g vector + serving_size_g"
    constants: {}
    precision: "tier rounding per nutrient as above"

  - name: ingredient_statement_ordering
    trigger: "GET /api/recipes/{id}/ingredient-statement and validation at POST /api/label-versions/{id}/submit-review"
    algorithm: topological
    formula: |
      canonical order of the LOCKED recipe's lines:
        sort key 1: line.quantity_g DESC
        tie-break 1: ingredient.created_at ASC
        tie-break 2: ingredient.name ASC
      ingredient_statement_text = comma-joined ingredient names in canonical order.
      contains_text canonical form: "Contains: " + comma-joined distinct allergen_tags in order of
      first appearance along the canonical line order + "." — empty allergen set => "Contains: None."
      Validation at submit-review: label's contains_text MUST equal canonical contains text
      (else ERR_ALLERGEN_STATEMENT_INCOMPLETE); ingredient_statement_text MUST equal canonical
      ordering (else ERR_INGREDIENT_ORDER_VIOLATION).
    input_set: "Lines of the product's currently LOCKED recipe"
    constants: {}
    precision: "exact string match after trimming outer whitespace"

  - name: format_compliance_evaluation
    trigger: "system at POST /api/label-versions/{id}/submit-review (auto-creates FormatCheck)"
    algorithm: threshold
    formula: |
      area = product.total_surface_area_sq_in; pdp = product.pdp_area_sq_in
      allowed_formats:
        area <= 12.0            -> [LINEAR]
        12.0 < area <= 40.0     -> [SIMPLIFIED, TABULAR, STANDARD_VERTICAL]
        area > 40.0             -> [STANDARD_VERTICAL]
      min_type_size_in: pdp <= 5.0 -> 0.03125 ; pdp > 5.0 -> 0.0625
      violations:
        declared_format not in allowed_formats -> FORMAT_NOT_ALLOWED_FOR_PACKAGE
        declared_type_size_in < min_type_size_in -> TYPE_SIZE_BELOW_MIN
      result = PASS iff violations empty else FAIL
      Boundary precision: area exactly 12.0 qualifies for LINEAR (<=); pdp exactly 5.0 uses 0.03125 (<=).
    input_set: "Product package fields + label declared_format / declared_type_size_in"
    constants:
      SMALL_PACKAGE_AREA_SQ_IN: 12.0
      MID_PACKAGE_AREA_SQ_IN: 40.0
      SMALL_PDP_AREA_SQ_IN: 5.0
      MIN_TYPE_SMALL_PDP_IN: 0.03125
      MIN_TYPE_LARGE_PDP_IN: 0.0625
    precision: "exact decimal comparison"

  - name: audit_conformance_scoring
    trigger: "POST /api/artwork-audits/{id}/close"
    algorithm: weighted_scoring
    formula: |
      findings = all AuditFindings of the audit
      BINARY variant:   score = 100 when findings empty else 0 ; result = PASS iff score == 100
      WEIGHTED variant: score = max(0, 100 - 10*count(CRITICAL) - 4*count(MAJOR) - 1*count(MINOR)) ;
                        result = PASS iff score >= 90
    input_set: "All AuditFindings of the audit regardless of severity"
    constants:
      W_CRITICAL: 10
      W_MAJOR: 4
      W_MINOR: 1
      PASS_THRESHOLD_WEIGHTED: 90
    precision: "integer score"
    variants:
      - name: BINARY
        when: "audit.scoring_method == BINARY"
        difference: "Any finding fails the audit (score 0)"
      - name: WEIGHTED
        when: "audit.scoring_method == WEIGHTED"
        difference: "Severity-weighted deduction with floor 0 and pass threshold 90 — identical findings can PASS under WEIGHTED and FAIL under BINARY"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role recognized", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role listed in endpoint.roles; entity_backed roles (ClientRep, QualityManager) may only touch resources whose client chain equals X-User-ID", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path identifiers resolve left-to-right; FK inputs (racc_assignment_id, product_id, label_version_id) exist; every lines[].ingredient_id exists within the client's ingredient scope", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3, category: existence, check: "Body well-formed: required fields present, enum members valid, numbers positive where required, yield_factor in (0, 1.2], recipe lines non-empty with distinct ingredient_ids", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: state, check: "OCC precondition: expected_product_version equals Product.version (label-version create, release). NOTE: within one priority level, rows apply in listed order; release gates evaluate ERR_LABEL_NOT_APPROVED, then ERR_CONTENT_REVISION_REQUIRED, then ERR_CLAIMS_NOT_RESOLVED, then ERR_FORMAT_CHECK_FAILED", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/products/{id}/label-versions, POST /api/label-versions/{id}/release" }
  - { priority: 4, category: state, check: "State-machine from-state validity for every action endpoint (lock from DRAFT, review from SUBMITTED, approve/reject from IN_REVIEW, release from APPROVED+NOT_RELEASED, withdraw from RELEASED, activate from DRAFT, retire from ACTIVE, close from FINDINGS_LOGGED); claim creation only on labels with review_status in {DRAFT, IN_REVIEW}", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints, POST /api/label-versions/{id}/claims" }
  - { priority: 4, category: state, check: "Lab review second decision attempt", error_id: ERR_LAB_REVIEW_ALREADY_DECIDED, http_status: 409, applies_to: "POST /api/lab-analyses/{id}/review" }
  - { priority: 4, category: state, check: "Recipe LOCKED where required (lab review VALIDATED, panel compute, claim create, submit-review)", error_id: ERR_RECIPE_NOT_LOCKED, http_status: 409, applies_to: "POST /api/lab-analyses/{id}/review, POST /api/recipes/{id}/nutrient-panels, POST /api/label-versions/{id}/claims, POST /api/label-versions/{id}/submit-review" }
  - { priority: 4, category: state, check: "Latest panel for nutrient_basis must be CURRENT at submit-review", error_id: ERR_PANEL_NOT_CURRENT, http_status: 409, applies_to: "POST /api/label-versions/{id}/submit-review" }
  - { priority: 4, category: state, check: "Label review_status must be IN_REVIEW for approve/reject", error_id: ERR_LABEL_NOT_IN_REVIEW, http_status: 409, applies_to: "POST /api/label-versions/{id}/approve, POST /api/label-versions/{id}/reject" }
  - { priority: 4, category: state, check: "Label must be APPROVED + NOT_RELEASED for release; APPROVED for market-variant activation", error_id: ERR_LABEL_NOT_APPROVED, http_status: 409, applies_to: "POST /api/label-versions/{id}/release, POST /api/market-variants/{id}/activate" }
  - { priority: 4, category: state, check: "content_status must be READY at approve and release", error_id: ERR_CONTENT_REVISION_REQUIRED, http_status: 409, applies_to: "POST /api/label-versions/{id}/approve, POST /api/label-versions/{id}/release" }
  - { priority: 5, category: business_safety, check: "contains_text covers every allergen_tag in the LOCKED recipe's lines (canonical equality)", error_id: ERR_ALLERGEN_STATEMENT_INCOMPLETE, http_status: 422, applies_to: "POST /api/label-versions/{id}/submit-review" }
  - { priority: 5, category: business_safety, check: "ingredient_statement_text equals canonical descending-weight ordering", error_id: ERR_INGREDIENT_ORDER_VIOLATION, http_status: 422, applies_to: "POST /api/label-versions/{id}/submit-review" }
  - { priority: 6, category: business_constraint, check: "No second RaccAssignment for same (product_id, market_code)", error_id: ERR_RACC_ALREADY_ASSIGNED, http_status: 409, applies_to: "POST /api/products/{id}/racc-assignments" }
  - { priority: 6, category: business_constraint, check: "No second non-RETIRED MarketVariant for same (label_version_id, market_code)", error_id: ERR_DUPLICATE_MARKET_VARIANT, http_status: 409, applies_to: "POST /api/label-versions/{id}/market-variants" }
  - { priority: 6, category: business_constraint, check: "MarketVariant effective windows for same (product_id, market_code) among non-RETIRED variants must not overlap; half-open [start, end), adjacency allowed, null end = infinity", error_id: ERR_MARKET_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/label-versions/{id}/market-variants, POST /api/market-variants/{id}/activate" }
  - { priority: 6, category: business_constraint, check: "ArtworkAudit facility schedule: windows at same facility_code among audits in {SCHEDULED, FINDINGS_LOGGED} must keep a 1-day buffer: new.start >= existing.end + 86400s OR new.end <= existing.start - 86400s; equality permitted", error_id: ERR_FACILITY_SCHEDULE_OVERLAP, http_status: 409, applies_to: "POST /api/clients/{id}/artwork-audits" }
  - { priority: 7, category: business_temporal, check: "effective_end (when present) strictly after effective_start; scheduled_end strictly after scheduled_start", error_id: ERR_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/label-versions/{id}/market-variants, POST /api/clients/{id}/artwork-audits" }
  - { priority: 7, category: business_temporal, check: "MarketVariant activation only inside its effective window per logical clock", error_id: ERR_VARIANT_NOT_IN_WINDOW, http_status: 409, applies_to: "POST /api/market-variants/{id}/activate" }
  - { priority: 8, category: business_referential, check: "DATABASE panel: every line ingredient has all 9 nutrient fields non-null", error_id: ERR_NUTRIENT_PROFILE_INCOMPLETE, http_status: 422, applies_to: "POST /api/recipes/{id}/nutrient-panels" }
  - { priority: 8, category: business_referential, check: "LAB panel: recipe has a VALIDATED LabAnalysis", error_id: ERR_NO_VALIDATED_LAB_ANALYSIS, http_status: 422, applies_to: "POST /api/recipes/{id}/nutrient-panels" }
  - { priority: 8, category: business_referential, check: "product_category present in market RACC table", error_id: ERR_RACC_CATEGORY_UNKNOWN, http_status: 422, applies_to: "POST /api/products/{id}/racc-assignments" }
  - { priority: 8, category: business_referential, check: "household_unit_weight_g present and > 0 for serving computation", error_id: ERR_SERVING_SIZE_UNRESOLVABLE, http_status: 422, applies_to: "POST /api/products/{id}/racc-assignments" }
  - { priority: 8, category: business_referential, check: "racc_assignment_id belongs to same product and its market_code equals label market_code", error_id: ERR_RACC_MARKET_MISMATCH, http_status: 422, applies_to: "POST /api/products/{id}/label-versions" }
  - { priority: 8, category: business_referential, check: "MarketVariant market_code differs from base label market_code", error_id: ERR_SAME_MARKET_VARIANT, http_status: 422, applies_to: "POST /api/label-versions/{id}/market-variants" }
  - { priority: 8, category: business_referential, check: "Audit scope: product belongs to path client; label version belongs to product and is RELEASED", error_id: ERR_AUDIT_SCOPE_INCONSISTENT, http_status: 422, applies_to: "POST /api/clients/{id}/artwork-audits" }
  - { priority: 2, category: auth, check: "Segregation of duties: approver X-User-ID must differ from LabelVersion.prepared_by", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: "POST /api/label-versions/{id}/approve" }
  - { priority: 4, category: state, check: "Release gates: every claim in {ELIGIBLE, NOT_REQUIRED}; latest FormatCheck PASS", error_id: ERR_CLAIMS_NOT_RESOLVED, http_status: 409, applies_to: "POST /api/label-versions/{id}/release" }
  - { priority: 4, category: state, check: "Latest FormatCheck result must be PASS at release", error_id: ERR_FORMAT_CHECK_FAILED, http_status: 409, applies_to: "POST /api/label-versions/{id}/release" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Client ---
  - { method: POST, path: "/api/clients", description: "Onboard a client", roles: [PlatformAdmin], code: 201, input: [name, home_market_code], output: Client, side_effects: [] }
  - { method: GET, path: "/api/clients/{id}", description: "Get a client", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: Client, side_effects: [] }

  # --- Product ---
  - { method: POST, path: "/api/clients/{id}/products", description: "Register a product for a client", roles: [ClientRep], code: 201, input: [name, product_category, net_weight_g, total_surface_area_sq_in, pdp_area_sq_in, "household_unit_name?", "household_unit_weight_g?"], output: Product, side_effects: [] }
  - { method: GET, path: "/api/products/{id}", description: "Get a product", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/api/clients/{id}/products", description: "List products of a client", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "Product[]", side_effects: [] }

  # --- Ingredient ---
  - { method: POST, path: "/api/clients/{id}/ingredients", description: "Create an ingredient with its database nutrient profile (any nutrient field may be omitted, marking the profile incomplete)", roles: [ClientRep], code: 201, input: [name, "allergen_tags?", "kcal_per_100g?", "fat_g_per_100g?", "satfat_g_per_100g?", "chol_mg_per_100g?", "sodium_mg_per_100g?", "carb_g_per_100g?", "fiber_g_per_100g?", "sugar_g_per_100g?", "protein_g_per_100g?"], output: Ingredient, side_effects: [] }
  - { method: GET, path: "/api/clients/{id}/ingredients", description: "List ingredients of a client", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "Ingredient[]", side_effects: [] }

  # --- Recipe ---
  - { method: POST, path: "/api/products/{id}/recipes", description: "Create a formulation (lines reference client's ingredients)", roles: [ClientRep], code: 201, input: [name, lines, "yield_factor?"], output: Recipe, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/api/recipes/{id}", description: "Get a recipe", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: Recipe, side_effects: [] }
  - { method: GET, path: "/api/products/{id}/recipes", description: "List recipes of a product", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "Recipe[]", side_effects: [] }
  - { method: POST, path: "/api/recipes/{id}/lock", description: "Lock a DRAFT recipe; auto-supersedes the previously LOCKED sibling and cascades staleness", roles: [ClientRep], code: 200, input: [], output: Recipe, side_effects: ["status DRAFT->LOCKED", "sibling LOCKED->SUPERSEDED", "superseded recipe's panels -> STALE", "dependent claims -> SUSPENDED", "label content_status recomputed"] }
  - { method: GET, path: "/api/recipes/{id}/ingredient-statement", description: "Computed canonical ingredient statement + Contains statement for the product's LOCKED recipe", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: { ingredient_statement_text: string, contains_text: string, canonical_order: array }, side_effects: [] }
  - { method: GET, path: "/api/recipes", description: "List recipes; optional filter latest_validated_lab_analysis_id (reverse reachability for Recipe.latest_validated_lab_analysis_id)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["latest_validated_lab_analysis_id?", "limit?", "offset?"], output: "Recipe[]", side_effects: [] }

  # --- LabAnalysis ---
  - { method: POST, path: "/api/recipes/{id}/lab-analyses", description: "Submit a lab assay for a recipe", roles: [ClientRep], code: 201, input: [lab_report_ref, kcal_per_100g, fat_g_per_100g, satfat_g_per_100g, chol_mg_per_100g, sodium_mg_per_100g, carb_g_per_100g, fiber_g_per_100g, sugar_g_per_100g, protein_g_per_100g], output: LabAnalysis, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/api/recipes/{id}/lab-analyses", description: "List lab analyses of a recipe", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "LabAnalysis[]", side_effects: [] }
  - { method: POST, path: "/api/lab-analyses/{id}/review", description: "Regulatory review of a lab analysis", roles: [RegulatoryReviewer], code: 200, input: [outcome], output: LabAnalysis, side_effects: ["SUBMITTED->VALIDATED|REJECTED", "on VALIDATED: recipe.latest_validated_lab_analysis_id set, prior VALIDATED -> SUPERSEDED, its LAB panels -> STALE, dependent claims -> SUSPENDED, label content_status recomputed"] }

  # --- NutrientPanel ---
  - { method: POST, path: "/api/recipes/{id}/nutrient-panels", description: "Compute a nutrient panel (method DATABASE or LAB) for a LOCKED recipe", roles: [LabelAnalyst], code: 201, input: [method], output: NutrientPanel, side_effects: ["nutrient_panel_computation", "status=CURRENT", "system: SUSPENDED claims of labels using this recipe+basis re-evaluate against the new panel; label content_status recomputed"] }
  - { method: GET, path: "/api/recipes/{id}/nutrient-panels", description: "List panels of a recipe (optionally filter by method)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["method?", "limit?", "offset?"], output: "NutrientPanel[]", side_effects: [] }
  - { method: GET, path: "/api/nutrient-panels/{id}", description: "Get a nutrient panel", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: NutrientPanel, side_effects: [] }
  - { method: GET, path: "/api/nutrient-panels", description: "List panels; optional filter basis_lab_analysis_id (reverse reachability for NutrientPanel.basis_lab_analysis_id)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["basis_lab_analysis_id?", "limit?", "offset?"], output: "NutrientPanel[]", side_effects: [] }

  # --- RaccAssignment ---
  - { method: POST, path: "/api/products/{id}/racc-assignments", description: "Determine serving size for a market (one per product+market)", roles: [LabelAnalyst], code: 201, input: [market_code], output: RaccAssignment, side_effects: ["serving_size_determination"] }
  - { method: GET, path: "/api/products/{id}/racc-assignments", description: "List RACC assignments of a product", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "RaccAssignment[]", side_effects: [] }

  # --- LabelVersion ---
  - { method: POST, path: "/api/products/{id}/label-versions", description: "Create a label draft (withdraws existing DRAFT for same product+market; OCC on Product.version)", roles: [LabelAnalyst], code: 201, input: [market_code, nutrient_basis, racc_assignment_id, declared_format, declared_type_size_in, ingredient_statement_text, contains_text, expected_product_version], output: LabelVersion, side_effects: ["existing DRAFT same product+market -> review_status WITHDRAWN", "review_status=DRAFT, release_status=NOT_RELEASED, review_round=0", "prepared_by = X-User-ID", "increments Product.version by 1"] }
  - { method: GET, path: "/api/label-versions/{id}", description: "Get a label version", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: LabelVersion, side_effects: [] }
  - { method: GET, path: "/api/products/{id}/label-versions", description: "List label versions of a product", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "LabelVersion[]", side_effects: [] }
  - { method: GET, path: "/api/label-versions", description: "List label versions; optional filters racc_assignment_id / panel_snapshot_id / superseded_by_id (reverse reachability for the LabelVersion reference FKs)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["racc_assignment_id?", "panel_snapshot_id?", "superseded_by_id?", "limit?", "offset?"], output: "LabelVersion[]", side_effects: [] }
  - { method: POST, path: "/api/label-versions/{id}/submit-review", description: "Submit draft for regulatory review: pins panel snapshot, validates statements, auto-creates FormatCheck", roles: [LabelAnalyst], code: 200, input: [], output: LabelVersion, side_effects: ["review_status DRAFT->IN_REVIEW", "panel_snapshot_id pinned", "review_round += 1", "FormatCheck auto-created (format_compliance_evaluation)", "content_status recomputed"] }
  - { method: POST, path: "/api/label-versions/{id}/approve", description: "Approve a label in review (approver must differ from prepared_by)", roles: [RegulatoryReviewer], code: 200, input: [], output: LabelVersion, side_effects: ["review_status IN_REVIEW->APPROVED", "approved_by = X-User-ID"] }
  - { method: POST, path: "/api/label-versions/{id}/reject", description: "Reject back to DRAFT (compensating action: declared content unchanged)", roles: [RegulatoryReviewer], code: 200, input: ["reason?"], output: LabelVersion, side_effects: ["review_status IN_REVIEW->DRAFT", "approved_by cleared"] }
  - { method: POST, path: "/api/label-versions/{id}/release", description: "Release an approved label (OCC on Product.version); supersedes prior release for product+market", roles: [QualityManager], code: 200, input: [expected_product_version], output: LabelVersion, side_effects: ["release_status NOT_RELEASED->RELEASED", "prior RELEASED same product+market -> SUPERSEDED with superseded_by_id", "increments Product.version by 1"] }
  - { method: POST, path: "/api/label-versions/{id}/withdraw", description: "Withdraw a release; restores the label this one superseded", roles: [QualityManager], code: 200, input: ["reason?"], output: LabelVersion, side_effects: ["release_status RELEASED->WITHDRAWN", "LabelVersion with superseded_by_id == this id -> RELEASED", "increments Product.version by 1"] }

  # --- ClaimAssessment ---
  - { method: POST, path: "/api/label-versions/{id}/claims", description: "Declare an on-pack claim; synchronously evaluated against latest CURRENT panel", roles: [LabelAnalyst], code: 201, input: [claim_type], output: ClaimAssessment, side_effects: ["claim_eligibility_evaluation", "status PENDING->ELIGIBLE|INELIGIBLE|NOT_REQUIRED", "label content_status recomputed"] }
  - { method: GET, path: "/api/label-versions/{id}/claims", description: "List claims of a label version", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "ClaimAssessment[]", side_effects: [] }
  - { method: GET, path: "/api/claims/{id}", description: "Get a claim assessment", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: ClaimAssessment, side_effects: [] }
  - { method: GET, path: "/api/claims", description: "List claim assessments; optional filter basis_panel_id (reverse reachability for ClaimAssessment.basis_panel_id)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["basis_panel_id?", "limit?", "offset?"], output: "ClaimAssessment[]", side_effects: [] }

  # --- MarketVariant ---
  - { method: POST, path: "/api/label-versions/{id}/market-variants", description: "Adapt a label to another market with an effective window", roles: [LabelAnalyst], code: 201, input: [market_code, effective_start, "effective_end?", "translated_contains_text?"], output: MarketVariant, side_effects: ["status=DRAFT", "window overlap + duplicate checks"] }
  - { method: GET, path: "/api/label-versions/{id}/market-variants", description: "List market variants of a label", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "MarketVariant[]", side_effects: [] }
  - { method: POST, path: "/api/market-variants/{id}/activate", description: "Activate a variant inside its effective window (base label must be APPROVED)", roles: [QualityManager], code: 200, input: [], output: MarketVariant, side_effects: ["status DRAFT->ACTIVE"] }
  - { method: POST, path: "/api/market-variants/{id}/retire", description: "Retire an active variant, freeing its window", roles: [QualityManager], code: 200, input: [], output: MarketVariant, side_effects: ["status ACTIVE->RETIRED"] }

  # --- FormatCheck ---
  - { method: GET, path: "/api/label-versions/{id}/format-checks", description: "List format checks of a label (created at submit-review)", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "FormatCheck[]", side_effects: [] }

  # --- ArtworkAudit / AuditFinding ---
  - { method: POST, path: "/api/clients/{id}/artwork-audits", description: "Schedule an on-pack vs approved-artwork audit", roles: [ComplianceAuditor], code: 201, input: [product_id, label_version_id, facility_code, scheduled_start, scheduled_end, "scoring_method?"], output: ArtworkAudit, side_effects: ["status=SCHEDULED", "facility buffer + scope checks"] }
  - { method: GET, path: "/api/artwork-audits/{id}", description: "Get an audit", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: [], output: ArtworkAudit, side_effects: [] }
  - { method: GET, path: "/api/artwork-audits", description: "List audits; optional filters client_id / product_id / label_version_id", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["client_id?", "product_id?", "label_version_id?", "limit?", "offset?"], output: "ArtworkAudit[]", side_effects: [] }
  - { method: POST, path: "/api/artwork-audits/{id}/findings", description: "Log a discrepancy finding; first finding moves audit SCHEDULED->FINDINGS_LOGGED", roles: [ComplianceAuditor], code: 201, input: [severity, field_ref, on_pack_text, approved_text], output: AuditFinding, side_effects: ["audit status -> FINDINGS_LOGGED on first finding"] }
  - { method: GET, path: "/api/artwork-audits/{id}/findings", description: "List findings of an audit", roles: [PlatformAdmin, ClientRep, LabelAnalyst, RegulatoryReviewer, QualityManager, ComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "AuditFinding[]", side_effects: [] }
  - { method: POST, path: "/api/artwork-audits/{id}/close", description: "Close an audit; computes conformance score per scoring_method", roles: [ComplianceAuditor], code: 200, input: [], output: ArtworkAudit, side_effects: ["audit_conformance_scoring", "status FINDINGS_LOGGED->CLOSED"] }

  # --- Test-driving utility ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed or role unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or entity_backed caller acts outside own client chain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK input does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive number, yield_factor out of (0,1.2], empty/duplicate recipe lines" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Action's from-state precondition not met (lock non-DRAFT, withdraw non-RELEASED, retire non-ACTIVE, close non-FINDINGS_LOGGED, etc.)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_product_version does not match Product.version (OCC)" }
  - { id: ERR_RECIPE_NOT_LOCKED, http: 409, condition: "Operation requires the product's recipe in LOCKED status (panel compute, claim create, submit-review, lab validation)" }
  - { id: ERR_LAB_REVIEW_ALREADY_DECIDED, http: 409, condition: "Lab analysis already VALIDATED/REJECTED/SUPERSEDED" }
  - { id: ERR_NO_VALIDATED_LAB_ANALYSIS, http: 422, condition: "LAB panel requested but recipe has no VALIDATED lab analysis" }
  - { id: ERR_NUTRIENT_PROFILE_INCOMPLETE, http: 422, condition: "DATABASE panel requested but a line ingredient has at least one null nutrient field" }
  - { id: ERR_RACC_CATEGORY_UNKNOWN, http: 422, condition: "product_category absent from the market's RACC table (e.g., CONFECTION under CA_CFIA)" }
  - { id: ERR_RACC_ALREADY_ASSIGNED, http: 409, condition: "A RaccAssignment already exists for this product + market" }
  - { id: ERR_RACC_MARKET_MISMATCH, http: 422, condition: "racc_assignment_id belongs to another product or another market" }
  - { id: ERR_SERVING_SIZE_UNRESOLVABLE, http: 422, condition: "household_unit_weight_g missing or zero; serving size cannot be computed" }
  - { id: ERR_PANEL_NOT_CURRENT, http: 409, condition: "submit-review found the latest panel for nutrient_basis is STALE (or none exists)" }
  - { id: ERR_ALLERGEN_STATEMENT_INCOMPLETE, http: 422, condition: "contains_text does not equal canonical allergen statement for the LOCKED recipe" }
  - { id: ERR_INGREDIENT_ORDER_VIOLATION, http: 422, condition: "ingredient_statement_text does not equal canonical descending-weight order" }
  - { id: ERR_LABEL_NOT_IN_REVIEW, http: 409, condition: "approve/reject requires review_status == IN_REVIEW" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "release requires review_status == APPROVED and release_status == NOT_RELEASED; variant activation requires APPROVED" }
  - { id: ERR_CONTENT_REVISION_REQUIRED, http: 409, condition: "content_status == NEEDS_REVISION at approve or release" }
  - { id: ERR_CLAIMS_NOT_RESOLVED, http: 409, condition: "release attempted with a claim in PENDING, SUSPENDED, or INELIGIBLE" }
  - { id: ERR_FORMAT_CHECK_FAILED, http: 409, condition: "release attempted while latest FormatCheck result == FAIL" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver X-User-ID equals LabelVersion.prepared_by" }
  - { id: ERR_DUPLICATE_MARKET_VARIANT, http: 409, condition: "Non-RETIRED variant for same base label + target market already exists" }
  - { id: ERR_SAME_MARKET_VARIANT, http: 422, condition: "Variant target market equals base label's market_code" }
  - { id: ERR_MARKET_WINDOW_OVERLAP, http: 409, condition: "Effective window overlaps another non-RETIRED variant for same product + market (half-open intervals, adjacency allowed)" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "effective_end <= effective_start or scheduled_end <= scheduled_start" }
  - { id: ERR_VARIANT_NOT_IN_WINDOW, http: 409, condition: "Activation outside [effective_start, effective_end) per logical clock" }
  - { id: ERR_FACILITY_SCHEDULE_OVERLAP, http: 409, condition: "Facility has another SCHEDULED/FINDINGS_LOGGED audit within 1-day buffer of the requested window" }
  - { id: ERR_AUDIT_SCOPE_INCONSISTENT, http: 422, condition: "product_id not under path client, or label_version_id not under product, or label not RELEASED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Consultancy platform operator; onboards clients and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/clients"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: ClientRep
    description: "Client-side representative; owns products, ingredients, recipes, lab submissions for their client"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /api/clients/{id}/products"
      - "POST /api/clients/{id}/ingredients"
      - "POST /api/products/{id}/recipes"
      - "POST /api/recipes/{id}/lock"
      - "POST /api/recipes/{id}/lab-analyses"
    shared_operations: ["all GET endpoints (own client chain only)"]
  - name: LabelAnalyst
    description: "Consultancy analyst; computes panels, determines serving sizes, drafts labels, claims, variants"
    identity: opaque
    exclusive_operations:
      - "POST /api/recipes/{id}/nutrient-panels"
      - "POST /api/products/{id}/racc-assignments"
      - "POST /api/products/{id}/label-versions"
      - "POST /api/label-versions/{id}/submit-review"
      - "POST /api/label-versions/{id}/claims"
      - "POST /api/label-versions/{id}/market-variants"
    shared_operations: ["all GET endpoints"]
  - name: RegulatoryReviewer
    description: "Consultancy regulatory reviewer; validates lab analyses and approves/rejects labels; segregated from label preparation"
    identity: opaque
    exclusive_operations:
      - "POST /api/lab-analyses/{id}/review"
      - "POST /api/label-versions/{id}/approve"
      - "POST /api/label-versions/{id}/reject"
    shared_operations: ["all GET endpoints"]
  - name: QualityManager
    description: "Client-side quality manager; releases and withdraws labels, activates/retires market variants"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /api/label-versions/{id}/release"
      - "POST /api/label-versions/{id}/withdraw"
      - "POST /api/market-variants/{id}/activate"
      - "POST /api/market-variants/{id}/retire"
    shared_operations: ["all GET endpoints (own client chain only)"]
  - name: ComplianceAuditor
    description: "Field auditor; schedules artwork audits, logs findings, closes audits"
    identity: opaque
    exclusive_operations:
      - "POST /api/clients/{id}/artwork-audits"
      - "POST /api/artwork-audits/{id}/findings"
      - "POST /api/artwork-audits/{id}/close"
    shared_operations: ["all GET endpoints"]
