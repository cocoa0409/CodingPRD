              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-IMM"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 500 }]
                holdback_policy: "FLAT"
              as: SupplierRep
