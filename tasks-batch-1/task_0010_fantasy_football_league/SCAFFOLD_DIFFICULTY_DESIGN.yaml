              payload: {}
              as: Commissioner
              as_user_id: "commish_13"
              captures: { wc_a_state: $.data.state }
            - call: "GET /waiver-claims/${wc_b_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_13"
              captures: { wc_b_state: $.data.state }
          assert:
            - "wc_b_state == WON (cross-entity check: team B's bid was higher AND player fa was ACTIVE)."
            - "wc_a_state == LOST_BID (the WaiverClaim's state transition depends on the OTHER claim and the Player's current state — cross-entity dependency on Player and competing WaiverClaim)."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: player_cannot_be_on_two_teams_in_same_week
        grounds:
          - validations[priority=9]
          - state_machines.Trade.PENDING_VETO_to_EXECUTED
          - entities.Player.fields.current_team_id
        distinguishing_aspect: |
          Interval semantics: instantaneous-week occupation. A Player.current_team_id is a single
          slot — across the same week, the player cannot be simultaneously rostered by two teams.
          Attempting POST /trades with players_offered including a player whose current_team_id
          differs from proposing_team_id collides with the instantaneous "owned-this-week" interval
          and is rejected. Different interval semantics from instance B (waiver processing window,
          which is a half-open time range).
        test_recipe:
          setup:
            - "League IN_SEASON; team A owns player_x; team B does NOT own player_x; team B attempts to propose a trade offering player_x."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-26T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_14"
