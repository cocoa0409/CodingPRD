  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: match_creation_blocked_while_needs_assessment_is_only_submitted
        grounds:
          - validations[priority=13]
          - entities.NeedsAssessment.fields.status
          - errors[ERR_ASSESSMENT_NOT_APPROVED]
          - state_machines.Inquiry.ASSIGNED_to_ASSESSED
        distinguishing_aspect: |
          Entity pair Match -> NeedsAssessment: whether a Match may be created at all depends on
          a SECOND entity's state (the inquiry's NeedsAssessment must be APPROVED). With the
          assessment sitting in SUBMITTED the create is rejected with ERR_ASSESSMENT_NOT_APPROVED
          even though the community, inventory and care level are all perfectly valid.
        test_recipe:
          setup:
            - "Cedar Grove with an OPEN ASSISTED_LIVING pool at 500000 cents."
            - "Inquiry Q1 assigned to Ann; assessment S1 has been submitted but never reviewed, so its status is SUBMITTED and Inquiry.status is still ASSIGNED."
