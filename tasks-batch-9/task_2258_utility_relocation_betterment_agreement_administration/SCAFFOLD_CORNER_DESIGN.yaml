        claim_type: Shared Operations
        grounds: ["endpoints.GET_/uro/projects/{id}", "endpoints.GET_/uro/projects/{id}/clearance-summary", "endpoints.GET_/uro/investigations", "endpoints.GET_/uro/agreements", "roles.UtilityOwnerRep"]
