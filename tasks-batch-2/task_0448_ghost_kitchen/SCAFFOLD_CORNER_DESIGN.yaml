              payload: { brand_id: "${bu_id}", aggregator: "DOORDASH", external_ref: "DD-U", line_items: [ { menu_item_id: "${item_id}", qty: 1 } ] }
              as: AggregatorGateway
          trigger:
            - call: "POST /orders"
              payload: { brand_id: "${bu_id}", aggregator: "DOORDASH", external_ref: "DD-U", line_items: [ { menu_item_id: "${item_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ORDER"

