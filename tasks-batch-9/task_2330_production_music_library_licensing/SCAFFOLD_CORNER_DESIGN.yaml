              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${compA}", source_platform: "UGC_VIDEO", source_reference: "vid-low", matched_seconds: 30, confidence_pct: 65.0 }
              as: CatalogAdmin
              captures: { fmLow: $.data.id }
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${compA}", source_platform: "UGC_VIDEO", source_reference: "vid-mid", matched_seconds: 30, confidence_pct: 84.9 }
              as: CatalogAdmin
              captures: { fmMid: $.data.id }
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${compA}", source_platform: "UGC_VIDEO", source_reference: "vid-high", matched_seconds: 45, confidence_pct: 96.0 }
              as: CatalogAdmin
              captures: { fmHigh: $.data.id }
          trigger:
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fmLow}" }
              as: RightsManager
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fmMid}" }
              as: RightsManager
              captures: { clMid: $.data.id }
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fmMid}" }
              as: RightsManager
            - call: "POST /music-library/infringement-claims/${clMid}/notice"
              payload: { notice_channel: "EMAIL" }
              as: RightsManager
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fmHigh}" }
              as: RightsManager
              captures: { clHigh: $.data.id }
            - call: "POST /music-library/infringement-claims/${clHigh}/notice"
              payload: { notice_channel: "EMAIL" }
              as: RightsManager
            - call: "POST /music-library/infringement-claims/${clHigh}/settle"
              payload: { settlement_basis: "NEGOTIATED", payment_received: true, negotiated_amount_cents: 1 }
              as: RightsManager
            - call: "POST /music-library/infringement-claims/${clHigh}/settle"
              payload: { settlement_basis: "NEGOTIATED", payment_received: true }
              as: RightsManager
            - call: "POST /music-library/infringement-claims/${clHigh}/settle"
              payload: { settlement_basis: "STATUTORY", payment_received: true }
              as: RightsManager
            - call: "GET /music-library/compositions/${compA}"
              payload: {}
              as: CatalogAdmin
          assert:
            - "Call 1 → 422 with data.error_id == \"ERR_CONFIDENCE_BELOW_CLAIM_THRESHOLD\" (65.0 < 70.0) and no claim row is created"
            - "Call 2 → 201 with status \"DETECTED\" (84.9 clears the 70.0 claim gate)"
            - "Call 3 → 409 with data.error_id == \"ERR_MATCH_ALREADY_CLAIMED\""
            - "Call 4 → 409 with data.error_id == \"ERR_CONFIDENCE_BELOW_NOTICE_THRESHOLD\" (84.9 < 85.0) and InfringementClaim.${clMid}.status stays \"DETECTED\""
            - "Call 6 → 200 with status \"NOTICED\" and Composition.${compA}.availability_status \"RESTRICTED\" with open_claim_count 1"
            - "Call 7 → 422 with data.error_id == \"ERR_SETTLEMENT_BELOW_FLOOR\" (1 cent is below settlement_floor_cents)"
            - "Call 8 → 422 with data.error_id == \"ERR_SETTLEMENT_BELOW_FLOOR\" (NEGOTIATED with negotiated_amount_cents absent is refused by the same rule)"
            - "Call 9 → 200 with status \"SETTLED\" and settled_amount_cents == statutory_amount_cents"
            - "Call 10 → availability_status back to \"AVAILABLE\" and open_claim_count 0 (the DETECTED claim on ${fmMid} was never counted)"

