# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sugar Crop Receiving Station & Cooperative Payment
# Enumerative breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_applies_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Member]
        distinguishing_aspect: "POST /api/members with required fields returns the member with status ACTIVE (default), net_ledger_cents 0, deterioration_loss_lbs 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m_status: $.data.status, m_net: $.data.net_ledger_cents, m_loss: $.data.deterioration_loss_lbs, m_v: $.data.version } }
          assert:
            - "m_status == ACTIVE, m_net == 0, m_loss == 0, m_v == 1"

      - name: member_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required member_code yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/members", payload: { name: "M1", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: station_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.ReceivingStation.fields.booked_tons]
        distinguishing_aspect: "Client-supplied booked_tons on station creation is ignored; the computed field stays 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 100, booked_tons: 999 }, as: COOP_ADMIN, captures: { booked: $.data.booked_tons, received: $.data.received_tons, stored: $.data.stored_tons } }
          assert:
            - "booked == 0 and received == 0 and stored == 0 (computed fields not settable by clients)"

      - name: ticket_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent ticket id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/tickets/00000000-0000-0000-0000-000000000000", as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: sample_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.QualitySample.fields.sample_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "sample_type outside {STATION_QUICK, LAB_VERIFY} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Campaign, member M1, station; booking CONFIRMED; ticket created and weighed at slot clock"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
          trigger:
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "HPLC" }, as: QUALITY_TECH, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: ledger_entry_is_append_only_immutable
        claim_type: immutability
        grounds: [entities.PaymentLedgerEntry]
        distinguishing_aspect: "PaymentLedgerEntry has common_fields: false — no version/updated_at fields; compensation happens only via new REVERSAL entries, never mutation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/ledger-entries/00000000-0000-0000-0000-000000000000", as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (endpoint surface is GET-only plus reverse; no PUT/PATCH/DELETE exists for ledger entries)"

      - name: pile_requires_existing_station_fk
        claim_type: parent_relationships
        grounds: [entities.StoragePile.fields.station_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a pile with a non-existent station_id fails with ERR_NOT_FOUND (FK existence validated)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/piles", payload: { station_id: "00000000-0000-0000-0000-000000000000", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: booking_initial_state_requested
        claim_type: initial_state
        grounds: [state_machines.HarvestBooking]
        distinguishing_aspect: "A newly created booking starts in REQUESTED before any scheduler action."
        test_recipe:
          setup: ["campaign, member, station"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_status: $.data.status } }
          assert:
            - "b_status == REQUESTED"

      - name: ticket_accept_from_created_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LoadTicket, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept is only available from SAMPLED; a CREATED ticket rejects accept with ERR_INVALID_STATE."
        test_recipe:
          setup: ["campaign, member, station, pile, booking CONFIRMED, ticket created (not weighed)"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /api/tickets/${t_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sample_verify_of_quick_sample_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.QualitySample.RESULT_RECORDED_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Only LAB_VERIFY samples may be verified; verifying a RESULT_RECORDED STATION_QUICK sample fails with ERR_INVALID_STATE even by a different technician."
        test_recipe:
          setup: ["campaign, member, station, booking CONFIRMED, ticket weighed, STATION_QUICK sample recorded"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
          trigger:
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (STATION_QUICK samples are not verifiable)"

      - name: rejected_ticket_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LoadTicket]
        distinguishing_aspect: "A REJECTED ticket is terminal: subsequent weigh, accept, and void all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["full flow to a SAMPLED ticket whose provisional trash 21.00 > 20.00, then rejected"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 15.00, trash_pct: 21.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/tickets/${t_id}/reject", payload: { reason: "trash over limit" }, as: STATION_OPERATOR, captures: { t_status: $.data.status } }
          trigger:
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR, captures: { err1: $.data.error_id } }
            - { call: "POST /api/tickets/${t_id}/void", payload: { reason: "operator error" }, as: STATION_OPERATOR, captures: { err2: $.data.error_id } }
          assert:
            - "t_status == REJECTED"
            - "err1 == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE (terminal lockdown)"

      - name: ticket_auto_sampled_on_first_result
        claim_type: side_effect_execution
        grounds: [state_machines.LoadTicket.WEIGHED_to_SAMPLED, state_machines.QualitySample.COLLECTED_to_RESULT_RECORDED]
        distinguishing_aspect: "Recording the first sample result auto-transitions the ticket WEIGHED -> SAMPLED and computes provisional fields (system bubble-up, no explicit ticket call)."
        test_recipe:
          setup: ["campaign, member, station, booking CONFIRMED, ticket weighed 60000/32000 at slot clock"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "GET /api/tickets/${t_id}", as: POOL_ACCOUNTANT, captures: { t_status: $.data.status, prov_factor: $.data.provisional_factor, prov_adj: $.data.provisional_adjusted_net_tons } }
          assert:
            - "t_status == SAMPLED (auto-transition fired from the sample domain)"
            - "prov_adj == 13.8600 (net 28000 lbs = 14.0 t; trash 4.00 -> deducted 1.00%; 14.0 x 0.99)"
            - "prov_factor == 1.0200 (1.00 + (16.50 - 16.00) x 0.04)"

      - name: sample_invalidate_reverts_ticket_to_weighed
        claim_type: compensation
        grounds: [state_machines.QualitySample.RESULT_RECORDED_to_COLLECTED, state_machines.LoadTicket.SAMPLED_to_WEIGHED]
        distinguishing_aspect: "Invalidating the only recorded sample compensates the ticket's SAMPLED transition: ticket returns to WEIGHED and all provisional_* fields clear to null."
        test_recipe:
          setup: ["ticket WEIGHED then SAMPLED via a single STATION_QUICK sample 16.50/4.00"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
          trigger:
            - { call: "POST /api/samples/${s_id}/invalidate", as: QUALITY_TECH, captures: { s_status: $.data.status, s_sugar: $.data.sugar_pct } }
            - { call: "GET /api/tickets/${t_id}", as: POOL_ACCOUNTANT, captures: { t_status: $.data.status, prov_factor: $.data.provisional_factor } }
          assert:
            - "s_status == COLLECTED and s_sugar is null (result cleared)"
            - "t_status == WEIGHED and prov_factor is null (provisional computation compensated)"

      - name: booking_auto_in_use_then_completed
        claim_type: side_effect_execution
        grounds: [state_machines.HarvestBooking.CONFIRMED_to_IN_USE, state_machines.HarvestBooking.IN_USE_to_COMPLETED]
        distinguishing_aspect: "Booking auto-transitions: CONFIRMED -> IN_USE on first weigh and IN_USE -> COMPLETED on accept, releasing booked_tons at completion."
        test_recipe:
          setup: ["campaign, member, station (cap 100), pile; booking est 25 CONFIRMED (booked_tons 25); ticket created"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 100 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "GET /api/bookings/${b_id}", as: SCHEDULER, captures: { b_mid: $.data.status } }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/bookings/${b_id}", as: SCHEDULER, captures: { b_end: $.data.status } }
