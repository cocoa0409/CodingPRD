# =============================================================================
# SCAFFOLD — Listing Service Rules Enforcement & Member Discipline
# National-association-style multiple listing service (MLS) governance API.
# =============================================================================

scenario: |
  Listing Service Rules Enforcement & Member Discipline (National Association of Realtors):
  membership requirements linking association membership to multiple listing service
  access with dues structures, listing input rules covering timelines, accuracy, status
  changes and clear cooperation obligations, compensation display and offer of
  cooperation rules with policy changes and litigation-driven revisions, rules violation
  citation process with fines, hearings and escalation to professional standards panels,
  code of ethics complaints with grievance committee screening and hearing panels,
  arbitration of commission disputes between members with procurement of cause analysis,
  data licensing to portals and brokers with display rules and feed compliance
  monitoring, association and service consolidation with governance transitions.

domain_name: listing-service-rules-enforcement
api_prefix: /mls

# =============================================================================
# Complexity profile (§0.1–§0.4) — "much harder than expert level" calibration:
# maximal density, deep precedence interactions, adversarial boundaries.
# =============================================================================
complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: multi-party negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: association_code, type: string, source: input, description: "Globally unique association code (e.g. 'NOR')", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Legal association name" }
      - { name: consolidation_state, type: enum, source: system, description: "ACTIVE | MERGING | MERGED", constraints: "enum {ACTIVE, MERGING, MERGED}" }
      - { name: consolidated_into_id, type: string, source: system, default: null, description: "Reference to Association (self); survivor id when this association is MERGED, else null" }
      - { name: membership_dues_cents, type: integer, source: input, description: "Annual member dues in cents, >= 0" }
      - { name: late_fee_tier1_cents, type: integer, source: input, description: "Flat late fee assessed when 1 <= days_overdue <= 30" }
      - { name: late_fee_tier2_cents, type: integer, source: input, description: "Flat late fee assessed when days_overdue >= 31 (replaces tier1, not additive)" }
      - { name: sanction_credit_cap_cents, type: integer, source: input, default: 200000, description: "Cap on member sanction_credit_balance_cents; waiver overflow is rejected with ERR_CREDIT_CAP_EXCEEDED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PolicyRevision
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; owning association" }
      - { name: revision_code, type: string, source: input, description: "Human code (e.g. 'LIT-2024-COMP')", constraints: "unique within association" }
      - { name: effective_at, type: datetime, source: input, description: "Logical-clock instant from which this revision governs new events" }
      - { name: comp_display_mode, type: enum, source: input, description: "COMP_DISPLAY_ON (offer-of-cooperative-compensation shown on listings) | COMP_DISPLAY_OFF (compensation fields suppressed everywhere)", constraints: "enum {COMP_DISPLAY_ON, COMP_DISPLAY_OFF}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> ACTIVE | SUPERSEDED", constraints: "enum {SCHEDULED, ACTIVE, SUPERSEDED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Member
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; home association" }
      - { name: member_nr, type: string, source: input, description: "Association-scoped member number", constraints: "unique within association" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: membership_state, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "enum {ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: mls_access_state, type: enum, source: system, description: "ENABLED | DISABLED — derived from membership_state + dues posture", constraints: "enum {ENABLED, DISABLED}" }
      - { name: sanction_credit_balance_cents, type: integer, source: computed, default: 0, description: "Non-refundable credits from paid fines (only WAIVED citations decrement)" }
      - { name: strikes_12m, type: integer, source: computed, default: 0, description: "Count of PAID citations whose assessed_at falls in (now - 365d, now] and whose member reverted to ACTIVE within 30 days of that citation's assessed_at; recomputed on citation settlement and membership transitions" }
      - { name: hearing_panel_exclusions, type: array, source: computed, default: "[]", description: "Member ids that must be excluded from this member's hearing-panel candidate pool: the member themself, their own association's members, and respondents of any OPEN/DECIDED ArbitrationCase where this member is complainant or respondent" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Office
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; chartering association" }
      - { name: office_code, type: string, source: input, description: "Unique office code", constraints: "unique" }
      - { name: broker_member_id, type: string, source: input, description: "FK -> Member.id; designated broker (must be ACTIVE member of association_id)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "enum {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: DuesPeriod
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: year, type: integer, source: input, description: "Calendar year this period covers" }
      - { name: period_start_date, type: datetime, source: input, description: "First day of the billing year" }
      - { name: due_date, type: datetime, source: input, description: "Dues due at end of this day (23:59:59.999Z)" }
      - { name: grace_end_date, type: datetime, source: input, description: "Last day of grace; suspension fires at 00:00:00.000Z on grace_end_date + 1 day" }
      - { name: amount_cents, type: integer, source: input, description: "Dues amount for this year; tier boundary at AMOUNT_TIER_BOUNDARY_CENTS selects tier1/tier2 waiver schedule" }
      - { name: status, type: enum, source: system, description: "OPEN | BILLED | RECONCILED", constraints: "enum {OPEN, BILLED, RECONCILED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: DuesInvoice
    parent: DuesPeriod
    common_fields: true
    fields:
      - { name: dues_period_id, type: string, source: input, description: "FK -> DuesPeriod.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member (member.association_id must equal dues_period.association_id)" }
      - { name: base_amount_cents, type: integer, source: computed, description: "DuesPeriod.amount_cents at issuance (snapshot)" }
      - { name: days_overdue_at_issue, type: integer, source: computed, description: "floor((issued_at - due_date)/1d), floor 0" }
      - { name: late_fee_cents, type: integer, source: computed, description: "0 if days_overdue_at_issue==0; Association.late_fee_tier1_cents if 1..30; Association.late_fee_tier2_cents if >= 31 (tier2 replaces tier1)" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(member.sanction_credit_balance_cents, base+late_fee); debited at issuance" }
      - { name: amount_due_cents, type: integer, source: computed, description: "base_amount_cents + late_fee_cents - credit_applied_cents" }
      - { name: status, type: enum, source: system, description: "PENDING -> PAID | WAIVED", constraints: "enum {PENDING, PAID, WAIVED}" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "When fully settled" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Listing
    parent: Office
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> Office.id" }
      - { name: listing_member_id, type: string, source: input, description: "FK -> Member.id; responsible listing agent (must belong to office.association_id and be office broker or any ACTIVE member of that office)" }
      - { name: mls_number, type: string, source: input, description: "MLS number", constraints: "unique" }
      - { name: property_address, type: string, source: input, description: "Street address" }
      - { name: list_price_cents, type: integer, source: input, description: "List price in cents, > 0" }
      - { name: public_marketing_at, type: datetime, source: input, default: null, description: "First public marketing instant; clear-cooperation deadline derives from this" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PENDING | SOLD | WITHDRAWN | EXPIRED | CANCELLED", constraints: "enum {DRAFT, ACTIVE, PENDING, SOLD, WITHDRAWN, EXPIRED, CANCELLED}" }
      - { name: accuracy_flag, type: enum, source: system, default: CLEAN, description: "CLEAN | FLAGGED — FLAGGED set by auto-audit on late status change or by citation; blocks WITHDRAWN and CANCELLED transitions until citation resolves", constraints: "enum {CLEAN, FLAGGED}" }
      - { name: policy_revision_id, type: string, source: computed, description: "Reference to PolicyRevision; revision governing this listing — selected at activation as the ACTIVE revision with max effective_at among those with effective_at <= activation instant; superseded revisions never selected for new activations" }
      - { name: offer_comp_cents, type: integer, source: input, default: 0, description: "Offer of cooperative compensation in cents; forced to 0 and rejected on input when governing policy revision comp_display_mode == COMP_DISPLAY_OFF" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Activation instant (drives late-listing audit)" }
      - { name: status_changed_at, type: datetime, source: system, default: null, description: "Instant of last status change" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: StatusChange
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: from_status, type: enum, source: system, description: "Listing.status before this change" }
      - { name: to_status, type: enum, source: system, description: "Listing.status after this change" }
      - { name: business_effective_at, type: datetime, source: input, description: "When the off-MLS event actually occurred (e.g. contract signed); drives lateness audit" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock instant the change was entered" }
      - { name: late_by_hours, type: integer, source: computed, default: 0, description: "max(0, floor((recorded_at - business_effective_at)/1h) - 48) for PENDING/SOLD entries; 0 otherwise" }
      - { name: auto_citation_id, type: string, source: system, default: null, description: "Reference to Citation; set when late_by_hours > 0 triggers the auto-citation side effect" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Citation
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; citing authority (member.association_id must equal this)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; cited member" }
      - { name: listing_id, type: string, source: input, default: null, description: "FK -> Listing.id; subject listing when the rule violated is listing-scoped (null for membership-rule citations)" }
      - { name: rule_code, type: enum, source: input, description: "LATE_LISTING | LATE_STATUS | INACCURACY | CLEAR_COOP | COMP_OFFER | FEED_ABUSE", constraints: "enum {LATE_LISTING, LATE_STATUS, INACCURACY, CLEAR_COOP, COMP_OFFER, FEED_ABUSE}" }
      - { name: source, type: enum, source: system, default: STAFF, description: "STAFF | AUTO_LATE_LISTING | AUTO_LATE_STATUS", constraints: "enum {STAFF, AUTO_LATE_LISTING, AUTO_LATE_STATUS}" }
      - { name: fine_schedule_key, type: string, source: system, description: "Snapshot key '<rule_code>@<assessed_at date>' pinning the fine schedule row used" }
      - { name: fine_amount_cents, type: integer, source: computed, description: "Looked up in the active FineSchedule for (association, rule_code) at assessed_at; repeat-offense multipliers do NOT apply to citations (citation fines are flat per schedule)" }
      - { name: hearing_requested, type: boolean, source: system, default: false, description: "True once member elects hearing instead of paying" }
      - { name: assessed_at, type: datetime, source: system, description: "Citation issuance instant" }
      - { name: status, type: enum, source: system, description: "OPEN -> PAID | WAIVED | ESCALATED; hearing path: OPEN -> HEARING_PENDING -> {PAID, WAIVED, ESCALATED}", constraints: "enum {OPEN, HEARING_PENDING, PAID, WAIVED, ESCALATED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FineSchedule
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: rule_code, type: enum, source: input, description: "Same enum as Citation.rule_code", constraints: "enum {LATE_LISTING, LATE_STATUS, INACCURACY, CLEAR_COOP, COMP_OFFER, FEED_ABUSE}" }
      - { name: fine_amount_cents, type: integer, source: input, description: "Flat fine for this rule, > 0" }
      - { name: effective_from, type: datetime, source: input, description: "Schedule row applies to citations with assessed_at >= effective_from" }
      - { name: effective_to, type: datetime, source: input, default: null, description: "Exclusive upper bound; null = open-ended. Rows for the same (association_id, rule_code) MUST NOT overlap under half-open [effective_from, effective_to) semantics" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "enum {ACTIVE, RETIRED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: EthicsCase
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: complainant_member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: respondent_member_id, type: string, source: input, description: "FK -> Member.id; must differ from complainant_member_id" }
      - { name: article_code, type: string, source: input, description: "Code-of-ethics article cited (e.g. 'A16')" }
      - { name: grievance_review_due_at, type: datetime, source: computed, description: "filed_at + 45 days; grievance screening must conclude by this instant" }
      - { name: screening_outcome, type: enum, source: system, default: null, description: "DISMISSED | FORWARDED — set by grievance screening", constraints: "enum {DISMISSED, FORWARDED} or null" }
      - { name: filed_at, type: datetime, source: system, description: "Filing instant" }
      - { name: status, type: enum, source: system, description: "FILED -> GRIEVANCE_SCREENING -> {DISMISSED, HEARING_SCHEDULED} -> HEARD -> DECIDED | APPEALED -> FINAL", constraints: "enum {FILED, GRIEVANCE_SCREENING, DISMISSED, HEARING_SCHEDULED, HEARD, DECIDED, APPEALED, FINAL}" }
      - { name: sanction_cents, type: integer, source: system, default: 0, description: "Sanction set at DECIDED; applied as fine (never credit)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ArbitrationCase
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: complainant_member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: respondent_member_id, type: string, source: input, description: "FK -> Member.id; must differ from complainant_member_id" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the transaction whose commission is disputed" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Disputed commission amount, > 0" }
      - { name: filed_at, type: datetime, source: system, description: "Filing instant; arbitration window check uses listing's closing date + 180 days" }
      - { name: status, type: enum, source: system, description: "FILED -> MEDIATION_OFFERED -> {MEDIATED, ARBITRATION_SCHEDULED} -> HEARD -> AWARDED; MEDIATION_OFFERED -> ARBITRATION_SCHEDULED also allowed on mediation decline", constraints: "enum {FILED, MEDIATION_OFFERED, MEDIATED, ARBITRATION_SCHEDULED, HEARD, AWARDED}" }
      - { name: award_amount_cents, type: integer, source: system, default: 0, description: "Amount awarded to complainant at AWARDED (0 <= award <= claim)" }
      - { name: procuring_cause_factor_scores, type: object, source: system, default: "{}", description: "Map factor_key -> integer 0..10 recorded at hearing" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: HearingPanel
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; convening association" }
      - { name: case_type, type: enum, source: input, description: "CITATION | ETHICS | ARBITRATION", constraints: "enum {CITATION, ETHICS, ARBITRATION}" }
      - { name: case_id, type: string, source: input, description: "Id of the Citation | EthicsCase | ArbitrationCase this panel hears (polymorphic reference, pinned by case_type)" }
      - { name: selected_member_ids, type: array, source: system, description: "Exactly 3 panelist member ids chosen by the selector policy at convene time" }
      - { name: convene_at, type: datetime, source: system, default: null, description: "Instant the panel was convened (selection snapshot)" }
      - { name: decision, type: enum, source: system, default: null, description: "UPHOLD | OVERTURN — set by ruling", constraints: "enum {UPHOLD, OVERTURN} or null" }
      - { name: status, type: enum, source: system, description: "CONVENED -> HEARING_HELD -> DECIDED", constraints: "enum {CONVENED, HEARING_HELD, DECIDED}" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: DataLicense
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: licensee_name, type: string, source: input, description: "Portal or broker name", constraints: "unique within association" }
      - { name: scope, type: enum, source: input, description: "IDX (public display) | VOW (gated brokerage) | BACKOFFICE (internal analytics)", constraints: "enum {IDX, VOW, BACKOFFICE}" }
      - { name: display_ruleset_version, type: integer, source: input, description: "Display ruleset the licensee agreed to; feed compliance requires match with association's current ruleset" }
      - { name: listing_field_allowlist, type: array, source: input, description: "Listing field names the licensee may display; when the governing PolicyRevision has comp_display_mode == COMP_DISPLAY_OFF, 'offer_comp_cents' is stripped at sync time" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> {SUSPENDED, TERMINATED}; SUSPENDED -> ACTIVE allowed on cure", constraints: "enum {PENDING, ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: feed_sync_state, type: enum, source: system, default: STALE, description: "CURRENT | STALE — STALE until first feed sync after activation", constraints: "enum {CURRENT, STALE}" }
      - { name: last_audit_at, type: datetime, source: system, default: null, description: "Last feed-compliance audit instant" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ConsolidationEvent
    parent: Association
    common_fields: false
    fields:
      - { name: survivor_association_id, type: string, source: input, description: "FK -> Association.id; the surviving association" }
      - { name: absorbed_association_id, type: string, source: input, description: "FK -> Association.id; the absorbed association (must differ from survivor)" }
      - { name: effective_at, type: datetime, source: input, description: "Consolidation effective instant; must be a future instant at request time (scheduled consolidation)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> EXECUTED | CANCELLED", constraints: "enum {SCHEDULED, EXECUTED, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PolicyRevision
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /mls/_clock/advance_day or POST /mls/_clock/set_current_utc crossing effective_at"
        actor: system
        preconditions:
          - "logical clock >= effective_at"
        side_effects:
          - "Every other ACTIVE PolicyRevision of the same association with effective_at < this.effective_at -> SUPERSEDED (newest-effective_at-wins selector)"
          - "Every ACTIVE DataLicense of the association: display_ruleset_version unchanged but on next feed sync, 'offer_comp_cents' is stripped from listing_field_allowlist when this revision's comp_display_mode == COMP_DISPLAY_OFF"
          - "increments PolicyRevision.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — when a newer-effective_at PolicyRevision of the same association activates"
        actor: system
        preconditions: []
        side_effects:
          - "increments PolicyRevision.version by 1"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /mls/_clock/advance_day crosses a DuesPeriod.grace_end_date with the member's invoice for that period still PENDING; OR POST /mls/associations/{id}/dues-periods/{periodId}/reconcile marks member delinquent"
        actor: system
        preconditions:
          - "member has a PENDING DuesInvoice whose DuesPeriod.grace_end_date < current logical date"
        side_effects:
          - "mls_access_state -> DISABLED (derived)"
          - "Every listing where listing_member_id == member.id and status IN {DRAFT, ACTIVE, PENDING}: blocked from activation/status-change transitions while member is SUSPENDED (cross-entity gate)"
          - "member removed from all future HearingPanel candidate pools (hearing_panel_exclusions unchanged; eligibility predicate excludes SUSPENDED)"
          - "increments Member.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mls/associations/{id}/dues-invoices/{invoiceId}/pay settling the LAST PENDING DuesInvoice of the member"
        actor: Member
        preconditions:
          - "after this payment, member has zero PENDING DuesInvoices"
          - "days since suspension start <= 30 for strikes_12m accounting (the 30-day window affects strikes_12m inclusion, NOT the reinstatement itself — reinstatement is unconditional on zero PENDING invoices)"
        side_effects:
          - "mls_access_state -> ENABLED (derived)"
          - "recompute member.strikes_12m (see calculations.member_strikes_12m)"
          - "increments Member.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mls/associations/{id}/members/{memberId}/terminate"
        actor: AssociationStaff
        preconditions:
          - "member has been SUSPENDED for >= 90 consecutive days (computed from the DuesPeriod whose grace_end_date triggered the suspension)"
        side_effects:
          - "mls_access_state -> DISABLED (stays)"
          - "Every ACTIVE listing where listing_member_id == member.id -> WITHDRAWN with accuracy_flag preserved; office broker reassignment is out of scope (listings withdraw, office remains)"
          - "increments Member.version by 1"

  - entity: DuesPeriod
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: BILLED
        trigger: "POST /mls/associations/{id}/dues-periods/{periodId}/bill"
        actor: AssociationStaff
        preconditions:
          - "period.status == OPEN"
        side_effects:
          - "For every Member with association_id == period.association_id and membership_state == ACTIVE: create DuesInvoice (PENDING) per calculations.dues_invoice_amounts; debit sanction credits"
          - "increments DuesPeriod.version by 1"
      - from: BILLED
        to: RECONCILED
        trigger: "POST /mls/associations/{id}/dues-periods/{periodId}/reconcile"
        actor: AssociationStaff
        preconditions:
          - "period.status == BILLED"
          - "current logical date > period.grace_end_date"
        side_effects:
          - "Every member of the association whose invoice for this period is still PENDING -> membership_state SUSPENDED (cascades per Member ACTIVE->SUSPENDED side_effects)"
          - "increments DuesPeriod.version by 1"

  - entity: DuesInvoice
    initial_state: PENDING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /mls/associations/{id}/dues-invoices/{invoiceId}/pay"
        actor: Member
        preconditions:
          - "invoice.status == PENDING"
          - "actor X-User-ID == invoice.member_id (members pay their own invoices)"
        side_effects:
          - "paid_at = current logical instant"
          - "If member has zero remaining PENDING invoices and membership_state == SUSPENDED: membership_state -> ACTIVE, mls_access_state -> ENABLED, recompute strikes_12m (chain: invoice PAID -> member reinstated -> strikes recomputed -> future hearing-panel eligibility restored)"
          - "increments DuesInvoice.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /mls/associations/{id}/dues-invoices/{invoiceId}/waive"
        actor: AssociationStaff
        preconditions:
          - "invoice.status == PENDING"
          - "after waiver member would have zero PENDING invoices is NOT required (waiver is per-invoice)"
        side_effects:
          - "Waiver does NOT refund credit_applied_cents (credits are spent at issuance)"
          - "If member has zero remaining PENDING invoices and membership_state == SUSPENDED: same reinstatement chain as PAID"
          - "increments DuesInvoice.version by 1"

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [SOLD, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/activate"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing_member.membership_state == ACTIVE and mls_access_state == ENABLED (ERR_MEMBER_SUSPENDED otherwise)"
          - "office.status == ACTIVE"
          - "office.association.consolidation_state != MERGED (ERR_ASSOCIATION_MERGED)"
        side_effects:
          - "activated_at = current logical instant; status_changed_at = activated_at"
          - "policy_revision_id = selector: ACTIVE PolicyRevision of office.association with max effective_at <= activated_at; ties impossible (unique effective_at enforced); empty set -> ERR_POLICY_REVISION_MISSING"
          - "If public_marketing_at is set and activated_at > public_marketing_at + 1 day: auto-create Citation(rule_code=CLEAR_COOP, source=AUTO_LATE_LISTING) against listing_member_id (see calculations.clear_coop_late_check); accuracy_flag unchanged"
          - "If offer_comp_cents > 0 and governing revision comp_display_mode == COMP_DISPLAY_OFF: reject activation with ERR_COMP_DISPLAY_PROHIBITED (validation, not clamp)"
          - "record StatusChange(DRAFT->ACTIVE)"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: PENDING
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/status"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing_member ACTIVE + mls_access_state ENABLED"
        side_effects:
          - "status_changed_at = current logical instant; record StatusChange with business_effective_at from request"
          - "If StatusChange.late_by_hours > 0: auto-create Citation(rule_code=LATE_STATUS, source=AUTO_LATE_STATUS) and set listing.accuracy_flag = FLAGGED (cascade: status change -> auto-citation -> listing flagged -> listing cannot WITHDRAW/CANCEL until citation resolves)"
          - "increments Listing.version by 1"
      - from: PENDING
        to: SOLD
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/status"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing_member ACTIVE + mls_access_state ENABLED"
        side_effects:
          - "Same StatusChange + late-audit cascade as ACTIVE->PENDING"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/status"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing.accuracy_flag == CLEAN (ERR_LISTING_FLAGGED otherwise)"
        side_effects:
          - "record StatusChange; increments Listing.version by 1"
      - from: WITHDRAWN
        to: ACTIVE
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/activate"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing_member ACTIVE + ENABLED; office ACTIVE"
        side_effects:
          - "Same as DRAFT->ACTIVE (policy_revision_id re-selected at re-activation; clear-coop audit NOT re-run — public_marketing_at already consumed)"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /mls/associations/{id}/offices/{officeId}/listings/{listingId}/status"
        actor: Member
        preconditions:
          - "actor X-User-ID == listing.listing_member_id"
          - "listing.accuracy_flag == CLEAN"
        side_effects:
          - "record StatusChange; increments Listing.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /mls/associations/{id}/run-compliance-checkpoint when listing has been ACTIVE for > 365 days"
        actor: system
        preconditions: []
        side_effects:
          - "record StatusChange(ACTIVE->EXPIRED, business_effective_at = checkpoint instant)"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system — Member SUSPENDED->TERMINATED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "record StatusChange; accuracy_flag preserved; increments Listing.version by 1"
        note: "Second ACTIVE->WITHDRAWN edge with a different trigger (system cascade vs member action) — the member-action edge carries the accuracy_flag precondition; the cascade edge does not."

  - entity: StatusChange
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions: []
    note: "Append-only audit child of Listing; no transitions. Created by Listing transitions only."

  - entity: Citation
    initial_state: OPEN
    terminal_states: [PAID, WAIVED, ESCALATED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /mls/associations/{id}/citations/{citationId}/pay"
        actor: Member
        preconditions:
          - "actor X-User-ID == citation.member_id"
          - "tender_cents == citation.fine_amount_cents - min(citation.fine_amount_cents, member.sanction_credit_balance_cents) — credits auto-apply, member tenders only the remainder (ERR_TENDER_MISMATCH on any other amount)"
        side_effects:
          - "fine_amount_cents credited to member.sanction_credit_balance_cents (credits accrue on paid fines; cap at association.sanction_credit_cap_cents — overflow REJECTED with ERR_CREDIT_CAP_EXCEEDED before any state change, see validations)"
          - "recompute member.strikes_12m"
          - "If citation.listing_id is set and listing.accuracy_flag == FLAGGED and no other OPEN/HEARING_PENDING citation references that listing: accuracy_flag -> CLEAN (chain: citation paid -> flag cleared -> listing withdraw/cancel unblocked)"
          - "increments Citation.version by 1 and Listing.version by 1 (when flag flips)"
      - from: PAID
        to: PAID
        trigger: "POST /mls/associations/{id}/citations/{citationId}/donate-credit"
        actor: Member
        preconditions:
          - "citation.status == PAID (only settled fines yield stable credits)"
          - "member.sanction_credit_balance_cents + amount_cents <= association.sanction_credit_cap_cents (ERR_CREDIT_CAP_EXCEEDED otherwise; boundary: landing exactly AT the cap is allowed)"
        side_effects:
          - "member.sanction_credit_balance_cents += amount_cents (external settlement credit top-up; no fine linkage)"
          - "increments Member.version by 1"
        note: "Self-transition on the citation providing the deterministic endpoint that exercises the credit-cap boundary."
      - from: OPEN
        to: HEARING_PENDING
        trigger: "POST /mls/associations/{id}/citations/{citationId}/request-hearing"
        actor: Member
        preconditions:
          - "actor X-User-ID == citation.member_id"
          - "citation.hearing_requested == false"
          - "request made within 20 days of assessed_at (ERR_HEARING_WINDOW_CLOSED otherwise)"
        side_effects:
          - "hearing_requested = true"
          - "increments Citation.version by 1"
      - from: HEARING_PENDING
        to: PAID
        trigger: "system — HearingPanel DECIDED with decision == UPHOLD (citation upheld, fine must be paid; payment is recorded by the ruling side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "fine_amount_cents credited to member.sanction_credit_balance_cents (cap check applies — on overflow the ruling is rejected with ERR_CREDIT_CAP_EXCEEDED and citation stays HEARING_PENDING)"
          - "recompute member.strikes_12m"
          - "listing accuracy_flag unflag chain as in OPEN->PAID"
          - "increments Citation.version by 1"
      - from: HEARING_PENDING
        to: WAIVED
        trigger: "system — HearingPanel DECIDED with decision == OVERTURN"
        actor: system
        preconditions: []
        side_effects:
          - "NO credit (nothing was paid)"
          - "listing accuracy_flag unflag chain as in OPEN->PAID"
          - "increments Citation.version by 1"
      - from: HEARING_PENDING
        to: ESCALATED
        trigger: "system — HearingPanel DECIDED with decision == UPHOLD AND member.strikes_12m >= 3 at ruling time (escalation to professional standards instead of fine payment)"
        actor: system
        preconditions: []
        side_effects:
          - "fine_amount_cents NOT credited; no credit accrual on escalation"
          - "status=ESCALATED marks the case handed off to the association's professional standards process (out-of-band; no EthicsCase auto-created)"
          - "listing accuracy_flag unflag chain as in OPEN->PAID"
          - "increments Citation.version by 1"
        note: "UPHOLD at strikes_12m >= 3 routes to ESCALATED (professional standards) instead of PAID — branch selected at ruling time by member's live strikes_12m."

  - entity: FineSchedule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /mls/associations/{id}/fine-schedules/{scheduleId}/retire"
        actor: AssociationStaff
        preconditions:
          - "at least one other ACTIVE FineSchedule row remains for the same (association_id, rule_code) — retiring the last row is forbidden (ERR_LAST_FINE_SCHEDULE)"
        side_effects:
          - "increments FineSchedule.version by 1"

  - entity: EthicsCase
    initial_state: FILED
    terminal_states: [DISMISSED, FINAL]
    transitions:
      - from: FILED
        to: GRIEVANCE_SCREENING
        trigger: "system — automatic on filing (screening opens immediately)"
        actor: system
        preconditions: []
        side_effects:
          - "increments EthicsCase.version by 1"
      - from: GRIEVANCE_SCREENING
        to: DISMISSED
        trigger: "POST /mls/associations/{id}/ethics-cases/{caseId}/screen with outcome=DISMISSED"
        actor: GrievanceMember
        preconditions:
          - "actor is NOT the complainant and NOT the respondent (segregation of duties — ERR_SCREENING_CONFLICT)"
          - "current logical instant <= grievance_review_due_at (ERR_SCREENING_OVERDUE otherwise)"
        side_effects:
          - "screening_outcome = DISMISSED; increments EthicsCase.version by 1"
      - from: GRIEVANCE_SCREENING
        to: HEARING_SCHEDULED
        trigger: "POST /mls/associations/{id}/ethics-cases/{caseId}/screen with outcome=FORWARDED"
        actor: GrievanceMember
        preconditions:
          - "actor is NOT complainant and NOT respondent (ERR_SCREENING_CONFLICT)"
          - "current logical instant <= grievance_review_due_at (ERR_SCREENING_OVERDUE)"
        side_effects:
          - "screening_outcome = FORWARDED; increments EthicsCase.version by 1"
      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "system — linked HearingPanel transitions CONVENED -> HEARING_HELD"
        actor: system
        preconditions: []
        side_effects:
          - "increments EthicsCase.version by 1"
      - from: HEARD
        to: DECIDED
        trigger: "system — linked HearingPanel DECIDED"
        actor: system
        preconditions: []
        side_effects:
          - "If decision == UPHOLD: sanction_cents = calculations.ethics_sanction_amount (tiered on respondent strikes_12m); sanction applied as a fine-only ledger entry (never credits)"
          - "If decision == UPHOLD and respondent.strikes_12m >= 3 after sanction: respondent membership_state -> SUSPENDED (ethics-driven suspension; cascades Member side_effects)"
          - "increments EthicsCase.version by 1"
      - from: DECIDED
        to: APPEALED
        trigger: "POST /mls/associations/{id}/ethics-cases/{caseId}/appeal"
        actor: Member
        preconditions:
          - "actor X-User-ID == respondent_member_id"
          - "appeal within 20 days of the linked panel's ruling instant"
        side_effects:
          - "increments EthicsCase.version by 1"
      - from: APPEALED
        to: FINAL
        trigger: "POST /mls/associations/{id}/ethics-cases/{caseId}/appeal-ruling"
        actor: GrievanceMember
        preconditions:
          - "actor is NOT complainant, NOT respondent, and NOT a member of the original HearingPanel.selected_member_ids (segregation — ERR_APPEAL_CONFLICT)"
        side_effects:
          - "increments EthicsCase.version by 1"

  - entity: ArbitrationCase
    initial_state: FILED
    terminal_states: [AWARDED, MEDIATED]
    transitions:
      - from: FILED
        to: MEDIATION_OFFERED
        trigger: "system — automatic on filing"
        actor: system
        preconditions: []
        side_effects:
          - "increments ArbitrationCase.version by 1"
      - from: MEDIATION_OFFERED
        to: MEDIATED
        trigger: "POST /mls/associations/{id}/arbitration-cases/{caseId}/mediation-outcome with outcome=SETTLED"
        actor: AssociationStaff
        preconditions: []
        side_effects:
          - "increments ArbitrationCase.version by 1"
      - from: MEDIATION_OFFERED
        to: ARBITRATION_SCHEDULED
        trigger: "POST /mls/associations/{id}/arbitration-cases/{caseId}/mediation-outcome with outcome=DECLINED"
        actor: AssociationStaff
        preconditions: []
        side_effects:
          - "increments ArbitrationCase.version by 1"
      - from: ARBITRATION_SCHEDULED
        to: HEARD
        trigger: "system — linked HearingPanel CONVENED -> HEARING_HELD"
        actor: system
        preconditions: []
        side_effects:
          - "procuring_cause_factor_scores recorded from ruling payload"
          - "increments ArbitrationCase.version by 1"
      - from: HEARD
        to: AWARDED
        trigger: "system — linked HearingPanel DECIDED"
        actor: system
        preconditions: []
        side_effects:
          - "If decision == UPHOLD: award_amount_cents = calculations.procuring_cause_award on (claim_amount_cents, procuring_cause_factor_scores); else award_amount_cents = 0"
          - "increments ArbitrationCase.version by 1"

  - entity: HearingPanel
    initial_state: CONVENED
    terminal_states: [DECIDED]
    transitions:
      - from: CONVENED
        to: HEARING_HELD
        trigger: "POST /mls/associations/{id}/hearing-panels/{panelId}/hold-hearing"
        actor: HearingPanelist
        preconditions:
          - "actor X-User-ID IN selected_member_ids"
          - "For ARBITRATION panels: factor_scores payload (map of factor keys to integers 0..10) REQUIRED; stored onto the linked ArbitrationCase"
        side_effects:
          - "Linked case -> HEARD (EthicsCase HEARING_SCHEDULED->HEARD, ArbitrationCase ARBITRATION_SCHEDULED->HEARD; Citation has no HEARD state — citation stays HEARING_PENDING)"
          - "increments HearingPanel.version by 1"
      - from: HEARING_HELD
        to: DECIDED
        trigger: "POST /mls/associations/{id}/hearing-panels/{panelId}/rule"
        actor: HearingPanelist
        preconditions:
          - "actor X-User-ID IN selected_member_ids"
          - "The actor who triggered hold-hearing MUST NOT be the actor who triggers rule (segregation of duties within the panel — ERR_PANEL_SOLE_ACTOR)"
        side_effects:
          - "decision set from payload"
          - "CITATION case: citation HEARING_PENDING -> PAID (UPHOLD & strikes_12m < 3) | ESCALATED (UPHOLD & strikes_12m >= 3) | WAIVED (OVERTURN) — branch per Citation machine; chains into credit accrual, strikes recompute, listing unflag"
          - "ETHICS case: EthicsCase HEARD -> DECIDED with sanction chain"
          - "ARBITRATION case: ArbitrationCase HEARD -> AWARDED with award chain"
          - "increments HearingPanel.version by 1"

  - entity: DataLicense
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /mls/associations/{id}/data-licenses/{licenseId}/activate"
        actor: AssociationStaff
        preconditions:
          - "license.display_ruleset_version == association's current display ruleset version (tracked as the count of ACTIVE+SUPERSEDED PolicyRevisions; mismatch -> ERR_RULESET_MISMATCH)"
        side_effects:
          - "feed_sync_state = STALE (must sync before feeds are CURRENT)"
          - "increments DataLicense.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mls/associations/{id}/data-licenses/{licenseId}/audit-feed when audit finds a violation (listing_field_allowlist contains 'offer_comp_cents' while governing revision comp_display_mode == COMP_DISPLAY_OFF, OR display_ruleset_version drifted)"
        actor: AssociationStaff
        preconditions: []
        side_effects:
          - "last_audit_at = current logical instant"
          - "auto-create Citation(rule_code=FEED_ABUSE, source=STAFF, member_id = broker_member_id of the office owning the most-recently-activated ACTIVE listing of the association — deterministic selector: max(activated_at), tie-break created_at ASC) — cascade: audit fail -> license suspended -> citation issued -> citation OPEN affects member strikes on payment"
          - "increments DataLicense.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mls/associations/{id}/data-licenses/{licenseId}/cure"
        actor: AssociationStaff
        preconditions:
          - "cure submitted within 30 days of last_audit_at (ERR_CURE_WINDOW_CLOSED)"
          - "a subsequent audit (same request logically re-runs the compliance check) passes"
        side_effects:
          - "feed_sync_state = STALE"
          - "increments DataLicense.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mls/associations/{id}/data-licenses/{licenseId}/terminate"
        actor: AssociationStaff
        preconditions: []
        side_effects:
          - "increments DataLicense.version by 1"

  - entity: ConsolidationEvent
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /mls/associations/{id}/consolidations/{eventId}/execute (only at/after effective_at) or system on clock crossing effective_at"
        actor: AssociationStaff
        preconditions:
          - "current logical instant >= effective_at (ERR_CONSOLIDATION_NOT_DUE)"
          - "absorbed association consolidation_state == MERGING (set when this event was scheduled)"
        side_effects:
          - "absorbed Association.consolidation_state -> MERGED; consolidated_into_id = survivor_association_id"
          - "Every Member of absorbed association: association_id re-pointed to survivor (membership_state preserved); increments each re-pointed Member.version"
          - "Every ACTIVE DataLicense of absorbed association -> TERMINATED"
          - "Every OPEN/BILLED DuesPeriod of absorbed association: invoices stay with their member (members now belong to survivor); period -> RECONCILED only if BILLED else stays OPEN under absorbed (frozen) association"
          - "increments absorbed Association.version"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mls/associations/{id}/consolidations/{eventId}/cancel"
        actor: AssociationStaff
        preconditions:
          - "current logical instant < effective_at"
        side_effects: []

  - entity: Office
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — broker_member_id member transitions ACTIVE -> SUSPENDED (broker suspension suspends the office)"
        actor: system
        preconditions: []
        side_effects:
          - "All listings of the office blocked from activation while office SUSPENDED"
          - "increments Office.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — broker_member_id member reinstated SUSPENDED -> ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "increments Office.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /mls/associations/{id}/offices/{officeId}/close"
        actor: AssociationStaff
        preconditions:
          - "No listings of the office in status IN {DRAFT, ACTIVE, PENDING} (ERR_OFFICE_HAS_OPEN_LISTINGS)"
        side_effects:
          - "increments Office.version by 1"

  - entity: Association
    initial_state: ACTIVE
    terminal_states: [MERGED]
    transitions:
      - from: ACTIVE
        to: MERGING
        trigger: "system — ConsolidationEvent created with this association as absorbed_association_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: MERGING
        to: ACTIVE
        trigger: "system — ConsolidationEvent CANCELLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: MERGING
        to: MERGED
        trigger: "system — ConsolidationEvent EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "consolidated_into_id set; all child re-pointing per ConsolidationEvent.EXECUTED"
        note: "Cyclic MERGING<->ACTIVE loop: an association can be scheduled, cancelled, re-scheduled."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: policy-revision-create-stale-association
    parent_entity: Association
    write_endpoint: "POST /mls/associations/{id}/policy-revisions"
    occ_field: "expected_association_version"
    description: |
      Creating a PolicyRevision against an Association whose version has advanced
      since the client last observed it is rejected. The revision-selector on
      listing activation depends on the full ACTIVE set; a writer holding a stale
      association view could publish a revision that silently reorders governance.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dues-bill-stale-period
    parent_entity: DuesPeriod
    write_endpoint: "POST /mls/associations/{id}/dues-periods/{periodId}/bill"
    occ_field: "expected_dues_period_version"
    description: |
      Billing a DuesPeriod whose version has advanced since the client last
      observed it is rejected with a stale-version error; billing mints one
      invoice per ACTIVE member and a stale view risks double-billing after a
      corrective period edit.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dues_invoice_amounts
    trigger: "DuesPeriod OPEN -> BILLED (bill action)"
    algorithm: tiered_pricing
    formula: |
      For each billed member:
        base_amount_cents = DuesPeriod.amount_cents                      # snapshot
        days_overdue_at_issue = max(0, floor((issued_at - DuesPeriod.due_date) / 1 day))
        if days_overdue_at_issue == 0:
          late_fee_cents = 0
        elif days_overdue_at_issue <= 30:
          late_fee_cents = Association.late_fee_tier1_cents              # tier boundary: day 30 IN tier1
        else:                                                            # day 31+ IN tier2 (replaces tier1)
          late_fee_cents = Association.late_fee_tier2_cents
        credit_applied_cents = min(Member.sanction_credit_balance_cents,
                                   base_amount_cents + late_fee_cents)
        amount_due_cents = base_amount_cents + late_fee_cents - credit_applied_cents
        Member.sanction_credit_balance_cents -= credit_applied_cents
      Evaluation order is fixed: late fee tier -> credit cap -> amount due.
      Tier selection uses days at ISSUE, not days at payment.
    constants:
      LATE_TIER1_MAX_DAYS: 30
    precision: "integer cents; no rounding"
    variants:
      - name: prorated_midyear_join
        when: "member.created_at falls inside the billed period's [period_start_date, due_date] window"
        difference: "base_amount_cents = floor(DuesPeriod.amount_cents * remaining_days_in_period / 365) where remaining_days_in_period = (due_date - member.created_at)/1d + 1, computed BEFORE late-fee and credit steps; proration uses floor toward zero"
      - name: consolidated_member_variant
        when: "member.association_id was re-pointed by an EXECUTED ConsolidationEvent and the member had NO invoice in the absorbed association for the same calendar year"
        difference: "billed by the SURVIVOR association's DuesPeriod at the survivor's amount_cents; if the member already has any DuesInvoice (any status) for the same year from the absorbed association, the survivor's bill SKIPS the member (no double-billing) — dual-variant: same member, two valid dues amounts depending on consolidation history"

  - name: member_strikes_12m
    trigger: "Citation -> PAID; Member SUSPENDED -> ACTIVE reinstatement; ethics sanction application"
    algorithm: aggregation
    formula: |
      strikes_12m = count of Citations C where:
        C.member_id == member.id
        AND C.status == PAID
        AND C.assessed_at IN (now - 365 days, now]          # half-open: older boundary EXCLUSIVE, now INCLUSIVE
        AND (member's most recent SUSPENDED -> ACTIVE transition instant R satisfies
             R >= C.assessed_at AND (R - C.assessed_at) <= 30 days)
      The 30-day revert window is measured per-citation against the member's NEXT
      reinstatement after that citation's assessed_at; if no reinstatement exists
      after the citation, the citation still counts (never-suspended member).
      Tie/order note: when multiple reinstatements exist, use the FIRST
      reinstatement with R >= C.assessed_at.
    constants:
      STRIKE_WINDOW_DAYS: 365
      REVERT_WINDOW_DAYS: 30
      ESCALATION_THRESHOLD: 3
    precision: "integer count"
    variants:
      - name: ethics_strike_inclusion
        when: "recomputation triggered by an ethics UPHOLD ruling"
        difference: "the ethics sanction itself does NOT add a strike (sanctions are fine-only); only PAID citations count — dual-variant: same 'discipline ledger' concept, two valid inclusion sets depending on trigger context"

  - name: clear_coop_late_check
    trigger: "Listing DRAFT -> ACTIVE activation with public_marketing_at set"
    algorithm: threshold
    formula: |
      clear_coop_deadline = public_marketing_at + 1 day (exactly 24h; boundary inclusive:
      activation AT deadline is timely, activation 1 second after is late)
      if activated_at > clear_coop_deadline:
        auto-create Citation(rule_code=CLEAR_COOP, source=AUTO_LATE_LISTING,
                             member_id=listing.listing_member_id,
                             listing_id=listing.id)
      else: no citation
    constants:
      CLEAR_COOP_WINDOW_HOURS: 24
    precision: "datetime comparison, second resolution"

  - name: status_change_lateness
    trigger: "StatusChange creation on ACTIVE->PENDING or PENDING->SOLD"
    algorithm: threshold
    formula: |
      elapsed_hours = floor((recorded_at - business_effective_at) / 1 hour)
      late_by_hours = max(0, elapsed_hours - 48)
      if late_by_hours > 0:
        auto-create Citation(rule_code=LATE_STATUS, source=AUTO_LATE_STATUS,
                             member_id=listing.listing_member_id, listing_id=listing.id)
        Listing.accuracy_flag = FLAGGED
      # Boundary: recorded exactly 48h00m after business event is TIMELY;
      # 48h00m01s floors to 48h -> timely; 49h00m -> late_by_hours=1 -> late.
    constants:
      STATUS_CHANGE_GRACE_HOURS: 48
    precision: "integer hours, floor toward zero"

  - name: citation_fine_lookup
    trigger: "Citation creation (staff or auto)"
    algorithm: chronological
    formula: |
      # Half-open interval schedule lookup; rows ordered by effective_from ASC.
      candidates = FineSchedule rows where association_id == citation.association_id
                   AND rule_code == citation.rule_code
                   AND status == ACTIVE
                   AND effective_from <= assessed_at
                   AND (effective_to IS NULL OR assessed_at < effective_to)
      # Half-open [effective_from, effective_to): a citation assessed exactly AT
      # effective_to of row R belongs to the NEXT row, not R.
      # Adjacent rows (row2.effective_from == row1.effective_to) never overlap and
      # never gap — the boundary instant unambiguously selects row2.
      fine_amount_cents = the single matching row's fine_amount_cents
      fine_schedule_key = "<rule_code>@<YYYY-MM-DD of assessed_at>"
      if no row matches: reject citation creation with ERR_NO_FINE_SCHEDULE
    constants: {}
    precision: "integer cents"

  - name: procuring_cause_award
    trigger: "ArbitrationCase HEARD -> AWARDED with decision == UPHOLD"
    algorithm: weighted_scoring
    formula: |
      factors = procuring_cause_factor_scores  # recorded at hold-hearing
      required_keys = [F1_FIRST_CONTACT, F2_CONTINUOUS_EFFORT, F3_AGENCY_DISCLOSURE,
                       F4_CONTRACT_ROLE, F5_ABANDONMENT]
      weights          = [0.30,                0.25,                 0.15,
                          0.20,                 0.10]
      # Missing key or out-of-range value -> ERR_FACTOR_SCORE_INVALID at hold-hearing.
      score = sum(weight_i * factor_i)                       # 0.00 .. 10.00
      if score >= 7.00:   pct = 1.00                         # full award; boundary INCLUSIVE
      elif score >= 5.00: pct = 0.60
      elif score >= 3.00: pct = 0.30
      else:               pct = 0.00                         # OVERTURN-equivalent award of 0
      # Nested rounding order is PINNED: round the weighted score to 2 decimals
      # FIRST (round_half_up), THEN select pct tier, THEN
      #   award_cents = round_half_up(claim_amount_cents * pct)  — integer cents.
      # (Rounding claim*pct per-factor then summing is FORBIDDEN.)
      award_amount_cents = round_half_up(claim_amount_cents * pct)
    constants:
      TIER_FULL: 7.00
      TIER_HIGH: 5.00
      TIER_LOW: 3.00
    precision: "score 2 decimals round_half_up before tiering; award integer cents round_half_up"
    variants:
      - name: abandonment_zero_override
        when: "F5_ABANDONMENT >= 8 (respondent abandoned the transaction)"
        difference: "pct forced to 0.00 regardless of weighted score (override runs AFTER score rounding, BEFORE tier selection) — dual-variant: same inputs, two valid award amounts depending on the abandonment flag"

  - name: ethics_sanction_amount
    trigger: "EthicsCase HEARD -> DECIDED with decision == UPHOLD"
    algorithm: threshold
    formula: |
      # Tiered on respondent's LIVE strikes_12m at ruling instant.
      s = respondent.strikes_12m
      if s == 0:      sanction_cents = 50000     # $500.00
      elif s == 1:    sanction_cents = 100000
      elif s == 2:    sanction_cents = 250000
      else:           sanction_cents = 500000    # s >= 3; also triggers suspension chain
      # Boundary: strikes_12m is read AFTER the panel's decision is recorded but
      # BEFORE the case transitions — the citation-uphold branch of the SAME
      # ruling (if any) does not apply here; ethics and citation cases are
      # distinct panels.
    constants:
      SANCTION_TIERS_CENTS: [50000, 100000, 250000, 500000]
    precision: "integer cents"

  - name: hearing_panel_selection
    trigger: "HearingPanel creation (convene)"
    algorithm: selector
    formula: |
      # Selector policy over Member.
      case_subject_ids =
        CITATION:    {citation.member_id}
        ETHICS:      {ethics_case.complainant_member_id, ethics_case.respondent_member_id}
        ARBITRATION: {arb_case.complainant_member_id, arb_case.respondent_member_id}
      eligible = Members M where:
        M.membership_state == ACTIVE
        AND M.mls_access_state == ENABLED
        AND M.association_id == panel.association_id
        AND M.id NOT IN case_subject_ids
        AND M.id NOT IN union(case_subject.hearing_panel_exclusions)
        AND M has NOT served on any DECIDED HearingPanel for the SAME case_id
      # Exclusion chain: subjects, subjects' exclusion lists (cross-member: arbitration
      # counterparties exclude each other's whole dispute set), prior panelists.
      ranked = eligible sorted by:
        1. M.strikes_12m ASC              # fewest strikes first
        2. M.created_at ASC               # seniority tie-break (NEVER id)
      if len(ranked) < 3: reject convene with ERR_PANEL_POOL_EXHAUSTED
      selected_member_ids = first 3 of ranked (order preserved)
      convene_at = current logical instant (selection snapshot; later member
      suspensions do NOT retroactively invalidate the panel)
    constants:
      PANEL_SIZE: 3
    precision: "n/a"

  - name: association_ruleset_version
    trigger: "PolicyRevision activation; DataLicense activation/audit"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency, pinned evaluation order:
      #   ruleset_version feeds license compliance; license audit can create a
      #   citation; citation payment changes strikes; strikes never feed back
      #   into ruleset_version. Evaluation order: (1) count revisions, (2) evaluate
      #   license check, (3) issue citation.
      ruleset_version = count of PolicyRevisions of the association with
                        status IN {ACTIVE, SUPERSEDED}
      # A license is compliant iff license.display_ruleset_version == ruleset_version
      # AND (governing ACTIVE revision comp_display_mode == COMP_DISPLAY_ON
      #      OR 'offer_comp_cents' NOT IN license.listing_field_allowlist)
    constants: {}
    precision: "integer"

  - name: feed_sync_projection
    trigger: "POST /mls/associations/{id}/data-licenses/{licenseId}/sync-feed"
    algorithm: projection
    formula: |
      # Dual-variant feed projection: same listings, two valid payloads.
      # Variant IDX_PUBLIC: include only fields in listing_field_allowlist; listings
      #   in status IN {ACTIVE, PENDING} only.
      # Variant BACKOFFICE_FULL (scope == BACKOFFICE only): all fields; listings in
      #   status IN {ACTIVE, PENDING, SOLD, WITHDRAWN, EXPIRED, CANCELLED} (DRAFT excluded).
      # When governing revision comp_display_mode == COMP_DISPLAY_OFF: 'offer_comp_cents'
      # stripped from BOTH variants even if allowlisted.
      # On success: feed_sync_state = CURRENT; last_synced_listing_count recorded.
      # VOW scope uses IDX_PUBLIC variant plus 'office_id' always appended.
    constants: {}
    precision: "n/a"
    variants:
      - name: idx_public
        when: "scope IN {IDX, VOW}"
        difference: "status filter {ACTIVE, PENDING}; allowlist fields only"
      - name: backoffice_full
        when: "scope == BACKOFFICE"
        difference: "status filter {ACTIVE, PENDING, SOLD, WITHDRAWN, EXPIRED, CANCELLED}; all fields — dual-variant: identical listing set, different row counts and field sets"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present (except where the endpoint is staff-only and pins no audit id)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; entity_backed ownership checks (member acts on own listing/invoice/citation) — ERR_FORBIDDEN for wrong role, ERR_MEMBER_MISMATCH for right role but wrong member id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right: association -> office -> listing / period -> invoice / case -> panel; wrong-scope nesting yields ERR_NOT_FOUND not ERR_FORBIDDEN"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Association consolidation gate: mutations under a MERGED association (except reads) rejected; MERGING association rejects new ConsolidationEvent creation"
    error_id: ERR_ASSOCIATION_MERGED
    http_status: 409
    applies_to: "all mutating endpoints scoped under an association"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version present and equals current parent version on the two guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST policy-revisions, POST dues-periods/{id}/bill"
  - priority: 6
    category: state
    check: "Target entity in a legal source state for the requested transition (citation already PAID, invoice already PAID, listing already SOLD, panel already DECIDED, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Member disciplinary gate: listing activation/status-change requires listing_member ACTIVE + ENABLED; ethics screening/appeal segregation-of-duties conflicts; panel sole-actor prohibition"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "listing activate/status; screening/appeal endpoints use ERR_SCREENING_CONFLICT / ERR_APPEAL_CONFLICT / ERR_PANEL_SOLE_ACTOR (same priority tier)"
  - priority: 8
    category: business_constraint
    check: "Policy/compensation gate: activation with offer_comp_cents > 0 while governing revision comp_display_mode == COMP_DISPLAY_OFF; license activation ruleset match; accuracy_flag gate on withdraw/cancel"
    error_id: ERR_COMP_DISPLAY_PROHIBITED
    http_status: 409
    applies_to: "listing activate, license activate (ERR_RULESET_MISMATCH), listing status WITHDRAWN/CANCELLED (ERR_LISTING_FLAGGED)"
  - priority: 9
    category: business_temporal
    check: "Time-window rules: hearing request within 20d of assessed_at; screening by grievance_review_due_at; appeal within 20d of ruling; cure within 30d of audit; arbitration filed within closing+180d; consolidation execute not before effective_at"
    error_id: ERR_HEARING_WINDOW_CLOSED
    http_status: 409
    applies_to: "request-hearing, screen (ERR_SCREENING_OVERDUE), appeal (ERR_APPEAL_WINDOW_CLOSED), cure (ERR_CURE_WINDOW_CLOSED), arbitration create (ERR_ARBITRATION_WINDOW_CLOSED), consolidation execute (ERR_CONSOLIDATION_NOT_DUE)"
  - priority: 10
    category: business_fiscal
    check: "Money rules: sanction credit cap on citation payment (cap check BEFORE state change); arbitration filing fee sufficiency is out of scope (no fee); dues payment tender exactness (tender_cents must equal computed amount_due after auto-applied credits)"
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "citation pay, panel rule (uphold branch), invoice pay (ERR_TENDER_MISMATCH)"
  - priority: 11
    category: business_referential
    check: "Cross-entity referential integrity: invoice.member.association_id == period.association_id; listing member belongs to office association; citation member belongs to citing association; panel case_id resolves under case_type; office broker ACTIVE member of association"
    error_id: ERR_CROSS_ASSOCIATION_REFERENCE
    http_status: 422
    applies_to: "create endpoints with FK payloads"
  - priority: 12
    category: business_constraint
    check: "Structural/uniqueness rules: member_nr unique per association; mls_number unique; FineSchedule half-open overlap rejection; FineSchedule retire-last-row rejection; panel pool >= 3; complainant != respondent; office close with open listings"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "creates and structural actions (also ERR_SCHEDULE_OVERLAP, ERR_LAST_FINE_SCHEDULE, ERR_PANEL_POOL_EXHAUSTED, ERR_OFFICE_HAS_OPEN_LISTINGS, ERR_FACTOR_SCORE_INVALID, ERR_NO_FINE_SCHEDULE, ERR_POLICY_REVISION_MISSING)"

