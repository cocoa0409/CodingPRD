# =============================================================================
# PRD Benchmark Seed Tables — Ocean Cargo Insurance & Certificate Issuance
# Difficulty band: beyond Expert (§0.4) — 13 entities, 55 endpoints, 45 errors,
# 34 ordered validation rules, 10 calculations (2 dual-variant), 12 state
# machines over 10 entities (3 parallel state-axis pairs, 3 cyclic axes,
# 3 threshold-driven forks), 2 OCC races on parent versions.
# =============================================================================

scenario: |
  Ocean Cargo Insurance & Certificate Issuance (marine cargo insurer): open policy issuance with declared voyage terms, conveyance limits and warehouse-to-warehouse clauses, per-shipment certificate generation with insured value formulas including freight and markup, commodity susceptibility ratings and packaging warranty requirements, accumulation limits at ports and on single vessels, general average and salvage contribution handling with security posting, war and strikes coverage with automatic termination and reinstatement provisions, surveyor appointment, damage documentation and subrogation against carriers, premium reporting by declaration with audit

domain_name: ocean-cargo-insurance
# Flat topology: every collection is a top-level peer resource joined by foreign
# keys, so there is no single owning URL prefix. All paths below are absolute.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus            # deliberately above the Expert band of §0.4
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Thirteen peer collections (open-policies, certificates, vessels, ports,
  # surveyors, survey-orders, claim-files, ga-events, ...) linked purely by FK
  # fields carried in request bodies. The only nested paths are read-side
  # sub-resources (/ports/{id}/surveyors, /claim-files/{id}/documents)
  # and action verbs on a single resource; no entity is addressed through an
  # ancestor's id.

  state_machine_shape: parallel
  # Certificate carries two independent state axes on one row (`status` for the
  # certificate lifecycle x `war_cover_status` for the war/strikes cover axis),
  # ClaimFile likewise (`status` x `subrogation_status`) and its `status` axis is
  # cyclic (DOCS_INCOMPLETE -> SURVEY_ORDERED -> SURVEY_RECEIVED ->
  # DOCS_INCOMPLETE). OpenPolicy.war_cover_status cycles TERMINATED <->
  # REINSTATED. PremiumDeclaration and Vessel are branching fork machines whose
  # branch is chosen by a computed threshold, with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # OpenPolicy -> Certificate, ClaimFile -> DamageDocument
    - many_to_many         # Certificate <-> GeneralAverageEvent via GaSecurityPosting
    - self_referential     # Certificate.replaces_certificate_id -> Certificate.id (endorsement chain)
    - cross_aggregate      # AccumulationEntry links Certificate to Vessel and Port ledgers

  role_model: segregation_of_duties
  # ClaimsAdjuster cannot settle a claim they adjusted (X-User-ID compared to
  # ClaimFile.adjusted_by_user_id); PremiumAuditor cannot audit a declaration
  # they submitted (X-User-ID compared to PremiumDeclaration.submitted_by_user_id).
  # Underwriter, ComplianceOfficer, Surveyor and Assured own disjoint verbs.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: OpenPolicy
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - name: policy_number
        type: string
        source: input
        description: human-readable policy reference
        constraints: "unique across all OpenPolicy rows; 1..32 chars"
      - name: assured_name
        type: string
        source: input
        description: name of the assured (cargo owner) holding the open cover
      - name: inception_at
        type: datetime
        source: input
        description: first instant of the policy period (ISO 8601 UTC)
      - name: expiry_at
        type: datetime
        source: input
        description: exclusive upper bound of the policy period; cover attaches on [inception_at, expiry_at)
        constraints: "must be strictly greater than inception_at"
      - name: warehouse_to_warehouse
        type: boolean
        source: input
        description: when true the transit clause runs warehouse-to-warehouse and cover survives discharge for the storage window
        default: true
      - name: freight_basis
        type: enum
        source: input
        description: whether declared freight forms part of the CIF insured value base
        constraints: "PREPAID | COLLECT"
      - name: markup_pct
        type: number
        source: input
        description: advance/imaginary-profit markup applied to the CIF base under valuation_basis CIF_PLUS_MARKUP
        default: 0.10
        constraints: "0 <= markup_pct <= 0.30, 2 decimals"
      - name: per_certificate_limit_amount
        type: number
        source: input
        description: maximum insured_value permitted on any single Certificate
        constraints: "> 0"
      - name: conveyance_limit_amount
        type: number
        source: input
        description: maximum aggregate insured_value permitted on one conveyance (one vessel_id + sailing_date pair)
        constraints: ">= per_certificate_limit_amount"
      - name: annual_aggregate_limit_amount
        type: number
        source: input
        description: maximum cumulative insured_value bookable over the whole policy period
        constraints: ">= conveyance_limit_amount"
      - name: deductible_amount
        type: number
        source: input
        description: per-claim excess pinned onto every Certificate at issue time
        default: 0
      - name: premium_rate_per_mille
        type: number
        source: input
        description: base marine rate per mille of insured_value before commodity loading and vessel overage surcharge
        constraints: "> 0, 3 decimals"
      - name: war_rate_per_mille
        type: number
        source: input
        description: war-risk rate per mille of insured_value before the port war multiplier
        constraints: ">= 0, 3 decimals"
      - name: strikes_rate_per_mille
        type: number
        source: input
        description: strikes/riots/civil-commotions rate per mille of insured_value
        constraints: ">= 0, 3 decimals"
      - name: status
        type: enum
        source: system
        description: policy lifecycle axis
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | CANCELLED"
      - name: war_cover_status
        type: enum
        source: system
        description: war/strikes cover axis, independent of `status`; TERMINATED blocks new war cover and cycles back through REINSTATED
        default: ATTACHED
        constraints: "ATTACHED | TERMINATED | REINSTATED"
      - name: war_terminated_at
        type: datetime
        source: system
        description: logical-clock instant at which automatic war termination fired; null while ATTACHED or REINSTATED
        default: null
      - name: war_termination_port_unlocode
        type: string
        source: system
        description: UN/LOCODE string (not a foreign key) of the port whose LISTED_AREA designation triggered the last automatic termination
        default: null
      - name: reinstatement_rate_per_mille
        type: number
        source: system
        description: war rate per mille agreed at the most recent reinstatement; null until first reinstatement
        default: null
      - name: aggregate_insured_value_booked
        type: number
        source: computed
        description: cumulative insured_value of all Certificates on this policy with status in {ISSUED, TRANSIT_ENDED, CLAIMED}
        default: 0
      - name: aggregate_premium_booked
        type: number
        source: computed
        description: cumulative total_premium_amount + reinstatement_premium_amount over all non-DRAFT Certificates on this policy
        default: 0
      - name: aggregate_return_premium
        type: number
        source: computed
        description: cumulative return_premium_amount over all non-DRAFT Certificates on this policy
        default: 0
      - name: security_deposit_held_amount
        type: number
        source: computed
        description: cumulative cash_deposit_amount of GaSecurityPosting rows in status POSTED for Certificates on this policy
        default: 0
      - name: certificates_issued_count
        type: integer
        source: computed
        description: count of Certificates on this policy that have ever left DRAFT
        default: 0

  - name: CommodityClass
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: commodity class code
        constraints: "unique across all CommodityClass rows"
      - name: description
        type: string
        source: input
        description: plain-language commodity description
      - name: susceptibility_rating
        type: enum
        source: input
        description: loss-susceptibility band; S1 least susceptible, S4 most
        constraints: "S1 | S2 | S3 | S4"
      - name: required_packaging_code
        type: enum
        source: input
        description: packaging warranty — a Certificate naming this class must declare exactly this packaging_code
        constraints: "STD | EXPORT_CRATE | IBC_LINED | REEFER_SEALED"
      - name: rate_loading_pct
        type: number
        source: input
        description: multiplicative loading applied to premium_rate_per_mille for this susceptibility band
        constraints: "0 <= rate_loading_pct <= 2.00, 2 decimals"
      - name: max_conveyance_share_pct
        type: number
        source: input
        description: maximum share of the policy conveyance_limit_amount a single Certificate of this class may occupy
        default: 0.50
        constraints: "0 < max_conveyance_share_pct <= 1.00, 2 decimals"
      - name: survey_required_above_amount
        type: number
        source: input
        description: claimed_amount above which a filed surveyor report is mandatory before a claim may be adjusted
        default: 0

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: vessel name
      - name: imo_number
        type: string
        source: input
        description: IMO identification number
        constraints: "unique across all Vessel rows; exactly 7 digits"
      - name: year_built
        type: integer
        source: input
        description: year of build, used for the classification/overage clause
        constraints: "1900 <= year_built <= 2100"
      - name: classification_society
        type: enum
        source: input
        description: classification society; UNCLASSED fails the classification clause outright
        constraints: "LR | ABS | DNV | BV | NK | CCS | UNCLASSED"
      - name: flag_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 flag state code
      - name: vessel_accumulation_limit_amount
        type: number
        source: input
        description: maximum aggregate insured_value the insurer will carry on this single vessel at one time
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: insurability axis set by the classification review and by GA holds
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | APPROVED | OVERAGE_SURCHARGED | BLOCKED | GA_HOLD"
      - name: overage_surcharge_pct
        type: number
        source: computed
        description: multiplicative surcharge added to the effective rate for over-age tonnage; 0 unless status is OVERAGE_SURCHARGED
        default: 0
      - name: accumulated_insured_value
        type: number
        source: computed
        description: sum of AccumulationEntry.amount for scope_type VESSEL rows on this vessel with status ACTIVE
        default: 0
      - name: open_ga_event_count
        type: integer
        source: computed
        description: count of GeneralAverageEvent rows on this vessel whose status is not ADJUSTED
        default: 0

  - name: Port
    parent: null
    common_fields: true
    fields:
      - name: unlocode
        type: string
        source: input
        description: UN/LOCODE port identifier
        constraints: "unique across all Port rows; exactly 5 chars"
      - name: name
        type: string
        source: input
        description: port name
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country code
      - name: port_accumulation_limit_amount
        type: number
        source: input
        description: maximum aggregate insured_value permitted at this port for any overlapping storage window
        constraints: "> 0"
      - name: storage_free_days
        type: integer
        source: input
        description: free storage days after discharge before warehouse-to-warehouse cover lapses at this port
        default: 60
        constraints: "1 <= storage_free_days <= 60"
      - name: war_risk_tier
        type: enum
        source: input
        description: war-risk designation; LISTED_AREA triggers automatic war termination on policies exposed to this port
        default: GREEN
        constraints: "GREEN | AMBER | LISTED_AREA"
      - name: war_rate_multiplier
        type: number
        source: computed
        description: rate multiplier derived from war_risk_tier — GREEN 1.0, AMBER 1.5, LISTED_AREA 0.0 (no war cover obtainable)
        default: 1.0
      - name: accumulated_insured_value
        type: number
        source: computed
        description: sum of AccumulationEntry.amount for scope_type in {LOADING_PORT, DISCHARGE_PORT} rows on this port with status ACTIVE
        default: 0

  - name: Surveyor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: surveyor or survey firm name
      - name: panel_code
        type: string
        source: input
        description: insurer panel reference
        constraints: "unique across all Surveyor rows"
      - name: base_port_id
        type: string
        source: input
        description: FK -> Port.id; the port this surveyor is based at
      - name: certified_commodity_ratings
        type: array
        source: input
        description: susceptibility bands this surveyor is certified to survey
        constraints: "non-empty array of S1 | S2 | S3 | S4"
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: travel buffer applied to both ends of every appointment window when testing calendar conflicts
        default: 45
        constraints: "0 <= travel_buffer_minutes <= 240"
      - name: status
        type: enum
        source: system
        description: panel standing; only ACTIVE surveyors may be appointed
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: booked_minutes_total
        type: integer
        source: computed
        description: sum of window length in whole minutes over SurveyOrder rows for this surveyor with status in {APPOINTED, ATTENDED, REPORT_FILED}
        default: 0

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: open_policy_id
        type: string
        source: input
        description: FK -> OpenPolicy.id; the open cover the certificate declares under
      - name: commodity_class_id
        type: string
        source: input
        description: FK -> CommodityClass.id; commodity class governing loading and packaging warranty
      - name: vessel_id
        type: string
        source: input
        description: FK -> Vessel.id; the carrying conveyance
      - name: loading_port_id
        type: string
        source: input
        description: FK -> Port.id; port of loading
      - name: discharge_port_id
        type: string
        source: input
        description: FK -> Port.id; port of discharge
      - name: replaces_certificate_id
        type: string
        source: system
        description: FK -> Certificate.id; set on an endorsement replacement to the superseded certificate, null otherwise
        default: null
      - name: premium_declaration_id
        type: string
        source: system
        description: FK -> PremiumDeclaration.id; assigned when a declaration sweep claims this certificate, null while unreported
        default: null
      - name: certificate_number
        type: string
        source: input
        description: "the assured's own certificate reference, supplied on creation and re-supplied on endorsement for the replacement row"
        constraints: "unique across all Certificate rows"
      - name: valuation_basis
        type: enum
        source: input
        description: which insured-value algorithm applies
        constraints: "CIF_PLUS_MARKUP | DECLARED_VALUE"
      - name: invoice_value
        type: number
        source: input
        description: commercial invoice value of the goods
        constraints: "> 0, 2 decimals"
      - name: freight_amount
        type: number
        source: input
        description: declared ocean freight
        constraints: ">= 0, 2 decimals"
      - name: duty_amount
        type: number
        source: input
        description: declared duty at destination
        default: 0
        constraints: ">= 0, 2 decimals"
      - name: declared_value
        type: number
        source: input
        description: agreed insured value; required when valuation_basis is DECLARED_VALUE, ignored otherwise
        default: null
      - name: packaging_code
        type: enum
        source: input
        description: declared packaging, warranted to equal CommodityClass.required_packaging_code
        constraints: "STD | EXPORT_CRATE | IBC_LINED | REEFER_SEALED"
      - name: package_count
        type: integer
        source: input
        description: number of packages
        constraints: "> 0"
      - name: gross_weight_kg
        type: number
        source: input
        description: gross shipped weight in kilograms
        constraints: "> 0"
      - name: sailing_date
        type: datetime
        source: input
        description: sailing instant; also the conveyance key and the cover attachment instant
      - name: discharge_date
        type: datetime
        source: input
        description: expected discharge instant at the discharge port
        constraints: "strictly greater than sailing_date"
      - name: war_cover_requested
        type: boolean
        source: input
        description: whether war risk is bought on this shipment
        default: true
      - name: strikes_cover_requested
        type: boolean
        source: input
        description: whether strikes/riots risk is bought on this shipment
        default: true
      - name: insured_value
        type: number
        source: computed
        description: output of calculation `certificate_insured_value`, fixed at creation and recomputed only by endorsement
        default: null
      - name: attachment_at
        type: datetime
        source: computed
        description: instant cover attaches; equals sailing_date
        default: null
      - name: transit_termination_at
        type: datetime
        source: computed
        description: output of calculation `transit_termination_instant`; the warehouse-to-warehouse lapse instant
        default: null
      - name: effective_rate_per_mille
        type: number
        source: computed
        description: output of step 1 of calculation `certificate_premium_components`, rounded to 4 decimals before use
        default: null
      - name: base_premium_amount
        type: number
        source: computed
        description: rounded marine component of the premium
        default: null
      - name: war_premium_amount
        type: number
        source: computed
        description: rounded war component of the premium; 0.00 when war cover is not taken or not obtainable
        default: null
      - name: strikes_premium_amount
        type: number
        source: computed
        description: rounded strikes component of the premium; 0.00 when strikes cover is not taken
        default: null
      - name: total_premium_amount
        type: number
        source: computed
        description: sum of the three individually rounded premium components; never re-derived after issue
        default: null
      - name: reinstatement_premium_amount
        type: number
        source: computed
        description: additional war premium charged when policy war cover is reinstated over this certificate
        default: 0
      - name: return_premium_amount
        type: number
        source: computed
        description: cumulative premium returned on this certificate (cancellation return, supersession return, war termination return)
        default: 0
      - name: deductible_amount
        type: number
        source: computed
        description: excess copied from OpenPolicy.deductible_amount at issue time and never re-read afterwards
        default: null
      - name: status
        type: enum
        source: system
        description: certificate lifecycle axis, independent of war_cover_status
        default: DRAFT
        constraints: "DRAFT | ISSUED | SUPERSEDED | CANCELLED | TRANSIT_ENDED | CLAIMED"
      - name: war_cover_status
        type: enum
        source: system
        description: war/strikes cover axis on the same row; PENDING until issue, NOT_TAKEN when war_cover_requested is false or the discharge port is LISTED_AREA at issue
        default: PENDING
        constraints: "PENDING | ATTACHED | TERMINATED | REINSTATED | NOT_TAKEN"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the Underwriter who issued the certificate
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issue
        default: null
      - name: ga_contribution_amount
        type: number
        source: computed
        description: general-average contribution levied on this certificate by the most recent GaSecurityPosting
        default: 0

  - name: AccumulationEntry
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: system
        description: FK -> Certificate.id; the certificate that reserved this exposure
      - name: vessel_id
        type: string
        source: system
        description: FK -> Vessel.id; set when scope_type is VESSEL, null otherwise
        default: null
      - name: port_id
        type: string
        source: system
        description: FK -> Port.id; set when scope_type is LOADING_PORT or DISCHARGE_PORT, null otherwise
        default: null
      - name: scope_type
        type: enum
        source: system
        description: which accumulation ledger this entry occupies
        constraints: "VESSEL | LOADING_PORT | DISCHARGE_PORT"
      - name: amount
        type: number
        source: system
        description: exposure reserved, equal to the certificate's insured_value at the instant of reservation
      - name: window_start_at
        type: datetime
        source: system
        description: inclusive start of the occupation interval (VESSEL and LOADING_PORT use attachment_at, DISCHARGE_PORT uses discharge_date)
      - name: window_end_at
        type: datetime
        source: system
        description: exclusive end of the occupation interval (VESSEL and LOADING_PORT use discharge_date, DISCHARGE_PORT uses transit_termination_at)
      - name: status
        type: enum
        source: system
        description: whether the exposure is still held
        default: ACTIVE
        constraints: "ACTIVE | RELEASED"
      - name: release_reason
        type: enum
        source: system
        description: why the exposure was released
        default: NONE
        constraints: "NONE | CERTIFICATE_CANCELLED | CERTIFICATE_SUPERSEDED | TRANSIT_ENDED | DELIVERY_CONFIRMED"

  - name: PremiumDeclaration
    parent: null
    common_fields: true
    fields:
      - name: open_policy_id
        type: string
        source: input
        description: FK -> OpenPolicy.id; the policy whose certificates this declaration reports
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the reporting period
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the reporting period; certificates are swept on issued_at in [period_start, period_end)
        constraints: "strictly greater than period_start"
      - name: declared_premium_total
        type: number
        source: input
        description: premium total the assured self-reports at submit time
        default: null
      - name: computed_premium_total
        type: number
        source: computed
        description: output of calculation `declaration_premium_reconciliation`; the insurer's own sweep of the period
        default: null
      - name: certificate_count
        type: integer
        source: computed
        description: number of certificates claimed by this declaration's sweep
        default: 0
      - name: variance_amount
        type: number
        source: computed
        description: declared_premium_total minus computed_premium_total, 2 decimals, signed
        default: null
      - name: variance_pct
        type: number
        source: computed
        description: absolute variance as a percentage of computed_premium_total, 2 decimals, with the zero-denominator rule pinned in §1.3
        default: null
      - name: audit_adjustment_amount
        type: number
        source: computed
        description: absolute premium adjustment booked by the audit branch; 0.00 on the ACCEPTED branch
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the Assured principal that submitted the declaration
        default: null
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the PremiumAuditor that opened the audit; must differ from submitted_by_user_id
        default: null
      - name: submission_count
        type: integer
        source: computed
        description: how many times this declaration has entered SUBMITTED, including re-submissions after an ADJUSTED outcome
        default: 0
      - name: status
        type: enum
        source: system
        description: declaration lifecycle; ADJUSTED cycles back to SUBMITTED on re-submission
        default: OPEN
        constraints: "OPEN | SUBMITTED | UNDER_AUDIT | ADJUSTED | ACCEPTED"

  - name: ClaimFile
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: FK -> Certificate.id; the certificate the loss is claimed under
      - name: ga_event_id
        type: string
        source: system
        description: FK -> GeneralAverageEvent.id; linked when the loss_type is GENERAL_AVERAGE and a security call exists for the same certificate, null otherwise
        default: null
      - name: loss_type
        type: enum
        source: input
        description: nature of the loss, which fixes the required documentation set
        constraints: "PARTICULAR_AVERAGE | GENERAL_AVERAGE | SALVAGE_CHARGE | TOTAL_LOSS | SHORTAGE"
      - name: peril
        type: enum
        source: input
        description: proximate peril; WAR and STRIKES perils require the corresponding cover to be in force at loss_date
        constraints: "SEA_PERIL | WET_DAMAGE | JETTISON | WAR | STRIKES | THEFT | HANDLING"
      - name: adjustment_basis
        type: enum
        source: input
        description: which loss-adjustment algorithm applies
        constraints: "DEPRECIATION_PCT | SALVAGE_SALE_PROCEEDS"
      - name: claimed_amount
        type: number
        source: input
        description: amount claimed by the assured
        constraints: "> 0, 2 decimals"
      - name: loss_date
        type: datetime
        source: input
        description: instant of loss; must fall inside the certificate's cover interval
      - name: damage_percentage
        type: number
        source: input
        description: percentage of depreciation certified by survey; required at adjust time under DEPRECIATION_PCT
        default: null
        constraints: "0 < damage_percentage <= 100, 2 decimals"
      - name: sound_market_value
        type: number
        source: input
        description: sound market value at destination; required at adjust time under SALVAGE_SALE_PROCEEDS
        default: null
      - name: damaged_sale_proceeds
        type: number
        source: input
        description: gross proceeds of the damaged-goods sale; required at adjust time under SALVAGE_SALE_PROCEEDS
        default: null
      - name: carrier_name
        type: string
        source: input
        description: carrier the recovery action targets
        default: null
      - name: adjusted_amount
        type: number
        source: computed
        description: output of calculation `claim_adjusted_amount`, net of the pinned deductible and floored at 0.00
        default: null
      - name: deductible_applied_amount
        type: number
        source: computed
        description: portion of Certificate.deductible_amount actually absorbed by this adjustment
        default: 0
      - name: settled_amount
        type: number
        source: computed
        description: amount paid to the assured at settlement; equals adjusted_amount on the SETTLED branch
        default: 0
      - name: documentation_complete
        type: boolean
        source: computed
        description: true when the required doc_type set for loss_type is a subset of the DamageDocument doc_types on this claim
        default: false
      - name: warranty_breach
        type: boolean
        source: computed
        description: true once a filed survey report records packaging_compliant false
        default: false
      - name: adjusted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster that adjusted the claim; settlement must be performed by a different X-User-ID
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster that settled the claim
        default: null
      - name: subrogation_status
        type: enum
        source: system
        description: recovery axis, independent of `status`
        default: NOT_STARTED
        constraints: "NOT_STARTED | NOTICE_SENT | RECOVERED | TIME_BARRED"
      - name: subrogation_notice_at
        type: datetime
        source: system
        description: logical-clock instant the carrier notice was raised
        default: null
      - name: time_bar_at
        type: datetime
        source: computed
        description: Certificate.discharge_date plus SUBROGATION_TIME_BAR_DAYS; recovery notice is barred at or after this instant
        default: null
      - name: recovered_amount
        type: number
        source: computed
        description: cumulative amount recovered from the carrier
        default: 0
      - name: net_loss_amount
        type: number
        source: computed
        description: settled_amount minus recovered_amount
        default: 0
      - name: status
        type: enum
        source: system
        description: claim lifecycle axis; the DOCS_INCOMPLETE -> SURVEY_ORDERED -> SURVEY_RECEIVED -> DOCS_INCOMPLETE rework loop is cyclic
        default: OPENED
        constraints: "OPENED | SURVEY_ORDERED | SURVEY_RECEIVED | DOCS_INCOMPLETE | ADJUSTED | SETTLED | DENIED"

  - name: DamageDocument
    parent: null
    common_fields: false        # append-only evidence log: id + created_at only, no version, no update endpoint
    fields:
      - name: claim_file_id
        type: string
        source: input
        description: FK -> ClaimFile.id; the claim this evidence belongs to
      - name: doc_type
        type: enum
        source: input
        description: documentary evidence type
        constraints: "SURVEY_REPORT | PACKING_LIST | BILL_OF_LADING | COMMERCIAL_INVOICE | CARRIER_CLAIM_LETTER | PHOTO_SET"
      - name: reference
        type: string
        source: input
        description: free-text document reference or file locator
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the document was logged
      - name: origin
        type: enum
        source: system
        description: ADJUSTER for documents posted by a ClaimsAdjuster, SURVEYOR for documents posted by a Surveyor or auto-logged by a filed survey report
        constraints: "ADJUSTER | SURVEYOR"

  - name: SurveyOrder
    parent: null
    common_fields: true
    fields:
      - name: claim_file_id
        type: string
        source: input
        description: FK -> ClaimFile.id; the claim the survey is ordered for
      - name: surveyor_id
        type: string
        source: input
        description: FK -> Surveyor.id; the appointed surveyor, always supplied explicitly by the adjuster
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the attendance window
      - name: window_end_at
        type: datetime
        source: input
        description: inclusive end of the attendance window
        constraints: "strictly greater than window_start_at; window length <= 480 minutes"
      - name: window_minutes
        type: integer
        source: computed
        description: whole minutes between window_start_at and window_end_at
        default: null
      - name: packaging_compliant
        type: boolean
        source: input
        description: surveyor's finding on packaging warranty compliance, supplied when the report is filed
        default: null
      - name: damage_percentage_found
        type: number
        source: input
        description: depreciation percentage certified by the surveyor, supplied when the report is filed
        default: null
      - name: report_reference
        type: string
        source: input
        description: surveyor's report reference, supplied when the report is filed
        default: null
      - name: status
        type: enum
        source: system
        description: appointment lifecycle
        default: APPOINTED
        constraints: "APPOINTED | ATTENDED | REPORT_FILED | CANCELLED"

  - name: GeneralAverageEvent
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: FK -> Vessel.id; the vessel on which general average was declared
      - name: voyage_sailing_date
        type: datetime
        source: input
        description: sailing_date identifying the conveyance whose certificates contribute
      - name: declaration_date
        type: datetime
        source: input
        description: instant general average was declared by the master
      - name: average_adjuster_name
        type: string
        source: input
        description: appointed average adjuster
      - name: sacrifice_amount
        type: number
        source: input
        description: general-average sacrifice and expenditure allowed in the adjustment
        constraints: ">= 0, 2 decimals"
      - name: salvage_award_amount
        type: number
        source: input
        description: salvage award to be apportioned alongside the sacrifice
        default: 0
      - name: adjuster_fee_amount
        type: number
        source: computed
        description: adjuster fee, computed from the pre-fee base only, per the pinned evaluation order in §1.3
        default: null
      - name: total_allowance_amount
        type: number
        source: computed
        description: sacrifice_amount + salvage_award_amount + adjuster_fee_amount
        default: null
      - name: total_contributory_value
        type: number
        source: computed
        description: sum of contributory values of all contributing certificates
        default: null
      - name: contribution_rate
        type: number
        source: computed
        description: total_allowance_amount / total_contributory_value, rounded to 6 decimals before per-certificate application
        default: null
      - name: postings_required_count
        type: integer
        source: computed
        description: number of GaSecurityPosting rows created by the security call
        default: 0
      - name: postings_posted_count
        type: integer
        source: computed
        description: number of GaSecurityPosting rows on this event with status POSTED
        default: 0
      - name: status
        type: enum
        source: system
        description: general-average lifecycle
        default: DECLARED
        constraints: "DECLARED | SECURITY_COLLECTING | SECURITY_COMPLETE | ADJUSTED"

  - name: GaSecurityPosting
    parent: null
    common_fields: true
    fields:
      - name: ga_event_id
        type: string
        source: system
        description: FK -> GeneralAverageEvent.id; the adjustment this security call belongs to
      - name: certificate_id
        type: string
        source: system
        description: FK -> Certificate.id; the contributing interest
      - name: contributory_value
        type: number
        source: system
        description: the certificate's insured_value at the instant the security call was issued
      - name: contribution_amount
        type: number
        source: computed
        description: pro-rata contribution including any residual-cent allocation, per §1.3 `ga_contribution_allocation`
        default: null
      - name: cash_deposit_required
        type: boolean
        source: computed
        description: true when contribution_amount exceeds GA_CASH_DEPOSIT_THRESHOLD
        default: false
      - name: cash_deposit_expected_amount
        type: number
        source: computed
        description: GA_CASH_DEPOSIT_PCT of contribution_amount, rounded to 2 decimals; 0.00 when cash_deposit_required is false
        default: null
      - name: guarantee_amount
        type: number
        source: input
        description: average-guarantee amount actually posted by the assured
        default: null
      - name: cash_deposit_amount
        type: number
        source: input
        description: cash deposit actually lodged by the assured
        default: null
      - name: status
        type: enum
        source: system
        description: security lifecycle
        default: REQUIRED
        constraints: "REQUIRED | POSTED | RELEASED"

# =============================================================================
# 1.2 State Machine Table
# Nine machines. Certificate, OpenPolicy and ClaimFile each carry TWO
# independent state fields on one row (parallel dimensions); the axis a machine
# governs is named in `state_field:`.
# =============================================================================
state_machines:

  - entity: OpenPolicy
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /open-policies/{id}/activate"
        actor: Underwriter
        preconditions:
          - "status == DRAFT"
          - "expiry_at > inception_at"
          - "conveyance_limit_amount >= per_certificate_limit_amount"
          - "annual_aggregate_limit_amount >= conveyance_limit_amount"
        side_effects:
          - "status := ACTIVE"
          - "war_cover_status remains ATTACHED (the two axes are independent)"
          - "version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: cascade link 3 of POST /premium-declarations/{id}/finish-audit when variance_pct > DECLARATION_SUSPENSION_PCT"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the finishing declaration's status became ADJUSTED in the same request"
          - "the declaration's variance_pct > DECLARATION_SUSPENSION_PCT"
        side_effects:
          - "status := SUSPENDED"
          - "no new Certificate may be created or issued while SUSPENDED (§1.4 priority 8)"
          - "version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: cascade of POST /premium-declarations/{id}/submit when the re-submitted declaration's variance_pct <= DECLARATION_AUDIT_TOLERANCE_PCT"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "the re-submitted declaration is the same declaration whose audit caused the suspension"
          - "recomputed variance_pct <= DECLARATION_AUDIT_TOLERANCE_PCT"
        side_effects:
          - "status := ACTIVE"
          - "version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: evaluated inside POST /open-policies/{id}/run-transit-sweep"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "logical clock >= expiry_at"
        side_effects:
          - "status := EXPIRED"
          - "no new Certificate may be created or issued"
          - "already-ISSUED certificates keep running to their own transit_termination_at"
          - "version incremented by 1"

  - entity: OpenPolicy
    state_field: war_cover_status
    initial_state: ATTACHED
    terminal_states: []
    transitions:
      - from: ATTACHED
        to: TERMINATED
        trigger: "system event: cascade link 2 of POST /ports/{id}/war-risk-tier when the new tier is LISTED_AREA"
        actor: system
        preconditions:
          - "war_cover_status == ATTACHED"
          - "at least one Certificate on this policy has status == ISSUED and (loading_port_id == the listed port OR discharge_port_id == the listed port)"
        side_effects:
          - "war_cover_status := TERMINATED"
          - "war_terminated_at := logical clock now"
          - "war_termination_port_unlocode := the listed Port.unlocode"
          - "cascade link 3 fires on this policy's exposed certificates (see Certificate.war_cover_status ATTACHED -> TERMINATED)"
          - "version incremented by 1"
      - from: REINSTATED
        to: TERMINATED
        trigger: "system event: cascade link 2 of POST /ports/{id}/war-risk-tier when the new tier is LISTED_AREA"
        actor: system
        preconditions:
          - "war_cover_status == REINSTATED"
          - "at least one Certificate on this policy has status == ISSUED and touches the newly listed port"
        side_effects:
          - "war_cover_status := TERMINATED (the axis is cyclic: TERMINATED <-> REINSTATED)"
          - "war_terminated_at := logical clock now"
          - "war_termination_port_unlocode := the listed Port.unlocode"
          - "version incremented by 1"
      - from: TERMINATED
        to: REINSTATED
        trigger: "POST /open-policies/{id}/reinstate-war-cover"
        actor: ComplianceOfficer
        preconditions:
          - "war_cover_status == TERMINATED"
          - "status == ACTIVE"
          - "reinstatement_rate_per_mille input > 0"
        side_effects:
          - "war_cover_status := REINSTATED"
          - "reinstatement_rate_per_mille := the supplied rate"
          - "war_terminated_at := null; war_termination_port_unlocode := null"
          - "conditional cascade: every Certificate on this policy with status == ISSUED and war_cover_status == TERMINATED whose loading Port.war_risk_tier != LISTED_AREA AND discharge Port.war_risk_tier != LISTED_AREA moves to REINSTATED and books reinstatement_premium_amount; certificates still touching a LISTED_AREA port stay TERMINATED"
          - "aggregate_premium_booked increased by the sum of the booked reinstatement_premium_amount values"
          - "version incremented by 1"

  - entity: Vessel
    state_field: status
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /vessels/{id}/classification-review"
        actor: Underwriter
        preconditions:
          - "status == PENDING_REVIEW"
          - "classification_society != UNCLASSED"
          - "vessel_age_years <= VESSEL_OVERAGE_YEARS (calculation `vessel_classification_decision`)"
        side_effects:
          - "status := APPROVED"
          - "overage_surcharge_pct := 0"
          - "version incremented by 1"
        note: "branch 1 of a three-way fork; the branch is chosen by the computed age, not by the caller"
      - from: PENDING_REVIEW
        to: OVERAGE_SURCHARGED
        trigger: "POST /vessels/{id}/classification-review"
        actor: Underwriter
        preconditions:
          - "status == PENDING_REVIEW"
          - "classification_society != UNCLASSED"
          - "VESSEL_OVERAGE_YEARS < vessel_age_years <= VESSEL_BLOCK_YEARS"
        side_effects:
          - "status := OVERAGE_SURCHARGED"
          - "overage_surcharge_pct := VESSEL_OVERAGE_SURCHARGE_PCT"
          - "every subsequent Certificate issue on this vessel loads the effective rate by overage_surcharge_pct"
          - "version incremented by 1"
        note: "branch 2 of the fork; divergent side-effect set — this branch writes a non-zero surcharge that changes premium arithmetic"
      - from: PENDING_REVIEW
        to: BLOCKED
        trigger: "POST /vessels/{id}/classification-review"
        actor: Underwriter
        preconditions:
          - "status == PENDING_REVIEW"
          - "classification_society == UNCLASSED OR vessel_age_years > VESSEL_BLOCK_YEARS"
        side_effects:
          - "status := BLOCKED"
          - "overage_surcharge_pct := 0"
          - "no Certificate naming this vessel may be issued (§1.4 priority 8)"
          - "version incremented by 1"
        note: "branch 3 of the fork"
      - from: APPROVED
        to: GA_HOLD
        trigger: "system event: cascade of POST /ga-events"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "a GeneralAverageEvent was just created on this vessel"
        side_effects:
          - "status := GA_HOLD"
          - "open_ga_event_count incremented by 1"
          - "no Certificate naming this vessel may be issued while GA_HOLD"
          - "version incremented by 1"
      - from: OVERAGE_SURCHARGED
        to: GA_HOLD
        trigger: "system event: cascade of POST /ga-events"
        actor: system
        preconditions:
          - "status == OVERAGE_SURCHARGED"
          - "a GeneralAverageEvent was just created on this vessel"
        side_effects:
          - "status := GA_HOLD"
          - "open_ga_event_count incremented by 1"
          - "overage_surcharge_pct is preserved so it can be restored when the hold lifts"
          - "version incremented by 1"
      - from: GA_HOLD
        to: APPROVED
        trigger: "system event: cascade link 4 of POST /ga-events/{id}/finalize-adjustment"
        actor: system
        preconditions:
          - "status == GA_HOLD"
          - "open_ga_event_count reached 0 as a consequence of this event closing"
          - "overage_surcharge_pct == 0"
        side_effects:
          - "status := APPROVED"
          - "version incremented by 1"
      - from: GA_HOLD
        to: OVERAGE_SURCHARGED
        trigger: "system event: cascade link 4 of POST /ga-events/{id}/finalize-adjustment"
        actor: system
        preconditions:
          - "status == GA_HOLD"
          - "open_ga_event_count reached 0 as a consequence of this event closing"
          - "overage_surcharge_pct > 0"
        side_effects:
          - "status := OVERAGE_SURCHARGED"
          - "version incremented by 1"

  - entity: Certificate
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED, TRANSIT_ENDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /certificates/{id}/issue"
        actor: Underwriter
        preconditions:
          - "status == DRAFT"
          - "OpenPolicy.status == ACTIVE"
          - "Vessel.status IN {APPROVED, OVERAGE_SURCHARGED}"
          - "expected_open_policy_version == OpenPolicy.version (§1.2.1 certificate-issue-stale-policy)"
          - "conveyance, vessel-accumulation, port-accumulation and annual-aggregate checks all pass (§1.4 priorities 21-24)"
        side_effects:
          - "effective_rate_per_mille, base_premium_amount, war_premium_amount, strikes_premium_amount and total_premium_amount computed by `certificate_premium_components`"
          - "deductible_amount := OpenPolicy.deductible_amount (pinned; later policy edits never reach this certificate)"
          - "issued_by_user_id := X-User-ID; issued_at := logical clock now"
          - "war_cover_status := ATTACHED when war_cover_requested is true and neither port is LISTED_AREA, else NOT_TAKEN"
          - "three AccumulationEntry rows created in status ACTIVE: scope_type VESSEL, LOADING_PORT, DISCHARGE_PORT, each with amount == insured_value"
          - "Vessel.accumulated_insured_value increased by insured_value"
          - "loading Port.accumulated_insured_value and discharge Port.accumulated_insured_value each increased by insured_value"
          - "OpenPolicy.aggregate_insured_value_booked increased by insured_value; aggregate_premium_booked increased by total_premium_amount; certificates_issued_count incremented by 1"
          - "OpenPolicy.version incremented by 1"
          - "version incremented by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /certificates/{id}/endorse"
        actor: Underwriter
        preconditions:
          - "status == ISSUED"
          - "premium_declaration_id IS NULL (a reported certificate cannot be endorsed)"
          - "OpenPolicy.status == ACTIVE"
        side_effects:
          - "status := SUPERSEDED"
          - "return_premium_amount increased by this certificate's total_premium_amount + reinstatement_premium_amount (full ab-initio return)"
          - "all AccumulationEntry rows for this certificate with status ACTIVE become RELEASED with release_reason CERTIFICATE_SUPERSEDED"
          - "Vessel.accumulated_insured_value and both Port.accumulated_insured_value ledgers reduced by the released amounts"
          - "a replacement Certificate is created in status ISSUED with replaces_certificate_id := this id, the supplied certificate_number, recomputed insured_value and premium components, and three fresh ACTIVE AccumulationEntry rows"
          - "OpenPolicy.aggregate_return_premium increased by the booked return; aggregate_premium_booked increased by the replacement's total_premium_amount; aggregate_insured_value_booked adjusted by (replacement insured_value - this insured_value)"
          - "OpenPolicy.version incremented by 1"
          - "version incremented by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /certificates/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "status == ISSUED"
          - "no ClaimFile exists on this certificate with status NOT IN {DENIED}"
          - "no GaSecurityPosting exists on this certificate with status IN {REQUIRED, POSTED}"
        side_effects:
          - "status := CANCELLED"
          - "return_premium_amount increased by the `certificate_return_premium` CANCELLATION amount: round((total_premium_amount + reinstatement_premium_amount - return_premium_amount) * CANCEL_UNEARNED_PCT_PRE_ATTACHMENT, 2) when the logical clock is before attachment_at, else the same expression at CANCEL_UNEARNED_PCT_POST_ATTACHMENT"
          - "all ACTIVE AccumulationEntry rows for this certificate become RELEASED with release_reason CERTIFICATE_CANCELLED"
          - "Vessel.accumulated_insured_value and both Port.accumulated_insured_value ledgers reduced by the released amounts"
          - "OpenPolicy.aggregate_return_premium increased by the booked return; aggregate_insured_value_booked reduced by insured_value"
          - "OpenPolicy.version incremented by 1"
          - "version incremented by 1"
      - from: ISSUED
        to: TRANSIT_ENDED
        trigger: "POST /open-policies/{id}/run-transit-sweep (batch) or POST /certificates/{id}/confirm-delivery (single)"
        actor: Underwriter | Assured
        preconditions:
          - "status == ISSUED"
          - "for the sweep: logical clock >= transit_termination_at"
          - "for confirm-delivery: logical clock >= attachment_at"
        side_effects:
          - "status := TRANSIT_ENDED"
          - "all ACTIVE AccumulationEntry rows for this certificate become RELEASED with release_reason TRANSIT_ENDED (sweep) or DELIVERY_CONFIRMED (confirm-delivery)"
          - "Vessel.accumulated_insured_value and both Port.accumulated_insured_value ledgers reduced by the released amounts"
          - "no premium is returned — cover ran its course"
          - "version incremented by 1"
      - from: ISSUED
        to: CLAIMED
        trigger: "system event: cascade of POST /claim-files"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "a ClaimFile was just created against this certificate"
        side_effects:
          - "status := CLAIMED"
          - "AccumulationEntry rows stay ACTIVE — a claimed interest still occupies accumulation until transit ends"
          - "version incremented by 1"
      - from: CLAIMED
        to: TRANSIT_ENDED
        trigger: "POST /open-policies/{id}/run-transit-sweep"
        actor: Underwriter
        preconditions:
          - "status == CLAIMED"
          - "logical clock >= transit_termination_at"
        side_effects:
          - "status := TRANSIT_ENDED"
          - "all ACTIVE AccumulationEntry rows become RELEASED with release_reason TRANSIT_ENDED"
          - "Vessel and both Port accumulated_insured_value ledgers reduced by the released amounts"
          - "version incremented by 1"

  - entity: Certificate
    state_field: war_cover_status
    initial_state: PENDING
    terminal_states: [NOT_TAKEN]
    transitions:
      - from: PENDING
        to: ATTACHED
        trigger: "POST /certificates/{id}/issue"
        actor: Underwriter
        preconditions:
          - "war_cover_requested == true"
          - "OpenPolicy.war_cover_status IN {ATTACHED, REINSTATED}"
          - "loading Port.war_risk_tier != LISTED_AREA AND discharge Port.war_risk_tier != LISTED_AREA"
        side_effects:
          - "war_cover_status := ATTACHED"
          - "war_premium_amount computed with the port war multiplier"
      - from: PENDING
        to: NOT_TAKEN
        trigger: "POST /certificates/{id}/issue"
        actor: Underwriter
        preconditions:
          - "war_cover_requested == false"
        side_effects:
          - "war_cover_status := NOT_TAKEN"
          - "war_premium_amount := 0.00"
      - from: ATTACHED
        to: TERMINATED
        trigger: "system event: cascade link 3 of POST /ports/{id}/war-risk-tier"
        actor: system
        preconditions:
          - "war_cover_status == ATTACHED"
          - "status == ISSUED"
          - "this certificate's OpenPolicy.war_cover_status became TERMINATED in this same request (cascade link 2)"
          - "loading_port_id == the newly listed port OR discharge_port_id == the newly listed port"
        side_effects:
          - "war_cover_status := TERMINATED"
          - "return_premium_amount increased by war_premium_amount + strikes_premium_amount (`certificate_return_premium`, case WAR_TERMINATION — both components are returned in full)"
          - "cascade link 4: OpenPolicy.aggregate_return_premium increased by the same amount"
          - "cascade link 5 (conditional): when premium_declaration_id IS NOT NULL and that declaration's status IN {SUBMITTED, UNDER_AUDIT}, the declaration's computed_premium_total, variance_amount and variance_pct are recomputed"
          - "version incremented by 1"
      - from: REINSTATED
        to: TERMINATED
        trigger: "system event: cascade link 3 of POST /ports/{id}/war-risk-tier"
        actor: system
        preconditions:
          - "war_cover_status == REINSTATED"
          - "status == ISSUED"
          - "this certificate's OpenPolicy.war_cover_status became TERMINATED in this same request"
          - "loading_port_id == the newly listed port OR discharge_port_id == the newly listed port"
        side_effects:
          - "war_cover_status := TERMINATED"
          - "return_premium_amount increased by reinstatement_premium_amount (`certificate_return_premium`, case REINSTATEMENT_TERMINATION — the original war and strikes premium was already returned at the first termination)"
          - "OpenPolicy.aggregate_return_premium increased by the same amount"
          - "version incremented by 1"
      - from: TERMINATED
        to: REINSTATED
        trigger: "system event: conditional cascade of POST /open-policies/{id}/reinstate-war-cover"
        actor: system
        preconditions:
          - "war_cover_status == TERMINATED"
          - "status == ISSUED"
          - "loading Port.war_risk_tier != LISTED_AREA AND discharge Port.war_risk_tier != LISTED_AREA at the instant of reinstatement"
        side_effects:
          - "war_cover_status := REINSTATED (cyclic axis: a later listing sends it back to TERMINATED)"
          - "reinstatement_premium_amount := round(insured_value / 1000 * OpenPolicy.reinstatement_rate_per_mille, 2)"
          - "OpenPolicy.aggregate_premium_booked increased by that amount"
          - "version incremented by 1"

  - entity: AccumulationEntry
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system event: cascade of certificate supersession, cancellation, transit sweep or delivery confirmation"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the owning Certificate left status ISSUED or CLAIMED in this same request"
        side_effects:
          - "status := RELEASED"
          - "release_reason := CERTIFICATE_SUPERSEDED | CERTIFICATE_CANCELLED | TRANSIT_ENDED | DELIVERY_CONFIRMED per the triggering transition"
          - "the scoped Vessel.accumulated_insured_value or Port.accumulated_insured_value is reduced by `amount`"
          - "version incremented by 1"

  - entity: PremiumDeclaration
    state_field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /premium-declarations/{id}/submit"
        actor: Assured
        preconditions:
          - "status == OPEN"
          - "OpenPolicy.status IN {ACTIVE, SUSPENDED}"
          - "declared_premium_total >= 0"
        side_effects:
          - "declared_premium_total := supplied value; submitted_by_user_id := X-User-ID; submission_count incremented by 1"
          - "sweep assigns premium_declaration_id on every Certificate of this policy with issued_at in [period_start, period_end) and premium_declaration_id IS NULL"
          - "computed_premium_total, certificate_count, variance_amount and variance_pct computed by `declaration_premium_reconciliation`"
          - "status := SUBMITTED"
          - "version incremented by 1"
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /premium-declarations/{id}/start-audit"
        actor: PremiumAuditor
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties, §1.4 priority 6)"
        side_effects:
          - "status := UNDER_AUDIT"
          - "auditor_user_id := X-User-ID"
          - "version incremented by 1"
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /premium-declarations/{id}/finish-audit"
        actor: PremiumAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "X-User-ID == auditor_user_id"
          - "variance_pct <= DECLARATION_AUDIT_TOLERANCE_PCT"
        side_effects:
          - "status := ACCEPTED (terminal)"
          - "audit_adjustment_amount := 0.00"
          - "no change to OpenPolicy.status"
          - "version incremented by 1"
        note: "fork branch A; the branch is selected by the computed variance_pct, not by the auditor"
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "POST /premium-declarations/{id}/finish-audit"
        actor: PremiumAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "X-User-ID == auditor_user_id"
          - "variance_pct > DECLARATION_AUDIT_TOLERANCE_PCT"
        side_effects:
          - "status := ADJUSTED"
          - "audit_adjustment_amount := abs(variance_amount)"
          - "cascade link 2: OpenPolicy.aggregate_premium_booked is NOT touched — the adjustment is booked on the declaration only"
          - "cascade link 3 (conditional): when variance_pct > DECLARATION_SUSPENSION_PCT the OpenPolicy moves ACTIVE -> SUSPENDED"
          - "version incremented by 1"
        note: "fork branch B; divergent side-effect set — writes a non-zero adjustment and can suspend the parent policy"
      - from: ADJUSTED
        to: SUBMITTED
        trigger: "POST /premium-declarations/{id}/submit"
        actor: Assured
        preconditions:
          - "status == ADJUSTED"
          - "declared_premium_total >= 0"
        side_effects:
          - "declared_premium_total := corrected value; submission_count incremented by 1"
          - "auditor_user_id := null (a fresh audit must be opened, and may be opened by a different auditor)"
          - "computed_premium_total, variance_amount and variance_pct recomputed"
          - "status := SUBMITTED (cyclic: ADJUSTED -> SUBMITTED -> UNDER_AUDIT -> ADJUSTED may repeat)"
          - "conditional cascade: when the parent OpenPolicy.status == SUSPENDED and the recomputed variance_pct <= DECLARATION_AUDIT_TOLERANCE_PCT, the policy returns to ACTIVE"
          - "version incremented by 1"

  - entity: ClaimFile
    state_field: status
    initial_state: OPENED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: OPENED
        to: SURVEY_ORDERED
        trigger: "POST /survey-orders"
        actor: ClaimsAdjuster
        preconditions:
          - "status IN {OPENED, DOCS_INCOMPLETE}"
          - "Surveyor.status == ACTIVE"
          - "the surveyor's certified_commodity_ratings contains the Certificate's CommodityClass.susceptibility_rating"
          - "the requested window does not conflict with the surveyor's existing appointments (§1.4 priority 25)"
        side_effects:
          - "status := SURVEY_ORDERED"
          - "a SurveyOrder is created in status APPOINTED with window_minutes computed"
          - "Surveyor.booked_minutes_total increased by window_minutes"
          - "version incremented by 1"
      - from: DOCS_INCOMPLETE
        to: SURVEY_ORDERED
        trigger: "POST /survey-orders"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DOCS_INCOMPLETE"
          - "Surveyor.status == ACTIVE"
          - "the surveyor's certified_commodity_ratings contains the Certificate's CommodityClass.susceptibility_rating"
        side_effects:
          - "status := SURVEY_ORDERED (re-survey leg of the rework cycle)"
          - "a further SurveyOrder is created in status APPOINTED"
          - "Surveyor.booked_minutes_total increased by window_minutes"
          - "version incremented by 1"
      - from: SURVEY_ORDERED
        to: SURVEY_RECEIVED
        trigger: "POST /survey-orders/{id}/file-report"
        actor: Surveyor
        preconditions:
          - "status == SURVEY_ORDERED"
          - "the SurveyOrder.status == APPOINTED"
          - "X-User-ID == SurveyOrder.surveyor_id"
        side_effects:
          - "status := SURVEY_RECEIVED"
          - "the SurveyOrder moves APPOINTED -> REPORT_FILED"
          - "cascade link 2: a DamageDocument with doc_type SURVEY_REPORT and origin SURVEYOR is appended to this claim"
          - "cascade link 3: documentation_complete recomputed from the enlarged document set; warranty_breach := true when packaging_compliant == false"
          - "damage_percentage := damage_percentage_found when the claim's adjustment_basis is DEPRECIATION_PCT and damage_percentage is null"
          - "version incremented by 1"
      - from: SURVEY_RECEIVED
        to: ADJUSTED
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SURVEY_RECEIVED"
          - "warranty_breach == false"
          - "documentation_complete == true"
          - "a SurveyOrder in status REPORT_FILED exists when claimed_amount > CommodityClass.survey_required_above_amount (§1.4 priority 19)"
        side_effects:
          - "adjusted_amount and deductible_applied_amount computed by `claim_adjusted_amount`"
          - "adjusted_by_user_id := X-User-ID"
          - "time_bar_at := Certificate.discharge_date + SUBROGATION_TIME_BAR_DAYS days"
          - "status := ADJUSTED"
          - "version incremented by 1"
        note: "branch A of the three-way adjust fork, evaluated third"
      - from: OPENED
        to: ADJUSTED
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == OPENED"
          - "warranty_breach == false"
          - "documentation_complete == true"
          - "a SurveyOrder in status REPORT_FILED exists when claimed_amount > CommodityClass.survey_required_above_amount (§1.4 priority 19)"
        side_effects:
          - "adjusted_amount and deductible_applied_amount computed by `claim_adjusted_amount`"
          - "adjusted_by_user_id := X-User-ID"
          - "time_bar_at := Certificate.discharge_date + SUBROGATION_TIME_BAR_DAYS days"
          - "status := ADJUSTED"
          - "version incremented by 1"
        note: "the straight-through leg: a small, fully documented claim needs no survey and never enters the rework loop"
      - from: SURVEY_RECEIVED
        to: DENIED
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SURVEY_RECEIVED"
          - "warranty_breach == true"
        side_effects:
          - "status := DENIED (terminal)"
          - "adjusted_amount := 0.00; deductible_applied_amount := 0.00"
          - "adjusted_by_user_id := X-User-ID"
          - "the Certificate keeps status CLAIMED and its accumulation entries stay ACTIVE"
          - "version incremented by 1"
        note: "branch B of the adjust fork, evaluated FIRST — a packaging warranty breach beats every documentation consideration"
      - from: SURVEY_RECEIVED
        to: DOCS_INCOMPLETE
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SURVEY_RECEIVED"
          - "warranty_breach == false"
          - "documentation_complete == false"
        side_effects:
          - "status := DOCS_INCOMPLETE"
          - "adjusted_amount stays null; adjusted_by_user_id stays null"
          - "the claim may loop back through SURVEY_ORDERED (cyclic axis)"
          - "version incremented by 1"
        note: "branch C of the adjust fork, evaluated second"
      - from: OPENED
        to: DOCS_INCOMPLETE
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == OPENED"
          - "warranty_breach == false"
          - "documentation_complete == false"
          - "claimed_amount <= CommodityClass.survey_required_above_amount (otherwise ERR_SURVEY_REQUIRED fires first)"
        side_effects:
          - "status := DOCS_INCOMPLETE"
          - "version incremented by 1"
      - from: DOCS_INCOMPLETE
        to: ADJUSTED
        trigger: "POST /claim-files/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DOCS_INCOMPLETE"
          - "warranty_breach == false"
          - "documentation_complete == true"
        side_effects:
          - "adjusted_amount and deductible_applied_amount computed by `claim_adjusted_amount`"
          - "adjusted_by_user_id := X-User-ID"
          - "time_bar_at := Certificate.discharge_date + SUBROGATION_TIME_BAR_DAYS days"
          - "status := ADJUSTED"
          - "version incremented by 1"
      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /claim-files/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "status == ADJUSTED"
          - "X-User-ID != adjusted_by_user_id (segregation of duties, §1.4 priority 6)"
          - "when loss_type == GENERAL_AVERAGE: the linked GeneralAverageEvent.status == ADJUSTED"
        side_effects:
          - "status := SETTLED (terminal)"
          - "settled_amount := adjusted_amount; net_loss_amount := adjusted_amount - recovered_amount"
          - "settled_by_user_id := X-User-ID"
          - "version incremented by 1"

  - entity: ClaimFile
    state_field: subrogation_status
    initial_state: NOT_STARTED
    terminal_states: [RECOVERED, TIME_BARRED]
    transitions:
      - from: NOT_STARTED
        to: NOTICE_SENT
        trigger: "POST /claim-files/{id}/subrogation-notice"
        actor: ClaimsAdjuster
        preconditions:
          - "subrogation_status == NOT_STARTED"
          - "status IN {ADJUSTED, SETTLED}"
          - "logical clock < time_bar_at"
        side_effects:
          - "subrogation_status := NOTICE_SENT"
          - "carrier_name := supplied value; subrogation_notice_at := logical clock now"
          - "version incremented by 1"
      - from: NOT_STARTED
        to: TIME_BARRED
        trigger: "system event: evaluated inside POST /claim-files/{id}/subrogation-notice"
        actor: system
        preconditions:
          - "subrogation_status == NOT_STARTED"
          - "logical clock >= time_bar_at"
        side_effects:
          - "subrogation_status := TIME_BARRED (terminal); no notice is recorded"
          - "the request itself fails with ERR_SUBROGATION_TIME_BARRED — the axis flip is the audit trace of the barred attempt"
          - "version incremented by 1"
      - from: NOTICE_SENT
        to: RECOVERED
        trigger: "POST /claim-files/{id}/subrogation-recovery"
        actor: ClaimsAdjuster
        preconditions:
          - "subrogation_status == NOTICE_SENT"
          - "status == SETTLED"
          - "recovered_amount input <= settled_amount"
        side_effects:
          - "subrogation_status := RECOVERED (terminal)"
          - "recovered_amount := supplied value; net_loss_amount := settled_amount - recovered_amount"
          - "version incremented by 1"

  - entity: SurveyOrder
    state_field: status
    initial_state: APPOINTED
    terminal_states: [REPORT_FILED, CANCELLED]
    transitions:
      - from: APPOINTED
        to: REPORT_FILED
        trigger: "POST /survey-orders/{id}/file-report"
        actor: Surveyor
        preconditions:
          - "status == APPOINTED"
          - "X-User-ID == surveyor_id"
          - "Surveyor.status == ACTIVE"
          - "logical clock >= window_start_at"
        side_effects:
          - "status := REPORT_FILED; packaging_compliant, damage_percentage_found and report_reference stored"
          - "the parent ClaimFile moves SURVEY_ORDERED -> SURVEY_RECEIVED"
          - "a DamageDocument (doc_type SURVEY_REPORT, origin SURVEYOR) is appended to the claim"
          - "Surveyor.booked_minutes_total unchanged (a filed report still occupies the calendar)"
          - "version incremented by 1"
      - from: APPOINTED
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: ClaimsAdjuster
        preconditions:
          - "status == APPOINTED"
        side_effects:
          - "status := CANCELLED (terminal)"
          - "Surveyor.booked_minutes_total reduced by window_minutes (compensating action — the calendar returns to its pre-appointment total)"
          - "the parent ClaimFile returns from SURVEY_ORDERED to OPENED when no other SurveyOrder on the claim is in status APPOINTED, otherwise its status is unchanged"
          - "version incremented by 1"

  - entity: GeneralAverageEvent
    state_field: status
    initial_state: DECLARED
    terminal_states: [ADJUSTED]
    transitions:
      - from: DECLARED
        to: SECURITY_COLLECTING
        trigger: "POST /ga-events/{id}/issue-security-calls"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DECLARED"
          - "at least one Certificate on this vessel has status IN {ISSUED, CLAIMED} and sailing_date == voyage_sailing_date"
        side_effects:
          - "adjuster_fee_amount, total_allowance_amount, total_contributory_value, contribution_rate computed by `ga_contribution_allocation`"
          - "one GaSecurityPosting in status REQUIRED created per contributing certificate, with contributory_value, contribution_amount, cash_deposit_required and cash_deposit_expected_amount"
          - "each contributing Certificate.ga_contribution_amount := its posting's contribution_amount"
          - "postings_required_count := number of postings created; postings_posted_count := 0"
          - "status := SECURITY_COLLECTING"
          - "version incremented by 1"
      - from: SECURITY_COLLECTING
        to: SECURITY_COMPLETE
        trigger: "system event: cascade link 2 of POST /ga-security-postings/{id}/post"
        actor: system
        preconditions:
          - "status == SECURITY_COLLECTING"
          - "postings_posted_count reached postings_required_count as a consequence of the posting just accepted"
        side_effects:
          - "status := SECURITY_COMPLETE"
          - "version incremented by 1"
      - from: SECURITY_COMPLETE
        to: ADJUSTED
        trigger: "POST /ga-events/{id}/finalize-adjustment"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SECURITY_COMPLETE"
        side_effects:
          - "status := ADJUSTED (terminal)"
          - "cascade link 2: every GaSecurityPosting on this event moves POSTED -> RELEASED"
          - "cascade link 3: each released posting's cash_deposit_amount is deducted from the certificate's OpenPolicy.security_deposit_held_amount"
          - "cascade link 4: the Vessel's open_ga_event_count is decremented and, when it reaches 0, the vessel leaves GA_HOLD for APPROVED or OVERAGE_SURCHARGED depending on its preserved overage_surcharge_pct"
          - "version incremented by 1"

  - entity: GaSecurityPosting
    state_field: status
    initial_state: REQUIRED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUIRED
        to: POSTED
        trigger: "POST /ga-security-postings/{id}/post"
        actor: Assured
        preconditions:
          - "status == REQUIRED"
          - "GeneralAverageEvent.status == SECURITY_COLLECTING"
          - "expected_ga_event_version == GeneralAverageEvent.version (§1.2.1 ga-posting-stale-event)"
          - "guarantee_amount >= contribution_amount"
          - "cash_deposit_amount >= cash_deposit_expected_amount"
        side_effects:
          - "status := POSTED; guarantee_amount and cash_deposit_amount stored"
          - "the certificate's OpenPolicy.security_deposit_held_amount increased by cash_deposit_amount"
          - "GeneralAverageEvent.postings_posted_count incremented by 1 and its version incremented by 1"
          - "cascade: when postings_posted_count == postings_required_count the event moves to SECURITY_COMPLETE"
          - "version incremented by 1"
      - from: POSTED
        to: RELEASED
        trigger: "system event: cascade link 2 of POST /ga-events/{id}/finalize-adjustment"
        actor: system
        preconditions:
          - "status == POSTED"
          - "the parent GeneralAverageEvent moved SECURITY_COMPLETE -> ADJUSTED in this same request"
        side_effects:
          - "status := RELEASED (terminal)"
          - "the certificate's OpenPolicy.security_deposit_held_amount reduced by cash_deposit_amount, returning the ledger to its pre-posting value"
          - "version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
# Only true races appear here: cases where a strictly later request observes a
# state field that is *unchanged* by the earlier request and would therefore
# legitimately succeed under the natural product semantics. Both entries are
# resolved by optimistic concurrency on the parent's `version`.
concurrency_rules:

  - rule_id: certificate-issue-stale-policy
    parent_entity: OpenPolicy
    write_endpoint: "POST /certificates/{id}/issue"
    occ_field: "expected_open_policy_version"
    description: |
      Issuing a certificate consumes shared capacity on the parent open policy
      (annual aggregate insured value, premium booked, certificates issued
      count) and re-reads the policy's limit fields to decide whether the
      shipment fits. A writer that issues while holding a version of the policy
      older than the stored one has priced and limit-checked its certificate
      against a superseded ledger — another certificate has since been issued,
      or the policy has been suspended by a premium audit and reinstated — so
      the issue is rejected on the stale version rather than booked against
      capacity the writer never saw. Every DRAFT certificate on the policy is
      independently issuable, so nothing in the certificate's own state
      precondition set can catch this: the second issue targets a different
      certificate row that is still DRAFT and would otherwise succeed.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: ga-posting-stale-event
    parent_entity: GeneralAverageEvent
    write_endpoint: "POST /ga-security-postings/{id}/post"
    occ_field: "expected_ga_event_version"
    description: |
      Posting general-average security advances the parent event's
      postings_posted_count and can complete the security call, so each posting
      is validated against the event's declared contribution_rate and
      postings_required_count. A writer holding a stale event version posted
      against a contribution schedule that has since moved on (a further
      posting was accepted, or the event completed its security collection), so
      the posting is rejected on the stale version. The posting row targeted is
      a different GaSecurityPosting still in status REQUIRED, so its own state
      precondition cannot reject it.
    error_id: ERR_STALE_GA_EVENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: certificate_insured_value
    trigger: "POST /certificates (previewed onto the DRAFT row) and recomputed and pinned by POST /certificates/{id}/issue"
    algorithm: aggregation
    formula: |
      # freight is part of the CIF base only when the policy's freight_basis is PREPAID;
      # under COLLECT the assured has not yet paid it and it is excluded.
      cif_base = invoice_value + duty_amount
      if OpenPolicy.freight_basis == "PREPAID":
          cif_base = cif_base + freight_amount
      # variant CIF_PLUS_MARKUP (default)
      insured_value = round(cif_base * (1 + OpenPolicy.markup_pct), 2)
      # variant DECLARED_VALUE
      insured_value = round(declared_value, 2)
    input_set: |
      One Certificate row plus its parent OpenPolicy (freight_basis, markup_pct).
      `declared_value` is read only under valuation_basis == DECLARED_VALUE and is
      required in that case; `invoice_value`, `freight_amount` and `duty_amount`
      are read only under CIF_PLUS_MARKUP.
    constants:
      MARKUP_PCT_MAX: 0.30
    precision: "2 decimal places, round_half_up; the markup multiplication is rounded once, at the end"
    variants:
      - name: CIF_PLUS_MARKUP
        when: "Certificate.valuation_basis == CIF_PLUS_MARKUP"
        difference: |
          Builds the base from invoice + duty (+ freight when PREPAID) and applies
          the policy markup. With invoice_value 1000000.00, freight_amount 45000.00,
          duty_amount 5000.00, freight_basis PREPAID and markup_pct 0.10 the insured
          value is 1155000.00.
      - name: DECLARED_VALUE
        when: "Certificate.valuation_basis == DECLARED_VALUE"
        difference: |
          Ignores invoice, freight, duty and markup entirely and insures the
          assured's declared figure. For the same shipment declared at 1050000.00
          the insured value is 1050000.00 — a divergence of 105000.00 against
          CIF_PLUS_MARKUP, which propagates into every premium component, into the
          conveyance/vessel/port accumulation ledgers and into the GA contributory
          value.

  - name: certificate_premium_components
    trigger: "POST /certificates/{id}/issue; re-run for the replacement row created by POST /certificates/{id}/endorse"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — compose the marine rate and round it to 4 dp BEFORE applying it.
      effective_rate_per_mille = round(
          OpenPolicy.premium_rate_per_mille
          * (1 + CommodityClass.rate_loading_pct)
          * (1 + Vessel.overage_surcharge_pct), 4)

      # STEP 2 — war rate takes the WORSE (higher) multiplier of the two ports.
      port_multiplier = max(loading_port.war_rate_multiplier, discharge_port.war_rate_multiplier)
      effective_war_rate_per_mille = round(OpenPolicy.war_rate_per_mille * port_multiplier, 4)

      # STEP 3 — each component is rounded to 2 dp on its own, then summed.
      base_premium_amount    = round(insured_value / 1000 * effective_rate_per_mille, 2)
      war_premium_amount     = war_cover_requested
                               ? round(insured_value / 1000 * effective_war_rate_per_mille, 2) : 0.00
      strikes_premium_amount = strikes_cover_requested
                               ? round(insured_value / 1000 * OpenPolicy.strikes_rate_per_mille, 2) : 0.00
      total_premium_amount   = base_premium_amount + war_premium_amount + strikes_premium_amount
    input_set: |
      One Certificate plus its OpenPolicy (three rates), its CommodityClass
      (rate_loading_pct), its Vessel (overage_surcharge_pct, 0.00 unless the
      vessel is OVERAGE_SURCHARGED) and both Ports (war_rate_multiplier).
      war_cover_requested / strikes_cover_requested are honoured only while
      OpenPolicy.war_cover_status != TERMINATED.
    constants:
      RATE_DIVISOR_PER_MILLE: 1000
      RATE_SCALE_DECIMALS: 4
    precision: |
      Rates carry 4 decimals, money 2 decimals, round_half_up throughout. Two
      rounding decisions are load-bearing and MUST be honoured in this order:
      (1) the composed marine rate is rounded to 4 dp before it multiplies the
      insured value — with premium_rate_per_mille 3.500, rate_loading_pct 0.35
      and overage_surcharge_pct 0.25 the rate is round(5.90625, 4) = 5.9063 and
      the base premium is 6821.78, whereas multiplying by the unrounded 5.90625
      would give 6821.72; (2) each premium component is rounded to 2 dp before
      the sum, so with insured_value 1155000.00, effective_rate 4.7250, war rate
      0.6000 and strikes rate 0.255 the components are 5457.38 + 693.00 + 294.53
      = 6444.91, whereas rounding the sum of the unrounded components
      (5457.375 + 693.00 + 294.525) would give 6444.90.

  - name: accumulation_exposure_check
    trigger: "POST /certificates/{id}/issue, before any ledger is written"
    algorithm: threshold
    formula: |
      candidate = Certificate.insured_value

      # (1) per-certificate line limit
      breach if candidate > OpenPolicy.per_certificate_limit_amount

      # (2) commodity share of one conveyance
      breach if candidate > round(OpenPolicy.conveyance_limit_amount
                                  * CommodityClass.max_conveyance_share_pct, 2)

      # (3) conveyance accumulation: one vessel_id + sailing_date pair
      conveyance_exposure = sum(c.insured_value for c in Certificate
                                where c.vessel_id == this.vessel_id
                                  and c.sailing_date == this.sailing_date
                                  and c.status in {ISSUED, CLAIMED, TRANSIT_ENDED})
      breach if conveyance_exposure + candidate > OpenPolicy.conveyance_limit_amount

      # (4) single-vessel accumulation across all voyages (ACTIVE ledger only)
      vessel_exposure = sum(e.amount for e in AccumulationEntry
                            where e.scope_type == "VESSEL"
                              and e.vessel_id == this.vessel_id
                              and e.status == "ACTIVE")
      breach if vessel_exposure + candidate > Vessel.vessel_accumulation_limit_amount

      # (5) discharge-port accumulation over the HALF-OPEN storage window
      #     [window_start_at, window_end_at); a window that starts exactly when
      #     another ends does NOT accumulate with it.
      cand_start = this.discharge_date at 00:00:00Z
      cand_end   = this.transit_termination_at
      port_exposure = sum(e.amount for e in AccumulationEntry
                          where e.scope_type == "DISCHARGE_PORT"
                            and e.port_id == this.discharge_port_id
                            and e.status == "ACTIVE"
                            and e.window_start_at < cand_end
                            and e.window_end_at   > cand_start)
      breach if port_exposure + candidate > Port.port_accumulation_limit_amount

      # (6) annual aggregate on the policy
      breach if OpenPolicy.aggregate_insured_value_booked + candidate
                > OpenPolicy.annual_aggregate_limit_amount
    input_set: |
      Only ACTIVE AccumulationEntry rows count toward the vessel and port
      ledgers; RELEASED rows (cancellation, endorsement supersede, transit end,
      GA release) are excluded. The conveyance check reads Certificate rows
      directly so that a transit that has already ended still occupies its own
      conveyance.
    constants:
      PORT_WINDOW_SEMANTICS: half_open
    precision: |
      Money to 2 decimals, round_half_up. Every comparison is strictly greater
      than: exposure exactly equal to the limit is accepted, one cent over is
      rejected. The six checks are evaluated in the §1.4 priority order
      (18 commodity share, 21 conveyance, 22 vessel, 23 port, 24 annual), so a
      request breaching several limits reports the lowest-priority-number error.

  - name: transit_termination_instant
    trigger: "POST /certificates/{id}/issue (pins transit_termination_at) and re-evaluated by POST /open-policies/{id}/run-transit-sweep"
    algorithm: chronological
    formula: |
      discharge_instant = Certificate.discharge_date at 00:00:00Z
      if OpenPolicy.warehouse_to_warehouse == false:
          transit_termination_at = discharge_instant       # cover ends on discharge overside
      else:
          storage_deadline = discharge_instant + discharge_port.storage_free_days days
          ww_cap           = discharge_instant + WW_MAX_STORAGE_DAYS days
          transit_termination_at = min(storage_deadline, ww_cap, OpenPolicy.expiry_at)

      attachment_at = Certificate.sailing_date at 00:00:00Z

      # the sweep ends transit for every certificate whose window has closed
      for c in certificates of this policy where c.status == "ISSUED"
                                             and clock_now >= c.transit_termination_at:
          c.status := "TRANSIT_ENDED"
    input_set: |
      One Certificate, its discharge Port (storage_free_days) and its OpenPolicy
      (warehouse_to_warehouse, expiry_at). The sweep considers only certificates
      in status ISSUED — a CLAIMED certificate keeps its cover until the claim
      leaves the adjustment loop.
    constants:
      WW_MAX_STORAGE_DAYS: 60
    precision: |
      Whole days, UTC midnight boundaries, no partial days. With discharge_date
      2026-09-05 and storage_free_days 30 the termination instant is
      2026-10-05T00:00:00Z (the 60-day warehouse-to-warehouse cap would be
      2026-11-04T00:00:00Z, so the port's free-storage window binds). The sweep
      comparison is `>=`: at exactly 2026-10-05T00:00:00Z the transit ends, one
      second earlier it does not.

  - name: claim_adjusted_amount
    trigger: "POST /claim-files/{id}/adjust"
    algorithm: indemnity_quantification
    formula: |
      insured   = Certificate.insured_value
      deductible = Certificate.deductible_amount

      # variant DEPRECIATION_PCT — deductible applied AFTER the loss is measured
      gross_loss      = round(insured * ClaimFile.damage_percentage / 100, 2)
      adjusted_amount = max(0.00, gross_loss - deductible)
      deductible_applied_amount = min(deductible, gross_loss)

      # variant SALVAGE_SALE_PROCEEDS — deductible applied BEFORE the ratio
      depreciation_ratio = round((sound_market_value - damaged_sale_proceeds)
                                 / sound_market_value, 6)
      adjusted_amount = round((insured - deductible) * depreciation_ratio, 2)
      deductible_applied_amount = round(insured * depreciation_ratio, 2) - adjusted_amount

      adjusted_amount = min(adjusted_amount, insured)     # never over-indemnify
      # settlement, later:
      net_loss_amount = settled_amount - recovered_amount
    input_set: |
      One ClaimFile plus the insured value and deductible pinned on its
      Certificate at issue time (never the policy's current deductible_amount —
      a policy edited after issue must not move a claim). damage_percentage is
      read only under DEPRECIATION_PCT; sound_market_value and
      damaged_sale_proceeds only under SALVAGE_SALE_PROCEEDS.
    constants:
      DEPRECIATION_RATIO_DECIMALS: 6
      SUBROGATION_TIME_BAR_DAYS: 365
    precision: "money 2 decimals, ratio 6 decimals, round_half_up"
    variants:
      - name: DEPRECIATION_PCT
        when: "ClaimFile.adjustment_basis == DEPRECIATION_PCT"
        difference: |
          Measures the loss as a percentage of the insured value and subtracts
          the deductible from the measured loss. With insured 1155000.00,
          deductible 2500.00 and damage_percentage 12.5 the gross loss is
          144375.00 and the adjusted amount 141875.00.
      - name: SALVAGE_SALE_PROCEEDS
        when: "ClaimFile.adjustment_basis == SALVAGE_SALE_PROCEEDS"
        difference: |
          Derives the depreciation ratio from the salvage sale and applies it to
          the insured value net of the deductible, so the deductible is scaled
          down by the ratio instead of being deducted in full. With
          sound_market_value 1200000.00 and damaged_sale_proceeds 1050000.00 the
          ratio is 0.125000 and the adjusted amount 144062.50 — 2187.50 more
          than DEPRECIATION_PCT on the same 12.5% loss, purely because of where
          the deductible enters. deductible_applied_amount is 312.50 here versus
          2500.00 there.

  - name: ga_contribution_allocation
    trigger: "POST /ga-events/{id}/issue-security-calls"
    algorithm: waterfall_allocation
    formula: |
      contributors = [c for c in Certificate
                      where c.vessel_id == event.vessel_id
                        and c.sailing_date == event.voyage_sailing_date
                        and c.status in {ISSUED, CLAIMED}]
      # ordered by contributory value DESC, then created_at ASC
      total_contributory_value = sum(c.insured_value for c in contributors)

      # the adjuster's fee is a percentage of the PRE-FEE allowance only —
      # it is never charged on itself.
      adjuster_fee_amount   = round(GA_ADJUSTER_FEE_PCT
                                    * (sacrifice_amount + salvage_award_amount), 2)
      total_allowance_amount = sacrifice_amount + salvage_award_amount + adjuster_fee_amount

      contribution_rate = round(total_allowance_amount / total_contributory_value, 6)

      raw_i = round(c_i.insured_value * contribution_rate, 2)   for each contributor
      residual = total_allowance_amount - sum(raw_i)            # may be negative

      # waterfall: the whole residual lands on the FIRST bucket of the ordered
      # list (largest contributory value; ties broken by created_at ASC) so that
      # sum(contribution_amount) == total_allowance_amount exactly.
      contribution_amount(first)  = raw_first + residual
      contribution_amount(others) = raw_i

      cash_deposit_required        = contribution_amount > GA_CASH_DEPOSIT_THRESHOLD
      cash_deposit_expected_amount = cash_deposit_required
                                     ? round(contribution_amount * GA_CASH_DEPOSIT_PCT, 2) : 0.00
    input_set: |
      Only certificates on the same vessel and the same sailing_date in status
      ISSUED or CLAIMED contribute; DRAFT, SUPERSEDED, CANCELLED and
      TRANSIT_ENDED certificates are excluded (the adventure they were part of
      is over). The contributory value is the certificate's insured_value, not
      its premium.
    constants:
      GA_ADJUSTER_FEE_PCT: 0.05
      GA_CASH_DEPOSIT_THRESHOLD: 25000
      GA_CASH_DEPOSIT_PCT: 0.20
      CONTRIBUTION_RATE_DECIMALS: 6
    precision: |
      contribution_rate to 6 decimals, money to 2 decimals, round_half_up. With
      contributory values 1155000.00 and 800000.00, sacrifice 120000.00 and
      salvage 30000.00: adjuster fee 7500.00, total allowance 157500.00,
      total contributory value 1955000.00, contribution_rate 0.080563. The raw
      contributions 93050.27 and 64450.40 sum to 157500.67, so the residual
      -0.67 is applied to the largest contributory value: final contributions
      93049.60 and 64450.40, summing to exactly 157500.00. Expected cash
      deposits are 18609.92 and 12890.08 (total 31500.00).

  - name: declaration_premium_reconciliation
    trigger: "POST /premium-declarations/{id}/submit (both the first submission and every ADJUSTED -> SUBMITTED re-submission)"
    algorithm: aggregation
    formula: |
      members = [c for c in Certificate
                 where c.premium_declaration_id == declaration.id]
      certificate_count       = count(members)
      computed_premium_total  = sum(c.total_premium_amount
                                    + c.reinstatement_premium_amount
                                    - c.return_premium_amount for c in members)
      variance_amount = round(declared_premium_total - computed_premium_total, 2)
      if computed_premium_total == 0:
          variance_pct = (declared_premium_total == 0) ? 0.00 : 100.00
      else:
          variance_pct = round(abs(variance_amount) / computed_premium_total * 100, 2)
    input_set: |
      Assignment happens at submit time: every certificate of the policy with
      issued_at inside the declaration's half-open period [period_start,
      period_end) and premium_declaration_id still null is stamped with this
      declaration and then included. A certificate already stamped by an earlier
      declaration is never re-assigned, so premium is reported exactly once even
      when two periods are adjacent. Return premium from cancellation and
      additional premium from war-cover reinstatement follow the certificate
      into whichever declaration owns it.
    constants:
      DECLARATION_AUDIT_TOLERANCE_PCT: 2.5
      DECLARATION_SUSPENSION_PCT: 10.0
      ZERO_BASE_VARIANCE_PCT: 100.00
    precision: |
      Money 2 decimals, percentages 2 decimals, round_half_up; variance_pct is
      taken on the absolute variance so an under-declaration and an
      over-declaration of the same size are equally auditable. With one
      certificate at 6444.91 and one at 2591.16 that was later cancelled for a
      1295.58 return, the computed total is 7740.49: declaring 7600.00 gives
      variance -140.49 / 1.82% (ACCEPTED, at or under the 2.5% tolerance),
      declaring 7500.00 gives -240.49 / 3.11% (ADJUSTED) and declaring 6500.00
      gives -1240.49 / 16.03% (ADJUSTED plus policy suspension above 10.0%).

  - name: vessel_classification_decision
    trigger: "POST /vessels/{id}/classification-review"
    algorithm: threshold
    formula: |
      vessel_age_years = year(clock_now) - Vessel.year_built
      if Vessel.classification_society not in APPROVED_SOCIETIES:
          status := "BLOCKED";              overage_surcharge_pct := 0.00
      elif vessel_age_years > VESSEL_BLOCK_YEARS:
          status := "BLOCKED";              overage_surcharge_pct := 0.00
      elif vessel_age_years > VESSEL_OVERAGE_YEARS:
          status := "OVERAGE_SURCHARGED";   overage_surcharge_pct := VESSEL_OVERAGE_SURCHARGE_PCT
      else:
          status := "APPROVED";             overage_surcharge_pct := 0.00
    input_set: "One Vessel row plus the logical clock's calendar year; no other entity participates."
    constants:
      VESSEL_OVERAGE_YEARS: 25
      VESSEL_BLOCK_YEARS: 30
      VESSEL_OVERAGE_SURCHARGE_PCT: 0.25
      APPROVED_SOCIETIES: ["LR", "ABS", "DNV", "BV", "NK", "CCS"]
    precision: |
      Whole years from the logical clock's calendar year (default
      2026-08-01T00:00:00Z => 2026), both thresholds strictly greater than. With
      year_built 2001 the age is 25 and the vessel is APPROVED; 2000 gives 26
      and OVERAGE_SURCHARGED; 1996 gives 30 and is still OVERAGE_SURCHARGED;
      1995 gives 31 and is BLOCKED. An unapproved society blocks the vessel at
      any age, so a 2-year-old ship on a society outside the list is BLOCKED.

  - name: surveyor_window_conflict
    trigger: "POST /survey-orders"
    algorithm: interval_merge
    formula: |
      buffer      = Surveyor.travel_buffer_minutes
      new_start   = requested window_start_at
      new_end     = requested window_end_at
      window_minutes = whole minutes between new_start and new_end

      existing = [o for o in SurveyOrder
                  where o.surveyor_id == this.surveyor_id
                    and o.status in {APPOINTED, REPORT_FILED}]

      # CLOSED intervals, both ends inflated by the travel buffer:
      conflict if any(new_start <= o.window_end_at   + buffer minutes
                  and new_end   >= o.window_start_at - buffer minutes
                      for o in existing)

      on success: Surveyor.booked_minutes_total += window_minutes
      on cancel:  Surveyor.booked_minutes_total -= window_minutes
    input_set: |
      Only APPOINTED and REPORT_FILED orders occupy the calendar; CANCELLED
      orders are excluded and their minutes have already been returned to
      booked_minutes_total. The check spans every claim the surveyor works on,
      not just this one.
    constants:
      DEFAULT_TRAVEL_BUFFER_MINUTES: 45
      SURVEY_WINDOW_MIN_MINUTES: 30
      SURVEY_WINDOW_MAX_MINUTES: 480
    precision: |
      Whole minutes, CLOSED interval semantics — touching endpoints conflict.
      With an existing appointment 2026-09-08T09:00:00Z..11:00:00Z and a 45
      minute buffer, a request starting 2026-09-08T11:45:00Z conflicts (the
      inflated end is exactly 11:45 and the comparison is `<=`) while one
      starting 11:46:00Z is accepted. This is deliberately different from the
      port accumulation window in `accumulation_exposure_check`, which is
      HALF-OPEN and where a window starting exactly at another's end does not
      accumulate.

  - name: certificate_return_premium
    trigger: "POST /certificates/{id}/cancel, and as cascade link 3 of POST /ports/{id}/war-risk-tier when a port is listed"
    algorithm: threshold
    formula: |
      # case WAR_TERMINATION — a port becomes a listed area and war cover falls away
      if certificate.war_cover_status was ATTACHED:
          delta = war_premium_amount + strikes_premium_amount
      elif certificate.war_cover_status was REINSTATED:
          delta = reinstatement_premium_amount
      # case REINSTATEMENT_TERMINATION is the same REINSTATED branch above.

      # case CANCELLATION — the unearned proportion of whatever has not been
      # returned yet, so a certificate can never return more than it earned.
      pct = (clock_now < attachment_at) ? CANCEL_UNEARNED_PCT_PRE_ATTACHMENT
                                       : CANCEL_UNEARNED_PCT_POST_ATTACHMENT
      delta = round((total_premium_amount + reinstatement_premium_amount
                     - return_premium_amount) * pct, 2)

      return_premium_amount = return_premium_amount + delta
      OpenPolicy.aggregate_return_premium = OpenPolicy.aggregate_return_premium + delta
    input_set: |
      One Certificate's own premium fields. aggregate_premium_booked is never
      reduced — written premium and returned premium are tracked on separate
      ledgers, and `declaration_premium_reconciliation` reports the net.
    constants:
      CANCEL_UNEARNED_PCT_PRE_ATTACHMENT: 1.00
      CANCEL_UNEARNED_PCT_POST_ATTACHMENT: 0.50
    precision: |
      Money 2 decimals, round_half_up. The threshold is the attachment instant
      and the comparison is strict: cancelling at exactly attachment_at earns
      the post-attachment 50% return, one second earlier returns 100%. With
      total_premium_amount 6444.91 and nothing returned yet, a pre-attachment
      cancellation returns 6444.91 and a post-attachment cancellation returns
      3222.46 (6444.91 * 0.50 = 3222.455, rounded half-up). If the war cover was
      already terminated for 987.53 (war 693.00 + strikes 294.53), a subsequent
      pre-attachment cancellation returns only the remaining 5457.38, so
      return_premium_amount lands on exactly 6444.91.

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Lower priority number wins. The domain order inside the business band is:
# state/regulatory blocks (an unseaworthy vessel or a breached warranty) ->
# temporal coherence -> constraint satisfaction -> capacity/fiscal limits last.
# A marine underwriter refuses the risk before arguing about the aggregate.
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's `roles:` list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: |
      Request payload is schema-valid: every non-optional field of the endpoint's
      `input:` list is present, enums hold declared values, numeric fields are
      non-negative where declared, datetime fields parse as ISO 8601 UTC, and
      pagination `limit` is within 1..100 with `offset` >= 0. Fields with
      `source: computed` or `source: system` supplied in the body are ignored,
      not rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every id in the path resolves, validated left to right (policyId, certificateId, vesselId, portId, claimId, surveyOrderId, declarationId, gaEventId, postingId, entryId)"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_PORT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SURVEY_ORDER_NOT_FOUND | ERR_DECLARATION_NOT_FOUND | ERR_GA_EVENT_NOT_FOUND | ERR_GA_POSTING_NOT_FOUND | ERR_ACCUMULATION_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the body resolves, validated in the order the fields appear in §1.1 (open_policy_id, commodity_class_id, vessel_id, loading_port_id, discharge_port_id, replaces_certificate_id, claim_file_id, surveyor_id, certificate_id, ga_event_id)"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_COMMODITY_CLASS_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_PORT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SURVEYOR_NOT_FOUND | ERR_GA_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /certificates, POST /claim-files, POST /survey-orders, POST /premium-declarations, POST /ga-events, POST /surveyors"

  - priority: 6
    category: auth
    check: |
      Ownership: an Assured (identity entity_backed:OpenPolicy) may only act on
      certificates, declarations and GA postings whose policy id equals its
      X-User-ID; a Surveyor may only file a report on a SurveyOrder whose
      surveyor_id equals its X-User-ID.
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /certificates, POST /certificates/{id}/issue is Underwriter-only, POST /premium-declarations, POST /premium-declarations/{id}/submit, POST /ga-security-postings/{id}/post, POST /survey-orders/{id}/file-report"

  - priority: 6
    category: auth
    check: |
      Segregation of duties: the user starting an audit must differ from the
      user who submitted the declaration, and the user settling a claim must
      differ from the user who adjusted it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /premium-declarations/{id}/start-audit, POST /claim-files/{id}/settle"

  - priority: 7
    category: business_referential
    check: "uniqueness of natural keys: OpenPolicy.policy_number, Certificate.certificate_number, Vessel.imo_number, Port.unlocode, Surveyor.panel_code, CommodityClass.code"
    error_id: ERR_DUPLICATE_REFERENCE
    http_status: 409
    applies_to: "POST /open-policies, POST /certificates, POST /vessels, POST /ports, POST /surveyors, POST /commodity-classes"

  - priority: 8
    category: state
    check: "the target resource's state field satisfies the triggered transition's `from` state and every non-cross-entity precondition in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 8
    category: state
    check: "a certificate may only be created against, and issued under, an OpenPolicy in status ACTIVE; a SUSPENDED, DRAFT, EXPIRED or CANCELLED policy accepts no new risk"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /certificates, POST /certificates/{id}/issue, POST /certificates/{id}/endorse"

  - priority: 9
    category: state
    check: "expected_open_policy_version equals OpenPolicy.version (§1.2.1 certificate-issue-stale-policy)"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /certificates/{id}/issue"

  - priority: 9
    category: state
    check: "expected_ga_event_version equals GeneralAverageEvent.version (§1.2.1 ga-posting-stale-event)"
    error_id: ERR_STALE_GA_EVENT_VERSION
    http_status: 412
    applies_to: "POST /ga-security-postings/{id}/post"

  - priority: 10
    category: state
    check: "war or strikes cover cannot be taken while OpenPolicy.war_cover_status == TERMINATED, and a certificate's war cover cannot be reinstated while either of its ports is in war_risk_tier LISTED_AREA"
    error_id: ERR_WAR_COVER_TERMINATED
    http_status: 409
    applies_to: "POST /certificates/{id}/issue, POST /open-policies/{id}/reinstate-war-cover"

  - priority: 11
    category: state
    check: "the nominated Vessel is in status APPROVED or OVERAGE_SURCHARGED — a hull that is unclassed, over-age, still unscreened or under a general average hold is refused before any capacity arithmetic is attempted"
    error_id: ERR_VESSEL_BLOCKED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 12
    category: business_safety
    check: "Certificate.packaging_code equals CommodityClass.required_packaging_code — the packaging warranty is a condition of cover, checked before any commercial constraint"
    error_id: ERR_PACKAGING_WARRANTY_BREACH
    http_status: 422
    applies_to: "POST /certificates, POST /certificates/{id}/issue, POST /certificates/{id}/endorse"

  - priority: 13
    category: state
    check: "a ClaimFile whose loss_type is GENERAL_AVERAGE may only be settled once its linked GeneralAverageEvent has reached status ADJUSTED"
    error_id: ERR_GA_ADJUSTMENT_PENDING
    http_status: 409
    applies_to: "POST /claim-files/{id}/settle"

  - priority: 14
    category: business_temporal
    check: "sailing_date < discharge_date (a voyage must span at least one whole day), and both are whole calendar dates at 00:00:00Z"
    error_id: ERR_VOYAGE_DATES_INVALID
    http_status: 422
    applies_to: "POST /certificates, POST /certificates/{id}/endorse"

  - priority: 15
    category: business_temporal
    check: "the certificate's attachment instant (sailing_date at 00:00:00Z) lies inside the policy period [inception_at, expiry_at); a voyage sailing exactly at expiry_at is outside cover"
    error_id: ERR_OUTSIDE_POLICY_PERIOD
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 16
    category: business_temporal
    check: "the declaration period [period_start, period_end) must not overlap another PremiumDeclaration of the same policy; half-open semantics mean a period starting exactly at another's period_end is accepted"
    error_id: ERR_DECLARATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /premium-declarations"

  - priority: 17
    category: business_constraint
    check: "valuation inputs match the chosen basis: DECLARED_VALUE requires declared_value > 0; CIF_PLUS_MARKUP requires invoice_value > 0 and ignores declared_value"
    error_id: ERR_VALUATION_INPUT_MISSING
    http_status: 422
    applies_to: "POST /certificates, POST /certificates/{id}/endorse"

  - priority: 18
    category: business_constraint
    check: "insured_value <= round(OpenPolicy.conveyance_limit_amount * CommodityClass.max_conveyance_share_pct, 2) — no single commodity may take more than its permitted share of one conveyance"
    error_id: ERR_COMMODITY_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates, POST /certificates/{id}/issue, POST /certificates/{id}/endorse"

  - priority: 19
    category: business_safety
    check: "a claim whose claimed_amount exceeds CommodityClass.survey_required_above_amount cannot be adjusted until a SurveyOrder on that claim has reached status REPORT_FILED"
    error_id: ERR_SURVEY_REQUIRED
    http_status: 422
    applies_to: "POST /claim-files/{id}/adjust"

  - priority: 20
    category: business_fiscal
    check: "insured_value <= OpenPolicy.per_certificate_limit_amount"
    error_id: ERR_CERTIFICATE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 21
    category: business_fiscal
    check: "conveyance exposure (all certificates in status ISSUED, CLAIMED or TRANSIT_ENDED sharing this vessel_id and sailing_date) plus this insured_value <= OpenPolicy.conveyance_limit_amount"
    error_id: ERR_CONVEYANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 22
    category: business_fiscal
    check: "Vessel ledger exposure (sum of ACTIVE AccumulationEntry rows with scope_type VESSEL) plus this insured_value <= Vessel.vessel_accumulation_limit_amount"
    error_id: ERR_VESSEL_ACCUMULATION_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 23
    category: business_fiscal
    check: "discharge-port exposure over the overlapping HALF-OPEN storage windows plus this insured_value <= Port.port_accumulation_limit_amount"
    error_id: ERR_PORT_ACCUMULATION_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 24
    category: business_fiscal
    check: "OpenPolicy.aggregate_insured_value_booked plus this insured_value <= OpenPolicy.annual_aggregate_limit_amount"
    error_id: ERR_ANNUAL_AGGREGATE_EXCEEDED
    http_status: 422
    applies_to: "POST /certificates/{id}/issue"

  - priority: 25
    category: business_constraint
    check: "the requested survey window does not conflict with any APPOINTED or REPORT_FILED order of the same surveyor, using CLOSED intervals inflated by Surveyor.travel_buffer_minutes at both ends"
    error_id: ERR_SURVEYOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /survey-orders"

  - priority: 26
    category: business_constraint
    check: "the surveyor's certified_commodity_ratings contains the susceptibility_rating of the claimed certificate's CommodityClass"
    error_id: ERR_SURVEYOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /survey-orders"

  - priority: 27
    category: state
    check: "the nominated Surveyor is in status ACTIVE"
    error_id: ERR_SURVEYOR_INACTIVE
    http_status: 409
    applies_to: "POST /survey-orders, POST /survey-orders/{id}/file-report"

  - priority: 28
    category: business_constraint
    check: "a GA event may only issue security calls when at least one Certificate on the vessel and voyage_sailing_date is in status ISSUED or CLAIMED"
    error_id: ERR_NO_CONTRIBUTING_CERTIFICATES
    http_status: 422
    applies_to: "POST /ga-events/{id}/issue-security-calls"

  - priority: 29
    category: business_fiscal
    check: "guarantee_amount >= GaSecurityPosting.contribution_amount and cash_deposit_amount >= cash_deposit_expected_amount"
    error_id: ERR_SECURITY_AMOUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ga-security-postings/{id}/post"

  - priority: 30
    category: business_temporal
    check: "the logical clock is strictly before ClaimFile.time_bar_at when a subrogation notice is served; at or after that instant the subrogation axis flips to TIME_BARRED and the notice is refused"
    error_id: ERR_SUBROGATION_TIME_BARRED
    http_status: 409
    applies_to: "POST /claim-files/{id}/subrogation-notice"

  - priority: 31
    category: business_fiscal
    check: "recovered_amount <= ClaimFile.settled_amount — subrogation may not return more than was paid out"
    error_id: ERR_RECOVERY_EXCEEDS_SETTLEMENT
    http_status: 422
    applies_to: "POST /claim-files/{id}/subrogation-recovery"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Flat topology: 13 peer collections. Every path parameter is spelled `{id}` and
# always identifies the resource named by the collection segment immediately to
# its left. Optional request fields are marked with a trailing `?`. Every list
# endpoint returns its rows in created_at ASC order (never by id) and paginates
# with limit/offset per §1.0.
endpoints:

  # --- OpenPolicy -----------------------------------------------------------
  - method: POST
    path: "/open-policies"
    description: "Underwrite a new open cover in DRAFT with its voyage terms, limit tower and rate set."
    roles: [Underwriter]
    code: 201
    input: [policy_number, assured_name, inception_at, expiry_at, freight_basis, per_certificate_limit_amount, conveyance_limit_amount, annual_aggregate_limit_amount, premium_rate_per_mille, war_rate_per_mille, strikes_rate_per_mille, "warehouse_to_warehouse?", "markup_pct?", "deductible_amount?"]
    output: OpenPolicy
    side_effects:
      - "status := DRAFT, war_cover_status := ATTACHED, version := 1"
      - "all five ledger fields (aggregate_insured_value_booked, aggregate_premium_booked, aggregate_return_premium, security_deposit_held_amount, certificates_issued_count) initialised to zero"

  - method: GET
    path: "/open-policies/{id}"
    description: "Read one open policy including its live exposure and premium ledgers."
    roles: [Underwriter, Assured, ComplianceOfficer, PremiumAuditor, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: OpenPolicy
    side_effects: []

  - method: POST
    path: "/open-policies/{id}/activate"
    description: "Move a DRAFT open cover to ACTIVE so certificates may be declared under it."
    roles: [Underwriter]
    code: 200
    input: []
    output: OpenPolicy
    side_effects:
      - "status := ACTIVE (§1.2 OpenPolicy.status)"
      - "increments `OpenPolicy.version` by 1"

  - method: POST
    path: "/open-policies/{id}/reinstate-war-cover"
    description: "Reinstate war and strikes cover after an automatic termination, at a newly agreed reinstatement rate."
    roles: [ComplianceOfficer]
    code: 200
    input: [reinstatement_rate_per_mille]
    output: OpenPolicy
    side_effects:
      - "war_cover_status := REINSTATED and reinstatement_rate_per_mille stored"
      - "cascade: every certificate of this policy in war_cover_status TERMINATED whose loading and discharge ports are both outside war_risk_tier LISTED_AREA moves to REINSTATED and books reinstatement_premium_amount = round(insured_value / 1000 * reinstatement_rate_per_mille, 2)"
      - "cascade: OpenPolicy.aggregate_premium_booked increased by the sum of those reinstatement premiums"
      - "increments `OpenPolicy.version` by 1"

  - method: POST
    path: "/open-policies/{id}/run-transit-sweep"
    description: "Advance the policy against the logical clock: end transit on certificates whose warehouse-to-warehouse window has closed and expire the policy once past expiry_at."
    roles: [Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: OpenPolicy
    side_effects:
      - "every certificate in status ISSUED with clock_now >= transit_termination_at moves to TRANSIT_ENDED"
      - "each such certificate's ACTIVE AccumulationEntry rows move to RELEASED with release_reason TRANSIT_ENDED, and the Vessel/Port accumulated_insured_value ledgers are reduced accordingly"
      - "when clock_now >= expiry_at the policy's status moves ACTIVE -> EXPIRED"
      - "increments `OpenPolicy.version` by 1"

  # --- CommodityClass -------------------------------------------------------
  - method: POST
    path: "/commodity-classes"
    description: "Register a commodity class with its susceptibility rating, packaging warranty, rate loading and survey trigger."
    roles: [Underwriter]
    code: 201
    input: [code, description, susceptibility_rating, required_packaging_code, rate_loading_pct, max_conveyance_share_pct, survey_required_above_amount]
    output: CommodityClass
    side_effects: []

  - method: GET
    path: "/commodity-classes"
    description: "List commodity classes, optionally filtered by susceptibility rating."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, Surveyor, PremiumAuditor, PlatformAdmin]
    code: 200
    input: ["susceptibility_rating?", "limit?", "offset?"]
    output: CommodityClass[]
    side_effects: []

  # --- Vessel ---------------------------------------------------------------
  - method: POST
    path: "/vessels"
    description: "Register a conveyance awaiting classification review."
    roles: [Underwriter]
    code: 201
    input: [name, imo_number, year_built, classification_society, flag_code, vessel_accumulation_limit_amount]
    output: Vessel
    side_effects:
      - "status := PENDING_REVIEW, overage_surcharge_pct := 0.00, accumulated_insured_value := 0.00, open_ga_event_count := 0"

  - method: GET
    path: "/vessels/{id}"
    description: "Read one vessel including its accumulation ledger and overage surcharge."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, PremiumAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: POST
    path: "/vessels/{id}/classification-review"
    description: "Run the classification and age screen, forking the vessel to APPROVED, OVERAGE_SURCHARGED or BLOCKED."
    roles: [Underwriter]
    code: 200
    input: []
    output: Vessel
    side_effects:
      - "`vessel_classification_decision` sets status and overage_surcharge_pct"
      - "increments `Vessel.version` by 1"

  # --- Port -----------------------------------------------------------------
  - method: POST
    path: "/ports"
    description: "Register a port with its accumulation limit, free-storage window and war risk tier."
    roles: [Underwriter, ComplianceOfficer]
    code: 201
    input: [unlocode, name, country_code, port_accumulation_limit_amount, "storage_free_days?", "war_risk_tier?"]
    output: Port
    side_effects:
      - "war_risk_tier defaults to GREEN with war_rate_multiplier 1.0; accumulated_insured_value := 0.00"

  - method: GET
    path: "/ports/{id}"
    description: "Read one port including its live accumulation ledger."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, Surveyor, PremiumAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Port
    side_effects: []

  - method: GET
    path: "/ports"
    description: "List ports, optionally filtered by war risk tier."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, Surveyor, PremiumAuditor, PlatformAdmin]
    code: 200
    input: ["war_risk_tier?", "limit?", "offset?"]
    output: Port[]
    side_effects: []

  - method: POST
    path: "/ports/{id}/war-risk-tier"
    description: "Re-tier a port's war risk; escalating to LISTED_AREA automatically terminates war cover on every policy and certificate exposed to it."
    roles: [ComplianceOfficer]
    code: 200
    input: [war_risk_tier]
    output: Port
    side_effects:
      - "war_risk_tier and its war_rate_multiplier updated (GREEN 1.0, AMBER 1.5, LISTED_AREA 0.0)"
      - "cascade link 2 (LISTED_AREA only): every OpenPolicy with a certificate touching this port moves war_cover_status ATTACHED|REINSTATED -> TERMINATED and records war_terminated_at plus war_termination_port_unlocode"
      - "cascade link 3 (LISTED_AREA only): every affected Certificate in war_cover_status ATTACHED|REINSTATED moves to TERMINATED and books the `certificate_return_premium` WAR_TERMINATION amount (war_premium_amount + strikes_premium_amount, or reinstatement_premium_amount when the certificate was in REINSTATED)"
      - "cascade link 4: OpenPolicy.aggregate_return_premium increased by those returns"
      - "cascade link 5 (conditional): a certificate already assigned to a PremiumDeclaration in status SUBMITTED or UNDER_AUDIT has that declaration's computed_premium_total, variance_amount and variance_pct recomputed"
      - "increments `Port.version` by 1"

  - method: GET
    path: "/ports/{id}/surveyors"
    description: "List the surveyors on this port's panel (reverse lookup for Surveyor.base_port_id)."
    roles: [ClaimsAdjuster, ComplianceOfficer, Underwriter, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Surveyor[]
    side_effects: []

  # --- Surveyor -------------------------------------------------------------
  - method: POST
    path: "/surveyors"
    description: "Appoint a surveyor to a port panel with the commodity ratings they are certified for."
    roles: [ComplianceOfficer]
    code: 201
    input: [name, panel_code, base_port_id, certified_commodity_ratings, "travel_buffer_minutes?"]
    output: Surveyor
    side_effects:
      - "status := ACTIVE, booked_minutes_total := 0, travel_buffer_minutes defaults to 45"

  - method: GET
    path: "/surveyors/{id}"
    description: "Read one surveyor including booked_minutes_total."
    roles: [ClaimsAdjuster, ComplianceOfficer, Underwriter, Surveyor, PlatformAdmin]
    code: 200
    input: []
    output: Surveyor
    side_effects: []

  - method: POST
    path: "/surveyors/{id}/suspend"
    description: "Suspend a surveyor from the panel; existing appointments stand but no new order may name them."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Surveyor
    side_effects:
      - "status := SUSPENDED"
      - "increments `Surveyor.version` by 1"

  # --- Certificate ----------------------------------------------------------
  - method: POST
    path: "/certificates"
    description: "Declare a shipment under an open cover, creating a DRAFT certificate with a previewed insured value."
    roles: [Assured]
    code: 201
    input: [open_policy_id, commodity_class_id, vessel_id, loading_port_id, discharge_port_id, certificate_number, valuation_basis, packaging_code, package_count, gross_weight_kg, sailing_date, discharge_date, "invoice_value?", "freight_amount?", "duty_amount?", "declared_value?", "war_cover_requested?", "strikes_cover_requested?"]
    output: Certificate
    side_effects:
      - "status := DRAFT, war_cover_status := PENDING"
      - "`certificate_insured_value` previews insured_value onto the DRAFT row using the variant named by valuation_basis"
      - "deductible_amount copied from the parent OpenPolicy (pinned for the life of the certificate)"
      - "no accumulation ledger is touched — a DRAFT certificate carries no exposure"

  - method: GET
    path: "/certificates/{id}"
    description: "Read one certificate including its insured value, premium components and both state axes."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, PremiumAuditor, Surveyor, PlatformAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/certificates"
    description: "List certificates filtered by any of their foreign keys or by either state axis (reverse lookup for all seven Certificate FKs)."
    roles: [Underwriter, Assured, ComplianceOfficer, ClaimsAdjuster, PremiumAuditor, PlatformAdmin]
    code: 200
    input: ["open_policy_id?", "commodity_class_id?", "vessel_id?", "loading_port_id?", "discharge_port_id?", "replaces_certificate_id?", "premium_declaration_id?", "status?", "war_cover_status?", "sailing_date?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: POST
    path: "/certificates/{id}/issue"
    description: "Underwrite and issue a DRAFT certificate: price it, run the full limit tower and book its exposure on every ledger."
    roles: [Underwriter]
    code: 200
    input: [expected_open_policy_version]
    output: Certificate
    side_effects:
      - "§1.4 priorities 11-24 evaluated in order (vessel screen, packaging warranty, voyage and policy period, commodity share, then the four capacity limits)"
      - "`certificate_insured_value` and `certificate_premium_components` pin insured_value, effective_rate_per_mille and the four premium fields"
      - "`transit_termination_instant` pins attachment_at and transit_termination_at"
      - "status := ISSUED; war_cover_status := ATTACHED when war_cover_requested else NOT_TAKEN; issued_by_user_id and issued_at recorded"
      - "three AccumulationEntry rows created in status ACTIVE (scope_type VESSEL, LOADING_PORT, DISCHARGE_PORT)"
      - "Vessel.accumulated_insured_value and Port.accumulated_insured_value increased by insured_value"
      - "OpenPolicy.aggregate_insured_value_booked, aggregate_premium_booked and certificates_issued_count advanced"
      - "increments `OpenPolicy.version` by 1"

  - method: POST
    path: "/certificates/{id}/endorse"
    description: "Endorse an issued certificate: supersede it and create a repriced replacement carrying replaces_certificate_id."
    roles: [Underwriter]
    code: 201
    input: [certificate_number, "invoice_value?", "declared_value?", "packaging_code?", "package_count?", "gross_weight_kg?", "sailing_date?", "discharge_date?"]
    output: Certificate
    side_effects:
      - "the original moves ISSUED -> SUPERSEDED and its ACTIVE AccumulationEntry rows move to RELEASED with release_reason CERTIFICATE_SUPERSEDED"
      - "a new Certificate is created directly in status ISSUED with replaces_certificate_id set to the original, repriced by `certificate_premium_components`"
      - "the replacement books its own three ACTIVE AccumulationEntry rows and its own ledger movements"
      - "OpenPolicy.aggregate_insured_value_booked adjusted by (replacement insured_value - original insured_value) and aggregate_premium_booked adjusted by (replacement total_premium_amount - original total_premium_amount); the original's full ab-initio return is recorded separately in aggregate_return_premium"
      - "increments `OpenPolicy.version` by 1"

  - method: POST
    path: "/certificates/{id}/cancel"
    description: "Cancel an issued certificate and return the unearned premium at the pre- or post-attachment percentage."
    roles: [Underwriter]
    code: 200
    input: ["cancellation_reason?"]
    output: Certificate
    side_effects:
      - "status := CANCELLED"
      - "`certificate_return_premium` (case CANCELLATION) increases return_premium_amount by round((total_premium_amount + reinstatement_premium_amount - return_premium_amount) * pct, 2), pct being CANCEL_UNEARNED_PCT_PRE_ATTACHMENT before attachment_at and CANCEL_UNEARNED_PCT_POST_ATTACHMENT at or after it"
      - "all ACTIVE AccumulationEntry rows of this certificate move to RELEASED with release_reason CERTIFICATE_CANCELLED"
      - "Vessel.accumulated_insured_value and Port.accumulated_insured_value reduced by insured_value, restoring their pre-issue values exactly"
      - "OpenPolicy.aggregate_insured_value_booked reduced by insured_value and aggregate_return_premium increased by the return"
      - "increments `OpenPolicy.version` by 1"

  - method: POST
    path: "/certificates/{id}/confirm-delivery"
    description: "The assured confirms final delivery to the named warehouse, ending transit before the storage window closes."
    roles: [Assured]
    code: 200
    input: ["delivered_at?"]
    output: Certificate
    side_effects:
      - "status := TRANSIT_ENDED and transit_termination_at pulled back to the delivery instant when earlier than the pinned value"
      - "ACTIVE AccumulationEntry rows move to RELEASED with release_reason DELIVERY_CONFIRMED and both accumulation ledgers are reduced"
      - "increments `Certificate.version` by 1"

  # --- AccumulationEntry ----------------------------------------------------
  - method: GET
    path: "/accumulation-entries"
    description: "List accumulation ledger rows by certificate, vessel, port, scope or status (reverse lookup for all three AccumulationEntry FKs)."
    roles: [Underwriter, ComplianceOfficer, PremiumAuditor, PlatformAdmin]
    code: 200
    input: ["certificate_id?", "vessel_id?", "port_id?", "scope_type?", "status?", "limit?", "offset?"]
    output: AccumulationEntry[]
    side_effects: []

  - method: GET
    path: "/accumulation-entries/{id}"
    description: "Read one accumulation ledger row including its exposure window."
    roles: [Underwriter, ComplianceOfficer, PremiumAuditor, PlatformAdmin]
    code: 200
    input: []
    output: AccumulationEntry
    side_effects: []

  # --- PremiumDeclaration ---------------------------------------------------
  - method: POST
    path: "/premium-declarations"
    description: "Open a premium declaration period for reporting the certificates issued inside it."
    roles: [Assured]
    code: 201
    input: [open_policy_id, period_start, period_end]
    output: PremiumDeclaration
    side_effects:
      - "status := OPEN; declared_premium_total, computed_premium_total, certificate_count, variance_amount, variance_pct and audit_adjustment_amount initialised to zero; submission_count := 0"

  - method: GET
    path: "/premium-declarations/{id}"
    description: "Read one declaration including the reconciliation result and audit outcome."
    roles: [Assured, PremiumAuditor, Underwriter, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PremiumDeclaration
    side_effects: []

  - method: GET
    path: "/premium-declarations"
    description: "List declarations for a policy (reverse lookup for PremiumDeclaration.open_policy_id)."
    roles: [Assured, PremiumAuditor, Underwriter, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["open_policy_id?", "status?", "limit?", "offset?"]
    output: PremiumDeclaration[]
    side_effects: []

  - method: POST
    path: "/premium-declarations/{id}/submit"
    description: "Submit the declared premium for the period; the server assigns the period's certificates and reconciles the declaration."
    roles: [Assured]
    code: 200
    input: [declared_premium_total]
    output: PremiumDeclaration
    side_effects:
      - "unassigned certificates of the policy with issued_at inside [period_start, period_end) are stamped with premium_declaration_id"
      - "`declaration_premium_reconciliation` sets computed_premium_total, certificate_count, variance_amount and variance_pct"
      - "status := SUBMITTED, submitted_by_user_id recorded, submission_count incremented, auditor_user_id cleared"
      - "conditional cascade: a SUSPENDED parent policy returns to ACTIVE when the recomputed variance_pct is within tolerance"
      - "increments `PremiumDeclaration.version` by 1"

  - method: POST
    path: "/premium-declarations/{id}/start-audit"
    description: "A premium auditor other than the submitter opens the audit of a submitted declaration."
    roles: [PremiumAuditor]
    code: 200
    input: []
    output: PremiumDeclaration
    side_effects:
      - "status := UNDER_AUDIT and auditor_user_id := X-User-ID"
      - "increments `PremiumDeclaration.version` by 1"

  - method: POST
    path: "/premium-declarations/{id}/finish-audit"
    description: "Close the audit; the outcome forks on the computed variance, not on the auditor's opinion."
    roles: [PremiumAuditor]
    code: 200
    input: ["audit_note?"]
    output: PremiumDeclaration
    side_effects:
      - "variance_pct <= DECLARATION_AUDIT_TOLERANCE_PCT: status := ACCEPTED and audit_adjustment_amount := 0.00"
      - "variance_pct > DECLARATION_AUDIT_TOLERANCE_PCT: status := ADJUSTED and audit_adjustment_amount := abs(variance_amount)"
      - "cascade (conditional): variance_pct > DECLARATION_SUSPENSION_PCT moves the parent OpenPolicy ACTIVE -> SUSPENDED"
      - "increments `PremiumDeclaration.version` by 1"

  # --- ClaimFile ------------------------------------------------------------
  - method: POST
    path: "/claim-files"
    description: "Open a claim against an issued certificate, optionally tied to a general average event."
    roles: [ClaimsAdjuster]
    code: 201
    input: [certificate_id, loss_type, peril, adjustment_basis, claimed_amount, loss_date, "ga_event_id?", "damage_percentage?", "sound_market_value?", "damaged_sale_proceeds?"]
    output: ClaimFile
    side_effects:
      - "status := OPENED, subrogation_status := NOT_STARTED, documentation_complete := false, warranty_breach := false"
      - "cascade: the Certificate moves ISSUED -> CLAIMED and is exempted from the transit sweep"
      - "recovered_amount := 0.00, net_loss_amount := 0.00"

  - method: GET
    path: "/claim-files/{id}"
    description: "Read one claim including both state axes, the adjustment result and the subrogation ledger."
    roles: [ClaimsAdjuster, Underwriter, ComplianceOfficer, Surveyor, PlatformAdmin]
    code: 200
    input: []
    output: ClaimFile
    side_effects: []

  - method: GET
    path: "/claim-files"
    description: "List claims by certificate, by general average event or by either state axis (reverse lookup for both ClaimFile FKs)."
    roles: [ClaimsAdjuster, Underwriter, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["certificate_id?", "ga_event_id?", "status?", "subrogation_status?", "limit?", "offset?"]
    output: ClaimFile[]
    side_effects: []

  - method: POST
    path: "/claim-files/{id}/documents"
    description: "Append a damage document to the claim's evidence log and re-derive documentation completeness."
    roles: [ClaimsAdjuster, Surveyor]
    code: 201
    input: [doc_type, reference, "received_at?"]
    output: DamageDocument
    side_effects:
      - "an immutable DamageDocument row is appended with origin ADJUSTER or SURVEYOR according to the acting role"
      - "cascade: ClaimFile.documentation_complete := true once the log holds at least one document of each of the three mandatory types SURVEY_REPORT, BILL_OF_LADING and CARRIER_CLAIM_LETTER (COMMERCIAL_INVOICE, PACKING_LIST and PHOTO_SET are optional evidence)"
      - "increments `ClaimFile.version` by 1"

  - method: GET
    path: "/claim-files/{id}/documents"
    description: "List the claim's damage documents in received_at order (reverse lookup for DamageDocument.claim_file_id)."
    roles: [ClaimsAdjuster, Underwriter, ComplianceOfficer, Surveyor, PlatformAdmin]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: DamageDocument[]
    side_effects: []

  - method: POST
    path: "/claim-files/{id}/adjust"
    description: "Adjust the claim; the outcome forks to DENIED, DOCS_INCOMPLETE or ADJUSTED on the warranty and documentation state."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["damage_percentage?", "sound_market_value?", "damaged_sale_proceeds?"]
    output: ClaimFile
    side_effects:
      - "warranty_breach == true: status := DENIED with adjusted_amount 0.00 (evaluated first)"
      - "documentation_complete == false: status := DOCS_INCOMPLETE with adjusted_amount left null"
      - "otherwise `claim_adjusted_amount` sets adjusted_amount and deductible_applied_amount, time_bar_at := discharge_date + SUBROGATION_TIME_BAR_DAYS days, status := ADJUSTED"
      - "adjusted_by_user_id := X-User-ID"
      - "increments `ClaimFile.version` by 1"

  - method: POST
    path: "/claim-files/{id}/settle"
    description: "Settle an adjusted claim; the settling adjuster must differ from the adjusting one."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimFile
    side_effects:
      - "status := SETTLED, settled_amount := adjusted_amount, net_loss_amount := adjusted_amount - recovered_amount"
      - "settled_by_user_id := X-User-ID"
      - "increments `ClaimFile.version` by 1"

  - method: POST
    path: "/claim-files/{id}/subrogation-notice"
    description: "Serve notice of subrogation on the carrier before the time bar expires."
    roles: [ClaimsAdjuster]
    code: 200
    input: [carrier_name]
    output: ClaimFile
    side_effects:
      - "subrogation_status := NOTICE_SENT, carrier_name stored, subrogation_notice_at := clock_now"
      - "at or after time_bar_at the axis flips to TIME_BARRED instead and the request fails with ERR_SUBROGATION_TIME_BARRED"
      - "increments `ClaimFile.version` by 1"

  - method: POST
    path: "/claim-files/{id}/subrogation-recovery"
    description: "Book a recovery received from the carrier and restate the net loss."
    roles: [ClaimsAdjuster]
    code: 200
    input: [recovered_amount]
    output: ClaimFile
    side_effects:
      - "subrogation_status := RECOVERED, recovered_amount stored, net_loss_amount := settled_amount - recovered_amount"
      - "increments `ClaimFile.version` by 1"

  # --- SurveyOrder ----------------------------------------------------------
  - method: POST
    path: "/survey-orders"
    description: "Appoint a panel surveyor for a claim inside a requested attendance window."
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_file_id, surveyor_id, window_start_at, window_end_at]
    output: SurveyOrder
    side_effects:
      - "`surveyor_window_conflict` rejects the appointment when the buffered window collides with an existing order"
      - "status := APPOINTED and window_minutes computed"
      - "Surveyor.booked_minutes_total increased by window_minutes"
      - "cascade: the ClaimFile moves OPENED|DOCS_INCOMPLETE -> SURVEY_ORDERED"

  - method: GET
    path: "/survey-orders/{id}"
    description: "Read one survey order including the filed report fields."
    roles: [ClaimsAdjuster, Surveyor, ComplianceOfficer, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: SurveyOrder
    side_effects: []

  - method: GET
    path: "/survey-orders"
    description: "List survey orders by claim or by surveyor (reverse lookup for both SurveyOrder FKs)."
    roles: [ClaimsAdjuster, Surveyor, ComplianceOfficer, Underwriter, PlatformAdmin]
    code: 200
    input: ["claim_file_id?", "surveyor_id?", "status?", "limit?", "offset?"]
    output: SurveyOrder[]
    side_effects: []

  - method: POST
    path: "/survey-orders/{id}/file-report"
    description: "The appointed surveyor files the report, stating whether the packaging warranty was complied with."
    roles: [Surveyor]
    code: 200
    input: [packaging_compliant, report_reference, "damage_percentage_found?"]
    output: SurveyOrder
    side_effects:
      - "status := REPORT_FILED and the report fields stored"
      - "cascade link 2: a DamageDocument (doc_type SURVEY_REPORT, origin SURVEYOR) is appended to the claim"
      - "cascade link 3: ClaimFile moves SURVEY_ORDERED -> SURVEY_RECEIVED, documentation_complete re-derived and warranty_breach := true when packaging_compliant == false"
      - "increments `SurveyOrder.version` by 1"

  - method: POST
    path: "/survey-orders/{id}/cancel"
    description: "Cancel an appointment and return the reserved minutes to the surveyor's calendar."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: SurveyOrder
    side_effects:
      - "status := CANCELLED"
      - "Surveyor.booked_minutes_total reduced by window_minutes, restoring the pre-appointment total exactly"
      - "cascade: the ClaimFile returns SURVEY_ORDERED -> OPENED when it has no other APPOINTED order"
      - "increments `SurveyOrder.version` by 1"

  # --- General Average ------------------------------------------------------
  - method: POST
    path: "/ga-events"
    description: "Declare a general average act on a voyage, with the sacrifice and salvage award to be made good."
    roles: [ClaimsAdjuster]
    code: 201
    input: [vessel_id, voyage_sailing_date, declaration_date, average_adjuster_name, sacrifice_amount, salvage_award_amount]
    output: GeneralAverageEvent
    side_effects:
      - "status := DECLARED with the allowance and contribution fields still zero"
      - "cascade: the Vessel's open_ga_event_count is incremented and its status moves APPROVED|OVERAGE_SURCHARGED -> GA_HOLD"

  - method: GET
    path: "/ga-events/{id}"
    description: "Read one general average event including the adjustment arithmetic."
    roles: [ClaimsAdjuster, Underwriter, Assured, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: GeneralAverageEvent
    side_effects: []

  - method: GET
    path: "/ga-events"
    description: "List general average events by vessel (reverse lookup for GeneralAverageEvent.vessel_id)."
    roles: [ClaimsAdjuster, Underwriter, Assured, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["vessel_id?", "status?", "limit?", "offset?"]
    output: GeneralAverageEvent[]
    side_effects: []

  - method: POST
    path: "/ga-events/{id}/issue-security-calls"
    description: "Run the average adjustment and call security from every contributing interest."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: GeneralAverageEvent
    side_effects:
      - "`ga_contribution_allocation` sets adjuster_fee_amount, total_allowance_amount, total_contributory_value and contribution_rate"
      - "one GaSecurityPosting per contributing certificate is created in status REQUIRED with its contributory_value, contribution_amount, cash_deposit_required and cash_deposit_expected_amount"
      - "each contributing Certificate.ga_contribution_amount is written"
      - "postings_required_count set, postings_posted_count := 0, status := SECURITY_COLLECTING"
      - "increments `GeneralAverageEvent.version` by 1"

  - method: GET
    path: "/ga-security-postings"
    description: "List security postings by event or by certificate (reverse lookup for both GaSecurityPosting FKs)."
    roles: [ClaimsAdjuster, Underwriter, Assured, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["ga_event_id?", "certificate_id?", "status?", "limit?", "offset?"]
    output: GaSecurityPosting[]
    side_effects: []

  - method: GET
    path: "/ga-security-postings/{id}"
    description: "Read one security posting including the called contribution and expected cash deposit."
    roles: [ClaimsAdjuster, Underwriter, Assured, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: GaSecurityPosting
    side_effects: []

  - method: POST
    path: "/ga-security-postings/{id}/post"
    description: "Post an average guarantee and cash deposit against a called contribution."
    roles: [Assured]
    code: 200
    input: [expected_ga_event_version, guarantee_amount, cash_deposit_amount]
    output: GaSecurityPosting
    side_effects:
      - "status := POSTED with the guarantee and deposit stored"
      - "the certificate's OpenPolicy.security_deposit_held_amount increased by cash_deposit_amount"
      - "GeneralAverageEvent.postings_posted_count incremented and, on the last posting, status := SECURITY_COMPLETE"
      - "increments `GeneralAverageEvent.version` by 1"

  - method: POST
    path: "/ga-events/{id}/finalize-adjustment"
    description: "Close the average adjustment, release every posted security and let the vessel out of GA hold."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: GeneralAverageEvent
    side_effects:
      - "status := ADJUSTED"
      - "cascade link 2: every GaSecurityPosting on the event moves POSTED -> RELEASED"
      - "cascade link 3: each released deposit is deducted from the certificate's OpenPolicy.security_deposit_held_amount, returning it to its pre-posting value"
      - "cascade link 4: Vessel.open_ga_event_count decremented and, at zero, the vessel leaves GA_HOLD for APPROVED or OVERAGE_SURCHARGED per its preserved overage_surcharge_pct"
      - "increments `GeneralAverageEvent.version` by 1"

  # --- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, storage window, time bar and vessel-age computation is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock is set; no entity is mutated and no sweep is run (sweeps are explicit via POST /open-policies/{id}/run-transit-sweep)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth -----------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an Assured acts on a policy, certificate, declaration or posting that is not its own, or a Surveyor files a report on an order appointed to someone else"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the same X-User-ID both submitted and audits a declaration, or both adjusted and settles a claim"

  # --- payload --------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative money, unparseable datetime, or pagination limit outside 1..100"

  # --- existence ------------------------------------------------------------
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no OpenPolicy with the supplied path id or open_policy_id"
  - id: ERR_COMMODITY_CLASS_NOT_FOUND
    http: 404
    condition: "no CommodityClass with the supplied commodity_class_id"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "no Vessel with the supplied path id or vessel_id"
  - id: ERR_PORT_NOT_FOUND
    http: 404
    condition: "no Port with the supplied path id, loading_port_id, discharge_port_id or base_port_id"
  - id: ERR_SURVEYOR_NOT_FOUND
    http: 404
    condition: "no Surveyor with the supplied path id or surveyor_id"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "no Certificate with the supplied path id, certificate_id or replaces_certificate_id"
  - id: ERR_ACCUMULATION_ENTRY_NOT_FOUND
    http: 404
    condition: "no AccumulationEntry with the supplied path id"
  - id: ERR_DECLARATION_NOT_FOUND
    http: 404
    condition: "no PremiumDeclaration with the supplied path id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no ClaimFile with the supplied path id or claim_file_id"
  - id: ERR_SURVEY_ORDER_NOT_FOUND
    http: 404
    condition: "no SurveyOrder with the supplied path id"
  - id: ERR_GA_EVENT_NOT_FOUND
    http: 404
    condition: "no GeneralAverageEvent with the supplied path id or ga_event_id"
  - id: ERR_GA_POSTING_NOT_FOUND
    http: 404
    condition: "no GaSecurityPosting with the supplied path id"

  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_REFERENCE
    http: 409
    condition: "policy_number, certificate_number, imo_number, unlocode, panel_code or commodity code already exists"

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the triggered transition has no `from` state matching the resource's current state field, or a non-cross-entity precondition of that transition fails"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the targeted state field is already in one of its machine's terminal states (ACCEPTED, SETTLED, DENIED, RECOVERED, TIME_BARRED, ADJUSTED on a GA event, RELEASED, REPORT_FILED, CANCELLED, EXPIRED)"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "a certificate is declared, issued or endorsed under a policy that is not ACTIVE"
  - id: ERR_WAR_COVER_TERMINATED
    http: 409
    condition: "war or strikes cover is requested while the policy's war_cover_status is TERMINATED, or reinstatement is attempted while a nominated port is in war_risk_tier LISTED_AREA"
  - id: ERR_VESSEL_BLOCKED
    http: 422
    condition: "the nominated vessel is BLOCKED (unapproved classification society or over the block age), still PENDING_REVIEW, or in GA_HOLD while an average adjustment is open"
  - id: ERR_SURVEYOR_INACTIVE
    http: 409
    condition: "the nominated surveyor is SUSPENDED"
  - id: ERR_GA_ADJUSTMENT_PENDING
    http: 409
    condition: "a GENERAL_AVERAGE claim is settled before its general average event reaches ADJUSTED"

  # --- concurrency ----------------------------------------------------------
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_open_policy_version does not equal the stored OpenPolicy.version (§1.2.1 certificate-issue-stale-policy)"
  - id: ERR_STALE_GA_EVENT_VERSION
    http: 412
    condition: "expected_ga_event_version does not equal the stored GeneralAverageEvent.version (§1.2.1 ga-posting-stale-event)"

  # --- safety and warranty --------------------------------------------------
  - id: ERR_PACKAGING_WARRANTY_BREACH
    http: 422
    condition: "packaging_code does not match the commodity class's required_packaging_code"
  - id: ERR_SURVEY_REQUIRED
    http: 422
    condition: "a claim above the commodity class's survey_required_above_amount is adjusted with no REPORT_FILED survey order"

  # --- temporal -------------------------------------------------------------
  - id: ERR_VOYAGE_DATES_INVALID
    http: 422
    condition: "sailing_date is later than discharge_date"
  - id: ERR_OUTSIDE_POLICY_PERIOD
    http: 422
    condition: "the certificate's attachment instant falls outside the half-open policy period [inception_at, expiry_at)"
  - id: ERR_DECLARATION_PERIOD_OVERLAP
    http: 409
    condition: "the new declaration period overlaps an existing period of the same policy under half-open semantics"
  - id: ERR_SUBROGATION_TIME_BARRED
    http: 409
    condition: "a subrogation notice is served at or after ClaimFile.time_bar_at"

  # --- constraint -----------------------------------------------------------
  - id: ERR_VALUATION_INPUT_MISSING
    http: 422
    condition: "DECLARED_VALUE without declared_value, or CIF_PLUS_MARKUP without invoice_value"
  - id: ERR_COMMODITY_SHARE_EXCEEDED
    http: 422
    condition: "insured_value exceeds the commodity class's permitted share of the conveyance limit"
  - id: ERR_SURVEYOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested attendance window collides with an existing APPOINTED or REPORT_FILED order once inflated by the travel buffer"
  - id: ERR_SURVEYOR_NOT_CERTIFIED
    http: 422
    condition: "the surveyor is not certified for the susceptibility rating of the claimed commodity"
  - id: ERR_NO_CONTRIBUTING_CERTIFICATES
    http: 422
    condition: "security calls are issued on a voyage with no ISSUED or CLAIMED certificate"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_CERTIFICATE_LIMIT_EXCEEDED
    http: 422
    condition: "insured_value exceeds OpenPolicy.per_certificate_limit_amount"
  - id: ERR_CONVEYANCE_LIMIT_EXCEEDED
    http: 422
    condition: "conveyance exposure plus this insured_value exceeds OpenPolicy.conveyance_limit_amount"
  - id: ERR_VESSEL_ACCUMULATION_EXCEEDED
    http: 422
    condition: "vessel ledger exposure plus this insured_value exceeds Vessel.vessel_accumulation_limit_amount"
  - id: ERR_PORT_ACCUMULATION_EXCEEDED
    http: 422
    condition: "overlapping discharge-port exposure plus this insured_value exceeds Port.port_accumulation_limit_amount"
  - id: ERR_ANNUAL_AGGREGATE_EXCEEDED
    http: 422
    condition: "aggregate_insured_value_booked plus this insured_value exceeds OpenPolicy.annual_aggregate_limit_amount"
  - id: ERR_SECURITY_AMOUNT_INSUFFICIENT
    http: 422
    condition: "guarantee_amount is below the called contribution_amount or cash_deposit_amount is below cash_deposit_expected_amount"
  - id: ERR_RECOVERY_EXCEEDS_SETTLEMENT
    http: 422
    condition: "recovered_amount exceeds ClaimFile.settled_amount"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Underwriter
    description: "Marine underwriter: writes open covers, screens conveyances, prices and issues certificates, endorses and cancels them."
    identity: opaque
    exclusive_operations:
      - "POST /open-policies"
      - "POST /open-policies/{id}/activate"
      - "POST /commodity-classes"
      - "POST /vessels"
      - "POST /vessels/{id}/classification-review"
      - "POST /certificates/{id}/issue"
      - "POST /certificates/{id}/endorse"
      - "POST /certificates/{id}/cancel"
    shared_operations:
      - "POST /ports (with ComplianceOfficer)"
      - "POST /open-policies/{id}/run-transit-sweep (with ComplianceOfficer)"
      - "read access to policies, certificates, accumulation entries, declarations, claims, survey orders and GA events"

  - name: Assured
    description: "Cargo owner holding the open cover: declares shipments, confirms delivery, reports premium by declaration and posts general average security."
    identity: "entity_backed:OpenPolicy"
    exclusive_operations:
      - "POST /certificates"
      - "POST /certificates/{id}/confirm-delivery"
      - "POST /premium-declarations"
      - "POST /premium-declarations/{id}/submit"
      - "POST /ga-security-postings/{id}/post"
    shared_operations:
      - "read access to its own policy, certificates, declarations, GA events and postings"
    note: "X-User-ID equals the id of the OpenPolicy the assured holds; every write is checked against that policy id (§1.4 priority 6)."

  - name: ComplianceOfficer
    description: "War risk and panel authority: re-tiers ports, reinstates terminated war cover, appoints and suspends surveyors."
    identity: opaque
    exclusive_operations:
      - "POST /ports/{id}/war-risk-tier"
      - "POST /open-policies/{id}/reinstate-war-cover"
      - "POST /surveyors"
      - "POST /surveyors/{id}/suspend"
    shared_operations:
      - "POST /ports (with Underwriter)"
      - "POST /open-policies/{id}/run-transit-sweep (with Underwriter)"
      - "read access to policies, certificates, accumulation entries, claims, survey orders and GA events"

  - name: PremiumAuditor
    description: "Premium auditor: audits submitted declarations and cannot audit what they submitted."
    identity: opaque
    exclusive_operations:
      - "POST /premium-declarations/{id}/start-audit"
      - "POST /premium-declarations/{id}/finish-audit"
    shared_operations:
      - "read access to policies, certificates, accumulation entries and declarations"

  - name: ClaimsAdjuster
    description: "Claims adjuster: opens and adjusts claims, appoints surveyors, settles claims adjusted by a colleague, pursues subrogation and runs general average adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /claim-files"
      - "POST /claim-files/{id}/adjust"
      - "POST /claim-files/{id}/settle"
      - "POST /claim-files/{id}/subrogation-notice"
      - "POST /claim-files/{id}/subrogation-recovery"
      - "POST /survey-orders"
      - "POST /survey-orders/{id}/cancel"
      - "POST /ga-events"
      - "POST /ga-events/{id}/issue-security-calls"
      - "POST /ga-events/{id}/finalize-adjustment"
    shared_operations:
      - "POST /claim-files/{id}/documents (with Surveyor)"
      - "read access to policies, certificates, claims, documents, survey orders, GA events and postings"

  - name: Surveyor
    description: "Panel surveyor: attends the appointed survey, files the report and appends evidence to the claim."
    identity: "entity_backed:Surveyor"
    exclusive_operations:
      - "POST /survey-orders/{id}/file-report"
    shared_operations:
      - "POST /claim-files/{id}/documents (with ClaimsAdjuster)"
      - "read access to the claims, certificates, ports and commodity classes relevant to their orders"
    note: "X-User-ID equals the id of the Surveyor row; a report may only be filed on an order whose surveyor_id matches (§1.4 priority 6)."

  - name: PlatformAdmin
    description: "Operator of the platform: drives the logical clock and holds read access everywhere."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read access to every collection"
