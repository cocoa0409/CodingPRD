    input: [expected_capital_plan_version]
    output: FundingScenario
    side_effects:
      - "execute waterfall_allocation; create PlanLineItem rows FUNDED/UNFUNDED"
      - "previously RUN scenario of the same plan moves to SUPERSEDED and its PlanLineItem rows move to REMOVED"
      - "recompute CapitalPlan.total_programmed_cents"
