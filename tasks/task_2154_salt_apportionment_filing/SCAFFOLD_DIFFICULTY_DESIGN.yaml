          Trigger B - an evaluate-nexus run on a DIFFERENT state, propagating through a different
          chain: LINK 1 the NY registration_status becomes REGISTRATION_REQUIRED because nexus
          resolved ECONOMIC; LINK 2, because that row became REGISTRATION_REQUIRED, the group's
          open_registration_obligations goes 0 -> 1; LINK 3, because the counter reached 1,
          compliance_posture goes COMPLIANT -> EXPOSED; LINK 4, because the posture flipped, the
