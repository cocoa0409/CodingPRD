  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: invoice_billing_period_closed_interval_single_occupancy
        grounds:
          - validations[priority=17]
          - errors.ERR_INVOICE_PERIOD_OVERLAP
          - entities.DefenseInvoice.fields.period_start
          - entities.DefenseInvoice.fields.period_end
          - endpoints["POST /epli/defense-assignments/{assignment_id}/invoices"]
        distinguishing_aspect: |
          Interval semantics: CLOSED [period_start, period_end] with single occupancy
          (capacity 1) per DefenseAssignment. Because both endpoints are inclusive, a
          second invoice whose period_start equals an existing invoice's period_end
          shares exactly one instant and MUST be refused; a period_start one day later
          is accepted. The resource being contended is the DefenseAssignment's billing
          calendar.
        test_recipe:
          setup:
            - "Chain P (CA T4 / TX T2, ACTIVE RatePlan, 'Northgate Retail Group', policy ACTIVE for [2026-08-01, 2027-08-01))."
            - "'Ashford & Vance LLP' (NATIONAL, CA/TX, 92000 / 51000 / 18000, capacity 3) is on the panel."
            - "A HARASSMENT / EMPLOYEE claim is accepted and holds a CLIENT_DIRECTED DefenseAssignment with Ashford & Vance for engagement [2026-08-01, 2026-11-01) and budget_cap_cents 10000000."
            - "Counsel has already submitted one invoice covering the CLOSED period [2026-08-01, 2026-08-31] with 20.0 associate hours and no expenses."
