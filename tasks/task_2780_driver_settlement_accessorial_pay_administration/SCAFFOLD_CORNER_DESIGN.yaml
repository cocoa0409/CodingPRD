            - "RetroCorrection.${rc_drc}.status == PENDING with delta_gross_cents == -57200 and applied_settlement_id == null"
            - "the first driver read shows pending_retro_correction_cents == -57200 and settlement_hold == true"
            - "the cancel returns HTTP 200 and RetroCorrection.${rc_drc}.status == CANCELLED with cancelled_at == 2026-08-11T09:00:00.000Z and cancelled_by_user_id == admin-01"
            - "the second driver read shows pending_retro_correction_cents == 0 and settlement_hold == false in the same request, with no clock advance"
            - "the second cancel returns HTTP 409 with error_id ERR_CORRECTION_NOT_PENDING"
            - "after the failed second cancel pending_retro_correction_cents is still 0 and settlement_hold is still false"
            - "the cancel also walked Load.${load_drc}.pay_status back from ADJUSTED to SETTLED"
            - "Load.${load_drc}.paid_miles is still 250 and linehaul_pay_cents is still 14500, because cancelling the correction abandons the money movement without un-adjudicating the upheld dispute"
            - "Settlement.${stl_drc}.linehaul_total_cents is still 71700, so the paid statement permanently disagrees with the load"
      - name: a_four_hop_cascade_from_one_resolve_reaches_the_driver_hold_flag
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - state_machines.Load.SETTLED_to_ADJUSTED
          - entities.RetroCorrection
          - entities.Driver.fields.settlement_hold
