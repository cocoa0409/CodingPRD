              as_user_id: "${acct_id}"
              captures: { x_id: "$.data.id"}
            - call: "POST /notices/${x_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${x_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { x_proof: "$.data[0].id"}
            - call: "POST /proofs/${x_proof}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${x_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { x_v: "$.data.version"}
            - call: "POST /notices/${x_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${x_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "BID", county: "SPRINGFIELD", title: "Bid Y", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
