          setup: ["ACTIVE plan (AGGRESSIVE, expected 20000), buyer APPROVED, FLAT contract C1 3000 @4.50, HTA contract C2 3000 @2026-12"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "FP Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
