# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Smart Home & Home-Theater Integration. Breadth probe over §1.1–§1.7.
# Sections/claim_types are taken verbatim from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_computed_counters_zeroed
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with client_id+site_address+region_code -> 201; status=DRAFT, provisioned_device_count=0, open_change_order_count=0, contract_balance_cents=0, version=1."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C1", email: "c1@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "NORTH" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.status == DRAFT"
            - "Project.${proj_id}.provisioned_device_count == 0"
            - "Project.${proj_id}.open_change_order_count == 0"
            - "Project.${proj_id}.contract_balance_cents == 0"
            - "Project.${proj_id}.version == 1"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Project, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_project_missing_region_code_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Project.fields.region_code, "validations[priority=5]"]
        distinguishing_aspect: "POST /projects without region_code -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C2", email: "c2@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_client_default_billing_tier_residential
        claim_type: Defaults
        grounds: [entities.Client.fields.billing_tier]
        distinguishing_aspect: "POST /clients omitting billing_tier -> billing_tier defaults to RESIDENTIAL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "C3", email: "c3@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          assert:
            - "Client.${client_id}.billing_tier == RESIDENTIAL"

      - name: device_is_controller_computed_from_category
        claim_type: Computed Fields
        grounds: [entities.Device.fields.is_controller, entities.Device.fields.category]
        distinguishing_aspect: "Registering a Device with category=CONTROLLER yields is_controller=true; category=AUDIO yields is_controller=false (input is_controller ignored)."
        test_recipe:
          setup: ["A PROVISIONING project with a rack exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C4", email: "c4@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-CTRL", category: "CONTROLLER", rack_units: 2 }
              as: LowVoltageTech
              captures: { ctrl_id: $.data.id }
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-SPK", category: "AUDIO", rack_units: 1 }
              as: LowVoltageTech
              captures: { spk_id: $.data.id }
          assert:
            - "Device.${ctrl_id}.is_controller == true"
            - "Device.${spk_id}.is_controller == false"

      - name: create_device_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Device.fields.category, "validations[priority=5]"]
        distinguishing_aspect: "POST /devices with category=GADGET (not in enum) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A rack exists on a project."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C5", email: "c5@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "X", category: "GADGET", rack_units: 1 }
              as: LowVoltageTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds: [entities.Project, response_envelope]
        distinguishing_aspect: "GET /projects?limit=1&offset=0 returns response_type=array with pagination meta total_count/has_more."
        test_recipe:
          setup: ["Two projects exist for one client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C6", email: "c6@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "2 St", region_code: "WEST" }
              as: ProjectManager
          trigger:
            - call: "GET /projects?client_id=${client_id}&limit=1&offset=0"
              payload: {}
              as: ProjectManager
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == true with limit=1"

      - name: device_create_nonexistent_rack_returns_referential_integrity
        claim_type: Parent Relationships
        grounds: [entities.Device.fields.rack_id, "validations[priority=6]", "errors[ERR_REFERENTIAL_INTEGRITY]"]
        distinguishing_aspect: "POST /devices with rack_id pointing at a non-existent rack -> 422 ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /devices"
              payload: { rack_id: "00000000-0000-4000-8000-000000000000", sku: "X", category: "AUDIO", rack_units: 1 }
              as: LowVoltageTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENTIAL_INTEGRITY"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: proposal_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Proposal, entities.Proposal.fields.status]
        distinguishing_aspect: "A freshly created proposal has status=DRAFT and revision=1."
        test_recipe:
          setup: ["A DRAFT project exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C7", email: "c7@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
          assert:
            - "Proposal.${prop_id}.status == DRAFT"
            - "Proposal.${prop_id}.revision == 1"

      - name: accept_already_accepted_proposal_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Proposal.SENT_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling accept again on an ACCEPTED proposal -> 409 ERR_INVALID_STATE (terminal-state lockdown / idempotency rejection)."
        test_recipe:
          setup: ["A proposal already ACCEPTED on a project."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C8", email: "c8@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: start_provisioning_without_rack_returns_rack_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.Project.ACCEPTED_to_PROVISIONING, "errors[ERR_RACK_REQUIRED]"]
        distinguishing_aspect: "start-provisioning on an ACCEPTED project with no rack -> 409 ERR_RACK_REQUIRED."
        test_recipe:
          setup: ["An ACCEPTED project with NO rack."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C9", email: "c9@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RACK_REQUIRED"

      - name: proposal_send_bubbles_project_to_proposed
        claim_type: Side Effect Execution
        grounds: [state_machines.Proposal.DRAFT_to_SENT, state_machines.Project, entities.Project.fields.status]
        distinguishing_aspect: "Sending a proposal flips Project.status DRAFT->PROPOSED (bubble-up side effect)."
        test_recipe:
          setup: ["A DRAFT proposal with one line item on a DRAFT project."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C10", email: "c10@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
          assert:
            - "Proposal.${prop_id}.status == SENT"
            - "Project.${proj_id}.status == PROPOSED"

      - name: proposal_reject_returns_project_to_draft_revision_loop
        claim_type: Valid Transition
        grounds: [state_machines.Proposal.SENT_to_REJECTED, state_machines.Project]
        distinguishing_aspect: "Client rejects a SENT proposal -> Proposal REJECTED and Project.status PROPOSED->DRAFT (branch-with-revert)."
        test_recipe:
          setup: ["A SENT proposal on a PROPOSED project."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C11", email: "c11@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Proposal.${prop_id}.status == REJECTED"
            - "Project.${proj_id}.status == DRAFT"

      - name: superseding_proposal_closes_prior_draft
        claim_type: Side Effect Execution
        grounds: [state_machines.Proposal.DRAFT_to_SUPERSEDED, entities.Proposal.fields.revision]
        distinguishing_aspect: "Creating a second proposal while a DRAFT one is open -> the prior DRAFT becomes SUPERSEDED and the new one carries revision=2."
        test_recipe:
          setup: ["A DRAFT proposal (revision 1) on a DRAFT project."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C12", email: "c12@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop1_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { proj_v1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 4.0, expected_project_version: "${proj_v1}" }
              as: SystemsDesigner
              captures: { prop2_id: $.data.id }
          assert:
            - "Proposal.${prop1_id}.status == SUPERSEDED"
            - "Proposal.${prop2_id}.revision == 2"
            - "Proposal.${prop2_id}.status == DRAFT"

      - name: terminal_change_order_applied_cannot_reapply
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ChangeOrder.APPROVED_to_APPLIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-applying an already-APPLIED change order -> 409 ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A project with an accepted proposal and one APPLIED change order."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C13", email: "c13@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 3.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/change-orders"
              payload: { description: "Add", delta_cents: 10000 }
              as: ProjectManager
              captures: { co_id: $.data.id }
            - call: "POST /projects/${proj_id}/change-orders/${co_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { proj_v_pre: $.data.version }
            - call: "POST /projects/${proj_id}/change-orders/${co_id}/apply"
              payload: { expected_project_version: "${proj_v_pre}" }
              as: ProjectManager
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { proj_v_post: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/change-orders/${co_id}/apply"
              payload: { expected_project_version: "${proj_v_post}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: rma_advance_replace_mints_replacement_device
        claim_type: Side Effect Execution
        grounds: [state_machines.RmaTicket.OPENED_to_AUTHORIZED, entities.RmaTicket.fields.replacement_device_id]
        distinguishing_aspect: "Authorizing an ADVANCE_REPLACE RMA mints a new REGISTERED Device on the same rack and sets replacement_device_id; the faulted device stays FAULTED."
        test_recipe:
          setup: ["An ACTIVE contract; a FAULTED device on the rack; an OPENED RMA with resolution ADVANCE_REPLACE."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C14", email: "c14@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-CTRL", category: "CONTROLLER", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev_id: $.data.id }
            - call: "POST /devices/${dev_id}/provision"
              payload: {}
              as: LowVoltageTech
            - call: "POST /devices/${dev_id}/firmware-updates"
              payload: { target_version: "3.4.1" }
              as: SupportEngineer
              captures: { fw_id: $.data.id }
            - call: "POST /devices/${dev_id}/firmware-updates/${fw_id}/apply"
              payload: {}
              as: SupportEngineer
            - call: "POST /devices/${dev_id}/bring-online"
              payload: {}
              as: LowVoltageTech
            - call: "POST /projects/${proj_id}/contract"
              payload: { plan: "PLUS", prepaid_hours: 8, hourly_rate_cents: 12000 }
              as: SupportEngineer
              captures: { contract_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract/activate"
              payload: {}
              as: SupportEngineer
            - call: "POST /devices/${dev_id}/mark-faulted"
              payload: {}
              as: SupportEngineer
            - call: "POST /rma-tickets"
              payload: { device_id: "${dev_id}", contract_id: "${contract_id}", fault_code: "HARDWARE", resolution: "ADVANCE_REPLACE" }
              as: SupportEngineer
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /rma-tickets/${rma_id}/authorize"
              payload: {}
              as: SupportEngineer
              captures: { repl_id: $.data.replacement_device_id }
          assert:
            - "RmaTicket.${rma_id}.status == AUTHORIZED"
            - "RmaTicket.${rma_id}.replacement_device_id is a non-null Device id on rack ${rack_id}"
            - "Device.${dev_id}.status == FAULTED (unchanged)"

      - name: rma_ship_return_repair_retires_faulted_device
        claim_type: Cross-entity
        grounds: [state_machines.RmaTicket.AUTHORIZED_to_SHIPPED, state_machines.Device.FAULTED_to_RETIRED]
