  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_closed_interval_plus_turnaround_buffer_conflict
        grounds:
          - validations[priority=30]
          - entities.Vehicle.fields.turnaround_minutes
          - entities.UnitAssignment.fields.window_start_iso
          - errors[ERR_VEHICLE_DOUBLE_BOOKED]
        distinguishing_aspect: "Vehicle overlap uses a CLOSED interval extended by the vehicle's turnaround_minutes buffer: a second assignment starting 20 minutes after the first ends conflicts because 20 < the 30-minute turnaround buffer, returning ERR_VEHICLE_DOUBLE_BOOKED — buffer-inclusive interval semantics distinct from the crew half-open rule."
        test_recipe:
          setup:
            - "Agency with one Vehicle (turnaround_minutes 30) and two CrewMembers; two transports T1 and T2; an existing UnitAssignment on the vehicle from 09:00 to 10:00."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Veh EMS", npi: "9999999996", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /vehicles"
              payload: { agency_id: "${ag}", unit_call_sign: "Medic-1", turnaround_minutes: 30 }
              as: BillingAdmin
              captures: { veh: $.data.id }
            - call: "POST /crew-members"
              payload: { agency_id: "${ag}", full_name: "Crew A", certification: "PARAMEDIC" }
              as: BillingAdmin
              captures: { crewA: $.data.id }
            - call: "POST /crew-members"
              payload: { agency_id: "${ag}", full_name: "Crew B", certification: "PARAMEDIC" }
              as: BillingAdmin
              captures: { crewB: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "V1", dispatch_iso: "2026-06-09T09:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 5.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t1: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "V2", dispatch_iso: "2026-06-09T10:20:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 5.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t2: $.data.id }
            - call: "POST /unit-assignments"
              payload: { transport_id: "${t1}", vehicle_id: "${veh}", crew_member_id: "${crewA}", window_start_iso: "2026-06-09T09:00:00.000Z", window_end_iso: "2026-06-09T10:00:00.000Z" }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { ua1: $.data.id }
          trigger:
            - call: "POST /unit-assignments"
              payload: { transport_id: "${t2}", vehicle_id: "${veh}", crew_member_id: "${crewB}", window_start_iso: "2026-06-09T10:20:00.000Z", window_end_iso: "2026-06-09T11:00:00.000Z" }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VEHICLE_DOUBLE_BOOKED"

      - name: crew_half_open_interval_back_to_back_allowed
        grounds:
          - validations[priority=31]
          - entities.UnitAssignment.fields.crew_member_id
          - entities.UnitAssignment.fields.window_end_iso
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: "Crew overlap uses a HALF-OPEN interval [start,end) with NO buffer: a second assignment for the same crew member starting exactly when the first ends (10:00 == 10:00) is ALLOWED (back-to-back), proving different interval semantics than the vehicle buffered-closed rule which would reject it."
        test_recipe:
          setup:
            - "Agency with two Vehicles and one CrewMember; two transports; an existing UnitAssignment on the crew member from 09:00 to 10:00 using vehicle 1."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Crew EMS", npi: "9999999997", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /vehicles"
              payload: { agency_id: "${ag}", unit_call_sign: "Medic-1", turnaround_minutes: 30 }
              as: BillingAdmin
              captures: { veh1: $.data.id }
            - call: "POST /vehicles"
              payload: { agency_id: "${ag}", unit_call_sign: "Medic-2", turnaround_minutes: 30 }
              as: BillingAdmin
              captures: { veh2: $.data.id }
            - call: "POST /crew-members"
              payload: { agency_id: "${ag}", full_name: "Solo Crew", certification: "PARAMEDIC" }
              as: BillingAdmin
              captures: { crew: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "C1", dispatch_iso: "2026-06-09T09:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 5.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t1: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "C2", dispatch_iso: "2026-06-09T10:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 5.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t2: $.data.id }
            - call: "POST /unit-assignments"
              payload: { transport_id: "${t1}", vehicle_id: "${veh1}", crew_member_id: "${crew}", window_start_iso: "2026-06-09T09:00:00.000Z", window_end_iso: "2026-06-09T10:00:00.000Z" }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { ua1: $.data.id }
          trigger:
            - call: "POST /unit-assignments"
              payload: { transport_id: "${t2}", vehicle_id: "${veh2}", crew_member_id: "${crew}", window_start_iso: "2026-06-09T10:00:00.000Z", window_end_iso: "2026-06-09T11:00:00.000Z" }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { ua2: $.data.id }
          assert:
            - "second assignment code == 201"
            - "UnitAssignment.${ua2}.crew_member_id == ${crew}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_transport_drains_total_billed_receivable_to_zero
        grounds:
          - state_machines.Transport.UNBILLED_to_VOID
          - calculations.reconcile_transport_ledger
          - entities.Transport.fields.total_billed_cents
          - entities.Charge.fields.billed_amount_cents
        distinguishing_aspect: "Conserved quantity = the agency receivable (total_billed_cents). Coding a transport raises total_billed_cents to 101000 by synthesizing two Charges; the compensating VOID deletes those Charges and returns total_billed_cents to exactly 0 with no drift."
        test_recipe:
          setup:
            - "Agency ACTIVE; one CODED transport (ALS1-emergency 12.0mi) with total_billed_cents 101000, still UNBILLED (no claims)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Void EMS", npi: "9999999998", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "VOID1", dispatch_iso: "2026-06-10T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
          trigger:
            - call: "POST /transports/${t}/void"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
          assert:
            - "Transport.${t}.billing_status == VOID"
            - "Transport.${t}.total_billed_cents == 0"
            - "GET /transports/${t}/charges returns total_count == 0"

      - name: payer_payments_conserve_against_claim_paid_amounts
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - entities.Payment.fields.amount_cents
          - entities.Claim.fields.paid_amount_cents
          - calculations.reconcile_transport_ledger
        distinguishing_aspect: "Conserved quantity = collected cash. After a COB sequence (primary commercial PAID 30000, secondary medicaid PAID 20000), the invariant sum(Payment.amount_cents where source==PAYER) == sum(Claim.paid_amount_cents over PAID claims) == 50000 == Transport.total_paid_cents holds with zero drift — a different conserved quantity (cash collected) than the void receivable invariant."
        test_recipe:
          setup:
            - "Patient with commercial primary (qpa 1.0, allows_balance_billing true) rank 1 and medicaid secondary rank 2; agency NOT No-Surprises; BLS non-emergency 20.0mi rural transport (billed 94875) fully documented."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Cash EMS", npi: "9999999999", state_code: "TX", base_state_is_no_surprises: false }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Commercial", payer_type: "COMMERCIAL", qpa_multiplier: 1.0, allows_balance_billing: true }
              as: BillingAdmin
              captures: { comm: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicaid", payer_type: "MEDICAID", allows_balance_billing: false }
              as: BillingAdmin
              captures: { mcaid: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01", coverages: [ { payer_plan_id: "${comm}", policy_rank: 1 }, { payer_plan_id: "${mcaid}", policy_rank: 2 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "CASH1", dispatch_iso: "2026-06-10T08:00:00.000Z", origin_modifier: "R", destination_modifier: "H", loaded_miles: 20.0, is_rural_pickup: true, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${comm}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim1: $.data.id }
            - call: "POST /claims/${claim1}/remittances"
              payload: { outcome: "PAID", paid_cents: 30000 }
              as: Biller
              as_user_id: "${biller}"
          trigger:
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v2: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${mcaid}", prior_claim_id: "${claim1}", expected_transport_version: "${t_v2}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim2: $.data.id }
            - call: "POST /claims/${claim2}/remittances"
              payload: { outcome: "PAID", paid_cents: 20000 }
              as: Biller
              as_user_id: "${biller}"
          assert:
            - "Claim.${claim1}.paid_amount_cents == 30000"
            - "Claim.${claim2}.paid_amount_cents == 20000"
            - "Transport.${t}.total_paid_cents == 50000"
            - "Transport.${t}.patient_responsibility_cents == 16640"
