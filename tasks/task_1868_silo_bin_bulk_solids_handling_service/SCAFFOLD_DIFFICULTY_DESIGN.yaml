          setup:
            - "Site SA (no hold) with vessel VLA; site SB (credit_hold true) with vessel VLB. Technician TT6 capacity 40. Ticket TA (site SA) APPROVED and SCHEDULED 2026-08-10 09:00-12:00 to TT6. Ticket TB (site SB) APPROVED."
