              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { gross_pre: "$.data.gross_income_cents" }
          trigger:
            - call: "PATCH /snap/household-members/${m2_id}"
              payload: { status: "REMOVED" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { gross_mid: "$.data.gross_income_cents" }
            - call: "PATCH /snap/household-members/${m2_id}"
              payload: { status: "ACTIVE" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { gross_post: "$.data.gross_income_cents" }
          assert:
            - "Pre-action Household.${hh_id}.gross_income_cents == 150000"
            - "Mid-state (M2 REMOVED) Household.${hh_id}.gross_income_cents == 100000 (drop = 50000)"
            - "Post-compensation (M2 reactivated) Household.${hh_id}.gross_income_cents == 150000 (monetary invariant preserved across roundtrip)"
