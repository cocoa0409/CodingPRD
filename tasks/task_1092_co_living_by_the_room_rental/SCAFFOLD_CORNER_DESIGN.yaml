  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_stale_room_version_on_rate_revision_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[room-rate-revision-stale-room]
          - errors[ERR_STALE_ROOM_VERSION]
          - endpoints[PUT /co-living/rooms/{id}]
        distinguishing_aspect: "Two strictly sequential PUTs carrying the same observed Room.version: the first succeeds and bumps the version, the second is rejected with HTTP 412 ERR_STALE_ROOM_VERSION and leaves weekly_rate_cents at the first revision's value."
        test_recipe:
          setup:
            - "One house with room 101 at 25000 cents/week; the client has read its current version."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "GET /co-living/rooms/${room1_id}"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { rv1: $.data.version }
          trigger:
            - call: "PUT /co-living/rooms/${room1_id}"
              payload: { expected_room_version: "${rv1}", weekly_rate_cents: 27000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { rv2: $.data.version }
            - call: "PUT /co-living/rooms/${room1_id}"
              payload: { expected_room_version: "${rv1}", weekly_rate_cents: 31000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first PUT returns HTTP 200 and ${rv2} == ${rv1} + 1"
            - "the second PUT returns HTTP 412 with error_id == ERR_STALE_ROOM_VERSION"
            - "Room.${room1_id}.weekly_rate_cents == 27000 and monthly_rate_cents == 100000"
            - "Room.${room1_id}.version == ${rv2} - the rejected write did not bump it"

