  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: placement_decision_revision_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.PlacementDecision.TEAM_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.PlacementDecision.RETURNED_FOR_REVISION_to_TEAM_REVIEW
          - entities.PlacementDecision.fields.revision_round
          - validations[priority=12]
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind: TEAM_REVIEW -> RETURNED_FOR_REVISION -> TEAM_REVIEW
          is traversable exactly MAX_REVISION_ROUNDS (3) times, and the fourth
          return-for-revision from a legitimately-TEAM_REVIEW row is refused with
          ERR_MAX_ROUNDS_EXCEEDED (409) rather than ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "One Student and one PlacementDecision authored by u-coord-1."
            - "The decision has been round-tripped three times: submit / return-for-revision (revision_round 1) / submit / return (2) / submit / return (3) / submit, leaving it in TEAM_REVIEW with revision_round == 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-0007", full_name: "Gia Pham", district_of_residence: "Northvale USD", disability_category: "INTELLECTUAL_DISABILITY", iep_effective_date: "2026-08-15", lre_current_setting: "SEPARATE_CLASS_UNDER_40", medicaid_eligible: false, medicaid_consent_on_file: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload: { student_id: "${stu_id}", recommended_placement_type: "DAY", lre_justification: "The team documented three continuum options and found none able to deliver the required functional life-skills curriculum.", continuum_options_considered: [{ setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "Curriculum mismatch." }, { setting: "RESOURCE_40_79", rejected_reason: "No functional skills strand." }, { setting: "SEPARATE_CLASS_UNDER_40", rejected_reason: "No community-based instruction." }] }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/return-for-revision"
              payload: { reviewer_notes: "Round 1: document the community-based instruction gap." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/return-for-revision"
              payload: { reviewer_notes: "Round 2: attach the transition assessment." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/return-for-revision"
              payload: { reviewer_notes: "Round 3: clarify the rejected_reason for resource room." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          trigger:
            - call: "POST /ood-placements/placement-decisions/${dec_id}/return-for-revision"
              payload: { reviewer_notes: "Round 4 attempt." }
              as: TeamChair
              as_user_id: "u-chair-1"
          assert:
            - "The trigger returns HTTP 409 with data.error_id == ERR_MAX_ROUNDS_EXCEEDED"
            - "PlacementDecision.${dec_id}.revision_round == 3 (unchanged by the refused call)"
            - "PlacementDecision.${dec_id}.status == TEAM_REVIEW"
            - "A subsequent POST /ood-placements/placement-decisions/${dec_id}/approve as TeamChair u-chair-1 succeeds with status == APPROVED, proving the row was not wedged"

