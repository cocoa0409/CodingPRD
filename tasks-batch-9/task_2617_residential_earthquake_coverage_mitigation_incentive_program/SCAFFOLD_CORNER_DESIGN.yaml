# 1.9 Scaffold Corner Design - breadth coverage for task_2617
# Residential Earthquake Coverage & Mitigation Incentive Program
# Sections and claim_type values are taken from references/claim-extraction-guide.md.
# The logical clock starts at 2026-08-01T00:00:00Z in every recipe unless a call moves it.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_participating_insurer_returns_envelope_and_all_declared_fields
        claim_type: creation
        grounds:
          - entities.ParticipatingInsurer
          - endpoints.POST_/eqp/insurers
          - response_envelope.success
        distinguishing_aspect: "A single POST with the three required inputs must return 201 with response_type object, version 1 and every system/computed counter at its declared default - an implementation that omits the counters or starts version at 0 fails."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /eqp/insurers"
              payload: { name: "Cascade Mutual", naic_code: "20001", market_share_pct: 12.5 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id, ins_version: $.data.version, ins_status: $.data.status, ins_comp: $.data.compliance_status, ins_offers: $.data.offers_recorded_count, ins_undoc: $.data.undocumented_decline_count, ins_rate: $.data.last_take_up_rate_bp, ins_bal: $.data.assessment_balance_cents, ins_bound: $.data.policies_bound_count, ins_share: $.data.market_share_pct }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "${ins_id} is a bare UUID with no type prefix and ${ins_version} == 1"
            - "${ins_share} == 12.5, ${ins_status} == \"ACTIVE\", ${ins_comp} == \"COMPLIANT\""
            - "${ins_offers} == 0, ${ins_undoc} == 0, ${ins_rate} == 0, ${ins_bal} == 0, ${ins_bound} == 0"

      - name: retrieve_grant_cycle_returns_the_stored_row_with_derived_uncommitted
        claim_type: retrieval
        grounds:
          - entities.GrantCycle
          - endpoints.GET_/eqp/grant-cycles/{id}
        distinguishing_aspect: "GET must echo the persisted cycle including uncommitted_cents, which is derived at creation as total_pool_cents minus reserved minus disbursed rather than stored as null."
        test_recipe:
          setup:
            - "One OPEN BRACE_AND_BOLT cycle with a 4,000,000 pool"
          setup_api_calls:
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "2026 Retrieval Cycle", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 4000000 }
              as: ProgramAdmin
              captures: { gc_id: $.data.id }
          trigger:
            - call: "GET /eqp/grant-cycles/${gc_id}"
              payload: {}
              as: GrantReviewer
              captures: { g_track: $.data.program_track, g_label: $.data.label, g_opens: $.data.opens_at, g_pool: $.data.total_pool_cents, g_res: $.data.reserved_cents, g_dis: $.data.disbursed_cents, g_unc: $.data.uncommitted_cents, g_status: $.data.status, g_v: $.data.version }
          assert:
            - "${g_track} == \"BRACE_AND_BOLT\", ${g_label} == \"2026 Retrieval Cycle\", ${g_opens} == \"2026-07-01T00:00:00Z\", ${g_pool} == 4000000"
            - "${g_res} == 0, ${g_dis} == 0, ${g_unc} == 4000000, ${g_status} == \"OPEN\", ${g_v} == 1"

      - name: list_dwellings_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/eqp/dwellings
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three dwellings, limit 2 offset 0 must return exactly 2 rows with total_count 3 and has_more true, and offset 2 must return 1 row with has_more false - total_count is the unpaginated count, not the page size."
        test_recipe:
          setup:
            - "One policyholder with three dwellings"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Lea Ortiz", email: "lea@example.com", county_code: "06083" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "1 Mesa Road", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2001, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_1: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "2 Mesa Road", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2002, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_2: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "3 Mesa Road", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2003, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_3: $.data.id }
          trigger:
            - call: "GET /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", limit: 2, offset: 2 }
              as: ProgramAdmin
              captures: { p2_first: "$.data[0].id" }
          assert:
            - "page 1: response_type == \"array\", exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${p1_first} and ${p2_first} are different dwelling ids and every returned id is one of ${dw_1}, ${dw_2}, ${dw_3}"

      - name: retrieve_unknown_dwelling_returns_dwelling_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/eqp/dwellings/{id}
          - errors[ERR_DWELLING_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown UUID on the dwelling read must return 404 ERR_DWELLING_NOT_FOUND in the error envelope, not 200 with a null body."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /eqp/dwellings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\" and ${nf_err} == \"ERR_DWELLING_NOT_FOUND\""
            - "data.message is a non-empty string"

      - name: dwelling_create_missing_required_inputs_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Dwelling
          - validations.ERR_INVALID_REQUEST
        distinguishing_aspect: "Each of the seven Dwelling inputs is required with no default, so omitting dwelling_limit_cents, street_address or county_hazard_tier must each return 400 ERR_INVALID_REQUEST rather than persisting a partial row."
        test_recipe:
          setup:
            - "One policyholder so that the only defect in each probe is the missing field"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Owen Pike", email: "owen@example.com", county_code: "06111" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "9 Absent Way", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1999 }
              as: ProgramAdmin
              captures: { m1_err: $.data.error_id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1999, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { m2_err: $.data.error_id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "9 Absent Way", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1999, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { m3_err: $.data.error_id }
            - call: "GET /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}" }
              as: ProgramAdmin
          assert:
            - "${m1_err} == \"ERR_INVALID_REQUEST\" with HTTP 400 (dwelling_limit_cents omitted)"
            - "${m2_err} == \"ERR_INVALID_REQUEST\" with HTTP 400 (street_address omitted)"
            - "${m3_err} == \"ERR_INVALID_REQUEST\" with HTTP 400 (county_hazard_tier omitted)"
            - "the final list returns total_count == 0 - no partial dwelling was persisted"

      - name: defaults_applied_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Policyholder.fields.outreach_campaign_code
          - entities.MandatoryOffer.fields.campaign_code
          - entities.MandatoryOffer.fields.decline_documented
        distinguishing_aspect: "Omitting outreach_campaign_code and campaign_code must store the literal string NONE (not null or empty), decline_documented must default to false, offer_round to 1 and the offer expiry to the clock plus 60 days."
        test_recipe:
          setup:
            - "One insurer and one policyholder created without their optional fields, at the default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Default Valley Insurance", naic_code: "20002", market_share_pct: 3.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Ines Kaur", email: "ines@example.com", county_code: "06029" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id, ph_campaign: $.data.outreach_campaign_code, ph_status: $.data.status }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "4 Default Lane", county_hazard_tier: "TIER_3", soil_class: "SOFT", structure_type: "WOOD_FRAME_SLAB", year_built: 1998, dwelling_limit_cents: 15000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id, dw_retro: $.data.retrofit_status, dw_scope: $.data.verified_retrofit_scope, dw_count: $.data.grant_lifetime_count }
          trigger:
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_campaign: $.data.campaign_code, off_doc: $.data.decline_documented, off_round: $.data.offer_round, off_status: $.data.status, off_offered: $.data.offered_at, off_expires: $.data.expires_at, off_responded: $.data.responded_at }
          assert:
            - "${ph_campaign} == \"NONE\" and ${ph_status} == \"ACTIVE\""
            - "${dw_retro} == \"NONE\", ${dw_scope} == \"NONE\", ${dw_count} == 0"
            - "${off_campaign} == \"NONE\", ${off_doc} == false, ${off_round} == 1, ${off_status} == \"PENDING\""
            - "${off_offered} == \"2026-08-01T00:00:00Z\" and ${off_expires} == \"2026-09-30T00:00:00Z\" (OFFER_VALID_DAYS 60) and ${off_responded} is null"

      - name: policy_computed_pricing_fields_are_derived_and_client_values_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Policy.fields.base_premium_cents
          - calculations.hazard_base_premium
          - entities.Policy.fields.rated_dwelling_limit_cents
        distinguishing_aspect: "A quote that also carries base_premium_cents, annual_premium_cents and rating_variant in its body must ignore all three and compute 64,000 / 64,000 / QUOTE_TIME, and rated_dwelling_limit_cents must stay null until bind snapshots it."
        test_recipe:
          setup:
            - "A TIER_2 / STIFF / WOOD_FRAME_SLAB / 1990 dwelling of 20,000,000 cents with an ACCEPTED offer"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Ignore Ridge Insurance", naic_code: "20003", market_share_pct: 4.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Petra Vogt", email: "petra@example.com", county_code: "06095" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "6 Ignore Court", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000, base_premium_cents: 1, annual_premium_cents: 1, rating_variant: "RENEWAL_TIME", mitigation_discount_cents: 999, policyholder_id: "not-a-real-id" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { c_base: $.data.base_premium_cents, c_annual: $.data.annual_premium_cents, c_variant: $.data.rating_variant, c_disc: $.data.mitigation_discount_cents, c_ph: $.data.policyholder_id, c_rated: $.data.rated_dwelling_limit_cents, c_quote_exp: $.data.quote_expires_at, c_term: $.data.term_number }
          assert:
            - "${c_base} == 64000 and ${c_annual} == 64000 - the supplied 1 is ignored"
            - "${c_variant} == \"QUOTE_TIME\" and ${c_disc} == 0 - the supplied RENEWAL_TIME and 999 are ignored"
            - "${c_ph} == \"${ph_id}\" - policyholder_id is derived from the dwelling, not accepted from the body"
            - "${c_rated} is null before bind and ${c_quote_exp} == \"2026-08-31T00:00:00Z\" (QUOTE_VALID_DAYS 30), ${c_term} == 1"

      - name: dwelling_system_fields_are_server_minted_and_client_values_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Dwelling.fields.retrofit_status
          - entities.Dwelling
          - response_envelope.success
        distinguishing_aspect: "A create body carrying id, created_at, version and retrofit_status VERIFIED must be persisted with a server-minted UUID, version 1 and retrofit_status NONE - accepting the client's VERIFIED would hand out a mitigation discount for free."
        test_recipe:
          setup:
            - "One policyholder"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Rafe Sultan", email: "rafe@example.com", county_code: "06065" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "7 Spoof Street", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1970, dwelling_limit_cents: 20000000, id: "11111111-1111-4111-8111-111111111111", version: 42, retrofit_status: "VERIFIED", verified_retrofit_scope: "CRIPPLE_WALL_BRACING", grant_lifetime_count: 7 }
              as: ProgramAdmin
              captures: { s_id: $.data.id, s_v: $.data.version, s_retro: $.data.retrofit_status, s_scope: $.data.verified_retrofit_scope, s_count: $.data.grant_lifetime_count }
          assert:
            - "${s_id} != \"11111111-1111-4111-8111-111111111111\" and is a server-minted bare UUID"
            - "${s_v} == 1, ${s_retro} == \"NONE\", ${s_scope} == \"NONE\", ${s_count} == 0"
            - "created_at and updated_at are ISO 8601 UTC strings minted by the server"

      - name: out_of_domain_dwelling_and_policy_field_values_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.ERR_INVALID_ENUM_VALUE
          - validations.ERR_INVALID_AMOUNT
          - entities.Dwelling.fields.year_built
        distinguishing_aspect: "Enum defects outrank numeric-domain defects (priority 11 before 12), so an unknown soil_class returns ERR_INVALID_ENUM_VALUE while an in-domain enum with year_built 1700 or a 1,000,000-cent dwelling limit returns ERR_INVALID_AMOUNT."
        test_recipe:
          setup:
            - "One policyholder and one insurer so that only the probed field is defective"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Zaid Amari", email: "zaid@example.com", county_code: "06025" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/insurers"
              payload: { name: "Domain Check Insurance", naic_code: "20004", market_share_pct: 2.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "8 Domain Drive", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1995, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "10 Domain Drive", county_hazard_tier: "TIER_2", soil_class: "SANDY", structure_type: "WOOD_FRAME_SLAB", year_built: 1995, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { t1_err: $.data.error_id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "12 Domain Drive", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1700, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { t2_err: $.data.error_id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "14 Domain Drive", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1995, dwelling_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { t3_err: $.data.error_id }
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 12, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { t4_err: $.data.error_id }
          assert:
            - "${t1_err} == \"ERR_INVALID_ENUM_VALUE\" with HTTP 422 (SANDY is not a soil_class)"
            - "${t2_err} == \"ERR_INVALID_AMOUNT\" with HTTP 422 (year_built 1700 is below 1850)"
            - "${t3_err} == \"ERR_INVALID_AMOUNT\" with HTTP 422 (1,000,000 cents is below the 5,000,000 floor)"
            - "${t4_err} == \"ERR_INVALID_ENUM_VALUE\" with HTTP 422 (deductible_pct 12 is not one of 5/10/15/20/25)"

      - name: dwelling_requires_an_existing_policyholder_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations.ERR_POLICYHOLDER_NOT_FOUND
          - entities.Dwelling.fields.policyholder_id
        distinguishing_aspect: "A body FK that names no row must be resolved before any business rule runs (priority 5), so an unknown policyholder_id returns 404 ERR_POLICYHOLDER_NOT_FOUND and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "00000000-0000-4000-8000-000000000000", street_address: "16 Orphan Row", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2005, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP 404 with ${fk_err} == \"ERR_POLICYHOLDER_NOT_FOUND\""

      - name: cross_reference_integrity_quote_rejects_an_offer_for_another_dwelling
        claim_type: entity_topology_flat
        grounds:
          - validations.ERR_MANDATORY_OFFER_NOT_ACCEPTED
          - entities.Policy.fields.accepted_offer_id
        distinguishing_aspect: "In a flat topology every FK pair must be cross-checked: an ACCEPTED offer for dwelling B cannot be used to quote dwelling A even though both rows exist and belong to the same policyholder and insurer."
        test_recipe:
          setup:
            - "One insurer, one policyholder, two dwellings A and B, and an ACCEPTED offer on B only"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Crosswire Insurance", naic_code: "20005", market_share_pct: 6.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Nadia Roos", email: "nadia@example.com", county_code: "06079" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "18 Crosswire Way", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1996, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_a: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "20 Crosswire Way", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1996, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_b: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_b}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_b: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_b}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_a}", insurer_id: "${ins_id}", accepted_offer_id: "${off_b}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { x_err: $.data.error_id }
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_b}", insurer_id: "${ins_id}", accepted_offer_id: "${off_b}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { ok_status: $.data.lifecycle_status, ok_dw: $.data.dwelling_id }
          assert:
            - "the mismatched quote returns HTTP 409 with ${x_err} == \"ERR_MANDATORY_OFFER_NOT_ACCEPTED\" (priority 45 checks insurer_id AND dwelling_id, not just the offer status)"
            - "the matching quote returns HTTP 201 with ${ok_status} == \"QUOTED\" and ${ok_dw} == \"${dw_b}\""

      - name: assessment_allocation_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
