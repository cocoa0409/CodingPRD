              as: OperationsManager
              captures: { prop_f1: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "61 A", city: "PDX", state_code: "OR", postal_code: "97202", living_area_sqft: 1200, lot_area_sqft: 4000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
