  # ===================================================================================
  # Guide section 6 — From Table 6 (Errors). 59 error codes; every code must have at
  # least one request that provokes it. The codes not covered by the sections above are
  # the twelve existence 404s and the two upper-bound temporal guards.
  # ===================================================================================
  - section: errors
    instances:

      - name: every_remaining_existence_code_is_triggerable_from_an_empty_database_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=30]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
          - errors[ERR_BALLOT_NOT_FOUND]
          - errors[ERR_VOTE_NOT_FOUND]
          - errors[ERR_COMMENT_NOT_FOUND]
          - errors[ERR_PUBLIC_REVIEW_NOT_FOUND]
          - errors[ERR_PATENT_DISCLOSURE_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_MAINTENANCE_ITEM_NOT_FOUND]
        distinguishing_aspect: "Each collection reports its OWN existence code rather than a generic 404: nine well-formed but unknown path ids on nine different collections return nine distinct error_id values, so no read falls back to an empty 200 envelope or to a shared ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database — no row of any kind has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StandardsStaff
          trigger:
            - call: "GET /sdo/participants/99999999-9999-9999-9999-999999999901"
              payload: {}
              as: StandardsStaff
              captures: { e1: $.data.error_id }
            - call: "GET /sdo/memberships/99999999-9999-9999-9999-999999999902"
              payload: {}
              as: StandardsStaff
              captures: { e2: $.data.error_id }
            - call: "GET /sdo/ballots/99999999-9999-9999-9999-999999999903"
              payload: {}
              as: StandardsStaff
              captures: { e3: $.data.error_id }
            - call: "GET /sdo/votes/99999999-9999-9999-9999-999999999904"
              payload: {}
              as: StandardsStaff
              captures: { e4: $.data.error_id }
            - call: "GET /sdo/comments/99999999-9999-9999-9999-999999999905"
              payload: {}
              as: StandardsStaff
              captures: { e5: $.data.error_id }
            - call: "GET /sdo/public-reviews/99999999-9999-9999-9999-999999999906"
              payload: {}
              as: StandardsStaff
              captures: { e6: $.data.error_id }
            - call: "GET /sdo/patent-disclosures/99999999-9999-9999-9999-999999999907"
              payload: {}
              as: StandardsStaff
              captures: { e7: $.data.error_id }
            - call: "GET /sdo/appeals/99999999-9999-9999-9999-999999999908"
              payload: {}
              as: StandardsStaff
              captures: { e8: $.data.error_id }
            - call: "GET /sdo/maintenance-items/99999999-9999-9999-9999-999999999909"
              payload: {}
              as: StandardsStaff
              captures: { e9: $.data.error_id }
          assert:
            - 'every call: HTTP status == 404 with response.response_type == "error"'
            - 'call 1 (participants): response.data.error_id == ERR_PARTICIPANT_NOT_FOUND'
            - 'call 2 (memberships): response.data.error_id == ERR_MEMBERSHIP_NOT_FOUND'
            - 'call 3 (ballots): response.data.error_id == ERR_BALLOT_NOT_FOUND'
            - 'call 4 (votes): response.data.error_id == ERR_VOTE_NOT_FOUND'
            - 'call 5 (comments): response.data.error_id == ERR_COMMENT_NOT_FOUND'
            - 'call 6 (public-reviews): response.data.error_id == ERR_PUBLIC_REVIEW_NOT_FOUND'
            - 'call 7 (patent-disclosures): response.data.error_id == ERR_PATENT_DISCLOSURE_NOT_FOUND'
            - 'call 8 (appeals): response.data.error_id == ERR_APPEAL_NOT_FOUND'
            - 'call 9 (maintenance-items): response.data.error_id == ERR_MAINTENANCE_ITEM_NOT_FOUND'
            - 'every response carries a non-empty data.message'

      - name: an_unknown_body_foreign_key_is_reported_in_field_declaration_order_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=50]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_BALLOT_NOT_FOUND]
        distinguishing_aspect: "Priority 50 walks the body foreign keys in the order the fields are declared on the entity, and it runs before the identity check at priority 64: an appeal carrying an unknown appellant_participant_id AND an unknown cited_ballot_id reports ERR_PARTICIPANT_NOT_FOUND, because appellant_participant_id is declared first, and only once the appellant resolves does the unknown ballot surface as ERR_BALLOT_NOT_FOUND."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
            - "Work item STD-1400 scope-approved onto TC-14 and carrying revision-1 draft d1 of 40 clauses."
