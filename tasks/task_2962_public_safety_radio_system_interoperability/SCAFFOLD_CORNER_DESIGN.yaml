            - "trigger[0] returns HTTP 200 and InteropPatch.${patch_dur_id}.status == RELEASED"
            - "InteropPatch.${patch_dur_id}.released_at == \"2026-08-01T00:01:45Z\" and release_reason == OPERATOR"
            - "InteropPatch.${patch_dur_id}.duration_minutes == 1"
            - "Talkgroup.${tg_dur_a}.active_patch_count == 0 and Talkgroup.${tg_dur_b}.active_patch_count == 0 and MemberAgency.${agency_dur_id}.active_patch_request_count == 0"

      - name: fee_basis_variant_divergence_on_identical_fleets
        claim_type: variant_divergence
