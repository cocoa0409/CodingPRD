  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: allocate_then_cancel_conserves_stock
        grounds:
          - state_machines.Release.ALLOCATED_to_CANCELLED
          - state_machines.ReleaseLine.ALLOCATED_to_CANCELLED
          - calculations.backorder_waterfall
        distinguishing_aspect: |
          Conserved quantity = item stock units: allocate (on_hand ->
          allocated) paired with cancel (allocated -> on_hand) leaves
          stock_on_hand + stock_allocated == total received (100) with no
          drift.
        test_recipe:
          setup:
