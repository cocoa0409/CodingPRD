            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 1, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T04:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { live_run: $.data.id }
            - call: "POST /bakery/production-runs/${live_run}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
          trigger:
            - call: "POST /bakery/ovens/${oven_a_id}/status"
              payload: { oven_status: "MAINTENANCE", status_reason: "burner service" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_live_run: $.data.error_id }
            - call: "POST /bakery/production-runs/${live_run}/complete"
              payload: { actual_units: 40 }
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/ovens/${oven_a_id}/status"
              payload: { oven_status: "MAINTENANCE", status_reason: "burner service" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { oven_v_after: $.data.version }
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 1, oven_id: "${oven_a_id}", deck_index: 1, bake_start_utc: "2026-08-12T08:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { e_oven_down: $.data.error_id }
            - call: "POST /bakery/ovens/${oven_a_id}/status"
              payload: { oven_status: "AVAILABLE" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 1, oven_id: "${oven_a_id}", deck_index: 1, bake_start_utc: "2026-08-12T08:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { later_run: $.data.id }
          assert:
            - "${e_live_run} == ERR_INVALID_RUN_STATE with HTTP 409 and Oven.${oven_a_id}.oven_status is still AVAILABLE"
            - "after the run completes the status write returns 200 with oven_status MAINTENANCE, status_reason 'burner service' and ${oven_v_after} greater than the creation version"
            - "${e_oven_down} == ERR_OVEN_UNAVAILABLE — scheduling onto a down oven is refused"
            - "the AVAILABLE write returns 200 and ProductionRun.${later_run} is then created on ${oven_a_id} deck 1"

      - name: run_read_exposes_every_derived_schedule_labor_and_cost_field
        claim_type: computed_read
