              captures: { bay: $.data.id }
            - call: "POST /stores/${s}/service-bookings"
              payload: { bay_id: "${bay}", pet_id: "${pet}", service_type: "GROOMING", starts_at: "2026-09-20T09:00:00Z", ends_at: "2026-09-20T10:00:00Z", expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk: $.data.id, bk_v: $.data.version, bk_pv: $.data.pet_version }
            - call: "POST /stores/${s}/service-bookings/${bk}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: true, expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk_v2: $.data.version, bk_pv2: $.data.pet_version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/service-bookings/${bk}"
              payload: {}
              as: Any
          assert:
            - "ServiceBooking.${bk}.screening_valid_until == 2026-09-02T09:00:00Z and re_screen_required == true, because the clock has passed the validity instant"
            - "the booking is still SCREENED, so the lapse alone does not move it"
            - "POST /stores/${s}/service-bookings/${bk}/confirm-bay with expected_booking_version ${bk_v2} remains admissible even though the screening has lapsed, so the lapse is advisory rather than blocking"

      - name: two_walk_in_clinics_may_not_hold_overlapping_windows
        claim_type: conditional_feature_flags
        grounds:
          - validations[priority=9]
          - errors[ERR_CLINIC_OVERLAP]
          - calculations.bay_window_conflict
        distinguishing_aspect: "The same occupancy idea applies to a second resource type with its own error: two clinics of one store on one date may not overlap, while a clinic on a later date with the identical clock times is admitted."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1703 with an existing clinic on 2026-07-06 running 09:00 to 12:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1703", city: "Muncie", state_code: "CA", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/vaccination-clinics"
              payload: { clinic_date: "2026-07-06T00:00:00Z", open_time: "2026-07-06T09:00:00Z", close_time: "2026-07-06T12:00:00Z" }
              as: VaccinationStaff
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /stores/${s}/vaccination-clinics"
              payload: { clinic_date: "2026-07-06T00:00:00Z", open_time: "2026-07-06T11:00:00Z", close_time: "2026-07-06T14:00:00Z" }
              as: VaccinationStaff
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_CLINIC_OVERLAP, because 11:00 falls inside the 09:00–12:00 clinic"
            - "the identical window on 2026-07-07 is admitted with 201, showing the overlap scope is the clinic_date"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: pending_cycles_are_voided_rather_than_billed_on_cancellation
        claim_type: immediate
        grounds:
          - state_machines.ServicePackage.PAUSED_to_CANCELLED
          - calculations.outstanding_balance_ledger
          - entities.PackageBillingCycle.fields.status
        distinguishing_aspect: "Cancellation is atomic within the request: every PENDING cycle becomes VOID in the same response and the member's outstanding balance is recomputed excluding those cycles, so no voided cycle ever reduces the balance."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1801; member Lior; a PLUS package with billing_cycle_count 2, one cycle already billed, then the package paused."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1801", city: "Carson", state_code: "CA", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Lior Barak", email: "lior@example.com", state_code: "CA", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/${s}/members/${m}/service-packages"
              payload: { tier: "PLUS", member_state_code: "CA", state_sales_tax_rate: 0.0, billing_cycle_count: 2, monthly_fee_cents: 5000 }
              as: StoreManager
              captures: { pk: $.data.id, pk_v: $.data.version }
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/billing-cycles"
              payload: { expected_package_version: "${pk_v}", grooming_visits_consumed: 2, vet_visits_consumed: 0, vaccine_visits_consumed: 0 }
              as: StoreManager
              captures: { pk_v2: $.data.version }
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/pause"
              payload: { expected_package_version: "${pk_v2}" }
              as: StoreManager
              captures: { pk_v3: $.data.version }
          trigger:
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/cancel"
              payload: { expected_package_version: "${pk_v3}" }
              as: StoreManager
          assert:
            - "ServicePackage.${pk}.status == CANCELLED in the same response"
            - "Member.${m}.outstanding_balance_cents == 5000.00, being the 10000.00 package total minus the 5000.00 billed cycle, with no reduction from the cycle that was voided"
            - "GET /stores/billing-cycles?package_id=${pk} reports one BILLED cycle and the remaining cycles VOID"

      - name: certificate_issuance_reports_the_provisional_expiry_before_the_final_read
        claim_type: eventual
        grounds:
          - calculations.pet_rabies_expiry_reconciliation
          - calculations.pet_rabies_expiry_reconciliation.variants
          - state_machines.VaccinationVisit.REGISTERED_to_CERTIFICATE_ISSUED
        distinguishing_aspect: "The issuance response carries the provisional expiry for the certificate just issued, while the pet read performs the finalized reconciliation; the two agree only until a clinic freeze invalidates the certificate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-22T09:00:00Z, a Tuesday."
            - "Store ST-1802 in TX; member Mira; pet Yarrow; an open TX clinic in the 09:00–17:00 window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1802", city: "Abilene", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Mira Solano", email: "mira@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Yarrow", species: "CANINE", breed: "Collie", weight_kg: 21.0 }
              as: GroomingStaff
              captures: { pet: $.data.id }
            - call: "POST /stores/${s}/vaccination-clinics"
              payload: { clinic_date: "2026-09-22T00:00:00Z", open_time: "2026-09-22T09:00:00Z", close_time: "2026-09-22T17:00:00Z" }
              as: VaccinationStaff
              captures: { cl: $.data.id, cl_v: $.data.version }
            - call: "POST /stores/${s}/vaccination-clinics/${cl}/open-walk-ins"
              payload: { expected_clinic_version: "${cl_v}" }
              as: VaccinationStaff
            - call: "POST /stores/${s}/vaccination-visits"
              payload: { clinic_id: "${cl}", pet_id: "${pet}", vaccine_type: "RABIES" }
              as: VaccinationStaff
              captures: { vs: $.data.id, vs_v: $.data.version }
          trigger:
            - call: "POST /stores/${s}/vaccination-visits/${vs}/issue-certificate"
              payload: { expected_visit_version: "${vs_v}" }
              as: VaccinationStaff
          assert:
            - "VaccinationVisit.${vs}.new_effective_days == 365 because Texas is a one-year state, and certificate_expires_at == 2027-09-22T09:00:00Z"
            - "GET /stores/pets/${pet} reports the same 2027-09-22T09:00:00Z, so the provisional and finalized variants agree while the certificate is effective"
            - "GET /stores/vaccination-visits/${vs}/rabies-certificate returns one certificate with is_effective == true and effective_days == 365"
