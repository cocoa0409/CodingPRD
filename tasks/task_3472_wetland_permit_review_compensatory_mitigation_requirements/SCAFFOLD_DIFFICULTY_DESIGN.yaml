  - rule_id: compensating_invariant
    instances:
      - name: bank_credit_inventory_conservation
        grounds:
          - calculations.bank_credit_inventory
          - entities.MitigationBank.fields.available_credits_by_type
          - state_machines.CreditTransaction.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = credit inventory per (bank, resource_type): for every step,
          credit_capacity == available + reserved + purchased. The forward action
          (reserve 4.0) and its compensating action (release) return available to exactly
          10.0; the invariant is checked after every hop, not just at the ends.
        test_recipe:
          setup:
            - "Plan APPROVED; OPERATIONAL in-basin bank with capacity FORESTED_WETLAND 10"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 1.0 } ], project_purpose: "Outfall relocation", estimated_cost_dollars: 300000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 1 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Shenandoah Mitigation Bank", sponsor_name: "Shenandoah Conservancy", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 10 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 4.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn1: "$.data.id" } }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { avail_a: "$.data.available_credits_by_type", res_a: "$.data.credits_reserved_by_type", pur_a: "$.data.credits_purchased_by_type" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn1}/release", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { avail_b: "$.data.available_credits_by_type", res_b: "$.data.credits_reserved_by_type", pur_b: "$.data.credits_purchased_by_type" } }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 4.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn2: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn2}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { avail_c: "$.data.available_credits_by_type", res_c: "$.data.credits_reserved_by_type", pur_c: "$.data.credits_purchased_by_type" } }
          assert:
            - "after reserve: avail_a == {FORESTED_WETLAND: 6.0}, res_a == {FORESTED_WETLAND: 4.0}, pur_a == {FORESTED_WETLAND: 0.0} (10 == 6+4+0)"
            - "after release (the compensating action): avail_b == {FORESTED_WETLAND: 10.0}, res_b == {FORESTED_WETLAND: 0.0} — available fully restored, no drift"
            - "after reserve+purchase: avail_c == {FORESTED_WETLAND: 6.0}, res_c == {FORESTED_WETLAND: 0.0}, pur_c == {FORESTED_WETLAND: 4.0} (10 == 6+0+4)"

      - name: bank_revenue_conservation_across_purchase_refund
        grounds:
          - calculations.bank_credit_inventory
          - entities.MitigationBank.fields.revenue_dollars
          - state_machines.CreditTransaction.PURCHASED_to_REFUNDED
          - state_machines.PermitApplication.DECISION_PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = bank revenue in dollars (a different quantity type than
          credit counts): purchase raises revenue_dollars to 60000.00; the compensating
          cascade on application withdraw (PURCHASED -> REFUNDED) returns it to exactly
          0.00. A cascade that left residual revenue would fail the invariant.
        test_recipe:
          setup:
            - "Application at DECISION_PENDING (pir FAVORABLE); BANK_CREDITS plan APPROVED; 2.0 credits PURCHASED at unit price 30000.00 from an in-basin bank"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/publish-notice", payload: { comment_period_days: 30 }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/applications/${app_id}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Shenandoah Mitigation Bank", sponsor_name: "Shenandoah Conservancy", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 20 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 2.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn_id: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn_id}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { total: "$.data.total_price_dollars" } }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { rev_before: "$.data.revenue_dollars" } }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_id}/withdraw", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { app_status: "$.data.status" } }
            - { call: "GET /wetland-permits/credit-transactions/${txn_id}", as: Reviewer, as_user_id: "rev-1", captures: { txn_status: "$.data.status" } }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { rev_after: "$.data.revenue_dollars", avail_after: "$.data.available_credits_by_type" } }
            - { call: "GET /wetland-permits/mitigation-plans/${plan_id}", as: Reviewer, as_user_id: "rev-1", captures: { plan_status: "$.data.status" } }
          assert:
            - "total == 60000.00 and rev_before == 60000.00 (2.0 credits at tier-1.0 unit price 30000.00)"
            - "app_status == WITHDRAWN"
            - "txn_status == REFUNDED (the withdraw cascade, not a client release)"
            - "rev_after == 0.00 — the purchase-then-refund pair leaves the conserved dollar quantity unchanged"
            - "avail_after == {FORESTED_WETLAND: 20.0} and plan_status == CANCELLED"
