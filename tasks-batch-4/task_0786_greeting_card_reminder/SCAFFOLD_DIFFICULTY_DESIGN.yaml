        test_recipe:
          setup:
            - "PRO account, VERIFIED contact, submitted+approved order, artist capacity 5 (count 0)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "i2@x.com", display_name: "I2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Ic2", address_line1: "1 I", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CI2", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "PenI", daily_capacity: 5, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }
              as: StudioOperator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "HandwritingArtist.${artist_id}.reserved_assignment_count == 0"
            - "ArtistAssignment.${asg_id}.status == RELEASED"
