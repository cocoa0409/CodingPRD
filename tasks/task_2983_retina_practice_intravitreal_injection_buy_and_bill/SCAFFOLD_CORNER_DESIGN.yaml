            - "InjectionEncounter.${k_fresh_enc_id}.prior_authorization_id == null (the no-PA payer needs none)"
            - "Vial.${k_fresh_enc_vial}.status == RESERVED with reserved_at == \"2026-08-01T00:00:00Z\""

      - name: corner_documenting_an_already_documented_encounter_is_rejected
