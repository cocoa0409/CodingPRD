          setup:
            - "Model GX50-T is UNCERTIFIED and DRAFT: no efficiency test and no certification exist for it."
            - "Tank lot TL-001 is RELEASED and both component lots are RELEASED from QUALIFIED suppliers."
            - "Unit u1 has just been staged, so build_status is COMPONENTS_STAGED."
            - "Labelling therefore violates the priority-8 state rule and the priority-12 certification rule at once."
