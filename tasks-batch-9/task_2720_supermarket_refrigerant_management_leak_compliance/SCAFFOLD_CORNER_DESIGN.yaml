      - name: offset_pagination_and_status_filtering_stay_coherent_across_an_inserted_row
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET_/leak-events.input
        distinguishing_aspect: "Cursor-free offset paging is only safe if the collation is total and append-only inserts sort last: five events are paged two at a time, a sixth is inserted between page reads, and the second page must still show events three and four (never a duplicate or a skipped row) while total_count moves 5 to 6 and has_more flips accordingly. The status filter is applied before the window, so filtering to OPEN and paging must agree with the unfiltered walk."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, six empty 60 lb systems created in a fixed order. Five leak events are declared in system order (created_at all equal, so the id tiebreak in the ORDER BY is what makes the walk deterministic)."
