      - name: energy_test_start_rejected_while_case_model_still_modeled
        claim_type: guarded_transitions
        grounds:
          - state_machines.EnergyTest.transitions.SCHEDULED_to_RUNNING
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "SCHEDULED -> RUNNING is guarded by the OTHER entity's state (CaseModel.status == SUBMITTED_FOR_TEST): scheduling is legal against a MODELED model but starting is not, so the guard is enforced at start time with 409, not at creation."
        test_recipe:
          setup:
            - "R-448A, standard DOE-2027-RSC-MT and chamber CH-1 exist."
            - "MDL-MT-8 has run the airflow model (status MODELED, version 2) but was never submitted for test."
            - "An EnergyTest was scheduled against it and is SCHEDULED with pinned_design_revision 1."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
          trigger:
            - { call: "POST /energy-tests/${et_id}/start", as: TestLabTechnician, as_user_id: "lab-001", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /energy-tests/${et_id}", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
          assert:
            - "First call: HTTP 409, data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "First call: the error is NOT ERR_CASE_MODEL_REVISION_STALE — pinned_design_revision 1 still matches CaseModel.design_revision 1"
            - "Second call: data.status == \"SCHEDULED\" and data.version == 1"

      - name: engineering_change_cascade_down_to_work_orders
        claim_type: cascade_down
        grounds:
          - state_machines.CaseModel.transitions.CERTIFIED_to_DRAFT
          - state_machines.StorePlan.transitions.APPROVED_to_HOLD_PENDING_RECERT
          - state_machines.WorkOrder.transitions.QUEUED_to_HELD
        excluded_because:
          difficulty_instance: transitive_cascade / engineering_change_five_hop_design_to_work_order_cascade
          rationale: "The named §1.8 instance asserts every hop of the design -> label -> line -> plan -> work-order cascade in one recipe, including the deliberate non-cascade to SCHEDULED energy tests."

      - name: shipment_cancel_compensating_release_of_crew_commitment
        claim_type: compensation
        grounds:
          - state_machines.Shipment.transitions.STAGED_to_CANCELLED
          - state_machines.InstallBooking.transitions.BOOKED_to_RELEASED
          - entities.InstallCrew.fields.committed_case_days
        excluded_because:
          difficulty_instance: transitive_cascade / shipment_cancel_five_hop_logistics_to_crew_cascade
          rationale: "The named §1.8 instance asserts all five compensating hops of the cancel cascade down to InstallCrew.committed_case_days."

  # ==========================================================================
  # SECTION 3 — CALCULATIONS (claim-extraction-guide Table 3)
  # ==========================================================================
  - section: calculations
    instances:

      - name: energy_limit_daily_kwh_pins_standard_coefficients_at_scheduling
        claim_type: constants_applied
        grounds:
          - calculations.energy_limit_daily_kwh
          - entities.EnergyTest.fields.limit_daily_kwh
          - entities.EnergyTest.fields.pinned_tda_sqft
        distinguishing_aspect: "limit_daily_kwh applies the standard's own coefficients to the model's TDA at scheduling time: 0.62 * 26.4 + 1.20 = 17.568, rounded to 3 decimals, and the inputs are copied into pinned_tda_sqft 26.4 and pinned_defrost_cycles_per_day 4."
        test_recipe:
          setup:
            - "R-448A, standard DOE-2027-RSC-MT (limit_coefficient_a 0.62, limit_constant_b 1.20) and chamber CH-1 exist."
            - "MDL-MT-8 with tda_sqft 26.4 and defrost_cycles_per_day 4 is SUBMITTED_FOR_TEST."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
          trigger:
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.limit_daily_kwh == 17.568"
            - "data.pinned_tda_sqft == 26.4"
            - "data.pinned_defrost_cycles_per_day == 4"
            - "data.pinned_design_revision == 1"
            - "data.status == \"SCHEDULED\""
            - "data.measured_kwh_24h is null and data.lab_rated_index is null"

      - name: airflow_curtain_factor_clamped_at_minimum_for_six_layers
        claim_type: precision
        grounds:
          - calculations.airflow_load_model
          - entities.CaseModel.fields.curtain_factor
          - entities.CaseModel.fields.total_design_load_w
        distinguishing_aspect: "With curtain_layers 6 the linear term 1 - 0.12 * 5 = 0.40 falls below MIN_CURTAIN_FACTOR, so curtain_factor is clamped to exactly 0.55 and infiltration_load_w lands on 159.69 rather than the unclamped 116.14."
        test_recipe:
          setup:
            - "R-448A exists."
            - "MDL-MT-8C is identical to the reference MT case except curtain_layers is 6."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8C", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 6, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "HTTP 200"
            - "data.curtain_factor == 0.55"
            - "data.infiltration_load_w == 159.69"
            - "data.lighting_load_w == 96.00"
            - "data.fan_load_w == 76.00"
            - "data.defrost_load_w == 15.40"
            - "data.anti_sweat_load_w == 0.00"
            - "data.total_design_load_w == 347.09"
            - "data.status == \"MODELED\""

      - name: chamber_occupation_ignores_completed_tests
        claim_type: input_set_filtering
        grounds:
          - calculations.chamber_occupation_interval
          - validations[priority=24]
          - entities.EnergyTest.fields.status
        distinguishing_aspect: "The occupancy set is filtered to EnergyTest.status IN {SCHEDULED, RUNNING}: a second test whose window sits fully inside the first test's window plus buffer is accepted with 201 because the first test is COMPLETED_PASS, whereas the identical window would be rejected while it was SCHEDULED."
        test_recipe:
          setup:
            - "R-448A, standard DOE-2027-RSC-MT and chamber CH-1 (turnaround_hours 12) exist."
            - "MDL-MT-8 ran a test on CH-1 over 2026-08-03T08:00Z..2026-08-04T08:00Z measuring 15.0 kWh/24h, so that test is COMPLETED_PASS and the model is TESTED_PASS at version 4."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v1: "$.data.version" } }
