        excluded_because:
          difficulty_instance: half_open_interval_boundary / reviewer_half_open_window_aggregate_capacity_and_adjacency
          rationale: "That §1.8 instance already fills the reviewer's window capacity and pins both the rejected overlap and the accepted adjacent window."

      - name: typeset_slot_buffer_conflict
        claim_type: violation_to_error
        grounds:
