scaffold_corner_design:

  # =====================================================================================
  # Entities — creation, required-field, not-found, computed/system fields
  # =====================================================================================
  - section: entities
    instances:
      - name: create_artist_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Artist, endpoints]
        distinguishing_aspect: "POST /artists with all required fields -> 201; status defaults ACTIVE, can_assist defaults false, portfolio_published false, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "A", skill_tier: "SENIOR", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Coordinator
              captures: { a_id: $.data.id }
          assert:
            - "Artist.${a_id}.status == ACTIVE"
            - "Artist.${a_id}.can_assist == false"
            - "Artist.${a_id}.portfolio_published == false"
            - "Artist.${a_id}.version == 1"

      - name: create_artist_missing_skill_tier_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Artist.fields.skill_tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required skill_tier on POST /artists -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "A", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_artist_bad_skill_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Artist.fields.skill_tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "skill_tier outside {LEAD,SENIOR,JUNIOR} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "A", skill_tier: "PRINCIPAL", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_artist_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Artist, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /artists/{random uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bridal-beauty/artists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: list_artists_paginated_envelope
        claim_type: Listing
        grounds: [entities.Artist, endpoints]
        distinguishing_aspect: "GET /artists returns array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["one artist exists"]
          setup_api_calls:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "A", skill_tier: "LEAD", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Coordinator
          trigger:
            - call: "GET /bridal-beauty/artists?limit=10&offset=0"
              payload: {}
              as: Coordinator
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

      - name: event_party_size_computed_from_faces
        claim_type: Computed Fields
        grounds: [entities.BridalEvent.fields.party_size, entities.BookingFace]
        distinguishing_aspect: "party_size is computed from face count; adding two PENDING faces sets party_size 2, removing one sets it 1."
        test_recipe:
          setup: ["event with two PENDING faces"]
          setup_api_calls:
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-7", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 5, trial_required: false }
              as: Client
              as_user_id: "client-7"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "BOTH", is_bride: true }
              as: Client
              as_user_id: "client-7"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BM1", service_type: "HAIR" }
              as: Client
              as_user_id: "client-7"
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /bridal-beauty/faces/${f2}/remove"
              payload: {}
              as: Client
              as_user_id: "client-7"
          assert:
            - "BridalEvent.${e_id}.party_size == 1"

      - name: artist_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Artist.fields.status, entities.Artist.fields.portfolio_published]
        distinguishing_aspect: "Client-supplied status/portfolio_published in create body are ignored; server forces ACTIVE/false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "A", skill_tier: "JUNIOR", hair_rate_per_face_cents: 5000, makeup_rate_per_face_cents: 6000, travel_rate_per_km_cents: 200, max_faces_per_hour: 5 }
              as: Coordinator
              captures: { a_id: $.data.id }
          assert:
            - "Artist.${a_id}.status == ACTIVE"

  # =====================================================================================
  # State machines — invalid-from, terminal lockdown, idempotency
  # =====================================================================================
  - section: state_machines
    instances:
      - name: quote_from_contracted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BridalEvent.DRAFT_to_QUOTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /events/{id}/quote on a CONTRACTED event has no defined transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["contracted event (1 bride HAIR face, L1, deposit unpaid)"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/faces/${f1}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: request_revision_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BridalEvent.QUOTED_to_REVISION_REQUESTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "request-revision is only defined from QUOTED; from DRAFT it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["event in DRAFT (never quoted)"]
          setup_api_calls:
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/request-revision"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_from_completed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.BridalEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal COMPLETED, cancel has no transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["fully completed event (1 face, deposit+balance paid, assignment completed)"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T20:00:00Z", ready_by_utc: "2026-07-15T20:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/faces/${f1}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/invoices?event_id=${e_id}"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /bridal-beauty/invoices/${inv_id}/payments"
              payload: { applies_to: "DEPOSIT", amount_cents: 9000 }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/events/${e_id}"
              payload: {}
              as: Coordinator
              captures: { e_v2: $.data.version }
            - call: "POST /bridal-beauty/assignments"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", window_start_utc: "2026-07-15T08:00:00Z", window_end_utc: "2026-07-15T10:00:00Z", expected_event_version: "${e_v2}" }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/assignments/${a_id}/start"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
            - call: "POST /bridal-beauty/assignments/${a_id}/complete"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
            - call: "POST /bridal-beauty/invoices/${inv_id}/payments"
              payload: { applies_to: "BALANCE", amount_cents: 27000 }
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/complete"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/cancel"
              payload: { reason: "CLIENT_CHOICE" }
              as: Client
              as_user_id: "client-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: trial_complete_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.TrialSession.BOOKED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED trial a second time -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["trial BOOKED then COMPLETED"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: true }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/trials"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T10:00:00Z", trial_fee_cents: 5000 }
              as: Coordinator
              captures: { t_id: $.data.id }
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/trials/${t_id}/complete"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
          trigger:
            - call: "POST /bridal-beauty/trials/${t_id}/complete"
              payload: {}
              as: Artist
              as_user_id: "${l1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: new_event_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.BridalEvent, entities.BridalEvent.fields.status]
        distinguishing_aspect: "A newly created BridalEvent has status DRAFT, quote_revision 0, estimated_total_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
          assert:
            - "BridalEvent.${e_id}.status == DRAFT"
            - "BridalEvent.${e_id}.quote_revision == 0"
            - "BridalEvent.${e_id}.estimated_total_cents == 0"

      - name: quote_with_no_lead_artist_returns_no_lead
        claim_type: Precondition Enforcement
        grounds: [calculations.quote_total, "errors[ERR_NO_LEAD_ARTIST]"]
        distinguishing_aspect: "Quoting when the roster has no ACTIVE LEAD artist -> ERR_NO_LEAD_ARTIST (409) (empty selector fallback)."
        test_recipe:
          setup: ["event with one CONFIRMED face but only a SENIOR artist on roster (no LEAD)"]
          setup_api_calls:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "S", skill_tier: "SENIOR", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Coordinator
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/faces/${f1}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_LEAD_ARTIST"

  # =====================================================================================
  # Calculations — addon pricing, extended-stay side effect, weather override
  # =====================================================================================
  - section: calculations
    instances:
      - name: extended_stay_addon_extends_window_and_bills_flat
        claim_type: Correct Result
        grounds: [calculations.addon_pricing, entities.AddOn.fields.amount_cents, entities.ServiceAssignment.fields.extended_until_utc]
        distinguishing_aspect: "EXTENDED_STAY qty 1 bills flat 8000 and sets extended_until_utc to window_end + 30 min (2026-07-15T10:30:00Z)."
        test_recipe:
          setup: ["contracted event deposit paid, assignment [08:00,10:00), ready_by 12:00"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/faces/${f1}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
              captures: { e_v: $.data.version }
            - call: "POST /bridal-beauty/contracts"
              payload: { event_id: "${e_id}", lead_artist_id: "${l1_id}", expected_event_version: "${e_v}" }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/invoices?event_id=${e_id}"
              payload: {}
              as: Client
              as_user_id: "client-1"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /bridal-beauty/invoices/${inv_id}/payments"
              payload: { applies_to: "DEPOSIT", amount_cents: 9000 }
              as: Client
              as_user_id: "client-1"
            - call: "GET /bridal-beauty/events/${e_id}"
              payload: {}
              as: Coordinator
              captures: { e_v2: $.data.version }
            - call: "POST /bridal-beauty/assignments"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", window_start_utc: "2026-07-15T08:00:00Z", window_end_utc: "2026-07-15T10:00:00Z", expected_event_version: "${e_v2}" }
              as: Coordinator
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /bridal-beauty/assignments/${a_id}/addons"
              payload: { addon_type: "EXTENDED_STAY", quantity: 1 }
              as: Coordinator
              captures: { addon_id: $.data.id, amt: $.data.amount_cents }
          assert:
            - "AddOn.${addon_id}.amount_cents == 8000"
            - "ServiceAssignment.${a_id}.extended_until_utc == 2026-07-15T10:30:00Z"

      - name: extended_stay_past_deadline_rejected
        claim_type: Conditional action
        grounds: ["validations[priority=17]", "errors[ERR_EXTENSION_PAST_DEADLINE]"]
        distinguishing_aspect: "EXTENDED_STAY qty 1 on a window ending exactly at ready_by_utc (09:00) would push extended_until_utc to 09:30 > ready_by -> ERR_EXTENSION_PAST_DEADLINE (422)."
        test_recipe:
          setup: ["contracted event deposit paid, ready_by 09:00, assignment [08:00,09:00)"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T20:00:00Z", ready_by_utc: "2026-07-15T09:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
