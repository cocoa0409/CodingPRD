              captures: { v12: $.data.version }
            - call: "POST /distributions/${dist_paid_id}/pay"
              payload: { receipt_reference: "R1", expected_estate_version: "${v12}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
          trigger:
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v13: $.data.version }
            - call: "POST /distributions/${dist_target_id}/pay"
