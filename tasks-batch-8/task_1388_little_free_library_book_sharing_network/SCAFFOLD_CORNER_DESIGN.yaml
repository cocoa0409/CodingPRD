# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Little Free Library & Book Sharing Network
# Sections and claim_type values follow the claim-extraction-guide taxonomy.
# Instances marked with excluded_because are already exercised by §1.8 and
# intentionally carry no test_recipe. All clock-dependent setups pin the
# logical clock explicitly (server default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: steward_create_applies_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: ["entities.Steward"]
        distinguishing_aspect: "A registered steward starts in APPLIED with all computed counters at 0 / tier NONE, and system fields (id, created_at, updated_at, version == 1) are server-minted."
        test_recipe:
          setup: ["Empty database; clock pinned"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/stewards", payload: { full_name: "New Steward", email: "new@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
          assert:
            - "Response 201; Steward.${stw}.status == APPLIED"
            - "training_level == 0, lifetime_points == 0, rolling_points == 0, recognition_tier == NONE, strike_count == 0"
            - "version == 1; created_at == 2026-08-01T00:00:00Z; id is a bare UUID"

      - name: steward_create_rejected_missing_required_email
        claim_type: required_fields
        grounds: ["entities.Steward.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field email is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/stewards", payload: { full_name: "No Email", region_code: "OR" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_INVALID_REQUEST (captured ${err}), HTTP 400"

      - name: steward_create_rejected_duplicate_email
        claim_type: type_constraints
        grounds: ["entities.Steward.fields.email", "errors[ERR_EMAIL_TAKEN]", "validations[priority=9]"]
        distinguishing_aspect: "Email uniqueness holds across all stewards regardless of status: a second registration with the same email fails with ERR_EMAIL_TAKEN."
        test_recipe:
          setup: ["One steward with email dup@example.org exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "First", email: "dup@example.org", region_code: "OR" }, as: Anonymous }
          trigger:
            - { call: "POST /library-network/stewards", payload: { full_name: "Second", email: "dup@example.org", region_code: "WA" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_EMAIL_TAKEN (captured ${err}), HTTP 422"

      - name: steward_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.Steward"]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 stewards, limit 2 -> 2 items with has_more true; offset 2 -> 1 item with has_more false."
        test_recipe:
          setup: ["Three stewards registered"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "P One", email: "p1@example.org", region_code: "OR" }, as: Anonymous }
            - { call: "POST /library-network/stewards", payload: { full_name: "P Two", email: "p2@example.org", region_code: "OR" }, as: Anonymous }
            - { call: "POST /library-network/stewards", payload: { full_name: "P Three", email: "p3@example.org", region_code: "WA" }, as: Anonymous }
          trigger:
            - { call: "GET /library-network/stewards?limit=2", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/stewards?limit=2&offset=2", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "First page: 2 items, total_count == 3, has_more == true"
            - "Second page: 1 item, total_count == 3, has_more == false"

      - name: box_create_rejected_out_of_range_coordinates
        claim_type: type_constraints
        grounds: ["entities.LibraryBox.fields.latitude", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "latitude 95 exceeds the [-90, 90] range and is rejected with ERR_INVALID_REQUEST before any state or constraint check."
        test_recipe:
          setup: ["ACTIVE steward exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Coord Tester", email: "coord@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Bad Coord Box", latitude: 95.0, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_INVALID_REQUEST (captured ${err}), HTTP 400"

      - name: record_entities_carry_no_version_field
        claim_type: immutability
        grounds: ["entities.TrainingCompletion", "entities.InspectionRecord", "entities.RecognitionEvent"]
        distinguishing_aspect: "common_fields: false entities (TrainingCompletion, InspectionRecord, RecognitionEvent) expose id and created_at but no version or updated_at on reads."
        test_recipe:
          setup: ["One steward with a PASSED ORIENTATION completion"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Record Keeper", email: "rk@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}", captures: { comp: "$.data.id" } }
          trigger:
            - { call: "GET /library-network/training-completions/${comp}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/stewards/${stw}/recognition-events", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "TrainingCompletion.${comp} response contains id, created_at, steward_id, module_id, score, result — and no version or updated_at key"
            - "The recognition-events list holds exactly one TRAINING_PASSED event with points_delta == 25 and no version key"

      - name: recognition_event_polymorphic_source_reference
        claim_type: parent_relationships
        grounds: ["entities.RecognitionEvent.fields.source_type", "entities.RecognitionEvent.fields.source_id"]
        distinguishing_aspect: "RecognitionEvent.source_id resolves through the polymorphic source_type (TRAINING_COMPLETION for training, MAINTENANCE_REQUEST for repairs) rather than a fixed FK."
        test_recipe:
          setup: ["One steward with a PASSED ORIENTATION completion"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Poly Morph", email: "poly@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}", captures: { comp: "$.data.id" } }
          trigger:
            - { call: "GET /library-network/stewards/${stw}/recognition-events", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "The single TRAINING_PASSED event has source_type == TRAINING_COMPLETION and source_id == ${comp}"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: steward_activation_rejected_without_orientation
        claim_type: precondition_enforcement
        grounds: ["state_machines.Steward.APPLIED_to_ACTIVE", "errors[ERR_ORIENTATION_REQUIRED]"]
        distinguishing_aspect: "Activating an APPLIED steward with no PASSED ORIENTATION completion fails with ERR_ORIENTATION_REQUIRED (cross-entity gate on TrainingCompletion)."
        test_recipe:
          setup: ["Steward registered, ORIENTATION module exists, no completions"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Untrained", email: "untrained@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_ORIENTATION_REQUIRED (captured ${err}), HTTP 409; steward remains APPLIED"

      - name: steward_retire_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Steward"]
        distinguishing_aspect: "RETIRED is terminal: a suspend attempt on a retired steward fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE steward retired via POST /retire"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Retiring", email: "ret@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards/${stw}/retire", payload: {}, as: Steward, as_user_id: "${stw}" }
          trigger:
            - { call: "POST /library-network/stewards/${stw}/suspend", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_INVALID_STATE (captured ${err}); steward stays RETIRED"

      - name: box_charter_mints_sequential_charter_numbers
        claim_type: side_effect_execution
        grounds: ["state_machines.LibraryBox.DRAFT_to_CHARTERED", "entities.LibraryBox.fields.charter_number"]
        distinguishing_aspect: "Chartering mints charter_number as 'CH-' + zero-padded 6-digit sequence of previously chartered boxes + 1: the first two charters are exactly CH-000001 and CH-000002."
        test_recipe:
          setup: ["Two ACTIVE stewards, each with one DRAFT box"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Charter One", email: "c1@example.org", region_code: "OR" }, as: Anonymous, captures: { stw1: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw1}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw1}" }
            - { call: "POST /library-network/stewards/${stw1}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Charter Two", email: "c2@example.org", region_code: "OR" }, as: Anonymous, captures: { stw2: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw2}/training-completions", payload: { module_id: "${mod_ori}", score: 88 }, as: Steward, as_user_id: "${stw2}" }
            - { call: "POST /library-network/stewards/${stw2}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw1}", name: "First Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw1}", captures: { box1: "$.data.id" } }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw2}", name: "Second Box", latitude: 45.53, longitude: -122.69, capacity_books: 8, region_code: "OR" }, as: Steward, as_user_id: "${stw2}", captures: { box2: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/boxes/${box1}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { cn1: "$.data.charter_number" } }
            - { call: "POST /library-network/boxes/${box2}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { cn2: "$.data.charter_number" } }
          assert:
            - "First charter_number == CH-000001 (captured ${cn1})"
            - "Second charter_number == CH-000002 (captured ${cn2})"

      - name: box_activation_rejected_without_inspection
        claim_type: precondition_enforcement
        grounds: ["state_machines.LibraryBox.CHARTERED_to_ACTIVE", "errors[ERR_INSPECTION_REQUIRED]"]
        distinguishing_aspect: "CHARTERED -> ACTIVE without any CONFIRMED InspectionRecord fails with ERR_INSPECTION_REQUIRED (cross-entity gate on InspectionRecord)."
        test_recipe:
          setup: ["CHARTERED box, no inspections"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "No Inspect", email: "noinsp@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Uninspected Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_INSPECTION_REQUIRED (captured ${err}), HTTP 409; box stays CHARTERED and listing_posture stays UNLISTED"

      - name: box_reactivation_requires_post_suspension_inspection
        claim_type: precondition_enforcement
        grounds: ["state_machines.LibraryBox.SUSPENDED_to_ACTIVE", "errors[ERR_INSPECTION_REQUIRED]"]
        distinguishing_aspect: "Reactivation requires a CONFIRMED inspection created strictly after suspended_at: the pre-suspension inspection does not qualify; after a fresh CONFIRMED inspection the reactivation succeeds and the posture recomputes to LISTED."
        test_recipe:
          setup: ["Box activated at 2026-08-01T00:00:00Z; clock advanced to 2027-01-28T00:00:00Z (180 days); sweep suspends the box"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Stale Box Owner", email: "stale@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Dusty Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-28T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: Steward, as_user_id: "${stw}", captures: { err: "$.data.error_id" } }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: Steward, as_user_id: "${stw}" }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "First reactivation rejected with error_id == ERR_INSPECTION_REQUIRED (captured ${err}) — the 2026-08-01 inspection predates suspended_at"
            - "After a fresh CONFIRMED inspection the reactivation succeeds: charter_status == ACTIVE, listing_posture == LISTED, days_since_activity == 0"

      - name: complaint_window_expiry_via_sweep_boundary
        claim_type: automatic_transition
        grounds: ["state_machines.Complaint.STEWARD_RESPONSE_PENDING_to_UNDER_REVIEW", "entities.Complaint.fields.response_due_at"]
        distinguishing_aspect: "The 72h steward response window expires at now >= response_due_at (inclusive boundary): a sweep exactly at the deadline moves the complaint to UNDER_REVIEW with response_text still null."
        test_recipe:
          setup: ["ACTIVE LISTED box; complaint filed and triaged at 2026-08-01T00:00:00Z (response_due_at == 2026-08-04T00:00:00Z); clock advanced to exactly the deadline"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Slow Responder", email: "slow@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Ash Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/complaints", payload: { box_id: "${box}", category: "OTHER", description: "Odd smell" }, as: Anonymous, captures: { cmp: "$.data.id" } }
            - { call: "POST /library-network/complaints/${cmp}/triage", payload: {}, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { expired: "$.data.expired_response_count" } }
            - { call: "GET /library-network/complaints/${cmp}", payload: {}, as: Moderator, as_user_id: "mod-1" }
          assert:
            - "sweep expired_response_count == 1 (captured ${expired}) at exactly response_due_at — the expiry boundary is inclusive"
