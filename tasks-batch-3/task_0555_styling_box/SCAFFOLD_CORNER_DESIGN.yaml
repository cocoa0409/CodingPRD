  # ------------------------------------------------------------------ Endpoints
  - section: endpoints
    instances:
      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /clients/{id}/fixes returns response_type array with pagination fields limit/offset/total_count/has_more in meta or envelope."
        test_recipe:
          setup: ["CA client ACTIVE with one REQUESTED fix."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "GET /clients/${c}/fixes", payload: {}, as: OpsAdmin }
          assert:
            - "HTTP 200; response_type == array; pagination fields total_count==1 and has_more==false present"

      - name: direct_buy_sells_inventory
        claim_type: Action endpoint
        grounds: [state_machines.Purchase, calculations.inventory_counts, entities.Purchase.fields.total_cents]
        distinguishing_aspect: "Direct-buy quantity 2 of a total_stock=5 product sets Purchase.status=PLACED, total_cents=6000, and Product available_count 5->3, sold_count 0->2."
        test_recipe:
          setup: ["CA client ACTIVE; product price 3000, total_stock 5."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /clients/${c}/purchases", payload: { product_id: "${p1}", quantity: 2 }, as: Client, as_user_id: "${c}", captures: { pu: $.data.id } }
          assert:
            - "HTTP 201; Purchase.${pu}.status == PLACED, total_cents == 6000; Product.${p1}.available_count == 3, sold_count == 2"

      - name: purchase_cancel_restocks_inventory
        claim_type: Action endpoint
        grounds: [state_machines.Purchase.PLACED_to_CANCELLED, calculations.inventory_counts]
        distinguishing_aspect: "Cancelling a PLACED purchase of quantity 2 compensates inventory: Product sold_count 2->0, available_count 3->5."
        test_recipe:
          setup: ["CA client ACTIVE with a PLACED purchase of quantity 2 (product total_stock 5)."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "POST /clients/${c}/purchases", payload: { product_id: "${p1}", quantity: 2 }, as: Client, as_user_id: "${c}", captures: { pu: $.data.id } }
          trigger:
            - { call: "POST /purchases/${pu}/cancel", payload: {}, as: Client, as_user_id: "${c}" }
          assert:
            - "Purchase.${pu}.status == CANCELLED; Product.${p1}.available_count == 5, sold_count == 0"

      - name: product_restock_adds_stock
        claim_type: Action endpoint
        grounds: [endpoints, entities.Product.fields.total_stock, calculations.inventory_counts]
        distinguishing_aspect: "POST /products/{id}/restock add_quantity=3 on a total_stock=5 product yields total_stock 8, available_count 8 (invariant preserved)."
        test_recipe:
          setup: ["Product total_stock 5, all available."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /products/${p1}/restock", payload: { add_quantity: 3 }, as: OpsAdmin }
          assert:
            - "Product.${p1}.total_stock == 8, available_count == 8, reserved_count == 0, sold_count == 0"

      - name: pause_cancels_requested_fix_and_restocks
        claim_type: Conditional cascade
        grounds: [state_machines.Client.ACTIVE_to_PAUSED, state_machines.Fix.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Pausing a client cancels its REQUESTED fix (no items) — the fix moves to CANCELLED and the client to PAUSED."
        test_recipe:
          setup: ["CA client ACTIVE with a REQUESTED fix (unassigned, no items)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
          trigger:
            - { call: "POST /clients/${c}/pause", payload: {}, as: Client, as_user_id: "${c}" }
          assert:
            - "Client.${c}.status == PAUSED; Fix.${fix}.status == CANCELLED"

