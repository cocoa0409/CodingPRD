            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD", fraud_credit_cents: 30000 }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
