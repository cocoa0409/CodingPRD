  - rule_id: resource_temporal_overlap
    instances:
      - name: writer_seat_intervals_are_half_open_so_adjacency_is_allowed_and_one_day_overlap_is_not
        grounds:
          - validations.priority_65_business_constraint
          - errors.ERR_WRITER_WINDOW_CONFLICT
          - entities.RoomSeat.fields.exclusivity
          - entities.RoomSeat.fields.start_date
          - entities.RoomSeat.fields.end_date
          - entities.AvailabilityWindow.fields.commitment_type
          - endpoints.POST_/rooms/{room_id}/seats
        distinguishing_aspect: |
          The shared resource is the writer's calendar and the intervals are HALF-OPEN, so the test walks
          the exact seam: a second EXCLUSIVE seat starting 2026-09-14 (one day before the first seat's
          end) conflicts, while a second seat starting exactly on 2026-09-15 - the first seat's end_date -
          does NOT, because [09-01, 09-15) and [09-15, 09-29) touch without overlapping. A third attempt
          then collides with the merely OFFERED second seat, proving the occupancy set is
          {OFFERED, CONFIRMED} and not only CONFIRMED. Any closed-interval implementation rejects the
          adjacent seat and passes the one-day overlap.
        test_recipe:
          setup:
            - "Agreement AG, season SE (staffing window 2026-08-01..2026-09-30, staffing_budget_weekly_cents 5000000)."
            - "Room RM (IN_PERSON, seat_capacity 3) in STAFFING."
            - "W1 (STORY_EDITOR) holds AW1 (EXCLUSIVE, 2026-08-15..2027-06-01) and AW2 (NON_EXCLUSIVE, 2026-08-16..2027-06-01)."
            - "Seat S1 = [2026-09-01, 2026-09-15) EXCLUSIVE at 600000 is offered and accepted, consuming AW1 and leaving AW2 OPEN."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w1: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw1: "$.data.id" }
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-16T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw2: "$.data.id" }
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Main Room", format: "IN_PERSON", seat_capacity: 3, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_seats_required: 0 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm: "$.data.id" }
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv1: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-15T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s1: "$.data.id" }
            - call: "POST /room-seats/${s1}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv2: "$.data.version" }
          trigger:
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-14T00:00:00Z", end_date: "2026-09-28T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv2}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-15T00:00:00Z", end_date: "2026-09-29T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv2}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s2: "$.data.id" }
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
