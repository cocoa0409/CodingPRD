        constraints: "> 0"
      - name: pro_rating
        type: enum
        source: input
        required: true
        description: "Selects the uptime_credit variant: ROUTE_DAY (calendar-day granularity) or VEHICLE_HOUR (hour granularity)"
        constraints: "one of {ROUTE_DAY, VEHICLE_HOUR}"
      - name: measurement_start_date
        type: string
        source: input
        required: true
        description: "ISO date (YYYY-MM-DD) of the first day measurements cover; close-month may only close months on/after the month containing this date"
      - name: downtime_events
        type: array
        source: system
        description: "Append-only list of {vehicle_id: string, started_at: datetime, ended_at: datetime|null}; ended_at null = open event counted through month end"
        default: []
      - name: last_closed_month
        type: string
        source: system
        description: "YYYY-MM of the most recently closed month; closes must be strictly chronological"
        default: null
      - name: last_uptime_pct
        type: number
        source: computed
        description: "uptime_credit uptime percentage computed at the latest close-month"
        default: null
      - name: last_credit_cents
        type: integer
        source: computed
        description: "uptime_credit credit computed at the latest close-month"
        default: null
      - name: lifetime_credit_cents
        type: integer
        source: computed
        description: "Sum of last_credit_cents over all closed months"
        default: 0

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        required: true
        description: "FK -> Vehicle.id; van the claim covers (must be COMMISSIONED)"
      - name: service_visit_id
        type: string
        source: input
        required: false
        description: "FK -> ServiceVisit.id; optional related visit — when present it must belong to the same vehicle and be COMPLETED"
        default: null
      - name: claim_lines
        type: array
        source: input
        required: true
        description: "List of {component_class: BATTERY|POWERTRAIN|CHARGING|BODY, part_cost_cents: integer >= 0, labor_hours: number >= 0}; at least one line"
      - name: status
        type: enum
        source: system
        description: "WarrantyClaim state machine state"
        constraints: "one of {SUBMITTED, DIAGNOSED, SETTLED, DENIED}"
        default: SUBMITTED
      - name: diagnosed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ServiceTechnician who performed diagnosis"
        default: null
      - name: diagnosis_notes
        type: string
        source: system
        description: "Diagnosis narrative recorded at SUBMITTED -> DIAGNOSED"
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who adjudicated; must differ from diagnosed_by_user_id (segregation of duties)"
        default: null
      - name: settlement_cents
        type: integer
        source: computed
        description: "warranty_settlement output, computed on adjudicate APPROVE; null while undecided or DENIED"
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Required narrative when adjudicated DENIED"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ChargingProject
    initial_state: SURVEY
    terminal_states: [COMMISSIONED, CANCELLED]
    transitions:
      - from: SURVEY
        to: UTILITY_REVIEW
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: UTILITY_REVIEW}"
        actor: ChargingCoordinator
        preconditions:
          - "status == SURVEY (ERR_INVALID_STATE)"
        side_effects:
          - "Depot.version increments by 1 (committed-set membership unchanged — SURVEY already commits)"
      - from: UTILITY_REVIEW
        to: PERMITTING
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: PERMITTING}"
        actor: ChargingCoordinator
        preconditions:
          - "status == UTILITY_REVIEW (ERR_INVALID_STATE)"
          - "Crew-window rule re-evaluated: for every other project at the same depot in {PERMITTING, INSTALLATION} whose closed install window overlaps this project's window, the sum of crew_count over the mutually-overlapping set (this project included) must be <= MAX_DEPOT_CREW (ERR_INSTALL_WINDOW_CONFLICT)"
        side_effects:
          - "Depot.version increments by 1"
      - from: UTILITY_REVIEW
        to: REDESIGN
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: REDESIGN, utility_denial_reason}"
        actor: ChargingCoordinator
        preconditions:
          - "status == UTILITY_REVIEW (ERR_INVALID_STATE)"
          - "utility_denial_reason must be non-empty (ERR_VALIDATION)"
        side_effects:
          - "utility_denial_reason recorded"
          - "Depot.version increments by 1"
      - from: REDESIGN
        to: UTILITY_REVIEW
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: UTILITY_REVIEW}"
        actor: ChargingCoordinator
        preconditions:
          - "status == REDESIGN (ERR_INVALID_STATE)"
        side_effects:
          - "utility_denial_reason cleared to null"
          - "Depot.version increments by 1"
      - from: PERMITTING
        to: INSTALLATION
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: INSTALLATION}"
        actor: ChargingCoordinator
        preconditions:
          - "status == PERMITTING (ERR_INVALID_STATE)"
        side_effects:
          - "Depot.version increments by 1"
      - from: INSTALLATION
        to: COMMISSIONED
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: COMMISSIONED}"
        actor: ChargingCoordinator
        preconditions:
          - "status == INSTALLATION (ERR_INVALID_STATE)"
        side_effects:
          - "commissioned_capacity_kw set to requested_capacity_kw"
          - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation (requested leaves the in-flight sum, commissioned_capacity_kw enters the commissioned sum — net zero)"
          - "Depot.version increments by 1"
      - from: SURVEY
        to: CANCELLED
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: CANCELLED}"
        actor: ChargingCoordinator
        preconditions:
          - "status in {SURVEY, UTILITY_REVIEW, REDESIGN, PERMITTING} (ERR_INVALID_STATE; from COMMISSIONED -> ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation (requested_capacity_kw leaves the committed set)"
          - "Depot.version increments by 1"
      - from: UTILITY_REVIEW
        to: CANCELLED
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: CANCELLED}"
        actor: ChargingCoordinator
        preconditions:
          - "status in {SURVEY, UTILITY_REVIEW, REDESIGN, PERMITTING} (ERR_INVALID_STATE; from COMMISSIONED -> ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation"
          - "Depot.version increments by 1"
      - from: REDESIGN
        to: CANCELLED
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: CANCELLED}"
        actor: ChargingCoordinator
        preconditions:
          - "status in {SURVEY, UTILITY_REVIEW, REDESIGN, PERMITTING} (ERR_INVALID_STATE; from COMMISSIONED -> ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation"
          - "Depot.version increments by 1"
      - from: PERMITTING
        to: CANCELLED
        trigger: "POST /evfleet/charging-projects/{id}/transition {to_state: CANCELLED}"
        actor: ChargingCoordinator
        preconditions:
          - "status in {SURVEY, UTILITY_REVIEW, REDESIGN, PERMITTING} (ERR_INVALID_STATE; from COMMISSIONED -> ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation"
          - "Depot.version increments by 1"

  - entity: BatteryModule
    initial_state: REGISTERED
    terminal_states: [SCRAPPED, ALLOCATED]
    transitions:
      - from: REGISTERED
        to: IN_QA
        trigger: "POST /evfleet/battery-modules/{id}/transition {to_state: IN_QA}"
        actor: QualityInspector
        preconditions:
          - "quality_status == REGISTERED (ERR_INVALID_STATE)"
          - "X-User-ID != registered_by_user_id (ERR_SEGREGATION_VIOLATION — the registrar may not inspect their own module)"
        side_effects:
          - "last_inspector_user_id := X-User-ID"
      - from: IN_QA
        to: PASSED
        trigger: "POST /evfleet/battery-modules/{id}/transition {to_state: PASSED}"
        actor: QualityInspector
        preconditions:
          - "quality_status == IN_QA (ERR_INVALID_STATE)"
          - "X-User-ID != registered_by_user_id (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "last_inspector_user_id := X-User-ID"
      - from: IN_QA
        to: FAILED
        trigger: "POST /evfleet/battery-modules/{id}/transition {to_state: FAILED}"
        actor: QualityInspector
        preconditions:
          - "quality_status == IN_QA (ERR_INVALID_STATE)"
          - "X-User-ID != registered_by_user_id (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "failure_count increments by 1"
          - "last_inspector_user_id := X-User-ID"
          - "if failure_count >= MODULE_MAX_FAILURES the module immediately auto-transitions FAILED -> SCRAPPED (same request)"
      - from: FAILED
        to: REWORK
        trigger: "POST /evfleet/battery-modules/{id}/transition {to_state: REWORK}"
        actor: ProductionPlanner
        preconditions:
          - "quality_status == FAILED (ERR_INVALID_STATE)"
        side_effects: []
      - from: REWORK
        to: IN_QA
        trigger: "POST /evfleet/battery-modules/{id}/transition {to_state: IN_QA}"
        actor: QualityInspector
        preconditions:
          - "quality_status == REWORK (ERR_INVALID_STATE)"
          - "X-User-ID != registered_by_user_id (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "last_inspector_user_id := X-User-ID"
      - from: PASSED
        to: ALLOCATED
        trigger: "POST /evfleet/vehicles (cascade: VIN registration allocates the module)"
        actor: system
        preconditions: []
        side_effects:
          - "module bound to the new Vehicle; VehicleOrder.registered_count increments by 1"
      - from: REGISTERED
        to: QUARANTINED
        trigger: "POST /evfleet/suppliers/{id}/readiness-audits (cascade: supplier tier drops to C)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_QA
        to: QUARANTINED
        trigger: "POST /evfleet/suppliers/{id}/readiness-audits (cascade: supplier tier drops to C)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REWORK
        to: QUARANTINED
        trigger: "POST /evfleet/suppliers/{id}/readiness-audits (cascade: supplier tier drops to C)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: QUARANTINED
        trigger: "POST /evfleet/suppliers/{id}/readiness-audits (cascade: supplier tier drops to C)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: IN_QA
        trigger: "POST /evfleet/suppliers/{id}/readiness-audits (cascade: supplier tier recovers to A or B)"
        actor: system
        preconditions: []
        side_effects:
          - "module re-enters inspection from scratch; failure_count is NOT reset"

  - entity: VehicleOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: SUBMITTED}"
        actor: FleetManager
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE; from CANCELLED/FULFILLED -> ERR_ALREADY_TERMINAL)"
          - "X-User-ID == fleet_customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "VehicleOrder.version increments by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: CONFIRMED, exemption_document_ref?}"
        actor: ComplianceOfficer
        preconditions:
          - "status in {SUBMITTED, FRANCHISE_HOLD} (ERR_INVALID_STATE; from CANCELLED/FULFILLED -> ERR_ALREADY_TERMINAL)"
          - "Franchise law: if the delivery depot's state_code is in FRANCHISE_BLOCKED_STATES and delivery_method == DIRECT_DELIVERY, a non-empty exemption_document_ref is mandatory (ERR_FRANCHISE_EXEMPTION_REQUIRED)"
        side_effects:
          - "exemption_document_ref stored when provided"
          - "promised_delivery_date computed by delivery_promise_calculation from the logical clock date"
          - "VehicleOrder.version increments by 1"
      - from: FRANCHISE_HOLD
        to: CONFIRMED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: CONFIRMED, exemption_document_ref?}"
        actor: ComplianceOfficer
        preconditions:
          - "status in {SUBMITTED, FRANCHISE_HOLD} (ERR_INVALID_STATE)"
          - "Franchise law: blocked-state depot + DIRECT_DELIVERY requires non-empty exemption_document_ref (ERR_FRANCHISE_EXEMPTION_REQUIRED)"
        side_effects:
          - "exemption_document_ref stored when provided"
          - "promised_delivery_date computed by delivery_promise_calculation"
          - "VehicleOrder.version increments by 1"
      - from: SUBMITTED
        to: FRANCHISE_HOLD
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: FRANCHISE_HOLD}"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "VehicleOrder.version increments by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: CANCELLED}"
        actor: FleetManager
        preconditions:
          - "status in {DRAFT, SUBMITTED, FRANCHISE_HOLD} (ERR_INVALID_STATE; from FULFILLED/CANCELLED -> ERR_ALREADY_TERMINAL)"
          - "X-User-ID == fleet_customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "VehicleOrder.version increments by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: CANCELLED}"
        actor: FleetManager
        preconditions:
          - "status in {DRAFT, SUBMITTED, FRANCHISE_HOLD} (ERR_INVALID_STATE)"
          - "X-User-ID == fleet_customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "VehicleOrder.version increments by 1"
      - from: FRANCHISE_HOLD
        to: CANCELLED
        trigger: "POST /evfleet/vehicle-orders/{id}/transition {to_state: CANCELLED}"
        actor: FleetManager
        preconditions:
          - "status in {DRAFT, SUBMITTED, FRANCHISE_HOLD} (ERR_INVALID_STATE)"
          - "X-User-ID == fleet_customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "VehicleOrder.version increments by 1"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /evfleet/vehicles (system: first VIN registered against the order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "POST /evfleet/vehicles (system: registered_count reaches quantity)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vehicle
    initial_state: "delivery_status: ASSEMBLED; telematics_status: OFFLINE (parallel dimensions)"
    terminal_states: ["delivery_status: COMMISSIONED is a soft terminal for delivery; telematics has no terminal state"]
    transitions:
      - from: "delivery_status ASSEMBLED"
        to: "delivery_status IN_TRANSIT"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: DELIVERY, to_state: IN_TRANSIT}"
        actor: ServiceDispatcher
        preconditions:
          - "delivery_status == ASSEMBLED (ERR_INVALID_STATE)"
        side_effects:
          - "VehicleOrder.hold_count recomputed for the parent order"
      - from: "delivery_status IN_TRANSIT"
        to: "delivery_status AT_DEPOT"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: DELIVERY, to_state: AT_DEPOT}"
        actor: ServiceDispatcher
        preconditions:
          - "delivery_status == IN_TRANSIT (ERR_INVALID_STATE)"
        side_effects: []
      - from: "delivery_status AT_DEPOT"
        to: "delivery_status COMMISSIONED"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: DELIVERY, to_state: COMMISSIONED}"
        actor: ServiceDispatcher
        preconditions:
          - "delivery_status == AT_DEPOT (ERR_INVALID_STATE)"
          - "software_hold == false (ERR_SOFTWARE_HOLD)"
          - "telematics_status == ACTIVE (ERR_TELEMATICS_NOT_ACTIVE)"
          - "Charging gate when the parent order's requires_depot_charging is true: charging_demand_gate over the order's depot must pass (ERR_CHARGING_CAPACITY_INSUFFICIENT)"
        side_effects:
          - "vehicle enters the in-service fleet set used by uptime_credit"
      - from: "delivery_status IN_TRANSIT"
        to: "delivery_status ASSEMBLED"
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: ROLLED_BACK} (cascade: held vehicles en route are recalled)"
        actor: system
        preconditions:
          - "software_hold flipped false -> true by the rollback cascade"
        side_effects:
          - "VehicleOrder.hold_count recomputed for the parent order"
      - from: "telematics_status OFFLINE"
        to: "telematics_status PROVISIONED"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: TELEMATICS, to_state: PROVISIONED}"
        actor: ServiceDispatcher
        preconditions:
          - "telematics_status == OFFLINE (ERR_INVALID_STATE)"
        side_effects: []
      - from: "telematics_status PROVISIONED"
        to: "telematics_status ACTIVE"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: TELEMATICS, to_state: ACTIVE}"
        actor: ServiceDispatcher
        preconditions:
          - "telematics_status in {PROVISIONED, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: "telematics_status SUSPENDED"
        to: "telematics_status ACTIVE"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: TELEMATICS, to_state: ACTIVE}"
        actor: ServiceDispatcher
        preconditions:
          - "telematics_status in {PROVISIONED, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: "telematics_status ACTIVE"
        to: "telematics_status SUSPENDED"
        trigger: "POST /evfleet/vehicles/{id}/transition {dimension: TELEMATICS, to_state: SUSPENDED}"
        actor: ServiceDispatcher
        preconditions:
          - "telematics_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

  - entity: SoftwareCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETE, ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: CANARY
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: CANARY}"
        actor: ReleaseManager
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE; from COMPLETE/ROLLED_BACK -> ERR_ALREADY_TERMINAL)"
        side_effects: []
      - from: CANARY
        to: EXPANDED
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: EXPANDED}"
        actor: ReleaseManager
        preconditions:
          - "status == CANARY (ERR_INVALID_STATE)"
          - "campaign_rollout_gate: cohort_size >= CANARY_MIN_COHORT (ERR_EMPTY_COHORT when cohort_size == 0, else ERR_ROLLOUT_GATE_FAILED) and success_rate >= ROLLOUT_SUCCESS_RATE_MIN (ERR_ROLLOUT_GATE_FAILED)"
        side_effects: []
      - from: EXPANDED
        to: GENERAL
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: GENERAL}"
        actor: ReleaseManager
        preconditions:
          - "status == EXPANDED (ERR_INVALID_STATE)"
          - "campaign_rollout_gate: cohort_size >= EXPANDED_MIN_COHORT (ERR_EMPTY_COHORT when 0, else ERR_ROLLOUT_GATE_FAILED) and success_rate >= ROLLOUT_SUCCESS_RATE_MIN (ERR_ROLLOUT_GATE_FAILED)"
        side_effects: []
      - from: GENERAL
        to: COMPLETE
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: COMPLETE}"
        actor: ReleaseManager
        preconditions:
          - "status == GENERAL (ERR_INVALID_STATE)"
        side_effects: []
      - from: CANARY
        to: PAUSED
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: PAUSED}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL} (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := CANARY"
      - from: EXPANDED
        to: PAUSED
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: PAUSED}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL} (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := EXPANDED"
      - from: GENERAL
        to: PAUSED
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: PAUSED}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL} (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := GENERAL"
      - from: PAUSED
        to: CANARY
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: CANARY}"
        actor: ReleaseManager
        preconditions:
          - "status == PAUSED and paused_from == CANARY (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := null"
      - from: PAUSED
        to: EXPANDED
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: EXPANDED}"
        actor: ReleaseManager
        preconditions:
          - "status == PAUSED and paused_from == EXPANDED (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := null"
      - from: PAUSED
        to: GENERAL
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: GENERAL}"
        actor: ReleaseManager
        preconditions:
          - "status == PAUSED and paused_from == GENERAL (ERR_INVALID_STATE)"
        side_effects:
          - "paused_from := null"
      - from: CANARY
        to: ROLLED_BACK
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: ROLLED_BACK}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL, PAUSED} (ERR_INVALID_STATE; from COMPLETE/ROLLED_BACK -> ERR_ALREADY_TERMINAL)"
        side_effects:
          - "Cascade link 1: every Vehicle with a SUCCESS entry in this campaign's results and telematics_status == ACTIVE gets software_hold := true"
          - "Cascade link 2 (caused by link 1): each such Vehicle whose delivery_status == IN_TRANSIT reverts to ASSEMBLED (recall)"
          - "Cascade link 3 (caused by link 2's Vehicle mutations): each affected VehicleOrder.hold_count is recomputed as the count of its Vehicles with software_hold == true"
      - from: EXPANDED
        to: ROLLED_BACK
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: ROLLED_BACK}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL, PAUSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every Vehicle with a SUCCESS entry in results and telematics_status == ACTIVE gets software_hold := true"
          - "Cascade link 2: each such Vehicle with delivery_status == IN_TRANSIT reverts to ASSEMBLED"
          - "Cascade link 3: each affected VehicleOrder.hold_count is recomputed"
      - from: GENERAL
        to: ROLLED_BACK
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: ROLLED_BACK}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL, PAUSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every Vehicle with a SUCCESS entry in results and telematics_status == ACTIVE gets software_hold := true"
          - "Cascade link 2: each such Vehicle with delivery_status == IN_TRANSIT reverts to ASSEMBLED"
          - "Cascade link 3: each affected VehicleOrder.hold_count is recomputed"
      - from: PAUSED
        to: ROLLED_BACK
        trigger: "POST /evfleet/software-campaigns/{id}/transition {to_state: ROLLED_BACK}"
        actor: ReleaseManager
        preconditions:
          - "status in {CANARY, EXPANDED, GENERAL, PAUSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every Vehicle with a SUCCESS entry in results and telematics_status == ACTIVE gets software_hold := true"
          - "Cascade link 2: each such Vehicle with delivery_status == IN_TRANSIT reverts to ASSEMBLED"
          - "Cascade link 3: each affected VehicleOrder.hold_count is recomputed"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /evfleet/service-visits/{id}/transition {to_state: IN_PROGRESS}"
        actor: ServiceTechnician
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE; from COMPLETED/CANCELLED -> ERR_ALREADY_TERMINAL)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /evfleet/service-visits/{id}/transition {to_state: COMPLETED}"
        actor: ServiceTechnician
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: for each parts_lines entry, PartsStock at the stocking center: reserved_qty -= qty AND on_hand_qty -= qty AND consumed_total_qty += qty (physical units leave; reservation converts to consumption)"
          - "Cascade link 2 (caused by link 1): each mutated PartsStock recomputes restock_needed := (on_hand_qty < reorder_threshold)"
          - "completed_by_user_id := X-User-ID"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /evfleet/service-visits/{id}/transition {to_state: CANCELLED}"
        actor: FleetManager
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE; from COMPLETED/CANCELLED -> ERR_ALREADY_TERMINAL; from IN_PROGRESS cancellation is not offered -> ERR_INVALID_STATE)"
          - "X-User-ID == the fleet_customer_id of the visited vehicle's order (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Reserved parts released: for each parts_lines entry, PartsStock.reserved_qty -= qty (PartsStock unchanged in aggregate per parts_conservation_invariant)"
          - "Each touched PartsStock recomputes restock_needed"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: SUBMITTED
        to: DIAGNOSED
        trigger: "POST /evfleet/warranty-claims/{id}/diagnose {diagnosis_notes}"
        actor: ServiceTechnician
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE; from SETTLED/DENIED -> ERR_ALREADY_TERMINAL)"
          - "diagnosis_notes non-empty (ERR_VALIDATION)"
        side_effects:
          - "diagnosed_by_user_id := X-User-ID; diagnosis_notes recorded"
      - from: DIAGNOSED
        to: SETTLED
        trigger: "POST /evfleet/warranty-claims/{id}/adjudicate {decision: APPROVE}"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DIAGNOSED (ERR_INVALID_STATE — adjudicating a merely SUBMITTED claim -> ERR_CLAIM_NOT_DIAGNOSED)"
          - "X-User-ID != diagnosed_by_user_id (ERR_SEGREGATION_VIOLATION — diagnostician may not adjudicate their own claim)"
        side_effects:
          - "settlement_cents computed by warranty_settlement"
          - "adjudicated_by_user_id := X-User-ID"
      - from: DIAGNOSED
        to: DENIED
        trigger: "POST /evfleet/warranty-claims/{id}/adjudicate {decision: DENY, denial_reason}"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DIAGNOSED (ERR_INVALID_STATE / ERR_CLAIM_NOT_DIAGNOSED)"
          - "X-User-ID != diagnosed_by_user_id (ERR_SEGREGATION_VIOLATION)"
          - "denial_reason non-empty (ERR_VALIDATION)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; denial_reason recorded"

# =============================================================================
# §1.2.1 Concurrency Rules (true races resolved by OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: charging-project-create-stale-depot
    parent_entity: Depot
    write_endpoint: "POST /evfleet/charging-projects"
    occ_field: "expected_depot_version"
    description: |
      Creating a ChargingProject against a Depot whose version has advanced
      since the client last read it is rejected: the client's view of
      committed_capacity_kw (hence the headroom their requested_capacity_kw
      was sized against) is stale. Expressed purely as an OCC check on
      Depot.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: vehicle-register-stale-order
    parent_entity: VehicleOrder
    write_endpoint: "POST /evfleet/vehicles"
    occ_field: "expected_vehicle_order_version"
    description: |
      Registering a VIN against a VehicleOrder whose version has advanced
      since the client last read it is rejected: registered_count may have
      moved, so the client's belief that a slot remains is stale. Expressed
      purely as an OCC check on VehicleOrder.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: downtime-append-stale-contract
    parent_entity: UptimeContract
    write_endpoint: "POST /evfleet/uptime-contracts/{id}/downtime-events"
    occ_field: "expected_uptime_contract_version"
    description: |
      Appending a downtime event to an UptimeContract whose version has
      advanced since the client last read it is rejected: the client may be
      extending an event list it has never seen. Expressed purely as an OCC
      check on UptimeContract.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: supplier_readiness_scoring
    trigger: "POST /evfleet/suppliers/{id}/readiness-audits"
    algorithm: weighted_scoring
    description: "Maps an audit's three measurements onto readiness_tier {A, B, C}. All three conditions of a tier must hold (conjunctive); tiers are checked A first, then B, else C."
    formula: |
      if on_time_pct >= TIER_A_ON_TIME_PCT and first_pass_yield_pct >= TIER_A_YIELD_PCT and open_corrective_actions == 0:
          readiness_tier = A
      elif on_time_pct >= TIER_B_ON_TIME_PCT and first_pass_yield_pct >= TIER_B_YIELD_PCT and open_corrective_actions <= TIER_B_MAX_CORRECTIVE:
          readiness_tier = B
      else:
          readiness_tier = C
      # boundaries are inclusive (>= / <=): exactly 95.0 on-time with yield 98.0 and 0 corrective -> A
    input_set: "The audit payload itself; audits are not averaged — the latest audit fully determines the tier"
    constants:
      TIER_A_ON_TIME_PCT: 95.0
      TIER_A_YIELD_PCT: 98.0
      TIER_B_ON_TIME_PCT: 85.0
      TIER_B_YIELD_PCT: 92.0
      TIER_B_MAX_CORRECTIVE: 2
    precision: "percentages compared at 1 decimal place exactly as submitted"
    variants: []

  - name: production_capacity_gate
    trigger: "POST /evfleet/vehicles (each VIN registration)"
    algorithm: threshold
    description: "Weekly ramp capacity. A VIN may be registered only while registrations already completed in the current ISO week are strictly below weekly_capacity_units. The ISO week runs Monday 00:00:00Z to the next Monday 00:00:00Z on the logical clock."
    formula: |
      weekly_capacity_units = RAMP_BASE_WEEKLY_UNITS
                            + sum over all Suppliers of TIER_WEEKLY_UNITS[supplier.readiness_tier]
      registrations_this_week = count of Vehicles with created_at inside the current ISO week
      allow iff registrations_this_week < weekly_capacity_units
      # boundary: when registrations_this_week == weekly_capacity_units the next
      # registration is rejected with ERR_RAMP_CAPACITY_EXCEEDED
    input_set: "All Supplier rows (any tier contributes, C and UNAUDITED contribute 0); Vehicles of every customer count toward the shared ramp"
    constants:
      RAMP_BASE_WEEKLY_UNITS: 8
      TIER_WEEKLY_UNITS: { A: 24, B: 10, C: 0, UNAUDITED: 0 }
    precision: "integer units; no rounding"
    variants: []

  - name: depot_capacity_allocation
    trigger: "POST /evfleet/charging-projects (create), POST /evfleet/charging-projects/{id}/transition (any status change), and every committed-set membership change"
    algorithm: constraint_propagation
    description: "Depot electrical headroom with a deliberately circular-looking dependency, resolved by a pinned evaluation order: a project's approval changes committed capacity, and vehicle commissioning demand later depends on commissioned capacity — but commissioning demand never feeds back into the headroom check. The evaluation order below is the contract."
    formula: |
      # PINNED EVALUATION ORDER (must not be interleaved):
      # (1) committed_capacity_kw(depot) =
      #       sum(requested_capacity_kw over ChargingProjects of the depot with
      #           status in {SURVEY, UTILITY_REVIEW, PERMITTING, INSTALLATION})
      #     + sum(commissioned_capacity_kw over status == COMMISSIONED)
      # (2) headroom_kw(depot) = total_capacity_kw - committed_capacity_kw
      # (3) create eligibility: requested_capacity_kw <= headroom_kw
      #     (<= is inclusive: requesting exactly the headroom is allowed)
      # Vehicle-side demand is evaluated separately by charging_demand_gate and
      # never enters (1)-(3).
    input_set: "ChargingProjects of the depot in {SURVEY, UTILITY_REVIEW, PERMITTING, INSTALLATION, COMMISSIONED}; CANCELLED projects contribute nothing"
    constants: {}
    precision: "kW compared at the exact submitted precision; no rounding"
    variants: []

  - name: charging_demand_gate
    trigger: "POST /evfleet/vehicles/{id}/transition {dimension: DELIVERY, to_state: COMMISSIONED} when the parent order's requires_depot_charging is true"
    algorithm: threshold
    description: "Depot charging adequacy at vehicle commissioning. Uses only COMMISSIONED charging projects; in-flight projects never count."
    formula: |
      commissioned_kw(depot) = sum(commissioned_capacity_kw over ChargingProjects of the depot with status == COMMISSIONED)
      in_service = count of Vehicles whose order's depot_id == depot AND delivery_status == COMMISSIONED
      required_kw = (in_service + 1) * PER_VEHICLE_DRAW_KW   # +1 = the vehicle being commissioned
      allow iff commissioned_kw * UTILIZATION_FACTOR >= required_kw
      # boundary: equality passes (>=)
    input_set: "COMMISSIONED ChargingProjects at the order's depot; COMMISSIONED Vehicles at the same depot (all customers' orders pointing at that depot)"
    constants:
      PER_VEHICLE_DRAW_KW: 19.2
      UTILIZATION_FACTOR: 0.8
    precision: "kW at 1 decimal place; comparison exact"
    variants: []

  - name: battery_eol_valuation
    trigger: "POST /evfleet/vehicles/{id}/battery-health when measured_soh_pct < SOH_EOL_THRESHOLD (vehicle enters EOL_REVIEW); both variants are computed and stored on the Vehicle"
    algorithm: weighted_scoring
    description: "End-of-life residual valuation of the vehicle's battery pack under two valid accounting approaches; they disagree on the same inputs and both are persisted."
    formula: |
      # Variant REFURBISH (refurbishment-resale view):
      #   band_multiplier = 0.85 if soh >= 90 | 0.70 if 80 <= soh < 90
      #                     0.55 if 70 <= soh < 80 | 0.35 if soh < 70
      #   refurbish_cents = round_half_up(PACK_BASE_VALUE_CENTS * band_multiplier, 0)
      # Variant RECOVERY (materials-recovery view):
      #   recovery_cents = round_half_up(pack_kwh * RECOVERY_RATE_PER_KWH_CENTS * soh / 100, 0)
      # pack_kwh is the allocated BatteryModule's pack_kwh (52 or 77).
      # Worked example at soh = 68.4, pack 77:
      #   REFURBISH = 1800000 * 0.35 = 630000
      #   RECOVERY  = 77 * 12000 * 0.684 = 632016
    input_set: "The vehicle's measured_soh_pct (exact submitted value) and its allocated module's pack_kwh"
    constants:
      SOH_EOL_THRESHOLD: 70.0
      PACK_BASE_VALUE_CENTS: 1800000
      RECOVERY_RATE_PER_KWH_CENTS: 12000
    precision: "integer cents, round_half_up"
    variants:
      - name: REFURBISH
        when: "always computed into eol_valuation_refurbish_cents"
        difference: "band multiplier keyed on SOH band; insensitive to pack size"
      - name: RECOVERY
        when: "always computed into eol_valuation_recovery_cents"
        difference: "per-kWh materials rate scaled by exact SOH; sensitive to pack size and continuous in SOH"

  - name: warranty_settlement
    trigger: "POST /evfleet/warranty-claims/{id}/adjudicate {decision: APPROVE}"
    algorithm: aggregation
    description: "Claim settlement with PINNED nested rounding: each component of each line is rounded to integer cents first, then lines are summed, then the per-claim deductible is subtracted once. Summing raw values and rounding once at the end is a different, non-conforming order and yields different cents."
    formula: |
      # per line i:
      #   covered_part_cents_i  = round_half_up(part_cost_cents_i * COVERAGE_PCT[component_class_i], 0)
      #   covered_labor_cents_i = round_half_up(labor_hours_i * LABOR_RATE_CENTS_PER_HOUR * COVERAGE_PCT[component_class_i], 0)
      #   line_cents_i = covered_part_cents_i + covered_labor_cents_i
      # settlement_cents = max(0, sum(line_cents_i) - DEDUCTIBLE_CENTS)
      # Worked example: lines [CHARGING 125c/0.0h, CHARGING 135c/0.0h, POWERTRAIN 100000c/1.0h]
      #   125*0.9 = 112.5 -> 113 ; 135*0.9 = 121.5 -> 122 ; 100000 + 17500 = 117500
      #   sum = 117735 ; settlement = 117735 - 25000 = 92735
      #   (sum-then-round would give 117734 - 25000 = 92734 — one cent less)
    input_set: "The claim's claim_lines exactly as submitted"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 17500
      DEDUCTIBLE_CENTS: 25000
      COVERAGE_PCT: { BATTERY: 1.0, POWERTRAIN: 1.0, CHARGING: 0.9, BODY: 0.8 }
    precision: "integer cents, round_half_up, applied PER COMPONENT PER LINE before summation"
    variants: []

  - name: uptime_credit
    trigger: "POST /evfleet/uptime-contracts/{id}/close-month {month}"
    algorithm: tiered_pricing
    description: "Monthly fleet uptime and breach credit. The downtime measure depends on the contract's pro_rating variant; the credit is a marginal tiered rate on the shortfall in percentage points, capped."
    formula: |
      # N = count of Vehicles whose order's fleet_customer_id == contract.fleet_customer_id
      #     AND delivery_status in {AT_DEPOT, COMMISSIONED} at close time
      # D = number of calendar days in the closed month (UTC)
      # downtime_vehicle_days:
      #   variant ROUTE_DAY   = sum over vehicles of |distinct UTC calendar days
      #                         overlapped by any of the vehicle's events in the month|
      #                         (any overlap with a day counts the whole day once)
      #   variant VEHICLE_HOUR = sum over events of overlap_hours(event, month),
      #                          each event's overlap rounded to 0.1h (round_half_up)
      #                          BEFORE division; total / 24
      #   open events (ended_at null) count through the last instant of the month
      # uptime_pct = round_half_up((1 - downtime_vehicle_days / (N * D)) * 100, 1)
      # shortfall s = max(0, committed_uptime_pct - uptime_pct)
      # credit_pct = min(s, 2.0) * 2 + min(max(s - 2.0, 0), 3.0) * 5 + max(s - 5.0, 0) * 10
      # credit_pct = min(credit_pct, CREDIT_CAP_PCT)
      # credit_cents = round_half_up(monthly_service_fee_cents * credit_pct / 100, 0)
      # N == 0 -> ERR_INVALID_STATE (no in-service fleet to measure)
      # Worked example (N=4, D=30, committed 97.0, fee 2000000, one event
      # 2026-09-01T06:00Z -> 2026-09-09T18:00Z on one vehicle):
      #   ROUTE_DAY:   9 days -> uptime 92.5 -> s 4.5 -> pct 16.5 -> credit 330000
      #   VEHICLE_HOUR: 204.0h -> 8.5 days -> uptime 92.9 -> s 4.1 -> pct 14.5 -> credit 290000
    input_set: "Downtime events overlapping the closed month on vehicles of the contract customer's in-service fleet set"
    constants:
      CREDIT_CAP_PCT: 30.0
    precision: "uptime at 1 decimal round_half_up; credit integer cents round_half_up"
    variants:
      - name: ROUTE_DAY
        when: "contract.pro_rating == ROUTE_DAY"
        difference: "whole calendar days; a one-minute overlap counts a full vehicle-day"
      - name: VEHICLE_HOUR
        when: "contract.pro_rating == VEHICLE_HOUR"
        difference: "hour-granular overlap, per-event rounded to 0.1h before summation, divided by 24"

  - name: campaign_rollout_gate
    trigger: "POST /evfleet/software-campaigns/{id}/transition to EXPANDED (from CANARY) or GENERAL (from EXPANDED)"
    algorithm: threshold
    description: "Stage-advance validation over recorded per-vehicle results."
    formula: |
      cohort_size = succeeded_count + failed_count
      if cohort_size == 0: reject ERR_EMPTY_COHORT
      if cohort_size < min_cohort(stage): reject ERR_ROLLOUT_GATE_FAILED
      success_rate = succeeded_count / cohort_size   # exact division, no pre-rounding
      allow iff success_rate >= ROLLOUT_SUCCESS_RATE_MIN   # boundary: 19/20 == 0.95 passes
      # min_cohort: CANARY -> 3 ; EXPANDED -> 10
    input_set: "The campaign's results array (all entries, one per vehicle)"
    constants:
      CANARY_MIN_COHORT: 3
      EXPANDED_MIN_COHORT: 10
      ROLLOUT_SUCCESS_RATE_MIN: 0.95
    precision: "success_rate compared exactly (rational comparison equivalent)"
    variants: []

  - name: delivery_promise_calculation
    trigger: "VehicleOrder transition to CONFIRMED; re-derived only by the supplier-downgrade cascade (push, never pull-back)"
    algorithm: chronological
    description: "Promised delivery date from the confirm date on the logical clock; supplier downgrades push it out by a fixed penalty, recoveries never pull it back in."
    formula: |
      promised_delivery_date = date(confirm instant) + PROMISE_BASE_DAYS
                             + PROMISE_PER_TEN_VANS_DAYS * ceil(quantity / 10)
      # cascade: when supply_risk_flag flips false -> true, promised_delivery_date += SUPPLY_RISK_PUSH_DAYS
      #          when supply_risk_flag flips true -> false, promised_delivery_date is NOT reduced
      # Worked example: quantity 2 confirmed on 2026-09-01 -> 28 + 7*1 = 35 days -> 2026-10-06
      #   downgrade cascade -> 2026-10-20
    input_set: "Order quantity; logical clock date at confirmation"
    constants:
      PROMISE_BASE_DAYS: 28
      PROMISE_PER_TEN_VANS_DAYS: 7
      SUPPLY_RISK_PUSH_DAYS: 14
    precision: "whole ISO dates (YYYY-MM-DD)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failing check wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; for multi-role transition endpoints the requested to_state further restricts which listed role may perform it (per state machine actor)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left to right; body-supplied FK ids (fleet_customer_id, depot_id, battery_supplier_id, vehicle_order_id, battery_module_id, service_center_id, mobile_van_id, vehicle_id, service_visit_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Ownership: FleetManager may only act on resources of their own customer — X-User-ID must equal the owning FleetCustomer id (depot creation, order create/submit/cancel, charging-project create, visit create/cancel, claim create)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /evfleet/depots, POST /evfleet/charging-projects, POST /evfleet/vehicle-orders, POST /evfleet/vehicle-orders/{id}/transition, POST /evfleet/service-visits, POST /evfleet/service-visits/{id}/transition, POST /evfleet/warranty-claims"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version (per §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /evfleet/charging-projects, POST /evfleet/vehicles, POST /evfleet/uptime-contracts/{id}/downtime-events"
  - priority: 6
    category: state
    check: "State preconditions of the requested transition on the target resource (incl. ERR_CAMPAIGN_NOT_ACTIVE for results outside {CANARY, EXPANDED, GENERAL}, ERR_CLAIM_NOT_DIAGNOSED for adjudicating a SUBMITTED claim, ERR_MONTH_ALREADY_CLOSED / ERR_MONTH_OUT_OF_ORDER for close-month chronology, ERR_SOFTWARE_HOLD and ERR_TELEMATICS_NOT_ACTIVE for delivery advance)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition / action endpoints"
  - priority: 6
    category: state
    check: "Terminal lockdown: any transition from a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: battery inspection X-User-ID != module's registered_by_user_id; readiness audit X-User-ID != supplier's created_by_user_id; claim adjudication X-User-ID != claim's diagnosed_by_user_id"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /evfleet/battery-modules/{id}/transition, POST /evfleet/suppliers/{id}/readiness-audits, POST /evfleet/warranty-claims/{id}/adjudicate"
  - priority: 8
    category: business_safety
    check: "Franchise law: approving (to CONFIRMED) an order whose depot state_code is in FRANCHISE_BLOCKED_STATES with delivery_method == DIRECT_DELIVERY requires non-empty exemption_document_ref"
    error_id: ERR_FRANCHISE_EXEMPTION_REQUIRED
    http_status: 422
    applies_to: "POST /evfleet/vehicle-orders/{id}/transition"
  - priority: 9
    category: business_temporal
    check: "Window sanity: window_end strictly after window_start (service visits); install_window_end at-or-after install_window_start (charging projects); close-month month must match YYYY-MM"
    error_id: ERR_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /evfleet/service-visits, POST /evfleet/charging-projects, POST /evfleet/uptime-contracts/{id}/close-month"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and shape: vin globally unique (ERR_DUPLICATE_VIN); van_code unique (ERR_DUPLICATE_VIN); exactly one of service_center_id / mobile_van_id set on a visit and claim_lines non-empty (ERR_VALIDATION)"
    error_id: ERR_DUPLICATE_VIN
    http_status: 409
    applies_to: "POST /evfleet/vehicles, POST /evfleet/mobile-vans, POST /evfleet/service-visits, POST /evfleet/warranty-claims"
  - priority: 11
    category: business_constraint
    check: "Temporal overlap — van: a new mobile visit conflicts with any visit on the same MobileVan in {SCHEDULED, IN_PROGRESS} unless new_end <= existing_start - 45 minutes OR new_start >= existing_end + 45 minutes (half-open windows plus VAN_TRAVEL_BUFFER_MINUTES on both sides)"
    error_id: ERR_VAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /evfleet/service-visits"
  - priority: 12
    category: business_constraint
    check: "Temporal overlap — depot install crews (aggregate semantics): over closed install windows, any set of mutually overlapping projects at one depot in {PERMITTING, INSTALLATION} (plus the candidate project) must have crew_count sum <= MAX_DEPOT_CREW; checked at create and at entry to PERMITTING"
    error_id: ERR_INSTALL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /evfleet/charging-projects, POST /evfleet/charging-projects/{id}/transition"
  - priority: 13
    category: business_referential
    check: "Cross-entity references: battery module pack_kwh == order battery_pack_kwh (ERR_MODULE_PACK_MISMATCH); module quality_status == PASSED (ERR_MODULE_NOT_PASSED); claim's service_visit_id belongs to the same vehicle and is COMPLETED (ERR_SERVICE_VISIT_NOT_COMPLETED); vehicle COMMISSIONED for visits and claims (ERR_VEHICLE_NOT_IN_SERVICE); vehicle telematics ACTIVE for campaign results and battery reports (ERR_TELEMATICS_NOT_ACTIVE)"
    error_id: ERR_MODULE_PACK_MISMATCH
    http_status: 422
    applies_to: "POST /evfleet/vehicles, POST /evfleet/warranty-claims, POST /evfleet/service-visits, POST /evfleet/software-campaigns/{id}/vehicle-results, POST /evfleet/vehicles/{id}/battery-health"
  - priority: 14
    category: business_fiscal
    check: "Capacity / quota: weekly ramp capacity (ERR_RAMP_CAPACITY_EXCEEDED); depot headroom requested <= total - committed (ERR_DEPOT_CAPACITY_EXCEEDED); parts availability on_hand - reserved >= qty per line (ERR_PARTS_INSUFFICIENT); charging demand gate at commissioning (ERR_CHARGING_CAPACITY_INSUFFICIENT). Note: over-registration beyond order quantity is unreachable as a quota error because registered_count == quantity auto-fulfills the order — the attempt lands on terminal FULFILLED (ERR_ALREADY_TERMINAL)"
    error_id: ERR_ORDER_QUANTITY_FULL
    http_status: 422
    applies_to: "POST /evfleet/vehicles, POST /evfleet/charging-projects, POST /evfleet/service-visits, POST /evfleet/vehicles/{id}/transition"
  - priority: 15
    category: business_constraint
    check: "Aggregate rollout gate: cohort size and success-rate per campaign_rollout_gate (ERR_EMPTY_COHORT / ERR_ROLLOUT_GATE_FAILED); duplicate vehicle result (ERR_DUPLICATE_VEHICLE_RESULT)"
    error_id: ERR_ROLLOUT_GATE_FAILED
    http_status: 409
    applies_to: "POST /evfleet/software-campaigns/{id}/transition, POST /evfleet/software-campaigns/{id}/vehicle-results"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (unprefixed, outside /evfleet): sets the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutation"]

  - method: POST
    path: "/evfleet/fleet-customers"
    description: "Register a commercial fleet customer"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, contact_email, account_tier]
    output: FleetCustomer
    side_effects: []

  - method: GET
    path: "/evfleet/fleet-customers/{id}"
    description: "Read one fleet customer"
    roles: [PlatformAdmin, FleetManager]
    code: 200
    input: []
    output: FleetCustomer
    side_effects: []

  - method: GET
    path: "/evfleet/fleet-customers/{id}/depots"
    description: "List depots of a customer"
    roles: [PlatformAdmin, FleetManager, ChargingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Depot[]"
    side_effects: []

  - method: GET
    path: "/evfleet/fleet-customers/{id}/uptime-contracts"
    description: "List uptime contracts of a customer"
    roles: [PlatformAdmin, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "UptimeContract[]"
    side_effects: []

  - method: POST
    path: "/evfleet/depots"
    description: "Create a depot for the calling FleetManager's customer (X-User-ID == fleet_customer_id)"
    roles: [FleetManager]
    code: 201
    input: [fleet_customer_id, name, state_code, address, total_capacity_kw]
    output: Depot
    side_effects: ["committed_capacity_kw initialized to 0"]

  - method: GET
    path: "/evfleet/depots/{id}"
    description: "Read one depot incl. computed committed_capacity_kw"
    roles: [PlatformAdmin, FleetManager, ChargingCoordinator]
    code: 200
    input: []
    output: Depot
    side_effects: []

  - method: GET
    path: "/evfleet/depots/{id}/charging-projects"
    description: "List charging projects at a depot"
    roles: [PlatformAdmin, FleetManager, ChargingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChargingProject[]"
    side_effects: []

  - method: POST
    path: "/evfleet/charging-projects"
    description: "Request a charging build-out at one of the caller's depots; OCC on Depot.version via expected_depot_version; capacity headroom (<=) and install-window crew aggregate checked at create"
    roles: [FleetManager]
    code: 201
    input: [depot_id, requested_capacity_kw, install_window_start, install_window_end, crew_count, expected_depot_version]
    output: ChargingProject
    side_effects:
      - "Depot.committed_capacity_kw recomputed by depot_capacity_allocation (new SURVEY project commits its requested kW)"
      - "Depot.version increments by 1"

  - method: POST
    path: "/evfleet/charging-projects/{id}/transition"
    description: "Advance / deny / cancel a charging project per its state machine"
    roles: [ChargingCoordinator]
    code: 200
    input: [to_state, "utility_denial_reason?"]
    output: ChargingProject
    side_effects:
      - "Depot.committed_capacity_kw recomputed on CANCELLED / COMMISSIONED"
      - "Depot.version increments by 1 on every successful transition"

  - method: POST
    path: "/evfleet/suppliers"
    description: "Register a battery/component supplier"
    roles: [ProductionPlanner]
    code: 201
    input: [name, contact_email]
    output: Supplier
    side_effects: ["created_by_user_id := X-User-ID"]

  - method: GET
    path: "/evfleet/suppliers/{id}"
    description: "Read one supplier incl. computed readiness_tier"
    roles: [PlatformAdmin, ProductionPlanner, QualityInspector]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/evfleet/suppliers/{id}/battery-modules"
    description: "List battery modules of a supplier"
    roles: [PlatformAdmin, ProductionPlanner, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatteryModule[]"
    side_effects: []

  - method: POST
    path: "/evfleet/suppliers/{id}/readiness-audits"
    description: "Record a readiness audit; recomputes readiness_tier via supplier_readiness_scoring and fires the quarantine / supply-risk cascade on tier change"
    roles: [QualityInspector]
    code: 200
    input: [on_time_pct, first_pass_yield_pct, open_corrective_actions]
    output: Supplier
    side_effects:
      - "readiness_tier recomputed; last_* audit fields recorded"
      - "Cascade on drop to C: supplier's BatteryModules in {REGISTERED, IN_QA, REWORK, FAILED} -> QUARANTINED; VehicleOrders with battery_supplier_id == this supplier and status in {CONFIRMED, IN_PRODUCTION} get supply_risk_flag := true and promised_delivery_date += SUPPLY_RISK_PUSH_DAYS"
      - "Cascade on recovery from C to A/B: QUARANTINED modules -> IN_QA; flagged orders get supply_risk_flag := false (promised_delivery_date NOT pulled back)"

  - method: POST
    path: "/evfleet/battery-modules"
    description: "Register a battery module lot from a supplier"
    roles: [ProductionPlanner]
    code: 201
    input: [supplier_id, module_serial, pack_kwh]
    output: BatteryModule
    side_effects: ["registered_by_user_id := X-User-ID; quality_status := REGISTERED; failure_count := 0"]

  - method: POST
    path: "/evfleet/battery-modules/{id}/transition"
    description: "Quality-gate progression: IN_QA / PASSED / FAILED by QualityInspector, REWORK by ProductionPlanner; segregation: inspector != registrar"
    roles: [QualityInspector, ProductionPlanner]
    code: 200
    input: [to_state]
    output: BatteryModule
    side_effects:
      - "FAILED increments failure_count; failure_count >= MODULE_MAX_FAILURES auto-transitions to SCRAPPED"

  - method: POST
    path: "/evfleet/vehicle-orders"
    description: "Place a fleet vehicle order (DRAFT) for the caller's customer"
    roles: [FleetManager]
    code: 201
    input: [fleet_customer_id, depot_id, battery_supplier_id, quantity, battery_pack_kwh, telematics_tier, delivery_method, requires_depot_charging]
    output: VehicleOrder
    side_effects: []

  - method: GET
    path: "/evfleet/vehicle-orders/{id}"
    description: "Read one vehicle order incl. computed promised_delivery_date, registered_count, hold_count, supply_risk_flag"
    roles: [PlatformAdmin, FleetManager, ComplianceOfficer, ProductionPlanner]
    code: 200
    input: []
    output: VehicleOrder
    side_effects: []

  - method: GET
    path: "/evfleet/vehicle-orders"
    description: "List vehicle orders, filterable by any FK"
    roles: [PlatformAdmin, FleetManager, ComplianceOfficer, ProductionPlanner]
    code: 200
    input: ["fleet_customer_id?", "depot_id?", "battery_supplier_id?", "limit?", "offset?"]
    output: "VehicleOrder[]"
    side_effects: []

  - method: POST
    path: "/evfleet/vehicle-orders/{id}/transition"
    description: "Order lifecycle: SUBMITTED / CANCELLED by the owning FleetManager; CONFIRMED / FRANCHISE_HOLD by ComplianceOfficer (compliance review; franchise exemption enforced)"
    roles: [FleetManager, ComplianceOfficer]
    code: 200
    input: [to_state, "exemption_document_ref?"]
    output: VehicleOrder
    side_effects:
      - "CONFIRMED: promised_delivery_date computed by delivery_promise_calculation"
      - "VehicleOrder.version increments by 1 on every successful transition"

  - method: POST
    path: "/evfleet/vehicles"
    description: "Register a produced VIN against an order, allocating a PASSED battery module; OCC on VehicleOrder.version; weekly ramp capacity gate applies"
    roles: [ProductionPlanner]
    code: 201
    input: [vehicle_order_id, battery_module_id, vin, expected_vehicle_order_version]
    output: Vehicle
    side_effects:
      - "BatteryModule PASSED -> ALLOCATED"
      - "VehicleOrder.registered_count increments by 1; VehicleOrder.version increments by 1"
      - "Auto-transition: first VIN moves CONFIRMED -> IN_PRODUCTION; registered_count == quantity moves IN_PRODUCTION -> FULFILLED"
      - "production_capacity_gate evaluated (ERR_RAMP_CAPACITY_EXCEEDED)"

  - method: GET
    path: "/evfleet/vehicles/{id}"
    description: "Read one vehicle incl. SOH, software_hold, EOL valuation fields"
    roles: [PlatformAdmin, FleetManager, ServiceDispatcher, ServiceTechnician, ReleaseManager, ProductionPlanner, TelematicsIngestion]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/evfleet/vehicles"
    description: "List vehicles, filterable by order or battery module"
    roles: [PlatformAdmin, FleetManager, ServiceDispatcher, ServiceTechnician, ReleaseManager, ProductionPlanner]
    code: 200
    input: ["vehicle_order_id?", "battery_module_id?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: POST
    path: "/evfleet/vehicles/{id}/transition"
    description: "Advance one of the vehicle's parallel state dimensions: DELIVERY (IN_TRANSIT / AT_DEPOT / COMMISSIONED) or TELEMATICS (PROVISIONED / ACTIVE / SUSPENDED)"
    roles: [ServiceDispatcher]
    code: 200
    input: [dimension, to_state]
    output: Vehicle
    side_effects:
      - "DELIVERY COMMISSIONED: charging_demand_gate when the order requires depot charging"
      - "every mutation recomputes the parent order's hold_count"

  - method: POST
    path: "/evfleet/vehicles/{id}/battery-health"
    description: "Telematics battery-health report ingestion; crossing below SOH_EOL_THRESHOLD moves the vehicle into EOL_REVIEW and computes both battery_eol_valuation variants"
    roles: [TelematicsIngestion]
    code: 200
    input: [measured_soh_pct, measured_at]
    output: Vehicle
    side_effects:
      - "current_soh_pct := measured_soh_pct; last_battery_report_at := measured_at"
      - "if measured_soh_pct < 70.0 (strict): battery_eol_status := EOL_REVIEW (sticky) and both eol valuations computed"

  - method: POST
    path: "/evfleet/service-centers"
    description: "Stand up a limited service center"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, state_code, bay_count]
    output: ServiceCenter
    side_effects: []

  - method: GET
    path: "/evfleet/service-centers/{id}"
    description: "Read one service center"
    roles: [PlatformAdmin, ServiceDispatcher, ServiceTechnician]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []

  - method: GET
    path: "/evfleet/service-centers/{id}/mobile-vans"
    description: "List mobile vans homed at a center"
    roles: [PlatformAdmin, ServiceDispatcher, ServiceTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: "MobileVan[]"
    side_effects: []

  - method: GET
    path: "/evfleet/service-centers/{id}/parts-stocks"
    description: "List parts stock rows at a center"
    roles: [PlatformAdmin, ServiceDispatcher, ServiceTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: "PartsStock[]"
    side_effects: []

  - method: POST
    path: "/evfleet/mobile-vans"
    description: "Commission a mobile service van homed at a service center"
    roles: [ServiceDispatcher]
    code: 201
    input: [service_center_id, van_code]
    output: MobileVan
    side_effects: []

  - method: POST
    path: "/evfleet/service-visits"
    description: "Book a service visit for a COMMISSIONED vehicle at a center or a mobile van (exactly one); reserves parts and enforces the van travel-buffer overlap rule"
    roles: [FleetManager]
    code: 201
    input: [vehicle_id, "service_center_id?", "mobile_van_id?", window_start, window_end, purpose, parts_lines]
    output: ServiceVisit
    side_effects:
      - "Parts reservation: per parts_lines entry, PartsStock.reserved_qty += qty at the stocking center (ERR_PARTS_INSUFFICIENT when on_hand_qty - reserved_qty < qty)"

  - method: GET
    path: "/evfleet/service-visits/{id}"
    description: "Read one service visit"
    roles: [PlatformAdmin, FleetManager, ServiceDispatcher, ServiceTechnician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: GET
    path: "/evfleet/service-visits"
    description: "List service visits, filterable by vehicle, center, or van"
    roles: [PlatformAdmin, FleetManager, ServiceDispatcher, ServiceTechnician]
    code: 200
    input: ["vehicle_id?", "service_center_id?", "mobile_van_id?", "limit?", "offset?"]
    output: "ServiceVisit[]"
    side_effects: []

  - method: POST
    path: "/evfleet/service-visits/{id}/transition"
    description: "IN_PROGRESS / COMPLETED by ServiceTechnician; CANCELLED by the owning FleetManager (releases reserved parts)"
    roles: [FleetManager, ServiceTechnician]
    code: 200
    input: [to_state]
    output: ServiceVisit
    side_effects:
      - "COMPLETED: parts consumed (reserved_qty -= qty, on_hand_qty -= qty, consumed_total_qty += qty); restock_needed recomputed; completed_by_user_id recorded"
      - "CANCELLED: reserved parts released (reserved_qty -= qty); restock_needed recomputed"

  - method: POST
    path: "/evfleet/parts-stocks"
    description: "Upsert a parts stock row at a center: creates (service_center_id, sku) when absent, else applies qty_delta as a receipt (positive) or adjustment (negative, never below 0 on hand)"
    roles: [ServiceDispatcher]
    code: 201
    input: [service_center_id, sku, qty_delta, reorder_threshold]
    output: PartsStock
    side_effects:
      - "on_hand_qty += qty_delta; received_total_qty += qty_delta; restock_needed recomputed (negative qty_delta may not drive on_hand_qty below 0 -> ERR_VALIDATION)"
      - "Invariant maintained (parts_conservation_invariant): received_total_qty == on_hand_qty + consumed_total_qty"

  - method: POST
    path: "/evfleet/software-campaigns"
    description: "Create a staged-rollout software campaign (DRAFT)"
    roles: [ReleaseManager]
    code: 201
    input: [target_version, telematics_tier_scope]
    output: SoftwareCampaign
    side_effects: []

  - method: GET
    path: "/evfleet/software-campaigns/{id}"
    description: "Read one campaign incl. results array and counters"
    roles: [PlatformAdmin, ReleaseManager, TelematicsIngestion]
    code: 200
    input: []
    output: SoftwareCampaign
    side_effects: []

  - method: POST
    path: "/evfleet/software-campaigns/{id}/transition"
    description: "Stage advance (CANARY/EXPANDED/GENERAL gated by campaign_rollout_gate), PAUSED with resume to paused_from, COMPLETE from GENERAL, ROLLED_BACK with the vehicle-hold cascade"
    roles: [ReleaseManager]
    code: 200
    input: [to_state]
    output: SoftwareCampaign
    side_effects:
      - "ROLLED_BACK cascade: held vehicles (SUCCESS + telematics ACTIVE) get software_hold; IN_TRANSIT held vehicles revert to ASSEMBLED; parent orders' hold_count recomputed"

  - method: POST
    path: "/evfleet/software-campaigns/{id}/vehicle-results"
    description: "Telematics reports one vehicle's update outcome; vehicle must be telematics ACTIVE, in tier scope, and not already recorded"
    roles: [TelematicsIngestion]
    code: 201
    input: [vehicle_id, result]
    output: SoftwareCampaign
    side_effects:
      - "results appended; succeeded_count / failed_count recomputed"
      - "on SUCCESS: Vehicle.software_version := campaign.target_version"

  - method: POST
    path: "/evfleet/warranty-claims"
    description: "Submit a warranty claim for a COMMISSIONED vehicle of the caller's customer"
    roles: [FleetManager]
    code: 201
    input: [vehicle_id, "service_visit_id?", claim_lines]
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/evfleet/warranty-claims/{id}"
    description: "Read one warranty claim incl. computed settlement_cents"
    roles: [PlatformAdmin, FleetManager, ServiceTechnician, ClaimsAdjuster]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/evfleet/warranty-claims"
    description: "List warranty claims, filterable by vehicle or service visit"
    roles: [PlatformAdmin, FleetManager, ServiceTechnician, ClaimsAdjuster]
    code: 200
    input: ["vehicle_id?", "service_visit_id?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: POST
    path: "/evfleet/warranty-claims/{id}/diagnose"
    description: "ServiceTechnician records diagnosis (SUBMITTED -> DIAGNOSED)"
    roles: [ServiceTechnician]
    code: 200
    input: [diagnosis_notes]
    output: WarrantyClaim
    side_effects: ["diagnosed_by_user_id := X-User-ID"]

  - method: POST
    path: "/evfleet/warranty-claims/{id}/adjudicate"
    description: "ClaimsAdjuster approves (computes warranty_settlement, -> SETTLED) or denies (-> DENIED); adjudicator must differ from diagnostician"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "denial_reason?"]
    output: WarrantyClaim
    side_effects: ["APPROVE: settlement_cents computed by warranty_settlement; adjudicated_by_user_id := X-User-ID"]

  - method: POST
    path: "/evfleet/uptime-contracts"
    description: "Create an uptime commitment contract for a fleet customer"
    roles: [PlatformAdmin]
    code: 201
    input: [fleet_customer_id, committed_uptime_pct, monthly_service_fee_cents, pro_rating, measurement_start_date]
    output: UptimeContract
    side_effects: []

  - method: POST
    path: "/evfleet/uptime-contracts/{id}/downtime-events"
    description: "Append a vehicle downtime event (open when ended_at omitted); OCC on UptimeContract.version"
    roles: [TelematicsIngestion]
    code: 201
    input: [vehicle_id, started_at, "ended_at?", expected_uptime_contract_version]
    output: UptimeContract
    side_effects: ["downtime_events appended; UptimeContract.version increments by 1"]

  - method: POST
    path: "/evfleet/uptime-contracts/{id}/close-month"
    description: "Close a measurement month: computes uptime_credit per the contract's pro_rating variant; months close strictly in chronological order, each exactly once"
    roles: [PlatformAdmin]
    code: 200
    input: [month]
    output: UptimeContract
    side_effects:
      - "last_closed_month := month; last_uptime_pct / last_credit_cents computed; lifetime_credit_cents accumulates"
      - "UptimeContract.version increments by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint (or for the requested to_state on a multi-role transition endpoint)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "FleetManager's X-User-ID does not equal the owning FleetCustomer id of the resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed or missing required field; empty diagnosis_notes / denial_reason / utility_denial_reason; visit with both or neither of service_center_id / mobile_van_id; empty claim_lines; enum value outside its declared set" }
  - { id: ERR_WINDOW_INVALID, http: 400, condition: "window_end not after window_start (visits); install_window_end before install_window_start (projects); month not YYYY-MM or before measurement_start_date's month" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state that offers the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC, per §1.2.1)" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 403, condition: "Segregation of duties breached: inspector == module registrar, auditor == supplier registrar, or adjudicator == claim diagnostician" }
  - { id: ERR_FRANCHISE_EXEMPTION_REQUIRED, http: 422, condition: "Approving a DIRECT_DELIVERY order whose depot sits in a franchise-blocked state without an exemption_document_ref" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "vin (or van_code) already exists" }
  - { id: ERR_MODULE_NOT_PASSED, http: 409, condition: "Battery module is not in PASSED state at VIN registration" }
  - { id: ERR_MODULE_PACK_MISMATCH, http: 422, condition: "Module pack_kwh differs from the order's battery_pack_kwh" }
  - { id: ERR_RAMP_CAPACITY_EXCEEDED, http: 422, condition: "registrations this ISO week already equal weekly_capacity_units from production_capacity_gate" }
  - { id: ERR_DEPOT_CAPACITY_EXCEEDED, http: 422, condition: "requested_capacity_kw exceeds depot headroom (total - committed) at create" }
  - { id: ERR_INSTALL_WINDOW_CONFLICT, http: 409, condition: "Aggregate crew demand of overlapping install windows at one depot would exceed MAX_DEPOT_CREW" }
  - { id: ERR_CHARGING_CAPACITY_INSUFFICIENT, http: 422, condition: "charging_demand_gate fails at vehicle commissioning (commissioned kW * 0.8 below required draw)" }
  - { id: ERR_SOFTWARE_HOLD, http: 409, condition: "Delivery advance blocked by software_hold (campaign rollback recall)" }
  - { id: ERR_TELEMATICS_NOT_ACTIVE, http: 409, condition: "Vehicle telematics not ACTIVE where required (commissioning, campaign results, battery reports)" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "vehicle-results submitted while campaign is not in {CANARY, EXPANDED, GENERAL}" }
  - { id: ERR_DUPLICATE_VEHICLE_RESULT, http: 409, condition: "A result for this vehicle already exists in the campaign" }
  - { id: ERR_EMPTY_COHORT, http: 409, condition: "Stage advance attempted with zero recorded results" }
  - { id: ERR_ROLLOUT_GATE_FAILED, http: 409, condition: "Stage advance failed cohort-size or success-rate gate" }
  - { id: ERR_VAN_SCHEDULE_CONFLICT, http: 409, condition: "Mobile visit violates the same-van 45-minute travel-buffer separation rule" }
  - { id: ERR_PARTS_INSUFFICIENT, http: 409, condition: "on_hand_qty - reserved_qty below a requested parts line at the stocking center" }
  - { id: ERR_SERVICE_VISIT_NOT_COMPLETED, http: 422, condition: "Claim references a visit that is missing, belongs to another vehicle, or is not COMPLETED" }
  - { id: ERR_VEHICLE_NOT_IN_SERVICE, http: 409, condition: "Service visit or warranty claim attempted on a vehicle that is not COMMISSIONED" }
  - { id: ERR_CLAIM_NOT_DIAGNOSED, http: 409, condition: "Adjudication attempted on a claim still in SUBMITTED" }
  - { id: ERR_MONTH_ALREADY_CLOSED, http: 409, condition: "close-month for a month equal to last_closed_month" }
  - { id: ERR_MONTH_OUT_OF_ORDER, http: 409, condition: "close-month for a month earlier than last_closed_month, or before measurement_start_date's month" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manufacturer platform operator; owns customer onboarding, service-center build-out, uptime contracts, month close, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /evfleet/fleet-customers", "POST /evfleet/service-centers", "POST /evfleet/uptime-contracts", "POST /evfleet/uptime-contracts/{id}/close-month"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionPlanner
    description: "Production ramp planner; registers suppliers and battery modules, registers VINs, sends modules to rework"
    identity: opaque
    exclusive_operations: ["POST /evfleet/suppliers", "POST /evfleet/battery-modules", "POST /evfleet/vehicles"]
    shared_operations: ["POST /evfleet/battery-modules/{id}/transition (REWORK only)", "GET endpoints of the production domain"]
  - name: QualityInspector
    description: "Quality gate inspector; runs supplier readiness audits and battery module inspections; may never inspect a module or audit a supplier they registered"
    identity: opaque
    exclusive_operations: ["POST /evfleet/suppliers/{id}/readiness-audits"]
    shared_operations: ["POST /evfleet/battery-modules/{id}/transition (IN_QA / PASSED / FAILED)", "GET endpoints of the production domain"]
  - name: ComplianceOfficer
    description: "Direct-sales compliance reviewer; approves orders or places them on franchise hold"
    identity: opaque
    exclusive_operations: ["POST /evfleet/vehicle-orders/{id}/transition (CONFIRMED / FRANCHISE_HOLD)"]
    shared_operations: ["GET endpoints of the order domain"]
  - name: ChargingCoordinator
    description: "Charging infrastructure coordinator; drives charging projects through utility review, permitting, installation, commissioning, cancellation"
    identity: opaque
    exclusive_operations: ["POST /evfleet/charging-projects/{id}/transition"]
    shared_operations: ["GET endpoints of the depot/charging domain"]
  - name: FleetManager
    description: "Commercial customer's fleet manager; manages own depots, charging project requests, vehicle orders, service visits, and warranty claims"
    identity: "entity_backed:FleetCustomer"
    exclusive_operations: ["POST /evfleet/depots", "POST /evfleet/charging-projects", "POST /evfleet/vehicle-orders", "POST /evfleet/service-visits", "POST /evfleet/warranty-claims"]
    shared_operations: ["POST /evfleet/vehicle-orders/{id}/transition (SUBMITTED / CANCELLED)", "POST /evfleet/service-visits/{id}/transition (CANCELLED)", "GET endpoints of the customer domain"]
  - name: ServiceDispatcher
    description: "Service network dispatcher; commissions mobile vans, stocks parts, advances vehicle delivery and telematics dimensions"
    identity: opaque
    exclusive_operations: ["POST /evfleet/mobile-vans", "POST /evfleet/parts-stocks", "POST /evfleet/vehicles/{id}/transition"]
    shared_operations: ["GET endpoints of the service domain"]
  - name: ServiceTechnician
    description: "Field technician; starts and completes service visits, diagnoses warranty claims"
    identity: opaque
    exclusive_operations: ["POST /evfleet/warranty-claims/{id}/diagnose"]
    shared_operations: ["POST /evfleet/service-visits/{id}/transition (IN_PROGRESS / COMPLETED)", "GET endpoints of the service domain"]
  - name: ClaimsAdjuster
    description: "Warranty adjudicator; settles or denies diagnosed claims; may never adjudicate a claim they diagnosed"
    identity: opaque
    exclusive_operations: ["POST /evfleet/warranty-claims/{id}/adjudicate"]
    shared_operations: ["GET endpoints of the warranty domain"]
  - name: ReleaseManager
    description: "Software release manager; drives staged rollout campaigns, pauses, resumes, rollbacks"
    identity: opaque
    exclusive_operations: ["POST /evfleet/software-campaigns", "POST /evfleet/software-campaigns/{id}/transition"]
    shared_operations: ["GET /evfleet/software-campaigns/{id}", "GET vehicle endpoints"]
  - name: TelematicsIngestion
    description: "Vehicle telematics pipeline identity; pushes battery-health reports, campaign results, and downtime events"
    identity: opaque
    exclusive_operations: ["POST /evfleet/vehicles/{id}/battery-health", "POST /evfleet/software-campaigns/{id}/vehicle-results", "POST /evfleet/uptime-contracts/{id}/downtime-events"]
    shared_operations: ["GET /evfleet/vehicles/{id}", "GET /evfleet/software-campaigns/{id}"]

# =============================================================================
# Platform constants (referenced by entities, state machines, validations)
# =============================================================================
platform_constants:
  FRANCHISE_BLOCKED_STATES: ["TX", "MI", "WV"]
    # Direct manufacturer sales of new vehicles are prohibited in these states;
    # DIRECT_DELIVERY orders delivering there need an exemption_document_ref.
  MAX_DEPOT_CREW: 4
    # Maximum aggregate electrician crew count over mutually-overlapping
    # install windows of {PERMITTING, INSTALLATION} projects at one depot.
  VAN_TRAVEL_BUFFER_MINUTES: 45
    # Minimum separation between consecutive visits on the same mobile van.
  MODULE_MAX_FAILURES: 2
    # A battery module auto-scraps when failure_count reaches this.
  LOGICAL_CLOCK_DEFAULT: "2026-09-01T00:00:00Z"
    # Startup value of the logical clock before any set_current_utc call.
