scenario: |
  Personal Injury Law Firm Case Management: client intake, medical records request,
  Damages model, medical Liens, Demand Letter, settlement negotiation, contingency
  fee settlement, court calendar, Statute of Limitations.
domain_name: personal-injury-case-management
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # All peer entities reference Case via FK (case_id) in body; no nested URL paths.
  state_machine_shape: cyclic
  # SettlementOffer ping-pongs PENDING -> COUNTERED -> PENDING…; MedicalLien
  # has DISPUTED -> NEGOTIATING re-entry; Case has revert paths.
  relationship_patterns:
    - one_to_many                 # Case has many SettlementOffer, DamagesItem, MedicalLien, etc.
    - self_referential            # SettlementOffer.counter_to_offer_id references prior SettlementOffer (chain of rounds)
    - cross_aggregate             # Case.status reads from MedicalLien states (compound check)
  role_model: segregation_of_duties
  # Paralegal does intake; Attorney drafts demand and offers counters; ManagingPartner
  # is the only role that may finalize an accepted settlement; same X-User-ID cannot
  # both draft and approve the same DemandLetter.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name,        type: string,   source: input,    description: "Claimant's legal name (free text)." }
      - { name: email,            type: string,   source: input,    description: "Contact email; unique across Clients.", constraints: "unique" }
      - { name: phone,            type: string,   source: input,    description: "Contact phone (free text)." }
      - { name: retainer_signed,  type: boolean,  source: input,    description: "True iff the client has signed the contingency fee retainer.", default: false }
      - { name: retainer_signed_at, type: datetime, source: system, description: "Server timestamp set when retainer_signed flips false->true; null until then." }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: client_id,                       type: string,   source: input,    description: "FK -> Client.id; the claimant on this case." }
      - { name: accident_date,                   type: datetime, source: input,    description: "Date the injury occurred; immutable after creation.", constraints: "ISO 8601 date; must be in the past relative to current clock at create time" }
      - { name: jurisdiction,                    type: enum,     source: input,    description: "US state/territory for venue and SOL years.", constraints: "one of {CA, NY, TX, FL, IL}" }
      - { name: status,                          type: enum,     source: computed, description: "Case lifecycle. Driven by §1.2 transitions.", constraints: "one of {INTAKE, ACTIVE, DEMAND_SENT, IN_NEGOTIATION, LITIGATION, SETTLED, CLOSED, ABANDONED}", default: "INTAKE" }
      - { name: statute_of_limitations_date,     type: datetime, source: computed, description: "accident_date + statute years for jurisdiction. CA/IL=2y, NY/TX=2y, FL=4y. Recomputed if accident_date or jurisdiction change (none allowed post-create, so it is effectively immutable)." }
      - { name: sol_tolled_days,                 type: integer,  source: input,    description: "Tolling days added to statute_of_limitations_date (e.g., minor claimant, fraudulent concealment).", default: 0, constraints: ">= 0" }
      - { name: filed_in_court,                  type: boolean,  source: computed, description: "True iff a CourtEvent of type FILING has occurred for this Case." }
      - { name: included_damages_total_cents,    type: integer,  source: computed, description: "Sum of DamagesItem.amount_cents where status == INCLUDED. Denormalized; recomputed on every DamagesItem transition." }
      - { name: gross_settlement_cents,          type: integer,  source: computed, description: "Stamped at the moment a SettlementOffer is ACCEPTED; equals that offer.offer_amount_cents. Null while case is unsettled." }

  - name: MedicalProvider
    parent: null
    common_fields: true
    fields:
      - { name: name,    type: string, source: input, description: "Provider name (free text)." }
      - { name: contact, type: string, source: input, description: "Records-department contact email or fax." }

  - name: MedicalRecordsRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id,     type: string, source: input,    description: "FK -> Case.id; the case this records request belongs to." }
      - { name: provider_id, type: string, source: input,    description: "FK -> MedicalProvider.id; the provider being asked for records." }
      - { name: status,      type: enum,   source: computed, description: "Pipeline state. Driven by §1.2.", constraints: "one of {REQUESTED, RECEIVED, REVIEWED, REJECTED}", default: "REQUESTED" }
      - { name: requested_at, type: datetime, source: system, description: "Server timestamp at creation." }
      - { name: received_at,  type: datetime, source: system, description: "Server timestamp when status moves REQUESTED -> RECEIVED; null otherwise." }
      - { name: reviewed_at,  type: datetime, source: system, description: "Server timestamp when status moves RECEIVED -> REVIEWED; null otherwise." }

  - name: DamagesItem
    parent: null
    common_fields: true
    fields:
      - { name: case_id,     type: string,  source: input,    description: "FK -> Case.id; the case this damages line item belongs to." }
      - { name: category,    type: enum,    source: input,    description: "Damages category.", constraints: "one of {MEDICAL_BILLS, LOST_WAGES, PAIN_SUFFERING, FUTURE_MEDICAL, PROPERTY}" }
      - { name: amount_cents, type: integer, source: input,   description: "Claimed dollar amount in cents.", constraints: ">= 0" }
      - { name: status,      type: enum,    source: computed, description: "PROPOSED at create. INCLUDED or EXCLUDED via §1.2 transition.", constraints: "one of {PROPOSED, INCLUDED, EXCLUDED}", default: "PROPOSED" }
      - { name: documentation_note, type: string, source: input, description: "Free-text reference to medical records or wage stubs supporting this line.", default: "" }

  - name: MedicalLien
    parent: null
    common_fields: true
    fields:
      - { name: case_id,                 type: string,  source: input,    description: "FK -> Case.id; the case this lien is asserted against." }
      - { name: provider_id,             type: string,  source: input,    description: "FK -> MedicalProvider.id; the lienholder." }
      - { name: asserted_amount_cents,   type: integer, source: input,    description: "Provider's claimed lien amount in cents.", constraints: ">= 0" }
      - { name: negotiated_amount_cents, type: integer, source: computed, description: "Negotiated payoff; equals asserted_amount_cents until §1.2 NEGOTIATE_DOWN transition sets a lower value. Cannot exceed asserted_amount_cents." }
      - { name: status,                  type: enum,    source: computed, description: "Lien lifecycle.", constraints: "one of {ASSERTED, NEGOTIATING, AGREED, DISPUTED, PAID}", default: "ASSERTED" }

  - name: DemandLetter
    parent: null
    common_fields: true
    fields:
      - { name: case_id,             type: string,  source: input,    description: "FK -> Case.id; the case this demand letter belongs to." }
      - { name: demand_amount_cents, type: integer, source: computed, description: "Computed at draft creation per §1.3 calc.demand_letter_amount; immutable thereafter." }
      - { name: pain_multiplier,     type: number,  source: input,    description: "Multiplier applied to economic damages to produce pain-and-suffering line for demand math.", constraints: ">= 1.0, <= 5.0" }
      - { name: status,              type: enum,    source: computed, description: "Demand letter lifecycle.", constraints: "one of {DRAFT, SENT, ACKNOWLEDGED, WITHDRAWN}", default: "DRAFT" }
      - { name: drafted_by_user_id,  type: string,  source: system,   description: "X-User-ID of the Attorney who created the DRAFT; recorded for §1.7 segregation-of-duties enforcement on send/approve actions." }
      - { name: sent_at,             type: datetime, source: system,  description: "Server timestamp at DRAFT -> SENT; null until sent." }

  - name: SettlementOffer
    parent: null
    common_fields: true
    fields:
      - { name: case_id,              type: string,  source: input,    description: "FK -> Case.id; the case being negotiated." }
      - { name: offer_amount_cents,   type: integer, source: input,    description: "Offer dollar amount in cents.", constraints: ">= 0" }
      - { name: by_party,             type: enum,    source: input,    description: "Which side proposed this offer.", constraints: "one of {CARRIER, FIRM}" }
      - { name: counter_to_offer_id,  type: string,  source: input,    description: "FK -> SettlementOffer.id; the prior offer this one counters. Null for the first offer in a case.", default: null }
      - { name: round_number,         type: integer, source: computed, description: "1 for the first offer on a case; previous offer's round_number + 1 for a counter. Pinned at create." }
      - { name: status,               type: enum,    source: computed, description: "PENDING until COUNTERED, ACCEPTED, REJECTED, or EXPIRED.", constraints: "one of {PENDING, COUNTERED, ACCEPTED, REJECTED, EXPIRED}", default: "PENDING" }
      - { name: responded_at,         type: datetime, source: system,  description: "Server timestamp at PENDING -> {COUNTERED, ACCEPTED, REJECTED}; null otherwise." }

  - name: CourtEvent
    parent: null
    common_fields: true
    fields:
      - { name: case_id,        type: string,   source: input,    description: "FK -> Case.id; the case this calendar entry belongs to." }
      - { name: event_type,     type: enum,     source: input,    description: "Calendar entry type.", constraints: "one of {FILING, HEARING, TRIAL, MEDIATION}" }
      - { name: scheduled_at,   type: datetime, source: input,    description: "ISO 8601 UTC; must be strictly later than current clock at create time." }
      - { name: duration_minutes, type: integer, source: input,   description: "Event length in minutes.", constraints: "> 0, <= 600", default: 60 }
      - { name: status,         type: enum,     source: computed, description: "Calendar entry status.", constraints: "one of {SCHEDULED, OCCURRED, CANCELLED}", default: "SCHEDULED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: case_id,                       type: string,  source: input,    description: "FK -> Case.id; the case being disbursed. One Disbursement per Case." }
      - { name: gross_settlement_cents,        type: integer, source: computed, description: "Copy of Case.gross_settlement_cents at disbursement creation; immutable." }
      - { name: contingency_fee_cents,         type: integer, source: computed, description: "Per §1.3 calc.contingency_fee; pinned at create." }
      - { name: total_lien_payout_cents,       type: integer, source: computed, description: "Sum of MedicalLien.negotiated_amount_cents over liens with status AGREED or PAID for this case, pinned at disbursement create." }
      - { name: net_to_client_cents,           type: integer, source: computed, description: "gross_settlement_cents - contingency_fee_cents - total_lien_payout_cents." }
      - { name: status,                        type: enum,    source: computed, description: "Disbursement lifecycle.", constraints: "one of {PENDING, RELEASED}", default: "PENDING" }

  - name: SystemClock
    parent: null
    common_fields: false
    # Singleton: id is a fixed sentinel "clock"; created_at logged at first set.
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Authoritative wall clock for SOL countdown and CourtEvent ordering. Settable only via POST /_clock/set_current_utc." }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:

  - entity: Case
    initial_state: INTAKE
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /cases/{id}/activate"
        actor: Attorney
        preconditions:
          - "Client.retainer_signed == true for case.client_id"
          - "case.statute_of_limitations_date + sol_tolled_days days > SystemClock.current_utc (SOL not yet expired)"
        side_effects:
          - "Case.status := ACTIVE"
          - "Case.version += 1"

      - from: ACTIVE
        to: DEMAND_SENT
        trigger: "system: DemandLetter.DRAFT -> SENT transition"
        actor: system
        preconditions:
          - "Case.status == ACTIVE"
        side_effects:
          - "Case.status := DEMAND_SENT"
          - "Case.version += 1"

      - from: DEMAND_SENT
        to: IN_NEGOTIATION
        trigger: "system: first SettlementOffer created for the case (POST /settlement-offers)"
        actor: system
        preconditions:
          - "Case.status == DEMAND_SENT"
        side_effects:
          - "Case.status := IN_NEGOTIATION"
          - "Case.version += 1"

      - from: IN_NEGOTIATION
        to: LITIGATION
        trigger: "POST /cases/{id}/file-suit"
        actor: ManagingPartner
        preconditions:
          - "Case.status == IN_NEGOTIATION"
          - "Case.statute_of_limitations_date + sol_tolled_days days > SystemClock.current_utc"
          - "Case.filed_in_court == false"
        side_effects:
          - "Case.status := LITIGATION"
          - "Case.filed_in_court := true"
          - "A CourtEvent with event_type=FILING and scheduled_at=SystemClock.current_utc is created in status=OCCURRED"
          - "Case.version += 1"

      - from: IN_NEGOTIATION
        to: SETTLED
        trigger: "system: a SettlementOffer transitions to ACCEPTED (POST /settlement-offers/{id}/accept)"
        actor: system
        preconditions:
          - "Case.status == IN_NEGOTIATION"
          - "No MedicalLien for this case has status == DISPUTED"
        side_effects:
          - "Case.status := SETTLED"
          - "Case.gross_settlement_cents := accepted_offer.offer_amount_cents"
          - "Every MedicalLien on this case with status ∈ {ASSERTED, NEGOTIATING} auto-transitions to AGREED (cascade depth 2). For each such lien, its negotiated_amount_cents is set to the lesser of asserted_amount_cents and the proportional cap defined by §1.3 calc.lien_proportional_cap (cascade depth 3)."
          - "Every CourtEvent on this case with status==SCHEDULED transitions to CANCELLED (cascade depth 2)."
          - "A Disbursement with status=PENDING is created (cascade depth 2). Its contingency_fee_cents, total_lien_payout_cents, and net_to_client_cents are computed per §1.3 (cascade depth 3)."
          - "Case.version += 1"

      - from: LITIGATION
        to: SETTLED
        trigger: "system: a SettlementOffer transitions to ACCEPTED (POST /settlement-offers/{id}/accept)"
        actor: system
        preconditions:
          - "Case.status == LITIGATION"
          - "No MedicalLien for this case has status == DISPUTED"
        side_effects:
          - "Same cascade as IN_NEGOTIATION -> SETTLED above."
          - "Case.version += 1"

      - from: SETTLED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: ManagingPartner
        preconditions:
          - "Disbursement for this case has status == RELEASED"
          - "Every MedicalLien on this case has status == PAID"
        side_effects:
          - "Case.status := CLOSED"
          - "Case.version += 1"

      - from: INTAKE
        to: ABANDONED
        trigger: "POST /cases/{id}/abandon"
        actor: Attorney
        preconditions:
          - "Case.status == INTAKE"
        side_effects:
          - "Case.status := ABANDONED"
          - "Case.version += 1"

      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /cases/{id}/abandon"
        actor: ManagingPartner
        preconditions:
          - "Case.status == ACTIVE"
        side_effects:
          - "Case.status := ABANDONED"
          - "Case.version += 1"

  - entity: MedicalRecordsRequest
    initial_state: REQUESTED
    terminal_states: [REVIEWED, REJECTED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /medical-records-requests/{id}/receive"
        actor: Paralegal
        preconditions:
          - "MedicalRecordsRequest.status == REQUESTED"
        side_effects:
          - "MedicalRecordsRequest.status := RECEIVED"
          - "MedicalRecordsRequest.received_at := SystemClock.current_utc"
      - from: RECEIVED
        to: REVIEWED
        trigger: "POST /medical-records-requests/{id}/review"
        actor: Attorney
        preconditions:
          - "MedicalRecordsRequest.status == RECEIVED"
        side_effects:
          - "MedicalRecordsRequest.status := REVIEWED"
          - "MedicalRecordsRequest.reviewed_at := SystemClock.current_utc"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /medical-records-requests/{id}/reject"
        actor: Paralegal
        preconditions:
          - "MedicalRecordsRequest.status == REQUESTED"
        side_effects:
          - "MedicalRecordsRequest.status := REJECTED"

  - entity: DamagesItem
    initial_state: PROPOSED
    terminal_states: [EXCLUDED]
    transitions:
      - from: PROPOSED
        to: INCLUDED
        trigger: "POST /damages-items/{id}/include"
        actor: Attorney
        preconditions:
          - "DamagesItem.status == PROPOSED"
          - "Case.status ∈ {ACTIVE, DEMAND_SENT, IN_NEGOTIATION}"
          - "If DamagesItem.category == MEDICAL_BILLS: at least one MedicalRecordsRequest for case_id has status == REVIEWED"
        side_effects:
          - "DamagesItem.status := INCLUDED"
          - "Case.included_damages_total_cents := sum of DamagesItem.amount_cents for case_id where status == INCLUDED (recompute; cascade depth 2 from the include action)."
          - "Case.version += 1"
      - from: PROPOSED
        to: EXCLUDED
        trigger: "POST /damages-items/{id}/exclude"
        actor: Attorney
        preconditions:
          - "DamagesItem.status == PROPOSED"
        side_effects:
          - "DamagesItem.status := EXCLUDED"
      - from: INCLUDED
        to: EXCLUDED
        trigger: "POST /damages-items/{id}/exclude"
        actor: ManagingPartner
        preconditions:
          - "DamagesItem.status == INCLUDED"
          - "Case.status ∈ {ACTIVE, DEMAND_SENT, IN_NEGOTIATION}"
          - "No DemandLetter on case_id has status == SENT or ACKNOWLEDGED (cannot retract a line item already used to compute a sent demand)."
        side_effects:
          - "DamagesItem.status := EXCLUDED"
          - "Case.included_damages_total_cents := sum recompute."
          - "Case.version += 1"

  - entity: MedicalLien
    initial_state: ASSERTED
    terminal_states: [PAID]
    transitions:
      - from: ASSERTED
        to: NEGOTIATING
        trigger: "POST /medical-liens/{id}/negotiate"
        actor: Paralegal
        preconditions:
          - "MedicalLien.status == ASSERTED"
        side_effects:
          - "MedicalLien.status := NEGOTIATING"
      - from: NEGOTIATING
        to: AGREED
        trigger: "POST /medical-liens/{id}/agree"
        actor: Paralegal
        preconditions:
          - "MedicalLien.status == NEGOTIATING"
          - "Request body negotiated_amount_cents <= asserted_amount_cents"
        side_effects:
          - "MedicalLien.negotiated_amount_cents := request.negotiated_amount_cents"
          - "MedicalLien.status := AGREED"
      - from: NEGOTIATING
        to: DISPUTED
        trigger: "POST /medical-liens/{id}/dispute"
        actor: Attorney
        preconditions:
          - "MedicalLien.status == NEGOTIATING"
        side_effects:
          - "MedicalLien.status := DISPUTED"
          - "note: while ANY lien on a case is DISPUTED, any SettlementOffer ACCEPT on that case is rejected — cross-entity guard."
      - from: DISPUTED
        to: NEGOTIATING
        trigger: "POST /medical-liens/{id}/resume-negotiation"
        actor: Attorney
        preconditions:
          - "MedicalLien.status == DISPUTED"
        side_effects:
          - "MedicalLien.status := NEGOTIATING"
        note: "Cyclic dimension: DISPUTED -> NEGOTIATING -> DISPUTED loop allowed."
      - from: AGREED
        to: PAID
        trigger: "system: Disbursement.PENDING -> RELEASED transition"
        actor: system
        preconditions:
          - "MedicalLien.status == AGREED"
          - "Disbursement.status was just transitioned to RELEASED"
        side_effects:
          - "MedicalLien.status := PAID"

  - entity: DemandLetter
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /demand-letters/{id}/send"
        actor: ManagingPartner
        preconditions:
          - "DemandLetter.status == DRAFT"
          - "Case.status == ACTIVE"
          - "At least one MedicalRecordsRequest for case_id has status == REVIEWED"
          - "ManagingPartner's X-User-ID != DemandLetter.drafted_by_user_id (segregation of duties)"
        side_effects:
          - "DemandLetter.status := SENT"
          - "DemandLetter.sent_at := SystemClock.current_utc"
          - "Case.status auto-transitions ACTIVE -> DEMAND_SENT (cascade depth 2)."
          - "Case.version += 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /demand-letters/{id}/acknowledge"
        actor: Attorney
        preconditions:
          - "DemandLetter.status == SENT"
        side_effects:
          - "DemandLetter.status := ACKNOWLEDGED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /demand-letters/{id}/withdraw"
        actor: Attorney
        preconditions:
          - "DemandLetter.status == DRAFT"
        side_effects:
          - "DemandLetter.status := WITHDRAWN"

  - entity: SettlementOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /settlement-offers (new offer with counter_to_offer_id == this offer.id)"
        actor: Attorney
        preconditions:
          - "SettlementOffer.status == PENDING"
          - "Case.status ∈ {IN_NEGOTIATION, LITIGATION}"
          - "If by_party of THIS offer == CARRIER, the counter MUST be by_party == FIRM (and vice versa)"
        side_effects:
          - "SettlementOffer.status := COUNTERED"
          - "SettlementOffer.responded_at := SystemClock.current_utc"
          - "A new SettlementOffer is created with round_number = this.round_number + 1, status PENDING."
        note: "Cyclic shape: PENDING -> COUNTERED -> (new offer) PENDING -> COUNTERED... unbounded round chain."
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /settlement-offers/{id}/accept"
        actor: ManagingPartner
        preconditions:
          - "SettlementOffer.status == PENDING"
          - "Case.status ∈ {IN_NEGOTIATION, LITIGATION}"
          - "No MedicalLien on case_id has status == DISPUTED"
          - "Case.statute_of_limitations_date + sol_tolled_days days > SystemClock.current_utc"
          - "expected_case_version in request body equals current Case.version"
        side_effects:
          - "SettlementOffer.status := ACCEPTED"
          - "SettlementOffer.responded_at := SystemClock.current_utc"
          - "Case auto-transitions to SETTLED (cascade depth 2) with full cascade described under Case.IN_NEGOTIATION_to_SETTLED."
          - "Case.version += 1 (via Case auto-transition)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /settlement-offers/{id}/reject"
        actor: ManagingPartner
        preconditions:
          - "SettlementOffer.status == PENDING"
        side_effects:
          - "SettlementOffer.status := REJECTED"
          - "SettlementOffer.responded_at := SystemClock.current_utc"
      - from: PENDING
        to: EXPIRED
        trigger: "system: clock advances past offer.created_at + 30 days while status is still PENDING; checked on any /cases/{id} read and on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "SettlementOffer.status == PENDING"
          - "SystemClock.current_utc >= SettlementOffer.created_at + 30 days"
        side_effects:
          - "SettlementOffer.status := EXPIRED"
          - "SettlementOffer.responded_at := SystemClock.current_utc"

  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [OCCURRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OCCURRED
        trigger: "POST /court-events/{id}/mark-occurred"
        actor: Attorney
        preconditions:
          - "CourtEvent.status == SCHEDULED"
          - "SystemClock.current_utc >= CourtEvent.scheduled_at"
        side_effects:
          - "CourtEvent.status := OCCURRED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /court-events/{id}/cancel  OR  system cascade on Case SETTLED"
        actor: Attorney | system
        preconditions:
          - "CourtEvent.status == SCHEDULED"
        side_effects:
          - "CourtEvent.status := CANCELLED"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /disbursements/{id}/release"
        actor: ManagingPartner
        preconditions:
          - "Disbursement.status == PENDING"
          - "Case.status == SETTLED"
          - "Every MedicalLien on case_id has status == AGREED"
          - "expected_case_version in request body equals current Case.version"
        side_effects:
          - "Disbursement.status := RELEASED"
          - "Every MedicalLien on case_id with status == AGREED auto-transitions to PAID (cascade depth 2)."
          - "Case.version += 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true OCC races only
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: case-settle-stale-version
    parent_entity: Case
    write_endpoint: "POST /settlement-offers/{id}/accept"
    occ_field: "expected_case_version"
    description: |
      Accepting a SettlementOffer against a Case whose version has advanced
      since the client last observed it is rejected. The canonical case:
      Attorney A reads Case.version=7 with offer X pending; before A accepts,
      Paralegal B includes a new DamagesItem (bumping Case.version to 8). A's
      accept with expected_case_version=7 is now stale because the inclusion
      changes included_damages_total_cents — a number that materially affects
      whether A would still recommend acceptance — and is rejected.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: case-disburse-stale-version
    parent_entity: Case
    write_endpoint: "POST /disbursements/{id}/release"
    occ_field: "expected_case_version"
    description: |
      Releasing a Disbursement against a Case whose version has advanced is
      rejected. Canonical case: ManagingPartner observes Case.version=10
      (Disbursement PENDING); meanwhile Paralegal records a late lien
      payoff adjustment that bumps Case.version to 11. The stale release
      with expected_case_version=10 is rejected to force re-verification.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:

  - name: gross_damages_model
    trigger: "on POST /cases/{id}/damages-summary read; also as input to demand_letter_amount when a DemandLetter is drafted"
    algorithm: aggregation
    formula: |
      # economic_damages = sum of DamagesItem.amount_cents for case where
      #                    status == INCLUDED and category in
      #                    {MEDICAL_BILLS, LOST_WAGES, FUTURE_MEDICAL, PROPERTY}
      # non_economic_damages = sum of DamagesItem.amount_cents for case where
      #                    status == INCLUDED and category == PAIN_SUFFERING
      # gross_economic_only = economic_damages
      # gross_full_model    = economic_damages + non_economic_damages
    input_set: "DamagesItem rows for the case in status INCLUDED only. EXCLUDED and PROPOSED rows are ignored."
    constants: {}
    precision: "integer cents; no rounding required (sum of integers)."
    variants:
      - name: ECONOMIC_ONLY
        when: "DemandLetter.pain_multiplier == 1.0 (conservative model used in clear-liability cases)"
        difference: "PAIN_SUFFERING category contributions are dropped from the sum even if INCLUDED."
      - name: FULL_MODEL
        when: "DemandLetter.pain_multiplier > 1.0 (standard model)"
        difference: "PAIN_SUFFERING contributions are summed in alongside economic categories."

  - name: contingency_fee
    trigger: "system: at SettlementOffer.PENDING -> ACCEPTED, computed during Disbursement creation"
    algorithm: threshold
    formula: |
      # fee_rate = 0.3333  if NOT Case.filed_in_court  (pre-suit)
      #          = 0.40    if     Case.filed_in_court  (post-suit / litigation)
      # contingency_fee_cents = round_half_up(gross_settlement_cents * fee_rate)
      # Rounding rule: multiply integer cents * rate as Decimal, then ROUND_HALF_UP
      # to nearest cent. Single rounding step — applied to the whole product, NOT
      # per-line.
    input_set: "single value: Case.gross_settlement_cents (set at SettlementOffer ACCEPT)."
    constants:
      PRE_SUIT_RATE: 0.3333
      POST_SUIT_RATE: 0.40
    precision: "integer cents; round_half_up at final step."
    variants:
      - name: PRE_SUIT
        when: "Case.filed_in_court == false at the moment of ACCEPT"
        difference: "Uses 33.33% rate; lower fee."
      - name: POST_SUIT
        when: "Case.filed_in_court == true at the moment of ACCEPT"
        difference: "Uses 40.00% rate; higher fee. The same gross_settlement_cents yields a different contingency_fee_cents than PRE_SUIT — dual-variant divergence on cost accounting."

  - name: demand_letter_amount
    trigger: "system: on POST /demand-letters (DRAFT creation)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: included_damages_total broken down by category, pain_multiplier m.
      # Step A — per-category line computation (rounding step 1, per line):
      #   medical_line   = round_half_up(sum(MEDICAL_BILLS amounts) * 1.00)
      #   wages_line     = round_half_up(sum(LOST_WAGES amounts)    * 1.00)
      #   property_line  = round_half_up(sum(PROPERTY amounts)      * 1.00)
      #   future_med_line = round_half_up(sum(FUTURE_MEDICAL amounts) * FUTURE_MED_PV_FACTOR)
      #   pain_line      = round_half_up((medical_line + wages_line + future_med_line) * m)
      # Step B — subtotal:
      #   subtotal = medical_line + wages_line + property_line + future_med_line + pain_line
      # Step C — negotiation buffer (tiered on subtotal):
      #   buffer_rate = 0.20 if subtotal <  5_000_00 cents ($5,000)
      #               = 0.15 if 5_000_00  <= subtotal <  50_000_00
      #               = 0.10 if subtotal  >= 50_000_00 cents ($50,000)
      #   buffer = round_half_up(subtotal * buffer_rate)   # rounding step 2
      # Step D — final demand:
      #   demand_amount_cents = subtotal + buffer
      #
      # Order is pinned: ROUND PER LINE FIRST, then sum; ROUND BUFFER once at end.
      # Summing then rounding the whole thing yields a different cent value
      # because Step A's per-line rounds are themselves additive — this is the
      # nested-rounding (Rule 2 mode b) trap.
    input_set: "DamagesItem rows for the case where status == INCLUDED at moment of draft."
    constants:
      FUTURE_MED_PV_FACTOR: 0.85   # present-value discount on future medical
      TIER_LOW_CENTS: 500000       # $5,000
      TIER_HIGH_CENTS: 5000000     # $50,000
      BUFFER_RATE_LOW: 0.20
      BUFFER_RATE_MID: 0.15
      BUFFER_RATE_HIGH: 0.10
    precision: "integer cents; round_half_up per Step A and Step C; no rounding at Step B or D (pure integer sum)."
    variants: []

  - name: net_to_client
    trigger: "system: at SettlementOffer.PENDING -> ACCEPTED, during Disbursement creation"
    algorithm: constraint_propagation
    formula: |
      # The contingency_fee_cents depends on gross_settlement_cents AND on
      # case.filed_in_court (a tier). The total_lien_payout_cents also depends
      # on gross_settlement_cents via lien_proportional_cap. The net therefore
      # has a circular-looking shape that the scaffold pins as a strict order:
      #
      # Step 1: gross := Case.gross_settlement_cents (already stamped at ACCEPT).
      # Step 2: fee   := contingency_fee(gross, Case.filed_in_court)
      #                  (per §1.3 contingency_fee).
      # Step 3: distributable_to_liens := gross - fee
      #         (NOT gross alone — fee comes off the top before liens are
      #         paid; this is the law-firm convention.)
      # Step 4: for each MedicalLien on the case currently in {ASSERTED,
      #         NEGOTIATING, AGREED} sorted by created_at ASC (tie-break),
      #         lien.negotiated_amount_cents := min(
      #             lien.asserted_amount_cents,
      #             lien_proportional_cap(lien, distributable_to_liens)
      #         )    (see lien_proportional_cap calc below)
      # Step 5: total_lien_payout_cents := sum of negotiated_amount_cents over
      #         those liens.
      # Step 6: net_to_client_cents := gross - fee - total_lien_payout_cents.
      #
      # Order is pinned because Step 2 depends on a tier flag (filed_in_court)
      # that itself depends on case state, NOT on gross — but Step 4 depends on
      # the (gross - fee) result of Steps 1-2. Evaluating in reverse order
      # ("compute liens first, then fee on what's left") yields a different net.
    input_set: "Case + its MedicalLien set + Case.filed_in_court flag."
    constants: {}
    precision: "integer cents; rounding handled by sub-calcs (contingency_fee, lien_proportional_cap)."
    variants: []

  - name: lien_proportional_cap
    trigger: "system: invoked during Case.SETTLED cascade; caps each lien's payout proportionally to a finite distributable pool."
    algorithm: waterfall_allocation
    formula: |
      # Inputs: distributable_to_liens (cents), and the set L of MedicalLiens
      # for this case in status {ASSERTED, NEGOTIATING, AGREED} at the moment
      # of SETTLED, ordered by created_at ASC (tie-break — never by id).
      # Constants:
      #   FULL_PAYOUT_RATIO = 1.00   (if total_asserted <= distributable, every
      #                               lien gets its asserted amount.)
      # total_asserted = sum(l.asserted_amount_cents for l in L)
      # if total_asserted <= distributable_to_liens:
      #     for l in L (created_at ASC): cap_l = l.asserted_amount_cents
      #     return
      # else:
      #     # Waterfall: pay each lien in created_at order at the
      #     # SHRINK_RATIO = distributable_to_liens / total_asserted,
      #     # rounded down to whole cents per lien; assign the remainder
      #     # (distributable_to_liens - sum(cap_l)) cent-by-cent to the
      #     # OLDEST liens (lowest created_at) until exhausted.
      #     SHRINK_RATIO = distributable_to_liens / total_asserted
      #     for l in L: cap_l = floor(l.asserted_amount_cents * SHRINK_RATIO)
      #     remainder = distributable_to_liens - sum(cap_l)
      #     for l in L (created_at ASC):
      #         if remainder == 0: break
      #         cap_l += 1
      #         remainder -= 1
    input_set: "MedicalLien rows for the case in status {ASSERTED, NEGOTIATING, AGREED}, sorted by created_at ASC."
    constants:
      FULL_PAYOUT_RATIO: 1.00
    precision: "integer cents; floor per lien on the shrink-ratio multiplication, then cent-by-cent remainder allocation to oldest first."
    variants: []

  - name: statute_of_limitations_check
    trigger: "guard: invoked on every Case.ACTIVATE, file-suit, demand-letter draft/send, and settlement-offer accept."
    algorithm: threshold
    formula: |
      # effective_sol_date = Case.accident_date
      #                      + statute_years[Case.jurisdiction]
      #                      + Case.sol_tolled_days * 1 day
      # Boundary semantics (PINNED):
      #   if SystemClock.current_utc >= effective_sol_date:
      #       SOL has EXPIRED. Reject with ERR_STATUTE_EXPIRED.
      #   else:
      #       SOL still valid.
      # i.e., the boundary is closed on the EXPIRED side: at the exact
      # microsecond the clock equals effective_sol_date, the statute has run.
    input_set: "Case + SystemClock."
    constants:
      STATUTE_YEARS:
        CA: 2
        NY: 2
        TX: 2
        FL: 4
        IL: 2
    precision: "datetime comparison at second resolution."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — ordered by priority
# ---------------------------------------------------------------------------

validations:

  # ----- 1: Authentication -----
  - priority: 1
    category: auth
    check: "Request includes X-User-Role header"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all except POST /clients/register and POST /_clock/set_current_utc"

  # ----- 2: Authorization -----
  - priority: 2
    category: auth
    check: "X-User-Role is allowed for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  # ----- 3: Existence (left-to-right path parsing) -----
  - priority: 3
    category: existence
    check: "Every {id} segment in the path resolves to an existing entity of the expected type"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all GET/PUT/PATCH/DELETE and POST sub-resource endpoints"

  - priority: 4
    category: existence
    check: "Every FK in the request body resolves to an existing entity (client_id, case_id, provider_id, counter_to_offer_id when non-null)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH endpoints with FK fields"

  # ----- 5: State preconditions -----
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is permitted (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state preconditions hold (e.g., Case.status for child mutations; lien states for settlement; CourtEvent terminal-state cascades)"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /demand-letters, POST /demand-letters/{id}/send, POST /settlement-offers, POST /settlement-offers/{id}/accept, POST /damages-items/{id}/include, POST /disbursements/{id}/release"

  # ----- 7: Business safety / compliance -----
  - priority: 7
    category: business_safety
    check: "Statute of Limitations has not run for this Case (per §1.3 statute_of_limitations_check)"
    error_id: ERR_STATUTE_EXPIRED
    http_status: 422
    applies_to: "POST /cases/{id}/activate, POST /cases/{id}/file-suit, POST /demand-letters, POST /settlement-offers/{id}/accept"

  - priority: 8
    category: business_safety
    check: "Segregation of duties on DemandLetter send: the ManagingPartner sending the letter MUST NOT have drafted it (X-User-ID mismatch)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /demand-letters/{id}/send"

  - priority: 9
    category: business_safety
    check: "Client.retainer_signed must be true before any case derived from that client can leave INTAKE"
    error_id: ERR_RETAINER_MISSING
    http_status: 422
    applies_to: "POST /cases/{id}/activate"

  # ----- 10: Business referential -----
  - priority: 10
    category: business_referential
    check: "DamagesItem.category == MEDICAL_BILLS requires at least one MedicalRecordsRequest on case_id with status == REVIEWED before it can be INCLUDED"
    error_id: ERR_MISSING_MEDICAL_RECORDS
    http_status: 422
    applies_to: "POST /damages-items/{id}/include"

  - priority: 11
    category: business_referential
    check: "DemandLetter draft requires Case.status == ACTIVE and at least one MedicalRecordsRequest on case_id with status == REVIEWED"
    error_id: ERR_DEMAND_PREREQUISITES_NOT_MET
    http_status: 422
    applies_to: "POST /demand-letters"

  # ----- 12: Business temporal -----
  - priority: 12
    category: business_temporal
    check: "CourtEvent.scheduled_at must be strictly later than SystemClock.current_utc at create"
    error_id: ERR_EVENT_IN_PAST
    http_status: 422
    applies_to: "POST /court-events"

  - priority: 13
    category: business_temporal
    check: "New CourtEvent of type HEARING/TRIAL/MEDIATION on a Case must not overlap an existing SCHEDULED CourtEvent on the same Case once a 24-hour buffer is applied at both ends — i.e., reject if [new.scheduled_at - 24h, new.scheduled_at + new.duration_minutes + 24h] intersects [existing.scheduled_at, existing.scheduled_at + existing.duration_minutes] (closed on both ends)"
    error_id: ERR_COURT_EVENT_CONFLICT
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 14
    category: business_temporal
    check: "New MedicalRecordsRequest must not duplicate an existing one with status IN {REQUESTED, RECEIVED} for the same (case_id, provider_id). Pure point-in-time overlap with no buffer (any two active requests collide regardless of time)."
    error_id: ERR_DUPLICATE_RECORDS_REQUEST
    http_status: 409
    applies_to: "POST /medical-records-requests"

  # ----- 15: Business constraint / fiscal -----
  - priority: 15
    category: business_constraint
    check: "Settlement offer.counter_to_offer_id must refer to an offer on the SAME case_id whose status == PENDING and whose by_party is opposite this offer's by_party"
    error_id: ERR_INVALID_COUNTER
    http_status: 422
    applies_to: "POST /settlement-offers"

  - priority: 16
    category: business_fiscal
    check: "DamagesItem.amount_cents <= JURISDICTIONAL_DAMAGES_CAP_CENTS per category. Cap for PAIN_SUFFERING in CA/FL is $250,000 (25_000_000 cents); other categories unlimited."
    error_id: ERR_DAMAGES_OVER_CAP
    http_status: 422
    applies_to: "POST /damages-items"

  - priority: 17
    category: business_fiscal
    check: "MedicalLien.agree: request body negotiated_amount_cents <= asserted_amount_cents"
    error_id: ERR_LIEN_OVERPAYMENT
    http_status: 422
    applies_to: "POST /medical-liens/{id}/agree"

  - priority: 18
    category: business_referential
    check: "Settlement offer.accept: cannot accept while any MedicalLien on case_id has status == DISPUTED"
    error_id: ERR_DISPUTED_LIEN_BLOCKS_SETTLEMENT
    http_status: 422
    applies_to: "POST /settlement-offers/{id}/accept"

  # ----- 19: OCC -----
  - priority: 19
    category: business_constraint
    check: "expected_case_version in request body equals current Case.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /settlement-offers/{id}/accept, POST /disbursements/{id}/release"

  # ----- 20: Generic input shape (lowest priority — only fires when none above match) -----
  - priority: 20
    category: business_constraint
    check: "Required fields present and well-formed (enum membership, numeric ranges, ISO 8601 dates)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:

  # ----- Clients -----
  - method: POST
    path: "/clients/register"
    description: "Create a new client (intake step 1). No auth required (public-form-like)."
    roles: [Anonymous, Paralegal]
    code: 201
    input: [full_name, email, phone]
    output: Client
    side_effects:
      - "Client created with retainer_signed=false."

  - method: POST
    path: "/clients/{id}/sign-retainer"
    description: "Mark this client as having signed the contingency retainer."
    roles: [Paralegal]
    code: 200
    input: []
    output: Client
    side_effects:
      - "Client.retainer_signed := true; Client.retainer_signed_at := SystemClock.current_utc."

  - method: GET
    path: "/clients/{id}"
    description: "Read a client by id."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients with pagination and optional email filter."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "email?"]
    output: Client[]
    side_effects: []

  # ----- Cases -----
  - method: POST
    path: "/cases"
    description: "Open a new case (intake step 2). Status starts INTAKE."
    roles: [Paralegal]
    code: 201
    input: [client_id, accident_date, jurisdiction, "sol_tolled_days?"]
    output: Case
    side_effects:
      - "Case created in status=INTAKE."
      - "statute_of_limitations_date computed per §1.3 statute_of_limitations_check using accident_date, jurisdiction, sol_tolled_days."

  - method: GET
    path: "/cases/{id}"
    description: "Read a case by id (also re-evaluates SettlementOffer expirations against the current clock as a side effect of read)."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Any SettlementOffer on this case with status==PENDING and created_at+30d <= SystemClock.current_utc transitions to EXPIRED (auto)."

  - method: GET
    path: "/cases"
    description: "List cases with pagination + filter."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "status?", "client_id?", "jurisdiction?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/activate"
    description: "Move case INTAKE -> ACTIVE."
    roles: [Attorney]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Case transition per §1.2."
      - "Increments Case.version by 1."

  - method: POST
    path: "/cases/{id}/abandon"
    description: "Move case INTAKE|ACTIVE -> ABANDONED."
    roles: [Attorney, ManagingPartner]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Case transition per §1.2."
      - "Increments Case.version by 1."

  - method: POST
    path: "/cases/{id}/file-suit"
    description: "Move case IN_NEGOTIATION -> LITIGATION and emit a FILING CourtEvent."
    roles: [ManagingPartner]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Case.status := LITIGATION; Case.filed_in_court := true."
      - "Creates a CourtEvent of type=FILING, status=OCCURRED, scheduled_at=SystemClock.current_utc."
      - "Increments Case.version by 1."

  - method: POST
    path: "/cases/{id}/close"
    description: "Move case SETTLED -> CLOSED."
    roles: [ManagingPartner]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Case.status := CLOSED."
      - "Increments Case.version by 1."

  - method: GET
    path: "/cases/{id}/damages-summary"
    description: "Returns gross damages model (ECONOMIC_ONLY and FULL_MODEL) for the case."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: "{ case_id: string, included_damages_total_cents: integer, gross_economic_only_cents: integer, gross_full_model_cents: integer }"
    side_effects: []

  # ----- Medical providers -----
  - method: POST
    path: "/medical-providers"
    description: "Register a medical provider."
    roles: [Paralegal]
    code: 201
    input: [name, contact]
    output: MedicalProvider
    side_effects: []

  - method: GET
    path: "/medical-providers/{id}"
    description: "Read a provider by id."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: MedicalProvider
    side_effects: []

  - method: GET
    path: "/medical-providers"
    description: "List providers."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: MedicalProvider[]
    side_effects: []

  # ----- Medical records requests -----
  - method: POST
    path: "/medical-records-requests"
    description: "Request medical records from a provider for a case."
    roles: [Paralegal]
    code: 201
    input: [case_id, provider_id]
    output: MedicalRecordsRequest
    side_effects:
      - "Status REQUESTED; requested_at stamped."

  - method: GET
    path: "/medical-records-requests/{id}"
    description: "Read a single records request."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: MedicalRecordsRequest
    side_effects: []

  - method: GET
    path: "/medical-records-requests"
    description: "List records requests with optional case_id/provider_id filter."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "case_id?", "provider_id?", "status?"]
    output: MedicalRecordsRequest[]
    side_effects: []

  - method: POST
    path: "/medical-records-requests/{id}/receive"
    description: "Mark records request REQUESTED -> RECEIVED."
    roles: [Paralegal]
    code: 200
    input: []
    output: MedicalRecordsRequest
    side_effects:
      - "Status transition per §1.2; received_at stamped."

  - method: POST
    path: "/medical-records-requests/{id}/review"
    description: "Mark records request RECEIVED -> REVIEWED."
    roles: [Attorney]
    code: 200
    input: []
    output: MedicalRecordsRequest
    side_effects:
      - "Status transition per §1.2; reviewed_at stamped."

  - method: POST
    path: "/medical-records-requests/{id}/reject"
    description: "Mark records request REQUESTED -> REJECTED."
    roles: [Paralegal]
    code: 200
    input: []
    output: MedicalRecordsRequest
    side_effects: []

  # ----- Damages items -----
  - method: POST
    path: "/damages-items"
    description: "Add a new damages line item (status PROPOSED)."
    roles: [Paralegal, Attorney]
    code: 201
    input: [case_id, category, amount_cents, "documentation_note?"]
    output: DamagesItem
    side_effects: []

  - method: GET
    path: "/damages-items/{id}"
    description: "Read a damages item."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: DamagesItem
    side_effects: []

  - method: GET
    path: "/damages-items"
    description: "List damages items with filter."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?", "category?"]
    output: DamagesItem[]
    side_effects: []

  - method: POST
    path: "/damages-items/{id}/include"
    description: "Promote a damages item PROPOSED -> INCLUDED."
    roles: [Attorney]
    code: 200
    input: []
    output: DamagesItem
    side_effects:
      - "DamagesItem.status := INCLUDED."
      - "Case.included_damages_total_cents recomputed."
      - "Case.version += 1."

  - method: POST
    path: "/damages-items/{id}/exclude"
    description: "Move a damages item to EXCLUDED."
    roles: [Attorney, ManagingPartner]
    code: 200
    input: []
    output: DamagesItem
    side_effects:
      - "DamagesItem.status := EXCLUDED."
      - "Case.included_damages_total_cents recomputed if previously INCLUDED."
      - "Case.version += 1 if previously INCLUDED."

  # ----- Medical liens -----
  - method: POST
    path: "/medical-liens"
    description: "Record an asserted medical lien against the case."
    roles: [Paralegal]
    code: 201
    input: [case_id, provider_id, asserted_amount_cents]
    output: MedicalLien
    side_effects:
      - "Status ASSERTED; negotiated_amount_cents initialised to asserted_amount_cents."

  - method: GET
    path: "/medical-liens/{id}"
    description: "Read a lien."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: MedicalLien
    side_effects: []

  - method: GET
    path: "/medical-liens"
    description: "List liens with filters."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "case_id?", "provider_id?", "status?"]
    output: MedicalLien[]
    side_effects: []

  - method: POST
    path: "/medical-liens/{id}/negotiate"
    description: "Move lien ASSERTED -> NEGOTIATING."
    roles: [Paralegal]
    code: 200
    input: []
    output: MedicalLien
    side_effects: []

  - method: POST
    path: "/medical-liens/{id}/agree"
    description: "Move lien NEGOTIATING -> AGREED at a negotiated amount."
    roles: [Paralegal]
    code: 200
    input: [negotiated_amount_cents]
    output: MedicalLien
    side_effects:
      - "negotiated_amount_cents updated; status := AGREED."

  - method: POST
    path: "/medical-liens/{id}/dispute"
    description: "Move lien NEGOTIATING -> DISPUTED (blocks settlement)."
    roles: [Attorney]
    code: 200
    input: []
    output: MedicalLien
    side_effects: []

  - method: POST
    path: "/medical-liens/{id}/resume-negotiation"
    description: "Move lien DISPUTED -> NEGOTIATING (cyclic re-entry)."
    roles: [Attorney]
    code: 200
    input: []
    output: MedicalLien
    side_effects: []

  # ----- Demand letters -----
  - method: POST
    path: "/demand-letters"
    description: "Draft a demand letter for a case. demand_amount_cents computed per §1.3."
    roles: [Attorney]
    code: 201
    input: [case_id, pain_multiplier]
    output: DemandLetter
    side_effects:
      - "Status DRAFT; demand_amount_cents computed; drafted_by_user_id stamped to X-User-ID."

  - method: GET
    path: "/demand-letters/{id}"
    description: "Read a demand letter."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: []
    output: DemandLetter
    side_effects: []

  - method: GET
    path: "/demand-letters"
    description: "List demand letters with filter."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?"]
    output: DemandLetter[]
    side_effects: []

  - method: POST
    path: "/demand-letters/{id}/send"
    description: "Move demand letter DRAFT -> SENT; segregation-of-duties enforced."
    roles: [ManagingPartner]
    code: 200
    input: []
    output: DemandLetter
    side_effects:
      - "DemandLetter.status := SENT; sent_at stamped."
      - "Case auto-transition ACTIVE -> DEMAND_SENT."
      - "Increments Case.version by 1."

  - method: POST
    path: "/demand-letters/{id}/acknowledge"
    description: "Move demand letter SENT -> ACKNOWLEDGED."
    roles: [Attorney]
    code: 200
    input: []
    output: DemandLetter
    side_effects: []

  - method: POST
    path: "/demand-letters/{id}/withdraw"
    description: "Move demand letter DRAFT -> WITHDRAWN."
    roles: [Attorney]
    code: 200
    input: []
    output: DemandLetter
    side_effects: []

  # ----- Settlement offers -----
  - method: POST
    path: "/settlement-offers"
    description: "Create a settlement offer (new or counter). If counter_to_offer_id is non-null, that prior offer transitions PENDING -> COUNTERED."
    roles: [Attorney]
    code: 201
    input: [case_id, offer_amount_cents, by_party, "counter_to_offer_id?"]
    output: SettlementOffer
    side_effects:
      - "SettlementOffer created in PENDING; round_number computed."
      - "If counter_to_offer_id is non-null, that prior offer transitions PENDING -> COUNTERED (cascade depth 2)."
      - "If this is the first offer on the case, Case auto-transitions DEMAND_SENT -> IN_NEGOTIATION (cascade depth 2). Increments Case.version by 1."

  - method: GET
    path: "/settlement-offers/{id}"
    description: "Read a settlement offer."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []

  - method: GET
    path: "/settlement-offers"
    description: "List settlement offers with filter."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?", "by_party?", "counter_to_offer_id?"]
    output: SettlementOffer[]
    side_effects: []

  - method: POST
    path: "/settlement-offers/{id}/accept"
    description: "Accept a settlement offer; triggers full Case SETTLED cascade. Requires expected_case_version (OCC)."
    roles: [ManagingPartner]
    code: 200
    input: [expected_case_version]
    output: SettlementOffer
    side_effects:
      - "Offer.status := ACCEPTED; responded_at stamped."
      - "Case auto-transitions to SETTLED with full cascade (gross_settlement stamping, MedicalLien cascade, CourtEvent cancellations, Disbursement creation)."
      - "Increments Case.version by 1."

  - method: POST
    path: "/settlement-offers/{id}/reject"
    description: "Reject a settlement offer (terminal)."
    roles: [ManagingPartner]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []

  # ----- Court events -----
  - method: POST
    path: "/court-events"
    description: "Schedule a court calendar entry."
    roles: [Attorney, ManagingPartner]
    code: 201
    input: [case_id, event_type, scheduled_at, "duration_minutes?"]
    output: CourtEvent
    side_effects: []

  - method: GET
    path: "/court-events/{id}"
    description: "Read a court event."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: CourtEvent
    side_effects: []

  - method: GET
    path: "/court-events"
    description: "List court events with filter."
    roles: [Paralegal, Attorney, ManagingPartner]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?", "event_type?"]
    output: CourtEvent[]
    side_effects: []

  - method: POST
    path: "/court-events/{id}/mark-occurred"
    description: "Move court event SCHEDULED -> OCCURRED (only after scheduled_at clock-passes)."
    roles: [Attorney]
    code: 200
    input: []
    output: CourtEvent
    side_effects: []

  - method: POST
    path: "/court-events/{id}/cancel"
    description: "Move court event SCHEDULED -> CANCELLED."
    roles: [Attorney, ManagingPartner]
    code: 200
    input: []
    output: CourtEvent
    side_effects: []

  # ----- Disbursements -----
  - method: GET
    path: "/disbursements/{id}"
    description: "Read a disbursement."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/disbursements"
    description: "List disbursements with filter."
    roles: [Attorney, ManagingPartner, Paralegal]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?"]
    output: Disbursement[]
    side_effects: []

  - method: POST
    path: "/disbursements/{id}/release"
    description: "Release the pending disbursement (cuts settlement checks). Requires expected_case_version (OCC)."
    roles: [ManagingPartner]
    code: 200
    input: [expected_case_version]
    output: Disbursement
    side_effects:
      - "Disbursement.status := RELEASED."
      - "Every AGREED MedicalLien for this case auto-transitions to PAID (cascade depth 2)."
      - "Case.version += 1."

  # ----- Test-driving endpoints (system clock) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the authoritative system clock to any ISO 8601 timestamp. Also re-evaluates SettlementOffer 30-day expirations under the new clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects:
      - "SystemClock.current_utc := to_iso8601."
      - "Any SettlementOffer with status==PENDING and created_at + 30d <= current_utc transitions to EXPIRED."

  - method: GET
    path: "/_clock"
    description: "Test-driving: read the current authoritative clock."
    roles: [PlatformAdmin, Paralegal, Attorney, ManagingPartner]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - { id: ERR_MISSING_AUTH,                      http: 401, condition: "X-User-Role header absent on a non-public endpoint" }
  - { id: ERR_FORBIDDEN_ROLE,                    http: 403, condition: "X-User-Role not allowed for the endpoint per §1.7" }
  - { id: ERR_RESOURCE_NOT_FOUND,                http: 404, condition: "A path id segment does not resolve to an entity of the expected type" }
  - { id: ERR_FK_NOT_FOUND,                      http: 404, condition: "An FK in the request body does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST,                   http: 400, condition: "Missing required field, bad enum, bad numeric range, or malformed ISO 8601 date" }
  - { id: ERR_INVALID_STATE,                     http: 409, condition: "Target resource not in a state from which the requested transition is permitted" }
  - { id: ERR_CROSS_ENTITY_STATE,                http: 409, condition: "Cross-entity precondition fails (e.g., Case.status not eligible for this child mutation)" }
  - { id: ERR_STATUTE_EXPIRED,                   http: 422, condition: "Statute of Limitations has run for the Case at SystemClock.current_utc (closed boundary at the SOL instant)" }
  - { id: ERR_SEGREGATION_OF_DUTIES,             http: 422, condition: "DemandLetter send attempted by the same X-User-ID that drafted it" }
  - { id: ERR_RETAINER_MISSING,                  http: 422, condition: "Case activation attempted while Client.retainer_signed == false" }
  - { id: ERR_MISSING_MEDICAL_RECORDS,           http: 422, condition: "DamagesItem.MEDICAL_BILLS include attempted before any REVIEWED MedicalRecordsRequest exists on the case" }
  - { id: ERR_DEMAND_PREREQUISITES_NOT_MET,      http: 422, condition: "DemandLetter draft attempted with Case.status != ACTIVE or with no REVIEWED MedicalRecordsRequest on the case" }
  - { id: ERR_EVENT_IN_PAST,                     http: 422, condition: "CourtEvent.scheduled_at <= SystemClock.current_utc at create" }
  - { id: ERR_COURT_EVENT_CONFLICT,              http: 409, condition: "CourtEvent overlaps an existing SCHEDULED event on the same Case once the 24-hour buffer is applied" }
  - { id: ERR_DUPLICATE_RECORDS_REQUEST,         http: 409, condition: "MedicalRecordsRequest already exists for (case_id, provider_id) in status REQUESTED or RECEIVED" }
  - { id: ERR_INVALID_COUNTER,                   http: 422, condition: "SettlementOffer.counter_to_offer_id is non-null but the referenced offer is not PENDING, is on a different case, or has the same by_party" }
  - { id: ERR_DAMAGES_OVER_CAP,                  http: 422, condition: "DamagesItem.amount_cents > jurisdictional cap for category (CA/FL PAIN_SUFFERING capped at $250,000)" }
  - { id: ERR_LIEN_OVERPAYMENT,                  http: 422, condition: "MedicalLien.agree submitted with negotiated_amount_cents > asserted_amount_cents" }
  - { id: ERR_DISPUTED_LIEN_BLOCKS_SETTLEMENT,   http: 422, condition: "SettlementOffer.accept attempted while a MedicalLien on the case is DISPUTED" }
  - { id: ERR_STALE_CASE_VERSION,                http: 412, condition: "expected_case_version != Case.version at moment of write" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: Anonymous
    description: "Unauthenticated client-side actor (only used for /clients/register and read of /_clock)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /clients/register"

  - name: Paralegal
    description: "Performs client intake, records-request workflow, lien tracking, and damages line entry."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/sign-retainer"
      - "POST /cases"
      - "POST /medical-providers"
      - "POST /medical-records-requests"
      - "POST /medical-records-requests/{id}/receive"
      - "POST /medical-records-requests/{id}/reject"
      - "POST /medical-liens"
      - "POST /medical-liens/{id}/negotiate"
      - "POST /medical-liens/{id}/agree"
    shared_operations:
      - "POST /clients/register"
      - "POST /damages-items (with Attorney)"
      - "GET endpoints across the surface"

  - name: Attorney
    description: "Owns case strategy: activates cases, includes/excludes damages, drafts demand letters, makes counter-offers, marks court events occurred, disputes liens."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/activate"
      - "POST /damages-items/{id}/include"
      - "POST /medical-records-requests/{id}/review"
      - "POST /demand-letters"
      - "POST /demand-letters/{id}/acknowledge"
      - "POST /demand-letters/{id}/withdraw"
      - "POST /settlement-offers"  # counters
      - "POST /medical-liens/{id}/dispute"
      - "POST /medical-liens/{id}/resume-negotiation"
      - "POST /court-events/{id}/mark-occurred"
    shared_operations:
      - "POST /cases/{id}/abandon (with ManagingPartner; ManagingPartner required once status==ACTIVE)"
      - "POST /damages-items"
      - "POST /damages-items/{id}/exclude (with ManagingPartner; ManagingPartner required when item was INCLUDED)"
      - "POST /court-events"
      - "POST /court-events/{id}/cancel"
      - "GET endpoints across the surface"

  - name: ManagingPartner
    description: "Final approval authority: sends demand letters, files suit, accepts/rejects settlements, releases disbursements, closes cases. Segregation of duties: cannot send a DemandLetter they drafted."
    identity: "opaque"
    exclusive_operations:
      - "POST /demand-letters/{id}/send"
      - "POST /cases/{id}/file-suit"
      - "POST /cases/{id}/close"
      - "POST /settlement-offers/{id}/accept"
      - "POST /settlement-offers/{id}/reject"
      - "POST /disbursements/{id}/release"
    shared_operations:
      - "POST /cases/{id}/abandon (with Attorney)"
      - "POST /damages-items/{id}/exclude"
      - "POST /court-events"
      - "POST /court-events/{id}/cancel"
      - "GET endpoints across the surface"

  - name: PlatformAdmin
    description: "Operator role for test-driving the system clock. Not a domain actor."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /_clock"
