        grounds:
          - state_machines.Facility.COMMISSIONED_to_SUSPENDED
          - state_machines.Facility.SUSPENDED_to_COMMISSIONED
          - calculations.facility_posture
          - validations[priority=12]
          - errors[ERR_FACILITY_NOT_COMMISSIONED]
          - entities.Permit.fields.status
        distinguishing_aspect: |
          Nothing about the Vehicle changes - only the logical clock moves past a Permit's valid_to.
          The lazy recomputation inside the next request must expire exactly the stale
          TEMP_BUSINESS_LICENSE (leaving the ZONING_USE permit APPROVED), drive the Facility
          COMMISSIONED -> SUSPENDED with posture FROZEN, and answer start-repair with
          ERR_FACILITY_NOT_COMMISSIONED (priority 12) rather than ERR_FACILITY_POSTURE_BLOCKED
