    output: ChargeSchedule[]
    side_effects: []

  - method: GET
    path: "/cooperatives/{cid}/charge-schedules/{csid}"
    description: "Get charge schedule"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: ChargeSchedule
    side_effects: []

  # --- Maintenance charges ---
  - method: GET
    path: "/cooperatives/{cid}/maintenance-charges"
    description: "List charges"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: ["unit_id?", "schedule_id?", "charge_status?", "billing_month?", "limit?", "offset?"]
    output: MaintenanceCharge[]
    side_effects: []

  - method: GET
    path: "/cooperatives/{cid}/maintenance-charges/{mcid}"
    description: "Get charge"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: MaintenanceCharge
    side_effects: []

  - method: POST
    path: "/cooperatives/{cid}/maintenance-charges/{mcid}/payments"
    description: "Post a payment against a charge"
    roles: [ManagingAgent]
    code: 201
    input: [shareholder_id, amount_cents]
    output: Payment
    side_effects:
      - "Payment created in POSTED state"
      - "MaintenanceCharge.paid_cents += amount"
      - "outstanding_cents recomputed; charge_status may transition to PARTIALLY_PAID or PAID"
      - "Shareholder.arrears_balance_cents recomputed"

  - method: POST
    path: "/cooperatives/{cid}/payments/{pid}/void"
    description: "Void a posted payment"
    roles: [ManagingAgent]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "payment_status = VOIDED"
      - "MaintenanceCharge.paid_cents -= amount; status may revert to PARTIALLY_PAID or PAST_DUE"
      - "Shareholder.arrears_balance_cents recomputed"

  - method: GET
    path: "/cooperatives/{cid}/payments/{pid}"
    description: "Get payment"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- Arrears actions ---
  - method: POST
    path: "/cooperatives/{cid}/arrears-actions"
    description: "Issue an arrears action (LATE_NOTICE / DEMAND_LETTER / TERMINATION_NOTICE)"
    roles: [BoardOfficer, ManagingAgent]
    code: 201
    input: [shareholder_id, action_type]
    output: ArrearsAction
    side_effects:
      - "action_status = ISSUED"
      - "cure_deadline computed per action_type"
      - "cure_amount_cents = shareholder.arrears_balance_cents snapshot"
      - "If action_type == TERMINATION_NOTICE: requires shareholder.arrears_balance_cents >= Cooperative.arrears_termination_threshold_cents"

  - method: GET
    path: "/cooperatives/{cid}/arrears-actions"
    description: "List arrears actions"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent]
    code: 200
    input: ["shareholder_id?", "action_type?", "action_status?", "limit?", "offset?"]
    output: ArrearsAction[]
    side_effects: []

  - method: GET
    path: "/cooperatives/{cid}/arrears-actions/{aid}"
    description: "Get arrears action"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent]
    code: 200
    input: []
    output: ArrearsAction
    side_effects: []

  - method: POST
    path: "/cooperatives/{cid}/arrears-actions/{aid}/escalate"
