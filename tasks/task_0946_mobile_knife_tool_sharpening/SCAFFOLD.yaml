  # --- subscriptions --------------------------------------------------------
  - method: POST
    path: "/sharpening/subscriptions"
    description: "Opens a standing-route subscription; grants the first cycle's allowance and computes next_service_date under the ANCHORED variant."
    roles: [AccountOwner]
    code: 201
    input: [account_id, plan_tier_id, cadence, anchor_date]
    output: Subscription
    side_effects:
      - "computes effective_monthly_fee_cents and included_items_this_cycle per calculations.subscription_effective_fee"
      - "appends AllowanceLedgerEntry kind=GRANTED"
      - "computes next_service_date per calculations.next_service_date variant ANCHORED"
  - method: GET
    path: "/sharpening/subscriptions/{id}"
    description: "Reads a subscription including allowance_remaining and next_service_date."
    roles: [PlatformAdmin, AccountOwner, BillingClerk]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/sharpening/subscriptions"
    description: "Lists subscriptions, filterable by account, plan tier and status."
    roles: [PlatformAdmin, AccountOwner, BillingClerk]
    code: 200
    input: ["account_id?", "plan_tier_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/sharpening/subscriptions/{id}/pause"
    description: "Pauses the standing route, expiring the remaining allowance and issuing a proration credit."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "Subscription.status ACTIVE -> PAUSED"
      - "appends AllowanceLedgerEntry kind=EXPIRED and zeroes allowance_remaining"
      - "appends a PRORATION_CREDIT InvoiceLine to the account's DRAFT Invoice per calculations.subscription_proration variant PAUSE_PRORATION"
      - "recomputes that Invoice per calculations.invoice_totals"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/sharpening/subscriptions/{id}/resume"
    description: "Resumes a paused standing route, re-anchoring the cadence series on today."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "Subscription.status PAUSED -> ACTIVE"
      - "re-anchors anchor_date, opens the next cycle and appends AllowanceLedgerEntry kind=GRANTED"
      - "computes next_service_date per calculations.next_service_date variant RE_ANCHORED"
  - method: POST
    path: "/sharpening/subscriptions/{id}/cadence"
    description: "Changes the standing-route cadence; OCC-guarded on the subscription's version."
    roles: [AccountOwner]
    code: 200
    input: [cadence, expected_subscription_version]
    output: Subscription
    side_effects:
      - "recomputes effective_monthly_fee_cents and included_items_this_cycle"
      - "appends AllowanceLedgerEntry kind=GRANTED or kind=EXPIRED for the allowance difference"
      - "appends a PRORATION_CREDIT InvoiceLine per calculations.subscription_proration variant CADENCE_CHANGE_PRORATION"
      - "computes next_service_date per calculations.next_service_date variant RE_ANCHORED"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/sharpening/subscriptions/{id}/skip"
    description: "Customer-initiated skip of the next standing visit; refused once the skip window has closed."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "advances next_service_date by one cadence interval and increments skip_count_this_cycle"
      - "sets any SCHEDULED RouteStop on the skipped date to SKIPPED and returns its ServiceRequest to SUBMITTED"
  - method: POST
    path: "/sharpening/subscriptions/{id}/cancel"
    description: "Cancels the subscription; terminal."
    roles: [AccountOwner]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "expires any remaining allowance and clears next_service_date"
  - method: POST
    path: "/sharpening/subscriptions/{id}/advance-cycle"
    description: "Closes the current subscription cycle and opens the next one; unused allowance expires because ALLOWANCE_ROLLOVER_ENABLED is false."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "appends AllowanceLedgerEntry kind=EXPIRED then kind=GRANTED"
      - "increments cycle_index and rolls cycle_start_date forward"
  - method: GET
    path: "/sharpening/allowance-entries/{id}"
    description: "Reads a single allowance ledger entry."
    roles: [PlatformAdmin, BillingClerk]
    code: 200
    input: []
    output: AllowanceLedgerEntry
    side_effects: []
  - method: GET
    path: "/sharpening/allowance-entries"
    description: "Lists allowance ledger entries; the ledger a cycle's balance is audited from."
    roles: [PlatformAdmin, BillingClerk, AccountOwner]
    code: 200
    input: ["subscription_id?", "request_item_id?", "cycle_index?", "kind?", "limit?", "offset?"]
    output: AllowanceLedgerEntry[]
    side_effects: []

  # --- route runs and stops -------------------------------------------------
  - method: POST
    path: "/sharpening/route-runs"
    description: "Plans a van run for a date and zone."
    roles: [Dispatcher]
    code: 201
    input: [van_id, technician_id, run_date, zone_code, "service_minute_budget?", "stop_cap?", "day_window_start?", "day_window_end?"]
    output: RouteRun
    side_effects:
      - "copies the van's defaults when the budget or cap is omitted"
  - method: GET
    path: "/sharpening/route-runs/{id}"
    description: "Reads a run including booked_service_minutes, committed_minutes_provisional and committed_minutes_final."
    roles: [Dispatcher, PlatformAdmin, Technician]
    code: 200
    input: []
    output: RouteRun
    side_effects: []
  - method: GET
    path: "/sharpening/route-runs"
    description: "Lists runs, filterable by van, technician, date, zone and status."
    roles: [Dispatcher, PlatformAdmin, Technician]
    code: 200
    input: ["van_id?", "technician_id?", "run_date?", "zone_code?", "status?", "limit?", "offset?"]
    output: RouteRun[]
    side_effects: []
  - method: POST
    path: "/sharpening/route-runs/{id}/stops"
    description: "Adds a stop for a SUBMITTED service request to a PLANNED run; OCC-guarded on the run's version and feasibility-checked against the stop cap and the service-minute budget."
    roles: [Dispatcher]
    code: 201
    input: [service_request_id, sequence, arrival_window_start, expected_route_run_version]
    output: RouteStop
    side_effects:
      - "ServiceRequest.status SUBMITTED -> SCHEDULED"
      - "recomputes RouteRun.booked_service_minutes, scheduled_stop_count and committed_minutes_provisional per calculations.run_committed_minutes variant PROVISIONAL"
      - "increments RouteRun.version by 1"
  - method: GET
    path: "/sharpening/route-stops/{id}"
    description: "Reads a stop."
    roles: [Dispatcher, PlatformAdmin, Technician]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/sharpening/route-stops"
    description: "Lists stops, filterable by run, request, account, spill origin and status."
    roles: [Dispatcher, PlatformAdmin, Technician]
    code: 200
    input: ["route_run_id?", "service_request_id?", "account_id?", "spilled_from_route_run_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: DELETE
    path: "/sharpening/route-stops/{id}"
    description: "Removes a SCHEDULED stop from a PLANNED run and gives its minutes back."
    roles: [Dispatcher]
    code: 204
    input: []
    output: null
    side_effects:
      - "ServiceRequest.status SCHEDULED -> SUBMITTED"
      - "recomputes RouteRun.booked_service_minutes, scheduled_stop_count and committed_minutes_provisional"
      - "increments RouteRun.version by 1"
  - method: POST
    path: "/sharpening/route-stops/{id}/spill"
    description: "Spills a SCHEDULED stop off its run; the stop keeps its row and waits in SPILLED for a reschedule."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "RouteStop.status SCHEDULED -> SPILLED, spill_hop_count += 1, spilled_from_route_run_id set"
      - "ServiceRequest.status SCHEDULED -> SUBMITTED"
      - "recomputes the source run's booked_service_minutes, scheduled_stop_count and committed_minutes_provisional"
  - method: POST
    path: "/sharpening/route-stops/{id}/reschedule"
    description: "Moves a SPILLED stop onto the run chosen by calculations.next_eligible_run_selector and re-books its minutes there."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "RouteStop.status SPILLED -> SCHEDULED and route_run_id re-pointed at the selected run"
      - "assigns a new sequence and arrival_window_start on the receiving run"
      - "ServiceRequest.status SUBMITTED -> SCHEDULED"
      - "recomputes the receiving run's booked_service_minutes, scheduled_stop_count and committed_minutes_provisional"
  - method: POST
    path: "/sharpening/route-stops/{id}/arrive"
    description: "The technician marks arrival at a stop."
    roles: [Technician]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "RouteStop.status SCHEDULED -> ARRIVED"
      - "RouteRun.status DISPATCHED -> IN_PROGRESS on the first arrival of the run"
  - method: POST
    path: "/sharpening/route-runs/{id}/dispatch"
    description: "Dispatches a planned run, recomputing minutes under the DISPATCH_FINAL variant and spilling the tail stops that no longer fit."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteRun
    side_effects:
      - "RouteRun.status PLANNED -> DISPATCHED"
      - "computes committed_minutes_final per calculations.run_committed_minutes variant DISPATCH_FINAL"
      - "spills the greatest-sequence SCHEDULED stop repeatedly until committed_minutes_final <= service_minute_budget"
  - method: POST
    path: "/sharpening/route-runs/{id}/complete"
    description: "Closes an in-progress run once no stop is still SCHEDULED or ARRIVED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteRun
    side_effects:
      - "RouteRun.status IN_PROGRESS -> COMPLETED"
  - method: POST
    path: "/sharpening/route-runs/{id}/cancel"
    description: "Cancels a planned run and returns every scheduled request to SUBMITTED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteRun
    side_effects:
      - "RouteRun.status PLANNED -> CANCELLED"
      - "every SCHEDULED RouteStop -> CANCELLED and its ServiceRequest SCHEDULED -> SUBMITTED"

  # --- service requests and items -------------------------------------------
  - method: POST
    path: "/sharpening/service-requests"
    description: "Opens a service request in DRAFT for one of the three intake channels."
    roles: [AccountOwner]
    code: 201
    input: [account_id, channel, requested_date, "subscription_id?", "priority?", "locker_site_code?", "locker_high_value_authorized?"]
    output: ServiceRequest
    side_effects:
      - "sets status DRAFT and billing_status UNBILLED"
  - method: GET
    path: "/sharpening/service-requests/{id}"
    description: "Reads a request on both of its axes."
    roles: [AccountOwner, Dispatcher, Technician, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/sharpening/service-requests"
    description: "Lists requests, filterable by account, subscription, originating claim, channel and both status axes."
    roles: [AccountOwner, Dispatcher, Technician, BillingClerk, PlatformAdmin]
    code: 200
    input: ["account_id?", "subscription_id?", "origin_warranty_claim_id?", "channel?", "status?", "billing_status?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []
  - method: POST
    path: "/sharpening/service-requests/{id}/items"
    description: "Adds one physical item to a DRAFT request and prices it under the QUOTED variant."
    roles: [AccountOwner]
    code: 201
    input: [item_class_spec_id, item_class, declared_damage_tier]
    output: RequestItem
    side_effects:
      - "computes quoted_gross_cents and final_gross_cents per calculations.item_service_price variant QUOTED"
      - "computes service_minutes_declared per calculations.item_service_minutes variant DECLARED"
      - "recomputes ServiceRequest.item_count and quoted_total_cents"
  - method: GET
    path: "/sharpening/request-items/{id}"
    description: "Reads an item on both of its axes."
    roles: [AccountOwner, Technician, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: RequestItem
    side_effects: []
  - method: GET
    path: "/sharpening/request-items"
    description: "Lists items, filterable by request, spec, bench day, rework origin, assessing technician, custody and work status."
    roles: [AccountOwner, Technician, BillingClerk, PlatformAdmin]
    code: 200
    input: ["service_request_id?", "item_class_spec_id?", "bench_day_id?", "rework_of_request_item_id?", "assessed_by_technician_id?", "custody_location?", "service_status?", "limit?", "offset?"]
    output: RequestItem[]
    side_effects: []
  - method: POST
    path: "/sharpening/service-requests/{id}/submit"
    description: "Submits a DRAFT request for scheduling."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ServiceRequest
    side_effects:
      - "ServiceRequest.status DRAFT -> SUBMITTED"
  - method: POST
    path: "/sharpening/service-requests/{id}/cancel"
    description: "Cancels a request that has not yet entered service, releasing any stop or locker reservation."
    roles: [AccountOwner]
    code: 200
    input: []
    output: ServiceRequest
    side_effects:
      - "ServiceRequest.status -> CANCELLED"
      - "any SCHEDULED RouteStop -> SKIPPED with its minutes released"
      - "any ASSIGNED LockerCompartment -> AVAILABLE with last_released_at stamped"
  - method: POST
    path: "/sharpening/service-requests/{id}/pickup"
    description: "The technician collects the items at an ARRIVED stop."
    roles: [Technician]
    code: 200
    input: []
    output: ServiceRequest
    side_effects:
      - "ServiceRequest.status SCHEDULED -> IN_SERVICE"
      - "every RequestItem custody_location CUSTOMER -> VAN"
      - "RouteStop.status ARRIVED -> SERVICED"
  - method: POST
    path: "/sharpening/service-requests/{id}/bench-intake"
    description: "Books the request's items onto a shop bench day; the same bench pool serves van-route and locker intake."
    roles: [Technician]
    code: 200
    input: [bench_day_id]
    output: ServiceRequest
    side_effects:
      - "every RequestItem custody_location VAN or LOCKER -> BENCH and bench_day_id set"
      - "adds the declared minutes to BenchDay.booked_minutes per calculations.bench_minutes_booked"
      - "a LOCKER-channel request's compartment goes OCCUPIED -> ASSIGNED"
  - method: POST
    path: "/sharpening/service-requests/{id}/deliver"
    description: "Closes the request; the side-effect set forks on the intake channel."
    roles: [Technician]
    code: 200
    input: []
    output: ServiceRequest
    side_effects:
      - "ServiceRequest.status IN_SERVICE -> COMPLETED and completed_at stamped"
      - "every DONE RequestItem -> DELIVERED"
      - "channel VAN_ROUTE or REWORK: custody BENCH -> DELIVERED, delivered_at stamped, the request's OPEN LoanerIssue closes and the loaner inspection chain runs"
      - "channel LOCKER: custody BENCH -> LOCKER, the compartment goes ASSIGNED -> OCCUPIED and hold_expires_at is reset"
      - "releases the items' minutes from BenchDay.booked_minutes"
  - method: POST
    path: "/sharpening/service-requests/{id}/locker-assign"
    description: "Assigns the smallest fitting AVAILABLE compartment at the request's site per calculations.compartment_assignment_selector and mints its access code."
    roles: [AccountOwner]
    code: 200
    input: []
    output: LockerCompartment
    side_effects:
      - "LockerCompartment.status AVAILABLE -> ASSIGNED with access_code and hold_expires_at set"
  - method: POST
    path: "/sharpening/request-items/{id}/assess"
    description: "Records the damage tier the technician actually found, re-pricing the line under the FINAL variant."
    roles: [Technician]
    code: 200
    input: [assessed_damage_tier]
    output: RequestItem
    side_effects:
      - "RequestItem.service_status INTAKE_PENDING -> ASSESSED"
      - "recomputes final_gross_cents, part_fee_cents and service_minutes_assessed"
      - "sets requires_reauthorization and authorization_status per calculations.item_reauthorization_required"
      - "adjusts BenchDay.booked_minutes by the minute delta"
  - method: POST
    path: "/sharpening/request-items/{id}/authorize"
    description: "The customer authorizes a re-priced line so work may start."
    roles: [AccountOwner]
    code: 200
    input: []
    output: RequestItem
    side_effects:
      - "authorization_status PENDING -> AUTHORIZED"
  - method: POST
    path: "/sharpening/request-items/{id}/decline"
    description: "The customer refuses the re-priced line; the item is returned unserviced and any allowance it consumed is restored."
    roles: [AccountOwner]
    code: 200
    input: []
    output: RequestItem
    side_effects:
      - "authorization_status PENDING -> DECLINED and service_status ASSESSED -> RETURNED_UNSERVICED"
      - "zeroes charged_service_cents and part_fee_cents and releases the item's bench minutes"
      - "appends AllowanceLedgerEntry kind=RESTORED when the item had consumed allowance"
  - method: POST
    path: "/sharpening/request-items/{id}/start-work"
    description: "Starts work on an assessed, authorized item held on the bench."
    roles: [Technician]
    code: 200
    input: []
    output: RequestItem
    side_effects:
      - "RequestItem.service_status ASSESSED -> IN_WORK"
  - method: POST
    path: "/sharpening/request-items/{id}/complete-work"
    description: "Marks the item finished on the bench."
    roles: [Technician]
    code: 200
    input: []
    output: RequestItem
    side_effects:
      - "RequestItem.service_status IN_WORK -> DONE"

  # --- lockers --------------------------------------------------------------
  - method: GET
    path: "/sharpening/locker-compartments/{id}"
    description: "Reads a compartment including its access code, hold expiry and stored value."
    roles: [PlatformAdmin, AccountOwner, Technician]
    code: 200
    input: []
    output: LockerCompartment
    side_effects: []
  - method: GET
    path: "/sharpening/locker-compartments"
    description: "Lists compartments, filterable by site, size, status and holding request."
    roles: [PlatformAdmin, AccountOwner, Technician]
    code: 200
    input: ["site_code?", "size?", "status?", "current_service_request_id?", "limit?", "offset?"]
    output: LockerCompartment[]
    side_effects: []
  - method: POST
    path: "/sharpening/locker-compartments/{id}/deposit"
    description: "The customer drops the items into the assigned compartment using the access code."
    roles: [AccountOwner]
    code: 200
    input: [access_code]
    output: LockerCompartment
    side_effects:
      - "LockerCompartment.status ASSIGNED -> OCCUPIED"
      - "every RequestItem custody_location CUSTOMER -> LOCKER"
      - "ServiceRequest.status SUBMITTED -> IN_SERVICE"
      - "recomputes stored_item_count and stored_value_cents"
  - method: POST
    path: "/sharpening/locker-compartments/{id}/release"
    description: "The customer claims the finished items, freeing the compartment."
    roles: [AccountOwner]
    code: 200
    input: [access_code]
    output: LockerCompartment
    side_effects:
      - "LockerCompartment.status OCCUPIED -> AVAILABLE, access_code cleared, last_released_at stamped"
      - "every RequestItem custody_location LOCKER -> DELIVERED with delivered_at stamped"
      - "closes the request's OPEN LoanerIssue and runs the loaner inspection chain"
  - method: POST
    path: "/sharpening/locker-compartments/{id}/expire-hold"
    description: "Marks an unclaimed compartment as past its hold window."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LockerCompartment
    side_effects:
      - "LockerCompartment.status OCCUPIED -> HOLD_EXPIRED and access_code cleared"
  - method: POST
    path: "/sharpening/locker-compartments/{id}/abandon"
    description: "Dispositions the contents of a compartment left unclaimed past the abandonment grace."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LockerCompartment
    side_effects:
      - "LockerCompartment.status HOLD_EXPIRED -> AVAILABLE with last_released_at stamped"
      - "every RequestItem custody_location LOCKER -> ABANDONED and service_status -> ABANDONED"

