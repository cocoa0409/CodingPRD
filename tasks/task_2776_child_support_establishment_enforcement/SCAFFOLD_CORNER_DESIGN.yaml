      - name: segregation_of_duties_compares_user_ids_not_roles
        claim_type: segregation_of_duties
        grounds:
          - "roles.SupervisingAttorney.note"
          - "validations[priority 13]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "entities.SupportOrder.fields.drafted_by_user_id"
          - "entities.EnforcementAction.fields.proposed_by_user_id"
          - "state_machines.EnforcementAction.CONTESTED -> ACTIVE"
        distinguishing_aspect: >
          The same X-User-ID is presented twice under two DIFFERENT roles and is
          refused both times: user-sod-1 drafts the calculation as a CaseWorker and
          is then refused the deviation findings as a SupervisingAttorney, and user-
          sod-3 proposes the enforcement action as a CaseWorker and is then refused
          the contest review. So the rule is a user-identity comparison against a
          stored actor id, not a role check - swapping to a second user id under the
          same role lets both requests through untouched.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD, so guideline_monthly_cents is 75000 and the smallest legal deviation is 7500."
            - "guideline-calculation is posted by user-sod-1, stamping drafted_by_user_id."
            - "A deviation of 67500 is requested (exactly 10% below the guideline) and left PENDING_DEVIATION_FINDINGS."
            - "After entry at 67500 an ARREARS_JUDGMENT charge of 150000 is posted, so a CREDIT_BUREAU_REPORT clears both its 100000 threshold and the 2 * 67500 == 135000 second gate with zero interest at 2026-08-01."
            - "CONTEST_WINDOW_DAYS is 30, so the contest at 2026-08-01 is inside the window."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Georgiana Petrov", ssn_last4: "6256", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpr3: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Lazar Petrov", ssn_last4: "6257", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpr3: "$.data.id" }
            - call: "POST /child-support/participants/${ncpr3}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpr3}", noncustodial_party_id: "${ncpr3}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { caser3: "$.data.id" }
            - call: "POST /child-support/cases/${caser3}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${caser3}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderr3: "$.data.id" }
            - call: "POST /child-support/orders/${orderr3}/guideline-calculation"
              payload: {}
              as: CaseWorker
              as_user_id: "user-sod-1"
              captures: { gr3: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${orderr3}/deviation-request"
              payload: { deviation_requested_cents: 67500, deviation_reason: "HARDSHIP" }
              as: CaseWorker
              as_user_id: "user-sod-1"
              captures: { dev_st: "$.data.status" }
          trigger:
            - call: "POST /child-support/orders/${orderr3}/deviation-findings"
