          assert:
            - "tw == 30000 after the third add (== cap allowed)"
            - "err == ERR_TOTE_WEIGHT_EXCEEDED for the 30001st gram"

      - name: reservation_consume_hold_until_time_boundary
        grounds:
          - calculations.slot_hold_window
          - entities.SlotReservation.fields.hold_until
        distinguishing_aspect: |
          Metric time on POST /v1/slot-reservations/{id}/consume: at hold_until - 1s
          the consume succeeds; at exactly hold_until the reservation is treated as
          expired (half-open [hold_start, hold_until)) -> ERR_RESERVATION_EXPIRED.
        test_recipe:
          setup:
            - "Plan boxless true; merchant; cycle; shopper; LOCKER location LT with two XL slots S1/S2"
            - "Orders O1/O2 LOCKER_QR; reservations R1 on S1 and R2 on S2 both created at 2026-05-01T00:00:00Z (hold_until 2026-05-03T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
