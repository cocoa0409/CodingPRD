            - "Caregiver cgA with SCHEDULED day shifts 2026-06-02T13:00Z-2026-06-03T05:00Z and 2026-06-03T13:00Z-2026-06-04T05:00Z (16h each, touching not overlapping, rolling-24h exactly 16)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
