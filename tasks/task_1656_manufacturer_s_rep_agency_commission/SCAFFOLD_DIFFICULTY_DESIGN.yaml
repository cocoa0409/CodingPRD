              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Gate" }
              as: Rep
              as_user_id: "${r1}"
              captures: { reg1: $.data.id, reg_st: $.data.status }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-EARLY", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { oearly: $.data.id }
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-LATE", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { olate: $.data.id }
          assert:
            - "registration was SUBMITTED when PO-EARLY was created: Order.${oearly} splits are SPECIFY ${r1} 6000 + SHIP_TO ${r2} 4000 and protected_registration_id is null"
            - "after approval, Order.${olate} splits are a single REGISTERED row ${r1} 10000 and protected_registration_id == ${reg1}"
            - "no retroactivity: Order.${oearly} splits remain SPECIFY/SHIP_TO after the approval"

      - name: registration_approval_requires_active_agreement
        grounds:
          - state_machines.ProjectRegistration.SUBMITTED_to_APPROVED
          - state_machines.TerritoryAgreement.SUSPENDED_to_ACTIVE
          - state_machines.TerritoryAgreement.ACTIVE_to_SUSPENDED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair = ProjectRegistration x TerritoryAgreement (different pair
          from Order x ProjectRegistration). Approve is gated on the principal's
          agreement being ACTIVE: SUSPENDED blocks with ERR_AGREEMENT_NOT_ACTIVE;
          reactivating the agreement unblocks the same approve call.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
