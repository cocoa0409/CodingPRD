scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_pricing_provisional_vs_final_member_discount
        grounds:
          - calculations.price_monthly_subscription
          - entities.Subscription.fields.monthly_price_cents
          - entities.Invoice.fields.provisional_total_due_cents
        distinguishing_aspect: |
          Same pricing inputs produce two different prices depending on variant:
          final variant (used at subscription activation) applies tier multiplier
          AND member discount; provisional variant (used on draft invoice preview)
          applies tier multiplier but omits member discount AND member credit.
        test_recipe:
          setup:
            - "Package P with base_monthly_fee_cents=100000, media_rights=TEXT_AND_PHOTO"
            - "Tier T with min_audience=10000, max_audience=100000, circulation_multiplier_basis_points=15000, monthly_republish_quota=10, overage_per_article_cents=250, member_discount_pct=20"
            - "Member subscriber S with declared_audience=50000, is_member=true"
            - "Subscription SUB in DRAFT for package P, start_at=2026-05-10T00:00:00Z"
            - "Logical clock set to 2026-05-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "NAT", display_name: "National", media_rights: "TEXT_AND_PHOTO", base_monthly_fee_cents: 100000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "METRO", min_audience: 10000, max_audience: 100000, circulation_multiplier_basis_points: 15000, monthly_republish_quota: 10, overage_per_article_cents: 250, member_discount_pct: 20 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Metro Daily", billing_email: "b@m.com", declared_audience: 50000, is_member: true }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/invoices"
              payload: { billing_month: "2026-05" }
              as: Billing
              captures: { inv_id: $.data.id }
          assert:
            - "Subscription.${subp_id}.monthly_price_cents == 120000"
            - "Invoice.${inv_id}.provisional_total_due_cents == 150000"
            - "Invoice.${inv_id}.base_fee_cents == 120000"
            - "Invoice.${inv_id}.provisional_total_due_cents != Invoice.${inv_id}.base_fee_cents"

      - name: member_credit_grant_piecewise_vs_flat_counterfactual
        grounds:
          - calculations.member_credit_grant
          - entities.Article.fields.member_credit_cents
        distinguishing_aspect: |
          Piecewise formula (word-bracket base plus per-asset bonuses) diverges
          from a flat per-article credit: an article at 1000 words with 2 PHOTO +
          1 VIDEO yields 16000 under the piecewise formula, whereas a flat
          1000-cents-per-article rule would yield 1000. Domain differs from
          instance 1 (Article credit vs Subscription pricing).
        test_recipe:
          setup:
            - "Feed F (NATIONAL, embargo_window_minutes=0) LIVE"
            - "Member subscriber S with is_member=true"
            - "Article A on feed F, body_word_count=1000, contributing_member_subscriber_id=S"
            - "Two PHOTO assets + one VIDEO asset attached to A"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "NAT", topic: "NATIONAL", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Member Pub", billing_email: "m@m.com", declared_audience: 5000, is_member: true }
              as: SalesOps
              captures: { sub_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "Story", body_word_count: 1000, slug: "story-1", contributing_member_subscriber_id: "${sub_id}" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/assets"
              payload: { kind: "PHOTO", rights_scope: "WIRE", file_ref: "p1.jpg" }
              as: Editor
            - call: "POST /wire/articles/${art_id}/assets"
              payload: { kind: "PHOTO", rights_scope: "WIRE", file_ref: "p2.jpg" }
              as: Editor
            - call: "POST /wire/articles/${art_id}/assets"
              payload: { kind: "VIDEO", rights_scope: "WIRE", file_ref: "v1.mp4" }
              as: Editor
          trigger:
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
          assert:
            - "Article.${art_id}.member_credit_cents == 16000"
            - "Article.${art_id}.member_credit_cents != 1000"
            - "Subscriber.${sub_id}.member_credit_balance_cents == 16000"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_formula_tiered_with_member_discount_mode_a
        grounds:
          - calculations.price_monthly_subscription
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (base, multiplier_bp, member_discount_pct,
          is_member) with non-linear interaction (conditional branch on is_member,
          tiered multiplier selection, basis-points scaling). Instance 2 is mode (b).
        test_recipe:
          setup:
            - "Package base=100000, tier multiplier=12000 bp, member_discount_pct=25, quota=5, overage=300"
            - "Subscriber declared_audience=20000, is_member=true"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P1", display_name: "P1", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 100000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T1", min_audience: 10000, max_audience: 50000, circulation_multiplier_basis_points: 12000, monthly_republish_quota: 5, overage_per_article_cents: 300, member_discount_pct: 25 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "X", billing_email: "x@x.com", declared_audience: 20000, is_member: true }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          assert:
            - "Subscription.${subp_id}.monthly_price_cents == 90000"

      - name: invoice_aggregation_rounding_order_mode_b
        grounds:
          - calculations.compute_overage_cents
          - calculations.member_credit_apply_to_invoice
        distinguishing_aspect: |
          Mode (b): nested rounding order matters — overage is summed from
          individual Publication.billed_amount_cents (each already rounded to
          integer cents at republication time) rather than re-computed from a
          formula at invoice-issue time; then member_credit is applied AFTER
          the overage sum is finalized. Mode differs from instance 1 (mode a).
        test_recipe:
          setup:
            - "Package base=50000, tier quota=2, overage=250, multiplier=10000 bp, member_discount_pct=0"
            - "Subscriber declared_audience=5000 (non-member, no discount)"
            - "ACTIVE subscription with 4 RECORDED publications in 2026-05"
            - "Subscriber member_credit_balance_cents = 1000 (from prior credit grant)"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P2", display_name: "P2", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T2", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 2, overage_per_article_cents: 250, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F2", topic: "SPORTS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Y", billing_email: "y@y.com", declared_audience: 5000, is_member: false }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-01T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A1", body_word_count: 300, slug: "a1" }
              as: Editor
              captures: { a1: $.data.id }
            - call: "POST /wire/articles/${a1}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A2", body_word_count: 300, slug: "a2" }
              as: Editor
              captures: { a2: $.data.id }
            - call: "POST /wire/articles/${a2}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A3", body_word_count: 300, slug: "a3" }
              as: Editor
              captures: { a3: $.data.id }
            - call: "POST /wire/articles/${a3}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A4", body_word_count: 300, slug: "a4" }
              as: Editor
              captures: { a4: $.data.id }
            - call: "POST /wire/articles/${a4}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a1}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a2}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a3}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a4}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/subscriptions/${subp_id}/invoices"
              payload: { billing_month: "2026-05" }
              as: Billing
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /wire/invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          assert:
            - "Invoice.${inv_id}.base_fee_cents == 50000"
            - "Invoice.${inv_id}.overage_cents == 500"
            - "Invoice.${inv_id}.total_due_cents == 50500"
            - "Invoice.${inv_id}.member_credit_applied_cents == 0"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: article_withdraw_republish_cycle
        grounds:
          - state_machines.Article.PUBLISHED_to_WITHDRAWN
          - state_machines.Article.WITHDRAWN_to_PUBLISHED
        distinguishing_aspect: |
          Article supports PUBLISHED → WITHDRAWN → PUBLISHED (cyclic loop) with
          embargo recomputed on each re-entry. Subscription (instance 2) has a
          different non-linear shape (branching SUSPENDED→ACTIVE reinstatement).
        test_recipe:
          setup:
            - "Feed F LIVE with embargo_window_minutes=60"
            - "Article A on F published (status=PUBLISHED, embargo_status=EMBARGOED)"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "NAT", topic: "NATIONAL", embargo_window_minutes: 60 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "X", body_word_count: 500, slug: "x1" }
              as: Editor
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
              captures: { art_v2: $.data.version }
            - call: "POST /wire/articles/${art_id}/withdraw"
              payload: {}
              as: Editor
          trigger:
            - call: "POST /wire/articles/${art_id}/republish"
              payload: { expected_article_version: "${art_v2}" }
              as: Editor
          assert:
            - "Article.${art_id}.status == PUBLISHED"
            - "Article.${art_id}.embargo_status == EMBARGOED"
            - "Article.${art_id}.version > ${art_v2}"

      - name: subscription_active_suspended_active_branching
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Subscription is branching with revert (ACTIVE→SUSPENDED→ACTIVE) where
          the SUSPENDED→ACTIVE path does NOT restore entitlements — side effects
          differ per branch direction, distinct from Article's cyclic shape.
        test_recipe:
          setup:
            - "Subscriber S ACTIVE; Subscription SUB ACTIVE with one LIVE entitlement"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P3", display_name: "P3", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T3", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F3", topic: "WORLD", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Z", billing_email: "z@z.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
              captures: { ent_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/suspend"
              payload: {}
              as: SalesOps
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/reinstate"
              payload: {}
              as: SalesOps
          assert:
            - "Subscription.${subp_id}.status == ACTIVE"
            - "Entitlement.${ent_id}.status == REVOKED"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: subscriber_suspend_cascades_to_subscriptions_then_entitlements
        grounds:
          - state_machines.Subscriber.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Entitlement.LIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-3 chain: Subscriber suspend (trigger 1) → Subscription flip →
          Entitlement revoke. Each link caused by the previous, not parallel
          fan-out. Trigger differs from instance 2 (article takedown).
        test_recipe:
          setup:
            - "Subscriber S ACTIVE with subscription SUB ACTIVE and entitlement E LIVE"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P4", display_name: "P4", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T4", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F4", topic: "BUSINESS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "W", billing_email: "w@w.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /wire/subscribers/${sub_id}/suspend"
              payload: {}
              as: SalesOps
          assert:
            - "Subscriber.${sub_id}.status == SUSPENDED"
            - "Subscription.${subp_id}.status == SUSPENDED"
            - "Entitlement.${ent_id}.status == REVOKED"

      - name: article_takedown_cascades_to_assets_and_publications_then_credit_debit
        grounds:
          - state_machines.Article.PUBLISHED_to_TAKEN_DOWN
          - entities.Asset.fields.status
          - entities.Publication.fields.status
        distinguishing_aspect: |
          Depth-2+ chain: Article takedown (trigger 2) → Asset flip AND
          Publication flip; Publication flip causes Auditor-facing flag;
          contributing member credit debit is triggered by takedown itself.
          Different trigger from instance 1.
        test_recipe:
          setup:
            - "Member subscriber S with member_credit_balance_cents > 0 from prior published article"
            - "Article A published with contributing_member_subscriber_id=S and 2 PHOTO assets"
            - "Publication Pub recorded against A by S's active subscription"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P5", display_name: "P5", media_rights: "TEXT_AND_PHOTO", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T5", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F5", topic: "FEATURES", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "M", billing_email: "m@m.com", declared_audience: 5000, is_member: true }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "H", body_word_count: 1000, slug: "h1", contributing_member_subscriber_id: "${sub_id}" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/assets"
              payload: { kind: "PHOTO", rights_scope: "WIRE", file_ref: "ph1.jpg" }
              as: Editor
              captures: { asset1_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/assets"
              payload: { kind: "PHOTO", rights_scope: "WIRE", file_ref: "ph2.jpg" }
              as: Editor
              captures: { asset2_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${art_id}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /wire/articles/${art_id}/takedown"
              payload: {}
              as: Legal
          assert:
            - "Article.${art_id}.status == TAKEN_DOWN"
            - "Asset.${asset1_id}.status == TAKEN_DOWN"
            - "Asset.${asset2_id}.status == TAKEN_DOWN"
            - "Publication.${pub_id}.status == AUDIT_FLAGGED"
            - "Subscriber.${sub_id}.member_credit_balance_cents == 0"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_priority_on_republication
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair: state (priority 4) vs business_temporal (priority 5). Article
          is WITHDRAWN (fails state) AND embargo not yet lifted (would fail
          temporal). Expect ERR_INVALID_STATE because 4 < 5. Pair differs from
          instance 2 (referential vs constraint).
        test_recipe:
          setup:
            - "Subscriber S with ACTIVE subscription SUB and LIVE entitlement to feed F"
            - "Article A published on F then withdrawn (status=WITHDRAWN)"
