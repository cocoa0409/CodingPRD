      - name: corner_documentation_rule_uniqueness_and_grace_days_phase_coupling
        claim_type: conditional_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_DOCUMENTATION_RULE_CONFLICT]
          - endpoints[POST /audit-programs/{id}/documentation-rules]
        distinguishing_aspect: "The triple (program_id, relationship_type, phase) is unique and grace_days is present if and only if phase is POINT_OF_ENROLLMENT: a duplicate SPOUSE/AUDIT rule, an AUDIT rule carrying grace_days and a POINT_OF_ENROLLMENT rule omitting grace_days all return 409 ERR_DOCUMENTATION_RULE_CONFLICT, while the same relationship type in the other phase with grace_days is accepted."
        test_recipe:
          setup:
            - "Program P is DRAFT and already carries one SPOUSE AUDIT rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: true }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
          trigger:
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["JOINT_TAX_RETURN"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, grace_days: 30, auto_terminate_on_lapse: false }
              as: ProgramAdmin
              captures: { err_grace_on_audit: "$.data.error_id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "POINT_OF_ENROLLMENT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: true }
              as: ProgramAdmin
              captures: { err_poe_without_grace: "$.data.error_id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "POINT_OF_ENROLLMENT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, grace_days: 30, auto_terminate_on_lapse: true }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}/documentation-rules"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 409 and response data.error_id == ERR_DOCUMENTATION_RULE_CONFLICT"
            - "Second call: HTTP status == 409 and response data.error_id == ERR_DOCUMENTATION_RULE_CONFLICT"
            - "Third call: HTTP status == 409 and response data.error_id == ERR_DOCUMENTATION_RULE_CONFLICT"
            - "Fourth call: HTTP status == 201, response data.phase == POINT_OF_ENROLLMENT, response data.grace_days == 30, response data.auto_terminate_on_lapse == true"
            - "Fifth call: total_count == 2 (the original SPOUSE AUDIT rule and the new SPOUSE POINT_OF_ENROLLMENT rule)"

