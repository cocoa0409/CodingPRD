            - "LeaseYear 1 holds a single ACCEPTED September report at 30,000,000 gross, which billed round_half_up((30000000 - 3333333) * 600 / 10000) = 1600000."
            - "The year has been closed for reconciliation and reconciled, producing true_up_delta_cents -1600000 and a DRAFT CREDIT charge."
