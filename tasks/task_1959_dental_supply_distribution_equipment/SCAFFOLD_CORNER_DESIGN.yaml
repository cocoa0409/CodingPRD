  - section: endpoints
    instances:
      - name: response_envelope_object_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Single-resource responses carry meta.api_request_id, meta.api_request_timestamp, response_type == 'object', and the entity under data."
        test_recipe:
          setup: ["Practice P created"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Env", region: "R1", credit_limit_cents: 100000 }, as: DistributionAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { rid: $.data.id } }
          assert:
            - "Response has meta.api_request_id and meta.api_request_timestamp populated"
            - "response_type == 'object' and data.id == ${p}"

      - name: orders_list_filter_and_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, "endpoints[0]"]
        distinguishing_aspect: "GET /api/orders?practice_id=A returns only A's orders with pagination defaults limit 10 / offset 0 and correct total_count / has_more."
        test_recipe:
          setup: ["Practices PA and PB; product C; two DRAFT orders for PA and one for PB"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "PA", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/practices", payload: { name: "PB", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-21", name: "Cups", kind: "CONSUMABLE", unit_price_cents: 500, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pa}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep }
            - { call: "POST /api/orders", payload: { practice_id: "${pa}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 2 } ] }, as: SalesRep }
            - { call: "POST /api/orders", payload: { practice_id: "${pb}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 3 } ] }, as: SalesRep }
          trigger:
            - { call: "GET /api/orders?practice_id=${pa}", payload: {}, as: DistributionAdmin, captures: { first_pid: "$.data[0].practice_id" } }
          assert:
            - "response_type == 'array'; pagination fields present with limit == 10, offset == 0, total_count == 2, has_more == false"
            - "Every returned order has practice_id == ${pa} (PB's order excluded)"

