# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Quick Lube & Oil Change — breadth probe over §1.1–§1.7 claims not covered by §1.8.
# Walks references/claim-extraction-guide.md section-by-section.
# All formula-derived asserts are pre-computed literals (integer cents,
# round_half_up, tax_rate 0.0825).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_shop_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Shop"
          - "endpoints"
        distinguishing_aspect: "POST /shops with required fields returns 201; status defaults OPEN, open_bay_count 0, max_discount_pct defaults 0.50, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; Shop.status == OPEN; Shop.open_bay_count == 0; Shop.max_discount_pct == 0.50; Shop.version == 1"

      - name: create_work_order_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.WorkOrder"
          - "validations[priority=1]"
        distinguishing_aspect: "POST /work-orders missing package_id (required input) returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["Shop + bay + vehicle exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINREQ001", plate: "REQ1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", odometer_in: 1000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION (package_id missing)"

      - name: get_work_order_non_existent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.WorkOrder"
          - "errors[ERR_WORK_ORDER_NOT_FOUND]"
        distinguishing_aspect: "GET /work-orders/{bogus-uuid} returns ERR_WORK_ORDER_NOT_FOUND 404."
        test_recipe:
          setup: ["A shop exists; the queried id is a random UUID with no row."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_WORK_ORDER_NOT_FOUND"

      - name: vehicle_computed_service_due_false_without_history
        claim_type: Computed Fields
        grounds:
          - "entities.Vehicle.fields.service_due"
          - "entities.Vehicle.fields.next_service_odometer"
        distinguishing_aspect: "A freshly-registered vehicle has next_service_* null and service_due == false (no COMPLETED order)."
        test_recipe:
          setup: ["Shop + vehicle registered, no work orders."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINNEW001", plate: "NEW1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: ServiceAdvisor
              captures: { due: $.data.service_due, nso: $.data.next_service_odometer }
          assert:
            - "Vehicle.${veh_id}.service_due == false; next_service_odometer == null; last_service_date == null"

      - name: duplicate_vin_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Vehicle.fields.vin"
          - "errors[ERR_DUPLICATE_VIN]"
        distinguishing_aspect: "Registering a second vehicle with the same vin on the same shop returns ERR_DUPLICATE_VIN 409."
        test_recipe:
          setup: ["Shop with one vehicle VINDUP001 registered."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINDUP001", plate: "DUP1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINDUP001", plate: "DUP2", make: "Honda", model: "Jazz", odometer: 2000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_DUPLICATE_VIN"

      - name: service_package_invalid_enum_oil_grade_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.ServicePackage.fields.oil_grade"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /service-packages with oil_grade not in the enum set returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["Shop exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "BIODIESEL", name: "Bad", base_price_cents: 5000, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION (oil_grade not in enum)"

      - name: service_sticker_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.ServiceSticker"
        distinguishing_aspect: "ServiceSticker is common_fields:false (id + created_at only); it is produced only by /complete and never has an update endpoint or version field."
        test_recipe:
          setup: ["A COMPLETED order produced a sticker."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINSTK002", plate: "STK2", make: "Honda", model: "Fit", odometer: 30000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 30000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "CASH" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/capture-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "GET /work-orders/${wo_id}/sticker"
              payload: {}
              as: ServiceAdvisor
              captures: { sid: "$.data[0].id" }
          assert:
            - "GET returns a ServiceSticker[] of length 1; the sticker has id and created_at but no version field"
            - "ServiceSticker[0].next_service_odometer == 35000; basis == MILEAGE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.WorkOrder.READY_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling /complete on a DRAFT order (service_status not READY) returns ERR_INVALID_STATE 409; no side effects fire."
        test_recipe:
          setup: ["A DRAFT work order exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VININS001", plate: "INS1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 1000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; WorkOrder.${wo_id}.service_status still DRAFT"

      - name: terminal_completed_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.WorkOrder.READY_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From terminal COMPLETED, /cancel is rejected with ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A COMPLETED work order exists (paid, completed)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINTRM001", plate: "TRM1", make: "Honda", model: "Fit", odometer: 30000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 30000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "CASH" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/capture-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; service_status remains COMPLETED"

      - name: capture_before_authorize_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.WorkOrder.AUTHORIZED_to_PAID"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "capture-payment while payment_status==UNPAID returns ERR_INVALID_STATE 409 (idempotency/ordering on the payment dimension)."
        test_recipe:
          setup: ["A READY order that has NOT been authorized."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINCAP001", plate: "CAP1", make: "Honda", model: "Fit", odometer: 5000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 5000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/capture-payment"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (payment_status was UNPAID, not AUTHORIZED)"

      - name: close_occupied_bay_returns_bay_occupied
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Bay.OPEN_to_CLOSED"
          - "errors[ERR_BAY_OCCUPIED]"
        distinguishing_aspect: "POST /bays/{id}/close on an OCCUPIED bay returns ERR_BAY_OCCUPIED 409."
        test_recipe:
          setup: ["A bay made OCCUPIED by a direct work order."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINBOC001", plate: "BOC1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 1000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /bays/${bay_id}/close"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_BAY_OCCUPIED; Bay.${bay_id}.status remains OCCUPIED"

      - name: close_fleet_account_with_open_balance_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.FleetAccount.transitions"
          - "errors[ERR_FLEET_HAS_OPEN_BALANCE]"
        distinguishing_aspect: "POST /fleet-accounts/{id}/close while reserved_credit_cents>0 (an AUTHORIZED fleet order outstanding) returns ERR_FLEET_HAS_OPEN_BALANCE 409."
        test_recipe:
          setup: ["Fleet account with one AUTHORIZED fleet order (reserved_credit 6814)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { shop_id: "${shop_id}", company_name: "Acme", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VINFCB001", plate: "FCB1", make: "Ford", model: "F150", odometer: 6000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 6000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "FLEET_ACCOUNT" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /fleet-accounts/${fleet_id}/close"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_FLEET_HAS_OPEN_BALANCE; FleetAccount.${fleet_id}.status remains ACTIVE"

      - name: fleet_suspend_reactivate_reprices_draft_orders
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.FleetAccount.ACTIVE_to_SUSPENDED"
          - "state_machines.FleetAccount.SUSPENDED_to_ACTIVE"
          - "calculations.work_order_total"
        distinguishing_aspect: "Suspending a fleet account zeroes fleet_discount_cents on its DRAFT orders (total rises); reactivating restores the discount (total falls back)."
        test_recipe:
          setup: ["Fleet vehicle with a DRAFT order priced with 10% fleet discount; package 6995 only."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
