              payload: { task_type: "LICENSING", cost_cents: 9000, window_start: "2026-01-06T12:00:00Z", window_end: "2026-01-06T13:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_c_lic: $.data.id }
          trigger:
            - call: "POST /fleet/vehicles/${veh_c}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-07T08:00:00Z", window_end: "2026-01-07T10:00:00Z", bay_code: "B3" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { sequence_error: $.data.error_id }
            - call: "POST /fleet/in-fleeting-tasks/${t_c_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_c}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-07T08:00:00Z", window_end: "2026-01-07T10:00:00Z", bay_code: "B3" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { capacity_error: $.data.error_id }
          assert:
            - "before the triggers: two PENDING PREPARATION tasks exist on 2026-01-07 at ATL, exactly matching prep_capacity_per_day 2, and InFleetingTask.${t_c_lic}.status == \"PENDING\""
            - "the first trigger call returns HTTP 422 with error_id ERR_PREP_BEFORE_REGISTRATION, NOT ERR_PREP_CAPACITY_EXCEEDED, because priority 15 outranks priority 22"
            - "both candidate errors carry HTTP 422, so only the error_id distinguishes the two orderings"
            - "after ${t_c_lic} is completed the identical request returns HTTP 422 with error_id ERR_PREP_CAPACITY_EXCEEDED, proving the capacity violation was present in the first call too"
            - "GET /fleet/in-fleeting-tasks?vehicle_id=${veh_c}&task_type=PREPARATION returns total_count 0, so neither refusal created a partial task"
            - "the bay B3 requested by both refused calls never conflicted, so ERR_PREP_BAY_CONFLICT is never the answer here"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: plan_posture_flips_frozen_at_fill_ratio_exactly_ten_thousand_bp
        grounds:
          - entities.FleetPlan.fields.posture
          - validations[priority 25 ERR_PLAN_POSTURE_RESTRICTED]
          - validations[priority 26 ERR_PLAN_POSTURE_FROZEN]
          - endpoints[POST /fleet/fleet-plans/{plan_id}/allocations]
        distinguishing_aspect: |
          This is the INTEGER BASIS-POINT boundary on a derived enum: fill_ratio_bp is
          floor(allocated * 10000 / planned), and the two thresholds are 9000 and 10000
          with the FROZEN side inclusive. The instance walks 8000 -> 9000 -> 10000 on one
          plan, so the exact-equality case is observed rather than inferred, and it adds a
          3-unit plan where 2 allocated units pin the truncation direction: floor gives
          6666 while round-half-up would give 6667.
        test_recipe:
          setup:
            - "Plan P10 for ATL PEAK 2026 has planned_unit_count 10 and is LOCKED, so posture starts at OPEN with fill_ratio_bp 0."
            - "Plan P3 for ATL SHOULDER 2026 has planned_unit_count 3 and is LOCKED, and receives a single 2-unit allocation to expose the truncation direction."
            - "Every allocation call refreshes FleetPlan.version first, because each allocation write bumps it."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_ten: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_ten}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { ten_v1: $.data.version }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "SHOULDER", plan_year: 2026, planned_unit_count: 3, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_three: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_three}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { three_v1: $.data.version }
          trigger:
            - call: "POST /fleet/fleet-plans/${plan_ten}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 8, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${ten_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "GET /fleet/fleet-plans/${plan_ten}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { ten_v2: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_ten}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${ten_v2}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "GET /fleet/fleet-plans/${plan_ten}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { ten_v3: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_ten}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${ten_v3}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "GET /fleet/fleet-plans/${plan_ten}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { ten_v4: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_three}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 2, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${three_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "GET /fleet/fleet-plans/${plan_three}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
          assert:
            - "after 8 of 10 units: FleetPlan.${plan_ten}.fill_ratio_bp == 8000 and posture == \"OPEN\", one basis point band below the RESTRICTED threshold"
            - "after 9 of 10 units: FleetPlan.${plan_ten}.fill_ratio_bp == 9000 and posture == \"RESTRICTED\", so 9000 is inclusive on the RESTRICTED side"
            - "the 9th unit was accepted even though the plan was already RESTRICTED-adjacent, because 9 <= planned_unit_count 10"
            - "after 10 of 10 units: FleetPlan.${plan_ten}.fill_ratio_bp == 10000 and posture == \"FROZEN\", so exact equality freezes the plan"
            - "GET /fleet/fleet-plans/${plan_ten}/performance reports the same posture \"FROZEN\", so the computed read and the stored field agree"
            - "for the 3-unit plan: FleetPlan.${plan_three}.fill_ratio_bp == 6666 and posture == \"OPEN\", proving floor truncation - round-half-up would give 6667"
            - "each allocation write advanced FleetPlan.version by exactly 1, so ${ten_v4} == ${ten_v1} + 3"

      - name: channel_pool_empties_one_kilometre_past_hard_mileage_band
        grounds:
          - calculations.remarketing_channel_selection
          - entities.VehicleSegment.fields.mileage_band_hard_limit_km
          - validations[priority 24 ERR_NO_ELIGIBLE_CHANNEL]
          - endpoints[GET /fleet/vehicles/{vehicle_id}/channel-recommendation]
        distinguishing_aspect: |
          Where the posture instance walks a derived integer ratio, this one walks a raw
          odometer reading across an EXCLUSIVE upper band on a RISK vehicle whose only
          other channel is structurally ineligible. At exactly 60000 km the pool holds one
          channel and returns a concrete 1704401 cent projection; one kilometre later the
          same read is a 422. The boundary therefore changes the SHAPE of the response,
          not just a number.
        test_recipe:
          setup:
            - "Only two channels exist: RETAIL_LOT (recondition_required true, multiplier 1.08, fee 0.03 + 60000) and PROGRAM_REPURCHASE (multiplier 1.00, no fee)."
            - "The vehicle sits under a RISK program, so PROGRAM_REPURCHASE can never be a candidate no matter the mileage."
            - "MIDSIZE mileage_band_hard_limit_km is 60000 and the exclusion is `odometer_km > hard_limit`, so 60000 is still eligible."
            - "in_service_at is 2026-01-15T00:00:00Z and the reads happen at 2026-09-15T00:00:00Z, giving holding_days 243 and holding_months 8."
            - "At odometer 60000 the policy schedule gives 2800000 - 336000 - 720000 = 1744000, above the 980000 floor."
